title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1661/1999 of 27 July 1999 laying down detailed
    rules for the application of Council Regulation (EEC) No 737/90 on the conditions
    governing imports of agricultural products originating in third countries following
    the accident at the Chernobyl nuclear power-station
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1661/1999 de la Commission, du 27 juillet 1999, portant
    modalités d'application du règlement (CEE) nº 737/90 du Conseil relatif aux
    conditions d'importation de produits agricoles originaires des pays tiers à la
    suite de l'accident survenu à la centrale nucléaire de Tchernobyl
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1661/1999 der Kommission vom 27. Juli 1999 zur Festlegung
    der Durchführungsbestimmungen der Verordnung (EWG) Nr. 737/90 des Rates über
    die Einfuhrbedingungen für landwirtschaftliche Erzeugnisse mit Ursprung in Drittländern
    nach dem Unfall im Kernkraftwerk Tschernobyl
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1661/1999 ze dne 27. července 1999, kterým
