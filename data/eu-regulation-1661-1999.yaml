    par nosacījumiem, kas reglamentē trešo valstu izcelsmes lauksaimniecības produktu
    importu pēc avārijas Černobiļas atomelektrostacijā
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 27 d. Komisijos reglamentas (EB) Nr. 1661/1999, nustatantis
