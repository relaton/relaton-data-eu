    med oprindelse i tredjelande som følge af ulykken på kernekraftværket i Tjernobyl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1661/1999 της Επιτροπής,
    της 27ης Ιουλίου 1999, για τη θέσπιση λεπτομερών
    κανόνων εφαρμογής του κανονισμού (ΕΟΚ) αριθ.
    737/90 του Συμβουλίου σχετικά με τους όρους εισαγωγής
    γεωργικών προϊόντων καταγωγής τρίτων χωρών
    μετά το ατύχημα στον πυρηνικό σταθμό του Τσερνομπίλ
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1661/1999, 27. juuli 1999, millega kehtestatakse
