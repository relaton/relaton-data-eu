    ja -toodete imporditingimuste kohta pärast Tšernobõli tuumaelektrijaama avariid)
    üksikasjalikud rakenduseeskirjad
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1661/1999, annettu 27 päivänä heinäkuuta
    1999, yksityiskohtaisista säännöistä kolmansista maista peräisin olevien
    maataloustuotteiden tuontiedellytyksistä Tsernobylin ydinvoimalaonnettomuuden
    jälkeen annetun neuvoston asetuksen (ETY) N:o 737/90 soveltamiseksi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1661/1999/EK rendelete (1999. július 27.) a harmadik országokból
    származó mezőgazdasági termékek behozatalára a csernobili atomerőműben
    történt balesetet követően irányadó feltételekről szóló 737/90/EGK tanácsi
    rendelet alkalmazására vonatkozó részletes szabályok megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1661/1999 della Commissione, del 27 luglio 1999, che
    determina le modalità di applicazione del regolamento (CEE) n. 737/90 del Consiglio
    relativo alle condizioni d'importazione di prodotti agricoli originari di paesi
    terzi a seguito dell'incidente verificatosi nella centrale di Cernobil
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1661/1999 (1999. gada 27. jūlijs), ar kuru paredz
