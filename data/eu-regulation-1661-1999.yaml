    šalių kilmės žemės ūkio produktų importui po Černobylio atominės elektrinės
    avarijos, taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1661/1999 tas-27 ta' Lulju 1999
    li jistabbilixxi regoli dettaljati għall-applikazzjoni tar-Regolament tal-Kunsill
    (KEE) Nru 737/90 dwar il-kondizzjonijiet li jirregolaw l-importazzjoni ta' prodotti
    agrikoli li jorġinaw minn pajjiżi terzi wara l-inċident ta' l-istazzjon nuklejari
    ta' Chernobyl
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1661/1999 van de Commissie van 27 juli 1999 houdende
    uitvoeringsbepalingen van Verordening (EEG) nr. 737/90 van de Raad betreffende
    de voorwaarden voor de invoer van landbouwproducten van oorsprong uit derde landen
    ingevolge het ongeluk in de kerncentrale van Tsjernobyl
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1661/1999 z dnia 27 lipca 1999 r. ustanawiające
    szczegółowe zasady stosowania rozporządzenia Rady (EWG) nr 737/90 w sprawie
    zasad regulujących przywóz produktów rolnych pochodzących z państw trzecich
    w następstwie wypadku w elektrowni jądrowej w Czarnobylu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1661/1999 da Comissão, de 27 de Julho de 1999, que
    estabelece as regras de execução do Regulamento (CEE) n° 737/90 do Conselho
    relativo às condições de importação de produtos agrícolas originários de
    países terceiros na sequência do acidente ocorrido na central nuclear de Chernobil
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1661/1999 z 27. júla 1999, ktorým sa ustanovujú
    podrobné pravidlá uplatňovania nariadenia Rady (EHS) č. 737/90 o podmienkach
    upravujúcich dovoz poľnohospodárskych výrobkov pochádzajúcich z tretích
    krajín po havárii v černobyľskej jadrovej elektrárni
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1661/1999 z dne 27. julija 1999 o podrobnih pravilih
    za uporabo Uredbe Sveta (EGS) št. 737/90 o pogojih, ki urejajo uvoz kmetijskih
    proizvodov, ki izvirajo iz tretjih držav po nesreči v jedrski elektrarni Černobil
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1661/1999 de la Comisión, de 27 de julio de 1999,
