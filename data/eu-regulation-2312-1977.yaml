title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2312/77 of 20 October 1977 re-establishing
    the levying of customs duties on electronic calculating machines falling within
    subheading 84.52 A, originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2312/77 de la Commission, du 20 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à calculer électroniques, de la sous-position tarifaire 84.52 A, originaires
    de Singapour bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2312/77 der Kommission vom 20. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für elektronische Rechenmaschinen der Tarifstelle 84.52 A mit
    Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2312/77 af 20. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for elektroniske regnemaskiner, under underposition
    84.52 A, som har oprindelse i Singapore og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2312/77 della Commissione, del 20 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine calcolatrici
    elettroniche della sottovoce doganale 84.52 A originarie di Singapore, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2312/77 van de Commissie van 20 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektronische
    rekenmachines van post 84.52 A, van oorsprong uit Singapore, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
