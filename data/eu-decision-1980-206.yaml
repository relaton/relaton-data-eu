title:
- language: en
  script: Latn
  content: '80/206/EEC: Commission Decision of 25 January 1980 establishing that the
    conditions rquired for the admission free of Common Customs Tariff duties of the
    scientific apparatus described as ''Spectraphonics-Speech Spectrographic Display
    Unit, model SSD 11'' , are fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/206/CEE: Décision de la Commission, du 25 janvier 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Spectraphonics - Speech
    Spectrographic Display Unit, model SSD 11" sont remplies'
  type: main
- language: de
  script: Latn
  content: '80/206/EWG: Entscheidung der Kommission vom 25. Januar 1980, mit der festgestellt
    wird, daß die Voraussetzungen für die Befreiung des wissenschaftlichen Geräts
    ,,SPECTRAPHONICS-Speech Spectrographic Display Unit, model SSD 11'' '' von den
    Zöllen des Gemeinsamen Zolltarifs erfüllt sind'
  type: main
- language: da
  script: Latn
  content: '80/206/EØF: Kommissionens beslutning af 25. januar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "SPECTRAPHONICS - Speech Spectrographic Display
    Unit, model SSD 11" er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/206/ΕΟΚ: Απόφαση τής Επιτροπής τής 25ης
