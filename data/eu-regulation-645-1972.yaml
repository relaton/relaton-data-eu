  content: Règlement (CEE) n° 645/72 de la Commission, du 29 mars 1972, dérogeant,
    pour les organes de la variété sanguinello, au règlement (CEE) n° 193/70 établissant
    les modalités d'application des mesures visant à promouvoir la commercialisation
    des oranges et mandarines communautaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 645/72 der Kommission vom 29. März 1972 betreffend
    die Abweichung für Apfelsinen der Sorte Sanguinello der Verordnung (EWG) Nr.
    193/70 mit Durchführungsbestimmungen für die Maßnahmen zur Förderung der Vermarktung
    von Apfelsinen und Mandarine 1 aus der Gemeinschaftserzeugung
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 645/72 della Commissione, del 29 marzo 1972, che deroga,
    per le arance della varietà « Sanguinello », al regolamento (CEE) n. 193/70
    della Commissione che stabilisce le modalità d'applicazione delle misure volte
    a promuovere la commercializzazione delle arance e mandarini comunitari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 645/72 van de Commissie van 29 maart 1972 houdende
    afwijking, voor de sinaasappelen van de variëteit Sanguinello, van Verordening
    (EEG) nr. 193/70 houdende vaststelling van uitvoeringsbepalingen voor de maatregelen
    tot bevordering van de afzet van sinaasappelen en mandarijnen uit de Gemeenschap
  type: main
