title:
- language: fr
  script: Latn
  content: Décision 66/349/CEE de la Commission, du 18 mai 1966, portant prorogation
    de la durée de validité et augmentation du volume du contingent tarifaire octroyé
    à la République fédérale d'Allemagne pour les fils de bourre de soie (schappe)
    non conditionnés pour la vente au détail
  type: main
- language: de
  script: Latn
  content: '66/349/EWG: Entscheidung der Kommission vom 18. Mai 1966 betreffend die
    Verlängerung der Geltungsdauer und die Erhöhung der Menge des der Bundesrepublik
    Deutschland für Schappeseidengarne, nicht in Aufmachungen für den Einzelverkauf,
    gewährten Zollkontingents'
  type: main
- language: it
  script: Latn
  content: '66/349/CEE: Decisione della Commissione, del 18 maggio 1966, che proroga
    la validità e aumenta il volume del contingente tariffario concesso alla Repubblica
    federale di Germania per i filati di borra di seta (schappe) non preparati per
    la vendita al minuto'
  type: main
- language: nl
  script: Latn
  content: '66/349/EEG: Beschikking van de Commissie van 18 mei 1966 houdende verlenging
    van de periode van geldigheid en vergroting van het aan de Bondsrepubliek Duitsland
    toegekende tariefcontingent voor garens van vlokzijde (schappe), niet gereed voor
    de verkoop in het klein'
  type: main
