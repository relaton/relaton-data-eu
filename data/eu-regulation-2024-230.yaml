---
id: EURegulation2024230
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/230 of 25 October 2023 amending
    Delegated Regulation (EU) 2021/1342 as regards the information to be sent by third
    countries and by control authorities and control bodies for the purpose of supervision
    of their recognition under Article 33(2) and (3) of Council Regulation (EC) No
    834/2007 and the measures to be taken in the exercise of that supervision
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/230 de la Commission du 25 octobre 2023
    modifiant le règlement délégué (UE) 2021/1342 en ce qui concerne les informations
    à transmettre par les pays tiers et par les autorités et organismes de contrôle
    aux fins de la supervision de leur reconnaissance au titre de l’article 33,
    paragraphes 2 et 3, du règlement (CE) no 834/2007 du Conseil, ainsi que les mesures
    à prendre dans le cadre de cette supervision
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/230 der Kommission vom 25. Oktober 2023
    zur Änderung der Delegierten Verordnung (EU) 2021/1342 hinsichtlich der Informationen,
    die von Drittländern sowie von Kontrollbehörden und Kontrollstellen zwecks Überwachung
    ihrer Anerkennung gemäß Artikel 33 Absätze 2 und 3 der Verordnung (EG) Nr.
    834/2007 des Rates zu übermitteln sind, sowie der Maßnahmen, die zur Ausübung
    dieser Überwachung zu ergreifen sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/230 на Комисията
    от 25 октомври 2023 година за изменение на Делегиран
    регламент (ЕС) 2021/1342 по отношение на информацията,
    която трябва да се изпраща от третите държави,
    както и от контролните и надзорните органи,
    за целите на надзора над тяхното признаване
    съгласно член 33, параграфи 2 и 3 от Регламент
    (ЕО) № 834/2007 на Съвета, и на мерките, които трябва
    да се предприемат при упражняването на този
    надзор
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/230 ze dne 25. října
    2023, kterým se mění nařízení Komise v přenesené pravomoci (EU) 2021/1342,
    pokud jde o informace, které mají být zasílány třetími zeměmi a kontrolními
    orgány a kontrolními subjekty pro účely dohledu nad jejich uznáním podle
    čl. 33 odst. 2 a 3 nařízení Rady (ES) č. 834/2007 a o opatření, jež mají
    být přijata při výkonu tohoto dohledu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/230 af 25. oktober 2023 om
    ændring af delegerede forordning (EU) 2021/1342 for så vidt angår de oplysninger,
    som tredjelande og kontrolmyndigheder og kontrolorganer skal fremsende med henblik
    på tilsyn med deres anerkendelse i henhold til artikel 33, stk. 2 og 3, i Rådets
    forordning (EF) nr. 834/2007 samt vedrørende de foranstaltninger, der skal træffes
    ved udøvelsen af dette tilsyn
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2024/230
    της Επιτροπής, της 25ης Οκτωβρίου 2023, για την
    τροποποίηση του κατ’ εξουσιοδότηση κανονισμού
    (ΕΕ) 2021/1342 σχετικά με τις πληροφορίες που πρέπει
    να αποστέλλονται από τρίτες χώρες και από αρχές
    ελέγχου και φορείς ελέγχου για τους σκοπούς
    της εποπτείας της αναγνώρισής τους σύμφωνα
    με το άρθρο 33 παράγραφοι 2 και 3 του κανονισμού
    (ΕΚ) αριθ. 834/2007 του Συμβουλίου και με τα μέτρα
    που πρέπει να λαμβάνονται κατά την άσκηση της
    εν λόγω εποπτείας
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2024/230, 25. oktoober 2023, millega
    muudetakse delegeeritud määrust (EL) 2021/1342 teabe osas, mida kolmandad riigid
    ning kontrolliasutused ja kontrollorganid peavad nõukogu määruse (EÜ) nr 834/2007
    artikli 33 lõigete 2 ja 3 kohaselt saatma nende tunnustuse üle tehtavaks järelevalveks,
    ning sellise järelevalve tegemiseks võetavate meetmete osas
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2024/230, annettu 25 päivänä lokakuuta
    2023, komission delegoidun asetuksen (EU) 2021/1342 muuttamisesta niiden tietojen
    osalta, jotka kolmansien maiden sekä valvontaviranomaisten ja tarkastuslaitosten
    on toimitettava niille neuvoston asetuksen (EY) N:o 834/2007 33 artiklan 2 ja
    3 kohdan nojalla annetun hyväksynnän valvontaa varten, sekä valvontaa varten
    toteutettavien toimenpiteiden osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2024/230 ón gCoimisiún an 25 Deireadh Fómhair
    2023 lena leasaítear Rialachán Tarmligthe (AE) 2021/1342 ón gCoimisiún a mhéid
    a bhaineann leis an bhfaisnéis atá le seoladh ag tríú tíortha agus ag údaráis
    rialaithe agus ag comhlachtaí rialaithe chun críche maoirseachta ar a n-aitheantas
    faoi Airteagal 33(2) agus (3) de Rialachán (CE) Uimh. 834/2007 ón gComhairle
    agus na bearta atá le déanamh i bhfeidhmiú na maoirseachta sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/230 оd 25. listopada 2023. o izmjeni
    Delegirane uredbe (EU) 2021/1342 u pogledu informacija koje treće zemlje te kontrolna
    tijela i kontrolne ustanove trebaju slati u svrhu nadzora njihova priznavanja
    na temelju članka 33. stavaka 2. i 3. Uredbe Vijeća (EZ) br. 834/2007 te mjerama
    koje treba poduzeti u provedbi tog nadzora
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/230 felhatalmazáson alapuló rendelete (2023. október
    25.) az (EU) 2021/1342 felhatalmazáson alapuló rendeletnek az ökológiai termékek
    behozatalával kapcsolatos, a 834/2007/EK tanácsi rendelet 33. cikkének (2)
    és (3) bekezdése szerinti elismerés felügyelete érdekében a harmadik országok,
    ellenőrző hatóságok és ellenőrző szervek által megosztandó információk,
    valamint az e felügyelet gyakorlása során hozandó intézkedések tekintetében
    való módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/230 della Commissione, del 25 ottobre 2023,
    che modifica il regolamento delegato (UE) 2021/1342 della Commissione per quanto
    riguarda le informazioni che devono essere trasmesse dai paesi terzi e dalle autorità
    e organismi di controllo ai fini della supervisione del loro riconoscimento a
    norma dell’articolo 33, paragrafi 2 e 3, del regolamento (CE) n. 834/2007 del
    Consiglio e alle misure da adottare nell’esercizio di tale supervisione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/230 (2023. gada 25. oktobris), ar
    ko Deleģēto regulu (ES) 2021/1342 groza attiecībā uz informāciju, kura trešām
    valstīm, kā arī kontroles iestādēm un kontroles institūcijām jāiesūta,
    lai būtu iespējams uzraudzīt to atzīšanu, kas piešķirta saskaņā ar Padomes
    Regulas (EK) Nr. 834/2007 33. panta 2. un 3. punktu, un groza arī attiecībā
    uz minētās uzraudzības īstenošanā veicamajiem pasākumiem
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 25 d. Komisijos deleguotasis reglamentas (ES) 2024/230,
    kuriuo dėl informacijos, kurią trečiosios valstybės ir kontrolės institucijos
    bei kontrolės įstaigos turi siųsti jų pripažinimo priežiūros tikslais pagal
    Tarybos reglamento (EB) Nr. 834/2007 33 straipsnio 2 ir 3 dalis ir kuri susijusi
    su priemonėmis, kurių turi būti imamasi vykdant tą priežiūrą, iš dalies
    keičiamas Komisijos deleguotasis reglamentas (ES) 2021/1342
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/230 tal-25 ta’ Ottubru 2023
    li jemenda r-Regolament Delegat (UE) 2021/1342 fir-rigward tal-informazzjoni li
    għandha tintbagħat mill-pajjiżi terzi kif ukoll mill-awtoritajiet ta’ kontroll
    u mill-korpi ta’ kontroll għall-fini tas-superviżjoni tar-rikonoxximent tagħhom
    skont l-Artikolu 33(2) u (3) tar-Regolament tal-Kunsill (KE) Nru 834/2007 u l-miżuri
    li għandhom jittieħdu fl-eżerċitar ta’ dik is-superviżjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/230 van de Commissie van 25 oktober
    2023 tot wijziging van Gedelegeerde Verordening (EU) 2021/1342 van de Commissie
    ten aanzien van de informatie die door derde landen en door controleautoriteiten
    en controleorganen moet worden verzonden met het oog op het toezicht op hun erkenning
    uit hoofde van artikel 33, leden 2 en 3, van Verordening (EG) nr. 834/2007 van
    de Raad en de maatregelen die bij de uitoefening van dat toezicht moeten worden
    genomen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/230 z dnia 25 października
    2023 r. zmieniające rozporządzenie delegowane (UE) 2021/1342 w odniesieniu do
    informacji, które mają być przekazywane przez państwa trzecie oraz organy
    kontrolne i jednostki certyfikujące do celów nadzoru nad ich uznawaniem na mocy
    art. 33 ust. 2 i 3 rozporządzenia Rady (WE) nr 834/2007, oraz środków, jakie
    należy przyjąć w ramach sprawowania tego nadzoru
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/230 da Comissão, de 25 de outubro de 2023,
    que altera o Regulamento Delegado (UE) 2021/1342 da Comissão no respeitante às
    informações a enviar pelos países terceiros e pelas autoridades e organismos
    de controlo para efeitos da supervisão do seu reconhecimento ao abrigo do artigo
    33.o, n.os 2 e 3, do Regulamento (CE) n.o 834/2007 do Conselho e às medidas a
    tomar no exercício dessa supervisão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/230 al Comisiei din 25 octombrie 2023 de
    modificare a Regulamentului delegat (UE) 2021/1342 în ceea ce privește informațiile
    care trebuie trimise de țările terțe și de autoritățile de control și organismele
    de control în scopul supravegherii recunoașterii acestora în temeiul articolului
    33 alineatele (2) și (3) din Regulamentul (CE) nr. 834/2007 al Consiliului, precum
    și în ceea ce privește măsurile care urmează să fie luate în cadrul exercitării
    supravegherii respective
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/230 z 25. októbra 2023, ktorým
    sa mení delegované nariadenie (EÚ) 2021/1342, pokiaľ ide o informácie, ktoré
    majú zasielať tretie krajiny a štátne inšpekčné organizácie a súkromné
    inšpekčné organizácie na účely dohľadu nad ich uznaním podľa článku
    33 ods. 2 a 3 nariadenia Rady (ES) č. 834/2007, a opatrenia, ktoré sa majú
    prijať pri výkone uvedeného dohľadu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/230 z dne 25. oktobra 2023 o spremembi
    Delegirane uredbe (EU) 2021/1342 glede informacij, ki jih morajo poslati tretje
    države ter nadzorni organi in izvajalci nadzora za nadzor priznanja iz člena
    33(2) in (3) Uredbe Sveta (ES) št. 834/2007, ter ukrepov, ki jih je treba sprejeti
    pri izvajanju navedenega nadzora
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/230 de la Comisión, de 25 de octubre de
    2023, por el que se modifica el Reglamento Delegado (UE) 2021/1342 de la Comisión
    en lo referente a la información que deben enviar los terceros países y las
    autoridades y organismos de control a efectos de la supervisión de su reconocimiento,
    de conformidad con el artículo 33, apartados 2 y 3, del Reglamento (CE) n.o 834/2007
    del Consejo, y a las medidas que deben adoptarse en el ejercicio de esa supervisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/230 av den 25 oktober 2023
    om ändring av delegerad förordning (EU) 2021/1342 vad gäller den information
    som ska sändas av tredjeländer och av kontrollmyndigheter och kontrollorgan
    för tillsynen av deras erkännande enligt artikel 33.2 och 33.3 i rådets förordning
    (EG) nr 834/2007 och de åtgärder som ska vidtas vid utövandet av denna tillsyn
  type: main
