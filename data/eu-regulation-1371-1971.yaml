  content: Règlement (CEE) n° 1371/71 de la Commission, du 30 juin 1971, relatif
    à la définition de la notion de produits originaires pour l'application des
    préférences tarifaires octroyées par la Communauté économique européenne
    à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1371/71 der Kommission vom 30. Juni 1971 über die
    Begriffsbestimmung des Warenursprungs bei der Anwendung der von der Europäischen
    Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern gewährten
    Zollpräferenzen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1371/71 della Commissione, del 30 giugno 1971, relativo
