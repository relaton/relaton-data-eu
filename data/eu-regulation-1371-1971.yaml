    preferenze tariffarie accordate dalla Comunità economica europea a taluni prodotti
    di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1371/71 van de Commissie van 30 juni 1971 betreffende
    de definitie van het begrip "produkten van oorsprong" voor de toepassing van tariefprodukten
    die door de Europese Economische Gemeenschap voor bepaalde produkten uit ontwikkelingslanden
    worden verleend
