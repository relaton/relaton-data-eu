  script: Latn
  content: '96/266/EC: Commission Decision of 1 April 1996 recognizing in principle
    the completeness of the dossier submitted for detailed examination in view of
    the possible inclusion of kresoxim methyl in Annex I of Council Directive 91/414/EEC
    concerning the placing of plant protection products on the market'
  type: main
- language: fr
  script: Latn
