schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1565/80 of 23 June 1980 re-establishing
    the levying of customs duties on woven labels, chenille yarn, tulle and embroidery,
    products of category 62 (code 0620), originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1565/80 de la Commission, du 23 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux étiquettes,
    fils de chenille, tulles et broderies, de la catégorie 62 (code 0620), originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1565/80 der Kommission vom 23. Juni 1980 über die
    Wiedereinführung des Zollsatzes für Etiketten, Chenillegarne, Tülle und Stickereien
    der Warenkategorie Nr. 62 (Kennziffer 0620), mit Ursprung in Jugoslawien, dem
    die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1565/80 af 23. juni 1980 om genindførelse
    af opkrævning af toldafgifter for vævede etiketter, chenillegarn, tyl og motiver,
    under kategori 62 (kode 0620), som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1565/80 della Commissione, del 23 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle etichette, filati
    di ciniglia, tulli e ricami, della categoria di prodotti n. 62 (codice 0620),
    originari della Iugoslavia, beneficiaria delle preferenze tarifarie previste dal
    regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1565/80 van de Commissie van 23 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op etiketten,
    chenillegaren, tule en borduurwerk, van de categorie van produkten nr. 62 (codenummer
    0620), van oorsprong uit Joegoslavië waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
