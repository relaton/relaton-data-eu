    58, 67, 74, 80, 83, 85, 86, 98, 107, 112, 113, 115, 116, 123, 129, 135, 148, 149
    och 150, vad gäller förslaget till ändringar av den globala tekniska föreskriften
    nr 2, vad gäller förslaget till ändringar av den ömsesidiga resolutionen MR.1,
    vad gäller förslagen till ändringar av de konsoliderade resolutionerna R.E.3
    och R.E.5 och vad gäller förslagen om tillstånd att utarbeta en ändring av
    den globala tekniska föreskriften nr 6 och att utarbeta en ny global teknisk
    föreskrift om bestämning av elfordonseffekt
