title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2859/90 of 3 October 1990 abolishing the
    corrective amount on the import of apples into the Community of Ten from Spain
    (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2859/90 de la Commission, du 3 octobre 1990, supprimant
