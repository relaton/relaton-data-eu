title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2177/91 of 24 July 1991 re-establishing
    the levying of customs duties on products of category 75 (order No 40.0750), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2177/91 DE LA COMMISSION du 24 juillet 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 75 (numéro d'' ordre 40.0750) originaires de la Chine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
