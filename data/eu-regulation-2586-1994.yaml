    1994/1995 et réduit en conséquence du dépassement de la quantité maximale
    garantie pendant la campagne de commercialisation 1992/1993
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2586/94 DER KOMMISSION vom 25. Oktober 1994 zur Bestimmung
