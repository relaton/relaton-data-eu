    im Wirtschaftsjahr 1992/93 geltenden garantierten Höchstmenge herabzusetzenden
    Interventionspreises für Olivenöl
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2586/94 af 25. oktober 1994 om fastsættelse
