title:
- language: en
  script: Latn
  content: '88/65/EEC: Commission Decision of 22 December 1987 authorizing the United
    Kingdom to introduce intra- Community surveillance on imports of certain television
    receivers originating in the People''s Republic of China which have been put into
    free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/65/CEE: Décision de la Commission du 22 décembre 1987 autorisant
    le Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de certains appareils de télévision originaires de la République populaire
    de Chine mis en libre pratique dans les autres États membres (Le texte en langue
    anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/65/EWG: Entscheidung der Kommission vom 22. Dezember 1987 zur Ermächtigung
    des Vereinigten Königreichs, die Einfuhren bestimmter in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Fernsehgeräte mit Ursprung in der Volksrepublik
    China einer innergemeinschaftlichen Überwachung zu unterwerfen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/65/EØF: Kommissionens beslutning af 22. december 1987 om bemyndigelse
    af Det Forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse fjernsynsapparater, som har oprindelse i Den Kinesiske Folkerepublik
    og er overgået til fri omsætning i de øvrige medlemsstater (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/65/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1987 που εξουσιοδοτεί το Ηνωμένο Βασίλειο να
    θεσπίσει ενδοκοινοτική επιτήρηση των εισαγωγών
    ορισμένων δεκτών τηλεοράσεως καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας, που βρίσκονται σε ελεύθερη
    κυκλοφορία στα άλλα κράτη μέλη (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/65/CEE: Decisione della Commissione del 22 dicembre 1987 che autorizza
    il Regno Unito a procedere ad una sorveglianza intracomunitaria delle importazioni
    di taluni televisori originari della Repubblica popolare cinese immessi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '88/65/EEG: Beschikking van de Commissie van 22 december 1987 houdende
    machtiging van het Verenigd Koninkrijk om een intracommunautair toezicht in te
    stellen op de invoer van bepaalde televisietoestellen van oorsprong uit de Volksrepubliek
    China, die in de andere Lid-Staten in het vrije verkeer zijn gebracht (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/65/CEE: Decisão da Comissão de 22 de Dezembro de 1987 que autoriza
    o Reino Unido a proceder a uma vigilância intracomunitária das importações
    de certos aparelhos de televisão originários da República Popular da China
    e introduzidos em livre-prática nos outros Estados-membros (Apenas faz fé o
    texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '88/65/CEE: Decisión de la Comisión de 22 de diciembre de 1987 por la
    que se autoriza al Reino Unido a proceder a una vigilancia intracomunitaria de
    las importaciones de determinados aparatos de televisión originarios de la República
    Popular de China despachados a libre práctica en los demás Estados miembros
    (El texto en lengua inglesa es el único auténtico)'
