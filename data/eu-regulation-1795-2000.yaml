title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1795/2000 of 22 August 2000 amending Regulation
    (EC) No 1553/2000 opening the procedure for the allocation of export licences
    for cheeses to be exported in 2001 to the United States of America under certain
    quotas resulting from the GATT Agreements
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1795/2000 de la Commission du 22 août 2000 modifiant
    le règlement (CE) nº 1553/2000 portant ouverture de la procédure d'attribution
    des certificats d'exportation pour les fromages à exporter en 2001 aux États-Unis
    d'Amérique dans le cadre de certains contingents découlant des accords du GATT
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1795/2000 der Kommission vom 22. August 2000 zur Änderung
    der Verordnung (EG) Nr. 1553/2000 zur Eröffnung der Ausschreibung von Lizenzen
    für die Ausfuhr von Käse nach den Vereinigten Staaten von Amerika im Rahmen
    bestimmter GATT-Kontingente für das Jahr 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1795/2000 af 22. august 2000 om ændring
    af forordning (EF) nr. 1553/2000 om åbning af proceduren for tildeling af eksportlicenser
    for oste, der i 2001 skal udføres til Amerikas Forenede Stater under visse kontingenter,
    der er en følge af GATT-aftalerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1795/2000 της Επιτροπής,
    της 22ας Αυγούστου 2000, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1553/2000 περί ενάρξεως της
    διαδικασίας χορήγησης πιστοποιητικών εξαγωγής
    για τα τυριά που πρόκειται να εξαχθούν το 2001
    στις Ηνωμένες Πολιτείες της Αμερικής στο πλαίσιο
    της συμπληρωματικής ποσόστωσης που απορρέει
    από τις συμφωνίες στης ΓΣΔΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1795/2000, annettu 22 päivänä elokuuta 2000,
