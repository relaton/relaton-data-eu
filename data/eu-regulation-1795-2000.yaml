    vuonna 2001 vietävien juustojen vientitodistusten antamista koskevan menettelyn
    aloittamisesta annetun asetuksen (EY) N:o 1553/2000 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1795/2000 della Commissione, del 22 agosto 2000, che
    modifica il regolamento (CE) n. 1553/2000 che apre la procedura di attribuzione
    dei titoli d'esportazione per i prodotti da esportare nel 2001 negli Stati Uniti
    d'America a titolo del contingente supplementare per i formaggi derivanti dall'accordo
    GATT
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1795/2000 van de Commissie van 22 augustus 2000 houdende
    wijziging van Verordening (EG) nr. 1553/2000 tot opening van de procedure voor
    de toewijzing van uitvoercertificaten voor kaas die, in 2001, in het kader van
    bepaalde contingenten op grond van de GATT-overeenkomsten naar de Verenigde Staten
    van Amerika mag worden uitgevoerd
  type: main
- language: pt
  script: Latn
