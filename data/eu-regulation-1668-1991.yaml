    Wirtschaftsjahr 1991/92 aufgrund der Überschreitung der für das Wirtschaftsjahr
    1990/91 festgesetzten Interventionsschwelle #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1668/91 af 14. juni 1991 om nedsættelse
