title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 964/93 of 22 April 1993 re- establishing
    the levying of customs duties on products of category 4 (order No 40.0040), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 964/93 de la Commission, du 22 avril 1993, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 4 (numéro d' ordre 40.0040) originaires d' Indonésie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 964/93 der Kommission vom 22. April 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 4 (laufende Nummer 40.0040) mit Ursprung
    in Indonesien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 964/93 af 22. april 1993 om genindførelse
