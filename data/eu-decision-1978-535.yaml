id: EUDecision1978535
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 June 1978 authorizing the Italian Republic not
    to apply Community treatment to orange juice, falling within subheading ex 20.07
    B II of the Common Customs Tariff, originating in Brazil and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/535/CEE: Décision de la Commission, du 8 juin 1978, autorisant la
    République italienne à exclure du traitement communautaire les jus d''oranges,
    de la sous- position Ex 20.07 B II du Tarif douanier commun, originaires du Brésil
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Juni 1978, mit der die Italienische
    Republik ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Fruchtsäfte aus Orangen der Tarifnummer ex 20.07
    B II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 8. juni 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage safter af appelsiner, som henhører
    under pos. ex 20.07 B II i den fælles toldtarif, har oprindelse i Brasilien og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 giugno 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i succhi di arancia della voce
    ex 20.07 B II della tariffa doganale comune, originari del Brasile e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 juni 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd sinaasappelsappen, van post ex 20.07 B II van het gemeenschappelijk
    douanetarief, van oorsprong uit Brazilië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
