title:
- language: en
  script: Latn
  content: Commission Directive 2003/60/EC of 18 June 2003 amending the Annexes to
    Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC as regards
    the fixing of maximum levels for certain pesticide residues in and on cereals,
    foodstuffs of animal origin and certain products of plant origin, including fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2003/60/CE de la Commission du 18 juin 2003 modifiant les annexes
    des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil en
    ce qui concerne la fixation de teneurs maximales pour certains résidus de pesticides
    sur et dans les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2003/60/EG der Kommission vom 18. Juni 2003 zur Änderung der
    Anhänge der Richtlinien 76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG des
    Rates hinsichtlich der Festsetzung von Höchstgehalten an Rückständen von bestimmten
    Schädlingsbekämpfungsmitteln in und auf Getreide, Lebensmitteln tierischen Ursprungs
    und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2003/60/ЕO на Комисията от 18 юни 2003
    година за изменение на приложенията към Директиви
    76/895/ЕИО, 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определяне на максимално допустимите
    граници на определени остатъци от пестициди
    във и по зърнените култури, хранителните продукти
    от животински произход и някои продукти от
    растителен произход, включително плодове и
    зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2003/60/ES ze dne 18. června 2003, kterou se mění přílohy
    směrnic Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud jde o maximální
    limity reziduí některých pesticidů v obilovinách, v potravinách živočišného
    původu a v některých produktech rostlinného původu, včetně ovoce a zeleniny,
    a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2003/60/EF af 18. juni 2003 om ændring af bilagene
    til Rådets direktiv 76/895/EØF, 86/362/EØF, 86/363/EØF og 90/642/EØF med
    hensyn til fastsættelse af maksimalgrænseværdier for visse pesticidrester i
    og på korn, levnedsmidler af animalsk oprindelse og visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2003/60/ΕΚ της Επιτροπής, της 18ης Ιουνίου
    2003, για τροποποίηση των παραρτημάτων των οδηγιών
    76/895/EOK, 86/362/ΕΟΚ, 86/363/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου,
    όσον αφορά τον καθορισμό των ανωτάτων ορίων
    για ορισμένα υπολείμματα φυτοφαρμάκων πάνω
    και μέσα στα σιτηρά, στα τρόφιμα ζωικής προέλευσης
    και σε ορισμένα προϊόντα φυτικής προέλευσης,
    συμπεριλαμβανομένων των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2003/60/EÜ, 18. juuni 2003, millega muudetakse nõukogu
    direktiivide 76/895/EMÜ, 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ (vastavalt teraviljas,
    loomses toidus ja teatavates taimset päritolu saadustes, sealhulgas puu- ja köögiviljas,
    sisalduvate ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise
    kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2003/60/EY, annettu 18 päivänä kesäkuuta 2003,
    neuvoston direktiivien 76/895/ETY, 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden
    muuttamisesta viljoissa ja niiden pinnassa, eläimistä saatavissa elintarvikkeissa
    ja niiden pinnassa sekä tietyissä kasviperäisissä tuotteissa, mukaan luettuina
    hedelmät ja vihannekset, ja niiden pinnassa olevien tiettyjen torjunta-ainejäämien
    enimmäismäärien vahvistamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2003/60/EK irányelve (2003. június 18.) a gabonafélék,
    állati eredetű élelmiszerek és bizonyos növényi eredetű termékek – többek
    között a gyümölcsök és zöldségek – belsejében, illetve azok felületén
    található bizonyos peszticid-szermaradványok megengedett legmagasabb szintjének
    megállapítása tekintetében a 76/895/EGK, 86/362/EGK, 86/363/EGK és 90/642/EGK
    tanácsi irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2003/60/CE della Commissione, del 18 giugno 2003, che modifica
    gli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE del
    Consiglio, per quanto riguarda le quantità massime di residui di alcuni antiparassitari
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2003/60/EK (2003. gada 18. jūlijs), ar ko groza pielikumus
    Padomes Direktīvām 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK attiecīgi
    par konkrētu pesticīdu atlieku maksimālo pieļaujamo daudzumu noteikšanu labībā
    un uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem, kā arī noteiktos
    augu izcelsmes produktos, ietverot augļus un dārzeņus, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2003 m. birželio 18 d. Komisijos direktyva 2003/60/EB, iš dalies keičianti
    Tarybos direktyvų 76/895/EEB, 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių
    pesticidų likučių koncentracijų atitinkamai grūduose, gyvūninės kilmės
    maisto produktuose ir kai kuriuose augalinės kilmės produktuose ir ant jų,
    įskaitant vaisius ir daržoves, nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2003/60/KE tat-18 ta' Ġunju 2003 li temenda
    l-Annessi għad-Direttivi tal-Kunsill 76/895/KEE, 86/362/KEE, 86/363/KEE u 90/642/KEE
    fir-rigward tal-livelli massimi ta' residwi ta' ċerti pestiċidi fi u fuq ċereali,
    fi u fuq oġġetti ta' l-ikel li ġejjin mill-annimali u fi u fuq ċerti prodotti
    li ġejjin mill-pjanti, inkluż frott u ħaxix
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2003/60/EG van de Commissie van 18 juni 2003 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 76/895/EEG, 86/362/EEG, 86/363/EEG en 90/642/EEG
    van de Raad ten aanzien van de vaststelling van maximumgehalten aan residuen van
    bepaalde bestrĳdingsmiddelen in en op granen, levensmiddelen van dierlĳke oorsprong
    en bepaalde producten van plantaardige oorsprong, met inbegrip van groenten en
    fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2003/60/WE z dnia 18 czerwca 2003 r. zmieniająca załączniki
    do dyrektyw Rady 76/895/EWG, 86/362/EWG, 86/363/EWG oraz 90/642/EWG w odniesieniu
    do ustalania najwyższych dopuszczalnych poziomów pozostałości pestycydów
    w zbożach, środkach spożywczych pochodzenia zwierzęcego i niektórych produktach
    pochodzenia roślinnego, w tym owocach i warzywach
  type: main
- language: pt
  script: Latn
  content: Directiva 2003/60/CE da Comissão, de 18 de Junho de 2003, que altera os
    anexos das Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho
    no respeitante à fixação de teores máximos de resíduos de determinados pesticidas
    à superfície e no interior dos cereais, dos géneros alimentícios de origem
    animal e de determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2003/60/CE a Comisiei din 18 iunie 2003 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    în ceea ce privește stabilirea conținuturilor maxime pentru anumite reziduuri
    de pesticide pe și în cereale, produsele alimentare de origine animală și
    anumite produse de origine vegetală, inclusiv fructele și legumele
  type: main
- language: sk
  script: Latn
  content: SMERNICA KOMISIE 2003/60/ES z 18. júna 2003, ktorou sa menia a dopĺňajú
    prílohy smernice Rady č. 76/895/EHS, 86/363/EHS a 90/642/EHS týkajúce sa stanovenia
    maximálnych limitov rezíduí pesticídov v a na obilninách, v potravinách
    živočíšneho pôvodu a v určitých produktoch rastlinného pôvodu, vrátane
    ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2003/60/ES z dne 18. junija 2003 o spremembi prilog
    k direktivam Sveta 76/895/EGS, 86/362/EGS, 86/363/EGS in 90/642/EGS glede določitve
    najvišjih mejnih vrednosti ostankov nekaterih pesticidov v in na žitih, živilih
    živalskega izvora in nekaterih proizvodih rastlinskega izvora, vključno s sadjem
    in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2003/60/CE de la Comisión, de 18 de junio de 2003, por la que
    se modifican los anexos de las Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE y
    90/642/CEE del Consejo, en lo que atañe a la fijación de los contenidos máximos
    de determinados residuos de plaguicidas sobre y en los cereales, sobre y en los
    alimentos de origen animal y sobre y en determinados productos de origen vegetal,
    incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2003/60/EG av den 18 juni 2003 om ändring av bilagorna
    till rådets direktiv 76/895/EEG, 86/362/EEG, 86/363/EEG och 90/642/EEG beträffande
    fastställande av gränsvärden för vissa bekämpningsmedelsrester i och på
    spannmål, livsmedel av animaliskt ursprung och vissa produkter av vegetabiliskt
    ursprung, inklusive frukt och grönsaker
