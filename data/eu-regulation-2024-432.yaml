title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/432 of 2 February 2024 determining
    that the information to be automatically exchanged pursuant to the agreement signed
    by the competent authorities of Canada and certain Member States is equivalent
    to the information specified in certain provisions of Council Directive 2011/16/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/432 de la Commission du 2 février
    2024 déterminant que les informations devant être échangées automatiquement
    en vertu de l’accord signé par les autorités compétentes du Canada et de
    certains États membres sont équivalentes aux informations spécifiées dans
    certaines dispositions de la directive 2011/16/UE du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/432 der Kommission vom 2. Februar 2024
    zur Feststellung, dass die Informationen, die gemäß der von den zuständigen
    Behörden Kanadas und bestimmten Mitgliedstaaten unterzeichneten Vereinbarung
    automatisch auszutauschen sind, den in bestimmten Bestimmungen der Richtlinie
    2011/16/EU des Rates genannten Informationen gleichwertig sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/432 на Комисията
    от 2 февруари 2024 година за определяне на еквивалентността
    на информацията, която подлежи на автоматичен
    обмен съгласно споразумението, подписано между
    компетентните органи на Канада и някои държави
    членки, спрямо информацията, посочена в някои
    разпоредби на Директива 2011/16/ЕС на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/432 ze dne 2. února 2024, kterým
    se určuje, že informace, které mají být automaticky vyměňovány podle dohody
    podepsané příslušnými orgány Kanady a některých členských států, jsou
    rovnocenné informacím uvedeným v některých ustanoveních směrnice Rady 2011/16/EU
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/432 af 2. februar 2024
    om afgørelse af, at de oplysninger, der skal udveksles automatisk i henhold til
    den aftale, der er undertegnet af de kompetente myndigheder i Canada og visse
    medlemsstater, er ækvivalente med de oplysninger, der er angivet i visse bestemmelser
    i Rådets direktiv 2011/16/EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/432 της Επιτροπής,
