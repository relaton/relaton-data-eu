  content: '81/553/EEC: Commission Decision of 6 July 1981 establishing that the apparatus
    described as ''Dionex auto ion TM system 12 S analyzer'' may be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/553/CEE: Décision de la Commission, du 6 juillet 1981, constatant
    que l''importation de l''appareil dénommé "Dionex auto ion TM system 12S analyzer"
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/553/EWG: Entscheidung der Kommission vom 6. Juli 1981, mit der festgestellt
    wird, daß das Gerät ,,DIONEX- Auto Ion TM System 12S Analyzer" unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/553/EØF: Kommissionens beslutning af 6. juli 1981 om fastslåelse
