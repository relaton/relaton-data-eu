title:
- language: en
  script: Latn
  content: '79/956/EEC: Commission Decision of 26 October 1979 authorizing Ireland
    not to apply Community treatment to men''s and boys''woven bath robes, dressing
    gowns, smoking jackets and similar indoor wear and other outer garments, except
    garments of categories 6, 14 A, 14 B, 16, 17, 21, 76 and 79, of wool, of cotton
    or of man-made textile fibres, falling within heading No ex 61.01 of the Common
    Customs Tariff (NIMEXE codes 61.01-09, 24, 25, 26, 92, 94, 96) (category 78),
    originating in South Korea and in free circulation in the other Member States
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/956/CEE: Décision de la Commission, du 26 octobre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les peignoirs de bain, robes
    de chambre, vestes d''intérieur et vêtements d''intérieur analogues et autres
    vêtements de dessus, tissés, pour hommes et garçonnets, à l''exclusion des
    vêtements des catégories 6, 14 A, 14B, 16, 17, 21, 76 et 79, de laine, de coton
    ou de fibres textiles synthétiques ou artificielles de la position ex 61.01 du
    tarif douanier commun (codes Nimexe: 61.01-09, 24, 25, 26, 92, 94, 96) (catégorie
    78), originaires de la Corée du Sud et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/956/EWG: Entscheidung der Kommission vom 26. Oktober 1976, mit der
    Irland ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bademäntel und -jacken, Hausmäntel, Hausjacken
    und ähnliche Hauskleidung sowie andere Oberkleidung aus Geweben, für Männer
    und Knaben, ausgenommen Kleidung der Kategorien 6, 14 A, 14 B, 16, 17, 21, 76
    und 79, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen,
    der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 61.01-09,
    24, 25, 26, 92, 94, 96) (Kategorie 78) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/956/EØF: Kommissionens beslutning af 26. oktober 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage badekåber, slåbrokker, hjemmejakker
    og lignende beklædningsgenstande til indendørsbrug samt andre yderbeklædningsgenstande
    til mænd og drenge, bortset fra de under kategorierne 6, 14 A, 14 B, 16, 17,
    21, 76 og 79 henhørende beklædningsgenstande af uld, bomuld eller kemofibre,
    som henhører under pos. ex 61.01 i den fælles toldtarif (NIMEXE-nummer 61.01-09,
    24, 25, 26, 92, 94, 96 ; kategori 78), har oprindelse i Sydkorea og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/956/CEE: Decisione della Commissione, del 26 ottobre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli accappatoi da bagno, le
    vesti da camera, le giacche da casa e simili vestimenta da casa e altri indumenti
    esterni, tessuti, per uomo e per ragazzo, esclusi gli indumenti delle categorie
    6, 14 A, 14 B, 16, 17, 21, 76 e 79, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della voce ex 61.01 della tariffa doganale comune (codici Nimexe:
    61.01-09, 24, 25, 26, 92, 94, 96), categoria 78, originari della Corea del Sud
    e messi in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/956/EEG: Beschikking van de Commissie van 26 oktober 1979 waarbij Ierland
    wordt gemachtigd dameskousen van synthetische textielvezels, badjassen, kamerjassen,
    huisjasjes en dergelijke binnenhuiskleding en andere bovenkleding, geweven, voor
    heren en jongens, uitgezonderd de kleding van de categorieën 6, 14 A, 14 B, 16,
    17, 21, 76 en 79, van wol, van katoen of van synthetische of kunstmatige textielvezels,
    van post ex 61.01 van het gemeenschappelijk douanetarief (NIMEXE- code 61.01-09,
    24, 25, 26, 92, 94, 96) (categorie 78), van oorsprong uit Zuid-Korea en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
