title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2895/75 of the Commission of 5 November 1975 re-establishing
    the levying of the customs duties on fabricated asbestos, falling within heading
    No 68.13, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2895/75 de la Commission, du 5 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables à l'amiante
    travaillé, de la position tarifaire 68.13, originaire de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2895/75 der Kommission vom 5. November 1975 zur Wiedereinführung
    des Zollsatzes für bearbeiteten Asbest der Tarifnummer 68.13 mit Ursprung in
    Jugoslawien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2895/75 af 5. november 1975 om genindførelse
    af toldafgifter for bearbejdede asbestfibre, under position 68.13, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2895/75 della Commissione, del 5 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili all'amianto lavorato,
    della voce doganale n. 68.13 originario della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre
    1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2895/75 van de Commissie van 5 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bewerkte
    asbestvezels, van post 68.13, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
