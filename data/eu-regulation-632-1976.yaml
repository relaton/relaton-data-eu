title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 632/76 of 22 March 1976 re-establishing
    the levying of customs duties on spoons, forks, etc., of stainless steel, falling
    within subheading 82.14 A, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 632/76 de la Commission, du 22 mars 1976, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, etc. en acier inoxydable, de la sous- position tarifaire
    82.14 A, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 632/76 der Kommission vom 22. März 1976 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln, Tortenschaufeln, Fischmesser,
    Buttermesser, Zuckerzangen und ähnliche Tischgeräte, aus rostfreiem Stahl, der
    Tarifstelle 82.14 A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 632/76 af 22. marts 1976 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, etc, af rustfrit stål, under
    underposition 82.14 A, som har oprindelse i udviklingslande og omfattes af de
    toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17.
    november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 632/76 della Commissione, del 22 marzo 1976, che ripristina
    la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni, forchette,
    ecc., di acciaio inossidabile, della sottovoce doganale 82.14 A, originari dei
    paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 632/76 van de Commissie van 22 maart 1976 houdende
    wederinstelling van de heffingen van de douanerechten voor lepels, pollepels,
    vorken, enz., van roestvrij staal, van onderverdeling 82.14 A, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van
    de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
