    Durchführungsbeschlusses 2011/807/EU hinsichtlich der durch eine finanzielle
    Beteiligung der Union förderfähigen Maßnahmen im Rahmen der Programme zur Tilgung
    der Traberkrankheit und hinsichtlich des Vorschusses der Union für Programme
