title:
- language: en
  script: Latn
  content: '2012/147/EU: Commission Implementing Decision of 9 March 2012 approving
    certain amended programmes for the eradication and monitoring of animal diseases
    and zoonoses for the year 2012 and amending Implementing Decision 2011/807/EU
    as regards the measures eligible for Union financial contribution in programmes
    for the eradication of scrapie and the advance payment by the Union in programmes
    for the eradication of rabies for the year 2012 (notified under document C(2012)
    1406)'
  type: main
- language: fr
  script: Latn
  content: '2012/147/UE: Décision d’exécution de la Commission du 9 mars 2012
    approuvant certains programmes modifiés d’éradication et de surveillance de
    maladies animales et zoonoses pour l’année 2012 et modifiant la décision d’exécution
    2011/807/UE en ce qui concerne les mesures pouvant bénéficier d’une contribution
    financière de l’Union dans le cadre de programmes d’éradication de la tremblante
    ainsi que le paiement d’une avance par l’Union dans le cadre de programmes
    d’éradication de la rage pour l’année 2012 [notifiée sous le numéro C(2012)
    1406]'
  type: main
