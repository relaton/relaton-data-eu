---
id: EURegulation202692
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/92 of 14 January 2026 concerning
    the renewal of the authorisation of a preparation of Bacillus velezensis ATCC
    PTA-6737 as a feed additive for laying hens and minor poultry species for laying,
    the authorisation of a preparation of Bacillus velezensis ATCC PTA-6737 as a feed
    additive for other birds kept for egg production or breeding (holder of authorisation:
    Kemin Europa N.V.) and repealing Implementing Regulation (EU) 2015/1020'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/92 de la Commission du 14 janvier
    2026 concernant le renouvellement de l’autorisation d’une préparation de
    Bacillus velezensis ATCC PTA-6737 en tant qu’additif pour l’alimentation des
    poules pondeuses et des espèces mineures de volailles destinées à la ponte
    et l’autorisation d’une préparation de Bacillus velezensis ATCC PTA-6737
    en tant qu’additif pour l’alimentation des autres oiseaux détenus pour la
    ponte ou la reproduction (titulaire de l’autorisation: Kemin Europa N.V.) et
    abrogeant le règlement d’exécution (UE) 2015/1020'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/92 der Kommission vom 14. Januar 2026
    zur Verlängerung der Zulassung einer Zubereitung aus Bacillus velezensis ATCC
    PTA-6737 als Zusatzstoff in Futtermitteln für Legehennen und Legegeflügelarten
    von geringerer wirtschaftlicher Bedeutung sowie zur Zulassung einer Zubereitung
    aus Bacillus velezensis ATCC PTA-6737 als Zusatzstoff in Futtermitteln für sonstige
    zu Lege- oder Zuchtzwecken gehaltene Vögel (Zulassungsinhaber: Kemin Europa N.V.)
    sowie zur Aufhebung der Durchführungsverordnung (EU) 2015/1020'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2026/92 на Комисията
    от 14 януари 2026 година за подновяване на разрешението
    за употреба на препарат от Bacillus velezensis ATCC PTA-6737
    като фуражна добавка за кокошки носачки и видове
    домашни птици с по-малко стопанско значение
    за носачки, за разрешаване на употребата на
    препарат от Bacillus velezensis ATCC PTA-6737 като фуражна
    добавка за други птици за носачки или за разплод
    (притежател на разрешението: Kemin Europa N.V.) и за
    отмяна на Регламент за изпълнение (ЕС) 2015/1020'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2026/92 ze dne 14. ledna 2026 o obnovení
    povolení přípravku Bacillus velezensis ATCC PTA-6737 jako doplňkové látky
    pro nosnice a menšinové druhy drůbeže určené ke snášce, povolení přípravku
    Bacillus velezensis ATCC PTA-6737 jako doplňkové látky pro ostatní ptáky
    určené k produkci vajec nebo chovu (držitel povolení: Kemin Europa N.V.) a
    o zrušení prováděcího nařízení (EU) 2015/1020'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2026/92 af 14. januar 2026
    om forlængelse af godkendelsen af et præparat af Bacillus velezensis ATCC PTA-6737
    som fodertilsætningsstof til æglæggende høner og mindre udbredte fjerkræarter
    bestemt til æglægning, om godkendelse af et præparat af Bacillus velezensis
    ATCC PTA-6737 som fodertilsætningsstof til andre fugle, der holdes med henblik
    på ægproduktion eller avl (indehaver af godkendelsen: Kemin Europa N.V.), og
    om ophævelse af gennemførelsesforordning (EU) 2015/1020'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2026/92 της Επιτροπής,
    της 14ης Ιανουαρίου 2026, σχετικά με την ανανέωση
    της άδειας χρήσης παρασκευάσματος Bacillus velezensis
    ATCC PTA-6737 ως πρόσθετης ύλης ζωοτροφών για όρνιθες
    ωοπαραγωγής και ήσσονος σημασίας είδη πουλερικών
    για ωοπαραγωγή, την έγκριση παρασκευάσματος
    Bacillus velezensis ATCC PTA-6737 ως πρόσθετης ύλης ζωοτροφών
    για άλλα πτηνά που εκτρέφονται για ωοπαραγωγή
    ή αναπαραγωγή (κάτοχος της άδειας: Kemin Europa NV),
    και για την κατάργηση του εκτελεστικού κανονισμού
    (ΕΕ) 2015/1020'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2026/92, 14. jaanuar 2026, milles käsitletakse
    Bacillus velezensis ATCC PTA-6737 preparaadi loa kehtivuse pikendamist selle kasutamiseks
    munakanade ja vähemtähtsate kodulinnuliikide munalindude söödalisandina ning
    loa andmist Bacillus velezensis ATCC PTA-6737 preparaadi kasutamiseks muna- või
    aretuslindudena peetavate muude lindude söödalisandina (loa hoidja: Kemin Europa
    N.V.) ning millega tunnistatakse kehtetuks rakendusmäärus (EL) 2015/1020'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2026/92, annettu 14 päivänä
    tammikuuta 2026, Bacillus velezensis ATCC PTA-6737 -valmisteen hyväksynnän uusimisesta
    munivien kanojen ja toissijaisten munivien siipikarjalajien rehun lisäaineena
    sekä Bacillus velezensis ATCC PTA-6737 -valmisteen hyväksymisestä muiden munantuotantoa
    tai jalostusta varten kasvatettavien lintujen rehun lisäaineena (hyväksynnän
    haltija: Kemin Europa NV) ja täytäntöönpanoasetuksen (EU) 2015/1020 kumoamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2026/92 ón gCoimisiún an 14 Eanáir
    2026 maidir le húdarú ullmhóide arb é atá inti Bacillus velezensis ATCC PTA-6737
    a athnuachan mar bhreiseán beathaithe le haghaidh béaróg agus mionspeicis éanlaithe
    clóis le bheith ina mbéaróga, agus maidir le húdarú ullmhóide arb é atá
    inti Bacillus velezensis ATCC PTA-6737 mar bhreiseán beathaithe le haghaidh éin
    eile a choimeádtar le haghaidh táirgeadh uibheacha nó le haghaidh pórúcháin
    (sealbhóir an údaraithe: Kemin Europa N.V.) agus lena n-aisghairtear Rialachán
    Cur Chun Feidhme (AE) 2015/1020'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2026/92 оd 14. siječnja 2026. o produljenju
    odobrenja pripravka od Bacillus velezensis ATCC PTA-6737 kao dodatka hrani za
    životinje za kokoši nesilice i manje zastupljene vrste peradi za nesenje, o
    odobrenju pripravka od Bacillus velezensis ATCC PTA-6737 kao dodatka hrani za
    životinje za druge ptice koje se drže za proizvodnju jaja ili rasplod (nositelj
    odobrenja: Kemin Europa N.V.) i o stavljanju izvan snage Provedbene uredbe (EU)
    2015/1020'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2026/92 végrehajtási rendelete (2026. január 14.)
    a Bacillus velezensist (ATCC PTA-6737) tartalmazó készítmény tojótyúkok
    és kevésbé jelentős tojóbaromfifajok takarmány-adalékanyagaként történő
    engedélyezésének megújításáról, a Bacillus velezensist (ATCC PTA-6737)
    tartalmazó készítmény tojástermelés vagy tenyésztés céljából tartott
    egyéb madarak takarmány-adalékanyagaként történő engedélyezéséről (az
    engedély jogosultja: Kemin Europa N.V.) és az (EU) 2015/1020 végrehajtási
    rendelet hatályon kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2026/92 della Commissione, del 14 gennaio
    2026, relativo al rinnovo dell’autorizzazione di un preparato di Bacillus velezensis
    ATCC PTA-6737 come additivo per mangimi destinati a galline ovaiole e specie avicole
    minori ovaiole, all’autorizzazione di un preparato di Bacillus velezensis ATCC
    PTA-6737 come additivo per mangimi destinati ad altri volatili detenuti per la
    produzione di uova o per la riproduzione (titolare dell’autorizzazione: Kemin
    Europa N.V.) e che abroga il regolamento di esecuzione (UE) 2015/1020'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2026/92 (2026. gada 14. janvāris),
    ar ko atjauno atļauju Bacillus velezensis ATCC PTA-6737 preparātu lietot par
    barības piedevu dējējvistām un mazāk izplatītu sugu dējējmājputniem,
    atļauju Bacillus velezensis ATCC PTA-6737 preparātu lietot par barības piedevu
    citiem dēšanai vai vaislai turētiem putniem (atļaujas turētājs: Kemin Europa
    N.V.) un atceļ Īstenošanas regulu (ES) 2015/1020'
  type: main
- language: lt
  script: Latn
  content: 2026 m. sausio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2026/92 dėl
    leidimo naudoti Bacillus velezensis ATCC PTA-6737 preparatą kaip vištų dedeklių
    ir retesnių rūšių dedeklinių naminių paukščių lesalų priedą atnaujinimo,
    leidimo naudoti Bacillus velezensis ATCC PTA-6737 preparatą kaip kitų paukščių,
    laikomų kiaušiniams dėti arba veisti, lesalų priedą (leidimo turėtoja –
    bendrovė Kemin Europa N.V.), kuriuo panaikinamas Įgyvendinimo reglamentas (ES)
    2015/1020
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/92 tal-14
    ta’ Jannar 2026 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparat ta’ Bacillus
    velezensis ATCC PTA-6737 bħala addittiv tal-għalf għat-tiġieġ tal-bajd u
    għal speċijiet minuri ta’ pollam tal-bajd, l-awtorizzazzjoni ta’ preparat
    ta’ Bacillus velezensis ATCC PTA-6737 bħala addittiv tal-għalf għal għasafar
    oħra miżmuma għall-produzzjoni tal-bajd jew għat-tnissil (detentur tal-awtorizzazzjoni:
    Kemin Europa N.V.) u li jħassar ir-Regolament ta’ Implimentazzjoni (UE) 2015/1020'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2026/92 van de Commissie van 14 januari 2026
    tot verlenging van de vergunning voor een preparaat van Bacillus velezensis ATCC
    PTA-6737 als toevoegingsmiddel voor diervoeding voor legkippen en legvogels van
    minder gangbare pluimveesoorten, tot verlening van een vergunning voor een preparaat
    van Bacillus velezensis ATCC PTA-6737 als toevoegingsmiddel voor diervoeding voor
    andere vogels gehouden voor eierproductie- of fokdoeleinden (vergunninghouder:
    Kemin Europa N.V.) en tot intrekking van Uitvoeringsverordening (EU) 2015/1020'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2026/92 z dnia 14 stycznia 2026
    r. dotyczące przedłużenia zezwolenia na stosowanie preparatu Bacillus velezensis
    ATCC PTA-6737 jako dodatku paszowego dla kur niosek i podrzędnych gatunków drobiu
    nieśnego, zezwolenia na stosowanie preparatu Bacillus velezensis ATCC PTA-6737
    jako dodatku paszowego dla innych ptaków utrzymywanych w celu produkcji jaj lub
    hodowli (posiadacz zezwolenia: Kemin Europa N.V.) i uchylające rozporządzenie
    wykonawcze (UE) 2015/1020'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2026/92 da Comissão, de 14 de janeiro
    de 2026, relativo à renovação da autorização de uma preparação de Bacillus
    velezensis ATCC PTA-6737 como aditivo em alimentos para galinhas poedeiras e espécies
    menores de aves de capoeira para postura e à autorização de uma preparação
    de Bacillus velezensis ATCC PTA-6737 como aditivo em alimentos para outras aves
    mantidas para a produção de ovos ou para reprodução (detentor da autorização:
    Kemin Europa N.V.) e que revoga o Regulamento de Execução (UE) 2015/1020'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2026/92 al Comisiei din 14 ianuarie
    2026 privind reînnoirea autorizării unui preparat de Bacillus velezensis ATCC
    PTA-6737 ca aditiv pentru hrana găinilor ouătoare și a speciilor minore de
    păsări de curte pentru ouat și autorizarea unui preparat de Bacillus velezensis
    ATCC PTA-6737 ca aditiv pentru hrana altor păsări crescute pentru ouat sau reproducere
    (titularul autorizației: Kemin Europa N.V.) și de abrogare a Regulamentului
    de punere în aplicare (UE) 2015/1020'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2026/92 zo 14. januára 2026 o obnovení
    povolenia prípravku s obsahom Bacillus velezensis ATCC PTA-6737 ako kŕmnej doplnkovej
    látky pre nosnice a menej významné druhy hydiny na znášku, o povolení prípravku
    s obsahom Bacillus velezensis ATCC PTA-6737 ako kŕmnej doplnkovej látky pre
    iné vtáky chované na produkciu vajec alebo na reprodukciu (držiteľ povolenia:
    Kemin Europa N.V.) a o zrušení vykonávacieho nariadenia (EÚ) 2015/1020'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2026/92 z dne 14. januarja 2026 o podaljšanju
    dovoljenja za pripravek iz Bacillus velezensis ATCC PTA-6737 kot krmni dodatek
    za kokoši nesnice in manj pomembne vrste perutnine za nesnice, o dovoljenju za
    pripravek iz Bacillus velezensis ATCC PTA-6737 kot krmni dodatek za druge ptice,
    gojene za proizvodnjo jajc ali razplod (imetnik dovoljenja: Kemin Europa N.V.),
    ter o razveljavitvi Izvedbene uredbe (EU) 2015/1020'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2026/92 de la Comisión, de 14 de enero
    de 2026, relativo a la renovación de la autorización de un preparado de Bacillus
    velezensis ATCC PTA-6737 como aditivo en piensos para gallinas ponedoras y especies
    menores de aves de corral ponedoras, a la autorización de un preparado de Bacillus
    velezensis ATCC PTA-6737 como aditivo en piensos para otras aves criadas para
    la producción de huevos o la reproducción (titular de la autorización: Kemin
    Europa N.V.) y por el que se deroga el Reglamento de Ejecución (UE) 2015/1020'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2026/92 av den 14 januari
    2026 om förlängning av godkännandet av ett preparat av Bacillus velezensis
    ATCC PTA-6737 som fodertillsats för värphöns och mindre vanligt förekommande
    fjäderfäarter avsedda för värpning samt om godkännande av ett preparat av
    Bacillus velezensis ATCC PTA-6737 som fodertillsats för andra fåglar som hålls
    för äggproduktion eller avel (innehavare av godkännandet: Kemin Europa NV)
    och om upphävande av genomförandeförordning (EU) 2015/1020'
  type: main
