    dans les régions de Basilicate, de Calabre, de Campanie, des Pouilles, de Sardaigne
    et de Sicile relevant de l''objectif n° 1 et dans la région du Molise bénéficiant
    du soutien transitoire au titre de l''objectif n° 1 en Italie [notifiée sous
    le numéro C(2000) 2050]'
  type: main
