title:
- language: en
  script: Latn
  content: '2002/555/EC: Commission Decision of 1 August 2000 approving the Community
    Support Framework for Community structural assistance in the regions of Apulia,
    Basilicata, Calabria, Campania, Sardinia and Sicily under Objective 1 and Molise
    qualifying for transitional support under Objective 1 in Italy (notified under
    document number C(2000) 2050)'
  type: main
- language: fr
  script: Latn
  content: '2002/555/CE: Décision de la Commission du 1er août 2000 portant approbation
