    Williams et les cerises conservées au sirop, ainsi que le prix minimal à payer
    aux producteurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1468/80 der Kommission vom 10. Juni 1980 zur Festsetzung
    der Produktionsbeihilfe für Williamsbirnen und Kirschen, in Sirup haltbar gemacht,
    sowie des den Erzeugern zu zahlenden Mindestpreises für das Wirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1468/80 af 10. juni 1980 om fastsættelse
