  content: Commission Regulation (EEC) No 1468/80 of 10 June 1980 fixing, for the
    1980/81 marketing year, the amount of production aid for Williams pears and cherries
    preserved in syrup, and the minimum price to be paid to producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1468/80 de la Commission, du 10 juin 1980, fixant,
