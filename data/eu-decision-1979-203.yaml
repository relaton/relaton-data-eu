id: EUDecision1979203
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/203/EEC: Commission Decision of 2 February 1979 authorizing the French
    Republic to apply protective measures to imports of live sheep falling within
    subheading 01.04 A I b) of the Common Customs Tariff and sheepmeat falling within
    subheading 02.01 A ex IV thereof, originating in third countries and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/203/CEE: Décision de la Commission, du 2 février 1979, autorisant
    la République française à appliquer des mesures de protection aux importations
    des animaux vivants de l''espèce ovine, de la sous-position 01.04 A I b) du tarif
    douanier commun et de la viande ovine de la sous-position 02.01 A ex IV du tarif
    douanier commun, originaires de pays tiers et mis en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/203/EWG: Entscheidung der Kommission vom 2. Februar 1979 zur Ermächtigung
    der Französischen Republik, Schutzmaßnahmen bei der Einfuhr von lebenden Schafen
    der Tarifstelle 01.04 A I b) des Gemeinsamen Zolltarifs und Fleisch von Schafen
    der Tarifstelle 02.01 A ex IV des Gemeinsamen Zolltarifs mit Ursprung in dritten
    Ländern, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    zu ergreifen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/203/EØF: Kommissionens beslutning af 2. februar 1979 om bemyndigelse
    til Den franske Republik til at anvende beskyttelsesforanstaltninger over for
    indførsler af får, levende, henhørende under pos. 01.04 A I b) i den fælles
    toldtarif og af fårekød, henhørende under pos. 02.01 A ex IV i den fælles
    toldtarif, med oprindelse i tredjelande og i fri omsætning i de andre medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/203/CEE: Decisione della Commissione, del 2 febbraio 1979, che autorizza
    la Repubblica francese ad applicare misure di protezione all''importazione degli
    animali vivi della specie ovina della sottovoce 01.04 A I b) della tariffa doganale
    comune e della carne ovina della sottovoce 02.01 A ex IV della tariffa doganale
    comune, originari dei paesi terzi e messi in libera pratica negli altri Stati
    membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/203/EEG: Beschikking van de Commissie van 2 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd beschermende maatregelen te nemen bij de invoer
    van levende schapen van post 01.04 A I b) van het gemeenschappelijk douanetarief
    en van schapevlees van post 02.01 A ex IV van het gemeenschappelijk douanetarief,
    van oorsprong uit derde landen en in de andere Lid-Staten in het vrije verkeer
    gebracht (Slechts de tekst in de Franse taal is authentiek)'
  type: main
