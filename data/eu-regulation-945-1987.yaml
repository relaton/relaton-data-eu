  content: Council Regulation (EEC) No 945/87 of 30 March 1987 amending Regulation
    (EEC) No 1468/81 on mutual assistance between the administrative authorities of
    the Member States and cooperation between the latter and the Commission to ensure
    the correct application of the law on customs or agricultural matters
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 945/87 du Conseil du 30 mars 1987 modifiant le règlement
