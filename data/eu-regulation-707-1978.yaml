title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 707/78 of 4 April 1978 amending Regulation
    (EEC) No 2682/72 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 707/78 du Conseil, du 4 avril 1978, modifiant le règlement
    (CEE) n° 2682/72 établissant, pour certains produits agricoles exportés sous
    forme de marchandises ne relevant pas de l' annexe II du traité, les règles
    générales relatives à l' octroi des restitutions à l' exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 707/78 des Rates vom 4. April 1978 zur Änderung der
    Verordnung (EWG) Nr. 2682/72 zur Festlegung der allgemeinen Regeln für die Gewährung
    von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 707/78 af 4. april 1978 om ændring af forordning
    (EØF) nr. 2682/72 om fastsættelse af almindelige regler for ydelse af eksportrestitutioner
    og om fastlæggelse af kriterierne for fastsættelse af restitutionsbeløbet for
    visse landbrugsprodukter, der udføres i form af varer, der ikke omfattes af traktatens
    bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 707/78 του Συμβουλίου
    της 4ης Απριλίου 1978 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2682/72 «περί καθορισμού
    των γενικών κανόνων που αφορούν τη χορήγηση
    επιστροφών κατά την εξαγωγή και των κριτηρίων
    προσδιορισμού του ύψους αυτών για ορισμένα
    προϊόντα εξαγόμενα υπό μορφήν εμπορευμάτων
    μη υπαγομένων στο παράρτημα ΙΙ της συνθήκης»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 707/78 del Consiglio, del 4 aprile 1978, che modifica
    il regolamento (CEE) n. 2682/72 che stabilisce, per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell' allegato II del trattato, le regole generali
    relative alla concessione delle restituzioni all' esportazione e i criteri per
    stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 707/78 van de Raad van 4 april 1978 houdende wijziging
    van Verordening (EEG) nr. 2682/72 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
