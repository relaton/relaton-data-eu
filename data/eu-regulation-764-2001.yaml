title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 764/2001 of 19 April 2001 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in April 2001 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 764/2001 de la Commission du 19 avril 2001 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 2001 pour les contingents tarifaires de viandes bovines prévus
    par le règlement (CE) n° 1279/98 pour la République de Pologne, la République
    de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 764/2001 der Kommission vom 19. April 2001 zur Bestimmung
    des Prozentsatzes, zu dem den im April 2001 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und Rumänien im Rahmen der Zollkontingente gemäß der Verordnung (EG) Nr. 1279/98
    stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 764/2001 af 19. april 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i april 2001 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 1279/98 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 764/2001 της Επιτροπής,
    της 19ης Απριλίου 2001, για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Απρίλιο 2001 για τις συμπληρωματικές δασμολογικές
    ποσοστώσεις βοείου κρέατος που προβλέπονται
