    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακία, τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 764/2001, annettu 19 päivänä huhtikuuta 2001,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    huhtikuussa 2001 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 764/2001 della Commissione, del 19 aprile 2001, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di aprile 2001 per i contingenti tariffari supplementari di
    carni bovine previsti dal regolamento (CE) n. 1279/98 per la Repubblica di Polonia,
    la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria e la
    Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 764/2001 van de Commissie van 19 april 2001 tot vaststelling
