title:
- language: en
  script: Latn
  content: '79/389/EEC: Commission Decision of 28 March 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, other than those of category 10, of wool,
    cotton or man-made textile fibres, falling within heading No ex 60.02 of the Common
    Customs Tariff (NIMEXE codes 60.02-50, 60, 70, 80) (category 11), originating
    in Taiwan and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/389/CEE: Décision de la Commission, du 28 mars 1979, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, autre que celle de la catégorie 10, de laine,
    de coton ou de fibres textiles synthétiques ou artificielles, de la position
    ex 60.02 du tarif douanier commun (codes Nimexe: 60.02-50, 60, 70, 80) catégorie
    11, originaires de T'' ai-wan et mise en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: '79/389/EWG: Entscheidung der Kommission vom 28. März 1979, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, andere als Waren der Kategorie 10, aus Wolle, Baumwolle oder
    synthetischen oder künstlichen Spinnstoffen der Tarifnummer ex 60.02 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.02-50; 60; 70; 80), Kategorie 11, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/389/EØF: Kommissionens beslutning af 28. marts 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer ikke elastiske, bortset fra varer i kategori 10, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 60.02 i den fælles
    toldtarif (NIMEXE-nummer 60.02-50, 60, 70, 80 ; kategori 11), har oprindelse i
    Taiwan og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/389/CEE: Decisione della Commissione, del 28 marzo 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, diversi da quelli della categoria 10, di lana, di cotone
    o di fibre tessili sintetiche o artificiali della voce ex 60.02 della tariffa
    doganale comune (codici Nimexe: 60.02-50, 60, 70, 80 - categoria 11), originari
    di Taiwan e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/389/EEG: Beschikking van de Commissie van 28 maart 1979 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, andere dan die van categorie 10, van
    wol, katoen of van synthetische of kunstmatige textielvezels, van post ex 60.02
    van het gemeenschappelijk douanetarief (NIMEXE-code 60.02-50, 60, 70, 80) (categorie
    11), van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
