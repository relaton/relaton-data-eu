    jippromwovu l-kooperazzjoni u r-relazzjonijiet kummerċjali bejn l-Unjoni Ewropea
    u l-pajjiżi industrijalizzati ta' l-Amerika ta' Fuq, il-Lvant Imbiegħed u l-Awstralasja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1900/2005 van de Raad van 21 november 2005 tot wijziging
    van Verordening (EG) nr. 382/2001 betreffende de tenuitvoerlegging van projecten
    ter bevordering van de samenwerking en de handelsbetrekkingen tussen de Europese
    Unie en de geïndustrialiseerde landen van Noord-Amerika, het Verre Oosten en
    Australazië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1900/2005 z dnia 21 listopada 2005 r. zmieniające
    rozporządzenie (WE) nr 382/2001 dotyczące wprowadzania w życie projektów wspierających
    współpracę i stosunki handlowe między Unią Europejską a uprzemysłowionymi
    państwami Ameryki Północnej, Dalekiego Wschodu i Australazji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1900/2005 do Conselho, de 21 de Novembro de 2005,
    que altera o Regulamento (CE) n.° 382/2001 relativo à execução de projectos
    de promoção da cooperação e das relações comerciais entre a União Europeia
    e os países industrializados da América do Norte, do Extremo Oriente e da Australásia
    no que respeita à sua data de caducidade e a determinadas disposições relacionadas
    com a execução do orçamento
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1900/2005 z 21. novembra 2005, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 382/2001 o vykonávaní projektov na podporu spolupráce
    a obchodných vzťahov medzi Európskou úniou a priemyselnými krajinami Severnej
    Ameriky, Ďalekého východu a Južnej Ázie
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1900/2005 z dne 21. novembra 2005 o spremembi Uredbe
