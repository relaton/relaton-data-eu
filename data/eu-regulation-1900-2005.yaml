    Tolimųjų Rytų bei Australazijos industrializuotų šalių bendradarbiavimą
    ir prekybinius ryšius skatinančių projektų įgyvendinimo nuostatas
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1900/2005 tal- 21 ta' Novembru 2005 li
