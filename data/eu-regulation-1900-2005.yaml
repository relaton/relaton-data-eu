title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1900/2005 of 21 November 2005 amending Regulation
    (EC) No 382/2001 concerning the implementation of projects promoting cooperation
    and commercial relations between the European Union and the industrialised countries
    of North America, the Far East and Australasia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1900/2005 du Conseil du 21 novembre 2005 modifiant
    le règlement (CE) n° 382/2001 concernant la mise en œuvre de projets visant
    à promouvoir la coopération et les relations commerciales entre l'Union européenne
    et les pays industrialisés d'Amérique du Nord, d'Extrême Orient et d'Australasie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1900/2005 des Rates vom 21. November 2005 zur Änderung
    der Verordnung (EG) Nr. 382/2001 des Rates über die Durchführung von Projekten
    zur Förderung der Zusammenarbeit und der Handelsbeziehungen zwischen der Europäischen
    Union und den Industrieländern in Nordamerika, im Fernen Osten und in Australasien
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1900/2005 ze dne 21. listopadu 2005, kterým
    se mění nařízení (ES) č. 382/2001 o provádění projektů na podporu spolupráce
    a obchodních vztahů mezi Evropskou unií a průmyslovými zeměmi Severní Ameriky,
    Dálného východu a Oceánie
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1900/2005 af 21. november 2005 om ændring
    af forordning (EF) nr. 382/2001 om gennemførelse af projekter til fremme af samarbejde
    og handelsmæssige forbindelser mellem Den Europæiske Union og de industrialiserede
    lande i Nordamerika, Fjernøsten og Australasien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1900/2005 του Συμβουλίου,
    της 21ης Νοεμβρίου 2005, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 382/2001 για την εφαρμογή
    προγραμμάτων που προωθούν τη συνεργασία και
    τις εμπορικές σχέσεις μεταξύ της Ευρωπαϊκής
    Ένωσης και των βιομηχανικών χωρών της Βορείου
    Αμερικής, της Άπω Ανατολής και της Αυστραλασίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1900/2005, 21. november 2005, millega muudetakse
    määrust (EÜ) nr 382/2001, mis käsitleb Euroopa Liidu ning Põhja-Ameerika,
    Kaug-Ida ja Okeaania industriaalmaade vahelisi koostöö- ja kaubandussuhteid
    edendavate projektide rakendamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1900/2005, annettu 21 päivänä marraskuuta
    2005, Euroopan unionin ja Pohjois-Amerikan, Kaukoidän ja Australaasian teollisuusmaiden
    välistä yhteistyötä ja kaupallisia suhteita edistävien hankkeiden täytäntöönpanosta
    annetun asetuksen (EY) N:o 382/2001 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1900/2005/EK rendelete (2005. november 21.) az Európai Unió
    és Észak-Amerika, a Távol-Kelet és Ausztrálázsia ipari országai közötti
    együttműködés és a kereskedelmi kapcsolatok előmozdítását szolgáló
    projektek végrehajtásáról szóló 382/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1900/2005 del Consiglio, del 21 novembre 2005, che
    modifica il regolamento (CE) n. 382/2001 relativo all'attuazione di progetti destinati
    a promuovere la cooperazione e le relazioni commerciali tra l'Unione europea e
    i paesi industrializzati dell'America settentrionale, dell'Estremo oriente e dell'Australasia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1900/2005 (2005. gada 21. novembris), ar ko groza
    Regulu (EK) Nr. 382/2001, kas attiecas uz projektu īstenošanu, kas veicina sadarbību
    un komercattiecības starp Eiropas Savienību un Ziemeļamerikas, Tālo Austrumu
    un Austrālijas – Āzijas industrializētajām valstīm
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 21 d. Tarybos reglamentas (EB) Nr. 1900/2005, iš dalies
