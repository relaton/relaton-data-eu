title:
- language: en
  script: Latn
  content: '81/461/EEC: Commission Decision of 10 June 1981 establishing that the
    apparatus described as ''Genrad 1621 precision capacitance measurement system''
    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/461/CEE: Décision de la Commission, du 10 juin 1981, constatant que
    l''importation de l''appareil dénommé "Genrad-1621 Precision Capacitance Measurement
    System" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/461/EWG: Entscheidung der Kommission vom 10. Juni 1981, mit der festgestellt
    wird, daß das Gerät ,,GENRAD- 1621 Precision Capacitance Measurement System"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/461/EØF: Kommissionens beslutning af 10. juni 1981 om fastslåelse
    af, at indførsel af apparatet "GENRAD-1621 Precision Capacitance Measurement
    System" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
