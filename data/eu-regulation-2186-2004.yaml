---
id: EURegulation21862004
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2186/2004 of 20 December 2004 amending Regulation
    (EC) No 1613/2000 derogating from Regulation (EEC) No 2454/93 in respect of the
    definition of the concept of originating products used for the purposes of the
    scheme of generalised preferences to take account of the special situation of
    Laos regarding certain exports of textiles to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2186/2004 de la Commission du 20 décembre 2004 modifiant
    le règlement (CE) n° 1613/2000 portant dérogation au règlement (CEE) n° 2454/93
    en ce qui concerne la définition de la notion de «produits originaires» établie
    dans le cadre du schéma de préférences tarifaires généralisées pour tenir
    compte de la situation particulière du Laos en ce qui concerne certains produits
    textiles exportés de ce pays vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2186/2004 der Kommission vom 20. Dezember 2004 zur
    Änderung der Verordnung (EG) Nr. 1613/2000 über eine Abweichung von der Bestimmung
    des Begriffs „Ursprungserzeugnisse“ in der Verordnung (EWG) Nr. 2454/93 im
    Rahmen des Allgemeinen Präferenzsystems zur Berücksichtigung der besonderen
    Lage von Laos bei bestimmten in die Gemeinschaft ausgeführten Textilwaren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2186/2004 на Комисията от 20
    декември 2004 година за изменение на Регламент
    (ЕО) № 1613/2000 относно дерогация от Регламент
    (ЕИО) № 2454/93 относно определянето на понятието
    „произход на продукти“, използвани за целите
    на схемата на общите тарифни преференции, за
    да се отчете специалната ситуация на Лаос относно
    износа на текстил в Общността
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2186/2004 ze dne 20. prosince 2004, kterým
    se mění nařízení (ES) č. 1613/2000, kterým se stanoví odchylka od nařízení
    (EHS) č. 2454/93, pokud jde o definici pojmu „původní produkty“ používanou
    pro účely systému všeobecných celních preferencí s ohledem na zvláštní
    situaci Laosu v případě některých textilních výrobků vyvážených z této
    země do Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2186/2004 af 20. december 2004 om ændring
    af forordning (EF) nr. 1613/2000 om en undtagelse fra forordning (EØF) nr. 2454/93,
    hvad angår definitionen af begrebet »varer med oprindelsesstatus« i henhold
    til den generelle præferenceordning for at tage hensyn til den særlige situation
    i Laos for visse tekstilvarer, der udføres fra dette land til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2186/2004 της Επιτροπής,
    της 20ής Δεκεμβρίου 2004, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1613/2000 σχετικά με την
    παρέκκλιση από τον κανονισμό (ΕΟΚ) αριθ. 2454/93
    όσον αφορά την έννοια των «προϊόντων καταγωγής»
    που ορίζεται στο πλαίσιο του συστήματος γενικευμένων
    δασμολογικών προτιμήσεων, προκειμένου να ληφθεί
    υπόψη η ιδιαίτερη κατάσταση του Λάος όσον αφορά
    ορισμένα κλωστοϋφαντουργικά προϊόντα που
    εξάγονται από τη χώρα αυτή προς την Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2186/2004, 20. detsember 2004, millega muudetakse
    määrust (EÜ) nr 1613/2000, millega sätestatakse üldise soodustuste süsteemi
    raames kehtestatud päritolustaatusega toodete määratluse erandid määrusest
    (EMÜ) nr 2454/93, et võtta arvesse Laose eriolukorda teatavate tekstiiltoodete
    ühendusse eksportimisel
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2186/2004, annettu 20 päivänä joulukuuta 2004,
    asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
    ”alkuperätuotteiden” käsitteen määritelmästä poikkeamisesta Laosin erityistilanteen
    huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien tekstiilituotteiden
    osalta annetun asetuksen (EY) N:o 1613/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2186/2004/EK rendelete (2004. december 20.) bizonyos textiltermékeknek
    a Közösségbe történő kivitelénél Laosz különleges helyzetének figyelembevétele
    érdekében a 2454/93/EGK rendeletben foglalt és az általános preferenciális
    rendszer keretében használt „származó termék” fogalom meghatározásától
    történő eltérésről szóló 1613/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2186/2004 della Commissione, del 20 dicembre 2004,
    che modifica il regolamento (CE) n. 1613/2000 recante deroga al regolamento (CEE)
    n. 2454/93 per quanto riguarda la definizione della nozione di «prodotti originari»
    stabilita nell'ambito dello schema di preferenze tariffarie generalizzate per
    tener conto della particolare situazione del Laos per quanto concerne alcuni prodotti
    tessili esportati da tale paese nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2186/2004 (2004. gada 20. decembris), ar ko groza
    Regulu (EK) Nr. 1613/2000 par atkāpēm no Regulas (EEK) Nr. 2454/93 attiecībā
    uz to, kā definēt noteiktas izcelsmes ražojumu jēdzienu izmantošanai vispārējo
    atvieglojumu sistēmā, lai ņemtu vērā Laosas īpašo stāvokli attiecībā
    uz dažu tekstilizstrādājumu eksportu uz Kopienu
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 20 d. Komisijos reglamentas (EB) Nr. 2186/2004, iš dalies
    keičiantis Reglamentą (EB) Nr. 1613/2000, nukrypstantį nuo Reglamento (EEB)
    Nr. 2454/93 dėl produktų kilmės sąvokos apibrėžimo, naudojamo bendrųjų
    preferencijų schemos tikslams, kad būtų atsižvelgta į ypatingą Laoso situaciją,
    susijusią su tam tikru tekstilės eksportu į Bendriją
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 2186/2004 tal- 20 ta' Diċembru 2004
    li jemenda r-Regolament (KE) Nru 1613/2000 li jidderoga mir-Regolament (KEE) Nru
    2454/93 fir-rigward tad-definizzjoni tal-kunċett ta' prodotti li joriġinaw użati
    għall-iskopijiet tal-iskema ta' preferenzi ġeneralizzati sabiex jieħdu in konsiderazzjoni
    l-qagħda speċjali fil-Laos fir-rigward ta' xi oġġetti tat-tessuti esportati
    lejn il-Komunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2186/2004 van de Commissie van 20 december 2004 tot
    wijziging van Verordening (EG) nr. 1613/2000 houdende afwijking van de in Verordening
    (EEG) nr. 2454/93 opgenomen definitie van het begrip „producten van oorsprong”
    in het kader van het stelsel van algemene tariefpreferenties in verband met de
    bijzondere situatie van Laos wat de uitvoer van bepaalde textielproducten naar
    de Gemeenschap betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2186/2004 z dnia 20 grudnia 2004 r. zmieniające
    rozporządzenie (WE) nr 1613/2000 wprowadzające odstępstwo od rozporządzenia
    (EWG) nr 2454/93 w odniesieniu do definicji pojęcia produktów pochodzących
    używanej do celów ogólnego systemu preferencji w celu uwzględnienia szczególnej
    sytuacji Laosu dotyczącej wywozu niektórych wyrobów włókienniczych do Wspólnoty
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2186/2004 da Comissão, de 20 de Dezembro de 2004,
    que altera o Regulamento (CE) n.° 1613/2000 que derroga o Regulamento (CEE) n.°
    2454/93 no que se refere à definição da noção de «produtos originários»
    estabelecida no âmbito do sistema de preferências pautais generalizadas, a fim
    de ter em conta a situação específica do Laos no que respeita a determinados
    produtos têxteis exportados deste país para a Comunidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2186/2004 al Comisiei din 20 decembrie 2004 de modificare
    a Regulamentului (CE) nr. 1613/2000 de derogare de la Regulamentul (CEE) nr. 2454/93
    în ceea ce privește definirea conceptului de „produse originare” folosit
    în cadrul sistemului de preferințe generalizate pentru a ține seama de situația
    specială a Laosului în ceea ce privește anumite produse textile exportate către
    Comunitate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2186/2004 z 20. decembra 2004, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1613/2000 ustanovujúce výnimku z nariadenia (EHS)
    č. 2454/93 v súvislosti s definíciou pojmu výrobkov s pôvodom, používaného
    na účely schémy všeobecného systému preferencií, zohľadňujúc tak osobitnú
    situáciu Laosu vzhľadom na vývoz textílií do Spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2186/2004 z dne 20. decembra 2004 o spremembi
    Uredbe (ES) št. 1613/2000, ki ureja odstopanje od Uredbe (EGS) št. 2454/93 glede
    opredelitve pojma izdelki s poreklom, ki se uporablja za splošno shemo preferencialov,
    z namenom da se upošteva posebni položaj Laosa glede izvoza nekaterih tekstilnih
    izdelkov v Skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2186/2004 de la Comisión, de 20 de diciembre de 2004,
    por el que se modifica el Reglamento (CE) n° 1613/2000 por el que se establece
    una excepción al Reglamento (CEE) n° 2454/93 en lo relativo a la definición
    del concepto de «productos originarios» establecido con arreglo al plan de preferencias
    arancelarias generalizadas a fin de tener en cuenta la situación particular de
    Laos por lo que se refiere a determinados productos textiles exportados de este
    país a la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2186/2004 av den 20 december 2004 om
    ändring av förordning (EG) nr 1613/2000 om undantag från förordning (EEG)
    nr 2454/93 med avseende på definitionen av begreppet ”ursprungsvaror” som
    fastställs inom ramen för systemet för allmän förmånsbehandling för att
    ta hänsyn till Laos särskilda situation när det gäller vissa textilprodukter
    som exporteras från detta land till gemenskapen
  type: main
