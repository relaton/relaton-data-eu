title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3072/73 of the Commission of 13 November 1973 amending
    Regulation (EEC) No 2112/73 authorizing the United Kingdom to suspend customs
    duties on certain products listed in Article 1 (2) of Regulation No 136/66/EEC
    on the establishment of a common organization of the market in oils and fats
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3072/73 de la Commission, du 13 novembre 1973, modifiant
    le règlement (CEE) n° 2112/73 autorisant le Royaume-Uni à suspendre totalement
    les droits de douane applicables à certains produits visés à l' article 1er
    paragraphe 2 du règlement 136/66/CEE, portant établissement d' une organisation
    commune des marchés dans le secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3072/73 der Kommission vom 13. November 1973 zur Änderung
    der Verordnung (EWG) Nr. 2112/73 zur Ermächtigung des Vereinigten Königreichs,
    die Zollsätze für einige Erzeugnisse im Sinne des Artikels 1 Absatz 2 der Verordnung
    Nr. 136/66/EWG über die gemeinsame Marktorganisation für Fette vollständig
    auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3072/73 af 13. november 1973 om ændring
    af forordning (EØF) nr. 2112/73 om bemyndigelse af Det forenede Kongerige til
    helt at suspendere tolden på visse i artikel 1, stk. 2 i forordning nr. 136/66/EØF
    om oprettelse af en fælles markedsordning for fedtstoffer anførte varer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3072/73 della Commissione, del 13 novembre 1973, che
    modifica il regolamento (CEE) n. 2112/73 che autorizza il Regno Unito a sospendere
    totalmente i dazi doganali applicabili a taluni prodotti di cui all' articolo
    1, paragrafo 2, del regolamento n. 136/66/CEE, relativo all' attuazione di un'
    organizzazione comune dei mercati nel settore dei grassi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3072/73 van de Commissie van 13 november 1973 tot
    wijziging van Verordening (EEG) nr. 2112/73 waarbij het Verenigd Koninkrijk wordt
    gemachtigd de douanerechten van toepassing op bepaalde produkten bedoeld in artikel
    1, lid 2, van Verordening nr. 136/66/EEG houdende de totstandbrenging van een
    gemeenschappelijke ordening der markten in de sector oliën en vetten, volledig
    te schorsen
  type: main
