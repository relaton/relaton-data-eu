id: EUDecision1980151
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/151/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to umbrellas and sunshades (including
    walking- stick umbrellas, umbrella tents, and garden and similar umbrellas), falling
    within heading No 66.01 of the Common Customs Tariff, originating in Taiwan and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/151/CEE: Décision de la Commission, du 28 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles, y compris les parapluies-cannes et les parasols-tentes,
    de la position 66.01 du tarif douanier commun, originaires de T''ai-wan et mis
    en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/151/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Regenschirme und Sonnenschirme,
    einschließlich Stockschirme, Schirmzelte und dergleichen, der Tarifnummer 66.01
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/151/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage paraplyer og
    parasoller (herunder stokkeparaplyer, paraplytelte haveparasoller og lignende),
    som henhører under pos. 66.01 i den fælles toldtarif, har oprindelse i Taiwan
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/151/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli ombrelli,
    compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e simili, della
    voce 66.01 della tariffa doganale comune, originari di Taiwan e messi in libera
    pratica negli altri Stati membri (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/151/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd paraplu''s en parasols, alsmede wandelstokparaplu''s,
    tuinparasols, parasoltenten en dergelijke van post 66.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
