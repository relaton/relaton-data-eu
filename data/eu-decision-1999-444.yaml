title:
- language: en
  script: Latn
  content: '1999/444/EC: Commission Decision of 7 July 1999 providing for the release
    of the minimum stocks and the partial release of the carryover stocks held by
    the sugar undertakings established in Spain, in order to ensure supplies to the
    southern region of Spain during the period from 1 July to 30 November 1999 (notified
    under document number C(1999) 2049) (Only the Spanish text is authentic)'
  type: main
