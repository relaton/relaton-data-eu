---
id: EURegulation2024262
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/262 of 17 January 2024 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-glucanase produced
    by Trichoderma citrinoviride IMI 360748 as a feed additive for chickens for fattening,
    minor poultry species for fattening and weaned piglets, the authorisation of that
    preparation as a feed additive for turkeys for fattening, all poultry species
    reared for laying or breeding, ornamental birds and suckling piglets (holder of
    the authorisation: Huvepharma NV) and amending Implementing Regulation (EU) 2015/2305'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/262 de la Commission du 17 janvier
    2024 concernant le renouvellement de l’autorisation d’une préparation d’endo–1,4-bêta-glucanase
    produite par Trichoderma citrinoviride IMI 360748 en tant qu’additif pour l’alimentation
    des poulets d’engraissement, des espèces mineures de volailles destinées à
    l’engraissement et des porcelets sevrés, ainsi que l’autorisation de cette
    préparation en tant qu’additif pour l’alimentation des dindes d’engraissement,
    de toutes les espèces de volailles élevées pour la ponte ou la reproduction,
    des oiseaux d’ornement et des porcelets non sevrés (titulaire de l’autorisation:
    Huvepharma NV) et modifiant le règlement d’exécution (UE) 2015/2305'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/262 der Kommission vom 17. Januar 2024
    zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,4-beta-Glucanase,
    gewonnen aus Trichoderma citrinoviride IMI 360748, als Futtermittelzusatzstoff
    für Masthühner, Mastgeflügelarten von geringerer wirtschaftlicher Bedeutung
    und Absetzferkel, zur Zulassung dieser Zubereitung als Futtermittelzusatzstoff
    für Masttruthühner, alle Lege- und Zuchtgeflügelarten, Ziervögel und Saugferkel
    (Zulassungsinhaber: Huvepharma NV) sowie zur Änderung der Durchführungsverordnung
    (EU) 2015/2305'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2024/262 на Комисията
    от 17 януари 2024 година за подновяване на разрешаването
    на употребата на препарат от ендо–1,4-бета-глюканаза,
    получена от Trichoderma citrinoviride IMI 360748, като фуражна
    добавка за пилета за угояване, видове домашни
    птици с по-малко стопанско значение за угояване,
    и отбити прасенца, разрешаването на посочения
    препарат като фуражна добавка за пуйки за угояване,
    всички видове домашни птици, отглеждани за
    носачки или за разплод, декоративни птици и
    прасенца сукалчета (притежател на разрешението:
    Huvepharma NV) и за изменение на Регламент за изпълнение
    (ЕС) 2015/2305'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/262 ze dne 17. ledna 2024 o
    obnovení povolení přípravku endo–1,4-beta-glukanázy z Trichoderma citrinoviride
    IMI 360748 jako doplňkové látky pro výkrm kuřat, výkrm menšinových druhů
    drůbeže a odstavená selata, o povolení uvedeného přípravku jako doplňkové
    látky pro výkrm krůt, odchov všech druhů drůbeže, okrasné ptactvo a sající
    selata (držitel povolení: Huvepharma NV) a o změně prováděcího nařízení
    (EU) 2015/2305'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2024/262 af 17. januar 2024
    om forlængelse af godkendelsen af et præparat af endo–1,4-beta-glucanase produceret
    af Trichoderma citrinoviride IMI 360748 som fodertilsætningsstof til slagtekyllinger,
    til mindre udbredte fjerkræarter bestemt til opfedning og til fravænnede smågrise
    og om godkendelse af dette præparat som fodertilsætningsstof til slagtekalkuner,
    til alle fjerkræarter opdrættet til æglægning eller avl, til prydfugle og
    til pattegrise (indehaver af godkendelsen: Huvepharma NV) og om ændring af gennemførelsesforordning
    (EU) 2015/2305'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2024/262 της Επιτροπής,
    της 17ης Ιανουαρίου 2024, για την ανανέωση της
    άδειας παρασκευάσματος ενδο–1,4-β-γλυκανάσης
    που παράγεται από Trichoderma citrinoviride (IM 360748) ως πρόσθετης
    ύλης ζωοτροφών για κοτόπουλα προς πάχυνση,
    μικρά είδη πουλερικών προς πάχυνση και απογαλακτισμένα
    χοιρίδια, τη χορήγηση άδειας για χρήση του
    εν λόγω παρασκευάσματος ως πρόσθετης ύλης
    ζωοτροφών για γαλοπούλες προς πάχυνση, για
    όλα τα είδη πουλερικών προς ωοπαραγωγή ή αναπαραγωγή,
    διακοσμητικά πτηνά και θηλάζοντα χοιρίδια
    (κάτοχος της άδειας: Huvepharma NV) και για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) 2015/2305'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2024/262, 17. jaanuar 2024, milles käsitletakse
    Trichoderma citrinoviride (IMI 360748) abil toodetud endo–1,4-β-glükanaasi
    preparaadi broilerkanade, vähem tähtsate kodulinnuliikide nuumlindude ja võõrdepõrsaste
    söödalisandina kasutamise loa kehtivuse pikendamist, loa andmist kõnealuse
    preparaadi kasutamiseks broilerkalkunite, kõigi kodulinnuliikide muna- või aretuslindude,
    dekoratiivlindude ja piimapõrsaste söödalisandina (loa hoidja: Huvepharma NV)
    ja millega muudetakse rakendusmäärust (EL) 2015/2305'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2024/262, annettu 17 päivänä
    tammikuuta 2024, Trichoderma citrinoviride IMI 360748 -organismin tuottamaa endo–1,4-beeta-glukanaasia
    sisältävän valmisteen hyväksynnän uusimisesta broilerien, toissijaisten lihasiipikarjalajien
    ja vieroitettujen porsaiden rehun lisäaineena sekä kyseisen valmisteen hyväksymisestä
    lihakalkkunoiden, kaikkien munantuotantoa varten tai siitoseläimiksi kasvatettavien
    siipikarjalajien, koristetarkoituksessa pidettävien lintujen ja imevien porsaiden
    rehun lisäaineena (hyväksynnän haltija: Huvepharma NV) ja täytäntöönpanoasetuksen
    (EU) 2015/2305 muuttamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2024/262 ón gCoimisiún an 17 Eanáir
    2024 maidir le húdarú ullmhóide d’ion–1,4-béite-ghlúcanáis arna táirgeadh
    ag Trichoderma citrinoviride IMI 360748 a athnuachan mar bhreiseán beathaithe
    le haghaidh sicíní lena ramhrú, mionspeicis éanlaithe clóis lena ramhrú
    agus bainbh scoite, údarú na hullmhóide sin mar bhreiseán beathaithe le haghaidh
    turcaithe lena ramhrú, gach speicis éanlaithe clóis a thógtar le bheith ina
    bhéaróg nó le haghaidh pórúcháin, éin ornáideacha agus bainbh dhiúil
    (sealbhóir an údaraithe: Huvepharma NV) agus lena leasaítear Rialachán Cur
    Chun Feidhme (AE) 2015/2305'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2024/262 оd 17. siječnja 2024. o produljenju
    odobrenja pripravka endo–1,4-beta-glukanaze dobivene od Trichoderma citrinoviride
    IMI 360748 kao dodatka hrani za piliće za tov, manje značajne vrste peradi za
    tov i odbijenu prasad, o odobrenju tog pripravka kao dodatka hrani za pure za
    tov, sve vrste peradi uzgajane za nesenje ili za rasplod, ukrasne ptice i prasad
    (nositelj odobrenja: Huvepharma NV) te o izmjeni Provedbene uredbe (EU) 2015/2305'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2024/262 végrehajtási rendelete (2024. január 17.)
    a Trichoderma citrinoviride IMI 360748 által termelt endo–1,4-béta-glükanázt
    tartalmazó készítmény brojlercsirkék, kevésbé jelentős hízóbaromfifajok
    és elválasztott malacok takarmány-adalékanyagaként való engedélyezésének
    megújításáról, e készítmény hízópulykák, valamennyi tojó-vagy tenyészbaromfinak
    nevelt baromfi, díszmadarak és szopós malacok takarmány-adalékanyagaként
    történő engedélyezésének megújításáról (az engedély jogosultja: Huvepharma
    NV) és az (EU) 2015/2305 végrehajtási rendelet módosításáról'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2024/262 della Commissione, del 17 gennaio
    2024, relativo al rinnovo dell’autorizzazione di un preparato di endo–1,4-beta-glucanasi
    prodotto da Trichoderma citrinoviride IMI 360748 come additivo per mangimi destinati
    a polli da ingrasso, specie avicole minori da ingrasso e suinetti svezzati, all’autorizzazione
    di tale preparato come additivo per mangimi destinati a tacchini da ingrasso,
    tutte le specie di pollame allevate per la produzione di uova o per la riproduzione,
    uccelli ornamentali e suinetti lattanti (titolare dell’autorizzazione: Huvepharma
    NV) e recante modifica del regolamento di esecuzione (UE) 2015/2305'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2024/262 (2024. gada 17. janvāris),
    ar ko atjauno atļauju Trichoderma citrinoviride IMI 360748 producētas endo–1,4-beta-glikanāzes
    preparātu lietot par barības piedevu gaļas cāļiem, mazāk izplatītu sugu
    gaļas mājputniem un atšķirtiem sivēniem, atļauj minēto preparātu lietot
    par barības piedevu gaļas tītariem, visu sugu dējējputniem vai vaislas mājputniem,
    dekoratīvajiem putniem un zīdāmiem sivēniem (atļaujas turētājs: Huvepharma
    NV) un groza Īstenošanas regulu (ES) 2015/2305'
  type: main
- language: lt
  script: Latn
  content: 2024 m. sausio 17 d. Komisijos įgyvendinimo reglamentas (ES) 2024/262
    dėl leidimo naudoti endo–1,4-beta-gliukanazės, gautos iš Trichoderma citrinoviride
    IMI 360748, preparatą kaip mėsinių viščiukų, retesnių rūšių mėsinių
    naminių paukščių ir nujunkytų paršelių pašarų priedą atnaujinimo ir
    dėl leidimo naudoti šį preparatą kaip penimų kalakutų, visų rūšių dedeklinių
    ar veislinių naminių paukščių, dekoratyvinių paukščių ir žindomų paršelių
    pašarų priedą (leidimo turėtoja – bendrovė Huvepharma NV), kuriuo iš dalies
    keičiamas Įgyvendinimo reglamentas (ES) 2015/2305
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/262 tas-17
    ta’ Jannar 2024 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparat ta’ endo–1,4-beta-glukanażi
    prodotta mit-Trichoderma citrinoviride IMI 360748 bħala addittiv tal-għalf għat-tiġieġ
    għas-simna, għall-ispeċijiet minuri ta’ pollam għas-simna u għall-qżieqeż
    miftuma, l-awtorizzazzjoni ta’ dak il-preparat bħala addittiv tal-għalf għad-dundjani
    għas-simna, għall-ispeċijiet kollha ta’ pollam imrobbija għall-bajd jew
    għat-tnissil, għall-għasafar ornamentali u għad-driefeġ tal-ħalib (id-detentur
    tal-awtorizzazzjoni: Huvepharma NV) u li jemenda r-Regolament ta’ Implimentazzjoni
    (UE) 2015/2305'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2024/262 van de Commissie van 17 januari 2024
    tot verlenging van de vergunning voor een preparaat van endo-1,4-bèta-glucanase,
    geproduceerd door Trichoderma citrinoviride IMI 360748, als toevoegingsmiddel
    voor diervoeding voor mestkippen, minder gangbare pluimveesoorten gehouden voor
    mestdoeleinden en gespeende biggen, tot verlening van een vergunning voor dat
    preparaat als toevoegingsmiddel voor diervoeding voor mestkalkoenen, alle pluimveesoorten
    opgefokt voor leg- of fokdoeleinden, siervogels en speenvarkens (vergunninghouder:
    Huvepharma nv) en tot wijziging van Uitvoeringsverordening (EU) 2015/2305'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2024/262 z dnia 17 stycznia 2024
    r. dotyczące odnowienia zezwolenia na stosowanie preparatu endo–1,4-beta-glukanazy
    wytwarzanej przez Trichoderma citrinoviride IMI 360748 jako dodatku paszowego
    dla kurcząt rzeźnych, podrzędnych gatunków drobiu rzeźnego i prosiąt odsadzonych
    od maciory, oraz zezwolenia na stosowanie tego preparatu jako dodatku paszowego
    dla indyków rzeźnych, wszystkich gatunków drobiu odchowywanego na nioski lub
    w celach hodowlanych, ptaków ozdobnych i prosiąt ssących (posiadacz zezwolenia:
    Huvepharma NV) i zmieniające rozporządzenie wykonawcze (UE) 2015/2305'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2024/262 da Comissão, de 17 de janeiro
    de 2024, relativo à renovação da autorização de uma preparação de endo–1,4-beta-glucanase
    produzida por Trichoderma citrinoviride IMI 360748 como aditivo em alimentos para
    frangos de engorda, espécies menores de aves de capoeira de engorda e leitões
    desmamados, à autorização dessa preparação como aditivo em alimentos para
    perus de engorda, todas as espécies de aves de capoeira criadas para postura
    ou reprodução, aves ornamentais e leitões não desmamados (detentor da autorização:
    Huvepharma NV) e que altera o Regulamento de Execução (UE) 2015/2305'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2024/262 al Comisiei din 17 ianuarie
    2024 privind reînnoirea autorizării unui preparat de endo–1,4-beta-glucanază
    produsă de Trichoderma citrinoviride IMI 360748 ca aditiv pentru hrana puilor
    pentru îngrășare, a speciilor minore de păsări de curte pentru îngrășare
    și a purceilor înțărcați, autorizarea preparatului respectiv ca aditiv pentru
    hrana curcanilor pentru îngrășare, a tuturor speciilor de păsări de curte
    crescute pentru ouat sau reproducție, a păsărilor ornamentale și a purceilor
    de lapte (titularul autorizației: Huvepharma NV) și de modificare a Regulamentului
    de punere în aplicare (UE) 2015/2305'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2024/262 zo 17. januára 2024 o
    obnovení povolenia prípravku s obsahom endo–1,4-beta-glukanázy produkovanej
    hubou Trichoderma citrinoviride IMI 360748 ako kŕmnej doplnkovej látky pre kurčatá
    vo výkrme, menej významné druhy hydiny vo výkrme a odstavené prasiatka, o
    povolení uvedeného prípravku ako kŕmnej doplnkovej látky pre morky vo výkrme,
    všetky druhy hydiny chované na znášku alebo na plemeno, okrasné vtáky a
    ciciaky (držiteľ povolenia: Huvepharma NV) a zmene vykonávacieho nariadenia
    (EÚ) 2015/2305'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2024/262 z dne 17. januarja 2024 o podaljšanju
    dovoljenja za pripravek iz endo–1,4-beta-glukanaze, ki jo proizvaja Trichoderma
    citrinoviride IMI 360748, kot krmni dodatek za piščance za pitanje, manj pomembne
    vrste perutnine za pitanje in za odstavljene pujske, dovoljenja za navedeni pripravek
    kot krmni dodatek za purane za pitanje, vse vrste perutnine za nesnice ali razplod,
    okrasne ptice in sesne pujske (imetnik dovoljenja: Huvepharma NV) ter spremembi
    Izvedbene uredbe (EU) 2015/2305'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2024/262 de la Comisión, de 17 de enero
    de 2024, relativo a la renovación de la autorización de un preparado de endo–1,4-beta-glucanasa
    producido por Trichoderma citrinoviride IMI 360748 como aditivo en piensos para
    pollos de engorde, especies menores de aves de corral de engorde y lechones destetados,
    la autorización de dicho preparado como aditivo en piensos para pavos de engorde,
    todas las especies de aves de corral criadas para puesta o reproducción, aves
    ornamentales y lechones lactantes (titular de la autorización: Huvepharma NV)
    y por el que se modifica el Reglamento de Ejecución (UE) 2015/2305'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2024/262 av den 17 januari
    2024 om förlängning av godkännandet av ett preparat av endo–1,4-beta-glukanas
    framställt av Trichoderma citrinoviride IMI 360748 som fodertillsats för slaktkycklingar,
    mindre vanligt förekommande fjäderfäarter avsedda för slakt och avvanda smågrisar,
    godkännandet av preparatet som fodertillsats för slaktkalkoner, alla fjäderfäarter
    som föds upp för värpning eller avel, burfåglar och diande smågrisar (innehavare
    av godkännandet: Huvepharma NV) och ändring av genomförandeförordning (EU)
    2015/2305'
  type: main
