title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 juin 1972, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer le relèvement
    des droits de leur tarif douanier vers ceux du Tarif douanier commun en ce qui
    concerne les tabacs fabriqués des sous-positions tarifaires 24.02 A, B, C et
    D
  type: main
- language: de
  script: Latn
  content: '72/256/EWG: Entscheidung der Kommission vom 26. Juni 1972, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die Angleichung (Erhöhung) der Zollsätze ihrer Zolltarife
    an die des Gemeinsamen Zolltarifs für verarbeiteten Tabak der Tarifstellen 24.02
    A, B, C und D aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '72/256/CEE: Decisione della Commissione, del 26 giugno 1972, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    a differire l''aumento dei dazi della propria tariffa doganale comune, per quanto
    concerne i tabacchi lavorati di cui alle sottovoci tariffarie 24.02 A, B, C e
    D'
  type: main
- language: nl
  script: Latn
  content: '72/256/EEG: Beschikking van de Commissie van 26 juni 1972 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd de aanpassing van de rechten van hun douanetarief aan die van
    het gemeenschappelijk douanetarief uit te stellen voor tabaksfabrikaten van de
    onderverdelingen 24.02 A, B, C en D'
  type: main
