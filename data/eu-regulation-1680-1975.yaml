title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1680/75 of the Commission of 30 June 1975 amending
    and extending the period of application of Regulation (EEC) No 2967/74 establishing
    Community surveillance over imports of certain stockings made from acrylic fibres,
    originating in the Republic of Korea or Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1680/75 de la Commission, du 30 juin 1975, prorogeant
    et modifiant le règlement (CEE) n° 2967/74 portant instauration d'une surveillance
    communautaire des importations de bas en fibres acryliques originaires de la République
    de Corée et de Taiwan
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1680/75 der Kommission vom 30. Juni 1975 zur Verlängerung
    und Änderung der Verordnung (EWG) Nr. 2967/74 zur gemeinschaftlichen Einfuhrüberwachung
    gewisser Strümpfe aus Acrylfasern mit Ursprung in der Republik Korea und Taiwan
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1680/75 af 30. juni 1975 om forlængelse
    og ændring af forordning (EØF) nr. 2967/74 om indførelse af fællesskabstilsyn
    med indførslerne af visse strømper af acrylfiber med oprindelse i republikken
    Korea eller Taiwan
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1680/75 della Commissione, del 30 giugno 1975, che
    proroga e modifica il regolamento (CEE) n. 2967/74 che instaura una sorveglianza
    comunitaria delle importazioni di taluni tipi di calze in fibre sintetiche originarie
    della Repubblica di Corea e di Taiwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1680/75 van de Commissie van 30 juni 1975 tot verlenging
    en wijziging van Verordening (EEG) nr. 2967/74 houdende instelling van een communautair
    toezicht op de invoer van bepaalde kousen van acrylvezels van oorsprong uit de
    Republiek Korea en uit Tai-wan
