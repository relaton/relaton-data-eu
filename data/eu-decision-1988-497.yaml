title:
- language: en
  script: Latn
  content: '88/497/EEC: Commission Decision of 13 September 1988 repealing Decision
    87/107/EEC on the duty-free importation of goods intended to be distributed or
    made available free of charge to victims of the earthquake which occurred in September
    1986 in the Hellenic Republic (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/497/CEE: Décision de la Commission du 13 septembre 1988 abrogeant
    la décision 87/107/CEE relative à l''admission en franchise des droits à l''importation
    de marchandises destinées à être distribuées ou mises gratuitement à la disposition
    des victimes du tremblement de terre survenu en Grèce en septembre 1986 (Le texte
    en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/497/EWG: Entscheidung der Kommission vom 13. September 1988 zur Aufhebung
    der Entscheidung 87/107/EWG über die Befreiung von Eingangsabgaben für bestimmte
    Waren, die an die von dem im September 1986 in Griechenland aufgetretenen Erdbeben
    betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich zur Verfügung
    gestellt werden sollen (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/497/EØF: Kommissionens beslutning af 13. september 1988 om ophævelse
    af beslutning 87/107/EØF om fritagelse for told ved indførsel af varer, der
    er bestemt til gratis udlevering til eller gratis bliver stillet til rådighed
    for ofrene for jordskælvene i september 1986 i Den Hellenske Republik (Kun den
    graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/497/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Σεπτεμβρίου 1988 που καταργεί την απόφαση 87/107/ΕΟΚ
    περί εισαγωγής, με ατέλεια δασμών, των εμπορευμάτων
    τα οποία προορίζονται να διανεμηθούν ή να διατεθούν
    δωρεάν στα θύματα του σεισμού που έπληξε την
    Ελλάδα τον Σεπτέμβριο του 1986 (Το κείμενο στην
    ελληνική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/497/CEE: Decisione della Commissione del 13 settembre 1988 che abroga
    la decisione 87/107/CEE, relativa all''ammissione in franchigia dai diritti all''importazione
    di merci destinate ad essere distribuite o messe gratuitamente a disposizione
    delle vittime del terremoto avvenuto nella Repubblica ellenica nel settembre 1986
    (Il testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/497/EEG: Beschikking van de Commissie van 13 september 1988 tot intrekking
    van Beschikking 87/107/EEG betreffende de invoer met vrijstelling van rechten
    van goederen, bestemd om gratis te worden verstrekt of ter beschikking gesteld
    aan de slachtoffers van de in september 1986 voorgevallen aardbeving in de Helleense
    Republiek (Slechts de tekst in de Griekse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/497/CEE: Decisão da Comissão de 13 de Setembro de 1988 que revoga
    a Decisão 87/107/CEE relativa à importação com franquia de direitos de importação
    de mercadorias destinadas a serem distribuídas ou postas à disposição a título
    gratuito das vítimas do tremor de terra ocorrido na Grécia em Setembro de 1986
    (Apenas faz fé o texto em língua grega)'
  type: main
- language: es
  script: Latn
  content: '88/497/CEE: Decisión de la Comisión de 13 de septiembre de 1988 por
    la que se deroga la Decisión 87/107/CEE relativa a la admisión con franquicia
    de derechos de importación de mercancías destinadas a ser distribuidas o puestas
    gratuitamente a disposición de las víctimas del terremoto que afectó a la República
    Helénica en septiembre de 1986 (El texto en lengua griega es el único auténtico)'
