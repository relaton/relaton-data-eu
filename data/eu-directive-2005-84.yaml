    dos Estados-Membros respeitantes à limitação da colocação no mercado e da
    utilização de determinadas substâncias e preparações perigosas (ftalatos
    nos brinquedos e artigos de puericultura)
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/84/CE a Parlamentului European și a Consiliului din 14
