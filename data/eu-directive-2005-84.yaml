title:
- language: en
  script: Latn
  content: Directive 2005/84/EC of the European Parliament and of the Council of 14
    December 2005 amending for the 22nd time Council Directive 76/769/EEC on the approximation
    of the laws, regulations and administrative provisions of the Member States relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (phthalates in toys and childcare articles)
  type: main
- language: fr
  script: Latn
  content: Directive 2005/84/CE du Parlement européen et du Conseil du 14 décembre
    2005 modifiant pour la vingt-deuxième fois la directive 76/769/CEE du Conseil
    concernant le rapprochement des dispositions législatives, réglementaires et
    administratives des États membres relatives à la limitation de la mise sur le
    marché et de l’emploi de certaines substances et préparations dangereuses
    (phtalates dans les jouets et les articles de puériculture)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/84/EG des Europäischen Parlaments und des Rates vom 14.
    Dezember 2005 zur 22. Änderung der Richtlinie 76/769/EWG des Rates zur Angleichung
    der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten betreffend Beschränkungen
    des Inverkehrbringens und der Verwendung gewisser gefährlicher Stoffe und Zubereitungen
    (Phthalate in Spielzeug und Babyartikeln)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2005/84/ЕО на Европейския парламент
    и на Съвета от 14 декември 2005 година относно
    двадесет и второ изменение на Директива 76/769/ЕИО
    на Съвета за сближаването на законовите, подзаконовите
    и административните разпоредби на държавите-членки
    относно ограниченията за пускането на пазара
    и употребата на някои опасни вещества и препарати
    (фталати в играчки и артикули за деца)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2005/84/ES ze dne 14. prosince
