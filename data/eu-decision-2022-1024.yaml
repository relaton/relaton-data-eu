- language: en
  script: Latn
  content: Council Decision (EU) 2022/1024 of 7 April 2022 on the position to be taken
    on behalf of the European Union at the Conference of the Parties to the Rotterdam
    Convention on the Prior Informed Consent Procedure for certain hazardous chemicals
    and pesticides in international trade as regards amendments of Annex III to that
    Convention
  type: main
- language: fr
  script: Latn
