---
id: EUDecision2013707
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "(2013/707/EU): Commission Implementing Decision of 4 December 2013 confirming the acceptance of an undertaking offered in connection with the anti-dumping and anti-subsidy proceedings concerning imports of crystalline silicon photovoltaic modules and key components (i.e. cells) originating in or consigned from the People's Republic of China for the period of application of definitive measures"
  type: main
- language: fr
  script: Latn
  content: "(2013/707/UE): Décision d'exécution de la Commission du 4 décembre 2013 confirmant l'acceptation d'un engagement offert dans le cadre des procédures antidumping et antisubventions concernant les importations de modules photovoltaïques en silicium cristallin et leurs composants essentiels (cellules) originaires ou en provenance de la République populaire de Chine pour la période d'application des mesures définitives"
  type: main
- language: de
  script: Latn
  content: "(2013/707/EU): Durchführungsbeschluss der Kommission vom 4. Dezember 2013 zur Bestätigung der Annahme eines Verpflichtungsangebots im Zusammenhang mit dem Antidumping- und dem Antisubventionsverfahren betreffend die Einfuhren von Fotovoltaik-Modulen aus kristallinem Silicium und Schlüsselkomponenten davon (Zellen) mit Ursprung in oder versandt aus der Volksrepublik China für die Geltungsdauer der endgültigen Maßnahmen"
  type: main
- language: bg
  script: Cyrl
  content: "(2013/707/ЕС): Решение за изпълнение на Комисията от 4 декември 2013 година за потвърждаване приемането на ангажимент, предложен във връзка с антидъмпинговата и антисубсидийната процедура относно вноса на кристални силициеви фотоволтаични модули и ключови компоненти (т.е. елементи) с произход или изпратени от Китайската народна република, за периода на прилагане на окончателни мерки"
  type: main
- language: cs
  script: Latn
  content: "(2013/707/EU): Prováděcí rozhodnutí Komise ze dne 4. prosince 2013 , kterým se potvrzuje přijetí závazku nabídnutého v souvislosti s antidumpingovým a antisubvenčním řízením týkajícím se dovozu krystalických křemíkových fotovoltaických modulů a jejich klíčových komponentů (tj. článků) pocházejících nebo odesílaných z Čínské lidové republiky po dobu uplatňování konečných opatření"
  type: main
- language: da
  script: Latn
  content: "(2013/707/EU): Kommissionens gennemførelsesafgørelse af 4. december 2013 om bekræftelse af godtagelse af et tilsagn afgivet i forbindelse med antidumpingproceduren og antisubsidieproceduren vedrørende importen af fotovoltaiske moduler af krystallinsk silicium og nøglekomponenter hertil (dvs. celler) med oprindelse i eller afsendt fra Folkerepublikken Kina i de endelige foranstaltningers anvendelsesperiode"
  type: main
- language: el
  script: Grek
  content: "(2013/707/ΕΕ): Εκτελεστική απόφαση της Επιτροπής, της 4ης Δεκεμβρίου 2013 , για τη βεβαίωση της αποδοχής ανάληψης υποχρέωσης που προτάθηκε στο πλαίσιο των διαδικασιών αντιντάμπινγκ και κατά των επιδοτήσεων όσον αφορά τις εισαγωγές φωτοβολταϊκών συστοιχιών κρυσταλλικού πυριτίου και βασικών συστατικών στοιχείων (δηλαδή κυψελών) καταγωγής ή προέλευσης Λαϊκής Δημοκρατίας της Κίνας κατά την περίοδο εφαρμογής των οριστικών μέτρων"
  type: main
- language: et
  script: Latn
  content: "(2013/707/EL): Komisjoni rakendusotsus, 4. detsember 2013 , millega kinnitatakse pakutud hinnakohustus, mis on seotud Hiina Rahvavabariigist pärit või sealt saadetud kristalsest ränist fotoelektriliste moodulite ja nende põhikomponentide (elementide) importi käsitlevate dumpingu- ja subsiidiumivastaste menetlustega, lõplike meetmete kohaldamise ajaks"
  type: main
- language: fi
  script: Latn
  content: "(2013/707/EU): Komission täytäntöönpanopäätös, annettu 4 päivänä joulukuuta 2013 , Kiinan kansantasavallasta peräisin olevien tai sieltä lähetettyjen kiteisestä piistä valmistettujen aurinkosähkömoduulien ja niiden keskeisten komponenttien (kennot) tuontia koskevassa polkumyynnin ja tukien vastaisessa menettelyssä tarjotun sitoumuksen hyväksymisen vahvistamisesta lopullisten toimenpiteiden soveltamiskauden ajaksi"
  type: main
- language: hr
  script: Latn
  content: "(2013/707/EU): Provedbena odluka Komisije оd 4. prosinca 2013. o potvrdi prihvaćanje preuzete obveze u vezi s antidampinškim i antisubvencijskim mjerama koje se odnose na uvoz kristalnih silicijskih fotonaponskih modula i ključnih elemenata (tj. ćelija) podrijetlom ili poslanih iz Narodne Republike Kine za vrijeme primjene konačnih mjera"
  type: main
- language: hu
  script: Latn
  content: "(2013/707/EU): Bizottság végrehajtási határozata ( 2013. december 4. ) a Kínai Népköztársaságból származó vagy ott feladott kristályos szilícium fotovillamos modulok és alapvető részeik (azaz elemek) behozatalára vonatkozó dömpingellenes és szubvencióellenes eljárásokkal kapcsolatban a végleges intézkedések alkalmazási időszaka tekintetében felajánlott kötelezettségvállalás elfogadásának megerősítéséről"
  type: main
- language: it
  script: Latn
  content: "(2013/707/UE): Decisione di esecuzione della Commissione, del 4 dicembre 2013 , relativa alla conferma dell'accettazione di un impegno offerto in relazione ai procedimenti antidumping e antisovvenzioni relativi alle importazioni di moduli fotovoltaici in silicio cristallino e delle relative componenti essenziali (celle) originari o provenienti dalla Repubblica popolare cinese per il periodo di applicazione di misure definitive"
  type: main
- language: lv
  script: Latn
  content: "(2013/707/ES): Komisijas Īstenošanas lēmums ( 2013. gada 4. decembris ), ar ko apstiprina tādu saistību pieņemšanu, kuras piedāvātas saistībā ar antidempinga un antisubsidēšanas procedūru attiecībā uz Ķīnas Tautas Republikas izcelsmes vai no Ķīnas Tautas Republikas nosūtītu kristāliskā silīcija fotoelektrisko moduļu un to galveno sastāvdaļu (proti, elementu) importu galīgo pasākumu piemērošanas periodā"
  type: main
- language: lt
  script: Latn
  content: "(2013/707/ES): 2013 m. gruodžio 4 d. Komisijos įgyvendinimo sprendimas, kuriuo patvirtinamas pasiūlyto įsipareigojimo, susijusio su antidempingo ir antisubsidijų tyrimais dėl importuojamų Kinijos Liaudies Respublikos kilmės arba iš Kinijos Liaudies Respublikos siunčiamų fotovoltinių modulių iš kristalinio silicio ir jų pagrindinių sudėtinių dalių (t. y. elementų), priėmimas galutinių priemonių taikymo laikotarpiui"
  type: main
- language: mt
  script: Latn
  content: "(2013/707/UE): Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni tal- 4 ta' Diċembru 2013 li tikkonferma l-aċċettazzjoni ta' impenn offrut b'rabta mal-proċedimenti ta' anti-dumping u antisussidji li jikkonċernaw l-importazzjonijiet ta' moduli fotovoltajċi bis-silikon kristallin u l-komponenti ewlenin (jiġifieri ċ-ċelloli) li joriġinaw jew jintbagħtu mir-Repubblika Popolari taċ-Ċina għall-perjodu ta' applikazzjoni ta' miżuri definittivi"
  type: main
- language: nl
  script: Latn
  content: "(2013/707/EU): Uitvoeringsbesluit van de Commissie van 4 december 2013 tot bevestiging van de aanvaarding van een verbintenis die is aangeboden in het kader van de antidumping- en de antisubsidieprocedure betreffende de invoer van fotovoltaïsche modules van kristallijn silicium en de belangrijkste componenten daarvan (cellen) van oorsprong uit of verzonden uit de Volksrepubliek China voor de periode waarin de definitieve maatregelen worden toegepast"
  type: main
- language: pl
  script: Latn
  content: "(2013/707/UE): Decyzja wykonawcza Komisji z dnia 4 grudnia 2013 r. potwierdzająca przyjęcie zobowiązania złożonego w związku z postępowaniem antydumpingowym i postępowaniem antysubsydyjnym dotyczącym przywozu modułów fotowoltaicznych z krzemu krystalicznego i głównych komponentów (tj. ogniw) pochodzących lub wysyłanych z Chińskiej Republiki Ludowej na okres obowiązywania środków ostatecznych"
  type: main
- language: pt
  script: Latn
  content: "(2013/707/UE): Decisão de Execução da Comissão, de 4 de dezembro de 2013 , que confirma a aceitação de um compromisso oferecido no âmbito dos processos anti-dumping e antissubvenções relativos às importações de módulos fotovoltaicos de silício cristalino e de componentes-chave (ou seja, células) originários ou expedidos da República Popular da China durante o período de aplicação das medidas definitivas"
  type: main
- language: ro
  script: Latn
  content: "(2013/707/UE): Decizia de punere în aplicare a Comisiei din 4 decembrie 2013 de confirmare a acceptării unui angajament oferit în legătură cu procedurile antidumping și antisubvenție privind importurile de module fotovoltaice pe bază de siliciu cristalin și componentele lor cheie (și anume celule) originare sau expediate din Republica Populară Chineză pentru perioada de aplicare a măsurilor definitive"
  type: main
- language: sk
  script: Latn
  content: "(2013/707/EÚ): Vykonávacie rozhodnutie Komisie zo 4. decembra 2013 , ktorým sa potvrdzuje prijatie záväzku ponúknutého v súvislosti s antidumpingovým konaním a antisubvenčným konaním, ktoré sa týkajú dovozu fotovoltických modulov na báze kryštalického kremíka a hlavných komponentov (t. j. článkov) s pôvodom v Čínskej ľudovej republike alebo odosielaných z Čínskej ľudovej republiky na obdobie uplatňovania konečných opatrení"
  type: main
- language: sl
  script: Latn
  content: "(2013/707/EU): Izvedbeni sklep Komisije z dne 4. decembra 2013 o potrditvi sprejetja zaveze, ponujene v okviru protidampinškega in protisubvencijskega postopka v zvezi z uvozom fotonapetostnih modulov iz kristalnega silicija in njihovih ključnih sestavnih delov (tj. celic) s poreklom iz Ljudske republike Kitajske ali ki so od tam poslani, za obdobje uporabe dokončnih ukrepov"
  type: main
- language: es
  script: Latn
  content: "(2013/707/UE): Decisión de Ejecución de la Comisión, de 4 de diciembre de 2013 , que confirma la aceptación de un compromiso propuesto en relación con los procedimientos antidumping y antisubvenciones relativos a las importaciones de módulos fotovoltaicos de silicio cristalino y componentes clave (como células) originarios o procedentes de la República Popular China durante el período de aplicación de las medidas definitivas"
  type: main
- language: sv
  script: Latn
  content: "(2013/707/EU): Kommissionens genomförandebeslut av den 4 december 2013 som bekräftar godtagande av ett åtagande som erbjudits i samband med antidumpnings- och antisubventionsförfarandena avseende import av solcellsmoduler av kristallint kisel och väsentliga komponenter (dvs. celler) med ursprung i eller avsända från Folkrepubliken Kina under giltighetsperioden för slutgiltiga åtgärder"
  type: main
