    uz tirdzniecības standartiem, kas piemērojami augļu un dārzeņu nozarē, dažiem
    augļu un dārzeņu pārstrādes produktiem un banānu nozarē, un atceļ Komisijas
    Regulu (EK) Nr. 1666/1999 un Komisijas Īstenošanas regulas (ES) Nr. 543/2011
    un (ES) Nr. 1333/2011
  type: main
- language: lt
  script: Latn
  content: 2023 m. rugpjūčio 17 d. Komisijos deleguotasis reglamentas (ES) 2023/2429,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 1308/2013 papildomas
    vaisių ir daržovių sektoriaus, tam tikrų perdirbtų vaisių ir daržovių
    produktų bei bananų sektoriaus prekybos standartais ir panaikinamas Komisijos
    reglamentas (EB) Nr. 1666/1999 ir Komisijos įgyvendinimo reglamentai (ES) Nr.
    543/2011 ir (ES) Nr. 1333/2011
  type: main
- language: mt
  script: Latn
