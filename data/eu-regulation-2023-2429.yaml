  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/2429 van de Commissie van 17 augustus
    2023 tot aanvulling van Verordening (EU) nr. 1308/2013 van het Europees Parlement
    en de Raad wat betreft de handelsnormen voor de sector groenten en fruit, bepaalde
    verwerkte groente- en fruitproducten en de sector bananen en tot intrekking van
    Verordening (EG) nr. 1666/1999 van de Commissie en de Uitvoeringsverordeningen
    (EU) nr. 543/2011 en (EU) nr. 1333/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/2429 z dnia 17 sierpnia 2023
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1308/2013
    w odniesieniu do norm handlowych dotyczących sektora owoców i warzyw, niektórych
    przetworów owocowych i warzywnych oraz sektora bananów oraz uchylające rozporządzenie
    Komisji (WE) nr 1666/1999 oraz rozporządzenia wykonawcze Komisji (UE) nr 543/2011
    i (UE) nr 1333/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/2429 da Comissão, de 17 de agosto de 2023,
    que complementa o Regulamento (UE) n.o 1308/2013 do Parlamento Europeu e do Conselho
    no respeitante às normas de comercialização aplicáveis ao setor das frutas
    e produtos hortícolas, a determinados produtos transformados à base de frutas
    e produtos hortícolas e ao setor das bananas, e que revoga o Regulamento (CE)
    n.o 1666/1999 da Comissão e os Regulamentos de Execução (UE) n.o 543/2011 e
    (UE) n.o 1333/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/2429 al Comisiei din 17 august 2023 de completare
    a Regulamentului (UE) nr. 1308/2013 al Parlamentului European și al Consiliului
    în ceea ce privește standardele de comercializare pentru sectorul fructelor
    și legumelor, pentru anumite produse din fructe și legume prelucrate și pentru
    sectorul bananelor și de abrogare a Regulamentului (CE) nr. 1666/1999 al Comisiei
    și a Regulamentelor de punere în aplicare (UE) nr. 543/2011 și (UE) nr. 1333/2011
    ale Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/2429 zo 17. augusta 2023, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1308/2013, pokiaľ
    ide o obchodné normy pre sektor ovocia a zeleniny, určité výrobky zo spracovaného
    ovocia a zeleniny a sektor banánov, a ktorým sa zrušuje nariadenie Komisie
    (ES) č. 1666/1999 a vykonávacie nariadenia Komisie (EÚ) č. 543/2011 a (EÚ)
    č. 1333/2011
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/2429 z dne 17. avgusta 2023 o dopolnitvi
    Uredbe (EU) št. 1308/2013 Evropskega parlamenta in Sveta v zvezi s tržnimi standardi
    za sektor sadja in zelenjave, nekatere proizvode iz predelanega sadja in zelenjave
    ter sektor banan in o razveljavitvi Uredbe Komisije (ES) št. 1666/1999 ter izvedbenih
    uredb Komisije (EU) št. 543/2011 in (EU) št. 1333/2011
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/2429 de la Comisión, de 17 de agosto de
    2023, por el que se completa el Reglamento (UE) n.o 1308/2013 del Parlamento Europeo
    y del Consejo, en lo que se refiere a las normas de comercialización para el
    sector de las frutas y hortalizas, determinados productos procedentes de frutas
    y hortalizas transformadas y el sector de los plátanos, y por el que se derogan
    el Reglamento (CE) n.o 1666/1999 de la Comisión y los Reglamentos de Ejecución
    (UE) n.o 543/2011 y (UE) n.o 1333/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/2429 av den 17 augusti 2023
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1308/2013
    vad gäller handelsnormer för sektorn för frukt och grönsaker, vissa bearbetade
    produkter av frukt och grönsaker samt banansektorn, och om upphävande av kommissionens
    förordning (EG) nr 1666/1999 och kommissionens genomförandeförordningar (EU)
    nr 543/2011 och (EU) nr 1333/2011
