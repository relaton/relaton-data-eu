    standarda za sektor voća i povrća, određene prerađene proizvode od voća i
    povrća te sektor banana i o stavljanju izvan snage Uredbe Komisije (EZ) br. 1666/1999
    i provedbenih uredbi Komisije (EU) br. 543/2011 i (EU) br. 1333/2011
  type: main
