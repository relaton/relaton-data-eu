    for så vidt angår handelsnormer for frugt- og grøntsagssektoren, visse forarbejdede
    frugt- og grøntsagsprodukter og banansektoren og om ophævelse af Kommissionens
    forordning (EF) nr. 1666/1999 og Kommissionens gennemførelsesforordning (EU)
