    gyümölcs- és zöldségágazatra, egyes feldolgozott gyümölcs- és zöldségtermékekre,
    valamint a banánágazatra vonatkozó forgalmazási előírások tekintetében
    történő kiegészítéséről, valamint az 1666/1999/EK bizottsági rendelet,
    az 543/2011/EU és az 1333/2011/EU bizottsági végrehajtási rendelet hatályon
    kívül helyezéséről
  type: main
