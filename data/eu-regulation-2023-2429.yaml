    che integra il regolamento (UE) n. 1308/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme di commercializzazione per il settore degli ortofrutticoli,
    per alcuni prodotti trasformati a base di ortofrutticoli e per il settore delle
    banane, e che abroga il regolamento (CE) n. 1666/1999 della Commissione e i regolamenti
    di esecuzione (UE) n. 543/2011 e (UE) n. 1333/2011 della Commissione
  type: main
- language: lv
  script: Latn
