    agus na nglasraí, táirgí áirithe torthaí agus glasraí próiseáilte agus
    earnáil na mbananaí, agus Rialachán (CE) Uimh. 1666/1999 ón gCoimisiún, agus
    Rialacháin Chur Chun Feidhme (AE) Uimh. 543/2011 agus (AE) Uimh. 1333/2011 ón
