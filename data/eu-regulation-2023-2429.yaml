    tal-Kunsill fir-rigward tal-istandards tal-kummerċjalizzazzjoni għas-settur
    tal-frott u l-ħxejjex, għal ċerti prodotti tal-frott u tal-ħxejjex ipproċessati
    u għas-settur tal-banana, u li jħassar ir-Regolament tal-Kummissjoni (KE) Nru
