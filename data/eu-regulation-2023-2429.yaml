title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2429 of 17 August 2023 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council as
    regards marketing standards for the fruit and vegetables sector, certain processed
    fruit and vegetable products and the bananas sector, and repealing Commission
    Regulation (EC) No 1666/1999 and Commission Implementing Regulations (EU) No 543/2011
    and (EU) No 1333/2011
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/2429 de la Commission du 17 août 2023
    complétant le règlement (UE) no 1308/2013 du Parlement européen et du Conseil
    en ce qui concerne les normes de commercialisation pour le secteur des fruits
    et légumes, certains produits transformés à base de fruits et légumes et le
    secteur de la banane, et abrogeant le règlement (CE) no 1666/1999 de la Commission
    et les règlements d’exécution (UE) no 543/2011 et (UE) no 1333/2011 de la
    Commission
  type: main
- language: de
  script: Latn
