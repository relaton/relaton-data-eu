  content: Regolamento di esecuzione (UE) 2022/55 della Commissione del 9 novembre
    2021 che modifica il regolamento di esecuzione (UE) 2021/403 per quanto riguarda
    l’aggiunta di un nuovo modello di certificato per l’ingresso nell’Unione
    di determinati ungulati che sono originari dell’Unione e vengono mossi in un
    paese terzo o territorio per partecipare a eventi, esposizioni, mostre e spettacoli,
