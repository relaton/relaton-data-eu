title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/55 of 9 November 2021 amending
    Implementing Regulation (EU) 2021/403 as regards the addition of a new model certificate
    for the entry into the Union of certain ungulates which originate in the Union,
    that are moved to a third country or territory for their participation in events,
    exhibitions, displays and shows and are then moved back to the Union, and amending
    Implementing Regulation (EU) 2021/404 as regards the list of third countries authorised
    for the entry into the Union of ungulates
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/55 de la Commission du 9 novembre 2021
    modifiant le règlement d’exécution (UE) 2021/403 en ce qui concerne l’ajout
    d’un nouveau modèle de certificat pour l’entrée dans l’Union de certains
    ongulés originaires de l’Union qui sont déplacés vers un pays tiers ou territoire
    pour participer à des manifestations, expositions, présentations ou spectacles
    et sont ensuite réexpédiés dans l’Union, et modifiant le règlement d’exécution
    (UE) 2021/404 en ce qui concerne la liste des pays tiers en provenance desquels
    l’entrée d’ongulés dans l’Union est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/55 der Kommission vom 9. November 2021
    zur Änderung der Durchführungsverordnung (EU) 2021/403 hinsichtlich der Aufnahme
    einer neuen Musterbescheinigung für den Eingang in die Union von bestimmten Huftieren,
    die aus der Union stammen, zur Teilnahme an Veranstaltungen, Ausstellungen, Vorführungen
    oder Shows in ein Drittland oder Gebiet und anschließend wieder zurück in die
    Union verbracht werden, sowie zur Änderung der Durchführungsverordnung (EU)
    2021/404 hinsichtlich der Liste der Drittländer, aus denen der Eingang von Huftieren
    in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/55 на Комисията
    от 9 ноември 2021 година за изменение на Регламент
