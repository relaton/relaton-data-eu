  content: Komission täytäntöönpanoasetus (EU) 2022/55, annettu 9 päivänä marraskuuta
    2021, täytäntöönpanoasetuksen (EU) 2021/403 muuttamisesta siltä osin kuin
    on kyse uuden todistusmallin lisäämisestä sellaisten tiettyjen sorkka- ja kavioeläinten
    unioniin tuloa varten, jotka ovat peräisin unionista ja jotka siirretään kolmanteen
    maahan tai alueelle tapahtumiin, näyttelyihin, näytöksiin tai esityksiin osallistumista
    varten ja siirretään sen jälkeen takaisin unioniin, sekä täytäntöönpanoasetuksen
    (EU) 2021/404 muuttamisesta siltä osin kuin on kyse niiden kolmansien maiden
    luettelosta, joista sorkka- ja kavioeläinten saapuminen unioniin on sallittua
