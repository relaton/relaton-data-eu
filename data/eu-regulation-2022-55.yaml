    на третите държави, от които е разрешено въвеждането
    в Съюза на копитни животни
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/55 ze dne 9. listopadu 2021,
    kterým se mění prováděcí nařízení (EU) 2021/403, pokud jde o doplnění
    nového vzorového osvědčení pro vstup do Unie v případě některých kopytníků,
    kteří pocházejí z Unie, jsou přemístěni do třetí země nebo území za
    účelem účasti na akcích, výstavách a přehlídkách a poté jsou přemístěni
    nazpět do Unie, a kterým se mění prováděcí nařízení (EU) 2021/404, pokud
    jde o seznam třetích zemí, z nichž je povolen vstup kopytníků do Unie
