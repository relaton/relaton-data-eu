    ao aditamento de um novo modelo de certificado para a entrada na União de determinados
    ungulados originários da União que são transportados para um país terceiro
    ou território com vista à sua participação em eventos, exposições, exibições
    e espetáculos e que em seguida regressam à União, e que altera o Regulamento
    de Execução (UE) 2021/404 no que diz respeito à lista de países terceiros
    autorizados para a entrada de ungulados na União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/55 al Comisiei din 9 noiembrie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2021/403 în ceea
    ce privește adăugarea unui nou model de certificat pentru intrarea în Uniune
    a anumitor ungulate care provin din Uniune, sunt deplasate către o țară terță
    sau un teritoriu terț pentru participarea lor la evenimente, expoziții, prezentări
    și spectacole și care sunt apoi deplasate înapoi în Uniune, precum și de
    modificare a Regulamentului de punere în aplicare (UE) 2021/404 în ceea ce privește
    lista țărilor terțe autorizate pentru intrarea în Uniune a ungulatelor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/55 z 9. novembra 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2021/403, pokiaľ ide o pridanie nového
    vzoru certifikátu na vstup určitých kopytníkov, ktoré pochádzajú z Únie,
    premiestňujú sa do tretej krajiny alebo na územie na účely ich účasti na
    podujatiach, výstavách, prehliadkach a prezentáciách a potom sa premiestňujú
    späť do Únie, a ktorým sa mení vykonávacie nariadenie (EÚ) 2021/404, pokiaľ
    ide o zoznam tretích krajín, z ktorých sa povoľuje vstup kopytníkov do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/55 z dne 9. novembra 2021 o spremembi
    Izvedbene uredbe (EU) 2021/403 z dodatkom novega vzorca spričevala za vstop nekaterih
    kopitarjev, ki izvirajo iz Unije, se premaknejo v tretjo državo ali na ozemlje
    zaradi udeležbe na dogodkih, razstavah, razkazovanjih in predstavah ter se nato
    premaknejo nazaj v Unijo, v Unijo ter o spremembi Izvedbene uredbe (EU) 2021/404
    glede seznama tretjih držav, iz katerih je dovoljen vstop kopitarjev v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/55 de la Comisión de 9 de noviembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) 2021/403 en lo
    que respecta a la adición de un nuevo modelo de certificado para la entrada en
    la Unión de determinados ungulados que procedan de la Unión, sean desplazados
    a un tercer país o territorio para participar en actos, exhibiciones, exposiciones
    y espectáculos y, a continuación, regresen a la Unión, y por el que se modifica
    el Reglamento de Ejecución (UE) 2021/404, en lo que respecta a la lista de terceros
    países desde los que se autoriza la entrada en la Unión de ungulados
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/55 av den 9 november 2021
    om ändring av genomförandeförordning (EU) 2021/403 vad gäller tillägg av
    en ny förlaga till intyg för införsel till unionen av vissa hov- och klövdjur
    med ursprung i unionen som flyttas till ett tredjeland eller territorium för
    deltagande i evenemang, utställningar, uppvisningar och föreställningar och
    sedan flyttas tillbaka till unionen, samt om ändring av genomförandeförordning
    (EU) 2021/404 vad gäller förteckningen över tredjeländer från vilka hov-
    och klövdjur får föras in till unionen
