  content: Council Regulation (EEC) No 1637/77 of 18 July 1977 amending Regulation
    (EEC) No 522/77 laying down special provisions applicable to trade in tomato concentrates
    and peeled tomatoes between the Community as originally constituted and the new
    Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1637/77 du Conseil, du 18 juillet 1977, modifiant
    le règlement (CEE) n° 522/77 portant dispositions spéciales applicables aux
    échanges entre la Communauté dans sa composition originaire et les nouveaux
    États membres pour les concentrés de tomates et les tomates pelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr.1637/77 des Rates vom 18. Juli 1977 zur Änderung der
    Verordnung (EWG) Nr. 522/77 über Sondervorschriften für den Handel mit Tomatenkonzentraten
    und geschälten Tomaten zwischen der Gemeinschaft in ihrer ursprünglichen Zusammensetzung
    und den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1637/77 af 18. juli 1977 om ændring af forordning
