    i dets oprindelige udstrækning og de nye medlemsstater for så vidt angår tomatkoncentrater
    og flåede tomater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1637/77 del Consiglio, del 18 luglio 1977, che modifica
