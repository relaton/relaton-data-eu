    scambi di concentrati di pomodori e di pomodori pelati tra la Comunità nella
    sua composizione originaria e i nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1637/77 van de Raad van 18 juli 1977 tot wijziging
    van Verordening (EEG) nr. 522/77 houdende bijzondere bepalingen voor het handelsverkeer
    in tomatenpasta en tomaten zonder schil tussen de Gemeenschap in haar oorspronkelijke
    samenstelling en de nieuwe Lid-Staten
