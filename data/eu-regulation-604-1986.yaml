    die besonderen Maßnahmen für Erbsen, Puffbohnen, Ackerbohnen und Lupinen infolge
    des Beitritts Spaniens und Portugals
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 604/86 af 28. februar 1986 om midlertidige
