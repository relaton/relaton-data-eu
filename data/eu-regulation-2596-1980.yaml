title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2596/80 of 9 October 1980 re-establishing
    the levying of customs duties on pocket-watches, wrist-watches and other watches,
    falling within heading No 91.01 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2596/80 de la Commission, du 9 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux montres
    de poche, montres-bracelets et similaires, de la position 91.01 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2596/80 der Kommission vom 9. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Taschenuhren, Armbanduhren und ähnliche Uhren (einschließlich
    Stoppuhren vom gleichen Typ) der Tarifnummer 91.01 mit Ursprung in Hongkong, dem
    die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2596/80 af 9. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for lommeure, armbåndsure og lignende ure, under
    pos. 91.01, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2596/80 della Commissione, del 9 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli orologi da tasca,
    da polso e simili, della voce 91.01 della tariffa doganale comune, originari di
    Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2596/80 van de Commissie van 9 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakhorloges,
    polshorloges en dergelijke, stophorloges daaronder begrepen, van post 91.01, van
    oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
