title:
- language: en
  script: Latn
  content: '82/417/EEC: Commission Decision of 10 June 1982 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of tents, originating
    in the German Democratic Republic, which have been put into free circulation in
    the Community (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/417/CEE: Décision de la Commission, du 10 juin 1982, autorisant le
    Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de tentes, originaires de la République démocratique allemande et mises en libre
    pratique dans la Communauté (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '82/417/EWG: Entscheidung der Kommission vom 10. Juni 1982 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Deutschen Demokratischen Republik stammenden und in
    der Gemeinschaft im freien Verkehr befindlichen Zelte (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/417/EØF: Kommissionens beslutning af 10. juni 1982 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af telte med oprindelse i Den tyske demokratiske Republik til fri omsætning i
    Fællesskabetl (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/417/EOK: Απόφαση τής Επιτροπής τής 10ης Ιουνίου
    1982 περί χορηγήσεως αδείας στό Ηνωμένο Βασίλειο
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών σκηνών, καταγωγής Λαϊκής Δημοκρατίας
    τής Γερμανίας, οι οποίες ευρίσκονται σέ ελεύθερη
    κυκλοφορία στήν Κοινότητα (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/417/CEE: Decisione della Commissione, del 10 giugno 1982, che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di tende originarie della Repubblica democratica tedesca e messe in libera pratica
    nella Comunità (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/417/EEG: Beschikking van de Commissie van 10 juni 1982 houdende machtiging
    van het Verenigd Koninkrijk tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van tenten, van oorsprong uit de Duitse Democratische
    Republiek, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de
    tekst in de Engelse taal is authentiek)'
