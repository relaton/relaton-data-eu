id: EURegulation30011973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3001/73 of the Commission of 5 November 1973 re-establishing
    Common Customs Tariff duties on yarn of combed sheep' s or lambs' wool (worsted
    yarn), not put up for retail sale falling within heading No 53.07 of the Common
    Customs Tariff, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2766/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3001/73 de la Commission, du 5 novembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de laine peignée, non conditionnés pour la vente au détail, de la
    position tarifaire 53.07, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2766/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3001/73 der Kommission vom 5. November 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Kammgarne aus Wolle, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 53.07, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2766/72 des Rates vom 19. Dezember 1972
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3001/73 af 5. november 1973 om genindførelse
    af told ifølge den fælles toldtarif for garn af kæmmet uld (kamgarn), ikke
    i detailsalgsoplægninger under position 53.07, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2766/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3001/73 della Commissione, del 5 novembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di lana pettinata, non preparati per la vendita al minuto, della voce doganale
    n. 53.07, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2766/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3001/73 van de Commissie van 5 november 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kamgaren van wol, niet gereed voor de verkoop in het klein van
    post 53.07, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 2766/72 van de Raad van 19 december 1972 tariefpreferenties
    werden geopend
  type: main
