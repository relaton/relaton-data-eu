title:
- language: en
  script: Latn
  content: '92/137/EEC: Commission Decision of 27 February 1992 authorizing Portugal
    to import from third countries at a reduced levy certain quantities of raw sugar
    during the period 1 March to 30 June 1992 (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/137/CEE: Décision de la Commission du 27 février 1992 autorisant
    le Portugal à importer des pays tiers à prélèvement réduit certaines quantités
    de sucre brut au titre de la période du 1er mars au 30 juin 1992 (Le texte en
    langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 27. Februar 1992 zur Ermächtigung Portugals,
    für den Zeitraum vom 1. März 1992 bis 30. Juni 1992 bestimmte Rohzuckermengen
    mit verminderter Abschöpfung aus Drittländern einzuführen (Nur der portugiesische
    Text ist verbindlich) (92/137/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 27. februar 1992 om bemyndigelse af Portugal
    til at indføre visse mængder råsukker under anvendelse af nedsat afgift fra
    tredjelande for perioden 1. marts 1992 til 30. juni 1992 (Kun den portugisiske
    udgave er autentisk) (92/137/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/137/ΕΟΚ : Απόφαση της Επιτροπής της 27ης
    Φεβρουαρίου 1992 που επιτρέπει στην Πορτογαλία
    να εισάγει απο τρίτες χώρες, με μειωμένη εισφορά,
    ορισμένες ποσότητες ακατέργαστης ζάχαρης
    για την περίοδο από την 1η Μαρτίου έως 30 Ιουνίου
    1992'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 27 febbraio 1992 che autorizza il Portogallo
    ad importare dai paesi terzi taluni quantitativi di zucchero greggio a prelievo
    ridotto in conto del periodo dal 1o marzo al 30 giugno 1992 (Il testo in lingua
    portoghese è il solo facente fede) (92/137/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 27 februari 1992 houdende machtiging
    van Portugal om bepaalde hoeveelheden ruwe suiker met een verlaagde heffing uit
    derde landen in te voeren voor de periode van 1 maart tot en met 30 juni 1992
    (Slechts de tekst in de Portugese taal is authentiek) (92/137/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 27 de Fevereiro de 1992 que autoriza Portugal
