    Junho de 1992 (Apenas faz fé o texto em língua portuguesa) (92/137/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 27 de febrero de 1992 por la que se autoriza
    a Portugal a importar de terceros países, con una exacción reguladora de tipo
    reducido, ciertas cantidades de azúcar terciado para el período comprendido
    entre el 1 de marzo y el 30 de junio de 1992 (El texto en lengua portuguesa es
    el único auténtico) (92/137/CEE) #'
