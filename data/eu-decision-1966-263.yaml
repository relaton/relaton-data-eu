title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 avril 1966, portant prorogation de la
    validité de sa décision en date du 31 octobre 1962, autorisant la République
    fédérale d'Allemagne, en vertu de l'article 115 alinéa 1 du Traité, à percevoir
    un droit de douane supplémentaire à l'importation des feuilles de tabac non
    écotées et des déchets de tabac originaires de pays tiers et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/263/EWG: Entscheidung der Kommission vom 5. April 1966 zur Verlängerung
    der Geltungsdauer ihrer Entscheidung vom 31. Oktober 1962, mit der die Bundesrepublik
    Deutschland ermächtigt wurde, gemäß Artikel 115 Absatz (1) des Vertrages bei
    der Einfuhr von nicht entrippten Tabakblättern und Tabakabfällen, die aus dritten
    Ländern stammen und sich in den übrigen Mitgliedstaaten im freien Verkehr befinden,
    einen zusätzlichen Zoll zu erheben'
  type: main
- language: it
  script: Latn
  content: '66/263/CEE: Decisione della Commissione, del 5 aprile 1966, che proroga
    la validità della decisione adottata il 31 ottobre 1962, che autorizza la Repubblica
    federale di Germania, a norma dell''articolo 115, primo comma, del Trattato, a
    riscuotere un dazio doganale supplementare all''importazione di tabacco in foglie
    non scostolate e di cascami di tabacco originari di paesi terzi e immessi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/263/EEG: Beschikking van de Commissie van 5 april 1966, houdende verlenging
    van de periode van geldigheid van haar beschikking van 31 oktober 1962, waarbij
    de Bondsrepubliek Duitsland op grond van artikel 115, eerste alinea, van het Verdrag
    is gemachtigd een aanvullend recht te heffen bij de invoer van niet- gestripte
    tabaksbladeren en afvallen van tabak, die van oorsprong zijn uit derde landen
    en in de andere Lid- Staten in het vrije verkeer zijn gebracht'
  type: main
