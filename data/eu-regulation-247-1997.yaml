title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 247/97 of 11 February 1997 determining to
    what extent applications for the right to import for cows and heifers of certain
    mountain breeds lodged under Regulation (EC) No 2514/96 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 247/97 DE LA COMMISSION du 11 février 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au titre du règlement (CE) n° 2514/96 relatif à l'importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 247/97 DER KOMMISSION vom 11. Februar 1997 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte für Kühe und Färsen bestimmter
    Höhenrassen gemäß der Verordnung (EG) Nr. 2514/96 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 247/97 af 11. februar 1997 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergracer i henhold til forordning (EF) nr. 2514/96 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 247/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 11ης Φεβρουαρίου 1997 για να καθορισθεί σε
    ποιό βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται
    βάσει του κανονισμού (ΕΚ) αριθ. 2514/96 όσον αφορά
    την εισαγωγή αγελάδων και δαμάλεων ορισμένων
    ορεσίβιων φυλών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 247/97, annettu 11 päivänä helmikuuta 1997,
    asetuksen (EY) N:o 2514/96 mukaisesti jätettyjen tiettyihin vuoristorotuihin
    kuuluvia lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 247/97 DELLA COMMISSIONE dell'11 febbraio 1997 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel quadro del regolamento (CE) n. 2514/96 relativo all'importazione
    di vacche e giovenche di alcune razze di montagna
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 247/97 VAN DE COMMISSIE van 11 februari 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de ingediende aanvragen voor
    invoerrechten op grond van Verordening (EG) nr. 2514/96 betreffende de invoer
    van koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 247/97 DA COMISSÃO de 11 de Fevereiro de 1997 que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 2514/96 relativo à importação
    de vacas e de novilhas de determinadas raças de montanha
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 247/97 DE LA COMISIÓN de 11 de febrero de 1997 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de expedición
    de certificados de importación presentadas con arreglo al Reglamento (CE) n°
    2514/96 relativo a las importaciones de vacas y novillas de determinadas razas
    de montaña
  type: main
- language: sv
