title:
- language: en
  script: Latn
  content: '74/532/EEC: Commission Decision of 16 October 1974 exempting Ireland from
    applying to certain species the Council Directives of 14 June 1966 on the marketing
    of fodder plant seed and of cereal seed and the Council Directive of 30 June 1969
    on the marketing of seed of oil and fibre plants (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '74/532/CEE: Décision de la Commission, du 16 octobre 1974, dispensant
    l''Irlande d''appliquer à certaines espèces les directives du Conseil, du 14
    juin 1966, concernant la commercialisation de semences de plantes fourragères
    et de céréales ainsi que la directive du Conseil, du 30 juin 1969, concernant
    la commercialisation des semences de plantes oléagineuses et à fibres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '74/532/EWG: Entscheidung der Kommission vom 16. Oktober 1974 zur Entbindung
    Irlands von der Verpflichtung, die Richtlinien des Rates vom 14. Juni 1966 über
    den Verkehr mit Futterpflanzensaatgut und Getreidesaatgut sowie die Richtlinie
    des Rates über den Verkehr mit Saatgut von Öl- und Faserpflanzen hinsichtlich
    einiger Arten anzuwenden (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '74/532/EØF: Kommissionens Beslutning af 16. oktober 1974 om fritagelse
    for Irland fra forpligtelsen til at anvende Rådets direktiver af 14. juni 1966
    om handel med frø af foderplanter og sædekorn såvel som Rådets direktiv af
    30. juni 1969 om handel med frø af olie- og spindplanter på visse arter (Kun
    den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
