    Οκτωβρίου 1974, με την οποία απαλλάσσεται η Ιρλανδία
    της εφαρμογής για ορισμένα είδη των οδηγιών
    του Συμβουλίου της 14ης Ιουνίου 1966, περί της
    εμπορίας σπόρων φυτών που προορίζονται για
    ζωοτροφές και δημητριακών καθώς και της οδηγίας
    του Συμβουλίου, της 30ής Ιουνίου 1969, περί της
