  type: main
- language: it
  script: Latn
  content: '74/532/CEE: Decisione della Commissione, del 16 ottobre 1974, che dispensa
    l''Irlanda dell''applicare ad alcune specie le direttive del Consiglio, del 14
    giugno 1966, relative alla commercializzazione delle sementi di piante foraggere
    e di cereali nonché la direttiva del Consiglio del 30 giugno 1969, relativa alla
    commercializzazione delle sementi di piante oleaginose e da fibra (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '74/532/EEG: Beschikking van de Commissie van 16 oktober 1974 houdende
    vrijstelling van Ierland van de toepassing op bepaalde rassen van de richtlijnen
    van de Raad van 14 juni 1966 betreffende het in de handel brengen van zaaizaad
    van groenvoedergewassen en van zaaigranen en van de richtlijn van de Raad van
    30 juni 1969 betreffende het in de handel brengen van zaaizaad van oliehoudende
