    per taluni prodotti del settore delle carni suine per il periodo dal 1° aprile
    1999 al 30 giugno 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 863/1999 van de Commissie van 26 april 1999 tot vaststelling
