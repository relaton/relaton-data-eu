title:
- language: en
  script: Latn
  content: '79/338/EEC: Commission Decision of 16 March 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Denmark of expenditure
    incurred during 1977 on aids relating to the provision of socio-economic guidance
    for and the acquisition of occupational skills by persons engaged in agriculture
    (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/338/CEE: Décision de la Commission, du 16 mars 1979, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole (FEOGA), section
    "orientation", au Royaume de Danemark des dépenses effectuées pendant l''année
    1977 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture (Le texte en langue
    danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/338/EWG: Entscheidung der Kommission vom 16. März 1979 über die Rückvergütung
    der im Jahr 1977 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an das Königreich Dänemark (Nur der dänische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/338/EØF: Kommissionens beslutning af 16. marts 1979 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Danmark af de udgifter, som er afholdt
    i løbet af året 1977 til støtte vedrørende social og erhvervsmæssig vejledning
    og faglige kvalifikationer hos de personer, som arbejder i landbruget (Kun den
    danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/338/CEE: Decisione della Commissione, del 16 marzo 1979, relativa al
    rimborso da parte del FEAOG, sezione orientamento, al Regno di Danimarca delle
    spese effettuate durante il 1977 per gli aiuti concernenti l''informazione socio-economica
    e la qualificazione professionale delle persone che lavorano nell''agricoltura
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/338/EEG: Beschikking van de Commissie van 16 maart 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken
