title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2477/80 of 29 September 1980 fixing for
    the fourth quarter of 1980, the quantities of high-quality, fresh, chilled or
    frozen beef and veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2477/80 de la Commission, du 29 septembre 1980, fixant
    les quantités de viandes bovines de haute qualité, fraîches, réfrigérées
    ou congelées pouvant être importées à des conditions spéciales pour le quatrième
    trimestre de 1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2477/80 der Kommission vom 29. September 1980 zur
    Festsetzung der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleischs,
    die für das vierte Vierteljahr 1980 unter Sonderbedingungen eingeführt werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2477/80 af 29. september 1980 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i fjerde kvartal af 1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2477/80 della Commissione, del 29 settembre 1980,
    che fissa le quantità di carni bovine di qualità pregiata, fresche, refrigerate
    o congelate, che possono essere importate a condizioni speciali per il quarto
    trimestre 1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2477/80 van de Commissie van 29 september 1980 tot
    vaststelling van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees
    dat in het vierde kwartaal van 1980 op bijzondere voorwaarden kan worden ingevoerd
