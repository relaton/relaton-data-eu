title:
- language: en
  script: Latn
  content: '2002/903/EC: Commission Decision of 14 November 2002 amending Decision
    96/301/EC by renewing the Member States'' authorisation to take emergency measures
    against the dissemination of Pseudomonas solanacearum (Smith) Smith as regards
    Egypt (notified under document number C(2002) 4416)'
  type: main
- language: fr
  script: Latn
  content: '2002/903/CE: Décision de la Commission du 14 novembre 2002 modifiant
