title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3219/87 of 28 October 1987 specifying the
    extent to which applications lodged in October 1987 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3219/87 de la Commission, du 28 octobre 1987, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1987 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3219/87 der Kommission vom 28. Oktober 1987 über
    das Ausmaß, in dem den im Oktober 1987 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3219/87 af 28. oktober 1987 om det
    omfang, i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet
    i oktober måned 1987 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3219/87 της Επιτροπής
    της 28ης Οκτωβρίου 1987 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1987, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3219/87 della Commissione, del 28 ottobre 1987, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1987 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3219/87 van de Commissie van 28 oktober 1987 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in oktober 1987 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3219/87 da Comissão, de 28 de Outubro de 1987, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Outubro de 1987 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3219/87 de la Comisión, de 28 de octubre de 1987, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación, presentadas en el mes de octubre de 1987, respecto
    a los bovinos machos jóvenes destinados al engorde
  type: main
