    pokud jde o položky pro Argentinu v seznamech třetích zemí, území nebo jejich
    oblastí, z nichž je povolen vstup zásilek čerstvého masa drůbeže a pernaté
    zvěře a masných výrobků z drůbeže do Unie
  type: main
