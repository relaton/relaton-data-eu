- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1813 of 27 July 2026 amending
    Annexes XIV and XV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Argentina in the lists of third countries, territories, or zones thereof authorised
    for the entry into the Union of consignments of fresh meat of poultry and game
    birds and meat products from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1813 de la Commission du 27 juillet
    2026 modifiant les annexes XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives à l’Argentine dans les listes des
    pays tiers et territoires ou des zones de pays tiers ou territoire en provenance
    desquels l’entrée dans l’Union d’envois de viandes fraîches de volailles
    et de gibier à plumes et de produits à base de viande de volaille est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1813 der Kommission vom 27. Juli 2026
    zur Änderung der Anhänge XIV und XV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Argentinien in den Listen der Drittländer, Gebiete
    oder Zonen derselben, aus denen der Eingang von Sendungen von frischem Fleisch
    von Geflügel und Wildgeflügel sowie von Fleischerzeugnissen von Geflügel in
    die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
