    seznamih tretjih držav, njihovih ozemelj ali območij, s katerih je dovoljen
    vstop pošiljk svežega mesa perutnine in pernate divjadi ter pošiljk mesnih
    proizvodov perutnine v Unijo
  type: main
- language: es
  script: Latn
