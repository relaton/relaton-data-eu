title:
- language: en
  script: Latn
  content: Regulation (EU) 2021/2115 of the European Parliament and of the Council
    of 2 December 2021 establishing rules on support for strategic plans to be drawn
    up by Member States under the common agricultural policy (CAP Strategic Plans)
    and financed by the European Agricultural Guarantee Fund (EAGF) and by the European
    Agricultural Fund for Rural Development (EAFRD) and repealing Regulations (EU)
    No 1305/2013 and (EU) No 1307/2013
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/2115 du Parlement européen et du Conseil du 2 décembre
    2021 établissant des règles régissant l’aide aux plans stratégiques devant
    être établis par les États membres dans le cadre de la politique agricole commune
    (plans stratégiques relevant de la PAC) et financés par le Fonds européen agricole
    de garantie (FEAGA) et par le Fonds européen agricole pour le développement
    rural (Feader), et abrogeant les règlements (UE) no 1305/2013 et (UE) no 1307/2013
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/2115 des Europäischen Parlaments und des Rates vom
    2. Dezember 2021 mit Vorschriften für die Unterstützung der von den Mitgliedstaaten
    im Rahmen der Gemeinsamen Agrarpolitik zu erstellenden und durch den Europäischen
    Garantiefonds für die Landwirtschaft (EGFL) und den Europäischen Landwirtschaftsfonds
    für die Entwicklung des ländlichen Raums (ELER) zu finanzierenden Strategiepläne
    (GAP-Strategiepläne) und zur Aufhebung der Verordnung (EU) Nr. 1305/2013 sowie
    der Verordnung (EU) Nr. 1307/2013
  type: main
- language: bg
  script: Cyrl
  content: Регламент(ЕС) 2021/2115 на Европейския парламент
    и на Съвета от 2 декември 2021 година за установяване
    на правила за подпомагане за стратегическите
    планове, които трябва да бъдат изготвени от
    държавите членки по линия на общата селскостопанска
    политика (стратегически планове по ОСП) и финансирани
    от Европейския фонд за гарантиране на земеделието
    (ЕФГЗ) и от Европейския земеделски фонд за развитие
    на селските райони (ЕЗФРСР), и за отмяна на регламенти
    (ЕС) № 1305/2013 и (ЕС) № 1307/2013
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2021/2115 ze dne 2. prosince
    2021, kterým se stanoví pravidla podpory pro strategické plány, jež mají
    být vypracovány členskými státy v rámci společné zemědělské politiky
    (strategické plány SZP) a financovány Evropským zemědělským záručním
    fondem (EZZF) a Evropským zemědělským fondem pro rozvoj venkova (EZFRV), a
    kterým se zrušují nařízení (EU) č. 1305/2013 a (EU) č. 1307/2013
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2021/2115 af 2. december
    2021 om regler for støtte til strategiske planer, der udarbejdes af medlemsstaterne
    under den fælles landbrugspolitik og finansieres gennem Den Europæiske Garantifond
    for Landbruget (EGFL) og Den Europæiske Landbrugsfond for Udvikling af Landdistrikterne
