  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2021/2115 rendelete (2021. december
    2.) a közös agrárpolitika keretében a tagállamok által elkészítendő stratégiai
    tervhez (KAP stratégiai terv) nyújtott, az Európai Mezőgazdasági Garanciaalap
    (EMGA) és az Európai Mezőgazdasági Vidékfejlesztési Alap (EMVA) által finanszírozott
    támogatásra vonatkozó szabályok megállapításáról, valamint az 1305/2013/EU
    és az 1307/2013/EU rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/2115 del Parlamento europeo e del Consiglio del 2
    dicembre 2021 recante norme sul sostegno ai piani strategici che gli Stati membri
    devono redigere nell’ambito della politica agricola comune (piani strategici
    della PAC) e finanziati dal Fondo europeo agricolo di garanzia (FEAGA) e dal Fondo
    europeo agricolo per lo sviluppo rurale (FEASR) e che abroga i regolamenti (UE)
    n. 1305/2013 e (UE) n. 1307/2013
  type: main
