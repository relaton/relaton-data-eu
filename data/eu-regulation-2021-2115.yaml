  content: Uredba (EU) 2021/2115 Europskog parlamenta i Vijeća od 2. prosinca 2021.
    o utvrđivanju pravila o potpori za strateške planove koje izrađuju države
    članice u okviru zajedničke poljoprivredne politike (strateški planovi u okviru
    ZPP-a) i koji se financiraju iz Europskog fonda za jamstva u poljoprivredi (EFJP)
    i Europskog poljoprivrednog fonda za ruralni razvoj (EPFRR) te o stavljanju izvan
    snage uredbi (EU) br. 1305/2013 i (EU) br. 1307/2013
  type: main
