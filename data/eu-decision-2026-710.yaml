  script: Latn
  content: Decizia (UE) 2026/710 a Consiliului din 16 martie 2026 privind poziția
    care urmează să fie adoptată în numele Uniunii în cadrul Consiliului de asociere
    UE-Republica Moldova instituit în temeiul Acordului de asociere dintre Uniunea
    Europeană și Comunitatea Europeană a Energiei Atomice și statele membre ale
    acestora, pe de o parte, și Republica Moldova, pe de altă parte, în ceea ce
    privește constituirea Subcomitetului pentru reforma administrației publice și
    aprobarea instituirii Comitetului consultativ mixt dintre Comitetul Regiunilor
    al Uniunii Europene și autoritățile locale alese din Republica Moldova
  type: main
