title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/710 of 16 March 2026 on the position to be adopted
    on behalf of the Union within the EU-Republic of Moldova Association Council established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and the Republic of
    Moldova, of the other part, as regards the establishment of the Public Administration
    Reform Sub-Committee and the endorsement of the establishment of the Joint Consultative
    Committee between the Committee of the Regions of the European Union and the elected
    local authorities of the Republic of Moldova
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/710 du Conseil du 16 mars 2026 relative à la position
    à prendre au nom de l’Union au sein du conseil d’association UE-République
    de Moldavie institué par l’accord d’association entre l’Union européenne
    et la Communauté européenne de l’énergie atomique et leurs États membres,
    d’une part, et la République de Moldavie, d’autre part, en ce qui concerne
    la création du sous-comité chargé de la réforme de l’administration publique
    et l’approbation de la création du comité consultatif paritaire entre le Comité
    des régions de l’Union européenne et les représentants élus des autorités
    locales de la République de Moldavie
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/710 des Rates vom 16. März 2026 zur Festlegung des
    im Namen der Union in dem mit dem Assoziierungsabkommen zwischen der Europäischen
    Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits
    und der Republik Moldau andererseits eingesetzten Assoziationsrat EU-Republik
    Moldau im Hinblick auf die Einsetzung des Unterausschusses für die Reform der
    öffentlichen Verwaltung und die Billigung der Einsetzung des Gemischten Beratenden
    Ausschusses zwischen dem Ausschuss der Regionen der Europäischen Union und den
    gewählten Vertretern lokaler Behörden der Republik Moldau zu vertretenden Standpunkts
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2026/710 на Съвета от 16 март 2026
    година относно позицията, която трябва да се
    заеме от името на Съюза в рамките на Съвета
    за асоцииране ЕС — Република Молдова, създаден
    със Споразумението за асоцииране между Европейския
    съюз и Европейската общност за атомна енергия
    и техните държави членки, от една страна, и
    Република Молдова, от друга страна, относно
    създаването на Подкомитет за реформа на публичната
    администрация и одобряването на създаването
    на Съвместен консултативен комитет между Комитета
    на регионите на Европейския съюз и избраните
    местни органи на Република Молдова
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2026/710 ze dne 16. března 2026 o postoji, který
    má být zaujat jménem Unie v Radě přidružení EU-Moldavská republika, zřízené
    Dohodou o přidružení mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii a jejich členskými státy na jedné straně a Moldavskou republikou
    na straně druhé, pokud jde o zřízení Podvýboru pro reformu veřejné správy
    a o schválení zřízení Smíšeného poradního výboru mezi Výborem regionů
    Evropské unie a zvolenými místními orgány Moldavské republiky
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2026/710 af 16. marts 2026 om den holdning, der
    skal indtages på Unionens vegne i Associeringsrådet EU-Republikken Moldova oprettet
    i henhold til associeringsaftalen mellem Den Europæiske Union og Det Europæiske
    Atomenergifællesskab og deres medlemsstater på den ene side og Republikken Moldova
    på den anden side til oprettelsen af underudvalget for reform af den offentlige
    forvaltning og godkendelsen af oprettelsen af det blandede rådgivende udvalg
    mellem Det Europæiske Regionsudvalg og de valgte lokale myndigheder i Republikken
    Moldova
  type: main
