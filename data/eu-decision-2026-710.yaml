  script: Latn
  content: Sklep Sveta (EU) 2026/710 z dne 16. marca 2026 o stališču, ki se v imenu
    Unije zastopa v Pridružitvenem svetu EU-Republika Moldavija, ustanovljenem s
    Pridružitvenim sporazumom med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo in njunimi državami članicami na eni strani ter Republiko Moldavijo
    na drugi strani, v zvezi z ustanovitvijo Pododbora za reformo javne uprave in
