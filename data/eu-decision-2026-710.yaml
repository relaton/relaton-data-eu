  script: Latn
  content: Decisión (UE) 2026/710 del Consejo, de 16 de marzo de 2026, relativa a
    la posición que debe adoptarse, en nombre de la Unión, en el Consejo de Asociación
    UE-República de Moldavia establecido en virtud del Acuerdo de Asociación entre
    la Unión Europea y la Comunidad Europea de la Energía Atómica y sus Estados
    miembros, por una parte, y la República de Moldavia, por otra, en lo que respecta
    a la creación del Subcomité para la Reforma de la Administración Pública y
    al refrendo de la creación del Comité Consultivo Mixto entre el Comité de las
    Regiones de la Unión Europea y las autoridades locales democráticamente elegidas
