  script: Latn
  content: Neuvoston päätös (EU) 2026/710, annettu 16 päivänä maaliskuuta 2026,
    Euroopan unionin, Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden sekä
    Moldovan tasavallan välisellä assosiaatiosopimuksella perustetussa EU:n ja Moldovan
    tasavallan assosiaationeuvostossa unionin puolesta esitettävästä kannasta julkishallinnon
