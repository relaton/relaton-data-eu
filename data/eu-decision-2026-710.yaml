    zriadenej Dohodou o pridružení medzi Európskou úniou a Európskym spoločenstvom
    pre atómovú energiu a ich členskými štátmi na jednej strane a Moldavskou
    republikou na strane druhej, pokiaľ ide o zriadenie Podvýboru pre reformu verejnej
    správy a schválenie zriadenia zmiešaného poradného výboru medzi Výborom
    regiónov Európskej únie a volenými miestnymi orgánmi Moldavskej republiky
  type: main
