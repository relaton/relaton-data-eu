id: EURegulation1521999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 152/1999 of 22 January 1999 initiating a
    'new exporter' review of Council Regulation (EC) No 1567/97 imposing a definitive
    anti-dumping duty on imports of leather handbags originating in the People's Republic
    of China, repealing the duty with regard to imports from five exporting producers
    and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 152/1999 de la Commission du 22 janvier 1999 portant
    ouverture d'un réexamen au titre de nouvel exportateur du règlement (CE) nº
    1567/97 du Conseil instituant un droit antidumping définitif sur les importations
    de sacs à main en cuir originaires de la République populaire de Chine, abrogeant
    le droit applicable aux importations de cinq producteurs/exportateurs et soumettant
    les importations en question à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 152/1999 der Kommission vom 22. Januar 1999 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 1567/97 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Handtaschen aus Leder
    mit Ursprung in der Volksrepublik China (Überprüfung für neue Ausführer),
    zur Außerkraftsetzung des Zolls auf diese Einfuhren im Falle von fünf ausführenden
    Herstellern und zur zollamtlichen Erfassung der betreffenden Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 152/1999 af 22. januar 1999 om indledning
    af en fornyet undersøgelse angående nye eksportører af Rådets forordning (EF)
    nr. 1567/97 om indførelse af en endelig antidumpingtold på importen af håndtasker
    af læder med oprindelse i Folkerepublikken Kina, om ophævelse af tolden med
    hensyn til importen af varer fra fem eksporterende producenter og om registrering
    af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 152/1999 της Επιτροπής
    της 22ας Ιανουαρίου 1999 για την έναρξη επανεξέτασης
    σχετικά με «νέο εξαγωγέα» του κανονισμού (ΕΚ)
    αριθ. 1567/97 του Συμβουλίου για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές σακιδίων
    χεριού από δέρμα, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, για την κατάργηση του δασμού όσον
    αφορά τις εισαγωγές από πέντε παραγωγούς εξαγωγείς
    και για την καταγραφή αυτών των εισαγωγών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 152/1999, annettu 22 päivänä tammikuuta 1999,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevien nahasta valmistettujen käsilaukkujen maahantuonnissa annettuun
    neuvoston asetukseen (EY) N:o 1567/97 liittyvän "uutta viejää" koskevan tarkastelun
    vireillepanosta, tullin peruuttamisesta viiden vientiä harjoittavan tuottajan
    tuonnin osalta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 152/1999 della Commissione del 22 gennaio 1999 che
    avvia un riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1567/97,
    che istituisce un dazio antidumping definitivo sulle importazioni di borsette
    in cuoio originarie della Repubblica popolare cinese, che abroga il dazio per
    quanto riguarda le importazioni di cinque produttori esportatori e stabilisce
    che le importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 152/1999 van de Commissie van 22 januari 1999 tot
    inleiding van een procedure, op verzoek van "nieuwe exporteurs", tot herziening
    van Verordening (EG) nr. 1567/97 van de Raad tot instelling van een definitief
    antidumpingrecht op de invoer van leren handtassen uit de Volksrepubliek China,
    tot intrekking van het recht ten aanzien van vijf exporterende producenten en
    tot instelling van een registratie van deze invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 152/1999 da Comissão de 22 de Janeiro de 1999 que
    dá início a um reexame «novo exportador» do Regulamento (CE) n° 1567/97 do
    Conselho, que institui um direito anti-dumping definitivo sobre as importações
    de bolsas de couro originárias da República Popular da China, e que revoga o
    direito aplicável às importações provenientes de cinco produtores/exportadores
    e sujeita essas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 152/1999 de la Comisión de 22 de enero de 1999 por
    el que se inicia una reconsideración de «nuevo exportador» del Reglamento (CE)
    nº 1567/97 del Consejo por el que se establece un derecho antidumping definitivo
    sobre las importaciones de bolsos de cuero originarios de la República Popular
    de China, por el que se deroga el derecho en lo referente a las importaciones
    de cinco productores exportadores y por el que se someten estas importaciones
    a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 152/1999 av den 22 januari 1999 om inledande
    av en översyn, föranledd av tillkomsten av en ny exportör, av rådets förordning
    (EG) nr 1567/97 om införande av en slutgiltig antidumpningstull på import av
    handväskor av läder med ursprung i Folkrepubliken Kina, om upphävande av tullen
    på import från fem exporterande tillverkare och om registrering av denna import
  type: main
