id: EURegulation5962009
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EC) No 596/2009 of the European Parliament and of the Council
    of 18 June 2009 adapting a number of instruments subject to the procedure referred
    to in Article 251 of the Treaty to Council Decision 1999/468/EC with regard to
    the regulatory procedure with scrutiny — Adaptation to the regulatory procedure
    with scrutiny — Part Four
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 596/2009 du Parlement européen et du Conseil du 18
    juin 2009 portant adaptation à la décision 1999/468/CE du Conseil de certains
    actes soumis à la procédure visée à l’article 251 du traité, en ce qui
    concerne la procédure de réglementation avec contrôle — Adaptation à la
    procédure de réglementation avec contrôle — Quatrième partie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 596/2009 des Europäischen Parlaments und des Rates
    vom 18. Juni 2009 zur Anpassung einiger Rechtsakte, für die das Verfahren des
    Artikels 251 des Vertrags gilt, an den Beschluss 1999/468/EG des Rates in Bezug
    auf das Regelungsverfahren mit Kontrolle — Anpassung an das Regelungsverfahren
    mit Kontrolle — Vierter Teil
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 596/2009 на Европейския парламент
    и на Съвета от 18 юни 2009 година за адаптиране
    към Решение 1999/468/ЕО на Съвета на някои актове,
    за които се прилага процедурата, предвидена
    в член 251 от Договора, във връзка с процедурата
    по регулиране с контрол — адаптиране към процедурата
    по регулиране с контрол — част четвърта
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 596/2009 ze dne 18.
    června 2009 o přizpůsobení některých aktů přijatých postupem podle článku
    251 Smlouvy regulativnímu postupu s kontrolou podle rozhodnutí Rady 1999/468/ES
    – Přizpůsobení regulativnímu postupu s kontrolou – Část čtvrtá
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 596/2009 af 18. juni
    2009 om tilpasning til Rådets afgørelse 1999/468/EF af visse retsakter, der
    er omfattet af proceduren i traktatens artikel 251, for så vidt angår forskriftsproceduren
    med kontrol — Tilpasning til forskriftsproceduren med kontrol — Del 4
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 596/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, της 18ης Ιουνίου
    2009 , για την προσαρμογή στην απόφαση 1999/468/ΕΚ
    του Συμβουλίου, ορισμένων πράξεων που υπόκεινται
    στη διαδικασία του άρθρου 251 της συνθήκης, όσον
    αφορά την κανονιστική διαδικασία με έλεγχο
    — Προσαρμογή στην κανονιστική διαδικασία
    με έλεγχο — Μέρος IV
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EÜ) nr 596/2009, 18. juuni 2009
    , millega kohandatakse teatavaid asutamislepingu artiklis 251 sätestatud menetluse
    kohaseid õigusakte nõukogu otsusega 1999/468/EÜ kontrolliga regulatiivmenetluse
    osas – Kohandamine kontrolliga regulatiivmenetlusega – neljas osa
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EY) N:o 596/2009, annettu 18
    päivänä kesäkuuta 2009 , eräiden perustamissopimuksen 251 artiklassa määrätyn
    menettelyn mukaisten säädösten mukauttamisesta neuvoston päätökseen 1999/468/EY
    valvonnan käsittävän sääntelymenettelyn osalta – Mukauttaminen valvonnan
    käsittävään sääntelymenettelyyn – neljäs osa
  type: main
- language: ga
  script: Latn
  content: Rialachán (CE) Uimh. 596/2009 ó Pharlaimint na hEorpa agus ón gComhairle
    an 18 Meitheamh 2009 lena n-oiriúnaítear ionstraimí áirithe, atá faoi réir
    an nós imeachta dá dtagraítear in Airteagal 251 den Chonradh do Chinneadh 1999/468/CE
    ón gComhairle, maidir leis an nós imeachta rialúcháin lena ngabhann grinnscrúdú
    — Oiriúnú don nós imeachta rialúcháin lena ngabhann grinnscrúdú — Cuid
    a Ceathair
  type: main
- language: hr
  script: Latn
  content: Uredba (EZ) br. 596/2009 Europskog parlamenta i Vijeća od 18. lipnja 2009.
    o prilagodbi većeg broja instrumenata koji podliježu postupku iz članka 251.
    Ugovora Odluci Vijeća 1999/468/EZ, s obzirom na regulatorni postupak s kontrolom
    Prilagodba regulatornom postupku s kontrolom – četvrti dio
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 596/2009/EK rendelete ( 2009. június
    18. ) a Szerződés 251. cikkében megállapított eljárás szerint elfogadott
    egyes jogi aktusoknak az ellenőrzéssel történő szabályozási bizottsági
    eljárás tekintetében történő, az 1999/468/EK tanácsi határozat szerinti
    kiigazításáról – Az ellenőrzéssel történő szabályozási bizottsági
    eljáráshoz történő hozzáigazítás – Negyedik rész
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 596/2009 del Parlamento europeo e del Consiglio, del
    18 giugno 2009 , che adegua alla decisione 1999/468/CE del Consiglio determinati
    atti soggetti alla procedura di cui all’articolo 251 del trattato, per quanto
    riguarda la procedura di regolamentazione con controllo — Adeguamento alla procedura
    di regolamentazione con controllo — Quarta parte
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 596/2009 ( 2009. gada 18.
    jūnijs ), ar ko atsevišķus tiesību aktus, kuriem piemēro Līguma 251. pantā
    minēto procedūru, pielāgo Padomes Lēmumam 1999/468/EK attiecībā uz regulatīvo
    kontroles procedūru – Pielāgošana regulatīvajai kontroles procedūrai –
    Ceturtā daļa
  type: main
- language: lt
  script: Latn
  content: 2009 m. birželio 18 d. Europos Parlamento ir Tarybos reglamentas (EB)
    Nr. 596/2009 dėl kai kurių teisės aktų, kuriems galioja Sutarties 251 straipsnyje
    nustatyta tvarka, nuostatų, susijusių su reguliavimo procedūra su tikrinimu,
    suderinimo su Tarybos sprendimu 1999/468/EB – Suderinimas su reguliavimo procedūra
    su tikrinimu – Ketvirta dalis
  type: main
- language: mt
  script: Latn
  content: Regolament (KE) Nru 596/2009 tal-Parlament Ewropew u tal-Kunsill tat- 18
    ta’ Ġunju 2009 li jadatta ċerti atti suġġetti għall-proċedura stabbilita
    fl-Artikolu 251 tat-Trattat għad-Deċiżjoni tal-Kunsill 1999/468/KE, b’rabta
    mal-proċedura regolatorja bi skrutinju – Adattament għall-proċedura regolatorja
    bi skrutinju – Ir-Raba’ Parti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 596/2009 van het Europees Parlement en de Raad van
    18 juni 2009 tot aanpassing aan Besluit 1999/468/EG van de Raad van een aantal
    besluiten waarop de procedure van artikel 251 van het Verdrag van toepassing is,
    wat de regelgevingsprocedure met toetsing betreft — Aanpassing aan de regelgevingsprocedure
    met toetsing — Deel vier
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (WE) nr 596/2009 z dnia
    18 czerwca 2009 r. dostosowujące do decyzji Rady 1999/468/WE niektóre akty podlegające
    procedurze, o której mowa w art. 251 Traktatu, w zakresie procedury regulacyjnej
    połączonej z kontrolą – Dostosowanie do procedury regulacyjnej połączonej
    z kontrolą – Część czwarta
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 596/2009 do Parlamento Europeu e do Conselho, de
    18 de Junho de 2009 , que adapta à Decisão 1999/468/CE do Conselho certos actos
    sujeitos ao procedimento previsto no artigo 251. o do Tratado, no que se refere
    ao procedimento de regulamentação com controlo — Adaptação ao procedimento
    de regulamentação com controlo — Quarta Parte
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 596/2009 al Parlamentului European și al Consiliului
    din 18 iunie 2009 de adaptare la Decizia 1999/468/CE a Consiliului a anumitor
    acte care fac obiectul procedurii prevăzute la articolul 251 din tratat, în
    ceea ce privește procedura de reglementare cu control – Adaptare la procedura
    de reglementare cu control – Partea a patra
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (ES) č. 596/2009 z 18. júna
    2009 o prispôsobení určitých nástrojov, na ktoré sa vzťahuje postup uvedený
    v článku 251 zmluvy, rozhodnutiu Rady 1999/468/ES, pokiaľ ide o regulačný
    postup s kontrolou – Prispôsobenie právnych aktov regulačnému postupu s
    kontrolou – štvrtá časť
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 596/2009 Evropskega parlamenta in Sveta z dne 18. junija
    2009 o prilagoditvi nekaterih aktov, za katere se uporablja postopek iz člena
    251 Pogodbe, Sklepu Sveta 1999/468/ES glede regulativnega postopka s pregledom
    – Prilagoditev regulativnemu postopku s pregledom – Četrti del
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 596/2009 del Parlamento Europeo y del Consejo, de 18
    de junio de 2009 , por el que se adaptan a la Decisión 1999/468/CE del Consejo
    determinados actos sujetos al procedimiento establecido en el artículo 251 del
    Tratado en lo que se refiere al procedimiento de reglamentación con control —
    Adaptación al procedimiento de reglamentación con control — Cuarta parte
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 596/2009 av den 18 juni
    2009 om anpassning till rådets beslut 1999/468/EG av vissa rättsakter som omfattas
    av det förfarande som anges i artikel 251 i fördraget, med avseende på det
    föreskrivande förfarandet med kontroll – Anpassning till det föreskrivande
    förfarandet med kontroll – Del fyra
