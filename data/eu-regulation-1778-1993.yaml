title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1778/93 of 1 July 1993 re-establishing the
    levying of customs duties on products falling within CN code 4106 20 00, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1778/93 de la Commission du 1er juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 4106 20 00; originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1778/93 DER KOMMISSION vom 1. Juli 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 4106 20 00 mit Ursprung in
    Pakistan, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1778/93 af 1. juli 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4106 20 00 og med oprindelse
    i Pakistan, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1778/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 1ης Ιουλίου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 4106 20 00, καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1778/93 DELLA COMMISSIONE del 1o luglio 1993 che ripristina
