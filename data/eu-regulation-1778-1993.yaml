    00 originari del Pakistan beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1778/93 VAN DE COMMISSIE van 1 juli 1993 houdende
