  script: Latn
  content: Commission Regulation (EEC) No 1816/77 of 5 August 1977 amending Regulation
    (EEC) No 2793/76 on detailed rules for the disposal on the Italian market of frozen
    beef made available to the Italian intervention agency under Regulation (EEC)
    No 2453/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1816/77 de la Commission, du 5 août 1977, modifiant
    le règlement (CEE) n° 2793/76 relatif aux modalités d'application concernant
    l'écoulement sur le marché italien de certaines viandes bovines congelées mises
    à la disposition de l'organisme d'intervention italien en vertu du règlement
    (CEE) n° 2453/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1816/77 der Kommission vom 5. August 1977 zur Änderung
    der Verordnung (EWG) Nr. 2793/76 über Durchführungsbestimmungen für den Absatz
    von gefrorenem Rindfleisch, das der italienischen Interventionsstelle gemäß
    der Verordnung (EWG) Nr. 2453/76 zur Verfügung gestellt wurde, auf dem italienischen
    Markt
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1816/77 af 5. august 1977 om ændring
