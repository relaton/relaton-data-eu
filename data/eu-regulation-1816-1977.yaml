    på det italienske marked af visse former for frosset oksekød, der er stillet
    til rådighed for det italienske interventionsorgan, i henhold til forordning
    (EØF) nr. 2453/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1816/77 della Commissione, del 5 agosto 1977, che
    modifica il regolamento (CEE) n. 2793/76, relativo alle modalità di applicazione
    per lo smercio sul mercato italiano di talune carni bovine congelate, messe a
    disposizione dell'organismo d'intervento italiano in virtù del regolamento (CEE)
    n. 2453/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1816/77 van de Commissie van 5 augustus 1977 houdende
    wijziging van Verordening (EEG) nr. 2793/76 betreffende de wijzen van toepassing
    met betrekking tot de afzet op de Italiaanse markt van bepaalde soorten bevroren
    rundvlees die op grond van Verordening (EEG) nr. 2453/76 ter beschikking van het
    Italiaanse interventiebureau zijn gesteld
