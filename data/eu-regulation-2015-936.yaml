title:
- language: en
  script: Latn
  content: Regulation (EU) 2015/936 of the European Parliament and of the Council
    of 9 June 2015 on common rules for imports of textile products from certain third
    countries not covered by bilateral agreements, protocols or other arrangements,
    or by other specific Union import rules (recast)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2015/936 du Parlement européen et du Conseil du 9 juin
    2015 relatif au régime commun applicable aux importations de produits textiles
    en provenance de certains pays tiers non couverts par des accords, protocoles
    ou autres arrangements bilatéraux, ou par d'autres régimes d'importation spécifiques
    de l'Union (refonte)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2015/936 des Europäischen Parlaments und des Rates vom
    9. Juni 2015 über die gemeinsame Regelung der Einfuhren von Textilwaren aus bestimmten
    Drittländern, die nicht unter bilaterale Abkommen, Protokolle, andere Vereinbarungen
    oder eine spezifische Einfuhrregelung der Union fallen (Neufassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2015/936 на Европейския парламент
    и на Съвета от 9 юни 2015 година относно общите
    правила за внос на текстилни продукти от някои
    трети страни, които не са обхванати от двустранни
    споразумения, протоколи или други договорености
    или от други специфични правила на Съюза за
    вноса (преработен текст)
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2015/936 ze dne 9. června
    2015 o společných pravidlech dovozu textilních výrobků pocházejících z
    některých třetích zemí, na které se nevztahují dvoustranné dohody, protokoly
    nebo jiná ujednání ani jiná zvláštní pravidla dovozu Unie (přepracované
    znění)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2015/936 af 9. juni 2015
    om den fælles ordning for indførsel af tekstilvarer fra en række tredjelande,
    som ikke er omfattet af bilaterale aftaler, protokoller eller andre arrangementer
    eller af andre specifikke EU-regler for indførsel (omarbejdning)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2015/936 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 9ης Ιουνίου 2015, περί
    της θεσπίσεως κοινών κανόνων για τις εισαγωγές
    κλωστοϋφαντουργικών προϊόντων από ορισμένες
    τρίτες χώρες τα οποία δεν καλύπτονται από διμερείς
    συμφωνίες, πρωτόκολλα ή άλλους διακανονισμούς
    ή από άλλους κανόνες εισαγωγής της Ένωσης (αναδιατύπωση)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2015/936, 9. juuni 2015, teatavatest
    kahepoolsete lepingute, protokollide või muude kokkulepetega ja liidu impordi
    erieeskirjadega hõlmamata kolmandatest riikidest pärit tekstiiltoodete impordi
    ühiste eeskirjade kohta (uuesti sõnastatud)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2015/936, annettu 9 päivänä
    kesäkuuta 2015, muiden kuin kahdenvälisten sopimusten, pöytäkirjojen tai muiden
    järjestelyjen taikka muiden unionin erityisten tuontimenettelyjen soveltamisalaan
    kuuluvien tiettyjen kolmansien maiden tekstiilituotteiden tuontiin sovellettavasta
    yhteisestä menettelystä (uudelleenlaadittu)
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2015/936 ó Pharlaimint na hEorpa agus ón gComhairle an
    9 Meitheamh 2015 maidir le rialacha comhchoiteanna i dtaca le hallmhairiú táirgí
    teicstíle ó thríú tíortha áirithe nach dtagann faoi chomhaontuithe déthaobhacha,
    prótacail ná comhshocraíochtaí eile, ná faoi rialacha sonracha eile an Aontais
    i dtaca le hallmhairiú (athmhúnlú)
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) br. 2015/936 Europskog parlamenta i Vijeća od 9. lipnja 2015.
    o zajedničkim pravilima za uvoz tekstilnih proizvoda iz određenih trećih zemalja
    koji nisu obuhvaćeni bilateralnim sporazumima, protokolima ili drugim dogovorima,
    ili drugim posebnim uvoznim pravilima Unije (preinaka)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2015/936 rendelete (2015. június
    9.) az egyes harmadik országokból származó tex tiltermékek kétoldalú megállapodások,
    jegyzőkönyvek, egyéb megállapodások vagy egyéb különleges uniós importszabályozás
    hatálya alá nem tartozó behozatalának közös szabályairól (átdolgozás)
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2015/936 del Parlamento europeo e del Consiglio, del 9
    giugno 2015, che concerne il regime comune applicabile alle importazioni di prodotti
    tessili da taluni paesi terzi, non contemplato da accordi bilaterali, da protocolli
    o da altre disposizioni né da altro regime dell'Unione specifico in materia di
    importazioni (rifusione)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2015/936 (2015. gada 9. jūnijs)
    par kopīgiem noteikumiem tekstilizstrādājumu importam no dažām trešām valstīm,
    uz kurām neattiecas divpusēji nolīgumi, protokoli vai citas vienošanās, vai
    arī citi īpaši noteikumi par importu Savienībā (pārstrādāta redakcija)
  type: main
- language: lt
  script: Latn
  content: 2015 m. birželio 9 d. Europos Parlamento ir Tarybos reglamentas (ES) 2015/936
    dėl tekstilės gaminių, kuriems netaikomos dvišalės sutartys, protokolai ar
    kiti susitarimai arba kitos konkrečios Sąjungos importo taisyklės, bendrųjų
    importo iš tam tikrų trečiųjų šalių taisyklių (nauja redakcija)
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2015/936 tal-Parlament Ewropew u tal-Kunsill tad-9 ta'
    Ġunju 2015 dwar regoli komuni għall-importazzjoni ta' prodotti tessili minn
    għadd ta' pajjiżi terzi mhux koperti minn ftehim bilaterali, protokolli jew
    arranġamenti oħra, jew minn regoli speċifiċi ta' importazzjoni tal-Unjoni
    oħrajn (riformulazzjoni)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2015/936 van het Europees Parlement en de Raad van 9 juni
    2015 betreffende een gemeenschappelijke regeling voor de invoer van textielproducten
    uit bepaalde derde landen, die niet vallen onder bilaterale overeenkomsten, protocollen
    of andere regelingen, noch onder een andere, bijzondere invoerregeling van de
    Unie (herschikking)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2015/936 z dnia 9
    czerwca 2015 r. w sprawie wspólnych reguł dotyczących przywozu wyrobów włókienniczych
    z niektórych państw trzecich, nieobjętych umowami dwustronnymi, protokołami,
    innymi ustaleniami lub innymi szczegółowymi regułami Unii dotyczącymi przywozu
    (przekształcenie)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2015/936 do Parlamento Europeu e do Conselho, de 9 de
    junho de 2015, relativo ao regime comum aplicável às importações de produtos
    têxteis de determinados países terceiros, não abrangidas por acordos, protocolos
    ou outros convénios bilaterais ou por outras regras específicas de importação
    da União (reformulação)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2015/936 al Parlamentului European și al Consiliului
    din 9 iunie 2015 privind regimul comun aplicabil importurilor de produse textile
    din anumite țări terțe, care nu sunt reglementate de acorduri, protocoale sau
    alte înțelegeri bilaterale sau de alte regimuri specifice de import ale Uniunii
    (reformare)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2015/936 z 9. júna 2015
    o spoločných pravidlách na dovozy textilných výrobkov z určitých tretích
    krajín, na ktoré sa nevzťahujú bilaterálne dohody, protokoly a iné dojednania
    alebo iné osobitné dovozné predpisy Únie (prepracované znenie)
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2015/936 Evropskega parlamenta in Sveta z dne 9. junija 2015
    o skupnih pravilih za uvoz tekstilnih izdelkov iz nekaterih tretjih držav, ki
    jih ne urejajo dvostranski sporazumi, protokoli ali drugi dogovori ali druga posebna
    uvozna pravila Unije (prenovitev)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2015/936 del Parlamento Europeo y del Consejo, de 9 de
    junio de 2015, relativo al régimen común aplicable a las importaciones de productos
    textiles de determinados terceros países que no estén cubiertos por acuerdos
    bilaterales, protocolos, otros acuerdos o por otros regímenes específicos de
    importación de la Unión (versión refundida)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2015/936 av den 9 juni
    2015 om gemensamma bestämmelser för import av textilprodukter från vissa tredjeländer
    som inte omfattas av bilaterala avtal, protokoll eller andra överenskommelser
    eller av andra särskilda unionsbestämmelser för import (omarbetning)
