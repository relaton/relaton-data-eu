title:
- language: en
  script: Latn
  content: '92/575/EEC: Commission Decision of 3 December 1992 on the eligibility
    of expediture to be incurred in 1993 by Portugal, France and Denmark for the purpose
    of ensuring compliance with the Community system for the conservation and management
    of fishery resources (Only the Portuguese, German and French texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/575/CEE: Décision de la Commission, du 3 décembre 1992, relative
    à l''éligibilité des dépenses à effectuer par le Portugal, la France et le
    Danemark au cours de l''année 1993 pour assurer le respect du régime communautaire
    de conservation et de gestion des ressources de pêche (Les textes en langues
    portugaise, danoise et française sont les seuls faisant foi)'
  type: main
- language: de
