    Erhaltung und Bewirtschaftung der Fischereiressourcen (Nur der portugiesische,
    dänische und französische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/575/EØF: Kommissionens beslutning af 3. December 1992 om refusionsberettigelsen
