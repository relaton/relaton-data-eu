    εφαρμογής του καθεστώτος πιστοποιητικών εισαγωγής
    και εξαγωγής στον αμπελοοινικό τομέα και του
    κανονισμού (ΕΚ) αριθ. 1685/95 για τη θέσπιση καθεστώτος
    έκδοσης πιστοποιητικών εξαγωγής στον αμπελοοινικό
    τομέα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2739/1999, annettu 21 päivänä joulukuuta 1999,
    viinialan tuonti- ja vientitodistusjärjestelmän soveltamista koskevista yksityiskohtaisista
    erityissäännöistä annetun asetuksen (ETY) N:o 3388/81 sekä vientitodistusten
    antamista koskevan järjestelmän käyttöön ottamisesta viinialalla annetun
    asetuksen (EY) N:o 1685/95 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2739/1999 della Commissione, del 21 dicembre 1999,
    che modifica il regolamento (CEE) n. 3388/81 recante modalità particolari di
    applicazione del regime dei titoli d'importazione e di esportazione nel settore
    vitivinicolo, nonché il regolamento (CE) n. 1685/95 che istituisce un regime
    per il rilascio dei titoli d'esportazione nel settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2739/1999 van de Commissie van 21 december 1999 tot
    wijziging van Verordening (EEG) nr. 3388/81 houdende bijzondere uitvoeringsbepalingen
    inzake het stelsel van invoer- en uitvoercertificaten in de wijnsector en Verordening
    (EG) nr. 1685/95 tot instelling van een regeling voor de afgifte van uitvoercertificaten
    in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2739/1999 da Comissão, de 21 de Dezembro de 1999,
