title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2739/1999 of 21 December 1999 amending Regulation
    (EEC) No 3388/81 laying down special detailed rules in respect of import and export
    licences in the wine sector and Regulation (EC) No 1685/95 on arrangements for
    issuing export licences for wine sector products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2739/1999 de la Commission, du 21 décembre 1999, modifiant
    le règlement (CEE) nº 3388/81 portant modalités d'application du régime des
    certificats d'importation et d'exportation dans le secteur vitivinicole et le
    règlement (CE) nº 1685/95 portant instauration d'un régime de délivrance de
    certificats d'exportation dans le secteur vitivinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2739/1999 der Kommission vom 21. Dezember 1999 zur
    Änderung der Verordnung (EWG) Nr. 3388/81 über besondere Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen für Wein und der Verordnung (EG) Nr. 1685/95
    über die Ausfuhrlizenzen für Wein
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2739/1999 af 21. december 1999 om ændring
    af forordning (EØF) nr. 3388/81 om særlige gennemførelsesbestemmelser for ordningen
    med import- og eksportlicenser for vin og forordning (EF) nr. 1685/95 om en ordning
    med udstedelse af eksportlicenser for vin
  type: main
- language: el
  script: Grek
