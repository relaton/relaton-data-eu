    de exportação no sector vitivinícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2739/1999 de la Comisión, de 21 de diciembre de 1999,
    que modifica el Reglamento (CEE) nº 3388/81 sobre modalidades especiales de aplicación
    del régimen de certificados de importación y exportación en el sector vitivinícola,
