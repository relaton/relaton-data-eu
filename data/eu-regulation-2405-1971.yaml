  content: Règlement (CEE) n 2405/71 de la Commission, du 9 novembre 1971, modifiant
    la version en langue allemande du règlement (CEE) n 1371/71 de la Commission,
    du 30 juin 1971, relatif à la définition de la notion de produits originaires
    pour l'application des préférences tarifaires octroyées par la Communauté
    économique européenne à certains produits originaires de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2405/71 der Kommission vom 9. November 1971 zur Änderung
    der deutschsprachigen Fassung der Verordnung (EWG) Nr. 1371/71 der Kommission
    vom 30. Juni 1971 über die Begriffsbestimmung des Warenursprungs bei der Anwendung
    der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2405/71 della Commissione, del 9 novembre 1971, che
    modifica la versione tedesca del regolamento (CEE) n. 1371/71 della Commissione,
    del 30 giugno 1971, relativo alla definizione della nozione di prodotti originari
    per l'applicazione delle preferenze tariffarie accordate dalla Comunità economica
    europea a taluni prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2405/71 van de Commissie van 9 november 1971 houdende
    wijziging van de Duitse tekst van Verordening (EEG) nr. 1371/71 van de Commissie
    van 30 juni 1971 betreffende de definitie van het begrip "produkten van oorsprong"
    voor de toepassing van tariefpreferenties die door de Europese Economische Gemeenschap
    voor bepaalde produkten uit ontwikkelingslanden worden verleend
