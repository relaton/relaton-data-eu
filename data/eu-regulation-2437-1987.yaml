title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2437/87 of 11 August 1987 providing for
    the grant of private storage aid fixed at a standard rate in advance in respect
    of carcases, half-carcases, hindquarters and forequarters from adult male bovine
    animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2437/87 de la Commission, du 11 août 1987, prévoyant
    l'octroi d'une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant de gros bovins, fixée forfaitairement à l'avance
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2437/87 der Kommission vom 11. August 1987 zur Gewährung
    einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung von
    Schlachtkörpern, halben Schlachtkörpern, Hinter- und Vordervierteln von ausgewachsenen
    Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2437/87 af 11. august 1987 om ydelse
    af en skønsmæssigt forudfastsat støtte til privat oplagring af hele kroppe,
    halve kroppe og bag- og forfjerdinger af voksent kvæg i oksekødsektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2437/87 της Επιτροπής
    της 11ης Αυγούστου 1987 για την πρόβλεψη χορήγησης
    ενίσχυσης που προκαθορίζονται κατ' αποκοπή
    στην ιδιωτική αποθεματοποίηση σφαγίων, ημιμορίων
    σφαγίου και οπισθίων και εμπροσθίων τεταρτημορίων
    χονδρών βοοειδών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2437/87 della Commissione, dell'11 agosto 1987, recante
    concessione di un aiuto fissato forfettariamente in anticipo all'ammasso privato
    di carcasse, quarti posteriori e quarti anteriori di animali adulti della specie
    bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2437/87 van de Commissie van 11 augustus 1987 inzake
    de toekenning van een vooraf forfaitair vastgesteld steunbedrag voor de particuliere
    opslag van hele geslachte dieren, halve geslachte dieren, achtervoeten en voorvoeten
    van volwassen runderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2437/87 da Comissão, de 11 de Agosto de 1987, que
    prevê a concessão de uma ajuda à armazenagem privada de carcaças, de meias
    carcaças, de quartos traseiros e de quartos dianteiros de bovinos adultos fixada
    forfetária e antecipadamente
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2437/87 de la Comisión, de 11 de agosto de 1987, por
    el que se prevé la concesión de una ayuda, fijada globalmente por adelantado,
    al almacenamiento privado de canales, de medias canales, de cuartos traseros y
    de cuartos delanteros de vacunos pesados
