    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, som fører svensk flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2356/78 del Consiglio, del 9 ottobre 1978, recante
