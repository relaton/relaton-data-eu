- language: en
  script: Latn
  content: Council Regulation (EEC) No 2356/78 of 9 October 1978 providing for certain
    technical adjustments to Regulation (EEC) No 1850/78 laying down certain measures
    for the conservation and management of fishery resources applicable to vessels
    flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2356/78 du Conseil, du 9 octobre 1978, prévoyant
    certaines adaptations techniques du règlement (CEE) n° 1850/78 fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2356/78 des Rates vom 9. Oktober 1978 über einige
    technische Anpassungen der Verordnung (EWG) Nr. 1850/78 zur Festlegung von Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestánde, die fúr Schiffe gelten,
    die die Flagge Schwedens fúhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2356/78 af 9. oktober 1978 om visse tekniske
