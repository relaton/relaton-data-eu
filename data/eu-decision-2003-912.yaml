title:
- language: en
  script: Latn
  content: '2003/912/EC: Council Decision of 17 December 2003 amending Decision 95/408/EC
    on the conditions for drawing up, for an interim period, provisional lists of
    third-country establishments from which Member States are authorised to import
    certain products of animal origin, fishery products or live bivalve molluscs,
    as regards the extension of its validity'
  type: main
- language: fr
  script: Latn
  content: '2003/912/CE: Décision du Conseil du 17 décembre 2003 modifiant la décision
    95/408/CE concernant les modalités d''établissement pour une période transitoire,
    de listes provisoires des établissements de pays tiers dont les États membres
    sont autorisés à importer certains produits d''origine animale, produits de
    la pêche et mollusques bivalves vivants, pour en prolonger la validité'
  type: main
- language: de
  script: Latn
  content: '2003/912/EG: Entscheidung des Rates vom 17. Dezember 2003 zur Verlängerung
    der Geltungsdauer der Entscheidung 95/408/EG über die Bedingungen für die Aufstellung
    vorläufiger Listen der Drittlandbetriebe, aus denen die Mitgliedstaaten bestimmte
    tierische Erzeugnisse, Fischereierzeugnisse oder lebende Muscheln einführen dürfen,
    während einer Übergangszeit'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 17. prosince 2003, kterým se mění rozhodnutí
    95/408/ES o podmínkách pro sestavování prozatímních seznamů zařízení
    třetích zemí, pro přechodné období, ze kterých jsou členské státy oprávněny
    dovážet určité produkty živočišného původu, produkty rybolovu nebo živé
    mlže, pokud jde o prodloužení jeho platnosti
  type: main
- language: da
  script: Latn
  content: '2003/912/EF: Rådets beslutning af 17. december 2003 om ændring af beslutning
    95/408/EF om betingelserne for opstilling i en overgangsperiode af midlertidige
    lister over tredjelandsvirksomheder, hvorfra medlemsstaterne kan indføre visse
    animalske produkter, fiskerivarer og levende toskallede bløddyr, for så vidt
    angår gyldighedsperioden'
  type: main
- language: el
  script: Grek
