    pesca e moluscos bivalves vivos, no que diz respeito à prorrogação da sua validade'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady zo 17. decembra 2003, ktorým sa mení a dopĺňa rozhodnutie
