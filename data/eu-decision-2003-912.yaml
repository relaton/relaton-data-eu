    elenki provviżorji ta’ stabbilimenti f’pajjiż terz li minnhom l-Istati Membri
    huma awtorizzati jimportaw ċerti prodotti ta’ oriġini ta’ annimali, prodotti
    tas-sajd jew molluski bivalvi ħajjin, inkwantu għall-estensjoni tal-validità
    tagħha
  type: main
