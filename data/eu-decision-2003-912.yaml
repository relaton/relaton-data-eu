    importuoti tam tikrus gyvūninės kilmės produktus, žuvininkystės produktus
    arba gyvus dvigeldžius moliuskus, laikinų sąrašų tarpiniam laikotarpiui sudarymo
    sąlygų, dėl jo galiojimo pratęsimo
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-17 ta’ Diċembru 2003 li temenda d-Deċiżjoni
