    ar trešo valstu uzņēmumiem, no kuriem dalībvalstis atļauj ievest noteiktus
    dzīvnieku izcelsmes produktus, zvejniecības produktus vai dzīvas gliemenes
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžio 17 d. Tarybos sprendimas, iš dalies pakeičiantis Sprendimą
