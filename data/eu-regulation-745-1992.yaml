title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 745/92 of 26 March 1992 fixing the number
    of young male bovine animals which may be imported on special terms in the second
    quarter of 1992 and derogating from Regulation (EEC) No 2377/80 in respect of
    that quarter as regards the allocation of the quantities available
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 745/92 de la Commission, du 26 mars 1992, relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le deuxième trimestre de 1992 et portant dérogation,
    pour ce trimestre, au règlement (CEE) n° 2377/80 en ce qui concerne l' attribution
    des quantités disponibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 745/92 der Kommission vom 26. März 1992 zur Festsetzung
    der Anzahl männlicher Jungrinder, die im zweiten Vierteljahr 1992 unter Sonderbedingungen
    eingeführt werden können, und zur Abweichung von der Verordnung (EWG) Nr. 2377/80
    hinsichtlich der Zuteilung der verfügbaren Mengen in diesem Vierteljahr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 745/92 af 26. marts 1992 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i tredje kvartal
    af 1992, og om undtagelse for andet kvartal fra forordning (EØF) nr. 2377/80
    for så vidt angår tildelingen af disponible mængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 745/92 της Επιτροπής
    της 26ης Μαρτίου 1992 για τον καθορισμό των ποσοτήτων
    των νεαρών αρένων βοοειδών που είναι δυνατόν
    να εισαχθούν με ειδικούς όρους κατά το δεύτερο
    τρίμηνο του 1992 και για παρέκκλιση, κατά το τρίμηνο
    αυτό, από τον κανονισμό (ΕΟΚ) αριθ. 2377/80 όσον
    αφορά την απόδοση των διαθεσίμων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 745/92 della Commissione, del 26 marzo 1992, che fissa
    il numero di giovani bovini maschi che possono essere importati a condizioni speciali
    nel secondo trimestre del 1992 e reca deroga, per tale trimestre, al regolamento
    (CEE) n. 2377/80 per quanto riguarda l' attribuzione dei quantitativi disponibili
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 745/92 van de Commissie van 26 maart 1992 tot vaststelling
    van het aantal jonge mannelijke runderen dat in het tweede kwartaal van 1992 onder
    bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking, voor dat kwartaal,
    van Verordening (EEG) nr. 2377/80 ten aanzien van de toewijzing van de beschikbare
    aantallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 745/92 da Comissão, de 26 de Março de 1992, relativo
    à fixação da quantidade de vitelos machos que podem ser importados em condições
    especiais durante o segundo trimestre de 1992 e que prevê uma derrogação, no
    que diz respeito ao referido trimestre, ao Regulamento (CEE) n° 2377/80, quanto
    à atribuição das quantidades disponíveis
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 745/92 de la Comisión, de 26 de marzo de 1992, por
    el que se fija la cantidad de machos jóvenes de la especie bovina que podrán
    importarse en condiciones especiales durante el segundo trimestre de 1992 y por
    el que se establece una excepción, para este trimestre, al Reglamento (CEE) n°
    2377/80 en lo relativo a la atribución de las cantidades disponibles
  type: main
