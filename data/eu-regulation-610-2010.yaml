title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 610/2010 of 12 July 2010 implementing
    Article 2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism
    and repealing Implementing Regulation (EU) No 1285/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 610/2010 du Conseil du 12 juillet 2010
