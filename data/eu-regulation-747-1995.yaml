    ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται σε σκάφη
    υπό νορβηγική σημαία
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 747/95, annettu 31 päivänä maaliskuuta 1995,
    Norjan lipun alla purjehtiviin aluksiin vuonna 1995 sovellettavista tietyistä
    kalavarojen säilyttämis- ja hoitotoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 747/95 del Consiglio, del 31 marzo 1995, che stabilisce,
    per il 1995, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 747/95 van de Raad van 31 maart 1995 tot vaststelling,
    voor 1995, van maatregelen voor de instandhouding en het beheer van de visbestanden,
    van toepassing op vaartuigen die de vlag van Noorwegen voeren
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 747/95 do Conselho, de 31 de Março de 1995, que fixa,
    para o ano de 1995, determinadas medidas de conservação e de gestão dos recursos
    da pesca aplicáveis aos navios que arvoram pavilhão da Noruega
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 747/95 del Consejo, de 31 de marzo de 1995, por el
    que se establecen para 1995 determinadas medidas de conservación y gestión de
    los recursos pesqueros aplicables a los buques que enarbolen pabellón de Noruega
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 747/95 av den 31 mars 1995 om fastställande
    av särskilda åtgärder under 1995 för bevarande och förvaltning av fiskeresurser
    för tillämpning på fartyg som för norsk flagg
  type: main
