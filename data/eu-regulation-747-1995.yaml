title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 747/95 of 31 March 1995 laying down, for 1995,
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 747/95 du Conseil, du 31 mars 1995, fixant pour l'
    année 1995 certaines mesures de conservation et de gestion des ressources de
    pêche applicables aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 747/95 des Rates vom 31. März 1995 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände für Schiffe unter norwegischer
    Flagge (1995)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 747/95 af 31. marts 1995 om fastsættelse for
    1995 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som finder anvendelse på fartøjer, der fører norsk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 747/95 του Συμβουλίου
