title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1310/2002 of 19 July 2002 amending Regulation
    (EC) No 963/2002 laying down transitional provisions concerning anti-dumping and
    anti-subsidy measures adopted pursuant to Commission Decisions No 2277/96/ECSC
    and No 1889/98/ECSC as well as pending anti-dumping and anti-subsidy investigations,
    complaints and applications pursuant to those Decisions
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1310/2002 du Conseil du 19 juillet 2002 modifiant le
    règlement (CE) n° 963/2002 fixant des dispositions transitoires concernant les
    mesures antidumping et compensatoires adoptées en vertu des décisions n° 2277/96/CECA
    et n° 1889/98/CECA de la Commission ainsi que les demandes, plaintes et enquêtes
    antidumping et antisubventions en cours relevant de ces décisions
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1310/2002 des Rates vom 19. Juli 2002 zur Änderung
    der Verordnung (EG) Nr. 963/2002 zur Festlegung der Übergangsbestimmungen für
    gemäß den Entscheidungen Nr. 2277/96/EGKS und Nr. 1889/98/EGKS der Kommission
    erlassene Antidumping- und Antisubventionsmaßnahmen sowie für anhängige Antidumping-
    und Antisubventionsuntersuchungen und Anträge gemäß diesen Entscheidungen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1310/2002 на Съвета от 19 юли
    2002 година за изменение на Регламент (ЕО) № 963/2002
    за определяне на преходни разпоредби относно
    антидъмпинговите и антисубсидийни мерки, приети
    по силата на Решения № 2277/96/ЕОВС и № 1889/98/ЕОВС
    на Комисията, както и относно висящите разследвания
    за дъмпинг и субсидии и жалби и молби, съобразно
    тези решения
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1310/2002 ze dne 19. července 2002, kterým
    se mění nařízení (ES) č. 963/2002, kterým se stanoví přechodná ustanovení
    týkající se antidumpingových a antisubvenčních opatření přijatých podle
    rozhodnutí Komise č. 2277/96/ESUO a č. 1889/98/ESUO, jakož i dosud neukončených
    antidumpingových a antisubvenčních šetření, stížností a žádostí podle
    těchto rozhodnutí
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1310/2002 af 19. juli 2002 om ændring af forordning
    (EF) nr. 963/2002 om overgangsbestemmelser vedrørende antidumping- og antisubsidieforanstaltninger
    vedtaget i henhold til Kommissionens beslutning nr. 2277/96/EKSF og nr. 1889/98/EKSF
    samt undersøgelser, klager og ansøgninger vedrørende antidumping og antisubsidier,
    der er iværksat i medfør af disse beslutninger, men endnu ikke afsluttet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1310/2002 του Συμβουλίου,
    της 19ης Ιουλίου 2002, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 963/2002 σχετικά με τον καθορισμό
    μεταβατικών διατάξεων όσον αφορά μέτρα αντιντάμπινγκ
    και μέτρα κατά των επιδοτήσεων που έχουν εγκριθεί
    δυνάμει των αποφάσεων της Επιτροπής αριθ. 2277/96/EΚΑΧ
    και αριθ. 1889/98/EΚΑΧ, της Επιτροπής, καθώς και
    τις εκκρεμούσες έρευνες, καταγγελίες και αιτήσεις
    αντιντάμπινγκ και κατά των επιδοτήσεων σύμφωνα
    με τις εν λόγω αποφάσεις
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1310/2002, 19. juuli 2002, millega muudetakse
    määrust (EÜ) nr 963/2002, millega kehtestatakse üleminekusätted komisjoni
    otsuste nr 2277/96/ESTÜ ja nr 1889/98/ESTÜ kohaselt vastuvõetud dumpingu- ja
    subsiidiumivastaste meetmete suhtes ning vastavalt kõnealustele otsustele menetluses
    olevate dumpingu- ja subsiidiumivastaste uurimiste, kaebuste ja taotluste suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1310/2002, annettu 19 päivänä heinäkuuta
    2002, komission päätösten N:o 2277/96/EHTY ja N:o 1889/98/EHTY nojalla käyttöön
    otettuja polkumyynnin ja tukien vastaisia toimenpiteitä sekä kyseisten päätösten
    mukaisia, vireillä olevia polkumyynnin ja tukien vastaisia tutkimuksia, valituksia
    ja hakemuksia koskevista siirtymäkauden säännöksistä annetun asetuksen (EY)
    N:o 963/2002 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1310/2002 od 19. srpnja 2002. o izmjeni Uredbe
    (EZ) br. 963/2002 o utvrđivanju prijelaznih odredaba o antidampinškim mjerama
    i mjerama protiv subvencioniranog uvoza donesenim na temelju Odluka Komisije br.
    2277/96/EZUČ i br. 1898/98/EZUČ, kao i na temelju antidampinških ispitnih postupaka
    i ispitnih postupaka protiv subvencioniranog uvoza koji su u tijeku te žalbi
    i zahtjeva podnesenih na temelju tih odluka
  type: main
- language: hu
  script: Latn
  content: A Tanács 1310/2002/EK rendelete (2002. július 19.) a 2277/96/ESZAK és
    az 1889/98/ESZAK határozat alapján elfogadott dömpingellenes és szubvencióellenes
    intézkedésekkel, valamint a fenti határozatok alapján folyamatban lévő dömpingellenes
    és szubvencióellenes vizsgálatokkal, kifogásokkal és kérelmekkel kapcsolatos
    átmeneti rendelkezések megállapításáról szóló 963/2002/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1310/2002 del Consiglio, del 19 luglio 2002, recante
    modifica del regolamento (CE) n. 963/2002 che stabilisce le disposizioni transitorie
    relative alle misure antidumping e antisovvenzioni adottate ai sensi delle decisioni
    n. 2277/96/CECA e n. 1889/98/CECA della Commissione, nonché alle inchieste, alle
    denunce e alle domande antidumping e antisovvenzioni presentate ai sensi di dette
    decisioni e ancora pendenti
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1310/2002 (2002. gada 19. jūlijs), ar kuru groza
    Regulu (EK) Nr. 963/2002, ar ko nosaka pārejas noteikumus par antidempinga un
    antisubsidēšanas pasākumiem, kuri pieņemti saskaņā ar Komisijas Lēmumiem
    Nr. 2277/96/EOTK un Nr. 1889/98/EOTK, kā arī par notiekošajām antidempinga
    un antisubsidēšanas izmeklēšanām, sūdzībām un pieteikumiem saskaņā ar
    šiem lēmumiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 19 d. Tarybos reglamentas (EB) Nr. 1310/2002 iš dalies
    keičiantis Reglamentą (EB) Nr. 963/2002, nustatantį pereinamojo laikotarpio
    nuostatas dėl antidempingo priemonių ir antisubsidinių priemonių, taikomų
    subsidijoms, patvirtintų Komisijos sprendimais Nr. 2277/96/EAPB ir Nr. 1889/98/EAPB,
    laukiant antidempingo ir antisubsidinių tyrimų, skundų ir prašymų remiantis
    šiais sprendimais
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1310/2002 tad-19 ta' Lulju 2002 li jemenda
    r-Regolament (KE) Nru 963/2002 li jippreskrivi disposizzjonijiet transitorji dwar
    miżuri anti-dumping u anti-sussidju adottati bis-saħħa tad-Deċiżjonijiet
    tal-Kummissjoni Nru 2277/96/KEFA u Nru 1889/98/KEFA kif ukoll investigazzjonijiet,
    ilmenti u applikazzjonijiet anti-dumping u anti-sussidju pendenti bis-saħħa
    ta' dawk id-Deċiżjonijiet
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1310/2002 van de Raad van 19 juli 2002 houdende wĳziging
    van Verordening (EG) nr. 963/2002 tot vaststelling van overgangsbepalingen voor
    de overeenkomstig de Beschikkingen nrs. 2277/96/EGKS en 1889/98/EGKS van de Commissie
    genomen antidumping- en antisubsidiemaatregelen, evenals voor de niet voltooide
    antidumping- en antisubsidieonderzoeken en de niet afgehandelde klachten en verzoeken
    uit hoofde van deze beschikkingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) 1310/2002 z dnia 19 lipca 2002 r. zmieniające
    rozporządzenie (WE) nr 963/2002 ustanawiające przepisy przejściowe dotyczące
    środków antydumpingowych i antysubsydyjnych przyjętych zgodnie z decyzjami
    Komisji nr 2277/96/EWWiS i nr 1889/98/EWWiS oraz toczących się dochodzeń antydumpingowych
    i antysubsydyjnych, skarg i wniosków opartych na tych decyzjach
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1310/2002 do Conselho, de 19 de Julho de 2002, que
    altera o Regulamento (CE) n.° 963/2002 que estabelece disposições transitórias
    relativas às medidas anti-dumping e anti-subvenções adoptadas em conformidade
    com as Decisões n.° 2277/96/CECA e n.° 1889/98/CECA da Comissão, bem como
    os inquéritos, denúncias e pedidos em matéria anti-dumping e anti-subvenções
    pendentes, em conformidade com aquelas decisões
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1310/2002 al Consiliului din 19 iulie 2002 de modificare
    a Regulamentului (CE) nr. 963/2002 de stabilire a unor dispoziții tranzitorii
    privind măsurile antidumping și compensatorii adoptate în temeiul Deciziilor
    nr. 2277/96/CECO și nr. 1889/98/CECO ale Comisiei, precum și cererile, reclamațiile
    și anchetele antidumping și antisubvenții în curs privitoare la aceste decizii
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1310/2002 z 19. júla 2002, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 963/2002 ustanovujúce prechodné ustanovenia o antidumpingových
    a antidotačných opatreniach prijatých rozhodnutím Komisie č. 2277/96/ESUO
    a č. 1889/98/ESUO, ako aj prebiehajúce antidumpingové a antidotačné vyšetrovania,
    sťažnosti a žiadosti podľa týchto rozhodnutí
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1310/2002 z dne 19. julija 2002 o spremembi Uredbe
    (ES) št. 963/2002 o prehodnih določbah v zvezi s protidampinškimi in protisubvencijskimi
    ukrepi, sprejetimi v skladu z Odločbama Komisije št. 2277/96/ESPJ in št. 1889/98/ESPJ,
    ter nedokončanimi protidampinškimi in protisubvencijskimi preiskavami, nerešenimi
    pritožbami in vlogami na podlagi navedenih odločb
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1310/2002 del Consejo, de 19 de julio de 2002, que
    modifica el Reglamento (CE) n° 963/2002 por el que se establecen disposiciones
    transitorias relativas a las medidas antidumping y antisubvenciones adoptadas
    de conformidad con las Decisiones de la Comisión n° 2277/96/CECA y n° 1889/98/CECA,
    así como a las investigaciones antidumping y antisubvenciones, denuncias y solicitudes
    iniciadas o presentadas de conformidad con estas Decisiones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1310/2002 av den 19 juli 2002 om ändring av
    förordning (EG) nr 963/2002 om övergångsbestämmelser rörande antidumpnings-
    och utjämningsåtgärder som antagits enligt kommissionens beslut nr 2277/96/EKSG
    och nr 1889/98/EKSG samt rörande oavslutade antidumpnings- och antisubventionsundersökningar
    och oavgjorda klagomål eller ansökningar enligt dessa beslut
