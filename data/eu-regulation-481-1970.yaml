title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 481/70 de la Commission, du 13 mars 1970, complétant
    le règlement n° 165/67/CEE de la Commission concernant la destination des produits
    dont les États membres ont assuré l'achat dans le cadre des interventions sur
    le marché dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 481/70 der Kommission vom 13. März 1970 zur Ergänzung
    der Verordnung Nr. 165/67/EWG der Kommission über die Verwendung der Erzeugnisse,
    deren Ankauf die Mitgliedstaaten im Rahmen der Interventionen auf dem Obst- und
    Gemüsemarkt getätigt haben
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 481/70 della Commissione, del 13 marzo 1970, che completa
    il regolamento n. 165/67/CEE della Commissione relativo alla destinazione dei
    prodotti di cui gli Stati membri hanno assicurato l'acquisto nel quadro degli
    interventi sul mercato nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 481/70 van de Commissie van 13 maart 1970 houdende
    aanvulling van Verordening nr. 165/67/EEG van de Commissie betreffende de bestemming
    van de produkten die de Lid-Staten in het kader van interventiemaatregelen op
    de markt in de sector groenten en fruit hebben aangekocht
  type: main
