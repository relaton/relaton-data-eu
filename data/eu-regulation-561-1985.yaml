    États d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires d'
    outre-mer (1985 bis)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 561/85 der Kommission vom 4. März 1985 zur Festsetzung
