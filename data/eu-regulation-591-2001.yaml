    uit Noorwegen, van de maatregelen bedoeld in Verordening (EG) nr. 1416/95 houdende
    vaststelling van bepaalde concessies in de vorm van communautaire tariefcontingenten
    in 1995
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 591/2001 do Conselho, de 19 de Março de 2001, que
