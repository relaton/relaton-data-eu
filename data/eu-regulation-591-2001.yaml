title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 591/2001 of 19 March 2001 renewing for 2001
    the measures laid down in Regulation (EC) No 1416/95 establishing certain concessions
    in the form of Community tariff quotas in 1995 for certain processed agricultural
    products, with respect to products originating in Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 591/2001 du Conseil du 19 mars 2001 portant reconduction
    en 2001 des mesures prévues au règlement (CE) n° 1416/95 établissant certaines
    concessions sous forme de contingents tarifaires communautaires en 1995 pour certains
    produits agricoles transformés, en ce qui concerne les produits originaires de
    Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 591/2001 des Rates vom 19. März 2001 zur Verlängerung
    für 2001 der Maßnahmen der Verordnung (EG) Nr. 1416/95 über bestimmte Zugeständnisse
    in Form von Gemeinschaftszollkontingenten für bestimmte landwirtschaftliche Verarbeitungserzeugnisse
    (1995) im Hinbick auf Erzeugnisse mit Ursprung in Norwegen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 591/2001 af 19. marts 2001 om videreførelse
    i 2001 af foranstaltningerne i forordning (EF) nr. 1416/95 om visse indrømmelser
    i form af EF-toldkontingenter i 1995 for visse forarbejdede landbrugsprodukter
    for så vidt angår produkter med oprindelse i Norge
  type: main
- language: el
  script: Grek
