id: EUDecision1978423
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 April 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's, girls' and infants' woven overcoats, raincoats
    and other coats, cloaks and capes, jackets and blazers (other than coats of impregnated,
    coated or covered or laminated woven fabric, falling within heading No 59.08,
    59.11 or 59.12) of wool, of cotton or of man-made textile fibres, falling within
    subheading ex 61.02 B of the Common Customs Tariff, originating in Hong Kong and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 avril 1978, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les manteaux, imperméables (y compris les capes)
    et vestes, tissés, pour femmes, fillettes et jeunes enfants (autres que les manteaux
    de tissus imprégnés, enduits ou recouverts des n° 59.08, 59.11 ou 59.12), de
    laine, de coton ou de fibres textiles synthétiques ou artificielles, de la sous-position
    Ex 61.02 B du Tarif douanier commun, originaires de Hong- Kong et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. April 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Mäntel, Umhänge und Jacken aus Geweben, für Frauen, Mädchen und
    Kleinkinder (andere als Mäntel aus getränkten, bestrichenen oder überzogenen
    Geweben der Tarifnummern 59.08, 59.11 oder 59.12), aus Wolle, Baumwolle oder künstlichen
    Spinnstoffen, der Tarifnummer ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. april 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage frakker, kapper og slag, jakker og blazere, vævede, til kvinder, piger
    og småbørn (andre end frakker af tekstilstoffer, imprægneret, overtrukket eller
    lamineret), af uld, bomuld, eller kemofibre, som henhører under pos. ex 61.02
    B i den fælles toldtarif, har oprindelse i Hongkong og frit kan omsættes i de
    andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 aprile 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario cappotti, soprabiti, mantelli e simili e giacche,
    tessuti, per donna, per ragazza e per bambini (diversi dai soprabiti di tessuti
    impregnati, spalmati e ricoperti delle voci 59.08, 59.11 o 59.12 della tariffa
    doganale comune), di lana, di cotone o di fibre tessili sintetiche o artificiali
    della sottovoce ex 61.02 B della tariffa doganale comune, originari di Hong Kong
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 april 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    mantels, regenjassen en andere jassen, capes, blazers en jasjes, geweven voor
    dames, meisjes en kinderen (andere dan mantels geïmpregneerd, van een deklaag
    voorzien of beklede weefsels van de posten nrs. 59.08, 59.11 en van 59.12 van
    het gemeenschappelijk douanetarief), van wol, van katoen of van synthetische of
    kunstmatige textielvezels van post ex 61.02 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
