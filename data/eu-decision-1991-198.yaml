    und der Aquakultur in Belgien (Nur der französische und der niederländische
    Text sind verbindlich) (91/198/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 11. marts 1991 om fastlæggelse af en fællesskabsstøtteramme
