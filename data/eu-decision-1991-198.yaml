  script: Latn
  content: '91/198/EEC: Commission Decision of 11 March 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which fishery and aquaculture products are
    processed and marketed in Belgium (only the Dutch and French texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/198/CEE: Décision de la Commission du 11 mars 1991 concernant l''établissement
