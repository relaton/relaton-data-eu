    und Nektarinen mit Ursprung in Spanien (ausgenommen den Kanarischen Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1827/89 af 23. juni 1989 om ophævelse
