    τελωνειακών δασμών για τη βουτανόλη και τα
    ισομερή αυτής, άλλα εκτός της κανονικής βουτυλικής
    αλκοόλης, της διακρίσεως 29.04 Α ΙΙΙ ex β) του Κοινού
    Δασμολογίου, καταγωγής Ρουμανίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
