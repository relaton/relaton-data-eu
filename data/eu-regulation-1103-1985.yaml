title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1103/85 of 29 April 1985 re-establishing
    the levying of customs duties on butanol and isomers, other than normal butyl
    alcohol, falling within subheading 29.04 A III ex b and originating in Romania,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1103/85 de la Commission du 29 avril 1985 portant rétablissement
    de la perception des droits de douane applicables au butanol et ses isomères,
    autres que l' alcool butylique normal de la sous-position 29.04 A III ex b) du
    tarif douanier commun, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1103/85 der Kommission vom 29. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Butanol und seine Isomere, andere als Normal-Butylalkohol,
    der Tarifstelle 29.04 A III ex b), mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1103/85 af 29. april 1985 om genindførelse
    af opkrævning af told for butanol samt isomere deraf andre end normal-butylalkohol
    henhørende under pos. 29.04 A III ex b) og med oprindelse i Rumænien, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1103/85 της Επιτροπής
