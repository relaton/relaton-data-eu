    dall' alcole butilico normale della sottovoce doganale 29.04 A III ex b), originari
    della Romania beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1103/85 van de Commissie van 29 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op butanol en
    isomeren daarvan, andere dan normale butylalcohol, van postonderverdeling 29.04
    A III ex b), van oorsprong uit Roemenië, waarvoor de in Verordening (EEG) nr.
    3562/84 van de Raad vermelde tariefpreferenties zijn verleend
