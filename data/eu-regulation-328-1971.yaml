title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 328/71 du Conseil, du 15 février 1971, fixant, dans
    le secteur du tabac brut, des dispositions transitoires pour la conclusion de
    contrats de première transformation et de conditionnement par l'organisme d'intervention
    italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 328/71 des Rates vom 15. Februar 1971 zur Festlegung
    von Übergangsbestimmungen hinsichtlich der von der Interventionsstelle Italiens
    durchzuführenden Verträge über die erste Bearbeitung und Aufbereitung von Rohtabak
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 328/71 del Consiglio, del 15 febbraio 1971, che fissa,
    per il settore del tabacco greggio, disposizioni transitorie per la conclusione
    di contratti di prima trasformazione e di condizionamento da parte dell'organismo
    d'intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 328/71 van de Raad van 15 februari 1971 houdende
    vaststelling, voor de sector ruwe tabak, van overgangsbepalingen voor het afsluiten
    door het Italiaanse interventiebureau van contracten voor eerste bewerking en
    verpakking
  type: main
