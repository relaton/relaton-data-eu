title:
- language: en
  script: Latn
  content: Council Directive 91/69/EEC of 28 January 1991 amending Directive 72/462/EEC
    on health and veterinary inspection problems upon importation of bovine animals
    and swine, fresh meat or meat products from third countries, in order to include
    ovine and caprine animals
  type: main
- language: fr
  script: Latn
  content: Directive 91/69/CEE du Conseil du 28 janvier 1991 modifiant la directive
    72/462/CEE concernant des problèmes sanitaires et de police sanitaire lors de
    l'importation d'animaux des espèces bovine et porcine, des viandes fraîches
    ou de produits à base de viande en provenance des pays tiers, afin d'y intégrer
    les animaux des espèces ovine et caprine
  type: main
- language: de
  script: Latn
  content: 'RICHTLINIE DES RATES vom 28. Januar 1991 zur Änderung der Richtlinie
    72/462/EWG zur Regelung tierseuchenrechtlicher und gesundheitlicher Fragen bei
    der Einfuhr von Rindern und Schweinen, von frischem Fleisch oder von Fleischerzeugnissen
    aus Drittländern zwecks Einbeziehung von Schafen und Ziegen (91/69/EWG) #'
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 28. ledna 1991, kterou se mění směrnice 72/462/EHS
    o veterinárních a hygienických otázkách dovozu skotu, prasat a čerstvého
    masa nebo masných výrobků ze třetích zemí tak, aby se vztahovala také na
    ovce a kozy
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 91/69/EØF af 28. januar 1991 om ændring af direktiv
    72/462/EØF om sundhedsmæssige og veterinærpolitimæssige problemer i forbindelse
    med indførsel af kvæg, svin samt fersk kød og kødprodukter fra tredjelande,
    med henblik på at indbefatte får og geder
  type: main
- language: el
  script: Grek
  content: Οδηγία 91/69/ΕΟΚ του Συμβουλίου της 28ης Ιανουαρίου
    1991 για την τροποποίηση της οδηγίας 72/462/ΕΟΚ
    σχετικά με τα υγειονομικά προβλήματα και τα
    υγειονομικά μέτρα κατά την εισαγωγή ζώων του
    βοείου και χοιρείου είδους, νωπών κρεάτων καθώς
    και προϊόντων με βάση το κρέας προέλευσης τρίτων
    χωρών, προκειμένου να περιληφθούν σ'αυτήν και
    τα ζώα προβείου και αιγείου είδους
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 28. jaanuar 1991, millega muudetakse direktiivi 72/462/EMÜ
    terviseohutuse ja veterinaarkontrolli probleemide kohta veiste ja sigade ning
    värske liha ja lihatoodete impordil kolmandatest riikidest, et hõlmata lambad
    ja kitsed
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 91/69/ETY, annettu 28 päivänä tammikuuta 1991,
    terveyttä ja eläinten terveyttä koskevista ongelmista nautaeläinten ja sikojen
    sekä tuoreen lihan tai lihavalmisteiden tuonnissa kolmansista maista annetun
    direktiivin 72/462/ETY muuttamisesta sen ulottamiseksi koskemaan lampaita ja vuohia
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1991. január 28.) a juh- és kecskeféléknek az
    irányelv hatálya alá történő bevonása céljával a szarvasmarhafélék,
    a sertések, továbbá a friss hús vagy húskészítmények harmadik országból
    történő behozatalára vonatkozó egészségügyi és állat-egészségügyi
    vizsgálatok problémáiról szóló 72/462/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 91/69/CEE del Consiglio del 28 gennaio 1991 che modifica la direttiva
    72/462/CEE relativa a problemi sanitari e di polizia sanitaria all'importazione
    di animali delle specie bovina e suina, di carni fresche o di prodotti a base
    di carne, in provenienza dai paesi terzi, integrandovi gli animali delle specie
    ovina e caprina
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1991. gada 28. janvāris), ar ko groza Direktīvu 72/462/EEK
    par veselības un veterināro pārbaužu problēmām, ievedot liellopus, cūkas,
    svaigu gaļu vai gaļas produktus no trešām valstīm, lai tajā iekļautu aitas
    un kazas
  type: main
- language: lt
  script: Latn
  content: 1991 m. sausio 28 d. Tarybos Direktyva iš dalies keičianti Direktyvą
    72/462/EEB dėl sveikatos ir veterinarinio patikrinimo problemų importuojant
    galvijus, kiaules, šviežią mėsą arba mėsos produktus iš trečiųjų šalių,
    siekiant įtraukti avis ir ožkas
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tat-28 ta’ Jannar 1991 li temenda d-Direttiva
    72/462/KEE dwar is-saħħa u l-problemi ta’ l-ispezzjonijiet veterinarji ta’
    l-importazzjoni ta’ l-annimali tar-razza ta’ l-ifrat u l-majjali, u l-laħam
    frisk jew tal-prodotti tal-laħam minn pajjiżi terzi, sabiex jinkludu annimali
    tar-razza tan-nagħaġ u tar-razza tal-mogħoż
  type: main
- language: nl
  script: Latn
  content: Richtlijn 91/69/EEG van de Raad van 28 januari 1991 houdende wijziging
    van Richtlijn 72/462/EEG inzake gezondheidsvraagstukken en veterinairrechtelijke
    vraagstukken bij de invoer van runderen en varkens, van vers vlees of vleesprodukten
    uit derde landen, ten einde schapen en geiten daarin op te nemen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 28 stycznia 1991 r. zmieniająca dyrektywę 72/462/EWG
    w sprawie problemów zdrowotnych i inspekcji weterynaryjnej przed przywozem z
    państw trzecich bydła, trzody chlewnej, świeżego mięsa lub produktów mięsnych,
    w celu objęcia nią owiec i kóz
  type: main
- language: pt
  script: Latn
  content: Directiva 91/69/CEE do Conselho de 28 de Janeiro de 1991 que altera a Directiva
    72/462/CEE relativa a problemas sanitários e de polícia sanitária na importação
    de animais das espécies bovina e suína, de carnes frescas ou de produtos à
    base de carne provenientes de países terceiros, a fim de incluir na mesma os
    animais das espécies ovina e caprina
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 28. januára 1991, ktorou sa mení a dopĺňa smernica
    72/462/EHS o problémoch zdravotných a veterinárnych kontrol pri dovoze hovädzieho
    dobytka a ošípaných, čerstvého mäsa alebo mäsových výrobkov z tretích
    krajín s cieľom zaradenia oviec a kôz
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 28. januarja 1991 o spremembi Direktive 72/462/EGS
    o problemih glede zdravstvenih in veterinarskih pregledov ob uvozu goveda in prašičev
    ter svežega mesa iz tretjih držav, tako da vključuje še ovce in koze
  type: main
- language: es
  script: Latn
  content: Directiva 91/69/CEE del Consejo de 28 de enero de 1991 por la que se modifica
    la Directiva 72/462/CEE relativa a problemas sanitarios y de policía sanitaria
    en las importaciones de animales de las especies bovina y porcina, de carnes frescas
    y de productos a base de carne procedentes de terceros países, con el fin de
    incluir los animales de las especies ovina y caprina
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 91/69/EEG av den 28 januari 1991 om ändring av direktiv
    72/462/EEG om hälsoproblem och problem som rör veterinärbesiktning vid import
    från tredje land av nötkreatur, får, getter och svin samt av färskt kött
    eller färska köttvaror
