  content: Commission Regulation (EEC) No 2369/91 of 2 August 1991 amending Regulation
    (EEC) No 859/89 laying down detailed rules for the application of intervention
    measures in the beef and veal sector and Regulation (EEC) No 1688/91 derogating
    from the provisions on the deadline for the submission of tenders laid down in
    Regulation (EEC) No 859/89
  type: main
- language: fr
  script: Latn
