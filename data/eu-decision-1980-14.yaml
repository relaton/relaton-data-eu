title:
- language: en
  script: Latn
  content: '80/14/EEC: Council Decision of 18 December 1979 on the provisional application
    to Saint Vincent and the Grenadines (formerly Saint Vincent) of the arrangements
    provided for in Decision 76/568/EEC on the association of the overseas countries
    and territories with the European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '80/14/CEE: Décision du Conseil, du 18 décembre 1979, relative à l''
    application provisoire à Saint-Vincent-et-les-Grenadines (anciennement Saint-Vincent)
    du régime prévu par la décision 76/568/CEE relative à l'' association des
    pays et territoires d'' outre-mer à la Communauté économique européenne'
  type: main
- language: de
  script: Latn
  content: '80/14/EWG: Beschluß des Rates vom 18. Dezember 1979 über die vorläufige
    Anwendung der in dem Beschluß 76/568/EWG über die Assoziation der überseeischen
    Länder und Gebiete mit der Europäischen Wirtschaftsgemeinschaft vorgesehenen
    Regelung auf St. Vincent und Grenadinen (vormals St. Vincent) nach seiner Unabhängigkeit'
  type: main
- language: da
  script: Latn
  content: '80/14/EØF: Rådets afgørelse af 18. december 1979 om foreløbig anvendelse
