    ar ko nosaka no Jaunzēlandes ievestā sviesta tauku satura standartnovirzi parastos
    ražošanas apstākļos saskaņā ar 5. pantu Regulā (EK) Nr. 1374/98, ar ko
    paredz sīki izstrādātus noteikumus par importa režīma piemērošanu un tarifu
    kvotu atvēršanu pienam un piena produktiem, un ar kuru atceļ Lēmumu 2000/432/EK
    (izziņots ar dokumenta numuru C(2002) 3157)
  type: main
- language: lt
  script: Latn
