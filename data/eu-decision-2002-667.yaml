    de determinação do teor de matéria gorda da manteiga importada da Nova Zelândia
    ao abrigo do artigo 5.° do Regulamento (CE) n.° 1374/98 que estabelece regras
    de execução do regime de importação e que abre contingentes pautais no sector
    do leite e dos produtos lácteos, e revoga a Decisão 2000/432/CE [notificada
    com o número C(2002) 3157]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 13. augusta 2002, ktorým sa mení a dopĺňa rozhodnutie
    2001/651/ES ustanovujúce smerodajnú odchýlku obsahu tuku typickú pre proces
    v masle dovezenom z Nového Zélandu podľa článku 5 nariadenia (ES) č. 1374/98,
    ktorým sa ustanovujú podrobné pravidlá uplatňovania dohôd na dovoz a otvorenie
    colných kvót pre mlieko a mliečne výrobky, a ruší rozhodnutie 2000/432/ES
    (Oznámené pod číslom dokumentu C(2002) 3157)
