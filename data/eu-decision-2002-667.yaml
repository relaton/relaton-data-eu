  script: Latn
  content: '2002/667/EC: Commission Decision of 13 August 2002 amending Decision 2001/651/EC
    establishing the typical process standard deviation of the fat content of butter
    imported from New Zealand under Article 5 of Regulation (EC) No 1374/98 laying
    down detailed rules for the application of the import arrangements and opening
    tariff quotas for milk and milk products and repealing Decision 2000/432/EC (notified
    under document number C(2002) 3157)'
  type: main
- language: fr
  script: Latn
  content: '2002/667/CE: Décision de la Commission du 13 août 2002 modifiant la
    décision 2001/651/CE établissant l''écart type, dans les mêmes conditions
    de fabrication, de la teneur en matières grasses du beurre importé en provenance
    de Nouvelle-Zélande conformément à l''article 5 du règlement (CE) n° 1374/98
    portant modalités d''application du régime d''importation et portant ouverture
    des contingents tarifaires dans le secteur du lait et des produits laitiers, et
    abrogeant la décision 2000/432/CE [notifiée sous le numéro C(2002) 3157]'
  type: main
- language: de
