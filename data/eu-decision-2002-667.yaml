    modifica della decisione 2001/651/CE che stabilisce la deviazione standard del
    tenore di materie grasse caratteristica del processo per il burro importato dalla
    Nuova Zelanda ai sensi dell''articolo 5 del regolamento (CE) n. 1374/98 relativo
    alle modalità d''applicazione del regime d''importazione del latte e dei prodotti
    lattiero-caseari e all''apertura di contingenti tariffari in tale settore e che
    abroga la decisione 2000/432/CE [notificata con il numero C(2002) 3157]'
  type: main
- language: lv
  script: Latn
