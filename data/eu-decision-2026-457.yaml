    alimentare și a furajelor fabricate din sfecla de zahăr modificată genetic
    KWS20-1 în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European
    și al Consiliului [notificată cu numărul C(2026) 1262]
  type: main
- language: sk
  script: Latn
