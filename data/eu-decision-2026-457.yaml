    генетично модифицирано захарно цвекло KWS20-1,
    съгласно Регламент (ЕО) № 1829/2003 на Европейския
    парламент и на Съвета (нотифицирано под номер
    С(2026) 1262)
  type: main
- language: cs
  script: Latn
