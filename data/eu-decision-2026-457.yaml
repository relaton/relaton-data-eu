title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/457 of 27 February 2026 authorising
    the placing on the market of food, food ingredients and feed produced from genetically
    modified sugar beet KWS20-1 pursuant to Regulation (EC) No 1829/2003 of the European
    Parliament and of the Council (notified under document C(2026) 1262)
  type: main
- language: fr
  script: Latn
