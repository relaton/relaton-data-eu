    levensmiddeleningrediënten en diervoeders die zijn geproduceerd met de genetisch
    gemodificeerde suikerbiet KWS20-1 krachtens Verordening (EG) nr. 1829/2003 van
    het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2026)
    1262)
  type: main
- language: pl
  script: Latn
