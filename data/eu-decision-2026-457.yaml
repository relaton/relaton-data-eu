    διάθεσης στην αγορά τροφίμων, συστατικών τροφίμων
    και ζωοτροφών που παράγονται από γενετικώς
    τροποποιημένο ζαχαρότευτλο KWS20-1 σύμφωνα με
    τον κανονισμό (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού
