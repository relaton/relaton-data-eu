    2026 autorisant la mise sur le marché de denrées alimentaires, d’ingrédients
    alimentaires et d’aliments pour animaux produits à partir de la betterave sucrière
    génétiquement modifiée KWS20-1, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2026) 1262]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/457 der Kommission vom 27. Februar 2026
