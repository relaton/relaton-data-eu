    élelmiszer-összetevők és takarmányok forgalomba hozatalának az 1829/2003/EK
    európai parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2026) 1262. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/457 della Commissione, del 27 febbraio
    2026, che autorizza l’immissione in commercio di alimenti, ingredienti alimentari
    e mangimi derivati da barbabietola da zucchero geneticamente modificata KWS20-1
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2026) 1262]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/457 (2026. gada 27. februāris),
