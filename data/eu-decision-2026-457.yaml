    KWS20-1 gewonnenen Lebensmitteln, Lebensmittelzutaten und Futtermitteln gemäß
    der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen C(2026) 1262)
  type: main
- language: bg
  script: Cyrl
