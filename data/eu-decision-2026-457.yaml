    alimentares e alimentos para animais produzidos a partir de beterraba-sacarina
    geneticamente modificada KWS20-1 nos termos do Regulamento (CE) n.o 1829/2003
    do Parlamento Europeu e do Conselho [notificada com o número C(2026) 1262]
  type: main
