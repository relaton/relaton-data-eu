title:
- language: en
  script: Latn
  content: "/* 72/271/EEC: Commission Decision of 7 July 1972 exempting the Grand-Duchy of Luxembourg from applying to certain species the Council Directive of 29 September 1970 on the marketing of vegetable seed */ (Only the French text is authentic)"
  type: main
- language: fr
  script: Latn
  content: '72/271/CEE: Décision de la Commission, du 7 juillet 1972, dispensant
    le grand-duché de Luxembourg d''appliquer à certaines espèces la directive
    du Conseil, du 29 septembre 1970, concernant la commercialisation des semences
    de légumes (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '72/271/EWG: Entscheidung der Kommission vom 7. Juli 1972 zur Entbindung
    des Großherzogtums Luxemburg von der Verpflichtung, die Richtlinie des Rates
    vom 29. September 1970 über den Verkehr mit Gemüsesaatgut hinsichtlich einiger
    Arten anzuwenden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: "/* 72/271/CEE: Kommissionens beslutning af 7. juli 1972, om fritagelse af storhertugdømmet Luxembourg for, for visse arter, at anvende Rådets direktiv af 29. september 1970 om handel med grønsagsfrø */ (Kun den franske udgave er autentisk)"
  type: main
- language: el
  script: Grek
  content: '72/271/ΕΟΚ: Απόφαση της Επιτροπής, της 7ης
