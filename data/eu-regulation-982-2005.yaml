title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 982/2005 of 28 June 2005 determining the
    extent to which applications lodged in June 2005 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 593/2004 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 982/2005 de la Commission du 28 juin 2005 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juin 2005 pour certains produits du secteur des œufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 593/2004 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 982/2005 der Kommission vom 28. Juni 2005 über die
    Festsetzung des Umfangs, in dem die im Juni 2005 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 593/2004 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 982/2005 ze dne 28. června 2005, kterým se
    stanoví rozsah, v němž mohou být přijímány žádosti o dovozní licence
    na některé výrobky z odvětví vajec a drůbežího masa podané v červnu
    2005 na základě nařízení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 982/2005 af 28. juni 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    2005 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 593/2004 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 982/2005 της Επιτροπής,
    της 28ης Ιουνίου 2005, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούνιο του 2005 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 593/2004 και (ΕΚ) αριθ.
    1251/96
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 982/2005, 28. juuni 2005, millega määratakse
    kindlaks, millises ulatuses võib heaks kiita määruste (EÜ) nr 593/2004 ja
    (EÜ) nr 1251/96 alusel juunis 2005 esitatud teatavate muna- ja kodulinnulihasektorite
    toodete impordilitsentsi taotlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 982/2005, annettu 28 päivänä kesäkuuta 2005,
    määrättyyn järjestelmään liittyvien kesäkuussa 2005 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 593/2004 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság 982/2005/EK rendelete (2005. június 28.) az 593/2004/EK és
