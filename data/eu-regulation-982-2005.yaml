    egyes termékeire vonatkozó behozatali engedélyek iránt 2005 júniusában benyújtott
    kérelmek elfogadhatósága mértékének meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 982/2005 della Commissione, del 28 giugno 2005, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di giugno 2005 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 593/2004 e (CE) n. 1251/96
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 982/2005 (2005. gada 28. jūnijs), ar ko nosaka
