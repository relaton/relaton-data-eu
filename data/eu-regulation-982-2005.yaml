    olu nozares produktu importa atļauju pieteikumus, saskaņā ar shēmām, kas
    ir paredzētas Regulās (EK) Nr. 593/2004 un (EK) Nr. 1251/96
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 28 d. Komisijos reglamentas (EB) Nr. 982/2005, nustatantis
