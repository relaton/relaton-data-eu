    m. birželio mėn. kai kuriems paukštienos ir kiaušinių sektorių produktams
    pagal Reglamentus (EB) Nr. 593/2004 ir (EB) Nr. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 982/2005 van de Commissie van 28 juni 2005 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren eieren en slachtpluimvee, die in juni 2005
    worden ingediend op grond van de Verordeningen (EG) nr. 593/2004 en (EG) nr. 1251/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 982/2005 z dnia 28 czerwca 2005 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w czerwcu 2005 r.
    o pozwolenia na przywóz niektórych produktów z sektorów jaj i mięsa drobiowego
    w ramach rozporządzeń (WE) nr 593/2004 i nr 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 982/2005 da Comissão, de 28 de Junho de 2005, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Junho de 2005 ao abrigo dos Regulamentos (CE) n.° 593/2004 e (CE) n.° 1251/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 982/2005 z 28. júna 2005, ktoré určuje rozsah,
    v ktorom možno prijať žiadosti o dovozné povolenia predložené v júni 2005
    na niektoré produkty v sektore vajec a hydinového mäsa v rámci nariadení
    (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 982/2005 z dne 28. junija 2005 o določitvi obsega,
    v katerem se lahko sprejmejo zahtevki, vloženi junija 2005 za uvozna dovoljenja
    za nekatere proizvode iz sektorjev jajc in perutninskega mesa v skladu z uredbama
    (ES) št. 593/2004 in (ES) št. 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 982/2005 de la Comisión, de 28 de junio de 2005, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de los huevos y de la carne de
    aves de corral presentadas en el mes de junio de 2005 al amparo de los Reglamentos
    (CE) n° 593/2004 y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 982/2005 av den 28 juni 2005 om fastställande
