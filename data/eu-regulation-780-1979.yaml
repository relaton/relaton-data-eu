title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 780/79 of 19 April 1979 re-establishing
    the levying of customs duties on woven fabrics of silk, of noil or other waste
    silk, falling within heading No 50.09 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 780/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie, de bourre de soie (schappe) ou de déchets de bourre de soie (bourrette),
    de la position tarifaire 50.09, originaires des pays et territoires en voie de
    développement bénéficiaires de préférences tarifaires prévues par le règlement
    (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 780/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Gewebe aus Seide, Schappeseide oder Bourretteseide, der Tarifnummer
    50.09, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 780/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stol af natursilke (herunder schappesilke
    og bourettesilke) under pos. 50.09, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 780/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta, di
    borra di seta (schappe) o di cascami di borra di seta (roccadino o pettenuzzo
    di seta) della voce doganale 50.09, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 780/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van zijde, van vlokzijde of van bourrette, van post 50.09, van oorsprong uit de
    ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3157/78 van
    de Raad tariefpreferenties werden geopend
  type: main
