    complementario a los intercambios (MCI) entre España y la Comunidad en su composición
    el 31 de diciembre de 1985 en el sector de las frutas y hortalizas por lo que
    se refiere a los tomates, las lechugas, las escarolas, las zanahorias, las alcachofas,
    las uvas de mesa, los melones, los albaricoques, los melocotones y las fresas
