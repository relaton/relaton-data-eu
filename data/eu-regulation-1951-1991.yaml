title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1951/91 of 3 July 1991 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to fruit and vegetable trade between Spain and the Community as constituted
    at 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, table grapes, melons, apricots, peaches and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1951/91 de la Commission, du 3 juillet 1991, fixant
    certaines modalités additionnelles pour l' application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l' Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les carottes, les artichauts, les
    raisins de table, les melons, les abricots, les pêches et les fraises
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1951/91 der Kommission vom 3. Juli 1991 mit zusätzlichen
    Bestimmungen zum ergänzenden Handelsmechanismus (EHM) für Tomaten, Salat, Endivie
    Eskariol, Karotten, Artischocken, Tafeltrauben, Melonen, Aprikosen, Pfirsichen
    und Erdbeeren im Handel zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung
    am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1951/91 af 3. juli 1991 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 i
    sektoren for frugt og grønsager, for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, druer til spisebrug, meloner, abrikoser, ferskner
    og jordbær
  type: main
- language: el
  script: Grek
