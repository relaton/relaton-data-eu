    Dauerausschreibung für Weißzucker durchgeführten 9. Teilausschreibung nicht
    stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1875/87 af 1. juli 1986 om ikke at
    gennemføre den niende dellicitation for hvidt sukker, der er afholdt inden for
    rammerne af den løbende licitation omhandlet i forordning (EØF) nr. 1092/87
  type: main
