  content: Commission Regulation (EEC) No 1875/87 of 1 July 1987 on a decision to
    make no award in respect of the ninth partial invitation to tender for white sugar
    issued in connection with the standing invitation to tender referred to in Regulation
    (EEC) No 1092/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1875/87 de la Commission, du 1er juillet 1987, portant
