    blanc effectuée dans le cadre de l'adjudication permanente visée au règlement
    (CEE) n 1092/87
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1875/87 der Kommission vom 1. Juli 1987 über die
