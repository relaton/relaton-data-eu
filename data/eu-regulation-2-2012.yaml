  script: Latn
  content: Council Implementing Regulation (EU) No 2/2012 of 4 January 2012 imposing
    a definitive anti-dumping duty on imports of certain stainless steel fasteners
    and parts thereof originating in the People’s Republic of China and Taiwan following
    an expiry review pursuant to Article 11(2) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
