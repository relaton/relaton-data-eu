id: EURegulation2081983
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 208/83 of 27 January 1983 specifying the
    extent to which applications lodged during the month of January 1983 for import
    licences in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 208/83 de la Commission, du 27 janvier 1983, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation au mois de janvier 1983 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 208/83 der Kommission vom 27. Januar 1983 über das
    Ausmaß, in dem den im Januar 1983 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 208/83 af 27. januar 1983 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i januar
    1983, for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 208/83 της Επιτροπής
    της 27ης Ιανουαρίου 1983 περί καθορισμού σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο του 1983 για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 208/83 della Commissione, del 27 gennaio 1983, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di gennaio 1983 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 208/83 van de Commissie van 27 januari 1983 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in januari 1983 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
