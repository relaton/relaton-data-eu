title:
- language: fr
  script: Latn
  content: '70/47/CEE: Décision de la Commission, du 22 décembre 1969, dispensant
    la République française d''appliquer, à certaines espèces, les directives
    du Conseil, du 14 juin 1966, concernant la commercialisation des semences de plantes
    fourragères et de céréales (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '70/47/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Entbindung der Französischen Republik von der Verpflichtung, die Richtlinien
    des Rates vom 14. Juni 1966 über den Verkehr mit Futterpflanzensaatgut und Getreidesaatgut
    hinsichtlich einiger Arten anzuwenden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '70/47/CEE: Décision de la Commission, du 22 décembre 1969, dispensant
    la République française d''appliquer, à certaines espèces, les directives
    du Conseil, du 14 juin 1966, concernant la commercialisation des semences de plantes
    fourragères et de céréales (Kun den franske udgave er autentisk) /* Den danske
    udgave er ikke til rådighed */'
  type: main
- language: it
  script: Latn
  content: '70/47/CEE: Decisione della Commissione, del 22 dicembre 1969, che dispensa
    la Repubblica francese dell''applicazione, per certe specie, delle direttive del
    Consiglio del 14 giugno 1966 relative alla commercializzazione delle sementi di
    piante foraggere e di cereali (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '70/47/EEG: Besluit van de Commissie van 22 december 1969 tot ontheffing
    van de Franse Republiek van de toepassing ten aanzien van bepaalde gewassen van
    de richtlijnen van de Raad van 14 juni 1966 betreffende het in de handel brengen
    van zaaizaad van groenvoedergewassen en van zaaigranen (Slechts de tekst in de
    Franse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '70/47/CEE: Decisión de la Comisión, de 22 de diciembre de 1969, por
    la que se dispensa a la República Francesa de aplicar, a determinadas especies,
    las directivas del Consejo de 14 de junio de 1966, relativas a la comercialización
    de las semillas de plantas forrajeras y de cereales (El texto en lengua francesa
    es el único auténtico)'
