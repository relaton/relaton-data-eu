title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1289/2000 of 19 June 2000 determining, for
    the 2000 marketing year, the estimated loss of income and the estimated level
    of premium payable per ewe and per female goat and fixing the first advance payment
    for this premium and an advance payment of the specific aid for sheep and goat
    farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1289/2000 de la Commission du 19 juin 2000 portant
    détermination, pour la campagne de commercialisation 2000, de la perte de revenu
    estimée et du montant estimé de la prime payable par brebis et par chèvre,
    et fixant la première avance payable sur cette prime et l'avance payable sur
    l'aide spécifique à l'élevage caprin et ovin dans certaines régions défavorisées
    de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1289/2000 der Kommission vom 19. Juni 2000 zur Bestimmung
    des geschätzten Einkommensausfalls und der voraussichtlichen Prämienzahlungen
    je Mutterschaf und Ziege, des ersten Vorschusses auf diese Prämien sowie eines
    Vorschusses auf die Sonderbeihilfe für die Schaf- und Ziegenhaltung in bestimmten
    benachteiligten Gebieten der Gemeinschaft im Wirtschaftsjahr 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1289/2000 af 19. juni 2000 om fastsættelse
    for produktionsåret 2000 af det anslåede indkomsttab, det anslåede præmiebeløb,
    der skal betales pr. moderfår og moderged, det første forskud på dette præmiebeløb
    samt acontobeløbet på den særlige støtte til fåre- og gedeopdræt i visse
    ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1289/2000 της Επιτροπής,
    της 19ης Ιουνίου 2000, περί προσδιορισμού, για
    την περίοδο εμπορίας 2000, της εκτιμώμενης απώλειας
    εισοδήματος και του εκτιμώμενου ύψους πριμοδότησης
    που καταβάλλεται ανά προβατίνα και ανά αίγα,
    καθώς και του ποσού της πρώτης προκαταβολής
    της πριμοδότησης αυτής και του ποσού της προκαταβολής
    της ειδικής ενίσχυσης στην εκτροφή αιγοπροβάτων
    σε ορισμένες μειονεκτικές ζώνες της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1289/2000, annettu 19 päivänä kesäkuuta 2000,
    markkinointivuoden 2000 osalta arvioidun tulonmenetyksen sekä uuhta ja naaraspuolista
    vuohta kohden maksettavan palkkion arvioidun tason määrittämisestä sekä tämän
    palkkion ensimmäisen ennakkomaksun ja tietyillä yhteisön epäsuotuisilla alueilla
    lampaan ja vuohen kasvatukselle maksettavan erityisen tuen ennakkomaksun vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1289/2000 della Commissione, del 19 giugno 2000, che
    determina, per la campagna 1999, la perdita stimata di reddito, l'importo stimato
    del premio pagabile per pecora e per capra, l'ammontare del secondo acconto del
    premio, nonché l'ammontare di un acconto dell'aiuto specifico per l'allevamento
    ovocaprino in alcune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1289/2000 van de Commissie van 19 juni 2000 tot vaststelling,
    voor het verkoopseizoen 2000, van het geraamde inkomensverlies en van het geraamde
    premiebedrag per ooi en per vrouwelijke geit alsmede van het eerste voorschot
    op deze premie en van een voorschot op de bijzondere steun voor de schapen- en
    geitenhouderij in bepaalde probleemgebieden van de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1289/2000 da Comissão, de 19 de Junho de 2000, que
    determina, para a campanha de 2000, a perda estimada de rendimento e o montante
    estimado do prémio pagável por ovelha e por cabra e fixa o montante do primeiro
    pagamento por conta desse prémio, bem como o montante de um pagamento por conta
    da ajuda específica à criação de ovinos e caprinos em determinadas zonas desfavorecidas
    da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1289/2000 de la Comisión, de 19 de junio de 2000,
    por el que se determinan para la campaña de comercialización 2000 la pérdida
    de renta estimada y el importe previsto de la prima por oveja y cabra, y por el
    que se fijan el importe del primer anticipo de esa prima y el de un anticipo de
    la ayuda específica para la cría ovina y caprina de algunas zonas desfavorecidas
    de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1289/2000 av den 19 juni 2000 om fastställande
    för regleringsåret 2000 av det beräknade inkomstbortfallet och det beräknade
    bidraget per tacka och per honget och om fastställande av den första förskottsutbetalningen
    av detta bidrag samt en förskottsbetalning av det särskilda stödet för uppfödning
    av får och getter i vissa mindre gynnade områden i gemenskapen
