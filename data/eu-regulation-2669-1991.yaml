title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2669/91 of 6 September 1991 re-establishing
    the levying of customs duties on products falling within CN code 8712 00, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2669/91 DE LA COMMISSION du 6 septembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 8712 00 originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2669/91 DER KOMMISSION vom 6. September 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 8712 00
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2669/91 af 6. september 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8712 00 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
