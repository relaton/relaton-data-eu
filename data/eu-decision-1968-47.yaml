title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 janvier 1968, portant prorogation de
    la décision, du 29 juin 1967, autorisant la République italienne, en vertu de
    l'article 115, alinéa I du Traité, à exclure du traitement communautaire le
    "bichromate de sodium", de la position Ex 28.47 B II du Tarif douanier commun,
    originaire de certains pays de l'Est et mis en libre pratique dans d'autres États
    membres
  type: main
- language: de
  script: Latn
  content: '68/47/EWG: Entscheidung der Kommission vom 10. Januar 1968 zur Verlängerung
    der Entscheidung vom 29. Juni 1967, mit der die Italienische Republik auf Grund
    des Artikels 115 Absatz 1 des Vertrages ermächtigt wurde, Natriumbichromat der
    Tarifnummer ex 28.47 B II des Gemeinsamen Zolltarifs mit Ursprung in bestimmten
    Ostblockländern, das sich in den übrigen Mitgliedstaaten im freien Verkehr befindet,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/47/CEE: Decisione della Commissione, del 10 gennaio 1968, relativa
    alla proroga della decisione del 29 giugno 1967 che autorizza la Repubblica italiana
    ai sensi dell''articolo 115, primo comma, del trattato, ad escludere dal trattamento
    comunitario il bicromato di sodio della voce ex 28.47 B II della tariffa doganale
    comune, originario di taluni paesi dell''Est e messo in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/47/EEG: Beschikking van de Commissie van 10 januari 1968 tot verlenging
    van de beschikking van 29 juni 1967 houdende machtiging van de Italiaanse Republiek
    om op grond van artikel 115, eerste alinea, van het Verdrag natriumdichromaat
    van post ex 28.47 B II van het gemeenschappelijk douanetarief, van oorsprong uit
    sommige oostelijke landen en in andere Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
