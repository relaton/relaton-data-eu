  content: '93/611/EC: Commission Decision of 23 November 1993 on the establishment
    of a second supplement to the Community support framework for Community structural
    assistance for the improvement of the conditions under which agricultural and
    forestry products are processed and marketed in Belgium (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/611/CE: Décision de la Commission du 23 novembre 1993 concernant l''établissement
