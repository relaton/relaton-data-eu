    forst- und landwirtschaftlicher Erzeugnisse in Belgien (Nur der französische
    und der niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/611/EF: KOMMISSIONENS BESLUTNING af 23. november 1993 om fastlæggelse
