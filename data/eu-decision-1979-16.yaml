type: standard
title:
- language: en
  script: Latn
  content: '79/16/EEC: Commission Decision of 1 December 1978 authorizing the French
    Republic not to apply Community treatment to woven fabrics of man-made fibres
    (discontinuous or waste), falling within subheading ex 56.07 A of the Common Customs
    Tariff (NIMEXE codes 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 18, 21, 23, 24,
    26, 28, 32, 34, 36), originating in Taiwan and in free circulation in the other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '79/16/CEE: Décision de la Commission, du 1er décembre 1978, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques et artificielles discontinues de la sous-position
    ex 56.07 A du tarif douanier commun (codes Nimexe: 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 18, 21, 23, 24, 26, 28, 32, 34, 36), originaires de T'' ai-wan et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/16/EWG: Entscheidung der Kommission vom 1. Dezember 1978, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen oder künstlichen
    Spinnfasern der Tarifstelle ex 56.07 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern:
    56.07-01; 04; 05; 07; 08; 11; 13; 14; 16; 18; 21; 23; 24; 26; 28; 32; 34; 36)
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/16/EØF: Kommissionens beslutning af 1. december 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre eller affald af kemofibre, som henhører under pos. ex 56.07
    A i den fælles toldtarif (NIMEXE-nummer 56.07-01, 04, 05, 07, 08, 11, 13, 14,
    16, 18, 21, 23, 24, 26, 28, 32, 34, 36), som har oprindelse i Taiwan og frit kan
    omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/16/CEE: Decisione della Commissione, del 1° dicembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche e artificiali in fiocco, della sottovoce ex 56.07 A della tariffa
    doganale comune (codice Nimexe: 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 18,
    21, 23, 24, 26, 28, 32, 34, 36), originari di Taiwan e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/16/EEG: Beschikking van de Commissie van 1 december 1978 waarbij de
    Franse Republiek wordt gemachtigd weefsels van synthetische of van kunstmatige
    stapelvezels van post ex 56.07 A van het gemeenschappelijk douanetarief (NIMEXE-code
    : 56.07-01 ; 04 ; 05 ; 07 ; 08 ; 11 ; 13 ; 14 ; 16 ; 18 ; 21 ; 23 ; 24 ; 26 ;
    28 ; 32 ; 34 ; 36), van oorsprong uit Taiwan en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
