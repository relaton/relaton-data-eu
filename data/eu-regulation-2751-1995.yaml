title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2751/95 of 29 November 1995 determining to
    what extent applications for the right to import for cows and heifers of certain
    mountain breeds lodged under Regulation (EC) No 2483/95 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2751/95 de la Commission, du 29 novembre 1995, déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l' importation
    déposées au titre du règlement (CE) nº 2483/95 relatif à l' importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2751/95 der Kommission vom 29. November 1995 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte für Kühe und Färsen bestimmter
    Höhenrassen gemäß der Verordnung (EG) Nr. 2483/95 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2751/95 af 29. november 1995 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergracer i henhold til forordning (EF) nr. 2483/95 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2751/95 της Επιτροπής
    της 29ης Νοεμβρίου 1995 για να καθορισθεί σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται
    βάσει του κανονισμού (ΕΚ) αριθ. 2483/95 όσον αφορά
    την εισαγωγή αγελάδων και δαμάλεων ορισμένων
    ορεσίβιων φυλών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2751/95, annettu 29 päivänä marraskuuta 1995,
    asetuksen (EY) N:o 2483/95 mukaisesti jätettyjen tiettyihin vuoristorotuihin
    kuuluvia lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2751/95 della Commissione, del 29 novembre 1995, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel quadro del regolamento (CE) n. 2483/95 relativo all' importazione
    di vacche e giovenche di alcune razze di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2751/95 van de Commissie van 29 november 1995 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de ingediende aanvragen
    voor invoerrechten op grond van Verordening (EG) nr. 2483/95 betreffende de invoer
    van koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2751/95 da Comissão, de 29 de Novembro de 1995, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 2483/95 relativo à importação
    de vacas e de novilhas de determinadas raças de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2751/95 de la Comisión, de 29 de noviembre de 1995,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    expedición de certificados de importación presentadas con arreglo al Reglamento
    (CE) nº 2483/95 relativo a las importaciones de vacas y novillas de determinadas
    razas de montaña
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2751/95 av den 29 november 1995 om fastställande
