  script: Latn
  content: Commission Regulation (EU) 2025/2224 of 5 November 2025 amending Annex
    II to Regulation (EC) No 1925/2006 of the European Parliament and of the Council
    and Annex II to Directive 2002/46/EC of the European Parliament and of the Council
