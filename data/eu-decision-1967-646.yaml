title:
- language: fr
  script: Latn
  content: Décision 67/646/CEE de la Commission, du 5 octobre 1967, autorisant la
    République française, en vertu de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire les "lampes électriques portatives" de la position
    n° 85.10 Ex B du tarif douanier, originaires de Hong-Kong et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/646/EWG: Entscheidung der Kommission vom 5. Oktober 1967, mit der die
    Französische Republik ermächtigt wird, gemäß Artikel 115 Absatz (1) des Vertrages
    aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    "tragbare elektrische Leuchten" der Tarifnummer 85.10 ex B des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/646/CEE: Decisione della Commissione, del 5 ottobre 1967, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del Trattato,
    ad escludere dal trattamento comunitario le «lampade elettriche portatili» della
    voce n. 85.10 ex B della tariffa doganale comune, originarie di Hong Kong e immesse
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/646/EEG: Beschikking van de Commissie van 5 oktober 1967 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea, van het Verdrag
    draagbare elektrische lampen van post 85.10 ex B van het gemeenschappelijk douanetarief,
    die van oorsprong zijn uit Hong-Kong en in andere Lid-Staten in het vrije verkeer
    zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
