  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2082/2005, 19. detsember 2005 , millega muudetakse
    määrust (EÜ) nr 1497/2001 (millega kehtestatakse Bulgaariast, Eestist, Horvaatiast,
    Leedust, Liibüast, Rumeeniast, Ukrainast ja Valgevenest pärit uurea impordi
    suhtes ajutised dumpinguvastased tollimaksud), kiidetakse heaks hinnakohustus,
    mille võtmiseks on teinud ettepaneku Bulgaaria eksportiv tootja ning lõpetatakse
    menetlus Egiptusest ja Poolast pärit uurea impordi suhtes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2082/2005, annettu 19 päivänä joulukuuta 2005
    , väliaikaisten polkumyyntitullien käyttöönotosta Bulgariasta, Kroatiasta,
    Libyasta, Liettuasta, Romaniasta, Ukrainasta, Valko-Venäjältä ja Virosta peräisin
    olevan virtsa-aineen (urea) tuonnissa, bulgarialaisen vientiä harjoittavan tuottajan
    tarjoaman sitoumuksen hyväksymisestä sekä Egyptistä ja Puolasta peräisin
    olevan virtsa-aineen tuontia koskevan menettelyn päättämisestä annetun asetuksen
    (EY) N:o 1497/2001 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2082/2005/EK rendelete ( 2005. december 19. ) a Belaruszból,
    Bulgáriából, Észtországból, Horvátországból, Litvániából, Líbiából,
    Romániából és Ukrajnából származó karbamid behozatalára vonatkozó ideiglenes
    dömpingellenes vám kivetéséről, a bulgáriai exportáló termelő által
    felajánlott kötelezettségvállalás elfogadásáról és az Egyiptomból, valamint
    Lengyelországból származó karbamid behozatalára vonatkozó eljárás megszüntetéséről
    szóló 1497/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2082/2005 della Commissione, del 19 dicembre 2005 ,
    recante modifica del regolamento (CE) n. 1497/2001 della Commissione che istituisce
    dazi antidumping provvisori sulle importazioni di urea originarie della Bielorussia,
    della Bulgaria, della Croazia, dell’Estonia, della Libia, della Lituania, della
    Romania e dell’Ucraina, accetta un impegno offerto dal produttore esportatore
    della Bulgaria e chiude il procedimento per quanto riguarda le importazioni di
    urea originarie dell’Egitto e della Polonia
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2082/2005 ( 2005. gada 19. decembris ) par grozījumiem
    Regulā (EK) Nr. 1497/2001, ar ko piemēro antidempinga pagaidu maksājumu par
    tādas urīnvielas importu, kuras izcelsme ir Baltkrievijā, Bulgārijā, Horvātijā,
    Igaunijā, Lībijā, Lietuvā, Rumānijā un Ukrainā, par Bulgārijas ražotāja
    eksportētāja piedāvāto saistību akceptēšanu un par procedūras izbeigšanu
    attiecībā uz Ēģiptes un Polijas izcelsmes urīnvielas importu
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 19 d. Komisijos reglamentas (EB) Nr. 2082/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 1497/2001, nustatantį laikinuosius antidempingo
    muitus Baltarusijos, Bulgarijos, Kroatijos, Estijos, Libijos, Lietuvos, Rumunijos
    ir Ukrainos kilmės karbamido importui, pripažįstantį Bulgarijos eksportuojančio
    gamintojo įsipareigojimą ir užbaigiantį tyrimą dėl Egipto ir Lenkijos kilmės
    karbamido importo
  type: main
- language: mt
  script: Latn
  content: '2082/2005/KE: Regolament tal-Kummissjoni (KE) Nru 2082/2005 tad- 19 ta’
    Diċembru 2005 li jemenda r-Regolament tal-Kummissjoni (KE) Nru 1497/2001 li jimponi
    dazji anti-dumping fuq l-importazzjonijiet ta’ l-urea li toriġina mill-Belarus,
    il-Bulgarija, il-Kroazja, l-Estonja, il-Libja, il-Litwanja, ir-Rumanija u l-Ukraina,
    li jaċċetta impenn offrut mill-produttur esportatur fil-Bulgarija u li jtemm
    il-proċedura fir-rigward ta’ l-importazzjonijiet ta’ l-urea li toriġina
    mill-Eġittu u l-Polonja.'
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2082/2005 van de Commissie van 19 december 2005 tot
    wijziging van Verordening (EG) nr. 1497/2001 tot instelling van voorlopige antidumpingrechten
    op ureum uit Belarus, Bulgarĳe, Estland, Kroatië, Libië, Litouwen, Oekraïne
    en Roemenië, tot aanvaarding van de verbintenis van een producent/exporteur in
    Bulgarĳe en tot beëindiging van de procedure ten aanzien van Egypte en Polen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2082/2005 z dnia 19 grudnia 2005 r. zmieniające
    rozporządzenie (WE) nr 1497/2001 nakładające tymczasowe cła antydumpingowe
    na przywóz mocznika pochodzącego z Białorusi, Bułgarii, Chorwacji, Estonii,
    Libii, Litwy, Rumunii i Ukrainy, przyjmujące zobowiązanie złożone przez producenta
    eksportującego z Bułgarii oraz kończące postępowanie w sprawie przywozu mocznika
    pochodzącego z Egiptu i Polski
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2082/2005 da Comissão, de 19 de Dezembro de 2005
    , que altera o Regulamento (CE) n. o 1497/2001 da Comissão que cria direitos
    anti-dumping provisórios sobre as importações de ureia originária da Bielorrússia,
    da Bulgária, da Croácia, da Estónia, da Líbia, da Lituânia, da Roménia e
    da Ucrânia, e que aceita um compromisso oferecido pelo produtor-exportador da
    Bulgária e que encerra o processo no que diz respeito às importações de ureia
    originária do Egipto e da Polónia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2082/2005 z 19. decembra 2005 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 1497/2001, ktorým sa ukladá dočasné antidumpingové
    clo na dovoz močoviny s pôvodom v Bielorusku, Bulharsku, Chorvátsku, Estónsku,
    Líbyi, Litve, Rumunsku a na Ukrajine, prijíma sa záväzok ponúknutý vyvážajúcim
    výrobcom v Bulharsku a ukončuje sa konanie, pokiaľ ide o dovoz močoviny s
    pôvodom v Egypte a Poľsku
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2082/2005 z dne 19. decembra 2005 o spremembi
    Uredbe (ES) št. 1497/2001 o uvedbi začasnih protidampinških dajatev na uvoz
    sečnine s poreklom iz Belorusije, Bolgarije, Hrvaške, Estonije, Libije, Litve,
    Romunije in Ukrajine, sprejetju zaveze, ki jo je ponudil proizvajalec iz Bolgarije,
    ter ukinitvi postopka v zvezi z uvozom sečnine s poreklom iz Egipta in Poljske
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2082/2005 de la Comisión, de 19 de diciembre de 2005
    , que modifica el Reglamento (CE) n o 1497/2001 por el que se establecen derechos
    antidumping provisionales sobre las importaciones de urea originarias de Belarús,
    Bulgaria, Croacia, Estonia, Libia, Lituania, Rumanía y Ucrania, se acepta un
    compromiso ofrecido por un exportador/productor de Bulgaria y se concluye el procedimiento
    por lo que se refiere a las importaciones de urea originarias de Egipto y Polonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2082/2005 av den 19 december 2005 om
    ändring av förordning (EG) nr 1497/2001 om införande av preliminära antidumpningstullar
    på import av karbamid (urinämne) med ursprung i Vitryssland, Bulgarien, Kroatien,
    Estland, Libyen, Litauen, Rumänien och Ukraina, om godtagande av ett åtagande
    som gjorts av den exporterande tillverkaren i Bulgarien och om avslutande av förfarandet
    rörande import av karbamid (urinämne) med ursprung i Egypten och Polen
