title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2082/2005 of 19 December 2005 amending Regulation
    (EC) No 1497/2001 imposing provisional anti-dumping duties on imports of urea
    originating in Belarus, Bulgaria, Croatia, Estonia, Libya, Lithuania, Romania
    and the Ukraine, accepting an undertaking offered by the exporting producer in
    Bulgaria and terminating the proceeding as regards imports of urea originating
    from Egypt and Poland
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2082/2005 de la Commission du 19 décembre 2005 modifiant
    le règlement (CE) n o 1497/2001 instituant des droits antidumping provisoires
    sur les importations d'urée originaire du Belarus, de Bulgarie, de Croatie, d'Estonie,
    de Libye, de Lituanie, de Roumanie et d'Ukraine, portant acceptation d'un engagement
    offert par le producteur-exportateur en Bulgarie et clôturant la procédure en
    ce qui concerne les importations d'urée originaire d'Égypte et de Pologne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2082/2005 der Kommission vom 19. Dezember 2005 zur
    Änderung der Verordnung (EG) Nr. 1497/2001 zur Einführung vorläufiger Antidumpingzölle
    auf die Einfuhren von Harnstoff mit Ursprung in Belarus, Bulgarien, Kroatien,
    Estland, Libyen, Litauen, Rumänien und der Ukraine, zur Annahme eines Verpflichtungsangebotes
    des ausführenden Herstellers in Bulgarien und zur Einstellung des Verfahrens
    betreffend die Einfuhren von Harnstoff mit Ursprung in Ägypten und Polen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2082/2005 ze dne 19. prosince 2005 , kterým
    se mění nařízení (ES) č. 1497/2001 o uložení prozatímních antidumpingových
    cel na dovoz močoviny pocházející z Běloruska, Bulharska, Chorvatska, Estonska,
    Libye, Litvy, Rumunska a Ukrajiny, o přijetí závazku nabídnutého vyvážejícím
    výrobcem v Bulharsku a o ukončení řízení, pokud jde o dovoz močoviny pocházející
    z Egypta a Polska
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2082/2005 af 19. december 2005 om ændring
    af forordning (EF) nr. 1497/2001 om indførelse af en midlertidig antidumpingtold
    på importen af urinstof med oprindelse i Belarus, Bulgarien, Kroatien, Estland,
    Libyen, Litauen, Rumænien og Ukraine, om godtagelse af tilsagn afgivet af den
    eksporterende producent i Bulgarien og om afslutning af proceduren vedrørende
    importen af urinstof med oprindelse i Egypten og Polen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2082/2005 της Επιτροπής,
    της 19ης Δεκεμβρίου 2005 , για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1497/2001 για την επιβολή
    προσωρινών δασμών αντιντάμπινγκ στις εισαγωγές
    ουρίας καταγωγής Λευκορωσίας, Βουλγαρίας,
    Κροατίας, Εσθονίας, Λιβύης, Λιθουανίας, Ρουμανίας
