title:
- language: en
  script: Latn
  content: '93/237/EEC: Commission Decision of 6 April 1993 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products'
  type: main
- language: fr
  script: Latn
  content: '93/237/CEE: Décision de la Commission du 6 avril 1993 modifiant la décision
    79/542/CEE du Conseil établissant une liste des pays tiers en provenance desquels
    les États membres autorisent l''importation d''animaux des espèces bovine et
    porcine, d''équidés, d''ovins et de caprins, de viandes fraîches et de produits
    à base de viande'
  type: main
- language: de
  script: Latn
  content: '93/237/EWG: ENTSCHEIDUNG DER KOMMISSION vom 6. April 1993 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen'
  type: main
- language: da
  script: Latn
  content: '93/237/EØF: KOMMISSIONENS BESLUTNING af 6. april 1993 om ændring af
    Rådets beslutning 79/542/EØF om opstilling af en liste over de tredjelande,
    hvorfra medlemsstaterne tillader indførsel af kvæg, svin, enhovede dyr, får
    og geder samt fersk kød eller kødprodukter'
  type: main
- language: el
  script: Grek
  content: '93/237/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 6ης Απριλίου
    1993 που τροποποιεί την απόφαση 79/542/ΕΟΚ του Συμβουλίου
    περί καταρτίσεως πίνακα τρίτων χωρών από τις
    οποίες τα κράτη μέλη επιτρέπουν τις εισαγωγές
    ζώων του βοείου και χορείου είδους, ιπποειδών,
    αιγοπροβάτων, νωπών κρεάτων και προϊόντων
    με βάση το κρέας'
  type: main
- language: it
  script: Latn
  content: '93/237/CEE: DECISIONE DELLA COMMISSIONE del 6 aprile 1993 che modifica
    la decisione 79/542/CEE del Consiglio recante l'' elenco dei paesi terzi da cui
    gli Stati membri autorizzano l'' importazione di animali delle specie bovina,
    suina, equina, ovina e caprina, di carni fresche e di prodotti a base di carne'
  type: main
- language: nl
  script: Latn
  content: '93/237/EEG: BESCHIKKING VAN DE COMMISSIE van 6 april 1993 houdende wijziging
    van Beschikking 79/542/EEG van de Raad tot vaststelling van een lijst van derde
    landen waaruit de Lid-Staten de invoer van runderen, varkens, paardachtigen, schapen
    en geiten, vers vlees en vleesprodukten toestaan'
  type: main
- language: pt
  script: Latn
