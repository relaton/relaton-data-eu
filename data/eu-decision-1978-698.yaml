id: EUDecision1978698
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 July 1978 authorizing the United Kingdom not
    to apply Community treatment to tents, falling within heading No ex 62.04 of the
    Common Customs Tariff (NIMEXE codes 62.04-23, 73), originating in South Korea
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/698/CEE: Décision de la Commission, du 19 juillet 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tentes de la position
    Ex 62.04 du Tarif douanier commun (codes Nimexe 62.04-23; 73), originaires de
    la Corée du Sud et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Juli 1978, mit der das Vereinigte Königreich
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Zelte der Tarifnummer ex 62.04 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 62.04-23; 73) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 19. juli 1978 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage telte, som henhører under
    pos. ex 62.04 (NIMEXE-kode 62.04-23, 73) i den fælles toldtarif, har oprindelse
    i Sydkorea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 19 luglio 1978, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario le tende della voce ex 62.04 (codice
    Nimexe: 62.04-23, 73) della tariffa doganale comune, originari della Corea del
    Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 juli 1978 waarbij het Verenigd Koninkrijk
    wordt gemachtigd tenten, van post ex 62.04 van het gemeenschappelijk douanetarief
    (NIMEXE-code 62.04-23, 73), van oorsprong uit Zuid-Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
