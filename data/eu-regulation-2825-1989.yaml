  content: Commission Regulation (EEC) No 2825/89 of 20 September 1989 on a decision
    to make no award in respect of the 21st partial invitation to tender for white
    sugar issued in connection with the standing invitation to tender referred to
    in Regulation (EEC) No 999/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2825/89 de la Commission, du 20 septembre 1989, portant
