    de sucre blanc effectuée dans le cadre de l'adjudication permanente visée au
    règlement (CEE) n° 999/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2825/89 der Kommission vom 20. September 1989 über
    die Entscheidung, der im Rahmen der in der Verordnung (EWG) Nr. 999/89 genannten
    Dauerausschreibung für Weißzucker durchgeführten 21. Teilausschreibung nicht
    stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2825/89 af 20. september 1989 om ikke
    at gennemføre den 21. dellicitation for hvidt sukker, der er afholdt inden for
    rammerne af den løbende licitation omhandlet i forordning (EØF) nr. 999/89
  type: main
