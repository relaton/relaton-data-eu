  content: Commission Regulation (EC) No 1340/1999 of 24 June 1999 derogating from
    Regulation (EC) No 708/98 on the taking over of paddy rice by the intervention
    agencies and fixing the corrective amounts and the price increases and reductions
    to be applied, with respect to the period for delivery to the intervention agency
    in the 1998/99 marketing year
  type: main
- language: fr
  script: Latn
