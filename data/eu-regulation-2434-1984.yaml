    Vereinnahmung der im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von bestimmten Profilen aus Stahl mit Ursprung in der Deutschen Demokratischen
    Republik als Sicherheit für den vorläufigen Antidumpingzoll hinterlegten Beträge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2434/84 af 23. august 1984 om endelig opkrævning
