  content: Council Regulation (EEC) No 2434/84 of 23 August 1984 collecting definitively
    the amounts secured by way of provisional duty in connection with the anti-dumping
    proceeding concerning imports of certain angles, shapes and sections, of iron
    or steel, originating in the German Democratic Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2434/84 du Conseil du 23 août 1984 portant perception
    définitive des montants garantis par un droit provisoire dans le cadre de la
    procédure antidumping concernant les importations de certains profilés en fer
    ou en acier originaires de la République démocratique allemande
  type: main
- language: de
  script: Latn
