  script: Latn
  content: Regolamento (CEE) n. 2434/84 del Consiglio del 23 agosto 1984 che stabilisce
    la riscossione definitiva degli importi depositati a titolo di dazio provvisorio
    nell' ambito della procedura antidumping relativa alle importazioni di alcuni
    tipi di profilati di ferro o di acciaio originari della Repubblica democratica
    tedesca
  type: main
