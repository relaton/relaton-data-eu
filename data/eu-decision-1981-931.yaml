    meaning of Article 3 (4) and (5) of Council Directive 75/268/EEC and listed in
    the Annex to Council Directive 75/270/EEC'
  type: main
- language: fr
  script: Latn
  content: '81/931/CEE: Décision de la Commission, du 9 novembre 1981, modifiant
    les limites des zones agricoles défavorisées au sens de l''article 3 paragraphes
    4 et 5 de la directive 75/268/CEE du Conseil et figurant à l''annexe de la directive
    75/270/CEE du Conseil qui se trouvent sur le territoire de la République fédérale
    d''Allemagne'
  type: main
- language: de
