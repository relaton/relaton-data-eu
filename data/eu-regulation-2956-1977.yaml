title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2956/77 of 23 December 1977 fixing, for
    the 1978 fishing year, withdrawal prices for the fishery products listed in Annex
    I (A) and (C) to Regulation (EEC) No 100/76 and for certain products landed in
    areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2956/77 de la Commission, du 23 décembre 1977, fixant
    les prix de retrait valables pour l'année 1978 pour les produits de la pêche
    énumérés à l'annexe I sous A et C du règlement (CEE) n° 100/76, ainsi que
    pour certains produits débarqués dans des zones très éloignées des principaux
    centres de consommation de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2956/77 der Kommission vom 23. Dezember 1977 zur Festsetzung
    der Rücknahmepreise für das Jahr 1978 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 100/76 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2956/77 af 23. december 1977 om fastsættelse
    af tilbagetagelsespriserne for året 1978 for de fiskerivarer, som er anført
    i afsnit A og C i bilag I til forordning (EØF) nr. 100/76, samt for visse varer
    fra landingsområder, der ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2956/77 della Commissione, del 23 dicembre 1977, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, nonché
    per taluni prodotti del regolamento (CEE) n. 100/76, sbarcati in zone molto lontane
    dai principali centri di consumo della Comunità, i prezzi di ritiro validi per
    l'anno 1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2956/77 van de Commissie van 23 december 1977 tot
    vaststelling van de in 1978 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 100/76 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
