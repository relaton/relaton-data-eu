title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 599/84 of 5 March 1984 amending Regulation
    (EEC) No 320/84 as regards provisional total allowable catches for 1984, the provisional
    share of these catches available to the Community and the allocation of that share
    between the Member States for certain stocks and groups of fish stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 599/84 du Conseil du 5 mars 1984 modifiant le règlement
    CEE) no 320/84 en ce qui concerne certains stocks ou groupes de stocks de poisson,
    les totaux provisoires admissibles des captures pour 1984, la part provisoire
    de la Communauté et la répartition de cette part entre les États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 599/84 des Rates vom 5. März 1984 zur Änderung der
    Verordnung (EWG) Nr. 320/84 hinsichtlich der vorläufig zulässigen Gesamtfangmenge,
    des vorläufigen Anteils der Gemeinschaft sowie dessen Aufteilung auf die Mitgliedstaaten
    für bestimmte Fischbestände oder Bestandsgruppen für 1984
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 599/84 af 5. marts 1984 om ændring af forordning
    (EØF) nr. 320/84 for så vidt angår fastsættelse for 1984 af de foreløbige
    samlede tilladte fangstmængder for visse fiskebestande og grupper af fiskebestande
    samt af Fællesskabets foreløbige andel og dennes fordeling blandt medlemsstaterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 599/84 του Συμβουλίου
    της 5ης Μαρτίου 1984 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 320/84 όσον αφορά ορισμένα αποθέματα
    ιχθύων ή ομάδες αποθεμάτων ιχθύων, το προσωρινό
    σύνολο επιτρεπόμενων αλιευμάτων για το 1984,
    το προσωρινό μερίδιο της Κοινότητας και την
    κατανομή του μεριδίου αυτού μεταξύ των κρατών
    μελών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 599/84 del Consiglio del 5 marzo 1984 che modifica
    il regolamento (CEE) n. 320/84 per quanto concerne alcune popolazioni o gruppi
    di popolazioni ittiche, il totale provvisorio delle catture ammesse per il 1984,
    la parte provvisoria per la Comunità e la ripartizione di detta parte tra gli
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 599/84 van de Raad van 5 maart 1984 tot wijziging
    van Verordening (EEG) nr. 320/84 voor wat betreft de voor 1984 geldende voorlopige
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden,
    het voor de Gemeenschap voorlopig beschikbare gedeelte en de verdeling van dat
    gedeelte over de Lid-Staten
