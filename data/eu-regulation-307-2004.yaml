title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 307/2004 of 20 February 2004 amending Regulation
    (EC) No 1520/2000 laying down common detailed rules for the application of the
    system of granting export refunds on certain agricultural products exported in
    the form of goods not covered by Annex I to the Treaty, and the criteria for fixing
    the amounts of such refunds, and providing special measures in respect of certain
    refund certificates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 307/2004 de la Commission du 20 février 2004 modifiant
    le règlement (CE) n° 1520/2000 établissant, pour certains produits agricoles
    exportés sous forme de marchandises ne relevant pas de l'annexe I du traité,
    les modalités communes d'application du régime d'octroi des restitutions à
    l'exportation et des critères de fixation de leurs montants, et prévoyant des
    mesures spéciales à propos pour certains certificats de restitution
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 307/2004 der Kommission vom 20. Februar 2004 zur Änderung
    der Verordnung (EG) Nr. 1520/2000 zur Festlegung der gemeinsamen Durchführungsvorschriften
    für die Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung
    des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse, die in
    Form von nicht unter Anhang I des Vertrags fallenden Waren ausgeführt werden,
    und zur Festlegung spezieller Maßnahmen für bestimmte Erstattungsbescheinigungen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 307/2004 ze dne 20. února 2004, kterým se
    mění nařízení (ES) č. 1520/2000, kterým se stanoví společná prováděcí
    pravidla k režimu poskytování vývozních náhrad pro některé zemědělské
    produkty vyvážené ve formě zboží, na něž se nevztahuje příloha I Smlouvy,
    a kritéria pro stanovení výše těchto náhrad, a kterým se stanoví zvláštní
    opatření týkající se některých osvědčení o náhradě
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 307/2004 af 20. februar 2004 om ændring
    af forordning (EF) nr. 1520/2000 om fastsættelse af fælles gennemførelsesbestemmelser
    for eksportrestitutionsordningen og af kriterier for fastsættelse af restitutionsbeløbet
    for visse landbrugsprodukter, der udføres i form af varer, som ikke er opført
    i traktatens bilag I, og om fastsættelse af særlige foranstaltninger for så
    vidt angår visse restitutionslicenser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 307/2004 της Επιτροπής,
    της 20ής Φεβρουαρίου 2004, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1520/2000 για τη θέσπιση
    κοινών λεπτομερών κανόνων εφαρμογής του συστήματος
    επιστροφών κατά την εξαγωγή και των κριτηρίων
    καθορισμού του ύψους τους, για ορισμένα γεωργικά
    προϊόντα, εξαγόμενα υπό μορφή εμπορευμάτων
    μη υπαγόμενων στο παράρτημα Ι της συνθήκης
    και την πρόβλεψη ειδικών μέτρων για ορισμένα
    πιστοποιητικά επιστροφής
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 307/2004, 20. veebruar 2004, millega muudetakse
    määrust (EÜ) nr 1520/2000, milles sätestatakse teatavate asutamislepingu I
    lisas loetlemata kaupadena eksporditavate põllumajandussaaduste ja -toodete eksporditoetuste
    andmise süsteemi ühised üksikasjalikud rakenduseeskirjad ning nende toetussummade
    kinnitamise kriteeriumid ja nähakse ette erimeetmed seoses teatavate toetussertifikaatidega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 307/2004, annettu 20 päivänä helmikuuta 2004,
    tiettyjen perustamissopimuksen liitteeseen I kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1520/2000 muuttamisesta, tällaisten tukien määrän vahvistamisperusteista
    ja tiettyjä tukitodistuksia koskevista erityistoimenpiteistä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 307/2004/EK rendelete (2004. február 20.) a Szerződés I.
    mellékletében nem szereplő áruk formájában exportált egyes mezőgazdasági
    termékekre vonatkozó export-visszatérítési rendszer alkalmazásának közös
    részletes szabályairól, valamint az e visszatérítések összegének megállapítására
    szolgáló szempontokról szóló 1520/2000/EK rendelet módosításáról és
    egyes visszatérítési igazolások tekintetében különleges intézkedések
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 307/2004 della Commissione, del 20 febbraio 2004, che
    modifica il regolamento (CE) n. 1520/2000 che stabilisce, per taluni prodotti
    agricoli esportati sotto forma di merci non comprese nell'allegato I del trattato,
    le modalità comuni di applicazione relative al versamento delle restituzioni
    all'esportazione e i criteri per stabilirne l'importo e che definisce misure speciali
    per taluni titoli di restituzione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 307/2004 (2004. gada 20. februāris), ar kuru
    groza Regulu (EK) Nr. 1520/2000, ar ko nosaka kopējus sīki izstrādātus noteikumus
    eksporta kompensāciju piešķiršanas sistēmas piemērošanai noteiktiem lauksaimniecības
    produktiem, ko eksportē tādu preču veidā, uz kurām neattiecas Līguma I pielikums,
    kā arī paredz šādu kompensāciju summu noteikšanas kritērijus un nosaka
    īpašus pasākumus attiecībā uz noteiktiem kompensācijas sertifikātiem
  type: main
- language: lt
  script: Latn
  content: 2004 m. vasario 20 d. Komisijos reglamentas (EB) Nr. 307/2004, iš dalies
    pakeičiantis Reglamentą (EB) Nr.1520/2000 nustatantį bendras išsamias eksporto
    grąžinamųjų išmokų už tam tikrus žemės ūkio produktus, eksportuojamus
    kaip į Sutarties I priedą neįtrauktos prekės, skyrimo sistemos taikymo taisykles
    ir tokių grąžinamųjų išmokų sumos nustatymo kriterijus ir numatantis specialias
    priemones dėl grąžinamosios išmokos sertifikatų
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 307/2004 ta’ l-20 ta’ Frar 2004
    li jemenda r-Regolament (KE) Nru 1520/2000 li jniżżel ir-regoli komuni dettaljati
    għall-applikazzjoni tas-sistema li tikkonċedi rifużjonijiet ta’ l-esportazzjoni
    fuq ċerti prodotti agrikoli esportati fil-forma ta’ merkanzija mhux koperti
    mill-L-Anness I tat-Trattat, u l-kriterju li jistabbilixxi l-kwantità ta’ rifużjonijiet
    ta’ din ix-xorta, u jipprovdi miżuri speċjali fir-rigward ta’ ċerti ċertifikati
    ta’ rifużjonijiet
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 307/2004 van de Commissie van 20 februari 2004 tot
    wĳziging van Verordening (EG) nr. 1520/2000 tot vaststelling van de gemeenschappelĳke
    uitvoeringsbepalingen voor de regeling aangaande de toekenning van restituties
    bĳ uitvoer en de criteria voor de vaststelling van het restitutiebedrag betreffende
    bepaalde landbouwproducten, uitgevoerd in de vorm van goederen die niet onder
    bĳlage I van het Verdrag vallen, en tot vaststelling van speciale maatregelen
    voor bepaalde restitutiecertificaten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 307/2004 z dnia 20 lutego 2004 r. zmieniające
    rozporządzenie (WE) nr 1520/2000 ustanawiające wspólne szczegółowe zasady
    stosowania systemu przyznawania refundacji wywozowych do niektórych produktów
    rolnych wywożonych jako towary nieobjęte załącznikiem I do Traktatu oraz kryteria
    dla ustalania wysokości sum takich refundacji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 307/2004 da Comissão, de 20 de Fevereiro de 2004,
    que altera o Regulamento (CE) n.° 1520/2000 que estabelece, para certos produtos
    agrícolas exportados sob a forma de mercadorias não abrangidas pelo anexo I
    do Tratado, as normas comuns de aplicação do regime de concessão de restituições
    à exportação e os critérios de fixação do seu montante, e que prevê medidas
    especiais no que respeita a determinados certificados de restituição
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 307/2004 z 20. februára 2004, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1520/2000, ktorým sa stanovujú spoločné podrobné
    pravidlá uplatňovania systému prideľovania vývozných náhrad na určité
    poľnohospodárske výrobky vyvážané vo forme tovarov, na ktoré sa nevzťahuje
    príloha I k zmluve, a kritériá na stanovenie čiastok týchto náhrad, a ktorým
    sa zabezpečujú osobitné opatrenia vo veci niektorých osvedčení o náhrade
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 307/2004 z dne 20. februarja 2004 o spremembi
    Uredbe (ES) št. 1520/2000 o določitvi skupnih podrobnih pravil za uporabo sistema
    dodeljevanja izvoznih nadomestil za nekatere kmetijske proizvode, izvožene kot
    blago, ki ni zajeto v Prilogi I k Pogodbi, in o merilih za določanje višine
    takšnih nadomestil ter o posebnih merilih glede nekaterih potrdil o nadomestilu
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 307/2004 de la Comisión, de 20 de febrero de 2004,
    que modifica el Reglamento (CE) n° 1520/2000, por el que se establecen, para
    determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el anexo I del Tratado, las disposiciones comunes de aplicación del régimen
    de concesión de restituciones a la exportación y los criterios para la fijación
    de su importe y por el que se establecen medidas especiales respecto a determinados
    certificados de restitución
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 307/2004 av den 20 februari 2004 om ändring
    av förordning (EG) nr 1520/2000 om gemensamma tillämpningsföreskrifter för
    ordningen för beviljande av exportbidrag för vissa jordbruksprodukter som exporteras
    i form av varor som inte omfattas av bilaga I till fördraget samt om kriterierna
    för fastställande av bidragsbeloppen och särskilda bestämmelser när det gäller
    vissa bidragslicenser
