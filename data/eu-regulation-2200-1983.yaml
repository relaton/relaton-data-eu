title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2200/83 of 1 August 1983 re-establishing
    the levying of customs duties on babies' knitted outer garments, products of category
    71 (code 0710) and originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2200/83 de la Commission du 1er août 1983 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus de bonneterie, pour bébés, de la catégorie de produits 71 (code 0710),
    originaires de Singapour, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2200/83 der Kommission vom 1. August 1983 über die
    Wiedereinführung des Zollsatzes für Oberkleidung für Säuglinge, gewirkt, der
    Warenkategorie Nr. 71 (Kennziffer 0710), mit Ursprung in Singapur, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2200/83 af 1. august 1983 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande af trikotage, under
    kategori nr. 71 (kode 0710), som har oprindelse i Singapore og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2200/83 της Επιτροπής
    της 1ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτοιμα
    ενδύματα εξωτερικά πλεκτά για βρέφη, προϊόντα
    της κατηγορίας 71 (κώδικας 0710), καταγωγής Σιγκαπούρης,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2200/83 della Commissione del 1o agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli indumenti esterni a maglia,
    per bambini piccoli (bébés), della categoria di prodotti n. 71 (codice 0710),
    originari di Singapore, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2200/83 van de Commissie van 1 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bovenkleding
    van brei- of haakwerk voor baby' s van de categorie van produkten nr. 71 (codenummer
    0710), van oorsprong uit Singapore, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
