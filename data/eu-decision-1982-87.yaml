  content: '82/87/EEC: Commission Decision of 23 December 1981 establishing that the
    apparatus described as ''Jeol scanning electron microscope, model JSM-35C'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/87/CEE: Décision de la Commission, du 23 décembre 1981, constatant
    que l''importation de l''appareil dénommé "Jeol scanning electron microscope,
    model JSM-35C" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
