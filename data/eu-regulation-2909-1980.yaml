id: EURegulation29091980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2909/80 of 11 November 1980 re-establishing
    the levying of customs duties on appliances, apparatus, accessories and requisites
    for gymnastics or athletics, or for sports and outdoor games, falling within subheadings
    97.06 B and C, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2909/80 de la Commission, du 11 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux articles
    et engins pour les jeux de plein air, la gymnastique, l' athlétisme et autres
    sports, de la sous-position 97.06 B et C du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2909/80 der Kommission vom 11. November 1980 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten der Tarifstellen 97.06 B und C mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2909/80 af 11. november 1980 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil
    samt til gymnastik, atletik og andre sportsgrene, under pos. 97.06 B og C, som
    har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2909/80 della Commissione, dell' 11 novembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all' aperto, da ginnastica, da atletica ed altri sport, delle sottovoci
    97.06 B e C della tariffa doganale comune, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2909/80 van de Commissie van 11 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor artikelen en toestellen
    voor openluchtspelen, voor gymnastiek, voor atletiek en voor andere sporten, van
    post 97.06 B en C, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
