title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 juillet 1963, autorisant la perception
    de taxes compensatoires à l'importation, en République italienne, de dextrines
    et d'amidons et fécules solubles ou torréfiés, ainsi que de parements et apprêts
    préparés, à base de matière amylacées, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '63/501/EWG: Entscheidung der Kommission vom 29. Juli 1963 über die Erhebung
    von Ausgleichsabgaben auf Einfuhren von Dextrin, löslicher oder gerösteter Stärke
    sowie von zubereiteten Zurichtemitteln und zubereiteten Appreturen auf der Grundlage
    von Stärke aus dem Königreich der Niederlande in die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '63/501/CEE: Decisione della Commissione del 29 luglio 1963 che autorizza
    la riscossione di tasse di compensazione all''importazione nella Repubblica italiana,
    di destrine e di amidi e fecole solubili o torrefatti e di bozzime preparate ed
    appretti preparati a base di sostanze amidacee, in provenienza dal Regno dei Paesi
    Bassi'
  type: main
- language: nl
  script: Latn
  content: '63/501/EEG: Beschikking van de Commissie van 29 juli 1963 houdende machtiging
    tot het leggen van een compenserende heffing op de invoer in de Italiaanse Republiek
    van dextrine en oplosbaar of geroost zetmeel alsmede van preparaten voor het appreteren
    op basis van zetmeel of van zetmeelderivaten uit het Koninkrijk der Nederlanden'
  type: main
