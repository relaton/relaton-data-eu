title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2166/73 of the Commission of 8 August 1973 re-establishing
    Common Customs Tariff duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper, falling within heading No 74.07 originating in Yugoslavia
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2166/73 de la Commission, du 8 août 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tubes et tuyaux (y compris leurs ébauches) et barres creuses, en cuivre,
    de la position tarifaire 74.07, originaires de Yougoslavie bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2166/73 der Kommission vom 8. August 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Rohre (einschließlich Rohlinge)
    und Hohlstangen, aus Kupfer, der Tarifnummer 74.07, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2166/73 af 8. august 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for rør, røremner og hule stænger,
    af kobber under position 74.07, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2762/72 af
    19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2166/73 della Commissione, dell' 8 agosto 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    tubi (compresi i loro sbozzi) e barre forate, di rame, della voce doganale n.
    74.07 originari della Iugoslavia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2166/73 van de Commissie van 8 augustus 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op buizen en pijpen (ook indien niet afgewerkt) en holle staven,
    van koper, van post 74.07, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
