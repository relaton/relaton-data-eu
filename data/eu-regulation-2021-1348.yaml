  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1348 of 6 May 2021 supplementing
    Regulation (EU) 2016/1011 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the criteria under which competent
    authorities may require changes to the compliance statement of non-significant
    benchmarks
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1348 de la Commission du 6 mai 2021 complétant
    le règlement (UE) 2016/1011 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les critères selon lesquels les autorités
    compétentes peuvent exiger des modifications de la déclaration de conformité
    des indices de référence d’importance non significative
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1348 der Kommission vom 6. Mai 2021 zur
    Ergänzung der Verordnung (EU) 2016/1011 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Kriterien, nach
    denen zuständige Behörden Änderungen der Konformitätserklärung für nicht
    signifikante Referenzwerte verlangen können
  type: main
- language: bg
  script: Cyrl
