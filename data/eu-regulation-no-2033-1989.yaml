title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2033/89 of 6 July 1989 re-establishing the
    levying of customs duties on woven fabrics of synthetic filament yarn, products
    of category No 33 (order No 40.0330), originating in Thailand, and binder and
    baler twine for agricultural machines, products of category No 146 A (order No
    42.1461), originating in Mexico, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2033/89 de la Commission du 6 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fils de filaments synthétiques de la catégorie 33 (numéro d'ordre 40.0330),
    originaires de Thaïlande, et ficelles lieuses et botteleuses pour machines agricoles
    de la catégorie 146 à (numéro d'ordre 42.1461), originaires du Mexique, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
