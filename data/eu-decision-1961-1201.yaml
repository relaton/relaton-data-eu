title:
- language: fr
  script: Latn
  content: Décision de la Commission prorogeant la décision prise le 18 mai 1961
    qui dispense l'Italie, au titre de l'article 226 du Traité, de l'application
    des articles 33 du Traité et 7 de la décision d'accélération en ce qui concerne
    l'importation de vin
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission zur Verlängerung der Entscheidung vom 18.
    Mai 1961, mit der Italien auf Grund von Artikel 226 des Vertrages hinsichtlich
    der Weineinfuhr von der Anwendung von Artikel 33 des Vertrages und Artikel 7 des
    Beschleunigungsbeschlusses befreit wird
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione della Comunità Economica Europea che proroga
    la decisione del 18 maggio 1961, con la quale l'Italia è esonerata, a' sensi
    dell'articolo 226 del Trattato, dell'applicazione degli articoli 33 del Trattato
    e 7 della decisione sull'acceleramento per quanto concerne l'importazione di vino
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van de Europese Economische Gemeenschap houdende
    verlenging van de beschikking van 18 mei 1961, waarbij Italië, op grond van artikel
    226 van het Verdrag, wordt vrijgesteld van de toepassing van artikel 33 van het
    Verdrag en van artikel 7 van het Versnellingsbesluit ten aanzien van de invoer
    van wijn
  type: main
