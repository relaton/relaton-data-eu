title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 866/81 of 1 April 1981 re-establishing the
    levying of customs duties on chenille yarn, tulle, fabrics and embroidery, products
    of category 62 (0620), originating in South Korea, to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 866/81 de la Commission, du 1er avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    chenille, tulles, tissus et broderies de la catégorie de produits n° 62 (code
    0620), originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 866/81 der Kommission vom 1. April 1981 über die
    Wiedereinführung des Zollsatzes für Chenillegarne, Tülle, geknüpfte Netzstoffe
    und Stickereien der Warenkategorie Nr. 62 (Kennziffer 0620), mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 866/81 af 1. april 1981 om genindførelse
    af opkrævning af toldafgifter for chenillegarn, tyl og knyttede netstoffer under
    kategori 62 (kode 0620), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 866/81 τής Επιτροπής
