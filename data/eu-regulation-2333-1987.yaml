    de sector rijst, alsmede van de coëfficiënten voor de berekening van de bedragen
    die gelden voor sommige verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2333/87 da Comissão de 29 de Julho de 1987 que
    fixa os montantes compensatórios de adesão aplicáveis no sector do arroz para
    a campanha de 1987/1988, bem como os coeficientes a utilizar para o cálculo dos
    montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2333/87 de la Comisión de 29 de julio de 1987 por
