    μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2333/87 della Commissione del 29 luglio 1987 che fissa
    gli importi compensativi adesione applicabili nel settore del riso per la campagna
    1987/1988, nonché i coefficienti da prendere in considerazione per il calcolo
    degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2333/87 van de Commissie van 29 juli 1987 tot vaststelling
