title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2333/87 of 29 July 1987 fixing, until the
    end of the 1987/88 marketing year, the accession compensatory amounts applicable
    to rice and the coefficients to be used for the calculation of the amounts applicable
    to certain processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2333/87 de la Commission du 29 juillet 1987 fixant
    les montants compensatoires "adhésion" applicables dans le secteur du riz pour
    la campagne 1987/1988 ainsi que les coefficients à retenir pour le calcul des
    montants applicables à certains produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2333/87 der Kommission vom 29. Juli 1987 zur Festsetzung
    der im Wirtschaftsjahr 1987/88 geltenden Beitrittsausgleichsbeträge für Reis
    sowie der Koeffizienten für die Berechnung der auf bestimmte Verarbeitungserzeugnisse
    anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2333/87 af 29. juli 1987 om fastsættelse
    af tiltrædelsesudligningsbeløbene for ris for høståret 1987/88 og af de koefficienter,
    der skal lægges til grund ved beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2333/87 της Επιτροπής
