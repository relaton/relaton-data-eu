    Mechanismus im Handel mit Obst und Gemüse zwischen Portugal und den anderen Mitgliedstaaten
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1437/91 af 30. maj 1991 om fastsættelse
