title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3337/75 of the Commission of 22 December 1975 amending
    for the eighth time Regulation (EEC) No 1770/72 on detailed rules of application
    relating to the additional conditions with which imported wines for direct human
    consumption have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3337/75 de la Commission, du 22 décembre 1975, modifiant
    pour la huitième fois le règlement (CEE) n° 1770/72 portant modalités d' application
    relatives aux conditions supplémentaires auxquelles doivent répondre les vins
    importés des pays tiers, destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3337/75 der Kommission vom 22. Dezember 1975 zur achten
    Änderung der Verordnung (EWG) Nr. 1770/72 über Durchführungsbestimmungen zu
    den zusätzlichen Bedingungen, denen aus Drittländern eingeführter Wein für
    den unmittelbaren menschlichen Verbrauch entsprechen muß
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3337/75 af 22. december 1975 om ottende
    ændring af forordning (EØF) nr. 1770/72 om gennemførelsesbestemmelser til de
    yderligere betingelser, som skal opfyldes for vin, der fra tredjelande er indført
    til direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3337/75 della Commissione, del 22 dicembre 1975, recante
    ottava modifica del regolamento (CEE) n. 1770/72, recante modalità d' applicazione
    relative alle condizioni supplementari cui devono rispondere i vini importati
    dai paesi terzi destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3337/75 van de Commissie van 22 december 1975 houdende
    achtste wijziging van Verordening (EEG) nr. 1770/72 betreffende de nadere voorwaarden
    waaraan uit derde landen ingevoerde wijn voor rechtstreekse menselijke consumptie
    moet voldoen
  type: main
