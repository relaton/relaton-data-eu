  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3661/86 del Consiglio del 26 novembre 1986 che istituisce
    un dazio antidumping definitivo sulle importazioni di permanganato di potassio
    originario della Repubblica popolare cinese e stabilisce la riscossione definitiva
    del dazio antidumping provvisorio istituito sulle importazioni di permanganato
    di potassio originario della Cecoslovacchia, della Repubblica democratica tedesca
    e della Repubblica popolare cinese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3661/86 van de Raad van 26 november 1986 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van kaliumpermanganaat
    van oorsprong uit de Volksrepubliek China, en definitieve inning van het op de
    invoer van kaliumpermanganaat van oorsprong uit de Duitse Democratische Republiek,
    Tsjechoslowakije en de Volksrepubliek China ingestelde voorlopige anti-dumpingrecht
  type: main
