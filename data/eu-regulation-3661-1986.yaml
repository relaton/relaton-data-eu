title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3661/86 of 26 November 1986 imposing a definitive
    anti-dumping duty on imports of potassium permanganate originating in the People'
    s Republic of China and definitively collecting the provisional anti-dumping duty
    imposed on imports of potassium permanganate originating in Czechoslovakia, the
    German Democratic Republic and the People' s Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3661/86 du Conseil du 26 novembre 1986 instituant
    un droit antidumping définitif sur les importations de permanganate de potassium
    originaire de la République populaire de Chine et portant perception définitive
    du droit antidumping provisoire institué sur les importations de permanganate
    de potassium originaire de Tchécoslovaquie, de la République démocratique allemande
    et de la République populaire de Chine
  type: main
- language: de
  script: Latn
