  script: Latn
  content: '2002/261/EC: Commission Decision of 25 March 2002 amending Decision 93/198/EEC
    laying down a model for the animal health conditions and veterinary certification
    for the import of domestic ovine and caprine animals from third countries and
    amending Annex E of Council Directive 91/68/EEC laying down the animal health
    conditions governing intra-Community trade in ovine and caprine animals (Text
    with EEA relevance) (notified under document number C(2002) 1178)'
  type: main
- language: fr
  script: Latn
