    pavyzdį iš trečiųjų šalių importuojant namines avis bei ožkas, ir Tarybos
    direktyvos 91/68/EEB dėl gyvūnų sveikatos reikalavimų, reglamentuojančių
    Bendrijos vidaus prekybą avimis ir ožkomis, E priedą (pranešta dokumentu Nr.
    C (2002) 1178)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-25 ta’ Marzu 2002 li temenda d-Deċiżjoni
