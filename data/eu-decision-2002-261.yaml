    mājas aitu un kazu ievešanai no trešām valstīm, un ar kuru groza E pielikumu
    Padomes Direktīvā 91/68/EEK, ar ko nosaka dzīvnieku veselības prasības, kas
    reglamentē Kopienas iekšējo tirdzniecību ar aitām un kazām (izziņots ar
    dokumenta numuru C(2002) 1178)
  type: main
- language: lt
