    la decisione 93/198/CEE relativa alle condizioni di polizia sanitaria e alla certificazione
    veterinaria cui è subordinata l''importazione da paesi terzi di animali domestici
    delle specie ovina e caprina e che modifica l''allegato E della direttiva 91/68/CEE
    del Consiglio relativa alle condizioni di polizia sanitaria da applicare negli
    scambi intracomunitari di ovini e caprini (Testo rilevante ai fini del SEE) [notificata
    con il numero C(2002) 1178]'
  type: main
- language: lv
  script: Latn
