  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3301/84 del Consiglio del 22 novembre 1984 che fissa,
    per la campagna di commercializzazione 1984/1985, la percentuale dell' importo
    dell' aiuto alla produzione che può essere trattenuta per le organizzazioni dei
    produttori d' olio d' oliva o le loro unioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3301/84 van de Raad van 22 november 1984 tot vaststelling
