    montante da ajuda à produção que pode ser retida pelas organizações de olivicultores
    ou suas uniões reconhecidas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3301/84 del Consejo, de 22 de noviembre de 1984, por
