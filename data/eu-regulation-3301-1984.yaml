    oder deren anerkannte Vereinigungen einbehalten werden kann, für das Wirtschaftsjahr
    1984/85
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3301/84 af 22. november 1984 om fastsættelse
    for produktionsåret 1984/1985 af den procentdel af produktionsstøtten, der kan
    tilbageholdes til de anerkendte producentorganisationer for olivenolie og foreninger
    heraf
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3301/84 του Συμβουλίου
