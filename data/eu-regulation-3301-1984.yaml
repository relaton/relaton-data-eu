    à la production pouvant être retenu pour les organisations de producteurs d'
    huile d' olive ou leurs unions reconnues
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3301/84 des Rates vom 22. November 1984 zur Festsetzung
