title:
- language: en
  script: Latn
  content: Commission Directive 2000/58/EC of 22 September 2000 amending the Annexes
    to Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC on the fixing of maximum
    levels for pesticide residues in and on cereals, foodstuffs of animal origin and
    certain products of plant origin, including fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/58/CE de la Commission du 22 septembre 2000 modifiant les
    annexes des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil concernant
    la fixation de teneurs maximales pour les résidus de pesticides respectivement
    sur et dans les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/58/EG der Kommission vom 22. September 2000 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates über
    die Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    auf und in Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/58/ЕО на Комисията от 22 септември
    2000 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определянето на максималните количества
    на остатъци от пестициди във и върху зърнените
    култури, храните от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/58/ES ze dne 22. září 2000, kterou se mění přílohy
    směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálních limitů
    reziduí pesticidů v obilovinách, v potravinách živočišného původu a v
    některých produktech rostlinného původu, včetně ovoce a zeleniny, a na jejich
    povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/58/EF af 22. september 2000 om ændring af
    bilagene til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester i og på korn, i og
    på levnedsmidler af animalsk oprindelse og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/58/ΕΚ της Επιτροπής, της 22ας Σεπτεμβρίου
    2000, για την τροποποίηση των παραρτημάτων των
    οδηγιών 86/362/ΕΟΚ, 86/363/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου
    που αφορούν αντιστοίχως τον καθορισμό των
    ανωτάτων περιεκτικοτήτων για τα υπολείμματα
    φυτοφαρμάκων πάνω και μέσα στα σιτηρά, στα
    τρόφιμα ζωικής προέλευσης και σε ορισμένα
    προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/58/EÜ, 22. september 2000, millega muudetakse
    direktiivide 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ (vastavalt teraviljas, loomses
    toidus ja teatavates taimsetes saadustes, kaasa arvatud puu- ja köögiviljas
    sisalduvate ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise
    kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/58/EY, annettu 22 päivänä syyskuuta 2000,
    viljojen torjunta-ainejäämien enimmäismääristä annetun neuvoston direktiivin
    86/362/ETY, eläinkunnasta peräisin olevissa elintarvikkeissa ja niiden pinnassa
    olevien torjunta-ainejäämien enimmäismäärien vahvistamisesta annetun neuvoston
    direktiivin 86/363/ETY sekä torjunta-ainejäämien enimmäismäärien vahvistamisesta
    tietyille kasvikunnasta peräisin oleville tuotteille, mukaan lukien hedelmät
    ja vihannekset, annetun neuvoston direktiivin 90/642/ETY liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/58/EK irányelve (2000. szeptember 22.) a gabonafélékben,
    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található peszticid-szermaradványok megengedett legmagasabb mértékének meghatározásáról
    szóló 86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/58/CE della Commissione, del 22 settembre 2000, recante
    modificazione degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio, che fissano le quantità massime di residui di antiparassitari
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/58/EK (2000. gada 22. septembris), ar kuru groza
    pielikumus Padomes Direktīvās 86/362/EEK, 86/363/EEK un 90/642/EEK par pesticīdu
    atliekvielu maksimāli pieļaujamo daudzumu noteikšanu attiecīgi labībā un
    uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem, un dažos augu izcelsmes
    produktos, tajā skaitā augļos un dārzeņos un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. rugsėjo 22 d. Komisijos direktyva 2000/58/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių pesticidų
    likučių koncentracijų atitinkamai grūduose, gyvūninės kilmės maisto produktuose
    ir tam tikruose augalinės kilmės produktuose, įskaitant vaisius ir daržoves,
    bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummisjoni 2000/58/KE tat-22 ta’ Settembru 2000 li temenda
    l-Annessi li jinsabu mad-Direttivi tal-Kunsill 86/362/KEE, 86/363/KEE u 90/642/KEE
    dwar l-iffissar tal-livelli massimi tal-residwi tal-pestiċidi fi u fuq iċ-ċereali,
    l-għalf ta’ l-oriġini mill-annimal u ċerti prodotti ta’ l-oriġini mill-pjanti,
    inklużi rispettivament il-frott u l-ħxejjexTest b'rilevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/58/EG van de Commissie van 22 september 2000 houdende wijziging
    van de bijlagen van de Richtlijnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad tot vaststelling van maximumgehalten aan residuen van bestrijdingsmiddelen
    in en op respectievelijk granen, levensmiddelen van dierlijke oorsprong en bepaalde
    producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/58/WE z dnia 22 września 2000 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG oraz 90/642/EWG w sprawie ustalania najwyższych
    dopuszczalnych poziomów pozostałości pestycydów w zbożach, środkach spożywczych
    pochodzenia zwierzęcego i niektórych produktach pochodzenia roślinnego, w tym
    odpowiednio owocach i warzywach oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/58/CE da Comissão, de 22 de Setembro de 2000, que altera
    os anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE relativas à fixação
    de teores máximos para os resíduos de pesticidas à superfície e no interior
    dos cereais, dos géneros alimentícios de origem animal e de determinados produtos
    de origem vegetal, incluindo frutas e produtos hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/58/CE a Comisiei din 22 septembrie 2000 de modificare a
    anexelor la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    de stabilire a conținuturilor maxime de reziduuri de pesticide de pe și din
    cereale, produsele alimentare de origine animală și anumite produse de origine
    vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/58/ES z 22. septembra 2000, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    úrovní rezíduí pesticídov v a na obilninách, potravinách živočíšneho
    pôvodu a určitých výrobkoch rastlinného pôvodu, vrátane ovocia respektíve
    zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2000/58/ES z dne 22. septembra 2000 o spremembi Prilog
    k Direktivam Sveta 86/362/EGS, 86/363/EGS in 90/642/EGS o določanju mejnih vrednosti
    ostankov pesticidov v in na žitih, živilih živalskega izvora in nekaterih proizvodih
    rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2000/58/CE de la Comisión, de 22 de septiembre de 2000, por
    la que se modifican los anexos de las Directivas 86/362/CEE, 86/363/CEE y 90/642/CEE
    del Consejo, relativas a la fijación de los contenidos máximos de residuos de
    plaguicidas en los cereales, en los productos alimenticios de origen animal y
    en determinados productos de origen vegetal, incluidas las frutas y hortalizas,
    respectivamente
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2000/58/EG av den 22 september 2000 om ändring
    av bilagorna till rådets direktiv 86/362/EEG, 86/363/EEG och 90/642/EEG om fastställande
    av gränsvärden för bekämpningsmedelsrester i och på spannmål, livsmedel
    av animaliskt ursprung samt vissa produkter av vegetabiliskt ursprung, inklusive
    frukt och grönsaker
