title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1558/98 of 17 July 1998 laying down to what
    extent applications for issue of export licences submitted during July 1998 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1558/98 de la Commission du 17 juillet 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 1998 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1558/98 der Kommission vom 17. Juli 1998 über das
    Ausmaß, in dem den im Juli 1998 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1558/98 af 17. juli 1998 om fastlæggelse
