    für alle Mastschweine- und Zuchtschweinearten außer Sauen, für alle Vogelarten,
    alle Fischarten und alle Krebstiere und zur Aufhebung der Verordnungen (EG) Nr.
    911/2009, (EU) Nr. 1120/2010 und (EU) Nr. 212/2011 sowie der Durchführungsverordnungen
    (EU) Nr. 95/2013, (EU) Nr. 413/2013 und (EU) 2017/2299 (Zulassungsinhaber: Danstar
    Ferment AG, in der EU vertreten durch Lallemand SAS)'
