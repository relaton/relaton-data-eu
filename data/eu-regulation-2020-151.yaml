- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/151 of 4 February 2020 concerning
    the authorisation of Pediococcus acidilactici CNCM I-4622 as a feed additive for
    all porcine species for fattening and for breeding other than sows, all avian
    species, all fish species and all crustaceans and repealing Regulations (EC) No
    911/2009, (EU) No 1120/2010 and (EU) No 212/2011 and Implementing Regulations
    (EU) No 95/2013, (EU) No 413/2013 and (EU) 2017/2299 (holder of authorisation
    Danstar Ferment AG represented in the Union by Lallemand SAS)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’Exécution (UE) 2020/151 de la Commission du 4 février
    2020 concernant l’autorisation de Pediococcus acidilactici CNCM I-4622 en tant
    qu’additif pour l’alimentation de toutes les espèces de porcs d’engraissement
    et de reproduction autres que les truies, de toutes les espèces aviaires, de
    toutes les espèces de poissons et de tous les crustacés et abrogeant les règlements
    (CE) no 911/2009, (UE) no 1120/2010 et (UE) no 212/2011 et les règlements d’exécution
    (UE) no 95/2013, (UE) no 413/2013 et (UE) 2017/2299 (titulaire de l’autorisation:
    Danstar Ferment AG, représenté dans l’Union par Lallemand SAS)'
  type: main
