title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 354/2002 of 25 February 2002 amending Regulation
    (EC) No 2228/2001 fixing, for 2002, the reduction percentages to be applied to
    applications for an allocation by non-traditional operators under the tariff quotas
    for imports of bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 354/2002 de la Commission du 25 février 2002 modifiant
    le règlement (CE) n° 2228/2001 fixant les pourcentages de réduction pour l'année
    2002 à appliquer aux demandes d'allocation des opérateurs non traditionnels
    dans le cadre des contingents tarifaires à l'importation de bananes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 354/2002 der Kommission vom 25. Februar 2002 zur Änderung
    der Verordnung (EG) Nr. 2228/2001 zur Festsetzung der Verringerungskoeffizienten,
    die für das Jahr 2002 auf die Zuteilungsanträge der nicht traditionellen Marktteilnehmer
    im Rahmen der Zollkontingente für die Einfuhr von Bananen anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 354/2002 af 25. februar 2002 om ændring
    af forordning (EF) nr. 2228/2001 om fastsættelse for 2002 af reduktionssatser
    til anvendelse på ansøgninger om tildelinger til ikke-traditionelle importører
    under importtoldkontingenterne for bananer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 354/2002 της Επιτροπής,
    της 25ης Φεβρουαρίου 2002, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2228/2001 για τον καθορισμό
    των ποσοστών μείωσης για το έτος 2002 που πρέπει
    να εφαρμοστούν στις αιτήσεις χορήγησης μεριδίου
    που υποβάλουν οι παραδοσιακοί εμπορευόμενοι
    στο πλαίσιο των δασμολογικών ποσοστώσεων κατά
    την εισαγωγή μπανάνας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 354/2002, annettu 25 päivänä helmikuuta 2002,
    ei-perinteisten toimijoiden banaanien tuontitariffikiintiöiden mukaisia määriä
    koskeviin hakemuksiin sovellettavien vähennyskertoimien vahvistamisesta vuodeksi
    2002 annetun asetuksen (EY) N:o 2228/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 354/2002 della Commissione, del 25 febbraio 2002, recante
    modificazione del regolamento (CE) n. 2228/2001 che fissa le percentuali di riduzione
    applicabili nel 2002 alle domande di assegnazione degli operatori non tradizionali
    nel quadro dei contingenti tariffari per l'importazione di banane
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 354/2002 van de Commissie van 25 februari 2002 houdende
    wĳziging van Verordening (EG) nr. 2228/2001 tot vaststelling, voor het jaar 2002,
    van de verminderingspercentages die moeten worden toegepast op de toewĳzingsverzoeken
    van niet-traditionele marktdeelnemers in het kader van de tariefcontingenten voor
    de invoer van bananen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 354/2002 da Comissão, de 25 de Fevereiro de 2002,
    que altera o Regulamento (CE) n.° 2228/2001 que fixa as percentagens de redução
    para 2002 a aplicar aos pedidos de atribuição dos operadores não tradicionais
    no âmbito dos contingentes pautais de importação de bananas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 354/2002 de la Comisión, de 25 de febrero de 2002,
    que modifica el Reglamento (CE) n° 2228/2001 por el que se fijan los porcentajes
    de reducción correspondientes al año 2002 que deberán aplicarse a las solicitudes
    de asignación de los operadores no tradicionales dentro de los contingentes arancelarios
    para la importación de plátanos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 354/2002 av den 25 februari 2002 om ändring
