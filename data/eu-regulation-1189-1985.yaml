title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1189/85 of 7 May 1985 re-establishing the
    levying of customs duties applicable to gramophone records and other sound or
    similar recordings falling within heading No 92.12, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1189/85 de la Commission du 7 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux supports de son pour les
    appareils de la position 92.11 ou pour enregistrements analogues de la position
    92.12 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1189/85 der Kommission vom 7. Mai 1985 zur Wiedereinführung
    der Erhebung der Zölle für Tonträger und andere Aufzeichnungsträger, für
    Geräte der Tarifnummer 92.11 oder für ähnliche Aufnahmeverfahren, der Tarifnummer
    92.12 mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1189/85 af 7. maj 1985 om genindførelse
    af opkrævning af told for grammofonplader og andre lydoptagelser eller lignende
    optagelser henhørende under pos. 92.12 og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1189/85 της Επιτροπής
    της 7ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των δασμών για υποθέματα εγγραφής του ήχου
    διά συσκευάς της κλάσεως 92.11 ή δι' αναλόγους
    εγγραφάς, της κλάσεως 92.12 του Κοινού Δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1189/85 della Commissione del 7 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ai supporti di suono per apparecchi
    della voce 92.11 o per registrazioni analoghe della voce 92.12 della tariffa doganale
    comune, originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1189/85 van de Commissie van 7 mei 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op grammofoonplaten,
    voor de toestellen bedoeld bij post 92.11 of voor dergelijke doeleinden, van post
    92.12, van oorsprong uit Zuid-Korea waarvoor de in Verordening (EEG) nr. 3562/84
    van de Raad vermelde tariefpreferenties zijn verleend
