title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juillet 1970, autorisant l'Italie à
    octroyer certaines aides régionales tendant à favoriser la création ou le renouvellement
    de vergers de pommiers, poiriers et pêchers
  type: main
- language: de
  script: Latn
  content: '70/397/EWG: Entscheidung der Kommission vom 30. Juli 1970, mit der Italien
    ermächtigt wird, bestimmte regionale Beihilfen zur Förderung der Anlage oder
    Erneuerung von Apfel-, Birnen- oder Pfirsichpflanzungen von Obstplantagen zu gewähren'
  type: main
- language: it
  script: Latn
  content: '70/397/CEE: Decisione della Commissione, del 30 luglio 1970, che autorizza
    l''Italia a concedere alcuni aiuti regionali volti a favorire la costituzione
    o il rinnovo di meleti, pereti o pescheti'
  type: main
- language: nl
  script: Latn
  content: '70/397/EEG: Beschikking van de Commissie van 30 juli 1970 houdende machtiging
    van de Republiek Italië regionale steun te verlenen om de aanleg van nieuwe boomgaarden
    of de vernieuwing van bestaande boomgaarden van appelbomen, perenbomen of perzikbomen
    te bevorderen'
  type: main
