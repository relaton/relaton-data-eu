    της 6ης Οκτωβρίου 1997 για επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές σάκων
    και σακιδίων από πολυαιθυλένιο ή από πολυπροπυλένιο,
    καταγωγής Ινδίας, Ινδονησίας και Ταϊλάνδης,
    και για την οριστική είσπραξη του επιβληθέντος
    προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1950/97, annettu 6 päivänä lokakuuta 1997,
