    peräisin olevien polyeteenistä tai polypropeenista valmistettujen säkkien ja
    pussien tuonnissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1950/97 del Consiglio del 6 ottobre 1997 che impone
