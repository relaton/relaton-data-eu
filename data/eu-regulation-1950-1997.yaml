    o di polipropilene originari dell'India, dell'Indonesia e della Thailandia e recante
    riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1950/97 van de Raad van 6 oktober 1997 tot instelling
    van een definitief antidumpingrecht op de invoer van zakken van polyethyleen of
    van polypropyleen, van oorsprong uit India, uit Indonesië en uit Thailand en
    tot definitieve invordering van het ingesteld voorlopig recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1950/97 do Conselho de 6 de Outubro de 1997 que institui
