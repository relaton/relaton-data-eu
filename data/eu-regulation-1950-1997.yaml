title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1950/97 of 6 October 1997 imposing a definitive
    anti-dumping duty on imports of sacks and bags made of polyethylene or polypropylene
    originating in India, Indonesia and Thailand and collecting definitively the provisional
    duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1950/97 du Conseil du 6 octobre 1997 instituant un
    droit antidumping définitif sur les importations de sacs et sachets de polyéthylène
    ou de polypropylène originaires d'Inde, d'Indonésie et de Thaïlande et portant
    perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1950/97 des Rates vom 6. Oktober 1997 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Säcken und Beuteln
    aus Polyethylen oder Polypropylen mit Ursprung in Indien, Indonesien und Thailand
    und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1950/97 af 6. oktober 1997 om indførelse af
    en endelig antidumpingtold på importen af sække og poser af polyethylen eller
    polypropylen med oprindelse i Indien, Indonesien og Thailand og endelig opkrævning
    af den indførte midlertidige told
  type: main
- language: el
  script: Grek
