title:
- language: fr
  script: Latn
  content: Décision de la Commission 64/255/CEE, du 2 avril 1964, portant modification
    de sa décision du 28 novembre 1963, autorisant la perception de taxes compensatoires
    à l'importation, dans la République française, de glucose (dextrose) en provenance
    de certains États membres
  type: main
- language: de
  script: Latn
  content: '64/255/EWG: Entscheidung der Kommission vom 2. April 1964 zur Änderung
    ihrer Entscheidung vom 28. November 1963 über die Erhebung einer Ausgleichsabgabe
    bei der Einfuhr von Glukose (Dextrose) aus verschiedenen Mitgliedstaaten in die
    Französische Republik'
  type: main
- language: it
  script: Latn
  content: '64/255/CEE: Decisione della Commissione, del 2 aprile 1964, che modifica
    la decisione della Commissione del 28 novembre 1963, con cui si autorizza la riscossione
    di tasse di compensazione all''importazione nella Repubblica francese di glucosio
    (destrosio) in provenienza da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/255/EEG: Beschikking van de Commissie van 2 april 1964 tot wijziging
    van haar beschikking van 28 november 1963 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van glucose (dextrose)
    uit bepaalde Lid-Staten'
  type: main
