title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2425/2001 of 3 December 2001 amending Regulation
    (EC) No 2848/2000 fixing for 2001 the fishing opportunities and associated conditions
    for certain fish stocks and groups of fish stocks, applicable in Community waters
    and, for Community vessels, in waters where limitations in catch are required
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2425/2001 du Conseil du 3 décembre 2001 modifiant
    le règlement (CE) n° 2848/2000 établissant, pour 2001, les possibilités de
    pêche et les conditions associées pour certains stocks halieutiques et groupes
    de stocks halieutiques, applicables dans les eaux communautaires et, pour les
    navires communautaires, dans des eaux soumises à des limitations de capture
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2425/2001 des Rates vom 3. Dezember 2001 zur Änderung
    der Verordnung (EG) Nr. 2848/2000 zur Festsetzung der Fangmöglichkeiten und Fangbedingungen
    für bestimmte Fischbestände und Bestandsgruppen in den Gemeinschaftsgewässern
    sowie für Gemeinschaftsschiffe in Gewässern mit Fangbeschränkungen (2001)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2425/2001 af 3. december 2001 om ændring af
    forordning (EF) nr. 2848/2000 om fastsættelse for år 2001 af fiskerimuligheder
    og dertil knyttede betingelser for visse fiskebestande og grupper af fiskebestande
    gældende for EF-farvande og for EF-fartøjer i andre farvande, som er omfattet
    af fangstbegrænsninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2425/2001 του Συμβουλίου,
    της 3ης Δεκεμβρίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2848/2000 περί καθορισμού,
    για το 2001, για ορισμένα αποθέματα ιχθύων και
    ομάδες αποθεμάτων ιχθύων, των αλιευτικών δυνατοτήτων
    και συναφών όρων στα κοινοτικά ύδατα και, για
    τα κοινοτικά σκάφη, σε άλλα ύδατα όπου απαιτούνται
    περιορισμοί αλιευμάτων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2425/2001, annettu 3 päivänä joulukuuta 2001,
    yhteisön vesialueilla ja yhteisön aluksiin sellaisilla muilla vesialueilla,
    joilla sovelletaan saalisrajoituksia, sovellettavien eräiden kalakantojen ja
    kalakantaryhmien kalastusmahdollisuuksien ja niihin liittyvien edellytysten vahvistamisesta
    vuodeksi 2001 annetun neuvoston asetuksen (EY) N:o 2848/2000 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2425/2001 del Consiglio, del 3 dicembre 2001, recante
    modifica del regolamento (CE) n. 2848/2000 che stabilisce, per il 2001, le possibilità
    di pesca e le condizioni ad esse associate per alcuni stock o gruppi di stock
    ittici, applicabili nelle acque comunitarie e, per le navi comunitarie, in altre
    acque dove sono imposti limiti di cattura
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2425/2001 van de Raad van 3 december 2001 houdende
    wĳziging van Verordening (EG) nr. 2848/2000 tot vaststelling, voor het jaar 2001,
    van de vangstmogelĳkheden die gelden voor bepaalde visbestanden en groepen visbestanden
    in de wateren van de Gemeenschap en, wat vaartuigen van de Gemeenschap betreft,
    in andere wateren met vangstbeperkingen, en tot vaststelling voorts van de bĳ
    de visserĳ in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2425/2001 do Conselho, de 3 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 2848/2000 que fixa, para 2001, em relação
    a determinadas unidades populacionais de peixes ou grupos de unidades populacionais
    de peixes, as possibilidades de pesca e as respectivas condições aplicáveis
    nas águas comunitárias e, para os navios de pesca comunitários, nas águas
    em que são necessárias limitações das capturas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2425/2001 del Consejo, de 3 de diciembre de 2001, que
    modifica el Reglamento (CE) n° 2848/2000, que establece, para el año 2001, las
    posibilidades de pesca y las condiciones correspondientes para determinadas poblaciones
    y grupos de poblaciones de peces, aplicables en aguas comunitarias y, en el caso
    de los buques comunitarios, en las demás aguas donde sean necesarias limitaciones
    de capturas
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2425/2001 av den 3 december 2001 om ändring
    av rådets förordning (EG) nr 2848/2000 om fastställande för 2001 av fiskemöjligheter
    och därmed förbundna villkor för vissa fiskbestånd och grupper av fiskbestånd
    i gemenskapens vatten och, för gemenskapens fartyg, i andra vatten där fångstbegränsningar
    krävs
