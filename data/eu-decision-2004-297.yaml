  script: Latn
  content: '2004/297/EC: Commission Decision of 29 March 2004 authorising the Czech
    Republic, Estonia, Lithuania, Hungary, Poland and Slovakia to postpone the application
    of certain provisions of Council Directives 2002/53/EC and 2002/55/EC with regard
    to the marketing of seeds of certain varieties (Text with EEA relevance) (notified
    under document number C(2004) 962)'
  type: main
- language: fr
  script: Latn
