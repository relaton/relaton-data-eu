type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1386 of 9 August 2022 extending
    a derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from coast and the minimum sea depth for boat seines fishing for transparent
    goby (Aphia minuta) in certain territorial waters of Italy (Tuscany and Liguria)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1386 de la Commission du 9 août 2022
    portant prolongation de la dérogation au règlement (CE) no 1967/2006 du Conseil
    en ce qui concerne la distance de la côte et la profondeur minimales pour les
    sennes de bateau pêchant le gobie transparent (Aphia minuta) dans certaines eaux
    territoriales d’Italie (Toscane et Ligurie)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1386 der Kommission vom 9. August 2022
    zur Verlängerung einer Ausnahmegenehmigung von der Verordnung (EG) Nr. 1967/2006
    des Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Bootswaden für den Fang von Glasgrundeln (Aphia minuta) in bestimmten Hoheitsgewässern
    Italiens (Toskana und Ligurien)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1386 на Комисията
    от 9 август 2022 година за удължаване на срока
    на действие на дерогация от Регламент (ЕО) №
    1967/2006 на Съвета по отношение на минималното
    разстояние от брега и минималната дълбочина
    за улов на стъкленка (Аphia minuta) с корабни грибове
    в част от териториалните води на Италия (Тоскана
    и Лигурия)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1386 ze dne 9. srpna 2022 kterým
    se prodlouží odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde o minimální
    vzdálenost od pobřeží a minimální hloubku moře pro lov hlaváče průsvitného
    (Aphia minuta) lodními nevody v některých teritoriálních vodách Itálie
    (Toskánska a Ligurie)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1386 af 9. august 2022
    om forlængelse af en fravigelse af Rådets forordning (EF) nr. 1967/2006 for
    så vidt angår mindsteafstanden fra kysten og mindstedybden for anvendelsen af
    vod brugt fra fartøjer, der fisker efter glaskutling (Aphia minuta) i visse italienske
    territorialfarvande (Toscana og Ligurien)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1386 της Επιτροπής
    της 9ης Αυγούστου 2022 για την παράταση παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την ελάχιστη απόσταση από την ακτή
    και το ελάχιστο βάθος θάλασσας που οφείλουν
    να τηρούν οι συρόμενοι από σκάφος γρίποι που
    αλιεύουν το είδος γωβιουδάκι άφια (Aphia minuta)
    σε ορισμένα χωρικά ύδατα της Ιταλίας (Τοσκάνη
    και Λιγουρία)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1386, 9. august 2022, millega pikendatakse
    erandit, mis on tehtud nõukogu määrusest (EÜ) nr 1967/2006 seoses teatavates
    Itaalia (Toskaana ja Liguuria) territoriaalvetes väikese plankmudila (Aphia minuta)
    püüdmiseks kasutatavate paadinootade miinimumkaugusega rannikust ja vee miinimumsügavusega
    nende kasutamisel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1386, annettu 9 päivänä
    elokuuta 2022, sovellettavaa vähimmäisetäisyyttä rannikolta ja veden vähimmäissyvyyttä
    koskevan, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn poikkeuksen jatkamisesta
    kalastettaessa kuultotokkoa (Aphia minuta) alukselta vedettävillä nuotilla tietyillä
    Italian aluevesillä (Toscana ja Liguria)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1386 ón gCoimisiún an 9 Lúnasa
    2022 lena gcuirtear síneadh leis an maolú ar Rialachán (CE) Uimh. 1967/2006
    ón gComhairle a mhéid a bhaineann leis an bhfad íosta ón gcósta agus doimhneacht
    íosta na mara le haghaidh saighní báid a dhéanann iascaireacht ar an mac siobháin
    trédhearcach (Aphia minuta) in uiscí teorann áirithe de chuid na hIodáile
    (an Tuscáin agus Liguria)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1386 оd 9. kolovoza 2022. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu minimalne udaljenosti
    od obale i minimalne dubine mora za potegače otvorenog mora koje love mliječa
    ružičnog (Aphia minuta) u određenim teritorijalnim vodama Italije (Toskana
    i Ligurija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1386 végrehajtási rendelete (2022. augusztus 9.)
    az 1967/2006/EK tanácsi rendelettől az üveggéb (Aphia minuta) Olaszország
    egyes felségvizein (Toszkána és Liguria) folytatott halászatában alkalmazott,
    hajóról működtetett kerítőhálók telepítésének parttól számított
    minimális távolsága és minimális mélysége tekintetében biztosított eltérés
    meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1386 della Commissione del 9 agosto
    2022 che proroga una deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima per le
    sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta) in talune
    acque territoriali dell'Italia (Toscana e Liguria)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1386 (2022. gada 9. augusts),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo jūras dziļumu,
    kas jāievēro, noteiktos Itālijas (Toskānas un Ligūrijas) teritoriālo ūdeņu
    apgabalos ar laivas velkamajiem vadiem zvejojot stikla jūrasgrunduli (Aphia minuta),
    pagarina atkāpi no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1386 2022 m. rugpjūčio
    9 d. kuriuo pratęsiamas nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl
    minimalaus atstumo nuo kranto ir minimalaus jūros gylio reikalavimų nukrypti
    leidžiančios nuostatos, taikomos afijų (Aphia minuta) žvejybai laivų traukiamaisiais
    tinklais tam tikruose Italijos (Toskanos ir Ligūrijos) teritoriniuose vandenyse,
    galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1386 tad-9
    ta’ Awwissu 2022 li jestendi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta u l-fond minimu tal-baħar għas-sajd
    bit-tartaruni għall-makku ( Aphia minuta) f’ċerti ilmijiet territorjali tal-Italja
    (it-Toskana u l-Ligurja)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1386 van de Commissie van 9 augustus 2022
    tot verlenging van een afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte voor bootzegens
    voor de visserij op glasgrondel (Aphia minuta) in bepaalde territoriale wateren
    van Italië (Toscane en Ligurië)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1386 z dnia 9 sierpnia 2022
    r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza przy połowach
    niewodami pełnomorskimi babki przezroczystej (Aphia minuta) na niektórych wodach
    terytorialnych Włoch (Toskania i Liguria)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1386 da Comissão de 9 de agosto de
    2022 que prorroga a derrogação do Regulamento (CE) n.o 1967/2006 do Conselho
    no que respeita à distância mínima da costa e à profundidade mínima para
    as redes envolventes-arrastantes de alar para bordo utilizadas na pesca do caboz-transparente
    (Aphia minuta) em determinadas águas territoriais da Itália (Toscânia e Ligúria)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1386 al Comisiei din 9 august
    2022 de prelungire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea minimă
    pentru năvoadele de navă utilizate pentru pescuitul guvidului alb (Aphia minuta)
    în anumite ape teritoriale ale Italiei (Toscana și Liguria)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1386 z 9. augusta 2022, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora pri love afie
    priesvitnej (Aphia minuta) záťahovými sieťami ovládanými z lode v určitých
    pobrežných vodách Talianska (Toskánsko a Ligúria)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1386 z dne 9. avgusta 2022 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja za ribolov belega
    glavača (Aphia minuta) v nekaterih teritorialnih vodah Italije (Toskana in Ligurija)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1386 de la Comisión de 9 de agosto
    de 2022 por el que se prorroga la excepción a lo dispuesto en el Reglamento (CE)
    n.o 1967/2006 del Consejo en lo concerniente a la distancia mínima de la costa
    y la profundidad marina mínima en el caso de las redes de tiro desde embarcación
    para la pesca de chanquete (Aphia minuta) en determinadas aguas territoriales
    de Italia
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1386 av den 9 augusti
    2022 om förlängning av ett undantag från rådets förordning (EG) nr 1967/2006
    vad gäller minsta avstånd från kusten och minsta djup för fartygsvad/not vid
    fiske efter klarbult (Aphia minuta) i vissa av Italiens territorialvatten (Toscana
    och Ligurien)
