    ja Europoli juurdepääsu viisainfosüsteemile (VIS) terroriaktide ja muude raskete
    kuritegude vältimise, avastamise ja uurimise eesmärkidel) kohaldamise kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2015/1956, annettu 26 päivänä
    lokakuuta 2015, jäsenvaltioiden nimeämien viranomaisten ja Europolin pääsystä
    tekemään hakuja viisumitietojärjestelmästä (VIS) terrorismirikosten ja muiden
    vakavien rikosten torjumiseksi, havaitsemiseksi ja tutkimiseksi tehdyn päätöksen
    2008/633/YOS soveltamispäivän vahvistamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2015/1956 od 26. listopada 2015. o utvrđivanju
    datuma od kojeg Odluka 2008/633/PUP o pristupu određenih tijela država članica
    i Europola viznom informacijskom sustavu (VIS) za traženje podataka u svrhu sprečavanja,
    otkrivanja i istraga terorističkih kaznenih djela i ostalih teških kaznenih
    djela proizvodi učinke
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2015/1956 végrehajtási határozata (2015. október 26.)
    a vízuminformációs rendszerhez (VIS) a tagállamok kijelölt hatóságai, valamint
    az Europol számára a terrorcselekmények és egyéb súlyos bűncselekmények
    megelőzése, felderítése és kivizsgálása érdekében, betekintés céljából
    történő hozzáférésről szóló 2008/633/IB határozat alkalmazása időpontjának
    meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/1956 del Consiglio, del 26 ottobre 2015,
    che fissa la data di decorrenza degli effetti della decisione 2008/633/GAI relativa
    all'accesso per la consultazione al sistema di informazione visti (VIS) da parte
    delle autorità designate degli Stati membri e di Europol ai fini della prevenzione,
    dell'individuazione e dell'investigazione di reati di terrorismo e altri reati
    gravi
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2015/1956 (2015. gada 26. oktobris),
    ar ko nosaka dienu, kad stājas spēkā Lēmums 2008/633/TI par izraudzīto dalībvalstu
    iestāžu un Eiropola piekļuvi Vīzu informācijas sistēmai (VIS) konsultāciju
    nolūkos, lai novērstu, atklātu un izmeklētu teroristu nodarījumus un citus
    smagus noziedzīgus nodarījumus
  type: main
- language: lt
  script: Latn
  content: 2015 m. spalio 26 d. Tarybos įgyvendinimo sprendimas (ES) 2015/1956, kuriuo
    nustatoma Sprendimo 2008/633/TVR dėl valstybių narių paskirtų institucijų
    ir Europolo prieigos prie Vizų informacinės sistemos (VIS) teroristinių ir
    kitų sunkių nusikaltimų prevencijos, atskleidimo ir tyrimo tikslais taikymo
    pradžios data
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kunsill (UE) 2015/1956 tas-26 ta'
    Ottubru 2015 li tistabbilixxi d-data tal-effettività tad-Deċiżjoni 2008/633/ĠAI
    li tikkonċerna aċċess għall-konsultazzjoni tas-Sistema ta' Informazzjoni dwar
    il-Viża (VIS) minn awtoritajiet maħtura ta' Stati Membri u mill-Europol għall-finijiet
    tal-prevenzjoni, tal-kxif u tal-investigazzjoni ta' reati terroristiċi u ta'
    reati kriminali serji oħra
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/1956 van de Raad van 26 oktober 2015 houdende
    vaststelling van de datum van inwerkingtreding van Besluit 2008/633/JBZ over de
    toegang tot het Visuminformatiesysteem (VIS) voor raadpleging door aangewezen
    autoriteiten van de lidstaten en door Europol, met het oog op het voorkomen, opsporen
    en onderzoeken van terroristische misdrijven en andere ernstige strafbare feiten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2015/1956 z dnia 26 października 2015 r.
    dotycząca wyznaczenia daty, od której staje się skuteczna decyzja 2008/633/WSiSW
    w sprawie dostępu wyznaczonych organów państw członkowskich i Europolu do
    wizowego systemu informacyjnego (VIS) do celów jego przeglądania, w celu zapobiegania
    przestępstwom terrorystycznym i innym poważnym przestępstwom, ich wykrywania
    i ścigania
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/1956 do Conselho, de 26 de outubro de
    2015, que fixa a data a partir da qual produz efeitos a Decisão 2008/633/JAI,
    relativa ao acesso para consulta ao Sistema de Informação sobre Vistos (VIS)
    por parte das autoridades designadas dos Estados-Membros e por parte da Europol
    para efeitos de prevenção, deteção e investigação de infrações terroristas
    e outras infrações penais graves
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/1956 a Consiliului din 26 octombrie
    2015 de stabilire a datei de la care produce efecte Decizia 2008/633/JAI privind
    accesul la Sistemul de informații privind vizele (VIS) în vederea consultării
    de către autoritățile desemnate ale statelor membre și de către Europol în
    scopul prevenirii, depistării și cercetării infracțiunilor de terorism și
    a altor infracțiuni grave
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2015/1956 z 26. októbra 2015, ktorým
    sa stanovuje dátum nadobudnutia účinnosti rozhodnutia 2008/633/SVV o sprístupnení
    vízového informačného systému (VIS) na nahliadnutie určeným orgánom členských
    štátov a Europolu na účely predchádzania teroristickým trestným činom
    a iným závažným trestným činom, ich odhaľovania a vyšetrovania
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2015/1956 z dne 26. oktobra 2015 o določitvi
    datuma začetka učinkovanja Sklepa 2008/633/PNZ o dostopu imenovanih organov
    držav članic in Europola do vizumskega informacijskega sistema (VIS) za iskanje
    podatkov za namene preprečevanja, odkrivanja in preiskovanja terorističnih dejanj
    in drugih hudih kaznivih dejanj
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/1956 del Consejo, de 26 de octubre de
    2015, por la que se establece la fecha a partir de la cual surtirá efecto la
    Decisión 2008/633/JAI sobre el acceso para consultar el Sistema de Información
    de Visados (VIS) por las autoridades designadas de los Estados miembros y por
    Europol, con fines de prevención, detección e investigación de delitos de terrorismo
    y otros delitos graves
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2015/1956 av den 26 oktober 2015 om fastställande
    av det datum då beslut 2008/633/RIF om åtkomst till informationssystemet för
    viseringar (VIS) för sökningar för medlemsstaternas utsedda myndigheter och
    för Europol i syfte att förhindra, upptäcka och utreda terroristbrott och andra
    grova brott får verkan
