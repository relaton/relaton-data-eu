title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2015/1956 of 26 October 2015 fixing
    the date of effect of Decision 2008/633/JHA concerning access for consultation
    of the Visa Information System (VIS) by designated authorities of Member States
    and by Europol for the purposes of the prevention, detection and investigation
    of terrorist offences and of other serious criminal offences
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/1956 du Conseil du 26 octobre 2015 fixant
    la date de prise d'effet de la décision 2008/633/JAI concernant l'accès en consultation
    au système d'information sur les visas (VIS) par les autorités désignées des
    États membres et par l'Office européen de police (Europol) aux fins de la prévention
    et de la détection des infractions terroristes et des autres infractions pénales
    graves, ainsi qu'aux fins des enquêtes en la matière
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/1956 des Rates vom 26. Oktober 2015 zur
    Festlegung des Zeitpunkts, ab dem der Beschluss 2008/633/JI über den Zugang der
    benannten Behörden der Mitgliedstaaten und von Europol zum Visa-Informationssystem
    (VIS) für Datenabfragen zum Zwecke der Verhütung, Aufdeckung und Ermittlung
    terroristischer und sonstiger schwerwiegender Straftaten gilt
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/1956 на Съвета
    от 26 октомври 2015 година за определяне на датата
    на пораждане на действие на Решение 2008/633/ПВР
    относно достъпа до Визовата информационна
    система (ВИС) за справки от оправомощени органи
    на държавите членки и от Европол с цел предотвратяване,
    разкриване и разследване на терористични действия
    и други тежки престъпления
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2015/1956 ze dne 26. října 2015, kterým
    se stanoví datum použitelnosti rozhodnutí 2008/633/SVV o konzultačním přístupu
    určených orgánů členských států a Europolu do Vízového informačního
    systému (VIS) pro účely prevence, odhalování a vyšetřování teroristických
    trestných činů a jiných závažných trestných činů
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2015/1956 af 26. oktober 2015 om
    fastsættelse af den dato, fra hvilken afgørelse 2008/633/RIA om adgang til søgning
    i visuminformationssystemet (VIS) for de udpegede myndigheder i medlemsstaterne
    og for Europol med henblik på forebyggelse, afsløring og efterforskning af terrorhandlinger
    og andre alvorlige strafbare handlinger har virkning
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/1956 του Συμβουλίου,
    της 26ης Οκτωβρίου 2015, για τον καθορισμό της
    ημερομηνίας έναρξης παραγωγής αποτελεσμάτων
    της απόφασης 2008/633/ΔΕΥ σχετικά με την πρόσβαση
    στο Σύστημα Πληροφοριών για τις Θεωρήσεις
    (VIS) των εντεταλμένων αρχών των κρατών μελών
