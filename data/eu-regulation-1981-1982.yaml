title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1981/82 of 19 July 1982 drawing up the list
    of Community regions, in which production aid for hops is granted only to recognized
    producer groups
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1981/82 du Conseil, du 19 juillet 1982, arrêtant
    la liste des régions de la Communauté dans lesquelles seuls les groupements
    reconnus de producteurs de houblon bénéficient de l'aide à la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1981/82 des Rates vom 19. Juli 1982 zur Festlegung
