---
id: EUDecision20191861
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1861 of 31 October 2019 amending
    Implementing Decision (EU) 2016/587 in order to clarify whether the scope of that
    Implementing Decision includes exterior LED lighting fitted to certain not off-vehicle
    charging hybrid electric M1 vehicles (NOVC-HEV)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/1861 de la Commission du 31 octobre
    2019 modifiant la décision d’exécution (UE) 2016/587 afin de préciser si
    le champ d’application de ladite décision d’exécution inclut l’éclairage
    extérieur à DEL équipant certains véhicules électriques hybrides non rechargeables
    de l’extérieur (VEH-NRE) de la catégorie M1
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1861 der Kommission vom 31. Oktober 2019
    zur Änderung des Durchführungsbeschlusses (EU) 2016/587 zur Klärung der Frage,
    ob der Geltungsbereich des genannten Durchführungsbeschlusses die LED-Außenleuchten
    umfasst, mit denen bestimmte nicht extern aufladbare Hybridelektrofahrzeuge (NOVC-HEV)
    der Klasse M1 ausgestattet sind
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2019/1861 на Комисията
    от 31 октомври 2019 година за изменение на Решение
    за изпълнение (ЕС) 2016/587, за да се внесе яснота
    дали в обхвата на това решение за изпълнение
    се включват външните светлини със светодиоди,
    които са монтирани на определени хибридни
    електрически превозни средства без външно
    зареждане от категория М1 (NOVC-HEV)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1861 ze dne 31. října 2019,
    kterým se mění (EU) 2016/587 s cílem objasnit, zda působnost uvedeného prováděcího
    rozhodnutí zahrnuje vnější osvětlení LED, kterým jsou vybavena určitá
    hybridní elektrická vozidla kategorie M1 s jiným než externím nabíjením
    (NOVC-HEV)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/1861 af 31. oktober 2019
    om ændring af gennemførelsesafgørelse (EU) 2016/587 med henblik på præcisering
    af, om anvendelsesområdet for nævnte gennemførelsesafgørelse omfatter udvendige
    LED-lysfunktioner monteret på visse hybride elkøretøjer i klasse M1 med ikke-ekstern
    opladning (NOVC-HEV)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/1861 της Επιτροπής
    της 31ης Οκτωβρίου 2019 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2016/587, ώστε να διευκρινιστεί
    αν το πεδίο εφαρμογής της εν λόγω εκτελεστικής
    απόφασης περιλαμβάνει τον εξωτερικό φωτισμό
    LED που είναι τοποθετημένος σε ορισμένα μη εξωτερικά
    φορτιζόμενα υβριδικά ηλεκτρικά οχήματα κατηγορίας
    M1 (NOVC-HEV)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/1861, 31. oktoober 2019, millega muudetakse
    rakendusotsust (EL) 2016/587, et täpsustada, kas kõnealuse rakendusotsuse kohaldamisala
    hõlmab teatavatesse sõidukivälise laadimiseta M1-kategooria hübriidelektrisõidukitele
    paigaldatud valgusdiood-välisvalgusteid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/1861, annettu 31 päivänä
    lokakuuta 2019, täytäntöönpanopäätöksen (EU) 2016/587 muuttamisesta sen
    selventämiseksi, kuuluvatko tiettyihin vain sisäisesti ladattaviin luokan M
    1 hybridisähköajoneuvoihin (NOVC-HEV) asennetut ajoneuvon ulkopuoliset LED-valaisimet
    kyseisen täytäntöönpanopäätöksen soveltamisalaan
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1861 оd 31. listopada 2019. o izmjeni
    Provedbene odluke (EU) 2016/587 kako bi se pojasnilo obuhvaća li područje primjene
    te provedbene odluke vanjska svjetla sa svjetlosnim diodama ugrađena na određena
    hibridna električna vozila bez punjenja iz vanjskog izvora kategorije M1 (NOVC-HEV)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1861 végrehajtási határozata (2019. október
    31.) az (EU) 2016/587 végrehajtási határozatnak a bizonyos M1 kategóriájú,
    nem külső feltöltésű hibrid hajtású elektromos járművekre (NOVC-HEV)
    felszerelt külső LED-világításra való alkalmazhatósága egyértelművé
    tétele érdekében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/1861 della Commissione del 31 ottobre
    2019 che modifica la decisione di esecuzione (UE) 2016/587 al fine di chiarire
    se l'ambito di applicazione di tale decisione di esecuzione comprende i sistemi
    di illuminazione esterna a LED installati su determinati veicoli elettrici ibridi
    non a ricarica esterna di categoria M1 (NOVC-HEV)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1861 (2019. gada 31. oktobris),
    ar ko groza Īstenošanas lēmumu (ES) 2016/587, lai precizētu, vai minētā
    īstenošanas lēmuma darbības jomā ir LED ārējais apgaismojums, kas uzstādīts
    dažiem M1 kategorijas hibrīdelektriskiem transportlīdzekļiem bez ārējas
    uzlādes (NOVC-HEV)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2019/1861 2019 m. spalio 31 d.
    kuriuo dėl patikslinimo, ar įgyvendinimo sprendimo taikymo sritis apima tam
    tikrose M1 klasės iš vidaus įkraunamose hibridinėse elektra varomose transporto
    priemonėse (NOVC-HEV) įrengtą LED išorės apšvietimą, iš dalies keičiamas
    Įgyvendinimo sprendimas (ES) 2016/587
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2019/1861 tal-31
    ta’ Ottubru 2019 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2016/587
    sabiex tiċċara jekk il-kamp ta’ applikazzjoni ta’ dik id-Deċiżjoni ta’
    Implimentazzjoni jinkludix illuminazzjoni LED esterna armata fuq ċerti vetturi
    elettriċi ibridi M1 bl-iċċarġjar fuq il-vettura (NOVC-HEV)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/1861 van de Commissie van 31 oktober 2019
    tot wijziging van Uitvoeringsbesluit (EU) 2016/587 teneinde te preciseren of het
    toepassingsgebied ervan ook betrekking heeft op buitenverlichting met leds die
    op bepaalde niet-extern oplaadbaar hybride elektrische voertuigen (NOVC-HEV’s)
    van categorie M1 zijn gemonteerd
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/1861 z dnia 31 października 2019
    r. zmieniająca decyzję wykonawczą (UE) 2016/587 w celu wyjaśnienia, czy zakres
    tej decyzji wykonawczej obejmuje oświetlenie zewnętrzne LED montowane w niektórych
    hybrydowych pojazdach elektrycznych niedoładowywanych zewnętrznie typu M1 (NOVC-HEV)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1861 da Comissão de 31 de outubro de
    2019 que altera a Decisão de Execução (UE) 2016/587 a fim de esclarecer se
    esta abrange os sistemas de iluminação exterior LED instalados em determinados
    veículos elétricos híbridos não recarregáveis do exterior da categoria M1
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1861 a Comisiei din 31 octombrie
    2019 de modificare a Deciziei de punere în aplicare (UE) 2016/587 pentru a clarifica
    dacă domeniul de aplicare al acestei decizii de punere în aplicare include sistemele
    de iluminat exterior cu LED-uri montate pe anumite vehicule electrice hibride
    fără încărcare externă (NOVC-HEV) din categoria M1
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1861 z 31. októbra 2019, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2016/587 s cieľom objasniť, či rozsah
    pôsobnosti uvedeného vykonávacieho rozhodnutia zahŕňa vonkajšie osvetlenie
    LED namontované na určitých hybridných elektrických vozidlách kategórie
    M1 bez externého nabíjania (NOVC-HEV)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/1861 z dne 31. oktobra 2019 o spremembi
    Izvedbenega sklepa (EU) 2016/587 za pojasnitev, ali področje uporabe navedenega
    izvedbenega sklepa vključuje sistem zunanje osvetlitve z LED, nameščen v nekatera
    hibridna električna vozila kategorije M1 brez zunanjega polnjenja (NOVC-HEV)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/1861 de la Comisión de 31 de octubre
    de 2019 por la que se modifica la Decisión de Ejecución (UE) 2016/587 para aclarar
    si el ámbito de aplicación de dicha Decisión de Ejecución engloba la iluminación
    exterior LED apta para determinados vehículos eléctricos híbridos sin carga
    exterior de categoría M1
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/1861 av den 31 oktober 2019
    om ändring av genomförandebeslut (EU) 2016/587 i syfte att klargöra huruvida
    tillämpningsområdet för det genomförandebeslutet omfattar yttre LED-belysning
    monterad på vissa ej externt laddbara hybridelfordon i kategori M1 (NOVC-HEV)
  type: main
