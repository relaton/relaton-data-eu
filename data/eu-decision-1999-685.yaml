  script: Latn
  content: '1999/685/EC: Commission Decision of 7 October 1999 amending Decision 92/452/EEC
    establishing lists of embryo collection teams and embryo production teams approved
    in third countries for export of bovine embryos to the Community (notified under
    document number C(1999) 3108)'
  type: main
- language: fr
  script: Latn
