title:
- language: en
  script: Latn
  content: '2011/377/EU: Commission Implementing Decision of 27 June 2011 amending
    Decisions 2008/603/EC, 2008/691/EC and 2008/751/EC as regards extension of the
    temporary derogations from the rules of origin laid down in Annex II to Council
    Regulation (EC) No 1528/2007 to take account of the special situation of Mauritius,
    Seychelles and Madagascar with regard to tuna and tuna loins (notified under document
    C(2011) 4322)'
  type: main
- language: fr
  script: Latn
  content: '2011/377/UE: Décision d’exécution de la Commission du 27 juin 2011
    modifiant les décisions 2008/603/CE, 2008/691/CE et 2008/751/CE en ce qui concerne
    la prolongation des dérogations temporaires aux règles d’origine prévues
    à l’annexe II du règlement (CE) n ° 1528/2007 du Conseil afin de tenir compte
    de la situation particulière de la République de Maurice, de la République
    des Seychelles et de la République de Madagascar pour ce qui est du thon et des
    longes de thon [notifiée sous le numéro C(2011) 4322]'
  type: main
