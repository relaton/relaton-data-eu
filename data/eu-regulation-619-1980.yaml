title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 619/80 of 13 March 1980 re-establishing
    the levying of customs duties on inner tubes and tyre cases, etc., falling within
    heading No ex 40.11 and originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 619/80 de la Commission, du 13 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux chambres
    à air et pneumatiques, etc., de la position ex 40.11 du tarif douanier commun,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 619/80 der Kommission vom 13. März 1980 zur Wiedereinführung
    des Zollsatzes für Luftschläuche und Laufdecken, usw., der Tarifnummer ex 40.11,
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 619/80 af 13. marts 1980 om genindførelse
    af opkrævning af toldafgifter for slanger og dæk, etc., under position ex 40.11,
    som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 619/80 della Commissione, del 13 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili alle camera d' aria e coperture,
    ecc., della voce ex 40.11 della tariffa doganale comune, originarie della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 619/80 van de Commissie van 13 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op binnenbanden
    en buitenbanden enz., van post ex 40.11, van oorsprong uit Zuid-Korea, ten behoeve
    waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
