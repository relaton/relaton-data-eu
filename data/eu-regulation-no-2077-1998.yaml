title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2077/98 of 29 September 1998 amending Regulation
    (EC) No 1674/98 determining the extent to which applications lodged in July 1998
    for import licences for certain egg sector products and poultrymeat pursuant to
    Regulations (EC) No 1474/95 and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2077/98 de la Commission du 29 septembre 1998 modifiant
    le règlement (CE) n° 1674/98 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en juillet 1998 pour certains produits
    des secteurs de la viande de volaille et des oeufs dans le cadre des règlements
    (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2077/98 der Kommission vom 29. September 1998 zur Änderung
    der Verordnung (EG) Nr. 1674/98 über die Festsetzung des Umfangs, in dem die
    im Juli 1998 gestellten Anträge auf Einfuhrlizenzen für bestimmte Produkte des
    Sektors Eier und Geflügelfleisch entsprechend den Verordnungen (EG) Nr. 1474/95
    und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2077/98 af 29. september 1998 om ændring
    af forordning (EF) nr. 1674/98 om fastsættelse af, i hvilket omfang der kan accepteres
    ansøgninger, der blev indgivet i juli 1998 om importlicenser for visse ægprodukter
    og fjerkrækød i forbindelse med forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2077/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Σεπτεμβρίου 1998 για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1674/98 για τον καθορισμό
    του βαθμού στον οποίο μπορούν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1998 για ορισμένα προϊόντα των τομέων
    του κρέατος πουλερικών και των αυγών στο πλαίσιο
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2077/98, annettu 29 päivänä syyskuuta 1998,
    määrättyyn järjestelmään liittyvien heinäkuussa 1998 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti annetun asetuksen (EY) N:o 1674/98 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2077/98 della Commissione del 29 settembre 1998 che
    modifica il regolamento (CE) n. 1674/98 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli di importazione presentate nel mese di luglio
    1998 per taluni prodotti del settore delle uova e del pollame nel quadro dei regolamenti
    (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2077/98 van de Commissie van 29 september 1998 houdende
    wijziging van Verordening (EG) nr. 1674/98 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sectoren eieren en slachtpluimvee, die in juli 1998 worden ingediend
    op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2077/98 da Comissão de 29 de Setembro de 1998 que
    altera o Regulamento (CE) nº 1674/98 que determina em que medida podem ser aceites
    os pedidos de certificados de importação de determinados produtos do sector
    dos ovos e da carne de aves de capoeira apresentados em Julho de 1998 ao abrigo
    dos Regulamentos (CE) nº 1474/95 e (CE) nº 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2077/98 de la Comisión de 29 de septiembre de 1998
    por el que se modifica el Reglamento (CE) n° 1674/98 por el que se determina
    la proporción en que se satisfarán las solicitudes de certificados de importación
    de algunos productos del sector de los huevos y de la carne de aves de corral
    presentadas en el mes de julio de 1998 al amparo de los Reglamentos (CE) n° 1474/95
    y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2077/98 av den 29 september 1998 om ändring
    av förordning (EG) nr 1674/98 om fastställande av i vilken utsträckning de
    ansökningar om importlicens för vissa äggprodukter samt fjäderfäkött som
    ges in under juli 1998 inom ramen för förordningarna (EG) nr 1474/95 och (EG)
    nr 1251/96 kan godtas
  type: main
