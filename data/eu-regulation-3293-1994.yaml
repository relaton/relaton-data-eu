title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3293/94 of 19 December 1994 fixing, for 1995,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of Member States, apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3293/94 du Conseil, du 19 décembre 1994, fixant, pour
    1995, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction d' un État membre, à l' exception de l'
    Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3293/94 des Rates vom 19. Dezember 1994 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder der Gerichtsbarkeit eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    (1995)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3293/94 af 19. december 1994 om fastsættelse
    for 1995 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3293/94 του Συμβουλίου
    της 19ης Δεκεμβρίου 1994 για τον καθορισμό, για
    το 1995, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με πορτογαλική σημαία στα ύδατα που υπάγονται
    στην κυριαρχία ή τη δικαιοδοσία ενός κράτους
    μέλους εκτός της Ισπανίας και της Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3293/94, annettu 19 päivänä joulukuuta 1994,
    jonkin jäsenvaltion, ei kuitenkaan Espanjan ja Portugalin, suvereniteettiin tai
    lainkäyttövaltaan kuuluvilla vesialueilla Portugalin lipun alla purjehtiviin
    aluksiin vuonna 1995 sovellettavista tietyistä kalavarojen säilyttämis- ja
    hallintotoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3293/94 del Consiglio, del 19 dicembre 1994, che fissa,
    per il 1995, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera del Portogallo nelle acque soggette alla
    sovranità o alla giurisdizione di uno Stato membro, esclusi la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3293/94 van de Raad van 19 december 1994 tot vaststelling,
    voor 1995, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag van Portugal voeren,
    in de wateren die onder de soevereiniteit of de jurisdictie van een Lid-Staat
    vallen, met uitzondering van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3293/94 do Conselho, de 19 de Dezembro de 1994, que
    fixa, para 1995, certas medidas de conservação e gestão dos recursos de pesca
    aplicáveis aos navios que arvorem pavilhão de Portugal nas águas sob a soberania
    ou jurisdição de um Estado-membro, com excepção de Espanha e de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3293/94 del Consejo, de 19 de diciembre de 1994, por
    el que se fijan, para 1995, determinadas medidas de conservación y gestión de
    los recursos pesqueros aplicables a los buques con pabellón de Portugal en las
    aguas de soberanía o de jurisdicción de un Estado miembro, excepto España y
    Portugal
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3293/94 av den 19 december 1994 om fastställande
    för 1995 av vissa åtgärder som syftar till bevarande och förvaltning av fiskeresurser
    och som är tillämpliga för fartyg som för Portugals flagg i vatten som lyder
    under en annan medlemsstats suveränitet eller jurisdiktion, med undantag för
    Spaniens och Portugals vatten
