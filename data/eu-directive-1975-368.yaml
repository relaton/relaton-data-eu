title:
- language: en
  script: Latn
  content: Council Directive 75/368/EEC of 16 June 1975 on measures to facilitate
    the effective exercise of freedom of establishment and freedom to provide services
    in respect of various activities (ex ISIC Division 01 to 85) and, in particular,
    transitional measures in respect of those activities
  type: main
- language: fr
  script: Latn
  content: Directive 75/368/CEE du Conseil, du 16 juin 1975, relative à des mesures
    destinées à favoriser l'exercice effectif de la liberté d'établissement et
    de la libre prestation des services pour diverses activités (ex classe 01 à
    classe 85 CITI) et comportant notamment des mesures transitoires pour ces activités
  type: main
- language: de
  script: Latn
  content: Richtlinie 75/368/EWG des Rates vom 16. Juni 1975 über Maßnahmen zur
    Erleichterung der tatsächlichen Ausübung der Niederlassungsfreiheit und des
    freien Dienstleistungsverkehrs für einige Tätigkeiten (aus ISIC-Hauptgruppe
    01 bis ISIC-Hauptgruppe 85), insbesondere Übergangsmaßnahmen für diese Tätigkeiten
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 75/368/EØF af 16. juni 1975 om foranstaltninger, der
    tilsigter at fremme den effektive udøvelse af etableringsfriheden og den fri
    udveksling af tjenesteydelser inden for forskellige former for virksomhed (ex
    hovedgrupperne 01 til 85 CITI) herunder navnlig overgangsforanstaltninger for
    nævnte former for virksomhed
  type: main
- language: el
  script: Grek
  content: Οδηγία 75/368/ΕΟΚ του Συμβουλίου της 16ης Ιουνίου
    1975 περί των μέτρων που προορίζονται να διευκολύνουν
    την πραγματική άσκηση του δικαιώματος εγκαταστάσεως
    και της ελεύθερης παροχής υπηρεσιών για διάφορες
    δραστηριότητες (ex κλάση 01 έως κλάση 85 ΔΤΤΒ),
    και ιδίως περί των μεταβατικών μέτρων για τις
    δραστηριότητες αυτές
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 75/368/ETY, annettu 16 päivänä kesäkuuta 1975,
    toimenpiteistä sijoittautumisvapauden ja palvelujen tarjoamisen vapauden tehokkaan
    käyttämisen helpottamiseksi itsenäisten ammatinharjoittajien eri toiminnassa
    (ISIC-osastosta 01-85) ja erityisesti tällaista toimintaa koskevista siirtymätoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Direttiva 75/368/CEE del Consiglio, del 16 giugno 1975, concernente misure
    destinate a favorire l'esercizio effettivo della libertà di stabilimento e della
    libera prestazione dei servizi per quanto riguarda varie attività (ex 01-classe
    85 CITI) comprendente segnatamente misure transitorie per tali attività
  type: main
- language: nl
  script: Latn
  content: Richtlijn 75/368/EEG van de Raad van 16 juni 1975 houdende maatregelen
    ter bevordering van de daadwerkelijke uitoefening van het recht van vestiging
    en het vrij verrichten van diensten voor diverse werkzaamheden (ex klasse 01 tot
    en met 85 CITI) en houdende met name overgangsmaatregelen voor deze werkzaamheden
  type: main
- language: pt
  script: Latn
  content: Directiva 75/368/CEE do Conselho, de 16 de Junho de 1975, relativa a medidas
    destinadas a favorecer o exercício efectivo da liberdade de estabelecimento e
    da livre prestação de serviços em várias actividades (ex classe 01 a classe
    85 CITI) e contendo, nomeadamente, medidas transitórias para estas actividades
  type: main
- language: es
  script: Latn
  content: Directiva 75/368/CEE del Consejo, de 16 de junio de 1975, relativa a las
    medidas destinadas a favorecer el ejercicio efectivo de la libertad de establecimiento
    y de la libre prestación de servicios para diversas actividades (ex clase 01
    a clase 85 CITI) y por la que se adoptan, en particular, medidas transitorias
    para dichas actividades
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 75/368/EEG av den 16 juni 1975 om åtgärder för att
    främja det effektiva utövandet av etableringsfriheten och friheten att tillhandahålla
    tjänster inom diverse branscher (ur ISIC-huvudgrupperna 01-85), särskilt övergångsåtgärder
    för dessa verksamhetsformer
