title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2960/83 of 21 October 1983 re-establishing
    the levying of customs duties on umbrellas and sunshades, falling within heading
    No 66.01 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2960/83 de la Commission du 21 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles de la position 66.01 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2960/83 der Kommission vom 21. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Regenschirme und Sonnenschirme der Tarifnummer 66.01
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2960/83 af 21. oktober 1983 om genindførelse
    af opkrævning af told for paraplyer og parasoller, henhørende under pos. 66.01
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
