title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 439/91 of 25 February 1991 repealing certain
    Regulations classifying goods in the nomenclature of the Common Customs Tariff
    which was in force on 31 December 1987
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 439/91 DE LA COMMISSION du 25 février 1991 abrogeant
    certains règlements relatifs au classement de marchandises dans la nomenclature
    du tarif douanier commun qui était en vigueur le 31 décembre 1987 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 439/91 DER KOMMISSION vom 25. Februar 1991 zur Aufhebung
    bestimmter Verordnungen zur Einreihung von Waren in das am 31. Dezember 1987 geltende
    Schema das Gemeinsamen Zolltarifs #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 439/91 af 25. februar 1991 om ophævelse
    af visse forordninger vedrørende tarifering af varer i Den Fælles Toldtarifs
    nomenklatur, der var gældende den 31. december 1987
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 439/91 της Επιτροπής
    της 25ης Φεβρουαρίου 1991 για την κατάργηση ορισμένων
    κανονισμών σχετικών με την κατάταξη εμπορευμάτων
    στην ονοματολογία του κοινού δασμολογίου που
    ίσχυε μέχρι τις 31 Δεκεμβρίου 1987
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 439/91 DELLA COMMISSIONE del 25 febbraio 1991 che
    abroga taluni regolamenti relativi alla classificazione di merci nella nomenclatura
    della tariffa doganale comune in vigore al 31 dicembre 1987 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 439/91 VAN DE COMMISSIE van 25 februari 1991 houdende
    intrekking van enkele verordeningen met betrekking tot de indeling van goederen
    in de op 31 december 1987 geldende nomenclatuur van het gemeenschappelijk douanetarief
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 439/91 DA COMISSÃO de 25 de Fevereiro de 1991 que
    revoga alguns regulamentos relativos à classificação de mercadorias na nomenclatura
    da Pauta Aduaneira Comum que vigorava em 31 de Dezembro de 1987 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 439/91 DE LA COMISIÓN de 25 de febrero de 1991 por
    el que se derogan determinados Reglamentos relativos a la clasificación de las
    mercancías en la nomenclatura del arancel aduanero común vigente el 31 de diciembre
    de 1987 #'
  type: main
