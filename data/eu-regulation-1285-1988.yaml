title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1285/88 of 10 May 1988 re-establishing the
    levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    products of category 10 (order No 40.0100); singlets, underpants, nightshirts,
    pyjamas, bathrobes and similar articles, other than knitted or crocheted, products
    of category 18 (order No 40.0180); trousers, bib and brace overalls, breeches
    and shorts, knitted or crocheted, products of category 28 (order No 40.0280),
    originating in Pakistan, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1285/88 de la Commission du 10 mai 1988 portant rétablissement
    de la perception des droits de douane applicables à la ganterie de bonneterie
    de la catégorie de produits n° 10 (n° d' ordre 40.0100), aux vêtements de
    dessus et de dessous autres qu' en bonneterie, de la catégorie de produits n°
    18 (n° d' ordre 40.0180), et aux pantalons, salopettes, culottes et shorts en
    bonneterie, de la catégorie de produits n° 28 (n° d' ordre 40.0280), originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1285/88 der Kommission vom 10. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Handschuhe aus Gewirken der Warenkategorie Nr. 10 (lfd. Nr.
    40.0100), Unterhemden, Slips usw., andere als aus Gewirken, der Warenkategorie
    Nr. 18 (lfd. Nr. 40.0180) sowie lange Hosen, Latzhosen und kurze Hosen, aus Gewirken,
    der Warenkategorie Nr. 28 (lfd. Nr. 40.0280) mit Ursprung in Pakistan, dem die
    in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
