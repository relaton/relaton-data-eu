  script: Latn
  content: Reglamento (CEE) n° 1285/88 de la Comisión de 10 de mayo de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los guantes y similares, de punto, de la categoría n° 10 (número de orden
    40.0100); a las fajas, calzoncillos, etc., que no sean de punto, de la categoría
    n° 18 (número de orden 40.0180) y a los pantalones, pantalones de peto con tirantes
    y "shorts", de punto, de la categoría n° 28 (número de orden 40.0280), originarios
