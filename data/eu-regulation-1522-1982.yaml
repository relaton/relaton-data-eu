title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1522/82 of 15 June 1982 derogating from
    certain provisions of Regulation (EEC) No 2042/75 with regard to the period of
    validity of certain import licences in the cereals sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1522/82 de la Commission, du 15 juin 1982, dérogeant
    à certaines dispositions du règlement (CEE) n° 2042/75 en ce qui concerne la
    durée de validité de certains certificats d' importation dans le secteur des
    céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1522/82 der Kommission vom 15. Juni 1982 mit einer
    Abweichung von der Verordnung (EWG) Nr. 2042/75 hinsichtlich der Geltungsdauer
    bestimmter Einfuhrlizenzen für Getreide
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1522/82 af 15. juni 1982 om undtagelse
    fra visse bestemmelser i forordning (EØF) nr. 2042/75 for så vidt angår gyldighedsperioden
    for visse importlicenser for korn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1522/82 τής Επιτροπής
    τής 15ης Ιουνίου 1982 περί παρεκκλίσεως από ορισμένες
    διατάξεις τού κανονισμού (EOK) αριθ. 2042/75 όσον
    αφορά τή διάρκεια ισχύος ορισμένων πιστοποιητικών
    εισαγωγής στόν τομέα τών σιτηρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1522/82 della Commissione, del 15 giugno 1982, che
    deroga a talune disposizioni del regolamento (CEE) n. 2042/75 per quanto riguarda
    la durata di validità di taluni titoli d' importazione nel settore dei cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1522/82 van de Commissie van 15 juni 1982 tot afwijking
    van sommige bepalingen van Verordening (EEG) nr. 2042/75 met betrekking tot de
    geldigheidsduur van bepaalde invoercertificaten in de sector granen
  type: main
