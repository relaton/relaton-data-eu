    v talianskom regióne Toskánsko je bez výskytu brucelózy (B. melitensis), a
    rozhodnutie 2003/467/ES, pokiaľ ide o vyhlásenie, že Francúzsko je bez výskytu
    brucelózy hovädzieho dobytka [oznámené pod číslom K(2005) 4187]'
  type: main
- language: sl
  script: Latn
  content: '2005/764/ES: Odločba Komisije z dne 28. oktobra 2005 o spremembah Odločbe
    93/52/EGS glede razglasitve italijanske pokrajine Grosseto v regiji Toskana kot
    proste bruceloze (B. melitensis) in Odločbe 2003/467/ES glede razglasitve Francije
    kot proste bruceloze pri govedu (notificirano pod dokumentarno številko K(2005)
    4187)'
  type: main
- language: es
  script: Latn
  content: '2005/764/CE: Decisión de la Comisión, de 28 de octubre de 2005, por
    la que se modifica la Decisión 93/52/CEE, en lo que respecta a la declaración
    de que la provincia de Grosseto en la región de Toscana en Italia está indemne
    de brucelosis (B. melitensis), y la Decisión 2003/467/CE, en lo que respecta
    a la declaración de que Francia está indemne de brucelosis bovina [notificada
    con el número C(2005) 4187]'
  type: main
