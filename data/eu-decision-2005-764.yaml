id: EUDecision2005764
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2005/764/EC: Commission Decision of 28 October 2005 amending Decision
    93/52/EEC as regards the declaration that the province of Grosseto in the Region
    of Toscana in Italy is free of brucellosis (B. melitensis) and Decision 2003/467/EC
    as regards the declaration that France is free of bovine brucellosis (notified
    under document number C(2005) 4187)'
  type: main
- language: fr
  script: Latn
  content: '2005/764/CE: Décision de la Commission du 28 octobre 2005 modifiant la
    décision 93/52/CEE en ce qui concerne la reconnaissance du statut d’indemne
    de la brucellose (B. melitensis) pour la province de Grosseto dans la région
    de Toscane, en Italie, et modifiant la décision 2003/467/CE en ce qui concerne
    la reconnaissance du statut d’indemne de la brucellose bovine pour la France
    [notifiée sous le numéro C(2005) 4187]'
  type: main
- language: de
  script: Latn
  content: '2005/764/EG: Entscheidung der Kommission vom 28. Oktober 2005 zur Änderung
    der Entscheidung 93/52/EWG hinsichtlich der Erklärung, dass die Provinz Grosseto
    in der italienischen Region Toskana frei von Brucellose (B. melitensis) ist, und
    der Entscheidung 2003/467/EG hinsichtlich der Erklärung, dass Frankreich frei
    von Rinderbrucellose ist (Bekannt gegeben unter Aktenzeichen K(2005) 4187)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 28 октомври 2005 година
    за изменение на Решение 93/52/ЕИО по отношение
    на декларирането на провинция Grosseto в област
    Toscana в Италия за свободна от бруцелоза (B. melitensis)
    и Решение 2003/467/ЕО по отношение на декларирането
    на Франция за свободна от бруцелоза по говедата
    (нотифицирано под номер C(2005) 4187)
  type: main
- language: cs
  script: Latn
  content: '2005/764/ES: Rozhodnutí Komise ze dne 28. října 2005, kterým se mění
    rozhodnutí 93/52/EHS, pokud jde o prohlášení provincie Grosseto v oblasti
    Toskánsko v Itálii za prostou brucelózy (B. melitensis), a rozhodnutí 2003/467/ES,
    pokud jde o prohlášení Francie za prostou brucelózy skotu (oznámeno pod číslem
    K(2005) 4187)'
  type: main
- language: da
  script: Latn
  content: '2005/764/EF: Kommissionens beslutning af 28. oktober 2005 om ændring
    af beslutning 93/52/EØF for så vidt angår erklæringen om, at provinsen Grosseto
    i regionen Toscana i Italien er fri for brucellose (B. melitensis), og beslutning
    2003/467/EF for så vidt angår erklæringen om, at Frankrig er fri for kvægbrucellose
    (meddelt under nummer K(2005) 4187)'
  type: main
- language: el
  script: Grek
  content: '2005/764/ΕΚ: Απόφαση της Επιτροπής, της 28ης
    Οκτωβρίου 2005, για την τροποποίηση της απόφασης
    93/52/ΕΟΚ όσον αφορά τη δήλωση ότι η επαρχία Grosseto
    της περιφέρειας της Τοσκάνης στην Ιταλία είναι
    απαλλαγμένη από τη βρουκέλλωση (B. melitensis) και
    της απόφασης 2003/467/ΕΚ όσον αφορά τη δήλωση ότι
    η Γαλλία είναι απαλλαγμένη από τη βρουκέλλωση
    των βοοειδών [κοινοποιηθείσα υπό τον αριθμό
    Ε(2005) 4187]'
  type: main
- language: et
  script: Latn
  content: '2005/764/EÜ: Komisjoni otsus, 28. oktoober 2005, millega muudetakse otsust
    93/52/EMÜ seoses Toscana maakonna Grosseto provintsi brutselloosivabaks (B. melitensis)
    tunnistamisega ja otsust 2003/467/EÜ seoses Prantsusmaa veiste brutselloosist
    vabaks tunnistamisega (teatavaks tehtud numbri K(2005) 4187 all)'
  type: main
- language: fi
  script: Latn
  content: '2005/764/EY: Komission päätös, tehty 28 päivänä lokakuuta 2005,
