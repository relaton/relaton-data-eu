    nėra nustatyta galvijų bruceliozė (B. melitensis), ir Sprendimą 2003/467/EB
    paskelbiant, kad Prancūzijoje nėra nustatyta galvijų bruceliozė (pranešta
    dokumentu Nr. C(2005) 4187)'
  type: main
