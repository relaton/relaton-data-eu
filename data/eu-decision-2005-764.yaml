    u Italiji slobodna od bruceloze (B. melitensis ) i Odluke 2003/467/EZ s obzirom
    na izjavu da je Francuska slobodna od goveđe bruceloze (priopćena pod brojem
    dokumenta C(2005) 4187)'
  type: main
