    történő nyilvánítása tekintetében a 93/52/EGK határozat, valamint Franciaország
    szarvasmarhabrucellózis-mentessé történő nyilvánítása tekintetében a
    2003/467/EK határozat módosításáról (az értesítés a C(2005) 4187. számú
    dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2005/764/CE: Decisione della Commissione, del 28 ottobre 2005, che modifica
    la decisione 93/52/CEE riguardo alla dichiarazione che la provincia di Grosseto
    nella regione italiana della Toscana è indenne da brucellosi (B. melitensis)
    e la decisione 2003/467/CE riguardo alla dichiarazione che la Francia è indenne
    da brucellosi bovina [notificata con il numero C(2005) 4187]'
  type: main
- language: lv
  script: Latn
  content: '2005/764/EK: Komisijas Lēmums (2005. gada 28. oktobris), ar kuru groza
    Lēmumu 93/52/EEK attiecībā uz Groseto provinces Toskānas reģionā Itālijā
    pasludināšanu par brīvu no brucelozes (B. melitensis) un Lēmumu 2003/467/EK
