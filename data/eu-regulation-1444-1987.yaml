title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1444/87 of 26 May 1987 re-establishing the
    levying of customs duties on gauze and articles of gauze falling within heading
    No ex 30.04, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1444/87 de la Commission du 26 mai 1987 portant rétablissement
    de la perception des droits de douane applicables aux gazes et articles en gaze
    de la position ex 30.04 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1444/87 der Kommission vom 26. Mai 1987 zur Wiedereinführung
    der Erhebung der Zölle für Gaze und Waren daraus der Tarifnummer ex 30.04 des
    Gemeinsamen Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1444/87 af 26. maj 1987 om genindførelse
    af opkrævning af told for gaze samt varer deraf, henhørende under pos. ex 30.04
    i den fælles toldtarif og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1444/87 της Επιτροπής
