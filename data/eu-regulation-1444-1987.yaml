    oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1444/87 da Comissão de 26 de Maio de 1987 que restabelece
