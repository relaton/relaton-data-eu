    των δασμών για γάζες και είδη από γάζα της δασμολογικής
    κλάσης ex 30.04, καταγωγής Κίνας, δικαιούχου των
    προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3924/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1444/87 della Commissione del 26 maggio 1987 che ripristina
    la riscossione dei dazi doganali applicabili alle garze e prodotti di garza della
    voce ex 30.04 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1444/87 van de Commissie van 26 mei 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gaas en artikelen
