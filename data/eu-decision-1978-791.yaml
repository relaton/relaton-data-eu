type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 September 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to parkas, anoraks, windcheaters and the like, woven, of wool,
    of cotton or of man-made textile fibres, falling within heading No ex 61.01 or
    subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.01-29, 31,
    32; 61.02-25, 26, 28), originating in Hong Kong and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '78/791/CEE: Décision de la Commission, du 13 septembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les parkas, anoraks, blousons et similaires,
    tissés, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    des positions et sous-position Ex 61.01 et Ex 61.02 B du Tarif douanier commun
    (codes Nimexe : 61.01-29, 31, 32; 61.02-25, 26, 28) originaires de Hong-Kong et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. September 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Parkas, Anoraks, Windjacken und dergleichen, aus Geweben, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Tarifnummern
    ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-29;
    31; 32 - 61.02-25; 26; 28) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. september 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage parkaer, anorakker, vindjakker og lignende af uld, bomuld eller kemofibre,
    som henhører under pos. ex 61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-kode
    61.01-29, 31, 32; 61.02-25, 26, 28), har oprindelse i Hongkong og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 13 settembre 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario giacche e giacconi a vento, giubbotti e simili, tessuti,
    di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.01
    e della sottovoce ex 61.02 B della tariffa doganale comune (codice Nimexe: 61.01-29;
    31; 32 - 61.02-25; 26; 28), originari di Hong Kong e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 13 september 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd parka''s, anoraks, windjakken en dergelijke, geweven, van wol, van
    katoen of van synthetische of van kunstmatige vezels van de posten ex 61.01 en
    ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code: 61.01-29, 31,
    32 - 61.02-25, 26, 28) van oorsprong uit Hong-Kong en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
