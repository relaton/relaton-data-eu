  content: Council Regulation (EEC) No 3626/83 of 19 December 1983 amending Regulation
    (EEC) No 616/78 on proof of origin for certain textile products falling within
    Chapter 51 or Chapters 53 to 62 of the Common Customs Tariff and imported into
    the Community and on the conditions for the acceptance of such proof
  type: main
- language: fr
  script: Latn
