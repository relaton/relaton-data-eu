title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 517/2011 of 25 May 2011 implementing Regulation
    (EC) No 2160/2003 of the European Parliament and of the Council as regards a Union
    target for the reduction of the prevalence of certain Salmonella serotypes in
    laying hens of Gallus gallus and amending Regulation (EC) No 2160/2003 and Commission
    Regulation (EU) No 200/2010
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 517/2011 de la Commission du 25 mai 2011 portant application
    du règlement (CE) n ° 2160/2003 du Parlement européen et du Conseil en ce qui
    concerne la fixation de l’objectif de l’Union en matière de réduction de
    la prévalence de certains sérotypes de salmonelles chez les poules pondeuses
    de l’espèce Gallus gallus et portant modification du règlement (CE) n ° 2160/2003
    et du règlement (UE) n ° 200/2010 de la Commission
  type: main
- language: de
  script: Latn
