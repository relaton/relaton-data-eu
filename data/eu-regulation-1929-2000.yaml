title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1929/2000 of 12 September 2000 amending Regulation
    (EC) No 2603/1999 laying down rules for the transition to the rural development
    support provided for by Council Regulation (EC) No 1257/1999 as regards transformation
    of agri-environmental commitments entered into under Council Regulation (EEC)
    No 2078/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1929/2000 de la Commission du 12 septembre 2000 modifiant
    le règlement (CE) nº 2603/1999 fixant les règles transitoires pour le soutien
    au développement rural en ce qui concerne la transformation des engagements agro-environnementaux
    contractés au titre du règlement (CEE) nº 2078/92 du Conseil
  type: main
- language: de
  script: Latn
