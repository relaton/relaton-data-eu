title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 828/83 of 8 April 1983 re-establishing the
    levying of customs duties on coumarin, methylcoumarins and ethylcoumarins, falling
    within subheading 29.35 N and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 828/83 de la Commission du 8 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à la coumarine, aux méthylcoumarines
    et aux éthylcoumarines de la sous-position 29.35 N du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 828/83 der Kommission vom 8. April 1983 zur Wiedereinführung
    der Erhebung der Zölle für Cumarin, Methylcumarine und Äthylcumarine der Tarifstelle
    29.35 N, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 828/83 af 8. april 1983 om genindførelse
    af opkrævning af told for cumarin, methylcumariner og ethylcumariner, henhørende
    under pos. 29.35 N og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 828/83 της Επιτροπής
    της 8ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για την κουμαρίνη, μεθυλοκουμαρίνες
    και αιθυλοκουμαρίνες της διακρίσεως 29.35 Ν του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 828/83 della Commissione dell' 8 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili alla cumarina, metilcumarine e etilcumarine
    della sottovoce 29.35 N della tariffa doganale comune, originarie della Cina,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 828/83 van de Commissie van 8 april 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op cumarine, methylcumarinen
    en ethylcumarinen van postonderverdeling 29.35 N, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
