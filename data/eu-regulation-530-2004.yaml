  script: Latn
  content: Commission Regulation (EC) No 530/2004 of 22 March 2004 determining the
    extent to which applications lodged in March 2004 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 to 30 April 2004 can be accepted
  type: main
- language: fr
  script: Latn
