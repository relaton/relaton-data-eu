  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1347/2003, annettu 29 päivänä heinäkuuta
    2003, Ukrainasta peräisin olevien teräsköysien ja -kaapeleiden tuonnissa neuvoston
    asetuksella (EY) N:o 1796/1999 käyttöön otettujen polkumyyntitoimenpiteiden
    väitettyä kiertämistä Moldovasta lähetettyjen teräsköysien ja -kaapeleiden
    tuonnilla, riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu Moldova,
    koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1347/2003/EK Rendelete (2003. július 29.) az 1796/1999/EK
    tanácsi rendelettel az Ukrajnából származó acél drótkötelek és kábelek
    behozatalára vonatkozóan bevezetett dömpingellenes intézkedéseknek a Moldovában
    feladott acél drótkötelek és kábelek – függetlenül attól, hogy azokat
    Moldovából származónak jelentik-e be vagy sem – behozatala általi állítólagos
    megkerülésével kapcsolatos vizsgálat kezdeményezéséről, valamint e behozatalok
    nyilvántartásba vételi kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1347/2003 della Commissione, del 29 luglio 2003, che
    apre un'inchiesta relativa alla presunta elusione delle misure antidumping istituite
    dal regolamento (CE) n. 1796/1999 del Consiglio sulle importazioni di cavi di
    acciaio originari dell'Ucraina mediante importazioni di cavi di acciaio spediti
    dalla Moldavia, indipendentemente dal fatto che siano dichiarati o meno originari
    della Moldavia, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1347/2003 (2003. gada 29. jūlijs), ar ko uzsāk
    izmeklēšanu attiecībā uz Padomes Regulā (EK) Nr. 1796/1999 par Ukrainas izcelsmes
    tērauda trošu un tauvu importu noteikto antidempinga pasākumu iespējamo apiešanu,
    ievedot tērauda troses un tauvas no Moldāvijas un deklarējot vai nedeklarējot
    tās kā Moldāvijas izcelsmes ražojumus, un nosaka reģistrācijas piemērošanu
    šādiem ievedumiem
  type: main
- language: lt
  script: Latn
  content: 2003 m. liepos 29 d. Komisijos Reglamentas (EB) Nr. 1347/2003 pradedantis
