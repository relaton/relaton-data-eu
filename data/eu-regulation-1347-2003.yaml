    kabelių importui nustatė Tarybos Reglamentas (EB) Nr. 1796/1999, tariamo apėjimo
    siunčiant plieno lynų ir kabelių importą iš Moldovos, deklaruojamą arba
    nedeklaruojamą kaip Moldovos kilmės importą, ir nustatantis tokiam importui
    registravimą
  type: main
- language: mt
  script: Latn
