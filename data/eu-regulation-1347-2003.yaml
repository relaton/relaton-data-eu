title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1347/2003 of 29 July 2003 initiating an investigation
    concerning the alleged circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 1796/1999 on imports of steel ropes and cables originating
    in the Ukraine by imports of steel ropes and cables consigned from Moldova, whether
    declared as originating in Moldova or not, and making such imports subject to
    registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1347/2003 de la Commission du 29 juillet 2003 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 1796/1999 du Conseil sur les importations de câbles
    en acier originaires d'Ukraine par des importations de câbles en acier expédiés
    de la République de Moldova, qu'ils aient ou non été déclarés originaires
    de ce pays, et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1347/2003 der Kommission vom 29. Juli 2003 zur Einleitung
    einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung (EG)
    Nr. 1796/1999 des Rates eingeführten Antidumpingmaßnahmen gegenüber den Einfuhren
    von Kabeln und Seilen aus Stahl mit Ursprung in der Ukraine durch Einfuhren von
    aus der Republik Moldau versandten Kabeln und Seilen aus Stahl, unabhängig davon,
    ob ihr Ursprung in der Anmeldung mit Republik Moldau angegeben ist oder nicht,
    und zur zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1347/2003 ze dne 29. července 2003, o zahájení
    šetření ve věci údajného obcházení antidumpingových opatření uložených
    nařízením Rady (ES) č. 1796/1999 na dovozy ocelových lan a kabelů pocházejících
    z Ukrajiny, uskutečňovaného dovozy ocelových lan a kabelů zasílaných z
    Moldavska, ať již jsou prohlášeny za pocházející z Moldavska či nikoliv,
    a o povinné evidenci takových dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1347/2003 af 29. juli 2003 om indledning
    af en undersøgelse af den påståede omgåelse af antidumpingforanstaltningerne
    indført ved Rådets forordning (EF) nr. 1796/1999 om importen af tovværk og
    kabler af stål med oprindelse i Ukraine, der er afsendt fra Moldova, uanset om
    den er angivet som havende oprindelse i Moldova eller ej, og om at gøre denne
    import til genstand for registrering
  type: main
- language: el
  script: Grek
