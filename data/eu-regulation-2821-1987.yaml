    berekening van de heffing in de sector van op basis van groenten en fruit verwerkte
    produkten en in de wijnsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2821/87 da Comissão, de 21 de Setembro de 1987,
