title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1406/72 of the Council of 27 June 1972 determining
    for the 1972/73 marketing year the principal marketing centres for cereals and
    the derived intervention prices applicable at those centres and the single intervention
    price for maize and the single intervention price for durum wheat
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1406/72 du Conseil, du 27 juin 1972, fixant, pour
    la campagne 1972/1973, les principaux centres de commercialisation des céréales
    et les prix d' intervention dérivés s' y rapportant, ainsi que le prix d' intervention
    unique pour le maïs et le prix d' intervention unique pour le froment dur
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1406/72 des Rates vom 27. Juni 1972 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide, der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise sowie des einzigen Interventionspreises
    für Mais und des einzigen Interventionspreises für Hartweizen für das Wirtschaftsjahr
    1972/1973
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1406/72 af 26. juni 1972 om fastsættelse
    af de vigtigste handelscentre for korn, de afledte interventionspriser, der refererer
    sig dertil, samt den fælles interventionspris for majs og den fælles interventionspris
    for hård hvede for høståret 1972/1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1406/72 del Consiglio, del 27 giugno 1972, che fissa,
    per la campagna 1972/1973, i principali centri di commercializzazione dei cereali
    ed i relativi prezzi d' intervento derivati, nonché il prezzo d' intervento unico
    per il granturco e il prezzo d' intervento unico per il frumento duro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1406/72 van de Raad van 27 juni 1972 houdende vaststelling
    van de voornaamste commercialisatiecentra voor granen, de voor deze centra geldende
    afgeleide interventieprijzen, alsmede de enige interventieprijs voor maïs en
    de enige interventieprijs voor durum tarwe voor het verkoopseizoen 1972/1973
  type: main
