    της Ισπανίας (Βαλεαρίδες Νήσοι)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1233/2013, 29. november 2013 , millega
    kehtestatakse erand määrusest (EÜ) nr 1967/2006 seoses teatavates Hispaania
    (Baleaari saared) territoriaalvetes väikese plankmudila ( Aphia minuta ), ferreri
    mudila ( Pseudaphia ferreri ) ja smariidi ( Spicara smaris ) püüdmiseks kasutatavate
    paadinootade miinimumkaugusega rannikust ja vee miinimumsügavusega nende kasutamisel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1233/2013, annettu 29 päivänä
    marraskuuta 2013 , vähimmäisetäisyyttä rannikolta ja veden vähimmäissyvyyttä
    koskevan poikkeuksen myöntämiseksi asetuksesta (EY) N:o 1967/2006 kalastettaessa
    kuultotokkoa ( Aphia minuta ), Pseudaphia ferreri -tokkoa ja pikkupikarellia (Spicara
    Smaris) alukselta vedettävillä nuotilla tietyillä Espanjan aluevesillä (Baleaarit)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1233/2013 оd 29. studenoga 2013. o
    utvrđivanju izuzeća od Uredbe (EZ) br. 1967/2006 u pogledu minimalne udaljenosti
    od obale i minimalne dubine mora za potegače otvorenog mora koje love mliječ
    ružični ( Aphia minuta ), mliječ pučinski ( Pseudaphia ferreri ) i giru oblicu
    ( Spicara smaris ) u određenim teritorijalnim vodama Španjolske (Balearski otoci)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1233/2013/EU végrehajtási rendelete ( 2013. november 29.
    ) Spanyolország egyes felségvizein (Baleár-szigetek) az üveggébre és a Ferrer-gébre
    ( Aphia minuta és Pseudaphia ferreri ), valamint a nyurga durbincsra ( Spicara
    smaris ) irányuló halászatban alkalmazott, hajóról működtetett kerítőhálók
    telepítésének mélysége és parttól számított távolsága tekintetében
    az 1967/2006/EK rendelettől való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1233/2013 della Commissione, del 29 novembre
    2013 , recante deroga al regolamento (CE) n. 1967/2006 per quanto concerne la
    distanza minima dalla costa e la profondità minima per le sciabiche da natante
    utilizzate per la pesca del rossetto e del ghiozzo di Ferrer ( Aphia minuta e
    Pseudaphia ferreri ) e dello zerro ( Spicara smaris ) in talune acque territoriali
    della Spagna (Isole Baleari)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1233/2013 ( 2013. gada 29. novembris
    ), ar ko paredz atkāpi no Regulas (EK) Nr. 1967/2006 attiecībā uz minimālo
    attālumu no krasta un minimālo dziļumu, kas jāievēro laivām, kuras noteiktos
    Spānijas (Baleāru salu) teritoriālo ūdeņu apgabalos ar zvejas vadiem zvejo
    stikla grunduļus ( Aphia minuta ), jūrasgrunduļus ( Pseudaphya ferreri ) un
    smarīdas ( Spicara smaris )
  type: main
- language: lt
  script: Latn
  content: 2013 m. lapkričio 29 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1233/2013,
    kuriuo nustatoma nuo Reglamento (EB) Nr. 1967/2006 nuostatų dėl minimalaus atstumo
    nuo kranto ir minimalaus jūros gylio reikalavimų, taikomų laivų gaubiamaisiais
    tinklais žvejojant afijas ( Aphia minuta ir Pseudaphia ferreri ) ir paprastąsias
    smarides ( Spicara smaris ) tam tikruose Ispanijos (Balearų salos) teritoriniuose
    vandenyse, nukrypti leidžianti nuostata
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1233/2013 tad-
    29 ta’ Novembru 2013 li jistabbilixxi deroga mir-Regolament (KE) Nru 1967/2006
    dwar id-distanza minima mill-kosta u l-fond minimu tal-baħar għas-sajd mit-tartaruni
    għall-makku u l-makku ferreri ( Aphia minuta u Pseudaphia ferreri ) u għall-arżnell
    ( Spicara smaris ) f’ċerti ilmijiet territorjali ta’ Spanja (il-Gżejjer
    Baleariċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1233/2013 van de Commissie van 29 november
    2013 houdende afwijking van Verordening (EG) nr. 1967/2006, wat betreft de minimumafstand
    van de kust en de minimumzeediepte voor bootzegens voor de visserij op glasgrondel
    ( Aphia minuta ), Ferrer’s grondel ( Pseudaphia ferreri ) en picarel ( Spicara
    smaris ) in bepaalde territoriale wateren van Spanje (Balearen)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1233/2013 z dnia 29 listopada
    2013 r. ustanawiające odstępstwo od rozporządzenia (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza dla niewodów
    pełnomorskich do połowu babki przezroczystej, ryb z gatunku Pseudaphia ferreri
    ( Aphia minuta i Pseudaphia ferreri ) oraz pysonia smukłego ( Spicara smaris
    ) na niektórych wodach terytorialnych Hiszpanii (Baleary)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1233/2013 da Comissão, de 29 de novembro
    de 2013 , que derroga o Regulamento (CE) n. ° 1967/2006 do Conselho no que respeita
    à distância mínima da costa e à profundidade mínima para as redes envolventes-arrastantes
    de alar para bordo utilizadas na pesca do caboz-transparente e do caboz-de-ferrer
    ( Aphia minuta e Pseudaphia ferreri ) e do trombeiro-boga ( Spicara smaris ) em
    determinadas águas territoriais de Espanha (Ilhas Baleares)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1233/2013 al Comisiei din
    29 noiembrie 2013 de instituire a unei derogări de la Regulamentul (CE) nr. 1967/2006
    cu privire la distanța minimă față de coastă și adâncimea minimă a mării
    pentru năvoadele de navă utilizate pentru pescuitul guvidului alb și guvidului
    Ferrer ( Alphia minuta și Pseudaphia ferreri ) și al smaridului comun ( Spicara
    smaris ) în anumite ape teritoriale ale Spaniei (Insulele Baleare)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1233/2013 z 29. novembra 2013
    , ktorým sa udeľuje výnimka z nariadenia (ES) č. 1967/2006, pokiaľ ide o
    minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora pre lov druhov Aphia
    minuta, Pseudaphia ferreri a Spicara smaris záťahovými sieťami ovládanými
    z lode v určitých pobrežných vodách Španielska (Baleárske ostrovy)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1233/2013 z dne 29. novembra 2013 o
    uvedbi odstopanja od Uredbe (ES) št. 1967/2006 glede najmanjše oddaljenosti
    od obale in najmanjše morske globine za potegalke odprtega morja za lovljenje
    belega in ferrerjevega glavača ( Aphia minuta in Pseudaphia ferreri ) ter girice
    ( Spicara smaris ) v določenih teritorialnih vodah Španije (Balearski otoki)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1233/2013 de la Comisión, de 29 de
    noviembre de 2013 , por el que se establece una exención a lo dispuesto en el
    Reglamento (CE) n ° 1967/2006 en lo concerniente a la distancia mínima de la
    costa y la profundidad marina mínima en el caso de las redes de tiro desde embarcación
    para la pesca de chanquete y cabotí ( Aphia minuta y Pseudaphia ferreri ) y de
    caramel ( Spicara smaris ) en determinadas aguas territoriales de España (islas
    Baleares)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1233/2013 av den 29 november
    2013 om undantag från förordning (EG) nr 1967/2006 vad gäller minsta avstånd
    från kusten och minsta djup för fartyg som använder vad-/notredskap vid fiske
    efter klarbult och Ferrers smörbult ( Aphia minuta och Pseudaphia ferreri ) samt
    menolapikarell ( Spicara Smaris ) i vissa av Spaniens territorialvatten (Balearerna)
