title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1233/2013 of 29 November 2013
    establishing a derogation from Regulation (EC) No 1967/2006 as regards the minimum
    distance from coast and the minimum sea depth for boat seines fishing for transparent
    and Ferrer’s gobies ( Aphia minuta and Pseudaphia ferreri ) and Lowbody picarel
    ( Spicara smaris ) in certain territorial waters of Spain (Balearic Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1233/2013 de la Commission du 29 novembre
    2013 portant dérogation au règlement (CE) n ° 1967/2006 en ce qui concerne
    la distance de la côte et la profondeur minimales pour les sennes de bateau pêchant
    le gobie transparent et le gobie de Ferrer ( Aphia minuta et Pseudaphia ferreri
    ) et le picarel commun ( Spicara smaris ) dans certaines eaux territoriales de
    l’Espagne (îles Baléares)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1233/2013 der Kommission vom 29. November
    2013 zur Genehmigung einer Ausnahme von der Verordnung (EG) Nr. 1967/2006 hinsichtlich
    des Mindestabstands von der Küste und der Mindestwassertiefe für Bootswaden
    für den Fang von Glas- und Ferrer-Grundeln ( Aphia minuta und Pseudaphia ferreri
    ) sowie Pikarels ( Spicara smaris ) in bestimmten Hoheitsgewässern Spaniens (Balearen)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1233/2013 на
    Комисията от 29 ноември 2013 година за предоставяне
    на дерогация от Регламент (ЕО) № 1967/2006 по отношение
    на минималното разстояние от брега и минималната
    дълбочина за улов на стъкленка ( Аphia minuta ), на
    риба от вида Pseudaphia ferreri и на смарид ( Spicara smaris
    ) с корабни грибове в част от териториалните
    води на Испания (Балеарски острови)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1233/2013 ze dne 29. listopadu
    2013 , kterým se stanoví odchylka od nařízení (ES) č. 1967/2006, pokud jde
    o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu hlaváče průsvitného (Aphia minuta) a hlaváče Ferrerova ( Pseudaphia
    ferreri ) a modráka ostronosého ( Spicara smaris ) v některých teritoriálních
    vodách Španělska (Baleárské ostrovy)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1233/2013 af 29. november
    2013 om dispensation fra Rådets forordning (EF) nr. 1967/2006 for så vidt angår
    mindsteafstanden fra kysten og mindstedybden for anvendelsen af vod brugt fra
    fartøjer, der fisker efter glaskutling ( Aphia minuta ), Ferrers kutling ( Pseudaphia
    ferreri ) og slank pikarel ( Spicara smaris ) i visse spanske territorialfarvande
    (Balearerne)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1233/2013
    της Επιτροπής, της 29ης Νοεμβρίου 2013 , για τη
    θέσπιση παρέκκλισης από τον κανονισμό (ΕΚ)
    αριθ. 1967/2006 όσον αφορά την ελάχιστη απόσταση
    από την ακτή και το ελάχιστο βάθος θάλασσας
    που οφείλουν να τηρούν οι συρόμενοι από σκάφος
    γρίποι που αλιεύουν τα είδη γωβιουδάκι άφια
    και γωβιός του Φερρέρ ( Aphia minuta και Pseudaphia ferreri
