title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 786/79 of 19 April 1979 re-establishing
    the levying of customs duties on lead-acid electric accumulators, falling within
    subheading 85.04 A and originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 786/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux accumulateurs
    électriques au plomb, de la sous-position 85.04 A, originaires de la Yougoslavie
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 786/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für elektrische Blei-Akkumulatoren der Tarifstelle 85.04 A, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 786/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for elektriske akkumulatorer, blyakkumulatorer,
    under underposition 85.04 A, som har oprindelse i Jugoslavien og omfattes af de
    toldpræferencer som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 786/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli accumulatori elettrici
    al piombo della sottovoce doganale 85.04 A, originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 786/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    accumulatoren met loden platen, van post 85.04 A, van oorsprong uit Joegoslavië
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
