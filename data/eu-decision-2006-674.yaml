  script: Latn
  content: '2006/674/EC: Commission Decision of 6 October 2006 amending Annexes I
    and II to Decision 2002/308/EC establishing lists of approved zones and approved
    farms with regard to one or more of the fish diseases viral haemorrhagic septicaemia
    (VHS) and infectious haematopoietic necrosis (IHN) (notified under document number
    C(2006) 4362)'
  type: main
- language: fr
  script: Latn
  content: '2006/674/CE: Décision de la Commission du 6 octobre 2006 modifiant les
