    del codice 3503 00 10 della nomenclatura combinata e al vasellame di maiolica
    del codice 6912 00 50 della nomenclatura combinata originari del Brasile, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2866/88 VAN DE COMMISSIE van 15 september 1988 houdende
