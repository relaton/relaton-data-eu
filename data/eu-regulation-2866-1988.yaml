title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2866/88 of 15 September 1988 re-establishing
    the levying of customs duties on gelatines and derivatives thereof, falling within
    CN code 3503 00 10 and ceramic tableware falling within CN code 6912 00 50, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2866/88 de la Commission du 15 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés du code NC 3503 00 10 et à la vaisselle en céramique du code
    NC 6912 00 50 originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2866/88 DER KOMMISSION vom 15. September 1988 zur
    Wiedereinführung der Erhebung der Zölle für Gelatine und ihre Derivate der
    Unterposition 3503 00 10 der Kombinierten Nomenklatur und anderes keramisches
    Geschirr der Unterposition 6912 00 50 der Kombinierten Nomenklatur mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2866/88 af 15. september 1988 om genindførelse
    af opkrævning af told for gelatine og gelatinederivater henhørende under KN-
    kode 3503 00 10 og bordservice af keramisk materiale henhørende under KN-kode
    6912 00 50 og med oprindelse i Brasilien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2866/88 της Επιτροπής
    της 15ης Σεπτεμβρίου 1988 περί αποκαταστάσεως
    της εφαρμογής των δασμών για ζελατίνες και
    τα παράγωγά τους του κωδικού ΣΟ 3503 00 10 και για
    επιτραπέζια σκεύη από κεραμευτική ύλη του
    κωδικού ΣΟ 6912 00 50, καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3924/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
