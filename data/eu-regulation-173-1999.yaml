title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 173/1999 of 26 January 1999 determining the
    extent to which applications lodged in January 1999 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 173/1999 de la Commission du 26 janvier 1999 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1999 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 173/1999 der Kommission vom 26. Januar 1999 über die
    Festsetzung des Umfangs, in dem die im Januar 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 173/1999 af 26. januar 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    1999 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 173/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Ιανουαρίου 1999 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιανουάριο 1999
    για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τη
    συμφωνία που συνήψε η Κοινότητα με τη Σλοβενία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 173/1999, annettu 26 päivänä tammikuuta 1999,
    yhteisön Slovenian kanssa tekemässä sopimuksessa määrätyn järjestelmän
    mukaisesti tammikuussa 1999 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 173/1999 della Commissione del 26 gennaio 1999 che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1999 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 173/1999 van de Commissie van 26 januari 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in januari
    1999 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomst met Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 173/1999 da Comissão de 26 de Janeiro de 1999 que
