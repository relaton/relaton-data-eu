  script: Latn
  content: Commission Regulation (EC) No 336/2003 of 21 February 2003 amending Regulation
    (EC) No 824/2000 establishing procedures for the taking-over of cereals by intervention
    agencies and laying down methods of analysis for determining the quality of cereals
  type: main
- language: fr
  script: Latn
