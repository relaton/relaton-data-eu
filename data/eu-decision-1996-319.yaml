    pharmazeutische Erzeugnisse aus Spanien (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/319/EF: Kommissionens beslutning af 20. december 1995 om afslag på
    Belgiens anmodning om anvendelse af beskyttelsesforanstaltninger med hensyn til
    medicinalvarer fra Spanien (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
