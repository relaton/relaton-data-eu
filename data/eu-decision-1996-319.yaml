  content: '96/319/EC: Commission Decision of 20 December 1995 refusing Belgium''s
    application for protective measures with regard to pharmaceutical products coming
    from Spain (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/319/CE: Décision de la Commission, du 20 décembre 1995, refusant
    l''autorisation demandée par la Belgique d''adopter des mesures de sauvegarde
    concernant des produits pharmaceutiques en provenance d''Espagne (Les textes en
    langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/319/EG: Entscheidung der Kommission vom 20. Dezember 1995 zur Abweisung
