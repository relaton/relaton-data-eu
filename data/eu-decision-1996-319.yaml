    peräisin olevia farmaseuttisia tuotteita kohtaan (Ainoastaan ranskan- ja hollanninkieliset
    tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '96/319/CE: Decisione della Commissione, del 20 dicembre 1995, che rifiuta
