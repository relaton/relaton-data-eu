title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1639/1999 of 26 July 1999 fixing the maximum
    compensatory aid resulting from the rates for the conversion of the euro into
    national currency units and the exchange rates applicable on 1 July 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1639/1999 de la Commission, du 26 juillet 1999, fixant
    le montant maximal de l'aide compensatoire résultant des taux de conversion de
    l'euro en unité monétaire nationale ou des taux de change applicables le 1er
    juillet 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1639/1999 der Kommission vom 26. Juli 1999 zur Festsetzung
    des Höchstbetrags der Ausgleichsbeihilfe infolge der Umrechnungskurse des Euro
    in nationale Währungseinheiten oder der am 1. Juli 1999 geltenden Wechselkurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1639/1999 af 26. juli 1999 om fastsættelse
    af maksimumsbeløbet for den udligningsstøtte, der ydes som følge af kurserne
    for euroens omregning til nationale valutaenheder og de vekselkurser, der var
    gældende pr. 1. juli 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1639/1999 της Επιτροπής,
    της 26ης Ιουλίου 1999, με τον οποίο καθορίζεται
    το ανώτατο ποσό της αντισταθμιστικής ενίσχυσης
    που προκύπτει από τον συντελεστή μετατροπής
    του ευρώ σε μονάδες εθνικού νομίσματος ή τις
    ισοτιμίες που εφαρμόζονται την 1η Ιουλίου 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1639/1999, annettu 26 päivänä heinäkuuta
    1999, euron muuntokursseista kansalliseksi rahayksiköksi tai 1 päivästä heinäkuuta
    1999 alkaen sovellettavista valuuttakursseista johtuvien tasaustukien enimmäismäärän
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1639/1999 della Commissione, del 26 luglio 1999, che
    stabilisce il massimale dell'aiuto compensativo relativo ai tassi di conversione
    dell'euro in unità monetaria nazionale o ai tassi di cambio applicabili il 1°
    luglio 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1639/1999 van de Commissie van 26 juli 1999 tot vaststelling
    van het maximumbedrag van de compenserende steun die voortvloeit uit de koersen
    voor de omrekening van de euro in een nationale munteenheid of uit de op 1 juli
    1999 geldende wisselkoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1639/1999 da Comissão, de 26 de Julho de 1999, que
    fixa o montante máximo da ajuda compensatória resultante das taxas de conversão
    do euro em unidade monetária nacional ou das taxas de câmbio aplicáveis em
    1 de Julho de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1639/1999 de la Comisión, de 26 de julio de 1999,
    por el que se fija el importe máximo de la ayuda compensatoria resultante de
    los tipos de conversión del euro en unidad monetaria nacional o de los tipos
    de cambio aplicables el 1 de julio de 1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1639/1999 av den 26 juli 1999 om fastställande
