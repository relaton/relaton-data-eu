title:
- language: en
  script: Latn
  content: '99/560/EC: Commission Decision of 10 August 1999 amending for the second
    time Commission Decision 1999/212/EC on certain measures to prevent the transmission
    of foot-and-mouth disease virus from Algeria, Morocco and Tunisia to the territory
    of the European Community (notified under document number C(1999) 2623)'
  type: main
- language: fr
  script: Latn
  content: '99/560/CE: Décision de la Commission, du 10 août 1999, modifiant pour
    la seconde fois la décision 1999/212/CE concernant certaines mesures destinées
    à prévenir l''introduction, depuis l''Algérie, le Maroc et la Tunisie, du virus
    de la fièvre aphteuse sur le territoire de la Communauté [notifiée sous le
    numéro C(1999) 2623]'
  type: main
