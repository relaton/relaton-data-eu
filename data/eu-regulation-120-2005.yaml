title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 120/2005 of 26 January 2005 determining the
    extent to which the applications for import licences submitted in January 2005
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 120/2005 de la Commission du 26 janvier 2005 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2005 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 2535/2001 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 120/2005 der Kommission vom 26. Januar 2005 zur Festlegung
    des Umfangs, in dem den im Januar 2005 gestellten Anträgen auf Erteilung von
    Lizenzen für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung
    (EG) Nr. 2535/2001 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 120/2005 ze dne 26. ledna 2005, kterým se
    stanoví, do jaké míry lze přijímat žádosti o dovozní licence podané v
    ledna 2005 pro některé mléčné výrobky v rámci některých kvót otevřených
    nařízením (ES) č. 2535/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 120/2005 af 26. januar 2005 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i januar 2005 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 2535/2001, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 120/2005 της Επιτροπής,
    της 26ης Ιανουαρίου 2005, για καθορισμό του κατά
    πόσον μπορούν να γίνουν δεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υπεβλήθησαν
    τον Ιανουαρίου του 2005 για ορισμένα γαλακτοκομικά
    προϊόντα στο πλαίσιο ορισμένων δασμολογικών
