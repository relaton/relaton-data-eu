    voor bepaalde zuivelproducten zijn ingediend, kunnen worden geaccepteerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 120/2005 z dnia 26 stycznia 2005 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w styczniu 2005 r.
    o pozwolenia na przywóz dla niektórych przetworów mlecznych w ramach niektórych
    kontyngentów taryfowych otwartych rozporządzeniem (WE) nr 2535/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 120/2005 da Comissão, de 26 de Janeiro de 2005,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Janeiro de 2005 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 2535/2001
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 120/2005 z 26. januára 2005, ustanovujúce
    podmienky, za ktorých je možné prijať žiadosti o dovozné certifikáty, predložené
    v januári 2005, pre niektoré mliečne výrobky v rámci niektorých tarifných
    kvót otvorených nariadením (ES) č. 2535/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 120/2005 z dne 26. januarja 2005 o določitvi
