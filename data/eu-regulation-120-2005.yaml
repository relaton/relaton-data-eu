    tammikuuta 2005 jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 120/2005/EK rendelete (2005. január 26.) az egyes tejtermékekre
