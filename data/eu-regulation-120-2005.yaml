    nell'ambito di taluni contingenti tariffari aperti dal regolamento (CE) n. 2535/2001
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 120/2005 (2005. gada 26. janvāris), ar ko nosaka
