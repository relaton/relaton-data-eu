title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 513/2013 of 4 June 2013 imposing a provisional
    anti-dumping duty on imports of crystalline silicon photovoltaic modules and key
    components (i.e. cells and wafers) originating in or consigned from the People’s
    Republic of China and amending Regulation (EU) No 182/2013 making these imports
    originating in or consigned from the People’s Republic of China subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 513/2013 de la Commission du 4 juin 2013 instituant
    un droit antidumping provisoire sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules et wafers) originaires
    ou en provenance de la République populaire de Chine et modifiant le règlement
    (UE) n ° 182/2013 soumettant à enregistrement ces importations originaires ou
    en provenance de la République populaire de Chine
  type: main
