title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 663/79 of 4 April 1979 re-establishing the
    levying of customs duties on other goat and kid skin leather, other, falling within
    subheading 41.04 B II and originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 663/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, non dénommées, de la sous-position 41.04 B II du tarif douanier
    commun, originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 663/79 der Kommission vom 4. April 1979 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder, der Tarifstelle 41.04
    B II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3156/78 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 663/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for andet læder af gede- og gedekidskind, andre
    varer, under underposition 41.04 B II, som har oprindelse i Indien og omfattes
    af de toldpræferencer, som e fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 663/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli caprine, non nominate,
    della sottovoce doganale 41.04 B II, originarie dell' India beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 663/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander geiteleder,
    overige, van post 41.04 B II, van oorsprong uit India, ten behoeve waarvan bij
    Verordening (EEG) nr. 3156/78 van de Raad, algemene tariefpreferenties werden
    geopend
  type: main
