title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2835/91 of 23 September 1991 amending a definitive
    anti-dumping duty following a partial review of anti-dumping measures concerning
    imports of urea originating in Venezuela and terminating the review of anti-dumping
    measures concerning imports of urea originating in Trinidad and Tobago
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2835/91 DU CONSEIL du 23 septembre 1991 amendant un
    droit antidumping définitif dans le cadre de la procédure de réexamen partiel
    concernant les importations d'' urée originaires du Venezuela et portant clôture
    de la procédure de réexamen concernant les importations d'' urée originaires
    de Trinité et Tobago #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2835/91 DES RATES vom 23. September 1991 zur Änderung
    eines endgültigen Antidumpingzolls im Rahmen der teilweisen Überprüfung betreffend
    die Einfuhren von Harnstoff mit Ursprung in Venezuela und zur Einstellung der
    Überprüfung gegenüber den Einfuhren von Harnstoff mit Ursprung in Trinidad
    und Tobago #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2835/91 af 23. september 1991 om ændring
    af en endelig antidumpingtold i forbindelse med delvis fornyet undersøgelse af
    importen af urinstof med oprindelse i Venezuela og om afslutning af den fornyede
    undersøgelse vedrørende importen af urinstof med oprindelse i Trinidad og Tobago
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2835/91 του Συμβουλίου
    της 23ης Σεπτεμβρίου 1991 για την τροποποίηση
    οριστικού δασμού αντιντάμπινγκ στο πλαίσιο
    της διαδικασίας μερικής επανεξέτασης σχετικά
    με τις εισαγωγές ουρίας, καταγωγής Βενεζουέλας
    και για την περάτωση της διαδικασίας επανεξέτασης
    σχετικά με τις εισαγωγές ουρίας, καταγωγής
    Τρινιδάδ και Τομπάγκο
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2835/91 DEL CONSIGLIO del 23 settembre 1991 che modifica
