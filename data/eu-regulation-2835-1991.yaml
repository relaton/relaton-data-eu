    relativa alle importazioni di urea originaria del Venezuela e che chiude la procedura
    di riesame relativa alle importazioni di urea originaria di Trinidad e Tobago
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2835/91 VAN DE RAAD van 23 september 1991 houdende
    wijziging van een definitief anti-dumpingrecht in het kader van de procedure betreffende
    een gedeeltelijk nieuw onderzoek betreffende de invoer van ureum van oorsprong
    uit Venezuela en houdende beëindiging van de procedure van een nieuw onderzoek
    betreffende de invoer van ureum van oorsprong uit Trinidad en Tobago #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2835/91 DO CONSELHO de 23 de Setembro de 1991 que
