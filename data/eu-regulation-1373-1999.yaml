  content: Commission Regulation (EC) No 1373/1999 of 25 June 1999 amending Regulation
    (EC) No 2848/98 in the raw tobacco sector and fixing the guarantee threshold quantities
    which may be transferred to another group of varieties for the 1999 harvest
  type: main
- language: fr
  script: Latn
