---
id: EURegulation14282003
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1428/2003 of 11 August 2003 supplementing
    the Annex to Regulation (EC) No 2400/96 on the entry of certain names in the Register
    of protected designations of origin and protected geographical indications provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs "ΦΑΣΟΛΙΑ
    ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ (Fasolia Gigantes —
    Elefantes Kastorias)"
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1428/2003 de la Commission du 11 août 2003 complétant
    l'annexe du règlement (CE) n° 2400/96 relatif à l'inscription de certaines
    dénominations dans le registre des appellations d'origine protégées et des
    indications géographiques protégées prévu au règlement (CEE) n° 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires "ΦΑΣΟΛΙΑ
    ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ" (Fasolia Gigantes
    — Elefantes Kastorias)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1428/2003 der Kommission vom 11. August 2003 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 zur Eintragung bestimmter Bezeichnungen
    in das Verzeichnis der geschützten Ursprungsbezeichnungen und der geschützten
    geografischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß Verordnung
    (EWG) Nr. 2081/92 des Rates zum Schutz von geografischen Angaben und Ursprungsbezeichnungen
    für Agrarerzeugnisse und Lebensmittel "FAΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ
    ΚΑΣΤΟΡΙΑΣ" (Fasolia Gigantes — Elefantes Kastorias)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1428/2003 на Комисията от 11
    август 2003 година относно допълнение на приложението
    към Регламент (ЕО) № 2400/96 за вписването на някои
    означения в „Регистър на защитените наименования
    за произход и защитените географски указания“,
    предвиден в Регламент (ЕИО) № 2081/92 на Съвета
    за защита на географските указания и наименованията
    за произход на селскостопанските и хранителни
    продукти „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ
    (Fasolia Gigantes — Elefantes Kastorias)“
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1428/2003 ze dne 11. srpna 2003, kterým se
    doplňuje příloha nařízení (ES) č. 2400/96 o zápisu určitých názvů
    do Rejstříku chráněných označení původu a chráněných zeměpisných
    označení podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných označení
    a označení původu zemědělských produktů a potravin „ФΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ
    – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤОΡΙΑΣ (Fasolia Gigantes – Elefantes Kastorias)“
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1428/2003 af 11. august 2003 om tilføjelse
    til bilaget til forordning (EF) nr. 2400/96 om optagelse af visse betegnelser
    i det register over beskyttede oprindelsesbetegnelser og beskyttede geografiske
    betegnelser, der er fastsat i Rådets forordning (EØF) nr. 2081/92 om beskyttelse
    af geografiske betegnelser og oprindelsesbetegnelser for landbrugsprodukter og
    levnedsmidler "ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ"
    ("Fasolia kæmpe-/elefantbønner fra Kastorias")
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1428/2003 της Επιτροπής,
    της 11ης Αυγούστου 2003, σχετικά με τη συμπλήρωση
    του παραρτήματος του κανονισμού (ΕΚ) αριθ. 2400/96
    για την εγγραφή ορισμένων ονομασιών στο μητρώο
    προστατευόμενων ονομασιών προέλευσης και
    προστατευόμενων γεωγραφικών ενδείξεων που
    προβλέπεται στον κανονισμό (EΟΚ) αριθ. 2081/92 του
    Συμβουλίου για την προστασία των γεωγραφικών
    ενδείξεων και των ονομασιών προέλευσης των
    γεωργικών προϊόντων και των τροφίμων "ΦΑΣΟΛΙΑ
    ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ"
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1428/2003, 11. august 2003, millega täiendatakse
    määruse (EÜ) nr 2400/96 (teatavate nimede kandmise kohta kaitstud päritolunimetuste
    ja geograafiliste tähiste registrisse, mis on ette nähtud nõukogu määrusega
    (EMÜ) nr 2081/92 põllumajandustoodete ja toiduainete geograafiliste tähiste
    ning päritolunimetuste kaitse kohta) lisa (“ФΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ
    – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤОΡΙΑΣ (Fasolia Gigantes – Elefantes Kastorias”))
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1428/2003, annettu 11 päivänä elokuuta 2003,
    tiettyjen nimitysten kirjaamisesta maataloustuotteiden ja elintarvikkeiden maantieteellisten
    merkintöjen ja alkuperänimitysten suojasta annetussa neuvoston asetuksessa (ETY)
    N:o 2081/92 säädettyyn "Suojattujen alkuperänimitysten ja suojattujen maantieteellisten
    merkintöjen rekisteriin" annetun asetuksen (EY) N:o 2400/96 liitteen täydentämisestä
    — "ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ
    (Fasolia Gigantes — Elefantes Kastorias)"
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1428/2003 od 11. kolovoza 2003. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu nekih naziva u Registar zaštićenih oznaka izvornosti
    i zaštićenih oznaka zemljopisnog podrijetla, kako je predviđeno Uredbom Vijeća
    (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i oznaka izvornosti
    za poljoprivredne i prehrambene proizvode (ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ –
    ΕΛΕΦΑΝΕΣ ΚΑΣΤΟΡΙΑΣ (Fasolia Gigantes – Elefantes Kastorias))
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1428/2003/EK rendelete (2003. augusztus 11.) egyes elnevezéseknek
    a mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben előírt „Oltalom alatt
    álló eredetmegjelölések és földrajzi jelzések nyilvántartása” elnevezésű
    nyilvántartásba való bejegyzéséről szóló 2400/96/EK rendelet mellékletének
    kiegészítéséről („ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ
    ΚΑΣΤΟΡΙΑΣ Fasolia Gigantes – Elefantes Kastorias)”
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1428/2003 della Commissione, dell'11 agosto 2003, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari "ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ —
    ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ" ("Fasolia Gigantes — Elefantes Kastorias")
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1428/2003 (2003. gada 11. augusts), ar kuru papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu ierakstīšanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas produktu ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu
    aizsardzību “ΦΑΣΟΛΙΑ ΓΙΓΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ
    (Fasolia Gigantes – Elefantes Kastorias)”
  type: main
- language: lt
  script: Latn
  content: 2003 m. rugpjūčio 11 d. Komisijos reglamentas (EB) Nr. 1428/2003, papildantis
    Reglamento (EB) Nr. 2400/96 priedą dėl tam tikrų pavadinimų įtraukimo į
    Saugomų kilmės vietos nuorodų ir saugomų geografinių nuorodų registrą,
    numatytą Tarybos Reglamente (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir
    maisto produktų geografinių nuorodų ir kilmės vietos nuorodų apsaugos, priedo
    papildymo įrašu „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ
    (Fasolia Gigantes – Elefantes Kastorias)“
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1428/2003 tal-11 ta’ Awissu 2003
    li jżid ma’ l-Anness għar-Regolament (KE) Nru 2400/96 fuq id-dħul ta’ ċerti
    ismijiet fir-Reġistru ta’ denominazzjonijiet protetti ta’ oriġini u indikazzjonijiet
    ġeografiċi protetti previsti fir-Regolament tal-Kunsill (KEE) Nru 2081/92 dwar
    il-protezzjoni ta’ l-indikazzjonijiet ġeografiċi u d-denominazzjonijiet ta’
    l-oriġini għal prodotti agrikoli u oġġetti ta’ l-ikel ‘ΦΑΣΟΛΙΑ
    ΓΙΓΑΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ“ (Fasolia Gigantes
    - Elefantes Kastorias)û”
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1428/2003 van de Commissie van 11 augustus 2003 tot
    aanvulling van de bĳlage bĳ Verordening (EG) nr. 2400/96 betreffende de inschrĳving
    van bepaalde benamingen in het "Register van beschermde oorsprongsbenamingen en
    beschermde geografische aanduidingen" bedoeld in Verordening (EEG) nr. 2081/92
    van de Raad inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen
    van landbouwproducten en levensmiddelen "ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ
    ΚΑΣΤΟΡΙΑΣ" ("Fasolia Gigantes — Elefantes Kastorias")
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1428/2003 z dnia 11 sierpnia 2003 r. uzupełniające
    Załącznik do rozporządzenia (WE) nr 2400/96 w sprawie wpisu niektórych nazw
    do „Rejestru chronionych nazw pochodzenia oraz chronionych oznaczeń geograficznych”
    przewidzianego w rozporządzeniu Rady (EWG) nr 2081/92 w sprawie ochrony oznaczeń
    geograficznych i nazw pochodzenia produktów rolnych i środków spożywczych
    „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ (Fasolia
    Gigantes — Elefantes Kastorias)”
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1428/2003 da Comissão, de 11 de Agosto de 2003,
    que completa o anexo do Regulamento (CE) n.° 2400/96 relativo à inscrição
    de determinadas denominações no registo das denominações de origem protegidas
    e das indicações geográficas protegidas previsto no Regulamento (CEE) n.°
    2081/92 do Conselho relativo à protecção das indicações geográficas e denominações
    de origem dos produtos agrícolas e dos géneros alimentícios "ΦΑΣΟΛΙΑ
    ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ" ("Fasolia Gigantes
    — Elefantes Kastorias")
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1428/2003 al Comisiei din 11 august 2003 de completare
    a anexei la Regulamentul (CE) nr. 2400/96 privind înscrierea anumitor denumiri
    în „Registrul denumirilor de origine protejate și al indicațiilor geografice
    protejate” prevăzut de Regulamentul (CEE) nr. 2081/92 al Consiliului privind
    protecția indicațiilor geografice și a denumirilor de origine ale produselor
    agricole și alimentare „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ
    ΚΑΣΤΟΡΙΑΣ” (Fasolia Gigantes – Elefantes Kastorias)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1428/2003 z 11. augusta 2003, ktorým sa dopĺňa
    príloha k nariadeniu (ES) č. 2400/96 o zápise určitých názvov do Registra
    chránených označení pôvodu a chránených zemepisných označení, stanoveného
    v nariadení Rady (EHS) č. 2081/92 o ochrane zemepisných označení a označení
    pôvodu poľnohospodárskych výrobkov a potravín „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ
    ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ (Fasolia Gigantes – Elefantes Kastorias)“
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1428/2003 z dne 11. avgusta 2003 o dopolnitvi
    Priloge k Uredbi (ES) št. 2400/96 o vnosu nekaterih imen v Register zaščitenih
    označb porekla in zaščitenih geografskih označb, določen v Uredbi Sveta (EGS)
    št. 2081/92 o zaščiti geografskih označb in označb porekla za kmetijske proizvode
    in živila „ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ
    (Fasolia Gigantes – Elefantes Kastorias)“
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1428/2003 de la Comisión, de 11 de agosto de 2003,
    por el que se completa el anexo del Reglamento (CE) n° 2400/96, relativo a la
    inscripción de determinadas denominaciones en el Registro de denominaciones de
    origen protegidas y de indicaciones geográficas protegidas establecido en el
    Reglamento (CEE) n° 2081/92 del Consejo relativo a la protección de las indicaciones
    geográficas y de las denominaciones de origen de los productos agrícolas y alimenticios,
    con "ΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ — ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ"
    (Fasolia Gigantes — Elefantes Kastorias)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1428/2003 av den 11 augusti 2003 om komplettering
    av bilagan till förordning (EG) nr 2400/96 om upptagandet av vissa namn i "Register
    över skyddade ursprungsbeteckningar och skyddade geografiska beteckningar" som
    föreskrivs i rådets förordning (EEG) nr 2081/92 om skydd för geografiska och
    ursprungsbeteckningar för jordbruksprodukter och livsmedel "ΦΑΣΟΛΙΑ ΓΙΓΑΝΤΕΣ
    – ΕΛΕΦΑΝΤΕΣ ΚΑΣΤΟΡΙΑΣ" (Fasolia Gigantes – Elefantes Kastorias)
