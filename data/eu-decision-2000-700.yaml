title:
- language: en
  script: Latn
  content: '2000/700/EC: Commission Decision of 30 October 2000 authorising Member
    States to provide for derogations from certain provisions of Council Directive
    2000/29/EC in respect of plants of strawberry (Fragaria L.), intended for planting,
    other than seeds, originating in the Republic of Chile (notified under document
    number C(2000) 3141)'
  type: main
- language: fr
  script: Latn
  content: '2000/700/CE: Décision de la Commission du 30 octobre 2000 autorisant
    les États membres à prévoir des dérogations à certaines dispositions de la
    directive 2000/29/CE du Conseil pour les fraisiers (Fragaria L.) destinés à
    la plantation, à l''exception des semences, originaires de la République du
    Chili [notifiée sous le numéro C(2000) 3141]'
  type: main
- language: de
  script: Latn
  content: '2000/700/EG: Entscheidung der Kommission vom 30. Oktober 2000 zur Ermächtigung
    der Mitgliedstaaten, für Erdbeerpflanzen (Fragaria L.), zum Anpflanzen bestimmt,
    außer Samen, mit Ursprung in der Republik Chile, Ausnahmen von bestimmten Vorschriften
    der Richtlinie 2000/29/EG des Rates zuzulassen (Bekannt gegeben unter Aktenzeichen
    K(2000) 3141)'
  type: main
- language: da
  script: Latn
  content: '2000/700/EF: Kommissionens beslutning af 30. oktober 2000 om bemyndigelse
    af medlemsstaterne til at indrømme undtagelser fra visse bestemmelser i Rådets
    direktiv 2000/29/EF for jordbærplanter (Fragaria L.) til udplantning, dog ikke
    frø, med oprindelse i Republikken Chile (meddelt under nummer K(2000) 3141)'
  type: main
- language: el
  script: Grek
  content: '2000/700/ΕΚ: Απόφαση της Επιτροπής, της 30ής
    Οκτωβρίου 2000, που επιτρέπει στα κράτη μέλη
    να προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 2000/29/ΕΚ του Συμβουλίου σχετικά
    με τα φυτά χαμαικέρασου (Fragaria L.) που προορίζονται
    για φύτευση, πλην σπόρων προς σπορά, καταγόμενα
    από τη Δημοκρατία της Χιλής [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 3141]'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 30 päivänä lokakuuta 2000, luvan antamisesta
    jäsenvaltioille säätää poikkeuksia tiettyihin Chilen tasavallasta peräisin
    olevia istutettaviksi tarkoitettuja mansikoita (Fragaria L.), siemeniä lukuun
    ottamatta, koskeviin neuvoston direktiivin 2000/29/EY säännöksiin (tiedoksiannettu
    numerolla K(2000) 3141)
  type: main
- language: it
  script: Latn
  content: '2000/700/CE: Decisione della Commissione, del 30 ottobre 2000, che autorizza
    gli Stati membri a prevedere deroghe a determinate disposizioni della direttiva
    2000/29/CE del Consiglio riguardo alle piantine di fragole (Fragaria L.) destinate
    alla piantagione, tranne le sementi, originarie della Repubblica del Cile [notificata
    con il numero C(2000) 3141]'
  type: main
- language: nl
  script: Latn
  content: '2000/700/EG: Beschikking van de Commissie van 30 oktober 2000 tot machtiging
