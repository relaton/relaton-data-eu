title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1994/80 of 22 July 1980 determining, for the
    1980/81 wine-growing year, the prices to be paid under the compulsory distillation
    of the by-products of wine-making and the maximum amount of the contribution from
    the Guarantee Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1994/80 du Conseil, du 22 juillet 1980, déterminant,
    pour la campagne viticole 1980/1981, les prix à payer au titre de la distillation
    obligatoire des sous-produits de la vinification et le montant maximal de la participation
    du Fonds européen d' orientation et de garantie agricole, section "garantie"
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1994/80 des Rates vom 22. Juli 1980 zur Festlegung
    der im Rahmen der obligatorischen Destillation der Nebenerzeugnisse der Weinbereitung
    zu zahlenden Preise sowie des Höchstbetrags der Beteiligung des Europäischen
    Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung Garantie, für
    das Weinwirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1994/80 af 22. juli 1980 om fastsættelse
    for vinproduktionsåret 1980/81 af de priser, der skal betales i forbindelse med
    den obligatoriske destillation af biprodukter fra vinfremstilling, og af det maksimale
    beløb, hvormed Den europæiske udviklings- og garantifond for Landbruget, garantisektionen,
    deltager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1994/80 τού Συμβουλίου
    τής 22ας Ιουλίου 1980 περί καθορισμού, γιά τήν
    αμπελουργική περίοδο 1980/81, τών τιμών πού πρέπει
    νά πληρώνονται στό πλαίσιο τής υποχρεωτικής
    αποστάξεως τών υποπροϊόντων τής οινοποιήσεως
    καί τό ανώτατο ποσό συμμετοχής τού Ευρωπαϊκού
    Γεωργικού Ταμείου Προσανατολισμού καί Εγγυήσεων,
    τμήμα «Εγγυήσεων»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1994/80 del Consiglio, del 22 luglio 1980, che determina,
    per la campagna viticola 1980/1981, i prezzi da pagare a titolo della distillazione
    obbligatoria dei sottoprodotti della vinificazione e l' importo massimo della
    partecipazione del Fondo europeo agricolo di orientamento e di garanzia, sezione
    garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1994/80 van de Raad van 22 juli 1980 houdende vaststelling,
    voor het wijnoogstjaar 1980/1981, van de uit hoofde van de verplichte distillatie
    van de bijprodukten van de wijnbereiding te betalen prijzen en van het maximumbedrag
    van de bijdrage van het Europees Oriëntatie- en Garantiefonds voor de Landbouw,
    afdeling Garantie
