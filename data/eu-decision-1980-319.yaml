id: EUDecision1980319
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/319/EEC: Commission Decision of 28 February 1980 authorizing the French
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain or china (including
    biscuit porcelain and parian), falling within heading No 69.11 of the Common Customs
    Tariff, originating in the People''s Republic of China and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/319/CEE: Décision de la Commission, du 28 février 1980, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires de la République populaire de Chine et
    mis en libre pratique dans les autres États membres (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/319/EWG: Entscheidung der Kommission vom 28. Februar 1980, mit der
    die Französische Republik ermächtigt wird, aus der Volksrepublik China stammendes
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts-
    und Toilettengegenstände, aus Porzellan, der Tarifnummer 69.11 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/319/EØF: Kommissionens beslutning af 28. februar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler af porcelæn, som henhører under pos. 69.11
    i den fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik og frit
    kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/319/CEE: Decisione della Commissione, del 28 febbraio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il vasellame e
    gli oggetti di uso domestico o da toletta, di porcellana, della voce 69.11 della
    tariffa doganale comune, originari della Repubblica poplare cinese e messi in
    libera pratica negli altri Stati membri (Il testo in lingua francese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/319/EEG: Beschikking van de Commissie van 28 februari 1980 waarbij
    de Franse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein, van post 69.11 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
