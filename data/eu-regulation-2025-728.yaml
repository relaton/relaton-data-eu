  script: Latn
  content: Commission Implementing Regulation (EU) 2025/728 of 8 April 2025 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, the United Kingdom, and the United States in the lists of third countries,
    territories or zones thereof authorised for the entry into the Union of consignments
    of poultry and germinal products of poultry, and of fresh meat of poultry and
    game birds
  type: main
- language: fr
  script: Latn
