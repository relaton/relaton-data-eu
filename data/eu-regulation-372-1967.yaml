  script: Latn
  content: Règlement n° 372/67/CEE du Conseil, du 25 juillet 1967, portant limitation
    du montant de l'imposition applicable, en vertu de l'article 10 du règlement
    n° 160/66/CEE, à l'importation des préparations dites "fondues"
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 372/67/EWG des Rates vom 25. Juli 1967 zur Begrenzung der
    Höhe der gemäß Artikel 10 der Verordnung Nr. 160/66/EWG anwendbaren Abgabe
    bei der Einfuhr von "Käsefondue" genannten Zubereitungen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 372/67/CEE del Consiglio, del 25 luglio 1967, che limita
    l'importo dell'imposizione applicabile, ai sensi dell'articolo 10 del regolamento
    n. 160/66/ CEE, all'importazione delle preparazioni chiamate «fondute»
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 372/67/EEG van de Raad van 25 juli 1967 houdende beperking
    van het bedrag van de belasting welke krachtens artikel 10 van Verordening Nr.
    160/66/EEG wordt geheven bij de invoer van preparaten, "fondues" genaamd
  type: main
