title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 décembre 1971, autorisant le Royaume
    de Belgique et le Grand-Duché de Luxembourg à exclure du traitement communautaire
    les tomates et les raisins de table, des positions 07.01 M I et 08.04 A I du Tarif
    douanier commun, originaires de certains pays tiers et mis en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/69/EWG: Entscheidung der Kommission vom 24. Dezember 1971, mit der
    das Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus
    gewissen dritten Ländern stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Tomaten und Tafeltrauben der Tarifnummern 07.01 M I und 08.04
    A I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/69/CEE: Decisione della Commissione, del 24 dicembre 1971, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento
    comunitario i pomodori e le uve da tavola delle voci nn. 07.01 M I e 08.04 A I
    della tariffa doganale comune, originari di taluni paesi terzi e messi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/69/EEG: Beschikking van de Commissie van 24 december 1971 waarbij het
    Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd tomaten en
    tafeldruiven, van de posten 07.01 M I en 08.04 A I van het gemeenschappelijk douanetarief,
    van oorsprong uit bepaalde derde landen en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
