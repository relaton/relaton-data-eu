title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 12 October 2011 amending Decision 2003/467/EC
    as regards the declaration of Latvia as officially tuberculosis-free Member State
    and the declaration of certain administrative regions in Portugal as officially
    enzootic-bovine-leukosis-free regions (notified under document C(2011) 7186)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution de la Commission du 12 octobre 2011 modifiant la
    décision 2003/467/CE en ce qui concerne la déclaration selon laquelle la Lettonie
    est un État membre officiellement indemne de tuberculose et la déclaration selon
    laquelle certaines régions administratives du Portugal sont des régions officiellement
    indemnes de leucose bovine enzootique [notifiée sous le numéro C(2011) 7186]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss der Kommission vom 12. Oktober 2011 zur Änderung
    der Entscheidung 2003/467/EG hinsichtlich der Anerkennung von Lettland als amtlich
    anerkannt tuberkulosefrei und bestimmter Verwaltungsregionen in Portugal als amtlich
    anerkannt frei von der enzootischen Rinderleukose (Bekannt gegeben unter Aktenzeichen
    K(2011) 7186)
  type: main
- language: bg
  script: Cyrl
  content: '2011/675/ЕС: Решение за изпълнение на Комисията
    от 12 октомври 2011 година за изменение на Решение
    2003/467/ЕО по отношение на обявяването на Латвия
    за официално свободна от туберкулоза държава-членка
    и обявяването на някои административни региони
    в Португалия за региони, официално свободни
    от ензоотична левкоза по говедата (нотифицирано
    под номер C(2011) 7186)'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise ze dne 12. října 2011 , kterým se mění
    rozhodnutí 2003/467/ES, pokud jde o prohlášení Lotyšska za členský stát
    úředně prostý tuberkulózy skotu a o prohlášení některých správních
    oblastí v Portugalsku za oblasti úředně prosté enzootické leukózy skotu
    (oznámeno pod číslem K(2011) 7186)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse af 12. oktober 2011 om ændring
    af beslutning 2003/467/EF for så vidt angår erklæringen om, at Letland er officielt
    frit for tuberkulose, og erklæringen om, at visse administrative regioner i Portugal
    er officielt frie for enzootisk kvægleukose (meddelt under nummer K(2011) 7186)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση της Επιτροπής, της
    12ης Οκτωβρίου 2011 , για την τροποποίηση της απόφασης
    2003/467/ΕΚ όσον αφορά τη δήλωση της Λετονίας ως
    κράτους μέλους επισήμως απαλλαγμένου από τη
    φυματίωση και τη δήλωση ορισμένων διοικητικών
    περιφερειών της Πορτογαλίας ως περιφερειών
    επισήμως απαλλαγμένων από την ενζωοτική λεύκωση
    των βοοειδών [κοινοποιηθείσα υπό τον αριθμό
    Ε(2011) 7186]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus, 12. oktoober 2011 , millega muudetakse otsust
