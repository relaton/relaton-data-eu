    hija Stat Membru uffiċjalment ħieles mit-tuberkulożi u rigward id-dikjarazzjoni
    li ċerti reġjuni amministrattivi fil-Portugall huma uffiċjalment ħielsa mil-lewkożi
    enżootika bovina (notifikata bid-dokument numru C(2011) 7186)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Commissie van 12 oktober 2011 tot wijziging van
    Beschikking 2003/467/EG wat betreft de verklaring dat Letland officieel vrij van
    tuberculose is en dat bepaalde administratieve regio's in Portugal officieel vrij
    van enzoötische boviene leukose zijn (Kennisgeving geschied onder nummer C(2011)
    7186)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji z dnia 12 października 2011 r. zmieniająca
    decyzję 2003/467/WE w odniesieniu do uznania Łotwy za państwo członkowskie
    oficjalnie wolne od gruźlicy oraz uznania niektórych regionów administracyjnych
    w Portugalii za oficjalnie wolne od enzootycznej białaczki bydła (notyfikowana
    jako dokument nr C(2011) 7186)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução da Comissão, de 12 de Outubro de 2011 , que altera
    a Decisão 2003/467/CE no que se refere à declaração da Letónia como Estado-Membro
    oficialmente indemne de tuberculose e a declaração de determinadas regiões
    administrativas em Portugal como regiões oficialmente indemnes de leucose bovina
    enzoótica [notificada com o número C(2011) 7186]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Comisiei din 12 octombrie 2011 de modificare
    a Deciziei 2003/467/CE în ceea ce privește declararea Letoniei ca stat membru
    oficial indemn de tuberculoză și declararea anumitor regiuni administrative
    din Portugalia ca regiuni oficial indemne de leucoză enzootică bovină [notificată
    cu numărul C(2011) 7186]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie z 12. októbra 2011 , ktorým sa mení
    a dopĺňa rozhodnutie 2003/467/ES, pokiaľ ide o úradné vyhlásenie Lotyšska
    za členský štát bez výskytu tuberkulózy a vyhlásenie určitých správnych
    oblastí v Portugalsku za oblasti bez výskytu enzootickej leukózy hovädzieho
    dobytka [oznámené pod číslom K(2011) 7186]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije z dne 12. oktobra 2011 o spremembi Odločbe 2003/467/ES
    glede priznanja Latvije kot države članice, uradno proste tuberkuloze, in priznanja
    nekaterih portugalskih upravnih regij kot uradno prostih enzootske goveje levkoze
    (notificirano pod dokumentarno številko C(2011) 7186)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución de la Comisión, de 12 de octubre de 2011 , por
    la que se modifica la Decisión 2003/467/CE por lo que respecta a la declaración
    de Letonia como Estado miembro oficialmente indemne de tuberculosis y a la declaración
    de determinadas regiones administrativas de Portugal como regiones oficialmente
    indemnes de leucosis bovina enzoótica [notificada con el número C(2011) 7186]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut av den 12 oktober 2011 om ändring av
    beslut 2003/467/EG vad gäller fastställande av att Lettland är officiellt fri
    från tuberkulos och att vissa administrativa regioner i Portugal är officiellt
    fria från enzootisk bovin leukos [delgivet med nr K(2011) 7186]
