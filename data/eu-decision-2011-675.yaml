    slobodna od tuberkuloze i proglašavanja određenih upravnih regija Portugala
    regijama koje su službeno slobodne od enzootske goveđe leukoze (priopćena pod
    brojem dokumenta C(2011) 7186)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság végrehajtási határozata ( 2011. október 12. ) Lettország
    hivatalosan tuberkulózismentesnek nyilvánítása, valamint Portugália egyes
    közigazgatási régióinak hivatalosan a szarvasmarhák enzootikus leukózisától
    mentesnek nyilvánítása tekintetében a 2003/467/EK bizottsági határozat módosításáról
    (az értesítés a C(2011) 7186. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione della Commissione, del 12 ottobre 2011 , che modifica
    la decisione 2003/467/CE per quanto concerne la dichiarazione della Lettonia quale
    Stato membro ufficialmente indenne da tubercolosi e la dichiarazione di determinate
    regioni amministrative del Portogallo quali regioni ufficialmente indenni da leucosi
    bovina enzootica [notificata con il numero C(2011) 7186]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums ( 2011. gada 12. oktobris ), ar ko groza
    Lēmumu 2003/467/EK attiecībā uz Latvijas atzīšanu par oficiāli brīvu no
    tuberkulozes un noteiktu Portugāles administratīvo reģionu atzīšanu par oficiāli
    brīviem no govju enzootiskās leikozes (izziņots ar dokumenta numuru C(2011)
    7186)
  type: main
- language: lt
  script: Latn
  content: 2011 m. spalio 12 d. Komisijos įgyvendinimo sprendimas, kuriuo dėl Latvijos
    paskelbimo valstybe nare, kurioje oficialiai nenustatyta tuberkuliozės, ir dėl
    paskelbimo, kad tam tikruose Portugalijos administraciniuose regionuose oficialiai
    nenustatyta enzootinės galvijų leukozės, iš dalies keičiamas Sprendimas 2003/467/EB
    (pranešta dokumentu Nr. C(2011) 7186)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tat- 12 ta’ Ottubru
