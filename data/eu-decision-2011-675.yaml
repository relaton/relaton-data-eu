    julistamisesta tuberkuloosista virallisesti vapaaksi jäsenvaltioksi ja Portugalin
    tiettyjen hallinnollisten alueiden julistamisesta naudan tarttuvasta leukoosista
    virallisesti vapaiksi alueiksi (tiedoksiannettu numerolla K(2011) 7186)
  type: main
- language: hr
  script: Latn
  content: '2011/675/EU: Provedbena odluka Komisije od 12. listopada 2011. o izmjeni
