title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 535/77 of 15 March 1977 re-establishing
    the levying of the customs duties on asbestos thread falling within subheading
    68.13 B I, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 535/77 de la Commission, du 15 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux fils d'amiante,
    de la sous- position tarifaire 68.13 B I, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 535/77 der Kommission vom 15. März 1977 zur Wiedereinführung
    des Zollsatzes für Fäden aus Asbest der Tarifstelle 68.13 B I, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 535/77 af 15. marts 1977 om genindførelse
    af opkrævning af toldafgifter for garn af asbest under underposition 68.13 B
    I, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 535/77 della Commissione, del 15 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili ai fili di amianto della sottovoce
    doganale 68.13 B I, originari della Iugoslavia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 535/77 van de Commissie van 15 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    asbest, van post 68.13 B I, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
