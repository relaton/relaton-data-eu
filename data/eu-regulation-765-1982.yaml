  content: Council Regulation (EEC) No 765/82 of 31 March 1982 laying down for 1982
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 765/82 du Conseil, du 31 mars 1982, fixant, pour l'
    année 1982, certaines mesures de conservation et de gestion des ressources de
    pêche applicables aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 765/82 des Rates vom 31. März 1982 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter norwegischer Flagge für 1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 765/82 af 31. marts 1982 om fastsættelse
