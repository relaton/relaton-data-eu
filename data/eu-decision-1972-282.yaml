schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '72/282/ECSC: Commission Decision of 3 July 1972 pursuant to Article 88
    of the ECSC Treaty, establishing that the Italian Republic has failed to fulfil
    its obligations by not furnishing to the Commission certain information concerning
    the application of measures of aid to the iron and steel industry (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/282/CECA: Décision de la Commission, du 3 juillet 1972, au titre de
    l''article 88 du traité CECA constatant que la République italienne a manqué
    à ses obligations en s''abstenant de fournir à la Commission un certain nombre
    de renseignements relatifs à l''application de régimes d''aides à l''industrie
    sidérurgique (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '72/282/EGKS: Entscheidung der Kommission vom 3. Juli 1972 gemäß Artikel
    88 EGKSV, mit der festgestellt wird, daß die Italienische Republik gegen ihre
    Verpflichtungen verstoßen hat, indem sie der Kommission einige Auskünfte betreffend
    die Anwendung von Beihilferegelungen zugunsten der Eisen- und Stahlindustrie nicht
    erteilte (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/282/EKSF: Kommissionens beslutning af 3. juli 1972 i henhold til EKSF-traktatens
    artikel 88, hvorved det konstateres, at Den Italienske Republik har misligholdt
    sine forpligtelser, idet den har undladt at meddele Kommissionen visse oplysninger
    om anvendelse af støtteordninger i visse særlige tilfælde inden for jern- og
    stålindustrien (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '72/282/ΕΚΑΧ: Απόφαση της Επιτροπής, της 3ης
    Ιουλίου 1972, βάσει του άρθρου 88 της Συνθήκης
    ΕΚΑΧ με την οποία διαπιστώνεται ότι η Ιταλική
    Δημοκρατία δεν ανταποκρίθηκε στις υποχρεώσεις
    της παραλείποντας να παράσχει στην Επιτροπή
    ορισμένο αριθμό πληροφοριών σχετικά με την
    εφαρμογή των καθεστώτων ενίσχυσης της βιομηχανίας
    σιδήρου και χάλυβα (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '72/282/CECA: Decisione della Commissione, del 3 luglio 1972, ai sensi
    dell''articolo 88 del trattato CECA, con cui si constata che la Repubblica italiana
    è venuta meno ai suoi obblighi omettendo di fornire alla Commissione alcune informazioni
    riguardanti l''applicazione di regimi di aiuti a favore dell''industria siderurgica
    (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '72/282/EGKS: Beschikking van de Commissie van 3 juli 1972 krachtens artikel
    88 van het E.G.K.S.-Verdrag houdende vaststelling dat de Italiaanse Republiek
    niet aan haar verplichtingen heeft voldaan door na te laten de Commissie een aantal
    gegevens te verstrekken betreffende de toepassing van steunregelingen ten behoeve
    van de ijzer- en staalindustrie (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '72/282/CECA: Decisión de la Comisión, de 3 de julio de 1972, con arreglo
    al artículo 88 del Tratado de la CECA por la que se comprueba que la República
    Italiana ha incumplido sus obligaciones al abstenerse de proporcionar a la Comisión
    determinado número de informaciones relativas a la aplicación de regímenes
    de ayudas a la industria siderúrgica (El texto en lengua italiana es el único
    auténtico)'
  type: main
