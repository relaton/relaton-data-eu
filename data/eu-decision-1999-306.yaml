    the requirements of Council Directives 66/401/EEC or 69/208/EEC (notified under
    document number C(1999) 1011)'
  type: main
- language: fr
  script: Latn
  content: '1999/306/CE: Décision de la Commission, du 20 avril 1999, autorisant
