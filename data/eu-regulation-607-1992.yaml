title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 607/92 of 10 March 1992 specifying the extent
    to which applications lodged in February 1992 for import licences in respect of
    young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 607/92 de la Commission, du 10 mars 1992, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de février 1992 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 607/92 der Kommission vom 10. März 1992 über das
    Ausmaß, in dem den im Februar 1992 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 607/92 af 10. marts 1992 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i februar
    1992 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 607/92 της Επιτροπής
    της 10ης Μαρτίου 1992 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1992 για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 607/92 della Commissione, del 10 marzo 1992, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1992 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 607/92 van de Commissie van 10 maart 1992 tot bepaling
    van de mate waarin de in februari 1992 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 607/92 da Comissão, de 10 de Março de 1992, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Fevereiro de 1992 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 607/92 de la Comisión, de 10 de marzo de 1992, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de febrero de 1992 para los
    machos jóvenes de la especie bovina destinados al engorde
  type: main
