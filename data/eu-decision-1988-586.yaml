title:
- language: en
  script: Latn
  content: '88/586/EEC: Commission Decision of 16 November 1988 making an initial
    allocation to France of part of the resources to be charged to the 1989 budget
    year for the supply of food from intervention stocks to designated organizations
    for distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/586/CEE: Décision de la Commission du 16 novembre 1988 allouant à
    la France une première tranche des ressources imputables à l'' exercice 1989
    pour la fourniture de denrées alimentaires provenant des stocks d'' intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/586/EWG: Entscheidung der Kommission vom 16. November 1988 über die
    anfängliche Bewilligung eines Teils der im Haushaltsjahr 1989 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an bedürftige Personen in der Gemeinschaft zu verbuchenden Mittel
    für Frankreich'
  type: main
- language: da
  script: Latn
  content: '88/586/EØF: Kommissionens beslutning af 16. november 1988 om en første
    tildeling til Frankrig af en del af de midler, der skal opføres på 1989-budgettet
    for levering af levnedsmidler fra interventionslagre til nærmere bestemte organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/586/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Νοεμβρίου 1988 για τη χορήγηση στη Γαλλία μιας
    πρώτης μερίδας πόρων που καταλογίζονται στο
    οικονομικό έτος 1989 για την προμήθεια τροφίμων
    που προέρχονται από τα αποθέματα της παρεμβάσεως
    στους οργανισμούς που έχουν ορισθεί για να
    τα διανείμουν στους άπορους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/586/CEE: Decisione della Commissione del 16 novembre 1988 concernente
    un primo stanziamento alla Francia di parte delle risorse da imputare all'' anno
    di bilancio 1989 per la fornitura a talune organizzazioni di derrate alimentari
    provenienti dalle scorte d'' intervento e destinate ad essere distribuite agli
    indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/586/EEG: Beschikking van de Commissie van 16 november 1988 houdende
    een eerste toewijzing aan Frankrijk van een deel van voor het begrotingsjaar 1989
    te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan behoeftigen
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/586/CEE: Decisão da Comissão de 16 de Novembro de 1988 relativa à
    afectação à França de parte dos recursos a imputar ao exercício orçamental
    de 1989 para o fornecimento de alimentos provenientes das existências de intervenção
    às organizações designadas para distribuição às pessoas mais necessitadas
    na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/586/CEE: Decisión de la Comisión de 16 de noviembre de 1988 por la
    que se adjudica inicialmente a Francia parte de los recursos con cargo al presupuesto
    del ejercicio 1989 destinados al suministro de alimentos procedentes de las existencias
    de intervención a determinadas organizaciones para su distribución entre las
    personas más necesitadas de la Comunidad'
