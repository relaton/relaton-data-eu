id: EUDecision1962508
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République française, en application
    de l'article 226 CEE, à limiter les importations en provenance des autres États
    membres de diodes, triodes, etc., à cristal, y compris les transistors (position
    du tarif douanier français 85.21 C), parties et pièces détachées de diodes,
    triodes, etc., (position du tarif douanier français 85.21 E I), sous-ensembles
    transistorisés (position du tarif douanier français Ex 85.15 C II A)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, durch welche die Republik Frankreich auf Grund
    von Artikel 226 EWG ermächtigt wird, die Einfuhr von Kristalldioden, Kristalltrioden
    usw. einschließlich Transistoren (Tarifnr. 85.21 C des französischen Zolltarifs),
    Teile von Kristalldioden, Kristalltrioden usw. (Tarifnr. 85.21 E I des französischen
    Zolltarifs) und mit Transistoren bestückte Bausätze (Tarifnr. ex 85.15 C II
    a des französischen Zolltarifs) aus den anderen Mitgliedstaaten zu beschränken
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione alla Repubblica
    Francese, a norma dell'art. 226 CEE, a limitare le importazioni in provenienza
    dagli altri Stati membri di diodi, triodi, ecc. a cristallo, compresi i transistori
    (voce della tariffa doganale francese 85.21 C), parti e pezzi staccati di diodi,
    triodi ecc. (voce della tariffa doganale francese 85.21 E I) commettiture parziali
    a transistori (voce della tariffa doganale francese ex 85.15 C II a)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij de Franse Republiek op grond van artikel
    226 van het EEG-Verdrag wordt gemachtigd beperkingen te stellen op de invoer uit
    de andere Lid-Staten van kristaldiodes, kristaltriodes, enz., transistors daaronder
    begrepen (post Nr. 85.21 C van het Franse douanetarief), delen en onderdelen van
    diodes, triodes, enz. (post Nr. 85.21 E I van het Franse douanetarief), en bouwelementen
    met transistors (post Nr. ex 85.15 C II a van het Franse douanetarief)
  type: main
