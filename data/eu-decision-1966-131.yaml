title:
- language: fr
  script: Latn
  content: Décision 66/131/CEE de la Commission, du 15 février 1966, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/131/EWG: Entscheidung der Kommission vom 15. Februar 1966 betr. den
    Antrag der Französischen Republik gemäß Art. 115 Abs. (1) des Vertrages, um
    aus Japan stammende Rundfunkempfangsgeräte und aus Hongkong stammende Bettwäsche
    und Tischwäsche, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/131/CEE: Decisione della Commissione, del 15 febbraio 1966, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    al fine di escludere dal trattamento comunitario gli apparecchi riceventi di radiodiffusione
    originari del Giappone, nonché la biancheria da letto e da tavola originaria
    di Hong-Kong, immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/131/EEG: Beschikking van de Commissie van 15 februari 1966 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag ontvangtoestellen voor de radio-omroep, van oorsprong uit Japan,
    alsmede bedde- en tafellinnen, van oorsprong uit Hong-Kong, van de communautaire
    behandeling uit te sluiten wanneer deze produkten in de andere Lid-Staten in het
    vrije verkeer zijn gebracht'
  type: main
