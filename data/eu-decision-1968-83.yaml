title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 janvier 1968, portant fixation du schéma
    uniforme et des modalités d'application concernant la transcription sur bandes
    magnétiques ou cartes perforées des données contenues dans le questionnaire
    de l'enquête de base sur la structure des exploitations agricoles
  type: main
- language: de
  script: Latn
  content: '68/83/EWG: Entscheidung der Kommission vom 12. Januar 1968 über die Festlegung
    des einheitlichen Schemas und der Durchführungsbestimmungen zur Übertragung
    der im Erhebungsbogen enthaltenen Angaben der Grunderhebung über die Struktur
    der landwirtschaftlichen Betriebe auf Magnetbänder oder Lochkarten'
  type: main
- language: it
  script: Latn
  content: '68/83/CEE: Decisione della Commissione, del 12 gennaio 1968, che stabilisce
    lo schema uniforme e le modalità di applicazione riguardanti la trascrizione
    su nastri magnetici o schede perforate dei dati contenuti nel questionario dell''indagine
    principale sulla struttura delle aziende agricole'
  type: main
- language: nl
  script: Latn
  content: '68/83/EEG: Beschikking van de Commissie van 12 januari 1968 betreffende
    de vaststelling van het uniforme schema en de wijze van toepassing voor het overbrengen
    op magnetische banden of ponskaarten van de gegevens vervat in het enquêteformulier
    van de basisenquête naar de structuur van de landbouwbedrijven'
  type: main
