title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2518/81 of 28 August 1981 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18 and originating in Singapore, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2518/81 de la Commission, du 28 août 1981, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixes, variables ou ajustables de la position 85.18 du tarif douanier
    commun, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2518/81 der Kommission vom 28. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für elektrische Festkondensatoren, Drehkondensatoren
    und andere einstellbare Kondensatoren der Tarifnummer 85.18, mit Ursprung in Singapur,
    dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2518/81 af 28. august 1981 om genindførelse
    af opkrævning af told for elektriske kondensatorer, faste eller variable, henhørende
    under pos. 85.18 og med oprindelse i Singapore, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2518/81 τής Επιτροπής
