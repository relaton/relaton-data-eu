    σταθερούς, μεταβλητούς ή ρυθμιζόμενους τής
    δασμολογικής κλάσεως 85. 18, καταγωγής Σιγκαπούρης,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2518/81 della Commissione, del 28 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce 85.18 della tariffa doganale comune,
    originari di Singapore beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2518/81 van de Commissie van 28 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren) van post 85.18 van het gemeenschappelijk douanetarief, van oorsprong
    uit Singapore waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde
    tariefpreferenties zijn verleend
