id: EURegulation12711980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1271/80 of 23 May 1980 re-establishing the
    levying of customs duties on tableware and other articles of a kind commonly used
    for domestic or toilet purposes, falling within heading No 69.11 and originating
    in Yugoslavia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1271/80 de la Commission, du 23 mai 1980, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position 69.11
    du tarif douanier commun, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1271/80 der Kommission vom 23. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus Porzellan,
    der Tarifnummer 69.11, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1271/80 af 23. maj 1980 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af porcelæn, under pos. 69.11, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1271/80 della Commissione, del 23 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e agli oggetti
    di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa doganale
    comune, originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1271/80 van de Commissie van 23 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op vaatwerk,
    huishoudelijke artikelen en toiletartikelen, van porselein, van post 69.11, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
