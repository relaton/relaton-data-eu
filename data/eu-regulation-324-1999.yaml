title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 324/1999 of 8 February 1999 laying down for
    1999 certain measures for the conservation and management of fishery resources
    applicable in vessels flying the flag of certain non-member countries in the 200-nautical-mile
    zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 324/1999 du Conseil du 8 février 1999 fixant, pour
    l'année 1999, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large des côtes du département français de
    la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 324/1999 des Rates vom 8. Februar 1999 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Départements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1999)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 324/1999 af 8. februar 1999 om fastsættelse
    for 1999 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 324/1999 του Συμβουλίου
    της 8ης Φεβρουαρίου 1999 για τον καθορισμό, για
    το 1999, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, για σκάφη υπό σημαία
    ορισμένων χωρών μη μελών εντός της ζώνης 200
    μιλίων στα ανοικτά του γαλλικού διαμερίσματος
    της Γουιάνας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 324/1999, annettu 8 päivänä helmikuuta 1999,
    tietyistä kolmansien maiden lipun alla purjehtiviin aluksiin 200 meripeninkulman
    kalastusvyöhykkeellä, joka sijaitsee Ranskan Guyanan departementin rannikon
    edustalla, sovellettavista kalavarojen säilyttämis- ja hoitotoimenpiteistä
    vuodeksi 1999
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 324/1999 del Consiglio dell'8 febbraio 1999 che stabilisce,
    per il 1999, talune misure di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 324/1999 van de Raad van 8 februari 1999 houdende
    maatregelen, voor 1999, voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 324/1999 do Conselho de 8 de Fevereiro de 1999 que
    estabelece, para 1999, determinadas medidas de conservação e de gestão dos
    recursos da pesca aplicáveis aos navios que arvoram pavilhão de certos países
    terceiros, na zona de 200 milhas marítimas situada ao largo do departamento francês
    da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 324/1999 del Consejo de 8 de febrero de 1999 por el
    que se establecen, para 1999, determinadas medidas de conservación y de gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    terceros países en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 324/1999 av den 8 februari 1999 om fastställande
    för år 1999 av vissa åtgärder som syftar till bevarande och förvaltning av
    fiskeresurserna och som är tillämpliga på fartyg som för vissa tredje länders
    flagg i zonen på 200 nautiska mil utanför det franska departementet Guyanas
    kust
  type: main
