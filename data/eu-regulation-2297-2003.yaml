title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2297/2003 of 23 December 2003 amending Council
    Regulation (EC) No 1081/2000 prohibiting the sale, supply and export to Burma/Myanmar
    of equipment which might be used for internal repression or terrorism, and freezing
    the funds of certain persons related to important governmental functions in that
    country
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2297/2003 de la Commission du 23 décembre 2003 modifiant
    le règlement (CE) n° 1081/2000 du Conseil concernant l'interdiction de la vente,
    de la fourniture et de l'exportation à la Birmanie/au Myanmar de matériel susceptible
    d'être utilisé à des fins de répression interne ou de terrorisme, et le gel
    des fonds appartenant à certaines personnes ayant un lien avec d'importantes
    fonctions gouvernementales dans ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2297/2003 der Kommission vom 23. Dezember 2003 zur
    dritten Änderung der Verordnung (EG) Nr. 1081/2000 des Rates über das Verbot
    des Verkaufs, der Lieferung und der Ausfuhr nach Birma/Myanmar von Ausrüstungen,
    die zur internen Repression oder für terroristische Zwecke benutzt werden können,
    und über das Einfrieren der Gelder bestimmter, mit wichtigen Regierungsfunktionen
    verbundener Personen in diesem Land
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2297/2003 ze dne 23. prosince 2003, kterým
    se mění nařízení Rady (ES) č. 1081/2000, kterým se zakazuje prodej, dodávky
    a vývoz výzbroje do Barmy/Myanmaru, která by mohla být použita k vnitřní
    represi nebo terorismu, a kterým se zmrazují prostředky určitých osob, které
    jsou spojeny s významnými vládními funkcemi v této zemi
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2297/2003 af 23. december 2003 om ændring
    af Rådets forordning (EF) nr. 1081/2000 af 22. maj 2000 om forbud mod salg, levering
    og eksport til Burma/Myanmar af udstyr, der kan anvendes til intern undertrykkelse
    eller terrorisme, og om indefrysning af midler tilhørende visse personer, der
    har tilknytning til vigtige regeringsfunktioner i nævnte land
  type: main
- language: el
  script: Grek
