    sekä tiettyjen tärkeissä valtiollisissa tehtävissä kyseisessä maassa toimivien
    henkilöiden varojen jäädyttämisestä annetun neuvoston asetuksen (EY) N:o
    1081/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2297/2003/EK rendelete (2003. december 23.) a belső elnyomásra
    vagy terrorizmusra felhasználható felszerelések Burmába/Mianmarba való értékesítésének,
    szállításának és kivitelének tilalmáról, valamint az ebben az országban
    jelentős kormányzati tisztséget betöltő egyes személyek pénzkészleteinek
    befagyasztásáról szóló 1081/2000/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2297/2003 della Commissione, del 23 dicembre 2003,
    recante modifica del regolamento (CE) n. 1081/2000 del Consiglio che vieta la
    vendita, la fornitura e l'esportazione in Birmania/Myanmar di attrezzature che
    possono essere utilizzate per la repressione interna o a fini terroristici e congela
    i capitali di determinate persone che ricoprono importanti cariche pubbliche sul
    suo territorio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2297/2003 (2003. gada 23. decembris), ar kuru
    groza Padomes Regulu (EK) Nr. 1081/2000, ar ko aizliedz pārdot, piegādāt Birmai/Mjanmai
    un eksportēt uz turieni iekārtas, kuras varētu izmantot iekšējai apspiešanai
    vai terorismam, un iesaldē tādu konkrētu personu līdzekļus, kuras minētajā
    valstī ir saistītas ar svarīgām valsts funkcijām
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžio 23 d. Komisijos reglamentas (EB) Nr. 2297/2003, iš dalies
    keičiantis Tarybos reglamentą (EB) Nr. 1081/2000 dėl įrangos, kuri gali būti
    panaudota vidinėms represijoms ar teroristiniais tikslais, pardavimo, tiekimo
    ir eksporto į Birmą (Mianmarą) uždraudimo ir asmenų, kurie šioje šalyje
    yra susiję su svarbiomis vyriausybinėmis funkcijomis, lėšų įšaldymo
  type: main
- language: mt
  script: Latn
