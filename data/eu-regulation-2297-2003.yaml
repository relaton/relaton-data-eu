  script: Latn
  content: Verordening (EG) nr. 2297/2003 van de Commissie van 23 december 2003 tot
    wĳziging van Verordening (EG) nr. 1081/2000 van de Raad betreffende een verbod
    op de verkoop en de levering aan en de uitvoer naar Birma/Myanmar van uitrusting
    die voor binnenlandse repressie of terrorisme kan worden gebruikt, en betreffende
    het bevriezen van de middelen van bepaalde personen die in dat land belangrĳke
    regeringsposten bekleden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2297/2003 z dnia 23 grudnia 2003 r. zmieniające
    rozporządzenie Rady (WE) nr 1081/2000 zakazujące sprzedaży, dostaw i wywozu
    do Birmy/Myanmaru sprzętu, który mógłby zostać użyty w celu stosowania wewnętrznych
    represji lub terroryzmu oraz zamrażające środki niektórych osób pełniących
    ważne funkcje rządowe w tym kraju
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2297/2003 da Comissão, de 23 de Dezembro de 2003,
    que altera o Regulamento (CE) n.° 1081/2000 do Conselho que proíbe a venda,
    o fornecimento e a exportação para a Birmânia/Mianmar de equipamento susceptível
    de ser utilizado para actividades de repressão interna ou de terrorismo e que
    congela os fundos de determinadas pessoas ligadas a importantes cargos públicos
    nesse país
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2297/2003 z 23. decembra 2003, ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 1081/2000 o zákaze predaja, dodávania a
    vývozu zariadení, ktoré môžu byť použité na vnútornú represiu alebo
    terorizmus, do Barmy/Mjanmarska, a o zmrazení finančných prostriedkov určitých
    osôb v súvislosti s dôležitými vládnymi funkciami v tejto krajine
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2297/2003 z dne 23. decembra 2003 o spremembi
    Uredbe Sveta (ES) št. 1081/2000 o prepovedi prodaje, dobave in izvoza opreme
    v Burmo/Mjanmar, ki se lahko uporablja za notranjo represijo ali terorizem, in
