    v tej državi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2297/2003 de la Comisión, de 23 de diciembre de 2003,
    que modifica el Reglamento (CE) n° 1081/2000 del Consejo por el que se prohíbe
    la venta, suministro y exportación a Birmania/Myanmar de equipos que pudieran
    utilizarse para la represión interior o en acciones de terrorismo, y por el que
    se congelan los capitales de determinadas personas relacionadas con importantes
    funciones gubernamentales en dicho país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2297/2003 av den 23 december 2003 om
