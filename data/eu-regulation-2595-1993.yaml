title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2595/93 of 22 September 1993 laying down
    detailed rules for implementing Council Regulation (EEC) No 1765/92 as regards
    the use of land set aside for the production of multiannual raw materials for
    the manufacture within the Community of products not intended for human or animal
    consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2595/93 de la Commission du 22 septembre 1993 portant
    modalités d'application du règlement (CEE) n° 1765/92 du Conseil en ce qui
    concerne l'utilisation des terres mises en jachère pour la production de matières
    premières pluriannuelles servant à la fabrication, dans la Communauté, de produits
    destinés à des fins autres que l'alimentation humaine et/ou animale
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2595/93 DER KOMMISSION vom 22. September 1993 mit
    Durchführungsvorschriften zur Verordnung (EWG) Nr. 1765/92 des Rates hinsichtlich
    der Verwendung stillgelegter Flächen für die Erzeugung ausdauernder Kulturpflanzen,
    aus denen in der Gemeinschaft Erzeugnisse für andere als Lebens- und/oder Futtermittelzwecke
    hergestellt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2595/93 af 22. september 1993 om gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 1765/92 for så vidt angår anvendelse af udtagne
    arealer med henblik på tilvejebringelse af flerårige råvarer til fremstilling
    i Fællesskabet af produkter, som ikke er bestemt til konsum og/eller foderbrug
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2595/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 22ας Σεπτεμβρίου 1993 περί λεπτομερών κανόνων
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 1765/92 του
    Συμβουλίου όσον αφορά τη χρησιμοποίηση των
    γαιών που βρίσκονται υπό καθεστώς προσωρινής
    παύσης καλλιέργειας για την παραγωγή πρώτων
    υλών από πολυετείς καλλιέργειες που χρησιμεύουν
    κατά την παρασκευή στην Κοινότητα προϊόντων
    προοριζόμενων για άλλους σκοπούς εκτός της
    κατανάλωσης από τον άνθρωπο ή/και τα ζώα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2595/93, annettu 22 päivänä syyskuuta 1993,
    yksityiskohtaisista säännöistä neuvoston asetuksen (ETY) N:o 1765/92 soveltamisesta
    kesannoidun alan käyttämiseen yhteisössä valmistettavien teollisuustuotteiden
    monivuotisten raaka-aineiden tuottamiseen, joita ei ole tarkoitettu ihmis- tai
    eläinravinnoksi
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2595/93 DELLA COMMISSIONE del 22 settembre 1993 che
    stabilisce le modalità d' applicazione del regolamento (CEE) n. 1765/92 del Consiglio
    riguardo all' utilizzo delle superfici messe a riposo ai fini della produzione
    di materie prime pluriennali destinate alla fabbricazione nella Comunità di prodotti
    adibiti ad usi diversi dall' alimentazione umana o animale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2595/93 VAN DE COMMISSIE van 22 september 1993 houdende
    uitvoeringsbepalingen van Verordening (EEG) nr. 1765/92 van de Raad wat betreft
    het gebruik van braakgelegde grond voor de produktie van door meerjarige teelt
    verkregen grondstoffen voor de vervaardiging, in de Gemeenschap, van niet voor
    voeding en/of vervoedering bestemde produkten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2595/93 DA COMISSÃO de 22 de Setembro de 1993 que
    estabelece normas de execução do Regulamento (CEE) nº 1765/92 do Conselho no
    que respeita à utilização de terras retiradas na produção de matérias-primas
    plurianuais destinadas ao fabrico, na Comunidade, de produtos não destinados
    à alimentação humana e/ou animal
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2595/93 DE LA COMISIÓN de 22 de septiembre de 1993
    por el que se establecen disposiciones de aplicación del Reglamento (CEE) nº
    1765/92 del Consejo en lo relativo a la utilización de tierras retiradas de la
    producción para la obtención de materias primas plurianuales destinadas a la
    elaboración en la Comunidad de productos destinados a fines distintos de la alimentación
    humana o animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 2595/93 av den 22 september 1993 om
    tillämpningsföreskrifter för rådets förordning (EEG) nr 1765/92 vad avser
    användningen av uttagen mark för produktion av fleråriga råvaror avsedda för
    framställning inom gemenskapen av produkter som inte är avsedda som livsmedel
    eller djurfoder
