title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 941/80 of 14 April 1980 re-establishing
    the levying of customs duties on other men' s and boys' suits, products of category
    75 (code 0750), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 941/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres costumes
    et complets, de la catégorie 75 (code 0750), originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 941/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Anzüge und Kombinationen der Warenkategorie
    Nr. 75 (Kennziffer 0750), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 941/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for jakkesæt, under varekategori nr. 75 (kode
    0750), som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 941/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri vestiti e completi,
    della categoria di prodotti n. 75 (codice 0750), originari della Corea del Sud
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 941/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    van de categorie van produkten nr. 75 (codenummer 0750), van oorsprong uit Zuid-Korea
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
