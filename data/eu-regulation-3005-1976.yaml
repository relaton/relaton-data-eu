title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3005/76 of 10 December 1976 re-establishing
    the levying of customs duties on builders' carpentry and joinery (including prefabricated
    and sectional buildings and assembled parquet flooring panels) falling within
    heading No 44.23, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3005/76 de la Commission, du 10 décembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de menuiserie et pièces de charpente pour bâtiments et constructions, en bois,
    de la position tarifaire 44.23, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3005/76 der Kommission vom 10. Dezember 1976 zur Wiedereinführung
    des Zollsatzes für Bautischler- und Zimmermannsarbeiten, einschließlich zerlegbare
    Holzkonstruktionen und hölzerne Parkettafeln, der Tarifnummer 44.23, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3005/76 af 10. december 1976 om genindførelse
    af opkrævning af toldafgifter for tømrer- og snedkerarbejder af træ til bygningsbrug
    (herunder bygninger, færdige eller i dele til samling, og sammensatte parketstaver)
    under position 44.23, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3005/76 della Commissione, del 10 dicembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di falegnameria
    e lavori di carpentiere, per edifici e costruzioni, di legno, della voce doganale
    44.23, originari dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3005/76 van de Commissie van 10 december 1976 houdende
    wederinstelling van de heffing van de douanerechten voor schrijnwerk en timmerwerk,
    voor bouwwerken, van hout, van post 44.23, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 tariefpreferenties werden geopend
  type: main
