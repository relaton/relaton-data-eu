title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3271/89 of 30 October 1989 concerning the
    prices to be used for calculating the value of agricultural products in intervention
    storage, to be carried over to the following financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3271/89 de la Commission du 30 octobre 1989 relatif
    aux prix à retenir pour le calcul de la valeur des produits agricoles en stock
    d'intervention à reporter à l'exercice suivant
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3271/89 DER KOMMISSION vom 30. Oktober 1989 über
    die bei der Berechnung des Wertes der auf das folgende Haushaltsjahr zu übertragenden
    landwirtschaftlichen Interventionsbestände zu berücksichtigenden Preise #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3271/89 af 30. oktober 1989 om de priser,
    der skal anvendes ved beregningen af værdien af de landbrugsprodukter i interventionslagre,
    som skal fremføres til det følgende regnskabsår
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3271/89 της Επιτροπής
    της 30ής Οκτωβρίου 1989 σχετικά με τις τιμές που
    θα ληφθούν υπόψη για τον υπολογισμό της αξίας
    των γεωργικών προϊόντων σε απόθεμα παρεμβάσεως
    που θα μεταφερθούν στο επόμενο οικονομικό
    έτος
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3271/89 DELLA COMMISSIONE del 30 ottobre 1989 relativo
    ai prezzi che devono essere presi in considerazione per il calcolo del valore
    dei prodotti agricoli giacenti in ammasso d'' intervento da riportare all'' esercizio
    successivo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3271/89 VAN DE COMMISSIE van 30 oktober 1989 betreffende
    de prijzen waarvan moet worden uitgegaan bij de berekening van de waarde van de
    naar het volgende begrotingsjaar over te boeken voorraden landbouwprodukten bij
    de interventiebureaus #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3271/89 DA COMISSAO de 30 de Outubro de 1989 relativo
    aos preços a utilizar no calculo do valor dos produtos agricolas em armazenagem
    de intervençao a transitar para o exercicio seguinte
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3271/89 DE LA COMISIÓN de 30 de octubre de 1989 relativo
    a los precios que han de utilizarse para calcular el valor de los productos agrícolas
    que se hallen en existencias de intervención y que deban traspasarse a las cuentas
    del ejercicio siguiente #'
  type: main
