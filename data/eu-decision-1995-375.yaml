title:
- language: en
  script: Latn
  content: '95/375/EC: Commission Decision of 8 September 1995 amending Decision 94/724/EC
    derogating from the definition of the concept of ''originating products'' to take
    account of the special situation of Montserrat with regard to connections and
    contact elements for wire and cables falling within CN code 8536 90 10'
  type: main
- language: fr
  script: Latn
  content: '95/375/CE: Décision de la Commission, du 8 septembre 1995, modifiant
    la décision 94/724/CE portant dérogation à la définition de la notion de produits
    originaires pour tenir compte de la situation particulière de Montserrat en ce
    qui concerne les connexions et éléments de contacts pour fils et câbles relevant
    du code NC 8536 90 10'
  type: main
- language: de
  script: Latn
  content: '95/375/EG: Entscheidung der Kommission vom 8. September 1995 zur Änderung
    der Entscheidung 94/724/EG über eine Abweichung von der Bestimmung des Begriffs
    "Ursprungswaren" zur Berücksichtigung der besonderen Lage Montserrats hinsichtlich
    Verbindungs- und Kontaktelementen für Drähte und Kabel des KN-Codes 8536 90
    10'
  type: main
- language: da
  script: Latn
  content: '95/375/EF: Kommissionens beslutning af 8. september 1995 om ændring af
    beslutning 94/724/EF om undtagelse fra definitionen af begrebet »varer med oprindelsesstatus«
    for at tage hensyn til Montserrats særlige situation med hensyn til forbindelsesmateriel
    til ledninger og kabler henhørende under KN-kode 8536 90 10'
  type: main
- language: el
  script: Grek
  content: '95/375/ΕΚ: Απόφαση της Επιτροπής της 8ης Σεπτεμβρίου
    1995 που τροποποιεί την απόφαση αριθ. 94/724/ΕΚ για
    την παρέκκλιση από τον ορισμό της έννοιας των
    «προϊόντων καταγωγής» προκειμένου να ληφθούν
    υπόψη οι ειδικές συνθήκες του Μοντσεράτ όσον
    αφορά τις συνδέσεις και τα στοιχεία για σύρματα
    και καλώδια που υπάγονται στον κωδικό ΣΟ 8536
    90 10'
  type: main
- language: fi
  script: Latn
  content: '95/375/EY: Komission päätös, tehty 8 päivänä syyskuuta 1995, poikkeuksesta
    alkuperätuotteen käsitteen määritelmästä Montserratin erikoisaseman huomioon
    ottamiseksi CN-koodiin 8536 90 10 kuuluvien johtoja ja kaapeleita varten tarkoitettujen
    liitäntöjen ja kosketinelementtien osalta tehdyn päätöksen 94/724/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/375/CE: Decisione della Commissione, dell''8 settembre 1995, che modifica
    la decisione 94/724/CE recante deroga alla definizione di «prodotti originari»
    in considerazione della situazione particolare di Montserrat, in ordine alle connessioni
    e agli elementi di contatto per fili e cavi di cui al codice NC 8536 90 10'
  type: main
- language: nl
  script: Latn
  content: '95/375/EG: Beschikking van de Commissie van 8 september 1995 houdende
    wijziging van Beschikking 94/724/EG tot afwijking van de definitie van het begrip
    "produkten van oorsprong" teneinde rekening te houden met de speciale situatie
    van Montserrat met betrekking tot aansluittoestellen en contactverbindingen voor
    draad en kabels van GN-code 8536 90 10'
  type: main
- language: pt
  script: Latn
  content: '95/375/CE: Decisão da Comissão, de 8 de Setembro de 1995, que altera
    a Decisão 94/724/CE relativa à derrogação da noção de «produtos originários»
    para ter em conta a situação especial de Montserrat relativamente a conexões
    e elementos de contacto para fios e cabos do código NC 8536 90 10'
  type: main
- language: es
  script: Latn
  content: '95/375/CE: Decisión de la Comisión, de 8 de septiembre de 1995, que
    modifica la Decisión 94/724/CE por la que se establece una excepción a la definición
    de la noción de «productos originarios» a fin de tener en cuenta la situación
    especial de Montserrat con respecto a las conexiones y elementos de contacto para
    hilos y cables del código NC 8536 90 10'
  type: main
- language: sv
  script: Latn
  content: '95/375/EG: Kommissionens beslut av den 8 september 1995 om ändring av
    beslut 94/724/EG om undantag från definitionen av begreppet ursprungsvaror för
    att beakta den särskilda situation som råder för Montserrat med avseende på
    kopplingar och kontaktelement för ledningar och kablar som omfattas av KN-nummer
    8536 90 10'
