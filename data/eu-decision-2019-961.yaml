    av en provisorisk åtgärd som vidtagits av Republiken Frankrike i enlighet med
    artikel 129 i Europaparlamentets och rådets förordning (EG) nr 1907/2006 om
    registrering, utvärdering, godkännande och begränsning av kemikalier (Reach)
