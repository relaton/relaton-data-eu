    käsitellyn puun käytön ja markkinoille saattamisen rajoittamista koskevan Ranskan
    tasavallan toteuttaman väliaikaisen toimenpiteen hyväksymisestä kemikaalien
    rekisteröinnistä, arvioinnista, lupamenettelyistä ja rajoituksista (REACH)
    annetun Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1907/2006 129 artiklan
    mukaisesti (tiedoksiannettu numerolla C(2019) 4122)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/961 od 7. lipnja 2019. o odobravanju
    privremene mjere koju je Francuska Republika poduzela u skladu s člankom 129.
    Uredbe (EZ) br. 1907/2006 Europskog parlamenta i Vijeća o registraciji, evaluaciji,
    autorizaciji i ograničavanju kemikalija (REACH) kako bi ograničila uporabu i
    stavljanje na tržište određenog drva tretiranog kreozotom i drugim tvarima
    sličnima kreozotu (priopćeno pod brojem dokumenta C(2019) 4122)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/961 végrehajtási határozata (2019. június 7.)
