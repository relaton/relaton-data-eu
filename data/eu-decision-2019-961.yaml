    съответствие с член 129 от Регламент (ЕО) № 1907/2006
    на Европейския парламент и на Съвета относно
    регистрацията, оценката, разрешаването и ограничаването
    на химикали (REACH), за ограничаване на използването
    и пускането на пазара на обработена с креозот
    дървесина и други свързани с креозот вещества
    (нотифицирано под номер С(2019) 4122)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/961 ze dne 7. června 2019, kterým
    se schvaluje prozatímní opatření přijaté Francouzskou republikou v souladu
    s článkem 129 nařízení Evropského parlamentu a Rady (ES) č. 1907/2006 o
    registraci, hodnocení, povolování a omezování chemických látek za účelem
    omezení používání a uvádění na trh některého dřeva ošetřeného kreosotem
    a jinými látkami souvisejícími s kreosotem (oznámeno pod číslem C(2019)
    4122)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/961 af 7. juni 2019 om
    godkendelse af den foreløbige foranstaltning truffet af Den Franske Republik
    i henhold til artikel 129 i Europa-Parlamentets og Rådets forordning (EF) nr.
    1907/2006 om registrering, vurdering og godkendelse af samt begrænsninger for
    kemikalier (REACH) for at begrænse anvendelsen og markedsføringen af visse typer
    træ behandlet med creosot og andre hermed beslægtede stoffer (meddelt under
