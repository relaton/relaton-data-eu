    cheminių medžiagų registracijos, įvertinimo, autorizacijos ir apribojimų
    (REACH) 129 straipsnį Prancūzijos Respublikai leidžiama taikyti laikinąją
    priemonę tam tikros kreozotu ir kitomis kreozotui giminingomis medžiagomis apdorotos
