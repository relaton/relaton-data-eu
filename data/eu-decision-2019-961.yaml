    Uredbe (ES) št. 1907/2006 Evropskega parlamenta in Sveta o registraciji, evalvaciji,
    avtorizaciji in omejevanju kemikalij (REACH), da bi omejila uporabo in dajanje
    v promet nekaterega lesa, obdelanega s kreozotom in drugimi snovmi, povezanimi
