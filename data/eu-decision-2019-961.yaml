    článkom 129 nariadenia Európskeho parlamentu a Rady (ES) č. 1907/2006 o registrácii,
    hodnotení, autorizácii a obmedzovaní chemikálií (REACH) na obmedzenie používania
    určitého dreva ošetreného kreozotom a látkami príbuznými kreozotu a jeho
    uvádzania na trh [oznámené pod číslom C(2019) 4122]
