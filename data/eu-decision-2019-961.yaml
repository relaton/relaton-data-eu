    cu articolul 129 din Regulamentul (CE) nr. 1907/2006 al Parlamentului European
    și al Consiliului privind înregistrarea, evaluarea, autorizarea și restricționarea
    substanțelor chimice (REACH), de a restricționa utilizarea și introducerea
    pe piață a anumitor tipuri de lemn tratat cu creozot și cu alte substanțe
    înrudite [notificată cu numărul C(2019) 4122]
  type: main
