    (EG) nr. 1907/2006 van het Europees Parlement en de Raad inzake de registratie
    en beoordeling van en de autorisatie en beperkingen ten aanzien van chemische
    stoffen (Reach) ter beperking van het gebruik en het in de handel brengen van
    bepaald met creosoot en andere aan creosoot verwante stoffen behandeld hout (Kennisgeving
    geschied onder nummer C(2019) 4122)
  type: main
- language: pl
  script: Latn
