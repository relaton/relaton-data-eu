id: EUDecision2019961
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/961 of 7 June 2019 authorising
    a provisional measure taken by the French Republic in accordance with Article
    129 of Regulation (EC) No 1907/2006 of the European Parliament and of the Council
    concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals
    (REACH) to restrict the use and the placing on the market of certain wood treated
    with creosote and other creosote-related substances (notified under document C(2019)
    4122)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/961 de la Commission du 7 juin 2019 autorisant
    une mesure provisoire prise par la République française conformément à l'article
    129 du règlement (CE) n° 1907/2006 du Parlement européen et du Conseil concernant
    l'enregistrement, l'évaluation et l'autorisation des substances chimiques, ainsi
    que les restrictions applicables à ces substances (REACH), afin de restreindre
    l'utilisation et la mise sur le marché de certains bois traités avec de la créosote
    et avec d'autres substances apparentées [notifiée sous le numéro C(2019) 4122]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/961 der Kommission vom 7. Juni 2019 zur
    Genehmigung der von der Französischen Republik nach Artikel 129 der Verordnung
    (EG) Nr. 1907/2006 des Europäischen Parlaments und des Rates zur Registrierung,
    Bewertung, Zulassung und Beschränkung chemischer Stoffe (REACH) ergriffenen vorläufigen
    Maßnahme zur Beschränkung der Verwendung und des Inverkehrbringens von bestimmtem,
    mit Kreosot und anderen, mit Kreosot verwandten Stoffen behandeltem Holz (Bekannt
    gegeben unter Aktenzeichen C(2019) 4122)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/961 на Комисията
