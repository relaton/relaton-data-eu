    f'konformità mal-Artikolu 129 tar-Regolament (KE) Nru 1907/2006 tal-Parlament
    Ewropew u tal-Kunsill dwar ir-Reġistrazzjoni, il-Valutazzjoni, l-Awtorizzazzjoni
