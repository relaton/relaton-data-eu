    z art. 129 rozporządzenia (WE) nr 1907/2006 Parlamentu Europejskiego i Rady w
    sprawie rejestracji, oceny, udzielania zezwoleń i stosowanych ograniczeń w zakresie
    chemikaliów (REACH), w celu ograniczenia stosowania i wprowadzania do obrotu
    określonego drewna zaimpregnowanego kreozotem i innymi substancjami powiązanymi
    z kreozotem (notyfikowana jako dokument nr C(2019) 4122)
  type: main
