    engedélyezéséről és korlátozásáról (REACH) szóló 1907/2006/EK európai
    parlamenti és tanácsi rendelet 129. cikkével összhangban hozott bizonyos,
    kreozottal vagy egyéb kreozotjellegű anyaggal kezelt faanyagok használatának
    és forgalomba hozatalának korlátozására irányuló átmeneti intézkedés
    engedélyezéséről (az értesítés a C(2019) 4122. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/961 della Commissione, del 7 giugno 2019,
    che autorizza una misura provvisoria adottata dalla Repubblica francese a norma
    dell'articolo 129 del regolamento (CE) n. 1907/2006 del Parlamento europeo e del
    Consiglio concernente la registrazione, la valutazione, l'autorizzazione e la
    restrizione delle sostanze chimiche (REACH) al fine di limitare l'uso e l'immissione
    sul mercato di alcuni tipi di legno trattato con creosoto e altre sostanze legate
    al creosoto [notificata con il numero C(2019) 4122]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/961 (2019. gada 7. jūnijs),
    ar ko, lai ierobežotu tādas noteiktas koksnes izmantošanu un laišanu tirgū,
    kura apstrādāta ar kreozotu un citām kreozotam radniecīgām vielām, atļauj
    pagaidu pasākumu, kuru Francijas Republika veikusi saskaņā ar 129. pantu Eiropas
    Parlamenta un Padomes Regulā (EK) Nr. 1907/2006, kas attiecas uz ķimikāliju
    reģistrēšanu, vērtēšanu, licencēšanu un ierobežošanu (REACH) (izziņots
    ar dokumenta numuru C(2019) 4122)
  type: main
