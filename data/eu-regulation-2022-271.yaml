---
id: EURegulation2022271
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/271 of 23 February 2022 correcting
    Implementing Regulation (EU) 2020/1760 concerning the authorisation of the preparation
    of Bacillus subtilis DSM 25841 as a feed additive for all porcine species, including
    sows, other than lactating sows in order to have a benefit in suckling piglets
    (holder of authorisation Chr. Hansen A/S)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/271 de la Commission du 23 février
    2022 rectifiant le règlement d’exécution (UE) 2020/1760 concernant l’autorisation
    de la préparation de Bacillus subtilis DSM 25841 en tant qu’additif pour l’alimentation
    de toutes les espèces porcines, y compris les truies, autres que les truies allaitantes,
    en vue d’en faire bénéficier les porcelets non sevrés (titulaire de l’autorisation:
    Chr. Hansen A/S)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/271 der Kommission vom 23. Februar
    2022 zur Berichtigung der Durchführungsverordnung (EU) 2020/1760 zur Zulassung
    einer Zubereitung aus Bacillus subtilis DSM 25841 als Zusatzstoff in Futtermitteln
    für alle Schweinearten, einschließlich Sauen außer laktierende Sauen, zur Erzielung
    einer positiven Wirkung bei Saugferkeln (Zulassungsinhaber: Chr. Hansen A/S)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/271 на Комисията
    от 23 февруари 2022 година за поправка на Регламент
    за изпълнение (ЕС) 2020/1760 за разрешаване на употребата
    на препарат от Bacillus subtilis DSM 25841 като фуражна
    добавка за всички видове свине, включително
    свине майки, с изключение на кърмещи свине
    майки, с цел ползотворно въздействие върху
    прасенцата сукалчета (притежател на разрешението
    Chr. Hansen A/S)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/271 ze dne 23. února 2022, kterým
    se opravuje prováděcí nařízení (EU) 2020/1760 o povolení přípravku Bacillus
    subtilis DSM 25841 jako doplňkové látky pro všechny druhy prasat včetně
    prasnic, kromě prasnic produkujících mléko pro přínos u sajících selat
    (držitel povolení Chr. Hansen A/S)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/271 af 23. februar 2022
    om berigtigelse af gennemførelsesforordning (EU) 2020/1760 om godkendelse af
    præparatet af Bacillus subtilis DSM 25841 som fodertilsætningsstof til alle
    svinearter, herunder søer, undtagen diegivende søer med det formål at opnå
    en gunstig virkning hos pattegrise (indehaver af godkendelsen er Chr. Hansen A/S)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/271 της Επιτροπής
    της 23ης Φεβρουαρίου 2022 για τη διόρθωση του
    εκτελεστικού κανονισμού (ΕΕ) 2020/1760 για την έγκριση
    του παρασκευάσματος Bacillus subtilis DSM 25841 ως πρόσθετης
    ύλης ζωοτροφών για όλα τα είδη χοιροειδών,
    συμπεριλαμβανομένων των χοιρομητέρων, εκτός
    από τη χρήση σε θηλάζουσες χοιρομητέρες με
    σκοπό το όφελος για τα θηλάζοντα χοιρίδια (κάτοχος
    της άδειας Chr. Hansen A/S)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/271, 23. veebruar 2022, millega parandatakse
    rakendusmäärust (EL) 2020/1760, milles käsitletakse loa andmist Bacillus subtilis
    DSM 25841 preparaadi kasutamiseks kõikide sealiikide, sealhulgas emiste, välja
    arvatud imetavad emised (piimapõrsaste kasuks), söödalisandina (loa hoidja
    Chr. Hansen A/S)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/271, annettu 23 päivänä
    helmikuuta 2022, Bacillus subtilis DSM 25841 -valmisteen hyväksymisestä kaikkien
    siansukuisten eläinten, myös emakkojen, rehun lisäaineena, lukuun ottamatta
    imettävien emakkojen rehua imevien porsaiden hyödyttämiseksi annetun täytäntöönpanoasetuksen
    (EU) 2020/1760 oikaisemisesta (hyväksynnän haltija Chr. Hansen A/S)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/271 ón gCoimisiún an 23 Feabhra
    2022 lena gceartaítear Rialachán Cur Chun Feidhme (AE) 2020/1760 maidir le hullmhóid
    Bacillus subtilis DSM 25841 a údarú mar bhreiseán beatha le haghaidh gach speicis
    mhucúil, cránacha san áireamh, seachas cránacha atá ag tál ionas go rachaidh
    sé chun tairbhe do bhainbh diúil (sealbhóir údarú Chr. Hansen A/S)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/271 оd 23. veljače 2022. o ispravku
    Provedbene uredbe (EU) 2020/1760 o odobrenju pripravka od Bacillus subtilis DSM
    25841 kao dodatka hrani za sve vrste svinja, uključujući krmače osim krmača
    u laktaciji, radi pozitivnog učinka na sisajuću prasad (nositelj odobrenja Chr.
    Hansen A/S)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2022/271 végrehajtási rendelete (2022. február 23.)
    a Bacillus subtilis DSM 25841 készítménynek a szopós malacokra gyakorolt kedvező
    hatás elérése érdekében a tejelő kocákon kívüli valamennyi sertésfaj
    – beleértve a kocákat is – takarmány-adalékanyagaként történő engedélyezéséről
    (az engedély jogosultja: Chr. Hansen A/S) szóló (EU) 2020/1760 végrehajtási
    rendelet helyesbítéséről'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/271 della Commissione del 23 febbraio
    2022 che rettifica il regolamento di esecuzione (UE) 2020/1760 relativo all’autorizzazione
    del preparato di Bacillus subtilis DSM 25841 come additivo per mangimi destinati
    a tutte le specie suine, comprese le scrofe, ad eccezione delle scrofe in lattazione
    al fine di ottenere benefici per i suinetti lattanti (titolare dell’autorizzazione
    Chr. Hansen A/S)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/271 (2022. gada 23. februāris),
    ar kuru labo Īstenošanas regulu (ES) 2020/1760 par atļauju Bacillus subtilis
    DSM 25841 preparātu izmantot par barības piedevu visu sugu cūkām, arī sivēnmātēm
    (kas nav laktācijas periodā), lai labvēlīgi ietekmētu zīdāmus sivēnus
    (atļaujas turētājs Chr. Hansen A/S)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/271 2022 m. vasario 23 d.
    kuriuo ištaisomas Įgyvendinimo reglamentas (ES) 2020/1760 dėl leidimo naudoti
    Bacillus subtilis DSM 25841 preparatą kaip visų rūšių kiaulių, įskaitant
    nelaktuojančias paršavedes, siekiant teigiamo poveikio žindomiems paršeliams,
    pašarų priedą (leidimo turėtoja – bendrovė „Chr. Hansen A/S“)
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/271 tat-23
    ta’ Frar 2022 li jikkoreġi r-Regolament ta’ Implimentazzjoni tal-Kummissjoni
    (UE) 2020/1760 dwar l-awtorizzazzjoni tal-preparazzjoni ta’ Bacillus subtilis
    DSM 25841 bħala addittiv fl-għalf għall-ispeċijiet kollha tal-ħnieżer, inkluż
    il-ħnieżer nisa, għajr il-ħnieżer nisa li jreddgħu biex ikollhom benefiċċju
    fi ħnienes mhux miftuma (id-detentur tal-awtorizzazzjoni: Chr. Hansen A/S)'
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/271 van de Commissie van 23 februari 2022
    tot rectificatie van Uitvoeringsverordening (EU) 2020/1760 tot verlening van een
    vergunning voor het preparaat van Bacillus subtilis DSM 25841 als toevoegingsmiddel
    voor diervoeding voor alle varkens, met inbegrip van zeugen, met uitzondering
    van zogende zeugen, om een voordeel te verkrijgen bij speenvarkens (vergunninghouder
    Chr. Hansen A/S)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/271 z dnia 23 lutego 2022
    r. w sprawie sprostowania rozporządzenia wykonawczego (UE) 2020/1760 dotyczącego
    zezwolenia na stosowanie preparatu Bacillus subtilis DSM 25841 jako dodatku paszowego
    dla wszystkich gatunków świń, w tym loch, z wyjątkiem loch karmiących w celu
    uzyskania korzyści dla prosiąt ssących (posiadacz zezwolenia Chr. Hansen A/S)
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2022/271 da Comissão de 23 de fevereiro
    de 2022 que retifica o Regulamento de Execução (UE) 2020/1760 relativo à autorização
    da preparação de Bacillus subtilis DSM 25841 como aditivo em alimentos para
    todas as espécies de suínos, incluindo porcas, exceto porcas em lactação,
    a fim de beneficiar os leitões não desmamados (detentor da autorização: Chr.
    Hansen A/S)'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2022/271 al Comisiei din 23 februarie
    2022 de rectificare a Regulamentului de punere în aplicare (UE) 2020/1760 al
    Comisiei privind autorizarea preparatului de Bacillus subtilis DSM 25841 ca aditiv
    pentru hrana tuturor speciilor de porcine, inclusiv a altor scroafe decât cele
    care alăptează, în vederea obținerii unui efect benefic asupra purceilor sugari
    (titularul autorizației: Chr. Hansen A/S)'
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/271 z 23. februára 2022, ktorým
    sa opravuje vykonávacie nariadenie Komisie (EÚ) 2020/1760 o povolení prípravku
    s obsahom Bacillus subtilis DSM 25841 ako kŕmnej doplnkovej látky pre všetky
    druhy ošípaných vrátane prasníc s výnimkou dojčiacich prasníc na dosiahnutie
    pozitívneho vplyvu na ciciaky (držiteľ povolenia Chr. Hansen A/S)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/271 z dne 23. februarja 2022 o popravku
    Izvedbene uredbe (EU) 2020/1760 o dovoljenju za pripravek iz Bacillus subtilis
    DSM 25841 kot krmni dodatek za vse vrste prašičev, vključno s svinjami, razen
    doječih svinj, da koristi sesnim pujskom (imetnik dovoljenja Chr. Hansen A/S)
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2022/271 de la Comisión de 23 de febrero
    de 2022 por el que se corrige el Reglamento de Ejecución (UE) 2020/1760, relativo
    a la autorización del preparado de Bacillus subtilis DSM 25841 como aditivo para
    piensos para todas las especies porcinas, incluidas las cerdas, excepto las cerdas
    lactantes, en beneficio de lechones lactantes (titular de la autorización: Chr.
    Hansen A/S)'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2022/271 av den 23 februari
    2022 om rättelse av genomförandeförordning (EU) 2020/1760 om godkännande av
    ett preparat av Bacillus subtilis (DSM 25841) som fodertillsats för alla svinarter,
    inklusive andra suggor än lakterande suggor, med syfte att inverka positivt på
    diande smågrisar (innehavare av godkännandet: Chr. Hansen A/S)'
