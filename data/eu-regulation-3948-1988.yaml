    für Schiffe unter der Flagge eines Mitgliedstaats, mit Ausnahme Spaniens und
    Portugals, in den Gewässern unter der Hoheitsgewalt oder Gerichtsbarkeit Spaniens
    (1989) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3948/88 af 11. december 1988 om fastsættelse
    for 1989 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører en medlemsstats flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Spaniens højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
