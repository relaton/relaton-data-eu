    διατήρησης και διαχείρισης των αλιευτικών
    πόρων που εφαρμόζονται στα σκάφη με σημαία
    ενός κράτους μέλους, εκτός της Ισπανίας και
    της Πορτογαλίας, στα ύδατα που υπάγονται στην
    κυριαρχία ή τη δικαιοδοσία της Ισπανίας
  type: main
- language: it
  script: Latn
