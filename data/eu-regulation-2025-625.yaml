    του κανονισμού (ΕΕ) 2024/573 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, ελάχιστων απαιτήσεων για
    τα πιστοποιητικά φυσικών και νομικών προσώπων
    και των όρων αμοιβαίας αναγνώρισης των εν λόγω
    πιστοποιητικών, όσον αφορά τον στατικό εξοπλισμό
    πυροπροστασίας που περιέχει ορισμένα φθοριούχα
