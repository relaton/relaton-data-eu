---
id: EURegulation2025625
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/625 of 28 March 2025 establishing,
    pursuant to Regulation (EU) 2024/573 of the European Parliament and of the Council,
    minimum requirements for certificates of natural and legal persons and the conditions
    for the mutual recognition of such certificates as regards stationary fire protection
    equipment containing certain fluorinated greenhouse gases or relevant alternatives
    and repealing Commission Regulation (EC) No 304/2008
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/625 de la Commission du 28 mars 2025
    établissant, conformément au règlement (UE) 2024/573 du Parlement européen
    et du Conseil, des prescriptions minimales pour les certificats des personnes
    physiques et morales en ce qui concerne les équipements fixes de protection contre
    l’incendie contenant certains gaz à effet de serre fluorés ou des solutions
    de substitution pertinentes et les conditions de la reconnaissance mutuelle des
    certificats correspondants, et abrogeant le règlement (CE) no 304/2008 de la
    Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/625 der Kommission vom 28. März 2025
    zur Festlegung — gemäß der Verordnung (EU) 2024/573 des Europäischen Parlaments
    und des Rates — der Mindestanforderungen an Zertifikate für natürliche und
    juristische Personen sowie der Bedingungen für die gegenseitige Anerkennung dieser
    Zertifikate in Bezug auf ortsfeste Brandschutzeinrichtungen, die bestimmte fluorierte
    Treibhausgase oder relevante Alternativen dazu enthalten, und zur Aufhebung der
    Verordnung (EG) Nr. 304/2008 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/625 на Комисията
    от 28 март 2025 година за установяване, в съответствие
    с Регламент (ЕС) 2024/573 на Европейския парламент
    и на Съвета, на минимални изисквания за сертификатите
    на физически и юридически лица и на условия
    за взаимното признаване на такива сертификати
    по отношение на стационарно противопожарно
    оборудване, съдържащо някои флуорсъдържащи
    парникови газове или съответните алтернативи,
    и за отмяна на Регламент (ЕО) № 304/2008 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/625 ze dne 28. března 2025,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2024/573 stanoví
    minimální požadavky na certifikáty fyzických a právnických osob a podmínky
    pro vzájemné uznávání těchto certifikátů, pokud jde o stacionární protipožární
    zařízení obsahující některé fluorované skleníkové plyny nebo příslušné
    alternativy, a kterým se zrušuje nařízení Komise (ES) č. 304/2008
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/625 af 28. marts 2025
    om fastsættelse i medfør af Europa-Parlamentets og Rådets forordning (EU) 2024/573
    af mindstekrav til fysiske og juridiske personers autorisationer og betingelser
    for gensidig anerkendelse af sådanne autorisationer for så vidt angår stationært
    brandsikringsudstyr, der indeholder visse fluorholdige drivhusgasser eller relevante
    alternativer hertil, og om ophævelse af Kommissionens forordning (EF) nr. 304/2008
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/625 της Επιτροπής,
