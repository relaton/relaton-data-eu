    λύσεις, και για την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 304/2008
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/625, 28. märts 2025, millega kehtestatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) 2024/573 füüsilistele
    ja juriidilistele isikutele antavate sertifikaatide miinimumnõuded ja selliste
    sertifikaatide vastastikuse tunnustamise tingimused seoses teatavaid fluoritud
    kasvuhoonegaase või asjakohaseid alternatiive sisaldavate paiksete tuletõrjeseadmetega
    ning tunnistatakse kehtetuks komisjoni määrus (EÜ) nr 304/2008
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/625, annettu 28 päivänä
    maaliskuuta 2025, tiettyjä fluorattuja kasvihuonekaasuja tai niiden asiaankuuluvia
    vaihtoehtoja sisältäviä kiinteitä palontorjuntalaitteita koskevia luonnollisten
    henkilöiden ja oikeushenkilöiden pätevyystodistuksia koskevien vähimmäisvaatimusten
    ja tällaisten todistusten vastavuoroisen tunnustamisen edellytysten vahvistamisesta
    Euroopan parlamentin ja neuvoston asetuksen (EU) 2024/573 mukaisesti sekä komission
    asetuksen (EY) N:o 304/2008 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/625 ón gCoimisiún an 28 Márta
    2025 lena mbunaítear, de bhun Rialachán (AE) 2024/573 ó Pharlaimint na hEorpa
    agus ón gComhairle, íoscheanglais maidir le deimhnithe daoine nádúrtha agus
    dlítheanacha agus na coinníollacha maidir le haitheantas frithpháirteach a
    thabhairt do dheimhnithe den sórt sin a mhéid a bhaineann le trealamh cosanta
    dóiteáin do-aistrithe ina bhfuil gáis ceaptha teasa fhluairínithe áirithe
    nó roghanna malartacha ábhartha agus lena n-aisghairtear Rialachán (CE) Uimh.
    304/2008 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/625 оd 28. ožujka 2025. o utvrđivanju,
    u skladu s Uredbom (EU) 2024/573 Europskog parlamenta i Vijeća, minimalnih zahtjeva
    za certifikate fizičkih i pravnih osoba i uvjeta za uzajamno priznavanje takvih
    certifikata u pogledu nepokretne protupožarne opreme koja sadržava određene
    fluorirane stakleničke plinove ili relevantna zamjenska rješenja za njih te
    o stavljanju izvan snage Uredbe Komisije (EZ) br. 304/2008
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/625 végrehajtási rendelete (2025. március 28.)
    az egyes fluortartalmú üvegházhatású gázokat vagy releváns alternatívákat
    tartalmazó, helyhez kötött tűzvédelmi berendezések tekintetében a természetes
    és jogi személyek bizonyítványaira vonatkozó minimumkövetelményeknek és
    az ilyen bizonyítványok kölcsönös elismerésére vonatkozó feltételeknek
    az (EU) 2024/573 európai parlamenti és tanácsi rendelet szerinti megállapításáról,
    valamint a 304/2008/EK bizottsági rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/625 della Commissione, del 28 marzo
    2025, che stabilisce, in conformità al regolamento (UE) 2024/573 del Parlamento
    europeo e del Consiglio, i requisiti minimi per i certificati per le persone fisiche
    e giuridiche e le condizioni per il riconoscimento reciproco di tali certificati
    per quanto riguarda le apparecchiature fisse di protezione antincendio contenenti
    taluni gas fluorurati a effetto serra o pertinenti alternative e che abroga il
    regolamento (CE) n. 304/2008 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/625 (2025. gada 28. marts), ar
    ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (ES) 2024/573 nosaka minimālās
    prasības fizisku un juridisku personu sertifikātiem un šādu sertifikātu savstarpējas
    atzīšanas nosacījumus attiecībā uz stacionāru ugunsaizsardzības aprīkojumu,
    kurš satur noteiktas fluorētās siltumnīcefekta gāzes vai attiecīgas alternatīvas,
    un ar ko atceļ Komisijas Regulu (EK) Nr. 304/2008
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 28 d. Komisijos įgyvendinimo reglamentas (ES) 2025/625, kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (ES) 2024/573 nustatomi fizinių
    ir juridinių asmenų sertifikatų minimalieji reikalavimai ir tokių sertifikatų
    tarpusavio pripažinimo sąlygos, susiję su stacionaria gaisro gesinimo įranga,
    kurioje yra tam tikrų fluorintų šiltnamio efektą sukeliančių dujų arba
    atitinkamų fluorintų šiltnamio efektą sukeliančių dujų alternatyvų, ir
    panaikinamas Komisijos reglamentas (EB) Nr. 304/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/625 tat-28
    ta’ Marzu 2025 li jistabbilixxi, skont ir-Regolament (UE) 2024/573 tal-Parlament
    Ewropew u tal-Kunsill, ir-rekwiżiti minimi għaċ-ċertifikati ta’ persuni
    fiżiċi u ġuridiċi u l-kundizzjonijiet għar-rikonoxximent reċiproku ta’
    tali ċertifikati fir-rigward tat-tagħmir ta’ protezzjoni kontra n-nar stazzjonarju
    li fih ċerti gassijiet fluworurati b’effett ta’ serra jew alternattivi rilevanti
    u li jħassar ir-Regolament tal-Kummissjoni (KE) Nru 304/2008
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/625 van de Commissie van 28 maart 2025
    tot vaststelling, ingevolge Verordening (EU) 2024/573 van het Europees Parlement
    en de Raad, van minimumeisen voor certificaten van natuurlijke en rechtspersonen
    en de voorwaarden voor de wederzijdse erkenning van dergelijke certificaten op
    het gebied van stationaire brandbeveiligingsapparatuur die bepaalde gefluoreerde
    broeikasgassen of relevante alternatieven bevat, en tot intrekking van Verordening
    (EG) nr. 304/2008 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/625 z dnia 28 marca 2025 r.
    ustanawiające, na podstawie rozporządzenia Parlamentu Europejskiego i Rady (UE)
    2024/573, minimalne wymogi dotyczące certyfikatów dla osób fizycznych i prawnych
    oraz warunki wzajemnego uznawania takich certyfikatów w odniesieniu do stacjonarnych
    urządzeń ochrony przeciwpożarowej zawierających niektóre fluorowane gazy
    cieplarniane lub odpowiednie alternatywy oraz uchylające rozporządzenie Komisji
    (WE) nr 304/2008
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/625 da Comissão, de 28 de março de
    2025, que estabelece, nos termos do Regulamento (UE) 2024/573 do Parlamento Europeu
    e do Conselho, os requisitos mínimos relativos aos certificados de pessoas singulares
    e coletivas e as condições para o reconhecimento mútuo desses certificados
    no respeitante aos equipamentos fixos de proteção contra incêndios que contenham
    determinados gases fluorados com efeito de estufa ou alternativas relevantes e
    que revoga o Regulamento (CE) n.o 304/2008 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/625 al Comisiei din 28 martie
    2025 de stabilire, în temeiul Regulamentului (UE) 2024/573 al Parlamentului European
    și al Consiliului, a cerințelor minime pentru certificatele persoanelor fizice
    și juridice și a condițiilor pentru recunoașterea reciprocă a acestor certificate
    în ceea ce privește echipamentele staționare de protecție împotriva incendiilor
    care conțin anumite gaze fluorurate cu efect de seră sau alternative relevante
    și de abrogare a Regulamentului (CE) nr. 304/2008 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/625 z 28. marca 2025, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2024/573 stanovujú minimálne
    požiadavky na osvedčenia fyzických a právnických osôb a podmienky vzájomného
    uznávania takýchto osvedčení, pokiaľ ide o stacionárne protipožiarne zariadenia
    obsahujúce určité fluórované skleníkové plyny alebo príslušné alternatívy,
    a ktorým sa zrušuje nariadenie Komisie (ES) č. 304/2008
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/625 z dne 28. marca 2025 o določitvi
    minimalnih zahtev za spričevala za fizične in pravne osebe ter pogojev za vzajemno
    priznavanje takih spričeval glede nepremične protipožarne opreme, ki vsebuje
    nekatere fluorirane toplogredne pline ali ustrezne alternative, na podlagi Uredbe
    (EU) 2024/573 Evropskega parlamenta in Sveta ter o razveljavitvi Uredbe Komisije
    (ES) št. 304/2008
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/625 de la Comisión, de 28 de marzo
    de 2025, por el que se establecen, de conformidad con el Reglamento (UE) 2024/573
    del Parlamento Europeo y del Consejo, los requisitos mínimos de los certificados
    de las personas físicas y jurídicas y las condiciones para el reconocimiento
    mutuo de dichos certificados en lo que respecta a los aparatos fijos de protección
    contra incendios que contengan determinados gases fluorados de efecto invernadero
    u otras alternativas pertinentes, y por el que se deroga el Reglamento (CE) n.o
    304/2008 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/625 av den 28 mars 2025
    om fastställande, i enlighet med Europaparlamentets och rådets förordning (EU)
    2024/573, av minimikrav för certifikat för fysiska och juridiska personer och
    villkoren för ömsesidigt erkännande av sådana certifikat vad gäller stationär
    brandskyddsutrustning som innehåller vissa fluorerade växthusgaser eller relevanta
    alternativ samt om upphävande av kommissionens förordning (EG) nr 304/2008
