id: EUDecision1979975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/975/EEC: Commission Decision of 30 October 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of the Netherlands of a payment
    on account in respect of expenditure incurred during 1978 on annuities relating
    to measures to encourage the cessation of farming and the reallocation of utilized
    agricultural area for the purpose of structural improvement (Only the Dutch text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/975/CEE: Décision de la Commission, du 30 octobre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume des Pays-Bas, d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les indemnités relatives à l''encouragement
    de la cessation de l''activité agricole et à l''affectation de la superficie
    agricole utilisée à des fins d''amélioration des structures (Le texte en langue
    néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/975/EWG: Entscheidung der Kommission vom 30. Oktober 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an das Königreich der Niederlande (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/975/EØF: Kommissionens beslutning af 30. oktober 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Nederlandene af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1978 til godtgørelser vedrørende
    støtte til ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal
    til strukturforbedringsformål (Kun den nederlandske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/975/CEE: Decisione della Commissione, del 30 ottobre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi
    di un anticipo sulle spese effettuate durante il 1978 per le indennità concernenti
    l''incoraggiamento alla cessazione dell''attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture
    (Il testo in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/975/EEG: Beschikking van de Commissie van 30 oktober 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk der Nederlanden
    van een voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor
    de uitkeringen met betrekking tot de bevordering van de bedrijfsbeëindiging in
    de landbouw en van de aanwending van de cultuurgrond tot verbetering van de structuur
    (Slechts de tekst in de Nederlandse taal is authentiek)'
  type: main
