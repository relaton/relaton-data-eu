title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1620 of 8 August 2023 on temporary
    emergency measures derogating in respect of the year 2023 from certain provisions
    of Regulation (EU) 2021/2115 of the European Parliament and of the Council, to
    resolve specific problems in the fruit and vegetables sector caused by adverse
    meteorological events and measures linked to them
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1620 de la Commission du 8 août 2023
