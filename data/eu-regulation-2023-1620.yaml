    à certaines dispositions du règlement (UE) 2021/2115 du Parlement européen
    et du Conseil en vue de résoudre des problèmes spécifiques dans le secteur
    des fruits et légumes provoqués par des phénomènes climatiques défavorables
    et des mesures y afférentes
  type: main
- language: de
  script: Latn
