title:
- language: fr
  script: Latn
  content: Règlement n 79/63/CEE de la Commission, du 26 juillet 1963, portant adaptation
    et fixation des prix d'écluse pour les oeufs de volailles de basse-cour et les
    volailles de basse-cour vivantes et abattues et fixation du montant des prélèvements
    envers les pays tiers pour les oeufs en coquille de volailles de basse-cour, les
    volailles vivantes d'un poids n'excédant pas 185 grammes et les volailles abattues;
    pour la période du 1er août 1963 au 30 septembre 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 79/63/EWG der Kommission vom 26. Juli 1963 über die Anpassung
    und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel, lebendes
    und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. August bis zum 30. September 1963
  type: main
- language: it
  script: Latn
  content: Regolamento n. 79/63/CEE della Commissione del 26 luglio 1963 relativo
    all'adattamento e alla fissazione dei prezzi limite per le uova di volatili da
    cortile, i volatili da cortile vivi e macellati, nonchè alla fissazione dell'ammontare
    dei prelievi nei confronti dei paesi terzi per le uova in guscio di volatili da
    cortile, i volatili da cortile vivi di peso non, superiore a 185 grammi ed i volatili
    da cortile macellati per il periodo 1 agosto - 30 settembre 1963
  type: main
- language: nl
  script: Latn
  content: Verordening no. 79/63/EEG van de Commissie van 26 juli 1963 houdende aanpassing
    en vaststelling van de sluisprijzen voor eieren van pluimvee, levend pluimvee
    en geslacht pluimvee alsmede vaststelling van de heffingen ten opzichte van derde
    landen op eieren in de schaal van pluimvee, levend pluimvee dat niet meer dan
    185 gram weegt en geslacht pluimvee voor de periode van 1 augustus 1963 tot en
    met 30 september 1963
  type: main
