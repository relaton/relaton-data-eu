title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3728/81 of 21 December 1981 fixing withdrawal
    prices applicable until 31 December 1982 for the fishery products listed in Annex
    I (A) and (C) to Regulation (EEC) No 100/76 and for certain products landed in
    areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3728/81 de la Commission, du 21 décembre 1981, fixant
    les prix de retrait valables jusqu' au 31 décembre 1982, pour les produits de
    la pêche énumérés à l' annexe I sous A et C du règlement (CEE) n° 100/76,
    ainsi que pour certains produits débarqués dans des zones très éloignées
    des principaux centres de consommation de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3728/81 der Kommission vom 21. Dezember 1981 zur Festsetzung
    der bis 31. Dezember 1982 geltenden Rücknahmepreise für die im Anhang I unter
    A und C der Verordnung (EWG) Nr. 100/76 aufgeführten Fischereierzeugnisse sowie
    für bestimmte Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren
    der Gemeinschaft sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3728/81 af 21. december 1981 om fastsættelse
    af tilbagetagelsespriserne for perioden indtil den 31. december 1982 for de fiskerivarer,
    som er anført i afsnit A og C i bilag I til forordning (EØF) nr. 100/76, samt
    for visse af de i nævnte forordning omhandlede varer fra landingsområder, der
    ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3728/81 τής Επιτροπής
    τής 21ης Δεκεμβρίου 1981 περί καθορισμού τών τιμών
    αποσύρσεως πού ισχύουν έως τήν 31η Δεκεμβρίου
    1982 γιά τά προϊόντα αλιείας πού απαριθμούνται
    στό παράρτημα Ι υπό Α καί Γ τού κανονισμού (EOK)
    αριθ. 100/76 καθώς καί γιά ορισμένα προϊόντα πού
    εκφορτώνονται στίς ζώνες πού είναι πολύ απομακρυσμένες
    από τά κύρια κέντρα καταναλώσεως τής Κοινότητος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3728/81 della Commissione, del 21 dicembre 1981, che
    fissa, per i prodotti della pesca di cui all' allegato I, lettere A e C, nonché
    per taluni prodotti del regolamento (CEE) n. 100/76, sbarcati in zone molto lontane
    dai principali centri di consumo della Comunità, i prezzi di ritiro validi fino
    al 31 dicembre 1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3728/81 van de Commissie van 21 december 1981 tot
    vaststelling van de tot en met 31 december 1982 geldende ophoudprijzen voor de
    in bijlage I, sub A en C, van Verordening (EEG) nr. 100/76 genoemde visserijprodukten
    en voor bepaalde produkten die in ver van de voornaamste verbruikscentra van de
    Gemeenschap gelegen gebieden zijn aangevoerd
  type: main
