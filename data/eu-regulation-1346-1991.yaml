title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1346/91 of 22 May 1991 laying down rates
    of compensatory interest applicable during the second half of 1991 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward-processing relief arrangements)
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1346/91 DE LA COMMISSION du 22 mai 1991 fixant les
    taux d'' intérêts compensatoires applicables en cas de naissance d'' une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'' état
    (régime du perfectionnement actif) pendant le deuxième semestre de 1991 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1346/91 DER KOMMISSION vom 22. Mai 1991 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1991 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr)
    anzuwenden sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1346/91 af 22. maj 1991 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling) i andet
    halvår af 1991
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1346/91 της Επιτροπής
    της 22ας Μαΐου 1991 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γέννησης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή τα εμπορεύματα στην ίδια κατάσταση
    ( καθεστώς τελειοποίησης προς επανεξαγωγή
    ) κατά τη διάρκεια του δεύτερου εξαμήνου 1991
    )
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1346/91 DELLA COMMISSIONE del 22 maggio 1991 che
    determina i tassi di interesse compensatori applicabili ove sorga un'' obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo) nel secondo semestre 1991 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1346/91 VAN DE COMMISSIE van 22 mei 1991 tot vaststelling
    van de jaarlijkse intrestpercentages van toepassing in geval van het ontstaan
    van een douaneschuld voor veredelingsprodukten of onveredelde goederen (regeling
    actieve veredeling) tijdens het tweede semester 1991 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1346/91 DA COMISSAO, DE 22 DE MAIO DE 1991, QUE
