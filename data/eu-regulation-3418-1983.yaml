  content: Commission Regulation (EEC) No 3418/83 of 28 November 1983 laying down
    provisions for the uniform issue and use of the documents required for the implementation
    in the Community of the Convention on international trade in endangered species
    of wild fauna and flora
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3418/83 de la Commission du 28 novembre 1983 portant
    dispositions relatives à la délivrance et à l'utilisation uniformes des documents
    requis pour l'application dans la Communauté de la convention sur le commerce
    international des espèces de faune et de flore sauvages menacées d'extinction
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3418/83 der Kommission vom 28. November 1983 mit Bestimmungen
    für eine einheitliche Erteilung und Verwendung der bei der Anwendung des Übereinkommens
    über den internationalen Handel mit gefährdeten Arten freilebender Tiere und
    Pflanzen in der Gemeinschaft erforderlichen Dokumente
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3418/83 af 28. november 1983 om bestemmelser
    for ensartet udstedelse og anvendelse af dokumenter, nødvendiggjort af gennemførelsen
    i Fællesskabet af konventionen om international handel med udryddelsestruede
    vilde dyr og planter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3418/83 της Επιτροπής
    της 28ης Νοεμβρίου 1983 για τη θέσπιση των διατάξεων
    σχετικά με την ομοιόμορφη έκδοση και χρήση
    των εγγράφων που απαιτούνται για την εφαρμογή
    στην Κοινότητα της σύμβασης για το διεθνές
    εμπόριο των ειδών άγριας πανίδας και χλωρίδας
    που απειλούνται με εξαφάνιση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3418/83, annettu 28 päivänä marraskuuta 1983,
    luonnonvaraisen eläimistön ja kasviston uhanalaisten lajien kansainvälistä
    kauppaa koskevan yleissopimuksen soveltamiseksi yhteisössä vaadittujen yhdenmukaisten
    asiakirjojen myöntämistä ja käyttöä koskevista säännöksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3418/83 della Commissione del 28 novembre 1983 recante
