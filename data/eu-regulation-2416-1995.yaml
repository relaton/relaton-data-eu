title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2416/95 of 13 October 1995 laying down detailed
    rules for the application of Council Regulation (EC) No 2179/95 concerning the
    autonomous and transitional adaptation of certain agricultural concessions provided
    for in the Europe Agreements and amending Regulation (EC) No 3379/94 opening and
    administering certain Community tariff quotas in 1995 for certain agricultural
    products and for beer, as regards imports into the Community of certain agricultural
    products originating in Poland
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2416/95 de la Commission, du 13 octobre 1995, portant
    modalités d' application du règlement (CE) nº 2179/95 du Conseil prévoyant
    l' adaptation autonome et transitoire de certaines concessions agricoles prévues
    par les accords européens et modifiant le règlement (CE) nº 3379/94 portant
    ouverture et mode de gestion de certains contingents tarifaires communautaires
    en 1995 pour certains produits agricoles et pour la bière, en ce qui concerne
    les importations dans la Communauté de certains produits agricoles originaires
    de Pologne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2416/95 der Kommission vom 13. Oktober 1995 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 2179/95 des Rates über die autonome und vorübergehende
    Anpassung bestimmter in den Europa- Abkommen vorgesehener Zugeständnisse im Bereich
    Landwirtschaft sowie zur Änderung der Verordnung (EG) Nr. 3379/94 zur Eröffnung
    und Verwaltung von Gemeinschaftszollkontingenten für bestimmte landwirtschaftliche
    Erzeugnisse und für Bier (1995) in bezug auf die Einfuhren bestimmter landwirtschaftlicher
    Erzeugnisse mit Ursprung in Polen in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2416/95 af 13. oktober 1995 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 2179/95 om autonom og midlertidig tilpasning af
    visse landbrugsindrømmelser i Europaaftalerne og om ændring af forordning (EF)
    nr. 3379/94 om åbning og forvaltning af visse EF-kontingenter i 1995 for visse
    landbrugsprodukter og øl, hvad angår indførsel i Fællesskabet af visse landbrugsprodukter
    med oprindelse i Polen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2416/95 της Επιτροπής
    της 13ης Οκτωβρίου 1995 για τη θέσπιση των λεπτομερειών
    εφαρμογής του κανονισμού (ΕΚ) αριθ. 2179/95 του
    Συμβουλίου που προβλέπει την αυτόνομη και
    μεταβατική προσαρμογή ορισμένων γεωργικών
    παραχωρήσεων οι οποίες προβλέπονται στις ευρωπαϊκές
    συμφωνίες και για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 3379/94, για το άνοιγμα και τον τρόπο
    διαχείρισης ορισμένων κοινοτικών δασμολογικών
    ποσοστώσεων κατά το 1995, για ορισμένα γεωργικά
    προϊόντα και για την μπίρα, όσον αφορά τις εισαγωγές
    στην Κοινότητα ορισμένων γεωργικών προϊόντων
    προέλευσης Πολωνίας
  type: main
- language: fi
  script: Latn
