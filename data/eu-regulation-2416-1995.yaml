    suuntautuvan tuonnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2416/95 della Commissione, del 13 ottobre 1995, recante
    modalità d' applicazione del regolamento (CE) n. 2179/95 del Consiglio che prevede
    l' adattamento autonomo e transitorio di talune concessioni agricole previste
    dagli Accordi europei e che modifica il regolamento (CE) n. 3379/94 recante apertura
    e modalità di gestione di taluni contingenti tariffari comunitari nel 1995 per
    determinati prodotti agricoli e per la birra, per quanto riguarda l' importazione
    nella Comunità di taluni prodotti agricoli originari della Polonia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2416/95 van de Commissie van 13 oktober 1995 houdende
    uitvoeringsbepalingen van Verordening (EG) nr. 2179/95 van de Raad inzake een
    autonome en tijdelijke aanpassing van bepaalde in de Europa-overeenkomsten opgenomen
    landbouwconcessies en wijziging van Verordening (EG) nr. 3379/94 houdende opening
    en wijze van beheer van communautaire tariefcontingenten voor bepaalde landbouwprodukten
    en voor bier in 1995, wat betreft de invoer in de Gemeenschap van bepaalde landbouwprodukten
    van oorsprong uit Polen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2416/95 da Comissão, de 13 de Outubro de 1995, que
    estabelece normas de execução do Regulamento (CE) nº 2179/95 do Conselho que
    adapta, com carácter autónomo e transitório, certas concessões agrícolas
    previstas nos acordos europeus e altera o Regulamento (CE) nº 3379/94 relativo
    à abertura e modo de gestão de determinados contingentes pautais comunitários
    para certos produtos agrícolas e para a cerveja em 1995, no que diz respeito
    às importações para a Comunidade de certos produtos agrícolas originários
    da Polónia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2416/95 de la Comisión, de 13 de octubre de 1995,
    por el que se adoptan las disposiciones de aplicación del Reglamento (CE) nº
    2179/95 del Consejo relativo a la adaptación autónoma y transitoria de determinadas
    concesiones agrícolas establecidas en los Acuerdos europeos y se modifica el
    Reglamento (CE) nº 3379/94 relativo a la apertura y modo de gestión de determinados
    contingentes arancelarios comunitarios correspondientes a algunos productos agrícolas
    y a la cerveza para 1995, en lo que se refiere a las importaciones en la Comunidad
    de determinados productos agrícolas originarios de Polonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2416/95 av den 13 oktober 1995 om tillämpningsföreskrifter
    för rådets förordning (EG) nr 2179/95 om autonom anpassning under en övergångstid
    av vissa jordbrukskoncessioner som föreskrivs i Europaavtalen och om ändring
    av förordning (EG) nr 3379/94 om öppnande och förvaltning av vissa gemenskapstullkvoter
    år 1995 för vissa jordbruksprodukter samt öl i fråga om import till gemenskapen
    av vissa jordbruksprodukter med ursprung i Polen
