title:
- language: en
  script: Latn
  content: '77/681/EEC: Council Decision of 24 October 1977 amending Decision 76/402/EEC
    on the level of interest rate subsidy, provided for by Directive 72/159/EEC on
    the modernization of farms, to be applied in Italy, for the purposes of correcting
    Decision 77/343/EEC'
  type: main
- language: fr
  script: Latn
  content: '77/681/CEE: Décision du Conseil, du 24 octobre 1977, modifiant la décision
    76/402/CEE relative au niveau de bonification du taux d'' intérêt prévu par
    la directive 72/159/CEE concernant la modernisation des exploitations agricoles
    à appliquer en Italie, aux fins de rectification de la décision 77/343/CEE'
  type: main
- language: de
  script: Latn
