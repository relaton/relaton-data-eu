title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1407/91 of 28 May 1991 laying down the detailed
    rules for the free supply of beef to the Soviet Union as provided for in Council
    Regulation (EEC) No 598/91 on urgent action for the supply of agricultural and
    medical products intended for the people of the Soviet Union and amending Regulation
    (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1407/91 DE LA COMMISSION du 28 mai 1991 fixant certaines
    modalités relatives à la livraison gratuite de viande bovine à l'' Union soviétique
    conformément au règlement (CEE) no 598/91 du Conseil relatif à l'' action d''
    urgence pour la fourniture de produits agricoles destinés à la population d''
    Union soviétique et modifiant le règlement (CEE) no 569/88 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1407/91 DER KOMMISSION vom 28. Mai 1991 mit bestimmten
    Durchführungsbestimmungen für die kostenlose Lieferung von Rindfleisch nach
    der Sowjetunion gemäß der Verordnung (EWG) Nr. 598/91 des Rates über eine Dringlichkeitsmaßnahme
    zur Lieferung landwirtschaftlicher Erzeugnisse für die Bevölkerung der Sowjetunion
    sowie zur Änderung der Verordnung (EWG) Nr. 569/88 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1407/91 af 28. maj 1991 om visse gennemførelsesbestemmelser
    for gratis levering af oksekød til Sovjetunionen i henhold til Rådets forordning
    (EØF) nr. 598/91 om en hasteaktion vedrørende levering af landbrugsprodukter
    bestemt til befolkningen i Sovjetunionen, og om ændring af forordning (EØF)
    nr. 569/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1407/91 της Επιτροπής
    της 28ης Μαΐου 1991 που καθορίζει ορισμένες λεπτομέρειες
    σχετικά με τη δωρεάν παροχή βοείου κρέατος
    στη Σοβιετική Ένωση σύμφωνα με τον κανονισμό
    (ΕΟΚ) αριθ. 598/91 του Συμβουλίου σχετικά με την
    ανάληψη επείγουσας δράσης για την προμήθεια
    γεωργικών προϊόντων που προορίζονται για τον
    πληθυσμό της Σοβιετικής Ένωσης και που τροποποιεί
    τον κανονισμό (ΕΟΚ) αριθ. 569/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1407/91 DELLA COMMISSIONE del 28 maggio 1991 che
    stabilisce talune modalità della fornitura gratuita di carni bovine all'' Unione
    Sovietica ai sensi del regolamento (CEE) n. 598/91 del Consiglio relativo ad un''
    azione d'' urgenza per la fornitura di prodotti agricoli e medicinali destinati
    alla popolazione dell'' Unione Sovietica e che modifica il regolamento (CEE) n.
    569/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1407/91 VAN DE COMMISSIE van 28 mei 1991 tot vaststelling
    van nadere bepalingen inzake de kosteloze levering van rundvlees aan de Sowjetunie
    op grond van Verordening (EEG) nr. 598/91 van de Raad betreffende een noodmaatregel
    voor de levering van landbouwprodukten, bestemd voor de bevolking van de Sowjetunie,
    en tot wijziging van Verordening (EEG) nr. 569/88 #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1407/91 DA COMISSAO, DE 28 DE MAIO DE 1991, QUE
    ESTABELECE CERTAS NORMAS DE EXECUCAO PARA O FORNECIMENTO GRATUITO DE CARNE DE
    BOVINO A UNIAO SOVIETICA TAL COMO PREVISTO NO REGULAMENTO ( CEE ) NO 598/91 DO
    CONSELHO, RELATIVO A UMA ACCAO DE URGENCIA PARA O FORNECIMENTO DE PRODUTOS AGRICOLAS
    DESTINADOS A POPULACAO DA UNIAO SOVIETICA E QUE ALTERA O REGULAMENTO ( CEE ) NO
    569/88
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1407/91 DE LA COMISIÓN de 28 de mayo de 1991 por
    el que se establecen algunas normas de desarrollo para el suministro gratuito
    de carne de vacuno a la Unión Soviética, de acuerdo con lo dispuesto en el Reglamento
    (CEE) no 598/91 del Consejo, relativo a una acción de urgencia para el suministro
    de productos agrarios destinados a las poblaciones de la Unión Soviética y por
    el que se modifica el Reglamento (CEE) no 569/88 #'
