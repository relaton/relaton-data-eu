---
id: EURegulation7052005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 705/2005 of 4 May 2005 amending or repealing
    certain regulations on the classification of goods in the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 705/2005 de la Commission du 4 mai 2005 modifiant ou
    abrogeant certains règlements relatifs au classement de marchandises dans la
    nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 705/2005 der Kommission vom 4. Mai 2005 zur Änderung
    oder Aufhebung bestimmter Verordnungen zur Einreihung von Waren in die Kombinierte
    Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕO) № 705/2005 на Комисията от 4 май
    2005 година за изменение или отмяна на някои
    регламенти относно класирането на стоки в
    Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 705/2005 ze dne 4 května 2005, kterým se
    mění nebo zrušují některá nařízení o zařazení zboží do kombinované
    nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 705/2005 af 4. maj 2005 om ændring eller
    ophævelse af visse forordninger om tarifering af varer i den kombinerede nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 705/2005 της Επιτροπής,
    της 4ης Μαΐου 2005, για την τροποποίηση ή την κατάργηση
    ορισμένων κανονισμών για την κατάταξη εμπορευμάτων
    στη συνδυασμένη ονοματολογία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 705/2005, 4. mai 2005, millega muudetakse või
    tunnistatakse kehtetuks teatavad määrused kaupade klassifitseerimise kohta kombineeritud
    nomenklatuuris
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 705/2005, annettu 4 päivänä toukokuuta 2005,
    tavaroiden luokittelusta yhdistettyyn nimikkeistöön annettujen tiettyjen asetusten
    muuttamisesta tai kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba komisije (EZ) br. 705/2005 od 4. svibnja 2005. o izmjeni ili o stavljanju
    izvan snage određenih uredaba o razvrstavanju robe u kombiniranu nomenklaturu
  type: main
- language: hu
  script: Latn
  content: A Bizottság 705/2005/EK rendelete (2005. május 4.) az árucikkeknek a
    Kombinált Nómenklatúra szerinti besorolásáról szóló egyes rendeletek módosításáról,
    illetve hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 705/2005 della Commissione, del 4 maggio 2005, che
    modifica o abroga alcuni regolamenti relativi alla classificazione delle merci
    nella nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 705/2005 (2005. gada 4. maijs), ar ko groza vai
    atceļ dažas regulas par preču klasifikāciju kombinētajā nomenklatūrā
  type: main
- language: lt
  script: Latn
  content: 2005 m. gegužės 4 d. Komisijos reglamentas (EB) Nr. 705/2005, iš dalies
    keičiantis arba panaikinantis tam tikrus reglamentus dėl prekių klasifikavimo
    Kombinuotojoje nomenklatūroje
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 705/2005 tal- 4 ta' Mejju 2005 li jemenda
    jew iħassar ċerti regolamenti dwar il-klassifikazzjoni tal-oġġetti fin-Nomenklatura
    Magħquda
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 705/2005 van de Commissie van 4 mei 2005 tot wijziging
    of intrekking van bepaalde verordeningen betreffende de indeling van goederen
    in de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 705/2005 z dnia 4 maja 2005 r. zmieniające
    lub uchylające niektóre rozporządzenia w sprawie klasyfikacji towarów w Nomenklaturze
    Scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 705/2005 da Comissão, de 4 Maio de 2005, que altera
    ou revoga certos regulamentos relativos à classificação de mercadorias na Nomenclatura
    Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 705/2005 al Comisiei din 4 mai 2005 de modificare
    sau abrogare a anumitor regulamente privind clasificarea mărfurilor în Nomenclatura
    Combinată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 705/2005 zo 4. mája 2005, ktorým sa menia
    a dopĺňajú alebo zrušujú určité nariadenia o zatrieďovaní tovaru do kombinovanej
    nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 705/2005 z dne 4. maja 2005 o spremembi ali razveljavitvi
    nekaterih uredb o razvrstitvi blaga v kombinirani nomenklaturi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 705/2005 de la Comisión, de 4 de mayo de 2005, por
    el que se modifican o derogan determinados reglamentos relativos a la clasificación
    de las mercancías en la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 705/2005 av den 4 maj 2005 om ändring
    eller upphävande av vissa förordningar rörande klassificering av varor i Kombinerade
    nomenklaturen
  type: main
