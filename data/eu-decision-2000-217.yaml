title:
- language: en
  script: Latn
  content: '2000/217/EC: Commission Decision of 3 March 2000 prolonging the validity
    of Decision 1999/815/EC concerning measures prohibiting the placing on the market
    of toys and childcare articles intended to be placed in the mouth by children
    under three years of age made of soft PVC containing certain phthalates (notified
    under document number C(2000) 527)'
  type: main
- language: fr
  script: Latn
  content: '2000/217/CE: Décision de la Commission, du 3 mars 2000, prolongeant la
    validité de la décision 1999/815/CE concernant des mesures qui interdisent la
    mise sur le marché de jouets et articles de puériculture destinés à être
    mis en bouche par des enfants de moins de trois ans, fabriqués en PVC souple
    contenant certains phtalates [notifiée sous le numéro C(2000) 527]'
  type: main
- language: de
  script: Latn
  content: '2000/217/EG: Entscheidung der Kommission vom 3. März 2000 zur Verlängerung
    der Gültigkeit der Entscheidung 1999/815/EG über Maßnahmen zur Untersagung
    des Inverkehrbringens von Spielzeug- und Babyartikeln, die dazu bestimmt sind,
    von Kindern unter drei Jahren in den Mund genommen zu werden, und aus Weich-PVC
    bestehen, das bestimmte Weichmacher enthält (Bekanntgegeben unter Aktenzeichen
    K(2000) 527)'
  type: main
- language: da
  script: Latn
  content: '2000/217/EF: Kommissionens beslutning af 3. marts 2000 om forlængelse
    af gyldigheden af beslutning 1999/815/EF om forbud mod markedsføring af legetøj
    og småbørnsartikler, der er beregnet til at blive puttet i munden af børn under
    tre år, og som er fremstillet af blød pvc indeholdende visse phthalater (meddelt
    under nummer K(2000) 527)'
  type: main
- language: el
  script: Grek
  content: '2000/217/ΕΚ: Απόφαση της Επιτροπής, της 3ης
    Μαρτίου 2000, για παράταση της ισχύος της απόφασης
    1999/815/ΕΚ σχετικά με τα μέτρα που απαγορεύουν
    την διάθεση στην αγορά παιχνιδιών και προϊόντων
    παιδικής φροντίδας κατασκευασμένων από μαλακό
    PVC που περιέχει ορισμένους φθαλικούς εστέρες
    τα οποία κατά τη χρήση μπαίνουν στο στόμα παιδιών
    ηλικίας μικρότερης από τριών ετών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 527]'
  type: main
- language: fi
  script: Latn
  content: '2000/217/EY: Komission päätös, tehty 3 päivänä maaliskuuta 2000,
    toimenpiteistä, joilla kielletään tiettyjä ftalaatteja sisältävien, pehmeästä
    PVC:stä valmistettujen, alle kolmivuotiaiden lasten suuhun pantavaksi tarkoitettujen
    lelujen ja lastentarvikkeiden markkinoille saattaminen, tehdyn päätöksen 1999/815/EY
    voimassaoloajan pidentämisestä (tiedoksiannettu numerolla K(2000) 527)'
  type: main
- language: it
  script: Latn
  content: '2000/217/CE: Decisione della Commissione, del 3 marzo 2000, che proroga
    la validità della decisione 1999/815/CE riguardante provvedimenti che vietano
    l''immissione sul mercato di giocattoli e articoli di puericultura destinati ad
    essere messi in bocca da bambini d''età inferiore a tre anni e fabbricati in
    PVC morbido contenente taluni ftalati [notificata con il numero C(2000) 527]'
  type: main
- language: nl
  script: Latn
  content: '2000/217/EG: Beschikking van de Commissie van 3 maart 2000 ter verlenging
    van de geldigheidsduur van Beschikking 1999/815/EG betreffende maatregelen houdende
    verbod op het op de markt brengen van speelgoed- en kinderverzorgingsartikelen
    die bestemd zijn om door kinderen jonger dan drie jaar in de mond te worden gestopt
    en vervaardigd zijn van zacht PVC dat bepaalde ftalaten bevat (kennisgeving geschied
    onder nummer C(2000) 527)'
  type: main
- language: pt
  script: Latn
  content: '2000/217/CE: Decisão da Comissão, de 3 de Março de 2000, que prorroga
    o período de validade da Decisão 1999/815/CE relativa a medidas de proibição
    da colocação no mercado de brinquedos e artigos de puericultura destinados a
    ser introduzidos na boca por crianças com menos de três anos de idade, fabricados
    em PVC maleável que contenha determinados ftalatos [notificada com o número
    C(2000) 527]'
  type: main
- language: es
  script: Latn
  content: '2000/217/CE: Decisión de la Comisión, de 3 de marzo de 2000, por la
