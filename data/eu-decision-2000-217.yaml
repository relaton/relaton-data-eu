    phtalatos [notificada con el número C(2000) 527]'
  type: main
- language: sv
  script: Latn
  content: '2000/217/EG: Kommissionens beslut av den 3 mars 2000 med förlängning
    av beslut 1999/815/EG beträffande åtgärder för att förbjuda utsläppandet
    på marknaden av leksaker och barnavårdsartiklar som är avsedda att stoppas
    i munnen av barn under tre års ålder, tillverkade i mjukt PVC-plast som innehåller
    vissa ftalater [delgivet med nr K(2000) 527]'
