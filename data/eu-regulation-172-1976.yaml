title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 172/76 of 27 January 1976 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 172/76 de la Commission, du 27 janvier 1976, portant
    rétablissement de la perception des droits de douane applicables à l'acide glutamique
    et ses sels, de la sous-position tarifaire 29.23 D III, originaires des pays en
    voie de développement bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 172/76 der Kommission vom 27. Januar 1976 zur Wiedereinführung
    des Zollsatzes für Glutaminsäure und ihre Salze der Tarifstelle 29.23 D III
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 172/76 af 27. januar 1976 om genindførelse
    af opkrævning af toldafgifter for glutaminsyre samt salte deraf under underposition
    29.23 D III, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 172/76 della Commissione, del 27 gennaio 1976, che
    ripristina la riscossione dei dazi doganali applicabili all'acido glutammico e
    suoi sali, della sottovoce doganale n. 29.23 D III, originari dei paesi in via
    di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 172/76 van de Commissie van 27 januari 1976 houdende
    wederinstelling van de heffing van de douanerechten voor glutaminezuur en zouten
    daarvan, van onderverdeling 29.23 D III, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 tariefpreferenties werden geopend
  type: main
