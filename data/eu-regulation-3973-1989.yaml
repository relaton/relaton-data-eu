title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3973/89 of 18 December 1989 fixing, for 1990,
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of a Member State apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3973/89 du Conseil du 18 décembre 1989 fixant, pour
    1990, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction d'un Etat membre à l'exception de l'Espagne
    et du Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3973/89 DES RATES vom 18. Dezember 1989 zur Festlegung
    bestimmter Massnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    fuer Schiffe unter portugiesischer Flagge in den Gewaessern unter der Hoheitsgewalt
    oder Gerichtsbarkeit eines Mitgliedstaats, mit Ausnahme Spaniens und Portugals
    (1990)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3973/89 af 18. december 1989 om fastsættelse
    for 1990 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområder eller jurisdiktion, med
    undtagelse af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3973/89 του Συμβουλίου
    της 18ης Δεκεμβρίου 1989 για τον καθορισμό, για
    το 1990, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με πορτογαλική σημαία στα ύδατα που υπάγονται
    στην κυριαρχία ή τη δικαιοδοσία κράτους μέλους,
    εκτός της Ισπανίας και της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3973/89 DEL CONSIGLIO del 18 dicembre 1989 che fissa,
    per il 1990, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera del Portogallo nelle acque soggette alla
    sovranità o alla giurisdizione di uno Stato membro, esclusi la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3973/89 VAN DE RAAD van 18 december 1989 tot vaststelling,
    voor 1990, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op de vlag van Portugal voerende vaartuigen,
    in de wateren die onder de soevereiniteit of de jurisdictie van de Lid-Staten
    vallen, met uitzondering van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3973/89 DO CONSELHO de 18 de Dezembro de 1989 que
    fixa, para 1990, certas medidas de conservaçao e de gestao dos recursos da pesca
    aplicaveis aos navios arvorando pavilhao de Portugal nas aguas sob soberania ou
    jurisdiçao de um Estado-membro, com excepçao de Espanha e de Portugal
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3973/89 DEL CONSEJO de 18 de diciembre de 1989 por
    el que se fijan, para 1990, determinadas medidas de conservacion y de gestion
    de los recursos de pesca aplicables a los buques bajo pabellon de Portugal en
    las aguas sometidas a la soberania o a la jurisdiccion de cualquier Estado miembro,
    excepto Espana y Portugal
