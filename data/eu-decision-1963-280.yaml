title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 avril 1963, portant prorogation et nouvelle
    modification de sa décision du 5 juillet 1962, autorisant la perception d'une
    taxe compensatoire sur les importations, en République fédérale d'Allemagne,
    de pâte à fondant en provenance du Royaume des Pays-Bas, du Royaume de Belgique
    et de la République française
  type: main
- language: de
  script: Latn
  content: '63/280/EWG: Entscheidung der Kommission vom 10. April 1963 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 5. Juli 1962 über die Erhebung
    einer Ausgleichsabgabe auf Einfuhren von Fondantmasse aus dem Königreich der
    Niederlande, dem Königreich Belgien und der Französischen Republik in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/280/CEE: Decisione della Commissione del 10 aprile 1963 recante proroga
    e nuova modifica alla propria decisione del 5 luglio 1962, relativa all''autorizzazione
    a riscuotere una tassa di compensazione sulle importazioni di pasta per fondente
    nella Repubblica federale di Germania, in provenienza dal Regno dei Paesi Bassi,
    dal Regno del Belgio e dalla Repubblica francese'
  type: main
- language: nl
  script: Latn
  content: '63/280/EEG: Beschikking van de Commissie van 10 april 1963 houdende verlenging
    en nadere wijziging van haar beschikking van 5 juli 1962, waarbij machtiging werd
    verleend tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van fondantmassa, uit het Koninkrijk der Nederlanden, het Koninkrijk
    België en de Franse Republiek'
  type: main
