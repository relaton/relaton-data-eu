title:
- language: fr
  script: Latn
  content: '69/315/CEE: Décision de la Commission, du 14 août 1969, autorisant la
    République française, en vertu de l''article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire les "coeurs de palmiers au naturel", de la position
    Ex 21.07 F du Tarif douanier commun originaires du Brésil et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '69/315/EWG: Entscheidung der Kommission vom 14. August 1969, mit der die
    Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche "Palmherzen, ohne Zusätze", der Tarifnummer ex 21.07 F des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/315/CEE: Decisione della Commissione, del 14 agosto 1969, che autorizza
    la Repubblica francese, a norma dell''articolo 115, comma 1, del trattato, ad
    escludere dal trattamento comunitario i « cuori di palma al naturale », della
    voce ex 21.07 F della tariffa doganale comune, originari del Brasile ed immessi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/315/EEG: Beschikking van de Commissie van 14 augustus 1969 waarbij
    de Franse Republiek wordt gemachtigd om op grond van artikel 115, eerste alinea,
    van het Verdrag palmieten, zonder toevoegingen, van post ex 21.07 F van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit Brazilië en in de andere Lid-Staten
    in het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
