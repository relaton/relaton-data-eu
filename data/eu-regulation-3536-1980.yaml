  script: Latn
  content: Regolamento (CEE) n. 3536/80 del Consiglio, del 22 dicembre 1980, relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e il Regno del Marocco, che fissa, per il periodo dal 1° novembre
    1980 al 31 ottobre 1981, l' importo aggiuntivo da detrarre dal prelievo applicabile
    all' importazione nella Comunità di olio di oliva non trattato originario del
    Marocco
  type: main
- language: nl
