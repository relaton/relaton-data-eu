title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3536/80 of 22 December 1980 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period from 1 November 1980 to 31 October 1981
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3536/80 du Conseil, du 22 décembre 1980, concernant
    la conclusion de l'accord sous forme d'échange de lettres entre la Communauté
    économique européenne et le Royaume du Maroc fixant, pour la période du 1er
    novembre 1980 au 31 octobre 1981, le montant additionnel à déduire du prélèvement
    applicable à l'importation dans la Communauté d'huile d'olive non traitée originaire
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3536/80 des Rates vom 22. Dezember 1980 über den
    Abschluß des Abkommens in Form eines Briefwechsels zwischen der Europäischen
    Wirtschaftsgemeinschaft und dem Königreich Marokko zur Festsetzung des vom 1.
    November 1980 bis 31. Oktober 1981 geltenden Zusatzbetrags, der bei der Einfuhr
    in die Gemeinschaft von nicht behandeltem Olivenöl mit Ursprung in Marokko von
    der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3536/80 af 22. december 1980 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og kongeriget Marokko vedrørende fastsættelse for perioden fra den 1. november
    1980 til den 31. oktober 1981 af det tillægsbeløb, som skal fratrækkes den
    afgift, der anvendes ved indførsel til Fællesskabet af ikke behandlet olivenolie
    med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3536/80 τού Συμβουλίου
    τής 22ας Δεκεμβρίου 1980 περί συνάψεως συμφωνίας
    υπό μορφήν ανταλλαγής επιστολών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί τού
    Βασιλείου τού Μαρόκου «περί καθορισμού, γιά
    τήν περίοδο από 1ης Νοεμβρίου 1980 μέχρι 31ης Οκτωβρίου
