title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1905/69 of the Council of 30 September 1969 postponing
    the date for the application of Regulation (EEC) No 441/69 laying down additional
    general rules for granting export refunds on products subject to a single price
    system, exported unprocessed or in the form of certain goods not covered by Annex
    II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1905/69 du Conseil, du 30 septembre 1969, reportant
    la date de mise en application du règlement (CEE) n° 441/69 établissant des
    règles générales complémentaires concernant l' octroi des restitutions à
    l' exportation pour les produits soumis à un régime de prix uniques, exportés
    en l' état ou sous forme de certaines marchandises ne relevant pas de l' annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1905/69 des Rates vom 30. September 1969 zur Verschiebung
    des Zeitpunkts des Beginns der Anwendung der Verordnung (EWG) Nr. 441/69 zur Festlegung
    ergänzender Grundregeln für die Gewährung von Ausfuhrerstattungen für die
    einer einheitlichen Preisregelung unterliegenden Erzeugnisse, die unbearbeitet
    oder in Form bestimmter, nicht unter Anhang II des Vertrages fallender Waren ausgeführt
    werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1905/69 af 30. september 1969 om udsættelse
    af anvendelsestidspunktet for forordning (EØF) nr. 441/69 om fastsættelse af
    almindelige supplerende regler for ydelse af eksportrestitutioner for de produkter,
    for hvilke der er fastsat fælles priser, og som er udført i uforarbejdet stand
    eller i form af visse varer, der ikke omtales i bilag II til traktaten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1905/69 τού Συμβουλίου
    τής 30ής Σεπτεμβρίου 1969 περί μεταθέσεως τής
    ημερομηνίας θέσεως σέ εφαρμογή τού κανονισμού
    (ΕΟΚ) αριθ. 441/69 «περί καθορισμού γενικών συμπληρωματικών
    κανόνων γιά τή χορήγηση επιστροφών κατά τήν
    εξαγωγή γιά τά προϊόντα πού υπόκεινται σέ καθεστώς
    ενιαίων τιμών καί εξάγονται στήν κατάσταση
    πού ευρίσκονται ή υπό μορφή ορισμένων εμπορευμάτων
    πού δέν υπάγονται στό παράρτημα ΙΙ τής συνθήκης»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1905/69 del Consiglio, del 30 settembre 1969, che
    proroga la data d' applicazione del regolamento (CEE) n. 441/69 che stabilisce
    le norme generali complementari concernenti la concessione delle restituzioni
    all' esportazione per i prodotti soggetti a un regime di prezzi unici, esportati
    allo stato naturale o sotto forma di talune merci non comprese nell' allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1905/69 van de Raad van 30 september 1969 houdende
    verschuiving van de datum waarop Verordening (EEG) nr. 441/69 houdende aanvullende
    algemene voorschriften betreffende de toekenning van restituties bij uitvoer van
    produkten die aan een stelsel van gemeenschappelijke prijzen zijn onderworpen
    en die als zodanig of in de vorm van bepaalde niet in bijlage II van het Verdrag
    vermelde goederen worden uitgevoerd, van toepassing wordt
  type: main
