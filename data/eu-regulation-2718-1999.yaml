    (EB) Nr. 1766/92 taikymą dėl minimalių kainų ir kompensacijų, išmokėtinų
    bulvių augintojams, bei Tarybos reglamento (EB) Nr. 1868/94, nustatančio bulvių
    krakmolo gamybos kvotų sistemą, taikymo taisykles
  type: main
