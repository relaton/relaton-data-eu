  script: Latn
  content: Commission Regulation (EC) No 2718/1999 of 20 December 1999 amending Regulation
    (EC) No 97/95 laying down detailed rules for the application of Council Regulation
    (EEC) No 1766/92 as regards the minimum price and compensatory payment to be paid
    to potato producers and of Council Regulation (EC) No 1868/94 establishing a quota
    system in relation to the production of potato starch
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2718/1999 de la Commission, du 20 décembre 1999, modifiant
    le règlement (CE) nº 97/95 fixant les modalités d'application du règlement
    (CEE) nº 1766/92 du Conseil en ce qui concerne le prix minimal et le paiement
    compensatoire à payer aux producteurs de pommes de terre ainsi que du règlement
    (CE) nº 1868/94 du Conseil instituant un régime de contingentement pour la production
    de fécule de pomme de terre
  type: main
