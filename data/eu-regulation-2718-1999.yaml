  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2718/1999 della Commissione, del 20 dicembre 1999,
    recante modifica del regolamento (CE) n. 97/95 che stabilisce le modalità d'applicazione
    del regolamento (CEE) n. 1766/92 del Consiglio per quanto concerne il prezzo minimo
    e l'indennità compensativa da pagare ai produttori di patate nonché del regolamento
    (CE) n. 1868/94 del Consiglio che istituisce un regime di contingentamento per
    la produzione di fecola di patate
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2718/1999 (1999. gada 20. decembris), kas groza
    Regulu (EK) Nr. 97/95, ar kuru paredz sīki izstrādātus noteikumus par to, kā
    piemērot Padomes Regulu (EEK) Nr. 1766/92 attiecībā uz minimālo cenu un kompensācijas
    maksājumiem, kas pienākas kartupeļu audzētājiem, un Padomes Regulu (EK) Nr.
    1868/94, ar ko ievieš kvotu sistēmu attiecībā uz kartupeļu cietes ražošanu
  type: main
