title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 8 septembre 1970, autorisant la République
    italienne à exclure du traitement communautaire les motocycles de la position
    Ex 87.09 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/435/EWG: Entscheidung der Kommission vom 8. September 1970, mit der
    die Italienische Republik ermächtigt wird, die aus Japan stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen Krafträder der Tarifnummer
    ex 87.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/435/CEE: Decisione della Commissione, dell''8 settembre 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i motocicli della
    voce ex 87.09 della tariffa doganale comune, originari del Giappone e messi in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/435/EEG: Beschikking van de Commissie van 8 september 1970 waarbij
    de Italiaanse Republiek wordt gemachtigd motorrijwielen van post ex 87.09 van
    het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
