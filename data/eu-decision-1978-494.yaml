id: EUDecision1978494
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 May 1978 authorizing the Italian Republic not
    to apply Community treatment to synthetic rubber latex, falling within heading
    No ex 40.02 of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/494/CEE: Décision de la Commission, du 23 mai 1978, autorisant la
    République italienne à exclure du traitement communautaire le caoutchouc synthétique
    de la position Ex 40.02 du Tarif douanier commun, originaire de Roumanie et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Mai 1978, mit der die Italienische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Latex von synthetischem Kautschuk der Tarifnummer
    ex 40.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 23. maj 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage syntetisk gummilatex, som henhører
    under pos. 40.02 i den fælles toldtarif, har oprindelse i Rumænien og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 maggio 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario la gomma sintetica della voce
    ex 40.02 della tariffa doganale comune, originaria della Romania e messa in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 mei 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd synthetische rubber, van post ex 40.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
