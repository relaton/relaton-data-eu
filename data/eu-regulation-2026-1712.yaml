    Tagetes erecta L. για γαλοπούλες προς πάχυνση
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2026/1712, 20. juuli 2026, millega muudetakse
    ja parandatakse rakendusmäärust (EL) 2020/1097 Tagetes erecta’st saadud luteiinirikka
    ekstrakti ja luteiini-/zeaksantiiniekstrakti nuum- ja munalindude (välja arvatud
    kalkunid) ning vähem levinud kodulinnuliikide nuum- ja munalindude söödalisanditena
    kasutamise loa tingimuste osas ning muudetakse rakendusmäärust (EL) 2025/1928
    Tagetes erecta’st saadud luteiinirikka ekstrakti kalkunibroilerite söödalisandina
    kasutamise loa tingimuste osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2026/1712, annettu 20 päivänä
    heinäkuuta 2026, täytäntöönpanoasetuksen (EU) 2020/1097 muuttamisesta ja
    oikaisemisesta siltä osin kuin on kyse Tagetes erecta -kasvista saatavien runsaasti
    luteiinia sisältävien uutteiden ja luteiini-/zeaksantiiniuutteiden hyväksynnän
    ehdoista sellaisten siipikarjalajien (kalkkunat pois lukien) ja toissijaisten
    siipikarjalajien, joita kasvatetaan lihan- ja munantuotantoa varten, rehun lisäaineina
    ja täytäntöönpanoasetuksen (EU) 2025/1928 muuttamisesta siltä osin kuin on
    kyse Tagetes erecta L. -kasvista saatavan runsaasti luteiinia sisältävän uutteen
    hyväksynnän ehdoista lihakalkkunoiden rehun lisäaineena
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2026/1712 ón gCoimisiún an 20 Iúil
    2026 lena leasaítear agus lena gceartaítear Rialachán Cur Chun Feidhme (AE)
    2020/1097 a mhéid a bhaineann le téarmaí údaraithe eastóscáin ar mhórán
    lúitéine, agus eastóscáin lúitéine/seaxaintine, ó Tagetes erecta mar bhreiseáin
    bheathaithe le haghaidh éanlaith chlóis (seachas turcaithe) a bhfuiltear lena
    ramhrú agus lena dtógáil le bheith ina mbéaróga agus le haghaidh mionspeicis
    éanlaithe clóis a bhfuiltear lena ramhrú agus lena dtógáil le bheith ina
    mbéaróga agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2025/1928 a
    mhéid a bhaineann le téarmaí údaraithe eastóscáin ar mhórán lúitéine
    de Tagetes erecta L. le haghaidh turcaithe a bhfuiltear lena ramhrú
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2026/1712 оd 20. srpnja 2026. o izmjeni
    i ispravku Provedbene uredbe (EU) 2020/1097 u pogledu uvjeta odobrenja ekstrakta
    bogatog luteinom i ekstrakta luteina/zeaksantina dobivenih iz Tagetes erecta kao
    dodataka hrani za perad (osim purana) za tov i nesenje i za manje značajne vrste
    peradi za tov i nesenje te o izmjeni Provedbene uredbe (EU) 2025/1928 u pogledu
