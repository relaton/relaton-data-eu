    gazdag kivonat és lutein-/zeaxantinkivonat hízó- és tojóbaromfi (a pulykák
    kivételével), valamint kevésbé jelentős hízó- és tojóbaromfifajok takarmány-adalékanyagaként
    történő engedélyezésére vonatkozó feltételek tekintetében történő
    módosításáról és helyesbítéséről, továbbá az (EU) 2025/1928 végrehajtási
    rendeletnek a Tagetes erecta L. luteinben gazdag kivonatának hízópulykák esetében
