  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/1712 της Επιτροπής,
    της 20ής Ιουλίου 2026, για την τροποποίηση και
    τη διόρθωση του εκτελεστικού κανονισμού (ΕΕ)
