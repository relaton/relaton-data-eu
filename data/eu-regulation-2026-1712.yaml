    de aves de capoeira de engorda e de postura e que altera o Regulamento de Execução
    (UE) 2025/1928 no que se refere aos termos da autorização do extrato rico em
    luteína de Tagetes erecta L. para perus de engorda
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/1712 al Comisiei din 20 iulie
    2026 de modificare și rectificare a Regulamentului de punere în aplicare (UE)
    2020/1097 în ceea ce privește condițiile de autorizare a extractului bogat
    în luteină și a extractului de luteină/zeaxantină din Tagetes erecta ca aditivi
    pentru hrana păsărilor de curte (cu excepția curcanilor) pentru îngrășare
    și ouat și a speciilor minore de păsări de curte pentru îngrășare și ouat
    și de modificare a Regulamentului de punere în aplicare (UE) 2025/1928 în ceea
    ce privește condițiile de autorizare a extractului bogat în luteină din Tagetes
    erecta L. pentru curcanii pentru îngrășare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/1712 z 20. júla 2026, ktorým
    sa mení a opravuje vykonávacie nariadenie (EÚ) 2020/1097, pokiaľ ide o podmienky
    povolenia extraktov z Tagetes erecta bohatých na luteín a obsahujúcich luteín/zeaxantín
    ako kŕmnych doplnkových látok pre hydinu (okrem moriek) vo výkrme a na znášku
    a pre menej významné druhy hydiny vo výkrme a na znášku, a ktorým sa mení
    vykonávacie nariadenie (EÚ) 2025/1928, pokiaľ ide o podmienky povolenia extraktu
    z Tagetes erecta L. bohatého na luteín pre morky vo výkrme
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/1712 z dne 20. julija 2026 o spremembi
    in popravku Izvedbene uredbe (EU) 2020/1097 glede pogojev dovoljenja za izvleček
    iz Tagetes erecta, bogat z luteinom, in izvleček iz Tagetes erecta z luteinom/zeaksantinom
    kot krmna dodatka za perutnino (razen za purane) za pitanje in nesnice ter za
    manj pomembne vrste perutnine za pitanje in nesnice ter o spremembi Izvedbene
    uredbe (EU) 2025/1928 glede pogojev dovoljenja za izvleček iz Tagetes erecta
    L., bogat z luteinom, za purane za pitanje
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/1712 de la Comisión, de 20 de julio
    de 2026, por el que se modifica y corrige el Reglamento de Ejecución (UE) 2020/1097
    en lo que respecta a los términos de la autorización de los extractos de Tagetes
    erecta ricos en luteína y a base de luteína/ceaxantina como aditivos en piensos
    para aves de corral de engorde y ponedoras (excepto los pavos) y para especies
    menores de aves de corral de engorde y ponedoras, y se modifica el Reglamento
    de Ejecución (UE) 2025/1928 en lo que respecta a los términos de la autorización
    del extracto rico en luteína de Tagetes erecta L. para pavos de engorde
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/1712 av den 20 juli 2026
    om ändring och rättelse av genomförandeförordning (EU) 2020/1097 vad gäller
    villkoren för godkännande av luteinrika extrakt och lutein-/zeaxantinextrakt
    från Tagetes erecta som fodertillsatser för slaktfjäderfä och värpfjäderfä
    (utom kalkon) och för mindre vanligt förekommande fjäderfäarter avsedda för
    slakt eller som föds upp för värpning, och om ändring av genomförandeförordning
    (EU) 2025/1928 vad gäller villkoren för godkännande av luteinrikt extrakt av
    Tagetes erecta L. för slaktkalkoner
