    (met uitzondering van kalkoenen) en voor minder gangbare pluimveesoorten gehouden
    voor mest- en legdoeleinden en tot wijziging van Uitvoeringsverordening (EU) 2025/1928
    wat betreft de voorwaarden voor de verlening van een vergunning voor luteïnerijk
    extract van Tagetes erecta L. voor mestkalkoenen
  type: main
