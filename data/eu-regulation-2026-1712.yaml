id: EURegulation20261712
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1712 of 20 July 2026 amending
    and correcting Implementing Regulation (EU) 2020/1097 as regards the terms of
    the authorisation of lutein-rich and lutein/zeaxanthin extracts from Tagetes erecta
    as feed additives for poultry (except turkeys) for fattening and laying and for
    minor poultry species for fattening and laying and amending Implementing Regulation
    (EU) 2025/1928 as regards the terms of the authorisation of lutein-rich extract
    of Tagetes erecta L. for turkeys for fattening
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1712 de la Commission du 20 juillet
    2026 modifiant et rectifiant le règlement d’exécution (UE) 2020/1097 en ce
    qui concerne les conditions d’autorisation de l’extrait riche en lutéine
    et de l’extrait de lutéine/zéaxanthine tirés de Tagetes erecta en tant qu’additifs
    pour l’alimentation des volailles (à l’exception des dindes) à l’engrais
    ou de ponte et des espèces mineures de volailles à l’engrais ou de ponte,
    et modifiant le règlement d’exécution (UE) 2025/1928 en ce qui concerne les
    conditions d’autorisation de l’extrait riche en lutéine tiré de Tagetes
    erecta L. pour les dindons d’engraissement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1712 der Kommission vom 20. Juli 2026
    zur Änderung und Berichtigung der Durchführungsverordnung (EU) 2020/1097 hinsichtlich
    der Bedingungen für die Zulassung von luteinreichem Extrakt und von Lutein-/Zeaxanthinextrakt
    aus Tagetes erecta als Zusatzstoffe in Futtermitteln für Mast- und Legegeflügel
    (ausgenommen Truthühner) und für Mast- und Legegeflügelarten von geringerer
    wirtschaftlicher Bedeutung und zur Änderung der Durchführungsverordnung (EU)
    2025/1928 hinsichtlich der Bedingungen für die Zulassung von luteinreichem Extrakt
    aus Tagetes erecta L. für Masttruthühner
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/1712 на Комисията
    от 20 юли 2026 година за изменение и поправка на
    Регламент за изпълнение (ЕС) 2020/1097 по отношение
    на условията за разрешаване на богат на лутеин
    екстракт и съдържащ лутеин/зеаксантин екстракт
    от Tagetes erecta като фуражни добавки за домашни
    птици (с изключение на пуйки), за угояване и
    за носачки, както и за домашни птици с по-малко
    стопанско значение, за угояване и за носачки,
    и за изменение на Регламент за изпълнение (ЕС)
    2025/1928 по отношение на условията на разрешението
    на богат на лутеин екстракт от Tagetes erecta L. като
    фуражна добавка за пуйки за угояване
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/1712 ze dne 20. července 2026,
    kterým se mění a opravuje prováděcí nařízení (EU) 2020/1097, pokud jde
    o podmínky povolení extraktů s vysokým obsahem luteinu a s luteinem/zeaxanthinem
    z Tagetes erecta jako doplňkových látek pro drůbež na výkrm a snášku (s
    výjimkou krůt) a menšinové druhy drůbeže na výkrm a snášku, a kterým
    se mění prováděcí nařízení (EU) 2025/1928, pokud jde o podmínky povolení
    extraktu s vysokým obsahem luteinu z Tagetes erecta L. pro výkrm krůt
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/1712 af 20. juli 2026
    om ændring og berigtigelse af gennemførelsesforordning (EU) 2020/1097 for så
    vidt angår betingelserne for godkendelse af ekstrakt med højt indhold af lutein
    samt lutein-/zeaxanthinekstrakt fra Tagetes erecta som fodertilsætningsstof til
    slagtefjerkræ (undtagen kalkuner) og æglæggende fjerkræ samt mindre udbredt
    slagtefjerkræ og mindre udbredt æglæggende fjerkræ og om ændring af gennemførelsesforordning
    (EU) 2025/1928 for så vidt angår betingelserne for godkendelse af ekstrakt med
    højt indhold af lutein af Tagetes erecta L. til slagtekalkuner
  type: main
