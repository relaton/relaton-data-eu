    w odniesieniu do warunków zezwolenia na stosowanie wyciągu bogatego w luteinę
    i wyciągu luteiny/zeaksantyny z Tagetes erecta jako dodatków paszowych dla drobiu
    rzeźnego i nieśnego (z wyjątkiem indyków) oraz podrzędnych gatunków drobiu
    rzeźnego i nieśnego oraz w sprawie zmiany rozporządzenia wykonawczego (UE)
    2025/1928 w odniesieniu do warunków zezwolenia na stosowanie bogatego w luteinę
    wyciągu z Tagetes erecta L. u indyków rzeźnych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2026/1712 da Comissão, de 20 de julho de
