    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/1712 della Commissione, del 20 luglio
    2026, che modifica e rettifica il regolamento di esecuzione (UE) 2020/1097 per
    quanto riguarda i termini dell’autorizzazione degli estratti ricchi di luteina
    e degli estratti di luteina/zeaxantina da Tagetes erecta come additivi per mangimi
    destinati al pollame (ad eccezione dei tacchini) da ingrasso e allevato per la
    produzione di uova e a specie avicole minori da ingrasso e allevate per la produzione
    di uova e che modifica il regolamento di esecuzione (UE) 2025/1928 per quanto
    riguarda i termini dell’autorizzazione dell’estratto di Tagetes erecta L.
    ricco di luteina destinato ai tacchini da ingrasso
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/1712 (2026. gada 20. jūlijs),
    ar ko groza Īstenošanas regulu (ES) 2020/1097 attiecībā uz nosacījumiem atļaujā
    ar luteīnu bagātu (bagātinātu) ekstraktu un luteīna/zeaksantīna ekstraktu,
    kas abi iegūti no Tagetes erecta, izmantot par barības piedevām tādiem gaļas
