title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1725/87 of 19 June 1987 fixing for the 1987/88
    marketing year the components intended to ensure protection of the processing
    industry in the cereals and rice sector in trade between Spain and the Community
    of Ten
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1725/87 de la Commission du 19 juin 1987 déterminant
    pour la campagne 1987/1988 les éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l' industrie de transformation applicable
    aux échanges entre l' Espagne et la Communauté à dix
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1725/87 der Kommission vom 19. Juni 1987 zur Festsetzung
    der Bestandteile zum Schutz der Verarbeitungsindustrie im Getreide- und Reissektor
    beim Handel zwischen Spanien und der Zehnergemeinschaft für das Wirtschaftsjahr
    1987/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1725/87 af 19. juni 1987 om fastsættelse
    af de elementer for produktionsåret 1987/88, der anvendes i forbindelse med samhandelen
    mellem Spanien og De Ti og som i korn- og rissektoren skal beskytte forarbejdningsindustrien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1725/87 της Επιτροπής
    της 19ης Ιουνίου 1987 που καθορίζει, για την περίοδο
    εμπορίας 1987/88, τα στοιχεία που προορίζονται
    να εξασφαλίσουν στον τομέα των σιτηρών και
    του ρυζιού την εφαρμοζόμενη στις συναλλαγές
    μεταξύ της Ισπανίας και της Κοινότητας των
    Δέκα προστασία της βιομηχανίας μεταποίησης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1725/87 della Commissione del 19 giugno 1987 che stabilisce
    per la campagna 1987/1988 gli elementi destinati a garantire, nel settore dei
    cereali e del riso, la protezione dell' industria di trasformazione applicabile
    negli scambi tra la Spagna e la Comunità a dieci
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1725/87 van de Commissie van 19 juni 1987 tot vaststelling
    van de voor het verkoopseizoen 1987/1988 geldende elementen ter bescherming van
    de verwerkende industrie in de sector granen en rijst in het handelsverkeer tussen
    Spanje en de Gemeenschap van de Tien
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1725/87 da Comissão de 19 de Junho de 1987 que
    determina, para a campanha de 1987/1988, os elementos destinados a assegurar,
    no sector dos cereais e do arroz, a protecção da indústria transformadora aplicável
    às trocas comerciais entre a Espanha e a Comunidade dos Dez
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1725/87 de la Comisión de 19 de junio de 1987 por
    el que se determinan los elementos destinados a asegurar la protección de la
    industria de transformación aplicable a los intercambios entre España y la Comunidad
    de los Diez, en el sector de los cereales y del arroz para la campaña 1987/88
