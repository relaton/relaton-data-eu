    der Tarifstelle 31.02 B des Gemeinsamen Zolltarifs mit Ursprung in Saudi-Arabien,
    dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
