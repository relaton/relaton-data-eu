  content: Commission Regulation (EEC) No 2784/79 of 12 December 1979 laying down
    provisions for the implementation of Council Regulation (EEC) No 1798/75 on the
    importation free of Common Customs Tariff duties of educational, scientific or
    cultural materials
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2784/79 de la Commission, du 12 décembre 1979, fixant
    les dispositions d' application du règlement (CEE) n° 1798/75 du Conseil relatif
    à l' importation en franchise des droits du tarif douanier commun des objets
    de caractère éducatif, scientifique ou culturel
  type: main
- language: de
  script: Latn
