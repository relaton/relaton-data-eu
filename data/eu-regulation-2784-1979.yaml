    die von den Zöllen des Gemeinsamen Zolltarifs befreite Einfuhr von Gegenständen
    erzieherischen, wissenschaftlichen oder kulturellen Charakters
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2784/79 af 12. december 1979 om fastsættelse
