title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 788/2012 of 31 August 2012 concerning
    a coordinated multiannual control programme of the Union for 2013, 2014 and 2015
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 788/2012 de la Commission du 31 août
    2012 concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2013, 2014 et 2015, destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 788/2012 der Kommission vom 31. August
    2012 über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2013,
    2014 und 2015 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 788/2012 на Комисията
    от 31 август 2012 година относно координирана
    многогодишна контролна програма на Съюза за
    2013, 2014 и 2015 г. за гарантиране спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от животински
    и растителен произход и за оценка на потребителската
    експозиция на тези остатъчни вещества
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 788/2012 ze dne 31. srpna 2012
    o koordinovaném víceletém kontrolním programu Unie pro roky 2013, 2014 a 2015
    s cílem zajistit dodržování maximálních limitů reziduí pesticidů v potravinách
    rostlinného a živočišného původu a na jejich povrchu a vyhodnotit expozici
    spotřebitelů těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 788/2012 af 31. august
