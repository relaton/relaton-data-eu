    irányuló, többéves összehangolt uniós ellenőrzési programról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 788/2012 della Commissione, del 31 agosto
    2012 , relativo a un programma coordinato di controllo pluriennale dell’Unione
    per il 2013, il 2014 e il 2015, destinato a garantire il rispetto dei livelli
    massimi di residui di antiparassitari e a valutare l’esposizione dei consumatori
    ai residui di antiparassitari nei e sui prodotti alimentari di origine vegetale
    e animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 788/2012 ( 2012. gada 31. augusts
    ) par saskaņotu Eiropas Savienības daudzgadu kontroles programmu 2013., 2014.
    un 2015. gadam, lai nodrošinātu atbilstību maksimāli pieļaujamajiem pesticīdu
    atlieku līmeņiem augu un dzīvnieku izcelsmes pārtikā un uz tās un novērtētu
    šo atlieku iedarbību uz patērētājiem
  type: main
- language: lt
  script: Latn
  content: 2012 m. rugpjūčio 31 d. Komisijos įgyvendinimo reglamentas (ES) Nr.
    788/2012 dėl 2013 m., 2014 m. ir 2015 m. suderintos daugiametės Sąjungos kontrolės
    programos, skirtos užtikrinti, kad nebūtų viršijama didžiausia leidžiamoji
    pesticidų likučių koncentracija augaliniuose ir gyvūniniuose maisto produktuose
    bei ant jų, ir įvertinti pesticidų likučių poveikį vartotojams
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 788/2012 tal-
    31 ta’ Awwissu 2012 dwar programm multiannwali tal-Unjoni kkoordinat u ta’
    kontroll għall-2013, l-2014 u l-2015 biex tiġi żgurata konformità mal-livelli
    massimi ta’ residwi ta’ pestiċidi fi u fuq ikel li joriġina mill-pjanti
    u mill-annimali u biex jivvaluta l-esponiment tal-konsumatur għalihom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 788/2012 van de Commissie van 31 augustus
    2012 inzake een in 2013, 2014 en 2015 uit te voeren gecoördineerd meerjarig controleprogramma
    van de Unie tot naleving van de maximumgehalten aan bestrijdingsmiddelenresiduen
    en ter beoordeling van de blootstelling van de consument aan bestrijdingsmiddelenresiduen
    in en op levensmiddelen van plantaardige en dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 788/2012 z dnia 31 sierpnia
    2012 r. dotyczące wieloletniego skoordynowanego unijnego programu kontroli na
    lata 2013, 2014 i 2015, mającego na celu zapewnienie zgodności z najwyższymi
    dopuszczalnymi poziomami pozostałości pestycydów w żywności pochodzenia roślinnego
    i zwierzęcego oraz na jej powierzchni, a także mającego na celu ocenę narażenia
    konsumenta na te pozostałości
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 788/2012 da Comissão, de 31 de agosto
    de 2012 , relativo a um programa de controlo coordenado plurianual da União para
    2013, 2014 e 2015, destinado a garantir o respeito dos limites máximos de resíduos
    de pesticidas no interior e à superfície dos alimentos de origem vegetal e animal
    e a avaliar a exposição dos consumidores a estes resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 788/2012 al Comisiei din 31
    august 2012 privind un program de control multianual și coordonat al Uniunii
    pentru 2013, 2014 și 2015 de asigurare a respectării limitelor maxime de reziduuri
    de pesticide și de evaluare a expunerii consumatorilor la reziduurile de pesticide
    din și de pe alimentele de origine vegetală și animală
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 788/2012 z 31. augusta 2012 týkajúce
    sa koordinovaného viacročného kontrolného programu Únie na roky 2013, 2014
    a 2015 s cieľom zabezpečiť dodržiavanie maximálnych hladín rezíduí pesticídov
    a posúdiť vystavenie spotrebiteľov rezíduám pesticídov v potravinách rastlinného
    a živočíšneho pôvodu a na nich
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 788/2012 z dne 31. avgusta 2012 o usklajenem
    večletnem programu nadzora Unije za leta 2013, 2014 in 2015 za zagotavljanje
    skladnosti z mejnimi vrednostmi ostankov pesticidov v živilih rastlinskega in
    živalskega izvora in na njih ter oceno izpostavljenosti potrošnikov ostankom
    teh pesticidov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 788/2012 de la Comisión, de 31 de agosto
    de 2012 , relativo a un programa plurianual coordinado de control de la Unión
    para 2013, 2014 y 2015 destinado a garantizar el respeto de los límites máximos
    de residuos de plaguicidas en los alimentos de origen vegetal y animal y a evaluar
    el grado de exposición de los consumidores a estos residuos
  type: main
- language: sv
  script: Latn
