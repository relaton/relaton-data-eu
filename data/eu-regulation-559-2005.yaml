    dal regolamento (CE) n. 2074/2004 del Consiglio sulle importazioni di alcuni tipi
    di meccanismi per la legatura di fogli originari della Repubblica popolare cinese
    mediante importazioni di alcuni tipi di meccanismi per la legatura di fogli spediti
    dalla Repubblica democratica popolare del Laos, indipendentemente dal fatto che
    siano dichiarati o meno originari della Repubblica democratica popolare del Laos,
    e che dispone la registrazione di tali importazioni
  type: main
