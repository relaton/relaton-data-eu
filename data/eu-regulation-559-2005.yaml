    Tautas Republikas izcelsmes noteiktu gredzenveida stiprinājuma mehānismu importam
    piemērotu antidempinga pasākumu iespējamu apiešanu, importējot noteiktus
    gredzenveida stiprinājuma mehānismus, ko nosūta no Laosas Tautas Demokrātiskās
    Republikas ar Laosas Tautas Demokrātiskās Republikas izcelsmes norādi vai bez
    tās, un par šāda importa reģistrācijas uzsākšanu
  type: main
