title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 559/2005 of 12 April 2005 on initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 2074/2004 on imports of certain ring binder mechanisms
    originating in the People’s Republic of China by imports of certain ring binder
    mechanisms consigned from Lao People’s Democratic Republic, whether declared
    as originating in Lao People’s Democratic Republic or not and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 559/2005 de la Commission du 12 avril 2005 portant
    ouverture d'une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement (CE) n° 2074/2004 du Conseil sur les importations
    de certains mécanismes pour reliure à anneaux originaires de la République
    populaire de Chine par des importations de certains mécanismes pour reliure à
    anneaux expédiés de la République démocratique populaire Lao, qu'ils aient
    ou non été déclarés originaires de ce pays, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 559/2005 der Kommission vom 12. April 2005 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 2074/2004 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Ringbuchmechaniken mit Ursprung in der Volksrepublik China
    durch die Einfuhren bestimmter aus der Demokratischen Volksrepublik Laos versandter
    Ringbuchmechaniken, ob als Ursprungserzeugnis der Demokratischen Volksrepublik
    Laos angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
