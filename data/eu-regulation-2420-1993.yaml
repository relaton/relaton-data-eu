  content: COMMISSION REGULATION (EEC) No 2420/93 of 31 August 1993 fixing, for unginned
    cotton, the actual production for the 1992/93 marketing year, the estimated production
    and the reduction in the aid for the 1993/94 marketing year and the amount by
    which the guide price is to be reduced for the 1994/95 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2420/93 de la Commission du 31 août 1993 fixant,
