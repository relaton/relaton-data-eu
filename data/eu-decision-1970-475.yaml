title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1970, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de rééducation professionnelle et de réinstallation
    effectuées par la Bundesanstalt für Arbeit et la Bundesversicherungsanstalt
    (BFA)
  type: main
- language: de
  script: Latn
  content: '70/475/EWG: Entscheidung der Kommission vom 30. September 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für von der Bundesanstalt für Arbeit und der Bundesversicherungsanstalt
    für Angestellte (BfA) durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '70/475/CEE: Decisione della Commissione, del 30 settembre 1970, che concede
    un contributo del Fondo sociale europeo alla Repubblica federale di Germania per
    spese concernenti operazioni di riqualificazione professionale e di nuova sistemazione
    effettuate dalla «Bundesanstalt für Arbeit» e dalla «Bundesversicherungsanstalt
    für Angestellte (BfA)»'
  type: main
- language: nl
  script: Latn
  content: '70/475/EEG: Beschikking van de Commissie van 30 september 1970 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Bondsrepubliek Duitsland
    voor door de "Bundesanstalt für Arbeit" en de "Bundesversicherungsanstalt für
    Angestellte (B.f.A.)" gemaakte herscholings- en verplaatsingskosten'
  type: main
