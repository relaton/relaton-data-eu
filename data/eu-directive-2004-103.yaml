title:
- language: en
  script: Latn
  content: Commission Directive 2004/103/EC of 7 October 2004 on identity and plant
    health checks of plants, plant products or other objects, listed in Part B of
    Annex V to Council Directive 2000/29/EC, which may be carried out at a place other
    than the point of entry into the Community or at a place close by and specifying
    the conditions related to these checks
  type: main
- language: fr
  script: Latn
  content: Directive 2004/103/CE de la Commission du 7 octobre 2004 relative aux contrôles
    d'identité et aux contrôles sanitaires des végétaux, produits végétaux et
    autres objets inscrits à l'annexe V, partie B, de la directive 2000/29/CE du
    Conseil, qui peuvent être effectués dans un autre lieu que le point d'entrée
    dans la Communauté ou dans un endroit situé à proximité, et établissant les
    conditions régissant ces contrôles
  type: main
