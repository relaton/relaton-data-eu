    pendant l''année 1975 pour les indemnités relatives à l''encouragement à la
    cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. April 1977 über die Rückvergütung
    der im Jahr 1975 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an Irland
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. april 1977 om refusion gennem EUGFL, udviklingssektionen,
