  content: Commission Decision of 19 April 1977 on the reimbursement by the Guidance
    Section of the EAGGF to Ireland of expenditure incurred during 1975 on annuities
    relating to meausures to encourage the cessation of farming and the reallocation
    of utilized agricultural area for the purposes of structural improvement
  type: main
- language: fr
  script: Latn
