  script: Latn
  content: Commission Regulation (EC) No 1159/2004 of 24 June 2004 determining the
    extent to which applications lodged in June 2004 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
