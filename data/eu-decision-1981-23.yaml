title:
- language: en
  script: Latn
  content: '81/23/EEC: Council Decision of 20 January 1981 on the provisional application
    to the Republic of Vanuatu (former Anglo-French Condominium of the New Hebrides)
    of the arrangements provided for in Decision 76/568/EEC on the association of
    the Overseas Countries and Territories with the European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '81/23/CEE: Décision du Conseil, du 20 janvier 1981, relative à l''application
    provisoire à la République de Vanuatu (ancien condominium franco-britannique
    des Nouvelles-Hébrides) du régime prévu par la décision 76/568/CEE relative
    à l''association des pays et territoires d''outre-mer à la Communauté économique
    européenne'
  type: main
- language: de
  script: Latn
  content: '81/23/EWG: Beschluß des Rates vom 20. Januar 1981 über die vorläufige
    Anwendung der in dem Beschluß 76/568/EWG über die Assoziation der überseeischen
    Länder und Gebiete mit der Europäischen Wirtschaftsgemeinschaft vorgesehenen
    Regelung auf die Republik Wanuatu (vormals Französisch-Britisches Kondominium
    Neue Hebriden)'
  type: main
- language: da
  script: Latn
  content: '81/23/EØF: Rådets afgørelse af 20. januar 1981 om midlertidig anvendelse,
    for så vidt angår republikken Vanuatu (det tidligere fransk-britiske kondominium
    Ny-Hebriderne), af den i afgørelse 76/568/EØF om de oversøiske landes og territoriers
    associering med Det europæiske økonomiske Fællesskabs fastsatte ordning'
  type: main
- language: el
  script: Grek
  content: '81/23/ΕΟΚ: Απόφαση τού Συμβουλίου τής 20ής
    Ιανουαρίου 1981 περί τής προσωρινής εφαρμογής
    τού καθεστώτος πού προβλέπει η οδηγία 76/568/ΕΟΚ
    «περί τής συνδέσεως τών υπερποντίων χωρών
    καί εδαφών μέ τήν Ευρωπαϊκή Οικονομική Κοινότητα»
    στή Δημοκρατία τού Βανουάτου (πρώην γαλλοβρετανική
    συγκυριαρχία τών Νέων Εβρίδων)'
  type: main
- language: it
  script: Latn
  content: '81/23/CEE: Decisione del Consiglio, del 20 gennaio 1981, concernente l''
