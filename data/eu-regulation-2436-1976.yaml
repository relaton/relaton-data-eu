title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2436/76 of 6 October 1976 re-establishing
    the levying of customs duties on waste of man-made fibres, not carded, combed
    or otherwise prepared for spinning, falling within heading No 56.03, originating
    in Yugoslavia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3004/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2436/76 de la Commission, du 6 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux déchets
    de fibres textiles synthétiques et artificielles, de la position tarifaire 56.03,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3004/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2436/76 der Kommission vom 6. Oktober 1976 über die
    Wiedereinführung des Zollsatzes für Abfälle von synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer 56.03 mit Ursprung in Jugoslawien, dem die in der
    Verordnung (EWG) Nr. 3004/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2436/76 af 6. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for affald af kemofibre, ikke kartet, kæmmet eller
    på anden måde beredt til spinding, under pos. 56.03, som har oprindelse i Jugoslavien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3004/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2436/76 della Commissione, del 6 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai cascami di fibre tessili
    sintetiche ed artificiali, della voce doganale n. 56.03, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3004/75
    del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2436/76 van de Commissie van 6 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op afval van
    synthetische of van kunstmatige vezels, van post 56.03, van oorsprong uit Joegoslavië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3004/75 van de Raad van 17 november 1975
  type: main
