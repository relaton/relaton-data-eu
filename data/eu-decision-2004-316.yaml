type: standard
title:
- language: en
  script: Latn
  content: '2004/316/EC: Commission Decision of 5 April 2004 terminating the investigation
    into the alleged circumvention of anti-dumping measures imposed by Council Regulation
    (EC) No 2320/97, as last amended by Council Regulation (EC) No 235/2004, on imports
    of certain seamless pipes and tubes of iron or non-alloy steel originating in
    Russia and of anti-dumping measures imposed by Council Regulation (EC) No 348/2000,
    as last amended by Council Regulation (EC) No 1515/2002 on imports of certain
    seamless pipes and tubes of iron or non-alloy steel originating in Ukraine by
    wrong declaration of imports of the same product and by imports of certain seamless
    pipes and tubes of alloy steel, other than stainless steel, originating in Russia
    and Ukraine and terminating the registration of such imports imposed by Commission
    Regulation (EC) No 1264/2003'
  type: main
- language: fr
  script: Latn
  content: '2004/316/CE: Décision de la Commission du 5 avril 2004 clôturant l''enquête
    sur le prétendu contournement des mesures antidumping instituées par le règlement
    (CE) n° 2320/97 du Conseil, modifié en dernier lieu par le règlement (CE) n°
    235/2004, sur les importations de certains tubes et tuyaux sans soudure, en fer
    ou en acier non allié, originaires de Russie, ainsi que des mesures antidumping
    instituées par le règlement (CE) n° 348/2000 du Conseil, modifié en dernier
    lieu par le règlement (CE) n° 1515/2002, sur les importations de certains tubes
    et tuyaux sans soudure, en fer ou en acier non allié, originaires d''Ukraine,
    par une fausse déclaration des importations du même produit et par des importations
    de certains tubes et tuyaux sans soudure, en acier allié autre qu''inoxydable,
    originaires de Russie et d''Ukraine, et mettant fin à l''enregistrement de ces
    importations imposé par le règlement (CE) n° 1264/2003 de la Commission'
  type: main
- language: de
  script: Latn
  content: '2004/316/EG: Beschluss der Kommission vom 5. April 2004 zur Einstellung
    der mit der Verordnung (EG) Nr. 1264/2003 eingeleiteten Untersuchung betreffend
    die angebliche Umgehung der mit der Verordnung (EG) Nr. 2320/97 des Rates gegenüber
    den Einfuhren bestimmter nahtloser Rohre aus Eisen oder nicht legiertem Stahl
    mit Ursprung in Russland eingeführten Antidumpingmaßnahmen und der mit der Verordnung
    (EG) Nr. 348/2000 des Rates gegenüber den Einfuhren bestimmter nahtloser Rohre
    aus Eisen oder nicht legiertem Stahl mit Ursprung in der Ukraine eingeführten
    Antidumpingmaßnahmen durch Falschanmeldungen von Einfuhren derselben Ware und
    durch Einfuhren bestimmter nahtloser Rohre aus legiertem Stahl, ausgenommen Edelstahl,
    mit Ursprung in Russland und der Ukraine und zur Einstellung der mit der Verordnung
    (EG) Nr. 1264/2003 der Kommission eingeführten zollamtlichen Erfassung dieser
    Einfuhren'
  type: main
- language: da
  script: Latn
  content: '2004/316/EF: Kommissionens afgørelse af 5. april 2004 om afslutning af
    undersøgelsen vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 2320/97, senest ændret ved forordning
    (EF) nr. 235/2004, på importen af visse sømløse rør af jern eller ulegeret
    stål med oprindelse i Rusland, og de antidumpingforanstaltninger, der indførtes
    ved Rådets forordning (EF) nr. 348/2000, senest ændret ved forordning (EF) nr.
    1515/2002, på importen af visse sømløse rør af jern eller ulegeret stål med
    oprindelse i Ukraine, ved forkert angivelse af import af den samme vare og ved
    import af visse sømløse rør af legeret stål, bortset fra rustfrit stål, med
    oprindelse i Rusland og Ukraine, og om afslutning af den registrering af denne
    import, der indførtes ved Kommissionens forordning (EF) nr. 1264/2003'
  type: main
- language: el
  script: Grek
  content: '2004/316/ΕΚ: Απόφαση της Επιτροπής, της 5ης
