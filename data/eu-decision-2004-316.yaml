    ορισμένων σωλήνων κάθε είδους χωρίς συγκόλληση
    από σίδηρο ή μη κραματοποιημένο χάλυβα καταγωγής
    Ουκρανίας, εξαιτίας της εσφαλμένης διασάφησης
    των εισαγωγών του ιδίου προϊόντος και των εισαγωγών
    ορισμένων σωλήνων κάθε είδους χωρίς συγκόλληση
    από κραματοποιημένο χάλυβα, άλλων από τους
    σωλήνες από ανοξείδωτο χάλυβα, καταγωγής Ρωσίας
    και Ουκρανίας, και για την περάτωση της υπαγωγής
    των εν λόγω εισαγωγών σε καταγραφή που επιβλήθηκε
    με τον κανονισμό (ΕΚ) αριθ. 1264/2003 της Επιτροπής'
  type: main
- language: fi
  script: Latn
  content: '2004/316/EY: Komission päätös, tehty 5 päivänä huhtikuuta 2004,
    tiettyjen Venäjältä peräisin olevien raudasta tai seostamattomasta teräksestä
    valmistettujen saumattomien putkien tuonnissa neuvoston asetuksella (EY) N:o 2320/97,
    sellaisena kuin se on viimeksi muutettuna neuvoston asetuksella (EY) N:o 235/2004,
    ja tiettyjen Ukrainasta peräisin olevien raudasta tai seostamattomasta teräksestä
    valmistettujen saumattomien putkien tuonnissa neuvoston asetuksella (EY) N:o 348/2000,
    sellaisena kuin se on viimeksi muutettuna neuvoston asetuksella (EY) N:o 1515/2002,
    käyttöön otettujen polkumyyntitoimenpiteiden väitettyä kiertämistä esittämällä
    samasta tuotteesta virheellisiä tuonti-ilmoituksia ja tiettyjen Venäjältä
    ja Ukrainasta peräisin olevien seosteräksestä, ei kuitenkaan ruostumattomasta
    teräksestä, valmistettujen saumattomien putkien tuonnilla koskevan komission
    asetuksella (EY) N:o 1264/2003 vireille pannun tutkimuksen ja käyttöön otetun
    kyseisen tuonnin kirjaamisvelvoitteen päättämisestä'
  type: main
- language: it
  script: Latn
  content: '2004/316/CE: Decisione della Commissione, del 5 aprile 2004, che chiude
    l''inchiesta relativa alla presunta elusione delle misure antidumping istituite
    con il regolamento (CE) n. 2320/97 del Consiglio, modificato da ultimo dal regolamento
    (CE) n. 235/2004, sulle importazioni di alcuni tubi senza saldature, di ferro
    o di acciai non legati originari della Russia e delle misure antidumping istituite
    con il regolamento (CE) n. 348/2000, modificato da ultimo dal regolamento (CE)
    n. 1515/2002, sulle importazioni di alcuni tubi senza saldature, di ferro o di
    acciai non legati originari dell''Ucraina, realizzata mediante scorretta dichiarazione
    delle importazioni dello stesso prodotto e mediante importazioni di alcuni tipi
    di tubi senza saldatura di acciai legati, diversi dagli acciai inossidabili, originari
    della Russia e dell''Ucraina e che chiude la registrazione di tali importazioni,
    istituita con il regolamento (CE) n. 1264/2003 della Commissione'
  type: main
- language: nl
  script: Latn
  content: '2004/316/EG: Besluit van de Commissie van 5 april 2004 tot beëindiging
    van het onderzoek naar de mogelĳke ontduiking van de antidumpingrechten, ingesteld
    bĳ Verordening (EG) nr. 2320/97 van de Raad laatstelĳk gewĳzigd bĳ Verordening
    (EG) nr. 235/2004 op bepaalde naadloze buizen en pĳpen van ĳzer of van niet-gelegeerd
    staal, uit Rusland, en naar de mogelĳke ontduiking van de antidumpingrechten,
    ingesteld bĳ Verordening (EG) nr. 348/2000 van de Raad laatstelĳk gewĳzigd
    bĳ Verordening (EG) nr. 1515/2002 op bepaalde naadloze buizen en pĳpen van ĳzer
    of niet-gelegeerd staal uit Oekraïne, door een onjuiste douane-aangifte en door
    de invoer van bepaalde naadloze buizen en pĳpen van gelegeerd staal, ander dan
    roestvrĳ staal, uit Rusland en Oekraïne, en tot beëindiging van de bĳ Verordening
    (EG) nr. 1264/2003 ingestelde registratie van deze invoer'
  type: main
- language: pt
  script: Latn
  content: '2004/316/CE: Decisão da Comissão, de 5 de Abril de 2004, que encerra
    o inquérito sobre a alegada evasão às medidas anti-dumping instituídas pelo
    Regulamento (CE) n.° 2320/97 do Conselho, com a última redacção que lhe foi
    dada pelo Regulamento (CE) n.° 235/2004, sobre as importações de certos tubos
    sem costura, de ferro ou de aço não ligado, originários da Rússia, bem como
    às medidas anti-dumping instituídas pelo Regulamento (CE) n.° 384/2000 do Conselho,
    com a última redacção que lhe foi dada pelo Regulamento (CE) n.° 1515/2002,
    sobre as importações de certos tubos sem costura, de ferro ou de aço não ligado,
    originários da Ucrânia, mediante a declaração incorrecta das importações
    do mesmo produto ou a sua substituição por importações de certos tubos sem
    costura, de aço ligado, excepto de aço inoxidável, originárias da Rússia
    e da Ucrânia e que encerra o registo dessas importações tornado obrigatório
    pelo Regulamento (CE) n.° 1264/2003 da Comissão'
  type: main
- language: es
  script: Latn
  content: '2004/316/CE: Decisión de la Comisión, de 5 de abril de 2004, por la
    que se concluye la investigación sobre la presunta elusión de los derechos antidumping
    establecidos por el Reglamento (CE) n° 2320/97 del Consejo, cuya última modificación
    la constituye el Reglamento (CE) n° 235/2004, sobre las importaciones de determinados
    tubos sin soldadura y tubos de hierro o de acero sin alear, originarios de Rusia,
    y de derechos antidumping establecidos por el Reglamento (CE) n° 348/2000 del
    Consejo, cuya última modificación la constituye el Reglamento (CE) n° 1515/2002,
    sobre las importaciones de determinados tubos sin soldadura y tubos de hierro
    o de acero sin alear, originarios de Ucrania, mediante declaración falsa de importaciones
    del mismo producto y mediante importaciones de determinados tubos sin soldadura
    y tubos de acero aleado, excepto el inoxidable, originarios de Rusia y de Ucrania,
    y por el que se suspende el registro de tales importaciones a que estaban sometidos
    por el Reglamento (CE) n° 1264/2003'
  type: main
- language: sv
  script: Latn
  content: '2004/316/EG: Kommissionens beslut av den 5 april 2004 om avslutande av
    undersökningen beträffande påstått kringgående, genom felaktig deklaration
    av import av vissa sömlösa rör av järn eller olegerat stål och av import
    av vissa sömlösa rör av legerat stål, annat än rostfritt stål, med ursprung
    i Ryska federationen och Ukraina, av de antidumpningsåtgärder som genom rådets
    förordning (EG) nr 2320/97, senast ändrad genom förordning (EG) nr 235/2004,
    införts på import av vissa sömlösa rör av järn eller olegerat stål med
    ursprung i Ryska federationen och av de antidumpningsåtgärder som genom rådets
    förordning (EG) nr 348/2000, senast ändrad genom förordning (EG) nr 1515/2002,
    införts på import av vissa sömlösa rör av järn eller olegerat stål med
    ursprung i Ukraina, och om avslutande av den registrering av sådan import som
    införts genom kommissionens förordning (EG) nr 1264/2003'
