title:
- language: en
  script: Latn
  content: Directive 2013/35/EU of the European Parliament and of the Council of 26
    June 2013 on the minimum health and safety requirements regarding the exposure
    of workers to the risks arising from physical agents (electromagnetic fields)
    (20th individual Directive within the meaning of Article 16(1) of Directive 89/391/EEC)
    and repealing Directive 2004/40/EC
  type: main
- language: fr
  script: Latn
  content: Directive 2013/35/UE du Parlement européen et du Conseil du 26 juin 2013
    concernant les prescriptions minimales de sécurité et de santé relatives à
    l’exposition des travailleurs aux risques dus aux agents physiques (champs électromagnétiques)
    (vingtième directive particulière au sens de l’article 16, paragraphe 1, de
    la directive 89/391/CEE) et abrogeant la directive 2004/40/CE
  type: main
- language: de
  script: Latn
  content: Richtlinie 2013/35/EU des Europäischen Parlaments und des Rates vom 26.
    Juni 2013 über Mindestvorschriften zum Schutz von Sicherheit und Gesundheit der
    Arbeitnehmer vor der Gefährdung durch physikalische Einwirkungen (elektromagnetische
    Felder) (20. Einzelrichtlinie im Sinne des Artikels 16 Absatz 1 der Richtlinie
    89/391/EWG) und zur Aufhebung der Richtlinie 2004/40/EG
  type: main
- language: bg
  script: Cyrl
  content: Директива 2013/35/ЕС на Европейския парламент
    и на Съвета от 26 юни 2013 година относно минималните
    изисквания за здраве и безопасност, свързани
    с експозицията на работниците на рискове, дължащи
    се на физически агенти (електромагнитни полета)
    (Двадесета специална директива по смисъла
    на член 16, параграф 1 от Директива 89/391/ЕИО) и
    за отмяна на Директива 2004/40/ЕО
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2013/35/EU ze dne 26. června 2013
    o minimálních požadavcích na bezpečnost a ochranu zdraví před expozicí
    zaměstnanců rizikům spojeným s fyzikálními činiteli (elektromagnetickými
    poli) (dvacátá samostatná směrnice ve smyslu čl. 16 odst. 1 směrnice 89/391/EHS)
    a o zrušení směrnice 2004/40/ES
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2013/35/EU af 26. juni 2013 om
    minimumsforskrifter for sikkerhed og sundhed i forbindelse med arbejdstagernes
    eksponering for risici på grund af fysiske agenser (elektromagnetiske felter)
    (20. særdirektiv i henhold til artikel 16, stk. 1, i direktiv 89/391/EØF) og
    om ophævelse af direktiv 2004/40/EF
  type: main
- language: el
  script: Grek
  content: Οδηγία 2013/35/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 26ης Ιουνίου 2013 , περί
    των ελαχίστων απαιτήσεων υγείας και ασφάλειας
    όσον αφορά την έκθεση των εργαζομένων σε κινδύνους
    προερχόμενους από φυσικούς παράγοντες (ηλεκτρομαγνητικά
    πεδία) (20ή ειδική οδηγία κατά την έννοια του
    άρθρου 16 παράγραφος 1 της οδηγίας 89/391/ΕΟΚ) και
    περί καταργήσεως της οδηγίας 2004/40/ΕΚ
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2013/35/EL, 26. juuni 2013 , mis
    käsitleb töötervishoiu ja tööohutuse miinimumnõudeid seoses töötajate
    kokkupuutega füüsikalistest mõjuritest (elektromagnetväljad) tulenevate riskidega
    (20. üksikdirektiiv direktiivi 89/391/EMÜ artikli 16 lõike 1 tähenduses) ja
    millega tunnistatakse kehtetuks direktiiv 2004/40/EÜ
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2013/35/EU, annettu 26 päivänä
    kesäkuuta 2013 , terveyttä ja turvallisuutta koskevista vähimmäisvaatimuksista
    työntekijöiden suojelemiseksi altistumiselta fysikaalisista tekijöistä (sähkömagneettiset
    kentät) aiheutuville riskeille (kahdeskymmenes direktiivin 89/391/ETY 16 artiklan
    1 kohdassa tarkoitettu erityisdirektiivi) ja direktiivin 2004/40/EY kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2013/35/EU Europskog parlamenta i Vijeća od 26. lipnja 2013.
    o minimalnim zdravstvenim i sigurnosnim zahtjevima u odnosu na izloženost radnika
    rizicima uzrokovanim fizikalnim čimbenicima (elektromagnetska polja) (dvadeseta
    pojedinačna direktiva u smislu članka 16. stavka 1. Direktive 89/391/EEZ) te
    stavljanju izvan snage Direktive 2004/40/EZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2013/35/EU irányelve ( 2013. június
    26. ) a munkavállalók fizikai tényezők (elektromágneses terek) által okozott
    kockázatoknak való expozíciójára vonatkozó egészségügyi és biztonsági
    minimumkövetelményekről (20. egyedi irányelv a 89/391/EGK irányelv 16. cikke
    (1) bekezdésének értelmében) és a 2004/40/EK irányelv hatályon kívül
    helyezéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 2013/35/UE del Parlamento europeo e del Consiglio, del 26 giugno
    2013 , sulle disposizioni minime di sicurezza e di salute relative all’esposizione
    dei lavoratori ai rischi derivanti dagli agenti fisici (campi elettromagnetici)
    (ventesima direttiva particolare ai sensi dell’articolo 16, paragrafo 1, della
    direttiva 89/391/CEE) e che abroga la direttiva 2004/40/CE
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2013/35/ES ( 2013. gada 26. jūnijs
    ) par minimālajām veselības aizsardzības un drošuma prasībām attiecībā
    uz darba ņēmēju pakļaušanu riskam, ko rada fizikāli faktori (elektromagnētiskie
    lauki) (20. atsevišķā direktīva Direktīvas 89/391/EEK 16. panta 1. punkta
    nozīmē), un ar ko atceļ Direktīvu 2004/40/EK
  type: main
- language: lt
  script: Latn
  content: 2013 m. birželio 26 d. Europos Parlamento ir Tarybos direktyva 2013/35/ES
    dėl būtiniausių sveikatos ir saugos reikalavimų, susijusių su fizikinių
    veiksnių (elektromagnetinių laukų) keliama rizika darbuotojams (dvidešimtoji
    atskira direktyva, kaip apibrėžta Direktyvos 89/391/EEB 16 straipsnio 1 dalyje),
    ir kuria panaikinama Direktyva 2004/40/EB
  type: main
- language: mt
  script: Latn
  content: Direttiva 2013/35/UE tal-Parlament Ewropew u tal-Kunsill tas- 26 ta’
    Ġunju 2013 dwar ir-rekwiżiti minimi tas-saħħa u s-sigurtà li jirrigwardaw
    l-espożizzjoni tal-ħaddiema għar-riskji li jinħolqu minn aġenti fiżiċi
    (kampi elettromanjetiċi) (l-20 Direttiva individwali skont l-Artikolu 16(1) tad-Direttiva
    89/391/KEE) u li tħassar id-Direttiva 2004/40/KE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2013/35/EU van het Europees Parlement en de Raad van 26 juni
    2013 betreffende de minimumvoorschriften inzake gezondheid en veiligheid met betrekking
    tot de blootstelling van werknemers aan de risico’s van fysische agentia (elektromagnetische
    velden) (twintigste bijzondere richtlijn in de zin van artikel 16, lid 1, van
    Richtlijn 89/391/EEG) en tot intrekking van Richtlijn 2004/40/EG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2013/35/UE z dnia 26 czerwca
    2013 r. w sprawie minimalnych wymagań w zakresie ochrony zdrowia i bezpieczeństwa
    dotyczących narażenia pracowników na zagrożenia spowodowane czynnikami fizycznymi
    (polami elektromagnetycznymi) (dwudziesta dyrektywa szczegółowa w rozumieniu
    art. 16 ust. 1 dyrektywy 89/391/EWG) i uchylająca dyrektywę 2004/40/WE
  type: main
- language: pt
  script: Latn
  content: Diretiva 2013/35/UE do Parlamento Europeu e do Conselho, de 26 de junho
    de 2013 , relativa às prescrições mínimas de segurança e saúde em matéria
    de exposição dos trabalhadores aos riscos devidos aos agentes físicos (campos
    eletromagnéticos) (20. a diretiva especial na aceção do artigo 16. °, n. °
    1, da Diretiva 89/391/CEE) e que revoga a Diretiva 2004/40/CE
  type: main
- language: ro
  script: Latn
  content: Directiva 2013/35/UE a Parlamentului European și a Consiliului din 26
    iunie 2013 privind cerințele minime de sănătate și securitate referitoare
    la expunerea lucrătorilor la riscuri generate de agenții fizici (câmpuri electromagnetice)
    [a douăzecea directivă specială în sensul articolului 16 alineatul (1) din
    Directiva 89/391/CEE] și de abrogare a Directivei 2004/40/CE
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2013/35/EÚ z 26. júna 2013 o minimálnych
    zdravotných a bezpečnostných požiadavkách týkajúcich sa vystavenia pracovníkov
    rizikám vyplývajúcim z fyzikálnych činidiel (elektromagnetické polia) (20.
    samostatná smernica v zmysle článku 16 ods. 1 smernice 89/391/EHS) a o zrušení
    smernice 2004/40/ES
  type: main
- language: sl
  script: Latn
  content: Direktiva 2013/35/EU Evropskega parlamenta in Sveta z dne 26. junija 2013
    o minimalnih zdravstvenih in varnostnih zahtevah v zvezi z izpostavljenostjo delavcev
    tveganjem, ki nastajajo zaradi fizikalnih dejavnikov (elektromagnetnih sevanj)
    (20. posebna direktiva v smislu člena 16(1) Direktive 89/391/EGS) in razveljavitvi
    Direktive 2004/40/ES
  type: main
- language: es
  script: Latn
  content: Directiva 2013/35/UE del Parlamento Europeo y del Consejo, de 26 de junio
    de 2013 , sobre las disposiciones mínimas de salud y seguridad relativas a la
    exposición de los trabajadores a los riesgos derivados de agentes físicos (campos
    electromagnéticos) (vigésima Directiva específica con arreglo al artículo
    16, apartado 1, de la Directiva 89/391/CEE), y por la que se deroga la Directiva
    2004/40/CE
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2013/35/EU av den 26 juni 2013
    om minimikrav för arbetstagares hälsa och säkerhet vid exponering för risker
    som har samband med fysikaliska agens (elektromagnetiska fält) i arbetet (20:e
    särdirektivet enligt artikel 16.1 i direktiv 89/391/EEG) och om upphävande av
    direktiv 2004/40/EG
