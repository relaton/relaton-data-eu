title:
- language: en
  script: Latn
  content: Commission Directive 88/126/EEC of 22 December 1987 amending Directive
    87/94/EEC on the approximation of the laws of the Member States relating to procedures
    for the control of characteristics of, limits for and resistance to detonation
    of straight ammonium nitrate fertilizers of high nitrogen content
  type: main
- language: fr
  script: Latn
  content: Directive 88/126/CEE de la Commission du 22 décembre 1987 modifiant la
    directive 87/94/CEE concernant le rapprochement des législations des États membres
    relatives aux procédures visant le contrôle des caractéristiques, des limites
    et la détonabilité des engrais simples à base de nitrate d'ammonium et à forte
    teneur en azote
  type: main
- language: de
  script: Latn
  content: Richtlinie 88/126/EWG der Kommission vom 22. Dezember 1987 zur Änderung
    der Richtlinie 87/94/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    über Verfahren zur Überprüfung der Merkmale, Grenzwerte und der Detonationsfähigkeit
    von Ammoniumnitrat- Einnährstoffdünger mit hohem Stickstoffgehalt
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise ze dne 22. prosince 1987, kterou se mění směrnice 87/94/EHS
    o sbližování právních předpisů členských států týkajících se postupů
    pro kontrolu charakteristik a limitních hodnot jednosložkových hnojiv typu
    dusičnanu amonného s vysokým obsahem dusíku a jejich odolnosti vůči výbuchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 88/126/EØF af 22. december 1987 om ændring af
    direktiv 87/94/EØF om tilnærmelse af medlemsstaternes lovgivning vedrørende
    metoder til efterprøvning af karakteristika, grænseværdier og detonerbarhed
    for ren ammoniumnitratgødning med højt nitrogenindhold
  type: main
- language: el
  script: Grek
  content: Οδηγία 88/126/ΕΟΚ της Επιτροπής της 22ας Δεκεμβρίου
    1987 για τροποποίηση της οδηγίας 87/94/ΕΟΚ όσον
    αφορά την προσέγγιση των νομοθεσιών των κρατών
    μελών σχετικά με τις διαδικασίες για τον έλεγχο
    των χαρακτηριστικών, των ορίων και της εκρηκτικότητας
    των απλών λιπασμάτων με βάση το νιτρικό αμμώνιο
    και με μεγάλη περιεκτικότητα σε άζωτο
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv, 22. detsember 1987, millega muudetakse direktiivi
    87/94/EMÜ suure lämmastikusisaldusega ammooniumnitraat-lihtväetiste omaduste
    kontrolli menetlusi, piiranguid ja detonatsioonikindlust käsitlevate liikmesriikide
    õigusaktide ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 88/126/ETY, annettu 22 päivänä joulukuuta 1987,
    runsastyppisten yksiravinteisten ammoniumnitraattilannoitteiden ominaisuuksien,
    raja-arvojen ja räjähtämättömyyden valvontaa koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin 87/94/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1987. december 22.) a magas nitrogéntartalmú,
    egyszerű ammónium-nitrát műtrágyák jellemzőinek, határértékeinek és
    robbanékonyságának ellenőrzését szabályozó eljárásokra vonatkozó tagállami
    jogszabályok közelítéséről szóló 87/94/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 88/126/CEE della Commissione del 22 dicembre 1987 che modifica
    la direttiva 87/94/CEE per il ravvicinamento delle legislazioni degli Stati Membri
    relative alle procedure di controllo delle caratteristiche, dei limiti e delle
    detonabilità dei concimi semplici a base di nitrato di ammonio ad elevato titolo
    di azoto
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva (1987. gada 22. decembris), ar ko groza Direktīvu
