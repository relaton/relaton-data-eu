    nitrato trąšų, turinčių didelį azoto kiekį, sprogumo savybių, ribinių
    charakteristikų ir atsparumo jam kontrolės tvarkos, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni tat-22 ta’ Diċembru 1987 li temenda d-Direttiva
    87/94/KEE dwar l-approssimazzjoni tal-liġijiet ta’ l-Istati Membri li jirrelataw
    ma’ proċeduri għall-kontroll tal-karatteristiċi ta’ limiti għal u reżistenza
    għad-detonazzjoni ta’ fertilizzanti tan-nitrat ta’ l-ammonju pur b’kontenut
    għoli ta’ nitroġenu
  type: main
- language: nl
  script: Latn
  content: Richtlijn 88/126/EEG van de Commissie van 22 december 1987 tot wijziging
    van Richtlijn 87/94/EEG betreffende de onderlinge aanpassing van de wetgevingen
    der Lid- Staten inzake methoden ter controle van de kenmerken, de grenswaarden
    en de detonatiegevoeligheid van enkelvoudige meststoffen op basis van ammoniumnitraat
    en met een hoog stikstofgehalte
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji z dnia 22 grudnia 1987 r. zmieniająca dyrektywę 87/94/EWG
    w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących się do
    procedur kontroli charakterystyk, granic i odporności na detonację prostych
    nawozów amonowych, o wysokiej zawartości azotu
  type: main
- language: pt
  script: Latn
  content: Directiva 88/126/CEE da Comissão de 22 de Dezembro de 1987 que altera
    a Directiva 87/94/CEE relativa à aproximação das legislações dos Estados-Membros
    respeitantes aos processos que têm por objectivo o controlo das características,
    dos limites e da explosividade dos adubos elementares à base de nitrato de amónio
    com elevado teor de azoto
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie z 22. decembra 1987, ktorou sa mení a dopĺňa smernica
    87/94/EHS o aproximácii právnych predpisov členských štátov o postupoch
    kontroly vlastností, limitov a odolnosti voči výbuchu pri jednozložkových
    hnojivách typu dusičnanu amónneho s vysokým obsahom dusíka
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije z dne 22. decembra 1987 o spremembi Direktive 87/94/EGS
    o približevanju zakonodaj držav članic v zvezi s postopki nadzora značilnosti,
    omejitev in odpornosti proti eksploziji enojnih gnojil iz amonijevega nitrata
    z visoko vsebnostjo dušika
  type: main
- language: es
  script: Latn
  content: Directiva 88/126/CEE de la Comisión de 22 de diciembre de 1987 por la
    que se modifica la Directiva 87/94/CEE, relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre los procedimientos de control de las características,
    límites y detonabilidad de los fertilizantes simples a base de nitrato de amonio
    y de alto contenido en nitrógeno
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 88/126/EEG av den 22 december 1987 om ändring i
    direktiv 87/94/EEG om tillnärmning av medlemsstaternas lagstiftning om förfaranden
    vid kontroll av egenskaper, gränsvärden och detonationssäkerhet hos enkla ammoniumnitratgödselmedel
    med hög kvävehalt
