    amonija nitrāta mēslošanas līdzekļu ar augstu slāpekļa sastāvu īpašību,
    ierobežojumu un sprādziendrošības kontroles kārtību
  type: main
- language: lt
  script: Latn
  content: 1987 m. gruodžio 22 d. Komisijos direktyva, iš dalies keičianti Direktyvą
