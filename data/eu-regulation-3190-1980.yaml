title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3190/80 of 9 December 1980 re-establishing
    the levying of the customs duties on other sewing machines and other sewing machine
    heads, falling within subheading 84.41 A II and originating in Brazil, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3190/80 de la Commission, du 9 décembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres machines
    à coudre et autres têtes pour machines à coudre, de la sous-position 84.41
    A II du tarif douanier commun, originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3190/80 der Kommission vom 9. Dezember 1980 zur Wiedereinführung
    des Zollsatzes für andere Nähmaschinen und andere Nähmaschinenköpfe der Tarifstelle
    84.41 A II mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3190/80 af 9. december 1980 om genindførelse
    af opkrævning af toldafgifter for andre symaskiner og symaskinehoveder, under
    pos. 84.41 A II, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3190/80 della Commissione, del 9 dicembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle altre macchine per
    cucire e altre teste di macchine per cucire, della sottovoce 84.41 A II della
    tariffa doganale comune, originari del Brasile beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3190/80 van de Commissie van 9 december 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere naaimachines
    en andere koppen van naaimachines, van post 84.41 A II, van oorsprong uit Brazilië
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
