title:
- language: en
  script: Latn
  content: '73/123/EEC: Commission Decision of 7 May 1973 modifying the Decision of
    16 October 1970 exempting the French Republic from the application to certain
    species of the Council Directive of 30 June 1969 concerning the marketing of seed
    of oil and fibre plants (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '73/123/CEE: Décision de la Commission, du 7 mai 1973, modifiant la décision
    du 16 octobre 1970 dispensant la République française d''appliquer à certaines
    espèces la directive du Conseil du 30 juin 1969, concernant la commercialisation
    des semences de plantes oléagineuses et à fibres (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '73/123/EWG: Entscheidung der Kommission vom 7. Mai 1973 zur Änderung
    der Entscheidung der Kommission vom 16. Oktober 1970 über die Entbindung der
    Französischen Republik von der Verpflichtung, die Richtlinie des Rates vom 30.
    Juni 1969 über den Verkehr mit Saatgut von Öl- und Faserpflanzen hinsichtlich
    einiger Arten anzuwenden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '73/123/EØF: Kommissionens Beslutning af 7. maj 1973 om ændring af Kommissionens
    beslutning af 16. oktober 1970 om fritagelse af Den Franske Republik fra forpligtelsen
    til at anvende Rådets direktiv af 30. juni 1969 om handel med frø af olie og
    spindplanter for visse arter (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '73/123/ΕΟΚ: Απόφαση της Επιτροπής, της 7ης
    Μαΐου 1973, περί τροποποίησης της απόφασης της
    16ης Οκτωβρίου 1970, με την οποία απαλλάσσεται
    η Γαλλική Δημοκρατία από την εφαρμογή για ορισμένα
    είδη της οδηγίας του Συμβουλίου της 30ής Ιουνίου
    1969, περί της εμπορίας σπόρων ελαιούχων και
    ινωδών φυτών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '73/123/CEE: Decisione della Commissione, del 7 maggio 1973, che modifica
    la decisione del 16 ottobre 1970, che dispensa la Repubblica francese dall''applicazione,
    per certe specie, della direttiva del Consiglio del 30 giugno 1969, relativa alla
    commercializzazione delle sementi di piante oleaginose e da fibra (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '73/123/EEG: Beschikking van de Commissie van 7 mei 1973 houdende wijziging
    van de beschikking van 16 oktober 1970 tot ontheffing van de Franse Republiek
    van toepassing op bepaalde gewassen van de richtlijn van de Raad van 30 juni 1969,
    betreffende het in de handel brengen van zaaizaad van oliehoudende planten en
    vezelgewassen (Slechts de tekst in de Franse taal is authentiek)'
  type: main
