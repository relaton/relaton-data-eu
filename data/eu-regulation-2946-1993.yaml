title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2946/93 of 26 October 1993 determining the
    extent to which application lodged in October 1993 for import licences for certain
    pigmeat products under the regime provided for by the Intermediate Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary
    and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2946/93 de la Commission, du 26 octobre 1993, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1993 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords intérimaires conclus par la Communauté avec la
    république de Pologne, la république de Hongrie, et la République fédérative
    tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2946/93 der Kommission vom 26. Oktober 1993 über
    die Festsetzung des Umfangs, in dem die im Oktober 1993 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung
    der Interimsabkommen zwischen der Gemeinschaft und Polen, Ungarn und der Tschechischen
    und Slowakischen Föderativen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2946/93 af 26. oktober 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1993 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Republikken
    Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2946/93 της Επιτροπής
    της 26ης Οκτωβρίου 1993 περί καθορισμού ορίων
    εντός των οποίων δύναται να γίνει αποδεκτή
    η αίτηση που υποβλήθηκε τον Οκτώβριο του 1993
    για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις ενδιάμεσες
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας και την Τσεχική και Σλοβακική Ομοσπονδιακή
    Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2946/93 della Commissione, del 26 ottobre 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1993 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi intermedi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica federativa
    ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2946/93 van de Commissie van 26 oktober 1993 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde produkten in de sector varkensvlees, die in oktober
    1993 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten Interimovereenkomsten met de Republiek Polen, de Republiek
    Hongarije en de Tsjechische en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2946/93 da Comissão, de 26 de Outubro de 1993, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Outubro
    de 1993 ao abrigo do regime previsto nos acordos provisórios concluídos pela
    Comunidade com a República da Polónia, a República da Hungria e a República
    Federativa Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2946/93 de la Comisión, de 26 de octubre de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de octubre de 1993, al amparo del régimen previsto en los Acuerdos
    interinos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría y la República Federativa Checa y Eslovaca
