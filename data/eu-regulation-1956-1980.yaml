title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1956/80 of 22 July 1980 increasing the volume
    of the Community tariff quota opened for 1980 for ferro-chromium containing not
    more than 0*10% by weight of carbon and more than 30% but not more than 90% by
    weight of chromium (super-refined ferro-chromium) falling within subheading ex
    73.02 E I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1956/80 du Conseil, du 22 juillet 1980, portant augmentation
    du volume du contingent tarifaire communautaire ouvert pour l' année 1980 pour
    le ferro-chrome contenant en poids 0,10% ou moins de carbone et plus de 30% jusqu'
    à 90% inclus de chrome (ferro-chrome surraffiné) de la sous-position ex 73.02
    E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1956/80 des Rates vom 22. Juli 1980 zur Aufstockung
    des für das Jahr 1980 eröffneten Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichsthundertteilen oder weniger und
    an Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1956/80 af 22. juli 1980 om forhøjelse af
    det for 1980 åbnede fællesskabstoldkontingent for ferrochrom med et kulstofindhold
    på 0,10 vægtprocent eller derunder og med et indhold af chrom (raffineret ferrochrom)
    på over 30%, men højst 90%, henhørende under pos. 73.02 E I i den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1956/80 del Consiglio, dei 22 luglio 1980, relativo
    all' aumento del volume del contingente tariffario comunitario aperto per il 1980
    per il ferro-cromo contencente in peso lo 0,10% o meno di carbonio e oltre il
    30% sino al 90% incluso di cromo (ferro-cromo superraffinato) della sottovoce
    ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1956/80 van de Raad van 22 juli 1980 houdende verhoging
    van het voor 1980 geopende communautaire tariefcontingent voor ferrochroom, bevattende
    0,1 of minder gewichtspercent koolstof en meer dan 30 doch niet meer dan 90 gewichtspercenten
    chroom (hoog-geraffineerd ferrochroom), van post ex 73.02 E I van het gemeenschappelijk
    douanetarief
  type: main
