    που είναι εκτεθειμένες σε ιδιαίτερους φυτοϋγειονομικούς
    κινδύνους στην Κοινότητα και την κατάργηση
    της οδηγίας 92/76/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2001/32/EÜ, 8. mai 2001, millega tunnistatakse kaitstavaid
