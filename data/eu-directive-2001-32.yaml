title:
- language: en
  script: Latn
  content: Commission Directive 2001/32/EC of 8 May 2001 recognising protected zones
    exposed to particular plant health risks in the Community and repealing Directive
    92/76/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 2001/32/CE de la Commission du 8 mai 2001 reconnaissant des zones
    protégées, exposées à des dangers phytosanitaires particuliers, dans la Communauté,
    et abrogeant la directive 92/76/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/32/EG der Kommission vom 8. Mai 2001 zur Anerkennung pflanzengesundheitlich
    besonders gefährdeter Schutzgebiete innerhalb der Gemeinschaft und zur Aufhebung
    der Richtlinie 92/76/EWG
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/32/ЕО на Комисията от 8 май 2001
    година относно признаване на защитени зони
