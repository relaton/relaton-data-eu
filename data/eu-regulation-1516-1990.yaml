title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1516/90 of 5 June 1990 abolishing the corrective
    amount on the import of courgettes into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1516/90 de la Commission, du 5 juin 1990, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix de courgettes en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1516/90 der Kommission vom 5. Juni 1990 zur Aufhebung
    des bei der Einfuhr von Zucchini (Courgettes) aus Spanien (mit Ausnahme der Kanarischen
    Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1516/90 af 5. juni 1990 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af courgetter
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1516/90 της Επιτροπής
    της 5ης Ιουνίου 1990 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, κολοκυθακιών από την
    Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1516/90 della Commissione, del 5 giugno 1990, che
    sopprime l'importo correttore da riscuotere all'importazione nella Comunità a
    dieci di zucchine in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1516/90 van de Commissie van 5 juni 1990 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van courgettes
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1516/90 da Comissão, de 5 de Junho de 1990, que
    suprime o montante corrector a cobrar aquando da importação na Comunidade a
    Dez de aboborinhas provenientes de Espanha, com excepção das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1516/90 de la Comisión, de 5 de junio de 1990, por
    el que se suprime el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de calabacines procedentes de España (excepto las
    Islas Canarias)
  type: main
