    Koillis-Atlantin merellisen ympäristön suojelua koskevalla yleissopimuksella
    perustetussa komissiossa Euroopan unionin puolesta otettavasta kannasta Pohjois-Atlantin
    virran ja Evlanov Seamountin merisuojelualueen (NACES-merisuojelualueen) vahvistamista
    koskevaan päätökseen ja NACES-merisuojelualueen hallinnointia koskevaan suositukseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2021/1796 ón gComhairle an 28 Meán Fómhair 2021 maidir
    leis an seasamh atá le glacadh thar ceann an Aontais Eorpaigh sa Choimisiún
    arna bhunú leis an gCoinbhinsiún maidir le Cosaint Mhuirthimpeallacht an Atlantaigh
    Thoir Thuaidh, a mhéid a bhaineann le cinnidh maidir leis an Limistéar Muirí
    faoi Chosaint Fheacht an Atlantaigh Thuaidh agus Thulán Grinnil Evlanov (NACES
    MPA) a bhunú agus le molta maidir le NACES MPA a bhainistiú
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2021/1796 od 28. rujna 2021. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Komisije osnovane Konvencijom o zaštiti
    morskog okoliša sjeveroistočnog Atlantika u pogledu odluke o uspostavi zaštićenog
    morskog područja sjevernoatlantske struje i Evlanovljeve podmorske planine (NACES)
    i preporuke o upravljanju zaštićenim morskim područjem NACES-a
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/1796 határozata (2021. szeptember 28.) az Atlanti-óceán
    északkeleti körzete tengeri környezetének védelméről szóló egyezmény
    által létrehozott bizottságban az Észak-atlanti-áramlat és Jevlanov-fenékhegy
    védett tengeri terület (NACES védett tengeri terület) létrehozásáról szóló
    határozattal és a NACES védett tengeri területtel való gazdálkodásról
    szóló ajánlással kapcsolatban az Európai Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/1796 del Consiglio del 28 settembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea in sede di Commissione istituita
    dalla convenzione per la protezione dell’ambiente marino dell’Atlantico nordorientale
    riguardo a una decisione sull’ istituzione della zona marittima protetta della
    corrente dell’Atlantico settentrionale e della montagna sottomarina Evlanov
    (ZMP NACES) e a una raccomandazione relativa alla gestione della ZMP NACES
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2021/1796 (2021. gada 28. septembris) par nostāju,
    kas Eiropas Savienības vārdā jāieņem komisijā, kas nodibināta ar Konvenciju
    par jūras vides aizsardzību Atlantijas okeāna Ziemeļaustrumu daļā, attiecībā
    uz lēmumu par Ziemeļatlantijas straumes un Jevlanova jūras pacēluma aizsargājamās
    jūras teritorijas (NACES MPA) noteikšanu un ieteikumu par NACES MPA pārvaldību
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2021/1796 2021 m. rugsėjo 28 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi pagal Konvenciją dėl šiaurės
    rytų Atlanto jūros aplinkos apsaugos (OSPAR konvenciją) įsteigtoje komisijoje,
    dėl sprendimo dėl Šiaurės Atlanto srovės ir Jevlanovo jūrkalnio saugomos
    jūrų teritorijos (NACES SJT) nustatymo ir rekomendacijos dėl NACES SJT valdymo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2021/1796 tat-28 ta’ Settembru 2021 dwar
    il-pożizzjoni li għandha tittieħed f’isem l-Unjoni Ewropea fil-Kummissjoni
    stabbilita mill-Konvenzjoni għall-Protezzjoni tal-Ambjent Marin tal-Atlantiku
    tal-Grigal fir-rigward ta’ deċiżjoni dwar l-istabbiliment taż-Żona Marina
    Protetta tal-Kurrent tal-Atlantiku tat-Tramuntana u tal-Muntanja Sottomarina Evlanov
    (l-“MPA tan-NACES”) u rakkomandazzjoni dwar il-ġestjoni tal-MPA tan-NACES
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/1796 van de Raad van 28 september 2021 betreffende het
    namens de Europese Unie in de commissie die is ingesteld bij het Verdrag inzake
    de bescherming van het mariene milieu in het noordoostelijk deel van de Atlantische
    Oceaan in te nemen standpunt inzake een besluit tot vaststelling van het beschermd
    marien gebied van de Noord-Atlantische stroom en de onderzeese berg Evlanov (MPA
    NACES) en een aanbeveling inzake het beheer van MPA NACES
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/1796 z dnia 28 września 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Komisji ustanowionej
    na mocy Konwencji o ochronie środowiska morskiego obszaru północno-wschodniego
    Atlantyku w odniesieniu do decyzji dotyczącej ustanowienia chronionego obszaru
    morskiego Prądu Północnoatlantyckiego i góry podwodnej Jewłanowa (NACES MPA)
    oraz zalecenia w sprawie zarządzania NACES MPA
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/1796 do Conselho de 28 de setembro de 2021 relativa
    à posição a tomar em nome da União Europeia no âmbito da Comissão criada
    pela Convenção para a Proteção do Meio Marinho do Atlântico Nordeste sobre
    uma decisão relativa à criação da área marinha protegida da Corrente do Atlântico
    Norte e Monte Submarino Evlanov (NACES MPA) e uma recomendação relativa à gestão
    da NACES MPA
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/1796 a Consiliului din 28 septembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul comisiei
    constituite prin Convenția privind protecția mediului marin al Atlanticului
    de Nord-Est cu privire la o decizie privind stabilirea Zonei marine protejate
    a curentului Atlanticului de Nord și a muntelui submarin Evlanov (NACES MPA)
    și la o recomandare privind gestionarea NACES MPA
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/1796 z 28. septembra 2021 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Komisii zriadenej Dohovorom o ochrane
    morského prostredia severovýchodného Atlantiku, pokiaľ ide o rozhodnutie o
    zriadení chránenej morskej oblasti Severoatlantického prúdu a podmorskej hory
    Evlanov (chránená morská oblasť NACES) a odporúčanie o spravovaní chránenej
    morskej oblasti NACES
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/1796 z dne 28. septembra 2021 o stališču, ki se
    zastopa v imenu Evropske unije v komisiji ustanovljeni s Konvencijo o varstvu
    morskega okolja severovzhodnega Atlantika glede sklepa o vzpostavitvi morskega
    zavarovanega območja Severnoatlantskega toka in podmorske gore Evlanova (North
    Atlantic Current and Evlanov Seamount - NACES) in priporočila o upravljanju morskega
    zavarovanega območja NACES
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/1796 del Consejo de 28 de septiembre de 2021 relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en la comisión
    creada por el Convenio para la Protección del Medio Ambiente Marino del Atlántico
    del Nordeste en relación con una decisión sobre el establecimiento de la zona
    marina protegida de la corriente del Atlántico Norte y el monte submarino Evlanov
    (ZMP NACES) y con una recomendación sobre la gestión de la ZMP NACES
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/1796 av den 28 september 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den kommission som inrättats
    genom konventionen för skydd av den marina miljön i Nordostatlanten vad gäller
    ett beslut om inrättande av det marina skyddsområdet Nordatlantiska strömmen
    och Evlanov Seamount (NACES MPA) och en rekommendation om förvaltningen av NACES
    MPA
