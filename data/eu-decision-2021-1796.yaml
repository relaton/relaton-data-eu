  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2021/1796, 28. september 2021, Euroopa Liidu nimel
    võetava seisukoha kohta Kirde-Atlandi merekeskkonna kaitse konventsiooniga moodustatud
    komisjonis seoses Põhja-Atlandi hoovuse ja Jevlanovi veealuse mäe merekaitseala
