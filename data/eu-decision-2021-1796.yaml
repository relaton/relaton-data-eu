title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1796 of 28 September 2021 on the position to
    be taken on behalf of the European Union within the Commission established by
    the Convention for the Protection of the Marine Environment of the North-East
    Atlantic as regards a decision on the establishment of the North Atlantic Current
    and Evlanov Seamount Marine Protected Area (NACES MPA) and a recommendation on
    the management of the NACES MPA
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1796 du Conseil du 28 septembre 2021 relative à la
    position à prendre, au nom de l’Union européenne, au sein de la Commission
    instituée par la convention pour la protection du milieu marin de l’Atlantique
    du Nord-Est en ce qui concerne une décision relative à l’établissement de
    l’aire maritime protégée du courant Nord Atlantique et du mont sous-marin
    Evlanov (AMP NACES) et une recommandation relative à la gestion de l’AMP NACES
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1796 des Rates vom 28. September 2021 über den im
    Namen der Europäischen Union in der durch das Übereinkommen zum Schutz der Meeresumwelt
    des Nordostatlantiks eingesetzten Kommission in Bezug auf einen Beschluss zur
    Einrichtung des Meeresschutzgebiets Nordatlantikstrom und Evlanov-Tiefseeberg
    (NACES-Meeresschutzgebiet) und eine Empfehlung für die Bewirtschaftung des NACES-Meeresschutzgebiets
    zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/1796 на Съвета от 28 септември
    2021 година за позицията, която трябва да се заеме
    от името на Европейския съюз в рамките на Комисията,
    създадена с Конвенцията за защита на морската
    среда на Североизточния Атлантически океан
    във връзка с решение за създаване на защитената
    морска зона, обхващаща Северноатлантическото
    течение и морското възвишение Евланов (NACES
    MPA), и препоръка относно управлението на NACES
    MPA
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/1796 ze dne 28. září 2021 o postoji, který
    má být zaujat jménem Evropské unie v komisi zřízené Úmluvou o ochraně
    mořského prostředí severovýchodního Atlantiku, pokud jde o rozhodnutí o
    zřízení chráněné mořské oblasti Severoatlantského proudu a Jevlanovovy
    podmořské hory (chráněná mořská oblast NACES) a doporučení ohledně řízení
    chráněné mořské oblasti NACES
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/1796 af 28. september 2021 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i den kommission, der er nedsat
    ved konventionen om beskyttelse af havmiljøet i det nordøstlige Atlanterhav,
    for så vidt angår en afgørelse om oprettelse af det beskyttede havområde »North
    Atlantic Current and Evlanov Seamount« (NACES-havbeskyttelsesområdet) og en
    henstilling om forvaltningen af NACES-havbeskyttelsesområdet
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2021/1796 του Συμβουλίου της 28ης
