title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1911/77 of 23 August 1977 re-establishing
    the levying of the customs duties on plaiting materials bound together in parallel
    strands etc., falling within heading No 46.02, originating in Hong Kong to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1911/77 de la Commission, du 23 août 1977, portant
    rétablissement de la perception des droits de douane applicables aux matières
    à tresser tissées à plat ou parallélisées, etc., de la position tarifaire
    46.02, originaires de Hong-Kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1911/77 der Kommission vom 23. August 1977 zur Wiedereinführung
    des Zollsatzes für Flechtstoffe, in Flächenform verwebt oder parallel aneinandergefügt,
    usw., der Tarifnummer 46.02, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1911/77 af 23. august 1977 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i pladeform, sammenbundne
    eller vævede etc., under position 46.02, som har oprindelse i Hongkong og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1911/77 della Commissione, del 23 agosto 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai materiali da intreccio
    tessuti o parallelizzati, ecc., della voce doganale 46.02, originari di Hong Kong
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1911/77 van de Commissie van 23 augustus 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op vlechtstoffen,
    vlak geweven of samengebonden, enz., van post 46.02, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
