  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 829/83 della Commissione dell' 8 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti a maglia non elastica
    né gommata, per bambini piccoli (bébés), della categoria di prodotti n. 68
    (codice 0680), originarie di Singapore, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 829/83 van de Commissie van 8 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk voor baby' s, van
    de categorie van produkten nr. 68 (codenummer 0680), van oorsprong uit Singapore,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3378/82 van de Raad
