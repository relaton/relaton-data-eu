title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 829/83 of 8 April 1983 re-establishing the
    levying of customs duties on babies' under garments of knitted or crocheted fabrics,
    not elastic or rubberized, products of category 68 (code 0680), originating in
    Singapore, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 829/83 de la Commission du 8 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux sous-vêtements de bonneterie
    non élastique ni caoutchoutée, pour bébés, de la catégorie de produits 68
    (code 0680), originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 829/83 der Kommission vom 8. April 1983 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68 (Kennziffer 0680),
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 829/83 af 8. april 1983 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastisk eller gummeret, til spædbørn, under kategori 68 (kode 0680), som har
    oprindelse i Singapore, og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 829/83 της Επιτροπής
    της 8ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για έτοιμα ενδύματα
    εσωτερικά (εσώρουχα) πλεκτά, μη ελαστικά ουδέ
    συνδεδυασμένα μετά καουτσούκ, διά βρέφη, της
    κατηγορίας προϊόντων 68 (κωδικός αριθμός 0680),
