    Community, on the one hand and the Czech Republic, Estonia, Hungary, Latvia, Lithuania,
    Poland, Slovakia and Slovenia on the other, and providing for certain derogations
    from the Multiannual Financing Agreements and from Council Regulation (EC) No
    1266/1999 and Regulation (EC) No 2222/2000
  type: main
