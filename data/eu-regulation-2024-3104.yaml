    na statističku klasifikaciju ekonomskih djelatnosti NACE utvrđenu Uredbom (EZ)
    br. 1893/2006 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/3104 felhatalmazáson alapuló rendelete (2024.
    szeptember 2.) a 184/2005/EK európai parlamenti és tanácsi rendeletnek a gazdasági
    tevékenységek statisztikai osztályozásának az 1893/2006/EK európai parlamenti
    és tanácsi rendelettel létrehozott NACE rendszerére való hivatkozások tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/3104 della Commissione, del 2 settembre
    2024, che modifica il regolamento (CE) n. 184/2005 del Parlamento europeo e del
    Consiglio per quanto riguarda i riferimenti alla classificazione statistica delle
    attività economiche NACE definita dal regolamento (CE) n. 1893/2006 del Parlamento
    europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/3104 (2024. gada 2. septembris),
    ar ko attiecībā uz atsaucēm uz NACE saimniecisko darbību statistisko klasifikāciju,
    kas izveidota ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1893/2006, groza
    Eiropas Parlamenta un Padomes Regulu (EK) Nr. 184/2005
  type: main
- language: lt
  script: Latn
  content: 2024 m. rugsėjo 2 d. Komisijos deleguotasis reglamentas (ES) 2024/3104,
    kuriuo dėl nuorodų į Europos Parlamento ir Tarybos reglamentu (EB) Nr. 1893/2006
    nustatytą statistinį ekonominės veiklos rūšių klasifikatorių NACE iš dalies
    keičiamas Europos Parlamento ir Tarybos reglamentas (EB) Nr. 184/2005
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/3104 tat-2 ta’ Settembru
