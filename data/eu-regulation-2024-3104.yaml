    siltä osin kuin on kyse viittauksista Euroopan parlamentin ja neuvoston asetuksella
    (EY) N:o 1893/2006 vahvistettuun tilastolliseen toimialaluokitukseen (NACE)
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2024/3104 ón gCoimisiún an 2 Meán Fómhair
    2024 lena leasaítear Rialachán (CE) Uimh. 184/2005 ó Pharlaimint na hEorpa
    agus ón gComhairle a mhéid a bhaineann le tagairtí d’aicmiú staidrimh gníomhaíochtaí
