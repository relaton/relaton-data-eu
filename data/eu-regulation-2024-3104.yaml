    Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2024/3104 van de Commissie van 2 september
    2024 tot wijziging van Verordening (EG) nr. 184/2005 van het Europees Parlement
    en de Raad wat betreft verwijzingen naar de statistische classificatie van economische
    activiteiten NACE die is vastgesteld bij Verordening (EG) nr. 1893/2006 van het
    Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/3104 z dnia 2 września 2024
