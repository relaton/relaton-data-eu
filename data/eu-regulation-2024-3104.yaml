    majanduse tegevusalade statistilisele klassifikaatorile NACE, mis on kehtestatud
    Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1893/2006
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2024/3104, annettu 2 päivänä syyskuuta
