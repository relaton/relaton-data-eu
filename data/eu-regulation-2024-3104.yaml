    w zakresie odniesień do statystycznej klasyfikacji działalności gospodarczej
    NACE ustanowionej rozporządzeniem (WE) nr 1893/2006 Parlamentu Europejskiego
    i Rady
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/3104 da Comissão, de 2 de setembro de 2024,
    que altera o Regulamento (CE) n.o 184/2005 do Parlamento Europeu e do Conselho
    no que diz respeito às referências à nomenclatura estatística das atividades
    económicas NACE estabelecida pelo Regulamento (CE) n.o 1893/2006 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/3104 al Comisiei din 2 septembrie 2024 de
    modificare a Regulamentului (CE) nr. 184/2005 al Parlamentului European și al
    Consiliului în ceea ce privește trimiterile la nomenclatorul statistic al activităților
    economice NACE stabilit prin Regulamentul (CE) nr. 1893/2006 al Parlamentului
    European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/3104 z 2. septembra 2024, ktorým
