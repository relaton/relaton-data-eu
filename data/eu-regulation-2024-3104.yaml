title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/3104 of 2 September 2024 amending
    Regulation (EC) No 184/2005 of the European Parliament and of the Council, as
    regards references to the statistical classification of economic activities NACE
    established by Regulation (EC) No 1893/2006 of the European Parliament and of
    the Council
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/3104 de la Commission du 2 septembre 2024
    modifiant le règlement (CE) no 184/2005 du Parlement européen et du Conseil
    en ce qui concerne les références à la nomenclature statistique des activités
    économiques NACE établie par le règlement (CE) no 1893/2006 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/3104 der Kommission vom 2. September 2024
    zur Änderung der Verordnung (EG) Nr. 184/2005 des Europäischen Parlaments und
    des Rates in Bezug auf die mit der Verordnung (EG) Nr. 1893/2006 des Europäischen
    Parlaments und des Rates aufgestellte statistische Systematik der Wirtschaftszweige
    NACE
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/3104 на Комисията
    от 2 септември 2024 година за изменение на Регламент
    (ЕО) № 184/2005 на Европейския парламент и на Съвета
    по отношение на позоваванията на статистическата
    класификация на икономическите дейности NACE,
    установена с Регламент (ЕО) № 1893/2006 на Европейския
    парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/3104 ze dne 2. září
    2024, kterým se mění nařízení Evropského parlamentu a Rady (ES) č. 184/2005,
    pokud jde o odkazy na statistickou klasifikaci ekonomických činností NACE zavedenou
    nařízením Evropského parlamentu a Rady (ES) č. 1893/2006
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/3104 af 2. september 2024
    om ændring af Europa-Parlamentets og Rådets forordning (EF) nr. 184/2005 for
    så vidt angår henvisninger til den statistiske nomenklatur for økonomiske aktiviteter
    (NACE), som blev indført ved Europa-Parlamentets og Rådets forordning (EF) nr.
    1893/2006
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2024/3104
    της Επιτροπής, της 2ας Σεπτεμβρίου 2024, για την
    τροποποίηση του κανονισμού (ΕΚ) αριθ. 184/2005 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά τις παραπομπές στη στατιστική ταξινόμηση
    των οικονομικών δραστηριοτήτων NACE που θεσπίστηκε
