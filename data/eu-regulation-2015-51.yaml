id: EURegulation201551
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/51 of 14 January 2015 approving
    the active substance chromafenozide, in accordance with Regulation (EC) No 1107/2009
    of the European Parliament and of the Council concerning the placing of plant
    protection products on the market, and amending the Annex to Commission Implementing
    Regulation (EU) No 540/2011 and allowing Member States to extend provisional authorisations
    granted for that active substance
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/51 de la Commission du 14 janvier 2015
    portant approbation de la substance active chromafénozide, conformément au règlement
    (CE) n ° 1107/2009 du Parlement européen et du Conseil concernant la mise sur
    le marché des produits phytopharmaceutiques, modifiant l'annexe du règlement
    d'exécution (UE) n ° 540/2011 de la Commission et autorisant les États membres
    à prolonger les autorisations provisoires accordées pour cette substance active
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/51 der Kommission vom 14. Januar 2015
    zur Genehmigung des Wirkstoffs Chromafenozid gemäß der Verordnung (EG) Nr. 1107/2009
    des Europäischen Parlaments und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    und zur Änderung des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der
    Kommission sowie zur Ermächtigung der Mitgliedstaaten, die vorläufigen Zulassungen
    bezüglich dieses Wirkstoffs zu verlängern
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/51 на Комисията
    от 14 януари 2015 година за одобряване на активното
    вещество хромафенозид в съответствие с Регламент
    (ЕО) № 1107/2009 на Европейския парламент и на Съвета
    относно пускането на пазара на продукти за
    растителна защита и за изменение на приложението
    към Регламент за изпълнение (ЕС) № 540/2011 и за
    даване право на държавите членки да удължат
    временните разрешения, издадени за посоченото
    активно вещество
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/51 ze dne 14. ledna 2015 , kterým
    se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009 o
    uvádění přípravků na ochranu rostlin na trh schvaluje účinná látka chromafenozid,
    mění příloha prováděcího nařízení Komise (EU) č. 540/2011 a umožňuje
    členským státům prodloužit dočasná povolení udělená pro uvedenou účinnou
    látku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/51 af 14. januar 2015
    om godkendelse af aktivstoffet chromafenozid, jf. Europa-Parlamentets og Rådets
    forordning (EF) nr. 1107/2009 om markedsføring af plantebeskyttelsesmidler, om
    ændring af bilaget til Kommissionens gennemførelsesforordning (EU) nr. 540/2011
    og om medlemsstaternes forlængelse af midlertidige godkendelser af dette aktivstof
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/51 της Επιτροπής,
    της 14ης Ιανουαρίου 2015 , για την έγκριση της
    δραστικής ουσίας chromafenozide, σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου σχετικά με τη διάθεση φυτοπροστατευτικών
    προϊόντων στην αγορά και για την τροποποίηση
    του παραρτήματος του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 540/2011 της Επιτροπής, και για να επιτραπεί
    στα κράτη μέλη να παρατείνουν τη διάρκεια ισχύος
    των προσωρινών αδειών κυκλοφορίας που έχουν
    χορηγηθεί για την εν λόγω δραστική ουσία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/51, 14. jaanuar 2015 , millega kiidetakse
    heaks toimeaine kromafenosiid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1107/2009 taimekaitsevahendite turulelaskmise kohta ning muudetakse komisjoni
    rakendusmääruse (EL) nr 540/2011 lisa ja lubatakse liikmesriikidel pikendada
    seda toimeainet hõlmavaid ajutisi lube
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/51, annettu 14 päivänä
    tammikuuta 2015 , tehoaineen kromafenotsidi hyväksymisestä kasvinsuojeluaineiden
    markkinoille saattamisesta annetun Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1107/2009 mukaisesti ja komission täytäntöönpanoasetuksen (EU) N:o
    540/2011 liitteen muuttamisesta sekä jäsenvaltioiden mahdollisuudesta pidentää
    kyseistä tehoainetta koskevia väliaikaisia lupia
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/51 оd 14. siječnja 2015. o odobravanju
    aktivne tvari kromafenozida u skladu s Uredbom (EZ) br. 1107/2009 Europskog parlamenta
    i Vijeća o stavljanju na tržište sredstava za zaštitu bilja, o izmjeni Priloga
    Provedbenoj uredbi Komisije (EU) br. 540/2011 i o dopuštanju državama članicama
    da produlje privremena odobrenja izdana za tu aktivnu tvar
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/51 végrehajtási rendelete ( 2015. január 14.
    ) a kromafenozid hatóanyagnak a növényvédő szerek forgalomba hozataláról
    szóló 1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyásáról,
    továbbá az 540/2011/EU bizottsági végrehajtási rendelet mellékletének módosításáról
    és az említett hatóanyag ideiglenes engedélyeinek a tagállamok által történő
    meghosszabbításának engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/51 della Commissione, del 14 gennaio
    2015 , che approva la sostanza attiva cromafenozide in conformità al regolamento
    (CE) n. 1107/2009 del Parlamento europeo e del Consiglio relativo all'immissione
    sul mercato dei prodotti fitosanitari, modifica l'allegato del regolamento di
    esecuzione (UE) n. 540/2011 della Commissione e consente agli Stati membri di
    prorogare le autorizzazioni provvisorie concesse per tale sostanza attiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/51 ( 2015. gada 14. janvāris
    ), ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1107/2009
    par augu aizsardzības līdzekļu laišanu tirgū apstiprina darbīgo vielu hromafenozīdu
    un groza Komisijas Īstenošanas regulas (ES) Nr. 540/2011 pielikumu, kā arī
    atļauj dalībvalstīm pagarināt minētajai darbīgajai vielai piešķirto pagaidu
    atļauju periodu
  type: main
- language: lt
  script: Latn
  content: 2015 m. sausio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2015/51,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką patvirtinama veiklioji medžiaga
    chromafenozidas ir iš dalies keičiamas Komisijos įgyvendinimo reglamento (ES)
    Nr. 540/2011 priedas ir kuriuo valstybėms narėms leidžiama pratęsti šiai
    veikliajai medžiagai suteiktos laikinosios registracijos galiojimą
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/51 tal- 14 ta'
    Jannar 2015 li japprova s-sustanza attiva kromafenożid, skont ir-Regolament (KE)
    Nru 1107/2009 tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta'
    prodotti għall-protezzjoni tal-pjanti, u li jemenda l-Anness tar-Regolament ta'
    Implimentazzjoni tal-Kummissjoni (UE) Nru 540/2011 u li jippermetti lill-Istati
    Membri jestendu l-awtorizzazzjonijiet proviżorji mogħtija għal dik is-sustanza
    attiva
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/51 van de Commissie van 14 januari 2015
    tot goedkeuring van de werkzame stof chromafenozide overeenkomstig Verordening
    (EG) nr. 1107/2009 van het Europees Parlement en de Raad betreffende het op de
    markt brengen van gewasbeschermingsmiddelen, tot wijziging van de bijlage bij
    Uitvoeringsverordening (EU) nr. 540/2011 van de Commissie, en waarbij aan de lidstaten
    toestemming wordt verleend om de geldigheidsduur van de voorlopige toelatingen
    voor die werkzame stof te verlengen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/51 z dnia 14 stycznia 2015
    r. w sprawie zatwierdzenia substancji czynnej chromafenozyd, zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do
    obrotu środków ochrony roślin, oraz zmiany załącznika do rozporządzenia
    wykonawczego Komisji (UE) nr 540/2011, a także w sprawie zezwolenia państwom
    członkowskim na przedłużenie tymczasowych zezwoleń udzielonych na tę substancję
    czynną
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/51 da Comissão, de 14 de janeiro de
    2015 , que aprova a substância ativa cromafenozida, em conformidade com o Regulamento
    (CE) n. ° 1107/2009 do Parlamento Europeu e do Conselho relativo à colocação
    dos produtos fitofarmacêuticos no mercado, e que altera o anexo do Regulamento
    de Execução (UE) n. ° 540/2011 da Comissão e autoriza os Estados-Membros a
    prorrogar as autorizações provisórias concedidas para essa substância ativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/51 al Comisiei din 14 ianuarie
    2015 de aprobare a substanței active cromafenozidă, în conformitate cu Regulamentul
    (CE) nr. 1107/2009 al Parlamentului European și al Consiliului privind introducerea
    pe piață a produselor fitosanitare, de modificare a anexei la Regulamentul de
    punere în aplicare (UE) nr. 540/2011 al Comisiei și de acordare a permisiunii
    statelor membre să prelungească autorizațiile provizorii pentru substanța
    activă respectivă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/51 zo 14. januára 2015 , ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh schvaľuje účinná látka
    chromafenozid, ktorým sa mení príloha k vykonávaciemu nariadeniu Komisie (EÚ)
    č. 540/2011 a ktorým sa členským štátom povoľuje predĺžiť platnosť
    dočasných autorizácií udelených pre uvedenú účinnú látku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/51 z dne 14. januarja 2015 o odobritvi
    aktivne snovi kromafenozid v skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta
    in Sveta o dajanju fitofarmacevtskih sredstev v promet, o spremembi Priloge k
    Izvedbeni uredbi Komisije (EU) št. 540/2011 ter o dovoljenju državam članicam,
    da podaljšajo veljavnost začasnih registracij, ki so jih izdale za navedeno
    aktivno snov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/51 de la Comisión, de 14 de enero de
    2015 , por el que se aprueba la sustancia activa cromafenozida, de conformidad
    con el Reglamento (CE) n ° 1107/2009 del Parlamento Europeo y del Consejo, relativo
    a la comercialización de productos fitosanitarios, se modifica el anexo del Reglamento
    de Ejecución (UE) n ° 540/2011 de la Comisión y se permite a los Estados miembros
    que amplíen las autorizaciones provisionales concedidas en relación con esa
    sustancia activa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/51 av den 14 januari 2015
    om godkännande av det verksamma ämnet kromafenozid i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1107/2009 om utsläppande av växtskyddsmedel
    på marknaden, om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011 och om tillstånd för medlemsstaterna att förlänga provisoriska
    godkännanden som beviljats det verksamma ämnet
  type: main
