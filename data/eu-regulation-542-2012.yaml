    concernant l’adoption de mesures restrictives spécifiques à l’encontre de
    certaines personnes et entités dans le cadre de la lutte contre le terrorisme,
    et abrogeant le règlement d’exécution (UE) n ° 1375/2011
  type: main
- language: de
  script: Latn
