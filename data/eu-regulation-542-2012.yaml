  script: Latn
  content: Council Implementing Regulation (EU) No 542/2012 of 25 June 2012 implementing
    Article 2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism
    and repealing Implementing Regulation (EU) No 1375/2011
  type: main
- language: fr
  script: Latn
