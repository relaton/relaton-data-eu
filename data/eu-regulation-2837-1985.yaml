title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2837/85 of 9 October 1985 re-establishing
    the levying of the customs duties applicable to certain automatic data-processing
    machines and units thereof falling within subheading 84.53 B of the Common Customs
    Tariff, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2837/85 de la Commission du 9 octobre 1985 portant
    rétablissement de la perception des droits de douane applicables à certaines
    machines automatiques de traitement de l' information et leurs unités, de la
    sous-position 84.53 B du tarif douanier commun, originaires de Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2837/85 der Kommission vom 9. Oktober 1985 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte automatische Datenverarbeitungsmaschinen
    und ihre Einheiten, der Tarifnummer 84.53 B des Gemeinsamen Zolltarifs mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2837/85 af 9. oktober 1985 om genindførelse
    af opkrævning af told for bestemte automatiske databehandlingsmaskiner og enheder
    dertil, henhørende under pos. 84.53 B og med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2837/85 της Επιτροπής
    της 9ης Οκτωβρίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένες αυτοματικές
    μηχανές επεξεργασίας πληροφοριών και μονάδες
    (στοιχεία) αυτών της διακρίσεως 84.53 Β του Κοινού
    Δασμολογίου, καταγωγής Νότιας Κορέας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2837/85 della Commissione del 9 ottobre 1985 che ripristina
    la riscossione dei dazi doganali applicabili per alcune macchine automatiche per
    l' elaborazione dell' informazione e loro unità, della sottovoce 84.53 B della
    tariffa doganale comune, originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2837/85 van de Commissie van 9 oktober 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op sommige automatische
    gegevensverwerkende machines en eenheden daarvoor, van postonderverdeling 84.53
    B, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3562/84
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
