title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 juin 1965, relative à l'autorisation
    d'une réduction tarifaire de 15 % applicable aux transports d'artichauts en provenance
    de la Bretagne, effectués par chemin de fer ou par route sur une distance d'au
    moins 650 km
  type: main
- language: de
  script: Latn
  content: '65/370/EWG: Entscheidung der Kommission vom 29. Juni 1965 über die Genehmigung
    einer Tarifermäßigung von 15 v. H. für Beförderungen von Artischocken aus
    der Bretagne mit der Eisenbahn und im Güterkraftverkehr über Entfernungen von
    mindestens 650 km'
  type: main
- language: it
  script: Latn
  content: '65/370/CEE: Decisione della Commissione, del 29 giugno 1965, relativa
    all''autorizzazione di una riduzione tariffaria del 15% per i trasporti di carciofi
    in provenienza dalla Bretagna, effettuati per ferrovia o su strada su una distanza
    di almeno 650 km'
  type: main
- language: nl
  script: Latn
  content: '65/370/EEG: Beschikking van de Commissie van 29 juni 1965 houdende machtiging
    tot het toepassen van een tariefreductie van 15% voor het vervoer van artisjokken
    uit Bretagne dat per spoor of over de weg over een afstand van ten minste 650
    km plaatsvindt'
  type: main
