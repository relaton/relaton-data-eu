id: EUDecision1976413
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 4 March 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to certain men's and boys' outer garments, falling within
    heading No ex 61.01 of the Common Customs Tariff, originating in Taiwan and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/413/CEE: Décision de la Commission, du 4 mars 1976, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire certains vêtements de dessus pour hommes
    et garçonnets, de la position Ex 61.01 du Tarif douanier commun, originaires
    de Taiwan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. März 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, bestimmte aus Taiwan stammende und in den anderen Mitgliedstaaten im freien
    Verkehr befindliche Oberkleidung für Männer und Knaben der Tarifnummer ex 61.01
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. marts 1976 om bemyndigelse af kongeriget
    Nederlandene til fra fællesskabsbehandling at undtage visse yderbeklædningsgenstande
    til mænd og drenge, som henhører under pos. ex 61.01 i den fælles toldtarif,
    har oprindelse i Taiwan, og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 marzo 1976, che autorizza il Regno del
    Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario taluni indumenti esterni per uomo e per ragazzo della
    voce ex 61.01 della tariffa doganale comune, originari di Taiwan e immessi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 maart 1976 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    bepaalde heren- en jongensbovenkleding van post ex 61.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taïwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
