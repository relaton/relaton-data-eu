type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2016/80 of 28 July 1980 re-establishing
    the levying of customs duties on ties, bow ties and cravats, other than knitted
    or crocheted, of wool, of cotton or of man-made textile fibres, products of category
    85 (code 0850), originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2016/80 de la Commission, du 28 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux cravates,
    autres qu' en bonneterie, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la catégorie de produits n° 85 (code 0850), originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2016/80 der Kommission vom 28. Juli 1980 über die
    Wiedereinführung des Zollsatzes für Krawatten, andere als Wirkwaren, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Warenkategorie
    Nr. 85 (Kennziffer 0850), mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2016/80 af 28. juli 1980 om genindførelse
    af opkrævning af toldafgifter for slips og halsbind, sjaler, tørklæder, mantiller,
    slør, o.lign. ; bortset fra varer af trikotage, af uld, bomuld eller kemofibre,
    under varekategori 85 (kode 0850), som har oprindelse i Hongkong og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2016/80 della Commissione, del 28 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle cravatte, escluse
    quelle a maglia, di cotone, di lana, di fibre tessili sintetiche o artificiali,
    della categoria di prodotti n. 85 (codice 0850), originari di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2016/80 van de Commissie van 28 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dassen,
    andere dan van brei- of haakwerk, van wol, van katoen, van synthetische of van
    kunstmatige textielvezels, van de categorie van produkten nr. 85 (codenummer 0850)
    van oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
