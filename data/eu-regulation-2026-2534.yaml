    și control aplicabile în zona Convenției Organizației regionale de gestionare
    a pescuitului în Pacificul de Sud (SPRFMO), a Regulamentului (UE) 2019/833 de
    instituire a unor măsuri de conservare și executare care se aplică în zona de
    reglementare a Organizației de Pescuit în Atlanticul de Nord-Vest, a Regulamentului
    (UE) 2021/56 de stabilire a măsurilor de gestionare, conservare și control aplicabile
    în zona Convenției Comisiei interamericane pentru tonul tropical, a Regulamentului
    (UE) 2022/2056 de stabilire a măsurilor de conservare și gestionare aplicabile
    în zona Convenției pentru pescuitul în Oceanul Pacific de Vest și Central, a Regulamentului
    (UE) 2022/2343 de stabilire a unor măsuri de gestionare, conservare și control
    aplicabile în zona de competență a Comisiei Tonului din Oceanul Indian (IOTC)
