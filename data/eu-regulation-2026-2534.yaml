  content: Regulamento (UE) 2026/2534 do Parlamento Europeu e do Conselho, de 21 de
    outubro de 2026, que altera o Regulamento (UE) 2017/2107 que estabelece medidas
    de gestão, de conservação e de controlo aplicáveis na zona da Convenção da Comissão
    Internacional ara a Conservação dos Tunídeos do Atlântico (CICTA), o Regulamento
    (UE) 2018/975 que estabelece medidas de gestão, de conservação e de controlo aplicáveis
    na zona da Convenção da Organização Regional de Gestão das Pescas do Pacífico
    Sul (SPRFMO), o Regulamento (UE) 2019/833 que estabelece medidas de conservação
    e de execução aplicáveis na Área de Regulamentação da Organização das Pescarias
    do Noroeste do Atlântico, o Regulamento (UE) 2021/56 que estabelece medidas de
    gestão, de conservação e de controlo aplicáveis na área da Convenção Interamericana
    do Atum Tropical, o Regulamento (UE) 2022/2056 que estabelece medidas de conservação
    e de gestão aplicáveis na zona da Convenção das Pescas do Pacífico Ocidental e
    Central, o Regulamento (UE) 2022/2343 que estabelece medidas de gestão, de conservação
    e de controlo aplicáveis na zona de competência da Comissão do Atum do Oceano
    Índico (IOTC) e o Regulamento (UE) 2023/2053 que estabelece um plano de gestão
    plurianual do atum rabilho no Atlântico Este e no Mediterrâneo
