    i kontroli mających zastosowanie na obszarze podlegającym kompetencji Komisji
    ds. Tuńczyka na Oceanie Indyjskim (IOTC) oraz rozporządzenia (UE) 2023/2053 ustanawiającego
    wieloletni plan zarządzania zasobami tuńczyka błękitnopłetwego we wschodnim Atlantyku
    i w Morzu Śródziemnym
