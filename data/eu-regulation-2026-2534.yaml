    apgabalā piemērojamos pārvaldības, saglabāšanas un kontroles pasākumus, Regulu
    (ES) 2022/2056, ar ko nosaka Klusā okeāna rietumu un centrālās daļas zvejniecības
    konvencijas apgabalā piemērojamus saglabāšanas un pārvaldības pasākumus, Regulu
    (ES) 2022/2343, ar ko nosaka pārvaldības, saglabāšanas un kontroles pasākumus,
    kuri piemērojami Indijas okeāna tunzivju komisijas (IOTC) kompetences apgabalā,
    un Regulu (ES) 2023/2053, ar ko izveido daudzgadu pārvaldības plānu zilajai tunzivij
    Atlantijas okeāna austrumu daļā un Vidusjūrā
  type: main
- language: lt
  script: Latn
  content: 2026 m. spalio 21 d. Europos Parlamento ir Tarybos reglamentas (ES) 2026/2534,
    kuriuo iš dalies keičiamas Reglamentas (ES) 2017/2107, kuriuo nustatomos valdymo,
    išsaugojimo ir kontrolės priemonės, taikytinos Tarptautinės Atlanto tunų apsaugos
    komisijos (ICCAT) valdomame konvencijos rajone, Reglamentas (ES) 2018/975, kuriuo
    nustatomos valdymo, išsaugojimo ir kontrolės priemonės, taikytinos Regioninės
    žvejybos pietų Ramiajame vandenyne valdymo organizacijos (SPRFMO) konvencijos
    rajone, Reglamentas (ES) 2019/833, kuriuo nustatomos išsaugojimo ir vykdymo užtikrinimo
    priemonės, taikytinos Žvejybos šiaurės vakarų Atlante organizacijos reguliuojamame
    rajone, Reglamentas (ES) 2021/56, kuriuo nustatomos Amerikos tropinių tunų konvencijos
    rajone taikytinos valdymo, išsaugojimo ir kontrolės priemonės, Reglamentas (ES)
    2022/2056, kuriuo nustatomos Žvejybos vakarų ir vidurio Ramiajame vandenyne konvencijos
    rajone taikytinos išteklių išsaugojimo ir valdymo priemonės, Reglamentas (ES)
    2022/2343, kuriuo nustatomos Indijos vandenyno tunų komisijos (IOTC) kompetencijos
    rajone taikytinos valdymo, išsaugojimo ir kontrolės priemonės, ir Reglamentas
    (ES) 2023/2053, kuriuo nustatomas daugiametis rytų Atlanto ir Viduržemio jūros
    paprastųjų tunų išteklių valdymo planas
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2026/2534 tal-Parlament Ewropew u tal-Kunsill tal-21 ta’
    Ottubru 2026 li jemenda r-Regolament (UE) 2017/2107 li jistabbilixxi l-miżuri
    ta’ ġestjoni, ta’ konservazzjoni u ta’ kontroll applikabbli fiż-żona tal-Konvenzjoni
    tal-Kummissjoni Internazzjonali għall-Konservazzjoni tat-Tonn tal-Atlantiku (ICCAT),
    ir-Regolament (UE) 2018/975 li jistabbilixxi miżuri ta’ ġestjoni, ta’ konservazzjoni
    u ta’ kontroll li japplikaw fl-Organizzazzjoni Reġjonali għall-Ġestjoni tas-Sajd
    fin-Nofsinhar tal-Paċifiku (SPRFMO) Żona tal-Konvenzjoni, ir-Regolament (UE) 2019/833
    li jistabbilixxi miżuri ta’ konservazzjoni u ta’ infurzar li japplikaw fiż-Żona
    Regolatorja tal-Organizzazzjoni tas-Sajd fl-Atlantiku tal-Majjistral, ir-Regolament
    (UE) 2021/56 li jistabbilixxi miżuri ta’ ġestjoni, ta’ konservazzjoni u ta’ kontroll
    applikabbli fiż-żona tal-Konvenzjoni Inter-Amerikana għat-Tonn Tropikali, ir-Regolament
    (UE) 2022/2056 li jistabbilixxi miżuri ta’ konservazzjoni u ta’ ġestjoni applikabbli
    fiż-Żona tal-Konvenzjoni dwar is-Sajd fil-Punent tal-Paċifiku u l-Paċifiku Ċentrali,
    ir-Regolament (UE) 2022/2343 li jistabbilixxi l-miżuri ta’ ġestjoni, ta’ konservazzjoni
    u ta’ kontroll li japplikaw fiż-Żona ta’ Kompetenza tal-Kummissjoni dwar it-Tonn
    tal-Oċean Indjan (IOTC), u r-Regolament (UE) 2023/2053 li jistabbilixxi pjan ta’
    ġestjoni pluriennali għat-tonn fil-Lvant tal-Atlantiku u fil-Mediterran
  type: main
