  script: Latn
  content: Verordening (EU) 2026/2534 van het Europees Parlement en de Raad van 21
    oktober 2026 tot wijziging van Verordening (EU) 2017/2107 tot vaststelling van
    in het verdragsgebied van de Internationale Commissie voor de instandhouding van
    Atlantische tonijnen (Iccat) geldende beheers-, instandhoudings- en controlemaatregelen,
    Verordening (EU) 2018/975 tot vaststelling van de beheers-, instandhoudings- en
    controlemaatregelen die gelden in het verdragsgebied van de regionale organisatie
    voor het visserijbeheer in het zuidelijke deel van de Stille Oceaan (SPRFMO),
    Verordening (EU) 2019/833 tot vaststelling van instandhoudings- en handhavingsmaatregelen
    die van toepassing zijn in het gereglementeerde gebied van de Visserijorganisatie
    voor het noordwestelijk deel van de Atlantische Oceaan, Verordening (EU) 2021/56
    tot vaststelling van de beheers-, instandhoudings- en controlemaatregelen die
    gelden in het verdragsgebied van de Inter-Amerikaanse Commissie voor tropische
    tonijn, Verordening (EU) 2022/2056 tot vaststelling van de instandhoudings- en
    beheersmaatregelen die gelden in het verdragsgebied van de Commissie voor de visserij
    in het westelijke en centrale deel van de Stille Oceaan, Verordening (EU) 2022/2343
    tot vaststelling van beheers-, instandhoudings- en controlemaatregelen die gelden
    in het bevoegdheidsgebied van de Commissie voor de tonijnvisserij in de Indische
    Oceaan (IOTC), en Verordening (EU) 2023/2053 tot vaststelling van een meerjarig
    beheersplan voor blauwvintonijn in het oostelijke deel van de Atlantische Oceaan
    en in de Middellandse Zee
  type: main
