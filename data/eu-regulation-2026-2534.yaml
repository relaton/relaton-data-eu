  content: Regulamentul (UE) 2026/2534 al Parlamentului European și al Consiliului
    din 21 octombrie 2026 de modificare a Regulamentului (UE) 2017/2107 de stabilire
    a măsurilor de gestionare, conservare și control aplicabile în zona Convenției
    Comisiei Internaționale pentru Conservarea Tonului din Oceanul Atlantic (ICCAT),
