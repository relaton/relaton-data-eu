  content: Europaparlamentets och rådets förordning (EU) 2026/2534 av den 21 oktober
    2026 om ändring av förordning (EU) 2017/2107 om införande av förvaltnings-, bevarande-
    och kontrollåtgärder som ska tillämpas i konventionsområdet för Internationella
    kommissionen för bevarande av tonfisk i Atlanten (Iccat), förordning (EU) 2018/975
    om införande av förvaltnings-, bevarande- och kontrollåtgärder som ska tillämpas
    i konventionsområdet för Regionala fiskeriförvaltningsorganisationen för södra
    Stilla havet (SPRFMO), förordning (EU) 2019/833 om fastställande av bevarande-
    och tillämpningsföreskrifter som är tillämpliga i regleringsområdet för Fiskeriorganisationen
    för Nordatlantens västra del, förordning (EU) 2021/56 om fastställande av förvaltnings-,
    bevarande- och kontrollåtgärder som är tillämpliga i det område som omfattas av
    den interamerikanska konventionen för tropisk tonfisk, förordning (EU) 2022/2056
    om fastställande av bevarande- och förvaltningsåtgärder tillämpliga i konventionsområdet
    för fisket i västra och mellersta Stilla havet, förordning (EU) 2022/2343 om fastställande
    av förvaltnings-, bevarande- och kontrollåtgärder som ska tillämpas i Indiska
    oceanens tonfiskkommissions (IOTC) behörighetsområde och förordning (EU) 2023/2053
    om upprättande av en flerårig förvaltningsplan för blåfenad tonfisk i östra Atlanten
    och Medelhavet
