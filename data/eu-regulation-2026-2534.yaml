  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2026/2534 z dnia 21
    października 2026 r. w sprawie zmiany rozporządzenia (UE) 2017/2107 ustanawiającego
    środki zarządzania, ochrony i kontroli obowiązujące na obszarze konwencji Międzynarodowej
    Komisji ds. Ochrony Tuńczyka Atlantyckiego (ICCAT), rozporządzenia (UE) 2018/975
    ustanawiającego środki zarządzania, ochrony i kontroli obowiązujące na obszarze
    konwencji Regionalnej Organizacji ds. Zarządzania Rybołówstwem na Południowym
