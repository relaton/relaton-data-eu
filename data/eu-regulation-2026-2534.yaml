  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2026/2534 z 21. októbra 2026,
    ktorým sa mení nariadenie (EÚ) 2017/2107, ktorým sa stanovujú riadiace, ochranné
    a kontrolné opatrenia uplatniteľné v oblasti dohovoru Medzinárodnej komisie pre
    zachovanie atlantických tuniakov (ICCAT), nariadenie (EÚ) 2018/975, ktorým sa
    stanovujú opatrenia na riadenie, ochranu a kontrolu uplatniteľné v oblasti dohovoru
    Regionálnej organizácie pre riadenie rybárstva v južnom Tichom oceáne (SPRFMO),
    nariadenie (EÚ) 2019/833, ktorým sa ustanovujú ochranné a vynucovacie opatrenia
    uplatniteľné v regulačnej oblasti Organizácie pre rybolov v severozápadnom Atlantiku,
    nariadenie (EÚ) 2021/56, ktorým sa stanovujú riadiace, ochranné a kontrolné opatrenia
    platné v oblasti dohovoru Medziamerickej komisie pre tropické tuniaky, nariadenie
    (EÚ) 2022/2056, ktorým sa stanovujú ochranné a riadiace opatrenia uplatniteľné
    v oblasti Dohovoru o rybolove v západnom a strednom Tichom oceáne, nariadenie
    (EÚ) 2022/2343, ktorým sa stanovujú riadiace, ochranné a kontrolné opatrenia platné
    v oblasti pôsobnosti Komisie pre tuniaky z Indického oceánu (IOTC), a nariadenie
    (EÚ) 2023/2053, ktorým sa stanovuje viacročný plán riadenia populácie tuniaka
    modroplutvého vo východnej časti Atlantického oceánu a v Stredozemnom mori
  type: main
