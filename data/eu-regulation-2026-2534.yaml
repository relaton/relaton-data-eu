    upravnem območju Organizacije za ribištvo severozahodnega Atlantika, Uredbe (EU)
    2021/56 o določitvi upravljalnih, ohranitvenih in nadzornih ukrepov, ki se uporabljajo
    na območju Konvencije o krepitvi Medameriške komisije za tropske tune, Uredbe
