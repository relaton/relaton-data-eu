    i egzekwowania mające zastosowanie na obszarze podlegającym regulacji Organizacji
    Rybołówstwa Północno-Zachodniego Atlantyku, rozporządzenia (UE) 2021/56 ustanawiającego
    środki zarządzania, ochrony i kontroli obowiązujące na obszarze objętym Konwencją
    ustanawiającą Międzyamerykańską Komisję ds. Tuńczyka Tropikalnego, rozporządzenia
    (UE) 2022/2056 w sprawie ustanowienia środków ochrony i zarządzania obowiązujących
    na obszarze objętym konwencją w sprawie rybołówstwa na zachodnim i środkowym Pacyfiku,
