    des östlichen und des südlichen Afrika einerseits und der Europäischen Gemeinschaft
    und ihren Mitgliedstaaten andererseits eingesetzten WPA-Ausschuss zur Änderung
    einiger Bestimmungen des Protokolls 1 über die Bestimmung des Begriffs „Erzeugnisse
    mit Ursprung in“ oder „Ursprungserzeugnisse“ und über die Methoden der
    Zusammenarbeit der Verwaltungen zu vertreten ist
