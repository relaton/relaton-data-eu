    AAE creado por el Acuerdo interino por el que se establece un marco para un Acuerdo
    de Asociación Económica entre los Estados del África Oriental y Meridional,
    por una parte, y la Comunidad Europea y sus Estados miembros, por otra, con respecto
    a la modificación de determinadas disposiciones del Protocolo 1 relativo a la
    definición del concepto de «productos originarios» y a los métodos de cooperación
    administrativa
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2019/1319 av den 25 juni 2019 om fastställande av
    den ståndpunkt som ska intas på Europeiska unionens vägnar i AEP-kommittén,
    som inrättades genom interimsavtalet om upprättande av en ram för ett avtal
    om ekonomiskt partnerskap mellan stater i östra och södra Afrika, å ena sidan,
    och Europeiska gemenskapen och dess medlemsstater, å andra sidan, vad gäller
    ändring av vissa bestämmelser i protokoll 1 om definition av begreppet ”ursprungsprodukter”
    och om metoder för administrativt samarbete
