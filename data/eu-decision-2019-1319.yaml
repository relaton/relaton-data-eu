title:
- language: en
  script: Latn
  content: Council Decision (EU) 2019/1319 of 25 June 2019 on the position to be taken
    on behalf of the European Union within the EPA Committee established under the
    Interim Agreement establishing a framework for an Economic Partnership Agreement
    between the Eastern and Southern Africa States, on the one part, and the European
    Community and its Member States, on the other part, as regards the amendment of
    certain provisions of Protocol 1 concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2019/1319 du Conseil du 25 juin 2019 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité APE institué
    par l’accord intérimaire établissant le cadre d’un accord de partenariat
    économique entre les États d’Afrique orientale et australe, d’une part,
    et la Communauté européenne et ses États membres, d’autre part, pour ce qui
    est de la modification de certaines dispositions du protocole no 1 concernant
    la définition de la notion de «produits originaires» et les méthodes de coopération
    administrative
  type: main
- language: de
  script: Latn
