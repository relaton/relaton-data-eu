title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 747/76 of 31 March 1976 amending the Annex
    to Regulation (EEC) No 532/75 concerning the recovery on exportation of aids granted
    in respect of skimmed-milk powder for use as feed and in respect of skimmed milk
    processed into compound feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 747/76 de la Commission, du 31 mars 1976, modifiant
    l' annexe du règlement (CEE) n° 532/75 relatif à la récupération des aides
    pour le lait écrémé en poudre destiné à l' alimentation des animaux et le
    lait écrémé transformé en aliments composés lors de l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 747/76 der Kommission vom 31. März 1976 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 532/75 über die Wiedereinziehung der Beihilfen
    für Magermilchpulver für Futterzwecke und zu Mischfutter verarbeitete Magermilch
    bei der Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 747/76 af 31. marts 1976 om ændring
    af bilaget til forordning (EØF) nr. 532/75 om tilbagebetaling ved udførsel,
    af støtte til skummetmælkspulver til foderbrug og skummetmælk, der forarbejdes
    til foderblandinger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 747/76 della Commissione, del 31 marzo 1976, che modifica
    l' allegato del regolamento (CEE) n. 532/75 relativo al recupero, all' atto dell'
    esportazione, degli aiuti per il latte scremato in polvere destinato all' alimentazione
    degli animali e per il latte scremato trasformato in alimenti composti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 747/76 van de Commissie van 31 maart 1976 houdende
    wijziging van de bijlage van Verordening (EEG) nr. 532/75 betreffende de terugvordering
    bij uitvoer van de steun voor magere-melkpoeder bestemd voor voederdoeleinden
    en in mengvoeder verwerkte ondermelk
  type: main
