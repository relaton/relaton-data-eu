title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 527/2014 of 12 March 2014 supplementing
    Directive (EU) No 2013/36/EU of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the classes of instruments
    that adequately reflect the credit quality of an institution as a going concern
    and are appropriate to be used for the purposes of variable remuneration
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 527/2014 de la Commission du 12 mars 2014
    complétant la directive (UE) n ° 2013/36/UE du Parlement européen et du Conseil
    en ce qui concerne les normes techniques de réglementation relatives à la détermination
    des catégories d'instruments qui reflètent de manière appropriée la qualité
    de crédit de l'établissement en continuité d'exploitation et qui sont destinés
    à être utilisés aux fins de la rémunération variable
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 527/2014 der Kommission vom 12. März 2014
    zur Ergänzung der Richtlinie 2013/36/EU des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Bezeichnung der Klassen von Instrumenten,
    die die Bonität eines Instituts unter der Annahme der Unternehmensfortführung
    angemessen widerspiegeln und die für eine Verwendung zu Zwecken der variablen
    Vergütung geeignet sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 527/2014 на Комисията
    от 12 март 2014 година за допълнение на Директива
    2013/36/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на класовете инструменти, които
    правилно отразяват кредитното качество на
    институцията като действащо предприятие и
    са подходящи за използване за целите на променливите
    възнаграждения
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 527/2014 ze dne 12.
    března 2014 , kterým se doplňuje směrnice Evropského parlamentu a Rady (EU)
    č. 2013/36/EU, pokud jde o regulační technické normy, jimiž se stanoví kategorie
    nástrojů, které odpovídajícím způsobem odrážejí dlouhodobou úvěrovou
    kvalitu instituce a jsou vhodné k použití pro účely pohyblivé složky odměny
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 527/2014 af 12. marts 2014
    om supplerende regler til Europa-Parlamentets og Rådets direktiv 2013/36/EU for
    så vidt angår reguleringsmæssige tekniske standarder til præcisering af de
    kategorier af instrumenter, der i tilstrækkelig grad afspejler et instituts kreditkvalitet
    som en going concern, og som egner sig til at blive anvendt for så vidt angår
    variabel løn
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) αριθ.
