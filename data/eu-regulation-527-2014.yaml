    kannalta ja jotka soveltuvat muuttuviin palkkioihin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) br. 527/2014 оd 12. ožujka 2014. o dopuni
    Direktive 2013/36/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se pobliže određuju kategorije instrumenata koji adekvatno
    odražavaju kreditnu kvalitetu institucije kao društva koje trajno posluje i
    primjereni su za primjenu za potrebe varijabilnih primitaka
  type: main
- language: hu
  script: Latn
  content: A Bizottság 527/2014/EU felhatalmazáson alapuló rendelete ( 2014. március
    12. ) a 2013/36/EU európai parlamenti és tanácsi irányelvnek az intézmény
    folyamatos működés melletti hitelminősítési besorolását megfelelően tükröző,
    a javadalmazás változó összetevőjébe beszámítható eszközosztályokat
    meghatározó szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 527/2014 della Commissione, del 12 marzo 2014
    , che integra la direttiva 2013/36/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione relative alla specificazione
    delle categorie di strumenti che riflettono in modo adeguato la qualità del credito
    dell'ente in modo continuativo e sono adeguati per essere utilizzati ai fini della
    remunerazione variabile
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 527/2014 ( 2014. gada 12. marts ),
    ar ko papildina Eiropas Parlamenta un Padomes Direktīvu 2013/36/ES attiecībā
    uz regulatīvajiem tehniskajiem standartiem, precizējot to instrumentu kategorijas,
    kas adekvāti atspoguļo iestādes kredītkvalitāti parastās situācijās un
    kas ir piemēroti izmantošanai mainīgā atalgojuma vajadzībām
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 12 d. Komisijos deleguotasis reglamentas (ES) Nr. 527/2014,
    kuriuo papildomos Europos Parlamento ir Tarybos direktyvos 2013/36/ES nuostatos
    dėl techninių reguliavimo standartų, kuriais apibrėžiamos priemonių, tinkamai
    atspindinčių veiklą galinčios tęsti įstaigos kredito kokybę ir tinkamų
    naudoti kintamojo atlygio tikslais, klasės
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Delega tal-Kummissjoni (UE) Nru 527/2014 tat- 12 ta' Marzu
    2014 li jissupplimenta d-Direttiva (UE) Nru 2013/36/UE tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw il-klassijiet
    ta' strumenti li jirriflettu b'mod adegwat il-kwalità kredizja ta' istituzzjoni
    bħala negozju avvjat u li huma xierqa sabiex jintużaw għall-finijiet ta' remunerazzjoni
    varjabbli
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 527/2014 van de Commissie van 12 maart
    2014 tot aanvulling van Richtlijn 2013/36/EU van het Europees Parlement en de
    Raad met technische reguleringsnormen wat de specificatie betreft van de instrumenten
    die een goede weerspiegeling zijn van de kredietkwaliteit van de instelling in
    het kader van de lopende bedrijfsuitoefening en die mogen worden gebruikt voor
    de uitkering van een variabele beloning
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 527/2014 z dnia 12 marca 2014
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2013/36/UE w odniesieniu
    do regulacyjnych standardów technicznych określających klasy instrumentów,
    które odpowiednio odzwierciedlają jakość kredytową instytucji kontynuującej
    działalność i są przeznaczone do wykorzystania do celów wynagrodzenia zmiennego
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 527/2014 da Comissão, de 12 de março
    de 2014 , que completa a Diretiva 2013/36/UE do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam as
    classes de instrumentos que refletem adequadamente a qualidade do crédito de
    uma instituição numa perspetiva de continuidade das operações e são apropriados
    para utilização para efeitos de remuneração variável
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 527/2014 al Comisiei din 12 martie 2014 de
    completare a Directivei 2013/36/UE a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare referitoare la specificarea
    claselor de instrumente care reflectă în mod corespunzător calitatea creditului
    instituției în condiții de asigurare a continuității activității și care
    sunt adecvate pentru a fi utilizate în scopul remunerației variabile
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 527/2014 z 12. marca 2014 , ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady (EÚ) 2013/36/EÚ, pokiaľ
    ide o regulačné technické predpisy, ktorými sa spresňujú triedy nástrojov,
    ktoré primerane odrážajú kreditnú kvalitu inštitúcie pri pokračovaní
    činnosti a ktoré sú prispôsobené na používanie na účely pohyblivej odmeny
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 527/2014 z dne 12. marca 2014 o dopolnitvi
    Direktive (EU) št. 2013/36/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki opredeljujejo vrste instrumentov, ki ustrezno odražajo
    kreditno kvaliteto institucije v okviru rednega poslovanja in so primerni, da
    se uporabljajo za namene variabilnih prejemkov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n °527/2014 de la Comisión, de 12 de marzo de
    2014 , por el que se completa la Directiva 2013/36/UE del Parlamento Europeo y
    del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    las clases de instrumentos que reflejan de manera adecuada la calidad crediticia
    de la entidad en una perspectiva de continuidad de la explotación y resultan
    adecuados a efectos de la remuneración variable
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 527/2014 av den 12 mars 2014
    om komplettering av Europaparlamentets och rådets direktiv 2013/36/EU med avseende
    på tekniska tillsynsstandarder som specificerar de instrumentklasser som på
    ett tillbörligt sätt återspeglar institutens kreditkvalitet på löpande basis
    och är avsedda att användas till rörliga ersättningar
