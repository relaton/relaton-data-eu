title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 avril 1969, portant prorogation de la
    décision du 29 juin 1967, autorisant la République italienne, en vertu de l'article
    115 alinéa 1 du Traité, à exclure du traitement communautaire le "bichromate
    de sodium" de la position Ex 28.47 B II du TDC originaire de certains pays de
    l'Est et mis en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '69/123/EWG: Entscheidung der Kommission vom 22. April 1969 zur Verlängerung
    der Entscheidung vom 29. Juni 1967, mit der die Italienische Republik auf Grund
    des Artikels 115 Absatz 1 des Vertrages ermächtigt wurde, Natriumbichromat der
    Tarifnummer ex 28.47 B II des Gemeinsamen Zolltarifs mit Ursprung in bestimmten
    Ostblockländern, das sich in den übrigen Mitgliedstaaten im freien Verkehr befindet,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/123/CEE: Decisione della Commissione, del 22 aprile 1969, relativa
    alla proroga della decisione del 29 giugno 1967 che autorizza la Repubblica italiana,
    ai sensi dell''articolo 115, primo comma, del trattato, ad escludere dal trattamento
    comunitario il «bicromato di sodio» della voce ex 28.47 B II della tariffa doganale
    comune, originario di taluni paesi dell''Est e messo in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/123/EEG: Beschikking van de Commissie van 22 april 1969 houdende verlenging
    van de beschikking van 29 juni 1967, waarbij aan de Italiaanse Republiek op grond
    van artikel 115, eerste alinea, van het Verdrag, machtiging is verleend om natriumdichromaat,
    van post ex 28.47 B II van het gemeenschappelijk douanetarief, van oorsprong uit
    sommige oostelijke landen en in andere Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
