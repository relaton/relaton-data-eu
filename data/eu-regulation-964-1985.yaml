title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 964/85 of 11 April 1985 re-establishing
    the levying of customs duties on certain woven fabrics of synthetic textile fibres,
    products of category 35 (code 40.0350), originating in Indonesia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3563/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 964/85 de la Commission du 11 avril 1985 portant rétablissement
    de la perception des droits de douane applicables à certains tissus de fibres
    textiles synthétiques continues, de la catégorie 35 (code 40.0350), originaires
    de l' Indonésie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 964/85 der Kommission vom 11. April 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Gewebe aus synthetischen Spinnfäden
    der Warenkategorie Nr. 35 (Kennziffer 40.0350) mit Ursprung in Indonesien, dem
    die in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 964/85 af 11. april 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte vævede stoffer af endeløse syntetiske
    fibre under varekategori nr. 35 (kode 40.0350) som har oprindelse i Indonesien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 964/85 της Επιτροπής
    της 11ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    υφάσματα από συνθετικές υφαντικές ίνες συνεχείς,
    προϊόντα της κατηγορίας 35 (κωδικός αριθμός
    40.0350), καταγωγής Ινδονησίας, δικαιούχου των
    προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ. 3563/84
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 964/85 della Commissione dell' 11 aprile 1985 che
    ripristina la riscossione dei dazi doganali applicabili a alcuni tessuti di fibre
    tessili sintetiche continue, della categoria di prodotti n. 35 (codice 40.0350),
    originari dell' Indonesia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 964/85 van de Commissie van 11 april 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    weefsels van synthetische continuvezels van de categorie van produkten nr. 35
    (codenummer 40.0350) van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
