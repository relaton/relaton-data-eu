  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 1063/2012, annettu 13 päivänä marraskuuta
    2012 , muiden kuin ihmisravinnoksi tarkoitettujen eläimistä saatavien sivutuotteiden
    ja niistä johdettujen tuotteiden terveyssäännöistä sekä asetuksen (EY) N:o
    1774/2002 kumoamisesta annetun Euroopan parlamentin ja neuvoston asetuksen (EY)
    N:o 1069/2009 täytäntöönpanosta sekä neuvoston direktiivin 97/78/EY täytäntöönpanosta
    tiettyjen näytteiden ja tuotteiden osalta, jotka vapautetaan kyseisen direktiivin
    mukaisista eläinlääkärintarkastuksista rajatarkastusasemilla, annetun asetuksen
    (EU) N:o 142/2011 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 1063/2012 od 13. studenoga 2012. o izmjeni Uredbe
    (EU) br. 142/2011 o provedbi Uredbe (EZ) br. 1069/2009 Europskog parlamenta i
    Vijeća o utvrđivanju zdravstvenih pravila za nusproizvode životinjskog podrijetla
    i od njih dobivene proizvode koji nisu namijenjeni prehrani ljudi te o provedbi
    Direktive Vijeća 97/78/EZ u pogledu određenih uzoraka i proizvoda oslobođeni
    veterinarskih pregleda na granici na temelju te Direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1063/2012/EU rendelete ( 2012. november 13. ) a nem emberi
    fogyasztásra szánt állati melléktermékekre és a belőlük származó termékekre
    vonatkozó egészségügyi szabályok megállapításáról szóló 1069/2009/EK
    európai parlamenti és tanácsi rendelet végrehajtásáról, valamint a 97/78/EK
    tanácsi irányelvnek az egyes minták és tételek határon történő állat-egészségügyi
    ellenőrzése alóli, az irányelv szerinti mentesítése tekintetében történő
    végrehajtásáról szóló 142/2011/EU rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1063/2012 della Commissione, del 13 novembre 2012 ,
    che modifica il regolamento (UE) n. 142/2011 recante disposizioni di applicazione
    del regolamento (CE) n. 1069/2009 del Parlamento europeo e del Consiglio recante
    norme sanitarie relative ai sottoprodotti di origine animale e ai prodotti derivati
    non destinati al consumo umano e della direttiva 97/78/CE del Consiglio per quanto
    riguarda taluni campioni e articoli non sottoposti a controlli veterinari alla
    frontiera
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 1063/2012 ( 2012. gada 13. novembris ), ar ko
    groza Regulu (ES) Nr. 142/2011, ar kuru īsteno Eiropas Parlamenta un Padomes
    Regulu (EK) Nr. 1069/2009, ar ko nosaka veselības aizsardzības noteikumus attiecībā
    uz dzīvnieku izcelsmes blakusproduktiem un atvasinātajiem produktiem, kuri nav
    paredzēti cilvēku patēriņam, un īsteno Padomes Direktīvu 97/78/EK attiecībā
    uz dažiem paraugiem un precēm, kam uz robežas neveic veterinārās pārbaudes
    atbilstīgi minētajai direktīvai
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 13 d. Komisijos reglamentas (ES) Nr. 1063/2012, kuriuo
    iš dalies keičiamas Reglamentas (ES) Nr. 142/2011, kuriuo įgyvendinami Europos
    Parlamento ir Tarybos reglamentas (EB) Nr. 1069/2009, kuriuo nustatomos žmonėms
    vartoti neskirtų šalutinių gyvūninių produktų ir jų gaminių sveikumo taisyklės,
    ir Tarybos direktyva 97/78/EB dėl tam tikrų mėginių ir priemonių, kuriems
    netaikomi veterinariniai tikrinimai pasienyje pagal tą direktyvą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 1063/2012 tat- 13 ta’ Novembru 2012
    li jemenda r-Regolament (UE) Nru 142/2011 li jimplimenta r-Regolament (KE) Nru
    1069/2009 tal-Parlament Ewropew u tal-Kunsill li jistabbilixxi regoli tas-saħħa
    li jirrigwardaw prodotti sekondarji tal-annimali jew derivati minnhom mhux maħsuba
    għall-konsum mill-bniedem u li jimplimenta d-Direttiva tal-Kunsill 97/78/KE fir-rigward
    ta’ ċerti kampjuni u oġġetti li huma eżentati mill-verifiki veterinarji
    fil-fruntiera skont dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 1063/2012 van de Commissie van 13 november 2012 tot
    wijziging van Verordening (EU) nr. 142/2011 tot uitvoering van Verordening (EG)
    nr. 1069/2009 van het Europees Parlement en de Raad tot vaststelling van gezondheidsvoorschriften
    inzake niet voor menselijke consumptie bestemde dierlijke bijproducten en afgeleide
    producten en tot uitvoering van Richtlijn 97/78/EG van de Raad wat betreft bepaalde
    monsters en producten die vrijgesteld zijn van veterinaire controles aan de grens
    krachtens die richtlijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 1063/2012 z dnia 13 listopada 2012 r. zmieniające
    rozporządzenie (UE) nr 142/2011 w sprawie wykonania rozporządzenia Parlamentu
    Europejskiego i Rady (WE) nr 1069/2009 określającego przepisy sanitarne dotyczące
    produktów ubocznych pochodzenia zwierzęcego, nieprzeznaczonych do spożycia
    przez ludzi, oraz w sprawie wykonania dyrektywy Rady 97/78/WE w odniesieniu do
    niektórych próbek i przedmiotów zwolnionych z kontroli weterynaryjnych na granicach
    w myśl tej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1063/2012 da Comissão, de 13 de novembro de 2012
    , que altera o Regulamento (UE) n. ° 142/2011 que aplica o Regulamento (CE) n.
    ° 1069/2009 do Parlamento Europeu e do Conselho que define regras sanitárias
    relativas a subprodutos animais e produtos derivados não destinados ao consumo
    humano e que aplica a Diretiva 97/78/CE do Conselho no que se refere a certas
    amostras e certos artigos isentos de controlos veterinários nas fronteiras ao
    abrigo da referida diretiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1063/2012 al Comisiei din 13 noiembrie 2012 de modificare
    a Regulamentului (UE) nr. 142/2011 de punere în aplicare a Regulamentului (CE)
    nr. 1069/2009 al Parlamentului European și al Consiliului de stabilire a unor
    norme sanitare privind subprodusele de origine animală și produsele derivate
    care nu sunt destinate consumului uman și de punere în aplicare a Directivei
    97/78/CE a Consiliului în ceea ce privește anumite probe și produse care sunt
    scutite de la controalele sanitar-veterinare la frontieră în conformitate cu
    directiva menționată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 1063/2012 z 13. novembra 2012 , ktorým sa
    mení a dopĺňa nariadenie (EÚ) č. 142/2011, ktorým sa vykonáva nariadenie
    Európskeho parlamentu a Rady (ES) č. 1069/2009, ktorým sa ustanovujú zdravotné
    predpisy týkajúce sa vedľajších živočíšnych produktov a odvodených produktov
    neurčených na ľudskú spotrebu a ktorým sa vykonáva smernica Rady 97/78/ES,
    pokiaľ ide o určité vzorky a predmety vyňaté z povinnosti veterinárnych
    kontrol na hraniciach podľa danej smernice
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 1063/2012 z dne 13. novembra 2012 o spremembi
    Uredbe (EU) št. 142/2011 o izvajanju Uredbe (ES) št. 1069/2009 Evropskega parlamenta
    in Sveta o določitvi zdravstvenih pravil za živalske stranske proizvode in pridobljene
    proizvode, ki niso namenjeni prehrani ljudi, ter o izvajanju Direktive Sveta 97/78/ES
    glede nekaterih vzorcev in predmetov, ki so izvzeti iz veterinarskih pregledov
    na meji v skladu z navedeno direktivo
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1063/2012 de la Comisión, de 13 de noviembre de 2012
    , que modifica el Reglamento (UE) n ° 142/2011, por el que se establecen las
    disposiciones de aplicación del Reglamento (CE) n ° 1069/2009 del Parlamento
    Europeo y del Consejo por el que se establecen las normas sanitarias aplicables
    a los subproductos animales y los productos derivados no destinados al consumo
    humano, y la Directiva 97/78/CE del Consejo en cuanto a determinadas muestras
    y unidades exentas de los controles veterinarios en la frontera en virtud de la
    misma
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 1063/2012 av den 13 november 2012 om
    ändring av förordning (EU) nr 142/2011 om genomförande av Europaparlamentets
    och rådet förordning (EG) nr 1069/2009 om hälsobestämmelser för animaliska
    biprodukter och därav framställda produkter som inte är avsedda att användas
    som livsmedel och om genomförande av rådets direktiv 97/78/EG vad gäller vissa
    prover och produkter som enligt det direktivet är undantagna från veterinärkontroller
    vid gränsen
