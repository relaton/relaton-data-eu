  content: Règlement (CEE) n° 1203/69 du Conseil, du 26 juin 1969, fixant, pour
    la campagne 1969/1970, les prix d'intervention du riz paddy, les prix de seuil
    du riz décortiqué et des brisures, et le montant de protection à inclure dans
    le prix de seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1203/69 des Rates vom 26. Juni 1969 zur Festsetzung
    des Interventionspreises für Rohreis, der Schwellenpreise für geschälten Reis
    und Bruchreis und des in den Schwellenpreis für vollständig geschliffenen Reis
    einzubeziehenden Schutzbetrags für das Wirtschaftsjahr 1969/1970
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1203/69 del Consiglio, del 26 giugno 1969, che fissa
    i prezzi d'intervento del risone, i prezzi d'entrata del riso semigreggio e delle
    rotture di riso e l'importo di protezione da includere nel prezzo d'entrata del
    riso lavorato, per la campagna 1969/1970
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1203/69 van de Raad van 26 juni 1969 houdende vaststelling
    voor het verkoopseizoen 1969/1970 van de interventieprijzen voor padie, de drempelprijzen
    voor gedopte rijst en breukrijst en het in de drempelprijs voor volwitte rijst
    op te nemen bedrag voor industriële bescherming
  type: main
