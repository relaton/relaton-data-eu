title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 871/2001 of 3 May 2001 determining the extent
    to which applications lodged in April 2001 for import licences for certain egg
    sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and (EC)
    No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 871/2001 de la Commission du 3 mai 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 2001 pour certains produits du secteur des œufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 871/2001 der Kommission vom 3. Mai 2001 über die Festsetzung
    des Umfangs, in dem die im April 2001 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 871/2001 af 3. maj 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    2001 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 871/2001 της Επιτροπής,
    της 3ης Μαΐου 2001, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Απρίλιο του 2001 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 871/2001, annettu 3 päivänä toukokuuta 2001,
    määrättyyn järjestelmään liittyvien huhtikuussa 2001 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 871/2001 della Commissione, del 3 maggio 2001, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 2001 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 871/2001 van de Commissie van 3 mei 2001 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren eieren en slachtpluimvee, die in april
    2001 worden ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr.
    1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 871/2001 da Comissão, de 3 de Maio de 2001, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Abril de 2001 ao abrigo dos Regulamentos (CE) n.° 1474/95 e (CE) n.° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 871/2001 de la Comisión, de 3 de mayo de 2001, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de los huevos y de la carne de
    aves de corral presentadas en el mes de abril de 2001 al amparo de los Reglamentos
    (CE) n° 1474/95 y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 871/2001 av den 3 maj 2001 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa äggprodukter
    samt fjäderfäkött som ges in under april 2001 inom ramen för förordningarna
    (EG) nr 1474/95 och (EG) nr 1251/96 kan godtas
  type: main
