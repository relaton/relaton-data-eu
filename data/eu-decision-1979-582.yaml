type: standard
title:
- language: en
  script: Latn
  content: '79/582/EEC: Commission Decision of 23 May 1979 authorizing the French
    Republic not to apply Community treatment to certain setts, flags and paving,
    hearth and wall tiles, falling within subheadings 69.07 ex A or B ex II and 69.08
    ex A or B ex II of the Common Customs Tariff, originating in Thailand and in free
    circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/582/CEE: Décision de la Commission, du 23 mai 1979, autorisant la
    République française à exclure du traitement communautaire certains carreaux,
    pavés, dalles de pavement ou de revêtement, des sous-positions 69.07 ex A et
    B ex II et 69.08 ex A et B ex II du tarif douanier commun, originaires de Thaïlande
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/582/EWG: Entscheidung der Kommission vom 23. Mai 1979, mit der die
    Französische Republik ermächtigt wird, aus Thailand stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Fliesen, gebrannte Pflastersteine,
    Boden- und Wandplatten der Tarifstellen 69.07 ex A und B ex II und 69.08 ex A
    und B ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/582/EØF: Kommissionens beslutning af 23. maj 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage visse sten og
    fliser til brolægning, gulvbelægning eller beklædning af vægge og kaminer,
    som henhører under pos. 69.07 ex A og B ex II og 69.08 ex A og B ex II i den
    fælles toldtarif, har oprindelse i Thailand og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/582/CEE: Decisione della Commissione, del 23 maggio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario alcuni tipi di
    piastrelle, blocchetti e lastre da pavimentazione, delle sottovoci 69.07 ex A
    e B ex II e 69.08 ex A e B ex II della tariffa doganale comune, originari della
    Tailandia e messi in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/582/EEG: Beschikking van de Commissie van 23 mei 1979 waarbij de Franse
    Republiek wordt gemachtigd sommige plavuizen, vloer- en wandtegels van de posten
    69.07 ex A en B ex II en 69.08 ex A en B II van het gemeenschappelijk douanetarief,
    van oorsprong uit Thailand en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
