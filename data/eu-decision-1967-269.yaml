  content: Décision de la Commission, du 23 mars 1967, portant octroi du concours
    du Fonds social européen au bénéfice de la République italienne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    l'"Istituto nazionale per l'addestramento ed il perfezionamento dei lavoratori
    dell'industria (I.N.A.P.L.I.)"
  type: main
- language: de
  script: Latn
  content: '67/269/EWG: Entscheidung der Kommission vom 23. März 1967 über die Gewährung
    eines Zuschusses aus dem Europäischen Sozialfonds an die Republik Italien zu
    Aufwendungen für vom "Istituto nazionale per l''addestramento ed il perfezionamento
    dei lavoratori dell''industria (INAPLI)" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '67/269/CEE: Decisione della Commissione, del 23 marzo 1967, relativa alla
    concessione di un contributo del Fondo sociale europeo a favore della Repubblica
    italiana per spese concernenti operazioni di riqualificazione professionale effettuate
    dall''«Istituto nazionale per l''addestramento ed il perfezionamento dei lavoratori
    dell''industria (INAPLI)»'
  type: main
- language: nl
  script: Latn
  content: '67/269/EEG: Beschikking van de Commissie van 23 maart 1967 houdende verlening
    van bijstand door het Europees Sociaal Fonds aan de Italiaanse Republiek voor
    de uitgaven met betrekking tot de door het "Istituto nazionale per l''addestramento
    ed il perfezionamento dei lavoratori dell''industria (I.N.A.P. L.I.)" verrichte
    activiteiten op het gebied van de herscholing'
