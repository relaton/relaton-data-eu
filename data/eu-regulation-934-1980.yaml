id: EURegulation9341980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 934/80 of 14 April 1980 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres (discontinuous
    or waste), put up for retail sale, products of category 56 (code 0560), originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 934/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues (y compris les déchets), conditionnés
    pour la vente au détail, de la catégorie 56 (code 0560), originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 934/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern (oder
    aus Abfällen von synthetischen Spinnstoffen), in Aufmachungen für den Einzelverkauf,
    der Warenkategorie Nr. 56 (Kennziffer 0560), mit Ursprung in Brasilien, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 934/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre (herunder affald),
    i detailsalgsoplægninger under varekategori nr. 56 (kode 0560), som har oprindelse
    i Brasilien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 934/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche in fiocco (compresi i cascami) preparati per la vendita al minuto,
    della categoria di prodotti n. 56 (codice 0560), originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 934/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels (afval hieronder begrepen), gereed voor de verkoop in
    het klein, van de categorie van produkten nr. 56 (codenummer 0560), van oorsprong
    uit Brazilië waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2894/79 van de Raad
  type: main
