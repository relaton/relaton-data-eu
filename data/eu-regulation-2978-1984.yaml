title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2978/84 of 19 October 1984 determining the
    amounts of the variable components and additional duties applicable from 1 November
    1984 to 31 January 1985 on the importation into the Community of goods covered
    by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2978/84 de la Commission, du 19 octobre 1984, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er novembre 1984 au 31 janvier 1985 inclus à l'importation
    dans la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2978/84 der Kommission vom 19. Oktober 1984 zur Festsetzung
    der Höhe der vom 1. November 1984 bis einschließlich 31. Januar 1985 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2978/84 af 19. oktober 1984 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. november 1984 til den 31. januar 1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2978/84 της Επιτροπής
    της 19ης Οκτωβρίου 1984 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά την περίοδο από
    1ης Νοεμβρίου 1984 μέχρι και 31ης Ιανουαρίου 1985
    κατά την εισαγωγή στην Κοινότητα εμπορευμάτων
    που υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
