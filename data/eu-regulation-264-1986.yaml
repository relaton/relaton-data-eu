title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 264/86 of 4 February 1986 imposing a definitive
    anti-dumping duty on imports of certain clogs originating in Sweden and definitively
    collecting the provisional anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 264/86 du Conseil du 4 février 1986 instituant un
    droit antidumping définitif sur les importations de certains sabots originaires
    de Suède et portant perception définitive du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 264/86 des Rates vom 4. Februar 1986 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Holzschuhe mit
    Ursprung in Schweden und zur Vereinnahmung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 264/86 af 4. februar 1986 om indførelse
    af en endelig antidumpingtold på importen af visse træsko med oprindelse i Sverige
    og om endelig opkrævning af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 264/86 του Συμβουλίου
    της 4ης Φεβρουαρίου 1986 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    ξύλινων υποδημάτων (sabots) καταγωγής Σουηδίας
    και την οριστική είσπραξη του προσωρινού δασμού
    αντιντάμπινγκ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 264/86 del Consiglio del 4 febbraio 1986 che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di zoccoli originari
    della Svezia e stabilisce la riscossione definitiva del dazio antidumping provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 264/86 van de Raad van 4 februari 1986 houdende instelling
    van een definitief anti-dumpingrecht op de invoer van klompschoenen van oorsprong
    uit Zweden en definitieve inning van het voorlopig anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 264/86 do Conselho de 4 de Fevereiro de 1986 que
    institui um direito "anti-dumping" sobre as importações de alguns tipos de socos
    originários da Suécia e que determina a cobrança definitiva do direito "anti-dumping"
    provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 264/86 del Consejo de 4 de febrero de 1986 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    determinados zuecos originarios de Suecia y por el que se percibe definitivamente
    el derecho antidumping provisional
  type: main
