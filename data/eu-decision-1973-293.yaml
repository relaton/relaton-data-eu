    in Kallo (Provinz Ostflandern) (Nur der französische und niederländische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '73/293/EØF: Kommissionens Beslutning af 11. september 1973 om den støtte,
