  script: Latn
  content: '73/293/EEC: Commission Decision of 11 September 1973 on aid which the
    Belgian Government intends to grant for extending an oil refinery at Antwerp (province
    of Antwerp) and for setting up a new refinery at Kallo (province of East Flanders)
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '73/293/CEE: Décision de la Commission, du 11 septembre 1973, concernant
    les aides que le gouvernement belge projette d''accorder en faveur de l''extension
    d''une raffinerie de pétrole à Anvers (province d''Anvers) et de l''implantation
    d''une nouvelle raffinerie à Kallo (province de Flandre orientale) (Les textes
    en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
