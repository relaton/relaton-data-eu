    857/84 om almindelige regler for anvendelsen af den i artikel 5c i forordning
    (EØF) nr. 804/68 omhandlede afgift paa maelk og mejeriprodukter (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
