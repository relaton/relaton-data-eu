title:
- language: en
  script: Latn
  content: '90/66/EEC: Commission Decision of 7 February 1990 approving the draft
    measures presented by Ireland for implementation of Article 3b of Regulation (EEC)
    No 857/84 adopting general rules for the application of the levy referred to in
    Article 5c of Regulation (EEC) No 804/68 in the milk and milk products sector
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/66/CEE: Décision de la Commission du 7 février 1990 portant approbation
    du projet de mise en oeuvre en Irlande de l''article 3 ter du règlement (CEE)
    n° 857/84 portant règles générales pour l''application du prélèvement visé
    à l''article 5 quater du règlement (CEE) n 804/68 dans le secteur du lait et
    des produits laitiers (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/66/EWG: Entscheidung der Kommission vom 7. Februar 1990 zur Genehmigung
    des Entwurfs für die Anwendung von Artikel 3b der Verordnung (EWG) Nr. 857/84
    ueber Grundregeln für die Anwendung der Abgabe Gemäß Artikel 5c der Verordnung
    (EWG) Nr. 804/68 im Sektor Milch und Milcherzeugnisse in Irland (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/66/EØF: Kommissionens beslutning af 7. februar 1990 om godkendelse
