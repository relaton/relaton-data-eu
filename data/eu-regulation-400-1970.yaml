  content: Règlement (CEE) n 400/70 de la Commission, du 3 mars 1970, abrogeant le
    règlement (CEE) n 337/70 portant application du droit du tarif douanier commun
    aux importations de certaines variétés d'oranges douces originaires du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 400/70 der Kommission vom 3. März 1970 zur Aufhebung
    der Verordnung (EWG) Nr. 337/70 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren bestimmter Sorten von SüDorangen mit Ursprung in Marokko
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 400/70 della Commissione, del 3 marzo 1970, che abroga
    il regolamento (CEE) n. 337/70 relativo all'applicazione del dazio della tariffa
    doganale comune alle importazioni di alcune varietà di arance dolci originarie
    del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 400/70 van de Commissie van 3 maart 1970 tot intrekking
    van Verordening (EEG) nr. 337/70 houdende toepassing van het recht van het gemeenschappelijk
    douanetarief op de invoer van bepaalde variëteiten zoete sinaasappelen van oorsprong
    uit Marokko
