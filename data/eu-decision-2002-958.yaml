  script: Latn
  content: '2002/958/EC: Council Decision of 28 November 2002 concerning the conclusion
    of an Agreement in the form of an Exchange of Letters between the European Community
    and the Kingdom of Morocco derogating temporarily, as regards the importation
    into the Community of tomatoes originating in Morocco, from Agricultural Protocol
    No 1 to the Euro-Mediterranean Agreement establishing an association between the
    European Communities and their Member States, of the one part, and the Kingdom
    of Morocco, of the other part'
  type: main
- language: fr
  script: Latn
