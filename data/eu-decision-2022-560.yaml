  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/560 ze dne 31. března 2022 o
    obnovení povolení pro uvádění produktů, které obsahují geneticky modifikovanou
    bavlnu GHB614 (BCS-GHØØ2-5), sestávají z ní nebo jsou z ní vyrobeny, na
    trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2022) 1891) (Pouze německé znění je závazné)
  type: main
