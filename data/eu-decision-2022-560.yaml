    от 31 март 2022 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифициран
    памук GHB614 (BCS-GHØØ2-5), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2022) 1891) (само текстът
    на немски език е автентичен)
  type: main
