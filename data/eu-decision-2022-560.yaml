    består af eller er fremstillet af genetisk modificeret GHB614-bomuld (BCS-GHØØ2-5),
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt
    under nummer C(2022) 1891) (Kun den tyske udgave er autentisk)
  type: main
