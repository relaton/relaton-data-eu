title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/560 of 31 March 2022 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified cotton GHB614 (BCS-GHØØ2-5) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2022) 1891) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/560 de la Commission du 31 mars 2022
    renouvelant l’autorisation de mise sur le marché de produits contenant du coton
    génétiquement modifié GHB614 (BCS-GHØØ2-5), consistant en ce coton ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2022) 1891] (Le texte en
    langue allemande est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/560 der Kommission vom 31. März 2022
    über die Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen,
    die genetisch veränderte Baumwolle der Sorte GHB614 (BCS-GHØØ2-5) enthalten,
    aus ihr bestehen oder aus ihr gewonnen werden, gemäß der Verordnung (EG) Nr.
    1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen
    C(2022)1891) (Nur der deutsche Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
