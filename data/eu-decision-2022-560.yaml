    (BCS-GHØØ2-5), so iz njega sestavljeni ali proizvedeni, v skladu z Uredbo (ES)
    št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno številko
    C(2022) 1891) (Besedilo v nemškem jeziku je edino verodostojno)
