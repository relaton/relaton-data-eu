    siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamista
    koskevan luvan uusimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti (tiedoksiannettu numerolla C(2022) 1891) (Ainoastaan saksankielinen
    teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/560 ón gCoimisiún an 31 Márta 2022
    lena n-athnuaitear an t-údarú chun táirgí a chur ar an margadh, ar táirgí
    iad ina bhfuil, atá comhdhéanta de, nó a tháirgtear as cadás géinmhodhnaithe
    GHB614 (BCS-GHØØ2-5) de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint
    na hEorpa agus ón gComhairle (a bhfuil fógra tugtha ina leith faoi dhoiciméad
    C(2022) 1891) (An téacs Gearmáinise amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/560 оd 31. ožujka 2022. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani
    pamuk GHB614 (BCS-GHØØ2-5) ili se sastoje ili su proizvedeni od njega, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2022) 1891) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/560 végrehajtási határozata (2022. március 31.)
    a géntechnológiával módosított GHB614 (BCS-GHØØ2-5) gyapotot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2022) 1891. számú dokumentummal történt) (Csak a német
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/560 della Commissione del 31 marzo 2022
    che rinnova l’autorizzazione all’immissione in commercio di prodotti contenenti,
    costituiti o derivati da cotone geneticamente modificato GHB614 (BCS-GHØØ2-5)
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2022) 1891] (Il testo in lingua tedesca è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/560 (2022. gada 31. marts), ar
    ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificēto kokvilnu GHB614
    (BCS-GHØØ2-5), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2022) 1891) (Autentisks ir tikai teksts vācu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/560 2022 m. kovo 31 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotos
    medvilnės GHB614 (BCS-GHØØ2-5), kurie iš jos sudaryti arba kurie iš jos pagaminti
    (pranešta dokumentu Nr. C(2022) 1891) (Tekstas autentiškas tik vokiečių kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/560 tal-31
    ta’ Marzu 2022 li ġġedded l-awtorizzazzjoni għall-introduzzjoni fis-suq ta’
    prodotti li jkun fihom il-qoton ġenetikament modifikat GHB614 (BCS-GHØØ2-5),
    li jkunu jikkonsistu minnu, jew li jkunu magħmulin minnu, skont ir-Regolament
    (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata bid-dokument
    C(2022) 1891) (It-test bil-Ġermaniż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/560 van de Commissie van 31 maart 2022 tot
    verlenging van de vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met het genetisch gemodificeerde
    katoen GHB614 (BCS-GHØØ2-5) overeenkomstig Verordening (EG) nr. 1829/2003 van
    het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2022)
    1891) (Slechts de tekst in de Duitse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/560 z dnia 31 marca 2022 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    bawełnę GHB614 (BCS-GHØØ2-5), składających się z niej lub z niej wyprodukowanych
    (notyfikowana jako dokument nr C(2022) 1891) (Jedynie tekst w języku niemieckim
    jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/560 da Comissão de 31 de março de 2022
    que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de algodão geneticamente
    modificado GHB614 (BCS-GHØØ2-5) nos termos do Regulamento (CE) n.o 1829/2003
    do Parlamento Europeu e do Conselho [notificada com o número C(2022)1891] (Apenas
    faz fé o texto em língua alemã)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/560 a Comisiei din 31 martie 2022
    de reînnoire a autorizației de introducere pe piață a produselor care conțin,
    constau în sau sunt fabricate din bumbac modificat genetic GHB614 (BCS-GHØØ2-5),
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2022) 1891] (Numai textul în limba germană
    este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/560 z 31. marca 2022, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    bavlnu GHB614 (BCS-GHØØ2-5), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2022) 1891] (Iba nemecké znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/560 z dne 31. marca 2022 o obnovitvi
