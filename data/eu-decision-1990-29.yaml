title:
- language: en
  script: Latn
  content: Commission Decision of 10 January 1990 amending for the second time Commission
    Decision 80/775/EEC on laying down methods of control for maintaining the officially
    brucellosis-free status of bovine herds in certain regions of the Federal Republic
    of Germany (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 10 janvier 1990 portant deuxième modification
    de la décision 80/775/CEE établissant les méthodes de contrôle visant à maintenir
    le statut de cheptels officiellement indemnes de brucellose dans certaines régions
    de la République fédérale d'Allemagne (Le texte en langue allemande est le
    seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Januar 1990 zur zweiten Änderung der
    Entscheidung 80/775/EWG zur Festlegung der Kontrollmethoden für die Beibehaltung
    des amtlich anerkannt brucellosefreien Status der Rinderbestände in bestimmten
    Gebieten der Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. januar 1990 om ændring for anden gang
    af Kommissionens beslutning 80/775/EØF om fastsættelse af kontrolbestemmelser
    med henblik på i visse regioner i Forbundsrepublikken Tyskland at bevare kvægbesætningernes
    status som værende officielt fri for brucellose (Kun den tyske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: '90/29/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Ιανουαρίου
    1990 για τη δεύτερη τροποποίηση της απόφασης
    80/775/ΕΟΚ περί θεσπίσεως μεθόδων ελέγχου για
    τη διατήρηση των επίσημα απαλλαγμένων από
    βρουκέλωση αγελών βοοειδών σε ορισμένες περιοχές
    της Ομοσπονδιακής Δημοκρατίας της Γερμανίας
    (Το κείμενο στη γερμανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 10 gennaio 1990 recante seconda modifica
    della decisione 80/775/CEE, che fissa le modalità del controllo cui è subordinata
    la qualifica "ufficialmente indenne da brucellosi" degli allevamenti bovini in
    alcune regioni della Repubblica federale di Germania (Il testo in lingua tedesca
    è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 januari 1990 tot tweede wijziging van
    Beschikking 80/775/EEG tot vaststelling van een controleregeling om in bepaalde
    delen van de Bondsrepubliek Duitsland de rundveebeslagen verder als officieel
    brucellosevrij te kunnen erkennen (Slechts de tekst in de Duitse taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 10 de Janeiro de 1990 que altera pela segunda
    vez a Decisão 80/775/CEE que estabelece os métodos de controlo destinados a
    manter o estatuto de efectivos bovinos oficialmente indemnes de brucelose em determinadas
    regiões da Republica Federal da Alemanha (Apenas faz fé o texto em língua alemã)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 10 de enero de 1990 que modifica por segunda
    vez la Decisión 80/775/CEE por la que se establecen los métodos de control necesarios
    para mantener la calificación de cabaña bovina oficialmente indemne de brucelosis
    en determinadas regiones de la República Federal de Alemania (El texto en lengua
    alemana es el único auténtico)
  type: main
