  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2012/70 der Kommission vom 7. Oktober 1970 zur Änderung
    der Verordnung (EWG) Nr. 772/70 über eine Dauerausschreibung zum Verkauf von
    Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2012/70 della Commissione, del 7 ottobre 1970, che
    modifica il regolamento (CEE) n. 772/70 relativo ad una gara permanente per la
    vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2012/70 van de Commissie van 7 oktober 1970 houdende
    wijziging van Verordening (EEG) nr. 772/70 betreffende een permanente openbare
    inschrijving voor de verkoop van witte suiker bestemd voor de uitvoer en in het
    bezit van het Franse interventiebureau
