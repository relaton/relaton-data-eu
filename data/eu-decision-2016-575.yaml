---
id: EUDecision2016575
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/575 of 29 March 2016 extending
    the validity of Decision 2006/502/EC requiring Member States to take measures
    to ensure that only lighters which are child-resistant are placed on the market
    and to prohibit the placing on the market of novelty lighters (notified under
    document C(2016) 1702)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/575 de la Commission du 29 mars 2016 prorogeant
    la validité de la décision 2006/502/CE exigeant des États membres qu'ils prennent
    des mesures destinées à faire en sorte que seuls les briquets présentant des
    caractéristiques de sécurité enfants soient mis sur le marché et à interdire
    la mise sur le marché de briquets fantaisie [notifiée sous le numéro C(2016)
    1702]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/575 der Kommission vom 29. März 2016
    zur Verlängerung der Geltungsdauer der Entscheidung 2006/502/EG zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekanntgegeben unter Aktenzeichen C(2016) 1702)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/575 на Комисията
    от 29 март 2016 година за удължаване на валидността
    на Решение 2006/502/ЕО относно изискването към
    държавите членки да приемат мерки, за да гарантират,
    че на пазара се пускат единствено запалки,
    които са обезопасени спрямо деца, и да забранят
    пускането на пазара на запалки с нестандартен
    дизайн (нотифицирано под номер C(2016) 1702)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/575 ze dne 29. března 2016 kterým
    se prodlužuje platnost rozhodnutí Komise 2006/502/ES, kterým se po členských
    státech žádá, aby přijaly opatření zajišťující, aby se na trh uváděly
    pouze zapalovače, které jsou odolné dětem a zakázaly uvádět na trh zapalovače
    neobvyklého typu (novelty) (oznámeno pod číslem C(2016) 1702)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/575 af 29. marts 2016
    om forlængelse af gyldigheden af beslutning 2006/502/EF om et krav til medlemsstaterne
    om at træffe foranstaltninger til at sikre, at der kun markedsføres børnesikrede
    lightere, og forbyde markedsføringen af lightere, der kan henføres under kategorien
    gadgets (meddelt under nummer C(2016) 1702)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/575 της Επιτροπής,
    της 29ης Μαρτίου 2016, για παράταση της ισχύος
    της απόφασης 2006/502/ΕΚ, που απαιτεί από τα κράτη
    μέλη, αφενός, να λάβουν μέτρα ώστε να εξασφαλίσουν
    ότι θα διατίθενται στην αγορά μόνο αναπτήρες
    ασφαλείς για τα παιδιά και, αφετέρου, να απαγορεύσουν
    τη διάθεση φαντεζί αναπτήρων στην αγορά [κοινοποίηση
    υπό τον αριθμό C(2016) 1702]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/575, 29. märts 2016, otsuse 2006/502/EÜ
    (millega nõutakse liikmesriikidelt meetmete võtmist, et tagada üksnes lastekindlate
    tulemasinate turuleviimine ning keelustada uudsete tulemasinate turuleviimine)
    kehtivuse pikendamise kohta (teatavaks tehtud numbri C(2016) 1702 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/575, annettu 29 päivänä
    maaliskuuta 2016, jäsenvaltioiden velvoittamisesta toteuttamaan toimia markkinoille
    saatettavien savukkeensytyttimien lapsiturvallisuuden varmistamiseksi ja muiden
    kuin savukkeensytytintä muistuttavien savukkeensytyttimien markkinoille saattamisen
    kieltämiseksi tehdyn päätöksen 2006/502/EY voimassaoloajan pidentämisestä
    (tiedoksiannettu numerolla C(2016) 1702)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/575 оd 29. ožujka 2016. o produženju
    valjanosti Odluke 2006/502/EZ kojom se od država članica zahtijeva poduzimanje
    mjera kojima se osigurava stavljanje na tržište isključivo upaljača koji su
    sigurni za djecu i zabranjuje stavljanje na tržište upaljača-noviteta (priopćeno
    pod brojem dokumenta C(2016) 1702)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/575 végrehajtási határozata (2016. március 29.)
    a kizárólag gyermekbiztos öngyújtók forgalomba hozatalát biztosító és
    az újszerű öngyújtók forgalomba hozatalát tiltó, tagállamok által meghozandó
    intézkedések előírásáról szóló 2006/502/EK határozat érvényességének
    meghosszabbításáról (az értesítés a C(2016) 1702. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/575 della Commissione, del 29 marzo 2016,
    che proroga la validità della decisione 2006/502/CE che prescrive agli Stati
    membri di adottare provvedimenti per assicurare che siano immessi sul mercato
    esclusivamente accendini a prova di bambino e di proibire la commercializzazione
    di accendini fantasia [notificata con il numero C(2016) 1702]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/575 (2016. gada 29. marts), ar
    kuru pagarina spēkā esības termiņu Lēmumam 2006/502/EK, ar ko dalībvalstīm
    pieprasa veikt pasākumus, kas atļautu tirgot tikai bērniem drošas šķiltavas
    un aizliegtu tirgot jaunrades šķiltavas (izziņots ar dokumenta numuru C(2016)
    1702)
  type: main
- language: lt
  script: Latn
  content: 2016 m. kovo 29 d. Komisijos įgyvendinimo sprendimas (ES) 2016/575, kuriuo
    pratęsiamas Sprendimo 2006/502/EB, reikalaujančio, kad valstybės narės imtųsi
    priemonių, siekdamos užtikrinti, jog rinkoje būtų platinami tik apsaugą nuo
    vaikų turintys žiebtuvėliai, ir uždrausti pateikti į rinką suvenyrinius
    žiebtuvėlius, galiojimas (pranešta dokumentu Nr. C(2016) 1702)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/575 tad-29 ta'
    Marzu 2016 li testendi l-validità tad-Deċiżjoni 2006/502/KE li tirrikjedi li
    l-Istati Membri jieħdu miżuri biex jiżguraw li l-lajters li jitqiegħdu fis-suq
    ikunu dawk biss reżistenti għat-tfal u li jipprojbixxu t-tqegħid fis-suq tal-lajters
    magħrufa bħala novelty lighters (notifikata bid-dokument C(2016) 1702)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/575 van de Commissie van 29 maart 2016 tot
    verlenging van de geldigheidsduur van Beschikking 2006/502/EG waarbij de lidstaten
    worden verplicht maatregelen te treffen om ervoor te zorgen dat uitsluitend kinderveilige
    aanstekers op de markt worden gebracht en dat het op de markt brengen van „novelty
    lighters” wordt verboden (Kennisgeving geschied onder nummer C(2016) 1702)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/575 z dnia 29 marca 2016 r. przedłużająca
    obowiązywanie decyzji 2006/502/WE zobowiązującej państwa członkowskie do
    podjęcia środków w celu zapewnienia, by na rynek wprowadzane były wyłącznie
    zapalniczki zabezpieczone przed uruchomieniem przez dzieci, oraz w celu zakazania
    wprowadzania na rynek zapalniczek-gadżetów (notyfikowana jako dokument nr C(2016)
    1702)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/575 da Comissão, de 29 de março de 2016,
    que prorroga a validade da Decisão 2006/502/CE que obriga os Estados-Membros
    a tomarem as medidas necessárias para garantir que no mercado apenas se coloquem
    isqueiros seguros para as crianças e proibir a colocação no mercado de isqueiros
    novidade (novelty lighters) [notificada com o número C(2016) 1702]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/575 a Comisiei din 29 martie 2016
    de prelungire a valabilității Deciziei 2006/502/CE de obligare a statelor membre
    să adopte măsuri prin care să se asigure că nu se pot introduce pe piață
    decât brichete cu caracteristici de siguranță pentru copii și să interzică
    introducerea pe piață a brichetelor fantezie [notificată cu numărul C(2016)
    1702]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/575 z 29. marca 2016 o predĺžení
    platnosti rozhodnutia 2006/502/ES, ktorým sa členské štáty vyzývajú prijať
    opatrenia s cieľom zabezpečiť, aby sa na trh uvádzali iba zapaľovače, ktoré
    sú zabezpečené proti použitiu deťmi, a zakázať uvádzanie zábavných zapaľovačov
    na trh [oznámené pod číslom C(2016) 1702]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/575 z dne 29. marca 2016 o podaljšanju
    veljavnosti Odločbe 2006/502/ES o zahtevi, da države članice sprejmejo ukrepe
    za zagotovitev, da se dajo na trg samo vžigalniki, ki so varni za otroke, in
    za prepoved dajanja neobičajnih vžigalnikov na trg (notificirano pod dokumentarno
    številko C(2016) 1702)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/575 de la Comisión, de 29 de marzo de
    2016, que prolonga la validez de la Decisión 2006/502/CE, por la que se requiere
    a los Estados miembros que adopten medidas para garantizar que solo se comercialicen
    encendedores con seguridad para niños y que prohíban la comercialización de
    encendedores de fantasía [notificada con el número C(2016) 1702]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/575 av den 29 mars 2016 om
    förlängning av giltighetstiden för beslut 2006/502/EG om en förpliktelse för
    medlemsstaterna att förbjuda att icke barnsäkra eller leksaksliknande tändare
    släpps ut på marknaden [delgivet med nr C(2016) 1702]
