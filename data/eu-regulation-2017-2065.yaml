  script: Latn
  content: Commission Implementing Regulation (EU) 2017/2065 of 13 November 2017 confirming
    the conditions of approval of the active substance 8-hydroxyquinoline, as set
    out in Implementing Regulation (EU) No 540/2011 and modifying Implementing Regulation
    (EU) 2015/408 as regards the inclusion of the active substance 8-hydroxyquinoline
    in the list of candidates for substitution
  type: main
- language: fr
  script: Latn
