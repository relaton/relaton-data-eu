  script: Latn
  content: '84/373/EEC: Commission Decision of 3 July 1984 establishing that the apparatus
    described as ''Leeds & Northrup - Fixed Temperature Standard, model 8411'' may
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/373/CEE: Décision de la Commission du 3 juillet 1984 constatant que
    l''importation de l''appareil dénommé "Leeds & Northrup - Fixed Temperature
    Standard, model 8411" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '84/373/EWG: Entscheidung der Kommission vom 3. Juli 1984, mit der festgestellt
    wird, daß das Gerät ,,Leeds & Northrup - Fixed Temperature Standard, model 8411"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '84/373/EØF: Kommissionens beslutning af 3. juli 1984 om fastslåelse
