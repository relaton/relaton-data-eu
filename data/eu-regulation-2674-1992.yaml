title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2674/92 of 15 September 1992 supplementing
    the provisions for the implementation of Council Regulation (EEC) No 1715/90 on
    the information provided by the customs authorities of the member States concerning
    the classification of goods in the customs nomenclature and amending Regulation
    (EEC) No 3796/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2674/92 de la Commission, du 15 septembre 1992, qui
