    της Ισπανίας (Βαλεαρίδες Νήσοι)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/1243, 1. september 2020, millega pikendatakse
    erandit, mis tehti nõukogu määrusest (EÜ) nr 1967/2006 seoses teatavates Hispaania
    (Baleaari saared) territoriaalvetes väikese plankmudila (Aphia minuta), ferreri
    mudila (Pseudaphia ferreri) ja smariidi (Spicara smaris) püüdmiseks kasutatavate
    paadinootade miinimumkaugusega rannikust ja vee miinimumsügavusega nende kasutamisel
  type: main
- language: fi
  script: Latn
