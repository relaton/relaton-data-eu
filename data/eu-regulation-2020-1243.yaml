title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1243 of 1 September 2020 on
    extending the derogation from Council Regulation (EC) No 1967/2006 as regards
    the minimum distance from the coast and the minimum sea depth for boat seines
    fishing for transparent and Ferrer’s gobies (Aphia minuta and Pseudaphia ferreri)
    and Lowbody picarel (Spicara smaris) in certain territorial waters of Spain (Balearic
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1243 de la Commission du 1er septembre
    2020 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne la distance minimale de la côte et la profondeur minimale
    pour les sennes de bateau pêchant le gobie transparent et le gobie de Ferrer
    (Aphia minuta et Pseudaphia ferreri) et le picarel commun (Spicara smaris) dans
    certaines eaux territoriales de l’Espagne (îles Baléares)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1243 der Kommission vom 1. September
    2020 zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des
    Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Bootswaden für den Fang von Glas- und Ferrer-Grundeln (Aphia minuta und
    Pseudaphia ferreri) sowie Pikarels (Spicara smaris) in bestimmten Hoheitsgewässern
    Spaniens (Balearen)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/1243 на Комисията
    от 1 септември 2020 година за удължаване на срока
    на дерогацията от Регламент (ЕО) № 1967/2006 на
    Съвета по отношение на минималното разстояние
    от брега и минималната дълбочина за улов на
    стъкленка (Аphia minuta), на Ферерово попче (Pseudaphia
    ferreri) и на смарид (Spicara smaris) с корабни грибове
    в част от териториалните води на Испания (Балеарски
    острови)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/1243 ze dne 1. září 2020,
    kterým se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud
    jde o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu hlaváče průsvitného (Aphia minuta), hlaváče Ferrerova (Pseudaphia
    ferreri) a modráka ostronosého (Spicara smaris) v některých teritoriálních
    vodách Španělska (Baleárské ostrovy)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/1243 af 1. september
    2020 om forlængelse af dispensationen fra Rådets forordning (EF) nr. 1967/2006
    for så vidt angår mindsteafstanden fra kysten og mindstedybden for anvendelsen
    af vod brugt fra fartøjer, der fisker efter glaskutling (Aphia minuta), Ferrers
    kutling (Pseudaphia ferreri) og slank pikarel (Spicara smaris) i visse spanske
    territorialfarvande (Balearerne)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/1243 της Επιτροπής
