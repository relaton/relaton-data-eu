  content: Regulation (EEC) No 2783/72 of the Commission of 22 December 1972 amending
    Regulation (EEC) No 1454/72 for the purpose of determining for the 1972/73 marketing
    year certain marketing centres for cereals and the derived intervention prices
    applicable at those centres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2783/72 de la Commission, du 22 décembre 1972, modifiant
    le règlement (CEE) n° 1454/72 en vue de fixer, pour la campagne 1972/1973, certains
    centres de commercialisation des céréales et les prix d' intervention dérivés
    s' y rapportant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2783/72 der Kommission vom 22. Dezember 1972 zur Änderung
    der Verordnung (EWG) Nr. 1454/72 zur Festsetzung bestimmter Handelsplätze für
    Getreide und der für sie geltenden Interventionspreise für das Wirtschaftsjahr
    1972/1973
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2783/72 af 22. december 1972 om ændring
    af forordning (EØF) nr. 1454/72 med henblik på for høståret 1972/73 at fastlægge
    visse handelscentre for korn og de for disse handelscentre gældende afledte interventionspriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2783/72 della Commissione, del 22 dicembre 1972, che
    modifica il regolamento (CEE) n. 1454/72 allo scopo di fissare, per la campagna
    1972/1973, alcuni centri di commercializzazione dei cereali ed i relativi prezzi
    d' intervento derivati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2783/72 van de Commissie van 22 december 1972 houdende
    wijziging van Verordening (EEG) nr. 1454/72 met het oog op vaststelling voor het
    verkoopseizoen 1972/1973 van bepaalde handelscentra voor granen en de op deze
    centra betrekking hebbende afgeleide interventieprijzen
