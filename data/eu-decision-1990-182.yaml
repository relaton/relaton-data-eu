title:
- language: en
  script: Latn
  content: '90/182/Euratom, EEC: Commission Decision of 23 March 1990 authorizing
    the United Kingdom not to take into account certain categories of transactions
    and to use certain approximate estimates for the calculation of the VAT own resources
    base (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/182/Euratom, CEE: Décision de la Commission, du 23 mars 1990, autorisant
    le Royaume-Uni à ne pas tenir compte de certaines catégories d''opérations
    ou à utiliser certaines estimations approximatives pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/182/Euratom, EWG: Entscheidung der Kommission vom 23. März 1990 mit
    der das Vereinigte Königreich ermächtigt wird, bei der Berechnung der Grundlage
    für die MwSt.- Eigenmittel bestimmte Gruppen von Umsätzen nicht zu berücksichtigen
    und die Grundlage bei bestimmten anderen Gruppen von Umsätzen anhand annähernder
    Schätzungen zu ermitteln (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/182/Euratom, EØF: Kommissionens beslutning af 23. marts 1990 om bemyndigelse
    af Det Forenede Kongerige til at beregne grundlaget for Fællesskabernes momsindtægter
    uden hensyntagen til visse transaktioner og, for andre transaktioners vedkommende,
    på basis af en tilnærmelsesvis vurdering (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/182/Ευρατόμ, ΕΟΚ: Απόφαση της Επιτροπής
    της 23ης Μαρτίου 1990 με την οποία επιτρέπεται
    στο Ηνωμένο Βασίλειο να μην λαμβάνει υπόψη
    ορισμένες κατηγορίες δραστηριοτήτων ή να χρησιμοποιεί
    κατά προσέγγιση εκτιμήσεις κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο επί της προστιθέμενης αξίας (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/182/Euratom, CEE: Decisione della Commissione, del 23 marzo 1990, che
    autorizza il Regno Unito a non tener conto di determinate categorie di operazioni
    o a ricorrere a talune valutazioni approssimative per il calcolo della base delle
    risorse proprie provenienti dall''imposta sul valore aggiunto (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/182/Euratom, EEG: Beschikking van de Commissie van 23 maart 1990 waarbij
    het Verenigd Koninkrijk wordt gemachtigd geen rekening te houden met bepaalde
    categorieën handelingen en gebruik te maken van ramingen voor de berekening van
    de grondslag van de eigen middelen uit de belasting over de toegevoegde waarde
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/182/Euratom, CEE: Decisão da Comissão, de 23 de Março de 1990, que
    autoriza o Reino Unido a não ter em conta certas categorias de operações e
    a utilizar determinadas estimativas aproximativas para o cálculo da matéria
    colectável dos recursos próprios provenientes do imposto sobre o valor acrescentado
    (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '90/182/Euratom, CEE: Decisión de la Comisión, de 23 de marzo de 1990,
    por la que se autoriza al Reino Unido a no tomar en consideración determinadas
    categorías de operaciones y a utilizar estimaciones aproximadas para el cálculo
    de la base de los recursos propios procedentes del impuesto sobre el valor añadido
    (El texto en lengua inglesa es el único auténtico)'
