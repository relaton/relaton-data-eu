title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2620/84 of 14 September 1984 re-establishing
    the levying of the customs duties on phthalic anhydride, falling within subheading
    29.15 C I, originating in Argentina, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2620/84 de la Commission du 14 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables à l' anhydride
    phtalique, de la sous-position 29.15 C I du tarif douanier commun, originaire
    d' Argentine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2620/84 der Kommission vom 14. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für Phthalsäureanhydrid der Tarifstelle
    29.15 C I mit Ursprung in Argentinien, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2620/84 af 14. september 1984 om genindførelse
    af opkrævning af told for phtalsyreanhydrid, henhørende under pos. 29.15 C I
    og med oprindelse i Argentina, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2620/84 της Επιτροπής
