    ανυδρίτη, της διακρίσεως 29.15 Γ Ι του Κοινού
    Δασμολογίου, καταγωγής Αργεντινής, δικαιούχου
    των προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2620/84 della Commissione del 14 settembre 1984 che
