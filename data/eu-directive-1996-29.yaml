title:
- language: en
  script: Latn
  content: Council Directive 96/29/Euratom of 13 May 1996 laying down basic safety
    standards for the protection of the health of workers and the general public against
    the dangers arising from ionizing radiation
  type: main
- language: fr
  script: Latn
  content: Directive 96/29/Euratom du Conseil du 13 mai 1996 fixant les normes de
    base relatives à la protection sanitaire de la population et des travailleurs
    contre les dangers résultant des rayonnements ionisants
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/29/Euratom des Rates vom 13. Mai 1996 zur Festlegung der
    grundlegenden Sicherheitsnormen für den Schutz der Gesundheit der Arbeitskräfte
    und der Bevölkerung gegen die Gefahren durch ionisierende Strahlungen
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/29/Евратом на Съвета от 13 май
    1996 година относно постановяване на основните
    норми на безопасност за защита на здравето
    на работниците и населението срещу опасностите,
    произтичащи от йонизиращото лъчение
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/29/Euratom ze dne 13. května 1996, kterou se stanoví
    základní bezpečnostní standardy na ochranu zdraví pracovníků a obyvatelstva
    před riziky vyplývajícími z ionizujícího záření
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/29/Euratom af 13. maj 1996 om fastsættelse af grundlæggende
    sikkerhedsnormer til beskyttelse af befolkningens og arbejdstagernes sundhed mod
    de farer, som er forbundet med ioniserende stråling
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/29/Ευρατόμ του Συμβουλίου της 31ης
    Μαΐου 1996 για τον καθορισμό των βασικών κανόνων
    ασφάλειας για την προστασία της υγείας των
    εργαζομένων και του πληθυσμού από τους κινδύνους
    που προκύπτουν από ιονίζουσες ακτινοβολίες
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/29/Euratom, 13. mai 1996, millega sätestatakse põhilised
    ohutusnormid töötajate ja muu elanikkonna tervise kaitsmiseks ioniseerivast
    kiirgusest tulenevate ohtude eest
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi N:o 96/29/Euratom, annettu 13 päivänä toukokuuta
    1996, perusnormien vahvistamisesta työntekijöiden ja väestön terveyden suojelemiseksi
    ionisoivasta säteilystä aiheutuvilta vaaroilta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 96/29/Euratom od 13. svibnja 1996. o utvrđivanju osnovnih
    sigurnosnih normi za zašitu zdravlja radnika i stanovništva od opasnosti od
    ionizirajućeg zračenja
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/29/Euratom irányelve (1996. május 13.) a munkavállalók
    és a lakosság egészségének az ionizáló sugárzásból származó veszélyekkel
    szembeni védelmét szolgáló alapvető biztonsági előírások megállapításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/29/Euratom del Consiglio del 13 maggio 1996 che stabilisce
    le norme fondamentali di sicurezza relative alla protezione sanitaria della popolazione
    e dei lavoratori contro i pericoli derivanti dalle radiazioni ionizzanti
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/29/Euratom (1996. gada 13. maijs), kas nosaka drošības
    pamatstandartus darba ņēmēju un iedzīvotāju veselības aizsardzībai pret
    jonizējošā starojuma radītajām briesmām
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 13 d. Tarybos direktyva 96/29/EURATOMAS, nustatanti pagrindinius
    darbuotojų ir gyventojų sveikatos apsaugos nuo jonizuojančiosios spinduliuotės
    saugos standartus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/29/EURATOM tat-13 ta' Mejju 1996 li tistabbilixxi
    standards bażiċi ta' sigurtà għall-ħarsien tas-saħħa tal-ħaddiema u l-pubbliku
    ġenerali kontra l-perikli li jiġu minn radjazzjoni jonizzanti
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/29/Euratom van de Raad van 13 mei 1996 tot vaststelling van
    de basisnormen voor de bescherming van de gezondheid der bevolking en der werkers
    tegen de aan ioniserende straling verbonden gevaren
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/29/euratom z dnia 13 maja 1996 r. ustanawiającą podstawowe
    normy bezpieczeństwa w zakresie ochrony zdrowia pracowników i ogółu społeczeństwa
    przed zagrożeniami wynikającymi z promieniowania jonizującego
  type: main
- language: pt
  script: Latn
  content: Directiva 96/29/Euratom do Conselho de 13 de Maio de 1996 que fixa as normas
    de segurança de base relativas à protecção sanitária da população e dos
    trabalhadores contra os perigos resultantes das radiações ionizantes
  type: main
- language: ro
  script: Latn
  content: Directiva 96/29/Euratom a Consiliului din 13 mai 1996 de stabilire a normelor
    de securitate de bază privind protecția sănătății lucrătorilor și a populației
    împotriva pericolelor prezentate de radiațiile ionizante
  type: main
- language: sk
  script: Latn
  content: Smernica rady č. 96/29/EURATOM z 13. mája 1996, ktorá stanovuje základné
    bezpečnostné normy ochrany zdravia pracovníkov a obyvateľstva pred nebezpečenstvami
    vznikajúcimi v dôsledku ionizujúceho žiarenia
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/29/EURATOM z dne 13. maja 1996 o določitvi temeljnih
    varnostnih standardov za varstvo zdravja delavcev in prebivalstva pred nevarnostmi
    zaradi ionizirajočega sevanja
  type: main
- language: es
  script: Latn
  content: Directiva 96/29/Euratom del Consejo de 13 de mayo de 1996 por la que se
    establecen las normas básicas relativas a la protección sanitaria de los trabajadores
    y de la población contra los riesgos que resultan de las radiaciones ionizantes
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/29/Euratom av den 13 maj 1996 om fastställande av
    grundläggande säkerhetsnormer för skydd av arbetstagarnas och allmänhetens
    hälsa mot de faror som uppstår till följd av joniserande strålning
  type: main
