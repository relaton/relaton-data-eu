    της 23ης Δεκεμβρίου 1975, περί τροποποίησης του
    Κανονισμού ( ΕΟΚ ) αριθ. 3559/73 που καθορίζει τις
    διατάξεις εφαρμογής όσον αφορά την χορήγηση
    αντισταθμιστικής χρηματοδότησης και αποζημίωσης
