  script: Latn
  content: Commission Implementing Decision (EU) 2018/102 of 19 January 2018 amending
    Annex II to Decision 93/52/EEC as regards the recognition of the Autonomous Communities
    of Aragon and Catalonia of Spain as officially brucellosis (B. melitensis)-free
    regions (notified under document C(2018) 159)
