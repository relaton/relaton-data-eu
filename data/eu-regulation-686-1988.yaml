  content: Commission Regulation (EEC) No 686/88 of 16 March 1988 laying down special
    measures for the 1987/88 marketing year regarding production aid for olive oil
    in Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 686/88 de la Commission du 16 mars 1988 prévoyant
    des mesures spéciales pour la campagne 1987/1988 concernant l'aide à la production
    d'huile d'olive en Espagne et au Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 686/88 DER KOMMISSION vom 16. März 1988 mit Sondermaßnahmen
    für das Wirtschaftsjahr 1987/88 hinsichtlich der Beihilfe für die Erzeugung
    von Olivenöl in Spanien und Portugal #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 686/88 af 16. marts 1988 om fastsættelse
    af særlige foranstaltninger for produktionsåret 1987/88 for ydelse af støtte
    til produktion af olivenolie i Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 686/88 της Επιτροπής
