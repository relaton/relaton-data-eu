    για την περίοδο 1987/88 όσον αφορά την ενίσχυση
    στην παραγωγή ελαιολάδου στην Ισπανία και
    στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 686/88 DELLA COMMISSIONE del 16 marzo 1988 che stabilisce
    misure speciali per la campagna 1987/1988 in materia di aiuto alla produzione
    di olio d'' oliva in Spagna e in Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 686/88 VAN DE COMMISSIE van 16 maart 1988 houdende
