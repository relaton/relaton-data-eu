title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1840/2004 of 21 October 2004 amending for
    the 39th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1840/2004 de la Commission du 21 octobre 2004 modifiant
    pour la trente-neuvième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1840/2004 der Kommission vom 21. Oktober 2004 zur neununddreißigsten
