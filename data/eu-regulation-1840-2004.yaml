    за налагане на някои специфични ограничителни
    мерки, насочени срещу определени лица и образувания,
    свързани с Осама бен Ладен, мрежата на Ал Кайда
    и талибаните, и за отмяна на Регламент (ЕО) №
    467/2001 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1840/2004 ze dne 21. října 2004, kterým
