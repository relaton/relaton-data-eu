  type: main
- language: hu
  script: Latn
  content: A Bizottság 1840/2004/EK rendelete (2004. október 21.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet 39. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1840/2004 della Commissione, del 21 ottobre 2004, recante
