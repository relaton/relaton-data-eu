    ekoloških mjerila za dodjelu znaka za okoliš EU-a za određene tekstilne proizvode
    i obuću te s njima povezanih zahtjeva u pogledu procjene i verifikacije (priopćeno
    pod brojem dokumenta C(2020) 8152)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1805 határozata (2020. november 27.) a 2014/350/EU
    és az (EU) 2016/1349 határozatnak a textiltermékekre, illetve a lábbelikre
    vonatkozó uniós ökocímke odaítélésével kapcsolatos ökológiai kritériumok,
    valamint a kapcsolódó értékelési és ellenőrzési követelmények érvényességének
    meghosszabbítása érdekében történő módosításáról (az értesítés
    a C(2020) 8152. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2020/1805 della Commissione del 27 novembre 2020 che modifica
    le decisioni 2014/350/UE e (UE) 2016/1349 prorogando il periodo di validità dei
    criteri ecologici per l’assegnazione del marchio di qualità ecologica dell’Unione
    europea (Ecolabel UE) ai prodotti tessili e alle calzature, nonché dei relativi
    requisiti di valutazione e verifica [notificata con il numero C(2020) 8152]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2020/1805 (2020. gada 27. novembris), ar ko groza
    Lēmumu 2014/350/ES un Lēmumu (ES) 2016/1349, proti, pagarina to ekoloģisko
    kritēriju spēkā esības termiņu, atbilstoši kuriem piešķir ES ekomarķējumu
    tekstilizstrādājumiem un apaviem, un saistīto novērtēšanas un verifikācijas
    prasību spēkā esības termiņu (izziņots ar dokumenta numuru C(2020) 8152)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas (ES) 2020/1805 2020 m. lapkričio 27 d. kuriuo dėl
    ekologinių kriterijų, taikomų tekstilės gaminiams ir avalynei suteikiant ES
    ekologinį ženklą, ir su jais susijusių vertinimo bei patikros reikalavimų
    galiojimo laikotarpio pratęsimo iš dalies keičiami sprendimai 2014/350/ES ir
    (ES) 2016/1349 (pranešta dokumentu Nr. C(2020) 8152)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2020/1805 tas-27 ta’ Novembru 2020 li
