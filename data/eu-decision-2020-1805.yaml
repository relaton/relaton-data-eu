    des Beschlusses 2014/350/EU und des Beschlusses (EU) 2016/1349 zur Verlängerung
    der Geltungsdauer der Umweltkriterien für die Vergabe des EU-Umweltzeichens für
    Textilerzeugnisse und Schuhe sowie der damit verbundenen Beurteilungs- und Prüfanforderungen
    (Bekannt gegeben unter Aktenzeichen C(2020) 8152)
  type: main
