    ta’ validità tal-kriterji ekoloġiċi għall-għoti tal-Ekotikketta tal-UE
    lill-prodotti tessili u lix-xedd tas-saqajn u tar-rekwiżiti ta’ valutazzjoni
    u ta’ verifika relatati magħhom (notifikata bid-dokument C(2020) 8152)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2020/1805 van de Commissie van 27 november 2020 tot wijziging
    van de Besluiten 2014/350/EU en (EU) 2016/1349 tot verlenging van de geldigheidsduur
    van de milieucriteria voor de toekenning van de EU-milieukeur aan textielproducten
    en schoeisel en van de daarmee verband houdende eisen inzake beoordeling en controle
    (Kennisgeving geschied onder nummer C(2020) 8152)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2020/1805 z dnia 27 listopada 2020 r. zmieniająca
    decyzje 2014/350/UE i (UE) 2016/1349 oraz przedłużająca okres ważności kryteriów
    ekologicznych przyznawania oznakowania ekologicznego UE wyrobom włókienniczym
    i obuwiu oraz związanych z nimi wymogów dotyczących oceny i weryfikacji (notyfikowana
    jako dokument nr C(2020) 8152)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2020/1805 da Comissão de 27 de novembro de 2020 que altera
    a Decisão 2014/350/UE e a Decisão (UE) 2016/1349 prorrogando o período de validade
    dos critérios ecológicos para atribuição do rótulo ecológico da UE a produtos
    têxteis e a calçado e dos correspondentes requisitos de avaliação e verificação
    [notificada com o número C(2020) 8152]
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2020/1805 a Comisiei din 27 noiembrie 2020 de modificare a
    Deciziei 2014/350/UE și a Deciziei (UE) 2016/1349 prin prelungirea perioadei
    de valabilitate a criteriilor ecologice de acordare a etichetei ecologice a UE
    pentru produse textile și încălțăminte și a cerințelor de evaluare și
    de verificare aferente [notificată cu numărul C(2020) 8152]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (EÚ) 2020/1805 z 27. novembra 2020, ktorým sa menia
    rozhodnutia 2014/350/EÚ a (EÚ) 2016/1349 a ktorým sa predlžuje obdobie platnosti
    ekologických kritérií udeľovania environmentálnej značky EÚ textilným
    výrobkom a obuvi, ako aj súvisiacich požiadaviek na posudzovanie a overovanie
    [oznámené pod číslom C(2020) 8152]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije (EU) 2020/1805 z dne 27. novembra 2020 o spremembi sklepov
    2014/350/EU in (EU) 2016/1349 glede podaljšanja obdobja veljavnosti okoljskih
    meril za podelitev znaka EU za okolje tekstilnim in obutvenim izdelkom ter z njimi
    povezanih zahtev za ocenjevanje in preverjanje (notificirano pod dokumentarno
    številko C(2020) 8152)
  type: main
