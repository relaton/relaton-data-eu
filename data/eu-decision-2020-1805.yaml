title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2020/1805 of 27 November 2020 amending Decisions
    2014/350/EU and (EU) 2016/1349 extending the period of validity of the ecological
    criteria for the award of the EU Ecolabel to textile products and footwear and
    of the related assessment and verification requirements (notified under document
    C(2020) 8152)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1805 de la Commission du 27 novembre 2020 modifiant
    la décision 2014/350/UE et la décision (UE) 2016/1349 en prorogeant la période
    de validité des critères écologiques pour l’attribution du label écologique
    de l’Union européenne aux produits textiles et aux articles chaussants ainsi
    que des exigences en matière d’évaluation et de vérification s’y rapportant
    [notifiée sous le numéro C(2020) 8152]
  type: main
- language: de
  script: Latn
