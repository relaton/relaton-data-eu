  content: Decisión (UE) 2020/1805 de la Comisión de 27 de noviembre de 2020 por
    la que se modifican las Decisiones 2014/350/UE y (UE) 2016/1349 para prorrogar
    el período de validez de los criterios ecológicos para la concesión de la etiqueta
    ecológica de la UE a los productos textiles y al calzado, así como los requisitos
    de evaluación y verificación correspondientes [notificada con el número C(2020)
    8152]
  type: main
