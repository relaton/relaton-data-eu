  script: Latn
  content: COMMISSION REGULATION (EEC) No 1591/93 of 22 June 1993 re-establishing
    the levying of customs duties on products falling within CN codes ex 4202 and
    ex 4203, originating in India, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1591/93 de la Commission du 22 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC ex
    4202 et ex 4203, originaires d'Inde, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1591/93 DER KOMMISSION vom 22. Juni 1993 zur Wiedereinführung
