  content: Council Regulation (EEC) No 3461/82 of 21 December 1982 amending Regulation
    (EEC) No 2925/78 as regards the period of suspension of application of the price
    condition to which imports into the Community of certain types of citrus fruit
    originating in Spain are subject
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3461/82 du Conseil, du 21 décembre 1982, modifiant
    le règlement (CEE) n° 2925/78 en ce qui concerne la période de suspension de
    l' application de la condition de prix à laquelle est soumise l' importation
    dans la Communauté de certains agrumes originaires d' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3461/82 des Rates vom 21. Dezember 1982 zur Änderung
    der Verordnung (EWG) Nr. 2925/78 hinsichtlich der Dauer der Aussetzung der Preisbedingung
    für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung in Spanien in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3461/82 af 21. december 1982 om ændring
    af forordning (EØF) nr. 2925/78 for så vidt angår perioden for suspension af
    anvendelsen af den prisbetingelse, der gælder for indførsel til Fællesskabet
    af visse citrusfrugter med oprindelse i Spanienn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3461/82 τού Συμβουλίου
    τής 21ης Δεκεμβρίου 1982 περί τροποποιήσεως τού
    κανονισμού (EOK) αριθ. 2925/78 σχετικά μέ τήν περίοδο
    αναστολής εφαρμογής τού όρου τιμών στόν οποίο
    υπόκειται η εισαγωγή στήν Κοινότητα ορισμένων
    εσπεριδοειδών καταγωγής Ισπανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3461/82 del Consiglio, del 21 dicembre 1982, che modifica
    il regolamento (CEE) n. 2925/78 per quanto concerne il periodo di sospensione
    dell' applicazione della condizione in materia di prezzi cui sono subordinate
    le importazioni nella Comunità di taluni agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3461/82 van de Raad van 21 december 1982 houdende
