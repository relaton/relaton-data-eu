id: EURegulation15991973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1599/73 of the Commission of 14 June 1973 re-establishing
    Common Customs Tariff duties on spoons, forks, fish-eaters, butter-knives, ladles,
    and similar kitchen or tableware, of stainless steel, falling within heading No
    82.14 A, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1599/73 de la Commission, du 14 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux cuillers, louches, fourchettes, pelles à tartes, couteaux spéciaux à poisson
    ou beurre, pinces à sucre et articles similaires, en acier inoxydable, de la
    sous-position tarifaire 82.14 A, originaires de Hong Kong, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1599/73 der Kommission vom 14. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Löffel, Schöpfkellen, Gabeln,
    Tortenschaufeln, Fischmesser, Buttermesser, Zuckerzangen und ähnliche Tischgeräte
    aus rostfreiem Stahl, der Tarifstelle 82.14 A, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1599/73 af 14. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for skeer, gafler, fiskeknive, smørknive,
    potageskeer og lignende artikler til køkken- og bordbrug, af rustfrit stål under
    position 82.14 A, som har oprindelse i Hong-Kong, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1599/73 della Commissione, del 14 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    cucchiai, cucchiaioni, forchette, palette da torta, coltelli speciali da pesce
    o da burro, pinze da zucchero e oggetti simili, di acciaio inossidabile, della
    sottovoce doganale n. 82.14 A originari di Hong Kong, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1599/73 van de Commissie van 14 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op lepels, pollepels, vorken, taartscheppen, vismessen en botermesjes,
    suikertangen en dergelijke artikelen, van roestvrij staal, van onderverdeling
    82.14 A, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG)
    nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden
    geopend
  type: main
