    Ausgleichs nach Verarbeitung dieser Zitronen für Juni 1987
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1736/87 af 19. juni 1987 om fastsættelse
    for juni 1987 af minimumsopkøbsprisen for citroner, der leveres til industrien,
    og af størrelsen af udligningstilskuddet efter forarbejdning af disse citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1736/87 της Επιτροπής
