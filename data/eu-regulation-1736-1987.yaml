    all' industria e l' importo della compensazione finanziaria concessa dopo la loro
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1736/87 van de Commissie van 19 juni 1987 tot vaststelling,
