    που παραδίδονται στη βιομηχανία και του ποσού
    της χρηματικής αντισταθμίσεως μετά τη μεταποίηση
    των λεμονιών αυτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1736/87 della Commissione del 19 giugno 1987 che fissa,
