    geraamde produktie in het verkoopseizoen 1990/1991 en de werkelijke produktie
    in het verkoopseizoen 1989/1990, alsmede van de aanpassing van het steunbedrag
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2510/90 DA COMISSAO de 30 de Agosto de 1990 que fixa,
