title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2510/90 of 30 August 1990 fixing, for peas,
    field beans and sweet lupins, the level of estimated production for the 1990/91
    marketing year, the level of actual production for the 1989/90 marketing year,
    and the adjustment to be made to the amount of the aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2510/90 de la Commission du 30 août 1990 fixant,
    pour la campagne de commercialisation 1990/1991, la production estimée et, pour
    la campagne de commercialisation 1989/1990, la production effective, ainsi que
    l'ajustement dont le montant de l'aide est affecté pour les pois, fèves, féveroles
    et lupins doux
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2510/90 DER KOMMISSION vom 30. August 1990 zur Schaetzung
    der Erzeugung fuer das Wirtschaftsjahr 1990/91, zur Feststellung der tatsaechlichen
    Erzeugung des Wirtschaftsjahres 1989/90 und zur Festsetzung des Anpassungsbetrags
    der Beihilfe fuer Erbsen, Puffbohnen, Ackerbohnen und Suesslupinen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2510/90 af 30. august 1990 om fastsættelse
    for produktionsåret 1990/91 af den anslåede produktion og for produktionsåret
    1989/90 af den faktiske produktion af ærter, bønner, hestebønner og sødlupiner,
    og om tilpasning af støttebeløbet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2510/90 της Επιτροπής
    της 30ής Αυγούστου 1990 σχετικά με τον καθορισμό,
    για την περίοδο εμπορίας 1990/91, της εκτιμώμενης
    παραγωγής και, για την περίοδο εμπορίας 1989/90,
    της πραγματικής παραγωγής κραμβόσπορων και
    γογγυλόσπορων, καθώς και για την προσαρμογή
    του ποσού ενίσχυσής τους
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2510/90 DELLA COMMISSIONE del 30 agosto 1990 che fissa,
    per la campagna di commercializzazione 1990/1991, la produzione stimata e, per
    la campagna 1989/1990, la produzione effettiva, nonché l'adeguamento dell'importo
    dell'integrazione per i piselli, le fave, le favette e i lupini dolci
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2510/90 VAN DE COMMISSIE van 30 augustus 1990 houdende
