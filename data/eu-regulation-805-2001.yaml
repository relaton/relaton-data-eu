title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 805/2001 of 26 April 2001 amending Regulation
    (EC) No 2869/2000 and increasing to 1000000 tonnes the amount of common wheat
    from the 1999 harvest held by the French intervention agency for which a standing
    invitation to tender for resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 805/2001 de la Commission du 26 avril 2001 modifiant
    le règlement (CE) n° 2869/2000 et portant à 1000000 de tonnes l'adjudication
    permanente pour la revente sur le marché intérieur de blé tendre de la récolte
    1999 détenues par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 805/2001 der Kommission vom 26. April 2001 zur Änderung
    der Verordnung (EG) Nr. 2869/2000 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Weichweizen der Ernte 1999 aus Beständen
    der französischen Interventionsstelle auf 1000000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 805/2001 af 26. april 2001 om ændring
    af forordning (EF) nr. 2869/2000 og om forhøjelse til 1000000 tons af den løbende
    licitation med henblik på videresalg på det indre marked af blød hvede fra
    høsten i 1999, som det franske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 805/2001 της Επιτροπής,
    της 26ης Απριλίου 2001, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2869/2000 και ορίζει σε 1000000 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά μαλακού σίτου συγκομιδής 1999 που έχει
    στη διάθεσή του ο γαλλικός οργανισμός παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 805/2001, annettu 26 päivänä huhtikuuta 2001,
    asetuksen (EY) N:o 2869/2000 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    1000000 tonniin Ranskan interventioelimen hallussaan pitämän sadonkorjuuvuoden
    1999 vehnämäärän uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 805/2001 della Commissione, del 26 aprile 2001, che
    modifica il regolamento (CE) n. 2869/2000 e che porta a 1000000 di t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    frumento tenero della raccolta 1999 detenuto dall'organismo d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 805/2001 van de Commissie van 26 april 2001 tot wĳziging
    van Verordening (EG) nr. 2869/2000 teneinde de hoeveelheid waarop de permanente
    openbare inschrĳving voor de verkoop op de interne markt van zachte tarwe van
    de oogst 1999 uit de voorraden van het Franse interventiebureau betrekking heeft,
    tot 1000000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 805/2001 da Comissão, de 26 de Abril de 2001, que
