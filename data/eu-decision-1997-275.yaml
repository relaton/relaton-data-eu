  script: Latn
  content: '97/275/EC: Commission Decision of 9 April 1997 amending Decision 93/25/EEC
    approving certain treatments to inhibit the development of pathogenic micro-organisms
    in bivalve molluscs and marine gastropods'
  type: main
- language: fr
  script: Latn
  content: '97/275/CE: Décision de la Commission du 9 avril 1997 modifiant la décision
    93/25/CEE approuvant certains traitements destinés à inhiber le développement
    des micro-organismes pathogènes dans les mollusques bivalves et les gastéropodes
    marins'
  type: main
- language: de
  script: Latn
  content: '97/275/EG: Entscheidung der Kommission vom 9. April 1997 zur Änderung
