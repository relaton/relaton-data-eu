    temporară a cailor înregistrați provenind din Costa Rica și la Decizia 2004/211/CE
    în ceea ce privește mențiunile referitoare la Brazilia și Costa Rica în lista
    cu țări terțe și cu regiuni ale acestora din care sunt autorizate importurile
