    pagaidu ievešanu no Kostarikas un Lēmuma 2004/211/EK pielikumu attiecībā uz
    ierakstiem par Brazīliju un Kostariku to trešo valstu un ar tām saistīto teritoriju
    daļu sarakstā, no kurām atļauts Savienībā ievest dzīvus zirgu dzimtas dzīvniekus
    un to spermu, olšūnas un embrijus (izziņots ar dokumenta numuru C(2014) 5166)'
