title:
- language: en
  script: Latn
  content: '2014/501/EU: Commission Implementing Decision of 24 July 2014 amending
    the Annexes to Decision 92/260/EEC as regards the temporary admission of registered
    horses from Costa Rica and Decision 2004/211/EC as regards the entries for Brazil
    and Costa Rica in the list of third countries and parts thereof from which the
    importation into the Union of live equidae and semen, ova and embryos of the equine
    species are authorised (notified under document C(2014) 5166)'
  type: main
- language: fr
  script: Latn
  content: '2014/501/UE: Décision d''exécution de la Commission du 24 juillet 2014
    modifiant les annexes de la décision 92/260/CEE en ce qui concerne l''admission
    temporaire de chevaux enregistrés en provenance du Costa Rica et de la décision
    2004/211/CE en ce qui concerne les mentions relatives au Brésil et au Costa Rica
    sur la liste des pays tiers et des parties de territoires de ces pays en provenance
    desquels les importations dans l''Union d''équidés vivants et de sperme, d''ovules
    et d''embryons de l''espèce équine sont autorisées [notifiée sous le numéro
    C(2014) 5166]'
  type: main
- language: de
  script: Latn
  content: '2014/501/EU: Durchführungsbeschluss der Kommission vom 24. Juli 2014
    zur Änderung der Anhänge der Entscheidung 92/260/EWG in Bezug auf die zeitweilige
    Zulassung registrierter Pferde aus Costa Rica und der Entscheidung 2004/211/EG
    hinsichtlich der Einträge zu Brasilien und Costa Rica in der Liste der Drittländer
    und Teile von Drittländern, aus denen die Einfuhr lebender Equiden sowie von
    Equidensperma, Eizellen und Embryonen von Equiden zugelassen sind (Bekanntgegeben
    unter Aktenzeichen C(2014) 5166)'
  type: main
- language: bg
  script: Cyrl
