    Kostarike i Odluci 2004/211/EZ u pogledu unosa za Brazil i Kostariku na popisu
    trećih zemalja i njihovih dijelova iz kojih je dopušten uvoz živih kopitara
    i sjemena, jajnih stanica i zametaka kopitara u Uniju (priopćeno pod brojem dokumenta
    C(2014) 5166)'
  type: main
- language: hu
  script: Latn
  content: '2014/501/EU: A Bizottság végrehajtási határozata ( 2014. július 24.
