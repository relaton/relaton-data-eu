    от 24 юли 2014 година за изменение на приложенията
    към Решение 92/260/ЕИО по отношение на временното
    допускане на регистрирани коне от Коста Рика
    и на Решение 2004/211/ЕО по отношение на вписванията
    за Бразилия и Коста Рика в списъка на трети
    страни и части от тях, от които е разрешен вносът
    в Съюза на живи еднокопитни и на сперма, яйцеклетки
    и ембриони от еднокопитни (нотифицирано под
    номер С(2014) 5166)'
  type: main
- language: cs
  script: Latn
  content: '2014/501/EU: Prováděcí rozhodnutí Komise ze dne 24. července 2014
    , kterým se mění přílohy rozhodnutí 92/260/EHS, pokud jde o dočasný dovoz
    evidovaných koní z Kostariky, a rozhodnutí 2004/211/ES, pokud jde o položky
    týkající se Brazílie a Kostariky v seznamu třetích zemí a jejich částí,
    ze kterých je povolen dovoz živých koňovitých a spermatu, vajíček a embryí
    druhů koňovitých do Unie (oznámeno pod číslem C(2014) 5166)'
  type: main
- language: da
  script: Latn
