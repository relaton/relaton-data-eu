    történő ideiglenes behozatala tekintetében, valamint a 2004/211/EK határozatnak
    az élő lófélék és ezek spermájának, petesejtjének és embriójának az
    Unióba történő behozatalára feljogosított harmadik országok és országrészek
    jegyzékében a Brazíliára és Costa Ricára vonatkozó bejegyzés tekintetében
    történő módosításáról (az értesítés a C(2014) 5166. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2014/501/UE: Decisione di esecuzione della Commissione, del 24 luglio
    2014 , che modifica gli allegati della decisione 92/260/CEE per quanto riguarda
    l''ammissione temporanea di cavalli registrati provenienti dalla Costa Rica e
    la decisione 2004/211/CE per quanto riguarda le voci relative al Brasile e alla
    Costa Rica nell''elenco dei paesi terzi e delle parti di paesi terzi da cui è
    autorizzata l''importazione nell''Unione di equidi vivi nonché di sperma, ovuli
    ed embrioni della specie equina [notificata con il numero C(2014) 5166]'
  type: main
- language: lv
  script: Latn
  content: '2014/501/ES: Komisijas Īstenošanas lēmums ( 2014. gada 24. jūlijs
