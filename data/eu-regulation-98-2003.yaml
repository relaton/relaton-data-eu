    produktu piegādi, par pārstrādi un par lauksaimniecībā izmantojamu vielu
    piegādi, kā arī par dzīvu dzīvnieku un olu piegādi attālākajiem reģioniem
    saskaņā ar Padomes Regulām (EK) Nr. 1452/2001, (EK) Nr. 1453/2001 un (EK) Nr.
    1454/2001
