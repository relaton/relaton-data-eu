  script: Latn
  content: Verordening (EG) nr. 98/2003 van de Commissie van 20 januari 2003 tot vaststelling
    van de voorzieningsbalansen en van de communautaire steun voor de voorziening
    van bepaalde essentiële producten voor menselĳke consumptie, voor verwerking
    of voor verbruik als productiemiddel in de landbouw en voor de levering van levende
