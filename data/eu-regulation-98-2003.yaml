title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 98/2003 of 20 January 2003 establishing the
    supply balances and Community aid for the supply of certain essential products
    for human consumption, for processing and as agricultural inputs and for the supply
    of live animals and eggs to the outermost regions under Council Regulations (EC)
    No 1452/2001, (EC) No 1453/2001 and (EC) No 1454/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 98/2003 de la Commission du 20 janvier 2003 relatif
    à l'établissement des bilans prévisionnels et la fixation des aides communautaires
    pour l'approvisionnement en certains produits essentiels à la consommation humaine,
    à la transformation et en tant qu'intrants agricoles et pour la fourniture d'animaux
    vivants et d'œufs aux régions ultrapériphériques conformément aux règlements
    (CE) n° 1452/2001, (CE) n° 1453/2001 et (CE) n° 1454/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 98/2003 der Kommission vom 20. Januar 2003 zur Festsetzung
    der Bedarfsvorausschätzungen und der Gemeinschaftsbeihilfen für die Versorgung
    der Regionen in äußerster Randlage mit bestimmten zum Direktverbrauch, zur Verarbeitung
    oder als Produktionsmittel benötigten Agrarerzeugnissen einschließlich lebenden
    Tieren und Eiern gemäß den Verordnungen (EG) Nr. 1452/2001, 1453/2001 und 1454/2001
    des Rates
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 98/2003 ze dne 20. ledna 2003 týkající se
    stanovení předběžných odhadů a podpor Společenství pro zásobování některými
    produkty, které jsou důležité pro lidskou spotřebu, zpracování a jako zemědělské
    vstupy, a pro dodávku živých zvířat a vajec do nejvzdálenějších regionů
    v souladu s nařízeními Rady (ES) č. 1452/2001, (ES) č. 1453/2001 a (ES) č.
    1454/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 98/2003 af 20. januar 2003 om fastsættelse
