    o abastecimento de certos produtos essenciais para o consumo humano e a transformação
    e como factores de produção agrícola e para o fornecimento de animais vivos
    e de ovos às regiões ultraperiféricas, em conformidade com os Regulamentos
    (CE) n.° 1452/2001, (CE) n.° 1453/2001 e (CE) n.° 1454/2001 do Conselho
  type: main
