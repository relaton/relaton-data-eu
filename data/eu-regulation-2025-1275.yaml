  content: Commission Delegated Regulation (EU) 2025/1275 of 17 March 2025 correcting
    certain language versions of Delegated Regulation (EU) 2024/857 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards specifying a standardised methodology and a
    simplified standardised methodology to evaluate the risks arising from potential
    changes in interest rates that affect both the economic value of equity and the
    net interest income of an institution’s non-trading book activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1275 de la Commission du 17 mars 2025 rectifiant
    certaines versions linguistiques du règlement délégué (UE) 2024/857 complétant
    la directive 2013/36/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation définissant une méthode standard et une méthode standard
    simplifiée pour évaluer les risques découlant d’éventuelles variations des
    taux d’intérêt affectant aussi bien la valeur économique des fonds propres
    que les produits d’intérêts nets des activités hors portefeuille de négociation
    d’un établissement
  type: main
- language: de
  script: Latn
