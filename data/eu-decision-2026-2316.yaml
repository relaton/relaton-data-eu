    произход и рециклирани въглеродни горива,
    които са определени в Директива (ЕС) 2018/2001 на
    Европейския парламент и на Съвета, и за отмяна
    на Решение за изпълнение (ЕС) 2022/607 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/2316 ze dne 15. října 2026
    o uznání nepovinného režimu Roundtable on Sustainable Biomaterials (RSB) EU
    RED pro prokázání souladu s požadavky na biopaliva, biokapaliny, paliva z
    biomasy, paliva z obnovitelných zdrojů nebiologického původu a recyklovaná
    paliva s obsahem uhlíku stanovenými ve směrnici Evropského parlamentu a Rady
    (EU) 2018/2001 a o zrušení prováděcího rozhodnutí Komise (EU) 2022/607
  type: main
