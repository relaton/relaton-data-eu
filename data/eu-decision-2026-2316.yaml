    a nem biológiai eredetű megújuló üzemanyagokra és a széntartalom újrahasznosításával
    nyert üzemanyagokra vonatkozó követelményeknek való megfelelést igazoló
    Roundtable on Sustainable Biomaterials (RSB) EU RED önkéntes rendszer elismeréséről,
    valamint az (EU) 2022/607 bizottsági végrehajtási határozat hatályon kívül
    helyezéséről
  type: main
