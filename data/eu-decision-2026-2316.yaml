    2018/2001 nustatytiems biodegalų, skystųjų bioproduktų, biomasės kuro, nebiologinės
    kilmės kuro iš atsinaujinančiųjų išteklių ir perdirbtosios anglies kuro
    reikalavimams įrodyti, kuriuo panaikinamas Komisijos įgyvendinimo sprendimas
    (ES) 2022/607
  type: main
