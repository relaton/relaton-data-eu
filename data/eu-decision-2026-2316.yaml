    (RSB) EU RED hyväksymisestä Euroopan parlamentin ja neuvoston direktiivissä
    (EU) 2018/2001 vahvistettujen vaatimusten noudattamisen osoittamiseksi biopolttoaineiden,
    bionesteiden, biomassapolttoaineiden, muuta kuin biologista alkuperää olevien
    uusiutuvien polttoaineiden ja kierrätettyjen hiilipitoisten polttoaineiden osalta
    sekä komission täytäntöönpanopäätöksen (EU) 2022/607 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/2316 ón gCoimisiún an 15 Deireadh
    Fómhair 2026 maidir le haitheantas a thabhairt don scéim dheonach Roundtable
    on Sustainable Biomaterials (RSB) EU RED as léiriú go gcomhlíontar na ceanglais
    le haghaidh bithbhreoslaí, bithleachtanna, breoslaí bithmhaise, breoslaí in-athnuaite
    de thionscnamh neamh-bhitheolaíoch agus breoslaí carbóin athchúrsáilte a
    leagtar amach i dTreoir (AE) 2018/2001 ó Pharlaimint na hEorpa agus ón gComhairle,
    agus lena n-aisghairtear Cinneadh Cur Chun Feidhme (AE) 2022/607 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/2316 оd 15. listopada 2026. o priznavanju
    dobrovoljnog programa Roundtable on Sustainable Biomaterials (RSB) EU RED za dokazivanje
