title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/2316 of 15 October 2026 on the
    recognition of the Roundtable on Sustainable Biomaterials (RSB) EU RED voluntary
    scheme for demonstrating compliance with the requirements for biofuels, bioliquids,
    biomass fuels, renewable fuels of non-biological origin and recycled carbon fuels
    set out in Directive (EU) 2018/2001 of the European Parliament and of the Council,
    and repealing Commission Implementing Decision (EU) 2022/607
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/2316 de la Commission du 15 octobre
    2026 portant reconnaissance du système volontaire Roundtable on Sustainable Biomaterials
    (RSB) EU RED pour l’établissement de la conformité avec les exigences applicables
    aux biocarburants, aux bioliquides, aux combustibles issus de la biomasse, aux
    carburants renouvelables d’origine non biologique et aux carburants à base
    de carbone recyclé énoncées dans la directive (UE) 2018/2001 du Parlement européen
    et du Conseil, et abrogeant la décision d’exécution (UE) 2022/607 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/2316 der Kommission vom 15. Oktober 2026
    über die Anerkennung des freiwilligen Systems Roundtable on Sustainable Biomaterials
    (RSB) EU RED zum Nachweis der Einhaltung der in der Richtlinie (EU) 2018/2001
    des Europäischen Parlaments und des Rates festgelegten Anforderungen für Biokraftstoffe,
    flüssige Biobrennstoffe, Biomasse-Brennstoffe, erneuerbare Brenn- und Kraftstoffe
    nicht biogenen Ursprungs und wiederverwertete kohlenstoffhaltige Kraftstoffe und
    zur Aufhebung des Durchführungsbeschlusses (EU) 2022/607 der Kommission
  type: main
- language: bg
  script: Cyrl
