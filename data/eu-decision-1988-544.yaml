title:
- language: en
  script: Latn
  content: '88/544/ECSC: Commission Decision of 12 October 1988 derogating from High
    Authority recommendation No 1-64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries (135th derogation)'
  type: main
- language: fr
  script: Latn
  content: '88/544/CECA: Décision de la Commission du 12 octobre 1988 portant dérogation
    à la recommandation n° 1-64 de la Haute Autorité sur la protection tarifaire
    afin de permettre l'' application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires des pays en voie de développement
    (cent trente-cinquième dérogation)'
  type: main
- language: de
  script: Latn
  content: '88/544/EGKS: Entscheidung der Kommission vom 12. Oktober 1988 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über den Außenschutz
    im Hinblick auf die Anwendung der allgemeinen Zollpräferenzen auf bestimmte Stahlerzeugnisse
    mit Ursprung in Entwicklungsländern (135. Ausnahmeentscheidung)'
  type: main
- language: da
  script: Latn
  content: '88/544/EKSF: Kommissionens beslutning af 12. oktober 1988 om undtagelse
    fra Den Høje Myndigheds henstilling nr. 1/64 vedrørende toldbeskyttelse med
    henblik på at muliggøre anvendelse af de generelle toldpræferencer på visse
    jern- og stålprodukter med oprindelse i udviklingslandene (135. undtagelse)'
  type: main
- language: el
  script: Grek
  content: '88/544/ΕΚΑΧ: Απόφαση της Επιτροπής της 12ης
    Οκτωβρίου 1988 για παρέκκλιση από τη σύσταση
    αριθ. 1—64 της Ανωτάτης Αρχής όσον αφορά τη δασμολογική
    προστασία προκειμένου να επιτραπεί η εφαρμογή
    των γενικευμένων δασμολογικών προτιμήσεων
    σε ορισμένα προϊόντα της βιομηχανίας σιδήρου
    και χάλυβα που κατάγονται από αναπτυσσόμενες
    χώρες (135η παρέκκλιση)'
  type: main
- language: it
  script: Latn
  content: '88/544/CECA: Decisione della Commissione del 12 ottobre 1988 recante deroga
    alla raccomandazione n. 1-64 dell'' Alta Autorità relativa alla protezione tariffaria
    al fine di consentire l'' applicazione delle preferenze tariffarie generalizzate
    a taluni prodotti siderurgici originari dei paesi in via di sviluppo (135a deroga)'
  type: main
- language: nl
  script: Latn
  content: '88/544/EGKS: Beschikking van de Commissie van 12 oktober 1988 houdende
    afwijking van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende de tariefbescherming,
    ten einde voor bepaalde ijzer- en staalprodukten van oorsprong uit ontwikkelingslanden
    de toepassing van algemene tariefpreferenties mogelijk te maken (135e uitzonderingsbeschikking)'
  type: main
- language: pt
  script: Latn
  content: '88/544/CECA: Decisão da Comissão de 12 de Outubro de 1988 que derroga
    a Recomendação n.° 1-64 da Alta-Autoridade, relativa à protecção pautal,
    a fim de permitir a aplicação das preferências pautais generalizadas a certos
    produtos siderúrgicos originários dos países em vias de desenvolvimento (135
    derrogação)'
  type: main
- language: es
  script: Latn
  content: '88/544/CECA: Decisión de la Comisión de 12 de octubre de 1988 por la
