title:
- language: en
  script: Latn
  content: '82/502/EEC: Council Decision of 12 July 1982 authorizing the automatic
    renewal or continuance in force of certain friendship, trade and navigation treaties
    and similar agreements concluded between Member States and non-member countries'
  type: main
- language: fr
  script: Latn
  content: '82/502/CEE: Décision du Conseil, du 12 juillet 1982, autorisant la tacite
    reconduction ou le maintien en vigueur de certains traités d'' amitié, de commerce
    et de navigation et accords similaires conclus par les États membres avec les
    pays tiers'
  type: main
- language: de
  script: Latn
  content: '82/502/EWG: Entscheidung des Rates vom 12. Juli 1982 zur Genehmigung der
    stillschweigenden Verlängerung oder der Beibehaltung bestimmter Freundschafts-,
    Handels- und Schifffahrtsverträge sowie ähnlicher Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern'
  type: main
- language: da
  script: Latn
  content: '82/502/EØF: Rådets beslutning af 12. juli 1982 om bemyndigelse til stiltiende
    videreførelse eller opretholdelse af visse venskabs-, handels- og skibsfartstraktater
    og lignende aftaler, som medlemsstaterne har indgået med tredjelande'
  type: main
- language: el
  script: Grek
  content: '82/502/EOK: Απόφαση τού Συμβουλίου τής 12ης Ιουλίου
