    ή τής διατηρήσεως σέ ισχύ ορισμένων συνθηκών
    φιλίας, εμπορίου καί ναυτιλίας καί τών ομοειδών
    συμφωνιών τίς οποίες τά Κράτη μέλη έχουν συνάψει
    μέ τίς τρίτες χώρες'
  type: main
- language: it
  script: Latn
  content: '82/502/CEE: Decisione del Consiglio, del 12 luglio 1982, che autorizza
