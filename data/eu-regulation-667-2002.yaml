title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 667/2002 of 18 April 2002 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in April 2002 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 667/2002 de la Commission du 18 avril 2002 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 2002 pour les contingents tarifaires de viandes bovines prévus
    par le règlement (CE) n° 1279/98 pour la République de Pologne, la République
    de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 667/2002 der Kommission vom 18. April 2002 zur Bestimmung
