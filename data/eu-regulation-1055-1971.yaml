  content: Règlement (CEE) n° 1055/71 du Conseil, du 25 mai 1971, fixant, pour la
    campagne 1971/1972, les majorations mensuelles des prix des céréales et des
    farines, gruaux et semoules de froment ou de seigles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1055/71 des Rates vom 25. Mai 1971 zur Festsetzung
    der monatlichen Zuschläge zu den Preisen für Getreide und Mehl, Grütze und
    Grieß von Weizen oder Roggen für das Wirtschaftsjahr 1971/1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1055/71 del Consiglio, del 25 maggio 1971, che fissa,
    per la campagna 1971/1972, le maggiorazioni mensili dei prezzi dei cereali e delle
    farine, semole e semolini di frumento o di segala
  type: main
- language: nl
  script: Latn
