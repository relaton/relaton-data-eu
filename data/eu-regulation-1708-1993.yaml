    regime das restituições à exportação para os produtos agrícolas, no que
    respeita, nomeadamente, a determinados aspectos agromonetários
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1708/93 de la Comisión de 30 de junio de 1993 que
    modifica el Reglamento (CEE) n° 3665/87, por el que se establecen las modalidades
    comunes de aplicación del régimen de restituciones a la exportación para los
    productos agrícolas, en lo que respecta, principalmente, a determinados aspectos
    agromonetarios
