    αφορά ορισμένες γεωργονομισματικές πτυχές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1708/93 della Commissione del 30 giugno 1993 che modifica,
    con particolare riguardo ad alcuni aspetti agrimonetari, il regolamento (CEE)
    n. 3665/87 recante modalità comuni di applicazione del regime delle restituzioni
    all'esportazione per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) Nr. 1708/93 van de Commissie van 30 juni 1993 tot wijziging,
