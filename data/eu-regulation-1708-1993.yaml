    Ausfuhrerstattungen bei landwirtschaftlichen Erzeugnissen insbesondere hinsichtlich
    bestimmter agromonetärer Gesichtspunkte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1708/93 af 30. juni 1993 om ændring
