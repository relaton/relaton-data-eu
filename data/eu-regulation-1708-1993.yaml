    des restitutions à l'exportation pour les produits agricoles, en ce qui concerne
    notamment certains aspects agri-monétaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1708/93 der Kommission vom 30. Juni 1993 zur Änderung
