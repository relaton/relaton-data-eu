title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1624 of 20 September 2022
    amending Implementing Regulation (EU) 2018/607 imposing a definitive anti-dumping
    duty on imports of steel ropes and cables originating in the People’s Republic
    of China as extended to imports of steel ropes and cables consigned from Morocco
    and the Republic of Korea, whether declared as originating in these countries
    or not, following an expiry review pursuant to Article 11(2) of Regulation (EU)
    2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1624 de la Commission du 20 septembre
    2022 modifiant le règlement d’exécution (UE) 2018/607 instituant un droit
    antidumping définitif sur les importations de câbles en acier originaires de
    la République populaire de Chine, tel qu’étendu aux importations de câbles
    en acier expédiés du Maroc et de la République de Corée, qu’ils aient ou
    non été déclarés originaires de ces pays, à la suite d’un réexamen au
    titre de l’expiration des mesures conformément à l’article 11, paragraphe
    2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1624 der Kommission vom 20. September
    2022 zur Änderung der Durchführungsverordnung (EU) 2018/607 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Kabeln und Seilen aus
    Stahl mit Ursprung in der Volksrepublik China, ausgeweitet auf aus Marokko und
    der Republik Korea versandte Kabel und Seile aus Stahl, ob als Ursprungserzeugnisse
    aus diesen Ländern angemeldet oder nicht, im Anschluss an eine Auslaufüberprüfung
    nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036 des Europäischen Parlaments
    und des Rates
  type: main
