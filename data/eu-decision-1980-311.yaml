id: EUDecision1980311
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/311/EEC: Commission Decision of 28 February 1980 authorizing Ireland
    not to apply Community treatment to pyjamas and night dresses, knitted or crocheted,
    of cotton or of synthetic textile fibres, falling within heading No ex 60.04 of
    the Common Customs Tariff (categories 24 and 25), originating in Hong Kong and
    in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/311/CEE: Décision de la Commission, du 28 février 1980, autorisant
    l''Irlande à exclure du traitement communautaire les pyjamas et chemises de nuit
    de bonneterie, de coton ou de fibres textiles synthétiques, de la position ex
    60.04 du tarif douanier commun (catégories 24 et 25), originaires de Hong-kong
    et mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/311/EWG: Entscheidung der Kommission vom 28. Februar 1980, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schlafanzüge und Nachthemden aus Gewirken, aus
    Baumwolle oder aus synthetischen Spinnstoffen, der Tarifnummer ex 60.04 des Gemeinsamen
    Zolltarifs, Kategorien 24 und 25, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/311/EØF: Kommissionens beslutning af 28. februar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage pyjamas og anden natbeklædning
    af trikotage, af bomuld eller syntetiske fibre, som henhører under pos. ex 60.04
    i den fælles toldtarif (kategori 24 og 25), har oprindelse i Hongkong og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/311/CEE: Decisione della Commissione, del 28 febbraio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i pigiami e le camicie da
    notte a maglia, di cotone o di fibre tessili sintetiche, della voce n. ex 60.04
    della tariffa doganale comune (categorie 24 e 25), originari di Hong Kong e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/311/EEG: Beschikking van de Commissie van 28 februari 1980 waarbij
    Ierland wordt gemachtigd pyjama''s en nachthemden van brei- of haakwerk, van katoen
    of van synthetische textielvezels, van post ex 60.04 van het gemeenschappelijk
    douanetarief (categorieën 24 en 25), van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
