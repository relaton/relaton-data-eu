title:
- language: en
  script: Latn
  content: DECISION NO. 63 OF 5 JULY 1967 CONCERNING INTERPRETATION OF TRANSITIONAL
    PROVISIONS IN ARTICLE 6 OF REGULATION NO. 8/63/EEC IN THE EVENT OF DEATH AFTER
    THE ENTRY INTO FORCE OF THIS REGULATION, FROM THE CONSEQUENCES OF SCLEROGENOUS
    PNEUMOCONIOSIS WHERE BENEFITS WERE PAID BEFORE ITS ENTRY INTO FORCE
  type: main
- language: fr
  script: Latn
  content: DECISION NO. 63, DU 5 JUILLET 1967, CONCERNANT L' INTERPRETATION DES DISPOSITIONS
    TRANSITOIRES FIGURANT A L' ARTICLE 6 DU REGLEMENT NO. 8/63/CEE EN CAS DE DECES,
    APRES L' ENTREE EN VIGUEUR DE CE REGLEMENT, DES SUITES D' UNE PNEUMOCONIOSE SCLEROGENE
    INDEMNISEE AVANT SON ENTREE EN VIGUEUR.
  type: main
- language: de
  script: Latn
  content: '67/743/EWG: BESCHLUSS NR. 63 VOM 5. JULI 1967 ZUR AUSLEGUNG DER UEBERGANGSBESTIMMUNGEN
    DES ARTIKELS 6 DER VERORDNUNG NR. 8/63/EWG IN DEN FAELLEN, IN DENEN DER TOD NACH
    INKRAFTTRETEN DIESER VERORDNUNG INFOLGE EINER SKLEROGENEN PNEUMOKONIOSE EINGETRETEN
    IST, UND IN DENEN VOR INKRAFTTRETEN DIESER VERORDNUNG ENTSCHAEDIGUNGSLEISTUNGEN
    GEWAEHRT WURDEN'
  type: main
- language: it
  script: Latn
  content: '67/743/CEE: Decisione n. 63, del 5 luglio 1967, concernente l'' interpretazione
    delle disposizioni transitorie che figurano all'' articolo 6 del regolamento n.
    8/63/CEE in caso di morte, dopo l'' entrata in vigore di tale regolamento, per
    i postumi di una pneumoconiosi sclerogena indennizzata prima dell'' entrata in
    vigore del medesimo'
  type: main
- language: nl
  script: Latn
  content: '67/743/EEG: BESLUIT NO. 63 VAN 5 JULI 1967 BETREFFENDE DE INTERPRETATIE
    VAN DE OVERGANGSBEPALINGEN WELKE VOORKOMEN IN ARTIKEL 6 VAN VERORDENING NO. 8/63/EEG
    IN GEVAL VAN OVERLIJDEN NA HET IN WERKING TREDEN VAN DEZE VERORDENING, TEN GEVOLGE
    VAN EEN SLEROGENE PNEUMOCONIOSIS WAARVOOR UITKERING WERD BETAALD VOORDAT DE VERORDENING
    IN WERKING TRAD'
