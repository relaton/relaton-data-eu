    και παρόμοια πλεκτά, προϊόντα της κατηγορίας
    5 ( αύξων αριθμός 40.0050 ), και στα είδη κατηγορίας
    προϊόντων αριθ. 98 ( αύξων αριθμός 40.0980 ), καταγωγής
