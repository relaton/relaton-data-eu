title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2667/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to pullovers and similar knitted
    or crocheted, products of category No 5 (order No 40.0050), articles, products
    of category 98 (order No 40.0980) originating in India, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2667/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux chandails
    et similaires en bonneterie, de la catégorie de produits n° 5 (numéro d'ordre
    40.0050), et aux articles de la catégorie de produits n° 98 (numéro d'ordre
    40.0980), originaires de l'Inde, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2667/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer Pullover und aehnliche, aus Gewirken, der
    Warenkategorie Nr. 5 (laufende Nummer 40.0050) und fuer Artikel der Warenkategorie
    Nr. 98 (laufende Nummer 40.0980) mit Ursprung in Indien, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2667/90 af 17. september 1990 om genindførelse
    af opkrævning af toldafgifter for pullovere og lignende varer, af trikotage,
    under varekategori 5 (løbenummer 40.0050), og artikler under varekategori 98
    (løbenummer 40.0980), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
