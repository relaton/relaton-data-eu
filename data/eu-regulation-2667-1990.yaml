  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2667/90 DELLA COMMISSIONE del 17 settembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai pullover e simili a
    maglia della categoria di prodotti n. 5 (numero d'ordine 40.0050) e agli oggetti
    della categoria di prodotti n. 98 (numero d'ordine 40.0980) originari dell'India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3897/89
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2667/90 VAN DE COMMISSIE van 17 september 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op pullovers
    en dergelijke van brei- of haakwerk, van de categorie van produkten nr. 5 (volgnummer
    40.0050) en artikelen van de categorie van produkten nr. 98 (volgnummer 40.0980),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2667/90 DA COMISSAO de 17 de Setembro de 1990 que
