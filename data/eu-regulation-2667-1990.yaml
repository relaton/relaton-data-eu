    em malha, da categoria de produtos 5 (numero de ordem 40.0050) e aos artefactos,
    da categoria de produtos 98 (numero de ordem 40.0980), originarios da India, beneficiarios
    das preferências pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
