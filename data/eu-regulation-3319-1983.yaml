    της διακρίσεως 28.28 ex N του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3319/83 della Commissione del 24 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili agli ossidi di antimonio,
    della sottovoce 28.28 ex N della tariffa doganale comune, originari della Cina,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3319/83 van de Commissie van 24 november 1983 houdende
