title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3319/83 of 24 November 1983 re-establishing
    the levying of customs duties on antimony oxides, falling within subheading 28.28
    ex N and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3319/83 de la Commission du 24 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux oxydes d'
    antimoine, de la sous-position 28.28 ex N du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3319/83 der Kommission vom 24. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für Antimonoxide der Tarifstelle 28.28 ex N mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3319/83 af 24. november 1983 om genindførelse
    af opkrævning af told for antimonoxider, henhørende under pos. 28.28 ex N og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3319/83 της Επιτροπής
    της 24ης Νοεμβρίου 1983 περί αποκαταστάσεως της
