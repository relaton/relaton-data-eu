title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 219/91 of 30 January 1991 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held by
    certain intervention agencies and intended for export to Poland amending Regulation
    (EEC) No 569/88 and repealing Regulation (EEC) No 2722/90
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 219/91 DE LA COMMISSION du 30 janvier 1991 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) no 2539/84,
    de viandes bovines non désossées détenues par certains organismes d'' intervention
    et destinées à être exportées vers la Pologne, modifiant le règlement (CEE)
    no 569/88 et abrogeant le règlement (CEE) no 2722/90 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 219/91 DER KOMMISSION vom 30. Januar 1991 über den
    Verkauf von zur Ausfuhr nach Polen bestimmtem Rindfleisch mit Knochen aus Beständen
    einiger Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84,
    zur Änderung der Verordnung (EWG) Nr. 569/88 und zur Aufhebung der Verordnung
    (EWG) Nr. 2722/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 219/91 af 30. januar 1991 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af ikke-udbenet oksekød fra visse
    interventionsorganer med henblik på udførsel til Polen, om ændring af forordning
    (EØF) nr. 569/88 og om ophævelse af forordning (EØF) nr. 2722/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 219/91 της Επιτροπής
    της 30ής Ιανουαρίου 1991 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος με
    κόκαλα που κρατείται από ορισμένους οργανισμούς
    παρέμβασης και προορίζεται για εξαγωγή προς
    την Πολωνία καθώς και σχετικά με την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 569/88 και την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 2722/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 219/91 DELLA COMMISSIONE del 30 gennaio 1991 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine non disossate detenute da taluni organismi d'' intervento e destinate
    all'' esportazione verso la Polonia, che modifica il regolamento (CEE) n. 569/88
    e recante abrogazione del regolamento (CEE) n. 2722/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 219/91 VAN DE COMMISSIE van 30 januari 1991 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar Polen bestemd
    rundvlees met been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende
    intrekking van Verordening (EEG) nr. 2722/90 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 219/91 DA COMISSÃO de 30 de Janeiro de 1991 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) nº 2539/84, de
    carne de bovino não desossada detida por certos organismos de intervenção e
    destinada a ser exportada para a Polónia, que altera o Regulamento (CEE) nº
    569/88 e que revoga o Regulamento (CEE) nº 2722/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 219/91 DE LA COMISIÓN de 30 de enero de 1991 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno sin deshuesar en poder de determinados organismos de intervención
    y destinadas a ser exportadas a Polonia que modifica el Reglamento (CEE) no 569/88
    y deroga el Reglamento (CEE) no 2722/90 #'
