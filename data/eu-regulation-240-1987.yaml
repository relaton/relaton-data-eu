    de aanvullende regeling voor het handelsverkeer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 240/87 da Comissão de 27 de Janeiro de 1987 que
    altera o Regulamento (CEE) n.° 3832/86 da Comissão que estabelece a ultrapassagem,
    para 1986, da quantidade "objectivo" e do limite indicativo em relação à manteiga
    para as importações em Espanha no âmbito do mecanismo complementar das trocas
    comerciais (MCT)
  type: main
- language: es
