    (ΕΟΚ) αριθ. 3832/86 για υπέρβαση για το 1986 της ποσότητας
    «στόχος» και του ενδεικτικού ανώτατου ορίου
    για τις εισαγωγές βουτύρου στην Ισπανία στα
    πλαίσια του συμπληρωματικού μηχανισμού στις
    συναλλαγές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 240/87 della Commissione del 27 gennaio 1987 che modifica
    il regolamento (CEE) n. 3832/86 relativo al superamento, per il 1986, del quantitativo
    "obiettivo" e del massimale indicativo di burro per le importazioni in Spagna
    nell' ambito del meccanismo complementare applicabile agli scambi (MCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 240/87 van de Commissie van 27 januari 1987 tot wijziging
    van Verordening (EEG) nr. 3832/86 houdende overschrijding, voor 1986, van de streefhoeveelheid
