  content: Commission Regulation (EEC) No 240/87 of 27 January 1987 amending Regulation
    (EEC) No 3832/86 providing for the 'guide' quantity and the indicative ceiling
    for imports into Spain of butter under the supplementary trade mechanism to be
    exceeded
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 240/87 de la Commission du 27 janvier 1987 modifiant
    le règlement (CEE) n° 3832/86 portant dépassement pour 1986 de la quantité
    "objectif" et du plafond indicatif de beurre pour les importations en Espagne
    dans le cadre du mécanisme complémentaire aux échanges (MCE)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 240/87 der Kommission vom 27. Januar 1987 zur Änderung
    der Verordnung (EWG) Nr. 3832/86 zur Überschreitung der Zielmenge und des Richtplafonds
    des Jahres 1986 für die Einfuhr von Butter nach Spanien im Rahmen des ergänzenden
    Handelsmechanismus
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 240/87 af 27. januar 1987 om ændring
