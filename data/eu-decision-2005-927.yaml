    Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai ( ICTY )
    mandāta īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 21 d. Tarybos sprendimas 2005/927/BUSP, įgyvendinantis
