title:
- language: en
  script: Latn
  content: Council Decision 2005/927/CFSP of 21 December 2005 implementing Common
    Position 2004/694/CFSP on further measures in support of the effective implementation
    of the mandate of the International Criminal Tribunal for the former Yugoslavia
    (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2005/927/PESC du Conseil du 21 décembre 2005 mettant en œuvre
    la position commune 2004/694/PESC concernant de nouvelles mesures définies à
    l’appui d’une mise en œuvre effective du mandat du Tribunal pénal international
    pour l’ex-Yougoslavie (TPI)
  type: main
- language: de
  script: Latn
  content: Beschluss 2005/927/GASP des Rates vom 21. Dezember 2005 zur Durchführung
    des Gemeinsamen Standpunkts 2004/694/GASP betreffend weitere Maßnahmen zur Unterstützung
    der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs für
    das ehemalige Jugoslawien (ICTY)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2005/927/SZBP ze dne 21. prosince 2005 , kterým se provádí
    společný postoj 2004/694/SZBP o dalších opatřeních na podporu účinného
    provádění mandátu Mezinárodního trestního tribunálu pro bývalou Jugoslávii
    (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2005/927/FUSP af 21. december 2005 om gennemførelse
    af fælles holdning 2004/694/FUSP om yderligere foranstaltninger til støtte for
    den effektive gennemførelse af mandatet til Det Internationale Krigsforbrydertribunal
    vedrørende det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2005/927/ΚΕΠΠΑ του Συμβουλίου, της
    21ης Δεκεμβρίου 2005 , η οποία θέτει σε εφαρμογή
    την κοινή θέση 2004/694/ΚΕΠΠΑ για περαιτέρω μέτρα
    προς υποστήριξη της αποτελεσματικής εφαρμογής
    της εντολής του Διεθνούς Ποινικού Δικαστηρίου
    για την Πρώην Γιουγκοσλαβία (ICTY)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2005/927/ÜVJP, 21. detsember 2005 , ühise seisukoha 2004/694/ÜVJP
    (edasiste meetmete kohta, millega toetatakse endise Jugoslaavia asjade rahvusvahelise
    kriminaalkohtu (EJRK) volituste tõhusat rakendamist) rakendamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2005/927/YUTP, tehty 21 päivänä joulukuuta 2005
    , entisen Jugoslavian alueen kansainvälisen rikostuomioistuimen toimeksiannon
    tehokasta täytäntöönpanoa tukevista lisätoimenpiteistä hyväksytyn yhteisen
    kannan 2004/694/YUTP täytäntöönpanosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2005/927/KKBP határozata ( 2005. december 21. ) a volt Jugoszláviában
    elkövetett háborús bűncselekményeket vizsgáló Nemzetközi Törvényszék
    (ICTY) célkitűzései hatékony végrehajtásának támogatására irányuló
    további intézkedésekről szóló 2004/694/KKBP közös álláspont végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2005/927/PESC del Consiglio, del 21 dicembre 2005 , che applica
    la posizione comune 2004/694/PESC relativa ad ulteriori misure definite a sostegno
    dell’effettiva attuazione del mandato del tribunale penale internazionale per
    la ex Jugoslavia (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2005/927/KĀDP ( 2005. gada 21. decembris ), ar ko īsteno
