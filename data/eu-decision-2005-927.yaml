    Tarptautinio baudžiamojo tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/927/PESK tal- 21 ta' Diċembru 2005 implimentazzjoni
