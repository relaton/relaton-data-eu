    għall-implimentazzjoni effettiva tal-mandat tat-Tribunal Kriminali Internazzjonali
    għal dik li qabel kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Besluit 2005/927/GBVB van de Raad van 21 december 2005 tot uitvoering van
    Gemeenschappelijk Standpunt 2004/694/GBVB betreffende aanvullende maatregelen
    ter ondersteuning van de daadwerkelijke uitvoering van het mandaat van het Internationaal
    Straftribunaal voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2005/927/WPZiB z dnia 21 grudnia 2005 r. wprowadzająca w
    życie wspólne stanowisko 2004/694/WPZiB w sprawie dalszych środków wspierających
    skuteczne wykonanie mandatu Międzynarodowego Trybunału Karnego dla Byłej Jugosławii
    (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Decisão 2005/927/PESC do Conselho, de 21 de Dezembro de 2005 , que executa
    a Posição Comum 2004/694/PESC relativa a medidas adicionais de apoio ao exercício
    efectivo do mandato do Tribunal Penal Internacional para a ex-Jugoslávia (TPIJ)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2005/927/SZBP z 21. decembra 2005 , ktorým sa vykonáva
    spoločná pozícia 2004/694/SZBP o ďalších opatreniach na podporu efektívneho
    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2005/927/SZVP z dne 21. decembra 2005 o izvajanju Skupnega
    stališča 2004/694/SZVP o nadaljnjih ukrepih v podporo učinkovitemu izvajanju
    mandata Mednarodnega kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Decisión 2005/927/PESC del Consejo, de 21 de diciembre de 2005 , por la
