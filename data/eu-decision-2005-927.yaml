    la aplicación efectiva del mandato del Tribunal Penal Internacional para la ex
    Yugoslavia (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2005/927/GUSP av den 21 december 2005 om genomförande av
