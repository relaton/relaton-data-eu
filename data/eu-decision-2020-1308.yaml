title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1308 of 21 September 2020 determining,
    for a limited period of time, that the regulatory framework applicable to central
    counterparties in the United Kingdom of Great Britain and Northern Ireland is
    equivalent, in accordance with Regulation (EU) No 648/2012 of the European Parliament
    and of the Council (notified under document C(2020) 6539)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1308 de la Commission du 21 septembre
    2020 établissant, pour une période de temps limitée, que le cadre réglementaire
    applicable aux contreparties centrales au Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord est équivalent, conformément au règlement (UE) no 648/2012 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2020) 6539]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1308 der Kommission vom 21. September
    2020 zur Feststellung der Gleichwertigkeit des für zentrale Gegenparteien im
    Vereinigten Königreich Großbritannien und Nordirland geltenden Rechtsrahmens
    gemäß der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des
    Rates für einen begrenzten Zeitraum (Bekannt gegeben unter Aktenzeichen C(2020)
    6539)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2020/1308 на Комисията
    от 21 септември 2020 година за определяне в съответствие
    с Регламент (ЕС) № 648/2012 на Европейския парламент
    и на Съвета, че за ограничен период от време
    е налице еквивалентност на регулаторната уредба,
    приложима по отношение на централните контрагенти
    в Обединеното кралство Великобритания и Северна
    Ирландия (нотифицирано под номер C(2020) 6539)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1308 ze dne 21. září 2020,
    kterým se na omezenou dobu stanoví, že právní rámec použitelný na ústřední
    protistrany ve Spojeném království Velké Británie a Severního Irska je v
    souladu s nařízením Evropského parlamentu a Rady (EU) č. 648/2012 rovnocenný
    (oznámeno pod číslem C(2020) 6539)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/1308 af 21. september
    2020 om fastlæggelse af, at de reguleringsmæssige rammer, som finder anvendelse
    på centrale modparter i Det Forenede Kongerige Storbritannien og Nordirland,
    i en begrænset periode er ækvivalente i overensstemmelse med Europa-Parlamentets
    og Rådets forordning (EU) nr. 648/2012 (meddelt under nummer C(2020) 6539)
  type: main
- language: el
  script: Grek
  content: Eκτελεστική απόφαση (ΕΕ) 2020/1308 της Επιτροπής
