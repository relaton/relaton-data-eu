    Nagy-Britannia és Észak-Írország Egyesült Királyságában a központi szerződő
    felekre alkalmazandó szabályozási keretrendszer korlátozott idejű egyenértékűségének
    a megállapításáról (az értesítés a C(2020) 6539. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/1308 della Commissione del 21 settembre
    2020 che stabilisce, per un periodo di tempo limitato, che il quadro normativo
    applicabile alle controparti centrali del Regno Unito di Gran Bretagna e Irlanda
    del Nord è equivalente, in conformità del regolamento (UE) n. 648/2012 del Parlamento
    europeo e del Consiglio [notificata con il numero C(2020) 6539]
  type: main
- language: lv
  script: Latn
