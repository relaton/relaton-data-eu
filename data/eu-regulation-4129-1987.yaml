title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4129/87 of 9 December 1987 specifying the
    conditions for the inclusion of certain live animals of the domestic bovine species
    and certain meat of the bovine species under the combined nomenclature subheadings
    listed in Annex C to the Agreement between the European Economic Community and
    Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4129/87 de la Commission du 9 décembre 1987 déterminant
    les conditions d' admission dans les sous-positions de la nomenclature combinée,
    visées dans l' annexe C de l' accord entre la Communauté économique européenne
    et la Yougoslavie, de certains animaux vivants de l' espèce bovine domestique
    et de certaines viandes de l' espèce bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4129/87 der Kommission vom 9. Dezember 1987 zur Festlegung
    der Voraussetzungen für die Zulassung zu den Unterpositionen der Kombinierten
    Nomenklatur von bestimmten lebenden Hausrindern und bestimmtem Fleisch von Rindern,
    genannt im Anhang C des Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft
    und Jugoslawien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4129/87 af 9. december 1987 om fastsættelse
    af betingelserne for henførsel af visse levende husdyr (hornkvæg) og visse sorter
    kød af sådanne dyr under de underpositioner i Den Kombinerede Nomenklatur, der
    er omhandlet i bilag C til Aftalen mellem Det Europæiske Økonomiske Fællesskab
    og Jugoslavien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4129/87 της Επιτροπής
