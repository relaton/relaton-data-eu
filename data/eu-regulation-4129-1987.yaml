    Iugoslavia, di taluni animali vivi della specie bovina domestica e di talune carni
    della specie bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4129/87 van de Commissie van 9 december 1987 tot
    vaststelling van de voorwaarden en bepalingen voor indeling van bepaalde levende
    runderen (huisdieren) en van bepaalde soorten vlees van runderen onder de onderverdelingen
    van de gecombineerde nomenclatuur, bedoeld in bijlage C van de Overeenkomst tussen
    de Europese Economische Gemeenschap en Joegoslavië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4129/87 da Comissão de 9 de Dezembro de 1987 que
