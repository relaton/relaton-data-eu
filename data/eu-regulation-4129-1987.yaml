    ονοματολογίας, που αναφέρονται στο παράρτημα
    Γ της συμφωνίας μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της Γιουγκοσλαβίας, ορισμένων
    ζώντων κατοικιδίων βοοειδών και ορισμένων
    βοείων κρεάτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4129/87 della Commissione del 9 dicembre 1987 che
