title:
- language: en
  script: Latn
  content: '71/270/EEC: Commission Decision of 5 July 1971 authorizing the French
    Republic, the Italian Republic, the Grand-Duchy of Luxembourg and the Kingdom
    of the Netherlands to approve for marketing forest reproductive material of Larix
    leptolepis (Sieb. and Zucc.) Gord., satisfying less stringent requirements (Only
    the French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '71/270/CEE: Décision de la Commission, du 5 juillet 1971, autorisant
    le Royaume de Belgique, la République française, la République italienne, le
    Grand-Duché de Luxembourg et le Royaume des Pays-Bas à admettre à la commercialisation
    des matériels forestiers de reproduction de Larix leptolepis (Sieb. et Zucc.)
    Gord. soumis à des exigences réduites (Les textes en langues française, italienne
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '71/270/EWG: Entscheidung der Kommission vom 5. Juli 1971 über die Ermächtigung
    des Königreichs Belgien, der Französischen Republik, der Italienischen Republik,
    des Großherzogtums Luxemburg und des Königreichs der Niederlande, forstliches
    Vermehrungsgut von Larix leptolepis (Sieb. et Zucc.) Gord. mit minderen Anforderungen
    zum Verkehr zuzulassen (Nur der französische, italienische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '71/270/EØF: Kommissionens beslutning af 5. juli 1971 om bemyndigelse
    af kongeriget Belgien, Den franske Republik, Den italienske Republik, storhertugdømmet
    Luxembourg og kongeriget Nederlandene, til at tillade handel med forstligt formeringsmateriale
    af Larix leptolepis (Sieb. og Zucc.) Gord., der opfylder mindre strenge krav (Kun
    den franske, italienske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '71/270/CEE: Decisione della Commissione, del 5 luglio 1971, che autorizza
    il Regno del Belgio, la Repubblica francese, la Repubblica italiana, il Granducato
    del Lussemburgo e il Regno dei Paesi Bassi ad ammettere la commercializzazione
    dei materiali forestali di moltiplicazione di Larix leptolepis (Sieb. e Zucc.)
    Gord. soggetti a requisiti ridotti (I testi in lingua francese, italiana e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '71/270/EEG: Beschikking van de Commissie van 5 juli 1971 tot machtiging
    van het Koninkrijk België, de Franse Republiek, de Italiaanse Republiek, het
    Groothertogdom Luxemburg en het Koninkrijk der Nederlanden om bosbouwkundig teeltmateriaal
    van Larix leptolepis (Sieb. en Zucc.) Gord., waaraan minder strenge eisen zijn
    gesteld, tot de handel toe te laten (Slechts de teksten in de Franse, Italiaanse
    en de Nederlandse taal zijn authentiek)'
