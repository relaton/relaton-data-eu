    clementine, tangerini ed altri ibridi similari di agrumi in provenienza dalla
    Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2855/71 van de Commissie van 29 december 1971 houdende
    instelling van een compenserende heffing bij invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Turkije
