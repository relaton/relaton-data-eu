type: standard
title:
- language: en
  script: Latn
  content: '83/150/EEC: Commission Decision of 29 March 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of gloves, mittens and
    mitts, knitted or crocheted, products of category 10, originating in Malaysia,
    Thailand and the Philippines, which have been put into free circulation in the
    Community and which may be the subject of protective measures under Article 115
    of the Treaty (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/150/CEE: Décision de la Commission du 29 mars 1983 autorisant la République
    française à procéder à une surveillance intracommunautaire des importations
    des gants de bonneterie de la catégorie 10, originaires de Malaisie, de Thaïlande
    et des Philippines et mis en libre pratique dans la Communauté, susceptibles
    de faire l''objet de mesures de protection au titre de l''article 115 du traité
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/150/EWG: Entscheidung der Kommission vom 29. März 1983 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren der aus Malaysia, aus Thailand und aus den Philippinen stammenden
    und in der Gemeinschaft im freien Verkehr befindlichen Handschuhe aus Gewirken,
    der Kategorie 10, für die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    ergriffen werden können (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/150/EØF: Kommissionens beslutning af 29. marts 1983 om bemyndigelse
    af Den franske Republik til at foretage tilsyn inden for Fællesskabet med indførsel
    af handsker, vanter og luffer af trikotage henhørende under kategori 10, der
    har oprindelse i Malaysia, Thailand og Filippinerne og er overgået til fri omsætning
    i Fællesskabet, og som kan gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/150/ΕΟΚ: Απόφαση της Επιτροπής της 29ης
    Μαρτίου 1983 περί χορηγήσεως αδείας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών χειροκτίων πλεκτών της κατηγορίας
    10 καταγωγής Μαλαισίας, Ταϋλάνδης και Φιλιππίνων
    τα οποία τίθενται σε ελεύθερη κυκλοφορία στην
    Κοινότητα και τα οποία μπορούν να αποτελέσουν
    αντικείμενο των μέτρων προστασίας, δυνάμει
    του άρθρου 115 της συνθήκης (Το κείμενο στην
    γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/150/CEE: Decisione della Commissione del 29 marzo 1983 che autorizza
    la Repubblica francese a procedere ad una sorveglianza intracomunitaria delle
    importazioni di guanti a maglia della categoria 10, originari della Malesia, della
    Tailandia e delle Filippine e messi in libera pratica nella Comunità, che possono
    essere oggetto di misure di protezione ai sensi dell''articolo 115 del trattato
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/150/EEG: Beschikking van de Commissie van 29 maart 1983 houdende machtiging
    van de Franse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van handschoenen, wanten en dergelijke artikelen, van brei-
    of haakwerk, van oorsprong uit Maleisië, Thailand en de Filippijnen die in de
    Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het EEG-Verdrag (Slechts
    de tekst in de Franse taal is authentiek)'
