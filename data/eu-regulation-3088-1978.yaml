    mercato e il prezzo d' entrata dell' olio d' oliva, nonché la percentuale dell'
    aiuto al consumo di cui all' articolo 11, paragrafo 3, del regolamento n. 136/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3088/78 van de Raad van 19 december 1978 houdende
