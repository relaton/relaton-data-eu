  content: Council Regulation (EEC) No 3088/78 of 19 December 1978 fixing for the
    1978/79 marketing year the market representative price and the threshold price
    for olive oil and the percentage of the consumption aid referred to in Article
    11 (3) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3088/78 du Conseil, du 19 décembre 1978, fixant,
    pour la campagne de commercialisation 1978/1979, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive, ainsi que le pourcentage de l' aide
    à la consommation visé à l' article 11 paragraphe 3 du règlement n° 136/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3088/78 des Rates vom 19. Dezember 1978 zur Festsetzung
    des repräsentativen Marktpreises und des Schwellenpreises für Olivenöl sowie
    des in Artikel 11 Absatz 3 der Verordnung Nr. 136/66/EWG vorgesehenen Prozentsatzes
    der Verbrauchsbeihilfe für das Wirtschaftsjahr 1978/79
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3088/78 af 19. december 1978 om fastsættelse
    for produktionsåret 1978/79 af den repræsentative markedspris og tærskelprisen
    for olivenolie, samt den procentdel af forbrugsstøtten, der er nævnt i artikel
    11. stk. 3, i forordning nr. 136/66/EØF
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3088/78 del Consiglio, del 19 dicembre 1978, che fissa,
