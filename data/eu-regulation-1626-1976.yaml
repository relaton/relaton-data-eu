title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1626/76 of 5 July 1976 re-establishing the
    levying of the customs duties on heavy oils, falling within subheadings 27.10
    C I c), C II c) and C III c) and d), originating in Venezuela, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1626/76 de la Commission, du 5 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 C I c), C II c), C III c)
    et d), originaires du Venezuela, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1626/76 der Kommission vom 5. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), C II c), C III c)
    und d) mit Ursprung in Venezuela, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1626/76 af 5. juli 1976 om genindførelse
    af opkrævning af toldafgifter for tunge olier, under underpositionerne 27.10
    C I c), C II c), C III c) og d), som har oprindelse i Venezuela og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75 af
    17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1626/76 della Commissione, del 5 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli oli pesanti delle
    sottovoci doganali n. 27.10 C I c), C II c), C III c), d), originari del Venezuela
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75
    del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1626/76 van de Commissie van 5 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zware oliën,
    van onderverdelingen 27.10 C I c), C II c), C III c), d), van oorsprong uit Venezuela,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
