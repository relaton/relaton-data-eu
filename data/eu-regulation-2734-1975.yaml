  content: Regulation (EEC) No 2734/75 of the Council of 29 October 1975 fixing standard
    qualities for certain cereals and categories of flour, groats and meal and the
    rules for fixing the threshold prices of these categories of products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2734/75 du Conseil, du 29 octobre 1975, déterminant
