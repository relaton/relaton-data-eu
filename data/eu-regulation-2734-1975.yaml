    Feingrieß sowie der Regeln für die Festsetzung der Schwellenpreise dieser Arten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2734/75 af 29. oktober 1975 om fastsættelse
