title:
- language: en
  script: Latn
  content: '84/189/EEC: Commission Decision of 2 April 1984 accepting an undertaking
    in connection with the anti-dumping proceeding concerning imports of standardized
    multi-phase electric motors having an output of more than 0,75 kW but not more
    than 75 kW, originating in the Soviet Union'
  type: main
- language: fr
  script: Latn
  content: '84/189/CEE: Décision de la Commission du 2 avril 1984 portant acceptation
    de l'' engagement offert dans le cadre de la procédure anti-dumping concernant
    les importations de moteurs électriques polyphasés normalisés d'' une puissance
    de plus de 0,75 à 75 kilowatts inclus, originaires d'' Union Soviétique'
  type: main
- language: de
  script: Latn
  content: '84/189/EWG: Beschluß der Kommission vom 2. April 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    standardisierter Mehrphasen-Wechselstrommotoren mit einer Leistung von mehr als
    0,75 bis 75 kW mit Ursprung in der Sowjetunion'
  type: main
- language: da
  script: Latn
  content: '84/189/EØF: Kommissionens afgørelse af 2. april 1984 om godtagelsen
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af standardiserede
    elektriske motorer, flerfasede, med effekt på over 0,75 kW, men højst 75 kW,
    med oprindelse i Sovjetunionen'
  type: main
- language: el
  script: Grek
  content: '84/189/ΕΟΚ: Απόφαση της Επιτροπής της 2ας Απριλίου
    1984 για την αποδοχή υποχρέωσης που έχει αναληφθεί
    στο πλαίσιο διαδικασίας αντιντάμπινγκ σχετικά
    με τις εισαγωγές τυποποιημένων πολυφασικών
    ηλεκτρικών κινητήρων με ισχύ μεγαλύτερη από
    0,75 μέχρι και 75 κιλοβάτ, που κατάγονται από τη
    Σοβιετική Ένωση'
  type: main
- language: it
  script: Latn
  content: '84/189/CEE: Decisione della Commissione del 2 aprile 1984 che accetta
    un impegno assunto nell'' ambito della procedura antidumping relativa alle importazioni
    di motori elettrici polifase normalizzati, di potenza superiore a 0,75 kW ed inferiore
    o pari a 75 kW, originari dell'' Unione Sovietica'
  type: main
- language: nl
  script: Latn
  content: '84/189/EEG: Besluit van de Commissie van 2 april 1984 tot aanvaarding
    van de in verband met de anti-dumpingprocedure betreffende de invoer van gestandaardiseerde
    meerfasige elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75
    kW, van oorsprong uit de Sovjetunie, aangeboden verbintenis'
  type: main
