title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 551/90 of 2 March 1990 abolishing the corrective
    amount on the import of artichokes into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 551/90 de la Commission, du 2 mars 1990, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix d'artichauts en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 551/90 der Kommission vom 2. März 1990 zur Aufhebung
    des bei der Einfuhr von Artischocken aus Spanien (mit Ausnahme der Kanarischen
    Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 551/90 af 2. marts 1990 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af artiskokker
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 551/90 της Επιτροπής
    της 2ας Μαρτίου 1990 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή
    στην Κοινότητα των Δέκα αγγιναρών από την Ισπανία,
    εκτός των Καναρίων Νήσων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 551/90 della Commissione, del 2 marzo 1990, che sopprime
    l'importo correttore da riscuotere all'importazione nella Comunità a dieci di
    carciofi in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 551/90 van de Commissie van 2 maart 1990 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van artisjokken
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 551/90 da Comissão, de 2 de Março de 1990, que
