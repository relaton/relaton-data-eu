title:
- language: en
  script: Latn
  content: '1999/344/EC: Commission Decision of 25 May 1999 amending Decision 97/365/EC
    on drawing up provisional lists of third country establishments from which the
    Member States authorise imports of products prepared from meat of bovine animals,
    swine, equidae and sheep and goats (notified under document number C(1999) 1374)'
  type: main
- language: fr
  script: Latn
  content: '1999/344/CE: Décision de la Commission, du 25 mai 1999, modifiant la
    décision 97/365/CE établissant les listes provisoires d''établissements de
    pays tiers en provenance desquels les États membres autorisent l''importation
    de produits à base de viande des espèces bovine, porcine, des équidés, des
    ovins et des caprins [notifiée sous le numéro C(1999) 1374]'
  type: main
- language: de
  script: Latn
  content: '1999/344/EG: Entscheidung der Kommission vom 25. Mai 1999 zur Änderung
    der Entscheidung 97/365/EG zur Aufstellung der vorläufigen Listen der Drittlandsbetriebe,
