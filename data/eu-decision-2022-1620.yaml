title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1620 of 19 September 2022 laying
    down model contingency measures for cases of technical impossibility to access
    data at the external borders, including fall-back procedures to be followed by
    border authorities pursuant to Article 48(4) of Regulation (EU) 2018/1240 of the
    European Parliament and the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1620 de la Commission du 19 septembre
    2022 établissant des mesures d’urgence types pour les cas d’impossibilité
    technique d’accéder aux données aux frontières extérieures, y compris les
    procédures de secours que les autorités frontalières doivent suivre en vertu
    de l’article 48, paragraphe 4, du règlement (UE) 2018/1240 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
