    Rates durch technische Regulierungsstandards zur Festlegung der Bedingungen und
    Indikatoren, anhand deren die EBA feststellt, ob außergewöhnliche Umstände
    im Sinne von Artikel 325az Absatz 5 und Artikel 325bf Absatz 6 der genannten Verordnung
    vorliegen
  type: main
