  script: Latn
  content: Commission Delegated Regulation (EU) 2025/789 of 23 April 2025 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the conditions and indicators
    that the EBA is to use to determine whether extraordinary circumstances in the
    sense of Article 325az(5) and Article 325bf(6) of that Regulation have occurred
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/789 de la Commission du 23 avril 2025 complétant
    le règlement (UE) no 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les conditions et les indicateurs que
    l’ABE doit utiliser pour déterminer si des circonstances exceptionnelles au
    sens de l’article 325 terquinquagies, paragraphe 5, et de l’article 325 novoquinquagies,
    paragraphe 6, dudit règlement sont survenues
  type: main
