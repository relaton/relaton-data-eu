  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1390/84 della Commissione, del 17 maggio 1984, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità
    e recante abrogazione del regolamento (CEE) n. 689/84
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1390/84 van de Commissie van 17 mei 1984 inzake de
