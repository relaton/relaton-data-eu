  content: Commission Regulation (EEC) No 1390/84 of 17 May 1984 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 689/84
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1390/84 de la Commission, du 17 mai 1984, relatif à
    la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 689/84
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1390/84 der Kommission vom 17. Mai 1984 über den
    Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der Gemeinschaft
    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung der
    Verordnung (EWG) Nr. 689/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1390/84 af 17. maj 1984 om salg til
    forudfastsatte priser af visse former for oksekød fra interventionslagrene med
    henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 689/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1390/84 της Επιτροπής
    της 17ης Μαΐου 1984 περί πωλήσεως, με κατ' αποκοπή
    τιμή καθοριζόμενη εκ των προτέρων, εν όψει
    της μεταποιήσεώς τους εντός της Κοινότητας,
    ορισμένων βοείων κρεάτων που προέρχονται από
    αποθέματα οργανισμών παρεμβάσεως και περί
