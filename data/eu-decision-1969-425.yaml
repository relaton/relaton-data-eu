title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 novembre 1969, modifiant les décisions
    de la Commission relatives aux modalités d'application de la décision de la
    Commission, du 30 octobre 1969, autorisant la République fédérale d'Allemagne
    à prendre des mesures de sauvegarde dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: '69/425/EWG: Entscheidung der Kommission vom 24. November 1969 zur Änderung
    der Entscheidungen der Kommission mit Durchführungsbestimmungen zur Entscheidung
    der Kommission vom 30. Oktober 1969 betreffend die Ermächtigung der Bundesrepublik
    Deutschland zur Ergreifung von Schutzmaßnahmen für die deutsche Landwirtschaft'
  type: main
- language: it
  script: Latn
  content: '69/425/CEE: Decisione della Commissione, del 24 novembre 1969, che modifica
    le decisioni della Commissione relative alle modalità d''applicazione della decisione
    della Commissione, del 30 ottobre 1969, che autorizza la Repubblica federale di
    Germania ad adottare misure di salvaguardia nel settore agricolo'
  type: main
- language: nl
  script: Latn
