title:
- language: en
  script: Latn
  content: '96/562/EC: Commission Decision of 30 April 1996 enjoining the Kingdom
    of Spain to provide the necessary information in order to prove definitively that
    aid was granted under an existing aid scheme (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/562/CE: Décision de la Commission du 30 avril 1996 enjoignant au Royaume
    d''Espagne de fournir des informations attestant de manière irréfutable que
    les aides accordées à Ponsal l''ont été dans le cadre d''un régime d''aides
    existant (Le texte en langue espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/562/EG: Entscheidung der Kommission vom 30. April 1996 zur Aufforderung
    des Königreichs Spanien zur Vorlage der für den endgültigen Beweis notwendigen
    Informationen, daß die Beihilfe aufgrund einer bestehenden Beihilferegelung gewährt
    wurde (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/562/EF: Kommissionens beslutning af 30. april 1996 om at pålægge
    Spanien at fremlægge de nødvendige oplysninger til endelig dokumentation for,
    at støtten er ydet i henhold til en gældende støtteordning (Kun den spanske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/562/ΕΚ: Απόφαση της Επιτροπής της 30ής Απριλίου
    1996 με την οποία επιβάλλεται στο Βασίλειο της
    Ισπανίας να παράσχει τις πληροφορίες που απαιτούνται
    προκειμένου να αποδειχθεί οριστικά ότι η ενίσχυση
    προς την Ponsal χορηγήθηκε στο πλαίσιο ενός υφιστάμενου
    καθεστώτος ενισχύσεων (Το κείμενο στην ισπανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/562/EY: Komission päätös, tehty 30 päivänä huhtikuuta 1996, Espanjan
    kuningaskunnalle osoitetusta pyynnöstä toimittaa tarvittavat tiedot tuen myöntämisestä
    olemassa olevan tukiohjelman perusteella (Ainoastaan espanjankielinen teksti on
    todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/562/CE: Decisione della Commissione del 30 aprile 1996 che ingiunge
    al Regno di Spagna a presentare le informazioni necessarie a dimostrare in maniera
    irrefutabile che l''aiuto all''impresa Ponsal è stato concesso nell''ambito di
    un regime di aiuti esistenti (Il testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/562/EG: Beschikking van de Commissie van 30 april 1996 waarbij het
    Koninkrijk Spanje wordt gelast de nodige informatie te verstrekken waaruit ondubbelzinnig
    blijkt dat de steun aan Ponsal in het raam van een bestaande steunregeling is
    verleend (Slechts de tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/562/CE: Decisão da Comissão de 30 de Abril de 1996 que solicita ao
    Reino de Espanha que transmita as informações convenientes que confirmem definitivamente
    que os auxílios à Ponsal foram concedidos no âmbito de um regime de auxílios
    existente (Apenas faz fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '96/562/CE: Decisión de la Comisión de 30 de abril de 1996 por la que
