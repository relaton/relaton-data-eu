title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1254/81 of 11 May 1981 reintroducing the
    levying of customs duties applicable to oxalic acid and its salts and esters,
    falling under subheading 29.15 A I, originating in China and benefiting from the
    tariff preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1254/81 de la Commission, du 11 mai 1981, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    oxalique, ses sels et ses esters de la sous-position 29.15 A I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1254/81 der Kommission vom 11. Mai 1981 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester, der Tarifstelle
    29.15 A I, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3322/80
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1254/81 af 11. maj 1981 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf, henhørende under
    pos. 29.15 A I og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1254/81 τής Επιτροπής
    τής 11ης Μαΐου 1981 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά οξαλικόν οξύ, άλατα καί εστέρες
    αυτού, τής δασμολογικής διακρίσεως 29. 15 Α Ι,
    καταγωγής Κίνας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1254/81 della Commissione, dell' 11 maggio 1981, che
    ripristina la riscossione dei dazi doganali applicabili all' acido ossalico, suoi
    sali e suoi esteri, della sottovoce 29.15 A I della tariffa doganale comune, originari
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1254/81 van de Commissie van 11 mei 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op oxaalzuur,
    alsmede zouten en esters daarvan, van postonderverdeling 29.15 A I, van oorsprong
    uit China waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
