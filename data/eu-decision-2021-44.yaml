  script: Latn
  content: Commission Implementing Decision (EU) 2021/44 of 19 January 2021 as regards
    the authorisation for Italy to continue to use certain approximate estimates for
    the calculation of the VAT own resources base in respect of transport of passengers
    until the end of 2024 (notified under document C(2021) 71) (Only the Italian text
    is authentic)
  type: main
- language: fr
  script: Latn
