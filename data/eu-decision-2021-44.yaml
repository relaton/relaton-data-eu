    la fin de 2024, certaines estimations approximatives aux fins du calcul de la
    base des ressources propres provenant de la taxe sur la valeur ajoutée pour le
    transport de personnes [notifiée sous le numéro C(2021) 71] (Le texte en langue
    italienne est le seul faisant foi.)
