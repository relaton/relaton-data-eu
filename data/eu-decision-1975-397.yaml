title:
- language: en
  script: Latn
  content: '75/397/EEC: Commission Decision of 17 June 1975 on the aids granted by
    the Belgian Government pursuant to the Law of 17 July 1959 introducing and coordinating
    measures to encourage economic expansion and the creation of new industries (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '75/397/CEE: Décision de la Commission, du 17 juin 1975, concernant les
    aides accordées par le gouvernement belge en application de la loi belge, du
    17 juillet 1959, instaurant et coordonnant des mesures en vue de favoriser l''expansion
    économique et la création d''industries nouvelles (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '75/397/EWG: Entscheidung der Kommission vom 17. Juni 1975 über die von
    der belgischen Regierung in Anwendung des belgischen Gesetzes vom 17. Juli 1959
    über die Einführung und Koordinierung von Maßnahmen zur Förderung der wirtschaflichen
    Expansion und zur Schaffung neuer Industrien gewährten Beihilfen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '75/397/EØF: Kommissionens Beslutning af 17. juni 1975 om støtte ydet
    af den belgiske regering i medfør af den belgiske lov af 17. juli 1959 om indførelse
    og samordning af foranstaltninger til fremme af den økonomiske ekspansion og
    opbygning af nye industrier (Kun de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
