id: EURegulation2702002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 270/2002 of 14 February 2002 amending Regulation
    (EC) No 999/2001 of the European Parliament and of the Council as regards specified
    risk material and epidemio-surveillance for transmissible spongiform encephalopathies
    and amending Regulation (EC) No 1326/2001 as regards animal feeding and the placing
    on the market of ovine and caprine animals and products thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 270/2002 de la Commission du 14 février 2002 modifiant,
    d'une part, le règlement (CE) n° 999/2001 du Parlement européen et du Conseil
    en ce qui concerne les matériels à risque spécifiés et la surveillance épidémiologique
    des encéphalopathies spongiformes transmissibles et, d'autre part, le règlement
    (CE) n° 1326/2001 en ce qui concerne l'alimentation des animaux et la mise sur
    le marché des ovins et des caprins et des produits qui en sont dérivés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 270/2002 der Kommission vom 14. Februar 2002 zur Änderung
    der Verordnung (EG) Nr. 999/2001 des Europäischen Parlaments und des Rates in
    Bezug auf spezifizierte Risikomaterialien und die epidemiologische Überwachung
    auf bestimmte transmissible spongiforme Enzephalopathien sowie zur Änderung der
    Verordnung (EG) Nr. 1326/2001 in Bezug auf Futtermittel und das Inverkehrbringen
    von Schafen und Ziegen sowie daraus gewonnenen Produkten
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 270/2002 на Комисията от 14 февруари
    2002 година за изменение на Регламент (EО) № 999/2001
    на Европейския парламент и на Съвета по отношение
    на специфичния рисков материал и епидемиологичния
    надзор за трансмисивни спонгиформни енцефалопатии
    и на Регламент (EО) № 1326/2001 относно храненето
    на животните и пускането на пазара на овце
    и кози и продукти от тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 270/2002 ze dne 14. února 2002, kterým se
    mění nařízení Evropského parlamentu a Rady (ES) č. 999/2001, pokud jde
    o specifikovaný rizikový materiál a epidemiologický dozor u přenosných spongiformních
    encefalopatií, a kterým se mění nařízení (ES) č. 1326/2001, pokud jde
    o krmení zvířat a uvádění ovcí a koz a produktů z nich na trh
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 270/2002 af 14. februar 2002 om ændring
    af Europa-Parlamentets og Rådets forordning (EF) nr. 999/2001 for så vidt angår
    specificeret risikomateriale og epidemiologisk overvågning af transmissible spongiforme
    encephalopatier og om ændring af forordning (EF) nr. 1326/2001 for så vidt angår
    foder og markedsføring af får og geder samt produkter heraf
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 270/2002 της Επιτροπής,
    της 14ης Φεβρουαρίου 2002, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 999/2001 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    το ειδικό υλικό κινδύνου και την επιδημιολογική
    παρακολούθηση των μεταδοτικών σπογγωδών εγκεφαλοπαθειών
    και την τροποποίηση του κανονισμού (ΕΚ) αριθ.
    1326/2001 όσον αφορά τις ζωοτροφές και τη διάθεση
    στην αγορά αιγοπροβάτων και των προϊόντων
    τους
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 270/2002, 14. veebruar 2002, millega muudetakse
    Euroopa Parlamendi ja nõukogu määrust (EÜ) nr 999/2001 transmissiivse spongioosse
    entsefalopaatia määratletud riskiteguriga materjali ja epidemioloogilise seire
    osas ning määrust (EÜ) nr 1326/2001 loomasöötade ning lammaste ja kitsede
    ning nendest valmistatud toodete turuleviimise osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 270/2002, annettu 14 päivänä helmikuuta 2002,
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 999/2001 muuttamisesta tiettyjen
    tarttuvien spongiformisten enkefalopatioiden ehkäisyä, valvontaa ja hävittämistä
    koskevien sääntöjen osalta ja asetuksen (EY) N:o 1326/2001 muuttamisesta siltä
    osin kuin asia koskee eläinten ruokintaa sekä lampaitten ja vuohien ja niistä
    saatujen tuotteitten saattamista markkinoille
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 270/2002 od 14. veljače 2002. o izmjeni Uredbe
    (EZ) br. 999/2001 Europskog parlamenta i Vijeća u pogledu specificiranog rizičnog
    materijala i epidemiološkoga nadzora transmisivnih spongiformnih encefalopatija
    te Uredbe (EZ) br. 1326/2001 u pogledu hranidbe životinja i stavljanja ovaca
    i koza i njihovih proizvoda na tržište
  type: main
- language: hu
  script: Latn
  content: A Bizottság 270/2002/EK rendelete (2002. február 14.) a 999/2001/EK európai
    parlamenti és tanácsi rendeletnek a meghatározott veszélyes anyagok tekintetében
    és a fertőző szivacsos agyvelőbántalmak járványügyi megfigyelése tekintetében
    történő módosításáról, valamint az 1326/2001/EK rendeletnek az állatok
    takarmányozása, továbbá a juhok, kecskék és termékeik forgalomba hozatala
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 270/2002 della Commissione, del 14 febbraio 2002, che
    modifica il regolamento (CE) n. 999/2001 del Parlamento europeo e del Consiglio
    per quanto riguarda i materiali a rischio specifico e la sorveglianza epidemiologica
    delle encefalopatie spongiformi trasmissibili, nonché il regolamento (CE) n.
    1326/2001 riguardo all'alimentazione degli animali e all'immissione sul mercato
    di ovini e caprini e dei loro prodotti
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 270/2002 (2002. gada 14. februāris), ar ko groza
    Eiropas Parlamenta un Padomes Regulu (EK) Nr. 999/2001 attiecībā uz īpašu
    riska materiālu un transmisīvo sūkļveida encefalopātiju epidemioloģisko
    uzraudzību un ar ko groza Regulu (EK) Nr. 1326/2001 attiecībā uz dzīvnieku
    barību un aitu un kazu, un to produktu laišanu tirgū
  type: main
- language: lt
  script: Latn
  content: 2002 m. vasario 14 d. Komisijos reglamentas (EB) Nr. 270/2002, iš dalies
    keičiantis Europos Parlamento ir Tarybos reglamentą (EB) Nr. 999/2001 dėl nurodytos
    pavojingos medžiagos ir užkrečiamųjų spongiforminių encefalopatijų epidemiologinės
    priežiūros ir iš dalies keičiantis Reglamentą (EB) Nr. 1326/2001 dėl gyvūnų
    šėrimo ir avių, ožkų bei jų produktų pateikimo į rinką
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 270/2002 ta’ l-14 ta’ Frar 2002
    li jemenda r-Regolament (KE) Nru 999/2001 tal-Parlament Ewropew u tal-Kunsill
    f'dak li jirrigwarda materjal speċifikat ta’ riskju u sorveljanza ta’ l-epidemiji
    għal enċifalopatiji sponġiformi trasmissibbli u li jemenda r-Regolament (KE)
    Nru 1326/2001 f'dak li jirrigwarda l-għalf ta’ l-annimali u t-tqegħid fis-suq
    ta’ annimali ovini u kaprini u l-prodotti tagħhom
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 270/2002 van de Commissie van 14 februari 2002 tot
    wĳziging van Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad
    wat betreft gespecificeerd risicomateriaal en epizoötiebewaking ten aanzien van
    overdraagbare spongiforme encefalopathieën en tot wĳziging van Verordening (EG)
    nr. 1326/2001 wat betreft diervoeding en het in de handel brengen van schapen
    en geiten en producten daarvan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 270/2002 z dnia 14 lutego 2002 r. zmieniające
    rozporządzenie (WE) nr 999/2001 Parlamentu Europejskiego i Rady w odniesieniu
    do materiałów określonego ryzyka oraz nadzoru epidemiologicznego dotyczącego
    przenośnych gąbczastych encefalopatii oraz zmieniające rozporządzenie (WE)
    nr 1326/2001 w odniesieniu do żywienia zwierząt i wprowadzania do obrotu owiec
    i kóz oraz produktów od nich pochodzących
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 270/2002 da Comissão, de 14 de Fevereiro de 2002,
    que altera o Regulamento (CE) n.° 999/2001 do Parlamento Europeu e do Conselho
    no que se refere a matérias de risco especificadas e à vigilância epidemiológica
    de encefalopatias espongiformes transmissíveis e o Regulamento (CE) n.° 1326/2001
    no que se refere à alimentação para animais e à colocação no mercado de
    ovinos e caprinos e de produtos derivados
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 270/2002 al Comisiei din 14 februarie 2002 de modificare,
    pe de o parte, a Regulamentului (CE) nr. 999/2001 al Parlamentului European și
    al Consiliului în ceea ce privește materialele cu risc specificate și supravegherea
    epidemiologică a encefalopatiilor spongiforme transmisibile și, pe de altă
    parte, a Regulamentului (CE) nr. 1326/2001 în ceea ce privește nutriția animalelor
    și introducerea pe piață a ovinelor și caprinelor și a produselor derivate
    din acestea
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 270/2002 zo 14. februára 2002, ktorým sa
    mení a dopĺňa nariadenie Európskeho parlamentu a Rady (ES) č. 999/2001, pokiaľ
    ide o špecifikovaný rizikový materiál a epidemiologický dohľad nad prenosnými
    hubovitými encefalopatiami a meniace, a ktorým sa mení a dopĺňa nariadenie
    (ES) č. 1326/2001, pokiaľ ide o krmivo zvierat a uvedenie na trh oviec a kôz
    a produktov z nich
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 270/2002 z dne 14. februarja 2002 o spremembi
    Uredbe (ES) št. 999/2001 Evropskega parlamenta in Sveta o snoveh s specifičnim
    tveganjem in epidemiološkem nadzoru transmisivnih spongiformnih encefalopatij
    ter o spremembi Uredbe (ES) št. 1326/2001 o krmljenju živali in dajanju ovc,
    koz in njihovih proizvodov na trg
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 270/2002 de la Comisión, de 14 de febrero de 2002,
    por el que se modifican el Reglamento (CE) n° 999/2001 del Parlamento Europeo
    y del Consejo en lo referente a los materiales especificados de riesgo y al control
    epidemiológico de las encefalopatías espongiformes transmisibles y el Reglamento
    (CE) n° 1326/2001 en lo referente a la alimentación animal y a la comercialización
    de animales de las especies ovina y caprina y sus productos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 270/2002 av den 14 februari 2002 om ändring
    av Europaparlamentets och rådets förordning (EG) nr 999/2001 när det gäller
    specificerat riskmaterial och epidemiologisk övervakning av transmissibel spongiform
    encefalopati samt om ändring av förordning (EG) nr 1326/2001 när det gäller
    foder och avyttring av får och getter och produkter av dessa
  type: main
