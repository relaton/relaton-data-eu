title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2381/91 of 29 July 1991 amending, for the second
    time, Regulation (EEC) No 3926/90 fixing, for certain fish stocks and groups of
    fish stocks, the total allowable catches for 1991 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2381/91 DU CONSEIL du 29 juillet 1991 modifiant pour
    la deuxième fois le règlement (CEE) no 3926/90 fixant, pour certains stocks
    ou groupes de stocks de poissons, les totaux admissibles des captures pour 1991
    et certaines conditions dans lesquelles ils peuvent être pêchés #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2381/91 DES RATES vom 29. Juli 1991 zur zweiten Änderung
    der Verordnung (EWG) Nr. 3926/90 über die zulässigen Gesamtfangmengen und über
    Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen für 1991 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2381/91 af 29. juli 1991 om anden ændring
    af forordning (EØF) nr. 3926/90 om fastsættelse for 1991 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande i Fællesskabets
    fiskerizone samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2381/91 του Συμβουλίου
    της 29ης Ιουλίου 1991 για την τροποποίηση, για
    δεύτερη φορά, του κανονισμού (ΕΟΚ) αριθ. 3926/90
    περί καθορισμού, για ορισμένα αποθέματα ιχθύων
    ή ομάδες αποθεμάτων ιχθύων, του συνόλου επιτρεπομένων
    αλιευμάτων για το 1991 και ορισμένων όρων υπό
    τους οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2381/91 DEL CONSIGLIO del 29 luglio 1991 recante
    seconda modifica del regolamento (CEE) n. 3926/90 che stabilisce, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale delle catture ammesse per il 1991 e
    talune condizioni cui è soggetta la pesca di detto totale #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2381/91 VAN DE RAAD van 29 juli 1991 houdende tweede
    wijziging van Verordening (EEG) nr. 3926/90 inzake de vaststelling van de voor
    1991 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2381/91 DO CONSELHO de 29 de Julho de 1991 que altera
    pela segunda vez o Regulamento (CEE) no 3926/90 que fixa, relativamente a certas
    unidades populacionais (stocks) ou grupos de unidades populacionais de peixes,
    os totais admissíveis de capturas para 1991 e certas condições em que podem
    ser pescados #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2381/91 DEL CONSEJO de 29 de julio de 1991 que modifica
    por segunda vez el Reglamento (CEE) no 3926/90, por el que se fijan, para determinadas
    poblaciones o grupos de poblaciones de peces, los totales admisibles de capturas
    para 1991 y determinadas condiciones en las que pueden pescarse #'
  type: main
