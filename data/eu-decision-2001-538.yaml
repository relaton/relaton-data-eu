  script: Latn
  content: '2001/538/EC: Commission Decision of 16 July 2001 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries to take account of the animal health
    situation in Uruguay (notified under document number C(2001) 2205)'
  type: main
- language: fr
  script: Latn
