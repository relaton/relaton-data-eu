    1999/467/ES o določitvi čred govedi, uradno prostih bruceloze oziroma uradno
    prostih tuberkuloze v nekaterih državah članicah ali območjih držav članic
    (notificirano pod dokumentarno številko K(2000) 3133)
  type: main
