title:
- language: en
  script: Latn
  content: '2000/694/EC: Commission Decision of 27 October 2000 amending for the third
    time Decisions 1999/466/EC and 1999/467/EC establishing respectively the officially
    brucellosis-free and tuberculosis-free status of bovine herds of certain Member
    States or regions of Member States (notified under document number C(2000) 3133)'
  type: main
- language: fr
  script: Latn
  content: '2000/694/CE: Décision de la Commission du 27 octobre 2000 modifiant pour
    la troisième fois les décisions 1999/466/CE et 1999/467/CE établissant respectivement
    le statut de troupeau officiellement indemne de brucellose et le statut de troupeau
    officiellement indemne de tuberculose dans certains États membres ou régions
    d''États membres [notifiée sous le numéro C(2000) 3133]'
  type: main
- language: de
  script: Latn
  content: '2000/694/EG: Entscheidung der Kommission vom 27. Oktober 2000 zur dritten
    Änderung der Entscheidungen 1999/466/EG und 1999/467/EG über die amtliche Anerkennung
    der Brucellosefreiheit bzw. Tuberkulosefreiheit von Rinderbeständen bestimmter
    Mitgliedstaaten und Regionen von Mitgliedstaaten (Bekannt gegeben unter Aktenzeichen
    K(2000) 3133)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 27. října 2000, kterým se potřetí mění
    rozhodnutí 1999/466/ES a 1999/467/ES, kterými se stádům skotu některých
    členských států nebo regionů členských států uděluje status stád úředně
    prostých brucelózy a status stád úředně prostých tuberkulózy (oznámeno
    pod číslem K(2000) 3133)
  type: main
- language: da
  script: Latn
  content: '2000/694/EF: Kommissionens beslutning af 27. oktober 2000 om tredje ændring
    af beslutning 1999/466/EF og 1999/467/EF om fastlæggelse af kvægbesætningernes
    status i visse medlemsstater eller regioner i medlemsstater som henholdsvis officielt
    brucellosefri og officielt tuberkulosefri (meddelt under nummer K(2000) 3133)'
  type: main
- language: el
  script: Grek
  content: '2000/694/ΕΚ: Απόφαση της Επιτροπής, της 27ης
    Οκτωβρίου 2000, περί τροποποιήσεως, για τρίτη
    φορά, των αποφάσεων 1999/466/ΕΚ και 1999/467/ΕΚ που
    θεσπίζουν αντιστοίχως καθεστώτα επισήμως
    απαλλαγμένων από τη βρουκέλλωση και από τη
    φυματίωση αγελών βοοειδών σε ορισμένα κράτη
    μέλη ή περιφέρειες κρατών μελών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 3133]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 27. oktoober 2000, millega muudetakse kolmandat korda
    otsuseid 1999/466/EÜ ja 1999/467/EÜ, millega vastavalt kehtestatakse teatavate
    liikmesriikide ja liikmesriikide piirkondade veisekarjade ametlikult brutselloosivaba
    või ametlikult tuberkuloosivaba staatus (teatavaks tehtud numbri K(2000) 3133
    all)
  type: main
- language: fi
  script: Latn
  content: '2000/694/EY: Komission päätös, tehty 27 päivänä lokakuuta 2000,
    nautakarjojen virallisesti luomistaudista vapaan ja virallisesti tuberkuloosista
    vapaan aseman vahvistamisesta tiettyjen jäsenvaltioiden tai jäsenvaltioiden
    alueiden osalta tehtyjen päätösten 1999/466/EY ja 1999/467/EY muuttamisesta
    kolmannen kerran (tiedoksiannettu numerolla K(2000) 3133)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. október 27.) egyes tagállamok vagy a
    tagállamok egyes régiói szarvasmarha-állományainak hivatalosan brucellózismentes,
    illetőleg gümőkórmentes státusa megállapításáról szóló 1999/466/EK,
    illetőleg 1999/467/EK határozat harmadik alkalommal történő módosításáról
    (az értesítés a C(2000) 3133. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2000/694/CE: Decisione della Commissione, del 27 ottobre 2000, che modifica
    per la terza volta le decisioni 1999/466/CE e 1999/467/CE, che stabiliscono rispettivamente
    la qualifica di ufficialmente indenne da brucellosi e da tubercolosi per gli allevamenti
    di bovini di alcuni Stati membri o regioni di Stati membri [notificata con il
    numero C(2000) 3133]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2000. gada 27. oktobris), ar kuru trešo reizi groza
    Lēmumus 1999/466/EK un 1999/467/EK, ar kuriem attiecīgi nosaka oficiāli no
    brucelozes un tuberkulozes brīvu statusu dažu dalībvalstu vai dalībvalstu
    reģionu liellopu ganāmpulkiem (paziņots ar dokumenta numuru C(2000) 3133)
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 27 d. Komisijos sprendimas, trečią kartą iš dalies keičiantis
    Sprendimus 1999/466/EB ir 1999/467/EB, atitinkamai nustatančius tam tikrų valstybių
    narių arba valstybių narių regionų oficialiai bruceliozės ir tuberkuliozės
    neapimtų galvijų bandų statusą (pranešta dokumentu Nr. C(2000) 3133)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-27 ta’ Ottubru 2000 li temenda għat-tielet
    darba d-Deċiżjonijiet 1999/466/KE u 1999/467/KE li jistabbilixxu rispettivament
    l-istatus ta’ uffiċjalment ħieles mill-bruċellosi u t-tuberkulosi ghall-merħliet
    bovini ta’ ċerti Stati Membri jew reġjuni ta’ Stati Membri (notifikat taħt
    id-dokument numru Ċ(2000) 3133)
  type: main
- language: nl
  script: Latn
  content: '2000/694/EG: Beschikking van de Commissie van 27 oktober 2000 tot derde
    wijziging van de Beschikkingen 1999/466/EG en 1999/467/EG houdende erkenning van
    de rundveebeslagen in bepaalde lidstaten of regio''s van lidstaten als officieel
    brucellosevrij, respectievelijk officieel tuberculosevrij (kennisgeving geschied
    onder nummer C(2000) 3133)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 27 października 2000 r. zmieniająca po raz trzeci
