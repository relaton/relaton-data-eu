    odpowiednio od brucelozy i gruźlicy dla stad w niektórych Państwach Członkowskich
    lub regionach Państw Członkowskich (notyfikowana jako dokument nr C (2000) 3133)
  type: main
- language: pt
  script: Latn
  content: '2000/694/CE: Decisão da Comissão, de 27 de Outubro de 2000, que altera,
    pela terceira vez, as Decisões 1999/466/CE e 1999/467/CE que estabelecem, respectivamente,
    o estatuto de efectivo bovino oficialmente indemne de brucelose e de tuberculose
    em determinados Estados-Membros e regiões dos Estados-Membros [notificada com
    o número C(2000) 3133]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 27. októbra 2000, ktoré mení a dopĺňa po tretíkrát
    rozhodnutia 1999/466/ES a 1999/467/ES zavádzajúce oficiálny status stád hovädzieho
    dobytka bez brucelózy alebo bez tuberkulózy v niektorých členských štátoch
    alebo regiónoch členských štátov (oznámené pod dokumentačným číslom
    C(2000) 3133)
  type: main
- language: sl
  script: Latn
