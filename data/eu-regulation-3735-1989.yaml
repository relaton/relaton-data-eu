title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3735/89 of 13 December 1989 re-establishing
    the levying of customs duties on men's or boys'woven overcoats, rain- and other
    coats, cloaks and capes, of wool, of cotton or man-made textile fibres (other
    than parkas of category 21), products of category 14 (order No 40.0140), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3735/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux pardessus,
    imperméables et autres manteaux, y compris les capes, tissés, pour hommes ou
    garçonnets, de laine, de coton ou de fibres synthétiques ou artificielles (autres
    que parkas de la catégorie de produits n° 21) de la catégorie de produits n°
    14 (numéro d'ordre 40.0140), originaires de l'Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3735/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
    des Zollsatzes fuer Maentel und Umhaenge, fuer Maenner und Knaben, aus Gewebe,
    aus Wolle, Baumwolle oder synthetischen oder kuenstlichen Spinnstoffen (ausgenommen
    Parkas der Kategorie 21) der Warenkategorie Nr. 14 (lfd. Nr. 40.0140) mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3735/89 af 13. december 1989 om genindførelse
    af opkrævning af toldafgifter for frakker, kapper og slag, vævede, til mænd
    og drenge, af uld, bomuld eller syntetiske eller regenererede fibre, borset fra
    parkacoats under kategori nr. 21, under varekategori nr. 14 (løbenummer 40.0140),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3735/89 της Επιτροπής
    της 13ης Δεκεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για πανωφόρια
    τύπου παρντεσού, αδιάβροχα και άλλα πανωφόρια
    στα οποία συμπεριλαμβάνονται και οι κάπες,
    υφασμένα για άντρες ή αγόρια, από μαλλί, βαμβάκι
    ή συνθετικές ή τεχνητές ίνες, με εξαίρεση τα
    παρκάς της κατηγορίας 21, προϊόντα της κατηγορίας
    14 ( αύξων αριθμός 40.0140 ), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3735/89 DELLA COMMISSIONE del 13 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai cappotti, soprabiti,
    mantelli e simili tessuti, per uomo o per ragazzo, di lana, di cotone o di fibre
    sintetiche o artificiali (esclusi gli eskimo della categoria 21) della categoria
    di prodotti n. 14 (numero d'ordine 40.0140) originari dell'India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3735/89 VAN DE COMMISSIE van 13 december 1989 houdende
