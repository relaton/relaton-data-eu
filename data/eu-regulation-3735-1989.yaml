    regenjassen en capes voor heren en jongens, geweven, van wol, van katoen, of van
    synthetische of van kunstmatige vezels (andere dan parka'' s van categorie 21),
    van de categorie van produkten nr. 14 (volgnummer 40.0140), van oorsprong uit
