    a los gabanes, impermeables y demas abrigos, incluidas las capas, de tejido, para
    hombres o ninos, de lana, de algodon o de fibras sintéticas o artificiales (distintas
    de las parkas de la categoria 21) de la categoria de productos no 14 (numero de
    orden 40.0140) originarios de la India beneficiaria de las preferencias arancelarias
