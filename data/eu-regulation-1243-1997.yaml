  content: Commission Regulation (EC) No 1243/97 of 30 June 1997 amending Regulation
    (EC) No 1424/95 temporarily adapting the special arrangements for imports of certain
    products in the beef and veal product group originating in Switzerland and the
    Republics of Bosnia-Herzegovina, Croatia and Slovenia and the former Yugoslav
    Republic of Macedonia with the view to the implementation of the Agreement on
    Agriculture concluded during the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1243/97 de la Commission du 30 juin 1997 modifiant
    le règlement (CE) n° 1424/95 relatif à l'adaptation transitoire des régimes
    spécifiques à l'importation de certains produits du secteur de la viande bovine
    originaires de Suisse et des Républiques de Bosnie-Herzégovine, de Croatie,
    de Slovénie et de l'ancienne République yougoslave de Macédoine en vue de la
    mise en oeuvre de l'accord sur l'agriculture conclu dans le cadre des négociations
    du cycle d'Uruguay
  type: main
- language: de
  script: Latn
