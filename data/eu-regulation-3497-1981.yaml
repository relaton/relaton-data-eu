    aus Poly (p-phenylenterephthalamid), zum Herstellen von Reifen oder von Waren,
    die zum Herstellen von Reifen verwendet werden, der Tarifstelle ex 51.01 A des
    Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
