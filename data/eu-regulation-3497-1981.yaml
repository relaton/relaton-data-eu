    des fils de poly(p-phénylène téréphtalamide), destinés à être utilisés
    dans la fabrication de pneumatiques ou de produits utilisés dans la fabrication
    de pneumatiques, de la sous-position ex 51.01 A du tarif douanier commun
  type: main
