  content: Council Regulation (EEC) No 3497/81 of 3 December 1981 opening, allocating
    and providing for the administration of a Community tariff quota for yarn of poly
    (p-phenyleneterephthalamide for use in the manufacture of tyres or of products
    used in the manufacture of tyres, falling within subheading ex 51.01 A of the
    Common Customs Tariff
  type: main
- language: fr
  script: Latn
