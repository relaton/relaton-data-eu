title:
- language: en
  script: Latn
  content: 'Twentieth Council Directive 85/361/EEC of 16 July 1985 on the harmonization
    of the laws of the Member States relating to turnover taxes - Common system of
    value added tax: derogations in connection with the special aids granted to certain
    farmers to compensate for the dismantlement of monetary compensatory amounts applying
    to certain agricultural products'
  type: main
- language: fr
  script: Latn
  content: 'Vingtième directive 85/361/CEE du Conseil du 16 juillet 1985 en matière
    d''harmonisation des législations des États membres relatives aux taxes sur
    le chiffre d''affaires - Système commun de taxe sur la valeur ajoutée: dérogations
    relatives aux aides spéciales accordées à certains agriculteurs en compensation
    du démantèlement des montants compensatoires monétaires applicables à certains
    produits agricoles'
  type: main
- language: de
  script: Latn
  content: 'Zwanzigste Richtlinie 85/361/EWG des Rates vom 16. Juli 1985 zur Harmonisierung
    der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern - gemeinsames
    Mehrwertsteuersystem: Ausnahmeregelung im Zusammenhang mit den Sonderbeihilfen,
    die bestimmten Landwirten als Ausgleich für den Abbau der Währungsausgleichsbeträge
    für bestimmte landwirtschaftliche Erzeugnisse gewährt werden'
  type: main
- language: da
  script: Latn
  content: 'Rådets tyvende direktiv 85/361/EØF af 16. juli 1985 om harmonisering
    af medlemsstaternes lovgivning om omsætningsafgifter - Det fælles merværdiafgiftssystem:
    undtagelser i forbindelse med den særstøtte, der ydes til visse landbrugere
    som kompensation for afviklingen af de monetære udligningsbeløb for visse landbrugsprodukter'
  type: main
- language: el
  script: Grek
  content: 'Εικοστή οδηγία 85/361/ΕΟΚ του Συμβουλίου
    της 16ης Ιουλίου 1985 όσον αφορά την εναρμόνιση
    των νομοθεσιών των κρατών μελών σχετικά με
    τους φόρους κύκλου εργασιών — κοινό σύστημα
    φόρου προστιθέμενης αξίας: παρεκκλίσεις όσον
    αφορά τις ειδικές ενισχύσεις που χορηγούνται
    σε ορισμένους γεωργούς ως αντιστάθμιση για
    την κατάργηση των νομισματικών εξισωτικών
    ποσών που εφαρμόζονται σε ορισμένα γεωργικά
    προϊόντα'
  type: main
- language: it
  script: Latn
  content: 'Ventesima direttiva 85/361/CEE del Consiglio del 16 luglio 1985 in materia
    di armonizzazione delle legislazioni degli Stati Membri relative alle imposte
    sulla cifra d''affari - Sistema comune di imposta sul valore aggiunto: deroghe
    relative agli aiuti speciali corrisposti ad alcuni agricoltori a titolo di compensazione
    per lo smantellamento degli importi compensativi monetari applicabili a taluni
    prodotti agricoli'
  type: main
- language: nl
  script: Latn
  content: 'Twintigste Richtlijn 85/361/EEG van de Raad van 16 juli 1985 betreffende
