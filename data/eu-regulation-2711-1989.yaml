title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2711/89 of 7 September 1989 re-establishing
    the levying of customs duties on singlets, underparts and pyjamas, other than
    knitted or crocheted, products of category No 18 (order No 40.0180) originating
    in Brazil to which the preferential tariff arrangements of Council Regulation
    (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2711/89 de la Commission du 7 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux gilets de
    corps, slips, pyjamas, autres qu'en bonneterie, de la catégorie de produits n°
    18 (numéro d'ordre 40.0180) originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2711/89 DER KOMMISSION vom 7. September 1989 zur
    Wiedereinführung des Zollsatzes für Unterhemden, Slips und Schlafanzüge, andere
    als aus Gewirken, der Warenkategorie Nr. 18 (lfd. Nr. 40.0180) mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
