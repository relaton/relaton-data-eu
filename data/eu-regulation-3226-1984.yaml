title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3226/84 of 19 November 1984 re-establishing
    the levying of customs duties on certain cotton yarn not put up for retail sale,
    products of category 1a (code 0014), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3226/84 de la Commission du 19 novembre 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    fils de coton non conditionnés pour la vente au détail, de la catégorie 1 a)
    (code 0014), originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3226/84 der Kommission vom 19. November 1984 über
    die Wiedereinführung des Zollsatzes für bestimmte Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 1 a) (Kennziffer 0014) mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3226/84 af 19. november 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte garn af bomuld, ikke i detailsalgsoplægninger
    under varekategori nr. 1 a) (kode 0014), som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3226/84 της Επιτροπής
    της 19ης Νοεμβρίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα νήματα
    εκ βάμβακος μη συνεσκευασμένα διά την λιανικήν
    πώλησιν, προϊόντα της κατηγορίας 1α (κωδικός
    αριθμός 0014), καταγωγής Ταϋλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3226/84 della Commissione del 19 novembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili a taluni filati di cotone
    non preparati per la vendita al minuto, della categoria di prodotti n. 1 a (codice
    0014), originari della Tailandia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3226/84 van de Commissie van 19 november 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    garens van katoen, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 1 a) (codenummer 0014), van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3570/83
    van de Raad
