title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1045/2003 of 18 June 2003 derogating from
    Regulation (EC) No 708/98 on the taking over of paddy rice by the intervention
    agencies and fixing the corrective amounts and the price increases and reductions
    to be applied as regards the time limit for delivery into intervention for the
    2002/03 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1045/2003 de la Commission du 18 juin 2003 dérogeant
    au règlement (CE) n° 708/98 relatif à la prise en charge du riz paddy par les
    organismes d'intervention et fixant les montants correcteurs ainsi que les bonifications
    et les réfactions à appliquer, en ce qui concerne le délai de livraison à
    l'intervention pour la campagne 2002/2003
  type: main
- language: de
  script: Latn
