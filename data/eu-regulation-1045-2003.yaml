    a cargo do arroz paddy pelos organismos de intervenção e que fixa os montantes
    correctores, as bonificações e as depreciações a aplicar por estes organismos,
    no que diz respeito ao período de entrega à intervenção a título da campanha
    de 2002/2003
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1045/2003 de la Comisión, de 18 de junio de 2003,
    por el que se introduce una excepción en el Reglamento (CE) n° 708/98 relativo
    a la aceptación del arroz con cáscara por los organismos de intervención y
    por el que se fijan los importes correctores, las bonificaciones y los descuentos
