type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1436/80 of 5 June 1980 re-establishing the
    levying of customs duties on wood (including blocks, strips and friezes for parquet
    or wood block flooring, not assembled), planed, tongued, grooved, rebated, chamfered,
    V-jointed, centre V-jointed, beaded, centre-beaded or the like, but not further
    manufactured, falling within heading No 44.13 and originating in Brazil, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1436/80 de la Commission, du 5 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux bois (y
    compris les lames ou frises pour parquets, non assemblées) rabotés, rainés,
    bouvetés, languetés, feuillurés, chanfreinés ou similaires, de la position
    44.13 du tarif douanier commun, originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1436/80 der Kommission vom 5. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Holz (einschließlich Stäbe oder Friese für Parkett, nicht
    zusammengesetzt), gehobelt, genutet, gefedert, gekehlt, gefalzt, abgeschrägt
    oder in ähnlicher Weise bearbeitet, der Tarifnummer 44.13 mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1436/80 af 5. juni 1980 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet (herunder ikke-sammensatte parketstaver) under position
    44.13, som har oprindelse i Brasilien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1436/80 della Commissione, del 5 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, con incastri semplici, con limbelli, con smussature
    o similmente lavorato, comprese le liste e le tavolette (parchetti) per pavimenti,
    non riunite, della voce 44.13 della tariffa doganale comune, originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1436/80 van de Commissie van 5 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op hout (niet
    ineengezette plankjes voor parketvloeren daaronder begrepen), geschaafd, geploegd
    of van sponningen voorzien, afgeschuind of op dergelijke wijze bewerkt, van post
    44.13, van oorsprong uit Brazilië, ten behoeve waarvan bij Verordening (EEG)
    nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
