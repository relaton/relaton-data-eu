    vuoden 1993 neljäntenä vuosineljänneksenä saatavilla olevien määrien vahvistamisesta
    maitoalalla annetun asetuksen (ETY) N:o 2357/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2658/93 DELLA COMMISSIONE del 29 settembre 1993 recante
    modifica del regolamento (CEE) n. 584/92, che stabilisce le modalità d' applicazione,
    nel settore lattiero-caseario, del regime previsto dagli accordi intermedi di
    associazione tra la Comunità e la Polonia, l' Ungheria e la Cecoslovacchia, nonché
    del regolamento (CEE) n. 2357/93, che stabilisce il quantitativo disponibile per
    il quarto trimestre 1993 per taluni prodotti del settore lattiero-caseario nel
    quadro del regime previsto dagli accordi interinali conclusi dalla Comunità con
    la Repubblica di Polonia, la Repubblica di Ungheria e l' ex Repubblica federativa
    Ceca e Slovacca
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2658/93 VAN DE COMMISSIE van 29 september 1993 tot
    wijziging van Verordening (EEG) nr. 584/92 houdende bepalingen voor de uitvoer
    in de sector melk en zuivelprodukten, van de regeling waarin is voorzien bij de
    Interimovereenkomsten tussen, enerzijds, de Gemeenschap en, anderzijds, respectievelijk
    de Republiek Polen, de Republiek Hongarije en de Tsjechische en Slowaakse Federatieve
    Republiek, alsmede van Verordening (EEG) nr. 2357/93 tot vaststelling, voor bepaalde
    produkten van de sector melk en zuivelprodukten, van de hoeveelheid die voor het
    vierde kwartaal 1993 beschikbaar is in het kader van de genoemde Interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2658/93 DA COMISSÃO de 29 de Setembro de 1993 que
    altera o Regulamento (CEE) nº 584/92, que estabelece as normas de execução
    do regime aplicável no sector do leite e dos produtos lácteos, previsto nos
    acordos provisórios de associação concluídos pela Comunidade com a República
    da Polónia, a República da Hungria e a República Federativa Checa e Eslovaca,
    e o Regulamento (CEE) nº 2357/93, que determina a quantidade disponível, para
    o quarto trimestre de 1993, relativamente a certos produtos do sector do leite
    e dos produtos lácteos no âmbito dos referidos acordos provisórios
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2658/93 DE LA COMISIÓN de 29 de septiembre de 1993
    por el que se modifica el Reglamento (CEE) nº 584/92 por el que se establecen
    las normas de aplicación en el sector de la leche y de los productos lácteos
    del régimen previsto en los Acuerdos interinos de asociación celebrados entre
    la Comunidad y la República de Polonia, la República Federativa Checa y Eslovaca
    y la República de Hungría y el Reglamento (CEE) nº 2357/93 por el que se determina
    la cantidad disponible para el cuarto trimestre de 1993 de algunos productos del
    sector de la leche y de los productos lácteos en el marco del régimen establecido
    en dichos Acuerdos interinos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 2658/93 av den 29 september 1993 om
    ändring av förordning (EEG) nr 584/92 om tillämpningsföreskrifter gällande
    mjölk och mjölkprodukter för importordningen i interimsavtalen mellan gemenskapen
    å ena sidan och Polen, Ungern och Tjeckoslovakien å andra sidan och av förordning
    (EEG) nr 2357/93 om fastställande av de kvantiteter av vissa kategorier av mjölk
    och mjölkprodukter som är tillgängliga för fjärde kvartalet 1993 enligt bestämmelserna
    i interimsavtalen
