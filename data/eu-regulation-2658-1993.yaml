title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2658/93 of 29 September 1993 amending Regulation
    (EEC) No 584/92 laying down detailed rules for the application to milk and milk
    products of the arrangements provided for in the Interim Agreements between the
    Community and the Republic of Poland, the Republic of Hungary and the Czech and
    Slovak Federal Republic and Regulation (EEC) No 2357/93 determining the quantities
    of certain categories of milk and milk products available for the fourth quarter
    of 1993 under the arrangements provided for in the Interim Agreements
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2658/93 de la Commission du 29 septembre 1993 modifiant
    le règlement (CEE) n° 584/92 établissant les modalités d'application, dans
    le secteur du lait et des produits laitiers, du régime prévu dans les accords
    intérimaires d'association entre la Communauté et la République de Pologne,
    la République de Hongrie et la République fédérative tchèque et slovaque
    ainsi que le règlement (CEE) n° 2357/93 déterminant la quantité disponible
    pour le quatrième trimestre de 1993 dans le secteur du lait en vertu desdits
    accords intérimaires
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2658/93 DER KOMMISSION vom 29. September 1993 zur
    Änderung der Verordnung (EWG) Nr. 584/92 zur Festlegung der den Sektor Milch
    und Milcherzeugnisse betreffenden Durchführungsbestimmungen zu der Regelung im
    Rahmen der von der Gemeinschaft mit der Republik Polen, der Republik Ungarn und
    der Tschechischen und Slowakischen Föderativen Republik geschlossenen Interimsabkommen
    sowie zur Änderung der Verordnung (EWG) Nr. 2357/93 zur Festsetzung der Menge
    Milch und Milcherzeugnisse, die im vierten Vierteljahr 1993 gemäß den vorgenannten
    Interimsabkommen zur Verfügung stehen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2658/93 af 29. september 1993 om ændring
    af forordning (EØF) nr. 584/92 om gennemførelsesbestemmelser for anvendelse
    i sektoren for mælk og mejeriprodukter af den ordning, der er fastsat i de interimsaftaler,
    som Fællesskabet har indgået med Republikken Polen, Den Tjekkiske og Slovakiske
    Føderative Republik og Republikken Ungarn, og ændring af forordning (EØF) nr.
    2357/93 om fastsættelse af den disponible mængde for fjerde kvartal af 1993
    i sektoren for mælk og mejeriprodukter i henhold til nævnte interimsaftaler
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2658/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Σεπτεμβρίου 1993 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 584/92 για τον καθορισμό
    των λεπτομερειών εφαρμογής, στον τομέα του
