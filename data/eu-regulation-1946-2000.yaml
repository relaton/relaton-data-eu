    keskeyttämisestä ja käsiteltävänä olevien vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1946/2000 della Commissione, del 14 settembre 2000,
