title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1789/94 of 20 July 1994 determining the extent
    to which applications lodged in July 1994 for import licences for fresh, chilled
    or frozen beef under the import arrangements provided for in the European Agreements
    between by the Community and the Republic of Poland, the Republic of Hungary and
    the Interim Agreements with the former Czech and Slovak Federal Republic (CSFR)
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1789/94 de la Commission, du 20 juillet 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de licences d'importation
    introduites en juillet 1994 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    européens entre la Communauté et la république de Pologne, la république de
    Hongrie et par l'accord intérimaire avec l'ancienne République fédérative
    tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1789/94 der Kommission vom 20. Juli 1994 zur Festsetzung
    des Umfangs, in dem die im Juli 1994 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Europäischen Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn und gemäß
    dem Interimsabkommen mit der ehemaligen Tschechischen und Slowakischen Föderativen
    Republik (CSFR) genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1789/94 af 20. juli 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i juli 1994, om
    importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i Europaaftalerne mellem Fællesskabet og Republikken Polen, Republikken
    Ungarn og interimsaftalen med den tidligere Tjekkiske og Slovakiske Føderative
    Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1789/94 της Επιτροπής
    της 20ής Ιουλίου 1994 περί καθορισμού του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις αδειών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1994 για τα νωπά, διατηρημένα με απλή
    ψύξη ή κατεψυγμένα βόεια κρέατα στα πλαίσια
