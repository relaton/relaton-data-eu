title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 27/81 of 1 January 1981 fixing the accession
    compensatory amounts applicable in the cereals sector up to 31 July 1981 and the
    coefficients to be used for the calculation of the amounts on processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 27/81 de la Commission, du 1er janvier 1981, fixant
    les montants compensatoires "adhésion" applicables dans le secteur des céréales
    jusqu' au 31 juillet 1981 ainsi que les coefficients à retenir pour le calcul
    des montants applicables aux produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 27/81 der Kommission vom 1. Januar 1981 zur Festsetzung
    der bis zum 31. Juli 1981 anwendbaren Beitrittsausgleichsbeträge für Getreide
    sowie der Koeffizienten zur Berechnung der Beitrittsausgleichsbeträge für Verarbeitungserzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 27/81 af 1. januar 1981 om fastsættelse
    af tiltrædelsesudligningsbeløbene for korn indtil den 31. juli 1981 og om de
    koefficienter, der skal anvendes ved beregning af de beløb, der gælder for forarbejdede
    produkter
  type: main
- language: el
  script: Grek
