id: EUDecision1972174
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 mars 1972, autorisant la République
    française à exclure du traitement communautaire certains vêtements et accessoires
    du vêtement en tissus autres que le coton, des positions Ex 61.01, Ex 61.03 et
    Ex 61.06 du Tarif douanier commun, originaires de certains pays tiers et mis en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/174/EWG: Entscheidung der Kommission vom 22. März 1972, mit der die
    Französische Republik ermächtigt wird, aus bestimmten dritten Ländern stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Bekleidung und
    Bekleidungszubehör aus anderen als Baumwollspinnstoffen der Tarifnummern ex 61.01,
    ex 61.02, ex 61.03 und ex 61.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/174/CEE: Decisione della Commissione, del 22 marzo 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario taluni oggetti
    di vestiario ed accessori per oggetti di vestiario di tessuti diversi dal cotone
    delle voci nn. ex 61.01, ex 61.02, ex 61.03 e ex 61.06 della tariffa doganale
    comune, originari di taluni paesi terzi e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/174/EEG: Beschikking van de Commissie van 22 maart 1972 waarbij de
    Franse Republiek wordt gemachtigd kleding en kledingtoebehoren van textiel andere
    dan van katoen, van posten ex 61.01, ex 61.02, ex 61.03 en ex 61.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit bepaalde derde landen en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
