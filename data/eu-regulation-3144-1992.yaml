  script: Latn
  content: Commission Regulation (EEC) No 3144/92 of 29 October 1992 re- establishing
    the levying of customs duties on products of category 16 and 74 (order No 40.0160
    and 40.0740), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3144/92 de la Commission, du 29 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 16 et 74 (numéros d' ordre 40.0160 et 40.0740) originaires d'
    Inde, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
