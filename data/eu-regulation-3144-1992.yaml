    und 40.0740) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3144/92 af 29. oktober 1992 om genindførelse
