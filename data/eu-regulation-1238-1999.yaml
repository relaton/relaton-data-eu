title:
- language: en
  script: Latn
  content: Council Regulation (EC, ECSC, Euratom) No 1238/1999 of 14 June 1999 incorporating
    daily subsistence allowance rates for officials on mission within the European
    Territory of the Member States of the European Union for Austria, Finland and
    Sweden into Article 13 of Annex VII to the Staff Regulations of the Officials
    of the European Communities
  type: main
- language: fr
  script: Latn
  content: Règlement (CE, CECA, Euratom) n° 1238/1999 du Conseil, du 14 juin 1999,
    insérant les taux pour l'Autriche, la Finlande et la Suède à l'article 13 de
    l'annexe VII du statut des fonctionnaires des Communautés européennes, concernant
    les indemnités journalières de mission à l'intérieur du territoire européen
    des États membres de l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG, EGKS, Euratom) Nr. 1238/1999 des Rates vom 14. Juni 1999
    zur Einbeziehung der Tagegeldsätze für Dienstreisen nach Österreich, Finnland
    und Schweden in Artikel 13 des Anhangs VII zum Statut der Beamten der Europäischen
    Gemeinschaften betreffend die Tagegelder für Dienstreisen innerhalb des europäischen
    Gebiets der Mitgliedstaaten der Europäischen Union
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF, EKSF, Euratom) nr. 1238/1999 af 14. juni 1999 om
    indsættelse af de rejsedagpengesatser, der er gældende for tjenesterejser inden
    for EU-medlemsstaternes europæiske område i henhold til artikel 13 i bilag VII
    til vedtægten for tjenestemænd ved De Europæiske Fællesskaber, for så vidt
    angår Østrig, Finland og Sverige
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ, ΕΚΑΧ, Ευρατόμ) αριθ. 1238/1999
    του Συμβουλίου, της 14ης Ιουνίου 1999, σχετικά
    με την ενσωμάτωση των ποσών για την Αυστρία,
    τη Φινλανδία και τη Σουηδία στο άρθρο 13 του
    παραρτήματος VII του κανονισμού υπηρεσιακής
    κατάστασης των υπαλλήλων των Ευρωπαϊκών Κοινοτήτων,
    το οποίο αφορά τις ημερήσιες αποζημιώσεις
    αποστολής εντός του ευρωπαϊκού εδάφους των
    κρατών μελών της Ευρωπαϊκής Ένωσης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY, EHTY, Euratom) N:o 1238/1999, annettu 14 päivänä
    kesäkuuta 1999, Itävaltaan, Suomeen ja Ruotsiin sovellettavien määrien lisäämisestä
    Euroopan unionin jäsenvaltioiden Euroopan-puoleiselle alueelle tehtävien virkamatkojen
    päivärahoja koskevaan Euroopan yhteisöjen virkamiehiin sovellettavien henkilöstösääntöjen
    liitteessä VII olevaan 13 artiklaan
  type: main
- language: it
  script: Latn
  content: Regolamento (CE, CECA, Euratom) n. 1238/1999 del Consiglio, del 14 giugno
    1999, che inserisce i tassi per l'Austria, la Finlandia e la Svezia nell'articolo
    13 dell'allegato VII dello statuto dei funzionari delle Comunità europee per
    quanto riguarda le indennità giornaliere di missione all'interno del territorio
    europeo degli Stati membri dell'Unione europea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG, EGKS, Euratom) nr. 1238/1999 van de Raad van 14 juni 1999
    tot opneming van de vergoedingen voor Oostenrijk, Finland en Zweden in artikel
    13 van bijlage VII van het Statuut van de ambtenaren van de Europese Gemeenschappen
    betreffende de bedragen van de dagvergoeding voor dienstreizen binnen het Europees
    grondgebied van de lidstaten van de Europese Unie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE, CECA, Euratom) n° 1238/1999 do Conselho, de 14 de Junho
    de 1999, que insere, no artigo 13° do Anexo VII do Estatuto dos Funcionários
    das Comunidades Europeias, os valores relativos às ajudas de custo diárias de
    deslocações em serviço efectuadas no território europeu dos Estados-Membros
    da União Europeia, previstos para a Áustria, Finlândia e Suécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE, CECA, Euratom) n° 1238/1999 del Consejo, de 14 de junio
    de 1999, por el que se insertan las cuantías correspondientes a Austria, Finlandia
    y Suecia en el artículo 13 del Anexo VII del Estatuto de los funcionarios de
    las Comunidades Europeas, relativo a las dietas por misión dentro del territorio
    europeo de los Estados miembros de la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG, EKSG, Euratom) nr 1238/1999 av den 14 juni 1999
    om att fastställa satserna för Österrike, Finland och Sverige i artikel 13
    i bilaga VII till tjänsteföreskrifterna för tjänstemännen i Europeiska gemenskaperna
    rörande dagtraktamenten vid tjänsteresor inom Europeiska unionens medlemsstaters
    territorium
  type: main
