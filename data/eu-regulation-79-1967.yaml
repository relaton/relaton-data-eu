title:
- language: fr
  script: Latn
  content: Règlement n 79/67/CEE de la Commission, du 25 avril 1967, fixant des coefficients
    forfaitaires applicables à certains produits laitiers pour le calcul des restitutions
    à l'exportation vers les pays tiers pour la période du 1er novembre 1964 au
    30 juin 1966
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 79/67/EWG der Kommission vom 25. April 1967 über die Festsetzung
    von Pauschalkoeffizienten für bestimmte Milcherzeugnisse zur Berechnung der Erstattungen
    bei der Ausfuhr nach dritten Ländern für den Zeitraum vom 1. November 1964 bis
    zum 30. Juni 1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 79/67/CEE della Commissione, del 25 aprile 1967, che fissa
    i coefficienti forfettari applicabili ad alcuni prodotti lattiero-caseari per
    il calcolo delle restituzioni all'esportazione verso i paesi terzi per il periodo
    1 novembre 1964 - 30 giugno 1966
  type: main
- language: nl
  script: Latn
  content: Verordening no. 79/67/EEG van de Commissie van 25 april 1967 tot vaststelling
    van de forfaitaire coëfficiënten die op bepaalde zuivelprodukten van toepassing
    zijn voor de berekening van de restituties bij uitvoer naar derde landen voor
    het tijdvak van 1 november 1964 tot 30 juni 1966
  type: main
