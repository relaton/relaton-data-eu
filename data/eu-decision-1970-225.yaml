title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 mars 1970, autorisant la République
    française à exclure du traitement communautaire les roulements de tous genres,
    de la position 84.62 du Tarif douanier commun, originaires de Bulgarie, de Roumanie
    et de Tchécoslovaquie et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/225/EWG: Entscheidung der Kommission vom 24. März 1970, mit der die
    Französische Republik ermächtigt wird, die aus Bulgarien, Rumänien und der
    Tschechoslowakei stammenden und in den übrigen Mitgliedstaaten im freien Verkehr
    befindlichen Wälzlager aller Art der Tarifnummer 84.62 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/225/CEE: Decisione della Commissione, del 24 marzo 1970, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cuscinetti a
    rotolamento di ogni specie, della voce 84.62 della tariffa doganale comune, originari
    dalla Bulgaria, dalla Romania e dalla Cecoslovacchia e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/225/EEG: Beschikking van de Commissie van 24 maart 1970 waarbij de
    Franse Republiek wordt gemachtigd kogellagers van post 84.62 van het gemeenschappelijk
    douanetarief, van oorsprong uit Bulgarije, Roemenië en Tsjechoslowakije en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
