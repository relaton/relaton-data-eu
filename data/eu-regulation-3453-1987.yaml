  content: Commission Regulation (EEC) No 3453/87 of 18 November 1987 re-establishing
    the levying of customs duties on other goat and kid skin leather, falling within
    subheading 41.04 B II, originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
