title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2085 of 28 November 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 89034 × 1507 × NK603 × DAS-40278-9 and sub-combinations
    MON 89034 × NK603 × DAS-40278-9, 1507 × NK603 × DAS-40278-9 and NK603 × DAS-40278-9
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document (C(2019) 8419) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: DÉCISION D’EXÉCUTION (UE) 2019/2085 DE LA COMMISSION du 28 novembre
    2019 autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 89034 × 1507 × NK603 × DAS-40278-9 et les sous-combinaisons MON
    89034 × NK603 × DAS-40278-9, 1507 × NK603 × DAS-40278-9 et NK603 × DAS-40278-9,
    consistant en ce maïs et sous-combinaisons ou produits à partir de ceux-ci,
    en application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2019) 8419] (Le texte en langue française est le
    seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2085 der Kommission vom 28. November
    2019 zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 89034 × 1507 × NK603 × DAS-40278-9 sowie der Unterkombinationen
    MON 89034 × NK603 × DAS-40278-9, 1507 × NK603 × DAS-40278-9 und NK603 × DAS-40278-9
    enthalten, daraus bestehen oder daraus gewonnen werden, gemäß der Verordnung
    (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben
    unter Aktenzeichen C(2019) 8419) (Nur der französische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
