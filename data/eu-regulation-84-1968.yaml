  content: Règlement (CEE) n° 84/68 du Conseil, du 23 janvier 1968, modifiant l'annexe
    II du règlement n° 83/67/CEE, en ce qui concerne certaines préparations alimentaires
    relevant de la position 21.07 FI du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 84/68 des Rates vom 23. Januar 1968 zur Änderung
    des Anhangs II der Verordnung Nr. 83/67/EWG in bezug auf unter die Tarifnummer
    21.07 F I des Gemeinsamen Zolltarifs fallende Lebensmittelzubereitungen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 84/68 del Consiglio, del 23 gennaio 1968, che modifica
    l'allegato II del regolamento n. 83/67/CEE per quanto concerne talune preparazioni
    alimentari della voce 21.07 F I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 84/68 van de Raad van 23 januari 1968 houdende wijziging
    van bijlage II van Verordening nr. 83/67/EEG, voor zover deze betrekking heeft
    op bepaalde produkten voor menselijke consumptie van post 21.07 F I van het gemeenschappelijk
    douanetarief
