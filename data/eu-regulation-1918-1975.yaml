title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1918/75 of the Commission of 25 July 1975 fixing for
    purposes of application of the system of import licences for preserved mushrooms
    the percentage applicable to the reference quantity
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1918/75 de la Commission, du 25 juillet 1975, fixant,
    en vue de l'application du régime des titres d'importation pour les conserves
    de champignons, le pourcentage applicable à la quantité de référence
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1918/75 der Kommission vom 25. Juli 1975 zur Festsetzung
    des bei Anwendung der Einfuhrlizenzregelung für Champignonkonserven auf die Bezugsmengen
    anzuwendenden Vomhundertsatzes
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1918/75 af 25. juli 1975 om fastsættelse
    af den procentsats, der ved gennemførelsen af importlicensordningen for svampekonserves
    skal anvendes på referencemængden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1918/75 della Commissione, del 25 luglio 1975, che
    fissa, per l'applicazione del regime dei titoli d'importazione di conserve di
    funghi, la percentuale applicabile alla quantità di riferimento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1918/75 van de Commissie van 25 juli 1975 tot vaststelling,
    met het oog op de toepassing van het stelsel van invoervergunningen voor champignonconserven,
    van het op de referentiehoeveelheid toe te passen percentage
