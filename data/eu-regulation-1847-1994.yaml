title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1847/94 of 27 July 1994 amending Regulation
    (EC) No 1606/94 relating to the exemption from the import levy for certain products
    in the cereals'sector laid down in the Agreements between the European Community
    and the Republic of Bulgaria and Romania and repealing Regulation (EC) No 335/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1847/94 de la Commission du 27 juillet 1994 modifiant
    le règlement (CE) n° 1606/94 relatif à l'exonération du prélèvement à l'importation,
    pour certains produits du secteur céréalier, prévue par les accords entre la
    Communauté européenne d'une part et la République de Bulgarie et la Roumanie
    d'autre part, et abrogeant le règlement (CE) n° 335/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1847/94 DER KOMMISSION vom 27. Juli 1994 zur Änderung
    der Verordnung (EG) Nr. 1606/94 zur Aussetzung der Abschöpfung bei der Einfuhr
    bestimmter Getreideerzeugnisse gemäß den Abkommen zwischen der Europäischen
    Gemeinschaft und der Republik Bulgarien und der Republik Rumänien, und zur Aufhebung
    der Verordnung (EG) Nr. 335/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1847/94 af 27. juli 1994 om ændring
    af forordning (EF) nr. 1606/94 om den fritagelse for importafgift for visse kornprodukter,
    der er fastsat i aftalerne mellem Det Europæiske Fællesskab og Republikken Bulgarien
    og Rumænien og ophævelse af forordning (EF) nr. 335/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1847/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1994 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1606/94 σχετικά με την απαλλαγή
    από την εισφορά κατά την εισαγωγή, για ορισμένα
    προϊόντα του τομέα των σιτηρών, η οποία προβλέπεται
    στις συμφωνίες μεταξύ της Ευρωπαϊκής Κοινότητας,
    αφενός, και της Δημοκρατίας της Βουλγαρίας
    και της Δημοκρατίας της Ρουμανίας, αφετέρου,
    και για ακύρωση του κανονισμού (ΕΚ) αριθ. 335/94
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1847/94, annettu 27 päivänä heinäkuuta 1994,
    Euroopan yhteisön sekä Bulgarian tasavallan ja Romanian välisillä sopimuksilla
    määrätystä, tiettyjen vilja-alan tuotteiden vapautuksesta tuontimaksusta annetun
    asetuksen (EY) N:o 1606/94 muuttamisesta ja asetuksen (EY) N:o 335/94 kumoamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1847/94 DELLA COMMISSIONE del 27 luglio 1994 che modifica
    il regolamento (CE) n. 1604/94 relativo all' esonero dal prelievo all' importazione
    per alcuni prodotti del settore cerealicolo, previsto dagli accordi tra la Comunità
    europea e la Repubblica di Bulgaria e la Romania, e che abroga il regolamento
    (CE) n. 335/94
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1847/94 VAN DE COMMISSIE van 27 juli 1994 tot wijziging
    van Verordening (EG) nr. 1606/94 inzake de vrijstelling van de heffing bij invoer
    voor bepaalde produkten van de sector granen, in het kader van de Overeenkomsten
