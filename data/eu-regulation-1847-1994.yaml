    en Roemenië anderzijds en tot intrekking van Verordening (EG) nr. 335/94
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1847/94 DA COMISSÃO de 27 de Julho de 1994 que altera
