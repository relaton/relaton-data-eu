    suojattuja alkuperänimityksiä, suojattuja maantieteellisiä merkintöjä ja
    aitoja perinteisiä tuotteita koskevien unionin tunnusten vahvistamisen sekä
    eräiden hankintaa koskevien sääntöjen, eräiden menettelysääntöjen ja eräiden
