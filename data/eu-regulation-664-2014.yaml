title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 664/2014 of 18 December 2013 supplementing
    Regulation (EU) No 1151/2012 of the European Parliament and of the Council with
    regard to the establishment of the Union symbols for protected designations of
    origin, protected geographical indications and traditional specialities guaranteed
    and with regard to certain rules on sourcing, certain procedural rules and certain
    additional transitional rules
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 664/2014 de la Commission du 18 décembre
    2013 complétant le règlement (UE) n ° 1151/2012 du Parlement européen et du
    Conseil en ce qui concerne l'établissement des symboles de l'Union pour les appellations
    d'origine protégées, les indications géographiques protégées et les spécialités
    traditionnelles garanties et en ce qui concerne certaines règles relatives à
    la provenance, certaines règles procédurales et certaines règles transitoires
    supplémentaires
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 664/2014 der Kommission vom 18. Dezember
    2013 zur Ergänzung der Verordnung (EU) Nr. 1151/2012 des Europäischen Parlaments
    und des Rates im Hinblick auf die Festlegung der EU-Zeichen für geschützte Ursprungsbezeichnungen,
    geschützte geografische Angaben und garantiert traditionelle Spezialitäten sowie
    im Hinblick auf bestimmte herkunftsbezogene Vorschriften, Verfahrensvorschriften
    und zusätzliche Übergangsvorschriften
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 664/2014 на Комисията
    от 18 декември 2013 година за допълване на Регламент
    (ЕС) № 1151/2012 на Европейския парламент и на Съвета
    по отношение на определянето на символите
    на Съюза за защитени наименования за произход,
    защитени географски указания и храни с традиционно
    специфичен характер, както и по отношение на
    определени правила за снабдяване, някои процедурни
    правила и някои допълнителни преходни разпоредби
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 664/2014 ze dne 18.
