    (EU) č. 1151/2012, pokud jde o stanovení symbolů Unie pro chráněná označení
    původu, chráněná zeměpisná označení a zaručené tradiční speciality
    a o některá pravidla pro původ, procesní pravidla a další přechodná pravidla
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 664/2014 af 18. december 2013
    om supplering af Europa-Parlamentets og Rådets forordning (EU) nr. 1151/2012
    med hensyn til fastlæggelsen af EU-symboler for beskyttede oprindelsesbetegnelser,
    beskyttede geografiske betegnelser og garanterede traditionelle specialiteter
    og med hensyn til visse regler om oprindelse, visse procedureregler og visse yderligere
    overgangsbestemmelser
  type: main
