    Uredbe (EU) br. 1151/2012 Europskog parlamenta i Vijeća s obzirom na utvrđivanje
    simbola Unije za zaštićene oznake izvornosti, zaštićene oznake zemljopisnog
    podrijetla i zajamčeno tradicionalne specijalitete i s obzirom na određena pravila
    o podrijetlu, određena pravila postupka i određena dodatna prijelazna pravila
  type: main
- language: hu
  script: Latn
  content: A Bizottság 664/2014/EU felhatalmazáson alapuló rendelete ( 2013. december
    18. ) az 1151/2012/EU európai parlamenti és tanácsi rendeletnek az oltalom
    alatt álló eredetmegjelölések, az oltalom alatt álló földrajzi jelzések
    és a hagyományos különleges termékek uniós szimbólumainak létrehozása
    tekintetében, valamint a származásra vonatkozó bizonyos szabályok, bizonyos
    eljárási szabályok és bizonyos kiegészítő átmeneti szabályok tekintetében
    történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 664/2014 della Commissione, del 18 dicembre
    2013 , che integra il regolamento (UE) n. 1151/2012 del Parlamento europeo e del
    Consiglio con riguardo alla definizione dei simboli dell'Unione per le denominazioni
    di origine protette, le indicazioni geografiche protette e le specialità tradizionali
    garantite e con riguardo ad alcune norme sulla provenienza, ad alcune norme procedurali
    e ad alcune norme transitorie supplementari
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 664/2014 ( 2013. gada 18. decembris
    ), ar ko papildina Eiropas Parlamenta un Padomes Regulu (ES) Nr. 1151/2012 attiecībā
    uz Savienības simbolu izveidi aizsargātiem cilmes vietas nosaukumiem, aizsargātām
    ģeogrāfiskās izcelsmes norādēm un garantētām tradicionālām īpatnībām
    un attiecībā uz dažiem noteikumiem saistībā ar iegūšanas avotu, dažiem
    procedūras noteikumiem un dažiem papildu pārejas noteikumiem
  type: main
- language: lt
  script: Latn
  content: 2013 m. gruodžio 18 d. Komisijos deleguotasis reglamentas (ES) Nr. 664/2014,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 1151/2012 papildomas
    nuostata dėl saugomų kilmės vietos nuorodų, saugomų geografinių nuorodų
    ir garantuotų tradicinių gaminių Sąjungos simbolių nustatymo, tam tikromis
    gavimo šaltinių taisyklėmis, tam tikromis procedūrinėmis taisyklėmis ir
    tam tikromis papildomomis pereinamojo laikotarpio taisyklėmis
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Delega tal-Kummissjoni (UE) Nru 664/2014 tat- 18 ta' Diċembru
    2013 li jissupplimenta r-Regolament (UE) Nru 1151/2012 tal-Parlament Ewropew u
    tal-Kunsill f'dak li għandu x'jaqsam mal-istabbiliment ta' simboli tal-Unjoni
    għal denominazzjonijiet protetti tal-oriġini, indikazzjonijiet ġeografiċi
    protetti u speċjalitajiet tradizzjonali ggarantiti u fir-rigward ta' ċerti regoli
    dwar il-ksib, ċerti regoli proċedurali u ċerti regoli tranżitorji oħrajn
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 664/2014 van de Commissie van 18 december
    2013 tot aanvulling van Verordening (EU) nr. 1151/2012 van het Europees Parlement
    en de Raad betreffende de vaststelling van de symbolen van de Unie voor beschermde
    oorsprongsbenamingen, beschermde geografische aanduidingen en gegarandeerde traditionele
    specialiteiten en betreffende bepaalde voorschriften inzake het betrekken, bepaalde
    procedurebepalingen en bepaalde aanvullende overgangsregels
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 664/2014 z dnia 18 grudnia 2013
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1151/2012
    w odniesieniu do ustanowienia symboli unijnych dotyczących chronionych nazw pochodzenia,
    chronionych oznaczeń geograficznych i gwarantowanych tradycyjnych specjalności
    oraz w odniesieniu do niektórych zasad dotyczących pochodzenia paszy i surowców,
    niektórych przepisów proceduralnych i niektórych dodatkowych przepisów przejściowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 664/2014 da Comissão, de 18 de dezembro
    de 2013 , que completa o Regulamento (UE) n. ° 1151/2012 do Parlamento Europeu
    e do Conselho no que diz respeito ao estabelecimento dos símbolos da União para
    as denominações de origem protegidas, as indicações geográficas protegidas
    e as especialidades tradicionais garantidas e a certas regras relativas à proveniência,
    certas regras processuais e certas regras transitórias adicionais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 664/2014 al Comisiei din 18 decembrie 2013
    de completare a Regulamentului (UE) nr. 1151/2012 al Parlamentului European și
    al Consiliului cu privire la stabilirea simbolurilor Uniunii pentru denumirile
    de origine protejate, indicațiile geografice protejate și specialitățile tradiționale
    garantate și cu privire la anumite norme privind sursele, anumite norme procedurale
    și anumite norme tranzitorii suplimentare
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 664/2014 z 18. decembra 2013 ,
    ktorým sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1151/2012,
    pokiaľ ide o stanovenie symbolov Únie pre chránené označenia pôvodu, chránené
    zemepisné označenia a zaručené tradičné špeciality a pokiaľ ide o určité
    pravidlá týkajúce sa určovania pôvodu, určité procesné pravidlá a určité
    dodatočné prechodné pravidlá
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 664/2014 z dne 18. decembra 2013 o
    dopolnitvi Uredbe (EU) št. 1151/2012 Evropskega parlamenta in Sveta v zvezi z
    določitvijo simbolov Unije za zaščitene označbe porekla, zaščitene geografske
    označbe in zajamčene tradicionalne posebnosti ter v zvezi z nekaterimi pravili
    o izvoru, nekaterimi postopkovnimi pravili in nekaterimi dodatnimi prehodnimi
    pravili
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n °664/2014 de la Comisión, de 18 de diciembre
    de 2013 , por el que se completa el Reglamento (UE) n ° 1151/2012 del Parlamento
    Europeo y del Consejo en lo que se refiere al establecimiento de los símbolos
    de la Unión para las denominaciones de origen protegidas, las indicaciones geográficas
    protegidas y las especialidades tradicionales garantizadas y en lo que atañe
    a determinadas normas sobre la procedencia, ciertas normas de procedimiento y
    determinadas disposiciones transitorias adicionales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 664/2014 av den 18 december
    2013 om komplettering av Europaparlamentets och rådets förordning (EU) nr 1151/2012
    vad gäller fastställandet av unionssymboler för skyddade ursprungsbeteckningar,
    skyddade geografiska beteckningar och garanterade traditionella specialiteter
    och vad gäller vissa regler om ursprung, vissa procedurregler och vissa kompletterande
    övergångsbestämmelser
