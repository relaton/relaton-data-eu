    zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung der Republik
    Guinea über die Fischerei vor der Küste Guineas für die Zeit vom 1. Januar
    1992 bis zum 31. Dezember 1993 (92/220/EWG) #'
  type: main
- language: da
