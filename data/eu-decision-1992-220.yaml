    og den finansielle godtgørelse, der er omhandlet i aftalen mellem Det Europæiske
    Økonomiske Fællesskab og regeringen for Republikken Guinea om fiskeri ud for
    Guineas kyst, for perioden 1. januar 1992 til 31. december 1993 (92/220/EØF)
    #'
  type: main
- language: el
