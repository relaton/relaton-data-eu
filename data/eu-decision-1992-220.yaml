title:
- language: en
  script: Latn
  content: '92/220/EEC: Council Decision of 30 March 1992 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol establishing, for the period from 1 January 1992 to 31 December
    1993, the fishing rights and financial compensation provided for in the Agreement
    between the European Economic Community and the Government of the Republic of
    Guinea on fishing off the Guinean coast'
  type: main
- language: fr
  script: Latn
  content: '92/220/CEE: Décision du Conseil du 30 mars 1992 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée concernant la pêche au large de la côte guinéenne,
    pour la période du 1er janvier 1992 au 31 décembre 1993'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 30. März 1992 über den Abschluß des Abkommens
    in Form eines Briefwechsels über die vorläufige Anwendung des Protokolls zur
