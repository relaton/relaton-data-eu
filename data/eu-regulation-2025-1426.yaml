title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/1426 of 17 July 2025 concerning
    the authorisation of a preparation of Saccharomyces cerevisiae CNCM I-1077 as
    a feed additive for ruminants (other than lambs) and camelids reared for milk
    production or reared for reproduction, young ruminants for fattening other than
    calves and lambs, camelid calves for fattening, and Equidae other than horses
    (holder of authorisation: Lallemand SAS) and amending Implementing Regulation
    (EU) 2020/149 as regards the terms of the authorisation of a preparation of Saccharomyces
    cerevisiae CNCM I-1077 as a feed additive for lambs'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/1426 de la Commission du 17 juillet
    2025 concernant l’autorisation d’une préparation de Saccharomyces cerevisiae
    CNCM I-1077 en tant qu’additif pour l’alimentation des ruminants (autres que
    les agneaux) et des camélidés élevés pour la production de lait ou pour la
    reproduction, des jeunes ruminants d’engraissement autres que les veaux et les
    agneaux, des jeunes camelidés d’engraissement et des équidés autres que les
    chevaux (titulaire de l’autorisation: Lallemand SAS), et modifiant le règlement
    d’exécution (UE) 2020/149 en ce qui concerne les conditions d’autorisation
    d’une préparation de Saccharomyces cerevisiae CNCM I-1077 en tant qu’additif
    pour l’alimentation des agneaux'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/1426 der Kommission vom 17. Juli 2025
    zur Zulassung einer Zubereitung aus Saccharomyces cerevisiae CNCM I-1077 als Futtermittelzusatzstoff
    für Wiederkäuer (ausgenommen Lämmer) und Kameliden für die Milcherzeugung
    oder für Zuchtzwecke, junge Wiederkäuer für Mastzwecke, ausgenommen Kälber
    und Lämmer, Kälber von Kameliden für Mastzwecke sowie Equiden, ausgenommen
    Pferde, (Zulassungsinhaber: Lallemand SAS) und zur Änderung der Durchführungsverordnung
    (EU) 2020/149 hinsichtlich der Bedingungen für die Zulassung einer Zubereitung
    aus Saccharomyces cerevisiae CNCM I-1077 als Futtermittelzusatzstoff für Lämmer'
