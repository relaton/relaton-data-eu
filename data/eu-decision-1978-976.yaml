  content: '78/976/EEC: Council Decision of 20 November 1978 on the provisional application
    to Dominica after its independence of the arrangements provided for in Decision
    76/568/EEC on the association of the overseas countries and territories with the
    European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '78/976/CEE: Décision du Conseil, du 20 novembre 1978, relative à l''
    application provisoire à la Dominique, après son accession à l'' indépendance,
    du régime prévu par la décision 76/568/CEE relative à l'' association des
    pays et territoires d'' outre-mer à la Communauté économique européenne'
  type: main
- language: de
  script: Latn
  content: '78/976/EWG: Beschluß des Rates vom 20. November 1978 über die vorläufige
    Anwendung der in dem Beschluß 76/568/EWG über die Assoziation der überseeischen
    Länder und Gebiete mit der Europäischen Wirtschaftsgemeinschaft vorgesehenen
    Regelung auf Dominica nach seiner Unabhängigkeit'
  type: main
- language: da
  script: Latn
  content: '78/976/EØF: Rådets afgørelse af 20. november 1978 om foreløbig anvendelse
