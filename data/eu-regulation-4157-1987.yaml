    dei prodotti trasformati a base di ortofrutticoli importati in Portogallo che
    figurano nell' allegato XXII dell' atto di adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4157/87 van de Commissie van 23 december 1987 tot
