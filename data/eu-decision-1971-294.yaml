title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 juillet 1971, autorisant la République
    italienne à exclure du traitement communautaire les roulements de tous genres,
    de la position 84.62 du Tarif douanier commun, originaires des pays de l'Est et
    mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/294/EWG: Entscheidung der Kommission vom 22. Juli 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Ostländern stammenden und in
    den übrigen Mitgliedstaaten im freien Verkehr befindlichen Wälzlager aller Art
    der Position 84.62 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/294/CEE: Decisione della Commissione, del 22 luglio 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i cuscinetti a
    rotolamento di ogni specie, della voce 84.62 della tariffa doganale comune, originari
    dei paesi dell''Est e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/294/EEG: Beschikking van de Commissie van 22 juli 1971 waarbij de Italiaanse
    Republiek wordt gemachtigd kogellagers, naaldlagers, rollagers en dergelijke lagers
    van post 84.62 van het gemeenschappelijk douanetarief, van oorsprong uit Oostelijke
    landen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
