title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1769/87 of 25 June 1987 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, products of category 33 (code 40.0330), originating in Brazil, to which
    the preferential tariff arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1769/87 de la Commission du 25 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux sacs et sachets d' emballage
    de la catégorie de produits n° 33 (code 40.0330) originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1769/87 der Kommission vom 25. Juni 1987 zur Wiedereinführung
    des Zollsatzes für Säcke und Beutel zu Verpackungszwecken der Warenkategorie
    Nr. 33 (Kennziffer 40.0330) mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1769/87 af 25. juni 1987 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage under varekategori
    nr. 33 (kode 40.0330), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1769/87 της Επιτροπής
