title:
- language: en
  script: Latn
  content: Council Decision 2014/508/CFSP of 30 July 2014 amending Decision 2014/145/CFSP
    concerning restrictive measures in respect of actions undermining or threatening
    the territorial integrity, sovereignty and independence of Ukraine
  type: main
- language: fr
  script: Latn
  content: Décision 2014/508/PESC du Conseil du 30 juillet 2014 modifiant la décision
    2014/145/PESC concernant des mesures restrictives eu égard aux actions compromettant
    ou menaçant l'intégrité territoriale, la souveraineté et l'indépendance de
    l'Ukraine
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/508/GASP des Rates vom 30. Juli 2014 zur Änderung des Beschlusses
    2014/145/GASP über restriktive Maßnahmen angesichts von Handlungen, die die
    territoriale Unversehrtheit, Souveränität und Unabhängigkeit der Ukraine untergraben
    oder bedrohen
  type: main
- language: bg
  script: Cyrl
  content: Решение 2014/508/ОВППС на Съвета от 30 юли 2014
    година за изменение на Решение 2014/145/ОВППС относно
    ограничителни мерки във връзка с действия,
    подкопаващи или застрашаващи териториалната
    цялост, суверенитета и независимостта на Украйна
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2014/508/SZBP ze dne 30. července 2014 kterým se mění
    rozhodnutí 2014/145/SZBP o omezujících opatřeních vzhledem k činnostem narušujícím
    nebo ohrožujícím územní celistvost, svrchovanost a nezávislost Ukrajiny
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2014/508/FUSP af 30. juli 2014 om ændring af afgørelse
    2014/145/FUSP om restriktive foranstaltninger over for tiltag, der underminerer
    eller truer Ukraines territoriale integritet, suverænitet og uafhængighed
  type: main
- language: el
  script: Grek
  content: Απόφαση 2014/508/ΚΕΠΠΑ του Συμβουλίου, της
    30ής Ιουλίου 2014 , για την τροποποίηση της απόφασης
    2014/145/ΚΕΠΠΑ σχετικά με περιοριστικά μέτρα όσον
    αφορά δράσεις που υπονομεύουν ή απειλούν την
    εδαφική ακεραιότητα, την κυριαρχία και την
    ανεξαρτησία της Ουκρανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2014/508/ÜVJP, 30. juuli 2014 , millega muudetakse otsust
    2014/145/ÜVJP, mis käsitleb piiravaid meetmeid seoses Ukraina territoriaalset
    terviklikkust, suveräänsust ja sõltumatust kahjustava või ohustava tegevusega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2014/508/YUTP, annettu 30 päivänä heinäkuuta 2014
    , rajoittavista toimenpiteistä Ukrainan alueellista koskemattomuutta, suvereniteettia
    ja itsenäisyyttä heikentävien tai uhkaavien toimien johdosta annetun päätöksen
    2014/145/YUTP muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2014/508/ZVSP od 30. srpnja 2014. o izmjeni Odluke 2014/145/ZVSP
    o mjerama ograničavanja s obzirom na djelovanja kojima se podrivaju ili ugrožavaju
    teritorijalna cjelovitost, suverenitet i neovisnost Ukrajine
  type: main
- language: hu
  script: Latn
  content: A Tanács 2014/508/KKBP határozata ( 2014. július 30. ) az Ukrajna területi
    integritását, szuverenitását és függetlenségét aláásó vagy fenyegető
    intézkedések miatti korlátozó intézkedések bevezetéséről szóló 2014/145/KKBP
    határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2014/508/PESC del Consiglio, del 30 luglio 2014 , che modifica
    la decisione 2014/145/PESC concernente misure restrittive relative ad azioni che
    compromettono o minacciano l'integrità territoriale, la sovranità e l'indipendenza
    dell'Ucraina
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2014/508/KĀDP ( 2014. gada 30. jūlijs ), ar kuru groza
    Lēmumu 2014/145/KĀDP par ierobežojošiem pasākumiem attiecībā uz darbībām,
    ar ko tiek grauta vai apdraudēta Ukrainas teritoriālā integritāte, suverenitāte
    un neatkarība
  type: main
- language: lt
  script: Latn
  content: 2014 m. liepos 30 d. Tarybos sprendimas 2014/508/BUSP, kuriuo iš dalies
    keičiamas Sprendimas 2014/145/BUSP dėl ribojamųjų priemonių, taikytinų atsižvelgiant
    į veiksmus, kuriais kenkiama Ukrainos teritoriniam vientisumui, suverenitetui
    ir nepriklausomybei arba į juos kėsinamasi
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2014/508/PESK tat- 30 ta' Lulju 2014 li temenda
    d-Deċiżjoni 2014/145/PESK dwar miżuri restrittivi fir-rigward ta' azzjonijiet
    li jdgħajfu jew jheddu l-integrità territorjali, is-sovranità u l-indipendenza
    tal-Ukraina
  type: main
- language: nl
  script: Latn
  content: Besluit 2014/508/GBVB van de Raad van 30 juli 2014 tot wijziging van Besluit
    2014/145/GBVB betreffende beperkende maatregelen met betrekking tot acties die
    de territoriale integriteit, soevereiniteit en onafhankelijkheid van Oekraïne
    ondermijnen of bedreigen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2014/508/WPZiB z dnia 30 lipca 2014 r. zmieniająca decyzję
    2014/145/WPZiB w sprawie środków ograniczających w związku z działaniami
    podważającymi integralność terytorialną, suwerenność i niezależność
    Ukrainy lub im zagrażającymi
  type: main
- language: pt
  script: Latn
  content: Decisão 2014/508/PESC do Conselho, de 30 de julho de 2014 , que altera
    a Decisão 2014/145/PESC que impõe medidas restritivas no que diz respeito a
    ações que comprometam ou ameacem a integridade territorial, a soberania e a
    independência da Ucrânia
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului 2014/508/PESC din 30 iulie 2014 de modificare a Deciziei
    2014/145/PESC privind măsuri restrictive în raport cu acțiunile care subminează
    sau amenință integritatea teritorială, suveranitatea și independența Ucrainei
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2014/508/SZBP z 30. júla 2014 , ktorým sa mení rozhodnutie
    2014/145/SZBP o reštriktívnych opatreniach vzhľadom na konanie, ktorým sa
    narúša alebo ohrozuje územná celistvosť, zvrchovanosť a nezávislosť Ukrajiny
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2014/508/SZVP z dne 30. julija 2014 o spremembi Sklepa 2014/145/SZVP
    o omejevalnih ukrepih v zvezi z ukrepi, ki spodkopavajo ali ogrožajo ozemeljsko
    nedotakljivost, suverenost in neodvisnost Ukrajine
  type: main
- language: es
  script: Latn
  content: Decisión 2014/508/PESC del Consejo, 30 de julio de 2014 , por la que se
    modifica la Decisión 2014/145/PESC relativa a medidas restrictivas respecto de
    acciones que menoscaban o amenazan la integridad territorial, la soberanía y
    la independencia de Ucrania
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2014/508/Gusp av den 30 juli 2014 om ändring av beslut
    2014/145/Gusp om restriktiva åtgärder mot åtgärder som undergräver eller
    hotar Ukrainas territoriella integritet, suveränitet och oberoende
  type: main
