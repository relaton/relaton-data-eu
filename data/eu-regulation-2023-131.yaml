title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/131 of 18 January 2023 amending
    Implementing Regulation (EU) 2019/1259 imposing a definitive anti-dumping duty
    on imports of threaded tube or pipe cast fittings, of malleable cast iron and
    spheroidal graphite cast iron, originating in the People’s Republic of China
    and Thailand, and subjecting imports of tube or pipe cast fittings originating
    in the People’s Republic of China to surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/131 de la Commission du 18 janvier
    2023 modifiant le règlement d’exécution (UE) 2019/1259 instituant un droit
    antidumping définitif sur les importations d’accessoires de tuyauterie filetés,
    moulés, en fonte malléable et en fonte à graphite sphéroïdal, originaires
    de la République populaire de Chine et de Thaïlande, et soumettant à surveillance
    les importations d’accessoires de tuyauterie moulés originaires de la République
    populaire de Chine
  type: main
