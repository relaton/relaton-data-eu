---
id: EUDecision1975447
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 February 1975 authorizing the Italian Republic
    not to apply Community treatment to woven fabrics of cotton, other than gauze
    or terry towelling and similar terry fabrics, unbleached, falling within heading
    No ex 55.09 of the Common Customs Tariff, originating in the USSR and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/447/CEE: Décision de la Commission, du 24 février 1975, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    coton, autres qu''à point de gaze ou boucle du genre éponge, écrus, de la position
    Ex 55.09 du Tarif douanier commun, originaires de l''URSS et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Februar 1975, mit der die Republik
    Italien ermächtigt wird, aus der UdSSR stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Baumwolle, andere als Drehergewebe oder
    Schlingengewebe (Frottiergewebe), roh, der Tarifnummer ex 55.09 des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. februar 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage ubearbejdede vævede stoffer
    af bomuld, bortset fra drejervævede, håndklædefrotterstoffer og lignende frotterstoffer,
    og som er henhørende under pos. ex 55.09 i den fælles toldtarif, har oprindelse
    i USSR og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 febbraio 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone diversi
    da quelli a punto di garza o ricci del tipo spugna, greggi, della voce ex 55.09
    della tariffa doganale comune, originari dell'URSS e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 februari 1975 waarbij de Italiaanse
    Republiek wordt gemachtigd weefsels van katoen, andere dan met gaasbinding en
    andere dan bad- of frotteerstof (lussendoek), ongebleekt, van post ex 55.09 van
    het gemeenschappelijk douanetarief, van oorsprong uit de U.S.S.R en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
