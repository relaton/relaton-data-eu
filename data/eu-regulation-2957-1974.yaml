title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2957/74 of the Commission of 22 November 1974 re-establishing
    the levying of customs duties on other articles of iron or steel, falling within
    heading No 73.40, originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2957/74 de la Commission, du 22 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux autres ouvrages
    en fonte, fer ou acier, de la position tarifaire 73.40, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2957/74 der Kommission vom 22. November 1974 zur Wiedereinführung
    des Zollsatzes für andere Waren aus Eisen oder Stahl, der Tarifnummer 73.40,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräfenrenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2957/74 af 22. november 1974 om genindførelse
    af opkrævning af toldafgifter for andre varer af jern og stål under position
    73.40, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2957/74 della Commissione, del 22 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli altri lavori di ghisa,
    di ferro o di acciaio, della voce doganale n. 73.40, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2957/74 van de Commissie van 22 november 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere werken
    van gietijzer, van ijzer of van staal, van post 73.40, van oorsprong uit Joegoslavië
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
