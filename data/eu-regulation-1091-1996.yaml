  content: COMMISSION REGULATION (EC) No 1091/96 of 17 June 1996 temporarily permitting
    the United Kingdom to authorize the use of set-aside land for grazing bovine animals
    of more than 30 months
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1091/96 DE LA COMMISSION du 17 juin 1996 permettant
    temporairement au Royaume-Uni d'autoriser l'utilisation des terres gelées pour
    le pâturage des bovins âgés de plus de trente mois
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1091/96 DER KOMMISSION vom 17. Juni 1996 zur vorläufigen
    Ermächtigung des Vereinigten Königreichs, stillgelegte Flächen durch Beweidung
    mit mehr als 30 Monate alten Rindern zu nutzen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1091/96 af 17. juni 1996 om midlertidig
    tilladelse til Det Forenede Kongerige til at anvende udtagne arealer til græsning
    for kreaturer, der er over 30 måneder gamle
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1091/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Ιουνίου 1996 που επιτρέπει προσωρινά
    στο Ηνωμένο Βασίλειο να επιτρέψει τη χρησιμοποίηση
    γαιών υπό καθεστώς προσωρινής παύσης καλλιέργειας
    για τη βοσκή βοοειδών ηλικίας άνω των 30 μηνών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1091/96, annettu 17 päivänä kesäkuuta 1996,
    luvan antamisesta Yhdistyneelle kuningaskunnalle sallia tilapäisesti kesannoitujen
    alojen käyttäminen yli 30 kuukauden ikäisten nautaeläinten laiduntamiseen
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1091/96 DELLA COMMISSIONE del 17 giugno 1996 che permette
    temporaneamente al Regno Unito di autorizzare l'uso delle terre ritirate dalla
    produzione per il pascolo dei bovini di età superiore a trenta mesi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1091/96 VAN DE COMMISSIE van 17 juni 1996 houdende
    tijdelijke machtiging van het Verenigd Koninkrijk om braakgelegde gronden te gebruiken
    als weiland voor runderen van meer dan 30 maanden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1091/96 DA COMISSÃO de 17 de Junho de 1996 que permite
    temporáriamente ao Reino Unido autorizar a utilização de terras retiradas da
    produção para a pastagem de bovinos com mais de 30 meses de idade
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 1091/96 DE LA COMISIÓN de 17 de junio de 1996 por
