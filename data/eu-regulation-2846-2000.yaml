    pour la 258e adjudication partielle effectuée dans le cadre des mesures générales
    d'intervention conformément au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2846/2000 der Kommission vom 22. Dezember 2000 zur
