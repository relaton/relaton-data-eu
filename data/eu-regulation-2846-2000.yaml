    Intervention im Rahmen der 258. Teilausschreibung der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2846/2000 af 22. december 2000 om fastsættelse
    af maksimumsopkøbsprisen og de oksekødsmængder, der opkøbes ved intervention
    som følge af den 258. dellicitation i forbindelse med de generelle interventionsforanstaltninger,
    der foretages i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2846/2000 της Επιτροπής,
    της 22ας Δεκεμβρίου 2000, για καθορισμό της ανώτατης
    τιμής αγοράς και των ποσοτήτων βοείου κρέατος
    που αγοράζονται στην παρέμβαση με το 258ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    των γενικών μέτρων παρεμβάσεως σύμφωνα με
    τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2846/2000, annettu 22 päivänä joulukuuta 2000,
    interventioon ostetun naudanlihan enimmäisostohinnan ja määrien vahvistamisesta
    asetuksen (ETY) N:o 1627/89 mukaisten interventioita koskevien yleisten toimenpiteiden
    osana toteutettua 258. osittaista tarjouskilpailua varten
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2846/2000 della Commissione, del 22 dicembre 2000,
    che fissa il prezzo massimo di acquisto e i quantitativi di carni bovine acquistati
    all'intervento per la 258a gara parziale effettuata nel quadro delle misure generali
    d'intervento conformemente al regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2846/2000 van de Commissie van 22 december 2000 tot
    vaststelling van de maximumaankoopprijs en de hoeveelheden rundvlees die door
    de interventiebureaus worden aangekocht in het kader van de 258e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2846/2000 da Comissão, de 22 de Dezembro de 2000,
