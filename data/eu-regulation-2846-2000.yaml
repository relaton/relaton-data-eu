  script: Latn
  content: Commission Regulation (EC) No 2846/2000 of 22 December 2000 fixing the
    maximum buying-in price and the quantities of beef to be bought in under the 258th
    partial invitation to tender as a general intervention measure pursuant to Regulation
    (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2846/2000 de la Commission du 22 décembre 2000 fixant
