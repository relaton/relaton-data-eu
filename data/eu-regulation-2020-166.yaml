    povolení 6-fytázy ze Schizosaccharomyces pombe (ATCC 5233) jako doplňkové
    látky pro výkrm kuřat, nosnice, výkrm krůt, výkrm kachen, odstavená selata,
    výkrm prasat a prasnice a o zrušení nařízení (ES) č. 785/2007 (držitel
