title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/166 of 5 February 2020 concerning
    the renewal of the authorisation of 6-phytase produced by Schizosaccharomyces
    pombe (ATCC 5233) as a feed additive for chickens for fattening, laying hens,
    turkeys for fattening, ducks for fattening, weaned piglets, pigs for fattening
    and sows and repealing Regulation (EC) No 785/2007 (holder of authorisation Danisco
    (UK) Ltd, trading as Danisco Animal Nutrition and represented by Genencor International
    B.V.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/166 de la Commission du 5 février
    2020 concernant le renouvellement de l’autorisation de la 6-phytase produite
    par Schizosaccharomyces pombe (ATCC 5233) en tant qu’additif pour l’alimentation
    des poulets d’engraissement, des poules pondeuses, des dindons d’engraissement,
    des canards d’engraissement, des porcelets sevrés, des porcs d’engraissement
    et des truies, et abrogeant le règlement (CE) no 785/2007 [titulaire de l’autorisation:
    Danisco (UK) Ltd, agissant sous le nom commercial de Danisco Animal Nutrition
    et représenté par Genencor International BV]'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2020/166 der Kommission vom 5. Februar 2020
    zur Verlängerung der Zulassung von 6-Phytase aus Schizosaccharomyces pombe (ATCC
    5233) als Futtermittelzusatzstoff für Masthühner, Legehennen, Masttruthühner,
    Mastenten, abgesetzte Ferkel, Mastschweine und Sauen sowie zur Aufhebung der Verordnung
    (EG) Nr. 785/2007 (Zulassungsinhaber: Danisco (UK) Ltd, firmierend als Danisco
    Animal Nutrition und vertreten durch Genencor International B.V.)'
