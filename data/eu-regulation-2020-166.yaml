    hyväksymisestä rehun lisäaineena broilereiden, munivien kanojen, lihakalkkunoiden,
    liha-ankkojen, vieroitettujen porsaiden, lihasikojen ja emakoiden ruokinnassa
    ja asetuksen (EY) N:o 785/2007 kumoamisesta (hyväksynnän haltija Danisco (UK)
    Ltd, joka käy kauppaa nimellä Danisco Animal Nutrition ja jota edustaa Genencor
    International B.V.)
