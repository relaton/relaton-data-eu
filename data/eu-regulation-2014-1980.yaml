id: EURegulation20141980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2014/80 of 28 July 1980 re-establishing
    the levying of customs duties on yarn of regenerated textile fibres (discontinuous
    or waste), put up for retail sale, products of category 57 (code 0570), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2014/80 de la Commission, du 28 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles artificielles discontinues (y compris les déchets) conditionnés
    pour la vente au détail, de la catégorie de produits n° 57 (code 0570), originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2014/80 der Kommission vom 28. Juli 1980 über die
    Wiedereinführung des Zollsatzes für Garne aus künstlichen Spinnfasern (oder
    aus Abfällen von künstlichen Spinnstoffen), in Aufmachungen für den Einzelverkauf,
    der Warenkategorie Nr. 57 (Kennziffer 0570), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2014/80 af 28. juli 1980 om genindførelse
    af opkrævning for garn af korte regenererede fibre (herunder affald), i detailsalgsoplægninger,
    under varekategori 57 (kode 0570), som har oprindelse i Indien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2014/80 della Commissione, del 28 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    artificiali in fiocco (compresi i cascami), preparati per la vendita al minuto,
    della categoria di prodotti n. 57 (codice 0570), originari dell' India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2014/80 van de Commissie van 28 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    kunstmatige stapelvezels (van afval hieronder begrepen), gereed voor de verkoop
    in het klein, van de categorie van produkten nr. 57 (codenummer 0570) van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2894/79 van de Raad
  type: main
