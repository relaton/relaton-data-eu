  content: Commission Regulation (EEC) No 1894/85 of 9 July 1985 fixing for the 1985/86
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1894/85 de la Commission du 9 juillet 1985 fixant,
    pour la campagne 1985/1986, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l' aide à la production
    pour les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1894/85 der Kommission vom 9. Juli 1985 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für nicht verarbeitete getrocknete
    Feigen sowie des Betrages der Produktionsbeihilfe für getrocknete Feigen für
    das Wirtschaftsjahr 1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1894/85 af 9. juli 1985 om fastsættelse
    for produktionsåret 1985/86 af den minimumspris, der skal betales til producenterne
    for uforarbejdede tørrede figner og af producentstøtten for tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1894/85 της Επιτροπής
    της 9ης Ιουλίου 1985 για τον καθορισμό, για την
    περίοδο εμπορίας 1985/86, της ελάχιστης τιμής
    που καταβάλλεται στους παραγωγούς για τα μη
    μεταποιημένα ξηρά σύκα και του ποσού της ενίσχυσης
    στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1894/85 della Commissione del 9 luglio 1985 che fissa,
    per la campagna di commercializzazione 1985/1986, il prezzo minimo da pagare ai
    produttori per i fichi secchi non trasformati e l' importo dell' aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1894/85 van de Commissie van 9 juli 1985 tot vaststelling,
    voor het verkoopseizoen 1985/1986, van de aan de telers te betalen minimumprijs
    voor niet verwerkte, gedroogde vijgen en van het bedrag van de produktiesteun
    voor gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1894/85 da Comissão, de 9 de Julho de 1985, que
