title:
- language: en
  script: Latn
  content: '86/429/EEC: Commission Decision of 31 July 1986 authorizing the Portuguese
    Republic to introduce intra- Community surveillance of imports of motor-cycles
    originating in Japan which have been put into free circulation in one of the Member
    States (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/429/CEE: Décision de la Commission du 31 juillet 1986 autorisant la
    République portugaise à instaurer une surveillance intracommunautaire des importations
    de motocycles originaires du Japon, mis en libre pratique dans un des États membres
    (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/429/EWG: Entscheidung der Kommission vom 31. Juli 1986 zur Ermächtigung
    der Portugiesischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    von aus Japan stammenden Krafträdern, die sich in einem der Mitgliedstaaten im
    zollrechtlich freien Verkehr befinden (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/429/EØF: Kommissionens beslutning af 31. juli 1986 om bemyndigelse
    af Den portugisiske Republik til at indføre tilsyn inden for Fællesskabet med
    indførslen af motorcykler, der har oprindelse i Japan og er overgået til fri
    omsætning i en af medlemsstaterne (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/429/ΕΟΚ: Απόφαση της Επιτροπής της 31ης
    Ιουλίου 1986 περί χορηγήσεως αδείας στην Δημοκρατία
    της Πορτογαλίας να προβεί σε ενδοκοινοτική
    επιτήρηση των εισαγωγών μοτοσυκλετών καταγωγής
    Ιαπωνίας, οι οποίες τίθενται σε ελεύθερη κυκλοφορία
    σε ένα κράτος μέλος (Το κείμενο στην πορτογαλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/429/CEE: Decisione della Commissione del 31 luglio 1986 che autorizza
    la Repubblica portoghese ad istituire una sorveglianza intracomunitaria sulle
    importazioni dei motocicli originari del Giappone immessi in libera pratica in
    uno degli Stati membri (Il testo in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/429/EEG: Beschikking van de Commissie van 31 juli 1986 waarbij de Portugese
