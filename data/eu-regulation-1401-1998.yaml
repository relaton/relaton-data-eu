    και τον κανονισμό (ΕΚ) αριθ. 764/96
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1401/98, annettu 22 päivänä kesäkuuta 1998,
    GATTiin sidottujen yhteisön tariffikiintiöiden avaamisesta ja hoidosta tiettyjen
    maatalous-, teollisuus- ja kalataloustuotteiden osalta sekä mainittujen kiintiöiden
