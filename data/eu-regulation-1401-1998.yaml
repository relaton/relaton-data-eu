    neuvoston asetuksen (EY) N:o 1808/95 ja asetuksen (EY) N:o 764/96 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1401/98 del Consiglio del 22 giugno 1998 che modifica
