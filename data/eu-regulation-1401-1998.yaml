title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1401/98 of 22 June 1998 amending Regulation
    (EC) No 1808/95 opening and providing for the administration of Community tariff
    quotas bound in GATT and certain other Community tariff quotas for certain agricultural,
    industrial and fisheries products and establishing the detailed provisions for
    adapting these quotas, and amending Regulation (EC) No 764/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1401/98 du Conseil du 22 juin 1998 modifiant le règlement
    (CE) nº 1808/95, portant ouverture et mode de gestion de contingents tarifaires
    communautaires consolidés au GATT et de certains autres contingents tarifaires
    communautaires pour certains produits agricoles, industriels et de la pêche,
    et définissant les modalités d'amendement ou d'adaptation desdits contingents,
    et modifiant le règlement (CE) nº 764/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1401/98 des Rates vom 22. Juni 1998 zur Änderung der
    Verordnung (EG) Nr. 1808/95 zur Eröffnung und Verwaltung von im GATT gebundenen
    Gemeinschaftszollkontingenten und bestimmten anderen Gemeinschaftszollkontingenten
    für einige landwirtschaftliche und gewerbliche Erzeugnisse sowie Fischereierzeugnisse
    und zur Einführung eines Verfahrens zur Änderung oder Anpassung dieser Zollkontingente
    sowie zur Änderung der Verordnung (EG) Nr. 764/96
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1401/98 af 22. juni 1998 om ændring af forordning
    (EF) nr. 1808/95 om åbning og forvaltning af GATT-bundne fællesskabstoldkontingenter
    og af visse andre fællesskabskontingenter for visse landbrugsprodukter, industri-
    og fiskerivarer og om gennemførelsesbestemmelser for så vidt angår ændring
    eller tilpasning af disse toldkontingenter, og om ændring af forordning (EF)
    nr. 764/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1401/98 του Συμβουλίου
    της 22ας Ιουνίου 1998 που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 1808/95 σχετικά με το άνοιγμα και τον
    τρόπο διαχείρισης των παγιωμένων στη Γενική
    Συμφωνία Δασμών και Εμπορίου (GATT) κοινοτικών
    δασμολογικών ποσοστώσεων και ορισμένων άλλων
    κοινοτικών δασμολογικών ποσοστώσεων για ορισμένα
