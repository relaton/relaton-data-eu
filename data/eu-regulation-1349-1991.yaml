    mit Durchführungsbestimmungen zur Verordnung (EWG) Nr. 2641/80 des Rates hinsichtlich
    der Einfuhren von Erzeugnissen des Schaf- und Ziegenfleischsektors mit Ursprung
    in bestimmten Drittländern #'
  type: main
- language: da
  script: Latn
