  content: Commission Regulation (EEC) No 1349/91 of 23 May 1991 amending Regulation
    (EEC) No 1249/90 derogating from Regulation (EEC) No 19/82 laying down detailed
    rules for applying Council Regulation (EEC) No 2641/80 with regard to imports
    of sheepmeat and goatmeat products originating in certain non-Member countries
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1349/91 DE LA COMMISSION du 23 mai 1991 modifiant
    le règlement (CEE) no 1249/90 dérogeant au règlement (CEE) no 19/82 portant
    modalités d'' application du règlement (CEE) no 2641/80 du Conseil en ce qui
    concerne les importations de produits du secteur des viandes ovine et caprine
    originaires de certains pays tiers #'
  type: main
