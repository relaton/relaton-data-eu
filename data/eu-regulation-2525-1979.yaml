title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2525/79 of 14 November 1979 re-establishing
    the levying of customs duties on monoethylene glycol, monopropylene glycol, falling
    within subheading 29.04 C ex I and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2525/79 de la Commission, du 14 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux monoéthylène
    glycol, monopropylène glycol, de la sous-position 29.04 C ex I du tarif douanier
    commun, originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2525/79 der Kommission vom 14. November 1979 zur Wiedereinführung
    des Zollsatzes für Monoäthylenglykol und Monopropylenglykol der Tarifstelle
    29.04 C ex I, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2525/79 af 14. november 1979 om genindførelse
    af opkrævning af toldafgifter for monoethylenglycol, monopropylenglycol, under
    underposition 29.04 C ex I, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2525/79 della Commissione, del 14 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili al glicole monoetilenico
    e al glicole monopropilenico, della sottovoce 29.04 C ex I della tariffa doganale
    comune, originari della Romania, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2525/79 van de Commissie van 14 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mono-ethyleenglycol,
    monopropyleenglycol, van post 29.04 C ex I, van oorsprong uit Roemenië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
