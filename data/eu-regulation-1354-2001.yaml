title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1354/2001 of 4 July 2001 amending Council
    Regulation (EC) No 467/2001 as regards the persons and entities covered by the
    freeze of funds and the organisations and agencies exempted from the flight ban
    in respect of the Taliban of Afghanistan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1354/2001 de la Commission du 4 juillet 2001 modifiant
    le règlement (CE) n° 467/2001 du Conseil en ce qui concerne les personnes et
    entités visées par le gel des fonds et les organisations et organismes non soumis
    à l'interdiction des vols décidés à l'encontre des Taliban d'Afghanistan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1354/2001 der Kommission vom 4. Juli 2001 zur Änderung
    der Verordnung (EG) Nr. 467/2001 des Rates betreffend die vom Einfrieren von Geldern
    betroffenen Personen und Einrichtungen und die vom Flugverbot betroffenen Organisationen
    und Einrichtungen in Bezug auf die Taliban von Afghanistan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1354/2001 af 4. juli 2001 om ændring
    af Rådets forordning (EF) nr. 467/2001 for så vidt angår personer og enheder,
    der er omfattet af indefrysningen af midler, samt organisationer og organer, der
    er undtaget fra flyveforbuddet, med hensyn til Taliban i Afghanistan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1354/2001 της Επιτροπής,
    της 4ης Ιουλίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 467/2001 του Συμβουλίου ως
    προς τα πρόσωπα και τις οντότητες που καλύπτονται
    από τη δέσμευση κεφαλαίων και ως προς τους
    οργανισμούς και οργανώσεις που εξαιρούνται
    απο την απαγόρευση πτήσεων όσον αφορά την Ταλιμπάν
    του Αφγανιστάν
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1354/2001, annettu 4 päivänä heinäkuuta 2001,
    neuvoston asetuksen (EY) N:o 467/2001 muuttamisesta Afganistanin Talebania koskevien
    henkilöiden ja yhteisöjen varojen jäädyttämisen osalta sekä niiden järjestöjen
    ja virastojen osalta, joihin ei sovelleta lentokieltoa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1354/2001 della Commissione, del 4 luglio 2001, recante
    modifiche del regolamento (CE) n. 467/2001 del Consiglio relative al congelamento
    di capitali e di altre risorse finanziarie di persone ed enti nonché all'esclusione
    del divieto di volo per agenzie ed organismi per quanto riguarda i talibani dell'Afghanistan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1354/2001 van de Commissie van 4 juli 2001 houdende
    wĳziging van Verordening (EG) nr. 467/2001 van de Raad wat betreft de personen
    en entiteiten vallende onder de bevriezing van tegoeden alsmede de organisaties
    en organen die zĳn vrĳgesteld van het verbod op vluchten ten aanzien van de
    Taliban van Afghanistan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1354/2001 da Comissão, de 4 de Julho de 2001, que
    altera o Regulamento (CE) n.° 467/2001 do Conselho no que respeita às pessoas
    e entidades abrangidas pelo congelamento de fundos e às organizações e organismos
    não abrangidos pela proibição de voos com relação aos Taliban do Afeganistão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1354/2001 de la Comisión, de 4 de julio de 2001, por
    el que se modifica el Reglamento (CE) n° 467/2001 del Consejo relativo a los
    talibanes de Afganistán en lo que se refiere a las personas y entidades a las
    que se aplica la congelación de capitales, y a las organizaciones y organismos
    exentos de la prohibición de vuelos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1354/2001 av den 4 juli 2001 om ändring
    av rådets förordning (EG) nr 467/2001 beträffande de personer och enheter vars
    tillgångar skall spärras och de enheter och organ som undantas från flygförbudet
    med avseende på talibanerna i Afghanistan
  type: main
