title:
- language: en
  script: Latn
  content: '90/350/EEC: Commission Decision of 27 June 1990 authorizing the Italian
    Republic to apply intra- Community surveillance in respect of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/350/CEE: Décision de la Commission du 27 juin 1990 autorisant la République
    italienne à instaurer les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres Etats membres (Le texte en langue italienne est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/350/EWG: Entscheidung der Kommission vom 27. Juni 1990 mit der die
    Italienische Republik ermaechtigt wird, eine innergemeinschaftliche Ueberwachung
    von aus bestimmten Drittlaendern stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Bananen einzufuehren (Nur der italienische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/350/EØF: Kommissionens beslutning af 27. juni 1990 om bemyndigelse
    af Den Italienske Republik til at indfoere foranstaltninger med henblik på tilsyn
    inden for Faellesskabet med indfoersel af bananer, der har oprindelse i visse
    tredjelande, og som er overgaaet til fri omsaetning i de oevrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/350/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Ιουνίου 1990 που επιτρέπει στην Ιταλική Δημοκρατία
    να θεσπίσει μέτρα ενδοκοινοτικής επιτήρησης
    των εισαγωγών μπανάνας καταγωγής ορισμένων
    τρίτων χωρών που έχουν τεθεί σε ελεύθερη κυκλοφορία
    στα υπόλοιπα κράτη μέλη (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/350/CEE: Decisione della Commissione del 27 giugno 1990 che autorizza
    la Repubblica italiana a istituire le misure di sorveglianza intracomunitaria
    nei confronti delle banane originarie di taluni paesi terzi e messe in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '90/350/EEG: Beschikking van de Commissie van 27 juni 1990 waarbij de Italiaanse
    Republiek wordt gemachtigd maatregelen inzake intracommunautair toezicht te treffen
    ten aanzien van de invoer van bananen van oorsprong uit derde landen en die in
    de andere Lid-Staten in het vrije verkeer zijn gebracht (Slechts de tekst in de
    Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/350/CEE: Decisão da Comissão de 27 de Junho de 1990 que autoriza
    a Republica Italiana a instituir medidas de vigilância intracomunitaria em relaçao
    às importaçoes de bananas originarias de certos paises terceiros, introduzidas
    em livre pratica nos outros Estados-membros (Apenas faz fé o texto em língua
    italiana)'
  type: main
- language: es
  script: Latn
  content: '90/350/CEE: Decisión de la Comisión de 27 de junio de 1990 por la que
    se autoriza a la Republica Italiana a establecer medidas de vigilancia intracomunitaria
    respecto a las importaciones de platanos originarios de determinados terceros
    paises, despachados a libre practica en los demas Estados miembros (El texto en
    lengua italiana es el único auténtico)'
