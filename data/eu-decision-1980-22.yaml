id: EUDecision198022
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/22/EEC: Commission Decision of 13 December 1979 authorizing the French
    Republic not to apply Community treatment to handkerchiefs of woven fabrics, of
    a value of not more than 15 EUA per kilogram, falling within subheading ex 61.05
    B of the Common Customs Tariff (NIMEXE codes 61.05-30, 99) (category 19), originating
    in South Korea and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/22/CEE: Décision de la Commission, du 13 décembre 1979, autorisant
    la République française à exclure du traitement communautaire les mouchoirs
    de tissus d''une valeur égale ou inférieure à 15 unités de compte européennes
    par kilogramme de poids net, de la sous- position ex 61.05 B du tarif douanier
    commun (codes Nimexe: 61.05-30, 99) (catégorie 19), originaires de Corée du
    Sud et mis en libre pratique dans les autres Etats membres (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/22/EWG: Entscheidung der Kommission vom 13. Dezember 1979, mit der
    die Französische Republik ermächtigt wird, aus Südkorea stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher aus Geweben,
    mit einem Wert von nicht mehr als 15 ERE je kg Eigengewicht, der Tarifstelle ex
    61.05 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.05- 30, 99) (Kategorie
    19) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/22/EØF: Kommissionens beslutning af 13. december 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder
    af bomuld, ikke over 15 RE/kg, som henhører under pos. ex 61.05 B i den fælles
    toldtarif (NIMEXE-nummer 61.05-30, 99; kategori 19), har oprindelse i Sydkorea
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/22/CEE: Decisione della Commissione, del 13 dicembre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i fazzoletti da
    naso, di tessuti, di un valore non superiore a 15 UCE per kg netto, della sottovoce
    ex 61.05 B della tariffa doganale comune (codici Nimexe : 61.05-30, 99), categoria
    19, originari della Corea del Sud e messi in libera pratica negli altri Stati
    membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/22/EEG: Beschikking van de Commissie van 13 december 1979 waarbij de
    Franse Republiek wordt gemachtigd zakdoeken van katoenen weefsels met een waarde
    van niet meer dan 15 ERE/kg, van post ex 61.05 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.05-30, 99) (categorie 19), van oorsprong uit Zuid-Korea en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
