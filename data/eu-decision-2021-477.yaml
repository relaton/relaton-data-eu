    és állati eredetű termékekben előforduló szalmonellafertőzés ellenőrzésére
    irányuló nemzeti programok módosításainak jóváhagyásáról (az értesítés
    a C(2021) 1672. számú dokumentummal történt) (Csak a finn és a svéd nyelvű
    szöveg hiteles)
  type: main
- language: it
  script: Latn
