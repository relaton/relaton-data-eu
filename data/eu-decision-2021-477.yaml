title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/477 of 18 March 2021 approving
    amendments to the national programmes for the control of salmonella in certain
    live animals and products of animal origin submitted by Finland and Sweden (notified
    under document C(2021) 1672) (Only the Finnish and Swedish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/477 de la Commission du 18 mars 2021
    approuvant des modifications des programmes nationaux de contrôle des salmonelles
    pour certains animaux vivants et produits animaux présentées par la Finlande
    et la Suède [notifiée sous le numéro C(2021) 1672] (Les textes en langues finnoise
    et suédoise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/477 der Kommission vom 18. März 2021
    zur Genehmigung der Änderungen an den von Finnland und Schweden vorgelegten nationalen
    Programmen zur Bekämpfung von Salmonellen bei bestimmten lebenden Tieren und
    tierischen Erzeugnissen (Bekannt gegeben unter Aktenzeichen C(2021) 1672) (Nur
    der finnische und der schwedische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/477 на Комисията
    от 18 март 2021 година за одобрение на измененията
    в националните програми за контрол на салмонела
    при някои живи животни и продукти от животински
    произход, представени от Финландия и Швеция
    (нотифицирано под номер С(2021) 1672) (само текстовете
    на фински и шведски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/477 ze dne 18. března 2021,
    kterým se schvalují změny národních programů pro tlumení salmonel u některých
    živých zvířat a produktů živočišného původu předložené Finskem a
    Švédskem (oznámeno pod číslem C(2021) 1672) (Pouze finské a švédské znění
    je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/477 af 18. marts 2021
    om godkendelse af ændringer af de nationale programmer for bekæmpelse af salmonella
    hos visse levende dyr og i animalske produkter, som Finland og Sverige har forelagt
    (meddelt under nummer C(2021) 1672) (Kun den finske og den svenske udgave er autentiske)
  type: main
- language: el
  script: Grek
