  content: Commission Regulation (EEC) No 273/82 of 4 February 1982 continuing the
    measures referred to in Regulation (EEC) No 1993/78 on technical assistance for
    the development of the use and consumption of milk products of Community origin
    outside the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 273/82 de la Commission, du 4 février 1982, relatif
    à la poursuite des actions visées au règlement (CEE) n° 1993/78 concernant
    les aides techniques destinées au développement de l' utilisation et de la consommation
    de produits laitiers d' origine communautaire à l' extérieur de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 273/82 der Kommission vom 4. Februar 1982 zur Fortführung
    der Aktionen gemäß der Verordnung (EWG) Nr. 1993/78 über technische Hilfen
    zwecks Steigerung der Verwertung und des Verbrauchs außerhalb der Gemeinschaft
    von Milcherzeugnissen aus der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 273/82 af 4. februar 1982 om videreførelse
    af de i forordning (EØF) nr. 1993/78 omhandlede foranstaltninger, hvorved anvendelse
    og forbrug uden for Fællesskabet af mejeripodukter af fællesskabsoprindelse
    fremmes gennem teknisk bistand
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 273/82 τής Επιτροπής τής
