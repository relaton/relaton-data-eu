title:
- language: en
  script: Latn
  content: '79/988/EEC: Council Decision of 20 November 1979 concerning the conclusion
    of the Agreement in the form of two exchanges of letters, one providing for the
    provisional application of the Agreement between the European Economic Community
    and the Government of Sweden on certain measures for the purpose of promoting
    the reproduction of salmon in the Baltic Sea, and one concerning the application
    in 1979 of that Agreement'
  type: main
- language: fr
  script: Latn
  content: '79/988/CEE: Décision du Conseil, du 20 novembre 1979, concernant la conclusion
    de l'' accord sous forme de deux échanges de lettres, l'' un prévoyant l'' application
    provisoire d'' un accord entre la Communauté économique européenne et le gouvernement
    de la Suède relatif à certaines mesures destinées à promouvoir la reproduction
    du saumon dans la mer Baltique, et l'' autre concernant l'' application pour 1979
    de cet accord'
  type: main
- language: de
  script: Latn
  content: '79/988/EWG: Beschluß des Rates vom 20. November 1979 über den Abschluß
    des Abkommens in Form zweier Briefwechsel, von denen einer die vorläufige Anwendung
    des Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    von Schweden über bestimmte Maßnahmen zur Förderung der Lachsvermehrung in
    der Ostsee und der andere die Anwendung dieses Abkommens im Jahr 1979 betrifft'
  type: main
- language: da
  script: Latn
  content: '79/988/EØF: Rådets afgørelse af 20. november 1979 om indgåelse af
    aftalen i form af to brevvekslinger, den ene om midlertidig anvendelse af aftalen
    mellem Det europæiske økonomiske Fællesskab og Sveriges regering om visse foranstaltninger
    til forøgelse af laksebestanden i Østersøen og den anden om anvendelse af denne
    aftale i 1979'
  type: main
- language: it
  script: Latn
  content: '79/988/CEE: Decisione del Consiglio, del 20 novembre 1979, relativa alla
    conclusione dell'' accordo in forma di due scambi di lettere, l'' uno concernente
    l'' applicazione provvisoria dell'' accordo tra la Comunità economica europea
    e il governo della Svezia concernente talune misure volte a promuovere la riproduzione
    dei salmoni nel Mar Baltico e l'' altro concernente l'' applicazione di tale accordo
    nel 1979'
  type: main
- language: nl
  script: Latn
  content: '79/988/EEG: Besluit van de Raad van 20 november 1979 betreffende de sluiting
    van de Overeenkomst in de vorm van twee briefwisselingen, één met betrekking
    tot de voorlopige toepassing van de Overeenkomst tussen de Europese Economische
    Gemeenschap en de Regering van Zweden inzake bepaalde maatregelen ter bevordering
    van de reproduktie van zalm in de Oostzee, en een andere met betrekking tot de
    toepassing van die Overeenkomst in 1979'
  type: main
