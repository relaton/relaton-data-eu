title:
- language: en
  script: Latn
  content: '1999/538/EC: Commission Decision of 26 July 1999 amending Decision 98/371/EC
    concerning the animal health conditions and veterinary certifications form imports
    of fresh meat from certain European countries to take into account some aspects
    in relation with Bulgaria and the Czech Republic (notified under document number
    C(1999) 2436)'
  type: main
- language: fr
  script: Latn
  content: '1999/538/CE: Décision de la Commission du 26 juillet 1999 modifiant la
    décision 98/371/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays européens afin de tenir compte de certains aspects concernant la
    Bulgarie et la République tchèque [notifiée sous le numéro C(1999) 2436]'
  type: main
- language: de
  script: Latn
