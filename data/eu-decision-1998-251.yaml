title:
- language: en
  script: Latn
  content: '98/251/EC: Commission Decision of 21 May 1997 on the proposal of Austria
    to award aid to the Hoffmann-La Roche company for the development of the drug
    ''Orlistat'', designed for the treatment of pathological obesity (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/251/CE: Décision de la Commission du 21 mai 1997 relative à une aide
    que l''Autriche projette d''accorder à l''entreprise Hoffmann-La Roche pour le
    développement de l''«Orlistat», médicament destiné à traiter l''obésité
    pathologique (adiposité) (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/251/EG: Entscheidung der Kommission vom 21. Mai 1997 über eine von
    Österreich geplante Beihilfe zugunsten der Firma Hoffmann-La Roche für die Entwicklung
    des zur Behandlung der krankhaften Fettleibigkeit (Adipositas) bestimmten Arzneimittels
    "Orlistat" (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/251/EF: Kommissionens beslutning af 21. maj 1997 om en af Østrig planlagt
    støtte til fordel for firmaet Hoffmann-La Roche med henblik på udvikling af
    lægemidlet »Orlistat« til behandling af fedtsyge (adipositas) (Kun den tyske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '98/251/ΕΚ: Απόφαση της Επιτροπής της 21ης Μαΐου
    1997 σχετικά με ενίσχυση που προτίθεται να χορηγήσει
    η Αυστρία στην Hoffmann-La Roche όσον αφορά την παρασκευή
    του φαρμάκου «Orlistat» για τη θεραπεία της παθολογικής
    παχυσαρκίας (υπερλίπωσης) (Το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 21 päivänä toukokuuta 1997, Itävallan suunnitelmasta
    myöntää yritykselle Hoffmann-La Roche tukea sairaalloisen lihavuuden (adipositas)
    hoitoon tarkoitetun lääkkeen, Orlistatin, kehittämistä varten (Ainoastaan
    saksankielinen teksti on todistusvoimainen)
  type: main
- language: it
  script: Latn
  content: '98/251/CE: Decisione della Commissione del 21 maggio 1997 relativa ad
    un aiuto che l''Austria intende accordare all''impresa Hoffmann-La Roche per lo
    sviluppo del farmaco contro l''obesità patologica (adiposità) «Orlistat» (Il
    testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '98/251/EG: Beschikking van de Commissie van 21 mei 1997 betreffende voorgenomen
    steun van Oostenrijk aan Hoffmann-La Roche voor de ontwikkeling van "Orlistat",
    een geneesmiddel voor de behandeling van ziekelijke zwaarlijvigheid (adipositas)
    (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '98/251/CE: Decisão da Comissão de 21 de Maio de 1997 relativa a uma
