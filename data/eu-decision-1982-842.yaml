  content: '82/842/EEC: Commission Decision of 30 November 1982 establishing that
    the apparatus described as ''SPEX - Compudrive Czerny-Turner Spectrometer, model
    1704'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/842/CEE: Décision de la Commission, du 30 novembre 1982, constatant
