    fruit and vegetable products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2246/88 du Conseil du 19 juillet 1988 modifiant le
    règlement (CEE) n° 989/84 instaurant un système de seuils de garantie pour
    certains produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2246/88 DES RATES vom 19. Juli 1988 zur Änderung
