title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1493/76 of 24 June 1976 suspending the application
    of the condition to which imports of certain citrus fruit originating in Morocco
    or Tunisia are subject under the Association Agreements between the Community
    and each of those countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1493/76 du Conseil, du 24 juin 1976, portant suspension
    de l'application de la condition à laquelle est soumise l'importation dans la
    Communauté de certains agrumes originaires du Maroc et de Tunisie, en vertu des
    accords d'association entre la Communauté et chacun de ces pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1493/76 des Rates vom 24. Juni 1976 zur Aussetzung
    der Bedingung, der die Einfuhr bestimmter Zitrusfrüchte mit Ursprung in Marokko
    und Tunesien in die Gemeinschaft gemäß den Assoziierungsabkommen zwischen der
    Gemeinschaft und jedem dieser Länder unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1493/76 af 24. juni 1976 om suspension af
    anvendelsen af den betingelse, som indførselen til Fællesskabet af visse citrusfrugter
    med oprindelse i Marokko og Tunesien er undergivet i medfør af associeringsaftalen
    mellem Fællesskabet og hvert af disse lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1493/76 του Συμβουλίου
    της 24ης Ιουνίου 1976 περί αναστολής της εφαρμογής
    του όρου, στον οποίο υπόκειται η εισαγωγή εντός
    της Κοινότητας ορισμένων εσπεριδοειδών προελεύσεως
    του Μαρόκου και της Τυνησίας, δυνάμει των συμφωνιών
    συνδέσεως μεταξύ της Κοινότητας και καθεμιάς
    από τις χώρες αυτές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1493/76, annettu 24 päivänä kesäkuuta 1976,
    tiettyjen Marokosta ja Tunisiasta peräisin olevien sitrushedelmien tuontia koskevan
    edellytyksen soveltamisen lykkäämisestä yhteisön ja kummankin maan välisen
    assosiaatiosopimuksen nojalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1493/76 del Consiglio, del 24 giugno 1976, che sospende
    l'applicazione delle condizioni cui è soggetta l'importazione nella Comunità
    di determinati agrumi originari del Marocco e della Tunisia, in virtù degli accordi
    di associazione tra la Comunità e ciascuno di tali paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1493/76 van de Raad van 24 juni 1976 houdende schorsing
    van de toepassing van de voorwaarde die krachtens de Associatieovereenkomsten
    tussen de Gemeenschap en Marokko en Tunesië geldt bij invoer in de Gemeenschap
    van bepaalde citrusvruchten van oorsprong uit die landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1493/76 do Conselho, de 24 de Junho de 1976, que
    estabelece a suspensão da aplicação a que está submetida na Comunidade a importação
    de certos citrinos originários de Marrocos e da Tunísia por força dos Acordos
    de Associação celebrados entre a Comunidade e cada um destes países
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1493/76 del Consejo, de 24 de junio de 1976, por el
    que se suspende la aplicación de la condición a la que está sometida la importación
    en la Comunidad de determinados cítricos originarios de Marruecos y de Túnez
    en virtud de los Acuerdos de asociación entre la Comunidad y cada uno de estos
    países
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1493/76 av den 24 juni 1976 om upphävande
