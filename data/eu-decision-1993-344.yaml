    nõuete kohta registreeritud hobuste impordil, ajutisel impordil ja korduval sissetoomisel
    Katarist ning muudetakse otsust 79/542/EMÜ
  type: main
- language: fi
  script: Latn
  content: '93/344/ETY: Komission päätös, tehty 17 päivänä toukokuuta 1993,
    neuvoston päätöksen 79/542/ETY ja komission päätösten 92/260/ETY, 93/195/ETY
    ja 93/197/ETY muuttamisesta rekisteröityjen hevosten tuonnissa, väliaikaisessa
    maahantuonnissa ja takaisintuonnissa Qatarista sovellettavien eläinten terveyttä
    koskevien vaatimusten osalta ja muista päätökseen 79/542/ETY tehtävistä muutoksista'
  type: main
- language: hr
  script: Latn
  content: '93/344/EEZ: Odluka Komisije od 17. svibnja 1993. o izmjeni Odluke Vijeća
    79/542/EEZ i odluka Komisije 92/260/EEZ, 93/195/EEZ i 93/197/EEZ u pogledu uvjeta
    zdravlja životinja za uvoz, privremeni ulazak i ponovni ulaz registriranih konja
    iz Katara, te o daljnjim izmjenama Odluke 79/542/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság 93/344/EGK határozata (1993. május 17.) a törzskönyvezett
    lovak Katarból történő behozatalára, ideiglenes és újbóli beléptetésére
    irányadó állat-egészségügyi feltételek tekintetében a 79/542/EGK tanácsi
    határozat, valamint a 92/260/EGK, a 93/195/EGK és a 93/197/EGK bizottsági határozat
    módosításáról és a 79/542/EGK határozat további módosításáról
  type: main
- language: it
  script: Latn
  content: '93/344/CEE: Decisione della Commissione del 17 maggio 1993 recante modifica
    delle decisioni 79/542/CEE del Consiglio e 92/260/CEE, 93/195/CEE e 93/197/CEE
    della Commissione, nonché ulteriori modifiche della decisione 79/542/CEE in ordine
    alle condizioni di polizia sanitaria a cui sono subordinate l''importazione, l''ammissione
    temporanea e la reintroduzione di cavalli registrati in provenienza dal Qatar'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1993. gada 17. maijs), ar ko groza Padomes Lēmumu 79/542/EEK
    un Komisijas Lēmumus 92/260/EEK, 93/195/EEK un 93/197/EEK attiecībā uz dzīvnieku
    veselības nosacījumiem reģistrētu zirgu ievešanai, pagaidu ievešanai un
    atpakaļievešanai pēc pagaidu izvešanas no Kataras, un turpmāk groza Lēmumu
    79/542/EEK
  type: main
- language: lt
  script: Latn
  content: 1993 m. gegužės 17 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    sprendimą 79/542/EEB ir Komisijos sprendimus 92/260/EEB, 93/195/EEB ir 93/197/EEB
    dėl registruotų arklių iš Kataro importo, laikino įvežimo ir pakartotinio
    įvežimo gyvūnų sveikatos reikalavimų ir toliau iš dalies keičiantis Sprendimą
    79/542/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-17 ta' Mejju 1993 li temenda d-Deċiżjoni
    tal-Kunsill 79/542/KEE u d-Deċiżjonijiet tal-Kummissjoni 92/260/KEE, 93/195/KEE
    u 93/197/KEE rigward il-kondizzjonijiet sanitarji ta' l-annimali għall-importazzjoni,
    id-dħul temporanju u d-dħul mill-ġdid taż-żwiemel irreġistrati mill-Qatar,
    u wkoll li temenda d-Deċiżjoni 79/542/KEE
  type: main
- language: nl
  script: Latn
  content: '93/344/EEG: Beschikking van de Commissie van 17 mei 1993 tot wijziging
    van Beschikking 79/542/EEG van de Raad en de Beschikkingen 92/260/EEG, 93/195/EEG
    en 93/197/EEG van de Commissie met betrekking tot de veterinairrechtelijke voorschriften
    voor invoer, tijdelijke toelating en opnieuw binnenbrengen van geregistreerde
    paarden uit Qatar en tot verdere wijziging van Beschikking 79/542/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 17 maja 1993 r. zmieniająca decyzję Rady 79/542/EWG
    i decyzje Komisji 92/260/EWG, 93/195/EWG i 93/197/EWG w odniesieniu do warunków
    zdrowotnych zwierząt przy przywozie, odprawie czasowej i powrotnym wwozie zarejestrowanych
    koni z Kataru, a ponadto zmieniająca decyzję 79/542/EWG
  type: main
- language: pt
  script: Latn
  content: '93/344/CEE: Decisão da Comissão de 17 de Maio de 1993 que altera as
    decisões 79/542/CEE do Conselho e 92/260/CEE, 93/195/CEE e 93/197/CEE da Comissão
    no que respeita às condições de polícia sanitária aplicáveis às importações,
    admissões temporárias e reintroduções de cavalos registados do Qatar e que
    introduz outras alterações à Decisão 79/542/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 17 mai 1993 de modificare a Deciziei 79/542/CEE a
    Consiliului și a Deciziilor 92/260/CEE, 93/195/CEE și 93/197/CEE ale Comisiei
    în ceea ce privește condițiile de sănătate animală care se aplică importurilor,
    admiterilor temporare și reintroducerilor de cai înregistrați în Qatar și
    privind alte modificări ale Deciziei 79/542/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 17. mája 1993, ktorým sa mení a dopĺňa rozhodnutie
    Rady 79/542/EHS a rozhodnutia Komisie 92/260/EHS, 93/195/EHS a 93/197/EHS, pokiaľ
    ide o podmienky týkajúce sa zdravia zvierat pre dovoz, dočasný vstup a opakovaný
    vstup registrovaných koní z Kataru a ktorým sa ďalej mení a dopĺňa rozhodnutie
    79/42/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 17. maja 1993 o spremembi Odločbe Sveta 79/542/EGS
    ter odločb Komisije 92/260/EGS, 93/195/EGS in 93/197/EGS glede pogojev zdravstvenega
    varstva živali za uvoz, začasni uvoz in ponovni vstop registriranih konjev iz
    Katarja ter nadaljnji spremembi Odločbe 79/542/EGS
  type: main
- language: es
  script: Latn
  content: '93/344/CEE: Decisión de la Comisión de 17 de mayo de 1993 por la que
    se modifican la Decisión 79/542/CEE del Consejo y las Decisiones 92/260/CEE,
    93/195/CEE y 93/197/CEE de la Comisión con respecto a las condiciones de policía
    sanitaria aplicables a la importación, admisión temporal y re introducción
    de caballos registrados de Qatar y por la que se introducen otras modificaciones
    en la Decisión 79/542/CEE'
  type: main
- language: sv
  script: Latn
  content: '93/344/EEG: Kommissionens beslut av den 17 maj 1993 om ändring av rådets
    beslut 79/542/EEG och kommissionens beslut 92/260/EEG, 93/195/EEG och 93/197/EEG
    vad gäller djurhälsovillkoren för import, tillfällig införsel och återinförsel
    av registrerade hästar från Qatar, och om ytterligare ändring av beslut 79/542/EEG'
  type: main
