title:
- language: en
  script: Latn
  content: '93/344/EEC: Commission Decision of 17 May 1993 amending Council Decision
    79/542/EEC and Commission Decisions 92/260/EEC, 93/195/EEC and 93/197/EEC with
    regard to the animal health conditions for the importation, temporary admission
    and re-entry of registered horses from Qatar, and further amending Decision 79/542/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/344/CEE: Décision de la Commission du 17 mai 1993 modifiant la décision
    79/542/CEE du Conseil et les décisions 92/260/CEE, 93/195/CEE et 93/197/CEE de
    la Commission en ce qui concerne les conditions de police sanitaire applicables
    aux importations, admissions temporaires et réintroductions de chevaux enregistrés
    du Qatar et portant d''autres modifications à la décision 79/542/CEE'
  type: main
- language: de
  script: Latn
  content: '93/344/EWG: Entscheidung der Kommission vom 17. Mai 1993 zur Änderung
    der Entscheidung 79/542/EWG des Rates und der Entscheidungen 92/260/EWG, 93/195/EWG
    und 93/197/EWG der Kommission hinsichtlich der tierseuchenrechtlichen Vorschriften
    für die Einfuhr, die zeitweilige Zulassung und die Wiedereinfuhr von registrierten
    Pferden aus Katar sowie zur weiteren Änderung der Entscheidung 79/542/EWG'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 17 май 1993 година
    за изменение на Решение 79/542/ЕИО на Съвета и
    Решения 92/260/ЕИО, 93/195/ЕИО и 93/197/ЕИО на Комисията
    относно ветеринарно-санитарните изисквания
    за внос, временното допускане и повторно въвеждане
    на регистрирани коне от Катар, и за допълнителни
    изменения на Решение 79/542/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. května 1993, kterým se mění rozhodnutí
    Rady 79/542/EHS a rozhodnutí Komise 92/260/EHS, 93/195/EHS a 93/197/EHS, pokud
    jde o veterinární podmínky pro dovoz, dočasný dovoz a zpětný dovoz evidovaných
    koní z Kataru a kterým se provádějí jiné změny rozhodnutí 79/542/EHS
  type: main
- language: da
  script: Latn
  content: '93/344/EØF: Kommissionens beslutning af 17. maj 1993 om ændring af Rådets
    beslutning 79/542/EØF og Kommissionens beslutning 92/260/EØF, 93/195/EØF og
    93/197/EØF for så vidt angår dyresundhedsmæssige betingelser for indførsel,
    midlertidig indførsel og genindførsel af registrerede heste fra Qatar samt om
    yderligere ændring af beslutning 79/542/EØF'
  type: main
- language: el
  script: Grek
  content: '93/344/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Μαΐου 1993 για την τροποποίηση της απόφασης 79/542/ΕΟΚ
    του Συμβουλίου και των αποφάσεων 92/260/ΕΟΚ, 93/195/ΕΟΚ
    και 93/197/ΕΟΚ της Επιτροπής σχετικά με τις συνθήκες
    υγιεινής των ζώων κατά την εισαγωγή, την προσωρινή
    εισαγωγή και την επανεισαγωγή καταχωρημένων
    ίππων από το Κατάρ, καθώς και την περαιτέρω
    τροποποίηση της απόφασης'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 17. mai 1993, millega muudetakse nõukogu otsust 79/542/EMÜ
