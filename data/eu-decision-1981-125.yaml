title:
- language: en
  script: Latn
  content: '81/125/EEC: Commission Decision of 16 February 1981 amending for the fifth
    time Decision 78/360/EEC authorizing several Member States to sell butter at a
    reduced price in the form of concentrated butter (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/125/CEE: Décision de la Commission, du 16 février 1981, portant cinquième
    modification de la décision 78/360/CEE autorisant plusieurs États membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Le texte en
    langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/125/EWG: Entscheidung der Kommission vom 16. Februar 1981 zur fünften
    Änderung der Entscheidung 78/360/EWG zur Ermächtigung einiger Mitgliedstaaten,
    Butter in Form von Butterreinfett zu ermäßigten Preisen zu verkaufen (Nur der
    deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/125/EØF: Kommissionens beslutning af 16. februar 1981 om femte ændring
    af beslutning 78/360/EØF om bemyndigelse til flere medlemsstater til at sælge
    smør til nedsat pris i form af koncentreret smør (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/125/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Φεβρουαρίου 1981 περί πέμπτης τροποποίησης της
    απόφασης 78/360/ΕΟΚ που επιτρέπει σε ορισμένα
    κράτη μέλη να πωλούν το βούτυρο υπό μορφή συμπυκνωμένου
    βουτύρου σε μειωμένη τιμή (Το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/125/CEE: Decisione della Commissione, del 16 febbraio 1981, recante
    quinta modifica della decisione 78/360/CEE che autorizza alcuni Stati membri a
    vendere burro a prezzo ridotto sotto forma di burro concentrato (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/125/EEG: Beschikking van de Commissie van 16 februari 1981 houdende
    vijfde wijziging van Beschikking 78/360/EEG tot machtiging van verschillende Lid-Staten
    om boter tegen verlaagde prijs in de vorm van boterconcentraat te verkopen (Slechts
    de tekst in de Duitse taal is authentiek)'
