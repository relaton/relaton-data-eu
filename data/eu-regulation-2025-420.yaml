  script: Latn
  content: Commission Delegated Regulation (EU) 2025/420 of 16 December 2024 supplementing
    Regulation (EU) 2022/2554 of the European Parliament and of the Council with regard
    to regulatory technical standards to specify the criteria for determining the
    composition of the joint examination team ensuring a balanced participation of
    staff members from the ESAs and from the relevant competent authorities, their
    designation, tasks and working arrangements
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/420 de la Commission du 16 décembre 2024
    complétant le règlement (UE) 2022/2554 du Parlement européen et du Conseil
    par des normes techniques de réglementation en ce qui concerne les critères
    pour déterminer la composition de l’équipe d’examen conjoint en vue de garantir
    une participation équilibrée des membres du personnel des AES et des autorités
    compétentes concernées, leur désignation, leurs tâches et leurs modalités
    de travail
  type: main
