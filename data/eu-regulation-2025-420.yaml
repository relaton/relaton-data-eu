    für die Festlegung der Zusammensetzung des gemeinsamen Untersuchungsteams, bei
    der eine ausgewogene Beteiligung der Mitarbeiter der ESA und der jeweils zuständigen
    Behörden sicherzustellen ist, sowie ihrer Benennung, Aufgaben und Arbeitsvereinbarungen
