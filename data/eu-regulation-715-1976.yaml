  content: Commission Regulation (EEC) No 715/76 of 29 March 1976 fixing the rates
    of the refunds applicable from 1 April 1976 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 715/76 de la Commission, du 29 mars 1976, fixant les
