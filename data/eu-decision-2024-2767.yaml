- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2767 of 30 October 2024 determining,
    pursuant to Regulation (EU) 2024/573 of the European Parliament and of the Council,
    reference values for the period from 1 January 2025 to 31 December 2026 for each
    producer or importer which has lawfully placed hydrofluorocarbons on the Union
    market from 1 January 2021 to 31 December 2023 (notified under document C(2024)
    8500)
  type: main
- language: fr
