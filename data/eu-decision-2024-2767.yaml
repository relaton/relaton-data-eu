    2025 au 31 décembre 2026 pour chaque producteur ou importateur ayant légalement
    mis sur le marché de l’Union des hydrofluorocarbones du 1er janvier 2021 au
    31 décembre 2023 [notifiée sous le numéro C(2024) 8500]
  type: main
