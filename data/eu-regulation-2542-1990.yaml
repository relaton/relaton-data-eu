title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2542/90 of 31 August 1990 reintroducing
    the levying of the customs duties applicable to nightshirts, pyjamas, bathrobes,
    knitted or crocheted, products of the category No 24 (order No 40.0240), women's
    or girls'dresses products of category No 26 (order No 40.0260) originating in
    Indonesia, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2542/90 de la Commission du 31 août 1990 portant
    rétablissement de la perception des droits de douane applicables aux chemises
    de nuit, pyjamas, peignoirs de bain en bonneterie de la catégorie de produits
    n° 24 (numéro d'ordre 40.0240) et aux robes pour femmes ou fillettes de la catégorie
    de produits n° 26 (numéro d'ordre 40.0260) originaires de l'Indonésie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2542/90 DER KOMMISSION vom 31. August 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Nachthemden, Schlafanzuege, Bademaentel
    und -jacken aus Gewirken der Warenkategorie Nr. 24 (laufende Nummer 40.0240) und
    Kleider fuer Frauen und Maedchen der Warenkategorie Nr. 26 (laufende Nummer 40.0260)
    mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3897/89 des Rates
    vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2542/90 af 31. august 1990 om genindførelse
    af opkrævning af toldafgifter for pyjamas og anden natbeklædning, badekåber
    af trikotage, under varekategori 24 (løbenummer 40.0240), og kjoler til kvinder,
    under varekategori 26 (løbenummer 40.0260), som har oprindelse i Indonesien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2542/90 της Επιτροπής
    της 31ης Αυγούστου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών στα νυχτικά,
    πιζάμες, ρόμπες λουτρού και παρόμοια είδη της
    κατηγορίας των προϊόντων αριθ. 24 ( αύξων αριθ.
    40.0240 ), και στα φορέματα για γυναίκες ή κορίτσια
    της κατηγορίας των προϊόντων αριθ. 26 ( αύξων
    αριθμός 40.0260 ) καταγωγής Ινδονησίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3897/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2542/90 DELLA COMMISSIONE del 31 agosto 1990 che ripristina
    la riscossione dei dazi doganali applicabili alle camicie da notte, pigiami, accappatoi
    da bagno a maglia, della categoria di prodotti n. 24 (numero d'ordine 40.0240)
    e agli abiti interi per donna o per ragazza della categoria di prodotti n. 26
    (numero d'ordine 40.0260) originari dell'Indonesia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2542/90 VAN DE COMMISSIE van 31 augustus 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op nachthemden,
    pyjama's en badjassen, van brei- of haakwerk, van de categorie van produkten nr.
    24 (volgnummer 40.0240), en op japonnen voor dames en meisjes, van de categorie
    van produkten nr. 26 (volgnummer 40.0260), van oorsprong uit Indonesië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3897/89
    van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2542/90 DA COMISSAO de 31 de Agosto de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis às camisas de noite, pijamas,
    robes, roupoes de banho, em malha, da categoria de produtos n* 24 (numero de ordem
    40.0240), roupoes para senhoras ou raparigas, da categoria de produtos n* 26 (numero
    de ordem 40.0260), originarios da Indonésia, beneficiaria das preferências pautais
    previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2542/90 DE LA COMISION de 31 de agosto de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a los pijamas de punto de la categoria de productos numero 24 (numero de orden
    40.0240) y vestidos para mujeres o ninas de la categoria de productos numero 26
    (numero de orden 40.0260) originarios de Indonesia beneficiaria de las preferencias
    arancelarias previstas por el Reglamento (CEE) no 3897/89 del Consejo
  type: main
