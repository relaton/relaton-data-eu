  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 631/2004 ze dne 31.
    března 2004, kterým se mění nařízení Rady (EHS) č. 1408/71 o uplatňování
    systémů sociálního zabezpečení na zaměstnané osoby, osoby samostatně
    výdělečně činné a jejich rodinné příslušníky pohybující se v rámci
    Společenství a nařízení Rady (EHS) č. 574/72, kterým se stanoví prováděcí
    pravidla k nařízení (EHS) č. 1408/71, pokud jde o vyrovnání nároků a zjednodušení
    postupů (Text s významem pro EHP a Švýcarsko)
  type: main
