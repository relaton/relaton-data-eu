    shēmu piemērošanu darbiniekiem, pašnodarbinātām personām un viņu ģimenes
    locekļiem, kas pārvietojas kopienā, un Padomes Regulu (EEK) Nr. 574/72, ar
    kuru nosaka īstenošanas kārtību regulai (EEK) nr. 1408/71, saistībā ar tiesību
    pielīdzināšanu un procedūru vienkāršošanu (Dokuments attiecas uz eez un
    šveici)
  type: main
