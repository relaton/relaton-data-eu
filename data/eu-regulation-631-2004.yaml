    apsaugos sistemų taikymo pagal darbo sutartį dirbantiems asmenims, savarankiškai
    dirbantiems asmenims ir jų šeimos nariams, judantiems Bendrijoje, ir Tarybos
    reglamentą (EEB) Nr. 574/72, nustatantį Reglamento (EEB) Nr. 1408/71 įgyvendinimo
    tvarką, dėl teisių suderinimo ir tvarkos supaprastinimo (Tekstas svarbus EEE
    ir Šveicarijai)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament (KE) Nru 631/2004 tal-parlament ewropew u tal-kunsill tal-31
