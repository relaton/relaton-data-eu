  script: Latn
  content: Regulamento (CE) n.° 631/2004 do Parlamento Europeu e do Conselho, de
    31 de Março de 2004, que altera o Regulamento (CEE) n.° 1408/71 do Conselho
    relativo à aplicação dos regimes de segurança social aos trabalhadores assalariados,
    aos trabalhadores não assalariados e aos membros da sua família que se deslocam
    no interior da Comunidade e o Regulamento (CEE) n.° 574/72 do Conselho que estabelece
