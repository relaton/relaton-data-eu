  script: Latn
  content: Regolamento (CE) n. 631/2004 del Parlamento europeo e del Consiglio, del
    31 marzo 2004, che modifica il regolamento (CEE) n. 1408/71 del Consiglio relativo
    all'applicazione dei regimi di sicurezza sociale ai lavoratori subordinati, ai
    lavoratori autonomi e ai loro familiari che si spostano all'interno della Comunità
    e il regolamento (CEE) n. 574/72 del Consiglio che stabilisce le modalità di
    applicazione del regolamento (CEE) n. 1408/71, per quanto riguarda l'allineamento
    dei diritti e la semplificazione delle procedure (Testo rilevante ai fini del
    SEE e per la Svizzera)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 631/2004 (2004. gada 31.
