title:
- language: en
  script: Latn
  content: Regulation (EC) No 631/2004 of the European Parliament and of the Council
    of 31 March 2004 amending Council Regulation (EEC) No 1408/71 on the application
    of social security schemes to employed persons, to self-employed persons and to
    members of their families moving within the Community, and Council Regulation
    (EEC) No 574/72 laying down the procedure for implementing Regulation (EEC) No
    1408/71, in respect of the alignment of rights and the simplification of procedures
    (Text with relevance for the EEA and for Switzerland)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 631/2004 du Parlement européen et du Conseil du 31
    mars 2004 modifiant le règlement (CEE) n° 1408/71 du Conseil relatif à l'application
    des régimes de sécurité sociale aux travailleurs salariés, aux travailleurs
    non salariés et aux membres de leur famille qui se déplacent à l'intérieur
    de la Communauté, et le règlement (CEE) n° 574/72 du Conseil fixant les modalités
    d'application du règlement (CEE) n° 1408/71, en ce qui concerne l'alignement
    des droits et la simplification des procédures (Texte présentant de l'intérêt
    pour l'EEE et pour la Suisse)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 631/2004 des Europäischen Parlaments und des Rates
