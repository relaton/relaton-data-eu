    ao alinhamento dos direitos e simplificação dos procedimentos (Texto relevante
    para efeitos do EEE e para a Suíça)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 631/2004 al Parlamentului European și al Consiliului
    din 31 martie 2004 de modificare a Regulamentului (CEE) nr. 1408/71 al Consiliului
    privind aplicarea regimurilor de securitate socială în raport cu lucrătorii
    salariați, cu lucrătorii care desfășoară activități independente și cu
    membrii familiilor acestora care se deplasează în cadrul Comunității și a
    Regulamentului (CEE) nr. 574/72 al Consiliului de stabilire a normelor de aplicare
    a Regulamentului (CEE) nr. 1408/71 în ceea ce privește alinierea drepturilor
    și simplificarea procedurilor (Text cu relevanță pentru SEE și pentru Elveția)
  type: main
