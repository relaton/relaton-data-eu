    Anwendung der Systeme der sozialen Sicherheit auf Arbeitnehmer und Selbstständige
    sowie deren Familienangehörige, die innerhalb der Gemeinschaft zu- und abwandern,
    und der Verordnung (EWG) Nr. 574/72 des Rates über die Durchführung der Verordnung
    (EWG) Nr. 1408/71 bezüglich der Angleichung der Ansprüche und Vereinfachung
    der Verfahren (Text von Bedeutung für den EWR und die Schweiz)
  type: main
