  content: Reglamento (CE) n° 631/2004 del Parlamento Europeo y del Consejo, de 31
    de marzo de 2004, por el que se modifica el Reglamento (CEE) n° 1408/71 del Consejo
    relativo a la aplicación de los regímenes de Seguridad Social a los trabajadores
    por cuenta ajena, los trabajadores por cuenta propia y a los miembros de sus familias
