title:
- language: en
  script: Latn
  content: '93/30/EEC: Commission Decision of 16 December 1992 amending Decision 90/505/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of sawn wood of conifers originating
    in the USA (Only the Spanish, German, Greek, English, French, Italian, Dutch and
    Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/30/CEE: Décision de la Commission, du 16 décembre 1992, modifiant
    la décision 90/505/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    le bois scié de conifères originaires des Etats-Unis d''Amérique (Les textes
    en langues espagnole, allemande, grecque, anglaise, française, italienne, néerlandaise
    et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/30/EWG: Entscheidung der Kommission vom 16. Dezember 1992 zur Änderung
    der Entscheidung 90/505/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Nadelschnittholz mit Ursprung in den Vereinigen Staaten von Amerika Ausnahmen
    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur
    der spanische, deutsche, griechische, englische, französische, italienische,
    niederländische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/30/EØF: Kommissionens beslutning af 16. december 1992 om ændring
    af beslutning 90/505/EØF om bemyndigelse af visse medlemsstater til at indrømme
    undtagelser fra visse bestemmelser i Rådets direktiv 77/93/EØF for opskåret
    nåletræ med oprindelse i USA (Kun de spanske, tyske, græske, engelske, franske,
    italienske, nederlandske og portugisiske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '93/30/ΕΟΚ: Απόφαση της Επιτροπής της 16ης Δεκεμβρίου
    1992 για την τροποποίηση της απόφασης 91/107/ΕΟΚ
    η οποία επιτρέπει σε ορισμένα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    την πριστή ξυλεία κωνοφόρων καταγωγής Ηνωμένων
    Πολιτειών της Αμερικής (Τα κείμενα στην ισπανική,
    γερμανική, ελληνική, αγγλική, γαλλική, ιταλική,
    ολλανδική και πορτογαλική γλώσσα είναι τα
    μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '93/30/CEE: Decisione della Commissione, del 16 dicembre 1992, recante
    modifica della decisione 90/505/CEE, che autorizza alcuni Stati membri a prevedere
    deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio per
    quanto riguarda il legname di conifere originario degli Stati Uniti d''America
    (I testi in lingua spagnola, tedesca, greca, inglese, francese, italiana, olandese
    e portoghese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '93/30/EEG: Beschikking van de Commissie van 16 december 1992 houdende
    wijziging van Beschikking 90/505/EEG tot machtiging van een aantal Lid-Staten
    om voor gezaagd naaldhout van oorsprong uit de Verenigde Staten van Amerika afwijkingen
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Spaanse, Duitse, Griekse, Engelse, Franse, Italiaanse, Nederlandse
    en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/30/CEE: Decisão da Comissão, de 16 de Dezembro de 1992, que altera
    a Decisão 90/505/CEE, que autoriza certos Estados-membros a estabelecer derrogações
    de determinadas disposições da Directiva 77/93/CEE do Conselho em relação
    à madeira serrada de coníferas originária dos Estados Unidos da América (Apenas
    fazem fé os textos nas línguas espanhola, alemã, grega, inglesa, francesa,
    italiana, neerlandesa e portuguesa)'
  type: main
- language: es
  script: Latn
  content: '93/30/CEE: Decisión de la Comisión, de 16 de diciembre de 1992, que
    modifica la Decisión 90/505/CEE por la que se autoriza a algunos Estados miembros
    a establecer excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    del Consejo respecto de la madera aserrada de coníferas originaria de Estados
    Unidos de América (Los textos en lenguas alemana, griega, inglesa, francesa,
    italiana, neerlandesa y portuguesa son los únicos auténticos)'
  type: main
