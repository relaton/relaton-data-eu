id: EURegulation2016370
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/370 of 15 March 2016 approving
    the active substance pinoxaden, in accordance with Regulation (EC) No 1107/2009
    of the European Parliament and of the Council concerning the placing of plant
    protection products on the market, amending the Annex to Commission Implementing
    Regulation (EU) No 540/2011 and allowing the Member States to extend provisional
    authorisations granted for that active substance
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/370 de la Commission du 15 mars 2016
    portant approbation de la substance active «pinoxaden», conformément au règlement
    (CE) n° 1107/2009 du Parlement européen et du Conseil concernant la mise sur
    le marché des produits phytopharmaceutiques, modifiant l'annexe du règlement
    d'exécution (UE) n° 540/2011 de la Commission et autorisant les États membres
    à prolonger les autorisations provisoires accordées pour cette substance active
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/370 der Kommission vom 15. März 2016
    zur Genehmigung des Wirkstoffs Pinoxaden gemäß der Verordnung (EG) Nr. 1107/2009
    des Europäischen Parlaments und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln,
    zur Änderung des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
    sowie zur Ermächtigung der Mitgliedstaaten, vorläufige Zulassungen betreffend
    diesen Wirkstoff zu verlängern
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/370 на Комисията
    от 15 март 2016 година за одобряване на активното
    вещество пиноксаден в съответствие с Регламент
    (ЕО) № 1107/2009 на Европейския парламент и на Съвета
    относно пускането на пазара на продукти за
    растителна защита, за изменение на приложението
    към Регламент за изпълнение (ЕС) № 540/2011 на Комисията
    и за предоставяне на възможност на държавите
    членки да удължат временните разрешения, издадени
    за посоченото активно вещество
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/370 ze dne 15. března 2016,
    kterým se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009
    o uvádění přípravků na ochranu rostlin na trh schvaluje účinná látka
    pinoxaden, mění příloha prováděcího nařízení Komise (EU) č. 540/2011
    a umožňuje členským státům prodloužit dočasná povolení udělená pro
    uvedenou účinnou látku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/370 af 15. marts 2016
    om godkendelse af aktivstoffet pinoxaden, jf. Europa-Parlamentets og Rådets forordning
    (EF) nr. 1107/2009 om markedsføring af plantebeskyttelsesmidler, om ændring
    af bilaget til Kommissionens gennemførelsesforordning (EU) nr. 540/2011 og om
    medlemsstaternes forlængelse af midlertidige godkendelser af dette aktivstof
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/370 της Επιτροπής,
    της 15ης Μαρτίου 2016, για την έγκριση της δραστικής
    ουσίας pinoxaden, σύμφωνα με τον κανονισμό (ΕΚ) αριθ.
    1107/2009 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    σχετικά με τη διάθεση φυτοπροστατευτικών προϊόντων
    στην αγορά, για την τροποποίηση του παραρτήματος
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 540/2011
    της Επιτροπής και για να επιτραπεί στα κράτη
    μέλη να παρατείνουν τη διάρκεια των προσωρινών
    αδειών που έχουν χορηγηθεί για την εν λόγω
    δραστική ουσία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/370, 15. märts 2016, millega kiidetakse
    heaks toimeaine pinoksadeen vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1107/2009 taimekaitsevahendite turulelaskmise kohta, muudetakse komisjoni
    rakendusmääruse (EL) nr 540/2011 lisa ja lubatakse liikmesriikidel pikendada
    seda toimeainet hõlmavaid ajutisi lube
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/370, annettu 15 päivänä
    maaliskuuta 2016, tehoaineen pinoksadeeni hyväksymisestä kasvinsuojeluaineiden
    markkinoille saattamisesta annetun Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1107/2009 mukaisesti, komission täytäntöönpanoasetuksen (EU) N:o
    540/2011 liitteen muuttamisesta sekä jäsenvaltioiden mahdollisuudesta pidentää
    kyseistä tehoainetta koskevia väliaikaisia lupia
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/370 оd 15. ožujka 2016. o odobravanju
    aktivne tvari pinoksadena u skladu s Uredbom (EZ) br. 1107/2009 Europskog parlamenta
    i Vijeća o stavljanju na tržište sredstava za zaštitu bilja, o izmjeni Priloga
    Provedbenoj uredbi Komisije (EU) br. 540/2011 i o dopuštanju državama članicama
    da produlje privremena odobrenja izdana za tu aktivnu tvar
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/370 végrehajtási rendelete (2016. március 15.)
    a pinoxaden hatóanyagnak a növényvédő szerek forgalomba hozataláról szóló
    1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyásáról,
    az 540/2011/EU bizottsági végrehajtási rendelet mellékletének módosításáról
    és az említett hatóanyag ideiglenes engedélyeinek a tagállamok által történő
    meghosszabbításának engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/370 della Commissione, del 15 marzo
    2016, che approva la sostanza attiva pinoxaden in conformità al regolamento (CE)
    n. 1107/2009 del Parlamento europeo e del Consiglio relativo all'immissione sul
    mercato dei prodotti fitosanitari, modifica l'allegato del regolamento di esecuzione
    (UE) n. 540/2011 della Commissione e consente agli Stati membri di prorogare le
    autorizzazioni provvisorie concesse per tale sostanza attiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/370 (2016. gada 15. marts), ar
    ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1107/2009 par augu
    aizsardzības līdzekļu laišanu tirgū apstiprina darbīgo vielu pinoksadēnu,
    groza Komisijas Īstenošanas regulas (ES) Nr. 540/2011 pielikumu un atļauj dalībvalstīm
    pagarināt minētajai darbīgajai vielai piešķirto pagaidu atļauju periodu
  type: main
- language: lt
  script: Latn
  content: 2016 m. kovo 15 d. Komisijos įgyvendinimo reglamentas (ES) 2016/370, kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl augalų
    apsaugos produktų pateikimo į rinką patvirtinama veiklioji medžiaga pinoksadenas,
    iš dalies keičiamas Komisijos įgyvendinimo reglamento (ES) Nr. 540/2011 priedas
    ir valstybėms narėms leidžiama pratęsti šios veikliosios medžiagos laikinosios
    registracijos galiojimą
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/370 tal-15 ta'
    Marzu 2016 li japprova s-sustanza attiva pinoksaden, skont ir-Regolament (KE)
    Nru 1107/2009 tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta'
    prodotti għall-protezzjoni tal-pjanti, li jemenda l-Anness tar-Regolament ta'
    Implimentazzjoni tal-Kummissjoni (UE) Nru 540/2011 u li jippermetti lill-Istati
    Membri jestendu l-awtorizzazzjonijiet proviżorji mogħtija għal dik is-sustanza
    attiva
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/370 van de Commissie van 15 maart 2016
    tot goedkeuring van de werkzame stof pinoxaden overeenkomstig Verordening (EG)
    nr. 1107/2009 van het Europees Parlement en de Raad betreffende het op de markt
    brengen van gewasbeschermingsmiddelen, tot wijziging van de bijlage bij Uitvoeringsverordening
    (EU) nr. 540/2011 van de Commissie en ter verlening van toestemming aan de lidstaten
    om de geldigheidsduur van voorlopige toelatingen voor die werkzame stof te verlengen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/370 z dnia 15 marca 2016 r.
    w sprawie zatwierdzenia substancji czynnej pinoksaden, zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do
    obrotu środków ochrony roślin, zmiany załącznika do rozporządzenia wykonawczego
    Komisji (UE) nr 540/2011 oraz w sprawie zezwolenia państwom członkowskim na
    przedłużenie tymczasowych zezwoleń udzielonych na tę substancję czynną
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/370 da Comissão, de 15 de março de
    2016, que aprova a substância ativa pinoxadene, em conformidade com o Regulamento
    (CE) n.° 1107/2009 do Parlamento Europeu e do Conselho relativo à colocação
    dos produtos fitofarmacêuticos no mercado, e que altera o anexo do Regulamento
    de Execução (UE) n.° 540/2011 da Comissão e autoriza os Estados-Membros a
    prorrogar as autorizações provisórias concedidas para essa substância ativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/370 al Comisiei din 15 martie
    2016 de aprobare a substanței active pinoxaden, în conformitate cu Regulamentul
    (CE) nr. 1107/2009 al Parlamentului European și al Consiliului privind introducerea
    pe piață a produselor fitosanitare, de modificare a anexei la Regulamentul de
    punere în aplicare (UE) nr. 540/2011 al Comisiei și de acordare a permisiunii
    statelor membre să prelungească autorizațiile provizorii pentru substanța
    activă respectivă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/370 z 15. marca 2016, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh schvaľuje účinná látka
    pinoxaden, mení príloha k vykonávaciemu nariadeniu Komisie (EÚ) č. 540/2011
    a členským štátom povoľuje predĺženie platnosti dočasných autorizácií
    udelených pre uvedenú účinnú látku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/370 z dne 15. marca 2016 o odobritvi
    aktivne snovi pinoksaden v skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta
    in Sveta o dajanju fitofarmacevtskih sredstev v promet, o spremembi Priloge k
    Izvedbeni uredbi Komisije (EU) št. 540/2011 ter o dovoljenju državam članicam,
    da podaljšajo veljavnost začasnih registracij, ki so jih izdale za navedeno
    aktivno snov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/370 de la Comisión, de 15 de marzo
    de 2016, por el que se aprueba la sustancia activa pinoxaden, de conformidad con
    el Reglamento (CE) n.° 1107/2009 del Parlamento Europeo y del Consejo, relativo
    a la comercialización de productos fitosanitarios, se modifica el anexo del Reglamento
    de Ejecución (UE) n.° 540/2011 de la Comisión y se permite a los Estados miembros
    ampliar las autorizaciones provisionales concedidas en relación con esa sustancia
    activa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/370 av den 15 mars 2016
    om godkännande av det verksamma ämnet pinoxaden i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1107/2009 om utsläppande av växtskyddsmedel
    på marknaden, om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011 och om tillstånd för medlemsstaterna att förlänga provisoriska
    godkännanden som beviljats för detta verksamma ämne
