- language: en
  script: Latn
  content: Commission Regulation (EC) No 2847/94 of 23 November 1994 re-establishing
    the levying of customs duties on certain textile products originating in Indonesia,
    India, Pakistan, Thailand, the Philippines and Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2847/94 de la Commission du 23 novembre 1994 portant
    rétablissement de la perception des droits de douane applicables à certains
    produits textiles originaires d'Indonésie, d'Inde, du Pakistan, de Thaïlande,
    des Philippines et de Malaysia, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2847/94 DER KOMMISSION vom 23. November 1994 über
    die Wiedereinführung des Zollsatzes für bestimmte Textilwaren mit Ursprung in
    Indonesien, Indien, Pakistan, Thailand, den Philippinen und Malaysia, für die
    die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
