title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1912/80 of 16 July 1980 re-establishing
    the levying of customs duties on sewing machines, other, falling within subheading
    84.41 A I b) and originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1912/80 de la Commission, du 16 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à coudre, autres, de la sous-position 84.41 A I b) du tarif douanier commun,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1912/80 der Kommission vom 16. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Nähmaschinen, andere, der Tarifstelle 84.41 A I b), mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1912/80 af 16. juli 1980 om genindførelse
    af opkrævning af toldafgifter for symaskiner, andre, under position 84.41 A I
    b), som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1912/80 della Commissione, del 16 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine per cucire,
    altre, della sottovoce 84.41 A I b) della tariffa doganale comune, originarie
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1912/80 van de Commissie van 16 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op naaimachines,
    andere, van post 84.41 A I b), van oorsprong uit Zuid-Korea ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
