    kuuluvia lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1676/98 della Commissione del 29 luglio 1998 che stabilisce
