title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1676/98 of 29 July 1998 determining to what
    extent applications for the right to import for cows and heifers of certain mountain
    breeds lodged under Regulation (EC) NO 1143/98 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1676/98 de la Commission du 29 juillet 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 1143/98 relatif à l'importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1676/98 der Kommission vom 29. Juli 1998 zur Bestimmung
