    Höhenrassen gemäß der Verordnung (EG) Nr. 1143/98 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1676/98 af 29. juli 1998 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergtracer i henhold til forordning (EF) nr. 1143/98 kan imødekommes
  type: main
- language: el
  script: Grek
