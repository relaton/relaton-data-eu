  script: Latn
  content: '98/242/EC: Commission Decision of 20 March 1998 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of cyhalofop-butyl, pyraflufen-ethyl and azafenidin in
    Annex I to Council Directive 91/414/EEC concerning the placing of plant-protection
    products on the market'
  type: main
- language: fr
  script: Latn
