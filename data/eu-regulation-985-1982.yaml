title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 985/82 of 27 April 1982 specifying the extent
    to which applications lodged during the month of April 1982 for import licences
    in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 985/82 de la Commission, du 27 avril 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1982 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 985/82 der Kommission vom 27. April 1982 über das
    Ausmaß, in dem den im April 1982 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 985/82 af 27. april 1982 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1982 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 985/82 της Επιτροπής
    της 27ης Απριλίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο του 1982, για τα νεαρά
    άρρενα βοοειδή πού προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 985/82 della Commissione, del 27 aprile 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1982 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 985/82 van de Commissie van 27 april 1982 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 1982 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
