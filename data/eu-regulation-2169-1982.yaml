    Herstellung bestimmter Erzeugnisse im Vereinigten Königreich und in Irland sowie
    zur Festsetzung eines Beihilfebetrags für das Weinwirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2169/82 af 4. august 1982 om gennemførelsesbestemmelser
