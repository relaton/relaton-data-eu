title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2169/82 of 4 August 1982 laying down detailed
    rules implementing the system of aid for the use of concentrated grape must for
    the manufacture in the United Kingdom and Ireland of certain products and fixing
    the amounts of aid for the 1982/83 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2169/82 de la Commission, du 4 août 1982, portant
    modalités d' application du régime d' aide à l' utilisation de moûts de raisins
    concentrés en vue de la fabrication de certains produits au Royaume-Uni et en
    Irlande et fixant les montants de l' aide pour la campagne viticole 1982/1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2169/82 der Kommission vom 4. August 1982 mit Durchführungsbestimmungen
