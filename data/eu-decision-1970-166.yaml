title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 février 1970, autorisant la République
    italienne à exclure du traitement communautaire divers produits du secteur de
    la soie, originaires de certains pays tiers et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '70/166/EWG: Entscheidung der Kommission vom 17. Februar 1970, mit der
    die Italienische Republik ermächtigt wird, die aus bestimmten Drittländern stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen verschiedenen
    Produkte des Seidensektors von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/166/CEE: Decisione della Commissione, del 17 febbraio 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario determinati prodotti
    del settore della seta, originari di certi paesi terzi e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/166/EEG: Beschikking van de Commissie van 17 februari 1970 waarbij
    de Italiaanse Republiek wordt gemachtigd verscheidene produkten uit de zijdesector,
    van oorsprong uit bepaalde derde landen en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
