  type: main
- language: de
  script: Latn
  content: '72/409/EWG: Entscheidung der Kommission vom 22. November 1972 über die
    Erstattung der im Jahre 1971 für die Schlachtung von Kühen und die Nichtvermarktung
    von Milch und Milcherzeugnissen gezahlten Prämien durch den EAGFL, Abteilung
    Ausrichtung, an das Großherzogtum Luxemburg'
  type: main
- language: it
  script: Latn
