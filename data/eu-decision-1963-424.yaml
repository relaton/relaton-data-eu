title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 juin 1963, portant prorogation de la
    validité de sa décision arrêtée en date du 31 octobre 1962 à la suite de
    recours de la République fédérale d'Allemagne à l'article 115 alinéa 1 du
    Traité pour exclure du traitement communautaire les feuilles de tabac non écotées
    et les déchets de tabac originaires de pays tiers et mis en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: '63/424/EWG: Entscheidung der Kommission vom 28. Juni 1963 zur Verlängerung
    der Gültigkeitsdauer ihrer Entscheidung vom 31. Oktober 1962 über die Inanspruchnahme
    von Artikel 115 Absatz (1) des EWG durch die Bundesrepublik Deutschland, um aus
    dritten Ländern stammende nicht entrippte Tabakblätter und Tabakabfälle, die
    in den anderen Mitgliedstaaten in den freien Verkehr gebracht worden sind, von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '63/424/CEE: Decisione della Commissione, del 28 giugno 1963, relativa
    al prolungamento della validità della decisione adottata il 31 ottobre 1962 in
    seguito al ricorso da parte della Repubblica federale di Germania all''articolo
    115, primo capoverso, del Trattato volto ad escludere dal trattamento comunitario
    i tabacchi greggi o non lavorati e i cascami di tabacchi originari dei paesi terzi
    e introdotti in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/424/EEG: Beschikking van de Commissie van 28 juni 1963 houdende verlenging
    van de geldigheidsduur van haar beschikking d. d. 31 oktober 1962 betreffende
    het beroep van de Bondsrepubliek Duitsland op artikel 115, alinea 1, van het Verdrag
    om niet-gestripte tabaksbladeren en afvallen van tabak die van oorsprong zijn
    uit derde landen en in de andere Lid-Staten in het vrije verkeer zijn gebracht
    van de communautaire behandeling uit te sluiten'
  type: main
