  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/66 оd 22. siječnja 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificiranu soju
    MON 87751 × MON 87701 × MON 87708 × MON 89788, sastoje se ili su proizvedeni
