    er fremstillet af genetisk modificeret MON 87751 × MON 87701 × MON 87708 ×
    MON 89788-sojabønne i henhold til Europa-Parlamentets og Rådets forordning (EF)
    nr. 1829/2003 (meddelt under nummer C(2021) 285) (Kun den nederlandske udgave
    er autentisk)
  type: main
- language: el
