title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/66 of 22 January 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 87751 × MON 87701 × MON 87708 × MON 89788,
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2021) 285) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/66 de la Commission du 22 janvier 2021
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié MON 87751 × MON 87701 × MON 87708 × MON 89788, consistant en ce soja
    ou produits à partir de celui-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2021) 285] (Le
    texte en langue néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/66 der Kommission vom 22. Januar 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Sojabohnen der Sorte MON 87751 × MON 87701 × MON 87708 × MON 89788 enthalten,
    aus ihnen bestehen oder aus ihnen hergestellt werden, gemäß der Verordnung (EG)
    Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter
    Aktenzeichen C(2021) 285) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/66 на Комисията
    от 22 януари 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    соя MON 87751 × MON 87701 × MON 87708 × MON 89788, в съответствие
    с Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета (нотифицирано под номер С(2021) 285)
    (само текстът на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/66, ze dne 22. ledna 2021 o povolení
    uvedení produktů, které obsahují geneticky modifikovanou sóju MON 87751 ×
    MON 87701 × MON 87708 × MON 89788, sestávají z ní nebo jsou z ní vyrobeny,
    na trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2021) 285) (Pouze nizozemské znění je závazné)
  type: main
