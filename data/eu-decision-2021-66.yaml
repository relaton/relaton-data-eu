    89788 szójababot tartalmazó, abból álló vagy abból előállított termékek
    forgalomba hozatalának az 1829/2003/EK európai parlamenti és tanácsi rendelet
    szerinti engedélyezéséről (az értesítés a C(2021) 285. számú dokumentummal
    történt) (Csak a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/66 della Commissione del 22 gennaio 2021
    che autorizza l'immissione in commercio di prodotti contenenti, costituiti o derivati
    da soia geneticamente modificata MON 87751 × MON 87701 × MON 87708 × MON 89788
    a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2021) 285] (Il testo in lingua neerlandese è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/66 (2021. gada 22. janvāris),
