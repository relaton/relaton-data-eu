title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 211/2005 of 4 February 2005 amending Regulation
    (EC) No 1725/2003 adopting certain international accounting standards in accordance
    with Regulation (EC) No 1606/2002 of the European Parliament and of the Council
    as regards International Financial Reporting Standards (IFRS) 1 and 2 and International
    Accounting Standards (IASs) No 12, 16, 19, 32, 33, 38 and 39
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 211/2005 de la Commission du 4 février 2005 modifiant
    le règlement (CE) n° 1725/2003 portant adoption de certaines normes comptables
    internationales conformément au règlement (CE) n° 1606/2002 du Parlement européen
    et du Conseil en ce qui concerne l’IFRS 1 et 2, et les IAS 12, 16, 19, 32, 33,
    38 et 39
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 211/2005 der Kommission vom 4. Februar 2005 zur Änderung
    der Verordnung (EG) Nr. 1725/2003 betreffend die Übernahme bestimmter internationaler
    Rechnungslegungsstandards in Übereinstimmung mit der Verordnung (EG) Nr. 1606/2002
    des Europäischen Parlaments und des Rates im Hinblick auf den „International
    Financial Reporting Standard“ (IFRS) Nr. 1 und 2 und die „International Accounting
    Standards“ (IAS) Nr. 12, 16, 19, 32, 33, 38 und 39
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EO) № 211/2005 на Комисията от 4 февруари
    2005 година за изменение на Регламент (EO) № 1725/2003
    за приемане на някои международни счетоводни
    стандарти в съответствие с Регламент (ЕО) №
    1606/2002 на Европейския парламент и на Съвета
    относно Международни стандарти за финансова
    отчетност (МСФО) 1 и 2 и Международни счетоводни
    стандарти (IAS) № 12, 16, 19, 32, 33, 38 и 39
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 211/2005 ze dne 4. února 2005, kterým se
    mění nařízení (ES) č. 1725/2003, kterým se přijímají některé mezinárodní
    účetní standardy v souladu s nařízením Evropského parlamentu a Rady (ES)
    č. 1606/2002, pokud jde o mezinárodní standardy účetního výkaznictví (IFRS)
    1 a 2 a mezinárodní účetní standardy (IAS) 12, 16, 19, 32, 33, 38 a 39
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 211/2005 af 4. februar 2005 om ændring
    af forordning (EF) nr. 1725/2003 om vedtagelse af visse internationale regnskabsstandarder
    i overensstemmelse med Europa-Parlamentets og Rådets forordning (EF) nr. 1606/2002,
    for så vidt angår IFRS 1 og 2 og IAS 12, 16, 19, 32, 33, 38 og 39
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 211/2005 της Επιτροπής,
    της 4ης Φεβρουαρίου 2005, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 1725/2003 για την υιοθέτηση ορισμένων
    διεθνών λογιστικών προτύπων σύμφωνα με τον
    κανονισμό (ΕΚ) αριθ. 1606/2002 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, όσον αφορά τα διεθνή πρότυπα
    χρηματοοικονομικής πληροφόρησης (ΔΠΧΠ) 1 και
    2 και τα διεθνή λογιστικά πρότυπα (ΔΛΠ) αριθ.
    12, 16, 19, 32, 33, 38 και 39
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 211/2005, 4. veebruar 2005, millega muudetakse
    rahvusvaheliste finantsaruandlusstandardite IFRS 1 ja IFRS 2 ning rahvusvaheliste
    raamatupidamisstandardite IAS 12, IAS 16, IAS 19, IAS 32, IAS 33, IAS 38 ja IAS
    39 osas määrust (EÜ) nr 1725/2003, millega võetakse vastu teatavad rahvusvahelised
    raamatupidamisstandardid kooskõlas Euroopa Parlamendi ja nõukogu määrusega
    (EÜ) nr 1606/2002
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 211/2005, annettu 4 päivänä helmikuuta 2005,
    tiettyjen kansainvälisten tilinpäätösstandardien hyväksymisestä Euroopan
    parlamentin ja neuvoston asetuksen (EY) N:o 1606/2002 mukaisesti annetun asetuksen
    (EY) N:o 1725/2003 muuttamisesta standardien IFRS 1, IFRS 2, IAS 12, IAS 16, IAS
    19, IAS 32, IAS 33, IAS 38 ja IAS 39 osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 211/2005/EK rendelete (2005. február 4.) az 1606/2002/EK
    európai parlamenti és tanácsi rendelettel összhangban egyes nemzetközi számviteli
    standardok elfogadásáról szóló 1725/2003/EK rendelet az 1. és 2. nemzetközi
    pénzügyi jelentési szabvány (IFRS), valamint a 12., 16., 19., 32., 33., 38.
    számú nemzetközi számviteli standardok (IASs) tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 211/2005 della Commissione, del 4 febbraio 2005, che
    modifica il regolamento (CE) n. 1725/2003 che adotta taluni principi contabili
    internazionali conformemente al regolamento (CE) n. 1606/2002 del Parlamento europeo
    e del Consiglio, per quanto riguarda gli International Financial Reporting Standards
    (IFRS) 1 e 2 e i principi contabili internazionali IAS 12, 16, 19, 32, 33, 38
    e 39
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 211/2005 (2005. gada 4. februāris), ar kuru
    groza Regulu (EK) Nr. 1725/2003, ar ko pieņem noteiktus starptautiskos grāmatvedības
    standartus saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1606/2002
    attiecībā uz Starptautiskajiem finanšu pārskatu standartiem (SFPS) 1 un 2
    un Starptautiskajiem grāmatvedības standartiem (SGS) Nr. 12, 16, 19, 32, 33,
    38 un 39
  type: main
- language: lt
  script: Latn
  content: 2005 m. vasario 4 d. Komisijos reglamentas (EB) Nr. 211/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 1725/2003, priimantį tam tikrus tarptautinius
    apskaitos standartus pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr.
    1606/2002 dėl 1 ir 2 tarptautinių finansinės atskaitomybės standartų (TFAS)
    ir 12, 16, 19, 32, 33, 38 ir 39 tarptautinių apskaitos standartų (TAS)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 211/2005 tal- 4 ta' Frar 2005 li jemenda
    r-Regolament (KE) Nru 1725/2003 li jadotta ċerti standards internazzjonali tal-kontabilità
    bi qbil mar-Regolament (KE) Nru 1606/2002 tal-Parlament Ewropew u tal-Kunsill
    rigward Standards Internazzjonali tar-Rappurtaġġ Finanzjarju (IFRS) 1 u 2 u
    l-Istandards tal-Kontabilità Internazzjonali (IASs) Nru 12, 16, 19, 32, 33, 38
    u 39
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 211/2005 van de Commissie van 4 februari 2005 tot
    wijziging van Verordening (EG) nr. 1725/2003 tot goedkeuring van bepaalde internationale
    standaarden voor jaarrekeningen overeenkomstig Verordening (EG) nr. 1606/2002
    van het Europees Parlement en de Raad wat de International Financial Reporting
    Standards (IFRS) 1 en 2 en de International Accounting Standards (IAS) 12, 16,
    19, 32, 33, 38 en 39 betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 211/2005 z dnia 4 lutego 2005 zmieniające
    rozporządzenie (WE) nr 1725/2003 przyjmujące określone międzynarodowe standardy
    rachunkowości zgodnie z rozporządzeniem (WE) nr 1606/2002 Parlamentu Europejskiego
    i Rady w odniesieniu do Międzynarodowych Standardów Sprawozdawczości Finansowej
    (IFRS) 1 i 2 oraz Międzynarodowych Standardów Rachunkowości (IAS) nr 12, 16,
    19, 32, 33, 38 i 39
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 211/2005 da Comissão, de 4 de Fevereiro de 2005,
    que altera o Regulamento (CE) n.° 1725/2003, que adopta certas normas internacionais
    de contabilidade nos termos de Regulamento (CE) n.° 1606/2002 do Parlamento Europeu
    e do Conselho, relativamente às Normas Internacionais de Relato Financeiro (IFRS
    - International Financial Reporting Standards) 1 e 2 e às Normas Internacionais
    de Contabilidade (IAS - International Accounting Standards) 12, 16, 19, 32, 33,
    38 e 39
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 211/2005 al Comisiei din 4 februarie 2005 de modificare
    a Regulamentului (CE) nr. 1725/2003 de adoptare a anumitor standarde internaționale
    de contabilitate în conformitate cu Regulamentul (CE) nr. 1606/2002 al Parlamentului
    European și al Consiliului, cu privire la Standardele internaționale de raportare
    financiară (IFRS) 1 și 2 și la Standardele internaționale de contabilitate
    (IAS) nr. 12, 16, 19, 32, 33, 38 și 39
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 211/2005 zo 4. februára 2005 ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1725/2003, ktorým sa prijímajú určité medzinárodné
    účtovné štandardy v súlade s nariadením Európskeho parlamentu a Rady (ES)
    č. 1606/2002, pokiaľ ide o medzinárodné štandardy finančného výkazníctva
    (IFRS) 1 a 2 a medzinárodné účtovné štandardy (IAS) č. 12, 16, 19, 32,
    33, 38 a 39
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 211/2005 4. februarja 2005 o spremembi Uredbe
    (ES) št. 1725/2003 o sprejetju nekaterih mednarodnih računovodskih standardov
    v skladu z Uredbo Evropskega parlamenta in Sveta (ES) št. 1606/2002 glede mednarodnih
    standardov finančnega poročanja (IFRS) 1 in 2 ter mednarodnih računovodskih
    standardov (IAS) št. 12, 16, 19, 32, 33, 38 in 39
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 211/2005 de la Comisión, de 4 de febrero de 2005,
    que modifica el Reglamento (CE) n° 1725/2003, por el que se adoptan determinadas
    Normas internacionales de contabilidad de conformidad con el Reglamento (CE) n°
    1606/2002 del Parlamento Europeo y del Consejo, en lo que respecta a las Normas
    internacionales de información financiera (NIIF) 1 y 2 y a las Normas internacionales
    de contabilidad (NIC) nos 12, 16, 19, 32, 33, 38 y 39
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 211/2005 av den 4 februari 2005 om ändring
    av kommissionens förordning (EG) nr 1725/2003 om antagande av vissa redovisningsstandarder
    i enlighet med Europaparlamentets och rådets förordning (EG) nr 1606/2002 med
    avseende på IFRS (International Financial Reporting Standards) 1 och 2, samt
