type: standard
title:
- language: en
  script: Latn
  content: '78/845/EEC: Commission Decision of 2 October 1978 authorizing the French
    Republic not to apply Community treatment to knives with cutting blades, serrated
    or not, including pruning knives (save for knives with handles of ivory or of
    gilt- or silver-plated base metals) falling within heading No ex 82.09 of the
    Common Customs Tariff originating in Japan and in free circulation in the other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '78/845/CEE: Décision de la Commission, du 2 octobre 1978, autorisant
    la République française à exclure du traitement communautaire les couteaux
    à lame tranchante ou dentelée (y compris les serpettes fermantes), à l'' exception
    des couteaux à manche en ivoire ou en métaux communs dorés ou argentés, de
    la position ex 82.09 du tarif douanier commun, originaires du Japon et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/845/EWG: Entscheidung der Kommission vom 2. Oktober 1978, mit der die
    Französische Republik ermáchtigt wird, aus Japan stammende und in den úbrigen
    Mitgliedstaaten im freien Verkehr befindliche Messer mit schneidender oder gezahnter
    Klinge, einschließlich Klappmesser fúr den Gartenbau (mit Ausnahme der Messer
    mit Griffen aus Elfenbein oder unedlen Metallen, vergoldet oder versilbert), der
    Tarifnummer ex 82.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/845/EØF: Kommissionens beslutning af 2. oktober 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage knive med skærende
    eller savtakket æg, herunder beskæreknive (med undtagelse af knive med skaft
    af elfenben eller af forgyldt eller forsølvet uædelt metal), som henhører under
    pos. ex 82.09 i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/845/CEE: Decisione della Commissione, del 2 ottobre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i coltelli a lama
    trinciante o dentata, compresi i roncoli chiudibili (esclusi i coltelli con manico
    d'' avorio o di metalli comuni dorati o argentati), della voce ex 82.09 della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/845/EEG: Beschikking van de Commissie van 2 oktober 1978 waarbij de
    Franse Republiek wordt gemachtigd messen, ook indien getand, zaksnoeimessen daaronder
    begrepen (met uitzondering van messen met heft van ivoor of van verguld of verzilverd
    onedel metaal), van post ex 82.09 van het gemeenschappelijk douanetarief, van
    oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
