title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1762/77 of 28 July 1977 re-establishing
    the levying of the customs duties on Portland cement, whether or not coloured,
    falling within heading No 25.23, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1762/77 de la Commission, du 28 juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux ciments
    hydrauliques, même colorés, de la position tarifaire 25.23, originaires de la
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1762/77 der Kommission vom 28. Juli 1977 zur Wiedereinführung
    des Zollsatzes für Zement, auch gefärbt, der Tarifnummer 25.23, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1762/77 af 28. juli 1977 om genindførelse
    af opkrævning af toldafgifter for portlandcement, også farvet, under position
    25.23, som har oprindelse i Jugoslavien, og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1762/77 della Commissione, del 28 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai cementi idraulici,
    anche colorati, della voce doganale 25.23, originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1762/77 van de Commissie van 28 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op hydraulisch
    cement, ook indien gekleurd, van post 25.23, van oorsprong uit Joegoslavië, ten
    behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
