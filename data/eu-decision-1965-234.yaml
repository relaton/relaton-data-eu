title:
- language: fr
  script: Latn
  content: Décision 65/234/CEE de la Commission, du 5 avril 1965, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité,
    pour exclure du traitement communautaire certains produits originaires de Hongrie
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/234/EWG: Entscheidung der Kommission vom 5. April 1965 betreffend den
    Antrag der Bundesrepublik Deutschland nach Artikel 115 Absatz (1) des Vertrages,
    um bestimmte Waren ungarischen Ursprungs, die sich in den anderen Mitgliedstaaten
    im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/234/CEE: Decisione della Commissione, del 5 aprile 1965, relativa al
    ricorso della Repubblica federale di Germania all''articolo 115, primo comma,
    del Trattato, per escludere dal trattamento comunitario determinati prodotti originari
    dall''Ungheria e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/234/EEG: Beschikking van de Commissie van 5 april 1965 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag bepaalde produkten, die van oorsprong zijn uit Hongarije
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
