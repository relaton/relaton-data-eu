title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 4032/86 of 18 December 1986 establishing, for
    1987, certain measures for the conservation and management of fishery resources,
    applicable to vessels flying the flag of Member States, other than Spain and Portugal,
    in waters falling under the sovereignty or within the jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4032/86 du Conseil du 18 décembre 1986 fixant, pour
    1987, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon des États membres, à l' exception de
    l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de la
    juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4032/86 des Rates vom 18. Dezember 1986 zur Festsetzung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für die Schiffe unter der Flagge der Mitgliedstaaten mit Ausnahme Spaniens und
    Portugals in den Gewässern unter der Hoheitsgewalt oder der Gerichtsbarkeit Portugals
    für 1987
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4032/86 af 18. december 1986 om fastsættelse
    for 1987 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører medlemsstaternes flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Portugals højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4032/86 του Συμβουλίου
    της 18ης Δεκεμβρίου 1986 για τον καθορισμό, για
    το 1987, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία των κρατών μελών, εκτός της
    Ισπανίας και της Πορτογαλίας, στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4032/86 del Consiglio del 18 dicembre 1986 che fissa,
    per il 1987, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera degli Stati membri, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione del
    Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4032/86 van de Raad van 18 december 1986 tot vaststelling,
    voor 1987, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van de Lid-Staten,
    met uitzondering van Spanje en Portugal, in de wateren die onder de soevereiniteit
    of de jurisdictie van Portugal vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4032/86 do Conselho de 18 de Dezembro de 1986 que
    fixa, para 1987, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão dos Estados-membros, com excepção
    de Espanha e de Portugal, nas águas sob soberania ou jurisdição de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4032/86 del Consejo de 18 de diciembre de 1986 por
    el que se fijan, para 1987, determinadas medidas de conservación y de gestión
    de los recursos de pesca aplicables a los buques que enarbolan pabellón de los
    Estados miembros, con excepción de España y de Portugal, en las aguas sometidas
    a la soberanía o a la jurisdicción de Portugal
  type: main
