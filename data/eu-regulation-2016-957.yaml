  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2016/957 della Commissione, del 9 marzo 2016,
    che integra il regolamento (UE) n. 596/2014 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione sui dispositivi, sistemi
    e procedure adeguati e sui modelli di notifica da utilizzare per prevenire, individuare
    e segnalare le pratiche abusive e gli ordini o le operazioni sospetti
  type: main
