title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/957 of 9 March 2016 supplementing
    Regulation (EU) No 596/2014 of the European Parliament and of the Council with
    regard to regulatory technical standards for the appropriate arrangements, systems
    and procedures as well as notification templates to be used for preventing, detecting
    and reporting abusive practices or suspicious orders or transactions
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/957 de la Commission du 9 mars 2016 complétant
    le règlement (UE) n° 596/2014 du Parlement européen et du Conseil par des normes
    techniques de réglementation concernant les mesures, systèmes et procédures
    adéquats et les modèles de notification à utiliser pour prévenir, détecter
    et déclarer les pratiques abusives ou les ordres ou transactions suspects
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/957 der Kommission vom 9. März 2016 zur
    Ergänzung der Verordnung (EU) Nr. 596/2014 des Europäischen Parlaments und des
    Rates im Hinblick auf technische Regulierungsstandards für die geeigneten Regelungen,
    Systeme und Verfahren sowie Mitteilungsmuster zur Vorbeugung, Aufdeckung und Meldung
    von Missbrauchspraktiken oder verdächtigen Aufträgen oder Geschäften
  type: main
- language: bg
