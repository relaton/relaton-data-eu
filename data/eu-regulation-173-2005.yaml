title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 173/2005 of 24 January 2005 amending Regulation
    (EC) No 1260/1999 laying down general provisions on the Structural Funds concerning
    the extension of the duration of the PEACE programme and the granting of new commitment
    appropriations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 173/2005 du Conseil du 24 janvier 2005 modifiant le
    règlement (CE) n° 1260/1999 portant dispositions générales sur les Fonds structurels,
    en ce qui concerne la prolongation de la durée du programme PEACE et l’octroi
    de nouveaux crédits d’engagement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 173/2005 des Rates vom 24. Januar 2005 zur Änderung
    der Verordnung (EG) Nr. 1260/1999 mit allgemeinen Bestimmungen über die Strukturfonds
    betreffend die Verlängerung der Dauer des Programms PEACE und die Bereitstellung
    neuer Verpflichtungsermächtigungen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 173/2005 ze dne 24. ledna 2005, kterým se mění
    nařízení (ES) č. 1260/1999 o obecných ustanoveních o strukturálních fondech
    s ohledem na prodloužení trvání programu PEACE a poskytnutí nových položek
    závazků
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 173/2005 af 24. januar 2005 om ændring af
    forordning (EF) nr. 1260/1999 om vedtagelse af generelle bestemmelser for strukturfondene,
    hvad angår forlængelse af Peace-programmets varighed og tildeling af nye forpligtelsesbevillinger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 173/2005 του Συμβουλίου,
    της 24ης Ιανουαρίου 2005, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1260/1999 περί γενικών διατάξεων
    για τα διαρθρωτικά ταμεία όσον αφορά την παράταση
    της διάρκειας του προγράμματος PEACE και τη χορήγηση
    νέων πιστώσεων αναλήψεως υποχρεώσεων
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 173/2005, 24. jaanuar 2005, millega muudetakse
    seoses PEACE programmi kehtivuse pikendamisega ja uute kulukohustuse assigneeringute
    andmisega määrust (EÜ) nr 1260/1999, millega nähakse ette üldsätted struktuurifondide
    kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 173/2005, annettu 24 päivänä tammikuuta 2005,
    rakennerahastoja koskevista yleisistä säännöksistä annetun asetuksen (EY)
    N:o 1260/1999 muuttamisesta Peace-ohjelman jatkamisen ja uusien maksumäärärahojen
    myöntämisen osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 173/2005/EK rendelete (2005. január 24.) a strukturális alapokra
    vonatkozó általános rendelkezések megállapításáról szóló 1260/1999/EK
    rendeletnek a PEACE-program időtartamának meghosszabbítása és új kötelezettségvállalási
    előirányzatok jóváhagyása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 173/2005 del Consiglio, del 24 gennaio 2005, che modifica
    il regolamento (CE) n. 1260/1999 recante disposizioni generali sui Fondi strutturali
    per quanto riguarda la proroga del programma PEACE e la concessione di nuovi stanziamenti
    d’impegno
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 173/2005 (2005. gada 24. janvāris), ar kuru groza
    Regulu (EK) Nr. 1260/1999, ar ko paredz vispārīgus noteikumus par struktūrfondiem,
    saistībā ar PEACE programmas darbības termiņa pagarināšanu un jaunu saistību
    apropriāciju piešķiršanu
  type: main
- language: lt
  script: Latn
  content: 2005 m. sausio 24 d. Tarybos reglamentas (EB) Nr. 173/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 1260/1999, nustatantį bendrąsias nuostatas
    dėl struktūrinių fondų, dėl PEACE programos pratęsimo ir naujų įsipareigotų
    asignavimų skyrimo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 173/2005 van de Raad van 24 januari 2005 tot wijziging
    van Verordening (EG) nr. 1260/1999 houdende algemene bepalingen inzake de Structuurfondsen,
    met betrekking tot de verlenging van de duur van het Peace-programma en de toekenning
    van nieuwe vastleggingskredieten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 173/2005 z dnia 24 stycznia 2005 r. zmieniające
    rozporządzenie (WE) nr 1260/1999 ustanawiające przepisy ogólne w sprawie funduszy
    strukturalnych dotyczące przedłużenia programu PEACE i przyznania dalszych
    środków na zobowiązania
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 173/2005 do Conselho, de 24 de Janeiro de 2005, que
    altera o Regulamento (CE) n.° 1260/1999 que estabelece disposições gerais sobre
    os fundos estruturais, relativamente à prorrogação do programa PEACE e à concessão
    de novas dotações de autorização
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 173/2005 z 24. januára 2005, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1260/1999 o všeobecných ustanoveniach o štrukturálnych
    fondoch, pokiaľ ide o predĺženie trvania programu PEACE a poskytnutia nových
    viazaných finančných prostriedkov
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 173/2005 z dne 24. januarja 2005 o spremembi Uredbe
    (ES) št. 1260/1999 o splošnih določbah o Strukturnih skladih glede podaljšanja
    trajanja programa PEACE in dodelitve novih odobrenih pravic za prevzem obveznosti
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 173/2005 del Consejo, de 24 de enero de 2005, que modifica
    el Reglamento (CE) n° 1260/1999 por el que se establecen disposiciones generales
    sobre los Fondos Estructurales para prolongar dos años más la duración de aplicación
    del programa PEACE y conceder nuevos créditos de compromiso
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 173/2005 av den 24 januari 2005 om ändring
    av förordning (EG) nr 1260/1999 om allmänna bestämmelser för strukturfonderna
    för en förlängning av Peace-programmet och beviljande av nya åtagandebemyndiganden
  type: main
