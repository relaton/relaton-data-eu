  script: Latn
  content: COMMISSION REGULATION (EEC) No 1138/93 of 7 May 1993 re-establishing the
    levying of customs duties on products falling within CN code 6913, originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1138/93 de la Commission du 7 mai 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 6913
    originaires de Corée du Sud, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1138/93 DER KOMMISSION vom 7. Mai 1993 zur Wiedereinführung
