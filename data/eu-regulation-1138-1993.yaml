    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1138/93 af 7. maj 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6913 og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1138/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
