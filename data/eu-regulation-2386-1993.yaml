title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2386/93 of 27 August 1993 not to accept
    tenders submitted in response to the 98th partial invitation to tender opened
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2386/93 de la Commission, du 27 août 1993, de ne pas
    donner suite aux offres déposées à la suite de la quatre-vingt-dix-huitième
    adjudication partielle effectuée dans le cadre des mesures générales d'intervention
    conformément au règlement (CEE) n 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2386/93 der Kommission vom 27. August 1993 über den
    Beschluß, den zur 98. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2386/93 af 27. august 1993 om ikke
    at tage den 98. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2386/93 της Επιτροπής
    της 27ης Αυγούστου 1993 για να μη δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον 98ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    των γενικών μέτρων παρεμβάσεως σύμφωνα με
    τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2386/93 della Commissione, del 27 agosto 1993, di
    non dare seguito alle offerte presentate per la novantottesima gara parziale effettuata
    nel quadro delle misure generali di intervento a norma del regolamento (CEE) n.
    1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2386/93 van de Commissie van 27 augustus 1993 houdende
    het besluit om geen gevolg te geven aan de offertes voor de 98e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2386/93 da Comissão, de 27 de Agosto de 1993, que
    rejeita as propostas apresentadas na sequência do nonagésimo oitavo concurso
    parcial realizado no âmbito das medidas gerais de intervenção em conformidade
    com o Regulamento (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2386/93 de la Comisión, de 27 de agosto de 1993, por
    el que se decide no dar curso a las ofertas presentadas para la nonagésima octava
    licitación parcial efectuada en el marco de las medidas generales de intervención
    con arreglo al Reglamento (CEE) n 1627/89
  type: main
