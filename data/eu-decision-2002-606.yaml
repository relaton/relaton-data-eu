    scutiri de la extinderea la anumite piese componente esențiale de biciclete,
    prin Regulamentul (CE) nr. 71/97 al Consiliului, a dreptului antidumping instituit
    pentru bicicletele originare din Republica Populară Chineză prin Regulamentul
    (CEE) nr. 2474/93 și menținut prin Regulamentul (CE) nr. 1524/2000 și de revocare
