  script: Latn
  content: Odločba Komisije z dne 16. junija 2002 o odobritvi nekaterim strankam
    oprostitve razširjenih, z Uredbo Sveta (ES) št. 71/97, protidampinških dajatev
    na kolesa s poreklom iz Ljudske republike Kitajske, ki jih je uvedla Uredba Sveta
