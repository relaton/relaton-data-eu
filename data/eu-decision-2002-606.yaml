type: standard
title:
- language: en
  script: Latn
  content: '2002/606/EC: Commission Decision of 16 July 2002 granting certain parties
    an exemption from the extension to certain essential bicycle parts, by Council
    Regulation (EC) No 71/97, of the anti-dumping duty on bicycles originating in
    the People''s Republic of China, imposed by Council Regulation (EEC) No 2474/93,
    and maintained by Regulation (EC) No 1524/2000 and revoking the exemption from
    the payment of the anti-dumping duty extended to certain bicycle parts originating
    in the People''s Republic of China granted to certain parties pursuant to Commission
    Regulation (EC) No 88/97 (notified under document number C(2002) 2638)'
  type: main
- language: fr
  script: Latn
  content: '2002/606/CE: Décision de la Commission du 16 juillet 2002 accordant à
    certaines parties une exemption de l''extension à certaines parties essentielles
    de bicyclettes, par le règlement (CE) n° 71/97 du Conseil, du droit antidumping
    institué sur les bicyclettes originaires de la République populaire de Chine
    par le règlement (CEE) n° 2474/93 et maintenu par le règlement (CE) n° 1524/2000
    et révoquant l''exemption de paiement du droit antidumping étendu à certaines
    parties essentielles de bicyclettes originaires de la République populaire de
    Chine accordée à certaines parties en vertu du règlement (CE) n° 88/97 [notifiée
    sous le numéro C(2002) 2638]'
  type: main
- language: de
  script: Latn
  content: '2002/606/EG: Entscheidung der Kommission vom 16. Juli 2002 zur Befreiung
    bestimmter Parteien von dem mit der Verordnung (EWG) Nr. 2474/93 des Rates eingeführten,
    mit der Verordnung (EG) Nr. 71/97 des Rates auf die Einfuhren bestimmter Fahrradteile
    ausgeweiteten und mit der Verordnung (EG) Nr. 1524/2000 des Rates aufrechterhaltenen
    Antidumpingzoll und zum Widerruf der gemäß der Verordnung (EG) Nr. 88/97 bestimmten
    Parteien gewährten Befreiung von dem auf bestimmte Fahrradteile mit Ursprung
    in der Volksrepublik China ausgeweiteten Antidumpingzoll (Bekannt gegeben unter
    Aktenzeichen K(2002) 2638)'
  type: main
