  script: Latn
  content: '2002/606/CE: Decisão da Comissão, de 16 de Julho de 2002, que isenta
    certas partes interessadas da extensão a certas partes de bicicletas, pelo Regulamento
    (CE) n.° 71/97 do Conselho, do direito anti-dumping sobre as bicicletas originárias
    da República Popular da China, instituído pelo Regulamento (CEE) n.° 2474/93
    e mantido pelo Regulamento (CE) n.° 1524/2000, e que revoga a isenção do pagamento
    do direito anti-dumping tornado extensivo a certas partes de bicicletas originárias
    da República Popular da China, concedida a certas partes interessadas ao abrigo
    do Regulamento (CE) n.° 88/97 [notificada com o número C(2002) 2638]'
