  script: Cyrl
  content: Решение на Комисията от 16 юли 2002 година
    за освобождаване на някои страни от разширяването
    на действието на антидъмпинговото мито, наложено
    с Регламент (ЕИО) № 2474/93 на Съвета, с действие,
    разширено с Регламент (ЕО) № 71/97 на Съвета, за
    да включи определени части за велосипеди и
    оставено в сила с Регламент (ЕО) № 1524/2000 на Съвета,
    както и за оттегляне на временното освобождаване,
    съгласно Регламент (ЕО) № 88/97 на Комисията,
    на определени страни от антидъмпингово мито
    за определени части за велосипеди с произход
    от Китайската народна република (нотифицирано
    под номер С(2002) 2638)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 16. července 2002, kterým se některé strany
    osvobozují z rozšíření na některé hlavní části a součásti jízdních
    kol, stanoveného nařízením Rady (ES) č. 71/97, antidumpingového cla z jízdních
    kol pocházejících z Čínské lidové republiky uloženého nařízením Rady
    (EHS) č. 2474/93 a zachovaného nařízením (ES) č. 1524/2000, a kterým se
    odvolává osvobození z platby antidumpingového cla rozšířeného na některé
    části a součásti jízdních kol pocházející z Čínské lidové republiky,
    přiznaného některým stranám nařízením Komise (ES) č. 88/97 (oznámeno
    pod číslem K(2002) 2638)
  type: main
- language: da
  script: Latn
