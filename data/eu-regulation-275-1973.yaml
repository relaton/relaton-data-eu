title:
- language: en
  script: Latn
  content: Regulation (EEC) No 275/73 of the Commission of 31 January 1973 determining
    the amounts of the variable components and compensatory amounts, and the additional
    duties applicable during February and March 1973 to the goods covered by Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 275/73 de la Commission, du 31 janvier 1973, déterminant
    les montants compensatoires ainsi que les droits additionnels applicables, pour
    les mois de février et mars 1973, aux marchandises relevant du règlement (CEE)
    n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 275/73 der Kommission vom 31. Januar 1973 zur Festsetzung
    der Höhe der in den Monaten Februar und März 1973 bei der Einfuhr der unter
    die Verordnung (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge,
    Ausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 275/73 af 31. januar 1973 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    varer henhørende under forordning (EØF) nr. 1059/69 for månederne februar og
    marts 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 275/73 della Commissione, del 31 gennaio 1973, che
    determina gli importi degli elementi mobili e degli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per i mesi di febbraio e marzo
    1973, delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 275/73 van de Commissie van 31 januari 1973 tot vaststelling
    van de bedragen der gedurende de maanden februari en maart 1973 bij invoer van
    onder Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele
    elementen en compenserende heffingen alsmede aanvullende invoerrechten
