    des informations à déclarer par les États membres en vertu de la directive
    2010/63/UE du Parlement européen et du Conseil relative à la protection des
    animaux utilisés à des fins scientifiques, et abrogeant la décision d’exécution
    2012/707/UE de la Commission [notifiée sous le numéro C(2020) 2179]
