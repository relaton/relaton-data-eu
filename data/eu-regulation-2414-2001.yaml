    sont soumis à l'obligation de visa pour franchir les frontières extérieures
    des États membres et la liste de ceux dont les ressortissants sont exemptés
    de cette obligation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2414/2001 des Rates vom 7. Dezember 2001 zur Änderung
