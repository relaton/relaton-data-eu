title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2414/2001 of 7 December 2001 amending Regulation
    (EC) No 539/2001 listing the third countries whose nationals must be in possession
    of visas when crossing the external borders of Member States and those whose nationals
    are exempt from that requirement
  type: main
- language: fr
  script: Latn
