title:
- language: fr
  script: Latn
  content: Décision de la Commission portant constatation que les importations de
    la République française en provenance des autres États membres concernant les
    cornichons ont été inférieures au contingent ouvert pendant deux années consécutives
  type: main
- language: de
  script: Latn
  content: '63/62/EWG: Entscheidung der Kommission zur Feststellung, daß die Einfuhren
    in die Französische Republik von Cornichons aus den übrigen Mitgliedstaaten
    während zwei aufeinanderfolgender Jahre geringer waren als das eröffnete Kontingent'
  type: main
- language: it
  script: Latn
  content: '63/62/CEE: Decisione della Commissione con la quale si constata che le
    importazioni nella Repubblica francese di cetriolini provenienti dagli altri Stati
    membri sono state inferiori al contingente aperto per due anni consecutivi'
  type: main
- language: nl
  script: Latn
  content: '63/62/EEG: Beschikking van de Commissie houdende vaststelling dat de invoer
    in de Franse Republiek van augurken uit de overige Lid-Staten gedurende twee opeenvolgende
    jaren beneden het beschikbare contingent is gebleven'
  type: main
