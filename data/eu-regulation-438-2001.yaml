  script: Latn
  content: Commission Regulation (EC) No 438/2001 of 2 March 2001 laying down detailed
    rules for the implementation of Council Regulation (EC) No 1260/1999 as regards
    the management and control systems for assistance granted under the Structural
    Funds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 438/2001 de la Commission du 2 mars 2001 fixant les
