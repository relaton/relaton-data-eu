title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1940/82 of 19 July 1982 laying down a Community
    procedure for supervision of the disposal of alcohol taken over by the intervention
    agencies in connection with the distillation of table wines referred to in Regulation
    (EEC) No 701/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1940/82 de la Commission, du 19 juillet 1982, établissant
    une procédure de surveillance communautaire pour l' écoulement de l' alcool
    pris en charge par les organismes d' intervention dans le cadre des opérations
    de distillation des vins de table visées au règlement (CEE) n° 701/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1940/82 der Kommission vom 19. Juli 1982 zur Festlegung
    eines Verfahrens der gemeinschaftlichen Überwachung des Absatzes von Alkohol,
    der von den Interventionsstellen im Rahmen der Destillation von Tafelwein gemäß
    Verordnung (EWG) Nr. 701/82 übernommen wurde
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1940/82 af 19. juli 1982 om indførelse
    af en fællesskabsprocedure for overvågning af afsætningen af alkohol overtaget
    af interventionsorganerne i forbindelse med destillation af bordvin som omhandlet
    i forordning (EØF) nr. 701/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1940/82 τής Επιτροπής
    τής 19ης Ιουλίου 1982 περί θεσπίσεως τής διαδικασίας
    κοινοτικής επιβλέψεως γιά τή διάθεση τού οινοπνεύματος
    πού αναλαμβάνουν οι οργανισμοί παρεμβάσεως
    στά πλαίσια τών εργασιών αποστάξεως επιτραπεζίων
    οίνων οι οποίες προβλέπονται στόν κανονισμό
    (EOK) αριθ. 701/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1940/82 della Commissione, del 19 luglio 1982, che
    stabilisce una procedura di controllo comunitario per lo smercio dell' alcole
    preso in consegna dagli organismi d' intervento nell' ambito delle operazioni
    di distillazione dei vini da tavola di cui al regolamento (CEE) n. 701/82
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1940/82 van de Commissie van 19 juli 1982 tot vaststelling
    van een communautaire controleprocedure voor de afzet van alcohol die door de
    interventiebureaus is overgenomen in het kader van de in Verordening (EEG) nr.
    701/82 bedoelde distillatie van tafelwijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1940/82 da Comissão, de 19 de Julho de 1982, que
    estabelece um processo de vigilância comunitária para o escoamento do álcool
    a cargo dos organismos de intervenção no âmbito das operações de destilação
    dos vinhos de mesa referidos no Regulamento (CEE) n.° 701/82
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1940/82 de la Comisión, de 19 de julio de 1982, por
    el que se establece un procedimiento de inspección comunitaria para la comercialización
    del alcohol del que se hayan hecho cargo los organismos de intervención en el
    marco de las operaciones de destilación de los vinos de mesa mencionados en el
    Reglamento (CEE) n° 701/82
  type: main
