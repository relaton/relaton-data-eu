title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 998/84 of 10 April 1984 re-establishing
    the levying of customs duties on certain paint and similar brushes, falling within
    subheading 96.01 B ex III and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 998/84 de la Commission du 10 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certaines brosses et pinceaux,
    de la sous-position 96.01 B ex III du tarif douanier commun, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 998/84 der Kommission vom 10. April 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Farbpinsel und ähnliche Pinsel der Tarifstelle
    96.01 B ex III mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 998/84 af 10. april 1984 om genindførelse
    af opkrævning af told for bestemte pensler, henhørende under pos. 96.01 B ex
    III og med oprindelse i Hongkong, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 998/84 της Επιτροπής
    της 10ης Απρίλιου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένες ψήκτρες
    και χρωστήρες της διακρίσεως 96.01 Β ex ΙΙΙ του
    Κοινού Δασμολογίου, καταγωγής Χονγκ Κονγκ,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 998/84 della Commissione del 10 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili alle spazzole, pennelli e oggetti
    di spazzolificio, della sottovoce 96.01 B ex III della tariffa doganale comune,
    originari di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 998/84 van de Commissie van 10 april 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde borstels,
    kwasten en penselen, van postonderverdeling 96.01 B ex III, van oorsprong uit
    Hong-Kong, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
