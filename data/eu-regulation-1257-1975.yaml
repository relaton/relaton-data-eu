title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1257/75 of the Commission of 14 May 1975 re-establishing
    the levying of the customs duties on cotton yarn, not put up for retail sale,
    falling within subheading 55.05 A, originating in Colombia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1257/75 de la Commission, du 14 mai 1975, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, de la sous-position tarifaire
    55.05 A, originaires de Colombie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1257/75 der Kommission vom 14. Mai 1975 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, der Tarifstelle 55.05 A, mit Ursprung in Kolumbien, dem die
    in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1257/75 af 14. maj 1975 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger,
    under underposition 55.05 A, som har oprindelse i Colombia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1257/75 della Commissione, del 14 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto, della sottovoce doganale 55.05 A originari
    della Colombia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1257/75 van de Commissie van 14 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein, van onderverdeling 55.05 A,
    van oorsprong uit Columbia, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3046/74 van de Raad van 2 december 1974
  type: main
