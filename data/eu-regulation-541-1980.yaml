  content: Council Regulation (EEC) No 541/80 of 3 March 1980 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 541/80 du Conseil, du 3 mars 1980, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 541/80 des Rates vom 3. März 1980 zur Feststellung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 541/80 af 3. marts 1980 om fastsættelse
