title:
- language: en
  script: Latn
  content: '87/330/EEC: Commission Decision of 25 May 1987 authorizing Ireland to
    apply intra-Community surveillance to imports of certain nitrogenous chemical
    fertilizers originating in certain third countries which have been put into free
    circulation in other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/330/CEE: Décision de la Commission du 25 mai 1987 autorisant l''Irlande
    à procéder à une surveillance intracommunautaire des importations de certains
    engrais chimiques azotés, originaires de certains pays tiers, mis en libre pratique
    dans les autres États membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '87/330/EWG: Entscheidung der Kommission vom 25. Mai 1987 zur Ermächtigung
    Irlands, innergemeinschaftliche Überwachungsmaßnahmen für die Einfuhren bestimmter
    aus dritten Ländern stammender und in den übrigen Mitgliedstaaten im zollrechtlich-freien
    Verkehr befindlicher Stickstoffdüngemitteln zu treffen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/330/EØF: Kommissionens beslutning af 25. maj 1987 om bemyndigelse
    af Irland til at indføre tilsyn inden for Fællesskabet med indførslen af visse
    nitrogenholdige kemiske gødningsstoffer, der har oprindelse i visse tredjelande
    og er overgået til fri omsætning i de øvrige medlemsstater (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/330/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Μαΐου 1987 για την παροχή άδειας στην Ιρλανδία
    να προβεί σε ενδοκοικοτική επιτήρηση των εισαγωγών
    ορισμένων αζωτούχων χημικών λιπασμάτων, καταγωγής
    ορισμένων τρίτων χωρών, τα οποία έχουν τεθεί
    σε ελεύθερη κυκλοφορία σε άλλα κράτη μέλη (Το
    κείμενο στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/330/CEE: Decisione della Commissione del 25 maggio 1987 che autorizza
    l''Irlanda ad instaurare una sorveglianza intracomunitaria delle importazioni
    di alcuni concimi chimici azotati, originari di taluni paesi terzi e immessi in
    libera pratica in altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '87/330/EEG: Beschikking van de Commissie van 25 mei 1987 tot machtiging
    van Ierland een intracommunautair toezicht in te stellen op de invoer van bepaalde
    soorten chemische stikstofhoudende meststoffen van oorsprong uit bepaalde derde
    landen, die in de andere Lid-Staten in het vrije verkeer zijn gebracht (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/330/CEE: Decisão da Comissão de 25 de Maio de 1987 que autoriza a
    Irlanda a proceder a uma vigilância intracomunitária das importações de certos
    adubos químicos azotados, originários de certos países terceiros e introduzidos
    em livre prática nos outros Estados-membros (Apenas faz fé o texto em língua
    inglesa)'
  type: main
- language: es
  script: Latn
  content: '87/330/CEE: Decisión de la Comisión de 25 de mayo de 1987 por la que
    se autoriza a Irlanda a proceder a una vigilancia intracomunitaria de las importaciones
    de ciertos abonos químicos nitrogenados, originarios de determinados terceros
    países y despachados a libre práctica en el resto de los Estados miembros (El
    texto en lengua inglesa es el único auténtico)'
