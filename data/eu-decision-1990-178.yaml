title:
- language: en
  script: Latn
  content: '90/178/Euratom, EEC: Commission Decision of 23 March 1990 authorizing
    Luxembourg not to take into account certain categories of transactions and to
    use certain approximate estimates for the calculation of the VAT own resources
    base (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/178/Euratom, CEE: Décision de la Commission, du 23 mars 1990, autorisant
    le Luxembourg à ne pas tenir compte de certaines catégories d''opérations et
    à utiliser certaines estimations approximatives pour le calcul de la base des
    ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/178/Euratom, EWG: Entscheidung der Kommission vom 23. März 1990 mit
    der Luxemburg ermächtigt wird, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel
    bestimmte Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei
    bestimmten anderen Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/178/Euratom, EØF: Kommissionens beslutning af 23. marts 1990 om bemyndigelse
    af Luxembourg til at beregne grundlaget for Fællesskabernes momsindtægter uden
    hensyntagen til visse transaktioner og, for andre transaktioners vedkommende,
    på basis af en tilnærmelsesvis vurdering (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/178/Ευρατόμ, ΕΟΚ: Απόφαση της Επιτροπής
    της 23ης Μαρτίου 1990 με την οποία επιτρέπεται
    στο Λουξεμβούργο να μην λαμβάνει υπόψη ορισμένες
    κατηγορίες δραστηριοτήτων και να χρησιμοποιεί
    κατά προσέγγιση εκτιμήσεις κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο επί της προστιθέμενης αξίας (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '90/178/Euratom, ETY: Komission päätös, tehty 23 päivänä maaliskuuta
    1990, luvan antamisesta Luxemburgille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '90/178/Euratom, CEE: Decisione della Commissione, del 23 marzo 1990, che
    autorizza il Granducato del Lussemburgo a non tener conto di determinate categorie
    di operazioni o a ricorrere a talune valutazioni approssimative per il calcolo
    della base delle risorse proprie provenienti dall''imposta sul valore aggiunto
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/178/Euratom, EEG: Beschikking van de Commissie van 23 maart 1990 waarbij
    Luxemburg wordt gemachtigd geen rekening te houden met bepaalde categorieën handelingen
    en gebruik te maken van ramingen voor de berekening van de grondslag van de eigen
    middelen uit de belasting over de toegevoegde waarde (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
