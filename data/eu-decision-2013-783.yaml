title:
- language: en
  script: Latn
  content: '2013/783/EU: Commission Implementing Decision of 18 December 2013 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Trade Agreement between the European
    Union and its Member States, of the one part, and Colombia and Peru, of the other
    part, is not appropriate for imports of bananas originating in Peru for the year
    2013'
  type: main
- language: fr
  script: Latn
  content: '2013/783/UE: Décision d’exécution de la Commission du 18 décembre
    2013 déterminant que la suspension temporaire du droit de douane préférentiel
    établi au titre du mécanisme de stabilisation pour les bananes prévu par l’accord
    commercial entre l’Union européenne et ses États membres, d’une part, et
    la Colombie et le Pérou, d’autre part, n’est pas appropriée dans le cas
    des importations de bananes originaires du Pérou pour l’année 2013'
  type: main
- language: de
  script: Latn
  content: '2013/783/EU: Durchführungsbeschluss der Kommission vom 18. Dezember 2013
    zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls, die
    im Rahmen des Stabilisierungsmechanismus für Bananen des Handelsübereinkommens
    zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits und Kolumbien
    und Peru andererseits vorgesehen ist, für Einfuhren von Bananen mit Ursprung
    in Peru für das Jahr 2013 nicht angemessen ist'
  type: main
- language: bg
  script: Cyrl
