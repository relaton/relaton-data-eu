title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1887/90 of 29 June 1990 amending, for the third
    time, Regulation (EEC) No 4047/89 fixing, for certain fish stocks and groups of
    fish stocks, the total allowable catches for 1990 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1887/90 du Conseil du 29 juin 1990 portant troisième
    modification du règlement (CEE) n° 4047/89 fixant, pour certains stocks et groupes
    de stocks de poissons, les totaux admissibles des captures pour 1990 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1887/90 DES RATES vom 29. Juni 1990 zur dritten Aenderung
    der Verordnung (EWG) Nr. 4047/89 ueber die zulaessige Gesamtfangmenge und ueber
    Fangbedingungen fuer bestimmte Fischbestaende oder Bestandsgruppen (1990)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1887/90 af 29. juni 1990 om tredje ændring
    af forordning (EØF) nr. 4047/89 om fastsættelse for 1990 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1887/90 του Συμβουλίου
    της 29ης Ιουνίου 1990 για την τρίτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 4047/89 περί καθορισμού,
    για ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    για το 1990 καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1887/90 DEL CONSIGLIO del 29 giugno 1990 recante terza
    modifica del regolamento (CEE) n. 4047/89 che fissa, per alcune popolazioni o
    gruppi di popolazioni ittiche, il totale delle catture permesse per il 1990 ed
    alcune condizioni cui è soggetta la pesca del totale delle catture permesse
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1887/90 VAN DE RAAD van 29 juni 1990 houdende derde
    wijziging van Verordening (EEG) nr. 4047/89 inzake de vaststelling van de voor
    1990 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1887/90 DO CONSELHO de 29 de Junho de 1990 que altera,
    pela terceira vez, o Regulamento (CEE) n* 4047/89 que fixa, relativamente a certas
    unidades populacionais (stocks) ou grupos de unidades populacionais de peixes,
    os totais admissiveis de capturas para 1990 e certas condiçoes em que podem ser
    pescados
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1887/90 DEL CONSEJO de 29 de junio de 1990 que modifica
    por tercera vez el Reglamento (CEE) no 4047/89 por el que se fijan, para determinadas
    poblaciones o grupos de poblaciones de peces, los totales admisibles de capturas
    para 1990 y determinadas condiciones en las que pueden pescarse
  type: main
