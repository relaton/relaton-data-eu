title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 229/94 of 1 February 1994 imposing definitive
    anti-dumping duties on imports into the Community of ethanolamine originating
    in the United States of America, and collecting definitively the provisional anti-dumping
    duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 229/94 du Conseil, du 1er février 1994, instituant
    des droits antidumping définitifs sur les importations dans la Communauté d'éthanolamines
    originaires des États-Unis d'Amérique et portant perception définitive des
    droits provisoires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 229/94 des Rates vom 1. Februar 1994 zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren von Ethanolamin mit Ursprung
    in den Vereinigten Staaten von Amerika in die Gemeinschaft und zur endgültigen
    Vereinnahmung der vorläufigen Antidumpingzölle
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 229/94 af 1. februar 1994 om indførelse af
    en endelig antidumpingtold på importen til Fællesskabet af ethanolamin med oprindelse
    i Amerikas Forenede Stater og om endelig opkrævning af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 229/94 του Συμβουλίου
    της 1ης Φεβρουαρίου 1994 σχετικά με την επιβολή
    οριστικών δασμών αντιντάμπινγκ στις εισαγωγές
    στην Κοινότητα αιθανολαμίνης, καταγωγής Ηνωμένων
    Πολιτειών της Αμερικής, και για την οριστική
    είσπραξη των προσωρινών δασμών αντιντάμπινγκ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 229/94, annettu 1 päivänä helmikuuta 1994,
    lopullisten polkumyyntitullien käyttöön ottamisesta Amerikan yhdysvalloista
    peräisin olevien etanoliamiinien yhteisöön tuonnissa ja väliaikaisten tullien
    lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 229/94 del Consiglio, del 1ºfebbraio 1994, che istituisce
    un dazio antidumping definitivo sulle importazioni nella Comunità di etanolamina
    originaria degli Stati Uniti e che decide la riscossione definitiva del dazio
    antidumping provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 229/94 van de Raad van 1 februari 1994 tot instelling
    van definitieve anti-dumpingrechten op de invoer in de Gemeenschap van ethanolamine
    van oorsprong uit de Verenigde Staten van Amerika en tot definitieve invordering
    van de voorlopige anti- dumpingrechten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 229/94 do Conselho, de 1 de Fevereiro de 1994, que
    cria direitos anti-dumping definitivos sobre as importações na Comunidade de
    etanolamina originária dos Estados Unidos da América e que prevê a cobrança
    definitiva dos direitos anti- dumping provisórios
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 229/94 del Consejo, de 1 de febrero de 1994, por el
    que se establece un derecho antidumping definitivo sobre las importaciones en
    la Comunidad de etanolamina originaria de los Estados Unidos de América y por
    el que se perciben definitivamente los derechos antidumping provisionales
  type: main
- language: sv
  script: Latn
