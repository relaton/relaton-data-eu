  content: Règlement (CEE) n° 1206/69 du Conseil, du 26 juin 1969, fixant, pour
    la campagne 1969/1970, les principaux centres de commercialisation des céréales
    et les prix d'intervention dérivés s'y rapportant, ainsi que le prix d'intervention
    pour le maïs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1206/69 des Rates vom 26. Juni 1969 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide und der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise sowie des Interventionspreises für
    Mais für das Wirtschaftsjahr 1969/1970
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1206/69 del Consiglio, del 26 giugno 1969, che fissa,
    per la campagna 1969/1970, i principali centri di commercializzazione dei cereali
    e i relativi prezzi d'intervento derivati, nonché il prezzo d'intervento per
    il granturco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1206/69 van de Raad van 26 juni 1969 tot vaststelling
