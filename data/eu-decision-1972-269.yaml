  content: Décision de la Commission, du 7 juillet 1972, autorisant la République
    italienne à admettre, pour une période limitée, la commercialisation, en Sicile,
    de matériels de multiplication standards de la vigne soumis à des exigences
    réduites
  type: main
- language: de
  script: Latn
  content: '72/269/EWG: Entscheidung der Kommission vom 7. Juli 1972 zur Ermächtigung
    der Italienischen Republik, für einen begrenzten Zeitraum Standardvermehrungsgut
    von Reben mit minderen Anforderungen in Sizilien zum gewerbsmäßigen Verkehr
    zuzulassen'
  type: main
- language: it
  script: Latn
  content: '72/269/CEE: Decisione della Commissione, del 7 luglio 1972, che autorizza
    la Repubblica italiana ad ammettere, per un periodo limitato, la commercializzazione
    in Sicilia di materiali di moltiplicazione standard della vite, soggetti a requisiti
    ridotti'
  type: main
- language: nl
  script: Latn
  content: '72/269/EEG: Beschikking van de Commissie van 7 juli 1972 waarbij de Italiaanse
    Republiek wordt gemachtigd voor een beperkte periode standaardteeltmateriaal van
    wijnstokken, waarvan minder strenge eisen zijn gesteld, in Sicilië tot de handel
    toe te laten'
