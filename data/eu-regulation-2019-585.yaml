  script: Latn
  content: Commission Implementing Regulation (EU) 2019/585 of 11 April 2019 amending
    Regulation (EU) No 206/2010 as regards the inclusion of the United Kingdom of
    Great Britain and Northern Ireland and certain of its Crown Dependencies in the
    lists of third countries, territories or parts thereof authorised for the introduction
    into the Union of certain animals and fresh meat
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/585 de la Commission du 11 avril 2019
    modifiant le règlement (UE) n° 206/2010 en ce qui concerne l'inscription du
    Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines des dépendances
    de la Couronne sur les listes des pays tiers, territoires ou parties de pays tiers
    ou territoires en provenance desquels l'introduction dans l'Union de certains
    animaux et viandes fraîches est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/585 der Kommission vom 11. April 2019
