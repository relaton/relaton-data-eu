id: EURegulation1081964
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n° 108/64/CEE du Conseil, du 30 juillet 1964, portant suppression
    du délai de 6 ans prévu par le règlement n° 3 en ce qui concerne le droit
    aux prestations en nature de l'assurance maladie-maternité et aux allocations
    familiales pour les membres de la famille ne résidant pas dans le même pays
    que le travailleur
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 108/64/EWG des Rates vom 30. Juli 1964 zur Aufhebung der
    in der Verordnung Nr. 3 festgelegten Sechsjahresfrist für den Anspruch auf Sachleistungen
    bei Krankheit und Mutterschaft und auf Familienbeihilfen für die Familienangehörigen,
    die nicht in demselben Land wohnen wie der Arbeitnehmer
  type: main
- language: it
  script: Latn
  content: Regolamento n. 108/64/CEE del Consiglio, del 30 luglio 1964, relativo all'abolizione
    del termine di 6 anni, previsto dal regolamento n. 3 per quanto concerne il diritto
    alle prestazioni in natura dell'assicurazione malattia-maternità ed agli assegni
    familiari, per i membri della famiglia che non risiedono nello stesso paese del
    lavoratore
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 108/64/EEG van de Raad van 30 juli 1964 houdende afschaffing
    van de termijn van 6 jaar voorgeschreven in Verordening Nr. 3 voor het recht op
    verstrekkingen van de verzekering bij ziekte en moederschap en op kinderbijslag
    voor de gezinsleden die niet woonachtig zijn in hetzelfde land als de werknemer
  type: main
