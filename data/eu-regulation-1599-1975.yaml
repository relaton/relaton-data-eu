title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1599/75 of the Council of 24 June 1975 on the arrangements
    applicable to agricultural products and certain goods resulting from the processing
    of agricultural products originating in the African, Caribbean and Pacific States
    or in the 'overseas countries and territories'
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1599/75 du Conseil, du 24 juin 1975, relatif au régime
    applicable à des produits agricoles et à certaines marchandises résultant de
    la transformation de produits agricoles, originaires des États d'Afrique, des
    Caraïbes et du Pacifique ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1599/75 des Rates vom 24. Juni 1975 über die Regelung
    für landwirtschaftliche Erzeugnisse und bestimmte aus landwirtschaftlichen Erzeugnissen
    hergestellte Waren mit Ursprung in den Staaten in Afrika, im karibischen Raum
    und im Pazifischen Ozean oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1599/75 af 24. juni 1975 om den ordning,
    der skal anvendes for landbrugsvarer og visse varer fremstillet af landbrugsprodukter
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1599/75 del Consiglio, del 24 giugno 1975, relativo
    al regime applicabile a taluni prodotti agricoli e a talune merci risultanti dalla
    trasformazione di prodotti agricoli, originari degli Stati africani, dei Caraibi
    e del Pacifico o dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1599/75 van de Raad van 24 juni 1975 inzake de regeling
    die geldt voor landbouwprodukten en bepaalde door verwerking van landbouwprodukten
    verkregen goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied
    en de Stille Oceaan of uit de landen en gebieden overzee
  type: main
