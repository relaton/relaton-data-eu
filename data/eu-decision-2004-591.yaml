    97/467/ES čo sa týka zaradenia jedného podniku z Islandu pre mäso zo zveriny
    z farmového chovu a jedného podniku z Botswany pre mäso z nelietavých vtákov
    do predbežných zoznamov zariadení tretích krajín, z ktorých sú členské
    štáty oprávnené takéto produkty dovážať (Notifikačné číslo K(2004)
    2681) (Text s významom pre EHP) (2004/591/ES)
