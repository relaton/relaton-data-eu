  content: Decisione della Commissione del 2 agosto 2004 che modifica la decisione
    97/467/CE con riguardo all'inclusione di uno stabilimento in Islanda per le carni
    di selvaggina d'allevamento e di uno stabilimento in Botswana per le carni di
    ratiti negli elenchi provvisori di stabilimenti di paesi terzi dai quali gli Stati
    membri sono autorizzati ad importare tali prodotti [notificata con il numero C(2004)
    2681] (Testo rilevante ai fini del SEE) (2004/591/CE)
  type: main
- language: lv
  script: Latn
  content: Komisijas lēmums (2004. gada 2. augusts), ar ko groza Lēmumu 97/467/EK,
    iekļaujot vienu Islandes uzņēmumu, kas ražo saimniecībā audzētu medījamo
    dzīvnieku gaļu, un vienu Botsvānas uzņēmumu, kas ražo skrējējputnu gaļu,
    to trešo valstu uzņēmumu pagaidu sarakstos, no kuriem dalībvalstis atļauj
    ievest šādus produktus (izziņots ar dokumenta numuru K(2004) 2681) (Dokuments
    attiecas uz EEZ) (2004/591/EK)
  type: main
- language: lt
  script: Latn
