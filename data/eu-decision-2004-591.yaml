    mėsos (laukienos) įmonės ir vienos Botsvanos Ratitae genties paukščių mėsos
    įmonės įtraukimo į trečiųjų šalių įmonių, iš kurių valstybėms narėms
    leidžiama importuoti šiuos produktus, laikinąjį sąrašą (pranešta dokumentu
    Nr. K(2004) 2681) (Tekstas svarbus EEE) (2004/591/EB)
