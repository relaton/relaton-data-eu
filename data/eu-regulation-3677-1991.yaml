    των Δέκα και της Πορτογαλίας και μεταξύ της
    Πορτογαλίας και των τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3677/91 DELLA COMMISSIONE del 17 dicembre 1991 recante
    modifica del regolamento (CEE) n. 3813/90 che fissa, nel settore del latte e dei
    prodotti lattiero-caseari, il livello degli importi compensativi adesione applicabili
    negli scambi tra la Comunità dei Dieci e il Portogallo, nonché tra il Portogallo
    e i paesi terzi #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3677/91 VAN DE COMMISSIE van 17 december 1991 tot
