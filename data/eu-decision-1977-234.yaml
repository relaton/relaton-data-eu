---
id: EUDecision1977234
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 March 1977 authorizing the French Republic to
    apply protective measures to imports of live sheep falling within subheading 01.04
    A I b) of the Common Customs Tariff and mutton and lamb falling within subheading
    02.01 A ex IV thereof, originating in third countries and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/234/CEE: Décision de la Commission, du 10 mars 1977, autorisant la
    République française à appliquer des mesures de protection aux importations
    des animaux vivants de l''espèce ovine, de la sous-position 01.04 A I B) du Tarif
    douanier commun et de la viande ovine, de la sous-position 02.01 A Ex IV du Tarif
    douanier commun, originaires de pays tiers et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. März 1977, mit der die Französische
    Republik ermächtigt wird, Schutzmaßnahmen bei der Einfuhr von lebenden Schafen
    der Tarifstelle 01.04 A I b) des Gemeinsamen Zolltarifs und Fleisch von Schafen
    der Tarifstelle 02.01 A ex IV des Gemeinsamen Zolltarifs mit Urprung in dritten
    Ländern, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    zu treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. marts 1977 om bemyndigelse til Den franske
    Republik til at anvende beskyttelsesforanstaltninger for indførsler af får,
    levende, henhørende under pos. 01.04 A I b) i den fælles toldtarif, og for fårekød,
    henhørende under pos. 02.01 A ex IV i den fælles toldtarif, med oprindelse i
    tredjelande og i fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 marzo 1977, che autorizza la Repubblica
    francese ad applicare misure di protezione per l'importazione degli animali vivi
    della specie ovina, della sottovoce 01.04 A I b) della tariffa doganale comune,
    e della carne ovina, della sottovoce 02.01 A ex IV della tariffa doganale comune,
    originari dei paesi terzi e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 maart 1977 waarbij de Franse Republiek
    wordt gemachtigd beschermende maatregelen te nemen voor de invoer van levende
    schapen van post 01.04 A I b) van het gemeenschappelijk douanetarief en schapevlees
    van post 02.01 A ex IV van het gemeenschappelijk douanetarief, van oorsprong uit
    derde landen en in andere Lid-Staten in het vrije verkeer gebracht
  type: main
