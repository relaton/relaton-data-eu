  content: Décision 67/770/CEE du Conseil du 12 décembre 1967, portant prorogation
    de la suspension totale du droit du Tarif douanier commun applicable aux anchois
    (engraulis S.P.P.), salés ou en saumure, présentés en barils ou autres récipients
    d'un contenu net de 10 kg ou plus, de la position Ex 03.02 A I C) 2
  type: main
- language: de
  script: Latn
  content: '67/770/EWG: Entscheidung des Rates vom 12. Dezember 1967 über die Verlängerung
    der vollständigen Aussetzung des Zollsatzes des Gemeinsamen Zolltarifs für Sardellen
    ("Engraulis s.p.p."), gesalzen oder in Salzlake, in Fässern oder anderen Behältnissen
    mit einem Gewicht des Inhalts von 10 kg oder mehr, der Tarifnummer ex 03.02 A
    I c) 2'
  type: main
- language: it
  script: Latn
  content: '67/770/CEE: Decisione del Consiglio, del 12 dicembre 1967, recante proroga
    della sospensione totale del dazio della tariffa doganale comune applicabile alle
    alici (Engraulis s.p.p.), salate o in salamoia, confezionate in barili o altri
    recipienti del contenuto netto di 10 kg o più, della voce ex 03.02 A I c) 2'
  type: main
- language: nl
  script: Latn
  content: '67/770/EEG: Beschikking van de Raad van 12 december 1967 houdende verlenging
    van de algehele schorsing van het recht van het gemeenschappelijk douanetarief
    voor ansjovis (Engraulis s.p.p.), gezouten of gepekeld, in vaatjes of andere verpakkingen
    met een netto-inhoud van 10 kilogram of meer, van post ex 03.02 A I c) 2'
