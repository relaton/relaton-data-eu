title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2127/82 of 28 July 1982 imposing a provisional
    anti-dumping duty on trichloroethylene originating in the German Democratic Republic
    and Poland and terminating the anti-dumping proceeding in respect of trichloroethylene
    originating in Czechoslovakia, Romania, Spain and the United States of America
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2127/82 de la Commission, du 28 juillet 1982, instituant
    un droit anti-"dumping" provisoire sur le trichloroéthylène originaire de la
    République démocratique allemande et de Pologne et clôturant la procédure
    anti-"dumping" concernant le trichloroéthylène originaire de Tchécoslovaquie,
    de Roumanie, d' Espagne et des États-Unis d' Amérique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2127/82 der Kommission vom 28. Juli 1982 zur Einführung
    eines vorläufigen Antidumpingzolls auf Trichloräthylen mit Ursprung in der Deutschen
    Demokratischen Republik und Polen und zur Einstellung des Antidumpingverfahrens
    betreffend Einfuhren von Trichloräthylen mit Ursprung in Rumänien, Spanien,
    der Tschechoslowakei und den Vereinigten Staaten von Amerika
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2127/82 af 28. juli 1982 om indførelse
    af en midlertidig antidumpingtold på trichlorethylen med oprindelse i Den tyske
    demokratiske Republik og Polen, og om afslutning af antidumpingproceduren vedrørende
    trichlorethylen med oprindelse i Amerikas Forenede Stater, Rumænien, Spanien
    og Tjekkoslovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2127/82 τής Επιτροπής
    τής 28ης Ιουλίου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στό τριχλωροαιθυλένιο
    πού κατάγεται από τή Λαϊκή Δημοκρατία τής Γερμανίας
    καί τήν Πολωνία, καί περί περατώσεως τής έρευνας
    αντιντάμπινγκ γιά τό διχλωροαιθυλένιο πού
    κατάγεται από τήν Τσεχοσλοβακία, τή Ρουμανία,
    τήν Ισπανία καί τίς Ηνωμένες Πολιτείες Αμερικής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2127/82 della Commissione, del 28 luglio 1982, che
    impone un dazio provvisorio antidumping sulle importazioni di tricloroetilene
    originario della Repubblica democratica tedesca e della Polonia e che chiude la
    procedura antidumping relativa alle importazioni di tricloroetilene originario
    della Cecoslovacchia, della Romania, della Spagna e degli Stati Uniti d' America
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2127/82 van de Commissie van 28 juli 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op trichloorethyleen van oorsprong
    uit de Duitse Democratische Republiek en Polen en beëindiging van de anti-dumpingprocedure
    ten aanzien van trichloorethyleen van oorsprong uit Tsjechoslowakije, Roemenië,
    Spanje en de Verenigde Staten van Amerikav
