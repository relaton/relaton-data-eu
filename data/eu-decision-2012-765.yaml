  content: Decizia 2012/765/PESC a Consiliului din 10 decembrie 2012 de actualizare
    a listei persoanelor, grupurilor și entităților care fac obiectul articolelor
    2, 3 și 4 din Poziția comună 2001/931/PESC privind aplicarea de măsuri specifice
    pentru combaterea terorismului și de abrogare a Deciziei 2012/333/PESC
  type: main
