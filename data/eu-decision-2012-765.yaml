  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2012/765/WPZiB z dnia 10 grudnia 2012 r. dotycząca aktualizacji
    wykazu osób, grup i podmiotów objętych art. 2, 3 i 4 wspólnego stanowiska
    2001/931/WPZiB w sprawie zastosowania szczególnych środków w celu zwalczania
    terroryzmu, i uchylenia decyzji 2012/333/WPZiB
  type: main
- language: pt
  script: Latn
  content: Decisão 2012/765/PESC do Conselho, de 10 de dezembro de 2012 , que atualiza
