    Komuni 2001/931/PESK dwar l-applikazzjoni ta' miżuri speċifiċi fil-ġlieda
    kontra t-terroriżmu u li tħassar id-Deċiżjoni 2012/333/PESK
  type: main
- language: nl
  script: Latn
