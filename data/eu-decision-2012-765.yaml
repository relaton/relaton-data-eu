    dėl konkrečių priemonių taikymo kovojant su terorizmu 2, 3 ir 4 straipsniai,
    sąrašas ir panaikinamas Sprendimas 2012/333/BUSP
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2012/765/PESK tal- 10 ta' Diċembru 2012 li taġġorna
