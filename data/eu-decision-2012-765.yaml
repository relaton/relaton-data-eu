    που υπάγονται στα άρθρα 2, 3 και 4 της κοινής
    θέσης 2001/931/ΚΕΠΠΑ για την εφαρμογή ειδικών μέτρων
    για την καταπολέμηση της τρομοκρατίας και
    για την κατάργηση της απόφασης 2012/333/ΚΕΠΠΑ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2012/765/ÜVJP, 10. detsember 2012 , millega ajakohastatakse
    loetelu isikutest, rühmitustest ja üksustest, kelle suhtes kohaldatakse ühise
    seisukoha 2001/931/ÜVJP (terrorismivastaste erimeetmete rakendamise kohta) artikleid
    2, 3 ja 4 ja millega tunnistatakse kehtetuks otsus 2012/333/ÜVJP
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2012/765/YUTP, annettu 10 päivänä joulukuuta 2012
    , niitä henkilöitä, ryhmiä ja yhteisöjä koskevan luettelon saattamisesta
    ajan tasalle, joihin sovelletaan erityistoimenpiteiden toteuttamisesta terrorismin
    torjumiseksi hyväksytyn yhteisen kannan 2001/931/YUTP 2, 3 ja 4 artiklaa, sekä
    päätöksen 2012/333/YUTP kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2012/765/ZVSP od 10. prosinca 2012. o ažuriranju popisa
    osoba, skupina i subjekata na koje se primjenjuju članci 2., 3. i 4. Zajedničkog
    stajališta 2001/931/ZVSP o primjeni posebnih mjera u borbi protiv terorizma i
    o stavljanju izvan snage Odluke 2012/333/ZVSP
  type: main
- language: hu
  script: Latn
  content: A Tanács 2012/765/KKBP határozata ( 2012. december 10. ) a terrorizmus
    elleni küzdelemre vonatkozó különös intézkedések alkalmazásáról szóló
    2001/931/KKBP közös álláspont 2., 3. és 4. cikkének hatálya alá tartozó
    személyek, csoportok és szervezetek listájának naprakésszé tételéről
    és a 2012/333/KKBP határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2012/765/PESC del Consiglio, del 10 dicembre 2012 , che aggiorna
    l'elenco delle persone, dei gruppi e delle entità a cui si applicano gli articoli
    2, 3 e 4 della posizione comune 2001/931/PESC relativa all'applicazione di misure
    specifiche per la lotta al terrorismo e che abroga la decisione 2012/333/PESC
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2012/765/KĀDP ( 2012. gada 10. decembris ), ar ko atjaunina
    to personu, grupu un vienību sarakstu, kurām piemēro 2., 3. un 4. pantu Kopējā
    nostājā 2001/931/KĀDP par konkrētu pasākumu īstenošanu cīņā pret terorismu,
    un atceļ Lēmumu 2012/333/KĀDP
  type: main
- language: lt
  script: Latn
  content: 2012 m. gruodžio 10 d. Tarybos sprendimas 2012/765/BUSP, kuriuo atnaujinamas
