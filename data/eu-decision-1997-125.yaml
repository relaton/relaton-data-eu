  script: Latn
  content: '97/125/EC: Commission Decision of 24 January 1997 authorizing the indelible
    printing of prescribed information on packages of seed of oil and fibre plants
    and amending Decision 87/309/EEC authorizing the indelible printing of prescribed
    information on packages of certain fodder plant species'
  type: main
- language: fr
  script: Latn
  content: '97/125/CE: Décision de la Commission du 24 janvier 1997 autorisant l''apposition
