title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1284/75 of the Council of 20 May 1975 amending Regulations
    (EEC) No 2901/74, (EEC) No 2903/74, (EEC) No 2905/74, (EEC) No 2906/74 and (EEC)
    No 2907/74 establishing Community supervision of imports of certain products originating
    in Austria, Iceland, Portugal, Sweden and Switzerland respectively
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1284/75 du Conseil, du 20 mai 1975, modifiant les
    règlements (CEE) n° 2901/74, 2903/74, 2905/74, 2906/74 et 2907/74 portant établissement
    d'une surveillance communautaire à l'égard des importations de certains produits
    originaires d'Autriche, d'Islande, du Portugal, de Suède et de Suisse respectivement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1284/75 des Rates vom 20. Mai 1975 zur Änderung der
    Verordnungen (EWG) Nrn. 2901/74, 2903/74, 2905/74, 2906/74 und 2907/74 zur Einrichtung
    einer gemeinschaftlichen Überwachung der Einfuhren bestimmter Erzeugnisse mit
    Ursprung in Österreich, Island, Portugal, Schweden und der Schweiz
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1284/75 af 20. maj 1975 om ændring af forordningerne
    (EØF) nr. 2901/74, 2903/74, 2905/74, 2906/74 og 2907/74 om indførelse af fællesskabstilsyn
    med indførsler af visse varer med oprindelse i Østrig, Island, Portugal, Sverige
    og Schweiz
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1284/75 del Consiglio, del 20 maggio 1975, che modifica
    i regolamenti (CEE) nn. 2901/74, 2903/74, 2905/74, 2906/74 e 2907/74 che stabiliscono
    una sorveglianza comunitaria delle importazioni di taluni prodotti originari dell'Austria,
    dell'Islanda, del Portogallo, della Svezia e della Svizzera rispettivamente
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1284/75 van de Raad van 20 mei 1975 houdende wijziging
    van de Verordeningen (EEG) nrs. 2901/74, 2903/74, 2905/74, 2906/74 en 2907/74
    tot instelling van communautair toezicht op de invoer van bepaalde produkten van
    oorsprong uit respectievelijk Oostenrijk, IJsland, Portugal, Zweden en Zwitserland
  type: main
