  script: Latn
  content: Reglamento Delegado (UE) 2025/1143 de la Comisión, de 12 de junio de 2025,
    por el que se completa el Reglamento (UE) n.o 600/2014 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación relativas
    a los requisitos de autorización y de organización aplicables a los agentes
    de publicación autorizados y los sistemas de información autorizados, así como
    los requisitos de autorización aplicables a los proveedores de información consolidada,
    y por el que se deroga el Reglamento Delegado (UE) 2017/571 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/1143 av den 12 juni 2025
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 600/2014
    vad gäller tekniska tillsynsstandarder för auktorisation och organisatoriska
    krav för godkända publiceringsarrangemang och godkända rapporteringsmekanismer,
    och auktorisationskrav för tillhandahållare av konsoliderad handelsinformation,
    och om upphävande av kommissionens delegerade förordning (EU) 2017/571
