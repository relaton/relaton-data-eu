    600/2014, pokud jde o regulační technické normy týkající se požadavků
    na udělování povolení a organizačních požadavků vztahujících se na schválené
    systémy pro uveřejňování informací a schválené mechanismy pro hlášení
    obchodů a požadavků na udělování povolení vztahujících se na poskytovatele
    konsolidovaných obchodních informací, a zrušuje nařízení v přenesené
    pravomoci Komise (EU) 2017/571
  type: main
- language: da
  script: Latn
