    în ceea ce privește standardele tehnice de reglementare privind cerințele în
    materie de autorizare și cerințele organizatorice aplicabile mecanismelor de
    publicare aprobate și mecanismelor de raportare aprobate, precum și privind
    cerințele de autorizare aplicabile furnizorilor de sisteme centralizate de raportare,
    și de abrogare a Regulamentului delegat (UE) 2017/571 al Comisiei
  type: main
