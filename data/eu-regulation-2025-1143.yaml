    no respeitante às normas técnicas de regulamentação sobre os requisitos de
    autorização e de organização aplicáveis aos sistemas de publicação autorizados
    e aos sistemas de reporte autorizados, bem como sobre os requisitos de autorização
    aplicáveis aos prestadores de informação consolidada, e que revoga o Regulamento
