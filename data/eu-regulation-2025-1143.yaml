title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1143 of 12 June 2025 supplementing
    Regulation (EU) No 600/2014 of the European Parliament and of the Council with
    regard to regulatory technical standards on the authorisation and organisational
    requirements for approved publication arrangements and approved reporting mechanisms,
    and on the authorisation requirements for consolidated tape providers, and repealing
    Commission Delegated Regulation (EU) 2017/571
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1143 de la Commission du 12 juin 2025 complétant
    le règlement (UE) no 600/2014 du Parlement européen et du Conseil par des normes
    techniques de réglementation sur les exigences en matière d’agrément et d’organisation
    applicables aux dispositifs de publication agréés et aux mécanismes de déclaration
    agréés, et sur les exigences en matière d’agrément applicables aux fournisseurs
    de système consolidé de publication, et abrogeant le règlement délégué (UE)
    2017/571 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/1143 der Kommission vom 12. Juni 2025 zur
    Ergänzung der Verordnung (EU) Nr. 600/2014 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für die Zulassungs- und organisatorischen
    Anforderungen an genehmigte Veröffentlichungssysteme und genehmigte Meldemechanismen
    sowie die Zulassungsanforderungen für Bereitsteller konsolidierter Datenticker
    und zur Aufhebung der Delegierten Verordnung (EU) 2017/571 der Kommission
  type: main
- language: bg
  script: Cyrl
