title:
- language: en
  script: Latn
  content: '87/291/EEC: Commission Decision of 13 April 1987 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain nitrogenous
    chemical fertilizers originating in certain third countries which have been put
    into free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/291/CEE: Décision de la Commission du 13 avril 1987 autorisant la
    République française à procéder à une surveillance intracommunautaire des
    importations de certains engrais chimiques azotés, originaires de certains pays
    tiers, mis en libre pratique dans les autres États membres (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/291/EWG: Entscheidung der Kommission vom 13. April 1987 mit der die
    Französische Republik ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren von gewissen aus bestimmten Drittländern stammenden und in den
    anderen Mitgliedstaaten im freien Verkehr befindlichen chemischen Stickstoffdüngemitteln
    einzuführen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/291/EØF: Kommissionens beslutning af 13. april 1987 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med importen
    af visse kemiske nitrogenholdige gødningsstoffer, der har oprindelse i visse
    tredjelande og er overgået til fri omsætning i de øvrige medlemsstater (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/291/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Απριλίου 1987 για την παροχή αδείας στη γαλλική
    κυβέρνηση να καθιερώσει ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων χημικών αζωτούχων
    λιπασμάτων που κατάγονται από ορισμένες τρίτες
    χώρες και τίθενται σε ελεύθερη κυκλοφορία
    στα άλλα κράτη μέλη (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/291/CEE: Decisione della Commissione del 13 aprile 1987 che autorizza
    la Repubblica francese a prendere misure di sorveglianza intracomunitaria nei
    confronti dell''importazione di taluni concimi chimici azotati originari di paesi
    terzi e immessi in libera pratica negli Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/291/EEG: Beschikking van de Commissie van 13 april 1987 houdende machtiging
    van de Franse Republiek over te gaan tot een intracommunautair toezicht op de
    invoer van bepaalde soorten stikstofhoudende chemische meststoffen, van oorsprong
    uit bepaalde derde landen, die in de andere Lid-Staten in het vrije verkeer zijn
    gebracht (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/291/CEE: Decisão da Comissão de 13 de Abril de 1987 que autoriza
    a República Francesa a proceder a uma vigilância intracomunitária das importações
    de certos adubos químicos azotados, originários de certos países terceiros
    e introduzidos em livre prática nos outros Estados-membros (Apenas faz fé o
    texto em língua francesa)'
  type: main
- language: es
