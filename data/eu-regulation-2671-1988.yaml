  content: Commission Regulation (EEC) No 2671/88 of 26 July 1988 on the application
    of Article 85 (3) of the Treaty to certain categories of agreements between undertakings,
    decisions of associations of undertakings and concerted practices concerning joint
    planning and coordination of capacity, sharing of revenue and consultations on
    tariffs on scheduled air services and slot allocation at airports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2671/88 de la Commission du 26 juillet 1988 concernant
    l' application de l' article 85 paragraphe 3 du traité CEE à des catégories
    d' accords entre entreprises, de décisions d' associations d' entreprises ou
    de pratiques concertées ayant pour objet la planification conjointe et la coordination
    des capacités, le partage des recettes, les consultations tarifaires sur les
    services aériens réguliers et la répartition des créneaux horaires dans les
    aéroports
  type: main
