    Verhaltensweisen zur gemeinsamen Planung und Koordinierung der Kapazität, der
    Aufteilung der Einnahmen, der Tarifkonsultationen im Fluglinienverkehr sowie der
    Zuweisung von Zeitnischen auf Flughäfen
  type: main
