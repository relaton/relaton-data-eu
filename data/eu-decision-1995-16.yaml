    di aiuto «superfici» nel quadro del sistema integrato di gestione e di controllo
    di taluni regimi di aiuti comunitari («sistema integrato») (I testi in lingua
    danese, tedesca, inglese, francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '95/16/EG: Beschikking van de Commissie van 30 januari 1995 inzake de door
