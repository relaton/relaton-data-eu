title:
- language: en
  script: Latn
  content: '95/16/EC: Commission Decision of 30 January 1995 concerning the dates
    to be fixed by Member States for the submission of '' area'' aid applications
    under the integrated administration and control system for certain Community aid
    schemes (the '' integrated system'' ) (Only the Danish, German, English, French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/16/CE: Décision de la Commission du 30 janvier 1995 relative aux dates
    à fixer par les États Membres pour la présentation des demandes d''aides «surfaces»
    dans le cadre du système intégré de gestion et de contrôle relatif à certains
    régimes d''aides communautaires («système intégré») (Les textes en langues
    danoise, allemande, anglaise, française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '95/16/EG: ENTSCHEIDUNG DER KOMMISSION vom 30. Januar 1995 über die von
    den Mitgliedstaaten zu bestimmenden Zeitpunkte für die Stellung der Beihilfeanträge
    "Flächen" im Rahmen des integrierten Verwaltungs- und Kontrollsystems für bestimmte
    gemeinschaftliche Beihilferegelungen ("integriertes System") (Nur die Texte in
    dänisch, deutsch, englisch, französisch und niederländisch sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/16/EF: Kommissionens beslutning af 30. januar 1995 om de frister, som
    medlemsstaterne skal fastsætte for indgivelse af ansøgninger om arealstøtte
    i forbindelse med det integrerede system for forvaltning og kontrol af visse EF-støtteordninger
    (»det integrerede system«) (Kun de danske, tyske, engelske, franske og nederlandske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '95/16/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 30ής Ιανουαρίου
    1995 σχετικά με τις ημερομηνίες που πρέπει να
    καθοριστούν από τα κράτη μέλη για την υποβολή
    των αιτήσεων για ενίσχυση «εκτάσεις» στο πλαίσιο
    του ολοκληρωμένου συστήματος διαχείρισης
    και ελέγχου σχετικά με ορισμένα καθεστώτα
    κοινοτικών ενισχύσεων («ολοκληρωμένο σύστημα»)
    (Τα κείμενα στη δανική, γερμανική, αγγλική,
    γαλλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '95/16/EY: Komission päätös, tehty 30 päivänä tammikuuta 1995, jäsenvaltioiden
    asettamista tiettyjen yhteisön tukiohjelmien integroidun hallinto- ja valvontajärjestelmän
    ("integroidun järjestelmän") nojalla tehtyjen "alue"tukea koskevien hakemusten
    esittämispäivämääristä (Ainoastaan tanskan-, saksan-, englannin-, ranskan-
    ja hollanninkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '95/16/CE: Decisione della Commissione del 30 gennaio 1995 relativa alle
