title:
- language: fr
  script: Latn
  content: Décision de la Commission fixant, en application de l'article 226 du Traité,
    une taxe compensatoire applicable jusqu'au 7 août 1962 au sulfure de carbone
    (position n° 28.15 B du Tarif douanier commun) à l'importation dans la République
    italienne ou à l'exportation des autres États membres vers la République italienne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Erhebung einer Ausgleichsabgabe bis
    zum 7. August 1962 gemäß Artikel 226 des EWG-Vertrages bei der Einfuhr von Schwefelkohlenstoff
    (Nummer des Gemeinsamen Zolltarifs 28.15 B) in die Italienische Republik oder
    bei der Ausfuhr dieses Erzeugnisses aus den übrigen Mitgliedstaaten nach der
    Italienischen Republik
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa alla fissazione, a norma dell'articolo
    226 del Trattato, di una tassa di compensazione da applicarsi fino al 7 agosto
    1962 sul solfuro di carbonio (voce della tariffa doganale comune 28.15 B) all'importazione
    nella Repubblica Italiana o all'esportazione dagli altri Stati membri verso la
    Repubblica Italiana
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie houdende vaststelling, overeenkomstig artikel
    226 van het Verdrag, van een compenserende heffing, geldig tot 7 augustus 1962,
    op zwavelkoolstof (post 28.15 B van het gemeenschappelijk douanetarief) bij invoer
    in de Italiaanse Republiek of uitvoer uit de andere Lid-Staten naar de Italiaanse
    Republiek
  type: main
