title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3729/89 of 27 November 1989 amending for the
    third time Regulation (EEC) No 4194/88 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1989 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3729/89 du Conseil du 27 novembre 1989 portant troisième
    modification du règlement (CEE) n 4194/88 fixant, pour certains stocks ou groupes
    de stocks de poissons, les totaux admissibles des captures pour 1989 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3729/89 DES RATES vom 27. November 1989 zur dritten
    Aenderung der Verordnung (EWG) Nr. 4194/88 ueber die zulaessige Gesamtfangmenge
    fuer 1989 und ueber Fangbedingungen fuer bestimmte Fischbestaende oder Bestandsgruppen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3729/89 af 27. november 1989 om tredje ændring
    af forordning (EØF) nr. 4194/88 om fastsættelse for 1989 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3729/89 του Συμβουλίου
    της 27ης Νοεμβρίου 1989 για την τρίτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 4194/88 για τον καθορισμό,
    για ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    για το 1989 και ορισμένων όρων υπό τους οποίους
    μπορούν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3729/89 DEL CONSIGLIO del 27 novembre 1989 recante
    terza modifica del regolamento (CEE) n. 4194/88 che fissa, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale delle catture permesse per il 1989
    e alcune condizioni cui è soggetta la pesca del totale delle catture permesse
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3729/89 VAN DE RAAD van 27 november 1989 houdende
    derde wijziging van Verordening (EEG) nr. 4194/88 inzake de vaststelling van de
    voor 1989 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3729/89 DO CONSELHO de 27 de Novembro de 1989 que
    altera pela terceira vez o Regulamento (CEE) nº 4194/89 que fixa, relativamente
    a certas unidades populacionais (stocks) ou grupos de unidades populacionais de
    peixes, os totais admissíveis de capturas para 1989 e certas condições em que
    podem ser pescados #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3729/89 DEL CONSEJO de 27 de noviembre de 1989 que
    modifica por tercera vez el Reglamento (CEE) no 4194/88 por el que se fijan, para
    determinadas poblaciones o grupos de poblaciones de peces, los totales admisibles
    de capturas para 1989 y determinadas condiciones en las que pueden pescarse
  type: main
