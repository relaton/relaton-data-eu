    hinsichtlich der kombinierten Verwendung einer Zubereitung aus Benzoesäure, Calciumformiat
    und Fumarsäure mit anderen Zusatzstoffen, die Benzoesäure, Ameisensäure, Fumarsäure
    sowie deren Quellen oder Salze enthalten (Zulassungsinhaber: Novus Europe NV)'
