title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1171 of 15 June 2023 amending
    Implementing Regulations (EU) 2018/982 and (EU) 2021/2097 as regards the combined
    use of a preparation of benzoic acid, calcium formate and fumaric acid with other
    additives containing benzoic acid, formic acid, fumaric acid and sources thereof
    or salts thereof (holder of the authorisation Novus Europe NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1171 de la Commission du 15 juin 2023
    modifiant les règlements d’exécution (UE) 2018/982 et (UE) 2021/2097 en ce
    qui concerne l’utilisation combinée d’une préparation d’acide benzoïque,
    de formiate de calcium et d’acide fumarique avec d’autres additifs contenant
    de l’acide benzoïque, de l’acide formique, de l’acide fumarique et de leurs
    sources ou de leurs sels (titulaire de l’autorisation: Novus Europe NV)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1171 der Kommission vom 15. Juni 2023
