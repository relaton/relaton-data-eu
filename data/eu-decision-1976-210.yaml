title:
- language: en
  script: Latn
  content: Commission Decision of 23 December 1975 authorizing the Kingdom of Denmark
    to take protective measures in respect of Council Regulation (EEC) No 543/69 of
    25 March 1969 on the harmonization of certain social legislation relating to road
    transport
  type: main
- language: fr
  script: Latn
  content: '76/210/CEE: Décision de la Commission, du 23 décembre 1975, autorisant
    le Royaume de Danemark à prendre des mesures de protection en ce qui concerne
    le règlement (CEE) n° 543/69 du Conseil du 25 mars 1960, relatif à l''harmonisation
    de certaines dispositions en matière sociale dans le domaine des transports par
    route'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Dezember 1975, mit der das Königreich
    Dänemark ermächtigt wird, Schutzmaßnahmen betreffend die Verordnung (EWG) Nr.
    543/69 des Rates vom 25. März 1969 über die Harmonisierung bestimmter Sozialvorschriften
    im Straßenverkehr einzuführen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. december 1975 om tilladelse til kongeriget
    Danmark til at træffe beskyttelsesforanstaltninger i medfør af Rådets forordning
    (EØF) nr. 543/69 af 25. marts 1969 om harmonisering af visse bestemmelser på
    det sociale område inden for landevejstransport
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 dicembre 1975, che autorizza il Regno
    di Danimarca ad adottare misure di salvaguardia per quanto riguarda il regolamento
    (CEE) n. 543/69 del Consiglio, del 25 marzo 1969, relativo all'armonizzazione
    di alcune disposizioni in materia sociale nel settore dei trasporti su strada
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 december 1975 waarbij het Koninkrijk
    Denemarken wordt gemachtigd beschermende maatregelen te treffen met betrekking
    tot Verordening (EEG) nr. 543/69 van de Raad van 25 maart 1969 tot harmonisatie
    van bepaalde voorschriften van sociale aard voor het wegvervoer
  type: main
