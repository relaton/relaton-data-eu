id: EUDecision1976663
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 April 1976 authorizing the French Republic not
    to apply Community treatment to men's and boys' shirts, falling within heading
    No ex 61.03 of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/663/CEE: Décision de la Commission, du 20 avril 1976, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes pour hommes et garçonnets, de la position 61.03 A du Tarif douanier
    commun, originaires de Roumanie et mises en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. April 1976, mit der die Französische
    Republik ermächtigt wird, aus Rumänien stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, für
    Männer und Knaben, der Tarifstelle 61.03 A des Gemeinsamen Zolltarifs, von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. april 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjorter (herunder sports-
    og arbejdsskjorter) til mænd og drenge, som henhører under pos. 61.03 A i den
    fælles toldtarif, har oprindelse i Rumænien og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 aprile 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicie e camicette per uomo
    e per ragazzo di cui alla voce 61.03 A della tariffa doganale comune, originarie
    della Romania e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 april 1976 waarbij de Franse Republiek
    wordt gemachtigd overhemden en sporthemden van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
