title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 400/80 of 19 February 1980 on a standing
    invitation to tender for butter held by intervention agencies and intended for
    export to certain non-member countries and amending Regulations (EEC) No 2140/79
    and (EEC) No 1687/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 400/80 de la Commission, du 19 février 1980, relatif
    à une adjudication permanente de beurre détenu par les organismes d' intervention
    et destiné à l' exportation vers certains pays tiers et modifiant les règlements
    (CEE) n° 2140/79 et (CEE) n° 1687/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 400/80 der Kommission vom 19. Februar 1980 über eine
    Dauerausschreibung von Butter aus Beständen der Interventionsstellen für die
    Ausfuhr nach bestimmten Drittländern und zur Änderung der Verordnungen (EWG)
    Nr. 2140/79 und (EWG) Nr. 1687/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 400/80 af 19. februar 1980 om en løbende
    licitation vedrørende smør, som interventionsorganerne ligger inde med, og som
    er bestemt til udførsel til visse tredjelande og om ændring af forordning (EØF)
    nr. 2140/79 og (EØF) nr. 1687/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 400/80 della Commissione, del 19 febbraio 1980, relativo
    ad una gara permanente per la vendita di burro detenuto dagli organismi d' intervento
    e destinato all' esportazione verso taluni paesi terzi e recante modifica dei
    regolamenti (CEE) n. 2140/79 e (CEE) n. 1687/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 400/80 van de Commissie van 19 februari 1980 inzake
    een permanente openbare inschrijving voor uitvoer naar bepaalde derde landen van
    boter in het bezit van de interventiebureaus en tot wijziging van de Verordeningen
    (EEG) nr. 2140/79 en (EEG) nr. 1687/76
  type: main
