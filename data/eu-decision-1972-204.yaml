id: EUDecision1972204
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 2 mai 1972, autorisant la République italienne
    à exclure du traitement communautaire les roulements de tous genres (à billes,
    à aiguilles, à galets ou à rouleau de toute forme), de la position 84.62 du
    Tarif douanier commun, originaires des pays de l'Est et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/204/EWG: Entscheidung der Kommission vom 2. Mai 1972, mit der die Italienische
    Republik ermächtigt wird, aus Ostländern stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Wälzlager (Kugel-, Rollen- und Nadellager aller
    Art) der Tarifnummer 84.62 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/204/CEE: Decisione della Commissione, del 2 maggio 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i cuscinetti a
    rotolamento di ogni specie (a sfere, ad aghi, a cilindri o a rulli di ogni forma)
    della voce n. 84.62 della tariffa doganale comune, originari dei Paesi dell''Est
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/204/EEG: Beschikking van de Commissie van 2 mei 1972 waarbij de Italiaanse
    Republiek wordt gemachtigd kogellagers, naaldlagers, rollagers en dergelijke lagers,
    van post 84.62 van het gemeenschappelijk douanetarief, van oorsprong uit oostelijke
    landen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
