title:
- language: en
  script: Latn
  content: '2014/127/EU: Commission Implementing Decision of 7 March 2014 amending
    Annex I to Decision 2004/211/EC as regards the entry for China in the list of
    third countries and parts thereof from which imports into the Union of live equidae
    and semen, ova and embryos of the equine species are authorised (notified under
    document C(2014) 1386)'
  type: main
- language: fr
  script: Latn
  content: '2014/127/UE: Décision d’exécution de la Commission du 7 mars 2014
    modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne la mention
    relative à la Chine sur la liste des pays tiers et des parties de territoires
    de ces pays en provenance desquels les États membres autorisent les importations
    d’équidés vivants et de sperme, d’ovules et d’embryons de l’espèce
    équine [notifiée sous le numéro C(2014) 1386]'
  type: main
- language: de
  script: Latn
  content: '2014/127/EU: Durchführungsbeschluss der Kommission vom 7. Marz 2014 zur
