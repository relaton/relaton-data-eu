    ja niistä johdettujen tuotteiden terveyssäännöistä annetun Euroopan parlamentin
    ja neuvoston asetuksen (EY) N:o 1069/2009 täytäntöönpanosta sekä neuvoston
    direktiivin 97/78/EY täytäntöönpanosta tiettyjen näytteiden ja tuotteiden
