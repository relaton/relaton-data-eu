title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2022/488 of 25 March 2022 correcting the French
    language version of Regulation (EU) No 142/2011 implementing Regulation (EC) No
    1069/2009 of the European Parliament and of the Council laying down health rules
    as regards animal by-products and derived products not intended for human consumption
    and implementing Council Directive 97/78/EC as regards certain samples and items
    exempt from veterinary checks at the border under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/488 de la Commission du 25 mars 2022 rectifiant la
    version en langue française du règlement (UE) no 142/2011 portant application
    du règlement (CE) no 1069/2009 du Parlement européen et du Conseil établissant
    des règles sanitaires applicables aux sous-produits animaux et produits dérivés
    non destinés à la consommation humaine et portant application de la directive
    97/78/CE du Conseil en ce qui concerne certains échantillons et articles exemptés
    des contrôles vétérinaires effectués aux frontières en vertu de cette directive
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/488 der Kommission vom 25. März 2022 zur Berichtigung
    der französischen Sprachfassung der Verordnung (EU) Nr. 142/2011 zur Durchführung
    der Verordnung (EG) Nr. 1069/2009 des Europäischen Parlaments und des Rates mit
    Hygienevorschriften für nicht für den menschlichen Verzehr bestimmte tierische
    Nebenprodukte sowie zur Durchführung der Richtlinie 97/78/EG des Rates hinsichtlich
    bestimmter gemäß der genannten Richtlinie von Veterinärkontrollen an der Grenze
    befreiter Proben und Waren
  type: main
- language: bg
  script: Cyrl
