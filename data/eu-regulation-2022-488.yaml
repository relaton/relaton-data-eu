  script: Latn
  content: Uredba Komisije (EU) 2022/488 оd 25. ožujka 2022. o ispravku francuske
    jezične verzije Uredbe (EU) br. 142/2011 o provedbi Uredbe (EZ) br. 1069/2009
    Europskog parlamenta i Vijeća o utvrđivanju zdravstvenih pravila za nusproizvode
    životinjskog podrijetla i od njih dobivene proizvode koji nisu namijenjeni prehrani
    ljudi i o provedbi Direktive Vijeća 97/78/EZ u pogledu određenih uzoraka i predmeta
    koji su oslobođeni veterinarskih pregleda na granici na temelju te Direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/488 rendelete (2022. március 25.) a nem emberi
    fogyasztásra szánt állati melléktermékekre és a belőlük származó termékekre
    vonatkozó egészségügyi szabályok megállapításáról szóló 1069/2009/EK
    európai parlamenti és tanácsi rendelet végrehajtásáról, valamint a 97/78/EK
    tanácsi irányelvnek az egyes minták és tételek határon történő állategészségügyi
    ellenőrzése alóli, az irányelv szerinti mentesítése tekintetében történő
    végrehajtásáról szóló 142/2011/EU rendelet francia nyelvű változatának
    helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/488 della Commissione del 25 marzo 2022 che rettifica
    la versione in lingua francese del regolamento (UE) n. 142/2011 recante disposizioni
    di applicazione del regolamento (CE) n. 1069/2009 del Parlamento europeo e del
    Consiglio recante norme sanitarie relative ai sottoprodotti di origine animale
    e ai prodotti derivati non destinati al consumo umano, e della direttiva 97/78/CE
    del Consiglio per quanto riguarda taluni campioni e articoli non sottoposti a
    controlli veterinari alla frontiera
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2022/488 (2022. gada 25. marts), ar ko labo Regulas
    (ES) Nr. 142/2011, ar kuru īsteno Eiropas Parlamenta un Padomes Regulu (EK) Nr.
    1069/2009, ar ko nosaka veselības aizsardzības noteikumus attiecībā uz dzīvnieku
    izcelsmes blakusproduktiem un atvasinātajiem produktiem, kuri nav paredzēti
    cilvēku patēriņam, un īsteno Padomes Direktīvu 97/78/EK attiecībā uz dažiem
    paraugiem un precēm, kam uz robežas neveic veterinārās pārbaudes atbilstīgi
    minētajai direktīvai, franču valodas versiju
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (ES) 2022/488 2022 m. kovo 25 d. kuriuo ištaisoma
    Reglamento (ES) Nr. 142/2011, kuriuo įgyvendinami Europos Parlamento ir Tarybos
    reglamentas (EB) Nr. 1069/2009, kuriuo nustatomos žmonėms vartoti neskirtų
    šalutinių gyvūninių produktų ir jų gaminių sveikumo taisyklės, ir Tarybos
    direktyva 97/78/EB dėl tam tikrų mėginių ir priemonių, kuriems netaikomi
    veterinariniai tikrinimai pasienyje pagal tą direktyvą, teksto redakcija prancūzų
    kalba
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2022/488 tal-25 ta’ Marzu 2022 li jikkoreġi
    l-verżjoni bil-lingwa Franċiża tar-Regolament (UE) Nru 142/2011 li jimplimenta
    r-Regolament (KE) Nru 1069/2009 tal-Parlament Ewropew u tal-Kunsill li jistabbilixxi
    regoli tas-saħħa li jirrigwardaw prodotti sekondarji tal-annimali jew derivati
    minnhom mhux maħsuba għall-konsum mill-bniedem u li jimplimenta d-Direttiva
    tal-Kunsill 97/78/KE li tistabbilixxi l-prinċipji li jirregolaw l-organizzazzjoni
    tal-verifiki veterinarji fuq prodotti li jidħlu fil-Komunità minn pajjiżi terzi
    skont dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/488 van de Commissie van 25 maart 2022 tot rectificatie
    van de Franse taalversie van Verordening (EU) nr. 142/2011 tot uitvoering van
    Verordening (EG) nr. 1069/2009 van het Europees Parlement en de Raad tot vaststelling
    van gezondheidsvoorschriften inzake niet voor menselijke consumptie bestemde dierlijke
    bijproducten en afgeleide producten en tot uitvoering van Richtlijn 97/78/EG van
    de Raad wat betreft bepaalde monsters en producten die vrijgesteld zijn van veterinaire
    controles aan de grens krachtens die richtlijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2022/488 z dnia 25 marca 2022 r. w sprawie
    sprostowania francuskiej wersji językowej rozporządzenia (UE) nr 142/2011 w
    sprawie wykonania rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 1069/2009
    określającego przepisy sanitarne dotyczące produktów ubocznych pochodzenia
    zwierzęcego, nieprzeznaczonych do spożycia przez ludzi, oraz w sprawie wykonania
    dyrektywy Rady 97/78/WE w odniesieniu do niektórych próbek i przedmiotów zwolnionych
    z kontroli weterynaryjnych na granicach w myśl tej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/488 da Comissão de 25 de março de 2022 que retifica
    a versão em língua francesa do Regulamento (UE) n.o 142/2011 que aplica o Regulamento
    (CE) n.o 1069/2009 do Parlamento Europeu e do Conselho que define regras sanitárias
    relativas a subprodutos animais e produtos derivados não destinados ao consumo
    humano e que aplica a Diretiva 97/78/CE do Conselho no que se refere a certas
    amostras e certos artigos isentos de controlos veterinários nas fronteiras ao
    abrigo da referida diretiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/488 al Comisiei din 25 martie 2022 de rectificare
    a versiunii în limba franceză a Regulamentului (UE) nr. 142/2011 de punere în
    aplicare a Regulamentului (CE) nr. 1069/2009 al Parlamentului European și al
    Consiliului de stabilire a unor norme sanitare privind subprodusele de origine
    animală și produsele derivate care nu sunt destinate consumului uman și de
    punere în aplicare a Directivei 97/78/CE a Consiliului în ceea ce privește
    anumite probe și produse care sunt scutite de la controalele sanitar-veterinare
    la frontieră în conformitate cu directiva menționată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2022/488 z 25. marca 2022, ktorým sa opravuje
    francúzske znenie nariadenia (EÚ) č. 142/2011, ktorým sa vykonáva nariadenie
    Európskeho parlamentu a Rady (ES) č. 1069/2009, ktorým sa ustanovujú zdravotné
    predpisy týkajúce sa vedľajších živočíšnych produktov a odvodených produktov
    neurčených na ľudskú spotrebu, a ktorým sa vykonáva smernica Rady 97/78/ES,
    pokiaľ ide o určité vzorky a predmety vyňaté spod povinnosti veterinárnych
    kontrol na hraniciach podľa danej smernice
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2022/488 z dne 25. marca 2022 o popravku francoske
    različice Uredbe (EU) št. 142/2011 o izvajanju Uredbe (ES) št. 1069/2009 Evropskega
    parlamenta in Sveta o določitvi zdravstvenih pravil za živalske stranske proizvode
    in pridobljene proizvode, ki niso namenjeni prehrani ljudi, ter o izvajanju Direktive
    Sveta 97/78/ES glede nekaterih vzorcev in predmetov, ki so izvzeti iz veterinarskih
    pregledov na meji v skladu z navedeno direktivo
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/488 de la Comisión de 25 de marzo de 2022 que corrige
    la versión francesa del Reglamento (UE) n.o 142/2011, por el que se establecen
    las disposiciones de aplicación del Reglamento (CE) n.o 1069/2009 del Parlamento
    Europeo y del Consejo, por el que se establecen las normas sanitarias aplicables
    a los subproductos animales y los productos derivados no destinados al consumo
    humano, y la Directiva 97/78/CE del Consejo en cuanto a determinadas muestras
    y unidades exentas de los controles veterinarios en la frontera en virtud de la
    misma
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2022/488 av den 25 mars 2022 om rättelse
    av den franska språkversionen av förordning (EU) nr 142/2011 om genomförande
    av Europaparlamentets och rådets förordning (EG) nr 1069/2009 om hälsobestämmelser
    för animaliska biprodukter och därav framställda produkter som inte är avsedda
    att användas som livsmedel och om genomförande av rådets direktiv 97/78/EG
    vad gäller vissa prover och produkter som enligt det direktivet är undantagna
    från veterinärkontroller vid gränsen
  type: main
