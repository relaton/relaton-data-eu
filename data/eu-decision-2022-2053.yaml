  content: Commission Implementing Decision (EU) 2022/2053 of 18 October 2022 on the
    request for registration of the European citizens’ initiative entitled ‘European
    citizens’ initiative for vegan meal’, pursuant to Regulation (EU) 2019/788
    of the European Parliament and of the Council (notified under document C(2022)
    7418) (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
