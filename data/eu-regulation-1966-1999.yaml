    pitämän leipävehnän vientiä koskevan pysyvän tarjouskilpailun kohteena olevan
    määrän nostamisesta 3 150 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1966/1999 della Commissione, del 15 settembre 1999,
