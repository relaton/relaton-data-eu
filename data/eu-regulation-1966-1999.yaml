    διαγωνισμού για εξαγωγή 3 150 000 τόνων μαλακού
    αρτοποιήσιμου σίτου που έχει στη διάθεσή του
    ο γαλλικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1966/1999, annettu 15 päivänä syyskuuta 1999,
