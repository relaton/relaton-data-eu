title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1966/1999 of 15 September 1999 amending Regulation
    (EC) No 1758/98 increasing to 3 150 000 tonnes the quantity of wheat of breadmaking
    quality held by the French intervention agency for which a standing invitation
    to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1966/1999 de la Commission, du 15 septembre 1999, modifiant
    le règlement (CE) n° 1758/98 et portant à 3 150 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
