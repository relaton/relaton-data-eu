    Änderung der Verordnung (EG) Nr. 1758/98 und zur Erhöhung der Dauerausschreibung
    zur Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem
    Brotweichweizen auf 3 150 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1966/1999 af 15. september 1999 om ændring
    af forordning (EF) nr. 1758/98 og om forhøjelse til 3 150 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
