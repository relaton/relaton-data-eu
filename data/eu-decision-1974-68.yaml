id: EUDecision197468
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 November 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Federal Republic
    of Germany for expenditure on vocational retraining and resettlement operations
    carried out by the 'Berufsgenossenschaften', the social insurance organizations
    for employees and the Land North Rhine-Westphalia
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1973, portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice de
    la République fédérale d'Allemagne pour des dépenses relatives à des opérations
    de rééducation professionnelle et de réinstallation effectuées par les "Berufsgenossenschaften",
    la "Bundesknappschaft", les organismes d'assurances sociales des travailleurs
    et le "Land" de Rhénanie-du-Nord-Westphalie
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. November 1973 über die Gewährung
    des in Artikel 125 des Vertrages vorgesehenen Zuschusses aus dem Europäischen
    Sozialfonds an die Bundesrepublik Deutschland zu Aufwendungen für von den Berufsgenossenschaften,
    der Bundesknappschaft, den Arbeiterrentenversicherungsträgern und vom Land Nordrhein-Westfalen
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. november 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til forbundsrepublikken
    Tyskland i forbindelse med omkostninger vedrørende faglig omskoling og flytteforanstaltninger,
    som er gennemført af »Berufsgenossenschaften«, »Bundesknappschaft«, af bidragsydere
    til Arbeiterrentenversicherung og af delstaten Nordrhein-Westfalen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 novembre 1973, recante concessione
    del contributo del Fondo sociale europeo, previsto dall'articolo 125 del trattato,
    a favore della Repubblica federale di Germania per spese concernenti operazioni
    di riqualificazione professionale e di nuova sistemazione effettuate dalle «Berufsgenossenschaften»,
    dalla «Bundesknappschaft», dagli enti di assicurazione sociale dei lavoratori
    e dal Land Renania del Nord-Westfalia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 november 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Bondsrepubliek Duitsland voor door de "Berufsgenossenschaften",
    de "Bundesknappschaft", de sociale verzekeringsinstellingen en de deelstaat Noordrijnland-Westfalen
    gemaakte herscholings- en verplaatsingskosten
  type: main
