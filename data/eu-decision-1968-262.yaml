title:
- language: fr
  script: Latn
  content: Décision du Conseil du 18 juin 1968, portant suspension totale des droits
    du Tarif douanier commun applicables aux produits destinés à être incorporés
    dans des bateaux pour la navigation maritime ou destinés à l'armement ou à
    l'équipement de ces bateaux
  type: main
- language: de
  script: Latn
  content: '68/262/EWG: Entscheidung des Rates vom 18. Juni 1968 über die vollständige
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Waren, die zum Bau,
    zur Instandsetzung, zur Instandhaltung oder zum Umbau von Wasserfahrzeugen für
    die Seeschiffahrt oder zur Ausrüstung dieser Wasserfahrzeuge bestimmt sind'
  type: main
- language: it
  script: Latn
  content: '68/262/CEE: Decisione del Consiglio, del 18 giugno 1968, relativa alla
    sospensione totale dei dazi della tariffa doganale comune applicabili ai prodotti
    destinati ad essere incorporati nelle navi per la navigazione marittima o destinati
    all''armamento o all''attrezzatura di dette navi'
  type: main
- language: nl
  script: Latn
  content: '68/262/EEG: Beschikking van de Raad van 18 juni 1968 houdende volledige
    schorsing van de rechten van het gemeenschappelijk douanetarief die van toepassing
    zijn op produkten, bestemd voor de bouw, de reparatie, het onderhoud of de verbouwing
    van zeeschepen dan wel voor de uitrusting van deze schepen'
  type: main
