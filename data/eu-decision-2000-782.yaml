    e de sanidade animal e a certificação veterinária para as importações de
    carne de ratites de criação e altera a Decisão 94/85/CE, que estabelece uma
    lista de países terceiros a partir dos quais os Estados-Membros autorizam a importação
    de carne fresca de aves de capoeira [notificada com o número C(2000) 3700]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 8 decembrie 2000 de modificare a Deciziei 2000/609/CE
    de stabilire a condițiilor de sănătate animală și publică și de certificare
    veterinară pentru importurile de carne de ratite de crescătorie și de modificare
    a Deciziei 94/85/CE de stabilire a unei liste a țărilor terțe din care statele
    membre autorizează importul de carne proaspătă de pasăre [notificată cu numărul
    C(2000) 3700]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 8. decembra 2000, ktorým sa mení a dopĺňa rozhodnutie
    2000/609/ES o veterinárnych a hygienických podmienkach a o veterinárnych osvedčeniach
    na dovoz chovaných vtákov nadradu bežci a ktorým sa mení a dopĺňa rozhodnutie
    94/85/ES, ktorým sa vypracúva zoznam tretích krajín, z ktorých členské
