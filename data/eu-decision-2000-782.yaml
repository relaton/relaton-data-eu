    и ветеринарното сертифициране за внос на месо
    от щраусови птици от ферми и за изменение на
    Решение 94/85/ЕО относно изготвянето на списък
    с трети страни, от които държавите-членки разрешават
    вноса на прясно месо от домашни птици (нотифицирано
    под номер С(2000) 3700)
  type: main
- language: cs
  script: Latn
