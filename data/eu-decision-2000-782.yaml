    ar ko nosaka dzīvnieku un sabiedrības veselības nosacījumus un veterināro
    sertifikāciju, kura attiecas uz saimniecībās audzētu skrējējputnu gaļas
    importu un ar kuru groza Lēmumu 94/85/EK, ar ko izveido to trešo valstu sarakstu,
    no kurām dalībvalstis atļauj importēt svaigu mājputnu gaļu (izziņots ar
    dokumenta numuru C(2000) 3700)
  type: main
- language: lt
  script: Latn
