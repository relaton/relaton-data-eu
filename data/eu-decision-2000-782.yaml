    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2000/782/CE: Decisione della Commissione, dell''8 dicembre 2000, recante
    modifica della decisione 2000/609/CE che stabilisce le condizioni sanitarie e
    di polizia sanitaria e la certificazione veterinaria per l''importazione da paesi
    terzi di carni di ratiti d''allevamento e recante modifica della decisione 94/85/CE
    che fissa l''elenco dei paesi terzi da cui gli Stati membri autorizzano l''importazione
    di carni di pollame fresche [notificata con il numero C(2000) 3700]'
  type: main
- language: lv
  script: Latn
