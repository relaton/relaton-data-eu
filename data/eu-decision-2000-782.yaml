title:
- language: en
  script: Latn
  content: '2000/782/EC: Commission Decision of 8 December 2000 amending Decision
    2000/609/EC laying down animal and public health conditions and veterinary certification
    for imports of farmed ratite meat and amending Decision 94/85/EC drawing up a
    list of third countries from which the Member States authorise imports of fresh
    poultrymeat (notified under document number C(2000) 3700)'
  type: main
- language: fr
  script: Latn
  content: '2000/782/CE: Décision de la Commission du 8 décembre 2000 modifiant
    la décision 2000/609/CE établissant les conditions sanitaires et de police sanitaire
    ainsi que la certification véterinaire requises à l''importation de viandes
    de ratites d''élevage et modifiant la décision 94/85/CE établissant une liste
    de pays tiers en provenance desquels les États membres autorisent les importations
    de viandes fraîches de volaille [notifiée sous le numéro C(2000) 3700]'
  type: main
- language: de
  script: Latn
  content: '2000/782/EG: Entscheidung der Kommission vom 8. Dezember 2000 zur Änderung
    der Entscheidung 2000/609/EG über die tierseuchenrechtlichen und gesundheitlichen
    Bedingungen und die Veterinärbescheinigungen für die Einfuhr von Fleisch von
    Zuchtlaufvögeln und zur Änderung der Entscheidung 94/85/EG über das Verzeichnis
    der Drittländer, aus denen die Mitgliedstaaten die Einfuhr von frischem Geflügelfleisch
    genehmigen (Bekannt gegeben unter Aktenzeichen K(2000) 3700)'
  type: main
- language: bg
