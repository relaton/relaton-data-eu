    wijziging van Beschikking 2000/609/EG tot vaststelling van veterinairrechtelijke
    voorschriften, gezondheidsvoorschriften en voorschriften inzake veterinaire certificering
    voor de invoer van vlees van gekweekte loopvogels en tot wijziging van Beschikking
