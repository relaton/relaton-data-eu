    2000/609/EB, nustatantį gyvūnų sveikatos ir visuomenės sveikatos reikalavimus
    bei veterinarinį sertifikavimą importuojant ūkiuose auginamų Ratitae genties
    paukščių mėsą, ir iš dalies keičiantis Sprendimą 94/85/EB, pateikiantį
    trečiųjų šalių, iš kurių valstybės narės leidžia importuoti šviežią
    paukštieną, sąrašą (pranešta dokumentu Nr. C(2000) 3700)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-8 ta’ Diċembru 2000 li temenda d-Deċiżjoni
    2000/609/KE li tippreskrivi l-kondizzjonijiet dwar l-annimali u s-saħħa pubblika
    u ċ-ċertifikazzjoni veterinarja għall-importazzjoni ta’ laħam tar-ratiti
    mrobbija, u li temenda d-Deċiżjoni 94/85/KE li telenka l-pajjiżi terzi li mingħandhom
    l-Istati Membri jawtorizzaw l-importazzjoni tal-laħam tat-tajr frisk. (innotifikata
    fid-dokument numru Ċ(2000) 3700)
  type: main
- language: nl
  script: Latn
