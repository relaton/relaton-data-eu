    de invoer van vers vlees van pluimvee toestaan (kennisgeving geschied onder nummer
    C(2000) 3700)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 8 grudnia 2000 r. zmieniająca decyzję 2000/609/WE
