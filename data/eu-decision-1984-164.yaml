    Generator» δύναται να πραγματοποιηθεί ατελώς ως
    προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '84/164/CEE: Decisione della Commissione del 12 marzo 1984 che stabilisce
    che l''importazione dell''apparecchio denominato "Innisfree - CRT Image Generator"
    può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '84/164/EEG: Beschikking van de Commissie van 12 maart 1984 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Innisfree - CRT Image generator" met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
