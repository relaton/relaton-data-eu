title:
- language: en
  script: Latn
  content: '84/164/EEC: Commission Decision of 12 March 1984 establishing that the
    apparatus described as ''Innisfree - CRT Image Generator'' may be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/164/CEE: Décision de la Commission du 12 mars 1984 constatant que
    l''importation de l''appareil dénommé "Innisfree-CRT Image Generator" peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/164/EWG: Entscheidung der Kommission vom 12. März 1984, mit der festgestellt
    wird, daß das Gerät ,,INNISFREE C.R.T. Image Generator" unter Befreiung von
    den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '84/164/EØF: Kommissionens beslutning af 12. marts 1984 om fastslåelse
    af, at indførsel af apparatet "Innisfree C.R.T. Image Generator" kan ske med
    fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/164/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
