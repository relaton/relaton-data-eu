  script: Latn
  content: '86/108/EEC: Commission Decision of 25 February 1986 authorizing the French
    Republic and the Kingdom of the Netherlands to permit temporarily the marketing
    of field pea seed not satisfying the requirements of Council Directive 66/401/EEC'
  type: main
- language: fr
  script: Latn
  content: '86/108/CEE: Décision de la Commission du 25 février 1986 autorisant
    la République française et le Royaume des Pays-Bas à admettre temporairement
    la commercialisation de semences de pois fourragers ne répondant pas aux exigences
    de la directive 66/401/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '86/108/EWG: Entscheidung der Kommission vom 25. Februar 1986 mit der die
    Französische Republik und das Königreich der Niederlande ermächtigt werden,
    vorübergehend die Vermarktung von Futtererbsensaatgut zu gestatten, das nicht
    den Anforderungen der Richtlinie des Rates 66/401/EWG entspricht'
  type: main
- language: da
  script: Latn
  content: '86/108/EØF: Kommissionens beslutning af 25. februar 1986 om bemyndigelse
    af Den franske Republik og kongeriget Nederlandene til midlertidigt at tillade
    handel med frø af markærter, der ikke opfylder kravene i Rådets direktiv 66/401/EØF'
  type: main
- language: el
  script: Grek
  content: '86/108/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Φεβρουαρίου 1986 που δίνει την άδεια στη Γαλλική
    Δημοκρατία και το Βασίλειο των Κάτω Χωρών να
    επιτρέπουν προσωρινά την εμπορία σπόρων προς
    σπορά κτηνοτροφικών πίσων που δεν ανταποκρίνονται
    στις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '86/108/CEE: Decisione della Commissione del 25 febbraio 1986 che autorizza
