  script: Latn
  content: Verordening (EG) nr. 1264/94 van de Raad van 30 mei 1994 houdende verbod
    om eisen in te willigen van de autoriteiten van Haïti in verband met contracten
    en transacties op de uitvoering waarvan de maatregelen opgelegd bij of op grond
    van de resoluties 917 (1994), 841 (1993), 873 (1993) en 875 (1993) van de Veiligheidsraad
    van de Verenigde Naties van toepassing zijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1264/94 z dnia 30 maja 1994 r. zakazujące
