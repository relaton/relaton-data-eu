    által történő kielégítésének tilalmáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1264/94 del Consiglio, del 30 maggio 1994, che vieta
    di accogliere le richieste delle autorità di Haiti relative a contratti e a transazioni
    la cui esecuzione ha risentito delle misure imposte o derivanti dalle risoluzioni
    917 (1994), 841 (1993), 873 (1993) e 875 (1993) del Consiglio di sicurezza delle
    Nazioni Unite
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1264/94 (1994. gada 30. maijs), ar ko aizliedz
    apmierināt Haiti iestāžu prasības attiecībā uz līgumiem un darījumiem,
    kuru izpildi ir ietekmējuši pasākumi, kas noteikti ar Apvienoto Nāciju Organizācijas
    Drošības padomes Rezolūcijām Nr. 917 (1994. g), Nr. 841 (1993. g.), Nr. 873
    (1993. g.) un Nr. 875 (1993. g.) vai pieņemti saskaņā ar šīm rezolūcijām
  type: main
- language: lt
  script: Latn
  content: 1994 m. gegužės 30 d. Tarybos reglamentas (EB) Nr. 1264/94 draudžiantis
