title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1264/94 of 30 May 1994 prohibiting the satisfying
    of claims by the Haitian authorities with regard to contracts and transactions
    the performance of which was affected by the measures imposed by or pursuant to
    United Nations Security Council resolutions 917 (1994), 841 (1993), 873 (1993)
    and 875 (1993)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1264/94 du Conseil, du 30 mai 1994, interdisant de
    faire droit aux demandes des autorités haïtiennes relatives aux contrats et
    opérations dont l'exécution a été affectée par les mesures imposées par
    les résolutions 917 (1994), 841 (1993), 873 (1993) et 875 (1993) du Conseil de
    sécurité des Nations unies ou décidées conformément à ces dernières
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1264/94 des Rates vom 30. Mai 1994 über das Verbot
    der Erfüllung von Ansprüchen der haitischen Behörden im Zusammenhang mit Verträgen
    und Geschäften, deren Durchführung durch die Maßnahmen aufgrund der Resolutionen
    917 (1994), 841 (1993), 873 (1993) und 875 (1993) des Sicherheitsrates der Vereinten
    Nationen berührt wurde
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1264/94 на Съвета от 30 май
    1994 година за забрана за удовлетворяването
    на искове във връзка с договори и сделки, чието
    изпълнение е засегнато от мерките, наложени
    или предприети съгласно Резолюции 917(1994), 841(1993),
    873(1993) и 875(1993) на Съвета за сигурност на Организацията
    на обединените нации
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1264/94 ze dne 30. května 1994, kterým se zakazuje
    uspokojení nároků haitských orgánů v souvislosti se smlouvami a obchodními
    operacemi, jejichž plnění bylo dotčeno opatřeními přijatými na základě
    rezolucí Rady bezpečnosti OSN 917 (1994), 841 (1993), 873 (1993) a 875 (1993)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1264/94 af 30. maj 1994 om forbud mod at indfri
    fordringer, som Haitis myndigheder har gjort gældende i forbindelse med kontrakter
    og transaktioner, der er omfattet af De Forenede Nationers Sikkerhedsråds resolution
    917 (1994), 841 (1993), 873 (1993) og 875 (1993)
  type: main
- language: el
  script: Grek
