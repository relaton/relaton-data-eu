    της 30ής Μαΐου 1994 που απαγορεύει την ικανοποίηση
    των απαιτήσεων των αρχών της Αϊτής σχετικά
    με συμβάσεις και συναλλαγές η εκτέλεση των
    οποίων έχει επηρεαστεί από τα μέτρα του Συμβουλίου
