    päätöslauselmissa 917 (1994), 841 (1993), 873 (1993) ja 875 (1993) määrätyt
    tai niiden mukaisesti toteutetut toimenpiteet ovat vaikuttaneet
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1264/94 od 30. svibnja 1994. o zabrani namirivanja
