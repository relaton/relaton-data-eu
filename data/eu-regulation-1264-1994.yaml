    utjecale mjere uvedene ili u skladu s rezolucijama Vijeća sigurnosti Ujedinjenih
    naroda 917 (1994), 841 (1993), 873 (1993) i 875 (1993)
  type: main
- language: hu
  script: Latn
  content: A Tanács 1264/94/EK rendelete (1994. május 30.) az Egyesült Nemzetek
