    a căror executare a fost afectată de măsurile impuse sau hotărâte în conformitate
    cu Rezoluțiile nr. 917 (1994), 841 (1993), 873 (1993) și 875 (1993) ale Consiliului
    de Securitate al Organizației Națiunilor Unite
  type: main
