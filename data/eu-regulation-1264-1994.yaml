    aos contratos e transacções cujo cumprimento tenha sido afectado por medidas
    impostas ou decorrentes das Resoluções 917 (1994), 841 (1993), 873 (1993) e
    875 (1993) do Conselho de Segurança das Nações Unidas
  type: main
- language: ro
