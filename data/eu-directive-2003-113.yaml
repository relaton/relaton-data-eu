title:
- language: en
  script: Latn
  content: Commission Directive 2003/113/EC of 3 December 2003 amending the Annexes
    to Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC as regards the fixing
    of maximum levels for certain pesticide residues in and on cereals, foodstuffs
    of animal origin and certain products of plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2003/113/CE de la Commission du 3 décembre 2003 modifiant les
    annexes des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil en ce qui
    concerne la fixation de teneurs maximales pour certains résidus de pesticides
    sur et dans les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2003/113/EG der Kommission vom 3. Dezember 2003 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates hinsichtlich
    der Festsetzung von Höchstgehalten an Rückständen von bestimmten Schädlingsbekämpfungsmitteln
    in und auf Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2003/113/ЕО на Комисията от 3 декември
    2003 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определянето на максимални количества
    на остатъци от пестициди във и върху зърнените
    култури, храните от животински произход и някои
    продукти от растителен произход, включително
    плодовете и зеленчуците
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2003/113/ES ze dne 3. prosince 2003, kterou se mění
    přílohy směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud jde o stanovení
    maximálních limitů reziduí pesticidů v obilovinách, v potravinách živočišného
    původu a v některých produktech rostlinného původu, včetně ovoce a zeleniny,
    a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2003/113/EF af 3. december 2003 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF med hensyn til fastsættelse
    af maksimalgrænseværdier for visse pesticidrester i og på korn, levnedsmidler
    af animalsk oprindelse og visse produkter af vegetabilsk oprindelse, herunder
    frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2003/113/ΕΚ της Επιτροπής, της 3ης Δεκεμβρίου
    2003, για τροποποίηση των παραρτημάτων των οδηγιών
    του Συμβουλίου 86/362/ΕΟΚ, 86/363/ΕΟΚ και 90/642/ΕΟΚ,
    όσον αφορά τον καθορισμό των ανωτάτων ορίων
    για ορισμένα υπολείμματα φυτοφαρμάκων πάνω
    και μέσα στα σιτηρά, στα τρόφιμα ζωικής προέλευσης
    και σε ορισμένα προϊόντα φυτικής προέλευσης,
    συμπεριλαμβανομένων των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2003/113/EÜ, 13. detsember 2003, millega muudetakse
    nõukogu direktiivide 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ (vastavalt teraviljas,
    loomses toidus ja teatavates taimset päritolu saadustes, sealhulgas puu- ja köögiviljas,
    sisalduvate ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise
    kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2003/113/EY, annettu 3 päivänä joulukuuta 2003,
    neuvoston direktiivien 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden muuttamisesta
    viljoissa ja niiden pinnassa, eläimistä saatavissa elintarvikkeissa ja niiden
    pinnassa sekä tietyissä kasviperäisissä tuotteissa, mukaan luettuina hedelmät
    ja vihannekset, ja niiden pinnassa olevien tiettyjen torjunta-ainejäämien enimmäismäärien
    vahvistamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2003/113/EK irányelve (2003. december 3.) a 86/362/EGK, a
    86/363/EGK és a 90/642/EGK tanácsi irányelv mellékleteinek a gabonafélékben,
    az állati eredetű élelmiszerekben és egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és a zöldségekben –, illetve azok
    felületén található egyes peszticid-szermaradványok megengedett legmagasabb
    mértékének meghatározása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2003/113/CE della Commissione, del 3 dicembre 2003, che modifica
    gli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    per quanto riguarda le quantità massime di residui di alcuni antiparassitari
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2003/113/EK (2003. gada 3. decembris), ar kuru groza
    pielikumus Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK par konkrētu
    pesticīdu atlieku maksimālo pieļaujamo daudzumu noteikšanu attiecīgi labībā
    un uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem, kā arī konkrētos
    augu izcelsmes produktos un uz tiem, ieskaitot augļus un dārzeņus
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžo 3 d. Komisijos direktyva 2003/113/EB, iš dalies keičianti
    Tarybos direktyvų 89/362/EEB, 86/363/EEB ir 90/642/EEB, nustatančių didžiausią
    leistiną tam tikrų pesticidų likučių koncentraciją grūdinėse kultūrose,
    gyvūninės kilmės maisto produktuose ir kai kuriuose augalinės kilmės produktuose,
    įskaitant vaisius ir daržoves, ir ant jų, priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2003/113/KE tat-3 ta’ Diċembru 2003 li
    temenda l-Annessi tad-Direttivi tal-Kunsill 86/362/KEE, 86/363/KEE u 90/642/KEE
    f’dak li jirrigwardja l-istabbilizzar tal-livelli minimi ta’ ċerti residwi
    ta’ pestiċidi fi u fuq iċ-ċereali, l-oġġetti ta’ l-ikel ta’ l-oriġini
    mill-annimali u ċerti prodotti ta’ l-oriġini mill-pjanti, inklużi l-frott
    u l-ħxejjexTest b’rilevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2003/113/EG van de Commissie van 3 december 2003 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad ten aanzien van de vaststelling van maximumgehalten aan residuen van bepaalde
    bestrĳdingsmiddelen in en op granen, levensmiddelen van dierlĳke oorsprong en
    bepaalde producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2003/113/WE z dnia 3 grudnia 2003 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG i 90/642/EWG w zakresie ustalenia najwyższych
    dopuszczalnych poziomów niektórych pozostałości pestycydów w zbożach i na
    ich powierzchni, w środkach spożywczych pochodzenia zwierzęcego i niektórych
    produktach pochodzenia roślinnego, w tym w owocach i warzywach
  type: main
- language: pt
  script: Latn
  content: Directiva 2003/113/CE da Comissão, de 3 de Dezembro de 2003, que altera
    os anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho no respeitante
    à fixação de teores máximos de resíduos de determinados pesticidas à superfície
    e no interior dos cereais, dos géneros alimentícios de origem animal e de determinados
    produtos de origem vegetal, incluindo frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2003/113/CE a Comisiei din 3 decembrie 2003 de modificare a anexelor
    la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului privind stabilirea
    conținuturilor maxime de reziduuri de pesticide din și de pe cereale, produse
    alimentare de origine animală și anumite produse de origine vegetală, inclusiv
    fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie č. 2003/113/ES z 3. decembra 2003, ktorou sa menia a
    dopĺňajú smernice Rady č. 86/362/EHS, 86/363/EHS a 90/642/EHS týkajúce sa
    stanovenia maximálnych limitov rezíduí pesticídov v a na obilninách, v potravinách
    živočíšneho pôvodu a v určitých produktoch rastlinného pôvodu, vrátane
    ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2003/113/ES z dne 3. decembra 2003 o spremembi prilog
    k direktivam Sveta 86/362/EGS, 86/363/EGS in 90/642/EGS glede določitve najvišjih
    mejnih vrednosti ostankov pesticidov v in na žitih, živilih živalskega izvora
    in nekaterih proizvodih rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2003/113/CE de la Comisión, de 3 de diciembre de 2003, por la
    que se modifican los anexos de las Directivas 86/362/CEE, 86/363/CEE y 90/642/CEE
    del Consejo, en lo que atañe a la fijación de los contenidos máximos de determinados
    residuos de plaguicidas en los cereales, en los alimentos de origen animal y en
    determinados productos de origen vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2003/113/EG av den 3 december 2003 om ändring av
    bilagorna till rådets direktiv 86/362/EEG, 86/363/EEG och 90/642/EEG beträffande
    fastställande av gränsvärden för vissa bekämpningsmedelsrester i och på
    spannmål, livsmedel av animaliskt ursprung och vissa produkter av vegetabiliskt
    ursprung, inklusive frukt och grönsaker
