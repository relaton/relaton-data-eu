id: EUDecision1974603
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 November 1974 authorizing the French Republic
    not to apply Community treatment to woven fabrics of synthetic textile fibres
    discontinuous falling within subheading 56.07 A of the Common Customs Tariff,
    originating in Taïwan, and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '74/603/CEE: Décision de la Commission, du 28 novembre 1974, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues, de la position 56.07 A du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. November 1974, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern der Tarifnummer
    56.07 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. november 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af korte syntetiske
    fibre, som henhører under position 56.07 A, i den fælles toldtarif, har oprindelse
    i Taïwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 novembre 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    in fiocco, della voce n. 56.07 A della tariffa doganale comune, originari di Taiwan
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 november 1974 waarbij de Franse Republiek
    wordt gemachtigd weefsels van synthetische stapelvezels van post 56.07 A van het
    gemeenschappelijk douanetarief, van oorsprong uit Tai-wan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
