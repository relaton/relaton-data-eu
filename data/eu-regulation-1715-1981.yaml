title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1715/81 of 26 June 1981 amending for the
    eighth time Regulation (EEC) No 2793/77 on detailed rules of application for granting
    special aid for skimmed milk for use as feed for animals other than young calves
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1715/81 de la Commission, du 26 juin 1981, portant
    huitième modification du règlement (CEE) n° 2793/77 relatif aux modalités
    d' application d' une aide spéciale pour le lait écrémé destiné à l' alimentation
    des animaux à l' exclusion des jeunes veaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1715/81 der Kommission vom 26. Juni 1981 zur achten
    Änderung der Verordnung (EWG) Nr. 2793/77 über die Durchführungsbestimmungen
    für eine Sonderbeihilfe für Magermilch zur Fütterung von Tieren mit Ausnahme
    von jungen Kälbern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1715/81 af 26. juni 1981 om ottende
    ændring af forordning (EØF) nr. 2793/77 om gennemførelsesbestemmelser for en
    særstøtte til skummetmælk, der skal anvendes som foder til husdyr, undtagen
    unge kalve
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1715/81 τής Επιτροπής
    τής 26ης Ιουνίου 1981 περί ογδόης τροποποιήσεως
    τού κανονισμού (ΕΟΚ) αριθ. 2793/77 «περί τών λεπτομερειών
    εφαρμογής ειδικής ενισχύσεως γιά τό αποκορυφωμένο
    γάλα σέ σκόνη πού προορίζεται γιά τή διατροφή
    ζώων, εξαιρουμένων τών νεαρών μόσχων»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1715/81 della Commissione, del 26 giugno 1981, recante
    ottava modifica del regolamento (CEE) n. 2793/77 relativo alle modalità di applicazione
    dell' aiuto speciale per il latte destinato all' alimentazione degli animali esclusi
    i giovani vitelli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1715/81 van de Commissie van 26 juni 1981 houdende
