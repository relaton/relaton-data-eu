id: EUDecision1997665
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/665/EC: Commission Decision of 29 September 1997 amending Decision
    97/85/EC recognizing that the production of certain quality wines produced in
    specified regions in Spain, by reason of their qualitative characteristics, is
    far from able to satisfy demand (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/665/CE: Décision de la Commission du 29 septembre 1997 modifiant la
    décision 97/85/CE reconnaissant que la production de certains vins de qualité
    produits dans des régions déterminées en Espagne est, du fait des caractéristiques
    qualitatives de ces vins, largement inférieure à la demande (Le texte en langue
    espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/665/EG: Entscheidung der Kommission vom 29. September 1997 zur Änderung
    der Entscheidung 97/85/EG zur Anerkennung, daß die Erzeugung von Qualitätsweinen
    bestimmter Anbaugebiete in Spanien wegen qualitativer Merkmale der Nachfrage nicht
    entspricht (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/665/EF: Kommissionens beslutning af 29. september 1997 om ændring
    af beslutning 97/85/EF om anerkendelse af, at produktionen af visse kvalitetsvine
    fra bestemte dyrkningsområder i Spanien på grund af disse vines kvalitative
    egenskaber langtfra er tilstrækkelig til at dække efterspørgslen (Kun den spanske
    tekst er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/665/ΕΚ: Απόφαση της Επιτροπής της 29ης Σεπτεμβρίου
    1997 για την τροποποίηση της απόφασης 97/85/ΕΚ,
    με την οποία αναγνωρίζεται ότι η παραγωγή ορισμένων
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές της Ισπανίας είναι, λόγω των ποιοτικών
    χαρακτηριστικών των οίνων αυτών, σε μεγάλο
    βαθμό κατώτερη από τη ζήτηση (Το κείμενο στην
    ισπανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/665/EY: Komission päätös, tehty 29 päivänä syyskuuta 1997, tiettyjen
    määritellyllä alueella Espanjassa tuotettujen laatuviinien tuotannon toteamisesta
    niiden laatuominaisuuksien vuoksi huomattavasti kysyntää pienemmäksi tehdyn
    päätöksen 97/85/EY muuttamisesta (Ainoastaan espanjankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/665/CE: Decisione della Commissione del 29 settembre 1997 recante modifica
    della decisione 97/85/CE che riconosce la produzione di taluni vini di qualità
    prodotti in determinate regioni della Spagna largamente inferiore alla domanda
    a causa delle caratteristiche qualitative di tali vini (Il testo in lingua spagnola
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/665/EG: Beschikking van de Commissie van 29 september 1997 tot wijziging
    van Beschikking 97/85/EG houdende erkenning van het feit dat de productie van
    bepaalde v.q.p.r.d.''s in Spanje, gezien de kwaliteitskenmerken van deze wijnen,
    ver bij de vraag achterblijft (Slechts de tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/665/CE: Decisão da Comissão de 29 de Setembro de 1997 que altera
    a Decisão 97/85/CE que reconhece que a produção em Espanha de determinados
    vinhos de qualidade produzidos em regiões determinadas é, pelas suas características
    de qualidade, substancialmente inferior à procura (Apenas faz fé o texto em
    língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '97/665/CE: Decisión de la Comisión de 29 de septiembre de 1997 que modifica
    la Decisión 97/85/CE por la que se reconoce que la producción de determinados
    vinos de calidad producidos en regiones determinadas de España es muy inferior
    a la demanda debido a sus características cualitativas (El texto en lengua española
    es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/665/EG: Kommissionens beslut av den 29 september 1997 om ändring av
    beslut 97/85/EG med erkännande av att på grund av de kvalitetsmässiga egenskaperna
    hos vissa typer av kvalitetsvin som framställs inom specificerade områden i
    Spanien, ligger produktionen av dessa viner långt under efterfrågan (Endast
    den spanska texten är giltig)'
  type: main
