    de filetes de judeu liso ou judeu
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1243 al Comisiei din 25 iunie
    2025 de modificare a anexelor I și II la Regulamentul de punere în aplicare
    (UE) 2024/1288 în ceea ce privește realocarea contingentelor neutilizate pentru
    preparatele sau conservele de fileuri de ton (crude, fierte și congelate), preparatele
