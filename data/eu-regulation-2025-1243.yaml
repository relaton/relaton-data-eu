    de ton fregată sau de fileuri de ton negru
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1243 z 25. júna 2025, ktorým
    sa menia prílohy I a II k vykonávaciemu nariadeniu (EÚ) 2024/1288, pokiaľ
    ide o prerozdelenie nevyužitých kvót na pripravené alebo konzervované filé
    z tuniaka a chrbtové filé z tuniaka (surové, varené a mrazené), pripravené
    alebo konzervované filé z makrely a pripravené alebo konzervované filé z
    tuniaka fregatového alebo tuniaka makrelovitého
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1243 z dne 25. junija 2025 o spremembi
    prilog I in II k Izvedbeni uredbi (EU) 2024/1288 glede prerazporeditve neizrabljenih
    kvot za pripravljene ali konzervirane filete tuna in filete tuna loins (surove,
    kuhane in zamrznjene), pripravljene ali konzervirane filete skuše in pripravljene
    ali konzervirane filete fregatnega trupca ali trupca
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1243 de la Comisión, de 25 de junio
    de 2025, por el que se modifican los anexos I y II del Reglamento de Ejecución
    (UE) 2024/1288 en lo que respecta a la reasignación de contingentes no utilizados
    de preparaciones o conservas de filetes de atún y lomos de atún (crudo, cocido
    y congelado), preparaciones o conservas de filetes de caballa y preparaciones
    o conservas de filetes de melva tazard o melva
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1243 av den 25 juni 2025
    om ändring av bilagorna I och II till genomförandeförordning (EU) 2024/1288
    vad gäller omfördelning av outnyttjade kvoter av beredda eller konserverade
    filéer och loins av tonfisk (råa, kokta eller frysta), beredda eller konserverade
    makrillfiléer och beredda eller konserverade fregattmakrill- eller auxidmakrillfiléer
