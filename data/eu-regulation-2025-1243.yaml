  content: Commission Implementing Regulation (EU) 2025/1243 of 25 June 2025 amending
    Annexes I and II of Implementing Regulation (EU) 2024/1288 as regards the reallocation
    of unused quotas for prepared or preserved fillets of tuna and tuna loins (raw,
    cooked and frozen), prepared or preserved mackerel fillets and prepared or preserved
    frigate tuna or frigate mackerel fillets
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1243 de la Commission du 25 juin 2025
    modifiant les annexes I et II du règlement d’exécution (UE) 2024/1288 en ce
    qui concerne la réattribution de contingents inutilisés pour les préparations
    ou conserves de filets de thon et de longes de thon (crues, cuites et congelées),
    les préparations ou conserves de filets de maquereaux et les préparations ou
    conserves de filets d’auxides
  type: main
