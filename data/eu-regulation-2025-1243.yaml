    gabaliem (neapstrādātiem, termiski apstrādātiem un saldētiem), sagatavotu
    vai konservētu makreles fileju un sagatavotu vai konservētu fregates tunzivs
    vai makreļtunzivs fileju neizmantoto kvotu pārdali groza Īstenošanas regulas
