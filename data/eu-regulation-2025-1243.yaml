    per quanto riguarda la riassegnazione dei contingenti inutilizzati delle preparazioni
    o conserve di filetti di tonno (crudi, cotti e congelati), delle preparazioni
    o conserve di filetti di sgombro e delle preparazioni o conserve di filetti di
    tombarello
  type: main
- language: lv
  script: Latn
