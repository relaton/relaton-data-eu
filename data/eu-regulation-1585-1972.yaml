title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1585/72 de la Commission, du 25 juillet 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tubes et tuyaux (y compris leurs ébauches) et barres creuses, en cuivre,
    de la position tarifaire 74.07, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2795/71, du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1585/72 der Kommission vom 25. Juli 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Rohre (einschließlich Rohlinge)
    und Hohlstangen, aus Kupfer, der Tarifnummer 74.07, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1585/72 della Commissione, del 25 luglio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    tubi (compresi i loro sbozzi) e barre forate, di rame, della voce doganale 74.07,
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1585/72 van de Commissie van 25 juli 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op buizen en pijpen (ook indien niet afgewerkt) en holle staven,
    van koper van post 74.07, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend
  type: main
