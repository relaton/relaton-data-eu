    Verordnung (EWG) Nr. 2539/84 und zur Änderung der Verordnung (EWG) Nr. 569/88
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 413/91 af 20. februar 1991 om salg
