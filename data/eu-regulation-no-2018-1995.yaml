title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2018/95 of 21 August 1995 determining the
    quantities available for which applications for licences for certain eggs and
    poultrymeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, the Slovak Republic, Bulgaria and Romania can be lodged from 1 to 10
    September 1995
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2018/95 DE LA COMMISSION du 21 août 1995 déterminant
    les quantités disponibles pour lesquelles des demandes de licences d'importation
    pour certains produits des secteurs de la viande de volaille et des oeufs dans
    le cadre du régime prévu dans les accords conclus entre la Communauté et la
    république de Pologne, la république de Hongrie, la République tchèque, la
    République slovaque, la Bulgarie et la Roumanie peuvent être introduites du
    1er au 10 septembre 1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2018/95 DER KOMMISSION vom 21. August 1995 zur Festsetzung
