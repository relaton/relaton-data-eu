  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1664/72 della Commissione, del 28 luglio 1972, che
    modifica la data dell' entrata in vigore del regolamento (CEE) n. 990/72 relativo
    alle modalità per la concessione di aiuti al latte scremato trasformato in alimenti
    composti ed al latte scremato in polvere destinato all' alimentazione degli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1664/72 van de Commissie van 28 juli 1972 houdende
    wijziging van de datum van inwerkingtreding van Verordening (EEG) nr. 990/72 met
    betrekking tot de uitvoeringsbepalingen inzake de toekenning van steun voor tot
    mengvoeder verwerkte ondermelk en voor magere-melkpoeder, bestemd voor veevoeder
