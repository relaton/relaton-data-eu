  content: Commission Regulation (EEC) No 2212/83 of 29 July 1983 implementing Decision
    No 1/83 of the ACP-EEC Customs Cooperation Committee derogating from the definition
    of the concept of 'originating products' to take into account the special situation
    of Malawi and Kenya with regard to certain items of fishing tackle (fishing flies)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2212/83 de la Commission du 29 juillet 1983 relatif
    à l' application de la décision no 1/83 du comité de coopération douanière
    ACP-CEE portant dérogation à la définition de la notion de produits originaires,
    pour tenir compte de la situation particulière du Malawi et du Kenya en ce qui
    concerne certains articles de pêche (mouches pour la pêche)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2212/83 der Kommission vom 29. Juli 1983 zur Durchführung
    des Beschlusses Nr. 1/83 des AKP-EWG-Ausschusses für Zusammenarbeit im Zollwesen
    zur Abweichung von der Begriffsbestimmung für ,,Ursprungswaren' ' zur Berücksichtigung
    der besonderen Lage von Malawi und Kenia bei bestimmtem Angelgerät (künstliche
    Fliegen zum Flugangeln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2212/83 af 29. juli 1983 om gennemførelse
    af AVS/EØF-Toldsamarbejdsudvalgets afgørelse nr. 1/83 om undtagelse fra definitionen
    af begrebet "varer med oprindelsesstatus" af hensyn til den særlige situation
    i Malawi og Kenya for så vidt angår visse typer fiskegrej (fluer til fiskeri)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2212/83 της Επιτροπής
