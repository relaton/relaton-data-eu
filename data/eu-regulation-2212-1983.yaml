    αριθ. 1/83 της Επιτροπής Τελωνειακής Συνεργασίας
    ΑΚΕ—ΕΟΚ που αφορά την παρέκκλιση από τον ορισμό
    της έννοιας «καταγόμενα προϊόντα» ή «προϊόντα
    καταγωγής» για την αντιμετώπιση της ειδικής
    περίπτωσης του Μαλάουϊ και της Κένυας (τεχνητά
    δολώματα—ομοιώματα εντόμων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2212/83 della Commissione del 29 luglio 1983 relativo
    all' applicazione della decisione 1/83 del comitato di cooperazione doganale ACP-CEE
    che deroga alla definizione della nozione di prodotti originari per tener conto
    della situazione particolare del Malawi e del Kenia per quanto riguarda taluni
    articoli da pesca (mosche per la pesca)
  type: main
- language: nl
  script: Latn
