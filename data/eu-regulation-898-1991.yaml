title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 898/91 of 8 April 1991 imposing definitive
    anti-dumping duties on imports of certain welded tubes, of iron or non-alloy steel,
    originating in Turkey or Venezuela and definitively collecting the provisional
    anti-dumping duties imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 898/91 du Conseil, du 8 avril 1991, instituant un
    droit antidumping définitif sur les importations de certains tubes soudés, en
    fer ou en aciers non alliés, originaires de Turquie et du Venezuela et portant
    perception définitive du droit antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 898/91 des Rates vom 8. April 1991 zur Einführung
    eines endgültigen Antidumpingzolls auf Einfuhren bestimmter geschweißter Rohre
    aus Eisen oder nichtlegiertem Stahl mit Ursprung in der Türkei oder in Venezuela
    und zur endgültigen Vereinnahmung des vorläufigen Zolls auf diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 898/91 af 8. april 1991 om indførelse af
    en endelig antidumpingtold på importen af visse svejsede rør, af jern og ulegeret
    stål, med oprindelse i Tyrkiet og Venezuela og om endelig opkrævning af den
    midlertidige antidumpingtold på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 898/91 του Συμβουλίου
    της 8ης Απριλίου 1991 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    συγκολλημένων σωλήνων, από σίδηρο ή από αμιγείς
    χάλυβες, καταγωγής Τουρκίας και Βενεζουέλας,
    και περί οριστικής εισπράξεως του προσωρινού
    δασμού αντιντάμπινγκ, που έχει επιβληθεί στις
    εν λόγω εισαγωγές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 898/91, annettu 8 päivänä huhtikuuta 1991,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Turkista ja Venezuelasta
    peräisin olevien hitsattujen raudasta tai seostamattomasta teräksestä valmistettujen
    putkien tuonnissa ja tässä tuonnissa käyttöön otetun väliaikaisen polkumyyntitullin
    lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 898/91 del Consiglio, dell' 8 aprile 1991, che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di tubi saldati,
    di ferro o di acciai non legati originari della Turchia e del Venezuela e recante
    riscossione definitiva del dazio antidumping provvisorio istituito su tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 898/91 van de Raad van 8 april 1991 tot instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde gelaste buizen
    van ijzer of van niet-gelegeerd staal, van oorsprong uit Turkije of Venezuela,
    en tot definitieve inning van de op deze invoer ingestelde voorlopige anti-dumpingrechten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 898/91 do Conselho, de 8 de Abril de 1991, que institui
    direitos anti-dumping definitivos sobre as importações de certos tubos soldados,
    de ferro ou de aço não ligado, originários da Turquia e da Venezuela e determina
    a cobrança definitiva dos direitos anti-dumping provisórios instituídos sobre
    as referidas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 898/91 del Consejo, de 8 de abril de 1991, por el
    que se establecen derechos antidumping definitivos sobre determinadas importaciones
    de determinados tubos soldados de hierro o de acero sin alear originarios de Turquía
    o de Venezuela y por el que se recaudan de modo definitivo los derechos antidumping
    provisionales establecidos sobre tales importaciones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 898/91 av den 8 april 1991 om införande av
    en slutgiltig antidumpningstull på import av vissa svetsade rör av järn eller
    olegerat stål med ursprung i Turkiet eller Venezuela samt om slutgiltigt uttag
    av den preliminära antidumpningstullen på sådan import
