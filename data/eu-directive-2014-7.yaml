  script: Latn
  content: Directiva Delegada 2014/7/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en soldaduras, revestimientos de terminaciones de componentes eléctricos
    y electrónicos y de circuitos impresos, conexiones de cables eléctricos, pantallas
    y conectores cerrados utilizados en a) campos magnéticos situados en una esfera
    de 1 m de radio alrededor del isocentro del imán de los equipos médicos de imagen
    por resonancia magnética, incluidos los monitores de paciente diseñados para
    su uso dentro de esa esfera, o b) campos magnéticos situados como máximo a 1
    m de distancia de las superficies externas de los imanes ciclotrónicos y de los
    imanes para el transporte de los haces y el control de la dirección de estos,
    utilizados en terapia de partículas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/7/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly i lödmetall, beläggning
    på anslutningar i elektriska och elektroniska komponenter och kretskort, anslutningar
    för elektriska ledningar, avskärmningar och kapslade kontaktdon som används
    a) i magnetiska fält inom en sfär med 1 m radie runt magnetens isocenter i medicinsk
    MRT-utrustning, inklusive patientmonitorer utformade för att användas inom detta
    område, eller b) i magnetiska fält inom 1 m avstånd från ytterytorna på cyklotronmagneter,
    magneter för stråltransport och kontroll av strålriktning för partikelterapi
  type: main
