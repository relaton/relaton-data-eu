  content: Commission Delegated Directive 2014/7/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in solders, termination coatings of electrical and electronic components and printed
    circuit boards, connections of electrical wires, shields and enclosed connectors
    which are used (a) in magnetic fields within the sphere of 1 m radius around the
    isocentre of the magnet in medical magnetic resonance imaging equipment, including
    patient monitors designed to be used within this sphere, or (b) in magnetic fields
    within 1 m distance from the external surfaces of cyclotron magnets, magnets for
    beam transport and beam direction control applied for particle therapy
  type: main
- language: fr
  script: Latn
  content: 'Directive déléguée 2014/7/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne l’inclusion
    d’une exemption pour le plomb dans les soudures, les revêtements des extrémités
    des composants électriques et électroniques et des cartes de circuits imprimés,
    les raccordements des fils électriques, les écrans et les connecteurs protégés
    qui sont utilisés: a) dans les champs magnétiques situés dans un rayon de 1
    mètre autour de l’isocentre de l’aimant des équipements médicaux d’imagerie
    par résonance magnétique, y compris les moniteurs individuels conçus pour être
    utilisés dans cette zone; ou b) dans les champs magnétiques situés à 1 mètre
    de distance au maximum des surfaces externes des aimants de cyclotron ou des aimants
    servant au transport et au réglage de l’orientation des faisceaux de particules
    utilisés en hadronthérapie'
  type: main
