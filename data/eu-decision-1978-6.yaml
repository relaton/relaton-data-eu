id: EUDecision19786
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 October 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to tableware and other articles of a kind commonly used for
    domestic or toilet purposes, of porcelain or china (including biscuit porcelain
    and parian) falling within heading No ex 69.11 of the Common Customs Tariff, originating
    in the People's Republic of China and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/6/CEE: Décision de la Commission, du 25 octobre 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire la vaisselle et les articles de ménage
    ou de toilette en porcelaine, de la position Ex 69.11 du Tarif douanier commun,
    originaires de la République populaire de Chine et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Oktober 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Volksrepublik China stammendes und in den anderen Mitgliedstaaten
    im freien Verkehr befindliches Geschirr sowie Haushalts- und Toilettengegenstände
    aus Porzellan, der Tarifnummer ex 69.11 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 25. oktober 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage bordservice samt husholdnings- og toiletartikler af porcelæn, som
    henhører under ex pos. 69.11 i den fælles toldtarif, har oprindelse i Den kinesiske
    Folkerepublik og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 ottobre 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario il vasellame e gli oggetti di uso domestico o da toletta,
    di porcellana, della voce ex 69.11 della tariffa doganale comune, originari della
    Repubblica popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 oktober 1977 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen van porselein,
    van post ex 69.11 van het gemeenschappelijk douanetarief, van oorsprong uit de
    Chinese Volksrepubliek en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
