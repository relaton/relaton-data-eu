---
id: EURegulation22371996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2237/96 of 22 November 1996 initiating a
    'new exporter' review of Regulation (EEC) No 830/92 concerning the imposition
    of definitive anti-dumping duties on imports of certain polyester yarns (man-made
    staple fibres) originating, inter alia, in Indonesia, repealing the duty with
    regard to imports from an exporter in this country and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2237/96 de la Commission du 22 novembre 1996 portant
    ouverture d'une procédure de réexamen «nouvel exportateur» du règlement (CEE)
    nº 830/92 instituant un droit antidumping définitif sur les importations de
    certains fils de polyesters (fibres synthétiques ou artificielles discontinues)
    originaires, entre autres, d'Indonésie, abrogation du droit en ce qui concerne
    les importations réalisées par un exportateur de ce pays et assujettissement
    de ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2237/96 der Kommission vom 22. November 1996 zur Einleitung
    einer Überprüfung der Verordnung (EWG) Nr. 830/92 zur Einführung endgültiger
    Antidumpingzölle auf die Einfuhren bestimmter Polyestergarne (Spinnfasern) mit
    Ursprung u. a. in Indonesien, zur Aufhebung des Zolls auf die Einfuhren eines
    Ausführers in diesem Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2237/96 af 22. november 1996 om indledning
    af en fornyet undersøgelse (ny eksportør) af forordning (EØF) nr. 830/92 om
    indførelse af en endelig antidumpingtold på importen af visse garner af polyester
    (korte kemofibre) med oprindelse i bl.a. Indonesien, om ophævelse af tolden med
    hensyn til import fra en eksportør i dette land og om registrering af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2237/96 της Επιτροπής
    της 22ας Νοεμβρίου 1996 για την έναρξη επανεξέτασης
    «για κάποιο νέο εξαγωγέα» του κανονισμού (ΕΟΚ)
    αριθ. 830/92, περί επιβολής οριστικών δασμών αντιντάμπινγκ
    στις εισαγωγές ορισμένων νημάτων από πολυεστέρα
    (συνθετικές μη συνεχείς ίνες) καταγωγής, μεταξύ
    άλλων, Ινδονησίας με την οποία καταργείται
    ο δασμός όσον αφορά τις εισαγωγές από εξαγωγέα
    στην οικεία χώρα και καταγράφονται οι εισαγωγές
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2237/96, annettu 22 päivänä marraskuuta 1996,
    lopullisen polkumyyntitullin käyttöön ottamiseen tiettyjen muun muassa Indonesiasta
    peräisin olevien polyesterilankojen (katkottujen tekokuitujen) tuonnissa annettuun
    asetukseen (ETY) N:o 830/92 liittyvän uutta viejää koskevan tarkastelun aloittamisesta,
    tullin kumoamisesta kyseisessä maassa toimivan viejän tuonnin osalta ja kyseisen
    tuonnin kirjaamisvelvollisuudesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2237/96 della Commissione del 22 novembre 1996 che
    avvia un riesame, relativo ai «nuovi esportatori», del regolamento (CEE) n.
    830/92, che istituisce un dazio antidumping definitivo sulle importazioni di alcuni
    tipi di filati di poliesteri (fibre artificiali in fiocco) originari, tra l'altro,
    dell'Indonesia, e che abroga il dazio in vigore nei confronti delle importazioni
    di un esportatore in tale paese e stabilisce che tali importazioni siano soggette
    a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2237/96 van de Commissie van 22 november 1996 tot
    inleiding van een nieuw onderzoek "nieuwe exporteurs" van Verordening (EEG) nr.
    830/92 tot instelling van een definitief anti-dumpingrecht op de invoer van bepaalde
    garens van polyester (kunstmatige stapelvezels) van oorsprong uit onder meer Indonesië,
    tot intrekking van het recht op de door een exporteur uit dit land uitgevoerde
    produkten en tot instelling van een registratieprocedure voor deze invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2237/96 da Comissão de 22 de Novembro de 1996 relativo
    ao início de um reexame, respeitante a um «novo exportador», do Regulamento
    (CEE) nº 830/92, que cria um direito anti-dumping definitivo sobre as importações
    de certos fios de poliéster (fibras sintéticas artificiais), originários da
    Indonésia, entre outros países, que revoga o direito em vigor relativamente
    às importações provenientes de um exportador deste país e que sujeita estas
    importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2237/96 de la Comision de 22 de noviembre de 1996 por
    el que se inicia una reconsideración, para un nuevo exportador, del Reglamento
    (CEE) nº 830/92, por el que se establece un derecho antidumping definitivo sobre
    las importaciones de determinados hilados de poliéster (fibras sintéticas discontinuas)
    originarios, entre otros países, de Indonesia, por el que se deroga el derecho
    aplicable a las importaciones de un exportador de ese país y por el que dichas
    importaciones se someten a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2237/96 av den 22 november 1996 om inledande
    av en "ny exportör"-översyn av förordning (EEG) nr 830/92 om införande av
    slutgiltiga antidumpningstullar på import av vissa polyestergarner (av syntetstapelfibrer)
    med ursprung i bland annat Indonesien, om upphävande av tullen på import från
    en exportör i detta land och om registrering av denna import
  type: main
