title:
- language: en
  script: Latn
  content: Directive 2003/36/EC of the European Parliament and of the Council of 26
    May 2003 amending, for the 25th time, Council Directive 76/769/EEC on the approximation
    of the laws, regulations and administrative provisions of the Member States relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (substances classified as carcinogens, mutagens or substances toxic to reproduction
    — c/m/r)
  type: main
- language: fr
  script: Latn
  content: Directive 2003/36/CE du Parlement européen et du Conseil du 26 mai 2003
    portant vingt-cinquième modification de la directive 76/769/CEE du Conseil concernant
    le rapprochement des dispositions législatives, réglementaires et administratives
    des États membres relatives à la limitation de la mise sur le marché et de
    l'emploi de certaines substances et préparations dangereuses (substances classées
    cancérogènes, mutagènes ou toxiques pour la reproduction — CMR)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2003/36/EG des Europäischen Parlaments und des Rates vom 26.
    Mai 2003 zur fünfundzwanzigsten Änderung der Richtlinie 76/769/EWG des Rates
    zur Angleichung der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten für
    Beschränkungen des Inverkehrbringens und der Verwendung gewisser gefährlicher
    Stoffe und Zubereitungen (als krebserzeugend, erbgutverändernd bzw. fortpflanzungsgefährdend
    — k/e/f — eingestufte Stoffe)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2003/36/ЕО на Европейския парламент
    и на Съвета от 26 май 2003 година относно двадесет
    и пето изменение на Директива 76/769/ЕИО на Съвета
    за сближаване на законовите, подзаконовите
    и административните разпоредби на държавите-членки
    относно ограниченията за пускането на пазара
    и употребата на някои опасни вещества и препарати
    (вещества, класифицирани като канцерогени,
    мутагени или вещества, токсични за репродукцията
    — c/m/r)
  type: main
- language: cs
  script: Latn
  content: Směrnice evropského parlamentu a rady 2003/36/ES ze dne 26. května 2003,
