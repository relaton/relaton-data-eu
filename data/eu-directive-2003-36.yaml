    l-approssimazzjoni tal-liġijiet, ir-regolamenti u d-dispożizzjonijiet amministrattivi
    ta’ l-Istati Membri li għandhom x’jaqsmu mar-restrizzjonijiet dwar il-marketing
    u l-użu ta’ ċerti sustanzi u preparazzjonijiet perikolużi (sustanzi klassifikati
    bħala karċinoġeni, mutaġeniċi jew sustanzi tossiċi għar-riproduzzjoni —
    k/m/r)
  type: main
