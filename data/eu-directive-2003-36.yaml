    vagy a reprodukciót károsító hatásúnak osztályozott anyagok – k/m/r)
    forgalomba hozatalának és felhasználásának korlátozásaira vonatkozó tagállami
    törvényi, rendeleti és közigazgatási rendelkezések közelítéséről szóló
    76/769/EGK tanácsi irányelv 25. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2003/36/CE del Parlamento europeo e del Consiglio, del 26 maggio
    2003, recante venticinquesima modifica della direttiva 76/769/CEE del Consiglio
    concernente il ravvicinamento delle disposizioni legislative, regolamentari ed
    amministrative degli Stati membri relative alle restrizioni in materia d'immissione
    sul mercato e di uso di talune sostanze e preparati pericolosi (sostanze classificate
    come cancerogene, mutagene o tossiche per la riproduzione — CMR)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un padomes Direktīva 2003/36/EK (2003. gada 26. maijs),
    ar ko 25. reizi groza Padomes Direktīvu 76/769/EEK par dalībvalstu normatīvo
    un administratīvo aktu tuvināšanu attiecībā uz dažu bīstamu vielu un preparātu
    tirgū laišanas un lietošanas ierobežojumiem (vielas, kas klasificētas kā
    kancerogēnas, mutagēnas vai toksiskas reproduktīvajai funkcijai – c/m/r)
  type: main
- language: lt
  script: Latn
  content: 2003 m. gegužės 26 d. Europos Parlamento ir tarybos Direktyva 2003/36/EB
    dvidešimt penktą kartą iš dalies keičianti Tarybos direktyvą 76/769/EEB
    dėl valstybių narių įstatymų ir kitų teisės aktų, susijusių su tam tikrų
    pavojingų medžiagų ir preparatų (medžiagų, klasifikuojamų kaip kancerogeninės,
    mutageninės arba toksiškos reprodukcijai – c/m/r) pardavimo ir naudojimo apribojimais,
    suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2003/36/KE tal-Parlament Ewropew u tal-Kunsill tas-26 ta’
