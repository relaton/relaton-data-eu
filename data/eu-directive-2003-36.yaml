    administrativt eller ved lov fastsatte bestemmelser om begrænsning af markedsføring
    og anvendelse af visse farlige stoffer og præparater (stoffer, der er klassificeret
    som kræftfremkaldende, mutagene eller reproduktionstoksiske)
  type: main
