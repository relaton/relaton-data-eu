    právních a správních předpisů členských států týkajících se omezení
    uvádění na trh a používání některých nebezpečných látek a přípravků
    (látky klasifikované jako karcinogeny, mutageny nebo látky toxické pro reprodukci
    – c/m/r)
  type: main
