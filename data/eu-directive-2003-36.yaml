  script: Latn
  content: Richtlĳn 2003/36/EG van het Europees Parlement en de Raad van 26 mei 2003
    tot vĳfentwintigste wĳziging van Richtlĳn 76/769/EEG van de Raad betreffende
    de onderlinge aanpassing van de wettelĳke en bestuursrechtelĳke bepalingen der
    lidstaten inzake de beperking van het op de markt brengen en van het gebruik van
    bepaalde gevaarlĳke stoffen en preparaten (stoffen die als kankerverwekkend,
    mutageen of vergiftig voor de voortplanting zĳn ingedeeld — c/m/r)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa NR 2003/36/WE Parlamentu Europejskiego i Rady z dnia 26 maja
    2003 r. zmieniająca po raz dwudziesty piąty dyrektywę Rady 76/769/EWG w sprawie
    zbliżenia przepisów ustawowych, wykonawczych i administracyjnych Państw Członkowskich
    odnoszących się do ograniczeń we wprowadzaniu do obrotu i stosowaniu niektórych
    substancji i preparatów niebezpiecznych (substancje sklasyfikowane jako rakotwórcze,
    mutagenne lub substancje toksyczne ze względu na zagrożenie rozrodczości –c/m/r)
  type: main
- language: pt
  script: Latn
  content: Directiva 2003/36/CE do Parlamento Europeu e do Conselho, de 26 de Maio
    de 2003, que altera, pela vigésima quinta vez, a Directiva 76/769/CEE do Conselho,
    relativa à aproximação das disposições legislativas, regulamentares e administrativas
    dos Estados-Membros respeitantes à limitação da colocação no mercado e da
    utilização de algumas substâncias e preparações perigosas [substâncias classificadas
    como cancerígenas, mutagénicas ou tóxicas para a reprodução (c/m/r)]
  type: main
- language: ro
  script: Latn
  content: Directiva 2003/36/CE a Parlamentului European și a Consiliului din 26
    mai 2003 de efectuare a celei de-a douăzeci și cincea modificări a Directivei
    76/769/CEE a Consiliului privind apropierea actelor cu putere de lege și a actelor
    administrative ale statelor membre referitoare la restricțiile privind introducerea
    pe piață și utilizarea anumitor substanțe și preparate periculoase (substanțe
    clasificate drept cancerigene, mutagene sau substanțe toxice pentru reproducere
    – c/m/r)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2003/36/ES z 26. mája 2003, ktorou
    sa mení a dopĺňa po dvadsiaty piatykrát smernica Rady 76/769/EHS o aproximácii
    zákonov, iných právnych predpisov a správnych opatrení členských štátov
    vzťahujúcich sa na obmedzenia uvádzania na trh a používania niektorých nebezpečných
    látok a prípravkov (látky zaradené ako karcinogény, mutagény alebo látky
    škodlivé pre reprodukciu – c/m/r)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2003/36/ES evropskega parlamenta in sveta z dne 26. maja 2003
    o petindvajseti spremembi Direktive Sveta 76/769/EGS o približevanju zakonov
    in drugih predpisov držav članic v zvezi z omejitvami pri trženju in uporabi
    nekaterih nevarnih snovi in pripravkov (snovi, razvrščene kot rakotvorne, mutagene
    ali strupene za razmnoževanje – r/m/r)
  type: main
- language: es
  script: Latn
  content: Directiva 2003/36/CE del Parlamento Europeo y del Consejo, de 26 de mayo
    de 2003, por la que se modifica por vigésima quinta vez la Directiva 76/769/CEE
    del Consejo relativa a la aproximación de las disposiciones legales, reglamentarias
    y administrativas de los Estados miembros que limitan la comercialización y el
    uso de determinadas sustancias y preparados peligrosos (sustancias clasificadas
    como carcinógenas, mutágenas o tóxicas para la reproducción — c/m/r)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2003/36/EG av den 26 maj 2003 om
    ändring för tjugofemte gången av rådets direktiv 76/769/EEG om tillnärmning
    av medlemsstaternas lagar och andra författningar om begränsning av användning
    och utsläppande på marknaden av vissa farliga ämnen och preparat (beredningar)
    (ämnen som klassificeras som cancerframkallande, mutagena eller reproduktionstoxiska)
