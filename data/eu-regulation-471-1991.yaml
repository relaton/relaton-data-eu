title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 471/91 of 27 February 1991 derogating from
    the provisions on the deadline for the submission of tenders laid down in (EEC)
    No 859/89 laying down detailed rules for the application of intervention measures
    in the beef and veal sector
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 471/91 DE LA COMMISSION du 27 février 1991 portant
    dérogation au délai de présentation des offres prévu par le règlement (CEE)
    no 859/89 relatif aux modalités d'' application des mesures d'' intervention
    dans le secteur de la viande bovine #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 471/91 DER KOMMISSION vom 27. Februar 1991 zur Abweichung
    von der Angebotsfrist gemäß der Verordnung (EWG) Nr. 859/89 mit Durchführungsbestimmungen
    für die Interventionsmaßnahmen für Rindfleisch #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 471/91 af 27. februar 1991 om fravigelse
    af den frist for indgivelse af bud, der er fastsat i forordning (EØF) nr. 859/89
    om gennemførelsesbestemmelser for interventionsforanstaltninger for oksekød
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 471/91 της Επιτροπής
    της 27ης Φεβρουαρίου 1991 για παρέκκλιση από την
    προθεσμία υποβολής των προσφορών που προβλέπεται
    από τον κανονισμό (ΕΟΚ) αριθ. 859/89 περί των λεπτομερειών
    εφαρμογής των μέτρων παρεμβάσεως στον τομέα
    του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 471/91 DELLA COMMISSIONE del 27 febbraio 1991 recante
    deroga al termine per la presentazione delle offerte di cui al regolamento (CEE)
    n. 859/89 recante modalità d'' applicazione delle misure d'' intervento nel settore
    delle carni bovine #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 471/91 VAN DE COMMISSIE van 27 februari 1991 houdende
    afwijking van de termijn voor het indienen van de offertes, als vastgesteld bij
    Verordening (EEG) nr. 859/89 betreffende de wijze van toepassing van de interventiemaatregelen
    in de sector rundvlees #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 471/91 DA COMISSÃO de 27 de Fevereiro de 1991 que
    estabelece uma derrogação do prazo de apresentação das propostas previsto
    pelo Regulamento (CEE) nº 859/89, relativo às regras de execução das medidas
    de intervenção no sector da carne de bovino #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 471/91 DE LA COMISIÓN de 27 de febrero de 1991 por
    el que se establece una excepción al plazo de presentación de ofertas establecido
    en el Reglamento (CEE) no 859/89 relativo a las normas de aplicación de las medidas
    de intervención en el sector de la carne de vacuno #'
