title:
- language: en
  script: Latn
  content: '97/315/EC: Commission Decision of 30 April 1997 amending, as regards certain
    Spanish regions, Decision 93/52/EEC recording the compliance by certain Member
    States or regions with the requirements relating to brucellosis (B. melitensis)
    and according them the status of a Member State or region officially free of the
    disease'
  type: main
- language: fr
  script: Latn
  content: '97/315/CE: Décision de la Commission du 30 avril 1997 modifiant la décision
    93/52/CEE constatant le respect par certains États membres ou régions des conditions
    relatives à la brucellose (Br. melitensis) et leur reconnaissant le statut d''États
    membres ou de régions officiellement indemnes de cette maladie pour certaines
    régions d''Espagne'
  type: main
- language: de
  script: Latn
  content: '97/315/EG: Entscheidung der Kommission vom 30. April 1997 zur Änderung
    der Entscheidung 93/52/EG zur Feststellung, daß bestimmte Mitgliedstaaten oder
    Gebiete die Bedingungen betreffend die Brucellose (Br. melitensis) eingehalten
    haben, und zur Anerkennung dieser Mitgliedstaaten oder Gebiete als amtlich brucellosefrei
    hinsichtlich bestimmter Gebiete Spaniens'
  type: main
- language: da
  script: Latn
  content: '97/315/EF: Kommissionens Beslutning af 30. april 1997 om ændring af beslutning
    93/52/EØF om konstatering af at bestemte medlemsstater eller regioner overholder
    betingelserne for brucellose (B. melitensis), og om anerkendelse af deres status
    som medlemsstat eller region, der er officielt fri for denne sygdom, for så vidt
    angår visse regioner i Spanien'
  type: main
- language: el
  script: Grek
  content: '97/315/ΕΚ: Απόφαση της Επιτροπής της 30ής Απριλίου
    1997 για τροποποίηση της απόφασης 93/52/ΕΟΚ η οποία
    διαπιστώνει την τήρηση εκ μέρους ορισμένων
    κρατών μελών ή περιοχών των όρων των σχετικών
    με τη βρουκέλωση (Br. melitensis) και που τους αναγνωρίζει
    το καθεστώς κρατών μελών ή περιοχών επίσημα
    απαλλαγμένων από την ασθένεια αυτή, για ορισμένες
    περιφέρειες της Ισπανίας'
  type: main
- language: fi
  script: Latn
  content: '97/315/EY: Komission päätös, tehty 30 päivänä huhtikuuta 1997, luomistautia
    (Br. melitensis) koskevien edellytysten täyttämisen toteamisesta tietyissä
    jäsenvaltioissa ja tietyillä alueilla ja näille jäsenvaltioille ja alueille
    tästä taudista virallisesti vapaan jäsenvaltion tai alueen aseman vahvistamisesta
    annetun päätöksen 93/52/ETY muuttamisesta tiettyjen Espanjan alueiden osalta'
  type: main
- language: it
  script: Latn
  content: '97/315/CE: Decisione della Commissione del 30 aprile 1997 che modifica
    la decisione 93/52/CEE che constata il rispetto da parte di taluni Stati membri
    o regioni delle condizioni relative alla brucellosi (Br. melitensis) e riconosce
    loro la qualifica di Stato membro o regione ufficialmente indenne da tale malattia
    per quanto riguarda talune regioni della Spagna'
  type: main
- language: nl
  script: Latn
  content: '97/315/EG: Beschikking van de Commissie van 30 april 1997 tot wijziging
    van Beschikking 93/52/EEG houdende constatering dat bepaalde lidstaten of gebieden
    aan de voorwaarden voldoen om te worden erkend als officieel brucellosevrij (Br.
    melintensis), ten aanzien van een aantal gebieden in Spanje'
  type: main
- language: pt
  script: Latn
  content: '97/315/CE: Decisão da Comissão de 30 de Abril de 1997 que altera a Decisão
    93/52/CEE, que reconhece que certos Estados-membros ou regiões respeitam as condições
    relativas à brucelose (B. melitensis) e que lhes reconhece o estatuto de Estado-membro
    ou região oficialmente indemne desta doença, em relação a certas regiões
    de Espanha'
  type: main
- language: es
  script: Latn
  content: '97/315/CE: Decisión de la Comisión de 30 de abril de 1997 que modifica,
    para determinadas regiones de España, la Decisión 93/52/CEE por la que se reconoce
    que determinados Estados miembros o regiones cumplen las condiciones referentes
    a la brucelosis (Brucella melitensis) y se les concede la calificación de Estados
    miembros o regiones oficialmente indemnes de esta enfermedad'
  type: main
- language: sv
  script: Latn
  content: '97/315/EG: Kommissionens beslut av den 30 april 1997 om ändring av beslut
    93/52/EEG om fastställande av att vissa medlemsstater eller regioner iakttar
    kraven i fråga om brucellos (b. melitensis) och erkännande av deras status som
    medlemsstat eller region som är officiellt fri från denna sjukdom, vad gäller
    vissa regioner i Spanien'
  type: main
