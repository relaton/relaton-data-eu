title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2649/81 of 11 September 1981 re-establishing
    the levying of customs duties on travel goods, falling within subheading 42.02
    B and originating in Brazil, to which the preferential arrangements set out in
    Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2649/81 de la Commission, du 11 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de voyage, de la sous-position 42.02 B du tarif douanier commun, originaires du
    Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2649/81 der Kommission vom 11. September 1981 zur
    Wiedereinführung der Erhebung der Zölle für Reiseartikel der Tarifstelle 42.02
    B, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3322/80 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2649/81 af 11. september 1981 om genindførelse
    af opkrævning af told for rejseartikler, henhørende under pos. 42.02 B og med
    oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2649/81 τής Επιτροπής
    τής 11ης Σεπτεμβρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τά είδη ταξιδίου
    τής διακρίσεως 42. 02 Β τού Κοινού Δασμολογίου
    καταγωγής Βραζιλίας, δικαιούχων τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2649/81 della Commissione, dell' 11 settembre 1981,
    che ripristina la riscossione dei dazi doganali applicabili agli oggetti da viaggio,
    della sottovoce 42.02 B della tariffa doganale comune, originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2649/81 van de Commissie van 11 september 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op reisartikelen
    van postonderverdeling 42.02 B, van oorsprong uit Brazilië waarvoor de in Verordening
    (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
