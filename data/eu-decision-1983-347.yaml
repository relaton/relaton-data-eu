title:
- language: en
  script: Latn
  content: '83/347/EEC: Commission Decision of 5 July 1983 establishing that the apparatus
    described as ''Aerovironment - Acoustic Radar System, consisting of: Transceiver
    Display Unit, model 300C; Antenna, model 302; Acoustic Enclosure, model 301''
    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/347/CEE: Décision de la Commission du 5 juillet 1983 constatant que
    l''importation de l''appareil dénommé "Aerovironment - Acoustic Radar System,
    consisting of: Transceiver Display Unit, model 300 C, Antenna, model 302, Acoustic
    Enclosure, model 301" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '83/347/EWG: Entscheidung der Kommission vom 5. Juli 1983, mit der festgestellt
    wird, daß das Gerät ,,Aerovironment - Acoustic Radar System, bestehend aus:
    Transceiver Display Unit, model 300 C, Antenna, model 302, Acoustic Enclosure,
    model 301" unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '83/347/EØF: Kommissionens beslutning af 5. juli 1983 om fastslåelse
    af, at indførsel af apparatet "Aerovironment-Acoustic Radar System, consisting
    of, Transceiver Display Unit, model 300 C, Antenna, model 302, Acoustic Enclosure,
    model 301" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/347/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Ιουλίου
    1983 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «Aerovironment — Acoustic Radar System, consisting
    of: Transceiver Display Unit, model 300C, Antenna, model 302, Acoustic Enclosure,
    model 301» δύναται να πραγματοποιηθεί ατελώς ως
    προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/347/CEE: Decisione della Commissione del 5 luglio 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "Aerovironment - Acoustic Radar
    System, consisting of: Transceiver Display Unit, model 300 C, Antenna, model 302,
    Acoustic Enclosure, model 301" può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/347/EEG: Beschikking van de Commissie van 5 juli 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Aerovironment - Acoustic Radar System,
    consisting of: Transceiver Display Unit, model 300 C, Antenna, model 302, Acoustic
    Enclosure, model 301" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
