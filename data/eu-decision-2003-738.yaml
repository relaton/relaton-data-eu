title:
- language: en
  script: Latn
  content: '2003/738/EC: Council Decision of 7 October 2003 on the adoption of amendments
    to be made to Articles 3 and 7 of the Monetary Convention between the Italian
    Republic, on behalf of the European Community, and the Vatican City State, represented
    by the Holy See, and authorising the Italian Republic to give effect to these
    amendments'
  type: main
- language: fr
  script: Latn
  content: '2003/738/CE: Décision du Conseil du 7 octobre 2003 concernant l''adoption
    de modifications à apporter aux articles 3 et 7 de la convention monétaire entre
    la République italienne, au nom de la Communauté européenne, et l''État de
    la Cité du Vatican, représenté par le Saint-Siège, et autorisant la République
    italienne à procéder à ces modifications'
  type: main
- language: de
  script: Latn
  content: '2003/738/EG: Beschluss des Rates vom 7. Oktober 2003 zur Annahme von Änderungen
    der Artikel 3 und 7 der Währungsvereinbarung zwischen der Italienischen Republik,
    im Namen der Europäischen Gemeinschaft, und dem Staat Vatikanstadt, vertreten
    durch den Heiligen Stuhl, und zur Ermächtigung der Italienischen Republik, diese
    Änderungen in Kraft zu setzen'
  type: main
- language: da
  script: Latn
  content: '2003/738/EF: Rådets afgørelse af 7. oktober 2003 om godkendelse af visse
    ændringer, der skal foretages i artikel 3 og 7 i den monetære konvention indgået
    mellem Den Italienske Republik, på Det Europæiske Fællesskabs vegne, og Vatikanstaten,
    og på dennes vegne Pavestolen, og om bemyndigelse af Den Italienske Republik
    til at sætte disse ændringer i kraft'
  type: main
- language: el
  script: Grek
  content: '2003/738/ΕΚ: Απόφαση του Συμβουλίου, της 7ης
    Οκτωβρίου 2003, για τη θέσπιση τροποποιήσεων
    οι οποίες πρέπει να επέλθουν στα άρθρα 3 και
    7 της νομισματικής σύμβασης μεταξύ της Ιταλικής
    Δημοκρατίας, εξ ονόματος της Ευρωπαϊκής Κοινότητας,
    και του κράτους της Πόλης του Βατικανού, εκπροσωπούμενου
    από την Αγία Έδρα, καθώς και για την παροχή
    εξουσιοδότησης στην Ιταλική Δημοκρατία να
    προβεί στις εν λόγω τροποποιήσεις'
  type: main
- language: fi
  script: Latn
  content: '2003/738/EY: Neuvoston päätös, tehty 7 päivänä lokakuuta 2003, Euroopan
    yhteisön puolesta toimivan Italian tasavallan ja Vatikaanivaltion, jota edustaa
    Pyhä istuin, välillä valuuttasuhteista tehdyn sopimuksen 3 ja 7 artiklaan tehtävien
    muutosten hyväksymisestä ja luvan antamisesta Italian tasavallalle toteuttaa
    muutokset'
  type: main
- language: it
  script: Latn
  content: '2003/738/CE: Decisione del Consiglio, del 7 ottobre 2003, che approva
    alcune modifiche agli articoli 3 e 7 della convenzione monetaria tra la Repubblica
    italiana, per conto della Comunità europea, e lo Stato della Città del Vaticano
    e per esso la Santa Sede e che autorizza la Repubblica italiana a dare esecuzione
    a tali modifiche'
  type: main
- language: nl
  script: Latn
  content: '2003/738/EG: Besluit van de Raad van 7 oktober 2003 tot goedkeuring van
    bepaalde wĳzigingen die moeten worden aangebracht in de artikelen 3 en 7 van
    de Monetaire Overeenkomst tussen de Italiaanse Republiek, namens de Europese Gemeenschap,
    en Vaticaanstad en namens deze de Heilige Stoel, en tot machtiging van de Italiaanse
    Republiek om uitvoering te geven aan deze wĳzigingen'
  type: main
- language: pt
  script: Latn
  content: '2003/738/CE: Decisão do Conselho, de 7 de Outubro de 2003, que aprova
    certas alterações aos artigos 3.° e 7.° da Convenção Monetária entre a
    República Italiana, em nome da Comunidade Europeia, e o Estado da Cidade do Vaticano,
    representado pela Santa Sé, e que autoriza a República Italiana a aplicar estas
    alterações'
  type: main
- language: es
  script: Latn
  content: '2003/738/CE: Decisión del Consejo, de 7 de octubre de 2003, relativa
    a la aprobación de determinadas modificaciones de los artículos 3 y 7 del Convenio
    monetario entre la República Italiana, en nombre de la Comunidad Europea, y el
    Estado de la Ciudad del Vaticano y, en su nombre, la Santa Sede, y por la que
    se autoriza a la República Italiana a aplicar estas modificaciones'
  type: main
- language: sv
  script: Latn
  content: '2003/738/EG: Rådets beslut av den 7 oktober 2003 om antagande av de ändringar
    som skall göras i artiklarna 3 och 7 i det monetära avtalet mellan Republiken
    Italien, på Europeiska gemenskapens vägnar, och Vatikanstaten, företrädd av
    Heliga stolen, samt bemyndigande för Republiken Italien att verkställa dessa
    ändringar'
  type: main
