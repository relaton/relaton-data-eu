title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 483/85 of 26 February 1985 amending Regulation
    (EEC) No 349/84 suspending tariff concessions and increasing duties under the
    Common Customs Tariff with regard to certain products originating in the United
    States of America and establishing quantitative restrictions with regard to other
    products originating in that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 483/85 du Conseil du 26 février 1985 modifiant le
    règlement (CEE) no 349/84 portant suspension de concessions tarifaires et relèvement
    des droits du tarif douanier commun applicables à certains produits originaires
    des États-Unis d' Amérique et instituant des restrictions quantitatives applicables
    à d' autres produits originaires de ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 483/85 des Rates vom 26. Februar 1985 zur Änderung
    der Verordnung (EWG) Nr. 349/84 betreffend die Aufhebung von Zollzugeständnissen
    und die Erhöhung der Zölle des Gemeinsamen Zolltarifs für die Einfuhr bestimmter
    Erzeugnisse mit Ursprung in den Vereinigten Staaten von Amerika und die Einführung
    mengenmäßiger Beschränkungen für andere Erzeugnisse mit Ursprung in diesem
    Land
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 483/85 af 26. februar 1985 om ændring af
    forordning (EØF) nr. 349/84 om suspension af toldindrømmelser og forhøjelse
    af satserne i den fælles toldtarif for visse varer med oprindelse i Amerikas
    Forenede Stater og om indførelse af kvantitative restriktioner for andre varer
    med oprindelse i dette land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 483/85 του Συμβουλίου
    της 26ης Φεβρουαρίου 1985 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 349/84 για την αναστολή
    των δασμολογικών παραχωρήσεων και την αύξηση
    των δασμών του Κοινού Δασμολογίου που εφαρμόζονται
    σε ορισμένα προϊόντα καταγωγής Ηνωμένων Πολιτειών
    Αμερικής και για την επιβολή ποσοτικών περιορισμών
    σε άλλα προϊόντα καταγωγής της χώρας αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 483/85 del Consiglio del 26 febbraio 1985 che modifica
    il regolamento (CEE) n. 349/84 recante sospensione delle concessioni tariffarie
    a taluni prodotti originari degli Stati Uniti d' America e recante istituzione
    delle restrizioni quantitative applicabili ad altri prodotti originari di detto
    paese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 483/85 van de Raad van 26 februari 1985 tot wijziging
    van Verordening (EEG) nr. 349/84 houdende schorsing van tariefconsessies en verhoging
    van de rechten van het gemeenschappelijk douanetarief voor bepaalde produkten
    van oorsprong uit de Verenigde Staten van Amerika en houdende instelling van kwantitatieve
    beperkingen voor andere produkten van oorsprong uit dat land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 483/85 do Conselho, de 26 de Fevereiro de 1985,
    que altera o Regulamento (CEE) n.° 349/84 que suspende concessões pautais e
    aumenta os direitos da pauta aduaneira comum aplicáveis a certos produtos originários
    dos Estados Unidos da América e institui restrições quantitativas aplicáveis
    a outros produtos originários deste país
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 483/85 del Consejo, de 26 de febrero de 1985, por
    el que se modifica el Reglamento (CEE) n° 349/84 por el que se suspenden las
    concesiones arancelarias y se aumentan los derechos del arancel aduanero común
    aplicables a algunos productos originarios de los Estados Unidos de América y
    que establece restricciones cuantitativas aplicables a otros productos originarios
    de este país
  type: main
