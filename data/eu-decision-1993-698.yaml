  script: Latn
  content: '93/698/EC: Commission Decision of 21 December 1993 establishing priority
    areas for the action plan for the exchange between Member State administrations
    of national officials who are engaged in the implementation of Community legislation
    required to achieve the internal market, adopted pursuant to Council Decision
    92/481/EEC (Karolus programme)'
  type: main
- language: fr
  script: Latn
  content: '93/698/CE: Décision de la Commission du 21 décembre 1993 fixant les
    domaines prioritaires pour le plan d''action pour l''échange, entre les administrations
    des États membres, de fonctionnaires nationaux chargés de la mise en oeuvre
    de la législation communautaire nécessaire à la réalisation du marché intérieur
    faisant l''objet de la décision 92/481/CEE du Conseil (programme Karolus)'
  type: main
