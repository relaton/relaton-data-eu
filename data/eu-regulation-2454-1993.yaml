id: EURegulation24541993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2454/93 of 2 July 1993 laying down provisions
    for the implementation of Council Regulation (EEC) No 2913/92 establishing the
    Community Customs Code
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2454/93 de la Commission, du 2 juillet 1993, fixant
    certaines dispositions d'application du règlement (CEE) n° 2913/92 du Conseil
    établissant le code des douanes communautaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2454/93 der Kommission vom 2. Juli 1993 mit Durchführungsvorschriften
    zu der Verordnung (EWG) Nr. 2913/92 des Rates zur Festlegung des Zollkodex der
    Gemeinschaften
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2454/93 на Комисията от 2 юли
    1993 година за определяне на разпоредби за прилагане
    на Регламент (ЕИО) № 2913/92 на Съвета за създаване
    на Митнически кодекс на Общността
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 2454/93 ze dne 2. července 1993, kterým
    se provádí nařízení Rady (EHS) č. 2913/92, kterým se vydává celní kodex
    Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2454/93 af 2. juli 1993 om visse gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 2913/92 om indførelse af en EF- toldkodeks
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2454/93 της Επιτροπής
    της 2ας Ιουλίου 1993 για τον καθορισμό ορισμένων
    διατάξεων εφαρμογής του κανονισμού (ΕΟΚ) αριθ.
    2913/92 του Συμβουλίου για τη θέσπιση του κοινοτικού
    τελωνειακού κώδικα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 2454/93, 2. juuli 1993, millega kehtestatakse
    rakendussätted nõukogu määrusele (EMÜ) nr 2913/92, millega kehtestatakse
    ühenduse tolliseadustik
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2454/93, annettu 2 päivänä heinäkuuta 1993,
    tietyistä yhteisön tullikoodeksista annetun neuvoston asetuksen (ETY) N:o 2913/92
    soveltamista koskevista säännöksistä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 2454/93 od 2. srpnja 1993. o utvrđivanju odredaba
    za provedbu Uredbe Vijeća (EEZ) br. 2913/92 o Carinskom zakoniku Zajednice
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2454/93/EGK rendelete (1993. július 2.) a Közösségi Vámkódex
    létrehozásáról szóló 2913/92/EGK tanácsi rendelet végrehajtására vonatkozó
    rendelkezések megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2454/93 della Commissione, del 2 luglio 1993, che
    fissa talune disposizioni d'applicazione del regolamento (CEE) n. 2913/92 del
    Consiglio che istituisce il codice doganale comunitario
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 2454/93 (1993. gada 2. jūlijs), ar ko nosaka
    īstenošanas noteikumus Padomes Regulai (EEK) Nr. 2913/92 par Kopienas Muitas
    kodeksa izveidi
  type: main
- language: lt
  script: Latn
  content: 1993 m. liepos 2 d. Komisijos reglamentas (EEB) Nr. 2454/93, išdėstantis
    Tarybos reglamento (EEB) Nr. 2913/92, nustatančio Bendrijos muitinės kodeksą,
    įgyvendinimo nuostatas
  type: main
- language: mt
  script: Latn
  content: Ir-regolament tal-Kummissjoni (KEE) Nru 2454/93 tat-2 ta' Lulju 1993 li
    jiffissa d-dispożizzjonijiet għall-implementazzjoni tar-Regolament tal-Kunsill
    (KEE) Nru 2913/92 li jistabbilixxi il-Kodiċi Doganali Komunitarju
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2454/93 van de Commissie van 2 juli 1993 houdende
    vaststelling van enkele bepalingen ter uitvoering van Verordening (EEG) nr. 2913/92
    van de Raad tot vaststelling van het communautair douanewetboek
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 2454/93 z dnia 2 lipca 1993 r. ustanawiające
    przepisy w celu wykonania rozporządzenia Rady (EWG) nr 2913/92 ustanawiającego
    Wspólnotowy Kodeks Celny
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2454/93 da Comissão, de 2 de Julho de 1993, que
    fixa determinadas disposições de aplicação do Regulamento (CEE) nº 2913/92
    do Conselho que estabelece o Código Aduaneiro Comunitário
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 2454/93 al Comisiei din 2 iulie 1993 de stabilire
    a unor dispoziții de aplicare a Regulamentului (CEE) nr. 2913/92 al Consiliului
    de instituire a Codului Vamal Comunitar
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 2454/93 z 2. júla 1993, ktorým sa vykonáva
    nariadenie Rady (EHS) č. 2913/92, ktorým sa ustanovuje Colný kódex spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 2454/93 z dne 2. julija 1993 o določbah za
    izvajanje Uredbe Sveta (EGS) št. 2913/92 o carinskem zakoniku Skupnosti
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2454/93 de la Comisión, de 2 de julio de 1993, por
    el que se fijan determinadas disposiciones de aplicación del Reglamento (CEE)
    nº 2913/92 del Consejo por el que se establece el Código Aduanero Comunitario
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 2454/93 av den 2 juli 1993 om tillämpningsföreskrifter
    för rådets förordning (EEG) nr 2913/92 om inrättandet av en tullkodex för
    gemenskapen
  type: main
