title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2017/82 of 23 July 1982 authorizing the
    German intervention agency to sell forequarters of bovine animals for processing
    into preserves with a view to constituting security stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2017/82 de la Commission, du 23 juillet 1982, autorisant
    l' organisme d' intervention allemand à vendre des quartiers avant de bovins
    en vue de leur transformation en conserves destinées à constituer des stocks
    de sécurité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2017/82 der Kommission vom 23. Juli 1982 zur Ermächtigung
    der deutschen Interventionsstelle, Vorderviertel von Rindern im Hinblick auf ihre
    Verarbeitung zu Konserven zu verkaufen, die zur Schaffung von Notvorräten bestimmt
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2017/82 af 23. juli 1982 om bemyndigelse
    af det tyske interventionsorgan til at sælge okseforfjerdinger med henblik på
    forarbejdning til konserves, som skal udgøre sikkerhedslagre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2017/82 τής Επιτροπής
    τής 23ης Ιουλίου 1982 περί εξουσιοδοτήσεως τού
    γερμανικού οργανισμού παρεμβάσεως νά προβεί
    στήν πώληση εμπροσθίων τετάρτων βοοειδών μέ
    σκοπό τό μετασχηματισμό τους σέ κονσέρβες
    πού προορίζονται νά αποτελέσουν αποθέματα
    ασφαλείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2017/82 della Commissione, del 23 luglio 1982, che
    autorizza l' organismo d' intervento tedesco a vendere quarti anteriori di bovini
    ai fini della loro trasformazione in conserve destinate a costituire scorte di
    sicurezza
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2017/82 van de Commissie van 23 juli 1982 tot machtiging
    van het Duitse interventiebureau om voorvoeten van runderen te verkopen voor verwerking
    tot conserven, bestemd voor de vorming van strategische voorraden
  type: main
