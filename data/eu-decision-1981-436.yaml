title:
- language: en
  script: Latn
  content: '81/436/EEC: Commission Decision of 8 May 1981 authorizing the United Kingdom
    to extend the time limit for acceptances of certain varieties of species of agricultural
    plants and vegetables (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/436/CEE: Décision de la Commission, du 8 mai 1981, autorisant le Royaume-Uni
    à proroger le délai d''admission de certaines variétés d''espèces de plantes
    agricoles et de légumes (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/436/EWG: Entscheidung der Kommission vom 8. Mai 1981 zur Ermächtigung
    des Vereinigten Königreichs, die Frist für die Zulassung bestimmter Sorten landwirtschaftlicher
    Pflanzenarten und Gemüsearten zu verlängern (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/436/EØF: Kommissionens beslutning af 8. maj 1981 om bemyndigelse til
    Det Forenede Kongerige til at forlænge fristen for godkendelse af visse sorter
    af grønsags- og landbrugsplantearter (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/436/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Μαΐου
