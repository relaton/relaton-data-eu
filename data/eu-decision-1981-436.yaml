    να παρατείνει την ημερομηνία αναγνώρισης ορισμένων
    ποικιλιών καλλιεργούμενων φυτικών ειδών και
    σπόρων προς σπορά κηπευτικών (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/436/CEE: Decisione della Commissione, dell''8 maggio 1981, che autorizza
    il Regno Unito a prorogare la data di ammissione per alcune varietà di specie
    di piante agricole e di ortaggi (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/436/EEG: Beschikking van de Commissie van 8 mei 1981 houdende machtiging
