id: EUDirective1990667
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 90/667/EEC of 27 November 1990 laying down the veterinary
    rules for the disposal and processing of animal waste, for its placing on the
    market and for the prevention of pathogens in feedstuffs of animal or fish origin
    and amending Directive 90/425/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 90/667/CEE du Conseil, du 27 novembre 1990, arrêtant les règles
    sanitaires relatives à l'élimination et à la transformation de déchets animaux
    à leur mise sur le marché et à la protection contre les agents pathogènes
    des aliments pour animaux d'origine animale ou à base de poisson, et modifiant
    la directive 90/425/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/667/EWG des Rates vom 27. November 1990 zum Erlaß veterinärrechtlicher
    Vorschriften für die Beseitigung, Verarbeitung und Vermarktung tierischer Abfälle
    und zum Schutz von Futtermitteln tierischen Ursprungs, auch aus Fisch, gegen Krankheitserreger
    sowie zur Änderung der Richtlinie 90/425/EWG
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/667/EØF af 27. november 1990 om sundhedsmæssige bestemmelser
    for bortskaffelse, forarbejdning og afsætning af animalsk affald og for beskyttelse
    mod forekomst af patogener i foder fremstillet af dyr, herunder fisk, og om ændring
    af direktiv 90/425/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/667/ΕΟΚ του Συμβουλίου της 27ης Νοεμβρίου
    1990 για τη θέσπιση υγειονομικών κανόνων για
    τη διάθεση και τη μεταποίηση ζωικών αποβλήτων,
    τη διάθεσή τους στην αγορά και την προστασία
    από τους παθογόνους οργανισμούς των ζωοτροφών
    ζωικής προέλευσης ή με βάση τα ψάρια και για
    την τροποποίηση της οδηγίας 90/425/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/667/ETY, annettu 27 päivänä marraskuuta 1990,
    eläinlääkintäsäännöistä eläinjätteen hävittämisessä, käsittelyssä
    ja markkinoille saattamisessa sekä taudinaiheuttajien ehkäisemisestä eläin-
    ja kalaperäisissä rehuissa sekä direktiivin 90/425/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 90/667/CEE del Consiglio, del 27 novembre 1990, che stabilisce
    le norme sanitarie per l'eliminazione, la trasformazione e l'immissione sul mercato
    dei rifiuti di origine animale e la protezione dagli agenti patogeni degli alimenti
    per animali di origine animale o a base di pesce e che modifica la direttiva 90/425/CEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/667/EEG van de Raad van 27 november 1990 tot vaststelling
    van gezondheidsvoorschriften voor de verwijdering en verwerking van dierlijke
    afvallen, voor het in de handel brengen van dierlijke afvallen en ter voorkoming
    van de aanwezigheid van ziekteverwekkers in diervoeders van dierlijke oorsprong
    (vissen daaronder begrepen) en tot wijziging van Richtlijn 90/425/EEG
  type: main
- language: pt
  script: Latn
  content: Directiva 90/667/CEE do Conselho, de 27 de Novembro de 1990, que estabelece
    as normas sanitárias para a eliminação e a transformação de resíduos animais,
    para a sua colocação no mercado e para a prevenção da presença de agentes
    patogénicos nos alimentos para animais de origem animal ou à base de peixe e
    que altera a Directiva 90/425/CEE
  type: main
- language: es
  script: Latn
  content: Directiva 90/667/CEE del Consejo, de 27 de noviembre de 1990, por la que
    se establecen las normas veterinarias relativas a la eliminación y transformación
    de desperdicios animales, a su puesta en el mercado y a la protección de los
    agentes patógenos en los piensos de origen animal o a base de pescado, y por
    la que se modifica la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/667/EEG av den 27 november 1990 om fastställande av
    veterinära bestämmelser om bortskaffande och bearbetning av animaliskt avfall
    och dess utsläppande på marknaden samt om förhindrande av sjukdomsalstrande
    organismer i foder av animaliskt ursprung samt om ändring av direktiv 90/425/EEG
  type: main
