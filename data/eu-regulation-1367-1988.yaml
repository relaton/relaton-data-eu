  script: Latn
  content: Regolamento (CEE) n. 1367/88 della Commissione del 19 maggio 1988 che ripristina
    la riscossione dei dazi doganali applicabili alle maglie, pullover, giacche a
    vento e simili, a maglia, della categoria di prodotti n. 5 (numero d' ordine 40.0050),
