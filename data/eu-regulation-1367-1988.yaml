    jumpers, pullovers, anoraks en dergelijke, van brei- of haakwerk, van de categorie
    van produkten nr. 5 (volgnummer 40.0050), van oorsprong uit India, shorts en andere
    korte broeken, lange broeken, geweven, van de categorie van produkten nr. 6 (volgnummer
    40.0060), van oorsprong uit Pakistan, en garens van synthetische of van kunstmatige
    filamenten, garens van katoen, gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 43 (volgnummer 40.0430), van oorsprong uit Brazilië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3783/87
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1367/88 da Comissão de 19 de Maio de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis às camisolas, pulôveres, anoraks
    e artigos semelhantes em malha, da categoria de produtos n.° 5 (n.° de ordem
    40.0050), originários da Índia, aos calções, shorts e calças, tecidos, da
    categoria de produtos n.° 6 (n.° de ordem 40.0060), originários do Paquistão,
    aos fios de filamentos sintéticos ou artificiais, fios de algodão, acondicionados
    para venda a retalho, da categoria de produtos n.° 43 (n.° de ordem 40.0430),
    originários do Brasil, beneficiários das preferências pautais previstas no
    Regulamento (CEE) n.° 3783/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1367/88 de la Comisión de 19 de mayo de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los "chandals, jerseys", "anoraks" y similares, de punto, de la categoría n°
    5 (número de orden 40.0050), originarios de la India; a los pantalones cortos
    "shorts" y pantalones largos de tejido, de la categoría n° 6 (número de orden
    40.0060), originarios de Paquistán, y a los hilos de filamentos sintéticos o
    artificiales, hilos de algodón acondicionados para la venta al por menor, de
    la categoría n° 43 (número de orden 40.0430), originarios de Brasil, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) n° 3783/87
    del Consejo
