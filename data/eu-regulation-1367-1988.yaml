title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1367/88 of 19 May 1988 re-establishing the
    levying of customs duties on jerseys, pullovers, slipovers, anoraks and the like,
    knitted or crocheted, products of category 5 (order No 40.0050) originating in
    India, woven breeches, shorts and trousers, products of category 6 (order No 40.0060)
    originating in Pakistan, yarn of man-made filament, yarn of staple artificial
    fibres, cotton yarn put up for retail sale, products of category 43 (order No
    40.0430) originating in Brazil to which the preferential tariff arrangements of
    Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1367/88 de la Commission du 19 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux chandails, pull-overs, anoraks
    et articles similaires en bonneterie, de la catégorie de produits n° 5 (numéro
    d' ordre 40.0050), originaires de l' Inde, aux culottes, shorts et pantalons tissés
    de la catégorie de produits n° 6 (numéro d' ordre 40.0060), originaires du
    Pakistan, et aux fils de filaments synthétiques ou artificiels, fils de coton
    conditionnés pour la vente au détail de la catégorie de produits n° 43 (numéro
    40.0430), originaires du Brésil, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1367/88 der Kommission vom 19. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Pullover, Slipover, Anoraks und ähnliche Waren, aus Gewirken,
    der Warenkategorie Nr. 5 (lfd. Nr. 40.0050) mit Ursprung in Indien, Shorts und
    andere kurze Hosen, aus Geweben, der Warenkategorie Nr. 6 (lfd. Nr. 40.0060) mit
    Ursprung in Pakistan, Garne aus synthetischen oder künstlichen Filamenten, Garne
    aus Baumwolle, nicht in Aufmachungen für den Einzelverkauf, der Warenkategorie
    Nr. 43 (lfd. Nr. 40.0430) mit Ursprung in Brasilien, denen die in der Verordnung
    (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1367/88 af 19. maj 1988 om genindførelse
    af opkrævning af toldafgifter for sweatere, pullovere, slipovere, anorakker o.
    lign., af trikotage under varekategori nr. 5 (løbenummer 40.0050), som har oprindelse
    i Indien; shorts og andre korte benklæder til mænd og drenge, under varekategori
    nr. 6 (løbenummer 40.0060), som har oprindelse i Pakistan; garn, kemofilamenter,
    garn af korte regenererede fibre, garn af bomuld, i detailsalgsoplægninger, under
    varekategori nr. 43 (løbenummer 40.0430), som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
