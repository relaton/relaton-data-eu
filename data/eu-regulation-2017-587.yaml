title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2017/587 of 14 July 2016 supplementing
    Regulation (EU) No 600/2014 of the European Parliament and of the Council on markets
    in financial instruments with regard to regulatory technical standards on transparency
    requirements for trading venues and investment firms in respect of shares, depositary
    receipts, exchange-traded funds, certificates and other similar financial instruments
    and on transaction execution obligations in respect of certain shares on a trading
    venue or by a systematic internaliser
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/587 de la Commission du 14 juillet 2016
    complétant le règlement (UE) n° 600/2014 du Parlement européen et du Conseil
    concernant les marchés d'instruments financiers par des normes techniques de
    réglementation relatives aux obligations de transparence applicables aux plates-formes
    de négociation et aux entreprises d'investissement pour les actions, certificats
    représentatifs, fonds cotés, certificats préférentiels et instruments financiers
    analogues, et aux obligations d'exécution des transactions sur certaines actions
    via une plate-forme de négociation ou par un internalisateur systématique
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2017/587 der Kommission vom 14. Juli 2016 zur
    Ergänzung der Verordnung (EU) Nr. 600/2014 des Europäischen Parlaments und des
    Rates über Märkte für Finanzinstrumente durch technische Regulierungsstandards
    mit Transparenzanforderungen für Handelsplätze und Wertpapierfirmen in Bezug
    auf Aktien, Aktienzertifikate, börsengehandelte Fonds, Zertifikate und andere
    vergleichbare Finanzinstrumente und mit Ausführungspflichten in Bezug auf bestimmte
    Aktiengeschäfte an einem Handelsplatz oder über einen systematischen Internalisierer
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2017/587 на Комисията
    от 14 юли 2016 година за допълване на Регламент
    (ЕС) № 600/2014 на Европейския парламент и на Съвета
    относно пазарите на финансови инструменти
    по отношение на регулаторните технически стандарти
    за изискванията за прозрачност към местата
    на търговия и инвестиционните посредници по
    отношение на акциите, депозитарните разписки,
    борсово търгуваните фондове, сертификатите
    и другите подобни финансови инструменти, както
    и за задълженията за изпълнение на сделките
    при някои търгувани на място на търговия акции
    или от страна на систематичен участник
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2017/587 ze dne 14. července
    2016, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    600/2014 o trzích finančních nástrojů, pokud jde o regulační technické
    normy týkající se požadavků na transparentnost pro obchodní systémy a investiční
    podniky v souvislosti s akciemi, cennými papíry nahrazujícími jiné cenné
    papíry, fondy obchodovanými v obchodním systému, certifikáty a jinými podobnými
    finančními nástroji a regulační technické normy týkající se povinnosti
    provádět obchody s určitými akciemi v obchodním systému nebo prostřednictvím
    systematického internalizátora
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2017/587 af 14. juli 2016 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) nr. 600/2014 om markeder
    for finansielle instrumenter for så vidt angår reguleringsmæssige tekniske
    standarder for gennemsigtighedskrav for markedspladser og investeringsselskaber
    med hensyn til aktier, depotbeviser, exchange-traded funds, certifikater og andre
    lignende finansielle instrumenter og kravet om, at transaktioner i visse aktier
    skal gennemføres via en markedsplads eller en systematisk internalisator
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) 2017/587
    της Επιτροπής, της 14ης Ιουλίου 2016, για τη συμπλήρωση
    του κανονισμού (ΕΕ) αριθ. 600/2014 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου για τις αγορές
    χρηματοπιστωτικών μέσων όσον αφορά ρυθμιστικά
    τεχνικά πρότυπα για τις απαιτήσεις διαφάνειας
    για τους τόπους διαπραγμάτευσης και τις επιχειρήσεις
    επενδύσεων ως προς τις μετοχές, τα πιστοποιητικά
    αποθετηρίου, τα διαπραγματεύσιμα αμοιβαία
