    εσωτερικοποιητή
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2017/587, 14. juuli 2016, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 600/2014 finantsinstrumentide
    turgude kohta seoses regulatiivsete tehniliste standarditega, mis käsitlevad
    kauplemiskohtade ja investeerimisühingute läbipaistvusnõudeid seoses aktsiatega,
    hoidmistunnistustega, börsil kaubeldavate fondidega, sertifikaatidega ja muude
    sarnaste finantsinstrumentidega, samuti tehingute tegemisega seotud kohustusi
    kauplemiskohas või kliendi korralduste süsteemsete täitjate kaubeldavate teatavate
    aktsiate puhul
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2017/587, annettu 14 päivänä heinäkuuta
    2016, rahoitusvälineiden markkinoista annetun Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 600/2014 täydentämisestä teknisillä sääntelystandardeilla,
    jotka koskevat kauppapaikoille ja sijoituspalveluyrityksille osakkeiden, talletustodistusten,
    pörssilistattujen rahastojen, todistusten ja muiden samankaltaisten rahoitusvälineiden
    osalta asetettavia avoimuusvaatimuksia sekä velvoitteita toteuttaa liiketoimia
    tietyillä osakkeilla kauppapaikassa tai kauppojen sisäisen toteuttajan välityksellä
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/587 оd 14. srpnja 2016. o dopuni
    Uredbe (EU) br. 600/2014 Europskog parlamenta i Vijeća o tržištima financijskih
    instrumenata u pogledu regulatornih tehničkih standarda za zahtjeve o transparentnosti
    za mjesta trgovanja i investicijska društva u vezi s dionicama, potvrdama o deponiranim
    vrijednosnim papirima, fondovima čijim se udjelima trguje na burzi, certifikatima
    i drugim sličnim financijskim instrumentima te za obveze izvršavanja transakcija
    u pogledu određenih dionica na mjestu trgovanja ili putem sistematskog internalizatora
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/587 felhatalmazáson alapuló rendelete (2016. július
    14.) a pénzügyi eszközök piacairól szóló 600/2014/EU európai parlamenti
    és tanácsi rendeletnek a részvényekkel, letéti jegyekkel, tőzsdén kereskedett
    alapokkal, certifikátokkal és más hasonló pénzügyi eszközökkel kapcsolatos,
    kereskedési helyszínekre és befektetési vállalkozásokra vonatkozó átláthatósági
    követelményeket és bizonyos részvények ügyleteinek kereskedési helyszínen
    vagy rendszeres internalizálónál való végrehajtására irányuló kötelezettséget
    meghatározó szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2017/587 della Commissione, del 14 luglio 2016,
    che integra il regolamento (UE) n. 600/2014 del Parlamento europeo e del Consiglio
    sui mercati degli strumenti finanziari per quanto riguarda le norme tecniche di
    regolamentazione sugli obblighi di trasparenza a carico delle sedi di negoziazione
    e delle imprese di investimento relativamente ad azioni, certificati di deposito,
    fondi indicizzati quotati (ETF), certificati e altri strumenti finanziari analoghi
    e sull'obbligo di eseguire le operazioni su talune azioni nelle sedi di negoziazione
    o tramite gli internalizzatori sistematici
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2017/587 (2016. gada 14. jūlijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 600/2014 par finanšu instrumentu
    tirgiem papildina attiecībā uz regulatīvajiem tehniskajiem standartiem par
    pārredzamības prasībām tirdzniecības vietām un ieguldījumu brokeru sabiedrībām
    attiecībā uz akcijām, depozitārajiem sertifikātiem, biržā tirgotiem fondiem,
    sertifikātiem un citiem līdzīgiem finanšu instrumentiem un par darījumu izpildes
    prasībām attiecībā uz konkrētām akcijām tirdzniecības vietā vai attiecībā
    uz sistemātisku internalizētāju
  type: main
- language: lt
  script: Latn
  content: 2016 m. liepos 14 d. Komisijos deleguotasis reglamentas (ES) 2017/587,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 600/2014 dėl finansinių
    priemonių rinkų papildomas techniniais reguliavimo standartais, susijusiais
    su prekybos vietoms ir investicinėms įmonėms taikomais skaidrumo reikalavimais
    dėl akcijų, depozitoriumo pakvitavimų, biržinių fondų, sertifikatų ir kitų
    panašių finansinių priemonių ir su pareiga tam tikrų akcijų sandorius vykdyti
    prekybos vietoje arba per sistemingai sandorius savo viduje sudarantį tarpininką
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2017/587 tal-14 ta' Lulju 2016
    li jissupplimenta r-Regolament (UE) Nru 600/2014 tal-Parlament Ewropew u tal-Kunsill
    dwar is-swieq tal-istrumenti finanzjarji fir-rigward ta' standards tekniċi regolatorji
    dwar rekwiżiti ta' trasparenza għall-ċentri tan-negozjar u ditti ta' investiment
    fir-rigward ta' ishma, irċevuti depożitarji, fondi nnegozjati fil-boroż, ċertifikati
    u strumenti finanzjarji simili oħrajn u dwar obbligi ta' eżekuzzjoni tat-tranżazzjoni
    fir-rigward ta' ċertu ishma f'ċentru tan-negozjar jew minn internalizzaturi
    sistematiċi
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2017/587 van de Commissie van 14 juli 2016
    tot aanvulling van Verordening (EU) nr. 600/2014 van het Europees Parlement en
    de Raad betreffende markten in financiële instrumenten met technische reguleringsnormen
    inzake transparantievereisten voor handelsplatformen en beleggingsondernemingen
    met betrekking tot aandelen, representatieve certificaten, beursverhandelde fondsen,
    certificaten en andere soortgelijke financiële instrumenten en inzake de verplichting
    tot uitvoering van transacties in bepaalde aandelen op een handelsplatform of
    door een beleggingsonderneming met systematische interne afhandeling
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2017/587 z dnia 14 lipca 2016 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 600/2014
    w sprawie rynków instrumentów finansowych w odniesieniu do regulacyjnych standardów
    technicznych dotyczących wymogów w zakresie przejrzystości dla systemów obrotu
    i firm inwestycyjnych w odniesieniu do akcji, kwitów depozytowych, funduszy inwestycyjnych
    typu ETF, certyfikatów i innych podobnych instrumentów finansowych oraz dotyczących
    obowiązku realizowania transakcji na określonych akcjach w systemie obrotu lub
    za pośrednictwem podmiotu systematycznie internalizującego transakcje
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2017/587 da Comissão, de 14 de julho de 2016,
    que complementa o Regulamento (UE) n.° 600/2014 do Parlamento Europeu e do Conselho
    relativo aos mercados de instrumentos financeiros no que diz respeito às normas
    técnicas de regulamentação relativas aos requisitos de transparência aplicáveis
    às plataformas de negociação e às empresas de investimento relativamente a
    ações, certificados de depósito, fundos de índices cotados, certificados e
    outros instrumentos financeiros similares e às obrigações de execução das
    transações de certas ações numa plataforma de negociação ou por um internalizador
    sistemático
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2017/587 al Comisiei din 14 iulie 2016 de completare
    a Regulamentului (UE) nr. 600/2014 al Parlamentului European și al Consiliului
    privind piețele instrumentelor financiare în ceea ce privește standardele tehnice
    de reglementare referitoare la cerințele în materie de transparență pentru
    locurile de tranzacționare și firmele de investiții în legătură cu acțiunile,
    certificatele de depozit, fondurile tranzacționate la bursă, certificatele și
    alte instrumente financiare similare și la obligația de tranzacționare a anumitor
    acțiuni într-un loc de tranzacționare sau printr-un operator independent
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2017/587 zo 14. júla 2016, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 600/2014 o trhoch
    s finančnými nástrojmi, pokiaľ ide o regulačné technické predpisy týkajúce
    sa požiadaviek na transparentnosť pre obchodné miesta a investičné spoločnosti
    v súvislosti s akciami, vkladovými potvrdenkami, fondmi obchodovanými na burze,
    certifikátmi a inými podobnými finančnými nástrojmi, ako aj povinností
    vykonania transakcií s určitými akciami na obchodnom mieste alebo prostredníctvom
    systematického internalizátora
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2017/587 z dne 14. julija 2016 o dopolnitvi
    Uredbe (EU) št. 600/2014 Evropskega parlamenta in Sveta o trgih finančnih instrumentov
    v zvezi z regulativnimi tehničnimi standardi o zahtevah po preglednosti za mesta
    trgovanja in investicijska podjetja v zvezi z delnicami, potrdili o lastništvu,
    investicijskimi skladi, s katerimi se trguje na borzi, certifikati in drugimi
    podobnimi instrumenti ter o obveznostih glede izvrševanja poslov z določenimi
    delnicami na mestu trgovanja ali s strani sistematičnega internalizatorja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2017/587 de la Comisión, de 14 de julio de 2016,
    por el que se completa el Reglamento (UE) n.° 600/2014 del Parlamento Europeo
    y del Consejo, relativo a los mercados de instrumentos financieros, en lo que
    respecta a las normas técnicas de regulación relativas a los requisitos de transparencia
    aplicables a los centros de negociación y las empresas de servicios de inversión
    respecto de las acciones, los recibos de depositario, los fondos cotizados, los
    certificados y otros instrumentos financieros similares y a las obligaciones de
    realización de las operaciones respecto de ciertas acciones en un centro de negociación
    o por un internalizador sistemático
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2017/587 av den 14 juli 2016
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 600/2014
    om marknader för finansiella instrument avseende tekniska standarder för tillsyn
    när det gäller krav på transparens för handelsplatser och värdepappersföretag
    för aktier, depåbevis, börshandlade fonder, certifikat och andra liknande finansiella
    instrument och krav på att utföra transaktioner för vissa aktier på en handelsplats
    eller genom en systematisk internhandlare
