    οργανισμός παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 266/92 della Commissione, del 4 febbraio 1992, che
    modifica il regolamento (CEE) n. 3081/91 e che porta a 100 000 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    orzo detenuto dall'organismo d'intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 266/92 van de Commissie van 4 februari 1992 tot wijziging
