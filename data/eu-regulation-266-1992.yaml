    pour la revente sur le marché intérieur d'orge détenu par l'organisme d'intervention
    italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 266/92 der Kommission vom 4. Februar 1992 zur Änderung
    der Verordnung (EWG) Nr. 3081/91 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 100 000 Tonnen Gerste aus Beständen der
    italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 266/92 af 4. februar 1992 om ændring
