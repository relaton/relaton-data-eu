id: EURegulation18771979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1877/79 of 24 August 1979 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of other kinds of pottery, earthenware or
    fine pottery, falling within subheading 69.12 C and originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1877/79 de la Commission, du 24 août 1979, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette, en autres matières céramiques, en
    faïence ou en poterie fine, de la sous-position 69.12 C du tarif douanier commun,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1877/79 der Kommission vom 24. August 1979 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus anderen
    keramischen Stoffen, aus Steingut oder feinen Erden, der Tarifstelle 69.12 C,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1877/79 af 24. august 1979 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af andet keramisk materiale, varer af fajance eller fint ler, under underposition
    69.12 C, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1877/79 della Commissione, del 24 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e agli oggetti
    di uso domestico o da toletta, di altre materie ceramiche, di terracotta fine
    o di terraglia, della sottovoce 69.12 C della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1877/79 van de Commissie van 24 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van andere keramische stoffen, van faience of van
    fijn aardewerk, van post 69.12 C, van oorsprong uit de ontwikkelingslanden ten
    behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties
    werden geopend
  type: main
