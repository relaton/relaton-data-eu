title:
- language: en
  script: Latn
  content: '2000/181/EC: Commission Decision of 23 February 2000 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of thiacloprid, forchlorfenuron, thiamethoxam in Annex
    I to Council Directive 91/414/EEC concerning the placing of plant-protection products
    on the market (notified under document number C(2000) 474)'
  type: main
- language: fr
  script: Latn
  content: '2000/181/CE: Décision de la Commission, du 23 février 2000, reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle des substances actives thiacloprid, forchlorfenuron
    et thiamethoxam à l''annexe I de la directive 91/414/CEE concernant la mise sur
    le marché des produits phytopharmaceutiques [notifiée sous le numéro C(2000)
    474]'
  type: main
- language: de
  script: Latn
  content: '2000/181/EG: Entscheidung der Kommission vom 23. Februar 2000 über die
    grundsätzliche Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden
    Prüfung im Hinblick auf eine etwaige Aufnahme von Thiacloprid, Forchlorfenuron
    und Thiamethoxam in Anhang I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen
    von Pflanzenschutzmitteln eingereicht wurden (Bekanntgegeben unter Aktenzeichen
    K(2000) 474)'
  type: main
- language: bg
  script: Cyrl
