    с оглед на възможното включване на thiacloprid, forchlorfenuron,
    thiamethoxam в приложение I към Директива 91/414/ЕИО
    на Съвета относно пускането на пазара на продукти
    за растителна защита (нотифицирано под номер
    С(2000) 474)
  type: main
- language: cs
  script: Latn
