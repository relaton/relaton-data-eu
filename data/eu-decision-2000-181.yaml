    zařazení thiaklopridu, forchlorfenuronu a thiamethoxamu do přílohy I směrnice
    Rady 91/414/EHS o uvádění přípravků na ochranu rostlin na trh (oznámeno
    pod číslem K(2000) 474)
  type: main
