    (EØF) nr. 2917/74, (EØF) nr. 2918/74, (EØF) nr. 2919/74 og (EØF) nr. 2920/74
    for visse tekstilvarer med oprindelse i Malta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1045/75 del Consiglio, del 21 aprile 1975, che aumenta
    i volumi dei contingenti tariffari comunitari aperti per il 1975, per taluni prodotti
    tessili originari di Malta, dai regolamenti (CEE) n. 2917/74, (CEE) n. 2918/74,
    (CEE) n. 2919/74 e (CEE) n. 2920/74
  type: main
- language: nl
