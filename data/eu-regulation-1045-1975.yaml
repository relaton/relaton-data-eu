  content: Regulation (EEC) No 1045/75 of the Council of 21 April 1975 increasing
    the size of the Community tariff quotas opened for 1975 for certain textile products
    originating in Malta by Regulations (EEC) No 2917/74, (EEC) No 2918/74, (EEC)
    No 2919/74 and (EEC) No 2920/74
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1045/75 du Conseil, du 21 avril 1975, portant augmentation
    des volumes des contingents tarifaires communautaires ouverts pour l'année 1975,
    pour certains produits textiles originaires de Malte, par les règlements (CEE)
    n° 2917/74, (CEE) n 2918/74, (CEE) n° 2919/74 et (CEE) n 2920/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1045/75 des Rates vom 21. April 1975 zur Erhöhung
    der durch die Verordnungen (EWG) Nr. 2917/74, (EWG) Nr. 2918/74, (EWG) Nr. 2919/74
    und (EWG) Nr. 2920/74 für bestimmte Spinnstoffwaren mit Ursprung in Malta für
    1975 eröffneten Gemeinschaftszollkontingente
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1045/75 af 21. april 1975 om forhøjelse
