title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à l'établissement d'un formulaire
    à utiliser par les États membres pour la présentation de leurs demandes en
    vue de concours du Fonds social européen pour des opérations de réinstallation
    à l'intérieur d'un pays de la Communauté
  type: main
- language: de
  script: Latn
  content: '63/104/EWG: Entscheidung der Kommission über die Einführung eines Vordrucks
    für Anträge der Mitgliedstaaten auf Gewährung von Zuschüssen aus dem Europäischen
    Sozialfonds für Zwecke der Umsiedlung innerhalb eines Mitgliedslandes der Gemeinschaft'
  type: main
- language: it
  script: Latn
  content: '63/104/CEE: Decisione della Commissione relativa all''istituzione di un
    formulario che dovrà essere utilizzato dagli Stati membri per presentare le domande
    intese ad ottenere il contributo del Fondo sociale europeo, per le operazioni
    di nuova sistemazione all''interno di un paese della Comunità'
  type: main
- language: nl
  script: Latn
  content: '63/104/EEG: Beschikking van de Commissie houdende vaststelling van een
    formulier ten behoeve van de Lid- Staten voor het indienen van hun aanvragen om
    een bijdrage van het Europees Sociaal Fonds terzake van uitgaven gedaan voor de
    verplaatsing binnen het grondgebied van één Staat der Gemeenschap'
  type: main
