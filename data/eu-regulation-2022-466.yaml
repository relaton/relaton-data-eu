title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/466 of 17 December 2021 supplementing
    Regulation (EU) No 600/2014 of the European Parliament and of the Council by specifying
    criteria for derogation of the principle that approved publication arrangements
    and approved reporting mechanisms are supervised by the European Securities Markets
    Authority
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/466 de la Commission du 17 décembre 2021
    complétant le règlement (UE) no 600/2014 du Parlement européen et du Conseil
    en précisant les critères de dérogation au principe selon lequel les dispositifs
    de publication agréés et les mécanismes de déclaration agréés sont surveillés
    par l’Autorité européenne des marchés financiers
  type: main
- language: de
  script: Latn
