    przez określenie kryteriów dotyczących odstępstwa od zasady, zgodnie z którą
    zatwierdzone podmioty publikujące i zatwierdzone mechanizmy sprawozdawcze są
    nadzorowane przez Europejski Urząd Nadzoru Giełd i Papierów Wartościowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/466 da Comissão de 17 de dezembro de 2021
