id: EURegulation30081976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3008/76 of 10 December 1976 re-establishing
    the levying of customs duties on certain appliances, apparatus, accessories and
    requisites for gymnastics or athletics, or for sports and outdoor games (other
    than articles falling within heading No 97.04), falling within subheadings 97.06
    B and C, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3008/76 de la Commission, du 10 décembre 1976, portant
    rétablissement de la perception des droits de douane applicables à certains
    articles et engins pour les jeux de plein air, la gymnastique, l'athlétisme et
    autres sports, à l'exclusion des articles du n° 97.04, des sous-positions tarifaires
    97.06 B et C, originaires des pays en voie de développement bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3008/76 der Kommission vom 10. Dezember 1976 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten, ausgenommen Waren der Tarifnummer 97.04, der Tarifstellen 97.06
    B und C, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3008/76 af 10. december 1976 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil
    samt til gymnastik, atletik og andre sportsgrene (bortset fra varer henhørende
    under position 97.04), henhørende under underposition 97.06 B og C, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3008/76 della Commissione, del 10 dicembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all'aperto, da ginnastica, da atletica ed altri sport, diversi da
    quelli della voce 97.04, delle sottovoci doganali 97.06 B e C, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3008/76 van de Commissie van 10 december 1976 houdende
    wederinstelling van de heffing van de douanerechten voor artikelen en toestellen
    voor openluchtspelen, voor gymnastiek, voor atletiek en voor andere sporten, met
    uitzondering van de artikelen bedoeld bij post 97.04, van post 97.06 B en C, van
    oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 3010/75 van de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
