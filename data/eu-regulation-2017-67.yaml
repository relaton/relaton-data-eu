    du Conseil fixant des dispositions pour la gestion des dépenses relatives, d'une
    part, à la chaîne de production des denrées alimentaires, à la santé et au
    bien-être des animaux et, d'autre part, à la santé et au matériel de reproduction
    des végétaux, en complétant la liste des maladies animales et des zoonoses
    figurant à ladite annexe
