  script: Latn
  content: Commission Delegated Regulation (EU) 2017/67 of 4 November 2016 amending
    Annex II to Regulation (EU) No 652/2014 of the European Parliament and of the
    Council laying down provisions for the management of expenditure relating to the
    food chain, animal health and animal welfare, and relating to plant health and
    plant reproductive material by supplementing the list of animal diseases and zoonoses
    in that Annex
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/67 de la Commission du 4 novembre 2016
