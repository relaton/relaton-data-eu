title:
- language: en
  script: Latn
  content: Directive 2007/30/EC of the European Parliament and of the Council of 20
    June 2007 amending Council Directive 89/391/EEC, its individual Directives and
    Council Directives 83/477/EEC, 91/383/EEC, 92/29/EEC and 94/33/EC with a view
    to simplifying and rationalising the reports on practical implementation
  type: main
- language: fr
  script: Latn
