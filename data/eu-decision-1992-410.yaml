  content: '92/410/EEC: Council Decision of 27 July 1992 on the conclusion of the
    Agreement in the form of an exchange of letters on the provisional application
    of the Protocol establishing, for the period from 3 May 1992 to 2 May 1994, the
    fishing opportunities and financial compensation provided for in the Agreement
    between the European Economic Community and the Government of the People'' s Republic
    of Angola on fishing off Angola'
  type: main
- language: fr
