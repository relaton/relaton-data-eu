title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 940/80 of 14 April 1980 re-establishing
    the levying of customs duties on other under garments, knitted or crocheted, products
    of category 69 (code 0690), originating in the Philippines, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 940/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres sous-vêtements
    de bonneterie, de la catégorie 69 (code 0690), originaires des Philippines, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 940/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für andere Unterkleider aus Gewirken der Warenkategorie
    Nr. 69 (Kennziffer 0690), mit Ursprung in den Philippinen, denen die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 940/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for andre underbeklædningsgenstande af trikotage,
    under varekategori nr. 69 (kode 0690), som har oprindelse i Filippinerne og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 940/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle altre sottovesti
    a maglia, della categoria di prodotti n. 69 (codice 0690), originarie delle Filippine
    beneficiarie delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 940/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere onderkleding
    van breiwerk van de categorie van produkten nr. 69 (codenummer 0690), van oorsprong
    uit de Filippijnen waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
