    di alcuni correttivi applicabili ai prezzi d'intervento per il burro e il latte
    scremato in polvere
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2664/69 van de Commissie van 24 december 1969 tot
    wijziging van de Verordeningen (EEG) nrs. 1104/68 en 1667/69 naar aanleiding van
    de afschaffing van sommige correctiebedragen die van toepassing waren op de interventieprijzen
    voor boter en magere-melkpoeder
