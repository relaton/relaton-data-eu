  content: Règlement (CEE) n° 2664/69 de la Commission, du 24 décembre 1969, modifiant
    les règlements (CEE) n° 1104/68 et 1667/69 à la suite de la suppression de
    certains correctifs applicables au prix d'intervention du beurre et du lait écrémé
    en poudre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2664/69 der Kommission vom 24. Dezember 1969 zur Änderung
    der Verordnungen (EWG) Nrn. 1104/68 und 1667/69 infolge des Fortfalls bestimmter,
    auf den Interventionspreis für Butter und Magermilchpulver anwendbarer Berichtigungsbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2664/69 della Commissione, del 24 dicembre 1969, che
