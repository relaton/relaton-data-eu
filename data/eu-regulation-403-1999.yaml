    certificados de importación, presentadas en febrero de 1999, correspondientes
    a los contingentes arancelarios de carne de vacuno establecidos por el Reglamento
    (CE) n° 1926/96 para Lituania, Letonia y Estonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 403/1999 av den 24 februari 1999 om i
