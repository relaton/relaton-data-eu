title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 403/1999 of 24 February 1999 determining
    the extent to which import licence applications submitted in February 1999 under
    the tariff quotas for beef provided for by Regulation (EC) No 1926/96 for Estonia,
    Latvia, and Lithuania may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 403/1999 de la Commission du 24 février 1999 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en février 1999 pour les contingents tarifaires de la viande bovine
    prévus par le règlement (CE) n° 1926/96 pour l'Estonie, la Lettonie et la Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 403/1999 der Kommission vom 24. Februar 1999 zur Bestimmung
    des Ausmaßes, in dem den im Februar 1999 gestellten Anträgen auf Erteilung von
    Einfuhrlizenzen im Rahmen der in der Verordnung (EG) Nr. 1926/96 des Rates für
    Litauen, Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 403/1999 af 24. februar 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicenser indgivet
    i februar 1999 for de toldkontingenter i oksekødssektoren, der er fastsat i forordning
    (EF) nr. 1926/96 for Estland, Letland og Litauen
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 403/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Φεβρουαρίου 1999 για τον καθορισμό σε
    ποιο βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Φεβρουάριο 1999 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται από τον
    κανονισμό (ΕΚ) αριθ. 1926/96 για την Εσθονία, τη
    Λετονία και τη Λιθουανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 403/1999, annettu 24 päivänä helmikuuta 1999,
    asetuksessa (EY) N:o 1926/96 määrättyjen naudanlihan tariffikiintiöitä koskevien,
    helmikuussa 1999 jätettyjen tuontitodistushakemusten hyväksyttävyydestä Viron,
    Latvian ja Liettuan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 403/1999 della Commissione del 24 febbraio 1999 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel febbraio 1999 per i contingenti tariffari di carni bovine previsti
    dal regolamento (CE) n. 1926/96 per l'Estonia, la Lettonia e la Lituania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 403/1999 van de Commissie van 24 februari 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in februari 1999
    ingediende aanvragen om invoercertificaten voor de tariefcontingenten voor rundvlees
    op grond van Verordening (EG) nr. 1926/96 van de Raad voor Estland, Letland en
    Litouwen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 403/1999 da Comissão de 24 de Fevereiro de 1999 que
    determina em que medida podem ser aceites os pedidos dos certificados de importação
    apresentados em Fevereiro de 1999 para os contingentes pautais de carne de bovino
    previstos no Regulamento (CE) n° 1926/96 para a Estónia, a Letónia e a Lituânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 403/1999 de la Comisión de 24 de febrero de 1999 por
