title:
- language: fr
  script: Latn
  content: Décision 65/218/CEE de la Commission, du 31 mars 1965, portant prorogation
    et modification de sa décision du 21 décembre 1964 autorisant la perception
    de taxes compensatoires à l'importation, dans la République française, de dextrines,
    d'amidons et fécules solubles ou torréfiés, ainsi que de parements préparés
    et apprêts préparés, à base de matières amylacées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '65/218/EWG: Entscheidung der Kommission vom 31. März 1965 zur Verlängerung
    und Änderung ihrer Entscheidung vom 21. Dezember 1964 über die Erhebung von
    Ausgleichsabgaben bei der Einfuhr von Dextrin, löslicher und gerösteter Stärke,
    zubereiteten Zurichtemitteln und zubereiteten Appreturen auf der Grundlage von
    Stärke, aus verschiedenen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '65/218/CEE: Decisione della Commissione, del 31 marzo 1965, che proroga
    e modifica la decisione del 21 dicembre 1964 che autorizza la riscossione di tasse
    di compensazione all''importazione, nella Repubblica francese, di destrine, amidi,
    fecole solubili o torrefatte e cosi pure di bozzime e apprelli preparati a base
    di materie amidacee provenienti dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/218/EEG: Beschikking van de Commissie van 31 maart 1965 tot verlenging
    en wijziging van haar beschikking van 21 december 1964 houdende machtiging tot
    het leggen van compenserende heffingen op de invoer in de Franse Republiek van
    dextrine, oplosbaar of geroost zetmeel, en preparaten voor het appreteren op basis
    van zetmeel of van zetmeelderivaten, uit bepaalde Lid-Staten'
  type: main
