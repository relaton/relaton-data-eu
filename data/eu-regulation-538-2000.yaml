  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 538/2000, 13. märts 2000, millega muudetakse
    määrust (EÜ) nr 1599/97, millega kehtestatakse teatavate Bulgaariast, Ungarist,
    Poolast, Rumeeniast, Slovakkiast, Tšehhi Vabariigist, Eestist ja Leedust pärit
    marjade suhtes minimaalsete impordihindade süsteemi kohaldamise üksikasjalikud
    eeskirjad, ning tunnistatakse kehtetuks määrused (EMÜ) nr 1226/92 ja (EÜ)
    nr 2479/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 538/2000, annettu 13 päivänä maaliskuuta 2000,
    Bulgariasta, Unkarista, Puolasta, Romaniasta, Slovakiasta, Tsekin tasavallasta,
    Virosta ja Liettuasta peräisin olevien tiettyjen marjojen vähimmäistuontihintaa
    koskevan menettelyn yksityiskohtaisista soveltamissäännöistä annetun asetuksen
    (EY) N:o 1599/97 muuttamisesta ja asetusten (ETY) N:o 1226/92 ja (EY) N:o 2479/96
    kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 538/2000/EK rendelete (2000. március 13.) a Bulgáriából,
    Magyarországról, Lengyelországból, Romániából, Szlovákiából, a Cseh
    Köztársaságból, Észtországból és Litvániából származó egyes bogyós
    gyümölcsökre vonatkozó minimum importárak rendszerének alkalmazására vonatkozó
    részletes szabályok megállapításáról szóló 1599/97/EK rendelet módosításáról,
    valamint az 1226/92/EGK és a 2479/96/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 538/2000 della Commissione, del 13 marzo 2000, che
    modifica il regolamento (CE) n. 1599/97 recante modalità di applicazione del
    regime dei prezzi minimi all'importazione per taluni frutti rossi originari della
    Bulgaria, dell'Ungheria, della Polonia, della Romania, della Repubblica slovacca
    e della Repubblica ceca, dell'Estonia e della Lituania, e che abroga i regolamenti
    (CEE) n. 1226/92 e (CE) n. 2479/96
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 538/2000 (2000. gada 13. marts), ar kuru groza
    Regulu (EK) Nr. 1599/97, ar ko nosaka sīki izstrādātus noteikumus par to, kā
    piemērot minimālo importa cenu režīmu dažiem tādu mīksto augļu veidiem,
    kuru izcelsme ir Bulgārijā, Ungārijā, Polijā, Rumānijā, Slovākijā, Čehijas
    Republikā, Igaunijā un Lietuvā, un kas atceļ Regulas (EEK) Nr. 1226/92 un
    (EK) Nr. 2479/96
  type: main
- language: lt
  script: Latn
  content: 2000 m. kovo 13 d. Komisijos reglamentas (EB) Nr. 538/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 1599/97, nustatantį išsamias minimalių importo
    kainų sistemos taikymo tam tikroms uogoms, kurių kilmės šalis yra Bulgarija,
    Vengrija, Lenkija, Rumunija, Slovakija, Čekijos Respublika, Estija ir Lietuva,
    taisykles, ir panaikinantis Reglamentus (EEB) Nr. 1226/92 ir (EB) Nr. 2479/96
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 538/2000 tat-13 ta’ Marzu 2000
    li jemenda r-Regolament (KE) Nru 1599/97 li jippreskrivi regoli dettaljati għall-applikazzjoni
    tas-sistema ta’ prezzijiet minimi ta’ l-importazzjoni ta’ ċertu frott artab
    li joriġina fil-Bulgarija, l-Ungerija, il-Polonja, ir-Rumanija, is-Slovakkja,
    ir-Repubblika Ċeka, l-Estonja u l-Litwanja u li jħassar ir-Regolamenti (KEE)
    Nru 1226/92 u (KE) Nru 2479/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 538/2000 van de Commissie van 13 maart 2000 tot wijziging
    van Verordening (EG) nr. 1599/97 houdende uitvoeringsbepalingen van de regeling
    inzake minimumprijzen bij invoer van bepaalde soorten klein fruit van oorsprong
    uit Bulgarije, Hongarije, Polen, Roemenië, Slowakije, Tsjechië, Estland of Litouwen
    en tot intrekking van Verordening (EEG) nr. 1226/92 en van Verordening (EG) nr.
    2479/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 538/2000 z dnia 13 marca 2000 r. zmieniające
    rozporządzenie (WE) nr 1599/97 ustanawiające szczegółowe zasady stosowania
    systemu minimalnych cen importowych na niektóre owoce miękkie pochodzące z
    Bułgarii, Węgier, Polski, Rumunii, Słowacji i Republiki Czeskiej oraz uchylające
    rozporządzenia (EWG) nr 1226/92 i (WE) nr 2479/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 538/2000 da Comissão, de 13 de Março de 2000, que
    altera o Regulamento (CE) n.o 1599/97 que estabelece normas de execução do regime
    do preço mínimo de importação de determinados frutos vermelhos originários
    da Bulgária, da Hungria, da Polónia, da Roménia, da Eslováquia, da República
    Checa, da Estónia e da Lituânia e revoga os Regulamentos (CEE) n.o 1226/92 e
    (CE) n.o 2479/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 538/2000 z 13. marca 2000 o zmene a doplnení
    nariadenia (ES) č. 1599/97 ustanovujúceho podrobné pravidlá na uplatňovanie
    systému minimálnych dovozných cien pre určité druhy drobnoplodého ovocia
    pochádzajúceho z Bulharska, Maďarska, Poľska, Rumunska, Slovenska, Českej
    republiky, Estónska a Litvy a zrušujúceho nariadenia (EHS) č. 1226/92 a (ES)
    č. 2479/96
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 538/2000 z dne 13. marca 2000 o spremembi Uredbe
    (ES) št. 1599/97 o podrobnih pravilih za uporabo sistema minimalnih uvoznih cen
    za nekatero jagodičje, s poreklom iz Bolgarije, Madžarske, Poljske, Romunije,
    Slovaške, Češke republike, Estonije in Litve, in o razveljavitvi uredb (EGS)
    št. 1226/92 in (ES) št. 2479/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 538/2000 de la Comisión, de 13 de marzo de 2000, que
    modifica el Reglamento (CE) nº 1599/97 por el que se establecen las disposiciones
    de aplicación del régimen de precios mínimos de importación de determinados
    frutos rojos originarios de Bulgaria, Hungría, Polonia, Rumania, Eslovaquia,
    la República Checa, Estonia y Lituania, y que deroga los Reglamentos (CEE) nº
    1226/92 y (CE) nº 2479/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 538/2000 av den 13 mars 2000 om ändring
    av förordning (EG) nr 1599/97 om tillämpningsföreskrifter för systemet med
    ett lägsta importpris för vissa bärsorter med ursprung i Bulgarien, Estland,
    Litauen, Polen, Rumänien, Slovakien, Tjeckien eller Ungern och om upphävande
