title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 538/2000 of 13 March 2000 amending Regulation
    (EC) No 1599/97 laying down detailed rules for the application of the system of
    minimum import prices for certain soft fruits originating in Bulgaria, Hungary,
    Poland, Romania, Slovakia, the Czech Republic, Estonia and Lithuania and repealing
    Regulations (EEC) No 1226/92 and (EC) No 2479/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 538/2000 de la Commission, du 13 mars 2000, modifiant
    le règlement (CE) nº 1599/97 portant modalités d'application du régime du
    prix minimal à l'importation de certains fruits rouges originaires de Bulgarie,
    de Hongrie, de Pologne, de Roumanie, de Slovaquie, de la République tchèque,
    d'Estonie et de Lituanie et abrogeant les règlements (CEE) nº 1226/92 et (CE)
    nº 2479/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 538/2000 der Kommission vom 13. März 2000 zur Änderung
    der Verordnung (EG) Nr. 1599/97 mit Durchführungsbestimmungen zu der Mindestpreisregelung
    bei der Einfuhr von bestimmtem Beerenobst mit Ursprung in Bulgarien, Estland,
    Litauen, Polen, Rumänien, der Slowakei, der Tschechischen Republik und Ungarn
    und zur Aufhebung der Verordnungen (EWG) Nr. 1226/92 und (EG) Nr. 2479/96
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 538/2000 ze dne 13. března 2000, kterým se
    mění nařízení (ES) č. 1599/97, kterým se stanoví prováděcí pravidla
    k režimu minimálních dovozních cen pro některé bobuloviny pocházející
    z Bulharska, Maďarska, Polska, Rumunska, Slovenska, České republiky, Estonska
    a Litvy a kterým se zrušují nařízení (EHS) č. 1226/92 a (ES) č. 2479/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 538/2000 af 13. marts 2000 om ændring
    af forordning (EF) nr. 1599/97 om gennemførelsesbestemmelser til ordningen med
    minimumsimportpriser for visse bær med oprindelse i Bulgarien, Ungarn, Polen,
    Rumænien, Slovakiet, Tjekkiet, Estland og Litauen og om ophævelse af forordningerne
    (EØF) nr. 1226/92 og (EF) nr. 2479/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 538/2000 της Επιτροπής,
    της 13ης Μαρτίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1599/97 περί των λεπτομερειών εφαρμογής
    του καθεστώτος ελάχιστης τιμής κατά την εισαγωγή
    ορισμένων ερυθρών φρούτων καταγωγής Βουλγαρίας,
    Ουγγαρίας, Πολωνίας, Ρουμανίας, Σλοβακίας,
    Τσεχικής Δημοκρατίας, Εσθονίας και Λιθουανίας
