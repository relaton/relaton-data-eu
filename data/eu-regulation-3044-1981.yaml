title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3044/81 of 23 October 1981 establishing
    the levying of customs duties on titanium oxides falling within heading No 28.25
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3044/81 de la Commission, du 23 octobre 1981, portant
    rétablissement de la perception des droits de douane applicables aux oxydes de
    titane de la position 28.25 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3044/81 der Kommission vom 23. Oktober 1981 zur Wiedereinführung
    der Erhebung der Zölle für Titanoxide der Tarifnummer 28.25, mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3044/81 af 23. oktober 1981 om genindførelse
    af opkrævning af told for oxider af titan henhørende under pos. 28.25 med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3044/81 τής Επιτροπής
    τής 23ης Οκτωβρίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά οξείδια τιτανίου
    τής κλάσεως 28. 25 τού Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου τών προβλεπομένων από τόν
    κανονισμό (EOK) αριθ. 3322/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3044/81 della Commissione, del 23 ottobre 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli ossidi di titanio
    della voce 28.25 della tariffa doganale comune, originari della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3044/81 van de Commissie van 23 oktober 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op titaanoxyden
    van tariefpost 28.25 van oorsprong uit China waarvoor in Verordening (EEG) nr.
    3322/80 van de Raad vermelde tariefpreferenties zijn verleend
