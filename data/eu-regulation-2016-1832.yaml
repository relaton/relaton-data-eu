    dalies keičiami į Sąjungą importuojamų mėsos pusgaminių, mėsos gaminių
    ir apdorotų skrandžių, pūslių ir žarnų, taip pat šviežios naminių neporanagių
    mėsos veterinarijos sertifikatų pavyzdžiai, nustatyti sprendimuose 2000/572/EB
    ir 2007/777/EB bei Reglamente (ES) Nr. 206/2010
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1832 tas-17 ta'
