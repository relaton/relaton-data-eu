    на сертификати за внос в Съюза на месни заготовки,
    месни продукти и обработени стомаси, пикочни
    мехури и черва, както и на прясно месо от домашни
    еднокопитни животни, посочени в решения 2000/572/ЕО
    и 2007/777/ЕО и в Регламент (ЕС) № 206/2010, по отношение
    на изискванията за общественото здраве във
    връзка с остатъчните вещества
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/1832 ze dne 17. října 2016,
    kterým se mění vzory osvědčení pro dovoz masných polotovarů, masných
    výrobků a opracovaných žaludků, močových měchýřů a střev a rovněž
    čerstvého masa domácích lichokopytníků do Unie stanovené v rozhodnutích
    2000/572/ES a 2007/777/ES a nařízení (EU) č. 206/2010, pokud jde o hygienické
    požadavky týkající se reziduí
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/1832 af 17. oktober 2016
