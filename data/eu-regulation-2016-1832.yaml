title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1832 of 17 October 2016 amending
    the model certificates for imports into the Union of meat preparations, meat products
    and treated stomachs, bladders and intestines, as well as fresh meat of domestic
    solipeds set out in Decisions 2000/572/EC and 2007/777/EC and Regulation (EU)
    No 206/2010 as regards public health requirements for residues
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/1832 de la Commission du 17 octobre 2016
    modifiant les modèles de certificats pour l'importation dans l'Union de préparations
    de viandes, de produits à base de viande et d'estomacs, vessies et boyaux traités,
    ainsi que de viandes fraîches de solipèdes domestiques, établis par les décisions
    2000/572/CE et 2007/777/CE et le règlement (UE) n° 206/2010 en ce qui concerne
    les conditions de police sanitaire relatives aux résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/1832 der Kommission vom 17. Oktober
    2016 zur Änderung der Musterbescheinigungen für die Einfuhr von Fleischzubereitungen,
    Fleischerzeugnissen und behandelten Mägen, Blasen und Därmen sowie von Frischfleisch
    von als Haustieren gehaltenen Einhufern gemäß den Entscheidungen 2000/572/EG
    und 2007/777/EG und der Verordnung (EU) Nr. 206/2010 zum Schutz der Gesundheit
    im Hinblick auf Rückstände
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/1832 на Комисията
