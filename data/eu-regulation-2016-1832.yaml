    rakkojen ja suolien sekä kotieläiminä pidettyjen kavioeläinten tuoreen lihan
    unioniin tuontia varten päätöksissä 2000/572/EY ja 2007/777/EY sekä asetuksessa
    (EU) N:o 206/2010 vahvistettujen todistusmallien muuttamisesta jäämiä koskevien
    kansanterveydellisten vaatimusten osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/1832 оd 17. listopada 2016. o izmjeni
    obrazaca certifikata za uvoz u Uniju mesnih pripravaka, mesnih proizvoda i obrađenih
    želudaca, mjehura i crijeva te svježeg mesa domaćih kopitara, utvrđenih odlukama
    2000/572/EZ i 2007/777/EZ i Uredbom (EU) br. 206/2010, s obzirom na zahtjeve o
    javnom zdravlju u pogledu rezidua
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1832 végrehajtási rendelete (2016. október 17.)
    az előkészített húsokat, húskészítményeket és kezelt gyomrot, hólyagot
    és beleket, valamint egypatás állatok friss húsát tartalmazó szállítmányok
    behozatalára vonatkozó, a 2000/572/EK és 2007/777/EK határozatban, valamint
    a 206/2010/EU rendeletben meghatározott bizonyítványmintáknak az anyagmaradványokra
    vonatkozó közegészségügyi követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/1832 della Commissione, del 17 ottobre
    2016, che modifica i modelli dei certificati per le importazioni nell'Unione di
    preparazioni di carni, prodotti a base di carne e stomaci, vesciche e intestini
    trattati, nonché di carni fresche di solipedi domestici di cui alle decisioni
    2000/572/CE e 2007/777/CE e al regolamento (UE) n. 206/2010 per quanto riguarda
    le condizioni di polizia sanitaria per i residui
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/1832 (2016. gada 17. oktobris),
    ar ko attiecībā uz sabiedrības veselības aizsardzības prasībām par atliekām
    groza Lēmumā 2000/572/EK, Lēmumā 2007/777/EK un Regulā (ES) Nr. 206/2010
    noteiktos sertifikātu paraugus gaļas izstrādājumu, gaļas produktu un apstrādātu
    kuņģu, pūšļu un zarnu, kā arī svaigas mājas nepārnadžu gaļas importam
    Savienībā
  type: main
- language: lt
  script: Latn
  content: 2016 m. spalio 17 d. Komisijos įgyvendinimo reglamentas (ES) 2016/1832,
