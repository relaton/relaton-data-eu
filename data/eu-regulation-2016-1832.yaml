    köttprodukter och behandlade magar, blåsor och tarmar samt färskt kött från
    tama hästdjur i besluten 2000/572/EG och 2007/777/EG och förordning (EU) nr
    206/2010 vad gäller folkhälsokrav för restsubstanser
