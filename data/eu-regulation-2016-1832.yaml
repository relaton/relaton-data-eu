    ta' preparazzjonijiet tal-laħam, ta' prodotti tal-laħam u ta' stonkijiet, bżieżaq
    tal-awrina u msaren ittrattati, kif ukoll ta' laħam frisk ta' solipedi domestiċi
    stabbiliti fid-Deċiżjoni 2000/572/KE, fid-Deċiżjoni 2007/777/KE u fir-Regolament
    (UE) Nru 206/2010 fir-rigward tar-rekwiżiti dwar is-saħħa pubblika għar-residwi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/1832 van de Commissie van 17 oktober 2016
    tot wijziging van de modelcertificaten voor de invoer in de Unie van vleesbereidingen,
    vleesproducten en behandelde magen, blazen en darmen alsmede vers vlees van als
    landbouwhuisdier gehouden eenhoevigen als vastgesteld in de Beschikkingen 2000/572/EG
    en 2007/777/EG en Verordening (EU) nr. 206/2010 wat de gezondheidsvoorschriften
    voor residuen betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/1832 z dnia 17 października
    2016 r. zmieniające wzory świadectw na przywóz do Unii wyrobów mięsnych,
    produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit, jak
    również świeżego mięsa gospodarskich zwierząt nieparzystokopytnych określone
    w decyzjach 2000/572/WE i 2007/777/WE oraz w rozporządzeniu (UE) nr 206/2010
    w odniesieniu do wymogów zdrowia publicznego dla pozostałości
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/1832 da Comissão, de 17 de outubro
    de 2016, que altera os modelos de certificados para as importações na União
    de preparados de carne, produtos à base de carne e estômagos, bexigas e intestinos
    tratados, bem como carne fresca de solípedes domésticos, estabelecidos nas Decisões
    2000/572/CE e 2007/777/CE e no Regulamento (UE) n.° 206/2010, no que se refere
    aos requisitos de saúde pública aplicáveis aos resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/1832 al Comisiei din 17 octombrie
    2016 de modificare a modelelor de certificate pentru importurile în Uniune de
    preparate din carne, produse din carne și stomacuri, vezici și intestine tratate,
    precum și de carne proaspătă, provenite de la solipede domestice, stabilite
    în Deciziile 2000/572/CE și 2007/777/CE și în Regulamentul (UE) nr. 206/2010
    în ceea ce privește cerințele de sănătate publică pentru reziduuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/1832 zo 17. októbra 2016, ktorým
    sa menia vzory certifikátov na dovoz mäsových prípravkov, mäsových výrobkov
    a opracovaných žalúdkov, mechúrov a čriev, ako aj čerstvého mäsa z domácich
    nepárnokopytníkov do Únie stanovené v rozhodnutiach 2000/572/ES a 2007/777/ES
    a nariadení (EÚ) č. 206/2010, pokiaľ ide o požiadavky týkajúce sa verejného
    zdravia v súvislosti s rezíduami
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/1832 z dne 17. oktobra 2016 o spremembi
    vzorcev spričeval za uvoz v Unijo mesnih pripravkov, mesnih izdelkov in obdelanih
    želodcev, mehurjev in črev ter svežega mesa domačih enoprstih kopitarjev,
    ki so določeni v odločbah 2000/572/ES in 2007/777/ES ter Uredbi (EU) št. 206/2010,
    v zvezi z javnozdravstvenimi zahtevami za ostanke
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/1832 de la Comisión, de 17 de octubre
    de 2016, por el que se modifican los modelos de certificados para las importaciones
    en la Unión de preparados de carne, productos cárnicos y estómagos, vejigas
    e intestinos tratados, así como de carne fresca de solípedos domésticos establecidos
    en las Decisiones 2000/572/CE y 2007/777/CE y el Reglamento (UE) n.° 206/2010
    por lo que se refiere a los requisitos de salud pública con respecto a los residuos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/1832 av den 17 oktober
