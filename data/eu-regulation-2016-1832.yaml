    kød, kødprodukter og behandlede maver, blærer og tarme samt fersk kød fra
    tamdyr af hestefamilien fastsat i beslutning 2000/572/EF og 2007/777/EF og forordning
    (EU) nr. 206/2010 for så vidt angår folkesundhedsmæssige bestemmelser for restkoncentrationer
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/1832 της Επιτροπής,
