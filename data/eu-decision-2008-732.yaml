---
id: EUDecision2008732
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2008/732/CFSP of 15 September 2008 implementing Common
    Position 2004/293/CFSP renewing measures in support of the effective implementation
    of the mandate of the International Criminal Tribunal for the former Yugoslavia
    (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2008/732/PESC du Conseil du 15 septembre 2008 mettant en œuvre
    la position commune 2004/293/PESC concernant le renouvellement des mesures définies
    à l'appui d'une mise en œuvre effective du mandat du Tribunal pénal international
    pour l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Beschluss 2008/732/GASP des Rates vom 15. September 2008 zur Durchführung
    des Gemeinsamen Standpunkts 2004/293/GASP zur Verlängerung von Maßnahmen zur
    Unterstützung der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs
    für das ehemalige Jugoslawien (ICTY)
  type: main
- language: bg
  script: Cyrl
  content: Решение 2008/732/ОВППС на Съвета от 15 септември
    2008 година за изпълнение на Обща позиция 2004/293/ОВППС
    за възобновяване на мерките в подкрепа на ефективно
    въвеждане на мандата на Международния трибунал
    за престъпления в бивша Югославия (МТПЮ)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2008/732/SZBP ze dne 15. září 2008 , kterým se provádí
    společný postoj 2004/293/SZBP, kterým se obnovují opatření na podporu účinného
    provádění mandátu Mezinárodního trestního tribunálu pro bývalou Jugoslávii
    (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2008/732/FUSP af 15. september 2008 om gennemførelse
    af fælles holdning 2004/293/FUSP om forlængelse af foranstaltningerne til støtte
    for den effektive gennemførelse af mandatet til Den Internationale Krigsforbryderdomstol
    vedrørende det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2008/732/ΚΕΠΠΑ του Συμβουλίου, της
    15ης Σεπτεμβρίου 2008 , για την εφαρμογή της κοινής
    θέσης 2004/293/ΚΕΠΠΑ για την ανανέωση των καθορισθέντων
    μέτρων προς υποστήριξη της αποτελεσματικής
    εφαρμογής της εντολής του Διεθνούς Ποινικού
    Δικαστηρίου για την πρώην Γιουγκοσλαβία (ΔΠΔΓ)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2008/732/ÜVJP, 15. september 2008 , millega rakendatakse
    ühist seisukohta 2004/293/ÜVJP, millega pikendatakse endise Jugoslaavia asjade
    rahvusvahelise kriminaalkohtu (EJRK) volituste tõhusat rakendamist toetavate
    meetmete kehtivusaega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2008/732/YUTP, tehty 15 päivänä syyskuuta 2008 ,
    entisen Jugoslavian alueen kansainvälisen rikostuomioistuimen toimeksiannon tehokasta
    täytäntöönpanoa tukevien toimenpiteiden uusimisesta hyväksytyn yhteisen kannan
    2004/293/YUTP täytäntöönpanosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2008/732/KKBP határozata ( 2008. szeptember 15. ) a volt Jugoszláviában
    elkövetett háborús bűncselekményeket vizsgáló Nemzetközi Törvényszék
    (ICTY) megbízatása hatékony végrehajtásának támogatására meghatározott
    intézkedések megújításáról szóló 2004/293/KKBP közös álláspont végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2008/732/PESC del Consiglio, del 15 settembre 2008 , che attua
    la posizione comune 2004/293/PESC che proroga le misure a sostegno dell'effettiva
    attuazione del mandato del Tribunale penale internazionale per la ex Iugoslavia
    (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2008/732/KĀDP ( 2008. gada 15. septembris ), ar ko īsteno
    Kopējo nostāju 2004/293/KĀDP, ar kuru atjauno pasākumus, lai atbalstītu sekmīgu
    Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai ( ICTY )
    pilnvaru īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2008 m. rugsėjo 15 d. Tarybos sprendimas 2008/732/BUSP, įgyvendinantis
    Bendrąją poziciją 2004/293/BUSP, atnaujinančią priemones, remiančias veiksmingą
    Tarptautinio baudžiamojo tribunolo buvusiajai Jugoslavijai (TBTBJ) mandato įgyvendinimą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2008/732/PESK tal- 15 ta’ Settembru 2008 li timplimenta
    l-Pożizzjoni Komuni 2004/293/PESK li ġġedded il-miżuri b'appoġġ għall-implimentazzjoni
    effettiva tal-mandat tat-Tribunal Kriminali Internazzjonali għall-ex Jugoslavja
    (TKIJ)
  type: main
- language: nl
  script: Latn
  content: Besluit 2008/732/GBVB van de Raad van 15 september 2008 tot uitvoering
    van Gemeenschappelijk Standpunt 2004/293/GBVB tot verlenging van de maatregelen
    ter ondersteuning van de daadwerkelijke uitvoering van het mandaat van het Internationaal
    Oorlogstribunaal voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2008/732/WPZiB z dnia 15 września 2008 r. wprowadzająca
    w życie wspólne stanowisko 2004/293/WPZiB odnawiające środki wspierające
    skuteczne wykonanie mandatu Międzynarodowego Trybunału Karnego dla Byłej Jugosławii
    (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Decisão 2008/732 PESC do Conselho, de 15 de Setembro de 2008 , que dá
    execução à Posição Comum 2004/293/PESC que renova as medidas de apoio ao
    exercício efectivo do mandato do Tribunal Penal Internacional para a ex-Jugoslávia
    (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Decizia 2008/732/PESC a Consiliului din 15 septembrie 2008 de punere în
    aplicare a Poziției comune 2004/293/PESC privind reînnoirea măsurilor stabilite
    în sprijinul punerii efective în aplicare a mandatului Tribunalului Penal Internațional
    pentru fosta Iugoslavie (TPII)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2008/732/SZBP z 15. septembra 2008 , ktorým sa vykonáva
    spoločná pozícia 2004/293/SZBP, ktorou sa obnovujú opatrenia na podporu účinného
    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2008/732/SZVP z dne 15. septembra 2008 o izvajanju Skupnega
    stališča 2004/293/SZVP o obnovitvi ukrepov v podporo učinkovitemu izvajanju
    pooblastil Mednarodnega kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Decisión 2008/732/PESC del Consejo, de 15 de septiembre de 2008 , por
    la que se aplica la Posición Común 2004/293/PESC por la que se renuevan las
    medidas en apoyo de la aplicación efectiva del mandato del Tribunal Penal Internacional
    para la ex Yugoslavia (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2008/732/Gusp av den 15 september 2008 om genomförande
    av gemensam ståndpunkt 2004/293/Gusp om förnyande av åtgärder till stöd för
    ett effektivt genomförande av Internationella tribunalen för f.d. Jugoslaviens
    (Icty) uppgift
  type: main
