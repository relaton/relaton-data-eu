    vahvistetuilla koodeilla tietyissä tavaroiden luokittelua koskevissa asetuksissa
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 2080/91 od 16. srpnja 1991. o zamjeni oznaka
    utvrđenih na temelju nomenklature Zajedničke carinske tarife koja je bila na
    snazi od 31. prosinca 1987. oznakama koje su utvrđene na temelju kombinirane
    nomenklature u određenim uredbama o razvrstavanju robe
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2080/91/EGK rendelete (1991. július 16.) a bizonyos rendeletekben
