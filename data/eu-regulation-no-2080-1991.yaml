    koodid koondnomenklatuuril põhinevate koodidega teatavate kaupade klassifitseerimist
    käsitlevates määrustes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2080/91, annettu 16 päivänä heinäkuuta 1991,
