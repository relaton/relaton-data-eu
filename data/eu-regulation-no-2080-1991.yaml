title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2080/91 of 16 July 1991 replacing the codes
    established on the basis of the Common Customs Tariff nomenclature in force on
    31 December 1987 with those established on the basis of the combined nomenclature
    in certain Regulations concerning the classification of goods
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2080/91 de la Commission du 16 juillet 1991 remplaçant
    dans certains règlements relatifs au classement de marchandises les codes établis
    sur la base de la nomenclature du tarif douanier commun en vigueur au 31 décembre
    1987 par ceux établis sur base de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2080/91 der Kommission vom 16. Juli 1991 mit der in
    bestimmten Verordnungen zur Einreihung von Waren die auf der Basis der am 31.
    Dezember 1987 geltenden Tarifnummern des Schemas des Gemeinsamen Zolltarifs durch
    die Codes der Kombinierten Nomenklatur ersetzt werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 2080/91 на Комисията от 16
    юли 1991 година относно замяна на кодовете, определени
    съгласно номенклатурата на Общата митническа
    тарифа в сила от 31 декември 1987 година, с кодовете,
    определени съгласно Комбинираната номенклатура
    в определени регламенти, отнасящи се до класирането
    на стоки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 2080/91 ze dne 16. července 1991, které
    v některých nařízeních týkajících se zařazení zboží nahrazuje kódy
    stanovené na základě nomenklatury společného celního sazebníku platné
    k 31. prosinci 1987 kódy stanovenými na základě kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2080/91 af 16. juli 1991 om ændring
    i visse forordninger om tarifering af varer af de koder, der er fastlagt på grundlag
    af Den Fælles Toldtarifs nomenklatur pr. 31. december 1987, til de koder, som
    er fastlagt på grundlag af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2080/91 της Επιτροπής
