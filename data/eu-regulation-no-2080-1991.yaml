    nomenklatūras, tiek nomainīti ar kodiem, kuri atsevišķās regulās par preču
    klasifikāciju noteikti pēc kombinētās nomenklatūras
  type: main
- language: lt
  script: Latn
  content: 1991 m. liepos 16 d. Komisijos reglamentas (EEB) Nr. 2080/91 pakeičiantis
    kodus, nustatytus remiantis Bendrojo muitų tarifo nomenklatūra, galiojančia
    1987 m. gruodžio 31 d., kodais, nustatytais remiantis kai kurių reglamentų
    dėl prekių klasifikavimo Kombinuotąja nomenklatūra
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 2080/91 tas− 16 ta' Lulju 1991
