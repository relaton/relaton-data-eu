  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2080/91 della Commissione del 16 luglio 1991 che sostituisce
    in taluni regolamenti relativi alla classificazione di merci i codici stabiliti
    in base alla nomenclatura della tariffa doganale comune in vigore al 31 dicembre
    1987 con quelli stabiliti in base alla nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 2080/91 (1991. gada 16. jūlijs), ar kuru kodi,
