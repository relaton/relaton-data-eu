  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2080/91 van de Commissie van 16 juli 1991 waarbij
    in een aantal verordeningen betreffende de indeling van goederen de codes die
    zijn vastgesteld op basis van de op 31 december 1987 geldende nomenclatuur van
    het gemeenschappelijk douanetarief, worden vervangen door de codes die zijn vastgesteld
    op basis van de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 2080/91 z dnia 16 lipca 1991 r. zastępujące
    kody ustanowione na podstawie nomenklatury Wspólnej Taryfy Celnej obowiązujące
    w dniu 31 grudnia 1987 r. kodami ustanowionymi na podstawie Nomenklatury Scalonej,
    w niektórych rozporządzeniach dotyczących klasyfikacji towarów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2080/91 da Comissão de 16 de Julho de 1991 que substitui,
    em certos regulamentos relativos à classificação de mercadorias, os códigos
    estabelecidos com base na nomenclatura da Pauta Aduaneira Comum em vigor em 31
    de Dezembro de 1987, pelos códigos estabelecidos com base na Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 2080/91 al Comisiei din 16 iulie 1991 de înlocuire
    în unele regulamente privind clasificarea mărfurilor a codurilor stabilite pe
    baza Nomenclaturii Tarifului Vamal Comun în vigoare la 31 decembrie 1987 cu cele
    stabilite pe baza Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 2080/91 zo 16. júla 1991, ktorým sa číselné
    znaky ustanovené na základe nomenklatúry Spoločného colného sadzobníka
    účinnej od 31. decembra 1987 nahrádzajú tými, ktoré boli ustanovené na
    základe kombinovanej nomenklatúry v niektorých nariadeniach týkajúcich sa
    zatriedenia tovaru
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 2080/91 z dne 16. julija 1991 o nadomestitvi
    oznak, določenih na podlagi nomenklature skupne carinske tarife, ki je veljala
    dne 31. decembra 1987, z oznakami, določenimi na podlagi kombinirane nomenklature
    v nekaterih uredbah, ki se nanašajo na uvrstitev blaga
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2080/91 de la Comisión de 16 de julio de 1991 por
