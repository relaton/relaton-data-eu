  script: Latn
  content: '2010/725/EU: Commission Decision of 26 November 2010 amending Annex I
    to Decision 2006/766/EC as regards the title and the entry for Chile in the list
    of third countries from which imports of live, frozen or processed bivalve molluscs,
    echinoderms, tunicates and marine gastropods for human consumption are permitted
    (notified under document C(2010) 8259)'
  type: main
- language: fr
  script: Latn
