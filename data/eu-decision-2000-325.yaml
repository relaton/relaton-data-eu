title:
- language: en
  script: Latn
  content: '2000/325/EC: Commission Decision of 11 May 2000 authorising Member States
    to take measures provisionally against the introduction into, and the spread within
    the Community of Pepino mosaic virus as regards tomato plants, intended for planting,
    other than seeds (notified under document number C(2000) 1312)'
  type: main
- language: fr
  script: Latn
  content: '2000/325/CE: Décision de la Commission du 11 mai 2000 autorisant les
    États membres à prendre provisoirement des mesures contre l''introduction et
    la propagation dans la Communauté du virus de la mosaïque du pépino en ce qui
    concerne les plants de tomates destinés à la plantation, à l''exception des
    semences [notifiée sous le numéro C(2000) 1312]'
  type: main
- language: de
  script: Latn
  content: '2000/325/EG: Entscheidung der Kommission vom 11. Mai 2000 zur einstweiligen
    Ermächtigung der Mitgliedstaaten, Maßnahmen zum Schutz der Gemeinschaft gegen
    die Einschleppung und Ausbreitung des Pepino mosaic virus bei zum Anpflanzen bestimmten
    Tomatenpflanzen, außer Samen, zu erlassen (Bekanntgegeben unter Aktenzeichen
    K(2000) 1312)'
  type: main
- language: da
  script: Latn
  content: '2000/325/EF: Kommissionens beslutning af 11. maj 2000 om tilladelse til,
    at medlemsstaterne træffer midlertidige foranstaltninger over for indslæbning
    og spredning i Fællesskabet af pepinomosaikvirus på tomatplanter til udplantning,
    bortset fra frø (meddelt under nummer K(2000) 1312)'
  type: main
- language: el
  script: Grek
  content: '2000/325/ΕΚ: Απόφαση της Επιτροπής, της 11ης
    Μαΐου 2000, για την εξουσιοδότηση των κρατών
    μελών να λάβουν προσωρινά μέτρα κατά της εισαγωγής
    και της εξάπλωσης στην Κοινότητα του ιού της
    μωσαΐκωσης (Pepino mosaic virus) όσον αφορά τα φυτά τομάτας
    προς φύτευση, εκτός των σπόρων προς σπορά [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 1312]'
  type: main
- language: fi
  script: Latn
  content: '2000/325/EY: Komission päätös, tehty 11 päivänä toukokuuta 2000,
    luvan antamisesta jäsenvaltioille toteuttaa väliaikaisesti toimenpiteitä pepinon
    mosaiikkiviruksen yhteisöön kulkeutumisen ja siellä leviämisen estämiseksi
    istutettaviksi tarkoitettujen tomaattien osalta, siemeniä lukuun ottamatta (tiedoksiannettu
    numerolla K(2000) 1312)'
  type: main
- language: it
  script: Latn
  content: '2000/325/CE: Decisione della Commissione, dell''11 maggio 2000, che autorizza
    gli Stati membri ad adottare provvisoriamente misure contro l''introduzione e
    la propagazione nella Comunità del virus del mosaico del pepino per quanto concerne
    le piante di pomodori destinate alla piantagione, diverse dalle sementi [notificata
    con il numero C(2000) 1312]'
  type: main
- language: nl
  script: Latn
  content: '2000/325/EG: Beschikking van de Commissie van 11 mei 2000 tot machtiging
    van de lidstaten om voorlopig maatregelen te nemen tegen het binnenbrengen en
    de verspreiding in de Gemeenschap van het pepinomozaïekvirus in verband met voor
    opplant bestemde tomatenplanten, met uitzondering van zaden (kennisgeving geschied
    onder nummer C(2000) 1312)'
  type: main
- language: pt
  script: Latn
  content: '2000/325/CE: Decisão da Comissão, de 11 de Maio de 2000, que autoriza
    os Estados-Membros a tomar provisoriamente medidas contra a introdução e propagação
    na Comunidade do vírus do mosaico da pêra-melão por via de plantas de tomateiro
    destinadas a plantação, com excepção das sementes [notificada com o número
    C(2000) 1312]'
  type: main
- language: es
  script: Latn
  content: '2000/325/CE: Decisión de la Comisión, de 11 de mayo de 2000, por la
    que se autoriza a los Estados miembros a adoptar provisionalmente medidas contra
    la introducción y propagación en la Comunidad del virus del mosaico del pepino
    en relación con las plantas de tomate para plantación, excepto las semillas
    [notificada con el número C(2000) 1312]'
  type: main
- language: sv
  script: Latn
  content: '2000/325/EG: Kommissionens beslut av den 11 maj 2000 om att bemyndiga
    medlemsstaterna att vidta provisoriska åtgärder mot införsel till gemenskapen
    och spridning inom gemenskapen av pepinomosaikvirus när det gäller tomatplantor
    för plantering, utom frön [delgivet med nr K(2000) 1312]'
