  content: Commission Regulation (EEC) No 1458/85 of 31 May 1985 fixing for the 1985/86
    marketing year the minimum price to be paid to producers for cherries and the
    amount of production aid for cherries in syrup
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1458/85 de la Commission du 31 mai 1985 fixant, pour
    la campagne 1985/1986, le prix minimal à payer aux producteurs pour les cerises
    ainsi que le montant de l' aide à la production pour les cerises conservées
    au sirop
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1458/85 der Kommission vom 31. Mai 1985 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für Kirschen sowie der Produktionsbeihilfe
    für Kirschen in Sirup für das Wirtschaftsjahr 1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1458/85 af 31. maj 1985 om fastsættelse
    for produktionsåret 1985/86 af den minimumpris, der skal betales til producenterne
    for kirsebær og af producentstøtten for kirsebær i sukkerlage
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1458/85 της Επιτροπής
    της 31ης Μαΐου 1985 για τον καθορισμό, για την
    περίοδο εμπορίας 1985/86, της ελάχιστης τιμής
    που καταβάλλεται στους παραγωγούς για τα κεράσια
    και του ποσού της ενίσχυσης στην παραγωγή για
    κεράσια διατηρημένα σε σιρόπι
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1458/85 della Commissione del 31 maggio 1985 che fissa,
    per la campagna di commercializzazione 1985/1986, il prezzo minimo da pagare ai
    produttori per le ciliegie e l' importo dell' aiuto alla produzione per le ciliegie
    allo sciroppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1458/85 van de Commissie van 31 mei 1985 tot vaststelling,
    voor het verkoopseizoen 1985/1986, van de aan de telers voor de kersen te betalen
    minimumprijs alsmede van het bedrag van de steun bij de produktie voor kersen
    op siroop
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1458/85 da Comissão, de 31 de Maio de 1985, que
    fixa, para a campanha de 1985/1986, o preço mínimo a pagar aos produtores pelas
    cerejas bem como o montante da ajuda à produção para as cerejas conservadas
    em xarope
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1458/85 de la Comisión, de 31 de mayo de 1985, por
    el que se fija, para la campaña 1985/86, el precio mínimo de las cerezas que
    ha de pagarse a los productores y el importe de la ayuda a la producción en lo
    que se refiere a las conservas de cerezas en almíbar
