  script: Latn
  content: '2011/215/EU: Commission Implementing Decision of 4 April 2011 implementing
    Council Directive 97/78/EC as regards transhipment at the border inspection post
    of introduction of consignments of products intended for import into the Union
    or for third countries (notified under document C(2011) 2067)'
  type: main
- language: fr
  script: Latn
