title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2322/91 of 31 July 1991 laying down the
    detailed rules for the second supply of beef to Bulgaria as provided for in Council
    Regulation (EEC) No 597/91 on urgent action for the supply of agricultural and
    medical products intended for the people of Romania and Bulgaria and amending
    Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2322/91 de la Commission, du 31 juillet 1991, fixant
    les modalités relatives à la deuxième livraison gratuite de viande bovine à
    la Bulgarie conformément au règlement (CEE) n° 597/91 du Conseil relatif à
    l'action d'urgence pour la fourniture gratuite de produits agricoles et médicaux
    destinés aux populations de Bulgarie et de Roumanie et modifiant le règlement
    (CEE) n° 569/88
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2322/91 der Kommission vom 31. Juli 1991 mit Durchführungsbestimmungen
    für die zweite kostenlose Lieferung von Rindfleisch nach Bulgarien gemäß der
    Verordnung (EWG) Nr. 597/91 des Rates über eine Dringlichkeitsmaßnahme zur Lieferung
    landwirtschaftlicher und medizinischer Erzeugnisse für die Bevölkerungen Rumäniens
    und Bulgariens sowie zur Änderung der Verordnung (EWG) Nr. 569/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2322/91 af 31. juli 1991 om gennemførelsesbestemmelser
    for anden gratis levering af oksekød til Bulgarien i henhold til Rådets forordning
    (EØF) nr. 597/91 om en hasteaktion vedrørende levering af landbrugsprodukter
    og medicinalvarer bestemt til befolkningerne i Rumænien og Bulgarien, og om ændring
    af forordning (EØF) nr. 569/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2322/91 της Επιτροπής
    της 31ης Ιουλίου 1991 που καθορίζει τις λεπτομέρειες
    σχετικά με τη δεύτερη δωρεάν παροχή βοείου
    κρέατος στη Βουλγαρία σύμφωνα με τον κανονισμό
    (ΕΟΚ) αριθ. 597/91 του Συμβουλίου σχετικά με την
    ανάληψη επείγουσας δράσης για την προμήθεια
    γεωργικών προϊόντων και ιατρικών ειδών που
    προορίζονται για τους πληθυσμούς της Ρουμανίας
    και της Βουλγαρίας και που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 569/88
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2322/91 della Commissione, del 31 luglio 1991, che
    stabilisce le modalità della seconda fornitura gratuita di carni bovine alla
    Bulgaria, ai sensi del regolamento (CEE) n. 597/91 del Consiglio relativo ad un'azione
    d'urgenza per la fornitura di prodotti agricoli e medicinali destinati alle popolazioni
    della Romania e della Bulgaria e che modifica il regolamento (CEE) n. 569/88
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2322/91 van de Commissie van 31 juli 1991 tot vaststelling
    van nadere bepalingen inzake de tweede kosteloze levering van rundvlees aan Bulgarije
    op grond van Verordening (EEG) nr. 597/91 van de Raad betreffende een noodmaatregel
    voor de levering van landbouw- en medische produkten, bestemd voor de bevolking
    van Roemenië en Bulgarije, en tot wijziging van Verordening (EEG) nr. 569/88
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2322/91 da Comissão, de 31 de Julho de 1991, que
    estabelece normas de execução para o segundo fornecimento gratuito de carne
    de bovino à Bulgária, tal como previsto no Regulamento (CEE) nº 597/91 do Conselho,
    relativo a uma acção de urgência para o fornecimento de produtos agrícolas
    e médicos, destinados às populações da Roménia e da Bulgária, e que altera
    o Regulamento (CEE) nº 569/88
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2322/91 de la Comisión, de 31 de julio de 1991, por
    el que se establecen las normas de desarrollo para la segunda operación de suministro
    gratuito de carne de vacuno a Bulgaria, de acuerdo con lo dispuesto en el Reglamento
    (CEE) nº 597/91 del Consejo relativo a una acción de urgencia para el suministro
    de productos agrarios y médicos destinados a las poblaciones de Rumanía y Bulgaria,
    y por el que se modifica el Reglamento (CEE) nº 569/88
