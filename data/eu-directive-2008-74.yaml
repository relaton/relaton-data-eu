    tüübikinnituste osas seoses väikeste sõiduautode ja kommertsveokite (Euro
    5 ja Euro 6) heitmetega ning sõidukite remondi- ja hooldusteabe kättesaadavusega
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2008/74/EY, annettu 18 päivänä heinäkuuta 2008
