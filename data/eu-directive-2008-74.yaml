title:
- language: en
  script: Latn
  content: Commission Directive 2008/74/EC of 18 July 2008 amending, as regards the
    type approval of motor vehicles with respect to emissions from light passenger
    and commercial vehicles (Euro 5 and Euro 6) and access to vehicle repair and maintenance
    information, Directive 2005/55/EC of the European Parliament and of the Council
    and Directive 2005/78/EC
  type: main
- language: fr
  script: Latn
  content: Directive 2008/74/CE de la Commission du 18 juillet 2008 modifiant, en
    ce qui concerne la réception des véhicules à moteur au regard des émissions
    des véhicules particuliers et utilitaires légers (Euro 5 et Euro 6) et aux informations
    sur la réparation et l'entretien des véhicules, la directive 2005/55/CE du Parlement
    européen et du Conseil et la directive 2005/78/CE
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/74/EG der Kommission vom 18. Juli 2008 zur Änderung der
    Richtlinie 2005/55/EG des Europäischen Parlaments und des Rates und der Richtlinie
    2005/78/EG in Bezug auf die Typgenehmigung von Kraftfahrzeugen hinsichtlich der
    Emissionen von leichten Personenkraftwagen und Nutzfahrzeugen (Euro 5 und Euro
    6) und des Zugangs zu Reparatur- und Wartungsinformationen für Fahrzeuge
  type: main
- language: bg
  script: Cyrl
  content: Директива 2008/74/ЕО на Комисията от 18 юли
    2008 година за изменение относно типовото одобрение
    на моторни превозни средства по отношение
    на емисиите от леки превозни средства за превоз
    на пътници и товари (Евро 5 и Евро 6) и достъпа
    до информация за ремонт и техническо обслужване
    на превозни средства, на Директива 2005/55/ЕО на
    Европейския парламент и на Съвета и на Директива
    2005/78/ЕО
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2008/74/ES ze dne 18. července 2008 , kterou se s ohledem
    na schvalování typu motorových vozidel z hlediska emisí z lehkých osobních
    vozidel a užitkových vozidel (Euro 5 a Euro 6) a z hlediska přístupu k informacím
    o opravách a údržbě vozidla mění směrnice Evropského parlamentu a Rady
    2005/55/ES a směrnice 2005/78/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2008/74/EF af 18. juli 2008 om ændring af Europa-Parlamentets
    og Rådets direktiv 2005/55/EF og af direktiv 2005/78/EF for så vidt angår typegodkendelse
    af motorkøretøjer med hensyn til emissioner fra lette personbiler og lette erhvervskøretøjer
    (Euro 5 og Euro 6) og adgang til reparations- og vedligeholdelsesinformationer
    om køretøjer
  type: main
- language: el
  script: Grek
  content: Οδηγία 2008/74/ΕΚ της Επιτροπής, της 18ης Ιουλίου
    2008 , για την τροποποίηση, σε σχέση με την έγκριση
    τύπου μηχανοκινήτων οχημάτων όσον αφορά εκπομπές
    από ελαφρά επιβατηγά και εμπορικά οχήματα
