    ja huoltamiseen tarvittavien tietojen saatavuutta koskevien säännösten osalta
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2008/74/EZ od 18. srpnja 2008. o izmjeni Direktive 2005/55/EZ
    Europskog parlamenta i Vijeća i Direktive 2005/78/EZ u odnosu na homologaciju
    tipa motornih vozila s obzirom na emisije iz lakih putničkih i gospodarskih vozila
    (Euro 5 i Euro 6), i dostupnost podataka za popravke i održavanje vozila
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2008/74/EK irányelve ( 2008. július 18.) a 2005/55/EK európai
    parlamenti és tanácsi irányelvnek és a 2005/78/EK irányelvnek a könnyű
    személygépjárművek és haszongépjárművek (Euro 5 és Euro 6) kibocsátás
    tekintetében történő típusjóváhagyása és a járműjavítási és -karbantartási
    információk elérhetősége tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2008/74/CE della Commissione, del 18 luglio 2008 , che modifica
    la direttiva 2005/55/CE del Parlamento europeo e del Consiglio e la direttiva
    2005/78/CE riguardo all’omologazione dei veicoli a motore rispetto alle emissioni
    dei veicoli passeggeri e commerciali leggeri (Euro 5 ed Euro 6) e alle informazioni
    sulla riparazione e la manutenzione dei veicoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2008/74/EK ( 2008. gada 18. jūlijs), ar ko groza
    Eiropas Parlamenta un Padomes Direktīvu 2005/55/EK un Direktīvu 2005/78/EK attiecībā
    uz tipa apstiprinājumu mehāniskiem transportlīdzekļiem attiecībā uz emisijām
    no vieglajiem pasažieru un komerciālajiem transportlīdzekļiem ( Euro 5 un
    Euro 6) un piekļuvi transportlīdzekļa remonta un tehniskās apkopes informācijai
  type: main
- language: lt
  script: Latn
  content: 2008 m. liepos 18 d. Komisijos direktyva 2008/74/EB, iš dalies keičianti
    Europos Parlamento ir Tarybos direktyvos 2005/55/EB ir Tarybos direktyvos 2005/78/EB
    nuostatas dėl variklinių transporto priemonių tipo patvirtinimo atsižvelgiant
    į išmetamųjų teršalų kiekį iš lengvųjų keleivinių ir komercinių transporto
    priemonių (Euro 5 ir Euro 6) ir dėl transporto priemonių remonto ir priežiūros
    informacijos prieigos
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2008/74/KE tat- 18 ta' Lulju 2008 li jemenda
    fir-rigward ta’ l-approvazzjoni tat-tip ta’ vetturi bil-mutur fir-rigward
    ta’ l-emissjonijiet ta’ vetturi ħfief għall-passiġġieri u ta’ vetturi
    kummerċjali (Euro 5 u Euro 6) u l-aċċess għal informazzjoni dwar it-tiswija
    u l-manutenzjoni tal-vetturi, id-Direttiva 2005/55/KE tal-Parlament Ewropew u
    tal-Kunsill u d-Direttiva 2005/78/KE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/74/EG van de Commissie van 18 juli 2008 tot wijziging, wat
    de typegoedkeuring van motorvoertuigen met betrekking tot emissies van lichte
    personen- en bedrijfsvoertuigen (Euro 5 en Euro 6) en de toegang tot reparatie-
    en onderhoudsinformatie betreft, van Richtlijn 2005/55/EG van het Europees Parlement
    en de Raad en van Richtlijn 2005/78/EG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji (WE) 2008/74/WE z dnia 18 lipca 2008 r. zmieniająca
    dyrektywę 2005/55/WE Parlamentu Europejskiego i Rady oraz dyrektywę 2005/78/WE
    w zakresie homologacji typu pojazdów silnikowych w odniesieniu do emisji zanieczyszczeń
    pochodzących z lekkich pojazdów pasażerskich i użytkowych (Euro 5 i Euro 6)
    oraz w zakresie dostępu do informacji dotyczących naprawy i utrzymania pojazdów
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/74/CE da Comissão, de 18 de Julho de 2008 , que altera
    a Directiva 2005/55/CE do Parlamento Europeu e do Conselho e a Directiva 2005/78/CE
    no que respeita à homologação de veículos a motor relativamente às emissões
    dos veículos ligeiros de passageiros e comerciais (Euro 5 e Euro 6) e ao acesso
    à informação relativa à reparação e manutenção de veículos
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/74/CE a Comisiei din 18 iulie 2008 de modificare privind
    omologarea de tip a autovehiculelor în ceea ce privește emisiile provenind de
    la vehiculele ușoare pentru pasageri și de la vehiculele ușoare comerciale
    (Euro 5 și Euro 6) și privind accesul la informațiile referitoare la repararea
    și întreținerea vehiculelor, a Directivei 2005/55/CE a Parlamentului European
    și a Consiliului și a Directivei 2005/78/CE
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2008/74/ES z 18. júla 2008 , ktorou sa vzhľadom na typové
    schvaľovanie motorových vozidiel so zreteľom na emisie ľahkých osobných
    a úžitkových vozidiel (Euro 5 a Euro 6) a prístup k informáciám o opravách
    a údržbe vozidiel mení a dopĺňa smernica Európskeho parlamentu a Rady 2005/55/ES
    a smernica 2005/78/ES
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2008/74/ES z dne 18. julija 2008 o spremembi Direktive
    2005/55/ES Evropskega parlamenta in Sveta ter Direktive 2005/78/ES v zvezi s homologacijo
    motornih vozil glede na emisije iz lahkih potniških in gospodarskih vozil (Euro
    5 in Euro 6) in dostopom do informacij o popravilu in vzdrževanju vozil
  type: main
- language: es
  script: Latn
  content: Directiva 2008/74/CE de la Comisión, de 18 de julio de 2008 , por la que
    se modifican, por lo que respecta a la homologación de los vehículos de motor
    por lo que se refiere a las emisiones procedentes de turismos y vehículos comerciales
    ligeros (Euro 5 y Euro 6) y el acceso a la información relativa a la reparación
