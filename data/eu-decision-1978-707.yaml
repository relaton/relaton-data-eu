title:
- language: en
  script: Latn
  content: '78/707/EEC: Commission Decision of 27 July 1978 amending Decision 78/360/EEC
    authorizing certain Member States to sell butter at a reduced price in the form
    of concentrated butter (Only the French, German, Dutch and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/707/CEE: Décision de la Commission, du 27 juillet 1978, modifiant
    la décision 78/360/CEE autorisant plusieurs États membres à vendre du beurre
    à prix réduit sous forme de beurre concentré (Les textes en langues française,
    allemande, néerlandaise et anglaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '78/707/EWG: Entscheidung der Kommission vom 27. Juli 1978 zur Änderung
    der Entscheidung 78/360/EWG zur Ermächtigung einiger Mitgliedstaaten, Butter
    in Form von Butterreinfett zu ermäßigten Preisen zu verkaufen (Nur der französische,
    deutsche, niederländische und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/707/EØF: Kommissionens beslutning af 27. juli 1978 om ændring af
    beslutning 78/360/EØF om bemyndigelse af flere medlemsstater til at sælge smør
    til nedsat pris i form af koncentreret smør (Kun de franske, tyske, nederlandske
    og engelske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '78/707/ΕΟΚ: Απόφαση της Επιτροπής, της 27ης
    Ιουλίου 1978, περί τροποποίησης της απόφασης
    78/360/ΕΟΚ με την οποία επιτρέπεται σε περισσότερα
    κράτη μέλη να πωλήσουν βούτυρο σε μειωμένη
    τιμή υπό τη μορφή συμπυκνωμένου βουτύρου (Τα
    κείμενα στη γαλλική, γερμανική, ολλανδική και
    αγγλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '78/707/CEE: Decisione della Commissione, del 27 luglio 1978, recante modifica
