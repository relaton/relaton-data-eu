    for producers of certain arable crops
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1664/93 de la Commission, du 29 juin 1993, établissant
    les informations à fournir par les États membres en ce qui concerne le régime
    de soutien aux producteurs de certaines cultures arables
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1664/93 der Kommission vom 29. Juni 1993 über die
