    που πρέπει να παρέχουν τα κράτη μέλη σχετικά
    με το καθεστώς στήριξης των παραγωγών ορισμένων
    αροτραίων καλλιεργειών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1664/93, annettu 29 päivänä kesäkuuta 1993,
