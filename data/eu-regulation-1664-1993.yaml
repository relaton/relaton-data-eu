    a favore dei coltivatori di taluni seminativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1664/93 van de Commissie van 29 juni 1993 tot vaststelling
    van de gegevens die door de Lid- Staten moeten worden verstrekt met betrekking
    tot de steunregeling voor producenten van bepaalde akkerbouwgewassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1664/93 da Comissão, de 29 de Junho de 1993, que
