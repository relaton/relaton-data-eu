  type: main
- language: fi
  script: Latn
  content: '2003/328/EY: Komission päätös, tehty 12 päivänä toukokuuta 2003,
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1774/2002 mukaisista siirtymäkauden
    toimenpiteistä, jotka koskevat luokkaan 3 kuuluvan ruokajätteen käyttöä sikojen
    ruokinnassa sekä lajinsisäistä kierrätyskieltoa syötettäessä käsiteltyä
