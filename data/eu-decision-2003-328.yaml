title:
- language: en
  script: Latn
  content: '2003/328/EC: Commission Decision of 12 May 2003 on transitional measures
    under Regulation (EC) No 1774/2002 of the European Parliament and of the Council
    as regards the use of category 3 catering waste in feed for pigs and the intra-species
    recycling ban on the feeding of swill to pigs (Text with EEA relevance) (notified
    under document number C(2003) 1502)'
  type: main
- language: fr
  script: Latn
  content: '2003/328/CE: Décision de la Commission du 12 mai 2003 portant mesures
    transitoires, en vertu du règlement (CE) n° 1774/2002 du Parlement européen
    et du Conseil, en ce qui concerne l''utilisation de déchets de cuisine et de
    table de catégorie 3 dans les aliments destinés aux porcs et l''interdiction
    de réutilisation au sein de l''espèce frappant l''utilisation d''eaux grasses
    pour l''alimentation des porcs (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2003) 1502]'
  type: main
- language: de
  script: Latn
  content: '2003/328/EG: Entscheidung der Kommission vom 12. Mai 2003 betreffend Übergangsmaßnahmen
    gemäß der Verordnung (EG) Nr. 1774/2002 des Europäischen Parlaments und des
    Rates hinsichtlich der Verwendung von Küchen- und Speiseabfällen der Kategorie
    3 in für Schweine bestimmten Futtermitteln sowie hinsichtlich des Verbots der
    Verwertung innerhalb derselben Tierart bei der Fütterung von Schweinen mit Spültrank
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2003)
    1502)'
  type: main
- language: da
  script: Latn
