title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1257/1999 of 17 May 1999 on support for rural
    development from the European Agricultural Guidance and Guarantee Fund (EAGGF)
    and amending and repealing certain Regulations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1257/1999 du Conseil du 17 mai 1999 concernant le soutien
    au développement rural par le Fonds européen d'orientation et de garantie agricole
    (FEOGA) et modifiant et abrogeant certains règlements
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1257/1999 des Rates vom 17. Mai 1999 über die Förderung
    der Entwicklung des ländlichen Raums durch den Europäischen Ausrichtungs- und
    Garantiefonds für die Landwirtschaft (EAGFL) und zur Änderung bzw. Aufhebung
    bestimmter Verordnungen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1257/1999 на Съвета от 17 май
    1999 година относно подпомагане на развитието
    на селските райони от Европейския фонд за ориентиране
    и гарантиране на земеделието (ФЕОГА) и за изменение
    и отмяна на някои регламенти
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1257/1999 ze dne 17. května 1999 o podpoře
    pro rozvoj venkova z Evropského zemědělského orientačního a záručního
    fondu (EZOZF) a o změně a zrušení některých nařízení
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1257/1999 af 17. maj 1999 om støtte til udvikling
    af landdistrikterne fra Den Europæiske Udviklings- og Garantifond for Landbruget
    (EUGFL) og om ændring og ophævelse af visse forordninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1257/1999 του Συμβουλίου
    της 17ης Μαΐου 1999 για τη στήριξη της αγροτικής
    ανάπτυξης από το Ευρωπαϊκό Γεωργικό Ταμείο
    Προσανατολισμού και Εγγυήσεων (ΕΓΤΠΕ) και για
    την τροποποίηση και κατάργηση ορισμένων κανονισμών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1257/1999, 17. mai 1999, Euroopa Põllumajanduse
    Arendus- ja Tagatisfondi (EAGGF) toetuse kohta maaelu arendamiseks ning teatavate
    määruste muutmise ja kehtetuks tunnistamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1257/1999, annettu 17 päivänä toukokuuta 1999,
    Euroopan maatalouden ohjaus- ja tukirahaston (EMOTR) tuesta maaseudun kehittämiseen
    ja tiettyjen asetusten muuttamisesta ja kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1257/1999 od 17. svibnja 1999. o potpori Europskog
    fonda za smjernice i jamstva u poljoprivredi (EFSJP) ruralnom razvoju kojom se
    izmjenjuju i stavljaju izvan snage određene uredbe
  type: main
- language: hu
  script: Latn
  content: A Tanács 1257/1999/EK rendelete (1999. május 17.) az Európai Mezőgazdasági
    Orientációs és Garanciaalapból (EMOGA) nyújtandó vidékfejlesztési támogatásról,
    valamint egyes rendeletek módosításáról, illetve hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1257/1999 del Consiglio del 17 maggio 1999 sul sostegno
    allo sviluppo rurale da parte del Fondo europeo agricolo di orientamento e di
    garanzia (FEAOG) e che modifica ed abroga taluni regolamenti
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1257/99 (1999. gada 17. maijs) par Eiropas Lauksaimniecības
    virzības un garantiju fonda (ELVGF) atbalstu lauku attīstībai un dažu regulu
    grozīšanu un atcelšanu
  type: main
- language: lt
  script: Latn
  content: 1999 m. gegužės 17 d. Tarybos reglamentas (EB) Nr. 1257/1999 dėl Europos
    žemės ūkio orientavimo ir garantijų fondo (EŽŪOGF) paramos kaimo plėtrai
    ir iš dalies pakeičiantis bei panaikinantis tam tikrus reglamentus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1257/1999 tas-17 ta’ Mejju 1999 dwar
    is-sostenn għal żvilupp rurali mill-Fond Agrikolu Ewropew għall-Gwida u Garanzija
    (FAEGG) u jemenda u jħassar ċerti Regolamenti.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1257/1999 van de Raad van 17 mei 1999 inzake steun
    voor plattelandsontwikkeling uit het Europees Oriëntatie- en Garantiefonds voor
    de Landbouw (EOGFL) en tot wijziging en instelling van een aantal verordeningen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1257/1999 z dnia 17 maja 1999 r. w sprawie
    wsparcia rozwoju obszarów wiejskich z Europejskiego Funduszu Orientacji i Gwarancji
    Rolnej (EFOGR) oraz zmieniające i uchylające niektóre rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1257/1999 do Conselho de 17 de Maio de 1999 relativo
    ao apoio do Fundo Europeu de Orientação e de Garantia Agrícola (FEOGA) ao desenvolvimento
    rural e que altera e revoga determinados regulamentos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) NR. 1257/1999 al Consiliului din 17 mai 1999 privind
    sprijinul pentru dezvoltare rurală acordat din Fondul European de Orientare și
    Garantare Agricolă (FEOGA) și de modificare și abrogare a unor regulamente
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1257/1999 zo 17. mája 1999 o podpore rozvoja
    vidieka z Európskeho poľnohospodárskeho usmerňovacieho a záručného fondu
    (EPUZF) a ktorým sa menia a rušia niektoré nariadenia
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1257/1999 z dne 17. maja 1999 o podpori za razvoj
    podeželja iz Evropskega kmetijskega usmerjevalnega in jamstvenega sklada (EKUJS)
    ter o spremembi in razveljavitvi določenih uredb
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1257/1999 del Consejo de 17 de mayo de 1999 sobre la
    ayuda al desarrollo rural a cargo del Fondo Europeo de Orientación y de Garantía
    Agrícola (FEOGA) y por el que se modifican y derogan determinados Reglamentos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1257/1999 av den 17 maj 1999 om stöd från
    Europeiska utvecklings- och garantifonden för jordbruket (EUGFJ) till utveckling
    av landsbygden och om ändring och upphävande av vissa förordningar
  type: main
