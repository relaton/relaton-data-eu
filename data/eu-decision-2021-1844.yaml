    institué par l’accord euro-méditerranéen établissant une association entre
    les Communautés européennes et leurs États membres, d’une part, et le Royaume
    hachémite de Jordanie, d’autre part, en ce qui concerne une modification du
    protocole no 3 dudit accord relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative
  type: main
