title:
- language: en
  script: Latn
  content: '2006/422/EC: Commission Decision of 19 June 2006 establishing that Article
    30(1) of Directive 2004/17/EC of the European Parliament and of the Council coordinating
    the procurement procedures of entities operating in the water, energy, transport
    and postal services sectors applies to the production and sale of electricity
    in Finland, excluding the Åland Islands (notified under document number C(2006)
    2337)'
  type: main
- language: fr
  script: Latn
  content: '2006/422/CE: Décision de la Commission du 19 juin 2006 établissant que
    l’article 30, paragraphe 1, de la directive 2004/17/CE du Parlement européen
    et du Conseil portant coordination des procédures de passation des marchés dans
    les secteurs de l’eau, de l’énergie, des transports et des services postaux
    s’applique à la production et à la vente d’électricité en Finlande, à
    l’exclusion des Îles Åland [notifiée sous le numéro C(2006) 2337]'
  type: main
- language: de
  script: Latn
