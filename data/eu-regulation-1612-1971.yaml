title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1612/71 de la Commission, du 26 juillet 1971, fixant,
    pour la campagne 1971/1972, les montants à prendre en considération pour l'ajustement
    des prélèvements à l'importation et des restitutions à l'exportation fixés
    à l'avance pour le riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1612/71 der Kommission vom 26. Juli 1971 zur Festsetzung
    der Beträge, die für das Wirtschaftsjahr 1971/1972 für die Berichtigung der
    im voraus festgesetzten Abschöpfungen bei der Einfuhr und der Erstattungen bei
    der Ausfuhr für Reis zu berücksichtigen sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1612/71 della Commissione, del 26 luglio 1971, che
    fissa, per la campagna 1971/1972, gli importi da prendere in considerazione per
    l'adeguamento dei prelievi all'importazione e delle restituzioni all'esportazione
    fissati in anticipo per il riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1612/71 van de Commissie van 26 juli 1971 tot vaststelling,
    voor het verkoopseizoen 1971/1972, der voor de aanpassing van de vooraf vastgestelde
    invoerheffingen en uitvoerrestituties voor rijst in aanmerking te nemen bedragen
  type: main
