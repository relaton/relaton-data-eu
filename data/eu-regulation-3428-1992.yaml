title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3428/92 of 27 November 1992 amending Regulation
    (EEC) No 641/86 laying down detailed rules for the application of the supplementary
    trade mechanism to importation into Portugal of the products processed from fruit
    and vegetables listed in Annex XXII to the Act of Accession
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3428/92 de la Commission, du 27 novembre 1992, modifiant
    le règlement (CEE) n° 641/86 déterminant les modalités d' application du mécanisme
    complémentaire aux échanges pour le secteur des produits transformés à base
    de fruits et légumes importés au Portugal visés à l' annexe XXII de l' acte
    d' adhésion
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3428/92 der Kommission vom 27. November 1992 zur Änderung
    der Verordnung (EWG) Nr. 641/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die in Anhang XXII der Beitrittsakte genannten, in Portugal
    eingeführten Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3428/92 af 27. november 1992 om ændring
    af forordning (EØF) nr. 641/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen for så vidt angår produkter forarbejdet på basis
    af frugt og grønsager, der indføres til Portugal og er omhandlet i bilag XXII
    til tiltrædelsesakten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3428/92 της Επιτροπής
    της 27ης Νοεμβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 641/86 σχετικά με τον καθορισμό
    των λεπτομερειών εφαρμογής του συμπληρωματικού
    μηχανισμού στις συναλλαγές για τα προϊόντα
    του τομέα μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά που εισάγονται στην Πορτογαλία,
    που αναφέρονται στο παράρτημα XXII της πράξης
    προσχώρησης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3428/92 della Commissione, del 27 novembre 1992, recante
    modifica del regolamento (CEE) n. 641/86 che fissa le modalità di applicazione
    del meccanismo complementare applicabile agli scambi per i prodotti del settore
    dei prodotti trasformati a base di ortofrutticoli importati in Portogallo che
    figurano nell' allegato XXII dell' atto di adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3428/92 van de Commissie van 27 november 1992 tot
    wijziging van Verordening (EEG) nr. 641/86 tot vaststelling van uitvoeringsbepalingen
    inzake de aanvullende regeling van het handelsverkeer voor de in bijlage XXII
    bij de Toetredingsakte genoemde produkten van de sector van op basis van groenten
    en fruit verwerkte produkten die in Portugal zijn ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3428/92 da Comissão, de 27 de Novembro de 1992,
    que altera o Regulamento (CEE) n° 641/86, que determina as regras de execução
    do mecanismo complementar às trocas comerciais para o sector dos produtos transformados
    à base de frutas e de produtos hortícolas importados em Portugal referidos no
    anexo XXII do Acto de Adesão
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3428/92 de la Comisión, de 27 de noviembre de 1992,
    que modifica el Reglamento (CEE) n° 641/86 por el que se determinan las modalidades
    de aplicación del mecanismo complementario de los intercambios para los productos
    del sector transformados a base de frutas y hortalizas importados de Portugal
    e incluidos en el Anexo XXII del Acta de adhesión
  type: main
