title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1114/80 of 6 May 1980 amending for the second
    time Regulation (EEC) No 2872/79 fixing an additional rate for determining the
    quantities of alcohol to be delivered for compulsory distillation for the 1979/80
    wine-growing year as regards the closing date for the lodging of applications
    for approval of delivery contracts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1114/80 de la Commission, du 6 mai 1980, portant deuxième
    modification du règlement (CEE) n° 2872/79 fixant un taux supplémentaire pour
    la détermination des quantités d' alcool à livrer dans le cadre des prestations
    viniques pour la campagne 1979/1980 en ce qui concerne la date limite pour l'
    introduction des demandes d' agrément des contrats de livraison
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1114/80 der Kommission vom 6. Mai 1980 zur zweiten
    Änderung der Verordnung (EWG) Nr. 2872/79 zur Festsetzung eines zusätzlichen
    Satzes für die Bestimmung der im Rahmen der obligatorischen Destillation zu liefernden
    Alkoholmenge für das Wirtschaftsjahr 1979/80 hinsichtlich der Frist für die
    Einreichung der Anträge auf Genehmigung der Lieferverträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1114/80 af 6. maj 1980 om anden ændring
    af forordning (EØF) nr. 2872/79 om fastsættelse af en tillægssats for fastlæggelse
    af de mængder alkohol, der skal indleveres inden for rammerne af de pligtige
    vinydelser for produktionsåret 1979/80, for så vidt angår sidste frist for
    indgivelse af ansøgninger om godkendelse af leveringskontrakter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1114/80 τής Επιτροπής
    τής 6ης Μαΐου 1980 περί δευτέρας τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 2872/79 πού καθορίζει
    συμπληρωματικό ποσοστό γιά τόν προσδιορισμό
    τών ποσοτήτων αλκοόλης πού θά παραδοθούν στό
    πλαίσιο οινικών παροχών γιά τήν περίοδο 1979/80
    όσον αφορά τήν οριακή ημερομηνία γιά τήν υποβολή
    αιτήσεων εγκρίσεως τών συμφωνητικών παραδόσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1114/80 della Commissione, del 6 maggio 1980, recante
    seconda modifica del regolamento (CEE) n. 2872/79, che fissa un tasso supplementare
    per la determinazione dei quantitativi di alcole da consegnare nel quadro delle
    prestazioni viniche per la campagna 1979-1980, per quanto riguarda la data limite
    per la presentazione delle domande d' approvazione di contratti di distillazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1114/80 van de Commissie van 6 mei 1980 houdende
    tweede wijziging van Verordening (EEG) nr. 2872/79 tot vaststelling van een extra
    percentage voor de bepaling van de in het kader van de verplichte distillatie
    voor het wijnoogstjaar 1979/1980 te leveren hoeveelheden alcohol, ten aanzien
    van de uiterste datum voor de indiening van de aanvragen om goedkeuring van leveringscontracten
  type: main
