  content: COMMISSION REGULATION (EEC) No 2904/93 of 20 October 1993 re-establishing
    the levying of customs duties on products of category 124 (order No 42.1240),
    01240), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
