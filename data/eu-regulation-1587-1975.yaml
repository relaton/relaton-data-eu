  content: Regulation (EEC) No 1587/75 of the Council of 24 June 1975 on the opening,
    allocation and administration of the Community tariff quota of 30 000 head of
    heifers and cows other than those intended for slaughter, of certain mountain
    breeds, falling within subheading ex 01.02 A II b) 2 of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1587/75 du Conseil, du 24 juin 1975, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de 30 000
    têtes de génisses et vaches, autres que celles destinées à la boucherie, de
    certaines races de montagne, de la sous- position EX 01.02 A II b) 2 du tarif
    douanier commun
  type: main
- language: de
  script: Latn
