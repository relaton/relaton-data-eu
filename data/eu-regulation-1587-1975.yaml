    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für 30 000 Stück
    Färsen und Kühe bestimmter Höhenrassen, nicht zum Schlachten, der Tarifstelle
    ex 01.02 A II b) 2 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1587/75 af 24. juni 1975 om åbning, fordeling
