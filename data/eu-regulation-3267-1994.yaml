title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3267/94 of 20 December 1994 amending for
    the fourth time Regulation (EEC) No 3900/92 laying down the special rules of application
    for the Community import arrangements for certain species of preserved tuna, bonito
    and sardines and fixing the quantities of those products which may be imported
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3267/94 de la Commission du 20 décembre 1994 modifiant
    pour la quatrième fois le règlement (CEE) n° 3900/92 établissant les modalités
    d'application particulières du régime communautaire d'importation de conserves
    de certaines espèces de thon, de bonites et de sardines et fixant les quantités
    de ces produits admises à l'importation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3267/94 DER KOMMISSION vom 20. Dezember 1994 zur vierten
    Änderung der Verordnung (EWG) Nr. 3900/92 mit besonderen Durchführungsbestimmungen
    zu der Einfuhrregelung für bestimmte Thunfisch-, Bonito- und Sardinenkonserven
    und zur Festsetzung der zugelassenen Einfuhrmengen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3267/94 af 20. december 1994 om fjerde
    ændring af forordning (EØF) nr. 3900/92 om særlige gennemførelsesbestemmelser
    for Fællesskabets importordning for konserves af visse arter af tunfisk, bonit
    og sardin og om fastsættelse af de mængder af samme produkter, der kan indføres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3267/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 20ής Δεκεμβρίου 1994 για τέταρτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 3900/93 για τη θέσπιση
    ειδικών λεπτομερειών εφαρμογής του κοινοτικού
    καθεστώτος εισαγωγής κονσερβών ορισμένων
    ειδών τόνου, παλαμίδας και σαρδέλας και για
    καθορισμό των ποσοτήτων αυτών των προϊόντων
    που εγκρίνονται για εισαγωγή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 3267/94, annettu 20 päivänä joulukuuta 1994,
    eräiden tonnikala-, boniitti- ja sardiinilajien säilykkeiden yhteisön tuontijärjestelmän
    soveltamisen yksityiskohtaisista erityissäännöistä sekä kyseisten tuotteiden
    sallituista tuontimääristä annetun asetuksen (ETY) N:o 3900/92 muuttamisesta
    neljännen kerran
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3267/94 DELLA COMMISSIONE del 20 dicembre 1994 recante
    questa modifica del regolamento (CEE) n. 3900/92 che stabilisce le modalità particolari
    di applicazione del regime comunitario di importazione per le conserve di talune
    specie di tonno, di palamita e di sardine e che fissa i quantitativi di tali prodotti
    ammessi all' importazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3267/94 VAN DE COMMISSIE van 20 december 1994 tot
    vierde wijziging van Verordening (EEG) nr. 3900/92 houdende uitvoeringsbepalingen
    van de communautaire invoerregeling voor conserven van bepaalde soorten tonijn,
    boniet en sardines, alsmede de hoeveelheden van deze produkten die mogen worden
    ingevoerd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3267/94 DA COMISSÃO de 20 de Dezembro de 1994 que
    altera pela quarta vez o Regulamento (CEE) nº 3900/92, que estabelece as normas
    de execução específicas do regime comunitário de importação de conservas
    de determinadas espécies de atum, de bonito e de sardinha e fixa as quantidades
    destes produtos admitidas para importação
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3267/94 DE LA COMISIÓN de 20 de diciembre de 1994
    por el que se modifica por cuarta vez el Reglamento (CEE) nº 3900/92 por el que
    se establecen las disposiciones especiales de aplicación del régimen comunitario
    de importación de conservas de determinadas especies de atún, bonito y sardinas
    y por el que se fijan las cantidades de estos productos que se admiten para importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 3267/94 av den 20 december 1994, om ändring
    för fjärde gången av förordning (EEG) nr 3900/92 om särskilda bestämmelser
    för tillämpningen av gemenskapens importordningar för vissa arter av konserverad
    tonfisk, bonit och sardiner och fastställande av vilka kvantiteter av dessa produkter
    som får importeras
  type: main
