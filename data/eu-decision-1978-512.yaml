type: standard
title:
- language: en
  script: Latn
  content: '78/512/EEC: Commission Decision of 24 May 1978 amending Decision 74/269/EEC
    authorizing certain Member States to make provisions which are more strict concerning
    the presence of ''Avena fatua'' in fodder plant and cereal seed (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/512/CEE: Décision de la Commission, du 24 mai 1978, modifiant la décision
    74/269/CEE autorisant certains États membres à prendre des dispositions plus
    strictes en ce qui concerne la présence d''"Avena fatua" dans les semences de
    plantes fourragères et de céréales (Le texte en langue anglaise est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '78/512/EWG: Entscheidung der Kommission vom 24. Mai 1978 zur Änderung
    der Entscheidung 74/269/EWG zur Ermächtigung einiger Mitgliedstaaten, bezüglich
    des Vorhandensseins von Avena fatua in Futterpflanzensaatgut und in Getreidesaatgut
    strengere Vorschriften zu erlassen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/512/EØF: Kommissionens beslutning af 24. maj 1978 om ændring af beslutning
    74/269/EØF om bemyndigelse af visse medlemsstater til at tage strengere forholdsregler
    i tilfælde af, at der findes "Avena fatua" i frø af foderplanter og i såsæd
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '78/512/ΕΟΚ : Απόφαση της Επιτροπής, της 24ης
    Μαΐου 1978, περί τροποποίησης της απόφασης 74/269/ΕΟΚ
    με την οποία επιτρέπεται σε ορισμένα κράτη
    μέλη να θεσπίσουν αυστηρότερες διατάξεις όσον
    αφορά την παρουσία «AVENA FATUA» στους σπόρους φυτών
    που προορίζονται για ζωοτροφές και δημητριακών
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '78/512/ETY: Komission päätös, tehty 24 päivänä toukokuuta 1978,
    luvan antamisesta tietyille jäsenvaltioille antaa tiukempia määräyksiä Avena
    fatuan esiintymisestä rehukasvien ja viljakasvien siemenissä tehdyn päätöksen
    74/269/ETY muuttamisesta (Ainoastaan englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '78/512/CEE: Decisione della Commissione, del 24 maggio 1978, che modifica
    la decisione 74/269/CEE che autorizza alcuni Stati membri a prendere disposizioni
    più restrittive per quanto riguarda la presenza di Avena fatua nelle sementi
    di piante foraggere e di cereali (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '78/512/EEG: Beschikking van de Commissie van 24 mei 1978 tot wijziging
    van Beschikking 74/269/EEG houdende machtiging voor bepaalde Lid-Staten om strengere
    maatregelen te nemen met betrekking tot de aanwezigheid van Avena fatua in zaaizaad
    van groenvoedergewassen en in zaaigranen (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '78/512/CEE: Decisão da Comissão, de 24 de Maio de 1978, que altera a
    Decisão 74/269/CEE que autoriza determinados Estados-membros a adoptar disposições
    mais restritivas no que respeita à presença de "Avena fatua" nas sementes de
    plantas forrageiras e de cereais (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '78/512/CEE: Decisión de la Comisión, de 24 de mayo de 1978, por la que
    se modifica la Decisión 74/269/CEE por la que se autoriza a determinados Estados
    miembros para que adopten disposiciones más estrictas en lo que se refiere a
    la presencia de "Avena fatua" en las semillas de plantas forrajeras y de cereales
    (El texto en lengua inglesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '78/512/EEG: Kommissionens beslut av den 24 maj 1978 om ändring av beslut
    74/269/EEG om tillstånd för vissa medlemsstater att anta strängare bestämmelser
    för flyghavre (Avena fatua) i utsäde av foderväxter och stråsäd (Endast den
    engelska texten är giltig)'
