id: EUDecision1979758
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/758/EEC: Commission Decision of 10 August 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s leather footwear, including boots, falling
    within heading No ex 64.02 of the Common Customs Tariff, originating in Romania
    and in free circulation in the other Member States (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/758/CEE: Décision de la Commission, du 10 août 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chaussures en cuir pour hommes, y compris
    les brodequins de la position ex 64.02 du tarif douanier commun originaires de
    Roumanie et mis en libre pratique dans les autres États membres (Les textes en
    langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/758/EWG: Entscheidung der Kommission vom 10. August 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schuhe aus Leder, für Männer, einschließlich
    große Schnürstiefel, der Tarifnummer ex 64.02 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/758/EØF: Kommissionens beslutning af 10. august 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage herrefodtøj af læder, herunder støvler,
    som henhører under pos. ex 64.02 i den fælles toldtarif har oprindelse i Rumænien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/758/CEE: Decisione della Commissione, del 10 agosto 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le calzature di cuoio per uomo e scarponi
    comuni, della voce ex 64.02 della tariffa doganale comune, originari della Romania
    e messi in libera pratica negli altri Stati membri (I testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/758/EEG: Beschikking van de Commissie van 10 augustus 1979 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd schoeisel van leder voor heren (daaronder werkschoenen), van
    post ex 64.02 van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
  type: main
