title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2571/95 of 31 October 1995 fixing the intervention
    price of olive oil for the 1995/96 marketing year at a reduced level to take account
    of the overrun of the maximum guaranteed quantity during the 1993/94 and 1994/95
    marketing years
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2571/95 de la Commission, du 31 octobre 1995, déterminant
    le prix d'intervention de l'huile d'olive pour la campagne de commercialisation
    1995/1996 réduit en conséquence du dépassement de la quantité maximale garantie
    pendant les campagnes de commercialisation 1993/1994 et 1994/1995
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2571/95 der Kommission vom 31. Oktober 1995 zur Änderung
    des Interventionspreises von Olivenöl für das Wirtschaftsjahr 1995/96, der wegen
    Überschreitung der Höchstgarantiemenge in den Wirtschaftsjahren 1993/94 und
    1994/95 zu senken ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2571/95 af 31. oktober 1995 om fastsættelse
    af interventionsprisen for olivenolie for produktionsåret 1995/96, der nedsættes
    som følge af overskridelsen af den maksimale garantimængde i produktionsårene
    1993/94 og 1994/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2571/95 της Επιτροπής
    της 31ης Οκτωβρίου 1995 για τον καθορισμό της
    τιμής παρέμβασης του ελαιολάδου για την περίοδο
    εμπορίας 1995/96 που μειώθηκε λόγω της υπέρβασης
    της μέγιστης εγγυημένης ποσότητας κατά τη
    διάρκεια των περιόδων 1993/94 και 1994/95
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2571/95, annettu 31 päivänä lokakuuta 1995,
    oliiviöljyn interventiohinnan vahvistamisesta markkinointivuodeksi 1995/96 alennetulle
    tasolle markkinointivuosien 1993/94 ja 1994/95 aikana tapahtuneen taatun enimmäismäärän
    ylityksen seurauksena
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2571/95 della Commissione, del 31 ottobre 1995, che
    stabilisce il prezzo d'intervento dell'olio d'oliva, per la campagna di commercializzazione
    1995/96, ridotto a seguito del superamento del quantitativo massimo garantito
    nel corso delle campagne di commercializzazione 1993/94 e 1994/95
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2571/95 van de Commissie van 31 oktober 1995 tot vaststelling
    voor het verkoopseizoen 1995/1996 van de interventieprijs voor olijfolie, verlaagd
    als gevolg van de overschrijding van de gegarandeerde maximumhoeveelheid in de
    verkoopseizoenen 1993/1994 en 1994/1995
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2571/95 da Comissão, de 31 de Outubro de 1995, que
