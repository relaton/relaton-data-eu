    da superação da quantidade máxima garantida durante as campanhas de comercialização
    de 1993/1994 e 1994/1995
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2571/95 de la Comisión, de 31 de octubre de 1995,
