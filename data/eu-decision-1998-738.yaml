title:
- language: en
  script: Latn
  content: '98/738/EC: Commission Decision of 9 December 1998 amending Decision 95/506/EC
    authorising Member States temporarily to take additional measures against the
    dissemination of Pseudomonas solanacearum (Smith) Smith as regards the Kingdom
    of the Netherlands (notified under document number C(1998) 3944)'
  type: main
- language: fr
  script: Latn
  content: '98/738/CE: Décision de la Commission du 9 décembre 1998 modifiant la
    décision 95/506/CE autorisant les États membres à prendre provisoirement des
    mesures supplémentaires en vue de se protéger contre la propagation de Pseudomonas
    solanacearum (Smith) Smith en provenance du royaume des Pays-Bas [notifiée sous
    le numéro C(1998) 3944]'
  type: main
- language: de
  script: Latn
  content: '98/738/EG: Entscheidung der Kommission vom 9. Dezember 1998 zur Änderung
    der Entscheidung 95/506/EG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    zusätzliche Maßnahmen gegen die Verbreitung von Pseudomonas solanacearum (Smith)
    Smith gegenüber dem Königreich der Niederlande zu treffen (Bekanntgegeben unter
    Aktenzeichen K(1998) 3944)'
  type: main
- language: da
  script: Latn
  content: '98/738/EF: Kommissionens beslutning af 9. december 1998 om ændring af
    beslutning 95/506/EF om bemyndigelse af medlemsstaterne til midlertidigt at træffe
    supplerende foranstaltninger mod spredning af Pseudomonas solanacearum (Smith)
    Smith, for så vidt angår Kongeriget Nederlandene (meddelt under nummer K(1998)
    3944)'
  type: main
- language: el
  script: Grek
  content: '98/738/ΕΚ: Απόφαση της Επιτροπής της 9ης Δεκεμβρίου
    1998 για τροποποίηση της απόφασης 95/506/ΕΚ η οποία
    επιτρέπει προσωρινά στα κράτη μέλη να λάβουν
    πρόσθετα μέτρα κατά της εξάπλωσης της Pseudomonas
    solanacearum (Smith) Smith όσον αφορά το Βασίλειο των Κάτω
    Χωρών [κοινοποιηθείσα υπό τον αριθμό Ε(1998) 3944]'
  type: main
- language: fi
  script: Latn
  content: '98/738/EY: Komission päätös, tehty 9 päivänä joulukuuta 1998, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti Alankomaiden kuningaskuntaa
    koskevia lisätoimenpiteitä Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan
    leviämisen estämiseksi tehdyn päätöksen 95/506/EY muuttamisesta (tiedoksiannettu
    numerolla K(1998) 3944)'
  type: main
- language: it
  script: Latn
  content: '98/738/CE: Decisione della Commissione del 9 dicembre 1998 recante modifica
    della decisione 95/506/CE che autorizza gli Stati membri ad adottare, a titolo
    provvisorio, misure supplementari contro la propagazione dello Pseudomonas solanacearum
    (Smith) Smith relativamente al Regno dei Paesi Bassi [notificata con il numero
    C(1998) 3944]'
  type: main
- language: nl
  script: Latn
  content: '98/738/EG: Beschikking van de Commissie van 9 december 1998 houdende wijziging
    van Beschikking 95/506/EG tot machtiging van bepaalde lidstaten om ten aanzien
    van het Koninkrijk der Nederlanden tijdelijk aanvullende maatregelen te nemen
    tegen de verspreiding van Pseudomonas solanacearum (Smith) Smith (kennisgeving
    geschied onder nummer C(1998) 3944)'
  type: main
- language: pt
  script: Latn
  content: '98/738/CE: Decisão da Comissão de 9 de Dezembro de 1998 que altera a
    Decisão 95/506/CE que autoriza os Estados-membros a adoptar provisoriamente medidas
    adicionais contra a propagação de Pseudomonas solanacearum (Smith) Smith proveniente
    do reino dos Países Baixos [notificada com o número C(1998) 3944]'
  type: main
- language: es
  script: Latn
  content: '98/738/CE: Decisión de la Comisión de 9 de diciembre de 1998 que modifica
    la Decisión 95/506/CE por la que se autoriza a los Estados miembros para adoptar
    temporalmente, en lo que respecta al Reino de los Países Bajos, medidas complementarias
    contra la propagación de Pseudomonas solanacearum (Smith) Smith [notificada con
    el número C(1998) 3944]'
  type: main
- language: sv
  script: Latn
  content: '98/738/EG: Kommissionens beslut av den 9 december 1998 om ändring av
    beslut 95/506/EG om tillstånd för medlemsstaterna att tillfälligt vidta tilläggsåtgärder
    för att förhindra spridning av Pseudomonas solanacearum (Smith) Smith från
    Nederländerna [delgivet med nr K(1998) 3944]'
