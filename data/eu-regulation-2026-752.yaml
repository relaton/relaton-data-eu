    verarbeitet, Lysat von Willaertia magna, Magnesiumhydroxid (E 528), Onobrychis
    viciifolia (Saat-Esparsette) in Form von getrockneten Pellets und Extrakt aus
    Kernen von Vitis vinifera L. (Traubenkernextrakt) in oder auf bestimmten Erzeugnissen
  type: main
