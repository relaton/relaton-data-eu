title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2026/752 of 31 March 2026 amending Annex IV
    to Regulation (EC) No 396/2005 of the European Parliament and of the Council as
    regards maximum residue levels for Allium fistulosum, processed; lysate of Willaertia
    magna; magnesium hydroxide E528; Onobrychis viciifolia (sainfoin) dried pellets
    and Vitis vinifera L. seed extract (grape seed extract) in or on certain products
  type: main
- language: fr
  script: Latn
