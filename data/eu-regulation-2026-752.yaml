    IV du règlement (CE) no 396/2005 du Parlement européen et du Conseil en ce qui
    concerne les limites maximales applicables aux résidus des substances Allium
    fistulosum, transformé; lysat de Willaertia magna; hydroxyde de magnésium E528;
    granulés déshydratés d’Onobrychis viciifolia (sainfoin) et extrait de pépins
    de Vitis vinifera L. (extrait de pépins de raisin) présentes dans ou sur certains
    produits
  type: main
