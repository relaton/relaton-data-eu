    Willaertia magna lizato, magnio hidroksido E528, sėjamųjų esparcetų (Onobrychis
    viciifolia) džiovintų granulių ir vyninių vynuogių (Vitis vinifera L.) kauliukų
    ekstrakto liekanų koncentracijos tam tikruose produktuose arba ant jų iš dalies
