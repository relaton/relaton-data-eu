    ostankov za Allium fistulosum, obdelan, lizat iz Willaertia magna, magnezijev
    hidroksid E528, sušene pelete rastline Onobrychis viciifolia (navadna turška
    detelja) in ekstrakt iz pešk Vitis vinifera L. (ekstrakt iz grozdnih pešk) v
