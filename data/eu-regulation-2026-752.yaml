    maximálne hladiny rezíduí Allium fistulosum, spracovaného; lyzátu z druhu
    Willaertia magna; hydroxidu horečnatého E 528; sušených peliet z Onobrychis
    viciifolia (vičenca vikolistého) a extraktu zo semien Vitis vinifera L. (extraktu
    z hroznových semien) v určitých produktoch alebo na nich
  type: main
- language: sl
