title:
- language: en
  script: Latn
  content: '83/78/EEC: Third Commission Decision of 10 February 1983 authorizing certain
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of oak wood originating in the United States of America (Only
    the French, Danish, German, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/78/CEE: Troisième décision de la Commission du 10 février 1983 autorisant
    certains Etats membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour le bois de chêne originaire des Etats-Unis
    d''Amérique (Les textes en langues française, danoise, allemande, italienne
    et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/78/EWG: Dritte Entscheidung der Kommission vom 10. Februar 1983 zur
    Ermächtigung bestimmter Mitgliedstaaten, für Eichenholz mit Ursprung in den
    Vereinigten Staaten von Amerika, Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates vorzusehen (Nur der französische, dänische, deutsche, italienische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/78/EØF: Kommissionens tredje beslutning af 10. februar 1983 om bemyndigelse
    af visse medlemsstater til at undtage egetræ med oprindelse i USA fra visse bestemmelser
    i Rådets direktiv 77/93/EØF (Kun den franske, danske, tyske, italienske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/78/ΕΟΚ: Τρίτη Απόφαση της Επιτροπής της
    10ης Φεβρουαρίου 1983 για παροχή άδειας σε ορισμένα
    Κράτη μέλη να προβλέπουν παρεκκλίσεις από
    ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ του
    Συμβουλίου όσον αφορά το ξύλο βελανιδιάς καταγωγής
    Ηνωμένων Πολιτειών Αμερικής (Τα κείμενα στην
    γαλλική, δανική, γερμανική, ιταλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '83/78/CEE: Terza decisione della Commissione del 10 febbraio 1983 che
    autorizza taluni Stati membri a prevedere deroghe a determinate disposizioni della
    direttiva 77/93/CEE del Consiglio per il legname di quercia originario degli Stati
    Uniti d''America (I testi in lingua francese, danese, tedesca, italiana e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '83/78/EEG: Derde Beschikking van de Commissie van 10 februari 1983 houdende
    machtiging van bepaalde Lid- Staten om afwijkingen van sommige bepalingen van
    Richtlijn 77/93/EEG van de Raad toe te staan voor eikehout van oorsprong uit de
    Verenigde Staten van Amerika (Slechts de teksten in de Franse, Deense, Duitse,
    Italiaanse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '83/78/CEE: Terceira Decisão da Comissão, de 10 de Fevereiro de 1983,
