title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3035/78 of 21 December 1978 re-establishing
    the levying of customs duties on sewing machines, falling within subheading 84.41
    A I b) and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3035/78 de la Commission, du 21 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à coudre, de la sous-position tarifaire 84.41 A I b), originaires des pays en
    voie de développement bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3035/78 der Kommission vom 21. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Nähmaschinen der Tarifstelle 84.41 A I b) mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3035/78 af 21. december 1978 om genindførelse
    af opkrævning af toldafgifter for symaskiner, under underposition 81.41 A I b),
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3035/78 della Commissione, del 21 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine per cucire
    della sottovoce doganale 84.41 A I b), originarie dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3035/78 van de Commissie van 21 december 1978 houdende
    wederinstelling van de heffing van de douanerechten voor naaimachines, van post
    84.41 A I b), van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
