id: EURegulation23501978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2350/78 of 9 October 1978 re-establishing
    the levying of customs duties on nets and netting made of twine, cordage or rope,
    etc., falling within heading No 59.05, originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 1197/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2350/78 de la Commission, du 9 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    fabriqués à l'aide des matières reprises au n° 59.04, en nappes, en pièces,
    etc., de la position 59.05 du tarif douanier commun, originaires de Corée du
    Sud, bénéficiaire des préférences tarifaires prévues par le règlement (CEE)
    n° 1197/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2350/78 der Kommission vom 9. Oktober 1978 über die
    Wiedereinführung des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in
    Stücken, als Meterware oder abgepaßt; abgepaßte Fischernetze aus Garnen, Bindfäden
    oder Seilen, der Tarifnummer 59.05, mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2350/78 af 9. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    også i tilskårne stykker eller konfektionerede, etc., under position 59.05,
    som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2350/78 della Commissione, del 9 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle reti, ottenute con
    l'impiego di manufatti previsti dalla voce 59.04, in strisce, in pezza, ecc.,
    della voce doganale 59.05, originarie della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2350/78 van de Commissie van 9 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, aan het stuk of in
    bepaalde vorm; visvangnetten van garen, van bindgaren of van touw van post 59.05,
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 1197/78 van de Raad
  type: main
