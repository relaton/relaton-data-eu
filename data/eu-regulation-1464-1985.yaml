  content: Commission Regulation (EEC) No 1464/85 of 31 May 1985 correcting Regulation
    (EEC) No 1367/85 as regards the arrangements to apply monetary compensatory amounts
    from 27 May 1985 to intervention butter sold at reduced prices
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1464/85 de la Commission du 31 mai 1985 rectifiant
    le règlement (CEE) no 1367/85 en ce qui concerne les dispositions d' application
    des montants compensatoires monétaires à partir du 27 mai 1985 pour le beurre
    d' intervention vendu à prix réduit
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1464/85 der Kommission vom 31. Mai 1985 zur Berichtigung
    der Verordnung (EWG) Nr. 1367/85 hinsichtlich der Durchführungsbestimmungen für
    die Währungsausgleichsbeträge ab dem 27. Mai 1985 für verbilligte Butter, die
    aus Interventionsbeständen stammt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1464/85 af 31. maj 1985 om berigtigelse
    af forordning (EØF) nr. 1367/85 for så vidt angår gennemførelsesbestemmelserne
    for de monetære udligningsbeløb fra den 27. maj 1985 for smør, der er omfattet
    af intervention, og som sælges til nedsat pris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1464/85 της Επιτροπής
