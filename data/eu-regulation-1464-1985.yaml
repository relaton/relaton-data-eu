    (ΕΟΚ) αριθ. 1367/85 όσον αφορά τις διατάξεις εφαρμογής
    των νομισματικών εξισωτικών ποσών από τις
    27 Μαΐου 1985 για το βούτυρο παρεμβάσεως που πωλείται
    σε μειωμένη τιμή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1464/85 della Commissione del 31 maggio 1985 che rettifica
    il regolamento (CEE) n. 1367/85 per quanto concerne le disposizioni di applicazione
    degli importi compensativi monetari a decorrere dal 27 maggio 1985 per il burro
    d' intervento venduto a prezzo ridotto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1464/85 van de Commissie van 31 mei 1985 houdende
