title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1306/83 of 25 May 1983 re-establishing the
    levying of customs duties on articles of apparel, gloves and other clothing accessories
    falling within subheadings 42.03 A, B II and III and C and originating in Uruguay,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1306/83 de la Commission du 25 mai 1983 portant rétablissement
    de la perception des droits de douane applicables aux vêtements, gants et autres
    accessoires du vêtement, des sous-positions 42.03 A, B II, B III et C du tarif
    douanier commun, originaires de l' Uruguay, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1306/83 der Kommission vom 25. Mai 1983 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung, Handschuhe und anderes Bekleidungszubehör
    der Tarifstellen 42.03 A, B II, B III und C, mit Ursprung in Uruguay, dem die
    in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1306/83 af 25. maj 1983 om genindførelse
    af opkrævning af told for beklædningsgenstande, handsker og tilbehør til beklædningsgenstande,
    henhørende under pos. 42.03 A, B II og III og C, og med oprindelse i Uruguay,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1306/83 της Επιτροπής
    της 25ης Μαΐου 1983 περί αποκαταστάσεως της εφαρμογής
    των δασμών για ενδύματα, χειρόκτια και έτερα
    συμπληρώματα της ενδύσεως των διακρίσεων 42.03
    Α, Β ΙΙ, ΙΙΙ και Γ του Κοινού Δασμολογίου, καταγωγής
    Ουρουγουάης, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1306/83 della Commissione del 25 maggio 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli oggetti di vestiario, guanti
    e altri accessori per oggetti di vestiario, delle sottovoci 42.03 A, B II e III
    e C della tariffa doganale comune, originari dell' Uruguay beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1306/83 van de Commissie van 25 mei 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding, handschoenen
    en ander kledingtoebehoren van postonderverdelingen 42.03 A, B II, B III en C,
    van oorsprong uit Uruguay, waarvoor de in Verordening (EEG) nr. 3377/82 van de
    Raad vermelde tariefpreferenties zijn verleend
  type: main
