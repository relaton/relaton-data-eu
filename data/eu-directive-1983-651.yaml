title:
- language: en
  script: Latn
  content: Council Directive 83/651/EEC of 22 December 1983 prolonging the derogation
    accorded to Ireland relating to the rules governing turnover tax and excise duty
    applicable in international travel
  type: main
- language: fr
  script: Latn
  content: Directive 83/651/CEE du Conseil du 22 décembre 1983 prorogeant la dérogation
    accordée à l'Irlande en matière de taxes sur le chiffre d'affaires et des accises
    applicables dans le trafic international de voyageurs
  type: main
- language: de
  script: Latn
  content: Richtlinie 83/651/EWG des Rates vom 22. Dezember 1983 zur Verlängerung
    der Irland gewährten Abweichung von der im grenzüberschreitenden Reiseverkehr
    geltenden Regelung für die Umsatzsteuern und Sonderverbrauchsteuern
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 83/651/EØF af 22. december 1983 om forlængelse af den
    undtagelse, der er indrømmet Irland i ordningen vedrørende omsætningsafgifter
    og punktafgifter i den internationale rejsetrafik
  type: main
- language: el
  script: Grek
  content: Οδηγία 83/651/ΕΟΚ του Συμβουλίου της 22ας Δεκεμβρίου
    1983 για την παράταση της παρέκκλισης που χορηγείται
    στην Ιρλανδία όσον αφορά τους φόρους κύκλου
    εργασιών και τους ειδικούς φόρους κατανάλωσης
    που εφαρμόζονται κατά τη διεθνή κυκλοφορία
    των ταξιδιωτών
  type: main
- language: it
  script: Latn
  content: Direttiva 83/651/CEE del Consiglio del 22 dicembre 1983 che proroga la
    deroga accordata all'Irlanda relativamente al regime delle imposte sulla cifra
    d'affari e delle altre imposizioni indirette applicabili al traffico internazionale
    di viaggiatori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 83/651/EEG van de Raad van 22 december 1983 tot verlenging van
    de aan Ierland toegestane afwijking betreffende de in het internationaal reizigersverkeer
    voor de omzetbelastingen en accijnzen geldende regeling
  type: main
- language: pt
  script: Latn
  content: Directiva 83/651/CEE do Conselho, de 22 de Dezembro de 1983, que prorroga
    a derrogação concedida à Irlanda em matéria de impostos sobre o volume de
    negócios e dos impostos sobre consumos específicos aplicáveis no tráfego internacional
    de viajantes
  type: main
- language: es
  script: Latn
  content: Directiva 83/651/CEE del Consejo, de 22 de diciembre de 1983, por la que
    se prorroga la excepción concedida a Irlanda en materia de impuestos sobre el
    volumen de negocios y de impuestos sobre consumos específicos aplicables en el
    tráfico internacional de viajeros
  type: main
