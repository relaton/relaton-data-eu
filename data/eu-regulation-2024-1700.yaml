    por el que se completa el Reglamento (UE) 2017/2402 del Parlamento Europeo y del
    Consejo respecto a las normas técnicas de regulación que especifican, para las
    titulizaciones tradicionales no ABCP simples, transparentes y normalizadas y las
    titulizaciones de balance simples, transparentes y normalizadas, el contenido,
    las metodologías y las modalidades de presentación de la información relativa
    a las principales incidencias adversas de los activos financiados por exposiciones
