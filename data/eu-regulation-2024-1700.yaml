  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/1700 av den 5 mars 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/2402
    vad gäller tekniska tillsynsstandarder som, för enkel, transparent och standardiserad
    traditionell icke-ABCP-värdepapperisering och enkel, transparent och standardiserad
    värdepapperisering i balansräkningen, specificerar innehållet i, metoderna
    för och presentationen av information om de huvudsakliga negativa konsekvenserna
    för hållbarhetsfaktorer av de tillgångar som finansieras av de underliggande
    exponeringarna
