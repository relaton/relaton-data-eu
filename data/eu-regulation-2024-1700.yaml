    ide o regulačné technické predpisy, v ktorých sa pre jednoduchú, transparentnú
    a štandardizovanú tradičnú sekuritizáciu inú ako ABCP a pre jednoduchú,
    transparentnú a štandardizovanú súvahovú sekuritizáciu spresňuje obsah,
    metodiky a prezentácia informácií týkajúcich sa hlavných nepriaznivých
    vplyvov aktív financovaných podkladovými expozíciami na faktory udržateľnosti
  type: main
