    Uredbe (EU) 2017/2402 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki za enostavno, pregledno in standardizirano tradicionalno listinjenje,
    ki ni tradicionalno listinjenje ABCP, ter za enostavno, pregledno in standardizirano
