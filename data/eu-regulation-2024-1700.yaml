    teknisillä sääntelystandardeilla, joissa täsmennetään arvopaperistetuilla
    vastuilla rahoitettujen omaisuuserien kestävyystekijöihin kohdistuvia pääasiallisia
    haitallisia vaikutuksia koskevien tietojen sisältö, menetelmät ja esitystapa
    muiden kuin ABCP-liiketoimien yksinkertaiselle, läpinäkyvälle ja standardoidulle
    arvopaperistamiselle sekä taseen yksinkertaiselle, läpinäkyvälle ja standardoidulle
    arvopaperistamiselle
  type: main
