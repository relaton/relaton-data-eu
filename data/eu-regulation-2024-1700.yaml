title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/1700 of 5 March 2024 supplementing
    Regulation (EU) 2017/2402 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying, for simple, transparent and standardised
    non-ABCP traditional securitisation, and for simple, transparent and standardised
    on-balance-sheet securitisation, the content, methodologies and presentation of
    information related to the principal adverse impacts of the assets financed by
    the underlying exposures on sustainability factors
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/1700 de la Commission du 5 mars 2024 complétant
    le règlement (UE) 2017/2402 du Parlement européen et du Conseil par des normes
    techniques de réglementation détaillant, pour les titrisations simples, transparentes
    et standardisées classiques autres qu’ABCP, et pour les titrisations simples,
    transparentes et standardisées inscrites au bilan, le contenu, les méthodes
    et la présentation des informations relatives aux principales incidences négatives
    des actifs financés par les expositions sous-jacentes sur les facteurs de durabilité
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/1700 der Kommission vom 5. März 2024 zur
    Ergänzung der Verordnung (EU) 2017/2402 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung des Inhalts, der
    Methoden und der Darstellung von Informationen im Zusammenhang mit den wichtigsten
    nachteiligen Auswirkungen der durch die zugrunde liegenden Risikopositionen von
    einfachen, transparenten und standardisierten traditionellen Nicht-ABCP-Verbriefungen
    und von einfachen, transparenten und standardisierten Bilanzverbriefungen finanzierten
    Vermögenswerte auf Nachhaltigkeitsfaktoren
  type: main
- language: bg
  script: Cyrl
