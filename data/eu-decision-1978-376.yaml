---
id: EUDecision1978376
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 March 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to suits (including coordinate suits) for men and boys, of
    wool, cotton or of man-made textile fibres, falling within heading No ex 61.01
    of the Common Customs Tariff, originating in Taiwan and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/376/CEE: Décision de la Commission, du 2 mars 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les costumes et complets tissés pour hommes
    et garçonnets, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position Ex 61.01 du Tarif douanier commun, originaires de Taiwan et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. März 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Anzüge und Kombinationen für Männer und Knaben, aus Wolle, aus
    Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen der Tarifnummer
    ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 2. marts 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage jakkesæt, vævede til mænd og drenge (herunder sæt, der består
    af to eller tre stykker) af uld, bomuld eller kemofibre, som henhører under pos.
    ex 61.01 i den fælles toldtarif, har oprindelse i Taiwan, og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 marzo 1978, che autorizza il Regno del
    Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i vestiti completi per uomo o per ragazzo di lana,
    di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.01 della
    tariffa doganale comune, originari di Taiwan e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 maart 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    kostuums, geweven voor heren en jongens, van wol, van katoen, of van synthetische
    of van kunstmatige textielvezels van post ex 61.01 van het gemeenschappelijk douanetarief,
    van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
