  content: Règlement (CEE) n° 95/71 de la Commission, du 18 janvier 1971, abrogeant
    le règlement (CEE) n° 1667/69 relatif à certaines mesures à prendre dans le
    secteur du lait et des produits laitiers à la suite de la dévaluation du franc
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 95/71 der Kommission vom 18. Januar 1971 zur Aufhebung
    der Verordnung (EWG) Nr. 1667/69 betreffend bestimmte Maßnahmen auf dem Sektor
    Milch und Milcherzeugnisse infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 95/71 della Commissione, del 18 gennaio 1971, che
    abroga il regolamento (CEE) n. 1667/69 relativo a talune misure da applicare nel
    settore del latte e dei prodotti lattiero-caseari in seguito alla svalutazione
    del franco francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 95/71 van de Commissie van 18 januari 1971 tot opheffing
    van Verordening (EEG) nr. 1667/69 betreffende ingevolge de devaluatie van de Franse
    frank in de sector melk en zuivelprodukten te nemen maatregelen
