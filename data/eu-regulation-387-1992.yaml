    2539/84 of beef held by certain intervention agencies and intended for export
    to the Soviet Union, implementing Council Regulation (EEC) No 599/91 and amending
    Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 387/92 de la Commission du 18 février 1992 abrogeant
    le règlement (CEE) n° 3754/91 relatif à la vente, dans le cadre de la procédure
