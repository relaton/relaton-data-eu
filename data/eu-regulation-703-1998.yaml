title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 703/98 of 17 March 1998 suspending certain concessions
    set out in Regulation (EC) No 3066/95 establishing certain concessions in the
    form of Community tariff quotas for certain agricultural products and providing
    for the adjustment, as an autonomous and transitional measure, of certain agricultural
    concessions provided for in the Europe Agreements to take account of the Agreement
    on agriculture concluded during the Uruguay Round multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 703/98 du Conseil du 17 mars 1998 portant suspension
    de certaines des concessions prévues par le règlement (CE) nº 3066/95 établissant
    certaines concessions sous forme de contingents tarifaires communautaires pour
    certains produits agricoles et prévoyant une adaptation autonome et transitoire
    de certaines concessions agricoles prévues par les accords européens afin de
    tenir compte de l'accord sur l'agriculture conclu dans le cadre des négociations
    commerciales multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 703/98 des Rates vom 17. März 1998 zur Aussetzung
    bestimmter Zugeständnisse gemäß der Verordnung (EG) Nr. 3066/95 über Zugeständnisse
    in Form von gemeinschaftlichen Zollkontingenten für bestimmte landwirtschaftliche
    Erzeugnisse und zur autonomen und befristeten Anpassung bestimmter in den Europa-Abkommen
    vorgesehener Zugeständnisse für landwirtschaftliche Erzeugnisse, um dem im Rahmen
    der multilateralen Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkommen
    über die Landwirtschaft Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 703/98 af 17. marts 1998 om suspension af visse
