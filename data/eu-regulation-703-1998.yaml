    i form af EF-toldkontingenter for en række landbrugsprodukter og om autonom og
    midlertidig tilpasning af visse landbrugsindrømmelser i Europaaftalerne for at
    tage hensyn til den landbrugsaftale, som er indgået under de multilaterale handelsforhandlinger
    i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
