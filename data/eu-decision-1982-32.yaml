    Anwendung der in dem Beschluß 80/1186/EWG über die Assoziation der überseeischen
    Länder und Gebiete mit der Europäischen Wirtschaftsgemeinschaft vorgesehenen
    Regelung auf Antigua und Barbuda'
  type: main
- language: da
  script: Latn
  content: '82/32/EØF: Rådets afgørelse af 21. december 1981 om midlertidig anvendelse
