    80/1186/EEC on the association of the overseas countries and territories with
    the European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '82/32/CEE: Décision du Conseil, du 21 décembre 1981, relative à l''
    application provisoire à l'' État d'' Antigua-et-Barbuda du régime prévu par
    la décision 80/1186/CEE relative à l'' association des pays et territoires d''
    outre-mer à la Communauté économique européenne'
  type: main
