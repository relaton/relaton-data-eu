- language: en
  script: Latn
  content: Commission Regulation (EEC) No 438/87 of 12 February 1987 laying down for
    the period 1 July 1986 to 31 December 1986 compensation measures in respect of
    preferential raw sugar and raw sugar from the French overseas departments intended
    for refining in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 438/87 de la Commission du 12 février 1987 établissant
    pour la période du 1er juillet au 31 décembre 1986 certaines compensations en
    ce qui concerne le sucre brut préférentiel et le sucre brut des départements
    français d' outre-mer destinés au raffinage dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 438/87 der Kommission vom 12. Februar 1987 zur Festlegung
    bestimmter Ausgleichsmaßnahmen betreffend Präferenzrohzucker und Rohzucker aus
    den französischen Überseedepartements, der in der Gemeinschaft in der Zeit vom
    1. Juli bis 31. Dezember 1986 raffiniert worden ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 438/87 af 12. februar 1987 om fastsættelse
    for perioden 1. juli til 31. december 1986 af visse udligningsbeløb for præferenceråsukker
    og råsukker fra de franske oversøiske departementer til raffinering i Fællesskabet
  type: main
- language: el
  script: Grek
