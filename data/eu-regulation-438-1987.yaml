    ραφινάρονται στην Κοινότητα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 438/87 della Commissione del 12 febbraio 1987 che
    determina per il periodo dal 1° luglio 1986 al 31 dicembre 1986 talune compensazioni
    per quanto concerne lo zucchero greggio preferenziale e lo zucchero greggio dei
    dipartimenti francesi d' oltremare destinati alla raffinazione nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 438/87 van de Commissie van 12 februari 1987 houdende
    vaststelling voor de periode van 1 juli tot en met 31 december 1986 van bepaalde
    compensaties voor in de Gemeenschap geraffineerde preferentiële ruwe suiker en
    ruwe suiker uit de Franse overzeese departementen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 438/87 da Comissão de 12 de Fevereiro de 1987 que
