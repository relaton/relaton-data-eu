    im Wirtschaftsjahr 1992/93 und Überschreitung der garantierten Höchstmenge verringerten
    Preise und Beträge
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2850/93 af 19. oktober 1993 om fastlæggelse
    af de priser og beløb, der er fastsat i ecu for olivenolie, og som er nedsat
    som følge af de monetære justeringer i produktionsåret 1992/93 og overskridelsen
    af den maksimale garantimængde
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2850/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Οκτωβρίου 1993 σχετικά με τον προσδιορισμό
    των τιμών και ποσών που καθορίζονται σε Ecu και
    που μειώνονται συνεπεία των νομισματικών επανευθυγραμμίσεων
    στον τομέα του ελαιολάδου για την περίοδο εμπορίας
    1992/93 και με την υπέρβαση της μέγιστης εγγυημένης
    ποσότητας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2850/93 DELLA COMMISSIONE del 19 ottobre 1993 che
    stabilisce i prezzi e gli importi fissati in ecu nel settore dell' olio d' oliva
    e ridotti a seguito dei riallineamenti monetari della campagna di commercializzazione
    1992/93 e del superamento del quantitativo massimo garantito
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2850/93 VAN DE COMMISSIE van 19 oktober 1993 tot
    bepaling van de in verband met de monetaire herschikkingen van het verkoopseizoen
    1992/1993 en de overschrijding van de gegarandeerde maximumhoeveelheid verlaagde
    prijzen en bedragen in ecu in de sector olijfolie
  type: main
