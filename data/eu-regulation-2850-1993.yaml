  content: COMMISSION REGULATION (EEC) No 2850/93 of 19 October 1993 laying down the
    prices and amounts fixed in ecus in the olive oil sector and reduced as a result
    of monetary realignments in the 1992/93 marketing year and the overrun of the
    maximum guaranteed quantity
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2850/93 de la Commission du 19 octobre 1993 déterminant
