    en conséquence des réalignements monétaires de la campagne de commercialisation
    1992/1993 et du dépassement de la quantité maximale garantie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2850/93 DER KOMMISSION vom 19. Oktober 1993 zur Bestimmung
