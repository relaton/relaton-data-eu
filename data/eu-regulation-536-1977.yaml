id: EURegulation5361977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 536/77 of 15 March 1977 re-establishing
    the levying of customs duties on tarpaulins, sails, awnings, etc. falling within
    heading No 62.04, originating in South Korea to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 536/77 de la Commission, du 15 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d'embarcation, stores d'extérieur, etc., de la position tarifaire 62.04,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 536/77 der Kommission vom 15. März 1977 über die
    Wiedereinführung des Zollsatzes für Planen, Segel, Markisen, Zelte und Zeltlagerausrüstungen
    der Tarifnummer 62.04, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 536/77 af 15. marts 1977 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl, etc, under position 62.04,
    som har oprindelse i Sydkorea og omfattes af toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 536/77 della Commissione, del 15 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili ai copertoni, vele per imbarcazioni,
    tende per l'esterno, ecc., della voce doganale 62.04, originari della Corea del
    Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 536/77 van de Commissie van 15 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op dekkleden,
    scheepszeilen, zonneschermen voor winkelpuien en dergelijke, enz., van post 62.04,
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3022/76 van de Raad
  type: main
