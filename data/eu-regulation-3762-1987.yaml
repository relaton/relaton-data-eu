title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3762/87 of 30 November 1987 fixing for 1988
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of a Member State , other than Spain and Portugal,
    in waters falling under the sovereignty or within the jurisdiction of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3762/87 du Conseil du 30 novembre 1987 fixant, pour
    1988, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon d' un État membre, à l' exception de
    l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de la
    juridiction de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3762/87 des Rates vom 30. November 1987 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter der Flagge eines Mitgliedstaats, mit Ausnahme Spaniens und
    Portugals, in den Gewässern unter der Hoheitsgewalt oder Gerichtsbarkeit Spaniens
    (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3762/87 af 30. november 1987 om fastsættelse
    for 1988 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører en medlemsstats flag, bortset
    fra spansk og portugisisk flag, i de farvande, der henhører under Spaniens højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3762/87 του Συμβουλίου
    της 30ής Νοεμβρίου 1987 για τον καθορισμό, για
    το 1988, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία ενός κράτους μέλους, εκτός
    της Ισπανίας και της Πορτογαλίας, στα ύδατα
    που υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Ισπανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3762/87 del Consiglio del 30 novembre 1987 che fissa,
    per il 1988, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera degli Stati membri, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione della
    Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3762/87 van de Raad van 30 november 1987 tot vaststelling,
    voor 1988, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van de Lid-Staten,
    met uitzondering van Spanje en Portugal, in de wateren die onder de soevereiniteit
    of de jurisdictie van Spanje vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3762/87 do Conselho de 30 de Novembro de 1987 que
    fixa, para 1988, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de um Estado-membro, com excepção
    de Espanha e de Portugal, nas águas sob soberania ou jurisdição de Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3762/87 del Consejo de 30 de noviembre de 1987 por
