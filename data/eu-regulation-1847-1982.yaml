title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1847/82 of 7 July 1982 fixing for the 1982/83
    marketing year the Community offer prices for sweet oranges applicable as regards
    Greece and the coefficients to be used to calculate the offer prices for Greek
    oranges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1847/82 de la Commission, du 7 juillet 1982, fixant,
    pour la campagne 1982/1983, le prix d' offre communautaire des oranges douces
    applicable vis-à-vis de la Grèce ainsi que les coefficients à appliquer pour
    le calcul du prix d' offre du produit grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1847/82 der Kommission vom 7. Juli 1982 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Süßorangen gegenüber Griechenland
    sowie der zur Berechnung des Angebotspreises für das griechische Erzeugnis anzuwendenden
    Koeffizienten für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1847/82 af 7. juli 1982 om fastsættelse
    for høståret 1982/83 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på appelsiner samt af koefficienterne for beregningen af tilbudsprisen på det
    græske produkt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1847/82 τής Επιτροπής
    τής 7ης Ιουλίου 1982 περί καθορισμού, γιά τήν
    περίοδο εμπορίας 1982/83, κοινοτικής τιμής προσφοράς
    γιά τά γλυκά πορτοκάλια η οποία εφαρμόζεται
    έναντι τής Ελλάδος, καθώς καί τών συντελεστών
    πού πρέπει νά εφαρμόζονται γιά τόν υπολογισμό
    τής τιμής προσφοράς τού ελληνικού προϊόντος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1847/82 della Commissione, del 7 luglio 1982, che
    fissa, per la campagna 1982/1983, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per le arance dolci, nonché i coefficienti da utilizzare
    per il calcolo del prezzo d' offerta del prodotto ellenico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1847/82 van de Commissie van 7 juli 1982 tot vaststelling,
    voor het verkoopseizoen 1982/1983, van de ten aanzien van Griekenland toe te passen
    communautaire aanbiedingsprijs voor zoete sinaasappelen en van de voor de berekening
    van de aanbiedingsprijs van het Griekse produkt toe te passen coëfficiënten
  type: main
