id: EUDecision1974619
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 4 December 1974 authorizing the Italian Republic
    not to apply Community treatment to parts and accessories of motor-cycles and
    parts of internal combustion piston engines, falling within heading Nos 87.12
    A and 84.06 D of the Common Customs Tariff, originating in Japan, and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '74/619/CEE: Décision de la Commission, du 4 décembre 1974, autorisant
    la République italienne à exclure du traitement communautaire les parties, pièces
    détachées et accessoires de motocycles et les parties et pièces détachées
    des moteurs à explosion ou à combustion, à piston, des positions 87.12 A et
    84.06 D du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Dezember 1974, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Teile und Zubehör für Krafträder und Teile für
    Kolbenverbrennungsmotoren der Tarifnummern 87.12 A und 84.06 D des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: '74/619/EØF: Kommissionens Beslutning af 4. december 1974 om bemyndigelse
    for Den italienske Republik til fra fællesskabsbehandling at undtage dele og
    tilbehør til motorcykler og dele til forbrændingsmotorer med stempel, som henhører
    under position 87.12 A og 84.06 D i den fælles toldtarif, har oprindelse i Japan
    og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 dicembre 1974, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario parti, pezzi staccati ed accessori
    per motocicli e parti, pezzi staccati di motori a scoppio o a combustione interna,
    a pistone delle voci 87.12 A e 84.06 D della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 december 1974 waarbij de Italiaanse
    Republiek wordt gemachtigd delen, onderdelen en toebehoren voor motorrijwielen
    en delen en onderdelen van explosiemotoren en verbrandingsmotoren, met zuigers
    van posten 87.12 A en 84.06 D van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
