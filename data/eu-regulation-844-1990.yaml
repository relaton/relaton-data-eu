title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 844/90 of 30 March 1990 reintroducing the
    levying of the customs duties on women's or girls'suits and ensembles, products
    of category No 74 (order No 40.0740) and garments products of category No 78 order
    (No 40.0780 originating in India), to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 844/90 de la Commission du 30 mars 1990 portant rétablissement
    de la perception des droits de douane applicables aux costumes-tailleurs et ensembles
    de la catégorie de produits n° 74 (numéro d'ordre 40.0740) et aux vêtements
    de la catégorie de produits n° 78 (numéro d'ordre 40.0780), originaires de
    l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 844/90 DER KOMMISSION vom 30. Maerz 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Kostueme und Kombinationen der Warenkategorie
    Nr. 74 (Laufende Nummer 40.0740) und Bekleidung der Warenkategorie Nr. 78 (Laufende
    Nummer 40.0780) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3897/89
    des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 844/90 af 30. marts 1990 om genindførelse
    af opkrævning af told for dragter, kostumer og sæt under varekategori nr. 74
    (løbenummer 40.0740) og beklædningsgenstande under varekategori nr. 78 (løbenummer
    40.0780), som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 844/90 της Επιτροπής
    της 30ής Μαρτίου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για κοστούμια
    - ταγιέρ και σύνολα πλεκτά για γυναίκες ή κορίτσια,
    από μαλλί, βαμβάκι ή συνθετικές ίνες, με εξαίρεση
    τα ενδύματα του σκι, προϊόντα της κατηγορίας
