    3897/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 844/90 DELLA COMMISSIONE del 30 marzo 1990 che ripristina
    la riscossione dei dazi doganali applicabili agli abiti a giacca e completi a
    maglia della categoria di prodotti n. 74 (numero d'ordine 40.0740) e agli indumenti
    della categoria di prodotti n. 78 (numero d'ordine 40.0780), originari dell'India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3897/89
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 844/90 VAN DE COMMISSIE van 30 maart 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantelpakken
    of broekpakken en combinaties van de categorie van produkten nr. 74 (volgnummer
    40.0740) en kleding van de categorie van produkten nr. 78 (volgnummer 40.0780),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 844/90 DA COMISSAO de 30 de Março de 1990 que restabelece
