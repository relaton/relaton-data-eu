title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1969, portant octroi du concours
    FSE au bénéfice de la République italienne pour des dépenses relatives à
    des opérations de rééducation professionnelles effectuées par le "Ministero
    del lavora e della previdenza sociale" et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: '70/87/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für vom "Ministero del Lavoro e della Previdenza sociale" und mehreren italienischen
    Körperschaften durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '70/87/CEE: Decisione della Commissione, del 22 dicembre 1969, che concede
    un contributo del FSE alla Repubblica italiana per spese concernenti operazioni
    di riqualificazione effettuate dal «Ministero del lavoro e della previdenza sociale»
    e da vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: '70/87/EEG: Beschikking van de Commissie van 22 december 1969 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero del lavoro e della previdenza sociale" en diverse Italiaanse
    instellingen gemaakte herscholingskosten'
  type: main
