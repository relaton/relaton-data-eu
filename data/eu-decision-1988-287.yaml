id: EUDecision1988287
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '88/287/EEC: Commission Decision of 11 May 1988 terminating the examination
    procedure concerning the unauthorized reproduction of sound recordings in Indonesia
    consequent on the Republic of Indonesia'' s undertaking to give sound recordings
    by nationals of Community Member States the same protection as sound recordings
    by Indonesian nationals'
  type: main
- language: fr
  script: Latn
  content: '88/287/CEE: Décision de la Commission du 11 mai 1988 portant clôture
    de la procédure d''examen concernant la reproduction non autorisée de supports
    de son enregistrés en Indonésie à la suite de l''engagement de la République
    d''Indonésie d''assurer aux supports de son enregistrés des ressortissants des
    États membres de la Communauté une protection identique à celle des supports
    de son enregistrés des ressortissants indonésiens'
  type: main
- language: de
  script: Latn
  content: '88/287/EWG: Beschluß der Kommission vom 11. Mai 1988 über die Einstellung
    des Untersuchungsverfahrens betreffend die widerrechtliche Reproduktion von Tonaufzeichnungen
    in Indonesien im Anschluß an die Verpflichtung der Indonesischen Republik, Tonaufzeichnungen
    von Staatsangehörigen der Mitgliedstaaten der Gemeinschaft den gleichen Schutz
    wie Tonaufzeichnungen indonesischer Staatsangehöriger zu gewähren'
  type: main
- language: da
  script: Latn
  content: '88/287/EØF: Kommissionens afgørelse af 11. maj 1988 om afslutning af
    undersøgelsesproceduren vedrørende reproduktion uden tilladelse i Indonesien
    af lydmedier med optagelse efter Republikken Indonesiens tilsagn om at sikre EF-statsborgeres
    lydmedier med optagelse samme beskyttelse som den, der ydes indonesiske statsborgeres
    lydmedier med optagelse'
  type: main
- language: el
  script: Grek
  content: '88/287/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Μαΐου 1988 για την περάτωση της διαδικασίας έρευνας
    όσον αφορά την αναπαραγωγή χωρίς άδεια (πειρατεία)
    των γραμμένων υποθεμάτων ήχου στην Ινδονησία,
    λόγω της δέσμευσης που ανέλαβε η Ινδονησία
    να εξασφαλίζει στα γραμμένα υποθέματα ήχου
    των υπηκόων των κρατών μελών την ίδια προστασία
    με αυτή που παρέχεται στα γραμμένα υποθέματα
    ήχου των υπηκόων της Ινδονησίας'
  type: main
- language: it
  script: Latn
  content: '88/287/CEE: Decisione della Commissione dell'' 11 maggio 1988 che chiude
    la procedura d'' esame riguardante la riproduzione non autorizzata, in Indonesia,
    di registrazioni sonore a seguito dell'' impegno assunto dalla Repubblica d''
    Indonesia di garantire alle registrazioni sonore dei cittadini degli Stati membri
    della Comunità una tutela identica a quella garantita alle registrazioni sonore
    dei cittadini indonesiani'
  type: main
- language: nl
  script: Latn
  content: '88/287/EEG: Besluit van de Commissie van 11 mei 1988 tot beëindiging
    van de procedure van onderzoek betreffende de niet-toegestane verveelvoudiging
    van voorbespeelde geluidsdragers in Indonesië naar aanleiding van de verbintenis
    van de Republiek Indonesië om aan voorbespeelde geluidsdragers van de onderdanen
    van de Lid-Staten van de Gemeenschap een bescherming te verlenen die identiek
    is aan de bescherming van voorbespeelde geluidsdragers van Indonesische onderdanen'
  type: main
- language: pt
  script: Latn
  content: '88/287/CEE: Decisão da Comissão de 11 de Maio de 1988 relativa ao encerramento
    do processo de exame relativo à reprodução não autorizada de suportes de som
    gravados na Indonésia, na sequência do compromisso assumido pela República
    da Indonésia de assegurar, aos suportes de som gravados dos nacionais dos Estados-membros
    da Comunidade, uma protecção idêntica à dos suportes de som gravados dos nacionais
    indonésios'
  type: main
- language: es
  script: Latn
  content: '88/287/CEE: Decisión de la Comisión de 11 de mayo de 1988 por la que
    se da por terminado el procedimiento de examen relativo a la reproducción no
    autorizada de soportes de sonido grabados en Indonesia, como consecuencia del
    compromiso de la República de Indonesia de dispensar a los soportes de sonido
    grabados de los nacionales de los Estados miembros de la Comunidad una protección
    idéntica a la de los soportes de sonido grabados de los nacionales indonesios'
  type: main
