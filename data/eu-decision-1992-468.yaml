    por Grecia, Italia y Portugal respecto de determinadas disposiciones de la Directiva
    77/93/CEE del Consejo relativas a las patatas de siembra originarias de Canadá
    (Los textos en lenguas griega, italiana y portuguesa son los únicos auténticos)'
