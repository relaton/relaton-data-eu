  content: '2001/276/EC: Commission Decision of 4 April 2001 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries to take account of the animal health
    situation in Argentina (Text with EEA relevance) (notified under document number
    C(2001) 1040)'
  type: main
- language: fr
  script: Latn
  content: '2001/276/CE: Décision de la Commission du 4 avril 2001 modifiant la décision
