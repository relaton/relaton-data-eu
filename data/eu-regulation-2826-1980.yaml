    derogating from Regulation (EEC) No 2730/79 as regards payment of the refund for
    butteroil, and amending Regulation (EEC) No 210/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2826/80 de la Commission, du 31 octobre 1980, portant
