    certificat d' exportation pour le beurre anhydre dérogeant au règlement (CEE)
    n° 2730/79 en ce qui concerne le paiement de la restitution pour ce produit et
    modifiant le règlement (CEE) n° 210/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2826/80 der Kommission vom 31. Oktober 1980 zur fünfzehnten
