    Butteroil, zur Abweichung von der Verordnung (EWG) Nr. 2730/79 hinsichtlich der
    Zahlung der Erstattung für dieses Erzeugnis und zur Änderung der Verordnung
    (EWG) Nr. 210/69
  type: main
