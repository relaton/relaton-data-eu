    (EC 3.2.1.8), ki ju proizvaja Aspergillus niger (NRRL 25541), kot krmni dodatek
    za piščance za pitanje, kokoši nesnice, prašiče za pitanje, manj pomembne
    vrste perutnine in manj pomembne vrste prašičev za pitanje ter o spremembi Uredbe
    (ES) št. 255/2005 in o razveljavitvi Uredbe (ES) št. 668/2003 (imetnik dovoljenja
    Andrés Pintaluba S.A.)
  type: main
