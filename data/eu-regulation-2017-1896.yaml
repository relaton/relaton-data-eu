  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1896 zo 17. októbra 2017 o
    povolení prípravku s obsahom endo-1,3(4)-β-glukanázy (EC 3.2.1.6) a endo-1,4-β-xylanázy
    (EC 3.2.1.8) produkovaných mikroorganizmom Aspergillus niger (NRRL 25541) ako
    kŕmnej doplnkovej látky pre kurčatá vo výkrme, nosnice, ošípané na výkrm,
    menej významné druhy hydiny a menej významné druhy ošípaných na výkrm,
    o zmene nariadenia (ES) č. 255/2005 a o zrušení nariadenia (ES) č. 668/2003
    (držiteľ povolenia Andrés Pintaluba S.A.)
  type: main
- language: sl
  script: Latn
