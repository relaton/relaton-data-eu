---
id: EURegulation20171896
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1896 of 17 October 2017 concerning
    the authorisation of a preparation o endo-1,3(4)-beta-glucanase (EC 3.2.1.6) and
    endo-1,4-beta-xylanase (EC 3.2.1.8) produced by Aspergillus niger (NRRL 25541)
    as a feed additive for chickens for fattening, laying hens, pigs for fattening,
    minor poultry species and minor porcine species for fattening and amending Regulation
    (EC) No 255/2005 and repealing Regulation (EC) No 668/2003 (holder of the authorisation
    Andrés Pintaluba S.A.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/1896 de la Commission du 17 octobre
    2017 relatif à l''autorisation d''une préparation d''endo-1,3(4)-bêta-glucanase
    (EC 3.2.1.6) et d''endo-1,4-bêta-xylanase (EC 3.2.1.8) produites par Aspergillus
    niger (NRRL 25541) en tant qu''additif pour l''alimentation des poulets d''engraissement,
    des poules pondeuses, des porcs d''engraissement, des espèces mineures de volailles
    et des espèces porcines mineures destinées à l''engraissement, modifiant le
    règlement (CE) n° 255/2005 et abrogeant le règlement (CE) n° 668/2003 (titulaire
    de l''autorisation: Andrés Pintaluba S.A.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2017/1896 der Kommission vom 17. Oktober
    2017 zur Zulassung einer Zubereitung von Endo-1,3(4)-beta-glucanase (EC 3.2.1.6)
    und Endo-1,4-beta-xylanase (EC 3.2.1.8), gewonnen aus Aspergillus niger (NRRL
    25541), als Futtermittelzusatzstoff für Masthühner, Legehennen, Mastschweine,
    Geflügelarten von geringerer wirtschaftlicher Bedeutung und Mastschweinearten
    von geringerer wirtschaftlicher Bedeutung sowie zur Änderung der Verordnung (EG)
    Nr. 255/2005 und zur Aufhebung der Verordnung (EG) Nr. 668/2003 (Zulassungsinhaber:
    Andrés Pintaluba S.A.)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1896 на Комисията
    от 17 октомври 2017 година за разрешаване на употребата
    на препарат от ендо-1,3(4)-бета-глюканаза (ЕС 3.2.1.6)
    и ендо-1,4-бета-ксиланаза (ЕС 3.2.1.8), получени от
    Aspergillus niger (NRRL 25541), като фуражна добавка за пилета
    за угояване, кокошки носачки, свине за угояване,
    видове домашни птици с по-малко стопанско значение
    и видове свине с по-малко стопанско значение
    за угояване, за изменение на Регламент (ЕО)
    № 255/2005 и за отмяна на Регламент (ЕО) № 668/2003
    (притежател на разрешението Andrés Pintaluba S.A.)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1896 ze dne 17. října 2017,
    které se týká povolení přípravku z endo-1,3(4)-beta-glukanázy (EC 3.2.1.6)
    a endo-1,4-beta-xylanázy (EC 3.2.1.8) z Aspergillus niger (NRRL 25541) jako doplňkové
    látky pro výkrm kuřat, nosnice, výkrm prasat, menšinové druhy drůbeže
    a výkrm menšinových druhů prasat a kterým se mění nařízení (ES) č.
    255/2005 a zrušuje nařízení (ES) č. 668/2003 (držitel povolení Andrés
    Pintaluba S.A.)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1896 af 17. oktober 2017
    om godkendelse af et præparat af endo-1,3(4)-beta-glucanase (EC 3.2.1.6) og endo-1,4-beta-xylanase
    (EC 3.2.1.8) produceret af Aspergillus niger (NRRL 25541) som et tilsætningsstof
    til foder til slagtekyllinger, æglæggende høner, slagtesvin, mindre udbredte
    fjerkræarter bestemt til slagtning og mindre udbredte svinearter bestemt til
    slagtning, om ændring af forordning (EF) nr. 255/2005 og om ophævelse af forordning
    (EF) nr. 668/2003 (indehaver af godkendelsen er Andrés Pintaluba S.A.)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2017/1896 της Επιτροπής,
    της 17ης Οκτωβρίου 2017, για την έγκριση παρασκευάσματος
    ενδο-1,3(4)-β-γλυκανάσης (EC 3.2.1.6) και ενδο-1,4-β-ξυλανάσης
    (EC 3.2.1.8) που παράγονται από Aspergillus niger (NRRL 25541)
    ως πρόσθετης ύλης ζωοτροφών για κοτόπουλα
    προς πάχυνση, όρνιθες ωοπαραγωγής, χοίρους
    προς πάχυνση, μικρά είδη πουλερικών και μικρά
    είδη χοίρων προς πάχυνση, και για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 255/2005 και την κατάργηση
    του κανονισμού (ΕΚ) αριθ. 668/2003 (κάτοχος άδειας
    Andrés Pintaluba SA)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2017/1896, 17. oktoober 2017, milles käsitletakse
    loa andmist Aspergillus niger'i (NRRL 25541) abil toodetud endo-1,3(4)-β-glükanaasi
    (EC 3.2.1.6) ja endo-1,4-β-ksülanaasi (EC 3.2.1.8) valmistise kasutamiseks broilerkanade,
    munakanade, nuumsigade, vähem levinud kodulinnuliikide ja vähem levinud sealiikide
    nuumsigade söödalisandina ning muudetakse määrust (EÜ) nr 255/2005 ning tunnistatakse
    kehtetuks määrus (EÜ) nr 668/2003 (loa hoidja Andrés Pintaluba S.A.)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/1896, annettu 17 päivänä
    lokakuuta 2017, Aspergillus niger (NRRL 25541) -organismin tuottamaa endo-1,3(4)-beetaglukanaasia
    (EC 3.2.1.6) ja endo-1,4-beetaksylanaasia (EC 3.2.1.8) sisältävän valmisteen
    hyväksymisestä broilerien, munivien kanojen, lihasikojen, toissijaisten siipikarjalajien
    ja toissijaisten lihasikaeläinten rehun lisäaineena, asetuksen (EY) N:o 255/2005
    muuttamisesta ja asetuksen (EY) N:o 668/2003 kumoamisesta (hyväksynnän haltija
    Andrés Pintaluba SA)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1896 оd 17. listopada 2017. o odobrenju
    pripravka endo-1,3(4)-beta-glukanaze (EC 3.2.1.6) i endo-1,4-beta-ksilanaze (EC
    3.2.1.8) proizvedenog od Aspergillus niger (NRRL 25541) kao dodatka hrani za piliće
    za tov, kokoši nesilice, svinje za tov, manje zastupljene vrste peradi i manje
    zastupljene vrste svinja za tov te o izmjeni Uredbe (EZ) br. 255/2005 i stavljanju
    izvan snage Uredbe (EZ) br. 668/2003 (nositelj odobrenja Andrés Pintaluba S.A.)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1896 végrehajtási rendelete (2017. október 17.)
    az Aspergillus niger (NRRL 25541) által termelt endo-1,3(4)-béta-glükanáz
    (EC 3.2.1.6) és endo-1,4-béta-xilanáz (EC 3.2.1.8) készítmény brojlercsirkék,
    tojótyúkok, hízósertések, kevésbé jelentős baromfifajok és kevésbé
    jelentős hízósertésfélék takarmány-adalékanyagaként történő engedélyezéséről,
    a 255/2005/EK rendelet módosításáról és a 668/2003/EK rendelet hatályon
    kívül helyezéséről (az engedély jogosultja az Andrés Pintaluba S.A.)
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1896 della Commissione, del 17 ottobre
    2017, relativo all'autorizzazione di un preparato di endo-1,3(4)-beta-glucanasi
    (EC 3.2.1.6) ed endo-1,4-beta-xilanasi (EC 3.2.1.8) prodotto da Aspergillus niger
    (NRRL 25541) come additivo per mangimi destinati a polli da ingrasso, galline
    ovaiole, suini da ingrasso, specie avicole minori e specie suine minori da ingrasso
    e che modifica il regolamento (CE) n. 255/2005 e abroga il regolamento (CE) n.
    668/2003 (titolare dell'autorizzazione Andrés Pintaluba SA)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1896 (2017. gada 17. oktobris)
    par atļauju no Aspergillus niger (NRRL 25541) iegūtas endo-1,3(4)-beta-glikanāzes
    (EC 3.2.1.6) un endo-1,4-beta-ksilanāzes (EC 3.2.1.8) preparātu izmantot par
    barības piedevu gaļas cāļiem, dējējvistām, nobarojamām cūkām, mazāk
    izplatītu sugu mājputniem un mazāk izplatītām nobarojamo cūku sugām un
    ar ko groza Regulu (EK) Nr. 255/2005 un atceļ Regulu (EK) Nr. 668/2003 (atļaujas
    turētājs Andrés Pintaluba S.A.)
  type: main
- language: lt
  script: Latn
  content: 2017 m. spalio 17 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1896
    dėl leidimo naudoti endo-1,3(4)-beta-gliukanazės EC 3.2.1.6 ir endo-1,4-beta-ksilanazės
    EC 3.2.1.8, gautų iš Aspergillus niger (NRRL 25541), preparatą kaip mėsinių
    viščiukų, vištų dedeklių, penimųjų kiaulių, retesnių rūšių naminių
    paukščių ir retesnių rūšių penimųjų kiaulių pašaro priedą, kuriuo
    iš dalies keičiamas Reglamentas (EB) Nr. 255/2005 ir panaikinamas Reglamentas
    (EB) Nr. 668/2003 (leidimo turėtojas – „Andrés Pintaluba S.A.“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1896 tas-17 ta'
