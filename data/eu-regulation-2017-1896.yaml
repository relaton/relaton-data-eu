    niger (NRRL 25541) como aditivo em alimentos para frangos de engorda, galinhas
    poedeiras, suínos de engorda, espécies menores de aves de capoeira e espécies
    menores de suínos de engorda e que altera o Regulamento (CE) n.° 255/2005 e
    revoga o Regulamento (CE) n.° 668/2003 (detentor da autorização: Andrés Pintaluba
    S.A.)'
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1896 al Comisiei din 17 octombrie
    2017 privind autorizarea unui preparat de endo-1,3(4)-beta-glucanază (EC 3.2.1.6)
    și endo-1,4-beta-xilanază (EC 3.2.1.8) produs de Aspergillus niger (NRRL 25541)
    ca aditiv furajer pentru pui pentru îngrășare, găini ouătoare, porci pentru
    îngrășare, specii minore de păsări de curte și specii minore de porcine
    pentru îngrășare, de modificare a Regulamentului (CE) 255/2005 și de abrogare
    a Regulamentului (CE) nr. 668/2003 (titular al autorizației Andrés Pintaluba
    S.A.)
  type: main
