    tal-bajd, għall-ħnieżer tas-simna, għall-ispeċijiet minuri tat-tjur u għall-ispeċijiet
    minuri tal-porċini tas-simna u li jemenda r-Regolament (KE) Nru 255/2005 u li
    jħassar ir-Regolament (KE) Nru 668/2003 (id-detentur tal-awtorizzazzjoni Andrés
    Pintaluba S.A.)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/1896 van de Commissie van 17 oktober 2017
    tot verlening van een vergunning voor een preparaat van endo-1,3(4)-bèta-glucanase
    (EC 3.2.1.6) en endo-1,4-bèta-xylanase (EC 3.2.1.8), geproduceerd door Aspergillus
    niger (NRRL 25541), als toevoegingsmiddel voor diervoeding voor mestkippen, legkippen,
    mestvarkens, minder gangbare pluimveesoorten en kleine varkenssoorten gehouden
    voor mestdoeleinden en tot wijziging van Verordening (EG) nr. 255/2005 en tot
    intrekking van Verordening (EG) nr. 668/2003 (vergunninghouder Andrés Pintaluba
    SA)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2017/1896 z dnia 17 października
    2017 r. dotyczące zezwolenia na stosowanie preparatu endo-1,3(4)-beta-glukanazy
    (EC 3.2.1.6) i endo-1,4-beta-ksylanazy (EC 3.2.1.8) wytwarzanych przez Aspergillus
    niger (NRRL 25541) jako dodatku paszowego dla kurcząt rzeźnych, kur niosek,
    tuczników, podrzędnych gatunków drobiu i podrzędnych gatunków świń do tuczu
    oraz zmieniające rozporządzenie (WE) nr 255/2005 i uchylające rozporządzenie
    (WE) nr 668/2003 (posiadacz zezwolenia: Andrés Pintaluba S.A.)'
  type: main
