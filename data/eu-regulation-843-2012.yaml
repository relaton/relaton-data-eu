    dėl leidimo endo-1,4-beta-ksilanazę, gautą iš Aspergillus niger (CBS 109.713),
    naudoti kaip veislei auginamų kalakutų, smulkiųjų paukščių (mėsinių ir
    iš kurių auginamos dedeklės arba kurie auginami veislei) ir dekoratyvinių
    paukščių lesalų priedą (leidimo turėtojas BASF SE)
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 843/2012 tat-
