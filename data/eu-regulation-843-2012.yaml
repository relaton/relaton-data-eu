    prodott mill- Aspergillus niger (CBS 109.713) bħala addittiv tal-għalf għad-dundjani
    mrobbija għat-tgħammir, għall-ispeċijiet minuri tat-tjur għas-simna u mrobbija
    għall-bajd jew għat-tgħammir u għall-għasafar għat-tiżjin (detentur tal-awtorizzazzjoni
    BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 843/2012 van de Commissie van 18 september
    2012 tot verlening van een vergunning voor endo-1,4-bèta-xylanase, geproduceerd
    door Aspergillus niger (CBS 109.713), als toevoegingsmiddel voor diervoeding voor
    opfokkalkoenen, kleine vogelsoorten (gehouden voor mest-, leg- en fokdoeleinden)
    en siervogels (vergunninghouder BASF SE)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) nr 843/2012 z dnia 18 września
