    με τη χορήγηση άδειας χρήσης της ενδο-1,4-β-ξυλανάσης
    που παράγεται από Aspergillus niger (CBS 109.713) ως πρόσθετης
    ύλης ζωοτροφών για γαλοπούλες εκτρεφόμενες
    προς αναπαραγωγή, για μικρά είδη πτηνών προς
