    endo-1,4-beta-ksilanaze dobivene od Aspergillus niger (CBS 109.713) kao dodatka
    hrani za životinje, za purane uzgajane za rasplod, manje značajne vrste ptica
    za tov i uzgajane za nesenje ili rasplod te ukrasne ptice (nositelj odobrenja
    BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság 843/2012/EU végrehajtási rendelete ( 2012. szeptember 18.
    ) az Aspergillus niger (CBS 109.713) által termelt endo-1,4-béta-xilanáz tenyésztés
    céljából nevelt pulykák, kisebb hízó-, tojó- és tenyésztés céljából
    nevelt madárfajok, valamint díszmadarak takarmány-adalékanyagaként történő
    engedélyezéséről (az engedély jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 843/2012 della Commissione, del 18 settembre
    2012 , relativo all’autorizzazione dell’endo-1,4-beta-xilanasi prodotta da
    Aspergillus niger (CBS 109.713) come additivo nei mangimi per tacchini allevati
    per la riproduzione, per le specie avicole minori da ingrasso e da riproduzione
    e ovaiole e per uccelli ornamentali (titolare dell’autorizzazione BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 843/2012 ( 2012. gada 18. septembris
    ) par atļauju lietot endo-1,4-beta-ksilanāzi, ko iegūst no Aspergillus niger
    (CBS 109.713), kā barības piedevu vaislas tītariem, retāk audzētu sugu gaļas
    putniem un dējējputniem vai vaislas putniem un dekoratīvajiem putniem (atļaujas
    turētājs – BASF SE )
  type: main
- language: lt
  script: Latn
