title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 843/2012 of 18 September 2012
    concerning the authorisation of endo-1,4-beta-xylanase produced by Aspergillus
    niger (CBS 109.713) as a feed additive for turkeys reared for breeding, minor
    avian species for fattening and reared for laying or breeding and ornamental birds
    (holder of authorisation BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 843/2012 de la Commission du 18 septembre
    2012 concernant l’autorisation de l’endo-1,4-bêta-xylanase produite par Aspergillus
    niger (CBS 109.713) en tant qu’additif pour l’alimentation des dindons élevés
    pour la reproduction, des espèces aviaires mineures d’engraissement ou élevées
    pour la ponte ou la reproduction et des oiseaux d’ornement (titulaire de l’autorisation:
    BASF SE)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) Nr. 843/2012 der Kommission vom 18. September
    2012 zur Zulassung von Endo-1,4-beta-Xylanase aus Aspergillus niger (CBS 109.713)
    als Futtermittelzusatzstoff für Jungtruthühner für die Zucht, Vogelarten geringerer
    wirtschaftlicher Bedeutung für die Mast, Jungtiere von Vogelarten geringerer
    wirtschaftlicher Bedeutung für Lege- oder Zuchtzwecke sowie Ziervögel (Zulassungsinhaber:
    BASF SE)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 843/2012 на Комисията
    от 18 септември 2012 година относно разрешителното
    за ендо-1,4-бета-ксиланаза, получена от Aspergillus
    niger (CBS 109.713), като добавка за използване при
    храненето на пуйки, отглеждани за разплод,
    дребни видове птици за угояване и отглеждани
    за носачки или за разплод и декоративни птици
    (титуляр на разрешителното е BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 843/2012 ze dne 18. září 2012
    o povolení endo-1,4-beta-xylanázy z Aspergillus niger (CBS 109.713) jako doplňkové
    látky pro odchov krůt, výkrm, kuřice nebo odchov menšinových druhů ptactva
    a okrasné ptactvo (držitel povolení BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 843/2012 af 18. september
    2012 om godkendelse af endo-1,4-beta-xylanase produceret af Aspergillus niger
    (CBS 109.713) som fodertilsætningsstof til kalkuner opdrættet til avl, mindre
    udbredte fuglearter beregnet til slagtning og opdrættet til æglægning eller
    avl samt prydfugle (indehaver af godkendelsen er BASF SE)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) αριθ. 843/2012
