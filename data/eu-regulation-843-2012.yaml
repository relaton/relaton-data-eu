    αναπαραγωγή και για διακοσμητικά πτηνά (κάτοχος
    της άδειας: BASF SE)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 843/2012, 18. september 2012 , Aspergillus
    niger ’ist (CBS 109.713) saadud endo-1,4-β-ksülanaasi lubamise kohta aretuskalkunite,
    nuumamiseks, munemiseks või tõuaretuseks ettenähtud vähem tähtsate linnuliikide
    ja dekoratiivlindude söödalisandina (loa omanik BASF SE)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 843/2012, annettu 18 päivänä
