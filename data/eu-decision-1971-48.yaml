title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 décembre 1970, autorisant la République
    fédérale d'Allemagne à offrir du seigle panifiable, détenu par l'organisme
    d'intervention allemand, pour un Centre de commercialisation où il n'est pas
    entreposé
  type: main
- language: de
  script: Latn
  content: '71/48/EWG: Entscheidung der Kommission vom 29. Dezember 1970 zur Ermächtigung
    der Bundesrepublik Deutschland, Brotroggen im Besitz der deutschen Interventionsstelle
    für einen Handelsplatz anzubieten, an dem er nicht gelagert ist'
  type: main
- language: it
  script: Latn
  content: '71/48/CEE: Decisione della Commissione, del 29 dicembre 1970, che autorizza
    la Repubblica federale di Germania ad offrire della segala da panificazione, detenuta
    dall''organismo d''intervento tedesco, per un centro di commercializzazione in
    cui non è immagazzinata'
  type: main
- language: nl
  script: Latn
  content: '71/48/EEG: Beschikking van de Commissie van 29 december 1970 waarbij de
    Bondsrepubliek Duitsland gemachtigd wordt voor de broodbakkerij geschikte rogge,
    die in het bezit is van het Duitse interventiebureau, aan te bieden in een handelscentrum
    waar deze niet is opgeslagen'
  type: main
