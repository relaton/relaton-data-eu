title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4138/87 of 9 December 1987 determining the
    conditions under which certain potatoes, sweet corn, cereals, oilseeds and oleaginous
    fruit, for sowing, are eligible on import for a favourable tariff arrangement
    by reason of their end-use
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4138/87 de la Commission du 9 décembre 1987 déterminant
    les conditions d' admission de pommes de terre, du maïs doux, de certaines céréales
    et de certains fruits et graines oléagineux au bénéfice d' un régime tarifaire
    favorable à l' importation en raison de leur destination à l' ensemencement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4138/87 der Kommission vom 9. Dezember 1987 zur Festlegung
    der Voraussetzungen für die Zulassung von Kartoffeln, bestimmten Getreidearten
    und bestimmten Ölsaaten und ölhaltigen Früchten zur abgabenbegünstigten Einfuhr
    aufgrund ihrer besonderen Verwendung als Saatgut
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4138/87 af 9. december 1987 om fastsættelse
    af betingelserne for adgang til toldlempelse ved indførsel af kartofler, sukkermajs,
    visse kornarter og visse olieholdige frø og frugter som følge af deres anvendelse
    til plantning eller udsæd
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4138/87 της Επιτροπής
    της 9ης Δεκεμβρίου 1987 για τον καθορισμό των
    όρων υπαγωγής της πατάτας, του γλυκού καλαμποκιού,
    ορισμένων σιτηρών και ορισμένων ελαιούχων
    σπόρων και καρπών σε ευνοϊκό δασμολογικό καθεστώς
    κατά την εισαγωγή, λόγω του προορισμού τους
    για σπορά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4138/87 della Commissione del 9 dicembre 1987 che
    determina le condizioni per l' ammissione delle patate, del granturco dolce, di
    taluni cereali e di taluni semi e frutti oleosi al beneficio di un regime tariffario
    favorevole all' importazione in funzione della loro destinazione alla semina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4138/87 van de Commissie van 9 december 1987 houdende
    vaststelling van de voorwaarden en bepalingen voor de indeling van pootaardappelen,
    bepaalde granen en bepaalde oliehoudende zaden en vruchten in de gecombineerde
    nomenclatuur met toepassing van een gunstige tariefregeling
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4138/87 da Comissão de 9 de Dezembro de 1987 que
    determina as condições a que está subordinada a admissão de batatas, de milho
    doce, de alguns cereais e de algumas sementes e frutos oleaginosos ao benefício
    de um regime pautal favorável à importação em função do seu destino a sementeira
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4138/87 de la Comisión de 9 de diciembre de 1987
    por el que se determinan las condiciones de admisión de las patatas, maíz dulce,
    determinados cereales y determinadas semillas y frutos oleaginosos a los beneficios
    de un régimen arancelario de importación favorable en razón de su destino
