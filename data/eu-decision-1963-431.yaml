title:
- language: fr
  script: Latn
  content: Décision de la Commission du 4 juillet 1963 portant nouvelle prorogation
    et modification de sa décision du 9 octobre 1962, autorisant la perception de
    taxes compensatoires sur les importations, dans la République française, de
    chocolat, de confiseries et préparations comportant du cacao ou du chocolat,
    sans liqueur alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '63/431/EWG: Entscheidung der Kommission vom 4. Juli 1963 zur erneuten
    Verlängerung und Änderung ihrer Entscheidung vom 9. Oktober 1962 über die Erhebung
    von Ausgleichsabgaben bei der Einfuhr von Schokolade, Schokoladewaren und kakaohaltigen
    Zuckerwaren, nicht alkoholhaltig, sowie von kakaohaltigen oder schokoladehaltigen
    Zubereitungen, aus den anderen Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '63/431/CEE: Decisione della Commissione del 4 luglio 1963 relativa ad
    una nuova proroga e modifica della propria decisione del 9 ottobre 1962 che autorizza
    la riscossione di tasse di compensazione sulle importazioni in Francia di cioccolata,
    di dolciumi e di preparazioni contenenti cacao o cioccolata, senza alcolici, in
    provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/431/EEG: Beschikking van de Commissie van 4 juli 1963 houdende nieuwe
    verlenging en wijziging van haar beschikking van 9 oktober 1962, houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Franse Republiek
    van chocolade en van suikerwerk en voedingsmiddelen met cacao of met chocolade
    zonder likeur, uit de andere Lid-Staten'
  type: main
