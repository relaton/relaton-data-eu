    miżuri speċifiċi restrittivi diretti kontra ċerti persuni u entitajiet assoċjati
    ma' Usama bin Laden, in-netwerk ta' Al-Qaida u t-Taliban
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1190/2005 van de Commissie van 20 juli 2005 tot 48e
    wijziging van Verordening (EG) nr. 881/2002 van de Raad tot vaststelling van bepaalde
