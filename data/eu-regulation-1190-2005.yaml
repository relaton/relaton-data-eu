    pasākumus, kas vērsti pret konkrētām personām un organizācijām, kas saistītas
    ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban, un ar kuru atceļ Padomes Regulu
    (EK) Nr. 467/2001
  type: main
