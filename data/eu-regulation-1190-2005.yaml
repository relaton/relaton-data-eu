    osoba i subjekata povezanih s Osamom Bin Ladenom, mrežom Al-Qaidom i talibanima
    te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1190/2005/EK rendelete (2005. július 20.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a tálibokkal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet 48. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1190/2005 della Commissione, del 20 luglio 2005, recante
    quarantottesima modifica del regolamento (CE) n. 881/2002 del Consiglio che impone
    specifiche misure restrittive nei confronti di determinate persone ed entità
    associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento
    (CE) n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1190/2005 (2005. gada 20. jūlijs), ar ko 48.
