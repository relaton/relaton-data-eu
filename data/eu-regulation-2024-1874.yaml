  content: Commission Implementing Regulation (EU) 2024/1874 of 8 July 2024 amending
    Implementing Regulation (EU) 2020/2235 laying down rules for the application of
    Regulations (EU) 2016/429 and (EU) 2017/625 of the European Parliament and of
    the Council as regards model animal health certificates, model official certificates
    and model animal health/official certificates for the entry into the Union and
    movements within the Union of consignments of certain categories of animals and
    goods, and official certification regarding such certificates
  type: main
- language: fr
