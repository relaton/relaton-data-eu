    d’application des règlements (UE) 2016/429 et (UE) 2017/625 du Parlement européen
    et du Conseil en ce qui concerne les modèles de certificat zoosanitaire, les
    modèles de certificat officiel et les modèles de certificat zoosanitaire/officiel
    pour l’entrée dans l’Union et les mouvements au sein de l’Union d’envois
    de certaines catégories d’animaux et de biens, ainsi qu’en ce qui concerne
    la certification officielle relative à ces certificats
