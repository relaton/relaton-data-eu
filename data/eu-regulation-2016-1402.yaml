  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1402 of 22 August 2016 withdrawing
    the acceptance of the undertaking for three exporting producers under Implementing
    Decision 2013/707/EU confirming the acceptance of an undertaking offered in connection
    with the anti-dumping and anti-subsidy proceedings concerning imports of crystalline
    silicon photovoltaic modules and key components (i.e. cells) originating in or
    consigned from the People's Republic of China for the period of application of
    definitive measures
  type: main
- language: fr
