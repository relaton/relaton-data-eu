  content: Regolamento (CEE) n. 1897/81 della Commissione, del 9 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili alla vitamina C della
    sottovoce 29.38 B IV della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
