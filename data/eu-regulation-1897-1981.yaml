title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1897/81 of 9 July 1981 re-establishing the
    levying of customs duties on vitamin C, falling within subheading 29.38 B IV and
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1897/81 de la Commission, du 9 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables à la vitamine
    C, de la sous-position 29.38 B IV du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1897/81 der Kommission vom 9. Juli 1981 zur Wiedereinführung
    der Erhebung der Zölle für Vitamin C der Tarifstelle 29.38 B IV, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1897/81 af 9. juli 1981 om genindførelse
    af opkrævning af told for vitamin C henhørende under pos. 29.38 B IV og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
