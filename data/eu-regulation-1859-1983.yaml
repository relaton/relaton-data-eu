  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1859/83 della Commissione del 7 luglio 1983 che ripristina
    la riscossione dei dazi doganali applicabili alla melammina della sottovoce 29.35
    ex Q della tariffa doganale comune, originaria del Kuwait beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1859/83 van de Commissie van 7 juli 1983 houdende
