title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1859/83 of 7 July 1983 re-establishing the
    levying of customs duties on melamine falling within subheading 29.35 ex Q and
    originating in Kuwait, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1859/83 de la Commission du 7 juillet 1983 portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire du Koweit,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1859/83 der Kommission vom 7. Juli 1983 zur Wiedereinführung
    der Erhebung der Zölle für Melamin der Tarifstelle 29.35 ex Q, mit Ursprung
    in Kuwait, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1859/83 af 7. juli 1983 om genindførelse
    af opkrævning af told for melamin, henhørende under pos. 29.35 ex Q og med oprindelse
    i Kuwait, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3377/82
  type: main
- language: el
  script: Grek
