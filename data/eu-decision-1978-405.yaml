id: EUDecision1978405
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 March 1978 authorizing the French Republic not
    to apply Community treatment to bleached or unbleached cotton fabric and woven
    fabrics of man-made fibres (discontinuous or waste), falling within heading No
    ex 55.09 or subheading ex 56.07 A of the Common Customs Tariff, originating in
    Thailand and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/405/CEE: Décision de la Commission, du 20 mars 1978, autorisant la
    République française à exclure du traitement communautaire les tissus écrus
    et blanchis de coton et de fibres textiles synthétiques discontinues, de la position
    Ex 55.09 et de la sous-position 56.07 A du Tarif douanier commun, originaires
    de Thaïlande et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Thailand stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche rohe oder gebleichte Gewebe aus Baumwolle und Gewebe
    aus synthetischen oder künstlichen Spinnfasern, der Tarifnummern ex 55.09 und
    ex 56.07 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 20. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage blegede eller ublegede bomuldsstoffer
    og vævet stof af korte kemofibre eller affald af kemofibre, som henhører under
    pos. ex 55.09 og ex 56.07 A i den fælles toldtarif, har oprindelse i Thailand,
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario tessuti greggi o imbianchiti
    di cotone e tessuti di fibre tessili sintetiche ed artificiali in fiocco della
    voce ex 55.09 e della sottovoce ex 56.07 A della tariffa doganale comune, originari
    della Tailandia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 maart 1978 waarbij de Franse Republiek
    gemachtigd wordt ongebleekte of gebleekte weefsels van katoen en weefsels van
    synthetische of van kunstmatige stapelvezels, van de posten ex 55.09 en ex 56.07
    A van het gemeenschappelijk douanetarief, van oorsprong uit Thailand en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
