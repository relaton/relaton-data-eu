title:
- language: en
  script: Latn
  content: '2007/584/EC: Commission Decision of 21 August 2007 amending Decision 2004/558/EC
    implementing Council Directive 64/432/EEC as regards additional guarantees for
    intra-Community trade in bovine animals relating to infectious bovine rhinotracheitis
    and the approval of the eradication programmes presented by certain Member States
    (notified under document number C(2007) 3905)'
  type: main
- language: fr
  script: Latn
  content: '2007/584/CE: Décision de la Commission du 21 août 2007 modifiant la
    décision 2004/558/CE mettant en œuvre la directive 64/432/CEE du Conseil en
    ce qui concerne des garanties additionnelles pour les échanges intracommunautaires
    de bovins en rapport avec la rhinotrachéite infectieuse bovine et l''approbation
    des programmes d''éradication présentés par certains États membres [notifiée
    sous le numéro C(2007) 3905]'
  type: main
- language: de
  script: Latn
  content: '2007/584/EG: Entscheidung der Kommission vom 21. August 2007 zur Änderung
