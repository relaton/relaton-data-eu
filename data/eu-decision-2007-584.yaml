    hinsichtlich ergänzender Garantien im innergemeinschaftlichen Handel mit Rindern
    in Bezug auf die infektiöse bovine Rhinotracheitis und der Genehmigung der von
    einigen Mitgliedstaaten vorgelegten Tilgungsprogramme (Bekannt gegeben unter Aktenzeichen
    K(2007) 3905)'
