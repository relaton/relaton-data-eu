title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 550/89 of 1 March 1989 re-establishing the
    levying of customs duties on reception apparatus for radio-telephony, radio- telegraphy
    or radio-broadcasting falling within CN codes 8527, 8528 and 8529, originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 550/89 de la Commission du 1er mars 1989 portant rétablissement
