title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 73/87 of 12 January 1987 amending the list
    of ACP countries in Regulation (EEC) No 486/85 on the arrangements applicable
    to agricultural products and certain goods resulting from the processing of agricultural
    products originating in the African, Caribbean and Pacific States or in the overseas
    countries and territories (OCT)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 73/87 de la Commission du 12 janvier 1987 modifiant,
    en ce qui concerne la liste des pays et territoires d' outre-mer, le règlement
    (CEE) n° 486/85 relatif au régime applicable à des produits agricoles et à
    certaines marchandises résultant de la transformation de produits agricoles originaires
    des États d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires
    d' outre-mer (PTOM)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 73/87 der Kommission vom 12. Januar 1987 zur Änderung
    der Verordnung (EWG) Nr. 486/85 des Rates über die Regelung für landwirtschaftliche
    Erzeugnisse und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren
    mit Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifischen
    Ozean oder in den überseeischen Ländern und Gebieten bezüglich der Liste der
    überseeischen Länder und Gebiete (ÜLG)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 73/87 af 12. januar 1987 om ændring
    for så vidt angår listen over oversøiske lande og territorier af forordning
    (EØF) nr. 486/85 om den ordning, der skal gælde for landbrugsprodukter og visse
    varer fremstillet af landbrugsprodukter med oprindelse i staterne i Afrika, Vestindien
    og Stillehavet eller i de oversøiske lande og territorier
  type: main
- language: el
  script: Grek
