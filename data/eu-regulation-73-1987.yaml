    αφορά τον κατάλογο των ΥΧΕ, τον κανονισμό (ΕΟΚ)
    αριθ. 486/85 του Συμβουλίου σχετικά με το καθεστώς
    που εφαρμόζεται σε γεωργικά προϊόντα και σε
    ορισμένα εμπορεύματα που προκύπτουν από τη
