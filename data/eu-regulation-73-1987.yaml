  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 73/87 della Commissione del 12 gennaio 1987 che modifica,
    per quanto riguarda l' elenco dei PTOM, il regolamento (CEE) n. 486/85 relativo
    al regime applicabile a taluni prodotti agricoli ed a talune merci risultanti
    dalla trasformazione di prodotti agricoli, originari degli Stati dell' Africa,
    dei Caraibi e del Pacifico (Stati ACP) o dei paesi e territori d' oltremare (PTOM)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 73/87 van de Commissie van 12 januari 1987 tot wijziging,
    met betrekking tot de lijst van de LGO, van Verordening (EEG) nr. 486/85 van de
    Raad inzake de regeling voor landbouwprodukten en bepaalde door verwerking van
    landbouwprodukten verkregen goederen, van oorsprong uit de Staten in Afrika, het
    Caribische gebied en de Stille Oceaan of uit de landen en gebieden overzee (LGO)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 73/87 da Comissão de 12 de Janeiro de 1987 que
