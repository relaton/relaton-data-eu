  content: Rozporządzenie wykonawcze Komisji (UE) 2016/1054 z dnia 29 czerwca 2016
    r. zmieniające rozporządzenie wykonawcze Rady (UE) nr 1238/2013 nakładające
    ostateczne cło antydumpingowe oraz stanowiące o ostatecznym poborze cła tymczasowego
    na przywóz modułów fotowoltaicznych z krzemu krystalicznego i głównych komponentów
    (tj. ogniw) pochodzących lub wysyłanych z Chińskiej Republiki Ludowej oraz
    rozporządzenie wykonawcze Rady (UE) nr 1239/2013 nakładające ostateczne cło
    wyrównawcze na przywóz modułów fotowoltaicznych z krzemu krystalicznego i
