  script: Latn
  content: Regolamento di esecuzione (UE) 2016/1054 della Commissione, del 29 giugno
    2016, che modifica il regolamento di esecuzione (UE) n. 1238/2013 del Consiglio,
    che istituisce un dazio antidumping definitivo sulle importazioni di moduli fotovoltaici
    in silicio cristallino e delle loro componenti essenziali (celle) originari o
    provenienti dalla Repubblica popolare cinese, e il regolamento di esecuzione (UE)
