  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/1054 на Комисията
    от 29 юни 2016 година за изменение на Регламент
    за изпълнение (ЕС) № 1238/2013 на Съвета за налагане
    на окончателно антидъмпингово мито върху вноса
    на кристални силициеви фотоволтаични модули
    и ключови компоненти (т.е. елементи) с произход
    или изпратени от Китайската народна република
    и Регламент за изпълнение (ЕС) № 1239/2013 на Съвета
    за налагане на окончателно изравнително мито
    върху вноса на кристални силициеви фотоволтаични
    модули и ключови компоненти (т.е. елементи)
    с произход или изпратени от Китайската народна
    република
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/1054 ze dne 29. června 2016,
    kterým se mění prováděcí nařízení Rady (EU) č. 1238/2013, kterým se
    ukládá konečné antidumpingové clo a s konečnou platností vybírá uložené
    prozatímní clo na dovoz krystalických křemíkových fotovoltaických modulů
    a jejich klíčových komponentů (tj. článků) pocházejících nebo odesílaných
    z Čínské lidové republiky, a prováděcí nařízení Rady (EU) č. 1239/2013,
    kterým se ukládá konečné vyrovnávací clo na dovoz krystalických křemíkových
    fotovoltaických modulů a jejich klíčových komponentů (tj. článků) pocházejících
    nebo odesílaných z Čínské lidové republiky
  type: main
