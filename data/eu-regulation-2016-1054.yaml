title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1054 of 29 June 2016 amending
    Council Implementing Regulation (EU) No 1238/2013 imposing a definitive anti-dumping
    duty on imports of crystalline silicon photovoltaic modules and key components
    (i.e. cells) originating in or consigned from the People's Republic of China and
    Council Implementing Regulation (EU) No 1239/2013 imposing a definitive countervailing
    duty on imports of crystalline silicon photovoltaic modules and key components
    (i.e. cells) originating in or consigned from the People's Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/1054 de la Commission du 29 juin 2016
    modifiant le règlement d'exécution (UE) n° 1238/2013 du Conseil instituant
    un droit antidumping définitif sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) originaires ou
    en provenance de la République populaire de Chine et le règlement d'exécution
    (UE) n° 1239/2013 du Conseil instituant un droit compensateur définitif sur
    les importations de modules photovoltaïques en silicium cristallin et leurs composants
    essentiels (cellules) originaires ou en provenance de la République populaire
    de Chine
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/1054 der Kommission vom 29. Juni 2016
    zur Änderung der Durchführungsverordnung des Rates (EU) Nr. 1238/2013 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Fotovoltaikmodulen aus
    kristallinem Silicium und Schlüsselkomponenten davon (Zellen) mit Ursprung in
    oder versandt aus der Volksrepublik China und der Durchführungsverordnung des
    Rates (EU) Nr. 1239/2013 zur Einführung eines endgültigen Ausgleichszolls auf
    die Einfuhren von Fotovoltaikmodulen aus kristallinem Silicium und Schlüsselkomponenten
    davon (Zellen) mit Ursprung in oder versandt aus der Volksrepublik China
  type: main
