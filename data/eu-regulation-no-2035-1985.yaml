title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2035/85 of 23 July 1985 re-establishing
    the levying of customs duties on methanol (methyl alcohol) falling within subheading
    29.04 A I, originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2035/85 de la Commission du 23 juillet 1985 portant
    rétablissement de la perception des droits de douane applicables au méthanol
    (alcool méthylique), de la sous-position 29.04 A I du tarif douanier commun,
    originaire de Roumanie, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2035/85 der Kommission vom 23. Juli 1985 zur Wiedereinführung
    der Erhebung der Zölle für Methanol (Methylalkohol) der Tarifstelle 29.04 A
    I mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2035/85 af 23. juli 1985 om genindførelse
    af opkrævning af told for methanol (methylalkohol) henhørende under pos. 29.04
    A I og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2035/85 της Επιτροπής
    της 23ης Ιουλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τη μεθανόλη (μεθυλική
    αλκοόλη) της διακρίσεως 29.04 Α Ι του Κοινού Δασμολογίου,
    καταγωγής Ρουμανίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2035/85 della Commissione del 23 luglio 1985 che ripristina
    la riscossione dei dazi doganali applicabili al metanolo (alcole metilico), della
    sottovoce 29.04 A I della tariffa doganale comune, originario della Romania beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2035/85 van de Commissie van 23 juli 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op methanol (methylalcohol)
