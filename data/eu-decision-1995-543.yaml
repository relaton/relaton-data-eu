    operaciones de transporte de la aplicación de la Directiva 89/684/CEE del Consejo
    relativa a la formación profesional de los conductores de vehículos que transporten
    mercancías por carretera (El texto en lengua inglesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '95/543/EG: Kommissionens beslut av den 11 december 1995 om Förenade kungarikets
