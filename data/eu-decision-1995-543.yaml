title:
- language: en
  script: Latn
  content: '95/543/EC: Commission Decision of 11 December 1995 concerning the request
    from the United Kingdom to the Commission to exempt certain transport operations
    from the application of Council Directive 89/684/EEC on vocational training for
    certain drivers of vehicles carrying dangerous goods by road (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/543/CE: Décision de la Commission, du 11 décembre 1995, relative
    à la demande adressée par le Royaume-Uni à la Commission en vue de dispenser
    certaines opérations de transport de l''application de la directive 89/684/CEE
    du Conseil concernant la formation professionnelle de certains conducteurs de
    véhicules transportant des marchandises dangereuses par route (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '95/543/EG: Entscheidung der Kommission vom 11. Dezember 1995 über den
    Antrag des Vereinigten Königreichs, bestimmte Transporte von der Anwendung der
    Richtlinie 89/684/EWG des Rates über die Schulung der Fahrer von Fahrzeugen zur
    Beförderung gefährlicher Güter auf der Straße auszunehmen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/543/EF: Kommissionens beslutning af 11. december 1995 vedrørende en
    anmodning fra Det Forenede Kongerige til Kommissionen om at måtte undtage visse
    transportoperationer fra Rådets direktiv 89/684/EØF om erhvervsuddannelse for
    visse førere af køretøjer, der transporterer farligt gods ad vej (Kun den engelske
    tekst er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/543/ΕΚ: Απόφαση της Επιτροπής, της 11ης Δεκεμβρίου
    1995, σχετικά με την αίτηση που υπέβαλε το Ηνωμένο
    Βασίλειο στην Επιτροπή με σκοπό να εξαιρεθούν
    ορισμένες μεταφορές από την εφαρμογή της οδηγίας
    αριθ. 89/684/ΕΟΚ του Συμβουλίου για την επαγγελματική
    κατάρτιση ορισμένων οδηγών οχημάτων που μεταφέρουν
    οδικώς επικίνδυνα εμπορεύματα (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/543/EY: Komission päätös, tehty 11 päivänä joulukuuta 1995, Yhdistyneen
    kuningaskunnan komissiolle esittämästä pyynnöstä vapauttaa tietyt kuljetukset
    vaarallisten aineiden tiekuljetuksissa käytettävien ajoneuvojen kuljettajien
    ammatillisesta koulutuksesta annetun neuvoston direktiivin 89/684/ETY soveltamisesta
    (Ainoastaan englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/543/CE: Decisione della Commissione, dell''11 dicembre 1995, relativa
    alla domanda presentata dal Regno Unito alla Commissione per dispensare talune
    operazioni di trasporto dell''applicazione della direttiva 89/684/CEE del Consiglio
    relativa alla formazione professionale di taluni conducenti di veicoli che trasportano
    merci pericolose su strada (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/543/EG: Beschikking van de Commissie van 11 december 1995 inzake het
    door het Verenigd Koninkrijk aan de Commissie gerichte verzoek om bepaalde transporten
    vrij te stellen van de toepassing van Richtlijn 89/684/EEG van de Raad betreffende
    de beroepsopleiding van bepaalde bestuurders van voertuigen voor het vervoer van
    gevaarlijke goederen over de weg (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/543/CE: Decisão da Comissão, de 11 de Dezembro de 1995, relativo
    ao pedido do Reino Unido à Comissão com vista a permitir isentar determinadas
    operações de transporte da aplicação da Directiva 89/684/CEE do Conselho relativa
    à formação profissional de certos condutores de veículos que transportam mercadorias
    perigosas por estrada (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '95/543/CE: Decisión de la Comisión, de 11 de diciembre de 1995, relativa
