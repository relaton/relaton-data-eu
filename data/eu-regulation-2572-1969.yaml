title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2572/69 de la Commission, du 22 décembre 1969, abrogeant
    le règlement (CEE) n° 2185/69 ainsi que l'article 5 du règlement (CEE) n°
    1666/69 concernant la constatation des prix des veaux et des gros bovins dans
    la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2572/69 der Kommission vom 22. Dezember 1969 zur Aufhebung
    der Verordnung (EWG) Nr. 2185/69 sowie zur Aufhebung des Artikels 5 der Verordnung
    (EWG) Nr. 1666/69 über die Feststellung der Preise für Kälber und ausgewachsene
    Rinder in der Gemeinschaft
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2572/69 della Commissione, del 22 dicembre 1969, che
    abroga il regolamento (CEE) n. 2185/69 nonché l'articolo 5 del regolamento (CEE)
    n. 1666/69 per quanto riguarda la constatazione dei prezzi dei vitelli e dei bovini
    adulti nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2572/69 van de Commissie van 22 december 1969 houdende
    intrekking van Verordening (EEG) nr. 2185/69, evenals van artikel 5 van Verordening
    (EEG) nr. 1666/69 met betrekking tot de constatering der prijzen voor kalveren
    en voor volwassen runderen in de Gemeenschap
  type: main
