    für hochwertiges frisches, gekühltes oder gefrorenes Rindfleisch und gefrorenes
    Büffelfleisch und der Verordnung (EWG) Nr. 139/81 zur Festlegung der Bedingungen
    für die Zulassung bestimmten gefrorenen Rindfleisches zur Unterposition 0202
    30 50 der Kombinierten Nomenklatur
  type: main
- language: da
  script: Latn
