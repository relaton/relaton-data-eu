  content: '88/20/EEC: Commission Decision of 22 December 1987 approving a specific
    programme for the improvement of processing and marketing structures in the Spanish
    wine- growing sector forwarded by Spain under Council Regulation (EEC) No 355/77
    (only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/20/CEE: Décision de la Commission du 22 décembre 1987 portant approbation
