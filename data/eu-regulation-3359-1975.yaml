  content: Regulation (EEC) No 3359/75 of the Commission of 23 December 1975 determining
    the amounts of the variable components, compensatory amounts and additional duties
    applicable during the first quarter of 1976 on the importation of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3359/75 de la Commission, du 23 décembre 1975, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le premier trimestre de l'année
    1976, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3359/75 der Kommission vom 23. Dezember 1975 zur Festsetzung
    der Höhe der im ersten Vierteljahr 1976 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3359/75 af 23. december 1975 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    indførsel af varer henhørende under forordning (EØF) nr. 1059/69 i første
    kvartal 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3359/75 della Commissione, del 23 dicembre 1975, che
    determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il primo trimestre 1976,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3359/75 van de Commissie van 23 december 1975 tot
    vaststelling van het beloop der gedurende het eerste kwartaal van 1976 bij invoer
    van onder Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele
    elementen, compenserende bedragen en aanvullende invoerrechten
