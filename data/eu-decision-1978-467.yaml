id: EUDecision1978467
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 May 1978 authorizing the United Kingdom not to
    apply Community treatment to fabrics of jute falling within heading No 57.10 of
    the Common Customs Tariff, originating in India and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '78/467/CEE: Décision de la Commission, du 11 mai 1978, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tissus de jute, de la position
    57.10 du Tarif douanier commun, originaires d''Inde et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. Mai 1978, mit der das Vereinigte Königreich
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Gewebe aus Jute der Tarifnummer 57.10 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. maj 1978 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage stof af jute, som henhører
    under pos. 57.10 i den fælles toldtarif, har oprindelse i Indien og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 maggio 1978, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i tessuti di iuta della voce 57.10
    della tariffa doganale comune, originari dell'India e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 mei 1978 waarbij het Verenigd Koninkrijk
    wordt gemachtigd weefsels van jute, van post 57.10 van het gemeenschappelijk douanetarief,
    van oorsprong uit India en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
