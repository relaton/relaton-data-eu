id: EURegulation24281975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2428/75 of the Commission of 24 September 1975 re-establishing
    the levying of customs duties on outer garments and other articles, knitted or
    crocheted, not elastic or rubberized, of cotton, falling within subheading 60.05
    A ex II and ex B, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2428/75 de la Commission, du 24 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus, accessoires du vêtement et autres articles de bonneterie non élastique
    ni caoutchoutée, de coton, de la sous-position tarifaire 60.05 A EX II et EX
    B, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2428/75 der Kommission vom 24. September 1975 über
    die Wiedereinführung des Zollsatzes für Oberkleidung, Bekleidungszubehör und
    andere Wirkwaren, weder gummielastisch noch kautschutiert, aus Baumwolle, der
    Tarifstelle 60.05 A ex II und ex B, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2428/75 af 24. september 1975 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og andre varer af
    trikotage, af bomuld, under underposition 60.05 A ex II, ex B, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2428/75 della Commissione, del 24 settembre 1975,
    che ripristina la riscossione dei dazi doganali applicabili agli indumenti esterni,
    accessori di abbigliamento ed altri manufatti, a maglia non elastica né gommata,
    di cotone della sottovoce doganale n. 60.05 A ex II e ex B originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2428/75 van de Commissie van 24 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bovenkleding,
    kledingtoebehoren en andere artikelen van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk van katoen van onderverdeling 60.05 A ex II, ex B, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3046/74
    van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
