title:
- language: en
  script: Latn
  content: Council Decision of 27 February 1998 repealing Common Position 97/625/CFSP,
    defined by the Council on the basis of Article J.2 of the Treaty on European Union,
    on restrictive measures to be taken against persons in Bosnia and Herzegovina
    acting against the peace agreements
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 27 février 1998 abrogeant la position commune
    97/625/PESC définie par le Conseil sur la base de l'article J.2 du traité sur
    l'Union européenne, concernant des mesures restrictives à prendre à l'encontre
    des personnes en Bosnie-Herzégovine agissant contre les accords de paix
  type: main
- language: de
  script: Latn
  content: Beschluß des Rates vom 27. Februar 1998 zur Aufhebung des Gemeinsamen
    Standpunkts 97/625/GASP - vom Rat aufgrund von Artikel J.2 des Vertrags über
    die Europäische Union festgelegt - betreffend Maßnahmen gegenüber den Personen
    in Bosnien-Herzegowina, die den Friedensabkommen zuwiderhandeln
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse af 27. februar 1998 om ophævelse af fælles holdning
    97/625/FUSP fastlagt af Rådet på grundlag af artikel J.2 i traktaten om Den
    Europæiske Union, vedrørende restriktive foranstaltninger mod de personer i
    Bosnien-Hercegovina, der modarbejder fredsaftalerne
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 27ης Φεβρουαρίου
    1998 με την οποία καταργείται η κοινή θέση 97/625/ΚΕΠΠΑ
    που καθόρισε το Συμβούλιο δυνάμει του άρθρου
    Ι.2 της συνθήκης για την Ευρωπαϊκή Ένωση, σχετικά
    με τη λήψη περιοριστικών μέτρων κατά των αντιδρούντων
    στις ειρηνευτικές συμφωνίες στη Βοσνία-Ερζεγοβίνη
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 27 päivänä helmikuuta 1998, yhteisen kannan
    97/625/YUTP, jonka neuvosto on määritellyt Euroopan unionista tehdyn sopimuksen
    J.2 artiklan perusteella rauhansopimusten vastaisesti Bosnia ja Hertsegovinassa
    toimivia henkilöitä koskevista rajoittavista toimenpiteistä, kumoamisesta
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio del 27 febbraio 1998 che abroga la posizione comune
    97/625/PESC, definita dal Consiglio a norma dell'articolo J.2 del trattato sull'Unione
    europea, su provvedimenti restrittivi nei confronti di persone che in Bosnia-Erzegovina
    agiscono contro gli accordi di pace
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 27 februari 1998 tot intrekking van Gemeenschappelijk
    Standpunt 97/625/GBVB, vastgesteld door de Raad op basis van artikel J.2 van het
    Verdrag betreffende de Europese Unie, inzake beperkende maatregelen tegen personen
    in Bosnië-Herzegovina die in strijd met de vredesakkoorden handelen
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho de 27 de Fevereiro de 1998 que revoga a Posição
    Comum 97/625/PESC, definida pelo Conselho com base no artigo J.2 do Tratado da
    União Europeia, relativa às medidas restritivas a aplicar às pessoas na Bósnia-
    Herzegovina que atentem contra os acordos de paz
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo de 27 de febrero de 1998 por la que se deroga la
    Posición común 97/625/PESC, definida por el Consejo con arreglo al artículo
    J.2 del Tratado de la Unión Europea, sobre las medidas restrictivas que deben
    tomarse contra personas en Bosnia y Herzegovina que cometan actos contra los acuerdos
    de paz
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 27 februari 1998 om upphävande av den gemensamma
    ståndpunkten 97/625/GUSP fastställd av rådet på grundval av artikel J 2 i
    Fördraget om Europeiska unionen om restriktiva åtgärder mot personer i Bosnien
    och Hercegovina som handlar i strid mot fredsavtalen
  type: main
