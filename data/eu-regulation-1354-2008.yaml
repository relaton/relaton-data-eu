  type: main
- language: hu
  script: Latn
  content: A Tanács 1354/2008/EK rendelete ( 2008. december 18. ) az egyes Indiából
    származó grafitelektróda-rendszerek importjára vonatkozó végleges kiegyenlítő
    vám kivetéséről szóló 1628/2004/EK rendelet módosításáról és az egyes
    Indiából származó grafitelektróda-rendszerek importjára vonatkozó végleges
    dömpingvám kivetéséről szóló 1629/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1354/2008 del Consiglio, del 18 dicembre 2008 , che
    modifica il regolamento (CE) n. 1628/2004 che istituisce un dazio compensativo
    sulle importazioni di alcuni sistemi di elettrodi di grafite originarie dell’India
    e il regolamento (CE) n. 1629/2004 che istituisce un dazio antidumping definitivo
    sulle importazioni di alcuni sistemi di elettrodi di grafite originarie dell’India
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1354/2008 ( 2008. gada 18. decembris ) par grozījumiem
    Regulā (EK) Nr. 1628/2004, ar kuru uzliek galīgo kompensācijas maksājumu tādu
