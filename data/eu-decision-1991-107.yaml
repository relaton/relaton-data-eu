  content: '91/107/EEC: Commission Decision of 13 February 1991 authorizing certain
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of sawn wood of conifers originating in the United States
    of America (Only the Spanish, German, Greek, English, French, Italian, Dutch and
    Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/107/CEE: Décision de la Commission du 13 février 1991 autorisant
    certains États membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne le bois scié de conifères
    originaires des États-Unis d''Amérique (Les textes en langues espagnole, allemande,
    grecque, anglaise, française, italienne, néerlandaise et portugaise sont les
    seuls faisant foi.)'
  type: main
