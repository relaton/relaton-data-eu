title:
- language: en
  script: Latn
  content: '78/830/EEC: Commission Decision of 22 September 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to bed linen, woven, falling within subheading ex
    62.02 B of the Common Customs Tariff (NIMEXE codes 62.02-11, 19), originating
    in Romania and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/830/CEE: Décision de la Commission, du 22 septembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le linge de lit, tissé, de la sous-position
    ex 62.02 B du tarif douanier commun (codes Nimexe: 62.02-11; 19), originaire de
    Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/830/EWG: Entscheidung der Kommission vom 22. September 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Kónigreich der
    Niederlande ermáchtigt werden, aus Rumánien stammende und in den úbrigen Mitgliedstaaten
    im freien Verkehr befindliche Bettwásche aus Geweben, der Tarifstelle ex 62.02
    B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.02-11; 19) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/830/EØF: Kommissionens beslutning af 22. september 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage sengelinned, vævet, som henhører under
    pos. ex 62.02 B i den fælles toldtarif (NIMEXE-kode 62.02-11, 19), har oprindelse
    i Rumænien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/830/CEE: Decisione della Commissione, del 22 settembre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario biancheria da letto, tessuta, della voce
    ex 62.02 B della tariffa doganale comune (codice Nimexe: 62.02-11; 19), originaria
    della Romania e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/830/EEG: Beschikking van de Commissie van 22 september 1978 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd beddelinnen, geweven, van post ex 62.02 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 62.02-11 ; 19), van oorsprong uit Roemenië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
