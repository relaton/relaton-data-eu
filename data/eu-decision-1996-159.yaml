title:
- language: en
  script: Latn
  content: '96/159/Euratom, EC: Commission Decision of 6 February 1996 amending Decision
    92/164/EEC, Euratom authorizing Portugal to use statistics for years earlier than
    the last year but one for the calculation of the VAT own resources base (Only
    the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/159/Euratom, CE: Décision de la Commission, du 6 février 1996, modifiant
    la décision 92/164/CEE, Euratom autorisant le Portugal à utiliser des données
    statistiques antérieures à la pénultième année pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/159/Euratom, EG: Entscheidung der Kommission vom 6. Februar 1996 zur
    Änderung der Entscheidung 92/164/EWG, Euratom, mit der Portugal ermächtigt wird,
    statistische Angaben aus Jahren vor dem vorletzten Jahr vor dem betreffenden Haushaltsjahr
    bei der Berechnung der Grundlage für die MwSt.-Eigenmittel zu verwenden (Nur
    der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/159/Euratom, EF: Kommissionens beslutning af 6. februar 1996 om ændring
    af beslutning 92/164/EØF, Euratom om bemyndigelse af Portugal til at beregne
    grundlaget for Fællesskabernes momsindtægter på basis af statistiske oplysninger
    hidrørende fra år, der ligger længere tilbage end det næstsidste år (Kun
    den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/159/Ευρατόμ, ΕΚ: Απόφαση της Επιτροπής,
    της 6ης Φεβρουαρίου 1996, για την τροποποίηση
    της απόφασης 92/164/ΕΟΚ, Ευρατόμ, με την οποία
    επιτρέπεται στην Πορτογαλία να χρησιμοποιεί
    στατιστικά δεδομένα προγενέστερα εκείνων
    του προτελευταίου έτους κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο της προστιθέμενης αξίας (Το κείμενο
    στην πορτογαλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/159/Euratom, EY: Komission päätös, tehty 6 päivänä helmikuuta
    1996, Portugalille annetusta luvasta käyttää toiseksi viimeistä vuotta edeltäviä
    tilastotietoja arvonlisäverosta kertyvien omien varojen laskentaperusteena tehdyn
    päätöksen 92/164/ETY, Euratom muuttamisesta (Ainoastaan portugalinkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/159/Euratom, CE: Decisione della Commissione, del 6 febbraio 1996,
    che modifica la decisione 92/164/CEE, Euratom che autorizza la Repubblica portoghese
    a utilizzare dati statistici anteriori al penultimo anno per il calcolo della
    base delle risorse proprie provenienti dell''IVA (Il testo in portoghese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/159/Euratom, EG: Beschikking van de Commissie van 6 februari 1996 tot
    wijziging van Beschikking 92/164/EEG, Euratom waarbij Portugal wordt gemachtigd
    statistische gegevens van vóór het voorlaatste jaar te gebruiken voor de berekening
    van de grondslag van de eigen middelen uit de belasting over de toegevoegde waarde
    (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/159/Euratom, CE: Decisão da Comissão, de 6 de Fevereiro de 1996,
    que altera a Decisão 92/164/CEE, Euratom que autoriza Portugal a utilizar dados
    estatísticos anteriores ao penúltimo ano para o cálculo da matéria colectável
    dos recursos próprios provenientes do imposto sobre o valor acrescentado (Apenas
    faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '96/159/Euratom, CE: Decisión de la Comisión, de 6 de febrero de 1996,
    que modifica la Decisión 92/164/CEE, Euratom, por la que se autoriza a Portugal
    a utilizar datos estadísticos anteriores al penúltimo año para el cálculo
    de la base de los recursos propios procedentes del impuesto sobre el valor añadido
    (El texto en lengua portuguesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/159/Euratom, EG: Kommissionens beslut av den 6 februari 1996 om ändring
    av beslut 92/164/EEG, Euratom, som bemyndigar Portugal att använda statistiska
    uppgifter som upprättats före det näst sista året vid beräkning av den bas
    av egna medel som härrör från mervärdeskatten (Endast den portugisiska texten
    är giltig)'
  type: main
