    elettronici, detti DRAM (Dynamic Random Access Memories — Memorie dinamiche
    ad accesso casuale), originarie della Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 708/2003 van de Commissie van 23 april 2003 tot instelling
