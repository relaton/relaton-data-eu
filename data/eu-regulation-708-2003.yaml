    τύπων ηλεκτρονικών μικροκυκλωμάτων, γνωστών
    ως DRAM (δυναμικές μνήμες ταχείας προσπέλασης)
    καταγωγής Δημοκρατίας της Κορέας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 708/2003, annettu 23 päivänä huhtikuuta 2003,
    väliaikaisen tasoitustullin käyttöönotosta tiettyjen Korean tasavallasta peräisin
    olevien elektronisten mikropiirien, niin sanottujen DRAMien (dynaamisten hakumuistien),
    tuonnissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 708/2003 della Commissione, del 23 aprile 2003, che
