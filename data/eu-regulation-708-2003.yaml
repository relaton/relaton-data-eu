title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 708/2003 of 23 April 2003 imposing a provisional
    countervailing duty on imports of certain electronic microcircuits known as DRAMs
    (dynamic random access memories) originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 708/2003 de la Commission du 23 avril 2003 instituant
    un droit compensateur provisoire sur les importations de certains microcircuits
    électroniques dits "DRAM" (dynamic random access memories — mémoires dynamiques
    à accès aléatoire) originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 708/2003 der Kommission vom 23. April 2003 zur Einführung
    eines vorläufigen Ausgleichszolls auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, so genannter DRAMs (dynamische Schreib-Lesespeicher mit wahlfreiem
    Zugriff), mit Ursprung in der Republik Korea
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 708/2003 af 23. april 2003 om indførelse
    af en midlertidig udligningstold på importen af visse elektroniske mikrokredsløb,
    såkaldte DRAMs (Dynamic Random Access Memories), med oprindelse i Republikken
    Korea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 708/2003 της Επιτροπής,
