  content: Commission Regulation (EEC) No 3926/87 of 28 December 1987 amending Regulation
    (EEC) No 3655/87 on the sale at prices fixed at a standard rate in advance of
    certain beef from intervention stocks for processing in particular in the Valtellina
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3926/87 de la Commission, du 28 décembre 1987, modifiant
    le règlement (CEE) n 3655/87 relatif à la vente à prix fixé forfaitairement
    à l'avance, en vue de leur transformation notamment dans le territoire de la
    Valtelline, de certaines viandes bovines provenant des stocks d'intervention
  type: main
- language: de
  script: Latn
