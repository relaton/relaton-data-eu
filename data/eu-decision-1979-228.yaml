title:
- language: en
  script: Latn
  content: '79/228/EEC: Commission Decision of 9 February 1979 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton, other than
    gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle
    and other net fabrics, falling within heading No 55.09 of the Common Customs Tariff
    (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29,
    31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65,
    66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93,
    97) (category 2), originating in Romania and in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/228/CEE: Décision de la Commission, du 9 février 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton autres que tissus à point de gaze, bouclés du genre éponge, rubannerie,
    velours, peluche, tissus bouclés, tissus de chenille, tulles et tissus à mailles
    nouées, de la position ex 55.09 du tarif douanier commun (codes Nimexe: 55.09-01,
    02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39,
    41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71,
    72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) catégorie 2, originaires
    de Roumanie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/228/EWG: Entscheidung der Kommission vom 9. Februar 1979, mit der die
    Französische Republik ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere als
    Drehergewebe, Schlingengewebe (Frottiergewebe), Bänder, Samt, Plüsch, Schlingengewebe,
    Chenillegewebe, Tülle und geknüpfte Netzstoffe, der Tarifnummer ex 55.09 des
    Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 55.09-01; 02; 03; 04; 05; 11; 12;
    13; 14; 15; 16; 17; 19; 21; 29; 31; 33; 35; 37; 38; 39; 41; 49; 51; 52; 53; 54;
    55; 56; 57; 59; 61; 63; 64; 65; 66; 67; 68; 69; 70; 71; 72; 73; 74; 76; 77; 78;
    81; 82; 83; 84; 86; 87; 92; 93; 97) (Kategorie 2) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/228/EØF: Kommissionens beslutning af 9. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    at bomuld, bortset fra drejervævet stof af bomuld, frotterstof, vævede bånd,
    fløjls-, plys- og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos.ex 55.09 i den fælles toldtarif (NIMEXE-kode 55.09-01, 02, 03, 04,
    05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51,
    52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74,
    76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) kategori 2, har oprindelse i Rumænien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/228/CEE: Decisione della Commissione, del 9 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario tessuti di cotone,
    diversi da quelli a punto di garza, ricci del tipo spugna, passamaneria, velluti,
    felpe, tessuti di ciniglia, tulli e tessuti a maglie annodate, della voce ex 55.09
    della tariffa doganale comune (codice Nimexe: 55.09-01, 02, 03, 04, 05, 11, 12,
    13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54,
    55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78,
    81, 82, 83, 84, 86, 87, 92, 93, 97) (categoria 2), originari della Romania e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/228/EEG: Beschikking van de Commissie van 9 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd weefsels van katoen, andere dan weefsels met
    gaasbinding, bad- of frotteerstof (lussendoek), lint, fluweel, pluche, lussenweefsel,
    chenilleweefsel, tule en filetweefsels, van post ex 55.09 van het gemeenschappelijk
    douanetarief (NIMEXE-code 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17,
    19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61,
