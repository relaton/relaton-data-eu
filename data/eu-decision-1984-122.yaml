title:
- language: en
  script: Latn
  content: '84/122/EEC: Commission Decision of 22 February 1984 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain textile products,
    originating in certain third countries, which have been put into free circulation
    in the Community (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/122/CEE: Décision de la Commission du 22 février 1984 autorisant
    le Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de certains produits textiles originaires de certains pays tiers et mis en libre
    pratique dans la Communauté (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '84/122/EWG: Entscheidung der Kommission vom 22. Februar 1984 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichenTextilwaren (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/122/EØF: Kommissionens beslutning af 22. februar 1984 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse tekstilprodukter med oprindelse i visse tredjelande til fri omsætning
    i Fællesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/122/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Φεβρουαρίου 1984 περί χορηγήσεως αδείας στο
    Ηνωμένο Βασίλειο να προβεί σε ενδοκοινοτική
    επιτήρηση των εισαγωγών ορισμένων υφαντουργικών
    προϊόντων, καταγωγής ορισμένων τρίτων χωρών,
    τα οποία τίθενται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/122/CEE: Decisione della Commissione del 22 febbraio 1984 che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti originari di taluni paesi terzi e messi in libera pratica nella
    Comunità (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/122/EEG: Beschikking van de Commissie van 22 februari 1984 houdende
    machtiging van het Verenigd Koninkrijk tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van bepaalde textielprodukten van oorsprong
    uit bepaalde derde landen, die in de Gemeenschap in het vrije verkeer zijn gebracht
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
