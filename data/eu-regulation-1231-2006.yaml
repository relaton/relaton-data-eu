title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1231/2006 of 16 August 2006 amending Annexes
    I and II to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin, as regards ceftiofur and polyoxyethylene sorbitan
    monooleate and trioleate
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1231/2006 de la Commission du 16 août 2006 modifiant
    les annexes I et II du règlement (CEE) n o 2377/90 du Conseil établissant une
    procédure communautaire pour la fixation des limites maximales de résidus de
    médicaments vétérinaires dans les aliments d'origine animale en ce qui concerne
    le ceftiofur ainsi que le monooléate et le trioléate de polyoxyéthylène sorbitane
  type: main
- language: de
  script: Latn
