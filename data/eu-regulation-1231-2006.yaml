    prevê um processo comunitário para o estabelecimento de limites máximos de
    resíduos de medicamentos veterinários nos alimentos de origem animal, no que
    diz respeito ao ceftiofur e ao monooleato e trioleato de polioxietileno sorbitano
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1231/2006 al Comisiei din 16 august 2006 de modificare
