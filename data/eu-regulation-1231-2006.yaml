    tal-ceftiofur u l-polyoxyethylene sorbitan monooleate u t-trioleate
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1231/2006 van de Commissie van 16 augustus 2006 tot
    wijziging van de bijlagen I en II bij Verordening (EEG) nr. 2377/90 van de Raad
