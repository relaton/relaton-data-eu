    dierlijke oorsprong, ten aanzien van ceftiofur en polyoxyethyleensorbitaanmonooleaat
    en -trioleaat
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1231/2006 z dnia 16 sierpnia 2006 r. zmieniające
