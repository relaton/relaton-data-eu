    una procedura comunitaria per la determinazione dei limiti massimi di residui
    di medicinali veterinari negli alimenti di origine animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1231/2006 ( 2006. gada 16. augusts ), ar kuru
