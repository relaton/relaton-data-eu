    medicamente de uz veterinar în alimentele de origine animală în ceea ce privește
    ceftiofurul, precum și monooleatul și trioleatul de polioxietilenă sorbitan
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1231/2006 zo 16. augusta 2006 , ktorým sa
