    wspólnotową procedurę dla określania maksymalnego limitu pozostałości weterynaryjnych
    produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego w odniesieniu
    do ceftiofuru oraz monoleinianu i trioleinianu polioksyetylenosorbitolu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1231/2006 da Comissão, de 16 de Agosto de 2006 ,
