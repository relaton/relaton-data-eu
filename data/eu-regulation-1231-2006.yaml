    kialakításáról szóló 2377/90/EGK tanácsi rendelet I. és II. mellékletének
    a ceftiofur és a polioxietilén szorbitán monoleát és trioleát tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1231/2006 della Commissione, del 16 agosto 2006 , che
    modifica, per quanto riguarda il ceftiofur e il monooleato e trioleato di poliossietilensorbitano,
