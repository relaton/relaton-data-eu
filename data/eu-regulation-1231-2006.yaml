    eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen für Tierarzneimittelrückstände
    in Nahrungsmitteln tierischen Ursprungs in Bezug auf Ceftiofur, Polyoxyethylensorbitanmonooleat
    und -trioleat
