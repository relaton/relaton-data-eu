    fir-rigward tas-sistema integrata ta’ amministrazzjoni u kontroll fil-politika
    agrikola komuni u l-applikazzjoni u l-kalkolu ta’ penali amministrattivi għall-kundizzjonalità
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1172 van de Commissie van 4 mei 2022
    tot aanvulling van Verordening (EU) 2021/2116 van het Europees Parlement en de
    Raad wat betreft het geïntegreerd beheers- en controlesysteem van het gemeenschappelijk
    landbouwbeleid en de toepassing en berekening van administratieve conditionaliteitssancties
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1172 z dnia 4 maja 2022 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/2116
    w odniesieniu do zintegrowanego systemu zarządzania i kontroli we wspólnej polityce
    rolnej oraz stosowania i obliczania wysokości kar administracyjnych w związku
    z warunkowością
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1172 da Comissão de 4 de maio de 2022 que
    complementa o Regulamento (UE) 2021/2116 do Parlamento Europeu e do Conselho no
    respeitante ao sistema integrado de gestão e de controlo no quadro da política
    agrícola comum e à aplicação e cálculo das sanções administrativas no âmbito
    da condicionalidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1172 al Comisiei din 4 mai 2022 de completare
    a Regulamentului (UE) 2021/2116 al Parlamentului European și al Consiliului în
    ceea ce privește sistemul integrat de administrare și control din cadrul politicii
    agricole comune și aplicarea și calcularea sancțiunilor administrative aferente
    condiționalității
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1172 zo 4. mája 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2021/2116 vzhľadom
    na integrovaný administratívny a kontrolný systém v rámci spoločnej poľnohospodárskej
    politiky a uplatňovanie a výpočet správnych sankcií v súvislosti s kondicionalitou
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1172 z dne 4. maja 2022 o dopolnitvi
    Uredbe (EU) 2021/2116 Evropskega parlamenta in Sveta glede integriranega administrativnega
    in kontrolnega sistema skupne kmetijske politike ter uporabe in izračuna upravnih
    sankcij v zvezi s pogojenostjo
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1172 de la Comisión de 4 de mayo de 2022
    por el que se completa el Reglamento (UE) 2021/2116 del Parlamento Europeo y del
    Consejo en lo que respecta al sistema integrado de gestión y control de la política
    agrícola común y la aplicación y el cálculo de las sanciones administrativas
    en el marco de la condicionalidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1172 av den 4 maj 2022 om
    komplettering av Europaparlamentets och rådets förordning (EU) 2021/2116 vad
    gäller det integrerade administrations- och kontrollsystemet inom den gemensamma
    jordbrukspolitiken samt tillämpningen och beräkningen av administrativa sanktioner
