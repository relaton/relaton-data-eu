    lauksaimniecības politikā integrēto administrācijas un kontroles sistēmu
    un ar nosacījumu sistēmu saistīto administratīvo sodu piemērošanu un aprēķināšanu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1172 2022 m. gegužės 4 d.
