    υπολογισμό των διοικητικών κυρώσεων για την
    αιρεσιμότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/1172, 4. mai 2022, millega täiendatakse
