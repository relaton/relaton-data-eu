  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1172 of 4 May 2022 supplementing
    Regulation (EU) 2021/2116 of the European Parliament and of the Council with regard
    to the integrated administration and control system in the common agricultural
    policy and the application and calculation of administrative penalties for conditionality
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1172 de la Commission du 4 mai 2022 complétant
    le règlement (UE) 2021/2116 du Parlement européen et du Conseil en ce qui concerne
    le système intégré de gestion et de contrôle lié à la politique agricole
    commune et l’application et le calcul des sanctions administratives en matière
    de conditionnalité
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1172 der Kommission vom 4. Mai 2022 zur
    Ergänzung der Verordnung (EU) 2021/2116 des Europäischen Parlaments und des
    Rates hinsichtlich des integrierten Verwaltungs- und Kontrollsystems im Rahmen
    der Gemeinsamen Agrarpolitik und der Verhängung und Berechnung von Verwaltungssanktionen
    im Bereich der Konditionalität
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1172 на Комисията
    от 4 май 2022 година за допълнение на Регламент
    (ЕС) 2021/2116 на Европейския парламент и на Съвета
    по отношение на интегрираната система за администриране
    и контрол в рамките на общата селскостопанска
    политика и прилагането и изчисляването на
    административните санкции във връзка с предварителните
    условия
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1172 ze dne 4. května
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2021/2116,
    pokud jde o integrovaný administrativní a kontrolní system v oblasti společné
    zemědělské politiky a uplatňování a výpočet správních sankcí v souvislosti
    s podmíněností
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1172 af 4. maj 2022 om supplerende
