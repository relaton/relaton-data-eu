    agrárpolitika keretében működő integrált igazgatási és kontrollrendszer,
    valamint a feltételességhez kapcsolódó közigazgatási szankciók alkalmazása
    és kiszámítása tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1172 della Commissione del 4 maggio 2022
    che integra il regolamento (UE) 2021/2116 del Parlamento europeo e del Consiglio
    per quanto riguarda il sistema integrato di gestione e di controllo della politica
    agricola comunee l’applicazione e il calcolo delle sanzioni amministrative per
    la condizionalità
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1172 (2022. gada 4. maijs), ar ko
