    dėl bendros žemės ūkio politikos integruotos administravimo ir kontrolės
    sistemos ir su paramos sąlygomis susijusių administracinių nuobaudų taikymo
    ir apskaičiavimo
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1172 tal-4 ta’ Mejju 2022
