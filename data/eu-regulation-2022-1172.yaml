    i kontrolnog sustava u zajedničkoj poljoprivrednoj politici te primjene i izračuna
    administrativnih kazni za uvjetovanost
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1172 felhatalmazáson alapuló rendelete (2022.
