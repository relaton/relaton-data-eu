    angår det integrerede forvaltnings- og kontrolsystem i den fælles landbrugspolitik
    og anvendelse og beregning af administrative sanktioner i forbindelse med konditionalitet
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1172
