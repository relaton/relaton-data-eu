title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2610/70 de la Commission, du 22 décembre 1970, abrogeant
    le règlement (CEE) n° 2347/70 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d'agrumes originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2610/70 der Kommission vom 22. Dezember 1970 zur Aufhebung
    der Verordnung (EWG) Nr. 2347/70 zur Anwendung des Zollsatzes des Gemeinsamen
    Zolltarifs auf Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und
    anderen ähnlichen Kreuzungen von Zitrusfrüchten mit Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2610/70 della Commissione, del 22 dicembre 1970, che
    abroga il regolamento (CEE) n. 2347/70 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    e altri ibridi similari d'agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2610/70 van de Commissie van 22 december 1970 tot
    intrekking van Verordening (EEG) nr. 2347/70 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten van
    oorsprong uit Spanje
  type: main
