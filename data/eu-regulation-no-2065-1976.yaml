    που αφορούν την πληρωμή ενισχύσεως για το αποκορυφωμένο
    γάλα εις κόνιν που μετουσιώθηκε ή μεταποιήθηκε
    σε σύνθετες ζωοτροφές στο έδαφος ενός άλλου
    κράτους μέλους»
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2065/76, annettu 20 päivänä elokuuta 1976,
