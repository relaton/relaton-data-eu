    Preisen für die Herstellung von Speiseeis und zur Aufhebung der Verordnung (EWG)
    Nr. 777/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2379/77 af 28. oktober 1977 om ændring
