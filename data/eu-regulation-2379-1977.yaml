  content: Commission Regulation (EEC) No 2379/77 of 28 October 1977 amending Regulation
    (EEC) No 232/75 as regards the sale of butter at reduced prices for use in the
    manufacture of ice-cream and repealing Regulation (EEC) No 777/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2379/77 de la Commission, du 28 octobre 1977, modifiant
    le règlement (CEE) n° 232/75 en ce qui concerne la vente à prix réduit de
    beurre destiné à la fabrication de glaces alimentaires et abrogeant le règlement
    (CEE) n° 777/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2379/77 der Kommission vom 28. Oktober 1977 zur Änderung
