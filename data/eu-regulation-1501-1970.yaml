title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1501/70 of the Commission of 27 July 1970 specifying
    the conditions for inclusion of cows for immediate slaughter, the meat of which
    is intended for processing, under sub-heading No 01.02 A II (b) 1 of the Common
    Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1501/70 de la Commission, du 27 juillet 1970, déterminant
    les conditions d' admission dans la sous-position 01.02 A II b) 1 du tarif douanier
    commun des vaches destinées à l' abattage immédiat et dont la viande est destinée
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1501/70 der Kommission vom 27. Juli 1970 zur Festlegung
    der Voraussetzungen für die Zulassung zu der Tarifstelle 01.02 A II b) 1 des
    Gemeinsamen Zolltarifs von Kühen zum unverzüglichen Schlachten und zur Abgabe
    des beim Schlachten anfallenden Fleisches an Verarbeitungsbetriebe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1501/70 af 27. juli 1970 om fastsættelse
    af betingelserne for tarifering under pos. 01.02 A II b) 1, i den fælles toldtarif
    af køer til umiddelbar slagtning, og hvoraf det ved slagtningen fremkomne kød
    er bestemt til forarbejdning
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1501/70 della Commissione, del 27 luglio 1970, che
    stabilisce le condizioni di ammissione nella sottovoce 01.02 A II b) 1 della tariffa
    doganale comune delle vacche destinate alla macellazione immediata, la cui carne
    é destinata alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1501/70 van de Commissie van 27 juli 1970 houdende
    vaststelling van de voorwaarden en bepalingen voor de indeling onder post 01.02,
    onderverdeling A II b) 1, van het gemeenschappelijk douanetarief van slachtkoeien,
    bestemd om onmiddellijk te worden geslacht, en waarvan het vlees bestemd is voor
    industriële verwerking
  type: main
