    ja nende tollipunktide loendi osas, kus saab deklareerida tooteid ühenduses vabasse
    ringlusse lubamiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1621/2001, annettu 8 päivänä elokuuta 2001,
    asetuksen (EY) N:o 1661/1999 muuttamisesta maataloustuotteita varten vaadittavan
