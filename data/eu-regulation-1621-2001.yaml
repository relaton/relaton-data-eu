    voor het vrĳe verkeer in de Gemeenschap kunnen worden aangegeven
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1621/2001 z dnia 8 sierpnia 2001 r. zmieniające
    rozporządzenie (WE) nr 1661/1999 w zakresie certyfikatu eksportowego wymaganego
    dla produktów rolnych i wykazu urzędów celnych umożliwiających zgłoszenie
    produktów do swobodnego obrotu na obszarze Wspólnoty
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1621/2001 da Comissão, de 8 de Agosto de 2001, que
    altera o Regulamento (CE) n.° 1661/1999 no que diz respeito aos certificados
    de exportação exigidos para os produtos agrícolas e à lista de estâncias
    aduaneiras que permitem a declaração de produtos para colocação em livre prática
    na Comunidade
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1621/2001 z 8. augusta 2001, ktorým sa mení
