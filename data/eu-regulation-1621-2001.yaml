    ktorý sa vyžaduje pre poľnohospodárske produkty, a zoznam colných úradov,
    ktoré povoľujú vyhlásenie o prepustení produktov do voľného obehu v spoločenstve
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1621/2001 z dne 8. avgusta 2001 o spremembi Uredbe
