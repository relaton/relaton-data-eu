title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1621/2001 of 8 August 2001 amending Regulation
    (EC) No 1661/1999 as regards the export certificate required for agricultural
    products and the list of customs offices permitting the declaration of products
    for free circulation in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1621/2001 de la Commission du 8 août 2001 modifiant
    le règlement (CE) n° 1661/1999 en ce qui concerne le certificat d'exportation
    requis pour les produits agricoles et la liste des bureaux de douane autorisant
    la déclaration de produits pour la mise en libre pratique dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1621/2001 der Kommission vom 8. August 2001 zur Änderung
    der Verordnung (EG) Nr. 1661/1999 hinsichtlich des für landwirtschaftliche Erzeugnisse
    erforderlichen Ausfuhrzeugnisses sowie der Liste der Zollstellen, die Produkte
    für den freien Verkehr in der Gemeinschaft freigeben können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1621/2001 ze dne 8. srpna 2001, kterým se
    mění nařízení (ES) č. 1661/1999, pokud jde o vývozní certifikáty požadované
    pro zemědělské produkty a seznam celních úřadů schvalujících prohlášení
    o propuštění produktů do volného oběhu ve Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1621/2001 af 8. august 2001 om ændring
