id: EURegulation12971973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1297/73 of the Commission of 15 May 1973 re-establishing
    Common Customs Tariff duties on cotton yarn not put up for retail sale, falling
    within subheading No 55.05 A, originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2764/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1297/73 de la Commission, du 15 mai 1973, portant
    rétablissement de la perception des droit du tarif douanier commun applicables
    aux fils de coton non conditionnés pour la vente au détail, de la sous-position
    tarifaire 55.05 A, originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1297/73 der Kommission vom 15. Mai 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Baumwollgarne,
    nicht in Aufmachungen für den Einzelverkauf, der Tarifstelle 55.05 A, mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 2764/72 des Rates vom 19. Dezember
    1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1297/73 af 15. maj 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for garn af bomuld, ikke detailsalgsoplægninger,
    under underposition 55.05 A, som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1297/73 della Commissione, del 15 maggio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di cotone non preparati per la vendita al minuto, della sottovoce doganale
    n. 55.05 A, originari del Pakistan, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1297/73 van de Commissie van 15 mei 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van katoen, niet gereed voor de verkoop in het klein,
    van onderverdeling 55.05 A, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2764/72 van de Raad van 19 december
    1972
  type: main
