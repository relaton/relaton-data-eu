    de adesão nas trocas comerciais com a Espanha aplicáveis durante a campanha
    leiteira de 1990/1991
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1278/90 de la Comisión, de 11 de mayo de 1990, por
