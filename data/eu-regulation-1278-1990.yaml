  content: Commission Regulation (EEC) No 1278/90 of 11 May 1990 laying down the level
    of the accession compensatory amounts for milk and milk products applicable for
    the 1990/91 milk year in trade with Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1278/90 de la Commission, du 11 mai 1990, arrêtant
    dans le secteur du lait et des produits laitiers le niveau des montants compensatoires
    «adhésion» dans les échanges avec l'Espagne applicables lors de la campagne
    laitière 1990/1991
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1278/90 der Kommission vom 11. Mai 1990 zur Festsetzung
    der Beitrittsausgleichsbeträge für Milch und Milcherzeugnisse im Handel mit
    Spanien für das Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1278/90 af 11. maj 1990 om fastsættelse
    af tiltrædelsesudligningsbeløbene for mælk og mejeriprodukter i samhandelen
    med Spanien for mejeriåret 1990/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1278/90 της Επιτροπής
    της 11ης Μαΐου 1990 με τον οποίο αποφασίζεται,
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, το ύψος εξισωτικών ποσών προσχώρησης
    στις εμπορικές συναλλαγές με την Ισπανία που
    εφαρμόζονται κατά τη γαλακτοκομική περίοδο
    1990/91
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1278/90 della Commissione, dell'11 maggio 1990, che
    fissa, nel settore del latte e dei prodotti lattiero-caseari, il livello degli
    importi compensativi adesione negli scambi con la Spagna applicabili nella campagna
    lattiera 1990/1991
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1278/90 van de Commissie van 11 mei 1990 tot vaststelling
    in de sector melk en zuivelprodukten van het niveau van de in het melkprijsjaar
    1990/1991 toe te passen compenserende bedragen toetreding in het handelsverkeer
    met Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1278/90 da Comissão, de 11 de Maio de 1990, que
