title:
- language: en
  script: Latn
  content: Council Directive 82/148/EEC of 3 March 1982 amending Directive 79/279/EEC
    coordinating the conditions for the admission of securities to official stock
    exchange listing and Directive 80/390/EEC coordinating the requirements for the
    drawing up, scrutiny and distribution of the listing particulars to be published
    for the admission of securities to official stock exchange listing
  type: main
- language: fr
  script: Latn
  content: Directive 82/148/CEE du Conseil, du 3 mars 1982, modifiant la directive
    79/279/CEE portant coordination des conditions d'admission de valeurs mobilières
    à la cote officielle d'une bourse de valeurs et la directive 80/390/CEE portant
    coordination des conditions d'établissement, de contrôle et de diffusion du
    prospectus à publier pour l'admission de valeurs mobilières à la cote officielle
    d'une bourse de valeurs
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/148/EWG des Rates vom 3. März 1982 zur Änderung der Richtlinie
    79/279/EWG zur Koordinierung der Bedingungen für die Zulassung von Wertpapieren
    zur amtlichen Notierung an einer Wertpapierbörse und der Richtlinie 80/390/EWG
    zur Koordinierung der Bedingungen für die Erstellung, die Kontrolle und die Verbreitung
    des Prospekts, der für die Zulassung von Wertpapieren zur amtlichen Notierung
    an einer Wertpapierbörse zu veröffentlichen ist
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 82/148/EØF af 3. marts 1982 om ændring af direktiv 79/279/EØF
    om samordning af betingelserne for værdipapirers optagelse til officiel notering
    på en fondsbørs og direktiv 80/390/EØF om samordning af kravene ved udarbejdelse
    af, kontrol med og udsendelse af det prospekt, der skal offentliggøres med henblik
    på optagelse af værdipapirer til officiel notering på en fondsbørs
  type: main
- language: el
  script: Grek
  content: Οδηγία 82/148/EOK του Συμβουλίου της 3ης Μαρτίου
    1982 περί τροποποίησης της οδηγίας 79/279/EOK περί
    συντονισμού των όρων εισαγωγής κινητών αξιών
    σε χρηματιστήριο αξιών και της οδηγίας 80/390/EOK
    περί συντονισμού των όρων κατάρτισης, ελέγχου
    και διάδοσης του ενημερωτικού δελτίου που
    πρέπει να δημοσιεύεται για την εισαγωγή κινητών
    αξιών σε χρηματιστήριο αξιών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 82/148/ETY, annettu 3 päivänä maaliskuuta 1982,
    arvopaperien viralliselle pörssilistalle ottamista koskevien vaatimusten yhteensovittamisesta
    annetun direktiivin 79/279/ETY ja arvopaperien viralliselle pörssilistalle ottamisen
    yhteydessä julkistettavan listalleottoesitteen laatimista, tarkastusta ja levittämistä
    koskevien vaatimusten yhteensovittamisesta annetun neuvoston direktiivin 80/390/ETY
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 82/148/CEE del Consiglio, del 3 marzo 1982, che modifica la direttiva
    79/279/CEE concernente il coordinamento delle condizioni per l'ammissione di valori
    mobiliari alla quotazione ufficiale di una borsa valori e la direttiva 80/390/CEE
    per il coordinamento delle condizioni di redazione, controllo e diffusione del
    prospetto da pubblicare per l'ammissione di valori mobiliari alla quotazione ufficiale
    di una borsa valori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 82/148/EEG van de Raad van 3 maart 1982 houdende wijziging van
    Richtlijn 79/279/EEG tot coördinatie van de voorwaarden voor de toelating van
    effecten tot de officiële notering aan een effectenbeurs en van Richtlijn 80/390/EEG
    tot coórdinatie van de eisen gesteld aan de opstelling van, het toezicht op en
    de verspreiding van het prospectus dat gepubliceerd moet worden voor de toelating
    van effecten tot de officiële notering aan een effectenbeurs
  type: main
- language: pt
  script: Latn
  content: Directiva 82/148/CEE do Conselho, de 3 de Março de 1982, que altera a
    Directiva 79/279/CEE relativa à coordenação das condições de admissão de
    valores mobiliários à cotação oficial numa bolsa de valores e a Directiva
    80/390/CEE que coordena as condições de estabelecimento, controlo e difusão
    do prospecto a publicar para a admissão de valores mobiliários à cotação
    oficial numa bolsa de valores
  type: main
- language: es
  script: Latn
  content: Directiva 82/148/CEE del Consejo, de 3 de marzo de 1982, por la que se
    modifican la Directiva 79/279/CEE sobre coordinación de las condiciones de admisión
    de valores mobiliarios a cotización oficial en una bolsa de valores y la Directiva
    80/390/CEE sobre coordinación de las condiciones de establecimiento, control
    y difusión del folleto que debe publicarse para la admisión de valores mobiliarios
    a cotización oficial en una bolsa de valores
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 82/148/EEG av den 3 mars 1982 om ändring av direktiv
    79/279/EEG om samordning av villkoren för upptagande av värdepapper till officiell
    notering vid fondbörs och direktiv 80/390/EEG om samordning av kraven på upprättande,
    granskning och spridning av prospekt som skall offentliggöras vid upptagande
    av värdepapper till officiell notering vid fondbörs
  type: main
