title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1023/74 of the Commission of 26 April 1974 re-establishing
    the levying of the customs duties on glass inners for vacuum flasks or for other
    vacuum vessels falling within heading No 70.12, originating in Yugoslavia, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1023/74 de la Commission, du 26 avril 1974, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants de la position tarifaire 70.12 originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3501/73 du Conseil, du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1023/74 der Kommission vom 26. April 1974 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter, der Tarifnummer 70.12, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1023/74 af 26. april 1974 om genindførelse
    af opkrævning af toldtafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere under position 70.12, som har oprindele i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3501/73 af
    18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1023/74 della Commissione, del 26 aprile 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti della voce doganale n. 70.12 originarie della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1023/74 van de Commissie van 26 april 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op binnenflessen
    voor thermisch isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen,
    van post 70.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
