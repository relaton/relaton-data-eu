    της 11ης Μαρτίου 1996, περί αναστολής των κανονισμών
    (ΕΟΚ) αριθ. 990/93 και (ΕΚ) αριθ. 2471/94 και καταργήσεως
    των κανονισμών (ΕΚ) αριθ. 2472/94 και (ΕΚ) αριθ. 2815/95,
