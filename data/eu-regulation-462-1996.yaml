    määrused (EMÜ) nr 990/93 ja (EÜ) nr 2471/94 ning tunnistatakse kehtetuks määrused
    (EÜ) nr 2472/94 ja (EÜ) nr 2815/95, mis käsitlevad majandus- ja finantssuhete
    katkestamist Jugoslaavia Liitvabariigi (Serbia ja Montenegro), Horvaatia Vabariigis
