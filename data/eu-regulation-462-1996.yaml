    Bosnia serblaste kontrolli all olevate aladega
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 462/96, annettu 11 päivänä maaliskuuta 1996,
    taloudellisten ja rahoitussuhteiden keskeyttämistä Jugoslavian liittotasavallan
    (Serbia ja Montenegro), Kroatian tasavallassa sijaitsevien Yhdistyneiden Kansakuntien
    suoja-alueiden ja Bosnian ja Hertsegovinan tasavallan Bosnian serbijoukkojen hallussa
    olevien alueiden kanssa koskevien asetuksen (ETY) N:o 990/93 ja asetuksen (ETY)
    N:o 990/93 ja asetuksen (EY) N:o 2471/94 soveltamisen keskeyttämisestä sekä
    asetuksen (EY) N:o 2472/94 ja asetuksen (EY) N:o 2815/95 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 462/96 od 11. ožujka 1996. o suspenziji uredaba
    (EEZ) br. 990/93 i (EZ) br. 2471/94 i o stavljanju izvan snage uredaba (EZ) br.
    2472/94 i (EZ) br. 2815/95 o prekidu gospodarskih i financijskih odnosa sa Saveznom
    Republikom Jugoslavijom (Srbija i Crna Gora), područjima pod zaštitom Ujedinjenih
    naroda u Republici Hrvatskoj i područjima Republike Bosne i Hercegovine pod nadzorom
    snaga bosanskih Srba
  type: main
- language: hu
  script: Latn
  content: A Tanács 462/96/EK rendelete (1996. március 11.) a Jugoszláv Szövetségi
    Köztársasággal (Szerbia és Montenegró), a Horvát Köztársaságnak az ENSZ
    által védett övezeteivel és a Bosznia és Hercegovina Köztársaságnak a
    boszniai szerb erők ellenőrzése alatt álló területeivel fenntartott gazdasági
    és pénzügyi kapcsolatok megszakításáról szóló 990/93/EGK és 2471/94/EK
    rendelet felfüggesztéséről, valamint a 2472/94/EK és a 2815/95/EK rendelet
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 462/96 del Consiglio, dell'11 marzo 1996, che sospende
    il regolamento (CEE) n. 990/93 e il regolamento (CE) n. 2471/94 e che abroga il
    regolamento (CE) n. 2472/94 e il regolamento (CE) n. 2815/95, relativi all'interruzione
    delle relazioni economiche e finanziarie con la Repubblica federale di Iugoslavia
    (Serbia e Montenegro), le zone protette dalle Nazioni Unite nella Repubblica di
    Croazia e le zone della Repubblica di Bosnia-Erzegovina soggette al controllo
    delle forze serbo-bosniache
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 462/96 (1996. gada 11. marts), ar ko aptur Regulu
    (EEK) Nr. 990/93 un (EK) Nr. 2471/94 piemērošanu un atceļ Regulas (EK) Nr.
    2472/94 un (EK) Nr. 2815/95 par ekonomisko un finansiālo attiecību pārtraukšanu
    ar Dienvidslāvijas Federatīvo Republiku (Serbiju un Melnkalni), Apvienoto Nāciju
    Organizācijas aizsargātajām teritorijām Horvātijas Republikā un tiem rajoniem
    Bosnijas un Hercegovinas Republikā, kurus kontrolē Bosnijas serbu spēki
  type: main
- language: lt
  script: Latn
  content: 1996 m. kovo 11 d. Tarybos Reglamentas (EB) Nr. 462/96 sustabdantis Reglamentus
    (EEB) Nr. 990/93 ir (EB) Nr. 2471/94 ir panaikinantis Reglamentus (EB) Nr. 2472/94
    ir (EB) Nr. 2815/95 dėl ekonominių ir finansinių santykių su Jugoslavijos
    Federacine Respublika (Serbija ir Juodkalnija), Jungtinių Tautų saugomomis teritorijomis
    Kroatijos Respublikoje ir Bosnijos serbų pajėgų kontroliuojamomis teritorijomis
    Bosnijos ir Hercegovinos Respublikoje nutraukimo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 462/96 tal-11 ta' Marzu 1996 li jissospendi
    r-Regolamenti (KEE) Nru 990/93 u (KE) Nru 2471/94, u li jħassar ir-Regolamenti
    (KE) Nru 2472/94 u (KE) Nru 2815/95, dwar l-interruzzjoni tar-relazzjonijiet ekonomiċi
    u finanzjarji mar-Repubblika Federali tal-Yugoslavja (Serbja u Montenegro), maż-Żona
    Protetta tan-Nazzjonijiet Uniti fir-Repubblika tal-Kroazja u ma' dawk iż-żoni
    tar-Repubblika tal-Bosnja u Herzegovina li huma taħt il-kontroll tal-forzi Serbi
    Bosnijaċi
  type: main
