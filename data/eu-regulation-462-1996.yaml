    van Verordening (EEG) nr. 990/93 en Verordening (EG) nr. 2471/94 en tot intrekking
    van Verordening (EG) nr. 2472/94 en Verordening (EG) nr. 2815/95 betreffende de
    onderbreking van de economische en financiële betrekkingen met de Federatieve
    Republiek Joegoslavië (Servië en Montenegro), de door de Verenigde Naties beschermde
