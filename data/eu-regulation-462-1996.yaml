    1996 година за временно прекратяване на Регламенти
    (ЕИО) № 990/93 и (ЕО) № 2471/94 и за отмяна на Регламенти
    (ЕО) № 2472/94 и (ЕО) № 2815/95 относно прекъсването
    на икономическите и финансовите отношения
    с Федеративна република Югославия (Сърбия
    и Черна гора), защитените от Организацията
    на обединените нации зони в Република Хърватска
    и зоните в Република Босна и Херцеговина, които
    са под контрола на силите на босненските сърби
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 462/96 ze dne 11. března 1996, kterým se pozastavuje
    účinnost nařízení (EHS) č. 990/93 a (ES) č. 2471/94 a zrušují nařízení
    (ES) č. 2472/94 a (ES) č. 2815/95 o přerušení hospodářských a finančních
    vztahů se Svazovou republikou Jugoslávie (Srbsko a Černá Hora), s oblastmi
    v Chorvatské republice pod ochranou Spojených národů a s oblastmi Republiky
    Bosna a Hercegovina pod kontrolou bosensko-srbských sil
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 462/96 af 11. marts 1996 om suspension af forordning
    (EØF) nr. 990/93 og forordning (EF) nr. 2471/94 og om ophævelse af forordning
    (EF) nr. 2472/94 og forordning (EF) nr. 2815/95 for så vidt angår afbrydelsen
