title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 462/96 of 11 March 1996 suspending Regulations
    (EEC) No 990/93 and (EC) No 2471/94, and repealing Regulations (EC) No 2472/94
    and (EC) No 2815/95, concerning the interruption of economic and financial relations
    with the Federal Republic of Yugoslavia (Serbia and Montenegro), the United Nations
    Protected Areas in the Republic of Croatia and those areas of the Republic of
    Bosnia and Herzegovina under the control of Bosnian Serb forces
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 462/96 du Conseil, du 11 mars 1996, portant suspension
    des règlements (CEE) n° 990/93 et (CE) n° 2471/94 ainsi qu'abrogation des règlements
    (CE) n 2472/94 et (CE) n° 2815/95 concernant l'interruption des relations économiques
    et financières avec la République fédérative de Yougoslavie (Serbie et Monténégro),
    les zones protégées des Nations unies en République de Croatie et les zones
    de la République de Bosnie-Herzégovine sous le contrôle des forces serbes de
    Bosnie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 462/96 des Rates vom 11. März 1996 zur Aussetzung
    der Verordnungen (EWG) Nr. 990/93 und (EG) Nr. 2471/94 und zur Aufhebung der Verordnungen
    (EG) Nr. 2472/94 und (EG) Nr. 2815/95 betreffend die Aussetzung der wirtschaftlichen
    und finanziellen Beziehungen zur Bundesrepublik Jugoslawien (Serbien und Montenegro),
    zu den Schutzzonen der Vereinten Nationen in der Republik Kroatien und zu den
    von den bosnisch- serbischen Einheiten kontrollierten Gebieten der Republik Bosnien-Herzegowina
  type: main
- language: bg
  script: Cyrl
