title:
- language: en
  script: Latn
  content: '82/372/EEC: Commission Decision of 5 May 1982 authorizing the French Republic
    to apply intra-Community surveillance to imports of beach slippers originating
    in the People''s Republic of China and put into free circulation in the other
    Member Statess (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/372/CEE: Décision de la Commission, du 5 mai 1982, autorisant la République
    française à instaurer une surveillance intracommunautaire à l''égard des importations
    d''espadrilles, originaires de la République populaire de Chine et mises en libre
    pratique dans les autres États membres (Le texte en langue française est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '82/372/EWG: Entscheidung der Kommission vom 5. Mai 1982 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Volksrepublik China stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Leinenschuhenr (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/372/EØF: Kommissionens beslutning af 5. maj 1982 om bemyndigelse af
    Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af strandsandaler, med oprindelse i Den kinesiske Folkerepublik og overgået til
    fri omsætning i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/372/EOK: Απόφαση τής Επιτροπής τής 5ης Μαΐου
    1982 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά προβεί σέ ενδοκοινοτική επιτήρηση τών εισαγωγών
    υποδημάτων μέ εξωτερικό πέλμα από σχοινί, καταγωγής
    Λαϊκής Δημοκρατίας τής Κίνας, τά οποία τίθενται
    σέ ελεύθερη κυκλοφορία στά άλλα Κράτη μέλη
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/372/CEE: Decisione della Commissione, del 5 maggio 1982, che autorizza
    la Repubblica francese a procedere ad una sorveglianza intracomunitaria sulle
    importazioni di scarpe di tela o di sparto originarie della Repubblica popolare
    cinese e messe in libera pratica negli altri Stati membrio (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/372/EEG: Beschikking van de Commissie van 5 mei 1982 houdende machtiging
    van de Franse Republiek om over te gaan tot een intracommunautair toezicht ten
    aanzien van de invoer van strandschoenen van oorsprong uit de Volksrepubliek China
    en die in de overige Lid-Staten in het vrije verkeer zijn gebracht (Slechts de
    tekst in de Franse taal is authentiek)'
