    de modificare a Regulamentelor ONU nr. 0, 14, 16, 22, 24, 37, 45, 48, 49, 55,
    58, 67, 79, 83, 86, 90, 94, 95, 100, 101, 110, 116, 118, 125, 128, 129, 133, 134,
    135, 137, 145, 149, 150, 151, 152, 153, 157, 158 și 159, în ceea ce privește
    propunerile de amendamente la Rezoluțiile consolidate R.E.3 și R.E.5, în ceea
    ce privește propunerile de amendamente la Rezoluțiile reciproce M.R.1 și M.R.2
    și în ceea ce privește propunerile pentru autorizațiile în vederea modificării
    RTM ONU privind siguranța pietonilor, în vederea elaborării RTM ONU privind
    emisiile generate în condiții reale de conducere la nivel mondial și privind
    emisiile de particule la frânare
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/1981 z 9. novembra 2021 o pozícii, ktorá
    sa má v mene Európskej únie zaujať vo Svetovom fóre Európskej hospodárskej
    komisie Organizácie Spojených národov pre harmonizáciu predpisov o vozidlách,
    pokiaľ ide o návrhy na zmeny predpisov OSN č. 0, 14, 16, 22, 24, 37, 45, 48,
    49, 55, 58, 67, 79, 83, 86, 90, 94, 95, 100, 101, 110, 116, 118, 125, 128, 129,
    133, 134, 135, 137, 145, 149, 150, 151, 152, 153, 157, 158 a 159, pokiaľ ide
    o návrhy na zmeny konsolidovaných rezolúcií R.E.3 a R.E.5, pokiaľ ide o návrhy
    na zmeny spoločných rezolúcií M.R.1 a M.R.2 a pokiaľ ide o návrhy na povolenia
    na zmenu GTP OSN o bezpečnosti chodcov a na vypracovanie GTP OSN o globálnych
    emisiách pri skutočnej jazde a GTP OSN o emisiách častíc z bŕzd
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/1981 z dne 9. novembra 2021 o stališču, ki se v
    imenu Evropske unije zastopa na Svetovnem forumu Ekonomske komisije Združenih
    narodov za Evropo za harmonizacijo pravilnikov o vozilih glede predlogov sprememb
    pravilnikov ZN št. 0, 14, 16, 22, 24, 37, 45, 48, 49, 55, 58, 67, 79, 83, 86,
    90, 94, 95, 100, 101, 110, 116, 118, 125, 128, 129, 133, 134, 135, 137, 145, 149,
    150, 151, 152, 153, 157, 158 in 159, predlogov sprememb konsolidiranih resolucij
    R.E.3 in R.E.5 ter vzajemnih resolucij M.R.1 in M.R.2 ter glede predlogov za dovoljenja
    za spremembo globalnega tehničnega predpisa ZN o varnosti pešcev in pripravo
    globalnih tehničnih predpisov ZN o globalnih dejanskih emisijah, ki nastajajo
    med vožnjo, ter o emisijah delcev pri zaviranju
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/1981 del Consejo de 9 de noviembre de 2021 relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Foro
    Mundial para la Armonización de los Reglamentos sobre Vehículos de la Comisión
    Económica para Europa de las Naciones Unidas, por lo que respecta a las propuestas
    de modificación de los Reglamentos de las Naciones Unidas n.os 0, 14, 16, 22,
    24, 37, 45, 48, 49, 55, 58, 67, 79, 83, 86, 90, 94, 95, 100, 101, 110, 116, 118,
    125, 128, 129, 133, 134, 135, 137, 145, 149, 150, 151, 152, 153, 157, 158 y 159,
    las propuestas de modificaciones de las Resoluciones consolidadas R.E.3 y R.E.5,
    las propuestas de modificaciones de las Resoluciones mutuas M.R.1 y M.R.2, así
    como las propuestas de autorizaciones para modificar el RTM de las Naciones Unidas
    sobre seguridad de los peatones, y elaborar un RTM de las Naciones Unidas sobre
    las emisiones mundiales en condiciones reales de conducción y otro sobre las
    emisiones específicas de los frenos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/1981 av den 9 november 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i Förenta nationernas ekonomiska
    kommission för Europas världsforum för harmonisering av fordonsföreskrifter
    vad gäller förslagen till ändringar av FN-föreskrifterna nr 0, 14, 16, 22,
    24, 37, 45, 48, 49, 55, 58, 67, 79, 83, 86, 90, 94, 95, 100, 101, 110, 116, 118,
    125, 128, 129, 133, 134, 135, 137, 145, 149, 150, 151, 152, 153, 157, 158 och
    159, vad gäller förslagen till ändringar av de konsoliderade resolutionerna
    R.E.3 och R.E.5, vad gäller förslagen till ändringar av de ömsesidiga resolutionerna
    M.R.1 och M.R.2 samt vad gäller förslagen om godkännande att ändra FN:s globala
    tekniska föreskrift om säkerhet för fotgängare och om utarbetandet av FN:s
    globala tekniska föreskrifter om utsläpp vid verklig körning och om partikelutsläpp
    vid bromsning
