id: EUDirective1989381
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 89/381/EEC of 14 June 1989 extending the scope of Directives
    65/65/EEC and 75/319/EEC on the approximation of provisions laid down by Law,
    Regulation or Administrative Action relating to proprietary medicinal products
    and laying down special provisions for medicinal products derived from human blood
    or human plasma
  type: main
- language: fr
  script: Latn
  content: Directive 89/381/CEE du conseil du 14 juin 1989 élargissant le champ d'application
    des directives 65/65/CEE et 75/319/CEE concernant le rapprochement des dispositions
    législatives, réglementaires et administratives relatives aux spécialités
    pharmaceutiques, et prévoyant des dispositions spéciales pour les médicaments
    dérivés du sang ou du plasma humains
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/381/EWG des Rates vom 14. Juni 1989 zur Erweiterung des Anwendungsbereichs
    der Richtlinien 65/65/EWG und 75/319/EWG zur Angleichung der Rechts- und Verwaltungsvorschriften
    über Arzneispezialitäten und zur Festlegung besonderer Vorschriften für Arzneimittel
    aus menschlichem Blut oder Blutplasma
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/381/EØF af 14. juni 1989 om udvidelse af anvendelsesområdet
    for direktiv 65/65/EØF og 75/319/EØF om tilnærmelse af lovgivning om farmaceutiske
    specialiteter, og om fastsættelse af særlige bestemmelser for lægemidler fremstillet
    på basis af blod eller plasma fra mennesker
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/381/ΕΟΚ του Συμβουλίου της 14ης Ιουνίου
    1989 που επεκτείνει το πεδίο εφαρμογής των οδηγιών
    65/65/ΕΟΚ και 75/319/ΕΟΚ για την προσέγγιση των νομοθετικών,
    κανονιστικών ή διοικητικών διατάξεων σχετικά
    με τα φαρμακευτικά ιδιοσκευάσματα και θεσπίζει
    ειδικές διατάξεις για τα φάρμακα με βάση το
    ανθρώπινο αίμα ή το πλάσμα ανθρώπινου αίματος
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/381/ETY, annettu 14 päivänä kesäkuuta 1989,
    lääkevalmisteita koskevien lakien, asetusten ja hallinnollisten määräysten
    lähentämisestä annettujen direktiivien 65/65/ETY ja 75/319/ETY soveltamisalan
    laajentamisesta ja ihmisverestä tai -veriplasmasta peräisin olevia lääkkeitä
    koskevista erityissäännöksistä
  type: main
- language: it
  script: Latn
  content: Direttiva 89/381/CEE del Consiglio del 14 giugno 1989 che estende il campo
    di applicazione delle direttive 65/65/CEE e 75/319/CEE per il ravvicinamento delle
    disposizioni legislative, regolamentari ed amministrative relative alle specialità
    medicinali e che fissa disposizioni speciali per i medicinali derivati dal sangue
    o dal plasma umani
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/381/EEG van de Raad van 14 juni 1989 tot uitbreiding van de
    werkingssfeer van de Richtlijnen 65/65/EEG en 75/319/EEG betreffende de aanpassing
    van de wettelijke en bestuursrechtelijke bepalingen inzake farmaceutische specialiteiten
    en tot vaststelling van bijzondere bepalingen voor uit menselijk bloed of plasma
    bereide geneesmiddelen
  type: main
- language: pt
  script: Latn
  content: Directiva 89/381/CEE do Conselho de 14 de Junho de 1989 que alarga o âmbito
    de aplicação das Directivas 65/65/CEE e 75/319/CEE, relativas à aproximação
    das disposições legislativas, regulamentares e administrativas respeitantes
    às especialidades farmacêuticas e que prevê disposições especiais para os
    medicamentos derivados do sangue ou do plasma humanos
  type: main
- language: es
  script: Latn
  content: Directiva 89/381/CEE del Consejo de 14 de junio de 1989 por la que se amplía
    el ámbito de aplicación de las Directivas 65/65/CEE y 75/319/CEE relativas a
    la aproximación de las disposiciones legales, reglamentarias y administrativas
    sobre especialidades farmacéuticas y por la que se adoptan disposiciones especiales
    sobre los medicamentos derivados de la sangre y del plasma humanos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/381/EEG av den 14 juni 1989 om utvidgning av tillämpningsområdet
    för direktiven 65/65/EEG och 75/319/EEG om tillnärmning av bestämmelser som
    fastställts genom lagar eller andra författningar som rör farmaceutiska specialiteter
    och som fastställer särskilda bestämmelser för läkemedel som härrör från
    blod eller plasma från människa
  type: main
