  script: Latn
  content: Council Implementing Regulation (EU) No 285/2013 of 21 March 2013 terminating
    the partial reopening of anti-dumping investigation concerning imports of ethanolamines
    originating in the United States of America and terminating the expiry review
    pursuant to Article 11(2) and the partial interim review pursuant to Article 11(3)
    of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 285/2013 du Conseil du 21 mars 2013
    clôturant la réouverture partielle de l’enquête antidumping concernant les
    importations d’éthanolamines originaires des États-Unis d’Amérique et clôturant
    le réexamen effectué au titre de l’expiration des mesures en application de
    l’article 11, paragraphe 2, ainsi que le réexamen intermédiaire partiel en
    application de l’article 11, paragraphe 3, du règlement (CE) n ° 1225/2009
  type: main
