id: EUDecision2022937
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/937 of 16 June 2022 repealing
    Decision 2006/563/EC concerning certain protection measures in relation to highly
    pathogenic avian influenza of subtype H5N1 in wild birds in the Community
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/937 de la Commission du 16 juin 2022
    abrogeant la décision 2006/563/CE concernant certaines mesures de protection
    relatives à la présence de l’influenza aviaire hautement pathogène du sous
    type H5N1 chez les oiseaux sauvages dans la Communauté
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/937 der Kommission vom 16. Juni 2022
    zur Aufhebung der Entscheidung 2006/563/EG mit Maßnahmen zum Schutz gegen die
    hoch pathogene Aviäre Influenza des Subtyps H5N1 bei Wildvögeln in der Gemeinschaft
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/937 на Комисията
    от 16 юни 2022 година за отмяна на Решение 2006/563/ЕО
    относно определени защитни мерки по отношение
    на високопатогенната инфлуенца по птиците
    от подтип H5N1 при дивите птици в Общността
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/937 ze dne 16. června 2022,
    kterým se zrušuje rozhodnutí 2006/563/ES o některých ochranných opatřeních
    týkajících se vysoce patogenní influenzy ptáků podtypu H5N1 u volně žijícího
    ptactva ve Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/937 af 16. juni 2022
    om ophævelse af beslutning 2006/563/EF om visse beskyttelsesforanstaltninger
    over for højpatogen aviær influenza af subtype H5N1 hos vilde fugle i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/937 της Επιτροπής
    της 16ης Ιουνίου 2022 για την κατάργηση της απόφασης
    2006/563/ΕΚ σχετικά με ορισμένα μέτρα προστασίας
    όσον αφορά την υψηλής παθογονικότητας γρίπη
    των πτηνών του υποτύπου H5N1 σε άγρια πτηνά στην
    Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/937, 16. juuni 2022, millega tunnistatakse
    kehtetuks otsus 2006/563/EÜ, milles käsitletakse teatavaid kaitsemeetmeid seoses
    alatüüpi H5N1 kuuluva kõrge patogeensusega linnugripiga metslindudel ühenduses
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/937, annettu 16 päivänä
    kesäkuuta 2022, korkeapatogeenisen lintuinfluenssan H5N1-alatyypin esiintymiseen
    yhteisön luonnonvaraisissa linnuissa liittyvistä tietyistä suojatoimenpiteistä
    tehdyn päätöksen 2006/563/EY kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/937 ón gCoimisiún an 16 Meitheamh
    2022 lena n-aisghairtear Cinneadh 2006/563/CE a bhaineann le bearta cosanta áirithe
    i ndáil le fliú éanúil ardphataigineach d’fhochineál H5N1 in éin fhiáine
    sa Chomhphobal
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/937 оd 16. lipnja 2022. o stavljanju
    izvan snage Odluke 2006/563/EZ o određenim zaštitnim mjerama u vezi s visokopatogenom
    influencom ptica podtipa H5N1 kod divljih ptica u Zajednici
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/937 végrehajtási határozata (2022. június 16.)
    a Közösségben a vadon élő madarakban előforduló magas patogenitású madárinfluenza
    H5N1 altípusával kapcsolatos egyes védekezési intézkedésekről szóló 2006/563/EK
    határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/937 della Commissione del 16 giugno 2022
    che abroga la decisione 2006/563/CE recante alcune misure di protezione relative
    all’influenza aviaria ad alta patogenicità del sottotipo H5N1 negli uccelli
    selvatici nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/937 (2022. gada 16. jūnijs),
    ar ko atceļ Lēmumu 2006/563/EK par dažiem aizsardzības pasākumiem saistībā
    ar īpaši patogēnu H5N1 apakštipa putnu gripu savvaļas putnu vidū Kopienā
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/937 2022 m. birželio 16 d.
    kuriuo panaikinamas Sprendimas 2006/563/EB dėl tam tikrų apsaugos priemonių,
    susijusių su labai patogenišku paukščių gripu, kurį Bendrijos naminiams
    paukščiams sukelia gripo viruso H5N1 potipis
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/937 tas-16
    ta’ Ġunju 2022 li tħassar id-Deċiżjoni 2006/563/KE dwar ċerti miżuri ta’
    ħarsien b’rabta mal-influwenza tat-tjur patoġenika ħafna tas-sottotip H5N1
    fi tjur slavaġ fil-Komunità
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/937 van de Commissie van 16 juni 2022 tot
    intrekking van Beschikking 2006/563/EG tot vaststelling van bepaalde beschermende
    maatregelen in verband met hoogpathogene aviaire influenza van het subtype H5N1
    bij wilde vogels in de Gemeenschap
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/937 z dnia 16 czerwca 2022 r. uchylająca
    decyzję 2006/563/WE dotyczącą niektórych środków ochronnych w odniesieniu
    do wysoce zjadliwej grypy ptaków podtypu H5N1 wśród dzikiego ptactwa we Wspólnocie
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/937 da Comissão de 16 de junho de 2022
    que revoga a Decisão 2006/563/CE relativa a determinadas medidas de proteção
    respeitantes à gripe aviária de alta patogenicidade do subtipo H5N1 em aves
    selvagens na Comunidade
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/937 a Comisiei din 16 iunie 2022
    de abrogare a Deciziei 2006/563/CE privind anumite măsuri de protecție în legătură
    cu prezența influenței aviare produse de tulpini înalt patogene de subtip H5N1
    la păsările sălbatice din Comunitate
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/937 zo 16. júna 2022, ktorým
    sa zrušuje rozhodnutie 2006/563/ES o určitých ochranných opatreniach v súvislosti
    s vysokopatogénnou vtáčou chrípkou podtypu H5N1 u voľne žijúceho vtáctva
    v Spoločenstve
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/937 z dne 16. junija 2022 o razveljavitvi
    Odločbe 2006/563/ES o nekaterih zaščitnih ukrepih v zvezi z visokopatogeno
    aviarno influenco podtipa H5N1 pri prosto živečih pticah v Skupnosti
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/937 de la Comisión de 16 de junio de
    2022 por la que se deroga la Decisión 2006/563/CE, sobre determinadas medidas
    de protección en relación con la gripe aviar altamente patógena del subtipo
    H5N1 en aves silvestres dentro de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/937 av den 16 juni 2022 om
    upphävande av beslut 2006/563/EG om vissa skyddsåtgärder i samband med högpatogen
    aviär influensa av subtyp H5N1 hos vilda fåglar i gemenskapen
  type: main
