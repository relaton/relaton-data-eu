  script: Latn
  content: Règlement d’exécution (UE) 2024/2632 de la Commission du 8 octobre
    2024 modifiant le règlement d’exécution (UE) 2022/1193 en ce qui concerne
    les mesures relatives aux eaux susceptibles d’être infectées par Ralstonia
    solanacearum (Smith 1896) Yabuuchi et al. 1996 emend. Safni et al. 2014, les mesures
    à prendre par les opérateurs professionnels et le modèle pour la communication
    des résultats des enquêtes
  type: main
