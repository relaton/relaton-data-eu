    le misure relative alle acque che possono essere infette dall’organismo nocivo
    Ralstonia solanacearum (Smith 1896) Yabuuchi et al. 1996 emend. Safni et al. 2014,
    le misure che devono essere adottate dagli operatori professionali e il modello
    per la comunicazione dei risultati delle indagini
  type: main
- language: lv
