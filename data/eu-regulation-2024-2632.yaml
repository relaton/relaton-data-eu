    für Wasser, das möglicherweise mit Ralstonia solanacearum (Smith 1896) Yabuuchi
    et al. 1996 emend. Safni et al. 2014 belastet ist, hinsichtlich Maßnahmen, die
    von den Unternehmern zu ergreifen sind, und hinsichtlich des Musters zur Berichterstattung
    über die Erhebungsergebnisse
  type: main
