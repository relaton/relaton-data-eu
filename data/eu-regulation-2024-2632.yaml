    (Smith 1896) Yabuuchi et al. 1996 emend. Safni et al. 2014, a medidas a tomar
    pelos operadores profissionais e ao modelo para comunicar os resultados de prospeções
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2632 al Comisiei din 8 octombrie
