title:
- language: en
  script: Latn
  content: '2013/38/EU: Commission Implementing Decision of 18 January 2013 allowing
    Member States to extend provisional authorisations granted for the new active
    substances emamectin and maltodextrin (notified under document C(2013) 51)'
  type: main
- language: fr
  script: Latn
  content: '2013/38/UE: Décision d’exécution de la Commission du 18 janvier 2013
