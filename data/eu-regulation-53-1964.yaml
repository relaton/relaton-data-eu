  content: Règlement n 53/64/CEE de la Commission, du 30 avril 1964, relatif aux
    dispositions transitoires applicables à certains produits du secteur de la viande
    bovine introduits, avant la date de mise en application du régime des échanges
    institué par le règlement n 14/64/CEE dans les entrepôts douaniers de la république
    fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 53/64/EWG der Kommission vom 30. April 1964 betreffend Übergangsbestimmungen
    für bestimmte Erzeugnisse des Rindfleischsektors, die vor dem Zeitpunkt der Anwendung
    der durch die Verordnung Nr. 14/64/EWG eingeführten Regelung des Handelsverkehrs
    in der Bundesrepublik Deutschland in ein Zollgutlager verbracht worden sind
  type: main
- language: it
  script: Latn
  content: Regolamento n. 53/64/CEE della Commissione, del 30 aprile 1964, relativo
    alle disposizioni transitorie applicabili ad alcuni prodotti del settore delle
    carni bovine introdotti, prima della data d'applicazione del regime degli scambi
    istituito dal regolamento n. 14/64/CEE, nei depositi doganali della Repubblica
    federale di Germania
  type: main
- language: nl
  script: Latn
  content: Verordening no. 53/64/EEG van de Commissie van 30 april 1964 betreffende
    de overgangsbepalingen die van toepassing zijn op sommige produkten van de sector
    rundvlees welke voor het van toepassing worden van de bij Verordening no. 14/64/EEG
    ingevoerde regeling voor het handelsverkeer in de Bondsrepubliek Duitsland in
    entrepot zijn opgeslagen
