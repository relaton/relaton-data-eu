title:
- language: en
  script: Latn
  content: '79/686/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to receivers for television, falling
    within subheading 85.15 A ex III of the Common Customs Tariff, originating in
    Japan and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/686/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire les postes de
    télévision, de la sous-position 85.15 A ex III du tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres Etats membres (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/686/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Geräte für Fernsehen der Tarifstelle
    85.15 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/686/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage modtagere til
    fjernsyn, som henhører under pos. 85.15 A ex III i den fælles toldtarif, har
    oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/686/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    per la televisione, della sottovoce 85.15 A ex III della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/686/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd televisietoestellen, van post 85.15 A ex III van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
