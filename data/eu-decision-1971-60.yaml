title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, portant octroi du concours
    du Fonds social européen au bénéfice de la République fédérale d'Allemagne
    pour des dépenses relatives à des opérations de rééducation professionnelle
    et de réinstallation effectuées par la "Bundesanstalt für Arbeit", la "Bundesknappschaft"
    et les organismes d'assurances sociales des travailleurs
  type: main
- language: de
  script: Latn
  content: '71/60/EWG: Entscheidung der Kommission vom 16. Dezember 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für von der Bundesanstalt für Arbeit, der Bundesknappschaft
    und den Arbeiterrentenversicherungsträgern durchgeführte Berufsumschulungs-
    und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '71/60/CEE: Decisione della Commissione, del 16 dicembre 1970, che concede
    un contributo del Fondo sociale europeo alla Repubblica federale di Germania per
    spese concernenti operazioni di riqualificazione e di nuova sistemazione effettuate
    dalla «Bundesanstalt für Arbeit», dalla «Bundesknappschaft» e dagli enti
    di assicurazione sociale dei lavoratori'
  type: main
- language: nl
  script: Latn
  content: '71/60/EEG: Beschikking van de Commissie van 16 december 1970 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Bondsrepubliek
    Duitsland voor door de "Bundesanstalt für Arbeit", de "Bundesknappschaft" en
    de sociale verzekeringsinstellingen ten behoeve van de werknemers gemaakte herscholings-
    en verplaatsingskosten'
  type: main
