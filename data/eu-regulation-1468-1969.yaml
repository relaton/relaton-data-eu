  content: Règlement (CEE) n° 1468/69 du Conseil, du 23 juillet 1969, portant conclusion
    de l'accord créant une association entre la Communauté économique européenne
    et la République tunisienne et relatif aux mesures à prendre et aux procédures
    à suivre pour son application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1468/69 des Rates vom 23. Juli 1969 über den Abschluß
    des Abkommens zur Gründung einer Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Tunesischen Republik, die zu seiner Durchführung zu treffenden Maßnahmen
    und die dabei anzuwendenden Verfahren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1468/69 del Consiglio, del 23 luglio 1969, per la
    conclusione dell'Accordo che crea un'associazione tra la Comunità economica europea
    e la Repubblica tunisina e relativo ai provvedimenti da prendere e alle procedure
    da seguire per la sua applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1468/69 van de Raad van 23 juli 1969 houdende sluiting
    van de Overeenkomst waarbij een Associatie tot stand wordt gebracht tussen de
    Europese Economische Gemeenschap en de Tunesische Republiek en betreffende de
    maatregelen en procedures nodig ter toepassing van die Overeenkomst
