    στις 6 Απριλίου 1981
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 975/81 della Commissione, dell'8 aprile 1981, recante
    deroga al regolamento (CEE) n. 486/80 per quanto concerne il calcolo degli importi
    di cui vengono diminuiti i diritti all'importazione di prodotti del settore delle
    carni bovine, originari degli Stati africani, dei Caraibi e del Pacifico, per
    il periodo che inizia il 6 aprile 1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 975/81 van de Commissie van 8 april 1981 houdende
