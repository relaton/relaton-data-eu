title:
- language: en
  script: Latn
  content: Commission Decision of 9 December 1976 authorizing Ireland not to apply
    Community treatment to knitted goods falling within Chapter 60 of the Common Customs
    Tariff, originating in Hungary and in free circulation in the United Kingdom
  type: main
- language: fr
  script: Latn
  content: '77/133/CEE: Décision de la Commission, du 9 décembre 1976, autorisant
    l''Irlande à exclure du traitement communautaire les articles de bonneterie,
    du chapitre 60 du Tarif douanier commun, originaires de Hongrie et mis en libre
    pratique au Royaume-Uni'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. Dezember 1976, mit der Irland ermächtigt
    wird, aus Ungarn stammende und im Vereinigten Königreich im freien Verkehr befindliche
    Gewirke des Kapitels 60 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. december 1976 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage trikotagevarer, som henhører under
    kapitel 60 i den fælles toldtarif, har oprindelse i Ungarn og frit kan omsættes
    i Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 dicembre 1976, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario i manufatti a maglia di cui al capitolo
    60 della tariffa doganale comune, originari dell'Ungheria e messi in libera pratica
    nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 december 1976 waarbij Ierland wordt
    gemachtigd breiwerk en haakwerk, van Hoofdstuk 60 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hongarije en in het Verenigd Koninkrijk in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
