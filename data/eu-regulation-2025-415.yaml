  content: Commission Delegated Regulation (EU) 2025/415 of 13 December 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying adjustment of own funds requirement
    and minimum features of stress testing programmes of issuers of asset-referenced
    tokens or of e-money tokens
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/415 de la Commission du 13 décembre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant l’adaptation des exigences
    de fonds propres et les caractéristiques minimales des programmes de simulation
    de crise applicables aux émetteurs de jetons se référant à un ou des actifs
    ou de jetons de monnaie électronique
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/415 der Kommission vom 13. Dezember 2024
