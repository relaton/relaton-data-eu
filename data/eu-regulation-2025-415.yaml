    des Rates durch technische Regulierungsstandards zur Präzisierung der Anpassung
    der Eigenmittelanforderung und zur Festlegung der Mindestvorgaben für die Stresstestprogramme
    der Emittenten von vermögenswertereferenzierten Token oder E-Geld-Token
  type: main
