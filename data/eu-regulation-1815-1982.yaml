    und der Höhe der nach der Verarbeitung zu leistenden Ausgleichszahlungen für
    das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1815/82 af 7. juli 1982 om fastsættelse
