title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1497/2001 of 20 July 2001 imposing provisional
    anti-dumping duties on imports of urea originating in Belarus, Bulgaria, Croatia,
    Estonia, Libya, Lithuania, Romania and the Ukraine, accepting an undertaking offered
    by the exporting producer in Bulgaria and terminating the proceeding as regards
    imports of urea originating from Egypt and Poland
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1497/2001 de la Commission du 20 juillet 2001 instituant
    des droits antidumping provisoires sur les importations d'urée originaire du
    Belarus, de Bulgarie, de Croatie, d'Estonie, de Libye, de Lituanie, de Roumanie
    et d'Ukraine, portant acceptation d'un engagement offert par le producteur-exportateur
    en Bulgarie et clôturant la procédure en ce qui concerne les importations d'urée
    originaire d'Égypte et de Pologne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1497/2001 der Kommission vom 20. Juli 2001 zur Einführung
    vorläufiger Antidumpingzölle auf die Einfuhren von Harnstoff mit Ursprung in
    Belarus, Bulgarien, Kroatien, Estland, Libyen, Litauen, Rumänien und der Ukraine,
    zur Annahme eines Verpflichtungsangebotes des ausführenden Herstellers in Bulgarien
    und zur Einstellung des Verfahrens betreffend die Einfuhren von Harnstoff mit
    Ursprung in Ägypten und Polen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1497/2001 af 20. juli 2001 om indførelse
    af en midlertidig antidumpingtold på importen af urinstof med oprindelse i Belarus,
    Bulgarien, Kroatien, Estland, Libyen, Litauen, Rumænien og Ukraine, om godtagelse
    af tilsagn afgivet af den eksporterende producent i Bulgarien og om afslutning
    af proceduren vedrørende importen af urinstof med oprindelse i Egypten og Polen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1497/2001 της Επιτροπής,
    της 20ής Ιουλίου 2001, για την επιβολή προσωρινών
    δασμών αντιντάμπινγκ στις εισαγωγές ουρίας
    καταγωγής Λευκορωσίας, Βουλγαρίας, Κροατίας,
    Εσθονίας, Λιβύης, Λιθουανίας, Ρουμανίας και
    Ουκρανίας, για την αποδοχή ανάληψης υποχρέωσης
    που πρότεινε ένας παραγωγός-εξαγωγέας στη
    Βουλγαρία και για την περάτωση της διαδικασίας
    όσον αφορά τις εισαγωγές ουρίας καταγωγής
    Αιγύπτου και Πολωνίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1497/2001, annettu 20 päivänä heinäkuuta
    2001, väliaikaisten polkumyyntitullien käyttöönotosta Bulgariasta, Kroatiasta,
    Libyasta, Liettuasta, Romaniasta, Ukrainasta, Valko-Venäjältä ja Virosta peräisin
    olevan virtsa-aineen (urea) tuonnissa, bulgarialaisen vientiä harjoittavan tuottajan
    tarjoaman sitoumuksen hyväksymisestä sekä Egyptistä ja Puolasta peräisin
    olevan virtsa-aineen tuontia koskevan menettelyn päättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1497/2001 della Commissione, del 20 luglio 2001, che
    istituisce dazi antidumping provvisori sulle importazioni di urea originarie della
    Bielorussia, della Bulgaria, della Croazia, dell'Estonia, della Libia, della Lituania,
    della Romania e dell'Ucraina, accetta un impegno offerto dal produttore esportatore
    della Bulgaria e chiude il procedimento per quanto riguarda le importazioni di
    urea originarie dell'Egitto e della Polonia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1497/2001 van de Commissie van 20 juli 2001 tot instelling
    van voorlopige antidumpingrechten op ureum uit Belarus, Bulgarĳe, Estland, Kroatië,
    Libië, Litouwen, Oekraïne en Roemenië, tot aanvaarding van de verbintenis van
    een producent/exporteur in Bulgarĳe en tot beëindiging van de procedure ten
    aanzien van Egypte en Polen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1497/2001 da Comissão, de 20 de Julho de 2001, que
    cria direitos anti-dumping provisórios sobre as importações de ureia originária
    da Bielorrússia, da Bulgária, da Croácia, da Estónia, da Líbia, da Lituânia,
    da Roménia e da Ucrânia, e que aceita um compromisso oferecido pelo produtor-exportador
    na Bulgária e encerra o processo no que diz respeito às importações de ureia
    originária do Egipto e da Polónia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1497/2001 de la Comisión, de 20 de julio de 2001,
    por el que se establecen derechos antidumping provisionales sobre las importaciones
    de urea originarias de Bielorrusia, Bulgaria, Croacia, Estonia, Libia, Lituania,
    Rumania y Ucrania, se acepta un compromiso ofrecido por un exportador/productor
    de Bulgaria y se concluye el procedimiento por lo que se refiere a las importaciones
    de urea originarias de Egipto y Polonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1497/2001 av den 20 juli 2001 om införande
    av preliminära antidumpningstullar på import av karbamid (urinämne) med ursprung
    i Republiken Bulgarien, Republiken Estland, Republiken Kroatien, Socialistiska
    folkliga libyska arabiska Jamahiriya, Republiken Litauen, Rumänien, Ukraina och
    Republiken Vitryssland, om godtagande av ett åtagande som gjorts av den exporterande
    tillverkaren i Republiken Bulgarien och om avslutande av förfarandet rörande
    import av karbamid (urinämne) med ursprung i Arabrepubliken Egypten och Republiken
    Polen
