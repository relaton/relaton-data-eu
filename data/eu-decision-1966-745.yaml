title:
- language: fr
  script: Latn
  content: Décision 66/745/CEE du Conseil du 22 décembre 1966, portant ouverture
    et répartition d'un contingent tarifaire communautaire à droit nul à l'importation
    de pneumatiques destinés à être utilisés, à des fins d'entretien, sur des
    avions des types DC 8, DC 9 et Boeing
  type: main
- language: de
  script: Latn
  content: '66/745/EWG: Entscheidung des Rates vom 22. Dezember 1966 über die Eröffnung
    und Aufschlüsselung eines gemeinschaftlichen Zollkontingents zum Zollsatz Null
    für die Einfuhr von Reifen zur Instandhaltung von Luftfahrzeugen der Typen DC
    8, DC 9 und Boeing'
  type: main
- language: it
  script: Latn
  content: '66/745/CEE: Decisione del Consiglio, del 22 dicembre 1966, recante istituzione
    e ripartizione di un contingente tariffario comunitario in esenzione da dazio
    per l''importazione di pneumatici destinati ad essere utilizzati per l''equipaggiamento
    di aeroplani dei tipi DC 8, DC 9 e Boeing'
  type: main
- language: nl
  script: Latn
  content: '66/745/EEG: Beschikking van de Raad van 22 december 1966 houdende opening
    en verdeling van een communautair tariefcontingent met vrijdom van recht voor
    de invoer van banden welke bestemd zijn om ten behoeve van het onderhoud te worden
    gemonteerd op vliegtuigen van het type DC 8, DC 9 en Boeing'
  type: main
