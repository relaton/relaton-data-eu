title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2561/77 of 21 November 1977 opening, allocating
    and providing for the administration of a Community tariff quota for liqueur wines
    falling within subheading ex 22.05 C of the Common Customs Tariff, originating
    in Cyprus and marketed under the label of 'Cyprus sherry', and introducing subsidies
    for similar wine products produced in the Community (1977)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2561/77 du Conseil, du 21 novembre 1977, portant ouverture
    répartition et mode de gestion d'un contingent tarifaire communautaire de vins
    de liqueur, de la sous-position EX 22.05 C du tarif douanier commun, originaires
    de Chypre, commercialisés sous la mention "cyprus sherry", et instituant des
    aides pour des produits vinicoles similaires produits dans la Communauté (année
    1977)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2561/77 des Rates vom 21. November 1977 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für unter der Bezeichnung
    "Cyprus Sherry" vermarktete Likörweine der Tarifstelle ex 22.05 C des Gemeinsamen
    Zolltarifs mit Ursprung in Zypern und zur Einführung von Beihilfen für gleichartige
    Weinbauerzeugnisse der Gemeinschaft (1977)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2561/77 af 21. november 1977 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for hedvine, henhørende
    under pos. ex 22.05 C i den fælles toldtarif, med oprindelse i Cypern og bragt
    i omsætning under betegnelsen »Cyprus Sherry«, samt om fastsættelse af en
    støtteordning for lignende vinprodukter, der er fremstillet inden for Fællesskabet
    (1977)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2561/77 del Consiglio, del 21 novembre 1977, recante
    apertura, ripartizione e modalità di gestione di un contingente tariffario comunitario
    di vini liquorosi della sottovoce ex 22.05 C della tariffa doganale comune originari
    di Cipro, commercializzati con la menzione «Cyprus Sherry», ed istitutivo di
    aiuti per prodotti vinicoli simili prodotti nella Comunità (anno 1977)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2561/77 van de Raad van 21 november 1977 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor likeurwijnen, van onderverdeling ex 22.05 C van het gemeenschappelijk douanetarief,
    van oorsprong uit Cyprus, in de handel gebracht onder de benaming "Cyprus Sherry",
    en betreffende de invoering van steunmaatregelen voor soortgelijke in de Gemeenschap
    voortgebrachte wijnbouwprodukten (1977)
  type: main
