title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1487/74 of the Council of 13 June 1974 on the temporary
    and partial suspension of the autonomous Common Customs Tariff duty on mackerel,
    fresh, chilled or frozen, whole, headless or in pieces, falling within subheading
    ex 03.01 B I m) 2 and intended for the processing industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1487/74 du Conseil, du 13 juin 1974, portant suspension
    temporaire et partielle du droit autonome du tarif douanier commun sur les maquereaux
    frais, réfrigérés ou congelés, entiers, décapités ou tronçonnés destinés
    à l'industrie de transformation, de la sous-position EX 03.01 B I m)2
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1487/74 des Rates vom 13. Juni 1974 zur zeitweiligen
    und teilweisen Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs
    für Makrelen, frisch, gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt,
    für die Verarbeitungsindustrie, der Tarifstelle ex 03.01 B I m) 2
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1487/74 af 13. juni 1974 om midlertidig og
    delvis suspension af den autonome toldsats i den fælles toldtarif for makrel,
    fersk, kølet eller frosset, hel, uden hoved, renset eller skåret, bestemt til
    forarbejdningsindustrien, henhørende under pos. ex 03.01 B I m) 2
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1487/74 del Consiglio, del 13 giugno 1974, che sospende
    temporaneamente e parzialmente il dazio autonomo della tariffa doganale comune
    sugli sgombri freschi, refrigerati o congelati, interi, decapitati o in pezzi
    destinati all'industria di trasformazione, della sottovoce ex 03.01 B I m) 2
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1487/74 van de Raad van 13 juni 1974 houdende tijdelijke
    en gedeeltelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    op makreel, vers, gekoeld of bevroren, in gehele staat, ook indien ontdaan van
    kop of in moten gesneden, bestemd voor de verwerkende industrie, van onderverdeling
    ex 03.01 B I m) 2
  type: main
