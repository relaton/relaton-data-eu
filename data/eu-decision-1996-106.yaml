id: EUDecision1996106
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/106/EC: Commission Decision of 29 January 1996 amending Decisions 94/187/EC,
    94/309/EC, 94/344/EC, 94/446/EC, 95/341/EC and 95/343/EC laying down the animal
    health requirements and certification for the import of certain products and amending
    Decision 95/340/EC drawing up a provisional list of third countries from which
    Member States authorize imports of milk and milk products'
  type: main
- language: fr
  script: Latn
  content: '96/106/CE: Décision de la Commission, du 29 janvier 1996, modifiant les
    décisions 94/187/CE, 94/309/CE, 94/344/CE, 94/446/CE, 95/341/CE et 95/343/CE
    établissant les conditions sanitaires et la certification requises à l''importation
    de certains produits et modifiant la décision 95/340/CE établissant la liste
    provisoire des pays tiers en provenance desquels les États membres autorisent
    les importations de lait et de produits à base de lait'
  type: main
- language: de
  script: Latn
  content: '96/106/EG: Entscheidung der Kommission vom 29. Januar 1996 zur Änderung
    der Entscheidungen 94/187/EG, 94/309/EG, 94/344/EG, 94/446/EG, 95/341/EG und 95/343/EG
    zur Festlegung der Veterinärbedingungen und Veterinärbescheinigungen für die
    Einfuhr bestimmter Erzeugnisse sowie zur Änderung der Entscheidung 95/340/EG
    zur Erstellung eines vorläufigen Verzeichnisses der Drittländer, aus denen die
    Mitgliedstaaten die Einfuhr von Milch und Erzeugnissen auf Milchbasis zulassen'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. ledna 1996, kterým se mění rozhodnutí
    94/187/ES, 94/309/ES, 94/344/ES, 94/446/ES, 95/341/ES a 95/343/ES o veterinárních
    podmínkách a veterinárních osvědčeních pro dovoz některých produktů
    a kterým se mění rozhodnutí 95/340/ES, kterým se stanoví prozatímní seznam
    třetích zemí, z nichž členské státy povolují dovoz mléka a mléčných
    výrobků
  type: main
- language: da
  script: Latn
  content: '96/106/EF: Kommissionens beslutning af 29. januar 1996 om ændring af
    beslutning 94/187/EF, 94/309/EF, 94/344/EF, 94/446/EF, 95/341/EF og 95/343/EF
    vedrørende dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af visse produkter samt om ændring af beslutning 95/340/EF om
    en foreløbig liste over tredjelande, hvorfra medlemsstaterne tillader import
    af mælk og mælkebaserede produkter'
  type: main
- language: el
  script: Grek
  content: '96/106/ΕΚ: Απόφαση της Επιτροπής, της 29ης Ιανουαρίου
    1996, για την τροποποίηση των αποφάσεων 94/187/ΕΚ,
    94/309/ΕΚ, 34/344/ΕΚ, 94/446/ΕΚ, 95/341/ΕΚ και 95/343/ΕΚ για τη
    θέσπιση των υγεινομικών όρων και της πιστοποίησης
    που απαιτούνται για τις εισαγωγές ορισμένων
    προϊόντων και για την τροποποίηση της απόφασης
    95/340/ΕΚ για την κατάρτιση προσωρινού καταλόγου
    τρίτων χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές γάλακτος και προϊόντων με βάση
    το γάλα'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. jaanuar 1996, millega muudetakse otsuseid 94/187/EÜ,
    94/309/EÜ, 94/344/EÜ, 94/446/EÜ, 95/341/EÜ ja 95/343/EÜ, milles sätestatakse
    loomatervishoiu nõuded ja sertifikaadid teatavate toodete importimiseks, ning
    muudetakse otsust 95/340/EÜ, millega koostatakse esialgne loetelu kolmandatest
    riikidest, kust liikmesriigid lubavad importida piima ja piimatooteid
  type: main
- language: fi
  script: Latn
  content: '96/106/EY: Komission päätös, tehty 29 päivänä tammikuuta 1996, eläinten
    terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista tiettyjen
    tuotteiden tuonnissa tehtyjen päätösten 94/187/EY, 94/309/EY, 94/344/EY, 94/446/EY,
    95/341/EY ja 95/343/EY muuttamisesta ja väliaikaisesta luettelosta kolmansista
    maista, joista jäsenvaltiot sallivat maidon ja maitopohjaisten tuotteiden tuonnin,
    tehdyn päätöksen 95/340/EY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1996. január 29.) az egyes termékek behozatalára
    vonatkozó állat-egészségügyi követelmények megállapításáról és állat-egészségügyi
    bizonyítvány kiállításáról szóló 94/187/EK, 94/309/EK, 94/344/EK, 94/446/EK,
    95/341/EK és 95/343/EK határozat módosításáról, valamint a tagállamok
    által tej és tejalapú termékek behozatalára feljogosított harmadik országok
    ideiglenes jegyzékének létrehozásáról szóló 95/340/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '96/106/CE: Decisione della Commissione, del 29 gennaio 1996, recante modifica
    delle decisioni 94/187/CE, 94/309/CE, 94/344/CE, 94/446/CE, 95/341/CE e 95/343/CE,
    che stabiliscono le norme di polizia sanitaria e di certificazione veterinaria
    per l''importazione di taluni prodotti, e della decisione 95/340/CE, che stabilisce
    l''elenco provvisorio dei paesi terzi dai quali gli Stati membri autorizzano l''importazione
    di latte e di prodotti a base di latte'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1996. gada 29. janvāris), ar ko groza Lēmumus 94/187/EK,
    94/309/EK, 94/344/EK, 94/446/EK, 95/341/EK un 95/343/EK, kuros paredz dzīvnieku
    veselības prasības un dažu produktu ievešanas sertifikāciju, un ar ko groza
    Lēmumu 95/340/EK par tādu trešo valstu pagaidu sarakstu, no kurām dalībvalstis
    atļauj pienu un piena produktu importu
  type: main
- language: lt
  script: Latn
  content: 1996 m. sausio 29 d. Komisijos sprendimas, iš dalies keičiantis Sprendimus
    94/187/EB, 94/309/EB, 94/344/EB, 94/446/EB, 95/341/EB ir 95/343/EB, nustatančius
    gyvūnų sveikatos reikalavimus ir sertifikavimą importuojant tam tikrus produktus,
    bei iš dalies keičiantis Sprendimą 95/340/EB, pateikiantį laikiną trečiųjų
    šalių, iš kurių valstybės narės leidžia importuoti pieną ir pieno pagrindo
    produktus, sąrašą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta’ Jannar 1996 li temenda d-Deċiżjonijiet
    94/187/KE, 94/309/KE, 94/344/KE, 94/446/KE, 95/341/KE u 95/343/KE li jistabbilixxu
    l-ħtiġijiet tas-saħħa ta’ l-annimali u l-attestazzjoni għall-importazzjoni
    ta’ ċerti prodotti u li temenda d-Deċiżjoni 95/340/KE li tistabbilixxi lista
    proviżorja ta’ pajjiżi mhux membri li minn għandhom l-Istati Membri jawtorizzaw
    l-importazzjonijiet tal-ħalib u prodotti tal-ħalib
  type: main
- language: nl
  script: Latn
  content: '96/106/EG: Beschikking van de Commissie van 29 januari 1996 houdende wijziging
    van de Beschikkingen 94/187/EG, 94/309/EG, 94/344/EG, 94/446/EG, 95/341/EG en
    95/343/EG tot vaststelling van de veterinairrechtelijke voorschriften en de voorschriften
    inzake veterinaire certificering voor de invoer van bepaalde produkten, en wijziging
    van Beschikking 95/340/EG tot vaststelling van een voorlopige lijst van derde
    landen waaruit de Lid- Staten de invoer van melk en produkten op basis van melk
    toestaan'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 stycznia 1996 r. zmieniająca decyzje 94/187/WE,
    94/309/WE, 94/344/WE, 94/446/WE, 95/341/WE i 95/343/WE ustanawiające wymagania
    dotyczące zdrowia zwierząt i świadectw przy przywozie niektórych produktów
    oraz zmieniająca decyzję 95/340/WE ustalającą tymczasowy wykaz państw trzecich,
    z których Państwa Członkowskie dopuszczają przywóz mleka i przetworów mlecznych
  type: main
- language: pt
  script: Latn
  content: '96/106/CE: Decisão da Comissão, de 29 de Janeiro de 1996, que altera
    as Decisões 94/187/CE, 94/309/CE, 94/344/CE, 94/446/CE, 95/341/CE e 95/343/CE
    que estabelecem as condições de sanidade animal e da certificação para a importação
    de determinados produtos e altera a Decisão 95/340/CE que estabelece a lista
    provisória de países terceiros a partir dos quais os Estados-membros autorizam
    a importação de leite e de produtos à base de leite'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. januára 1996, ktorým sa menia a dopĺňajú
    rozhodnutia 94/187/ES, 94/309/ES, 94/344/ES, 94/446/ES, 95/341/ES a 95/343/ES,
    ktorými sa stanovujú požiadavky na zdravotný stav zvierat a certifikácie
    pre dovoz určitých výrobkov a ktorým sa mení a dopĺňa rozhodnutie 95/340/ES,
    ktorým sa vytvára predbežný zoznam tretích krajín, z ktorých členské
    štáty povoľujú dovoz mlieka a mliečnych výrobkov
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. januarja 1996 o spremembah Odločb 94/187/ES,
    94/309/ES, 94/344/ES, 94/446/ES, 95/341/ES in 95/343/ES o določitvi zahtev glede
    zdravja živali in certificiranju za uvoz nekaterih izdelkov in o spremembah Odločbe
    95/340/ES o pripravi začasnega seznama tretjih držav, iz katerih države članice
    odobrijo uvoz mleka in mlečnih proizvodov
  type: main
- language: es
  script: Latn
  content: '96/106/CE: Decisión de la Comisión, de 29 de enero de 1996, que modifica
    las Decisiones 94/187/CE, 94/309/CE, 94/344/CE, 94/446/CE, 95/341/CE y 95/343/CE,
    por las que se establecen las condiciones sanitarias y el certificado veterinario
    para la importación de determinados productos, así como la Decisión 95/340/CE,
    por la que se establece la lista provisional de terceros países de los que los
    Estados miembros autorizan la importación de leche y productos lácteos'
  type: main
- language: sv
  script: Latn
  content: '96/106/EG: Kommissionens beslut av den 29 januari 1996 om ändring av
    beslut 94/187/EG, 94/309/EG, 94/344/EG, 94/446/EG, 95/341/EG och 95/343/EG om
    djurhälsokrav och utfärdande av intyg för import av vissa produkter och om
    ändring av beslut 95/340/EG om upprättande av en provisorisk förteckning över
    tredje länder från vilka medlemsstaterna tillåter import av mjölk och mjölkbaserade
    produkter'
  type: main
