type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 234/2010 of 19 March 2010 laying down certain
    detailed rules for the application of Council Regulation (EC) No 1234/2007 on
    the granting of export refunds on cereals and the measures to be taken in the
    event of disturbance on the market for cereals (Codified version)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 234/2010 de la Commission du 19 mars 2010 établissant
    certaines modalités d'application du règlement (CE) n o 1234/2007 du Conseil
    en ce qui concerne l'octroi des restitutions à l'exportation ainsi que les mesures
    à prendre, en cas de perturbation, dans le secteur des céréales (Version codifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 234/2010 der Kommission vom 19. März 2010 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1234/2007 des Rates hinsichtlich der Gewährung von Ausfuhrerstattungen
    und zur Festlegung der bei Störungen im Getreidesektor zu treffenden Maßnahmen
    (kodifizierte Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 234/2010 на Комисията от 19
    март 2010 година относно определяне на някои
    подробни правила за прилагането на Регламент
    (ЕО) № 1234/2007 на Съвета за предоставяне на възстановявания
    при износ на зърнени култури и мерките, които
    е необходимо да се предприемат в случай на
    затруднения във функционирането на пазара
    на зърнени култури (Кодифицирана версия)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 234/2010 ze dne 19. března 2010 , kterým
    se stanoví některá prováděcí pravidla k nařízení Rady (ES) č. 1234/2007,
    pokud jde o poskytování vývozních náhrad pro obiloviny, jakož i opatření,
    která je třeba přijmout v případě narušení trhu s obilovinami (kodifikované
    znění)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 234/2010 af 19. marts 2010 om visse gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1234/2007 for så vidt angår ydelse af eksportrestitutioner
    for korn samt de foranstaltninger, der skal træffes inden for kornsektoren i
    tilfælde af markedsforstyrrelser (Kodificeret udgave)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 234/2010 της Επιτροπής,
    της 19ης Μαρτίου 2010 , περί θεσπίσεως ορισμένων
    λεπτομερών κανόνων εφαρμογής του κανονισμού
    (ΕΚ) αριθ. 1234/2007 του Συμβουλίου όσον αφορά τη
    χορήγηση επιστροφών κατά την εξαγωγή καθώς
    και τα μέτρα τα οποία πρέπει να λαμβάνονται
    σε περίπτωση διαταραχής της αγοράς στον τομέα
    των σιτηρών (Κωδικοποιημένη έκδοση)
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 234/2010, 19. märts 2010 , millega kehtestatakse
    teravilja eksporditoetuste andmist ja teraviljaturu häirete korral võetavaid
    meetmeid käsitleva nõukogu määruse (EÜ) nr 1234/2007 teatavad üksikasjalikud
    rakenduseeskirjad (kodifitseeritud versioon)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 234/2010, annettu 19 päivänä maaliskuuta 2010
    , neuvoston asetuksen (EY) N:o 1234/2007 tietyistä yksityiskohtaisista soveltamissäännöistä
    vientitukien myöntämisen ja häiriötilanteessa toteutettavien toimenpiteiden
    osalta vilja-alalla (Kodifioitu toisinto)
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 234/2010 od 19. ožujka 2010. o utvrđivanju određenih
    detaljnih pravila za primjenu Uredbe Vijeća (EZ) br. 1234/2007 o odobravanju
    izvoznih subvencija za žitarice i o mjerama koje treba poduzeti u slučaju poremećaja
    na tržištu žitarica (kodificirana verzija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 234/2010/EU rendelete ( 2010. március 19. ) a gabonafélékkel
    kapcsolatos export-visszatérítés nyújtására és a gabonafélék piacán
    bekövetkező zavarok esetén hozandó intézkedésekre vonatkozóan az 1234/2007/EK
    tanácsi rendelet alkalmazásának egyes részletes szabályainak megállapításáról
    (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 234/2010 della Commissione, del 19 marzo 2010 , che
    stabilisce modalità di applicazione del regolamento (CE) n. 1234/2007 del Consiglio,
    riguardo alla concessione delle restituzioni all'esportazione e alle misure da
    adottare in caso di turbative nel settore dei cereali (versione codificata)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 234/2010 ( 2010. gada 19. marts ), ar ko paredz
    sīki izstrādātus noteikumus par to, kā piemērot Padomes Regulu (EK) Nr. 1234/2007
    attiecībā uz labības eksporta kompensāciju piešķiršanu un pasākumiem,
    kas jāveic, rodoties traucējumiem labības tirgū (versione codificata)
  type: main
- language: lt
  script: Latn
  content: 2010 m. kovo 19 d. Komisijos reglamentas (ES) Nr. 234/2010, nustatantis
    kai kurias išsamias Tarybos reglamento (EB) Nr. 1234/2007 taikymo taisykles dėl
    eksporto grąžinamųjų išmokų už grūdus skyrimo ir priemonių, taikytinų
    esant trikdymams grūdų rinkoje (Kodifikuota redakcija)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 234/2010 tad- 19 ta’ Marzu 2010 li
