    nadomestil za žita in ukrepih, ki jih je treba sprejeti v primeru motenj na trgu
    z žiti (Kodificirana različica)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 234/2010 de la Comisión, de 19 de marzo de 2010 ,
    por el que se establecen determinadas disposiciones de aplicación del Reglamento
    (CE) n o 1234/2007 del Consejo en lo que respecta a la concesión de las restituciones
    a la exportación y a las medidas que deben adoptarse en caso de perturbación
    en el sector de los cereales (versión codificada)
  type: main
- language: sv
  script: Latn
