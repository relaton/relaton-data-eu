    (KE) Nru 1234/2007 dwar l-għotja ta' rifużjonijiet fuq l-esportazzjoni ta' ċereali
    u l-miżuri li għandhom jittieħdu f'każ ta' disturb fis-suq taċ-ċereali (Verżjoni
    kkodifikata)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 234/2010 van de Commissie van 19 maart 2010 tot vaststelling
    van enkele toepassingsbepalingen van Verordening (EG) nr. 1234/2007 van de Raad
    wat de toekenning, in de graansector, van uitvoerrestituties en van bij verstoring
    van de graanmarkt te treffen maatregelen betreft (gecodificeerde versie)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 234/2010 z dnia 19 marca 2010 r. ustanawiające
    niektóre szczegółowe zasady wykonania rozporządzenia Rady (WE) nr 1234/2007
    w sprawie przyznawania refundacji wywozowych do zbóż oraz środków podejmowanych
    w przypadku występowania zakłóceń na rynku zbóż (Wersja ujednolicona)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 234/2010 da Comissão, de 19 de Março de 2010 ,
    que estabelece normas de execução do Regulamento (CE) n. o 1234/2007 do Conselho,
    no que diz respeito à concessão de restituições à exportação, bem como
    as medidas a tomar em caso de perturbação, no sector dos cereais (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 234/2010 al Comisiei din 19 martie 2010 de stabilire
    a unor norme de aplicare a Regulamentului (CE) nr. 1234/2007 al Consiliului privind
    acordarea restituirilor la export pentru cereale și a măsurilor care trebuie
    luate în cazul dereglării piețelor în sectorul cerealelor (Versiune codificată)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 234/2010 z 19. marca 2010 ustanovujúce určité
    podrobné pravidlá uplatňovania nariadenia Rady (ES) č. 1234/2007 o poskytovaní
    vývozných náhrad pre obilie a o opatreniach, ktoré sa majú prijať v prípade
    narušenia trhu s obilninami (kodifikované znenie)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 234/2010 z dne 19. marca 2010 o določitvi nekaterih
