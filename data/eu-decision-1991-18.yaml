id: EUDecision199118
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '91/18/EEC: Commission Decision of 19 December 1990 authorizing certain
    Member States to apply intra- Community surveillance to imports originating in
    third countries which have been put into free circulation in the Community and
    which may be the subject of protective measures under Article 115 of the Treaty
    (only the Spanish, Danish, English, French, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/18/CEE: Décision de la Commission du 19 décembre 1990 autorisant
    certains États membres à instaurer une surveillance intracommunautaire des importations
    de produits originaires de pays tiers, mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité (Les textes en langues espagnole, danoise, anglaise, française,
    italienne et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 19. Dezember 1990 zur Ermächtigung bestimmter
    Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung der
    Einfuhren von aus Drittländern stammenden, in der Gemeinschaft im freien Verkehr
    befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages unterworfen
    werden können (Nur der spanische, der dänische, der englische, der französische,
    der italienische und der portugiesische Text sind verbindlich) (91/18/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 19. december 1990 om bemyndigelse af visse
    medlemsstater til at indføre tilsyn inden for Fællesskabet med indførsel af
    produkter, der har oprindelse i tredjelande og er overgået til fri omsætning
    i Fællesskabet, og som ville kunne gøres til genstand for beskyttelsesforanstaltninger
    i henhold til Traktatens artikel 115 (Kun de spanske, danske, engelske, franske,
    italienske og portugisiske udgaver er autentiske) (91/18/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/18/ΕΟΚ: Απόφαση της Επιτροπής της 19ης Δεκεμβρίου
    1990 που εξουσιοδοτεί ορισμένα κράτη μέλη να
    θεσπίσουν ενδοκοινοτική επιτήρηση των εισαγωγών
    προϊόντων καταγωγής τρίτων χωρών, τα οποία
    τίθενται σε ελεύθερη κυκλοφορία στην Κοινότητα
    και τα οποία μπορούν να αποτελέσουν αντικείμενο
    μέτρων προστασίας δυνάμει του άρθρου 115 της
    συνθήκης'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 19 dicembre 1990 che autorizza taluni
    Stati membri ad istituire una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari dei paesi terzi, messi in libera pratica nella Comunità
    che possono essere oggetto di misure di protezione ai sensi dell'' articolo 115
    del trattato (I testi in lingua danese, francese, inglese, italiana, portoghese
    e spagnola sono i soli facenti fede) (91/18/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 19 december 1990 houdende machtiging
    van bepaalde Lid-Staten om over te gaan tot het instellen van een intracommunautair
    toezicht ten aanzien van de invoer van produkten van oorsprong uit derde landen
    die in de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen
    zijn van beschermende maatregelen krachtens artikel 115 van het Verdrag (Slechts
    de teksten in de Spaanse, de Deense, de Engelse, de Franse, de Italiaanse en de
    Portugese taal zijn authentiek) (91/18/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 19 de Dezembro de 1990 que autoriza certos Estados-membros
    a procederem a uma vigilância intracomunitária das importações de produtos
    originários de países terceiros introduzidos em livre prática na Comunidade,
    susceptíveis de serem objecto de medidas de protecção ao abrigo do artigo 115º
    do Tratado (Apenas fazem fé os textos nas línguas espanhola, dinamarquesa, inglesa,
    francesa, italiana e portuguesa) (91/18/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 19 de diciembre de 1990 por la que se autoriza
    a ciertos Estados miembros a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de productos originarios de terceros países
    despachados a libre práctica en la Comunidad que pueden ser objeto de medidas
    de protección en virtud de lo dispuesto en el artículo 115 del Tratado (Los
    textos en lengua española, danesa, inglesa, francesa, italiana y portuguesa son
    los únicos auténticos) (91/18/CEE) #'
  type: main
