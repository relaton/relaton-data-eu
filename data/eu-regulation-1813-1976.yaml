title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1813/76 of 27 July 1976 concerning the issue
    of an invitation to tender for the supply to the International Committee of the
    Red Cross, for the benefit of various third countries, for use as food aid, of
    vitaminized skimmed-milk powder to be purchased on the Community market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1813/76 de la Commission, du 27 juillet 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté et destiné
    au Comité international de la Croix-Rouge pour différents pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1813/76 der Kommission vom 27. Juli 1976 über eine
    Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft gekauftem
    Magermilchpulver mit zugesetzten Vitaminen, das im Rahmen der Nahrungsmittelhilfe
    an das Internationale Komitee vom Roten Kreuz für verschiedene Drittländer bestimmt
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1813/76 af 27. juli 1976 om licitation
    med henblik på levering af vitaminiseret skummetmælkspulver, der er opkøbt
    på Fællesskabets marked og bestemt til Den internationale Røde Kors Komité
    som fødevarehjælp til forskellige tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1813/76 della Commissione, del 27 luglio 1976, che
    indice una gara per la fornitura a titolo di aiuto alimentare di latte scremato
    in polvere vitaminizzato acquistato sul mercato della Comunità e destinato al
    comitato internazionale della Croce Rossa per consegna a vari paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1813/76 van de Commissie van 27 juli 1976 met betrekking
    tot de openbare inschrijving voor de levering van gevitamineerd magere-melkpoeder,
    gekocht op de markt van de Gemeenschap en bestemd voor het Internationaal Comité
    van het Rode Kruis in het kader van de voedselhulp aan verschillende derde landen
