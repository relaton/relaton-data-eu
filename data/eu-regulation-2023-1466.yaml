  content: Commission Implementing Regulation (EU) 2023/1466 of 14 July 2023 amending
    Annexes V, XIV, XV and XIX to Implementing Regulation (EU) 2021/404 as regards
    the entries for Canada, Namibia, the United Kingdom and the United States in the
    lists of third countries authorised for the entry into the Union of consignments
    of poultry, germinal products of poultry, fresh meat of poultry and game birds,
    meat products of poultry and wild game birds and eggs and egg products
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1466 de la Commission du 14 juillet
    2023 modifiant les annexes V, XIV, XV et XIX du règlement d’exécution (UE)
    2021/404 en ce qui concerne les mentions relatives au Canada, aux États-Unis,
    à la Namibie et au Royaume-Uni dans les listes des pays tiers en provenance desquels
    l’entrée dans l’Union d’envois de volailles, de produits germinaux de volailles,
    de viandes fraîches de volailles et de gibier à plumes, de produits à base
    de viande de volailles et de gibier à plumes et d’œufs et produits à base
    d’œufs est autorisée
  type: main
