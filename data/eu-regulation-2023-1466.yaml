    2021/404 hinsichtlich der Einträge für Kanada, Namibia, das Vereinigte Königreich
    und die Vereinigten Staaten in den Listen der Drittländer, aus denen der Eingang
    in die Union von Sendungen von Geflügel, Zuchtmaterial von Geflügel, frischem
    Fleisch von Geflügel und Federwild, Fleischerzeugnissen von Geflügel und Federwild
    sowie Eiern und Eiprodukten zulässig ist
