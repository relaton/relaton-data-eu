    az (EU) 2022/558 végrehajtási rendelettel kivetett végleges dömpingellenes
    vámnak a Kínai Népköztársaságból származó, tömb vagy henger alakú mesterséges
    grafit behozatalára történő kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1202 della Commissione, del 19 giugno
