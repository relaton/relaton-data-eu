title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1202 of 19 June 2025 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2022/558
    on imports of certain graphite electrode systems originating in the People’s
    Republic of China to imports of artificial graphite in blocks or cylinders originating
    in the People’s Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1202 de la Commission du 19 juin 2025
    portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) 2022/558 sur les importations de certains systèmes d’électrodes
    en graphite originaires de la République populaire de Chine aux importations
    de graphite artificiel en blocs ou en cylindres originaires de ce même pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1202 der Kommission vom 19. Juni 2025
