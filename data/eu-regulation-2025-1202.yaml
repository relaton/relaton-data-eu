    esecuzione (UE) 2022/558 sulle importazioni di determinati sistemi di elettrodi
    di grafite originari della Repubblica popolare cinese alle importazioni di grafite
    artificiale in blocchi o cilindri originaria della Repubblica popolare cinese
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1202 (2025. gada 19. jūnijs),
