type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2908/84 of 15 October 1984 imposing a provisional
    anti-dumping duty on imports of copper sulphate originating in Poland, accepting
    undertakings given by the Bulgarian and Hungarian exporters of copper sulphate,
    terminating the investigation regarding exports of copper sulphate from Bulgaria
    and Hungary and terminating the proceeding regarding those from Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2908/84 de la Commission du 15 octobre 1984 instituant
    un droit antidumping provisoire sur les importations de sulfate de cuivre originaire
    de Pologne, portant acceptation des engagements souscrits par les exportateurs
    bulgare et hongrois de sulfate de cuivre et portant clôture de l' enquête concernant
    les exportations de sulfate de cuivre originaire de Bulgarie et de Hongrie et
    portant clôture de la procédure concernant les exportations de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2908/84 der Kommission vom 15. Oktober 1984 über
    die Einführung eines vorläufigen Antidumpingzolls auf Einfuhren von Kupfersulfat
    mit Ursprung in Polen, über die Annahme von Verpflichtungen der bulgarischen
    und ungarischen Ausführer von Kupfersulfat, über die Einstellung der Untersuchung
    betreffend die Einfuhren von Kupfersulfat aus Bulgarien und Ungarn und über die
    Einstellung des Verfahrens betreffend Kupfersulfateinfuhren aus Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2908/84 af 15. oktober 1984 om indførelse
    af en midlertidig antidumpingtold på importen af kobbersulfat med oprindelse
    i Polen, om godtagelse af et tilsagn fra de bulgarske og ungarske eksportører
    af kobbersulfat, om afslutning af undersøgelsen vedrørende eksporten af kobbersulfat
    fra Bulgarien og Ungarn, samt om afslutning af proceduren vedrørende eksporten
    af samme vare fra Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2908/84 της Επιτροπής
    της 15ης Οκτωβρίου 1984 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές θειικού
    χαλκού καταγωγής Πολωνίας, για την αποδοχή
    αναλήψεων υποχρεώσεων που έχουν προταθεί από
    τον βούλγαρο και τον ούγγρο εξαγωγέα θειικού
    χαλκού, για την περάτωση της έρευνας όσον αφορά
    τις εξαγωγές θειικού χαλκού από τη Βουλγαρία
    και την Ουγγαρία και για την περάτωση της διαδικασίας
    όσον αφορά τις εξαγωγές από την Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2908/84 della Commissione del 15 ottobre 1984 che
    istituisce un dazio antidumping provvisorio sulle importazioni di solfato di rame
    originario della Polonia, accetta gli impegni offerti dagli esportatori bulgaro
    e ungherese, chiude l' inchiesta relativa alle esportazioni dello stesso prodotto
    originario della Bulgaria e dell' Ungheria e chiude la procedura relativa alle
    importazioni dalla Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2908/84 van de Commissie van 15 oktober 1984 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van kopersulfaat van
    oorsprong uit Polen, tot aanvaarding van de door de Bulgaarse en de Hongaarse
    exporteur van kopersulfaat aangeboden verbintenissen, tot beëindiging van het
    onderzoek betreffende de uitvoer van kopersulfaat uit Bulgarije en Hongarije en
    tot beëindiging van de procedure betreffende die uit Spanje
  type: main
