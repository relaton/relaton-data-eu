title:
- language: en
  script: Latn
  content: '2000/246/EC: Commission Decision of 15 March 2000 authorising Member States
    temporarily to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes, other than potatoes intended for planting, originating
    in Cuba (notified under document number C(2000) 692)'
  type: main
- language: fr
  script: Latn
  content: '2000/246/CE: Décision de la Commission, du 15 mars 2000, autorisant les
    États membres à prévoir à titre temporaire des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne les pommes de terre autres
    que les pommes de terre destinées à la plantation, originaires de Cuba [notifiée
    sous le numéro C(2000) 692]'
  type: main
- language: de
  script: Latn
  content: '2000/246/EG: Entscheidung der Kommission vom 15. März 2000 zur vorübergehenden
    Ermächtigung der Mitgliedstaaten, für Kartoffeln/Erdäpfel mit Ursprung in Kuba,
    die nicht zum Pflanzen bestimmt sind, Ausnahmen von einigen Vorschriften der Richtlinie
    77/93/EWG des Rates zuzulassen (Bekanntgegeben unter Aktenzeichen K(2000) 692)'
  type: main
- language: da
  script: Latn
  content: '2000/246/EF: Kommissionens beslutning af 15. marts 2000 om bemyndigelse
    af medlemsstaterne til midlertidigt at indrømme undtagelser fra visse bestemmelser
    i Rådets direktiv 77/93/EØF for så vidt angår andre kartofler end kartofler
    til udplantning med oprindelse i Cuba (meddelt under nummer K(2000) 692)'
  type: main
- language: el
  script: Grek
  content: '2000/246/ΕΚ: Απόφαση της Επιτροπής, της 15ης
    Μαρτίου 2000, που επιτρέπει προσωρινά στα κράτη
    μέλη να προβλέψουν παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά τα γεώμηλα εκτός από εκείνα που
    προορίζονται για φύτευση, καταγωγής Κούβας
    [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 692]'
  type: main
- language: fi
  script: Latn
  content: '2000/246/EY: Komission päätös, tehty 15 päivänä maaliskuuta 2000,
    luvan antamisesta jäsenvaltioille säätää väliaikaisesti poikkeuksia neuvoston
    direktiivin 77/93/ETY tietyistä säännöksistä Kuubasta peräisin olevien muiden
    kuin istutettavaksi tarkoitettujen perunoiden osalta (tiedoksiannettu numerolla
    K(2000) 692)'
  type: main
- language: it
  script: Latn
  content: '2000/246/CE: Decisione della Commissione, del 15 marzo 2000, che autorizza
    temporaneamente gli Stati membri a prevedere deroghe a talune disposizioni della
    direttiva 77/93/CEE del Consiglio per le patate diverse da quelle destinate alla
    piantagione originarie di Cuba [notificata con il numero C(2000) 692]'
  type: main
- language: nl
  script: Latn
  content: '2000/246/EG: Beschikking van de Commissie van 15 maart 2000 tot machtiging
    van de lidstaten om voor niet voor opplant bestemde aardappelen van oorsprong
    uit Cuba tijdelijk afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad toe te staan (kennisgeving geschied onder nummer C(2000) 692)'
  type: main
- language: pt
  script: Latn
  content: '2000/246/CE: Decisão da Comissão, de 15 de Março de 2000, que autoriza
