title:
- language: en
  script: Latn
  content: '80/301/EEC: Commission Decision of 25 February 1980 amending Decision
    70/47/EEC exempting the French Republic from applying to certain species the Council
    Directives of 14 June 1966 on the marketing of fodder plant and cereal seed (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/301/CEE: Décision de la Commission, du 25 février 1980, modifiant
    la décision 70/47/CEE dispensant la République française d''appliquer, à certaines
    espèces, les directives du Conseil, du 14 juin 1966, concernant la commercialisation
    des semences de plantes fourragères et céréales (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/301/EWG: Entscheidung der Kommission vom 25. Februar 1980 zur Änderung
    der Entscheidung 70/47/EWG über die Entbindung der Französischen Republik von
    der Verpflichtung, die Richtlinien des Rates vom 14. Juni 1966 über den Verkehr
    mit Futterpflanzensaatgut und Getreidesaatgut hinsichtlich einiger Arten anzuwenden
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/301/EØF: Kommissionens beslutning af 25. februar 1980 om ændring
    af beslutning 70/47/EØF om fritagelse af Den Franske Republik for at anvende
    Rådets direktiver af 14. juni 1966 om handel med frø af foderplanter og sædekorn
    i henseende til visse arter (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
