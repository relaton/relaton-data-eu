    der Bundesrepublik Deutschland und Griechenland gegenüber China für einige gewerbliche
    Waren angewandten Einfuhrregelung (Nur der französische, niederländische, deutsche
    und griechische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/912/EØF: Kommissionens beslutning af 15. december 1982 om ændring
    af den importordning, der er fastsat ved Kommissionens beslutning 81/248/EØF,
    og som anvendes i Benelux-landene, Forbundsrepublikken Tyskland og Grækenland
    over for Kina, for så vidt angår forskellige industrivarer (Kun de franske,
    nederlandske, tyske, og græske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
