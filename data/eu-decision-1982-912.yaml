    που προβλέπεται από την απόφαση 81/248/EOK της Επιτροπής
    και εφαρμόζεται στη Μπενελούξ, στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας και στην Ελλάδα, έναντι
