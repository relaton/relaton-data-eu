title:
- language: en
  script: Latn
  content: '82/912/EEC: Commission Decision of 15 December 1982 changing the import
    arrangements established by Commission Decision 81/248/EEC and applied in the
    Benelux countries, the Federal Republic of Germany and Greece in respect of China
    regarding various industrial products (Only the French, Dutch, German and Greek
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/912/CEE: Décision de la Commission, du 15 décembre 1982, modifiant
    le régime d''importation prévu par la décision 81/248/CEE de la Commission
    et appliqué au Benelux, en République fédérale d''Allemagne et en Grèce à
    l''égard de la Chine en ce qui concerne divers produits industriels (Les textes
    en langues française, néerlandaise, allemande, et grecque sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '82/912/EWG: Entscheidung der Kommission vom 15. Dezember 1982 zur Änderung
