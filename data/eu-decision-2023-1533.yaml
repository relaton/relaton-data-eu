    overeenstemming met de overeenkomstige eisen van het milieubeheer- en milieuauditsysteem
    (EMAS) overeenkomstig artikel 45 van Verordening (EG) nr. 1221/2009 van het Europees
    Parlement en de Raad
  type: main
