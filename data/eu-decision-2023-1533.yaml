    (EMAS) asjaomastele nõuetele kooskõlas Euroopa Parlamendi ja nõukogu määruse
    (EÜ) nr 1221/2009 artikliga 45
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/1533, annettu 24 päivänä
    heinäkuuta 2023, Ecoprofit-ympäristöjärjestelmän vaatimusten tunnustamisesta
    ympäristöasioiden hallinta- ja auditointijärjestelmän (EMAS-järjestelmän)
    vastaavien vaatimusten mukaisiksi Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1221/2009 45 artiklan mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/1533 ón gCoimisiún an 24 Iúil 2023
    maidir le haitheantas a thabhairt do cheanglais chóras bainistíochta comhshaoil
    Ecoprofit mar cheanglais a chomhlíonann ceanglais chomhfhreagracha na scéime
    um bainistíocht agus iniúchadh comhshaoil (EMAS) i gcomhréir le hAirteagal
    45 de Rialachán (CE) Uimh. 1221/2009 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/1533 оd 24. srpnja 2023. o priznavanju
    usklađenosti zahtjeva sustava upravljanja okolišem Ecoprofit s odgovarajućim
    zahtjevima sustava upravljanja okolišem i neovisnog ocjenjivanja (EMAS) u skladu
    s člankom 45. Uredbe (EZ) br. 1221/2009 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1533 végrehajtási határozata (2023. július 24.)
    az 1221/2009/EK európai parlamenti és tanácsi rendelet 45. cikkének megfelelően
    az Ecoprofit környezetvédelmi vezetési rendszer követelményeinek a környezetvédelmi
    vezetési és hitelesítési rendszer (EMAS) megfelelő követelményeit teljesítő
    követelményekként való elismeréséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/1533 della Commissione del 24 luglio
    2023 sul riconoscimento dei requisiti del sistema di gestione ambientale Ecoprofit
    come conformi ai corrispondenti requisiti del sistema di ecogestione e audit (EMAS),
    a norma dell’articolo 45 del regolamento (CE) n. 1221/2009 del Parlamento europeo
    e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/1533 (2023. gada 24. jūlijs),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulas (EK) Nr. 1221/2009 par
    organizāciju brīvprātīgu dalību Kopienas vides vadības un audita sistēmā
    45. pantu vidiskās pārvaldības sistēmas Ecoprofit prasības atzīst par tādām,
    kas atbilst attiecīgajām vidiskās vadības un audita sistēmas (EMAS) prasībām
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2023/1533 2023 m. liepos 24 d.
