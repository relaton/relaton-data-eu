    ktorý spĺňa zodpovedajúce požiadavky schémy pre environmentálne manažérstvo
    a audit (EMAS) v súlade s článkom 45 nariadenia Európskeho parlamentu a Rady
    (ES) č. 1221/2009
  type: main
