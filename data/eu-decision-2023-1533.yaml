    atitinkančiais atitinkamus aplinkosaugos vadybos ir audito sistemos (EMAS) reikalavimus
    pagal Europos Parlamento ir Tarybos reglamento (EB) Nr. 1221/2009 45 straipsnį
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/1533 tal-24
