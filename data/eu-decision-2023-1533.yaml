title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1533 of 24 July 2023 on the
    recognition of the requirements of the Ecoprofit environmental management system
    as complying with the corresponding requirements of the eco-management and audit
    scheme (EMAS) in accordance with Article 45 of Regulation (EC) No 1221/2009 of
    the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1533 de la Commission du 24 juillet
    2023 concernant la reconnaissance des exigences du système de management environnemental
    Ecoprofit comme satisfaisant aux exigences correspondantes du système de management
    environnemental et d’audit (EMAS), conformément à l’article 45 du règlement
    (CE) no 1221/2009 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1533 der Kommission vom 24. Juli 2023
    über die Anerkennung der Übereinstimmung der Anforderungen des Umweltmanagementsystems
    Ökoprofit mit den entsprechenden Anforderungen des Gemeinschaftssystems für
    Umweltmanagement und Umweltbetriebsprüfung (EMAS) gemäß Artikel 45 der Verordnung
    (EG) Nr. 1221/2009 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/1533 на Комисията
    от 24 юли 2023 година относно признаването на
    изискванията на системата за управление по
    околна среда Ecoprofit като отговарящи на съответните
    изисквания на Схемата за управление по околна
    среда и одит (EMAS) в съответствие с член 45 от
    Регламент (ЕО) № 1221/2009 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/1533 ze dne 24. července 2023
    o uznání požadavků systému environmentálního řízení Ecoprofit za vyhovující
    příslušným požadavkům systému pro environmentální řízení podniků
    a audit (EMAS) podle článku 45 nařízení Evropského parlamentu a Rady (ES)
    č. 1221/2009
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/1533 af 24. juli 2023
    om anerkendelse af kravene i miljøledelsessystemet Ecoprofit som værende i overensstemmelse
    med de tilsvarende krav i fællesskabsordningen for miljøledelse og miljørevision
    (EMAS) i henhold til artikel 45 i Europa-Parlamentets og Rådets forordning (EF)
    nr. 1221/2009
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/1533 της Επιτροπής
    της 24ης Ιουλίου 2023 σχετικά με την αναγνώριση
    της συμμόρφωσης των απαιτήσεων του συστήματος
    περιβαλλοντικής διαχείρισης Ecoprofit με τις αντίστοιχες
    απαιτήσεις του συστήματος οικολογικής διαχείρισης
    και οικολογικού ελέγχου (EMAS) σύμφωνα με το άρθρο
    45 του κανονισμού (ΕΚ) αριθ. 1221/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/1533, 24. juuli 2023, millega tunnistatakse
