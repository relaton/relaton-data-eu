type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 avril 1972, autorisant la République
    française à exclure du traitement communautaire les jouets en bois et autres
    (à l'exception des moteurs et mécanismes d'animation pour les jouets et modèles
    réduits ainsi que leurs pièces détachées), de la position 97.03 A et Ex B
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '72/195/EWG: Entscheidung der Kommission vom 21. April 1972, mit der die
    Französische Republik ermächtigt wird, aus Japan stammendes und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches Spielzeug aus Holz und anderes
    (mit Ausnahme der Motoren und Bewegungsmechanismen für Spielzeug und Modelle
    zum Spielen sowie deren Ersatzteile) der Tarifnummer 97.03 A und ex B des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/195/CEE: Decisione della Commissione, del 21 aprile 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli di
    legno ed altri (eccetto i motori ed i meccanismi d''animazione per giocattoli
    e modelli ridotti ed i loro pezzi staccati) della voce n. 97.03 A ed ex B della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/195/EEG: Beschikking van de Commissie van 21 april 1972 waarbij de
    Franse Republiek wordt gemachtigd speelgoed van hout en andere (met uitzondering
    van motoren en bewegingsmechanismen voor speelgoed en modellen op schaal alsmede
    hun onderdelen) van post 97.03 A en ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
