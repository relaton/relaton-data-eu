  type: main
- language: fi
  script: Latn
  content: Kolmas komission direktiivi 83/381/ETY, annettu 28 päivänä heinäkuuta
    1983, suurimmista sallituista haitallisten aineiden ja tuotteiden pitoisuuksista
    rehuissa annetun neuvoston direktiivin 74/63/ETY liitteen muuttamisesta
  type: main
- language: it
  script: Latn
  content: Terza direttiva 83/381/CEE della Commissione del 28 luglio 1983 che modifica
    l'allegato della direttiva 74/63/CEE del Consiglio relativa alla fissazione di
    quantità massime per le sostanze e per i prodotti indesiderabili negli alimenti
    per gli animali
  type: main
- language: nl
  script: Latn
  content: Derde Richtlijn 83/381/EEG van de Commissie van 28 juli 1983 houdende wijziging
