title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 mai 1969, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas, en vertu de l'article
    115 alinéa 1 du Traité, à exclure du traitement communautaire les gants de
    protection pour tous métiers, en cuir, de la position Ex 42.03 B I du Tarif douanier
    commun originaires de la République populaire de Chine et mis en libre pratique
    dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '69/176/EWG: Entscheidung der Kommission vom 27. Mai 1969, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    auf Grund von Artikel 115 Absatz 1 des Vertrages ermächtigt werden, Schutzhandschuhe
    für alle Berufe, aus Leder (Tarifnr. ex 42.03 B I des Gemeinsamen Zolltarifs),
    mit Ursprung in der Volksrepublik China, die sich in anderen Mitgliedstaaten im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/176/CEE: Decisione della Commissione, del 27 maggio 1969, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi,
    a norma dell''articolo 115, comma 1, del trattato, ad escludere dal trattamento
    comunitario i guanti di protezione per qualunque mestiere, di cuoio, della voce
    ex 42.03 BI della tariffa doganale comune provenienti dalla Repubblica popolare
    cinese e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/176/EEG: Beschikking van de Commissie van 27 mei 1969 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, op grond
    van artikel 115, eerste alinea, van het Verdrag, worden gemachtigd werkhandschoenen
    en -wanten, van leder, van post ex 42.03 B I van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China, die in andere Lid-Staten in het vrije
    verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
