  content: Council Regulation (EC) No 1448/2001 of 28 June 2001 amending, as regards
    structural measures, Regulation (EEC) No 3763/91 introducing specific measures
    in respect of certain agricultural products for the benefit of the French overseas
    departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1448/2001 du Conseil du 28 juin 2001 modifiant, en
