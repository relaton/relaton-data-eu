    specifieke maatregelen voor bepaalde landbouwproducten ten behoeve van de Franse
    overzeese departementen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1448/2001 do Conselho, de 28 de Junho de 2001, que
