title:
- language: en
  script: Latn
  content: '84/265/EEC: Commission Decision of 7 May 1984 establishing that the apparatus
    described as ''Rigaku - X-ray Diffractometer System based on Theta-Theta Goniometer,
    model 2182 D5'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/265/CEE: Décision de la Commission du 7 mai 1984 constatant que l''importation
    de l''appareil dénommé "Rigaku - X-ray Diffractometer system based on Theta
    - Theta goniometer, model 2182 D5" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/265/EWG: Entscheidung der Kommission vom 7. Mai 1984, mit der festgestellt
    wird, daß das Gerät ,,Rigaku - X- ray Diffractometer System based on Theta-Theta
    Goniometer, model 2182 D5" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '84/265/EØF: Kommissionens beslutning af 7. maj 1984 om fastslåelse af,
    at indførsel af apparatet "Rigaku - X- ray Diffractometer System based on Theta-Theta
    goniometer, model 2182 D5" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/265/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Μαΐου
    1984 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «Rigaku — X-Ray Diffractometer System based on
    Theta-Theta Goniometer, Model 2182 D5» δεν δύναται να πραγματοποιηθεί
    ατελώς ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '84/265/CEE: Decisione della Commissione del 7 maggio 1984 che stabilisce
    che l''importazione dell''apparecchio denominato "Rigaku - X-ray Diffractometer
    system based on Theta-Theta goniometer, model 2182 D5" non può avvenire in franchigia
    dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '84/265/EEG: Beschikking van de Commissie van 7 mei 1984 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Rigaku - X-ray Diffractometer System based
