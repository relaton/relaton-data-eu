title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2055/76 of 19 August 1976 re-establishing
    the levying of customs duties on gelatin and gelatin derivatives, glues derived
    from bones, etc., other, falling within subheading 35.03 B, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2055/76 de la Commission, du 19 août 1976, portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés, colles d'os, etc., autres, de la sous-position tarifaire 35.03
    B, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2055/76 der Kommission vom 19. August 1976 zur Wiedereinführung
    des Zollsatzes für Gelatine und ihre Derivate, Glutinleime usw., andere, der
    Tarifstelle 35.03 B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2055/76 af 19. august 1976 om genindførelse
    af opkrævning af toldafgifter for gelatine og gelatinederivater; benlim, etc.,
    andre varer, under underposition 35.03 B, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2055/76 della Commissione, del 19 agosto 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati,
    colle d'ossa, ecc., altri, della sottovoce doganale n. 35.03 B originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2055/76 van de Commissie van 19 augustus 1976 houdende
    wederinstelling van de douanerechten voor gelatine en derivaten daarvan, lijm
    van beenderen, enz., andere, van onderverdeling 35.03 B, van oorsprong uit de
    ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van
    de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
