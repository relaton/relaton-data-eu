  content: Commission Regulation (EEC) No 180/84 of 25 January 1984 extending the
    suspension of the non-transferability of rights arising from export licences in
    the milk and milk products sector provided for in Regulation (EEC) No 2729/81
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 180/84 de la Commission du 25 janvier 1984 portant
