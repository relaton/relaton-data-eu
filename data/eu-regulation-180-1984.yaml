    découlant du certificat d' exportation dans le secteur du lait et des produits
    laitiers prévue au règlement (CEE) no 2729/81
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 180/84 der Kommission vom 25. Januar 1984 zur Verlängerung
    der Aussetzung der Nichtübertragbarkeit der Rechte aus Ausfuhrlizenzen für Milch
    und Milcherzeugnisse gemäß Verordnung (EWG) Nr. 2729/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 180/84 af 25. januar 1984 om fortsat
    suspension af forbudet mod at overdrage de rettigheder der følger af en eksportlicens
    i sektoren for mælk og mejeriprodukter, som fastsat ved forordning (EØF) nr.
    2729/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 180/84 της Επιτροπής
