  content: Council Regulation (EEC) No 2386/77 of 28 October 1977 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and Turkey fixing the additional amount to be deducted from the levy
    on imports into the Community of untreated olive oil, originating in Turkey, for
    the period 1 November 1977 to 31 October 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2386/77 du Conseil, du 28 octobre 1977, concernant
    la conclusion de l'accord sous forme d'échange de lettres entre la Communauté
    économique européenne et la Turquie fixant, pour la période du 1er novembre
    1977 au 31 octobre 1978, le montant additionnel à déduire du prélèvement applicable
    à l'importation dans la Communauté d'huile d'olive non traitée originaire de
    Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2386/77 des Rates vom 28. Oktober 1977 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Türkei zur Festsetzung des vom 1. November 1977 bis 31. Oktober 1978
    geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht behandeltem
    Olivenöl mit Ursprung in der Türkei von der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2386/77 af 28. oktober 1977 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Tyrkiet vedrørende fastsættelse for perioden 1. november 1977 - 31. oktober
    1978 af det tillægsbeløb, som skal fratrækkes den afgift, der anvendes ved
    indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse i Tyrkiet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2386/77 del Consiglio, del 28 ottobre 1977, relativo
    alla conclusione dell'accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e la Turchia, che fissa, per il periodo 1 novembre 1977 - 31
    ottobre 1978, l'importo aggiuntivo da detrarre dal prelievo applicabile all'importazione
    nella Comunità di olio di oliva non trattato originario della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2386/77 van de Raad van 28 oktober 1977 betreffende
    de sluiting van een Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en Turkije tot vaststelling, voor het tijdvak van 1 november
    1977 tot en met 31 oktober 1978, van het aanvullend bedrag dat in mindering moet
    worden gebracht op de heffing die bij invoer in de Gemeenschap van toepassing
    is op niet-behandelde olijfolie van oorsprong uit Turkije
