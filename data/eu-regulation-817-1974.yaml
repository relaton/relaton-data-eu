title:
- language: en
  script: Latn
  content: Regulation (EEC) No 817/74 of the Commission of 5 April 1974 authorizing
    Denmark, the United Kingdom and Ireland to suspend temporarily customs duties
    on certain fats and oils of fish and marine mammals under tariff heading 15.12
    B imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 817/74 de la Commission, du 5 avril 1974, autorisant
    le Danemark, le Royaume-Uni et l'Irlande à suspendre temporairement les droits
    de douane pour certaines graisses et huiles de poisson et mammifères marins de
    la sous-position tarifaire EX 15.12 B importées en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 817/74 der Kommission vom 5. April 1974 zur Ermächtigung
    Dänemarks, des Vereinigten Königreichs und Irlands die Zölle für verschiedene
    Fette und Öle von Fischen und Meeressäugetieren aus anderen Mitgliedstaaten
    der Zolltarifstelle ex 15.12 B vorübergehend auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 817/74 af 5. april 1974 om bemyndigelse
    til Danmark, Det forenede Kongerige og Irland til midlertidigt at suspendere tolden
    på visse fedtstoffer og olier, udvundet af fisk og havpattedyr, henhørende under
    toldposition ex 15.12 B og som indføres fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 817/74 della Commissione, del 5 aprile 1974, che autorizza
    la Danimarca, il Regno Unito e l'Irlanda a sospendere temporaneamente i diritti
    doganali su taluni grassi e oli di pesci e mammiferi marini della sottovoce tariffaria
    ex 15.12 B importati in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 817/74 van de Commissie van 5 april 1974 waarbij
    Denemarken, het Verenigd Koninkrijk en Ierland worden gemachtigd de douanerechten
    van toepassing op bepaalde oliën en vetten van vis en zeezoogdieren van post
    ex 15.12 B die uit de andere Lid-Staten worden ingevoerd tijdelijk te schorsen
  type: main
