title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 241/79 of 8 February 1979 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 241/79 de la Commission, du 8 février 1979, modifiant
    le règlement (CEE) n° 467/77 relatif à la méthode et au taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions consistant
    en achats, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 241/79 der Kommission vom 8. Februar 1979 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 241/79 af 8. februar 1979 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregning af finansudgifter i forbindelse med interventioner i form af opkøb,
    oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 241/79 της Επιτροπής
    της 8ης Φεβρουαρίου 1979 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 467/77 «περί της μεθόδου
    και του επιτοκίου που πρέπει να εφαρμοστούν
    για τον υπολογισμό των εξόδων της χρηματοδοτήσεως
    των παρεμβάσεων των σχετικών με αγορές και
    διάθεση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 241/79 della Commissione, dell' 8 febbraio 1979, che
    modifica il regolamento (CEE) n. 467/77 che stabilisce il metodo ed il tasso di
    interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 241/79 van de Commissie van 8 februari 1979 tot wijziging
    van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de rentevoet
    die dienen te worden toegepast bij de berekening van de financieringskosten van
    de interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 241/79 da Comissão, de 8 de Fevereiro de 1979,
    que altera o Regulamento (CEE) n.° 467/77 relativo ao método e à taxa de juro
    a aplicar para o cálculo das despesas de financiamento das intervenções que
    consistem em compras, armazenagem e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 241/79 de la Comisión, de 8 de febrero de 1979, por
    el que se modifica el Reglamento (CEE) n° 467/77 relativo al método y al tipo
    de interés que deben aplicarse para el cálculo de los gastos de financiación
    de las intervenciones consistentes en la compra, almacenamiento y comercialización
  type: main
