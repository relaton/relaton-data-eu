title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3433/81 of 26 November 1981 laying down
    detailed rules for the application of Regulation (EEC) No 1796/81 as regards imports
    of preserved cultivated mushrooms originating in non-member countries and amending
    Regulation (EEC) No 950/68 on the Common Customs Tariff
  type: main
