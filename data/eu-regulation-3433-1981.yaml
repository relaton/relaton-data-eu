    modifica del regolamento (CEE) n. 950/68, relativo alla tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3433/81 van de Commissie van 26 november 1981 houdende
    uitvoeringsbepalingen van Verordening (EEG) nr. 1796/81 met betrekking tot de
    invoer van conserven van gekweekte paddestoelen van oorsprong uit derde landen
    en houdende wijziging van Verordening (EEG) nr. 950/68 betreffende het gemeenschappelijk
    douanetarief
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3433/81 da Comissão, de 26 de Novembro de 1981,
    que estabelece regras de aplicação do Regulamento (CEE) n.° 1796/81 que diz
    respeito às importações de conservas de cogumelos de cultura originários de
    países terceiros e que altera o Regulamento (CEE) n.° 950/68 relativo à pauta
    aduaneira comum
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3433/81 de la Comisión, de 26 de noviembre de 1981,
