title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 587/76 of 15 March 1976 repealing Commission
    Regulation (EEC) No 2582/75 fixing the amounts to be levied by way of accession
    compensatory amounts to prevent deflections of trade in the beef and veal sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 587/76 de la Commission, du 15 mars 1976, abrogeant
    le règlement (CEE) n° 2582/75 de la Commission fixant des montants à percevoir
    au titre des montants compensatoires adhésion en vue de prévenir des détournements
    de trafic dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 587/76 der Kommission vom 15. März 1976 zur Aufhebung
    der Verordnung (EWG) Nr. 2582/75 der Kommission zur Festsetzung der als Beitrittsausgleichsbeträge
    zu erhebenden Beträge zur Vermeidung von Verkehrsverlagerungen im Rindfleischsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 587/76 af 15. marts 1976 om ophævelse
    af Kommissionens forordning (EØF) nr. 2582/75 om fastsættelse af de beløb,
    der skal opkræves som tiltrædelses-udligningsbeløb for at forhindre, at der
    sker fordrejning i samhandelen i oksekødsektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 587/76 della Commissione, del 15 marzo 1976, che abroga
    il regolamento (CEE) n. 2582/75 della Commissione che fissa gli importi da riscuotere
    a titolo di importi compensativi adesione per prevenire deviazioni di traffico
    nel settore delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 587/76 van de Commissie van 15 maart 1976 tot intrekking
    van Verordening (EEG) nr. 2582/75 van de Commissie tot vaststelling van de bedragen
    die als compenserende bedragen ,,toetreding" moeten worden geheven om verleggingen
    van het handelsverkeer in de sector rundvlees te voorkomen
