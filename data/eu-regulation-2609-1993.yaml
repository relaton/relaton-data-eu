title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2609/93 of 23 September 1993 laying down
    certain, additional detailed rules for the application of the supplementary trade
    mechanism (STM) to trade in fruit and vegetables between Spain and the Community
    as constituted on 31 December 1985 as regards certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2609/93 de la Commission, du 23 septembre 1993, fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) entre l'Espagne et la Communauté dans sa composition au 31
    décembre 1985 en ce qui concerne certains fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2609/93 der Kommission vom 23. September 1993 mit
    zusätzlichen Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM)
    zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember
    1985 hinsichtlich bestimmter Obst- und Gemüsesorten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2609/93 af 23. september 1993 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    (SMS) mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985
    for så vidt angår visse frugter og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2609/93 της Επιτροπής
    της 23ης Σεπτεμβρίου 1993 περί καθορισμού ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού κατά τις συναλλαγές
    μεταξύ της Ισπανίας και της Κοινότητας με τη
    σύνθεσή της στις 31 Δεκεμβρίου 1985 όσον αφορά
    ορισμένα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2609/93 della Commissione, del 23 settembre 1993,
    che stabilisce modalità aggiuntive di applicazione del meccanismo complementare
    agli scambi (MCS) nel settore degli ortofrutticoli fra la Spagna e la Comunità
    nella sua composizione al 31 dicembre 1985 per quanto riguarda taluni prodotti
    ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2609/93 van de Commissie van 23 september 1993 tot
    vaststelling van bijkomende bepalingen voor de toepassing van de aanvullende regeling
    voor het handelsverkeer (ARH) tussen Spanje en de Gemeenschap in haar samenstelling
    op 31 december 1985, ten aanzien van bepaalde produkten van de groenten- en fruitsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2609/93 da Comissão, de 23 de Setembro de 1993,
    que fixa determinadas normas adicionais para a execução do mecanismo complementar
    aplicável às trocas comerciais (MCT) entre Espanha e a Comunidade, na sua composição
    em 31 de Dezembro de 1985, no que diz respeito a determinados frutos e legumes
  type: main
- language: es
