  script: Latn
  content: Commission Regulation (EEC) No 3161/76 of 22 December 1976 amending Regulation
    (EEC) No 1624/76 concerning the advance on payment of aid for skimmed-milk powder
    denatured or processed into compound feedingstuffs in the territory of another
    Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3161/76 de la Commission, du 22 décembre 1976, modifiant
    le règlement (CEE) n° 1624/76 en ce qui concerne l'avance pouvant être payée
    sur l'aide pour le lait écrémé en poudre dénaturé ou transformé en aliments
    composés pour animaux sur le territoire d'un autre État membre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3161/76 der Kommission vom 22. Dezember 1976 zur Änderung
    der Verordnung (EWG) Nr. 1624/76 hinsichtlich des Vorschusses auf die Zahlung
    der Beihilfe für Magermilchpulver, das im Hoheitsgebiet eines anderen Mitgliedstaats
    denaturiert oder zu Mischfutter verarbeitet wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3161/76 af 22. december 1976 om ændring
    af forordning (EØF) nr. 1624/76 for så vidt angår det eventuelle forskud på
    støtten til skummetmælkspulver, der denatureres eller forarbejdes til foderblandinger
    på en anden medlemsstats område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3161/76 της Επιτροπής
    της 22ας Δεκεμβρίου 1976 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 1624/76 όσο αφορά την προκαταβολή
    που δύναται να καταβληθεί έναντι της ενισχύσεως
    για το αποκορυφωμένο γάλα εις κόνιν που μετουσιώνεται
    ή μεταποιείται σε σύνθετες ζωοτροφές στο έδαφος
    άλλου κράτους μέλους
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3161/76, annettu 22 päivänä joulukuuta 1976,
    asetuksen (ETY) N:o 1624/76 muuttamisesta toisen jäsenvaltion alueella denaturoidun
    tai rehuseoksiksi jalostetun rasvattoman maitojauheen tukiennakon maksamisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3161/76 della Commissione, del 22 dicembre 1976, che
    modifica il regolamento (CEE) n. 1624/76 per quanto concerne l'anticipo che può
    essere pagato sull'aiuto per il latte scremato in polvere denaturato o trasformato
    in alimenti composti per animali nel territorio di un altro Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3161/76 van de Commissie van 22 december 1976 tot
