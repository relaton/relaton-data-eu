    betaald op de steun voor magere-melkpoeder dat gedenatureerd of tot mengvoeder
    verwerkt wordt op het grondgebied van een andere Lid-Staat
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3161/76 da Comissão, de 22 de Dezembro de 1976,
