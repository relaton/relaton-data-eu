id: EURegulation17401975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1740/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on other cotton yarn, not put up for retail sale,
    measuring, per single yarn, 120 000 m or more per kg, falling within subheading
    55.05 B I, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3046/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1740/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux autres fils
    de coton, non conditionnés pour la vente au détail, mesurant en fils simples
    120 000 mètres ou plus par kilogramme, de la sous-position tarifaire 55.05 B
    I, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1740/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, mit einer Lauflänge der Einfachfäden von 120 000 m oder mehr
    je kg, der Tarifstelle 55.05 B I, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zoffpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1740/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for i andre tilfælde af garn af bomuld, ikke i
    detailsalgsoplægninger, garn med en længde pr. tråd på 120 000 m og derover
    pr. kg, under underposition 55.05 B I, som har oprindelse i udviklingslande og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1740/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli altri filati di cotone
    non preparati per la vendita al minuto, misuranti per kg, in filati semplici,
    120 000 m o più, della sottovoce doganale 55.05 B I, originari dei paesi in via
    di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1740/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere garens
    van katoen, niet gereed voor de verkoop in het klein, metende per kg, in enkelvoudige
    draad, 120 000 meter of meer, van onderverdeling 55.05 B I, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3046/74 van
    de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
