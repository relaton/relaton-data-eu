title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3627/92 of 15 December 1992 re-establishing
    the levying of customs duties on products of category Nos 65 and 75 (order Nos
    40.0650 and 40.0750), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3627/92 de la Commission, du 15 décembre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 65 et 75 (numéros d' ordre 40.0650 et 40.0750) originaires de
    Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
