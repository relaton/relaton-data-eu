title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 162/72 de la Commission, du 25 janvier 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de fibres textiles synthétiques, non conditionnés pour la vente au
    détail, de la sous-position tarifaires prévues par le règlement (CEE) n° 2799/71
    du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 162/72 der Kommission vom 25. Januar 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Garne aus synthetischen Spinnfasern,
    nicht in Aufmachungen für den Einzelverkauf, der Tarifstelle 56.05 A, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2799/71 des Rates
    vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 162/72 della Commissione, del 25 gennaio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di fibre tessili sintetiche, non preparati per la vendita al minuto, della
    sottovoce doganale n. 56.05 A, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2799/71 del Consiglio,
    del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 162/72 van de Commissie van 25 januari 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van synthetische vezels, niet gereed voor de verkoop
    in het klein, van onderverdeling 56.05 A, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2799/71 van de Raad van 20 december
    1971 tariefpreferenties werden geopend
  type: main
