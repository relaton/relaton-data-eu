- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/2179 of 25 November 2015 initiating
    a review of Council Implementing Regulation (EU) No 102/2012 imposing a definitive
    anti-dumping duty on imports of steel ropes and cables originating, inter alia,
    in the People's Republic of China, as extended to imports of steel ropes and cables
    consigned from the Republic of Korea, whether declared as originating in the Republic
    of Korea or not, for the purposes of determining the possibility of granting an
    exemption from those measures to one Korean exporter, repealing the anti-dumping
    duty with regard to imports from that exporter and making imports from that exporter
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/2179 de la Commission du 25 novembre
    2015 portant ouverture d'un réexamen du règlement d'exécution (UE) n° 102/2012
    du Conseil instituant un droit antidumping définitif sur les importations de
    câbles en acier originaires, entre autres, de la République populaire de Chine,
    tel qu'étendu aux importations de câbles en acier expédiés de la République
    de Corée, qu'ils aient ou non été déclarés originaires de ce pays, afin d'étudier
    la possibilité d'accorder une exemption de ces mesures à un exportateur coréen,
    abrogeant le droit antidumping pour les importations effectuées par cet exportateur
    et soumettant ces importations à enregistrement
  type: main
