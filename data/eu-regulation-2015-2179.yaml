  script: Latn
  content: Regulamento de Execução (UE) 2015/2179 da Comissão, de 25 de novembro
    de 2015, que dá início ao reexame do Regulamento de Execução (UE) n.° 102/2012
    do Conselho que institui um direito anti-dumping definitivo sobre as importações
    de cabos de aço originários, nomeadamente, da República Popular da China, tornado
    extensivo às importações de cabos de aço expedidos da República da Coreia,
