  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/2179 av den 25 november
    2015 om inledande av en översyn av rådets genomförandeförordning (EU) nr 102/2012
    om införande av en slutgiltig antidumpningstull på import av linor och kablar
    av stål med ursprung i bl.a. Folkrepubliken Kina, som utvidgats till att även
    omfatta import av linor och kablar av stål som avsänts från Republiken Korea,
    oavsett om produkternas deklarerade ursprung är Republiken Korea eller inte,
    i syfte att fastställa om det är möjligt att bevilja en koreansk exportör
    befrielse från dessa åtgärder, upphäva antidumpningstullen avseende import
    från den exportören och låta import från den exportören omfattas av registrering
