  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/2179 z dnia 25 listopada 2015
    r. w sprawie wszczęcia przeglądu rozporządzenia wykonawczego Rady (UE) nr 102/2012
    nakładającego ostateczne cło antydumpingowe na przywóz stalowych lin i kabli
    pochodzących między innymi z Chińskiej Republiki Ludowej, rozszerzonego na
