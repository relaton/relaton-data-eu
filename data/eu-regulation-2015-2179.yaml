  content: Reglamento de Ejecución (UE) 2015/2179 de la Comisión, de 25 de noviembre
    de 2015, mediante el cual se inicia una reconsideración del Reglamento de Ejecución
    (UE) n° 102/2012 del Consejo, por el que se establece un derecho antidumping
    definitivo sobre las importaciones de cables de acero originarios, entre otros
    países, de la República Popular China, ampliado a las importaciones de cables
    de acero procedentes de la República de Corea, hayan sido o no declarados originarios
