title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 297/91 of 4 February 1991 amending Regulation
    (EEC) No 715/90 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific (ACP) States or in the overseas countries or territories
    (OCT) to take into account the accession of Namibia to the fourth ACP-EEC Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 297/91 du Conseil du 4 février 1991 modifiant le
    règlement (CEE) n° 715/90 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d'Afrique, des Caraïbes et du Pacifique (ACP) ou des pays
    et territoires d'outre-mer (PTOM) pour tenir compte de l'adhésion de la Namibie
    à la quatrième convention ACP-CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 297/91 des Rates vom 4. Februar 1991 zur Änderung
    der Verordnung (EWG) Nr. 715/90 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den AKP-Staaten oder in den überseeischen Ländern und Gebieten (ÜLG) aufgrund
    des Beitritts Namibias zum Vierten AKP-EWG-Abkommen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 297/91 af 4. februar 1991 om ændring af
    forordning (EØF) nr. 715/90 om den ordning, der skal gælde for landbrugsprodukter
    og visse varer fremstillet af landbrugsprodukter med oprindelse i AVS- staterne
    eller i de oversøiske lande og territorier for at tage hensyn til Namibias tiltrædelse
    af fjerde AVS/EØF-konvention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 297/91 του Συμβουλίου
    της 4ης Φεβρουαρίου 1991 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 715/90 σχετικά με το
    καθεστώς που πρέπει να εφαρμόζεται σε γεωργικά
    προϊόντα και ορισμένα εμπορεύματα που προκύπτουν
    από τη μεταποίηση γεωργικών προϊόντων καταγωγής
    των χωρών της Αφρικής, της Καραϊβικής και του
    Ειρηνικού (ΑΚΕ) ή των υπερποντίων χωρών και
    εδαφών (ΥΧΕ) προκειμένου να ληφθεί υπόψη η προσχώρηση
    της Ναμίμπια, τέταρτη σύμβαση (ΑΚΕ-ΕΟΚ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 297/91 del Consiglio del 4 febbraio 1991 recante modifica
    del regolamento (CEE) n. 715/90 relativo al regime applicabile a taluni prodotti
    agricoli e a talune merci ottenute dalla trasformazione di prodotti agricoli originari
    degli Stati dell'Africa, dei Caraibi e del Pacifico (ACP) o dei paesi e territori
    d'oltremare (PTOM) per tener conto dell'adesione della Namibia alla quarta convenzione
    ACP-CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 297/91 van de Raad van 4 februari 1991 tot wijziging
    van Verordening (EEG) nr. 715/90 inzake de regeling voor landbouwprodukten en
    bepaalde door verwerking van landbouwprodukten verkregen goederen, van oorsprong
    uit de ACS-Staten of uit de landen en gebieden overzee (LGO), in verband met de
    toetreding van Namibië tot de vierde ACS-EEG- Overeenkomst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 297/91 do Conselho de 4 de Fevereiro de 1991 que
    altera o Regulamento (CEE) nº 715/90, relativo ao regime aplicável aos produtos
    agrícolas e a certas mercadorias resultantes da transformação de produtos agrícolas
    originários dos Estados de África, das Caraíbas e do Pacífico (ACP) ou dos
    Países e Territórios Ultramarinos (PTOM) para levar em conta a adesão da Namíbia
    à Quarta Convenção ACP/CEE
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 297/91 del Consejo de 4 de febrero de 1991 por el
    que se modifica el Reglamento (CEE) n° 715/90 relativo al régimen aplicable
    a determinados productos agrícolas y a determinadas mercancías resultantes de
    la transformación de productos agrícolas originarios de los Estados de África,
    el Caribe y el Pacífico (ACP) o de los países y territorios de Ultramar (PTU)
    a fin de tener en cuenta la adhesión de Namibia al cuarto Convenio ACP-CEE
