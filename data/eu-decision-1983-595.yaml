  content: '83/595/EEC: Council Decision of 29 November 1983 enabling the European
    Regional Development Fund to exceed the 70% limit for infrastructure investment
    projects for the period 1981 to 1983'
  type: main
- language: fr
  script: Latn
  content: '83/595/CEE: Décision du Conseil du 29 novembre 1983 autorisant le Fonds
    européen de développement régional à dépasser la limite de 70 % pour les
    aides accordées en faveur de projets d'' investissements en infrastructures pendant
    la période 1981-1983'
  type: main
- language: de
  script: Latn
  content: '83/595/EWG: Beschluß des Rates vom 29. November 1983 zur Ermächtigung
    des Europäischen Fonds für regionale Entwicklung, bei den Beihilfen für Infrastrukturinvestitionsvorhaben
    im Zeitraum 1981 - 1983 über den Höchstsatz von 70 v. H. hinauszugehen'
  type: main
- language: da
  script: Latn
  content: '83/595/EØF: Rådets afgørelse af 29. november 1983 om tilladelse til
    for perioden 1981 til 1983 at overskride det loft på 70 %, der er fastsat for
    Den europæiske fond for Regionaludvikling til infrastrukturprojekter'
  type: main
- language: el
  script: Grek
  content: '83/595/ΕΟΚ: Απόφαση του Συμβουλίου της 29ης
    Νοεμβρίου 1983 που επιτρέπει στο Ευρωπαϊκό Ταμείο
    Περιφερειακής Αναπτύξεως να υπερβεί το όριο
    του 70 για τις ενισχύσεις που χορηγούνται για
    σχέδια επενδύσεων σε έργα υποδομής κατά την
    περίοδο 1981 — 1983'
  type: main
- language: it
  script: Latn
  content: '83/595/CEE: Decisione del Consiglio del 29 novembre 1983 che autorizza
    il Fondo europeo di sviluppo regionale a concedere aiuti a progetti di investimenti
    in infrastrutture in misura superiore al 70 % nel periodo 1981-1983'
  type: main
- language: nl
  script: Latn
  content: '83/595/EEG: Besluit van de Raad van 29 november 1983 houdende opheffing
    van de maximumgrens van 70 % voor de steun uit het Europees Fonds voor Regionale
    Ontwikkeling ten behoeve van infrastructuurprojecten voor de periode 1981-1983'
  type: main
