title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/2197 of 8 November 2022 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Road
    Transport established by the Trade and Cooperation Agreement between the European
    Union and the European Atomic Energy Community, of the one part, and the United
    Kingdom of Great Britain and Northern Ireland, of the other part, as regards the
    technical and procedural specifications of the use of the Internal Market Information
    System (IMI) by the United Kingdom and the amount and modalities of the financial
    contribution to be made by the United Kingdom to the general budget of the Union
    in respect of the cost generated by its use of IMI
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2197 du Conseil du 8 novembre 2022 relative à la position
    à prendre au nom de l’Union européenne au sein du comité spécialisé chargé
    du transport routier institué par l’accord de commerce et de coopération entre
    l’Union européenne et la Communauté européenne de l’énergie atomique,
    d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre
    part, en ce qui concerne les spécifications techniques et procédurales de l’utilisation
    du système d’information du marché intérieur (IMI) par le Royaume-Uni et
    le montant et les modalités de la contribution financière à verser par le Royaume-Uni
    au budget général de l’Union en ce qui concerne les coûts découlant de son
    utilisation de l’IMI
  type: main
