  content: COMMISSION REGULATION (EC) No 1365/96 of 15 July 1996 determining the extent
    to which applications lodged in June 1996 for import licences for certain egg
    sector products pursuant to Regulation (EC) No 1474/95 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1365/96 DE LA COMMISSION du 15 juillet 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juin 1996 pour certains produits du secteur des oeufs dans le cadre du règlement
    (CE) n° 1474/95 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1365/96 DER KOMMISSION vom 15. Juli 1996 über die
