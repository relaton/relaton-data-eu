    für bestimmte Produkte des Sektors Eier entsprechend der Verordnung (EG) Nr.
    1474/95 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1365/96 af 15. juli 1996 om fastsættelse
    af i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    1996 om importlicenser for visse ægprodukter i forbindelse med forordning (EF)
    nr. 1474/95
  type: main
- language: el
  script: Grek
