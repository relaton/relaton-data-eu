    i medicinsk udstyr til in-vitro diagnostik
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία (ΕΕ) 2015/573 της
    Επιτροπής, της 30ής Ιανουαρίου 2015 , για την τροποποίηση,
