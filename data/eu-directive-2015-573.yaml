    in vitro
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2015/573, 30. jaanuar 2015 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, milles käsitletakse plii kasutamist
    in vitro diagnostika meditsiiniseadmete polüvinüülkloriidsensorites
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2015/573, annettu 30 päivänä tammikuuta
    2015 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä in vitro -diagnostiikkaan tarkoitettujen lääkinnällisten laitteiden
    polyvinyylikloridisensoreissa
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2015/573 оd 30. siječnja 2015. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za olovo u senzorima od polivinil-klorida
    u in vitro dijagnostičkim medicinskim proizvodima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/573 felhatalmazáson alapuló irányelve ( 2015.
    január 30. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az in vitro diagnosztikai orvostechnikai eszközök polivinilklorid érzékelőiben
    használt ólom mentesítése tekintetében, a műszaki fejlődéshez történő
    hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2015/573 della Commissione, del 30 gennaio 2015
    , che modifica, adattandolo al progresso tecnico, l'allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda l'esenzione
    relativa al piombo nei sensori in cloruro di polivinile (PVC) utilizzati nei dispositivi
    medico-diagnostici in vitro
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2015/573 ( 2015. gada 30. janvāris
    ), ar ko, pielāgojot zinātnes un tehnikas attīstībai, groza Eiropas Parlamenta
    un Padomes Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svina
    lietošanai polivinilhlorīda sensoros in vitro diagnostikas medicīniskajās
    ierīcēs
  type: main
- language: lt
  script: Latn
  content: 2015 m. sausio 30 d. Komisijos deleguotoji direktyva (ES) 2015/573, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl švino naudojimo in vitro
    diagnostikos medicinos prietaisų polivinilchlorido jutikliuose išimties
  type: main
- language: mt
  script: Latn
  content: Direttiva ta' Delega tal-Kummissjoni (UE) 2015/573 tat- 30 ta' Jannar 2015
    li temenda, għall-finijiet tal-adattament għall-progress tekniku, l-Anness IV
    tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward tal-eżenzjoni
    għaċ-ċomb fis-sensuri tal-klorur tal-polivinil f'apparat mediku dijanjostiku
    in vitro
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2015/573 van de Commissie van 30 januari 2015
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in polyvinylchloride sensoren in medische hulpmiddelen
    voor in-vitrodiagnostiek
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2015/573 z dnia 30 stycznia 2015 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik IV do dyrektywy Parlamentu
    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla ołowiu w czujnikach
    z polichlorku winylu w wyrobach medycznych do diagnostyki in vitro
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2015/573 da Comissão, de 30 de janeiro de 2015
    , que altera, para efeitos de adaptação ao progresso técnico, o anexo IV da
    Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no que diz respeito a
    uma isenção para a utilização de chumbo em sensores de poli(cloreto de vinilo)
    em dispositivos médicos para diagnóstico in vitro
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2015/573 a Comisiei din 30 ianuarie 2015 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din senzorii din clorură de polivinil utilizați în dispozitivele medicale
    pentru diagnostic in vitro
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2015/573 z 30. januára 2015 , ktorou
    sa na účely prispôsobenia technickému pokroku mení príloha IV k smernici
    Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo v
    polyvinylchloridových snímačoch diagnostických zdravotníckych pomôcok in
    vitro
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2015/573 z dne 30. januarja 2015 o spremembi
