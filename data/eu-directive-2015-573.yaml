title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2015/573 of 30 January 2015 amending,
    for the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in polyvinyl chloride sensors in in-vitro diagnostic medical devices
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2015/573 de la Commission du 30 janvier 2015
    modifiant, aux fins de son adaptation au progrès technique, l'annexe IV de la
    directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne une
    exemption relative au plomb dans les capteurs en polychlorure de vinyle utilisés
    dans les dispositifs médicaux de diagnostic in vitro
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2015/573 der Kommission vom 30. Januar 2015
    zur Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Polyvinylchlorid-Sensoren in medizinischen In-vitro-Diagnostika
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2015/573 на Комисията
    от 30 януари 2015 година за изменение, с цел привеждане
    в съответствие с техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета по отношение на освобождаване от
    ограничението за използване на олово в поливинилхлоридни
    сензори в медицински уреди за ин витро диагностика
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2015/573 ze dne 30. ledna
