    pri uporabi svinca v polivinilkloridnih senzorjih v diagnostičnih in vitro medicinskih
    pripomočkih zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2015/573 de la Comisión, de 30 de enero de 2015
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en sensores de cloruro de polivinilo utilizados en productos sanitarios
    de diagnóstico in vitro
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2015/573 av den 30 januari 2015
