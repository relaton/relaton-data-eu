  script: Latn
  content: Commission Regulation (EEC) No 661/89 of 14 March 1989 re-establishing
    the levying of customs duties on nets and netting made of twine, cordage or rope,
    products of category No 97 (order No 40.0970), originating in China to which the
    preferential tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 661/89 de la Commission du 14 mars 1989 portant rétablissement
