    aide de ficelles, cordes ou cordages, de la catégorie de produits nº 97 (nºd'
    ordre 40.0970), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) nº 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 661/89 der Kommission vom 14. März 1989 zur Wiedereinführung
