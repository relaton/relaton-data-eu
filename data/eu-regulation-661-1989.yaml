    Nr. 97 (lfd. Nr. 40.0970) mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
