title:
- language: en
  script: Latn
  content: '70/49/EEC: Commission Decision of 22 December 1969 dispensing the Grand-Duchy
    of Luxembourg from applying council directive of 30 June 1969 concerning the marketing
    of seed of oil and fibre plants to certain types of these seeds (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/49/CEE: Décision de la Commission, du 22 décembre 1969, dispensant
    le Grand Duché de Luxembourg d''appliquer, à certaines espèces, la Directive
    du Conseil, du 30 juin 1969, concernant la commercialisation des semences de plantes
    oléagineuses et à fibres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '70/49/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Entbindung des Großherzogtums Luxemburg von der Verpflichtung, die Richtlinie
    des Rates vom 30. Juni 1969 über den Verkehr mit Saatgut von Öl- und Faserpflanzen
    hinsichtlich einiger Arten anzuwenden (Nur der französische Text ist verbindlich)'
  type: main
- language: el
  script: Grek
  content: '70/49/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1969, με την οποία απαλλάσσεται το Μεγάλο Δουκάτο
    του Λουξεμβούργου από την εφαρμογή, για ορισμένα
    είδη, της οδηγίας του Συμβουλίου της 30ης Ιουνίου
    1969, περί της εμπορίας σπόρων ελαιούχων και
    ινωδών φυτών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '70/49/CEE: Decisione della Commissione, del 22 dicembre 1969, che dispensa
    il Granducato del Lussemburgo dell''applicazione, per certe specie, della direttiva
    del Consiglio del 30 giugno 1969 relativa alla commercializzazione delle sementi
    di piante oleaginose e da fibra (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '70/49/EEG: Besluit van de Commissie van 22 december 1969 tot ontheffing
    van het Groothertogdom Luxemburg van de toepassing ten aanzien van bepaalde gewassen
    van de richtlijn van de Raad van 30 juni 1969 betreffende het in de handel brengen
    van zaaizaad van oliehoudende planten en vezelgewassen (Slechts de tekst in de
    Franse taal is authentiek)'
