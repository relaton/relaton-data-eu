title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 juillet 1971, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves de
    haricots verts, de la position Ex 20.02 du Tarif douanier commun, originaires
    de la République populaire de Chine et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '71/276/EWG: Entscheidung der Kommission vom 12. Juli 1971, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die aus der Volksrepublik China stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen Bohnenkonserven
    der Tarifnummer ex 20.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/276/CEE: Decisione della Commissione, del 12 luglio 1971, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario le
    conserve di fagiolini della voce ex 20.02 della tariffa doganale comune, originarie
    della Repubblica popolare cinese e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/276/EEG: Beschikking van de Commissie van 12 juli 1971 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd conserven van sla-, spek-, pronk- en snijbonen van
    post ex 20.02 van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
