    "orientation", au Royaume de Belgique des dépenses effectuées pendant l''année
    1978 pour les aides en faveur des zones agricoles défavorisées (Les textes en
    langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
