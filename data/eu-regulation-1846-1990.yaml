title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1846/90 of 29 June 1990 amending Annex II
    to Regulation (EEC) No 2752/89 and determining the quantity of potatoes required
    for the manufacture of one tonne of starch and the minimum price payable for that
    quantity
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1846/90 de la Commission du 29 juin 1990 modifiant
    l'annexe II du règlement (CEE) n° 2752/89 et déterminant la quantité de pommes
    de terre nécessaire à la fabrication d'une tonne de fécule et le prix minimal
    à payer pour une telle quantité
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1846/90 DER KOMMISSION vom 29. Juni 1990 zur Aenderung
    von Anhang II der Verordnung (EWG) Nr. 2752/89 und zur Bestimmung der zur Herstellung
    einer Tonne Kartoffelstaerke noetigen Kartoffelmenge und des fuer diese Menge
    zu zahlenden Mindestpreises
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1846/90 af 29. juni 1990 om ændring
    af bilag II til forordning (EØF) nr. 2752/89 og om fastlæggelse af den mængde
    kartofler, der medgår til fremstilling af en ton stivelse, samt den minimumspris,
    der skal betales for denne mængde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αιθ. 1846/90 της Επιτροπής
    της 29ης Ιουνίου 1990 για την τροποποίηση του
    παραρτήματος ΙΙ του κανονισμού (ΕΟΚ) αριθ. 2752/89
    και για τον καθορισμό της ποσότητας πατατών
    που είναι απαραίτητη για την παρασκευή ενός
    τόνου αμύλου, καθώς και της ελάχιστης τιμής
    που πληρώνεται για την εν λόγω ποσότητα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1846/90 DELLA COMMISSIONE del 29 giugno 1990 che modifica
    l'allegato II del regolamento (CEE) n. 2752/89 e determina la quantità di patate
    necessaria per la fabbricazione di una tonnellata di fecola e il prezzo minimo
    da pagare per tale quantità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1846/90 VAN DE COMMISSIE van 29 juni 1990 tot wijziging
    van bijlage II bij Verordening (EEG) nr. 2752/89 en houdende bepaling van de hoeveelheid
    aardappelen die nodig is voor de vervaardiging van een ton zetmeel en van de voor
    die hoeveelheid te betalen minimumprijs
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1846/90 DA COMISSAO de 29 de Junho de 1990 que altera
    o anexo II do Regulamento (CEE) n* 2752/89 e que determina a quantidade de batata
    necessaria ao fabrico de uma tonelada de fécula, bem como o preço minimo a pagar
    por essa quantidade
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1846/90 DE LA COMISION de 29 de junio de 1990 por el
    que se modifica el Anexo II del Reglamento (CEE) no 2752/89 y por el que se determina
    la cantidad de patatas necesarias para la fabricacion de una tonelada de fécula
    y el precio que debe pagarse por tal cantidad
  type: main
