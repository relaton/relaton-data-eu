title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1594/91 of 12 June 1991 derogating from
    the Regulations opening preventive distillation for the 1982/83 to 1988/89 wine
    years as regards the consequences of an overrun in the time limit for payment
    of the minimum price by the distiller
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1594/91 DE LA COMMISSION du 12 juin 1991 dérogeant
    aux règlements relatifs à l'' ouverture des distillations préventives pour
    les campagnes 1982/1983 à 1988/1989 en ce qui concerne les conséquences d''
    un dépassement du délai de paiement du prix minimal par le distillateur #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1594/91 DER KOMMISSION vom 12. Juni 1991 zur Abweichung
    von den Verordnungen zur Eröffnung der vorbeugenden Destillation für die Wirtschaftsjahre
    1982/83 bis 1988/89 hinsichtlich der Folgen einer Überschreitung der der Zahlung
    des Mindestpreises durch die Brennerei gesetzten Frist #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1594/91 af 12. juni 1991 om fravigelse
    fra forordningerne om indledning af forebyggende destillationer for produktionsårene
    1982/83 til 1988/89, for så vidt angår følgerne af destilleriets overskridelse
    af fristen for betaling af minimumsprisen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1594/91 της Επιτροπής
    της 12ης Ιουνίου 1991 περί παρεκκλίσεως από κανονισμούς
    για την έναρξη των προληπτικών αποστάξεων
    για τις αμπελουργικές περιόδους 1982/83 έως 1988/89,
    όσον αφορά τις συνέπειες της υπέρβασης της
    προθεσμίας για την πληρωμή της ελάχιστης τιμής
    από τον οινοπνευματοποιό
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1594/91 DELLA COMMISSIONE del 12 giugno 1991 recante
    deroga ai regolamenti relativi all'' apertura delle distillazioni preventive per
    le campagne 1982/1983-1988/1989 in ordine alle conseguenze del superamento del
    termine di versamento del prezzo minimo da parte del distillatore #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1594/91 VAN DE COMMISSIE van 12 juni 1991 houdende
    afwijking van de verordeningen tot opening van een preventieve distillatie voor
    de wijnoogstjaren 1982/1983 tot en met 1988/1989 ten aanzien van de gevolgen van
    een overschrijding van de termijn voor de betaling van de minimumprijs door de
    distilleerder #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1594/91 DA COMISSAO, DE 12 DE JUNHO DE 1991, QUE
    DERROGA OS REGULAMENTOS DE ABERTURA DAS DESTILACOES PREVENTIVAS PARA AS CAMPANHAS
    DE 1982/1983 A 1988/1989 NO QUE RESPEITA AS CONSEQUENCIAS DA ULTRAPASSAGEM DO
    PRAZO DE PAGAMENTO DO PRECO MINIMO PELO DESTILADOR
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1594/91 DE LA COMISIÓN de 12 de junio de 1991 por
    el que se establece una excepción a los Reglamentos de apertura de las destilaciones
    preventivas para las campañas de 1982/83 a 1988/89, respecto a las consecuencias
    del incumplimiento del plazo de pago del precio mínimo por parte del destilador
    #'
