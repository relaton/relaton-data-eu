  content: '82/315/EEC: Commission Decision of 5 May 1982 establishing that the apparatus
    described as ''TRACOR - digital signal analyzer, model TN-1500-8A, with accessories'',
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/315/CEE: Décision de la Commission, du 5 mai 1982, constatant que
    l''importation de l''appareil dénommé "Tracor - digital signal analyzer, model
    TN-1500-8A, with accessories" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
