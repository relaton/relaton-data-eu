title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1167/92 of 5 May 1992 re- establishing the
    levying of customs duties on products of category 39 (order No 40.0390), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1167/92 de la Commission du 5 mai 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    39 (numéro d'ordre 40.0390) originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1167/92 DER KOMMISSION vom 5. Mai 1992 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie 39 (laufende Nr.
    40.0390) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1167/92 af 5. maj 1992 om genindførelse
    af opkrævning af told for varer under kategori 39 (løbenummer 40.0390), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1167/92 της Επιτροπής
    της 5ης Μαΐου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    39 (αύξων αριθ. 40.0390), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1167/92 DELLA COMMISSIONE del 5 maggio 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 39
    (numero d'' ordine 40.0390) originari del Pakistan, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1167/92 VAN DE COMMISSIE van 5 mei 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 39 (volgnummer 40.0390), van oorsprong uit Pakistan, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1167/92 DA COMISSÃO de 5 de Maio de 1992 que restabelece
