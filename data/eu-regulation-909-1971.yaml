title:
- language: en
  script: Latn
  content: Regulation (EEC) No 909/71 of the Commission of 30 April 1971 establishing
    that applications for premiums for withholding milk and milk products from the
    market may be allowed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 909/71 de la Commission, du 30 avril 1971, fixant
    à la constatation qu'il peut être donné suite aux demandes déposées en vue
    de l'obtention des primes à la non-commercialisation du lait et des produits
    laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 909/71 der Kommission vom 30. April 1971 zur Feststellung,
    daß den zur Erlangung der Prämien für die Nichtvermarktung von Milch und Milcherzeugnissen
    eingereichten Anträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 909/71 af 30. april 1971 om konstatering
    af, at ansøgninger indgivet med henblik på opnåelse af præmier for at undlade
    at bringe mælk og mejeriprodukter i handelen kan tages til følge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 909/71 della Commissione, del 30 aprile 1971, che
    constata la possibilità di dar seguito alle domande presentate per ottenere i
    premi alla non commercializzazione del latte e dei prodotti lattiero- caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 909/71 van de Commissie van 30 april 1971 met betrekking
    tot de constatering, dat gevolg gegeven kan worden aan de verzoeken die ter verkrijging
    van premies voor het niet in de handel brengen van melk en zuivelprodukten werden
    ingediend
  type: main
