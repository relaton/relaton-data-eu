  content: COMMISSION REGULATION (EC) No 3033/93 of 3 November 1993 re-establishing
    the levying of customs duties on products falling within CN code 2917 20 10, originating
    in Romania, to which the tariff ceilings set out in Council Regulation (EEC) No
    1014/93 apply
  type: main
- language: fr
  script: Latn
