title:
- language: en
  script: Latn
  content: Commission Decision of 21 March 1977 authorizing the French Republic to
    apply protective measures in trade within the Community in wines falling within
    CCT subheading 22.05 C, coming from Greece
  type: main
- language: fr
  script: Latn
  content: '77/259/CEE: Décision de la Commission, du 21 mars 1977, autorisant la
    République française à appliquer des mesures de protection concernant les échanges
    intracommunautaires de vins, de la sous-position 22.05 C du Tarif douanier commun,
    provenant de Grèce'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. März 1977, mit der die Französische
    Republik ermächtigt wird, Schutzmaßnahmen betreffend den innergemeinschaftlichen
    Handel von Weinen der Tarifstelle 22.05 C des Gemeinsamen Zolltarifs mit Herkunft
    aus Griechenland anzuwenden
  type: main
- language: da
