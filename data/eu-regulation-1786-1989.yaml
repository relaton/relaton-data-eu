id: EURegulation17861989
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1786/89 of 19 June 1989 terminating the proceeding
    in connection with a review of anti-dumping measures concerning imports of fibre
    building board (hardboard) originating in Czechoslovakia, Poland and the USSR,
    confirming the expiry of the definitive anti-dumping duties imposed on imports
    from Czechoslovakia and Poland, and repealing the definitive anti-dumping duty
    imposed on imports from the USSR
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1786/89 du Conseil du 19 juin 1989 clôturant la procédure
    de réexamen des mesures antidumping concernant les importations de panneaux de
    fibres (panneaux durs) originaires de Pologne, de Tchécoslovaquie ou d'Union
    soviétique, confirmant l'expiration des droits antidumping définitifs institués
    à l'égard des importations de Pologne et de Tchécoslovaquie et abrogeant les
    droits antidumping définitifs appliqués aux importations d'Union soviétique
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1786/89 DES RATES vom 19. Juni 1989 zur Einstellung
    des Verfahrens im Anschluß an eine Überprüfung der Antidumpingmaßnahmen betreffend
    die Einfuhren von Hartplatten mit Ursprung in der Tschechoslowakei, Polen und
    der UdSSR, zur Bestätigung des Außerkrafttretens der endgültigen Antidumpingzölle
    auf die Einfuhren aus der Tschechoslowakei und Polen und zur Aufhebung des endgültigen
    Antidumpingzolls auf die Einfuhren aus der UdSSR #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1786/89 af 19. juni 1989 om afslutning af
    proceduren i forbindelse med en fornyet undersøgelse af antidumpingforanstaltningerne
    vedrørende importen af fiberplader (hårde plader) med oprindelse i Polen, Sovjetunionen
    og Tjekkoslovakiet, om bekræftelse af bortfaldet af den endelige antidumpingtold
    på importen fra Polen og Tjekkoslovakiet og om ophævelse af den endelige antidumpingtold
    på importen fra Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1786/89 του Συμβουλίου
    της 19ης Ιουνίου 1989 για την περάτωση της διαδικασίας
    όσον αφορά την επανεξέταση των μέτρων αντιντάμπινγκ
    σχετικά με τις εισαγωγές οικοδομικών πλακών
    - διαφραγμάτων από ίνες καταγωγής Τσεχοσλοβακίας,
    Πολωνίας και Σοβιετικής Ένωσης, για την επιβεβαίωση
    της λήξης ισχύος των οριστικών δασμών αντιντάμπινγκ
    που επιβάλλονται στις εισαγωγές από την Τσεχοσλοβακία
    και την Πολωνία και για την κατάργηση του οριστικού
    δασμού αντιντάμπινγκ που επιβάλλεται στις
    εισαγωγές από τη Σοβιετική Ένωση
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1786/89 DEL CONSIGLIO del 19 giugno 1989 che chiude
    la procedura di riesame di misure antidumping relative alle importazioni di pannelli
    di fibre (pannelli duri) originari della Cecoslovacchia, della Polonia e dell''
    URSS, che conferma la scadenza dei dazi antidumping definitivi istituiti sulle
    importazioni dalla Cecoslovacchia e dalla Polonia e che abroga il dazio antidumping
    definitivo istituito sulle importazioni dall'' URSS #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1786/89 VAN DE RAAD van 19 juni 1989 houdende beëindiging
    van de procedure in verband met een nieuw onderzoek van anti-dumpingmaatregelen
    betreffende de invoer van vezelplaat van houtvezels (hardboard) van oorsprong
    uit Tsjechoslowakije, Polen en de USSR, bevestiging van het vervallen van de definitieve
    anti-dumpingrechten die waren ingesteld op de invoer uit Tsjechoslowakije en Polen,
    en intrekking van het definitieve anti-dumpingrecht dat op de invoer uit de USSR
    was ingesteld #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1786/89 DO CONSELHO de 19 de Junho de 1989 que encerra
    o processo relativo a um reexame das medidas anti-dumping relativo às importações
    de painéis duros de fibras de madeira (painéis duros) originárias da Checoslováquia,
    da Polónia e da União das Repúblicas Socialistas Soviéticas, que confirma
    a caducidade dos direitos anti-dumping definitivos instituídos sobre as importações
    originárias da Checoslováquia e da Polónia e que revoga o direito anti-dumping
    definitivo instituído sobre as importações da União das Repúblicas Socialistas
    Soviéticas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1786/89 DEL CONSEJO de 19 de junio de 1989 por el
    que se concluye el procedimiento sobre una reconsideración de las medidas antidumping
    relativas a las importaciones de tableros de fibra (tableros duros) originarios
    de Checoslovaquia, Polonia y la Unión Soviética, por el que se confirma la expiración
    de los derechos antidumping definitivos impuestos a las importaciones procedentes
    de Checoslovaquia y Polonia, y por el que se anula el derecho antidumping definitivo
    que grava las importaciones procedentes de la Unión Soviética #'
  type: main
