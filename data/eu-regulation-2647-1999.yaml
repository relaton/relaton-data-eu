title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2647/1999 of 15 December 1999 authorising
    the conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1999/2000 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2647/1999 de la Commission, du 15 décembre 1999, ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1999/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2647/1999 der Kommission vom 15. Dezember 1999 zur
    Eröffnung der Möglichkeit des Abschlusses von Verträgen für die langfristige
    private Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und
    konzentriertem rektifizierten Traubenmost für das Wirtschaftsjahr 1999/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2647/1999 af 15. december 1999 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1999/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2647/1999 της Επιτροπής,
    της 15ης Δεκεμβρίου 1999, για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιου οίνου, γλεύκους
    σταφυλών, συμπυκνωμένου γλεύκους σταφυλών
    και διορθωμένου συμπυκνωμένου γλεύκους σταφυλών
    για την περίοδο 1999/2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2647/1999, annettu 15 päivänä joulukuuta 1999,
    mahdollisuudesta tehdä yksityistä varastointia koskevia pitkän aikavälin sopimuksia
    viinivuodelle 1999/2000 pöytäviinin, rypälemehun, tiivistetyn rypälemehun
    ja puhdistetun tiivistetyn rypälemehun osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2647/1999 della Commissione, del 15 dicembre 1999,
    che concede, per la campagna 1999/2000, la possibilità di concludere contratti
    di magazzinaggio privato a lungo termine per il vino da tavola, il mosto di uve
    concentrato e il mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2647/1999 van de Commissie van 15 december 1999 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van tafelwijn, druivenmost, geconcentreerde druivenmost
    en gerectificeerde geconcentreerde druivenmost voor het wijnoogstjaar 1999/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2647/1999 da Comissão, de 15 de Dezembro de 1999,
    que permite concluir contratos de armazenamento privado a longo prazo para o vinho
    de mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1999/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2647/1999 de la Comisión, de 15 de diciembre de 1999,
    por el que se establece la posibilidad de celebrar contratos de almacenamiento
    privado a largo plazo para el vino de mesa, el mosto de uva, el mosto de uva concentrado
    y el mosto de uva concentrado rectificado para la campaña 1999/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2647/1999 av den 15 december 1999 om
    slutande av långfristiga privata lagringskontrakt för bordsvin, druvmust, koncentrerad
    druvmust och renad koncentrerad druvmust för produktionsåret 1999/2000
