title:
- language: en
  script: Latn
  content: '2000/266/EC: Council Decision of 30 March 2000 authorising the Kingdom
    of the Netherlands to apply a reduced rate of excise duty to certain mineral oils,
    when used for specific purposes, in accordance with the procedure provided for
    in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '2000/266/CE: Décision du Conseil, du 30 mars 2000, autorisant le Royaume
    des Pays-Bas à appliquer un taux réduit de droit d''accise à certaines huiles
    minérales utilisées à des fins spécifiques, conformément à la procédure
    prévue à l''article 8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2000/266/EG: Entscheidung des Rates vom 30. März 2000 zur Ermächtigung
    des Königreichs der Niederlande, für bestimmte Mineralöle mit besonderen Verwendungszwecken
    nach dem Verfahren des Artikels 8 Absatz 4 der Richtlinie 92/81/EWG einen ermäßigten
    Verbrauchsteuersatz anzuwenden'
  type: main
- language: da
  script: Latn
  content: '2000/266/EF: Rådets beslutning af 30. marts 2000 om bemyndigelse af Kongeriget
    Nederlandene til i overensstemmelse med proceduren i artikel 8, stk. 4, i direktiv
    92/81/EØF at anvende en reduceret punktafgiftssats på visse mineralolier, når
    de benyttes til specifikke formål'
  type: main
- language: el
  script: Grek
  content: '2000/266/ΕΚ: Απόφαση του Συμβουλίου, της 30ής
    Μαρτίου 2000, που εξουσιοδοτεί το Βασίλειο των
    Κάτω Χωρών να εφαρμόσει μειωμένο συντελεστή
    ειδικού φόρου κατανάλωσης σε ορισμένα πετρελαιοειδή,
    χρησιμοποιούμενα για ειδικούς σκοπούς, με
    τη διαδικασία του άρθρου 8 παράγραφος 4 της
    οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2000/266/EY: Neuvoston päätös, tehty 30 päivänä maaliskuuta 2000,
    luvan antamisesta direktiivin 92/81/ETY 8 artiklan 4 kohdassa tarkoitetun menettelyn
    mukaisesti Alankomaiden kuningaskunnalle soveltaa alennettua valmisteverokantaa
    tiettyihin erityistarkoituksiin käytettäviin kivennäisöljyihin'
  type: main
- language: it
  script: Latn
  content: '2000/266/CE: Decisione del Consiglio, del 30 marzo 2000, che autorizza
    il Regno dei Paesi Bassi ad applicare ad alcuni oli minerali utilizzati a fini
    specifici riduzioni d''accisa, conformemente alla procedura di cui all''articolo
    8, paragrafo 4 della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2000/266/EG: Beschikking van de Raad van 30 maart 2000 waarbij Nederland
    wordt gemachtigd, in overeenstemming met de procedure van artikel 8, lid 4, van
    Richtlijn 92/81/EEG, verlaagde accijnstarieven toe te passen op bepaalde minerale
    oliën die gebruikt worden voor bijzondere doeleinden'
  type: main
- language: pt
  script: Latn
  content: '2000/266/CE: Decisão do Conselho, de 30 de Março de 2000, que autoriza
    os Países Baixos a aplicar uma taxa reduzida de imposto especial sobre o consumo
    de certos óleos minerais utilizados para fins específicos, nos termos do n.o
    4 do artigo 8.o da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '2000/266/CE: Decisión del Consejo, de 30 de marzo de 2000, por la que
    se autoriza al Reino de los Países Bajos a aplicar un tipo impositivo reducido
    en los impuestos especiales para determinados hidrocarburos que se utilizan para
    usos específicos, de conformidad con el procedimiento previsto en el apartado
    4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '2000/266/EG: Rådets beslut av den 30 mars 2000 om tillåtelse för Nederländerna
    att i enlighet med det förfarande som föreskrivs i artikel 8.4 i direktiv 92/81/EEG
    på vissa mineraloljor, när dessa används för särskilda ändamål, tillämpa
    en nedsatt punktskattesats'
