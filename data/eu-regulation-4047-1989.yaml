title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 4047/89 of 19 December 1989 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1990 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4047/89 du Conseil du 19 décembre 1989 fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1990 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EGW) Nr. 4047/89 DES RATES vom 19. Dezember 1989 über die
    zulässige Gesamtfangmenge und über Fangbedingungen für bestimmte Fischbestän-de
    oder Bestandsgruppen (1990) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4047/89 af 19. december 1989 om fastsættelse
    for 1990 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4047/89 του Συμβουλίου
    της 19ης Δεκεμβρίου 1989 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    για το 1990 καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 4047/89 DEL CONSIGLIO del 19 dicembre 1989 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche, il totale delle catture
    permesse per il 1990 e alcune condizioni cui è soggetta la pesca del totale delle
    catture permesse #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 4047/89 VAN DE RAAD van 19 december 1989 inzake
    de vaststelling van de voor 1990 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden en bepaalde, bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) N 4047/89 DO CONSELHO de 19 de Dezembro de 1989 que
    fixa, relativamente a certas unidades populacionais (stocks) ou grupos de unidades
    populacionais de peixes, os totais admissíveis de capturas para 1990 e certas
    condições em que podem ser pescados #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 4047/89 DEL CONSEJO de 19 de diciembre de 1989 por
    el que se fijan, para determinadas poblaciones o grupos de poblaciones de peces,
    los totales admisibles de capturas para 1990 y determinadas condiciones en las
    que pueden pescarse #'
  type: main
