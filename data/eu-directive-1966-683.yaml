---
id: EUDirective1966683
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 66/683/EEC of 7 November 1966 eliminating all differences
    between the treatment of national products and that of products which, under Articles
    9 and 10 of the Treaty, must be admitted for free movement, as regards laws, regulations
    or administrative provisions prohibiting the use of the said products and prescribing
    the use of national products or making such use subject to profitability /* unofficial
    English translation */
  type: main
- language: fr
  script: Latn
  content: Directive 66/683/CEE de la Commission, du 7 novembre 1966, portant élimination
    de toute différence de traitement entre les produits nationaux et les produits
    qui, en vertu des articles 9 et 10 du traité, doivent être admis à la libre
    circulation, en ce qui concerne les dispositions législatives, réglementaires
    et administratives qui interdisent l'utilisation desdits produits importés et
    qui imposent l'utilisation de produits nationaux ou qui subordonnent un bénéfice
    à cette utilisation
  type: main
- language: de
  script: Latn
  content: Richtlinie 66/683/EWG der Kommission vom 7. November 1966 für die Beseitigung
    jeder unterschiedlichen Behandlung zwischen inländischen Waren und den gemäß
    Artikel 9 und 10 des Vertrages zum freien Verkehr zuzulassenden Waren auf Grund
    von Rechts- und Verwaltungsvorschriften, die die Verwendung der genannten eingeführten
    Waren untersagen und die Verwendung inländischer Waren vorschreiben oder eine
    Vergünstigung von einer solchen Verwendung abhängig machen
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 66/683/EØF af 7. november 1966 vedrørende fjernelse
    af nationale produkter og produkter, som i medfør af traktatens artikel 9 og
    10 skal have adgang til fri bevægelighed, for så vidt angår love, forskrifter
    og administrative bestemmelser, der forbyder anvendelse af sådanne importerede
    produkter, og som påbyder anvendelse af nationale produkter, eller som gør anvendelse
    af nationale produkter afhængig af fordele - uofficiel oversættelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 66/683/ΕΟΚ της Επιτροπής της 7ης Νοεμβρίου
    1966, περί καταργήσεως όλων των διαφορών μεταξύ
    των εθνικών προϊόντων και των προϊόντων τα
    οποία, με βάση τα άρθρα 9 και 10 της συνθήκης,
    πρέπει να γίνουν δεκτά στα πλαίσια της ελεύθερης
    κυκλοφορίας, όσον αφορά τις νομοθετικές κανονιστικές
    και διοικητικές διατάξεις που απαγορεύουν
    τη χρήση των ανωτέρω αναφερόμενων εισαγόμενων
    προϊόντων και οι οποίες επιβάλλουν τη χρήση
    εθνικών προϊόντων ή που συνδέουν κάποιο κέρδος
    με τη χρήση αυτή
  type: main
- language: it
  script: Latn
  content: Direttiva 66/683/CEE della Commissione, del 7 novembre 1966, relativa alla
    soppressione di qualsiasi disparità di trattamento tra prodotti nazionali e prodotti
    che, ai sensi degli articoli 9 e 10 del Trattato, devono essere ammessi in libera
    circolazione, disparità derivanti da disposizioni legislative, regolamentari
    ed amministrative che vietano l'utilizzazione di tali prodotti importati e impongono
    l'utilizzazione di prodotti nazionali, ovvero subordinando la concessione di un'agevolazione
    a tale utilizzazione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 66/683/EEG van de Commissie van 7 november 1966 houdende opheffing
    van alle verschillen in behandeling tussen binnenlandse produkten en produkten
    die krachtens de artikelen 9 en 10 van het Verdrag in het vrije verkeer moeten
    worden toegelaten, ten aanzien van de wettelijke en bestuursrechtelijke bepalingen
    die het gebruik van bedoelde ingevoerde produkten verbieden en het gebruik van
    produkten uit het eigen land voorschrijven, dan wel van het gebruik van produkten
    uit het eigen land de toekenning van voordelen afhankelijk stellen
  type: main
