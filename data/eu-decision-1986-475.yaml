  content: '86/475/EEC: Commission Decision of 12 September 1986 determining the amount
    of VAT own resources payable by the Federal Republic of Germany for 1984 in respect
    of transactions covered by the 20th Council Directive 85/361/EEC of 16 July 1985
    on the harmonization of the laws of the Member States relating to turnover taxes
    - Common system of value added tax: derogations in connection with the special
    aids granted to certain farmers to compensate for the dismantlement of monetary
    compensatory amounts applying to certain agricultural products'
  type: main
- language: fr
  script: Latn
  content: '86/475/CEE: Décision de la Commission du 12 septembre 1986 fixant le
