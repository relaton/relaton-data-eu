  content: Council Decision (EU) 2015/2108 of 16 November 2015 establishing the position
    to be taken on behalf of the European Union within the Council for Trade in Services
    of the World Trade Organisation to notify the preferential treatment the Union
    intends to grant to services and service suppliers of least developed country
    Members, and to seek approval for preferential treatment going beyond market access
  type: main
- language: fr
  script: Latn
