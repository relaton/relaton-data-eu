    position à prendre au nom de l'Union européenne au sein du Conseil du commerce
    des services de l'Organisation mondiale du commerce en vue de notifier le traitement
    préférentiel que l'Union envisage d'accorder aux services et fournisseurs de
    services des pays les moins avancés membres et de demander l'approbation d'un
    traitement préférentiel allant au-delà de l'accès aux marchés
