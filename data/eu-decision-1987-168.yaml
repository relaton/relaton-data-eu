  content: '87/168/EEC: Commission Decision of 23 February 1987 amending Decision
    86/473/EEC as regards the list of establishments in Uruguay approved for the purpose
    of importing meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '87/168/CEE: Décision de la Commission du 23 février 1987 modifiant la
    décision 86/473/CEE en ce qui concerne la liste des établissements d'' Uruguay
    agréés pour l'' importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: '87/168/EWG: Entscheidung der Kommission vom 23. Februar 1987 zur Änderung
