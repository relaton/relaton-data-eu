    n’approuvant pas la cyanamide en tant que substance active existante destinée
    à être utilisée dans les produits biocides relevant des types de produits 3
    et 18 conformément au règlement (UE) no 528/2012 du Parlement européen et du
    Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1097 der Kommission vom 5. Juni 2023
    zur Nichtgenehmigung von Cyanamid als alten Wirkstoff zur Verwendung in Biozidprodukten
    der Produktarten 3 und 18 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen
    Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
