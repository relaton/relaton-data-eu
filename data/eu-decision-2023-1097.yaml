title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1097 of 5 June 2023 not approving
    cyanamide as an existing active substance for use in biocidal products of product-types
    3 and 18 in accordance with Regulation (EU) No 528/2012 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
