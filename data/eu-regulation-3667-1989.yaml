  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3667/89 DA COMISSAO de 7 de Dezembro de 1989 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis aos cortinados estores de interior,
    sanefas, guarniçao de camas e artefactos para guarniçao de interiores, com excepçao
    dos de malha, de la, de algodao ou de fibras sintéticas ou artificiais, da categoria
    de produtos 40 (numero de ordem 40.0400), e luvas, com excepçao das de malha,
    da categoria de produtos 87 (numero de ordem 40.0870), originarios do Paquistao,
    beneficiario das preferências pautais previstas no Regulamento (CEE) n* 4259/88
    do Conselho
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3667/89 DE LA COMISIÓN de 7 de diciembre de 1989
    relativo al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los cortinas, visillos, guardamalletas, cubrecamas y artículos de moblaje,
    de tejido, de lana, de algodón o de fibras textiles sintéticas o artificiales
    de la categoría de productos no 40 (número de orden 40.0400) y guantes, que
    no sean de punto de la categoría de productos no 87 (número de orden 40.0870)
    originarios de Pakistán, beneficiario de las preferencias arancelarias previstas
    por el Reglamento (CEE) no 4259/88 del Consejo #'
