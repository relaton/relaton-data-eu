title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3667/89 of 7 December 1989 re-establishing
    the levying of customs duties on woven curtains (including drapes), interior blinds,
    curtain and bed valances and other furnishing articles, other than knitted or
    crocheted, of wool, of cotton or of man-made fibres, products of category 40 (order
    No 40.0400), and gloves, mittens and mitts, not knitted or crocheted, products
    of category 87 (order No 40.0870), originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3667/89 de la Commission du 7 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux rideaux,
    stores d'intérieur, cantonnières, tours de lits et autres articles d'ameublement,
    autres qu'en bonneterie, de laine, de coton ou de fibres synthétiques ou artificielles
    de la catégorie de produits n° 40 (numéro d'ordre 40.0400) et à la ganterie,
    autre qu'en bonneterie de la catégorie de produits n° 87 (numéro d'ordre 40.0870),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3667/89 DER KOMMISSION vom 7. Dezember 1989 zur Wiedereinführung
    des Zollsatzes für Gardinen, Vorhänge und Innenrollos; Schabracken und Bettvorhänge
    und andere Waren zur Innenausstattung, andere als aus Gewirken aus Wolle, aus
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Warenkategorie
    Nr. 40 (lfd. Nr. 40.0400) und Handschuhe, andere als aus Gewirken, der Warenkategorie
    Nr. 87 (lfd. Nr. 40.0870) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3667/89 af 7. december 1989 om genindførelse
    af opkrævning af toldafgifter for gardiner, forhæng, undergardiner, kapper,
    sengeforhæng o. lign., ikke af trikotage, af uld, bomuld eller syntetiske eller
    regenererede fibre, under varekategori 40 (løbenummer 40.0400) og handsker, vanter
    og luffer, ikke af trikotage under varekategori 87 (løbenummer 40.0870), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
