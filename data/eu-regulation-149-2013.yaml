    elszámolási megállapodásokról, az elszámolási kötelezettségről, a nyilvános
    jegyzékről, a kereskedési helyszínhez való hozzáférésről, a nem pénzügyi
    szerződő felekről és a nem központi szerződő fél által elszámolt tőzsdén
