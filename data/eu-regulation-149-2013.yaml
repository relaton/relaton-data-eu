    tīrvērtes pienākumu, publisko reģistru, pieeju tirdzniecības vietai, nefinanšu
    darījuma partneriem un riska ierobežošanas paņēmieniem ārpusbiržas atvasināto
    instrumentu līgumiem, kuriem tīrvērti neveic centrālais darījuma partneris
  type: main
