    acordos de compensação indireta, a obrigação de compensação, o registo público,
    o acesso a um espaço ou organização de negociação, as contrapartes não-financeiras
    e as técnicas de atenuação dos riscos para os contratos de derivados OTC não
    compensados através de uma CCP
  type: main
