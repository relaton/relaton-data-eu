  content: Commission Delegated Regulation (EU) No 149/2013 of 19 December 2012 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council with
    regard to regulatory technical standards on indirect clearing arrangements, the
    clearing obligation, the public register, access to a trading venue, non-financial
    counterparties, and risk mitigation techniques for OTC derivatives contracts not
    cleared by a CCP
  type: main
- language: fr
  script: Latn
