  script: Latn
  content: Regolamento delegato (UE) n. 149/2013 della Commissione, del 19 dicembre
    2012 , che integra il regolamento (UE) n. 648/2012 del Parlamento europeo e del
    Consiglio per quanto riguarda le norme tecniche di regolamentazione su accordi
    di compensazione indiretti, obbligo di compensazione, registro pubblico, accesso
    alla sede di negoziazione, controparti non finanziarie, tecniche di attenuazione
    dei rischi per i contratti derivati OTC non compensati mediante controparte centrale
  type: main
