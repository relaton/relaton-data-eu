    w odniesieniu do regulacyjnych standardów technicznych dotyczących pośrednich
    uzgodnień rozliczeniowych, obowiązku rozliczania, rejestru publicznego, dostępu
    do systemu obrotu, kontrahentów niefinansowych, technik ograniczania ryzyka związanego
