    al Consiliului în ceea ce privește standardele tehnice de reglementare referitoare
    la dispozițiile în materie de compensare indirectă, obligația de compensare,
    registrul public, accesul la un loc de tranzacționare, contrapărțile nefinanciare
    și tehnicile de atenuare a riscurilor pentru contractele derivate extrabursiere
    care nu sunt compensate prin CPC
  type: main
