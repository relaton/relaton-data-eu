    2012 complétant le règlement (UE) n ° 648/2012 du Parlement européen et du
    Conseil par des normes techniques de réglementation concernant les accords de
    compensation indirecte, l’obligation de compensation, le registre public, l’accès
    à une plate-forme de négociation, les contreparties non financières et les
    techniques d’atténuation des risques pour les contrats dérivés de gré à
    gré non compensés par une contrepartie centrale
  type: main
