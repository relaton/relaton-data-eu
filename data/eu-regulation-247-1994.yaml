  content: Commission Regulation (EC) No 247/94 of 2 February 1994 ending the charges
    against the tariff ceilings opened for 1993 in the framework of generalized tariff
    preferences, by Council Regulation (EEC) No 3832/90 in respect of certain textile
    products originating in Bulgaria, India, China and Mexico
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 247/94 de la Commission du 2 février 1994 portant
