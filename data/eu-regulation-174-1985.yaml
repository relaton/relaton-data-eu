    janvier 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 174/85 der Kommission vom 23. Januar 1985 zur Festsetzung
    der Beträge, welche im Sektor Rindfleisch auf Erzeugnisse, die das Vereinigte
    Königreich in der Woche vom 31. Dezember 1984 bis 6. Januar 1985 verlassen haben,
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 174/85 af 23. januar 1985 om fastsættelse
