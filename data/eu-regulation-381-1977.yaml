title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 381/77 of 24 February 1977 re-establishing
    the levying of the customs duties on glass inners for vacuum flasks or for other
    vacuum vessels, falling within heading No 70.12, originating in Yugoslavia to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 381/77 de la Commission, du 24 février 1977, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position tarifaire 70.12, originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 381/77 der Kommission vom 24. Februar 1977 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12, mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 381/77 af 24. februar 1977 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere under position 70.12, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 381/77 della Commissione, del 24 febbraio 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti della voce doganale 70.12, originarie della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 381/77 van de Commissie van 24 februari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op binnenflessen
    voor thermisch isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen
    van post 70.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad algemene tariefprefenties werden geopend
  type: main
