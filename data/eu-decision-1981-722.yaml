  script: Latn
  content: '81/722/EEC: Commission Decision of 21 August 1981 establishing that the
    apparatus described as ''Akashi- scanning electron microscope, model ISI 100 A''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/722/CEE: Décision de la Commission, du 21 août 1981, constatant que
    l''importation de l''appareil dénommé "Akashi - scanning electron microscope,
    model ISI 100 A" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '81/722/EWG: Entscheidung der Kommission vom 21. August 1981, mit der festgestellt
    wird, daß das Gerät ,,Akashi- Scanning Electron Microscope, model ISI 100 A"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/722/EØF: Kommissionens beslutning af 21. august 1981 om fastslåelse
    af, at indførsel af apparatet "Akashi- Scanning Eletron Microscope, model ISI
    100 A" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
