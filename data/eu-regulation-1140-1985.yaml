title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1140/85 of 2 May 1985 re-establishing the
    levying of customs duties on certain ball bearings, falling within heading No
    ex 84.62 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1140/85 de la Commission du 2 mai 1985 portant rétablissement
    de la perception des droits de douane applicables à certains roulements à billes,
    de la position ex 84.62 du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1140/85 der Kommission vom 2. Mai 1985 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Kugellager der Tarifnummer ex 84.62 mit
    Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1140/85 af 2. maj 1985 om geindførelse
    af opkrævning af told for bestemte kuglelejer henhørende under pos. ex 84.62
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1140/85 της Επιτροπής
    της 2ας Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των δασμών για ορισμένους ένσφαιρους τριβείς
    (ρουλεμάν με μπίλιες), της κλάσεως ex 84.62 του
    Κοινού Δασμολογίου, καταγωγής Σιγκαπούρης,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1140/85 della Commissione del 2 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni cuscinetti a sfere, della
    voce ex 84.62 della tariffa doganale comune, originari di Singapore beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1140/85 van de Commissie van 2 mei 1985 houdende
