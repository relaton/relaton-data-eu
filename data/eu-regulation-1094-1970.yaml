title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1094/70 of the Council of 8 June 1970 adopting general
    rules for the application of Articles 11 and 12 (1) of Regulation (EEC) No 1975/69
    introducing a system of premiums for slaughtering cows and for withholding milk
    and milk products from the market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1094/70 du Conseil, du 8 juin 1970, arrêtant les
    règles générales d' application de l' article 11 et de l' article 12 paragraphe
    1 du règlement (CEE) n° 1975/69 instituant un régime de primes à l' abattage
    des vaches et de primes à la non-commercialisation du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1094/70 des Rates vom 8. Juni 1970 zur Festlegung
    allgemeiner Durchführungsvorschriften zu Artikel 11 und Artikel 12 Absatz 1 der
    Verordnung (EWG) Nr. 1975/69 zur Einführung einer Prämienregelung für die Schlachtung
    von Kühen und die Nichtvermarktung von Milch und Milcherzeugnissen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1094/70 af 8. juni 1970 om fastsættelse
    af de almindelige regler om anvendelsen af artikel 11 og artikel 12, stk. 1, i
    forordning (EØF) nr. 1975/69 om indførelse af en præmieordning for slagtning
    af køer og for at undlade at bringe mælk og mejeriprodukter i handelen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1094/70 del Consiglio, dell' 8 giugno 1970, che adotta
    le norme generali d' applicazione dell' articolo 11 e dell' articolo 12, paragrafo
    1, del regolamento (CEE) n. 1975/69 che istituisce un regime di premi di macellazione
    delle vacche e di premi di non commercializzazione del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1094/70 van de Raad van 8 juni 1970 tot vaststelling
    van de algemene voorschriften voor de toepassing van artikel 11 en van artikel
    12, lid 1, van Verordening (EEG) nr. 1975/69 houdende invoering van een stelsel
    van premies voor het slachten van koeien en premies voor het niet in de handel
    brengen van melk en zuivelprodukten
  type: main
