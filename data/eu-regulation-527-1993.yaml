title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 527/93 of 5 March 1993 imposing a provisional
    countervailing duty on imports of ball bearings with a greatest external diameter
    not exceeding 30 mm originating in Thailand but to the Community from another
    third country
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 527/93 de la Commission, du 5 mars 1993, instituant
    un droit compensateur provisoire sur les importations de roulements à billes
    dont le plus grand diamètre extérieur n' excède pas 30 millimètres, qui sont
    originaires de Thaïlande mais exportés vers la Communauté à partir d' un autre
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 527/93 der Kommission vom 5. März 1993 zur Einführung
    eines vorläufigen Ausgleichszolls auf die Einfuhren von Kugellagern mit einem
    größten äußeren Durchmesser von 30 mm oder weniger mit Ursprung in, aber nicht
    mit Herkunft aus Thailand
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 527/93 af 5. marts 1993 om indførelse
    af en midlertidig udligningstold på importen af kuglelejer med største udvendige
    diameter på 30 mm med oprindelse i Thailand, men ikke eksporteret til Fællesskabet
    fra et andet tredjeland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 527/93 της Επιτροπής
    της 5ης Μαρτίου 1993 περί επιβολής προσωρινού
    αντισταθμιστικού δασμού επί των εισαγωγών
    ένσφαιρων τριβέων με μέγιστη εξωτερική διάμετρο
    που δεν υπερβαίνει τα 30mm, καταγωγής Ταϊλάνδης,
    αλλά εξαγόμενων προς την Κοινότητα από άλλη
    τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 527/93 della Commissione, del 5 marzo 1993, che istituisce
    un dazio compensativo provvisorio sulle importazioni di cuscinetti a sfera il
    cui maggior diametro esterno è inferiore o uguale a 30 mm, di origine tailandese
    ma esportati nella Comunità da un altro paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 527/93 van de Commissie van 5 maart 1993 tot instelling
    van een voorlopig compenserend recht op de invoer van kogellagers met een grootste
    uitwendige diameter van niet meer dan 30 mm, van oorsprong uit Thailand, maar
    uitgevoerd vanuit een ander derde land naar de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 527/93 da Comissão, de 5 de Março de 1993, que
    institui um direito de compensação provisório sobre as importações de rolamentos
    de esferas cujo maior diâmetro exterior não exceda 30 milímetros, originários
    da Tailândia mas exportados para a Comunidade a partir de outro país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 527/93 de la Comisión, de 5 de marzo de 1993, por
    el que se establece un derecho compensatorio provisional sobre las importaciones
    de rodamientos de bolas cuyo máximo diámetro exterior no excede de 30 mm, originarios
    de Tailandia pero exportados a la Comunidad desde otro tercer país
  type: main
