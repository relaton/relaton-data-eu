    priklausinio Gernsio įrašų trečiųjų šalių, teritorijų, zonų ar skyrių,
    iš kurių galima į Sąjungą įvežti ir vežti tranzitu per Sąjungą naminių
    paukščių ir naminių paukščių produktų siuntas, sąraše iš dalies keičiamas
    Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/2205 tat-22
