    за Обединеното кралство и подчинената на Британската
    корона територия Гърнзи в списъка от трети
    страни, територии, зони или компартменти, от
    които могат да бъдат въвеждани или да преминават
    транзитно през Съюза пратки от домашни птици
    и продукти от домашни птици
  type: main
- language: cs
  script: Latn
