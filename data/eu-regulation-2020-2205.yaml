  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/2205 van de Commissie van 22 december
    2020 tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft
    de vermeldingen voor het Verenigd Koninkrijk en het van de Kroon afhankelijke
    gebied Guernsey in de lijst van derde landen, gebieden, zones of compartimenten
    waaruit zendingen pluimvee en pluimveeproducten mogen worden binnengebracht in
    of doorgevoerd door de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/2205 z dnia 22 grudnia 2020
