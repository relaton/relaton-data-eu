    às entradas relativas ao Reino Unido e à dependência da Coroa de Guernesey
    na lista de países terceiros, territórios, zonas ou compartimentos a partir
    dos quais podem ser introduzidas e transitar na União remessas de aves de capoeira
    e de produtos à base de aves de capoeira
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/2205 al Comisiei din 22 decembrie
    2020 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubricile referitoare la Regatul Unit și la dependența Coroanei britanice Guernsey
    din lista țărilor terțe, teritoriilor, zonelor sau compartimentelor din care
    se pot introduce în Uniune sau pot tranzita Uniunea transporturi de păsări
    de curte și de produse obținute de la păsări de curte
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/2205 z 22. decembra 2020, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položky týkajúce
    sa Spojeného kráľovstva a korunnej dependencie Guernsey v zozname tretích
    krajín, území, oblastí alebo jednotiek, z ktorých je možný vstup zásielok
    hydiny a výrobkov z hydiny do Únie alebo ich prevoz cez jej územie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/2205 z dne 22. decembra 2020 o spremembi
