    Uniju ili provoziti kroz Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2205 végrehajtási rendelete (2020. december 22.)
    a 798/2008/EK rendelet I. mellékletének az Egyesült Királyságnak és Guernsey
    koronafüggőségnek a baromfi- és baromfitermék-szállítmányok Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékébe
    való bejegyzése tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/2205 della Commissione del 22 dicembre
    2020 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    le voci relative al Regno Unito e alla dipendenza della Corona di Guernsey nell’elenco
    di paesi terzi, loro territori, zone o compartimenti da cui è consentita l’introduzione
    nell’Unione di partite di pollame e prodotti a base di pollame
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/2205 (2020. gada 22. decembris),
