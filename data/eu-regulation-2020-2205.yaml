    kronsko odvisno ozemlje Guernsey na seznamu tretjih držav, ozemelj, območij
    ali kompartmentov, iz katerih se dovolita vnos pošiljk perutnine in perutninskih
    proizvodov v Unijo ter njihov tranzit skozi Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/2205 de la Comisión de 22 de diciembre
    de 2020 por el que se modifica el anexo I del Reglamento (CE) n.o 798/2008 con
    respecto a las entradas correspondientes al Reino Unido y a la dependencia de
    la Corona Guernesey en la lista de terceros países, territorios, zonas o compartimentos
    desde los cuales están permitidos la introducción en la Unión o el tránsito
    por ella de partidas de aves de corral y productos derivados
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/2205 av den 22 december
