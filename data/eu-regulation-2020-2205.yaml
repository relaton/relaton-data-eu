    unionin kautta siipikarjan ja siipikarjatuotteiden lähetyksiä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/2205 оd 22. prosinca 2020. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Ujedinjenu Kraljevinu i
    krunski posjed Guernsey na popisu trećih zemalja, državnih područja, zona ili
