    Apvienoto Karalisti un tās atkarīgo teritoriju Gērnsiju to trešo valstu, teritoriju,
    zonu vai nodalījumu sarakstā, no kuriem Savienībā atļauts ievest vai tranzītā
    caur to pārvadāt mājputnu un mājputnu produktu sūtījumus
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/2205 2020 m. gruodžio 22
