title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2205 of 22 December 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entries for the United Kingdom
    and the Crown Dependency of Guernsey in the list of third countries, territories,
    zones or compartments from which consignments of poultry and poultry products
    may be introduced into or transit through the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2205 de la Commission du 22 décembre
    2020 modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne
    les mentions relatives au Royaume-Uni et à la dépendance de la Couronne de Guernesey
    dans la liste des pays tiers, territoires, zones ou compartiments en provenance
    desquels des lots de volailles et de produits de volailles peuvent être introduits
    dans l’Union ou transiter par celle-ci
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/2205 der Kommission vom 22. Dezember
    2020 zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich
    der Einträge für das Vereinigte Königreich und dem unmittelbar der englischen
    Krone unterstehenden Gebiet Guernsey in der Liste von Drittländern, Gebieten,
    Zonen und Kompartimenten, aus denen Sendungen von Geflügel und Geflügelerzeugnissen
    in die Union eingeführt bzw. durch die Union durchgeführt werden dürfen
  type: main
- language: bg
  script: Cyrl
