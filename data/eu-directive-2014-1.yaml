title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/1/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, the Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    as an alloying element for bearings and wear surfaces in medical equipment exposed
    to ionising radiation
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/1/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb en tant qu’élément d’alliage dans les paliers et surfaces
    d’usure des équipements médicaux exposés aux rayonnements ionisants
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/1/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei als Legierungselement für ionisierender Strahlung ausgesetzte
    Lager und Verschleißflächen in medizinischen Geräten
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/1/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    ограничението за употреба на олово в качеството
    на легиращ елемент в лагери и износващи се
    повърхности в медицинска апаратура, изложена
    на йонизиращо лъчение
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/1/EU ze dne 18. října 2013
    , kterou se pro účely přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    použití olova jako legujícího prvku v ložiskách a třecích plochách zdravotnického
    vybavení vystaveného ionizujícímu záření
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/1/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår en undtaget anvendelse af bly som legeringselement
    til lejer og slidflader i medicinsk udstyr, der udsættes for ioniserende stråling
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/1/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τον μόλυβδο ως συστατικό κραμάτων
    για έδρανα και φθειρόμενες επιφάνειες ιατρικού
    εξοπλισμού που εκτίθενται σε ιοντίζουσα ακτινοβολία
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/1/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist legeeriva
    elemendina ioniseeriva kiirgusega kokku puutuvate meditsiiniseadmete laagrite
    ja kuluvate pindade puhul
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/1/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen siltä osin kuin on kyse lyijylle seosaineena
    ionisoivalle säteilylle altistuvien lääkinnällisten laitteiden laakereissa
    ja kulutuspinnoilla myönnettävästä poikkeuksesta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/1/EU оd 18. listopada 2013. o izmjeni,
    za potrebe prilagođivanja tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za olovo kao element u legurama
    za ležaje i habajuće površine u medicinskoj opremi izloženoj ionizirajućem
    zračenju
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/1/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az ionizáló sugárzásnak kitett orvosi berendezések csapágyazásához és
    kopófelületeihez ötvözőelemként használt ólom mentesítése tekintetében,
    a műszaki fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/1/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al piombo come elemento di lega in cuscinetti a sfera e superfici sottoposte a
    usura di apparecchiature mediche esposte a radiazioni ionizzanti
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/1/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam kā leģētājelementam
    jonizējošam starojumam pakļauta medicīniskā aprīkojuma gultņos un nodiluma
    virsmās
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/1/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    šviną naudoti lydiniuose, iš kurių gaminami medicininės įrangos guoliai
    ir dylantys paviršiai, veikiami jonizuojančiąja spinduliuote
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/1/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għaċ-ċomb bħala element ta’ liga għal berings u uċuħ li jittieklu
    fit-tagħmir mediku espost għar-radjazzjoni jonizzanti
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/1/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood als legeringselement in lagers en slijtvlakken in medische
    apparatuur die aan ioniserende straling worden blootgesteld
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/1/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu jako składnika stopów w łożyskach i powierzchniach ścierających
    się w sprzęcie medycznym wystawionych na działanie promieniowania jonizującego
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/1/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho, no respeitante a uma isenção
    para chumbo como elemento de liga em rolamentos e superfícies de desgaste nos
    equipamentos médicos expostos a radiações ionizantes
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/1/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare privind
    plumbul ca element de aliere pentru rulmenți și suprafețe de uzură în echipamente
    medicale expuse la radiații ionizante
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/1/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo ako legujúci
    prvok v ložiskách a trecích plochách zdravotníckych prístrojov vystavených
    ionizujúcemu žiareniu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/1/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    pri uporabi svinca v zlitinah za ležaje in nosilne površine medicinske opreme,
    ki je izpostavljena ionizirajočemu sevanju, zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/1/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo como elemento de aleación en los cojinetes y superficies de contacto
    de los productos sanitarios expuestos a radiaciones ionizantes
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/1/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly som legeringsämne
    för lager och slitytor i medicinsk utrustning som utsätts för joniserande strålning
  type: main
