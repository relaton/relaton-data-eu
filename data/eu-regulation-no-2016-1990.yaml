    dal 2 al 7 lugli 1990, nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2016/90 van de Commissie van 13 juli 1990 tot vaststelling
