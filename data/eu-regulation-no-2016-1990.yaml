    déposées du 2 au 7 juillet 1990 dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2016/90 der Kommission vom 13. Juli 1990 zur Festlegung
