type: standard
title:
- language: en
  script: Latn
  content: '79/130/EEC: Commission Decision of 23 January 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted (not elastic or rubberized), other than those of category 10, of
    wool, cotton or man-made textile fibres, falling within heading No ex 60.02 of
    the Common Customs Tariff (NIMEXE codes 60.02-50, 60, 70, 80) (category 11), originating
    in Taiwan and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/130/CEE: Décision de la Commission, du 23 janvier 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, autre que celle de la catégorie 10,
    de laine, de coton ou de fibres textiles synthétiques et artificielles de la
    position ex 60.02 du tarif douanier commun (codes Nimexe: 60.02-50, 60, 70, 80)
    catégorie 11, originaire de T''ai-wan et mise en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/130/EWG: Entscheidung der Kommission vom 23. Januar 1979, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, andere als Waren der Kategorie 10, aus Wolle, Baumwolle oder
    aus synthetischen Spinnstoffen, der Tarifnummer ex 60.02 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.02-50; 60; 70; 80) (Kategorie 11) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/130/EØF: Kommissionens beslutning af 23. januar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andre handsker,
    vanter og luffer af trikotage, ikke elastisk eller gummeret, end de under kategori
    10 nævnte, af uld, bomuld eller syntetiske fibre, som henhører under pos. ex
    60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-50, 60, 70, 80) kategori 11,
    har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/130/CEE: Decisione della Commissione, del 23 gennaio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti, a maglia
    non elastica né gommata, esclusi quelli della categoria 10, di lana, di cotone
    o di fibre tessili sintetiche, della voce ex 60.02 della tariffa doganale comune
    (codice Nimexe: 60.02-50, 60, 70, 80), categoria 11, originari di Taiwan e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/130/EEG: Beschikking van de Commissie van 23 januari 1979 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk, andere dan die van
    categorie nr. 10, van wol, van katoen of van synthetische textielvezels, van post
    ex 60.02 van het gemeenschappelijk douanetarief (NIMEXE-code 60.02- 50, 60, 70,
    80) (categorie 11), van oorsprong uit Taiwan en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
