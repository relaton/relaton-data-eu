title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2256/2000 of 11 October 2000 derogating,
    as regards the list of double-zero (00) colza and rape seed varieties and variety
    associations, from Regulation (EC) No 2316/1999 laying down detailed rules for
    the application of Council Regulation (EC) No 1251/1999 establishing a support
    system for producers of certain arable crops
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2256/2000 de la Commission du 11 octobre 2000 dérogeant,
    en ce qui concerne la liste des variétés et des associations variétales de
    semences de colza et de navette «double zéro», au règlement (CE) nº 2316/1999
    portant modalités d'application du règlement (CE) nº 1251/1999 du Conseil instituant
    un régime de soutien aux producteurs de certaines cultures arables
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2256/2000 der Kommission vom 11. Oktober 2000 zur Abweichung
    - hinsichtlich des Verzeichnisses der Sorten und Verbundsorten von Saatgut von
    "Doppel-Null"-Raps und -Rübsen - von der Verordnung (EG) Nr. 2316/1999 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1251/1999 des Rates zur Einführung einer Stützungsregelung
    für Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2256/2000 af 11. oktober 2000 om en fravigelse
    af forordning (EF) nr. 2316/1999 om gennemførelsesbestemmelser til Rådets forordning
    (EF) nr. 1251/1999 om indførelse af en støtteordning for producenter af visse
    markafgrøder, for så vidt angår listen over frø af dobbeltlave raps- og rybssorter,
    herunder sammensatte sorter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2256/2000 της Επιτροπής,
    της 11ης Οκτωβρίου 2000, για παρέκκλιση, όσον αφορά
    τον κατάλογο των ποικιλιών και των συνδυασμών
    ποικιλιών για σπόρο κράμβης και γογγύλης «δύο
    μηδέν», από τον κανονισμό (ΕΚ) αριθ. 2316/1999 σχετικά
    με τις λεπτομέρειες εφαρμογής του κανονισμού
    (ΕΚ) αριθ. 1251/1999 του Συμβουλίου για τη θέσπιση
    καθεστώτος στήριξης των παραγωγών ορισμένων
    αροτραίων καλλιεργειών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2256/2000, annettu 11 päivänä lokakuuta 2000,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetun neuvoston
    asetuksen (EY) N:o 1251/1999 soveltamista koskevista yksityiskohtaisista säännöistä
    annetusta asetuksesta (EY) N:o 2316/1999 poikkeamisesta 00-lajikkeisiin tai 00-lajikeryhmiin
    kuuluvien rypsin- ja rapsinsiementen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2256/2000 della Commissione, dell'11 ottobre 2000,
    che deroga, per quanto riguarda l'elenco delle varietà e delle associazioni varietali
    delle sementi di colza e di ravizzone «doppio zero», al regolamento (CE) n.
    2316/1999 recante modalità di applicazione del regolamento (CE) n. 1251/1999
    del Consiglio, che istituisce un regime di sostegno a favore dei coltivatori di
    taluni seminativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2256/2000 van de Commissie van 11 oktober 2000 tot
    afwijking van Verordening (EG) nr. 2316/1999 houdende uitvoeringsbepalingen van
    Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een steunregeling
    voor producenten van bepaalde akkerbouwgewassen, ten aanzien van de lijst van
    "dubbel nul"-rassen en mengsels van "dubbel nul"-rassen van kool- en raapzaad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2256/2000 da Comissão, de 11 de Outubro de 2000,
    que derroga, no que respeita à lista de variedades e associações varietais
    de colza e nabo silvestre «duplo zero», ao Regulamento (CE) n.o 2316/1999 que
    estabelece normas de execução do Regulamento (CE) n.o 1251/1999 do Conselho
    que institui um sistema de apoio aos produtores de determinadas culturas arvenses
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2256/2000 de la Comisión, de 11 de octubre de 2000,
    que establece una excepción, en lo que respecta a la lista de variedades y asociaciones
    varietales de semillas de colza y nabina «doble cero», al Reglamento (CE) nº
    2316/1999 que establece las modalidades de aplicación del Reglamento (CE) nº
    1251/1999 del Consejo, por el que se establece un régimen de apoyo a los productores
    de determinados cultivos herbáceos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2256/2000 av den 11 oktober 2000 om undantag,
    när det gäller sortlistan över utsäde av dubbellåga sammansatta sorter av
    raps och rybs, från förordning (EG) nr 2316/1999 om tillämpningsföreskrifter
    till rådets förordning (EG) nr 1251/1999 om upprättandet av ett stödsystem
    för producenter av vissa jordbruksgrödor
  type: main
