title:
- language: en
  script: Latn
  content: Council Directive 92/73/EEC of 22 September 1992 widening the scope of
    Directives 65/65/EEC and 75/319/EEC on the approximation of provisions laid down
    by Law, Regulation or Administrative Action relating to medicinal products and
    laying down additional provisions on homeopathic medicinal products
  type: main
- language: fr
  script: Latn
  content: Directive 92/73/CEE du Conseil, du 22 septembre 1992, élargissant le champ
    d'application des directives 65/65/CEE et 75/319/CEE concernant le rapprochement
    des dispositions législatives, réglementaires et administratives relatives aux
    médicaments et fixant des dispositions complémentaires pour les médicaments
    homéopatiques
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/73/EWG des Rates vom 22. September 1992 zur Erweiterung des
    Anwendungsbereichs der Richtlinien 65/65/EWG und 75/319/EWG zur Angleichung der
    Rechts- und Verwaltungsvorschriften über Arzneimittel und zur Festlegung zusätzlicher
    Vorschriften für homöopathische Arzneimittel
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/73/EØF af 22. september 1992 om udvidelse af anvendelsesområdet
    for direktiv 65/65/EØF og 75/319/EØF om tilnærmelse af lovgivning om farmaceutiske
    præparater, og om fastsættelse af supplerende bestemmelser for homøopatiske
    lægemidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/73/ΕΟΚ του Συμβουλίου της 22ας Σεπτεμβρίου
    1992 για τη διεύρυνση του πεδίου εφαρμογής των
    οδηγιών 65/65/ΕΟΚ και 75/319/ΕΟΚ περί της προσέγγισης
    των νομοθετικών, κανονιστικών και διοικητικών
    διατάξεων για τα φάρμακα και τη θέσπιση συμπληρωματικών
    διατάξεων για τα ομοιοπαθητικά φάρμακα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/73/ETY, annettu 22 päivänä syyskuuta 1992, lääkkeitä
    koskevien lakien, asetusten ja hallinnollisten määräysten lähentämisestä
    annettujen direktiivien 65/65/ETY ja 75/319/ETY soveltamisalan laajentamisesta
    ja homeopaattisia lääkkeitä koskevista lisäsäännöksistä
  type: main
- language: it
  script: Latn
  content: Direttiva 92/73/CEE del Consiglio, del 22 settembre 1992, che amplia il
    campo d'applicazione delle direttive 65/65/CEE e 75/319/CEE concernenti il ravvicinamento
    delle disposizioni legislative, regolamentari ed amministrative relative ai medicinali
    e che fissa disposizioni complementari per i medicinali omeopatici
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/73/EEG van de Raad van 22 september 1992 tot uitbreiding van
    het toepassingsgebied van de Richtlijnen 65/65/EEG en 75/319/EEG betreffende de
    aanpassing van de wettelijke en bestuursrechtelijke bepalingen inzake geneesmiddelen
    en tot vaststelling van aanvullende bepalingen voor homeopathische geneesmiddelen
  type: main
- language: pt
  script: Latn
  content: Directiva 92/73/CEE do Conselho, de 22 de Setembro de 1992, que alarga
    o âmbito de aplicação das directivas 65/65/CEE e 75/319/CEE, relativas à aproximação
    das disposições legislativas, regulamentares e administrativas respeitantes
    aos medicamentos e que estabelecem disposições complementares para os medicamentos
    homeopáticos
  type: main
- language: es
  script: Latn
  content: Directiva 92/73/CEE del Consejo, de 22 de septiembre de 1992, por la que
    se amplía el ámbito de aplicación de las Directivas 65/65/CEE y 75/319/CEE
    relativas a la aproximación de las disposiciones legales, reglamentarias y administrativas
    sobre medicamentos y por la que se adoptan disposiciones complementarias para
    los medicamentos homeopáticos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 92/73/EEG av den 22 september 1992 om utökad räckvidd
    för direktiv 65/65/EEG och 75/319/EEG om tillnärmning av lagar och andra författningar
    beträffande läkemedel och fastställande av ytterligare bestämmelser som rör
    homeopatika
  type: main
