  content: Règlement n 73/67/CEE de la Commission, du 12 avril 1967, fixant les coefficients
    forfaitaires applicables à certains produits du secteur de la viande de volaille
    pour le calcul des restitutions à l'exportation vers les pays tiers pour la période
    du 1er juillet 1964 au 30 juin 1965
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 73/67/EWG der Kommission vom 12. April 1967 zur Festsetzung
    von Pauschalkoeffizienten für bestimmte Geflügelfleisch-Erzeugnisse zwecks Berechnung
    der Erstattungen bei der Ausfuhr nach dritten Ländern für den Zeitraum vom 1.
    Juli 1964 bis zum 30. Juni 1965
  type: main
- language: it
  script: Latn
  content: Regolamento n. 73/67/CEE della Commissione, del 12 aprile 1967, che fissa
    i coefficienti forfettari applicabili ad alcuni prodotti del settore della carne
    di volatili per il calcolo delle restituzioni all'esportazione verso i paesi terzi
    per il periodo 1 luglio 1964 - 30 giugno 1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 73/67/EEG van de Commissie van 12 april 1967 houdende vaststelling
    van de forfaitaire coëfficiënten voor bepaalde produkten van slachtpluimvee
    ter berekening van de restituties bij uitvoer naar derde landen gedurende het
    tijdvak van 1 juli 1964 tot 30 juni 1965
