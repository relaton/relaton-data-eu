title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1087/2009 of 12 November 2009 concerning
    the authorisation of an enzyme preparation of endo-1,4-beta-xylanase produced
    by Trichoderma reesei (ATCC PTA 5588), subtilisin produced by Bacillus subtilis
    (ATCC 2107) and alpha-amylase produced by Bacillus amyloliquefaciens (ATCC 3978)
    as a feed additive for chickens for fattening, for ducks and for turkeys for fattening
    (holder of authorisation Danisco Animal Nutrition, legal entity Finnfeeds International
    Limited)
  type: main
- language: fr
  script: Latn
