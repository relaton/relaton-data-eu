  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2789/86 della Commissione del 9 settembre 1986 che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    sintetiche e ai sacchi e sacchetti d' imballaggio, di polietilene o di polipropilene,
    della categoria di prodotti n. 33 (codice 40.0330), originari dello Sri Lanka
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3600/85
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2789/86 van de Commissie van 9 september 1986 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige continuvezels en op zakken voor verpakkingsdoeleinden
    van polyethyleen of van polypropyleen, van de categorie van produkten nr. 33 (codenummer
    40.0330), van oorsprong uit Sri Lanka, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3600/85 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2789/86 da Comissão de 9 de Setembro de 1986 que
