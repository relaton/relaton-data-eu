title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2789/86 of 9 September 1986 re-establishing
    the levying of customs duties on woven fabrics of synthetic textile fibres and
    on sacks and bags, of a kind used for the packing of goods, of polyethylene or
    polypropylene, products of category 33 (code 40.0330), originating in Sri Lanka,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2789/86 de la Commission du 9 septembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques et aux sacs et sachets d' emballage, de polyéthylène
    ou de polypropylène de la catégorie n° 33 (code 40.0330), originaires du Sri
    Lanka, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2789/86 der Kommission vom 9. September 1986 über
    die Wiedereinführung des Zollsatzes für Gewebe aus synthetischen Spinnfäden
    und für Säcke und Beutel zu Verpackungszwecken aus Polyäthylen oder Polypropylen
    der Warenkategorie Nr. 33 (Kennziffer 40.0330) mit Ursprung in Sri Lanka, dem
    die in der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2789/86 af 9. september 1986 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage af polyethylen
    eller polypropylen, vævet af endeløse kemofibre af syntetiske fibre, henhørende
    under varekategori nr. 33 (kode 40.0330), som har oprindelse i Sri Lanka og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3600/85
  type: main
- language: el
  script: Grek
