    Castilla y Leon, Castilla-La Mancha, Comunidad Valenciana, Extremadura, Galicia,
    Canarias, Murcia, Ceuta y Melilla) til forbedring af vilkårene for forarbejdning
    og afsætning af landbrugsprodukter (Kun den spanske udgave er autentisk) (91/651/EØF)
    #'
