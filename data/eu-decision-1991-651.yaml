    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen land- und forstwirtschaftlicher
    Erzeugnisse in Spanien (ohne die Regionen Andalucía, Asturias, Castilla y León,
    Castilla-La-Mancha, Comunidad Valenciana, Extremadura, Galicia, Canarias, Murcia,
    Ceuta y Melilla) (Nur der spanische Text ist verbindlich) (91/651/EWG) #'
  type: main
- language: da
