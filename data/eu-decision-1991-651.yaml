title:
- language: en
  script: Latn
  content: '91/651/EEC: Commission Decision of 10 December 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which agricultural products are processed
    and marketed in Spain (with the exception of these regions: Andalucía, Asturias,
    Castilla y León, Castilla-La Mancha, Comunidad Valenciana, Extremadura, Galicia,
    Canarias, Murcia, Ceuta y Melilla) (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/651/CEE: Décision de la Commission du 10 décembre 1991 concernant
    l''établissement du cadre communautaire d''appui pour les interventions structurelles
    communautaires en Espagne (à l''exception des régions suivantes: l''Andalousie,
    les Asturies, la Castille-Léon, la Castille-la-Manche, Valence, l''Estrémadure,
    la Galice, les Canaries, la Murcie, Ceuta et Melilla) en matière d''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    (Le texte en langue espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 10. Dezember 1991 zur Aufstellung eines
