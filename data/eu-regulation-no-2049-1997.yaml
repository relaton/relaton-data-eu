    Überschreitung der Höchstgarantiemenge in den Wirtschaftsjahren 1995/96 und
    1996/97 zu senken ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2049/97 af 20. oktober 1997 om fastsættelse
