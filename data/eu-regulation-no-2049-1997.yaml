    1997/1998 réduit en conséquence du dépassement de la quantité maximale garantie
    pendant les campagnes de commercialisation 1995/1996 et 1996/1997
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2049/97 der Kommission vom 20. Oktober 1997 zur Festsetzung
