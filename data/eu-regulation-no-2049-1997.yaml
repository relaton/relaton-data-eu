    1997/98, ridotto a seguito del superamento del quantitativo massimo garantito
    nel corso delle campagne di commercializzazione 1995/96 e 1996/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2049/97 van de Commissie van 20 oktober 1997 tot vaststelling,
