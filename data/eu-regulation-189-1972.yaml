title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 189/72 de la Commission, du 26 janvier 1972, abrogeant
    les montants compensatoires applicables dans le secteur des matières grasses
    à la suite de l'élargissement temporaire des marges de fluctuation des monnaies
    de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 189/72 der Kommission vom 26. Januar 1972 zur Aufhebung
    der auf dem Öl- und Fettsektor anzuwendenden Ausgleichsbeträge im Anschluß
    an die vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 189/72 della Commissione, del 26 gennaio 1972, che
    abroga gli importi compensativi fissati per il settore delle materie grasse in
    seguito all'ampliamento temporaneo dei margini di fluttuazione delle monete di
    taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 189/72 van de Commissie van 26 januari 1972 houdende
    intrekking van de compenserende bedragen van toepassing in de sector oliën en
    vetten ingevolge de tijdelijke verruiming van de fluctuatiemarges van de valuta's
    van sommige Lid-Staten
  type: main
