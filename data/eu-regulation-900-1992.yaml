    zamezení zneužívání určitých látek k nedovolené výrobě omamných a
    psychotropních látek
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 900/92 af 31. marts 1992 om ændring af
    forordning (EØF) nr. 3677/90 om foranstaltninger til modvirkning af ulovlig anvendelse
    af visse stoffer til fremstilling af narkotika og psykotrope stoffer #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 900/92 του Συμβουλίου
    της 31ης Μαρτίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3677/90 για τη θέσπιση μέτρων
    για την πρόληψη της διοχέτευσης ορισμένων
    ουσιών στην παράνομη παρασκευή ναρκωτικών
    και ψυχοτρόπων ουσιών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EMÜ) nr 900/92, 31. märts 1992, millega muudetakse
    määrust (EMÜ) nr 3677/90, millega kehtestatakse meetmed, et tõkestada narkootiliste
    ja psühhotroopsete ainete ebaseaduslikuks valmistamiseks kasutatavate ainete
    levikut
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 900/92, annettu 31 päivänä maaliskuuta 1992,
    toimenpiteistä tiettyjen aineiden kulkeutumisen estämiseksi huumausaineiden
    tai psykotrooppisten aineiden laittomaan valmistukseen annetun asetuksen (ETY)
    N:o 3677/90 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 900/92/EGK rendelete (1992. március 31.) az egyes anyagok kábítószerek
    és pszichotróp anyagok tiltott előállítására való eltérítésének megakadályozására
    irányuló intézkedések megállapításáról szóló 3677/90/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 900/92 del Consiglio del 31 marzo 1992 che modifica
    il regolamento (CEE) n. 3677/90 recante misure intese a scoraggiare la diversione
    di talune sostanze verso la fabbricazione illecita di stupefacenti o di sostanze
    psicotrope
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EEK) Nr. 900/92 (1992. gada 31. marts), ar ko groza Regulu
    (EEK) Nr. 3677/90, ar kuru paredz pasākumus, kas jāveic, lai novērstu dažu
    vielu novirzīšanu narkotisko un psihotropo vielu nelikumīgai izgatavošanai
  type: main
- language: lt
  script: Latn
  content: Tarybos Reglamentas (EEB) Nr. 900/92 1992 m. kovo 31 d. iš dalies keičiantis
    Reglamentą (EEB) Nr. 3677/90, nustatantį priemones, kurių reikia imtis siekiant
    užkirsti kelią panaudoti tam tikras medžiagas neteisėtai narkotinių ir psichotropinių
    medžiagų gamybai
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KEE) Nru 900/92 tal-31 ta’ Marzu 1992 li jemenda
    r-Regolament (KEE) Nru 3677/90 li jistabbilixxi miżuri li għandhom jittieħdu
    sabiex jiskoraġġixxu d-diverżjoni ta’ ċerti sustanzi lejn il-manifattura
    illegali ta’ drogi narkotiċi u sustanzi psikotropiċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 900/92 van de Raad van 31 maart 1992 tot wijziging
    van Verordening (EEG) nr. 3677/90 houdende maatregelen om te voorkomen dat bepaalde
    stoffen worden misbruikt voor de illegale vervaardiging van verdovende middelen
    en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (EWG) nr 900/92 z dnia 31 marca 1992 r. zmieniające
    rozporządzenie (EWG) nr 3677/90 ustanawiające środki, które powinny być podjęte
    w celu uniemożliwiania wykorzystywania niektórych substancji do nielegalnego
    wytwarzania środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 900/92 do Conselho de 31 de Março de 1992 que altera
    o Regulamento (CEE) nº 3677/90, que estabelece as medidas a adoptar para evitar
    o desvio de determinadas substâncias para o fabrico ilegal de estupefacientes
    e de substâncias psicotrópicas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EHS) č. 900/92 z 31. marca 1992, ktorým sa mení a dopĺňa
    nariadenie (EHS) č. 3677/90, ktorým sa stanovujú opatrenia, ktoré treba prijať,
    aby sa zabránilo zneužívaniu určitých látok na nedovolenú výrobu omamných
    látok a psychotropných látok
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EGS) št. 900/92 z dne 31. marca 1992 o spremembi Uredbe
    (EGS) 3677/90 o določitvi ukrepov, sprejetih za preprečevanje zlorabe nekaterih
    snovi za nezakonito proizvodnjo mamil in drugih psihotropnih snovi
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 900/92 del Consejo de 31 de marzo de 1992 por el que
