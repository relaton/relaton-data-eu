title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 982/89 of 14 April 1989 derogating for the
    1988/89 wine year from the producers'requirement to notify the quantities of table
    wine they must deliver for compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 982/89 de la Commission du 14 avril 1989 portant mesure
    dérogatoire pour la campagne 1988/1989 en matière de communication par les producteurs
    de leurs quantités de vin de table à livrer à la distillation obligatoire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 982/89 DER KOMMISSION vom 14. April 1989 ueber eine
    abweichende Massnahme fuer das Wirtschaftsjahr 1988/89 fuer die Mitteilungen der
    Erzeuger ueber ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 982/89 af 14. april 1989 om en undtagelsesforanstaltning
    for produktionsåret 1988/89 med hensyn til producenternes meddelelse af bordvinsmængder,
    der skal leveres til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 982/89 της 14ης Απριλίου
    1989 που προβλέπει μέτρο παρέκκλισης για την
    περίοδο 1988/89, όσον αφορά την ανακοίνωση από
    τους παραγωγούς των ποσοτήτων επιτραπέζιου
    οίνου που θα παραδοθούν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 982/89 DELLA COMMISSIONE del 14 aprile 1989 recante
    una misura derogatoria per la campagna 1988/1989, per quanto riguarda la comunicazione,
    da parte dei produttori, dei quantitativi di vini da tavola che devono consegnare
    alla distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 982/89 VAN DE COMMISSIE van 14 april 1989 houdende
    afwijkende bepalingen voor het wijnoogstjaar 1988/1989 met betrekking tot de mededeling,
    door de producenten, van de voor verplichte distillatie te leveren hoeveelheden
    tafelwijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 982/89 DA COMISSAO de 14 de Abril de 1989 que estabelece
    uma medida derrogatoria para a campanha de 1988/1989 no que diz respeito à comunicaçao
    pelos produtores das suas quantidades de vinho de mesa a entregar para destilaçao
    obrigatoria
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 982/89 DE LA COMISION de 14 de abril de 1989 por el
    que se establece una medida de excepcion, con respecto a la campana de 1988/89,
    en cuanto a la comunicacion que deben efectuar los productores sobre las cantidades
    de vino de mesa que tienen que destinar a destilacion obligatoria
  type: main
