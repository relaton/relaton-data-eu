    merentakaisten departementtien hyväksi annettujen erityistoimenpiteiden soveltamista
    koskevista yksityiskohtaisista säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 489/97 della Commissione del 17 marzo 1997 che stabilisce
