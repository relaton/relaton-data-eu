  content: Commission Regulation (EC) No 489/97 of 17 March 1997 laying down detailed
    rules for the application of the specific measures adopted in respect of fresh
    fruit and vegetables, plants and flowers for the benefit of the French overseas
    departments (FOD)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 489/97 de la Commission du 17 mars 1997 portant modalités
