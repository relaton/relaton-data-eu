title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2888/74 of the Commission of 19 November 1974 re-establishing
    the levying of customs duties on cotton yarn, not put up for retail sale, falling
    within subheading 55.05 B I, originating in developing countries to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3503/73
    of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2888/74 de la Commission, du 19 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, de la sous- position tarifaire
    55.05 B I, originaires des pays en voie de développement bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2888/74 der Kommission vom 19. November 1974 über
    die Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifstelle 55.05 B I mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2888/74 af 19. november 1974 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger
    under underposition 55.05 B I, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3503/ 73
    af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2888/74 della Commissione, del 19 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto della sottovoce doganale n. 55.05 B I, originari
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2888/74 van de Commissie van 19 november 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein van onderverdeling 55.05 B I,
    van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 3503/73 van de Raad van 18 december 1973 algemene tariefpreferenties werden
    geopend
  type: main
