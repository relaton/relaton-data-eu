title:
- language: en
  script: Latn
  content: '90/459/ECSC: Commission Decision of 1 August 1990 authorizing the member
    States to institute intra- Community surveillance of the importation for home
    use of certain iron and steel products originating in certain third countries
    and covered by the Treaty establishing the European Coal and Steel Community and
    in free circulation in the Community'
  type: main
- language: fr
  script: Latn
  content: '90/459/CECA: Décision de la Commission, du 1er août 1990, autorisant
    les États membres à instaurer une surveillance intracommunautaire des importations
    pour la mise à la consommation de certains produits sidérurgiques originaires
    de certains pays tiers relevant du Traité instituant la Communauté européenne
    du charbon et de l''acier et mis en libre pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '90/459/EGKS: ENTSCHEIDUNG DER KOMMISSION VOM 1. AUGUST 1990 ZUR ERMAECHTIGUNG
    DER MITGLIEDSTAATEN ZUR EINFUEHRUNG EINER INNERGEMEINSCHAFTLICHEN UEBERWACHUNG
    DER EINFUHREN ZUR UEBERFUEHRUNG IN DEN STEUERRECHTLICH FREIEN VERKEHR VON BESTIMMTEN
    UNTER DEN VERTRAG UEBER DIE GRUENDUNG DER EUROPAEISCHEN GEMEINSCHAFT FUER KOHLE
    UND STAHL FALLENDEN EISEN- UND STAHLERZEUGNISSEN MIT URSPRUNG IN BESTIMMTEN DRITTLAENDERN,
    DIE SICH IN DER GEMEINSCHAFT IM ZOLLRECHTLICH FREIEN VERKEHR BEFINDEN'
  type: main
- language: da
  script: Latn
  content: '90/459/EKSF: KOMMISSIONENS BESLUTNING AF 1. AUGUST 1990 OM BEMYNDIGELSE
    AF MEDLEMSSTATERNE TIL AT INDFOERE TILSYN INDEN FOR FAELLESSKABET MED IMPORTEN
    TIL FRIT FORBRUG AF VISSE JERN- OG STAALPRODUKTER MED OPRINDELSE I VISSE TREDJELANDE,
    DER HENHOERER UNDER TRAKTATEN OM OPRETTELSE AF DET EUROPAEISKE KUL- OG STAALFAELLESSKAB,
    OG SOM OVERGAAR TIL FRI OMSAETNING I FAELLESSKABET'
  type: main
- language: el
  script: Grek
  content: '90/459/ΕΚΑΧ: Απόφαση της Επιτροπής της 1ης
    Αυγούστου 1990 που εξουσιοδοτεί τα κράτη μέλη
    να θεσπίσουν ενδοκοινοτική επίβλεψη των εισαγωγών
    για την κατανάλωση ορισμένων προϊόντων της
    βιομηχανίας σιδήρου και χάλυβα, καταγωγής
    ορισμένων τρίτων χωρών που υπάγονται στη συνθήκη
    για την ίδρυση της Ευρωπαϊκής Κοινότητας Άνθρακα
    και Χάλυβα και τίθενται σε ελεύθερη κυκλοφορία
    σε άλλο κράτος μέλος'
  type: main
- language: it
  script: Latn
  content: '90/459/CECA: DECISIONE DELLA COMMISSIONE, DEL 1 AGOSTO 1990, CHE AUTORIZZA
    GLI STATI MEMBRI A ISTITUIRE UNA SORVEGLIANZA INTRACOMUNITARIA SULLE IMPORTAZIONI
    PER L'' IMMISSIONE IN CONSUMO DI TALUNI PRODOTTI SIDERURGICI ORIGINARI DEI PAESI
    TERZI CONTEMPLATI DAL TRATTATO CHE ISTITUISCE LA COMUNITA EUROPEA DEL CARBONE
    E DELL'' ACCIAIO E IMMESSI IN LIBERA PRATICA NELLA COMUNITA'
  type: main
- language: nl
  script: Latn
  content: '90/459/EGKS: BESCHIKKING VAN DE COMMISSIE VAN 1 AUGUSTUS 1990 WAARBIJ
    LID-STATEN WORDEN GEMACHTIGD EEN INTRACOMMUNAUTAIR TOEZICHT IN TE STELLEN OP DE
    INVOER TOT VERBRUIK VAN BEPAALDE IJZER- EN STAALPRODUKTEN VAN OORSPRONG UIT BEPAALDE
    DERDE LANDEN DIE ONDER HET VERDRAG TOT OPRICHTING VAN DE EUROPESE GEMEENSCHAP
    VOOR KOLEN EN STAAL VALLEN EN DIE IN DE GEMEENSCHAP IN HET VRIJE VERKEER WORDEN
    GEBRACHT'
  type: main
- language: pt
  script: Latn
  content: '90/459/CECA: DECISAO DA COMISSAO, DE 1 DE AGOSTO DE 1990, QUE AUTORIZA
    OS ESTADOS-MEMBROS A INSTALAREM UMA VIGILANCIA INTRACOMUNITARIA DAS IMPORTACOES
    PARA INTRODUCAO NO CONSUMO DE CERTOS PRODUTOS SIDERURGICOS, ORIGINARIOS DE CERTOS
    PAISES TERCEIROS, ABRANGIDOS PELO TRATADO QUE INSTITUI A COMUNIDADE EUROPEIA DO
    CARVAO E DO ACO E INTRODUZIDOS EM LIVRE PRATICA NUM OUTRO ESTADO-MEMBRO'
  type: main
- language: es
  script: Latn
  content: '90/459/CECA: DECISION DE LA COMISION, DE 1 DE AGOSTO DE 1990, POR LA QUE
    SE AUTORIZA A LOS ESTADOS MIEMBROS A ESTABLECER MEDIDAS DE VIGILANCIA INTRACOMUNITARIA
    EN RELACION CON LAS IMPORTACIONES PARA LA PUESTA AL CONSUMO DE DETERMINADOS PRODUCTOS
    SIDERURGICOS ORIGINARIOS DE DETERMINADOS PAISES TERCEROS DEL TRATADO CONSTITUTIVO
    DE LA COMUNIDAD EUROPEA DEL CARBON Y DEL ACERO Y DESPACHADOS A LIBRE PRACTICA
    EN LA COMUNIDAD'
