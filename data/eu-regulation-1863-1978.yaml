    partecipazione del Fondo europeo agricolo di orientamento e di garanzia, sezione
    garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1863/78 van de Raad van 25 juli 1978 houdende vaststelling,
