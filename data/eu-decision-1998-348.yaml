title:
- language: en
  script: Latn
  content: '98/348/EC: Council Decision of 19 May 1998 granting a Community guarantee
    to the European Investment Bank against losses under loans for projects in the
    former Yugoslav Republic of Macedonia and amending Decision 97/256/EC granting
    a Community guarantee to the European Investment Bank against losses under loans
    for projects outside the Community (Central and Eastern European countries, Mediterranean
    countries, Latin American and Asian countries and South Africa)'
  type: main
- language: fr
  script: Latn
  content: '98/348/CE: Décision du Conseil du 19 mai 1998 concernant l''octroi d''une
    garantie de la Communauté à la Banque européenne d''investissement en cas de
    pertes résultant de prêts en faveur de projets réalisés dans l''ancienne République
    yougoslave de Macédoine et modifiant la décision 97/256/CE accordant une garantie
    de la Communauté à la Banque européenne d''investissement en cas de pertes
    résultant de prêts en faveur de projets réalisés à l''extérieur de la Communauté
    (pays de l''Europe centrale et orientale, pays méditerranéens, pays d''Amérique
    latine et d''Asie, Afrique du Sud)'
  type: main
- language: de
  script: Latn
  content: '98/348/EG: Beschluss des Rates vom 19. Mai 1998 über eine Garantieleistung
    der Gemeinschaft für etwaige Verluste der Europäischen Investitionsbank aus
    Darlehen für Vorhaben in der Ehemaligen Jugoslawischen Republik Mazedonien und
    zur Änderung des Beschlusses 97/256/EG über eine Garantieleistung der Gemeinschaft
    für etwaige Verluste der Europäischen Investitionsbank aus Darlehen für Vorhaben
    in Drittländern (mittel- und osteuropäische Länder, Mittelmeerländer, Länder
    Lateinamerikas und Asiens sowie Südafrika)'
  type: main
- language: da
  script: Latn
  content: '98/348/EF: Rådets afgørelse af 19. maj 1998 om en fællesskabsgaranti
    til Den Europæiske Investeringsbank mod tab i forbindelse med lån til projekter
    i Den Tidligere Jugoslaviske Republik Makedonien og om ændring af afgørelse
    97/256/EF om en fællesskabsgaranti til Den Europæiske Investeringsbank mod tab
    i forbindelse med lån til projekter uden for Fællesskabet (de central- og østeuropæiske
    lande, Middelhavslandene, landene i Latinamerika og Asien samt Sydafrika)'
  type: main
- language: el
  script: Grek
  content: '98/348/ΕΚ: Απόφαση του Συμβουλίου της 19ης
    Μαΐου 1998 με την οποία παρέχεται εγγύηση της
    Κοινότητας στην Ευρωπαϊκή Τράπεζα Επενδύσεων
    σε περίπτωση ζημιών από δάνεια που χορηγούνται
    για σχέδια στην πρώην Γιουγκοσλαβική Δημοκρατία
    της Μακεδονίας και που τροποποιεί την απόφαση
    97/256/ΕΚ με την οποία παρέχεται εγγύηση της Κοινότητας
    στην Ευρωπαϊκή Τράπεζα Επενδύσεων σε περίπτωση
    ζημιών από δάνεια που χορηγούνται για σχέδια
    εκτός της Κοινότητας (Κεντρική και Ανατολική
    Ευρώπη, χώρες της Μεσογείου, Λατινική Αμερική
    και Ασία, Νότια Αφρική)'
  type: main
- language: fi
  script: Latn
  content: '98/348/EY: Neuvoston päätös, tehty 19 päivänä toukokuuta 1998, yhteisön
    takuun myöntämisestä Euroopan investointipankille entisessä Jugoslavian tasavallassa
    Makedoniassa toteutettaviin hankkeisiin liittyvistä lainoista mahdollisesti aiheutuvien
    tappioiden varalta ja yhteisön takuun myöntämisestä Euroopan investointipankille
    yhteisön ulkopuolella (Keski- ja Itä-Euroopan maissa, Välimeren alueen maissa,
    Latinalaisessa Amerikassa ja Aasiassa sekä Etelä-Afrikan tasavallassa) toteutettaviin
    hankkeisiin liittyvistä lainoista mahdollisesti aiheutuvien tappioiden varalta
    tehdyn päätöksen 97/256/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '98/348/CE: Decisione del Consiglio del 19 maggio 1998 concernente la concessione
    alla Banca europea per gli investimenti di una garanzia della Comunità in caso
    di perdite dovute a prestiti a favore di progetti realizzati nella ex Repubblica
    iugoslava di Macedonia e che modifica la decisione 97/256/CE che accorda alla
    Banca europea per gli investimenti una garanzia della Comunità in caso di perdite
    dovute a prestiti a favore di progetti realizzati al di fuori della Comunità
    (Europa centrale e orientale, Paesi mediterranei, America latina ed Asia, Sudafrica)'
  type: main
- language: nl
  script: Latn
  content: '98/348/EG: Besluit van de Raad van 19 mei 1998 tot verlening van een garantie
    van de Gemeenschap voor verliezen van de Europese Investeringsbank op leningen
    voor projecten in de voormalige Joegoslavische Republiek Macedonië, en tot wijziging
    van Besluit 97/256/EG tot verlening van een garantie van de Gemeenschap voor verliezen
    van de Europese Investeringsbank op leningen voor projecten buiten de Gemeenschap
    (landen in Midden- en Oost-Europa, mediterrane landen, landen in Azië en Latijns-Amerika,
    Zuid-Afrika)'
  type: main
- language: pt
  script: Latn
  content: '98/348/CE: Decisão do Conselho de 19 de Maio de 1998 que concede uma
    garantia da Comunidade ao Banco Europeu de Investimento em caso de perdas resultantes
    de empréstimos para projectos realizados na antiga República Jugoslava da Macedónia
    e que altera a Decisão 97/256/CE que concede uma garantia da Comunidade ao Banco
    Europeu de Investimento em caso de perdas resultantes de empréstimos para projectos
    realizados no exterior da Comunidade (países da Europa Central e Oriental, países
    mediterrânicos, países da América Latina e da Ásia e África do Sul)'
  type: main
- language: es
  script: Latn
  content: '98/348/CE: Decisión del Consejo de 19 de mayo de 1998 por la que se concede
    al Banco Europeo de Inversiones una garantía de la Comunidad para absorber las
    pérdidas que se deriven de préstamos para la realización de proyectos en la
    ex República yugoslava de Macedonia y por la que se modifica la Decisión 97/256/CE
    por la que se concede al Banco Europeo de Inversiones una garantía de la Comunidad
    para absorber las pérdidas que se deriven de préstamos para la realización
    de proyectos fuera de la Comunidad (Europa Central y Oriental, países mediterráneos,
    Asia, Latinoamérica y Sudáfrica)'
  type: main
- language: sv
  script: Latn
  content: '98/348/EG: Rådets beslut av den 19 maj 1998 om att bevilja Europeiska
    investeringsbanken en gemenskapsgaranti för att täcka förluster vid lån till
    projekt i F.d. jugoslaviska republiken Makedonien och om att ändra beslut 97/256/EG
    om beviljande av en gemenskapsgaranti för Europeiska investeringsbanken för
    att täcka förluster vid lån till projekt utanför gemenskapen (Länderna i
    Central- och Östeuropa, Medelhavsområdet, Latinamerika och Asien samt Sydafrika)'
