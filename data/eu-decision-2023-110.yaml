    lesknáčkem úlovým (Aethina tumida) v Itálii a Francii, a kterým se zrušuje
    prováděcí rozhodnutí (EU) 2021/597 (oznámeno pod číslem C(2023) 194) (Pouze
    francouzské a italské znění je závazné)
