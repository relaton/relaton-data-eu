    zur Festlegung von Sofortmaßnahmen im Zusammenhang mit bestätigten Fällen eines
    Befalls mit dem Kleinen Bienenbeutenkäfer (Aethina tumida) in Italien und Frankreich
    sowie zur Aufhebung des Durchführungsbeschlusses (EU) 2021/597 (Bekannt gegeben
    unter Aktenzeichen C(2023) 194) (Nur der französische und der italienische Text
    sind verbindlich)
  type: main
