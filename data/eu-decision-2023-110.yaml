    2023 de stabilire a unor măsuri de urgență în ceea ce privește cazurile confirmate
    de infestare cu gândacul mic de stup (Aethina tumida) în Italia și Franța
    și de abrogare a Deciziei de punere în aplicare (UE) 2021/597 [notificată cu
    numărul C(2023) 194] (Numai textele în limbile franceză și italiană sunt
    autentice)
  type: main
- language: sk
  script: Latn
