    hroščem (Aethina tumida) v Italiji in Franciji ter razveljavitvi Izvedbenega
    sklepa (EU) 2021/597 (notificirano pod dokumentarno številko C(2023) 194) (Besedilo
    v francoskem in italijanskem jeziku je edino verodostojno)
  type: main
