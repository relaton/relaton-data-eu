title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/110 of 12 January 2023 laying
    down emergency measures as regards confirmed cases of infestation with small hive
    beetle (Aethina tumida) in Italy and France and repealing Implementing Decision
    (EU) 2021/597 (notified under document C(2023) 194) (Only the French and Italian
    languages are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/110 de la Commission du 12 janvier 2023
    établissant des mesures d’urgence en ce qui concerne des cas confirmés d’infestation
    par le petit coléoptère des ruches (Aethina tumida) en Italie et en France et
    abrogeant la décision d’exécution (UE) 2021/597 [notifiée sous le numéro
    C(2023) 194] (Les textes en langues française et italienne sont les seuls faisant
    foi.)
  type: main
- language: de
  script: Latn
