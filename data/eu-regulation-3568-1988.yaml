title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3568/88 of 16 November 1988 abolishing the
    countervailing charge and re-establishing a preferential customs duty on imports
    of mandarins, including tangerines and satsumas, Wilkings and other similar hybrids
    with the exception of clementines originating in Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3568/88 de la Commission, du 16 novembre 1988, supprimant
    la taxe compensatoire et rétablissant le droit de douane préférentiel à l'importation
    de mandarines, y compris les tangerines et satsumas, wilkings et autres hybrides
    similaires d'agrumes, à l'exclusion des clémentines originaires de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3568/88 der Kommission vom 16. November 1988 zur Aufhebung
    der Ausgleichsabgabe und Wiedereinführung des Präferenzzolls bei der Einfuhr
    von Mandarinen, einschließlich Tangerinen und Satsumas, Wilkings und ähnlichen
    Kreuzungen von Zitrusfrüchten, ausgenommen Clementinen, mit Ursprung in der Türkei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3568/88 af 16. november 1988 om ophævelse
    af udligningsafgiften og genindførelse af præferencetoldsatsen ved indførsel
    af mandariner (herunder tangeriner og satsumas), wilkings og andre lignende krydsninger
    af citrusfrugter, bortset fra clementiner, med oprindelse i Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3568/88 της Επιτροπής
    της 16ης Νοεμβρίου 1988 περί καταργήσεως της εξισωτικής
    εισφοράς και επαναφοράς του προτιμησιακού
    δασμού κατά την εισαγωγή μανταρινιών, συμπεριλαμβανομένων
    των tangerines και satsumas, wilkings και άλλων παρομοίων
    υβριδίων εσπεριδοειδών, εκτός των κλημεντινών,
    προελεύσεως Τουρκίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3568/88 della Commissione, del 16 novembre 1988, che
    sopprime la tassa di compensazione e ripristina il dazio doganale preferenziale
    all'importazione di mandarini, compresi i tangerini e i mandarini satsuma (o sazuma),
    wilkings e altri simili ibridi di agrumi, escluse le clementine originari della
    Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3568/88 van de Commissie van 16 november 1988 houdende
    intrekking van de compenserende heffing en tot wederinstelling van het preferentiële
    douanerecht bij invoer van mandarijnen, tangerines en satsuma's daaronder begrepen,
    wilkings en andere dergelijke kruisingen van citrusvruchten, met uitzondering
    van clementines van oorsprong uit Turkije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3568/88 da Comissão, de 16 de Novembro de 1988,
    que suprime o direito de compensação e repõe o direito aduaneiro preferencial
    na importação de mandarinas, incluindo as tangerinas e satsumas, wilkings e
    outros citrinos híbridos semelhantes, com excepção das clementinas originários
    da Turquia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3568/88 de la Comisión, de 16 de noviembre de 1988,
    por el que se suprime el gravamen compensatorio y se restablece el derecho de
    aduana preferencial a la importación de mandarinas, incluidas las tangerinas
    y satsumas, wilkings y demás híbridos similares de agrios, con la exclusión
    de las clementinas originarias de Turquía
