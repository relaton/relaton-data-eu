title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1165/84 of 27 April 1984 specifying the
    extent to which applications lodged in April 1984 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1165/84 de la Commission, du 27 avril 1984, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1984 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1165/84 der Kommission vom 27. April 1984 über das
    Ausmaß, in dem den im April 1984 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1165/84 af 27. april 1984 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1984, for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1165/84 της Επιτροπής
    της 27ης Απριλίου 1984 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο του 1984, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1165/84 della Commissione, del 27 aprile 1984, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1984 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1165/84 van de Commissie van 27 april 1984 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 1984 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
