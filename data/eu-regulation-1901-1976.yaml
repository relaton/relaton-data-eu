title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1901/76 of 30 July 1976 fixing for the 1976/77
    marketing year in respect of trade within the Community the components designed
    to protect the rice and cereals processing industries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1901/76 de la Commission, du 30 juillet 1976, fixant,
    en ce qui concerne les échanges intracommunautaires pour la campagne de commercialisation
    1976/1977, les éléments destinés à assurer, dans le secteur des céréales
    et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1901/76 der Kommission vom 30. Juli 1976 zur Festsetzung
    des Bestandteils zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    für den innergemeinschaftlichen Handel im Wirtschaftsjahr 1976/1977
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1901/76 af 30. juli 1976 om fastsættelse
    for produktionsåret 1976/1977 - for handelen inden for Fællesskabet - af de
    elementer, der for korn og ris har til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1901/76 della Commissione, del 30 luglio 1976, che
    fissa, per quanto riguarda gli scambi intracomunitari nella campagna di commercializzazione
    1976/1977, gli elementi destinati ad assicurare la protezione dell'industria di
    trasformazione nel settore dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1901/76 van de Commissie van 30 juli 1976 tot vaststelling
    van de elementen die dienen om in het verkoopseizoen 1976/1977 in het intracommunautaire
    handelsverkeer in de sector granen en rijst de bescherming van de verwerkende
    industrie te verzekeren
  type: main
