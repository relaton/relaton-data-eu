    τελωνειακών δασμών για άνθη και καρπούς, τεχνητά,
    των κωδικών ΣΟ 6702 10 00 και 6702 90 00, καταγωγής Κίνας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3635/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
