    dei codici NC 6702 10 00 e 6702 90 00, originari della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2413/88 van de Commissie van 1 augustus 1988 houdende
