title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2413/88 of 1 August 1988 re-establishing
    the levying of customs duties on artificial flowers and fruit of CN codes 6702
    10 00 and 6702 90 00 originating in China to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2413/88 de la Commission du 1er août 1988 portant
    rétablissement de la perception des droits de douane applicables aux fleurs et
    fruits artificiels des codes NC 6702 10 00 et 6702 90 00 originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2413/88 der Kommission vom 1. August 1988 zur Wiedereinführung
    der Erhebung der Zölle für künstliche Blumen und Früchte der Unterpositionen
    6702 10 00 und 6702 90 00 der Kombinierten Nomenklatur mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2413/88 af 1. august 1988 om genindførelse
    af opkrævning af told for kunstige blomster og frugter, henhørende under KN-kode
    6702 10 00 og 6702 90 00 og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2413/88 της Επιτροπής
