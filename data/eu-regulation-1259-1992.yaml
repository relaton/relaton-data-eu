  content: Commission Regulation (EEC) No 1259/92 of 15 May 1992 fixing for the 1991/92
    marketing year the special levy applicable to imports of olive oil originating
    in Tunisia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1259/92 de la Commission du 15 mai 1992 fixant, pour
