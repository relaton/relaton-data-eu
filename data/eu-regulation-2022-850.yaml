    leictreonach sonraí i réimse an chomhair bhreithiúnaigh in ábhair sibhialta
    agus coiriúla (an córas e-CODEX), agus lena leasaítear Rialachán (AE) 2018/1726
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2022/850 Europskog parlamenta i Vijeća od 30. svibnja 2022.
