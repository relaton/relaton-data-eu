    tsiviil- ja kriminaalasjades tehtava õigusalase koostöö valdkonnas (e-CODEXi
    süsteem) ning millega muudetakse määrust (EL) 2018/1726
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2022/850, annettu 30 päivänä
    toukokuuta 2022, siviili- ja rikosoikeudellisissa asioissa tehtävän oikeudellisen
    yhteistyön alalla käytettävästä tietokoneistetusta rajatylittävän sähköisen
    tietojenvaihdon järjestelmästä (e-CODEX-järjestelmä) ja asetuksen (EU) 2018/1726
    muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2022/850 ó Pharlaimint na hEorpa agus ón gComhairle an
