    με ένα μηχανοργανωμένο σύστημα για τη διασυνοριακή
    ηλεκτρονική ανταλλαγή δεδομένων στον τομέα
    της δικαστικής συνεργασίας σε αστικές και
    ποινικές υποθέσεις (σύστημα e-CODEX), και για την
    τροποποίηση του κανονισμού (ΕΕ) 2018/1726
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2022/850, 30. mai 2022, milles
