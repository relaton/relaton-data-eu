  script: Latn
  content: Regulation (EU) 2022/850 of the European Parliament and of the Council
    of 30 May 2022 on a computerised system for the cross-border electronic exchange
    of data in the area of judicial cooperation in civil and criminal matters (e-CODEX
    system), and amending Regulation (EU) 2018/1726
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/850 du Parlement européen et du Conseil du 30 mai
    2022 relatif à un système informatisé pour l’échange électronique transfrontière
    de données dans le domaine de la coopération judiciaire en matière civile et
    pénale (système e-CODEX), et modifiant le règlement (UE) 2018/1726
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/850 des Europäischen Parlaments und des Rates vom
    30. Mai 2022 über ein EDV-System für den grenzüberschreitenden elektronischen
    Datenaustausch im Bereich der justiziellen Zusammenarbeit in Zivil- und Strafsachen
    (e-CODEX-System) und zur Änderung der Verordnung (EU) 2018/1726
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2022/850 на Европейския парламент
    и на Съвета от 30 май 2022 година относно компютризирана
    система за трансграничен електронен обмен
    на данни в областта на съдебното сътрудничество
    по гражданскоправни и наказателноправни въпроси
    (система e-CODEX) и за изменение на Регламент (ЕС)
    2018/1726
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2022/850 ze dne 30. května
    2022 o počítačovém systému pro přeshraniční elektronickou výměnu údajů
    v oblasti justiční spolupráce v občanských a trestních věcech (systém
    e-CODEX) a o změně nařízení (EU) 2018/1726
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/850 af 30. maj 2022
    om et IT-system til grænseoverskridende elektronisk udveksling af oplysninger
    på området civil- og strafferetligt samarbejde (e-CODEX-systemet) og om ændring
    af forordning (EU) 2018/1726
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2022/850 του Ευρωπαϊκού Κοινοβουλίου
