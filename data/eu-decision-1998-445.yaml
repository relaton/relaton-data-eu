    15 Ιουνίου 1995'
  type: main
- language: fi
  script: Latn
  content: '98/445/EY: Neuvoston päätös, tehty 14 päivänä huhtikuuta 1997, Euroopan
    yhteisön ja Georgian tasavallan välisen kirjeenvaihtona tehdyn sopimuksen tekemisestä
    Brysselissä 17 päivänä marraskuuta 1993 parafoidun, 15 päivänä kesäkuuta
