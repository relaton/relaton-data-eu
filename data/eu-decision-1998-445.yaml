title:
- language: en
  script: Latn
  content: '98/445/EC: Council Decision of 14 April 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters between the European Community and the Republic
    of Georgia maintaining in force the Agreement between the European Economic Community
    and the Republic of Georgia on trade in textile products initialled in Brussels
    on 17 November 1993 as amended by an Agreement in the form of an Exchange of Letters
    initialled on 15 June 1995'
  type: main
- language: fr
  script: Latn
  content: '98/445/CE: Décision du Conseil du 14 avril 1997 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté européenne
    et la République de Géorgie concernant le maintien en vigueur de l''accord entre
    la Communauté économique européenne et la République de Géorgie sur le commerce
    des produits textiles paraphé à Bruxelles le 17 novembre 1993 et modifié par
    un accord sous forme d''échange de lettres paraphé le 15 juin 1995'
  type: main
- language: de
  script: Latn
  content: '98/445/EG: Beschluss des Rates vom 14. April 1997 über den Abschluß
    eines Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
    und der Republik Georgien zur Verlängerung des am 17. November 1993 in Brüssel
    paraphierten und durch das am 15. Juni 1995 paraphierte Abkommen in Form eines
    Briefwechsels geänderten Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Republik Georgien über den Handel mit Textilwaren'
  type: main
- language: da
  script: Latn
  content: '98/445/EF: Rådets afgørelse af 14. april 1997 om indgåelse af en aftale
    i form af brevveksling mellem Det Europæiske Fællesskab og Republikken Georgien
    om videreførelse af den aftale mellem Det Europæiske Økonomiske Fællesskab
    og Republikken Georgien om handel med tekstilvarer, som paraferedes den 17. november
    1993 i Bruxelles, som ændret ved den aftale i form af brevveksling, som paraferedes
    den 15. juni 1995'
  type: main
- language: el
  script: Grek
  content: '98/445/ΕΚ: Απόφαση του Συμβουλίου της 14ης
    Απριλίου 1997 σχετικά με τη σύναψη συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Κοινότητας και της Δημοκρατίας
    της Γεωργίας για τη διατήρηση σε ισχύ της συμφωνίας
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της Δημοκρατίας της Γεωργίας σχετικά με
