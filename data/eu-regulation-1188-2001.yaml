    all'intervento per la 269a gara parziale effettuata nel quadro delle misure generali
    d'intervento conformemente al regolamento (CEE) n. 1627/89 e (CE) n. 1136/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1188/2001 van de Commissie van 15 juni 2001 tot vaststelling
