    d'intervention conformément aux règlements (CEE) n° 1627/89 et (CE) n° 1136/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1188/2001 der Kommission vom 15. Juni 2001 zur Festsetzung
