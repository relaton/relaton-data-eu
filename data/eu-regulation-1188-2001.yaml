    im Rahmen der 269. Teilausschreibung der allgemeinen Interventionsmaßnahmen gemäß
    den Verordnungen (EWG) Nr. 1627/89 und (EG) Nr. 1136/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1188/2001 af 15. juni 2001 om fastsættelse
