title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1188/2001 of 15 June 2001 fixing the maximum
    buying-in price and the quantities of beef to be bought in under the 269th partial
    invitation to tender as a general intervention measure pursuant to Regulations
    (EEC) No 1627/89 and (EC) No 1136/2001
  type: main
- language: fr
  script: Latn
