    reguliavimo standartais, kuriais nustatomi kriterijai, į kuriuos reikia atsižvelgti
    formuojant investicinių įmonių pavedimų vykdymo politiką ir vertinant jos
    veiksmingumą, ir panaikinami Komisijos deleguotieji reglamentai (ES) 2017/575
    ir (ES) 2017/576
  type: main
