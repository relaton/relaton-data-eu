    regulačné technické predpisy, ktorými sa spresňujú kritériá, ktoré sa
    majú zohľadniť pri stanovovaní a posudzovaní účinnosti politík investičných
    spoločností v oblasti vykonávania pokynov, a ktorým sa zrušujú delegované
