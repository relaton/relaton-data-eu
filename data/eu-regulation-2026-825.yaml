    sijoituspalveluyritysten toimeksiantojen toteuttamisperiaatteiden laatimisessa
    ja niiden toimivuuden arvioinnissa huomioon otettavia perusteita koskevilla teknisillä
    sääntelystandardeilla sekä komission delegoitujen asetusten (EU) 2017/575 ja
