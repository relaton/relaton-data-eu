    regulatīvajiem tehniskajiem standartiem, kuros precizēti kritēriji, kas jāņem
    vērā, nosakot un izvērtējot ieguldījumu brokeru sabiedrību rīkojumu izpildes
    politikas efektivitāti, un atceļ Komisijas Deleģētās regulas (ES) 2017/575
    un (ES) 2017/576
  type: main
- language: lt
  script: Latn
