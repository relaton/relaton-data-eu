    Direktive 2014/65/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se određuju kriteriji koje treba uzeti u obzir pri utvrđivanju
    i procjeni učinkovitosti politika izvršavanja naloga investicijskih društava
    i o stavljanju izvan snage delegiranih uredaba Komisije (EU) 2017/575 i (EU) 2017/576
  type: main
- language: hu
  script: Latn
