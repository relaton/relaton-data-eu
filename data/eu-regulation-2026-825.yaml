  script: Latn
  content: Regolamento delegato (UE) 2026/825 della Commissione, del 14 aprile 2026,
    che integra la direttiva 2014/65/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che specificano i criteri
    di cui tenere conto per stabilire e valutare l’efficacia delle strategie di
    esecuzione degli ordini delle imprese di investimento e che abroga i regolamenti
    delegati (UE) 2017/575 e (UE) 2017/576 della Commissione
  type: main
