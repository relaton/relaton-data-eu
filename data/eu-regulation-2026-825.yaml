title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/825 of 14 April 2026 supplementing
    Directive 2014/65/EU of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the criteria to be taken into account
    in establishing and assessing the effectiveness of order execution policies of
    investment firms and repealing Commission Delegated Regulations (EU) 2017/575
    and (EU) 2017/576
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/825 de la Commission du 14 avril 2026 complétant
    la directive 2014/65/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation précisant les critères à prendre en considération par les
    entreprises d’investissement pour déterminer leur politique d’exécution
    des ordres et en évaluer l’efficacité et abrogeant les règlements délégués
    (UE) 2017/575 et (UE) 2017/576 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/825 der Kommission vom 14. April 2026 zur
    Ergänzung der Richtlinie 2014/65/EU des Europäischen Parlaments und des Rates
    durch technische Regulierungsstandards zur Festlegung der Kriterien, die bei der
    Festlegung und Bewertung der Wirksamkeit der Grundsätze der Auftragsausführung
    von Wertpapierfirmen zu berücksichtigen sind, und zur Aufhebung der Delegierten
    Verordnungen (EU) 2017/575 und (EU) 2017/576 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2026/825 на Комисията
    от 14 април 2026 година за допълнение на Директива
    2014/65/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на критериите, които трябва да
    се вземат предвид при установяването и оценката
    на ефективността на политиките на инвестиционните
    посредници за изпълнение на нарежданията,
    и за отмяна на делегирани регламенти (ЕС) 2017/575
    и (ЕС) 2017/576 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2026/825 ze dne 14. dubna
    2026, kterým se doplňuje směrnice Evropského parlamentu a Rady 2014/65/EU,
    pokud jde o regulační technické normy upřesňující kritéria, jež mají
    být brána v úvahu pro účely stanovení a posouzení účinnosti zásad investičních
    podniků pro provádění pokynů, a kterým se zrušují nařízení Komise v
    přenesené pravomoci (EU) 2017/575 a (EU) 2017/576
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2026/825 af 14. april 2026 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2014/65/EU for
    så vidt angår reguleringsmæssige tekniske standarder, der præciserer de kriterier,
    der skal tages hensyn til ved fastlæggelsen og vurderingen af, om investeringsselskabers
    ordreudførelsespolitikker fungerer efter hensigten, og om ophævelse af Kommissionens
    delegerede forordning (EU) 2017/575 og (EU) 2017/576
  type: main
- language: el
  script: Grek
