- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2133 of 13 October 2023 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 89034 × 1507 × MIR162 × NK603 × DAS-40278-9
