title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 décembre 1967, fixant le montant d'un
    acompte à valoir sur le concours du FEOGA aux dépenses de la République fédérale
    d'Allemagne, remboursables au titre de la section garantie pour la période de
    comptabilisation 1965/1966
  type: main
- language: de
  script: Latn
  content: '68/26/EWG: Entscheidung der Kommission vom 15. Dezember 1967 zur Festsetzung
    des Betrages einer Abschlagszahlung auf die Beteiligung des EAGFL an den für
    eine Rückvergütung durch die Abteilung Garantie für den Verbuchungszeitraum
    1965/1966 in Betracht kommenden Ausgaben der Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '68/26/CEE: Decisione della Commissione, del 15 dicembre 1967, che fissa
    un acconto sul contributo del FEAOG alle spese della Repubblica federale di Germania,
    rimborsabili dalla sezione garanzia per il periodo di contabilizzazione 1965/1966'
  type: main
- language: nl
  script: Latn
  content: '68/26/EEG: Beschikking van de Commissie van 15 december 1967 tot vaststelling
    van een voorschot op de uitkeringen van het EOGFL in verband met de uitgaven van
    de Bondsrepubliek Duitsland welke in het kader van de afdeling Garantie voor de
    berekeningsperiode 1965/1966 voor vergoeding in aanmerking komen'
  type: main
