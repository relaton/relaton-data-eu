title:
- language: en
  script: Latn
  content: Commission Directive 97/18/EC of 17 April 1997 postponing the date after
    which animal tests are prohibited for ingredients or combinations of ingredients
    of cosmetic products
  type: main
- language: fr
  script: Latn
  content: Directive 97/18/CE de la Commission du 17 avril 1997 reportant la date
    à partir de laquelle des expérimentations sur animaux sont interdites pour des
    ingrédients ou des combinaisons d'ingrédients de produits cosmétiques
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/18/EG der Kommission vom 17. April 1997 zur Verschiebung
    des Termins, von dem an Tierversuche für Bestandteile oder Kombinationen von
    Bestandteilen kosmetischer Mittel untersagt sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Direktiv 97/18/EF af 17. april 1997 om udsættelse af datoen
    for forbud mod afprøvning af kosmetiske midlers bestanddele eller forbindelser
    heraf på dyr
  type: main
- language: el
  script: Grek
  content: Οδηγία 97/18/ΕΚ της Επιτροπής της 17ης Απριλίου
    1997 για τη μετάθεση της ημερομηνίας έναρξης
    της απαγόρευσης των πειραμάτων σε ζώα με συστατικά
    ή συνδυασμούς συστατικών καλλυντικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 97/18/EY, annettu 17 päivänä huhtikuuta 1997, sen
    määräajan lykkäämisestä, jonka jälkeen on kiellettyä käyttää eläinkokeita
    kosmeettisten valmisteiden ainesosien tai niiden yhdistelmien testaamiseen
  type: main
- language: it
  script: Latn
  content: Direttiva 97/18/CE della Commissione del 17 aprile 1997 che rinvia la data
    a partire dalla quale sono vietate le sperimentazioni su animali di ingredienti
    o combinazioni di ingredienti di prodotti cosmetici
  type: main
- language: nl
  script: Latn
  content: Richtlijn 97/18/EG van de Commissie van 17 april 1997 tot uitstel van de
    ingangsdatum voor het verbod op dierproeven met ingrediënten of combinaties van
    ingrediënten van cosmetische producten
  type: main
- language: pt
  script: Latn
  content: Directiva 97/18/CE da Comissão de 17 de Abril de 1997 que posterga a data
    a partir da qual são proibidos os testes em animais relativamente a ingredientes
    ou combinações de ingredientes para produtos cosméticos
  type: main
- language: es
  script: Latn
  content: Directiva 97/18/CE de la Comisión de 17 de abril de 1997 por la que se
    aplaza la fecha a partir de la cual quedan prohibidos los experimentos con animales
    para ingredientes o combinaciones de ingredientes de productos cosméticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 97/18/EG av den 17 april 1997 om att skjuta upp
    det datum efter vilket det skall vara förbjudet att i djurförsök utprova beståndsdelar
    och sammansättningar av beståndsdelar som ingår i kosmetiska produkter.
  type: main
