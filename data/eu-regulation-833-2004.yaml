  content: Commission Regulation (EC) No 833/2004 of 26 March 2004 amending Commission
    Regulation (EC) No 449/2000 imposing a provisional anti-dumping duty on imports
    of malleable cast iron tube or pipe fittings originating in Brazil, the Czech
    Republic, Japan, the People's Republic of China, the Republic of Korea and Thailand
    and accepting an undertaking offered by an exporting producer in the Czech Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 833/2004 de la Commission du 26 mars 2004 modifiant
    le règlement (CE) n° 449/2000 de la Commission du 28 février 2000 instituant
    un droit antidumping provisoire sur les importations d'accessoires de tuyauterie
    en fonte malléable originaires du Brésil, de la République tchèque, du Japon,
    de la République populaire de Chine, de la République de Corée et de Thaïlande
    et portant acceptation d'un engagement offert par un producteur-exportateur en
    République tchèque
