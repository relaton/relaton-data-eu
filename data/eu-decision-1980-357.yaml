title:
- language: en
  script: Latn
  content: '80/357/EEC: Commission Decision of 10 March 1980 authorizing the United
    Kingdom not to apply Community treatment to men''s and boys''woven industrial
    and occupational clothing; women''s, girls''and infants''woven aprons, smock-overalls
    and other industrial and occupational clothing (whether or not also suitable for
    domestic use) falling within subheadings ex 61.01 B and ex 61.02 B of the Common
    Customs Tariff (category 76), originating in Bulgaria and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/357/CEE: Décision de la Commission, du 10 mars 1980, autorisant le
    Royaume-Uni à exclure du traitement communautaire les vêtements de travail tissés
    pour hommes et garçonnets, les tabliers, blouses et autres vêtements de travail
    tissés pour femmes, fillettes et jeunes enfants, des sous-positions ex 61.01
    B et ex 61.02 B du tarif douanier commun (catégorie 76), originaires de Bulgarie
    et mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/357/EWG: Entscheidung der Kommission vom 10. März 1980, mit der das
    Vereinigte Königreich ermächtigt wird, aus Bulgarien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Arbeits- und Berufskleidung aus
    Geweben, für Männer und Knaben ; Schürzen, Kittel und andere Arbeits- und Berufskleidung,
    aus Geweben, für Frauen, Mädchen und Kleinkinder der Tarifstellen ex 61.01 B
    und ex 61.02 B des Gemeinsamen Zolltarifs, Kategorie 76, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/357/EØF: Kommissionens beslutning af 10. marts 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage arbejds- og
    beskyttelsesbeklædning, vævet, til mænd og drenge ; kitler og forklæder samt
    anden arbejds- og beskyttelsesbeklædning, vævet, til kvinder, piger og småbørn,
    som henhører under pos. ex 61.01 B og ex 61.02 B i den fælles toldtarif (kategori
    76), har oprindelse i Bulgarien og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/357/CEE: Decisione della Commissione, del 10 marzo 1980, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario indumenti da lavoro, tessuti,
    per uomo e per ragazzo, grembiuli, camiciotti e altri indumenti da lavoro, tessuti,
    per donna, per ragazza e per bambini, delle sottovoci ex 61.01 B e ex 61.02 B
    della tariffa doganale comune, categoria 76, originari della Bulgaria e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/357/EEG: Beschikking van de Commissie van 10 maart 1980 waarbij het
    Verenigd Koninkrijk wordt gemachtigd geweven werk- en bedrijfskleding voor heren
    en jongens, geweven schorten, stofjassen en andere werk- en bedrijfskleding voor
    dames, meisjes en kinderen van de posten ex 61.01 B en ex 61.02 B van het gemeenschappelijk
    douanetarief (categorie 76), van oorsprong uit Bulgarije en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
