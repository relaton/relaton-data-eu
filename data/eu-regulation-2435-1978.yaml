title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2435/78 of 18 October 1978 re-establishing
    the levying of customs duties on other nitrated and nitrosated derivatives, falling
    within subheading 29.07 C III, originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2435/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres dérivés
    nitrés et nitrosés de la sous-position tarifaire 29.07 C III, originaires de
    Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2435/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr andere Nitro- und Nitrosoderivate der Tarifstelle 29.07 C
    III, mit Ursprung in Rumánien, dem die in der Verordnung (EWG) Nr. 2705/77 des
    Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2435/78 af 18. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for andre nitro- og nitrosoderivater, under underposition
    29.07 C III, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2435/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli altri derivati alogenati,
    solfonati, nitrati, della sottovoce 29.07 C III della tariffa doganale comune,
    originari della Romania beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2435/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere nitro-
    en nitrosoderivaten, van onderverdeling 29.07 C III, van oorsprong uit Roemenië
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
