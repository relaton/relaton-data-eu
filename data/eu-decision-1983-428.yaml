title:
- language: en
  script: Latn
  content: '83/428/EEC: Commission Decision of 26 August 1983 accepting an undertaking
    given in connection with the anti-dumping proceeding concerning imports of caravans
    for camping and parts thereof originating in Yugoslavia and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '83/428/CEE: Décision de la Commission du 26 août 1983 portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure anti-dumping concernant
    les importations de caravanes de camping et de leurs parties et pièces détachées
    originaires de Yougoslavie et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '83/428/EWG: Beschluß der Kommission vom 26. August 1983 über die Annahme
    einer Verpflichtung im Zusammenhang mit dem Antidumpingverfahren betreffend Einfuhren
    von Camping-Wohnanhängern und Teilen davon mit Ursprung in Jugoslawien sowie
    zur Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '83/428/EØF: Kommissionens afgørelse af 26. august 1983 om godtgørelse
    af tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende importen
    af campingvogne og dele dertil med oprindelse i Jugoslavien og om afslutning af
    proceduren'
  type: main
- language: el
  script: Grek
  content: '83/428/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Αυγούστου 1983 για την αποδοχή των υποχρεώσεων
    που έχουν αναληφθεί στο πλαίσιο της διαδικασίας
    αντιντάνπινγκ σχετικά με τις εισαγωγές οχημάτων
    για κατασκήνωση τύπου Caravan και μερών αυτών,
    καταγωγής Γιουγκοσλαβίας, και για την περάτωση
    της διαδικασίας αυτής'
  type: main
- language: it
  script: Latn
  content: '83/428/CEE: Decisione della Commissione del 26 agosto 1983 che accetta
    un impegno assunto nell'' ambito della procedura antidumping riguardante le importazioni
    di veicoli da campeggio tipo "caravan", nonché le relative parti ed i pezzi staccati,
    originari della Iugoslavia, e che chiude detta procedura'
  type: main
- language: nl
  script: Latn
  content: '83/428/EEG: Besluit van de Commissie van 26 augustus 1983 houdende aanvaarding
