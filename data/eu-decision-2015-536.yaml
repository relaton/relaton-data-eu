title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/536 of 27 March 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for the United States in
    the list of third countries or parts thereof from which the introduction of meat
    products and treated stomachs, bladders and intestines into the Union is authorised
    in relation to further outbreaks of highly pathogenic avian influenza in that
    country (notified under document C(2015) 1990)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/536 de la Commission du 27 mars 2015 modifiant
    l'annexe II de la décision 2007/777/CE en ce qui concerne la ligne relative aux
    États-Unis sur la liste des pays tiers ou parties de pays tiers à partir desquels
    l'introduction dans l'Union de produits à base de viande et d'estomacs, de vessies
    et de boyaux traités est autorisée, à la suite de l'apparition de nouveaux
    foyers d'influenza aviaire hautement pathogène dans ce pays [notifiée sous le
    numéro C(2015) 1990]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/536 der Kommission vom 27. März 2015
