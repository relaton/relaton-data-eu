    Eintrags zu den Vereinigten Staaten in der Liste der Drittländer bzw. Teile von
    Drittländern, aus denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen,
    Blasen und Därmen in die Union gestattet ist, im Zusammenhang mit weiteren Ausbrüchen
    der hochpathogenen aviären Influenza in diesem Land (Bekanntgegeben unter Aktenzeichen
    C(2015) 1990)
  type: main
