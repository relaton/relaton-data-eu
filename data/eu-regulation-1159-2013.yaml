    parlamenti és tanácsi rendeletnek a GMES-felhasználókra vonatkozó nyilvántartásbavételi
    és engedélyezési feltételek és a különös GMES-adatokhoz és a GMES-szolgáltatásokból
    származó információkhoz való hozzáférés korlátozására vonatkozó kritériumok
    meghatározása révén történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 1159/2013 della Commissione, del 12 luglio
    2013 , che completa il regolamento (UE) n. 911/2010 del Parlamento europeo e del
