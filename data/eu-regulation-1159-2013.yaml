title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 1159/2013 of 12 July 2013 supplementing
    Regulation (EU) No 911/2010 of the European Parliament and of the Council on the
    European Earth monitoring programme (GMES) by establishing registration and licensing
    conditions for GMES users and defining criteria for restricting access to GMES
    dedicated data and GMES service information
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 1159/2013 de la Commission du 12 juillet
    2013 complétant le règlement (UE) n ° 911/2010 du Parlement européen et du
    Conseil concernant le programme européen de surveillance de la Terre (GMES) par
    l’établissement de conditions d’enregistrement et d’octroi de licences
    pour les utilisateurs GMES et par la définition des critères applicables aux
    restrictions d’accès aux données GMES dédiées et aux informations des services
    GMES
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 1159/2013 der Kommission vom 12. Juli 2013
    zur Ergänzung der Verordnung (EU) Nr. 911/2010 des Europäischen Parlaments und
    des Rates über das Europäische Erdbeobachtungsprogramm (GMES) durch die Festlegung
    von Registrierungs- und Lizenzierungsbedingungen für GMES-Nutzer und von Kriterien
    für die Einschränkung des Zugangs zu GMES-spezifischen Daten und Informationen
    der GMES-Dienste
  type: main
- language: bg
  script: Cyrl
