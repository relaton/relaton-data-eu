title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3682/83 of 22 December 1983 on fishing activities,
    other than fishing for herring in the North Sea, in waters under the sovereignty
    or jurisdiction of the Member States, adopted provisionally pending the fixing
    of total allowable catches (TACs) and quotas for 1984
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3682/83 du Conseil du 22 décembre 1983 relatif aux
    activités de pêche, à l' exception de la pêche au hareng en mer du Nord, exercées
    dans les eaux relevant de la souveraineté ou de la juridiction des États membres,
    et adopté à titre provisoire dans l' attente de la fixation des totaux admissibles
    des captures (tac) et quotas pour l' année 1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3682/83 des Rates vom 22. Dezember 1983 über die
    Fischerei - mit Ausnahme der Heringsfischerei in der Nordsee - in den der Hoheitsgewalt
    oder Gerichtsbarkeit der Mitgliedstaaten unterstehenden Gewässern mit vorläufiger
    Geltungsdauer bis zur Festlegung der zulässigen Gesamtfangmengen und der Quoten
    für 1984
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3682/83 af 22. december 1983 vedrørende
    det fiskeri, undtagen sildefiskeri i Nordsøen, i farvande, der hører under medlemsstaternes
    højhedsområde eller jurisdiktion, som er vedtaget foreløbigt, indtil de samlede
    tilladte fangstmængder (TAC) og kvoterne for 1984 er fastsat
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3682/83 του Συμβουλίου
    της 22ας Δεκεμβρίου 1983 για τις αλιευτικές δραστηριότητες,
    εκτός της αλιείας της ρέγγας στη Βόρεια Θάλασσα,
    που ασκούνται σε ύδατα υπό την κυριαρχία και
    τη δικαιοδοσία των κρατών μελών, εκδιδόμενος
    προσωρινά εν αναμονή του καθορισμού των συνόλων
    επιτρεπομένων αλιευμάτων (TAC) και των ποσοστώσεων
    για το 1984
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3682/83 del Consiglio del 22 dicembre 1983 relativo
    all' attività di pesca, tranne la pesca dell' aringa nel Mare del Nord, nelle
    acque sottoposte alla sovranità o alla giurisdizione degli Stati membri, adottato
    a titolo provvisorio in attesa della fissazione dei totali ammissibili di cattura
    (TAC) e dei contingenti per l' anno 1984
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3682/83 van de Raad van 22 december 1983 betreffende
    een tijdelijke regeling voor de visserijactiviteiten in de onder de soevereiniteit
    of de jurisdictie van de Lid-Staten vallende wateren, met uitzondering van de
    haringvisserij in de Noordzee, in afwachting van de vaststelling van de totaal
    toegestane vangsten (TAC' s) en quota voor 1984
  type: main
