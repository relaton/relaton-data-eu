  script: Latn
  content: '2009/560/EC: Commission Decision of 22 July 2009 approving certain amended
    programmes for the eradication and monitoring of animal diseases and zoonoses
    for the year 2009 and amending Decision 2008/897/EC as regards the Community’s
    financial contribution to certain Member States for programmes approved by that
    Decision (notified under document number C(2009) 5475)'
  type: main
- language: fr
  script: Latn
