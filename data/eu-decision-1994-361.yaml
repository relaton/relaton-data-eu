  content: '94/361/EC: Commission Decision of 24 June 1994 authorizing Portugal to
    import from third countries at a reduced levy certain quantities of raw sugar
    during the period 1 July 1994 to 28 February 1995 (Only the Portuguese text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/361/CE: Décision de la Commission du 24 juin 1994 autorisant le Portugal
