    nationales visant à prévenir l''introduction de l''herpès virus de l''huître
    1 μνar (OsHV-1 μνar) dans certaines régions d''Irlande et du Royaume-Uni
    [notifiée sous le numéro C(2014) 2763]'
  type: main
- language: de
  script: Latn
