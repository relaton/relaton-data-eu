title:
- language: en
  script: Latn
  content: '2014/250/EU: Commission Implementing Decision of 29 April 2014 amending
    Decision 2010/221/EU as regards the approval of national measures for preventing
    the introduction of ostreid herpesvirus 1 μvar (OsHV-1 μVar) into certain areas
    of Ireland and the United Kingdom (notified under document C(2014) 2763)'
  type: main
- language: fr
  script: Latn
  content: '2014/250/UE: Décision d''Exécution de la Commission du 29 avril 2014
