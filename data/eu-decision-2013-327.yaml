  script: Latn
  content: '2013/327/EU: Commission Implementing Decision of 25 June 2013 authorising
    the placing on the market of food containing or consisting of genetically modified
    oilseed rape Ms8, Rf3 and Ms8 × Rf3, or food and feed produced from those genetically
    modified organisms pursuant to Regulation (EC) No 1829/2003 of the European Parliament
    and of the Council (notified under document C(2013) 3873)'
  type: main
- language: fr
