title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2932/78 of 13 December 1978 enabling short-term
    private storage contracts to be concluded for table wines closely related economically
    to the A I type of table wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2932/78 de la Commission, du 13 décembre 1978, étendant
    la possibilité de conclure des contrats de stockage privé à court terme aux
    vins de table se trouvant dans une relation économique étroite avec les vins
    de table du type A I
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2932/78 der Kommission vom 13. Dezember 1978 zur Ausdehnung
    der Möglichkeit des Abschlusses von Verträgen für die kurzfristige private
    Lagerhaltung auf Tafelweine, die in engem wirtschaftlichem Zusammenhang mit den
    Tafelweinen der Art A I stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2932/78 af 13. december 1978 om udvidelse
    af muligheden for at indgå kontrakter om privat oplagring på kort sigt af bordvin,
    der står i nær økonomisk forbindelse med bordvin af type A I
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2932/78 della Commissione, del 13 dicembre 1978, che
    estende la possibilità di concludere contratti di magazzinaggio privato a breve
    termine per i vini da tavola che si trovano in stretta relazione economica coi
    vini da tavola del tipo A I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2932/78 van de Commissie van 13 december 1978 tot
    uitbreiding van de mogelijkheid om kortlopende contracten te sluiten voor de particuliere
    opslag van tafelwijn die in nauw economisch verband staat met tafelwijn van soort
    A I
  type: main
