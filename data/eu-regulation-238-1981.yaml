title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 238/81 of 27 January 1981 determining the
    amounts of the variable components, accession compensatory amounts and additional
    duties applicable from 1 February to 30 April 1981 on the importation into the
    Community of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 238/81 de la Commission, du 27 janvier 1981, déterminant
    les montants des éléments mobiles et les montants compensatoires «adhésion»,
    ainsi que les droits additionnels applicables pendant la période du 1er février
    au 30 avril 1981 à l'importation dans la Communauté des marchandises relevant
    du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 238/81 der Kommission vom 27. Januar 1981 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1981 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    geltenden beweglichen Teilbeträge, Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 238/81 af 27. januar 1981 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for perioden fra den 1. februar til den 30. april 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 238/81 της Επιτροπής
    της 27ης Ιανουαρίου 1981 περί καθορισμού των ποσών
    των κινητών στοιχείων και των εξισωτικών ποσών
    προσχωρήσεως καθώς και των πρόσθετων δασμών
    πού εφαρμόζονται κατά την περίοδο από 1ης Φεβρουαρίου
    μέχρι και 30ής Απριλίου 1981 κατά την εισαγωγή
    στην Κοινότητα εμπορευμάτων πού υπάγονται
    στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 238/81 della Commissione, del 27 gennaio 1981, che
    determina gli importi degli elementi mobili e gli importi compensativi adesione,
    nonché i dazi addizionali applicabili all'importazione nella Comunità, per il
    periodo dal 1 febbraio al 30 aprile 1981, delle merci cui si applica il regolamento
    (CEE) n. 3033/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 238/81 van de Commissie van 27 januari 1981 tot vaststelling
    van het beloop der van 1 februari tot en met 30 april 1981 bij invoer in de Gemeenschap
    van onder Verordening (EEG) nr. 3033/80 vallende goederen toe te passen variabele
    elementen, compenserende bedragen "toetreding" en aanvullende invoerrechten
