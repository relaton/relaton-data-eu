---
id: EUDecision1973145
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 May 1973 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of raw silk falling within heading
    No ex 50.09 of the Common Customs Tariff, originating in the People's Republic
    of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission 73/145/CEE, du 23 mai 1973, autorisant la République
    italienne à exclure du traitement communautaire les tissus de soie grège, de
    la position Ex 50.09 du Tarif douanier commun, originaires de la République populaire
    de Chine et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Mai 1973, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Rohseide der Tarifnummer
    ex 50.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. maj 1973 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage stoffer af råsilke, som henhører
    under position ex 50.09 i den fælles toldtarif, har oprindelse i folkerepublikken
    Kina og overgår til fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 maggio 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di seta greggia, della
    voce n. ex 50.09 della tariffa doganale comune, originari della Repubblica popolare
    cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 mei 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels uit ruwe zijde, van post ex 50.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
