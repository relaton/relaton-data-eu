title:
- language: en
  script: Latn
  content: '81/489/EEC: Commission Decision of 11 May 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to cotton yarn originating in the People''s Republic
    of China (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/489/CEE: Décision de la Commission, du 11 mai 1981, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les fils de coton non conditionnés pour
    la vente au détail, originaires de la République populaire de Chine (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/489/EWG: Entscheidung der Kommission vom 11. Mai 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus der Volksrepublik China stammende Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf von der Gemeinschaftsbehandlung auszuschließen (Nur der
    französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/489/EØF: Kommissionens beslutning af 11. maj 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage garn af bomuld, ikke i detailsalgsoplægninger,
    med oprindelse i Den kinesiske Folkerepublik (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/489/ΕΟΚ: Απόφαση τής Επιτροπής τής 11ης
    Μαΐου 1981 βάσει τής οποίας εξουσιοδοτούνται
    τό Βασίλειο τού Βελγίου, τό Μεγάλο Δουκάτο
    τού Λουξεμβούργου καί τό Βασίλειο τών Κάτω
    Χωρών νά εξαιρέσουν από τήν κοινοτική μεταχείριση
    τά νήματα εκ βάμβακος μή συσκευασμένα γιά τή
    λιανική πώληση, καταγωγής Λαϊκής Δημοκρατίας
    τής Κίνας (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/489/CEE: Decisione della Commissione, dell''11 maggio 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i filati di cotone non preparati per
    la vendita al minuto originari della Repubblica popolare cinese (Il testi in lingua
    francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/489/EEG: Beschikking van de Commissie van 11 mei 1981 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden om garens van katoen, niet gereed voor de verkoop in het klein, van
    oorsprong uit de Volksrepubliek China van de communautaire behandeling uit te
    sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
