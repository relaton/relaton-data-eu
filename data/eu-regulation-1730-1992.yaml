  content: Commission Regulation (EEC) No 1730/92 of 30 June 1992 determining for
    the period 1 July 1992 to 28 February 1993 the quantities of raw sugar produced
    in the French overseas departments on which the refining aid specified in Council
    Regulation (EEC) No 225/86 may be granted, and amending Regulation (EEC) No 2750/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1730/92 de la Commission du 30 juin 1992 déterminant
    pour la période du 1er juillet 1992 au 28 février 1993, les quantités de sucre
    brut produites dans les départements français d'outre-mer bénéficiant de l'aide
    au raffinage visée au règlement (CEE) n° 2225/86 du Conseil et modifiant le
    règlement (CEE) n° 2750/86
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1730/92 DER KOMMISSION vom 30. Juni 1992 zur Bestimmung
    der in den französischen überseeischen Departements mit der Raffinationsbeihilfe
    gemäß der Verordnung (EWG) Nr. 2225/86 erzeugten Rohzuckermengen für die Zeit
    vom 1. Juli 1992 bis 28. Februar 1993 und zur Änderung der Verordnung (EWG) Nr.
    2750/86 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1730/92 af 30. juni 1992 om fastsættelse
