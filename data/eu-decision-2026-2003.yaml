title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/2003 of 4 September 2026 amending
    Implementing Decision (EU) 2022/2191 as regards harmonised standards for radiodetermination
    equipment for location tracking applications, cellular communication base station,
    ultra-wide band devices, material sensing devices, fixed radio systems, tank level
    probing radar equipment, amplifiers, active antennas, air traffic control sensors,
    and other radio equipment, and correcting Implementing Decision (EU) 2025/2499
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/2003 de la Commission du 4 septembre
    2026 modifiant la décision d’exécution (UE) 2022/2191 en ce qui concerne les
    normes harmonisées relatives aux équipements de radiorepérage pour les applications
    de localisation, les stations de base de communication cellulaire, les dispositifs
    à bande ultralarge, les dispositifs de détection de matériaux, les systèmes
    radioélectriques fixes, les équipements de niveaumétrie de cuve, les amplificateurs,
    les antennes actives, les capteurs de contrôle de la circulation aérienne et
    d’autres équipements radioélectriques, et rectifiant la décision d’exécution
    (UE) 2025/2499
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/2003 der Kommission vom 4. September
    2026 zur Änderung des Durchführungsbeschlusses (EU) 2022/2191 hinsichtlich harmonisierter
    Normen für Funkortungsgeräte für Ortungsanwendungen, Basisstationen für die
    zellulare Kommunikation, Ultraweitbandgeräte, Geräte zur Untersuchung von Materialien,
    feste Funksysteme, Geräte zur Sondierung des Füllstands von Tanks, Verstärker,
    aktive Antennen, Anlagen der Flugverkehrskontrolle und andere Funkanlagen sowie
    zur Berichtigung des Durchführungsbeschlusses (EU) 2025/2499
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/2003 на Комисията
    от 4 септември 2026 година за изменение на Решение
    за изпълнение (ЕС) 2022/2191 по отношение на хармонизираните
    стандарти за оборудването за радиоопределяне
    за приложения за проследяване на местоположение,
    базовите станции за клетъчни връзки, свръхшироколентовите
    устройства, чувствителните към материя устройства,
    фиксираните радиосистеми, съоръженията за
    радарно определяне на ниво в затворен съд,
    усилвателите, активните антени, сензорите
    за управление на въздушния транспорт и други
    радиосъоръжения, и за поправка на Решение за
    изпълнение (ЕС) 2025/2499
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/2003 ze dne 4. září 2026,
    kterým se mění prováděcí rozhodnutí (EU) 2022/2191, pokud jde o harmonizované
    normy pro zařízení rádiového určování pro aplikace sledování polohy,
    buňkovou komunikační základovou stanici, zařízení používající ultraširokopásmovou
    technologii, zařízení ke zjišťování struktury materiálů, pevné rádiové
    systémy, zařízení radaru pro sondování výšky hladiny v nádržích, zesilovače,
    aktivní antény, snímače řízení letového provozu a jiná rádiová zařízení,
    a kterým se opravuje prováděcí rozhodnutí (EU) 2025/2499
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/2003 af 4. september
    2026 om ændring af gennemførelsesafgørelse (EU) 2022/2191 for så vidt angår
    harmoniserede standarder for radioudstyr til lokaliseringsanvendelser, basestation
    for cellulare kommunikationssystemer, UWB-enheder, materialesensorer, faste radiokædesystemer,
    tankniveaumålere, forstærkere og aktive antenner, flyvekontrolsensorer og andet
    radioudstyr og om berigtigelse af gennemførelsesafgørelse (EU) 2025/2499
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/2003 της Επιτροπής,
    της 4ης Σεπτεμβρίου 2026, για την τροποποίηση
    της εκτελεστικής απόφασης (ΕΕ) 2022/2191 όσον αφορά
    τα εναρμονισμένα πρότυπα για εξοπλισμό ραδιοεντοπισμού
    για εφαρμογές ιχνηλάτησης θέσης, σταθμό βάσης
    κυψελοειδών επικοινωνιών, συσκευές υπερευρείας
    ζώνης, συσκευές επαίσθησης υλικών, σταθερά
    ραδιοσυστήματα, εξοπλισμό ραντάρ ανίχνευσης
    στάθμης δεξαμενών, ενισχυτές, ενεργές κεραίες,
    αισθητήρες ελέγχου εναέριας κυκλοφορίας και
    άλλο ραδιοεξοπλισμό, και για τη διόρθωση της
    εκτελεστικής απόφασης (ΕΕ) 2025/2499
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/2003, 4. september 2026, millega muudetakse
    rakendusotsust (EL) 2022/2191 asukoha jälgimise rakendusteks kasutatavaid raadiotuvastuse
    seadmeid, kärgside tugijaamu, UWB seadmeid, materjalide tajureid, paikseid raadiosidesüsteeme,
    mahutite taseme sondeerimisseadmeid, võimendeid ja aktiivantenne, lennujuhtimise
    sensoreid ja muid raadioseadmeid käsitlevate harmoneeritud standardite osas ning
    parandatakse rakendusotsust (EL) 2025/2499
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/2003, annettu 4 päivänä
    syyskuuta 2026, täytäntöönpanopäätöksen (EU) 2022/2191 muuttamisesta siltä
    osin kuin on kyse sijainnin seurantaan tarkoitettuja radiopaikannussovelluksia,
    solukkojärjestelmien tukiasemalaitteita, UWB-teknologiaa käyttäviä laitteita,
    materiaalintunnistimia, kiinteitä radiojärjestelmiä, säiliöiden pinnankorkeutta
    mittaavia tutkia, vahvistimia, aktiivisia antenneja, lennonjohdon sensoreita ja
    muita radiolaitteita koskevista yhdenmukaistetuista standardeista sekä täytäntöönpanopäätöksen
    (EU) 2025/2499 oikaisemisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/2003 ón gCoimisiún an 4 Meán Fómhair
    2026 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2022/2191 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le trealamh rad-aimsithe le haghaidh feidhmeanna
    rianaithe láithrigh, stáisiúin bhunáite cumarsáide ceallaí, gairis banda
    ultrai-leathain, gairis braite ábhar, córais raidió sheasta, trealamh um radar
    tóraithe leibhéal umair, aimplitheoirí, aeróga gníomhacha, braiteoirí rialaithe
    aerthráchta, agus trealamh raidió eile, agus lena gceartaítear Cinneadh Cur
    Chun Feidhme (AE) 2025/2499
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/2003 оd 4. rujna 2026. o izmjeni
    Provedbene odluke (EU) 2022/2191 u pogledu usklađenih normi za radiodeterminacijsku
    opremu za aplikacije za praćenje lokacije, baznu postaju pokretnih komunikacija,
    ultraširokopojasne uređaje, uređaje za osjet materijala, nepokretne radijske
    sustave, radarske uređaje za ispitivanje razine tvari u spremniku, pojačala,
    aktivne antene, senzore za kontrolu zračnog prometa i drugu radijsku opremu te
    o ispravku Provedbene odluke (EU) 2025/2499
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/2003 végrehajtási határozata (2026. szeptember
    4.) az (EU) 2022/2191 végrehajtási határozatnak a helymeghatározó alkalmazásokhoz
    használt rádiós helymeghatározó berendezésekre, a cellás kommunikációs
    bázisállomásokra, az ultraszéles sávú eszközökre, az anyagérzékelő
    eszközökre, az állandó helyű rádiórendszerekre, a tartályszintmérő radarberendezésekre,
    az erősítőkre, az aktív antennákra, a légiforgalmi irányító érzékelőkre
    és más rádióberendezésekre vonatkozó harmonizált szabványok tekintetében
    történő módosításáról, valamint az (EU) 2025/2499 végrehajtási határozat
    helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/2003 della Commissione, del 4 settembre
    2026, che modifica la decisione di esecuzione (UE) 2022/2191 per quanto riguarda
    le norme armonizzate relative alle apparecchiature di radiodeterminazione per
    applicazioni di tracciamento della posizione, alle stazioni base di comunicazione
    cellulare, ai dispositivi a banda ultra larga, ai dispositivi di rilevamento dei
    materiali, ai sistemi radio fissi, alle apparecchiature radar di rilevamento del
    livello del serbatoio, agli amplificatori, alle antenne attive, ai sensori per
    il controllo del traffico aereo e ad altre apparecchiature radio, e che rettifica
    la decisione di esecuzione (UE) 2025/2499
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/2003 (2026. gada 4. septembris),
    ar ko Īstenošanas lēmumu (ES) 2022/2191 groza attiecībā uz saskaņotajiem
    standartiem radionoteikšanas iekārtām atrašanās vietas izsekošanas lietojumiem,
    mobilo sakaru bāzes stacijām, ultraplatjoslas ierīcēm, materiāla zondēšanas
    ierīcēm, fiksētām radiosistēmām, tvertnes līmeņa zondēšanas radiolokācijas
    iekārtām, pastiprinātājiem, aktīvajām antenām, gaisa satiksmes vadības
    sensoriem un citām radioiekārtām un ar ko labo Īstenošanas lēmumu (ES) 2025/2499
  type: main
- language: lt
  script: Latn
  content: 2026 m. rugsėjo 4 d. Komisijos įgyvendinimo sprendimas (ES) 2026/2003,
    kuriuo dėl vietai sekti skirtos nustatymo radijo bangomis įrangos, korinio ryšio
    bazinių stočių, ultraplačios juostos įtaisų, medžiagų jutiklių, fiksuotojo
    radijo ryšio sistemų, rezervuarų lygio zondavimo radarų įrangos, stiprintuvų,
    aktyviųjų antenų, skrydžių valdymo jutiklių ir kitų radijo ryšio įrenginių
    darniųjų standartų iš dalies keičiamas Įgyvendinimo sprendimas (ES) 2022/2191
    ir ištaisomas Įgyvendinimo sprendimas (ES) 2025/2499
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/2003 tal-4
    ta’ Settembru 2026 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2022/2191
    fir-rigward tal-istandards armonizzati għat-tagħmir tar-radjudeterminazzjoni
    għall-applikazzjonijiet tat-trekkjar tal-pożizzjoni, għall-istazzjoni bażi
    tal-komunikazzjoni ċellulari, għall-apparati ta’ medda ultra-wiesgħa, għall-apparati
    ta’ detezzjoni tal-materjali, għas-sistemi tar-radju fissi, għat-tagħmir
    tar-radar tal-kejl tal-livell fit-tankijiet, għall-amplifikaturi, għall-antenni
    attivi, għas-sensuri tal-kontroll tat-traffiku tal-ajru, u għal tagħmir tar-radju
    ieħor, u li tikkoreġi d-Deċiżjoni ta’ Implimentazzjoni (UE) 2025/2499
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/2003 van de Commissie van 4 september 2026
    tot wijziging van Uitvoeringsbesluit (EU) 2022/2191 wat betreft geharmoniseerde
    normen voor radiodeterminatieapparatuur voor locatiebepalingstoepassingen, cellulaire
    basisstations, ultrabreedbandapparatuur, materiaaldetectieapparatuur, vaste radiosystemen,
    tankniveau-sonderingradarapparatuur, versterkers, actieve antennes, luchtverkeersleidingssensoren,
    en andere radioapparatuur, en tot rectificatie van Uitvoeringsbesluit (EU) 2025/2499
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/2003 z dnia 4 września 2026 r. w
    sprawie zmiany decyzji wykonawczej (UE) 2022/2191 w odniesieniu do norm zharmonizowanych
    dotyczących urządzeń radiolokacyjnych do zastosowań związanych z lokalizacją,
    stacji bazowych łączności komórkowej, urządzeń wykorzystujących technikę
    ultraszerokopasmową, urządzeń do wykrywania materiałów, stacjonarnych systemów
    radiowych, urządzeń radarowych sondujących poziom w zbiornikach, wzmacniaczy,
    aktywnych anten, czujników kontroli ruchu powietrznego i innych urządzeń radiowych
    oraz w sprawie sprostowania decyzji wykonawczej (UE) 2025/2499
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/2003 da Comissão, de 4 de setembro de
    2026, que altera a Decisão de Execução (UE) 2022/2191 no que diz respeito às
    normas harmonizadas aplicáveis ao equipamento de radiodeterminação para aplicações
    de rastreamento da localização, estação base de comunicação celular, dispositivos
    de banda ultra larga, dispositivos sensores de materiais, sistemas de rádio fixos,
    equipamento de radar para medição do nível de reservatórios, amplificadores,
    antenas ativas, sensores de controlo do tráfego aéreo e outros equipamentos
    de rádio, e que retifica a Decisão de Execução (UE) 2025/2499
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/2003 a Comisiei din 4 septembrie
    2026 de modificare a Deciziei de punere în aplicare (UE) 2022/2191 în ceea ce
    privește standardele armonizate pentru echipamentele de radiodeterminare pentru
    aplicațiile de urmărire a locației, stațiile bază pentru comunicații celulare,
    dispozitivele în bandă ultralargă, dispozitivele de detectare a materialelor,
    sistemele radio fixe, echipamentele radar pentru sondarea nivelului în rezervoare,
    amplificatoarele, antenele active, senzorii de control al traficului aerian și
    alte echipamente radio, și de rectificare a Deciziei de punere în aplicare (UE)
    2025/2499
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/2003 zo 4. septembra 2026,
    ktorým sa mení vykonávacie rozhodnutie (EÚ) 2022/2191, pokiaľ ide o harmonizované
    normy pre rádiodeterminačné zariadenia na sledovanie polohy, základňovú
    stanicu bunkových komunikácií, zariadenia používajúce ultraširoké pásmo,
    materiálovo citlivé zariadenia, pevné rádiové systémy, radary na sondovanie
    hladiny v nádržiach, zosilňovače, aktívne antény, senzory riadenia letovej
    prevádzky a iné rádiové zariadenia, a ktorým sa opravuje vykonávacie rozhodnutie
    (EÚ) 2025/2499
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/2003 z dne 4. septembra 2026 o spremembi
    Izvedbenega sklepa (EU) 2022/2191 glede harmoniziranih standardov za radiodoločilno
    opremo za aplikacije za sledenje lokaciji, bazno postajo za celično komunikacijo,
    ultraširokopasovne naprave, zaznavala snovi, fiksne radijske sisteme, opremo
    radarja za sondiranje nivoja v rezervoarjih, ojačevalnike, aktivne antene, senzorje
    za nadzor zračnega prometa in drugo radijsko opremo ter o popravku Izvedbenega
    sklepa (EU) 2025/2499
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2026/2003 de la Comisión, de 4 de septiembre
    de 2026, por la que se modifica la Decisión de Ejecución (UE) 2022/2191 en lo
    que respecta a las normas armonizadas para los equipos de radiodeterminación
    para aplicaciones de seguimiento de localización, estaciones base de comunicaciones
    celulares, dispositivos de banda ultra ancha, dispositivos sensores de materiales,
    sistemas fijos de radio, equipos de radar de sondeo de nivel de tanque, amplificadores,
    antenas activas, sensores de control de tránsito aéreo y otros equipos radioeléctricos,
    y se corrige la Decisión de Ejecución (UE) 2025/2499
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2026/2003 av den 4 september 2026
    om ändring av genomförandebeslut (EU) 2022/2191 vad gäller harmoniserade standarder
    för radiobestämningsutrustning för platsspårningstillämpningar, cellulära
    basstationer, UWB-enheter, enheter för materialavkänning, fasta radiolänksystem,
    sonderingsradar för utrustning för tanknivå, förstärkare, aktiva antenner,
    PSR-sensorer för flygtrafikledning samt annan radioutrustning, och om rättelse
    av genomförandebeslut (EU) 2025/2499
