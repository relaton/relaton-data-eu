    pour l’entrée dans l’Union d’envois d’animaux vivants et de produits
    d’origine animale en provenance de Nouvelle-Zélande respectant des mesures
    sanitaires dont l’équivalence avec celles de l’Union a été déterminée
    et abrogeant la décision d’exécution (UE) 2015/1901
  type: main
- language: de
  script: Latn
