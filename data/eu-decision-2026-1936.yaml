title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1936 of 5 August 2026 laying
    down certification rules and a model health certificate for entry into the Union
    of consignments of live animals and products of animal origin determined as equivalent
    to Union standards from New Zealand and repealing Implementing Decision (EU) 2015/1901
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1936 de la Commission du 5 août 2026
