title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1504/96 of 29 July 1996 laying down detailed
    rules for the application of Council Regulation (EC) No 1357/96 providing for
    additional payments to be made in 1996 with the premiums referred to in Regulation
    (EEC) No 805/68 on the common organization of the market in beef and veal and
    amending that Regulation, and amending Regulation (EEC) No 3886/92 laying down
    detailed rules for the application of the premium schemes provided for in the
    beef and veal sector as regards the processing premium
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1504/96 de la Commission du 29 juillet 1996 portant
    modalités d'application du règlement (CE) nº 1357/96 du Conseil prévoyant
    des paiements supplémentaires à faire en 1996 au titre des primes visées dans
    le règlement (CEE) nº 805/68 portant organisation commune des marchés dans
    le secteur de la viande bovine, et modifiant ce règlement, ainsi que modifiant
    le règlement (CEE) nº 3886/92 établissant modalités d'application relatives
    aux régimes de primes prévus dans le secteur de la viande bovine en ce qui concerne
    la prime de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1504/96 der Kommission vom 29. Juli 1996 mit Durchführungsbestimmungen
