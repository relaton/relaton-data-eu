    zu den Prämien gemäß der Verordnung (EWG) Nr. 805/68 über die gemeinsame Marktorganisation
    für Rindfleisch und zur Änderung der genannten Verordnung und der Verordnung
    (EWG) Nr. 3886/92 hinsichtlich der im Sektor Rindfleisch gewährten Verarbeitungsprämie
  type: main
- language: da
  script: Latn
