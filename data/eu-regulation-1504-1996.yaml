    realização, em 1996, de pagamentos suplementares no âmbito dos prémios previstos
    no Regulamento (CEE) nº 805/68 que estabelece a organização comum de mercado
    no sector da carne de bovino, e que altera o mesmo regulamento, e altera o Regulamento
    (CEE) nº 3886/92, que estabelece normas de execução dos regimes de prémios
    previstos no sector da carne de bovino no que respeita ao prémio à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1504/96 de la Comisión de 29 de julio de 1996 por
    el que se establecen disposiciones de aplicación del Reglamento (CE) nº 1357/96
    del Consejo por el que se establecen pagos adicionales para 1996 en relación
    con las primas contempladas en el Reglamento (CEE) nº 805/68 del Consejo por
    el que se establece la organización común de mercados en el sector de la carne
