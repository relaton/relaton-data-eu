  content: Commission Regulation (EC) No 210/94 of 31 January 1994 providing for the
    determination and the administration of the variable component for certain goods
    originating in Bulgaria resulting from the processing of agricultural products
    referred to in Council Regulation (EC) No 3448/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 210/94 de la Commission du 31 janvier 1994 portant
    la détermination et la gestion des éléments mobiles applicables à certaines
    marchandises originaires de Bulgarie résultant de la transformation de produits
    agricoles visés à l'annexe du règlement (CE) n° 3448/93
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 210/94 DER KOMMISSION vom 31. Januar 1994 zur Festlegung
    und Verwaltung der beweglichen Teilbeträge für bestimmte im Anhang der Verordnung
    (EG) Nr. 3448/93 genannte landwirtschaftliche Verarbeitungserzeugnisse mit Ursprung
    in Bulgarien
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 210/94 af 31. januar 1994 vedrørende
    fastsættelsen og administrationen af de variable elementer for visse varer med
    oprindelse i Bulgarien, fremkommet ved forarbejdning af landbrugsprodukter som
    anført i bilagene til forordning (EF) nr. 3448/93
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 210/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 31ης Ιανουαρίου 1994 ο οποίος αφορά τον καθορισμό
    και τη διαχείριση των μεταβλητών στοιχείων
    που εφαρμόζονται σε ορισμένα εμπορεύματα καταγωγής
    Βουλγαρίας προερχόμενα από τη μεταποίηση γεωργικών
    προϊόντων τα οποία αναφέρονται στο παράρτημα
    του κανονισμού (ΕΚ) αριθ. 3448/93
  type: main
- language: it
  script: Latn
