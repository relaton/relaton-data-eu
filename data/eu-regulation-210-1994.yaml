    risultanti dalla trasformazione dei prodotti agricoli di cui all' allegato del
    regolamento (CE) n. 3448/93
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 210/94 VAN DE COMMISSIE van 31 januari 1994 betreffende
