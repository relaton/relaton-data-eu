title:
- language: en
  script: Latn
  content: '79/384/EEC: Commission Decision of 27 March 1979 authorizing Ireland not
    to apply Community treatment to parkas, anoraks, windcheaters and the like, woven,
    of wool, cotton or man-made textile fibres, falling within heading No ex 61.01
    and subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.01-29,
    31, 32; 61.02-25, 26, 28) (category 21), originating in South Korea and in free
    circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/384/CEE: Décision de la Commission, du 27 mars 1979, autorisant l''Irlande
    à exclure du traitement communautaire les parkas, anoraks, blousons et similaires
    tissés, de laine, de coton ou de fibres textiles synthétiques ou artificielles
    de la position ex 61.01 et de la sous-position ex 61.02 B du tarif douanier commun
    (codes Nimexe 61.01-29, 31, 32; 61.02- 25, 26, 28) catégorie 21, originaires
    de la Corée du Sud et mis en libre pratique dans les autres Etats membres (Le
    texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/384/EWG: Entscheidung der Kommission vom 27. März 1979, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Parkas, Anoraks, Windjacken und dergleichen, aus
    Geweben, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-29; 31; 32 - 61.02- 25; 26; 28), Kategorie 21, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/384/EØF: Kommissionens beslutning af 27. marts 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage parkaer, anorakker vindjakker
    og lignende, af uld, bomuld eller korte kemofibre, som henhører under pos. ex
    61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.01-29, 31, 32 ;
    61.02-25, 26, 28 ; kategori 21), har oprindelse i Sydkorea og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/384/CEE: Decisione della Commissione, del 27 marzo 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario giacche e giacconi a vento,
    giubbotti e simili, tessuti, di lana, di cotone o di fibre tessili sintetiche
    o artificiali della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale
    comune (codici Nimexe: 61.01-29, 31, 32 e 61.02-25, 26, 28 - categoria 21), originari
    della Corea del Sud e messi in libera pratica negli altri Stati membri (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/384/EEG: Beschikking van de Commissie van 27 maart 1979 waarbij Ierland
    wordt gemachtigd parka''s, anoraks, windjakken en dergelijke, geweven, van wol,
    van katoen of van synthetische of van kunstmatige vezels, van de posten ex 61.01
    en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-29, 31,
    32 - 61.02-25, 26, 28) (categorie 21), van oorsprong uit Zuid-Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
