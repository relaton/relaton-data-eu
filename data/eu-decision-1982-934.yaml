id: EUDecision1982934
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '82/934/EEC: Commission Decision of 20 December 1982 establishing that
    the apparatus described as ''PMS - Forward Scattering Spectrometer Probe, model
    FSSP-100 with Optical Array Cloud Droplet Spectrometer Probe, model OAP-230X and
    Data Acquisition System, model DAS- 64'' may not be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/934/CEE: Décision de la Commission, du 20 décembre 1982, constatant
    que l''importation de l''appareil dénommé "PMS - Forward scattering spectrometer
    probe, model FSSP-100 with optical array cloud droplet spectrometer probe, model
    OAP-230 X and data acquisition system, model DAS-64" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/934/EWG: Entscheidung der Kommission vom 20. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,P.M.S. - Forward Scattering Spectrometer
    Probe, model FSSP-100, with Optical Array Cloud Droplet Spectrometer Probe, model
    OAP-230 X, and Data Acquisition System, model DAS- 64" nicht unter Befreiung von
    Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/934/EØF: Kommissionens beslutning af 20. december 1982 om fastslåelse
    af, at indførsel af apparatet "P.M.S. - Forward Scattering Spectrometer Probe,
    model FSSP-100 with Optical Array Cloud Droplet Spectrometer Probe, model OAP-230
    X and Data Acquisition System, model DAS-64" ikke kan ske med fritagelse for told
    efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/934/EOK: Απόφαση τής Επιτροπής τής 20ής Δεκεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «PMS — Forward Scattering Spectrometer Probe,
    model FSSP-100 with Optical Array Cloud Droplet Spectrometer Probe, model OAF-230
    X and Data Acquisition System, model DAS-64» δέν δύναται νά πραγματοποιηθεί
    ατελώς, ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/934/CEE: Decisione della Commissione, del 20 dicembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "PMS - Forward Scattering Spectrometer
    Probe, model FSSP-100, with Optical Array Cloud Droplet Spectrometer Probe, model
    OAP-230X, and Data Acquisition System, model DAS-64" non può avvenire in franchigia
    dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/934/EEG: Beschikking van de Commissie van 20 december 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,P.M.S. - Forward Scattering Spectrometer
    Probe, model FSSP-100 with Optical Array Cloud Droplet Spectrometer Probe, model
    OAP-230 X and Data Acquisition System, model DAS-64" niet met vrijstelling van
    de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
