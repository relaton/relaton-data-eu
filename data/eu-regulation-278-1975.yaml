    ασφαλείας κατά τή δημοπρασία τής εισφοράς
    κατά τήν εξαγωγή στόν τομέα τών σιτηρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 278/75 della Commissione, del 4 febbraio 1975, che
    modifica il regolamento (CEE) n. 3130/73 per quanto riguarda la cauzione da costituire
    ai fini della gara per il prelievo all' esportazione nel settore dei cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 278/75 van de Commissie van 4 februari 1975 tot wijziging
    van Verordening (EEG) nr. 3130/73 inzake de bij een openbare inschrijving voor
    de heffing bij uitvoer in de sector granen te stellen waarborg
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 278/75 da Comissão, de 4 de Fevereiro de 1975,
    que altera o Regulamento (CEE) n.° 3130/73 no que diz respeito à caução a
    constituir aquando de um concurso do direito nivelador à exportação no sector
    dos cereais
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 278/75 de la Comisión, de 4 de febrero de 1975, por
