  script: Latn
  content: Regulation (EEC) No 278/75 of the Commission of 4 February 1975 amending
    Regulation (EEC) No 3130/73 as regards the security to be lodged when tendering
    for the export levy for cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 278/75 de la Commission, du 4 février 1975, modifiant
    le règlement (CEE) n° 3130/73 en ce qui concerne la caution à constituer lors
    d' une adjudication du prélèvement à l' exportation dans le secteur des céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 278/75 der Kommission vom 4. Februar 1975 zur Änderung
    der Verordnung (EWG) Nr. 3130/73 hinsichtlich der bei einer Ausschreibung der
    Ausfuhrabschöpfung im Getreidesektor zu stellenden Kaution
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 278/75 af 4. februar 1975 om ændring
    af forordning (EØF) nr. 3130/73 for så vidt angår den sikkerhed, der skal stilles
    ved licitation over eksportafgiften for korn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 278/75 τής Επιτροπής
