    si applica il regolamento (CEE) n. 1059/69 in seguito alla svalutazione del franco
    francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 451/70 van de Commissie van 9 maart 1970 houdende
    wijziging van Verordening (EEG) nr. 1671/69 betreffende ingevolge de devaluatie
    van de Franse frank te nemen maatregelen voor de goederen die onder Verordening
    (EEG) nr. 1059/69 vallen
