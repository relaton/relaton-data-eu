    der Verordnung (EWG) Nr. 1671/69 über Maßnahmen für unter die Verordnung (EWG)
    Nr. 1059/69 fallende Waren infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 451/70 della Commissione, del 9 marzo 1970, che modifica
