title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 701/2005 of 4 May 2005 determining to what
    extent applications lodged in April 2005 for the right to import bulls, cows and
    heifers other than for slaughter of certain Alpine and mountain breeds can be
    met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 701/2005 de la Commission du 4 mai 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2005 pour l'importation de taureaux, vaches et génisses,
    autres que ceux destinés à la boucherie, de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 701/2005 der Kommission vom 4. Mai 2005 zur Bestimmung
    des Umfangs, in welchem den im April 2005 gestellten Anträgen auf Einfuhrrechte
    für die Einfuhr nicht zum Schlachten bestimmter Stiere, Kühe und Färsen bestimmter
    Höhenrassen stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 701/2005 ze dne 4. května 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní práva pro dovoz nejatečních
    býků, krav a jalovic určitých alpských a horských plemen, podaným v dubnu
    2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 701/2005 af 4. maj 2005 om det omfang,
    i hvilket der kan imødekommes ansøgninger om importrettigheder, som er indgivet
    i april 2005 vedrørende import af tyre, køer og kvier af bestemte alpine racer
    og bjergracer, ikke bestemt til slagtning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 701/2005 της Επιτροπής,
    της 4ης Μαΐου 2005, για καθορισμό του βαθμού κατά
    τον οποίο μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιωμάτων εισαγωγής που κατατίθενται τον
    Απρίλιο 2005 για την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων, άλλων πλην των προοριζομένων
    προς σφαγή, ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 701/2005, 4. mai 2005 millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi, mis esitati
    aprillis 2005 muuks kui tapmiseks ettenähtud ja teatavat alpi tõugu või mägitõugu
    pullide, lehmade ja mullikate importimiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 701/2005, annettu 4 päivänä toukokuuta 2005,
    tiettyihin alppi- ja vuoristorotuihin kuuluvien muiden kuin teuraseläimiksi tarkoitettujen
    sonnien, lehmien ja hiehojen tuonnista huhtikuussa 2005 jätettyjen tuontioikeushakemusten
    hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 701/2005/EK rendelete (2005. május 4.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni a 2005. áprilisában, egyes alpesi és
    hegyi fajtájú, nem vágásra szánt bikák, tehenek és üszők behozatala vonatkozásában
    benyújtott importjogosultsági kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 701/2005 della Commissione, del 4 maggio 2005, che
    stabilisce in quale misura è possibile accogliere le domande di diritti d'importazione
    presentate nel mese di aprile 2005 per l'importazione di tori, vacche e giovenche,
    diversi da quelli destinati alla macellazione, di alcune razze alpine e di montagna
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 701/2005 (2005. gada 4. maijs), ar ko nosaka,
