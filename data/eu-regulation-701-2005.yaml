    2005. gada aprīlī attiecībā uz alpīno un kalnu šķirņu buļļiem, govīm
    un telēm, kas nav paredzētas nokaušanai
  type: main
- language: lt
  script: Latn
  content: 2005 m. gegužės 4 d. Komisijos reglamentas (EB) Nr. 701/2005, nustatantis,
    kokia dalimi galima patenkinti paraiškas kai kurių Alpių ir kalnų veislių
    bulių, karvių bei telyčių, išskyrus skerstinus gyvulius, importo licencijai
    gauti, pateiktas 2005 m. balandžio mėnesį
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 701/2005 van de Commissie van 4 mei 2005 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in april 2005 zijn ingediend voor de invoer van stieren,
    koeien en vaarzen, niet bestemd voor de slacht, van bepaalde bergrassen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 701/2005 z dnia 4 maja 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie uprawnień na przywóz
    byków, krów i jałówek niektórych ras alpejskich i górskich, przeznaczonych
    do celów innych niż ubój, składane w kwietniu 2005 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 701/2005 da Comissão, de 4 de Maio de 2005, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação,
    apresentados em Abril de 2005 para a importação de touros, vacas e novilhas,
    com exclusão dos destinados ao abate, de certas raças alpinas e de montanha
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 701/2005 zo 4. mája 2005 ustanovujúce podmienky,
    za ktorých možno vyhovieť žiadostiam o dovozné povolenie, podaným v apríli
    2005, na dovoz nejatočných býkov, kráv a jalovíc niektorých alpských a
    horských plemien
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 701/2005 z dne 4. maja 2005 o določitvi, v kakšnem
    obsegu se lahko ugodi zahtevkom za uvozne pravice, vloženim v aprilu 2005, za
    uvoz bikov, krav in telic, ki niso namenjeni za zakol, nekaterih alpskih in gorskih
    pasem
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 701/2005 de la Comisión, de 4 de mayo de 2005, por
    el que se determina cómo se satisfacen las solicitudes de derechos de importación
    presentadas en el mes de abril de 2005 para la importación de toros, vacas y
    novillas no destinados al matadero, de determinadas razas alpinas y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 701/2005 av den 4 maj 2005 om i vilken
    utsträckning de ansökningar om importrättigheter som inlämnats i april 2005
    kan beviljas för import av tjurar, kor och kvigor av vissa alp- och bergraser
    som inte är slaktboskap
