  content: Commission Regulation (EC) No 1941/95 of 4 August 1995 opening for the
    second half of 1995, and laying down detailed rules for the application of, the
    tariff quotas for live bovine animals weighing between 160 and 300 kilograms originating
    in and coming from the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic
  type: main
- language: fr
  script: Latn
