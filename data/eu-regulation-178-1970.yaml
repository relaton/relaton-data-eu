title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 178/70 de la Commission, du 29 janvier 1970, fixant
    les taux des restitutions applicables, à compter du 1er février 1970, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 178/70 der Kommission vom 29. Januar 1970 zur Festsetzung
    der ab 1. Februar 1970 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 178/70 della Commissione, del 29 gennaio 1970, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 febbraio 1970,
    a taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 178/70 van de Commissie van 29 januari 1970 houdende
    vaststelling van de restituties welke vanaf 1 februari 1970 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
