  script: Latn
  content: '93/613/EC: Commission Decision of 26 November 1993 amending Decision 91/649/EEC
    on the establishment of an addendum to the Community support framework for Community
    structural assistance in Spain (Andalusia, Asturias, the Canary Islands, Castile-Leon,
    Catile-La Mancha, Valencia, Extremadura, Galicia, Murcia, Ceuta- Melilla) on the
    improvement of the condition under which agricultural products are processed and
    marketed (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/613/CE: Décision de la Commission du 26 novembre 1993 modifiant la
