title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3318/73 of the Commission of 6 December 1973 re-establishing
    Common Customs Tariff duties on women' s, girls' and infants' outer garments,
    falling within heading No ex 61.02, originating in developing countries to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2629/73
    of 26 September 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3318/73 de la Commission, du 6 décembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour femmes, fillettes et jeunes enfants, en tissus de
    coton, de la position tarifaire ex 61.02, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2629/73 du Conseil du 26 septembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3318/73 der Kommission vom 6. Dezember 1973 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Frauen, Mädchen und Kleinkinder, aus Baumwolle, der Tarifnummer ex 61.02,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2629/73
    des Rates vom 26. September 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissioens Forordning (EØF) nr. 3318/73 af 6. december 1973 om genindførelse
    af told ifølge den fælles toldtarif for yderbeklædningsgenstande til kvinder,
    piger og småbørn, af bomuld, under position ex 61.02, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2629/73 af 26. september 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3318/73 della Commissione, del 6 dicembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per donna, per ragazza e per bambini, in tessuti di cotone,
    della voce doganale n. ex 61.02, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2629/73 del Consiglio,
    del 26 settembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3318/73 van de Commissie van 6 december 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op damesbovenkleding, meisjesbovenkleding en kinderbovenkleding,
    van weefsels van katoen van tariefpost ex 61.02, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2629/73 van de Raad van 26 september
    1973 algemene tariefpreferenties werden geopend
  type: main
