title:
- language: en
  script: Latn
  content: '2010/434/EU: Commission Decision of 6 August 2010 amending Annexes I and
    II to Decision 2008/185/EC as regards the inclusion of Slovenia in the list of
    Member States free of Aujeszky’s disease and of Poland and regions of Spain
    in the list of Member States where an approved national control programme for
    that disease is in place (notified under document C(2010) 5358)'
  type: main
- language: fr
  script: Latn
  content: '2010/434/UE: Décision de la Commission du 6 août 2010 modifiant les
    annexes I et II de la décision 2008/185/CE en ce qui concerne l’inscription
    de la Slovénie sur la liste des États membres indemnes de la maladie d’Aujeszky
    et l’inscription de la Pologne et de régions d’Espagne sur la liste des États
    membres ayant instauré un programme approuvé de lutte contre cette maladie [notifiée
    sous le numéro C(2010) 5358]'
  type: main
