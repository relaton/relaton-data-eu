    der Tarifstelle 48.01 A des Gemeinsamen Zolltarifs (1978) und zur Ausdehnung dieses
    Kontingents auf bestimmte andere Papiere
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2608/77 af 21. november 1977 om åbning,
