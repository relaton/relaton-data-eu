  content: Council Regulation (EEC) No 2608/77 of 21 November 1977 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1978) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2608/77 du Conseil, du 21 novembre 1977, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de papier
    journal, de la sous-position 48.01 A du tarif douanier commun (année 1978), et
    étendant le bénéfice de ce même contingent à certains autres papiers
  type: main
- language: de
  script: Latn
