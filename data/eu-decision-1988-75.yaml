title:
- language: en
  script: Latn
  content: '88/75/EEC: Commission Decision of 29 January 1988 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/75/CEE: Décision de la Commission du 29 janvier 1988 autorisant la
    République italienne à instaurer les mesures de surveillance intracommunautaire
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres États membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/75/EWG: Entscheidung der Kommission vom 29. Januar 1988 mit der die
    Italienische Republik ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Bananen einzuführen (Nur der italienische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/75/EØF: Kommissionens beslutning af 29. januar 1988 om bemyndigelse
    af Den Italienske Republik til at indføre foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/75/ΕΟΚ: Απόφαση της Επιτροπής της 29ης Ιανουαρίου
    1988 που επιτρέπει στην Ιταλική Δημοκρατία να
    θεσπίσει μέτρα ενδοκοινοτικής επιτήρησης
    των εισαγωγών μπανάνας καταγωγής ορισμένων
    τρίτων χωρών, που έχουν τεθεί σε ελεύθερη κυκλοφορία
    στα υπόλοιπα κράτη μέλη (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/75/CEE: Decisione della Commissione del 29 gennaio 1988 che autorizza
    la Repubblica italiana a istituire le misure di sorveglianza intracomunitaria
    nei confronti delle banane originarie di taluni paesi terzi e messe in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '88/75/EEG: Beschikking van de Commissie van 29 januari 1988 waarbij de
    Italiaanse Republiek wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te treffen ten aanzien van de invoer van bananen van oorsprong uit derde landen,
    die in een andere Lid-Staat in het vrije verkeer zijn gebracht (Slechts de tekst
    in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/75/CEE: Decisão da Comissão de 29 de Janeiro de 1988 que autoriza
    a República Italiana a instituir medidas de vigilância intracomunitária em
    relação às importações de bananas originárias de certos países terceiros,
    introduzidas em livre-prática nos outros Estados-membros (Apenas faz fé o texto
    em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '88/75/CEE: Decisión de la Comisión de 29 de enero de 1988 por la que
    se autoriza a la República Italiana a establecer medidas de vigilancia intracomunitaria
    respecto a las importaciones de plátanos, originarios de determinados terceros
    países, despachados a libre práctica en los demás Estados miembros (El texto
    en lengua italiana es el único auténtico)'
  type: main
