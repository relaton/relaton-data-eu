title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1870/2001 of 24 September 2001 determining
    the extent to which applications lodged in September 2001 for import licences
    for certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1870/2001 de la Commission du 24 septembre 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2001 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la République
    de Pologne, la République de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1870/2001 der Kommission vom 24. September 2001 über
    die Festsetzung des Umfangs, in dem die im September 2001 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der
    Regelung der Abkommen zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen
    Republik, der Slowakei, Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1870/2001 af 24. september 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i september
    2001 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1870/2001 της Επιτροπής,
    της 24ης Σεπτεμβρίου 2001, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Σεπτέμβριο
    2001 για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1870/2001, annettu 24 päivänä syyskuuta 2001,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti syyskuussa 2001 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1870/2001 della Commissione, del 24 settembre 2001,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di settembre 2001 per taluni prodotti del settore
    delle carni suine nel quadro del regime previsto dagli accordi conclusi tra la
    Comunità e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica
    ceca, la Slovacchia, la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1870/2001 van de Commissie van 24 september 2001 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in september
    2001 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarĳe,
    de Tsjechische Republiek, de Slowaakse Republiek, Bulgarĳe en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1870/2001 da Comissão, de 24 de Setembro de 2001,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Setembro
    de 2001 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
