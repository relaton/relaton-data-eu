  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1870/2001 de la Comisión, de 24 de septiembre de 2001,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de septiembre de 2001 al amparo del régimen previsto en
    los Acuerdos celebrados entre la Comunidad y Polonia, Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1870/2001 av den 24 september 2001 om
    fastställande av i vilken utsträckning ansökningar som lämnats in i september
    2001 om importlicenser för vissa grisköttsprodukter i enlighet med den ordning
    som fastställs i avtalen mellan gemenskapen samt Polen, Ungern, Tjeckien, Slovakien,
