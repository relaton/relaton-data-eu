    in Malaysia, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommisionens forordning (EØF) nr. 3087/92 af 27. oktober 1992 om genindførelse
    af opkrævning af told for varer under kategori 91 (løbenummer 40.0910), som
    har oprindelse i Malaysia og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
