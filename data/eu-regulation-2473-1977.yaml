title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2473/77 of 9 November 1977 re-establishing
    the levying of customs duties on perborates of sodium falling within subheading
    28.46 ex B, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2473/77 de la Commission, du 9 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux perborates
    de sodium, de la sous-position tarifaire 28.46 EX B, originaires de la Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2473/77 der Kommission vom 9. November 1977 zur Wiedereinführung
    des Zollsatzes für Natriumperborat der Tarifstelle 28.46 ex B, mit Ursprung in
    Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2473/77 af 9. november 1977 om genindførelse
    af opkrævning af toldafgifter for natrium per oxyborat under underposition 28.46
    ex B, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2473/77 della Commissione, del 9 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai perborati di sodio
    della sottovoce doganale 28.46 ex B originari della Iugoslavia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2473/77 van de Commissie van 9 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op natriumperboraat,
    van post 28.46 ex B, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
