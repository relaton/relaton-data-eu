title:
- language: fr
  script: Latn
  content: Décision 67/56/CEE de la Commission, du 21 décembre 1966, autorisant
    la République française, en vertu de l'article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire certains produits, originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/56/EWG: Entscheidung der Kommission vom 21. Dezember 1966, mit der
    die Französische Republik gemäß Artikel 115 Absatz (1) des Vertrages ermächtigt
    wird, einige aus dritten Ländern stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Waren von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/56/CEE: Decisione della Commissione, del 21 dicembre 1966, che autorizza
    la Repubblica francese, ai sensi dell''articolo 115, primo comma, del Trattato,
    ad escludere dal trattamento comunitario certi prodotti originari di paesi terzi
    e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/56/EEG: Beschikking van de Commissie van 21 december 1966 houdende
    machtiging van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
