  script: Latn
  content: Commission Regulation (EEC) No 2219/90 of 30 July 1990 determining the
    prices and amounts fixed in ecus by the Council in the textile fibres sector and
    reduced as a result of the monetary realignment of 5 January 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2219/90 de la Commission du 30 juillet 1990 déterminant
    les prix et montants fixés en écus par le Conseil dans le secteur des fibres
    textiles et réduits en conséquence du réalignement monétaire du 5 janvier
    1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2219/90 DER KOMMISSION vom 30. Juli 1990 zur Neufestsetzung
    der vom Rat in Ecu festgesetzten und infolge der Waehrungsneufestsetzung am 5.
    Januar 1990 verringerten Preise und Betraege fuer Faserlein
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2219/90 af 30. juli 1990 om fastsættelse
    af priser og beløb for spindfibre, som Rådet har fastsat i ECU, og som nedsættes
    som følge af den monetære justering den 5. januar 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2219/90 της Επιτροπής
    της 30ής Ιουλίου 1990 για τον καθορισμό των τιμών
    και των ποσών που καθορίζονται σε Ecu από το
    Συμβούλιο στον τομέα των υφαντικών ινών και
    μειώνονται λόγω της νομισματικής επανευθυγράμμισης
    της 5ης Ιανουαρίου 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2219/90 DELLA COMMISSIONE del 30 luglio 1990 relativo
    ai prezzi e agli importi fissati in ecu dal Consiglio nel settore delle fibre
    tessili e ridotti a seguito del riallineamento monetario del 5 gennaio 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2219/90 VAN DE COMMISSIE van 30 juli 1990 houdende
    bepaling van de prijzen en bedragen in de textielvezelsector die door de Raad
    in ecu zijn vastgesteld en als gevolg van de monetaire herschikking van 5 januari
    1990 worden verlaagd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2219/90 DA COMISSAO de 30 de Julho de 1990 que determina
    os preços e montantes fixados em ecus pelo Conselho no sector das fibras têxteis
    e reduzidos na sequência do realinhamento monetario de 5 de Janeiro de 1990
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2219/90 DE LA COMISION de 30 de julio de 1990 por el
    que se determinan en el sector de las fibras textiles los precios e importes fijados
    en ecus por el Consejo y reducidos como consecuencia del reajuste monetario del
    5 de enero de 1990
  type: main
