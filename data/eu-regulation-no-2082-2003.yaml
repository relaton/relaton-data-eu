    koskevien yksipuolisten siirtymätoimenpiteiden toteuttamisesta johtuvista siirtymätoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2082/2003 della Commissione, del 27 novembre 2003,
    che fissa misure transitorie a seguito dell'adozione di misure autonome e transitorie
    relative all'esportazione di taluni prodotti agricoli trasformati a Malta
  type: main
- language: nl
  script: Latn
