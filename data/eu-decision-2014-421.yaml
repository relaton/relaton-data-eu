    , Euroopan talousyhteisön ja Norjan kuningaskunnan välillä 14 päivänä toukokuuta
    1973 tehdyllä sopimuksella perustetussa sekakomiteassa Euroopan unionin puolesta
    esitettävästä kannasta ”peräisin olevat tuotteet” (alkuperätuotteet)
    käsitteen määrittelyä ja hallinnollisen yhteistyön menetelmiä koskevan pöytäkirjan
