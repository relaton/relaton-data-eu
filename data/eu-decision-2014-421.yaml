    hospodárskym spoločenstvom a Nórskym kráľovstvom zo 14. mája 1973 , pokiaľ
    ide o nahradenie protokolu 3 k uvedenej dohode týkajúceho sa vymedzenia pojmu
    „pôvodné výrobky“ a metód administratívnej spolupráce novým protokolom,
    ktorý, pokiaľ ide o pravidlá pôvodu, odkazuje na regionálny dohovor o paneuro-stredomorských
    preferenčných pravidlách pôvodu'
  type: main
- language: sl
  script: Latn
  content: '2014/421/EU: Sklep Sveta z dne 23. junija 2014 o stališču, ki ga Evropska
    unija sprejme v Skupnem odboru, ustanovljenim s Sporazumom med Evropsko gospodarsko
    skupnostjo in Kraljevino Norveško z dne 14. maja 1973 , glede nadomestitve Protokola
    3 navedenega sporazuma o opredelitvi pojma „izdelki s poreklom“ in načinih
    upravnega sodelovanja z novim protokolom, ki se v zvezi s pravili o poreklu sklicuje
    na Regionalno konvencijo o pan-evro-mediteranskih preferencialnih pravilih o poreklu'
  type: main
