    pelo Acordo entre a Comunidade Económica Europeia e o Reino da Noruega de 14
    de maio de 1973 , sobre a substituição do Protocolo n. ° 3 do referido Acordo,
    relativo à definição do conceito de «produtos originários» e aos métodos
    de cooperação administrativa, por um novo protocolo que, no que se refere às
    regras de origem, remeta para a Convenção Regional sobre Regras de Origem Preferenciais
    Pan-Euromediterrânicas'
  type: main
- language: ro
  script: Latn
  content: '2014/421/UE: Decizia Consiliului din 23 iunie 2014 privind poziția care
    urmează să fie adoptată de Uniunea Europeană în cadrul Comitetului mixt instituit
    prin Acordul dintre Comunitatea Economică Europeană și Regatul Norvegiei de
    la 14 mai 1973 , în legătură cu înlocuirea Protocolului nr. 3 la respectivul
    acord, privind definirea conceptului de „produse originare” și metodele de
    cooperare administrativă, cu un nou protocol care, în ceea ce privește regulile
    de origine, să facă trimitere la Convenția regională cu privire la regulile
    de origine preferențiale pan-euro-mediteraneene'
  type: main
- language: sk
  script: Latn
  content: '2014/421/EÚ: Rozhodnutie Rady z 23. júna 2014 o pozícii, ktorú má
