  script: Latn
  content: '2014/421/UE: Decisión del Consejo, de 23 de junio de 2014 , relativa
    a la posición que deberá adoptar la Unión Europea en el seno del Comité Mixto
    instituido por el Acuerdo entre la Comunidad Económica Europea y el Reino de
    Noruega, de 14 de mayo de 1973 , por lo que respecta a la sustitución de su Protocolo
    n ° 3 relativo a la definición de la noción de «productos originarios» y
    métodos de cooperación administrativa, por un nuevo Protocolo que, por lo que
    respecta a las normas de origen, se refiera al Convenio regional sobre las normas
    de origen preferenciales paneuromediterráneas'
  type: main
- language: sv
  script: Latn
  content: '2014/421/EU: Rådets beslut av den 23 juni 2014 om den ståndpunkt som
    Europeiska unionen ska inta i den gemensamma kommitté som inrättades genom avtalet
    av den 14 maj 1973 mellan Europeiska ekonomiska gemenskapen och Konungariket Norge
    beträffande ersättande av protokoll 3 (om definition av begreppet ”ursprungsprodukter”
    och om metoder för administrativt samarbete) till avtalet med ett nytt protokoll,
    som vad gäller ursprungsregler hänvisar till den regionala konventionen om Europa–Medelhavstäckande
    regler om förmånsursprung'
