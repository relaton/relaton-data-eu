title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3302/93 of 30 November 1993 re-establishing
    the levying of customs duties on products falling within CN code ex 8471, originating
    in Singapore, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3302/93 de la Commission du 30 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC ex 8471, originaires de Singapour, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3302/93 DER KOMMISSION vom 30. November 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes ex 8471 mit Ursprung in Singapur,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3302/93 af 30. november 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode ex 8471 og med oprindelse
    i Singapore, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3302/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Νοεμβρίου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ ex 8471, καταγωγής Σιγκαπούρης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3302/93 DELLA COMMISSIONE del 30 novembre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC ex 8471 originari di Singapore, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3302/93 VAN DE COMMISSIE van 30 november 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code ex 8471, van oorsprong uit Singapore, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3302/93 DA COMISSÃO de 30 de Novembro de 1993 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos do código
    NC ex 8471, originários de Singapura, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) nº 3831/90 do Conselho
  type: main
