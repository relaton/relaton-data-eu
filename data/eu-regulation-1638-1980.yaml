title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1638/80 of 24 June 1980 on the system for guaranteeing
    the stabilization of earnings from certain commodities exported by the ACP States
    and the overseas countries and territories associated with the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1638/80 du Conseil, du 24 juin 1980, relatif au système
    visant à garantir la stabilisation des recettes d' exportation de certains produits
    de base en faveur des États d' Afrique, des Caraïbes et du Pacifique (ACP) et
    des pays et territoires d' outre-mer associés à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1638/80 des Rates vom 24. Juni 1980 über das System
    zur Stabilisierung der Erlöse aus der Ausfuhr bestimmter Grundstoffe zugunsten
    der AKP-Staaten und der mit der Gemeinschaft assoziierten überseeischen Länder
    und Gebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1638/80 af 24. juni 1980 om den ordning,
    der skal garantere stabilisering af indtægterne ved udførsel af visse basisprodukter,
    til fordel for AVS-staterne og de oversøiske lande og territorier, der er associeret
    Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1638/80 τού Συμβουλίου
    τής 24ης Ιουνίου 1980 περί τού συστήματος πού
    αποσκοπεί στήν εγγύηση τής σταθεροποιήσεως
    τών εσόδων από εξαγωγές ορισμένων προϊόντων
    βάσεως υπέρ τών κρατών τής Αφρικής, τής Καραϊβικής
    καί τού Ειρηνικού (AKE) καί τών υπερποντίων χωρών
    καί εδαφών πού είναι συνδεδεμένα μέ τήν Κοινότητα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1638/80 del Consiglio, del 24 giugno 1980, relativo
    al sistema inteso a garantire la stabilizzazione delle entrate provenienti dall'
    esportazione di taluni prodotti di base a favore degli Stati ACP e dei paesi e
    territori d' oltremare associati alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1638/80 van de Raad van 24 juni 1980 inzake het systeem
    dat er op gericht is de stabilisatie van de exportopbrengsten voor bepaalde basisprodukten
    te waarborgen ten gunste van de ACS-Staten en de met de Gemeenschap geassocieerde
    landen en gebieden overzee
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1638/80 do Conselho, de 24 de Junho de 1980, relativo
    ao sistema que visa garantir a estabilização das receitas de exportação de
    alguns produtos de base a favor dos Estados de África, das Caraíbas e do Pacífico
    (ACP) e dos países e territórios ultramarinos associados à Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1638/80 del Consejo, de 24 de junio de 1980, relativo
    al sistema dirigido a garantizar la estabilización de los ingresos de exportación
    de ciertos productos de base en favor de los Estados de África, del Caribe y
    del Pacífico (ACP) y de los Países y Territorios de Ultramar asociados a la
    Comunidad
  type: main
