title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1071/87 of 15 April 1987 derogating from
    Regulation (EEC) No 854/86 laying down detailed rules for applying compulsory
    distillation as referred to in Article 39 of Council Regulation (EEC) No 822/87
    in respect of certain time limits to be complied with by Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1071/87 de la Commission du 15 avril 1987 dérogeant
    au règlement (CEE) n° 854/86 portant modalités d' application pour la distillation
    obligatoire prévue à l' article 39 du règlement (CEE) n° 822/87 du Conseil
    en ce qui concerne certains délais à respecter par la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1071/87 der Kommission vom 15. April 1987 zur Änderung
    der Verordnung (EWG) Nr. 854/86 mit Durchführungsbestimmungen für die obligatorische
    Destillation gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87 des Rates betreffend
    bestimmte von Griechenland einzuhaltende Fristen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1071/87 af 15. april 1987 om undtagelse
    fra forordning (EØF) nr. 854/86 om gennemførelsesbestemmelser for obligatorisk
    destillation som omhandlet i artikel 39 i Rådets forordning (EØF) nr. 822/87
    for så vidt angår visse frister, der skal overholdes af Grækenland
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1071/87 της Επιτροπής
    της 15ης Απριλίου 1987 για παρέκκλιση από τον
    κανονισμό (ΕΟΚ) αριθ. 854/86 περί λεπτομερειών
    εφαρμογής για την υποχρεωτική απόσταξη που
    προβλέπεται στο άρθρο 39 του κανονισμού (ΕΟΚ)
    αριθ. 822/87 του Συμβουλίου όσον αφορά ορισμένες
    προθεσμίες που πρέπει να τηρηθούν από την Ελλάδα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1071/87 della Commissione del 15 aprile 1987 recante
    deroga al regolamento (CEE) n. 854/86 recante modalità di applicazione per la
    distillazione obbligatoria di cui all' articolo 39 del regolamento (CEE) n. 822/87
    del Consiglio in ordine a determinate scadenze imposte alla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1071/87 van de Commissie van 15 april 1987 tot afwijking
    van Verordening (EEG) nr. 854/86 houdende uitvoeringsbepalingen voor de in artikel
    39 van Verordening (EEG) nr. 822/87 van de Raad bedoelde verplichte distillatie,
    ten aanzien van bepaalde door Griekenland in acht te nemen termijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1071/87 da Comissão de 15 de Abril de 1987 que
    derroga o Regulamento (CEE) n.° 854/86 que estabelece as regras de execução
    da destilação obrigatória prevista no artigo 39.° do Regulamento (CEE) n.°
    822/87 do Conselho no que diz respeito a determinados prazos a respeitar pela
    Grécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1071/87 de la Comisión de 15 de abril de 1987 que
    deroga el Reglamento (CEE) n° 854/86 por el que se establecen las modalidades
    de aplicación para la destilación obligatoria prevista en el artículo 39 del
    Reglamento (CEE) n° 822/87 del Consejo, por lo que respecta a determinados plazos
    que debe respetar Grecia
