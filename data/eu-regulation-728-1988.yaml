title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 728/88 of 18 March 1988 re-establishing
    the levying of customs duties on nets and netting made of twine, cordage or rope,
    products of category 97 (order number 40.0970), originating in China, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 728/88 de la Commission du 18 mars 1988 portant rétablissement
    de la perception des droits de douane applicables aux filets fabriqués à l'
    aide de ficelles, cordes ou cordages de la catégorie de produits n° 97 (numéro
    d' ordre 40.0970), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 728/88 der Kommission vom 18. März 1988 über die
    Wiedereinführung des Zollsatzes für Netze aus Bindfäden, Seilen oder Tauen
    der Warenkategorie 97 (Laufende Nummer 40.0970) mit Ursprung in China, dem die
    in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
