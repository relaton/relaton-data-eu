  content: Regulation (EEC) No 1397/69 of the Council of 17 July 1969 fixing standard
    qualities for certain cereals and categories of flour, groats and meal and the
    rules for fixing the threshold prices of these categories of products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1397/69 du Conseil, du 17 juillet 1969, déterminant
    les qualités type pour certaines céréales et catégories de farines, gruaux
    et semoules, ainsi que les règles applicables pour la fixation des prix de seuil
    de ces catégories de produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1397/69 des Rates vom 17. Juli 1969 zur Festsetzung
    der Standardqualitäten für bestimmte Arten von Getreide, Mehl, Grütze und Grieß
    sowie der Regeln für die Festsetzung der Schwellenpreise dieser Arten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1397/69 af 17. juli 1969 om fastsættelse
    af standardkvaliteter for bestemte kornsorter og for visse former for mel og grove
    og fine gryn samt regler om fastsættelse af tærskelpriser for disse former for
    produkter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1397/69 del Consiglio, del 17 luglio 1969, che fissa
    le qualità tipo di alcuni cereali e di alcune categorie di farine, semole e semolini,
    nonché le norme applicabili per la fissazione dei prezzi d' entrata di tali categorie
    di prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1397/69 van de Raad van 17 juli 1969 tot vaststelling
    van de standaardkwaliteiten voor bepaalde graansoorten en bepaalde soorten meel,
    grutten, gries en griesmeel, alsmede van de voorschriften voor de vaststelling
    van de drempelprijzen voor deze soorten
