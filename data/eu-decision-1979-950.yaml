id: EUDecision1979950
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/950/EEC: Commission Decision of 25 October 1979 authorizing the French
    Republic not to apply Community treatment to receivers, whether or not incorporating
    sound recorders or reproducers, falling within subheading 85.15 A ex III of the
    Common Customs Tariff, originating in Taiwan and in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/950/CEE: Décision de la Commission, du 25 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les postes récepteurs
    de radio, même combinés avec un appareil d''enregistrement ou de reproduction
    du son, de la sous-position 85.15 A ex III du tarif douanier commun, originaires
    de T''ai-wan et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/950/EWG: Entscheidung der Kommission vom 25. Oktober 1979, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte, auch mit Tonaufnahme-
    oder Tonwiedergabegeräten kombiniert, der Tarifstelle 85.15 A ex III des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/950/EØF: Kommissionens beslutning af 25. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage modtagere, også
    kombineret med lydoptagere eller lydgengivere, som henhører under pos. 85.15
    ex III i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/950/CEE: Decisione della Commissione, del 25 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi, anche combinati con un apparecchio di registrazione o di riproduzione
    del suono, della sottovoce 85.15 A ex III della tariffa doganale comune, originari
    di Taiwan e messi in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/950/EEG: Beschikking van de Commissie van 25 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, van post 85.15 A ex
    III van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de
    overige Lid-Staten in het vrije gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
