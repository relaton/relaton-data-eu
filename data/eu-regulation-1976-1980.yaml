title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1976/80 of 25 July 1980 extending the period
    of validity of Regulation (EEC) No 2826/77 introducing a Community transit declaration
    form for use in automatic or electronic data-processing systems
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1976/80 de la Commission, du 25 juillet 1980, prorogeant
    le règlement (CEE) n° 2826/77 instituant un formulaire de déclaration de transit
    communautaire pouvant être utilisé dans un système de traitement automatique
    ou électronique des informations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1976/80 der Kommission vom 25. Juni 1980 zur Verlängerung
    der Verordnung (EWG) Nr. 2826/77 zur Einführung eines datenverarbeitungsgerechten
    Vordrucks für die Anmeldung zum gemeinschaftlichen Versandverfahren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1976/80 af 25. juli 1980 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 2826/77 om indførelse af en angivelsesblanket
    for fællesskabsforsendelse, som kan anvendes i et automatisk eller elektronisk
    databehandlingssystem
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1976/80 τής Επιτροπής
    τής 25ης Ιουλίου 1980 περί παρατάσεως τού κανονισμού
    (ΕΟΚ) αριθ. 2826/77 «περί τής καθιερώσεως εντύπου
    διασαφήσεως κοινοτικής διαμετακομίσεως, δυναμένου
    νά χρησιμοποιείται σέ σύστημα αυτομάτου ή
    ηλεκτρονικής επεξεργασίας τών πληροφοριών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1976/80 della Commissione, del 25 luglio 1980, che
    proroga il regolamento (CEE) n. 2826/77 che istituisce un formulario di dichiarazione
    di transito comunitario che puo essere utilizzato in un sistema di trattamento
    automatico o elettronico delle informazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1976/80 van de Commissie van 25 juli 1980 tot verlenging
    van Verordening (EEG) nr. 2826/77 tot instelling van een formulier van aangifte
    voor communautair douanevervoer dat kan worden gebruikt in een systeem van automatische
    of elektronische informatieverwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1976/80 da Comissão, de 25 de Julho de 1980, que
    prorroga o Regulamento (CEE) n.° 2826/77 que institui um formulário de declaração
    de trânsito comunitário susceptível de utilização num sistema de tratamento
    automático ou electrónico das informações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1976/80 de la Comisión, de 25 de julio de 1980, por
    el que se prorroga el Reglamento (CEE) n° 2826/77 que establece un formulario
    de declaración de tránsito comunitario que puede utilizarse en un sistema de
    tratamiento automático o electrónico de la información
  type: main
