  script: Latn
  content: Uitvoeringsverordening (EU) 2022/58 van de Commissie van 14 januari 2022
    tot instelling van een definitief antidumpingrecht op bepaalde gewalste platte
    producten met georiënteerde korrel van siliciumstaal van oorsprong uit de Volksrepubliek
    China, Japan, de Republiek Korea, de Russische Federatie en de Verenigde Staten
    van Amerika naar aanleiding van een nieuw onderzoek in verband met het vervallen
    van de maatregelen op grond van artikel 11, lid 2, van Verordening (EU) 2016/1036
    van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
