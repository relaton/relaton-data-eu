    walcowanych płaskich ze stali krzemowej elektrotechnicznej o ziarnach zorientowanych,
    pochodzących z Chińskiej Republiki Ludowej, Japonii, Republiki Korei, Federacji
    Rosyjskiej i Stanów Zjednoczonych Ameryki po dokonaniu przeglądu wygaśnięcia
    na podstawie art. 11 ust. 2 rozporządzenia Parlamentu Europejskiego i Rady (UE)
    2016/1036
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/58 da Comissão de 14 de janeiro de
    2022 que institui um direito anti-dumping definitivo relativo às importações
    de determinados produtos laminados planos, de grãos orientados, de aço ao silício,
    denominado «magnético», originários da República Popular da China, do Japão,
    da República da Coreia, da Federação da Rússia e dos Estados Unidos da América,
    na sequência de um reexame da caducidade nos termos do artigo 11.o, n.o 2, do
    Regulamento (UE) 2016/1036
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/58 al Comisiei din 14 ianuarie
    2022 de instituire a unei taxe antidumping definitive asupra importurilor de anumite
    produse laminate plate din oțeluri cu siliciu numite „magnetice” cu grăunți
    orientați, originare din Republica Populară Chineză, Japonia, Republica Coreea,
    Federația Rusă și Statele Unite ale Americii, ca urmare a unei reexaminări
    efectuate în perspectiva expirării măsurilor, în temeiul articolului 11 alineatul
    (2) din Regulamentul (UE) 2016/1036 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/58 zo 14. januára 2022, ktorým
    sa po revíznom prešetrovaní pred uplynutím platnosti na základe článku
    11 ods. 2 nariadenia Európskeho parlamentu a rady (EÚ) 2016/1036 ukladá konečné
    antidumpingové clo na dovoz určitých plochých valcovaných výrobkov s orientovanou
    štruktúrou z kremíkovej elektroocele s pôvodom v Čínskej ľudovej republike,
    Japonsku, Kórejskej republike, Ruskej federácii a Spojených štátoch amerických
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/58 z dne 14. januarja 2022 o uvedbi
    dokončne protidampinške dajatve na uvoz nekaterih zrnato usmerjenih ploščato
    valjanih izdelkov iz silicijevega jekla za elektropločevine s poreklom iz Ljudske
    republike Kitajske, Japonske, Republike Koreje, Ruske federacije in Združenih
    držav Amerike po pregledu zaradi izteka ukrepov v skladu s členom 11(2) Uredbe
    (EU) 2016/1036 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/58 de la Comisión de 14 de enero de
    2022 por el que se establece un derecho antidumping definitivo en lo que respecta
    a las importaciones de determinados productos laminados planos de acero magnético
    al silicio, de grano orientado, originarios de la República Popular China, Japón,
    la República de Corea, la Federación de Rusia y los Estados Unidos de América
    a raíz de una reconsideración por expiración de conformidad con el artículo
    11, apartado 2, del Reglamento (UE) 2016/1036 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/58 av den 14 januari 2022
    om införande av en slutgiltig antidumpningstull på import av vissa kornorienterade
    valsade platta produkter av kisellegerat elektrostål med ursprung i Amerikas
    förenta stater, Japan, Folkrepubliken Kina, Ryska federationen och Republiken
    Korea till följd av en översyn vid giltighetens utgång enligt artikel 11.2
    i Europaparlamentets och rådets förordning (EU) 2016/1036
