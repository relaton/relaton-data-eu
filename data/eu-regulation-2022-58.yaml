    Föderációból és az Amerikai Egyesült Államokból származó egyes szilícium-elektromos
    acélból készült szemcseorientált síkhengerelt termékek behozatalára vonatkozó
    végleges dömpingellenes vámnak az (EU) 2016/1036 európai parlamenti és tanácsi
    rendelet 11. cikkének (2) bekezdése szerinti hatályvesztési felülvizsgálatot
    követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/58 della Commissione del 14 gennaio
    2022 che istituisce un dazio antidumping definitivo sulle importazioni di determinati
    prodotti laminati piatti di acciai al silicio detti «magnetici» a grani orientati
    originari della Repubblica popolare cinese, del Giappone, della Repubblica di
    Corea, della Federazione russa e degli Stati Uniti d’America in seguito a un
    riesame in previsione della scadenza a norma dell’articolo 11, paragrafo 2,
    del regolamento (UE) 2016/1036 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/58 (2022. gada 14. janvāris),
    ar ko pēc termiņbeigu pārskatīšanas, kas veikta, ievērojot Eiropas Parlamenta
    un Padomes Regulas (ES) 2016/1036 11. panta 2. punktu, nosaka galīgo antidempinga
    maksājumu konkrētu Ķīnas Tautas Republikas, Japānas, Korejas Republikas,
    Krievijas Federācijas un Amerikas Savienoto Valstu izcelsmes orientēta grauda
    struktūras elektrotehniskā silīcijtērauda plakanu velmējumu importam
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/58 2022 m. sausio 14 d. kuriuo,
    pagal Europos Parlamento ir Tarybos reglamento (ES) 2016/1036 11 straipsnio 2
    dalį atlikus priemonių galiojimo termino peržiūrą, tam tikriems importuojamiems
    Kinijos Liaudies Respublikos, Japonijos, Korėjos Respublikos, Rusijos Federacijos
    ir Jungtinių Amerikos Valstijų kilmės orientuoto grūdėtumo plokštiems valcavimo
    produktams iš silicinio elektrotechninio plieno nustatomas galutinis antidempingo
    muitas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/58 tal-14 ta’
