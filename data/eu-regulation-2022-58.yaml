  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/58 ón gCoimisiún an 14 Eanáir
    2022 lena bhforchuirtear dleacht frithdhumpála chinntitheach ar allmhairí táirgí
    áirithe cothrom-rollta de chruach shileacain-leictreach dírithe ar ghráinní
    de thionscnamh Dhaon-Phoblacht na Síne, na Seapáine, Phoblacht na Cóiré, Chónaidhm
    na Rúise agus Stát Aontaithe Mheiriceá, tar éis athbhreithniú éaga de bhun
