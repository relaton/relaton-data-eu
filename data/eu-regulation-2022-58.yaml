    ċerti prodotti b’vina parallela rrumblati ċatt ta’ azzar elettriku bis-siliċju
    li joriġinaw mir-Repubblika tal-Poplu taċ-Ċina, mill-Ġappun, mir-Repubblika
    tal-Korea, mill-Federazzjoni Russa u mill-Istati Uniti tal-Amerka wara rieżami
