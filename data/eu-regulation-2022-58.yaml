title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/58 of 14 January 2022 imposing
    a definitive anti-dumping duty on imports of certain grain-oriented flat-rolled
    products of silicon-electrical steel originating in the People’s Republic of
    China, Japan, the Republic of Korea, the Russian Federation and the United States
    of America following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/58 de la Commission du 14 janvier 2022
    instituant un droit antidumping définitif sur les importations de certains produits
    laminés plats en aciers au silicium dits «magnétiques» à grains orientés
    originaires de la République populaire de Chine, du Japon, de la République
    de Corée, de la Fédération de Russie et des États-Unis d’Amérique à l’issue
    d’un réexamen au titre de l’expiration des mesures effectué conformément
    à l’article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/58 der Kommission vom 14. Januar 2022
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    kornorientierter flachgewalzter Erzeugnisse aus Silicium-Elektrostahl mit Ursprung
    in der Volksrepublik China, Japan, der Republik Korea, der Russischen Föderation
    und den Vereinigten Staaten von Amerika nach einer Überprüfung wegen des bevorstehenden
    Außerkrafttretens der Maßnahmen nach Artikel 11 Absatz 2 der Verordnung (EU)
    2016/1036 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/58 на Комисията
    от 14 януари 2022 година за налагане на окончателно
    антидъмпингово мито върху вноса на някои плосковалцовани
    продукти от силициева електротехническа (магнитна)
    стомана със зърнесто ориентирани структури
    с произход от Китайската народна република,
    Япония, Република Корея, Руската федерация
