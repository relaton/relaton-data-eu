    gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/58 оd 14. siječnja 2022. o uvođenju
    konačne antidampinške pristojbe na uvoz određenih plosnato valjanih proizvoda
    od silicijskog elektročelika s orijentiranim kristalima podrijetlom iz Narodne
    Republike Kine, Japana, Republike Koreje, Ruske Federacije i Sjedinjenih Američkih
    Država nakon revizije zbog predstojećeg isteka mjera u skladu s člankom 11.
    stavkom 2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/58 végrehajtási rendelete (2022. január 14.)
