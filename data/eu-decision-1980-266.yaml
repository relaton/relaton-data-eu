title:
- language: en
  script: Latn
  content: '80/266/EEC: Commission Decision of 7 February 1980 authorizing Member
    States to permit temporarily the marketing of forestry reproductive material not
    complying with the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '80/266/CEE: Décision de la Commission, du 7 février 1980, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '80/266/EWG: Entscheidung der Kommission vom 7. Februar 1980 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '80/266/EØF: Kommissionens beslutning af 7. februar 1980 om bemyndigelse
    til medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '80/266/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Φεβρουαρίου
    1980 περί εξουσιοδοτήσεως των κρατών μελών να
    αποδέχονται προσωρινά την εμπορία του δασικού
    πολλαπλασιαστικού υλικού που δεν ανταποκρίνεται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '80/266/CEE: Decisione della Commissione, del 7 febbraio 1980, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di moltiplicazione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '80/266/EEG: Beschikking van de Commissie van 7 februari 1980 houdende
    machtiging van de Lid-Staten om tijdelijk bosbouwkundig teeltmateriaal tot de
    handel toe te laten dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad
    voldoet'
  type: main
