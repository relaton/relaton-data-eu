    n. 508/2014 per quanto riguarda misure specifiche volte a mobilitare gli investimenti
    nei sistemi sanitari degli Stati membri e in altri settori delle loro economie
    in risposta all'epidemia di COVID-19 (Iniziativa di investimento in risposta al
    coronavirus)
  type: main
- language: lv
  script: Latn
