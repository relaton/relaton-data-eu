    járványra adott válaszként a tagállamok egészségügyi rendszereibe és
    gazdaságuk más ágazataiba történő beruházások mozgósítását célzó
    különös intézkedések tekintetében történő módosításáról (A koronavírusra
    való reagálást célzó beruházási kezdeményezés)
  type: main
