    en (EU) nr. 508/2014 wat betreft specifieke maatregelen om investeringen in de
    gezondheidszorgstelsels van de lidstaten en in andere sectoren van hun economieën
    vrij te maken als antwoord op de COVID-19-uitbraak (Investeringsinitiatief Coronavirusrespons)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2020/460 z dnia 30
