    508/2014, pokiaľ ide o osobitné opatrenia na mobilizáciu investícií v systémoch
    zdravotnej starostlivosti členských štátov a v iných odvetviach ich hospodárstiev
    v reakcii na výskyt ochorenia COVID-19 (Investičná iniciatíva v reakcii na
    koronavírus)
  type: main
- language: sl
  script: Latn
