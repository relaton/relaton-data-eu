    attiecībā uz īpašiem pasākumiem, kas nepieciešami, lai piesaistītu investīcijas
    dalībvalstu veselības aprūpes sistēmās un citos to ekonomikas sektoros, reaģējot
    uz Covid-19 uzliesmojumu (Investīciju iniciatīva reaģēšanai uz koronavīrusu)
  type: main
