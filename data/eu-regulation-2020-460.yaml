    glede posebnih ukrepov za mobilizacijo naložb v zdravstvenih sistemih držav
    članic in v drugih sektorjih njihovih gospodarstev v odziv na izbruh COVID-19
    (Naložbena pobuda v odziv na koronavirus)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2020/460 del Parlamento Europeo y del Consejo de 30 de
