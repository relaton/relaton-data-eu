- language: en
  script: Latn
  content: Regulation (EU) 2020/460 of the European Parliament and of the Council
    of 30 March 2020 amending Regulations (EU) No 1301/2013, (EU) No 1303/2013 and
    (EU) No 508/2014 as regards specific measures to mobilise investments in the healthcare
    systems of Member States and in other sectors of their economies in response to
    the COVID-19 outbreak (Coronavirus Response Investment Initiative)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/460 du Parlement européen et du Conseil du 30 mars
    2020 modifiant les règlements (UE) no 1301/2013, (UE) no 1303/2013 et (UE) no
    508/2014 en ce qui concerne des mesures spécifiques visant à mobiliser des investissements
    dans les systèmes de soins de santé des États membres et dans d’autres secteurs
    de leur économie en réaction à la propagation du COVID-19 (initiative d’investissement
    en réaction au coronavirus)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2020/460 des Europäischen Parlaments und des Rates vom
    30. März 2020 zur Änderung der Verordnungen (EU) Nr. 1301/2013, (EU) Nr. 1303/2013
    und (EU) Nr. 508/2014 im Hinblick auf besondere Maßnahmen zur Mobilisierung von
    Investitionen in die Gesundheitssysteme der Mitgliedstaaten und in andere Sektoren
    von deren Volkswirtschaften zur Bewältigung des COVID-19-Ausbruchs (Investitionsinitiative
    zur Bewältigung der Coronavirus-Krise)
  type: main
