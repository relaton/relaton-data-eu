    for så vidt angår særlige foranstaltninger til mobilisering af investeringer
    i medlemsstaternes sundhedssystemer og andre dele af deres økonomier som reaktion
    på covid-19-udbruddet (investeringsinitiativ som reaktion på coronavirusset)
  type: main
- language: el
  script: Grek
