    oraz (UE) nr 508/2014 w odniesieniu do szczególnych środków w celu uruchomienia
    inwestycji w systemach ochrony zdrowia państw członkowskich oraz w innych sektorach
    ich gospodarek w odpowiedzi na epidemię COVID-19 (Inicjatywa inwestycyjna w odpowiedzi
    na koronawirusa)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2020/460 do Parlamento Europeu e do Conselho de 30 de
    março de 2020 que altera os Regulamentos (UE) n.o 1301/2013, (UE) n.o 1303/2013
    e (UE) n.o 508/2014 no respeitante a medidas específicas para mobilizar investimentos
    nos sistemas de saúde dos Estados-Membros e noutros setores das suas economias
    em resposta ao surto de COVID-19 (Iniciativa de Investimento Resposta ao Coronavírus)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2020/460 al Parlamentului European și al Consiliului
    din 30 martie 2020 de modificare a Regulamentelor (UE) nr. 1301/2013, (UE) nr.
    1303/2013 și (UE) nr. 508/2014 în ceea ce privește anumite măsuri specifice
    menite să mobilizeze investiții în sistemele de sănătate ale statelor membre
    și în alte sectoare ale economiilor acestora ca reacție la epidemia de COVID-19
    (Inițiativa pentru investiții ca reacție la coronavirus)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2020/460 z 30. marca 2020,
