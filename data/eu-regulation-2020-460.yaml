    № 508/2014 във връзка със специални мерки за мобилизиране
    на инвестиции в системите на здравеопазване
    на държавите членки и в други сектори на техните
    икономики в отговор на избухването на COVID-19
    (Инвестиционна инициатива в отговор на коронавируса)
  type: main
