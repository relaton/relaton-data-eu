    n.o 1303/2013 y (UE) n.o 508/2014, en lo relativo a medidas específicas para
    movilizar inversiones en los sistemas de atención sanitaria de los Estados miembros
    y en otros sectores de sus economías, en respuesta al brote de COVID‐19 (Iniciativa
    de inversión en respuesta al coronavirus)
  type: main
- language: sv
  script: Latn
