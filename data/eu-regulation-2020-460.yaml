    obzirom na posebne mjere za mobilizaciju ulaganja u zdravstvene sustave država
    članica i u druge sektore njihovih gospodarstava u odgovoru na izbijanje bolesti
    COVID-19 (Investicijska inicijativa kao odgovor na koronavirus)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2020/460 rendelete (2020. március
