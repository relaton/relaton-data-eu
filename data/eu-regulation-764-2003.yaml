title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 764/2003 of 30 April 2003 suspending for
    a period of three months, with regard to sugar of CN codes 1701 and 1702 imported
    from Serbia and Montenegro, the arrangements provided for in Council Regulation
    (EC) No 2007/2000 introducing exceptional trade measures for countries and territories
    participating in or linked to the European Union's Stabilisation and Association
    process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 764/2003 de la Commission du 30 avril 2003 suspendant,
    pour une durée de trois mois, en ce qui concerne le sucre des codes NC 1701 et
    1702 importé de Serbie-et-Monténégro, le régime défini dans le règlement
    (CE) n° 2007/2000 du Conseil introduisant des mesures commerciales exceptionnelles
    en faveur des pays et territoires participant et liés au processus de stabilisation
    et d'association mis en œuvre par l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 764/2003 der Kommission vom 30. April 2003 zur Aussetzung
    der gemäß der Verordnung (EG) Nr. 2007/2000 des Rates zur Einführung besonderer
    Handelsmaßnahmen für die am Stabilisierungs- und Assoziierungsprozess der Europäischen
    Union teilnehmenden oder damit verbundenen Länder und Gebiete gewährten Präferenzregelung
    für aus Serbien und Montenegro eingeführten Zucker der KN-Codes 1701 und 1702
    während eines Zeitraums von 3 Monaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 764/2003 af 30. april 2003 om suspension
    i tre måneder af ordningerne i Rådets forordning (EF) nr. 2007/2000 om exceptionelle
    handelsforanstaltninger for lande og territorier, der deltager i eller er knyttet
    til Den Europæiske Unions stabiliserings- og associeringsproces, for så vidt
    angår sukker henhørende under KN-kode 1701 og 1702, der indføres fra Serbien
    og Montenegro
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 764/2003 της Επιτροπής,
    της 30ής Απριλίου 2003, για την αναστολή, για περίοδο
    τριών μηνών, όσον αφορά τη ζάχαρη που υπάγεται
    στους κωδικούς ΣΟ 1701 και 1702 και εισάγεται από
    τη Σερβία και Μαυροβούνιο, των διακανονισμών
    που προβλέπει ο κανονισμός (ΕΚ) αριθ. 2007/2000 του
    Συμβουλίου για την εισαγωγή έκτακτων εμπορικών
    μέτρων για τις χώρες και τα εδάφη που συμμετέχουν
    ή συνδέονται με τη διαδικασία σταθεροποίησης
    και σύνδεσης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 764/2003, annettu 30 päivänä huhtikuuta 2003,
    poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan unionin vakautus-
    ja assosiaatioprosessiin osallistuville tai siihen yhteydessä oleville maille
    ja alueille annetun neuvoston asetuksen (EY) N:o 2007/2000 soveltamisen lykkäämisestä
    Serbia ja Montenegrosta tuotavan yhdistetyn nimikkeistön nimikkeisiin 1701 ja
    1702 kuuluvan sokerin osalta kolmen kuukauden ajaksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 764/2003 della Commissione, del 30 aprile 2003, che
    sospende per tre mesi, per quanto riguarda lo zucchero classificato ai codici
    NC 1701 e 1702 importato dalla Serbia e Montenegro, i regimi stabiliti nel regolamento
    (CE) n. 2007/2000 del Consiglio recante misure commerciali eccezionali applicabili
    ai paesi e territori che partecipano o sono legati al processo di stabilizzazione
    e di associazione dell'Unione europea
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 764/2003 van de Commissie van 30 april 2003 houdende
    schorsing voor een periode van drie maanden, met betrekking tot uit Servië en
    Montenegro ingevoerde suiker van GN-codes 1701 en 1702, van de regelingen ingesteld
    bĳ Verordening (EG) nr. 2007/2000 van de Raad tot vaststelling van uitzonderlĳke
    handelsmaatregelen ten behoeve van de landen en gebieden die deelnemen aan of
    verbonden zĳn met het stabilisatie- en associatieproces van de Europese Unie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 764/2003 da Comissão, de 30 de Abril de 2003, que
    suspende, por um período de três meses, no que se refere ao açúcar dos códigos
    NC 1701 e 1702 importado da Sérvia e Montenegro, o regime previsto no Regulamento
    (CE) n.° 2007/2000 do Conselho, que adopta medidas comerciais excepcionais em
    favor dos países e territórios que participam ou estão ligados ao processo
    de estabilização e associação da União Europeia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 764/2003 de la Comisión, de 30 de abril de 2003, por
    el que se suspenden durante un período de tres meses, en lo tocante al azúcar
    de los códigos NC 1701 y 1702 importado de Serbia y Montenegro, los acuerdos
    previstos en el Reglamento (CE) n° 2007/2000 del Consejo por el que se introducen
    medidas comerciales excepcionales para los países y territorios participantes
    o vinculados al Proceso de estabilización y asociación de la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 764/2003 av den 30 april 2003 om tillfälligt
    upphävande under tre månader, för socker, enligt KN-numren 1701 och 1702 som
    importeras från Serbien och Montenegro, av den ordning som fastställs i rådets
    förordning (EG) nr 2007/2000 beträffande införande av särskilda handelsåtgärder
    för länder och territorier som deltar i eller är knutna till Europeiska unionens
    stabiliserings- och associeringsprocess
