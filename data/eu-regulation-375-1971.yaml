title:
- language: en
  script: Latn
  content: Regulation (EEC) No 375/71 of the Commission of 22 February 1971 amending,
    in respect of Hungary, Regulation (EEC) No 1054/68 determining the list of agencies
    certifying the admissibility to certain tariff headings of certain milk products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 375/71 de la Commission, du 22 février 1971, complétant,
    en ce qui concerne la Hongrie, le règlement (CEE)" n° 1054/68 établissant la
    liste des organismes émetteurs de certificats destinés à permettre l' admission
    de certains produits laitiers en provenance des pays tiers dans certaines positions
    tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 375/71 der Kommission vom 22. Februar 1971 zur Ergänzung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern in bezug auf Ungarn
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 375/71 af 22. februar 1971 der, vedrørende
    Ungarn supplerer forordning (EØF) nr. 1054/68 om udarbejdelse af en fortegnelse
    over de organer, der er kompetente til udstedelse af certifikater vedrørende
    visse fra tredjelande udførte mælkeprodukters henførelse under bestemte toldpositioner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 375/71 della Commissione, del 22 febbraio 1971, che
    completa, per quanto concerne l' Ungheria, il regolamento (CEE) n. 1054/68 che
    stabilisce l' elenco degli organismi emittenti dei certificati destinati a permettere
    l' ammissione di alcune voci tariffarie di alcuni prodotti lattiero-caseari in
    provenienza dei paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 375/71 van de Commissie van 22 februari 1971 tot
    aanvulling met betrekking tot Hongarije van Verordening (EEG) nr. 1054/68 houdende
    vaststelling van de lijst van organisaties voor de afgifte van certificaten ten
    behoeve van de indeling van sommige zuivelprodukten uit derde landen onder bepaalde
    tariefposten
  type: main
