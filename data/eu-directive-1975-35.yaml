---
id: EUDirective197535
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 75/35/EEC of 17 December 1974 extending the scope of
    Directive No 64/221/EEC on the coordination of special measures concerning the
    movement and residence of foreign nationals which are justified on grounds of
    public policy, public security or public health to include nationals of a Member
    State who exercise the right to remain in the territory of another Member State
    after having pursued therein an activity in a self-employed capacity
  type: main
- language: fr
  script: Latn
  content: Directive 75/35/CEE du Conseil, du 17 décembre 1974, étendant le champ
    d'application de la directive 64/221/CEE pour la coordination des mesures spéciales
    aux étrangers en matière de déplacement et de séjour justifiées par des raisons
    d'ordre public, de sécurité publique et de santé publique, aux ressortissants
    d'un État membre qui exercent le droit de demeurer sur le territoire d'un autre
    État membre après y avoir exercé une activité non salariée
  type: main
- language: de
  script: Latn
  content: Richtlinie 75/35/EWG des Rates vom 17. Dezember 1974 zur Erweiterung des
    Geltungsbereichs der Richtlinie 64/221/EWG zur Koordinierung der Sondervorschriften
    für die Einreise und den Aufenthalt von Ausländern, soweit sie aus Gründen
    der öffentlichen Ordnung, Sicherheit oder Gesundheit gerechtfertigt sind, auf
    die Staatsangehörigen eines Mitgliedstaats, die von dem Recht, nach Beendigung
    einer selbständigen Tätigkeit im Hoheitsgebiet eines Mitgliedstaats zu verbleiben,
    Gebrauch machen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 17. prosince 1974, kterou se oblast působnosti směrnice
    64/221/EHS o koordinaci zvláštních opatření týkajících se pohybu a pobytu
    cizích státních příslušníků, která byla přijata z důvodů veřejného
    pořádku, veřejné bezpečnosti nebo veřejného zdraví, rozšiřuje na státní
    příslušníky členského státu požívající právo zůstat po skončení
    samostatně výdělečné činnosti na území jiného členského státu
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 75/35/EØF af 17. december 1974 om udvidelse af anvendelsesområdet
    for direktiv 64/221/EØF om samordning af de særlige foranstaltninger, der gælder
    for udlændinge med hensyn til rejse og ophold, og som er begrundet i hensynet
    til den offentlige orden, sikkerhed og sundhed, til også at omfatte de statsborgere
    i en medlemsstat, som udøver retten til at blive boende på en anden medlemsstats
    område efter dér at have udøvet selvstændig erhvervsvirksomhed
  type: main
- language: el
  script: Grek
  content: Οδηγία 75/35/ΕΟΚ του Συμβουλίου της 17ης Δεκεμβρίου
    1974 περί επεκτάσεως της ισχύος της οδηγίας 64/221/ΕΟΚ
    «περί του συντονισμού των ειδικών μέτρων για
    τη διακίνηση και τη διαμονή αλλοδαπών, τα οποία
    δικαιολογούνται για λόγους δημοσίας τάξεως,
    δημοσίας ασφαλείας ή δημοσίας υγείας, στους
    υπηκόους ενός κράτους μέλους που ασκούν το
    δικαίωμα παραμονής στην επικράτεια άλλου κράτους
    μέλους μετά την άσκηση σε αυτό μη μισθωτής
    δραστηριότητας»
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 17. detsember 1974, millega laiendatakse direktiivi
    64/221/EMÜ (välisriigi kodanike liikumise ja elukohaga seonduvate avaliku korra,
    julgeoleku või tervishoiu seisukohalt õigustatud erimeetmete kooskõlastamise
    kohta) reguleerimisala liikmesriigi kodanikele, kes kasutavad õigust jääda
    elama teise liikmesriigi territooriumile pärast füüsilisest isikust ettevõtjana
    tegutsemist selles riigis
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 75/35/ETY, annettu 17 päivänä joulukuuta 1974,
    ulkomaalaisten liikkumista ja oleskelua koskevien yleiseen järjestykseen ja turvallisuuteen
    sekä kansanterveyteen perustuvien erityistoimenpiteiden yhteensovittamisesta
    annetun direktiivin 64/221/ETY soveltamisalan laajentamisesta koskemaan niitä
    jäsenvaltion kansalaisia, jotka käyttävät oikeuttaan jäädä toisen jäsenvaltion
    alueelle toimittuaan siellä itsenäisinä ammatinharjoittajina
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1974. december 17.) a külföldiek mozgására
    és tartózkodására vonatkozó, a közérdek, a közbiztonság vagy a közegészségügy
    szempontjaiból indokolt külön intézkedések összehangolásáról szóló
    64/221/EGK irányelv hatályának az önálló vállalkozási tevékenységet
    folytató és a tevékenység befejezése után az adott tagállam területén
    maradáshoz való jogot gyakorló tagállami állampolgárokra való kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 75/35/CEE del Consiglio, del 17 dicembre 1974, che estende il
    campo di applicazione della direttiva 64/221/CEE per il coordinamento dei provvedimenti
    speciali riguardanti il trasferimento e il soggiorno degli stranieri, giustificati
    da motivi di ordine pubblico, di pubblica sicurezza e di sanità pubblica, ai
    cittadini di uno Stato membro che esercitano il diritto di rimanere nel territorio
    di un altro Stato membro dopo avervi svolto un'attività non salariata
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 75/35/EEK (1974. gada 17. decembris), ar ko paplašina
    darbības jomu Direktīvai Nr. 64/221/EEK par tādu īpašu pasākumu saskaņošanu
    attiecībā uz ārvalstnieku pārvietošanos un dzīvesvietu, kas ir attaisnojami
    ar sabiedrisko kārtību, valsts drošību un veselības aizsardzību, iekļaujot
    tos dalībvalsts pilsoņus, kuri izmanto tiesības palikt uz dzīvi citā dalībvalstī
    pēc tam, kad tajā ir veikta darbība pašnodarbinātas personas statusā
  type: main
- language: lt
  script: Latn
  content: 1974 m. gruodžio 17 d. Tarybos Direktyva išplečianti Direktyvos 64/221/EEB
    dėl užsienio piliečių judėjimui ir gyvenimui skirtų specialių priemonių,
    pateisinamų viešosios tvarkos, visuomenės saugumo ar jos sveikatos sumetimais,
    derinimo taikymo sritį, kad ji būtų taikoma ir valstybės narės piliečiams,
    besinaudojantiems teise pasilikti kitos valstybės narės teritorijoje nutraukus
    savarankišką darbą
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tas-17 ta' Diċembru 1974 li testendi l-firxa
    tad-Direttiva Nru 64/221/KEE dwar il-koordinazzjoni ta' miżuri speċjali rigward
    il-moviment u r-residenza ta' ċittadini barranin li huma ġġustifikati għar-raġunijiet
    ta' politika pubblika, sigurtà pubblika jew saħħa pubblika sabiex tinkludi
    ċ-ċittadini ta' l-Istati Membri li jeżerċitaw id-dritt li jibqgħu fit-territorju
    ta' Stat Membru ieħor wara li jkunu segwew fih attività fil-kapaċità ta' persuni
    li jaħdmu għal rashom
  type: main
- language: nl
  script: Latn
  content: Richtlijn 75/35/EEG van de Raad van 17 december 1974 houdende uitbreiding
    van de werkingssfeer van Richtlijn nr. 64/221/EEG voor de coördinatie van de
    voor vreemdelingen geldende bijzondere maatregelen ten aanzien van verplaatsing
    en verblijf die gerechtvaardigd zijn uit hoofde van de openbare orde, de openbare
    veiligheid en de volksgezondheid, tot de onderdanen van een Lid-Staat die het
    recht op voortgezet verblijf op het grondgebied van een andere Lid-Staat uitoefenen
    na er een werkzaamheid anders dan in loondienst te hebben uitgeoefend
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 17 grudnia 1974 r. rozszerzająca zakres dyrektywy
    nr 64/221/EWG w sprawie koordynacji specjalnych środków dotyczących przemieszczania
    się i pobytu cudzoziemców, uzasadnionych względami porządku publicznego, bezpieczeństwa
    publicznego lub zdrowia publicznego w celu włączenia obywateli jednego Państwa
    Członkowskiego, którzy korzystają z prawa pozostawania na terytorium innego
    Państwa Członkowskiego po zakończeniu prowadzenia na tym terytorium działalności
    na własny rachunek
  type: main
- language: pt
  script: Latn
  content: Directiva 75/35/CEE do Conselho, de 17 de Dezembro de 1974, que alarga
    o âmbito de aplicação da Directiva 64/221/CEE de coordenação das medidas
    relativas a estrangeiros em matéria de deslocação e permanência justificadas
    por razões de ordem pública, segurança pública e saúde pública, aos nacionais
    de um Estado- membro que exerçam o direito de permanecer em território de outro
    Estado-Membro após terem exercido neste Estado uma actividade não assalariada
  type: main
- language: sk
  script: Latn
  content: Smernica Rady zo 17. decembra 1974 rozširujúca rozsah smernice č. 64/221/EHS
    o koordinácii osobitných opatrení o pohybe a pobyte cudzincov, prijatých z
    dôvodov verejného poriadku, verejnej bezpečnosti alebo verejného zdravia,
    aby zahŕňala štátnych príslušníkov členského štátu, ktorí si uplatnia
    právo zostať na území iného členského štátu po ukončení samostatnej
    zárobkovej činnosti v danom štáte
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 17. decembra 1974 o razširitvi obsega Direktive
    št. 64/221/EGS o usklajevanju posebnih ukrepov, ki zadevajo gibanje in prebivanje
    tujih državljanov, utemeljenih z javno politiko, javno varnostjo ali zdravje
    prebivalstva, tako da vključujejo državljane države članice, ki uresničujejo
    pravico, da ostanejo na ozemlju druge države članice, po tem, ko so tam opravljali
    dejavnost kot samozaposlene osebe
  type: main
- language: es
  script: Latn
  content: Directiva 75/35/CEE del Consejo, de 17 de diciembre de 1974, por la que
    se extiende el campo de aplicación de la Directiva 64/221/CEE para la coordinación
    de las medidas especiales para los extranjeros en materia de desplazamiento y
    de residencia, justificadas por razones de orden público, seguridad pública
    y salud pública, a los nacionales de cualquier Estado Miembro que ejerzan el
    derecho de permanecer en el territorio de otro Estado Miembro después de haber
    ejercido en él una actividad no asalariada
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 75/35/EEG av den 17 december 1974 om utvidgande av tillämpningsområdet
    för direktiv nr 64/221/EEG om samordningen av särskilda åtgärder som gäller
    utländska medborgares rörlighet och bosättning och som är berättigade med
    hänsyn till allmän ordning, säkerhet eller hälsa till att även omfatta medborgare
    i en medlemsstat som begagnar sig av rätten att stanna kvar inom en annan medlemsstats
    territorium efter att ha verkat där som egna företagare
  type: main
