title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 897/83 of 15 April 1983 re-establishing
    the levying of customs duties on knives, falling within subheading 82.09 A and
    originating in Singapore, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 897/83 de la Commission du 15 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux couteaux, de la sous-position
    82.09 A du tarif douanier commun, originaires de Singapour, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 897/83 der Kommission vom 15. April 1983 zur Wiedereinführung
