    dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 897/83 af 15. april 1983 om genindførelse
