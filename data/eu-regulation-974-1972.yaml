    destinato all'esportazione e detenuto dall'organismo d'intervento francese di
    cui al regolamento (CEE) n. 279/72
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 974/72 van de Commissie van 12 mei 1972 houdende
