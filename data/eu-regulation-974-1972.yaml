    zum Verkauf von Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der
    französischen Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 974/72 della Commissione, del 12 maggio 1972, relativo
