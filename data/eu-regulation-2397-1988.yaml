title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2397/88 of 29 July 1988 amending for the
    1988/89 marketing year the date of taking effect of the operative event creating
    entitlement to production aid and the rate applicable to the minimum price for
    certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2397/88 de la Commission du 29 juillet 1988 modifiant
    pour la campagne 1988/1989 la date de prise d' effet du fait générateur du droit
    à l' aide à la production et le taux applicable au prix minimal pour certains
    produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2397/88 der Kommission vom 29. Juli 1988 zur Änderung
    des im Wirtschaftsjahr 1988/89 geltenden Zeitpunkts, zu dem der den Anspruch auf
    die Produktionsbeihilfe begründende Tatbestand und der auf den Mindestpreis für
    bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse anwendbare Umrechnungskurs
    wirksam werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2397/88 af 29. juli 1988 om ændring
    for produktionsåret 1988/89 af den dato, hvor retten til produktionsstøtte indtræder,
    samt af den kurs, der anvendes på minimumsprisen for visse produkter forarbejdet
    på basis af frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2397/88 της Επιτροπής
    της 29ης Ιουλίου 1988 που τροποποιεί για την περίοδο
    εμπορίας 1988/89 την ημερομηνία δημιουργίας της
    γενεσιουργού αιτίας του δικαιώματος ενίσχυσης
    στην παραγωγή και το συντελεστή που εφαρμόζεται
    στην ελάχιστη τιμή για ορισμένα μεταποιημένα
    προϊόντα με βάση τα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2397/88 della Commissione del 29 luglio 1988 che modifica,
    per la campagna 1988/1989, la data alla quale acquista efficacia il fatto generatore
    del diritto all' aiuto alla produzione e il tasso applicabile al prezzo minimo
    per taluni prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2397/88 van de Commissie van 29 juli 1988 waarbij,
    voor het verkoopseizoen 1988/1989, de datum waarop het recht op de produktiesteun
    ontstaat en de op de minimumprijs toe te passen koers worden gewijzigd voor bepaalde
    op basis van groenten en fruit verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2397/88 da Comissão de 29 de Julho de 1988 que
    altera, para a campanha de 1988/1989, a data de produção de efeitos do facto
    criador do direito à ajuda à produção e a taxa aplicável ao preço mínimo
    para determinados produtos transformados à base de frutas e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2397/88 de la Comisión de 29 de julio de 1988 por
    el que se modifican, para la campaña 1988/89, la fecha en que surte efecto el
    hecho generador del derecho a la ayuda a la producción y el tipo aplicable al
    precio mínimo de determinados productos transformados a base de frutas y hortalizas
  type: main
