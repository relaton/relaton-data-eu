title:
- language: en
  script: Latn
  content: '88/638/EEC: Commission Decision of 16 November 1988 accepting undertakings
    relating to the anti-dumping proceeding concerning certain plain paper photocopiers
    assembled in the Community by Matsushita Business Machine (Europe) GmbH and Toshiba
    Systèmes (France) SA'
  type: main
- language: fr
  script: Latn
  content: '88/638/CEE: Décision de la Commission du 16 novembre 1988 portant acceptation
    d''engagements dans le cadre de la procédure antidumping concernant certains
    photocopieurs à papier ordinaire assemblés dans la Communauté par Matsushita
    Business Machine (Europe) GmbH et Toshiba Systèmes (France) SA'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 16. November 1988 ueber die Annahme von Verpflichtungen
    im Rahmen des Antidumpingverfahrens betreffend bestimmte Normalpapierkopierer,
    die in der Gemeinschaft von Matsushita Business Machine (Europe) GmbH und Toshiba
    Systèmes (Frankreich) SA montiert oder hergestellt werden (88/638/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 16. november 1988 om godtagelse af tilsagn
    i forbindelse med antidumpingproceduren vedroerende visse PPC-fotokopieringsmaskiner,
    som samles i Faellesskabet af Matsushita Business Machine (Europe) GmbH og Toshiba
    Systèmes (France) SA (88/638/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 16ης Νοεμβρίου
    1988 για την αποδοχή της ανάληψης υποχρεώσεων
    που προτάθηκε όσον αφορά τη διαδικασία αντιντάμπινγκ
    σχετικά με τις εισαγωγές συσκευών φωτοαντιγραφής
    που χρησιμοποιούν συνηθισμένο χαρτί που συναρμολογούνται
    στην Κοινότητα από τις Matsushita Business Machine ( Europe
    ) GmbH και Toshiba Systemes ( Γαλλία ) SA ( 88/638/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 16 novembre 1988 recante accettazione degli
    impegni nell'ambito della procedura antidumping relativa ad alcune fotocopiatrici
    a carta comune assemblate nella Comunità dalla Matsushita Business Machine (Europe)
    GmbH e dalla Toshiba Systèmes (France) SA (88/638/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 16 november 1988 houdende aanvaarding van
    verbintenissen aangegaan in het kader van de antidumpingprocedure betreffende
    bepaalde soorten fotokopieerapparaten voor gewoon papier, geassembleerd in de
    Gemeenschap door Matsushita Business Machine (Europe) GmbH en Toshiba Systèmes
    (France) SA (88/638/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 16 de Novembro de 1988 que aceita compromissos relativos
    ao processo anti-dumping respeitante a certos aparelhos fotocopiadores de papel
    normal montados na Comunidade pela Matsushita Business Machine Europe GmbH e pela
    Toshiba Systèmes (France) SA (88/638/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 16 de noviembre de 1988 por la que se aceptan
    los compromisos relacionados con el procedimiento antidumping relativo a determinadas
    fotocopiadoras de papel normal montadas en la Comunidad por Matsushita Business
    Machine (Europe) GmbH y Toshiba Systèmes (France) SA (88/638/CEE)
