  content: Commission Regulation (EEC) No 3693/85 of 23 December 1985 laying down
    rules for calculating withdrawal prices and fixing the withdrawal prices, for
    the 1986 fishing year, for the fishery products listed in Annex I (A) and (D)
    to Regulation (EEC) No 3796/81 and for certain products landed in areas very distant
    from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3693/85 de la Commission du 23 décembre 1985 portant
