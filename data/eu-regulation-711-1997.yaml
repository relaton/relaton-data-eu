title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 711/97 of 22 April 1997 amending, for the second
    time, Regulation (EC) No 390/97 fixing, for certain fish stocks and groups of
    fish stocks, the total allowable catches for 1997 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 711/97 du Conseil du 22 avril 1997 modifiant pour la
    deuxième fois le règlement (CE) nº 390/97 fixant, pour certains stocks et groupes
    de stocks de poissons, les totaux admissibles des captures pour 1997 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 711/97 des Rates vom 22. April 1997 zur zweiten Änderung
    der Verordnung (EG) Nr. 390/97 zur Festlegung der zulässigen Gesamtfangmengen
    und entsprechender Fangbedingungen für bestimmte Fischbestände oder -bestandsgruppen
    (1997)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 711/97 af 22. april 1997 om anden ændring
    af forordning (EF) nr. 390/97 om fastsættelse for 1997 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 711/97 του Συμβουλίου
    της 22ας Απριλίου 1997 για τη δεύτερη τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 390/97 περί καθορισμού,
    για ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπόμενων αλιευμάτων
    (TAC) για το 1997, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 711/97, annettu 22 päivänä huhtikuuta 1997,
    eräiden kalakantojen ja kalakantaryhmien osalta vuodeksi 1997 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
    annetun neuvoston asetuksen (EY) N:o 390/97 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento(CE) n. 711/97 del Consiglio del 22 aprile 1997 recante seconda
    modifica del regolamento (CE) n. 390/97 che stabilisce, per alcuni stock o gruppi
    di stock ittici, il totale ammissibile di catture (TAC) per il 1997 e talune condizioni
    cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 711/97 van de Raad van 22 april 1997 houdende tweede
    wijziging van Verordening (EG) nr. 390/97 inzake de vaststelling van de voor 1997
    geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden,
    alsmede bepaalde bij de visserij in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 711/97 do Conselho de 22 de Abril de 1997 que altera,
    pela segunda vez, o Regulamento (CE) nº 390/97 que fixa os totais admissíveis
    de capturas para 1997 e certas condições em que podem ser pescadas determinadas
    unidades populacionais ou grupos de unidades populacionais de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 711/97 del Consejo de 22 de abril de 1997 que modifica
    por segunda vez el Reglamento (CE) nº 390/97 por el que se fijan los totales
    admisibles de capturas (TAC) de determinadas poblaciones y grupos de poblaciones
    de peces para 1997 y determinadas condiciones en que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 711/97 av den 22 april 1997 om ändring för
    andra gången av förordning (EG) nr 390/97 om fastställande, för vissa fiskbestånd
    och grupper av fiskbestånd, av totala tillåtna fångstmängder för år 1997
    och vissa villkor för fångsten
  type: main
