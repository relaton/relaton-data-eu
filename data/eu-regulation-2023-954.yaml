- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/954 of 12 May 2023 correcting
    Annexes XIII, XIV and XXII to Implementing Regulation (EU) 2021/404 as regards
    the lists of third countries, territories or zones thereof authorised for the
    entry into the Union of consignments of fresh meat of ungulates, poultry and game
    birds, and certain species and categories of animals, germinal products and products
    of animal origin for which the Union is not the final destination
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/954 de la Commission du 12 mai 2023
    rectifiant les annexes XIII, XIV et XXII du règlement d’exécution (UE) 2021/404
    en ce qui concerne les listes des pays tiers et territoires ou des zones de pays
    tiers ou territoires en provenance desquels l’entrée dans l’Union d’envois
    de viandes fraîches d’ongulés, de volailles, de gibier à plumes, et de certaines
    espèces et catégories d’animaux, de produits germinaux et de produits d’origine
    animale dont l’Union n’est pas la destination finale est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/954 der Kommission vom 12. Mai 2023
