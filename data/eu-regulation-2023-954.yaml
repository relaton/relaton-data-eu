    (EU) 2021/404 hinsichtlich der Listen der Drittländer, Gebiete oder Zonen derselben,
    aus denen der Eingang in die Union von Sendungen von frischem Fleisch von Huftieren,
    Geflügel und Wildgeflügel sowie von bestimmten Arten und Kategorien von Tieren,
    Zuchtmaterial und Erzeugnissen tierischen Ursprungs, für die die Union nicht
    der endgültige Bestimmungsort ist, zulässig ist
  type: main
