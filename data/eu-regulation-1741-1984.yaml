title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1741/84 of 21 June 1984 amending Regulation
    (EEC) No 649/78 as regards the level of the processing security fixed for intervention
    butter intended for direct consumption in the form of concentrated butter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1741/84 de la Commission du 21 juin 1984 modifiant
    le règlement (CEE) no 649/78 en ce qui concerne le niveau de la caution garantissant
    la transformation du beurre d' intervention destiné à la consommation directe
    sous forme de beurre concentré
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1741/84 der Kommission vom 21. Juni 1984 zur Änderung
    der Verordnung (EWG) Nr. 649/78 hinsichtlich der Höhe der Verarbeitungskaution
    für Interventionsbutter, die zum unmittelbaren Verbrauch in Form von Butterreinfett
    bestimmt ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1741/84 af 21. juni 1984 om ændring
    af forordning (EØF) nr. 649/78 for så vidt angår størrelsen af forarbejdningssikkerheden
    for interventionssmør, bestemt til umiddelbart forbrug i form af koncentreret
    smør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1741/84 της Επιτροπής
    της 21ης Ιουνίου 1984 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 649/78 όσον αφορά το ύψος της ασφάλειας
    για μεταποίηση που καθορίζεται για το βούτυρο
    παρέμβασης που προορίζεται για άμεση κατανάλωση
    υπό μορφή συμπυκνωμένου βουτύρου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1741/84 della Commissione del 21 giugno 1984 che modifica
    il regolamento (CEE) n. 649/78 per quanto concerne il livello della cauzione di
    trasformazione fissato per il burro d' intervento destinato al consumo diretto
    sotto forma di burro concentrato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1741/84 van de Commissie van 21 juni 1984 tot wijziging
    van Verordening (EEG) nr. 649/78 ten aanzien van de hoogte van de verwerkingswaarborg
    die is vastgesteld door interventieboter bestemd voor onmiddellijk verbruik in
    de vorm van boterconcentraat
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1741/84 da Comissão, de 21 de Junho de 1984, que
    altera o Regulamento (CEE) n.° 649/78 no que diz respeito ao nível da caução
    que garante a transformação da manteiga de intervenção destinada ao consumo
    directo sob a forma de manteiga concentrada
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1741/84 de la Comisión, de 21 de junio de 1984, por
    el que se modifica el Reglamento (CEE) n° 649/78 en lo referente al nivel de
    la fianza que garantiza la transformación de la mantequilla de intervención
    destinada al consumo directo en forma de mantequilla concentrada
  type: main
