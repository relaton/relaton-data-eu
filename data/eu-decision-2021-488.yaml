title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/488 of 22 March 2021 amending
    Implementing Decisions (EU) 2020/174 and (EU) 2020/1167 as regards the use of
    the approved innovative technologies in certain passenger cars and in light commercial
    vehicles capable of running on liquefied petroleum gas, compressed natural gas
    and E85
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/488 de la Commission du 22 mars 2021
    modifiant les décisions d’exécution (UE) 2020/174 et (UE) 2020/1167 en ce
    qui concerne l’utilisation des technologies innovantes approuvées dans certaines
    voitures particulières et dans les véhicules utilitaires légers capables de
    fonctionner au gaz de pétrole liquéfié, au gaz naturel comprimé et au E85
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/488 der Kommission vom 22. März 2021
    zur Änderung der Durchführungsbeschlüsse (EU) 2020/174 und (EU) 2020/1167 im
    Hinblick auf die Verwendung der genehmigten innovativen Technologien in bestimmten
    Personenkraftwagen und in leichten Nutzfahrzeugen, die mit Flüssiggas, komprimiertem
    Erdgas und E85 betrieben werden können
  type: main
- language: bg
