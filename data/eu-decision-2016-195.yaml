title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2016/195 of 14 August 2015 on State aid measures
    SA.33083 (12/C) (ex 12/NN) implemented by Italy providing for reduced taxes and
    contributions linked to natural disasters (all sectors except agriculture) and
    SA.35083 (12/C) (ex 12/NN), implemented by Italy providing for reduced taxes and
    contributions linked to the earthquake in Abruzzo in 2009 (all sectors except
    agriculture) (notified under document C(2015) 5549)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/195 de la Commission du 14 août 2015 concernant la
    mesure SA.33083 (12/C) (ex 12/NN) mise à exécution par l'Italie et relative
    à des réductions d'impôts et de cotisations liées à des calamités naturelles
    (tous les secteurs à l'exception du secteur agricole)] et la mesure SA.35083
    (12/C) (ex 12/NN) mise à exécution par l'Italie et relative à des réductions
    d'impôts et de cotisations liées au tremblement de terre de 2009 dans les Abruzzes
    (tous les secteurs à l'exception du secteur agricole) [notifiée sous le numéro
    C(2015) 5549]
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/195 der Kommission vom 14. August 2015 über die Massnahmen
    SA.33083 (12/C) (ex 12/NN) (die Italien durchgeführt hat, über ermäßigte Steuern
    und Versicherungsbeiträge im Zusammenhang mit Naturkatastrophen (alle Wirtschaftszweige
    außer Landwirtschaft)) und SA.35083 (12/C) (ex 12/NN) (die Italien durchgeführt
    hat, über ermäßigte Steuern und Versicherungsbeiträge im Zusammenhang mit
    dem Erdbeben von 2009 in den Abruzzen (alle Wirtschaftszweige außer Landwirtschaft))
    (Bekanntgegeben unter Aktenzeichen C(2015) 5549)
  type: main
