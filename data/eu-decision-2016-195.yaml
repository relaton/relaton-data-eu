    samazinātus nodokļus un iemaksas saistībā ar dabas katastrofām (visās nozarēs,
    izņemot lauksaimniecību), un SA.35083 (12/C) (ex 12/NN), ko īstenojusi Itālija
    un kas paredz samazinātus nodokļus un iemaksas saistībā ar 2009. gada zemestrīci
    Abruco (visās nozarēs, izņemot lauksaimniecību) (izziņots ar dokumenta numuru
    C(2015) 5549)
  type: main
- language: lt
  script: Latn
