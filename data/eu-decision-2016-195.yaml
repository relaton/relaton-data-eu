    SA.33083 (12/C) (ex 12/NN), kurias Italija įgyvendino siekdama (visuose sektoriuose,
    išskyrus žemės ūkio) dėl gaivalinių nelaimių sumažinti mokesčius bei
    įmokas, ir SA.35083 (12/C) (ex 12/NN), kurias Italija įgyvendino siekdama (visuose
    sektoriuose, išskyrus žemės ūkio) dėl 2009 m. žemės drebėjimo Abrucuose
    sumažinti mokesčius bei įmokas (pranešta dokumentu Nr. C(2015) 5549)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2016/195 tal-14 ta' Awwissu 2015 dwar
    il-miżuri SA.33083 (12/C) (ex 2012/NN) implimentata mill-Italja u relatata ma'
    benefiċċji fiskali u kontributorji marbutin ma' diżastri naturali (li jikkonċernaw
    is-setturi kollha minbarra l-agrikultura) u SA.35083 (12/C) (ex 2012/NN) implimentata
    mill-Italja u relatata ma' benefiċċji fiskali u kontributorji marbutin mat-terremot
    tal-2009 fl-Abruzzo (li jikkonċernaw is-setturi kollha minbarra l-agrikultura)
    (notifikata bid-dokument C(2015) 5549)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2016/195 van de Commissie van 14 augustus 2015 betreffende
    de steunmaatregelen SA.33083 (12/C) (ex 12/NN) door Italië ten uitvoer gelegd
    en betreffende belasting- en premiekortingen in verband met natuurrampen (in alle
    sectoren met uitsluiting van de landbouw) en SA.35083 (12/C) (ex 12/NN) door Italië
    ten uitvoer gelegd en betreffende belasting- en premiekortingen in verband met
    de aardbeving van 2009 in de Abruzzen (in alle sectoren met uitsluiting van de
    landbouw) (Kennisgeving geschied onder nummer C(2015) 5549)
  type: main
