    obniżenie podatków i składek związanych z klęskami żywiołowymi (wszystkie
    sektory z wyjątkiem rolnictwa) oraz SA.35083 (12/C) (ex 12/NN) wdrożonych przez
    Włochy obejmujących obniżenie podatków i składek związanych z trzęsieniem
    ziemi w 2009 r. w Abruzji (wszystkie sektory z wyjątkiem rolnictwa) (notyfikowana
    jako dokument nr C(2015) 5549)
  type: main
