    às medidas SA.33083 (12/C) (ex-12/NN) [a que a Itália deu execução e que preveem
    a redução de impostos e contribuições na sequência de calamidades naturais
    (todos os setores exceto a agricultura)] e SA.35083 (12/C) (ex-12/NN) [a que a
    Itália deu execução que preveem a redução de impostos e contribuições na
    sequência do terramoto de 2009 na região de Abruzo (todos os setores exceto
    a agricultura) [notificada com o número C(2015) 5549]
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2016/195 a Comisiei din 14 august 2015 privind măsura de
    ajutor de stat SA.33083 (12/C) (ex 12/NN) pusă în aplicare de Italia care prevede
    reducerea cuantumului impozitelor și al contribuțiilor ca urmare a calamităților
    naturale (pentru toate sectoarele, cu excepția agriculturii) și măsura SA.35083
    (12/C) (ex 12/NN), pusă în aplicare de Italia care prevede reducerea cuantumului
    impozitelor și al contribuțiilor ca urmare a cutremurului care a avut loc în
    2009 în regiunea Abruzzo (pentru toate sectoarele, cu excepția agriculturii)
    [notificată cu numărul C(2015) 5549]
  type: main
