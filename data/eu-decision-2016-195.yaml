    pomoči SA.33083 (12/C) (ex 12/NN), ki jih je Italija izvedla za znižanje davkov
    in prispevkov zaradi naravnih nesreč (vsi sektorji razen kmetijstva), ter SA.35083
    (12/C) (ex 12/NN), ki jih je Italija izvedla za znižanje davkov in prispevkov
    zaradi potresa v regiji Abruzzo leta 2009 (vsi sektorji razen kmetijstva) (notificirano
    pod dokumentarno številko C(2015) 5549)
  type: main
