    och avgifter i samband med naturkatastrofer (alla sektorer utom jordbruk) och
    SA.35083 (12/C) (ex 12/NN), genomförda av Italien som innebär sänkta skatter
    och avgifter i samband med jordbävningen i Abruzzerna 2009 (alla sektorer utom
    jordbruk) [delgivet med nr C(2015) 5549]
