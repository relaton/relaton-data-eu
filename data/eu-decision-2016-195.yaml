    zníženie daní a príspevkov v nadväznosti na prírodné katastrofy (všetky
    odvetvia s výnimkou poľnohospodárstva), ako aj SA.35083 (12/C) (ex 12/NN),
    ktoré zaviedlo Taliansko a ktorými sa stanovuje zníženie daní a príspevkov
    v nadväznosti na zemetrasenie v regióne Abruzzo v roku 2009 (všetky odvetvia
    s výnimkou poľnohospodárstva) [oznámené pod číslom C(2015) 5549]
