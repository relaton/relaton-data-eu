  content: Decisión (UE) 2016/195 de la Comisión, de 14 de agosto de 2015, relativa
    a las medidas SA.33083 (12/C) (ex 12/NN) ejecutada por Italia y relativa a las
    ventajas fiscales y contributivas relacionadas con catástrofes naturales (para
    todos los sectores, con exclusión de la agricultura) y SA.35083 (12/C) (ex 12/NN)
    ejecutada por Italia y relativa a las ventajas fiscales y contributivas relacionadas
