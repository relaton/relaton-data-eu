  type: main
- language: et
  script: Latn
  content: Komisjoni otsus (EL) 2016/195, 14. august 2015, riigiabimeetmete SA.33083
    (12/C) (ex 12/NN) kohta, mida Itaalia rakendas, nähes ette maksude ja kindlustusmaksete
    vähendamise seoses loodusõnnetustega (kõik sektorid peale põllumajanduse),
    ja SA.35083 (12/C) (ex 12/NN) kohta, mida Itaalia rakendas, nähes ette maksude
    ja kindlustusmaksete vähendamise seoses maavärinaga Abruzzos aastal 2009 (kõik
    sektorid peale põllumajanduse) (teatavaks tehtud numbri C(2015) 5549 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2016/195, annettu 14 päivänä elokuuta 2015,
    valtiontukitoimenpiteistä SA.33083 (12/C) (ex 12/NN), jonka Italia on toteuttanut
    luonnonmullistuksiin liittyvien verojen ja maksujen alennuksina (kaikki alat maataloutta
    lukuun ottamatta), ja SA.35083 (12/C) (ex 12/NN), jonka Italia on toteuttanut
    Abruzzon vuoden 2009 maanjäristykseen liittyvien verojen ja maksujen alennuksina
    (kaikki alat maataloutta lukuun ottamatta) (tiedoksiannettu numerolla C(2015)
    5549)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2016/195 od 14. kolovoza 2015. o mjerama državnih
    potpora SA.33083 (12/C) (ex 12/NN) koju je provela Italija i kojom se osigurava
    smanjenje poreza i doprinosa povezanih s prirodnim katastrofama (u svim sektorima
    osim poljoprivrede) i SA.35083 (12/C) (ex 12/NN), koju je provela Italija i kojom
    se osigurava smanjenje poreza i doprinosa povezanih s potresom koji je 2009. pogodio
    regiju Abruzzo (u svim sektorima osim poljoprivrede) (priopćeno pod brojem dokumenta
    C(2015) 5549)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/195 határozata (2015. augusztus 14.) a természeti
    katasztrófákhoz kapcsolódó adó- és járulékcsökkentéseket (a mezőgazdaság
    kivételével valamennyi ágazatban) biztosító, Olaszország által nyújtott
    SA.33083 (12/C) (korábbi 12/NN) számú, valamint az Abruzzóban történt 2009-es
    földrengéshez kapcsolódó adó- és járulékcsökkentéseket (a mezőgazdaság
    kivételével valamennyi ágazatban) biztosító, Olaszország által nyújtott
    SA.35083 (12/C) (korábbi 12/NN) számú, állami támogatási intézkedésekről
    (az értesítés a C(2015) 5549. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2016/195 della Commissione, del 14 agosto 2015, riguardante
    le misure SA.33083 (12/C) (ex 12/NN) cui l'Italia ha dato esecuzione e relativa
    ad agevolazioni fiscali e contributive connesse a calamità naturali (concernenti
    tutti i settori esclusa l'agricoltura) e SA.35083 (12/C) (ex 12/NN) cui l'Italia
    ha dato esecuzione e relativa ad agevolazioni fiscali e contributive connesse
    al terremoto del 2009 in Abruzzo (concernenti tutti i settori esclusa l'agricoltura)
    [notificata con il numero C(2015) 5549]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2016/195 (2015. gada 14. augusts) par valsts atbalsta
