title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 889/83 of 15 April 1983 re-establishing
    the levying of customs duties on pyjamas and night dresses, products of category
    30 A (code 0301), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 889/83 de la Commission du 15 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux pyjamas et chemises de nuit,
    de la catégorie 30 A (code 0301), originaires du Pakistan, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 889/83 der Kommission vom 15. April 1983 über die
    Wiedereinführung des Zollsatzes für Schlafanzüge und Nachthemden der Warenkategorie
    Nr. 30 A (Kennziffer 0301), mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 889/83 af 15. april 1983 om genindførelse
    af opkrævning af toldafgifter for pyjamas og anden natbeklædning, under kategori
    nr. 30 A (kode 0301), som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 889/83 της Επιτροπής
    της 15ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τις πυζάμες
    και τα υποκάμισα νυκτός της κατηγορίας προϊόντων
    30 Α (κωδικός αριθμός 0301), καταγωγής Πακιστάν,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 889/83 della Commissione del 15 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai pigiami e camicie da notte, della
    categoria di prodotti n. 30 A (codice 0301), originari del Pakistan beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 889/83 van de Commissie van 15 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op pyjama'
    s en nachthemden, van de categorie van produkten nr. 30 A (codenummer 0301), van
    oorsprong uit Pakistan waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
