    saskaņā ar Regulu (EK) Nr. 1081/1999 attiecībā uz dažu alpīno un kalnu šķirņu
    buļļu, govju un teļu importu
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 12 d. Komisijos reglamentas (EB) Nr. 1064/2006, nustatantis,
    kokia dalimi galima patenkinti paraiškas, pateiktas kai kurių Alpių ir kalnų
    veislių bulių, karvių ir telyčių importo teisėms gauti pagal Reglamento
    (EB) Nr. 1081/1999 nuostatas
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1064/2006 van de Commissie van 12 juli 2006 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten op invoer
    die zijn ingediend op grond van Verordening (EG) nr. 1081/1999 betreffende de
    invoer van stieren, koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1064/2006 z dnia 12 lipca 2006 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie uprawnień na przywóz
    byków, krów i jałówek niektórych ras alpejskich i górskich, składane z
    tytułu rozporządzenia (WE) nr 1081/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1064/2006 da Comissão, de 12 de Julho de 2006 ,
    que determina em que medida pode ser dado seguimento aos pedidos de direitos de
    importação apresentados ao abrigo do Regulamento (CE) n. o 1081/1999 relativo
    à importação de touros, de vacas e de novilhas de determinadas raças alpinas
    e de montanha
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1064/2006 z 12. júla 2006 , ustanovujúce
    podmienky, za ktorých možno vyhovieť žiadostiam o dovozné povolenie predloženým
    v zmysle nariadenia (ES) č. 1081/1999 týkajúceho sa dovozu býkov kráv a jalovíc
    niektorých alpských a horských plemien
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1064/2006 z dne 12. julija 2006 o določitvi,
    v kakšnem obsegu se lahko ugodi zahtevkom za uvozne pravice, vloženim v skladu
    z Uredbo (ES) št. 1081/1999 o uvozu bikov, krav in telic nekaterih alpskih in
    gorskih pasem
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1064/2006 de la Comisión, de 12 de julio de 2006 ,
    por el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación presentadas de conformidad con el Reglamento (CE) n o 1081/1999,
    relativo a la importación de toros, vacas y novillas de determinadas razas alpinas
    y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1064/2006 av den 12 juli 2006 om i vilken
