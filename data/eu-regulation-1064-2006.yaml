title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1064/2006 of 12 July 2006 determining to
    what extent applications for the right to import bulls, cows and heifers of certain
    Alpine and mountain breeds pursuant to Regulation (EC) No 1081/1999 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1064/2006 de la Commission du 12 juillet 2006 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n o 1081/1999 relatif à l'importation
    de taureaux, vaches et génisses de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1064/2006 der Kommission vom 12. Juli 2006 zur Bestimmung
    des Umfangs, in dem den gemäß der Verordnung (EG) Nr. 1081/1999 gestellten Anträgen
    auf Einfuhrrechte für Stiere, Kühe und Färsen bestimmter Höhenrassen stattgegeben
    werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1064/2006 ze dne 12. července 2006 , kterým
    se stanoví, do jaké míry lze vyhovět žádostem o dovozní práva pro dovoz
    býků, krav a jalovic některých alpských a horských plemen, podaným v souladu
    s nařízením (ES) č. 1081/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1064/2006 af 12. juli 2006 om det omfang,
    i hvilket der kan imødekommes ansøgninger om ret til import, som er indgivet
    under forordning (EF) nr. 1081/1999 vedrørende import af tyre, køer og kvier
    af bestemte alpine racer og bjergracer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1064/2006 της Επιτροπής,
    της 12ης Ιουλίου 2006 , για καθορισμό του βαθμού
    στον οποίο μπορεί να δοθεί συνέχεια στις αιτήσεις
    χορήγησης δικαιωμάτων εισαγωγής οι οποίες
    κατατίθενται βάσει του κανονισμού (ΕΚ) αριθ.
    1081/1999 σχετικά με την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1064/2006, 12. juuli 2006 , millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi, mis on
    esitatud määruse (EÜ) nr 1081/1999 alusel teatavat alpi tõugu ja mägitõugu
    pullide, lehmade ja mullikate impordiks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1064/2006, annettu 12 päivänä heinäkuuta
    2006 , asetuksen (EY) N:o 1081/1999 mukaisesti jätettyjen tiettyihin alppi- ja
    vuoristorotuihin kuuluvia sonneja, lehmiä ja hiehoja koskevien tuontioikeushakemusten
    hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1064/2006/EK rendelete ( 2006. július 12. ) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1081/1999/EK rendelet alapján, egyes
    alpesi és hegyi fajtájú bikák, tehenek és üszők vonatkozásában benyújtott
    importjogosultsági kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1064/2006 della Commissione, del 12 luglio 2006 , che
    stabilisce in che misura possono essere accolte le domande di diritti d'importazione
    presentate nel quadro del regolamento (CE) n. 1081/1999 relativo all'importazione
    di tori, vacche e giovenche di alcune razze alpine e di montagna
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1064/2006 ( 2006. gada 12. jūlijs ), ar ko nosaka,
