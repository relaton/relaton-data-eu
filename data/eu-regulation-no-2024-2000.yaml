title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2024/2000 of 26 September 2000 amending Regulation
    (EC) No 1945/2000 increasing to 1 150 000 tonnes the quantity of wheat of breadmaking
    quality from harvests prior to 1999 held by the French intervention agency for
    which a standing invitation to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2024/2000 de la Commission du 26 septembre 2000 modifiant
    le règlement (CE) n° 1945/2000 et portant à 1 150 000 tonnes l'adjudication
    permanente pour l'exportation de blé tendre panifiable issu de récoltes antérieures
    à 1999 détenu par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2024/2000 der Kommission vom 26. September 2000 zur
    Änderung der Verordnung (EG) Nr. 1945/2000 und zur Erhöhung der Dauerausschreibung
    zur Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem
    Brotweichweizen aus Ernten von vor 1999 auf 1 150 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2024/2000 af 26. september 2000 om ændring
    af forordning (EF) nr. 1945/2000 og om forhøjelse til 1 150 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, fra høstår før
    1999, som er i det franske interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2024/2000 της Επιτροπής,
    της 26ης Σεπτεμβρίου 2000, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1945/2000 και για έναρξη διαρκούς
    διαγωνισμού για εξαγωγή 1 150 000 τόνων μαλακού
    αρτοποιήσιμου σίτου προηγούμενων του 1999 συγκομιδών
    που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2024/2000, annettu 26 päivänä syyskuuta 2000,
    asetuksen (EY) N:o 1945/2000 muuttamisesta ja Ranskan interventioelimen hallussa
    olevan ennen satovuotta 1999 korjatuista sadoista saadun leipävehnän vientiä
    koskevan pysyvän tarjouskilpailun kohteena olevan määrän nostamisesta 1 150
    000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2024/2000 della Commissione, del 26 settembre 2000,
    che modifica il regolamento (CE) n. 1945/2000 e che porta a 1 150 000 tonnellate
    il quantitativo globale oggetto della gara permanente per l'esportazione di frumento
    tenero panificabile di raccolti anteriori al 1999 detenuto dall'organismo d'intervento
    francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2024/2000 van de Commissie van 26 september 2000 tot
    wijziging van Verordening (EG) nr. 1945/2000, teneinde de hoeveelheid waarop de
    permanente openbare inschrijving voor de uitvoer van zachte tarwe van bakkwaliteit
    van oogsten van vóór 1999 uit Franse interventievoorraden betrekking heeft,
    tot 1 150 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2024/2000 da Comissão, de 26 de Setembro de 2000,
    que altera o Regulamento (CE) n.° 1945/2000 e eleva a 1 150 000 toneladas o concurso
    permanente para a exportação de trigo mole panificável das colheitas anteriores
    a 1999 detido pelo organismo de intervenção francês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2024/2000 de la Comisión, de 26 de septiembre de 2000,
    por el que se modifica el Reglamento (CE) n° 1945/2000 y se eleva a 1 150 000
    toneladas la licitación permanente para la exportación de trigo blando panificable
    de cosechas anteriores a 1999 en poder del organismo de intervención francés
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2024/2000 av den 26 september 2000 om
    ändring av förordning (EG) nr 1945/2000 och om höjning till 1 150 000 ton av
    den stående anbudsinfordran för export av vete av brödkvalitet från skördar
    före 1999 som innehas av det franska interventionsorganet
  type: main
