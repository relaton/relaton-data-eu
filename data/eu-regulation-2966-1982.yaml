    communautaire pouvant être utilisé dans un système de traitement automatique
    ou électronique des informations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2966/82 der Kommission vom 5. November 1982 zur Verlängerung
