    ηλεκτρονικής επεξεργασίας τών πληροφοριών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2966/82 della Commissione, del 5 novembre 1982, che
    proroga il regolamento (CEE) n. 2826/77 che istituisce un formulario di dichiarazione
    di transito comunitario che può essere utilizzato in un sistema di trattamento
    automatico o elettronico delle informazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2966/82 van de Commissie van 5 november 1982 tot
    verlenging van Verordening (EEG) nr. 2826/77 tot instelling van een formulier
    van aangifte voor communautair douanevervoer dat kan worden gebruikt in een systeem
    van automatische of elektronische informatieverwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2966/82 da Comissão, de 5 de Novembro de 1982,
    que prorroga o Regulamento (CEE) n.° 2826/77 que institui um formulário de declaração
    de trânsito comunitário susceptível de utilização num sistema de tratamento
    automático ou electrónico das informações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2966/82 de la Comisión, de 5 de noviembre de 1982,
    por el que se prorroga el Reglamento (CEE) n° 2826/77 que establece un formulario
    de declaración de tránsito comunitario que puede utilizarse en un sistema de
    tratamiento automático o electrónico de información
  type: main
