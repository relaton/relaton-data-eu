title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3595/81 of 14 December 1981 extending the
    period of validity of Community surveillance of imports of certain motor vehicles,
    machine tools, colour television reception apparatus and cathode-ray tubes for
    colour television receivers, originating in Japan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3595/81 de la Commission, du 14 décembre 1981, prorogeant
    la période de validité de la surveillance communautaire des importations de
    certaines voitures automobiles, machines-outils, récepteurs de télévision en
    couleurs et tubes cathodiques, originaires du Japon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3595/81 der Kommission vom 14. Dezember 1981 zur Fortsetzung
    der gemeinschaftlichen Einfuhrüberwachung der Einfuhren von gewissen Kraftwagen,
    Werkzeugmaschinen, Farbfernsehempfangsgeräten und Kathodenstrahlröhren mit Ursprung
    in Japan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3595/81 af 14. december 1981 om forlængelse
    af gyldighedsperioden for fællesskabstilsyn med indførselen af visse automobiler,
    værktøjsmaskiner, farvefjernsynsmodtagere og katodestrålerør (billedrør)
    med oprindelse i Japan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3595/81 τής Επιτροπής
    τής 14ης Δεκεμβρίου 1981 περί παρατάσεως τής περιόδου
    ισχύος τής κοινοτικής επιτηρήσεως τών εισαγωγών
    ορισμένων αυτοκινήτων οχημάτων, εργαλειομηχανών,
    δεκτών έγχρωμης τηλεοράσεως καί καθοδικών
    λυχνιών, καταγωγής Ιαπωνίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3595/81 della Commissione, del 14 dicembre 1981, che
    proroga la durata di validità del controllo comunitario delle importazioni di
    determinati autoveicoli, macchine utensili, apparecchi riceventi per la televisione
    a colori e tubi catodici originari del Giappone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3595/81 van de Commissie van 14 december 1981 tot
    verlenging van de geldigheidsduur van het communautair toezicht op de invoer van
    bepaalde automobielen, van gereedschapswerktuigen, van ontvangtoestellen voor
    kleurentelevisie en van kathodestraalbuizen voor kleurentelevisietoestellen, van
    oorsprong uit Japan
