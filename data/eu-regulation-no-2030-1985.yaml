title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2030/85 of 23 July 1985 authorizing the
    German intervention agency to sell forequarters of bovine animals for processing
    into preserves with a view to constituting security stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2030/85 de la Commission, du 23 juillet 1985, autorisant
    l'organisme d'intervention allemand à vendre des quartiers avant des bovins en
    vue de leur transformation en conserves destinées à constituer des stocks de
    sécurité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2030/85 der Kommission vom 23. Juli 1985 zur Ermächtigung
    der deutschen Interventionsstelle, Vorderviertel von Rindern im Hinblick auf ihre
    Verarbeitung zu Konserven zu verkaufen, die zur Schaffung von Notvorräten bestimmt
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2030/85 af 23. juli 1985 om bemyndigelse
    til det tyske interventionsorgan til at sælge okseforfjerdinger med henblik på
    forarbejdning til konserves, som skal udgøre sikkerhedslagre
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2030/85 της Επιτροπής
    της 23ης Ιουλίου 1985 περί εξουσιοδοτήσεως του
    γερμανικού οργανισμού παρεμβάσεως να προβεί
    στην πώληση εμπροσθίων τετάρτων βοοειδών με
    σκοπό το μετασχηματισμό τους σε κονσέρβες
    που προορίζονται να αποτελέσουν αποθέματα
    ασφαλείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2030/85 della Commissione, del 23 luglio 1985, che
    autorizza l'organismo d'intervento tedesco a vendere quarti anteriori di bovini
    ai fini della loro trasformazione in conserve destinate a costituire scorte di
    sicurezza
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2030/85 van de Commissie van 23 juli 1985 tot machtiging
    van het Duitse interventiebureau om voorvoeten van runderen te verkopen voor verwerking
    tot conserven, bestemd voor de vorming van strategische voorraden
  type: main
