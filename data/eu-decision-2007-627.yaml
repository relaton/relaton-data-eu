  content: '2007/627/EG: Rådets beslut av den 28 september 2007 om uppsägning på
    gemenskapens vägnar av protokoll 3 om AVS-socker, vilket ingår i Lomé-konventionen
    för AVS–EEG, och motsvarande förklaringar fogade till den konventionen, vilka
    ingår i protokoll 3 som åtföljer bilaga V till AVS–EG-partnerskapsavtalet,
    avseende Barbados, Belize, Republiken Kongo, Republiken Elfenbenskusten, Republiken
    Fijiöarna, Republiken Guyana, Jamaica, Republiken Kenya, Republiken Madagaskar,
    Republiken Malawi, Republiken Mauritius, Republiken Moçambique, Saint Kitts och
    Nevis, Republiken Surinam, Konungariket Swaziland, Förenade republiken Tanzania,
    Republiken Trinidad och Tobago, Republiken Uganda, Republiken Zambia och Republiken
