    anejas al citado Convenio, que se recogen en el Protocolo n° 3 adjunto al anexo
    V del Acuerdo de Asociación ACP-CE, con respecto a Barbados, Belice, la República
    del Congo, la República de Costa de Marfil, la República de las Islas Fiyi,
    la República Cooperativa de Guyana, Jamaica, la República de Kenia, la República
    de Madagascar, la República de Malawi, la República de Mauricio, la República
    de Mozambique, la Federación de San Cristóbal y Nieves, la República de Surinam,
    el Reino de Suazilandia, la República Unida de Tanzania, la República de Trinidad
    y Tobago, la República de Uganda, la República de Zambia y la República de
    Zimbabue'
  type: main
