title:
- language: en
  script: Latn
  content: '80/1062/EEC: Commission Decision of 29 October 1980 finding that since
    1 January 1979 the conditions required for the admission free of Common Customs
    Tariff duties of the scientific apparatus described as ''Varian UV/Vis spectrophotometer,
    model Cary 118 C'' have not been fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/1062/CEE: Décision de la Commission, du 29 octobre 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "VARIAN-UV/Vis Spectrophotometer,
    model Cary 118 C" ne sont plus remplies depuis le 1er janvier 1979'
  type: main
- language: de
  script: Latn
  content: '80/1062/EWG: Entscheidung der Kommission vom 29. Oktober 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,Varian-UV/Vis Spectrophotometer, model Cary
    118 C'' '' ab 1. Januar 1979 nicht mehr vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/1062/EØF: Kommissionens beslutning af 29. oktober 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "VARIAN-UV/Vis Spectrophotometer, model Cary 118
    C" siden den 1. januar 1979 ikke længere er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/1/62/EOK: Απόφαση τής Επιτροπής τής 29ης Οκτωβρίου
    1980 περί διαπιστώσεως ότι οι απαιτούμενοι όροι
    γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Varian — UV/Vis Spectro — Photometer, model
    Cary 118 C» δέν πληρούνται πλέον από 1 ης Ιανουαρίου
    1979'
  type: main
- language: it
  script: Latn
  content: '80/1062/CEE: Decisione della Commissione, del 29 ottobre 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Varian-UV/Vis Spectrophotometer,
    model Cary 118 C" non sono più soddisfatte dal 1° gennaio 1979'
  type: main
- language: nl
  script: Latn
  content: '80/1062/EEG: Beschikking van de Commissie van 29 oktober 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat genaamd
    ,,Varian-UV/Vis Spectrophotometer, model Cary 118 C'' '' sedert 1 januari 1979
    niet langer is voldaan'
