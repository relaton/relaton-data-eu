- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2064/89 of 10 July 1989 re-establishing
    the levying of customs duties on men's knitted or crocheted suits and ensembles,
    products of category No 75 (order No 40.0750), originating in China, to which
    the preferential tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2064/89 de la Commission du 10 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux costumes,
    complets, en bonneterie, pour hommes, de la catégorie 75 (numéro d'ordre 40.0750),
    originaires de Chine, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2064/89 DER KOMMISSION vom 10. Juli 1989 zur Wiedereinführung
