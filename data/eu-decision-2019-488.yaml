id: EUDecision2019488
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/488 of 25 March 2019 amending,
    as regards the GSS stations of Ascension and the Falkland Islands, Implementing
    Decision (EU) 2016/413 determining the location of the ground-based infrastructure
    of the system established under the Galileo programme and setting out the necessary
    measures to ensure that it functions smoothly, and repealing Implementing Decision
    2012/117/EU
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/488 de la Commission du 25 mars 2019 modifiant,
    en ce qui concerne les stations GSS d'Ascension et des Malouines, la décision
    d'exécution (UE) 2016/413 déterminant la localisation de l'infrastructure au
    sol du système issu du programme Galileo et prévoyant les mesures nécessaires
    pour assurer son fonctionnement, et abrogeant la décision d'exécution 2012/117/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/488 der Kommission vom 25. März 2019
    zur Änderung des Durchführungsbeschlusses (EU) 2016/413 zur Festlegung der Standorte
    der Bodeninfrastruktur des aus dem Programm Galileo hervorgegangenen Systems und
    zum Erlass der zur Sicherstellung seines Betriebs erforderlichen Maßnahmen sowie
    zur Aufhebung des Durchführungsbeschlusses 2012/117/EU im Hinblick auf die GSS-Stationen
    auf Ascension und den Falklandinseln
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2019/488 на Комисията
    от 25 март 2019 година за изменение на Решение
    за изпълнение (ЕС) 2016/413 за определяне на местоположението
    на наземната инфраструктура на системата,
    създадена в рамките на програмата „Галилео“,
    за предвиждане на необходимите мерки за осигуряване
    на нейното функциониране и за отмяна на Решение
    за изпълнение 2012/117/ЕС, по отношение на GSS станциите
    на остров Възнесение и на Фолкландските острови
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/488 ze dne 25. března 2019,
    kterým se mění prováděcí rozhodnutí (EU) 2016/413 o určení lokalizace
    pozemní infrastruktury systému vytvořeného v rámci programu Galileo, o stanovení
    opatření nezbytných pro její fungování a o zrušení prováděcího rozhodnutí
    2012/117/EU, pokud jde o stanice GSS na ostrově Ascension a na Falklandských
    ostrovech
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/488 af 25. marts 2019
    om ændring, for så vidt angår GSS-stationerne på Ascension og Falklandsøerne,
    af gennemførelsesafgørelse (EU) 2016/413 om placeringen af den jordbaserede
    infrastruktur for det system, der er etableret under Galileoprogrammet, og de
    foranstaltninger, der er nødvendige for dens drift, og om ophævelse af gennemførelsesafgørelse
    2012/117/EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/488 της Επιτροπής,
    της 25ης Μαρτίου 2019, για την τροποποίηση, όσον
    αφορά τους σταθμούς GSS του νησιού της Αναλήψεως
    (Ascension) και των νήσων Φόκλαντ, της εκτελεστικής
    απόφασης (ΕΕ) 2016/413 για τον προσδιορισμό της
    θέσης της επίγειας υποδομής του συστήματος
    που έχει συσταθεί δυνάμει του προγράμματος
    Galileo και για τα μέτρα που είναι αναγκαία για
    να διασφαλιστεί η λειτουργία του, και για την
    κατάργηση της εκτελεστικής απόφασης 2012/117/ΕΕ
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/488, 25. märts 2019, millega muudetakse
    komisjoni rakendusotsust (EL) 2016/413 (millega määratakse kindlaks Galileo
    programmi raames loodud maapealse infrastruktuuri paiknemine, nähakse ette selle
    toimimiseks vajalikud meetmed ja tunnistatakse kehtetuks rakendusotsus 2012/117/EL)
    Ascensionil ja Falklandi saartel asuvate Galileo seirejaamade osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/488, annettu 25 päivänä
    maaliskuuta 2019, Galileo-ohjelman mukaisesti perustetun järjestelmän maassa
    sijaitsevan infrastruktuurin sijainnin määrittämisestä ja sen käytön varmistamiseen
    tarvittavista toimenpiteistä sekä täytäntöönpanopäätöksen 2012/117/EU
    kumoamisesta annetun täytäntöönpanopäätöksen (EU) 2016/413 muuttamisesta
    Ascensionin ja Falklandinsaarten GSS-asemien osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/488 оd 25. ožujka 2019. o izmjeni,
    s obzirom na stanice za GSS na Ascensionu i Falklandima, Provedbene odluke Komisije
    (EU) 2016/413 o određivanju lokacija zemaljske infrastrukture sustava uspostavljenoga
    u okviru programa Galileo i propisivanju mjera nužnih za osiguravanje rada tog
    sustava te o stavljanju izvan snage Provedbene odluke 2012/117/EU
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/488 végrehajtási határozata (2019. március 25.)
    a Galileo program alapján létrehozott rendszer földi infrastruktúrája földrajzi
    helyének meghatározásáról, az infrastruktúra működéséhez szükséges
    intézkedések meghozataláról, valamint a 2012/117/EU végrehajtási határozat
    hatályon kívül helyezéséről szóló (EU) 2016/413 végrehajtási határozatnak
    az ascensioni és a Falkland-szigeteki GSS állomások tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/488 della Commissione, del 25 marzo 2019,
    che modifica, per quanto riguarda le stazioni GSS di Ascensione e Falkland, la
    decisione di esecuzione (UE) 2016/413 della Commissione che fissa la sede dell'infrastruttura
    terrestre del sistema nato dal programma Galileo, prevede le misure necessarie
    a garantirne il funzionamento e abroga la decisione di esecuzione 2012/117/UE
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/488 (2019. gada 25. marts), ar
    kuru attiecībā uz GSS stacijām Debesbraukšanas salā un Folklenda (Malvinu)
    Salās groza Īstenošanas lēmumu (ES) 2016/413, ar ko nosaka saskaņā ar Galileo
    programmu izveidotās sistēmas uz zemes esošās infrastruktūras atrašanās
    vietu un paredz tās darbības nodrošināšanai nepieciešamos pasākumus, un
    atceļ Īstenošanas lēmumu 2012/117/ES
  type: main
- language: lt
  script: Latn
  content: 2019 m. kovo 25 d. Komisijos įgyvendinimo sprendimas (ES) 2019/488, kuriuo
    dėl GSS stočių Asensjone ir Folklando salose iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2016/413, kuriuo nustatoma pagal GALILEO programą sukurtos sistemos
    antžeminės infrastruktūros vieta, numatomos infrastruktūros veiklai užtikrinti
    būtinos priemonės ir panaikinamas Įgyvendinimo sprendimas 2012/117/ES
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/488 tal-25 ta'
    Marzu 2019 li temenda, f'dak li għandu x'jaqsam mal-istazzjonijiet GSS ta' Ascension
    u tal-Gżejjer Falkland, id-Deċiżjoni ta' Implimentazzjoni (UE) 2016/413 li
    tiddetermina l-lokalizzazzjoni tal-infrastruttura tas-sistema stabbilita skont
    il-programm Galileo u li tipprevedi l-miżuri meħtieġa biex jiżguraw l-operat
    tiegħu u li tħassar id-Deċiżjoni ta' Implimentazzjoni 2012/117/UE
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/488 van de Commissie van 25 maart 2019 tot
    wijziging van Uitvoeringsbesluit (EU) 2016/413 van de Commissie tot bepaling van
    de locaties van de grondinfrastructuur van het door het Galileo-programma ingestelde
    systeem en tot vaststelling van de maatregelen die nodig zijn om de goede werking
    ervan te waarborgen, en tot intrekking van Uitvoeringsbesluit 2012/117/EU, wat
    de GSS-stations van Ascension en de Falklandeilanden betreft
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/488 z dnia 25 marca 2019 r. zmieniająca,
    w odniesieniu do stacji GSS na Wyspie Wniebowstąpienia i na Falklandach, decyzję
    wykonawczą (UE) 2016/413 określającą lokalizację infrastruktury naziemnej
    systemu ustanowionego w ramach programu Galileo i ustanawiającą środki konieczne
    do zapewnienia jego funkcjonowania oraz uchylającą decyzję wykonawczą 2012/117/UE
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/488 da Comissão, de 25 de março de 2019,
    que altera, no que diz respeito às estações GSS da ilha de Ascensão e das
    Malvinas, a Decisão de Execução (UE) 2016/413 que determina a localização
    da infraestrutura terrestre do sistema resultante do programa Galileo e que prevê
    as medidas necessárias para assegurar o seu funcionamento, e que revoga a Decisão
    de Execução 2012/117/UE
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/488 a Comisiei din 25 martie 2019
    de modificare a Deciziei de punere în aplicare (UE) 2016/413 de stabilire a poziționării
    infrastructurii terestre a sistemului constituit în cadrul programului Galileo
    și de prevedere a măsurilor necesare pentru a asigura funcționarea acestuia,
    în ceea ce privește stațiile GSS din Insula Ascension și din Insulele Falkland,
    și de abrogare a Deciziei de punere în aplicare 2012/117/UE
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/488 z 25. marca 2019, ktorým
    sa mení, pokiaľ ide o stanice GSS zriadené v lokalitách Ascension a Malvíny,
    vykonávacie rozhodnutie (EÚ) 2016/413, ktorým sa určuje lokalizácia pozemnej
    infraštruktúry systému zriadeného v rámci programu Galileo a ktorým sa prijímajú
    opatrenia potrebné na zabezpečenie jej fungovania, a o zrušení vykonávacieho
    rozhodnutia 2012/117/EÚ
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/488 z dne 25. marca 2019 o spremembi,
    v zvezi s postajama GSS na otoku Ascension in Falklandskih otokih, Izvedbenega
    sklepa (EU) 2016/413 o določitvi lokacije talne infrastrukture sistema, ki izhaja
    iz programa Galileo, in potrebnih ukrepov za zagotovitev njenega obratovanja ter
    razveljavitvi Izvedbenega sklepa 2012/117/EU
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/488 de la Comisión, de 25 de marzo de
    2019, que modifica, en lo que atañe a las estaciones GSS de Ascensión e Islas
    Malvinas, la Decisión de Ejecución (UE) 2016/413, por la que se determina el
    emplazamiento de la infraestructura terrestre del sistema resultante del programa
    Galileo y se establecen las medidas necesarias para su funcionamiento, y por la
    que se deroga la Decisión de Ejecución 2012/117/UE
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/488 av den 25 mars 2019 om
    ändring av genomförandebeslut (EU) 2016/413 om lokalisering av Galileosystemets
    markinfrastruktur och om åtgärder som krävs för driften samt om upphävande
    av genomförandebeslut 2012/117/EU vad gäller GSS-stationerna på Ascension och
    Falklandsöarna
