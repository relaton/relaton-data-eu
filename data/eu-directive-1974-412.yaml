    lähentämisestä annetun direktiivin N:o 70/357/ETY muuttamisesta ensimmäisen
    kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 74/412/CEE del Consiglio, del 1 agosto 1974, recante prima modifica
    della direttiva 70/357/CEE relativa al ravvicinamento delle legislazioni degli
    Stati Membri concernenti le sostanze che hanno effetti antiossidanti che possono
    essere impiegate nei prodotti destinati all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 74/412/EEG van de Raad van 1 augustus 1974 houdende eerste wijziging
