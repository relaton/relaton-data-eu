    für Stoffe mit antioxydierender Wirkung, die in Lebensmitteln verwendet werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 74/412/EØF af 1. august 1974 om første ændring af direktiv
