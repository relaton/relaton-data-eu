title:
- language: en
  script: Latn
  content: '82/182/EEC: Commission Decision of 23 March 1982 authorizing the French
    Republic to apply intra-Community surveillance to imports of twine, cordage, ropes
    and cables, of synthetic textile fibres, plaited or not, originating in Czechoslovakia,
    which have been put into free circulation in the Community (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/182/CEE: Décision de la Commission, du 23 mars 1982, autorisant la
    République française à procéder à une surveillance intracommunautaire des
    importations de ficelles, cordes et cordages, en fibres textiles synthétiques,
    tressés ou non, originaires de Tchécoslovaquie et mis en libre pratique dans
    la Communauté (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/182/EWG: Entscheidung der Kommission vom 23. März 1982 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Tschechoslowakei stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Bindfäden, Seile und Taue, aus synthetischen Spinnstoffen,
    auch geflochten (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/182/EØF: Kommissionens beslutning af 23. marts 1982 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af sejlgarn, reb og tovværk, af syntetiske fibre, også flettet, med oprindelse
    i Tjekkoslovakiet og overgået til fri omsætning i en anden medlemsstat (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/182/EOK: Απόφαση τής Επιτροπής τής 23ης Μαρτίου
    1982 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών σπάγγων, σχοινίων καί χονδρών
    σχοινίων εκ συνθετικών υφαντικών ινών, πλεκτών
    ή μή, καταγωγής Τσεχοσλοβακίας, τά οποία ευρίσκονται
    σέ ελεύθερη κυκλοφορία στήν Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/182/CEE: Decisione della Commissione, del 23 marzo 1982, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di spago, corde e funi, di fibre tessili sintetiche, anche intrecciate, originari
    della Cecoslovacchia e messi in libera pratica nella Comunità (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/182/EEG: Beschikking van de Commissie van 23 maart 1982 houdende machtiging
    van de Franse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van bindgaren, touw en kabel van synthetische vezels, al
    dan niet gevlochten, van oorsprong uit Tsjechoslowakije, die in de Gemeenschap
    in het vrije verkeer zijn gebracht (Slechts de tekst in de Franse taal is authentiek)'
  type: main
