    kietuose maisto papilduose iš dalies keičiamas Europos Parlamento ir Tarybos
    reglamento (EB) Nr. 1333/2008 II priedas ir dėl bazinio metakrilato kopolimero
    (E 1205), neutralaus metakrilato kopolimero ir anijoninio metakrilato kopolimero
