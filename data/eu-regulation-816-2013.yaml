title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 816/2013 of 28 August 2013 amending Annex
    II to Regulation (EC) No 1333/2008 of the European Parliament and of the Council
    as regards the use of Neutral methacrylate copolymer and Anionic methacrylate
    copolymer in solid food supplements and the Annex to Commission Regulation (EU)
    No 231/2012 as regards the specifications for Basic methacrylate copolymer (E
    1205), Neutral methacrylate copolymer and Anionic methacrylate copolymer
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 816/2013 de la Commission du 28 août 2013 modifiant
    l’annexe II du règlement (CE) n ° 1333/2008 du Parlement européen et du Conseil
    en ce qui concerne l’utilisation de copolymère de méthacrylate neutre et de
    copolymère de méthacrylate anionique dans les compléments alimentaires solides
    et l’annexe du règlement (UE) n ° 231/2012 de la Commission en ce qui concerne
    les spécifications du copolymère méthacrylate basique (E 1205), du copolymère
    de méthacrylate neutre et du copolymère de méthacrylate anionique
  type: main
- language: de
  script: Latn
