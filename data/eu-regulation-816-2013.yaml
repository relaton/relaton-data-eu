    vad gäller användning av neutral metakrylatsampolymer och anjonisk metakrylatsampolymer
    i kosttillskott i fast form samt av bilagan till kommissionens förordning (EU)
    nr 231/2012 vad gäller specifikationerna för basisk metakrylatsampolymer (E
    1205), neutral metakrylatsampolymer och anjonisk metakrylatsampolymer
