title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 673/81 of 16 March 1981 reintroducing the
    levying of the customs duties applicable to glazed setts, flags and paving, hearth
    and wall tiles falling within heading No 69.08, originating in Thailand and benefiting
    from the tariff preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 673/81 de la Commission, du 16 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position 69.08 du tarif
    douanier commun, originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues au règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 673/81 der Kommission vom 16. März 1981 zur Wiedereinführung
    der Erhebung der Zölle für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 673/81 af 16. marts 1981 om genindførelse
    af opkrævning af told for glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o. lign., henhørende under pos. 69.08 og
    med oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 673/81 τής Επιτροπής
    τής 16ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά έτερα πλακίδια, κύβους
    καί πλάκες δαπέδου ή επενδύσεως τής δασμολογικής
    κλάσεως 69. 08, καταγωγής Ταϋλάνδης, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (ΕΟΚ) αριθ.
    3322/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 673/81 della Commissione, del 16 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili alle altre piastrelle, blocchetti
    e lastre da pavimentazione o da rivestimento, della voce 69.08 della tariffa doganale
    comune, originari della Tailandia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 673/81 van de Commissie van 16 maart 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels, van tariefpost 69.08, van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
