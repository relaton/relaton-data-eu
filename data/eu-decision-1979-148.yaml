title:
- language: en
  script: Latn
  content: '79/148/EEC: Commission Decision of 21 December 1978 on the provisional
    reimbursement by the Guidance Section of the EAGGF to the Federal Republic of
    Germany of premiums paid during 1976 for the conversion of dairy herds to meat
    production (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/148/CEE: Décision de la Commission, du 21 décembre 1978, relative
