- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/2264 of 1 September 2025 amending
    Regulation (EU) 2024/2594 of the European Parliament and of the Council as regards
    technical and control measures applicable in the area covered by the Convention
    on future multilateral cooperation in the North-East Atlantic fisheries, and repealing
    Commission Delegated Regulation (EU) No 32/2012
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/2264 de la Commission du 1er septembre
    2025 modifiant le règlement (UE) 2024/2594 du Parlement européen et du Conseil
    en ce qui concerne les mesures techniques et de contrôle applicables dans la
    zone de la convention sur la future coopération multilatérale dans les pêches
    de l’Atlantique du Nord-Est, et abrogeant le règlement délégué (UE) no 32/2012
    de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/2264 der Kommission vom 1. September 2025
    zur Änderung der Verordnung (EU) 2024/2594 des Europäischen Parlaments und des
    Rates in Bezug auf technische Maßnahmen und Kontrollmaßnahmen für den Bereich
    des Übereinkommens über die künftige multilaterale Zusammenarbeit auf dem Gebiet
    der Fischerei im Nordostatlantik und zur Aufhebung der Delegierten Verordnung
    (EU) Nr. 32/2012 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/2264 на Комисията
