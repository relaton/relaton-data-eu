    respeitante às medidas técnicas e de controlo aplicáveis na área abrangida
    pela Convenção sobre a Futura Cooperação Multilateral nas Pescas do Atlântico
    Nordeste e que revoga o Regulamento Delegado (UE) n.o 32/2012 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/2264 al Comisiei din 1 septembrie 2025 de
    modificare a Regulamentului (UE) 2024/2594 al Parlamentului European și al Consiliului
    în ceea ce privește măsurile tehnice și de control aplicabile în zona reglementată
    de Convenția privind viitoarea cooperare multilaterală pentru pescuit în Atlanticul
    de Nord-Est și de abrogare a Regulamentului delegat (UE) nr. 32/2012 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/2264 z 1. septembra 2025, ktorým
    sa mení nariadenie Európskeho parlamentu a Rady (EÚ) 2024/2594, pokiaľ ide
    o technické a kontrolné opatrenia uplatniteľné v oblasti, na ktorú sa vzťahuje
    Dohovor o budúcej multilaterálnej spolupráci pri rybolove v severovýchodnom
    Atlantiku, a ktorým sa zrušuje delegované nariadenie Komisie (EÚ) č. 32/2012
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/2264 z dne 1. septembra 2025 o spremembi
    Uredbe (EU) 2024/2594 Evropskega parlamenta in Sveta o tehničnih in nadzornih
    ukrepih, ki se uporabljajo na območju Konvencije o prihodnjem večstranskem sodelovanju
    v ribištvu severovzhodnega Atlantika, in razveljavitvi Delegirane uredbe Komisije
    (EU) št. 32/2012
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/2264 de la Comisión, de 1 de septiembre
    de 2025, por el que se modifica el Reglamento (UE) 2024/2594 del Parlamento Europeo
    y del Consejo en lo que respecta a las medidas técnicas y de control aplicables
    en la zona regulada por el Convenio sobre la futura cooperación multilateral
    en los caladeros del Atlántico nororiental, y se deroga el Reglamento Delegado
    (UE) n.o 32/2012 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/2264 av den 1 september
    2025 om ändring av Europaparlamentets och rådets förordning (EU) 2024/2594
    vad gäller tekniska åtgärder och kontrollåtgärder för det område som omfattas
    av konventionen om framtida multilateralt samarbete om fisket i Nordostatlanten
    och om upphävande av kommissionens delegerade förordning (EU) nr 32/2012
