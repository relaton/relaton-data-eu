    w odniesieniu do środków technicznych i środków kontroli mających zastosowanie
    na obszarze objętym Konwencją o przyszłej wielostronnej współpracy w rybołówstwie
    na północno-wschodnim Atlantyku oraz uchylające rozporządzenie delegowane
    Komisji (UE) nr 32/2012
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/2264 da Comissão, de 1 de setembro de 2025,
