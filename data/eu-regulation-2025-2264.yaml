    yhteistyötä koskevan yleissopimuksen kattamalla alueella sovellettavien teknisten
    ja valvontatoimenpiteiden osalta sekä neuvoston asetuksen (EU) N:o 32/2012 kumoamisesta
  type: main
- language: ga
  script: Latn
