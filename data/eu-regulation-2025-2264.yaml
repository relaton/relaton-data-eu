    (ЕС) 2024/2594 на Европейския парламент и на Съвета
    по отношение на техническите мерки и мерките
    за контрол в зоната, обхваната от Конвенцията
    за бъдещо многостранно сътрудничество в областта
    на риболова в североизточната част на Атлантическия
    океан, и за отмяна на Делегиран регламент (ЕС)
    № 32/2012 на Комисията
  type: main
- language: cs
  script: Latn
