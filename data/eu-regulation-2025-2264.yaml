    az északkelet-atlanti halászatban folytatandó jövőbeni többoldalú halászati
    együttműködésről szóló egyezmény hatálya alá tartozó területen alkalmazandó
    technikai és ellenőrzési intézkedések tekintetében történő módosításáról,
    valamint a 32/2012/EU felhatalmazáson alapuló bizottsági rendelet hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/2264 della Commissione, del 1o settembre
    2025, recante modifica del regolamento (UE) 2024/2594 del Parlamento europeo e
    del Consiglio per quanto riguarda le misure tecniche e di controllo applicabili
    nella zona della convenzione sulla futura cooperazione multilaterale per la pesca
    nell’Atlantico nordorientale e che abroga il regolamento delegato (UE) n. 32/2012
    della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/2264 (2025. gada 1. septembris),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) 2024/2594 groza attiecībā uz
    tehniskajiem un kontroles pasākumiem, kas piemērojami apgabalā, uz ko attiecas
    Konvencija par turpmāko daudzpusējo sadarbību Ziemeļaustrumu Atlantijas zvejniecībā,
    un ar ko atceļ Komisijas Deleģēto regulu (ES) Nr. 32/2012
  type: main
- language: lt
  script: Latn
  content: 2025 m. rugsėjo 1 d. Komisijos deleguotasis reglamentas (ES) 2025/2264,
    kuriuo dėl techninių ir kontrolės priemonių, taikytinų rajone, kuriam taikoma
    Konvencija dėl būsimo daugiašalio bendradarbiavimo žvejybai šiaurės rytų
    Atlante, iš dalies keičiamas Europos Parlamento ir Tarybos reglamentas (ES)
    2024/2594 ir panaikinamas Komisijos deleguotasis reglamentas (ES) Nr. 32/2012
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/2264 tal-1 ta’ Settembru
    2025 li jemenda r-Regolament (UE) 2024/2594 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ miżuri tekniċi u ta’ kontroll applikabbli fiż-żona koperta
    mill-Konvenzjoni dwar il-Koperazzjoni Multilaterali fil-Ġejjieni dwar is-Sajd
    fl-Atlantiku tal-Grigal, u li jħassar ir-Regolament ta’ Delega tal-Kummissjoni
    (UE) Nru 32/2012
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/2264 van de Commissie van 1 september
    2025 tot wijziging van Verordening (EU) 2024/2594 van het Europees Parlement en
    de Raad wat betreft technische en controlemaatregelen die van toepassing zijn
    in het gebied dat onder het Verdrag inzake toekomstige multilaterale samenwerking
