    Tarmligthe (AE) Uimh. 32/2012 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/2264 оd 1. rujna 2025. o izmjeni
    Uredbe (EU) 2024/2594 Europskog parlamenta i Vijeća kad je riječ o tehničkim
    mjerama i mjerama kontrole primjenjivima na području obuhvaćenom Konvencijom
    o budućoj višestranoj suradnji u ribarstvu sjeveroistočnog Atlantika i stavljanju
    izvan snage Uredbe Vijeća (EU) br. 32/2012
  type: main
- language: hu
  script: Latn
