    2025, kterým se mění nařízení Evropského parlamentu a Rady (EU) 2024/2594,
    pokud jde o technická a kontrolní opatření platná v oblasti vymezené Úmluvou
    o budoucí multilaterální spolupráci při rybolovu v severovýchodním Atlantiku,
    a kterým se zrušuje nařízení Komise v přenesené pravomoci (EU) č. 32/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/2264 af 1. september 2025
    om ændring af Europa-Parlamentets og Rådets forordning (EU) 2024/2594 for så
    vidt angår tekniske foranstaltninger og kontrolforanstaltninger, der gælder
    for det område, der er omfattet af konventionen om det fremtidige multilaterale
    samarbejde vedrørende fiskeriet i det nordøstlige Atlanterhav, og om ophævelse
    af Kommissionens delegerede forordning (EU) nr. 32/2012
  type: main
- language: el
  script: Grek
