    tot intrekking van Gedelegeerde Verordening (EU) nr. 32/2012 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/2264 z dnia 1 września 2025
