title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2020/366 of 17 December 2019 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for lead as a thermal stabiliser in polyvinyl chloride used in certain
    in-vitro diagnostic medical devices for the analysis of blood and other body fluids
    and body gases
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2020/366 de la Commission du 17 décembre 2019
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au plomb en tant que stabilisateur thermique dans le polychlorure
    de vinyle (PVC) employé dans certains dispositifs médicaux de diagnostic in
    vitro pour les analyses de sang et autres liquides et gaz organiques
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2020/366 der kommission vom 17. Dezember 2019
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für Blei als thermischer Stabilisator in
    Polyvinylchlorid, das in bestimmten medizinischen In-vitro-Diagnostika für die
    Analyse von Blut, anderen Körperflüssigkeiten und Körpergasen verwendet wird
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2020/366 на Комисията
    от 17 декември 2019 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение IV към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаване от ограничението за употребата
    на олово като термичен стабилизатор в поливинилхлорид,
    използван в някои медицински уреди за инвитро
    диагностика за анализ на кръв и други телесни
    течности и газове
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2020/366 ze dne 17. prosince
    2019, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití olova jako tepelného stabilizátoru v polyvinylchloridu
    používaném v některých diagnostických zdravotnických prostředcích in
    vitro pro rozbor krve a jiných tělních tekutin a tělních plynů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2020/366 af 17. december 2019 om
    ændring med henblik på tilpasning til den videnskabelige og tekniske udvikling
    af bilag IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU, for så vidt
    angår en undtagelse for bly som termisk stabilisator i polyvinylchlorid, der
    anvendes i visse typer medicinsk udstyr til in-vitrodiagnostik ved analyse af
    blod, andre kropsvæsker og kropsgasser
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (EE) 2020/366 της
