    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τον μόλυβδο ως θερμικό σταθεροποιητή σε πολυβινυλοχλωρίδιο
    (PVC) που χρησιμοποιείται σε ορισμένα ιατροτεχνολογικά
    προϊόντα για διάγνωση in vitro για την ανάλυση
    του αίματος και άλλων σωματικών υγρών και σωματικών
    αερίων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2020/366, 17. detsember 2019, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis seisneb plii kasutamises termostabilisaatorina
    polüvinüülkloriidis, mida kasutatakse teatavates in vitro diagnostika meditsiiniseadmetes
    vere ning muude kehavedelike ja -gaaside analüüsimiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2020/366, annettu 17 päivänä joulukuuta
    2019, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen sen poikkeuksen osalta, joka
    koskee lyijyä termaalisena stabiloivana aineena polyvinyylikloridissa, jota käytetään
    tietyissä in vitro -diagnostiikkaan tarkoitetuissa lääkinnällisissä laitteissa
    veren ja muiden kehon nesteiden ja kehon kaasujen analyyseja varten
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2020/366 оd 17. prosinca 2019. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za olovo kao termičkog stabilizatora
    u polivinil-kloridu koji se upotrebljava u određenim in vitro dijagnostičkim
    medicinskim proizvodima za analizu krvi i drugih tjelesnih tekućina i plinova
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/366 felhatalmazáson alapuló irányelve (2019.
    december 17.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    a vér és más testfolyadékok és testgázok elemzésére szolgáló in vitro
    diagnosztikai orvostechnikai eszközökben használt polivinilkloridban (PVC)
    hőstabilizátorként alkalmazott ólomra vonatkozó mentesség tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: DIRETTIVA DELEGATA (UE) 2020/366 DELLA COMMISSIONE del 17 dicembre 2019
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso di piombo come stabilizzatore termico del cloruro
    di polivinile (PVC) impiegato in determinati dispositivi medico-diagnostici in
    vitro per l’analisi del sangue e di altri liquidi e gas organici
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2020/366 (2019. gada 17. decembris),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, groza Eiropas Parlamenta
    un Padomes Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svina
    lietošanai par tāda polivinilhlorīda termisko stabilizatoru, ko izmanto atsevišķās
    in vitro diagnostikas medicīniskajās ierīcēs asins, citu ķermeņa šķidrumu
    un ķermeņa gāzu analīzei
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2020/366 2019 m. gruodžio 17 d. kuria,
    derinant prie mokslo ir technikos pažangos, iš dalies keičiamos Europos Parlamento
    ir Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria šviną
    leidžiama naudoti kaip polivinilchlorido, naudojamo tam tikruose in vitro diagnostikos
    medicinos prietaisuose, skirtuose kraujo ir kitų kūno skysčių bei kūno dujų
    analizei, šiluminį stabilizatorių
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2020/366 tas-17 ta’ Diċembru
    2019 li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għaċ-ċomb bħala stabbilizzatur termali fil-klorur tal-polivinil
    użat f’ċertu apparat mediku dijanjostiku in vitro għall-analiżi tad-demm
    u ta’ fluwidi u gassijiet oħra tal-ġisem
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2020/366 van de Commissie van 17 december 2019
    tot wijziging, met het oog op de aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor lood als thermische stabilisator
    in polyvinylchloride dat wordt gebruikt in bepaalde medische hulpmiddelen voor
    in-vitrodiagnostiek voor de analyse van bloed, andere lichaamsvloeistoffen en
    lichaamsgassen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2020/366 z dnia 17 grudnia 2019 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    ołowiu jako stabilizatora termicznego w polichlorku winylu stosowanym w niektórych
    wyrobach medycznych używanych do diagnozy in vitro do analizy krwi i innych płynów
    i gazów ustrojowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2020/366 da Comissão de 17 de dezembro de 2019
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção aplicável ao chumbo como estabilizador térmico no poli(cloreto
    de vinilo) utilizado em determinados dispositivos médicos de diagnóstico in
    vitro para análise de amostras de sangue e de outros fluidos e gases corporais
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2020/366 a Comisiei din 17 decembrie 2019 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei IV la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru plumb ca stabilizator termic în clorura de polivinil folosită
    în anumite dispozitive medicale pentru diagnostic in vitro pentru analiza sângelui
    și a altor lichide și gaze corporale
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2020/366 zo 17. decembra 2019, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    IV k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    týkajúcu sa olova ako tepelného stabilizátora v polyvinylchloride používanom
    v určitých diagnostických zdravotníckych pomôckach in vitro na analýzu krvi
    a iných telesných tekutín a telesných plynov
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2020/366 z dne 17. decembra 2019 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    pri uporabi svinca kot termičnega stabilizatorja v polivinilkloridu, ki se uporablja
    v nekaterih diagnostičnih in vitro medicinskih pripomočkih za analize krvi,
    telesnih tekočin in telesnih plinov, zaradi prilagoditve znanstvenemu in tehničnemu
    napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2020/366 de la Comisión de 17 de diciembre de
    2019 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al plomo como estabilizador térmico
    en el cloruro de polivinilo utilizado en determinados productos sanitarios de
    diagnóstico in vitro para el análisis de sangre y otros gases y fluidos corporales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2020/366 av den 17 december 2019
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för bly som termisk stabilisator i polyvinylklorid som används i vissa
    medicintekniska produkter för in vitro-diagnostik för analys av blod och andra
    kroppsvätskor och gaser i kroppen
  type: main
