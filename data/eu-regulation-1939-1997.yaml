title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1939/97 of 3 October 1997 laying down, for
    the period 1 July 1997 to 30 June 1998, rules for the application of the tariff
    quotas for beef and veal provided for by Council Regulation (EC) No 3066/95 for
    the Republic of Poland, the Republic of Hungary, the Czech Republic, Slovakia,
    the Republic of Bulgaria and Romania and amending Regulations (EC) No 2512/96
    and No 1441/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1939/97 de la Commission du 3 octobre 1997 établissant
    pour la période du 1er juillet 1997 au 30 juin 1998 les modalités d'application
    pour les contingents tarifaires de viandes bovines prévus par le règlement (CE)
    n° 3066/95 du Conseil pour la République de Pologne, la République de Hongrie,
    la République tchèque, la Slovaquie, la Bulgarie et la Roumanie et modifiant
    les règlements (CE) n° 2512/96 et (CE) n 1441/97
  type: main
