    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2004/900/SZVP z dne 22. decembra 2004 o izvajanju Skupnega
