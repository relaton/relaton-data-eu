    22ας Δεκεμβρίου 2004, που θέτει σε εφαρμογή την
    κοινή θέση 2004/694/ΚΕ̠̠Α για περαιτέρω μέτρα προς
    υποστήριξη της αποτελεσματικής εφαρμογής
