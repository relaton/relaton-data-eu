  content: Council Decision 2004/900/CFSP of 22 December 2004 implementing Common
    Position 2004/694/CFSP on further measures in support of the effective implementation
    of the mandate of the International Criminal Tribunal for the former Yugoslavia
    (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2004/900/PESC du Conseil du 22 décembre 2004 mettant en œuvre
    la position commune 2004/694/PESC concernant de nouvelles mesures ` l'appui d'une
    mise en œuvre effective du mandat du Tribunal pénal international pour l'ex-Yougoslavie
    (TPIY)
  type: main
- language: de
  script: Latn
  content: Beschluss 2004/900/GASP des Rates vom 22. Dezember 2004 zur Umsetzung des
    Gemeinsamen Standpunkts 2004/694/GASP betreffend weitere Maßnahmen zur Unterstützung
    der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs für
    das ehemalige Jugoslawien (ICTY)
