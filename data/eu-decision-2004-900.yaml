    ao exercício efectivo do mandato do Tribunal Penal Internacional para a Ex-Jugoslávia
    (TPIJ)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2004/900/SZBP z 22. decembra 2004, ktorým sa vykonáva
