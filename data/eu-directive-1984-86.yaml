    προσεγγίσεως των νομοθεσιών των κρατών μελών
    σχετικά με τα συντηρητικά που επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: it
  script: Latn
  content: Direttiva 84/86/CEE del Consiglio del 6 febbraio 1984 recante diciannovesima
    modifica della direttiva 64/54/CEE per il ravvicinamento delle legislazioni degli
    Stati Membri sui conservativi che possono essere impiegati nelle derrate destinate
    all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 84/86/EEG van de Raad van 6 februari 1984 houdende negentiende
    wijziging van Richtlijn 64/54/EEG betreffende de aanpassing van de wetgevingen
    van de Lid- Staten inzake conserveermiddelen die mogen worden gebruikt in voor
    menselijke voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 84/86/CEE do Conselho, de 6 de Fevereiro de 1984, que altera
