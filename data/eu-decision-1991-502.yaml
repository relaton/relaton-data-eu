  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 5 de septiembre de 1991 por la que se fija
    la cuantía de los recursos propios IVA debida por la República Federal de Alemania
    por el ejercicio 1989 y relativa a las operaciones contempladas en la vigésima
    Directiva 85/361/CEE del Consejo en materia de armonización de las legislaciones
    de los Estados miembros relativas a los impuestos sobre el volumen de negocios
    - Sistema común del impuesto sobre el valor añadido: excepciones relativas a
    las ayudas especiales concedidas a determinados agricultores en compensación
    al desmantelamiento de los montantes compensatorios monetarios aplicables a determinados
    productos agrícolas (El texto en lengua alemana es el único auténtico) (91/502/CEE)
