  script: Latn
  content: 'DECISÃO DA COMISSÃO de 5 de Setembro de 1991 que fixa o montante dos
    recursos próprios do imposto sobre o valor acrescentado (IVA) de que a República
    Federal da Alemanha é devedora para o exercício de 1988 e relativo às operações
    referidas na vigésima Directiva 85/361/CEE do Conselho em matéria de harmonização
    das legislações dos Estados-membros respeitantes aos impostos sobre o volume
    de negócios - sistema comum de imposto sobre o valor acrescentado: derrogações
    relativas às ajudas especiais concedidas a certos agricultores em compensação
    do desmantelamento dos montantes compensatórios monetários aplicáveis a determinados
