title:
- language: en
  script: Latn
  content: '91/502/EEC: Commission Decision of 5 September 1991 determining the amount
    of VAT own resources payable by the Federal Republic of Germany for 1989 in respect
    of transactions covered by the 20th Council Directive 85/361/EEC of 16 July 1985
    on the harmonization of the laws of the Member States relating to turnover taxes
    - Common system of value added tax: derogations in connection with the special
    aids granted to certain farmers to compensate for the dismantlement of monetary
    compensatory amounts applying to certain agricultural products (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/502/CEE: Décision de la Commission du 5 septembre 1991 fixant le montant
    des ressources propres TVA dont la République fédérale d''Allemagne est redevable
    pour l''exercice 1989 et relatif aux opérations visées à la vingtième directive
    85/361/CEE du Conseil en matière d''harmonisation des législations des États
    membres relatives aux taxes sur le chiffre d''affaires - Système commun de taxe
    sur la valeur ajoutée: dérogations relatives aux aides spéciales accordées
    à certains agriculteurs en compensation du démantèlement des montants compensatoires
    monétaires applicables à certains produits agricoles (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 5. September 1991 zur Festsetzung des
    von der Bundesrepublik Deutschland für das Haushaltsjahr 1989 im Zusammenhang
    mit den in der zwanzigsten Richtlinie genannten Umsätzen geschuldeten Betrags
    der MwSt.-Eigenmittel (Zwanzigste Richtlinie 85/361/EWG des Rates vom 16. Juli
    1985 zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    - gemeinsames Mehrwertsteuersystem: Ausnahmeregelung im Zusammenhang mit den Sonderbeihilfen,
    die bestimmten Landwirten als Ausgleich für den Abbau der Währungsausgleichsbeträge
    für bestimmte landwirtschaftliche Erzeugnisse gewährt werden) (Nur der deutsche
    Text ist verbindlich) (91/502/EWG) #'
  type: main
