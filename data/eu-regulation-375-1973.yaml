title:
- language: en
  script: Latn
  content: Regulation (EEC) No 375/73 of the Commission of 31 January 1973 laying
    down the temporary measures to be taken because of Accession relating to the implementation
    of Regulation (EEC) No 1349/72 concerning production of and trade with eggs for
    hatching and chicks of domestic poultry in Denmark
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 375/73 de la Commission, du 31 janvier 1973, arrêtant
    les mesures transitoires à prendre du fait de l'adhésion, relatives à l'application
    du règlement (CEE) n° 1349/72 concernant la production et la commercialisation
    des oeufs à couver et des poussins de volailles de basse-cour au Danemark
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 375/73 der Kommission vom 31. Januar 1973 zur Festlegung
    der infolge des Beitritts zu treffenden Übergangsmaßnahmen für die Anwendung
    der Verordnung (EWG) Nr. 1349/72 über die Erzeugung von und den Verkehr mit Bruteiern
    und Küken von Hausgeflügel in Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 375/73 af 31. januar 1973 om overgangsforanstaltninger,
    som på grund af tiltrædelsen skal træffes med hensyn til gennemførelse i Danmark
    af forordning (EØF) nr. 1349/72, om produktion og afsætning af rugeæg og kyllinger
    af fjerkræ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 375/73 della Commissione, del 31 gennaio 1973, che
    stabilisce le misure transitorie da adottare a seguito dell'adesione per quanto
    riguarda l'applicazione del regolamento (CEE) n. 1349/72 relativo alla produzione
    e alla commercializzazione di uova da cova e pulcini di volatili da cortile in
    Danimarca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 375/73 van de Commissie van 31 januari 1973 tot vaststelling
    van de ingevolge het Toetredingsverdrag te treffen overgangsmaatregelen met betrekking
    tot de uitvoering van Verordening (EEG) nr. 1349/72 betreffende de produktie van
    en de handel in broedeieren en kuikens van pluimvee in Denemarken
