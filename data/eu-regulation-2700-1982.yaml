title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2700/82 of 4 October 1982 amending temporarily
    Regulation (EEC) No 765/82 laying down for 1982 certain measures for the conservation
    and management of fishery resources applicable to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2700/82 du Conseil, du 4 octobre 1982, modifiant provisoirement
    le règlement (CEE) n° 765/82 fixant, pour l' année 1982, certaines mesures
    de conservation et de gestion des ressources de pêche applicables aux navires
    battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2700/82 des Rates vom 4. Oktober 1982 zur vorläufigen
    Änderung der Verordnung (EWG) Nr. 765/82 zur Festlegung von Maßnahmen zur Erhaltung
    und Bewirtschaftung der Fischbestände gegenüber Schiffen unter norwegischer
    Flagge für 1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2700/82 af 4. oktober 1982 om midlertidig
    ændring af forordning (EØF) nr. 765/82 om fastsættelse for 1982 af visse foranstaltninger
    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, som fører norsk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2700/82 τού Συμβουλίου
    τής 4ης Οκτωβρίου 1982 περί προσωρινής τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 765/82 περί καθορισμού,
    γιά τό έτος 1982, ορισμένων μέτρων διατηρήσεως
    καί διαχειρίσεως τών αλιευτικών πόρων τά οποία
    εφαρμόζονται σέ σκάφη υπό νορβηγηκή σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2700/82 del Consiglio, del 4 ottobre 1982, recante
    modifica provvisoria del regolamento (CEE) n. 765/82 che stabilisce per il 1982
    talune misure di conservazione e di gestione delle risorse ittiche da applicare
    alla navi battenti bandiera norvegesei
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2700/82 van de Raad van 4 oktober 1982 houdende voorlopige
    wijziging van Verordening (EEG) nr. 765/82 tot vaststelling voor 1982 van bepaalde
    maatregelen voor de instandhouding en het beheer van de visbestanden, van toepassing
    op vaartuigen die de vlag van Noorwegen voerenn
