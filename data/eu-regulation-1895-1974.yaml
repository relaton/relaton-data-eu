    fastsættelsen af en ny repræsentativ kurs for den italienske lire, der har virkning
    fra den 22. juli 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1895/74 della Commissione, del 19 luglio 1974, che
    definisce le misure supplementari da adottare nel settore agricolo in seguito
    alla fissazione, con effetto dal 22 luglio 1974, di un nuovo tasso rappresentativo
    per la lira italiana
  type: main
- language: nl
  script: Latn
