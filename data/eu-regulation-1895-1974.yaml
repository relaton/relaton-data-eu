  content: Regulation (EEC) No 1895/74 of the Commission of 19 July 1974 defining
    additional measures to be taken in agriculture following the fixing, with effect
    from 22 July 1974, of a new representative rate for the Italian lira
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1895/74 de la Commission, du 19 juillet 1974, définissant
