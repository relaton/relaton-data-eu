    avec effet au 22 juillet 1974, d'un nouveau taux représentatif pour la lire italienne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1895/74 der Kommission vom 19. Juli 1974 zur Bestimmung
    der zusätzlichen Maßnahmen, die in der Landwirtschaft infolge der Festsetzung
    eines neuen repräsentativen Umrechnungskurses, der für die italienische Lira
    ab 22. Juli 1974 gilt, zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1895/74 af 19. juli 1974 om supplerende
