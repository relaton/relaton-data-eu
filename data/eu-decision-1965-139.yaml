  content: Décision 65/139/CEE de la Commission, du 25 février 1965, portant nouvelle
    modification de la décision de la Commission du 20 décembre 1963 autorisant
    la République italienne à adopter des mesures de sauvegarde pour le plomb et
    le zinc
  type: main
- language: de
  script: Latn
  content: '65/139/EWG: Entscheidung der Kommission vom 25. Februar 1965 zur erneuten
    Änderung der Entscheidung der Kommission vom 20. Dezember 1963, mit der die Italienische
    Republik ermächtigt wird, Schutzmaßnahmen für Rohblei und Rohzink anzuwenden'
  type: main
- language: it
  script: Latn
  content: '65/139/CEE: Decisione della Commissione, del 25 febbraio 1965, recante
    una nuova modifica alla decisione del 20 dicembre 1963 che autorizza la Repubblica
    italiana ad adottare misure di salvaguardia per il piombo e lo zinco greggi'
  type: main
- language: nl
  script: Latn
  content: '65/139/EEG: Beschikking van de Commissie van 25 februari 1965 houdende
    nieuwe wijziging van de beschikking van de Commissie van 20 december 1963 waarbij
    de Italiaanse Republiek wordt gemachtigd tot het nemen van vrijwaringsmaatregelen
    voor ruw lood en ruw zink'
