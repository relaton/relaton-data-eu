  content: Commission Regulation (EEC) No 388/80 of 15 February 1980 instituting protective
    measures on yarn of polyamide, for carpets, originating in certain third countries
    and imported into the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 388/80 de la Commission, du 15 février 1980, instituant
    des mesures de protection applicables aux fils texturés de fibres textiles de
    polyamides pour tapis originaires de certains pays tiers et importés au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 388/80 der Kommission vom 15. Februar 1980 zur Einführung
