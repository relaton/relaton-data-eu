  content: COMMISSION REGULATION (EC) No 922/95 of 26 April 1995 determining the extent
    to which applications lodged until the month of April 1995 for the issue of import
    licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 922/95 DE LA COMMISSION du 26 avril 1995 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1995 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 922/95 DER KOMMISSION vom 26. April 1995 über den
    Umfang, in dem den im Monat April 1995 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 922/95 af 26. april 1995 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    april 1995 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 922/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Απριλίου 1995 για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εισαγωγής, που υποβλήθηκαν
    τον Απρίλιο του 1995, για τα κατεψυγμένα βόεια
    κρέατα που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 922/95, annettu 26 päivänä huhtikuuta 1995,
    huhtikuussa 1995 jätettyjen, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 922/95 DELLA COMMISSIONE del 26 aprile 1995 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1995 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 922/95 VAN DE COMMISSIE van 26 april 1995 waarbij
