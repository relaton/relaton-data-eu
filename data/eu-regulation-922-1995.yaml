    1995 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 922/95 DA COMISSÃO de 26 de Abril de 1995 que determina
    em que medida pode ser dado seguimento aos pedidos de concessão de certificados
    de importação entregues no mês de Abril de 1995 para as carnes de bovino congeladas
    e destinadas à transformação
  type: main
