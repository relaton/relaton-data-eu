title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1981/90 of 11 July 1990 reintroducing the
    levying of the customs duties applicable to footwear falling under CN codes 6401
    and 6402 originating in the Philippines to which the preferential arrangements
    of Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1981/90 de la Commission du 11 juillet 1990 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    des codes NC 6401 et 6402 originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1981/90 DER KOMMISSION vom 11. Juli 1990 zur Wiedereinfuehrung
