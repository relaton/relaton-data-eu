    den Philippinen, denen die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1981/90 af 11. juli 1990 om genindførelse
