  script: Latn
  content: Directive 2001/107/EC of the European Parliament and of the Council of
    21 January 2002 amending Council Directive 85/611/EEC on the coordination of laws,
    regulations and administrative provisions relating to undertakings for collective
    investment in transferable securities (UCITS) with a view to regulating management
    companies and simplified prospectuses
  type: main
- language: fr
  script: Latn
