    delle disposizioni legislative, regolamentari ed amministrative in materia di
    taluni organismi d'investimento collettivo in valori mobiliari (OICVM) al fine
    di regolamentare le società di gestione e i prospetti semplificati
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2001/107/EK (2002. gada 21. janvāris),
