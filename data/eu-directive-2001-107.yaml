    van beheermaatschappĳen en vereenvoudigde prospectussen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2001/107/WE Parlamentu Europejskiego i Rady z dnia 21 stycznia
    2002 r. zmieniająca dyrektywę Rady 85/611/EWG w sprawie koordynacji przepisów
    ustawowych, wykonawczych i administracyjnych odnoszących się do przedsiębiorstw
    zbiorowego inwestowania w zbywalne papiery wartościowe (UCITS), w celu uregulowania
    działalności spółek zarządzających i uproszczonych prospektów emisyjnych
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/107/CE do Parlamento Europeu e do Conselho, de 21 de Janeiro
