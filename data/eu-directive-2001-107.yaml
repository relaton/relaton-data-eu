    legislativas, regulamentares e administrativas respeitantes a alguns organismos
    de investimento colectivo em valores mobiliários (OICVM) com vista a regulamentar
    as sociedades de gestão e os prospectos simplificados
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/107/CE a Parlamentului European și a Consiliului din 21
    ianuarie 2002 de modificare a Directivei 85/611/CEE a Consiliului privind coordonarea
    actelor cu putere de lege și actelor administrative referitoare la organismele
    de plasament colectiv în valori mobiliare (OPCVM) în vederea reglementării
    societăților de gestionare și a prospectelor de emisiune simplificate
  type: main
- language: sk
  script: Latn
  content: Smernica 2001/107/ES Európskeho parlamentu aRady z 21. januára 2002,
