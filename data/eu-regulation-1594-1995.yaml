    maataloussopimuksen täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1594/95 della Commissione, del 30 giugno 1995, che
    modifica i regolamenti (CEE) n. 2698/93 e (CE) n. 1590/94 per quanto concerne
    l' adeguamento transitorio di talune disposizioni relative alle importazioni nella
    Comunità di alcuni prodotti del settore delle carni suine provenienti dalla Repubblica
    di Polonia, dalla Repubblica d' Ungheria, dalla Repubblica ceca, dalla Repubblica
    slovacca, dalla Repubblica di Bulgaria e dalla Romania ai fini dell' attuazione
    dell' accordo sull' agricoltura concluso nel quadro dei negoziati dell' Uruguay
    Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1594/95 van de Commissie van 30 juni 1995 tot wijziging
    van de Verordeningen (EEG) nr. 2698/93 en (EG) nr. 1590/94 ten aanzien van de
    aanpassing, bij wijze van overgangsmaatregel, van een aantal bepalingen in verband
    met de invoer in de Gemeenschap van bepaalde produkten van de sector varkensvlees
    uit de Republiek Polen, de Republiek Hongarije, de Tsjechische Republiek, de Slowaakse
    Republiek, de Republiek Bulgarije en Roemenië met het oog op de tenuitvoerlegging
    van de in het kader van de besprekingen van de Uruguay-Ronde gesloten Overeenkomst
    inzake de landbouw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1594/95 da Comissão, de 30 de Junho de 1995, que
    altera os Regulamentos (CEE) nº 2698/93 e (CE) nº 1590/94 no que diz respeito
    à adaptação transitória de certas disposições relativas às importações
    para a Comunidade de certos produtos do sector da carne de suíno provenientes
    da República da Polónia, da República da Hungria, da República Checa, da República
    Eslovaca, da República da Bulgária e da Roménia com vista à aplicação do
    Acordo sobre a agricultura concluído no âmbito das negociações do «Uruguay
    Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1594/95 de la Comisión, de 30 de junio de 1995, por
    el que, con vistas a la aplicación del Acuerdo agrícola celebrado en el marco
    de las negociaciones de la Ronda Uruguay, se modifican los Reglamentos (CEE) nº
    2698/93 y (CE) nº 1590/94 para la adaptación transitoria de algunas disposiciones
    relativas a las importaciones en la Comunidad de ciertos productos del sector
    de la carne de porcino procedentes de la República de Polonia, de la República
    de Hungría, de la República Checa, de la República Eslovaca, de la República
    de Bulgaria y de Rumanía
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1594/95 av den 30 juni 1995 om ändring
    av förordningarna (EEG) nr 2698/93 och (EG) nr 1590/94 vad gäller en gradvis
    tillämpning av vissa bestämmelser för import till gemenskapen av vissa grisköttsprodukter
    från Polen, Ungern, Tjeckien, Slovakien, Bulgarien och Rumänien och i syfte
    att genomföra det jordbruksavtal som slöts inom ramen för handelsförhandlingarna
    i Uruguayrundan
