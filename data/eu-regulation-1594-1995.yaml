    tilpasning af visse bestemmelser for indførsel til Fællesskabet af visse svinekødsprodukter
    fra Polen, Ungarn, Tjekkiet, Slovakiet, Bulgarien og Rumænien med henblik på
    iværksættelsen af den landbrugsaftale, der er indgået i forbindelse med forhandlingerne
    under Uruguay-runden
  type: main
- language: el
  script: Grek
