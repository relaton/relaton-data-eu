title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1594/95 of 30 June 1995 amending Regulations
    (EEC) No 2698/93 and (EC) No 1590/94 with regard to the transitional adjustment
    of certain rules on imports to the Community of certain pigmeat products from
    the Republic of Poland, the Republic of Hungary, the Czech Republic, the Slovak
    Republic, the Republic of Bulgaria and Romania in order to implement the Agricultural
    Agreement concluded during the Uruguay Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1594/95 de la Commission, du 30 juin 1995, modifiant
    les règlements (CEE) n° 2698/93 et (CE) n 1590/94 en ce qui concerne l'adaptation
    transitoire de certaines dispositions relatives aux importations dans la Communauté
    de certains produits du secteur de la viande de porc en provenance de République
    de Pologne, de République de Hongrie, de République tchèque, de République
    slovaque, de République de Bulgarie et de Roumanie en vue de la mise en oeuvre
    de l'accord sur l'agriculture conclu dans le cadre des négociations du cycle
    d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1594/95 der Kommission vom 30. Juni 1995 zur Änderung
    der Verordnungen (EWG) Nr. 2698/93 und (EG) Nr. 1590/94 zur übergangsweisen Anpassung
    mehrer Bestimmungen betreffend die Einfuhr in die Gemeinschaft von Erzeugnissen
    des Sektors Schweinefleisch aus der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakischen Republik, der Republik Bulgarien und der Republik Rumänien
    für die Anwendung des im Rahmen der multilateralen Handelsverhandlungen der Uruguay-Runde
    über die Landwirtschaft getroffenen Übereinkommens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1594/95 af 30. juni 1995 om ændring
