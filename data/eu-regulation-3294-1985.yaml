title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3294/85 of 21 November 1985 amending Regulation
    (EEC) No 3433/81 laying down detailed rules for the application of Regulation
    (EEC) No 1796/81 as regards imports of preserved cultivated mushrooms originating
    in non-member countries and Regulation (EEC) No 1303/83 as regards the system
    of import licences for products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3294/85 de la Commission du 21 novembre 1985 modifiant
    le règlement (CEE) no 3433/81 portant modalités d' application du règlement
    (CEE) no 1796/81 en ce qui concerne les importations de champignons cultivés
    originaires des pays tiers et le règlement (CEE) no 1303/83 en ce qui concerne
    le régime des certificats d' importation dans le secteur des produits transformés
    à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3294/85 der Kommission vom 21. November 1985 zur Änderung
    der Verordnung (EWG) Nr. 3433/81 mit Durchführungsbestimmungen zur Verordnung
    (EWG) Nr. 1796/81 des Rates hinsichtlich der Einfuhr von Zuchtpilzkonserven mit
    Ursprung in Drittländern und der Verordnung (EWG) Nr. 1303/83 betreffend die
    Einfuhrlizenzregelung für Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3294/85 af 21. november 1985 om ændring
    af forordning (EØF) nr. 3433/81 om gennemførelsesbestemmelser til forordning
    (EØF) nr. 1796/81 for så vidt angår indførsel af dyrkede svampe med oprindelse
    i tredjelande og forordning (EØF) nr. 1303/83 for så vidt angår ordningen med
    importlicenser for produkter forarbejdet på basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3294/85 της Επιτροπής
    της 21ης Νοεμβρίου 1985 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3433/81 σχετικά με τις λεπτομέρειες
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 1796/81 όσον
    αφορά τις εισαγωγές καλλιεργουμένων μανιταριών
    καταγωγής τρίτων χωρών, και τον κανονισμό (ΕΟΚ)
    αριθ. 1303/83 όσον αφορά το καθεστώς των πιστοποιητικών
    εισαγωγής στον τομέα των μεταποιημένων προϊόντων
    με βάση τα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3294/85 della Commissione del 21 novembre 1985 che
    modifica il regolamento (CEE) n. 3433/81 recante modalità d' applicazione del
    regolamento (CEE) n. 1796/81, per quanto riguarda le importazioni di conserve
    di funghi coltivati originari di paesi terzi, e il regolamento (CEE) n. 1303/83
    per quanto concerne il regime dei titoli d' importazione nel settore dei prodotti
    trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3294/85 van de Commissie van 21 november 1985 tot
    wijziging van Verordening (EEG) nr. 3433/81 houdende uitvoeringsbepalingen van
    Verordening (EEG) nr. 1796/81 met betrekking tot de invoer van conserven van gekweekte
    paddestoelen van oorsprong uit derde landen en tot wijziging van Verordening (EEG)
    nr. 1303/83 met betrekking tot het stelsel van invoercertificaten in de sector
    van op basis van groenten en fruit verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3294/85 da Comissão, de 21 de Novembro de 1985,
    que altera o Regulamento (CEE) n.° 3433/81 que estabelece as modalidades de aplicação
    do Regulamento (CEE) n.° 1796/81 no que diz respeito às importações de cogumelos
    cultivados originários de países terceiros e o Regulamento (CEE) n.° 1303/83
    no que diz respeito ao regime dos certificados de importação no sector dos produtos
    transformados à base de frutas e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3294/85 de la Comisión, de 21 de noviembre de 1985,
    por el que se modifica el Reglamento (CEE) n° 3433/81 relativo a las modalidades
    de aplicación del Reglamento (CEE) n° 1796/81 en lo relativo a las importaciones
    de champiñones cultivados originarios de terceros países y el Reglamento (CEE)
    n° 1303/83 en lo relativo al régimen de los certificados de importación en
    el sector de los productos elaborados a base de frutas y hortalizas
