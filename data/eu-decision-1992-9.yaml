    Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Islamischen
    Bundesrepublik Komoren über die Fischerei vor der Küste der Komoren für die
    Zeit vom 20. Juli 1991 bis zum 19. Juli 1994'
  type: main
