    for perioden 20. juli 1991 til 19. juli 1994 af de fiskerimuligheder og den finansielle
    modydelse, der er omhandlet i aftalen mellem Det Europæiske Økonomiske Fællesskab
    og Den Islamiske Forbundsrepublik Comorerne om fiskeri ud for Comorerne'
  type: main
- language: el
