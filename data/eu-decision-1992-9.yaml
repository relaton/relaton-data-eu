- language: en
  script: Latn
  content: '92/9/EEC: Council Decision of 17 December 1991 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol establishing the fishing opportunities and financial contribution
    provided for in the Agreement between the European Economic Community and the
    Islamic Federal Republic of the Comoros on fishing off the Comoros for the period
    from 20 July 1991 to 19 July 1994'
  type: main
- language: fr
  script: Latn
  content: '92/9/CEE: Décision du Conseil, du 17 décembre 1991, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contribution financière
    prévues par l''accord entre la Communauté économique européenne et la République
    fédérale islamique des Comores concernant la pêche au large des Comores, pour
    la période allant du 20 juillet 1991 au 19 juillet 1994'
  type: main
- language: de
  script: Latn
  content: '92/9/EWG: Beschluß des Rates vom 17. Dezember 1991 über den Abschluß
