title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1250/2002 of 11 July 2002 derogating, for
    the 2001/02 marketing year, from the time limits provided for in Article 12(3)
    and (5) and Article 20(2) of Regulation (EC) No 2366/98 laying down detailed rules
    for the application of the system of production aid for olive oil for the 1998/99
    to 2003/04 marketing years
