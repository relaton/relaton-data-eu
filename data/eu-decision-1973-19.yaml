id: EUDecision197319
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 February 1973 authorizing the Italian Republic
    not to apply Community treatment to concentrated orange juice falling within heading
    No ex 20.07 of the Common Customs Tariff, originating in Morocco and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/19/CEE de la Commission, du 12 février 1973, autorisant la
    République italienne à exclure du traitement communautaire les jus concentrés
    d'orange, de la position Ex 20.07 du Tarif douanier commun, originaires du Maroc
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Februar 1973, mit der die Italienische
    Republik ermächtigt wird, aus Marokko stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche konzentrierte Orangensäfte der Tarifnummer ex 20.07
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 12. februar 1973 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage koncentrerede safter af appelsiner
    som henhører under position ex 20.07 i den fælles toldtarif, har oprindelse
    i Marokko og overgår til fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 febbraio 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i succchi concentrati di arancia
    della voce n. ex 20.07 della tariffa doganale comune, originari del Marocco e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 februari 1973 waarbij de Italiaanse
    Republiek wordt gemachtigd geconcentreerd sinaasappelsap van post ex 20.07 van
    het gemeenschappelijk douanetarief, van oorsprong uit Marokko en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
