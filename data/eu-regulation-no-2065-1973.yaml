  content: Regulation (EEC) No 2065/73 of the Commission of 19 July 1973 fixing the
    rates of the refunds applicable from 1 August 1973 to eggs and egg yolks exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2065/73 de la Commission, du 19 juillet 1973, fixant
    les taux des restitutions applicables, à compter du 1er août 1973, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2065/73 der Kommission vom 19. Juli 1973 zur Festsetzung
    der ab 1. August 1973 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2065/73 af 19. juli 1973 om fastsættelse
    af de restitutionssatser, der fra 1. august 1973 skal anvendes for æg og æggeblommer,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2065/73 della Commissione, del 19 luglio 1973, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 agosto 1973 alle
    uova e al giallo d'uova esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2065/73 van de Commissie van 19 juli 1973 houdende
    vaststelling van de restituties die met ingang van 1 augustus 1973 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
