title:
- language: en
  script: Latn
  content: '88/15/EEC: Commission Decision of 17 December 1987 amending Decision 86/77/EEC
    approving certain food-aid operations carried out by humanitarian organizations
    and exempting them from monetary compensatory amounts (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/15/CEE: Décision de la Commission du 17 décembre 1987 modifiant la
    décision 86/77/CEE relative à l''agrément d''opérations d''aide alimentaire
    réalisées par des organismes à but humanitaire, les dispensant de l''application
    des montants compensatoires monétaires (Le texte en langue anglaise est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/15/EWG: Entscheidung der Kommission vom 17. Dezember 1987 über die
    Änderung der Entscheidung 86/77/EWG zur Anerkennung von Nahrungsmittelhilfsmaßnahmen
    humanitärer Organisationen und zu deren Freistellung von Währungsausgleichsbeträgen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/15/EØF: Kommissionens beslutning af 17. december 1987 om ændring
    af beslutning 86/77/EØF om godkendelse af humanitære organisationers fødevarehjælpeaktioner
    med henblik på deres fritagelse for anvendelsen af monetære udligningsbeløb
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/15/ΕΟΚ: Απόφαση της Επιτροπής της 17ης Δεκεμβρίου
    1987 που τροποποιεί την απόφαση 86/77/ΕΟΚ περί εγκρίσεως
    πράξεων επισιτιστικής βοήθειας που πραγματοποιούνται
    από οργανισμούς με φιλανθρωπικό σκοπό και
    οι οποίες εξαιρούνται από την εφαρμογή νομισματικών
    εξισωτικών ποσών (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/15/CEE: Decisione della Commissione del 17 dicembre 1987 che modifica
    la decisione 86/77/CEE relativa all''approvazione di operazioni d''aiuto alimentare
    realizzate da un ente avente finalità umanitarie, ai fini dell''esenzione dall''applicazione
    degli importi compensativi monetari (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '88/15/EEG: Beschikking van de Commissie van 17 december 1987 tot wijziging
