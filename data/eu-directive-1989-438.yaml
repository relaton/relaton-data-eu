title:
- language: en
  script: Latn
  content: Council Directive 89/438/EEC of 21 June 1989 amending Directive 74/561/EEC
    on admission to the occupation of road haulage operator in national and international
    transport operations, Directive 74/562/EEC on admission to the occupation of road
    passenger transport operator in national and international transport operations
    and Directive 77/796/EEC aiming at the mutual recognition of diplomas, certificates
    and other evidence of formal qualifications for goods haulage operators and road
    passenger transport operators, including measures intended to encourage these
    operators effectively to exercise their right to freedom of establishment
  type: main
- language: fr
  script: Latn
  content: Directive 89/438/CEE du Conseil du 21 juin 1989 modifiant la directive
    74/561/CEE concernant l'accès à la profession de transporteur de marchandises
    par route dans le domaine des transports nationaux et internationaux, la directive
    74/562/CEE concernant l'accès à la profession de transporteur de voyageurs par
    route dans le domaine des transports nationaux et internationaux et la directive
    77/796/CEE visant à la reconnaissance mutuelle des diplômes, certificats et
    autres titres de transporteur de marchandises et de transporteur de personnes
    par route et comportant des mesures destinées à favoriser l'exercice effectif
    de la liberté d'établissement des transporteurs
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/438/EWG des Rates vom 21. Juni 1989 zur Änderung der Richtlinie
    74/561/EWG über den Zugang zum Beruf des Güterkraftverkehrsunternehmers im innerstaatlichen
    und grenzüberschreitenden Verkehr, der Richtlinie 74/562/EWG über den Zugang
    zum Beruf des Personenkraftverkehrsunternehmers im innerstaatlichen und grenzüberschreitenden
    Verkehr und der Richtlinie 77/796/EWG über die gegenseitige Anerkennung der Diplome,
    Prüfungszeugnisse und sonstigen Befähigungsnachweise für die Beförderung von
    Gütern und die Beförderung von Personen im Straßenverkehr und über Maßnahmen
    zur Förderung der tatsächlichen Inanspruchnahme der Niederlassungsfreiheit der
    betreffenden Verkehrsunternehmer
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/438/EØF af 21. juni 1989 om ændring af direktiv 74/561/EØF
    om adgang til erhvervet med godstransport ad landevej i indenlandsk og international
    transport, direktiv 74/562/EØF om adgang til erhvervet med personbefordring ad
    landevej i indenlandsk og international transport og direktiv 77/796/EØF om gensidig
    anerkendelse af eks0amensbeviser, certifikater og andre kvalifikationsbeviser
    i forbindelse med udøvelse af transportvirksomhed inden for personbefordring
    og transportvirksomhed inden for godstransport ad landevej omfattende foranstaltninger,
    som skal lette den faktiske udøvelse af etableringsfrihed for de pågældende
    udøvere af transportvirksomhed
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/438/ΕΟΚ του Συμβουλίου της 21ης Ιουνίου
    1979 για την τροποποίηση της οδηγίας 74/561/ΕΟΚ
    περί προσβάσεως στο επάγγελμα του μεταφορέα
    εμπορευμάτων στον τομέα των εσωτερικών και
    διεθνών οδικών μεταφορών, της οδηγίας 74/562/ΕΟΚ
    περί προσβάσεως στο επάγγελμα του μεταφορέα
    επιβατών στον τομέα των εσωτερικών και διεθνών
    οδικών μεταφορών και της οδηγίας 77/796/ΕΟΚ περί
    της αμοιβαίας αναγνωρίσεως των διπλωμάτων,
    πιστοποιητικών και άλλων τίτλων των οδικών
    μεταφορέων εμπορευμάτων και μεταφορέων επιβατών
    και περί των μέτρων προς διευκόλυνση της πραγματικής
    ασκήσεως του δικαιώματος εγκαταστάσεως των
    μεταφορέων αυτών
  type: main
- language: it
  script: Latn
  content: Direttiva 89/438/CEE del Consiglio del 21 giugno 1989 che modifica la direttiva
    74/561/CEE riguardante l'accesso alla professione di trasportatore di merci su
    strada nel settore dei trasporti nazionali ed internazionali, la direttiva 74/562/CEE
    riguardante l'accesso alla professione di trasportatore di viaggiatori su strada
    nel settore dei trasporti nazionali ed internazionali e la direttiva 77/796/CEE
    per il riconoscimento reciproco di diplomi, certificati ed altri titoli di trasportatore
    di merci e di trasportatore di persone su strada e che comporta misure destinate
    a favorire l'esercizio effettivo della libertà di stabilimento di detti trasportatori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/438/EEG van de Raad van 21 juni 1989 tot wijziging van Richtlijn
    74/561/EEG inzake de toegang tot het beroep van ondernemer van nationaal en internationaal
    goederenvervoer over de weg, Richtlijn 74/562/EEG inzake de toegang tot het beroep
    van ondernemer van nationaal en internationaal personenvervoer over de weg en
    Richtlijn 77/796/EEG inzake de onderlinge erkenning van diploma's, certificaten
    en andere titels van ondernemer van goederenvervoer over de weg en ondernemer
    van personenvervoer over de weg en houdende maatregelen ter bevordering van de
    daadwerkelijke uitoefening van het recht van vrije vestiging van die vervoersondernemers
  type: main
- language: pt
  script: Latn
  content: Directiva 89/438/CEE do Conselho de 21 de Junho de 1989 que altera a Directiva
    74/561/CEE, relativa ao acesso à profissão de transportador rodoviário de mercadorias
    no domínio dos transportes nacionais e internacionais, a Directiva 74/562/CEE,
    relativa ao acesso à profissão de transportador rodoviário de passageiros no
    domínio dos transportes nacionais e internacionais e a Directiva 77/796/CEE,
    que tem por objectivo o reconhecimento mútuo dos diplomas, certificados e outros
    títulos de transportador rodoviário de mercadorias e de transportador rodoviário
    de passageiros e que inclui medidas destinadas a facilitar o exercício efectivo
    da liberdade de estabelecimento dos transportadores
  type: main
- language: es
  script: Latn
  content: Directiva 89/438/CEE del Consejo de 21 de junio de 1989 por la que se modifica
    la Directiva 74/561/CEE relativa al acceso a la profesión de transportista de
    mercancías por carretera en el sector de los transportes nacionales e internacionales,
    la Directiva 74/562/CEE relativa al acceso a la profesión de transportista de
    viajeros por carretera en el sector de los transportes nacionales e internacionales
    y la Directiva 77/796/CEE relativa al reconocimiento recíproco de los diplomas,
    certificados y otros títulos de transportista de mercancías y de transportista
    de viajeros por carretera y en la que se incluyen medidas destinadas a favorecer
    el ejercicio efectivo de la libertad de establecimiento de los transportistas
  type: main
