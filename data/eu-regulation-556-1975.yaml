id: EURegulation5561975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 556/75 of the Commission of 4 March 1975 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors); photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 556/75 de la Commission, du 4 mars 1975, portant rétablissement
    de la perception des droits de douane applicables aux appareils de projection
    fixé; appareils d'agrandissement ou de réduction photographiques, de la position
    tarifaire 90.09, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 556/75 der Kommission vom 4. März 1975 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer; photographische Vergrößerungs- oder Verkleinerungsapparate,
    der Tarifnummer 90.09, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 556/75 af 4. marts 1975 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater; forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske) under position 90.09, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 556/75 della Commissione, del 4 marzo 1975, che ripristina
    la riscossione dei dazi doganali applicabili agli apparecchi da proiezione fissa,
    apparecchi fotografici d'ingrandimento o di riduzione della voce doganale 90.09
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 556/75 van de Commissie van 4 maart 1975 houdende
    wederinstelling van de heffing van de douanerechten voor projectietoestellen voor
    niet bewegende beelden; vergrotings- en verkleiningstoestellen voor de fotografie
    van post 90.09 van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 tariefpreferenties
    werden geopend
  type: main
