  content: Regulation (EEC) No 2471/74 of the Commission of 27 September 1974 fixing
    the rates of the refunds applicable from 1 October 1974 to certain cereals and
    rice products exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2471/74 de la Commission, du 27 septembre 1974, fixant
    les taux des restitutions applicables, à compter du 1er octobre 1974, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2471/74 der Kommission vom 27. September 1974 zur
    Festsetzung der ab 1. Oktober 1974 geltenden Erstattungssätze bei der Ausfuhr
    bestimmter Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des
    Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2471/74 af 27. september 1974 om fastsættelse
