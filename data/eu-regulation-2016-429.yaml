---
id: EURegulation2016429
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2016/429 of the European Parliament and of the Council
    of 9 March 2016 on transmissible animal diseases and amending and repealing certain
    acts in the area of animal health (‘Animal Health Law’)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2016/429 du Parlement Européen et du Conseil du 9 mars
    2016 relatif aux maladies animales transmissibles et modifiant et abrogeant certains
    actes dans le domaine de la santé animale («législation sur la santé animale»)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2016/429 des Europäischen Parlaments und des Rates vom
    9. März 2016 zu Tierseuchen und zur Änderung und Aufhebung einiger Rechtsakte
    im Bereich der Tiergesundheit („Tiergesundheitsrecht“)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2016/429 на Европейския парламент
    и на Съвета от 9 март 2016 година за заразните
    болести по животните и за изменение и отмяна
    на определени актове в областта на здравеопазването
    на животните (Законодателство за здравеопазването
    на животните)
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2016/429 ze dne 9. března
    2016 o nákazách zvířat a o změně a zrušení některých aktů v oblasti
    zdraví zvířat („právní rámec pro zdraví zvířat“)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2016/429 af 9. marts 2016
    om overførbare dyresygdomme og om ændring og ophævelse af visse retsakter på
    området for dyresundhed (»dyresundhedsloven«)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EE) 2016/429 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 9ης Μαρτίου 2016, σχετικά
    με τις μεταδοτικές νόσους των ζώων και για
    την τροποποίηση και την κατάργηση ορισμένων
    πράξεων στον τομέα της υγείας των ζώων («νόμος
    για την υγεία των ζώων»)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2016/429, 9. märts 2016,
    loomataudide kohta, millega muudetakse teatavaid loomatervise valdkonna õigusakte
    või tunnistatakse need kehtetuks (loomatervise määrus)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2016/429, annettu 9 päivänä
    maaliskuuta 2016, tarttuvista eläintaudeista sekä tiettyjen eläinterveyttä
    koskevien säädösten muuttamisesta ja kumoamisesta (”eläinterveyssäännöstö”)
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2016/429 ó Pharlaimint na hEorpa agus ón gComhairle an
    9 Márta 2016 maidir le galair in-tarchurtha ainmhithe agus lena leasaítear agus
    lena n-aisghairtear gníomhartha áirithe i réimse na sláinte ainmhithe (“Dlí
    maidir le Sláinte Ainmhithe”)
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2016/429 Europskog parlamenta i Vijeća od 9. ožujka 2016.
    o prenosivim bolestima životinja te o izmjeni i stavljanju izvan snage određenih
    akata u području zdravlja životinja („Zakon o zdravlju životinja”)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2016/429 rendelete (2016. március
    9.) a fertőző állatbetegségekről és egyes állategészségügyi jogi aktusok
    módosításáról és hatályon kívül helyezéséről („Állategészségügyi
    rendelet”)
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2016/429 del Parlamento europeo e del Consiglio, del 9
    marzo 2016, relativo alle malattie animali trasmissibili e che modifica e abroga
    taluni atti in materia di sanità animale («normativa in materia di sanità animale»)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2016/429 (2016. gada 9. marts)
    par pārnēsājamām dzīvnieku slimībām un ar ko groza un atceļ konkrētus
    aktus dzīvnieku veselības jomā (“Dzīvnieku veselības tiesību akts”)
  type: main
- language: lt
  script: Latn
  content: 2016 m. kovo 9 d. Europos Parlamento ir Tarybos reglamentas (ES) 2016/429
    dėl užkrečiamųjų gyvūnų ligų, kuriuo iš dalies keičiami ir panaikinami
    tam tikri gyvūnų sveikatos srities aktai („Gyvūnų sveikatos teisės aktas“)
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2016/429 tal-Parlament Ewropew u tal-Kunsill tad-9 ta'
    Marzu 2016 dwar il-mard trasmissibbli tal-annimali u li jemenda u jħassar ċerti
    atti fil-qasam tas-saħħa tal-annimali (“Liġi dwar is-Saħħa tal-Annimali”)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart
    2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van
    bepaalde handelingen op het gebied van diergezondheid („diergezondheidswetgeving”)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2016/429 z dnia 9
    marca 2016 r. w sprawie przenośnych chorób zwierząt oraz zmieniające i uchylające
    niektóre akty w dziedzinie zdrowia zwierząt („Prawo o zdrowiu zwierząt”)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2016/429 do Parlamento Europeu e do Conselho, de 9 de
    março de 2016, relativo às doenças animais transmissíveis e que altera e revoga
    determinados atos no domínio da saúde animal («Lei da Saúde Animal»)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2016/429 al Parlamentului European și al Consiliului
    din 9 martie 2016 privind bolile transmisibile ale animalelor și de modificare
    și de abrogare a anumitor acte din domeniul sănătății animalelor („Legea
    privind sănătatea animală”)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2016/429 z 9. marca 2016
    o prenosných chorobách zvierat a zmene a zrušení určitých aktov v oblasti
    zdravia zvierat („právna úprava v oblasti zdravia zvierat“)
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2016/429 Evropskega parlamenta in Sveta z dne 9. marca 2016
    o prenosljivih boleznih živali in o spremembi ter razveljavitvi določenih aktov
    na področju zdravja živali („Pravila o zdravju živali“)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2016/429 del Parlamento Europeo y del Consejo, de 9 de
    marzo de 2016, relativo a las enfermedades transmisibles de los animales y por
    el que se modifican o derogan algunos actos en materia de sanidad animal («Legislación
    sobre sanidad animal»)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2016/429 av den 9 mars
    2016 om överförbara djursjukdomar och om ändring och upphävande av vissa akter
    med avseende på djurhälsa (”djurhälsolag”)
  type: main
