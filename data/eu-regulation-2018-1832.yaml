    transporto priemonių išmetamų teršalų kiekį bandymus ir procedūras, įskaitant
    skirtus eksploatuojamų transporto priemonių atitikčiai patikrinti ir realiomis
    važiavimo sąlygomis išmetamų teršalų kiekiui nustatyti, ir nustatyti degalų
    ir elektros energijos sąnaudų stebėsenos įtaisus, iš dalies keičiama Europos
