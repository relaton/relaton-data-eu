title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2018/1832 of 5 November 2018 amending Directive
    2007/46/EC of the European Parliament and of the Council, Commission Regulation
    (EC) No 692/2008 and Commission Regulation (EU) 2017/1151 for the purpose of improving
    the emission type approval tests and procedures for light passenger and commercial
    vehicles, including those for in-service conformity and real-driving emissions
    and introducing devices for monitoring the consumption of fuel and electric energy
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2018/1832 de la Commission du 5 novembre 2018 modifiant
    la directive 2007/46/CE du Parlement européen et du Conseil, le règlement (CE)
    n° 692/2008 de la Commission et le règlement (UE) 2017/1151 de la Commission
    aux fins d'améliorer les essais et procédures de réception par type au regard
    des émissions des véhicules particuliers et utilitaires légers, y compris les
    essais et procédures ayant trait à la conformité en service et aux émissions
    en conditions de conduite réelles, et d'introduire des dispositifs de surveillance
    de la consommation de carburant et d'énergie électrique
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2018/1832 der Kommission vom 5. November 2018 zur Änderung
    der Richtlinie 2007/46/EG des Europäischen Parlaments und des Rates, der Verordnung
    (EG) Nr. 692/2008 der Kommission und der Verordnung (EU) 2017/1151 der Kommission
    im Hinblick auf die Verbesserung der emissionsbezogenen Typgenehmigungsprüfungen
    und -verfahren für leichte Personenkraftwagen und Nutzfahrzeuge, unter anderem
    in Bezug auf die Übereinstimmung in Betrieb befindlicher Fahrzeuge und auf Emissionen
    im praktischen Fahrbetrieb und zur Einführung von Einrichtungen zur Überwachung
    des Kraftstoff- und des Stromverbrauchs
  type: main
