    Uredbe Komisije (EU) 2017/1151 u svrhu poboljšanja homologacijskih ispitivanja
    i postupaka za emisije iz lakih osobnih i gospodarskih vozila, uključujući one
    za sukladnost u uporabi i stvarne emisije tijekom vožnje te uvođenje uređaja
    za praćenje potrošnje goriva i električne energije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1832 rendelete (2018. november 5.) a 2007/46/EK
    európai parlamenti és tanácsi irányelvnek, a 692/2008/EK bizottsági rendeletnek
    és az (EU) 2017/1151 bizottsági rendeletnek a könnyű személy- és haszongépjárművek
    kibocsátás tekintetében történő típusjóváhagyása céljából alkalmazott
    vizsgálatok és eljárások, ezen belül a használatban lévő járművek megfelelőségére
    és a valós vezetési feltételek melletti kibocsátásokra vonatkozó vizsgálatok
    és eljárások továbbfejlesztése, valamint a tüzelőanyag- és elektromosenergia-fogyasztás
    nyomon követésére szolgáló berendezések bevezetése érdekében történő
    módosításáról
  type: main
