    (EG) nr 692/2008 och (EU) 2017/1151 i syfte att förbättra förfaranden och provningar
    för typgodkännande avseende utsläpp av lätta personbilar och lätta nyttofordon,
    inbegripet sådana för överensstämmelse hos fordon i drift och utsläpp vid
    verklig körning, och införa anordningar för övervakning av förbrukning av
    bränsle och elenergi
