    (CE) n.° 692/2008 da Comissão e o Regulamento (UE) 2017/1151 da Comissão com
    o objetivo de melhorar os ensaios e procedimentos de homologação no que respeita
    às emissões dos veículos ligeiros de passageiros e comerciais, incluindo os
    que dizem respeito à conformidade em circulação e às emissões reais de condução,
    e de introduzir dispositivos para a monitorização do consumo de combustível
    e energia elétrica
  type: main
