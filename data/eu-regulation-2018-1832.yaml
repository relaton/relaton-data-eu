    692/2008 a nariadenie Komisie (EÚ) 2017/1151 na účely zlepšenia skúšok a
    postupov typového schvaľovania z hľadiska emisií ľahkých osobných a úžitkových
    vozidiel vrátane skúšok a postupov z hľadiska zhody v prevádzke a emisií
    počas skutočnej jazdy, ako aj zavedenia zariadení na monitorovanie spotreby
