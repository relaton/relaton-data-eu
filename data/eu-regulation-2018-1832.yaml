    un komerciālo transportlīdzekļu emisijas tipa apstiprināšanas testus un procedūras,
    ieskaitot par atbilstību ekspluatācijā un emisijām reālos braukšanas apstākļos,
    un ieviest ierīces degvielas un elektroenerģijas patēriņa pārraudzībai
  type: main
