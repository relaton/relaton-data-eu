    della Commissione (CE) n. 692/2008 e (UE) 2017/1151 al fine di migliorare le prove
    e le procedure di omologazione per le emissioni dei veicoli passeggeri e commerciali
    leggeri, comprese quelle per la conformità in servizio e le emissioni reali,
    e di introdurre dispositivi per il monitoraggio del consumo di carburante e di
    energia elettrica
  type: main
