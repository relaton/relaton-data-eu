    (CE) nr. 692/2008 al Comisiei și a Regulamentului (UE) 2017/1151 al Comisiei
    în scopul îmbunătățirii încercărilor și procedurilor de omologare de tip
    referitoare la emisii pentru vehiculele ușoare de pasageri și comerciale, inclusiv
    a celor referitoare la conformitatea în funcțiune și la emisii în condiții
    de conducere reale și în scopul introducerii de dispozitive pentru monitorizarea
    consumului de combustibil și de energie electrică
