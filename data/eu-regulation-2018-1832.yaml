    2007/46/ES Evropskega parlamenta in Sveta, Uredbe Komisije (ES) št. 692/2008
    in Uredbe Komisije (EU) 2017/1151 zaradi izboljšanja preskusov in postopkov za
    homologacijo emisij iz lahkih potniških in gospodarskih vozil, vključno s tistimi
    za skladnost v prometu in dejanske emisije, ki nastajajo med vožnjo, ter zaradi
    uvedbe naprav za spremljanje porabe goriva in električne energije
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2018/1832 de la Comisión, de 5 de noviembre de 2018, por
    el que se modifican la Directiva 2007/46/CE del Parlamento Europeo y del Congreso,
    el Reglamento (CE) n.° 692/2008 de la Comisión y el Reglamento (UE) 2017/1151
    de la Comisión a fin de mejorar los ensayos y los procedimientos de homologación
    de tipo en lo concerniente a las emisiones aplicables a turismos y vehículos
    comerciales ligeros, en particular los que se refieren a la conformidad en circulación
    y a las emisiones en condiciones reales de conducción, y por el que se introducen
    dispositivos para la monitorización del consumo de combustible y energía eléctrica
  type: main
