id: EUDecision1993676
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '93/676/EC: Commission Decision of 10 December 1993 establishing that the
    exploitation of geographical areas for the purpose of exploring for or extracting
    oil or gas does not constitute in the Netherlands an activity defined in Article
    2 (2) (b) (i) of Council Directive 90/531/EEC and that entities carrying on such
    an activity are not to be considered in the Netherlands as operating under special
    or exclusive rights within the meaning of Article 2 (3) (b) of the Directive (Only
    the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/676/CE: Décision de la Commission, du 10 décembre 1993, constatant
    que l''exploitation d''aires géographiques dans le but de prospecter ou d''extraire
    du pétrole ou du gaz ne constitue pas aux Pays-Bas une activité visée à l''article
    2 paragraphe 2 point b) i) de la directive 90/531/CEE du Conseil et que les entités
    exerçant cette activité ne sont pas considérées aux Pays-Bas comme bénéficiant
    de droits spéciaux ou exclusifs au sens de l''article 2 paragraphe 3 point b)
    de cette directive (Le texte en langue néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/676/EG: Entscheidung der Kommission vom 10. Dezember 1993 Die Nutzung
    eines geographisch abgegrenzten Gebiets zum Zwecke der Suche nach oder Förderung
    von Erdöl oder Gas in den Niederlanden ist keine Tätigkeit im Sinne von Artikel
    2 Absatz 2 Buchstabe b) Ziffer i) der Richtlinie 90/531/EWG des Rates, und die
    diese Tätigkeit ausübenden Auftraggeber besitzen in den Niederlanden keine besonderen
    oder ausschließlichen Rechte im Sinne von Artikel 2 Absatz 3 Buchstabe b) dieser
    Richtlinie (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/676/EF: Kommissionens beslutning af 10. december 1993 om konstatering
    af, at udnyttelse af geografiske områder med henblik på efterforskning efter
    eller udvinding af olie eller gas i Nederlandene ikke udgør virksomhed, der er
    omhandlet i artikel 2, stk. 2, litra b), nr. i), i Rådets direktiv 90/531/EØF,
    og at de foretagender, der driver denne virksomhed, ikke i Nederlandene anses
    for at have særlige eller eksklusive rettigheder i henhold til artikel 2, stk.
    3, litra b), i dette direktiv (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/676/ΕΚ: Απόφαση της Επιτροπής της 10ης Δεκεμβρίου
    1993 με την οποία θεσπίζεται ότι η εκμετάλλευση
    γεωγραφικών περιοχών με σκοπό την αναζήτηση
    ή εξόρυξη πετρελαίου ή φυσικού αερίου δεν θεωρείται
    στις Κάτω Χώρες ως δραστηριότητα αναφερόμενη
    στο άρθρο 2 παράγραφος 2 στοιχείο β) σημείο i)
    της οδηγίας 90/531/ΕΟΚ του Συμβουλίου και ότι
    οι φορείς που ασκούν τις δραστηριότητες αυτές
    δεν θεωρούνται στις Κάτω Χώρες ότι απολαύουν
    ειδικών ή αποκλειστικών δικαιωμάτων κατά την
    έννοια του άρθρου 2 παράγραφος 3 στοιχείο β)
    της εν λόγω οδηγίας (Το κείμενο στην ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/676/CE: Decisione della Commissione, del 10 dicembre 1993, che constata
    che lo sfruttamento di aree geografiche ai fini della prospezione o dell''estrazione
    di petrolio o di gas naturale non costituisce nei Paesi Bassi un''attività di
    cui all''articolo 2, paragrafo 2, lettera b), punto i) della direttiva 90/531/CEE
    del Consiglio, del 17 settembre 1990, e che gli enti che esercitano tale attività
    non sono considerati nei Paesi Bassi fruire di diritti speciali o esclusivi ai
    sensi dell''articolo 2, paragrafo 3, lettera b) di detta direttiva (Il testo in
    lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/676/EG: Beschikking van de Commissie van 10 december 1993 waarbij wordt
    vastgesteld dat de exploitatie van geografische gebieden met het oogmerk van prospectie
    of winning van aardolie of gas in Nederland niet een relevante activiteit vormt
    in de zin van artikel 2, lid 2, onder b), punt i), van Richtlijn 90/531/EEG van
    de Raad en dat de diensten welke deze activiteit uitoefenen in Nederland niet
    geacht worden in aanmerking te komen voor bijzondere of uitsluitende rechten in
    de zin van artikel 2, lid 3, onder b), van deze richtlijn (Slechts de tekst in
    de Nederlandse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/676/CE: Decisão da Comissão, de 10 de Dezembro de 1993, que verifica
    que a exploração de áreas geográficas com o objectivo de prospectar ou extrair
    petróleo ou gás não constitui, nos Países Baixos, uma actividade abrangida
    pelo nº 2, alínea b), subalínea i), do artigo 2º da Directiva 90/531/CEE do
    Conselho e que as entidades que exercem esta actividade não são consideradas,
    nos Países Baixos, como beneficiárias de direitos especiais ou exclusivos, na
    acepção do nº 3, alínea b), do artigo 2º desta directiva (Apenas faz fé
    o texto em língua neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '93/676/CE: Decisión de la Comisión, de 10 de diciembre de 1993, por
    la que se establece que la explotación de zonas geográficas para la prospección
    o extracción de petróleo o gas no constituye en los Países Bajos una actividad
    contemplada en el inciso i) de la letra b) del apartado 2 del artículo 2 de la
    Directiva 90/531/CEE del Consejo, de 17 de septiembre de 1990, y que las entidades
    que ejerzan tal actividad no se consideran en los Países Bajos beneficiarias
    de derechos especiales o exclusivos a efectos de lo previsto en la letra b) del
    apartado 3 del artículo 2 de dicha Directiva (El texto en lengua neerlandesa
    es el único auténtico)'
  type: main
