title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1573/80 of 20 June 1980 laying down provisions
    for the implementation of Article 5 (2) of Council Regulation (EEC) No 1697/79
    on the post-clearance recovery of import duties or export duties which have not
    been required of the person liable for payment on goods entered for a customs
    procedure involving the obligation to pay such duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1573/80 de la Commission, du 20 juin 1980, fixant
    les dispositions d' application de l' article 5 paragraphe 2 du règlement (CEE)
    n° 1697/79 du Conseil concernant le recouvrement "a posteriori" des droits à
    l' importation ou des droits à l' exportation qui n' ont pas été exigés du
    redevable pour des marchandises déclarées pour un régime douanier comportant
    l' obligation de payer de tels droits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1573/80 der Kommission vom 20. Juni 1980 zur Durchführung
    von Artikel 5 Absatz 2 der Verordnung (EWG) Nr. 1697/79 des Rates betreffend die
    Nacherhebung von noch nicht vom Abgabenschuldner angeforderten Eingangs- oder
    Ausfuhrabgaben für Waren, die zu einem Zollverfahren angemeldet worden sind,
    das die Verpflichtung zur Zahlung derartiger Abgaben beinhaltet
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1573/80 af 20. juni 1980 om gennemførelsesbestemmelserne
    til artikel 5, stk. 2, i Rådets forordning (EØF) nr. 1697/79 om efteropkrævning
    af import- eller eksportafgifter, der ikke er opkrævet hos debitor for varer,
    der er angivet til en toldprocedure, som medfører en forpligtelse til at betale
    sådanne afgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1573/80 τής Επιτροπής
    τής 20ής Ιουνίου 1980 περί καθορισμού τών διατάξεων
    εφαρμογής τού άρθρου 5 παράγραφος 2 τού κανονισμού
    (EOK) αριθ. 1697/79 τού Συμβουλίου περί τής εισπράξεως
    εκ τών υστέρων εισαγωγικών ή εξαγωγικών δασμών
    πού δέν είχαν απαιτηθεί από τόν οφειλέτη, γιά
    εμπορεύματα δηλωθέντα γιά τελωνειακό καθεστώς
    πού συνεπάγεται υποχρέωση καταβολής τέτοιου
    είδους δασμών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1573/80 della Commissione, del 20 giugno 1980, che
    stabilisce le disposizioni d' applicazione dell' articolo 5, paragrafo 2, del
    regolamento (CEE) n. 1697/79 del Consiglio, relativo al recupero a posteriori
    dei dazi all' importazione o dei dazi all' esportazione che non sono stati corrisposti
    dal debitore per le merci dichiarate per une regime doganale comportante l' obbligo
    di effettuarne il pagamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1573/80 van de Commissie van 20 juni 1980 tot vaststelling
    van de uitvoeringsbepalingen van artikel 5, lid 2, van Verordening (EEG) nr. 1697/79
    van de Raad inzake navordering van de rechten bij invoer of bij uitvoer die niet
    van de belastingschuldige zijn opgeëist voor goederen welke zijn aangegeven voor
    een douaneregeling waaruit de verplichting tot betaling van dergelijke rechten
    voortvloeide
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1573/80 da Comissão, de 20 de Junho de 1980, que
    fixa as disposições de aplicação do n.° 2 do artigo 5.° do Regulamento (CEE)
    n.° 1697/79 do Conselho, relativo à cobrança "a posteriori" dos direitos de
    importação ou dos direitos de exportação que não tenham sido exigidos ao
    devedor por mercadorias declaradas para um regime aduaneiro que implica a obrigação
    de pagamento dos referidos direitos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1573/80 de la Comisión, de 20 de junio de 1980, por
    el que se fijan las disposiciones de aplicación del apartado 2 del artículo
    5 del Reglamento (CEE) n° 1697/79 del Consejo referente a la recaudación a posteriori
    de los derechos de importación o de los derechos de exportación que no hayan
    sido exigidos al deudor por mercancías declaradas en un régimen aduanero que
    suponga la obligación de pagar tales derechos
  type: main
