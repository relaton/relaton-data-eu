---
id: EUDecision20222461
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2461 of 14 December 2022 recognising
    the ‘KZR INiG’ scheme for demonstrating compliance with the requirements set
    out in Directive (EU) 2018/2001 of the European Parliament and of the Council
    as regards biofuels, bioliquids, biomass fuels, renewable liquid and gaseous fuels
    of non-biological origin and recycled carbon fuels and repealing Commission Implementing
    Decision (EU) 2022/603
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2461 de la Commission du 14 décembre
    2022 portant reconnaissance du système volontaire «KZR INiG» pour l’établissement
    de la conformité avec les exigences de la directive (UE) 2018/2001 du Parlement
    européen et du Conseil en ce qui concerne les biocarburants, les bioliquides,
    les combustibles issus de la biomasse, les carburants liquides et gazeux renouvelables
    d’origine non biologique et les carburants à base de carbone recyclé et abrogeant
    la décision d’exécution (UE) 2022/603 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2461 der Kommission vom 14. Dezember
    2022 zur Anerkennung des Systems „KZR INiG“ zum Nachweis der Einhaltung der
    in der Richtlinie (EU) 2018/2001 des Europäischen Parlaments und des Rates festgelegten
    Anforderungen für Biokraftstoffe, flüssige Biobrennstoffe, Biomasse-Brennstoffe,
    flüssige oder gasförmige erneuerbare Kraftstoffe nicht biogenen Ursprungs und
    wiederverwertete kohlenstoffhaltige Kraftstoffe sowie zur Aufhebung des Durchführungsbeschlusses
    (EU) 2022/603
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/2461 на Комисията
    от 14 декември 2022 година за признаване на схемата
    „KZR INiG“ за доказване на съответствие с изискванията,
    определени в Директива (ЕС) 2018/2001 на Европейския
    парламент и на Съвета по отношение на биогоривата,
    течните горива от биомаса, газообразните и
    твърдите горива от биомаса, възобновяемите
    течни и газообразни горива от небиологичен
    произход и рециклираните въглеродни горива
    и за отмяна на Решение за изпълнение (ЕС) 2022/603
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2461 ze dne 14. prosince 2022,
    kterým se uznává režim „KZR INiG“ pro prokázání souladu s požadavky
    stanovenými ve směrnici Evropského parlamentu a Rady (EU) 2018/2001, pokud
    jde o biopaliva, biokapaliny, paliva z biomasy, kapalná a plynná paliva z obnovitelných
    zdrojů nebiologického původu a recyklovaná paliva s obsahem uhlíku, a ruší
    prováděcí rozhodnutí Komise (EU) 2022/603
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2461 af 14. december
    2022 om anerkendelse af den frivillige ordning »KZR INiG« til påvisning af
    overholdelsen af kravene i Europa-Parlamentets og Rådets direktiv (EU) 2018/2001
    vedrørende biobrændstoffer, flydende biobrændsler, biomassebrændsler, vedvarende
    flydende og gasformige brændstoffer, der ikke er af biologisk oprindelse, samt
    genanvendte kulstofbrændsler og om ophævelse af Kommissionens gennemførelsesafgørelse
    (EU) 2022/603
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2461 της Επιτροπής
    της 14ης Δεκεμβρίου 2022 σχετικά με την αναγνώριση
    του καθεστώτος «KZR INiG» για την απόδειξη της
    συμμόρφωσης με τις απαιτήσεις που ορίζονται
    στην οδηγία (ΕΕ) 2018/2001 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τα βιοκαύσιμα,
    τα βιορευστά, τα καύσιμα βιομάζας, τα ανανεώσιμα
    υγρά και αέρια καύσιμα μη βιολογικής προέλευσης
    και τα καύσιμα ανακυκλωμένου άνθρακα και με
    την κατάργηση της εκτελεστικής απόφασης (ΕΕ)
    2022/603 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2461, 14. detsember 2022, kava „KZR
    INiG“ tunnustamise kohta Euroopa Parlamendi ja nõukogu direktiivis (EL) 2018/2001
    biokütuste, vedelate biokütuste, biomasskütuste, muust kui bioloogilise päritoluga
    taastuvtoorainest toodetud vedelate ja gaasiliste kütuste ning ringlusse võetud
    süsinikupõhiste kütuste jaoks sätestatud nõuete täitmise tõendamisel ning
    komisjoni rakendusotsuse (EL) 2022/603 kehtetuks tunnistamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2461, annettu 14 päivänä
    joulukuuta 2022, vapaaehtoisen järjestelmän ”KZR INiG” hyväksymisestä
    Euroopan parlamentin ja neuvoston direktiivissä (EU) 2018/2001 vahvistettujen
    vaatimusten noudattamisen osoittamista varten biopolttoaineiden, bionesteiden,
    biomassapolttoaineiden, muuta kuin biologista alkuperää olevien uusiutuvien
    nestemäisten ja kaasumaisten polttoaineiden ja kierrätettyjen hiilipitoisten
    polttoaineiden osalta sekä komission täytäntöönpanopäätöksen (EU) 2022/603
    kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2461 ón gCoimisiún an 14 Nollaig
    2022 lena dtugtar aitheantas don scéim “KZR IniG” chun a léiriú go bhfuil
    na ceanglais a leagtar amach i dTreoir (AE) 2018/2001 ó Pharlaimint na hEorpa
    agus ón gComhairle a mhéid a bhaineann le bithbhreoslaí, bithleachtanna, breoslaí
    bithmhaise, breoslaí leachtacha agus gásacha in-athnuaite de thionscnamh neamh-bhitheolaíoch
    agus breoslaí carbóin athchúrsáilte á gcomhlíonadh agus lena n-aisghairtear
    Cinneadh Cur Chun Feidhme (AE) 2022/603 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2461 оd 14. prosinca 2022. o priznavanju
    programa „KZR INiG” za dokazivanje usklađenosti sa zahtjevima iz Direktive
    (EU) 2018/2001 Europskog parlamenta i Vijeća za biogoriva, tekuća biogoriva,
    goriva iz biomase, obnovljiva tekuća i plinovita goriva nebiološkog podrijetla
    te goriva iz recikliranog ugljika i o stavljanju izvan snage Provedbene odluke
    Komisije (EU) 2022/603
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2461 végrehajtási határozata (2022. december
    14.) az (EU) 2018/2001 európai parlamenti és tanácsi irányelvben a bioüzemanyagokra,
    a folyékony bio-energiahordozókra, a biomasszából előállított üzemanyagokra,
    a nem biológiai eredetű, folyékony vagy gáznemű, megújuló energiaforrásból
    származó üzemanyagokra és a széntartalom újrahasznosításával nyert üzemanyagokra
    vonatkozó követelményeknek való megfelelést igazoló „KZR INiG” rendszer
    elismeréséről, valamint az (EU) 2022/603 bizottsági végrehajtási határozat
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2461 della Commissione del 14 dicembre
    2022 che riconosce il sistema «KZR INiG» per dimostrare il rispetto delle disposizioni
    della direttiva (UE) 2018/2001 del Parlamento europeo e del Consiglio per quanto
    riguarda i biocarburanti, i bioliquidi, i combustibili da biomassa, i carburanti
    rinnovabili liquidi e gassosi di origine non biologica e i carburanti derivanti
    da carbonio riciclato e che abroga la decisione di esecuzione (UE) 2022/603 della
    Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2461 (2022. gada 14. decembris),
    ar kuru shēmu KZR INiG atzīst par derīgu tam, lai pierādītu atbilstību prasībām,
    kas Eiropas Parlamenta un Padomes Direktīvā (ES) 2018/2001 noteiktas attiecībā
    uz biodegvielām, bioloģiskajiem šķidrajiem kurināmajiem, biomasas kurināmajiem/degvielām,
    nebioloģiskas izcelsmes atjaunīgajām šķidrajām un gāzveida degvielām un
    reciklēta oglekļa degvielām, un atceļ Komisijas Īstenošanas lēmumu (ES)
    2022/603
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2461 2022 m. gruodžio 14
    d. kuriuo pripažįstama, kad schema „KZR INiG“ tinka atitikčiai Europos
    Parlamento ir Tarybos direktyvoje (ES) 2018/2001 nustatytiems biodegalų, skystųjų
    bioproduktų, biomasės kuro, iš atsinaujinančiųjų išteklių pagaminto nebiologinės
    kilmės skystojo ir dujinio kuro bei perdirbtos anglies kuro reikalavimams įrodyti,
    ir panaikinamas Komisijos įgyvendinimo sprendimas (ES) 2022/603
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2461 tal-14
    ta’ Diċembru 2022 li tirrikonoxxi l-iskema “KZR INiG” biex tintwera l-konformità
    mar-rekwiżiti stabbiliti fid-Direttiva (UE) 2018/2001 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tal-bijokarburanti, il-bijolikwidi, il-karburanti tal-bijomassa,
    il-karburanti rinnovabbli likwidi u gassużi ta’ oriġini mhux bijoloġika u
    l-karburanti tal-karbonju riċiklat u li tħassar id-Deċiżjoni ta’ Implimentazzjoni
    tal-Kummissjoni (UE) 2022/603
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2461 van de Commissie van 14 december 2022
    tot erkenning van de regeling “KZR INiG” voor het aantonen van de naleving
    van de vereisten van Richtlijn (EU) 2018/2001 van het Europees Parlement en de
    Raad ten aanzien van biobrandstoffen, vloeibare biomassa, biomassabrandstoffen,
    hernieuwbare vloeibare en gasvormige brandstoffen van niet-biologische oorsprong
    en brandstoffen op basis van hergebruikte koolstof en tot intrekking van Uitvoeringsbesluit
    (EU) 2022/603 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2461 z dnia 14 grudnia 2022 r. w sprawie
    zatwierdzenia systemu „KZR INiG” w odniesieniu do wykazania zgodności z wymogami
    ustanowionymi w dyrektywie Parlamentu Europejskiego i Rady (UE) 2018/2001 dotyczącymi
    biopaliw, biopłynów, paliw z biomasy, odnawialnych paliw ciekłych i gazowych
    pochodzenia niebiologicznego oraz pochodzących z recyklingu paliw węglowych
    oraz w sprawie uchylenia decyzji wykonawczej Komisji (UE) 2022/603
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2461 da Comissão de 14 de dezembro de
    2022 relativa ao reconhecimento do regime «KZR INiG» para fins de demonstração
    do cumprimento dos requisitos estabelecidos na Diretiva (UE) 2018/2001 do Parlamento
    Europeu e do Conselho aplicáveis aos biocombustíveis, aos biolíquidos, aos
    combustíveis biomássicos, aos combustíveis líquidos e gasosos renováveis
    de origem não biológica e aos combustíveis de carbono reciclado e que revoga
    a Decisão de Execução (UE) 2022/603 da Comissão
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2461 a Comisiei din 14 decembrie
    2022 de recunoaștere a sistemului „KZR INiG” în vederea demonstrării conformității
    cu cerințele stabilite în Directiva (UE) 2018/2001 a Parlamentului European
    și a Consiliului în ceea ce privește biocombustibilii, biolichidele, combustibilii
    din biomasă, combustibilii lichizi și gazoși de origine nebiologică obținuți
    din surse regenerabile și combustibilii pe bază de carbon reciclat și de abrogare
    a Deciziei de punere în aplicare (UE) 2022/603 a Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2461 zo 14. decembra 2022 o
    uznaní schémy KZR INiG na účely preukázania súladu s požiadavkami stanovenými
    v smernici Európskeho parlamentu a Rady (EÚ) 2018/2001, pokiaľ ide o biopalivá,
    biokvapaliny, palivá z biomasy, kvapalné a plynné palivá z obnoviteľných
    zdrojov nebiologického pôvodu a fosílne palivá vyrobené z odpadu, ktorým
    sa zrušuje vykonávacie rozhodnutie Komisie (EÚ) 2022/603
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2461 z dne 14. decembra 2022 o priznanju
    sistema „KZR INiG“ za dokazovanje skladnosti z zahtevami iz Direktive (EU)
    2018/2001 Evropskega parlamenta in Sveta za pogonska biogoriva, druga tekoča
    biogoriva, biomasna goriva, tekoča in plinasta goriva iz obnovljivih virov nebiološkega
    izvora ter reciklirana ogljična goriva in o razveljavitvi Izvedbenega sklepa
    Komisije (EU) 2022/603
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2461 de la Comisión de 14 de diciembre
    de 2022 por la que se reconoce el régimen voluntario «KZR INiG» en lo que se
    refiere a la demostración del cumplimiento de los requisitos establecidos en
    la Directiva (UE) 2018/2001 del Parlamento Europeo y del Consejo en lo que respecta
    a los biocarburantes, biolíquidos, combustibles de biomasa, combustibles líquidos
    y gaseosos renovables de origen no biológico y combustibles de carbono reciclado
    y se deroga la Decisión de Ejecución (UE) 2022/603 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/2461 av den 14 december 2022
    om erkännande av systemet ”KZR INiG” för att visa efterlevnad av kraven
    i Europaparlamentets och rådets direktiv (EU) 2018/2001 vad gäller biodrivmedel,
    flytande biobränslen, biomassabränslen, förnybara flytande och gasformiga bränslen
    av icke-biologiskt ursprung och återvunna kolbaserade bränslen och om upphävande
    av kommissionens genomförandebeslut (EU) 2022/603
  type: main
