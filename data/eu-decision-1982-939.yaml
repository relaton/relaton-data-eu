type: standard
title:
- language: en
  script: Latn
  content: '82/939/EEC: Commission Decision of 22 December 1982 authorizing the United
    Kingdom to apply intra-Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/939/CEE: Décision de la Commission, du 22 décembre 1982, autorisant
    le Royaume-Uni à proroger les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/939/EWG: Entscheidung der Kommission vom 22. Dezember 1982 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Bananen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/939/EØF: Kommissionens beslutning af 22. december 1982 om bemyndigelse
    af Det forenede Kongerige til at forlænge foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/939/EOK: Απόφαση τής Επιτροπής τής 22ας Δεκεμβρίου
    1982 περί χορηγήσεως αδείας στό Ηνωμένο Βασίλειο
    νά προβεί σέ ενδοκοινοτική επιτήρηση όσον
    αφορά τίς εισαγωγές μπανανών καταγωγής ορισμένων
    τρίτων χωρών, οι οποίες τίθενται σέ ελεύθερη
    κυκλοφορία στά άλλα Κράτη μέλη (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/939/CEE: Decisione della Commissione, del 22 dicembre 1982, che autorizza
    il Regno Unito a prorogare le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/939/EEG: Beschikking van de Commissie van 22 december 1982 waarbij
    het Verenigd Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair
    toezicht te treffen ten aanzien van bananen van oorsprong uit bepaalde derde landen
    en in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
