title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2067/82 of 28 July 1982 re-establishing
    the levying of customs duties on babies' under garments of knitted or crocheted
    fabrics, not elastic or rubberized, products of category 68 (0680) and originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2067/82 de la Commission, du 28 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, pour bébés, de la catégorie
    68 (code 0680), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2067/82 der Kommission vom 28. Juli 1982 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68 (Kennziffer 0680),
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3602/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werdene
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2067/82 af 28. juli 1982 om gennemførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastisk eller gummeret, til spædbørn, under 68 (kode 0680), som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2067/82 τής Επιτροπής
    τής 28ης Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά έτοιμα
    ενδύματα εσωτερικά (εσώρουχα), πλεκτά, μή ελαστικά
    ουδέ συνδεδυασμένα μετά καουτσούκ, διά βρέφη,
    προϊόντων τής κατηγορίας αριθ. 68 (κώδικας 0680),
    καταγωγής Νοτίου Κορέας, δικαιούχου τών προβλεπομένων
    στόν κανονισμό (EOK) αριθ. 3602/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2067/82 della Commissione, del 28 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata per bambini piccoli (bébés), della categoria di prodotti
    n. 68 (codice 0680), originarie della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3602/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2067/82 van de Commissie van 28 juli 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk voor baby' s van categorie
    van produkten 68 (codenummer 0680) van oorsprong uit Zuid-Korea, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3602/81 van de
    Raada
  type: main
