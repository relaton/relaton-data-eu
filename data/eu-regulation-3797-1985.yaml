  script: Latn
  content: Council Regulation (EEC) No 3797/85 of 20 December 1985 laying down detailed
    rules concerning quantitative restrictions on imports into Portugal from third
    countries of certain agricultural products subject to the system of transition
    by stages
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3797/85 du Conseil du 20 décembre 1985 déterminant
    les modalités des restrictions quantitatives à l' importation au Portugal en
    provenance des pays tiers de certains produits agricoles soumis au régime de
    transition par étapes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3797/85 des Rates vom 20. Dezember 1985 zur Festlegung
    der Einzelheiten für die mengenmäßigen Beschränkungen bei der Einfuhr bestimmter
    der Regelung des stufenweisen Übergangs unterliegender landwirtschaftlicher Erzeugnisse
    aus Drittländern nach Portugal
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3797/85 af 20. december 1985 om fastsættelse
    af nærmere bestemmelser for kvantitative restriktioner for indførsel til Portugal
    fra tredjelande af visse landbrugsprodukter, der er omfattet af ordningen med
    etapevis overgang
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3797/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για τον καθορισμό των
    όρων που διέπουν τους ποσοτικούς περιορισμούς
    κατά την εισαγωγή στην Πορτογαλία ορισμένων
    γεωργικών προϊόντων προελεύσεως τρίτων χωρών
    που υπόκεινται σε σταδιακή μετάβαση
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3797/85, annettu 20 päivänä joulukuuta 1985,
