    kuuluvien maataloustuotteiden Portugaliin tuonnin määrällisiä rajoituksia
    koskevista yksityiskohtaisista säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3797/85 del Consiglio del 20 dicembre 1985 che stabilisce
