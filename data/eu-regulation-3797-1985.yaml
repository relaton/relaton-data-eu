    Portugal uit derde landen van sommige landbouwprodukten waarvoor de overgangsregeling
    in etappes geldt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3797/85 do Conselho, de 20 de Dezembro de 1985, que
