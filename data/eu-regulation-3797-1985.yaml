    di taluni prodotti agricoli soggetti al regime di transizione per tappe e provenienti
    dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3797/85 van de Raad van 20 december 1985 tot vaststelling
