type: standard
title:
- language: en
  script: Latn
  content: '80/287/EEC: Commission Decision of 18 February 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to yarn of discontinuous or waste regenerated fibres,
    not put up for retail sale, falling within subheading 56.05 B of the Common Customs
    Tariff (category 23), originating in the People''s Republic of China and in free
    circulation in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/287/CEE: Décision de la Commission, du 18 février 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les fils de fibres textiles artificielles
    discontinues, non conditionnés pour la vente au détail, de la sous-position
    56.05 B du tarif douanier commun (catégorie 23), originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres (Les
    textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/287/EWG: Entscheidung der Kommission vom 18. Februar 1980, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus der Volksrepublik China stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Garne aus künstlichen
    Spinnfasern, nicht in Aufmachungen für den Einzelverkauf, der Tarifstelle 56.05
    B des Gemeinsamen Zolltarifs, Kategorie 23, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/287/EØF: Kommissionens beslutning af 18. februar 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage garn af korte regenererede fibre eller
    af affald af kemofibre, ikke i detailsalgsoplægninger, som henhører under pos.
    56.05 B i den fælles toldtarif (kategori 23), har oprindelse i Den kinesiske
    Folkerepublik og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/287/CEE: Decisione della Commissione, del 18 febbraio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i filati di fibre tessili artificiali
    in fiocco non preparati per la vendita al minuto, della sottovoce 56.05 B della
    tariffa doganale comune, categoria 23, originari della Repubblica popolare cinese
    e messi in libera pratica negli altri Stati membri (Il testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/287/EEG: Beschikking van de Commissie van 18 februari 1980 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd garens van kunstmatige stapelvezels, niet verpakt voor de verkoop
    in het klein, van post 56.05 B van het gemeenschappelijk douanetarief (categorie
    23), van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
