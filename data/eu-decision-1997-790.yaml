title:
- language: en
  script: Latn
  content: '97/790/EC: Commission Decision of 24 October 1997 accepting undertakings
    offered in connection with the anti-dumping proceedings concerning imports of
    certain seamless pipes and tubes of iron or non-alloy steel originating in Hungary,
    Poland, the Czech Republic, Romania and the Slovak Republic and repealing Commission
    Decision 93/260/EEC'
  type: main
- language: fr
  script: Latn
  content: '97/790/CE: Décision de la Commission du 24 octobre 1997 portant acceptation
    des engagements offerts dans le cadre de la procédure antidumping concernant
    les importations de certains tubes et tuyaux sans soudure, en fer ou en acier
    non allié, originaires de Hongrie, de Pologne, de République tchèque, de Roumanie
    et de République slovaque et abrogeant la décision 93/260/CEE'
  type: main
- language: de
  script: Latn
  content: '97/790/EG: Beschluß der Kommission vom 24. Oktober 1997 zur Annahme von
    Verpflichtungen in den Antidumpingverfahren betreffend die Einfuhren bestimmter
    nahtloser Rohre aus Eisen oder nichtlegiertem Stahl mit Ursprung in Ungarn, Polen,
    der Tschechischen Republik, Rumänien und der Slowakei und zur Aufhebung des Beschlusses
    93/260/EWG'
  type: main
- language: da
  script: Latn
  content: '97/790/EF: Kommissionens afgørelse af 24. oktober 1997 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af visse
    sømløse rør af jern eller ulegeret stål med oprindelse i Ungarn, Polen, Tjekkiet,
    Rumænien og Slovakiet og om ophævelse af afgørelse 93/260/EØF'
  type: main
- language: el
  script: Grek
  content: '97/790/ΕΚ: Απόφαση της Επιτροπής της 24ης Οκτωβρίου
    1997 για την αποδοχή αναλήψεων υποχρεώσεων που
    προτάθηκαν όσον αφορά διαδικασίες αντιντάμπινγκ
    σχετικά με τις εισαγωγές ορισμένων σωλήνων
    κάθε είδους χωρίς συγκόλληση από σίδηρο ή μη
    κραματοποιημένο χάλυβα καταγωγής Ουγγαρίας,
    Πολωνίας, Τσεχικής Δημοκρατίας, Ρουμανίας
    και Σλοβακικής Δημοκρατίας και για την ανάκληση
    της απόφασης 93/260/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '97/790/EY: Komission päätös, tehty 24 päivänä lokakuuta 1997, tiettyjen
