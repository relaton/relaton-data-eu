    peräisin olevien raudasta tai seostamattomasta teräksestä valmistettujen saumattomien
    putkien tuontia koskevan polkumyynnin vastaisen menettelyn yhteydessä esitettyjen
    sitoumusten hyväksymisestä ja päätöksen 93/260/ETY kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '97/790/CE: Decisione della Commissione del 24 ottobre 1997 che accetta
    gli impegni offerti riguardo ai procedimenti antidumping relativi alle importazioni
    di alcuni tipi di tubi senza saldatura, di ferro o di acciai non legati, originari
    dell''Ungheria, della Polonia, della Repubblica ceca, della Romania e della Repubblica
    slovacca e abroga la decisione 93/260/CEE'
  type: main
- language: nl
  script: Latn
  content: '97/790/EG: Besluit van de Commissie van 24 oktober 1997 tot aanvaarding
