    hinsichtlich der Gewaehrung der Beihilfe fuer Verarbeitungserzeugnisse aus Tomaten
    im Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3879/88 af 12. december 1988 om fastsættelse
    for produktionsåret 1988/89 af de procentdele, der er omhandlet i artikel 3,
    stk. 1a, i forordning (EØF) nr. 426/86 for så vidt angår ydelse af støtte
    for produkter forarbejdet på basis af tomater
  type: main
