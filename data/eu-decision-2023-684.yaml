    mellan Europeiska unionen och dess medlemsstater som första part, Island som
    andra part, och Konungariket Norge som tredje part om tillämpningen av luftfartsavtalet
    mellan Amerikas förenta stater som första part, Europeiska unionen och dess
    medlemsstater som andra part, Island som tredje part och Konungariket Norge som
    fjärde part
