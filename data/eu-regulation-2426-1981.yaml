title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2426/81 of 20 August 1981 fixing for the
    1981/82 marketing year the minimum price payable to producers, the production
    aid and the storage aid together with the coefficients applicable to the minimum
    price and the storage aid and to the production aid for dried grapes and dried
    figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2426/81 de la Commission, du 20 août 1981, fixant
    pour la campagne 1981-1982 pour les raisins secs et les figues sèches, le prix
    minimal à payer aux producteurs, les montants de l' aide à la production, et
    de l' aide au stockage ainsi que les coefficients à appliquer au prix minimal
    et à l' aide au stockage ainsi qu' à l' aide à la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2426/81 der Kommission vom 20. August 1981 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises, der Beträge der Produktionsbeihilfe
    und der Lagerhaltungsbeihilfe sowie der auf den Mindestpreis, die Lagerhaltungsbeihilfe
    und die Produktionsbeihilfe anzuwendenden Koeffizienten für getrocknete Weintrauben
    und getrocknete Feigen für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2426/81 af 20. august 1981 om fastsættelse
    for produktionsåret 1981/82 af den minimumspris, der skal betales til producenterne,
    af producentstøtten og oplagringsstøtten samt af de koefficienter, der skal
    anvendes på minimumsprisen og oplagringsstøtten samt producentstøtten for tørrede
    druer og tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2426/81 τής Επιτροπής
    τής 20ής Αυγούστου 1981 περί καθορισμού, γιά τήν
    περίοδο εμπορίας 1981/82, τής ελάχιστης τιμής
    πού καταβάλλεται στούς παραγωγούς, τών ποσών
    τής ενισχύσεως κατά τήν παραγωγή, τού ποσού
    τής ενισχύσεως κατά τήν αποθεματοποίηση, καθώς
    καί τών συντελεστών πού πρέπει νά εφαρμόζονται
    στήν ελάχιστη τιμή καί στήν ενίσχυση αποθεματοποιήσεως,
    καθώς καί στήν ενίσχυση κατά τήν παραγωγή,
    γιά τίς σταφίδες καί τά ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2426/81 della Commissione, del 20 agosto 1981, che
    fissa, per la campagna 1981/1982, il prezzo minimo da pagare ai produttori, l'
    importo dell' aiuto alla produzione e dell' aiuto all' ammasso, nonché i coefficienti
    da applicare al prezzo minimo, all' aiuto all' ammasso ed all' aiuto alla produzione,
    per l' uva secca ed i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2426/81 van de Commissie van 20 augustus 1981 tot
    vaststelling voor het verkoopseizoen 1981/1982 voor rozijnen en krenten en gedroogde
    vijgen van de aan de producenten te betalen minimumprijs, de bedragen van de poduktiesteun
    en de steun bij opslag alsmede van de coëfficiënten die op de minimumprijs en
    op de bedragen van de produktiesteun en de steun bij opslag moeten worden toegepast
  type: main
