title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3500/80 of 22 December 1980 providing for the
    technical adaptation, consequent on the accession of Greece, of Regulations (EEC)
    No 2532/78, (EEC) No 925/79 and (EEC) No 2613/79 with regard to common rules for
    imports from the People' s Republic of China and from other State-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3500/80 du Conseil, du 22 décembre 1980, portant,
    à la suite de l'adhésion de la Grèce, adaptation technique des règlements
    (CEE) n° 2532/78, (CEE) n° 925/79 et (CEE) n 2613/79 en ce qui concerne les
    régimes communs applicables aux importations en provenance de la République
    populaire de Chine et des autres pays à commerce d'État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3500/80 des Rates vom 22. Dezember 1980 zur technischen
    Anpassung aufgrund des Beitritts Griechenlands der Verordnungen (EWG) Nr. 2532/78,
    (EWG) Nr. 925/79 und (EWG) Nr. 2613/79 hinsichtlich der gemeinsamen Regelungen
    für die Einfuhr aus der Volksrepublik China und aus anderen Staatshandelsländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3500/80 af 22. december 1980 om teknisk tilpasning,
    som følge af Grækenlands tiltrædelse, af forordning (EØF) nr. 2532/78, (EØF)
    nr. 925/79 og (EØF) nr. 2613/79 om den fælles ordning for indførsel fra Den
    kinesiske Folkerepublik og fra andre statshandelslande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3500/80 τού Συμβουλίου
    τής 22ας Δεκεμβρίου 1980 περί τεχνικής προσαρμογής,
    συνεπεία τής προσχωρήσεως τής Ελλάδος, τών
    κανονισμών (EOK) αριθ. 2532/78, (EOK) αριθ. 925/79 καί (EOK)
    αριθ. 2613/79 όσον αφορά τά κοινά καθεστώτα εισαγωγών
    από τή Λαϊκή Δημοκρατία τής Κίνας καί από άλλες
    χώρες κρατικού εμπορίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3500/80 del Consiglio, del 22 dicembre 1980, che,
    a seguito dell' adesione della Grecia, adegua sul piano tecnico i regolamenti
    (CEE) n. 2532/78, (CEE) n. 925/79 e (CEE) n. 2613/79 per quanto riguarda i regimi
    comuni applicabili alle importazioni provenienti dalla Repubblica popolare cinese
    e dagli altri paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3500/80 van de Raad van 22 december 1980 houdende
    technische aanpassing, in verband met de toetreding van Griekenland, van de Verordeningen
    (EEG) nr. 2532/78, (EEG) nr. 925/79 en (EEG) nr. 2613/79 inzake de gemeenschappelijke
    regelingen voor de invoer uit de Volksrepubliek China en uit de overige landen
    met staatshandel
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3500/80 del Consejo, de 22 de diciembre de 1980, por
    el que, como consecuencia de la adhesión de Grecia, se efectua la adaptación
    técnica de los Reglamentos (CEE) n° 2532/78, (CEE) n° 925/79 y (CEE) n° 2613/79
    en lo que se refiere a los regímenes comunes aplicables a las importaciones procedentes
    de la República Popular de China y de los otros países con comercio de Estado
  type: main
