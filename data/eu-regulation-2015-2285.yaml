    kontroll av produkter av animaliskt ursprung avsedda att användas som livsmedel
    vad gäller levande musslor, tagghudingar, manteldjur och marina snäckor och
    av bilaga I till förordning (EG) nr 2073/2005 om mikrobiologiska kriterier för
    livsmedel
