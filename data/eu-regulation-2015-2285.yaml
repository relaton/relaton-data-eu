title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2015/2285 of 8 December 2015 amending Annex
    II to Regulation (EC) No 854/2004 of the European Parliament and of the Council
    laying down specific rules for the organisation of official controls on products
    of animal origin intended for human consumption as regards certain requirements
    for live bivalve molluscs, echinoderms, tunicates and marine gastropods and Annex
    I to Regulation (EC) No 2073/2005 on microbiological criteria for foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2015/2285 de la Commission du 8 décembre 2015 modifiant
    l'annexe II du règlement (CE) n° 854/2004 du Parlement européen et du Conseil
    fixant les règles spécifiques d'organisation des contrôles officiels concernant
    les produits d'origine animale destinés à la consommation humaine au regard
    de certaines exigences applicables aux mollusques bivalves, aux échinodermes,
    aux tuniciers et aux gastéropodes marins vivants et l'annexe I du règlement
    (CE) n° 2073/2005 concernant les critères microbiologiques applicables aux denrées
    alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2015/2285 der Kommission vom 8. Dezember 2015 zur Änderung
    des Anhangs II der Verordnung (EG) Nr. 854/2004 des Europäischen Parlaments und
    des Rates mit besonderen Verfahrensvorschriften für die amtliche Überwachung
    von zum menschlichen Verzehr bestimmten Erzeugnissen tierischen Ursprungs in Bezug
    auf bestimmte Anforderungen an lebende Muscheln, Stachelhäuter, Manteltiere und
    Meeresschnecken sowie zur Änderung des Anhangs I der Verordnung (EG) Nr. 2073/2005
    über mikrobiologische Kriterien für Lebensmittel
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2015/2285 на Комисията от 8 декември
