    del Consejo, por el que se establecen normas específicas para la organización
    de controles oficiales de los productos de origen animal destinados al consumo
    humano, por lo que se refiere a determinados requisitos para los moluscos bivalvos,
    los equinodermos, los tunicados y los gasterópodos marinos vivos, así como el
    anexo I del Reglamento (CE) n° 2073/2005, relativo a los criterios microbiológicos
    aplicables a los productos alimenticios
  type: main
