title:
- language: fr
  script: Latn
  content: Règlement (CEE) 2099/68 du Conseil, du 20 décembre 1968, modifiant l'article
    17 ter du règlement n° 160/66/CEE en ce qui concerne les montants compensatoires
    appliqués pour certaines marchandises relevant de ce règlement dans les échanges
    avec les Pays-Bas
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2099/68 des Rates vom 20. Dezember 1968 zur Änderung
    des Artikels 17b der Verordnung Nr. 160/66/EWG in bezug auf die Ausgleichsbeträge,
    die für bestimmte, unter diese Verordnung fallende Waren im Handel mit den Niederlanden
    anzuwenden sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2099/68 del Consiglio, del 20 dicembre 1968, che modifica
    l'articolo 17 ter del regolamento n. 160/66/CEE per quanto riguarda gli importi
    di compensazione applicati ad alcune merci contemplate da tale regolamento negli
    scambi con i Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2099/68 van de Raad van 20 december 1968 tot wijziging
    van artikel 17 ter van Verordening nr. 160/66/EEG voor wat betreft de compenserende
    bedragen, die in het handelsverkeer met Nederland van toepassing zijn op bepaalde
    onder genoemde verordening vallende produkten
  type: main
