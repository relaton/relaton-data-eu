  script: Latn
  content: Commission Regulation (EU) No 923/2014 of 25 August 2014 amending Annex
    II to Regulation (EC) No 1333/2008 of the European Parliament and of the Council
    as regards the use of aluminium lakes of riboflavins (E 101) and cochineal, carminic
    acid, carmines (E 120) in certain food categories and Annex to Regulation (EU)
    No 231/2012 as regards the specifications for riboflavins (E 101)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 923/2014 de la Commission du 25 août 2014 modifiant
    l'annexe II du règlement (CE) n ° 1333/2008 du Parlement européen et du Conseil
    en ce qui concerne l'utilisation de laques aluminiques de E 101 (riboflavines)
    et de E 120 (cochenille, acide carminique, carmins) dans certaines catégories
    de denrées alimentaires, ainsi que l'annexe du règlement (UE) n ° 231/2012
    en ce qui concerne les spécifications du E 101 (riboflavines)
  type: main
