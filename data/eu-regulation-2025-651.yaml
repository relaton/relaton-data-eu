    ja diglyseridien (E 471) ja karnaubavahan (E 903) käytöstä tiettyjen tuoreiden
    hedelmien ja kassavien kiillotusaineena sekä lesitiinien (E 322) ja rasvahappojen
    (E 570) käytöstä kantaja-aineina kassavien kiillotusaineissa
  type: main
- language: ga
  script: Latn
