    Rialachán (CE) Uimh. 1333/2008 a mhéid a bhaineann le húsáid monai- agus déghlicrídí
    d’aigéid shailleacha (E 471) agus céarach carnába (E 903) mar oibreáin ghlónraithe
    ar thorthaí úra áirithe agus ar chasabhaigh agus úsáid leicitiní (E 322)
    agus aigéad sailleach (E 570) mar iompróirí in oibreáin ghlónraithe ar chasabhaigh
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2025/651 оd 2. travnja 2025. o izmjeni Uredbe (EZ)
    br. 1333/2008 u pogledu uporabe monoglicerida i diglicerida masnih kiselina (E
    471) i karnauba voska (E 903) kao sredstava za glaziranje određenog svježeg
    voća i manioke te uporabe lecitina (E 322) i masnih kiselina (E 570) kao nosača
    u sredstvima za glaziranje manioke
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/651 rendelete (2025. április 2.) az 1333/2008/EK
    rendeletnek a zsírsavak mono- és digliceridjei (E 471) és a karnaubaviasz (E
    903) egyes friss gyümölcsök és a kasszava fényezőanyagaként, valamint a
    lecitinek (E 322) és a zsírsavak (E 570) a kasszava fényezőanyagában hordozóként
    való felhasználása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2025/651 della Commissione, del 2 aprile 2025, che modifica
    il regolamento (CE) n. 1333/2008 per quanto riguarda l’uso di mono- e digliceridi
    degli acidi grassi (E 471) e di cera di carnauba (E 903) come agenti di rivestimento
    su determinati tipi di frutta fresca e sulla cassava e per quanto riguarda l’uso
    di lecitine (E 322) e acidi grassi (E 570) come supporti negli agenti di rivestimento
    sulla cassava
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2025/651 (2025. gada 2. aprīlis), ar ko attiecībā
    uz taukskābju mono- un diglicerīdu (E 471) un karnaubas vaska (E 903) lietošanu
    par glazētājvielām uz noteiktiem svaigiem augļiem un maniokām, kā arī lecitīnu
    (E 322) un taukskābju (E 570) lietošanu par manioku glazētājvielu nesējvielām
    groza Regulu (EK) Nr. 1333/2008
  type: main
- language: lt
  script: Latn
  content: 2025 m. balandžio 2 d. Komisijos reglamentas (ES) 2025/651, kuriuo dėl
    riebalų rūgščių mono- ir digliceridų (E 471) ir karnaubo vaško (E 903)
    naudojimo kaip tam tikrų šviežių vaisių ir valgomųjų maniokų glazūros
    medžiagų ir dėl lecitinų (E 322) ir riebalų rūgščių (E 570) naudojimo
    kaip pagalbinių medžiagų valgomųjų maniokų glazūros medžiagose iš dalies
    keičiamas Reglamentas (EB) Nr. 1333/2008
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2025/651 tat-2 ta’ April 2025 li jemenda
    r-Regolament (KE) Nru 1333/2008 fir-rigward tal-użu tal-mono- u d-digliċeridi
    tal-aċidi xaħmin (E 471) u tax-xama’ tal-karnawba (E 903) bħala aġenti tal-kisja
    tleqq fuq ċertu frott frisk u fuq il-manjoka, u tal-leċitini (E 322) u tal-aċidi
    xaħmin (E 570) bħala carriers fl-aġenti tal-kisja tleqq fuq il-manjoka
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2025/651 van de Commissie van 2 april 2025 tot wijziging
    van Verordening (EG) nr. 1333/2008 wat betreft het gebruik van mono- en diglyceriden
    van vetzuren (E 471) en carnaubawas (E 903) als glansmiddelen op bepaalde soorten
    vers fruit en cassave, en van lecithinen (E 322) en vetzuren (E 570) als draagstoffen
    in glansmiddelen op cassave
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2025/651 z dnia 2 kwietnia 2025 r. zmieniające
    rozporządzenie (WE) nr 1333/2008 w odniesieniu do stosowania mono- i diglicerydów
    kwasów tłuszczowych (E 471) i wosku carnauba (E 903) jako substancji glazurujących
    na niektórych świeżych owocach i manioku jadalnym oraz stosowania lecytyn (E
    322) i kwasów tłuszczowych (E 570) jako nośników w substancjach glazurujących
    do manioku jadalnego
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2025/651 da Comissão, de 2 de abril de 2025, que altera
    o Regulamento (CE) n.o 1333/2008 no que diz respeito à utilização de mono e
    diglicéridos de ácidos gordos (E 471) e cera de carnaúba (E 903) como agentes
    de revestimento em determinadas frutas frescas e mandiocas e de lecitinas (E 322)
    e ácidos gordos (E 570) como agentes de transporte em agentes de revestimento
    para mandiocas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2025/651 al Comisiei din 2 aprilie 2025 de modificare
    a Regulamentului (CE) nr. 1333/2008 în ceea ce privește utilizarea monogliceridelor
    și digliceridelor acizilor grași (E 471) și a cerii de carnauba (E 903) ca
    agenți de glazurare pe anumite fructe proaspete și cassava, precum și a lecitinelor
    (E 322) și a acizilor grași (E 570) ca agenți de glazurare pe cassava
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2025/651 z 2. apríla 2025, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 1333/2008, pokiaľ ide o používanie monoglyceridov
    a diglyceridov mastných kyselín (E 471) a karnaubského vosku (E 903) ako povlakových
    látok na určité čerstvé ovocie a manioky a lecitínov (E 322) a mastných
    kyselín (E 570) ako nosičov v povlakových látkach na manioky
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2025/651 z dne 2. aprila 2025 o spremembi Uredbe (ES)
    št. 1333/2008 glede uporabe mono- in digliceridov maščobnih kislin (E 471)
    in karnauba voska (E 903) kot sredstev za glaziranje nekaterih vrst svežega sadja
    in kasave ter lecitinov (E 322) in maščobnih kislin (E 570) kot nosilcev v sredstvih
    za glaziranje kasave
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2025/651 de la Comisión, de 2 de abril de 2025, por el
    que se modifica el Reglamento (CE) n.o 1333/2008 en lo que respecta a la utilización
    de monoglicéridos y diglicéridos de ácidos grasos (E 471) y de cera de carnauba
    (E 903) como agentes de recubrimiento de determinadas frutas frescas y la mandioca,
    así como de lecitinas (E 322) y ácidos grasos (E 570) como soportes en agentes
    de recubrimiento de la mandioca
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2025/651 av den 2 april 2025 om ändring
    av förordning (EG) nr 1333/2008 vad gäller användning av mono- och diglycerider
    av fettsyror (E 471) och karnaubavax (E 903) som ytbehandlingsmedel för vissa
    färska frukter och maniok/kassava samt av lecitiner (E 322) och fettsyror (E
    570) som bärare i ytbehandlingsmedel för maniok/kassava
