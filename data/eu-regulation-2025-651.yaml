title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2025/651 of 2 April 2025 amending Regulation
    (EC) No 1333/2008 as regards the use of mono- and diglycerides of fatty acids
    (E 471) and carnauba wax (E 903) as glazing agents on certain fresh fruit and
    cassavas and of lecithins (E 322) and fatty acids (E 570) as carriers in glazing
    agents on cassavas
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/651 de la Commission du 2 avril 2025 modifiant le
    règlement (CE) no 1333/2008 en ce qui concerne l’utilisation des mono- et diglycérides
    d’acides gras (E 471) et de la cire de carnauba (E 903) comme agents d’enrobage
    sur certains fruits frais et le manioc, ainsi que des lécithines (E 322) et des
    acides gras (E 570) comme supports dans les agents d’enrobage pour le manioc
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2025/651 der Kommission vom 2. April 2025 zur Änderung
    der Verordnung (EG) Nr. 1333/2008 hinsichtlich der Verwendung von Mono- und Diglyceriden
    von Speisefettsäuren (E 471) und von Carnaubawachs (E 903) als Überzugmittel
    auf bestimmtem frischem Obst und Cassavas sowie von Lecithinen (E 322) und von
    Speisefettsäuren (E 570) als Trägerstoffe in Überzugmitteln für Cassavas
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2025/651 на Комисията от 2 април
    2025 година за изменение на Регламент (ЕО) № 1333/2008
    по отношение на употребата на моно- и диглицериди
    на мастни киселини (E 471) и карнаубов восък (E
    903) като глазиращи агенти върху определени
    пресни плодове и маниока и на лецитини (E 322)
    и мастни киселини (E 570) като носители в глазиращи
    агенти върху маниока
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2025/651 ze dne 2. dubna 2025, kterým se mění
    nařízení (ES) č. 1333/2008, pokud jde o použití mono- a diglyceridů mastných
    kyselin (E 471) a karnaubského vosku (E 903) jako lešticích látek pro některé
    čerstvé ovoce a maniokové kořeny a lecitinů (E 322) a mastných kyselin (E
    570) jako nosičů v lešticích látkách pro maniokové kořeny
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2025/651 af 2. april 2025 om ændring af
    forordning (EF) nr. 1333/2008 for så vidt angår anvendelsen af mono- og diglycerider
    af fedtsyrer (E 471) og carnaubavoks (E 903) som overfladebehandlingsmidler på
    visse friske frugter og maniok og af lecithiner (E 322) og fedtsyrer (E 570) som
    bærestoffer i overfladebehandlingsmidler på maniok
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2025/651 της Επιτροπής, της
