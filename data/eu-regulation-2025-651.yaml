  script: Latn
  content: Komisjoni määrus (EL) 2025/651, 2. aprill 2025, millega muudetakse määrust
    (EÜ) nr 1333/2008 seoses rasvhapete mono- ja diglütseriidide (E 471) ja karnaubavaha
    (E 903) kasutamisega teatavate värskete puuviljade ja kassaavade glaseerainena
    ning letsitiinide (E 322) ja rasvhapete (E 570) kasutamisega kandeainena kassaavade
    glaseerainetes
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2025/651, annettu 2 päivänä huhtikuuta 2025, asetuksen
