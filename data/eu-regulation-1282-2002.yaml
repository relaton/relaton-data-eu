    που καθορίζει τους όρους υγειονομικού ελέγχου
    που διέπουν το εμπόριο και τις εισαγωγές στην
    Κοινότητα ζώων, σπέρματος, ωαρίων και εμβρύων
    που δεν υπόκεινται, όσον αφορά τους όρους υγειονομικού
    ελέγχου, στις ειδικές κοινοτικές ρυθμίσεις
    που αναφέρονται στο τμήμα Ι του παραρτήματος
    Α της οδηγίας 90/425/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1282/2002, 15. juuli 2002, millega muudetakse
    nõukogu direktiivi 92/65/EMÜ (milles sätestatakse loomatervishoiu nõuded ühendusesiseseks
    kauplemiseks loomade, sperma, munarakkude ja embrüotega, mille suhtes ei kohaldata
    direktiivi 90/425/EMÜ A lisa I punktis osutatud ühenduse erieeskirjades sätestatud
    loomatervishoiunõudeid, ning nende impordiks ühendusse) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1282/2002, annettu 15 päivänä heinäkuuta
    2002, eläinten terveyttä koskevista vaatimuksista eläinten, siemennesteen,
    munasolujen ja alkioiden yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa
    siltä osin, kuin niitä eivät koske direktiivin 90/425/ETY liitteessä A olevassa
    I jaksossa mainittujen erityisten yhteisön säädösten eläinten terveyttä
    koskevat vaatimukset, annetun neuvoston direktiivin 92/65/ETY liitteiden muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1282/2002 od 15. srpnja 2002. o izmjeni Priloga
    Direktivi Vijeća 92/65/EEZ o utvrđivanju zahtjeva zdravlja životinja kojima
    se uređuje trgovina unutar Zajednice i uvoz u Zajednicu životinja, sjemena,
    jajnih stanica i zametaka koji ne podliježu zahtjevima zdravlja životinja koji
    su utvrđeni posebnim pravilima Zajednice navedenim u Prilogu A(1) Direktivi 90/425/EEZ
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1282/2002/EK rendelete (2002. július 15.) a 90/425/EGK irányelv
    A. mellékletének I. pontjában felsorolt külön közösségi szabályokban
    megállapított állat-egészségügyi követelmények hatálya alá nem tartozó
    állatok, spermák, petesejtek és embriók Közösségen belüli kereskedelmére
    és a Közösségbe történő behozatalára irányadó állat-egészségügyi
    követelmények megállapításáról szóló 92/65/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1282/2002 della Commissione, del 15 luglio 2002, recante
    modifica degli allegati della direttiva 92/65/CEE che stabilisce norme sanitarie
    per gli scambi e le importazioni nella Comunità di animali, sperma, ovuli ed
    embrioni non soggetti, per quanto riguarda le condizioni di polizia sanitaria,
    alle normative comunitarie specifiche di cui all'allegato A, sezione I, della
    direttiva 90/425/CEE
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1282/2002 (2002. gada 15. jūlijs), ar ko groza
    pielikumus Padomes Direktīvai 92/65/EEK, ar kuru paredz dzīvnieku veselības
    prasības attiecībā uz tādu dzīvnieku, spermas, olšūnu un embriju tirdzniecību
    un importu Kopienā, uz kuriem neattiecas dzīvnieku veselības prasības, kas
    paredzētas īpašos Kopienas noteikumos, kuri minēti Direktīvas 90/425/EEK
    A(I) pielikumā
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 15 d. Komisijos reglamentas (EB) Nr. 1282/2002, iš dalies
    keičiantis Tarybos direktyvos 92/65/EEB, nustatančios gyvūnų sveikatos reikalavimus,
    reglamentuojančius prekybą Bendrijoje gyvūnais, sperma, kiaušialąstėmis
    bei embrionais, kuriems netaikomi gyvūnų sveikatos reikalavimai, nustatyti specialiose
    Bendrijos taisyklėse, nurodytose Direktyvos 90/425/EEB A priedo 1 dalyje, bei
    jų importą į Bendriją, priedus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1282/2002 tal-15 ta’ Lulju 2002
