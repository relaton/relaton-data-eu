    dwar is-saħħa ta’ l-annimali biex jirregolaw il-kummerċ fi u importazzjoni
    fil-Komunità ta’ annimali, semen, ova u embrijoni mhux soġġetti għar-rekwiżiti
    tas-saħħa ta’ l-annimali stabbiliti f’regoli speċifiċi Komunitarji msemmija
    fl-Anness A(1) tad-Direttiva 90/425/KEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1282/2002 van de Commissie van 15 juli 2002 houdende
    wĳziging van de bĳlagen bĳ Richtlĳn 92/65/EEG van de Raad tot vaststelling
    van de veterinairrechtelĳke voorschriften voor het handelsverkeer en de invoer
    in de Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien
    van de veterinairrechtelĳke voorschriften geen specifieke communautaire regelgeving
    als bedoeld in bĳlage A, onder I, van Richtlĳn 90/425/EEG geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1282/2002 z dnia 15 lipca 2002 r. zmieniające
    załączniki do dyrektywy Rady 92/65/EWG ustanawiającą wymagania dotyczące
    zdrowia zwierząt regulujące handel i przywóz do Wspólnoty zwierząt, nasienia,
    komórek jajowych i zarodków nieobjętych wymaganiami dotyczącymi zdrowia zwierząt
    ustanowionymi w szczególnych zasadach Wspólnoty określonych w załączniku
    A pkt I do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1282/2002 da Comissão, de 15 de Julho de 2002, que
    altera os anexos da Directiva 92/65/CEE do Conselho que define as condições
    de polícia sanitária que regem o comércio e as importações na Comunidade
    de animais, sémens, óvulos e embriões não sujeitos, no que se refere às condições
    de polícia sanitária, às regulamentações comunitárias específicas referidas
    na secção I do anexo A da Directiva 90/425/CEE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1282/2002 al Comisiei din 15 iulie 2002 de modificare
    a anexelor la Directiva 92/65/CEE a Consiliului de definire a condițiilor de
    sănătate animală care reglementează comerțul și importurile în Comunitate
    de animale, material seminal, ovule și embrioni care nu se supun, în ceea ce
    privește condițiile de sănătate animală, reglementărilor comunitare specifice
    prevăzute la punctul I din anexa A la Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1282/2002 z 15. júla 2002, ktorým sa menia
    a dopĺňajú prílohy k smernici Rady 92/65/EHS ustanovujúcej požiadavky zdravotného
    stavu zvierat, ktoré upravujú obchod a dovoz zvierat, semena, vajíčok a embryí
    do spoločenstva, ktoré nepodliehajú zdravotným požiadavkám zvierat ustanoveným
    v osobitných pravidlách spoločenstva uvedených v prílohe A (1) k smernici
    90/425/EHSText s významom pre Európsky hospodársky priestor
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1282/2002 z dne 15. julija 2002 o spremembi prilog
    k Direktivi Sveta 92/65/EGS o zahtevah zdravstvenega varstva živali za trgovino
    in za uvoz v Skupnost živali, semena, jajčnih celic in zarodkov, za katere ne
    veljajo zahteve zdravstvenega varstva živali, določene v posebnih pravilih Skupnosti
    iz Priloge A(I) k Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1282/2002 de la Comisión, de 15 de julio de 2002,
    que modifica determinados anexos de la Directiva 92/65/CEE del Consejo, por la
    que se establecen las condiciones de policía sanitaria aplicables a los intercambios
    y las importaciones en la Comunidad de animales, esperma, óvulos y embriones
    no sometidos, con respecto a estas condiciones, a las normativas comunitarias
    específicas a que se refiere la sección I del anexo A de la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1282/2002 av den 15 juli 2002 om ändring
    av bilagorna till rådets direktiv 92/65/EEG om fastställande av djurhälsokrav
    i handeln inom och importen till gemenskapen av djur, sperma, ägg (ova) och embryon
    som inte faller under de krav som fastställs i de specifika gemenskapsregler
    som avses i bilaga A.I till direktiv 90/425/EEG
