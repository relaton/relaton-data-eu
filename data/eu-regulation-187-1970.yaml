    de stockage, en cas de report, des producteurs de betteraves et de cannes pendant
    la campagne sucrière 1969/1970
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 187/70 der Kommission vom 30. Januar 1970 zur Änderung
