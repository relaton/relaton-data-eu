title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3713/92 of 22 December 1992 deferring the
    date of application of Article 11 (1) of Regulation (EEC) No 2092/91 on organic
    production of agricultural products and indications referring thereto on agricultural
    products and foodstuffs, with regard to the imports from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3713/92 de la Commission, du 22 décembre 1992, prorogeant
    le délai de mise en application de l' article 11 paragraphe 1 du règlement (CEE)
    n° 2092/91 du Conseil concernant le mode de production biologique de produits
    agricoles et sa présentation sur les produits agricoles et les denrées alimentaires,
    en ce qui concerne les importations de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3713/92 der Kommission vom 22. Dezember 1992 zur Verschiebung
    der Anwendung von Artikel 11 Absatz 1 der Verordnung (EWG) Nr. 2092/91 des Rates
    über den ökologischen Landbau und die entsprechende Kennzeichnung der landwirtschaftlichen
    Erzeugnisse und Lebensmittel auf die Einfuhr aus bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3713/92 af 22. december 1992 om udskydelse,
    for så vidt angår indførsler fra visse tredjelande, af fristen for anvendelsen
    af artikel 11, stk. 1, i Rådets forordning (EØF) nr. 2092/91 om økologisk produktionsmetode
    for landbrugsprodukter og om angivelse heraf på landbrugsprodukter og levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3713/92 της Επιτροπής
    της 22ας Δεκεμβρίου 1992 περί παρατάσεως της ημερομηνίας
    εφαρμογής του άρθρου 11 παράγραφος 1 του κανονισμού
    (ΕΟΚ) αριθ. 2092/91 του Συμβουλίου σχετικά με τη
    βιολογική παραγωγή γεωργικών προϊόντων και
    συναφείς αναφορές γεωργικών προϊόντων και
    τροφίμων, όσον αφορά τις εισαγωγές από ορισμένες
    τρίτες χώρες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3713/92, annettu 22 päivänä joulukuuta 1992,
    maataloustuotteiden luonnonmukaisesta tuotantotavasta ja siihen viittaavista merkinnöistä
    maataloustuotteissa ja elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o
    2092/91 11 artiklan 1 kohdan täytäntöönpanoa koskevan määräajan siirtämisestä
    tietyistä kolmansista maista peräisin olevan tuonnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3713/92 della Commissione, del 22 dicembre 1992, che
    rinvia, per quanto riguarda le importazioni da determinati paesi terzi, la data
    di applicazione dell' articolo 11, paragrafo 1 del regolamento (CEE) n. 2092/91,
    relativo al metodo di produzione biologico di prodotti agricoli e all' indicazione
    di tale metodo sui prodotti agricoli e sulle derrate alimentari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3713/92 van de Commissie van 22 december 1992 houdende
    verlenging van de termijn na afloop waarvan artikel 11, lid 1, van Verordening
    (EEG) nr. 2092/91 van de Raad inzake de biologische produktiemethode en aanduidingen
    dienaangaande op landbouwprodukten en levensmiddelen, moet worden toegepast op
    de invoer uit bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3713/92 da Comissão, de 22 de Dezembro de 1992,
    que adia a aplicação do n° 1 do artigo 11° do Regulamento (CEE) n° 2092/91,
    relativo ao modo de produção biológico de produtos agrícolas e à sua indicação
    nos produtos agrícolas e nos géneros alimentícios, no que se refere às importações
    de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3713/92 de la Comisión, de 22 de diciembre de 1992,
    por el que se aplaza la fecha de aplicación del apartado 1 del artículo 11 del
    Reglamento (CEE) n° 2092/91 del Consejo sobre la producción agrícola ecológica
    y su indicación en los productos agrarios y alimenticios, en relación con las
    importaciones procedentes de determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3713/92 av den 22 december 1992 om att
    skjuta upp datum för tillämpning av artikel 11.1 i förordning (EEG) nr 2092/91
    om ekologisk produktion av jordbruksprodukter och uppgifter därom på jordbruksprodukter
    och livsmedel, vad beträffar import från vissa tredje länder
  type: main
