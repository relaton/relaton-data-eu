    reconocimiento de Estonia, Letonia y la Comunidad Autónoma española de las Islas
    Baleares como oficialmente indemnes de brucelosis (Brucella melitensis) , así
    como los anexos I y II de la Decisión 2003/467/CE en lo que respecta a la declaración
    de Estonia como oficialmente indemne de tuberculosis y oficialmente indemne de
    brucelosis en relación con los rebaños bovinos [notificada con el número C(2010)
    7856]'
  type: main
- language: sv
  script: Latn
  content: '2010/695/EU: Kommissionens beslut av den 17 november 2010 om ändring
