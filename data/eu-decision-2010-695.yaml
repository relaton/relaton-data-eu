title:
- language: en
  script: Latn
  content: '2010/695/EU: Commission Decision of 17 November 2010 amending the Annexes
    to Decision 93/52/EEC as regards the recognition of Estonia, Latvia and the Autonomous
    Community of the Balearic Islands in Spain as officially free of brucellosis (
    B. melitensis ) and amending Annexes I and II to Decision 2003/467/EC as regards
    the declaration of Estonia as officially tuberculosis-free and officially brucellosis-free
    as regards bovine herds (notified under document C(2010) 7856)'
  type: main
- language: fr
  script: Latn
  content: '2010/695/UE: Décision de la Commission du 17 novembre 2010 modifiant
    les annexes de la décision 93/52/CEE en ce qui concerne la reconnaissance de
    l’Estonie, de la Lettonie et de la Communauté autonome des îles Baléares,
    en Espagne, en tant qu''État membre et région officiellement indemnes de brucellose
    ( B. melitensis ), et modifiant les annexes I et II de la décision 2003/467/CE
    en ce qui concerne l’Estonie, dont les troupeaux bovins sont officiellement
    déclarés indemnes de tuberculose et de brucellose [notifiée sous le numéro
    C(2010) 7856]'
  type: main
- language: de
  script: Latn
  content: '2010/695/EU: Beschluss der Kommission vom 17. November 2010 zur Änderung
    der Anhänge der Entscheidung 93/52/EWG hinsichtlich der Anerkennung Estlands,
    Lettlands und der Autonomen Gemeinschaft Balearen in Spanien als amtlich frei
    von Brucellose (B. melitensis) und zur Änderung der Anhänge I und II der Entscheidung
    2003/467/EG hinsichtlich der Anerkennung Estlands als amtlich frei von Tuberkulose
    und von Brucellose in Bezug auf Rinderbestände (Bekannt gegeben unter Aktenzeichen
    K(2010) 7856)'
  type: main
- language: bg
