    Letland og den selvstyrende region Balearerne i Spanien som officielt frie for
    brucellose (B. melitensis) og om ændring af bilag I og II til beslutning 2003/467/EF
    for så vidt angår erklæringen om, at Estland er officielt fri for tuberkulose
