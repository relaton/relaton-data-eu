    на Естония за официално свободна от туберкулоза
    по говедата и официално свободна от бруцелоза
    по говедата по отношение на стадата говеда
    (нотифицирано под номер C(2010) 7856)'
  type: main
- language: cs
  script: Latn
  content: '2010/695/EU: Rozhodnutí Komise ze dne 17. listopadu 2010 , kterým se
    mění přílohy rozhodnutí 93/52/EHS, pokud jde o uznání Estonska, Lotyšska
    a autonomní oblasti Baleárské ostrovy ve Španělsku za úředně prosté brucelózy
    ( B. melitensis ), a kterým se mění přílohy I a II rozhodnutí 2003/467/ES,
    pokud jde o prohlášení Estonska za úředně prosté tuberkulózy a za úředně
    prosté brucelózy, pokud jde o stáda skotu (oznámeno pod číslem K(2010) 7856)'
  type: main
- language: da
  script: Latn
  content: '2010/695/EU: Kommissionens afgørelse af 17. november 2010 om ændring
