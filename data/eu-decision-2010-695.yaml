    vapaiksi luomistaudista ( B. melitensis ) sekä päätöksen 2003/467/EY liitteiden
    I ja II muuttamisesta siltä osin kuin kyse on Viron julistamisesta virallisesti
    vapaaksi tuberkuloosista ja luomistaudista nautakarjojen osalta (tiedoksiannettu
    numerolla K(2010) 7856)'
  type: main
- language: hu
  script: Latn
  content: '2010/695/EU: A Bizottság határozata ( 2010. november 17. ) Észtország,
    Lettország és a spanyolországi Baleár-szigetek autonóm körzet hivatalosan
    brucellózistól (B. melitensis) mentessé nyilvánítása tekintetében a 93/52/EGK
    határozat mellékleteinek módosításáról, valamint Észtországnak hivatalosan
    a szarvasmarhák tuberkulózisától és brucellózisától mentessé nyilvánítása
    tekintetében a 2003/467/EK határozat I. és II. mellékletének módosításáról
    (az értesítés a C(2010) 7856. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/695/UE: Decisione della Commissione, del 17 novembre 2010 , recante
    modifica degli allegati della decisione 93/52/CEE per quanto riguarda il riconoscimento
    della qualifica di ufficialmente indenne da brucellosi ( B. melitensis ) all''Estonia,
    alla Lettonia e alla Comunità autonoma delle Isole Baleari e recante modifica
    degli allegati I e II della decisione 2003/467/CE per quanto riguarda il riconoscimento
    all''Estonia della qualifica di ufficialmente indenne da tubercolosi bovina e
    brucellosi bovina [notificata con il numero C(2010) 7856]'
  type: main
- language: lv
  script: Latn
  content: '2010/695/ES: Komisijas Lēmums ( 2010. gada 17. novembris ), ar ko groza
