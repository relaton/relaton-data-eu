    och den autonoma regionen Balearerna i Spanien är officiellt fria från brucellos
    ( B. melitensis ) och om ändring av bilagorna I och II till beslut 2003/467/EG
    vad gäller fastställandet av att Estland är officiellt fritt från tuberkulos
    och brucellos när det gäller nötkreatursbesättningar [delgivet med nr K(2010)
    7856]'
