  script: Latn
  content: '2010/695/EU: Besluit van de Commissie van 17 november 2010 tot wijziging
    van de bijlagen bij Beschikking 93/52/EEG wat betreft de erkenning dat Estland,
    Letland en de Autonome Gemeenschap van de Balearen in Spanje officieel vrij zijn
    van brucellose ( B. melitensis ) en tot wijziging van de bijlagen I en II bij
    Beschikking 2003/467/EG wat betreft de verklaring dat Estland officieel vrij is
    van tuberculose en brucellose wat betreft rundveebeslagen (Kennisgeving geschied
    onder nummer C(2010) 7856)'
  type: main
- language: pl
  script: Latn
  content: '2010/695/UE: Decyzja Komisji z dnia 17 listopada 2010 r. zmieniająca
    załączniki do decyzji 93/52/EWG w odniesieniu do uznania Estonii, Łotwy oraz
    Wspólnoty Autonomicznej Balearów w Hiszpanii za oficjalnie wolne od brucelozy
    ( B. melitensis ) oraz zmieniająca załączniki I i II do decyzji 2003/467/WE
    w odniesieniu do uznania Estonii za oficjalnie wolną od gruźlicy i brucelozy
    w odniesieniu do stad bydła (notyfikowana jako dokument nr C(2010) 7856)'
  type: main
- language: pt
  script: Latn
  content: '2010/695/UE: Decisão da Comissão, de 17 de Novembro de 2010 , que altera
    os anexos da Decisão 93/52/CEE, no que se refere ao reconhecimento da Estónia,
    da Letónia e da Comunidade Autónoma das Baleares, em Espanha, como oficialmente
    indemnes de brucelose ( B. melitensis ), e que altera os anexos I e II da Decisão
    2003/467/CE, no que se refere à declaração da Estónia como oficialmente indemne
    de tuberculose e oficialmente indemne de brucelose no que diz respeito aos efectivos
    de bovinos [notificada com o número C(2010) 7856]'
  type: main
- language: ro
  script: Latn
  content: '2010/695/UE: Decizia Comisiei din 17 noiembrie 2010 de modificare a anexelor
    la Decizia 93/52/CEE în ceea ce privește recunoașterea Estoniei, Letoniei și
    a Comunității Autonome a Insulelor Baleare din Spania ca oficial indemne de
    bruceloză ( B. melitensis ) și de modificare a anexelor I și II la Decizia
    2003/467/CE în ceea ce privește declararea Estoniei ca oficial indemnă de tuberculoză
    și oficial indemnă de bruceloză în ceea ce privește efectivele de bovine
    [notificată cu numărul C(2010) 7856]'
  type: main
- language: sk
  script: Latn
  content: '2010/695/EÚ: Rozhodnutie Komisie zo 17. novembra 2010 , ktorým sa menia
