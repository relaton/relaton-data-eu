    autonomā apgabala Spānijā atzīšanu par oficiāli brīvu no brucelozes ( B.
    melitensis ) un ar ko groza Lēmuma 2003/467/EK I un II pielikumu attiecībā
    uz Igaunijas atzīšanu par oficiāli brīvu no tuberkulozes un brucelozes attiecībā
    uz liellopu ganāmpulkiem (izziņots ar dokumenta numuru C(2010) 7856)'
  type: main
- language: lt
  script: Latn
  content: '2010/695/ES: 2010 m. lapkričio 17 d. Komisijos sprendimas, kuriuo dėl
    pripažinimo, kad Estijoje, Latvijoje ir Ispanijos Balearų salų autonominėje
    bendrijoje oficialiai nenustatyta bruceliozės ( B. melitensis ), iš dalies keičiami
    Sprendimo 93/52/EEB priedai ir kuriuo dėl paskelbimo, kad Estijoje galvijų bandose
    oficialiai nenustatyta tuberkuliozės ir bruceliozės, iš dalies keičiami Sprendimo
    2003/467/EB I ir II priedai (pranešta dokumentu Nr. C(2010) 7856)'
  type: main
- language: mt
  script: Latn
  content: '2010/695/UE: Deċiżjoni tal-Kummissjoni tas- 17 ta’ Novembru 2010 li
    temenda l-Annessi tad-Deċiżjoni 93/52/KEE fir-rigward tar-rikonoxximent li l-Estonja,
    il-Latvja u l-Komunità Awtonoma tal-Gżejjer Baleariċi fi Spanja huma uffiċjalment
    ħielsa mill-bruċellosi ( B. melitensis ) u li temenda l-Annessi I u II tad-Deċiżjoni
    2003/467/KE fir-rigward tad-dikjarazzjoni li l-Estonja hija uffiċjalment ħielsa
    mit-tuberkolosi u uffiċjalment ħielsa mill-bruċellosi fir-rigward tal-merħliet
    tal-bovini (notifikata bid-dokument numru C(2010) 7856)'
  type: main
