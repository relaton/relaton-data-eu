    Lotyšska a autonómneho spoločenstva Baleárskych ostrovov v Španielsku za
    oblasti úradne bez výskytu brucelózy ( B. melitensis ), a ktorým sa menia
    a dopĺňajú prílohy I a II k rozhodnutiu 2003/467/ES, pokiaľ ide o vyhlásenie
    Estónska za oblasť úradne bez výskytu tuberkulózy a brucelózy u hovädzieho
    dobytka [oznámené pod číslom K(2010) 7856]'
  type: main
- language: sl
  script: Latn
  content: '2010/695/EU: Sklep Komisije z dne 17. novembra 2010 o spremembi Prilog
    k Odločbi 93/52/EGS glede priznanja Estonije, Latvije in avtonomne skupnosti
    Balearskih otokov v Španiji kot uradno prostih bruceloze ( B. melitensis ) ter
    spremembi prilog I in II k Odločbi 2003/467/ES glede razglasitve, da je Estonija
    uradno prosta tuberkuloze in uradno prosta bruceloze glede čred goveda (notificirano
    pod dokumentarno številko C(2010) 7856)'
  type: main
- language: es
  script: Latn
  content: '2010/695/UE: Decisión de la Comisión, de 17 de noviembre de 2010 , por
