title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1097/78 of 25 May 1978 re-establishing the
    levying of customs duties on light petroleum oils, falling within subheading 27.10
    A III, originating in Iran to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1097/78 de la Commission, du 25 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole légères, de la sous-position tarifaire 27.10 A III, originaires d'Iran,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1097/78 der Kommission vom 25. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Leichtöle der Tarifstelle 27.10 A III, mit Ursprung in Iran,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1097/78 af 25. maj 1978 om genindførelse
    af opkrævning af toldafgifter for lette olier, under underposition 27.10 A III,
    som har oprindelse i Iran og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1097/78 della Commissione, del 25 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio leggeri
    della sottovoce doganale 27.10 A III, originari dell'Iran, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1097/78 van de Commissie van 25 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lichte oliën,
    van post 27.10 A III, van oorsprong uit Iran, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
