    Φεβρουαρίου 2000, σχετικά με την τροποποίηση
    της απόφασης 97/217/ΕΚ για τον καθορισμό ομάδων
    τρίτων χωρών οι οποίες δύνανται να χρησιμοποιούν
    την κτηνιατρική πιστοποίηση για εισαγωγές
    κρέατος αγρίων θηραμάτων, κρέατος εκτρεφομένων
    θηραμάτων και κρέατος κουνελιών από τρίτες
    χώρες [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 286]'
  type: main
- language: fi
  script: Latn
  content: '2000/161/EY: Komission päätös, tehty 14 päivänä helmikuuta 2000,
    niiden kolmansien maiden ryhmistä, jotka voivat käyttää eläinlääkärintodistuksia
    luonnonvaraisen riistan ja tarhatun riistan sekä kaninlihan tuonnissa kolmansista
    maista, tehdyn päätöksen 97/217/EY muuttamisesta (tiedoksiannettu numerolla
    K(2000) 286)'
  type: main
- language: it
  script: Latn
  content: '2000/161/CE: Decisione della Commissione, del 14 febbraio 2000, che modifica
