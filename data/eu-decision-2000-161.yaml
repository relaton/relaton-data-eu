    hygiejnecertifikaterne i forbindelse med indførsel af kød af vildtlevende vildt,
    kød af opdrættet vildt og kaninkød fra tredjelande (meddelt under nummer K(2000)
    286)'
  type: main
- language: el
  script: Grek
