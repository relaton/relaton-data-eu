title:
- language: en
  script: Latn
  content: '2000/161/EC: Commission Decision of 14 February 2000 amending Decision
    97/217/EC establishing groups of third countries which are able to use the veterinary
    certification for imports of wild game meat, farmed game meat and rabbit meat
    from third countries (notified under document number C(2000) 286)'
  type: main
- language: fr
  script: Latn
  content: '2000/161/CE: Décision de la Commission, du 14 février 2000, modifiant
    la décision 97/217/CE établissant des groupes de pays tiers pouvant utiliser
    les certificats vétérinaires pour les importations de viandes de gibier, de
    viandes de gibier d''élevage et de viandes de lapin en provenance de pays tiers
    [notifiée sous le numéro C(2000) 286]'
  type: main
- language: de
  script: Latn
  content: '2000/161/EG: Entscheidung der Kommission vom 14. Februar 2000 zur Änderung
    der Entscheidung 97/217/EG zur Bildung von Gruppen von Drittländern, die die
    Veterinärbescheinigung für die Einfuhr von Fleisch von freilebendem Wild, Zuchtwild
    und Kaninchen aus Drittländern verwenden dürfen (Bekanntgegeben unter Aktenzeichen
    K(2000) 286)'
  type: main
- language: da
  script: Latn
  content: '2000/161/EF: Kommissionens beslutning af 14. februar 2000 om ændring
