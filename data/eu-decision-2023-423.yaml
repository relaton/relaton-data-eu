  script: Latn
  content: Commission Implementing Decision (EU) 2023/423 of 24 February 2023 on a
    pilot project to implement the administrative cooperation provisions relating
    to regulated professions set out in Directives 2005/36/EC and (EU) 2018/958 of
    the European Parliament and of the Council by means of the Internal Market Information
    System and to integrate the database of regulated professions into that system
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/423 de la Commission du 24 février
    2023 relative à un projet pilote visant à mettre en œuvre les dispositions
