  content: Commission Regulation (EEC) No 3281/82 of 7 December 1982 re-establishing
    the levying of customs duties on other pumps and compressors, falling within subheading
    84.11 A II and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 applye
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3281/82 de la Commission, du 7 décembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres pompes
    et compresseurs de la sous-position 84.11 A II du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
