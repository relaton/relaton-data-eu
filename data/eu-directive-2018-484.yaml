title:
- language: en
  script: Latn
  content: Commission Implementing Directive (EU) 2018/484 of 21 March 2018 amending
    Directive 93/49/EEC as regards requirements to be fulfilled by the propagating
    material of certain genera or species of Palmae in respect of Rhynchophorus ferrugineus
    (Olivier)
  type: main
- language: fr
  script: Latn
  content: Directive d'exécution (UE) 2018/484 de la Commission du 21 mars 2018 modifiant
    la directive 93/49/CEE pour ce qui est des exigences auxquelles les matériels
    de multiplication de certains genres ou espèces de Palmae doivent satisfaire
    en ce qui concerne Rhynchophorus ferrugineus (Olivier)
  type: main
- language: de
  script: Latn
  content: Durchführungsrichtlinie (EU) 2018/484 der Kommission vom 21. März 2018
    zur Änderung der Richtlinie 93/49/EWG hinsichtlich der Anforderungen an Vermehrungsmaterial
    bestimmter Gattungen oder Arten von Palmae im Hinblick auf Rhynchophorus ferrugineus
    (Olivier)
  type: main
- language: bg
