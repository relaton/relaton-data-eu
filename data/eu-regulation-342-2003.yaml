title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 342/2003 of 21 February 2003 amending for
    the 12th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 342/2003 de la Commission du 21 février 2003 modifiant
    pour la douzième fois le règlement (CE) n° 881/2002 du Conseil instituant certaines
    mesures restrictives spécifiques à l'encontre de certaines personnes et entités
    liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et abrogeant
    le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 342/2003 der Kommission vom 21. Februar 2003 zur zwölften
    Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung bestimmter
    spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates
  type: main
