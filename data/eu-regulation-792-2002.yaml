    nel settore delle imposte indirette (IVA) con riferimento a delle misure aggiuntive
    in materia di commercio elettronico
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 792/2002 van de Raad van 7 mei 2002 tot tĳdelĳke
