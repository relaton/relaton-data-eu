    auf dem Gebiet der indirekten Besteuerung (MWSt.) im Hinblick auf zusätzliche
    Maßnahmen betreffend den elektronischen Geschäftsverkehr
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 792/2002 af 7. maj 2002 om midlertidig ændring
    med hensyn til yderligere foranstaltninger vedrørende elektronisk handel af forordning
    (EØF) nr. 218/92 om administrativt samarbejde inden for området indirekte skatter
    (moms)
  type: main
- language: el
  script: Grek
