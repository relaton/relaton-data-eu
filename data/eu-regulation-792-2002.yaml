  content: Council Regulation (EC) No 792/2002 of 7 May 2002 amending temporarily
    Regulation (EEC) No 218/92 on administrative cooperation in the field of indirect
    taxation (VAT) as regards additional measures regarding electronic commerce
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 792/2002 du Conseil du 7 mai 2002 modifiant à titre
    temporaire le règlement (CEE) n° 218/92 sur la coopération administrative dans
    le domaine des impôts indirects (TVA) en ce qui concerne de nouvelles mesures
    relatives au commerce électronique
  type: main
- language: de
  script: Latn
