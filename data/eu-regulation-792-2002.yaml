    ηλεκτρονικό εμπόριο
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 792/2002, annettu 7 päivänä toukokuuta 2002,
    hallinnollisesta yhteistyöstä välillisen verotuksen (ALV) alalla annetun asetuksen
    (ETY) N:o 218/92 väliaikaisesta muuttamisesta sähköistä kaupankäyntiä koskevien
    lisätoimenpiteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 792/2002 del Consiglio, del 7 maggio 2002, che modifica
