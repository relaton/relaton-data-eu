    op het gebied van de indirecte belastingen (BTW) wat betreft aanvullende maatregelen
    inzake elektronische handel
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 792/2002 do Conselho, de 7 de Maio de 2002, que altera,
    a título temporário, o Regulamento (CEE) n.° 218/92 relativo à cooperação
    administrativa no domínio dos impostos indirectos (IVA) no que se refere a medidas
    adicionais relativas ao comércio electrónico
  type: main
- language: es
