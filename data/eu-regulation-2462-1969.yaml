  content: Règlement (CEE) n° 2462/69 du Conseil, du 8 décembre 1969, portant augmentation
    du contingent tarifaire communautaire de morues entières, décapitées ou tronçonnées,
    simplement salées ou en saumure, ou séchées, de la position 03.02 à I b) du
    tarif douanier commun (année 1969)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2462/69 des Rates vom 8. Dezember 1969 zur Erhöhung
    des Gemeinschaftszollkontingents für Kabeljau, ganz, ohne Kopf oder zerteilt,
    nur gesalzen, in Salzlake oder getrocknet, der Tarifnummer 03.02 A I b) des Gemeinsamen
    Zolltarifs (1969)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2462/69 del Consiglio, dell'8 dicembre 1969, relativo
    all'aumento del contingente tariffario comunitario di merluzzi interi, decapitati
    o in pezzi, semplicemente salati o in salamoia, o secchi, della voce 03.02 A I
    b) della tariffa doganale comune (anno 1969)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2462/69 van de Raad van 8 december 1969 houdende
    vergroting van het communautaire tariefcontingent van kabeljauw, ook indien ontdaan
    van kop of in moten gesneden, enkel gezouten, gepekeld of gedroogd, van post 03.02
    A I b) van het gemeenschappelijk douanetarief (1969)
  type: main
