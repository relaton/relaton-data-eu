title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4117/87 of 21 December 1987 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1988
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4117/87 de la Commission du 21 décembre 1987 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1988, intervenant dans le calcul de la compensation financière
    et de l' avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4117/87 der Kommission vom 21. Dezember 1987 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1988 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4117/87 af 21. december 1987 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1988
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4117/87 της Επιτροπής
    της 21ης Δεκεμβρίου 1987 περί καθορισμού της κατ
    αποκοπή αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1988
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4117/87 della Commissione del 21 dicembre 1987 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1988
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4117/87 van de Commissie van 21 december 1988 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1988 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4117/87 da Comissão de 21 de Dezembro de 1987 que
    fixa para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1988
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4117/87 de la Comisión de 21 de diciembre de 1987
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1988, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
