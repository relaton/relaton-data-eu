type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2180/74 of the Commission of 20 August 1974 re-establishing
    the levying of the customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, not optically worked nor of optical glass, falling
    within subheading 70.14 A II, originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2180/74 de la Commission, du 20 août 1974, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune de la sous-position tarifaire
    70.14 A II, originaire de Roumanie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2180/74 der Kommission vom 20. August 1974 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, nicht optisch bearbeitet, der
    Tarifstelle 70.14 A II, mit Ursprung in Rumänien, dem die in der Verordnung (EWG)
    Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2180/74 af 20. august 1974 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, underposition 70.14
    A II, som har oprindelse i Rumænien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2180/74 della Commissione, del 20 agosto 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune della sottovoce doganale n. 70.14 A II, originarie
    della Romania, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2180/74 van de Commissie van 20 augustus 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas van onderverdeling 70.14 A II van
    oorsprong uit Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
