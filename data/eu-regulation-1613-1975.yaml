id: EURegulation16131975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1613/75 of the Commission of 26 June 1975 re-establishing
    the levying of customs duties on cotton yarn, not put up for retail sale, multiple
    or cabled, not exceeding 900 g, falling within subheading 55.05 A, originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1613/75 de la Commission, du 26 juin 1975, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, retors ou câbles, d'un poids
    maximal de 900 grammes, de la sous-position tarifaire 55.05 A, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1613/75 der Kommission vom 26. Juni 1975 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, gezwirnt und appretiert, mit einem Höchstgewicht von 900 g
    je Stück, der Tarifstelle 55.05 A, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1613/75 af 26. juni 1975 om genindførelse
    af opkrævning af toldafgifter for garn, af bomuld, ikke i detailsalgsoplægninger,
    flertrådet eller kabelslået, når vægten ikke overstiger 900 g, under underposition
    55.05 A, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1613/75 della Commissione, del 26 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto, ritorti o ritorti su ritorto, di peso massimo
    di 900 g, della sottovoce doganale n. 55.05 A, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3046/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1613/75 van de Commissie van 26 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein, getwijnd of gekabeld, met een
    gewicht van niet meer dan 900 g van onderverdeling 55.05 A, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3046/74 van
    de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
