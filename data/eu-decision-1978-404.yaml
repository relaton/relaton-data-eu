id: EUDecision1978404
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 March 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's, girls' and infants' woven and knitted or crocheted
    dresses, of wool, cotton or man-made textile fibres, falling within heading No
    ex 60.05 of the Common Customs Tariff, originating in Taiwan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/404/CEE: Décision de la Commission, du 20 mars 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et robes de bonneterie
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la position Ex 60.05 du Tarif douanier commun,
    originaires de Taiwan et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. März 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Kleider aus Geweben und aus Gewirken für Frauen, Mädchen und Kleinkinder,
    aus Wolle, aus Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen,
    der Tarifnummer ex 60.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 20. marts 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vævede kjoler af trikotage, til kvinder, piger og småbørn, af uld,
    bomuld eller kemofibre, som henhører under pos. ex 60.05 i den fælles toldtarif,
    har oprindelse i Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 marzo 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario abiti interi tessuti ed a maglia per donna, per ragazza
    e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali
    della voce ex 60.05 della tariffa doganale comune, originari di Taiwan e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 maart 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    japonnen voor dames, meisjes en kinderen, geweven en van brei- of haakwerk, van
    wol, van katoen of van synthetische of kunstmatige textielvezels, van post ex
    60.05 van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
