    attiecībā uz pesticīdu atliekvielu maksimāli pieļaujamo daudzumu noteikšanu
    attiecīgi augļos un dārzeņos, labībā, dzīvnieku izcelsmes pārtikas produktos
    un dažos augu izcelsmes produktos, tajā skaitā augļos un dārzeņos, un uz
    tiem
  type: main
