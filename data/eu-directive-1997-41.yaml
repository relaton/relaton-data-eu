title:
- language: en
  script: Latn
  content: Council Directive 97/41/EC of 25 June 1997 amending Directives 76/895/EEC,
    86/362/EEC, 86/363/EEC and 90/642/EEC relating to the fixing of maximum levels
    for pesticide residues in and on, respectively, fruit and vegetables, cereals,
    foodstuffs of animal origin, and certain products of plant origin, including fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 97/41/CE du Conseil du 25 juin 1997 modifiant les directives
    76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE concernant la fixation de teneurs
    maximales pour les résidus de pesticides sur et dans, respectivement, les fruits
    et légumes, les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/41/EG des Rates vom 25. Juni 1997 zur Änderung der Richtlinien
    76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in Obst und Gemüse,
    Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen pflanzlichen
    Ursprungs, einschließlich Obst und Gemüse
  type: main
