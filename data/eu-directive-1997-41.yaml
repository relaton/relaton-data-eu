  script: Latn
  content: Direttiva 97/41/CE del Consiglio del 25 giugno 1997 che modifica le direttive
    76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE, che fissano le quantità massime
    di residui rispettivamente sugli e negli ortofrutticoli, sui e nei cereali, sui
    e nei prodotti alimentari di origine animale e su e in alcuni prodotti di origine
    vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
