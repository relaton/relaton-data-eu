title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1184/1999 of 8 June 1999 laying down rates
    of compensatory interest applicable during the second half of 1999 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1184/1999 de la Commission, du 8 juin 1999, fixant
    les taux d'intérêts compensatoires applicables en cas de naissance d'une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'état
    (régime du perfectionnement actif, système de la suspension et régime de l'admission
    temporaire) pendant le deuxième semestre de 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1184/1999 der Kommission vom 8. Juni 1999 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1999 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveränderte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1184/1999 af 8. juni 1999 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i andet halvår af 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1184/1999 της Επιτροπής,
    της 8ης Ιουνίου 1999, για τον καθορισμό εξισωτικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του δεύτερου εξάμηνου 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1184/1999, annettu 8 päivänä kesäkuuta 1999,
    vuoden 1999 toisella kalenterivuosipuoliskolla sovellettavista jalostetuista tuotteista
    tai samassa tilassa olevista tavaroista syntyvän tullivelan hyvityskorkokannoista
    (sisäisen jalostuksen vapautusjärjestelmä, suspensiojärjestelmä ja väliaikainen
    maahantuonti)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1184/1999 della Commissione, dell'8 giugno 1999, che
    determina i tassi di interesse compensatori applicabili ove sorga un'obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel secondo semestre 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1184/1999 van de Commissie van 8 juni 1999 tot vaststelling
    van de jaarlijkse intrestpercentages van toepassing in geval van het ontstaan
    van een douaneschuld voor veredelingsproducten of onveredelde goederen (regeling
    actieve veredeling en tijdelijke invoer) tijdens het tweede semester 1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1184/1999 da Comissão, de 8 de Junho de 1999, que
    fixa as taxas de juros de compensação aplicáveis aos casos de constituição
    de uma dívida aduaneira relativa a produtos compensadores ou a mercadorias no
    seu estado inalterado (regime do aperfeiçoamento activo e importação temporária),
    durante o segundo semestre de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1184/1999 de la Comisión, de 8 de junio de 1999, por
    el que se fijan los tipos de interés compensatorio aplicables en caso de nacimiento
    de una deuda aduanera relativa a los productos compensadores o a las mercancías
    sin transformar (régimen de perfeccionamiento activo e importación temporal)
    durante el segundo semestre de 1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1184/1999 av den 8 juni 1999 om fastställande
    av kompensationsräntor som skall tillämpas under andra hälften av 1999 på
    tullskulder som uppkommit för förädlingsprodukter eller varor i obearbetat
    skick (vid aktiv förädling, suspension och temporär import)
  type: main
