  content: Commission Regulation (EEC) No 3083/88 of 6 October 1988 re-establishing
    the levying of customs duties on reception apparatus for radio-telephony, radio-telegraphy
    or radio-broadcasting, etc., falling within CN codes 8527, 8528 and 8529, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3083/88 de la Commission du 6 octobre 1988 portant
