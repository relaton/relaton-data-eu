    récepteurs pour la radiotéléphonie, la radiotélégraphie ou la radiodiffusion,
    des codes NC 8527, 8528 et 8529, originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
