title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1312/72 de la Commission, du 23 juin 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessous (linge de corps) pour hommes et garçonnets, en tissus
    autres que de coton, de la sous-position tarifaire EX 61.03, originaires des pays
    en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2797/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1312/72 der Kommission vom 23. Juni 1972 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Unterkleidung
    (Leibwäsche) für Männer und Knaben, auch Kragen, Vorhemden und Manschetten,
    andere als aus Baumwolle, der Tarifnummer ex 61.03, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2797/71 des Rates vom 20. Dezember 1971
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1312/72 della Commissione, del 23 giugno 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    sottovesti (biancheria da dosso) per uomo e per ragazzo, in tessuti non di cotone,
    della voce doganale n. ex 61.03 originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2797/71 del Consiglio,
    del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1312/72 van de Commissie van 23 juni 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen, andere dan van katoen, van tariefpost ex 61.03,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2797/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend
  type: main
