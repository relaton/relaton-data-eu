id: EURegulation8062010
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 806/2010 of 13 September 2010 amending
    Regulations (EC) No 1292/2007 and (EC) No 367/2006 as regards the granting of
    an exemption from the measures imposed under those Regulations to one Israeli
    exporter of polyethylene terephthalate (PET) film originating in India and terminating
    the registration of imports from that exporter
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 806/2010 du Conseil du 13 septembre
    2010 modifiant les règlements (CE) n ° 1292/2007 et (CE) n ° 367/2006 en accordant
    une exemption des mesures imposées par lesdits règlements à un exportateur
    israélien de feuilles en polyéthylène téréphtalate (PET) originaires de l’Inde
    et mettant fin à l’enregistrement des importations provenant de cet exportateur
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 806/2010 des Rates vom 13. September
    2010 zur Änderung der Verordnungen (EG) Nr. 1292/2007 und (EG) Nr. 367/2006 zwecks
    Befreiung eines israelischen Ausführers von Folien aus Polyethylenterephthalat
    (PET) mit Ursprung in Indien von den durch jene Verordnungen verhängten Maßnahmen
    und zwecks Einstellung der zollamtlichen Erfassung der Einfuhren dieses Ausführers
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 806/2010 на Съвета
    от 13 септември 2010 година за изменение на регламенти
    (ЕО) № 1292/2007 и (ЕО) № 367/2006 по отношение освобождаването
    на един износител от Израел на фолио от полиетилен
    терефталат (РЕТ) с произход от Индия от наложените
    с посочените регламенти мерки и прекратяване
    регистрацията на вноса от този износител
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 806/2010 ze dne 13. září 2010
    , kterým se mění nařízení (ES) č. 1292/2007 a (ES) č. 367/2006, pokud
    jde o vynětí z opatření stanovených těmito nařízeními jednoho izraelského
    vývozce a o ukončení celní evidence dovozu od tohoto vývozce
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 806/2010 af 13. september 2010
    om ændring af forordning (EF) nr. 1292/2007 og (EF) nr. 367/2006 for så vidt
    angår fritagelse af en israelsk eksportør af polyethylenterephthalatfolie (PET-folie)
    med oprindelse i Indien for de ved nævnte forordninger indførte foranstaltninger
    og ophævelse af registreringen af import fra nævnte eksportør
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (EE) αριθ. 806/2010 του
    Συμβουλίου, της 13ης Σεπτεμβρίου 2010 , για την
    τροποποίηση των κανονισμών (ΕΚ) αριθ. 1292/2007
    και (ΕΚ) αριθ. 367/2006 όσον αφορά τη χορήγηση απαλλαγής
    από τα μέτρα που επεβλήθησαν διά των κανονισμών
    αυτών σε έναν εξαγωγέα από το Ισραήλ τερεφθαλικού
    πολυαιθυλενίου (PET) καταγωγής Ινδίας, και τον
    τερματισμό της καταγραφής των εισαγωγών από
    τον εν λόγω εξαγωγέα
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 806/2010, 13. september 2010 , millega
    muudetakse määruseid (EÜ) nr 1292/2007 ja (EÜ) nr 367/2006 seoses nimetatud
    määrustega kehtestatud meetmetest erandi tegemisega ühele Iisraeli eksportijale,
    kes impordib Indiast pärit polüetüleentereftalaatkilet, ja tühistada sellelt
    eksportijalt pärineva impordi registreerimise nõue
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 806/2010, annettu 13 päivänä
    syyskuuta 2010 , asetusten (EY) N:o 1292/2007 ja (EY) N:o 367/2006 muuttamisesta
    siltä osin kuin on kyse yhden israelilaisen Intiasta peräisin olevan polyeteenitereftalaattikalvon
    (PET-kalvo) viejän vapauttamisesta mainittujen asetusten nojalla määrätyistä
    toimenpiteistä ja kyseisen viejän tuonnin kirjaamisen päättämisestä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 806/2010 od 13. rujna 2010. o izmjeni
    uredbi (EZ) br. 1292/2007 i (EZ) br. 367/2006 u pogledu odobravanja izuzeća od
    mjera uvedenih na temelju tih uredbi za jednog izraelskog izvoznika folija od
    polietilen tereftalata (PET) podrijetlom iz Indije i o prekidu evidentiranja uvoza
    od tog izvoznika
  type: main
- language: hu
  script: Latn
  content: A Tanács 806/2010/EU végrehajtási rendelete ( 2010. szeptember 13. )
    az 1292/2007/EK és 367/2006/EK rendelet módosításáról, egy izraeli, Indiából
    származó polietilén-tereftalát (PET) fóliát behozó exportőr számára
    az ezen rendeletek által előírt intézkedések alóli mentesség megadása
    és a tőle származó behozatalra vonatkozó nyilvántartásbavételi kötelezettség
    megszüntetése tekintetében
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 806/2010 del Consiglio, del 13 settembre
    2010 , che modifica i regolamenti (CE) n. 1292/2007 e (CE) n. 367/2006 relativamente
    alla concessione dell’esenzione dalle misure istituite da tali regolamenti a
    un esportatore israeliano di polietilene tereftalato (PET) originario dell’India
    e pone termine alla registrazione delle importazioni effettuate da tale esportatore
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas Regula (ES) Nr. 806/2010 ( 2010. gada 13. septembris
    ), ar kuru groza Regulas (EK) Nr. 1292/2007 un (EK) Nr. 367/2006 attiecībā uz
    viena Izraēlas Indijas izcelsmes polietilēntereftalāta (PET) plēves eksportētāja
    atbrīvošanu no pasākumiem saskaņā ar šīm regulām un pārtrauc minētā
    eksportētāja veiktā importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2010 m. rugsėjo 13 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 806/2010,
    kuriuo iš dalies keičiamos reglamentų (EB) Nr. 1292/2007 ir (EB) Nr. 367/2006
    nuostatos, susijusios su atleidimu nuo tais reglamentais nustatytų priemonių
    Indijos kilmės polietileno tereftalato (PET) plėvelės vienam Izraelio eksportuotojui,
    ir kuriuo panaikinama iš to eksportuotojo importuojamo produkto registracija
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ implimentazzjoni tal-Kunsill (UE) Nru 806/2010 tat- 13
    ta’ Settembru 2010 li jemenda r-Regolamenti (KE) Nru 1292/2007 u (KE) Nru 367/2006
    fir-rigward tal-għoti ta’ eżenzjoni mill-miżuri imposti taħt dawk ir-Regolamenti
    lil esportatur Iżraeljan wieħed ta’ film tat-tereftalat tal-polietilene (PET)
    li jorġina mill-Indja u li jtemm ir-reġistrazzjoni tal-importazzjonijiet mingħand
    dak l-esportatur
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 806/2010 van de Raad van 13 september 2010
    tot wijziging van de Verordeningen (EG) nr. 1292/2007 en (EG) nr. 367/2006, voor
    wat betreft de vrijstelling van de bij deze verordeningen ingestelde maatregelen
    voor één Israëlische importeur van polyethyleentereftalaatfolie (petfolie)
    van oorsprong uit India en tot beëindiging van de registratie van de invoer door
    deze exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 806/2010 z dnia 13 września 2010
    r. zmieniające rozporządzenia (WE) nr 1292/2007 i (WE) nr 367/2006 w zakresie
    przyznania jednemu izraelskiemu eksporterowi folii z politereftalanu etylenu (PET)
    pochodzącej z Indii zwolnienia ze środków nałożonych na mocy tych rozporządzeń
    oraz kończące rejestrację przywozu towarów przez tego eksportera
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 806/2010 do Conselho, de 13 de Setembro
    de 2010 , que altera os Regulamentos (CE) n. ° 1292/2007 e (CE) n. ° 367/2006
    no que toca à concessão de uma isenção às medidas impostas ao abrigo desses
    regulamentos a um exportador israelita de películas de (poli)tereftalato de etileno
    (PET) originárias da Índia e à cessação do registo das importações provenientes
    desse exportador
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 806/2010 al Consiliului din
    13 septembrie 2010 de modificare a Regulamentelor (CE) nr. 1292/2007 și (CE)
    nr. 367/2006 în ceea ce privește acordarea unui exportator israelian de folii
    din polietilen tereftalat (PET) originare din India a unei exceptări de la măsurile
    impuse în baza regulamentelor respective și de încheiere a înregistrării
    importurilor provenind de la acel exportator
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 806/2010 z 13. septembra 2010 ,
    ktorým sa menia a dopĺňajú nariadenia (ES) č. 1292/2007 a (ES) č. 367/2006,
    pokiaľ ide o udelenie oslobodenia od opatrení uložených podľa týchto nariadení
    jednému izraelskému vývozcovi polyetyléntereftalátového (PET) filmu s pôvodom
    v Indii, a ktorým sa ukončuje registrácia dovozu od tohto vývozcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 806/2010 z dne 13. septembra 2010 o spremembah
    uredb (ES) št. 1292/2007 in (ES) št. 367/2006 zaradi odobritve izvzetja iz ukrepov,
    naloženih v skladu z navedenima uredbama izraelskemu izvozniku folije iz polietilen
    tereftalata (PET) s poreklom iz Indije in prenehanju registracije uvoza za navedenega
    izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 806/2010 del Consejo, de 13 de septiembre
    de 2010 , por el que se modifican los Reglamentos (CE) n ° 1292/2007 y (CE) n
    ° 367/2006 en lo que respecta a la concesión de una exención a las medidas
    impuestas a su amparo a un exportador israelí de película de politereftalato
    de etileno (PET) originaria de la India y se pone fin al registro de las importaciones
    de dicho exportador
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 806/2010 av den 13 september 2010
    om ändring av förordningarna (EG) nr 1292/2007 och (EG) nr 367/2006 vad gäller
    beviljande av undantag från de åtgärder som införts genom dessa förordningar
    för en israelisk exportör av polyetentereftalatfilm med ursprung i Indien och
    avslutande av registreringen av import från den exportören
  type: main
