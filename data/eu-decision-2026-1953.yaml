    XXVIII des Allgemeinen Zoll- und Handelsabkommens (GATT) 1994 über die Änderung
    der Zugeständnisse für alle in der EU-Liste CLXXV aufgeführten Zollkontingente
    infolge des Austritts des Vereinigten Königreichs aus der Europäischen Union
  type: main
