    és Kereskedelmi Egyezmény (GATT) XXVIII. cikke értelmében levélváltás formájában
    létrejött, az EU CLXXV. engedményes listájában szereplő valamennyi vámkontingensre
    vonatkozó engedményeknek az Egyesült Királyság Európai Unióból való kilépése
