title:
- language: fr
  script: Latn
  content: Décision 66/673/CEE de la Commission, du 28 octobre 1966, autorisant certains
    États membres à percevoir des taxes compensatoires à l'importation de certaines
    marchandises résultant de la transformation de produits agricoles, en provenance
    des autres États membres
  type: main
- language: de
  script: Latn
  content: '66/673/EWG: Entscheidung der Kommission vom 28. Oktober 1966 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von bestimmten Waren, die aus der
    Verarbeitung landwirtschaftlicher Erzeugnisse entstehen, aus den anderen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '66/673/CEE: Decisione della Commissione, del 28 ottobre 1966, che autorizza
    alcuni Stati membri a riscuotere tasse di compensazione d''importazione di alcuni
    prodotti risultanti dalla trasformazione di prodotti agricoli, e provenienti dagli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/673/EEG: Beschikking van de Commissie van 28 oktober 1966 houdende
    machtiging tot het leggen van compenserende heffingen op de invoer in bepaalde
    Lid- Staten van bepaalde goederen verkregen uit de verwerking van landbouwprodukten,
    uit de overige Lid-Staten'
  type: main
