  content: Council Regulation (EEC) No 774/86 of 28 February 1986 laying down the
    arrangements applicable to trade in certain agricultural products with Austria,
    Finland, Norway, Sweden and Switzerland as a result of the accession of Spain
    and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 774/86 du Conseil du 28 février 1986 fixant le régime
    applicable aux échanges de certains produits agricoles avec l' Autriche, la Finlande,
    la Norvège, la Suède et la Suisse à la suite de l' adhésion de l' Espagne
    et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 774/86 des Rates vom 28. Februar 1986 über die Handelsregelung
