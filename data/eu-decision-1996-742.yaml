id: EUDecision1996742
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/742/EC: Commission Decision of 2 December 1996 drawing up a list of
    border inspection posts agreed for veterinary checks on products and animals from
    third countries, laying down detailed rules concerning the checks to be carried
    out by the veterinary experts of the Commission and repealing Decision 95/357/EC'
  type: main
- language: fr
  script: Latn
  content: '96/742/CE: Décision de la Commission du 2 décembre 1996 établissant
    une liste des postes d''inspection frontaliers agréés pour les contrôles vétérinaires
    sur les produits et animaux en provenance des pays tiers, définissant les modalités
    des contrôles à effectuer par les experts vétérinaires de la Commission et
    abrogeant la décision 95/357/CE'
  type: main
- language: de
  script: Latn
  content: '96/742/EG: Entscheidung der Kommission vom 2. Dezember 1996 zur Festlegung
    eines Verzeichnisses der für die Veterinärkontrollen von Erzeugnissen und Tieren
    aus Drittländern zugelassenen Grenzkontrollstellen, zur Festlegung genauer Bestimmungen
    über die von den tierärztlichen Sachverständigen der Kommission durchzuführenden
    Kontrollen sowie zur Aufhebung der Entscheidung 95/357/EG'
  type: main
- language: da
  script: Latn
  content: '96/742/EF: Kommissionens Beslutning af 2. december 1996 om en liste over
    grænsekontrolsteder, der er godkendt til at føre veterinærkontrol med produkter
    og dyr fra tredjelande, om nærmere regler for den kontrol, som Kommissionens
    veterinærsagkyndige skal føre, og om ophævelse af beslutning 95/357/EF'
  type: main
- language: el
  script: Grek
  content: '96/742/ΕΚ: Απόφαση της Επιτροπής της 2ας Δεκεμβρίου
    1996 για κατάρτιση καταλόγου μεθοριακών σταθμών
    επιθεώρησης που είναι εγκεκριμένοι για τη
    διενέργεια κτηνιατρικών ελέγχων σε προϊόντα
    και ζώα από τρίτες χώρες, για καθορισμό λεπτομερών
    κανόνων όσον αφορά τους ελέγχους που πρέπει
    να διενεργούνται από τους εμπειρογνώμονες
    κτηνιάτρους της Επιτροπής, και για ακύρωση
    της απόφασης 95/357/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '96/742/EY: Komission päätös, tehty 2 päivänä joulukuuta 1996, kolmansista
    maista tuotavien tuotteiden ja eläinten eläinlääkärintarkastuksia varten
    hyväksyttyjen rajatarkastusasemien luettelosta, komission eläinlääkintäasiantuntijoiden
    suorittamia tarkastuksia koskevista yksityiskohtaisista säännöistä ja päätöksen
    95/357/EY kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '96/742/CE: Decisione della Commissione del 2 dicembre 1996 che stabilisce
    l''elenco dei posti d''ispezione frontalieri riconosciuti ai fini dei controlli
    veterinari sui prodotti e sugli animali provenienti dai paesi terzi, che definisce
    norme dettagliate sui controlli che debbono essere effettuati dagli esperti veterinari
    della Commissione e che abroga la decisione 95/357/CE'
  type: main
- language: nl
  script: Latn
  content: '96/742/EG: Beschikking van de Commissie van 2 december 1996 tot vaststelling
    van een lijst van inspectieposten aan de grens die zijn erkend voor de veterinaire
    controles van produkten en dieren uit derde landen, tot vaststelling van uitvoeringsbepalingen
    inzake de door de veterinaire deskundigen te verrichten controles en tot intrekking
    van Beschikking 95/357/EG'
  type: main
- language: pt
  script: Latn
  content: '96/742/CE: Decisão da Comissão de 2 de Dezembro de 1996 que estabelece
    uma lista dos postos de inspecção fronteiriços aprovados para a realização
    dos controlos veterinários de produtos e animais provenientes de países terceiros
    e as regras de execução dos controlos a efectuar pelos peritos veterinários
    da Comissão e que revoga a Decisão 95/357/CE'
  type: main
- language: es
  script: Latn
  content: '96/742/CE: Decisión de la Comisión de 2 de diciembre de 1996 por la
    que se establece la lista de puestos de inspección fronterizos autorizados para
    efectuar los controles veterinarios de los productos y animales procedentes de
    terceros países, así como las condiciones de los controles que deben efectuar
    los expertos veterinarios de la Comisión, y se deroga la Decisión 95/357/CE'
  type: main
- language: sv
  script: Latn
  content: '96/742/EG: Kommissionens beslut av den 2 december 1996 om upprättande
    av en förteckning över gränskontrollstationer som godkänts för veterinärkontroller
    av produkter och djur från tredje land, om fastställande av närmare bestämmelser
    om de kontroller som skall utföras av kommissionens veterinärexperter och om
    upphävande av beslut 95/357/EG'
  type: main
