title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2251/96 of 25 November 1996 amending and
    derogating in part from Regulation (EC) No 3338/93 to provide for the payment
    of financial compensation to the producers of certain citrus fruits and lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2251/96 de la Commission du 25 novembre 1996 modifiant
    et dérogeant pour partie au règlement (CE) n° 3338/93 pour prévoir le paiement
    de la compensation financière aux producteurs de certains agrumes et des citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2251/96 der Kommission vom 25. November 1996 zur Änderung
    und teilweisen Abweichung von der Verordnung (EG) Nr. 3338/93 im Hinblick auf
    die Zahlung des finanziellen Ausgleichs an die Erzeuger von bestimmten Zitrusfrüchten
    und Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2251/96 af 25. november 1996 om ændring
    af og undtagelse fra en del af forordning (EF) nr. 3338/93 med henblik på betaling
    af udligningstilskuddet til producenterne af visse citrusfrugter og citroner
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2251/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Νοεμβρίου 1996 για τροποποίηση και παρέκκλιση
    εν μέρει από τον κανονισμό (ΕΚ) αριθ. 3338/93 για
    την πρόβλεψη της πληρωμής της χρηματικής αποζημίωσης
    στους παραγωγούς ορισμένων εσπεριδοειδών
    και λεμονιών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2251/96, annettu 25 päivänä marraskuuta 1996,
    asetuksen (EY) N:o 3338/93 muuttamisesta ja siitä osittain poikkeamisesta tiettyjen
    sitrushedelmien ja sitruunoiden tuottajille maksettavan rahallisen korvauksen
    vahvistamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2251/96 della Commissione del 25 novembre 1996 recante
    modifica e deroga parziale al regolamento (CE) n. 3338/93 per prevedere il pagamento
    della compensazione finanziaria ai produttori di taluni agrumi e ai produttori
    di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2251/96 van de Commissie van 25 november 1996 tot
    wijziging van Verordening (EG) nr. 3338/93 en houdende gedeeltelijke afwijking
    van deze verordening, met het oog op de betaling van de financiële vergoeding
    aan telers van bepaalde citrusvruchten en van citroenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2251/96 da Comissão de 25 de Novembro de 1996 que
    altera e derroga parcialmente o Regulamento (CE) nº 3338/93 para prever o pagamento
    da compensação financeira aos produtores de determinados citrinos e aos produtores
    de limões
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2251/96 de la Comisión de 25 de noviembre de 1996
    por el que se modifica el Reglamento (CE) n° 3338/93 y se establece una excepción
    parcial al mismo para prever el pago de la compensación financiera a los productores
    de determinados cítricos y limones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2251/96 av den 25 november 1996 om ändring
