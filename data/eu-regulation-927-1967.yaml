title:
- language: fr
  script: Latn
  content: Règlement n 927/67/CEE de la Commission, du 29 novembre 1967, fixant,
    pour chaque État membre, la différence de prix du sucre blanc applicable pour
    le calcul du prélèvement et de la restitution dans le secteur des produits transformés
    à base de fruits et légumes, avec addition de sucre
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 927/67/EWG der Kommission vom 29. November 1967 zur Festsetzung
    des Unterschieds zwischen dem für die Berechnung der Abschöpfungen zugrunde
    zu legenden WeiDzuckerpreis und dem Erstattungsbetrag auf dem Sektor der Verarbeitungserzeugnisse
    aus Obst und Gemüse mit Zusatz von Zucker in jedem Mitgliedstaat
  type: main
- language: it
  script: Latn
  content: Regolamento n. 927/67/CEE della Commissione, del 29 novembre 1967, che
    fissa, per ciascuno degli Stati membri, la differenza di prezzo dello zucchero
    bianco applicabile per il calcolo del prelievo e della restituzione nel settore
    dei prodotti trasformati a base di ortofrutticoli con aggiunta di zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening no. 927/67/EEG van de Commissie van 29 november 1967 betreffende
    de vaststelling voor elke Lid-Staat van het, voor de berekening van de heffing
    en de restitutie in de sector van op basis van groenten en fruit verwerkte produkten
    met toevoeging van suiker, toe te passen prijsverschil voor witte suiker
  type: main
