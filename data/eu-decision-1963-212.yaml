  content: Décision de la Commission autorisant la République italienne à adopter
    une mesure de sauvegarde en application de l'article 226 du Traité, en faveur
    des parties et pièces détachées d'accumulateurs électriques, au plomb
  type: main
- language: de
  script: Latn
  content: '63/212/EWG: Entscheidung der Kommission zur Ermächtigung der Italienischen
    Republik auf Anwendung von Schutzmaßnahmen gemäß Artikel 226 des Vertrages
    für Teile von elektrischen Bleiakkumulatoren'
  type: main
- language: it
  script: Latn
  content: '63/212/CEE: Decisione della Commissione che autorizza la Repubblica italiana
    ad adottare, a norma dell''articolo 226 del Trattato, una misura di salvaguardia
    a favore della produzione di parti e pezzi staccati di accumulatori elettrici
    di piombo'
  type: main
- language: nl
  script: Latn
  content: '63/212/EEG: Beschikking van de Commissie tot machtiging van de Italiaanse
    Republiek om op grond van artikel 226 van het Verdrag een vrijwaringsmaatregel
    te nemen ten behoeve van loden delen van elektrische accumulatoren'
