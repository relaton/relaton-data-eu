title:
- language: en
  script: Latn
  content: Commission Directive 2007/12/EC of 26 February 2007 amending certain Annexes
    to Council Directive 90/642/EEC as regards the maximum residue levels of penconazole,
    benomyl and carbendazim
  type: main
- language: fr
  script: Latn
  content: Directive 2007/12/CE de la Commission du 26 février 2007 modifiant certaines
    annexes de la directive 90/642/CEE du Conseil en ce qui concerne les teneurs maximales
    en résidus de penconazole, bénomyl et carbendazim
  type: main
- language: de
  script: Latn
  content: Richtlinie 2007/12/EG der Kommission vom 26. Februar 2007 zur Änderung
    bestimmter Anhänge der Richtlinie 90/642/EWG des Rates bezüglich der dort festgesetzten
    Rückstandshöchstgehalte für Penconazol, Benomyl und Carbendazim
  type: main
- language: bg
  script: Cyrl
  content: Директива 2007/12/ЕО на Комисията от 26 февруари
    2007 година за изменение на някои приложения
    към Директивa 90/642/ЕИО на Съвета относно максимално
    допустимите нива на остатъци от пенконазол,
    беномил и карбендазим
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2007/12/ES ze dne 26. února 2007 , kterou se mění některé
    přílohy směrnice Rady 90/642/EHS, pokud jde o maximální limity reziduí penkonazolu,
    benomylu a karbendazimu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2007/12/EF af 26. februar 2007 om ændring af visse
    bilag til Rådets direktiv 90/642/EØF for så vidt angår maksimalgrænseværdier
    for restkoncentrationer af penconazol, benomyl og carbendazim
  type: main
- language: el
  script: Grek
  content: Οδηγία 2007/12/ΕΚ της Επιτροπής, της 26ης Φεβρουαρίου
    2007 , για την τροποποίηση ορισμένων παραρτημάτων
    της οδηγίας 90/642/ΕΟΚ του Συμβουλίου όσον αφορά
    τον καθορισμό των ανώτατων επιπέδων υπολειμμάτων
    των φυτοφαρμάκων penconazole, benomyl και carbendazim
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2007/12/EÜ, 26. veebruar 2007 , millega muudetakse
    nõukogu direktiivi 90/642/EMÜ teatavaid lisasid seoses penkonasooli, benomüüli
    ja karbendasiimi jääkide piirnormidega
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2007/12/EY, annettu 26 päivänä helmikuuta 2007
    , neuvoston direktiivin 90/642/ETY tiettyjen liitteiden muuttamisesta penkonatsolin,
    benomyylin ja karbendatsiimin jäämien enimmäismäärien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2007/12/EK irányelve ( 2007. február 26. ) a 90/642/EGK
    tanácsi irányelv egyes mellékleteinek a penkonazol, a benomil és a karbendazim
    megengedett legmagasabb szermaradvány-határértékei tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2007/12/CE della Commissione, del 26 febbraio 2007 , che modifica
