    massimi tar-residwi għall-penconazole, il-benomyl u l-carbendazim
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2007/12/EG van de Commissie van 26 februari 2007 tot wijziging
    van bepaalde bijlagen bij Richtlijn 90/642/EEG van de Raad wat betreft maximumgehalten
    aan residuen van penconazool, benomyl en carbendazim
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2007/12/WE z 26 lutego 2007 r. wprowadzająca zmiany
    do niektórych załączników dyrektywy Rady nr 90/642/EWG w odniesieniu do najwyższych
    dopuszczalnych poziomów pozostałości penakonazolu, benomylu i karbendazymu
  type: main
- language: pt
  script: Latn
  content: Directiva 2007/12/CE da Comissão, de 26 de Fevereiro de 2007 , que altera
    determinados anexos da Directiva 90/642/CEE do Conselho no que diz respeito aos
    limites máximos de resíduos de penconazol, benomil e carbendazime
  type: main
- language: ro
  script: Latn
  content: Directiva 2007/12/CE a Comisiei din 26 februarie 2007 de amendare a unor
    anexe la Directiva 90/642/CEE a Consiliului privitoare la conținuturile maxime
    de reziduuri de penconazol, benomil și carbendazim
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2007/12/ES z 26. februára 2007 , ktorou sa menia a dopĺňajú
    určité prílohy k smernici Rady 90/642/EHS, pokiaľ ide o maximálne hladiny
    rezíduí penkonazolu, benomylu a karbendazímu
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2007/12/ES z dne 26. februarja 2007 o spremembi nekaterih
