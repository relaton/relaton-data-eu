    penkonazola, benomila un karbendazima atliekvielu daudzumiem
  type: main
- language: lt
  script: Latn
  content: 2007 m. vasario 26 d. Komisijos direktyva 2007/12/EB, iš dalies keičianti
    tam tikrus Tarybos direktyvos 90/642/EEB priedus dėl didžiausių penkonazolo,
    benomilo ir karbendazimo likučių koncentracijų
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2007/12/KE tas- 26 ta’ Frar 2007 li temenda
