id: EURegulation27981994
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2798/94 of 14 November 1994 amending for 1994
    the level of the quantitative limits applicable to imports of certain textile
    products originating in the people's Republic of China and listed in Annex IV
    to Regulation (EC) No 517/94 on common rules for imports of textile products from
    certain third countries not covered by bilateral agreements, protocols or other
    arrangements, or by other specific Community import rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2798/94 du Conseil du 14 novembre 1994 modifiant, pour
    l'année 1994, le niveau des limites quantitatives applicables à l'importation
    de certains produits textiles originaires de la République populaire de Chine,
    tel que précisé à l'annexe IV du règlement (CE) n° 517/94 relatif au régime
    commun applicable aux importations de produits textiles en provenance de certains
    pays tiers non couverts par des accords, protocoles ou autres arrangements bilatéraux,
    ou par d'autres régimes communautaires spécifiques d'importation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2798/94 DES RATES vom 14. November 1994 zur Änderung
    der Höchstmengen für die Einfuhr bestimmter Textilwaren mit Ursprung in der
    Volksrepublik China für das Jahr 1994, die in Anhang IV der Verordnung (EG) Nr.
    517/94 über die gemeinsame Regelung der Einfuhren von Textilwaren aus bestimmten
    Drittländern, die nicht unter bilaterale Abkommen, Protokolle, andere Vereinbarungen
    oder eine spezifische gemeinschaftliche Einfuhrregelung fallen, aufgeführt sind
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 2798/94 af 14. november 1994 om ændring for
    1994 af de kvantitative lofter gældende for importen af visse tekstilvarer med
    oprindelse i Den Kinesiske Folkerepublik, som er anført i bilag IV til forordning
    (EF) nr. 517/94 om den fælles ordning for indførsel af tekstilvarer fra en række
    tredjelande, som ikke er omfattet af bilaterale aftaler, protokoller eller andre
    arrangementer eller af andre specifikke fællesskabsregler for indførsel
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2798/94 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 14ης Νοεμβρίου 1994 με τον οποίο τροποποιείται,
    για το έτος 1994, το επίπεδο των ποσοτικών ορίων
    που ισχύουν κατά την εισαγωγή κλωστοϋφαντουργικών
    προϊόντων, καταγωγής της Λαϊκής Δημοκρατίας
    της Κίνας, όπως ορίζει το παράρτημα IV του κανονισμού
    (ΕΚ) αριθ. 517/94, περί θεσπίσεως κοινών κανόνων
    για τις εισαγωγές κλωστοϋφαντουργικών προϊόντων
    από ορισμένες χώρες τα οποία δεν καλύπτονται
    από διμερείς συμφωνίες, πρωτόκολλα ή άλλους
    διακανονισμούς ή άλλους κοινοτικούς κανόνες
    εισαγωγής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2798/94 DEL CONSIGLIO del 14 novembre 1994 che modifica,
    per l' anno 1994, il livello dei limiti quantitativi applicabili alle importazioni
    di alcuni prodotti tessili originari della Repubblica popolare cinese, come specificato
    dall' allegato IV del regolamento (CE) n. 517/94 del Consiglio, del 7 marzo 1994,
    che concerne il regime comune applicabile alle importazioni di prodotti tessili
    da taluni paesi terzi, non contemplati da accordi bilaterali, da protocolli o
    da altre disposizioni né da altro regime comunitario specifico in materia di
    importazioni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2798/94 VAN DE RAAD van 14 november 1994 tot wijziging,
    voor 1994, van de kwantitatieve beperkingen op de invoer van bepaalde textielprodukten
    van oorsprong uit de Volksrepubliek China zoals vermeld in bijlage IV van Verordening
    (EG) nr. 517/94 betreffende een gemeenschappelijke regeling voor de invoer van
    textielprodukten uit bepaalde derde landen, die niet vallen onder bilaterale overeenkomsten,
    protocollen of andere regelingen, noch onder een andere, bijzondere, communautaire
    regeling
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2798/94 DO CONSELHO de 14 de Novembro de 1994 que
    altera, para 1994, o nível dos limites quantitativos aplicáveis à importação
    de determinados produtos têxteis originários da República Popular da China,
    tal como especificado no anexo IV do Regulamento (CE) nº 517/94 relativo ao regime
    comum aplicável às importações de produtos têxteis de determinados países
    terceiros, não abrangidas por acordos, protocolos ou outros convénios bilaterais
    ou outras regras comunitárias específicas de importação
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2798/94 DEL CONSEJO de 14 de noviembre de 1994 por
    el que se modifica, para el año 1994, el nivel de los límites cuantitativos
    aplicables a la importación de determinados productos textiles originarios de
    la República Popular de China, tal como se precisa en el Anexo IV del Reglamento
    (CE) nº 517/94 relativo al régimen común aplicable a las importaciones de productos
    textiles de determinados países terceros que no estén cubiertos por Acuerdos
    bilaterales, Protocolos, otros Acuerdos o por otros regímenes específicos comunitarios
    de importación
  type: main
