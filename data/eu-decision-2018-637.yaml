id: EUDecision2018637
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/637 of 20 April 2018 amending
    Decision 2009/766/EC on the harmonisation of the 900 MHz and 1800 MHz frequency
    bands for terrestrial systems capable of providing pan-European electronic communications
    services in the Community as regards relevant technical conditions for the Internet
    of Things (notified under document C(2018) 2261)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/637 de la Commission du 20 avril 2018
    modifiant la décision 2009/766/CE sur l'harmonisation des bandes de fréquences
    de 900 MHz et de 1800 MHz pour les systèmes de Terre capables de fournir des
    services paneuropéens de communications électroniques dans la Communauté en
    ce qui concerne les conditions techniques pertinentes pour l'internet des objets
    [notifiée sous le numéro C(2018) 2261]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/637 der Kommission vom 20. April 2018
    zur Änderung der Entscheidung 2009/766/EG der Kommission zur Harmonisierung des
    900-MHz-Bands und des 1800-MHz-Bands für terrestrische Systeme, die europaweite
    elektronische Kommunikationsdienste in der Gemeinschaft erbringen können, in
    Bezug auf die einschlägigen technischen Bedingungen für das Internet der Dinge
    (Bekannt gegeben unter Aktenzeichen C(2018) 2261)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/637 на Комисията
    от 20 април 2018 година за изменение на Решение
    2009/766/ЕО относно хармонизирането на радиочестотните
    обхвати 900 MHz и 1800 MHz за наземни системи за предоставяне
    на общоевропейски електронни съобщителни
    услуги в Общността по отношение на съответните
    технически условия за интернета на нещата
    (нотифицирано под номер С(2018) 2261)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/637 ze dne 20. dubna 2018, kterým
    se mění rozhodnutí 2009/766/ES o harmonizaci kmitočtových pásem 900 MHz
    a 1800 MHz pro zemské systémy schopné poskytovat celoevropské služby elektronických
    komunikací ve Společenství, pokud jde o příslušné technické podmínky
    pro internet věcí (oznámeno pod číslem C(2018) 2261)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/637 af 20. april 2018
    om ændring af beslutning 2009/766/EF om harmonisering af 900 MHz-båndet og 1800
    MHz-båndet for landbaserede systemer, som kan levere fælleseuropæiske elektroniske
    kommunikationstjenester i Fællesskabet, for så vidt angår relevante tekniske
    betingelser for tingenes internet (meddelt under nummer C(2018) 2261)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/637 της Επιτροπής,
    της 20ής Απριλίου 2018, για την τροποποίηση της
    απόφασης 2009/766/ΕΚ σχετικά με την εναρμόνιση
    των ζωνών συχνοτήτων των 900 MHz και 1800 MHz για επίγεια
    συστήματα, ικανά να παρέχουν πανευρωπαϊκές
    υπηρεσίες ηλεκτρονικών επικοινωνιών στην
    Κοινότητα, όσον αφορά σχετικούς τεχνικούς
    όρους για το διαδίκτυο των πραγμάτων [κοινοποιηθείσα
    υπό τον αριθμό C(2018) 2261]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/637, 20. aprill 2018, millega muudetakse
    otsust 2009/766/EÜ (sagedusalade 900 MHz ja 1800 MHz ühtlustamise kohta ühenduses
    üleeuroopalisi elektroonilisi sideteenuseid pakkuda võimaldavate maapealsete
    süsteemide jaoks) osas, mis puudutab asjade interneti suhtes kohaldatavaid tehnilisi
    tingimusi (teatavaks tehtud numbri C(2018) 2261 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/637, annettu 20 päivänä
    huhtikuuta 2018, taajuusalueiden 900 MHz ja 1800 MHz käytön yhdenmukaistamisesta
    yleiseurooppalaisten sähköisten viestintäpalvelujen tarjontaan yhteisössä
    pystyviä maanpäällisiä järjestelmiä varten tehdyn päätöksen 2009/766/EY
    muuttamisesta esineiden internetin kannalta merkityksellisten teknisten edellytysten
    osalta (tiedoksiannettu numerolla C(2018) 2261)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/637 оd 20. travnja 2018. o izmjeni
    Odluke 2009/766/EZ o usklađivanju frekvencijskih pojaseva 900 MHz i 1800 MHz
    za terestričke sustave koji mogu pružati paneuropske elektroničke komunikacijske
    usluge u Zajednici u pogledu relevantnih tehničkih uvjeta za internet stvari
    (priopćeno pod brojem dokumenta C(2018) 2261)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/637 végrehajtási határozata (2018. április 20.)
    a 900 MHz-es és az 1800 MHz-es frekvenciasávnak a Közösségen belül páneurópai
    elektronikus hírközlési szolgáltatások nyújtására alkalmas földfelszíni
    rendszerek részére történő harmonizálásáról szóló 2009/766/EK határozatnak
    a dolgok internetére vonatkozó műszaki feltételek tekintetében történő
    módosításáról (az értesítés a C(2018) 2261. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/637 della Commissione, del 20 aprile
    2018, che modifica la decisione 2009/766/CE della Commissione relativa all'armonizzazione
    delle bande di frequenze 900 MHz e 1800 MHz per i sistemi terrestri in grado di
    fornire servizi di comunicazioni elettroniche paneuropee nella Comunità per quanto
    riguarda le condizioni tecniche per l'Internet delle cose [notificata con il numero
    C(2018) 2261]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/637 (2018. gada 20. aprīlis),
    ar ko Lēmumu 2009/766/EK par 900 MHz un 1800 MHz frekvenču joslu harmonizāciju
    tādu sauszemes sistēmu vajadzībām, kas Kopienā spēj nodrošināt Eiropas
    mēroga elektronisko sakaru pakalpojumus, groza saistībā ar attiecīgiem tehniskajiem
    nosacījumiem lietu internetam (izziņots ar dokumenta numuru C(2018) 2261)
  type: main
- language: lt
  script: Latn
  content: 2018 m. balandžio 20 d. Komisijos įgyvendinimo sprendimas (ES) 2018/637,
    kuriuo dėl daiktų internetui skirtų tam tikrų techninių sąlygų iš dalies
    keičiamas Sprendimas 2009/766/EB dėl 900 MHz ir 1800 MHz dažnių juostų suderinimo
    antžeminėms sistemoms, kuriomis galima teikti Europos masto elektroninių ryšių
    paslaugas Bendrijoje (pranešta dokumentu Nr. C(2018) 2261)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/637 tal-20 ta'
    April 2018 li temenda d-Deċiżjoni tal-Kummissjoni 2009/766/KE dwar l-armonizzazzjoni
    tal-meded ta' frekwenza 900 MHz u 1800 MHz għal sistemi terrestri li kapaċi
    jipprovdu servizzi elettroniċi pan-Ewropej ta' komunikazzjoni fil-Komunità fir-rigward
    ta' kundizzjonijiet tekniċi rilevanti għall-internet tal-oġġetti (notifikata
    bid-dokument C(2018) 2261)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/637 van de Commissie van 20 april 2018 tot
    wijziging van Beschikking 2009/766/EG betreffende de harmonisatie van de 900 MHz-
    en de 1800 MHz-frequentieband voor terrestrische systemen die pan-Europese elektronischecommunicatiediensten
    kunnen verschaffen in de Gemeenschap wat betreft relevante technische voorwaarden
    voor het internet der dingen (Kennisgeving geschied onder nummer C(2018) 2261)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/637 z dnia 20 kwietnia 2018 r. zmieniająca
    decyzję 2009/766/WE w sprawie harmonizacji pasm częstotliwości 900 MHz i 1800
    MHz na potrzeby systemów naziemnych umożliwiających dostarczanie paneuropejskich
    usług łączności elektronicznej we Wspólnocie w odniesieniu do warunków technicznych
    istotnych dla funkcjonowania internetu rzeczy (notyfikowana jako dokument nr C(2018)
    2261)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/637 da Comissão, de 20 de abril de 2018,
    que altera a Decisão 2009/766/CE da Comissão relativa à harmonização das
    faixas de frequências dos 900 MHz e 1800 MHz para sistemas terrestres capazes
    de fornecer serviços pan-europeus de comunicações eletrónicas na Comunidade,
    no que diz respeito às condições técnicas relevantes para a Internet das coisas
    [notificada com o número C(2018) 2261]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/637 a Comisiei din 20 aprilie
    2018 de modificare a Deciziei 2009/766/CE privind armonizarea benzilor de frecvențe
    de 900 MHz și de 1800 MHz pentru sistemele terestre capabile să furnizeze servicii
    paneuropene de comunicații electronice în cadrul Comunității, în ceea ce
    privește condițiile tehnice relevante pentru internetul obiectelor [notificată
    cu numărul C(2018) 2261]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/637 z 20. apríla 2018, ktorým
    sa mení rozhodnutie 2009/766/ES o harmonizácii frekvenčných pásiem 900 MHz
    a 1800 MHz využívaných v rámci pozemných systémov, ktoré zabezpečujú
    poskytovanie celoeurópskych služieb elektronickej komunikácie v Spoločenstve,
    pokiaľ ide o relevantné technické podmienky pre internet vecí [oznámené
    pod číslom C(2018) 2261]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/637 z dne 20. aprila 2018 o spremembi
    Odločbe 2009/766/ES o usklajevanju frekvenčnih pasov 900 MHz in 1800 MHz za
    prizemne sisteme, ki lahko zagotavljajo vseevropske elektronske komunikacijske
    storitve v Skupnosti, glede ustreznih tehničnih pogojev za internet stvari (notificirano
    pod dokumentarno številko C(2018) 2261)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/637 de la Comisión, de 20 de abril de
    2018, por la que se modifica la Decisión 2009/766/CE, relativa a la armonización
    de las bandas de frecuencias de 900 MHz y 1800 MHz para los sistemas terrenales
    capaces de prestar servicios paneuropeos de comunicaciones electrónicas en la
    Comunidad, en lo que se refiere a las condiciones técnicas pertinentes para la
    internet de las cosas [notificada con el número C(2018) 2261]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/637 av den 20 april 2018 om
    ändring av beslut 2009/766/EG om harmonisering av frekvensbanden 900 MHz och
    1800 MHz i markbundna system med kapacitet för alleuropeiska tjänster för elektronisk
