title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 393/2012 of 7 May 2012 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Thailand in the
    lists of third countries or parts thereof from which poultry and poultry products
    may be imported into and transit through the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 393/2012 de la Commission du 7 mai
    2012 modifiant l’annexe I du règlement (CE) n ° 798/2008 en ce qui concerne
    l’inscription relative à la Thaïlande figurant dans la liste des pays tiers
    ou des parties de ces pays en provenance desquels les volailles et les produits
    de volailles peuvent être importés dans l’Union et transiter par celle-ci
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 393/2012 der Kommission vom 7. Mai 2012
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 im Hinblick auf den
    Eintrag zu Thailand in der Liste der Drittländer und Teile von Drittländern,
    aus denen die Einfuhr von Geflügel und Geflügelerzeugnissen in die Union und
    ihre Durchfuhr durch die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 393/2012 на Комисията
    от 7 май 2012 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Тайланд в списъците на трети страни или
    части от тях, от които домашните птици и продукти
    от домашни птици могат да бъдат внасяни и да
    преминават транзитно през Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 393/2012 ze dne 7. května 2012
    , kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku
    pro Thajsko v seznamech třetích zemí nebo jejich částí, z nichž lze do
    Unie dovážet a přes její území přepravovat drůbež a drůbeží produkty
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 393/2012 af 7. maj 2012
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Thailand i listerne over tredjelande eller dele af tredjelande, hvorfra fjerkræ
    og fjerkræprodukter kan importeres til og sendes i transit gennem Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 393/2012
    της Επιτροπής, της 7ης Μαΐου 2012 , για τροποποίηση
    του παραρτήματος I του κανονισμού (ΕΚ) αριθ.
    798/2008 όσον αφορά την καταχώριση για την Ταϊλάνδη
    στους καταλόγους των τρίτων χωρών ή μερών τους
    από τα οποία επιτρέπεται να εισαχθούν στην
    Ένωση ή να διαμετακομιστούν μέσω αυτής πουλερικά
    και προϊόντα πουλερικών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 393/2012, 7. mai 2012 , millega muudetakse
    määruse (EÜ) nr 798/2008 I lisa Taid käsitlevat kannet kolmandate riikide
    ja nende osade loetelus, millest võib importida liitu ja vedada läbi liidu kodulinde
    ja linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 393/2012, annettu 7 päivänä
    toukokuuta 2012 , asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta siltä
    osin kuin on kyse Thaimaata koskevasta kohdasta sellaisten kolmansien maiden tai
    niiden osien luettelossa, joista saa tuoda unioniin tai kuljettaa unionin kautta
    siipikarjaa ja siipikarjatuotteita
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 393/2012 od 7. svibnja 2012. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu uvrštavanja Tajlanda na popise
    trećih zemalja ili njihovih dijelova iz kojih je dopušten uvoz peradi i proizvoda
    od peradi u Uniju i njihov provoz kroz Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság 393/2012/EU végrehajtási rendelete ( 2012. május 7. ) a
    798/2008/EK rendelet I. mellékletének az azon harmadik országokat vagy azok
    részeit tartalmazó jegyzéknek, ahonnan baromfi és baromfitermékek behozhatók
    az Unióba és átszállíthatók az Unión, a Thaiföldre vonatkozó bejegyzése
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 393/2012 della Commissione, del 7 maggio
    2012 , che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto
    riguarda la voce relativa alla Thailandia negli elenchi di paesi terzi o parti
    di paesi terzi da cui sono consentiti le importazioni e il transito nell’Unione
    di pollame e prodotti a base di pollame
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 393/2012 ( 2012. gada 7. maijs
    ), ar ko groza Regulas (EK) Nr. 798/2008 I pielikumu attiecībā uz Taizemes pievienošanu
    to trešo valstu, teritoriju, zonu un nodalījumu sarakstam, no kuriem atļauts
    importēt un tranzītā caur Savienību pārvadāt mājputnus un mājputnu produktus
  type: main
- language: lt
  script: Latn
  content: 2012 m. gegužės 7 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 393/2012,
    kuriuo dėl Tailando įrašo trečiųjų šalių ar jų dalių, iš kurių galima
    importuoti į Sąjungą ir vežti tranzitu per Sąjungą naminius paukščius
    ir naminių paukščių produktus, sąrašuose iš dalies keičiamas Reglamento
    (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 393/2012 tas-
    7 ta’ Mejju 2012 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 fir-rigward
    tal-annotazzjoni għat-Tajlandja fil-listi ta’ pajjiżi terzi jew partijiet
    tagħhom li minnhom hija permessa l-importazzjoni u t-tranżitu ta’ tjur u prodotti
    tat-tjur fl-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 393/2012 van de Commissie van 7 mei 2012
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor Thailand in de lijsten van derde landen of delen daarvan waaruit pluimvee
    en pluimveeproducten mogen worden ingevoerd in of doorgevoerd door de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 393/2012 z dnia 7 maja 2012
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu
    do pozycji dotyczącej Tajlandii w wykazach państw trzecich lub ich części,
    z których dopuszczalny jest przywóz do Unii i tranzyt przez jej terytorium drobiu
    i produktów drobiowych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 393/2012 da Comissão, de 7 de maio
    de 2012 , que altera o anexo I do Regulamento (CE) n. ° 798/2008 no que respeita
    à entrada relativa à Tailândia nas listas de países terceiros ou partes de
    países terceiros a partir dos quais são autorizados a importação e o trânsito
    na União de aves de capoeira e de produtos à base de aves de capoeira
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 393/2012 al Comisiei din 7
    mai 2012 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce
    privește rubrica corespunzătoare Thailandei din listele conținând țări terțe
    sau părți ale acestora din care pot fi importate în Uniune și pot tranzita
    Uniunea păsările de curte și produsele de pasăre
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 393/2012 zo 7. mája 2012 , ktorým
    sa mení a dopĺňa príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o záznam
    týkajúci sa Thajska v zozname tretích krajín alebo ich častí, z ktorých
    možno do Únie dovážať alebo cez jej územie prevážať hydinu a výrobky
    z hydiny
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 393/2012 z dne 7. maja 2012 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa o Tajski na seznam tretjih držav
    ali delov teh držav, iz katerih se dovolita uvoz perutnine in perutninskih proizvodov
    v Unijo in njihov tranzit skozi Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 393/2012 de la Comisión, de 7 de mayo
    de 2012 , por el que se modifica el anexo I del Reglamento (CE) n ° 798/2008
    en lo referente a la entrada correspondiente a Tailandia en las listas de terceros
    países o partes de terceros países desde los cuales están permitidos la importación
    en la Unión o el tránsito por la misma de aves de corral y productos derivados
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 393/2012 av den 7 maj 2012
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller posten om
    Thailand i förteckningarna över tredjeländer eller delar av tredjeländer från
    vilka fjäderfä och fjäderfäprodukter får importeras till och transiteras
    genom unionen
  type: main
