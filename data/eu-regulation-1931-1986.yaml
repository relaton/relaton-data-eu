title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1931/86 of 23 June 1986 abolishing the countervailing
    charge on peaches including nectarines originating in Spain (except the Canary
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1931/86 de la Commission, du 23 juin 1986, supprimant
    la taxe compensatoire à l'importation de pêches, y compris les brugnons et les
    nectarines originaires d'Espagne (excepté les îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1931/86 der Kommission vom 23. Juni 1986 zur Aufhebung
