  content: COMMISSION REGULATION (EC) No 585/95 of 16 March 1995 laying down the extent
    to which applications lodged on 13 and 14 March 1995 for certificates for the
    advance-fixing of the export refund for certain poultrymeat products may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 585/95 DE LA COMMISSION du 16 mars 1995 déterminant
