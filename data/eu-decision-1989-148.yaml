  content: '89/148/EEC: Council Decision of 27 February 1989 accepting undertakings
    relating to the proceedings concerning video cassette recorders by Korean exporters
    and one Japanese exporter and terminating the proceedings with regard to these
    exporters'
  type: main
- language: fr
  script: Latn
  content: '89/148/CEE: Décision du Conseil du 27 février 1989 portant acceptation
    d''engagements souscrits par des exportateurs coréens et un exportateur japonais,
    dans le cadre de la procédure relative aux importations de magnétoscopes, et
    portant clôture de la procédure en ce qui concerne ces exportateurs'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 27. Februar 1989 über die Annahme von Verpflichtungen
    der koreanischen Ausführer und eines japanischen Ausführers im Rahmen des Verfahrens
    über Videokassettenrecorder und über die Einstellung des Verfahrens gegenüber
    den betreffenden Ausführern (89/148/EWG) (89/148/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 27. februar 1989 om godtagelse af tilsagn i forbindelse
    med antidumpingundersøgelsen vedrørende importen af visse videokassettebåndoptagere
    fra et antal koreanske eksportører og en japansk eksportør samt om afslutning
    af undersøgelsen for disse eksportørers vedkommende (89/148/EØF) (89/148/EØF)
    #'
  type: main
- language: el
  script: Grek
