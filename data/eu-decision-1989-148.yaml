    Φεβρουαρίου 1989 για την αποδοχή της ανάληψης
    υποχρεώσεων σχετικά με τη διαδικασία για τα
    μαγνητοσκόπια εγγραφής με κασέτα εκ μέρους
    κορεατών εξαγωγέων και ενός ιάπωνα εξαγωγέα
    και για την περάτωση της διαδικασίας όσον αφορά
    τους εξαγωγείς αυτούς'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO del 27 febbraio 1989 che accetta gli impegni assunti
