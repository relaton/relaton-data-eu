title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2320/75 of the Commission of 10 September 1975 reestablishing
    the levying of customs duties on carbonate of sodium anhydrite falling within
    subheading 28.42 A ex II, originating in Romania, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2320/75 de la Commission, du 10 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 A EX II, originaire de
    Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2320/75 der Kommission vom 10. September 1975 zur
    Wiedereinführung des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle
    28.42 A ex II mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3054/74
    des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2320/75 af 10. september 1975 om genindførelse
    af opkrævning af toldafgifter for vandfri natriumcarbonat under underposition
    28.42 A ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2320/75 della Commissione, del 10 settembre 1975,
    che ripristina la riscossione dei dazi doganali applicabili al carbonato di sodio
    anidro della sottovoce doganale 28.42 A ex II, originario della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2320/75 van de Commissie van 10 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op watervrije
    natriumcarbonaten van onderverdeling 28.42 A ex II, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
