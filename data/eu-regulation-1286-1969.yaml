  script: Latn
  content: "/* Kommissionens forordning (EØF) nr. 1286/69 af 3. juli 1969 om løbende licitationer for skummetmælkspulver, som de belgiske, tyske, franske og nederlandske interventionslagre ligger inde med, og som er bestemt til forarbejdning til foderblandinger til svin og fjerkræ */"
