title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2293/83 of 10 August 1983 re-establishing
    the levying of customs duties on textile fabrics impregnated, etc., products of
    category 100 (code 1000), originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2293/83 de la Commission du 10 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux tissus imprégnés, etc.,
    de la catégorie 100 (code 1000), originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2293/83 der Kommission vom 10. August 1983 über die
    Wiedereinführung des Zollsatzes für Gewebe, getränkt usw., der Warenkategorie
    Nr. 100 (Kennziffer 1000), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2293/83 af 10. august 1983 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer, imprægneret, osv., under kategori
    nr. 100 (kode 1000), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2293/83 της Επιτροπής
    της 10ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα υφάσματα
    εμπεποτισμένα κ.λ.π. προϊόντα της κατηγορίας
    100 (κώδικας 1000), καταγωγής Νότιας Κορέας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2293/83 della Commissione del 10 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti impregnati, ecc., della
    categoria di prodotti 100 (codice 1000), originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2293/83 van de Commissie van 10 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op geïmpregneerde
    weefsels, enzovoort, van de categorie van produkten nr. 100 (codenummer 1000),
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
