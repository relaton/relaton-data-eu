title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1119/75 of the Council of 14 April 1975 extending,
    in respect of the German Democratic Republic, to other products, the Annex to
    Regulation (EEC) No 109/70 establishing common rules for imports from State-trading
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1119/75 du Conseil, du 14 avril 1975, étendant à
    d' autres produits, en ce qui concerne la République démocratique allemande,
    l' annexe du règlement (CEE) n° 109/70 portant établissement d' un régime
    commun applicable aux importations de pays à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1119/75 des Rates vom 14. April 1975 zur Ausdehnung
    des Anhangs zur Verordnung (EWG) Nr. 109/70 zur Festlegung einer gemeinsamen Regelung
    für die Einfuhr aus Staatshandelsländern auf weitere Waren in bezug auf die
    Deutsche Demokratische Republik
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1119/75 af 14. april 1975 om udvidelse af
    bilaget til forordning (EØF) nr. 109/70 om fastlæggelse af en fælles ordning
    for indførsel fra statshandelslande til også at omfatte andre varer med hensyn
    til Den tyske demokratiske Republik
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1119/75 del Consiglio, del 14 aprile 1975, che estende,
    per quanto concerne la Repubblica democratica tedesca, ad altri prodotti l' allegato
    del regolamento (CEE) n. 109/70 che istituisce un regime comune applicabile alle
    importazioni dai paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1119/75 van de Raad van 14 april 1975 houdende uitbreiding,
    ten opzichte van de Duitse Democratische Republiek, van de bijlage bij Verordening
    (EEG) nr. 109/70 houdende totstandbrenging van een gemeenschappelijke regeling
    voor de invoer uit landen met staatshandel tot andere produkten
  type: main
