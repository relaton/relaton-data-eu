title:
- language: en
  script: Latn
  content: '83/459/EEC: Commission Decision of 4 July 1983 supplementing Decision
    79/833/EEC and laying down, for the purposes of the survey on the structure of
    agricultural holdings for 1979/80, the Community outline of a schedule of tables,
    the standard code and rules for the transcription on to magnetic tape of the data
    contained in those tables'
  type: main
- language: fr
  script: Latn
  content: '83/459/CEE: Décision de la Commission du 4 juillet 1983 complétant la
    décision 79/833/CEE et fixant, en vue de l'' enquête sur la structure des exploitations
    agricoles en 1979/1980, le schéma communautaire d'' un programme de tableaux,
    le code uniforme et les modalités d'' application pour la transcription sur bande
    magnétique des données de ces tableaux'
  type: main
- language: de
  script: Latn
  content: '83/459/EWG: Entscheidung der Kommission vom 4. Juli 1983 zur Ergänzung
    der Entscheidung 79/833/EWG zur Festlegung eines nach dem Gemeinschaftsschema
    erstellten Tabellenprogramms, eines einheitlichen Kodes sowie der Durchführungsbestimmungen
    für die Übertragung der Daten aus den genannten Tabellen auf Magnetbänder zum
    Zweck der Durchführung einer Erhebung über die Struktur der landwirtschaftlichen
    Betriebe 1979/80'
  type: main
- language: da
  script: Latn
  content: '83/459/EØF: Kommissionens beslutning af 4. juli 1983 om supplement til
    beslutning 79/833/EØF om fastsættelse med henblik på undersøgelsen af landbrugsbedrifternes
    struktur i 1979/80 af fællesskabsmodellen for et tabelprogram, standardkoden
    og gennemførelsesbestemmelserne for overførsel til magnetbånd af oplysningerne
    i disse tabeller'
  type: main
- language: el
  script: Grek
  content: '83/459/ΕΟΚ: Απόφαση της Επιτροπής της 4ης Ιουλίου
    1983 που συμπληρώνει την απόφαση 79/833/ΕΟΚ της
    Επιτροπής που καθορίζει, για τους σκοπούς της
    έρευνας για τη διάρθρωση των γεωργικών εκμεταλλεύσεων
    για το 1979/80, το κοινοτικό διάγραμμα καταλόγου
    πινάκων, την ενιαία μέθοδο και τους λεπτομερείς
    κανόνες εγγραφής σε μαγνητοταινία των στοιχείων
    που περιέχονται στους πίνακες αυτούς'
  type: main
- language: it
  script: Latn
  content: '83/459/CEE: Decisione della Commissione del 4 luglio 1983 che completa
    la decisione 79/833/CEE che stabilisce, ai fini dell'' indagine sulla struttura
    delle aziende agricole 1979/1980, lo schema comunitario di un programma di tabelle,
    il codice uniforme e le modalità di applicazione per la trascrizione dei dati
    su nastro magnetico'
  type: main
- language: nl
  script: Latn
  content: '83/459/EEG: Beschikking van de Commissie van 4 juli 1983 tot aanvulling
    van Beschikking 79/833/EEG houdende vaststelling, voor de enquête inzake de structuur
    van de landbouwbedrijven 1979/1980, van het communautaire schema voor een tabellenprogramma,
    de uniforme code en de voorschriften voor het opnemen van de gegevens van deze
    tabellen op magneetband'
  type: main
- language: pt
  script: Latn
  content: '83/459/CEE: Decisão da Comissão, de 4 de Julho de 1983, que completa
    a Decisão 79/833/CEE e que fixa, tendo em vista o inquérito sobre a estrutura
    das explorações agrícolas em 1979/1980, o esquema comunitário de um programa
    de quadros, o código uniforme a as regras de aplicação para a transcrição
    em banda magnética dos dados desses quadros'
  type: main
- language: es
  script: Latn
  content: '83/459/CEE: Decisión de la Comisión, de 4 de julio de 1983, por la que
    se completa la Decisión 79/833/CEE y por la que se establecen, con vistas a la
    encuesta sobre la estructura de las explotaciones agrícolas en 1979/1980, el
    esquema comunitario de un programa de cuadros, el código uniforme y las modalidades
    de aplicación para la transcripción en cinta magnética de los datos de dichos
    cuadros'
  type: main
