    καταλόγου προϊόντων που μπορούν να υπόκεινται
    στο καθεστώς που επιτρέπει την μεταποίηση
    υπό τελωνειακό έλεγχο των εμπορευμάτων πριν
    από την θέση τους σε ελεύθερη κυκλοφορία
  type: main
- language: it
