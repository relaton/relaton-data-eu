  content: Commission Regulation (EEC) No 3717/91 of 18 December 1991 drawing up the
    list of goods which may benefit from the arrangements permitting goods to be processed
    under customs control before being put into free circulation
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3717/91 DE LA COMMISSION du 18 décembre 1991 établissant
