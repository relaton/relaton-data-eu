    nella banca dati tabulari (BDT) del sistema EUROFARM'
  type: main
- language: nl
  script: Latn
  content: '97/341/EG: Beschikking van de Commissie van 20 maart 1997 houdende vaststelling,
    ten behoeve van de enquêtes inzake de structuur van de landbouwbedrijven in 1995
    en 1997, van het communautaire programma van voor de bank voor gegevens in tabelvorm
    (BDT) van het Eurofarm- systeem bestemde statistische tabellen'
  type: main
- language: pt
  script: Latn
  content: '97/341/CE: Decisão da Comissão de 20 de Março de 1997 que estabelece
    com vista ao inquérito sobre a estrutura das explorações agrícolas para o
    ano de 1995 e 1997, o programa comunitário de quadros estatísticos destinados
    a serem armazenados no banco de dados tabulares (BDT) do sistema Eurofarm'
  type: main
- language: es
  script: Latn
  content: '97/341/CE: Decisión de la Comisión de 20 de marzo de 1997 por la que
