title:
- language: en
  script: Latn
  content: '97/341/EC: Commission Decision of 20 March 1997 establishing, for the
    survey on the structure of agricultural holdings in 1995 and 1997, the Community
    programme of statistical tables to be stored in the Tabular Data Bank (BDT) of
    the Eurofarm system'
  type: main
- language: fr
  script: Latn
  content: '97/341/CE: Décision de la Commission du 20 mars 1997 fixant, en vue de
    l''organisation de l''enquête sur la structure des exploitations agricoles au
    cours de la période 1995-1997, le programme communautaire de tableaux statistiques
    destinés à être stockés dans la banque de données tabulaires (BDT) du système
    Eurofarm'
  type: main
- language: de
  script: Latn
  content: '97/341/EG: Entscheidung der Kommission vom 20. März 1997 zur Festlegung
    des Gemeinschaftsprogramms der für die Tabellendatenbank (BDT) des Systems EUROFARM
    bestimmten statistischen Tabellen zum Zweck der Durchführung der Erhebung über
    die Struktur der landwirtschaftlichen Betriebe im Zeitraum 1995-1997'
  type: main
- language: da
  script: Latn
  content: '97/341/EF: Kommissionens Beslutning af 20. marts 1997 om fastsættelse
    af EF-programmet for de statistiske tabeller som skal lagres i EUROFARM-projektets
    Bank for Tabeldata med henblik på undersøgelsen af landbrugsbedrifternes struktur
    i tidsrummet 1995-1997'
  type: main
- language: el
  script: Grek
  content: '97/341/ΕΚ: Απόφαση της Επιτροπής της 20ής Μαρτίου
    1997 η οποία θεσπίζει το κοινοτικό πρόγραμμα
    των στατιστικών πινάκων που προορίζονται για
    αποθήκευση στη βάση των πινακοποιημένων στοιχείων
    (BDT) του συστήματος Eurofarm, ενόψει των ερευνών
    σχετικά με τη διάρθρωση των γεωργικών εκμεταλλεύσεων
    κατά την περίοδο 1995-1997'
  type: main
- language: fi
  script: Latn
  content: '97/341/EY: Komission päätös tehty 20 päivänä maaliskuuta 1997 vuosina
    1995 ja 1997 tapahtuvaa maatilojen rakennetta koskevien tilastotietojen keruuta
    varten vahvistettavasta Eurofarm-järjestelmän BDT-taulukkotietopankkiin tallennettavia
    taulukoita koskevasta yhteisön ohjelmasta'
  type: main
- language: it
  script: Latn
  content: '97/341/CE: Decisione della Commissione del 20 marzo 1997 che fissa, ai
    fini dell''indagine sulla struttura delle aziende agricole nel periodo 1995-1997,
