title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 décembre 1969, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer
    le relèvement du droit de leur tarif douanier vers celui du Tarif douanier commun
    en ce qui concerne le café non torréfié, non décaféiné (n 09.01 A I A))
  type: main
- language: de
  script: Latn
  content: '70/38/EWG: Entscheidung der Kommission vom 19. Dezember 1969, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, die Angleichung des Zollsatzes ihres Zolltarifs
    an den des Gemeinsamen Zolltarifs für Kaffee, nicht geröstet, nicht entkoffeiniert
    (Tarifstelle 09.01 A I a) ), aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '70/38/CEE: Decisione della Commissione, del 19 dicembre 1969, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    a differire l''aumento del dazio della loro tariffa verso quello della tariffa
    doganale comune per il caffè non torrefatto, non decaffeinizzato (voce 09.01
    A I a))'
  type: main
- language: nl
  script: Latn
  content: '70/38/EEG: Beschikking van de Commissie van 19 december 1969 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd de aanpassing van de rechten van hun douanetarief aan die van
    het gemeenschappelijk douanetarief uit te stellen voor koffie, ongebrand, waaruit
    geen cafeïne is verwijderd van post 09.01, onderverdeling A I a)'
  type: main
