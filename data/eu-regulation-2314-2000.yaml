---
id: EURegulation23142000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2314/2000 of 17 October 2000 amending Regulation
    (EC) No 763/2000 extending the definitive anti-dumping duty, imposed by Regulation
    (EC) No 584/96 on imports of certain tube and pipe fittings, of iron or steel,
    originating in the People's Republic of China to imports of certain tube and pipe
    fittings, of iron or steel, consigned from Taiwan, whether declared as originating
    in Taiwan or not, and terminating the investigation in respect of imports from
    three Taiwanese exporters
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2314/2000 du Conseil du 17 octobre 2000 modifiant le
    règlement (CE) nº 763/2000 portant extension du droit antidumping définitif
    institué par le règlement (CE) nº 584/96 sur les importations de certains accessoires
    de tuyauterie, en fer ou en acier, originaires de la République populaire de
    Chine aux importations de certains accessoires de tuyauterie, en fer ou en acier,
    expédiés de Taïwan, qu'ils aient ou non été déclarés originaires de Taïwan,
    et clôturant l'enquête concernant trois exportateurs taïwanais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2314/2000 des Rates vom 17. Oktober 2000 zur Änderung
    der Verordnung (EG) Nr. 763/2000 zur Ausweitung des mit der Verordnung (EG) Nr.
    584/96 auf die Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke und
    Rohrverbindungsstücke aus Eisen oder Stahl mit Ursprung in der Volksrepublik
    China eingeführten endgültigen Antidumpingzolls auf die Einfuhren von aus Taiwan
    versandten bestimmten Rohrformstücken, Rohrverschlussstücken und Rohrverbindungsstücken
    aus Eisen oder Stahl, als Ursprungserzeugnisse Taiwans angemeldet oder nicht,
    und zur Einstellung der Untersuchung gegenüber den Einfuhren der Ware von drei
    taiwanischen Ausführern
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2314/2000 на Съвета от 17 октомври
    2000 година за изменение на Регламент (ЕО) № 763/2000
    за разширяване на окончателното антидъмпингово
    мито, наложено с Регламент (ЕО) № 548/96 за внос
    на определени тръби и водопроводни фитинги,
    от желязо или стомана, с произход от Китайската
    народна република, за внос на някои тръби и
    водопроводни фитинги от желязо или стомана,
    доставени от Тайван, независимо дали са декларирани,
    че са с произход от Тайван, или не, и за прекратяване
    на разследването по отношение на вноса от трима
    тайвански износители
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2314/2000 ze dne 17. října 2000, kterým se
    mění nařízení (ES) č. 763/2000 o rozšíření antidumpingového cla uloženého
    nařízením (ES) č. 584/96 na dovoz některých potrubních tvarovek ze železa
    nebo oceli pocházejících z Čínské lidové republiky na dovoz některých
    potrubních tvarovek ze železa nebo oceli odesílaných z Tchaj-wanu, ať už
    jsou prohlášeny za pocházející z Tchaj-wanu či nikoliv, a o zastavení šetření
    týkajícího se dovozů od tří tchaj-wanských vývozců.
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2314/2000 af 17. oktober 2000 om ændring af
    forordning (EF) nr. 763/2000 om udvidelse af den endelige antidumpingtold, der
    indførtes ved forordning (EF) nr. 584/96 på importen af visse rørfittings af
    jern og stål med oprindelse i Folkerepublikken Kina, til også at omfatte importen
    af visse rørfittings af jern og stål afsendt fra Taiwan, uanset om de er angivet
    med oprindelse i Taiwan, og om afslutning af undersøgelsen vedrørende importen
    fra tre taiwanske eksportører
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2314/2000 του Συμβουλίου,
    της 17ης Οκτωβρίου 2000, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 763/2000 για την επέκταση
    του οριστικού δασμού αντιντάμπινγκ που έχει
    επιβληθεί με τον κανονισμό (ΕΚ) αριθ. 584/96 στις
    εισαγωγές ορισμένων εξαρτημάτων σωληνώσεων
    από σίδηρο ή χάλυβα, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, και στις εισαγωγές ορισμένων εξαρτημάτων
    σωληνώσεων από σίδηρο ή χάλυβα, που αποστέλλονται
    από την Ταϊβάν, ανεξάρτητα από το αν έχουν δηλωθεί
    ως καταγωγής Ταϊβάν ή όχι, και για την περάτωση
    της έρευνας όσον αφορά τις εισαγωγές από τρεις
    εξαγωγείς της Ταϊβάν
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2314/2000, 17. oktoober 2000, millega muudetakse
    määrust (EÜ) nr 763/2000, millega laiendatakse teatavate Hiina Rahvavabariigist
    pärinevate raud- ja terastoruliitmike impordi suhtes määrusega (EÜ) nr 584/96
    kehtestatud lõpliku dumpinguvastase tollimaksu reguleerimisala teatavate Taiwanist
    saadetud, päritolult kohalikeks või mitte deklareeritud raud- ja terastoruliitmike
    impordile ning lõpetatakse uurimine kolmelt Taiwani eksportijalt pärineva impordi
    puhul
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2314/2000, annettu 17 päivänä lokakuuta 2000,
    Kiinan kansantasavallasta peräisin olevien tiettyjen raudasta tai teräksestä
    valmistettujen putkien liitos- ja muiden osien tuonnissa asetuksella (EY) N:o
    584/96 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta koskemaan
    tiettyjen Taiwanista tuotavien raudasta tai teräksestä valmistettujen putkien
    liitos- ja muiden osien tuontia, riippumatta siitä, onko ne ilmoitettu tullille
    Taiwanista peräisin olevina, sekä kolmea taiwanilaista viejää koskevan tutkimuksen
    päättämisestä annetun asetuksen (EY) N:o 763/2000 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 2314/2000 od 17. listopada 2000. o izmjeni Uredbe
    (EZ) br. 763/2000 o proširenju konačne antidampinške pristojbe uvedene Uredbom
    (EZ) br. 584/96 u pogledu uvoza određenih željeznih ili čeličnih armatura
    cijevi podrijetlom iz Narodne Republike Kine na uvoz određenih željeznih ili
    čeličnih armatura cijevi isporučenih s Tajvana, bez obzira na to jesu li prijavljeni
    kao da su podrijetlom s Tajvana ili nisu, i kojom se prekida ispitivanje vezano
    za uvoz od tri tajvanska izvoznika
  type: main
- language: hu
  script: Latn
  content: A Tanács 2314/2000/EK rendelete (2000. október 17.) a Kínai Népköztársaságból
    származó vasból és acélból készült egyes csőszerelvények behozatalára
    az 584/96/EK rendeletben kivetett végleges dömpingellenes vámnak a Tajvanban
    feladott (függetlenül attól, hogy tajvani származásúnak nyilvánították-e),
    vasból vagy acélból készült egyes csőszerelvények behozatalára való kiterjesztéséről,
    továbbá három tajvani exportőrtől történő behozatalra vonatkozó vizsgálat
    megszüntetéséről szóló 763/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2314/2000 del Consiglio, del 17 ottobre 2000, che modifica
    il regolamento (CE) n. 763/2000 che estende il dazio antidumping definitivo istituito
    con regolamento (CE) n. 584/96 sulle importazioni di alcuni accessori per tubi
    di ferro o di acciaio, originari della Repubblica popolare cinese, alle importazioni
    di alcuni accessori per tubi di ferro o di acciaio spediti da Taiwan, indipendentemente
    dal fatto che siano dichiarati originari di Taiwan o meno, e chiude l'inchiesta
    in merito alle importazioni di tre esportatori taiwanesi
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2314/2000 (2000. gada 17. oktobris), ar kuru groza
    Regulu (EK) Nr. 763/2000, ar ko galīgo antidempinga maksājumu, kurš ieviests
    ar Regulu (EK) Nr. 584/96 attiecībā uz dažu Ķīnas Tautas Republikas izcelsmes
    dzelzs vai tērauda cauruļu veidgabalu importu, attiecina arī uz dažu no Taivānas
    nosūtītu cauruļu veidgabalu importu neatkarīgi no tā, vai tie deklarēti
    kā Taivānas izcelsmes vai ne, un izbeidz izmeklēšanu attiecībā uz triju
    Taivānas eksportētāju veikto importu
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 17 d. Tarybos reglamentas (EB) Nr. 2314/2000, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 763/2000, išplečiantį galutinio antidempingo
    muito, taikomo pagal Reglamentą (EB) Nr. 584/96 dėl tam tikrų Kinijos Liaudies
    Respublikos kilmės geležinių ir plieninių vamzdžių arba vamzdelių jungiamųjų
    detalių importo, taikymą tam tikroms iš Taivanio gautoms geležinėms ir plieninėms
    vamzdžių arba vamzdelių jungiamosioms detalėms, neatsižvelgiant į tai, ar
    šios prekės deklaruotos kaip Taivanio kilmės ar ne ir nutraukiantis trijų
    Taivanio eksportuotojų su šių produktų importu susijusį tyrimą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2314/2000 tas-17 ta' Ottubru 2000 li
    jemenda r-Regolament (KE) Nru 763/2000 li jestendi d-dazju ta' kontra d-dumping
    definittiv, impost mir-Regolament (KE) Nru. 584/96 fuq l-importazzjonijiet ta'
    ċerti aċċessorji ta' tubi u pajipijiet, tal-ħadid u ta' l-azzar, illi jkunu
    ġejjin mir-Repubblika Popolari Ciniża għall-importazzjonijiet ta' ċerti aċċessorji
    tat-tubi u tal-pajpijiet, tal-ħadid u ta' l-azzar, illi jkunu ġejjin mit-Tajlandja,
    kemm jekk ikunu dikjarati bħala ġejjin mit-Tajlandja jew le, u sabiex tintemm
    l-investigazzjoni fir-rigward ta' l-importazzjonijiet minn tliet esportaturi Tajlandiżi.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2314/2000 van de Raad van 17 oktober 2000 tot wijziging
    van Verordening (EG) nr. 763/2000 tot uitbreiding van het definitief antidumpingrecht
    dat werd ingesteld bij Verordening (EG) nr. 584/96 op de invoer van bepaalde hulpstukken
    voor buisleidingen, van ijzer of van staal, van oorsprong uit de Volksrepubliek
    China, tot de invoer van bepaalde hulpstukken voor buisleidingen, van ijzer of
    van staal, verzonden uit Taiwan, al dan niet aangegeven als van oorsprong uit
    Taiwan en tot beëindiging van het onderzoek ten aanzien van de invoer van drie
    Taiwanese exporteurs
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2314/2000 z dnia 17 października 2000 r.
    zmieniające rozporządzenie (WE) nr 763/2000 rozszerzające ostateczne cło antydumpingowe,
    nałożone rozporządzeniem (WE) nr 584/96 w sprawie przywozu niektórych kształtek
    rurowych i rur z żelaza lub stali, pochodzących z Chińskiej Republiki Ludowej
    i na przywóz niektórych kształtek rurowych i rur z żelaza lub stali wysyłanych
    z Tajwanu, zgłoszonych jako pochodzące z Tajwanu lub niepochodzące z Tajwanu,
    oraz kończące dochodzenie w odniesieniu do przywozu dokonywanego przez trzech
    eksporterów z Tajwanu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2314/2000 do Conselho, de 17 de Outubro de 2000, que
    altera o Regulamento (CE) n.o 763/2000, que alarga o direito anti-dumping definitivo
    instituído pelo Regulamento (CE) n.o 584/96 sobre as importações de certos
    acessórios para tubos, de ferro ou aço, originários da República Popular da
    China às importações de certos acessórios para tubos, de ferro ou de aço,
    expedidos via Taiwan, declarados como originários de Taiwan ou não, e que encerra
    o inquérito no que se refere às importações provenientes de três exportadores
    de Taiwan
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2314/2000 al Consiliului din 17 octombrie 2000 de
    modificare a Regulamentului (CE) nr. 763/2000 privind extinderea dreptului antidumping
    definitiv instituit prin Regulamentul (CE) nr. 584/96 la importurile anumitor
    accesorii de țevărie din fier sau oțel, originare din Republica Populară Chineză,
    la importurile anumitor accesorii de țevărie din fier sau oțel, expediate din
    Taiwan, indiferent dacă au fost sau nu declarate ca fiind originare din Taiwan
    și de închidere a anchetei privind importurile a trei exportatori taiwanezi
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2314/2000 zo 17. októbra 2000, ktorým sa
    mení a dopĺňa nariadenie (ES) č. 763/2000 o rozšírení konečného antidumpingového
    cla ustanoveného nariadením (ES) č. 584/96 na dovoz určitých armatúr železných
    alebo oceľových rúr a potrubí s pôvodom v Čínskej ľudovej republike, na
    dovoz určitých armatúr železných alebo oceľových rúr a potrubí odoslaných
    z Taiwanu, či už deklarovaných ako tovar s pôvodom na Taiwane, alebo nie,
    a o ukončení vyšetrovania ohľadom dovozu od troch taiwanských vývozcov
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2314/2000 z dne 17. oktobra 2000 o spremembi Uredbe
    (ES) št. 763/2000 o razširitvi dokončnih protidampinških dajatev, uvedenih
    z Uredbo (ES) št. 584/96 na uvoz nekaterih železnih in jeklenih fitingov za
    cevi s poreklom iz Ljudske republike Kitajske, na uvoz nekaterih železnih in
    jeklenih fitingov za cevi, poslanih iz Tajvana in deklariranih, kot da so po poreklu
    iz Tajvana ali ne, in o zaključku preiskave v zvezi z uvozom od treh tajvanskih
    izvoznikov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2314/2000 del Consejo, de 17 de octubre de 2000, que
    modifica el Reglamento (CE) nº 763/2000 por el que se amplía el derecho antidumping
    definitivo impuesto por el Reglamento (CE) nº 584/96 sobre las importaciones
    de determinados accesorios de tubería, de hierro o de acero, originarios de la
    República Popular de China, a las importaciones de determinados accesorios de
    tubería, de hierro o de acero, consignados desde Taiwán, tanto si se declaran
    originarios de Taiwán como si no, y por el que se da por concluida la investigación
    respecto a las importaciones de tres exportadores taiwaneses
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2314/2000 av den 17 oktober 2000 om ändring
    av förordning (EG) nr 763/2000 om utvidgning av den slutgiltiga antidumpningstull
    som genom förordning (EG) nr 584/96 införts på import av vissa rördelar av
    järn eller stål med ursprung i Folkrepubliken Kina till att avse import av vissa
    rördelar av järn eller stål som avsänds från Taiwan, oavsett om deras deklarerade
    ursprung är Taiwan eller inte, och om avslutande av undersökningen beträffande
    import från tre exportörer i Taiwan
  type: main
