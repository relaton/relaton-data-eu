    der gemeinschaftlichen und einzelstaatlichen Vorschriften auf dem Weinsektor beauftragten
    Stellen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1439/78 af 19. juni 1978 om direkte samarbejde
