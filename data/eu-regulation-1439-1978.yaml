  script: Latn
  content: Règlement (CEE) n° 1439/78 du Conseil, du 19 juin 1978, relatif à la
    collaboration directe des instances chargées par les États membres du contrôle
    du respect des dispositions communautaires et nationales dans le domaine viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1439/78 des Rates vom 19. Juni 1978 über die unmittelbare
