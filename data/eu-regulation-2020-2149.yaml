title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2149 of 9 December 2020 amending
    Council Regulation (EC) No 2368/2002 implementing the Kimberley Process certification
    scheme for the international trade in rough diamonds, in order to add Italy as
    a Union authority and to take into account the withdrawal of the United Kingdom
    from the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2149 de la Commission du 9 décembre
    2020 modifiant le règlement (CE) no 2368/2002 du Conseil mettant en œuvre le
    système de certification du processus de Kimberley pour le commerce international
    des diamants bruts, afin d’ajouter l’Italie en tant qu’autorité de l’Union
    et de tenir compte du retrait du Royaume-Uni de l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/2149 der Kommission vom 9. Dezember
    2020 zur Änderung der Verordnung (EG) Nr. 2368/2002 des Rates zur Umsetzung des
    Zertifikationssystems des Kimberley-Prozesses für den internationalen Handel
    mit Rohdiamanten zwecks Aufnahme der Unionsbehörde Italiens und Berücksichtigung
    des Austritts des Vereinigten Königreichs aus der Union
  type: main
- language: bg
  script: Cyrl
