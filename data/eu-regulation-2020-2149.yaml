    (ЕО) № 2368/2002 на Съвета относно въвеждане на
    схема за сертифициране в рамките на Кимбърлийския
    процес за международна търговия с необработени
    диаманти, за да бъде добавена Италия като орган
    на Съюза и да бъде взето под внимание оттеглянето
    на Обединеното кралство от Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/2149, ze dne 9. prosince 2020,
    kterým se mění nařízení Rady (ES) č. 2368/2002, kterým se provádí Kimberleyský
    systém certifikace pro mezinárodní obchod se surovými diamanty, s cílem přidat
    Itálii jako orgán Unie a zohlednit vystoupení Spojeného království z Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/2149 af 9. december 2020
