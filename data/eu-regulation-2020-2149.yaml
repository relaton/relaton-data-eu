    való kilépésének figyelembevétele érdekében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/2149 della Commissione del 9 dicembre
    2020 che modifica il regolamento (CE) n. 2368/2002 del Consiglio relativo all’attuazione
    del sistema di certificazione del processo di Kimberley per il commercio internazionale
    di diamanti grezzi al fine di aggiungere l’Italia quale autorità dell’Unione
    e tenere conto del recesso del Regno Unito dall’Unione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/2149 (2020. gada 9. decembris),
