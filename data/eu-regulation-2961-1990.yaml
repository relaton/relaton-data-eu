title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2961/90 of 12 October 1990 fixing, for the
    1989/90 marketing year, the amount to be paid by the sugar manufacturers to the
    beet sellers in respect of the difference between the maximum amount of the B
    levy and the amount of that levy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2961/90 de la Commission, du 12 octobre 1990, fixant,
    pour la campagne de commercialisation 1989/1990, le montant à payer par les fabricants
    de sucre aux vendeurs de betteraves en raison de la différence entre le montant
    maximal de la cotisation B et le montant de cette cotisation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2961/90 DER KOMMISSION VOM 12. OKTOBER 1990 ZUR
    FESTLEGUNG FUER DAS WIRTSCHAFTSJAHR 1989/90 DES BETRAGES, DEN DIE ZUCKERHERSTELLER
    DEN RUEBENVERKAEUFERN ALS UNTERSCHIED ZWISCHEN DEM HOECHSTBETRAG DER B-ABGABE
    UND DEM BETRAG DIESER ABGABE ZU ZAHLEN HABEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2961/90 af 12. oktober 1990 om fastsættelse
    for produktionsåret 1989/90 af det beløb, som sukkerfabrikanterne skal betale
    sælgere af sukkerrør som følge af forskellen mellem det maksimale b-afgiftsbeløb
    og det faktiske afgiftsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2961/90 της Επιτροπής
