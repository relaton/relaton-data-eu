    την περίοδο εμπορίας 1989/90, του ποσού που θα
    πληρωθεί από τους βιομηχάνους ζάχαρης στους
    πωλητές ζαχαροτεύτλων λόγω της διαφοράς μεταξύ
    του μέγιστου ποσού της εισφοράς Β και του ποσού
    της εισφοράς αυτής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2961/90 DELLA COMMISSIONE, DEL 12 OTTOBRE 1990,
