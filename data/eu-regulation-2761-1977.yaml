title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2761/77 of 13 December 1977 amending Regulations
    (EEC) No 1896/73 and (EEC) No 930/77 as regards beef which may be bought into
    intervention, its coefficient as well as its intervention buying-in prices applicable
    from 1 January 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2761/77 de la Commission, du 13 décembre 1977, modifiant
    les règlements (CEE) n° 1896/73 et (CEE) n° 930/77 en ce qui concerne les produits
    pouvant faire l'objet d'achats à l'intervention, leurs coefficients ainsi que
    leurs prix d'achat à partir du 1er janvier 1978 dans le secteur de la viande
    bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2761/77 der Kommission vom 13. Dezember 1977 zur Änderung
    der Verordnungen (EWG) Nr. 1896/73 und (EWG) Nr. 930/77 hinsichtlich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen sein können,
    sowie ihrer Koeffizienten und Ankaufspreise ab 1. Januar 1978
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2761/77 af 13. december 1977 om ændring
    af forordning (EØF) nr. 1896/73 og forordning (EØF) nr. 930/77 for så vidt
    angår de produkter, der kan opkøbes ved intervention, samt deres koefficienter,
    og opkøbspriserne, der gælder fra 1. januar 1978, inden for oksekødsektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2761/77 della Commissione, del 13 dicembre 1977, che
    modifica i regolamenti (CEE) n. 1896/73 e (CEE) n. 930/77 per quanto riguarda
    i prodotti che possono formare oggetto di acquisti all'intervento, i relativi
    coefficienti ed i prezzi d'acquisto a decorrere dal 1 gennaio 1978 nel settore
    delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2761/77 van de Commissie van 13 december 1977 tot
    wijziging van de Verordeningen (EEG) nr. 1896/73 en (EEG) nr. 930/77 met betrekking
    tot de produkten die in de rundvleessector door de interventiebureaus kunnen worden
    aangekocht en de daarvoor geldende coëfficiënten en aankoopprijzen met ingang
    van 1 januari 1978
  type: main
