    contrôle de la présence de certains produits dans le lait écrémé en poudre
    mis en oeuvre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 356/80 der Kommission vom 14. Februar 1980 zur Abweichung
    von einigen Bestimmungen der Verordnung (EWG) Nr. 1725/79 bezüglich der Kontrolle
    des verwendeten Magermilchpulvers auf die Anwesenheit bestimmter Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 356/80 af 14. februar 1980 om undtagelse
    fra visse bestemmelser i forordning (EØF) nr. 1725/79 for så vidt angår kontrol
    af, om skummetmælkspulver, der er taget i brug, indeholder visse produkter
  type: main
