  content: Commission Regulation (EEC) No 356/80 of 14 February 1980 derogating from
    certain provisions of Regulation (EEC) No 1725/79 as regards checking as to the
    presence of certain products in the skimmed-milk powder used
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 356/80 de la Commission, du 14 février 1980, dérogeant
