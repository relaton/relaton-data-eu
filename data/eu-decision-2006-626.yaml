    pateikiama pagrindinių sprendimo nuostatų santrauka, tačiau galioja visos šio
    sprendimo nuostatos (pranešta dokumentu Nr. C(2006) 412)'
  type: main
- language: nl
  script: Latn
  content: '2006/626/Euratom: Besluit van de Commissie van 15 februari 2006 overeenkomstig
    artikel 83 van het Verdrag tot oprichting van de Europese Gemeenschap voor Atoomenergie.
    Hierna zijn de belangrijkste bepalingen van dit besluit uiteengezet, onverminderd
    de volledige uitwerking van het besluit zelf (Kennisgeving geschied onder nummer
    C(2006) 412)'
  type: main
- language: pl
  script: Latn
  content: '2006/626/Euratom: Decyzja Komisji z dnia 15 lutego 2006 r. na mocy artykułu
    83 Traktatu ustanawiającego Europejską Wspólnotę Energii Atomowej. Poniżej
    przedstawiono streszczenie podstawowych przepisów tej decyzji, nie naruszając
    pełnego obowiązywania samej decyzji (notyfikowana jako dokument nr C(2006) 412)'
  type: main
- language: pt
  script: Latn
  content: '2006/626/Euratom: Decisão da Comissão, de 15 de Fevereiro de 2006 ,
    estabelecida ao abrigo do artigo 83. o do Tratado que institui a Comunidade Europeia
    da Energia Atómica. Expõem-se em seguida, de forma resumida, as principais disposições
    da decisão, sem prejuízo dos plenos efeitos da própria decisão [notificada
    com o número C(2006) 412]'
  type: main
- language: sk
  script: Latn
  content: '2006/626/Euratom: Rozhodnutie Komisie z 15. februára 2006 podľa článku
    83 Zmluvy o založení Európskeho spoločenstva pre atómovú energiu. Bez toho,
    aby bola dotknutá plná účinnosť samotného rozhodnutia, sa ďalej v texte
    uvádza zhrnutie jeho kľúčových ustanovení [oznámené pod číslom K(2006)
    412]'
  type: main
- language: sl
  script: Latn
  content: '2006/626/Euratom: Odločba Komisije z dne 15. februarja 2006 na podlagi
    člena 83 Pogodbe o ustanovitvi Evropske skupnosti za atomsko energijo. V nadaljevanju
    je povzetek glavnih določb Odločbe, brez vpliva na polni učinek same odločbe
    (notificirano pod dokumentarno številko C(2006) 412)'
  type: main
- language: es
  script: Latn
  content: '2006/626/Euratom: Decisión de la Comisión, de 15 de febrero de 2006
    , de conformidad con lo dispuesto en el artículo 83 del Tratado constitutivo
    de la Comunidad Europea de la Energía Atómica. A continuación figura un resumen
    de las disposiciones principales de dicha Decisión, sin perjuicio del pleno efecto
    de la propia Decisión [notificada con el número C(2006) 412]'
  type: main
- language: sv
  script: Latn
  content: '2006/626/Euratom: Kommissionens beslut av den 15 februari 2006 i enlighet
    med artikel 83 i fördraget om upprättandet av Europeiska atomenergigemenskapen.
    Utan att påverka beslutets fulla verkan ges nedan en sammanfattning av dess viktigaste
    delar [delgivet med nr K(2006) 412]'
