    lēmuma galveno noteikumu kopsavilkums, neskarot paša lēmuma spēkā esību
    pilnā mērā (izziņots ar dokumenta numuru K(2006) 412)'
  type: main
- language: lt
  script: Latn
  content: '2006/626/Euratomas: 2006 m. vasario 15 d. Komisijos sprendimas, remiantis
