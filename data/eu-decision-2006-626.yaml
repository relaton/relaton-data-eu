title:
- language: en
  script: Latn
  content: '2006/626/Euratom: Commission Decision of 15 February 2006 pursuant to
    Article 83 of the Treaty establishing the European Atomic Energy Community. A
    summary of the key provisions of the Decision are set out below, without prejudice
    to the full effect of the Decision itself (notified under document number C(2006)
    412)'
  type: main
- language: fr
  script: Latn
  content: '2006/626/Euratom: Décision de la Commission du 15 février 2006 en application
    de l’article 83 du traité instituant la Communauté européenne de l’énergie
    atomique. Les principales dispositions de cette décision sont résumées ci-dessous,
    sans préjudice du plein effet de la décision elle-même [notifiée sous le numéro
    C(2006) 412]'
  type: main
- language: de
  script: Latn
  content: '2006/626/Euratom: Entscheidung der Kommission vom 15. Februar 2006 gemäß
    Artikel 83 des Vertrags zur Gründung der Europäischen Atomgemeinschaft. Unbeschadet
    der uneingeschränkten Wirkung der Entscheidung werden die zentralen Bestimmungen
    der Entscheidung nachstehend zusammengefasst (Bekannt gegeben unter Aktenzeichen
    K(2006) 412)'
  type: main
- language: cs
  script: Latn
  content: '2006/626/Euratom: Rozhodnutí Komise ze dne 15. února 2006 podle článku
    83 Smlouvy o založení Evropského společenství pro atomovou energii. Souhrn
    klíčových ustanovení rozhodnutí je uveden níže, aniž je dotčena plná
    účinnost vlastního rozhodnutí (oznámeno pod číslem K(2006) 412)'
  type: main
- language: da
  script: Latn
  content: '2006/626/Euratom: Kommissionens beslutning af 15. februar 2006 i overensstemmelse
    med artikel 83 i traktaten om oprettelse af Det Europæiske Atomenergifællesskab.
    I det følgende gives et resumé af beslutningens vigtigste bestemmelser, uden
    at dette har nogen betydning for beslutningens fulde gyldighed (meddelt under
    nummer K(2006) 412)'
  type: main
- language: el
  script: Grek
  content: '2006/626/ΕυͿατόμ: Απόφαση της Επιτροπής, της
    15ης Φεβρουαρίου 2006 , κατ’ εφαρμογή του άρθρου
    83 της συνθήκης για την ίδρυση της Ευρωπαϊκής
    Κοινότητας Ατομικής Ενέργειας. Κατωτέρω παρατίθεται
    περίληψη των βασικών διατάξεων της απόφασης,
    με την επιφύλαξη των πλήρων συνεπειών της ίδιας
    της απόφασης [κοινοποιηθείσα υπό τον αριθμό
    Ε(2006) 412]'
  type: main
- language: et
  script: Latn
  content: '2006/626/Euratom: Komisjoni otsus, 15. veebruar 2006 , vastavalt Euroopa
    Aatomienergiaühenduse asutamislepingu artiklile 83. Alljärgnevalt on esitatud
    otsuse põhisätete kokkuvõte, ilma et see piiraks otsuse täielikku mõju (teatavaks
    tehtud numbri K(2006) 412 all)'
  type: main
- language: fi
  script: Latn
  content: '2006/626/Euratom: Komission päätös, tehty 15 päivänä helmikuuta
    2006 , Euroopan atomienergiayhteisön perustamissopimuksen 83 artiklan nojalla.
    Seuraavassa esitetään päätöksen keskeiset säännökset, sen rajoittamatta
    itse päätöksen koko vaikutusta (tiedoksiannettu numerolla K(2006) 412)'
  type: main
- language: hu
  script: Latn
  content: '2006/626/Euratom: A Bizottság határozata ( 2006. február 15. ) az Európai
    Atomenergia-közösséget létrehozó szerződés 83. cikke alapján. A határozat
    legfontosabb rendelkezéseinek összefoglalása alább következik, a határozat
    teljes érvényének sérelme nélkül (az értesítés a C(2006) 412. számú
    dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2006/626/Euratom: Decisione della Commissione, del 15 febbraio 2006 ,
    sulla base dell’articolo 83 del trattato che istituisce la Comunità europea
    dell’energia atomica. Di seguito sono riportate, in sintesi, le principali disposizioni
    della decisione, senza pregiudizio dei pieni effetti della decisione stessa [notificata
    con il numero C(2006) 412]'
  type: main
- language: lv
  script: Latn
  content: '2006/626/Euratom: Komisijas Lēmums ( 2006. gada 15. februāris ) saskaņā
