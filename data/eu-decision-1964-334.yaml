title:
- language: fr
  script: Latn
  content: Décision 64/334/CEE de la Commission, du 14 mai 1964, relative aux recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/334/EWG: Entscheidung der Kommission vom 14. Mai 1964 betreffend Inanspruchnahme
    des Artikels 115 Absatz (1) EWG durch die Französische Republik, um bestimmte
    aus dritten Ländern stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Erzeugnisse von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/334/CEE: Decisione della Commissione, del 14 maggio 1964, relativa
    ai ricorsi all''articolo 115, primo comma, del Trattato effettuati dalla Repubblica
    francese per escludere dal trattamento comunitario taluni prodotti originari di
    paesi terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/334/EEG: Beschikking van de Commissie van 14 mei 1964 betreffende de
    verzoeken van de Republiek om op grond van artikel 115, eerste alinea, van het
    Verdrag bepaalde produkten, die van oorsprong zijn uit derde landen en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te stuiten'
  type: main
