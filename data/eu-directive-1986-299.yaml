  script: Latn
  content: Neljäs komission direktiivi 86/299/ETY, annettu 3 päivänä kesäkuuta
    1986, suurimmista sallituista haitallisten aineiden ja tuotteiden pitoisuuksista
    rehuissa annetun neuvoston direktiivin 74/63/ETY liitteen muuttamisesta
  type: main
- language: it
  script: Latn
  content: Quarta direttiva 86/299/CEE della Commissione del 3 giugno 1986 che modifica
    l'allegato della direttiva 74/63/CEE del Consiglio relativa alla fissazione di
    quantità massime per le sostanze e per i prodotti indesiderabili negli alimenti
    per gli animali
  type: main
- language: nl
  script: Latn
  content: Vierde Richtlijn 86/299/EEG van de Commissie van 3 juni 1986 houdende wijziging
