title:
- language: en
  script: Latn
  content: '79/991/EEC: Commission Decision of 7 November 1979 authorizing Ireland
    not to apply Community treatment to men''s and boys''under garments, including
    collars, shirt fronts and cuffs: men''s and boys''shirts, woven, of wool, of cotton
    or of man-made textile fibres, falling within subheading 61.03 A of the Common
    Customs Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating in South
    Korea and in free circulation in the other Member States (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/991/CEE: Décision de la Commission, du 7 novembre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les vêtements de dessous (linge
    de corps) pour hommes et garçonnets, y compris les cols, faux cols, plastrons
    et manchettes: chemises et chemisettes tissées, pour hommes et garçonnets, de
    laine, de coton ou de fibres textiles synthétiques ou artificielles de la sous-position
    61.03 A du tarif douanier commun (codes Nimexe: 61.03-11, 15, 19) (catégorie
    8), originaires de Corée du Sud et mis en libre pratique dans les autres Etats
    membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/991/EWG: Entscheidung der Kommission vom 7. November 1979, mit der
    Irland ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung (Leibwäsche) für Männer und Knaben,
    auch Kragen, Vorhemden und Manschetten : Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, für Männer und Knaben, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Tarifstelle 61.03 A des Gemeinsamen Zolltarifs
    (NIMEXE- Kennziffern 61.03-11, 15, 19) (Kategorie 8) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/991/EØF: Kommissionens beslutning af 7. november 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    til mænd og drenge (herunder flipper, skjortebryster og manchetter) : vævede
    skjorter (herunder sports- og arbejdsskjorter) til mænd og drenge, af uld, bomuld
    eller syntetiske eller regenererede fibre, som henhører under pos. 61.03 A i
    den fælles toldtarif (NIMEXE-nummer 61.03-11, 15, 19 ; kategori 8), har oprindelse
    i Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/991/CEE: Decisione della Commissione, del 7 novembre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario sottovesti (biancheria da
    dosso) per uomo e per ragazzo, compresi i colli, colletti, sparati e polsini:
    camicie e camicette, tessute, per uomo e per ragazzo di lana, di cotone, o di
    fibre tessili sintetiche o artificiali della voce 61.03 A della tariffa doganale
    comune (codici Nimexe: 61.03-11, 15, 19), categoria 8, originari della Corea del
    Sud e messi in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/991/EEG: Beschikking van de Commissie van 7 november 1979 waarbij Ierland
    wordt gemachtigd herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen: overhemden en sporthemden, geweven van wol of
    katoen of van synthetische of van kunstmatige textielvezels, van post 61.03 A
    van het gemeenschappelijk douanetarief (NIMEXE- code 61.03-11, 15, 19) (categorie
    8), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
