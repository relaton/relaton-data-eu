title:
- language: en
  script: Latn
  content: '79/595/EEC: Commission Decision of 30 May 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to cotton yarn, not put up for retail sale, falling
    within heading No 55.05 of the Common Customs Tariff (NIMEXE codes 55.05-13, 19,
    21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67, 69, 72, 78, 92,
    98) (category 1), originating in Yugoslavia and in free circulation in the other
    Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/595/CEE: Décision de la Commission, du 30 mai 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les fils de coton non conditionnés pour
    la vente au détail, de la position 55.05 du tarif douanier commun (codes Nimexe:
    55.05-13; 19; 21; 25; 27; 29; 33; 35; 37; 41; 45; 46; 48; 52; 58; 61; 65; 67;
    69; 72; 78; 92; 98) (catégorie 1), originaires de Yougoslavie et mis en libre
    pratique dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/595/EWG: Entscheidung der Kommission vom 30. Mai 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Baumwollgarne, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifnummer 55.05 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 55.05-13;
    19; 21; 25; 27; 29; 33; 35; 37; 41; 45; 46; 48; 52; 58; 61; 65; 67; 69; 72; 78;
    92; 98), Kategorie 1, von der Gemeinschaftsbehandlung auszuschließen (Nur der
    französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/595/EØF: Kommissionens beslutning af 30. maj 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage garn af bomuld, ikke i detailsalgsoplægninger,
    som henhører under pos. 55.05 i den fælles toldtarif (NIMEXE-nummer 55.05-13,
    19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67, 69, 72, 78,
    92, 98; kategori 1), har oprindelse i Jugoslavien og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/595/CEE: Decisione della Commissione, del 30 maggio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario filati di cotone non preparati per la
    vendita al minuto della voce 55.05 della tariffa doganale comune (codice Nimexe:
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) categoria 1, originari della Iugoslavia e messi in libera
    pratica negli altri Stati membri (I testi in lingua francese e olandese sono i
    soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/595/EEG: Beschikking van de Commissie van 30 mei 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd garens van katoen, niet gereed voor de verkoop in het klein, van post
