title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1036/72 of the Council of 18 May 1972 amending, as
    regards tariff nomenclature, Regulation (EEC) Nos 522/70 and 653/71 on the treatment
    to be accorded to products processed from cereals and rice originating in the
    Associated African States and Madagascar or in the Overseas Countries and Territories
    and in the United Republic of Tanzania, the Republic of Uganda and the Republic
    of Kenya
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1036/72 du Conseil, du 18 mai 1972, modifiant, en
    matière de nomenclature tarifaire, les règlements (CEE) n° 522/70 et 653/71
    relatifs aux régimes applicables aux produits transformés à base de céréales
    et de riz originaires des États africains et malgache associés ou des pays et
    territoires d'outre-mer et originaires de la République unie de Tanzanie, de
    la République de l'Ouganda et de la République du Kenya
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1036/72 des Rates vom 18. Mai 1972 zur Änderung -
    hinsichtlich des Zolltarifschemas - der Verordnungen (EWG) Nr. 522/70 und Nr.
    653/71 über die Regelungen für Getreide- und Reisverarbeitungserzeugnisse mit
    Ursprung in den assoziierten afrikanischen Staaten und Madagaskar oder den überseeischen
    Ländern und Gebieten und mit Ursprung in der Vereinigten Republik Tansania, der
    Republik Uganda und der Republik Kenia
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1036/72 af 18. maj 1972 om ændring, med
    hensyn til tarifnomenklaturen, af forordningerne (EØF) nr. 522/70 og 653/71 om
    de ordninger, der skal anvendes på varer, som er forarbejdet på basis af korn
    og ris med oprindelse i de associerede afrikanske stater og Madagascar eller fra
    de oversøiske lande og territorier og med oprindelse i Den forenede Republik
    Tanzania, republikken Uganda og republikken Kenya
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1036/72 del Consiglio, del 18 maggio 1972, che modifica,
    in materia di nomenclatura tariffaria, i regolamenti (CEE) nn. 522/70 e 653/71
    relativi ai regimi applicabili ai prodotti trasformati a base di cereali e di
    riso, originari degli Stati africani e malgascio associati o dei paesi e territori
    d'oltremare ed originari della Repubblica unita di Tanzania, della Repubblica
    dell'Uganda e della Repubblica del Kenya
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1036/72 van de Raad van 18 mei 1972 tot wijziging,
    wat de tariefnomenclatuur betreft, van Verordening (EEG) nr. 522/70 en Verordening
    (EEG) nr. 653/71 betreffende de regelingen voor op basis van granen en rijst verwerkte
    produkten van oorsprong uit de geassocieerde Afrikaanse staten en Madagaskar of
    de landen en gebieden overzee en van oorsprong uit de Verenigde Republiek Tanzania,
    de Republiek Oeganda en de Republiek Kenya
  type: main
