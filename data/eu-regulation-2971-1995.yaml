title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2971/95 of 19 December 1995 amending for
    the fifth time Regulation (EEC) No 3900/92 laying down the special rules of application
    for the Community import arrangements for certain species of preserved tuna, bonito
    and sardines and fixing the quantities of those products which may be imported
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2971/95 de la Commission, du 19 décembre 1995, modifiant
    pour la cinquième fois le règlement (CEE) nº 3900/92 établissant les modalités
    d' application particulières du régime communautaire d' importation de conserves
    de certaines espèces de thon, de bonites et de sardines et fixant les quantités
    de ces produits admises à l' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2971/95 der Kommission vom 19. Dezember 1995 zur fünften
    Änderung der Verordnung (EWG) Nr. 3900/92 mit besonderen Durchführungsbestimmungen
    zu der Einfuhrregelung für bestimmte Thunfisch-, Bonito- und Sardinenkonserven
    und zur Festsetzung der zugelassenen Einfuhrmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2971/95 af 19. december 1995 om femte
    ændring af forordning (EØF) nr. 3900/92 om særlige gennemførelsesbestemmelser
    for Fællesskabets importordning for konserves af visse arter af tunfisk, bonit
    og sardin og om fastsættelse af de mængder af samme produkter, der kan indføres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2971/95 της Επιτροπής,
    της 19ης Δεκεμβρίου 1995, για την τροποποίηση
    για πέμπτη φορά του κανονισμού (ΕΟΚ) αριθ. 3900/92
    που αφορά τη θέσπιση των ειδικών λεπτομερειών
    εφαρμογής του κοινοτικού καθεστώτος εισαγωγής
    κονσερβών ορισμένων ειδών τόνου, παλαμίδας
    και σαρδέλας και για τον καθορισμό των ποσοτήτων
    των εν λόγω προϊόντων που επιτρέπεται να εισαχθούν
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2971/95, annettu 19 päivänä joulukuuta 1995,
    eräiden tonnikala-, boniitti- ja sardiinilajien säilykkeiden yhteisön tuontijärjestelmän
    soveltamisen yksityiskohtaisista erityissäännöistä sekä kyseisten tuotteiden
    sallituista tuontimääristä annetun asetuksen (ETY) N:o 3900/92 muuttamisesta
    viidennen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2971/95 della Commissione, del 19 dicembre 1995, recante
    quinta modifica del regolamento (CEE) n. 3900/92 che stabilisce le modalità particolari
    di applicazione del regime comunitario di importazione per le conserve di talune
    specie di tonno, di palamita e di sardine e che fissa i quantitativi di tali prodotti
    ammessi all' importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2971/95 van de Commissie van 19 december 1995 tot
    vijfde wijziging van Verordening (EEG) nr. 3900/92 houdende uitvoeringsbepalingen
    van de communautaire invoerregeling voor conserven van bepaalde soorten tonijn,
    boniet en sardines, alsmede de hoeveelheden van deze produkten die mogen worden
    ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2971/95 da Comissão, de 19 de Dezembro de 1995, que
    altera pela quinta vez o Regulamento (CEE) nº 3900/92 que estabelece as normas
    de execução específicas do regime comunitário de importação de conservas
    de determinadas espécies de atum, de bonito e de sardinha e fixa as quantidades
    destes produtos admitidas para importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2971/95 de la Comisión, de 19 de diciembre de 1995,
    por el que se modifica por quinta vez el Reglamento (CEE) nº 3900/92 por el que
    se establecen las disposiciones especiales de aplicación del régimen comunitario
    de importación de conservas de determinadas especies de atún, bonito y sardinas
    y por el que se fijan las cantidades de estos productos que se admiten para importación
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2971/95 av den 19 december 1995 om femte
    ändringen av förordning (EEG) nr 3900/92 om särskilda bestämmelser för tillämpningen
    av gemenskapens importordning för vissa arter av konserverad tonfisk, bonit och
    sardiner och fastställande av vilka kvantiteter av dessa produkter som får importeras
  type: main
