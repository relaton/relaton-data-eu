title:
- language: en
  script: Latn
  content: '95/200/EC: Commission Decision of 31 May 1995 approving the single programming
    document for Community structural measures for improving the processing and marketing
    conditions for agricultural products in Bavaria (Federal Republic of Germany),
    in respect of Objective 5a, covering the period between 1994 and 1999 (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/200/CE: Décision de la Commission, du 31 mai 1995, portant approbation
