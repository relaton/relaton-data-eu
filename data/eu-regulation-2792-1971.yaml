  content: Règlement (CEE) n° 2792/71 du Conseil, du 20 décembre 1971, portant
    ouverture, répartition et mode de gestion de contingents tarifaires communautaires
    de fils de coton, non conditionnés pour la vente au détail, et d'autres tissus
    de coton, des positions 55.05 et 55.09 du tarif douanier commun, en provenance
    de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2792/71 des Rates vom 20. Dezember 1971 über die
    Eröffnung, Aufteilung und Verwaltung von Gemeinschaftszollkontingenten für Baumwollgarne,
    nicht in Aufmachungen für den Einzelverkauf, der Tarifnummer 55.05, und andere
    Gewebe aus Baumwolle der Tarifnummer 55.09 des Gemeinsamen Zolltarifs, mit Herkunft
    aus der Türkei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2792/71 del Consiglio, del 20 dicembre 1971, relativo
    all'apertura, alla ripartizione e alle modalità di gestione dei contingenti tariffari
    comunitari di filati di cotone, non preparati per la vendita al minuto, e di altri
    tessuti di cotone, delle voci 55.05 e 55.09 della tariffa doganale comune, in
    provenienza dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2792/71 van de Raad van 20 december 1971 betreffende
    de opening, de verdeling en de wijze van beheer van communautaire tariefcontingenten
    voor garens van katoen, niet gereed voor de verkoop in het klein, en andere weefsels
    van katoen, van de posten 55.05 en 55.09 van het gemeenschappelijk douanetarief,
    van herkomst uit Turkije
