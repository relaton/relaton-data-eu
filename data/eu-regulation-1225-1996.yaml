    (CEE) nº 3013/89 do Conselho, no que respeita à importação e exportação
    de produtos do sector das carnes de ovino e caprino, e que altera o Regulamento
    (CE) nº 3016/95, que abre contingentes pautais comunitários relativos a 1996
    para os ovinos e caprinos e as carnes de ovino e caprino dos códigos NC 0104
    10 30, 0104 10 80, 0104 20 90 e 0204
  type: main
- language: es
  script: Latn
