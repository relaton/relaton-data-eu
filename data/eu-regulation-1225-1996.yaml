    3013/89 des Rates hinsichtlich der Einfuhr und Ausfuhr von Schaf- und Ziegenfleischerzeugnissen
    und zur Änderung der Verordnung (EG) Nr. 3016/95 zur Eröffnung von Gemeinschaftszollkontingenten
