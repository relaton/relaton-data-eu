title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1225/96 of 28 June 1996 derogating from Regulation
    (EC) No 1439/95 laying down detailed rules for the application of Council Regulation
    (EEC) No 3013/89 as regards the import and export of products in the sheepmeat
    and goatmeat sector and amending Regulation (EC) No 3016/95 opening Community
    tariff quotas for 1996 for sheep, goats, sheepmeat and goatmeat falling within
    CN codes 0104 10 30, 0104 10 80, 0104 20 90 and 0204
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1225/96 de la Commission du 28 juin 1996 portant dérogation
    au règlement (CE) nº 1439/95 établissant les modalités d'application du règlement
    (CEE) nº 3013/89 du Conseil en ce qui concerne l'importation et l'exportation
    de produits du secteur des viandes ovine et caprine, et modifiant le règlement
    (CE) nº 3016/95 portant ouverture de contingents tarifaires communautaires pour
    1996 pour les animaux vivants des espèces ovine et caprine et pour la viande
    des animaux des espèces ovine et caprine relevant des codes NC 0104 10 30, 0104
    10 80, 0104 20 90 et 0204
  type: main
- language: de
  script: Latn
