type: standard
title:
- language: en
  script: Latn
  content: 'Commission Decision of 27 June 1978 authorizing Ireland not to apply Community
    treatment to men''s and boys'' outer garments: men''s and boys'' woven suits (including
    coordinate suits consisting of two or three pieces, which are ordered, packed,
    consigned and normally sold together) of wool, of cotton or of man-made textile
    fibres, falling within heading No ex 61.01 (NIMEXE code 61.01-51, 54, 57) of the
    Common Customs Tariff, originating in Hong Kong and in free circulation in the
    other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/576/CEE: Décision de la Commission, du 27 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire les vêtements de dessus pour hommes et
    garçonnets : costumes et complets, tissés (y compris les ensembles qui se composent
    de deux ou trois pièces qui sont commandées, conditionnées, transportées et
    normalement vendues ensemble), de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.01 du Tarif douanier commun (codes Nimexe
    : 61.01-51, 54, 57), originaires de Hong-Kong et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 27. Juni 1978, mit der Irland ermächtigt
    wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberkleidung für Männer und Knaben: Anzüge und Kombinationen, ausgenommen
    Skianzüge, aus Geweben, für Männer und Knaben (einschließlich der aus zwei
    oder drei Teilen bestehenden Kombinationen, die zusammen bestellt, aufgemacht
    und befördert und normalerweise zusammen verkauft werden), aus Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen der Tarifnummer ex 61.01 (NIMEXE-Kennziffern
    61.01-51; 54; 57) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 27. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage yderbeklædningsgenstande til mænd og drenge:
    jakkesæt, vævede, til mænd og drenge, (herunder sæt, der består af to eller
    tre stykker, der bestilles, emballeres, transporteres og normalt sælges sammen),
    af uld, bomuld eller kemofibre, som henhører under pos. ex 61.01 (NIMEXE-kode
    61.01-51, 54, 57) i den fælles toldtarif, har oprindelse i Hongkong og frit kan
    omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 27 giugno 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario indumenti esterni per uomo e per ragazzo:
    vestiti completi, tessuti per uomo e ragazzo (compresi i completi composti di
    due o tre pezzi ordinati, preparati, trasportati e normalmente venduti insieme),
    di lana, di cotone o di fibre tessili sintetiche o artificiali, della voce ex
    61.01 (codice Nimexe: 61.01-51; 54; 57) della tariffa doganale comune, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 27 juni 1978 waarbij Ierland wordt gemachtigd
    herenbovenkleding en jongensbovenkleding: kostuums, geweven, voor heren en jongens
    (daaronder begrepen kostuums welke uit twee of drie delen bestaan, welke gewoonlijk
    te zamen worden besteld, verpakt, vervoerd en verkocht), van wol, van katoen,
    of van synthetische of van kunstmatige textielvezels, van post ex 61.01 van het
    gemeenschappelijk douanetarief (NIMEXE-code 61.01-51, 54, 57), van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
