  content: Council Regulation (EEC) No 501/86 of 25 February 1986 fixing, for 1986,
    the initial quota which may be applied by the Portuguese Republic for certain
    fruit and vegetables coming from the Community as constituted at 31 December 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 501/86 du Conseil du 25 février 1986 fixant, pour
    l' année 1986, le contingent initial pouvant être appliqué par la République
    portugaise pour certains fruits et légumes en provenance de la Communauté dans
    sa composition au 31 décembre 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 501/86 des Rates vom 25. Februar 1986 zur Festsetzung
    des Anfangskontingents für das Jahr 1986, das von der Portugiesischen Republik
    auf bestimmtes Obst und Gemüse aus der Gemeinschaft in ihrer Zusammensetzung
    vom 31. Dezember 1985 angewandt werden kann
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 501/86 af 25. februar 1986 om fastsættelse
    for 1986 af det første kontingent, som republikken Portugal kan anvende for visse
    frugter og grønsager fra Fællesskabet i dets sammensætning pr. 31. december
    1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 501/86 του Συμβουλίου
