    το 1986, της αρχικής ποσόστωσης που μπορεί να
    εφαρμόσει η Πορτογαλική Δημοκρατία για ορισμένα
    οπωροκηπευτικά που προέρχονται από την Κοινότητα,
    στη σύνθεσή της στις 31 Δεκεμβρίου 1985
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 501/86 del Consiglio del 25 febbraio 1986 che fissa,
    per il 1986, il contingente iniziale applicabile dalla Repubblica portoghese per
    taluni ortofrutticoli provenienti dalla Comunità nella sua composizione al 31
    dicembre 1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 501/86 van de Raad van 25 februari 1986 tot vaststelling
