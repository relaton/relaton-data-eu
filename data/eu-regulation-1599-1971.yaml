  content: Regulation (EEC) No 1599/71 of the Council of 20 July 1971 laying down
    additional conditions with which imported wines for direct human consumption have
    to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1599/71 du Conseil, du 20 juillet 1971, fixant des
    conditions supplémentaires auxquelles doivent répondre les vins importés destinés
    à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1599/71 des Rates vom 20. Juli 1971 zur Festsetzung
    zusätzlicher Bedingungen, denen eingeführter Wein, der zum unmittelbaren menschlichen
    Verbrauch bestimmt ist, entsprechen muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1599/71 af 20. juli 1971 om fastsættelse
    af yderligere betingelser, som indført vin, der er bestemt til direkte menneskeligt
    forbrug, skal opfylde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1599/71 del Consiglio, del 20 luglio 1971, che fissa
    le condizioni supplementari cui devono rispondere i vini importati destinati al
    consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1599/71 van de Raad van 20 juli 1971 tot vaststelling
    van nadere voorwaarden waaraan ingevoerde wijn die is bestemd voor rechtstreekse
    menselijke consumptie, moet beantwoorden
  type: main
