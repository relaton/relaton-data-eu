title:
- language: en
  script: Latn
  content: '80/785/EEC: Commission Decision of 17 July 1980 authorizing the French
    Republic not to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats,
    twinsets, cardigans, bed-jackets and jumpers, falling within subheading ex 60.05
    A II of the Common Customs Tariff (category 5), originating in Hong Kong and in
    free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/785/CEE: Décision de la Commission, du 17 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les chandails,
    "pullovers", "twinsets", gilets et vestes de la sous-position ex 60.05 A II du
    tarif douanier commun (catégorie 5), originaires de Hong-kong et mis en libre
    pratique dans les autres Etats membres (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/785/EWG: Entscheidung der Kommission vom 17. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen
    und Strickjacken der Tarifstelle ex 60.05 A II des Gemeinsamen Zolltarifs (Kategorie
    5) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/785/EØF: Kommissionens beslutning af 17. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage cardigans, cardigansæt,
    jumpere, trøjer og veste, som henhører under pos. ex 60.05 A II i den fælles
    toldtarif (kategori 5), har oprindelse i Hongkong og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/785/CEE: Decisione della Commissione, del 17 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario maglie, pullover,
    con o senza maniche, slip-over, twinset, giubbetti e giacche, della sottovoce
    ex 60.05 A II della tariffa doganale comune, categoria 5, originari di Hong Kong
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/785/EEG: Beschikking van de Commissie van 17 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten
    en jasjes van post ex 60.05 A II van het gemeenschappelijk douanetarief (categorie
    5), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
  type: main
