title:
- language: en
  script: Latn
  content: '85/644/EEC: Commission Decision of 23 December 1985 authorizing the Italian
    Republic to extend intra- Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/644/CEE: Décision de la Commission du 23 décembre 1985 autorisant
    la République italienne à proroger les mesures de surveillance intracommunautaires
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres États membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/644/EWG: Entscheidung der Kommission vom 23. Dezember 1985 mit der
    die Italienische Republik zur Verlängerung der innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Bananen ermächtigt wird (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/644/EØF: Kommissionens beslutning af 23. december 1985 om bemyndigelse
    af Den italienske Republik til at forlænge gyldighedsperioden for foranstaltninger
    med henblik på tilsyn inden for Fællesskabet med indførsel af bananer, der
    har oprindelse i visse tredjelande, og som er overgået til fri omsætning i de
    øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/644/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Δεκεμβρίου 1985 για τη χορήγηση άδειας στην Ιταλική
    Δημοκρατία να παρατείνει τα μέτρα ενδοκοινοτικής
    επίβλεψης έναντι των εισαγωγών μπανανών καταγωγής
    ορισμένων τρίτων χωρών, οι οποίες τίθενται
    σε κυκλοφορία στα άλλα κράτη μέλη (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/644/CEE: Decisione della Commissione del 23 dicembre 1985 che autorizza
    la Repubblica italiana a prorogare le misure di sorveglianza intracomunitarie
    delle banane originarie di taluni paesi terzi messi in libera pratica negli altri
    stati membri (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/644/EEG: Beschikking van de Commissie van 23 december 1985 waarbij
    de Italiaanse Republiek wordt gemachtigd de maatregelen inzake intracommunautair
    toezicht ten aanzien van de invoer van bananen van oorsprong uit bepaalde derde
    landen en in de andere Lid-Staten in het vrije verkeer gebracht, te verlengen
    (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '85/644/CEE: Decisión de la Comisión de 23 de diciembre de 1985 por la
    que se autoriza a la República Italiana a prorrogar las medidas de vigilancia
    intracomunitarias respecto a las importaciones de plátanos originarias de terceros
    países y despachadas a libre práctica en los otros Estados miembros (El texto
    en lengua italiana es el único auténtico)'
  type: main
