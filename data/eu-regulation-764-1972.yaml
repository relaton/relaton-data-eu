title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 764/72 de la Commission, du 14 avril 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour hommes et garçonnets, en tissus de coton, de la
    position tarifaire EX 61.01, originaires de la Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2797/71 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 764/72 der Kommission vom 14. April 1972 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberbekleidung
    für Männer und Knaben, aus Baumwolle, der Tarifnummer ex 61.01, mit Ursprung
    in Korea (Süd-), dem die in der Verordnung (EWG) Nr. 2797/71 des Rates vom 20.
    Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 764/72 della Commissione, del 14 aprile 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per uomo e per ragazzo, in tessuti di cotone della voce doganale
    ex 61.01 originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2797/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 764/72 van de Commissie van 14 april 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenbovenkleding en jongensbovenkleding van katoen van post
    ex 61.01, van oorsprong uit Zuid- Korea, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2797/71 van de Raad van 20 december
    1971
  type: main
