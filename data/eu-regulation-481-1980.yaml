title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 481/80 of 27 February 1980 re-establishing
    the levying of customs duties on rubberized textile fabrics, other than rubberized
    knitted or crocheted goods, products of category 103 (code 1030), originating
    in Yugoslavia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 481/80 de la Commission, du 27 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus caoutchoutés,
    autres que de bonneterie, de la catégorie 103 (code 1030), originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 481/80 der Kommission vom 27. Februar 1980 über die
    Wiedereinführung des Zollsatzes für kautschutierte Gewebe, ausgenommen Gewirke,
    der Warenkategorie Nr. 103 (Kennziffer 1030), mit Ursprung in Jugoslawien, dem
    die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 481/80 af 27. februar 1980 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer (bortset fra trikotagestof),
    imprægneret, overtrukket eller lamineret med gummi, under varekategori 103 (kode
    1030), som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 481/80 della Commissione, del 27 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti gommati diversi
    da quelli a maglia, della categoria di prodotti n. 103 (codice 1030), originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 481/80 van de Commissie van 27 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gegummeerde
    weefsels, met uitzondering van gegummeerd brei- en haakwerk, van de categorie
    van produkten nr. 103 (codenummer 1030), van oorsprong uit Joegoslavië waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
