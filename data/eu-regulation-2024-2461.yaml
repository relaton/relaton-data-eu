  content: Commission Implementing Regulation (EU) 2024/2461 of 17 September 2024
    amending Implementing Regulation (EU) 2023/1618 imposing a definitive anti-dumping
    duty on imports of tungsten carbide, fused tungsten carbide and tungsten carbide
    simply mixed with metallic powder originating in the People’s Republic of China,
    and subjecting imports of non-agglomerated tungsten carbides mixed together or
    with metallic binders originating in the People’s Republic of China to surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2461 de la Commission du 17 septembre
    2024 modifiant le règlement d’exécution (UE) 2023/1618 instituant un droit
    antidumping définitif sur les importations de carbure de tungstène, de carbure
    de tungstène fondu et de carbure de tungstène simplement mélangé à de la
    poudre métallique originaires de la République populaire de Chine, et soumettant
    à surveillance les importations de carbures de tungstène non agglomérés mélangés
    entre eux ou avec des liants métalliques originaires de la République populaire
    de Chine
  type: main
