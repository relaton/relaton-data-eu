title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 67/81 of 9 January 1981 on the sale at a
    price fixed in advance of boned beef and veal held by the Irish intervention agency
    and intended for export, and amending Regulation (EEC) No 1687/76 and repealing
    Regulation (EEC) No 2467/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 67/81 de la Commission, du 9 janvier 1981, relatif
    à la vente à prix fixé forfaitairement à l' avance de certaines viandes bovines
    désossées détenues par l' organisme d' intervention irlandais et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76 et abrogeant le
    règlement (CEE) n° 2467/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 67/81 der Kommission vom 9. Januar 1981 über den
    Verkauf von zur Ausfuhr bestimmtem entbeintem Rindfleisch aus Beständen der irischen
    Interventionsstelle zu pauschal im voraus festgesetzten Preisen und zur Änderung
    der Verordnung (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG) Nr. 2467/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 67/81 af 9. januar 1981 om salg til
    forudfastsat pris med henblik på udførsel af visse former for udbenet oksekød
    fra det irske interventionsorgan, om ændring af forordning (EØF) nr. 1687/76
    og om ophævelse af forordning (EØF) nr. 2467/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 67/81 τής Επιτροπής
    τής 9ης Ιανουαρίου 1981 περί τής πωλήσεως, σέ
    προκαθορισμένη, κατ αποκοπή τιμή, ορισμένων
    αποστεωμένων κρεάτων βοοειδών πού ευρίσκονται
