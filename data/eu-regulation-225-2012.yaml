  script: Latn
  content: Komission asetus (EU) N:o 225/2012, annettu 15 päivänä maaliskuuta 2012
    , Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 183/2005 liitteen II muuttamisesta
    siltä osin kuin on kyse sellaisten laitosten hyväksymisestä, jotka saattavat
    markkinoille rehukäyttöön kasviöljyistä ja sekoiterasvoista saatuja tuotteita,
    sekä öljyjen, rasvojen ja niistä saatujen tuotteiden tuotantoa, varastointia,
    kuljetusta ja dioksiinitutkimuksia koskevista erityisvaatimuksista
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 225/2012 od 15. ožujka 2012. o izmjeni Priloga
    II. Uredbi (EZ) br. 183/2005 Europskog parlamenta i Vijeća u pogledu odobrenja
    objekata koji stavljaju na tržište, za korištenje u hrani za životinje, proizvode
    dobivene iz biljnih ulja i mješavina masti i u pogledu posebnih zahtjeva za proizvodnju,
    skladištenje, prijevoz i testiranje na dioksin ulja, masti i od njih dobivenih
    proizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság 225/2012/EU rendelete ( 2012. március 15. ) a 183/2005/EK
    európai parlamenti és tanácsi rendelet II. mellékletének a növényi olajokból
    és zsírkeverékekből származó, takarmányozás céljára szánt termékeket
    forgalomba hozó létesítmények jóváhagyása és a különleges előírások
    az olajok, zsírok és az ezekből származó termékek termelése, tárolása,
    szállítása és a dioxintartalomra vonatkozó ellenőrzések tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 225/2012 della Commissione, del 15 marzo 2012 , che
    modifica l’allegato II del regolamento (CE) n. 183/2005 del Parlamento europeo
    e del Consiglio per quanto riguarda il riconoscimento degli stabilimenti che immettono
    sul mercato prodotti derivati da oli vegetali e grassi miscelati da utilizzare
    nell’alimentazione degli animali e per quanto riguarda i requisiti specifici
    per la produzione, lo stoccaggio, il trasporto di oli, grassi e prodotti da essi
    derivati e per i relativi test per la diossina
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 225/2012 ( 2012. gada 15. marts ), ar ko groza
    II pielikumu Eiropas Parlamenta un Padomes Regulai (EK) Nr. 183/2005 attiecībā
    uz to uzņēmumu apstiprināšanu, kas laiž tirgū no augu eļļām iegūtus
    produktus un tauku maisījumus izmantošanai barībā, un attiecībā uz īpašām
    prasībām eļļu, tauku un no tiem atvasinātu produktu ražošanai, uzglabāšanai,
    transportēšanai un dioksīna testēšanai
  type: main
- language: lt
  script: Latn
  content: 2012 m. kovo 15 d. Komisijos reglamentas (ES) Nr. 225/2012, kuriuo dėl
    ūkio subjektų, rinkai tiekiančių pašarams skirtus naudoti iš augalinio aliejaus
    gautus produktus ir riebalų mišinius, patvirtinimo ir dėl konkrečių gamybos,
    sandėliavimo, gabenimo ir aliejaus, riebalų bei iš jų gautų produktų dioksinų
    tyrimo reikalavimų iš dalies keičiamas Europos Parlamento ir Tarybos reglamento
    (EB) Nr. 183/2005 II priedas
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 225/2012 tal- 15 ta’ Marzu 2012 li
    jemenda l-Anness II mar-Regolament (KE) Nru 183/2005 tal-Parlament Ewropew u tal-Kunsill
    dwar l-approvazzjoni tal-istabbilimenti li jqiegħdu fis-suq, għall-użu fl-għalf,
    prodotti li ġejjin miż-żjut veġetali u xaħmijiet imħallta u dwar ir-rekwiżiti
    speċifiċi għall-produzzjoni, il-ħażna, it-trasport u l-ittestjar għad-diossina
    taż-żjut, xaħmijiet u prodotti li ġejjin minnhom
  type: main
