title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 225/2012 of 15 March 2012 amending Annex
    II to Regulation (EC) No 183/2005 of the European Parliament and of the Council
    as regards the approval of establishments placing on the market, for feed use,
    products derived from vegetable oils and blended fats and as regards the specific
    requirements for production, storage, transport and dioxin testing of oils, fats
    and products derived thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 225/2012 de la Commission du 15 mars 2012 modifiant
    l’annexe II du règlement (CE) n ° 183/2005 du Parlement européen et du Conseil
    en ce qui concerne l’agrément d’établissements mettant sur le marché, à
    des fins d’alimentation animale, des produits dérivés d’huiles végétales
    et de graisses mélangées et en ce qui concerne les exigences spécifiques de
    production, d’entreposage, de transport et de dépistage de la dioxine des huiles,
    des graisses et des produits dérivés
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 225/2012 der Kommission vom 15. März 2012 zur Änderung
    von Anhang II der Verordnung (EG) Nr. 183/2005 des Europäischen Parlaments und
    des Rates hinsichtlich der Zulassung von Betrieben, die Erzeugnisse aus pflanzlichen
    Ölen und Mischfetten zur Verwendung in Futtermitteln in den Verkehr bringen,
    sowie hinsichtlich der besonderen Anforderungen an die Herstellung, Lagerung,
    Beförderung und Dioxinuntersuchung von Ölen, Fetten und daraus gewonnenen Erzeugnissen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 225/2012 на Комисията от 15
    март 2012 година за изменение на приложение II
    към Регламент (ЕО) № 183/2005 на Европейския парламент
    и на Съвета по отношение на одобряването на
    предприятия, които пускат на пазара за употреба
    като фуражи продукти, получени от растителни
    масла и смесени мазнини, и по отношение на специфичните
    изисквания във връзка с производството, складирането,
    транспорта и проверката за диоксини на масла,
    мазнини и продукти, получени от тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 225/2012 ze dne 15. března 2012 , kterým
    se mění příloha II nařízení Evropského parlamentu a Rady (ES) č. 183/2005,
    pokud jde o schvalování provozů, které uvádějí na trh výrobky získané
    z rostlinných olejů a směsné tuky k použití v krmivech, a pokud jde o zvláštní
    požadavky na výrobu, skladování a přepravu olejů, tuků a výrobků z nich
    získaných a na zkoušení obsahu dioxinů v nich
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 225/2012 af 15. marts 2012 om ændring
    af bilag II til Europa-Parlamentets og Rådets forordning (EF) nr. 183/2005 for
    så vidt angår godkendelse af virksomheder, der til foderbrug markedsfører produkter
    fremstillet af vegetabilske olier og blandede fedtstoffer og for så vidt angår
    de særlige krav vedrørende fremstilling, opbevaring, transport og dioxintestning
    af olier, fedtstoffer og produkter afledt heraf
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 225/2012 της Επιτροπής,
