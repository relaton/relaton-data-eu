  script: Latn
  content: Verordening (EU) nr. 225/2012 van de Commissie van 15 maart 2012 tot wijziging
    van bijlage II bij Verordening (EG) nr. 183/2005 van het Europees Parlement en
    de Raad wat betreft de erkenning van inrichtingen die van plantaardige oliën
    en mengvetten afgeleide producten voor gebruik als diervoeder in de handel brengen
    en wat betreft de specifieke voorschriften voor de productie, de opslag, het vervoer
    en het testen op dioxine van oliën, vetten en daarvan afgeleide producten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 225/2012 z dnia 15 marca 2012 r. zmieniające
    załącznik II do rozporządzenia (WE) nr 183/2005 Parlamentu Europejskiego i
    Rady w odniesieniu do zatwierdzania zakładów wprowadzających do obrotu produkty
    przeznaczone na paszę uzyskane z olejów roślinnych i tłuszczów mieszanych,
    a także w odniesieniu do wymogów szczególnych dotyczących produkcji, przechowywania,
    transportu i badania na obecność dioksyn olejów, tłuszczów oraz uzyskanych
    z nich produktów
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 225/2012 da Comissão, de 15 de março de 2012 ,
    que altera o anexo II do Regulamento (CE) n. ° 183/2005 do Parlamento Europeu
    e do Conselho no que se refere à aprovação de estabelecimentos que colocam
    no mercado, para utilização em alimentos para animais, produtos derivados de
    óleos vegetais e gorduras misturadas e no que se refere aos requisitos específicos
    de produção, armazenamento, transporte e teste às dioxinas de óleos, gorduras
    e produtos derivados
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 225/2012 al Comisiei din 15 martie 2012 de modificare
    a anexei II la Regulamentul (CE) nr. 183/2005 al Parlamentului European și al
    Consiliului în ceea ce privește aprobarea întreprinderilor care introduc pe
    piață, în scopul utilizării ca hrană pentru animale, produse derivate din
    uleiuri vegetale și amestecuri de grăsimi și în ceea ce privește cerințele
    specifice pentru producerea, depozitarea, transportul și testarea nivelului de
    dioxină din uleiuri, grăsimi și produsele derivate ale acestora
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 225/2012 z 15. marca 2012 , ktorým sa mení
    a dopĺňa príloha II k nariadeniu Európskeho parlamentu a Rady (ES) č. 183/2005,
    pokiaľ ide o schvaľovanie prevádzok, ktoré uvádzajú produkty získané z
    rastlinných olejov a zmesových tukov na použitie v krmivách na trh, a pokiaľ
    ide o osobitné požiadavky na výrobu, skladovanie, prepravu olejov, tukov a
    z nich získaných produktov a na ich testovanie na dioxíny
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 225/2012 z dne 15. marca 2012 o spremembi Priloge
    II k Uredbi Evropskega parlamenta in Sveta (ES) št. 183/2005 glede posebnih zahtev
    za odobritev obratov, ki dajejo na trg za uporabo kot krma proizvode, pridobljene
    iz rastlinskih olj in mešanic maščob, v zvezi s proizvodnjo, shranjevanjem,
    prevozom in testiranjem olj, maščob in proizvodov, pridobljenih iz njih, na
    dioksin
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 225/2012 de la Comisión, de 15 de marzo de 2012 ,
    por el que se modifica el anexo II del Reglamento (CE) n ° 183/2005 del Parlamento
    Europeo y del Consejo en lo que atañe a la autorización de los establecimientos
    que comercializan para uso como piensos productos derivados de aceites vegetales
    y grasas mezcladas y en lo referente a los requisitos específicos de la producción,
    almacenamiento, transporte y detección de dioxinas en aceites, grasas y sus productos
    derivados
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 225/2012 av den 15 mars 2012 om ändring
    av bilaga II till Europaparlamentets och rådets förordning (EG) nr 183/2005
    vad gäller godkännande av anläggningar som släpper ut produkter framställda
    av vegetabiliska oljor och blandade fetter på marknaden för användning i foder
    och vad gäller de särskilda krav på produktion, lagring och transport av oljor,
    fetter och produkter framställda därav samt på kontroll av dioxin i dessa
