title:
- language: en
  script: Latn
  content: Council Directive 89/360/EEC of 30 May 1989 amending Directive 64/432/EEC
    as regards administrative areas and a cessation of serological testing for brucellosis
    in certain types of swine
  type: main
- language: fr
  script: Latn
  content: Directive 89/360/CEE du Conseil du 30 mai 1989 modifiant la directive 64/432/CEE
    en ce qui concerne les régions administratives et l'abandon des examens sérologiques
    de dépistage de la brucellose pour certains types de porcs
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/360/EWG des Rates vom 30. Mai 1989 zur Änderung der Richtlinie
    64/432/EWG hinsichtlich der Verwaltungsbezirke und der Einstellung serologischer
    Untersuchungen bestimmter Schweinearten auf Brucellose
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/360/EØF af 30. maj 1989 om ændring af direktiv 64/432/EØF
    for så vidt angår administrative områder og ophør med serologisk undersøgelse
    for brucellose hos visse typer svin
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/360/ΕΟΚ του Συμβουλίου της 30ής Μαΐου
    1989 για την τροποποίηση της οδηγίας 64/432/ΕΟΚ
    όσον αφορά τις διοικητικές περιφέρειες και
    την παύση των ορολογικών εξετάσεων για βρουκέλλωση
    ορισμένων τύπων χοίρων
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/360/ETY, annettu 30 päivänä toukokuuta 1989,
    direktiivin 64/432/ETY muuttamisesta hallinnollisten alueiden ja tietyntyyppisiä
    sikoja koskevan luomistaudin serologisen tutkimuksen lopettamisen osalta
  type: main
- language: it
  script: Latn
  content: Direttiva 89/360/CEE del Consiglio del 30 maggio 1989 che modifica la direttiva
    64/432/CEE per quanto riguarda le zone amministrative e l'abolizione del'esame
    sierologico per la brucellosi per taluni tipi di suini
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/360/EEG van de Raad van 30 mei 1989 tot wijziging van Richtlijn
    64/432/EEG ten aanzien van de administratieve eenheden en de beëindiging van
    het serologisch onderzoek van bepaalde soorten varkens op brucellose
  type: main
- language: pt
  script: Latn
  content: Directiva 89/360/CEE do Conselho de 30 de Maio de 1989 que altera a Directiva
    64/432/CEE, no que diz respeito às áreas administrativas e à cessação de
    testes serologicos à brucelose relativamente a determinados tipos de suínos
  type: main
- language: es
  script: Latn
  content: Directiva 89/360/CEE del Consejo de 30 de mayo de 1989 por la que se modifica
    la Directiva 64/432/CEE, en lo relativo a las regiones administrativas y al cese
    de los exámenes serológicos para la detección de la brucelosis en determinadas
    especies porcinas
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/360/EEG av den 30 maj 1989 om ändring av direktiv
    64/432/EEG vad avser administrativa områden och slopande av serologisk brucellosundersökning
    för vissa typer av svin
  type: main
