    που ορίζεται στο πλαίσιο του συστήματος γενικευμένων
    προτιμήσεων, προκειμένου να ληφθεί υπόψη η
    ιδιαίτερη κατάσταση της Καμπότζης όσον αφορά
    ορισμένα κλωστοϋφαντουργικά προϊόντα που
    εξάγονται από τη χώρα αυτή προς την Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 292/2002, 15. veebruar 2002, millega muudetakse
    määrust (EÜ) nr 1614/2000, millega sätestatakse üldise soodustuste süsteemi
    raames kehtestatud päritolustaatusega toodete määratluse erandid määrusest
    (EMÜ) nr 2454/93, et võtta arvesse Kambodža eriolukorda teatavate tekstiiltoodete
    ühendusse eksportimisel
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 292/2002, annettu 15 päivänä helmikuuta 2002,
    asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
    "alkuperätuotteiden" käsitteen määritelmästä poikkeamisesta Kambodžan erityistilanteen
    huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien tekstiilituotteiden
    osalta annetun asetuksen (EY) N:o 1614/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 292/2002/EK rendelete (2002. február 15.) a bizonyos textiltermékeknek
    a Közösségbe történő kivitelénél Kambodzsa különleges helyzetének figyelembevétele
    érdekében a 2454/93/EGK rendeletben foglalt és az általános preferenciális
    rendszer keretében használt származó termék fogalom meghatározásától
    történő eltérésről szóló 1614/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 292/2002 della Commissione, del 15 febbraio 2002, che
    modifica il regolamento (CE) n. 1614/2000 recante deroga al regolamento (CEE)
    n. 2454/93 per quanto riguarda la definizione della nozione di "prodotti originari"
    stabilita nell'ambito dello schema di preferenze tariffarie generalizzate per
    tener conto della particolare situazione della Cambogia relativamente a determinate
    esportazioni di tessili nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 292/2002 (2002. gada 15. februāris) par grozījumiem
    Regulā (EK) Nr. 1614/2000 par izņēmumiem no Regulas (EEK) Nr. 2454/93 attiecībā
    uz vispārējo preferenču sistēmā izmantojamo noteiktas izcelsmes izstrādājumu
    jēdziena definīciju, ņemot vērā Kambodžas īpašo situāciju attiecībā
    uz atsevišķu tekstilizstrādājumu eksportu uz Kopienu
  type: main
- language: lt
  script: Latn
  content: 2002 m. vasario 15 d. Komisijos reglamentas (EB) Nr. 292/2002, iš dalies
    keičiantis Reglamentą (EB) Nr. 1614/2000, nukrypstantį nuo Reglamento (EEB)
    Nr. 2454/93 produktų kilmės sąvokos apibrėžimo, naudojamo taikant bendrąją
    preferencijų sistemą, atsižvelgiant į ypatingą Kambodžos padėtį dėl tam
    tikro tekstilės eksporto į Bendriją
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 292/2002 tal-15 ta' Frar 2002 li
    jemenda r-Regolament (KE) Nru 1614/2000 li jidderoga mir-Regolament (KEE) Nru
    2454/93 dwar id-definizzjoni tal-kunċett tal-prodotti ta' oriġini użati għall-iskopijiet
    ta' l-iskema tal-preferenzi ġeneralizzati biex jikkunsidraw is-sitwazzjoni speċjali
    tal-Kambodja rigward ċerti esportazzjonijiet tat-tessuti fil-Komunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 292/2002 van de Commissie van 15 februari 2002 tot
    wĳziging van Verordening (EG) nr. 1614/2000 houdende afwĳking van de in Verordening
    (EEG) nr. 2454/93 opgenomen definitie van het begrip "producten van oorsprong"
    in het kader van het stelsel van algemene tariefpreferenties in verband met de
    bĳzondere situatie van Cambodja wat de uitvoer van bepaalde textielproducten
    naar de Gemeenschap betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 292/2002 z dnia 15 lutego 2002 r. zmieniające
    rozporządzenie (WE) nr 1614/2000 wprowadzające odstępstwo od rozporządzenia
    (EWG) nr 2454/93 w odniesieniu do definicji pojęcia produktów pochodzących,
    używanej do celów systemu ogólnych preferencji w celu uwzględnienia szczególnej
    sytuacji Kambodży, dotyczącej wywozu niektórych wyrobów włókienniczych do
    Wspólnoty
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 292/2002 da Comissão, de 15 de Fevereiro de 2002,
    que altera o Regulamento (CE) n.° 1614/2000, que derroga o Regulamento (CEE)
    n.° 2454/93 no que se refere à definição da noção de "produtos originários"
    estabelecida no âmbito do sistema de preferências pautais generalizadas, a fim
    de ter em conta a situação específica do Camboja no que respeita a determinados
    produtos têxteis exportados deste país para a Comunidade
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 292/2002 z 15. februára 2002 o zmene a doplnení
    nariadenia (ES) č. 1614/2000, ktoré deroguje z nariadenia (EHS) č. 2454/93
    s ohľadom na definíciu pojmu pôvodné výrobky používanú na účely programu
    všeobecného systému preferencií, berúc do úvahy osobitnú situáciu Kambodže
    so zreteľom na vývoz textílií do spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije z dne 15. februarja (ES) št. 292/2002 2002 o spremembi
    Uredbe (ES) št. 1614/2000 o odstopanju od Uredbe (EGS) št. 2454/93 glede opredelitve
    pojma izdelki s poreklom, ki se uporablja za namene splošne sheme preferencialov,
    zaradi upoštevanja posebnega položaja Kambodže glede izvoza nekaterih tekstilnih
    izdelkov v Skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 292/2002 de la Comisión, de 15 de febrero de 2002,
    por el que se modifica el Reglamento (CE) n° 1614/2000 por el que se establece
    una excepción al Reglamento (CEE) n° 2454/93 en lo relativo a la definición
    del concepto de "productos originarios" establecido con arreglo al plan de preferencias
    arancelarias generalizadas a fin de tener en cuenta la situación particular de
    Camboya por lo que se refiere a determinados productos textiles exportados de
    este país a la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 292/2002 av den 15 februari 2002 om ändring
    av förordning (EG) nr 1614/2000 om undantag från förordning (EEG) nr 2454/93
    med avseende på definitionen av begreppet "ursprungsvaror" som fastställs inom
    ramen för systemet för allmän förmånsbehandling för att ta hänsyn till
    Kambodjas särskilda situation när det gäller vissa textilprodukter som exporteras
    från detta land till gemenskapen
  type: main
