title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 292/2002 of 15 February 2002 amending Regulation
    (EC) No 1614/2000 derogating from Regulation (EEC) No 2454/93 in respect of the
    definition of the concept of originating products used for the purposes of the
    scheme of generalised preferences to take account of the special situation of
    Cambodia regarding certain exports of textiles to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 292/2002 de la Commission du 15 février 2002 modifiant
    le règlement (CE) n° 1614/2000 portant dérogation au règlement (CEE) n° 2454/93
    en ce qui concerne la définition de la notion de "produits originaires" établie
    dans le cadre du schéma de préférences tarifaires généralisées pour tenir
    compte de la situation particulière du Cambodge en ce qui concerne certains produits
    textiles exportés de ce pays vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 292/2002 der Kommission vom 15. Februar 2002 zur Änderung
    der Verordnung (EG) Nr. 1614/2000 über eine Abweichung von der Bestimmung des
    Begriffs "Ursprungserzeugnisse" in der Verordnung (EWG) Nr. 2454/93 im Rahmen
    des Allgemeinen Präferenzschemas zur Berücksichtigung der besonderen Lage Kambodschas
    bei bestimmten in die Gemeinschaft ausgeführten Textilwaren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 292/2002 ze dne 15. února 2002, kterým se
    mění nařízení (ES) č. 1614/2000, kterým se stanoví odchylka od nařízení
    (EHS) č. 2454/93, pokud jde o definici pojmu původní produkty používanou
    pro účely systému všeobecných celních preferencí s ohledem na zvláštní
    situaci Kambodži v případě některých textilních výrobků vyvážených
    z této země do Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 292/2002 af 15. februar 2002 om ændring
    af forordning (EF) nr. 1614/2000 om en undtagelse fra forordning (EØF) nr. 2454/93
    hvad angår definitionen af begrebet "produkter med oprindelsesstatus" i henhold
    til den generelle præferenceordning for at tage hensyn til den særlige situation
    i Cambodja for visse tekstilvarer, der udføres fra dette land til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 292/2002 της Επιτροπής,
    της 15ης Φεβρουαρίου 2002, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1614/2000 σχετικά με την
    παρέκκλιση από τον κανονισμό (ΕΟΚ) αριθ. 2454/93
