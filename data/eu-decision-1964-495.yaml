title:
- language: fr
  script: Latn
  content: Décision 64/495/CEE de la Commission, du 28 juillet 1964, portant octroi
    d'un contingent tarifaire à la République italienne pour 3000 taureaux, vaches
    et génisses, des races de Schwyz, du Simmental et de Fribourg, autres que ceux
    destinés à la boucherie
  type: main
- language: de
  script: Latn
  content: '64/495/EWG: Entscheidung der Kommission vom 28. Juli 1964 über die Gewährung
    eines Zollkontingents für 3 000 Stück Stiere, Kühe und Färsen der Schwyzer,
    Simmentaler oder Freiburger Rasse, nicht zum Schlachten, an die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '64/495/CEE: Decisione della Commissione, del 28 luglio 1964, relativa
    alla concessione di un contingente tariffario alla Repubblica italiana per 3.000
    capi di bestiame, tori, vacche e giovenche delle razze di Schwyz, di Simmental
    e di Friburgo, esclusi quelli da macello'
  type: main
- language: nl
  script: Latn
  content: '64/495/EEG: Beschikking van de Commissie van 28 juli 1964 houdende toekenning
    van een tariefcontingent aan de Italiaanse Republiek voor 3.000 stuks stieren,
    koeien en vaarzen van het Schwyzer ras, van het Simmentaler ras en van het Freiburger
    ras, niet bestemd voor de slacht'
  type: main
