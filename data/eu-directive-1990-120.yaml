title:
- language: en
  script: Latn
  content: Council Directive 90/120/EEC of 5 March 1990 amending Directive 88/407/EEC
    laying down the animal health requirements applicable to intra-Community trade
    in and imports of deep-frozen semen of domestic animals of the bovine species
  type: main
- language: fr
  script: Latn
  content: Directive 90/120/CEE du Conseil du 5 mars 1990 modifiant la directive 88/407/CEE
    fixant les exigences de police sanitaire applicables aux échanges intracommunautaires
    et aux importations de sperme surgelé d'animaux de l'espèce bovine
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/120/EWG des Rates vom 5. März 1990 zur Änderung der Richtlinie
    88/407/EWG zur Festlegung der tierseuchenrechtlichen Anforderungen an den innergemeinschaftlichen
    Handelsverkehr mit gefrorenem Samen von Rindern und an dessen Einfuhr
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 5. března 1990, kterou se mění směrnice 88/407/EHS
    o veterinárních požadavcích na obchod s hluboce zmrazeným spermatem skotu
    uvnitř Společenství a na jeho dovoz (90/120/EHS)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/120/EØF af 5. marts 1990 om ændring af direktiv 88/407/EØF
    om fastsættelse af de veterinærpolitimæssige krav i forbindelse med handelen
    inden for Fællesskabet med frosset tyresæd og indførsel heraf
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/120/ΕΟΚ του Συμβουλίου της 5ης Μαρτίου
    1990 για την τροποποίηση της οδηγίας 88/407/ΕΟΚ
    για τον καθορισμό των απαιτήσεων υγειονομικού
    ελέγχου που ισχύουν στις ενδοκοινοτικές συναλλαγές
    και στις εισαγωγές κατεψυγμένου σπέρματος
    βοοειδών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 5. märts 1990, millega muudetakse direktiivi 88/407/EMÜ,
    millega sätestatakse koduveiste sügavkülmutatud sperma ühendusesisese kaubanduse
    ja impordi korral kohaldatavad loomatervishoiu nõuded
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/120/ETY, annettu 5 päivänä maaliskuuta 1990,
    eläinten terveyttä koskevista vaatimuksista yhteisön sisäisessä naudansukuisten
    kotieläinten pakastetun siemennesteen kaupassa ja tuonnissa annetun direktiivin
    88/407/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1990. március 5.) a szarvasmarhafajba tartozó háziállatok
    mélyhűtött spermájának Közösségen belüli kereskedelmére és behozatalára
    alkalmazandó állat-egészségügyi követelmények megállapításáról szóló
    88/407/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 90/120/CEE del Consiglio del 5 marzo 1990 recante modifica della
    direttiva 88/407/CEE che stabilisce le esigenze di polizia sanitaria applicabili
    agli scambi intracomunitari e alle importazioni di sperma surgelato di animali
    della specie bovina
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1990. gada 5. marts), ar ko groza Direktīvu 88/407/EEK
    par dzīvnieku veselības prasībām, kas piemērojamas Kopienas iekšējā tirdzniecībā
    ar liellopu sugas mājlopu sasaldētu spermu un tās importam 90/120/EEK
  type: main
- language: lt
  script: Latn
  content: 1990 m. kovo 5 d. Tarybos Direktyva iš dalies keičianti Direktyvą 88/407/EEB,
    nustatančią gyvūnų sveikatos reikalavimus, taikomus Bendrijos vidaus prekybai
    stipriai sušaldyta galvijų sperma bei jos importui
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tal-5 ta’ Marzu 1990 li temenda d-Direttiva
    88/407/KEE li tistabbilixxi l-ħtiġiet tas-saħħa ta’ l-annimali applikabbli
    fil-kummerċ intra-Komunitarju fi u l-importazzjoni ta’ semen iffriżat ta’
    l-annimali domestiċi ta’ l-ispeċi bovini;
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/120/EEG van de Raad van 5 maart 1990 tot wijziging van Richtlijn
    88/407/EEG tot vaststelling van de veterinairrechtelijke voorschriften van toepassing
    op het intracommunautaire handelsverkeer in diepgevroren sperma van runderen en
    de invoer daarvan
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 5 marca 1990 r. zmieniająca dyrektywę 88/407/EWG
    ustanawiającą wymagania dotyczące zdrowia zwierząt stosowane w handlu wewnątrzwspólnotowym
    oraz w przywozie zamrożonego nasienia bydła domowego
  type: main
- language: pt
  script: Latn
  content: Directiva 90/120/CEE do Conselho de 5 de Março de 1990 que altera a Directiva
    88/407/CEE, que fixa as exigências de policia sanitária aplicáveis às trocas
    comerciais intracomunitarias e às importações de sémen congelado de animais
    da espécie bovina
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 5. marca 1990, ktorou sa mení a dopĺňa smernica 88/407/EHS
    stanovujúca požiadavky na zdravotný stav zvierat platné pre obchodovanie v
    rámci spoločenstva s hlboko zmrazenou spermou domáceho hovädzieho dobytka
    a jej dovoz
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 5. marca 1990 o spremembah Direktive 88/407/EGS o
    določitvi zahtev za zdravstveno varstvo živali, ki se uporabljajo pri trgovini
    med državami članicami Evropske skupnosti in uvozu globoko zamrznjenega semena
    domačih živali vrste goveda
  type: main
- language: es
  script: Latn
  content: Directiva 90/120/CEE del Consejo de 5 de marzo de 1990 que modifica la
    Directiva 88/407/CEE por la que se fijan las exigencias de policía sanitaria
    aplicables a los intercambios intracomunitarios y a las importaciones de esperma
    congelado de animales de la especia bovina
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/120/EEG av den 5 mars 1990 om ändring av direktiv
    88/407/EEG om djurhälsokrav som är tillämpliga vid handel inom gemenskapen
    med och import av djupfryst sperma från tamdjur av nötkreatur
