title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2205/80 of 19 August 1980 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2788/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2205/80 de la Commission, du 19 août 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    glutamique et ses sels de la sous-position 29.23 D III du tarif douanier commun,
    originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2788/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2205/80 der Kommission vom 19. August 1980 zur Wiedereinführung
    des Zollsatzes für Glutaminsäure und ihre Salze der Tarifstelle 29.23 D III
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2788/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2205/80 af 19. august 1980 om genindførelse
    af opkrævning af toldafgifter for glutaminsyre samt salte deraf, under pos. 29.23
    D III, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2788/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2205/80 della Commissione, del 19 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acido glutammico
    e suoi sali, della sottovoce 29.23 D III della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2788/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2205/80 van de Commissie van 19 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor glutaminezuur en zouten
    daarvan, van post 29.23 D III, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 2788/79 van de Raad tariefpreferenties werden
    geopend
  type: main
