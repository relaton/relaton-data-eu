title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1603/2002 of 9 September 2002 amending the
    Annex to Commission Regulation (EC) No 1535/2002 of 28 August 2002 derogating
    from Council Regulation (EC) No 1251/1999 establishing a support system for producers
    of certain arable crops, as regards the area payments for certain arable crops
    and the payments for set-aside for the marketing year 2002/03 to producers in
    certain regions of Germany
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1603/2002 de la Commission du 9 septembre 2002 modifiant
    l'annexe du règlement (CE) n° 1535/2002 de la Commission du 28 août 2002 dérogeant
    au règlement (CE) n° 1251/1999 du Conseil, instituant un régime de soutien
    aux producteurs de certaines cultures arables, en ce qui concerne les paiements
    à la surface pour certaines cultures arables et les paiements au titre de gel
    de terre pour la campagne de commercialisation 2002/2003 aux producteurs de certaines
    régions de l'Allemagne
  type: main
- language: de
  script: Latn
