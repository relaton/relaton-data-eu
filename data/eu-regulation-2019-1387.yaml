  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1387 of 1 August 2019 amending
    Regulation (EU) No 965/2012 as regards requirements for aeroplane landing performance
    calculations and the standards for assessing the runway surface conditions, update
    on certain aircraft safety equipment and requirements and operations without holding
    an extended range operational approval
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1387 de la Commission du 1er août 2019
    modifiant le règlement (UE) n° 965/2012 de la Commission en ce qui concerne
    les exigences applicables aux calculs des performances de l'avion à l'atterrissage
    et aux normes pour l'évaluation des conditions de surface de la piste, l'actualisation
    de certains équipements et exigences en matière de sécurité des aéronefs,
    ainsi que les opérations sans agrément d'exploitation long courrier
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1387 der Kommission vom 1. August 2019
    zur Änderung der Verordnung (EU) Nr. 965/2012 im Hinblick auf die Anforderungen
    an die Berechnung der Landeleistung von Flugzeugen und die Standards für die
    Bewertung des Zustands der Pistenoberflächen sowie die Aktualisierung von Sicherheitsausrüstungen
    und Anforderungen für bestimmte Luftfahrzeuge im Flugbetrieb ohne ETOPS-Genehmigung
  type: main
- language: bg
  script: Cyrl
