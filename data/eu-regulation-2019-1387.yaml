    lidmašīnas nosēšanās raksturojumu aprēķiniem un skrejceļa virsmas stāvokļa
    novērtēšanas standartiem, atjauninājumiem, kas attiecas uz konkrētām gaisa
    kuģu drošības ierīcēm un prasībām, kā arī ekspluatāciju bez īpaši
    tālu lidojumu apstiprinājuma
  type: main
