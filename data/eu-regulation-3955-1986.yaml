    1987 anzuwendenden Richtplafonds und Zielmengen und gleichzeitigen Aufhebung der
    Verordnung (EWG) Nr. 610/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3955/86 af 23. december 1986 om fastsættelse
