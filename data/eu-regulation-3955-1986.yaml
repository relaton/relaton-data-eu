    mekanisme for samhandelen i oksekødsektoren, og om ophævelse af forordning (EØF)
    nr. 610/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3955/86 της Επιτροπής
