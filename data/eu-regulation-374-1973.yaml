title:
- language: en
  script: Latn
  content: Regulation (EEC) No 374/73 of the Commission of 31 January 1973 laying
    down the temporary measures to be taken because of Accession relating to the implementation
    of Regulation (EEC) No 1619/68 on marketing standards for eggs in Denmark
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 374/73 de la Commission, du 31 janvier 1973, arrêtant
    les mesures transitoires à prendre du fait de l'adhésion, relatives à l'application
    du règlement (CEE) n° 1619/68 concernant certaines normes de commercialisation
    applicables aux oeufs au Danemark
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 374/73 der Kommission vom 31. Januar 1973 zur Festlegung
    der infolge des Beitritts zu treffenden Übergangsmaßnahmen für die Anwendung
    der Verordnung (EWG) Nr. 1619/68 über Vermarktungsnormen für Eier in Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 374/73 af 31. januar 1973 om overgangsforanstaltninger,
    som skål træffes på grund af tiltrædelsen, angående anvendelsen af forordning
    (EØF) nr. 1619/68 om handelsnormer for æg i Danmark
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 374/73 della Commissione, del 31 gennaio 1973, che
    stabilisce le misure transitorie da adottare a seguito dell'adesione per quanto
    riguarda l'applicazione del regolamento (CEE) n. 1619/68 relativo a talune norme
    di commercializzazione applicabili alle uova in Danimarca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 374/73 van de Commissie van 31 januari 1973 tot vaststelling
    van de ingevolge het Toetredingsverdrag te treffen overgangsmaatregelen met betrekking
    tot de uitvoering van Verordening (EEG) nr. 1619/68 betreffende bepaalde handelsnormen
    voor eieren in Denemarken
  type: main
