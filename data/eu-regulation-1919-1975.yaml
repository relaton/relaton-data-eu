id: EURegulation19191975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1919/75 of the Commission of 25 July 1975 authorizing
    Denmark, the United Kingdom and Ireland to suspend temporarily customs duty on
    certain fats and oils of fish and marine mammals of subheading ex 15.12 B imported
    from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1919/75 de la Commission, du 25 juillet 1975, autorisant
    le Danemark, le Royaume-Uni et l'Irlande à suspendre temporairement le droit
    de douane pour certaines graisses et huiles de poissons et mammifères marins
    de la sous-position tarifaire EX 15.12 B importées en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1919/75 der Kommission vom 25. Juli 1975 zur Ermächtigung
    Dänemarks, des Vereinigten Königreichs und Irlands, die Zollsätze für verschiedene
    Fette und Öle von Fischen und Meeressäugetieren aus anderen Mitgliedstaaten
    der Zolltarifstelle ex 15.12 B vorübergehend auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1919/75 af 25. juli 1975 om bemyndigelse
    til Danmark, Det forenede Kongerige og Irland til midlertidigt at suspendere tolden
    på visse fedstoffer og olier, udvundet af fisk og havpattedyr, henhørende under
    toldposition ex 15.12 B og som indføres fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1919/75 della Commissione, del 25 luglio 1975, che
    autorizza la Danimarca, il Regno Unito e l'Irlanda a sospendere temporaneamente
    i dazi doganali su taluni grassi e oli di pesci e mammiferi marini della sottovoce
    tariffaria ex 15.12 B importati in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1919/75 van de Commissie van 25 juli 1975 waarbij
    Denemarken, het Verenigd Koninkrijk en Ierland worden gemachtigd de douanerechten
    van toepassing op bepaalde oliën en vetten van vis en zeezoogdieren van postonderverdeling
    ex 15.12 B die uit de andere Lid-Staten worden ingevoerd tijdelijk te schorsen
  type: main
