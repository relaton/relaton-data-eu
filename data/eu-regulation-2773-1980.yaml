title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2773/80 of 29 October 1980 determining the
    extent to which applications lodged during the month of October 1980 for the issue
    of import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2773/80 de la Commission, du 29 octobre 1980, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées au mois d' octobre 1980, pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2773/80 der Kommission vom 29. Oktober 1980 über
    den Umfang, in dem den im Monat Oktober 1980 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2773/80 af 29. oktober 1980 om fastsættelse
    af, i hvilken udstrækning anmodningen om udstedelse af importlicens, indgivet
    i oktober 1980 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2773/80 della Commissione, del 29 ottobre 1980, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'
    importazione presentate nel mese di ottobre 1980 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2773/80 van de Commissie van 29 oktober 1980 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in de maand oktober
    1980 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
