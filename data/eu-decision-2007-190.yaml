    за които се допуска финансиране от Европейския
    фонд за регионално развитие в рамките на трансграничните
    и транснационални действия, предвидени по
    цел Европейско териториално сътрудничество
    за периода 2007—2013 г., по отношение на България
    и Румъния (нотифицирано под номер C(2007) 1284)
  type: main
