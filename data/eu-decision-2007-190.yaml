title:
- language: en
  script: Latn
  content: '2007/190/EC: Commission Decision of 26 March 2007 amending Decision 2006/769/EC
    drawing up the list of regions and areas eligible for funding from the European
    Regional Development Fund under the cross-border and transnational strands of
    the European territorial cooperation objective for the period 2007 to 2013 as
    concerns Bulgaria and Romania (notified under document number C(2007) 1284)'
  type: main
- language: fr
  script: Latn
  content: '2007/190/CE: Décision de la Commission du 26 mars 2007 modifiant la décision
    2006/769/CE établissant la liste des régions et des zones éligibles à un financement
    du Fonds européen de développement régional au titre des volets transfrontaliers
    et transnationaux de l’objectif Coopération territoriale européenne pour la
    période 2007-2013 en ce qui concerne la Bulgarie et la Roumanie [notifiée sous
    le numéro C(2007) 1284]'
  type: main
- language: de
  script: Latn
  content: '2007/190/EG: Entscheidung der Kommission vom 26. März 2007 zur Änderung
    der Entscheidung 2006/769/EG zur Erstellung des Verzeichnisses der Regionen und
    Räume, die im Zeitraum 2007—2013 im Rahmen der grenzüberschreitenden und transnationalen
    Ausrichtungen des Ziels Europäische territoriale Zusammenarbeit Anspruch auf
    eine Förderung aus dem Europäischen Fonds für regionale Entwicklung haben,
    zwecks Einbeziehung von Bulgarien und Rumänien (Bekannt gegeben unter Aktenzeichen
    K(2007) 1284)'
  type: main
- language: bg
