- language: en
  script: Latn
  content: Council Decision (EU) 2023/2608 of 9 November 2023 on the position to be
    taken on behalf of the European Union within the Association Committee in Trade
    configuration and within the Association Council established by the Association
    Agreement between the European Union and the European Atomic Energy Community
    and their Member States, of the one part, and Ukraine, of the other part as regards
    the positive assessment of the implementation of phases 1 and 2 as set out in
    Annex XXI-A to the Association Agreement, and the market access linked thereto
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2608 du Conseil du 9 novembre 2023 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité d’association
    dans sa configuration Commerce et au sein du conseil d’association institués
    par l’accord d’association entre l’Union européenne et la Communauté européenne
    de l’énergie atomique et leurs États membres, d’une part, et l’Ukraine,
    d’autre part, en ce qui concerne l’évaluation positive de la mise en œuvre
    des phases 1 et 2 selon les dispositions de l’annexe XXI-A de l’accord d’association
    et l’accès aux marchés qui s’y rapporte
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/2608 des Rates vom 9. November 2023 über den im Namen
    der Europäischen Union im Assoziationsausschuss in der Zusammensetzung Handel
    sowie im Assoziationsrat, eingerichtet durch das Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Ukraine andererseits, in Bezug auf die positive Einschätzung
    der Umsetzung der in Anhang XXI-A des Assoziierungsabkommens genannten Phasen
    1 und 2 und des damit verbundenen Marktzugangs zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
