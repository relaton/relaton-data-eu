  script: Latn
  content: Sklep Sveta (EU) 2023/2608 z dne 9. novembra 2023 o stališču, ki se v
    imenu Evropske unije zastopa v Pridružitvenem odboru v trgovinski sestavi in
    Pridružitvenem svetu, ki sta bila ustanovljena s Sporazumom o pridružitvi med
    Evropsko unijo in Evropsko skupnostjo za atomsko energijo in njunimi državami
    članicami na eni strani ter Ukrajino na drugi strani, glede pozitivne ocene izvedbe
    faz 1 in 2, kot je določeno v Prilogi XXI-A k Sporazumu o pridružitvi, in povezanega
    dostopa do trga
  type: main
