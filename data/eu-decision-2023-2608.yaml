  script: Latn
  content: Decisión (UE) 2023/2608 del Consejo, de 9 de noviembre de 2023, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    de Asociación, en su configuración de Comercio, y en el Consejo de Asociación
    establecidos por el Acuerdo de Asociación entre la Unión Europea y la Comunidad
