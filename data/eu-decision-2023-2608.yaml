  script: Latn
  content: Rozhodnutí Rady (EU) 2023/2608 ze dne 9. listopadu 2023 o postoji, který
    má být jménem Evropské unie zaujat ve Výboru pro přidružení ve složení
    pro obchod a v Radě přidružení zřízené dohodou o přidružení mezi Evropskou
