title:
- language: en
  script: Latn
  content: Council Implementing Decision of 16 February 2010 authorising the Republic
    of Lithuania to extend the application of a measure derogating from Article 193
    of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution du Conseil du 16 février 2010 autorisant la République
    de Lituanie à proroger l’application d’une mesure dérogeant à l’article
    193 de la directive 2006/112/CE relative au système commun de taxe sur la valeur
    ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss des Rates vom 16. Februar 2010 zur Ermächtigung
    der Republik Litauen, eine von Artikel 193 der Richtlinie 2006/112/EG über das
    gemeinsame Mehrwertsteuersystem abweichende Regelung zu verlängern
  type: main
- language: bg
  script: Cyrl
  content: '2010/99/ЕС: Решение за изпълнение на Съвета
    от 16 февруари 2010 година за разрешаване на Република
    Литва да удължи срока на прилагане на мярка
    за дерогация от член 193 от Директива 2006/112/ЕО
    относно общата система на данъка върху добавената
    стойност'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady ze dne 16. února 2010 , kterým se Litevské
    republice povoluje prodloužit účinnost opatření odchylujícího se od článku
    193 směrnice 2006/112/ES o společném systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse af 16. februar 2010 om bemyndigelse af
    Republikken Litauen til at udvide anvendelsen af en foranstaltning, der fraviger
    bestemmelserne i artikel 193 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική Απόφαση του Συμβουλίου, της
    16ης Φεβρουαρίου 2010 , με την οποία επιτρέπεται
    στην Δημοκρατία της Λιθουανίας να παρατείνει
    την εφαρμογή μέτρου παρέκκλισης από το άρθρο
    193 της οδηγίας 2006/112/ΕΚ σχετικά με το κοινό σύστημα
    φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus, 16. veebruar 2010 , millega lubatakse Leedu Vabariigil
    pikendada selle meetme kohaldamist, millega tehakse erand direktiivi 2006/112/EÜ
    (mis käsitleb ühist käibemaksusüsteemi) artiklist 193
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös, annettu 16 päivänä helmikuuta
    2010 , luvan antamisesta Liettuan tasavallalle jatkaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 193 artiklasta poikkeavan toimenpiteen soveltamista
  type: main
- language: hu
  script: Latn
  content: A Tanács végrehajtási határozata ( 2010. február 16. ) a Litván Köztársaságnak
    a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 193.
    cikkétől eltérő intézkedés alkalmazásának kiterjesztésére történő
    felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione del Consiglio, del 16 febbraio 2010 , che autorizza
    la Repubblica di Lituania a prorogare l’applicazione di una misura di deroga
    all’articolo 193 della direttiva 2006/112/CE relativa al sistema comune d’imposta
    sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums ( 2010. gada 16. februāris ), ar ko Lietuvas
    Republikai atļauj pagarināt pasākuma piemērošanu, atkāpjoties no 193. panta
    Direktīvā 2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: 2010 m. vasario 16 d. Tarybos įgyvendinimo sprendimas, leisti Lietuvos
    Respublikai toliau taikyti priemonę, kuria nukrypstama nuo Direktyvos 2006/112/EB
    dėl pridėtinės vertės mokesčio bendros sistemos 193 straipsnio
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill tas- 16 ta’ Frar 2010
    li tawtorizza lir-Repubblika tal-Litwanja biex tapplika miżura ta’ deroga mill-Artikolu
    193 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta’ taxxa fuq il-valur
    miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Raad van 16 februari 2010 waarbij de Republiek
    Litouwen wordt gemachtigd een maatregel te blijven toepassen die afwijkt van artikel
    193 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady z dnia 16 lutego 2010 r. upoważniająca Republikę
    Litewską do przedłużenia stosowania środka stanowiącego odstępstwo od art.
    193 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 16 de Fevereiro de 2010 , que autoriza
    a República da Lituânia a prorrogar a aplicação de uma medida derrogatória
    do artigo 193. o da Directiva 2006/112/CE relativa ao sistema comum do imposto
    sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 16 februarie 2010 privind
    autorizarea Republicii Lituania de a prelungi aplicarea unei măsuri de derogare
    de la dispozițiile articolului 193 din Directiva 2006/112/CE privind sistemul
    comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady zo 16. februára 2010 , ktorým sa Litovskej
    republike povoľuje predĺžiť uplatňovanie opatrenia odchyľujúceho sa od
    článku 193 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta z dne 16. februarja 2010 o dovoljenju Republiki Litvi,
    da še naprej uporablja odstopanje od člena 193 Direktive 2006/112/ES o skupnem
    sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución del Consejo, de 16 de febrero de 2010 , por la
    que se autoriza a la República de Lituania a prorrogar la aplicación de una
    medida de excepción a lo dispuesto en el artículo 193 de la Directiva 2006/112/CE
    relativa al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut av den 16 februari 2010 om bemyndigande för
    Republiken Litauen att förlänga tillämpningen av en åtgärd som avviker från
    artikel 193 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
  type: main
