    refere à prorrogação da derrogação ao Regulamento (CEE) n. ° 2454/93 no
    respeitante à definição da noção de produtos originários para fins do sistema
    de preferências generalizadas, de forma a ter em conta a situação especial
    de Cabo Verde em relação às exportações de certos produtos da pesca para
    a União Europeia
  type: main
