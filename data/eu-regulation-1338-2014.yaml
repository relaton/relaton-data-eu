    439/2011 în ceea ce privește prelungirea unei derogări de la Regulamentul (CEE)
    nr. 2454/93 în ceea ce privește definiția conceptului de „produse originare”
    folosit în cadrul sistemului de preferințe tarifare generalizate, pentru a ține
    seama de situația specială din Capul Verde în ceea ce privește exporturile
    anumitor produse pescărești către Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1338/2014 zo 16. decembra 2014
    , ktorým sa mení vykonávacie nariadenie (EÚ) č. 439/2011, pokiaľ ide o predĺženie
    platnosti výnimky z nariadenia (EHS) č. 2454/93 s ohľadom na vymedzenie pojmu
    pôvodné výrobky používaného na účely systému všeobecných colných preferencií,
    aby sa zohľadnila osobitná situácia Kapverdských ostrovov v súvislosti s
    vývozom určitých rybárskych výrobkov do Európskej únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1338/2014 z dne 16. decembra 2014 o
    spremembi Izvedbene uredbe (EU) št. 439/2011 v zvezi s podaljšanjem odstopanja
    od Uredbe (EGS) št. 2454/93 glede opredelitve pojma „izdelek s poreklom“
    , ki se uporablja za splošno shemo tarifnih preferencialov, z namenom da se upošteva
    posebni položaj Zelenortskih otokov glede izvoza nekaterih ribiških proizvodov
    v Evropsko unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °1338/2014 de la Comisión, de 16 de diciembre
    de 2014 , que modifica el Reglamento de Ejecución (UE) n ° 439/2011 en lo que
    se refiere a una prórroga de la excepción al Reglamento (CEE) n ° 2454/93 en
    lo relativo a la definición de la noción de productos originarios utilizada
    a los efectos del sistema de preferencias arancelarias generalizadas, atendiendo
    a la situación particular de Cabo Verde en lo que respecta a las exportaciones
    de determinados productos de la pesca a la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1338/2014 av den 16 december
    2014 om ändring av genomförandeförordning (EU) nr 439/2011 vad gäller en förlängning
    av undantaget från förordning (EEG) nr 2454/93 med avseende på definitionen
    av begreppet ursprungsprodukter som fastställs inom ramen för systemet för
    allmän förmånsbehandling för att ta hänsyn till Kap Verdes särskilda situation
    när det gäller vissa fiskeriprodukter som exporteras från detta land till Europeiska
    unionen
