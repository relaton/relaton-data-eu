    der Verlängerung einer Abweichung von der Verordnung (EWG) Nr. 2454/93 in Bezug
    auf die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“
    im Rahmen des Schemas allgemeiner Zollpräferenzen zur Berücksichtigung der besonderen
    Lage von Cabo Verde bei bestimmten in die Europäische Union ausgeführten Fischereierzeugnissen
  type: main
