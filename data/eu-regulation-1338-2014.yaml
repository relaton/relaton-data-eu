    alla proroga di una deroga al regolamento (CEE) n. 2454/93 per quanto riguarda
    la definizione della nozione di prodotti originari stabilita nell'ambito del regime
    di preferenze tariffarie generalizzate per tener conto della particolare situazione
    di Capo Verde relativamente all'esportazione di taluni prodotti della pesca nell'Unione
    europea
  type: main
