title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1338/2014 of 16 December 2014
    amending Implementing Regulation (EU) No 439/2011 as regards a prolongation of
    a derogation from Regulation (EEC) No 2454/93 in respect of the definition of
    the concept of originating products used for the purposes of the scheme of generalised
    tariff preferences to take account of the special situation of Cape Verde regarding
    exports of certain fisheries products to the European Union
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n °1338/2014 de la Commission du 16 décembre
    2014 modifiant le règlement d'exécution (UE) n ° 439/2011 en ce qui concerne
    la prolongation d'une dérogation au règlement (CEE) n ° 2454/93 en ce qui concerne
    la définition de la notion de «produits originaires» établie dans le cadre
    du schéma de préférences tarifaires généralisées, en vue de prendre en compte
    la situation particulière du Cap-Vert pour l'exportation de certains produits
    de la pêche vers l'Union européenne
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1338/2014 der Kommission vom 16. Dezember
