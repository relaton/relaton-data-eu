    do przedłużenia odstępstwa od rozporządzenia (EWG) nr 2454/93 w odniesieniu
    do definicji pojęcia produktów pochodzących, używanej do celów ogólnego
    systemu preferencji, w celu uwzględnienia szczególnej sytuacji Republiki Zielonego
