---
id: EURegulation13631995
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1363/95 of 15 June 1995 amending the Regulations
    that fixed, prior to 1 February 1995, certain prices and amounts in the market
    in fruit and vegetables and the market in processed fruit and vegetable products,
    of which the value in ecus was adapted as a consequence of abolishing the corrective
    factor for agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1363/95 de la Commission, du 15 juin 1995, modifiant
    les règlements, dans le secteur des fruits et légumes et dans le secteur des
    produits transformés à base de fruits et légumes, qui ont fixé avant le 1er
    février 1995 certains prix et montants dont les valeurs en écus ont été adaptées
    en raison de la suppression du facteur de correction des taux de conversion agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1363/95 der Kommission vom 15. Juni 1995 zur Änderung
    der im Sektor Obst und Gemüse und im Sektor Verarbeitungserzeugnisse aus Obst
    und Gemüse erlassenen Verordnungen, mit denen vor dem 1. Februar 1995 bestimmte
    Preise und Beträge festgesetzt wurden, deren Ecu-Werte infolge der Abschaffung
    des Berichtigungsfaktors für die landwirtschaftlichen Umrechnungskurse angepaßt
    worden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1363/95 af 15. juni 1995 om ændring
    af de forordninger i sektoren for frugt og grøntsager og i sektoren for forarbejdede
    frugter og grøntsager, der inden den 1. februar 1995 har fastsat visse priser
    og beløb, hvis værdier i ecu er blevet tilpasset som følge af afskaffelsen
    af justeringsfaktoren for landbrugsomregningskurserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1363/95 της Επιτροπής
    της 15ης Ιουνίου 1995 για τροποποίηση των κανονισμών,
    στον τομέα των οπωροκηπευτικών και στον τομέα
    των μεταποιημένων προϊόντων με βάση τα οπωροκηπευτικά,
    που έχουν καθορίσει πριν από την 1η Φεβρουαρίου
    1995 ορισμένες τιμές και ποσά, οι τιμές των οποίων,
    σε Ecu, έχουν προσαρμοσθεί λόγω της καταργήσεως
    του διορθωτικού συντελεστή των γεωργικών ισοτιμιών
    μετατροπής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1363/95, annettu 15 päivänä kesäkuuta 1995,
    ennen 1 päivää helmikuuta 1995 sellaiset tietyt hinnat ja määrät vahvistavien
    asetusten, joiden ecuina ilmoitetut arvot on mukautettu maatalouden muuntokurssien
    korjauskertoimen poistamisen vuoksi, muuttamisesta hedelmä- ja vihannesalalla
    sekä hedelmä- ja vihannesjalostealalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1363/95 della Commissione, del 15 giugno 1995, che
    modifica i regolamenti del settore degli ortofrutticoli freschi e dei prodotti
    trasformati a base di ortofrutticoli, che fissano anteriormente al 1ºfebbraio
    1995 alcuni prezzi e importi i cui valori in ecu sono stati adattati a causa della
    soppressione del fattore di correzione dei tassi di conversione agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1363/95 van de Commissie van 15 juni 1995 tot wijziging
    van de verordeningen in de sector groenten en fruit en de sector verwerkte produkten
    op basis van groenten en fruit, waarbij vóór 1 februari 1995 bepaalde prijzen
    en bedragen zijn vastgesteld waarvan de waarde in ecu is aangepast als gevolg
    van de afschaffing van de correctiefactor voor de landbouwomrekeningskoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1363/95 da Comissão, de 15 de Junho de 1995, que
    altera os regulamentos, no sector das frutas e produtos hortícolas e no sector
    dos produtos transformados à base de frutas e produtos hortícolas, que fixaram,
    antes de 1 de Fevereiro de 1995, determinados preços e montantes cujos valores
    em ecus foram adaptados devido à supressão do factor de correcção das taxas
    de conversão agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1363/95 de la Comisión, de 15 de junio de 1995, por
    el que se modifican los Reglamentos, en los sectores de las frutas y hortalizas
    y de los productos transformados a base de frutas y hortalizas, que fijaron, antes
    del 1 de febrero de 1995, determinados precios e importes cuyos valores en ecus
    han sido adaptados debido a la supresión del factor de corrección de los tipos
    de conversión agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1363/95 av den 15 juni 1995 om ändring
    av de förordningar inom sektorn för frukt och grönsaker och sektorn för bearbetade
    frukt- och grönsaksprodukter som före den 1 februari 1995 har fastställt vissa
    priser och belopp vilkas storlek i ecu har justerats på grund av avskaffandet
    av korrigeringsfaktorn för jordbrukets omräkningskurser
  type: main
