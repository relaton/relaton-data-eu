    sikojen, hevoseläinten, lampaiden, vuohien, tuoreen lihan ja lihavalmisteiden
    tuonnin tehdyn neuvoston päätöksen 79/542/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '93/435/CEE: DECISIONE DELLA COMMISSIONE del 27 luglio 1993 che modifica
