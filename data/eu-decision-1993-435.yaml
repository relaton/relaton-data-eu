title:
- language: en
  script: Latn
  content: '93/435/EEC: Commission Decision of 27 July 1993 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products'
  type: main
- language: fr
  script: Latn
  content: '93/435/CEE: Décision de la Commission du 27 juillet 1993 modifiant la
    décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l''importation des animaux des espèces
    bovine, porcine, des équidés, des ovins et des caprins, des viandes fraîches
    et des produits à base de viande'
  type: main
- language: de
  script: Latn
  content: '93/435/EWG: ENTSCHEIDUNG DER KOMMISSION vom 27. Juli 1993 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen'
  type: main
- language: da
  script: Latn
  content: '93/435/EØF: KOMMISSIONENS BESLUTNING af 27. juli 1993 om ændring af
    Rådets beslutning 79/542/EØF om opstilling af en liste over de tredjelande,
    hvorfra medlemsstaterne tillader indførsel af kvæg, svin, enhovede dyr, får
    og geder samt fersk kød eller kødprodukter'
  type: main
- language: el
  script: Grek
  content: '93/435/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 27ης
    Ιουλίου 1993 που τροποποιεί την απόφαση 79/542/ΕΟΚ
    του Συμβουλίου περί καταρτίσεως πίνακα τρίτων
    χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές ζώων του βοείου και χοιρείου
    είδους, ιπποειδών, αιγοπροβάτων, νωπών κρεάτων
    και προϊόντων με βάση το κρέας'
  type: main
- language: fi
  script: Latn
  content: '93/435/ETY: Komission päätös, tehty 27 päivänä heinäkuuta 1993,
