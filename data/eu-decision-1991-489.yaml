  content: '91/489/EEC: Commission Decision of 4 September 1991 amending Decision
    90/52/EEC authorizing member states temporarily to take additional measures as
    regards Denmark against the dissemination of corynebacterium sepedonicum'
  type: main
- language: fr
  script: Latn
  content: '91/489/CEE: Décision de la Commission, du 4 septembre 1991, modifiant
