title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2849/76 of 25 November 1976 amending Regulation
    (EEC) No 1054/68 determining the list of agencies certifying the admissibility
    to certain tariff headings of certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2849/76 de la Commission, du 25 novembre 1976, modifiant
    le règlement (CEE) n° 1054/68 établissant la liste des organismes émetteurs
    de certificats destinés à permettre l' admission de certains produits laitiers
    en provenance des pays tiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2849/76 der Kommission vom 25. November 1976 zur Änderung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2849/76 af 25. november 1976 om ændring
    af forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse over de organer,
    der er kompetente til at udstede certifikater vedrørende visse fra tredjelande
    indførte mejeriprodukters henførsel under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2849/76 τής Επιτροπής
    τής 25ης Νοεμβρίου 1976 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 1054/68 «περί καθορισμού
    τού καταλόγου τών οργανισμών εκδόσεως πιστοποιητικών
    γιά τήν υπαγωγή ορισμένων γαλακτοκομικών προϊόντων
    προελεύσεως τρίτων χωρών σέ ορισμένες δασμολογικές
    κλάσεις»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2849/76 della Commissione, del 25 novembre 1976, recante
    modifica del regolamento (CEE) n. 1054/68, che stabilisce l' elenco degli organismi
    emittenti dei certificati destinati a permettere l' ammissione in alcune voci
    tariffarie di alcuni prodotti lattiero-caseari in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2849/76 van de Commissie van 25 november 1976 tot
    wijziging van Verordening (EEG) nr. 1054/68 houdende vaststelling van de lijst
    van organisaties voor de afgifte van certificaten ten behoeve van de indeling
    van sommige zuivelprodukten uit derde landen onder bepaalde tariefposten
  type: main
