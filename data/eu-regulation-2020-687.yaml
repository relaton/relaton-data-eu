---
id: EURegulation2020687
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/687 of 17 December 2019 supplementing
    Regulation (EU) 2016/429 of the European Parliament and the Council, as regards
    rules for the prevention and control of certain listed diseases (Text with EEA
    relevance)
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/687 de la Commission du 17 décembre 2019
    complétant le règlement (UE) 2016/429 du Parlement européen et du Conseil en
    ce qui concerne les règles relatives à la prévention de certaines maladies
    répertoriées et à la lutte contre celles-ci (Texte présentant de l’intérêt
    pour l’EEE)
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/687 der Kommission vom 17. Dezember 2019
    zur Ergänzung der Verordnung (EU) 2016/429 des Europäischen Parlaments und des
    Rates hinsichtlich Vorschriften für die Prävention und Bekämpfung bestimmter
    gelisteter Seuchen (Text von Bedeutung für den EWR)
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2020/687 на Комисията
    от 17 декември 2019 година за допълнение на Регламент
    (ЕС) 2016/429 на Европейския парламент и на Съвета
    по отношение на правила за профилактика и контрол
    на някои болести от списъка (текст от значение
    за ЕИП)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2020/687 ze dne 17. prosince
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2016/429,
    pokud jde o pravidla pro prevenci a tlumení určitých nákaz uvedených na seznamu
    (Text s významem pro EHP)
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2020/687 af 17. december 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2016/429
    for så vidt angår regler om forebyggelse og bekæmpelse af visse listeopførte
    sygdomme (EØS-relevant tekst)
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2020/687
    της Επιτροπής, της 17ης Δεκεμβρίου 2019, για τη
    συμπλήρωση του κανονισμού (ΕΕ) 2016/429 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    τους κανόνες για την πρόληψη και τον έλεγχο
    ορισμένων καταγεγραμμένων νόσων (Κείμενο που
    παρουσιάζει ενδιαφέρον για τον ΕΟΧ)
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2020/687, 17. detsember 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2016/429 seoses teatavate
    loetellu kantud taudide ennetamise ja tõrje eeskirjadega (EMPs kohaldatav tekst)
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2020/687, annettu 17 päivänä joulukuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) 2016/429 täydentämisestä
    tiettyjen luetteloitujen tautien ehkäisemistä ja torjuntaa koskevien sääntöjen
    osalta (ETA:n kannalta merkityksellinen teksti)
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/687 оd 17. prosinca 2019. o dopuni
    Uredbe (EU) 2016/429 Europskog parlamenta i Vijeća u pogledu pravila za sprečavanje
    i kontrolu određenih bolesti s popisa (Tekst značajan za EGP)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/687 felhatalmazáson alapuló rendelete (2019. december
    17.) az (EU) 2016/429 európai parlamenti és tanácsi rendeletnek a bizonyos
    jegyzékbe foglalt betegségek megelőzésére és az e betegségekkel szembeni
    védekezésre vonatkozó szabályok tekintetében történő kiegészítéséről
    (EGT-vonatkozású szöveg)
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2020/687 della Commissione, del 17 dicembre 2019,
    che integra il regolamento (UE) 2016/429 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme relative alla prevenzione e al controllo di determinate
    malattie elencate (Testo rilevante ai fini del SEE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2020/687 (2019. gada 17. decembris),
    ar ko attiecībā uz noteikumiem par noteiktu sarakstā norādītu slimību profilaksi
    un kontroli papildina Eiropas Parlamenta un Padomes Regulu (ES) 2016/429 (Dokuments
    attiecas uz EEZ)
  type: main
- language: lt
  script: Latn
  content: 2019 m. gruodžio 17 d. Komisijos deleguotasis reglamentas (ES) 2020/687,
    kuriuo dėl tam tikrų į sąrašą įtrauktų ligų prevencijos ir kontrolės
    taisyklių papildomas Europos Parlamento ir Tarybos reglamentas (ES) 2016/429
    (Tekstas svarbus EEE)
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2020/687 tas-17 ta’ Diċembru
    2019 li jissupplimenta r-Regolament (UE) 2016/429 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tar-regoli għall-prevenzjoni u l-kontroll ta’ ċertu mard elenkat
    (Test b’rilevanza għaż-ŻEE)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2020/687 van de Commissie van 17 december
    2019 tot aanvulling van Verordening (EU) 2016/429 van het Europees Parlement en
    de Raad wat regels voor de preventie en bestrijding van bepaalde in de lijst opgenomen
    ziekten betreft (Voor de EER relevante tekst)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2020/687 z dnia 17 grudnia 2019
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2016/429
    w odniesieniu do przepisów dotyczących zapobiegania niektórym chorobom umieszczonym
    w wykazie oraz ich zwalczania (Tekst mający znaczenie dla EOG)
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2020/687 da Comissão, de 17 de dezembro de 2019,
    que complementa o Regulamento (UE) 2016/429 do Parlamento Europeu e do Conselho
    no que se refere às regras de prevenção e controlo de certas doenças listadas
    (Texto relevante para efeitos do EEE)
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/687 al Comisiei din 17 decembrie 2019 de
    completare a Regulamentului (UE) 2016/429 al Parlamentului European și al Consiliului
    în ceea ce privește normele de prevenire și control al anumitor boli listate
    (Text cu relevanță pentru SEE)
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/687 zo 17. decembra 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2016/429, pokiaľ ide
    o pravidlá prevencie a kontroly určitých chorôb zo zoznamu (Text s významom
    pre EHP)
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/687 z dne 17. decembra 2019 o dopolnitvi
    Uredbe (EU) 2016/429 Evropskega parlamenta in Sveta glede pravil za preprečevanje
    in obvladovanje nekaterih bolezni s seznama (Besedilo velja za EGP)
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2020/687 de la Comisión, de 17 de diciembre de
    2019, por el que se completa el Reglamento (UE) 2016/429 del Parlamento Europeo
    y del Consejo en lo referente a las normas relativas a la prevención y el control
    de determinadas enfermedades de la lista (Texto pertinente a efectos del EEE)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2020/687 av den 17 december 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2016/429 vad
    gäller bestämmelser om förebyggande och bekämpning av förtecknade sjukdomar
    (Text av betydelse för EES)
  type: main
