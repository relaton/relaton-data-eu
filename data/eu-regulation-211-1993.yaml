title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 211/93 of 1 February 1993 amending Regulation
    (EEC) No 3782/88 authorizing Germany and France not to apply in certain areas
    the measures provided for in Regulation (EEC) No 1442/88 on the granting, for
    the 1989/90 to 1995/96 wine years, of permanent abandonment premiums in respect
    of wine-growing areas
  type: main
- language: fr
  script: Latn
