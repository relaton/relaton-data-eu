title:
- language: en
  script: Latn
  content: '2010/333/: Commission Decision of 14 June 2010 amending Decision 2004/211/EC
    as regards the entries for Bahrain and Brazil in the list of third countries and
    parts thereof from which the introduction into the European Union of live equidae
    and semen, ova and embryos of the equine species are authorised (notified under
    document C(2010) 3665)'
  type: main
- language: fr
  script: Latn
  content: '2010/333/: Décision de la Commission du 14 juin 2010 modifiant la décision
    2004/211/CE en ce qui concerne les mentions relatives à Bahreïn et au Brésil
    figurant sur la liste des pays tiers et des parties de ces pays en provenance
    desquels l’introduction dans l’Union européenne d’équidés vivants et
    de sperme, d’ovules et d’embryons de l’espèce équine est autorisée [notifiée
    sous le numéro C(2010) 3665]'
  type: main
- language: de
  script: Latn
  content: '2010/333/: Beschluss der Kommission vom 14. Juni 2010 zur Änderung der
    Entscheidung 2004/211/EG hinsichtlich der Einträge zu Bahrain und Brasilien in
    der Liste von Drittländern und Teilen von Drittländern, aus denen die Mitgliedstaaten
    die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    zulassen (Bekannt gegeben unter Aktenzeichen K(2010) 3665)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/333/ЕС: Решение на Комисията от 14 юни 2010
    година за изменение на Решение 2004/211/ЕО по отношение
    на записите за Бахрейн и Бразилия в списъка
    на трети страни и части от тях, от които е разрешено
    въвеждането в Европейския съюз на живи еднокопитни
    и сперма, яйцеклетки и ембриони от еднокопитни
    (нотифицирано под номер C(2010) 3665)'
  type: main
- language: cs
  script: Latn
  content: '2010/333/: Rozhodnutí Komise ze dne 14. června 2010 , kterým se mění
    rozhodnutí 2004/211/ES, pokud jde o položky týkající se Bahrainu a Brazílie
    v seznamu třetích zemí a jejich částí, ze kterých je povolen vstup živých
    koňovitých a spermatu, vajíček a embryí druhů koňovitých do Evropské
    unie (oznámeno pod číslem K(2010) 3665)'
  type: main
- language: da
  script: Latn
  content: '2010/333/: Kommissionens afgørelse af 14. juni 2010 om ændring af beslutning
    2004/211/EF for så vidt angår oplysningerne om Bahrain og Brasilien i listen
    over tredjelande og dele af tredjelande, hvorfra import til Den Europæiske Union
    af levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien
    er tilladt (meddelt under nummer K(2010) 3665)'
  type: main
- language: el
  script: Grek
