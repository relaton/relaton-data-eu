    történő módosításáról (az értesítés a C(2010) 3665. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2010/333/: Decisione della Commissione, del 14 giugno 2010 , che modifica
    la decisione 2004/211/CE per quanto concerne le voci relative al Bahrein e al
    Brasile figuranti nell’elenco dei paesi terzi e delle parti di paesi terzi da
    cui sono autorizzate le importazioni nell’Unione europea di equidi vivi nonché
    di sperma, ovuli ed embrioni della specie equina [notificata con il numero C(2010)
    3665]'
  type: main
- language: lv
  script: Latn
  content: '2010/333/: Komisijas Lēmums ( 2010. gada 14. jūnijs), ar ko groza Lēmumu
