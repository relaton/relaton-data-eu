    2010 , για την τροποποίηση της απόφασης 2004/211/ΕΚ
    όσον αφορά τις καταχωρίσεις για το Μπαχρέιν
    και τη Βραζιλία στον κατάλογο των τρίτων χωρών
    και των περιοχών τους από τις οποίες επιτρέπονται
    οι εισαγωγές ζώντων ιπποειδών και σπέρματος,
    ωαρίων και εμβρύων ιπποειδών στην Ευρωπαϊκή
    Ένωση [κοινοποιηθείσα υπό τον αριθμό Ε(2010) 3665]'
  type: main
- language: et
  script: Latn
