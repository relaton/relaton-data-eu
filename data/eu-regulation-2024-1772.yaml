    de classificação dos incidentes relacionados com as TIC e das ciberameaças,
    estabelecem limiares de materialidade e especificam os pormenores das notificações
    dos incidentes de caráter severo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/1772 al Comisiei din 13 martie 2024 de completare
    a Regulamentului (UE) 2022/2554 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează criteriile
    de clasificare a incidentelor legate de TIC și a amenințărilor cibernetice,
    stabilesc pragurile de semnificație și detaliile rapoartelor privind incidentele
    majore
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/1772 z 13. marca 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2554, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa bližšie určujú klasifikačné
    kritériá incidentov súvisiacich s IKT a kybernetických hrozieb, stanovujú
    prahové hodnoty významnosti a spresňujú podrobnosti správ o závažných
    incidentoch
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/1772 z dne 13. marca 2024 o dopolnitvi
    Uredbe (EU) 2022/2554 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o določitvi meril za razvrščanje incidentov, povezanih z IKT, in
