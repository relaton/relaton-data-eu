    (ЕС) 2022/2554 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се определят подробно критериите за
    класифициране на инциденти с ИКТ и киберзаплахи,
    праговете на същественост и информацията в
    докладите за съществени инциденти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/1772 ze dne 13. března
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2022/2554,
    pokud jde o regulační technické normy, v nichž jsou upřesněna kritéria
    klasifikace incidentů souvisejících s IKT a kybernetických hrozeb, stanoveny
    prahové hodnoty významnosti a upřesněny údaje v hlášeních závažných
    incidentů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/1772 af 13. marts 2024 om
