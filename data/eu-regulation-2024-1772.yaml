    w odniesieniu do regulacyjnych standardów technicznych określających kryteria
    klasyfikacji incydentów związanych z ICT i cyberzagrożeń, progi istotności
    i szczegółowe informacje dotyczące zgłaszania poważnych incydentów
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/1772 da Comissão, de 13 de março de 2024,
