    incidentih
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/1772 de la Comisión, de 13 de marzo de 2024,
    por el que se completa el Reglamento (UE) 2022/2554 del Parlamento Europeo y del
    Consejo mediante normas técnicas de regulación que especifican los criterios
