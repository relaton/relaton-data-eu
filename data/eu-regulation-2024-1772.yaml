title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/1772 of 13 March 2024 supplementing
    Regulation (EU) 2022/2554 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the criteria for the classification
    of ICT-related incidents and cyber threats, setting out materiality thresholds
    and specifying the details of reports of major incidents
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/1772 de la Commission du 13 mars 2024 complétant
    le règlement (UE) 2022/2554 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les critères de classification des incidents
    liés aux TIC et des cybermenaces, fixant des seuils d’importance significative
    et précisant les détails des rapports d’incidents majeurs
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/1772 der Kommission vom 13. März 2024
    zur Ergänzung der Verordnung (EU) 2022/2554 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der Kriterien
    für die Klassifizierung von IKT-bezogenen Vorfällen und Cyberbedrohungen, der
    Wesentlichkeitsschwellen und der Einzelheiten von Meldungen schwerwiegender Vorfälle
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/1772 на Комисията
