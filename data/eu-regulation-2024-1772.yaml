    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer kriterierne
    for klassificering af IKT-relaterede hændelser og cybertrusler, fastsætter væsentlighedstærskler
    og præciserer de nærmere oplysninger om indberetninger af større hændelser
  type: main
- language: el
  script: Grek
