  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/1772 оd 13. ožujka 2024. o dopuni
    Uredbe (EU) 2022/2554 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuju kriteriji za klasifikaciju IKT incidenata i kiberprijetnji,
    pragovi značajnosti i pojedinosti izvješća o značajnim incidentima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1772 felhatalmazáson alapuló rendelete (2024.
    március 13.) az (EU) 2022/2554 európai parlamenti és tanácsi rendeletnek az
    IKT-vonatkozású események és kiberfenyegetések osztályozására vonatkozó
    kritériumokat, a lényegességi küszöbértékeket és a jelentős eseményekkel
    kapcsolatos bejelentések részleteit meghatározó szabályozástechnikai standardok
    tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/1772 della Commissione, del 13 marzo 2024,
    che integra il regolamento (UE) 2022/2554 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i criteri
    per la classificazione degli incidenti connessi alle TIC e delle minacce informatiche,
    stabiliscono le soglie di rilevanza e specificano i dettagli delle segnalazioni
    di gravi incidenti
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/1772 (2024. gada 13. marts), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2022/2554 papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, kuros precizēti kritēriji ar IKT saistītu
    incidentu un kiberdraudu klasifikācijai, nosakot būtiskuma robežvērtības
    un precizējot sīkāku informāciju, kas ietverama ziņojumos par būtiskiem
    incidentiem
  type: main
- language: lt
  script: Latn
  content: 2024 m. kovo 13 d. Komisijos deleguotasis reglamentas (ES) 2024/1772, kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) 2022/2554 papildomas techniniais
    reguliavimo standartais, kuriais patikslinami su IRT susijusių incidentų ir
    kibernetinių grėsmių klasifikavimo kriterijai, nustatomos reikšmingumo ribos
    ir nurodomi pranešimų apie didelius incidentus duomenys
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/1772 tat-13 ta’ Marzu 2024
    li jissupplimenta r-Regolament (UE) 2022/2554 tal-Parlament Ewropew u tal-Kunsill
