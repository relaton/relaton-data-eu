title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1305 of 26 July 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize Bt11 × MIR162 × 1507 × GA21 and sub-combinations
    Bt11 × MIR162 × 1507, MIR162 × 1507 × GA21 and MIR162 × 1507 pursuant to
    Regulation (EC) No 1829/2003 of the European Parliament and of the Council (notified
    under document C(2019) 5502)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1305 de la Commission du 26 juillet 2019
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié Bt11 × MIR162 × 1507 × GA21 ou les sous-combinaisons Bt11 × MIR162
    × 1507, MIR162 × 1507 × GA21 ou MIR162 × 1507 dudit maïs, consistant en ces
    maïs ou sous-combinaisons ou produits à partir de ceux-ci, en application du
