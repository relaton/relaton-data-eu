title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 103/94 of 20 January 1994 determining the
    extent to which applications lodged in January 1994 for import licences for fresh,
    chilled or frozen beef under the import arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic (CSFR) can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 103/94 de la Commission, du 20 janvier 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvie 1994 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    intérimaires conclus par la Communauté avec la république de Pologne, la république
    de Hongrie et la République fédérative tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 103/94 der Kommission vom 20. Januar 1994 zur Festsetzung
    des Umfangs, in dem die im Januar 1994 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Interimsabkommen zwischen
    der Gemeinschaft und der Republik Polen, der Republik Ungarn und der Tschechischen
    und Slowakischen Föderativen Republik (CSFR) genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 103/94 af 20. januar 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i januar 1994,
    om importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i interimsaftalerne mellem Fællesskabet og Republikken Polen,
    Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 103/94 της Επιτροπής
    της 20ής Ιανουαρίου 1994 περί καθορισμού του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιανουάριο 1994 για τα νωπά, διατηρημένα με
    απλή ψύξη ή κατεψυγμένα βόεια κρέατα στα πλαίσια
    των καθεστώτων εισαγωγής που προβλέπονται
