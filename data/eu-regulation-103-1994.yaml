    de carne de bovino fresca, refrigerada ou congelada, apresentados em Janeiro de
    1994 ao abrigo dos regimes de importação previstos nos acordos provisórios
    concluídos pela Comunidade com a República da Polónia, a República da Hungria
    e a República Federativa Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 103/94 de la Comisión, de 20 de enero de 1994, por el
