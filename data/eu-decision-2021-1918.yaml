title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1918 of 28 October 2021 on the position to be
    adopted, on behalf of the European Union, within the EEA Joint Committee concerning
    the amendment of Protocol 31 on cooperation in specific fields outside the four
    freedoms and of Protocol 37 containing the list provided for in Article 101 to
    the EEA Agreement (Space Programme of the Union)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1918 du Conseil du 28 octobre 2021 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’EEE
    en ce qui concerne une modification du protocole 31 de l’accord EEE concernant
    la coopération dans des secteurs particuliers en dehors des quatre libertés
    et du protocole 37 de l’accord EEE comportant la liste prévue à l’article
    101 (Programme spatial de l’Union)
  type: main
