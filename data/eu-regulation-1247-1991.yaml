title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1247/91 of 13 May 1991 abolishing the corrective
    amount on the import of artichokes into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1247/91 de la Commission, du 13 mai 1991, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix d'artichauts en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1247/91 der Kommission vom 13. Mai 1991 zur Aufhebung
    des bei der Einfuhr von Artischocken aus Spanien (mit Ausnahme der Kanarischen
    Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1247/91 af 13. maj 1991 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af artiskokker
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1247/91 της Επιτροπής
    της 13ης Μαΐου 1991 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, αγγιναρών από την
    Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1247/91 della Commissione, del 13 maggio 1991, che
    sopprime l'importo correttore da riscuotere all'importazione nella Comunità a
    dieci di carciofi in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1247/91 van de Commissie van 13 mei 1991 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van artisjokken
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1247/91 da Comissão, de 13 de Maio de 1991, que
    suprime o montante corrector a cobrar aquando da importação na Comunidade a
    Dez de alcachofras provenientes de Espanha, com excepção das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1247/91 de la Comisión, de 13 de mayo de 1991, por
    el que se suprime el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de alcachofas procedentes de España (excepto las
    Islas Canarias)
  type: main
