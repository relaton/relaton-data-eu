id: EUDecision1974555
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 November 1974 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to gloves protective for all trades falling within heading
    No 42.03 B I of the Common Customs Tariff originating in the People's Republic
    of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/555/CEE de la Commission, du 6 novembre 1974, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les gants de protection pour tous métiers
    en cuir naturel, artificiel ou reconstitué, de la position 42.03 B I du Tarif
    douanier commun, originaires de la République populaire de Chine et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. November 1974, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Volksrepublik China stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schutzhandschuhe für alle Berufe, aus Leder oder
    Kunstleder, der Tarifnummer 42.03 B I des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. november 1974 om bemyndigelse for kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage beskyttelseshandsker til erhvervsmæssig brug (arbejdshandsker), som
    henhører under position 42.03 B I i den fælles toldtarif, har oprindelse i folkerepublikken
    Kina og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 novembre 1974, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i guanti di protezione per qualunque mestiere, della
    voce n. 42.03 B I della tariffa doganale comune, originari della Repubblica popolare
    cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 november 1974 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd werkhandschoenen van leder of kunstleder, van post 42.03 B I van het
    gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
