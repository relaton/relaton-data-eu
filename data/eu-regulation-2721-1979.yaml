title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2721/79 of 3 December 1979 re-establishing
    the levying of customs duties on other butyl alcohols, falling within subheading
    29.04 A III b) and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2721/79 de la Commission, du 3 décembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres alcools
    butyliques de la sous-position 29.04 A III b) du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2721/79 der Kommission vom 3. Dezember 1979 zur Wiedereinführung
    des Zollsatzes für andere Butylalkohole der Tarifstelle 29.04 A III b), mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2721/79 af 3. december 1979 om genindførelse
    af opkrævning af toldafgifter for andre buthylalkoholer, under underposition
    29.04 A III b), som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2721/79 della Commissione, del 3 dicembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli altri alcoli butilici
    della sottovoce 29.04 A III b) della tariffa doganale comune, originari della
    Romania beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2721/79 van de Commissie van 3 december 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere butylalcoholen,
    van post 29.04 A III b), van oorsprong uit Roemenië, ten behoeve waarvan bij
    Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
