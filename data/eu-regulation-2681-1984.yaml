id: EURegulation26811984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2681/84 of 18 September 1984 imposing a
    provisional anti-dumping duty on imports of pentaerythritol originating in Canada
    and accepting an undertaking given in connection with the anti-dumping proceeding
    concerning imports of pentaerythritol originating in Sweden and terminating that
    proceeding
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2681/84 de la Commission du 18 septembre 1984 instituant
    un droit antidumping provisoire sur les importations de pentaérythritol originaires
    du Canada, portant acceptation d' un engagement souscrit dans le cadre de la procédure
    antidumping concernant les importations de pentaérythritol originaires de Suède
    et portant clôture de la procédure
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2681/84 der Kommission vom 18. September 1984 zur
    Einführung eines vorläufigen Antidumpingzolls auf Einfuhren von Pentaerythritol
    mit Ursprung in Kanada und zur Annahme einer Verpflichtung im Rahmen des Antidumpingverfahrens
    betreffend Einfuhren von Pentaerythritol mit Ursprung in Schweden und über die
    Einstellung dieses Verfahrens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2681/84 af 18. september 1984 om indførelse
    af en midlertidig antidumpingtold på importen af pentaerythritol med oprindelse
    i Canada og om godtagelse af et tilsagn i forbindelse med antidumpingproceduren
    vedrørende importen af pentaerythritol med oprindelse i Sverige og afslutning
    af denne procedure
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2681/84 της Επιτροπής
    της 18ης Σεπτεμβρίου 1984 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές πενταερυθριτόλης
    καταγωγής Καναδά και για την αποδοχή της ανάληψης
    υποχρεώσεων που έχει προταθεί όσον αφορά τη
    διαδικασία αντιντάμπινγκ σχετικά με τις εισαγωγές
    πενταερυθριτόλης καταγωγής Σουηδίας και για
    την περάτωση της διαδικασίας αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2681/84 della Commissione del 18 settembre 1984 che
    istituisce un dazio antidumping provvisorio sulle importazioni di pentaeritritolo
    originario del Canada, accetta un impegno offerto nell' ambito della procedura
    antidumping relativa alle importazioni dello stesso prodotto originario della
    Svezia e conclude tale procedura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2681/84 van de Commissie van 18 september 1984 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van pentaërythritol
    van oorsprong uit Canada, aanvaarding van een verbintenis in verband met de anti-dumpingprocedure
    betreffende de invoer van pentaërythritol van oorsprong uit Zweden en tot beëindiging
    van die procedure
  type: main
