title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3239/92 of 4 November 1992 laying down rates
    of compensatory interest applicable during the first half of 1993 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3239/92 de la Commission, du 4 november 1992, fixant
    les taux d' intérêt compensatoires applicables en cas de naissance d' une dette
    douanière relative aux produits compensateurs ou aux marchandises en l' état
    (régime du perfectionnement actif) pendant le premier semestre de 1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3239/92 der Kommission vom 4. November 1992 mit Sätzen
    von Ausgleichszinsen, die im ersten Halbjahr 1993 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr)
    anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3239/92 af 4. november 1992 fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling) i første
    halvår af 1993
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3239/92 της Επιτροπής
    της 4ης Νοεμβρίου 1992 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή τα εμπορεύματα στην ίδια κατάσταση
    (καθεστώς τελειοποίησης προς επανεξαγωγή)
    κατά τη διάρκεια του πρώτου εξαμήνου 1993
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3239/92 della Commissione, del 4 novembre 1992, che
    determina i tassi di interesse compensatori applicabili ove sorga un' obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo) nel primo semestre 1993
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3239/92 van de Commissie van 4 november 1992 tot
    vaststelling van de jaarlijkse intrestpercentages van toepassing in geval van
    het ontstaan van een douaneschuld voor veredelingsprodukten of onveredelde goederen
    (regeling actieve veredeling) tijdens het eerste semester 1993
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3239 da Comissão, de 4 de Novembro de 1992, que
