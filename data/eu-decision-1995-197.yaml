    που επιβλήθηκαν στις εισαγωγές ορισμένων τύπων
    ηλεκτρονικών μικροκυκλωμάτων γνωστών ως DRAM
    (δυναμικές μνήμες τυχαίας προσπέλασης), καταγωγής
    Ιαπωνίας και Δημοκρατίας της Κορέας'
  type: main
- language: fi
  script: Latn
  content: '95/197/EY: Komission päätös, tehty 8 päivänä kesäkuuta 1995, tietyntyyppisten
