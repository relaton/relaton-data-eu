title:
- language: en
  script: Latn
  content: '95/197/EC: Commission Decision of 8 June 1995 suspending the definitive
    anti-dumping duties imposed on imports of certain types of electronic microcircuits
    known as DRAMs (dynamic random access memories) originating in Japan and in the
    Republic of Korea'
  type: main
- language: fr
  script: Latn
  content: '95/197/CE: Décision de la Commission, du 8 juin 1995, portant suspension
    des droits antidumping définitifs institués sur les importations de certains
    types de microcircuits électroniques, dits «DRAM», originaires du Japon et
    de la République de Corée'
  type: main
- language: de
  script: Latn
  content: '95/197/EG: Beschluß der Kommission vom 8. Juni 1995 über die Aussetzung
    der endgültigen Antidumpingzölle auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, sogenannter DRAMs (dynamische Schreib-Lesespeicher), mit Ursprung
    in Japan und der Republik Korea'
  type: main
- language: da
  script: Latn
  content: '95/197/EF: Kommissionens afgørelse af 8. juni 1995 om suspension af den
    endelige antidumpingtold på importen af visse typer elektroniske mikrokredsløb,
    såkaldte DRAMs (Dynamic Random Access Memories) med oprindelse i Japan og Republikken
    Korea'
  type: main
- language: el
  script: Grek
  content: '95/197/ΕΚ: Απόφαση της Επιτροπής της 8ης Ιουνίου
