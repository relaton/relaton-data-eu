title:
- language: en
  script: Latn
  content: '2014/523/EU: Commission Implementing Decision of 4 August 2014 amending
    Annex I to Decision 2004/211/EC as regards the entry for Kuwait in the list of
    third countries and parts thereof from which the importation into the Union of
    live equidae and semen, ova and embryos of the equine species is authorised (notified
    under document C(2014) 5440)'
  type: main
- language: fr
  script: Latn
  content: '2014/523/UE: Décision d''exécution de la Commission du 4 août 2014
    modifiant l''annexe I de la décision 2004/211/CE en ce qui concerne la mention
    relative au Koweït figurant sur la liste des pays tiers et des parties de ces
    pays en provenance desquels les importations dans l''Union européenne d''équidés
    vivants et de sperme, d''ovules et d''embryons de l''espèce équine sont autorisées
    [notifiée sous le numéro C(2014) 5440]'
  type: main
- language: de
  script: Latn
  content: '2014/523/EU: Durchführungsbeschluss der Kommission vom 4. August 2014
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags
    zu Kuwait in der Liste von Drittländern und Teilen von Drittländern, aus denen
    die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    in die Europäische Union zugelassen ist (Bekanntgegeben unter Aktenzeichen C(2014)
    5440)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/523/ЕС: Решение за изпълнение на Комисията
    от 4 август 2014 година за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Кувейт в списъка на третите страни и части
    от тях, от които е разрешен вносът в Съюза на
    живи еднокопитни и на сперма, яйцеклетки и
    ембриони от еднокопитни (нотифицирано под
    номер С(2014) 5440)'
  type: main
- language: cs
  script: Latn
  content: '2014/523/EU: Prováděcí rozhodnutí Komise ze dne 4. srpna 2014 , kterým
    se mění příloha I rozhodnutí 2004/211/ES, pokud jde o položku týkající
    se Kuvajtu v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz živých koňovitých a spermatu, vajíček a embryí druhů koňovitých
    do Unie (oznámeno pod číslem C(2014) 5440)'
  type: main
- language: da
  script: Latn
  content: '2014/523/EU: Kommissionens gennemførelsesafgørelse af 4. august 2014
    om ændring af bilag I til beslutning 2004/211/EF for så vidt angår oplysningerne
    om Kuwait i listen over tredjelande og dele af tredjelande, hvorfra import til
    Unionen af levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af
    hestefamilien er tilladt (meddelt under nummer C(2014) 5440)'
  type: main
- language: el
  script: Grek
  content: '2014/523/EE: Εκτελεστική απόφαση της Επιτροπής,
    της 4ης Αυγούστου 2014 , για την τροποποίηση του
    παραρτήματος I της απόφασης 2004/211/ΕΚ όσον αφορά
    την καταχώριση που αφορά το Κουβέιτ στον κατάλογο
    των τρίτων χωρών και των περιοχών τους από
    τις οποίες επιτρέπονται οι εισαγωγές ζώντων
    ιπποειδών και σπέρματος, ωαρίων και εμβρύων
    ιπποειδών στην Ευρωπαϊκή Ένωση [κοινοποιηθείσα
    υπό τον αριθμό C(2014) 5440]'
  type: main
- language: et
  script: Latn
  content: '2014/523/EL: Komisjoni rakendusotsus, 4. august 2014 , millega muudetakse
    otsuse 2004/211/EÜ I lisa seoses Kuveidi kohta tehtud kannetega loetelus, kuhu
    on kantud sellised kolmandad riigid ja nende osad, millest on lubatud tuua liitu
    elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid (teatavaks tehtud
    numbri C(2014) 5440 all)'
  type: main
- language: fi
  script: Latn
  content: '2014/523/EU: Komission täytäntöönpanopäätös, annettu 4 päivänä
    elokuuta 2004 , päätöksen 2004/211/EY liitteen I muuttamisesta Kuwaitia koskevan
    kohdan osalta niiden kolmansien maiden ja kolmansien maiden osien luettelossa,
    joista elävien hevoseläinten ja hevoseläinten siemennesteen, munasolujen ja
    alkioiden tuonti unioniin on sallittua (tiedoksiannettu numerolla C(2014) 5440)'
  type: main
- language: hr
  script: Latn
  content: '2014/523/EU: Provedbena odluka Komisije оd 4. kolovoza 2014. o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Kuvajt na popisu trećih zemalja
    i njihovih dijelova iz kojih je dopušten uvoz u Uniju živih kopitara i sjemena,
    jajnih stanica i zametaka kopitara (priopćeno pod brojem dokumenta C(2014) 5440)'
  type: main
- language: hu
  script: Latn
  content: '2014/523/EU: A Bizottság végrehajtási határozata ( 2014. augusztus
    4. ) a 2004/211/EK határozat I. mellékletének az élő lófélék és ezek
    spermájának, petesejtjének és embriójának Európai Unióba történő behozatalára
    feljogosított harmadik országok és országrészek jegyzékében a Kuvaitra
    vonatkozó bejegyzés tekintetében történő módosításáról (az értesítés
    a C(2014) 5440. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/523/UE: Decisione di esecuzione della Commissione, del 4 agosto 2014
    , che modifica l''allegato I della decisione 2004/211/CE per quanto concerne la
    voce relativa al Kuwait nell''elenco dei paesi terzi e delle parti di paesi terzi
    da cui è autorizzata l''importazione nell''Unione di equidi vivi nonché di sperma,
    ovuli ed embrioni della specie equina [notificata con il numero C(2014) 5440]'
  type: main
- language: lv
  script: Latn
  content: '2014/523/ES: Komisijas Īstenošanas lēmums ( 2014. gada 4. augusts ),
    ar kuru groza Lēmuma 2004/211/EK I pielikumu attiecībā uz ierakstu par Kuveitu
    to trešo valstu un ar tām saistīto teritoriju daļu sarakstā, no kurām atļauj
    Savienībā ievest dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un
    embrijus (izziņots ar dokumenta numuru C(2014) 5440)'
  type: main
- language: lt
  script: Latn
  content: '2014/523/ES: 2014 m. rugpjūčio 4 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl Kuveito įrašo trečiųjų šalių ar jų dalių, iš kurių į Sąjungą
    leidžiama importuoti gyvus arklinių šeimos gyvūnus ir arklių rūšių gyvūnų
    spermą, kiaušialąstes ir embrionus, sąraše iš dalies keičiamas Sprendimo
    2004/211/EB I priedas (pranešta dokumentu Nr. C(2014) 5440)'
  type: main
- language: mt
  script: Latn
  content: '2014/523/UE: Deċiżjoni ta'' Implimentazzjoni tal-Kummissjoni tal- 4
    ta'' Awwissu 2014 li temenda l-Anness I tad-Deċiżjoni 2004/211/KE fir-rigward
    tal-entrata tal-Kuwajt fil-lista ta'' pajjiżi terzi u ta'' partijiet mit-territorju
    tiegħu li minnhom hija awtorizzata l-importazzjoni fl-Unjoni ta'' ekwidi ħajjin
    u ta'' semen, ova u embrijoni tal-ispeċi ekwina (notifikata bid-dokument C(2014)
    5440)'
  type: main
- language: nl
  script: Latn
  content: '2014/523/EU: Uitvoeringsbesluit van de Commissie van 4 augustus 2014 tot
    wijziging van bijlage I bij Beschikking 2004/211/EG wat betreft de gegevens voor
    Koeweit in de lijst van derde landen en delen daarvan waaruit de invoer in de
    Unie van levende paardachtigen en sperma, eicellen en embryo''s van paarden is
    toegestaan (Kennisgeving geschied onder nummer C(2014) 5440)'
  type: main
- language: pl
  script: Latn
  content: '2014/523/UE: Decyzja wykonawcza Komisji z dnia 4 sierpnia 2014 r. zmieniająca
    załącznik I do decyzji 2004/211/WE w odniesieniu do zapisu dotyczącego Kuwejtu
    w wykazie państw trzecich oraz części ich terytoriów, z których dozwolony
    jest przywóz do Unii żywych zwierząt z rodziny koniowatych, nasienia, komórek
    jajowych i zarodków koni (notyfikowana jako dokument nr C(2014) 5440)'
  type: main
- language: pt
  script: Latn
  content: '2014/523/UE: Decisão de Execução da Comissão, de 4 de agosto de 2014
