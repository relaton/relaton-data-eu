    ao Koweit na lista de países terceiros e partes de países terceiros a partir
    dos quais é autorizada a importação na União de equídeos vivos e de sémen,
    óvulos e embriões de equídeos [notificada com o número C(2014) 5440]'
  type: main
- language: ro
  script: Latn
  content: '2014/523/UE: Decizia de punere în aplicare a Comisiei din 4 august 2014
    de modificare a anexei I la Decizia 2004/211/CE în ceea ce privește rubrica
    referitoare la Kuweit din lista țărilor terțe și a părților din teritoriile
    acestor țări din care sunt autorizate importurile în Uniune de ecvidee vii
    și de material seminal, ovule și embrioni din specia ecvidee [notificată cu
    numărul C(2014) 5440]'
  type: main
- language: sk
  script: Latn
  content: '2014/523/EÚ: Vykonávacie rozhodnutie Komisie zo 4. augusta 2014 , ktorým
