    v zozname tretích krajín a ich častí, z ktorých je povolený dovoz živých
    koňovitých a spermy, vajíčok a embryí koňovitých do Únie [oznámené pod
    číslom C(2014) 5440]'
  type: main
- language: sl
  script: Latn
  content: '2014/523/EU: Izvedbeni sklep Komisije z dne 4. avgusta 2014 o spremembi
