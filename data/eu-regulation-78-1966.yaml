title:
- language: fr
  script: Latn
  content: Règlement n 78/66/CEE de la Commission, du 29 juin 1966, fixant le montant
    des prélèvements intracommunautaires pour les oeufs en coquille de volaille
    de basse-cour, les volailles vivantes d'un poids n'excédant pas 185 grammes et
    les volailles abattues, pour les importations effectuées à partir du 1er juillet
    1966
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 78/66/EWG der Kommission vom 29. Juni 1966 zur Festsetzung
    der innergemeinschaftlichen Abschöpfungsbeträge für Eier in der Schale von
    Hausgeflügel, lebendes Hausgeflügel mit einem Gewicht von höchstens 185 Gramm
    und geschlachtetes Hausgeflügel für die ab 1. Juli 1966 getätigten Einfuhren
  type: main
- language: it
  script: Latn
  content: Regolamento n. 78/66/CEE della Commissione, del 29 giugno 1966, che fissa
    i prelievi intracomunitari per le uova in guscio di volatili da cortile, i volatili
    da cortile vivi di peso non superiore a 185 grammi e i volatili da cortile macellati,
    per le importazioni effettuate a decorrere dal 1 luglio 1966
  type: main
- language: nl
  script: Latn
  content: Verordening no. 78/66/EEG van de Commissie van 29 juni 1966 houdende vaststelling
    van de intracommunautaire heffingen op eieren in de schaal van pluimvee, levend
    pluimvee dat niet meer dan 185 gram weegt en geslacht pluimvee, voor de invoer
    die van 1 juli 1966 af plaatsvindt
  type: main
