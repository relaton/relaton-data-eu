title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3131/91 of 21 October 1991 fixing, for the
    1991/92 marketing year, the representative market price and the threshold price
    for olive oil, the levels of consumption aid in Spain and Portugal and the percentages
    of consumption aid to be retained in accordance with Article 11 (5) and (6) of
    Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3131/91 DU CONSEIL du 21 octobre 1991 fixant, pour
    la campagne de commercialisation 1991/1992, le prix représentatif de marché
    et le prix de seuil de l'' huile d'' olive, les montants de l'' aide à la consommation
    en Espagne et au Portugal ainsi que les pourcentages du montant de l'' aide à
    la consommation à retenir conformément à l'' article 11 paragraphes 5 et 6
    du règlement no 136/66/CEE #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3131/91 DES RATES vom 21. Oktober 1991 zur Festsetzung
