    for olivenolie, forbrugerstøtten i Spanien og Portugal samt de procentdele af
    forbrugerstøtten, der skal tilbageholdes ifølge artikel 11, stk. 5 og 6, i forordning
    nr. 136/66/EØF
  type: main
- language: el
