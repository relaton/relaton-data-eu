  content: Commission Regulation (EEC) No 1150/90 of 4 May 1990 laying down detailed
    rules for the application of the arrangements applicable to imports of certain
    milk products originating in the African, Caribbean and Pacific States (ACP States)
    or in the overseas countries and territories (OCT)
  type: main
- language: fr
  script: Latn
