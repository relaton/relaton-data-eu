    σεξουαλικής κακοποίησης παιδιών στο διαδίκτυο
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2024/1307, 29. aprill 2024,
    millega muudetakse määrust (EL) 2021/1232 ajutise erandi kohta direktiivi 2002/58/EÜ
    teatavatest sätetest seoses tehnoloogiaga, mida numbrivaba isikutevahelise side
    teenuste osutajad kasutavad isikuandmete ja muude andmete töötlemiseks, et võidelda
    veebis toimuva laste seksuaalse kuritarvitamise vastu
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2024/1307, annettu 29 päivänä
    huhtikuuta 2024, tilapäisestä poikkeuksesta direktiivin 2002/58/EY tiettyihin
    säännöksiin siltä osin kuin on kyse teknologioista, joita numeroista riippumattomien
    henkilöiden välisten viestintäpalvelujen tarjoajat käyttävät henkilötietojen
    ja muiden tietojen käsittelyyn verkossa tapahtuvan lasten seksuaalisen hyväksikäytön
    torjumiseksi annetun asetuksen (EU) 2021/1232 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2024/1307 ó Pharlaimint na hEorpa agus ón gComhairle
    an 29 Aibreán 2024 lena leasaítear Rialachán (AE) 2021/1232 maidir le maolú
    sealadach ar fhorálacha áirithe de Threoir 2002/58/CE a mhéid a bhaineann le
    húsáid teicneolaíochtaí ag soláthraithe seirbhísí cumarsáide idirphearsanta
    neamhspleách ar uimhir chun sonraí pearsanta agus sonraí eile a phróiseáil
    chun mí-úsáid ghnéasach leanaí ar líne a chomhrac
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2024/1307 Europskog parlamenta i vijeća od 29. travnja 2024.
    o izmjeni Uredbe (EU) 2021/1232 o privremenom odstupanju od određenih odredbi
    Direktive 2002/58/EZ u pogledu tehnologija koje pružatelji brojevno neovisnih
    interpersonalnih komunikacijskih usluga upotrebljavaju za obradu osobnih i drugih
    podataka u svrhu borbe protiv seksualnog zlostavljanja djece na internetu
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2024/1307 rendelete (2024. április
    29.) a 2002/58/EK irányelv bizonyos rendelkezéseitől a technológiáknak a
    számfüggetlen személyközi hírközlési szolgáltatásokat nyújtó szolgáltatók
    által a gyermekek online szexuális bántalmazása elleni küzdelem céljából
    a személyes és egyéb adatok kezelésére történő használata tekintetében
    való ideiglenes eltérésről szóló (EU) 2021/1232 rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2024/1307 del Parlamento europeo e del Consiglio, del
    29 aprile 2024, che modifica il regolamento (UE) 2021/1232 relativo a una deroga
    temporanea a talune disposizioni della direttiva 2002/58/CE per quanto riguarda
    l’uso di tecnologie da parte dei prestatori di servizi di comunicazione interpersonale
    indipendenti dal numero per il trattamento di dati personali e di altro tipo ai
    fini della lotta contro gli abusi sessuali online sui minori
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2024/1307 (2024. gada 29. aprīlis),
    ar ko groza Regulu (ES) 2021/1232 par pagaidu atkāpi no konkrētiem Direktīvas
    2002/58/EK noteikumiem attiecībā uz tehnoloģiju izmantošanu, ko veic numurneatkarīgu
    starppersonu sakaru pakalpojumu sniedzēji, lai apstrādātu persondatus un citus
    datus nolūkā apkarot seksuālu vardarbību pret bērniem tiešsaistē
  type: main
- language: lt
  script: Latn
  content: 2024 m. balandžio 29 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2024/1307, kuriuo iš dalies keičiamas Reglamentas (ES) 2021/1232 dėl laikinos
    nukrypti nuo tam tikrų Direktyvos 2002/58/EB nuostatų, kiek tai susiję su numeriu
    nesiejamo asmenų tarpusavio ryšio paslaugų teikėjų naudojamų technologijų
    naudojimo asmens ir kitiems duomenims tvarkyti kovos su seksualine prievarta prieš
    vaikus internete tikslais, leidžiančios nuostatos
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2024/1307 tal-Parlament Ewropew u tal-Kunsill tad-29 ta’
    April 2024 li jemenda r-Regolament (UE) 2021/1232 dwar deroga temporanja minn
    ċerti dispożizzjonijiet tad-Direttiva 2002/58/KE fir-rigward tal-użu ta’
    teknoloġiji minn fornituri ta’ servizzi ta’ komunikazzjonijiet interpersonali
    indipendenti min-numri għall-ipproċessar ta’ data personali u data oħra għall-fini
    tal-ġlieda kontra l-abbuż sesswali tat-tfal online
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2024/1307 van het Europees Parlement en de Raad van 29
    april 2024 tot wijziging van Verordening (EU) 2021/1232 betreffende een tijdelijke
    afwijking van sommige bepalingen van Richtlijn 2002/58/EG ten aanzien van het
    gebruik van technologieën door aanbieders van nummeronafhankelijke interpersoonlijke
    communicatiediensten voor de verwerking van persoonsgegevens en andere gegevens
    ten behoeve van de bestrijding van online seksueel misbruik van kinderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2024/1307 z dnia 29
    kwietnia 2024 r. w sprawie zmiany rozporządzenia (UE) 2021/1232 w sprawie tymczasowego
    odstępstwa od niektórych przepisów dyrektywy 2002/58/WE w odniesieniu do wykorzystywania
    technologii przez dostawców usług łączności interpersonalnej niewykorzystujących
    numerów do przetwarzania danych osobowych i innych danych do celów zwalczania
    niegodziwego traktowania dzieci w celach seksualnych w internecie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2024/1307 do Parlamento Europeu e do Conselho, de 29 de
    abril de 2024, que altera o Regulamento (UE) 2021/1232 relativo a uma derrogação
    temporária de determinadas disposições da Diretiva 2002/58/CE no que respeita
    à utilização de tecnologias por prestadores de serviços de comunicações
    interpessoais independentes do número para o tratamento de dados pessoais e outros
    para efeitos de combate ao abuso sexual de crianças em linha
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2024/1307 al Parlamentului European și al Consiliului
    din 29 aprilie 2024 de modificare a Regulamentului (UE) 2021/1232 privind o derogare
    temporară de la anumite dispoziții ale Directivei 2002/58/CE în ceea ce privește
    utilizarea tehnologiilor de către furnizorii de servicii de comunicații interpersonale
    care nu se bazează pe numere pentru prelucrarea datelor cu caracter personal
    și a altor date în scopul combaterii abuzului sexual online asupra copiilor
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2024/1307 z 29. apríla
    2024, ktorým sa mení nariadenie (EÚ) 2021/1232 o dočasnej výnimke z určitých
    ustanovení smernice 2002/58/ES, pokiaľ ide o používanie technológií poskytovateľmi
    interpersonálnych komunikačných služieb nezávislých od číslovania na spracúvanie
    osobných a iných údajov na účely boja proti online sexuálnemu zneužívaniu
    detí
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2024/1307 Evropskega parlamenta in Sveta z dne 29. aprila 2024
    o spremembi Uredbe (EU) 2021/1232 o začasnem odstopanju od nekaterih določb
    Direktive 2002/58/ES glede uporabe tehnologij s strani ponudnikov medosebnih komunikacijskih
    storitev, neodvisnih od številke, za obdelavo osebnih in drugih podatkov za namene
    boja proti spolni zlorabi otrok na spletu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2024/1307 del Parlamento Europeo y del Consejo, de 29 de
    abril de 2024, por el que se modifica el Reglamento (UE) 2021/1232 por el que
    se establece una excepción temporal a determinadas disposiciones de la Directiva
    2002/58/CE en lo que respecta al uso de tecnologías por proveedores de servicios
    de comunicaciones interpersonales independientes de la numeración para el tratamiento
    de datos personales y de otro tipo con fines de lucha contra los abusos sexuales
    de menores en línea
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2024/1307 av den 29 april
    2024 om ändring av förordning (EU) 2021/1232 om ett tillfälligt undantag från
    vissa bestämmelser i direktiv 2002/58/EG vad gäller användning av teknik hos
    tillhandahållare av nummeroberoende interpersonella kommunikationstjänster för
    behandling av personuppgifter och andra uppgifter i syfte att bekämpa sexuella
    övergrepp mot barn på nätet
