title:
- language: en
  script: Latn
  content: Regulation (EU) 2024/1307 of the European Parliament and of the Council
    of 29 April 2024 amending Regulation (EU) 2021/1232 on a temporary derogation
    from certain provisions of Directive 2002/58/EC as regards the use of technologies
    by providers of number-independent interpersonal communications services for the
    processing of personal and other data for the purpose of combating online child
    sexual abuse
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2024/1307 du Parlement européen et du Conseil du 29 avril
    2024 modifiant le règlement (UE) 2021/1232 relatif à une dérogation temporaire
    à certaines dispositions de la directive 2002/58/CE en ce qui concerne l’utilisation
    de technologies par les fournisseurs de services de communications interpersonnelles
    non fondés sur la numérotation pour le traitement de données à caractère
    personnel et d’autres données aux fins de la lutte contre les abus sexuels
    commis contre des enfants en ligne
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2024/1307 des Europäischen Parlaments und des Rates vom
    29. April 2024 zur Änderung der Verordnung (EU) 2021/1232 über eine vorübergehende
    Ausnahme von bestimmten Vorschriften der Richtlinie 2002/58/EG hinsichtlich der
    Verwendung von Technologien durch Anbieter nummernunabhängiger interpersoneller
    Kommunikationsdienste zur Verarbeitung personenbezogener und anderer Daten zwecks
    Bekämpfung des sexuellen Missbrauchs von Kindern im Internet
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2024/1307 на Европейския парламент
    и на Съвета от 29 април 2024 година за изменение
    на Регламент (ЕС) 2021/1232 относно временна дерогация
    от някои разпоредби на Директива 2002/58/ЕО по
    отношение на използването на технологии от
    доставчици на междуличностни съобщителни
    услуги без номера за обработване на лични и
    други данни за целите на борбата с онлайн сексуалното
    насилие над деца
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2024/1307 ze dne 29. dubna
    2024, kterým se mění nařízení (EU) 2021/1232 o dočasné odchylce od některých
    ustanovení směrnice 2002/58/ES, pokud jde o používání technologií poskytovateli
    interpersonálních komunikačních služeb nezávislých na číslech ke zpracování
    osobních a jiných údajů pro účely boje proti pohlavnímu zneužívání
    dětí on-line
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2024/1307 af 29. april 2024
    om ændring af forordning (EU) 2021/1232 om en midlertidig undtagelse fra visse
    bestemmelser i direktiv 2002/58/EF for så vidt angår den anvendelse af teknologier
    til behandling af personoplysninger og andre data, der foretages af udbydere af
    nummeruafhængige interpersonelle kommunikationstjenester med det formål at bekæmpe
    seksuelt misbrug af børn online
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2024/1307 του Ευρωπαϊκού Κοινοβουλίου
