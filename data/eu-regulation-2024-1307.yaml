    την τροποποίηση του κανονισμού (ΕΕ) 2021/1232 περί
    προσωρινής παρεκκλίσεως από ορισμένες διατάξεις
    της οδηγίας 2002/58/ΕΚ όσον αφορά τη χρήση τεχνολογιών
    από παρόχους υπηρεσιών διαπροσωπικών επικοινωνιών
    ανεξαρτήτως αριθμών για την επεξεργασία προσωπικών
