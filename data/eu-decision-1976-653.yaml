  script: Latn
  content: '76/653/EEC: Commission Decision of 7 July 1976 authorizing the kingdom
    of Denmark and the French republic to certify seed of certain species of cereals,
    under special conditions (Only the French and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/653/CEE: Décision de la Commission, du 7 juillet 1976, autorisant
