    des Königreichs Dänemark und der französischen Republik, Saatgut einiger Getreidearten
    unter besonderen Bedingungen anzuerkennen (Nur der französische und dänische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. juli 1976 om bemyndigelse til kongeriget
    Danmark og Den franske Republik til at certificere sædekorn af visse kornarter
    på særlige betingelser
  type: main
