id: EURegulation18901978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1890/78 of 2 August 1978 re-establishing
    the levying of the customs duties on other mineral or chemical fertilizers, nitrogenous,
    falling within subheading 31.02 C and originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1890/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres engrais
    minéraux ou chimiques azotés, de la sous-position 31.02 C du tarif douanier
    commun, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1890/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für andere mineralische oder chemische Stickstoffdüngemittel
    der Tarifstelle 31.02 C mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1890/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for andre nitrogenholdige gødningsstoffer, mineralske
    eller kemiske, under underposition 31.02 C, som har oprindelse i Jugoslavien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1890/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli altri concimi minerali
    o chimici azotati della sottovoce doganale 31.02 C, orginari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1890/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere minerale
    of chemische stikstofhoudende meststoffen, van post 31.02 C, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
