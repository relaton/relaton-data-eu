  content: Commission Implementing Regulation (EU) 2023/2169 of 17 October 2023 amending
    Implementing Regulation (EU) 2022/1477 extending the definitive anti-dumping duty
    imposed by Implementing Regulation (EU) 2020/492, as amended by Implementing Regulation
    (EU) 2020/776, on imports of certain woven and/or stitched glass fibre fabrics
    originating in the People’s Republic of China and Egypt to imports of certain
    woven and/or stitched glass fibre fabrics consigned from Turkey, whether declared
    as originating in Turkey or not
  type: main
- language: fr
  script: Latn
