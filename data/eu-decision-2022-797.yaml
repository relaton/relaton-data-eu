  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/797 z 19. mája 2022, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    uvádzať na trh produkty, ktoré obsahujú geneticky modifikovanú kukuricu NK603
    × T25 × DAS-40278-9 a jej čiastkovú kombináciu T25 × DAS-40278-9, sú z
    nej zložené alebo vyrobené [oznámené pod číslom C(2022) 3179] (Iba holandské
    znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/797 z dne 19. maja 2022 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo NK603 × T25
    × DAS-40278-9 in njeno podkombinacijo T25 × DAS-40278-9, so iz njiju sestavljeni
    ali proizvedeni, v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in
    Sveta (notificirano pod dokumentarno številko C(2022) 3179) (Besedilo v nizozemskem
