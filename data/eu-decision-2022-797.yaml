    de maíz modificado genéticamente NK603 × T25 × DAS-40278-9 y su subcombinación
    T25 × DAS-40278-9, con arreglo al Reglamento (CE) n.o 1829/2003 del Parlamento
    Europeo y del Consejo [notificada con el número C(2022) 3179] (El texto en lengua
    neerlandesa es el único auténtico)
