    είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/797, 19. mai 2022, millega lubatakse
    kooskõlas Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1829/2003 viia
    turule geneetiliselt muundatud maisi NK603 × T25 × DAS-40278-9 ja selle alakombinatsiooni
    T25 × DAS-40278-9 sisaldavaid, sellest koosnevaid või sellest toodetud tooteid
    (teatavaks tehtud numbri C(2022) 3179 all) (Ainult hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/797, annettu 19 päivänä
    toukokuuta 2022, muuntogeenistä maissia NK603 × T25 × DAS-40278-9 ja sen alayhdistelmää
    T25 × DAS-40278-9 sisältävien, niistä koostuvien tai niistä valmistettujen
    tuotteiden markkinoille saattamisen sallimisesta Euroopan parlamentin ja neuvoston
    asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla C(2022) 3179)
    (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/797 ón gCoimisiún an 19 Bealtaine
    2022 lena n-údaraítear táirgí ina bhfuil, arb é atá iontu nó a thairgtear
    as arbhar Indiach géinmhodhnaithe NK603 × T25 × DAS-40278-9 agus a fho-chumasc
    T25 × DAS-40278-9, a chur ar an margadh de bhun Rialachán (CE) Uimh. 1829/2003
    ó Pharlaimint na hEorpa agus ón gComhairle (a bhfuil fógra tugtha ina leith
    faoi dhoiciméad C(2022) 3179) (An téacs Ollainnis amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/797 оd 19. svibnja 2022. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    NK603 × T25 × DAS-40278-9 i njegovu potkombinaciju T25 × DAS-40278-9 ili se
    sastoje ili su proizvedeni od njih, u skladu s Uredbom (EZ) br. 1829/2003 Europskog
    parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2022) 3179) (Vjerodostojan
    je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/797 végrehajtási határozata (2022. május 19.)
    a géntechnológiával módosított NK603 × T25 × DAS-40278-9 kukoricát és
    annak T25 × DAS-40278-9 alkombinációját tartalmazó, abból álló vagy abból
    előállított termékek forgalomba hozatalának az 1829/2003/EK európai parlamenti
    és tanácsi rendelet szerinti engedélyezéséről (az értesítés a C(2022)
    3179. számú dokumentummal történt) (Csak a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/797 della Commissione del 19 maggio 2022
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati da granturco geneticamente modificato NK603 × T25 × DAS-40278-9 e dalla
    relativa sottocombinazione T25 × DAS-40278-9 a norma del regolamento (CE) n.
    1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero C(2022)
    3179] (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/797 (2022. gada 19. maijs), ar
    ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu NK603 × T25
    × DAS-40278-9 un tās apakškombināciju T25 × DAS-40278-9, sastāv vai ir ražoti
    no tām (izziņots ar dokumenta numuru C(2022) 3179) (Autentisks ir tikai teksts
    nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/797 2022 m. gegužės 19 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    NK603 × T25 × DAS-40278-9 ir jų subkombinacija T25 × DAS-40278-9, kurie iš
    jų sudaryti arba kurie iš jų pagaminti (pranešta dokumentu Nr. C(2022) 3179)
    (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/797 tad-19
    ta’ Mejju 2022 li tawtorizza t-tqegħid fis-suq tal-prodotti li fihom, li jikkonsistu
    jew li huma prodotti mill-qamħirrum ġenetikament modifikat NK603 × T25 × DAS-40278-9
    u s-sottokombinazzjoni tiegħu T25 × DAS-40278-9 skont ir-Regolament (KE) Nru
    1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata bid-dokument C(2022)
    3179) (It-test bl-Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/797 van de Commissie van 19 mei 2022 tot verlening
    van een vergunning voor het in de handel brengen van producten die geheel of gedeeltelijk
    bestaan uit of zijn geproduceerd met de genetisch gemodificeerde mais NK603 ×
    T25 × DAS-40278-9 en de subcombinatie T25 × DAS-40278-9 daarvan, overeenkomstig
    Verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad (Kennisgeving
    geschied onder nummer C(2022) 3179) (Slechts de tekst in de Nederlandse taal is
    authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/797 z dnia 19 maja 2022 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    NK603 × T25 × DAS-40278-9 i jej subkombinację T25 × DAS-40278-9, składających
    się z niej lub z niej wyprodukowanych (notyfikowana jako dokument nr C(2022)
    3179) (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/797 da Comissão de 19 de maio de 2022
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado NK603 × T25
    × DAS-40278-9 e da sua subcombinação T25 × DAS-40278-9, nos termos do Regulamento
    (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho [notificada com o número
    C(2022) 3179] (Apenas faz fé o texto em língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/797 a Comisiei din 19 mai 2022
    de autorizare a introducerii pe piață a produselor care conțin, constau în
    sau sunt fabricate din porumbul modificat genetic NK603 × T25 × DAS-40278-9
    și subcombinația sa T25 × DAS-40278-9, în conformitate cu Regulamentul (CE)
    nr. 1829/2003 al Parlamentului European și al Consiliului [notificată cu numărul
    C(2022) 3179] (Numai textul în limba neerlandeză este autentic)
  type: main
