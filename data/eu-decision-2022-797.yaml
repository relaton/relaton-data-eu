---
id: EUDecision2022797
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/797 of 19 May 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize NK603 × T25 × DAS-40278-9 and its sub-combination
    T25 × DAS-40278-9, pursuant to Regulation (EC) No 1829/2003 of the European Parliament
    and of the Council (notified under document C(2022) 3179) (Only the Dutch text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/797 de la Commission du 19 mai 2022
    autorisant la mise sur le marché de produits contenant le maïs génétiquement
    modifié NK603 × T25 × DAS-40278-9 et sa sous-combinaison T25 × DAS-40278-9,
    consistant en ce maïs et sa sous-combinaison ou produits à partir de ceux-ci,
    conformément au règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2022) 3179] (Le texte en langue néerlandaise est
    le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/797 der Kommission vom 19. Mai 2022 über
    die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte NK603 × T25 × DAS-40278-9 und der Unterkombination T25 × DAS-40278-9
    enthalten, aus ihm bestehen oder aus ihm hergestellt werden, gemäß der Verordnung
    (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben
    unter Aktenzeichen C(2022) 3179) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/797 на Комисията
    от 19 май 2022 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица NK603 × T25 × DAS-40278-9 и нейната подкомбинация
    T25 × DAS-40278-9, в съответствие с Регламент (ЕО) №
    1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2022) 3179) (само текстът
    на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/797 ze dne 19. května 2022 o
    povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    NK603 × T25 × DAS-40278-9 a její podkombinaci 25 × DAS-40278-9, sestávají
    z nich nebo jsou z nich vyrobeny, na trh podle nařízení Evropského parlamentu
    a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2022) 3179) (Pouze nizozemské
    znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/797 af 19. maj 2022 om
    tilladelse til markedsføring af produkter, der indeholder, består af eller er
    fremstillet af genetisk modificeret NK603 × T25 × DAS-40278-9-majs og dens underkombination
    T25 × DAS-40278-9, i henhold til Europa-Parlamentets og Rådets forordning (EF)
    nr. 1829/2003 (meddelt under nummer C(2022) 3179) (Kun den nederlandske udgave
    er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/797 της Επιτροπής
    της 19ης Μαΐου 2022 για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από τον γενετικώς τροποποιημένο
    αραβόσιτο NK603 × T25 × DAS-40278-9 και τον επιμέρους
    συνδυασμό του T25 × DAS-40278-9, σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου [κοινοποιηθείσα υπό τον
