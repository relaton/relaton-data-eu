    har framställts av den genetiskt modifierade majsen NK603 × T25 × DAS-40278-9
    och dess klyvningsprodukt T25 × DAS-40278-9, i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1829/2003 [delgivet med nr C(2022) 3179] (Endast
    den nederländska texten är giltig)
