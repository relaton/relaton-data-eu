---
id: EUDecision1976708
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 July 1976 authorizing the French Republic not
    to apply Community treatment to certain setts, flags and paving, hearth and wall
    tiles falling within subheadings 69.07 ex A and B ex II and 69.08 ex A and B ex
    II of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/708/CEE: Décision de la Commission, du 29 juillet 1976, autorisant
    la République française à exclure du traitement communautaire certains carreaux,
    pavés, dalles de pavement ou de revêtement, des positions 69.07 Ex A et B Ex
    II et 69.08 Ex A et B Ex II du Tarif douanier commun, originaires du Japon et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. Juli 1976, mit der die Französische
    Republik ermächtigt wird, bestimmte aus Japan stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    der Tarifstellen 69.07 ex A und B ex II und 69.08 ex A und B ex II des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 29. juli 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage visse sten og fliser til brolægning,
    gulvbelægning eller beklædning af vægge, kaminer o.lign., som henhører under
    pos. 69.07 ex A og B ex II og 69.08 ex A og B ex II i den fælles toldtarif, har
    oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 luglio 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario talune piastrelle, blocchetti
    e lastre da pavimentazione o da rivestimento, di cui alle voci 69.07 ex A e B
    ex II e 69.08 ex A e B ex II della tariffa doganale comune, originari del Giappone
    e immessi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 juli 1976 waarbij de Franse Republiek
    wordt gemachtigd sommige plavuizen, vloer- en wandtegels (andere dan artikelen
    bedoeld bij post 69.04) van de posten 69.07 ex A en B ex II en 69.08 ex A en B
    ex II van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
