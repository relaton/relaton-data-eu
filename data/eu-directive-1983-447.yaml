title:
- language: en
  script: Latn
  content: Commission Directive 83/447/EEC of 18 August 1983 adopting the measures
    provided for in Article 3 (3) of Directive 76/889/EEC on the approximation of
    the laws of the Member States relating to radio interference caused by electrical
    household appliances, portable tools and similar equipment and of Directive 76/890/EEC
    on the approximation of the laws of the Member States relating to the suppression
    of radio interference with regard to fluorescent lighting luminaires fitted with
    starters
  type: main
- language: fr
  script: Latn
  content: Directive 83/447/CEE de la Commission du 18 août 1983 arrêtant les mesures
    prévues à l'article 3 paragraphe 3 de la directive 76/889/CEE concernant le
    rapprochement des législations des États membres relatives aux perturbations
    radioélectriques produites par les appareils électrodomestiques, outils portatifs
    et appareils similaires, ainsi que de la directive 76/890/CEE concernant le rapprochement
    des législations des États membres relatives à l'antiparasitage des luminaires
    avec démarreur pour l'éclairage à fluorescence
  type: main
- language: de
  script: Latn
  content: Richtlinie 83/447/EWG der Kommission vom 18. August 1983 zur Anpassung
    des Artikels 3 Absatz 3 der Richtlinie 76/889/EWG des Rates zur Angleichung der
    Rechtsvorschriften der Mitgliedstaaten über Funkstörungen durch Elektro-Haushaltsgeräte,
    handgeführte Elektrowerkzeuge und ähnliche Geräte und der Richtlinie 76/890/EWG
    des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über Funk-
    Entstörung bei Leuchten mit Starter für Leuchtstofflampen
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 83/447/EØF af 18. august 1983 om fastlæggelse
    af foranstaltninger som omhandlet i artikel 3, stk. 3, i direktiv 76/889/EØF
    om indbyrdes tilnærmelse af medlemsstaternes lovgivning om radiostøj, forårsaget
    af elektriske husholdningsapparater, transportabelt værktøj og lignende apparater
    samt i direktiv 76/890/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning
    om radiostøjdæmpning af armaturer med starter for lysstofrør
  type: main
- language: el
  script: Grek
  content: Οδηγία 83/447/ΕΟΚ της Επιτροπής της 18ης Αυγούστου
    1983 σχετικά με τα μέτρα που προβλέπονται από
    το άρθρο 3 παράγραφος 3 της οδηγίας 76/889/ΕΟΚ του
    Συμβουλίου περί προσεγγίσεως των νομοθεσιών
    των Κρατών μελών των αναφερομένων στα παράσιτα
    (ηλεκτρομαγνητικές διαταραχές) που προκαλούνται
    από ηλεκτρικές οικιακές συσκευές, φορητά εργαλεία
    και παρόμοιες συσκευές, καθώς και της οδηγίας
    76/890/ΕΟΚ του Συμβουλίου περί προσεγγίσεως των
    νομοθεσιών των Κρατών μελών των αναφερομένων
    στον περιορισμό των παρασίτων των φωτιστικών
    διατάξεων με λαμπτήρες φθορισμού εφοδιασμένους
    με εκκινητή
  type: main
- language: it
  script: Latn
  content: Direttiva 83/447/CEE della Commissione del 18 agosto 1983 recante adozione
    delle misure previste dall'articolo 3, paragrafo 3, della direttiva 76/889/CEE
    per il ravvicinamento delle legislazioni degli Stati Membri relative ai radiodisturbi
    provocati da apparecchi elettrodomestici, utensili portatili e apparecchi analoghi
    nonché della direttiva 76/890/CEE per il ravvicinamento delle legislazioni degli
    Stati Membri relative alla soppressione dei radiodisturbi provocati dagli apparecchi
    di illuminazione per lampade fluorescenti muniti di starter
  type: main
- language: nl
  script: Latn
  content: Richtlijn 83/447/EEG van de Commissie van 18 augustus 1983 tot vaststelling
    van de maatregelen bedoeld in artikel 3, lid 3, van Richtlijn 76/889/EEG betreffende
    de onderlinge aanpassing van de wetgevingen der Lid- Staten inzake radiostoringen,
    veroorzaakt door huishoudelijke elektrische apparaten, draagbaar gereedschap en
    soortgelijke apparatuur, en van Richtlijn 76/890/EEG van de Raad betreffende de
    onderlinge aanpassing van de wetgevingen der Lid-Staten inzake radiostoringsonderdrukking
    bij armaturen met starter voor fluorescentieverlichting
  type: main
- language: pt
  script: Latn
  content: Directiva 83/447/CEE da Comissão, de 18 de Agosto de 1983, relativa às
    medidas a que se refere o nº 3 do artigo 3º da Directiva 76/889/CEE, relativa
    à harmonização das legislações dos Estados-Membros respeitantes às interferências
    radioeléctricas produzidas pelos aparelhos electrodomésticos, ferramentas portáteis
    e aparelhos similares, bem como da Directiva 76/890/CEE, relativa à aproximação
    das legislações dos Estados-Membros respeitantes à supressão das interferências
    radioeléctricas das luminárias com arrancador para iluminação por fluorescência
  type: main
- language: es
  script: Latn
  content: Directiva 83/447/CEE de la Comisión, de 18 de agosto de 1983, que adopta
    las medidas previstas en el apartado 3 del artículo 3 de la Directiva 76/889/CEE
    referente a la aproximación de las legislaciones de los Estados Miembros relativas
    a las radiointerferencias producidas por los aparatos electrodomésticos, herramientas
    portátiles y aparatos similares, y las de la Directiva 76/890/CEE referente a
    la aproximación de las legislaciones de los Estados Miembros relativas a la supresión
    de radiointerferencias en los aparatos de iluminación fluorescente con dispositivo
    de arranque
  type: main
