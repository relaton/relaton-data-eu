title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2696/76 of 5 November 1976 derogating from
    Regulation (EEC) No 76/76 setting up a system linking imports of beef and veal
    products effected by way of protective measures with the sale of beef held by
    intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2696/76 de la Commission, du 5 novembre 1976, portant
    dérogation au règlement (CEE) n° 76/76 instituant un régime de jumelage de
    l' importation de produits du secteur de la viande bovine au titre de mesures
    de sauvegarde avec la vente de viandes bovines détenues par les organismes d'
    intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2696/76 der Kommission vom 5. November 1976 zur Abweichung
    von der Verordnung (EWG) Nr. 76/76 zur Einführung der Koppelung der Einfuhr von
    Erzeugnissen des Rindfleischsektors im Rahmen von Schutzmaßnahmen mit dem Absatz
    von Rindfleisch aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2696/76 af 5. november 1976 om undtagelse
    fra forordning (EØF) nr. 76/76 om indførelse som beskyttelsesforanstaltning
    af en ordning med kobling af indførsel af varer henhørende under oksekødsektoren
    med salg af oksekød, som interventionsorganerne ligger inde med
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2696/76 della Commissione, del 5 novembre 1976, recante
    deroga al regolamento (CEE) n. 76/76 che istituisce un regime di abbinamento tra
    l' importazione dei prodotti del settore delle carni bovine nel quadro delle misure
    di salvaguardia e la vendita di carni bovine detenute dagli organismi d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2696/76 van de Commissie van 5 november 1976 houdende
    afwijking van Verordening (EEG) nr. 76/76 tot instelling van een regeling voor
    de koppeling van de invoer van produkten van de sector rundvlees in het kader
    van de vrijwaringsmaatregelen aan de verkoop van rundvlees uit interventievoorraden
