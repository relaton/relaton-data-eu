title:
- language: en
  script: Latn
  content: '85/171/EEC: Commission Decision of 15 February 1985 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain textile products,
    originating in Turkey, which have been put into free circulation in the Community
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/171/CEE: Décision de la Commission du 15 février 1985 autorisant
    la République française à procéder à une surveillance intracommunautaire
    des importations de certains produits textiles originaires de Turquie et mis en
    libre pratique dans la Communauté (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/171/EWG: Entscheidung der Kommission vom 15. Februar 1985 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von bestimmten aus der Türkei stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Textilwaren (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/171/EØF: Kommissionens beslutning af 15. februar 1985 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse tekstilvarer, der har oprindelse i Tyrkiet og er overgået til fri omsætning
    i Fællesskabet (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/171/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Φεβρουαρίου 1985 για τη χορήγηση άδειας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επίβλεψη
    των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής Τουρκίας που έχουν τεθεί
    σε ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/171/CEE: Decisione della Commissione del 15 febbraio 1985 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria sulle importazioni
    di taluni prodotti tessili originari della Turchia ed immessi in libera pratica
    nella Comunità (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/171/EEG: Beschikking van de Commissie van 15 februari 1985 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    op de invoer van bepaalde textielprodukten, van oorsprong uit Turkije, die in
    de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
