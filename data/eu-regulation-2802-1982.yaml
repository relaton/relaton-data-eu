id: EURegulation28021982
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2802/82 of 20 October 1982 laying down to
    what extent applications for issue of export licences submitted during October
    1982 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2802/82 de la Commission, du 20 octobre 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'octobre 1982 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2802/82 der Kommission vom 20. Oktober 1982 über
    das Ausmaß, in dem den im Oktober 1982 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2802/82 af 20. oktober 1982 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i oktober
    1982 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2802/82 της Επιτροπής
    της 20ής Οκτωβρίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής πού
    υποβλήθηκαν τον Οκτώβριο του 1982 για τα προϊόντα
    του τομέα του βοείου κρέατος πού δύνανται να
    τύχουν ειδικής μεταχειρίσεως κατά την εισαγωγή
    σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2802/82 della Commissione, del 20 ottobre 1982, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di ottobre 1982 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2802/82 van de Commissie van 20 oktober 1982 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in oktober 1982
    ingediende aanvragen om uitvoercertificaten voor produkten van de sector rundvlees
    waarvoor een bijzondere behandeling geldt bij invoer in een derde land
  type: main
