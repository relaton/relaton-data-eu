- language: fr
  script: Latn
  content: Règlement n 187/64/CEE du Conseil, du 30 novembre 1964, portant fixation
    du montant des prélèvements envers les pays tiers pour le porc, la viande de
    porc et les produits à base de viande de porc, pour les importations effectuées
    entre le 1er janvier et le 31 mars 1965
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 187/64/EWG des Rates vom 30. November 1964 über die Festsetzung
    der Abschöpfungsbeträge gegenüber dritten Ländern für Schweine, Schweinefleisch
    und Schweinefleisch enthaltende Erzeugnisse für Einfuhren, die vom 1. Januar
    bis zum 31. März 1965 getätigt werden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 187/64/CEE del Consiglio, del 30 novembre 1964, relativo
    alla fissazione dell'ammontare dei prelievi nei confronti dei paesi terzi applicabili
    ai suini, alle carni suine ed ai prodotti a base di carni suine per le importazioni
    effettuate dal 1 gennaio al 31 marzo 1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 187/64/EEG van de Raad van 30 november 1964 houdende vaststelling
