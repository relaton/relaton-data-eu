    zasady wykonania przepisów szczególnych w odniesieniu do dostawy produktów
    zbożowych do francuskich departamentów zamorskich (FDZ), a także Azorów i
    Madery i ustanawiające przewidywany bilans dostaw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1563/95 da Comissão, de 30 de Junho de 1995, que
