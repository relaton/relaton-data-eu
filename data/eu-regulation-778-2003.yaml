title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 778/2003 of 6 May 2003 amending Commission Decision
    No 283/2000/ECSC and Council Regulations (EC) No 584/96, (EC) No 763/2000 and
    (EC) No 1514/2002 with regard to the anti-dumping measures applicable to certain
    hot-rolled coils and to certain tube and pipe fittings, of iron or steel
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 778/2003 du Conseil du 6 mai 2003 portant modification
    de la décision n° 283/2000/CECA de la Commission et des règlements (CE) n°
    584/96, n° 763/2000 et n° 1514/2002 du Conseil relatifs aux mesures antidumping
    applicables à certains rouleaux laminés à chaud et à certains accessoires
    de tuyauterie, en fer ou en acier
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 778/2003 des Rates vom 6. Mai 2003 zur Änderung der
    Entscheidung Nr. 283/2000/EGKS der Kommission und der Verordnungen (EG) Nr. 584/96,
    (EG) Nr. 763/2000 und (EG) Nr. 1514/2002 des Rates betreffend die Antidumpingmaßnahmen
    gegenüber bestimmten warmgewalzten Coils und bestimmten Rohrformstücken, Rohrverschlussstücken
    und Rohrverbindungsstücken aus Eisen oder Stahl
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 778/2003 ze dne 6. května 2003, kterým se mění
    rozhodnutí Komise č. 283/2000/ESUO a nařízení Rady (ES) č. 584/96, (ES)
    č. 763/2000 a (ES) č. 1514/2002, pokud jde o antidumpingová opatření týkající
    se některých za tepla válcovaných svitků a některých potrubních tvarovek
    ze železa nebo oceli
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 778/2003 af 6. maj 2003 om ændring af Kommissionens
    beslutning nr. 283/2000/EKSF og Rådets forordning (EF) nr. 584/96, (EF) nr. 763/2000
    og (EF) nr. 1514/2002 for så vidt angår antidumpingforanstaltningerne vedrørende
    visse varmtvalsede bredbånd og visse rørfittings af jern og stål
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 778/2003 του Συμβουλίου,
