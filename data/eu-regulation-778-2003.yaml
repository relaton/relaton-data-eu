  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 778/2003, 6. mai 2003, millega muudetakse komisjoni
    otsust nr 283/2000/ESTÜ ja komisjoni määrusi (EÜ) nr 584/96, (EÜ) nr 763/2000
    ja (EÜ) nr 1514/2002 teatud kuumvaltsitud poolide ja teatud raud- ja terastoruliitmike
    suhtes kohaldatavate dumpinguvastaste meetmete kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 778/2003, annettu 6 päivänä toukokuuta 2003,
    komission päätöksen N:o 283/2000/EHTY sekä neuvoston asetusten (EY) N:o 584/96,
    (EY) N:o 763/2000 ja (EY) N:o 1514/2002 muuttamisesta tiettyihin kuumavalssattuihin
    keloihin ja tiettyihin raudasta tai teräksestä valmistettuihin putkien liitos-
    ja muihin osiin sovellettavien polkumyyntitoimenpiteiden osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács 778/2003/EK rendelete (2003. május 6.) a vasból vagy acélból
    készült egyes melegen hengerelt tekercsekre és csőillesztékekre, illetve
    csőszerelvényekre vonatkozó dömpingellenes intézkedések tekintetében a
    283/2000/ESZAK bizottsági határozat, valamint az 584/96/EK, a 763/2000/EK és
    az 1514/2002/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 778/2003 del Consiglio, del 6 maggio 2003, che modifica
    la decisione n. 283/2000/CECA della Commissione e i regolamenti del Consiglio
    (CE) n. 584/96, (CE) n. 763/2000 e (CE) n. 1514/2002 relativamente alle misure
    antidumping applicabili ad alcuni arrotolati laminati a caldo e ad alcuni accessori
    per tubi di ferro o di acciaio
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 778/2003 (2003. gada 6. maijs), ar ko groza Komisijas
    Lēmumu Nr. 283/2000/EOTK un Padomes Regulu (EK) Nr. 584/96, (EK) Nr. 763/2000
    un (EK) Nr. 1514/2002 attiecībā uz antidempinga pasākumiem, kas piemērojami
    noteiktiem karstiem velmējumiem ruļļos un noteiktiem dzelzs un tērauda cauruļu
    savienotājelementiem
  type: main
- language: lt
  script: Latn
  content: 2003 m. gegužės 6 d. Tarybos Reglamentas (EB) Nr. 778/2003 iš dalies
    keičiantis Komisijos sprendimą Nr. 283/2000/EAPB ir Tarybos reglamentus (EB)
    Nr. 584/96, (EB) Nr. 763/2000 ir (EB) Nr. 1514/2002, dėl antidempingo priemonių,
    taikomų tam tikriems į ritinius suvyniotiems karštai valcuotiems gaminiams
    ir kai kurioms vamzdžių arba vamzdelių jungiamosioms detalėms iš geležies
    arba plieno
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 778/2003 tas-6 ta’ Mejju 2003 li jemenda
    d-Deċiżjoni tal-Kummissjoni Nru 283/2000/KEFA u r-Regolamenti tal-Kunsill (KE)
    Nru 584/96, (KE) Nru 763/2000 u (KE) Nru 1514/2002 li jikkonċernaw il-miżuri
    ta’ kontra d-dumping li applikaw għal ċerti rollijiet illaminati fis-sħana
    u għal ċertu armar għal tubaturi u pajpijiet, tal-ħadid jew azzar.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 778/2003 van de Raad van 6 mei 2003 tot wĳziging
    van Beschikking nr. 283/2000/EGKS van de Commissie en de Verordeningen (EG) nr.
    584/96, (EG) nr. 763/2000 en (EG) nr. 1514/2002 betreffende de antidumpingmaatregelen
    die van toepassing zĳn op warmgewalst breedband en hulpstukken van buisleidingen,
    van ĳzer of van staal
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 778/2003 z dnia 6 maja 2003 r. zmieniające
    decyzję Komisji nr 283/2000/EWWiS i rozporządzenia Rady (WE) nr 584/96, (WE)
    nr 763/2000 oraz (WE) nr 1514/2002 w odniesieniu do środków antydumpingowych
    stosowanych do niektórych zwojów walcowanych na gorąco oraz niektórych rur
    i kształtek rurowych z żelaza lub stali
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 778/2003 do Conselho, de 6 de Maio de 2003, que altera
    a Decisão n.° 283/2000/CECA da Comissão e os Regulamentos (CE) n.° 584/96,
    (CE) n.° 763/2000 e (CE) n.° 1514/2002 do Conselho no que respeita às medidas
    anti-dumping aplicáveis às importações de certos rolos laminados a quente
    e de certos acessórios para tubos, de ferro ou de aço
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 778/2003 zo 6. mája 2003, ktorým sa mení a
    dopĺňa rozhodnutie Komisie č. 283/2000/ESUO a nariadenia Rady (ES) č. 584/96,
    (ES) č. 763/2000 a (ES) č. 1514/2002, pokiaľ ide o antidumpingové opatrenia
    uplatniteľné na určité zvitky valcované za tepla a určité príslušenstvo
    na rúry a rúrky zo železa a ocele
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 778/2003 z dne 6. maja 2003 o spremembi Odločbe
    Komisije št. 283/2000/ESPJ ter uredb Sveta (ES) št. 584/96, (ES) št. 763/2000
    in (ES) št. 1514/2002 v zvezi z protidampinškimi ukrepi, ki se uporabljajo pri
    nekaterih vroče valjanih kolobarjih in nekaterih priborih (fitingi) za cevi iz
    železa ali jekla
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 778/2003 del Consejo, de 6 de mayo de 2003, por el
    que se modifican la Decisión n° 283/2000/CECA de la Comisión y los Reglamentos
    (CE) n° 584/96, (CE) n° 763/2000 y (CE) n° 1514/2002 del Consejo en lo que
    se refiere a las medidas antidumping aplicables a determinadas bobinas laminadas
    en caliente y a determinados accesorios de tubería, de hierro o de acero
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 778/2003 av den 6 maj 2003 om ändring av kommissionens
    beslut nr 283/2000/EKSG och rådets förordningar (EG) nr 584/96, (EG) nr 763/2000
    och (EG) nr 1514/2002 i fråga om de antidumpningsåtgärder som tillämpas på
    vissa varmvalsade ringar eller rullar och på vissa rördelar av järn eller stål
