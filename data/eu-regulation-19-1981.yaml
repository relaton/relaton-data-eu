title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 19/81 of 1 January 1981 waiving the provisions
    of Regulation (EEC) No 208/70 laying down detailed rules for the application of
    measures to encourage the processing of oranges for the 1980/81 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 19/81 de la Commission, du 1er janvier 1981, dérogeant
    pour la campagne 1980/1981 aux dispositions du règlement (CEE) n° 208/70 établissant
    les modalités d' application des mesures visant à promouvoir la transformation
    des oranges
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 19/81 der Kommission vom 1. Januar 1981 zur Abweichung
    von der Verordnung (EWG) Nr. 208/70 mit Durchführungsbestimmungen zu den Maßnahmen
    der Apfelsinenverarbeitung im Wirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 19/81 af 1. januar 1981 om undtagelse
    for produktionsåret 1980/81 fra forordning (EØF) nr. 208/70 om gennemførelsesbestemmelserne
    om foranstaltninger til fremme af forarbejdning af appelsiner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 19/81 τής Επιτροπής
    τής 1ης Ιανουαρίου 1981 περί παρεκκλίσεως, γιά
    τήν περίοδο 1980/81, από τίς διατάξεις τού κανονισμού
    (ΕΟΚ) αριθ. 208/70 «περί θεσπίσεως τών λεπτομερειών
    εφαρμογής τών μέτρων πού αναφέρονται στήν
    προώθηση τής μεταποιήσεως τών πορτοκαλιών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 19/81 della Commissione, del 1° gennaio 1981, che
    deroga, per la campagna 1980/1981, alle disposizioni del regolamento (CEE) n.
    208/70 che stabilisce le modalità di applicazione delle misure intese a promuovere
    la trasformazione delle arance
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 19/81 van de Commissie van 1 januari 1981 tot afwijking
    voor het verkoopseizoen 1980/1981 van Verordening (EEG) nr. 208/70 houdende uitvoeringsbepalingen
    ter zake van de maatregelen tot bevordering van het verwerken van sinaasappelen
  type: main
