  content: Regulation (EEC) No 1096/75 of the Commission of 17 April 1975 fixing the
    rates of the refunds applicable from 1 May 1975 to eggs and egg yolks exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1096/75 de la Commission, du 17 avril 1975, fixant les
