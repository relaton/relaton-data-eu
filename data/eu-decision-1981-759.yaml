title:
- language: en
  script: Latn
  content: '81/759/EEC: Commission Decision of 25 August 1981 authorizing Ireland
    not to apply Community treatment to footwear other than footwear with uppers of
    textile fabric, falling within subheading ex 64.02 B of the Common Customs Tariff
    and originating in Taiwan (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/759/CEE: Décision de la Commission, du 25 août 1981, autorisant l''Irlande
    à exclure du traitement communautaire les chaussures autres que chaussures à
    dessus en matières textiles de la sous-position ex 64.02 B du tarif douanier
    commun, originaires de T''ai-wan (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '81/759/EWG: Entscheidung der Kommission vom 25. August 1981 zur Ermächtigung
    Irlands, aus Taiwan stammende Schuhe, andere als Schuhe mit Oberteil aus Spinnstoff,
    der Tarifstelle ex 64.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/759/EØF: Kommissionens beslutning af 25. august 1981 om bemyndigelse
    til Irland til fra fællesskabsbehandling at undtage fodtøj, bortset fra fodtøj
    med overdel af tekstilmateriale, som henhører under pos. ex 64.02 B i den fælles
    toldtarif, med oprindelse i Taiwan (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/759/EOK: Απόφαση τής Επιτροπής τής 25ης Αυγούστου
    1981 περί χορηγήσεως αδείας στήν Ιρλανδία νά
    εξαιρέσει από τήν κοινοτική μεταχείριση τά
    υποδήματα έτερα τών υποδημάτων τών οποίων
    τό άνω μέρος αποτελείται εξ υφαντικών υλών
    τής διακρίσεως ex 64. 02 B τού Κοινού Δασμολογίου,
    καταγωγής Ταϊβάν (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/759/CEE: Decisione della Commissione, del 25 agosto 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le altre calzature diverse
    da quelle con tomaia di materie tessili, della sottovoce ex 64.02 B della tariffa
    doganale comune, originarie di Taiwan (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/759/EEG: Beschikking van de Commissie van 25 augustus 1981 houdende
    machtiging van Ierland om schoeisel, ander dan schoeisel met bovendeel van textiel,
    van post ex 64.02 B van het gemeenschappelijk douanetarief van oorsprong uit Taiwan
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
