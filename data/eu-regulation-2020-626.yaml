    tasavaltaa koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden
    tai erillisalueiden luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden
    tuonti unioniin tai kuljettaminen sen kautta on sallittua Newcastlen taudin yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/626 оd 7. svibnja 2020. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Republiku Sjevernu Makedoniju
    na popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih
    je dopušten uvoz u Uniju i provoz kroz nju određenih proizvoda od peradi u vezi
    s newcastleskom bolesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/626 végrehajtási rendelete (2020. május 7.) a
    798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékének
    az Észak-macedón Köztársaságra vonatkozó bejegyzés tekintetében a Newcastle-betegség
    megjelenése nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/626 della Commissione del 7 maggio
    2020 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa alla Repubblica di Macedonia del Nord nell’elenco di paesi
    terzi, loro territori, zone o compartimenti da cui sono consentiti le importazioni
    e il transito nell’Unione di determinati prodotti a base di pollame in relazione
    alla malattia di Newcastle
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/626 (2020. gada 7. maijs), ar
    ko Regulas (EK) Nr. 798/2008 I pielikumu groza attiecībā uz ierakstu par Ziemeļmaķedonijas
    Republiku to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kuriem
    saistībā ar Ņūkāslas slimību atļauts Savienībā importēt vai tranzītā
    caur to pārvadāt konkrētas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/626 2020 m. gegužės 7 d.
    kuriuo dėl Niukaslo ligos ir su šia liga susijusio Šiaurės Makedonijos Respublikos
    įrašo trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių galima
    importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių paukščių
    prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/626 tas-7 ta’
    Mejju 2020 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 fir-rigward
    tal-entrata għar-Repubblika tal-Maċedonja ta’ Fuq fil-lista ta’ pajjiżi
    terzi, territorji, żoni jew kumpartimenti li minnhom jistgħu jiġu importati
    lejn l-Unjoni, jew jgħaddu minnha bi tranżitu, ċerti prodotti tat-tjur b’rabta
    mal-marda ta’ Newcastle
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/626 van de Commissie van 7 mei 2020 tot
    wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor de Republiek Noord-Macedonië in de lijst van derde landen, gebieden, zones
    of compartimenten waaruit bepaalde pluimveeproducten mogen worden ingevoerd in
    en doorgevoerd door de Unie in verband met de ziekte van Newcastle
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/626 z dnia 7 maja 2020 r.
    zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w zakresie wpisu
    dotyczącego Republiki Macedonii Północnej w wykazie państw trzecich, terytoriów,
    stref lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez
    jej terytorium niektórych towarów drobiowych w związku z zakażeniem wirusem
    rzekomego pomoru drobiu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/626 da Comissão de 7 de maio de 2020
    que altera o anexo I do Regulamento (CE) n.o 798/2008 no que se refere à entrada
    relativa à República da Macedónia do Norte na lista de países terceiros, territórios,
    zonas ou compartimentos a partir dos quais são autorizados a importação e o
    trânsito na União de determinados produtos à base de aves de capoeira, relativamente
    à doença de Newcastle
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/626 al Comisiei din 7 mai
    2020 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Macedonia de Nord din lista țărilor terțe, teritoriilor,
    zonelor sau compartimentelor din care anumite produse avicole pot fi importate
    în Uniune sau pot tranzita Uniunea în relație cu boala Newcastle
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/626 zo 7. mája 2020, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Severomacedónskej republiky v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti so pseudomorom hydiny
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/626 z dne 7. maja 2020 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Republiko Severna Makedonija
    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih sta
    dovoljena uvoz nekaterega perutninskega blaga v Unijo ter njegov tranzit skozi
    Unijo v zvezi z atipično kokošjo kugo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/626 de la Comisión de 7 de mayo de
    2020 que modifica el anexo I del Reglamento (CE) n.o 798/2008 en lo referente
    a la entrada correspondiente a la República de Macedonia del Norte de la lista
    de terceros países, territorios, zonas o compartimentos desde los cuales están
    permitidos la importación en la Unión o el tránsito por esta de determinadas
    mercancías de aves de corral, en relación con la enfermedad de Newcastle
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/626 av den 7 maj 2020
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Nordmakedonien i förteckningen över tredjeländer, områden, zoner eller
