title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/626 of 7 May 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the Republic of
    North Macedonia in the list of third countries, territories, zones or compartments
    from which certain poultry commodities may be imported into or transit through
    the Union in relation to Newcastle disease
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/626 de la Commission du 7 mai 2020
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne l’entrée
    relative à la République de Macédoine du Nord dans la liste des pays tiers,
    territoires, zones ou compartiments en provenance desquels certains produits de
    volailles peuvent être importés dans l’Union ou transiter par celle-ci, pour
    ce qui est de la maladie de Newcastle
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/626 der Kommission vom 7. Mai 2020 zur
    Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des Eintrags
    zu Nordmazedonien in der Liste von Drittländern, Gebieten, Zonen und Kompartimenten,
    aus denen bestimmte Geflügelwaren in die Union eingeführt bzw. durch die Union
    durchgeführt werden dürfen, im Zusammenhang mit der Newcastle-Krankheit
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/626 на Комисията
    от 7 май 2020 година за изменение във връзка с
    нюкасълска болест на приложение I към Регламент
    (ЕО) № 798/2008 по отношение на вписването за Република
    Северна Македония в списъка на трети държави,
    територии, зони или компартменти, от които
    могат да бъдат внасяни или да преминават транзитно
    през територията на Съюза определени стоки,
    получени от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/626 ze dne 7. května 2020, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku týkající
    se Republiky Severní Makedonie na seznamu třetích zemí, území, oblastí
    nebo jednotek, z nichž lze do Unie dovážet nebo přes její území přepravovat
    určité drůbeží komodity v souvislosti s newcastleskou chorobou
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/626 af 7. maj 2020 om
    ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Republikken Nordmakedonien i listen over tredjelande, områder, zoner og segmenter,
    hvorfra import til eller transit gennem Unionen af visse fjerkræprodukter er
    tilladt i forbindelse med Newcastle disease
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/626 της Επιτροπής
    της 7ης Μαΐου 2020 για την τροποποίηση του παραρτήματος
    I του κανονισμού (ΕΚ) αριθ. 798/2008 όσον αφορά την
    καταχώριση της Δημοκρατίας της Βόρειας Μακεδονίας
    στον κατάλογο τρίτων χωρών, εδαφών, ζωνών ή
    διαμερισμάτων από τα οποία επιτρέπεται να
    εισαχθούν ή να διαμετακομιστούν μέσω της Ένωσης
    ορισμένα βασικά προϊόντα πουλερικών σε σχέση
    με την ψευδοπανώλη των πτηνών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/626, 7. mai 2020, millega muudetakse
    seoses Newcastle’i haigusega määruse (EÜ) nr 798/2008 I lisas esitatud kannet
    Põhja-Makedoonia Vabariigi kohta loetelus, milles on esitatud need kolmandad
    riigid, territooriumid, tsoonid ja piirkonnad, millest võib importida liitu või
    vedada läbi liidu teatavaid linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2020/626, annettu 7 päivänä
