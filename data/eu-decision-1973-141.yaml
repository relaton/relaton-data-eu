title:
- language: en
  script: Latn
  content: Commission Decision of 4 May 1973 authorizing the Italian Republic to allow
    the marketing of 'certified seed, 2nd generation' of the variety of rice 'Rosa
    Marchetti', subject to reduced requirements, until 30 June 1973 inclusive
  type: main
- language: fr
  script: Latn
  content: Décision 73/141/CEE de la Commission, du 4 mai 1973, autorisant la République
    italienne à admettre, jusqu'au 30 juin 1973 inclus, à la commercialisation des
    "semences certifiées" de la deuxième reproduction, de riz de la variété "Rosa
    Marchetti", soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Mai 1973 zur Ermächtigung der Italienischen
    Republik, bis zum 30. Juni 1973 einschließlich "Zertifiziertes Saatgut" der zweiten
    Vermehrung von Reis der Sorte "Rosa Marchetti" mit minderen Anforderungen zum
    Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. maj 1973 om bemyndigelse af Den italienske
    Republik til indtil den 30. juni 1973 inklusive at tillade, at sådant »certificeret
    såsæd« af enhver art af ris af sorten »Rosa Marchetti«, som er underkastet
    mindre strenge krav, bringes i handelen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 maggio 1973, che autorizza la Repubblica
    italiana ad ammettere, fino al 30 giugno 1973 incluso, la commercializzazione
    di» sementi certificate» della seconda riproduzione di riso della varietà «Rosa
    Marchetti», soggette a requisiti ridotti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 mei 1973 tot machtiging van de Italiaanse
    Republiek om tot en met 30 juni 1973 "gecertificeerd zaad" van de tweede vermeerdering
    van rijst van het ras "Rosa Marchetti", waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten
  type: main
