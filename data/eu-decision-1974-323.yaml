---
id: EUDecision1974323
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 June 1974 authorizing the Italian Republic not
    to apply Community treatment to outboard motors and parts thereof, falling within
    heading No 84.06 B and D ex II of the Common Customs Tariff, originating in Japan,
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 juin 1974, autorisant la République
    italienne à exclure du traitement communautaire les propulseurs spéciaux du
    type hors-bord et leurs pièces détachées, des positions 84.06 B et D Ex II
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Juni 1974, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Außenbordmotoren und deren Teile der Tarifnummern
    84.06 B und D ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. juni 1974 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage påhængsmotorer til både,
    og dele dertil, som henhørende under position 84.06 B og D ex II i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 giugno 1974, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i propulsori speciali del tipo
    fuoribordo e le loro parti e pezzi staccati, delle voci n. 84.06 B e D ex II della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 juni 1974 waarbij de Italiaanse Republiek
    wordt gemachtigd buitenboordmotoren en hun delen en onderdelen van posten 84.06
    B en D ex II van het gemeenschappelijk douanetarief, van oorsprong uit Japan en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
