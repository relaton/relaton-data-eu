title:
- language: en
  script: Latn
  content: '2014/774/EU: Commission Implementing Decision of 31 October 2014 determining,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council on fluorinated greenhouse gases, reference values for the period 1 January
    2015 to 31 December 2017 for each producer or importer who has reported placing
    on the market hydrofluorocarbons under Regulation (EC) No 842/2006 of the European
    Parliament and of the Council (notified under document C(2014) 7920)'
  type: main
- language: fr
  script: Latn
  content: '2014/774/UE: Décision d''exécution de la Commission du 31 octobre 2014
    établissant, conformément au règlement (UE) n ° 517/2014 du Parlement européen
    et du Conseil relatif aux gaz à effet de serre fluorés, les valeurs de référence
    pour la période du 1 er janvier 2015 au 31 décembre 2017 pour chaque producteur
    ou importateur ayant notifié la mise sur le marché d''hydrofluorocarbones conformément
    au règlement (CE) n ° 842/2006 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2014) 7920]'
  type: main
- language: de
