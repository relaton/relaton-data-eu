    Parlaments und des Rates über fluorierte Treibhausgase — der Referenzwerte
    für den Zeitraum vom 1. Januar 2015 bis zum 31. Dezember 2017 für jeden Hersteller
    oder Einführer, der nach Maßgabe der Verordnung (EG) Nr. 842/2006 des Europäischen
    Parlaments und des Rates das Inverkehrbringen von teilfluorierten Kohlenwasserstoffen
    mitgeteilt hat (Bekannt gegeben unter Aktenzeichen C(2014) 7920)'
