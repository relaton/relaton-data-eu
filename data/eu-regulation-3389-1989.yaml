title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3389/89 of 10 November 1989 re-establishing
    the levying of customs duties on gelatines and derivatives thereof falling within
    CN code 3503 00 10 originating in Pakistan to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3389/89 de la Commission du 10 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés du code NC 3503 00 10 originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3389/89 DER KOMMISSION vom 10. November 1989 zur
    Wiedereinführung der Erhebung der Zölle für Gelatine und ihre Derivate der
    KN-Code 3503 00 10 mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr.
    4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3389/89 af 10. november 1989 om genindførelse
    af told for gelatine og gelatinederivater, henhørende under KN-kode 3503 00 10
    og med oprindelse i Pakistan, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3389/89 της Επιτροπής
    της 10ης Νοεμβρίου 1989 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ζελατίνες
    και τα παράγωγά τους του κωδικού ΣΟ 3503 00 10, καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3389/89 DELLA COMMISSIONE del 10 novembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati
    del codice NC 3503 00 10 originari del Pakistan, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3389/89 VAN DE COMMISSIE van 10 november 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan, van GN-code 3503 00 10, van oorsprong uit Pakistan, waarvoor
    de in Verordening (EEG) nr. 4257/88 van de Raad vermelde tariefpreferenties zijn
    verleend #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3389/89 DA COMISSAO de 10 de Novembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis à gelatinas e seus
    derivados, do codigo NC 3503 00 10, originarios do Paquistao, beneficiario das
    preferências pautais previstas pelo Regulamento (CEE) n* 4257/88 do Conselho
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3389/89 DE LA COMISIÓN de 10 de noviembre de 1989
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a las gelatinas y sus derivados, de código NC 3503 00 10, originarios de Pakistán,
    beneficiario de las preferencias arancelarias previstas por el Reglamento (CEE)
    no 4257/88 del Consejo #'
