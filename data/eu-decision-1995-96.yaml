    von einigen Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '95/96/EF: KOMMISSIONENS BESLUTNING af 6. marts 1995 om bemyndigelse til
