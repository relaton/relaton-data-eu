    of fruit and vegetables from Peru'
  type: main
- language: fr
  script: Latn
  content: '91/601/CEE: Décision de la Commission du 12 novembre 1991 portant abrogation
    de la décision 91/147/CEE arrêtant une mesure de protection contre le choléra
    en matière d''importation de fruits et légumes du Pérou'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 12. November 1991 zur Aufhebung der Entscheidung
