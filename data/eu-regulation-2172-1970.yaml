title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2172/70 of the Council of 27 October 1970 extending
    to other imports the Annex to Regulation (EEC) No 109/70 establishing common rules
    for imports from state-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2172/70 du Conseil, du 27 octobre 1970, étendant
    à d' autres importations l' annexe du règlement (CEE) n° 109/70 portant établissement
    d' un régime commun applicable aux importations de pays à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2172/70 des Rates vom 27. Oktober 1970 zur Ausdehnung
    des Anhangs der Verordnung (EWG) Nr. 109/70 zur Festlegung einer gemeinsamen Regelung
    für die Einfuhr aus Staatshandelsländern auf weitere Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning nr. 2172/70/EØF af 27. oktober 1970 om udvidelse med
    yderligere varer af bilaget til forordning nr. 109/70/EØF om fastlæggelse af
    en fælles ordning af indførslen fra statshandelslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2172/70 del Consiglio, del 27 ottobre 1970, che estende
    ad altre importazioni l' allegato del regolamento (CEE) n. 109/70 che istituisce
    un regime comune applicabile alle importazioni dai paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2172/70 van de Raad van 27 oktober 1970 inzake de
    uitbreiding met nieuwe produkten van de bijlage van Verordening (EEG) nr. 109/70
    houdende totstandbrenging van een gemeenschappelijke regeling voor de invoer uit
    landen met staatshandel
  type: main
