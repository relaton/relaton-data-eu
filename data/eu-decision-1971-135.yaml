title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 mars 1971, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les chaussures pour hommes de la position Ex 64.02 du Tarif douanier
    commun, originaires de Roumanie et mises en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: '71/135/EWG: Entscheidung der Kommission vom 4. März 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus Rumänien stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Herrenschuhe der Tarifnummer ex 64.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/135/CEE: Decisione della Commissione, del 4 marzo 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    a escludere dal trattamento comunitario le scarpe per uomo, della voce ex 64.02
    della tariffa doganale comune, originarie della Romania e messe in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/135/EEG: Beschikking van de Commissie van 4 maart 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd herenschoenen van de post ex 64.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
