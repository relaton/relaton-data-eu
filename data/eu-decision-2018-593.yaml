    wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/593 do Conselho, de 16 de abril de 2018,
    que autoriza a República Italiana a introduzir uma medida especial em derrogação
    aos artigos 218.° e 232.° da Diretiva 2006/112/CE relativa ao sistema comum
    do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/593 a Consiliului din 16 aprilie
