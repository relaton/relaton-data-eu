    dell' organismo d' intervento italiano latte scremato in polvere destinato ad
    essere utilizzato conformemente al regolamento (CEE) n. 563/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3147/76 van de Commissie van 23 december 1976 houdende
