  content: Commission Regulation (EEC) No 3147/76 of 23 December 1976 amending Regulations
    (EEC) No 1948/76 and (EEC) No 2850/76 on the supply of skimmed-milk powder to
    the Italian intervention agency for use in accordance with Regulation (EEC) No
    563/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3147/76 de la Commission, du 23 décembre 1976, modifiant
    les règlements (CEE) n° 1948/76 et (CEE) n° 2850/76 relatifs à la mise à
    disposition de l' organisme d' intervention italien de lait écrémé en poudre
    destiné à être utilisé conformément au règlement (CEE) n° 563/76
  type: main
- language: de
  script: Latn
