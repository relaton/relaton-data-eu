    der italienischen Interventionsstelle mit Magermilchpulver, das zur Verwendung
    gemäß der Verordnung (EWG) Nr. 563/76 bestimmt ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3147/76 af 23. december 1976 om ændring
