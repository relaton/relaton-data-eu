    3925/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2029/87 della Commissione dell' 8 luglio 1987 che
    ripristina la riscossione dei dazi doganali applicabili alle etichette, filati
    di ciniglia, tulli e ricami della categoria di prodotti n. 62 (codice 40.0620),
    allo spago, corde e funi della categoria di prodotti n. 90 (codice 40.0900) originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2029/87 van de Commissie van 8 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op etiketten,
    chenillegaren, tule en borduurwerk van de categorie van produkten nr. 62 (codenummer
    40.0620) en bindgaren, touw en garens van de categorie van produkten nr. 90 (codenummer
    40.0900), van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2029/87 da Comissão de 8 de Julho de 1987 que restabelece
