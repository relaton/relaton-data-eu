title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2029/87 of 8 July 1987 re-establishing the
    levying of customs duties on labels, chenille yarn, tulle and embroidery, products
    of category 62 (code 40.0620), twine, cordage and ropes, products of category
    90 (code 40.0900) originating in South Korea to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2029/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux étiquettes,
    fils de chenille, tulles et broderies de la catégorie 62 (code 40.0620) et aux
    ficelles, cordes et cordages de la catégorie 90 (code 40.0900), originaires de
    la Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2029/87 der Kommission vom 8. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Etiketten, Chenillegarne, Tülle und Stickereien der Warenkategorie
    Nr. 62 (Kennziffer 40.0620) und Bindfäden, Seile und Taue der Warenkategorie
    Nr. 90 (Kennziffer 40.0900) mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2029/87 af 8. juli 1987 om genindførelse
    af opkrævning af toldafgifter for vævede etiketter, chenillegarn, tyl i motiver,
    under varekategori nr. 62 (kode 40.0620), sejlgarn, reb og tovværk, under varekategori
    nr. 90 (kode 40.0900), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2029/87 της Επιτροπής
    της 8ης Ιουλίου 1987 περί αποκαταστάσεως της
