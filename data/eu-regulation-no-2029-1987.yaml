    νήματα σενίλλης, τούλια και κεντήματα προϊόντα
    της κατηγορίας 62 (κωδικός 40.0620), τους σπάγγους,
    σχοινιά και χονδρά σχοινιά προϊόντα της κατηγορίας
    90 (κωδικός 40.0900), καταγωγής Νότιας Κορέας, δικαιούχου
