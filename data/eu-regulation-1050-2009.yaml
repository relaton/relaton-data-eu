- language: en
  script: Latn
  content: Commission Regulation (EC) No 1050/2009 of 28 October 2009 amending Annexes
    II and III to Regulation (EC) No 396/2005 of the European Parliament and of the
    Council as regards maximum residue levels for azoxystrobin, acetamiprid, clomazone,
    cyflufenamid, emamectin benzoate, famoxadone, fenbutatin oxide, flufenoxuron,
    fluopicolide, indoxacarb, ioxynil, mepanipyrim, prothioconazole, pyridalyl, thiacloprid
    and trifloxystrobin in or on certain products
  type: main
