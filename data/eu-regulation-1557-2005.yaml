  script: Latn
  content: Commission Regulation (EC) No 1557/2005 of 23 September 2005 determining
    the extent to which applications lodged in September 2005 for import licences
    under the regime provided for by tariff quotas for certain products in the pigmeat
    sector for the period 1 October to 31 December 2005 can be accepted
  type: main
- language: fr
  script: Latn
