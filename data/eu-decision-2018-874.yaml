    Europos Parlamento ir Tarybos reglamento (ES) Nr. 20/2013 15 straipsnį importuojamiems
    Nikaragvos kilmės bananams yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/874 tal-14 ta'
    Ġunju 2018 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali preferenzjali
    skont l-Artikolu 15 tar-Regolament (UE) Nru 20/2013 tal-Parlament Ewropew u tal-Kunsill
    mhijiex xierqa għal importazzjonijiet ta' banana li joriġinaw min-Nikaragwa
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/874 van de Commissie van 14 juni 2018 waarbij
    wordt bepaald dat een tijdelijke opschorting van het preferentiële douanerecht
    krachtens artikel 15 van Verordening (EU) nr. 20/2013 van het Europees Parlement
    en de Raad niet passend is voor de invoer van bananen van oorsprong uit Nicaragua
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/874 z dnia 14 czerwca 2018 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła na podstawie art. 15 rozporządzenia
    Parlamentu Europejskiego i Rady (UE) nr 20/2013 nie jest odpowiednie w odniesieniu
    do przywozu bananów pochodzących z Nikaragui
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/874 da Comissão, de 14 de junho de 2018,
    que determina que a suspensão temporária do direito aduaneiro preferencial,
    nos termos do disposto no artigo 15.° do Regulamento (UE) n.° 20/2013 do Parlamento
    Europeu e do Conselho, não é adequada para as importações de bananas originárias
    da Nicarágua
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/874 a Comisiei din 14 iunie 2018
    de stabilire a faptului că o suspendare temporară a taxei vamale preferențiale
    în temeiul articolului 15 din Regulamentul (UE) nr. 20/2013 al Parlamentului
    European și al Consiliului nu este adecvată pentru importurile de banane originare
    din Nicaragua
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/874 zo 14. júna 2018, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla podľa článku 15
    nariadenia Európskeho parlamentu a Rady (EÚ) č. 20/2013 nie je primerané pre
    dovoz banánov s pôvodom v Nikarague
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/874 z dne 14. junija 2018 o ugotovitvi,
    da začasna opustitev preferencialnih carin v skladu s členom 15 Uredbe (EU)
    št. 20/2013 ni primerna za uvoz banan s poreklom iz Nikaragve
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/874 de la Comisión, de 14 de junio de
    2018, por la que se determina que una suspensión temporal del arancel aduanero
    preferencial con arreglo al artículo 15 del Reglamento (UE) n.° 20/2013 del
    Parlamento Europeo y del Consejo no es apropiada para las importaciones de plátanos
    (bananas) originarios de Nicaragua
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/874 av den 14 juni 2018 om
    fastställande av att ett tillfälligt upphävande av förmånstullarna i enlighet
    med artikel 15 i Europaparlamentets och rådets förordning (EU) nr 20/2013 inte
    är lämpligt för import av bananer med ursprung i Nicaragua
