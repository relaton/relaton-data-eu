    e del Consiglio non è appropriata per quanto riguarda le importazioni di banane
    originarie del Nicaragua
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/874 (2018. gada 14. jūnijs),
    ar ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar Eiropas Parlamenta un Padomes Regulas (ES) Nr. 20/2013 15. pantu,
    attiecībā uz Nikaragvas izcelsmes banānu importu nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2018 m. birželio 14 d. Komisijos įgyvendinimo sprendimas (ES) 2018/874,
