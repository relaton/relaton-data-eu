    nõukogu määruse (EL) nr 20/2013 artikli 15 kohase) soodustollimaksu ajutine
    peatamine ei ole asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/874, annettu 14 päivänä
    kesäkuuta 2018, sen määrittämisestä, että Euroopan parlamentin ja neuvoston
    asetuksen (EU) N:o 20/2013 15 artiklan mukainen etuustullin väliaikainen suspendoiminen
    ei ole tarpeen Nicaraguasta peräisin olevien banaanien tuonnissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/874 оd 14. lipnja 2018. kojom se
    utvrđuje da privremena obustava povlaštenih carina utvrđena na temelju članka
    15. Uredbe (EU) br. 20/2013 Europskog parlamenta i Vijeća nije primjerena za
    uvoz banana podrijetlom iz Nikaragve
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/874 végrehajtási határozata (2018. június 14.)
    a Nicaraguából származó banán behozatalára a 20/2013/EU európai parlamenti
