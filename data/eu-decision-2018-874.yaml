title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/874 of 14 June 2018 determining
    that a temporary suspension of the preferential customs duty pursuant to Article
    15 of Regulation (EU) No 20/2013 of the European Parliament and of the Council
    is not appropriate for imports of bananas originating in Nicaragua
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/874 de la Commission du 14 juin 2018 déterminant
    qu'une suspension temporaire du droit de douane préférentiel au titre de l'article
    15 du règlement (UE) n° 20/2013 du Parlement européen et du Conseil n'est pas
    appropriée dans le cas des importations de bananes originaires du Nicaragua
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/874 der Kommission vom 14. Juni 2018
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls nach
    Artikel 15 der Verordnung (EU) Nr. 20/2013 des Europäischen Parlaments und des
    Rates für Einfuhren von Bananen mit Ursprung in Nicaragua nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/874 на Комисията
    от 14 юни 2018 година за определяне на временното
    спиране на прилагането на преференциалното
    мито по член 15 от Регламент (ЕС) № 20/2013 на Европейския
    парламент и на Съвета за нецелесъобразно по
    отношение на вноса на банани с произход от
    Никарагуа
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/874 ze dne 14. června 2018,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    článku 15 nařízení Evropského parlamentu a Rady (EU) č. 20/2013 není vhodné
    pro dovoz banánů pocházejících z Nikaraguy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/874 af 14. juni 2018
    om fastsættelse af, at en midlertidig suspension af den præferencetold, som
    er fastsat i henhold til artikel 15 i Europa-Parlamentets og Rådets forordning
    (EU) nr. 20/2013, ikke er hensigtsmæssig for import af bananer med oprindelse
    i Nicaragua
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/874 της Επιτροπής,
    της 14ης Ιουνίου 2018, η οποία ορίζει ότι η προσωρινή
    αναστολή του προτιμησιακού δασμού, σύμφωνα
    με το άρθρο 15 του κανονισμού (ΕΕ) αριθ. 20/2013 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου,
    δεν είναι σκόπιμη για τις εισαγωγές μπανανών
    καταγωγής Νικαράγουας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/874, 14. juuni 2018, milles sätestatakse,
