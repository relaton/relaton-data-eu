---
id: EURegulation24742000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2474/2000 of 9 November 2000 establishing, pursuant
    to Article 1(7) of Regulation (EEC) No 3030/93, the list of textiles and clothing
    products to be integrated into GATT 1994 on 1 January 2002 and amending Annex
    X to Regulation (EEC) No 3030/93 and Annex II to Regulation (EC) No 3285/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2474/2000 du Conseil du 9 novembre 2000 établissant,
    conformément à l'article 1er , paragraphe 7, du règlement (CEE) nº 3030/93,
    la liste des produits textiles et des vêtements à incorporer le 1er janvier
    2002 à l'accord général sur les tarifs douaniers et le commerce de 1994, et
    modifiant l'annexe X du règlement (CEE) nº 3030/93 et l'annexe II du règlement
    (CE) nº 3285/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2474/2000 des Rates vom 9. November 2000 über die
    gemäß Artikel 1 Absatz 7 der Verordnung (EWG) Nr. 3030/93 am 1. Januar 2002
    in das GATT 1994 einzubeziehenden Textil- und Bekleidungswaren und zur Änderung
    des Anhangs X der Verordnung (EWG) Nr. 3030/93 und des Anhangs II der Verordnung
    (EG) Nr. 3285/94
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2474/2000 на Съвета от 9 ноември
    2000 година за създаване, в съответствие с член
    1, параграф 7 от Регламент (ЕИО) № 3030/93, на списъка
    на текстилните стоки и дрехите, който трябва
    да бъде включен в ГАТТ от 1994 година на 1 януари
    2002 г., и за изменение на приложение X към Регламент
    (ЕИО) № 3030/93 и приложение II към Регламент (ЕО)
    № 3285/94
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2474/2000 ze dne 9. listopadu 2000, kterým se
    na základě čl. 1 odst. 7 nařízení (EHS) č. 3030/93 stanoví seznam textilních
    a oděvních výrobků, které mají být ke dni 1. ledna 2002 začleněny do
    rámce GATT 1994, a kterým se mění příloha X nařízení (EHS) č. 3030/93
    a příloha II nařízení (ES) č. 3285/94
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2474/2000 af 9. november 2000 om opstilling
    i henhold til artikel 1, stk. 7, i forordning (EØF) nr. 3030/93 af listen over
    tekstilvarer og beklædningsgenstande, der skal integreres i GATT 1994 pr. 1.
    januar 2002, og om ændring af bilag X til forordning (EØF) nr. 3030/93 og bilag
    II til forordning (EF) nr. 3285/94
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2474/2000 του Συμβουλίου,
    της 9ης Νοεμβρίου 2000, για την κατάρτιση, σύμφωνα
    με το άρθρο 1 παράγραφος 7 του κανονισμού (ΕΟΚ)
    αριθ. 3030/93, του καταλόγου των κλωστοϋφαντουργικών
    προϊόντων και ειδών ένδυσης που πρόκειται
    να ενσωματωθούν στη ΓΣΔΕ 1994 την 1η Ιανουαρίου
    2002 και για την τροποποίηση του παραρτήματος
    Χ του κανονισμού (ΕΟΚ) αριθ. 3030/93 και του παραρτήματος
    ΙΙ του κανονισμού (ΕΚ) αριθ. 3285/94
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2474/2000, 9. november 2000, millega kehtestatakse
    määruse (EMÜ) nr 3030/93 artikli 1 lõike 7 alusel tekstiil- ja rõivatoodete
    nimekiri, mille suhtes kohaldatakse 1. jaanuarist 2002 GATT 1994 tavaeeskirju,
    ja muudetakse määruse (EMÜ) nr 3030/93 X lisa ning määruse (EÜ) nr 3285/94
    II lisa
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2474/2000, annettu 9 päivänä marraskuuta 2000,
    asetuksen (ETY) N:o 3030/93 1 artiklan 7 kohdan mukaisesti 1 päivänä tammikuuta
    2002 GATT 1994 -sopimukseen sisällytettävien tekstiili- ja vaatetustuotteiden
    luettelon vahvistamisesta ja asetuksen (ETY) N:o 3030/93 liitteen X ja asetuksen
    (EY) N:o 3285/94 liitteen II muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 2474/2000 od 9. studenoga 2000. o utvrđivanju
    popisa tekstilnih proizvoda i odjevnih predmeta koje sukladno članku 1. stavku
    7. Uredbe (EEZ) br. 3030/93 1. siječnja 2002. treba uvrstiti u GATT iz 1994.,
    i o izmjeni Priloga X. Uredbi (EEZ) br. 3030/93 i Priloga II. Uredbi (EZ) br.
    3285/94
  type: main
- language: hu
  script: Latn
  content: A Tanács 2474/2000/EK rendelete (2000. november 9.) a textil- és ruházati
    termékeknek az 1994. évi Általános Vám- és Kereskedelmi Egyezménybe 2002.
    január 1-jével beépítendő jegyzékének a 3030/93/EGK rendelet 1. cikkének
    (7) bekezdése alapján történő megállapításáról és a 3030/93/EGK rendelet
    X. mellékletének, valamint a 3285/94/EK rendelet II. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2474/2000 del Consiglio, del 9 novembre 2000, che stabilisce,
    a norma dell'articolo 1, paragrafo 7, del regolamento (CEE) n. 3030/93, l'elenco
    dei prodotti tessili e dell'abbigliamento da integrare nel GATT 1994 il 1° gennaio
    2002 e che modifica l'allegato X del regolamento (CEE) n. 3030/93 e l'allegato
    II del regolamento (CE) n. 3285/94
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2474/2000 (2000. gada 9. novembris), ar ko atbilstīgi
    Regulas (EEK) Nr. 3030/93 1. panta 7. punktam izveido to tekstilizstrādājumu
    un apģērbu sarakstu, uz kuriem no 2002. gada 1. janvāra attiecināma Vispārējā
    vienošanās par tarifiem un tirdzniecību (VVTT 1994), un ar ko groza Regulas
    (EEK) Nr. 3030/93 X pielikumu un Regulas (EK) Nr. 3285/94 II pielikumu
  type: main
- language: lt
  script: Latn
  content: 2000 m. lapkričio 9 d. Komisijos reglamentas (EB) Nr. 2474/2000 nustatantis
    tekstilės ir aprangos gaminių, kuriems, vadovaujantis Reglamento (EEB) Nr. 3030/93
    1 straipsnio 7 dalimi, nuo 2002 m. sausio 1 d. taikomas 1994 m. GATT, sąrašą
    ir iš dalies keičiantis Reglamento (EEB) Nr. 3030/93 X priedą bei Reglamento
    (EB) Nr. 3285/94 II priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2474/2000 tad-9 ta' Novembru 2000 li
    jistabbilixxi, skond l-Artikolu 1(7) tar-Regolament (KEE) Nru 3030/93, il-lista
    ta' prodotti tat-tessuti li għandhom jiġu integrati fil-qafas tal-GATT 1994
    fl-1 ta' Jannar 2002 u li jemenda l-Anness X tar-Regolament (KE) Nru 3030/93 u
    l-Anness II tar-Regolament (KE) Nru 3285/94
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2474/2000 van de Raad van 9 november 2000 tot vaststelling,
    overeenkomstig artikel 1, lid 7, van Verordening (EEG) nr. 3030/93, van de lijst
    van textiel- en kledingproducten die op 1 januari 2002 dienen te worden geïntegreerd
    in de GATT 1994 en tot wijziging van bijlage X bij Verordening (EEG) nr. 3030/93
    en bijlage II bij Verordening (EG) nr. 3285/94
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2474/2000 z dnia 9 listopada 2000 r. ustanawiające
    na podstawie art. 1 ust. 7 rozporządzenia (EWG) nr 3030/93 wykaz wyrobów włókienniczych
    i odzieżowych, które zostaną włączone do GATT 1994 dnia 1 stycznia 2002 r.
    oraz zmieniające załącznik X do rozporządzenia (EWG) nr 3030/93 i załącznik
    II do rozporządzenia (WE) nr 3285/94
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2474/2000 do Conselho, de 9 de Novembro de 2000, que
    estabelece, em conformidade com o n.o 7 do artigo 1.o do Regulamento (CEE) n.o
    3030/93, a lista dos produtos têxteis e de vestuário a integrar no GATT de 1994
    em 1 de Janeiro de 2002 e que altera o anexo X do Regulamento (CEE) n.o 3030/93
    e o anexo II do Regulamento (CE) n.o 3285/94
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2474/2000 al Consiliului din 9 noiembrie 2000 de
    stabilire, în temeiul articolului 1 alineatul (7) din Regulamentul (CEE) nr.
    3030/93, a listei produselor textile și confecțiilor ce urmează a fi integrate
    la 1 ianuarie 2002 în Acordul General pentru Tarife și Comerț din 1994 și
    de modificare a anexei X la Regulamentul (CEE) nr. 3030/93 și a anexei II la
    Regulamentul (CE) nr. 3285/94
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2474/2000 z 9. novembra 2000, ktorým sa podľa
    článku 1 ods. 7 nariadenia (EHS) č. 3030/93 stanovuje zoznam textilných a
    odevných výrobkov, ktoré sa k 1. januáru 2002 zaradia do GATT 1994, a ktorým
    sa mení a dopĺňa príloha X k nariadeniu (EHS) č. 3030/93 a príloha II k
    nariadeniu (ES) č. 3285/94
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) 2474/2000 z dne 9. novembra 2000 o določitvi, na podlagi
    člena 1(7) Uredbe (EGS) 3030/93, seznama tekstilnih izdelkov in oblačil za vključitev
    v GATT 1994 dne 1. januarja 2002 in o spremembah Priloge X Uredbe (EGS) 3030/93
    in Priloge II Uredbe (ES) 3285/94
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2474/2000 del Consejo, de 9 de noviembre de 2000, por
    el que se establece, de conformidad con el apartado 7 del artículo 1 del Reglamento
    (CEE) nº 3030/93, la lista de materias textiles y prendas de vestir que deben
    integrarse en el GATT 1994 el 1 de enero de 2002 y por el que se modifican el
    anexo X del Reglamento (CEE) nº 3030/93 y el anexo II del Reglamento (CE) nº
    3285/94
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2474/2000 av den 9 november 2000 om fastställande
    enligt artikel 1.7 i förordning (EEG) nr 3030/93 av den förteckning över textil-
    och konfektionsprodukter som den 1 januari 2002 skall införlivas i GATT 1994
    och om ändring av bilaga X till förordning (EEG) nr 3030/93 och bilaga II till
    förordning (EG) nr 3285/94
