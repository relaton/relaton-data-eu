---
id: EUDecision1993425
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '93/425/EEC: Commission Decision of 14 July 1993 establishing that the
    exploitation of geographical areas for the purpose of exploring for or extracting
    oil or gas does not constitute in the United Kingdom an activity defined in Article
    2 (2) (b) (i) of Council Directive 90/531/EEC of 17 September 1990 and that entities
    carrying on such an activity are not to be considered in the United Kingdom as
    operating under special or exclusive rights within the meaning of Article 2 (3)
    (b) of the Directive (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/425/CEE: Décision de la Commission du 14 juillet 1993 constatant que
    l''exploitation d''aires géographiques dans le but de prospecter ou d''extraire
    du pétrole ou du gaz ne constitue pas au Royaume-Uni une activité visée à
    l''article 2 paragraphe 2 point b) i) de la directive 90/531/CEE du Conseil et
    que les entités exerçant cette activité ne sont pas considérées au Royaume-Uni
    comme bénéficiant de droits spéciaux ou exclusifs au sens de l''article 2 paragraphe
    3 point b) de cette directive (Le texte en langue anglaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '93/425/EWG: ENTSCHEIDUNG DER KOMMISSION vom 14. Juli 1993 wonach die Nutzung
    eines geographisch abgegrenzten Gebiets zum Zweck der Suche nach oder der Förderung
    von Öl oder Gas im Vereinigten Königreich nicht als Tätigkeit im Sinne von
    Artikel 2 Absatz 2 Buchstabe b) Ziffer i) der Richtlinie 90/531/EWG des Rates
    gilt und die eine solche Tätigkeit ausübenden Auftraggeber im Vereinigten Königreich
    als nicht im Besitz von besonderen oder ausschließlichen Rechten im Sinne von
    Artikel 2 Absatz 3 Buchstabe b) der genannten Richtlinie gelten (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/425/EØF: KOMMISSIONENS BESLUTNING af 14. juli 1993 om konstatering
    af, at udnyttelse af geografiske områder med henblik på efterforskning efter
    eller udvinding af olie eller gas i Det Forenede Kongerige ikke udgør virksomhed,
    der er omhandlet i artikel 2, stk. 2, litra b), nr. i), i Rådets direktiv 90/531/EØF,
    og at de foretagender, der driver denne virksomhed, ikke i Det Forenede Kongerige
    anses for at have særlige eller eksklusive rettigheder i henhold til artikel
    2, stk. 3, litra b), i dette direktiv (Kun den engelske tekst er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/425/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 14ης
    Ιουλίου 1993 με την οποία ορίζεται ότι η εκμετάλλευση
    γεωργικών περιοχών με σκοπό την ανεύρεση πετρελαίου
    ή αερίου, καθώς και την άντληση ή τη συλλογή
    τους αντιστοίχως, δεν θεωρείται στο Ηνωμένο
    Βασίλειο ως δραστηριότητα αναφερόμενη στο
    άρθρο 2 παράγραφος 2 στοιχείο β) σημείο i) της
    οδηγίας 90/531/ΕΟΚ του Συμβουλίου της 17ης Σεπτεμβρίου
    1990 και ότι οι φορείς που ασκούν τις δραστηριότητες
    αυτές δεν θεωρείται στο Ηνωμένο Βασίλειο ότι
    απολαύουν ειδικών ή αποκλειστικών δικαιωμάτων
    κατά την έννοια του άρθρου 2 παράγραφος 3 στοιχείο
    β) της εν λόγω οδηγίας (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/425/CEE: DECISIONE DELLA COMMISSIONE del 14 luglio 1993 che constata
    che lo sfruttamento di aree geografiche ai fini della prospezione o dell'' estrazione
    di petrolio o di gas naturale non costituisce nel Regno Unito un'' attività di
    cui all'' articolo 2, paragrafo 2, lettera b), punto i) della direttiva 90/531/CEE
    del Consiglio e che gli enti che esercitano tale attività non sono considerati
    nel Regno Unito fruire di diritti speciali o esclusivi ai sensi dell'' articolo
    2, paragrafo 3, lettera b) di detta direttiva (Il testo in lingua inglese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/425/EEG: BESCHIKKING VAN DE COMMISSIE van 14 juli 1993 waarbij wordt
    vastgesteld dat de exploitatie van geografische gebieden met het oogmerk van prospectie
    of winning van aardolie of gas in het Verenigd Koninkrijk niet een activiteit
    vormt zoals bedoeld in artikel 2, lid 2, onder b), punt i), van Richtlijn 90/531/EEG
    van de Raad en dat diensten die een zodanige activiteit uitoefenen in het Verenigd
    Koninkrijk niet worden geacht bijzondere of uitsluitende rechten te genieten in
    de zin van artikel 2, lid 3, onder b), van de richtlijn (Slechts de tekst in de
    Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/425/CEE: Decisão da Comissão de 14 de Julho de 1993 que determina
    que a exploração de áreas geográficas com o objectivo de prospectar ou extrair
    petróleo ou gás não seja considerada no Reino Unido como uma actividade referida
    no no 2, alínea b), subalínea i), do artigo 2o da Directiva 90/531/CEE do Conselho,
    e que as entidades que exerçam tal actividade não devem ser consideradas no
    Reino Unido beneficiárias de direitos especiais ou exclusivos na acepção do
    no 3, alínea b), do artigo 2o da referida Directiva (Apenas faz fé o texto em
    língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '93/425/CEE: DECISIÓN DE LA COMISIÓN de 14 de julio de 1993 por la que
    se establece que la explotación o extracción de petróleo o gas en el Reino
    Unido no se considera como una actividad contemplada en el inciso i) del punto
    b) del apartado 2 del artículo 2 de la Directiva 90/531/CEE del Consejo y que
    las entidades que ejerzan tal actividad no se consideran en el Reino Unido beneficiarias
    de derechos especiales o exclusivos a efectos de lo previsto en la letra b) del
    apartado 3 del artículo 2 de dicha Directiva (El texto en lengua inglesa es el
    único auténtico)'
  type: main
