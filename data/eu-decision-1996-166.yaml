title:
- language: en
  script: Latn
  content: '96/166/EC: Commission Decision of 12 February 1996 amending Decision 94/278/EC,
    drawing up a list of third countries from which Member States authorize imports
    of certain products subject to Council Directive 92/118/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/166/CE: Décision de la Commission, du 12 février 1996, modifiant
    la décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '96/166/EG: Entscheidung der Kommission vom 12. Februar 1996 zur Änderung
    der Entscheidung 94/278/EG zur Festlegung der Listen von Drittländern, aus denen
    die Mitgliedstaaten die Einfuhr von bestimmten Erzeugnissen der Richtlinie 92/118/EWG
    des Rates zulassen'
  type: main
- language: da
  script: Latn
  content: '96/166/EF: Kommissionens beslutning af 12. februar 1996 om ændring af
    beslutning 94/278/EF om listen over tredjelande, hvorfra medlemsstaterne tillader
    indførsel af en række produkter omhandlet i Rådets direktiv 92/118/EØF'
  type: main
- language: el
  script: Grek
  content: '96/166/ΕΚ: Απόφαση της Επιτροπής, της 12ης Φεβρουαρίου
    1996, για την τροποποίηση της απόφασης 94/278/ΕΚ
    με την οποία καταρτίζεται πίνακας των τρίτων
    χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    εισαγωγές ορισμένων προϊόντων τα οποία υπάγονται
    στην οδηγία 92/118/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '96/166/EY: Komission päätös, tehty 12 päivänä helmikuuta 1996, luettelosta
    kolmansista maista, joista jäsenvaltiot sallivat tiettyjen neuvoston direktiivissä
    92/118/ETY tarkoitettujen tuotteiden tuonnin, tehdyn päätöksen 94/278/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/166/CE: Decisione della Commissione, del 12 febbraio 1996, che modifica
    la decisione 94/278/CE che stabilisce l''elenco dei paesi terzi da cui gli Stati
    membri autorizzano l''importazione di taluni prodotti disciplinati dalla direttiva
    92/118/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '96/166/EG: Beschikking van de Commissie van 12 februari 1996 houdende
    wijziging van Beschikking 94/278/EG tot vaststelling van de lijst van derde landen
    waaruit de Lid-Staten de invoer van bepaalde produkten als bedoeld bij Richtlijn
    92/118/EEG van de Raad toestaan'
  type: main
- language: pt
  script: Latn
  content: '96/166/CE: Decisão da Comissão, de 12 de Fevereiro de 1996, que altera
    a Decisão 94/278/CE, que estabelece uma lista de países terceiros dos quais
    os Estados-membros autorizam a importação de determinados produtos abrangidos
    pela Directiva 92/118/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '96/166/CE: Decisión de la Comisión, de 12 de febrero de 1996, que modifica
    la Decisión 94/278/CE por la que se establece la lista de los terceros países
    desde los que los Estados miembros autorizan la importación de ciertos productos
    contemplados en la Directiva 92/118/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '96/166/EG: Kommissionens beslut av den 12 februari 1996 om ändring av
    beslut 94/278/EG, om upprättande av en förteckning över de tredje länder från
    vilka medlemsstater får importera vissa produkter som omfattas av rådets direktiv
    92/118/EEG'
  type: main
