title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 127/2006 of 25 January 2006 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in January 2006 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for Bulgaria and Romania
  type: main
- language: fr
  script: Latn
