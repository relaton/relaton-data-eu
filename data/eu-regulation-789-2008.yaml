  content: Council Regulation (EC) No 789/2008 of 24 July 2008 amending Regulation
    (EC) No 1911/2006 imposing a definitive anti-dumping duty on imports of solutions
    of urea and ammonium nitrate originating in Algeria, Belarus, Russia and Ukraine
    following an expiry review pursuant to Article 11(2) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
