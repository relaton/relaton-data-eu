---
id: EURegulation16222000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1622/2000 of 24 July 2000 laying down certain
    detailed rules for implementing Regulation (EC) No 1493/1999 on the common organisation
    of the market in wine and establishing a Community code of oenological practices
    and processes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1622/2000 de la Commission du 24 juillet 2000 fixant
    certaines modalités d'application du règlement (CE) nº 1493/1999 portant organisation
    commune du marché vitivinicole, et instituant un code communautaire des pratiques
    et traitements oenologiques
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1622/2000 der Kommission vom 24. Juli 2000 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1493/1999 über die gemeinsame Marktorganisation für
    Wein und zur Einführung eines Gemeinschaftskodex der önologischen Verfahren
    und Behandlungen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 1622/2000 на Комисията oт 24 юли
    2000 година относно определяне на някои подробни
    правила за прилагане на Регламент (EО) № 1493/1999
    относно общата организация на пазара на вино
    и за установяване на кодекс на Общността на
    eнологичните практики и обработки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1622/2000 ze dne 24. července 2000, kterým
    se stanoví některá prováděcí pravidla k nařízení (ES) č. 1493/1999 o
    společné organizaci trhu s vínem a zavádí se kodex Společenství pro enologické
    postupy a ošetření
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1622/2000 af 24. juli 2000 om visse gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1493/1999 om den fælles markedsordning for vin,
    og om en EF-kodeks for ønologiske fremgangsmåder og behandlingsmetoder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1622/2000 της Επιτροπής
    της 24ης Ιουλίου 2000 για τον καθορισμό ορισμένων
    λεπτομερειών εφαρμογής του κανονισμού (EK) αριθ.
    1493/1999, για την κοινή οργάνωση της αμπελοοινικής
    αγοράς και για την καθιέρωση κοινοτικού κώδικα
    των οινολογικών πρακτικών και επεξεργασιών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1622/2000, 24. juuli 2000, milles sätestatakse
    veinituru ühist korraldust käsitleva määruse (EÜ) nr 1493/1999 üksikasjalikud
    rakenduseeskirjad ning kehtestatakse ühenduse eeskiri veinivalmistustavade ja
    -menetluste kohta
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1622/2000 annettu 24 heinäkuuta 2000 viinin
    yhteisestä markkinajärjestelystä annetun asetuksen (EY) N:o 1493/1999 soveltamista
    koskevista yksityiskohtaisista säännöistä sekä viininvalmistusmenetelmiä
    ja -käsittelyjä koskevista yhteisön säännöistä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1622/2000/EK rendelete (2000. július 24.) a borpiac közös
    szervezéséről szóló 1493/1999/EK tanácsi rendelet végrehajtása egyes részletes
    szabályainak megállapításáról, valamint a borászati eljárások és kezelések
    közösségi kódexének létrehozásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1622/2000 della Commissione del 24 luglio 2000 che
    fissa talune modalità d'applicazione del regolamento (CE) n. 1493/1999 relativo
    all'organizzazione comune del mercato vitivinicolo e che istituisce un codice
    comunitario delle pratiche e dei trattamenti enologici
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1622/2000 (2000. gada 24. jūlijs), kas nosaka
    konkrētus sīki izstrādātus noteikumus Regulas (EK) Nr. 1493/1999 par vīna
    tirgus kopējo organizāciju ieviešanai un kas izveido Kopienas enoloģiskās
    prakses un procesu kodeksu
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 24 d. Komisijos reglamentas (EB) Nr. 1622/2000, nustatantis
    tam tikras išsamias Reglamento (EB) Nr. 1493/1999 dėl bendro vyno rinkos organizavimo
    įgyvendinimo taisykles ir nustatantis Bendrijos vynininkystės metodų bei procesų
    kodeksą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1622/2000 ta' l-24 ta' Lulju 2000
    li jistabbilixxi r-regoli dettaljati għall-implimentazzjoni tar-Regolament (KE)
    Nru 1493/1999 dwar l-organizzazzjoni komuni tas-suq ta' l-inbid u li jistabbilixxi
    kodiċi tal-Komunità ta' prattiċi u proċessi oenoloġiċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1622/2000 van de Commissie van 24 juli 2000 tot vaststelling
    van uitvoeringsbepalingen van Verordening (EG) nr. 1493/1999 houdende een gemeenschappelijke
    ordening van de wijnmarkt, en tot instelling van een communautaire regeling inzake
    oenologische procédés en behandelingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1622/2000 z dnia 24 lipca 2000 r. ustanawiające
    niektóre szczegółowe zasady wykonania rozporządzenia (WE) nr 1493/1999 w sprawie
    wspólnej organizacji rynku wina oraz wspólnotowy kodeks praktyk i procesów
    enologicznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1622/2000 da Comissão de 24 de Julho de 2000 que
    estabelece determinadas normas de execução do Regulamento (CE) n.o 1493/1999,
    que estabelece a organização comum do mercado vitivinícola, e constitui um
    código comunitário das práticas e tratamentos enológicos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1622/2000 al Comisiei din 24 iulie 2000 de stabilire
    a anumitor norme de aplicare a Regulamentului (CE) nr. 1493/1999 privind organizarea
    comună a pieței vitivinicole și de stabilire a unui cod comunitar al practicilor
    și tratamentelor oenologice
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1622/2000 zo dňa 24. júla 2000 ustanovujúce
    niektoré podrobné pravidlá na uplatňovanie nariadenia (ES) č. 1493/1999 o
    spoločnej organizácii trhu s vínom a ustanovujúce Zákonník spoločenstva
    pre vinárske (oenologické) postupy a procesy
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1622/2000 z dne 24. julija 2000 o določitvi
    nekaterih podrobnih pravil za izvajanje Uredbe (ES) št. 1493/1999 o skupni ureditvi
    trga za vino in vzpostavitvi kodeksa Skupnosti na področju enoloških postopkov
    in obdelav
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1622/2000 de la Comisión de 24 de julio de 2000 que
    fija determinadas disposiciones de aplicación del Reglamento (CE) nº 1493/1999,
    por el que se establece la organización común del mercado vitivinícola, e introduce
    un código comunitario de prácticas y tratamientos enológicos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1622/2000 av den 24 juli 2000 om vissa
    tillämpningsföreskrifter för förordning (EG) nr 1493/1999 om den gemensamma
    organisationen av marknaden för vin och införandet av en gemenskapskodex för
    oenologiska metoder och behandlingar
  type: main
