    pakomitetyje, Prekybos ir darnaus vystymosi pakomitetyje, Muitinės pakomitetyje
    ir Geografinių nuorodų pakomitetyje, įsteigtuose vadovaujantis Europos Sąjungos
    ir Europos atominės energijos bendrijos bei jų valstybių narių ir Ukrainos
    asociacijos susitarimu, dėl tų pakomitečių darbo tvarkos taisyklių priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2017/189 tas-16 ta' Jannar 2017 dwar il-pożizzjonijiet
    li għandhom jiġu adottati f'isem l-Unjoni Ewropea fis-Sottokumitat ta' Ġestjoni
    Sanitarja u Fitosanitarja, fis-Sottokumitat tal-Kummerċ u l-Iżvilupp Sostenibbli,
    fis-Sottokumitat Doganali u fis-Sottokumitat dwar l-Indikazzjonijiet Ġeografiċi
    stabbiliti bis-saħħa tal-Ftehim ta' Assoċjazzjoni ejn l-Unjoni Ewropea u l-Komunità
