  script: Latn
  content: A Tanács (EU) 2017/189 határozata (2017. január 16.) az egyrészről
    az Európai Unió, az Európai Atomenergia-közösség és tagállamaik, másrészről
    Ukrajna közötti társulási megállapodás alapján létrehozott állat-egészségügyi
    és növényegészségügyi intézkedésekkel foglalkozó albizottságban, a kereskedelemmel
    és a fenntartható fejlődéssel foglalkozó albizottságban, a vámügyekkel
    foglalkozó albizottságban és a földrajzi árujelzőkkel foglalkozó albizottságban
    az említett albizottságok eljárási szabályzatának elfogadásával kapcsolatban
    az Európai Unió által képviselendő álláspontokról
  type: main
- language: it
  script: Latn
