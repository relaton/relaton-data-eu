    Украйна, от друга страна, във връзка с приемането
    на процедурните правилници на посочените подкомитети
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2017/189 ze dne 16. ledna 2017 o postoji, který
    má být zaujat jménem Unie v Podvýboru pro sanitární a fytosanitární správu,
    Podvýboru pro obchod a udržitelný rozvoj, Podvýboru pro cla a Podvýboru pro
    zeměpisná označení zřízených Dohodou o přidružení mezi Evropskou unií
    a Evropským společenstvím pro atomovou energii a jejich členskými státy
    na jedné straně a Ukrajinou na straně druhé, pokud jde o schválení jednacích
    řádů těchto podvýborů
  type: main
