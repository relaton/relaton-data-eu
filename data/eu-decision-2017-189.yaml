title:
- language: en
  script: Latn
  content: Council Decision (EU) 2017/189 of 16 January 2017 on the positions to be
    adopted on behalf of the European Union within the Sanitary and Phytosanitary
    Management Sub-Committee, the Trade and Sustainable Development Sub-Committee,
    the Customs Sub-Committee and the Sub-Committee on Geographical Indications established
    pursuant to the Association Agreement between the European Union and the European
    Atomic Energy Community and their Member States, of the one part, and Ukraine,
    of the other part, as regards the adoption of the Rules of Procedure of those
    Sub-Committees
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/189 du Conseil du 16 janvier 2017 relative aux positions
    à prendre, au nom de l'Union européenne, au sein du sous-comité de gestion
    des mesures sanitaires et phytosanitaires, du sous-comité concernant le commerce
    et le développement durable, du sous-comité douanier et du sous-comité concernant
    les indications géographiques institués en vertu de l'accord d'association entre
    l'Union européenne et la Communauté européenne de l'énergie atomique et leurs
    États membres, d'une part, et l'Ukraine, d'autre part, en ce qui concerne l'adoption
    du règlement intérieur desdits sous-comités
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/189 des Rates vom 16. Januar 2017 über die im Namen
    der Europäischen Union in den mit dem Assoziierungsabkommen zwischen der Europäischen
    Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits
    und der Ukraine andererseits eingesetzten Unterausschüssen „Gesundheitspolizeiliche
    und pflanzenschutzrechtliche Maßnahmen“, „Handel und nachhaltige Entwicklung“,
    „Zoll“ und „Geografische Angaben“ im Hinblick auf die Annahme der Geschäftsordnungen
    jener Unterausschüsse zu vertretenden Standpunkte
  type: main
- language: bg
  script: Cyrl
