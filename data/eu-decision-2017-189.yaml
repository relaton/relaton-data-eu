    ta' dawk is-Sottokumitati
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2017/189 van de Raad van 16 januari 2017 inzake de namens
    de Europese Unie in te nemen standpunten in het Subcomité voor sanitaire en fytosanitaire
    maatregelen, het Subcomité handel en duurzame ontwikkeling, het Subcomité douane
    en het Subcomité geografische aanduidingen, die zijn ingesteld krachtens de Associatieovereenkomst
    tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en hun lidstaten,
    enerzijds, en Oekraïne, anderzijds, met betrekking tot de vaststelling van het
    reglement van orde van die subcomités
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2017/189 z dnia 16 stycznia 2017 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Podkomitetu ds. Zarządzania
    Sanitarnego i Fitosanitarnego, Podkomitetu ds. Handlu i Zrównoważonego Rozwoju,
    Podkomitetu ds. Ceł oraz Podkomitetu ds. Oznaczeń Geograficznych, ustanowionych
    na mocy Układu o stowarzyszeniu między Unią Europejską i Europejską Wspólnotą
    Energii Atomowej oraz ich państwami członkowskimi, z jednej strony, a Ukrainą,
    z drugiej strony, w odniesieniu do przyjęcia regulaminu wewnętrznego tych podkomitetów
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2017/189 do Conselho, de 16 de janeiro de 2017, relativa
    às posições a adotar, em nome da União Europeia, no Subcomité Sanitário
    e Fitossanitário, no Subcomité de Comércio e Desenvolvimento Sustentável,
    no Subcomité das Alfândegas e no Subcomité das Indicações Geográficas criados
    pelo Acordo de Associação entre a União Europeia e a Comunidade Europeia da
    Energia Atómica e os seus Estados-Membros, por um lado, e a Ucrânia, por outro,
    no que respeita à adoção dos regulamentos internos desses subcomités
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2017/189 a Consiliului din 16 ianuarie 2017 privind pozițiile
    care urmează să fie adoptate în numele Uniunii Europene în cadrul Subcomitetului
    de gestionare pentru măsuri sanitare și fitosanitare, al Subcomitetului pentru
    comerț și dezvoltare durabilă, al Subcomitetului vamal și al Subcomitetului
    pentru indicații geografice, instituite prin Acordul de asociere dintre Uniunea
    Europeană și Comunitatea Europeană a Energiei Atomice și statele membre ale
    acestora, pe de o parte, și Ucraina, pe de altă parte, în ceea ce privește
    adoptarea regulamentelor de procedură ale subcomitetelor respective
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2017/189 zo 16. januára 2017 o pozíciách, ktoré
    sa majú v mene Európskej únie prijať v podvýbore pre sanitárne a fytosanitárne
    otázky, podvýbore pre obchod a udržateľný rozvoj, podvýbore pre clá a podvýbore
    pre zemepisné označenia zriadených podľa Dohody o pridružení medzi Európskou
    úniou a Európskym spoločenstvom pre atómovú energiu a ich členskými štátmi
    na jednej strane a Ukrajinou na strane druhej, pokiaľ ide o prijatie rokovacieho
    poriadku uvedených podvýborov
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2017/189 z dne 16. januarja 2017 o stališčih, ki se
    zavzamejo v imenu Evropske unije v Pododboru za sanitarne in fitosanitarne ukrepe,
    Pododboru za trgovino in trajnostni razvoj, Pododboru za carino in Pododboru za
    geografske označbe, ustanovljenih na podlagi Sporazuma o pridružitvi med Evropsko
    unijo in Evropsko skupnostjo za atomsko energijo in njunimi državami članicami
    na eni strani ter Ukrajino na drugi strani, v zvezi s sprejetjem poslovnikov teh
    pododborov
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2017/189 del Consejo, de 16 de enero de 2017, relativa a
    las posiciones que se deben adoptar, en nombre de la Unión Europea, en el Subcomité
    de Gestión para Asuntos Sanitarios y Fitosanitarios, en el Subcomité de Comercio
    y Desarrollo Sostenible, en el Subcomité Aduanero y en el Subcomité de Indicaciones
    Geográficas, creados en virtud del Acuerdo de Asociación entre la Unión Europea
    y la Comunidad Europea de la Energía Atómica y sus Estados miembros, por una
    parte, y Ucrania, por otra, con respecto a la adopción de los reglamentos internos
    correspondientes a dichos Subcomités
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2017/189 av den 16 januari 2017 om de ståndpunkter
    som ska intas på Europeiska unionens vägnar i den underkommitté för sanitära
    och fytosanitära frågor, den underkommitté för handel och hållbar utveckling,
    den underkommitté för tullfrågor och den underkommitté för geografiska beteckningar
    som inrättats enligt associeringsavtalet mellan Europeiska unionen och Europeiska
    atomenergigemenskapen och deras medlemsstater, å ena sidan, och Ukraina, å andra
    sidan, vad gäller antagandet av dessa underkommittéers arbetsordningar
