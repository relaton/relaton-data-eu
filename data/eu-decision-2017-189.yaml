    kaubanduse ja säästva arengu allkomitees, tolli allkomitees ning geograafiliste
    tähiste allkomitees seoses nimetatud allkomiteede kodukorra vastuvõtmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2017/189, annettu 16 päivänä tammikuuta 2017,
    Euroopan unionin ja Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden
    sekä Ukrainan välisellä assosiaatiosopimuksella perustetuissa terveys- ja kasvinsuojelutoimien
    hallinnoinnin alakomiteassa, kaupan ja kestävän kehityksen alakomiteassa, tulliasioiden
    alakomiteassa sekä maantieteellisten merkintöjen alakomiteassa Euroopan unionin
    puolesta esitettävistä kannoista kyseisten alakomiteoiden työjärjestysten
    hyväksymiseen
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2017/189 od 16. siječnja 2017. o stajalištima koja
    treba zauzeti u ime Europske unije u okviru Pododbora za upravljanje sanitarnim
    i fitosanitarnim mjerama, Pododbora za trgovinu i održivi razvoj, Carinskog pododbora
    i Pododbora za oznake zemljopisnog podrijetla, koji su osnovani na temelju Sporazuma
    o pridruživanju između Europske unije i Europske zajednice za atomsku energiju
    te njihovih država članica, s jedne strane, i Ukrajine, s druge strane, u vezi
    s donošenjem poslovnikâ tih pododbora
  type: main
