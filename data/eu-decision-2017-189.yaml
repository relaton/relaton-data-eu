    apakškomitejā, Tirdzniecības un ilgtspējīgas attīstības apakškomitejā,
    Muitas apakškomitejā un Apakškomitejā jautājumos par ģeogrāfiskās izcelsmes
    norādēm, kas izveidotas saskaņā ar Asociācijas nolīgumu starp Eiropas Savienību
    un Eiropas Atomenerģijas kopienu un to dalībvalstīm, no vienas puses, un Ukrainu,
    no otras puses, attiecībā uz minēto apakškomiteju reglamentu pieņemšanu
  type: main
- language: lt
  script: Latn
  content: 2017 m. sausio 16 d. Tarybos sprendimas (ES) 2017/189 dėl pozicijų, kurios
