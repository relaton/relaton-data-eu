title:
- language: en
  script: Latn
  content: '2003/634/EC: Commission Decision of 28 August 2003 approving programmes
    for the purpose of obtaining the status of approved zones and of approved farms
    in non-approved zones with regard to viral haemorrhagic septicaemia (VHS) and
    infectious haematopoietic necrosis (IHN) in fish (Text with EEA relevance) (notified
    under document number C(2003) 3101)'
  type: main
- language: fr
  script: Latn
  content: '2003/634/CE: Décision de la Commission du 28 août 2003 approuvant des
    programmes visant à obtenir le statut de zones agréées et de fermes d''élevage
    agréées situées dans des zones non agréées au regard des maladies des poissons
    que sont la septicémie hémorragique virale (SHV) et la nécrose hématopoïétique
    infectieuse (NHI) (Texte présentant de l''intérêt pour l''EEE) [notifiée sous
    le numéro C(2003) 3101]'
  type: main
- language: de
  script: Latn
