title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2206/80 of 19 August 1980 re-establishing
    the levying of customs duties on diffusers, ceiling lights, bowls, cups, lampshades,
    globes, tulip-shaped pieces, falling within subheading 70.14 A II and originating
    in Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2206/80 de la Commission, du 19 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux diffuseurs,
    plafonniers, vasques, coupes, coupelles, abat-jour, globes, tulipes, etc. de la
    sous-position 70.14 A II du tarif douanier commun, originaires de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2206/80 der Kommission vom 19. August 1980 zur Wiedereinführung
    des Zollsatzes für Zerstreuer, Schalen für Deckenleuchten, andere Schalen, Schirme,
    Glocken, Tulpen, der Tarifstelle 70.14 A II, mit Ursprung in Rumänien, dem die
    in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2206/80 af 19. august 1980 om genindførelse
    af opkrævning af toldafgifter for lysspredere, skærme til loftsbelysning, lampeskærme
    af forskellig form (skålformede, kugleformede, bægerformede etc.), under pos.
    70.14 A II, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2206/80 della Commissione, del 19 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili a diffusori, plafoniere,
    vasche, coppe, coppelle, paralumi, globi, tulipani, ecc., della sottovoce 70.14
    A II della tariffa doganale comune, originari della Romania, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2206/80 van de Commissie van 19 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op lichtverstrooiers,
    plafondlampeglazen, wandschelpen, reflectors, ballons, kelken en dergelijke artikelen,
    van post 70.14 A II, van oorsprong uit Roemenië ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
