title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1320/75 of the Commission of 23 May 1975 re-establishing
    the levying of customs duties on under garments, knitted or crocheted, not elastic
    or rubberised, of cotton, falling within subheading 60.04 A, originating in Malaysia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1320/75 de la Commission, du 23 mai 1975, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, de coton, de la sous- position
    tarifaire 60.04 A, originaires de Malaysia, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1320/75 der Kommission vom 23. Mai 1975 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifstelle 60.04 A, mit Ursprung in Malaysia,
    dem die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1320/75 af 23. maj 1975 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastik eller gummeret, af bomuld, under underposition 60.04 A, som har oprindelse
    i Malaysia og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1320/75 della Commissione, del 23 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata, di cotone, della sottovoce doganale n. 60.04 A, originarie
    della Malaisia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1320/75 van de Commissie van 23 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van katoen, van onderverdeling
    60.04 A, van oorsprong uit Maleisië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3046/74 van de Raad van 2 december
    1974
  type: main
