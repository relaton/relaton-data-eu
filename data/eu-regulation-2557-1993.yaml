title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2557/93 of 16 September 1993 re-establishing
    the levying of customs duties on products falling within CN code 6911, originating
    in the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2557/93 de la Commission du 16 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 6911, originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2557/93 DER KOMMISSION vom 16. September 1993 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 6911 mit
    Ursprung auf den Philippinen, dem die in der Verordnung (EWG) Nr. 3831/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2557/93 af 16. september 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6911 og med oprindelse
    i Filippinerne, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2557/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Σεπτεμβρίου 1993 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 6911, καταγωγής Φιλιππίνων, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2557/93 DELLA COMMISSIONE del 16 settembre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 6911 originari delle Filippine, beneficiarie delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2557/93 VAN DE COMMISSIE van 16 september 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 6911, van oorsprong uit de Filippijnen, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2557/93 DA COMISSÃO de 16 de Setembro de 1993 que
    restabelece a cobrança dos direitos aplicáveis aos produtos dos códigos NC
    6911, originários das Filipinas, beneficiários das preferências pautais previstas
    no Regulamento (CEE) nº 3831/90 do Conselho
  type: main
- language: es
