title:
- language: en
  script: Latn
  content: '84/632/EEC: Commission Decision of 12 December 1984 accepting an undertaking
    and repealing the provisional duty in connection with the anti-dumping investigation
    concerning imports of certain shovels originating in Brazil and terminating the
    investigation'
  type: main
- language: fr
  script: Latn
  content: '84/632/CEE: Décision de la Commission du 12 décembre 1984 portant acceptation
    d'' un engagement et abrogeant le droit provisoire institué dans le cadre de
    la procédure antidumping concernant les importations de certaines pelles originaires
    du Brésil, et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '84/632/EWG: Beschluß der Kommission vom 12. Dezember 1984 über die Annahme
    einer Verpflichtung und die Aufhebung des vorläufigen Antidumpingzolls im Rahmen
    des Antidumpingverfahrens betreffend die Einfuhren von bestimmten Schaufeln mit
    Ursprung in Brasilien und über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/632/EØF: Kommissionens afgørelse af 12. december 1984 om godtagelse
    af tilsagn og ophævelse af den midlertidige told i forbindelse med antidumpingproceduren
    vedrørende importen af visse skovle med oprindelse i Brasilien og om afslutning
    af denne undersøgelse'
  type: main
- language: el
  script: Grek
  content: '84/632/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Δεκεμβρίου 1984 για την αποδοχή ανάληψης υποχρέωσης
    και την κατάργηση του προσωρινού δασμού σχετικά
    με την έρευνα αντιντάμπινγκ για τις εισαγωγές
    ορισμένων πτύων καταγωγής Βραζιλίας και για
    την περάτωση της έρευνας'
  type: main
- language: it
  script: Latn
  content: '84/632/CEE: Decisione della Commissione del 12 dicembre 1984 che accetta
    un impegno e abroga il dazio provvisorio istituito nell'' ambito dell'' inchiesta
    antidumping relativa alle importazioni di alcuni tipi di pale originarie del Brasile
    e che conclude l'' inchiesta'
  type: main
- language: nl
  script: Latn
  content: '84/632/EEG: Besluit van de Commissie van 12 december 1984 houdende aanvaarding
    van een verbintenis, intrekking van het voorlopig recht in verband met het anti-dumpingonderzoek
    betreffende de invoer van bepaalde schoppen van oorsprong uit Brazilië, en beëindiging
    van het onderzoek'
  type: main
