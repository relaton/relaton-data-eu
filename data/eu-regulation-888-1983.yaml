title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 888/83 of 15 April 1983 re-establishing
    the levying of customs duties on woven suits and costumes, products of category
    29 (code 0290), originating in Malaysia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 888/83 de la Commission du 15 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux costumes-tailleurs, tissés,
    de la catégorie 29 (code 0290), originaires de Malaysia, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 888/83 der Kommission vom 15. April 1983 über die
    Wiedereinführung des Zollsatzes für Kostüme und Hosenanzüge der Warenkategorie
    Nr. 29 (Kennziffer 0290), mit Ursprung in Malaysia, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 888/83 af 15. april 1983 om genindførelse
    af opkrævning af toldafgifter for dragter og kostumer, vævede, under kategori
    nr. 29 (kode 0290), som har oprindelse i Malaysia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 888/83 της Επιτροπής
    της 15ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα κοστούμια—ταγιέρ,
    υφασμένα της κατηγορίας προϊόντων 29 (κωδικός
    αριθμός 0290), καταγωγής Μαλαισίας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 888/83 della Commissione del 15 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli abiti a giacca e completi, tessuti,
    della categoria di prodotti n. 29 (codice 0290), originari della Malaysia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 888/83 van de Commissie van 15 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    mantelpakken en broekpakken, van de categorie van produkten nr. 29 (codenummer
    0290), van oorsprong uit Maleisië waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
