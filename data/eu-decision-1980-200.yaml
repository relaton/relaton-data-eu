id: EUDecision1980200
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/200/EEC: Commission Decision of 24 January 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to blouses and shirt- blouses, knitted, crocheted
    or woven, falling within subheadings ex 60.05 A II and ex 61.02 B II of the Common
    Customs Tariff (category 7), originating in Hungary and in free circulation in
    the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/200/CEE: Décision de la Commission, du 24 janvier 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemisiers, blouses- chemisiers et
    blouses de bonneterie ou tissés, des sous- positions ex 60.05 A II et ex 61.02
    B II du tarif douanier commun (catégorie 7), originaires de Hongrie et mis en
    libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/200/EWG: Entscheidung der Kommission vom 24. Januar 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Ungarn stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken oder Geweben der
    Tarifstellen ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie
    7, von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/200/EØF: Kommissionens beslutning af 24. januar 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage bluser, herunder skjortebluser af trikotage
    eller vævede stoffer, som henhører under pos. ex 60.05 A II ex 61.02 B II i
    den fælles toldtariff (kategori 7), har oprindelse i Ungarn og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/200/CEE: Decisione della Commissione, del 24 gennaio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie, camicette e bluse a maglia
    o tessute, delle sottovoci ex 60.05 A II ed ex 61.02 B II della tariffa doganale
    comune, categoria 7, originarie dell''Ungheria e messe in libera pratica negli
    altri Stati membri (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/200/EEG: Beschikking van de Commissie van 24 januari 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd blouses en hemdblouses, van brei- of haakwerk of geweven, van
    de posten ex 60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 7), van oorsprong uit Hongarije en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
