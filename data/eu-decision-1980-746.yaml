type: standard
title:
- language: en
  script: Latn
  content: '80/746/EEC: Commission Decision of 14 July 1980 authorizing the French
    Republic not to apply Community treatment to cotton yarn, not put up for retail
    sale, falling within heading No 55.05 of the Common Customs Tariff (category 1),
    originating in Pakistan and in free circulation in the other Member States (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/746/CEE: Décision de la Commission, du 14 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les fils de coton
    non conditionnés pour la vente au détail, de la position 55.05 du tarif douanier
    commun (catégorie 1), originaires du Pakistan et mis en libre pratique dans les
    autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/746/EWG: Entscheidung der Kommission vom 14. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus Pakistan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 55.05 des Gemeinsamen Zolltarifs (Kategorie
    1) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/746/EØF: Kommissionens beslutning af 14. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage garn af bomuld,
    ikke i detailsalgsoplægninger, som henhører under pos. 55.05 i den fælles toldtarif
    (kategori 1), har oprindelse i Pakistan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/746/CEE: Decisione della Commissione, del 14 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i filati di cotone
    non preparati per la vendita al minuto, della voce 55.05 della tariffa doganale
    comune, categoria 1, originari del Pakistan e messi in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/746/EEG: Beschikking van de Commissie van 14 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd garens van katoen, niet gereed voor de verkoop in het
    klein, van post 55.05 van het gemeenschappelijk douanetarief (categorie 1), van
    oorsprong uit Pakistan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
