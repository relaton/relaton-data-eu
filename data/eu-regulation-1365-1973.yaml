title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1365/73 of the Council of 21 May 1973 supplementing,
    as regards cauliflowers and tomatoes, Regulation (EEC) No 228/73 laying down general
    rules for the system of compensatory amounts for fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1365/73 du Conseil, du 21 mai 1973, complétant, en
    ce qui concerne les choux-fleurs et les tomates, le règlement (CEE) n° 228/73
    déterminant les règles générales du régime des montants compensatoires dans
    le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1365/73 des Rates vom 21. Mai 1973 zur Ergänzung
    der Verordnung (EWG) Nr. 228/73 über die Festlegung allgemeiner Vorschriften
    für die Regelung der Ausgleichsbeträge im Sektor Obst und Gemüse in bezug auf
    Blumenkohl und Tomaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1365/73 af 21. maj 1973 som for blomkål
    og tomater supplerer forordning (EØF) nr. 228/73 om fastlæggelse af de almindelige
    regler for ordningen vedrørende udligningsbeløb for frugt og grønsager
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1365/73 del Consiglio, del 21 maggio 1973, che completa,
    per quanto riguarda i cavolfiori e i pomodori, il regolamento (CEE) n. 228/73
    che stabilisce le norme generali del regime degli importi compensativi nel settore
    degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1365/73 van de Raad van 21 mei 1973 tot aanvulling,
    met betrekking tot bloemkool en tomaten, van Verordening (EEG) nr. 228/73 tot
    vaststelling van de algemene bepalingen van het stelsel van de compenserende bedragen
    in de sector groenten en fruit
  type: main
