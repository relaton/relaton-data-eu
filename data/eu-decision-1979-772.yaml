title:
- language: en
  script: Latn
  content: '79/772/EEC: Commission Decision of 28 August 1979 authorizing the French
    Republic not to apply Community treatment to natural honey, falling within heading
    No 04.06 of the Common Customs Tariff, originating in Romania and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/772/CEE: Décision de la Commission, du 28 août 1979, autorisant la
    République française à exclure du traitement communautaire le miel naturel
    de la position 04.06 du tarif douanier commun, originaire de Roumanie et mis en
    libre pratique dans les autres Etats membres (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/772/EWG: Entscheidung der Kommission vom 28. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Rumänien stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen natürlichen Honig der Tarifnummer
    04.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/772/EØF: Kommissionens beslutning af 28. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage naturlig honning,
    som henhører under pos. 04.06 i den fælles toldtarif, har oprindelse i Rumænien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/772/CEE: Decisione della Commissione, del 28 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il miele naturale
    della voce 04.06 della tariffa doganale comune, originario della Romania e messo
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/772/EEG: Beschikking van de Commissie van 28 augustus 1979 waarbij
    de Franse Republiek wordt gemachtigd natuurhonig, van post 04.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
