    dopuszczalnych poziomów pozostałości atrazyny, lambda-cyhalotryny, fenmedifamu,
    metomylu, linuronu, penkonazolu, pimetrozyny, bifentryny i abamektyny
  type: main
- language: pt
  script: Latn
  content: Directiva 2007/7/CE da Comissão, de 14 de Fevereiro de 2007 , que altera
