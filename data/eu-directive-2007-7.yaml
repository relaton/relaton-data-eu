    atratsiinin, lambda-syhalotriinin, fenmedifaamin, metomyylin, linuronin, penkonatsolin,
    pymetrotsiinin, bifentriinin ja abamektiinin jäämien enimmäismäärien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2007/7/EK irányelve ( 2007. február 14. ) a 86/362/EGK és
