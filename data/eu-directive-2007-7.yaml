    lambda-tsühalotriini, fenmedifaami, metomüüli, linurooni, penkonasooli, pümetrosiini,
    bifentriini ja abamektiini jääkide lubatud piirnormidega
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2007/7/EY, annettu 14 päivänä helmikuuta 2007 ,
