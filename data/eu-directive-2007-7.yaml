  script: Latn
  content: Commission Directive 2007/7/EC of 14 February 2007 amending certain Annexes
    to Council Directives 86/362/EEC and 90/642/EEC as regards the maximum residue
    levels of atrazine, lambda-cyhalothrin, phenmedipham, methomyl, linuron, penconazole,
    pymetrozine, bifenthrin and abamectin
  type: main
- language: fr
  script: Latn
