    atrazino, liambda-cihalotrino, fenmedifamo, metomilo, linurono, penkonazolo, pimetrozino,
    bifentrino ir abamektino likučių koncentracijos
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2007/7/KE ta’ l- 14 ta’ Frar 2007 li temenda
