title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3446/83 of 5 December 1983 re-establishing
    the levying of customs duties on certain glassware, falling within heading No
    70.13 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3446/83 de la Commission du 5 décembre 1983 portant
    rétablissement de la perception des droits de douane applicables à certains
    objets en verre, de la position 70.13 du tarif douanier commun, originaires de
    Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3446/83 der Kommission vom 5. Dezember 1983 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Glaswaren der Tarifnummer 70.13 mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3446/83 af 5. december 1983 om genindførelse
    af opkrævning af told for bestemte artikler af glas, henhørende under pos. 70.13
    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3446/83 της Επιτροπής
    της 5ης Δεκεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένα υάλινα αντικείμενα
    της κλάσεως 70.13 του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3446/83 della Commissione del 5 dicembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili a taluni oggetti di vetro,
    della voce 70.13 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3446/83 van de Commissie van 5 december 1983 houdende
