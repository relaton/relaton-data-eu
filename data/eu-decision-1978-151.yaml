id: EUDecision1978151
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 November 1977 authorizing the Italian Republic
    not to apply Community treatment to synthetic rubber latex falling within heading
    No ex 40.02 of the Common Customs Tariff, originating in Bulgaria and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/151/CEE: Décision de la Commission, du 23 novembre 1977, autorisant
    la République italienne à exclure du traitement communautaire le latex de caoutchouc
    synthétique de la position Ex 40.02 du tarif commun, originaire de Bulgarie et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. November 1977, mit der die Italienische
    Republik ermächtigt wird, aus Bulgarien stammenden und in den anderen Mitgliedsstaaten
    im freien Verkehr befindlichen Latex von synthetischem Kautschuk der Tarifnummer
    ex 40.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 23. november 1977 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage syntetisk gummilatex, som henhører
    under pos. ex 40.02 i den fælles toldtarif, har oprindelse i Bulgarien og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 novembre 1977, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario la gomma sintetica della voce
    ex 40.02 della tariffa doganale comune, originaria della Bulgaria, messa in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 november 1977 waarbij de Italiaanse
    Republiek wordt gemachtigd latex van synthetische rubber van post ex 40.02 van
    het gemeenschappelijk douanetarief, van oorsprong uit Bulgarije en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
