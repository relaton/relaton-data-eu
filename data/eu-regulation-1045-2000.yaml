title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1045/2000 of 18 May 2000 fixing the guarantee
    threshold quantities that can be transferred to other groups of varieties in the
    raw tobacco sector for the 2000 harvest
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1045/2000 de la Commission du 18 mai 2000 fixant les
    quantités de seuil de garantie autorisées à être transférées vers un autre
    groupe de variétés pour la récolte 2000 dans le secteur du tabac brut
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1045/2000 der Kommission vom 18. Mai 2000 zur Festsetzung
    der auf eine andere Sortengruppe übertragbaren Garantieschwellenmengen für Rohtabak
    der Ernte 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1045/2000 af 18. maj 2000 vedrørende
    råtobak og om fastsættelse af de garantitærskelmængder, som det for 2000-høsten
    er tilladt at overføre til en anden sortsgruppe
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1045/2000 της Επιτροπής,
    της 18ης Μαΐου 2000, για τον καθορισμό των ποσοτήτων
    κατωφλίου εγγύησης που επιτρέπονται να μεταφερθούν
    προς άλλη ομάδα ποικιλιών για τη συγκομιδή
    του 2000 στον τομέα του ακατέργαστου καπνού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1045/2000, annettu 18 päivänä toukokuuta 2000,
    toiseen lajikeryhmään siirrettävistä takuukynnysten määristä raakatupakka-alalla
    satovuoden 2000 osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1045/2000 della Commissione, del 18 maggio 2000, che
    fissa i quantitativi del limite di garanzia autorizzati ad essere trasferiti ad
    un altro gruppo di varietà per il raccolto 2000 nel settore del tabacco greggio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1045/2000 van de Commissie van 18 mei 2000 tot vaststelling,
    voor het oogstjaar 2000, van de garantiedrempelhoeveelheden die in de sector ruwe
    tabak naar een andere soortengroep mogen worden overgedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1045/2000 da Comissão, de 18 de Maio de 2000, que
    fixa, em relação à colheita de 2000, as quantidades de limiar de garantia cuja
    transferência para outro grupo de variedades é autorizada, no sector do tabaco
    em rama
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1045/2000 de la Comisión, de 18 de mayo de 2000, por
    el que se fijan, en el sector del tabaco crudo y para la cosecha 2000, las cantidades
    del umbral de garantía que podrían ser transferidas a otro grupo de variedades
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1045/2000 av den 18 maj 2000 om fastställande
    av de garantitröskelkvantiteter som för skörden år 2000 får överföras till
    en annan sortgrupp inom sektorn för råtobak
  type: main
