title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 887/91 of 10 April 1991 reducing the quantities
    of table wine covered by approved contracts and declarations for distillation
    as provided for in Regulation (EEC) No 3748/90
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 887/91 DE LA COMMISSION du 10 avril 1991 portant réduction
    des quantités de vin de table figurant dans les contrats et déclarations agréés
    au titre de la distillation ouverte par le règlement (CEE) no 3748/90 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 887/91 DER KOMMISSION vom 10. April 1991 zur Kürzung
    der in den für die Destillation gemäß der Verordnung (EWG) Nr. 3748/90 genehmigten
    Verträgen und Erklärungen angegebenen Tafelweinmengen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 887/91 af 10. april 1991 om nedsættelse
    af de mængder bordvin, der er anført i de kontrakter og angivelser, der godkendes
    i henhold til destillationen i forordning (EØF) nr. 3748/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 887/91 της Επιτροπής
    της 10ης Απριλίου 1991 για τη μείωση των ποσοτήτων
    επιτραπέζιου οίνου που αναφέρονται στις συμβάσεις
    και στις δηλώσεις που έχουν εγκριθεί δυνάμει
    της αποστάξεως που άρχισε με τον κανονισμό
    (ΕΟΚ) αριθ. 3748/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 887/91 DELLA COMMISSIONE del 10 aprile 1991 relativo
    alla riduzione dei quantitativi di vini da tavola che figurano nei contratti e
    nelle dichiarazioni approvati a titolo della distillazione aperta dal regolamento
    (CEE) n. 3748/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 887/91 VAN DE COMMISSIE van 10 april 1991 tot verlaging
    van de hoeveelheden tafelwijn in de contracten en aangiften die worden goedgekeurd
    in het kader van de bij Verordening (EEG) nr. 3748/90 geopende mogelijkheid tot
    distillatie #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 887/91 DA COMISSÃO de 10 de Abril de 1991 que reduz
    as quantidades de vinho de mesa que constam dos contratos e declarações aprovados
    a título da destilação aberta pelo Regulamento (CEE) nº 3748/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 887/91 DE LA COMISIÓN de 10 de abril de 1991 por
    el que se reducen las cantidades de vino de mesa que figuran en los contratos
    y declaraciones debidamente autorizados con arreglo a la destilación abierta
    por el Reglamento (CEE) no 3748/90 #'
  type: main
