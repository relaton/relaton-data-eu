title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2242/2004 of 22 December 2004 amending Regulation
    (EC) No 976/1999 laying down the requirements for the implementation of Community
    operations, other than those of development cooperation, which, within the framework
    of Community cooperation policy, contribute to the general objective of developing
    and consolidating democracy and the rule of law and to that of respecting human
    rights and fundamental freedoms in third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2242/2004 du Conseil du 22 décembre 2004 modifiant
    le règlement (CE) n° 976/1999 fixant les exigences pour la mise en œuvre des
    actions communautaires, autres que celles de coopération au développement, qui,
    dans le cadre de la politique de coopération communautaire, contribuent à l'objectif
    général du développement et de la consolidation de la démocratie et de l'État
    de droit ainsi qu'à celui du respect des droits de l'homme et des libertés fondamentales
    dans les pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2242/2004 des Rates vom 22. Dezember 2004 zur Änderung
    der Verordnung (EG) Nr. 976/1999 zur Festlegung der Bedingungen für die Durchführung
    von anderen als die Entwicklungszusammenarbeit betreffenden Gemeinschaftsmaßnahmen,
    die im Rahmen der Gemeinschaftspolitik auf dem Gebiet der Zusammenarbeit zu dem
    allgemeinen Ziel der Fortentwicklung und Festigung der Demokratie und des Rechtsstaats
    sowie zur Wahrung der Menschenrechte und Grundfreiheiten in Drittländern beitragen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2242/2004 ze dne 22. prosince 2004, kterým se
    mění nařízení (ES) č. 976/1999, kterým se stanoví požadavky pro provádění
    opatření Společenství jiných než opatření týkajících se rozvojové
    spolupráce, která v rámci politiky spolupráce Společenství přispívají
    k obecnému cíli rozvoje a upevnění demokracie a právního státu, akož i
    k dodržování lidských práv a základních svobod ve třetích zemích
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2242/2004 af 22. december 2004 om ændring
    af forordning (EF) nr. 976/1999 om kravene til gennemførelsen af andre fællesskabsaktioner
    end udviklingssamarbejdsaktioner, der inden for rammerne af Fællesskabets samarbejdspolitik
    bidrager til at opnå de generelle mål om udvikling og befæstelse af demokratiet
    og af retsstaten samt respekt for menneskerettighederne og de grundlæggende frihedsrettigheder
    i tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2242/2004 του Συμβουλίου,
    της 22ας Δεκεμβρίου 2004, που τροποποιεί τον κανονισμό
    (ΕΚ) αριθ. 976/1999 σχετικά με τον καθορισμό των
    προϋποθέσεων για την εφαρμογή δράσεων της
    Κοινότητας, πέρα των δράσεων συνεργασίας για
    την ανάπτυξη, οι οποίες στα πλαίσια της κοινοτικής
    πολιτικής για τη συνεργασία συμβάλλουν στο
    γενικό στόχο της ανάπτυξης και της εδραίωσης
    της δημοκρατίας και του κράτους δικαίου, καθώς
    και του σεβασμού των δικαιωμάτων του ανθρώπου
    και των θεμελιωδών ελευθεριών σε τρίτες χώρες
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2242/2004, 22. detsember 2004, millega muudetakse
    määrust (EÜ) nr 976/1999, millega nähakse ette nõuded selliste ühenduse
    meetmete (välja arvatud arengukoostöömeetmete) rakendamise kohta, mille eesmärk
    on aidata ühenduse koostööpoliitika raames kaasa üldisele eesmärgile arendada
    ja tugevdada demokraatiat ja õigusriiki ning austada inimõigusi ja põhivabadusi
    kolmandates riikides
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2242/2004, annettu 22 päivänä joulukuuta 2004,
    demokratian ja oikeusvaltion kehittämisen ja lujittamisen sekä ihmisoikeuksien
    ja perusvapauksien kunnioittamisen yleistavoitetta kolmansissa maissa yhteisön
    yhteistyöpolitiikan puitteissa edistävien yhteisön toimien, jotka ovat muita
    kuin kehitysyhteistyötoimia, täytäntöönpanoa koskevista vaatimuksista annetun
    asetuksen (EY) N:o 976/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2242/2004/EK rendelete (2004. december 22.) a demokrácia és
    jogállamiság fejlesztésének és megszilárdításának, valamint az emberi
    jogok és alapvető szabadságjogok tiszteletben tartásának általános célját
    harmadik országokban elősegítő, a fejlesztési együttműködési műveleteken
    kívüli közösségi műveletek végrehajtására vonatkozó követelmények
    megállapításáról szóló 976/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2242/2004 del Consiglio, del 22 dicembre 2004, recante
    modifica del regolamento (CE) n. 976/1999 che fissa le modalità di attuazione
    delle azioni della Comunità diverse da quelle di cooperazione allo sviluppo che,
    nel quadro della politica di cooperazione comunitaria, contribuiscono all'obiettivo
    generale di sviluppo e consolidamento della democrazia e dello stato di diritto
    nonché a quello del rispetto dei diritti dell'uomo e delle libertà fondamentali
    nei paesi terzi
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2242/2004 (2004. gada 22 decembrī), ar ko groza
    Padomes Regulu (EK) Nr. 976/1999, ar ko paredz prasības tādu Kopienas darbību
    īstenošanai, kuras nav sadarbība attīstības veicināšanas jomā un kuras
    atbilstīgi Kopienas sadarbības politikai palīdz sasniegt vispārēju mērķi
    - attīstīt un nostiprināt demokrātiju un tiesiskumu un panākt cilvēktiesību
    un pamatbrīvību ievērošanu trešās valstīs
  type: main
- language: lt
  script: Latn
  content: Tarybos reglamentas (EB) Nr. 2242/2004 2004 m. gruodžio 22 d. iš dalies
    keičiantis Reglamentą (EB) Nr. 976/1999, nustatantį reikalavimus dėl Bendrijos
    veiksmų programų, kurios, išskyrus vystymąsi remiančio bendradarbiavimo veiksmų
    programas, pagal Bendrijos bendradarbiavimo politiką padeda siekti bendrojo tikslo
    – plėtoti ir įtvirtinti demokratiją ir teisinę valstybę bei gerbti žmogaus
    teises ir pagrindines laisves trečiosiose šalyse, įgyvendinimo
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru. 2242/2004 tat-22 ta' Diċembru 2004 li
    jemenda r-Regolament (KE) Nru 976/1999 li jistabbilixxi r-rekwiżiti għall-implimentazzjoni
    ta' operazzjonijiet Komunitarji, minbarra dawk ta' politika ta' koperazzjoni għall-iżvilupp,
    li, fi ħdan il-qafas tal-politika ta' koperazzjoni Komunitarja, jikkontribwixxu
    għall-għan ġenerali ta' l-iżvilupp u l-konsolidazzjoni tad-demokrazija u ta'
    l-istat tad-dritt u għal dak tar-rispett tad-drittijiet tal-bniedem u l-libertajiet
    fundamentali f'pajjiżi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2242/2004 van de Raad van 22 december 2004 tot wijziging
    van Verordening (EG) nr. 976/1999 tot vaststelling van de voorwaarden voor de
    uitvoering van niet onder de ontwikkelingssamenwerking vallende communautaire
    acties die binnen het kader van het communautaire samenwerkingsbeleid een bijdrage
    leveren tot de algemene doelstelling van ontwikkeling en consolidatie van de democratie
    en de rechtsstaat, alsmede tot de doelstelling van eerbiediging van de mensenrechten
    en de fundamentele vrijheden in derde landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady nr 2242/2004 z dnia 22 grudnia 2004 r. zmieniające
    rozporządzenie (WE) nr 976/1999 ustanawiające wymogi odnoszące się do wprowadzania
    w życie działań wspólnotowych innych niż działania współpracy na rzecz
    rozwoju, które w ramach wspólnotowej polityki współpracy przyczyniają się
    do realizacji ogólnego celu rozwijania i umacniania demokracji i państwa prawa
    oraz poszanowania praw człowieka i podstawowych wolności w państwach trzecich
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2242/2004 do Conselho, de 22 de Dezembro de 2004,
    que altera o Regulamento (CE) n.° 976/1999 que estabelece os requisitos para
    a execução das acções da Comunidade, diversas das acções de cooperação
    para o desenvolvimento, que, no âmbito da política comunitária de cooperação,
    contribuem para o objectivo geral de desenvolvimento e consolidação da democracia
    e do Estado de direito, bem como para o objectivo do respeito dos direitos do
    Homem e das liberdades fundamentais em países terceiros
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2242/2004 z 22. decembra 2004 ktorým sa mení
    a dopĺňa nariadenie (ES) č. 976/1999, ktorým sa stanovujú podmienky vykonávania
    iných opatrení Spoločenstva ako opatrení rozvojovej spolupráce, ktoré v
    rámci politiky spolupráce Spoločenstva prispievajú ku všeobecným cieľom
    rozvoja a upevňovaniu demokracie a právneho štátu, ako aj k dodržiavaniu
    ľudských práv a základných slobôd v tretích krajinách
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2242/2004 z dne 22. decembra 2004 o spremembah Uredbe
    Sveta (ES) št. 976/1999 o določitvi zahtev za izvajanje dejavnosti Skupnosti,
    razen razvojnega sodelovanja, ki v okviru politike sodelovanja Skupnosti prispevajo
    k splošnemu cilju razvijati in krepiti demokracijo in pravno državo ter spoštovati
    človekove pravice in temeljne svoboščine v tretjih državah
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2242/2004 del Consejo, de 22 de diciembre de 2004,
    que modifica el Reglamento (CE) n° 976/1999 por el que se fijan los requisitos
    para la aplicación de las acciones comunitarias distintas de las de cooperación
    al desarrollo que, dentro del marco de la política de cooperación comunitaria,
    contribuyan a alcanzar el objetivo general de desarrollar y consolidar la democracia
    y el Estado de Derecho así como respetar los derechos humanos y las libertades
    fundamentales en los terceros países
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2242/2004 av den 22 december 2004 om ändring
    av förordning (EG) nr 976/1999 om att fastställa krav för genomförande av
    gemenskapsåtgärder som inte avser utvecklingssamarbete och som inom ramen för
    gemenskapens utvecklingspolitik bidrar till det allmänna målet att utveckla
    och befästa demokratin och rättsstaten samt till målet att respektera de mänskliga
    rättigheterna och de grundläggande friheterna i tredje land
  type: main
