  content: Regulation (EU) 2015/1843 of the European Parliament and of the Council
    of 6 October 2015 laying down Union procedures in the field of the common commercial
    policy in order to ensure the exercise of the Union’s rights under international
    trade rules, in particular those established under the auspices of the World Trade
    Organization (codification)
  type: main
- language: fr
  script: Latn
