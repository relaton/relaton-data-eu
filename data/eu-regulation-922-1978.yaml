id: EURegulation9221978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 922/78 of 28 April 1978 re-establishing
    the levying of customs duties on knives with cutting blades, serrated or not (including
    pruning knives), other than knives falling within heading No 82.06, falling within
    heading No ex 82.09 and originating in Hong Kong, to which the preferential tariff
    arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 922/78 de la Commission, du 28 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    (autres que ceux du n 82.06) à lame tranchante ou dentelée, y compris les serpettes
    fermantes, de la position tarifaire EX 82.09, originaires de Hong-Kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 922/78 der Kommission vom 28. April 1978 zur Wiedereinführung
    des Zollsatzes für Messer, andere als Messer der Tarifnummer 82.06, mit schneidender
    oder gezahnter Klinge (einschließlich Klappmesser für den Gartenbau), der Tarifnummer
    ex 82.09, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 922/78 af 28. april 1978 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskæreknive)
    som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 922/78 della Commissione, del 28 aprile 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata (compresi i roncoli chiudibili), diversi da quelli della voce 82.06,
    della voce doganale ex 82.09, originari di Hong Kong, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 922/78 van de Commissie van 28 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op messen met
    snijdend lemmet, ook indien getand (andere dan die bedoeld bij post 82.06, doch
    zaksnoeimessen daaronder begrepen), van post ex 82.09, van oorsprong uit Hong-Kong
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
