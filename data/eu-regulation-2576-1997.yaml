title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2576/97 of 15 December 1997 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1998
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2576/97 de la Commission du 15 décembre 1997 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1998 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2576/97 der Kommission vom 15. Dezember 1997 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1998 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2576/97 af 15. december 1997 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1998
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2576/97 της Επιτροπής
    της 15ης Δεκεμβρίου 1997 για καθορισμό της κατ'αποκοπήν
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1998
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντιστάθμισης και της σχετικής προκαταβολής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2576/97, annettu 15 päivänä joulukuuta 1997,
    kalastusvuoden 1998 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2576/97 della Commissione del 15 dicembre 1997 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1998
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 2576/97 van de Commissie van 15 december 1997 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1998 voor de uit
    de markt genomen visserijproducten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2576/97 da Comissão de 15 de Dezembro de 1997 que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1998
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2576/97 de la Comisión de 15 de diciembre de 1997
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1998, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2576/97 av den 15 december 1997 om fastställande
    av det schablonvärde som skall användas vid beräkningen av den ekonomiska ersättningen
    och tillhörande förskott för de fiskeriprodukter som återtagits från marknaden
    under fiskeåret 1998
