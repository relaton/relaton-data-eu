title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/910 of 15 December 2023 laying
    down implementing technical standards for the application of Directive 2009/65/EC
    of the European Parliament and of the Council with regard to the form and content
    of the information to be notified in respect of the cross-border activities of
    undertakings for collective investment in transferable securities (UCITS), UCITS
    management companies, the exchange of information between competent authorities
    on cross-border notification letters, and amending Commission Regulation (EU)
    No 584/2010
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/910 de la Commission du 15 décembre
    2023 définissant, pour l’application de la directive 2009/65/CE du Parlement
    européen et du Conseil, des normes techniques d’exécution concernant la forme
    et le contenu des informations à communiquer relativement aux activités transfrontières
    des organismes de placement collectif en valeurs mobilières (OPCVM) et des sociétés
    de gestion d’OPCVM ainsi que l’échange d’informations entre autorités
    compétentes sur les lettres de notification d’activités transfrontières,
    et modifiant le règlement (UE) no 584/2010 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/910 der Kommission vom 15. Dezember
    2023 zur Festlegung technischer Durchführungsstandards für die Anwendung der
    Richtlinie 2009/65/EG des Europäischen Parlaments und des Rates im Hinblick auf
    Form und Inhalt der Informationen, die zu den grenzüberschreitenden Tätigkeiten
    von Organismen für gemeinsame Anlagen in Wertpapieren (OGAW) und OGAW-Verwaltungsgesellschaften
    zu übermitteln sind, und den Informationsaustausch zwischen zuständigen Behörden
    über grenzüberschreitende Anzeigeschreiben sowie zur Änderung der Verordnung
    (EU) Nr. 584/2010 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/910 на Комисията
    от 15 декември 2023 година за определяне на технически
    стандарти за изпълнение за прилагането на
    Директива 2009/65/ЕО на Европейския парламент
    и на Съвета по отношение на формата и съдържанието
    на информацията, която трябва да бъде съобщавана
    във връзка с трансграничните дейности на предприятията
    за колективно инвестиране в прехвърлими ценни
    книжа (ПКИПЦК), управляващите дружества на
    ПКИПЦК, обмена на информация между компетентните
    органи относно трансграничните уведомителни
    писма и за изменение на Регламент (ЕС) № 584/2010
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/910 ze dne 15. prosince 2023,
    kterým se stanoví prováděcí technické normy ke směrnici Evropského parlamentu
    a Rady 2009/65/ES, pokud jde o formu a obsah informací, které mají být oznamovány
    v souvislosti s přeshraničními činnostmi subjektů kolektivního investování
    do převoditelných cenných papírů (SKIPCP), správcovskými společnostmi
    SKIPCP a výměnou informací mezi příslušnými orgány o přeshraničních
    oznámeních, a kterým se mění nařízení Komise (EU) č. 584/2010
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/910 af 15. december 2023
    om gennemførelsesmæssige tekniske standarder for anvendelsen af Europa-Parlamentets
    og Rådets direktiv 2009/65/EF for så vidt angår form og indhold af de oplysninger,
    der skal anmeldes i forbindelse med grænseoverskridende aktiviteter i institutter
    for kollektiv investering i værdipapirer (investeringsinstitutter), investeringsinstitutters
    administrationsselskaber og udveksling af oplysninger mellem kompetente myndigheder
    om grænseoverskridende anmeldelsesskrivelser og om ændring af Kommissionens
    forordning (EU) nr. 584/2010
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/910 της Επιτροπής,
