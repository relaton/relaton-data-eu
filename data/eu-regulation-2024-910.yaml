    transfruntiera, u li jemenda r-Regolament tal-Kummissjoni (UE) Nru 584/2010
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/910 van de Commissie van 15 december 2023
    tot vaststelling van technische normen voor de toepassing van Richtlijn 2009/65/EG
    van het Europees Parlement en de Raad wat betreft de vorm en inhoud van de informatie
    te verstrekken ten aanzien van grensoverschrijdende activiteiten van instellingen
    voor collectieve belegging in effecten (icbe’s), icbe-beheermaatschappijen,
    de uitwisseling tussen bevoegde autoriteiten van informatie over grensoverschrijdende
    kennisgevingsbrieven, en tot wijziging van Verordening (EU) nr. 584/2010 van de
    Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/910 z dnia 15 grudnia 2023
    r. ustanawiające wykonawcze standardy techniczne do celów stosowania dyrektywy
    Parlamentu Europejskiego i Rady 2009/65/WE w odniesieniu do formy i treści informacji,
    które należy udostępniać w związku z działalnością o charakterze transgranicznym
    prowadzoną przez przedsiębiorstwa zbiorowego inwestowania w zbywalne papiery
    wartościowe (UCITS) i przez spółki zarządzające UCITS oraz w związku z wymianą
    informacji dotyczących transgranicznych powiadomień między właściwymi organami,
    a także zmieniające rozporządzenie Komisji (UE) nr 584/2010
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/910 da Comissão, de 15 de dezembro
    de 2023, que estabelece normas técnicas de execução para a aplicação da Diretiva
    2009/65/CE do Parlamento Europeu e do Conselho no que respeita à forma e ao conteúdo
    das informações a notificar relativamente às atividades transfronteiras dos
    organismos de investimento coletivo em valores mobiliários (OICVM) e das sociedades
    gestoras de OICVM, bem como à troca de informações entre autoridades competentes
    sobre as cartas de notificação transfronteiras, e que altera o Regulamento (UE)
    n.o 584/2010 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/910 al Comisiei din 15 decembrie
    2023 de stabilire a unor standarde tehnice de punere în aplicare pentru aplicarea
    Directivei 2009/65/CE a Parlamentului European și a Consiliului referitoare la
    forma și conținutul informațiilor care trebuie notificate cu privire la activitățile
    transfrontaliere ale organismelor de plasament colectiv în valori mobiliare (OPCVM)
    și ale societăților de administrare a OPCVM-urilor, precum și referitoare
    la schimbul de informații între autoritățile competente cu privire la scrisorile
    de notificare a activităților transfrontaliere și de modificare a Regulamentului
    (UE) nr. 584/2010 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/910 z 15. decembra 2023, ktorým
    sa stanovujú vykonávacie technické predpisy na uplatňovanie smernice Európskeho
    parlamentu a Rady 2009/65/ES, pokiaľ ide o formu a obsah informácií, ktoré
    sa majú oznamovať v súvislosti s cezhraničnými činnosťami podnikov kolektívneho
    investovania do prevoditeľných cenných papierov (PKIPCP) a správcovských
    spoločností PKIPCP, ako aj výmenu informácií medzi príslušnými orgánmi
    o cezhraničných oznámeniach, a ktorým sa mení nariadenie Komisie (EÚ) č.
    584/2010
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/910 z dne 15. decembra 2023 o določitvi
    izvedbenih tehničnih standardov za uporabo Direktive 2009/65/ES Evropskega parlamenta
    in Sveta v zvezi z obliko in vsebino podatkov, ki jih je treba sporočiti v zvezi
    s čezmejnimi dejavnostmi kolektivnih naložbenih podjemov za vlaganja v prenosljive
    vrednostne papirje (KNPVP) in družb za upravljanje KNPVP ter izmenjavo podatkov
    med pristojnimi organi o uradnih obvestilih o čezmejnih dejavnostih, ter o spremembi
    Uredbe Komisije (EU) št. 584/2010
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/910 de la Comisión, de 15 de diciembre
    de 2023, por el que se establecen normas técnicas de ejecución para la aplicación
    de la Directiva 2009/65/CE del Parlamento Europeo y del Consejo en lo que respecta
    a la forma y el contenido de la información que debe notificarse en relación
    con las actividades transfronterizas de determinados organismos de inversión
    colectiva en valores mobiliarios (OICVM) y de las sociedades de gestión de OICVM
    y al intercambio de información entre autoridades competentes sobre los escritos
    de notificación de actividades transfronterizas, y por el que se modifica el
    Reglamento (UE) n.o 584/2010 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/910 av den 15 december
    2023 om fastställande av tekniska genomförandestandarder för tillämpningen
    av Europaparlamentets och rådets direktiv 2009/65/EG vad gäller formen och innehållet
    för den information som ska anmälas med avseende på gränsöverskridande verksamhet
    som bedrivs av företag för kollektiva investeringar i överlåtbara värdepapper
    (fondföretag), förvaltningsbolag för fondföretag, utbytet av information mellan
    behöriga myndigheter om gränsöverskridande skriftliga anmälningar, och om
    ändring av kommissionens förordning (EU) nr 584/2010
