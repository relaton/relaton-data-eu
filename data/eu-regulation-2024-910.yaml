    vrijednosne papire (UCITS) i društava za upravljanje UCITS-ima te razmjene informacija
    između nadležnih tijela o obavijestima o prekograničnim djelatnostima, i o
    izmjeni Uredbe Komisije (EU) br. 584/2010
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/910 végrehajtási rendelete (2023. december 15.)
    a 2009/65/EK európai parlamenti és tanácsi irányelvnek az átruházható értékpapírokkal
    foglalkozó kollektív befektetési vállalkozások (ÁÉKBV) és az ÁÉKBV-alapkezelők
    határokon átnyúló tevékenységeivel kapcsolatban rendelkezésre bocsátandó
    információk formája és tartalma, valamint az illetékes hatóságok közötti,
    a határokon átnyúló tevékenységekre vonatkozó bejelentő levelekkel kapcsolatos
    információcsere tekintetében történő alkalmazására vonatkozó végrehajtás-technikai
    standardok megállapításáról, valamint az 584/2010/EU bizottsági rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/910 della Commissione, del 15 dicembre
    2023, che stabilisce norme tecniche di attuazione per l’applicazione della direttiva
    2009/65/CE del Parlamento europeo e del Consiglio per quanto riguarda la forma
    e il contenuto delle informazioni da notificare circa le attività transfrontaliere
    di organismi d’investimento collettivo in valori mobiliari (OICVM) e di società
    di gestione di OICVM e lo scambio di informazioni tra autorità competenti sulle
    lettere di notifica transfrontaliera, e che modifica il regolamento (UE) n. 584/2010
    della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/910 (2023. gada 15. decembris),
