  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/910, annettu 15 päivänä
    joulukuuta 2023, teknisistä täytäntöönpanostandardeista Euroopan parlamentin
    ja neuvoston direktiivin 2009/65/EY soveltamiseksi siirtokelpoisiin arvopapereihin
