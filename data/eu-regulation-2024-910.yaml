  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/910 оd 15. prosinca 2023. o utvrđivanju
    provedbenih tehničkih standarda za primjenu Direktive 2009/65/EZ Europskog parlamenta
    i Vijeća u pogledu oblika i sadržaja informacija koje se moraju dostaviti u
