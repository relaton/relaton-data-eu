title:
- language: en
  script: Latn
  content: Regulation (Euratom, ECSC, EEC) No 2530/72 of the Council of 4 December
    1972 introducing special and temporary measures applicable to the recruitment
    of officials of the European Communities in consequence of the accession of new
    Member States, and for the termination of service of officials of those Communities
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 2530/72 du Conseil, du 4 décembre
    1972, instituant des mesures particulières et temporaires concernant le recrutement
    de fonctionnaires des Communautés européennes en raison de l' adhésion de nouveaux
    États membres ainsi que la cessation définitive des fonctions de fonctionnaires
    de ces Communautés
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom, EGKS, EWG) Nr. 2530/72 des Rates vom 4. Dezember 1972
    zur Einführung vorübergehender Sondermaßnahmen betreffend die Einstellung von
    Beamten der Europäischen Gemeinschaften infolge des Beitritts neuer Mitgliedstaaten
    sowie das endgültige Ausscheiden von Beamten dieser Gemeinschaften aus dem Dienst
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EURATOM, EKSF, EØF) nr. 2530/72 af 4. december 1972
    om indførelse af særlige og midlertidige foranstaltninger vedrørende ansættelse
    af tjenestemænd i De europæiske Fællesskaber som følge af nye medlemsstaters
    tiltrædelse samt tjenestemænds udtræden af tjenesten i disse Fællesskaber
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom, CECA, CEE) n. 2530/72 del Consiglio, del 4 dicembre
    1972, che istituisce provvedimenti speciali e temporanei per l' assunzione di
    funzionari delle Comunità europee in conseguenza dell' adesione di nuovi Stati
    membri nonché per la cessazione definitiva dal servizio per taluni funzionari
    di queste Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom, EGKS, EEG) nr. 2530/72 van de Raad van 4 december
    1972 tot vaststelling van de bijzondere tijdelijke maatregelen betreffende de
    aanwerving van ambtenaren van de Europese Gemeenschappen ingevolge de toetreding
    van nieuwe Lid-Staten, alsmede betreffende de beëindiging van de dienst van ambtenaren
    van deze Gemeenschappen
  type: main
- language: pt
  script: Latn
  content: Regulamento (Euratom, CECA, CEE) n.° 2530/72 do Conselho, de 4 de Dezembro
    de 1972, que estabelece medidas especiais temporárias relativas ao recrutamento
    de funcionários das Comunidades Europeias, em consequência da adesão de novos
    Estados-membros, assim como à cessação definitiva de funções de funcionários
    destas Comunidades
  type: main
- language: es
  script: Latn
  content: Reglamento (Euratom, CECA, CEE) n° 2530/72 del Consejo, de 4 de diciembre
    de 1972, por el que se establecen medidas particulares y temporales relativas
    al reclutamiento de funcionarios de las Comunidades Europeas con motivo de la
    adhesión de nuevos Estados miembros, así como al cese definitivo de funcionarios
    de estas Comunidades
  type: main
