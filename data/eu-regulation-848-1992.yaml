id: EURegulation8481992
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 848/92 of 31 March 1992 amending Regulations
    (EEC) No 288/82, No 1765/82 and (EEC) No 3420/83 in order to establish the import
    arrangements for products originating in the independent States resulting from
    the former Soviet Union and suspend the application of certain quantitative restrictions
    to the Yugoslav Republic of Montenegro
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 848/92 du Conseil du 31 mars 1992 portant, par modification
    des règlements (CEE) n° 288/82, (CEE) n° 1765/82 et (CEE) n 3420/83, définition
    du régime commercial à l'importation applicable aux produits originaires des
    États indépendants issus de l'ancienne Union soviétique et suspension de certaines
    restrictions quantitatives à l'égard de la République yougoslave du Monténégro
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 848/92 DES RATES vom 31. März 1992 zur Festlegung
    der Einfuhrregelung für Waren mit Ursprung in den Unabhängigen Staaten der ehemaligen
    UdSSR und zur Aussetzung bestimmter mengenmäßiger Beschränkungen gegenüber
    der jugoslawischen Republik Montenegro durch Änderung der Verordnungen (EWG)
    Nr. 288/82, (EWG) Nr. 1765/82 und (EWG) Nr. 3420/83 #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 848/92 af 31. marts 1992 om fastsættelse
    af handelsordningen ved indførsel af varer med oprindelse i de uafhængige stater,
    som har erstattet det tidligere Sovjetunionen, og suspension af visse kvantitative
    restriktioner over for Den Jugoslaviske Republik Montenegro, ved ændring af forordning
    (EØF) nr. 288/82, (EØF) nr. 1765/82 og (EØF) nr. 3420/83 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 848/92 του Συμβουλίου
    της 31ης Μαρτίου 1992 για τον καθορισμό του εμπορικού
    καθεστώτος κατά την εισαγωγή που εφαρμόζεται
    στα προϊόντα καταγωγής των ανεξάρτητων κρατών
    που προέρχονται από την πρώην Σοβιετική Ένωση
    και την αναστολή ορισμένων ποσοτικών περιορισμών
    έναντι της Γιουγκοσλαβικής Δημοκρατίας του
    Μαυροβουνίου, κατόπιν τροποποίησης των κανονισμών
    (ΕΟΚ) αριθ. 288/82, (ΕΟΚ) αριθ. 1765/82 και (ΕΟΚ) αριθ.
    3420/83
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 848/92 DEL CONSIGLIO del 31 marzo 1992 recante, mediante
    modifica dei regolamenti (CEE) n. 288/82, (CEE) n. 1765/82 e (CEE) n. 3420/83,
    definizione del regime commerciale all'' importazione applicabile ai prodotti
    originari degli Stati indipendenti derivati dall'' ex Unione sovietica e sospensione
    di talune restrizioni quantitative nei confronti della Repubblica iugoslava del
    Montenegro #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 848/92 VAN DE RAAD van 31 maart 1992 houdende vaststelling,
    door wijziging van de Verordeningen (EEG) nr. 288/82, (EEG) nr. 1765/82 en (EEG)
    nr. 3420/83, van de handelsregeling bij invoer, van toepassing op de produkten
    van oorsprong uit de onafhankelijke Staten waarin de voormalige Sowjetunie is
    uiteengevallen, alsmede schorsing van bepaalde kwantitatieve beperkingen met betrekking
    tot de Joegoslavische Republiek Montenegro #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 848/92 DO CONSELHO de 31 de Março de 1992 que, através
    da alteração dos regulamentos (CEE) no 288/82, (CEE) no 1765/82 e (CEE) no 3420/83,
    define o regime comercial de importação aplicável aos produtos originários
    dos Estados independentes resultantes da antiga União Soviética e que suspende
    certas restrições quantitativas no que se refere à República Jugoslava do
    Montenegro #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 848/92 DEL CONSEJO de 31 de marzo de 1992 por el que,
    mediante modificación que los Reglamentos (CEE) nos 288/82, 1765/82 y 3420/83,
    se define el régimen comercial de importación aplicable a los productos originarios
    de los Estados independientes surgidos de la antigua Unión Soviética y se suspenden
    determinadas restricciones cuantitativas por lo que respecta a la República Yugoslava
    de Montenegro #'
  type: main
