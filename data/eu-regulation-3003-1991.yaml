title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3003/91 of 14 October 1991 re-establishing
    the levying of customs duties on products of category 20 (order No 40.0200), originating
    in Bulgaria, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3003/91 DE LA COMMISSION du 14 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 20 (numéro d'' ordre 40.0200) originaires de la Bulgarie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3003/91 DER KOMMISSION vom 14. Oktober 1991 über
    die Wiedereinführung des Zollsatzes für die Waren der Kategorie 20 (laufende
    Nummer 40.0200) mit Ursprung in Bulgarien, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3003/91 af 14. oktober 1991 om genindførelse
