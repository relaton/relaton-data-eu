    recomendaciones para la revisión de dichos objetivos [notificada con el número
    C(2022) 2283] (Los textos en lenguas alemana, francesa, griega, inglesa, letona,
    maltesa, neerlandesa, rumana y sueca son los únicos auténticos)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/728 av den 13 april 2022 om
    bristande överensstämmelse vad gäller vissa prestationsmål i de utkast till
    prestationsplaner på nationell nivå och på nivån för funktionella luftrumsblock
    som har lämnats in av Belgien, Tyskland, Grekland, Frankrike, Cypern, Lettland,
    Luxemburg, Malta, Nederländerna, Rumänien och Sverige i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 549/2004 med de unionstäckande prestationsmålen
    för den tredje referensperioden samt rekommendationer för översyn av dessa
    mål [delgivet med nr C(2022) 2283] (Endast de engelska, franska, grekiska, lettiska,
    maltesiska, nederländska, rumänska, svenska och tyska texterna är giltiga)
  type: main
