title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3323/91 of 13 November 1991 re-establishing
    the levying of customs duties on products of category 17 (order No 40.0170), originating
    in Indonesia, to which the preferential tariff arrangement set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3323/91 DE LA COMMISSION du 13 novembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 17 (numéro d'' ordre 40.0170) originaires de l'' Indonésie,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3323/91 DER KOMMISSION vom 13. November 1991 über
    die Wiedereinführung des Zollsatzes für die Waren der Kategorie 17 (laufende
    Nummer 40.0170) mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3323/91 af 13. november 1991 om genindførelse
