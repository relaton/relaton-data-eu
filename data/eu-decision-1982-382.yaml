type: standard
title:
- language: en
  script: Latn
  content: '82/382/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Conviron - Plant Growth Chamber, model PGV 36; - Growth Bench,
    model GB 48; - Cold Chamber, model C 816; - Chamber, model C 604 and - Incubator,
    model I 23 L''may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/382/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation des appareils dénommés "Conviron - Plant Growth Chamber, model
    PGV 36; - Growth Bench, model GB 48; - Cold Chamber, model C 816; - Chamber, model
    C 604 and - Incubator, model I 23 L" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/382/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß die Geräte "Conviron-Plant Growth Chamber, model PGV 36; Growth Bench,
    model GB 48; Cold Chamber, model C816; Chamber, model C604 and Incubator, model
    I 23 L" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/382/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
    af, at indførsel af apparatet "Conviron - Plant Growth Chamber, model PGV 36;
    - Growth Bench, model GB 48; - Cold Chamber, model C 816; - Chamber, model C 604
    and - Incubator, model I 23 L" ikke kan ske med fritagelse for told efter den
    fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/382/EOK: Απόφαση τής Επιτροπής τής 19ης Μαΐου
    1982 περί διαπιστώσεως ότι η εισαγωγή τών συσκευών
    μέ τήν ονομασία «Conviron — Plant Growth Chamber, model PGV 36
    — Growth Bench, model GB 48 — Cold Chamber, model C 816 — Chamber, model
    C 604 καί — Incubator, model I 23 L» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/382/CEE: Decisione della Commissione, del 19 maggio 1982, che stabilisce
    che l''importazione degli apparecchi denominati "Conviron - Plant Growth Chamber,
    model PGV 36; - Growth Bench, model GB 48; - Cold Chamber, model C 816; - Chamber,
    model C 604 and - Incubator, model I 23 L" non può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/382/EEG: Beschikking van de Commissie van 19 mei 1982 waarbij wordt
    vastgesteld dat de apparaten genaamd ,,Conviron-Plant Growth Chamber, model PGV
    36; -Growth Bench, model GB48; -Cold Chamber, model C816; -Chamber, model C604
    and Incubator, model I23L" niet met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mogen worden ingevoerd'
  type: main
