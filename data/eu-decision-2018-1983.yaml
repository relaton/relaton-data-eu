    modifiant les annexes I et II de la décision 2003/467/CE en ce qui concerne certaines
    régions d'Italie déclarées officiellement indemnes de tuberculose et officiellement
    indemnes de brucellose pour ce qui est des troupeaux bovins [notifiée sous le
    numéro C(2018) 6981]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1983 der Kommission vom 26. Oktober 2018
