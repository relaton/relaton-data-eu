title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1983 of 26 October 2018 amending
    Annexes I and II to Decision 2003/467/EC as regards the declaration of certain
    regions of Italy as officially tuberculosis-free and officially brucellosis-free
    in relation to bovine herds (notified under document C(2018) 6981)
  type: main
- language: fr
  script: Latn
