    der Anerkennung bestimmter Regionen Italiens als amtlich tuberkulosefrei und als
    in Bezug auf Rinderbestände amtlich brucellosefrei (Bekannt gegeben unter Aktenzeichen
    C(2018) 6981)
  type: main
- language: bg
  script: Cyrl
