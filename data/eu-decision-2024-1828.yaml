---
id: EUDecision20241828
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/1828 of 2 July 2024 renewing
    the authorisation for the placing on the market of feed containing, consisting
    of and of food and feed products produced from genetically modified maize MON
    810 pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of
    the Council and repealing Commission Implementing Decision (EU) 2017/1207 (notified
    under document C(2024) 4493)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/1828 de la Commission du 2 juillet 2024
    renouvelant l’autorisation de mise sur le marché d’aliments pour animaux
    contenant du maïs génétiquement modifié MON 810 ou consistant en ce maïs
    et de produits destinés à l’alimentation humaine ou animale produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil, et abrogeant la décision d’exécution (UE) 2017/1207 de la Commission
    [notifiée sous le numéro C(2024) 4493]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/1828 der Kommission vom 2. Juli 2024
    zur Erneuerung der Zulassung für das Inverkehrbringen von Futtermitteln, die
    genetisch veränderten Mais MON 810 enthalten oder aus ihm bestehen, sowie von
    Lebens- und Futtermitteln, die aus diesem genetisch veränderten Mais gewonnen
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates sowie zur Aufhebung des Durchführungsbeschlusses (EU) 2017/1207
    der Kommission (Bekannt gegeben unter Aktenzeichen C(2024) 4493)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/1828 на Комисията
    от 2 юли 2024 година за подновяване на разрешението
    за пускане на пазара на фуражи, съдържащи, състоящи
    се от генетично модифицирана царевица MON 810
    и на храни и фуражи, произведени от нея, в съответствие
    с Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета и за отмяна на Решение за изпълнение
    (ЕС) 2017/1207 на Комисията (нотифицирано под номер
    С(2024) 4493)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/1828 ze dne 2. července 2024
    o obnovení povolení pro uvádění krmiv, která obsahují geneticky modifikovanou
    kukuřici MON 810 nebo z ní sestávají, a potravin a krmiv z ní vyrobených
    na trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 a o
    zrušení prováděcího rozhodnutí Komise (EU) 2017/1207 (oznámeno pod číslem
    C(2024) 4493)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/1828 af 2. juli 2024
    om forlængelse af tilladelsen til markedsføring af foderstoffer, der indeholder,
    består af og af fødevarer og foderstoffer, der er fremstillet af genetisk modificeret
    MON 810-majs, i henhold til Europa-Parlamentets og Rådets forordning (EF) nr.
    1829/2003, og om ophævelse af Kommissionens gennemførelsesafgørelse (EU) 2017/1207
    (meddelt under nummer C(2024) 4493)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/1828 της Επιτροπής,
