    (ΕΕ) 2017/1207 της Επιτροπής [κοινοποιηθείσα υπό
    τον αριθμό C(2024) 4493]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2024/1828, 2. juuli 2024, millega pikendatakse
    geneetiliselt muundatud maisi MON 810 sisaldava, sellest koosneva ja sellest valmistatud
    toidu ja sööda turuleviimise loa kehtivust vastavalt Euroopa Parlamendi ja nõukogu
    määrusele (EÜ) nr 1829/2003 ning tunnistatakse kehtetuks komisjoni rakendusotsus
    (EL) 2017/1207 (teatavaks tehtud numbri C(2024) 4493 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2024/1828, annettu 2 päivänä
    heinäkuuta 2024, muuntogeenistä maissia MON 810 sisältävien tai siitä koostuvien
    rehujen sekä siitä valmistettujen elintarvikkeiden ja rehujen markkinoille saattamista
    koskevan luvan uusimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti ja komission täytäntöönpanopäätöksen (EU) 2017/1207
    kumoamisesta (tiedoksiannettu numerolla C(2024) 4493)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2024/1828 ón gCoimisiún an 2 Iúil 2024
    lena n-athnuaitear an t-údarú chun beatha a chur ar an margadh, ar beatha í
    ina bhfuil arbhar Indiach géinmhodhnaithe MON 810 nó atá comhdhéanta de agus
    chun táirgí bia agus táirgí beatha a chur ar an margadh a tháirgtear as arbhar
    Indiach géinmhodhnaithe MON 810 de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint
    na hEorpa agus ón gComhairle agus lena n-aisghairtear Cinneadh Cur Chun Feidhme
    (AE) 2017/1207 ón gCoimisiún (tugadh fógra faoi leis an doiciméad C(2024)
    4493)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2024/1828 оd 2. srpnja 2024. o produljenju
    odobrenja za stavljanje na tržište hrane za životinje koja sadržava genetski
    modificirani kukuruz MON 810 i sastoji se od njega te hrane i hrane za životinje
    proizvedene od genetski modificiranog kukuruza MON 810, u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća te o stavljanju izvan snage Provedbene
    odluke Komisije (EU) 2017/1207 (priopćeno pod brojem dokumenta C(2024) 4493)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1828 végrehajtási határozata (2024. július 2.)
    a géntechnológiával módosított MON 810 kukoricát tartalmazó, abból álló
    takarmányok vagy abból előállított takarmány- és élelmiszertermékek forgalomba
    hozatalára vonatkozó engedély 1829/2003/EK európai parlamenti és tanácsi
    rendelet szerinti megújításáról, valamint az (EU) 2017/1207 bizottsági végrehajtási
    határozat hatályon kívül helyezéséről (az értesítés a C(2024) 4493.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/1828 della Commissione, del 2 luglio
    2024, che rinnova l’autorizzazione all’immissione in commercio di mangimi
    contenenti o costituiti da granturco geneticamente modificato MON 810 nonché
    di alimenti e mangimi derivati dal medesimo granturco geneticamente modificato
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    e che abroga la decisione di esecuzione (UE) 2017/1207 della Commissione [notificata
    con il numero C(2024) 4493]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/1828 (2024. gada 2. jūlijs),
    ar ko, ievērojot Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1829/2003, atjauno
    atļauju laist tirgū barību, kura satur ģenētiski modificētu kukurūzu MON
    810 vai sastāv no tās, kā arī no šādas kukurūzas ražotus pārtikas un
    barības produktus, un atceļ Komisijas Īstenošanas lēmumu (ES) 2017/1207 (izziņots
    ar dokumenta numuru C(2024) 4493)
  type: main
- language: lt
  script: Latn
  content: 2024 m. liepos 2 d. Komisijos įgyvendinimo sprendimas (ES) 2024/1828,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 atnaujinamas
    leidimas pateikti rinkai pašarus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų MON 810 arba kurie iš jų sudaryti, ir maisto produktus ir pašarus,
    pagamintus iš genetiškai modifikuotų kukurūzų MON 810, ir panaikinamas Komisijos
    įgyvendinimo sprendimas (ES) 2017/1207 (pranešta dokumentu Nr. C(2024) 4493)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1828 tat-2
    ta’ Lulju 2024 li ġġedded l-awtorizzazzjoni għall-introduzzjoni fis-suq ta’
    għalf li fih il-qamħirrum ġenetikament modifikat MON 810 u li jikkonsisti minnu,
    u ta’ prodotti tal-ikel u tal-għalf prodotti minn dak il-qamħirrum ġenetikament
    modifikat skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill
    u li tħassar id-Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/1207
    (notifikata bid-dokument C(2024) 4493)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/1828 van de Commissie van 2 juli 2024 tot
    verlenging van de vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 810 overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement
    en de Raad en tot intrekking van Uitvoeringsbesluit (EU) 2017/1207 van de Commissie
    (Kennisgeving geschied onder nummer C(2024) 4493)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/1828 z dnia 2 lipca 2024 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, paszy zawierającej genetycznie zmodyfikowaną
    kukurydzę MON 810 lub składającej się z niej oraz żywności i produktów
    paszowych wyprodukowanych z tej kukurydzy, a także uchylająca decyzję wykonawczą
    Komisji (UE) 2017/1207 (notyfikowana jako dokument nr C(2024) 4493)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/1828 da Comissão, de 2 de julho de 2024,
    que renova a autorização de colocação no mercado de alimentos para animais
    que contenham ou sejam constituídos por milho geneticamente modificado MON 810
    e de géneros alimentícios e alimentos para animais produzidos a partir de desse
    milho geneticamente modificado, nos termos do Regulamento (CE) n.o 1829/2003 do
    Parlamento Europeu e do Conselho, e que revoga a Decisão de Execução (UE) 2017/1207
    da Comissão [notificada com o número C(2024) 4493]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/1828 a Comisiei din 2 iulie 2024
    de reînnoire a autorizației de introducere pe piață a furajelor care conțin,
    constau în sau sunt fabricate din produse alimentare și furaje fabricate din
    porumb modificat genetic MON 810 în temeiul Regulamentului (CE) nr. 1829/2003
    al Parlamentului European și al Consiliului și de abrogare a Deciziei de punere
    în aplicare (UE) 2017/1207 a Comisiei [notificată cu numărul C(2024) 4493]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/1828 z 2. júla 2024, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh krmivá, ktoré obsahujú geneticky modifikovanú
    kukuricu MON 810 alebo sú z nej zložené, a potraviny a krmivá vyrobené z
    geneticky modifikovanej kukurice MON 810 a ktorým sa zrušuje vykonávacie rozhodnutie
    Komisie (EÚ) 2017/1207 [oznámené pod číslom C(2024) 4493]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/1828 z dne 2. julija 2024 o obnovitvi
    odobritve za dajanje na trg krme, ki vsebuje gensko spremenjeno koruzo MON 810
    ali je iz nje sestavljena, ter živil in krme, proizvedenih iz nje, v skladu z
    Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta ter razveljavitvi Izvedbenega
    sklepa Komisije (EU) 2017/1207 (notificirano pod dokumentarno številko C(2024)
    4493)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/1828 de la Comisión, de 2 de julio de
    2024, por la que se renueva la autorización de comercialización de piensos que
    contengan o estén compuestos por maíz modificado genéticamente MON 810 y de
    alimentos y piensos producidos a partir de él, con arreglo al Reglamento (CE)
    n.o 1829/2003 del Parlamento Europeo y del Consejo, y por la que se deroga la
    Decisión de Ejecución (UE) 2017/1207 de la Comisión [notificada con el número
    C(2024) 4493]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2024/1828 av den 2 juli 2024 om
    förlängning av godkännandet för utsläppande på marknaden av foder som innehåller
    eller består av den genetiskt modifierade majsen MON 810 och av livsmedel och
    foderprodukter som har framställts av den genetiskt modifierade majsen MON 810
    i enlighet med Europaparlamentets och rådets förordning (EG) nr 1829/2003 och
    om upphävande av kommissionens genomförandebeslut (EU) 2017/1207 [delgivet med
    nr document C(2024) 4493]
