title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1095 of 25 June 2019 amending
    Annex II to Decision 2007/777/EC as regards the entries for Bosnia and Herzegovina
    and Russia in the list of third countries or parts thereof from which the introduction
    into the Union of meat products and treated stomachs, bladders and intestines
    is authorised (notified under document C(2019) 4285)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1095 de la Commission du 25 juin 2019
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne les entrées
    relatives à la Bosnie-Herzégovine et à la Russie dans la liste des pays tiers
    ou parties de pays tiers à partir desquels l'introduction dans l'Union de produits
    à base de viande ainsi que d'estomacs, de vessies et de boyaux traités est autorisée
    [notifiée sous le numéro C(2019) 4285]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1095 der Kommission vom 25. Juni 2019
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich der Einträge
    für Bosnien und Herzegowina und Russland in der Liste der Drittländer bzw. der
    Teile von Drittländern, aus denen die Einfuhr von Fleischerzeugnissen und behandelten
    Mägen, Blasen und Därmen in die Europäische Union gestattet ist (Bekannt gegeben
    unter Aktenzeichen C(2019) 4285)
  type: main
