  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1095 a Comisiei din 25 iunie 2019
    de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubricile
    pentru Bosnia și Herțegovina și Rusia în lista cu țări terțe sau părți
    ale acestora din care se autorizează introducerea în Uniune a produselor din
    carne și a stomacurilor, vezicilor și intestinelor tratate [notificată cu numărul
    C(2019) 4285]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1095 z 25. júna 2019, ktorým
