    le voci relative alla Bosnia-Erzegovina e alla Russia nell'elenco dei paesi terzi
    o di parti di paesi terzi da cui è autorizzata l'introduzione nell'Unione di
    prodotti a base di carne e stomaci, vesciche e intestini trattati [notificata
    con il numero C(2019) 4285]
  type: main
- language: lv
  script: Latn
