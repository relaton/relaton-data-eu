  content: COMMISSION REGULATION (EC) No 116/95 of 25 January 1995 determining the
    extent to which application lodged in January 1995 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
