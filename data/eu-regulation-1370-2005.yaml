---
id: EURegulation13702005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1370/2005 of 22 August 2005 initiating a
    review of Council Regulations (EC) No 1975/2004 and (EC) No 1976/2004 extending
    definitive anti-dumping and countervailing duties on imports of polyethylene terephthalate
    (PET) film originating, inter alia, in India, to imports of that product consigned
    from, inter alia, Israel for the purposes of determining the possibility of granting
    an exemption from those measures to one Israeli exporter, repealing the anti-dumping
    duty with regard to imports from that exporter and making imports from that exporter
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1370/2005 de la Commission du 22 août 2005 portant
    ouverture d'un réexamen du règlement (CE) n° 1975/2004 et du règlement (CE)
    n° 1976/2004 du Conseil portant extension des droits antidumping et des droits
    compensateurs définitifs sur les importations de feuilles en polyéthylène téréphtalate
    (PET) originaires, entre autres, de l’Inde, aux importations de ce produit expédiées,
    entre autres, d'Israël, afin d’étudier la possibilité d’accorder une exemption
    de ces mesures à un exportateur israélien, abrogeant le droit antidumping pour
    les importations effectuées par cet exportateur et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1370/2005 der Kommission vom 22. August 2005 zur Einleitung
    einer Überprüfung der Verordnungen (EG) Nr. 1975/2004 und (EG) Nr. 1976/2004
    des Rates zur Ausweitung des endgültigen Antidumping- und des endgültigen Ausgleichszolls
    auf die Einfuhren von Folien aus Polyethylenterephthalat (PET) mit Ursprung in
    unter anderem Indien auf unter anderem aus Israel versandte Einfuhren der betroffenen
    Ware zum Zwecke der Prüfung der Möglichkeit einer Befreiung eines israelischen
    Ausführers von diesen Maßnahmen sowie zur Aufhebung des Antidumpingzolls gegenüber
    den Einfuhren dieses Ausführers und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1370/2005 ze dne 22. srpna 2005, kterým se
    zahajuje přezkum nařízení Rady (ES) č. 1975/2004 a (ES) č. 1976/2004, kterými
    se rozšiřuje konečné antidumpingové a vyrovnávací clo z dovozu polyethylentereftalátového
    (PET) filmu pocházejícího mimo jiné z Indie na dovoz tohoto výrobku zasílaného
    mimo jiné z Izraele, jehož cílem je určit, zda od těchto opatření lze osvobodit
    jednoho izraelského vývozce, kterým se zrušuje antidumpingové clo u dovozů
    od tohoto vývozce a na základě kterého dovozy tohoto vývozce podléhají
    celní evidenci
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1370/2005 af 22. august 2005 om indledning
    af en fornyet undersøgelse af Rådets forordning (EF) nr. 1975/2004 og 1976/2004
    om udvidelse af den endelige antidumpingtold på importen af polyethylenterephthalatfolie
    (PET-folie) med oprindelse i bl.a. Indien, til import af polyethylenterephthalatfolie
    afsendt fra bl.a. Israel med henblik på at fastslå, om der kan indrømmes en
    undtagelse for en israelsk eksportør fra disse foranstaltninger, og om ophævelse
    af antidumpingtolden på import fra nævnte eksportør og om at lade import fra
    nævnte eksportør registrere
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1370/2005 της Επιτροπής,
    της 22ας Αυγούστου 2005, για την έναρξη επανεξέτασης
    των κανονισμών (ΕΚ) αριθ. 1975/2004 και (ΕΚ) αριθ.
    1976/2004 του Συμβουλίου για την επέκταση του οριστικού
    δασμού αντιντάμπινγκ και του οριστικού αντισταθμιστικού
    δασμού στις εισαγωγές ταινιών τερεφθαλικού
    πολυαιθυλενίου (PET) καταγωγής, μεταξύ άλλων,
    Ινδίας, στις εισαγωγές αυτών των προϊόντων
    που αποστέλλονται, μεταξύ άλλων, από το Ισραήλ
    για να εξεταστεί η δυνατότητα χορήγησης απαλλαγής
    από τα μέτρα αυτά σε ένα εξαγωγέα από το Ισραήλ,
    για την κατάργηση του δασμού αντιντάμπινγκ
    όσον αφορά τις εισαγωγές που προέρχονται από
    αυτό τον εξαγωγέα και για την υπαγωγή των εν
    λόγω εισαγωγών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1370/2005, 22. august 2005, millega algatatakse
    nõukogu määruste (EÜ) nr 1975/2004 ja (EÜ) nr 1976/2004 läbivaatamine, (millega
    laiendatakse muuhulgas Indiast pärineva polüetüleentereftalaatkile (PET-kile)
    impordi suhtes kehtestatud lõplikku dumpinguvastast ja tasakaalustavat tollimaksu
    muuhulgas Iisraelist saadetud kõnealuse toote suhtes) et teha kindlaks võimalus
    teha kõnealuste meetmete kohaldamise suhtes erand ühele Iisraeli eksportijale,
    tunnistades kehtetuks dumpinguvastase tollimaksu kõnealuse eksportija impordi
    suhtes ning kehtestades sellelt eksportijalt pärineva impordi registreerimise
    nõude
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1370/2005, annettu 22 päivänä elokuuta 2005,
    muun muassa Intiasta peräisin olevan polyeteenitereftalaattikalvon (PET-kalvon)
    tuonnissa käyttöön otettujen lopullisten polkumyyntitullien ja tasoitustullien
    laajentamisesta koskemaan polyeteenitereftalaattikalvon (PET-kalvon) tuontia muun
    muassa Israelista annettujen neuvoston asetusten (EY) N:o 1975/2004 ja (EY) N:o
    1976/2004 tarkastelun vireillepanosta sen määrittämiseksi, voidaanko näistä
    toimenpiteistä myöntää poikkeus yhdelle israelilaiselle viejälle, kumota
    polkumyyntitulli kyseisen viejän tuonnissa ja tehdä kyseisen viejän tuonnin
    kirjaaminen pakolliseksi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1370/2005/EK rendelete (2005. augusztus 22.) a többek között
    az Indiából származó polietilén-tereftalát (PET) fólia behozatalára kivetett
    végleges dömpingellenes és kiegyenlítő vámoknak többek között az e termék
    Izraelből szállított behozatalára történő kiterjesztéséről szóló 1975/2004/EK
    és 1976/2004/EK tanácsi rendelet felülvizsgálatának megindításáról annak
    megállapítására, hogy mentesség adható-e ezen intézkedések alól egy izraeli
    exportőr számára, hatályon kívül helyezve a dömpingellenes vámot az ezen
    exportőrtől származó behozatal tekintetében, valamint kötelezővé téve
    az ezen exportőrtől származó behozatalok nyilvántartásba vételét
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1370/2005 della Commissione, del 22 agosto 2005, che
    avvia un riesame dei regolamenti del Consiglio (CE) n. 1975/2004 e (CE) n. 1976/2004
    che estendono il dazio antidumping definitivo e il dazio compensativo definitivo
    sulle importazioni di fogli di polietilene tereftalato (PET) originari, tra l’altro,
    dell’India alle importazioni di tali prodotti spediti, tra l’altro, da Israele,
    allo scopo di determinare la possibilità di concedere l’esenzione da queste
    misure a un esportatore israeliano, che abroga il dazio antidumping sulle importazioni
    in provenienza da detto esportatore e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1370/2005 (2005. gada 22. augusts), ar ko uzsāk
    to Padomes Regulu (EK) Nr. 1975/2004 un (EK) Nr. 1976/2004 pārskatīšanu, ar
    ko galīgos antidempinga un kompensācijas maksājumus, ko piemēro tādas polietilēna
    tereftalāta (PET) plēves importam, kuras izcelsme, cita starpā, ir Indijā,
    piemēro arī tāda minētā ražojuma importam, ko, cita starpā, ieved no Izraēlas,
    lai noteiktu iespēju vienu Izraēlas eksportētāju atbrīvot no šo pasākumu
    piemērošanas, ar ko atceļ antidempinga maksājumu attiecībā uz importu no
    minēta eksportētāja un minēto importu pakļauj reģistrācijai
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugpjūčio 22 d. Komisijos reglamentas (EB) Nr. 1370/2005, inicijuojantis
    Tarybos reglamentų (EB) Nr. 1975/2004 ir 1976/2004, išplečiančių galutinio
    antidempingo ir galutinio kompensacinio muito, įvesto, inter alia, Indijos kilmės
    polietileno tereftalato (PET) plėvelės importui, taikymą polietileno tereftalato
    (PET) plėvelės, įvežamos, inter alia, iš Izraelio, importui, peržiūrą
    siekiant nustatyti, ar galima netaikyti šių priemonių vienam Izraelio eksportuotojui,
    panaikinti antidempingo muitą šio eksportuotojo importui ir registruoti šio
    eksportuotojo importą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1370/2005 tat- 22 ta' Awissu 2005 li
    jniedi reviżjoni tar-Regolamenti tal-Kunsill (KE) Nri 1975/2004 u 1976/2004 li
    testendi d-dazji definittivi ta’ l-anti-dumping u ta’ kontro-bilanċ fuq l-importazzjonijiet
    ta’ tertuqa tat-tereftalat tal-polietilene (PET) li joriġinaw, inter alia,
    fl-Indja, għall-importazzjoniiet ta’ dan il-prodott ikkonsenjat, inter alia,
    mill-Iżrael għall-għanijiet li tiġi ddeterminata l-possibilità li tingħata
    eżenzjoni minn dawk il-miżuri lil esportatur wieħed ta’ l-Iżrael, li tirrevoka
    d-dazju ta’ l-anti-dumping rigward importazzjonijiet minn għand dan l-esportatur
    u biex l-importazzjonijiet minn għand dan l-esportatur ikunu suġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1370/2005 van de Commissie van 22 augustus 2005 tot
    inleiding van een procedure voor de eventuele vrijstelling van een Israëlische
    exporteur van de bij Verordeningen (EG) nr. 1975/2004 en (EG) nr. 1976/2004 tot
    Israël uitgebreide antidumpingrechten en compenserende rechten op PET-folie uit
    India, tot intrekking van het antidumpingrecht ten aanzien van die importeur en
    tot registratie van de invoer van PET-folie afkomstig van die exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1370/2005 z dnia 22 sierpnia 2005 r. wszczynające
    przegląd rozporządzeń Rady (WE) nr 1975/2004 i (WE) nr 1976/2004 rozszerzających
    ostateczne cła antydumpingowe i wyrównawcze nałożone na przywóz folii z politereftalanu
    etylenu (PET), pochodzącej między innymi z Indii, na przywóz tego produktu
    wysłanego z Izraela, w celu określenia możliwości przyznania jednemu eksporterowi
    izraelskiemu zwolnienia z tych środków, uchylające cło antydumpingowe w odniesieniu
    do przywozu towarów przez tego eksportera oraz poddające ten przywóz wymogowi
    rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1370/2005 da Comissão, de 22 de Agosto de 2005,
    que inicia um reexame dos Regulamentos (CE) n.° 1975/2004 e (CE) n.° 1976/2004
    do Conselho que torna extensivos os direitos anti-dumping definitivos e os direitos
    de compensação sobre as importações de películas de poli(tereftalato de etileno)
    (PET) originárias, nomeadamente, da Índia, às importações desse produto expedido,
    nomeadamente, de Israel para efeitos de determinar a possibilidade de conceder
    uma isenção dessas medidas a um exportador de Israel, que revoga o direito anti-dumping
    no que diz respeito às importações provenientes desse exportador e que sujeita
    as importações desse exportador a registo
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1370/2005 z 22. augusta 2005 o začatí preskúmania
    nariadení Rady (ES) č. 1975/2004 a (ES) č. 1976/2004, ktorými sa rozširujú
    konečné antidumpingové a vyrovnávacie clá na dovoz fólie z polyetyléntereftalátu
    (PET) pôvodom okrem iného z Indie na dovoz uvedeného výrobku, odosielaného
    okrem iného z Izraela, na účely stanovenia možnosti udelenia výnimky z uvedených
    opatrení jednému izraelskému vývozcovi, o zrušení antidumpingového cla,
    pokiaľ ide o dovoz od uvedeného vývozcu, a o zavedení registrácie dovozu
    od uvedeného vývozcu
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1370/2005 z dne 22. avgusta 2005 o začetku pregleda
    uredb Sveta (ES) št. 1975/2004 in (ES) št. 1976/2004 o razširitvi dokončnih
    protidampinških in izravnalnih dajatev na uvoz filma polietilentereftalata (PET),
    med drugim s poreklom iz Indije, na uvoz zadevnega izdelka, med drugim poslanega
    iz Izraela, da se za določenega izraelskega izvoznika ugotovijo možnosti odobritve
    izvzetja iz teh ukrepov ob odpravi protidampinških dajatev pri uvozu in uvedbi
    prijave uvoza zadevnega izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1370/2005 de la Comisión, de 22 de agosto de 2005,
    por el que se inicia una reconsideración de los Reglamentos (CE) n° 1975/2004
    y (CE) n° 1976/2004 del Consejo, por los que se amplían los derechos antidumping
    y antisubvenciones definitivos sobre las importaciones de películas de tereftalato
    de polietileno (PET) originarias, entre otros países, de la India a las importaciones
    de ese producto procedentes, entre otros países, de Israel, a fin de determinar
    la posibilidad de eximir de tales medidas a un exportador israelí, de derogar
    los derechos antidumping con respecto a las importaciones provenientes de ese
    exportador y de someter estas importaciones a la obligación de registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1370/2005 av den 22 augusti 2005 om inledande
    av en översyn av rådets förordningar (EG) nr 1975/2004 och (EG) nr 1976/2004
    om utvidgning av de slutgiltiga antidumpningstullar och utjämningstullar som
    införts på import av polyetentereftalatfilm med ursprung i bl.a. Republiken
    Indien till att även gälla import av polyetentereftalatfilm som sänds från
    bland annat Staten Israel i syfte att fastställa om det är möjligt att bevilja
    en israelisk exportör undantag från dessa åtgärder, upphäva antidumpningstullen
    avseende import från den exportören samt göra import från den exportören
    föremål för registrering
  type: main
