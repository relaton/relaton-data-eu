title:
- language: fr
  script: Latn
  content: Décision 65/20/CEE de la Commission, du 23 décembre 1964, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/20/EWG: Entscheidung der Kommission vom 23. Dezember 1964 betreffend
    den Antrag der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages,
    um bestimmte, aus einem dritten Land stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Erzeugnisse von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/20/CEE: Decisione della Commissione, del 23 dicembre 1964, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario determinati prodotti originari di paesi
    terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/20/EEG: Beschikking van de Commissie van 23 december 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
