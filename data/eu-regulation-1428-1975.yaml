id: EURegulation14281975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1428/75 of the Commission of 2 June 1975 re-establishing
    the levying of the customs duties on knives with cutting blades, serrated or not
    (including pruning knives), other than knives falling within heading No 82.06,
    falling within heading No 82.09, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1428/75 de la Commission, du 2 juin 1975, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    (autres que ceux du numéro 82.06) à lame tranchante ou dentelée, y compris
    les serpettes fermantes, de la position tarifaire 82.09, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1428/75 der Kommission vom 2. Juni 1975 zur Wiedereinführung
    des Zollsatzes für Messer (andere als die der Tarifnummer 82.06) mit schneidender
    oder gezahnter Klinge, einschließlich Klappmesser für den Gartenbau, der Tarifnummer
    82.09, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3054/74
    des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1428/75 af 2. juni 1975 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskærerknive)
    under position 82.09, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1428/75 della Commissione, del 2 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli (diversi da
    quelli della voce n. 82.06) a lama trinciante o dentata, compresi i roncoli chiudibili
    della voce doganale n. 82.09 originari della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1428/75 van de Commissie van 2 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op messen (andere
    dan die bedoeld bij post 82.06), ook indien getand, zaksnoeimessen daaronder begrepen,
    van post 82.09, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
