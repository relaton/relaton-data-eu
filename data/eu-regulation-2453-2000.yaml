    betreffend die Dauerausschreibungen zur Ausfuhr von Getreide aus Beständen bestimmter
    Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2453/2000 af 7. november 2000 om ophævelse
