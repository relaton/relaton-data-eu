title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 290/2014 of 21 March 2014 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase and endo-1,3(4)-beta-glucanase
    produced by Talaromyces versatilis sp. nov. IMI CC 378536 as a feed additive for
    poultry, weaned piglets and pigs for fattening and amending Regulations (EC) No
    1259/2004, (EC) No 943/2005, (EC) No 1206/2005 and (EC) No 322/2009 (holder of
    the authorisation Adisseo France S.A.S.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 290/2014 de la Commission du 21 mars
    2014 concernant l’autorisation d’une préparation d’endo-1,4-bêta-xylanase
    et d’endo-1,3(4)-bêta-glucanase produits par Talaromyces versatilis sp. nov.
    IMI CC 378536 en tant qu’additif pour l’alimentation des volailles, des porcelets
    sevrés et des porcs d’engraissement et modifiant les règlements (CE) n °
    1259/2004, (CE) n ° 943/2005, (CE) n ° 1206/2005 et (CE) n ° 322/2009 (titulaire
    de l’autorisation: Adisseo France SAS)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 290/2014 der Kommission vom 21. März
    2014 zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase und Endo-1,3(4)-beta-Glucanase
    aus Talaromyces versatilis sp. nov. IMI CC 378536 als Zusatzstoff in Futtermitteln
    für Geflügel, entwöhnte Ferkel und Mastschweine sowie zur Änderung der Verordnungen
    (EG) Nr. 1259/2004, (EG) Nr. 943/2005, (EG) Nr. 1206/2005 und (EG) Nr. 322/2009
    (Zulassungsinhaber Adisseo France SAS)
  type: main
