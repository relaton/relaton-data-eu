    endo-1,4-beta-ksilanāzes un endo-1,3(4)-beta-glikanāzes preparātu kā barības
    piedevu mājputniem, atšķirtiem sivēniem un nobarojamām cūkām un ar ko groza
    Regulu (EK) Nr. 1259/2004, (EK) Nr. 943/2005, (EK) Nr. 1206/2005 un (EK) Nr. 322/2009
