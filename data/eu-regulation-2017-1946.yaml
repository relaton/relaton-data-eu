    2014/65/UE par des normes techniques de réglementation concernant la liste exhaustive
    d'informations que les candidats acquéreurs doivent joindre à la notification
    de l'acquisition envisagée d'une participation qualifiée dans une entreprise
    d'investissement
  type: main
- language: de
  script: Latn
