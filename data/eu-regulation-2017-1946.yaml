  script: Latn
  content: Commission Delegated Regulation (EU) 2017/1946 of 11 July 2017 supplementing
    Directives 2004/39/EC and 2014/65/EU of the European Parliament and of the Council
    with regard to regulatory technical standards for an exhaustive list of information
    to be included by proposed acquirers in the notification of a proposed acquisition
    of a qualifying holding in an investment firm
  type: main
- language: fr
  script: Latn
