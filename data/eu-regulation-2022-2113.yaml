    kollettiv Ewropej għan-negozji
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2113 van de Commissie van 13 juli 2022
    tot aanvulling van Verordening (EU) 2020/1503 van het Europees Parlement en de
    Raad met technische reguleringsnormen voor de uitwisseling van informatie tussen
    bevoegde autoriteiten over onderzoeks-, toezichts- en handhavingsactiviteiten
    met betrekking tot Europese crowdfundingdienstverleners voor bedrijven
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2113 z dnia 13 lipca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2020/1503
    w odniesieniu do regulacyjnych standardów technicznych dotyczących wymiany informacji
    między właściwymi organami w związku z prowadzeniem czynności wyjaśniających,
    nadzorczych i związanych z egzekwowaniem prawa w odniesieniu do europejskich
    dostawców usług finansowania społecznościowego dla przedsięwzięć gospodarczych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2113 da Comissão de 13 de julho de 2022
    que complementa o Regulamento (UE) 2020/1503 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação no domínio da troca
    de informações entre as autoridades competentes relativamente às atividades
    de investigação, supervisão e aplicação da lei em relação aos prestadores
    europeus de serviços de financiamento colaborativo às empresas
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2113 al Comisiei din 13 iulie 2022 de completare
    a Regulamentului (UE) 2020/1503 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare pentru schimbul de informații
    între autoritățile competente în legătură cu activitățile de investigare,
    de supraveghere și de asigurare a respectării legislației referitoare la furnizorii
    europeni de servicii de finanțare participativă pentru afaceri
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2113 z 13. júla 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2020/1503, pokiaľ
    ide o regulačné technické predpisy týkajúce sa výmeny informácií medzi
    príslušnými orgánmi v súvislosti s činnosťami spojenými s vyšetrovaním,
    dohľadom a presadzovaním práva vo vzťahu k európskym poskytovateľom služieb
    hromadného financovania pre podnikanie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2113 z dne 13. julija 2022 o dopolnitvi
    Uredbe (EU) 2020/1503 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi za izmenjavo informacij med pristojnimi organi glede preiskovalnih,
    nadzornih in izvršilnih dejavnosti v zvezi z evropskimi ponudniki storitev množičnega
    financiranja za podjetnike
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2113 de la Comisión de 13 de julio de 2022
    por el que se completa el Reglamento (UE) 2020/1503 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación para el intercambio
    de información entre las autoridades competentes en relación con las actividades
    de investigación, supervisión y control del cumplimiento con respecto a los
    proveedores europeos de servicios de financiación participativa para empresas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2113 av den 13 juli 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/1503
    vad gäller tekniska tillsynsstandarder för utbyte av information mellan behöriga
    myndigheter i samband med verksamhet som rör utredning, tillsyn och efterlevnad
    i förhållande till europeiska leverantörer av gräsrotsfinansieringstjänster
