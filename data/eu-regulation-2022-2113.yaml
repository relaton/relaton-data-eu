  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2113 of 13 July 2022 supplementing
    Regulation (EU) 2020/1503 of the European Parliament and of the Council with regard
    to regulatory technical standards for the exchange of information between competent
    authorities in relation to investigation, supervision and enforcement activities
    in relation to European crowdfunding service providers for business
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2113 de la Commission du 13 juillet 2022
    complétant le règlement (UE) 2020/1503 du Parlement européen et du Conseil
    par des normes techniques de réglementation pour l’échange, entre les autorités
    compétentes, d’informations en lien avec leurs activités d’enquête et de
    surveillance et leurs activités liées à l’application des règles concernant
    les prestataires européens de services de financement participatif pour les entrepreneurs
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2113 der Kommission vom 13. Juli 2022 zur
    Ergänzung der Verordnung (EU) 2020/1503 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für den Informationsaustausch zwischen
    den zuständigen Behörden im Zusammenhang mit Ermittlungs-, Aufsichts- und Durchsetzungstätigkeiten
    in Bezug auf Europäische Schwarmfinanzierungsdienstleister für Unternehmen
  type: main
