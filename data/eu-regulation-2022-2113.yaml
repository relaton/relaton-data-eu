  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2113 оd 13. srpnja 2022. o dopuni
    Uredbe (EU) 2020/1503 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda za razmjenu informacija među nadležnim tijelima o istražnim aktivnostima,
    nadzornim aktivnostima i aktivnostima izvršavanja u pogledu europskih pružatelja
    usluga skupnog financiranja za poduzeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2113 felhatalmazáson alapuló rendelete (2022.
    július 13.) az (EU) 2020/1503 európai parlamenti és tanácsi rendeletnek az
    illetékes hatóságok által az európai közösségi finanszírozási üzleti
    szolgáltatókkal kapcsolatos vizsgálati, felügyeleti és jogérvényesítési
    tevékenységeik során egymással megosztandó információkat meghatározó
    szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2113 della Commissione del 13 luglio 2022
    che integra il regolamento (UE) 2020/1503 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione in materia di scambio
    di informazioni tra autorità competenti ai fini delle attività di indagine,
    di vigilanza e di contrasto delle violazioni riguardanti i fornitori europei di
    servizi di crowdfunding per le imprese
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2113 (2022. gada 13. jūlijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2020/1503 papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem informācijas apmaiņai starp kompetentajām
    iestādēm par izmeklēšanas, uzraudzības un izpildes darbībām attiecībā
    uz Eiropas kolektīvās finansēšanas pakalpojumu sniedzējiem uzņēmējdarbībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2113 2022 m. liepos 13 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2020/1503 papildomas kompetentingų
    institucijų keitimosi informacija apie Europos sutelktinio finansavimo paslaugų
    verslui teikėjus, susijusio su tyrimų, priežiūros ir vykdymo užtikrinimo
    veikla, techniniais reguliavimo standartais
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2113 tat-13 ta’ Lulju 2022
    li jissupplimenta r-Regolament (UE) 2020/1503 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ standards tekniċi regolatorji għall-iskambju ta’ informazzjoni
