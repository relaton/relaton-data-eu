    deren Ursprung oder Herkunft Japan ist, nach dem Unfall im Kernkraftwerk Fukushima
    und zur Aufhebung der Durchführungsverordnung (EU) Nr. 284/2012
  type: main
- language: bg
  script: Cyrl
