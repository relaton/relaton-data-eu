  content: Commission Regulation (EC) No 593/96 of 2 April 1996 determining the percentages
    of quantities which may be allowed in respect of import licence applications lodged
    in March 1996 under additional tariff quotas for meat provided for in Regulation
    (EC) No 417/96 for the Republic of Poland and the Republic of Hungary
  type: main
