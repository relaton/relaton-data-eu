    concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2024, 2025 et 2026 destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus, et abrogeant
    le règlement d’exécution (UE) 2022/741
  type: main
- language: de
  script: Latn
