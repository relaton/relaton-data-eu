  script: Latn
  content: Commission Implementing Regulation (EU) 2023/731 of 3 April 2023 concerning
    a coordinated multiannual control programme of the Union for 2024, 2025 and 2026
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
    and repealing Implementing Regulation (EU) 2022/741
  type: main
- language: fr
  script: Latn
