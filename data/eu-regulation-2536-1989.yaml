title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2536/89 of 21 August 1989 reintroducing
    the levying of the customs duties applicable to articles of jewellery and parts
    thereof, of precious metal falling within CN codes 7113 11 00 and 19 00, originating
    in Thailand benefiting from the tariff preferences provided for by Council Regulation
    (EEC) No 4257/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2536/89 de la Commission du 21 août 1989 portant
    rétablissement de la perception des droits de douane applicables aux article
    de bijouterie ou de joaillerie et leurs parties, en métaux précieux, des codes
    NC 7113 11 00 et 7113 19 00, originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2536/89 DER KOMMISSION vom 21. August 1989 zur Wiedereinführung
    der Erhebung der Zölle für Schmuckwaren und Teile davon, aus Edelmetallen, der
    KN-Code 7113 11 00 und 7113 19 00 mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2536/89 af 21. august 1989 om genindførelse
