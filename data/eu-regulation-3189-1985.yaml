    über die Bedingungen für die Abgabe von Getreide aus Beständen der Interventionsstellen
    und die Lieferung im Rahmen der Nahrungsmittelhilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3189/85 af 14. november 1985 om undtagelse
