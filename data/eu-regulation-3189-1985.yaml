  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3189/85 della Commissione del 14 novembre 1985 che
    deroga a talune disposizioni dei regolamenti (CEE) n. 1836/82 e (CEE) n. 1974/80
    relativi alle condizioni per la vendita dei cereali detenuti dagli organismi d'
    intervento e per la fornitura a titolo dell' aiuto alimentare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3189/85 van de Commissie van 14 november 1985 houdende
