title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1660 of 7 November 2018 imposing
    special conditions governing the import of certain food of non-animal origin from
    certain third countries due to the risks of contamination with pesticides residues,
    amending Regulation (EC) No 669/2009 and repealing Implementing Regulation (EU)
    No 885/2014
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/1660 de la Commission du 7 novembre 2018
