    einzelnen Mitgliedstaaten im Rahmen des in der Verordnung (EWG) Nr. 2052/88 des
    Rates festgelegten Ziels Nr. 2 (89/289/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 8. marts 1989 om fastsaettelse af en vejledende
