title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1933/80 of 18 July 1980 re-establishing
    the levying of customs duties on nails, tacks, staples, hook-nails, corrugated
    nails, spiked cramps, etc., falling within heading No 73.31 and originating in
    Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1933/80 de la Commission, du 18 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux pointes,
    clous, crampons appointés, agrafes ondulées et biseautées, etc., de la position
    73.31 du tarif douanier commun, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1933/80 der Kommission vom 18. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Stifte, Nägel, zugespitzte Krampen, gewellte und abgeschrägte
    Klammern usw., der Tarifnummer 73.31, mit Ursprung in Rumänien, dem die in der
    Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1933/80 af 18. juli 1980 om genindførelse
    af opkrævning af toldafgifter for søm, spiger, stifter, bølgesøm, tegnestifter,
    hager og kramper, etc., under pos. 73.31, som har oprindelse i Rumænien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1933/80 della Commissione, del 18 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle punte, chiodi, rampini,
    graffette ondulate e smussate, ecc., della voce 73.31 della tariffa doganale comune,
    originari della Romania, beneficiarie delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1933/80 van de Commissie van 18 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op draadnagels,
    spijkers, aangepunte krammen, afgeschuinde gegolfde krambanden, enz., van post
    73.31, van oorsprong uit Roemenië ten behoeve waarvan bij Verordening (EEG) nr.
    2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
