  script: Latn
  content: '82/427/EEC: Commission Decision of 21 June 1982 establishing that the
    apparatus described as ''Quantex- Digital Video Processor, model DS-30'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/427/CEE: Décision de la Commission, du 21 juin 1982, constatant que
    l''importation de l''appareil dénommé "Quantex-Digital Video Processor, model
    DS-30" ne peut être faite en franchise des droits du tarif douanier'
  type: main
- language: de
  script: Latn
  content: '82/427/EWG: Entscheidung der Kommission vom 21. Juni 1982, mit der festgestellt
    wird, daß das Gerät ,,Quantex-Digital Video Processor, model DS-30" nicht unter
    Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/427/EØF: Kommissionens beslutning af 21. juni 1982 om fastslåelse
