    hinsichtlich einiger Arten anzuwenden (Nur der deutsche und französische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '73/122/EØF: Kommissionens Beslutning af 7. maj 1973 om at fritage Forbundsrepublikken
