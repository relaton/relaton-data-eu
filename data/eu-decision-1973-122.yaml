title:
- language: en
  script: Latn
  content: '73/122/EEC: Commission Decision of 7 May 1973 exempting the Federal Republic
    of Germany and the Grand Duchy of Luxembourg from applying to certain species
    the Council Directive of 29 September 1970 concerning the marketing of vegetable
    seed (Only the German and French texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '73/122/CEE: Décision de la Commission, du 7 mai 1973, dispensant la République
    fédérale d''Allemagne et le Grand-Duché de Luxembourg d''appliquer à certaines
    espèces la directive du Conseil du 29 septembre 1970, concernant la commercialisation
    des semences de légumes (Les textes en langues allemande et française sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
