    (TAC) und entsprechender Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen
    für 1993
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 3177/93 af 5. november 1993 om ændring af
