    for visse fiskebestande og grupper af fiskebestande samt af visse betingelser
    for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3177/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 5ης Νοεμβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3919/92 για τον καθορισμό,
