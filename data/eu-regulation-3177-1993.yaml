    για το 1993 και ορισμένων όρων υπό τους οποίους
    μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3177/93 DEL CONSIGLIO del 5 novembre 1993 recante modifica
    del regolamento (CEE) n. 3919/92 che stabilisce, per alcune popolazioni o gruppi
    di popolazioni ittiche, il totale ammissibile di catture per il 1993 e talune
    condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3177/93 VAN DE RAAD van 5 november 1993 houdende wijziging
    van Verordening (EEG) nr. 3919/92 inzake de vaststelling van de voor 1993 geldende
    totaal toegestane vangsten (TAC' s) voor bepaalde visbestanden of groepen visbestanden,
    alsmede de bij de visserij in het kader van de totaal toegestane vangsten in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3177/93 DO CONSELHO de 5 de Novembro de 1993 que altera
    o Regulamento (CEE) nº 3919/92 que fixa, relativamente a determinadas unidades
    populacionais ou grupos de unidades populacionais de peixes, os totais admissíveis
    de capturas (TAC) para 1993 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3177/93 DEL CONSEJO de 5 de noviembre de 1993 que modifica
