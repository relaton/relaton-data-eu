    které se použijí na referenční množství tradičních hospodářských subjektů
    v rámci celních kvót pro dovoz banánů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 352/2002 af 25. februar 2002 om ændring
