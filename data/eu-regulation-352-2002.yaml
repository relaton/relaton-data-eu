    sabiex jiġu applikati għall-kwantita ta’ referenza ta’ kull operatur tradizzjonali
    taħt il-kwoti tat-tariffi għall-importazzjoni tal-banana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 352/2002 van de Commissie van 25 februari 2002 houdende
    wĳziging van Verordening (EG) nr. 1121/2001 tot vaststelling van de aanpassingscoëfficiënten
    die moeten worden toegepast op de referentiehoeveelheid van elke traditionele
    marktdeelnemer in het kader van de tariefcontingenten voor de invoer van bananen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 352/2002 z dnia 25 lutego 2002 r. zmieniające
    rozporządzenie (WE) nr 1121/2001 ustalające współczynniki dostosowujące,
    jakie mają być stosowane w odniesieniu do ilości referencyjnej każdego tradycyjnego
    podmiotu gospodarczego w ramach kontyngentów taryfowych na przywóz bananów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 352/2002 da Comissão, de 25 de Fevereiro de 2002,
    que altera o Regulamento (CE) n.° 1121/2001 que fixa os coeficientes de adaptação
    a aplicar à quantidade de referência de cada operador tradicional no âmbito
    dos contingentes pautais de importação de bananas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 352/2002 z 25. februára 2002, ktorým sa mení
