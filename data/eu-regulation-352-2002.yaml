  content: Commission Regulation (EC) No 352/2002 of 25 February 2002 amending Regulation
    (EC) No 1121/2001 fixing the adjustment coefficients to be applied to each traditional
    operator's reference quantity under the tariff quotas for imports of bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 352/2002 de la Commission du 25 février 2002 modifiant
    le règlement (CE) n° 1121/2001 fixant les coefficients d'adaptation à appliquer
    à la quantité de référence de chaque opérateur traditionnel dans le cadre
    des contingents tarifaires à l'importation de bananes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 352/2002 der Kommission vom 25. Februar 2002 zur Änderung
