title:
- language: en
  script: Latn
  content: '80/61/EEC: Commission Decision of 13 December 1979 authorizing Ireland
    not to apply Community treatment to men''s and boys''pyjamas, women''s, girls''and
    infants''(other than babies'') pyjamas and nightdresses, knitted or crocheted,
    of cotton or of synthetic textile fibres, falling within heading No ex 60.04 of
    the Common Customs Tariff (NIMEXE codes 60.04-47, 51, 53, 73, 81, 83) (categories
    24 and 25), originating in Hong Kong and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/61/CEE: Décision de la Commission, du 13 décembre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les pyjamas pour hommes et garçonnets,
    pyjamas et chemises de nuit pour femmes, fillettes et jeunes enfants (autres que
    bébés), de bonneterie, de coton ou de fibres textiles synthétiques de la position
    ex 60.04 du tarif douanier commun (codes Nimexe: 60.04- 47, 73; 60.04-51, 53,
    81, 83) (catégories 24 et 25), originaires de Hong-kong et mis en libre pratique
    dans les autres Etats membres (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/61/EWG: Entscheidung der Kommission vom 13. Dezember 1979, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schlafanzüge für Männer und Knaben, Schlafanzüge
    und Nachthemden für Frauen, Mädchen und Kleinkinder (ausgenommen Säuglinge),
    aus Gewirken, aus Baumwolle oder aus synthetischen Spinnstoffen der Tarifnummer
    ex 60.04 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 60.04-47 ; 73 - 60.04-51
    ; 53 ; 81 ; 83), Kategorien 24 und 25, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/61/EØF: Kommissionens beslutning af 13. december 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage pyjamas til mænd og drenge,
    pyjamas og anden natbeklædning til kvinder, piger og småbørn (bortset fra spædbørn),
    af trikotage, af bomuld eller syntetiske fibre, som henhører under pos. ex 60.04
    i den fælles toldtarif (NIMEXE-nummer 60.04-47, 51, 53, 73, 81, 83; kategori
    24 og 25), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/61/CEE: Decisione della Commissione, del 13 dicembre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario pigiami per uomo e per ragazzo,
    pigiami e camicie da notte per donna, per ragazza e per bambini, diversi dai bambini
    piccoli (bébés), a maglia, di cotone o di fibre tessili sintetiche, della voce
    n. 60.04 della tariffa doganale comune (codici Nimexe : 60.04-47, 73 ; 60.04-51,
    53, 81, 83), categorie 24 e 25, originari di Hong Kong e messi in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/61/EEG: Beschikking van de Commissie van 13 december 1979 waarbij Ierland
    wordt gemachtigd pyjama''s voor heren en jongens, pyjama''s en nachthemden voor
    dames, meisjes en kinderen (andere dan die voor baby''s) van brei- of haakwerk,
    van katoen of van synthetische textielvezels, van post ex 60.04 van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.04-47, 73; 60.04-51, 53, 81, 83) (categorieën 24
    en 25), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
