  content: COMMISSION REGULATION (EC) No 896/95 of 24 April 1995 amending Commission
    Regulation (EC) No 1280/94 opening and providing for the administration of Community
    tariff quotas for certain agricultural products originating in the African, Caribbean
    and Pacific States (ACP)
  type: main
- language: fr
  script: Latn
