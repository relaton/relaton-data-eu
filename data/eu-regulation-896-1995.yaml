    für bestimmte landwirtschaftliche Waren mit Ursprung in den Staaten in Afrika,
    im karibischen Raum und im Pazifischen Ozean (AKP)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 896/95 af 24. april 1995 om ændring
