title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 248/2009 of 19 March 2009 laying down detailed
    rules for the application of Council Regulation (EC) No 104/2000 as regards notifications
    concerning recognition of producer organisations, the fixing of prices and intervention
    within the scope of the common organisation of the market in fishery and aquaculture
    products (recast)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 248/2009 de la Commission du 19 mars 2009 portant modalités
    d’application du règlement (CE) n o 104/2000 du Conseil en ce qui concerne
    les communications afférentes à la reconnaissance des organisations de producteurs
    ainsi qu’à la fixation des prix et des interventions dans le cadre de l’organisation
    commune des marchés dans le secteur des produits de la pêche et de l’aquaculture
    (refonte)
  type: main
