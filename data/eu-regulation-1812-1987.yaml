title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1812/87 of 29 June 1987 amending Regulation
    (EEC) No 2814/86 introducing a temporary derogation to Regulations (EEC) No 685/69
    and (EEC) No 625/78 as regards the date of taking over the butter and skimmed-milk
    powder bought in by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1812/87 de la Commission du 29 juin 1987 modifiant
    le règlement (CEE) n° 2814/86 portant dérogation temporaire aux règlements
    (CEE) n° 685/69 et (CEE) n° 625/78 en ce qui concerne la date de prise en charge
    du beurre et du lait écrémé en poudre achetés à l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1812/87 der Kommission vom 29. Juni 1987 zur Änderung
    der Verordnung (EWG) Nr. 2814/86 zur vorübergehenden Abweichung von den Verordnungen
    (EWG) Nr. 685/69 und (EWG) Nr. 625/78 hinsichtlich des Zeitpunkts der Übernahme
    der Butter und des Magermilchpulvers, die von den Interventionsstellen angekauft
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1812/87 af 29. juni 1987 om ændring
    af forordning (EØF) nr. 2814/86 om midlertidig undtagelse fra forordning (EØF)
    nr. 685/69 og (EØF) nr. 625/78 for så vidt angår datoen for overtagelse af
    smør og skummetmælkspulver, der opkøbes ved intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1812/87 της Επιτροπής
    της 29ης Ιουνίου 1987 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2814/86 για προσωρινή παρέκκλιση από
    τους κανονισμούς (ΕΟΚ) αριθ. 685/69 και (ΕΟΚ) αριθ.
    625/78 όσον αφορά την ημερομηνία αναλήψεως του
    βουτύρου και του αποκορυφωμένου γάλακτος σε
    σκόνη που αγοράζονται στην παρέμβαση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1812/87 della Commissione del 29 giugno 1987 che modifica
    il regolamento (CEE) n. 2814/86 che deroga temporaneamente ai regolamenti (CEE)
    n. 685/69 e (CEE) n. 625/78 per quanto concerne la data della presa in consegna
    del burro e del latte scremato in polvere acquistati all' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1812/87 van de Commissie van 29 juni 1987 tot wijziging
    van Verordening (EEG) nr. 2814/86 houdende tijdelijke afwijking van de Verordeningen
    (EEG) nr. 685/69 en (EEG) nr. 625/78 ten aanzien van de datum van overname van
    voor interventie aangeboden boter en magere-melkpoeder
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1812/87 da Comissão de 29 de Junho de 1987 que
    altera o Regulamento (CEE) n.° 2814/86 que estabelece uma derrogação temporária
    aos Regulamentos (CEE) n.° 685/69 e (CEE) n.° 625/78 relativamente à data de
    tomada a cargo da manteiga e do leite em pó desnatado comprados à intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1812/87 de la Comisión de 29 de junio de 1987 por
    el que se modifica el Reglamento (CEE) n° 2814/86, por el que se establece la
    inaplicación temporal de los Reglamentos (CEE) n° 685/69 y n° 625/78 en lo
    que se refiere a la fecha en que el organismo de intervención se hará cargo
    de la mantequilla y de la leche desnatada en polvo
