title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2017/140 of 26 January 2017 designating the
    EU reference laboratory for diseases caused by capripox viruses (lumpy skin disease
    and sheep and goat pox), laying down additional responsibilities and tasks for
    this laboratory and amending Annex VII to Regulation (EC) No 882/2004 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/140 de la Commission du 26 janvier 2017 désignant
    le laboratoire de référence de l'Union européenne pour les maladies causées
    par les virus de la variole caprine (dermatose nodulaire contagieuse et variole
    ovine et caprine), assignant des responsabilités et des tâches supplémentaires
    audit laboratoire et modifiant l'annexe VII du règlement (CE) n° 882/2004 du
    Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2017/140 der Kommission vom 26. Januar 2017 zur Benennung
