title:
- language: en
  script: Latn
  content: '93/392/EEC: Commission Decision of 9 July 1993 revoking Council Decision
    93/358/EEC authorizing the Member States to provide for derogations from certain
    provisions of Council Directive 77/93/EEC in respect of wood of conifers (Coniferales)
    other than of Thuja L., Pinus L. and mixtures with Pinus L., originating in Canada'
  type: main
- language: fr
  script: Latn
  content: '93/392/CEE: Décision de la Commission du 9 juillet 1993 abrogeant la
    décision 93/358/CEE du Conseil autorisant les États membres à prévoir des
    dérogations à certaines dispositions de la directive 77/93/CEE en ce qui concerne
    les bois de conifères (Coniferales) autres que Thuja L., Pinus L. et les mélanges
    comprenant Pinus L., originaires du Canada'
  type: main
- language: de
  script: Latn
  content: '93/392/EWG: ENTSCHEIDUNG DER KOMMISSION vom 9. Juli 1993 zur Aufhebung
    der Entscheidung 93/358/EWG vom 26. Mai 1993 zur Ermächtigung der Mitgliedstaaten,
    für Holz von Koniferen (Coniferales) mit Ursprung in Kanada - außer Holz und
    Thuja L. und Pinus L. sowie Pinus L. enthaltende Mischungen - Ausnahmen von bestimmten
    Vorschriften der Richtlinie 77/93/EWG vorzusehen'
  type: main
- language: da
  script: Latn
  content: '93/392/EØF: KOMMISSIONENS BESLUTNING af 9. juli 1993 om tilbagekaldelse
    af Rådets beslutning 93/358/EØF om bemyndigelse af medlemsstaterne til at indrømme
    undtagelser fra visse bestemmelser i direktiv 77/93/EØF for så vidt angår træ
    af nåletræer (Coniferales), bortset fra træ af Thuja L., Pinus L. og blandinger
    med Pinus L., med oprindelse i Canada'
  type: main
- language: el
  script: Grek
  content: '93/392/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 9ης Ιουλίου
    1993 για την κατάργηση της απόφασης 93/358/ΕΟΚ του
    Συμβουλίου που επιτρέπει στα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ όσον αφορά την ξυλεία κωνοφόρων
    (Coniferales), εκτός από την ξυλεία της THUJA L., PINUS L.
    και τα μείγματα με PINUS L., καταγωγής Καναδά'
  type: main
- language: it
  script: Latn
  content: '93/392/CEE: DECISIONE DELLA COMMISSIONE del 9 luglio 1993 che revoca la
    decisione 93/358/CEE del 26 maggio 1993 che autorizza gli Stati membri a derogare
    a determinate disposizioni della direttiva 77/93/CEE per quanto riguarda il legname
    di conifere (Coniferales), ad eccezione di Thuja L., Pinus L. e miscugli contenenti
    Pinus L., originari del Canada'
  type: main
- language: nl
  script: Latn
  content: '93/392/EEG: BESCHIKKING VAN DE COMMISSIE van 9 juli 1993 houdende intrekking
    van Beschikking 93/358/EEG van de Raad van 26 mei 1993 tot machtiging van de Lid-Staten
    om afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG toe te staan voor
    hout van Coniferae, andere dan Thuja L., Pinus L. en gemengde partijen met Pinus
    L., van oorsprong uit Canada'
  type: main
- language: pt
  script: Latn
  content: '93/392/CEE: DECISÃO DA COMISSÃO de 9 de Julho de 1993 que revoga a Decisão
    93/358/CEE do Conselho que autoriza os Estados-membros a estabelecer derrogações
    em relação a determinadas disposições da Directiva 77/93/CEE no que diz respeito
    às madeiras de coníferas (Coniferales), com excepção da de Thuja L., Pinus
    L. e misturas contendo Pinus L., originárias do Canadá'
  type: main
- language: es
  script: Latn
  content: '93/392/CEE: DECISIÓN DE LA COMISIÓN de 9 de julio de 1993 que deroga
    la Decisión 93/358/CEE del Consejo por la que se autoriza a los Estados miembros
    para establecer excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    en lo que respecta a la madera de coníferas (Coniferales), salvo en las variedades
    Thuja L. y Pinus L. y las mezclas que contengan Pinus L. originaria de Canadá'
  type: main
