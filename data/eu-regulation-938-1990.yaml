title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 938/90 of 11 April 1990 reintroducing the
    levying of the customs duties applicable to footwear of CN codes 6401 and 6402
    originating in Indonesia to which the preferential arrangements of Council Regulation
    (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 938/90 de la Commission du 11 avril 1990 portant rétablissement
    de la perception des droits de douane applicables aux chaussures des codes NC
    6401 et 6402, originaires de l'Indonésie bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 938/90 DER KOMMISSION vom 11. April 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Schuhe der KN-Code 6401 und 6402 mit Ursprung in
    Indonesien, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 938/90 af 11. april 1990 om genindførelse
