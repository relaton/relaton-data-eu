title:
- language: en
  script: Latn
  content: '97/164/EC: Commission Decision of 17 February 1997 recognizing in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of flupyrsulfuron-methyl, azimsulfuron and paecilomyces
    fumosoroseus in Annex I of Council Directive 91/414/EEC concerning the placing
    of plant protection products on the market'
  type: main
- language: fr
  script: Latn
  content: '97/164/CE: Décision de la Commission du 17 février 1997 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription du flupyrsulfuron-méthyl, de l''azimsulfuron et du Paecilomyces
    fumosoroseus dans l''annexe I de la directive 91/414/CEE du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
  content: '97/164/EG: Entscheidung der Kommission vom 17. Februar 1997 über die
    grundsätzliche Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden
    Prüfung im Hinblick auf eine etwaige Aufnahme von Flupyrsulfuron-Methyl, Azimsulfuron
    und Paecilomyces fumosoroseus in Anhang I der Richtlinie 91/414/EWG des Rates
    über das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden'
  type: main
- language: da
  script: Latn
  content: '97/164/EF: Kommissionens beslutning af 17. februar 1997 om principiel
    anerkendelse af, at det dossier, som er forelagt til grundig behandling med henblik
    på eventuel optagelse af flupyrsulfuron-methyl, azimsulfuron og Paecilomyces
    fumosoroseus i bilag I til Rådets direktiv 91/414/EØF om markedsføring af plantebeskyttelsesmidler,
    er fuldstændigt'
  type: main
- language: el
  script: Grek
  content: '97/164/ΕΚ: Απόφαση της Επιτροπής της 17ης Φεβρουαρίου
    1997 με την οποία αναγνωρίζεται, καταρχήν, ότι
    είναι πλήρεις οι φάκελοι οι οποίοι έχουν υποβληθεί
    για λεπτομερή εξέταση ενόψει της ενδεχόμενης
    συμπερίληψης των ουσιών flupyrsulfuron-methyl, azimsulfuron
    και Paecilomyces fumosoroseus στο παράρτημα Ι της οδηγίας
    91/414/ΕΟΚ του Συμβουλίου όσον αφορά τη διάθεση
    στην αγορά φυτοπροστατευτικών προϊόντων'
  type: main
- language: fi
  script: Latn
  content: '97/164/EY: Komission päätös, tehty 17 päivänä helmikuuta 1997, yksityiskohtaista
    tutkimusta varten annettujen asiakirjojen täydellisyyden periaatteellisesta hyväksymisestä
    flupyrsulfuroni-metyylin, atsimsulfuronin ja Paecilomyces fumosoroseusin mahdolliseksi
    sisällyttämiseksi kasvinsuojeluaineiden markkinoille saattamisesta annetun neuvoston
    direktiivin 91/414/ETY liitteeseen I'
  type: main
- language: it
  script: Latn
  content: '97/164/CE: Decisione della Commissione del 17 febbraio 1997 che riconosce
    in linea di massima la conformità dei fascicoli trasmessi per un esame dettagliato
    in vista di un eventuale inserimento di flupyrsulfuron-metile, azimsulfuron e
    paecilomyces fumosoroseus nell''allegato I della direttiva 91/414/CEE del Consiglio,
    relativa all''immissione in commercio dei prodotti fitosanitari'
  type: main
- language: nl
  script: Latn
  content: '97/164/EG: Beschikking van de Commissie van 17 februari 1997 waarbij in
    beginsel wordt erkend dat de dossiers die zijn ingediend voor een grondig onderzoek
    met het oog op de eventuele opneming van flupyrsulfuron-methyl, azimsulfuron en
    paecilomyces fumosoroseus in bijlage I van Richtlijn 91/414/EEG van de Raad betreffende
    het op de markt brengen van gewasbeschermingsmiddelen, volledig zijn'
  type: main
- language: pt
  script: Latn
  content: '97/164/CE: Decisão da Comissão de 17 de Fevereiro de 1997 que reconhece,
