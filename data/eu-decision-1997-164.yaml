    com vista à possível inclusão do flupirsulfurão-metilo, do azimsulfurão e
    do Paecilomyces fumosoroseus no anexo I da Directiva 91/414/CEE do Conselho relativa
    à colocação dos produtos fitofarmacêuticos no mercado'
  type: main
