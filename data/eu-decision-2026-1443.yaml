    x NK603 x DAS-40278-9 agus a fho-chumaisc DP202216 x NK603, DP202216 x DAS-40278-9,
    nó atá comhdhéanta díobh, nó a thairgtear astu a chur ar an margadh de bhun
    Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa agus ón gComhairle (tugadh
    fógra faoi leis an doiciméad C(2026) 4403)
  type: main
