    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    DP202216 x NK603 x DAS-40278-9 i njegove potkombinacije DP202216 x NK603, DP202216
    x DAS-40278-9, od njih se sastoje ili su od njih proizvedeni, u skladu s Uredbom
