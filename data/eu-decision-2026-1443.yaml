title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1443 of 29 June 2026 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize DP202216 x NK603 x DAS-40278-9 and its sub-combinations
    DP202216 x NK603, DP202216 x DAS-40278-9, pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2026)
    4403)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1443 de la Commission du 29 juin 2026
    autorisant la mise sur le marché de produits contenant le maïs génétiquement
    modifié DP202216 × NK603 × DAS-40278-9 et ses sous-combinaisons DP202216 ×
    NK603, DP202216 × DAS-40278-9, consistant en ce maïs et sa sous-combinaison
    ou produits à partir de ceux-ci, conformément au règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2026) 4403]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1443 der Kommission vom 29. Juni 2026
