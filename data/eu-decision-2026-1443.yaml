    Mais der Sorte DP202216 x NK603 x DAS-40278-9 und seine Unterkombinationen DP202216
    x NK603, DP202216 x DAS-40278-9 enthalten, aus ihm/ihnen bestehen oder aus ihm/ihnen
    hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2026) 4403)
  type: main
