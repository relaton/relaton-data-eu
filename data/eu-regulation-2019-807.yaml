  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2019/807, 13. märts 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi (EL) 2018/2001 selliste
    maakasutuse kaudse muutuse suure riskiga lähteainete kindlaksmääramise osas,
    mille tootmise ala on märkimisväärselt laienenud suure süsinikuvaruga maale,
    ning maakasutuse kaudse muutuse väikese riskiga biokütuste, vedelate biokütuste
    ja biomasskütuste sertifitseerimise osas
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2019/807, annettu 13 päivänä maaliskuuta
    2019, Euroopan parlamentin ja neuvoston direktiivin (EU) 2018/2001 täydentämisestä
    siltä osin kuin on kyse suurta epäsuoran maankäytön muutoksen riskiä aiheuttavien
    raaka-aineiden, joiden tuotantoalue on laajentunut merkittävästi paljon hiiltä
    sitovalle maalle, määrittelemisestä sekä vähäistä epäsuoran maankäytön
    muutoksen riskiä aiheuttavien biopolttoaineiden, bionesteiden ja biomassapolttoaineiden
    sertifioinnista
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/807 оd 13. ožujka 2019. o dopuni
    Direktive (EU) 2018/2001 Europskog parlamenta i Vijeća u pogledu određivanja
    sirovina s visokim rizikom od neizravnih promjena uporabe zemljišta za koje je
    zabilježeno znatno širenje proizvodnog područja na zemljište s velikim zalihama
    ugljika i u pogledu certificiranja biogoriva, tekućih biogoriva i goriva iz biomase
    s niskim rizikom od neizravnih promjena uporabe zemljišta
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/807 felhatalmazáson alapuló rendelete (2019. március
    13.) az (EU) 2018/2001 európai parlamenti és tanácsi irányelvnek a közvetett
    földhasználat-változás szempontjából magas kockázatot jelentő azon alapanyagok
    meghatározása tekintetében történő kiegészítéséről, amelyek esetében
    a termőterület számottevő bővülése figyelhető meg a jelentős szénkészletekkel
    rendelkező földterületek rovására, továbbá az irányelvnek a közvetett
    földhasználat-változás szempontjából alacsony kockázatot jelentő bioüzemanyagok,
    folyékony bio-energiahordozók és biomasszából előállított üzemanyagok
    tanúsítása tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/807 della Commissione, del 13 marzo 2019,
    che integra la direttiva (UE) 2018/2001 del Parlamento europeo e del Consiglio
    per quanto riguarda la determinazione delle materie prime a elevato rischio di
    cambiamento indiretto di destinazione d'uso dei terreni per le quali si osserva
    una considerevole espansione della zona di produzione in terreni che presentano
    elevate scorte di carbonio e la certificazione di biocarburanti, bioliquidi e
    combustibili da biomassa a basso rischio di cambiamento indiretto di destinazione
    d'uso dei terreni
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/807 (2019. gada 13. marts), ar kuru
    Eiropas Parlamenta un Padomes Direktīvu (ES) 2018/2001 papildina attiecībā
    uz to, kā identificēt izejvielas, kas rada augstu netiešās zemes izmantošanas
    maiņas risku un kam konstatēta būtiska produktīvās platības izplešanās
    uz tādu zemes platību rēķina, kurās ir liels oglekļa uzkrājums, un kā
    sertificēt biodegvielas, bioloģiskos šķidros kurināmos un biomasas kurināmos/degvielas,
    kas rada zemu netiešās zemes izmantošanas maiņas risku
  type: main
- language: lt
  script: Latn
  content: 2019 m. kovo 13 d. Komisijos deleguotasis reglamentas (ES) 2019/807, kuriuo
    dėl didelę netiesioginio žemės naudojimo keitimo riziką keliančių pradinių
    žaliavų, kurių auginimo teritorija reikšmingai plečiama į žemės, kurioje
    yra didelių anglies sankaupų, plotus, nustatymo ir nedidelę netiesioginio žemės
    naudojimo keitimo riziką keliančių biodegalų, skystųjų bioproduktų ir biomasės
    kuro sertifikavimo papildoma Europos Parlamento ir Tarybos direktyva (ES) 2018/2001
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2019/807 tat-13 ta' Marzu 2019
    li jissupplimenta d-Direttiva (UE) 2018/2001 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tad-determinazzjoni ta' materja prima b'riskju għoli ta' tibdil indirett
    fl-użu tal-art li għaliha qed tiġi osservata espansjoni sinifikanti taż-żona
    ta' produzzjoni f'art b'ħażna kbira ta' karbonju u ċ-ċertifikazzjoni ta' bijokarburanti,
    bijolikwidi u karburanti mill-bijomassa b'riskju baxx ta' tibdil indirett fl-użu
    tal-art
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/807 van de Commissie van 13 maart 2019
    tot aanvulling van Richtlijn (EU) 2018/2001 van het Europees Parlement en de Raad
    wat betreft het bepalen van de basismaterialen met een hoog risico van indirecte
    veranderingen in landgebruik waarbij een belangrijke uitbreiding van het productiegebied
    naar land met grote koolstofvoorraden waar te nemen valt, en de certificering
    van biobrandstoffen, vloeibare biomassa en biomassabrandstoffen met een laag risico
    op indirecte veranderingen in landgebruik
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2019/807 z dnia 13 marca 2019 r.
    uzupełniające dyrektywę Parlamentu Europejskiego i Rady (UE) 2018/2001 w odniesieniu
    do określania surowców o wysokim ryzyku spowodowania pośredniej zmiany użytkowania
    gruntów, w przypadku których zaobserwowano znaczącą ekspansję obszaru produkcji
    na tereny zasobne w pierwiastek węgla oraz certyfikowania biopaliw, biopłynów
    i paliw z biomasy o niskim ryzyku spowodowania pośredniej zmiany użytkowania
    gruntów
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/807 da Comissão, de 13 de março de 2019,
    que complementa a Diretiva (UE) 2018/2001 do Parlamento Europeu e do Conselho
    no que respeita à determinação das matérias-primas com elevado risco de alterações
    indiretas do uso do solo relativamente às quais se observa uma expansão significativa
    da superfície de produção para terrenos com elevado teor de carbono e à certificação
    de biocombustíveis, biolíquidos e combustíveis biomássicos com baixo risco
    de alterações indiretas do uso do solo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/807 al Comisiei din 13 martie 2019 de completare
    a Directivei (UE) 2018/2001 a Parlamentului European și a Consiliului în ceea
    ce privește stabilirea materiilor prime care prezintă riscuri ridicate din perspectiva
    schimbării indirecte a destinației terenurilor, în cazul cărora se observă
    o expansiune semnificativă a suprafeței de producție în detrimentul terenurilor
    care stochează cantități ridicate de carbon și certificarea biocombustibililor,
    a biolichidelor și a combustibililor din biomasă care prezintă riscuri reduse
    din perspectiva schimbării indirecte a destinației terenurilor
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/807 z 13. marca 2019, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady (EÚ) 2018/2001, pokiaľ ide
    o určenie surovín s vysokým rizikom nepriamej zmeny využívania pôdy, pri
    ktorých sa pozoruje významné rozšírenie produkčnej plochy na pôdu s vysokými
    zásobami uhlíka, a o certifikáciu biopalív, biokvapalín a palív z biomasy
    s nízkym rizikom nepriamej zmeny využívania pôdy
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/807 z dne 13. marca 2019 o dopolnitvi
    Direktive (EU) 2018/2001 Evropskega parlamenta in Sveta glede določitve surovin
    z visokim tveganjem za posredno spremembo rabe zemljišč, v zvezi s katerimi
    se ugotavlja znatna širitev proizvodnega območja na zemljišča z visoko zalogo
    ogljika, ter certificiranja pogonskih biogoriv, drugih tekočih biogoriv in biomasnih
    goriv z nizkim tveganjem za posredno spremembo rabe zemljišč
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/807 de la Comisión, de 13 de marzo de 2019,
    por el que se completa la Directiva (UE) 2018/2001 del Parlamento Europeo y del
    Consejo en lo que respecta a la determinación de las materias primas con riesgo
    elevado de provocar un cambio indirecto del uso de la tierra de cuya superficie
    de producción se observa una expansión significativa a tierras con elevadas
    reservas de carbono y la certificación de los biocarburantes, los biolíquidos
    y los combustibles de biomasa con bajo riesgo de provocar un cambio indirecto
    del uso de la tierra
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/807 av den 13 mars 2019
    om komplettering av Europaparlamentets och rådets direktiv (EU) 2018/2001 vad
    gäller fastställande av bränsleråvaror med hög risk för indirekt ändring
    av markanvändning för vilka en betydande utvidgning av produktionsområdet till
    mark med stora kollager kan observeras och certifiering av biodrivmedel, flytande
    biobränslen och biomassabränslen med låg risk för indirekt ändrad markanvändning
  type: main
