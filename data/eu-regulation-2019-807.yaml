title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/807 of 13 March 2019 supplementing
    Directive (EU) 2018/2001 of the European Parliament and of the Council as regards
    the determination of high indirect land-use change-risk feedstock for which a
    significant expansion of the production area into land with high carbon stock
    is observed and the certification of low indirect land-use change-risk biofuels,
    bioliquids and biomass fuels
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/807 de la Commission du 13 mars 2019 complétant
    la directive (UE) 2018/2001 du Parlement européen et du Conseil en ce qui concerne,
    d'une part, la détermination des matières premières présentant un risque élevé
    d'induire des changements indirects dans l'affectation des sols dont la zone de
    production gagne nettement sur les terres présentant un important stock de carbone
    et, d'autre part, la certification des biocarburants, bioliquides et combustibles
    issus de la biomasse présentant un faible risque d'induire des changements indirects
    dans l'affectation des sols
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/807 der Kommission vom 13. März 2019 zur
    Ergänzung der Richtlinie (EU) 2018/2001 des Europäischen Parlaments und des
    Rates im Hinblick auf die Bestimmung der Rohstoffe mit hohem Risiko indirekter
    Landnutzungsänderungen, in deren Fall eine wesentliche Ausdehnung der Produktionsflächen
    auf Flächen mit hohem Kohlenstoffbestand zu beobachten ist, und die Zertifizierung
    von Biokraftstoffen, flüssigen Biobrennstoffen und Biomasse-Brennstoffen mit
    geringem Risiko indirekter Landnutzungsänderungen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/807 на Комисията
    от 13 март 2019 година за допълване на Директива
    (ЕС) 2018/2001 на Европейския парламент и на Съвета
    по отношение на определянето на суровините
    с висок риск от непреки промени в земеползването,
    за които се наблюдава значително разширяване
    на производствения район в терени с високи
    въглеродни запаси и за сертифициране на биогоривата,
    течните горива от биомаса и газообразните
    и твърдите горива от биомаса с нисък риск от
    непреки промени в земеползването
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2019/807 ze dne 13. března
    2019, kterým se doplňuje směrnice Evropského parlamentu a Rady (EU) 2018/2001,
    pokud jde o stanovení surovin s vysokým rizikem nepřímé změny ve využívání
    půdy, u nichž je zjištěno značné rozšíření oblasti produkce na půdu
    s velkou zásobou uhlíku, a o certifikaci biopaliv, biokapalin a paliv z biomasy
    s nízkým rizikem nepřímé změny ve využívání půdy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2019/807 af 13. marts 2019 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv (EU) 2018/2001
    for så vidt angår fastsættelse af råprodukter med høj risiko for indirekte
    ændringer i arealanvendelsen, for hvilke der er konstateret en betydelig udvidelse
    af produktionsarealet ind på arealer med stort kulstoflager, og certificering
    af biobrændstoffer, flydende biobrændsler og biomassebrændsler med lav risiko
    for indirekte ændringer i arealanvendelsen
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) 2019/807
    της Επιτροπής, της 13ης Μαρτίου 2019, για τη συμπλήρωση
