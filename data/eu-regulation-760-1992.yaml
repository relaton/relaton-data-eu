    1992 om importlicenser for visse mejeriprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Republikken
    Polen, Den Tjekkiske og Slovakiske Føderative Republik og Republikken Ungarn
    #'
  type: main
