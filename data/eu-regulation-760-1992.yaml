  content: Commission Regulation (EEC) No 760/92 of 26 March 1992 determining the
    extent to which applications lodged in March 1992 for import licences for certain
    milk products and products covered by the arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 760/92 de la Commission du 26 mars 1992 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    mars 1992 pour certains produits dans le secteur du lait et des produits laitiers
    du régime prévu par les accords intérimaires conclus par la Communauté avec
    la République de Pologne, la République de Hongrie, et la République fédérative
    tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 760/92 DER KOMMISSION vom 26. März 1992 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im März 1992 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und Polen, Ungarn sowie der Tschechischen und Slowakischen Föderativen Republik
    geschlossenen Interimsabkommen beantragt wurden #'
  type: main
- language: da
  script: Latn
