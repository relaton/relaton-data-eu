title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 701/76 of 29 March 1976 amending Regulation
    (EEC) No 1992/75 fixing for the 1975/76 marketing year in respect of trade within
    the Community the components designed to protect the rice and cereals processing
    industries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 701/76 de la Commission, du 29 mars 1976, modifiant
    le règlement (CEE) n° 1992/75 fixant, en ce qui concerne les échanges intracommunautaires,
    pour la campagne de commercialisation 1975/1976, les éléments destinés à assurer,
    dans le secteur des céréales et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 701/76 der Kommission vom 29. März 1976 zur Änderung
    der Verordnung (EWG) Nr. 1992/75 zur Festsetzung des Bestandteils zum Schutz der
    Verarbeitungsindustrie auf dem Getreide- und Reissektor im Hinblick auf den innergemeinschaftlichen
    Handel für das Wirtschaftsjahr 1975/1976
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 701/76 af 29. marts 1976 om ændring
    af forordning (EØF) nr. 1992/75 om fastsættelse for produktionsåret 1975/1976
    - for handel inden for Fællesskabet - af de elementer, der for korn og ris har
    til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 701/76 della Commissione, del 29 marzo 1976, che modifica
    il regolamento (CEE) n. 1992/75 che fissa, per quanto riguarda gli scambi intracomunitari
    nella campagna di commercializzazione 1975/1976, gli elementi destinati ad assicurare
    la protezione dell'industria di trasformazione nel settore dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 701/76 van de Commissie van 29 maart 1976 tot wijziging
    van Verordening (EEG) nr. 1992/75 tot vaststelling van de elementen die dienen
    om in het verkoopseizoen 1975/1976 in het intracommunautaire handelsverkeer in
    de sector granen en rijst de bescherming van de verwerkende industrie te verzekeren
  type: main
