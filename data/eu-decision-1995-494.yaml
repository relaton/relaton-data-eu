title:
- language: en
  script: Latn
  content: '95/494/EC: Commission Decision of 17 November 1995 approving the single
    programming document for Community structural measures for improving the processing
    and marketing conditions for agricultural and forestry products in Finland (with
    the exception of Objective 6 regions), in respect of Objective 5 (a), covering
    the period between 1995 and 1999 (Only the Finnish version is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/494/CE: Décision de la Commission, du 17 novembre 1995, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en Finlande (à l''exception des régions
    de l''objectif nº 6), au titre de l''objectif nº 5 a), couvrant la période
    entre 1995 et 1999 (Le texte en langue finnoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '95/494/EG: Entscheidung der Kommission vom 17. November 1995 zur Genehmigung
    eines einzigen Programmplanungsdokuments für strukturelle Interventionen der
    Gemeinschaft zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen für
    land- und forstwirtschaftliche Produkte in Finnland (mit Ausnahme der Gebiete
    der Zielvorgabe 6) im Rahmen der Zielvorgabe 5a, für den Zeitraum 1995 bis 1999
    (Nur der finnische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/494/EF: Kommissionens beslutning af 17. november 1995 om godkendelse
    af enhedsprogrammeringsdokumentet for EF''s strukturinterventioner vedrørende
    forarbejdning og afsætning af landbrugs- og skovbrugsprodukter i Finland (med
    undtagelse af mål nr. 6-områder) for mål nr. 5a for perioden 1995 til 1999
    (Kun den finske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/494/ΕΚ: Απόφαση της Επιτροπής της 17ης Νοεμβρίου
    1995 σχετικά με την έγκριση του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις που αφορούν τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών προϊόντων
    στη Φινλανδία (με εξαίρεση τις περιφέρειες
    του στόχου αριθ. 6), στο πλαίσιο του στόχου 5α,
    που καλύπτει την περίοδο από το 1995 μέχρι το
    1999 (Το κείμενο στη φινλανδική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/494/EY: Komission päätös, tehty 17 päivänä marraskuuta 1995,
    Suomen alueen (lukuun ottamatta tavoitteeseen 6 kuuluvaa aluetta) maa- ja metsätaloustuotteiden
    jalostamisen ja kaupan pitämisen edellytysten parantamiseen liittyviä yhteisön
    rakenteellisia tukitoimenpiteitä koskevan yhden ohjelma-asiakirjan hyväksymisestä
    tavoitteen 5a mukaisesti vuosien 1995 ja 1999 väliseksi ajaksi (Ainoastaan suomenkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/494/CE: Decisione della Commissione, del 17 novembre 1995, recante
    approvazione del documento unico di programmazione per gli interventi strutturali
    comunitari relativi al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e della silvicoltura in Finlandia (ad eccezione delle regioni
    dell''obiettivo n. 6), nel quadro dell''obiettivo n. 5 a, per il periodo dal 1995
    al 1999 (Il testo in lingua finlandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/494/EG: Beschikking van de Commissie van 17 november 1995 houdende
    goedkeuring van het enig programmeringsdocument voor de structurele bijstandsverlening
    van de Gemeenschap voor de verbetering van de verwerking en de afzet van land-
    en bosbouwprodukten in Finland (met uitzondering van de gebieden van doelstelling
    6) in het kader van doelstelling 5 a), voor de periode van 1995 tot en met 1999
    (Slechts de tekst in de Finse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/494/CE: Decisão da Comissão, de 17 de Novembro de 1995, que aprova
    o documento único de programação para as intervenções estruturais comunitárias
    relativas à melhoria das condições de transformação e de comercialização
    dos produtos agrícolas e silvícolas na Finlândia (à excepção das regiões
    do objectivo 6), a título do objectivo 5 a), para o período compreendido entre
    1995 e 1999 (Apenas faz fé o texto em língua finlandesa)'
  type: main
- language: es
  script: Latn
  content: '95/494/CE: Decisión de la Comisión, de 17 de noviembre de 1995, por
    la que se aprueba el documento único de programación para las intervenciones
    estructurales comunitarias destinadas a la mejora de las condiciones de transformación
    y comercialización de productos agrícolas y silvícolas en Finlandia (excepto
    las regiones incluidas en el objetivo nº 6), con arreglo al objetivo nº 5 a),
    durante el período comprendido entre 1995 y 1999 (El texto en lengua finesa es
    el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '95/494/EG: Kommissionens beslut av den 17 november 1995 om godkännande
    av enhetsprogrammeringsdokumentet av gemenskapens strukturella åtgärder för
    förbättring av villkoren för bearbetning och saluföring av jordbruks- och
    skogsprodukter i Finland (med undantag av mål 6-områden), med avseende på mål
    5a, som täcker perioden mellan 1995 och 1999 (Endast den finska texten är giltig)'
