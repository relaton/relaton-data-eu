title:
- language: en
  script: Latn
  content: '2005/410/EC: Commission Decision of 31 May 2005 authorising Spain to extend
    for three years the application of a temporary measure excluding from compensatory
    aid marketed produce of new banana plantations planted on or after 1 June 2002(notified
    under document number C(2005) 1605)'
  type: main
- language: fr
  script: Latn
  content: '2005/410/CE: Décision de la Commission du 31 mai 2005 autorisant l’Espagne
    à prolonger pendant une période de trois années l’application d’une mesure
    temporaire d''exclusion de l''aide compensatoire pour les produits commercialisés
    provenant de nouvelles bananeraies plantées à partir du 1er juin 2002[notifiée
    sous le numéro C(2005) 1605]'
  type: main
- language: de
  script: Latn
  content: '2005/410/EG: Entscheidung der Kommission vom 31. Mai 2005 zur Ermächtigung
    Spanien, die befristete Maßnahme, mit der vermarktete Erzeugnisse aus neuen,
    ab dem 1. Juni 2002 angelegten Bananenplantagen von der Ausgleichsbeihilfe ausgeschlossen
    werden, um einen Zeitraum von drei Jahren zu verlängern (Bekannt gegeben unter
    Aktenzeichen K(2005) 1605)'
  type: main
- language: cs
  script: Latn
  content: '2005/410/ES: Rozhodnutí Komise ze dne 31. května 2005, kterým se Španělsku
    povoluje, aby prodloužilo o tři roky používání dočasného opatření, na
    jehož základě se pro prodané produkty pocházející z nových banánových
    plantáží, které byly založeny po 1. červnu 2002, nevyplácí vyrovnávací
    podpora (oznámeno pod číslem K(2005) 1605)'
  type: main
- language: da
  script: Latn
  content: '2005/410/EF: Kommissionens beslutning af 31. maj 2005 om tilladelse til
    Spanien til i en periode på tre år fortsat at anvende en midlertidig foranstaltning
    vedrørende udelukkelse fra udligningsstøtten for markedsførte produkter, der
    hidrører fra nye bananplantager plantet fra den 1. juni 2002(meddelt under nummer
    K(2005) 1605)'
  type: main
- language: el
  script: Grek
  content: '2005/410/EK: Απόφαση της Επιτροπής, της 31ης Μαΐου
    2005, που εξουσιοδοτεί την Ισπανία να παρατείνει
    για περίοδο τριών ετών την εφαρμογή ενός προσωρινού
    μέτρου αποκλεισμού της αντισταθμιστικής ενίσχυσης
    για τα προϊόντα που τίθενται σε εμπορία και
    προέρχονται από νέα μπανανόδενδρα που φυτεύθηκαν
    από την 1η Ιουνίου 2002[κοινοποιηθείσα υπό τον
    αριθμό Ε(2005) 1605]'
  type: main
- language: et
  script: Latn
  content: '2005/410/EÜ: Komisjoni otsus, 31. mai 2005, millega lubatakse Hispaanial
    kolme aasta võrra pikendada ajutise meetme kohaldamist, mille kohaselt ei anta
    1. juunil 2002 või pärast seda rajatud uutest banaaniistandustest pärit turustatava
    toodangu eest tasandustoetust (teatavaks tehtud numbri K(2005) 1605 all)'
  type: main
- language: fi
  script: Latn
  content: '2005/410/EY: Komission päätös, tehty 31 päivänä toukokuuta 2005,
    luvan antamisesta Espanjalle jatkaa kolmen vuoden ajan sellaisen väliaikaisen
    toimenpiteen soveltamista, jolla kielletään tasaustuki 1 päivänä kesäkuuta
    2002 tai sen jälkeen istutetuilta uusilta banaaniviljelmiltä peräisin olevilta
    kaupan pidettäviltä tuotteilta (tiedoksiannettu numerolla K(2005) 1605)'
  type: main
- language: hu
  script: Latn
  content: '2005/410/EK: A Bizottság határozata (2005. május 31.) a 2002. június
