title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2193/78 of 20 September 1978 re-establishing
    the levying of customs duties on woven fabrics of silk, of noil or other waste
    silk, falling within heading No 50.09, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2193/78 de la Commission, du 20 septembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie, de bourre de soie (schappe) ou de déchets de bourre de soie (bourrette),
    de la position tarifaire 50.09, originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 1197/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2193/78 der Kommission vom 20. September 1978 über
    die Wiedereinführung des Zollsatzes für Gewebe aus Seide, Schappeseide oder
    Bourretteseide, der Tarifnummer 50.09, mit Ursprung in Brasilien, dem die in der
    Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2193/78 af 20. september 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke (herunder schappesilke
    og bourettesilke), under position 50.09, som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2193/78 della Commissione, del 20 settembre 1978,
    che ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta,
    di borra di seta (schappe) o di cascami di borra di seta (roccadino o pettenuzzo
    di seta), della voce 50.09 della tariffa doganale comune, originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 1197/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2193/78 van de Commissie van 20 september 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van zijde, van vlokzijde of van bourrette, van post 50.09, van oorsprong uit Brazilië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 1197/78 van de Raad
  type: main
