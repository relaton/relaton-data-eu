  script: Latn
  content: Regulation (EU) 2021/954 of the European Parliament and of the Council
    of 14 June 2021 on a framework for the issuance, verification and acceptance of
    interoperable COVID-19 vaccination, test and recovery certificates (EU Digital
    COVID Certificate) with regard to third-country nationals legally staying or residing
    in the territories of Member States during the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
