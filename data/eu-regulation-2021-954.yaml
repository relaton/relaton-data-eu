    2021 relatif à un cadre pour la délivrance, la vérification et l’acceptation
    de certificats COVID-19 interopérables de vaccination, de test et de rétablissement
    (certificat COVID numérique de l’UE) destinés aux ressortissants de pays tiers
    séjournant ou résidant légalement sur le territoire des États membres pendant
    la pandémie de COVID-19
  type: main
