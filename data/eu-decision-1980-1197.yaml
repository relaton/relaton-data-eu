title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1980 authorizing the Kingdom of Belgium
    and the Grand Duchy of Luxembourg not to apply Community treatment to fresh table
    grapes originating in Spain (Only the French and Dutch texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 novembre 1980, autorisant le Royaume
    de Belgique et le Grand- Duché de Luxembourg à exclure du traitement communautaire
    les raisins frais de table originaires d'Espagne (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1980 zur Ermächtigung des
    Königreichs Belgien und des Großherzogtums Luxemburg, aus Spanien stammende
    frische Tafeltrauben von der Gemeinschaftsbehandlung auszuschließen (Nur der
    französische und niederländische Text sind verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. november 1980 om bemyndigelse af kongeriget
    Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling at undtage
    friske druer til spisebrug, med oprindelse i Spanien (Kun den franske og nederlandske
    udgave er autentiske)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1980, che autorizza il Regno
    del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento comunitario
    le uve fresche da tavola originarie della Spagna (Il testi in lingua francese
    e olandese sono i soli facenti fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1980 houdende machtiging van
    het Koninkrijk België en het Groothertogdom Luxemburg om druiven, voor tafelgebruik,
    van oorsprong uit Spanje, van de communautaire behandeling uit te sluiten (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)
  type: main
