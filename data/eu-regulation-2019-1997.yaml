    2019 om återupptagande av undersökningen till följd av domen av den 19 september
    2019 i mål C-251/18 Trace Sport SAS med avseende på rådets genomförandeförordning
    (EU) nr 501/2013 av den 29 maj 2013 om utvidgning av den slutgiltiga antidumpningstull
