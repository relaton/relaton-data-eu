title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1997 of 29 November 2019 reopening
    the investigation following the judgment of 19 September 2019, in Case C‐251/18
    Trace Sport SAS, with regard to Council Implementing Regulation (EU) No 501/2013
    of 29 May 2013 extending the definitive anti-dumping duty imposed by Implementing
    Regulation (EU) No 990/2011 on imports of bicycles originating in the People’s
    Republic of China to imports of bicycles consigned from Indonesia, Malaysia, Sri
    Lanka and Tunisia, whether declared as originating in Indonesia, Malaysia, Sri
    Lanka and Tunisia or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2019/1997 de la Commission du 29 novembre
    2019 portant réouverture de l’enquête à la suite de l’arrêt rendu le 19
    septembre 2019 dans l’affaire Trace Sport SAS (C‐251/18) ayant trait au règlement
    d’exécution (UE) no 501/2013 du Conseil du 29 mai 2013 portant extension du
    droit antidumping définitif institué par le règlement d’exécution (UE) no
    990/2011 sur les importations de bicyclettes originaires de la République populaire
    de Chine aux importations de bicyclettes expédiées d’Indonésie, de Malaisie,
    du Sri Lanka et de Tunisie, qu’elles aient ou non été déclarées originaires
    de ces pays
  type: main
