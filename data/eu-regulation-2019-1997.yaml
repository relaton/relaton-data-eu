    Trace Sport SAS, v zvezi z Izvedbeno uredbo Sveta (EU) št. 501/2013 z dne 29.
    maja 2013 o razširitvi dokončne protidampinške dajatve, uvedene z Izvedbeno
    uredbo (EU) št. 990/2011 na uvoz koles s poreklom iz Ljudske republike Kitajske,
    na uvoz koles, poslanih iz Indonezije, Malezije, Šrilanke in Tunizije, ne glede
    na to, ali so deklarirani kot izdelek s poreklom iz Indonezije, Malezije, Šrilanke
    in Tunizije ali ne
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1997 de la Comisión de 29 de noviembre
    de 2019 reapertura de la investigación a raíz de una sentencia de 19 de septiembre
    de 2019, en el caso C-251/18 Trace Sport SAS, con respecto al Reglamento de Ejecución
    (UE) n.o 501/2013 del Consejo, de 29 de mayo de 2013, por el que se amplía el
    derecho antidumping definitivo impuesto mediante el Reglamento de Ejecución (UE)
    n.o 990/2011 a las importaciones de bicicletas originarias de la República Popular
    China a las importaciones de bicicletas procedentes de Indonesia, Malasia, Sri
    Lanka y Túnez, hayan sido o no declaradas originarias de Indonesia, Malasia,
    Sri Lanka y Túnez
  type: main
