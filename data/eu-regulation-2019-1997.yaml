  content: Regolamento di esecuzione (UE) 2019/1997 della Commissione del 29 novembre
    2019 relativo alla riapertura dell’inchiesta in seguito alla sentenza del 19
    settembre 2019 nella causa C-251/18 Trace Sport SAS, per quanto riguarda il regolamento
    di esecuzione (UE) n. 501/2013 del Consiglio, del 29 maggio 2013, che estende
