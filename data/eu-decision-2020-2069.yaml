  content: Council Decision (EU) 2020/2069 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Association Council established
    by the Euro-Mediterranean Agreement establishing an association between the European
    Community and its Member States, of the one part, and the Republic of Lebanon,
    of the other part, as regards the amendment of that Agreement by replacing Protocol
    4 thereto concerning the definition of the concept of ‘originating products’
    and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2069 du Conseil du 7 décembre 2020 relative à la
