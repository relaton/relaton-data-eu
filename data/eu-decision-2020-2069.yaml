    institué par l’accord euro-méditerranéen instituant une association entre
    la Communauté européenne et ses États membres, d’une part, et la République
    libanaise, d’autre part, en ce qui concerne la modification dudit accord par
    le remplacement de son protocole no 4 relatif à la définition de la notion de
    «produits originaires» et aux méthodes de coopération administrative
  type: main
