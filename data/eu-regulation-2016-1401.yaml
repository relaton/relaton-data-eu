  script: Latn
  content: Commission Delegated Regulation (EU) 2016/1401 of 23 May 2016 supplementing
    Directive 2014/59/EU of the European Parliament and of the Council establishing
    a framework for the recovery and resolution of credit institutions and investment
    firms with regard to regulatory technical standards for methodologies and principles
    on the valuation of liabilities arising from derivatives
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/1401 de la Commission du 23 mai 2016 complétant
