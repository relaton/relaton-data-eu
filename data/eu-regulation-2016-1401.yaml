    de investiții în ceea ce privește standardele tehnice de reglementare pentru
    metodologiile și principiile referitoare la evaluarea pasivelor care provin din
    instrumente financiare derivate
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2016/1401 z 23. mája 2016, ktorým
