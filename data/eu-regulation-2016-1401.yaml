    e de empresas de investimento no que diz respeito às normas técnicas de regulamentação
    relativas às metodologias e aos princípios de avaliação dos passivos decorrentes
    de derivados
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2016/1401 al Comisiei din 23 mai 2016 de completare
