title:
- language: en
  script: Latn
  content: '80/603/EEC: Commission Decision of 23 June 1980 accepting undertakings
    given in connection with the anti-dumping proceedings concerning mounted piezo-electric
    quartz crystal units, originating in Japan, South Korea and the United States
    of America, and terminating the proceedings'
  type: main
- language: fr
  script: Latn
  content: '80/603/CEE: Décision de la Commission, du 23 juin 1980, portant acceptation
    des engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les cristaux de quartz piézo-électriques montés, originaires de la Corée du
    Sud, des États-Unis d'' Amérique et du Japon, et clôturant la procédure'
  type: main
- language: de
  script: Latn
  content: '80/603/EWG: Beschluß der Kommission vom 23. Juni 1980 über die Annahme
    von Verpflichtungserklärungen im Rahmen der Antidumpingverfahren betreffend gefaßte
    oder montierte piezoelektrische Kristalle mit Ursprung in Japan, Südkorea und
    den Vereinigten Staaten von Amerika und über die Einstellung dieser Verfahren'
  type: main
- language: da
  script: Latn
  content: '80/603/EØF: Kommissionens afgørelse af 23. juni 1980 om godtagelse af
    tilsagn afgivet i forbindelse med antidumpingprocedurerne vedrørende monterede
    piezo-elektriske kvartskrystalenheder med oprindelse i Amerikas forenede Stater,
    Japan og Syd-korea og om afslutning af disse procedurer'
  type: main
- language: it
  script: Latn
  content: '80/603/CEE: Decisione della Commissione, del 23 giugno 1980, recante accettazione
    degli impegni assunti nell'' ambito della procedura antidumping relativa ai cristalli
    di quarzo piezoelettrici, originari del Giappone, della Corea del Sud e degli
    Stati Uniti d'' America, e recante conclusione della procedura'
  type: main
- language: nl
  script: Latn
  content: '80/603/EEG: Besluit van de Commissie van 23 juni 1980 houdende aanvaarding
    van de verbintenissen aangegaan in het kader van de anti-dumpingprocedure betreffende
    gemonteerde piëzo-elektrische kwartskristallen van oorsprong uit Japan, de Verenigde
    Staten van Amerika en Zuid-Korea en houdende beëindiging van deze procedure'
