id: EUDecision1979188
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/188/EEC: Commission Decision of 30 January 1979 authorizing the Italian
    Republic not to apply Community treatment to anti-knock preparations based on
    tetraethyl-lead (''ethyl-fluid''), falling within heading No ex 38.14 of the Common
    Customs Tariff, originating in the United States of America and in free circulation
    in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/188/CEE: Décision de la Commission, du 30 janvier 1979, autorisant
    la République italienne à exclure du traitement communautaire les préparations
    antidétonantes à base de plomb tétraéthyle ("ethyl fluid"), de la position
    ex 38.14 du tarif douanier commun, originaires des Etats-Unis d''Amérique et
    mises en libre pratique dans les autres Etats membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/188/EWG: Entscheidung der Kommission vom 30. Januar 1979, mit der die
    Italienische Republik ermächtigt wird, aus den Vereinigten Staaten von Amerika
    stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Antiklopfmittel
    auf der Grundlage von Tetraäthylblei (Äthylfluid) der Tarifnummer ex 38.14 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der
    italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/188/EØF: Kommissionens beslutning af 30. januar 1979 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage præparater
    til modvirkning af bankning, fremstillet på basis af tetraethylbly, som henhører
    under pos. ex 38.14 i den fælles toldtarif, har oprindelse i USA og frit kan
    omsættes i de øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/188/CEE: Decisione della Commissione, del 30 gennaio 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le preparazioni
    antidetonanti a base di piombo tetraetile (etil fluido) della voce ex 38.14 della
    tariffa doganale comune originarie degli Stati Uniti d''America e messe in libera
    pratica negli altri Stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/188/EEG: Beschikking van de Commissie van 30 januari 1979 waarbij de
    Italiaanse Republiek wordt gemachtigd anti-klopmiddelen op basis van tetraethyllood
    van post ex 38.14 van het gemeenschappelijk douanetarief, van oorsprong uit de
    Verenigde Staten van Amerika en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Italiaanse taal is authentiek)'
  type: main
