    établissant un cadre pour le redressement et la résolution des établissements
    de crédit et des entreprises d’investissement et modifiant la directive 82/891/CEE
    du Conseil ainsi que les directives du Parlement européen et du Conseil 2001/24/CE,
    2002/47/CE, 2004/25/CE, 2005/56/CE, 2007/36/CE, 2011/35/UE, 2012/30/UE et 2013/36/UE
