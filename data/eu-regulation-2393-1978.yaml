  content: Commission Regulation (EEC) No 2393/78 of 13 October 1978 laying down detailed
    rules for the application of the additional measures applicable to holders of
    long-term storage contracts for table wine for the wine-growing year 1977/78
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2393/78 de la Commission, du 13 octobre 1978, établissant
    les modalités d' application des mesures complémentaires réservées aux détenteurs
    de contrats de stockage à long terme des vins de table pour la campagne 1977/1978
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2393/78 der Kommission vom 13. Oktober 1978 zur Festlegung
