    langfristiger Lagerverträge für Tafelweine vorbehalten sind, für das Wirtschaftsjahr
    1977/78
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2393/78 af 13. oktober 1978 om fastsættelse
    af gennemførelsesbestemmelser for de supplerende foranstaltninger, der er forbeholdt
    indehaverne af langfristede oplagringskontrakter for bordvin for produktionsåret
    1977/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2393/78 della Commissione, del 13 ottobre 1978, che
