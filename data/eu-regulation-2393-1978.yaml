    titolari di contratti di magazzinaggio a lungo termine dei vini da tavola per
    la campagna 1977/1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2393/78 van de Commissie van 13 oktober 1978 tot
