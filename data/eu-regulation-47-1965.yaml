title:
- language: fr
  script: Latn
  content: Règlement n 47/65/CEE de la Commission, du 29 mars 1965, adaptant et fixant
    les prix d'écluse pour les porcs, la viande de porc et les produits à base de
    viande de porc pour les importations effectuées entre le 1er avril et le 30 juin
    1965
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 47/65/EWG der Kommission vom 29. März 1965 zur Anpassung
    und Festsetzung der Einschleusungspreise für Schweine, Schweinefleisch und Schweinefleisch
    enthaltende Erzeugnisse für Einfuhren, die vom 1. April bis zum 30. Juni 1965
    getätigt werden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 47/65/CEE della Commissione, del 29 marzo 1965, che adatta
    e fissa i prezzi limite per i suini, le carni suine e i prodotti a base di carni
    suine per le importazioni effettuate tra il 1 aprile e il 30 giugno 1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 47/65/EEG van de Commissie van 29 maart 1965 houdende aanpassing
    en vaststelling van de sluisprijzen voor varkens, varkensvlees en produkten op
    basis van varkensvlees, met betrekking tot de invoer welke plaatsvindt in het
    tijdvak van 1 april tot en met 30 juni 1965
