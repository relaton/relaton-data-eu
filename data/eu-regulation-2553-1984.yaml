title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2553/84 of 4 September 1984 imposing a provisional
    anti-dumping duty on imports of oxalic acid originating in Brazil, accepting an
    undertaking offered by the exporter in the German Democratic Republic of oxalic
    acid and terminating the proceeding regarding imports of oxalic acid from the
    German Democratic Republic and Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2553/84 de la Commission du 4 septembre 1984 instituant
    un droit antidumping provisoire sur les importations d' acide oxalique originaire
    du Brésil, portant acceptation d' un engagement souscrit par l' exportateur d'
    acide oxalique de la République démocratique allemande et portant clôture de
    la procédure en ce qui concerne les importations d' acide oxalique en provenance
    de la République démocratique allemande et de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2553/84 der Kommission vom 4. September 1984 zur Einführung
    eines vorläufigen Antidumpingzolls auf Einfuhren von Oxalsäure mit Ursprung
    in Brasilien, zur Annahme einer vom Ausführer von Oxalsäure in der Deutschen
    Demokratischen Republik angebotenen Verpflichtung und zur Einstellung des Verfahrens
    betreffend Einfuhren von Oxalsäure aus der Deutschen Demokratischen Republik
    und Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2553/84 af 4. september 1984 om indførelse
    af en midlertidig antidumpingtold på importen af oxalsyre med oprindelse i Brasilien,
    om godtagelse af tilsagn fra eksportøren af oxalsyre i Den tyske demokratiske
    Republik og om afslutning af proceduren vedrørende importen af oxalsyre fra Den
    tyske demokratiske Republik og Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2553/84 της Επιτροπής
    της 4ης Σεπτεμβρίου 1984 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές οξαλικού
    οξέος καταγωγής Βραζιλίας, την αποδοχή μιας
    υποχρέωσης που ανέλαβε ο εξαγωγέας οξαλικού
    οξέος από τη Λαϊκή Δημοκρατία της Γερμανίας,
    και την περάτωση της διαδικασίας όσον αφορά
    τις εισαγωγές οξαλικού οξέος από τη Λαϊκή Δημοκρατία
    της Γερμανίας και την Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2553/84 della Commissione del 4 settembre 1984 che
    istituisce un dazio antidumping provvisorio sulle importazioni di acido ossalico
    originarie del Brasile, accetta un impegno offerto dall' esportatore della Repubblica
    democratica tedesca e conclude la procedura relativa alle importazioni dello stesso
    prodotto originarie della Repubblica democratica tedesca e della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2553/84 van de Commissie van 4 september 1984 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van oxaalzuur, van
    oorsprong uit Brazilië, en aanvaarding van een door de oxaalzuurexporteur uit
    de Duitse Democratische Republiek aangeboden verbintenis alsmede beëindiging
    van de procedure inzake de invoer van oxaalzuur uit de Duitse Democratische Republiek
    en uit Spanje
  type: main
