title:
- language: en
  script: Latn
  content: '79/12/EEC: Commission Decision of 27 November 1978 authorizing the Kingdom
    of Belgium and the Grand Duchy of Luxembourg not to apply Community treatment
    to tomatoes and table grapes falling within subheading 07.01 M I or 08.04 A I
    of the Common Customs Tariff, originating in Spain (including the Canary Islands)
    and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/12/CEE: Décision de la Commission, du 27 novembre 1978, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les tomates et les raisins de table des sous-positions 07.01 M I
    et 08.04 A I du tarif douanier commun, originaires d''Espagne (y compris les îles
    Canaries) et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/12/EWG: Entscheidung der Kommission vom 27. November 1978, mit der
    das Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus
    Spanien (einschließlich Kanarische Inseln) stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Tomaten und Tafelrauben der Tarifstellen 07.01 M
    I und 08.04 A I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/12/EØF: Kommissionens beslutning af 27. november 1978 om bemyndigelse
    af kongeriget Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling
    at undtage tomater og friske druer til spisebrug, som henhører under pos. 07.01
    M I og 08.04 A I i den fælles toldtarif, har oprindelse i Spanien (herunder De
    kanariske Øer) og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/12/CEE: Decisione della Commissione, del 27 novembre 1978, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento
    comunitario i pomodori e le uve da tavola, delle sottovoci 07.01 M I e 08.04 A
    I della tariffa doganale comune, originari della Spagna (ivi comprese le isole
    Canarie) e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/12/EEG: Beschikking van de Commissie van 27 november 1978 waarbij het
    Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd tomaten en
    tafeldruiven van de posten 07.01 M I en 08.04 A I van het gemeenschappelijk douanetarief,
    van oorsprong uit Spanje (de Canarische eilanden inbegrepen) en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
