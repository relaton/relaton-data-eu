  content: Commission Regulation (EEC) No 2752/92 of 22 September 1992 correcting
    Regulation (EEC) No 2512/92 fixing, for peas, field beans and sweet lupins, the
    level of estimated production for the 1992/93 marketing year, the level of actual
    production for the 1991/92 marketing year, and the adjustment to be made to the
    amount of the aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) N° 2752/92 de la Commission, du 22 septembre 1992, rectifiant
