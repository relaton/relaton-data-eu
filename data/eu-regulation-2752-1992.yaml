    1992/1993, la production estimée et, pour la campagne de commercialisation 1991/1992,
    la production effective, ainsi que l' ajustement dont le montant de l' aide est
    affecté pour les pois, fèves, féveroles et lupins doux
  type: main
- language: de
  script: Latn
