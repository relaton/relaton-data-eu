title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2017/93 of 23 July 1993 determining the
    extent to which applications lodged in July 1993 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2017/93 de la Commission, du 23 juillet 1993, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1993 pour certaines viandes de volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2017/93 der Kommission vom 23. Juli 1993 über das
    Ausmaß, in dem den im Juli 1993 für die Einfuhr von bestimmten Geflügelfleisch
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2017/93 af 23. juli 1993 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i juli 1993 for visse former for fjerkrækød, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2017/93 της Επιτροπής
    της 23ης Ιουλίου 1993 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιούλιο 1993 για ορισμένα κρέατα
    πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2017/93 della Commissione, del 23 luglio 1993, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1993 per alcune carni di pollame
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2017/93 van de Commissie van 23 juli 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 1993 ingediende aanvragen
    om invoercertificaten voor bepaalde soorten slachtpluimvee
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2017/93 da Comissão, de 23 de Julho de 1993, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação apresentados no mês de Julho de 1993 para determinada
    carne de aves de capoeira
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2017/93 de la Comisión, de 23 de julio de 1993, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de julio de 1993, para determinadas
    carnes de aves de corral
  type: main
