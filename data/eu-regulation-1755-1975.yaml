title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1755/75 of the Commission of 9 July 1975 adjusting
    the compensatory amounts and variable components, applicable during the third
    quarter of 1975 on the importation of goods covered by Regulation (EEC) No 1059/69
    and containing cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1755/75 de la Commission, du 9 juillet 1975, portant
    rectification des montants compensatoires et des éléments mobiles applicables
    pendant le troisième trimestre de l'année 1975, à l'importation de marchandises
    relevant du règlement (CEE) n 1059/69, contenant des céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1755/75 der Kommission vom 9. Juli 1975 zur Berichtigung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das dritte Vierteljahr
    1975 bei der Einfuhr von Waren, die Getreide enthalten und unter die Verordnung
    (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1755/75 af 9. juli 1975 om berigtigelse
    af de udligningsbeløb og variable elementer, som i tredje kvartal af 1975 skal
    anvendes ved indførsel af varer, som omfattes af forordning (EØF) nr. 1059/69
    og som indeholder korn
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1755/75 della Commissione, del 9 luglio 1975, che
    rettifica gli importi compensativi e gli elementi mobili applicabili, durante
    il terzo trimestre dell'anno 1975, all'importazione delle merci cui si applica
    il regolamento (CEE) n. 1059/69, contenenti cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1755/75 van de Commissie van 9 juli 1975 houdende
    verbetering van de variabele elementen en compenserende bedragen, toepasselijk
    gedurende het derde kwartaal van 1975 bij invoer van onder Verordening (EEG) nr.
    1059/69 vallende goederen welke graan bevatten
