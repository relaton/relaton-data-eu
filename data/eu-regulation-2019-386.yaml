    tariffarji
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/386 van de Commissie van 11 maart 2019
    tot vaststelling van regels betreffende de verdeling, na de terugtrekking van
    het Verenigd Koninkrijk uit de Europese Unie, van de in de WTO-lijst van de Unie
    opgenomen tariefcontingenten voor bepaalde landbouwproducten, en betreffende de
    in het kader van die tariefcontingenten afgegeven invoercertificaten en toegekende
    invoerrechten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/386 z dnia 11 marca 2019 r.
