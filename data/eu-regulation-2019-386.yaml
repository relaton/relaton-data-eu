title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/386 of 11 March 2019 laying
    down rules with regard to the apportionment of tariff rate quotas for certain
    agricultural products included in the WTO schedule of the Union following the
    withdrawal of the United Kingdom from the Union and with regard to import licences
    issued and import rights allocated under those tariff rate quotas
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/386 de la Commission du 11 mars 2019
    fixant des règles en ce qui concerne la répartition de contingents tarifaires
    pour certains produits agricoles de la liste de l'OMC après le retrait du Royaume-Uni
    de l'Union et en ce qui concerne les certificats d'importation délivrés et les
    droits d'importation attribués dans le cadre de ces contingents tarifaires
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/386 der Kommission vom 11. März 2019
    zur Festlegung von Vorschriften für die Aufteilung der Zollkontingente in der
    WTO-Liste der Union für bestimmte landwirtschaftliche Erzeugnisse nach dem Austritt
    des Vereinigten Königreichs aus der Union in Bezug auf die im Rahmen dieser Zollkontingente
    erteilten Einfuhrlizenzen und Einfuhrrechte
  type: main
- language: bg
