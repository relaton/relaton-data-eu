    da OMC, na sequência da saída do Reino Unido da União e no que respeita aos
    certificados de importação emitidos e aos direitos de importação atribuídos
    no âmbito desses contingentes pautais
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/386 al Comisiei din 11 martie
