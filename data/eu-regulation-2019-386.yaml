    produkty rolne uwzględnionych w unijnej liście koncesyjnej WTO po wystąpieniu
    Zjednoczonego Królestwa z Unii oraz zasady dotyczące pozwoleń na przywóz wydanych
    i uprawnień do przywozu przyznanych w ramach tych kontyngentów taryfowych
  type: main
- language: pt
  script: Latn
