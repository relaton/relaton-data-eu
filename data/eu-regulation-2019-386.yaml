    szabályokról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/386 della Commissione, dell'11 marzo
    2019, che stabilisce le norme relative alla suddivisione dei contingenti tariffari
    per taluni prodotti agricoli inclusi nell'elenco dell'OMC riferito all'Unione
    a seguito del recesso del Regno Unito dall'Unione e ai titoli di importazione
    rilasciati e ai diritti di importazione assegnati nel quadro di tali contingenti
    tariffari
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/386 (2019. gada 11. marts), ar
    ko nosaka noteikumus attiecībā uz dažu lauksaimniecības produktu tarifa kvotu,
    kas iekļautas Savienības PTO sarakstā, sadalījumu pēc Apvienotās Karalistes
    izstāšanās no Savienības un attiecībā uz atbilstoši minētajām tarifa
    kvotām izdotajām importa licencēm un piešķirtajām importa tiesībām
  type: main
- language: lt
  script: Latn
  content: 2019 m. kovo 11 d. Komisijos įgyvendinimo reglamentas (ES) 2019/386, kuriuo
    nustatomos taisyklės, susijusios su tam tikrų žemės ūkio produktų tarifinių
    kvotų, nustatytų Sąjungai skirtame PPO sąraše, paskirstymu Jungtinei Karalystei
