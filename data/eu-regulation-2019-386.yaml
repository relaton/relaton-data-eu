    anumite produse agricole incluse în lista OMC a Uniunii ca urmare a retragerii
    Regatului Unit din Uniune și privind licențele de import eliberate și drepturile
    de import alocate în cadrul respectivelor contingente tarifare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/386 z 11. marca 2019, ktorým
    sa stanovujú pravidlá, pokiaľ ide o rozdelenie colných kvót na určité poľnohospodárske
    výrobky uvedených v listine WTO pre Úniu po vystúpení Spojeného kráľovstva
