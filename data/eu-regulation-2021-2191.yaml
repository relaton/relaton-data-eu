title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2191 of 10 December 2021 authorising
    the placing on the market of fresh plants of Wolffia arrhiza and/or Wolffia globosa
    as a traditional food from a third country under Regulation (EU) 2015/2283 of
    the European Parliament and of the Council and amending Commission Implementing
    Regulation (EU) 2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2191 de la Commission du 10 décembre
    2021 autorisant la mise sur le marché de plantes fraîches de Wolffia arrhiza
    et/ou de Wolffia globosa en tant qu’aliment traditionnel en provenance d’un
    pays tiers en vertu du règlement (UE) 2015/2283 du Parlement européen et du
    Conseil et modifiant le règlement d’exécution (UE) 2017/2470 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2191 der Kommission vom 10. Dezember
    2021 zur Genehmigung des Inverkehrbringens frischer Pflanzen der Arten Wolffia
    arrhiza und/oder Wolffia globosa als traditionelles Lebensmittel aus einem Drittland
    gemäß der Verordnung (EU) 2015/2283 des Europäischen Parlaments und des Rates
    sowie zur Änderung der Durchführungsverordnung (EU) 2017/2470 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/2191 на Комисията
    от 10 декември 2021 година за разрешаване на пускането
    на пазара на свежи растения от Wolffia arrhiza и/или
    Wolffia globosa като традиционна храна от трета държава
    съгласно Регламент (ЕС) 2015/2283 на Европейския
    парламент и на Съвета и за изменение на Регламент
    за изпълнение (ЕС) 2017/2470 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/2191 ze dne 10. prosince 2021,
    kterým se povoluje uvedení čerstvých rostlin Wolffia arrhiza a/nebo Wolffia
    globosa na trh jako tradiční potraviny ze třetí země podle nařízení Evropského
    parlamentu a Rady (EU) 2015/2283 a kterým se mění prováděcí nařízení
    Komise (EU) 2017/2470
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/2191 af 10. december
    2021 om tilladelse til markedsføring af friske planter af Wolffia arrhiza og/eller
    Wolffia globosa som en traditionel fødevare fra et tredjeland i henhold til Europa-Parlamentets
    og Rådets forordning (EU) 2015/2283 og om ændring af Kommissionens gennemførelsesforordning
    (EU) 2017/2470
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/2191 της Επιτροπής
    της 10ης Δεκεμβρίου 2021 για την έγκριση της διάθεσης
    στην αγορά νωπών φυτών των ειδών Wolffia arrhiza και/ή
    Wolffia globosa ως παραδοσιακών τροφίμων από τρίτη
    χώρα σύμφωνα με τον κανονισμό (ΕΕ) 2015/2283 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου,
    και για την τροποποίηση του εκτελεστικού κανονισμού
    (ΕΕ) 2017/2470 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/2191, 10. detsember 2021, millega
