    a chur ar an margadh mar bhia traidisiúnta ó thríú tír faoi Rialachán (AE)
    2015/2283 ó Pharlaimint na hEorpa agus ón gComhairle agus lena leasaítear Rialachán
    Cur Chun Feidhme (AE) 2017/2470 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/2191 оd 10. prosinca 2021. o odobravanju
    stavljanja na tržište svježih biljaka vrstâ Wolffia arrhiza i/ili Wolffia
    globosa kao tradicionalne hrane iz treće zemlje u skladu s Uredbom (EU) 2015/2283
    Europskog parlamenta i Vijeća i o izmjeni Provedbene uredbe Komisije (EU) 2017/2470
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2191 végrehajtási rendelete (2021. december 10.)
    a Wolffia arrhiza és/vagy a Wolffia globosa friss növényeinek az (EU) 2015/2283
    európai parlamenti és tanácsi rendelet szerinti, harmadik országból származó
    hagyományos élelmiszerként történő forgalomba hozatala engedélyezéséről
    és az (EU) 2017/2470 bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/2191 della Commissione del 10 dicembre
    2021 che autorizza l’immissione sul mercato di piante fresche di Wolffia arrhiza
    e/o Wolffia globosa quale alimento tradizionale da un paese terzo a norma del
    regolamento (UE) 2015/2283 del Parlamento europeo e del Consiglio e che modifica
    il regolamento di esecuzione (UE) 2017/2470 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/2191 (2021. gada 10. decembris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (ES) 2015/2283 kā tradicionālu
    pārtikas produktu no trešās valsts atļauj laist tirgū svaigus Wolffia arrhiza
    un/vai Wolffia globosa augus un groza Komisijas Īstenošanas regulu (ES) 2017/2470
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/2191 2021 m. gruodžio 10
    d. kuriuo leidžiama pateikti rinkai šviežius bešaknės volfijos (Wolffia arrhiza)
    ir (arba) apvaliosios volfijos (Wolffia globosa) augalus kaip trečiosios šalies
    tradicinį maisto produktą pagal Europos Parlamento ir Tarybos reglamentą (ES)
    2015/2283 ir kuriuo iš dalies keičiamas Komisijos įgyvendinimo reglamentas
    (ES) 2017/2470
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2191 tal-10
    ta’ Diċembru 2021 li jawtorizza t-tqegħid fis-suq ta’ pjanti tal-Wolffia
    arrhiza u/jew tal-Wolffia globosa bħala ikel tradizzjonali minn pajjiż terz
    skont ir-Regolament (UE) 2015/2283 tal-Parlament Ewropew u tal-Kunsill u li jemenda
    r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/2470
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/2191 van de Commissie van 10 december
    2021 tot verlening van een vergunning voor het in de handel brengen van verse
    planten van Wolffia arrhiza en/of Wolffia globosa als traditioneel levensmiddel
    uit een derde land krachtens Verordening (EU) 2015/2283 van het Europees Parlement
    en de Raad en tot wijziging van Uitvoeringsverordening (EU) 2017/2470 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/2191 z dnia 10 grudnia 2021
    r. zezwalające na wprowadzenie na rynek świeżych roślin gatunków Wolffia
    arrhiza i/lub Wolffia globosa jako tradycyjnej żywności z państwa trzeciego
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2015/2283 oraz
    zmieniające rozporządzenie wykonawcze Komisji (UE) 2017/2470
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/2191 da Comissão de 10 de dezembro
    de 2021 que autoriza a colocação no mercado de plantas frescas de Wolffia arrhiza
    e/ou Wolffia globosa como alimento tradicional de um país terceiro ao abrigo
    do Regulamento (UE) 2015/2283 do Parlamento Europeu e do Conselho e que altera
    o Regulamento de Execução (UE) 2017/2470 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/2191 al Comisiei din 10 decembrie
    2021 de autorizare a introducerii pe piață a plantelor proaspete de Wolffia
    arrhiza și/sau de Wolffia globosa ca aliment tradițional provenit dintr-o țară
    terță în temeiul Regulamentului (UE) 2015/2283 al Parlamentului European și
    al Consiliului, precum și de modificare a Regulamentului de punere în aplicare
    (UE) 2017/2470 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/2191 z 10. decembra 2021, ktorým
