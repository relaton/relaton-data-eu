  script: Latn
  content: Reglamento de Ejecución (UE) 2021/2191 de la Comisión de 10 de diciembre
    de 2021 por el que se autoriza la comercialización de plantas frescas de Wolffia
    arrhiza o de Wolffia globosa como alimento tradicional de un tercer país con
