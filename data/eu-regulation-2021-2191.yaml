    -kasvien saattamiseksi markkinoille kolmannesta maasta tulevana perinteisenä
    elintarvikkeena Euroopan parlamentin ja neuvoston asetuksen (EU) 2015/2283 mukaisesti
    ja komission täytäntöönpanoasetuksen (EU) 2017/2470 muuttamisesta
  type: main
- language: ga
  script: Latn
