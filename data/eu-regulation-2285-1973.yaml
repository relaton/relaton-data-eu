title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2285/73 of the Council of 24 July 1973 on the conclusion
    of a protocol laying down certain provisions relating to the agreement establishing
    an association between the European Economic Community and the Kingdom of Morocco
    consequent on the accession of new Member States to the European Economic Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2285/73 du Conseil, du 24 juillet 1973, portant conclusion
    d'un protocole fixant certaines dispositions relatives à l'accord créant une
    association entre la Communauté économique européenne et le Royaume du Maroc
    en raison de l'adhésion de nouveaux États membres à la Communauté économique
    européenne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2285/73 DES RATES VOM 24. JULI 1973 UEBER DEN ABSCHLUSS
    EINES PROTOKOLLS ZUR FESTLEGUNG EINIGER BESTIMMUNGEN ZUM ABKOMMEN ZUR GRUENDUNG
    EINER ASSOZIATION ZWISCHEN DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DEM KOENIGREICH
    MAROKKO INFOLGE DES BEITRITTS NEUER MITGLIEDSTAATEN ZUR EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2285/73 af 24. juli 1973 om afslutning af
    en protokol om fastsættelse af visse bestemmelser, vedrørende aftalen om oprettelse
    af en associering mellem Det europæiske økonomiske Fællesskab og kongeriget
    Marokko, på grund af nye medlemsstaters tiltrædelse af Det europæiske økonomiske
    Fællesskab
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 2285/73 del Consiglio, del 24 luglio 1973, per la
    conclusione di un protocollo che fissa talune disposizioni relative all' accordo
    che crea un' associazione fra la Comunità economica europea ed il Regno del Marocco
    a seguito dell' adesione di nuovi Stati membri alla Comunità economica europea
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 2285/73 VAN DE RAAD VAN 24 JULI 1973 BETREFFENDE
    HET SLUITEN VAN EEN PROTOCOL HOUDENDE VASTSTELLING VAN ENKELE BEPALINGEN INZAKE
    DE OVEREENKOMST WAARBIJ EEN ASSOCIATIE TOT STAND WORDT GEBRACHT TUSSEN DE EUROPESE
    ECONOMISCHE GEMEENSCHAP EN HET KONINKRIJK MARROKO IN VERBAND MET DE TOETREDING
    VAN NIEUWE LID-STATEN TOT DE EUROPESE ECONOMISCHE GEMEENSCHAP
