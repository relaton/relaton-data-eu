type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 66/682/EEC of 7 November 1966 abolishing all laws,
    regulations or administrative provisions making imports of products which, under
    articles 9 and 10 of the Treaty, must be admitted for free movement, subject to
    the import, purchase or sale of identical or other national products
  type: main
- language: fr
  script: Latn
  content: Directive 66/682/CEE de la Commission, du 7 novembre 1966, portant suppression
    de dispositions législatives, réglementaires et administratives qui subordonnent
    l'importation d'un produit qui, en vertu des articles 9 et 10 du Traité, doit
    être admis à la libre circulation à l'exportation ou bien à l'achat ou à
    la vente du même ou d'un autre produit national
  type: main
- language: de
  script: Latn
  content: Richtlinie 66/682/EWG der Kommission vom 7. November 1966 für die Aufhebung
    der Rechts- und Verwaltungsvorschriften, die die Einfuhr einer gemaß Artikel
    9 und 10 des Vertrages zum freien verkehr zuzulassenden Ware von der Ausfuhr,
    dem Erwerb oder dem Verkauf der gleichen oder einer anderen Inländischen Ware
    Abhängig machen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS DIREKTIV AF 7. NOVEMBER 1966 VEDROERENDE OPHAEVELSE AF LOVE,
    FORSKRIFTER OG ADMINISTRATIVE BESTEMMELSER, DER GOER INDFOERSEL AF ET PRODUKT,
    SOM I MEDFOER AF TRAKTATENS ARTIKEL 9 OG 10 SKAL HAVE ADGANG TIL FRI BEVAEGELIGHED
    I FORBINDELSE MED EKSPORT, AFHAENGIG AF KOEB ELLER SALG AF DETTE ELLER ET NATIONALT
    PRODUKT
  type: main
- language: it
  script: Latn
  content: Direttiva 66/682/CEE della Commissione, del 7 novembre 1966, relativa alla
    soppressione delle disposizioni legislative, regolamentari ed amministrative che
    subordinano l'importazione di un prodotto, da ammettere in libera circolazione
    ai sensi degli articoli 9 e 10 del Trattato, all'esportazione, all'acquisto o
    alla vendita dello stesso o di altro prodotto di origine nazionale
  type: main
- language: nl
  script: Latn
  content: RICHTLIJN VAN DE COMMISSIE VAN 7 NOVEMBER 1966 HOUDENDE AFSCHAFFING VAN
    WETTELIJKE EN BESTUURSRECHTELIJKE BEPALINGEN WELKE DE INVOER VAN EEN PRODUKT,
    DAT KRACHTENS DE ARTIKELEN 9 EN 10 VAN HET VERDRAG IN HET VRIJE VERKEER MOET WORDEN
    TOEGELATEN, AFHANKELIJK STELLEN VAN DE UITVOER OF VAN DE AAN- OF VERKOOP VAN HETZELFDE
    OF EEN ANDER PRODUKT UIT EIGEN LAND ( 66/682/EEG )
  type: main
