    den Wiederverkauf auf dem Binnenmarkt auf 289 858 Tonnen Getreide aus Beständen
    der spanischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2263/94 af 20. september 1994 om ændring
