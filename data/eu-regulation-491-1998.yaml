  content: COMMISSION REGULATION (EC) No 491/98 of 27 February 1998 determining the
    extent to which import licence applications submitted in February 1998 under the
    tariff quotas for beef provided for by Regulation (EC) No 1926/96 for Estonia,
    Latvia, and Lithuania may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 491/98 DE LA COMMISSION du 27 février 1998 déterminant
