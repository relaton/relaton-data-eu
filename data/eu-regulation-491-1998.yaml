    Einfuhrlizenzen im Rahmen der in der Verordnung (EG) Nr. 1926/96 des Rates für
    Litauen, Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
