    de colheita e armazenagem de sémen, às equipas de colheita e produção de embriões
    e às condições aplicáveis aos animais dadores das espécies equina, ovina
    e caprina e à manipulação de sémen, óvulos e embriões dessas espécies
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 176/2010 al Comisiei din 2 martie 2010 de modificare
    a anexei D la Directiva 92/65/CEE a Consiliului în ceea ce privește centrele
    de colectare și depozitare a materialului seminal, echipele de colectare și
    producție de embrioni, precum și condițiile pentru animalele donatoare din
    speciile ecvidee, ovine și caprine și pentru manipularea materialului seminal,
    a ovulelor și a embrionilor acestor specii
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 176/2010 z 2. marca 2010 , ktorým sa mení
    a dopĺňa príloha D k smernici Rady 92/65/EHS, pokiaľ ide o stanice pre odber
    a skladovanie spermy, tímy pre odber a produkciu embryí, podmienky koní, oviec
    a kôz ako darcov a podmienky manipulácie so spermou, vajíčkami a embryami
    uvedených druhov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 176/2010 z dne 2. marca 2010 o spremembi Priloge
    D k Direktivi Sveta 92/65/EGS glede osemenjevalnih središč za pridobivanje in
    skladiščenje semena, skupin za zbiranje in pridobivanje zarodkov, pogojev za
    kopitarje, ovce in koze kot donorje ter za ravnanje s semenom, jajčnimi celicami
    in zarodki navedenih vrst
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 176/2010 de la Comisión, de 2 de marzo de 2010 , por
