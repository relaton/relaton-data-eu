  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 176/2010 av den 2 mars 2010 om ändring
    av bilaga D till rådets direktiv 92/65/EEG vad gäller seminstationer och spermastationer,
    embryosamlings- och embryoproduktionsgrupper samt villkor för donatordjur i form
