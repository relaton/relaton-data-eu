    sjemena, timova za sakupljanje i proizvodnju zametaka, uvjeta za kopitare, ovce
    i koze kao donatore te za postupanje sa sjemenom, jajnim stanicama i zamecima
  type: main
- language: hu
  script: Latn
  content: A Bizottság 176/2010/EU rendelete ( 2010. március 2.) a 92/65/EGK tanácsi
    irányelv D. mellékletének a spermagyűjtő állomások és spermatároló központok,
    az embriógyűjtő és -előállító munkacsoportok, valamint a ló-, juh- és
    kecskefajokhoz tartozó donor állatokra, és az ezen fajokhoz tartozó spermák,
    petesejtek és embriók kezelésére vonatkozó feltételek tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 176/2010 della Commissione, del 2 marzo 2010 , che
    modifica l’allegato D della direttiva 92/65/CEE del Consiglio per quanto riguarda
    i centri di raccolta e di magazzinaggio dello sperma, i gruppi di raccolta o di
    produzione di embrioni e le condizioni relative agli animali donatori delle specie
    equina, ovina e caprina e al trattamento dello sperma, degli ovuli e degli embrioni
    di tali specie
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 176/2010 ( 2010. gada 2. marts), ar ko groza
    Padomes Direktīvas 92/65/EEK D pielikumu attiecībā uz spermas savākšanas
    un glabāšanas centriem, embriju ieguves brigādēm un sagatavošanas grupām,
    un nosacījumiem attiecībā uz zirgu dzimtas, aitu ģints un kazu ģints donordzīvniekiem
    un uz šo sugu spermas, olšūnu un embriju apstrādi
  type: main
- language: lt
  script: Latn
  content: 2010 m. kovo 2 d. Komisijos reglamentas (ES) Nr. 176/2010, kuriuo iš dalies
    keičiamas Tarybos direktyvos 92/65/EEB D priedas dėl spermos surinkimo ir saugojimo
    centrų, embrionų surinkimo ir gamybos grupių, arklių, avių ir ožkų rūšių
