title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 176/2010 of 2 March 2010 amending Annex D
    to Council Directive 92/65/EEC as regards semen collection and storage centres,
    embryo collection and production teams, and conditions for donor animals of the
    equine, ovine and caprine species and for handling semen, ova and embryos of those
    species
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 176/2010 de la Commission du 2 mars 2010 modifiant
    l’annexe D de la directive 92/65/CEE du Conseil en ce qui concerne les centres
    de collecte et de stockage de sperme, les équipes de collecte et de production
    d’embryons et les conditions applicables aux animaux donneurs des espèces équine,
    ovine et caprine et au maniement des spermes, ovules et embryons de ces espèces
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 176/2010 der Kommission vom 2. März 2010 zur Änderung
    des Anhangs D der Richtlinie 92/65/EWG des Rates bezüglich Besamungsstationen
    und Samendepots, Embryo-Entnahmeeinheiten und Embryo-Erzeugungseinheiten, hinsichtlich
    der Anforderungen an Spenderpferde, Spenderschafe und Spenderziegen sowie der
    Bedingungen für den Umgang mit Sperma, Eizellen und Embryonen der betreffenden
    Tierarten
  type: main
