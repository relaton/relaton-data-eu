    ir embrionų tvarkymo
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 176/2010 tat- 2 ta’ Marzu 2010 li
    jemenda l-Anness D tad-Direttiva tal-Kunsill 92/65/KEE dwar ċentri għall-ġbir
    u l-ħażna tas-semen, gruppi għall-ġbir u l-produzzjoni tal-embrijuni, u l-kundizzjonijiet
    għal annimali donaturi tal-ispeċi ekwini, ovini u kaprini u għall-ġestjoni
    ta’ semen, ova u embrijuni ta’ dawk l-ispeċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 176/2010 van de Commissie van 2 maart 2010 tot wijziging
    van bijlage D bij Richtlijn 92/65/EEG van de Raad wat betreft spermacentra en
    spermaopslagcentra, embryoteams en embryoproductieteams, alsmede de voorschriften
    voor als donor fungerende paardachtigen, schapen en geiten en voor het hanteren
    van sperma, eicellen en embryo’s van die diersoorten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 176/2010 z dnia 2 marca 2010 r. zmieniające
    załącznik D do dyrektywy Rady 92/65/EWG w odniesieniu do centrów pozyskiwania
    i przechowywania nasienia, zespołów pozyskiwania i produkcji zarodków oraz
    warunków dla zwierząt dawców z gatunków koni, owiec i kóz, a także w odniesieniu
    do przetwarzania nasienia, komórek jajowych i zarodków zwierząt tych gatunków
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 176/2010 da Comissão, de 2 de Março de 2010 , que
