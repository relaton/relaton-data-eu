type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/622 of 31 March 2017 amending
    the model certificate for imports of meat preparations in Annex II to Decision
    2000/572/EC and the model certificate for imports of certain meat products, treated
    stomachs, bladders and intestines in Annex III to Decision 2007/777/EC in relation
    to the rules for the prevention, control and eradication of certain transmissible
    spongiform encephalopathies
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/622 de la Commission du 31 mars 2017 modifiant
    le modèle de certificat pour l'importation de préparations de viandes de l'annexe
    II de la décision 2000/572/CE et le modèle de certificat pour l'importation
    de certains produits à base de viande et d'estomacs, vessies et boyaux traités
    de l'annexe III de la décision 2007/777/CE en ce qui concerne les règles pour
    la prévention, le contrôle et l'éradication de certaines encéphalopathies
    spongiformes transmissibles
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/622 der Kommission vom 31. März 2017
    zur Änderung der Musterbescheinigung für die Einfuhr von Fleischzubereitungen
    in Anhang II der Entscheidung 2000/572/EG und der Musterbescheinigung für die
    Einfuhr bestimmter Fleischerzeugnisse und behandelter Mägen, Blasen und Därme
    in Anhang III der Entscheidung 2007/777/EG hinsichtlich der Vorschriften zur Verhütung,
    Kontrolle und Tilgung bestimmter transmissibler spongiformer Enzephalopathien
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/622 на Комисията
    от 31 март 2017 година за изменение на образеца
    на сертификат за внос на месни заготовки в
    приложение II към Решение 2000/572/ЕО и на образеца
    на сертификат за внос на някои месни продукти
    и обработени стомаси, пикочни мехури и черва
    в приложение III към Решение 2007/777/ЕО по отношение
    на правилата за превенция, контрол и ликвидиране
    на някои трансмисивни спонгиформни енцефалопатии
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/622 ze dne 31. března 2017,
    kterým se mění vzorové osvědčení pro dovoz masných polotovarů v příloze
    II rozhodnutí 2000/572/ES a vzor osvědčení pro dovoz některých masných
    výrobků, opracovaných žaludků, močových měchýřů a střev v příloze
    III rozhodnutí 2007/777/ES, pokud jde o pravidla pro prevenci, tlumení a eradikaci
    některých přenosných spongiformních encefalopatií
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/622 af 31. marts 2017
    om ændring af standardcertifikatet til brug ved import af tilberedt kød i bilag
    II til beslutning 2000/572/EF og standardcertifikatet til brug ved import af visse
    kødprodukter, behandlede maver, blærer og tarme i bilag III til beslutning 2007/777/EF
    for så vidt angår reglerne for forebyggelse af, kontrol med og udryddelse af
    visse transmissible spongiforme encephalopatier
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/622 της Επιτροπής,
    της 31ης Μαρτίου 2017, για την τροποποίηση του
    υποδείγματος πιστοποιητικού για τις εισαγωγές
    παρασκευασμάτων κρέατος, στο παράρτημα II της
    απόφασης 2000/572/ΕΚ, και του υποδείγματος πιστοποιητικού
    για τις εισαγωγές ορισμένων προϊόντων με βάση
    το κρέας και επεξεργασμένων στομαχιών, ουροδόχων
    κύστεων και εντέρων, στο παράρτημα III της απόφασης
    2007/777/ΕΚ, όσον αφορά τους κανόνες πρόληψης, καταπολέμησης
    και εκρίζωσης ορισμένων μεταδοτικών σπογγωδών
    εγκεφαλοπαθειών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/622, 31. märts 2017, millega muudetakse
    seoses teatavate transmissiivsete spongioossete entsefalopaatiate vältimise,
    kontrolli ja likvideerimise eeskirjadega otsuse 2000/572/EÜ II lisas esitatud
    lihavalmististe impordi näidissertifikaati ning otsuse 2007/777/EÜ III lisas
    esitatud teatavate lihatoodete ja töödeldud magude, põite ja soolte impordi
    näidissertifikaati
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/622, annettu 31 päivänä
    maaliskuuta 2017, päätöksen 2000/572/EY liitteessä II olevan raakalihavalmisteiden
    tuontia koskevan todistusmallin ja päätöksen 2007/777/EY liitteessä III olevan
    tiettyjen lihavalmisteiden, käsiteltyjen mahojen, rakkojen ja suolten tuontia
    koskevan todistusmallin muuttamisesta siltä osin kuin kyse on tiettyjen tarttuvien
    spongiformisten enkefalopatioiden ehkäisyä, valvontaa ja hävittämistä koskevista
    säännöistä
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/622 оd 31. ožujka 2017. o izmjeni
    obrasca certifikata za uvoz mesnih pripravaka iz Priloga II. Odluci 2000/572/EZ
    i obrasca certifikata za uvoz određenih mesnih proizvoda, obrađenih želudaca,
    mjehura i crijeva iz Priloga III. Odluci 2007/777/EZ s obzirom na pravila za sprečavanje,
    kontrolu i iskorjenjivanje određenih transmisivnih spongiformnih encefalopatija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/622 végrehajtási határozata (2017. március 31.)
    a 2000/572/EK határozat II. mellékletében az előkészített húsok behozatalára
    vonatkozó bizonyítványmintának, valamint a 2007/777/EK határozat III. mellékletében
    a bizonyos húskészítmények, kezelt gyomor, hólyag és belek behozatalára
    vonatkozó bizonyítványmintának az egyes fertőző szivacsos agyvelőbántalmak
    megelőzésére, az ellenük való védekezésre és a felszámolásukra vonatkozó
    szabályok tekintetében való módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/622 della Commissione, del 31 marzo 2017,
    che modifica il modello di certificato per le importazioni di preparazioni di
    carni di cui all'allegato II della decisione 2000/572/CE e il modello di certificato
    per le importazioni di taluni prodotti a base di carne e stomaci, vesciche e intestini
    trattati di cui all'allegato III della decisione 2007/777/CE per quanto riguarda
    le disposizioni per la prevenzione, il controllo e l'eradicazione di alcune encefalopatie
    spongiformi trasmissibili
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/622 (2017. gada 31. marts), ar
    ko saistībā ar noteikumiem dažu transmisīvo sūkļveida encefalopātiju profilaksei,
    kontrolei un apkarošanai groza sertifikāta paraugu gaļas izstrādājumu importam
    Lēmuma 2000/572/EK II pielikumā un sertifikāta paraugu noteiktu gaļas produktu,
    apstrādātu kuņģu, pūšļu un zarnu importam Lēmuma 2007/777/EK III pielikumā
  type: main
- language: lt
  script: Latn
  content: 2017 m. kovo 31 d. Komisijos įgyvendinimo sprendimas (ES) 2017/622, kuriuo
    dėl tam tikrų užkrečiamųjų spongiforminių encefalopatijų prevencijos,
    kontrolės ir likvidavimo taisyklių iš dalies keičiamas Sprendimo 2000/572/EB
    II priede pateiktas mėsos gaminių importo sertifikato pavyzdys ir Sprendimo
    2007/777/EB III priede pateiktas tam tikrų mėsos produktų, apdorotų skrandžių,
    pūslių ir žarnų importo sertifikato pavyzdys
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/622 tal-31 ta'
    Marzu 2017 li temenda l-mudell taċ-ċertifikat għall-importazzjonijiet ta' preparazzjonijiet
    ta' laħam fl-Anness II tad-Deċiżjoni 2000/572/KE u l-mudell taċ-ċertifikat
    għall-importazzjonijiet ta' ċerti prodotti tal-laħam, stonkijiet, bżieżaq
    tal-awrina u msaren ittrattati fl-Anness III tad-Deċiżjoni 2007/777/KE fir-rigward
    tar-regoli għall-prevenzjoni, il-kontroll u l-qerda ta' ċerti enċefalopatiji
    sponġiformi trażmissibbli
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/622 van de Commissie van 31 maart 2017 tot
    wijziging van het modelcertificaat voor de invoer van vleesbereidingen in bijlage
    II bij Beschikking 2000/572/EG en het modelcertificaat voor de invoer van bepaalde
    vleesproducten en behandelde magen, blazen en darmen in bijlage III bij Beschikking
    2007/777/EG wat de voorschriften inzake preventie, bestrijding en uitroeiing van
    bepaalde overdraagbare spongiforme encefalopathieën betreft
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/622 z dnia 31 marca 2017 r. zmieniająca
    wzór świadectwa do celów przywozu surowych wyrobów mięsnych zawarty w załączniku
    II do decyzji 2000/572/WE oraz wzór świadectwa do celów przywozu niektórych
    produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit zawarty
    w załączniku III do decyzji 2007/777/WE w odniesieniu do zasad zapobiegania
    niektórym pasażowalnym gąbczastym encefalopatiom oraz ich kontroli i zwalczania
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/622 da Comissão, de 31 de março de 2017,
    que altera o modelo de certificado para as importações de preparados de carne,
    no anexo II da Decisão 2000/572/CE, e o modelo de certificado para as importações
    de determinados produtos à base de carne, estômagos, bexigas e intestinos tratados,
    no anexo III da Decisão 2007/777/CE, no que se refere às regras para a prevenção,
    o controlo e a erradicação de determinadas encefalopatias espongiformes transmissíveis
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/622 a Comisiei din 31 martie 2017
    de modificare a modelului de certificat pentru importurile de preparate din carne
    care figurează în anexa II la Decizia 2000/572/CE și a modelului de certificat
    pentru importurile de anumite produse din carne, de stomacuri, vezici și intestine
    tratate care figurează în anexa III la Decizia 2007/777/CE în ceea ce privește
    normele pentru prevenirea, controlul și eradicarea anumitor forme de encefalopatie
    spongiformă transmisibilă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/622, z 31. marca 2017, ktorým
    sa mení vzor osvedčenia na dovoz mäsových prípravkov v prílohe II k rozhodnutiu
    2000/572/ES a vzor certifikátu na dovoz určitých mäsových výrobkov, opracovaných
    žalúdkov, mechúrov a čriev v prílohe III k rozhodnutiu 2007/777/ES, pokiaľ
    ide o pravidlá prevencie, kontroly a eradikácie niektorých prenosných spongiformných
    encefalopatií
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije 2017/622 z dne 31. marca 2017 o spremembi vzorca
    spričevala za uvoz mesnih pripravkov iz Priloge II k Odločbi 2000/572/ES in
    vzorca spričevala za uvoz nekaterih mesnih izdelkov ter obdelanih želodcev,
    mehurjev in črev iz Priloge III k Odločbi 2007/777/ES v zvezi s pravili za preprečevanje,
    nadzor in izkoreninjenje nekaterih transmisivnih spongiformnih encefalopatij
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/622 de la Comisión, de 31 de marzo de
    2017, por la que se modifican el modelo de certificado para las importaciones
    de preparados de carne del anexo II de la Decisión 2000/572/CE y el modelo de
    certificado para las importaciones de determinados productos cárnicos y de estómagos,
    vejigas e intestinos tratados del anexo III de la Decisión 2007/777/CE en lo
    referente a las normas destinadas a la prevención, el control y la erradicación
    de determinadas encefalopatías espongiformes transmisibles
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/622 av den 31 mars 2017 om
    ändring av förlagan till intyg för import av köttberedningar i bilaga II till
    beslut 2000/572/EG och förlagan till intyg för import av vissa köttprodukter,
    behandlade magar, blåsor och tarmar i bilaga III till beslut 2007/777/EG vad
    gäller bestämmelserna för förebyggande, kontroll och utrotning av vissa typer
    av transmissibel spongiform encefalopati
  type: main
