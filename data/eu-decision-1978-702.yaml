---
id: EUDecision1978702
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 July 1978 authorizing the French Republic not
    to apply Community treatment to tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china or of other kinds
    of pottery, falling within heading No 69.11 and subheadings 69.12 C and D of the
    Common Customs Tariff, originating in Japan and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '78/702/CEE: Décision de la Commission, du 24 juillet 1978, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine, en faïence ou en autres
    matières céramiques de la position 69.11 et des sous-positions 69.12 C et D
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Juli 1978, mit der die Französische
    Republik ermächtigt wird, aus Japan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan oder aus anderen keramischen Stoffen, der Tarifnummern 69.11 und
    69.12 C und D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 24. juli 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage bordservice samt husholdnings-
    og toiletartikler, af porcelæn eller af andet keramisk materiale, som henhører
    under pos. 69.11 og 69.12 C og D i den fælles toldtarif, har oprindelse i Japan
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 luglio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario vasellame e oggetti di uso domestico
    o da toletta, di porcellana o di altre materie ceramiche della voce 69.11 e delle
    sottovoce 69.12 C e D della tariffa doganale comune, originari del Giappone e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 juli 1978 waarbij de Franse Republiek
    wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen, van porselein
    of van andere keramische stoffen, van de posten 69.11 en 69.12 C en D van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
