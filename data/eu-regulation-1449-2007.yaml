    la fécula de mandioca, los cereales, el arroz, el azúcar y el aceite de oliva
    y por el que se establecen excepciones a los Reglamentos (CE) n° 1445/95, (CE)
    n° 1518/2003, (CE) n° 596/2004 y (CE) n° 633/2004 en lo que respecta a las
    fechas de expedición de los certificados de exportación en 2008 en los sectores
    de la carne de vacuno, de porcino, de los huevos y de la carne de aves de corral
