    n° 2058/96, (CE) n° 2375/2002, (CE) n° 2305/2003, (CE) n° 950/2006, (CE) n°
    955/2005, (CE) n° 969/2006, (CE) n° 1100/2006, (CE) n° 1918/2006, (CE) n°
    1964/2006, (CE) n° 1002/2007 y (CE) n° 508/2007 en lo que respecta a las fechas
    de presentación de solicitudes y de expedición de certificados de importación
