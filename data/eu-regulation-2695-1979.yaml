title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2695/79 of 29 November 1979 re-establishing
    the levying of customs duties on embroidery , in the piece, in strips or in motifs,
    falling within heading No 58.10 and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2695/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux broderies
    en pièces, en bandes ou en motifs, de la position 58.10 du tarif douanier commun,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2695/79 DER KOMMISSION VOM 29. NOVEMBER 1979 UEBER
    DIE WIEDEREINFUEHRUNG DES ZOLLSATZES FUER STICKEREIEN ALS METERWARE ODER ALS MOTIV
    DER TARIFNUMMER 58.10 MIT URSPRUNG IN INDIEN, DEM DIE IN DER VERORDNUNG ( EWG
    ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2695/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for broderier, i løbende længler, strimler eller
    motiver under position 58.10, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2695/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI RICAMI IN PEZZA,
    IN STRISCE O IN MOTIVI, DELLA VOCE DOGANALE 58.10, ORIGINARI DELL' INDIA BENEFICIARIA
    DELLE PREFERENZE TARIFFARIE PREVISTE DAL REGOLAMENTO ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2695/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op borduurwerk,
    aan het stuk, in banden of in de vorm van motieven, van post 58.10 van oorsprong
    uit India waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    ( EEG ) nr. 1195/79 van de Raad
  type: main
