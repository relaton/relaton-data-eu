title:
- language: en
  script: Latn
  content: '96/183/EC: Commission Decision of 21 February 1996 amending Decision 94/14/EC
    setting up the list of establishments in the Community for which are granted temporary
    and limited derogation from specific Community health rules on the production
    and marketing of fresh meat'
  type: main
- language: fr
  script: Latn
  content: '96/183/CE: Décision de la Commission, du 21 février 1996, modifiant
    la décision 94/14/CE de la Commission arrêtant la liste des établissements
    de la Communauté auxquels est accordée une dérogation temporaire et limitée
    aux règles communautaires sanitaires spécifiques pour la production et la commercialisation
    de viandes fraîches'
  type: main
- language: de
  script: Latn
  content: '96/183/EG: Entscheidung der Kommission vom 21. Februar 1996 zur Änderung
    des mit der Entscheidung 94/14/EG festgelegten Verzeichnisses der Betriebe in
    der Gemeinschaft, denen zeitlich und inhaltlich begrenzte Ausnahmen von den besonderen
    Hygienevorschriften der Gemeinschaft für die Herstellung und das Inverkehrbringen
    von frischem Fleisch gewährt werden'
  type: main
- language: da
  script: Latn
  content: '96/183/EF: Kommissionens beslutning af 21. februar 1996 om ændring af
    Kommissionens beslutning 94/14/EF om opstilling af en fortegnelse over virksomheder
    i Fællesskabet, som indrømmes midlertidig, begrænset undtagelse fra de særlige
    EF-sundhedsbestemmelser for produktion og markedsføring af fersk kød'
  type: main
- language: el
  script: Grek
  content: '96/183/ΕΚ: Απόφαση της Επιτροπής, της 21ης Φεβρουαρίου
    1996, για την τροποποίηση της απόφασης 94/14/ΕΚ
    της Επιτροπής για τον κατάλογο των κοινοτικών
    επιχειρήσεων στις οποίες επιτρέπεται προσωρινή
    και περιορισμένη παρέκκλιση από ορισμένους
    ειδικούς κοινοτικούς υγειονομικούς κανόνες
    σχετικά με την παραγωγή και την εμπορία νωπού
    κρέατος'
  type: main
- language: fi
  script: Latn
  content: '96/183/EY: Komission päätös, tehty 21 päivänä helmikuuta 1996, niiden
    yhteisön laitosten luettelosta, joille on myönnetty väliaikainen ja rajoitettu
    poikkeus tuoreen lihan tuotantoa ja kaupan pitämistä koskevista yhteisön erityisistä
    terveysmääräyksistä tehdyn päätöksen 94/14/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/183/CE: Decisione della Commissione, del 21 febbraio 1996, che modifica
    la decisione 94/14/CE che stabilisce l''elenco degli stabilimenti della Comunità
    in cui sono concesse deroghe temporanee e limitate alle norme sanitarie specifiche
    della Comunità in materia di produzione e immissione sul mercato di carni fresche'
  type: main
- language: nl
  script: Latn
  content: '96/183/EG: Beschikking van de Commissie van 21 februari 1996 houdende
    wijziging van Beschikking 94/14/EG tot vaststelling van de lijst van inrichtingen
    in de Gemeenschap waarvoor tijdelijke en beperkte afwijkingen van de specifieke
    communautaire gezondheidsvoorschriften voor de produktie en het in de handel brengen
    van vers vlees worden toegestaan'
  type: main
- language: pt
  script: Latn
  content: '96/183/CE: Decisão da Comissão, de 21 de Fevereiro de 1996, que altera
