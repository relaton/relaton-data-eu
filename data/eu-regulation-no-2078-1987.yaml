    à certains montants compensatoires monétaires fixés à l'avance dans le secteur
    des céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2078/87 der Kommission vom 15. Juli 1987 zur Änderung
