id: EURegulation15381999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1538/1999 of 13 July 1999 derogating from
    Regulation (EEC) No 2454/93 in respect of the definition of the concept of originating
    products used for the purposes of the scheme of generalised preferences to take
    account of the special situation of Cambodia regarding certain exports of textiles
    to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1538/1999 de la Commission, du 13 juillet 1999, portant
    dérogation au règlement (CEE) n° 2454/93 en ce qui concerne la définition
    de la notion de «produits originaires» établie dans le cadre du schéma de
    préférences tarifaires généralisées pour tenir compte de la situation particulière
    du Cambodge en ce qui concerne certains produits textiles exportés de ce pays
    vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1538/1999 der Kommission vom 13. Juli 1999 über eine
    Abweichung von der Bestimmung des Begriffs "Ursprungserzeugnisse" in der Verordnung
    (EWG) Nr. 2454/93 im Rahmen des Allgemeinen Präferenzsystems zur Berücksichtigung
    der besonderen Lage Kambodschas bei bestimmten in die Gemeinschaft ausgeführten
    Textilwaren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1538/1999 af 13. juli 1999 om en undtagelse
    fra forordning (EØF) nr. 2454/93, hvad angår definitionen af begrebet "varer
    med oprindelsesstatus" i henhold til den generelle præferenceordning for at tage
    hensyn til den særlige situation i Cambodja for visse tekstilvarer, der udføres
    fra dette land til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1538/1999 της Επιτροπής,
    της 13ης Ιουλίου 1999, σχετικά με την παρέκκλιση
    από τον κανονισμό (ΕΟΚ) αριθ. 2454/93 όσον αφορά
    την έννοια των «προϊόντων καταγωγής» που ορίζεται
    στο πλαίσιο του συστήματος γενικευμένων δασμολογικών
    προτιμήσεων, προκειμένου να ληφθεί υπόψη η
    ιδιαίτερη κατάσταση της Καμπότζης όσον αφορά
    ορισμένα κλωστοϋφαντουργικά προϊόντα που
    εξάγονται από τη χώρα αυτή προς την Κοινότητα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1538/1999, annettu 13 päivänä heinäkuuta
    1999, asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
    "alkuperätuotteiden" käsitteen määritelmästä poikkeamisesta Kambodzan erityistilanteen
    huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien tekstiilituotteiden
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1538/1999 della Commissione, del 13 luglio 1999, recante
    deroga al regolamento (CEE) n. 2454/93 per quanto riguarda la definizione della
    nozione di «prodotti originari" stabilita nell'ambito dello schema di preferenze
    tariffarie generalizzate per tener conto della particolare situazione della Cambogia
    per quanto concerne alcuni prodotti tessili esportati da tale paese nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1538/1999 van de Commissie van 13 juli 1999 houdende
    afwijking van de in Verordening (EEG) nr. 2454/93 opgenomen definitie van het
    begrip "producten van oorsprong" in het kader van het stelsel van algemene tariefpreferenties
    in verband met de bijzondere situatie van Cambodja wat de uitvoer van bepaalde
    textielproducten naar de Gemeenschap betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1538/1999 da Comissão, de 13 de Julho de 1999, que
    derroga o Regulamento (CEE) n° 2454/93 no que se refere à definição da noção
    de «produtos originários» estabelecida no âmbito do sistema de preferências
    pautais generalizadas, a fim de ter em conta a situação específica do Camboja
    no que respeita a determinados produtos têxteis exportados deste país para a
    Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1538/1999 de la Comisión, de 13 de julio de 1999,
    por el que se establece una excepción al Reglamento (CEE) n° 2454/93 en lo relativo
    a la definición del concepto de «productos originarios» establecido con arreglo
    al plan de preferencias arancelarias generalizadas a fin de tener en cuenta la
    situación particular de Camboya por lo que se refiere a determinados productos
    textiles exportados de este país a la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1538/1999 av den 13 juli 1999 om undantag
    från förordning (EEG) nr 2454/93 med avseende på definitionen av begreppet
    "ursprungsvaror" som fastställs inom ramen för systemet för allmän förmånsbehandling
    för att ta hänsyn till Kambodjas särskilda situation när det gäller vissa
    textilprodukter som exporteras från detta land till gemenskapen
  type: main
