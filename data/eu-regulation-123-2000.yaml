title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 123/2000 of 20 January 2000 imposing a provisional
    countervailing duty on imports of polyester staple fibres (PSF) originating in
    Australia and Taiwan and terminating the anti-subsidy proceeding concerning imports
    of PSF originating in the Republic of Korea and Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 123/2000 de la Commission, du 20 janvier 2000, instituant
    un droit compensateur provisoire sur les importations de fibres discontinues de
    polyesters originaires d'Australie et de Taïwan et clôturant la procédure antisubventions
    concernant les importations de ces produits originaires de la République de Corée
    et de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 123/2000 der Kommission vom 20. Januar 2000 zur Einführung
    eines vorläufigen Ausgleichszolls auf die Einfuhren von Polyesterspinnfasern
    (PSF) mit Ursprung in Australien und Taiwan und zur Einstellung des Antisubventionsverfahrens
    betreffend die Einfuhren von PSF mit Ursprung in der Republik Korea und Thailand
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 123/2000 af 20. januar 2000 om indførelse
    af en midlertidig udligningstold på importen af korte syntetiske fibre af polyestere
    med oprindelse i Australien og Taiwan og om afslutning af antisubsidieproceduren
    vedrørende importen af syntetiske fibre af polyestere med oprindelse i Republikken
    Korea og Thailand
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 123/2000 της Επιτροπής,
    της 20ής Ιανουαρίου 2000, για επιβολή προσωρινού
    αντισταθμιστικού δασμού στις εισαγωγές μη
    συνεχών ινών από πολυεστέρες καταγωγής Αυστραλίας
    και Ταϊβάν και για περάτωση της διαδικασίας
    αντεπιδοτήσεων όσον αφορά τις εισαγωγές μη
    συνεχών ινών καταγωγής Δημοκρατίας της Κορέας
    και Ταϊλάνδης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 123/2000, annettu 20 päivänä tammikuuta 2000,
    väliaikaisen tasoitustullin käyttöönotosta Australiasta ja Taiwanista peräisin
    olevien polyesterikatkokuitujen tuonnissa ja tukien vastaisen menettelyn päättämisestä
    Korean tasavallasta ja Thaimaasta peräisin olevan polyesterikatkokuitujen tuonnin
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 123/2000 della Commissione, del 20 gennaio 2000, che
    istituisce un dazio compensativo provvisorio sulle importazioni di fibre di poliesteri
    in fiocco (FPF) originarie dell'Australia e di Taiwan e chiude il procedimento
    antisovvenzioni relativo alle importazioni di FPF originarie della Repubblica
    di Corea e della Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 123/2000 van de Commissie van 20 januari 2000 tot
    instelling van een voorlopig compenserend recht op de invoer van polyester stapelvezels
    (PSV) uit Australië en Taiwan en tot beëindiging van de antisubsidieprocedure
    betreffende de invoer van PSV uit de Republiek Korea en Thailand
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 123/2000 da Comissão, de 20 de Janeiro de 2000, que
    cria um direito de compensação provisório sobre as importações de fibras
    descontínuas de poliésteres (FDP) originárias da Austrália e de Taiwan e que
    encerra o processo anti-subvenções relativo às importações de FDP originárias
    da República da Coreia e da Tailândia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 123/2000 de la Comisión, de 20 de enero de 2000, por
