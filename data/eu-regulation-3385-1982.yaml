    Farbfernsehempfangsgeräten und Kathodenstrahlröhren mit Ursprung in Japan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3385/82 af 9. december 1982 om forlængelse
