title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 229/96 of 7 February 1996 amending Regulation
    (EC) No 1222/94 laying down common detailed rules for the application of the system
    of granting export refunds on certain agricultural products exported in the form
    of goods not covered by Annex II to the Treaty, and the criteria for fixing the
    amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 229/96 de la Commission, du 7 février 1996, modifiant
    le règlement (CE) n° 1222/94 établissant, pour certains produits agricoles
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité,
    les modalités communes d'application du régime d'octroi des restitutions à
    l'exportation et des critères de fixation de leurs montants
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 229/96 der Kommission vom 7. Februar 1996 zur Änderung
    der Verordnung (EG) Nr. 1222/94 zur Festlegung der gemeinsamen Durchführungsvorschriften
    für die Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung
    des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse, die in
    Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 229/96 af 7. februar 1996 om ændring
    af forordning (EF) nr. 1222/94 om fastsættelse af fælles gennemførelsesregler
    for ordningen for ydelse af eksportrestitutioner og om fastlæggelse af kriterierne
    for fastsættelse af restitutionsbeløbet for visse landbrugsprodukter, der udføres
    i form af varer, som ikke er opført i traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 229/96 της Επιτροπής,
    της 7ης Φεβρουαρίου 1996, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1222/94 περί θεσπίσεως κοινών
    ρυθμίσεων εφαρμογής του καθεστώτος επιστροφών
    κατά την εξαγωγή και των κριτηρίων καθορισμού
    του ύψους των, για ορισμένα γεωργικά προϊόντα
    που εξάγονται υπό μορφή εμπορευμάτων μη υπαγομένων
    στο παράρτημα ΙΙ της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 229/96, annettu 7 päivänä helmikuuta 1996,
    tiettyjen perustamissopimuksen liitteeseen II kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1222/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 229/96 della Commissione, del 7 febbraio 1996, che
    modifica il regolamento (CE) n. 1222/94 che stabilisce, per taluni prodotti agricoli
    esportati sotto forma di merci non comprese nell'allegato II del trattato, le
    modalità comuni di applicazione relative alla concessione delle restituzioni
    all'esportazione e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 229/96 van de Commissie van 7 februari 1996 houdende
    wijziging van Verordening (EG) nr. 1222/94 tot vaststelling van de gemeenschappelijke
    uitvoeringsbepalingen voor de regeling aangaande de toekenning van restituties
    bij uitvoer en de criteria voor de vaststelling van het restitutiebedrag betreffende
    bepaalde landbouwprodukten, uitgevoerd in de vorm van goederen die niet onder
    bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 229/96 da Comissão, de 7 de Fevereiro de 1996, que
    altera o Regulamento (CE) nº 1222/94, que estabelece, para certos produtos agrícolas
    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as normas comuns de aplicação do regime de concessão de restituições à exportação
    e os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 229/96 de la Comisión, de 7 de febrero de 1996, que
    modifica el Reglamento (CE) nº 1222/94 por el que se establecen, para determinados
    productos agrícolas exportados en forma de mercancías no incluidas en el Anexo
    II del Tratado, las disposiciones comunes de aplicación del régimen de concesión
    de las restituciones a la exportación y los criterios para la fijación de su
    importe
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 229/96 av den 7 februari 1996 om ändring
