    dat het verslag nauwkeurige gegevens bevat ten behoeve van de meting van de broeikasgasemissies
    gerelateerd aan de teelt van tarwe, maïs, zonnebloemen, sojabonen en koolzaad
    in Hongarije
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/18 z dnia 9 stycznia 2025 r. w sprawie
    uznania, na podstawie art. 31 ust. 2 i 4 dyrektywy (UE) 2018/2001, że sprawozdanie
    zawiera dokładne dane do celów pomiaru emisji gazów cieplarnianych związanych
    z uprawą pszenicy, kukurydzy, słonecznika, soi i rzepaku na Węgrzech
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/18 da Comissão, de 9 de janeiro de 2025,
