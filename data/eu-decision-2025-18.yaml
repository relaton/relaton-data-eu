    elismeréséről, hogy a jelentés pontos adatokat tartalmaz a Magyarországon
    történő búza-, kukorica-, napraforgó-, szója- és repcetermesztésből származó
    üvegházhatásúgáz-kibocsátás mértékének meghatározására
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/18 della Commissione, del 9 gennaio 2025,
    che riconosce, a norma dell’articolo 31, paragrafi 2 e 4, della direttiva (UE)
    2018/2001, che la relazione contiene dati accurati ai fini della misurazione delle
    emissioni di gas a effetto serra associate alla coltivazione di frumento, granturco,
    girasole, soia e colza in Ungheria
  type: main
- language: lv
  script: Latn
