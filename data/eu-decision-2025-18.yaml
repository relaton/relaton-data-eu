    přesné údaje pro účely měření emisí skleníkových plynů spojených
    s pěstováním pšenice, kukuřice, slunečnice, sóji a řepky olejky v Maďarsku
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/18 af 9. januar 2025
    om anerkendelse i henhold til artikel 31, stk. 2 og 4, i direktiv (EU) 2018/2001
