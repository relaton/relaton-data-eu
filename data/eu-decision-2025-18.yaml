    obsahuje presné údaje na účely merania emisií skleníkových plynov spojených
    s pestovaním pšenice, kukurice, slnečnice, sóje a repky olejnej v Maďarsku
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/18 z dne 9. januarja 2025 o potrditvi
