    que o relatório contém dados precisos para efeitos da medição das emissões
    de gases com efeito de estufa associadas ao cultivo de trigo, milho, girassol,
    soja e colza na Hungria
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/18 a Comisiei din 9 ianuarie 2025
    de recunoaștere, în temeiul articolului 31 alineatele (2) și (4) din Directiva
    (UE) 2018/2001, a faptului că raportul conține date exacte în scopul măsurării
    emisiilor de gaze cu efect de seră asociate cultivării de grâu, porumb, floarea
    soarelui, soia și rapiță în Ungaria
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/18 z 9. januára 2025, ktorým
