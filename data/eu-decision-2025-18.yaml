title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/18 of 9 January 2025 recognising
    under Article 31(2) and (4) of Directive (EU) 2018/2001 that the report contains
    accurate data for the purposes of measuring the greenhouse gas emissions associated
    with the cultivation of wheat, maize, sunflower, soybean and rapeseed in Hungary
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/18 de la Commission du 9 janvier 2025
    reconnaissant, conformément à l’article 31, paragraphes 2 et 4, de la directive
    (UE) 2018/2001, que le rapport contient des données précises aux fins de la
    mesure des émissions de gaz à effet de serre associées à la culture du blé,
    du maïs, du tournesol, du soja et du colza en Hongrie
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/18 der Kommission vom 9. Januar 2025
    zur Anerkennung gemäß Artikel 31 Absätze 2 und 4 der Richtlinie (EU) 2018/2001,
    dass der Bericht genaue Daten für die Messung der auf den Anbau von Weizen, Mais,
    Sonnenblumen, Sojabohnen und Raps in Ungarn zurückgehenden Treibhausgasemissionen
    enthält
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/18 на Комисията
