title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3308/90 of 15 November 1990 imposing a definitive
    anti-dumping duty on imports of woven polyolefin sacks originating in the People's
    Republic of China and definitively collecting the provisional anti-dumping duty
    on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3308/90 du Conseil du 15 novembre 1990 instituant
    un droit antidumping définitif sur les importations de sacs tissés en polyoléfine
    originaires de la République populaire de Chine et portant perception définitive
    du droit antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3308/90 des Rates vom 15. November 1990 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von gewebten Säcken aus
    Polyolefin mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmen
    des vorläufigen Antidumpingzolls auf diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (ØEF) nr. 3308/90 af 15. november 1990 om indfoerelse
    af en endelig antidumpingtold paa importen af vaevede polyolefinsaekke med oprindelse
    i Den Kinesiske Folkerepublik og om endelig opkraevning af den midlertidige antidumpingtold
    paa denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3308/90 του Συμβουλίου
    της 15ης Νοεμβρίου 1990 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές υφασμένων
    σάκων από πολυολεφίνες, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, και για την οριστική είσπραξη του
    οριστικού δασμού αντιντάμπινγκ που έχει επιβληθεί
    στις εισαγωγές αυτές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3308/90, annettu 15 päivänä marraskuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevien kudottujen polyolefiinisäkkien tuonnissa ja tässä tuonnissa
    käyttöön otetun väliaikaisen polkumyyntitullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3308/90 del Consiglio del 15 novembre 1990 che istituisce
    un dazio antidumping definitivo sulle importazioni di sacchi di tessuti poli olefinici
    originari della Repubblica popolare cinese e che decide la riscossione definitiva
    del dazio antidumping provvisorio istituito su tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3308/90 van de Raad van 15 november 1990 houdende
    instelling van een definitief anti- dumpingrecht op de invoer van geweven zakken
    van polyolefin van oorsprong uit de Volksrepubliek China en houdende definitieve
    inning van het op deze invoer ingestelde voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n 3308/90 do Conselho de 15 de Novembro de 1990 que institui
    um direito anti-dumping definitivo sobre as importações de sacos tecidos de
    poliolefina originários da Republica Popular da China e que estabelece a cobrança
    definitiva do direito anti-dumping provisório instituído sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3308/90 del Consejo de 15 de noviembre de 1990 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    sacos tejidos de poliolefina originarios de la República Popular de China y por
    el que se percibe definitivamente el derecho antidumping provisional establecido
    sobre dichas importaciones
  type: main
- language: sv
