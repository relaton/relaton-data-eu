    und 70/457/EWG über den Verkehr mit Betarübensaatgut, mit Futterpflanzensaatgut,
    mit Getreidesaatgut, mit vegetativem Vermehrungsgut von Reben, mit Saatgut von
    Öl- und Faserpflanzen, mit Gemüsesaatgut und über einen gemeinsamen Sortenkatalog
    für landwirtschaftliche Pflanzenarten
  type: main
