    par biešu sēklu, lopbarības augu sēklu, labības sēklu, vīnogulāju veģetatīvās
    pavairošanas materiāla, eļļas augu un šķiedraugu sēklu, dārzeņu sēklu
    realizāciju un par kopējo lauksaimniecības augu šķirņu katalogu
  type: main
- language: lt
