  content: Règlement (CEE) n° 875/72 de la Commission, du 27 avril 1972, abrogeant
    les règlements (CEE) n° 315/72 et (CEE) n 721/72 portant application du droit
    du tarif douanier commun aux importations de certaines variétés d'oranges douces
    originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 875/72 der Kommission vom 27. April 1972 zur Aufhebung
    der Verordnungen (EWG) Nr. 315/72 und (EWG) Nr. 721/72 zur Anwendung des Gemeinsamen
    Zolltarifs auf Einfuhren bestimmter Orangensorten aus Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 875/72 della Commissione, del 27 aprile 1972, che
    abroga i regolamenti (CEE) n. 315/72 e (CEE) n. 721/72 relativi all'applicazione
    del dazio della tariffa doganale comune alle importazioni di alcune varietà di
    arance dolci originarie della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 875/72 van de Commissie van 27 april 1972 tot intrekking
    van de Verordeningen (EEG) nr. 315/72 en (EEG) nr. 721/72 houdende toepassing
    van het recht van het gemeenschappelijk douanetarief op de invoer van bepaalde
    variëteiten zoete sinaasappelen van oorsprong uit Spanje
