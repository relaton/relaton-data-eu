    (PET) plėvelei
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 13/2012 tas- 6 ta’
    Jannar 2012 li jemenda r-Regolament (KE) Nru 1292/2007 li jimponi dazju anti-dumping
    definittiv fuq importazzjonijiet ta’ tertuqa tat-tereftalat tal-polietilene
    (PET) li joriġinaw fl-Indja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 13/2012 van de Raad van 6 januari 2012
    tot wijziging van Verordening (EG) nr. 1292/2007 tot instelling van een definitief
    antidumpingrecht op polyethyleentereftalaatfolie (petfolie) van oorsprong uit
    India
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 13/2012 z dnia 6 stycznia 2012
    r. zmieniające rozporządzenie (WE) nr 1292/2007 nakładające ostateczne cło
    antydumpingowe na przywóz folii z politereftalanu etylenu (PET) pochodzącej
    z Indii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 13/2012 do Conselho, de 6 de janeiro
    de 2012 , que altera o Regulamento (CE) n. ° 1292/2007 que institui um direito
    antidumping definitivo sobre as importações de películas de poli(tereftalato
    de etileno) originárias da Índia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 13/2012 al Consiliului din
    6 ianuarie 2012 de modificare a Regulamentului (CE) nr. 1292/2007 privind instituirea
    unei taxe antidumping definitive la importurile de folii din polietilen tereftalat
    (PET) originare din India
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 13/2012 zo 6. januára 2012 , ktorým
    sa mení a dopĺňa nariadenie (ES) č. 1292/2007, ktorým sa ukladá konečné
    antidumpingové clo na dovoz poly-etyléntereftalátového (PET) filmu s pôvodom
    v Indii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 13/2012 z dne 6. januarja 2012 o spremembi
    Uredbe (ES) št. 1292/2007 o uvedbi dokončne protidampinške dajatve na uvoz
    folije iz polietilen tereftalata (PET) s poreklom iz Indije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 13/2012 del Consejo, de 6 de enero de
    2012 , que modifica el Reglamento (CE) n ° 1292/2007, por el que se impone un
    derecho antidumping definitivo a las importaciones de películas de tereftalato
