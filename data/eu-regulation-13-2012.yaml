    polietilenterftalatskih (PET) folija podrijetlom iz Indije
  type: main
- language: hu
  script: Latn
  content: A Tanács 13/2012/EU végrhajtási rendelete ( 2012. január 6. ) az Indiából
    származó polietilén-tereftalát (PET-) fólia behozatalára vonatkozó végleges
    dömpingellenes vám kivetéséről szóló 1292/2007/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 13/2012 del Consiglio, del 6 gennaio
    2012 , che modifica il regolamento (CE) n. 1292/2007 che istituisce un dazio antidumping
    definitivo sulle importazioni di fogli di polietilene tereftalato (PET) originari
    dell’India
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 13/2012 ( 2012. gada 6. janvāris
