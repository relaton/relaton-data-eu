title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 13/2012 of 6 January 2012 amending
    Regulation (EC) No 1292/2007 imposing a definitive anti-dumping duty on imports
    of polyethylene terephthalate (PET) film originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 13/2012 du Conseil du 6 janvier 2012
    modifiant le règlement (CE) n ° 1292/2007 instituant un droit antidumping définitif
    sur les importations de feuilles en polyéthylène téréphtalate (PET) originaires
    de l’Inde
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 13/2012 des Rates vom 6. Januar 2012
    zur Änderung der Verordnung (EG) Nr. 1292/2007 zur Einführung eines endgültigen
    Antidumpingzolls auf Einfuhren von Folien aus Polyethylenterephthalat mit Ursprung
    in Indien
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 13/2012 на Съвета
    от 6 януари 2012 година за изменение на Регламент
    (ЕО) № 1292/2007 за налагане на окончателно антидъмпингово
    мито върху вноса на фолио от полиетилен терефталат
    (ПЕТ) с произход от Индия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 13/2012 ze dne 6. ledna 2012 o změně
    nařízení (ES) č. 1292/2007, kterým se ukládá konečné antidumpingové
    clo na dovoz polyethylentereftalátového (PET) filmu pocházejícího z Indie
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 13/2012 af 6. januar 2012 om
    ændring af Rådets forordning (EF) nr. 1292/2007 om indførelse af en endelig
    antidumpingtold på importen af polyethylenterephthalatfolie (PET-folie) med oprindelse
    i Indien
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 13/2012
    του Συμβουλίου, της 6ης Ιανουαρίου 2012 , για την
    τροποποίηση του κανονισμού (ΕΚ) αριθ. 1292/2007
    για την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές ταινιών τερεφθαλικού πολυαιθυλενίου
    (PET) προέλευσης Ινδίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 13/2012, 6. jaanuar 2012 , millega muudetakse
    määrust (EÜ) nr 1292/2007, millega kehtestatakse Indiast pärit polüetüleentereftalaatkile
    impordi suhtes lõplik dumpinguvastane tollimaks
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 13/2012, annettu 6 päivänä
    tammikuuta 2012 , lopullisen polkumyyntitullin käyttöönotosta Intiasta peräisin
    olevan polyeteenitereftalaattikalvon tuonnissa annetun asetuksen (EY) N:o 1292/2007
    muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 13/2012 od 6. siječnja 2012. o izmjeni
