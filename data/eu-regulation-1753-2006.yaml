  content: Regolamento (CE) n. 1753/2006 della Commissione, del 28 novembre 2006 ,
    recante modifica del regolamento (CE) n. 669/97 del Consiglio che reca apertura
    e modalità di gestione di contingenti tariffari comunitari per taluni pesci e
    prodotti della pesca originari delle isole Færøer e che definisce le modalità
    di rettifica e di adattamento di tali misure, nonché che abroga il regolamento
    (CE) n. 1983/95
  type: main
- language: lv
