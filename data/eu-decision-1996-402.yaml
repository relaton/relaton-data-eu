    das Abweichungen von den Artikeln 2 und 3 der Richtlinie 77/388/EWG des Rates
    zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    enthält'
  type: main
- language: da
  script: Latn
