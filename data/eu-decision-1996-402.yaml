title:
- language: en
  script: Latn
  content: '96/402/EC: Council Decision of 25 June 1996 authorizing the Federal Republic
    of Germany to conclude an agreement with the Republic of Poland containing measures
    derogating from Articles 2 and 3 of Council Directive 77/388/EEC on the harmonization
    of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '96/402/CE: Décision du Conseil du 25 juin 1996 autorisant la République
