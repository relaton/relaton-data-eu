  content: Commission Regulation (EEC) No 3833/89 of 20 December 1989 amending Regulation
    (EEC) No 1951/89 fixing for the 1989/90 marketing year the minimum price to be
    paid to producers for peaches and the amount of production aid for peaches in
    syrup and/or in natural fruit juice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3833/89 de la Commission du 20 décembre 1989 modifiant
    le règlement (CEE) n° 1951/89 fixant pour la campagne 1989/1990 le prix minimal
    à payer aux producteurs pour les pêches ainsi que le montant de l'aide à la
    production pour les pêches conservées au sirop et/ou au jus naturel de fruits,
    et fixant un ajustement monétaire en matière d'aide à la production
  type: main
- language: de
  script: Latn
