    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/688/CEE: Décision de la Commission, du 27 septembre 1982, constatant
    que l''importation de l''appareil dénommé "Tropel - Single-Frequency He Ne Laser,
    model 100" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
