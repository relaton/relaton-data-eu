title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 490/1999 of 5 March 1999 amending Regulation
    (EC) No 180/1999 determining the extent to which applications lodged in January
    1999 for import licences under the regime provided for by tariff quotas for certain
    products in the pigmeat sector for the period 1 January to 31 March 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 490/1999 de la Commission du 5 mars 1999 modifiant
    le règlement (CE) n° 180/1999 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en janvier 1999 peuvent être acceptées
    dans le cadre des contingents tarifaires d'importation pour certains produits
    dans le secteur de la viande de porc pour la période du 1er janvier au 31 mars
    1999
  type: main
- language: de
  script: Latn
