    Januar 1999 gestellten Anträge auf Einfuhrlizenzen für bestimmte Erzeugnisse
    im Sektor Schweinefleisch für den Zeitraum vom 1. Januar 1999 bis zum 31. März
    1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 490/1999 af 5. marts 1999 om ændring
