title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2964/92 of 13 October 1992 fixing, for the
    1991/92 marketing year, the amount to be paid by the sugar manufacturers to the
    beet sellers in respect of the difference between the maximum amount of the B
    levy and the amount of that levy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2964/92 de la Commission, du 13 octobre 1992, fixant,
    pour la campagne de commercialisation 1991/1992, le montant à payer par les fabricants
    de sucre aux vendeurs de betteraves en raison de la différence entre le montant
    maximal de la cotisation B et le montant de cette cotisation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2964/92 der Kommission vom 13. Oktober 1992 zur Festlegung
    für das Wirtschaftsjahr 1991/92 des Betrages, den die Zuckerhersteller den Rübenverkäufern
    als Unterschied zwischen dem Höchstbetrag der B-Abgabe und dem Betrag dieser
    Abgabe zu zahlen haben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2964/92 af 13. oktober 1992 om fastsættelse
    for produktionsåret 1991/92 af det beløb, som sukkerfabrikanterne skal betale
    sælgere af sukkerroer som følge af forskellen mellem det maksimale B- afgiftsbeløb
    og det faktiske afgiftsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2964/92 της Επιτροπής
    της 13ης Οκτωβρίου 1992 για τον καθορισμό, για
    την περίοδο εμπορίας 1991/92, του ποσού που θα
    πληρωθεί από τους βιομηχάνους ζάχαρης στους
    πωλητές ζαχαροτεύτλων λόγω της διαφοράς μεταξύ
    του μέγιστου ποσού της εισφοράς Β και του ποσού
    της εισφοράς αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2964/92 della Commissione, del 13 ottobre 1992, che
    fissa, per la campagne di commercializzazione 1991/1992, l' ammontare che i fabbricanti
    di zucchero devono versare ai venditori di barbabietole in ragione della differenza
    tra l' importo massimo del contributo B e l' importo del contributo stesso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2964/92 van de Commissie van 13 oktober 1992 tot
    vaststelling, voor het verkoopseizoen 1991/1992, van het door de suikerfabrikanten
    aan de suikerbietenverkopers uit te keren bedrag wegens het verschil tussen het
    maximumbedrag van de B-heffing en het bedrag van die heffing
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2964/92 da Comissão, de 13 de Outubro de 1992, que
    fixa, para a campanha de comercialização de 1991/1992, o montante a pagar pelos
    fabricantes de açucar aos vendedores de beterrabas devido à diferença entre
    o montante máximo da quotização B e o montante dessa quotização
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2964/92 de la Comisión, de 13 de octubre de 1992,
    por el que se fija, para la campaña de comercialización 1991/92, el importe
    a pagar por los fabricantes de azúcar a los vendedores de remolacha dada la diferencia
    entre el importe máximo de la cotización B y el importe de esta cotización
  type: main
