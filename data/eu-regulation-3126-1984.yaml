    της κλάσεως 44.23 του Κοινού Δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
