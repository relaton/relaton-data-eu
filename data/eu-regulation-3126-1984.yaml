title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3126/84 of 8 November 1984 re-establishing
    the levying of customs duties on builders' carpentry, falling within heading No
    44.23 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3126/84 de la Commission du 8 novembre 1984 portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de menuiserie, de la position 44.23 du tarif douanier commun, originaires de Singapour,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3126/84 der Kommission vom 8. November 1984 zur Wiedereinführung
    der Erhebung der Zölle für Bautischlerarbeiten der Tarifnummer 44.23 mit Ursprung
    in Singapur, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3126/84 af 8. november 1984 om genindførelse
    af opkrævning af told for tømrer- og snedkerarbejder henhørende under position
    44.23 og med oprindelse i Singapore, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
