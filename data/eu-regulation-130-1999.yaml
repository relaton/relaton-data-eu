    de Republiek Hongarije, de Tsjechische Republiek, Slowakije, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 130/1999 da Comissão de 21 de Janeiro de 1999 que
