  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 130/1999, annettu 21 päivänä tammikuuta 1999,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    tammikuussa 1999 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasvallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 130/1999 della Commissione del 21 gennaio 1999 che
