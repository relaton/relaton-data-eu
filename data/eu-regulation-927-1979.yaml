  content: Council Regulation (EEC) No 927/79 of 8 May 1979 on the application of
    Decision No 2/79 of the ACP-EEC Council of Ministers derogating from the concept
    of 'originating products' to take account of the special situation of Mauritius
    with regard to its production of canned tuna
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 927/79 du Conseil, du 8 mai 1979, concernant l' application
    de la décision n° 2/79 du Conseil des ministres ACP-CEE portant dérogation
    à la notion de produits originaires pour tenir compte de la situation particulière
    de l' île Maurice, en ce qui concerne ses productions de conserves de thon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 927/79 des Rates vom 8. Mai 1979 betreffend Anwendung
    des Beschlusses Nr. 2/79 des AKP-EWG-Ministerrats über die Abweichung von dem
    Begriff ,,Ursprungswaren' ' zur Berücksichtigung der besonderen Lage von Mauritius
    bei haltbar gemachtem Thunfisch
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 927/79 af 8. maj 1979 om anvendelse af afgørelse
