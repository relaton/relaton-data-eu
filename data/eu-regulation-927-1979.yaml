    med oprindelsesstatus" under hensyn til Mauritius' særlige stilling for så vidt
    angår produktionen af tunfiskekonserves
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 927/79 del Consiglio, dell' 8 maggio 1979, concernente
