    η Ομοσπονδιακή Δημοκρατία της Γερμανίας βάσει
    του άρθρου 8 παράγραφος 2 στοιχείο γ) της οδηγίας
    70/156/ΕΟΚ του Συμβουλίου για την προσέγγιση των
    νομοθεσιών των κρατών μελών σχετικά με την
    έγκριση τύπου των μηχανοκινήτων οχημάτων και
    των ρυμουλκουμένων τους (Το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/460/EY: Komission päätös, tehty 19 päivänä lokakuuta 1995, Saksan
