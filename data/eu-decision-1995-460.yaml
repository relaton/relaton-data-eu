title:
- language: en
  script: Latn
  content: '95/460/EC: Commission Decision of 19 October 1995 concerning a request
    for exemption lodged by the Federal Republic of Germany pursuant to Article 8
    (2) (c) of Council Directive 70/156/EEC on the approximation of the laws of the
    Member States relating to the type-approval of motor vehicles and their trailers
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/460/CE: Décision de la Commission, du 19 octobre 1995, concernant
    une demande de dérogation introduite par la République fédérale d''Allemagne
    en vertu de l''article 8 paragraphe 2 point c) de la directive 70/156/CEE du Conseil
    concernant le rapprochement des législations des États membres relatives à
    la réception des véhicules à moteur et de leurs remorques (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '95/460/EG: Entscheidung der Kommission vom 19. Oktober 1995 betreffend
    einen von der Bundesrepublik Deutschland gemäß Artikel 8 Absatz 2 Buchstabe
    c der Richtlinie 70/156/EWG des Rates zur Angleichung der Rechtsvorschriften der
    Mitgliedstaaten über die Betriebserlaubnis für Kraftfahrzeuge und Kraftfahrzeuganhänger
    eingereichten Antrag auf Ausnahmeregelung (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/460/EF: Kommissionens beslutning af 19. oktober 1995 om en dispensationsanmodning
    fra Forbundsrepublikken Tyskland i henhold til artikel 8, stk. 2, litra c), i
    Rådets direktiv 70/156/EØF om tilnærmelse af medlemsstaternes lovgivning om
    godkendelse af motordrevne køretøjer og påhængskøretøjer dertil (Kun den
    tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
