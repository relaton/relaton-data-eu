    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun neuvoston
    direktiivin 70/156/ETY 8 artiklan 2 kohdan c alakohdan mukaista poikkeusta koskevasta
    pyynnöstä (Ainoastaan saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
