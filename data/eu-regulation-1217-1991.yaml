    communautaire aanbiedingsprijzen voor perziken, nectarines daaronder begrepen
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1217/91 DA COMISSÃO de 8 de Maio de 1991 que fixa,
