  content: Commission Regulation (EEC) No 1217/91 of 8 May 1991 fixing for the 1991
    marketing year the Community offer prices for peaches including nectarines applicable
    with regard to Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1217/91 DE LA COMMISSION du 8 mai 1991 fixant, pour
    la campagne 1991, les prix d'' offre communautaires des pêches, y compris les
    brugnons et nectarines, applicables vis-à-vis de l'' Espagne et du Portugal #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1217/91 DER KOMMISSION vom 8. Mai 1991 zur Festsetzung
    der für das Wirtschaftsjahr 1991 auf Spanien und Portugal anwendbaren gemeinschaftlichen
    Angebotspreise für Pfirsiche einschließlich Brugnolen und Nektarinen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1217/91 af 8. maj 1991 om fastsættelse
    for høståret 1991 af Fællesskabets tilbudspriser for ferskner, herunder blodferskner
    og nektariner gældende over for Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1217/91 της Επιτροπής
    της 8ης Μαΐου 1991 περί καθορισμού, για την περίοδο
    1991, των κοινοτικών τιμών προσφοράς ροδακίνων,
    συμπεριλαμβανομένων των brugnons και των νεκταρινιών
    που εφαρμόζονται έναντι της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1217/91 DELLA COMMISSIONE dell'' 8 maggio 1991 che
    fissa per la campagna 1991 i prezzi d'' offerta comunitari delle pesche, comprese
    le nettarine e le pesche noci, applicabili per la Spagna e il Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1217/91 VAN DE COMMISSIE van 8 mei 1991 tot vaststelling,
