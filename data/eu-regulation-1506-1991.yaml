title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1506/91 of 4 June 1991 re-establishing the
    levying of customs duties on the products falling within CN code 3105, originating
    in Poland, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1506/91 DE LA COMMISSION du 4 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 3105,
    originaires de la Pologne, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1506/91 DER KOMMISSION vom 4. Juni 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3105 mit Ursprung in Polen,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1506/91 af 4. juni 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3105 og med oprindelse
    i Polen, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1506/91 της Επιτροπής
    της 4ης Ιουνίου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3105, καταγωγής Πολωνίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1506/91 DELLA COMMISSIONE del 4 giugno 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 3105 originari
    della Polonia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1506/91 VAN DE COMMISSIE van 4 juni 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3105, van oorsprong uit Polen, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1506/91 DA COMISSAO, DE 4 DE JUNHO DE 1991, QUE
    RESTABELECE A COBRANCA DOS DIREITOS ADUANEIROS APLICAVEIS AOS PRODUTOS DO CODIGO
    NC 3105, ORIGINARIOS DA POLONIA, BENEFICIARIOS DAS PREFERENCIAS PAUTAIS PELO REGULAMENTO
    ( CEE ) NO 3831/90 DO CONSELHO
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1506/91 DE LA COMISIÓN de 4 de junio de 1991 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 3105 originarios de Polonia beneficiaria de las preferencias
    arancelarias previstas por el Reglamento (CEE) no 3831/90 del Consejo #'
