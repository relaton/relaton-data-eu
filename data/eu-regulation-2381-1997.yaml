    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera, e che stabilisce il bilancio di approvvigionamento per il periodo
    dal 1o luglio 1997 al 30 giugno 1998
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2381/97 van de Commissie van 28 november 1997 tot
    wijziging van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering
    van de specifieke regeling voor de voorziening van Madeira met producten van de
    sector verwerkte groenten en fruit, en tot vaststelling van de voorzieningsbalans
    voor de periode van 1 juli 1997 tot en met 30 juni 1998
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2381/97 da Comissão de 28 de Novembro de 1997 que
