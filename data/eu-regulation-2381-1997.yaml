    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintataseen määrittämisestä ajanjaksolle 1
    päivästä heinäkuuta 1997 30 päivään kesäkuuta 1998
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2381/97 della Commissione del 28 novembre 1997 recante
