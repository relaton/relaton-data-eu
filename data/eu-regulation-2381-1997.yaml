    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter
    og fastsættelse af den foreløbige forsyningsopgørelse for perioden 1. juli
    1997 til 30. juni 1998
  type: main
- language: el
  script: Grek
