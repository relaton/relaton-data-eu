title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2381/97 of 28 November 1997 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July 1997 to 30 June 1998
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2381/97 de la Commission du 28 novembre 1997 modifiant
    le règlement (CEE) n° 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet 1997 au 30 juin 1998
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2381/97 der Kommission vom 28. November 1997 zur Änderung
