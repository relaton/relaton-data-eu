    disposiciones de aplicación del régimen específico de abastecimiento a Madeira
    de productos del sector de las frutas y hortalizas transformadas, y establece
    el plan de abastecimiento para el período del 1 de julio de 1997 al 30 de junio
    de 1998
  type: main
