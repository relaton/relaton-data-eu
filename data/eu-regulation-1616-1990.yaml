    pour la campagne 1990/1991 ainsi que le coefficient à retenir pour le calcul
    des montants applicables aux produits transformés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1616/90 DER KOMMISSION vom 15. Juni 1990 zur Festsetzung
