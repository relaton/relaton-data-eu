    1990/1991 nonché il coefficiente per gli importi applicabili ai prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1616/90 VAN DE COMMISSIE van 15 juni 1990 tot vaststelling
