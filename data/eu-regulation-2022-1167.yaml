  content: Commission Implementing Regulation (EU) 2022/1167 of 6 July 2022 amending
    Implementing Regulation (EU) 2021/633 imposing a definitive anti-dumping duty
    on imports of monosodium glutamate originating in the People’s Republic of China
    and in Indonesia following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council following a partial
    interim review
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1167 de la Commission du 6 juillet
    2022 modifiant le règlement d’exécution (UE) 2021/633 instituant un droit
    antidumping définitif sur les importations de glutamate monosodique originaire
    de la République populaire de Chine et de l’Indonésie à l’issue d’un
    réexamen au titre de l’expiration des mesures effectué en vertu de l’article
    11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
    à la suite d’un réexamen intermédiaire partiel
  type: main
