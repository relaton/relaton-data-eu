---
id: EUDirective20145
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/5/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in solders on printed circuit boards, termination coatings of electrical and electronic
    components and coatings of printed circuit boards, solders for connecting wires
    and cables, solders connecting transducers and sensors that are used durably at
    a temperature below – 20 °C under normal operating and storage conditions
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/5/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les soudures sur les cartes de circuits imprimés, les revêtements
    des extrémités des composants électriques et électroniques et les revêtements
    des cartes de circuits imprimés, les soudures de raccordement des fils et des
    câbles et les soudures de raccordement des transducteurs et des capteurs qui
    sont utilisés durablement à une température inférieure à – 20 °C dans
    des conditions normales de fonctionnement et de stockage
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/5/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Loten auf Leiterplatten, in der Beschichtung von Anschlüssen
    von elektrischen und elektronischen Komponenten und in Beschichtungen von Leiterplatten,
    in Loten zur Verbindung von Drähten und Kabeln, in Loten zur Verbindung von Wandlern
    und Sensoren, die dauerhaft bei einer Temperatur von unter – 20 °C unter normalen
    Betriebs- und Lagerbedingungen verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/5/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в припои за печатни платки, в покрития на изводи
    на електрически и електронни елементи и покрития
    на печатни платки, в припои за свързване на
    проводници и кабели, в припои за свързване
    на измервателни преобразуватели и датчици,
    които се използват трайно при температури
    под – 20 °C при нормални условия на работа и
    съхранение
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/5/EU ze dne 18. října 2013
    , kterou se z důvodu přizpůsobení technickému pokroku mění příloha IV
    směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro olovo
    v pájkách na deskách tištěných spojů, v potahové vrstvě koncovek elektrických
    a elektronických součástí a potahů desek tištěných spojů, v pájkách
    ke spojování vodičů a kabelů, v pájkách ke spojování snímačů a čidel,
    které se za normálních a skladovacích podmínek trvale používají při teplotách
    nižších než – 20 °C
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/5/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU, for så vidt angår undtagne anvendelser af bly i lodninger i printplader,
    termineringsbelægninger til elektriske og elektroniske komponenter og printpladebelægninger,
    lodninger til forbindelse af tråde og kabler, lodninger til forbindelse af transducere
    og sensorer, der anvendes varigt ved en temperatur under – 20 °C under normale
    drifts- og opbevaringsforhold
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/5/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τον μόλυβδο στα συγκολλητικά
    κράματα πλακετών τυπωμένου κυκλώματος, στις
    επιστρώσεις στις άκρες ηλεκτρικών και ηλεκτρονικών
    κατασκευαστικών στοιχείων και στις επιστρώσεις
    πλακετών τυπωμένου κυκλώματος, στα συγκολλητικά
    κράματα σύνδεσης συρμάτων και καλωδίων, στα
    συγκολλητικά κράματα σύνδεσης μορφοτροπέων
    και αισθητήρων που χρησιμοποιούνται μονίμως
    σε θερμοκρασία κάτω των – 20 °C υπό κανονικές
    συνθήκες λειτουργίας και αποθήκευσης
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/5/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist trükkplaatide
    joodistes, elektriliste või elektrooniliste komponentide otsakatetes ja trükkplaatide
    katetes, juhtmete ja kaablite kinnitamise joodistes ning andurite ja sensorite
    kinnitamise joodistes, mis on vastupidavad tavapärastes töö- ja ladustamistingimustes,
    mille puhul temperatuur on alla – 20 °C
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/5/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen lyijyä sellaisten painettujen piirilevyjen
    juotoksissa, sähkö- ja elektroniikkakomponenttien liitäntöjen pinnoitteissa
    ja painettujen piirilevyjen pinnoitteissa, johtojen ja kaapeleiden sidosjuotteissa
    sekä anturien ja sensorien sidosjuotteissa, joita käytetään jatkuvasti alle
    – 20 °C lämpötilassa tavanomaisissa käyttö- ja varastointiolosuhteissa
    koskevan poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/5/EU оd 18. listopada 2013. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća o izuzeću za olovo u lemu na tiskanim pločicama, završnim
    premazima električnih i elektroničkih komponenta i premazima tiskanih pločica,
    lemovima za spajanje žica i kabela, lemovima koji spajaju pretvarače i senzore
    koji se trajno upotrebljavaju na temperaturi ispod – 20 °C pod normalnim uvjetima
    rada i skladištenja
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/5/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a nyomtatott áramköri lapok forraszanyagaiban, villamos és elektronikai alkatrész-csatlakozások
    bevonatában, nyomtatott áramköri lapok bevonatában, huzalokat és kábeleket
    összekötő forraszanyagokban, standard működési és tárolási körülmények
    között tartósan – 20 °C alatt használt átalakítókat és érzékelőket
    összekötő forraszanyagokban lévő ólom mentesítése tekintetében, a műszaki
    fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/5/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al piombo in saldature per circuiti stampati, rivestimenti di terminazioni di
    componenti elettrici ed elettronici e rivestimenti di circuiti stampati, saldature
    per la connessione di fili e cavi, saldature per la connessione di trasduttori
    e sensori utilizzati per periodi di tempo prolungati a temperature inferiori a
    – 20 °C in condizioni di funzionamento normale e di stoccaggio
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/5/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam lodmetālos
    drukātās shēmas platēs, elektrisko un elektronisko detaļu savienojumu pārklājumos
    un drukātās shēmas plašu pārklājumos, vadu un kabeļu salodēšanas lodmetālos
    un devēju un sensoru salodēšanas lodmetālos, ko normālos ekspluatācijas
    un glabāšanas apstākļos ilgstoši izmanto temperatūrā, kas zemāka par –
    20 °C
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/5/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną spausdintinių plokščių lydmetaliuose, elektrinių bei elektroninių
    komponentų išvadų dangose ir spausdintinių plokščių dangose, laidų ir
    kabelių sujungimo lydmetaliuose, keitlių ir jutiklių, kurie įprastomis naudojimo
    ir laikymo sąlygomis nuolat naudojami žemesnėje kaip – 20 °C temperatūroje,
    sujungimo lydmetaliuose
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/5/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb fl-istann ta’ unitajiet ta’ ċirkwit stampati, kisjiet
    tat-terminazzjoni tal-komponenti elettriċi u elettroniċi u kisjiet tal-unitajiet
    ta’ ċirkwit stampati, stann għall-wajers u l-kejbils ta’ konnessjoni, stann
    għall-konnessjoni ta’ transdjusers u sensers reżistenti għall-użu f’temperaturi
    inqas minn – 20 °C f’kundizzjonijiet normali ta’ tħaddim u ħżin
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/5/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in soldeer op printplaten, coatings op de aansluiting
    van elektrische en elektronische onderdelen en coatings op printplaten, soldeer
    voor het aansluiten van draden en kabels en soldeer voor het aansluiten van transducters
    en sensoren voor duurzaam gebruik bij een temperatuur van minder dan – 20 °C
    onder normale bedrijfs- en opslagvoorwaarden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/5/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu w stopach lutowniczych na płytkach obwodów drukowanych, powłokach zakończeń
    komponentów elektrycznych i elektronicznych i powłokach płytek obwodów drukowanych,
    w stopach lutowniczych stosowanych przy łączeniu przewodów i kabli oraz stopach
    lutowniczych łączących przetworniki i czujniki, które są długotrwale używane
    w temperaturze poniżej – 20 °C w normalnych warunkach pracy i składowania
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/5/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para chumbo em soldas para placas de circuito impresso, revestimentos de pontos
    terminais de componentes elétricos e eletrónicos e revestimentos de placas de
    circuito impresso, soldas para fios e cabos de ligação, soldas para ligação
    de transdutores e sensores, para utilização de forma durável a temperaturas
    inferiores a – 20 °C, em condições normais de funcionamento e armazenagem
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/5/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din aliajele de lipit de pe plăcile cu circuite imprimate, din stratul
    acoperitor al contactelor componentelor electrice și electronice și din stratul
    acoperitor al plăcilor cu circuite imprimate, din aliajele de lipit pentru îmbinarea
    firelor și a cablurilor și din aliajele de lipit pentru conectarea traductorilor
    și a senzorilor, care sunt utilizate în mod sustenabil la o temperatură sub
    – 20 °C în condiții normale de funcționare și depozitare
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/5/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo v spájkach na
    doskách plošných spojov, v povrchových náteroch na koncovkách elektrických
    a elektronických komponentov a v náteroch na doskách plošných spojov, v spájkach
    na spájanie drôtov a káblov, v spájkach na spájanie prevodníkov a snímačov,
    ktoré sa za bežných prevádzkových a skladovacích podmienok trvalo používajú
    pri teplotách nižších ako – 20 °C
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/5/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem za
    svinec v spajkah na ploščah tiskanega vezja, prevlekah priključkov električnih
    in elektronskih komponent in prevlekah plošč tiskanega vezja, spajkah za povezovanje
    žic in kablov, spajkah za povezovanje pretvornikov in senzorjev, ki se uporabljajo
    dolgotrajno pri temperaturi pod – 20 °C pod običajnimi pogoji obratovanja
    in skladiščenja, zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/5/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en soldaduras utilizadas en circuitos impresos, revestimientos de
    terminaciones de componentes eléctricos y electrónicos y de circuitos impresos,
    soldaduras para la conexión de hilos y cables y soldaduras para la conexión
    de transductores y sensores que se emplean durante un período prolongado de tiempo
    a una temperatura inferior a – 20 °C en condiciones normales de funcionamiento
    y almacenamiento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/5/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till direktiv 2011/65/EU
    vad gäller undantag för ”bly i lödmetall på mönsterkort, beläggningar
    på elektriska och elektroniska komponenter och beläggningar på mönsterkort,
    lödmetall för anslutande ledningar och kablar, lödpunkter som förbinder omvandlare
    och sensorer som används varaktigt vid temperaturer under – 20 °C under normala
    drifts- och lagringsförhållanden”
  type: main
