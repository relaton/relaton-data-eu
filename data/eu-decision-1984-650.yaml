type: standard
title:
- language: en
  script: Latn
  content: '84/650/EEC: Commission Decision of 21 December 1984 accepting undertakings
    and repealing the provisional duty in connection with the anti-dumping investigation
    concerning imports of artificial corundum originating in the People'' s Republic
    of China and Czechoslovakia and terminating the investigation with regard to these
    countries'
  type: main
- language: fr
  script: Latn
  content: '84/650/CEE: Décision de la Commission du 21 décembre 1984 portant acceptation
    des engagements souscrits et abrogation du droit provisoire dans le cadre de la
    procédure antidumping concernant les importations de corindons artificiels, originaires
    de la République populaire de Chine et de Tchécoslovaquie, et clôture de la
    procédure, eu égard aux importations de ces pays'
  type: main
- language: de
  script: Latn
  content: '84/650/EWG: Beschluß der Kommission vom 21. Dezember 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von künstlichem Korund mit Ursprung in der Volksrepublik China und der Tschechoslowakei
    und über die Einstellung des Verfahrens hinsichtlich dieser Länder'
  type: main
- language: da
  script: Latn
  content: '84/650/EØF: Kommissionens afgørelse af 21. december 1984 om godtagelse
    af tilsagn og om ophævelse af den foreløbige told i forbindelse med antidumpingundersøgelsen
    vedrørende importen af kunstig korund med oprindelse i Den kinesiske Folkerepublik
    og Tjekkoslovakiet og afslutning af undersøgelsen med hensyn til disse lande'
  type: main
- language: el
  script: Grek
  content: '84/650/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 για την αποδοχή αναλήψεων υποχρεώσεων
    και την κατάργηση του προσωρινού δασμού όσον
    αφορά την έρευνα αντιντάμπινγκ σχετικά με
    τις εισαγωγές τεχνητού κορουνδίου καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας και Τσεχοσλοβακίας
    και για την περάτωση της διαδικασίας όσον αφορά
    τις χώρες αυτές'
  type: main
- language: it
  script: Latn
  content: '84/650/CEE: Decisione della Commissione del 21 dicembre 1984 che accetta
    gli impegni e abroga il dazio provvisorio nell'' ambito dell'' inchiesta antidumping
    relativa alle importazioni di corindone artificiale originario della Repubblica
    popolare cinese e della Cecoslovacchia e chiude la procedura per quanto riguarda
    detti paesi'
  type: main
- language: nl
  script: Latn
  content: '84/650/EEG: Besluit van de Commissie van 21 december 1984 tot aanvaarding
    van een verbintenis en intrekking van het voorlopige recht in verband met de anti-dumpingprocedure
    betreffende de invoer van kunstkorundum van oorsprong uit de Volksrepubliek China
    en Tsjechoslowakije alsmede met beëindiging van de procedure ten aanzien van
    deze landen'
  type: main
