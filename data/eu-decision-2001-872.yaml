  script: Latn
  content: '2001/872/EC: Commission Decision of 7 December 2001 approving the schemes
    submitted by the United Kingdom and Ireland for the withdrawal of all fish in
    farms infected with infectious salmon anaemia (ISA) virus and repealing Decision
    2001/494/EC (Text with EEA relevance) (notified under document number C(2001)
    3938)'
  type: main
- language: fr
  script: Latn
  content: '2001/872/CE: Décision de la Commission du 7 décembre 2001 approuvant
