    tous les poissons des exploitations infectées par le virus de l''anémie infectieuse
    du saumon (AIS) et abrogeant la décision 2001/494/CE (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2001) 3938]'
  type: main
