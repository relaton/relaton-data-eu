  content: Commission Regulation (EC) No 688/94 of 28 March 1994 amending Commission
    Regulation (EEC) No 3713/92 deferring the date of application of Article 11 (1)
    of Regulation (EEC) No 2092/91 on organic production of agricultural products
    and indications referring thereto on agricultural products and foodstuffs, with
    regard to the imports from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 688/94 de la Commission du 28 mars 1994 modifiant le
    règlement (CEE) n° 3713/92 prorogeant le délai de mise en application de l'article
    11 paragraphe 1 du règlement (CEE) n° 2092/91 concernant le mode de production
    biologique de produits agricoles et sa présentation sur les produits agricoles
    et les denrées alimentaires, en ce qui concerne les importations de certains
    pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 688/94 DER KOMMISSION vom 28. März 1994 zur Änderung
