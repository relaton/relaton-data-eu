title:
- language: en
  script: Latn
  content: Council Directive 92/65/EEC of 13 July 1992 laying down animal health requirements
    governing trade in and imports into the Community of animals, semen, ova and embryos
    not subject to animal health requirements laid down in specific Community rules
    referred to in Annex A (I) to Directive 90/425/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 92/65/CEE du Conseil, du 13 juillet 1992, définissant les conditions
    de police sanitaire régissant les échanges et les importations dans la Communauté
    d'animaux, de spermes, d'ovules et d'embryons non soumis, en ce qui concerne les
    conditions de police sanitaire, aux réglementations communautaires spécifiques
    visées à l'annexe A section I de la directive 90/425/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/65/EWG des Rates vom 13. Juli 1992 über die tierseuchenrechtlichen
    Bedingungen für den Handel mit Tieren, Samen, Eizellen und Embryonen in der Gemeinschaft
    sowie für ihre Einfuhr in die Gemeinschaft, soweit sie diesbezüglich nicht den
    spezifischen Gemeinschaftsregelungen nach Anhang A Abschnitt I der Richtlinie
    90/425/EWG unterliegen
  type: main
- language: bg
  script: Cyrl
  content: Директива 92/65/ЕИО на Съвета от 13 юли 1992 година
    за определяне на ветеринарно-санитарните изисквания
    относно търговията и вноса в Общността на животни,
    сперма, яйцеклетки и ембриони, които не са предмет
    на ветеринарно-санитарните изисквания, определени
    в специалните правила на Общността, посочени
    в приложение А, раздел I към Директива 90/425/ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 92/65/EHS ze dne 13. července 1992 o veterinárních předpisech
    pro obchod se zvířaty, spermatem, vajíčky a embryi uvnitř Společenství
    a jejich dovoz do Společenství, pokud se na ně nevztahují zvláštní veterinární
    předpisy Společenství uvedené v příloze A oddíle I směrnice 90/425/EHS
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/65/EØF af 13. juli 1992 om dyresundhedsmæssige betingelser
    for samhandel med og indførsel til Fællesskabet af dyr samt sæd, æg og embryoner,
    der for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbetingelser
    som omhandlet i bilag A, del I, til direktiv 90/425/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/65/ΕΟΚ του Συμβουλίου της 13ης Ιουλίου
    1992 που καθορίζει τους όρους υγειονομικού ελέγχου
    που διέπουν το εμπόριο και τις εισαγωγές στην
    Κοινότητα ζώων, σπέρματος, ωαρίων και εμβρύων
    που δεν υπόκεινται, όσον αφορά τους όρους υγειονομικού
    ελέγχου, στις ειδικές κοινοτικές ρυθμίσεις
    που αναφέρονται στο τμήμα Ι του παραρτήματος
    Α της οδηγίας 90/425/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 92/65/EMÜ, 13. juuli 1992, milles sätestatakse loomatervishoiu
    nõuded ühendusesiseseks kauplemiseks loomade, sperma, munarakkude ja embrüotega,
    mille suhtes ei kohaldata direktiivi 90/425/EMÜ A (I) lisas osutatud ühenduse
    erieeskirjades sätestatud loomatervishoiu nõudeid, ning nende impordiks ühendusse
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/65/ETY, annettu 13 päivänä heinäkuuta 1992,
    eläinten terveyttä koskevista vaatimuksista eläinten, siemennesteen, munasolujen
    ja alkioiden yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa siltä osin,
    kuin niitä eivät koske direktiivin 90/425/ETY liitteessä A olevassa I jaksossa
    mainittujen erityisten yhteisön säädösten eläinten terveyttä koskevat vaatimukset
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 92/65/EEZ od 13. srpnja 1992. o utvrđivanju uvjeta zdravlja
    životinja kojima se uređuje trgovina i uvoz u Zajednicu životinja, sjemena,
    jajnih stanica i zametaka koji ne podliježu uvjetima zdravlja životinja utvrđenima
    u određenim propisima Zajednice iz Priloga A dijela I. Direktive 90/425/EEZ
  type: main
- language: hu
  script: Latn
  content: A Tanács 92/65/EGK irányelve (1992. július 13.) a 90/425/EGK irányelv
    A. mellékletének I. pontjában felsorolt külön közösségi szabályokban
    megállapított állat-egészségügyi követelmények hatálya alá nem tartozó
    állatok, spermák, petesejtek és embriók Közösségen belüli kereskedelmére
    és a Közösségbe történő behozatalára irányadó állat-egészségügyi
    követelmények megállapításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 92/65/CEE del Consiglio, del 13 luglio 1992, che stabilisce norme
    sanitarie per gli scambi e le importazioni nella Comunità di animali, sperma,
    ovuli e embrioni non soggetti, per quanto riguarda le condizioni di polizia sanitaria,
    alle normative comunitarie specifiche di cui all'allegato A, sezione I, della
    direttiva 90/425/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 92/65/EEK (1992. gada 13. jūlijs), ar ko paredz dzīvnieku
    veselības prasības attiecībā uz tādu dzīvnieku, spermas, olšūnu un embriju
    tirdzniecību un importu Kopienā, uz kuriem neattiecas dzīvnieku veselības
    prasības, kas paredzētas īpašos Kopienas noteikumos, kuri minēti Direktīvas
    90/425/EEK A(I) pielikumā
  type: main
- language: lt
  script: Latn
  content: 1992 m. liepos 13 d. Tarybos direktyva 92/65/EEB, nustatanti gyvūnų sveikatos
    reikalavimus, reglamentuojančius prekybą Bendrijoje gyvūnais, sperma, kiaušialąstėmis
    bei embrionais, kuriems netaikomi gyvūnų sveikatos reikalavimai, nustatyti specialiose
