    l-importazzjoni fil-Komunità ta’ annimali, semen, ova u embrijuni mhux suġġetti
    għal ħtiġijiet ta’ saħħa ta’ l-annimali meħtieġa f’regoli speċifiċi
    tal-Komunità li hemm referenza għalihom fl-Anness A (1) ta’ Direttiva 90/425/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/65/EEG van de Raad van 13 juli 1992 tot vaststelling van de
    veterinairrechtelijke voorschriften voor het handelsverkeer en de invoer in de
    Gemeenschap van dieren, sperma, eicellen en embryo's waarvoor ten aanzien van
    de veterinairrechtelijke voorschriften geen specifieke communautaire regelgeving
    als bedoeld in bijlage A, onder I, van Richtlijn 90/425/EEG geldt
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 92/65/EWG z dnia 13 lipca 1992 r. ustanawiająca wymagania
    dotyczące zdrowia zwierząt regulujące handel i przywóz do Wspólnoty zwierząt,
    nasienia, komórek jajowych i zarodków nieobjętych wymaganiami dotyczącymi
    zdrowia zwierząt ustanowionymi w szczególnych zasadach Wspólnoty określonych
    w załączniku A pkt I do dyrektywy 90/425/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 92/65/CEE do Conselho, de 13 de Julho de 1992, que define as
    condições de polícia sanitária que regem o comércio e as importações na
    Comunidade de animais, sémens, óvulos e embriões não sujeitos, no que se refere
    às condições de polícia sanitária, às regulamentações comunitárias específicas
    referidas na secção I do anexo A da Directiva 90/425/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 92/65/CEE a Consiliului din 13 iulie 1992 de definire a cerințele
    de sănătate animală care reglementează schimburile și importurile în Comunitate
    de animale, material seminal, ovule și embrioni care nu se supun, în ceea ce
    privește cerințele de sănătate animală, reglementărilor comunitare speciale
    prevăzute în anexa A punctul la Directiva 90/425/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 92/65/EHS z 13. júna 1992, ktorou sa ustanovujú veterinárne
    požiadavky na obchodovanie so zvieratami, spermou, vajíčkami a embryami, na
    ktoré sa nevzťahujú veterinárne požiadavky ustanovené v osobitných právnych
    predpisoch spoločenstva uvedených v prílohe A oddieli I smernice 90/425/EHS,
    a na ich dovoz do spoločenstva
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 92/65/EGS z dne 13. julija 1992 o zahtevah zdravstvenega
    varstva živali za trgovino in za uvoz v Skupnost živali, semena, jajčnih celic
    in zarodkov, za katere ne veljajo zahteve zdravstvenega varstva živali, določene
    v posebnih pravilih Skupnosti iz Priloge A(I) k Direktivi 90/425/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 92/65/CEE del Consejo, de 13 de julio de 1992, por la que se
    establecen las condiciones de policía sanitaria aplicables a los intercambios
    y las importaciones en la Comunidad de animales, esperma, óvulos y embriones
    no sometidos, con respecto a estas condiciones, a las normativas comunitarias
    específicas a que se refiere la sección I del Anexo A de la Directiva 90/425/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 92/65/EEG av den 13 juli 1992 om fastställande av djurhälsokrav
    i handeln inom och importen till gemenskapen av djur, sperma, ägg (ova) och embryon
    som inte faller under de krav som fastställs i de specifika gemenskapsregler
    som avses i bilaga A.I till direktiv 90/425/EEG
