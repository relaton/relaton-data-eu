title:
- language: en
  script: Latn
  content: '80/1294/EEC: Commission Decision of 22 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of the Netherlands of expenditure
    incurred during 1978 on aids and premiums relating to the modernization of farms
    (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1294/CEE: Décision de la Commission, du 22 décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume des Pays-Bas des dépenses effectuées
    pendant l''année 1978 pour les aides et primes relatives à la modernisation
    des exploitations agricoles (Le texte en langue néerlandaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1294/EWG: Entscheidung der Kommission vom 22. Dezember über die Rückvergütung
    der im Jahr 1978 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen
    und Prämien getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das
    Königreich der Niederlande (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1294/EØF: Kommissionens beslutning af 22. december 1980 om refusion
