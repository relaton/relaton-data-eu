title:
- language: en
  script: Latn
  content: '87/132/EEC: Commission Decision of 26 January 1987 approving the special
    programmes drawn up by a number of Italian regions for the replanting and conversion
    of olive groves damaged by frost in 1985 under Council Regulation (EEC) No 1654/86
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/132/CEE: Décision de la Commission du 26 janvier 1987 portant approbation
    des programmes spéciaux, élaborés par certaines régions italiennes, concernant
    la reconstitution et la reconversion des oliveraies endommagées par le gel en
    1985 conformément au règlement (CEE) n° 1654/86 du Conseil (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
