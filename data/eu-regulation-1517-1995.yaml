  script: Latn
  content: Commission Regulation (EC) No 1517/95 of 29 June 1995 laying down detailed
    rules for the application of Regulation (EEC) No 1766/92 as regards the arrangements
    for the export and import of compound feedingstuffs based on cereals and amending
    Regulation (EC) No 1162/95 laying down special detailed rules for the application
    of the system of import and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
