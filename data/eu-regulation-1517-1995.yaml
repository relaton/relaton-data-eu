    e di esportazione degli alimenti composti a base di cereali per gli animali e
    recante modifica del regolamento (CE) n. 1162/95 che stabilisce modalità particolari
    d'applicazione del regime dei titoli d'importazione e di esportazione nel settore
    dei cereali e del riso
  type: main
- language: lv
  script: Latn
