    régime d'importation et d'exportation applicable aux aliments composés à base
    de céréales pour les animaux et modifiant le règlement (CE) n° 1162/95 portant
    modalités particulières d'application du régime des certificats d'importation
    et d'exportation dans le secteur des céréales et du riz
