title:
- language: en
  script: Latn
  content: Commission Decision of 19 October 1973 authorizing the French Republic
    to exclude from the implementation of Council Regulation (EEC) No 2810/73 the
    products referred to in the said Regulation, imported into the Department of Réunion
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 octobre 1973, autorisant la République
    française à exclure de l'application du règlement (CEE) n° 2810/73 du Conseil
    les produits visés dans ledit règlement, importés dans le département de la
    Réunion
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Oktober 1973, durch die die Französische
    Republik ermächtigt wird, von der Anwendung der Verordnung (EWG) Nr. 2810/73
    des Rates die darin genannten Waren auszuschließen, die in das Departement Réunion
    eingeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. oktober 1973 om bemyndigelse af Den franske
    Republik til ikke at anvende Rådets forordning (EØF) nr. 2810/73 på de i denne
    forordning nævnte varer, der indføres i departementet Réunion
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 ottobre 1973, che autorizza la Repubblica
    francese ad escludere dall'applicazione del regolamento (CEE) n. 2810/73 del Consiglio
    i prodotti figuranti nel detto regolamento, importati nel dipartimento della Riunione
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 oktober 1973 waarbij de Franse Republiek
    wordt gemachtigd van de bepalingen van Verordening (EEG) nr. 2810/73 van de Raad
    uit te sluiten de in deze verordening genoemde produkten die in het departement
    Reunion worden ingevoerd
