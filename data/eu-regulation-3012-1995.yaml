  content: Council Regulation (EC) No 3012/95 of 20 December 1995 amending Regulation
    (EEC) No 1605/92 temporarily suspending the autonomous Common Customs Tariff duties
    on imports of certain industrial products into the Canary Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3012/95 du Conseil, du 20 décembre 1995, modifiant
