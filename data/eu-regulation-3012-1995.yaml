    satser i den fælles toldtarif ved indførsel af visse industrivarer til De Kanariske
    Øer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3012/95 του Συμβουλίου,
    της 20ής Δεκεμβρίου 1995, που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1605/92 για την προσωρινή αναστολή των
    αυτόνομων δασμών του κοινού δασμολογίου κατά
