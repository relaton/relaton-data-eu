    della tariffa doganale comune all' importazione di un certo numero di prodotti
    industriali nelle isole Canarie
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3012/95 van de Raad van 20 december 1995 houdende
    wijziging van Verordening (EEG) nr. 1605/92 houdende tijdelijke schorsing van
    de autonome rechten van het gemeenschappelijk douanetarief bij de invoer van een
    aantal industriële produkten op de Canarische eilanden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3012/95 do Conselho, de 20 de Dezembro de 1995, que
