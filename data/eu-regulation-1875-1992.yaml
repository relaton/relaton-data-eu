title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1875/92 of 6 July 1992 re-establishing the
    levying of customs duties on products of category 23 (order No 40.0230), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1875/92 de la Commission, du 6 juillet 1992, portant
