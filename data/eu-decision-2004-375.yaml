  script: Latn
  content: '2004/375/CE: Decisão da Comissão, de 20 de Abril de 2004, que altera
    a Decisão 2003/526/CE no que diz respeito à inclusão da Eslováquia entre os
    Estados-Membros aos quais se aplicam certas medidas de luta contra a peste suína
    clássica (Texto relevante para efeitos do EEE) [notificada com o número C(2004)
    1389]'
  type: main
- language: sk
  script: Latn
