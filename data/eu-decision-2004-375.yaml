    seoses sigade klassikalise katkuga (teatavaks tehtud numbri K(2004) 1389 all)
  type: main
- language: fi
  script: Latn
  content: '2004/375/EY: Komission päätös, tehty 20 päivänä huhtikuuta 2004,
