title:
- language: en
  script: Latn
  content: '2004/375/EC: Commission Decision of 20 April 2004 amending Decision 2003/526/EC
    as regards the inclusion of Slovakia amongst the Member States to which certain
    disease control measures apply with regard to classical swine fever (Text with
    EEA relevance) (notified under document number C(2004) 1389)'
  type: main
- language: fr
  script: Latn
  content: '2004/375/CE: Décision de la Commission du 20 avril 2004 modifiant la
    décision 2003/526/CE eu égard à l''inclusion de la Slovaquie parmi les États
    membres auxquels s''appliquent certaines mesures de lutte contre la peste porcine
    classique (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro
    C(2004) 1389]'
  type: main
- language: de
  script: Latn
  content: '2004/375/EG: Entscheidung der Kommission vom 20. April 2004 zur Änderung
    der Entscheidung 2003/526/EG zwecks Aufnahme der Slowakei in die Gruppe der Mitgliedstaaten,
    in denen bestimmte Maßnahmen zum Schutz gegen die klassische Schweinepest gelten
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2004)
    1389)'
  type: main
- language: cs
  script: Latn
