    beslutning 2003/526/EF, så Slovakiet bliver blandt de medlemsstater, for hvilke
    der gælder visse foranstaltninger vedrørende sygdomsbekæmpelse med hensyn til
    klassisk svinepest (EØS-relevant tekst) (meddelt under nummer K(2004) 1389)'
  type: main
- language: el
  script: Grek
  content: '2004/375/ΕΚ: Απόφαση της Επιτροπής, της 20ής
