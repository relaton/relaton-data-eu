title:
- language: en
  script: Latn
  content: '2002/828/EC: Council Decision of 8 October 2002 authorising Sweden to
    apply a differentiated rate of energy tax to alkylate-based petrol for two-stroke
    engines in accordance with Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '2002/828/CE: Décision du Conseil du 8 octobre 2002 autorisant la Suède
    à appliquer un taux différencié de taxe sur l''énergie à l''essence alkylat
    destinée aux moteurs à deux temps conformément à l''article 8, paragraphe
    4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2002/828/EG: Entscheidung des Rates vom 8. Oktober 2002 zur Ermächtigung
    Schwedens zur Staffelung der Energiesteuer zugunsten von Alkylatbenzin für Zweitaktmotoren
    (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '2002/828/EF: Rådets beslutning af 8. oktober 2002 om bemyndigelse af
    Sverige til i medfør af artikel 8, stk. 4, i direktiv 92/81/EØF at anvende en
    differentieret energiafgiftssats for alkylatbenzin til totaktsmotorer'
  type: main
- language: el
  script: Grek
  content: '2002/828/ΕΚ: Απόφαση του Συμβουλίου, της 8ης
    Οκτωβρίου 2002, με την οποία εξουσιοδοτείται
    η Σουηδία να εφαρμόζει διαφοροποιημένο συντελεστή
    ενεργειακού φόρου στο αλκυλικό πετρέλαιο για
    τους δίχρονους κινητήρες σύμφωνα με το άρθρο
    8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '2002/828/EY: Neuvoston päätös, tehty 8 päivänä lokakuuta 2002, direktiivin
    92/81/ETY 8 artiklan 4 kohdan mukaisen luvan antamisesta Ruotsille soveltaa eriytettyä
    energiaverokantaa kaksitahtimoottoreissa käytettävään alkylaattibensiiniin'
  type: main
- language: it
  script: Latn
  content: '2002/828/CE: Decisione del Consiglio, dell''8 ottobre 2002, che autorizza
    la Svezia ad applicare un''aliquota differenziata di imposta sull''energia alla
    benzina alchilata per i motori a due tempi conformemente all''articolo 8, paragrafo
    4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2002/828/EG: Beschikking van de Raad van 8 oktober 2002 waarbĳ Zweden
    wordt gemachtigd om overeenkomstig artikel 8, lid 4, van Richtlĳn 92/81/EEG,
    een gedifferentieerd tarief voor de energieheffing toe te passen op alkylaatbenzine
    voor tweetaktmotoren'
  type: main
- language: pt
  script: Latn
  content: '2002/828/CE: Decisão do Conselho, de 8 de Outubro de 2002, que autoriza
    a Suécia a aplicar uma taxa diferenciada do imposto sobre a energia relativamente
    à gasolina alquilada para motores a dois tempos, ao abrigo do disposto no n.°
    4 do artigo 8.° da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '2002/828/CE: Decisión del Consejo, de 8 de octubre de 2002, por la que
    se autoriza al Reino de Suecia a aplicar a la gasolina a base de alquilatos para
    motores de dos tiempos un tipo diferenciado del impuesto sobre el consumo de energía,
    de conformidad con el apartado 4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '2002/828/EG: Rådets beslut av den 8 oktober 2002 om tillåtelse, i enlighet
