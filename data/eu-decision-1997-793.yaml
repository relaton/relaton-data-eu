  content: '97/793/EC: Commission Decision of 15 July 1997 ordering Germany to provide
    all documentation, information and data on the restructuring of SHB Stahl- und
    Hartgußwerke Bösdorf AG, Saxony, and on the aid granted to it (C 9/97 ex NN
    2/97 and N 645/96) (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
