    wird, daß das Gerät ,,E.S.L.- Interactive Digital Image Manipulation System,
    IDIMS III" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '81/640/EØF: Kommissionens beslutning af 23. juli 1981 om fastsættelse
    af, at indførsel af apparatet "E.S.L. - Interactive Digital Image Manipulation
