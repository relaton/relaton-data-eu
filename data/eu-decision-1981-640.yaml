  content: '81/640/EEC: Commission Decision of 23 July 1981 establishing that the
    apparatus described as ''ESL- Interactive digital image manipulation system, IDIMS
    III'', may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/640/CEE: Décision de la Commission, du 23 juillet 1981, constatant
    que l''importation de l''appareil dénommé "ESL - Interactive digital image manipulation
    system, IDIMS III" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
