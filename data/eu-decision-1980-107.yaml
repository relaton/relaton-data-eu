title:
- language: en
  script: Latn
  content: '80/107/EEC: Commission Decision of 20 December 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Federal Republic of Germany of expenditure
    incurred during 1976 on aids and premiums relating to the modernization of farms
    including those in the less- favoured farming areas (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/107/CEE: Décision de la Commission, du 20 décembre 1979, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à la République fédérale d''Allemagne des dépenses
    effectuées pendant l''année 1976 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris dans les zones agricoles défavorisées
    (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/107/EWG: Entscheidung der Kommission vom 20. Dezember 1979 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an die Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/107/EØF: Kommissionens beslutning af 20. december 1979 om refusion
    gennem EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af udgifter,
    som er afholdt i løbet af året 1976 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, også i ugunstigt stillede områder (Kun den tyske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/107/CEE: Decisione della Commissione, del 20 dicembre 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica federale
    di Germania delle spese effettuate durante il 1976 per gli aiuti ed i premi relativi
    all''ammodernamento delle aziende agricole, comprese quelle nelle zone agricole
    svantaggiate (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/107/EEG: Beschikking van de Commissie van 20 december 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    voor de in 1976 verrichte uitgaven voor steun en premies met betrekking tot de
    modernisering van landbouwbedrijven waaronder mede begrepen die in probleemgebieden
    in de landbouw (Slechts de tekst in de Duitse taal is authentiek)'
