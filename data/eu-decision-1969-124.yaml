title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 mars 1969, autorisant la République
    française, en vertu de l'article 115 alinéa 1 du Traité, à appliquer des mesures
    de protection à l'importation de la viande de l'espèce chevaline (position n°
    02.01 A Ex I), originaires des pays tiers et mise en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '69/124/EWG: Entscheidung der Kommission vom 27. März 1969 zur Ermächtigung
    der Französischen Republik, auf Grund von Artikel 115 Absatz 1 des Vertrages
    bei der Einfuhr von Pferdefleisch (Tarifnummer 02.01 A ex I) mit Ursprung in dritten
    Ländern, das sich in den übrigen Mitgliedstaaten im freien Verkehr befindet,
    Schutzmaßnahmen anzuwenden'
  type: main
- language: it
  script: Latn
  content: '69/124/CEE: Decisione della Commissione, del 27 marzo 1969, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del trattato,
    ad applicare misure di protezione all''importazione di carne della specie equina
    (voce 02.01 A ex I), originaria dei paesi terzi ed immessa in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/124/EEG: Beschikking van de Commissie van 27 maart 1969 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea, van het Verdrag
    beschermende maatregelen toe te passen bij de invoer van vlees van paarden (post
    02.01 A ex I), van oorsprong uit derde landen en in de andere Lid-Staten in het
    vrije verkeer gebracht'
  type: main
