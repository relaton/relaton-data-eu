    eller kunstlæder, henhørende under pos. 42.03 A, B II, B III og C i den fælles
    toldtarif og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3599/85
  type: main
