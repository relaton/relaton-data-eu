title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2387/86 of 29 July 1986 re-establishing
    the levying of customs duties on articles of apparel and clothing accessories,
    of leather or of composition leather, falling within subheadings 42.03 A, B II,
    III and C, originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2387/86 de la Commission du 29 juillet 1986 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement en cuir naturel, artificiel ou reconstitué, des sous-positions
    42.03 A, B II, III et C du tarif douanier commun, originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2387/86 der Kommission vom 29. Juli 1986 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör aus Leder oder
    Kunstleder der Tarifstellen 42.03 A, B II, B III und C des Gemeinsamen Zolltarifs
    mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3599/85 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2387/86 af 29. juli 1986 om genindførelse
