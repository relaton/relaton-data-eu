type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1144/80 of 6 May 1980 re-establishing the
    levying of customs duties on twine, cordage, ropes and cables of abaca (Manila
    hemp) or of true hemp, products of category 145 (code 1450), originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1144/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux ficelles, cordes et cordages
    d' abaca et de chanvre de la catégorie de produits n° 145 (code 1450), originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1144/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Bindfäden, Seile und Taue aus Hanf und Manilahanf der Warenkategorie
    Nr. 145 (Kennziffer 1450), mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1144/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, af manila (abaca)
    og af hamp, under varekategori 145 (kode 1450), som har oprindelse i Jugoslavien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1144/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili allo spago, corde e funi
    di abaca o di canapa, della categoria di prodotti n. 145 (codice 1450), originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1144/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel van abaca of van hennep, van de categorie van produkten nr. 145
    (codenummer 1450), van oorsprong uit Joegoslavië waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
