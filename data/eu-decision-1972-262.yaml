title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 juin 1972, portant dérogation à la
    recommandation n° 1-64 de la Haute Autorité relative à un relèvement de la
    protection frappant les produits sidérurgiques à la périphérie de la Communauté
    (quarante-neuvième dérogation)
  type: main
- language: de
  script: Latn
  content: '72/262/EWG: Entscheidung der Kommission vom 28. Juni 1972 betreffend Ausnahmen
    von der Empfehlung Nr. 1/64 der Hohen Behörde über eine Erhöhung des Außenschutzes
    gegenüber Einfuhren von Stahlerzeugnissen in der Gemeinschaft (neunundvierzigste
    Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '72/262/CEE: Decisione della Commissione, del 28 giugno 1972, che autorizza
    deroghe alla raccomandazione n. 1-64 dell''Alta Autorità relativa al rafforzamento
    della protezione che colpisce i prodotti siderurgici all''entrata nella Comunità
    (quarantanovesima deroga)'
  type: main
- language: nl
  script: Latn
  content: '72/262/EEG: Beschikking van de Commissie van 28 juni 1972 houdende afwijking
    van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende een verhoging van
    de bescherming van ijzer- en staalprodukten aan de buitengrenzen van de Gemeenschap
    (negenenveertigste uitzonderingsbeschikking)'
