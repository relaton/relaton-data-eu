title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 678/83 of 24 March 1983 re-establishing
    the levying of customs duties on clothing accessories and articles, knitted or
    crocheted, products of category 67 (code 0670), originating in India, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 678/83 de la Commission du 24 mars 1983 portant rétablissement
    de la perception des droits de douane applicables aux accessoires du vêtement
    et articles de bonneterie de la catégorie 67 (code 0670), originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 678/83 der Kommission vom 24. März 1983 über die
    Wiedereinführung des Zollsatzes für Bekleidungszubehör und andere Wirkwaren
    der Warenkategorie Nr. 67 (Kennziffer 0670), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 678/83 af 24. marts 1983 om genindførelse
    af opkrævning af toldafgifter for tilbehør til beklædningsgenstande og varer
    af trikotage under kategori nr. 67 (kode 0670), som har oprindelse i Indien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 678/83 της Επιτροπής
    της 24ης Μαρτίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για συμπληρώματα
    πλεκτά της ενδύσεως και πλεκτά είδη της κατηγορίας
    67 (κώδικας 0670), καταγωγής Ινδίας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 678/83 della Commissione del 24 marzo 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli accessori di abbigliamento ed
    altri manufatti a maglia, della categoria di prodotti n. 67 (codice 0670), originari
    dell' India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 678/83 van de Commissie van 24 maart 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kledingtoebehoren
    en artikelen van de categorie van produkten nr. 67 (codenummer 0670), van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3378/82 van de Raad
  type: main
