---
id: EUDecision20201580
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/1580 of 23 October 2020 amending Decision (EU)
    2020/721 to include the position to be taken on behalf of the European Union within
    the International Maritime Organization’s Marine Environment Protection Committee
    during its 75th session and within the International Maritime Organization’s
    Maritime Safety Committee during its 102nd session as regards the approval of
    an MSC-MEPC.5 circular on a Model agreement for the authorization of recognized
    organizations acting on behalf of the Administration
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1580 du Conseil du 23 octobre 2020 modifiant la décision
    (UE) 2020/721 afin d’y inclure la position à prendre au nom de l’Union européenne
    au sein du Comité de la protection du milieu marin de l’Organisation maritime
    internationale lors de sa 75e session et au sein du Comité de la sécurité maritime
    de l’Organisation maritime internationale lors de sa 102e session en ce qui
    concerne l’approbation d’une circulaire MSC-MEPC.5 relative à un modèle
    d’accord pour l’habilitation des organismes agréés agissant au nom de l’administration
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/1580 des Rates vom 23. Oktober 2020 zur Änderung des
    Beschlusses (EU) 2020/721 zwecks Aufnahme des Standpunkts, der im Namen der Europäischen
    Union auf der 75. Tagung des Ausschusses für den Schutz der Meeresumwelt der
    Internationalen Seeschifffahrtsorganisation und der 102. Tagung des Schiffssicherheitsausschusses
    der Internationalen Seeschifffahrtsorganisation zu der Billigung eines MSC-MEPC.5/Rundschreibens
    über eine Mustervereinbarung für die Ermächtigung anerkannter Organisationen
    zum Tätigwerden für die Verwaltung zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2020/1580 на Съвета от 23 октомври
    2020 година за изменение на Решение (ЕС) 2020/721,
    така че в него да бъде включена позицията, която
    трябва да се заеме от името на Европейския
    съюз в рамките на Международната морска организация
    по време на 75-ата сесия на Комитета по опазване
    на морската среда и 102-рата сесия на Комитета
    по морска безопасност във връзка с одобряването
    на циркулярно писмо MSC-MEPC.5 относно типово споразумение
    за упълномощаване на признати организации,
    действащи от името на администрацията
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2020/1580 ze dne 23. října 2020, kterým se mění
    rozhodnutí (EU) 2020/721, aby zahrnovalo postoj, jenž má být zaujat jménem
    Evropské unie na 75. zasedání Výboru pro ochranu mořského prostředí a
    na 102. zasedání Výboru pro námořní bezpečnost Mezinárodní námořní
    organizace, pokud jde o schválení oběžníku MSC-MEPC.5 o vzorové dohodě
    o zmocnění uznaných subjektů jednajících jménem správy
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2020/1580 af 23. oktober 2020 om ændring af afgørelse
    (EU) 2020/721 med henblik på at medtage den holdning, der skal indtages på Den
    Europæiske Unions vegne på den 75. samling i Den Internationale Søfartsorganisations
    Komité til Beskyttelse af Havmiljøet og på den 102. samling i Den Internationale
    Søfartsorganisations Komité for Sikkerhed på Søen til godkendelsen af et MSC-MEPC.5-cirkulære
    om en model til aftale om autorisation af anerkendte organisationer, der handler
    på myndighedernes vegne
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2020/1580 του Συμβουλίου της 23ης
    Οκτωβρίου 2020 για την τροποποίηση της απόφασης
    (ΕΕ) 2020/721, ώστε να συμπεριληφθεί η θέση που πρέπει
    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    στο πλαίσιο της Επιτροπής Προστασίας Θαλάσσιου
    Περιβάλλοντος του Διεθνούς Ναυτιλιακού Οργανισμού
    κατά την 75η σύνοδό της και στο πλαίσιο της Επιτροπής
    Ναυτικής Ασφάλειας του Διεθνούς Ναυτιλιακού
    Οργανισμού κατά την 102η σύνοδό της σχετικά
    με την έγκριση εγκυκλίου MSC-MEPC.5 σχετικά με πρότυπη
    συμφωνία για την εξουσιοδότηση αναγνωρισμένων
    οργανισμών που ενεργούν εξ ονόματος των αρχών
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2020/1580, 23. oktoober 2020, millega muudetakse otsust
    (EL) 2020/721, et lisada sellesse Euroopa Liidu nimel Rahvusvahelise Mereorganisatsiooni
    merekeskkonna kaitse komitee 75. istungjärgul ja meresõiduohutuse komitee 102.
    istungjärgul võetav seisukoht seoses ringkirja MSC-MEPC.5 (milles käsitletakse
    ametiasutuse nimel tegutsevate tunnustatud organisatsioonide volitamise näidislepingut)
    heakskiitmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2020/1580, annettu 23 päivänä lokakuuta 2020,
    päätöksen (EU) 2020/721 muuttamisesta Euroopan unionin puolesta kansainvälisen
    merenkulkujärjestön meriympäristön suojelukomitean 75. istunnossa ja kansainvälisen
    merenkulkujärjestön meriturvallisuuskomitean 102. istunnossa otettavan, viranomaisen
    puolesta toimivien hyväksyttyjen laitosten valtuuttamista koskevasta mallisopimuksesta
    annettavan kiertokirjeen MSC-MEPC.5 hyväksymistä koskevan kannan sisällyttämiseksi
    päätökseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2020/1580 ón gComhairle an 23 Deireadh Fómhair 2020 lena
    leasaítear Cinneadh (AE) 2020/721 ionas go n‐áirítear an seasamh atá le
    glacadh thar ceann an Aontais Eorpaigh in Eagraíocht Mhuirí Idirnáisiúnta
    le linn an 75ú seisiún den Choiste um Chaomhnú an Chomhshaoil Mhuirí agus
    an 102ú seisiún den Choiste Muir-Shábháilteachta i dtaca le formheas chiorclán
    MSC-MEPC.5 i dtaca le Samhail-Chomhaontú maidir le húdarú Eagraíochtaí Aitheanta
    a ghníomhaíonn thar ceann an Chórais Riaracháin
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2020/1580 od 23. listopada 2020. o izmjeni Odluke (EU)
    2020/721 kako bi se uključilo stajalište koje treba zauzeti u ime Europske unije
    u okviru Međunarodne pomorske organizacije na 75. sjednici Odbora za zaštitu
    morskog okoliša i 102. sjednici Odbora za pomorsku sigurnost u pogledu odobrenja
    okružnice MSC-MEPC.5 o predlošku sporazuma za ovlašćivanje priznatih organizacija
    koje djeluju u ime uprave
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2020/1580 határozata (2020. október 23.) az (EU) 2020/721
    határozatnak az Európai Unió nevében a Nemzetközi Tengerészeti Szervezet
    Tengerikörnyezet-védelmi Bizottságában annak 75. ülésén és a Nemzetközi
    Tengerészeti Szervezet Tengerészeti Biztonsági Bizottságában annak 102. Ülésén
    a hatóság nevében eljáró elismert szervezetek felhatalmazására vonatkozó
    megállapodásmintáról szóló MSC-MEPC.5. körlevél jóváhagyása tekintetében
    képviselendő álláspont beillesztése céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2020/1580 del Consiglio del 23 ottobre 2020 che modifica
    la decisione (UE) 2020/721 al fine di includervi la posizione da adottare a nome
    dell’Unione europea in sede di comitato per la protezione dell’ambiente marino
    dell’Organizzazione marittima internazionale in occasione della sua 75a sessione
    e in sede di comitato per la sicurezza marittima dell’Organizzazione marittima
    internazionale in occasione della sua 102a sessione in riferimento all’approvazione
    di una circolare MSC-MEPC.5 su un modello di accordo per il rilascio di autorizzazioni
    a favore di organismi riconosciuti che operano per conto dell’amministrazione
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2020/1580 (2020. gada 23. oktobris), ar ko Lēmumu
    (ES) 2020/721 groza, lai iekļautu nostāju, kas Eiropas Savienības vārdā jāieņem
    Starptautiskās Jūrniecības organizācijas Jūras vides aizsardzības komitejas
    75. sesijā un Kuģošanas drošības komitejas 102. sesijā attiecībā uz MSC-MEPC.5.
    apkārtraksta par paraugnolīgumu tādu atzīto organizāciju pilnvarošanai,
    kuras rīkojas administrācijas vārdā, apstiprināšanu
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2020/1580 2020 m. spalio 23 d. kuriuo iš dalies
    keičiamas Sprendimas (ES) 2020/721, kad būtų įtraukta pozicija, kurios Europos
    Sąjungos vardu turi būti laikomasi Tarptautinės jūrų organizacijos Jūrų
    aplinkos apsaugos komiteto 75-ojoje sesijoje ir Tarptautinės jūrų organizacijos
    Jūrų saugumo komiteto 102-ojoje sesijoje, dėl MSC-MEPC.5 aplinkraščio dėl
    administracijos vardu veikiančių pripažintų organizacijų įgaliojimo tipinės
    sutarties patvirtinimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2020/1580 tat-23 ta’ Ottubru 2020 li temenda
    d-Deċiżjoni (UE) 2020/721 biex tinkludi l-pożizzjoni li għandha tittieħed
    f’isem l-Unjoni Ewropea waqt il-75 sessjoni tal-Kumitat tal-Protezzjoni tal-Ambjent
    tal-Baħar, tal-Organizzazzjoni Marittima Internazzjonali, u waqt il-102 sessjoni
    tal-Kumitat tas-Sikurezza Marittima, tal-Organizzazzjoni Marittima Internazzjonali
    fir-rigward tal-approvazzjoni ta’ ċirkolari MSC-MEPC.5 dwar Mudell ta’ Ftehim
    għall-awtorizzazzjoni ta’ organizzazzjonijiet rikonoxxuti li jaġixxu f’isem
    l-Amministrazzjoni
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2020/1580 van de Raad van 23 oktober 2020 tot wijziging van
    Besluit (EU) 2020/721 teneinde het standpunt vast te stellen dat namens de Europese
    Unie moet worden ingenomen tijdens de 75e zitting van de Commissie voor de bescherming
    van het mariene milieu van de Internationale Maritieme Organisatie en de 102e
    zitting van de Maritieme Veiligheidscommissie van de Internationale Maritieme
    Organisatie ten aanzien van de goedkeuring van een MSC-MEPC.5-circulaire over
    een modelovereenkomst voor de machtiging van erkende organisaties die namens de
    overheid optreden
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2020/1580 z dnia 23 października 2020 r. zmieniająca
    decyzję (UE) 2020/721 w celu uwzględnienia stanowiska, jakie ma zostać zajęte
    w imieniu Unii Europejskiej na forum Międzynarodowej Organizacji Morskiej podczas
    75. posiedzenia Komitetu Ochrony Środowiska Morskiego i 102. posiedzenia Komitetu
    Bezpieczeństwa na Morzu w odniesieniu do zatwierdzenia okólnika MSC-MEPC.5 w
    sprawie wzoru umowy dotyczącej upoważniania uznanych organizacji działających
    w imieniu administracji
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2020/1580 do Conselho de 23 de outubro de 2020 que altera
    a Decisão (UE) 2020/721 a fim de incluir a posição a tomar, em nome da União
    Europeia, no âmbito da Organização Marítima Internacional, durante a 75.a
    sessão do seu Comité para a Proteção do Meio Marinho e na 102.a sessão do
    seu Comité de Segurança Marítima, sobre a aprovação de uma Circular MSC-MEPC.5
    relativa a um acordo-modelo de autorização das organizações reconhecidas que
    atuam em nome da administração
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2020/1580 a Consiliului din 23 octombrie 2020 de modificare
    a Deciziei (UE) 2020/721 pentru a include poziția care urmează să fie adoptată
    în numele Uniunii Europene în cadrul Comitetului pentru protecția mediului
    marin al Organizației Maritime Internaționale cu ocazia celei de a 75-a sesiuni
    a acestuia și în cadrul Comitetului pentru siguranță maritimă al Organizației
    Maritime Internaționale cu ocazia celei de a 102-a sesiuni a acestuia în ceea
    ce privește aprobarea unei circulare MSC-MEPC.5 privind un model de acord pentru
    autorizarea organizațiilor recunoscute care acționează în numele administrației
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2020/1580 z 23. októbra 2020, ktorým sa mení
    rozhodnutie (EÚ) 2020/721 s cieľom zahrnúť pozíciu, ktorá sa má v mene
    Európskej únie zaujať vo Výbore Medzinárodnej námornej organizácie pre
    ochranu morského prostredia na 75. zasadnutí a vo Výbore Medzinárodnej námornej
    organizácie pre námornú bezpečnosť na 102. zasadnutí, pokiaľ ide o schválenie
    obežníka MSC-MEPC.5 o vzorovej dohode týkajúcej sa oprávnenia uznaných organizácií,
    ktoré konajú v mene úradu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2020/1580 z dne 23. oktobra 2020 o spremembi Sklepa (EU)
    2020/721, da se vključi stališče, ki se v imenu Evropske unije zastopa na 75.
    zasedanju Odbora za varstvo morskega okolja in 102. zasedanju Odbora za pomorsko
    varnost Mednarodne pomorske organizacije v zvezi s potrditvijo Okrožnice MSC-MEPC.5
    o vzorčnem sporazumu za pooblaščanje priznanih organizacij, ki delujejo v imenu
    uprave
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2020/1580 del Consejo de 23 de octubre de 2020 por la que
    se modifica la Decisión (UE) 2020/721 para incluir la posición que debe adoptarse
    en nombre de la Unión Europea en el Comité de Protección del Medio Marino de
    la Organización Marítima Internacional en su 75.o período de sesiones y en
    el Comité de Seguridad Marítima de la Organización Marítima Internacional
    en su 102.o período de sesiones, en lo relativo a la aprobación de una circular
    MSC-MEPC.5 sobre el modelo de acuerdo para autorizar a organizaciones reconocidas
    que actúen en nombre de la administración
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2020/1580 av den 23 oktober 2020 om ändring av beslut
    (EU) 2020/721 i syfte att inkludera den ståndpunkt som ska intas på Europeiska
    unionens vägnar i Internationella sjöfartsorganisationens kommitté för skydd
    av den marina miljön vid dess 75:e mote och i Internationella sjöfartsorganisationens
    sjösäkerhetskommitté vid dess 102:a mote vad gäller godkännande av ett MSC-MEPC.5-cirkulär
    om ett modellavtal för bemyndigande av erkända organisationer som agerar på
    administrationens vägnar
  type: main
