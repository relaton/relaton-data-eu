    2011 a 2012 s cieľom zabezpečiť dodržiavanie maximálnych hladín rezíduí
    pesticídov v a na potravinách rastlinného a živočíšneho pôvodu a posúdiť
    vystavenie spotrebiteľov týmto rezíduám
  type: main
