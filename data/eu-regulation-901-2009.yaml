title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 901/2009 of 28 September 2009 concerning
    a coordinated multiannual Community control programme for 2010, 2011 and 2012
    to ensure compliance with maximum levels of and to assess the consumer exposure
    to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 901/2009 de la Commission du 28 septembre 2009 concernant
    un programme communautaire de contrôle, pluriannuel et coordonné, pour 2010,
    2011 et 2012, destiné à garantir le respect des teneurs maximales en résidus
    de pesticides dans et sur les denrées alimentaires d’origine végétale et
    animale et à évaluer l’exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 901/2009 der Kommission vom 28. September 2009 über
    ein mehrjähriges koordiniertes Kontrollprogramm der Gemeinschaft für 2010, 2011
    und 2012 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    in oder auf Lebensmitteln pflanzlichen und tierischen Ursprungs und zur Bewertung
    der Verbraucherexposition
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 901/2009 на Комисията от 28
    септември 2009 година относно координирана многогодишна
    контролна програма на Общността за 2010, 2011 и
    2012 г. за гарантиране спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от животински
    и растителен произход и за оценка на потребителската
    експозиция на тези остатъчни вещества
  type: main
