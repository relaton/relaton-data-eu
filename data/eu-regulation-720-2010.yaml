---
id: EURegulation7202010
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 720/2010 of 11 August 2010 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 599/2009 on imports of biodiesel originating in
    the United States of America by imports of biodiesel consigned from Canada and
    Singapore, whether declared as originating in Canada and Singapore or not and
    by imports of biodiesel in a blend containing by weight 20 % or less of biodiesel
    originating in the United States of America, and making such imports subject to
    registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 720/2010 de la Commission du 11 août 2010 portant
    ouverture d’une enquête relative à un possible contournement des mesures antidumping
    instituées par le règlement (CE) n ° 599/2009 du Conseil sur les importations
    de biodiesel originaire des États-Unis d’Amérique par des importations de
    biodiesel expédié du Canada et de Singapour, qu’il ait ou non été déclaré
    originaire de ces pays, et par des importations de biodiesel sous forme de mélange
    contenant, en poids, 20 % ou moins de biodiesel originaire des États-Unis d’Amérique,
    et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 720/2010 der Kommission vom 11. August 2010 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 599/2009 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren von Biodiesel mit Ursprung in den Vereinigten Staaten von Amerika durch
    aus Kanada und Singapur versandte Einfuhren von Biodiesel, ob als Ursprungserzeugnisse
    Kanadas oder Singapurs angemeldet oder nicht, und durch Einfuhren von Biodiesel
    als Mischung mit einem Gehalt an Biodiesel von bis zu 20 GHT mit Ursprung in den
    Vereinigten Staaten von Amerika sowie zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 720/2010 на Комисията от 11
    август 2010 година за започване на разследване
    във връзка с евентуално заобикаляне на антидъмпинговите
    мерки, наложени с Регламент (ЕО) № 599/2009 на Съвета
    върху вноса на биодизел с произход от Съединените
    американски щати, чрез внос на биодизел, изпращан
    от Канада и Сингапур, независимо дали е деклариран
    с произход от Канада и Сингапур, или не, и чрез
    внос на биодизел в смес с тегловно съдържание
    на биодизел по-малко или равно на 20 % с произход
    от Съединените американски щати, и за въвеждане
    на регистрационен режим за този внос
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 720/2010 ze dne 11. srpna 2010 o zahájení
    šetření možného obcházení antidumpingových opatření uložených nařízením
    Rady (ES) č. 599/2009 na dovoz bionafty pocházející ze Spojených států
    amerických prostřednictvím dovozu bionafty zasílané z Kanady a Singapuru,
    bez ohledu na to, zda je u ní deklarován původ z Kanady a Singapuru, a prostřednictvím
    dovozu bionafty ve formě směsi obsahující 20 % hmotnostních nebo méně bionafty
    pocházející ze Spojených států amerických, a o zavedení celní evidence
    tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 720/2010 af 11. august 2010 om indledning
    af en undersøgelse vedrørende den mulige omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 599/2009 om importen af biodiesel
    med oprindelse i Amerikas Forenede Stater gennem importen af biodiesel afsendt
    fra Canada og Singapore, uanset om det er angivet med oprindelse i Canada og Singapore,
    og gennem importen af biodiesel i blandinger indeholdende 20 vægtprocent eller
    mindre biodiesel med oprindelse i Amerikas Forenede Stater, og om at gøre denne
    import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 720/2010 της Επιτροπής,
    της 11ης Αυγούστου 2010 , σχετικά με την έναρξη
    έρευνας όσον αφορά την πιθανή καταστρατήγηση
    των μέτρων αντιντάμπινγκ που επιβλήθηκαν με
    τον κανονισμό (ΕΚ) αριθ. 599/2009 του Συμβουλίου
    στις εισαγωγές βιοντίζελ καταγωγής Ηνωμένων
    Πολιτειών της Αμερικής από εισαγωγές βιοντίζελ
    που αποστέλλονται από τον Καναδά και τη Σιγκαπούρη,
    είτε δηλώνονται ως καταγωγής Καναδά και Σιγκαπούρης
    είτε όχι, και από εισαγωγές βιοντίζελ σε μορφή
    μείγματος με περιεκτικότητα κατά βάρος που
    δεν υπερβαίνει το 20 % σε βιοντίζελ καταγωγής
    Ηνωμένων Πολιτειών Αμερικής και σχετικά με
    την υπαγωγή αυτών των εισαγωγών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 720/2010, 11. august 2010 , millega algatatakse
    uurimine seoses võimaliku kõrvalehoidmisega Ameerika Ühendriikidest pärit
    biodiislikütuse impordi suhtes nõukogu määrusega (EÜ) nr 599/2009 kehtestatud
    dumpinguvastastest meetmetest Kanadast ja Singapurist lähetatud biodiislikütuse
    impordi kaudu, olenemata sellest, kas see on deklareeritud Kanadast ja Singapurist
    pärinevana või mitte, ja Ameerika Ühendriikidest pärit, 20 või vähem massiprotsenti
    biodiislikütust sisaldava segatud biodiislikütuse impordi kaudu, ning kehtestatakse
    kõnealuse impordi suhtes registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 720/2010, annettu 11 päivänä elokuuta 2010
    , Amerikan yhdysvalloista peräisin olevan biodieselin tuonnissa neuvoston asetuksella
    (EY) N:o 599/2009 käyttöön otettujen polkumyynnin vastaisten toimenpiteiden
    mahdollista kiertämistä biodieselin tuonnilla Kanadasta ja Singaporesta, riippumatta
    siitä, onko alkuperämaaksi ilmoitettu Kanada tai Singapore, ja Amerikan yhdysvalloista
    peräisin olevan sellaisen biodieselseoksen tuonnilla, jossa on enintään 20
    painoprosenttia biodieseliä, koskevan tutkimuksen vireillepanosta ja kyseisen
    tuonnin kirjaamisvelvoitteesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 720/2010 od 11. kolovoza 2010. o pokretanju ispitnog
    postupka o mogućem izbjegavanju antidampinških mjera uvedenih Uredbom Vijeća
    (EZ) br. 599/2009 na uvoz biodizela podrijetlom iz Sjedinjenih Američkih Država
    putem uvoza biodizela isporučenog iz Kanade i Singapura, bez obzira na to ima
    li deklarirano podrijetlo iz Kanade i Singapura ili ne i putem uvoza biodizela
    u mješavini s masenim udjelom biodizela od 20 % ili manjim, podrijetlom iz Sjedinjenih
    Američkih Država, te o uvjetovanju takvog uvoza evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság 720/2010/EU rendelete ( 2010. augusztus 11. ) az 599/2009/EK
    tanácsi rendelettel az Egyesült Államokból származó biodízel behozatalával
    szemben bevezetett dömpingellenes intézkedéseknek a Kanadában és Szingapúrban
    feladott biodízel – függetlenül attól, hogy Kanadából vagy Szingapúrból
    származónak nyilvánították-e – behozatala, valamint az Egyesült Államokból
    legfeljebb 20 tömegszázalék biodízelt tartalmazó keverék behozatala révén
    történő lehetséges kijátszására vonatkozó vizsgálat megindításáról,
    valamint e behozatalok nyilvántartásbavételi kötelezettségének előírásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 720/2010 della Commissione, dell' 11 agosto 2010 ,
    che apre un'inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento (CE) n. 599/2009 del Consiglio sulle importazioni di
    biodiesel originario degli Stati Uniti d'America mediante importazioni di biodiesel
    spedito dal Canada e da Singapore, indipendentemente dal fatto che sia dichiarato
    o meno originario del Canada o di Singapore, nonché mediante importazioni di
    biodiesel in miscela contenente in peso il 20 % o meno di biodiesel originario
    degli Stati Uniti d'America, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 720/2010 ( 2010. gada 11. augusts ), ar kuru
    sāk izmeklēšanu par iespējamo to antidempinga pasākumu apiešanu, kas ar
    Padomes Regulu (EK) Nr. 599/2009 noteikti Amerikas Savienoto Valstu izcelsmes
    biodīzeļdegvielas importam, ko veic, to nosūtot no Kanādas un Singapūras,
    neatkarīgi no tā, vai tā ir vai nav deklarēta ar izcelsmi Kanādā un Singapūrā,
    un maisījumā, kurā Amerikas Savienoto Valstu izcelsmes biodīzeļdegvielas
    saturs nepārsniedz 20 % masas, un ar kuru šādam importam piemēro reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2010 m. rugpjūčio 11 d. Komisijos reglamentas (ES) Nr. 720/2010, kuriuo
    inicijuojamas tyrimas dėl galimo antidempingo priemonių, nustatytų Tarybos
    reglamentu (ES) Nr. 599/2009 importuojamam Jungtinių Amerikos Valstijų kilmės
    biodyzelinui, vengimo importuojant iš Kanados ir Singapūro siunčiamą biodyzeliną,
    deklaruojant kaip Kanados ir Singapūro kilmės arba nedeklaruojant, ir importuojant
    Jungtinių Amerikos Valstijų kilmės dyzeliną kaip mišinį, kurio sudėtyje
    yra 20 % masės arba mažiau biodyzelino, ir nustatomas reikalavimas registruoti
    tokį importą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 720/2010 tal- 11 ta’ Awwissu 2010
    li jiftaħ investigazzjoni rigward il-possibbiltà li ġew evitati miżuri anti-dumping
    imposti mir-Regolament tal-Kunsill (KE) Nru 599/2009 fuq l-importazzjonijiet tal-bijodiżil
    li joriġinaw mill-Istati Uniti tal-Amerika permezz ta’ importazzjonijiet tal-bijodiżil
    ikkunsinjati mill-Kanada u minn Singapor, kemm jekk iddikjarati bħala li joriġinaw
    mill-Kanada u minn Singapor u kemm jekk le, u permezz ta’ importazzjonijiet
    tal-bijodiżil f’taħlita li fiha bil-piż 20 % jew inqas ta’ bijodiżil li
    joriġinaw mill-Istati Uniti tal-Amerika, u li jagħmel tali importazzjonijiet
    suġġetti għal reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 720/2010 van de Commissie van 11 augustus 2010 tot
    opening van een onderzoek naar de mogelijke ontwijking van de bij Verordening
    (EG) nr. 599/2009 van de Raad ingestelde antidumpingmaatregelen ten aanzien van
    biodiesel van oorsprong uit de Verenigde Staten van Amerika, door de invoer van
    vanuit Canada en Singapore verzonden biodiesel, ongeacht of deze als van oorsprong
    uit Canada en Singapore is aangegeven, en door de invoer van biodiesel in een
    mengsel bevattende 20 of minder gewichtsprocenten biodiesel van oorsprong uit
    de Verenigde Staten van Amerika, en tot onderwerping van deze invoer aan een registratieplicht
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 720/2010 z dnia 11 sierpnia 2010 r. wszczynające
    dochodzenie dotyczące możliwego obchodzenia środków antydumpingowych wprowadzonych
    na mocy rozporządzenia Rady (WE) nr 599/2009 względem przywozu biodiesla pochodzącego
    ze Stanów Zjednoczonych Ameryki poprzez przywóz biodiesla wysyłanego z Kanady
    i Singapuru niezależnie od tego, czy został zgłoszony jako pochodzący z Kanady
    i Singapuru czy też nie, oraz poprzez przywóz biodiesla w postaci mieszanki
    zawierającej wagowo maksymalnie 20 % biodiesla pochodzącego ze Stanów Zjednoczonych
    Ameryki, i poddające ten przywóz rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 720/2010 da Comissão, de 11 de Agosto de 2010 ,
    que inicia um inquérito sobre a eventual evasão às medidas anti-dumping instituídas
    pelo Regulamento (CE) n. ° 599/2009 do Conselho sobre as importações de biodiesel
    originário dos Estados Unidos da América pelas importações de biodiesel expedido
    do Canadá e de Singapura, quer seja ou não declarado originário do Canadá
    e de Singapura, e pelas importações de biodiesel numa mistura que contenha,
    em peso, 20 % ou menos de biodiesel originário dos Estados Unidos da América,
    e que torna obrigatório o registo destas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 720/2010 al Comisiei din 11 august 2010 de deschidere
    a unei anchete referitoare la o eventuală eludare a măsurilor antidumping impuse
    prin Regulamentul (CE) nr. 599/2009 al Consiliului asupra importurilor de biomotorină
    originară din Statele Unite ale Americii prin importuri de biomotorină expediate
    din Canada și Singapore, declarate sau nu originare din Canada și Singapore
    și prin importuri de biomotorină într-un amestec cu un conținut în greutate
    de maximum 20 % de biomotorină originară din Statele Unite ale Americii și
    de supunere a acestor importuri înregistrării
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 720/2010 z 11. augusta 2010 , ktorým sa začína
    prešetrovanie týkajúce sa možného obchádzania antidumpingových opatrení
    uložených nariadením Rady (ES) č. 599/2009 o dovoze bionafty s pôvodom v
    Spojených štátoch amerických prostredníctvom dovozu bionafty odosielanej
    z Kanady a zo Singapuru, ktorá je alebo nie je deklarovaná ako s pôvodom v
    Kanade a Singapure, a prostredníctvom dovozu bionafty v podobe zmesi s obsahom
    najviac 20 % hmotnosti bionafty s pôvodom v Spojených štátoch amerických,
    na základe ktorého tento dovoz podlieha registrácii
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 720/2010 z dne 11. avgusta 2010 o začetku preiskave
    glede morebitnega izogibanja protidampinškim ukrepom, uvedenim z Uredbo Sveta
    (ES) št. 599/2009 za uvoz biodizla s poreklom iz Združenih držav Amerike, pri
    uvozu biodizla, poslanega iz Kanade ali Singapurja, ne glede na to, ali je deklariran
    kot izdelek s poreklom iz Kanade in Singapurja ali ne, in uvozu biodizla v mešanici
    z vsebnostjo največ 20 mas. % biodizla s poreklom iz Združenih držav Amerike
    ter uvedbi registracije takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 720/2010 de la Comisión, de 11 de agosto de 2010
    , por el que se inicia una investigación sobre la posible elusión de las medidas
    antidumping impuestas por el Reglamento (CE) n ° 599/2009 a las importaciones
    de biodiésel originario de los Estados Unidos de América por parte de las importaciones
    de biodiésel expedido desde Canadá y Singapur, esté o no declarado como originario
    de Canadá y Singapur, y por parte de las importaciones de biodiésel en mezclas
    con un contenido igual o inferior al 20 % en peso de biodiésel originario de
    los Estados Unidos de América, y por el que tales importaciones quedan sujetas
    a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 720/2010 av den 11 augusti 2010 om inledande
    av en undersökning rörande eventuellt kringgående av de antidumpningsåtgärder
    som infördes genom rådets förordning (EG) nr 599/2009 beträffande import av
    biodiesel med ursprung i Amerikas förenta stater genom import av biodiesel som
    avsänts från Kanada och Republiken Singapore, oavsett om dess deklarerade ursprung
    är Kanada och Republiken Singapore eller inte, och genom import av biodiesel
    i en blandning innehållande högst 20 viktprocent biodiesel med ursprung i Amerikas
    förenta stater samt om registrering av sådan import
  type: main
