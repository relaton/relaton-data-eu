title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2314 of 25 November 2022 renewing
    the approval of the active substance Pythium oligandrum strain M1 in accordance
    with Regulation (EC) No 1107/2009 of the European Parliament and of the Council
    concerning the placing of plant protection products on the market, and amending
    the Annex to Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2314 de la Commission du 25 novembre
    2022 renouvelant l’approbation de la substance active «Pythium oligandrum,
    souche M1», conformément au règlement (CE) no 1107/2009 du Parlement européen
    et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    et modifiant l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2314 der Kommission vom 25. November
    2022 zur Erneuerung der Genehmigung für den Wirkstoff Pythium oligandrum Stamm
    M1 gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments und
    des Rates über das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung
    des Anhangs der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
