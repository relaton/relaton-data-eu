    Feidhme (AE) Uimh. 540/2011 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2314 оd 25. studenoga 2022. o produljenju
    odobrenja aktivne tvari Pythium oligandrum soj M1 u skladu s Uredbom (EZ) br.
    1107/2009 Europskog parlamenta i Vijeća o stavljanju na tržište sredstava za
    zaštitu bilja te o izmjeni Priloga Provedbenoj uredbi Komisije (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2022/2314 végrehajtási rendelete (2022. november 25.)
    a Pythium oligandrum (törzs: M1) hatóanyagnak a növényvédő szerek forgalomba
    hozataláról szóló 1107/2009/EK európai parlamenti és tanácsi rendelet szerinti
    jóváhagyása meghosszabbításáról, valamint az 540/2011/EU bizottsági végrehajtási
    rendelet mellékletének módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2314 della Commissione del 25 novembre
    2022 che rinnova l’approvazione della sostanza attiva Pythium oligandrum ceppo
    M1, in conformità al regolamento (CE) n. 1107/2009 del Parlamento europeo e del
    Consiglio relativo all’immissione sul mercato dei prodotti fitosanitari, e che
    modifica l’allegato del regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2314 (2022. gada 25. novembris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par
    augu aizsardzības līdzekļu laišanu tirgū atjauno darbīgās vielas Pythium
    oligandrum celma M1 apstiprinājumu un groza Komisijas Īstenošanas regulas (ES)
    Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/2314 2022 m. lapkričio 25
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką pratęsiamas veikliosios medžiagos
    Pythium oligandrum padermės M1 patvirtinimo galiojimas ir iš dalies keičiamas
    Komisijos įgyvendinimo reglamento (ES) Nr. 540/2011 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2314 tal-25
