    stam M1 overeenkomstig Verordening (EG) nr. 1107/2009 van het Europees Parlement
    en de Raad betreffende het op de markt brengen van gewasbeschermingsmiddelen,
    en tot wijziging van de bijlage bij Uitvoeringsverordening (EU) nr. 540/2011 van
    de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2314 z dnia 25 listopada 2022
