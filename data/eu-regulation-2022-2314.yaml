    M1, zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (WE) nr 1107/2009
    dotyczącym wprowadzania do obrotu środków ochrony roślin, oraz w sprawie zmiany
    załącznika do rozporządzenia wykonawczego Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2314 da Comissão de 25 de novembro
