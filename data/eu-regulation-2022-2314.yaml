    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/2314, 25. november 2022, millega pikendatakse
    toimeaine Pythium oligandrum’i (tüvi M1) heakskiitu vastavalt Euroopa Parlamendi
