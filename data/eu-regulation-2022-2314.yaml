    на активното вещество Pythium oligandrum – щам M1, в
    съответствие с Регламент (ЕО) № 1107/2009 на Европейския
    парламент и на Съвета относно пускането на
    пазара на продукти за растителна защита и за
    изменение на приложението към Регламент за
    изпълнение (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
