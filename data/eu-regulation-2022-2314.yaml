    kterým se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009
    o uvádění přípravků na ochranu rostlin na trh obnovuje schválení účinné
    látky Pythium oligandrum kmen M1 a kterým se mění příloha prováděcího
