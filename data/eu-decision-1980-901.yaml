title:
- language: en
  script: Latn
  content: '80/901/EEC: Commission Decision of 6 August 1980 authorizing the Italian
    Republic not to apply Community treatment to motor vehicles for the transport
    of persons, falling within subheading ex 87.02 A of the Common Customs Tariff,
    originating in Japan and in free circulation in the other Member States (Only
    the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/901/CEE: Décision de la Commission, du 6 août 1980, autorisant la
    République italienne à exclure du traitement communautaire les voitures automobiles
    à tous moteurs pour le transport des personnes de la sous- position ex 87.02
    A du tarif douanier commun originaires du Japon et mises en libre pratique dans
    les autres Etats membres (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/901/EWG: Entscheidung der Kommission vom 6. August 1980, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Kraftwagen zum Befördern von Personen
    der Tarifstelle ex 87.02 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/901/EØF: Kommissionens beslutning af 6. august 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage automobiler
    til personbefordring, som henhører under pos. ex 87.02 A i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den
    italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/901/CEE: Decisione della Commissione, del 6 agosto 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli autoveicoli
    con qualsiasi motore, per il trasporto di persone, della sottovoce ex 87.02 A
    della tariffa doganale comune, originari del Giappone e messi in libera pratica
    negli altri Stati membri (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/901/EEG: Beschikking van de Commissie van 6 augustus 1980 waarbij de
    Italiaanse Republiek wordt gemachtigd automobielen, ongeacht de soort van de motor,
    voor personenvervoer, van post ex 87.02 A van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Italiaanse
    taal is authentiek)'
  type: main
