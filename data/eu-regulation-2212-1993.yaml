title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2212/93 of 4 August 1993 re-establishing
    the levying of customs duties on products falling within CN code 3923 21 00, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2212/93 de la Commission du 4 août 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 3923
    21 00, originaires de Thaïlande, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2212/93 DER KOMMISSION vom 4. August 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3923 21 00 mit Ursprung in
    Thailand, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2212/93 af 4. august 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3923 21 00 og med oprindelse
    i Thailand, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2212/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 4ης Αυγούστου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3923 21 00, καταγωγής Ταϊλάνδης,
    δικαιούχων των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2212/93 DELLA COMMISSIONE del 4 agosto 1993 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 3923 21
    00 originari della Tailandia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2212/93 VAN DE COMMISSIE van 4 augustus 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3923 21 00, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 2212/93 DA COMISSÃO de 4 de Agosto de 1993 que restabelece
    a cobrança dos direitos aplicáveis aos produtos do código NC 3923 21 00, originários
    da Tailândia, beneficiários das preferências pautais previstas no Regulamento
    (CEE) no 3831/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2212/93 DE LA COMISIÓN de 4 de agosto de 1993 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 3923 21 00 originarios de Tailandia, beneficiarios de
    las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90 del
    Consejo
