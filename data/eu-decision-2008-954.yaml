    provvisorio, misure supplementari contro la propagazione di Bursaphelenchus xylophilus
    (Steiner e Buhrer) Nickle et al. (nematode del pino) per quanto riguarda le regioni
    del Portogallo diverse da quelle notoriamente indenni da questo organismo [notificata
