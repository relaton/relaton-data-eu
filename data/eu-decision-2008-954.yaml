    supplerende foranstaltninger mod spredning af Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (fyrretræsnematoden) for så vidt angår andre områder
    i Portugal end dem, hvor den vides ikke at forekomme (meddelt under nummer K(2008)
    8298)'
  type: main
