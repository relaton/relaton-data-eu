title:
- language: en
  script: Latn
  content: '89/352/EEC: Commission Decision of 12 May 1989 fixing the conversion rate
    to be used pursuant to Council Decision 89/144/EEC extending certain provisions
    on the supply of milk and milk products at a reduced price to cover Portugal (Only
    the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/352/CEE: Décision de la Commission du 12 mai 1989 fixant le taux de
    conversion à utiliser en application de la décision 89/144/CEE du Conseil étendant
    au Portugal le bénéfice de certaines dispositions concernant la cession à prix
    réduit de lait et de produits laitiers (Le texte en langue portugaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/352/EWG: Entscheidung der Kommission vom 12. Mai 1989 zur Festsetzung
    des nach der Entscheidung 89/144/EWG des Rates zur Ausdehnung bestimmter Vorschriften
    über die verbilligte Abgabe von Milch und Milcherzeugnissen auf Portugal anwendbaren
    Umrechnungskurses (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/352/EØF: Kommissionens beslutning af 12. maj 1989 om fastsættelse
    af den omregningskurs, der skal anvendes i medfør af Rådets beslutning 89/144/EØF
    om at lade Portugal være omfattet af visse bestemmelser om overdragelse til nedsat
    pris af mælk og mejeriprodukter (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '89/352/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Μαΐου 1989 για τον καθορισμό του συντελεστή μετατροπής
    που θα χρησιμοποιηθεί σε εφαρμογή της απόφασης
    89/144/ΕΟΚ του Συμβουλίου που επεκτείνει στην
    Πορτογαλία το ευεργέτημα ορισμένων διατάξεων
    όσον αφορά τη χορήγηση σε μειωμένη τιμή γάλακτος
    και γαλακτοκομικών προϊόντων (Το κείμενο στην
    πορτογαλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '89/352/ETY: Komission päätös, tehty 12 päivänä toukokuuta 1989,
    maidon ja maitotuotteiden toimittamista alennettuun hintaan koskevien säännösten
    hyödyn laajentamisesta koskemaan Portugalia tehdyn neuvoston päätöksen 89/144/ETY
    mukaisesti käytettävän muuntokurssin vahvistamisesta (Ainoastaan portugalinkielinen
    teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '89/352/CEE: Decisione della Commissione del 12 maggio 1989 che fissa il
    tasso di conversione da utilizzare in applicazione della decisione 89/144/CEE
    del Consiglio che estende al Portogallo il beneficio di alcune disposizioni concernenti
    la cessione a prezzo ridotto di latte e di prodotti lattiero-caseari (Il testo
    in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '89/352/EEG: Beschikking van de Commissie van 12 mei 1989 tot vaststelling
    van de omrekeningskoers die moet worden toegepast wanneer uitvoering wordt gegeven
    aan Beschikking 89/144/EEG van de Raad tot uitbreiding ten behoeve van Portugal
    van bepaalde voorschriften inzake de verstrekking van melk en zuivelprodukten
    tegen verlaagde prijs (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '89/352/CEE: Decisão da Comissão de 12 de Maio de 1989 que fixa a taxa
    de conversão a utilizar em aplicação da Decisão 89/114/CEE do Conselho, que
    torna extensivo a Portugal o benefício de determinadas disposições relativas
    à cessão, a preço reduzido, de leite e de produtos lácteos (Apenas faz fé
    o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '89/352/CEE: Decisión de la Comisión de 12 de mayo de 1989 por la que
