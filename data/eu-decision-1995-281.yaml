title:
- language: en
  script: Latn
  content: '95/281/EC: Commission Decision of 14 July 1995 amending the information
    contained in the list in the Annex to Commission Regulation (EEC) No 55/87 establishing
    the list of vessels exceeding eight metres length overall permitted to use beam
    trawls within certain coastal areas of the Community'
  type: main
- language: fr
  script: Latn
  content: '95/281/CE: Décision de la Commission, du 14 juillet 1995, modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CEE) n° 55/87
    établissant la liste des bateaux dont la longueur hors tout dépasse huit mètres
    autorisés à pêcher à l''aide de chaluts à perches dans certaines zones côtières
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '95/281/EG: Entscheidung der Kommission vom 14. Juli 1995 zur Änderung
    bestimmter Angaben in der Liste des Anhangs der Verordnung (EWG) Nr. 55/87 zur
    Festlegung der Liste der Schiffe mit einer Länge über alles von mehr als acht
    Metern, die in bestimmten Küstengebieten der Gemeinschaft mit Baumkurren fischen
    dürfen'
  type: main
- language: da
  script: Latn
  content: '95/281/EF: Kommissionens beslutning af 14. juli 1995 om ændring af visse
    oplysninger i listen i bilaget til forordning (EØF) nr. 55/87 om listen over
    fartøjer med en længde overalt på over 8 m, der i visse af Fællesskabets kystområder
    har tilladelse til at anvende bomtrawl'
  type: main
- language: el
  script: Grek
  content: '95/281/ΕΚ: Απόφαση της Επιτροπής της 14ης Ιουλίου
    1995 για τροποποίηση ορισμένων στοιχείων του
    καταλόγου που εμφαίνεται στο παράρτημα του
    κανονισμού (ΕΟΚ) αριθ. 55/87 για την κατάρτιση
    του καταλόγου των πλοίων που το συνολικό τους
    μήκος υπερβαίνει τα οχτώ μέτρα και επιτρέπεται
    να αλιεύουν με τη βοήθεια δοκότρατων σε ορισμένες
    παράκτιες ζώνες της Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '95/281/EY: Komission päätös, tehty 14 päivänä heinäkuuta 1995,
    tietyillä yhteisön rannikkoalueilla puomitroolin käyttöluvan kalastuksessa
    omaavien kahdeksan metrin kokonaispituuden ylittävien alusten luettelosta annetun
    asetuksen (ETY) N:o 55/87 liitteessä olevan luettelon tiettyjen tietojen muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/281/CE: Decisione della Commissione, del 14 luglio 1995, che modifica
    alcuni dati dell''elenco che figura nell''allegato del regolamento (CEE) n. 55/87
    che fissa l''elenco dei pescherecci di lunghezza fuori tutto superiore a otto
    metri, autorizzati ad usare reti a strascico a pali in determinate zone costiere
    della Comunità'
  type: main
- language: nl
  script: Latn
  content: '95/281/EG: Beschikking van de Commissie van 14 juli 1995 tot wijziging
    van bepaalde gegevens van de lijst in de bijlage bij Verordening (EEG) nr. 55/87
    tot vaststelling van de lijst van vaartuigen met een lengte over alles van meer
    dan 8 meter en die in bepaalde kustzones van de Gemeenschap mogen vissen met de
    boomkor'
  type: main
- language: pt
  script: Latn
  content: '95/281/CE: Decisão da Comissão, de 14 de Julho de 1995, que altera certas
