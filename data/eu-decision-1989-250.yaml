title:
- language: en
  script: Latn
  content: '89/250/EEC: Commission Decision of 25 January 1989 fixing an indicative
    allocation between Member States of 85 % of the commitment appropriations of the
    European Regional Development Fund (ERDF) under Objective 1 as defined by Council
    Regulation (EEC) No 2052/88'
  type: main
- language: fr
  script: Latn
  content: '89/250/CEE: Décision de la Commission du 25 janvier 1989 fixant une répartition
    indicative entre les États membres de 85 % des crédits d''engagement du Feder
    au titre de l''objectif n° 1 défini par le règlement (CEE) n 2052/88 du Conseil'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 25. Januar 1989 zur Festlegung von Richtgroessen
    fuer die Aufteilung von 85 v. H. der EFRE-Verpflichtungsermaechtigungen auf die
    einzelnen Mitgliedstaaten im Rahmen des in der Verordnung (EWG) Nr. 2052/88 des
    Rates festgelegten Ziels Nr. 1 (89/250/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 25. januar 1989 om fastsaettelse af en vejledende
    fordeling mellem medlemsstaterne af 85 % af EFRU-forpligtelsesbevillingerne under
    maal nr. 1 som fastlagt i Raadets forordning (EOEF) nr. 2052/88 (89/250/EOEF)
  type: main
- language: el
  script: Grek
  content: '89/250/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Ιανουαρίου 1989 για τον καθορισμό της ενδεικτικής
    κατανομής ανά κράτος μέλος του 85% των πιστώσεων
    ανάληψης υποχρεώσεων του ΕΤΠΑ στο πλαίσιο
    του στόχου 1 όπως καθορίζεται στον κανονισμό
    του Συμβουλίου ( ΕΟΚ ) αριθ. 2052/88'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 25 gennaio 1989 che fissa una ripartizione
    indicativa tra gi Stati membri dell'85 % degli stanziamenti d'impegno del FESR
    destinati al conseguimento dell'obiettivo n. 1, definito dal regolamento (CEE)
    n. 2052/88 del Consiglio (89/250/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 25 januari 1989 houdende een indicatieve
    verdeling onder de Lid-Staten van 85 % van de vastleggingskredieten van het EFRO
    in het kader van doelstelling 1 als bepaald in Verordening (EEG) nr. 2052/88 van
    de Raad (89/250/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 25 de Janeiro de 1989 que fixa uma repartiçao indicativa
    de 85 % das dotaçoes para autorizaçoes do FEDER pelos Estados-membros, nos termos
    do objectivo n* 1 enunciado no Regulamento (CEE) n* 2052/88 do Conselho (89/250/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 25 de enero de 1989 por lo que se distribuye
    de forma indicativa entre los Estados miembros el 85 % de los créditos de compromiso
    del FEDER relativos al objetivo no 1, definido en el Reglamento (CEE) no 2052/88
    del Consejo (89/250/CEE)
