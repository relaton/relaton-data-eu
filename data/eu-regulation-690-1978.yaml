title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 690/78 of 6 April 1978 re-establishing the
    levying of customs duties on equipment for parlour, falling within heading No
    97.04 and originating in Hong Kong, to which the preferential tariff arrangements
    set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 690/78 de la Commission, du 6 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, de la position tarifaire 97.04, originaires de Hong- Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 690/78 der Kommission vom 6. April 1978 zur Wiedereinführung
    des Zollsatzes für Gesellschaftsspiele der Tarifnummer 97.04 mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 690/78 af 6. april 1978 om genindførelse
    af af opkrævning af toldafgifter for selskabsspil under position 97.04, som har
    oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 690/78 della Commissione, del 6 aprile 1978, che ripristina
    la riscossione dei dazi doganali applicabili agli oggetti per giuochi di società,
    della voce 97.04 della tariffa doganale comune, originari di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 690/78 van de Commissie van 6 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op artikelen
    voor gezelschapsspellen, van post 97.04, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
