title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1333 of 29 June 2023 concerning
    the authorisation of a preparation of endo-1,3(4)-beta-glucanase produced by Aspergillus
    fijiensis CBS 589.94 as a feed additive for chickens for fattening and weaned
    piglets (holder of authorisation: DSM Nutritional Products Ltd, represented by
    DSM Nutritional Products Sp. z o.o.), amending Regulation (EC) No 1811/2005 and
    repealing Regulation (EC) No 1259/2004'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1333 de la Commission du 29 juin 2023
    concernant l’autorisation d’une préparation d’endo-1,3(4)-bêta-glucanase
    produite par Aspergillus fijiensis CBS 589.94 en tant qu’additif dans l’alimentation
    des poulets d’engraissement et des porcelets sevrés (titulaire de l’autorisation:
    DSM Nutritional Products Ltd, représentée par DSM Nutritional Products Sp. z
    o.o.), modifiant le règlement (CE) no 1811/2005 et abrogeant le règlement (CE)
    no 1259/2004'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1333 der Kommission vom 29. Juni 2023
