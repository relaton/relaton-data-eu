    fijiensis CBS 589.94, als Futtermittelzusatzstoff für Masthühner und entwöhnte
    Ferkel (Zulassungsinhaber: DSM Nutritional Products Ltd, vertreten durch DSM Nutritional
    Products Sp. z o.o.), zur Änderung der Verordnung (EG) Nr. 1811/2005 und zur
    Aufhebung der Verordnung (EG) Nr. 1259/2004'
