    от Aspergillus fijiensis CBS 589.94, като фуражна добавка
    за пилета за угояване и отбити прасенца (притежател
    на разрешителното: DSM Nutritional Products Ltd, представлявано
    от DSM Nutritional Products Sp. z o.o.), за изменение на Регламент
