title:
- language: en
  script: Latn
  content: '88/226/EEC: Commission Decision of 18 April 1988 terminating the investigation
    under Article 13 (10) of Regulation (EEC) No 2176/84 concerning certain typewriters
    assembled or produced in the Community with regard to TEC Elektronik-Werk GmbH
    and Brother Industries (UK) Ltd'
  type: main
- language: fr
  script: Latn
  content: '88/226/CEE: Décision de la Commission du 18 avril 1988 clôturant l''
    enquête ouverte au titre de l'' article 13 paragraphe 10 du règlement (CEE)
    n° 2176/84, relative à certaines machines à écrire assemblées ou fabriquées
    dans la Communauté, en ce qui concerne TEC Elektronik-Werk GmbH and Brother Industries
    (UK) Ltd'
  type: main
- language: de
  script: Latn
