title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2339/76 of 20 September 1976 amending Regulation
    (EEC) No 1496/75 on the implementation of provisions adopted under the association
    between the European Economic Community and Greece in respect of the movement
    of goods consequent on the extension of the association to the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2339/76 du Conseil, du 20 septembre 1976, modifiant
    le règlement (CEE) n° 1496/75 relatif à l'application des dispositions adoptées
    dans le cadre de l'association entre la Communauté économique européenne et
    la Grèce concernant la circulation des marchandises, en raison de l'extension
    de l'association aux nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2339/76 des Rates vom 20. September 1976 zur Änderung
    der Verordnung (EWG) Nr. 1496/75 zur Durchführung der Vorschriften über den
    Warenverkehr im Rahmen der Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft
    und Griechenland, die infolge der Ausdehnung der Assoziation auf die neuen Mitgliedstaaten
    erlassen wurden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2339/76 af 20. september 1976 om ændring
    af forordning (EØF) nr. 1496/75 om anvendelse af de bestemmelser, der er vedtaget
    inden for rammerne af associeringen mellem Det europæiske økonomiske Fællesskab
    og Grækenland om handel med varer som følge af udvidelsen af associeringen til
    også at omfatte de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2339/76 del Consiglio, del 20 settembre 1976, che
    modifica il regolamento (CEE) n. 1496/75 relativo all'applicazione delle disposizioni
    adottate nel quadro dell'associazione tra la Comunità economica europea e la
    Grecia riguardo alla circolazione delle merci a seguito della estensione dell'associazione
    ai nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2339/76 van de Raad van 20 september 1976 houdende
    wijziging van Verordening (EEG) nr. 1496/75 betreffende de toepassing van de in
    het kader van de Associatie tussen de Europese Economische Gemeenschap en Griekenland
    vastgestelde bepalingen betreffende het verkeer van goederen, vanwege de uitbreiding
    van de Associatie tot de nieuwe Lid-Staten
  type: main
