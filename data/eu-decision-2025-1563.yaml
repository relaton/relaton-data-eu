    organizacije (WTO) u pogledu donošenja odluke o odobravanju izuzeća WTO-a kojim
    se Sjedinjenim Američkim Državama dopušta primjena oslobođenja od carine u
    okviru Zakona Sjedinjenih Američkih Država o gospodarskom oporavku Karipskog
