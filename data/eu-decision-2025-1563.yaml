    den holdning, der skal indtages på Den Europæiske Unions vegne i Verdenshandelsorganisationens
    (WTO's) Almindelige Råd til vedtagelsen af en afgørelse om at indrømme en WTO-fritagelse,
    der giver USA mulighed for at indrømme toldfri behandling i henhold til USA's
    »Caribbean Basin Economic Recovery Act« (CBERA)
  type: main
- language: el
  script: Grek
