    mondiale del commercio (OMC) per quanto riguarda l’adozione di una deroga dell’OMC
    che permetta agli Stati Uniti di accordare un trattamento tariffario preferenziale
    nell’ambito dello US Caribbean Basin Economic Recovery Act (CBERA)
  type: main
- language: lv
