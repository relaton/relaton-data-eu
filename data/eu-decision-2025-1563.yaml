    на Общия съвет на Световната търговска организация
    (СТО) във връзка с приемането на решение за
    освобождаване от задължения в рамките на СТО,
    допускащо Съединените американски щати да
    предоставят безмитно третиране съгласно Закона
    на Съединените американски щати за икономическо
    възстановяване на Карибския басейн (CBERA)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/1563 ze dne 22. července 2025 o postoji, který
    má být jménem Evropské unie zaujat v Generální radě Světové obchodní
    organizace (WTO) k přijetí rozhodnutí o udělení výjimky WTO umožňující
    Spojeným státům americkým poskytovat bezcelní zacházení v rámci zákona
    Spojených států o ekonomickém oživení Karibské oblasti (CBERA)
  type: main
