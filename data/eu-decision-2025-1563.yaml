    obchodnej organizácie (WTO), pokiaľ ide o prijatie rozhodnutia o udelení výnimky
    WTO umožňujúcej Spojeným štátom poskytovať bezcolné zaobchádzanie podľa
    zákona USA o ozdravení hospodárstva krajín karibskej oblasti (CBERA)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/1563 z dne 22. julija 2025 o določitvi stališča,
