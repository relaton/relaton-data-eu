id: EUDecision20251563
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1563 of 22 July 2025 establishing the position
    to be taken on behalf of the European Union within the General Council of the
    World Trade Organization (WTO) as regards the adoption of a decision to grant
    a WTO waiver permitting the United States to provide duty-free treatment under
    the US Caribbean Basin Economic Recovery Act (CBERA)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1563 du Conseil du 22 juillet 2025 établissant la
    position à prendre au nom de l’Union européenne au sein du Conseil général
    de l’Organisation mondiale du commerce (OMC) en ce qui concerne l’adoption
    d’une décision visant à octroyer une dérogation de l’OMC permettant aux
    États-Unis d’accorder un traitement en franchise de droits dans le cadre de
    la loi américaine relative au redressement économique du bassin des Caraïbes
    (CBERA)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/1563 des Rates vom 22. Juli 2025 über den im Namen
    der Europäischen Union im Allgemeinen Rat der Welthandelsorganisation (WTO) zu
    vertretenden Standpunkt im Hinblick auf die Annahme eines Beschlusses zur Gewährung
    einer WTO-Ausnahmegenehmigung, die es den Vereinigten Staaten erlaubt, gemäß
    dem US-Gesetz „Caribbean Basin Economic Recovery Act“ (CBERA) Zollfreiheit
    zu gewähren
  type: main
- language: bg
  script: Cyrl
  content: Решение 2025/1563 на Съвета от 22 юли 2025 година
    за определяне на позицията, която трябва да
