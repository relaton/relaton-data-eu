    stolpekæder med oprindelse i Spanien og Sverige og om slutning af denne procedure'
  type: main
- language: it
  script: Latn
  content: '80/783/CEE: Decisione della Commissione, del 27 agosto 1980, che accetta
    gli impegni offerti in rapporto alla procedura antidumping relativa alle importazioni
    di catene a maglie saldate con traversino, originarie della Spagna e della Svezia,
    e che chiude tale procedura'
  type: main
- language: nl
  script: Latn
  content: '80/783/EEG: Besluit van de Commissie van 27 augustus 1980 houdende aanvaarding
