  content: '80/783/EEC: Commission Decision of 27 August 1980 accepting undertakings
    in connection with the anti-dumping proceedings concerning imports of studded
    welded-link chain, originating in Spain and Sweden and terminating those proceedings'
  type: main
- language: fr
  script: Latn
  content: '80/783/CEE: Décision de la Commission, du 27 août 1980, acceptant les
    engagements offerts dans le cadre des procédures anti-"dumping" concernant les
    importations des chaînes à maillons soudés à étais originaires de l'' Espagne
    et de Suède et clôturant lesdites procédures'
  type: main
- language: de
  script: Latn
  content: '80/783/EWG: Beschluß der Kommission vom 27. August 1980 über die Annahme
    von Verpflichtungen im Rahmen des Antidumping-Verfahrens betreffend Einfuhren
    von geschweißten Stegketten mit Ursprung in Spanien und Schweden und über die
    Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/783/EØF: Kommissionens afgørelse af 27. august 1980 om godtagelse
