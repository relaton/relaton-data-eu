    stål med ursprung i Folkrepubliken Kina och Thailand, eller som avsänts från
    Taiwan oavsett om produktens deklarerade ursprung är Taiwan eller inte, samt
    om upphävande av undantaget för Chup Hsin Enterprise Co. Ltd och Nian Hong Pipe
    Fittings Co. Ltd
