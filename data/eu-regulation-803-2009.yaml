title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 803/2009 of 27 August 2009 imposing a definitive
    anti-dumping duty on imports of certain tube and pipe fittings, of iron or steel,
    originating in the People’s Republic of China and Thailand, and those consigned
    from Taiwan, whether declared as originating in Taiwan, or not, and repealing
    the exemption granted to Chup Hsin Enterprise Co. Ltd. and Nian Hong Pipe Fittings
    Co. Ltd.
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 803/2009 du Conseil du 27 août 2009 instituant un
    droit antidumping définitif sur les importations de certains accessoires de tuyauterie,
    en fer ou en acier, originaires de la République populaire de Chine et de Thaïlande
    et sur les importations des mêmes produits expédiés de Taïwan, qu’ils aient
    ou non été déclarés originaires de Taïwan, et abrogeant l’exemption accordée
    à Chup Hsin Enterprise Co. Ltd et à Nian Hong Pipe Fittings Co. Ltd
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 803/2009 des Rates vom 27. August 2009 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Rohrformstücke,
    Rohrverschlussstücke und Rohrverbindungsstücke aus Eisen oder Stahl mit Ursprung
    in der Volksrepublik China und Thailand sowie auf die aus Taiwan versandten Einfuhren
    der gleichen Waren, ob als Ursprungserzeugnisse Taiwans angemeldet oder nicht,
    und zur Aufhebung der den Unternehmen Chup Hsin Enterprise Co. Ltd und Nian Hong
    Pipe Fittings Co. Ltd gewährten Befreiung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 803/2009 на Съвета от 27 август
    2009 година за налагане на окончателно антидъмпингово
    мито върху вноса на някои тръбни съединителни
    части от желязо или стомана с произход от Китайската
    народна република и Тайланд, и такива, изпратени
    от Тайван, без оглед на това дали са декларирани
    с произход от Тайван, и за отмяна на изключението,
    предоставено на Chup Hsin Enterprise Co. Ltd. и Nian Hong Pipe
    Fittings Co. Ltd.
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 803/2009 ze dne 27. srpna 2009 o uložení konečného
    antidumpingového cla z dovozu některých potrubních tvarovek ze železa nebo
    oceli pocházejících z Čínské lidové republiky a Thajska a potrubních tvarovek
    odesílaných z Tchaj-wanu, ať už jsou prohlášené za pocházející z Tchaj-wanu,
    či nikoliv, a o zrušení osvobození uděleného společnostem Chup Hsin Enterprise
    Co. Ltd. a Nian Hong Pipe Fittings Co. Ltd.
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 803/2009 af 27. august 2009 om indførelse
    af en endelig antidumpingtold på importen af visse rørfittings af jern og stål
    med oprindelse i Folkerepublikken Kina og Thailand og varer, der er afsendt fra
    Taiwan, uanset om de er angivet med oprindelse i Taiwan, og om ophævelse af den
    fritagelse, som Chup Hsin Enterprise Co. Ltd og Nian Hong Pipe Fittings Co. Ltd
    er blevet indrømmet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 803/2009 του Συμβουλίου,
