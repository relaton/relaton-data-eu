  script: Latn
  content: Neuvoston asetus (EY) N:o 803/2009, annettu 27 päivänä elokuuta 2009
    , lopullisen polkumyyntitullin käyttöönotosta tiettyjen Kiinan kansantasavallasta
    ja Thaimaasta peräisin olevien raudasta tai teräksestä valmistettujen putkien
    liitos- ja muiden osien tuonnissa sekä Taiwanista lähetettyjen samojen tuotteiden
    tuonnissa riippumatta siitä, onko Taiwan ilmoitettu tullille niiden alkuperäksi,
    ja yrityksille Chup Hsin Enterprise Co. Ltd ja Nian Hong Pipe Fittings Co. Ltd.
    myönnetyn vapautuksen kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 803/2009 od 27. kolovoza 2009. o uvođenju konačne
    antidampinške pristojbe na uvoz određenog pribora za cijevi od željeza ili
    čelika podrijetlom iz Narodne Republike Kine i Tajlanda i pribora za cijevi otpremljenog
    iz Tajvana, bez obzira na to jesu li prijavljeni kao proizvod podrijetlom iz Tajvana
    te o stavljanju izvan snage izuzeća odobrenog za Chup Hsin Enterprise Co. Ltd.
    i Nian Hong Pipe Fittings Co. Ltd.
  type: main
- language: hu
  script: Latn
  content: A Tanács 803/2009/EK rendelete ( 2009. augusztus 27. ) a Kínai Népköztársaságból
    és Thaiföldről származó, illetve a Tajvanból feladott (függetlenül attól,
    hogy Tajvanból származóként lettek-e bejelentve), vasból vagy acélból készült
    egyes csőillesztékekre, illetve csőszerelvényekre vonatkozó végleges dömpingellenes
    vám kivetéséről és a Chup Hsin Enterprise Co. Ltd-nek és a Nian Hong Pipe
    Fittings Co. Ltd-nek nyújtott mentesség hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 803/2009 del Consiglio, del 27 agosto 2009 , che istituisce
    un dazio antidumping definitivo sulle importazioni di accessori per tubi, di ferro
    o di acciaio, originari della Repubblica popolare cinese e della Thailandia e
    sulle importazioni degli stessi prodotti spediti da Taiwan, siano essi o meno
    dichiarati originari di Taiwan, e che abroga l’esenzione concessa a Chup Hsin
    Enterprise Co. Ltd e a Nian Hong Pipe Fittings Co. Ltd
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 803/2009 ( 2009. gada 27. augusts ), ar ko nosaka
    galīgu antidempinga maksājumu dažu veidu dzelzs un tērauda cauruļu savienotājelementu
    importam, kuru izcelsme ir Ķīnas Tautas Republikā un Taizemē un kuri nosūtīti
    no Taivānas, neatkarīgi no tā, vai ir norādīta to izcelsme Taivānā, un
    ar ko atceļ atbrīvojumu, kas piešķirts Chup Hsin Enterprise Co. Ltd un Nian
    Hong Pipe Fittings Co. Ltd
  type: main
- language: lt
  script: Latn
  content: 2009 m. rugpjūčio 27 d. Tarybos reglamentas (EB) Nr. 803/2009, kuriuo
    nustatomas galutinis antidempingo muitas tam tikroms importuojamoms Kinijos Liaudies
    Respublikos ir Tailando kilmės, taip pat iš Taivano siunčiamoms vamzdžių
    ir vamzdelių jungiamosioms detalėms iš geležies ar plieno, deklaruotoms kaip
    Taivano kilmės arba ne, ir panaikinamas Chup Hsin Enterprise Co. Ltd. ir Nian
    Hong Pipe Fittings Co. Ltd. taikytas atleidimas nuo antidempingo priemonių
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 803/2009 tas- 27 ta’ Awwissu 2009 li
    jimponi dazju anti-dumping definittiv fuq importazzjonijiet ta’ ċerti fittings
    ta’ tubi u pajpijiet, tal-ħadid jew tal-azzar, li joriġinaw mir-Repubblika
    tal-Poplu taċ-Ċina u mit-Tajlandja, u dawk kunsinjati mit-Tajwan, kemm jekk
    dikjarati bħala oriġinarji mit-Tajwan, kif ukoll jekk mhumiex, u li jirrevoka
    l-eżenzjoni mogħtija lil Chup Hsin Enterprise Co. Ltd. u Nian Hong Pipe Fittings
    Co. Ltd.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 803/2009 van de Raad van 27 augustus 2009 tot instelling
    van een definitief antidumpingrecht op bepaalde hulpstukken voor buisleidingen,
    van ijzer of van staal, van oorsprong uit de Volksrepubliek China en Thailand,
    of verzonden vanuit Taiwan, al dan niet aangegeven als van oorsprong uit Taiwan,
    en tot intrekking van de aan Chup Hsin Enterprise Co. Ltd en Nian Hong Pipe Fittings
    Co. Ltd verleende vrijstelling
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 803/2009 z dnia 27 sierpnia 2009 r. nakładające
    ostateczne cło antydumpingowe na przywóz niektórych żeliwnych lub stalowych
    łączników rur i przewodów rurowych pochodzących z Chińskiej Republiki Ludowej
    i Tajlandii oraz tych przywożonych z Tajwanu, niezależnie od tego, czy zostały
    zgłoszone jako pochodzące z Tajwanu, czy też nie, i uchylające zwolnienie
    przyznane przedsiębiorstwom Chup Hsin Enterprise Co. Ltd. i Nian Hong Pipe Fittings
    Co. Ltd.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 803/2009 do Conselho, de 27 de Agosto de 2009 , que
    institui um direito anti-dumping definitivo sobre as importações de certos acessórios
    para tubos, de ferro ou de aço, originários da República Popular da China e
    da Tailândia e sobre as importações dos mesmos produtos expedidos de Taiwan,
    independentemente de serem ou não declarados como originários de Taiwan, e que
    revoga a isenção concedida às empresas Chup Hsin Enterprise Co. Ltd e Nian
    Hong Pipe Fittings Co. Ltd
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 803/2009 al Consiliului din 27 august 2009 de instituire
    a unei taxe antidumping definitive asupra importurilor de anumite accesorii de
    țevărie, din fier sau oțel, originare din Republica Populară Chineză și
    din Thailanda, precum și asupra celor expediate din Taiwan, indiferent dacă
    sunt sau nu declarate ca fiind originare din Taiwan, și de abrogare a scutirii
    acordate societăților comerciale Chup Hsin Enterprise Co. Ltd. și Nian Hong
    Pipe Fittings Co. Ltd.
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 803/2009 z 27. augusta 2009 , ktorým sa ukladá
    konečné antidumpingové clo na dovoz určitých rúrových a potrubných tvaroviek
    zo železa alebo ocele s pôvodom v Čínskej ľudovej republike a Thajsku a tvaroviek
    zasielaných z Taiwanu, či už deklarovaných ako výrobok s pôvodom na Taiwane,
    alebo nie a ktorým sa ruší oslobodenie udelené spoločnostiam Chup Hsin Enterprise
    Co. Ltd. a Nian Hong Pipe Fittings Co. Ltd.
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 803/2009 z dne 27. avgusta 2009 o uvedbi dokončne
    protidampinške dajatve na uvoz nekaterega pribora (fitingov) za cevi iz železa
    ali jekla s poreklom iz Ljudske republike Kitajske in Tajske, in tistih, poslanih
    s Tajvana, ki se prijavijo kot izdelki s poreklom s Tajvana ali ne, in razveljavitvi
    izvzetja, odobrenega družbama Chup Hsin Enterprise Co. Ltd. in Nian Hong Pipe
    Fittings Co. Ltd.
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 803/2009 del Consejo, de 27 de agosto de 2009 , por
    el que se establecen derechos antidumping definitivos sobre las importaciones
    de determinados accesorios de tubería, de hierro o de acero, originarios de la
    República Popular China y de Tailandia, y los consignados desde Taiwán, tanto
    si se declaran originarios de Taiwán como si no, y por el que se deroga la exención
    concedida a Chup Hsin Enterprise Co. Ltd. y Nian Hong Pipe Fittings Co. Ltd.
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 803/2009 av den 27 augusti 2009 om införande
