  script: Latn
  content: '2002/690/EC: Commission Decision of 30 June 2000 approving the single
    programming document for Community structural assistance in the regions of South
    Karelia, Kanta-Häme and Päijät-Häme and in certain areas of the regions of
    Eastern Uusimaa, Kymenlaakso, Uusimaa and South-west Finland under Objective 2
    in Finland (notified under document number C(2000) 1741)'
  type: main
- language: fr
  script: Latn
  content: '2002/690/CE: Décision de la Commission, du 30 juin 2000, portant approbation
