title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2215/82 of 10 August 1982 re-establishing
    the levying of the customs duties on carbonates of sodium, falling within subheading
    28.42 A II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2215/82 de la Commission, du 10 août 1982, portant
    établissement de la perception des droits de douane applicables aux carbonates
    de sodium de la sous-position 28.42 A II du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2215/82 der Kommission vom 10. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Natriumcarbonate der Tarifstelle 28.42 A II, mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2215/82 af 10. august 1982 om genindførelse
    af opkrævning af told for carbonater af natrium, henhørende under pos. 28.42
    A II og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2215/82 τής Επιτροπής
