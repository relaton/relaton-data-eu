    νατρίου τής διακρίσεως 28. 42 Α ΙΙ τού Κοινού
    Δασμολογίου, καταγωγής Ρουμανίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2215/82 della Commissione, del 10 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai carbonati di sodio
    della sottovoce 28.42 A II della tariffa doganale comune, originari della Romania,
    beneficiaria delle peferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
