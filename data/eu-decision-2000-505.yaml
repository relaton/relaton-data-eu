id: EUDecision2000505
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2000/505/EC: Commission Decision of 25 July 2000 amending Annex IV to
    Council Directive 90/539/EEC on animal health conditions governing intra-Community
    trade in, and imports from third countries of poultry and hatching eggs and amending
    Decision 96/482/EC laying down animal health conditions and veterinary certificates
    for the importation of poultry and hatching eggs other than ratites and eggs thereof
    from third countries including animal health measures to be applied after such
    importation (notified under document number C(2000) 2261)'
  type: main
- language: fr
  script: Latn
  content: '2000/505/CE: Décision de la Commission du 25 juillet 2000 modifiant l''annexe
    IV de la directive 90/539/CEE du Conseil relative aux conditions de police sanitaire
    régissant les échanges intracommunautaires et les importations en provenance
    des pays tiers de volailles et d''oeufs à couver ainsi que modifiant la décision
    96/482/CE établissant les conditions sanitaires et la certification vétérinaire
    requises à l''importation de volailles et d''oeufs à couver, à l''exclusion
    des ratites et de leurs oeufs, en provenance de pays tiers, ainsi que les mesures
    de police sanitaire à appliquer après une telle importation [notifiée sous
    le numéro C(2000) 2261]'
  type: main
- language: de
  script: Latn
  content: '2000/505/EG: Entscheidung der Kommission vom 25. Juli 2000 zur Änderung
    von Anhang IV der Richtlinie 90/539/EWG des Rates über die tierseuchenrechtlichen
    Bedingungen für den innergemeinschaftlichen Handel mit Geflügel und Bruteiern
    und für ihre Einfuhr aus Drittländern und zur Änderung der Entscheidung 96/482/EG
    zur Festlegung der Veterinärbedingungen und Veterinärbescheinigungen für die
    Einfuhr von Geflügel und Bruteiern, ausgenommen Laufvögel und ihre Bruteier,
    aus Drittländern, einschließlich der nach der Einfuhr anzuwendenden tierseuchenrechtlichen
    Maßnahmen (Bekanntgegeben unter Aktenzeichen K(2000) 2261)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 25 юли 2000 година
    за изменение на приложение IV към Директива
    90/539/ЕИО на Съвета относно ветеринарно-санитарните
    изисквания за търговията в Общността и вноса
    от трети страни на домашни птици и яйца за люпене,
    и за изменение на Решение 96/482/ЕО относно определяне
    на ветеринарно-санитарните условия и ветеринарното
    сертифициране при вноса от трети страни на
    домашни птици и яйца за люпене, различни от
    щраусови птици и техните яйца, включително
    и ветеринарно-санитарните мерки, които трябва
    да се прилагат след такъв внос (нотифицирано
    под номер C(2000) 2261)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 25. července 2000, kterým se mění příloha
    IV směrnice Rady 90/539/EHS o veterinárních podmínkách pro obchod s drůbeží
    a násadovými vejci uvnitř Společenství a jejich dovoz ze třetích zemí
    a kterým se mění rozhodnutí 96/482/ES, kterým se stanoví veterinární podmínky
    a veterinární osvědčení pro dovoz drůbeže a násadových vajec (kromě
    ptáků nadřádu běžci a jejich vajec) ze třetích zemí, a to včetně veterinárních
    opatření po dovozu (oznámeno pod číslem K(2000) 2261)
  type: main
- language: da
  script: Latn
  content: '2000/505/EF: Kommissionens beslutning af 25. juli 2000 om ændring af
    bilag IV til Rådets direktiv 90/539/EØF om dyresundhedsmæssige betingelser
    for samhandelen inden for Fællesskabet med fjerkræ og rugeæg samt for indførsel
    heraf fra tredjelande og om ændring af beslutning 96/482/EF om dyresundhedsmæssige
    betingelser og udstedelse af sundhedscertifikat ved indførsel af fjerkræ og
    rugeæg fra tredjelande, bortset fra strudsefugle og strudseæg, herunder krav
    om sundhedsforanstaltninger efter indførsel (meddelt under nummer K(2000) 2261)'
  type: main
- language: el
  script: Grek
  content: '2000/505/ΕΚ: Απόφαση της Επιτροπής, της 25ης
    Ιουλίου 2000, για την τροποποίηση του παραρτήματος
    IV της οδηγίας 90/539/ΕΟΚ του Συμβουλίου σχετικά
    με τους όρους υγειονομικού ελέγχου που διέπουν
    τις ενδοκοινοτικές συναλλαγές και τις εισαγωγές
    πουλερικών και αυγών για επώαση από τρίτες
    χώρες και περί τροποποιήσεως της απόφασης
    96/482/ΕΚ για τον καθορισμό των όρων που αφορούν
    την υγεία των ζώων και των κτηνιατρικών πιστοποιητικών
    για την εισαγωγή από τρίτες χώρες πουλερικών
    και αυγών προς επώαση, άλλων πλην των στρουθιονιδών
    και των αυγών τους, συμπεριλαμβανομένων μέτρων
    για την υγεία των ζώων που πρέπει να εφαρμόζονται
    μετά την εισαγωγή [κοινοποιηθείσα υπό τον αριθμό
    Ε(2000) 2261]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 25. juuli 2000, millega muudetakse IV lisa nõukogu direktiivis
    90/539/EMÜ kodulindude ja haudemunade ühendusesisest kaubandust ning kolmandatest
    riikidest importimist reguleerivate loomatervishoiunõuete kohta ning otsust 96/482/EÜ,
    millega nähakse ette loomatervishoiunõuded ja veterinaarsertifikaadid kodulindude
    ja haudemunade, välja arvatud siledarinnaliste lindude ja nende munade importimiseks
    kolmandatest riikidest ning pärast kõnealust importimist kohaldatavad loomatervishoiumeetmed
    (teatavaks tehtud numbri K(2000) 2261 all)
  type: main
- language: fi
  script: Latn
  content: '2000/505/EY: Komission päätös, tehty 25 päivänä heinäkuuta 2000,
    eläinten terveyttä koskevista vaatimuksista yhteisön sisäisessä siipikarjan
    ja siitosmunien kaupassa ja tuonnissa kolmansista maista annetun neuvoston direktiivin
    90/539/ETY liitteen IV muuttamisesta ja eläinten terveyttä koskevista vaatimuksista
    ja eläinlääkäritodistuksista elävän siipikarjan ja siitosmunien tuonnissa
    kolmansista maista, mukaan lukien kyseisen tuonnin jälkeiset eläinten terveyttä
    koskevat toimenpiteet lukuun ottamatta sileälastaisia lintulajeja ja niiden munia
    tehdyn päätöksen 96/482/EY muuttamisesta (tiedoksiannettu numerolla K(2000)
    2261)'
  type: main
- language: hr
  script: Latn
  content: '2000/505/EZ: Odluka Komisije od 25. srpnja 2000. o izmjeni Priloga IV.
    Direktivi Vijeća 90/539/EEZ o uvjetima zdravlja životinja kojima se uređuje
    trgovina unutar Zajednice i uvoz iz trećih zemalja peradi i jaja za valenje te
    o izmjeni Odluke 96/482/EZ o uvjetima zdravlja životinja i veterinarskim certifikatima
    za uvoz peradi i jaja za valenje, osim bezgrebenki i njihovih jaja, iz trećih
    zemalja, uključujući i mjere zdravlja životinja koje se moraju primijeniti
    nakon takvog uvoza (priopćena pod brojem dokumenta C(2000) 2261)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. július 25.) a baromfi és a keltetőtojás
    Közösségen belüli kereskedelmére és harmadik országból történő behozatalára
    irányadó állat-egészségügyi feltételekről szóló 90/539/EGK tanácsi
    irányelv IV. mellékletének módosításáról, valamint a laposmellű futómadarak
    és azok tojásain kívüli baromfihús és keltetőtojás harmadik országból
    történő behozatalára vonatkozó állat-egészségügyi feltételek és a szükséges
    állatorvosi bizonyítványok, valamint a behozatalt követően elvégzendő állat-egészségügyi
    intézkedések meghatározásáról szóló 96/482/EK határozat módosításáról
    (az értesítés a C(2000) 2261. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2000/505/CE: Decisione della Commissione, del 25 luglio 2000, che modifica
    l''allegato IV della direttiva 90/539/CEE del Consiglio, relativa alle norme di
    polizia sanitaria per gli scambi intracomunitari e le importazioni in provenienza
    dai paesi terzi di pollame e uova da cova, e che modifica la decisione 96/482/CE
    relativa alle norme di polizia sanitaria e ai certificati veterinari per l''importazione
    da paesi terzi di pollame e di uova da cova, esclusi i ratiti e le relative uova,
    nonché alle misure di polizia sanitaria da applicare dopo l''importazione [notificata
    con il numero C(2000) 2261]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2000. gada 25. jūlijs), ar kuru groza IV pielikumu
    Padomes Direktīvai 90/539/EEK par dzīvnieku veselības nosacījumiem, kas reglamentē
    mājputnu un inkubējamo olu tirdzniecību Kopienā un to ievešanu no trešajām
    valstīm, un groza Lēmumu 96/482/EK, kurā izklāstīti dzīvnieku veselības
    nosacījumi un noteikti veterinārie sertifikāti mājputnu un inkubējamo olu,
    izņemot skrējējputnus un to olas, ievešanai no trešajām valstīm, tostarp
    dzīvnieku veselības pasākumi, kas veicami pēc šādu preču ievešanas (izziņots
    ar dokumenta numuru C(2000) 2261)
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 25 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    direktyvos 90/539/EEB dėl gyvūnų sveikatos reikalavimų, reglamentuojančių
    Bendrijos vidaus prekybą naminiais paukščiais ir perinti skirtais kiaušiniais
    ir jų importą iš trečiųjų šalių, IV priedą ir Sprendimą 96/482/EB, nustatantį
    gyvūnų sveikatos reikalavimus ir veterinarijos sertifikatus importuojant iš
    trečiųjų šalių naminius paukščius ir perinti skirtus kiaušinius, išskyrus
    Ratitae genties paukščius ir jų kiaušinius, taip pat nustatantis gyvūnų
    sveikatos priemones, taikytinas taip importavus (pranešta dokumentu Nr. C(2000)
    2261)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-25 ta’ Lulju 2000 li temenda l-Anness
    IV tad-Direttiva tal-Kunsill 90/539/KEE dwar il-kondizzjonijiet tas-saħħa tal-bhejjem
    li jirregolaw il-kummerċ intra-Komunitaju ta’, u l-importazzjoni minn pajjiżi
    terzi ta’ tjur u bajd tat-tfaqqis u li temenda d-Deċiżjoni 96/482/KE li tistabbilixxi
    l-kondizzjonijiet tas-saħħa tal-bhejjem u ċ-ċertifikati veterinarji għall-importazzjoni
    ta’ tjur u bajd tat-tfaqqis minbarra dawk ta’ l-għasafar li ma jtirux u l-bajd
    tagħhom minn pajjiżi terzi li jinkludu l-miżuri tas-saħħa tal-bhejjem li
    għandhom jiġu applikati wara din l-importazzjoni (innotifikata permezz tad-dokument
    numru C(2000) 2261)Test b’rilevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: '2000/505/EG: Beschikking van de Commissie van 25 juli 2000 houdende wijziging
    van bijlage IV bij Richtlijn 90/539/EEG van de Raad tot vaststelling van veterinairrechtelijke
    voorschriften voor het intracommunautaire handelsverkeer en de invoer uit derde
    landen van pluimvee en broedeieren en houdende wijziging van Beschikking 96/482/EG
    tot vaststelling van veterinairrechtelijke voorschriften en veterinaire certificering
    voor de invoer van pluimvee en broedeieren uit derde landen, met uitzondering
    van loopvogels (Ratitae) en van eieren daarvan, en van de na invoer toe te passen
    veterinairrechtelijke maatregelen (kennisgeving geschied onder nummer C(2000)
    2261)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 25 lipca 2000 r. zmieniająca załącznik IV do
    dyrektywy Rady 90/539/EWG w sprawie wymagań dotyczących zdrowia zwierząt, regulujących
    handel wewnątrzwspólnotowy i przywóz z państw trzecich drobiu i jaj wylęgowych
    oraz zmieniająca decyzję 96/482/WE, ustanawiającą wymagania dotyczące zdrowia
    zwierząt i świadectwa weterynaryjne dla przywozu drobiu i jaj wylęgowych innych
    gatunków niż ptaki bezgrzebieniowe i ich jaj pochodzących z państw trzecich
    z uwzględnieniem środków zdrowotnych stosowanych przy ich przywozie (notyfikowana
    jako dokument nr C(2000) 2261)
  type: main
- language: pt
  script: Latn
  content: '2000/505/CE: Decisão da Comissão, de 25 de Julho de 2000, que altera
    o anexo IV da Directiva 90/539/CEE do Conselho relativa às condições de polícia
    sanitária que regem o comércio intracomunitário e as importações de aves
    de capoeira e de ovos para incubação provenientes de países terceiros e que
    altera a Decisão 96/482/CE que estabelece as condições sanitárias e os certificados
    veterinários para a importação de aves de capoeira e ovos para incubação,
    excluindo as ratites e seus ovos, provenientes de países terceiros, incluindo
    as medidas sanitárias a aplicar após a importação [notificada com o número
    C(2000) 2261]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 25 iulie 2000 de modificare a anexei IV la Directiva
    90/539/CEE a Consiliului privind condițiile de sănătate animală care reglementează
    schimburile intracomunitare și importurile din țări terțe de păsări de curte
    și de ouă pentru incubație și de modificare a Deciziei 96/482/CE de stabilire
    a condițiilor de sănătate animală și a certificării sanitar-veterinare cerute
    la importul de păsări și ouă destinate incubației, cu excepția ratitelor
    și a ouălor lor, provenind din țări terțe, precum și măsurile de protecție
    a sănătății animale care trebuie aplicate după un astfel de import [notificată
    cu numărul C(2000) 2261]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 25. júla 2000, ktorým sa mení a dopĺňa príloha
    IV k smernici Rady 90/539/EHS o podmienkach týkajúcich sa zdravia zvierat, ktorými
    sa riadi obchod vo vnútri spoločenstva a dovoz hydiny a násadových vajec z
    tretích krajín a ktorým sa mení a dopĺňa rozhodnutie 96/482/ES, ktorým
    sa stanovujú podmienky týkajúce sa zdravia zvierat a veterinárne certifikáty
    pre dovoz hydiny a násadových vajec okrem vtákov skupiny bežcov a ich vajec
    z tretích krajín, vrátane opatrení týkajúcich sa zdravia zvierat, ktoré
    sa musia uplatňovať po takomto dovoze (oznámené pod číslom dokumentu C(2000)
    2261)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 25. julija 2000 o spremembah Priloge IV k Direktivi
    Sveta 90/539/EGS o pogojih zdravstvenega stanja, ki veljajo znotraj Skupnosti
    za trgovanje s perutnino in valilnimi jajci ter za njihov uvoz iz tretjih držav
    in o spremembah Odločbe 96/482/ES o določitvi pogojev v zvezi z zdravstvenim
    varstvom živali in veterinarskih spričeval za uvoz perutnine in valilnih jajc
    iz tretjih držav, razen ratitov in njihovih jajc, vključno z ukrepi zdravstvenega
    varstva živali, ki se uporabijo po takem uvozu (notificirano pod dokumentarno
    številko K(2000) 2261)
  type: main
- language: es
  script: Latn
  content: '2000/505/CE: Decisión de la Comisión, de 25 de julio de 2000, que modifica
    el anexo IV de la Directiva 90/539/CEE del Consejo relativa a las condiciones
    de policía sanitaria que regulan los intercambios intracomunitarios y las importaciones
    de aves de corral y de huevos para incubar procedentes de terceros países y que
    modifica la Decisión 96/482/CE por la que se establecen las condiciones sanitarias
    y los certificados zoosanitarios para la importación de aves de corral y de huevos
    para incubar, con excepción de las Ratitae y sus huevos, procedentes de terceros
    países, así como las medidas zoosanitarias que deberán aplicarse después de
    la importación [notificada con el número C(2000) 2261]'
  type: main
- language: sv
  script: Latn
  content: '2000/505/EG: Kommissionens beslut av den 25 juli 2000 om ändring av bilaga
    IV till rådets direktiv 90/539/EEG om djurhälsovillkor för handel inom gemenskapen
    med och för import från tredje land av fjäderfä och kläckningsägg och om
    ändring av beslut 96/482/EG om djurhälsovillkor och veterinärintyg för import
    från tredje land av fjäderfä och kläckningsägg, med undantag av strutsfåglar
    och ägg från strutsfåglar, inbegripet djurhälsoåtgärder som skall vidtas
    efter sådan import [delgivet med nr K(2000) 2261]'
