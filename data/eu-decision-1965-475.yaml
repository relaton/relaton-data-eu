title:
- language: fr
  script: Latn
  content: Décision 65/475/CEE de la Commission, du 21 octobre 1965, relative au
    recours de la République française à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/475/EWG: Entscheidung der Kommission vom 21. Oktober 1965 über den
    Antrag der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages,
    wonach bestimmte Waren mit Ursprung in dritten Ländern, die sich in den anderen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung ausgeschlossen
    werden sollen'
  type: main
- language: it
  script: Latn
  content: '65/475/CEE: Decisione della Commissione, del 21 ottobre 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, comma 1, del Trattato,
    per escludere dal trattamento comunitario alcuni prodotti originari di paesi terzi
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/475/EEG: Beschikking van de Commissie van 21 oktober 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
