  script: Latn
  content: Commission Directive 2005/81/EC of 28 November 2005 amending Directive
    80/723/EEC on the transparency of financial relations between Member States and
    public undertakings as well as on financial transparency within certain undertakings
  type: main
- language: fr
  script: Latn
  content: Directive 2005/81/CE de la Commission du 28 novembre 2005 modifiant la
    directive 80/723/CEE relative à la transparence des relations financières entre
    les États membres et les entreprises publiques ainsi qu’à la transparence
    financière dans certaines entreprises
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/81/EG der Kommission vom 28. November 2005 zur Änderung
    der Richtlinie 80/723/EWG über die Transparenz der finanziellen Beziehungen zwischen
    den Mitgliedstaaten und den öffentlichen Unternehmen sowie über die finanzielle
    Transparenz innerhalb bestimmter Unternehmen
  type: main
- language: cs
  script: Latn
