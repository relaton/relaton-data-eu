    mercancías sin transformar (régimen de perfeccionamiento activo e importación
    temporal) durante el primer semestre de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2796/1999 av den 29 december 1999 om
