title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2796/1999 of 29 December 1999 laying down
    rates of compensatory interest applicable during the first half of 2000 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2796/1999 de la Commission, du 29 décembre 1999, fixant
    les taux d'intérêts compensatoires applicables en cas de naissance d'une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'état
    (régime du perfectionnement actif, système de la suspension et régime de l'admission
    temporaire) pendant le premier semestre de 2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2796/1999 der Kommission vom 29. Dezember 1999 mit
    Sätzen von Ausgleichszinsen, die im ersten Halbjahr 2000 bei Entstehung einer
    Zollschuld für Veredelungserzeugnisse oder unveredelte Waren (aktiver Verdelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2796/1999 af 29. december 1999 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i første halvår af 2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2796/1999 της Επιτροπής,
    της 29ης Δεκεμβρίου 1999, για τον καθορισμό εξισωτικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του πρώτου εξάμηνου 2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2796/1999, annettu 29 päivänä joulukuuta 1999,
    vuoden 2000 ensimmäisellä kalenterivuosipuoliskolla sovellettavista jalostetuista
    tuotteista tai samassa tilassa olevista tavaroista syntyvän tullivelan hyvityskorkokannoista
    (sisäisen jalostuksen vapautusjärjestelmä, suspensiojärjestelmä ja väliaikainen
    maahantuonti)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2796/1999 della Commissione, del 29 dicembre 1999,
    che determina i tassi di interesse compensatori applicabili ove sorga un'obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel primo semestre 2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2796/1999 van de Commissie van 29 december 1999 tot
    vaststelling van de jaarlijkse intrestpercentages van toepassing in geval van
    het ontstaan van een douaneschuld voor veredelingsproducten of onveredelde goederen
    (regeling actieve veredeling en tijdelijke invoer) tijdens het eerste semester
    2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2796/1999 da Comissão, de 29 de Dezembro de 1999,
    que fixa as taxas de juros de compensação aplicáveis aos casos de constituição
    de uma dívida aduaneira relativa a produtos compensadores ou a mercadorias no
    seu estado inalterado (regime do aperfeiçoamento activo e importação temporária),
    durante o primeiro semestre de 2000
  type: main
- language: es
  script: Latn
