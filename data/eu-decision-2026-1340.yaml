    ska intas på Europeiska unionens vägnar i de tekniska kommittéer för tullvärde
    och för ursprungsregler som inrättats under överinseende av Världstullorganisationen
    med avseende på antagandet och utarbetandet av rådgivande yttranden, kommentarer,
    förklarande anmärkningar, fallstudier, studier och liknande instrument om värdering
    av importerade varor för tulländamål enligt avtalet om tillämpning av artikel
    VII i allmänna tull- och handelsavtalet 1994 respektive på antagandet och utarbetandet
    av rådgivande yttranden, information och råd och liknande instrument om fastställande
    av varors ursprung enligt avtalet om ursprungsregler
