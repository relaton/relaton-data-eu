title:
- language: en
  script: Latn
  content: '83/436/EEC: Commission Decision of 10 August 1983 establishing that the
    apparatus described as ''Kinemetrics - Seismic Monitoring System, model Dataseis,
    with accessories'' may not be imported free of Common Customs Tariff duties'''
  type: main
- language: fr
  script: Latn
  content: '83/436/CEE: Décision de la Commission du 10 août 1983 constatant que
    l''importation de l''appareil dénommé "Kinemetrics - Seismic Monitoring System,
    model Dataseis, with accessories" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/436/EWG: Entscheidung der Kommission vom 10. August 1983, mit der festgestellt
    wird, daß das Gerät ,,KINEMETRICS - Seismic Monitoring System, model Dataseis,
    with accessories" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/436/EØF: Kommissionens beslutning af 10. august 1983 om fastslåelse
    af, at indførsel af apparatet "Kinemetrics - Seismic Monitoring System, model
    Dataseis, with accessories" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/436/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
