    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werdent
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2355/82 af 27. august 1982 om genindførelse
