    der Maßnahmen zur Förderung der Verwendung von Flachsfasern für das Wirtschaftsjahr
    1983/84
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1578/83 af 14. juni 1983 om fastsættelse
