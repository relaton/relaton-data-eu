title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1108 of 5 July 2021 on the recognition
    of the legal, supervisory and enforcement arrangements of the United States of
    America for derivatives transactions supervised by the Board of Governors of the
    Federal Reserve System, the Office of the Comptroller of the Currency, the Federal
    Deposit Insurance Corporation, the Farm Credit Administration and the Federal
    Housing Finance Agency as equivalent to certain requirements of Article 11 of
    Regulation (EU) No 648/2012 of the European Parliament and Council on OTC derivatives,
    central counterparties and trade repositories
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1108 de la Commission du 5 juillet 2021
    reconnaissant l’équivalence du cadre juridique et du dispositif de surveillance
    et de mise en œuvre des États-Unis d’Amérique relatifs aux transactions sur
    dérivés surveillées par le Board of Governors of the Federal Reserve System,
    l’Office of the Comptroller of the Currency, la Federal Deposit Insurance Corporation,
    la Farm Credit Administration et la Federal Housing Finance Agency avec certaines
    des exigences de l’article 11 du règlement (UE) no 648/2012 du Parlement européen
    et du Conseil sur les produits dérivés de gré à gré, les contreparties centrales
    et les référentiels centraux
  type: main
