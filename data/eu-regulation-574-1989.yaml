title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 574/89 of 2 March 1989 opening for 1989 a special
    unilateral import quota for fresh, chilled or frozen high quality beef and veal
    falling within CN codes 0201 and 0202 and for products falling within CN codes
    0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
