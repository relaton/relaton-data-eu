    (CE) nr. 1493/1999 al Consiliului privind organizarea comună a pieței vitivinicole
    în ceea ce privește mecanismele pieței
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2022/2001 z 15. októbra 2001, ktorým sa mení
