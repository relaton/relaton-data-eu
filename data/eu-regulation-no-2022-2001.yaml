    zasady wykonywania rozporządzenia Rady (WE) nr 1493/1999 w sprawie wspólnej
    organizacji rynku wina w odniesieniu do mechanizmów rynkowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2022/2001 da Comissão, de 15 de Outubro de 2001,
