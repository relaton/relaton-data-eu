    1493/1999 soveltamista koskevista yksityiskohtaisista säännöistä markkinamekanismien
    osalta annetun asetuksen (EY) N:o 1623/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2022/2001/EK rendelete (2001. október 15.) a piaci mechanizmusokra
