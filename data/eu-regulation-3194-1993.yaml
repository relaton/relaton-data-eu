    by the Italian intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3194/93 de la Commission, du 22 novembre 1993, modifiant
    le règlement (CEE) n 2781/93 et portant à 800 000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé dur détenu par l'organisme
    d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3194/93 der Kommission vom 22. November 1993 zur Änderung
    der Verordnung (EWG) Nr. 2781/93 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 800 000 Tonnen Hartweizen aus Beständen
    der italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3194/93 af 22. november 1993 om ændring
