title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 416/2001 of 28 February 2001 amending Regulation
    (EC) No 2820/98 applying a multiannual scheme of generalised tariff preferences
    for the period 1 July 1999 to 31 December 2001 so as to extend duty-free access
    without any quantitative restrictions to products originating in the least developed
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 416/2001 du Conseil du 28 février 2001 modifiant le
    règlement (CE) n° 2820/98 portant application d'un schéma pluriannuel de préférences
    tarifaires généralisées pour la période du 1er juillet 1999 au 31 décembre
    2001, afin d'étendre aux produits originaires des pays les moins développés
    la franchise des droits de douane sans aucune limitation quantitative
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 416/2001 des Rates vom 28. Februar 2001 zur Änderung
    der Verordnung (EG) Nr. 2820/98 über ein Mehrjahresschema allgemeiner Zollpräferenzen
    für den Zeitraum 1. Juli 1999 bis 31. Dezember 2001 zwecks Ausweitung der Zollbefreiung
    ohne mengenmäßige Beschränkungen auf Waren mit Ursprung in den am wenigsten
    entwickelten Ländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 416/2001 af 28. februar 2001 om ændring af
    forordning (EF) nr. 2820/98 om anvendelse af et flerårigt arrangement med generelle
    toldpræferencer for perioden 1. juli 1999 til 31. december 2001 med henblik på
    at udvide toldfritagelsen til også at omfatte varer med oprindelse i de mindst
    udviklede lande, uden mængdebegrænsning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 416/2001 του Συμβουλίου,
    της 28ης Φεβρουαρίου 2001, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2820/98 του Συμβουλίου
    για την εφαρμογή πολυετούς συστήματος γενικευμένων
    δασμολογικών προτιμήσεων για την περίοδο από
    την 1η Ιουλίου 1999 έως τις 31 Δεκεμβρίου 2001, προκειμένου
    να επεκταθεί η δασμολογική απαλλαγή χωρίς
    κανένα ποσοτικό περιορισμό στα προϊόντα καταγωγής
    των λιγότερο ανεπτυγμένων χωρών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 416/2001, annettu 28 päivänä helmikuuta 2001,
    monivuotisen yleisen tullietuusjärjestelmän soveltamisesta 1 päivästä heinäkuuta
    1999 alkaen 31 päivään joulukuuta 2001 annetun asetuksen (EY) N:o 2820/98 muuttamisesta
    tullittomuuden laajentamiseksi koskemaan vähiten kehittyneistä maista peräisin
    olevia tuotteita ilman määrällisiä rajoituksia
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 416/2001 del Consiglio, del 28 febbraio 2001, che modifica
    il regolamento (CE) n. 2820/98 relativo all'applicazione di uno schema pluriennale
    di preferenze tariffarie generalizzate per il periodo 1° luglio 1999-31 dicembre
    2001 onde estendere ai prodotti originari dei paesi meno progrediti la franchigia
    doganale senza limiti quantitativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 416/2001 van de Raad van 28 februari 2001 tot wĳziging
    van Verordening (EG) nr. 2820/98 houdende toepassing, voor de periode van 1 juli
    1999 tot en met 31 december 2001 van een meerjarenschema van algemene tariefpreferenties,
    teneinde de douanevrĳstelling zonder enige kwantitatieve beperking uit te breiden
    tot producten van oorsprong uit de minst ontwikkelde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 416/2001 do Conselho, de 28 de Fevereiro de 2001,
    que altera o Regulamento (CE) n.° 2820/98 relativo à aplicação de um sistema
    plurianual de preferências pautais generalizadas durante o período compreendido
    entre 1 de Julho de 1999 e 31 de Dezembro de 2001, a fim de tornar extensiva aos
    produtos originários dos países menos avançados a isenção de direitos aduaneiros
    sem limites quantitativos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 416/2001 del Consejo, de 28 de febrero de 2001, por
    el que se modifica el Reglamento (CE) n° 2820/98 relativo a la aplicación de
    un plan plurianual de preferencias arancelarias generalizadas durante el período
    comprendido entre el 1 de julio de 1999 y el 31 de diciembre de 2001 con el fin
    de ampliar a los productos originarios de los países menos avanzados la franquicia
    de derechos de aduana sin ninguna limitación cuantitativa
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 416/2001 av den 28 februari 2001 om ändring
    av förordning (EG) nr 2820/98 om tillämpning av en flerårig ordning med allmänna
    tullförmåner under tiden 1 juli 1999–31 december 2001 i syfte att utsträcka
    tullfriheten utan någon kvantitativ begränsning till produkter med ursprung
    i de minst utvecklade länderna
  type: main
