title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1621/72 de la Commission, du 27 juillet 1972, fixant
    les taux des restitutions applicables, à compter du 1er août 1972, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1621/72 der Kommission vom 27. Juli 1972 zur Festsetzung
    der ab 1. August 1972 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1621/72 della Commissione, del 27 luglio 1972, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 agosto 1972, a
    taluni prodotti dei settori dei cereali e del riso esportati sotto forma di merci
    non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1621/72 van de Commissie van 27 juli 1972 houdende
    vaststelling van de restituties die met ingang van 1 augustus 1972 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goedefen
  type: main
