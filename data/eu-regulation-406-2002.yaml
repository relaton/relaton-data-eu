    στις προσφορές που κατατέθηκαν για τη 284η μερική
    δημοπρασία που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 406/2002, annettu 1 päivänä maaliskuuta 2002,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun 284. osittaisen tarjouskilpailun ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 406/2002 della Commissione, del 1° marzo 2002, che
    decide di non dar seguito alle offerte presentate per la 284a gara parziale effettuata
    nel quadro delle misure generali d'intervento conformemente al regolamento (CEE)
    n. 1627/89
  type: main
- language: nl
  script: Latn
