title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 406/2002 of 1 March 2002 deciding not to
    accept tenders submitted in response to the 284th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 406/2002 de la Commission du 1er mars 2002 disposant
    de ne pas donner suite aux offres déposées à la suite de la 284e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 406/2002 der Kommission vom 1. März 2002 über den
    Beschluss, den zur 284. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 406/2002 af 1. marts 2002 om ikke at
    tage den 284. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 406/2002 της Επιτροπής,
