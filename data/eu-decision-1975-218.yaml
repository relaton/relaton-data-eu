title:
- language: en
  script: Latn
  content: Commission Decision of 19 March 1975 authorizing the Kingdom of the Netherlands
    to permit, for a period which expires on 30 April 1975, the marketing of seed
    of spring wheat not complying with the requirements set out in the Council Directive
    on the marketing of cereal seed
  type: main
- language: fr
  script: Latn
  content: '75/218/CEE: Décision de la Commission, du 19 mars 1975, autorisant le
    Royaume des Pays-Bas à admettre, pour une période expirant le 30 avril 1975,
    la commercialisation de semences certifiées de froment (blé) de printemps ne
    répondant pas aux exigences de la directive du Conseil concernant la commercialisation
    de semences de céréales'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. März 1975 zur Ermächtigung des Königreichs
    der Niederlande, für einen Zeitraum, der am 30. April 1975 abläuft, Saatgut
    vom Sommerweizen zum gewerbsmäßigen Verkehr zuzulassen, das den Anforderungen
    der Richtlinie des Rates über den Verkehr mit Getreidesaatgut nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. marts 1975 om bemyndigelse til kongeriget
    Nederlandene til at tillade, at sædekorn af vårhvede, der ikke opfylder kravene
    i Rådets direktiv om handel med sædekorn, bringes i handelen i et tidsrum, der
    udløber den 30. april 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 marzo 1975, che autorizza il Regno
    dei Paesi Bassi ad ammettere, per un periodo che scade il 30 aprile 1975, la commercializzazione
    di sementi di frumento primaverile che non soddisfano alle norme della direttiva
    del Consiglio relativa alla commercializzazione delle sementi di cereali
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 maart 1975 tot machtiging van het Koninkrijk
    der Nederlanden om voor een periode eindigend op 30 april 1975 zaaizaad van zomertarwe,
    dat niet beantwoordt aan de eisen van de richtlijn van de Raad betreffende het
    in de handel brengen van zaaizaad van granen, tot de handel toe te laten
  type: main
