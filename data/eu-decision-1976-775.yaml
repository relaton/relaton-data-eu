title:
- language: en
  script: Latn
  content: '76/775/ECSC: Commission Decision of 28 July 1976 extending for six months
    Decision 71/314/ECSC of 27 July 1971 authorizing specialization Agreements covering
    the manufacture of rolled-steel products and Agreements for the setting up of
    an agency to allocate orders for merchant steel bars and wire rod between Eisenwerk-Gesellschaft
    Maximilianshütte mbH, Klóckner-Werke AG and Stahlwerke Peine-Salzgitter AG'
  type: main
- language: fr
  script: Latn
  content: '76/775/CECA: Décision de la Commission, du 28 juillet 1976, relative
    à la prorogation pour une période de six mois de la décision 71/314/CECA, du
    27 juillet 1971, autorisant des accords de spécialisation pour la production
    de laminés en acier et d'' accords relatifs à la création d'' un bureau de
    répartition des commandes d'' aciers marchands et de fil machine entre les entreprises
    Eisenwerk-Gesellschaft Maximilianshütte mbH, Klöckner-Werke AG et Stahlwerke
    Peine-Salzgitter AG'
  type: main
- language: de
  script: Latn
  content: '76/775/EGKS: Entscheidung der Kommission vom 28. Juli 1976 betreffend
    die Verlängerung um sechs Monate der Entscheidung 71/314/EGKS vom 27. Juli 1971
    über die Genehmigung von Vereinbarungen über Spezialisierung der Walzstahlproduktion
    sowie über eine Auftragslenkungsstelle für Stabstahl und Walzdraht zwischen
    der Eisenwerk-Gesellschaft Maximilianshütte mbH, Klöckner-Werke AG und Stahlwerke
    Peine-Salzgitter AG'
  type: main
- language: da
  script: Latn
  content: '76/775/EKSF: Kommissionens beslutning af 28. juli 1976 om forlængelse
    for en periode på seks måneder af beslutning 71/314/EKSF af 27. juli 1971 om
    godkendelse af aftaler om specialisering af fremstillingen af valsede produkter
    og om oprettelse af et kontor for fordeling af ordrer på handelsstål og valstråd
    mellem virksomhederne Eisenwerk-Gesellschaft Maximilianshütte mbH, Klöckner-Werke
    AG og Stahlwerke Peine-Salzgitter AG'
  type: main
- language: it
  script: Latn
  content: '76/775/CECA: Decisione della Commissione, del 28 luglio 1976, relativa
    alla proroga per un periodo di sei mesi della decisione 71/314/CECA, del 27 luglio
    1971, che autorizza accordi conclusi tra le imprese Eisenwerk-Gesellschaft Maximilianshütte
    mbH, Klöckner-Werke AG e Stahlwerke Peine-Salzgitter AG in merito alla specializzazione
    della produzione di acciai laminati ed all'' istituzione di un ufficio di ripartizione
    delle ordinazioni di laminati mercantili e di vergella e bordione'
  type: main
- language: nl
  script: Latn
  content: '76/775/EGKS: Beschikking van de Commissie van 28 juli 1976 inzake de verlenging
    van de geldigheidsduur voor een periode van zes maanden van Beschikking 71/314/EGKS
    van 27 juli 1971 houdende ontheffing van de verbodsbepalingen ten aanzien van
    overeenkomsten tussen de Eisenwerk-Gesellschaft Maximilianshütte mbH, Klöckner-Werke
    AG en Stahlwerke Peine-Salzgitter AG betreffende de specialisatie van de walsstaalproduktie
    en een onderverdelingsinstantie voor staafstaal en walsdraad'
