title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 402/81 of 17 February 1981 re-introducing
    the levying of the customs duties applicable to antibiotics, other than tetracycline,
    falling under heading No ex 29.44 of the Common Customs Tariff, originating in
    China and benefiting from the tariff preferences provided for by Council Regulation
    (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 402/81 de la Commission, du 17 février 1981, portant
    rétablissement de la perception des droits de douane applicables aux antibiotiques,
    autres que la tétracycline, de la position ex 29.44 du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 402/81 der Kommission vom 17. Februar 1981 zur Wiedereinführung
    der Erhebung der Zölle für Antibiotika, andere als Tetracycline, der Tarifnummer
    ex 29.44, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3322/80 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 402/81 af 17. februar 1981 om genindførelse
    af opkrævning af told for antibiotica, bortset fra tétracyclin, henhørende
    under pos. ex 29.44, med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 402/81 τής Επιτροπής
    τής 17ης Φεβρουαρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τά αντιβιοτικά,
    έτερα τής τετρακυκλίνης, τής δασμολογικής
    κλάσεως πρώην 29. 44, καταγωγής Κίνας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (ΕΟΚ) αριθ.
    3322/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 402/81 della Commissione, del 17 febbraio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli antibiotici, diversi
    dalla tetraciclina, della voce doganale ex 29.44 originari della Cina che beneficia
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 402/81 van de Commissie van 17 februari 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op antibiotica,
    andere dan tetracycline, van post ex 29.44, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
