title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 886/79 of 3 May 1979 re-establishing the
    levying of customs duties on other goat and kid skin leather, other, falling within
    subheading 41.04 B II and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 886/79 de la Commission, du 3 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux autres peaux de caprins
    non dénommées, de la sous-position 41.04 B II du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 886/79 der Kommission vom 3. Mai 1979 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder der Tarifstelle 41.04 B
    II, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 886/79 af 3. maj 1979 om genindførelse
    af opkrævning af toldafgifter for andet læder af gede- og gedeskind, andre varer,
    henhørende under pos. 41.04 B II i den fælles toldtarif, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 886/79 della Commissione, del 3 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli caprine, non nominate,
    della sottovoce doganale 41.04 B II, originarie dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 886/79 van de Commissie van 3 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten voor andere, geiteleder, overige, van post
    41.04 B II, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties werden geopend
  type: main
