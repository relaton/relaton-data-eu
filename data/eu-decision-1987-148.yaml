title:
- language: en
  script: Latn
  content: '87/148/EEC: Commission Decision of 18 February 1987 amending Decision
    81/888/EEC extending, as regards certain non-member countries, the periods relating
    to the checks on practices for the maintenance of varieties laid down in Directives
    70/457/EEC and 70/458/EEC'
  type: main
- language: fr
  script: Latn
  content: '87/148/CEE: Décision de la Commission du 18 février 1987 modifiant la
    décision 81/888/CEE visant à proroger, en ce qui concerne certains pays tiers,
    le délai concernant les contrôles de sélections conservatrices prévu par les
    directives 70/457/CEE et 70/458/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '87/148/EWG: Entscheidung der Kommission vom 18. Februar 1987 zur Änderung
    der Entscheidung 81/888/EWG zur Verlängerung der in den Richtlinien 70/457/EWG
    und 70/458/EWG vorgesehenen Fristen für die Kontrollen der Erhaltungszüchtungen
    für einige Drittländer'
  type: main
- language: da
  script: Latn
  content: '87/148/EØF: Kommissionens beslutning af 18. februar 1987 om ændring
    af beslutning 81/888/EØF om forlængelse for visse tredjelandes vedkommende af
    fristerne for kontrol med vedligeholdelsesavl i direktiv 70/457/EØF og 70/458/EØF'
  type: main
- language: el
  script: Grek
  content: '87/148/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Φεβρουαρίου 1987 για την τροποποίηση της απόφασης
    81/888/ΕΟΚ περί παρατάσεως, όσον αφορά ορισμένες
    τρίτες χώρες, της προθεσμίας η οποία προβλέπεται
    σχετικά με τους ελέγχους των διατηρητέων ποικιλιών
    στις οδηγίες 70/457/ΕΟΚ και 70/578/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: '87/148/CEE: Decisione della Commissione del 18 febbraio 1987 recante modifica
    della decisione 81/888/CEE che proroga, per quanto concerne taluni paesi terzi,
    il termine concernente i controlli delle selezioni conservatrici previsto dalle
    direttive 70/457/CEE e 70/458/CEE'
  type: main
- language: nl
  script: Latn
  content: '87/148/EEG: Beschikking van de Commissie van 18 februari 1987 houdende
    wijziging van Beschikking 81/888/EEG tot verlenging, voor bepaalde derde landen,
    van de in de Richtlijnen 70/457/EEG en 70/458/EEG vastgestelde termijnen voor
    controles op de instandhouding'
  type: main
- language: pt
  script: Latn
  content: '87/148/CEE: Decisão da Comissão de 18 de Fevereiro de 1987 que altera
    a Decisão 81/888/CEE que prorroga, no que diz respeito a determinados países
    não-membros, os períodos relativos aos controlos das selecções de conservação
    de variedades previstos nas Directivas 70/457/CEE e 70/458/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '87/148/CEE: Decisión de la Comisión de 18 de febrero de 1987 por la
    que se modifica la Decisión 81/888/CEE que establece la prolongación, en lo
    que concierne a determinados terceros países, de los períodos relativos a los
    controles sobre los procedimientos de selección conservadora de las variedades
    especificadas en las Directivas 70/457/CEE y 70/458/CEE'
