  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/934 оd 12. ožujka 2019. o dopuni
    Uredbe (EU) br. 1308/2013 Europskog parlamenta i Vijeća u pogledu vinogradarskih
    područja u kojima se može povećati alkoholna jakost, odobrenih enoloških postupaka
    i ograničenja primjenjivih na proizvodnju i čuvanje proizvoda od vinove loze,
    najmanjeg postotka alkohola za nusproizvode i njihova odlaganja te objave zapisa
    OIV-a
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/934 felhatalmazáson alapuló rendelete (2019. március
