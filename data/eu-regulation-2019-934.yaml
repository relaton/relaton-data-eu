    engedélyezésére vonatkozó lehetőség által érintett szőlőtermő területek,
    az engedélyezett borászati eljárások és a szőlőből készült termékek
    előállítására és tartósítására alkalmazandó korlátozások, a melléktermékek
    százalékos arányban megadott minimális alkoholtartalma és a melléktermékek
    kivonása, valamint az OIV adatlapjainak közzététele tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/934 della Commissione, del 12 marzo 2019,
    che integra il regolamento (UE) n. 1308/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le zone viticole in cui il titolo alcolometrico può essere
    aumentato, le pratiche enologiche autorizzate e le restrizioni applicabili in
    materia di produzione e conservazione dei prodotti vitivinicoli, la percentuale
    minima di alcole per i sottoprodotti e la loro eliminazione, nonché la pubblicazione
    delle schede dell'OIV
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/934 (2019. gada 12. marts), ar ko
