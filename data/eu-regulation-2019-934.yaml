    f'dak li jirrigwarda ż-żoni ta' vitikultura li fihom tista' tiżdied il-qawwa
    alkoħolika, il-prattiki enoloġiċi awtorizzati u r-restrizzjonijiet applikabbli
    għall-produzzjoni u l-konservazzjoni tal-prodotti tad-dielja, il-persentaġġ
    minimu tal-alkoħol għall-prodotti sekondarji u r-rimi tagħhom, u l-pubblikazzjoni
    tal-fajls tal-OIV
  type: main
