    uz vīnogu audzēšanas apgabaliem, kuros spirta koncentrāciju var paaugstināt,
    atļautajām vīndarības metodēm un ierobežojumiem, kas piemērojami vīnkopības
    produktu ražošanai un konservācijai, minimālo spirta procentuālo daudzumu
    attiecībā uz blakusproduktiem un to realizēšanu, un OIV punktu publicēšanu
  type: main
- language: lt
  script: Latn
  content: 2019 m. kovo 12 d. Komisijos deleguotasis reglamentas (ES) 2019/934, kuriuo
