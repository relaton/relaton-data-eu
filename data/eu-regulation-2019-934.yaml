    dėl vynuogių auginimo zonų, kuriose galima padidinti alkoholio koncentraciją,
    leidžiamų vynininkystės metodų ir apribojimų, taikytinų vynuogių produktų
    gamybai ir laikymui, mažiausios procentinės alkoholio koncentracijos šalutiniuose
    produktuose bei tų produktų šalinimo ir OIV bylų paskelbimo
  type: main
