    tot de productie en de bewaring van wijnbouwproducten, het minimale alcoholpercentage
    voor bijproducten en de verwijdering van die producten, en de bekendmaking van
    OIV-dossiers
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2019/934 z dnia 12 marca 2019 r.
    uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1308/2013
    w odniesieniu do obszarów uprawy winorośli, w przypadku których zawartość
    alkoholu może być zwiększona, dozwolonych praktyk enologicznych i ograniczeń
    mających zastosowanie do produkcji i konserwowania produktów sektora win, minimalnej
    zawartości alkoholu w odniesieniu do produktów ubocznych oraz ich usuwania,
    a także publikacji dokumentów OIV
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/934 da Comissão, de 12 de março de 2019,
    que completa o Regulamento (UE) n.° 1308/2013 do Parlamento Europeu e do Conselho
    no que respeita às zonas vitícolas em que o título alcoométrico pode ser aumentado,
    às práticas enológicas autorizadas e às restrições aplicáveis à produção
    e conservação dos produtos vitivinícolas, à percentagem mínima de álcool
    dos subprodutos e à sua eliminação, bem como à publicação das fichas da
    OIV
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/934 al Comisiei din 12 martie 2019 de completare
    a Regulamentului (UE) nr. 1308/2013 al Parlamentului European și al Consiliului
    în ceea ce privește zonele viticole în care poate fi majorată tăria alcoolică,
    practicile oenologice autorizate și restricțiile aplicabile producerii și conservării
    produselor vitivinicole, procentajul minim de alcool al subproduselor și eliminarea
    acestora și publicarea fișelor OIV
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/934 z 12. marca 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1308/2013, pokiaľ
    ide o vinohradnícke oblasti, v ktorých sa môže zvýšiť obsah alkoholu, povolené
    enologické postupy a obmedzenia uplatniteľné na výrobu a konzervovanie vinárskych
    výrobkov, minimálny percentuálny podiel alkoholu pri vedľajších produktoch
    a ich zneškodňovanie a zverejňovanie dokumentov OIV
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/934 z dne 12. marca 2019 o dopolnitvi
    Uredbe (EU) št. 1308/2013 Evropskega parlamenta in Sveta glede vinorodnih območij,
    na katerih je mogoče delež alkohola povečati, dovoljenih enoloških postopkov
    in omejitev, povezanih s pridelavo in konzerviranjem proizvodov vinske trte, najmanjšega
    odstotnega deleža alkohola za stranske proizvode in njihovega odstranjevanja
    ter objave spisov OIV
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/934 de la Comisión, de 12 de marzo de 2019,
    por el que se completa el Reglamento (UE) n.° 1308/2013 del Parlamento Europeo
    y del Consejo en lo que se refiere a las zonas vitícolas donde el grado alcohólico
    pueda verse incrementado, las prácticas enológicas autorizadas y las restricciones
    aplicables a la producción y conservación de los productos vitícolas, el porcentaje
    mínimo de alcohol para subproductos y la eliminación de estos, y la publicación
    de las fichas de la OIV
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/934 av den 12 mars 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1308/2013
    vad gäller vinodlingsområden där alkoholhalten får höjas, tillåtna oenologiska
    metoder och restriktioner som är tillämpliga på framställning och bevarande
    av vinprodukter, lägsta alkoholhalt för biprodukter och bortskaffande av dessa
    samt offentliggörande av OIV-akter
