id: EUDecision202161
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/61 of 22 January 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603
    and genetically modified maize combining two, three or four of the single events
    MON 87427, MON 87460, MON 89034, MIR162 and NK603, pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2021) 255) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/61 de la Commission du 22 janvier 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 et du maïs génétiquement
    modifié combinant deux, trois ou quatre des événements simples MON 87427, MON
    87460, MON 89034, MIR162 et NK603, consistant en ces maïs ou produits à partir
    de ceux-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 255] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/61 der Kommission vom 22. Januar 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 enthalten,
    aus ihm bestehen oder aus ihm hergestellt werden, und von genetisch veränderten
    Maissorten, in denen zwei, drei oder vier der Einzelereignisse MON 87427, MON
    87460, MON 89034, MIR162 und NK603 kombiniert werden, gemäß der Verordnung (EG)
    Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter
    Aktenzeichen C(2021) 255) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/61 на Комисията
    от 22 януари 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 и генетично
    модифицирана царевица, съвместяваща две, три
    или четири от единичните събития MON 87427, MON 87460,
    MON 89034, MIR162 и NK603, в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2021) 255) (само текстът
    на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/61, ze dne 22. ledna 2021 o povolení
    uvádění produktů, které obsahují geneticky modifikovanou kukuřici MON 87427
    × MON 87460 × MON 89034 × MIR162 × NK603 a geneticky modifikovanou kukuřici
    kombinující dvě, tři nebo čtyři z jednoduchých událostí MON 87427, MON
    87460, MON 89034, MIR162 a NK603, sestávají z nich nebo jsou z nich vyrobeny,
    na trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2021) 255) (Pouze nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/61 af 22. januar 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 87427 × MON 87460 × MON 89034 ×
    MIR162 × NK603-majs og genetisk modificeret majs, der kombinerer to, tre eller
    fire af begivenhederne MON 87427, MON 87460, MON 89034, MIR162 og NK603, i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under
    nummer C(2021) 255) (Kun den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/61 της Επιτροπής
    της 22ας Ιανουαρίου 2021 για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 και γενετικώς
    τροποποιημένο αραβόσιτο που συνδυάζει δύο,
    τρία ή τέσσερα από τα μονά συμβάντα MON 87427, MON
    87460, MON 89034, MIR162 και NK603, σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου [κοινοποιηθείσα υπό τον
    αριθμό C(2021) 255] (Το κείμενο στην ολλανδική γλώσσα
    είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/61, 22. jaanuar 2021, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi MON 87427 × MON 87460 × MON 89034 × MIR162
    × NK603 ning geneetiliselt muundatud maisi, milles on kombineeritud kaks, kolm
    või neli MON 87427, MON 87460, MON 89034, MIR162 ja NK603 transformatsioonidest,
    sisaldavaid, neist koosnevaid või valmistatud tooteid (teatavaks tehtud numbri
    C(2021) 255 all) (Ainult hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/61, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä maissia MON 87427 × MON 87460 × MON 89034 ×
    MIR162 × NK603 ja muunnostapahtumista MON 87427, MON 87460, MON 89034, MIR162
    ja NK603 kahta, kolmea tai neljää yhdistelemällä muodostettua muuntogeenistä
    maissia sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden
    markkinoille saattamisen sallimisesta Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla C(2021) 255) (Ainoastaan
    hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/61 оd 22. siječnja 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603, sastoje se ili su proizvedeni
    od njega, i genetski modificirani kukuruz u kojem se kombiniraju dvije, tri ili
    četiri od pojedinačnih promjena MON 87427, MON 87460, MON 89034, MIR162 i NK603,
    na temelju Uredbe (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno
    pod brojem dokumenta C(2021) 255) (Vjerodostojan je samo tekst na nizozemskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/61 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított MON 87427 × MON 87460 × MON 89034 × MIR162
    × NK603 kukoricát és a géntechnológiával módosított, a MON 87427, a MON
    87460, a MON 89034, a MIR162 és az NK603 egyszeres genetikai események közül
    kettőt, hármat vagy négyet ötvöző kukoricát tartalmazó, abból álló
    vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2021) 255. számú dokumentummal történt) (Csak a holland nyelvű szöveg
    hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/61 della Commissione del 22 gennaio 2021
    che autorizza l'immissione in commercio di prodotti contenenti, costituiti o derivati
    dal granturco geneticamente modificato MON 87427 × MON 87460 × MON 89034 ×
    MIR162 × NK603 e dal granturco geneticamente modificato che combina due, tre
    o quattro dei singoli eventi MON 87427, MON 87460, MON 89034, MIR162 e NK603 a
    norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2020) 255] (Il testo in lingua neerlandese è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/61 (2021. gada 22. janvāris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MON 87427
    × MON 87460 × MON 89034 × MIR162 × NK603 un tādu ģenētiski modificēto
    kukurūzu, kurā kombinēti divi, trīs vai četri vienkārši notikumi MON 87427,
    MON 87460, MON 89034, MIR162 un NK603, no tās sastāv vai ir no tās ražoti
    (izziņots ar dokumenta numuru C(2021) 255) (Autentisks ir tikai teksts nīderlandiešu
    valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/61 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 ir genetiškai modifikuotų
    kukurūzų, sudarytų iš dviejų, trijų ar keturių atskirų MON 87427, MON
    87460, MON 89034, MIR162 ir NK603 transformacijos įvykių derinių, kurie iš
    šių kukurūzų sudaryti arba pagaminti (pranešta dokumentu Nr. C(2021) 255)
    (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/61 tat-22
    ta’ Jannar 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu jew li huma prodotti mill-qamħirrum modifikat ġenetikament MON 87427
    × MON 87460 × MON 89034 × MIR162 × NK603, u mill-qamħirrum modifikat ġenetikament
    li jikkombina tnejn, tlieta jew erbgħa mill-eventi uniċi MON 87427, MON 87460,
    MON 89034, MIR162 u NK603 skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill dwar ikel u għalf modifikat ġenetikament (notifikata bid-dokument
    C(2021) 255) (It-test Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/61 van de Commissie van 22 januari 2021 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 en genetisch gemodificeerde
    maisrassen die twee, drie of vier van de afzonderlijke transformatiestappen MON
    87427, MON 87460, MON 89034, MIR162 en NK603 combineren, overeenkomstig Verordening
    (EG) nr. 1829/2003 van het Europees Parlement en de Raad (Kennisgeving geschied
    onder nummer C(2021) 255) (Slechts de tekst in de Nederlandse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/61 z dnia 22 stycznia 2021 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 oraz rodzaje genetycznie
    zmodyfikowanej kukurydzy łączące dwie, trzy lub cztery modyfikacje MON 87427,
    MON 87460, MON 89034, MIR162 i NK603, produktów składających się z wymienionych
    rodzajów genetycznie zmodyfikowanej kukurydzy lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2021) 255) (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/61 da Comissão de 22 de janeiro de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado MON 87427 ×
    MON 87460 × MON 89034 × MIR162 × NK603 e milho geneticamente modificado combinando
    dois, três ou quatro dos eventos únicos MON 87427, MON 87460, MON 89034, MIR162
    e NK603, nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e
    do Conselho [notificada com o número C(2021) 255] (Apenas faz fé o texto na
    língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/61 a Comisiei din 22 ianuarie
    2021 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MON 87427 × MON 87460 ×
    MON 89034 × MIR162 × NK603 și din porumb modificat genetic obținut din combinarea
    a două, trei sau patru dintre evenimentele de transformare MON 87427, MON 87460,
    MON 89034, MIR162 și NK603 în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului [notificată cu numărul C(2021) 255] (Numai textul
    în limba neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/61 z 22. januára 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    MON 87427 × MON 87460 × MON 89034 × MIR162 × NK603 a geneticky modifikovanú
    kukuricu obsahujúcu kombináciu dvoch, troch alebo štyroch genetických modifikácií
    MON 87427, MON 87460, MON 89034, MIR162 a NK603, sú z nich zložené alebo vyrobené
    [oznámené pod číslom C(2021) 255] (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/61 z dne 22. januarja 2021 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 87460 × MON 89034 × MIR162 × NK603, so iz nje sestavljeni ali proizvedeni,
    in gensko spremenjeno koruzo, v kateri so združeni dva, trije ali štirje od
    dogodkov MON 87427, MON 87460, MON 89034, MIR162 in NK603, v skladu z Uredbo (ES)
    št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno številko
    C(2021) 255) (Besedilo v nizozemskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/61 de la Comisión de 22 de enero de
    2021 por la que se autoriza la comercialización de productos que contengan, se
    compongan o se hayan producido a partir de maíz modificado genéticamente MON
    87427 × MON 87460 × MON 89034 × MIR162 × NK603, y de maíz modificado genéticamente
    que combina dos, tres o cuatro de los eventos únicos MON 87427, MON 87460, MON
    89034, MIR162 y NK603, de conformidad con el Reglamento (CE) n.o 1829/2003 del
    Parlamento Europeo y del Consejo [notificada con el número C(2021) 255] (El texto
    en lengua neerlandesa es el único auténtico)
  type: main
