  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/61 av den 22 januari 2021 om
    godkännande för utsläppande på marknaden av produkter som innehåller, består
    av eller har framställts av den genetiskt modifierade majsen MON 87427 × MON
    87460 × MON 89034 × MIR162 × NK603 och av genetiskt modifierad majs som kombinerar
    två, tre eller fyra av de enskilda transformationshändelserna MON 87427, MON
    87460, MON 89034, MIR162 och NK603, i enlighet med Europaparlamentets och rådets
    förordning (EG) nr 1829/2003 [delgivet med nr C(2021) 255] (Endast den nederländska
    texten är giltig)
