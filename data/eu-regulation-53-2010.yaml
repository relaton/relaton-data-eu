    1287/2009 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 23/2010/EU rendelete ( 2010. január 14. ) a fogási korlátozások
    hatálya alá tartozó vizeken tartózkodó uniós hajókra és az uniós vizekre
    bizonyos halállományok és halállománycsoportok tekintetében alkalmazandó
    halászati lehetőségeknek a 2010. évre történő meghatározásáról, és
    az 1359/2008/EK rendelet, a 754/2009/EK rendelet, az 1226/2009/EK rendelet és
    az 1287/2009/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 23/2010 del Consiglio, del 14 gennaio 2010 , che stabilisce,
    per il 2010, le possibilità di pesca e le condizioni ad esse associate per alcuni
    stock o gruppi di stock ittici, applicabili nelle acque UE e, per le navi UE,
    in altre acque dove sono imposti limiti di cattura, e che modifica i regolamenti
    (CE) n. 1359/2008, (CE) n. 754/2009, (CE) n. 1226/2009 e (CE) n. 1287/2009
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) Nr. 23/2010 ( 2010. gada 14. janvāris ), ar ko 2010.
    gadam nosaka konkrētu zivju krājumu un zivju krājumu grupu zvejas iespējas,
    kuras piemērojamas ES ūdeņos un – attiecībā uz ES kuģiem – ūdeņos,
    kur nepieciešami nozvejas limiti, un ar ko groza Regulu (EK) Nr. 1359/2008, (EK)
    Nr. 754/2009, (EK) Nr. 1226/2009 un (EK) Nr. 1287/2009
  type: main
