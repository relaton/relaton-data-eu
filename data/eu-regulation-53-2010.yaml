    galimybės, taikomos ES vandenyse ir ES laivams vandenyse, kuriuose reikalaujama
    nustatyti sužvejojamo žuvų kiekio apribojimus, ir iš dalies keičiami Reglamentai
    (EB) Nr. 1359/2008, (EB) Nr. 754/2009, (EB) Nr. 1226/2009 bei (EB) Nr. 1287/2009
  type: main
- language: mt
  script: Latn
