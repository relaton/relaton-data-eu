title:
- language: en
  script: Latn
  content: Council Regulation (EU) No 23/2010 of 14 January 2010 fixing for 2010 the
    fishing opportunities for certain fish stocks and groups of fish stocks, applicable
    in EU waters and, for EU vessels, in waters where catch limitations are required
    and amending Regulations (EC) No 1359/2008, (EC) No 754/2009, (EC) No 1226/2009
    and (EC) No 1287/2009
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 23/2010 du Conseil du 14 janvier 2010 établissant,
    pour 2010, les possibilités de pêche pour certains stocks halieutiques et groupes
    de stocks halieutiques, applicables dans les eaux de l'UE et, pour les navires
    de l'UE, dans les eaux soumises à des limitations de capture et modifiant les
    règlements (CE) n o 1359/2008, (CE) n o 754/2009, (CE) n o 1226/2009 et (CE)
    n o 1287/2009
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 23/2010 des Rates vom 14. Januar 2010 zur Festsetzung
    der Fangmöglichkeiten für bestimmte Fischbestände und Bestandsgruppen in den
    EU-Gewässern sowie für EU-Schiffe in Gewässern mit Fangbeschränkungen und
    zur Änderung der Verordnungen (EG) Nr. 1359/2008, (EG) Nr. 754/2009, (EG) Nr.
    1226/2009 und (EG) Nr. 1287/2009
  type: main
- language: bg
  script: Cyrl
