    2010 година за установяване на възможностите
    за риболов на определени рибни запаси и групи
    от рибни запаси за 2010 г., приложими във водите
    на ЕС и за корабите на ЕС във води, които подлежат
    на ограничения на улова, и за изменение на регламенти
    (ЕО) № 1359/2008, (EО) № 754/2009, (EО) № 1226/2009 и (EО) № 1287/2009
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) č. 23/2010 ze dne 14. ledna 2010 , kterým se na
    rok 2010 stanoví rybolovná práva pro některé populace ryb a skupiny populací
    ryb platná ve vodách EU a pro plavidla EU ve vodách podléhajících omezením
    odlovů a kterým se mění nařízení (ES) č. 1359/2008, (ES) č. 754/2009,
    (ES) č. 1226/2009 a (ES) č. 1287/2009
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EU) nr. 23/2010 af 14. januar 2010 om fastsættelse
    for 2010 af fiskerimuligheder for visse fiskebestande og grupper af fiskebestande
    gældende for EU-farvande og for EU-fartøjer i andre farvande, som er omfattet
    af fangstbegrænsninger, og om ændring af forordning (EF) nr. 1359/2008, (EF)
    nr. 754/2009, (EF) nr. 1226/2009 og (EF) nr. 1287/2009
  type: main
- language: el
  script: Grek
