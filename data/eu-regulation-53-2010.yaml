    ta' stokkijiet ta' ħut, applikabbli fl-ilmijiet tal-UE u, għal bastimenti tal-UE
    f'ilmijiet fejn huma meħtieġa limiti ta' qbid u li jemenda r-Regolamenti (KE)
    Nru 1359/2008, (KE) Nru 754/2009, (KE) Nru 1226/2009 u (KE) Nru 1287/2009
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 23/2010 van de raad van 14 januari 2010 tot vaststelling,
    voor 2010, van de vangstmogelijkheden voor sommige visbestanden en groepen visbestanden
    welke in de wateren van de EU en, voor vaartuigen van de EU, in andere wateren
    met vangstbeperkingen van toepassing zijn en tot wijziging van Verordening (EG)
    nr. 1359/2008, Verordening (EG) nr. 754/2009, Verordening (EG) nr. 1226/2009 en
    Verordening (EG) nr. 1287/2009
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) nr 23/2010 z dnia 14 stycznia 2010 r. ustalające
    uprawnienia do połowów na 2010 rok dla pewnych stad ryb i grup stad ryb, stosowane
    na wodach UE oraz w odniesieniu do statków UE na wodach, na których wymagane
    są ograniczenia połowowe oraz zmieniające rozporządzenia (WE) nr 1359/2008,
    (WE) nr 754/2009, (WE) nr 1226/2009 oraz (WE) nr 1287/2009
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 23/2010 do Conselho, de 14 de Janeiro de 2010 , que
    fixa, para 2010, em relação a determinadas populações de peixes ou grupos
    de populações de peixes, as possibilidades de pesca aplicáveis nas águas da
    UE e, para os navios de pesca da UE, nas águas sujeitas a limitações das capturas,
    e que altera os Regulamentos (CE) n. o 1359/2008, (CE) n. o 754/2009, (CE) n.
    o 1226/2009 e (CE) n. o 1287/2009
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 23/2010 al Consiliului din 14 ianuarie 2010 de stabilire,
    pentru 2010, a posibilităților de pescuit pentru anumite resurse halieutice
    și grupe de resurse halieutice, aplicabile în apele UE și, pentru navele din
    UE, în ape în care sunt necesare limitări ale capturilor și de modificare
    a Regulamentelor (CE) nr. 1359/2008, (CE) nr. 754/2009, (CE) nr. 1226/2009 și
    (CE) nr. 1287/2009
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) č. 23/2010 zo 14. januára 2010 , ktorým sa na
    rok 2010 stanovujú rybolovné možnosti pre určité populácie rýb a skupiny
    populácií rýb uplatniteľné vo vodách EÚ a pre plavidlá EÚ vo vodách,
    v ktorých sa vyžaduje obmedzovanie výlovu, a ktorým sa menia a dopĺňajú
    nariadenia (ES) č. 1359/2008, (ES) č. 754/2009, (ES) č. 1226/2009 a (ES) č.
    1287/2009
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) št. 23/2010 z dne 14. januarja 2010 o določitvi ribolovnih
    možnosti za leto 2010 za nekatere staleže rib in skupine staležev rib, ki se
    uporabljajo v vodah EU, in za plovila EU v vodah, kjer so potrebne omejitve ulova
    ter o spremembah Uredb (ES) št. 1359/2008, (ES) št. 754/2009, (ES) št. 1226/2009
    in (ES) št. 1287/2009
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 23/2010 del Consejo, de 14 de enero de 2010 , por el
    que se establecen, para 2010, las posibilidades de pesca para determinadas poblaciones
    y grupos de poblaciones de peces, aplicables en aguas de la UE y, en el caso de
    los buques de la UE, en las demás aguas donde sea necesario establecer limitaciones
    de capturas y se modifican los Reglamentos (CE) n o 1359/2008, (CE) n o 754/2009,
    (CE) n o 1226/2009 y (CE) n o 1287/2009
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) nr 23/2010 av den 14 januari 2010 om fastställande
    för år 2010 av fiskemöjligheterna för vissa fiskbestånd och grupper av fiskbestånd
    i EU-vatten och, för EU-fartyg, i andra vatten där fångstbegränsningar krävs
    och om ändring av förordningarna (EG) nr 1359/2008, (EG) nr 754/2009, (EG) nr
    1226/2009 och (EG) nr 1287/2009
