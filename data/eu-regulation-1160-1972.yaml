title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1160/72 de la Commission, du 1er juin 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux accumulateurs électriques au plomb, de la sous-position tarifaire 85.04 A,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1160/72 der Kommission vom 1. Juni 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für elektrische Akkumulatoren der Tarifnummer
    85.04 A, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2795/71
    des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1160/72 della Commissione, del 1 giugno 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    accumulatori elettrici al piombo della sottovoce doganale n. 85.04 A originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: 'Verordening (EEG) nr. 1160/72 van de Commissie van 1 juni 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op elektrische accumulatoren: accumulatoren met loden platen, van
    onderverdeling 85.04 A, van oorsprong uit Joegoslavië, ten behoeve waarvan bij
    Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend'
  type: main
