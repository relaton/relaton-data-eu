id: EUDecision1982928
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '82/928/EEC: Commission Decision of 20 December 1982 establishing that
    the apparatus described as ''Waters - High Pressure Liquid Chromatograph, consisting
    of : Solvent Delivery System, model 6000 A, Universal Injector, model U6K, Absorbance
    Detector, model 440, Solvent Programmer Accessory, model 660'' may be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/928/CEE: Décision de la Commission, du 20 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Waters - high pressure liquid chromatograph,
    consisting of : Solvent delivery system, model 6000 A, Universal injector, model
    U6K, Absorbance detector, model 440, Solvent programmer accessory, model 660"
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/928/EWG: Entscheidung der Kommission vom 20. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,Waters - High Pressure Liquid Chromatograph,
    bestehend aus : Solvent Delivery System, model 6000 A, Universal Injector, model
    U6K, Absorbance Detector, model 440, Solvent Programmer Accessory, model 660"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/928/EØF: Kommissionens beslutning af 20. december 1982 om fastslåelse
    af, at indførsel af apparatet "Waters - High Pressure Liquid Chromatograph, consisting
    of : Solvent Delivery System, model 6000 A, Universal Injector, model U6K, Absorbance
    Detector, model 440, Solvent programmer Accessory, model 660" kan ske med fritagelse
    for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/928/EOK: Απόφαση τής Επιτροπής τής 20ής Δεκεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Waters-High Preasure Liquid Chromatograph, consisting
    of: Solvent Delivery System, model 6000 A, Universal Injector, model U6K, Absorbance
    Detector, model 440, Solvent Programmer Accessory, model 660» δύναται
    νά πραγματοποιηθεί ατελώς, ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/928/CEE: Decisione della Commissione, del 20 dicembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Waters - High Pressure Liquid
    Chromatograph, consisting of : Solvent Delivery System, model 6000 A, Universal
    Injector, model U6K, Absorbance Detector, model 440, Solvent Programmer Accessory,
    model 660" può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/928/EEG: Beschikking van de Commissie van 20 december 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Waters - High Pressure Liquid Chromatograph
    consisting of : Solvent Delivery System, model 6000 A ; Universal Injector, model
    U6K ; Absorbance Detector, model 440 ; Solvent Programmer Accessory, model 660"
    met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
  type: main
