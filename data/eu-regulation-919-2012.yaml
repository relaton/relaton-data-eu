    aventi a oggetto la copertura del rischio di inadempimento dell’emittente (
    credit default swap ) per quanto riguarda le norme tecniche di regolamentazione
    sul metodo di calcolo della diminuzione di valore per i titoli azionari liquidi
    e per altri strumenti finanziari
  type: main
