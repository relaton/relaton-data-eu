title:
- language: en
  script: Latn
  content: '2000/780/EC: Commission Decision of 28 November 2000 amending Decision
    93/467/EEC authorising Member States to provide for derogations from certain provisions
    of Council Directive 2000/29/EC, in respect of oak (Quercus L.) logs with bark
    attached, originating in Canada or the United States of America (notified under
    document number C(2000) 3582)'
  type: main
- language: fr
  script: Latn
  content: '2000/780/CE: Décision de la Commission du 28 novembre 2000 modifiant
    la décision 93/467/CEE autorisant les États membres à prévoir des dérogations
