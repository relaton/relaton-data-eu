title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1056/2004 of 28 May 2004 amending Regulation
    (EC) No 1555/96 as regards the trigger levels for additional duties on lemons,
    table grapes, pears, apricots, peaches, including nectarines, and plums
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1056/2004 de la Commission du 28 mai 2004 modifiant
    le règlement (CE) n° 1555/96, en ce qui concerne le volume de déclenchement
    des droits additionnels pour les citrons, les raisins de table, les poires, les
    abricots, les pêches, y compris les brugnons et nectarines, et les prunes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1056/2004 der Kommission vom 28. Mai 2004 zur Änderung
    der Verordnung (EG) Nr. 1555/96 in Bezug auf die Auslösungsschwellen für die
    Zusatzzölle für Zitronen, Tafeltrauben, Birnen, Aprikosen, Pfirsiche, einschließlich
    Brugnolen und Nektarinen, und Pflaumen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1056/2004 ze dne 28. května 2004, kterým
    se mění nařízení (ES) č. 1555/96 o spouštěcích objemech pro dodatečná
    cla na citróny, stolní hrozny, hrušky, meruňky, broskve včetně nektarinek,
    a švestky
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1056/2004 af 28. maj 2004 om ændring
    af forordning (EF) nr. 1555/96 for så vidt angår de mængder, der udløser tillægstold
    for citroner, spisedruer, pærer, abrikoser, ferskner, herunder blodferskner og
    nektariner, og blommer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1056/2004 της Επιτροπής,
    της 28ης Μαΐου 2004, για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1555/96 όσον αφορά τον όγκο ενεργοποίησης
    πρόσθετων δασμών για τα λεμόνια, τα επιτραπέζια
    σταφύλια, τα αχλάδια, τα βερίκοκα, τα ροδάκινα,
    στα οποία συμπεριλαμβάνονται τα brugnon και τα
    νεκταρίνια, και τα δαμάσκηνα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1056/2004, 28. mai 2004, millega muudetakse
    määrust (EÜ) nr 1555/96, seoses sidrunite, lauaviinamarjade, aprikooside, virsikute,
    sealhulgas nektariinide, ja ploomide täiendavate tollimaksude käivituslävedega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1056/2004, annettu 28 päivänä toukokuuta 2004,
    asetuksen (EY) N:o 1555/96 muuttamisesta sen määrän osalta, josta alkaen sitruunoista,
    syötäviksi tarkoitetuista viinirypäleistä, päärynöistä, aprikooseista,
    persikoista (myös nektariineista) ja luumuista kannetaan lisätullia
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1056/2004/EK rendelete (2004. május 28.) az 1555/96/EK rendelet
    módosításáról a citromra, a csemegeszőlőre, a körtére, a kajszibarackra,
    az őszibarackra – ideértve a nektarint is –, valamint a szilvára vonatkozó
    kiegészítő vámok küszöbszintjei tekintetében
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1056/2004 della Commissione, del 28 maggio 2004, che
    modifica il regolamento (CE) n. 1555/96 per quanto riguarda i livelli limite per
    l’applicazione dei dazi addizionali per i limoni, le uve da tavola, le pere,
    le albicocche, le pesche, comprese le pesche noci, e le prugne
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1056/2004 (2004. gada 28. maijs), ar kuru groza
    Regulu (EK) Nr. 1555/96 par papildu muitas nodokļa trigera apjomu citroniem,
    galda vīnogām, bumbieriem, aprikozēm, persikiem, ieskaitot nektarīnus, un
    ķiršiem
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 28 d. Komisijos reglamentas (EB) Nr. 1056/2004 iš dalies
    keičiantis Reglamentą (EB) Nr. 1555/96 dėl papildomų muitų trigerinio kiekio
    citrinoms, valgomosioms vynuogėms, kriaušėms, abrikosams, persikams, įskaitant
    brunonus ir nektarinus, bei slyvoms
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1056/2004 van de Commissie van 28 mei 2004 tot wijziging
    van Verordening (EG) nr. 1555/96 met betrekking tot de drempelvolumes voor de
    toepassing van de aanvullende rechten voor citroenen, tafeldruiven, peren, abrikozen,
    perziken, nectarines daaronder begrepen, en pruimen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1056/2004 z dnia 28 maja 2004 r. zmieniające
    rozporządzenie (WE) nr 1555/96 odnośnie wartości progowych dodatkowych należności
    na cytryny, winogrona deserowe, gruszki, morele, brzoskwinie (włącznie z nektarynkami)
    oraz śliwki
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1056/2004 da Comissão, de 28 de Maio de 2004, que
    altera o Regulamento (CE) n.° 1555/96 no que se refere ao volume de desencadeamento
    dos direitos adicionais aplicáveis aos limões, uvas de mesa, peras, damascos,
    pêssegos, incluindo as nectarinas, e às ameixas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1056/2004 zo dňa 28. mája 2004, ktoré upravuje
    nariadenie (ES) č. 1555/96, čo sa týka spúštacieho prahu dodatočných dovozných
    ciel na citróny, stolové hrozno, hrušky, marhule, broskyne vrátane nektáriniek
    a slivky
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1056/2004 z dne 28. maja 2004 o spremembah Uredbe
    (ES) št. 1555/96, ki zadevajo količine za dodatne uvozne dajatve za limone,
    namizno grozdje, hruške, marelice, breskve, nektarine in slive
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1056/2004 de la Comisión, de 28 de mayo de 2004, que
    modifica el Reglamento (CE) n° 1555/96, por lo que respecta a los volúmenes
    que activan la imposición de derechos adicionales a los limones, las uvas de
    mesa, las peras, los albaricoques, los melocotones, incluidos los griñones y
    las nectarinas, y las ciruelas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1056/2004 av den 28 maj 2004 om ändring
    av förordning (EG) nr 1555/96 vad beträffar tröskelvolymen för tilläggstull
    för citroner, bordsdruvor, päron, aprikoser, persikor, inbegripet nektariner,
    och plommon
  type: main
