  script: Latn
  content: Council Regulation (EEC) No 3365/89 of 6 November 1989 amending Annex I
    to Regulation (EEC) No 288/82 and Annex III to Regulation (EEC) No 3420/83 in
    respect of the liberalization of certain products which are subject to national
    quantitative restrictions
  type: main
- language: fr
  script: Latn
