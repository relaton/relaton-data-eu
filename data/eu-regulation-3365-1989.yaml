    (EWG) Nr. 3420/83 hinsichtlich der Liberalisierung bestimmter Waren, die einzelstaatlichen
    mengenmäßigen Beschränkungen unterliegen #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3365/89 af 6. november 1989 om ændring af
