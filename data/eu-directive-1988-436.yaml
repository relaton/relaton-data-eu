    από τους κινητήρες ντήζελ)
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 16. juuni 1988, millega muudetakse direktiivi 70/220/EMÜ
    mootorsõidukite mootorite heitgaaside tekitatud õhusaaste vastu võetavaid meetmeid
    käsitlevate liikmesriikide õigusaktide ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 88/436/ETY, annettu 16 päivänä kesäkuuta 1988,
