title:
- language: en
  script: Latn
  content: Council Directive 88/436/EEC of 16 June 1988 amending Directive 70/220/EEC
    on the approximation of the laws of the Member States relating to measures to
    be taken against air pollution by gases from engines of motor vehicles (Restriction
    of particulate pollutant emissions from diesel engines)
  type: main
- language: fr
  script: Latn
  content: Directive 88/436/CEE du Conseil du 16 juin 1988 modifiant la directive
    70/220/CEE concernant le rapprochement des législations des États membres relatives
    aux mesures à prendre contre la pollution de l'air par les gaz provenant des
    moteurs équipant les véhicules à moteur (Limitation des émissions de particules
    polluantes par les moteurs diesel)
  type: main
- language: de
  script: Latn
  content: Richtlinie 88/436/EWG des Rates vom 16. Juni 1988 zur Änderung der Richtlinie
    70/220/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über Maßnahmen
    gegen die Verunreinigung der Luft durch Abgase von Kraftfahrzeugmotoren (Begrenzung
    der Emissionen luftverunreinigender Partikel aus Dieselmotoren)
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 16 юни 1988 година за
    изменение на Директива 70/220/ЕИО за сближаване
    на законодателствата на държавите-членки относно
    мерките, които следва да се приемат срещу замърсяването
    на въздуха с газове, изпускани от двигателите
    на моторните превозни средства (Ограничение
    за емисиите на механични замърсители от дизелови
    двигатели)
  type: main
- language: cs
  script: Latn
