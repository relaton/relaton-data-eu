    toteutettavia toimenpiteitä koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun direktiivin 70/220/ETY muuttamisesta (dieselmoottoreiden hiukkaspäästöjen
    vähentäminen)
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1988. június 16.) a gépjárművek motorjainak kipufogógázai
    által okozott levegőszennyezés elleni intézkedésekre vonatkozó tagállami
    jogszabályok közelítéséről (dízelmotorok légszennyezőrészecske-kibocsátásának
    korlátozásáról) szóló 70/220/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 88/436/CEE del Consiglio del 16 giugno 1988 che modifica la direttiva
    70/220/CEE concernente il ravvicinamento delle legislazioni degli Stati Membri
    relative alle misure da adottare contro l'inquinamento atmosferico con i gas prodotti
    dai motori ad accensione comandata dei veicoli a motore (Limitazione delle emissioni
    di particelle inquinanti dei motori diesel)
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1988. gada 16. jūnijs), ar ko groza Direktīvu 70/220/EEK
    par dalībvalstu tiesību aktu tuvināšanu attiecībā uz pasākumiem, kas jāveic,
    lai novērstu gaisa piesārņošanu ar gāzēm no mehānisko transportlīdzekļu
    motoriem (daļiņveida piesārņotāju emisijas no dīzeļmotoriem ierobežošana)
  type: main
- language: lt
  script: Latn
  content: 1988 m. birželio 16 d. Tarybos direktyva, iš dalies keičianti Direktyvą
    70/220/EEB dėl valstybių narių įstatymų, reglamentuojančių priemones, kurių
    būtina imtis oro apsaugai nuo motorinių transporto priemonių išmetamųjų
    teršalų, suderinimo (dyzelinių variklių išmetamų kietųjų dalelių kiekio
    apribojimas)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tas-16 ta’ Ġunju li temenda Direttiva 70/220/KEE
    dwar l-approssimazzjoni tal-liġijiet tal-Istati Membri marbuta ma’ miżuri
    li għandhom jittieħdu kontra t-tniġġis tal-arja mill-gassijiet li joħorġu
    mill-magni ta’ vetturi bil-mutur (restrizzjoni fuq ċerti partikoli tat-tniġġis
    li joħroġ mill-magni diesel)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 88/436/EEG van de Raad van 16 juni 1988 tot wijziging van Richtlijn
    70/220/EEG inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten met
    betrekking tot maatregelen tegen luchtverontreiniging door uitlaatgassen van motoren
    in motorvoertuigen (Beperking van emissies van verontreinigende deeltjes door
    dieselmotoren)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 16 czerwca 1988 r. zmieniająca dyrektywę 70/220/EWG
    w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących się do
    działań, jakie mają być podjęte w celu ograniczenia zanieczyszczania powietrza
    przez spaliny z silników pojazdów silnikowych (ograniczenie emisji zanieczyszczeń
    pyłowych z silników Diesla)
  type: main
- language: pt
  script: Latn
  content: Directiva 88/436/CEE do Conselho de 16 de Junho de 1988 que altera a Directiva
    70/220/CEE relativa à aproximação das legislações dos Estados-Membros respeitantes
    às medidas a tomar contra a poluição do ar pelos gases provenientes dos motores
    de ignição comandada que equipam os veículos a motor (limitação das emissões
    de partículas poluentes pelos motores diesel)
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 16 iunie 1988 de modificare a Directivei 70/220/CEE
    privind apropierea legislațiilor statelor membre referitoare la măsurile preconizate
    împotriva poluării aerului cu emisii poluante provenind de la motoarele autovehiculelor
    (Restricții pentru emisiile de particule poluante provenite de la motoarele diesel)
  type: main
- language: sk
  script: Latn
  content: Smernica Rady zo 16. júna 1988, ktorou sa mení a dopĺňa smernica Rady
    70/220/EHS o aproximácii právnych predpisov členských štátov o opatreniach
    proti znečisťovaniu ovzdušia výfukovými plynmi z motorov motorových vozidiel
    (zníženie emisie škodlivých častíc z dieselových motorov)
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 16. junija 1988 o spremembi Direktive 70/220/EGS
    o približevanju zakonodaje držav članic o ukrepih proti onesnaževanju zraka
    s plini iz motorjev motornih vozil (Omejevanje emisij delcev iz dizelskih motorjev)
  type: main
- language: es
  script: Latn
  content: Directiva 88/436/CEE del Consejo, de 16 de junio de 1988, por la que se
    modifica la Directiva 70/220/CEE relativa a la aproximación de las legislaciones
    de los Estados miembros en materia de medidas que deben adoptarse contra la contaminación
