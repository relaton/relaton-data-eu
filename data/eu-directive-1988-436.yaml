    proti znečišťování ovzduší plyny z motorů motorových vozidel (Omezení
    emisí znečišťujících částic ze vznětových motorů)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 88/436/EØF af 16. juni 1988 om ændring af direktiv 70/220/EØF
    om tilnærmelse af medlemsstaternes lovgivninger om foranstaltninger mod luftforurening
    forårsaget af udstødningsgas fra køretøjsmotorer (begrænsning af partikelemissioner
    fra dieselmotorer)
  type: main
- language: el
  script: Grek
