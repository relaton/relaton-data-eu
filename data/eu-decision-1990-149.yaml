  content: '90/149/EEC: Council Decision of 22 March 1990 authorizing the Portuguese
    Republic to extend until 8 April 1991 the agreement on mutual fishery relations
    with the Republic of South Africa'
  type: main
- language: fr
  script: Latn
  content: '90/149/CEE: Décision du Conseil du 22 mars 1990 autorisant la République
    portugaise à proroger jusqu''au 8 avril 1991 l''accord sur les relations de pêche
    mutuelles avec la République d''Afrique du Sud'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DES RATES vom 22. Maerz 1990 zur Ermaechtigung der Portugiesischen
    Republik, das mit der Republik Suedafrika geschlossene Abkommen ueber die wechselseitigen
    Fischereibeziehungen bis zum 8. April 1991 zu verlaengern (90/149/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS BESLUTNING af 22. marts 1990 om bemyndigelse af Den Portusiske
    Republik til for perioden frem til den 8. april 1991 at forlaenge aftalen vedroerende
    de faelles fiskeriaktiviteter, indgaaet med Den Sydafrikanske Republik (90/149/EOEF)
  type: main
- language: el
  script: Grek
