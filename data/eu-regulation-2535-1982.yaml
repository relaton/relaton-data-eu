title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2535/82 of 17 September 1982 fixing for
    the fourth quarter of 1982 the quantities of high-quality fresh, chilled or frozen
    beef and veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2535/82 de la Commission, du 17 septembre 1982, fixant
    les quantités de viandes bovines de haute qualité, fraîches, réfrigérées
    ou congelées pouvant être importées à des conditions spéciales pour le quatrième
    trimestre de 1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2535/82 der Kommission vom 17. September 1982 zur
    Festsetzung der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleisches,
    die für das vierte Vierteljahr 1982 unter Sonderbedingungen eingeführt werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2535/82 af 17. september 1982 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i fjerde kvartal af 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2535/82 της Επιτροπής
    της 17ης Σεπτεμβρίου 1982 περί καθορισμού των
    ποσοτήτων βοείου κρέατος ανωτέρας ποιότητος,
    νωπού, διατηρημένου δι' απλής ψύξεως η κατεψυγμένου,
    πού δύνανται να εισαχθούν υπό ειδικούς όρους
    για το τέταρτο τρίμηνο του 1982
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2535/82 della Commissione, del 17 settembre 1982,
    che fissa le quantità di carni bovine di qualità pregiata, fresche, refrigerate
    o congelate, che possono essere importate a condizioni speciali per il quarto
    trimestre 1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2535/82 van de Commissie van 17 september 1982 tot
    vaststelling van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees
    dat in het vierde kwartaal van 1982 op bijzondere voorwaarden kan worden ingevoerd
  type: main
