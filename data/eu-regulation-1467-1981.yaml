    τού κανονισμού (ΕΟΚ) αριθ. 438/81 «περί καθορισμού
    τού εφαρμοζόμενου καθεστώτος κατά τίς εισαγωγές
    προϊόντων καταγωγής Γιουγκοσλαβίας, συνεπεία
    τής προσχωρήσεως τής Ελληνικής Δημοκρατίας
