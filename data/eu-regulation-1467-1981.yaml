  content: Council Regulation (EEC) No 1467/81 of 26 May 1981 extending the period
    of application of Regulation (EEC) No 438/81 establishing the arrangements applicable
    to imports originating in Yugoslavia consequent upon the accession of the Hellenic
    Republic to the European Economic Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1467/81 du Conseil, du 26 mai 1981, prorogeant le
    règlement (CEE) n° 438/81 fixant le régime applicable aux importations de produits
    originaires de Yougoslavie suite à l' adhésion de la République hellénique
    aux Communautés européennes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1467/81 des Rates vom 26. Mai 1981 zur Verlängerung
    der Verordnung (EWG) Nr. 438/81 zur Festsetzung der Einfuhrregelung für Waren
    mit Ursprung in Jugoslawien infolge des Beitritts der Republik Griechenland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1467/81 af 26. maj 1981 om forlængelse af
    forordning (EØF) nr. 438/81 om fastsættelse af den ordning, der skal gælde
    for indførsel af varer med oprindelse i Jugoslavien som følge af Grækenlands
    tiltrædelse
  type: main
- language: el
  script: Grek
