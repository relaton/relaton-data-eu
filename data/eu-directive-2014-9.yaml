id: EUDirective20149
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/9/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, the Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    and cadmium in metallic bonds creating superconducting magnetic circuits in MRI,
    SQUID, NMR (Nuclear Magnetic Resonance) or FTMS (Fourier Transform Mass Spectrometer)
    detectors
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/9/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb et le cadmium dans les liaisons métalliques permettant de créer
    des circuits magnétiques supraconducteurs dans les détecteurs IRM, SQUID, RMN
    (résonance magnétique nucléaire) ou FTMS (spectromètre de masse à transformée
    de Fourier)
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/9/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei und Cadmium in metallischen Bindungen zur Herstellung
    von supraleitenden magnetischen Kreisen in MRI-Detektoren, SQUID-Detektoren, NMR-Detektoren
    (Kernspinresonanz) oder FTMS-Detektoren (Fourier-Transform-Massenspektrometer)
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/9/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    и кадмий, свързани с метални връзки, създаващи
    магнитни вериги в детектори за магнитно-резонансни
    томографи (MRI), за квантови интерферометри със
    свръхпроводимост (SQUID), за уреди за ядрено-магнитен
    резонанс (NMR), или за масспектрометри, използващи
    преобразувание на Фурие (FTMS)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/9/EU ze dne 18. října 2013
    , kterou se z důvodu přizpůsobení technickému pokroku mění příloha IV
    směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro olovo
    a kadmium v kovovém pojivu supravodivých materiálů v přístrojích magnetické
    rezonance (MRI), detektorech supravodivého kvantového interferenčního zařízení
    (SQUID), nukleární magnetické resonance (NMR) nebo hmotnostních spektrometrů
    s Fourierovou transformací (FTMS)
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/9/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår indrømmelse af en undtagelse for bly og cadmium
    i metal bundet til superledende magnetiske kredsløb i MRI-, SQUID-, NMR- (kernemagnetisk
    resonans) eller FTMS- (Fourier-transformation-massespektrometer) detektorer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/9/ΕΕ της Επιτροπής,
