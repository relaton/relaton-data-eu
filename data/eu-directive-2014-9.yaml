    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    εξαίρεση για τον μόλυβδο και το κάδμιο σε μεταλλικές
    συνδέσεις που δημιουργούν υπεραγώγιμα μαγνητικά
    κυκλώματα σε ανιχνευτές MRI, SQUID, NMR (μαγνητικός
    πυρηνικός συντονισμός) ή FTMS (φασματόμετρο μάζας
    μετασχηματισμού Fourier)
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/9/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii ja kaadmiumi
    kasutamist metallilistes sidemetes, mis moodustavad magnetresonantstomograafide,
    ülijuhtivate kvantinterferentsseadmete, tuumamagnetresonantstomograafide ja Fourier’
    teisendusega massispektromeetrite detektorite ülijuhtivaid magnetahelaid
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/9/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä ja kadmiumia metallisidoksissa, jotka luovat suprajohtavia magneettipiirejä
    MRI-, SQUID-, NMR- (ydinmagneettiresonanssi) tai FTMS- (Fourier-muunnos-massaspektrometri)
    laitteissa
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/9/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za olovo i kadmij u metalnim spojevima
    koji tvore supravodljive magnetske krugove u MRI, SQUID, NMR (nuklearna magnetska
    rezonancija) ili FTMS (spektrometar masa uz Fourierovu transformaciju) detektorima
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/9/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az MRI-, SQUID-, NMR- (mágneses magrezonancia) vagy FTMS-detektorokban (Fourier-transzformációs
    tömegspektrometria) szupravezető mágneses köröket létrehozó fém kapcsolódási
    felületekben lévő ólom és kadmium mentesítése tekintetében, a műszaki
    fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/9/UE della Commissione, del 18 ottobre 2013 , che
    modifica, per adeguarlo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa a piombo e cadmio in legami metallici che consentono di creare circuiti
    magnetici superconduttori nella risonanza magnetica e nei sensori SQUID, NMR (risonanza
    magnetica nucleare) o FTMS (spettrometro di massa a trasformata di Fourier)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/9/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam un kadmijam
    metāla stiprinājumos, ar ko veido supravadošas magnētiskās ķēdes MRI, SQUID
    , NMR (kodolmagnētiskā rezonanse) vai FTMS (Furjē transformāciju masspektometrs)
    detektoros
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/9/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    šviną ir kadmį naudoti metalų junginiuose, sudarančiuose superlaidžias magnetines
    grandines MRI, SQUID, NMR (branduolinio magnetinio rezonanso) arba FTMS (Furjė
    transformacijos masės spektrometrų) detektoriuose
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/9/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb u kadmju fir-rabtiet metalliċi li joħolqu ċirkuwiti
    manjetiċi superkonduttivi fid-ditekters MRI, SQUID, NMR (Nuclear Magnetic Resonance)
    jew FTMS (Fourier Transform Mass Spectrometer)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/9/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood en cadmium in metaalbindingen voor supergeleidende
    magnetische circuits in MRI-detectoren, SQUID-detectoren, NMR-detectoren (kernspinresonantie)
    of FTMS-detectoren (Fourier Transform Mass Spectrometer)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/9/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu i kadmu w spoiwach metalowych tworzących nadprzewodzące obwody magnetyczne
    w czujnikach MRI, SQUID, NMR (magnetycznego rezonansu jądrowego) lub FTMS (absorpcyjnego
    spektrometru masowego)
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/9/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para chumbo e cádmio em ligações metálicas que permitam a criação de circuitos
    magnéticos supercondutores em detetores de IRM, SQUID, RMN (Ressonância magnética
    nuclear) ou FTMS (Espetrómetro de massa de transformada de Fourier)
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/9/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul și cadmiul din lipiturile metalice cu ajutorul cărora se creează circuitele
    magnetice supraconductoare din detectorii IRM, SQUID, RMN (rezonanță magnetică
    nucleară) sau FTMS (spectrometru de masă cu transformată Fourier)
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/9/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo a kadmium v kovovom
    spojive supravodivých materiálov v detektoroch MRI, SQUID, prístrojoch nukleárnej
    magnetickej rezonancie (NMR) alebo hmotnostných spektrometroch s Fourierovou
    transformáciou (FTMS)
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/9/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za svinec in kadmij v kovinskih vezeh, ki tvorijo superprevodna magnetna vezja
    v detektorjih MRS, SQUID, NMR (nuklearna magnetna resonanca) ali FTMS (Fourierjeva
    transformacijska masna spektrometrija), zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/9/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo y el cadmio en enlaces metálicos que permiten la creación de circuitos
    magnéticos superconductores en detectores de IRM, SQUID, RMN (resonancia magnética
    nuclear) o FTMS (espectrometría de masas con transformada de Fourier)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/9/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly och kadmium i metallbindningar
    som skapar supraledande magnetiska kretsar i MRT-detektorer, SQUID-detektorer,
    NMR-detektorer (kärnmagnetisk resonans) eller FTMS-detektorer (Fourier Transform
    Mass Spectrometer)
