title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 485/80 of 28 February 1980 amending Regulation
    (EEC) No 571/78 in respect of the issue of import licences for products of the
    beef and veal sector originating in the African, Caribbean and Pacific States
    or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 485/80 de la Commission, du 28 février 1980, modifiant
    le règlement (CEE) n° 571/78 en ce qui concerne la délivrance des certificats
    d' importation pour les produits du secteur de la viande bovine originaires des
    États d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires d'
    outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 485/80 der Kommission vom 28. Februar 1980 zur Änderung
    der Verordnung (EWG) Nr. 571/78 hinsichtlich der Erteilung von Einfuhrlizenzen
    für Rindfleisch mit Ursprung in den Staaten in Afrika, im karibischen Raum und
    im Pazifischen Ozean sowie in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 485/80 af 28. februar 1980 om ændring
    af forordning (EØF) nr. 571/78 for så vidt angår udstedelse af importlicenser
    for oksekødsprodukter med oprindelse i Afrika, Vestindien og Stillehavet eller
    i de oversøiske lande og territorier
  type: main
