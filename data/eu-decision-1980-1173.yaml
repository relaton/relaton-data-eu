  content: '80/1173/EEC: Commission Decision of 3 December 1980 authorizing the Kingdom
    of the Netherlands to fix additional criteria for the definition of producer of
    sheepmeat (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1173/CEE: Décision de la Commission, du 3 décembre 1980, autorisant
    le Royaume des Pays-Bas à fixer des critères supplémentaires concernant la
    définition du producteur de viande ovine (Le texte en langue néerlandaise est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1173/EWG: Entscheidung der Kommission vom 3. Dezember 1980 zur Ermächtigung
    des Königreichs der Niederlande, zusätzliche Kriterien für die Definition des
    Schaffleischerzeugers festzusetzen (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1173/EØF: Kommissionens beslutning af 1. december 1980 om bemyndigelse
    til kongeriget Nederlandene til at fastsætte yderligere kriterier i forbindelse
    med definitionen på en fårekødsproducent (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/1173/ΕΟΚ : Απόφαση της Επιτροπής, της 3ης
