    ai vegetali o ai prodotti vegetali nei dipartimenti francesi d''oltremare, nonché
    nelle Azzorre e a Madera (I testi in lingua francese e portoghese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '96/633/EG: Beschikking van de Commissie van 23 oktober 1996 tot wijziging
