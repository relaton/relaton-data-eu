title:
- language: en
  script: Latn
  content: '96/633/EC: Commission Decision of 23 October 1996 amending Decision 93/522/EEC
    on the definition of the measures eligible for Community financing in the programmes
    for the control of organisms harmful to plants or plant products in the French
    overseas departments, in the Azores and in Madeira (Only the French and Portuguese
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/633/CE: Décision de la Commission du 23 octobre 1996 amendant la décision
    93/522/CEE relative à la définition de mesures éligibles au financement communautaire
    concernant les programmes de lutte contre les organismes nuisibles aux végétaux
    ou aux produits végétaux dans les départements français d''outre-mer, aux
    Açores et à Madère (Les textes en langues française et portugaise sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/633/EG: Entscheidung der Kommission vom 23. Oktober 1996 zur Änderung
    der Entscheidung 93/522/EWG zur Festlegung der für eine Finanzierung durch die
    Gemeinschaft in Betracht kommenden Maßnahmen im Rahmen der Programme zur Bekämpfung
    der Schadorganismen von Pflanzen und pflanzlichen Erzeugnissen in den französischen
    überseeischen Departements sowie auf den Azoren und Madeira (Nur der französische
    und der portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/633/EF: Kommissionens Beslutning af 23. oktober 1996 om ændring af
    beslutning 93/522/EØF om fastlæggelse af, hvilke foranstaltninger der er berettigede
    til at modtage EF-støtte til programmer til bekæmpelse af skadegørere på planter
    eller planteprodukter i de franske oversøiske departementer samt Azorerne og
    Madeira (Kun den franske og portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/633/ΕΚ: Απόφαση της Επιτροπής της 23ης Οκτωβρίου
    1996 για τροποποίηση της απόφασης 93/522/ΕΟΚ σχετικά
    με τον καθορισμό των μέτρων που είναι επιλέξιμα
    για κοινοτική χρηματοδότηση στο πλαίσιο των
    προγραμμάτων καταπολέμησης των οργανισμών
    που είναι επιβλαβείς για τα φυτά και τα φυτικά
    προϊόντα στα υπερπόντια γαλλικά διαμερίσματα,
    στις νήσους Αζόρες και Μαδέρα (Τα κείμενα στη
    γαλλική και πορτογαλική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '96/633/EY: Komission päätös, tehty 23 päivänä lokakuuta 1996, yhteisön
    rahoitukseen oikeutettujen kasveille ja kasviperäisille tuotteille haitallisten
    organismien torjuntaohjelmiin Ranskan merentakaisissa departementeissa, Azoreilla
    ja Madeiralla liittyvien toimenpiteiden määrittelemisestä tehdyn komission
    päätöksen 93/522/ETY tarkistamisesta (Ainoastaan ranskankielinen ja portugalinkielinen
    teksti ovat todistusvoimaiset)'
  type: main
- language: it
  script: Latn
  content: '96/633/CE: Decisione della Commissione del 23 ottobre 1996 che modifica
    la decisione 93/522/CEE relativa alla definizione delle misure ammissibili al
