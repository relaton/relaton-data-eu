title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2461/89 of 10 August 1989 re-establishing
    the levying of customs duties on swimwear, of wool, of cotton or of man-made fibres,
    products of category 72 (order No 40.0720), originating in Brazil, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2461/89 de la Commission du 10 août 1989 portant
    rétablissement de la perception des droits de douane applicables aux maillots,
    culottes et slips de bain de la catégorie de produits n° 72 (numéro d'ordre
    40.0720), originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2461/89 DER KOMMISSION vom 10. August 1989 zur Wiedereinführung
    des Zollsatzes für Badeanzüge und Badehosen, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Warenkategorie Nr. 72 (lfd. Nr. 40.0720) mit
    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2461/89 af 10. august 1989 om genindførelse
    af opkrævning af toldafgifter for badebeklæding, af uld, bomuld eller syntetiske
    eller regenererede fibre, under varekategori nr. 72 (løbenummer 40.0720), som
    har oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 4259/88
  type: main
