---
id: EUDecision20212300
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/2300 of 21 December 2021 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by Taiwan (This Decision should not
    be interpreted as reflecting any official position of the European Union with
    regard to the legal status of Taiwan.) to the certificates issued in accordance
    with Regulation (EU) 2021/953 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/2300 de la Commission du 21 décembre
    2021 établissant l’équivalence, aux fins de faciliter l’exercice du droit
    à la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par Taïwan (La présente décision ne doit pas être interprétée comme l’expression
    d’une position officielle de l’Union européenne en ce qui concerne le statut
    juridique de Taïwan.) avec les certificats délivrés conformément au règlement
    (UE) 2021/953 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/2300 der Kommission vom 21. Dezember
    2021 zur Feststellung der Gleichwertigkeit der von Taiwan (Dieser Beschluss sollte
    nicht so ausgelegt werden, dass er einen offiziellen Standpunkt der Europäischen
    Union im Hinblick auf den rechtlichen Status Taiwans widerspiegelt.) ausgestellten
    COVID-19-Zertifikate mit den nach der Verordnung (EU) 2021/953 des Europäischen
    Parlaments und des Rates ausgestellten Zertifikaten zwecks Erleichterung der Ausübung
    des Rechts auf Freizügigkeit innerhalb der Union
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2021/2300 на Комисията
    от 21 декември 2021 година за установяване на
    равностойност, с цел улесняване на упражняването
    на правото на свободно движение в рамките на
    Съюза, на сертификатите за COVID-19, издадени от
    Тайван (Настоящото решение не следва да се
    тълкува като отразяващо официалната позиция
    на Европейския съюз по отношение на правния
    статут на Тайван.), със сертификатите, издадени
    в съответствие с Регламент (ЕС) 2021/953 на Европейския
    парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/2300 ze dne 21. prosince 2021,
    kterým se za účelem usnadnění práva na volný pohyb v rámci Unie stanoví
    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Tchaj-wanem
    (Toto rozhodnutí by nemělo být vykládáno tak, že odráží jakýkoliv oficiální
    postoj Evropské unie, pokud jde o právní postavení Tchaj-wanu.)a certifikátů
    vydaných v souladu s nařízením Evropského parlamentu a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/2300 af 21. december
    2021 om ækvivalens mellem de covid-19-certifikater, der udstedes af Taiwan (Denne
    afgørelse bør ikke fortolkes som udtryk for Den Europæiske Unions officielle
    holdning for så vidt angår Taiwans retlige status.), og de certifikater, der
    udstedes i overensstemmelse med Europa-Parlamentets og Rådets forordning (EU)
    2021/953, med henblik på at lette udøvelsen af retten til fri bevægelighed
    inden for Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/2300 της Επιτροπής
    της 21ης Δεκεμβρίου 2021 για τη θέσπιση της ισοδυναμίας,
    με σκοπό τη διευκόλυνση του δικαιώματος ελεύθερης
    κυκλοφορίας εντός της Ένωσης, των πιστοποιητικών
    COVID-19 που εκδίδονται από την Ταϊβάν (Η παρούσα
    απόφαση δεν θα πρέπει να εκληφθεί ως η επίσημη
    θέση της Ευρωπαϊκής Ένωσης σχετικά με το νομικό
    καθεστώς της Ταϊβάν.) με τα πιστοποιητικά που
    εκδίδονται σύμφωνα με τον κανονισμό (ΕΕ) 2021/953
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/2300, 21. detsember 2021, millega määratakse
    liidus vaba liikumise õiguse kasutamise hõlbustamiseks kindlaks Taiwani (Käesolevat
    otsust ei tohiks tõlgendada nii, nagu väljendaks see Euroopa Liidu ametlikku
    seisukohta Taiwani õigusliku seisundi suhtes.) välja antud COVID-19 tõendite
    samaväärsus Euroopa Parlamendi ja nõukogu määruse (EL) 2021/953 kohaselt
    välja antud tõenditega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/2300, annettu 21 päivänä
    joulukuuta 2021, Taiwanin (Tämän päätöksen ei tulisi tulkita heijastavan
    mitään Euroopan unionin virallista kantaa Taiwanin oikeudelliseen asemaan.)
    antamien koronatodistusten ja Euroopan parlamentin ja neuvoston asetuksen (EU)
    2021/953 mukaisesti annettujen todistusten vastaavuuden vahvistamisesta vapaata
    liikkuvuutta koskevan oikeuden käyttämisen helpottamiseksi unionissa
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/2300 ón gCoimisiún an 21 Nollaig
    2021 lena leagtar síos gur coibhéiseach iad deimhnithe COVID-19 arna n-eisiúint
    ag an Téaváin (Níor cheart an Cinneadh seo a léirmhíniú mar léiriú ar
    sheasamh oifigiúil an Aontais Eorpaigh i gcúinsí ar bith maidir le stádas
    dlíthiúil na Téaváine.) leis na deimhnithe arna n-eisiúint i gcomhréir le
    Rialachán (AE) 2021/953 ó Pharlaimint na hEorpa agus ón gComhairle, chun an
    ceart chun saorghluaiseachta a éascú laistigh den Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/2300 оd 21. prosinca 2021. o utvrđivanju
    jednakovrijednosti, u svrhu olakšavanja ostvarivanja prava na slobodno kretanje
    unutar Unije, COVID-19 potvrda koje izdaje Tajvan (Ovu Odluku ne bi trebalo tumačiti
    na način da odražava službeno stajalište Europske unije o pravnom statusu
    Tajvana.) s potvrdama izdanima u skladu s Uredbom (EU) 2021/953 Europskog parlamenta
    i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2300 végrehajtási határozata (2021. december
    21.) a Tajvan (Ez a határozat nem értelmezhető úgy, mint amely az Európai
    Unió hivatalos álláspontját tükrözi Tajvan jogállása tekintetében.) által
    kiállított Covid19-igazolványoknak az (EU) 2021/953 európai parlamenti és
    tanácsi rendelettel összhangban kiállított igazolványokkal való egyenértékűségének
    az Unión belüli szabad mozgáshoz való jog előmozdítása céljából történő
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/2300 della Commissione del 21 dicembre
    2021 che stabilisce l'equivalenza, al fine di agevolare il diritto di libera circolazione
    nell'ambito dell'Unione, dei certificati COVID-19 rilasciati da Taiwan (La presente
    decisione non riflette la posizione ufficiale dell'Unione europea sullo status
    giuridico di Taiwan e non va interpretata in questo senso.) ai certificati rilasciati
    in conformità del regolamento (UE) 2021/953 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/2300 (2021. gada 21. decembris),
    ar ko nolūkā atvieglot tiesības brīvi pārvietoties Savienībā nosaka Taivānas
    (Šo lēmumu nevajadzētu interpretēt kā tādu, kas atspoguļo Eiropas Savienības
    oficiālo nostāju attiecībā uz Taivānas juridisko statusu.) izdoto Covid-19
    sertifikātu līdzvērtīgumu sertifikātiem, kuri izdoti saskaņā ar Eiropas
    Parlamenta un Padomes Regulu (ES) 2021/953
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/2300 2021 m. gruodžio 21
    d. kuriuo, siekiant sudaryti palankesnes sąlygas naudotis laisvo judėjimo teise
    Sąjungoje, nustatomas Taivano (Šis sprendimas neturėtų būti aiškinamas kaip
    atspindintis oficialią Europos Sąjungos poziciją dėl Taivano teisinio statuso.)
    išduotų COVID-19 pažymėjimų lygiavertiškumas pagal Europos Parlamento ir
    Tarybos reglamentą (ES) 2021/953 išduotiems pažymėjimams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2300 tal-21
    ta’ Diċembru 2021 li tistabbilixxi l-ekwivalenza, għall-fini tal-faċilitazzjoni
    tad-dritt tal-moviment liberu fl-Unjoni, taċ-ċertifikati COVID-19 maħruġa
    mit-Tajwan (Jenħtieġ li din id-Deċiżjoni ma tiġix interpretata bħala li
    tirrifletti kwalunkwe pożizzjoni uffiċjali tal-Unjoni Ewropea fir-rigward tal-istatus
    legali tat-Tajwan.) maċ-ċertifikati maħruġa f’konformità mar-Regolament
    (UE) 2021/953 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/2300 van de Commissie van 21 december 2021
    houdende vaststelling van de gelijkwaardigheid, teneinde het recht van vrij verkeer
    binnen de Unie te faciliteren, van door Taiwan (Dit besluit mag niet worden geïnterpreteerd
    als een weergave van enig officieel standpunt van de Europese Unie met betrekking
    tot de juridische status van Taiwan.) afgegeven COVID-19-certificaten met de overeenkomstig
    Verordening (EU) 2021/953 van het Europees Parlement en de Raad afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/2300 z dnia 21 grudnia 2021 r. ustanawiająca
    równoważność, w celu ułatwienia korzystania z prawa do swobodnego przemieszczania
    się w Unii, zaświadczeń COVID-19 wydawanych przez Tajwan (Niniejszej decyzji
    nie należy interpretować jako odzwierciedlającej jakiekolwiek oficjalne stanowisko
    Unii Europejskiej w odniesieniu do statusu prawnego Tajwanu.) z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/2300 da Comissão de 21 de dezembro de
    2021 que estabelece a equivalência, a fim de facilitar o exercício do direito
    de livre circulação na União, dos certificados COVID-19 emitidos por Taiwan
    (A presente decisão não deve ser interpretada como refletindo qualquer posição
    oficial da União Europeia no que respeita ao estatuto jurídico de Taiwan.) aos
    certificados emitidos em conformidade com o Regulamento (UE) 2021/953 do Parlamento
    Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/2300 a Comisiei din 21 decembrie
    2021 de stabilire, în scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Taiwan (Prezenta decizie nu ar trebui să fie interpretată ca reflectând
    poziția oficială a Uniunii Europene cu privire la statutul juridic al Taiwanului.)
    cu certificatele eliberate în conformitate cu Regulamentul (UE) 2021/953 al Parlamentului
    European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/2300 z 21. decembra 2021, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydaných Taiwanom (Toto rozhodnutie
    sa nemá interpretovať ako vyjadrenie oficiálnej pozície Európskej únie vzhľadom
    na právny štatút Taiwanu.) s potvrdeniami vydanými v súlade s nariadením
    Európskeho parlamentu a Rady (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/2300 z dne 21. decembra 2021 o določitvi
    enakovrednosti COVID-19 potrdil, ki jih izdaja Tajvan (Ta sklep se ne sme razlagati
    kot izražanje kakršnega koli uradnega stališča Evropske unije glede pravnega
    statusa Tajvana.), in potrdil, izdanih v skladu z Uredbo (EU) 2021/953 Evropskega
    parlamenta in Sveta, da se olajša uveljavljanje pravice do prostega gibanja v
    Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/2300 de la Comisión de 21 de diciembre
    de 2021 por la que se establece la equivalencia, a fin de facilitar el derecho
    a la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por Taiwán (La presente Decisión no refleja la posición oficial de la Unión
    Europea en relación con la situación jurídica de Taiwán.) y los expedidos
    de conformidad con el Reglamento (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/2300 av den 21 december 2021
    om fastställande, i syfte att underlätta den fria rörligheten inom unionen,
    av att covid-19-intyg som utfärdas av Taiwan (Detta beslut ska inte betraktas
    som Europeiska unionens officiella ståndpunkt när det gäller Taiwans rättsliga
    status.) är likvärdiga med de intyg som utfärdas i enlighet med Europaparlamentets
    och rådets förordning (EU) 2021/953
  type: main
