    Evros (Griechenland) und die finanzielle Beteiligung der Gemeinschaft an den Maßnahmen
    zur Bekämpfung der Maul- und Klauenseuche in dieser Region (Nur der griechische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/308/EØF: Kommissionens beslutning af 4. maj 1988 om anden ændring
