title:
- language: en
  script: Latn
  content: '88/308/EEC: Commission Decision of 4 May 1988 amending for the second
    time Decision 83/73/EEC on the establishment of a buffer zone in the region of
    Evros (Greece) and a financial contribution by the Community to measures to combat
    foot-and-mouth disease in that region (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/308/CEE: Décision de la Commission du 4 mai 1988 portant deuxième
    modification de la décision 83/73/CEE relative à l''établissement d''une zone
    tampon dans la région d''Evros (Grèce) et à la participation financière de
    la Communauté aux mesures de lutte contre la fièvre aphteuse dans cette région
    (Le texte en langue grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/308/EWG: Entscheidung der Kommission vom 4. Mai 1988 zur zweiten Änderung
