    a 8. terméktípusba tartozó biocid termékekben felhasználható létező hatóanyagként,
    az 528/2012/EU európai parlamenti és tanácsi rendelet szerinti jóváhagyásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2964 della Commissione, del 29 novembre
    2024, che approva i prodotti di reazione dell’acido borico con la didecilammina
    e l’ossido di etilene (betaina polimerica) come principio attivo esistente ai
    fini del loro uso nei biocidi del tipo di prodotto 8 conformemente al regolamento
    (UE) n. 528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2964 (2024. gada 29. novembris),
