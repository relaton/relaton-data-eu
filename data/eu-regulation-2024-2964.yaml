title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2964 of 29 November 2024 approving
    reaction products of boric acid with didecylamine and ethylene oxide (polymeric
    betaine) as an existing active substance for use in biocidal products of product-type
    8 in accordance with Regulation (EU) No 528/2012 of the European Parliament and
    of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2964 de la Commission du 29 novembre
    2024 approuvant les produits de la réaction de l’acide borique avec la didécylamine
    et l’oxyde d’éthylène (bétaïne polymère) en tant que substance active
    existante destinée à être utilisée dans des produits biocides relevant des
    types de produits 8, conformément au règlement (UE) no 528/2012 du Parlement
    européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2964 der Kommission vom 29. November
    2024 zur Genehmigung von Reaktionsprodukten von Borsäure mit Didecylamin und
    Ethylenoxid (polymeres Betain) als alten Wirkstoff zur Verwendung in Biozidprodukten
    der Produktart 8 gemäß der Verordnung (EU) Nr. 528/2012 des Europäischen Parlaments
    und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/2964 на Комисията
    от 29 ноември 2024 година за одобряване на продукти
    от реакция на борна киселина с дидециламин
    и етиленов оксид (полимерен бетаин) като съществуващо
    активно вещество за употреба в биоциди от продуктов
    тип 8 в съответствие с Регламент (ЕС) № 528/2012
    на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2964 ze dne 29. listopadu 2024,
    kterým se v souladu s nařízením Evropského parlamentu a Rady (EU) č. 528/2012
    schvalují reakční produkty kyseliny borité s didecylaminem a ethylenoxidem
    (polymerický betain) jako stávající účinná látka pro použití v biocidních
    přípravcích typu 8
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2964 af 29. november
    2024 om godkendelse af reaktionsprodukter af borsyre med didecylamin og ethylenoxid
    (polymerisk betain) som et eksisterende aktivstof til anvendelse i biocidholdige
    produkter af produkttype 8, jf. Europa-Parlamentets og Rådets forordning (EU)
    nr. 528/2012
  type: main
- language: el
  script: Grek
