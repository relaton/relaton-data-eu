  content: Règlement (CEE) n° 190/72 de la Commission, du 27 janvier 1971, abrogeant
    le règlement (CEE) n° 54/72 portant application du droit du tarif douanier commun
    aux importations de mandarines, satsumas, clémentines, tangerines et autres hybrides
    similaires d'agrumes originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 190/72 der Kommission vom 27. Januar 1972 zur Aufhebung
    der Verordnung (EWG) Nr. 54/72 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und anderen ähnlichen
    Kreuzungen von Zitrusfrüchten mit Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 190/72 della Commissione, del 27 gennaio 1972, che
    abroga il regolamento (CEE) n. 54/72 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsumas, clementine,
    tangerini e altri ibridi similari d'agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 190/72 van de Commissie van 27 januari 1972 tot intrekking
    van Verordening (EEG) nr. 54/72 houdende toepassing van het recht van het gemeenschappelijk
    douanetarief op de invoer van mandarijnen, satsuma's, clementines, tangerines
    en andere dergelijke kruisingen van citrusvruchten van oorsprong uit Spanje
  type: main
