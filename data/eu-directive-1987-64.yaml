title:
- language: en
  script: Latn
  content: Council Directive 87/64/EEC of 30 December 1986 amending Directive 72/461/EEC
    on health problems affecting intra- Community trade in fresh meat and Directive
    72/462/EEC on health and veterinary inspection problems upon importation of bovine
    animals and swine and fresh meat from third countries
  type: main
- language: fr
  script: Latn
  content: Directive 87/64/CEE du Conseil du 30 décembre 1986 modifiant la directive
    72/461/CEE relative à des problèmes de police sanitaire en matière d'échanges
    intracommunautaires de viandes fraîches, et la directive 72/462/CEE concernant
    les problèmes sanitaires et de police sanitaire lors de l'importation d'animaux
    des espèces bovine et porcine et des viandes fraîches en provenance des pays
    tiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 87/64/EWG des Rates vom 30. Dezember 1986 zur Änderung der
    Richtlinie 72/461/EWG zur Regelung viehseuchenrechtlicher Fragen beim innergemeinschaftlichen
    Handelsverkehr mit frischem Fleisch und der Richtlinie 72/462/EWG zur Regelung
    viehseuchenrechtlicher und gesundheitlicher Fragen bei der Einfuhr von Rindern
    und Schweinen und von frischem Fleisch aus Drittländern
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 87/64/EØF af 30. december 1986 om ændring af direktiv
    72/461/EØF om veterinærpolitimæssige problemer vedrørende handel med fersk
    kød inden for Fællesskabet og direktiv 72/462/EØF om sundhedsmæssige og veterinærpolitimæssige
    problemer i forbindelse med indførsel af kvæg og svin samt fersk kød fra tredjelande
  type: main
- language: el
  script: Grek
