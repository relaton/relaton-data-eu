    χωρών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 87/64/ETY, annettu 30 päivänä joulukuuta 1986,
    eläinten terveyttä koskevista seikoista yhteisön sisäisessä tuoreen lihan
    kaupassa annetun direktiivin 72/461/ETY sekä terveyttä ja eläinlääkintää
    koskevista ongelmista nautaeläinten ja sikojen sekä tuoreen lihan tuonnissa
    kolmansista maista annetun direktiivin 72/462/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 87/64/CEE del Consiglio del 30 dicembre 1986 che modifica la
    direttiva 72/461/CEE relativa a problemi di polizia sanitaria in materia di scambi
    intracomunitari di carni fresche e la direttiva 72/462/CEE relativa a problemi
    sanitari e di polizia sanitaria all'importazione di animali delle specie bovina
    e suina e di carni fresche in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 87/64/EEG van de Raad van 30 december 1986 houdende wijziging
    van Richtlijn 72/461/EEG inzake veterinairrechtelijke vraagstukken op het gebied
    van het intracommunautaire handelsverkeer in vers vlees en van Richtlijn 72/462/EEG
    inzake gezondheidsvraagstukken en veterinairrechtelijke vraagstukken bij de invoer
    van runderen en varkens en van vers vlees uit derde landen
  type: main
- language: pt
  script: Latn
  content: Directiva 87/64/CEE do Conselho de 30 de Dezembro de 1986 que altera a
    Directiva 72/461/CEE relativa aos problemas de polícia sanitária respeitantes
    a trocas intracomunitárias de carne fresca e a Directiva 72/462/CEE relativa
    a problemas sanitários e de polícia sanitária na importação de animais das
    espécies bovina e suína e de carnes frescas provenientes de países terceiros
  type: main
- language: es
  script: Latn
  content: Directiva 87/64/CEE del Consejo de 30 de diciembre de 1986 por la que se
    modifican la Directiva 72/461/CEE relativa a problemas de política sanitaria,
    en materia de intercambios comunitarios de carnes frescas y la Directiva 72/462/CEE
    relativa a los problemas sanitarios y de policía sanitaria en las importaciones
