    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifizierten Traubenmost für das Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 284/94 af 8. februar 1994 om adgang til
    indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1993/94
  type: main
- language: el
