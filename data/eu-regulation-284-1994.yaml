  content: Commission Regulation (EC) No 284/94 of 8 February 1994 authorizing the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must for the 1993/94
    wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 284/94 de la Commission du 8 février 1994 ouvrant
