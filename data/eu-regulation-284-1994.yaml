    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1993/1994
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 284/94 DA COMISSÃO de 8 de Fevereiro de 1994 que
    permite celebrar contratos de armazenagem privada a longo prazo para o vinho de
    mesa, o mosto de uvas, o mosto de uvas concentrado e o mosto de uvas concentrado
    rectificado, para a campanha de 1993/1994
  type: main
