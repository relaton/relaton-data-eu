    y la aplicación provisional del Acuerdo Subsidiario entre la Unión Europea y
    sus Estados miembros, por una parte, Islandia, por otra, y el Reino de Noruega,
    por otra, sobre la aplicación del Acuerdo de transporte aéreo entre los Estados
    Unidos de América, por una parte, la Unión Europea y sus Estados miembros, por
    otra, Islandia, por otra, y el Reino de Noruega, por otra
