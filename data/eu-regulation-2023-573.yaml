    2021/404 hinsichtlich der Einträge für Argentinien, das Vereinigte Königreich
    und die Vereinigten Staaten in den Listen der Drittländer, aus denen der Eingang
    in die Union von Sendungen von Geflügel und Zuchtmaterial von Geflügel, frischem
    Fleisch und Fleischerzeugnissen von Geflügel und Federwild zulässig ist
  type: main
