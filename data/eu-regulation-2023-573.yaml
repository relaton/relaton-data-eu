- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/573 of 10 March 2023 amending
    Annexes V, XIV and XV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Argentina, the United Kingdom and the United States in the lists of
    third countries authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry, fresh meat of and meat products from poultry
    and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/573 de la Commission du 10 mars 2023
    modifiant les annexes V, XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives à l’Argentine, au Royaume-Uni et
    aux États-Unis dans les listes des pays tiers en provenance desquels l’entrée
    dans l’Union d’envois de volailles et de produits germinaux de volailles ainsi
    que de viandes fraîches et de produits à base de viande de volailles et de gibier
    à plumes est autorisée
  type: main
