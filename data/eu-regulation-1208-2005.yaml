title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1208/2005 of 27 July 2005 amending, for the
    sixth time, Regulation (EC) No 1763/2004 imposing certain restrictive measures
    in support of effective implementation of the mandate of the International Criminal
    Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1208/2005 de la Commission du 27 juillet 2005 modifiant,
    pour la sixième fois, le règlement (CE) n° 1763/2004 instituant certaines mesures
    restrictives à l'appui d'une mise en œuvre effective du mandat du Tribunal pénal
    international de l'ex-Yougoslavie (TPIY)
  type: main
