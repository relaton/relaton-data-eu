  content: Commission Regulation (EEC) No 2271/76 of 17 September 1976 authorizing
    Denmark and the United Kingdom temporarily and totally to suspend the customs
    duties applicable to certain vegetables imported from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2271/76 de la Commission, du 17 septembre 1976, autorisant
