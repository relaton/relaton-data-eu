    de douane applicables à certains légumes importés en provenance des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2271/76 der Kommission vom 17. September 1976 zur
    Ermächtigung Dänemarks und des Vereinigten Königreichs, die Zollsätze auf
    einige aus Drittländern eingeführte Gemüse zeitweilig und vollständig auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2271/76 af 17. september 1976 om bemyndigelse
