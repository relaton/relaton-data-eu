id: EUDecision1980651
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/651/EEC: Commission Decision of 20 June 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven breeches, shorts and trousers (including
    slacks), falling within subheadings ex 61.01 B V and ex 61.02 B II of the Common
    Customs Tariff (category 6), originating in the Philippines and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/651/CEE: Décision de la Commission, du 20 juin 1980, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les culottes, "shorts" et pantalons, tissés,
    des sous-positions ex 61.01 B V et ex 61.02 B II du tarif douanier commun (catégorie
    6), originaires des Philippines et mis en libre pratique dans les autres États
    membres (Les textes en langues française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/651/EWG: Entscheidung der Kommission vom 20. Juni 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus den Philippinen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze Hosen und lange Hosen, aus
    Geweben, der Tarifstellen ex 61.01 B V und ex 61.02 B II (Kategorie 6) des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/651/EØF: Kommissionens beslutning af 20. juni 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage shorts og andre korte benklæder, lange
    benklæder, vævede, som henhører under pos. ex 61.01 B V og ex 61.02 B II i
    den fælles toldtarif (kategori 6), har oprindelse i Philippinerne og frit kan
    omsættes i de øvrige medlemsstater (Kun den franske og nederlandske udgave er
    autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/651/CEE: Decisione della Commissione, del 20 giugno 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i calzoncini, gli shorts e i pantaloni,
    tessuti, delle sottovoci ex 61.01 B V ed ex 61.02 B II della tariffa doganale
    comune, categoria 6, originari delle Filippine e messi in libera pratica negli
    altri Stati membri (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/651/EEG: Beschikking van de Commissie van 20 juni 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd shorts en andere korte broeken, lange broeken, geweven, van
    de posten ex 61.01 B V en ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 6), van oorsprong uit de Filippijnen en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
