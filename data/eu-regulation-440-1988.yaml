  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 440/88 della Commissione del 17 febbraio 1988 che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana o di
    peli fini della categoria di prodotti 48 (numero d' ordine 40.0480) e alle calze,
    calzini, esclusi quelli a maglia, della categoria di prodotti 88 (numero d' ordine
    40.0880) originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 440/88 van de Commissie van 17 februari 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    wol of van fijn haar, van de categorie van produkten nr. 48 (volgnummer 40.0480)
    en op kousen en sokken, andere dan van brei- of haakwerk, van de categorie van
