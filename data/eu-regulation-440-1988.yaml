title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 440/88 of 17 February 1988 re-establishing
    the levying of customs duties on yarn of combed sheep' s or lambs' wool or of
    combed fine animal hair, products of category 48 (order number 40.0480) and on
    stockings, socks and sockettes, not knitted or crocheted, products of category
    88 (order number 40.0880) originating in South Korea to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 440/88 de la Commission du 17 février 1988 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine ou de poils fins de la catégorie de produits n° 48 (numéro d' ordre 40.0480),
    aux bas, chaussettes, etc. autres qu' en bonneterie de la catégorie de produits
    n° 88 (numéro d' ordre 40.0880), originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 440/88 der Kommission vom 17. Februar 1988 über die
    Wiedereinführung des Zollsatzes für Garne aus Wolle oder feinen Tierhaaren der
    Warenkategorie 48 (Laufende Nummer 40.0480) und für Strümpfe, Socken und Söckchen,
    nicht gewirkt, der Warenkategorie 88 (Laufende Nummer 40.0880) mit Ursprung in
    Südkorea, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 440/88 af 17. februar 1988 om genindførelse
    af opkrævning af toldafgifter for garn af uld og fine dyrehår (kategori 48,
    løbenummer 40.0480) og strømper og sokker, ikke af trikotage (kategori 88, løbenummer
    40.0880), som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
