    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų T25 (ACS-ZMØØ3-2) arba kurie iš jų sudaryti ar pagaminti (pranešta
    dokumentu Nr. C(2026) 1507)
  type: main
