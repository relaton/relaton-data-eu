    costituiti o derivati da granturco geneticamente modificato T25 (ACS-ZMØØ3-2)
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2026) 1507]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/518 (2026. gada 10. marts), ar
