title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/518 of 10 March 2026 renewing
    the authorisation for placing on the market of products containing, consisting
    of or produced from genetically modified maize T25 (ACS-ZMØØ3-2) pursuant to
    Regulation (EC) No 1829/2003 of the European Parliament and of the Council (notified
    under document C(2026) 1507)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/518 de la Commission du 10 mars 2026
    renouvelant l’autorisation de mise sur le marché de produits contenant du maïs
    génétiquement modifié T25 (ACS-ZMØØ3-2), consistant en ce maïs ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2026) 1507]
  type: main
