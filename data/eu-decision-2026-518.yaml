    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedélynek az 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti
    megújításáról (az értesítés a C(2026) 1507. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
