- language: en
  script: Latn
  content: Council Regulation (EEC) No 198/90 of 22 January 1990 amending Regulation
    (EEC) No 475/86 laying down general rules for the system for controlling the prices
    and the quantities of certain products in the oils and fats sector released for
    consumption in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 198/90 du Conseil du 22 janvier 1990 modifiant le
    règlement (CEE) n° 475/86 déterminant les règles générales du régime de
    contrôle des prix et des quantités mises à la consommation en Espagne de certains
    produits du secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 198/90 DES RATES vom 22. Januar 1990 zur Änderung
