title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1415/77 of 27 June 1977 amending Regulation
    (EEC) No 1014/77 laying down certain interim measures for the conservation and
    management of fishery resources applicable to vessels flying the flag of certain
    non-member countries in the 200-nautical mile zone off the coast of the French
    department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1415/77 du Conseil, du 27 juin 1977, modifiant le
    règlement (CEE) n° 1014/77 fixant certaines mesures intérimaires de conservation
    et de gestion des ressources de pêche applicables à l'égard des navires battant
    pavillon de certains pays tiers dans la zone de 200 milles située au large des
    côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1415/77 des Rates vom 27. Juni 1977 zur Änderung
    der Verordnung (EWG) Nr. 1014/77 über einige vorläufige Maßnahmen gegenüber
    Schiffen, die die Flagge bestimmter Drittländer führen, zur Erhaltung und Bewirtschaftung
    der Fischbestände in der 200-Meilen-Zone vor der Küste des französischen Departements
    Guayana
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1415/77 af 27. juni 1977 om ændring af forordning
    (EØF) nr. 1014/77 om fastlæggelse af en række midlertidige foranstaltninger
    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse for
    fartøjer, der fører visse tredjelandes flag i 200 sømilezonen ud for det franske
    departement Guyanas kyster
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1415/77 del Consiglio, del 27 giugno 1977, che modifica
    il regolamento (CEE) n. 1014/77 che fissa alcune misure temporanee di conservazione
    e di gestione delle risorse alieutiche da applicare nei riguardi delle navi da
    pesca che battono bandiera di taluni paesi terzi nella zona di 200 miglia situata
    al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1415/77 van de Raad van 27 juni 1977 houdende wijziging
    van Verordening (EEG) nr. 1014/77 tot vaststelling van bepaalde overgangsmaatregelen
    voor de instandhouding en het beheer van visbestanden, die van toepassing zijn
    ten aanzien van schepen die de vlag voeren van bepaalde derde landen in de 200-mijlzone
    gelegen langs de kusten van het Franse departement Guyana
  type: main
