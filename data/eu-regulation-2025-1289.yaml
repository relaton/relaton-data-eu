---
id: EURegulation20251289
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1289 of 2 July 2025 setting
    out temporary measures in respect of tubers of Solanum tuberosum L., other than
    those intended for planting, originating in Egypt, to prevent the introduction
    of Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. into the
    Union territory, amending Implementing Regulation (EU) 2019/2072 and repealing
    Implementing Decision 2011/787/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1289 de la Commission du 2 juillet
    2025 établissant des mesures temporaires relatives aux tubercules de Solanum
    tuberosum L., autres que ceux destinés à la plantation, originaires d’Égypte
    afin d’éviter l’introduction de Ralstonia solanacearum (Smith) Yabuuchi et
    al. emend. Safni et al. sur le territoire de l’Union, modifiant le règlement
    d’exécution (UE) 2019/2072 et abrogeant la décision d’exécution 2011/787/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1289 der Kommission vom 2. Juli 2025
    zur Festlegung befristeter Maßnahmen für nicht zum Anpflanzen bestimmte Knollen
    von Solanum tuberosum L. mit Ursprung in Ägypten zur Verhinderung der Einschleppung
    von Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. in das
    Gebiet der Union, zur Änderung der Durchführungsverordnung (EU) 2019/2072 und
    zur Aufhebung des Durchführungsbeschlusses 2011/787/EU
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1289 на Комисията
    от 2 юли 2025 година за определяне на временни
    мерки по отношение на клубените от Solanum tuberosum
    L., различни от предназначените за засаждане,
    с произход от Египет, за да се предотврати въвеждането
    на Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. на територията
    на Съюза, за изменение на Регламент за изпълнение
    (ЕС) 2019/2072 и за отмяна на Решение за изпълнение
    2011/787/ЕС
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1289 ze dne 2. července 2025,
    kterým se stanoví dočasná opatření, pokud jde o hlízy Solanum tuberosum
    L., vyjma hlíz určených k pěstování, pocházející z Egypta, s cílem zabránit
    zavlékání organismu Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni
    et al. na území Unie, mění prováděcí nařízení (EU) 2019/2072 a zrušuje
    prováděcí rozhodnutí 2011/787/EU
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1289 af 2. juli 2025
    om midlertidige foranstaltninger for knolde af Solanum tuberosum L., bortset fra
    knolde til plantning, med oprindelse i Egypten for at forhindre indslæbning af
    Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. til Unionens
    område, om ændring af gennemførelsesforordning (EU) 2019/2072 og om ophævelse
    af gennemførelsesafgørelse 2011/787/EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/1289 της Επιτροπής,
    της 2ας Ιουλίου 2025, για τον καθορισμό προσωρινών
    μέτρων όσον αφορά τους κονδύλους Solanum tuberosum
    L., εκτός εκείνων που προορίζονται για φύτευση,
    καταγωγής Αιγύπτου, για την πρόληψη της εισαγωγής
    του Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. στο
    έδαφος της Ένωσης, για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) 2019/2072 και την κατάργηση
    της εκτελεστικής απόφασης 2011/787/ΕΕ
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/1289, 2. juuli 2025, millega kehtestatakse
    ajutised meetmed liigi Solanum tuberosum L. Egiptusest pärit mugulate suhtes,
    välja arvatud mahapanekuks ettenähtud mugulad, et hoida ära taimekahjustaja
    Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. sissetoomine
    liidu territooriumile, ning millega muudetakse rakendusmäärust (EL) 2019/2072
    ja tunnistatakse kehtetuks rakendusotsus 2011/787/EL
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/1289, annettu 2 päivänä
    heinäkuuta 2025, Egyptistä peräisin olevia muita kuin istutettaviksi tarkoitettuja
    lajin Solanum tuberosum L. mukuloita koskevien väliaikaisten toimenpiteiden vahvistamisesta
    Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al. -organismin
    unioniin kulkeutumisen estämiseksi, täytäntöönpanoasetuksen (EU) 2019/2072
    muuttamisesta ja täytäntöönpanopäätöksen 2011/787/EU kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/1289 ón gCoimisiún an 2 Iúil 2025
    lena leagtar amach bearta sealadacha maidir le tiúbair Solanum tuberosum L.,
    seachas iad siúd atá beartaithe le haghaidh plandú, de thionscnamh na hÉigipte
    chun cosc a chur le tabhairt isteach Ralstonia solanacearum (Smith) Yabuuchi et
    al. emend. i gcríoch an Aontais, lena leasaítear Rialachán Cur Chun Feidhme
    (AE) 2019/2072 agus lena n-aisghairtear Cinneadh Cur Chun Feidhme 2011/787/AE
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1289 оd 2. srpnja 2025. o utvrđivanju
    privremenih mjera u pogledu gomoljâ vrste Solanum tuberosum L., osim onih namijenjenih
    sadnji, podrijetlom iz Egipta, radi sprečavanja unosa štetnog organizma Ralstonia
    solanacearum (Smith) Yabuuchi et al. emend. Safni et al. na područje Unije i
    o izmjeni Provedbene uredbe (EU) 2019/2072 te stavljanju izvan snage Provedbene
    odluke 2011/787/EU
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1289 végrehajtási rendelete (2025. július 2.)
    a Solanum tuberosum L. Egyiptomból származó, nem ültetésre szánt gumóira
    vonatkozó ideiglenes intézkedéseknek a Ralstonia solanacearum (Smith) Yabuuchi
    et al. emend. Safni et al. károsító Unióba történő behurcolásának megelőzése
    érdekében történő megállapításáról, az (EU) 2019/2072 végrehajtási
    rendelet módosításáról és a 2011/787/EU végrehajtási határozat hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1289 della Commissione, del 2 luglio
    2025, che stabilisce misure temporanee per quanto concerne i tuberi di Solanum
    tuberosum L., eccetto quelli destinati all’impianto, originari dell’Egitto,
    per prevenire l’introduzione di Ralstonia solanacearum (Smith) Yabuuchi et al.
    emend. Safni et al. nel territorio dell’Unione, modifica il regolamento di esecuzione
    (UE) 2019/2072 e abroga la decisione di esecuzione 2011/787/UE
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1289 (2025. gada 2. jūlijs),
    ar ko attiecībā uz Ēģiptes izcelsmes Solanum tuberosum L. bumbuļiem, kas
    nav paredzēti stādīšanai, nosaka pagaidu pasākumus, kas nepieļauj Ralstonia
    solanacearum (Smith) Yabuuchi et al. emend. Safni et al. ievešanu Savienības
    teritorijā, groza Īstenošanas regulu (ES) 2019/2072 un atceļ Īstenošanas
    lēmumu 2011/787/ES
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 2 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1289,
    kuriuo nustatomos Egipto kilmės Solanum tuberosum L. stiebagumbiams, išskyrus
    skirtus sodinti, taikomos laikinosios priemonės, kuriomis siekiama neleisti patekti
    į Sąjungos teritoriją kenkėjui Ralstonia solanacearum (Smith) Yabuuchi et
    al. emend. Safni et al., iš dalies keičiamas Įgyvendinimo reglamentas (ES)
    2019/2072 ir panaikinamas Įgyvendinimo sprendimas 2011/787/ES
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1289 tat-2
    ta’ Lulju 2025 li jistabbilixxi miżuri temporanji fir-rigward tat-tuberi ta’
    Solanum tuberosum L., minbarra dawk maħsuba għat-tħawwil, li joriġinaw fl-Eġittu,
    biex jipprevjenu l-introduzzjoni ta’ Ralstonia solanacearum (Smith) Yabuuchi
    et al. emend. Safni et al. fit-territorju tal-Unjoni, li jemenda r-Regolament
    ta’ Implimentazzjoni (UE) 2019/2072 u li jħassar id-Deċiżjoni ta’ Implimentazzjoni
    2011/787/UE
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1289 van de Commissie van 2 juli 2025
    tot vaststelling van tijdelijke maatregelen ten aanzien van knollen van Solanum
    tuberosum L., afkomstig uit Egypte, met uitzondering van voor opplant bestemde
    knollen, om het binnenbrengen op het grondgebied van de Unie van Ralstonia solanacearum
    (Smith) Yabuuchi et al. emend. Safni et al. te voorkomen, tot wijziging van Uitvoeringsverordening
    (EU) 2019/2072 en tot intrekking van Uitvoeringsbesluit 2011/787/EU
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1289 z dnia 2 lipca 2025 r.
    ustanawiające tymczasowe środki w odniesieniu do bulw Solanum tuberosum L. innych
    niż przeznaczone do sadzenia, pochodzących z Egiptu, w celu zapobieżenia wprowadzeniu
    na terytorium Unii Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni
    et al., zmieniające rozporządzenie wykonawcze (UE) 2019/2072 i uchylające decyzję
    wykonawczą 2011/787/UE
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1289 da Comissão, de 2 de julho de
    2025, que estabelece medidas temporárias relativamente aos tubérculos de Solanum
    tuberosum L., com exceção dos destinados à plantação, originários do Egito,
    a fim de impedir a introdução de Ralstonia solanacearum (Smith) Yabuuchi et
    al. emend. Safni et al. no território da União, que altera o Regulamento de
    Execução (UE) 2019/2072 e que revoga a Decisão de Execução 2011/787/UE
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1289 al Comisiei din 2 iulie
    2025 de stabilire a unor măsuri temporare privind tuberculii de Solanum tuberosum
    L., alții decât cei destinați plantării, originari din Egipt, pentru a împiedica
    introducerea Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni et al.
    pe teritoriul Uniunii, de modificare a Regulamentului de punere în aplicare (UE)
    2019/2072 și de abrogare a Deciziei de punere în aplicare 2011/787/UE
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1289 z 2. júla 2025, ktorým
    sa stanovujú dočasné opatrenia, pokiaľ ide o hľuzy Solanum tuberosum L. s
    pôvodom v Egypte okrem tých, ktoré sú určené na výsadbu, s cieľom zabrániť
    zavlečeniu škodcu Ralstonia solanacearum (Smith) Yabuuchi et al. emend. Safni
    et al. na územie Únie a ktorým sa mení vykonávacie nariadenie (EÚ) 2019/2072
    a zrušuje vykonávacie rozhodnutie 2011/787/EÚ
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1289 z dne 2. julija 2025 o določitvi
    začasnih ukrepov v zvezi z gomolji Solanum tuberosum L., razen tistih za saditev,
    s poreklom iz Egipta za preprečevanje vnosa bakterije Ralstonia solanacearum
    (Smith) Yabuuchi et al. emend. Safni et al. na ozemlje Unije, spremembi Izvedbene
    uredbe (EU) 2019/2072 ter razveljavitvi Izvedbenega sklepa 2011/787/EU
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1289 de la Comisión, de 2 de julio
    de 2025, por el que se establecen medidas temporales con respecto a los tubérculos
    de Solanum tuberosum L., distintos de los destinados a la plantación, originarios
    de Egipto, para evitar la introducción de Ralstonia solanacearum (Smith) Yabuuchi
    et al. emend. Safni et al. en el territorio de la Unión, por el que se modifica
    el Reglamento de Ejecución (UE) 2019/2072 y por el que se deroga la Decisión
    de Ejecución 2011/787/UE
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1289 av den 2 juli 2025
    om fastställande av tillfälliga åtgärder i fråga om andra knölar av Solanum
    tuberosum L. än de som är avsedda för plantering, med ursprung i Egypten, för
    att förhindra introduktion av Ralstonia solanacearum (Smith) Yabuuchi et al.
    emend. Safni et al. i unionens territorium och om ändring av genomförandeförordning
    (EU) 2019/2072 samt om upphävande av genomförandebeslut 2011/787/EU
  type: main
