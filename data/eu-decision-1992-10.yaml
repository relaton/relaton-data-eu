title:
- language: en
  script: Latn
  content: Council Decision of 19 December 1991 postponing the date on which the national
    provisions applying Directive 89/104/EEC to approximate the laws of the Member
    States relating to trade marks are to be put into effect
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil, du 19 décembre 1991, reportant la date de mise en
    vigueur des dispositions nationales d'application de la directive 89/104/CEE rapprochant
    les legislations des Etats membres sur les marques
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rates vom 19. Dezember 1991 über die Verschiebung des
    Zeitpunktes, bis zu dem die Mitgliedstaaten der Richtlinie 89/104/EWG zur Angleichung
    der Rechtsvorschriften der Mitgliedstaaten über die Marken spätestens nachkommen
    müssen
  type: main
- language: bg
  script: Cyrl
  content: РЕШЕНИЕ НА СЪВЕТА от 19 декември 1991 година
    относно отлагането на датата на влизане в сила
    на националните разпоредби за прилагане на
    Директива 89/104/ЕИО за сближаване на законодателствата
    на държавите-членки относно марките
  type: main
- language: cs
  script: Latn
  content: ROZHODNUTÍ RADY ze dne 19. prosince 1991, kterým se odkládá termín
    uvedení v účinnost vnitrostátních předpisů uplatňujících směrnici 89/104/EHS,
    kterou se sbližují právní předpisy členských států o ochranných známkách
  type: main
- language: da
  script: Latn
  content: Rådets beslutning af 19. december 1991 om udsættelse af ikrafttrædelsesdatoen
    for de nationale gennemførelsesbestemmelser til direktiv 89/104/EØF om indbyrdes
    tilnærmelse af medlemsstaternes lovgivning om varemærker
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 19ης Δεκεμβρίου
    1991 για τη μετάθεση της ημερομηνίας θέσεως σε
    ισχύ των εθνικών διατάξεων εφαρμογής της οδηγίας
    89/104/ΕΟΚ για την προσέγγιση των νομοθεσιών των
    κρατών μελών περί σημάτων
  type: main
- language: et
  script: Latn
  content: NÕUKOGU OTSUS, 19. detsember 1991, millega lükatakse edasi direktiivi
    89/104/EMÜ (kaubamärke käsitlevate liikmesriikide õigusaktide ühtlustamise
    kohta) rakendamiseks võetavate siseriiklike sätete jõustamise kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 19 päivänä joulukuuta 1991, jäsenvaltioiden
    tavaramerkkilainsäädännön lähentämisestä annetun direktiivin 89/104/ETY
    soveltamista koskevien kansallisten säännösten voimaansaattamispäivän lykkäämisestä
  type: main
- language: hu
  script: Latn
  content: A TANÁCS HATÁROZATA (1991. december 19.) a védjegyekre vonatkozó tagállami
    jogszabályok közelítéséről szóló 89/104/EGK irányelv alkalmazására
    vonatkozó nemzeti rendelkezések hatálybaléptetése időpontjának elhalasztásáról
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 19 dicembre 1991, che proroga la data di messa
    in vigore della direttiva 89/104/CEE sul ravvicinamento delle legislazioni degli
    Stati membri in materia di marchi d'impresa
  type: main
- language: lv
  script: Latn
  content: PADOMES LĒMUMS (1991. gada 19. decembris), ar ko atliek dienu, kad jāstājas
    spēkā valstu noteikumiem, īstenojot Direktīvu 89/104/EEK, ar ko tuvina dalībvalstu
    tiesību aktus attiecībā uz preču zīmēm
  type: main
- language: lt
  script: Latn
  content: TARYBOS SPRENDIMAS 1991 m. gruodžio 19 d. atidedantis nacionalinių nuostatų,
    įgyvendinant Direktyvą 89/104/EEB dėl valstybių narių įstatymų, reglamentuojančių
    prekių ženklus, suderinimo, įsigaliojimo datą
  type: main
- language: mt
  script: Latn
  content: ID-DEĊIŻJONI TAL-KUNSILL tad-19 ta’ Diċembru 1991 li tipposponi d-data
    li fiha jibdew iseħħu d-disposizzjonijiet nazzjonali li japplikaw id-Direttiva
    89/104/KEE biex ikunu approssimati l-liġijiet ta’ l-Istati Membri li għan
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 19 december 1991 tot verschuiving van de datum
    van tenuitvoerlegging van de nationale toepassingsbepalingen van Richtlijn 89/104/EEG
    betreffende de aanpassing van het merkenrecht der Lid­Staten
  type: main
- language: pl
  script: Latn
  content: DECYZJA RADY z dnia 19 grudnia 1991 r. odraczająca termin wprowadzenia
    w życie przepisów krajowych wykonujących dyrektywę 89/104/EWG mającą na
    celu zbliżenie ustawodawstw Państw Członkowskich odnoszących się do znaków
    towarowych
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho, de 19 de Dezembro de 1991, que prorroga a data de
    entrada em vigor das disposições nacionais de aplicação da Directiva 89/104/CEE,
    que harmoniza as legislações dos Estados-membros em matéria de marcas
  type: main
- language: ro
  script: Latn
  content: DECIZIA CONSILIULUI din 19 decembrie 1991 de amânare a datei de intrare
    în vigoare a dispozițiilor de drept intern de aplicare a Directivei 89/104/CEE
    privind apropierea legislațiilor statelor membre privind mărcile
  type: main
- language: sk
  script: Latn
  content: ROZHODNUTIE RADY z 19. decembra 1991, ktorým sa odkladá dátum, ku ktorému
    musia byť uvedené do účinnosti vnútroštátne ustanovenia na uplatňovanie
    smernice 89/104/EHS o aproximácii právnych predpisov členských štátov o
    ochranných známkach
  type: main
- language: sl
  script: Latn
  content: ODLOČBA SVETA z dne 19. decembra 1991 o odložitvi datuma, ko naj začnejo
    veljati nacionalne določbe o uporabi Direktive 89/104/EGS za približevanje zakonov
    držav članic v zvezi z blagovnimi znamkami
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo, de 19 de diciembre de 1991, por la que se aplaza
    la fecha de puesta en vigor de las disposiciones nacionales de aplicación de
    la Directiva 89/104/CEE relativa a la aproximación de las legislaciones de los
    Estados miembros en materia de marcas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 19 december 1991 om senareläggning av den dag då
    de nationella genomförandebestämmelserna till direktiv 89/104/EEG om tillnärmningen
    av medlemsstaternas varumärkeslagar skall träda i kraft
