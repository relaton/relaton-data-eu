title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2621/84 of 14 September 1984 re-establishing
    the levying of the customs duties on isopropylamine and its salts, falling within
    subheading 29.22 A ex III, originating in Romania, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2621/84 de la Commission du 14 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables à l' isopropylamine
    et ses sels, de la sous-position 29.22 A ex III du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2621/84 der Kommission vom 14. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für Isopropylamin und seine Salze der
    Tarifstelle 29.22 A ex III mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2621/84 af 14. september 1984 om genindførelse
    af opkrævning af told for isopropylamin samt salte deraf, henhørende under pos.
    29.22 A ex III og med oprindelse i Rumænien som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2621/84 της Επιτροπής
    της 14ης Σεπτεμβρίου 1984 περί επαναφοράς της
    εισπράξεως τελωνειακών δασμών για την ισοπροπυλαμίνη
    και τα άλατα αυτής, της διακρίσεως 29.22 Α ex ΙΙΙ
    του Κοινού Δασμολογίου, καταγωγής Ρουμανίας,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2621/84 della Commissione del 14 settembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili all' isopropilammina e
    suoi sali della sottovoce 29.22 A ex III della tariffa doganale comune, originari
    della Romania beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2621/84 van de Commissie van 14 september 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op isopropylamine
    en zouten daarvan, van postonderverdeling 29.22 A ex III, van oorsprong uit Roemenië,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
