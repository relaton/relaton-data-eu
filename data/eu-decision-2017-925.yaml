  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/925 della Commissione, del 29 maggio
    2017, che autorizza temporaneamente alcuni Stati membri a certificare materiali
    di pre-base di determinate specie di piante da frutto, prodotti in campo in condizioni
    non a prova di insetto e che abroga la decisione di esecuzione (UE) 2017/167 [notificata
    con il numero C(2017) 2800]
  type: main
- language: lv
  script: Latn
