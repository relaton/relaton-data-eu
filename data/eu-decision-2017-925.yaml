    materiál konkrétních druhů ovocných rostlin vyprodukovaný na poli za podmínek
    nechráněných proti hmyzu a kterým se zrušuje prováděcí rozhodnutí (EU)
    2017/167 (oznámeno pod číslem C(2017) 2800)
  type: main
