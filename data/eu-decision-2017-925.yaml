title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/925 of 29 May 2017 temporarily
    authorising certain Member States to certify pre-basic material of certain species
    of fruit plants, produced in the field under non-insect proof conditions, and
    repealing Implementing Decision (EU) 2017/167 (notified under document C(2017)
    2800)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/925 de la Commission du 29 mai 2017 autorisant
    temporairement certains États membres à certifier les matériels initiaux d'espèces
    déterminées de plantes fruitières produites dans un champ non protégé des
    insectes et abrogeant la décision d'exécution (UE) 2017/167 [notifiée sous
    le numéro C(2017) 2800]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/925 der Kommission vom 29. Mai 2017 zur
    vorübergehenden Ermächtigung bestimmter Mitgliedstaaten, auf dem Feld unter
    nicht insektensicheren Bedingungen erzeugtes Vorstufenmaterial bestimmter Arten
    von Obstpflanzen zu zertifizieren, und zur Aufhebung des Durchführungsbeschlusses
    (EU) 2017/167 (Bekannt gegeben unter Aktenzeichen C(2017) 2800)
  type: main
