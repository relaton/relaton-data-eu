id: EURegulation2016897
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/897 of 8 June 2016 concerning
    the authorisation of a preparation of Bacillus subtilis (C-3102) (DSM 15544) as
    a feed additive for laying hens and ornamental fish (holder of authorisation Asahi
    Calpis Wellness Co. Ltd) and amending Regulations (EC) No 1444/2006, (EU) No 333/2010
    and (EU) No 184/2011 as regards the holder of the authorisation
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2016/897 de la Commission du 8 juin 2016
    concernant l''autorisation d''une préparation de Bacillus subtilis (C-3102) (DSM
    15544) en tant qu''additif pour l''alimentation des poules pondeuses et des poissons
    d''ornement (titulaire de l''autorisation: Asahi Calpis Wellness Co. Ltd) et modifiant
    les règlements (CE) n° 1444/2006, (UE) n° 333/2010 et (UE) n° 184/2011 en
    ce qui concerne le titulaire de l''autorisation'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2016/897 der Kommission vom 8. Juni 2016
    zur Zulassung einer Zubereitung aus Bacillus subtilis (C-3102) (DSM 15544) als
    Zusatzstoff in Futtermitteln für Legehennen und Zierfische (Zulassungsinhaber:
    Asahi Calpis Wellness Co. Ltd.) und zur Änderung der Verordnungen (EG) Nr. 1444/2006,
    (EU) Nr. 333/2010 und (EU) Nr. 184/2011 in Bezug auf den Zulassungsinhaber'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/897 на Комисията
    от 8 юни 2016 година за разрешаване на употребата
    на препарат от Bacillus subtilis (C-3102) (DSM 15544) като фуражна
    добавка за кокошки носачки и декоративни риби
    (притежател на разрешението Asahi Calpis Wellness Co.
    Ltd.) и за изменение на регламенти (ЕО) № 1444/2006,
    (ЕС) № 333/2010 и (ЕС) № 184/2011 по отношение на притежателя
    на разрешението
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/897 ze dne 8. června 2016 o
    povolení přípravku Bacillus subtilis (C-3102) (DSM 15544) jako doplňkové
    látky pro nosnice a okrasné ryby (držitel povolení Asahi Calpis Wellness Co.
    Ltd.) a o změně nařízení (ES) č. 1444/2006, (EU) č. 333/2010 a (EU) č.
    184/2011, pokud jde o držitele povolení
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/897 af 8. juni 2016 om
    godkendelse af et præparat af Bacillus subtilis (C-3102) (DSM 15544) som fodertilsætningsstof
    til æglæggende høner og prydfisk (indehaver af godkendelsen er Asahi Calpis
    Wellness Co. Ltd.) og om ændring af s forordning (EF) nr. 1444/2006, (EU) nr.
    333/2010 og (EU) nr. 184/2011 for så vidt angår indehaveren af tilladelsen
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2016/897 της Επιτροπής,
    της 8ης Ιουνίου 2016, σχετικά με τη χορήγηση άδειας
    για τη χρήση παρασκευάσματος του Bacillus subtilis
    (C-3102) (DSM 15544) ως πρόσθετης ύλης ζωοτροφών για
    όρνιθες ωοπαραγωγής και διακοσμητικά ψάρια
    (κάτοχος της άδειας: Asahi Calpis Wellness Co. Ltd.) και για
    την τροποποίηση των κανονισμών (ΕΚ) αριθ. 1444/2006,
    (ΕΕ) αριθ. 333/2010 και (ΕΕ) αριθ. 184/2011 όσον αφορά
    τον κάτοχο της άδειας'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/897, 8. juuni 2016, milles käsitletakse
    Bacillus subtilis'e (C-3102) (DSM 15544) valmistise lubamist munakanade ja dekoratiivkalade
    söödalisandina (loa hoidja Asahi Calpis Wellness Co. Ltd.) ja millega muudetakse
    määrusi (EÜ) nr 1444/2006, (EL) nr 333/2010 ja (EL) nr 184/2011 loa hoidja
    osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/897, annettu 8 päivänä
    kesäkuuta 2016, Bacillus subtilis (C-3102) (DSM 15544) -organismia sisältävän
    valmisteen hyväksymisestä munivien kanojen ja akvaariokalojen rehun lisäaineena
    (hyväksynnän haltija Asahi Calpis Wellness Co. Ltd.) ja asetusten (EY) N:o 1444/2006,
    (EU) N:o 333/2010 ja (EU) N:o 184/2011 muuttamisesta hyväksynnän haltijan osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/897 оd 8. lipnja 2016. o odobrenju
    pripravka Bacillus subtilis (C-3102) (DSM 15544) kao dodatka hrani za životinje
    za kokoši nesilice i ukrasne ribe (nositelj odobrenja Asahi Calpis Wellness Co.
    Ltd.) i o izmjeni uredbi (EZ) br. 1444/2006, (EU) br. 333/2010 i (EU) br. 184/2011
    u pogledu nositelja odobrenja
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2016/897 végrehajtási rendelete (2016. június 8.)
    egy Bacillus subtilist (C-3102) (DSM 15544) tartalmazó készítménynek (az engedély
    jogosultja: Asahi Calpis Wellness Co. Ltd.) a tojótyúkok és a díszhalak takarmány-adalékanyagaként
    való engedélyezéséről, valamint az 1444/2006/EK, a 333/2010/EU és a 184/2011/EU
    rendeleteknek az engedély jogosultja tekintetében történő módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/897 della Commissione, dell'8 giugno
    2016, relativo all'autorizzazione di un preparato di Bacillus subtilis (C-3102)
    (DSM 15544) come additivo per mangimi destinati a galline ovaiole e pesci ornamentali
    (titolare dell'autorizzazione Asahi Calpis Wellness Co. Ltd.) e che modifica i
    regolamenti (CE) n. 1444/2006, (UE) n. 333/2010 e (UE) n. 184/2011 per quanto
    riguarda il titolare dell'autorizzazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/897 (2016. gada 8. jūnijs), ar
    ko atļauj preparātu Bacillus subtilis (C-3102) (DSM 15544) lietot par barības
    piedevu dējējvistām un dekoratīvām zivīm (atļaujas turētājs Asahi Calpis
    Wellness Co. Ltd.) un ar ko attiecībā uz atļaujas turētāju groza Regulu (EK)
    Nr. 1444/2006, Regulu (ES) Nr. 333/2010 un Regulu (ES) Nr. 184/2011
  type: main
- language: lt
  script: Latn
  content: 2016 m. birželio 8 d. Komisijos įgyvendinimo reglamentas (ES) 2016/897
    dėl leidimo naudoti Bacillus subtilis (C-3102) (DSM 15544) kaip vištų dedeklių
    ir dekoratyvinių žuvų pašaro priedą (leidimo turėtojas – Asahi Calpis
    Wellness Co. Ltd.) ir kuriuo iš dalies keičiamos reglamentų (EB) Nr. 1444/2006,
    (ES) Nr. 333/2010 ir (ES) Nr. 184/2011 nuostatos dėl leidimo turėtojo
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/897 tat-8 ta'
    Ġunju 2016 dwar l-awtorizzazzjoni ta' preparat ta' Bacillus subtilis (C-3102)
    (DSM 15544) bħala addittiv tal-għalf għat-tiġieġ tal-bajd u għall-ħut ornamentali,
    u li jemenda r-Regolamenti (KE) Nru 1444/2006, (UE) Nru 333/2010 u (UE) Nru 184/2011
    rigward id-detentur tal-awtorizzazzjoni (li huwa Asahi Calpis Wellness Co. Ltd.)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/897 van de Commissie van 8 juni 2016 tot
    verlening van een vergunning voor een preparaat van Bacillus subtilis (C-3102)
    (DSM 15544) als toevoegingsmiddel voor diervoeding voor legkippen en siervissen
    (vergunninghouder Asahi Calpis Wellness Co. Ltd) en tot wijziging van de Verordeningen
    (EG) nr. 1444/2006, (EU) nr. 333/2010 en (EU) nr. 184/2011 wat betreft de vergunninghouder
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/897 z dnia 8 czerwca 2016
    r. dotyczące zezwolenia na stosowanie preparatu Bacillus subtilis (C-3102) (DSM
    15544) jako dodatku paszowego dla kur niosek i ryb ozdobnych (posiadacz zezwolenia
    Asahi Calpis Wellness Co. Ltd.) oraz zmieniające rozporządzenia (WE) nr 1444/2006,
    (UE) nr 333/2010 i (UE) nr 184/2011 w odniesieniu do posiadacza zezwolenia
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/897 da Comissão, de 8 de junho de
    2016, relativo à autorização de uma preparação de Bacillus subtilis (C-3102)
    (DSM 15544) como aditivo em alimentos para galinhas poedeiras e peixes ornamentais
    (detentor da autorização Asahi Calpis Wellness Co. Ltd.) e que altera os Regulamentos
    (CE) n.° 1444/2006, (UE) n.° 333/2010 e (UE) n.° 184/2011 no que se refere
    ao detentor da autorização
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2016/897 al Comisiei din 8 iunie
    2016 privind autorizarea unui preparat de Bacillus subtilis (C-3102) (DSM 15544)
    ca aditiv destinat hranei pentru găini ouătoare și pești ornamentali (titularul
    autorizației: Asahi Calpis Wellness Co. Ltd.) și de modificare a Regulamentelor
    (CE) nr. 1444/2006, (UE) nr. 333/2010 și (UE) nr. 184/2011 în ceea ce privește
    titularul autorizației'
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/897 z 8. júna 2016 o povolení
    prípravku z Bacillus subtilis (C-3102) (DSM 15544) ako kŕmnej doplnkovej látky
    pre nosnice a okrasné ryby (držiteľ povolenia Asahi Calpis Wellness Co. Ltd.)
    a o zmene nariadení (ES) č. 1444/2006, (EÚ) č. 333/2010 a (EÚ) č. 184/2011,
    pokiaľ ide o držiteľa povolenia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/897 z dne 8. junija 2016 o izdaji dovoljenja
    za pripravek iz Bacillus subtilis (C-3102) (DSM 15544) kot krmni dodatek za kokoši
    nesnice in okrasne ribe (imetnik dovoljenja Asahi Calpis Wellness Co. Ltd.) in
    o spremembi uredb (ES) št. 1444/2006, (EU) št. 333/2010 in (EU) št. 184/2011,
    kar se tiče imetnika dovoljenja
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2016/897 de la Comisión, de 8 de junio
    de 2016, relativo a la autorización de un preparado de Bacillus subtilis (C-3102)
    (DSM 15544) como aditivo en piensos para gallinas ponedoras y peces ornamentales
    (titular de la autorización: Asahi Calpis Wellness Co. Ltd.) y por el que se
    modifican los Reglamentos (CE) n.° 1444/2006, (UE) n.° 333/2010 y (UE) n.°
    184/2011 en lo que concierne al titular de la autorización'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2016/897 av den 8 juni 2016
    om godkännande av ett preparat av Bacillus subtilis (C-3102) (DSM 15544) som
    fodertillsats för värphöns och akvariefiskar (innehavare av godkännandet:
    Asahi Calpis Wellness Co. Ltd) samt om ändring av förordningarna (EG) nr 1444/2006,
    (EU) nr 333/2010 och (EU) nr 184/2011 vad gäller innehavaren av godkännandet'
