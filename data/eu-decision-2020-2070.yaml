    a la posición que debe adoptarse en nombre de la Unión Europea en el seno del
    Consejo de Estabilización y Asociación instituido en virtud del Acuerdo de Estabilización
    y Asociación entre las Comunidades Europeas y sus Estados miembros, por una parte,
    y la ex República Yugoslava de Macedonia, por otra, con respecto a la modificación
    de dicho Acuerdo mediante la sustitución de su Protocolo n.o 4 relativo a la
    definición del concepto de «productos originarios» y métodos de cooperación
    administrativa
  type: main
