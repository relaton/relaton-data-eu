    s Stabilizacijsko-pridružitvenim sporazumom med Evropskimi skupnostmi in njihovimi
    državami članicami na eni strani in Nekdanjo jugoslovansko republiko Makedonijo
    na drugi, glede spremembe navedenega sporazuma z nadomestitvijo Protokola 4 k
    navedenemu sporazumu o opredelitvi pojma „izdelki s poreklom“ in načinih
    upravnega sodelovanja
  type: main
