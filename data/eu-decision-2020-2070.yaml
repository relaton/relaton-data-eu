title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/2070 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and the former
    Yugoslav Republic of Macedonia, of the other part, as regards the amendment of
    that Agreement by replacing Protocol 4 thereto concerning the definition of the
    concept of ‘originating products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2070 du Conseil du 7 décembre 2020 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil de stabilisation
    et d’association institué par l’accord de stabilisation et d’association
    entre les Communautés européennes et leurs États membres, d’une part, et
    l’ancienne République yougoslave de Macédoine, d’autre part, en ce qui concerne
    la modification dudit accord par le remplacement de son protocole no 4 relatif
    à la définition de la notion de «produits originaires» et aux méthodes de
    coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/2070 des Rates vom 7. Dezember 2020 über den Standpunkt,
    der im Namen der Europäischen Union in dem mit dem Stabilisierungs- und Assoziierungsabkommen
    zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits
    und der ehemaligen jugoslawischen Republik Mazedonien andererseits eingesetzten
    Stabilitäts- und Assoziationsrat zur Änderung des genannten Abkommens durch
    die Ersetzung des Protokolls Nr. 4 über die Bestimmung des Begriffs „Erzeugnisse
    mit Ursprung in“ oder „Ursprungserzeugnisse“ und über die Methoden der
    Zusammenarbeit der Verwaltungen zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2020/2070 на Съвета от 7 декември
    2020 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвета за стабилизиране и асоцииране, създаден
    по силата на Споразумението за стабилизиране
    и асоцииране между Европейските общности и
    техните държави членки, от една страна, и Бивша
