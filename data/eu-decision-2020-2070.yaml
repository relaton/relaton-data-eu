    som inrättades genom stabiliserings- och associeringsavtalet mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och f.d. jugoslaviska republiken
    Makedonien, å andra sidan, vad gäller ändring av det avtalet genom ersättande
    av protokoll 4 om definition av begreppet ursprungsprodukter och om metoder för
