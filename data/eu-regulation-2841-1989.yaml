  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2841/89 del Consiglio, del 18 settembre 1989, concernente
    l'applicazione della decisione n. 1/89 del comitato misto CEE-Norvegia che modifica
    il protocollo n. 3 relativo alla definizione della nozione di «prodotti originari»
    e ai metodi di cooperazione amministrativa e che stabilisce le disposizioni di
    attuazione della dichiarazione comune allegata alla decisione n. 1/88 del comitato
    misto CEE- Norvegia
  type: main
