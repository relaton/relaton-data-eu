  content: Council Regulation (EEC) No 2841/89 of 18 September 1989 on the implementation
    of Decision No 1/89 of the EEC- Norway Joint Committee amending Protocol 3 concerning
    the definition of the concept of originating products and methods of administrative
    cooperation and establishing provisions for the implementation of the Joint Declaration
    annexed to Decision No 1/88 of the EEC-Norway Joint Committee
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2841/89 du Conseil, du 18 septembre 1989, concernant
    l'application de la décision n° 1/89 du comité mixte CEE-Norvège modifiant
    le protocole n° 3 relatif à la définition de la notion de produits originaires
    et aux méthodes de coopération administrative, et fixant les dispositions pour
    l'application de la déclaration commune annexée à la décision n° 1/88 du
    comité mixte CEE-Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2841/89 des Rates vom 18. September 1989 zur Anwendung
    des Beschlusses Nr. 1/89 des Gemischten Ausschusses EWG-Norwegen zur Änderung
    des Protokolls Nr. 3 über die Bestimmung des Begriffs "Erzeugnisse mit Ursprung
    in" oder "Ursprungserzeugnisse" und über die Methoden der Zusammenarbeit der
    Verwaltungen und zur Festlegung der Vorschriften zur Durchführung der dem Beschluß
    Nr. 1/88 des Gemischten Ausschusses EWG-Norwegen beigefügten gemeinsamen Erklärung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2841/89 af 18. september 1989 om gennemførelse
