title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 464/84 of 22 February 1984 re-establishing
    the levying of customs duties on certain articles, made from yarn, twine, cordage,
    rope or cables, products of category 98 (code 0980), originating in China, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 464/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    articles fabriqués avec des fils, ficelles, cordes ou cordages, de la catégorie
    98 (code 0980), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 464/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Waren aus Garnen, Bindfäden,
    Seilen oder Tauen der Warenkategorie Nr. 98 (Kennziffer 0980), mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 464/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte varer fremstillet af garn, sejlgarn,
    reb og tovværk, under varekategori nr. 98 (kode 0980), som har oprindelse i Kina
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 464/84 της Επιτροπής
    της 22ας Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    είδη κατασκευασμένα εκ νημάτων, σπάγγων, σχοινίων
    ή χονδρών σχοινίων, προϊόντα της κατηγορίας
    98 (κωδικός 0980), καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 464/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai manufatti ottenuti
    con l' impiego di filati, spago, corde o funi, della categoria di prodotti n.
    98 (codice 0980), originari della Cina beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 464/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    artikelen, vervaardigd van garen, van bindgaren, van touw of van kabel, van de
    categorie van produkten nr. 98 (codenummer 0980), van oorsprong uit China, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3570/83
    van de Raad
  type: main
