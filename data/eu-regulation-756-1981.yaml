title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 756/81 of 24 March 1981 re-establishing
    the levying of customs duties on yarn of sheep' s or lambs' wool or of fine animal
    hair, put up for retail sale, products of category 49 (code 0490), originating
    in Peru, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 756/81 de la Commission, du 24 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine ou de poils fins, conditionnés pour la vente au détail, de la catégorie
    de produits n° 49 (code 0490), originaires du Pérou, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 756/81 der Kommission vom 24. März 1981 über die
    Wiedereinführung des Zollsatzes für Garne aus Wolle oder aus feinen Tierhaaren,
    in Aufmachungen für den Einzelverkauf, der Warenkategorie Nr. 49 (Kennziffer
    0490), mit Ursprung in Peru, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 756/81 af 24. marts 1981 om genindførelse
    af opkrævning af toldafgifter for garn af uld eller fine dyrehår, i detailsalgsoplægninger,
    under kategori 49 (kode 0490), som har oprindelse i Peru og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 756/81 τής Επιτροπής
    τής 24ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά νήματα εξ
    ερίου, εκ τριχών εκλεκτής ποιότητος ή μή, ή
    εξ ιππείων τριχών, συνεσκευασμένα διά τήν λιανικήν
    πώλησιν, τών προϊόντων τής κατηγορίας 49 (κώδικας
    0490), καταγωγής Περού, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 756/81 della Commissione, del 24 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai filati di lana o di peli fini,
    preparati per la vendita al minuto, della categoria di prodotti n. 49 (codice
    0490), originari del Perù beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 756/81 van de Commissie van 24 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    wol of van fijn haar, gereed voor de verkoop in het klein, van de categorie van
    produkten nr. 49 (codenummmer 0490), van oorsprong uit Peru, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3320/80 van de
    Raad
