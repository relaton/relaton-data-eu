title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 mars 1969, portant prorogation de la
    décision, du 14 avril 1965, autorisant la République italienne en vertu de l'article
    115 alinéa 1 du Traité, à exclure du traitement communautaire les piles électriques,
    de la position 85.03 du Tarif douanier commun, originaires du Japon et mises en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '69/126/EWG: Entscheidung der Kommission vom 28. März 1969 zur Verlängerung
    der Geltungsdauer der Entscheidung vom 14. April 1965, mit der die Italienische
    Republik auf Grund des Artikels 115 Absatz 1 des Vertrages ermächtigt worden
    war, Primärelemente und Primärbatterien (Tarifnummer 85.03 des Gemeinsamen Zolltarifs)
    japanischen Ursprungs, die sich in den anderen Mitgliedstaaten im freien Verkehr
    befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/126/CEE: Decisione della Commissione, del 28 marzo 1969, che proroga
    la decisione del 14 aprile 1965 con la quale la Repubblica italiana è autorizzata,
    a norma dell''articolo 115, primo comma, del trattato, a escludere dal trattamento
    comunitario le pile elettriche della voce 85.03 della tariffa doganale comune,
    originarie del Giappone e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/126/EEG: Beschikking van de Commissie van 28 maart 1969 houdende verlenging
    van de beschikking van 14 april 1965 tot machtiging van de Italiaanse Republiek
    om op grond van artikel 115, eerste alinea, van het Verdrag elektrische elementen
    en elektrische batterijen, van post 85.03 van het gemeenschappelijk douanetarief,
    die van oorsprong zijn uit Japan en in de andere Lid-Staten in het vrije verkeer
    zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
