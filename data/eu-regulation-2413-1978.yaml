- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2413/78 of 17 October 1978 amending Annex
    II to Regulation (EEC) No 2054/76 on the sale for export to non-member countries
    of skimmed-milk powder held by intervention agencies and intended for use as feed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2413/78 de la Commission, du 17 octobre 1978, modifiant
    l' annexe II du règlement (CEE) n° 2054/76 relatif à la vente, en vue de l'
    exportation vers les pays tiers, de lait écrémé en poudre détenu par les organismes
    d' intervention et destiné à l' alimentation des animaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2413/78 der Kommission vom 17. Oktober 1978 zur Änderung
    des Anhangs II zur Verordnung (EWG) Nr. 2054/76 über den Verkauf von Magermilchpulver
    zu Futterzwecken aus Beständen der Interventionsstellen für die Ausfuhr nach
    Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2413/78 af 17. oktober 1978 om ændring
    af bilag II til forordning (EØF) nr. 2054/76 om salg med henblik på udførsel
    til tredjelande af skummetmælkspulver, som interventionsorganerne ligger inde
    med, og som er bestemt til foder
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2413/78 della Commissione, del 17 ottobre 1978, che
    modifica l' allegato II del regolamento (CEE) n. 2054/76 relativo alla vendita,
    ai fini dell' esportazione verso i paesi terzi, di latte scremato in polvere detenuto
    dagli organismi d' intervento e destinato all' alimentazione degli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2413/78 van de Commissie van 17 oktober 1978 tot
    wijziging van de bijlage II van Verordening (EEG) nr. 2054/76 inzake de verkoop
    van magere-melkpoeder uit de voorraad van de interventiebureaus met het oog op
    uitvoer naar derde landen en bestemd voor diervoeding
