title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1483/2004 of 20 August 2004 supplementing
    the Annex to Regulation (EC) No 2400/96 on the entry of certain names in the Register
    of protected designations of origin and protected geographical indications («Carne
    de la Sierra de Guadarrama», «Ternera de Navarra» or «Nafarroako Aratxea»,
    «Carne de Vacuno del País Vasco» or «Euskal Okela», «Ternera Asturiana»
    and «Carne de Cantabria»)
  type: main
- language: fr
  script: Latn
