    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā»
    («Carne de la Sierra de Guadarrama», «Ternera de Navarra» vai «Nafarroako
    Aratxea», «Carne de Vacuno del País Vasco» vai «Euskal Okela», «Ternera
    Asturiana» un «Carne de Cantabria»)
  type: main
