title:
- language: en
  script: Latn
  content: '90/52/EEC: Commission Decision of 17 January 1990 authorizing Member States
    temporarily to take additional measures as regards Denmark against the dissemination
    of Corynebacterium sepedonicum and repealing Decision 88/36/EEC'
  type: main
- language: fr
  script: Latn
  content: '90/52/CEE: Décision de la Commission du 17 janvier 1990 autorisant les
    États membres à prendre provisoirement des mesures supplémentaires en vue de
    se protéger contre la propagation du Corynebacterium sepedonicum en provenance
    du Danemark et abrogeant la décision 88/36/CEE'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 17. Januar 1990 zur Ermaechtigung bestimmter
    Mitgliedstaaten, voruebergehend zusaetzliche Massnahmen gegen die Verbreitung
    von Corynebacterium sepedonicum gegenueber Daenemark zu treffen, und zur Aufhebung
    der Entscheidung 88/36/EWG (90/52/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 17. januar 1990 om bemyndigelse af medlemsstaterne
    til midlertidigt at traeffe supplerende foranstaltninger til beskyttelse mod spredning
    af Corynebacterium sepedonicum for saa vidt angaar Danmark samt om ophaevelse
    af Kommissionens beslutning 88/36/EOEF (90/52/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/52/ΕΟΚ: Απόφαση της Επιτροπής της 17ης Ιανουαρίου
    1990 που επιτρέπει προσωρινά σε ορισμένα κράτη
    μέλη να λάβουν συμπληρωματικά μέτρα κατά της
    εξάπλωσης του corynebacterium sepedonicum και που καταργεί
    την απόφαση 88/36/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 17 gennaio 1990 che autorizza alcuni Stati
    membri ad adottare, a titolo provvisorio, misure supplementari per cautelarsi
    contro la propagazione del Corynebacterium sepedonicum relativamente alla Danimarca
    e che abroga la decisione 88/36/CEE (90/52/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 17 januari 1990 houdende machtiging van
    de Lid-Staten om ten aanzien van Denemarken tijdelijk aanvullende maatregelen
    te nemen ten einde zich te beschermen tegen de verspreiding van Corynebacterium
    sepedonicum en tot intrekking van Beschikking 88/36/EEG (90/52/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 17 de Janeiro de 1990 que autoriza determinados
    Estados-membros a adoptar, temporariamente, medidas adicionais em relaçao à
    Dinamarca para se protegerem contra a introduçao do Corynebacterium sepedonicum
    e que revoga a Decisao 88/36/CEE (90/52/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 17 de enero de 1990 por la que se autoriza a
    los Estados miembros a adoptar provisionalmente medidas complementarias para protegerse
    de la introduccion del Corynebacterium sepedonicum procedente de Dinamarca y por
    la que se revoca la Decision 88/36/CEE (90/52/CEE)
  type: main
