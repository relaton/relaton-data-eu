title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2088/78 of 1 September 1978 re-establishing
    the levying of customs duties on methylamine and di- and trimethylamine, and their
    salts, falling within subheading 29.22 A I and originating in Romania, to which
    the preferential tariff arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2088/78 de la Commission, du 1er septembre 1978, portant
    rétablissement de la perception des droits de douane applicables à la mono-,
    di-, et triméthylamine et leurs sels, de la sous-position tarifaire 29.22 A I,
    originaires de la Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2088/78 der Kommission vom 1. September 1978 zur Wiedereinführung
    des Zollsatzes für Mono-, Di- und Trimethylamin und ihre Salze der Tarifstelle
    29.22 A I, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2088/78 af 1. september 1978 om genindførelse
    af opkrævning af toldafgifter for mono-, di- og trimethylamin samt salte deraf,
    under underposition 29.22 A I, som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2088/78 della Commissione, del 1 settembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alla mono-, di- e trimetilammina,
    e loro sali, della sottovoce doganale 29.22 A I, originaria della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2088/78 van de Commissie van 1 september 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op monomethylamine,
    dimethylamine en trimethylamine, alsmede zouten daarvan, van post 29.22 A I, van
    oorsprong uit Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad algemene tariefpreferenties werden geopend
  type: main
