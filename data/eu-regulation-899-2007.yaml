  content: Commission Regulation (EC) No 899/2007 of 27 July 2007 amending Regulation
    (EC) No 2037/2000 of the European Parliament and of the Council as regards the
    adjustment of CN codes for certain ozone depleting substances and mixtures containing
    ozone depleting substances to take account of amendments to the Combined Nomenclature
    laid down in Council Regulation (EEC) No 2658/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 899/2007 de la Commission du 27 juillet 2007 modifiant
