title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2484/74 of the Commission of 1 October 1974 re-establishing
    the levying of the customs duties on other kinds of leather, falling within subheading
    41.05 B II, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2484/74 de la Commission, du 1er octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux peaux préparées
    d'autres animaux, de la sous-position tarifaire 41.05 B II, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2484/74 der Kommission vom 1. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Leder aus Häuten oder Fellen von anderen Tieren, der Tarifstelle
    41.05 B II, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2484/74 af 1. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for læder af andre dyrehuder og dyreskind underposition
    41.05 B II, som har oprindelse i Jugoslavien, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2484/74 della Commissione, del 1 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle pelli preparate di
    altri animali, della sottovoce doganale n. 41.05 B II originarie della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2484/74 van de Commissie van 1 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op leder en
    voorgelooide huiden en vellen, van andere dieren van onderverdeling 41.05 B II,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
