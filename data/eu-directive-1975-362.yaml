title:
- language: en
  script: Latn
  content: Council Directive 75/362/EEC of 16 June 1975 concerning the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications in medicine,
    including measures to facilitate the effective exercise of the right of establishment
    and freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Directive 75/362/CEE du Conseil, du 16 juin 1975, visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres de médecin et comportant
    des mesures destinées à faciliter l'exercice effectif du droit d'établissement
    et de libre prestation de services
  type: main
- language: de
  script: Latn
  content: Richtlinie 75/362/EWG des Rates vom 16. Juni 1975 für die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    des Arztes und für Maßnahmen zur Erleichterung der tatsächlichen Ausübung
    des Niederlassungsrechts und des Rechts auf freien Dienstleistungsverkehr
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 75/362/EØF af 16. juni 1975 om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser for læger omfattende
    foranstaltninger, som skal lette den faktiske udøvelse af retten til etablering
    og fri udveksling af tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 75/362/ΕΟΚ του Συμβουλίου της 16ης Ιουνίου
    1975 περί αμοιβαίας αναγνωρίσεως των διπλωμάτων
    πιστοποιητικών και άλλων τίτλων ιατρικής και
    περί των μέτρων προς διευκόλυνση της πραγματικής
    ασκήσεως του δικαιώματος εγκαταστάσεως και
    του δικαιώματος της ελεύθερης παροχής υπηρεσιών
  type: main
- language: it
  script: Latn
  content: Direttiva 75/362/CEE del Consiglio, del 16 giugno 1975, concernente il
    reciproco riconoscimento dei diplomi, certificati ed altri titoli di medico e
    comportante misure destinate ad agevolare l'esercizio effettivo del diritto di
    stabilimento e di libera prestazione dei servizi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 75/362/EEG van de Raad van 16 juni 1975 inzake de onderlinge
    erkenning van de diploma' s certificaten en andere titels van de arts, tevens
    houdende maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van
    het recht van vestiging en vrij verrichten van diensten
  type: main
- language: pt
  script: Latn
  content: Directiva 75/362/CEE do Conselho, de 16 de Junho de 1975, que tem por objectivo
    o reconhecimento mútuo dos diplomas, certificados e outros títulos de médico
    e que inclui medidas destinadas a facilitar o exercício efectivo do direito de
    estabelecimento e da livre prestação de serviços
  type: main
- language: es
  script: Latn
  content: Directiva 75/362/CEE del Consejo, de 16 de junio de 1975, sobre reconocimiento
    mutuo de diplomas, certificados y otros títulos de médico, que contiene además
    medidas destinadas a facilitar el ejercicio efectivo del derecho de establecimiento
    y de libre prestación de servicios
  type: main
