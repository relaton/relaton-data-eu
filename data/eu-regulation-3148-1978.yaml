    taluni prodotti petroliferi raffinati in Turchia e che stabilisce una sorveglianza
    comunitaria sulle importazioni di tali prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3148/78 van de Raad van 21 december 1978 betreffende
