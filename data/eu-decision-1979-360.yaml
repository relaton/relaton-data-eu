title:
- language: en
  script: Latn
  content: '79/360/EEC: Commission Decision of 21 March 1979 authorizing the United
    Kingdom not to apply Community treatment to tents falling within heading No ex
    62.04 of the Common Customs Tariff (NIMEXE codes 62.04-23, 73) (category 91),
    originating in South Korea and in free circulation in the other Member States
    (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/360/CEE: Décision de la Commission, du 21 mars 1979, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tentes de la position ex
    62.04 du tarif douanier commun (codes Nimexe: 62.04-23, 73) catégorie 91, originaires
    de la Corée du Sud et mises en libre pratique dans les autres Etats membres (Le
    texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/360/EWG: Entscheidung der Kommission vom 21. März 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Zelte der Tarifnummer ex 62.04 des
    Gemeinsamen Zolltarifs (NIMEXE- Kodex 62.04-23; 73) (Kategorie 91) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/360/EØF: Kommissionens beslutning af 21. marts 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage telte, som
    henhører under pos. ex 62.04 i den fælles toldtarif (NIMEXE- nummer 62.04-23,
    73 ; kategori 91), har oprindelse i Sydkorea og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/360/CEE: Decisione della Commissione, del 21 marzo 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario le tende della voce ex
    62.04 della tariffa doganale comune (codice Nimexe 62.04-23, 73), categoria 91,
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/360/EEG: Beschikking van de Commissie van 21 maart 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd tenten, van post ex 62.04 van het gemeenschappelijk
    douanetarief (NIMEXE-code 62.04-23, 73) (categorie 91), van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
