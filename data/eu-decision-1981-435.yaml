  content: '81/435/EEC: Commission Decision of 8 May 1981 authorizing Member States
    to permit temporarily the marketing of forest reproductive material satisfying
    less stringent requirements'
  type: main
- language: fr
  script: Latn
  content: '81/435/CEE: Décision de la Commission, du 8 mai 1981, autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction soumis à des exigences réduites'
  type: main
- language: de
  script: Latn
  content: '81/435/EWG: Entscheidung der Kommission vom 8. Mai 1981 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut mit minderen Anforderungen
    zum Verkehr zuzulassen'
  type: main
- language: da
  script: Latn
  content: '81/435/EØF: Kommissionens beslutning af 8. maj 1981 om bemyndigelse til
    medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der opfylder mindre strenge krav'
  type: main
- language: el
  script: Grek
  content: '81/435/ΕΟΚ: Απόφαση τής Επιτροπής τής 8ης Μαΐου
