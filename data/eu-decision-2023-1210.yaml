    veränderte Baumwolle der Sorte 281-24-236 × 3006-210-23 enthalten, aus ihr bestehen
    oder aus ihr gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2023) 3940) (Nur
    der französische und der niederländische Text sind verbindlich)
  type: main
