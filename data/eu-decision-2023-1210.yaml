title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1210 of 21 June 2023 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified cotton 281-24-236 × 3006-210-23 pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2023) 3940) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1210 de la Commission du 21 juin 2023
    renouvelant l’autorisation de mise sur le marché de produits contenant du coton
    génétiquement modifié 281-24-236 × 3006-210-23, consistant en ce coton ou
    produits à partir de celui-ci, en application du règlement (CE) no 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2023) 3940]
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1210 der Kommission vom 21. Juni 2023
