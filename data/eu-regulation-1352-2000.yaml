title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1352/2000 of 27 June 2000 amending Regulation
    (EC) No 1758/98 increasing to 5 250 000 tonnes the quantity of wheat of breadmaking
    quality held by the French intervention agency for which a standing invitation
    to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1352/2000 de la Commission du 27 juin 2000 modifiant
    le règlement (CE) n° 1758/98 et portant à 5 250 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1352/2000 der Kommission vom 27. Juni 2000 zur Änderung
    der Verordnung (EG) Nr. 1758/98 und zur Erhöhung der Dauerausschreibung zur Ausfuhr
    von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 5 250 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1352/2000 af 27. juni 2000 om ændring
    af forordning (EF) nr. 1758/98 og om forhøjelse til 5 250 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1352/2000 της Επιτροπής,
    της 27ης Ιουνίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1758/98 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 5 250 000 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1352/2000, annettu 27 päivänä kesäkuuta 2000,
    asetuksen (EY) N:o 1758/98 muuttamisesta ja Ranskan interventioelimen hallussaan
    pitämän leipävehnän vientiä koskevan pysyvän tarjouskilpailun kohteena olevan
    määrän nostamisesta 5 250 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1352/2000 della Commissione, del 27 giugno 2000, che
    modifica il regolamento (CE) n. 1758/98 e che porta a 5 250 000 tonnellate il
    quantitativo globale oggetto della gara permanente per l'esportazione di frumento
    tenero panificabile detenuto dall'organismo d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1352/2000 van de Commissie van 27 juni 2000 tot wijziging
    van Verordening (EG) nr. 1758/98, teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de uitvoer van zachte tarwe van bakkwaliteit uit Franse
    interventievoorraden betrekking heeft, tot 5 250 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1352/2000 da Comissão, de 27 de Junho de 2000, que
    altera o Regulamento (CE) n.° 1758/98 e eleva a 5 250 000 toneladas o concurso
    permanente para a exportação de trigo mole panificável detido pelo organismo
    de intervenção francês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1352/2000 de la Comisión, de 27 de junio de 2000,
    por el que se modifica el Reglamento (CE) n° 1758/98 y se eleva a 5 250 000 toneladas
    la licitación permanente para la exportación de trigo blando panificable en
    poder del organismo de intervención francés
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1352/2000 av den 27 juni 2000 om ändring
    av förordning (EG) nr 1758/98 och om höjning till 5 250 000 ton av den stående
    anbudsinfordran för export av vete av brödkvalitet som innehas av det franska
    interventionsorganet
  type: main
