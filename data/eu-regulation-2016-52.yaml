---
id: EURegulation201652
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (Euratom) 2016/52 of 15 January 2016 laying down maximum
    permitted levels of radioactive contamination of food and feed following a nuclear
    accident or any other case of radiological emergency, and repealing Regulation
    (Euratom) No 3954/87 and Commission Regulations (Euratom) No 944/89 and (Euratom)
    No 770/90
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom) 2016/52 du Conseil du 15 janvier 2016 fixant les niveaux
    maximaux admissibles de contamination radioactive pour les denrées alimentaires
    et les aliments pour animaux après un accident nucléaire ou dans toute autre
    situation d'urgence radiologique, et abrogeant le règlement (Euratom) n° 3954/87
    et les règlements (Euratom) n° 944/89 et (Euratom) n° 770/90 de la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom) 2016/52 des Rates vom 15. Januar 2016 zur Festlegung
    von Höchstwerten an Radioaktivität in Lebens- und Futtermitteln im Falle eines
    nuklearen Unfalls oder eines anderen radiologischen Notfalls und zur Aufhebung
    der Verordnung (Euratom) Nr. 3954/87 des Rates und der Verordnungen (Euratom)
    Nr. 944/89 und (Euratom) Nr. 770/90 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент (Евратом) 2016/52 на Съвета от 15 януари
    2016 година за установяване на максимално допустимите
    нива на радиоактивно замърсяване на храните
    и фуражите след ядрена авария или друг случай
    на радиационна аварийна обстановка и за отмяна
    на Регламент (Евратом) № 3954/87 и регламенти (Евратом)
    № 944/89 и (Евратом) № 770/90 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (Euratom) 2016/52 ze dne 15. ledna 2016, kterým se stanoví
    nejvyšší přípustné úrovně radioaktivní kontaminace potravin a krmiv po
    jaderné havárii nebo jiném případu radiační mimořádné situace a zrušují
    nařízení (Euratom) č. 3954/87 a nařízení Komise (Euratom) č. 944/89 a
    (Euratom) č. 770/90
  type: main
- language: da
  script: Latn
  content: Rådets forordning (Euratom) 2016/52 af 15. januar 2016 om fastsættelse
    af de maksimalt tilladte niveauer for radioaktivitet i fødevarer og foder som
    følge af nukleare ulykker eller andre tilfælde af strålingsfare og om ophævelse
    af Rådets forordning (Euratom) nr. 3954/87 og Kommissionens forordning (Euratom)
    nr. 944/89 og (Euratom) nr. 770/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (Ευρατόμ) 2016/52 του Συμβουλίου,
    της 15ης Ιανουαρίου 2016, για τον καθορισμό μέγιστων
    επιτρεπτών επιπέδων ραδιορρύπανσης των τροφίμων
    και των ζωοτροφών κατόπιν πυρηνικού ατυχήματος
    ή άλλου έκτακτου ραδιολογικού συμβάντος και
    την κατάργηση του κανονισμού (Ευρατόμ) αριθ.
    3954/87 και των κανονισμών της Επιτροπής (Ευρατόμ)
    αριθ. 944/89 και (Ευρατόμ) αριθ. 770/90
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (Euratom) 2016/52, 15. jaanuar 2016, millega kehtestatakse
    toidu ja sööda radioaktiivse saastatuse lubatud piirmäärad tuumaavarii või
    muu kiirgusliku avariiolukorra puhul ning tunnistatakse kehtetuks määrus (Euratom)
    nr 3954/87 ja komisjoni määrused (Euratom) nr 944/89 ja (Euratom) nr 770/90
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (Euratom) 2016/52, annettu 15 päivänä tammikuuta 2016,
    elintarvikkeiden ja rehujen radioaktiivisen saastumisen sallituista enimmäistasoista
    ydinonnettomuuden tai muun säteilyhätätilanteen jälkeen ja neuvoston asetuksen
    (Euratom) N:o 3954/87 sekä komission asetusten (Euratom) N:o 944/89 ja (Euratom)
    N:o 770/90 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (Euratom) 2016/52 od 15. siječnja 2016. o utvrđivanju
    najviših dopuštenih razina radioaktivnog onečišćenja hrane i hrane za životinje
    nakon nuklearne nesreće ili bilo kojeg drugog slučaja radiološke opasnosti
    i o stavljanju izvan snage Uredbe (Euratom) br. 3954/87 i uredaba Komisije (Euratom)
    br. 944/89 i (Euratom) br. 770/90
  type: main
- language: hu
  script: Latn
  content: A Tanács (Euratom) 2016/52 rendelete (2016. január 15.) a nukleáris
    balesetet vagy egyéb radiológiai veszélyhelyzetet követően az élelmiszerek
    és a takarmányok radioaktív szennyezettsége maximális megengedett szintjeinek
    megállapításáról, valamint a 3954/87/Euratom rendelet, a 944/89/Euratom bizottsági
    rendelet és a 770/90/Euratom bizottsági rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom) 2016/52 del Consiglio, del 15 gennaio 2016, che fissa
    i livelli massimi ammissibili di radioattività per i prodotti alimentari e per
    gli alimenti per animali a seguito di un incidente nucleare o in qualsiasi altro
    caso di emergenza radiologica e che abroga il regolamento (Euratom) n. 3954/87
    del Consiglio e i regolamenti (Euratom) n. 944/89 e (Euratom) n. 770/90 della
    Commissione
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (Euratom) 2016/52 (2016. gada 15. janvāris), ar ko nosaka
    maksimālos pieļaujamos pārtikas un barības radioaktīvā piesārņojuma līmeņus
    pēc kodolavārijas vai jebkuras citas radiācijas avārijsituācijas un atceļ
    Padomes Regulu (Euratom) Nr. 3954/87 un Komisijas Regulas (Euratom) Nr. 944/89
    un (Euratom) Nr. 770/90
  type: main
- language: lt
  script: Latn
  content: 2016 m. sausio 15 d. Tarybos reglamentas (Euratomas) 2016/52, kuriuo nustatomi
    didžiausi leidžiami maisto produktų ir pašarų radioaktyviojo užterštumo
    po branduolinės ar radiologinės avarijos lygiai, ir panaikinamas Reglamentas
    (Euratomas) Nr. 3954/87 bei Komisijos reglamentai (Euratomas) Nr. 944/89 ir (Euratomas)
    Nr. 770/90
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (Euratom) 2016/52 tal-15 ta' Jannar 2016 li jistabbilixxi
    l-livelli massimi permissibbli ta' kontaminazzjoni radjuattiva ta' ikel u għalf
    wara inċident nukleari jew kwalunkwe każ ieħor ta' emerġenza radjoloġika,
    u li jħassar ir-Regolament tal-Kunsill (Euratom) Nru 3954/87 u r-Regolament tal-Kummissjoni
    (Euratom) Nru 944/89 u (Euratom) Nru 770/90
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom) 2016/52 van de Raad van 15 januari 2016 tot vaststelling
    van maximaal toelaatbare niveaus van radioactieve besmetting van levensmiddelen
    en diervoeders ten gevolge van een nucleair ongeval of ander stralingsgevaar en
    tot intrekking van Verordening (Euratom) nr. 3954/87 en de Verordeningen (Euratom)
    nr. 944/89 en (Euratom) nr. 770/90 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (Euratom) 2016/52 z dnia 15 stycznia 2016 r. określające
    maksymalne dozwolone poziomy skażenia promieniotwórczego żywności i pasz po
    awarii jądrowej lub w innym przypadku zdarzenia radiacyjnego oraz uchylające
    rozporządzenie (Euratom) nr 3954/87 oraz rozporządzenia Komisji (Euratom) nr
    944/89 i (Euratom) nr 770/90
  type: main
- language: pt
  script: Latn
  content: Regulamento (Euratom) 2016/52 do Conselho, de 15 de janeiro de 2016, que
    fixa os níveis máximos admissíveis de contaminação radioativa dos géneros
    alimentícios e dos alimentos para animais na sequência de um acidente nuclear
    ou de qualquer outro caso de emergência radiológica e que revoga o Regulamento
    (Euratom) n.° 3954/87 e os Regulamentos (Euratom) n.° 944/89 e n.° 770/90 da
    Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul (Euratom) 2016/52 al Consiliului din 15 ianuarie 2016 de stabilire
    a nivelurilor maxime permise de contaminare radioactivă a alimentelor și furajelor
    în urma unui accident nuclear sau a oricărui alt caz de urgență radiologică
    și de abrogare a Regulamentului (Euratom) nr. 3954/87 al Consiliului și a Regulamentelor
    (Euratom) nr. 944/89 și (Euratom) nr. 770/90 ale Comisiei
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (Euratom) 2016/52 z 15. januára 2016, ktorým sa stanovujú
    najvyššie prípustné hodnoty rádioaktívnej kontaminácie v potravinách a
    krmivách spôsobenej jadrovou haváriou alebo iným prípadom radiačného ohrozenia
    a ktorým sa zrušuje nariadenie Rady (Euratom) č. 3954/87 a nariadenia Komisie
    (Euratom) č. 944/89 a (Euratom) č. 770/90
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (Euratom) 2016/52 z dne 15. januarja 2016 o najvišjih dovoljenih
    stopnjah radioaktivnega onesnaženja živil in krme po jedrski nesreči ali katerem
    koli drugem radiološkem izrednem dogodku in razveljavitvi Uredbe (Euratom) št.
    3954/87 ter uredb Komisije (Euratom) št. 944/89 in (Euratom) št. 770/90
  type: main
- language: es
  script: Latn
  content: Reglamento (Euratom) 2016/52 del Consejo, de 15 de enero de 2016, por el
    que se establecen tolerancias máximas de contaminación radiactiva de los alimentos
    y los piensos tras un accidente nuclear o cualquier otro caso de emergencia radiológica,
    y se derogan el Reglamento (Euratom) n° 3954/87 del Consejo y los Reglamentos
    (Euratom) n° 944/89 y (Euratom) n° 770/90 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (Euratom) 2016/52 av den 15 januari 2016 om gränsvärden
    för radioaktiva ämnen i livsmedel och foder efter en kärnenergiolycka eller
    annan radiologisk nödsituation och om upphävande av rådets förordning (Euratom)
    nr 3954/87 och kommissionens förordningar (Euratom) nr 944/89 och (Euratom) nr
    770/90
