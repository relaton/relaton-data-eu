  content: '91/78/EEC: Commission Decision of 4 February 1991 approving measures to
    set up pilot projects for the control of rabies with a view to its eradication
    or prevention, presented by Italy (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/78/CEE: Décision de la Commission, du 4 février 1991, approuvant
    des actions visant à l''établissement de projets pilotes destinés à lutter
    contre la rage en vue de son éradication ou de sa prévention présentés par
    l''Italie (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '91/78/EWG: Entscheidung der Kommission vom 4. Februar 1991 zur Genehmigung
    von Maßnahmen zur Aufstellung der von Italien vorgelegten Pilotprogramme zur
    Tilgung oder Verhütung der Tollwut (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/78/EØF: Kommissionens beslutning af 4. februar 1991 om godkendelse
