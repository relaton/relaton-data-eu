---
id: EUDecision1973111
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 30 April 1973 authorizing the French Government
    not to apply Community treatment to portable electric battery and magneto lamps
    falling within heading No 85.10 B of the Common Customs Tariff, originating in
    Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 avril 1973, autorisant la République
    française à exclure du traitement communautaire les lampes électriques portatives
    destinées à fonctionner au moyen de leur propre source d'énergie (à piles,
    à accumulateurs, électromagnétiques, etc.), de la position 85.10 B du Tarif
    douanier commun, originaires de Hong-Kong et mises en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. April 1973, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche tragbare elektrische Leuchten zum Betrieb mit eigener
    Stromquelle (z. B. Primärbatterien, Akkumulatoren oder Dynamo) der Tarifnummer
    85.10 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. april 1973 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage lommelygter, håndlygter og
    lignende transportable batteri- og dynamolygter, som henhører under position
    85.10 B i den fælles toldtarif, har oprindelse i Hong Kong og overgår til fri
    omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 aprile 1973, che autorizza le Repubblica
    francese ad escludere dal trattamento comunitario le lampade elettriche portatili
    destinate a funzionare a mezzo di una propria sorgente di energia (a pile, ad
    accumulatori, elettromagnetiche, ecc.) della voce n. 85.10 B della tariffa doganale
    comune, originari di Hong Kong e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 april 1973 waarbij de Franse Republiek
    wordt gemachtigd draagbare elektrische lampen, bestemd om met eigen energiebron
    te werken (met elementen of batterijen, met accumulatoren, met ingebouwde dynamo,
    enz.), van post 85.10 B van het gemeenschappelijk douanetarief, van oorsprong
    uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten
  type: main
