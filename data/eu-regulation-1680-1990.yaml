title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1680/90 of 21 June 1990 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of boneless beef held by certain
    intervention agencies and intended for export, amending Regulation (EEC) No 569/88
    and repealing Regulation (EEC) No 1167/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1680/90 de la Commission du 21 juin 1990 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines désossées détenues par certains organismes d'intervention
    et destinées à être exportées, modifiant le règlement (CEE) n° 569/88 et
    abrogeant le règlement (CEE) n° 1167/90
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1680/90 DER KOMMISSION vom 21. Juni 1990 ueber den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch ohne Knochen aus Interventionsbestaenden
    nach der Verordnung (EWG) Nr. 2539/84, zur Aenderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 1167/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1680/90 af 21. juni 1990 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af udbenet oksekød fra visse interventionsorganer
    med henblik på udførsel, om ændring af forordning (EØF) nr. 569/88 og om ophævelse
    af forordning (EØF) nr. 1137/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1680/90 της Επιτροπής
    της 21ης Ιουνίου 1990 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, αποστεωμένου βοείου κρέατος
    που κρατείται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται να εξαχθεί καθώς και σχετικά
    με την τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    569/88 και την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    1167/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1680/90 DELLA COMMISSIONE del 21 giugno 1990 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine disossate detenute da taluni organismi d'intervento e destinate
    ad essere esportate, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 1167/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1680/90 VAN DE COMMISSIE van 21 juni 1990 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    zonder been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking
    van Verordening (EEG) nr. 1167/90
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1680/90 DA COMISSAO de 21 de Junho de 1990 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) n* 2539/84, de
    carne de bovino desossada detida por certos organismos de intervençao e destinada
    a ser exportada, que altera o Regulamento (CEE) n* 569/88 e que revoga o Regulamento
    (CEE) n* 1167/90
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1680/90 DE LA COMISION de 21 de junio de 1990 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno deshuesadas en poder de determinados organismos de intervencion
    y destinadas a ser exportadas y por el que se modifica el Reglamento (CEE) no
    569/88 y se deroga el Reglamento (CEE) no 1167/90
  type: main
