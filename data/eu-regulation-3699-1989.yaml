title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3699/89 of 11 December 1989 establishing
    for 1990 the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3699/89 de la Commission du 11 décembre 1989 établissant
    pour 1990 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3699/89 DER KOMMISSION vom 11. Dezember 1989 zur Festlegung
    der Liste fuer 1990 der Schiffe mit einer Laenge ueber alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlaenge
    mehr als 9 m betraegt, auf Seezunge fischen duerfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3699/89 af 11. december 1989 om listen
    for 1990 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3699/89 της Επιτροπής
    της 11ης Δεκεμβρίου 1989 που καταρτίζει, για το
    1990, τον κατάλογο των σκαφών συνολικού μήκους
    άνω των οκτώ μέτρων τα οποία επιτρέπεται να
    αλιεύουν γλώσσες σε ορισμένες περιοχές της
    Κοινότητας χρησιμοποιώντας δοκότρατες των
    οποίων το συνολικό μήκος υπερβαίνει τα εννέα
    μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3699/89 DELLA COMMISSIONE dell'11 dicembre 1989 che
    fissa per il 1990 l'elenco dei pescherecci di lunghezza fuori tutto superiore
    a 8 m, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi 9 m
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3699/89 VAN DE COMMISSIE van 11 december 1989 tot
    vaststelling van de voor 1990 geldende lijst van vaartuigen met een lengte over
    alles van meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren
    waarvan de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3699/89 DA COMISSÃO de 11 de Dezembro de 1989 que
    estabelece para 1990 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3699/89 DE LA COMISION de 11 de diciembre de 1989 por
    el que se establece para 1990 la lista de barcos cuya eslora total excede los
    ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
