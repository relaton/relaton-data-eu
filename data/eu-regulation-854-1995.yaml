  content: COMMISSION REGULATION (EC) No 854/95 of 19 April 1995 determining the extent
    to which applications lodged in April 1995 for import certificates for certain
    cheeses covered by the arrangements provided for in the Interim Agreements concluded
    by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 854/95 DE LA COMMISSION du 19 avril 1995 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1995 pour certains fromages dans le cadre du régime prévu par les accords
    intérimaires conclus par la Communauté avec la Bulgarie et la Roumanie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 854/95 DER KOMMISSION vom 19. April 1995 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im April
    1995 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 854/95 af 19. april 1995 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i april 1995 for
    visse oste kan imødekommes under den ordning, der er fastsat i interimsaftalerne
    mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 854/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Απριλίου 1995 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    τον Απρίλιο 1995 για ορισμένα τυριά στα πλαίσια
    του καθεστώτος που προβλέπεται από τις προσωρινές
    συμφωνίες που έχουν συναφθεί από την Κοινότητα
    με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 854/95, annettu 19 päivänä huhtikuuta 1995,
