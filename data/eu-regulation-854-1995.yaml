    dagli accordi interinali conclusi tra la Comunità e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 854/95 VAN DE COMMISSIE van 19 april 1995 tot vaststelling
