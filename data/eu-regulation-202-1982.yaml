    τού κανονισμού (EOK) αριθ. 2730/79 περί τών κοινών
    λεπτομερειών εφαρμογής τού καθεστώτος επιστροφών
    κατά τήν εξαγωγή γιά τά γεωργικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 202/82 della Commissione, del 28 gennaio 1982, recante
