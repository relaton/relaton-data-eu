title:
- language: en
  script: Latn
  content: '84/649/EEC: Commission Decision of 21 December 1984 accepting an undertaking
    given in connection with the anti-dumping investigation concerning imports of
    oxalic acid originating in Brazil and terminating the investigation as regards
    the exporter concerned'
  type: main
- language: fr
  script: Latn
  content: '84/649/CEE: Décision de la Commission du 21 décembre 1984 portant acceptation
    d'' un engagement souscrit dans le cadre de l'' enquête antidumping concernant
    les importations d'' acide oxalique originaire du Brésil et portant clôture
    de l'' enquête à l'' égard de l'' exportateur concerné'
  type: main
- language: de
  script: Latn
  content: '84/649/EWG: Beschluß der Kommission vom 21. Dezember 1984 über die Annahme
    einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhr
    von Oxalsäure mit Ursprung in Brasilien und über die Einstellung des Verfahrens
    hinsichtlich des betroffenen Ausführers'
  type: main
- language: da
  script: Latn
  content: '84/649/EØF: Kommissionens beslutning af 21. december 1984 om godtagelse
    af pristilsagn i forbindelse med antidumpingproceduren vedrørende importen af
    oxalsyre med oprindelse i Brasilien og om afslutning af denne procedure for den
    pågældende eksportørs vedkommende'
  type: main
- language: el
  script: Grek
  content: '84/649/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 για την αποδοχή ανάληψης υποχρέωσης
    που έχει προταθεί όσον αφορά τη διαδικασία
    αντιντάμπινγκ σχετικά με τις εισαγωγές οξαλικού
    οξέος καταγωγής Βραζιλίας και για την περάτωση
    της έρευνας όσον αφορά τον ενδιαφερόμενο εξαγωγέα'
  type: main
- language: it
  script: Latn
  content: '84/649/CEE: Decisione della Commissione del 21 dicembre 1984 che accetta
    l'' impegno assunto nell'' ambito dell'' inchiesta antidumping relativa alle importazioni
    di acido ossalico originario del Brasile e chiude tale inchiesta nei confronti
    dell'' esportatore interessato'
  type: main
- language: nl
  script: Latn
  content: '84/649/EEG: Besluit van de Commissie van 21 december 1984 houdende de
    aanvaarding van een in verband met het anti-dumpingonderzoek betreffende de invoer
    van oxaalzuur, van oorsprong uit Brazilië aangeboden verbintenis en de beëindiging
    van het onderzoek ten aanzien van de betrokken exporteur'
  type: main
