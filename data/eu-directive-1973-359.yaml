  script: Latn
  content: RICHTLINIE DES RATES VOM 19. NOVEMBER 1973 ZUR ERGAENZUNG DER RICHTLINIE
    BETREFFEND DIE VON DEN MITGLIEDSTAATEN DURCHZUFUEHRENDEN ERHEBUNGEN UEBER DIE
    SCHWEINEERZEUGUNG INFOLGE DER ERWEITERUNG DER GEMEINSCHAFT
  type: main
