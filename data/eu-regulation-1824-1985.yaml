title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1824/85 of 1 July 1985 re-establishing the
    levying of customs duties on articles of apparel and clothing accessories falling
    within subheading 39.07 B V ex d) originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1824/85 de la Commission du 1er juillet 1985 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement, de la sous-position tarifaire 39.07 B V ex d) du
    tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1824/85 der Kommission vom 1. Juli 1985 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör der Tarifstelle
    39.07 B V ex d) mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1824/85 af 1. juli 1985 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil henhørende
    under pos. 39.07 B V ex d og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1824/85 της Επιτροπής
    της 1ης Ιουλίου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ενδύματα και εξαρτήματα
    του ενδύματος, της διακρίσεως 39.07 B V ex δ) του
    Κοινού Δασμολογίου, καταγωγής Χονγκ Κονγκ,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1824/85 della Commissione del 1o luglio 1985 che ripristina
    la riscossione dei dazi doganali applicabili agli oggetti da vestiario e agli
    accessori per oggetti da vestiario della sottovoce 39.07 B V ex d della tariffa
    doganale comune, originari di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1824/85 van de Commissie van 1 juli 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren van postonderverdeling 39.07 B V ex d), van oorsprong uit Hong
    Kong, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
