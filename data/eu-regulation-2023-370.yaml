  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/370 felhatalmazáson alapuló rendelete (2022. december
    13.) az (EU) 2021/2115 európai parlamenti és tanácsi rendeletnek a KAP stratégiai
    tervek módosítása iránt a tagállamok által benyújtott kérelmekre vonatkozó
    eljárások és határidők, továbbá a KAP stratégiai tervek módosításainak
    maximális száma szempontjából kivételt jelentő esetek tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/370 della Commissione del 13 dicembre 2022
    che integra il regolamento (UE) 2021/2115 del Parlamento europeo e del Consiglio
    per quanto riguarda le procedure, i termini di presentazione da parte degli Stati
    membri delle domande di modifica dei piani strategici della PAC e gli ulteriori
    casi per i quali non si applica il numero massimo di modifiche dei piani strategici
    della PAC che possono essere presentate ogni anno civile
  type: main
- language: lv
  script: Latn
