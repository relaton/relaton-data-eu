    des Rates bezüglich der Verfahren und Fristen für die Einreichung von Anträgen
    auf Änderung von GAP-Strategieplänen durch die Mitgliedstaaten und weiterer
    Fälle, in denen die Höchstzahl der Änderungen von GAP-Strategieplänen nicht
    gilt
  type: main
