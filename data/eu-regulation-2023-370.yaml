  script: Latn
  content: Commission Delegated Regulation (EU) 2023/370 of 13 December 2022 supplementing
    Regulation (EU) 2021/2115 of the European Parliament and of the Council with regard
    to procedures, time limits for submission by Member States of requests for amendments
    of CAP Strategic Plans, and further cases for which the maximum number of amendments
    of CAP Strategic Plans does not apply
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/370 de la Commission du 13 décembre 2022
    complétant le règlement (UE) 2021/2115 du Parlement européen et du Conseil
    en ce qui concerne les procédures, les délais de présentation par les États
    membres des demandes de modification des plans stratégiques relevant de la PAC
    et les autres cas pour lesquels le nombre maximal de modifications desdits plans
    ne s’applique pas
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/370 der Kommission vom 13. Dezember 2022
