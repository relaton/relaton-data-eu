    gevallen waarvoor het maximumaantal wijzigingen van de strategische GLB-plannen
    niet geldt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/370 z dnia 13 grudnia 2022
