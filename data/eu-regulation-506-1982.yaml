title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 506/82 of 2 March 1982 re-establishing the
    levying of customs duties on elastic fibres and trimmings (other than knitted
    or crocheted goods), products of category 105 (code 1050) and originating in Thailand,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 506/82 de la Commission, du 2 mars 1982, portant rétablissement
    de la perception des droits de douane applicables aux tissus (autres que de bonneterie)
    élastiques, de la catégorie de produits n° 105 (code 1050), originaires de
    Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 506/82 der Kommission vom 2. März 1982 über die
    Wiedereinführung des Zollsatzes für gummielastische Gewebe, ausgenommen Gewirke,
    der Warenkategorie Nr. 105 (Kennziffer 1050), mit Ursprung in Thailand, dem die
    in der Verordnung (EWG) Nr. 3602/81 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 506/82 af 2. marts 1982 om genindførelse
    af opkrævning af toldafgifter for elastiske tekstilstoffer (undtagen trikotagestof)
    under kategori 105 (1050), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 506/82 τής Επιτροπής τής
    2ας Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά τά υφάσματα (έτερα τών
    πλεκτών) ελαστικά τής κατηγορίας 105 (κώδικας
    1050), καταγωγής Ταϋλάνδης, δικαιούχου τών προβλεπομένωνστόν
    κανονισμό (EOK) αριθ. 3602/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 506/82 della Commissione, del 2 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti (diversi da quelli a maglia)
    elastici, della categoria di prodotti n. 105 (codice 1050), originari della Tailandia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3602/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 506/82 van de Commissie van 2 maart 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elastische
    weefsels (met uitzondering van brei- en haakwerk) van de categorie produkten nr.
    105 (codenummer 1050), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3602/81 van de Raad
  type: main
