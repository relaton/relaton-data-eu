    produits du secteur de la viande bovine pouvant faire l' objet d' achats à l'
    intervention dans certains États membres ainsi que leurs coefficients
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2134/80 der Kommission vom 8. August 1980 zur Änderung
