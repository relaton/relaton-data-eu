    σε πτητική οξύτητα ορισμένων οίνων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 693/96, annettu 17 päivänä huhtikuuta 1996,
    poikkeamista tiettyjen viinien haihtuvaa happoisuutta koskevista säännöksistä
    annetun asetuksen (ETY) N:o 586/93 muuttamisesta neljännen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 693/96 della Commissione, del 17 aprile 1996, recante
    quarta modifica del regolamento (CEE) n. 586/93 recante deroga a talune disposizioni
    in materia di tenore di acidità volatile di taluni vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 693/96 van de Commissie van 17 april 1996 houdende
    vierde wijziging van Verordening (EEG) nr. 586/93 houdende afwijking van de bepalingen
    inzake het gehalte aan vluchtige zuren van bepaalde wijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 693/96 da Comissão, de 17 de Abril de 1996, que altera
    pela quarta vez o Regulamento (CEE) nº 586/93 que derroga determinadas disposições
    em matéria de teor de acidez volátil de determinados vinhos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 693/96 de la Comisión, de 17 de abril de 1996, por
