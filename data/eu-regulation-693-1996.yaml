    über den Gehalt an flüchtiger Säure bei bestimmten Weinen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 693/96 af 17. april 1996 om fjerde ændring
    af forordning (EØF) nr. 586/93 om undtagelse fra visse bestemmelser om indholdet
    af flygtig syre i visse vine
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 693/96 της Επιτροπής,
