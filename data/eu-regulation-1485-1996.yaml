  script: Latn
  content: Commission Regulation (EC) No 1485/96 of 26 July 1996 laying down detailed
    rules for the application of Council Directive 92/109/EEC, as regards customer
    declarations of specific use relating to certain substances used in the illicit
    manufacture of narcotic drugs and psychotropic substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1485/96 de la Commission du 26 juillet 1996 portant
    modalités d'application de la directive 92/109/CEE du Conseil en ce qui concerne
    les déclarations du client qui spécifient les usages de certaines substances
    utilisées dans la fabrication illicite de stupéfiants et de substances psychotropes
  type: main
- language: de
  script: Latn
