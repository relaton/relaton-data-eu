title:
- language: fr
  script: Latn
  content: Décision 66/461/CEE de la Commission, du 20 juillet 1966, portant nouvelle
    modification de ses décisions, arrêtée en application de la décision du Conseil
    du 4 avril 1962, autorisant certains États membres à percevoir des taxes compensatoires
    sur les importations de certaines marchandises contenant du sucre en provenance
    des autres États membres
  type: main
- language: de
  script: Latn
  content: '66/461/EWG: Entscheidung der Kommission vom 20. Juli 1966 über die erneute
    Änderung ihrer Entscheidungen in Anwendung des Ratsbeschlusses vom 4. April 1962
    über die Ermächtigung verschiedener Mitgliedstaaten zur Erhebung von Ausgleichsabgaben
    auf Einfuhren von bestimmten Waren mit Zuckergehalt aus den anderen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '66/461/CEE: Decisione della Commissione, del 20 luglio 1966, che modifica
    nuovamente le decisioni prese in applicazione della decisione del Consiglio del
    4 aprile 1962, che autorizza alcuni Stati membri a riscuotere tasse di compensazione
    sulle importazioni di alcuni prodotti incorporanti zucchero da altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/461/EEG: Beschikking van de Commissie van 20 juli 1966 houdende nieuwe
    wijziging van haar met toepassing van het besluit van de Raad van 4 april 1962
    gegeven beschikkingen, waarbij bepaalde Lid-Staten gemachtigd werden compenserende
    heffingen te leggen op de invoer van bepaalde suikerhoudende goederen uit de overige
    Lid- Staten'
  type: main
