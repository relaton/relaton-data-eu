id: EUDecision1975718
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 June 1975 authorizing the Italian Republic not
    to apply Community treatment to bed linen, table linen, toilet linen and kitchen
    linen, curtains and other furnishing articles falling within heading No 62.02
    of the Common Customs Tariff, originating in the People's Republic of China and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/718/CEE: Décision de la Commission, du 12 juin 1975, autorisant la
    République italienne à exclure du traitement communautaire le linge de lit,
    de table, de toilette, d''office et de cuisine ; les rideaux, les vitrages et
    les autres articles d''ameublement, de la position 62.02 du Tarif douanier commun,
    originaires de la République populaire de Chine et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Juni 1975, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Bettwäsche, Tischwäsche, Wäsche
    zur Körperpflege und andere Haushaltswäsche, Vorhänge, Gardinen und andere
    Gegenstände zur Innenausstattung, der Tarifnummer 62.02 des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 12. juni 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage sengelinned, dækketøj, håndklæder,
    vaskeklude og viskestykker, gardiner og andre boligtekstiler, som henhører under
    pos. 62.02 i den fælles toldtarif, har oprindelse i folkerepublikken Kina og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 giugno 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario la biancheria da letto, da tavola,
    da toeletta, da servizio e da cucina; le tende, le tendine ed altri manufatti
    per l'arredamento della voce 62.02 della tariffa doganale comune, originari della
    Repubblica popolare cinese, e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 juni 1975 waarbij de Italiaanse Republiek
    wordt gemachtigd tafel-, bedde- en huishoudlinnen, gordijnen, vitrages en andere
    artikelen, voor stoffering, van post 62.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
