    neist valmistatud tooteid (teatavaks tehtud numbri C(2016) 204 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/87, annettu 22 päivänä
    tammikuuta 2016, olemassa olevien MON 863 (MON-ØØ 863–5) -johdannaistuotteiden
    poistamisesta markkinoilta ja muuntogeenistä maissia MON863×MON810×NK603 (MON-ØØ863-5×MON-ØØ81Ø-6×MON-ØØ6Ø3-6),
    MON863×MON810 (MON-ØØ863-5×MON-ØØ81Ø-6) ja MON863×NK603 (MON-ØØ863-5×MON-ØØ6Ø3-6)
    sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille
    saattamisen sallimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti annettujen komission päätösten 2010/139/EU, 2010/140/EU
    ja 2010/141/EU kumoamisesta (tiedoksiannettu numerolla C(2016) 204)
  type: main
