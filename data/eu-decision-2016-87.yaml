title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/87 of 22 January 2016 on the
    withdrawal from the market of existing products derived from MON 863 (MON-ØØ863-5)
    and repealing Decisions 2010/139/EU, 2010/140/EU, 2010/141/EU authorising the
    placing on the market of products containing, consisting of, or produced from
    genetically modified maize MON863×MON810×NK603 (MON-ØØ863-5×MON-ØØ81Ø-6×MON-ØØ6Ø3-6),
    MON863×MON810 (MON-ØØ863-5×MON-ØØ81Ø-6) and MON863×NK603 (MON-ØØ863-5×MON-ØØ6Ø3-6)
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2016) 204)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/87 de la Commission du 22 janvier 2016
    concernant le retrait du marché des produits existants dérivés du maïs MON
    863 (MON-ØØ863-5) et abrogeant les décisions 2010/139/UE, 2010/140/UE, 2010/141/UE
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON863×MON810×NK603 (MONØØ863-5×MON-ØØ81Ø-6×MON-ØØ6Ø3-6),
    MON863×MON810 (MON-ØØ863-5×MON-ØØ81Ø-6) et MON863×NK603 (MON-ØØ863-5×MON-ØØ6Ø3-6),
    en application du règlement (CE) n° 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2016) 204]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/87 der Kommission vom 22. Januar 2016
    über die Rücknahme bereits existierender Erzeugnisse, die aus MON 863 (MON-ØØ863-5)
