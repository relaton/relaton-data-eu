    a röntgen-képerősítők fotokatódjainak gyártásához 2019. december 31-ig
    használt alkáliadagolókban és az uniós piacon 2020. január 1. előtt forgalomba
    hozott röntgen-képerősítők cserealkatrészeiben alkalmazott hat vegyértékű
