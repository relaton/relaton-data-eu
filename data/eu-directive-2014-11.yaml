    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на шествалентен
    хром в дозаторите на алкални метали, използвани
    за изработването на фотокатоди за усилватели
    на рентгенови изображения до 31 декември 2019
    г. , както и в резервни части за рентгенови системи,
    пуснати на пазара в ЕС преди 1 януари 2020 г.
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/11/EU ze dne 18. října
    2013 , kterou se pro účely přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    šestimocný chrom v alkalických dávkovačích používaných k výrobě fotokatod
    zesilovačů obrazu pro rentgenové snímkování do 31. prosince 2019 a v náhradních
    dílech pro rentgenové systémy uvedené na trh EU před 1. lednem 2020
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/11/EU af 18. oktober 2013 om tilpasning
