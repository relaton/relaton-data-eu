    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    cromul hexavalent din dozatoarele de substanțe alcaline utilizate pentru fabricarea
    fotocatozilor din amplificatoarele de imagine pentru imagini radiologice, până
