  script: Latn
  content: Direttiva delegata 2014/11/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa al cromo esavalente nei diffusori di sostanze alcaline utilizzati per
    creare fotocatodi negli amplificatori di immagini radiografiche fino al 31 dicembre
    2019 e nei pezzi di ricambio per sistemi radiografici immessi sul mercato unionale
    prima del 1 °gennaio 2020
  type: main
