    een vrijstelling voor zeswaardig chroom in alkalidispensers voor fotokathoden
    in röntgenbeeldversterkers tot en met 31 december 2019 en in reserveonderdelen
    voor vóór 1 januari 2020 in de EU in de handel gebrachte röntgensystemen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/11/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    sześciowartościowego chromu stosowanego przy nakładaniu warstwy metali alkalicznych
    w procesie wytwarzania fotokatod we wzmacniaczach obrazu RTG do dnia 31 grudnia
    2019 r. i w częściach zamiennych do systemów RTG wprowadzonych do obrotu na
    rynku UE przed dniem 1 stycznia 2020 r.
  type: main
- language: pt
  script: Latn
