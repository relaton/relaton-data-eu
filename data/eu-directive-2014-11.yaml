  script: Latn
  content: Delegirana direktiva Komisije 2014/11/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za heksavalentni krom u alkalijskim
    raspršivačima koji se upotrebljavaju za izradu fotokatoda u pojačalima rendgenskih
    snimaka do 31. prosinca 2019. , i u zamjenskim dijelovima za rendgenske sustave
    koji su stavljeni na tržište Europske unije prije 1. siječnja 2020 .
  type: main
