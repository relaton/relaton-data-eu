title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/11/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, the Annex IV to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for hexavalent chromium in alkali dispensers used to create photocathodes in X-ray
    image intensifiers until 31 December 2019 and in spare parts for X-ray systems
    placed on the EU market before 1 January 2020
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/11/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le chrome hexavalent dans les générateurs alcalins utilisés pour fabriquer
    les photocathodes des amplificateurs de luminance d’images radiologiques jusqu’au
    31 décembre 2019 et dans les pièces détachées pour systèmes de radiologie
    mis sur le marché de l’Union européenne avant le 1 er janvier 2020
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/11/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für sechswertiges Chrom in Alkali-Dispensern zur Verwendung bei
    der Herstellung von Fotokathoden in Röntgenbildverstärkern bis zum 31. Dezember
    2019 und in Ersatzteilen für vor dem 1. Januar 2020 in der EU in den Verkehr
    gebrachte Röntgenanlagen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/11/ЕС на Комисията
