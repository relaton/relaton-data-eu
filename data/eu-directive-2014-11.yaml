    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal kromju eżavalenti fid-dispensaturi tal-alkali użati għall-ħolqien
    tal-fotokatodi fl-intensifikaturi tal-immaġnijiet bir-raġġi X sal- 31 ta’
    Diċembru 2019 u fil-parts ta’ sostituzzjoni għas-sistemi bir-raġġi X imqiegħda
    fis-suq tal-UE qabel l- 1 ta’ Jannar 2020
  type: main
