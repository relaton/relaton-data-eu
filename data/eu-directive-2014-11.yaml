    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para a utilização de crómio hexavalente em geradores de metais alcalinos utilizados
    para criar fotocátodos em intensificadores de imagens de raios X, até 31 de
    dezembro de 2019 , e em peças sobresselentes de sistemas de raios X colocados
    no mercado da UE antes de 1 de janeiro de 2020
  type: main
