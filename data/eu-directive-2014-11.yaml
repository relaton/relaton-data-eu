    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    kuudenarvoista kromia alkaliannostelijoissa, joita käytetään valokatodien valmistamiseen
    röntgenlaitteiden kuvanvahvistimissa, 31 päivään joulukuuta 2019 saakka, ja
    röntgenjärjestelmien varaosissa, jotka saatetaan EU:n markkinoille ennen 1 päivää
    tammikuuta 2020
  type: main
