title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1653/86 of 26 May 1986 opening for 1986, as
    an autonomous measure, a special import quota for high quality, fresh, chilled
    or frozen beef and veal falling within subheadings 02.01 A II a) and 02.01 A II
    b) of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
