    dovozmi integrovaných elektronických kompaktných žiariviek (CFL-i) zasielaných
    z Vietnamu, Pakistanu alebo Filipín, ktoré majú alebo nemajú deklarovaný
    pôvod vo Vietname, Pakistane alebo na Filipínach, čím takéto dovozy podliehajú
    registrácii
  type: main
