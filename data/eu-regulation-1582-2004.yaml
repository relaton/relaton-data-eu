    pärinevate kompaktluminofoorlampide (CFL) impordile kehtestatud dumpinguvastastest
    meetmetest võimaliku kõrvalehoidmise suhtes, mis toimub Vietnamist, Pakistanist
    või Filipiinidelt saadetud kompaktluminofoorlampide (CFL), deklareeritud Vietnami,
    Pakistani või Filipiinide tootena või mitte, importimise teel, ning kehtestatakse
    nimetatud impordi registreerimise kohustuslikkus
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1582/2004, annettu 8 päivänä syyskuuta 2004,
    Kiinan kansantasavallasta peräisin olevien integroitujen elektronisten pienloistelamppujen
    tuonnissa neuvoston asetuksella (EY) N:o 1470/2001 käyttöön otettujen polkumyyntitoimenpiteiden
    mahdollista kiertämistä Vietnamista, Pakistanista tai Filippiineiltä lähetettyjen
    integroitujen elektronisten pienloistelamppujen tuonnilla, riippumatta siitä,
    onko niiden alkuperämaaksi ilmoitettu Vietnam, Pakistan tai Filippiinit, koskevan
    tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1582/2004/EK rendelete (2004. szeptember 8.) vizsgálat kezdeményezéséről
    az integrált elektronikus kompakt fénycsöveknek (CFL-i) a Kínai Népköztársaságból
    származó behozatalára megállapított dömpingellenes intézkedésekről szóló,
    1470/2001/EK tanácsi rendelet esetleges megkerüléséről az integrált elektronikus
    kompakt fénycsövek (CFL-i) importjának Vietnamból, Pakisztánból vagy a Fülöp-szigetekről
    történő behozatala révén, akár Vietnamból, Pakisztánból vagy a Fülöp-szigetekről
    származókként tüntették fel ezeket, akár nem, és az ilyen behozatal feljegyzésének
    elrendeléséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1582/2004 della Commissione, dell’8 settembre 2004,
    che apre un'inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento (CE) n. 1470/2001 del Consiglio sulle importazioni di
    lampade elettroniche fluorescenti compatte integrali (CFL-i) originarie della
    Repubblica popolare cinese mediante importazioni di lampade elettroniche fluorescenti
    compatte integrali (CFL-i) spedite dal Vietnam, dal Pakistan o dalle Filippine,
    indipendentemente dal fatto che siano dichiarate o meno originarie del Vietnam,
    del Pakistan e delle Filippine, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1582/2004, (2004. gada 8. septembris), sākot
    izmeklēšanu par antidempinga pasākumu, ko uzliek Padomes Regula (EK) Nr. 1470/2001,
    iespējamo pārkāpumu integrēto elektronisko kompakto fluoriscento lampu (KFL-i)
    importā, kas ievestas no Ķīnas Tautas Republikas ar integrēto elektronisko
    kompakto fluoriscento lampu (KFL-i) importu no Vjetnamas, Pakistānas vai Filipīnām,
    ja ir vai nav uzrādīta izcelsme no Vjetnamas, Pakistānas vai Filipīnām, un
    pakļaujot šādu importu reģistrācijai
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugsėjo 8 d. Komisijos reglamentas (EB) Nr. 1582/2004, siūlantis
    pradėti tyrimą, susijusį su galimais Tarybos reglamente (EB) Nr. 1470/2001
    dėl integruotų elektroninių kompaktinių fluorescentinių lempų (CFL-i), kurių
    kilmės šalis yra Kinijos Liaudies Respublika, įvežimo nustatytų antidempingo
    priemonių pažeidimais integruotas elektronines kompaktines fluorescentines lempas
    (CFL-i) įvežant iš Vietnamo, Pakistano ar Filipinų, nepaisant to, ar oficialiai
    yra nurodoma, kad tokių lempų kilmės šalis yra Vietnamas, Pakistanas ar Filipinai,
    ar ne, ir nustatantis, kad toks įvežimas turi būti registruojamas
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1582/2004 van de Commissie van 8 september 2004 tot
    opening van een onderzoek betreffende de mogelijke ontduiking van de antidumpingmaatregelen
    die bij Verordening (EG) nr. 1470/2001 van de Raad werden ingesteld ten aanzien
    van geïntegreerde elektronische compacte fluorescentielampen (CFL-i) uit de Volksrepubliek
    China door verzending van die lampen vanuit Vietnam, Pakistan of de Filipijnen,
    al dan niet aangegeven als van oorsprong zijnde uit Vietnam, Pakistan of de Filipijnen,
    en tot registratie van de invoer uit die landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1582/2004 z dnia 8 września 2004 r. wszczynające
