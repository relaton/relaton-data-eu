    instituídas pelo Regulamento (CE) n.° 1470/2001 do Conselho sobre as importações
    de lâmpadas electrónicas fluorescentes compactas integrais (CFL-i) originárias
    da República Popular da China pelas importações de lâmpadas electrónicas
    fluorescentes compactas integrais (CFL-i) expedidas do Vietname, Paquistão e
    Filipinas, sejam ou não declaradas originárias destes países, e que sujeita
    a registo essas importações
  type: main
