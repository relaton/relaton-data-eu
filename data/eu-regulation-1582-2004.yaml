  content: Kommissionens förordning (EG) nr 1582/2004 av den 8 september 2004 om
    inledande av en undersökning rörande eventuellt kringgående av de antidumpningsåtgärder
    som genom rådets förordning (EG) nr 1470/2001 införts beträffande import av
    integrerade elektroniska kompaktlysrör med ursprung i Folkrepubliken Kina genom
    import av integrerade elektroniska kompaktlysrör som avsänts från Republiken
    Filippinerna, Islamiska republiken Pakistan och Socialistiska republiken Vietnam,
    oavsett om produkten deklarerats ha sitt ursprung i Republiken Filippinerna, Islamiska
    republiken Pakistan respektive Socialistiska republiken Vietnam eller ej, och
    om registrering av sådan import
