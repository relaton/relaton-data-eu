    por el que se inicia una investigación en relación con el posible incumplimiento
    de las medidas antidumping impuestas por el Reglamento (CE) n° 1470/2001 del
    Consejo sobre las importaciones de lámparas fluorescentes compactas electrónicas
    integradas originarias de la República Popular China mediante las importaciones
    de lámparas fluorescentes compactas electrónicas integradas (CFL-i) procedentes
    de Vietnam, Pakistán o Filipinas declaradas o no originarias de esos países,
