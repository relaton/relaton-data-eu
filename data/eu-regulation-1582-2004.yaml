title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1582/2004 of 8 September 2004 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 1470/2001 on imports of integrated electronic
    compact fluorescent lamps (CFL-i) originating in the People’s Republic of China
    by imports of integrated electronic compact fluorescent lamps (CFL-i) consigned
    from Vietnam, Pakistan or the Philippines, whether declared as originating in
    Vietnam, Pakistan or the Philippines or not, and making such imports subject to
    registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1582/2004 de la Commission du 8 septembre 2004 portant
    ouverture d'une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement (CE) n° 1470/2001 du Conseil, sur les importations
    de lampes fluorescentes compactes à ballast électronique intégré (CFL-i),
    originaires de la République populaire de Chine, par des importations de lampes
    fluorescentes compactes à ballast électronique intégré (CFL-i) expédiées
    du Viêt Nam, du Pakistan ou des Philippines, qu'elles aient ou non été déclarées
    originaires de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1582/2004 der Kommission vom 8. September 2004 zur
    Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der vom Rat
    mit der Verordnung (EG) Nr. 1470/2001 eingeführten Antidumpingmaßnahmen gegenüber
    den Einfuhren integrierter elektronischer Kompakt-Leuchtstofflampen (CFL-i) mit
    Ursprung in der Volksrepublik China durch Einfuhren von aus Vietnam, Pakistan
    oder den Philippinen versandten integrierten elektronischen Kompakt-Leuchtstofflampen
    (CFL-i), als Ursprungserzeugnis Vietnams, Pakistans oder Philippinen angemeldet
    oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1582/2004 ze dne 8. září 2004 o zahájení
    šetření možného obcházení antidumpingových opatření uvalených nařízením
    Rady (ES) č. 1470/2001 na dovozy elektronických integrovaných kompaktních
    fluorescenčních výbojek (CFL-i) pocházejících z Čínské lidové republiky
    dovozem elektronických integrovaných kompaktních fluorescenčních výbojek
    (CFL-i) zasílaných z Vietnamu, Pákistánu nebo Filipín bez ohledu na to, zda
    je u nich deklarován původ z Vietnamu, Pákistánu nebo Filipín, a o zavedení
    evidence těchto dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1582/2004 af 8. september 2004 om indledning
