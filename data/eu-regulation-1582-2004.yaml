    blev indført ved Rådets forordning (EF) nr. 1470/2001 om importen af kompaktlysstofrør
    med indbygget elektronisk drosselspole (CFL-i) med oprindelse i Folkerepublikken
    Kina ved import af kompaktlysstofrør med indbygget elektronisk drosselspole (CFL-i)
    afsendt fra Vietnam, Pakistan eller Filippinerne, hvad enten de er angivet med
    oprindelse i Vietnam, Pakistan eller Filippinerne eller ej, og at gøre denne
    import til genstand for registrering
  type: main
