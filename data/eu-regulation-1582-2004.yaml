    na mocy rozporządzenia Rady (WE) nr 1470/2001 na przywóz świetlówek kompaktowych
    ze scaloną elektroniką (CFL) pochodzących z Chińskiej Republiki Ludowej poprzez
    przywóz świetlówek kompaktowych ze scaloną elektroniką (CFL) wysyłanych
    z Wietnamu, Pakistanu lub Filipin, zgłoszonych lub niezgłoszonych jako pochodzące
    z Wietnamu, Pakistanu lub Filipin, i poddające ten przywóz rejestracji
  type: main
