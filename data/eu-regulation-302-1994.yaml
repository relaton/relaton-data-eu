    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweichweizen
    auf 2 950 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 302/94 af 10. februar 1994 om ændring
