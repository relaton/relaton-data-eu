title:
- language: en
  script: Latn
  content: '96/179/EC: Commission Decision of 31 October 1995 enjoining the German
    Government to provide all documentation, information and data on the new investment
    projects of the Volkswagen Group in the new German Länder and on the aid that
    is to be granted to them (C 62/91 ex NN 75, 77, 78 and 79/91) (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/179/CE: Décision de la Commission, du 31 octobre 1995, enjoignant
    au gouvernement allemand de fournir tous les documents, informations et données
    concernant les projets de nouveaux investissements du groupe Volkswagen dans les
    nouveaux Länder allemands et les aides prévues en faveur de ces investissements
    (C 62/91 ex NN 75, 77, 78 et 79/91) (Le texte en langue allemande est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/179/EG: Entscheidung der Kommission vom 31. Oktober 1995 mit der der
    deutschen Regierung auferlegt wird, alle Unterlagen, Informationen und Daten über
    die Neuinvestitionsvorhaben der Volkswagen-Gruppe in den neuen Bundesländern
    und über die zu gewährenden Beihilfen zu übermitteln (C 62/91 ex NN 75, 77,
    78 und 79/91) (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/179/EF: Kommissionens beslutning af 31. oktober 1995 om pålæg til
    den tyske regering om at fremlægge alle oplysninger om Volkswagen-koncernens
    investeringsprojekter i de nye tyske delstater og om støtten hertil (C 62/91
    ex NN 75, 77, 78 og 79/91) (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/179/ΕΚ: Απόφαση της Επιτροπής, της 31ης Οκτωβρίου
    1995, με την οποία η γερμανική κυβέρνηση καλείται
    να χορηγήσει όλα τα έγγραφα, τις πληροφορίες
    και τα στοιχεία με τα νέα επενδυτικά προγράμματα
    του ομίλου Volkswagen στα νέα γερμανικά LANDER καθώς
    και για τις ενισχύσεις που προβλέπεται να χορηγηθούν
    υπέρ των επενδύσεων αυτών (C 62/91 ex NN 75, 77, 78 και
    79/91) (Το κείμενο στη γερμανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/179/EY: Komission päätös, tehty 31 päivänä lokakuuta 1995, Saksan
    hallituksen määräämisestä toimittamaan kaikki asiakirjat ja tiedot Volkswagen-ryhmän
    uusista investointihankkeista Saksan uusissa osavaltioissa ja hankkeille myönnettävästä
    tuesta (C 62/91 ex NN 75, 77, 78 ja 79/91) (Ainoastaan saksankielinen teksti on
    todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/179/CE: Decisione della Commissione, del 31 ottobre 1995, che ingiunge
    al governo tedesco di fornire tutti i documenti, le informazioni e i dati concernenti
    i nuovi progetti di investimento del Gruppo Volkswagen nei nuovi Länder e gli
    aiuti ad essi destinati (C-62/91 ex NN 75, 77, 78 e 79/91) (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/179/EG: Beschikking van de Commissie van 31 oktober 1995 waarin de
    Duitse Regering wordt aangemaand alle documentatie, informatie en gegevens te
    verstrekken inzake de projecten voor nieuwe investeringen van het Volkswagen-concern
    in de nieuwe deelstaten en de daarvoor te verlenen steun (C 62/91 ex NN 75/91,
    77/91, 78/91 en 79/91) (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/179/CE: Decisão da Comissão, de 31 de Outubro de 1995, que ordena
    ao Governo alemão a apresentação de toda a documentação, informações e
    dados relativos aos novos projectos de investimento do grupo Volkswagen nos novos
    Länder alemães e ao auxílio que lhes será concedido (C 62/91 ex NN 75, 77,
    78 e 79/91) (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '96/179/CE: Decisión de la Comisión, de 31 de octubre de 1995, por la
