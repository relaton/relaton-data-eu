  script: Latn
  content: '1999/462/EC: Commission Decision of 24 June 1999 recognising in principle
    the completeness of the dossier submitted for detailed examination in view of
    the possible inclusion of alanycarbe in Annex I to Council Directive 91/414/EEC
    concerning the placing of plant- protection products on the market (notified under
    document number C(1999) 1715)'
  type: main
- language: fr
  script: Latn
