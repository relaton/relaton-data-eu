title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2013/84 of 13 July 1984 on the sale at prices
    fixed at a standard rate in advance of certain beef from intervention stocks for
    processing in the Community and repealing Regulation (EEC) No 1390/84
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2013/84 de la Commission, du 13 juillet 1984, relatif
    à la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 1390/84
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2013/84 der Kommission vom 13. Juli 1984 über den
    Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der Gemeinschaft
    bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur Aufhebung der
    Verordnung (EWG) Nr. 1390/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2013/84 af 13. juli 1984 om salg til
    forudfastsatte priser af visse former for oksekød fra interventionslagrene med
    henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 1390/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2013/84 της Επιτροπής
    της 13ης Ιουλίου 1984 περί πωλήσεως, σε προκαθορισμένη
    κατ' αποκοπή τιμή, εν όψει της μεταποιήσεώς
    τους εντός της Κοινότητας, ορισμένων βοείων
    κρεάτων που προέρχονται από αποθέματα οργανισμών
    παρεμβάσεως και περί καταργήσεως του κανονισμού
    (ΕΟΚ) αριθ. 1390/84
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2013/84 della Commissione, del 13 luglio 1984, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità
    e recante abrogazione del regolamento (CEE) n. 1390/84
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2013/84 van de Commissie van 13 juli 1984 inzake
    de verkoop, tegen forfaitair vastgestelde prijzen, voor verwerking in de Gemeenschap,
    van rundvlees uit de voorraden van de interventiebureaus en houdende intrekking
    van Verordening (EEG) nr. 1390/84
