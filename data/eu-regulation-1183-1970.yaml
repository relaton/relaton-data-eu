schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1183/70 of the Commission of 24 June 1970 amending,
    in respect of Denmark, Regulation (EEC) No 1054/68 determining the list of agencies
    certifying the admissibility to certain tariff headings of certain milk products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1183/70 de la Commission, du 24 juin 1970, complétant,
    en ce qui concerne le Danemark, le règlement (CEE) n° 1054/68 établissant la
    liste des organismes émetteurs de certificats destinés à permettre l' admission
    de certains produits laitiers en provenance des pays tiers dans certaines positions
    tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1183/70 der Kommission vom 24. Juni 1970 zur Ergänzung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern in bezug auf Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1183/70 af 24. juni 1970 om tillæg,
    vedrørende Danmark, til forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse
    over organer, der kan udstede certifikater vedrørende visse fra tredjelande hidrørende
    mejeriprodukters henførelse til bestemte tarifpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 1183/70 της Επιτροπής,
    της 24ης Ιουνίου 1970, περί συμπλήρωσης, όσον αφορά
    τη Δανία του κανονισμού ( ΕΟΚ ) αριθ. 1054/68 περί
    καθορισμού του καταλόγου των οργανισμών που
    μπορούν να εκδόσουν πιστοποιητικά για την
    αποδοχή ορισμένων γαλακτοκομικών προϊόντων
    προελεύσεως τρίτων χωρών σε ορισμένες δασμολογικές
    θέσεις
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1183/70 della Commissione, del 24 giugno 1970, che
    completa, per quanto concerne la Danimarca, il regolamento (CEE) n. 1054/68 che
    stabilisce l' elenco degli organismi emittenti dei certificati destinati a permettere
    l' ammissione in alcune voci tariffarie di alcuni prodotti lattiero-caseari in
    provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1183/70 van de Commissie van 24 juni 1970 houdende
    aanvulling, voor wat betreft Denemarken, van Verordening (EEG) nr. 1054/68 houdende
    vaststelling van de lijst van instellingen belast met de afgifte van de certificaten
    welke bestemd zijn om bepaalde zuivelprodukten uit derde landen in te delen in
    bepaalde tariefposten
  type: main
