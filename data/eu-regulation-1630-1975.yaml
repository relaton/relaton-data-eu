title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1630/75 of the Council of 24 June 1975 extending the
    term of validity of Regulation (EEC) No 1267/69 laying down special provisions
    applicable to imports into the Community from Greece of goods coming under Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1630/75 du Conseil, du 24 juin 1975, prorogeant la
    durée de validité du règlement (CEE) n° 1267/69 fixant les dispositions particulières
    applicables lors de l'importation dans la Communauté, en provenance de Grèce,
    des marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1630/75 des Rates vom 24. Juni 1975 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 1267/69 zur Festlegung der Sonderbestimmungen,
    die bei der Einfuhr von unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren
    aus Griechenland in die Gemeinschaft anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1630/75 af 24. juni 1975 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 1267/69 om fastsættelse af særlige
    bestemmelser for indførsel i Fællesskabet af varer fra Grækenland, som henhører
    under forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1630/75 del Consiglio, del 24 giugno 1975, che proroga
    la durata di validità del regolamento (CEE) n. 1267/69, che fissa le disposizioni
    particolari applicabili all'importazione nella Comunità di merci soggette al
    regolamento (CEE) n. 1059/69 e provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1630/75 van de Raad van 24 juni 1975 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 1267/69 houdende vaststelling
    van de speciale voorschriften die van toepassing zijn bij de invoer in de Gemeenschap
    van onder Verordening (EEG) nr. 1059/69 vallende goederen van oorsprong uit Griekenland
  type: main
