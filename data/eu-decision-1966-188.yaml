title:
- language: fr
  script: Latn
  content: Décision 66/188/CEE de la Commission, du 2 mars 1966, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République française de chocolat et
    de confiseries et préparations comportant du cacao ou du chocolat, sans liqueur
    alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '66/188/EWG: Entscheidung der Kommission vom 2. März 1966 über die erneute
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Schokolade, Schokoladewaren und kakaohaltigen oder schokoladehaltigen
    Zuckerwaren, nicht alkoholhaltig, aus verschiedenen Mitgliedstaaten in die Französische
    Republik'
  type: main
- language: it
  script: Latn
  content: '66/188/CEE: Decisione della Commissione del 2 marzo 1966 con cui si modifica
    nuovamente la decisione della Commissione del 6 novembre 1964 che autorizza la
    riscossione di tasse di compensazione sulle importazioni, nella Repubblica francese,
    di cioccolata, di dolciumi e di preparazioni contenenti cacao o cioccolata, senza
    alcolici, in provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/188/EEG: Beschikking van de Commissie van 2 maart 1966 tot nieuwe wijziging
    van haar beschikking van 6 november 1964 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Franse Republiek van chocolade en van
    suikerwerk en voedingsmiddelen met cacao of met chocolade, zonder likeur, uit
    bepaalde Lid-Staten'
  type: main
