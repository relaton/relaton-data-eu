    00 mit Ursprung in China, für die die in der Verordnung (EWG) Nr. 3831/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2592/93 af 21. september 1993 om genindførelse
