id: EUDecision1980263
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/263/EEC: Commission Decision of 30 January 1980 authorizing Ireland
    not to apply Community treatment to blouses and shirt-blouses, knitted, crocheted
    (not elastic or rubberized) or woven, falling within subheadings ex 60.05 A II
    and 61.02 B II of the Common Customs Tariff (category 7), originating in Hong
    Kong and in free circulation in the other Member States (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/263/CEE: Décision de la Commission, du 30 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les chemisiers, blouses-chemisiers
    et blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, des sous-positions
    ex 60.05 A II et ex 61.02 B II du tarif douanier commun (catégorie 7), originaires
    de Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/263/EWG: Entscheidung der Kommission vom 30. Januar 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben der Tarifstellen ex 60.05 A II und ex 61.02 B
    II des Gemeinsamen Zolltarifs, Kategorie 7, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/263/EØF: Kommissionens beslutning af 30. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage (ikke elastisk eller gummeret) eller vævede, som henhører
    under pos. ex 60.05 A II og ex 61.02 B II i den fælles toldtarif (kategori 7),
    har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/263/CEE: Decisione della Commissione, del 30 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette e bluse
    a maglia (non elastica né gommata) o tessute, delle sottovoci ex 60.05 A II e
    ex 61.02 B II della tariffa doganale comune, categoria 7, originarie di Hong Kong
    e messe in libera pratica negli altri Stati membri (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/263/EEG: Beschikking van de Commissie van 30 januari 1980 waarbij Ierland
    wordt gemachtigd blouses en hemdblouses, van brei- of haakwerk (niet-elastisch,
    niet gegummeerd) of geweven, van de posten ex 60.05 A II en ex 61.02 B II van
    het gemeenschappelijk douanetarief (categorie 7), van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
