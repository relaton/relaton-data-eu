    (ΕΟΚ) αριθ. 2385/91 όσον αφορά τις γεωγραφικές περιοχές
    των νέων «LANDER» της Γερμανίας όπου οι παραγωγοί
    προβείου κρέατος που μετακινούν εποχιακά τα
    ποίμνιά τους θεωρούνται ως παραγωγοί σε μειονεκτικές
    περιοχές
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 609/94, annettu 18 päivänä maaliskuuta 1994,
    asetuksen (ETY) N:o 2385/91 täydentämisestä Saksan uusien osavaltioiden (Länder)
    sellaisten maantieteellisten alueiden osalta, joilla vuorilaiduntamista harjoittavia
    lampaanlihan tuottajia pidetään epäsuotuisten alueiden tuottajina
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 609/94 della Commissione del 18 marzo 1994 che completa
    il regolamento (CEE) n. 2385/91 per quanto concerne le zone geografiche dei nuovi
    «Länder» della Germania nelle quali i produttori che praticano la transumanza
    sono considerati produttori di carne ovina di zone svantaggiate
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 609/94 van de Commissie van 18 maart 1994 tot aanvulling
    van Verordening (EEG) nr. 2385/91 wat betreft de geografische gebieden van de
    nieuwe "Länder" van Duitsland waar de veehouders die het "transhumance"-systeem
    toepassen als producenten van schapevlees in probleemgebieden worden aangemerkt
  type: main
- language: pt
  script: Latn
