title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 609/94 of 18 March 1994 supplementing Regulation
    (EEC) No 2385/91 as regards the geographical areas of the new German Länder where
    producers practising transhumance are regarded as producers in less-favoured areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 609/94 de la Commission du 18 mars 1994 complétant
    le règlement (CEE) n° 2385/91 en ce qui concerne les zones géographiques des
    nouveaux Länder de l'Allemagne où les producteurs de viande ovine pratiquant
    la transhumance sont considérés comme producteurs en zones défavorisées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 609/94 der Kommission vom 18. März 1994 zur Ergänzung
    der Verordnung (EWG) Nr. 2385/91 hinsichtlich der Gebiete in den neuen deutschen
    Bundesländern, in denen Wanderschafhaltung betreibende Erzeuger als Erzeuger
    in benachteiligten Gebieten gelten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 609/94 af 18. marts 1994 om supplering
    af forordning (EØF) nr. 2385/91 for så vidt angår de geografiske områder i
    de nye tyske delstater, hvor fårekødsproducenter, der foretager græsningsskifte,
    betragtes som producenter i et ugunstigt stillet område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 609/94 της Επιτροπής
