id: EUDecision1976718
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 August 1976 authorizing the United Kingdom not
    to apply Community treatment to polyester/cotton fabrics, falling within heading
    No ex 56.07 of the Common Customs Tariff, originating in Thailand and in free
    circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/718/CEE: Décision de la Commission, du 6 août 1976, autorisant le
    Royaume-Uni à exclure du traitement communautaire certains tissus de polyester/coton,
    de la position Ex 56.07 du Tarif douanier commun, originaires de Thaïlande et
    mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. August 1976, mit der das Vereinigte
    Königreich ermächtigt wird, aus Thailand stammende und in der Bundesrepublik
    Deutschland im freien Verkehr befindliche Gewebe aus Polyester/Baumwolle der Tarifnummer
    ex 56.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. august 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage visse vævede stoffer af polyester/bomuld,
    som henhører under pos. ex 56.07 i den fælles toldtarif, har oprindelse i Thailand
    og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 agosto 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario taluni tessuti di poliestere/cotone,
    della voce ex 56.07 della tariffa doganale comune, originari della Tailandia ed
    immessi in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 augustus 1976 waarbij het Verenigd Koninkrijk
    wordt gemachtigd sommige weefsels van polyester/katoen, van post ex 56.07 van
    het gemeenschappelijk douanetarief, van oorsprong uit Thailand en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
