title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1623/2003 of 11 September 2003 extending the
    definitive anti-dumping duty imposed by Regulation (EC) No 408/2002 on imports
    of certain zinc oxides originating in the People's Republic of China to imports
    of certain zinc oxides consigned from Vietnam, whether declared as originating
    in Vietnam or not, and to imports of certain zinc oxides originating in the People's
    Republic of China and mixed with silica
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1623/2003 du Conseil du 11 septembre 2003 portant extension
    du droit antidumping définitif institué par le règlement (CE) n° 408/2002
    sur les importations de certains oxydes de zinc originaires de la République
    populaire de Chine aux importations des mêmes produits expédiés du Viêt Nam,
    qu'ils aient ou non été déclarés originaires de ce pays, et aux importations
    des mêmes produits mélangés à de la silice originaires de la République populaire
    de Chine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1623/2003 des Rates vom 11. September 2003 zur Ausweitung
