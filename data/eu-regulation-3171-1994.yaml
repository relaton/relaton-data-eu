    van 1995 onder bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking,
    voor dat kwartaal, van Verordening (EEG) nr. 2377/80
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3171/94 DA COMISSÃO de 21 de Dezembro de 1994 que
