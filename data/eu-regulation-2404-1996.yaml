    kulutuksen lisäämiseksi tarkoitettujen toimenpiteiden soveltamisesta annetun
    asetuksen (ETY) N:o 2282/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2404/96 della Commissione del 17 dicembre 1996 che
    modifica il regolamento (CEE) n. 2282/90 recante modalità d'applicazione delle
    misure intese ad aumentare il consumo e l'uso delle mele nonché il consumo degli
    agrumi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2404/96 van de Commissie van 17 december 1996 tot
