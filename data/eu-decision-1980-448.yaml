title:
- language: en
  script: Latn
  content: '80/448/EEC: Commission Decision of 1 April 1980 authorizing Ireland not
    to apply Community treatment to men''s and boys''woven suits, falling within subheading
    ex 61.01 B V of the Common Customs Tariff (category 16), originating in Romania
    and in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/448/CEE: Décision de la Commission, du 1er avril 1980, autorisant
    l''Irlande à exclure du traitement communautaire les costumes et complets tissés,
    de la sous-position ex 61.01 B V du tarif douanier commun (catégorie 16), originaires
    de Roumanie et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/448/EWG: Entscheidung der Kommission vom 1. April 1980, mit der Irland
    ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Anzüge und Kombinationen, aus Geweben, für Männer
    und Knaben, der Tarifstelle ex 61.01 B V des Gemeinsamen Zolltarifs (Kategorie
    16) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/448/EØF: Kommissionens beslutning af 1. april 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage jakkesæt, vævede, til mænd
    og drenge, som henhører under pos. ex 61.01 B V i den fælles toldtarif (kategori
    16), har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/448/CEE: Decisione della Commissione, del 1 aprile 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i vestiti e i completi, tessuti,
    per uomo e per ragazzo, della sottovoce ex 61.01 B V della tariffa doganale comune,
    categoria 16, originari della Romania e messi in libera pratica negli altri Stati
    membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/448/EEG: Beschikking van de Commissie van 1 april 1980 waarbij Ierland
    wordt gemachtigd kostuums, geweven, voor heren en jongens, van post ex 61.01 B
    V van het gemeenschappelijk douanetarief (categorie 16), van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
