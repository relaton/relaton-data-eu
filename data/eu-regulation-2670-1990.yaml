title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2670/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to suits and ensembles, products
    of category 74 (order No 40.0740) originating in Brazil, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2670/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux costumes-tailleurs
    et ensembles de la catégorie de produits n° 74 (numéro d'ordre 40.0740), originaires
    du Brésil, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2670/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer Kostueme und Kombinationen der Warenkategorie
    Nr. 74 (laufende Nummer 40.0740) mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2670/90 af 17. september 1990 om genindførelse
    af opkrævning af toldafgifter for dragter, kostumer og sæt, under varekategori
    74 (løbenummer 40.0740), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2670/90 της Επιτροπής
    της 17ης Σεπτεμβρίου 1990 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών στα κοστούμια
    - ταγιέρ και σύνολα, προϊόντα της κατηγορίας
    74 ( αύξων αριθμός 40.0740 ), και κοστούμια - ταγιέρ
    και σύνολα, προϊόντα της κατηγορίας 74 ( αύξων
    αριθμός 40.0740 ), καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3897/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2670/90 DELLA COMMISSIONE del 17 settembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili agli abiti a giacca e
    completi della categoria di prodotti n. 74 (numero d'ordine 40.0740) originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2670/90 VAN DE COMMISSIE van 17 september 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantelpakken
    of broekpakken, van de categorie van produkten nr. 74 (volgnummer 40.0740), van
    oorsprong uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
