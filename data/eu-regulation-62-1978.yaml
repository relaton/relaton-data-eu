title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 62/78 of 12 January 1978 re-establishing
    the levying of the customs duties on spoons, forks, fish-eaters, etc., of stainless
    steel, falling within subheading 82.14 A, originating in South Korea to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 62/78 de la Commission, du 12 janvier 1978, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, etc., en acier inoxydable, de la sous- position tarifaire
    82.14 A, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 62/78 der Kommission vom 12. Januar 1978 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln usw., aus rostfreiem Stahl,
    der Tarifstelle 82.14 A, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 62/78 af 12. januar 1978 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc. af rustfrit
    stål, under underposition 82.14 A, som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 62/78 della Commissione, del 12 gennaio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni,
    forchette, ecc., di acciaio inossidabile, della sottovoce doganale 82.14 A, originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 62/78 van de Commissie van 12 januari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lepels,
    pollepels, vorken enz., van roestvrij staal, van post 82.14 A, van oorsprong uit
    Zuid-Korea, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
