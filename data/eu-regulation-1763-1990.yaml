    Zitrusfrüchte sowie Tafeläpfel und -birnen bezüglich der Liste der großfrüchtigen
    Sorten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1763/90 af 27. juni 1990 om ændring
