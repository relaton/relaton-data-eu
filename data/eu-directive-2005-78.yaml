title:
- language: en
  script: Latn
  content: Commission Directive 2005/78/EC of 14 November 2005 implementing Directive
    2005/55/EC of the European Parliament and of the Council on the approximation
    of the laws of the Member States relating to the measures to be taken against
    the emission of gaseous and particulate pollutants from compression-ignition engines
    for use in vehicles, and the emission of gaseous pollutants from positive ignition
    engines fuelled with natural gas or liquefied petroleum gas for use in vehicles
    and amending Annexes I, II, III, IV and VI thereto
  type: main
- language: fr
  script: Latn
  content: Directive 2005/78/CE de la Commission du 14 novembre 2005 mettant en œuvre
    la directive 2005/55/CE du Parlement européen et du Conseil concernant le rapprochement
    des législations des États membres relatives aux mesures à prendre contre les
    émissions de gaz polluants et de particules polluantes provenant des moteurs
    à allumage par compression destinés à la propulsion des véhicules et les émissions
    de gaz polluants provenant des moteurs à allumage commandé fonctionnant au gaz
    naturel ou au gaz de pétrole liquéfié et destinés à la propulsion des véhicules,
    et modifiant ses annexes I, II, III, IV et VI
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/78/EG der Kommission vom 14. November 2005 zur Durchführung
    der Richtlinie 2005/55/EG des Europäischen Parlaments und des Rates zur Angleichung
    der Rechtsvorschriften der Mitgliedstaaten über Maßnahmen gegen die Emission
    gasförmiger Schadstoffe und luftverunreinigender Partikel aus Selbstzündungsmotoren
    zum Antrieb von Fahrzeugen und die Emission gasförmiger Schadstoffe aus mit Flüssiggas
    oder Erdgas betriebenen Fremdzündungsmotoren zum Antrieb von Fahrzeugen und zur
    Änderung ihrer Anhänge I, II, III, IV und VI
  type: main
- language: bg
  script: Cyrl
  content: Директива 2005/78/ЕО на Комисията от 14 ноември
    2005 година относно изпълнение на Директива
    2005/55/ЕО на Европейския парламент и на Съвета
    за сближаване законодателствата на държавите-членки
    относно мерките, които трябва да бъдат взети
    срещу емисии от замърсяващи газове и частици
    от двигатели за превозни средства с компресионно
    запалване, и емисии от замърсяващи частици
    от двигатели за превозни средства с принудително
    запалване, използващи гориво природен газ
    или втечнен нефтен газ, и за изменение на Приложения
    I, II, III, IV и VI към нея
  type: main
