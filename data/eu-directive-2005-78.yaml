    članica u odnosu na mjere koje treba poduzeti protiv emisije plinovitih i krutih
    onečišćujućih tvari iz motora s kompresijskim paljenjem za primjenu u vozilima
    i emisije plinovitih onečišćujućih tvari iz motora s vanjskim izvorom paljenja
    koji kao gorivo koriste prirodni plin ili ukapljeni naftni plin za primjenu u
    vozilima i o izmjeni njezinih priloga I., II., III., IV. i VI.
  type: main
