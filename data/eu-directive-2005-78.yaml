  content: A Bizottság 2005/78/EK irányelve ( 2005. november 14. ) a járművek
    hajtására használt sűrítéses gyújtású motorok gáz-halmazállapotú szennyezőanyag-
    és légszennyezőrészecske-kibocsátása, valamint a járművek hajtására
    használt, földgáz- vagy PB-gázüzemű külső gyújtású motorok gáz-halmazállapotú
    szennyezőanyag-kibocsátása elleni intézkedésekre vonatkozó tagállami jogszabályok
    közelítéséről szóló 2005/55/EK európai parlamenti és tanácsi irányelv
    alkalmazásáról és annak I., II., III., IV. és VI. mellékletének módosításáról
  type: main
