  script: Latn
  content: Direttiva 2005/78/CE della Commissione, del 14 novembre 2005 , che attua
    la direttiva 2005/55/CE del Parlamento europeo e del Consiglio concernente il
    ravvicinamento delle legislazioni degli Stati membri relative ai provvedimenti
    da prendere contro l'emissione di inquinanti gassosi e di particolato prodotti
    dai motori ad accensione spontanea destinati alla propulsione di veicoli e contro
    l'emissione di inquinanti gassosi prodotti dai motori ad accensione comandata
    alimentati con gas naturale o con gas di petrolio liquefatto destinati alla propulsione
    di veicoli e ne modifica gli allegati I, II, III, IV e VI
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2005/78/EK ( 2005. gada 14. novembris ), ar ko īsteno
    Eiropas Parlamenta un Padomes Direktīvu 2005/55/EK par dalībvalstu tiesību
    aktu tuvināšanu attiecībā uz pasākumiem, kas jāveic, lai samazinātu gāzveida
    un daļiņveida piesārņotāju emisiju no kompresijaizdedzes motoriem, kuri paredzēti
    transportlīdzekļiem, un gāzveida piesārņotāju emisiju no dzirksteļaizdedzes
    motoriem, ko darbina ar dabasgāzi vai sašķidrinātu naftas gāzi un kas paredzēti
    transportlīdzekļiem, kā arī ar ko groza tās I, II, III, IV un VI pielikumu
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 14 d. Komisijos direktyva 2005/78/EB, įgyvendinanti
    Europos Parlamento ir Tarybos direktyvą 2005/55/EB dėl valstybių narių įstatymų,
    reglamentuojančių priemones, kurių būtina imtis mažinant transporto priemonėse
    naudojamų uždegimo suspaudimu variklių išmetamuosius dujinius bei kietųjų
    dalelių teršalus ir transporto priemonėse naudojamų kibirkštinio uždegimo
    variklių, degalams naudojančių gamtines dujas ir suskystintas naftos dujas,
    išmetamuosius dujinius teršalus, suderinimo, ir iš dalies keičianti jos I,
    II, III, IV ir VI priedus
  type: main
