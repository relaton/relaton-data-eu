    členských štátov vzťahujúcich sa na opatrenia, ktoré treba prijať proti
    emisiám plynných a tuhých znečisťujúcich látok zo vznetových motorov určených
    na používanie vo vozidlách a proti emisiám plynných znečisťujúcich látok
    zo zážihových motorov poháňaných zemným plynom alebo skvapalneným ropným
    plynom, určených na používanie vo vozidlách, a ktorou sa menia a dopĺňajú
    jej prílohy I, II, III, IV a VI
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2005/78/ES z dne 14. novembra 2005 o izvajanju Direktive
    Evropskega parlamenta in Sveta 2005/55/ES o približevanju zakonodaje držav članic
    v zvezi z ukrepi, ki jih je treba sprejeti proti emisijam plinastih in trdnih
    onesnaževal iz motorjev na kompresijski vžig, ki se uporabljajo v vozilih, ter
    emisijam plinastih onesnaževal iz motorjev na prisilni vžig, ki za gorivo uporabljajo
    zemeljski plin ali utekočinjeni naftni plin, in se uporabljajo v vozilih in o
    spremembi prilog I, II, III, IV in VI k Direktivi
  type: main
- language: es
  script: Latn
  content: Directiva 2005/78/CE de la Comisión, de 14 de noviembre de 2005 , por
    la que se aplica la Directiva 2005/55/CE del Parlamento Europeo y del Consejo
    relativa a la aproximación de las legislaciones de los Estados miembros sobre
    las medidas que deben adoptarse contra la emisión de gases y partículas contaminantes
    procedentes de motores de encendido por compresión destinados a la propulsión
    de vehículos, y contra la emisión de gases contaminantes procedentes de motores
    de encendido por chispa alimentados con gas natural o gas licuado del petróleo
    destinados a la propulsión de vehículos, y se modifican sus anexos I, II, III,
    IV y VI
  type: main
