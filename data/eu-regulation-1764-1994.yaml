title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1764/94 of 18 July 1994 laying down to what
    extent applications for issue of export licences submitted during July 1994 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1764/94 de la Commission, du 18 juillet 1994, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 1994 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1764/94 der Kommission vom 18. Juli 1994 über das
    Ausmaß, in dem den im Juli 1994 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1764/94 af 18. juli 1994 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i juli
    1994 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1764/94 της Επιτροπής
    της 18ης Ιουλίου 1994 περί καθορισμού σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Ιούλιο 1994 για τα προϊόντα του
    τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1764/94 della Commissione, del 18 luglio 1994, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di luglio 1994 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1764/94 van de Commissie van 18 juli 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 1994 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1764/94 da Comissão, de 18 de Julho de 1994, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Julho de 1994 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1764/94 de la Comisión, de 18 de julio de 1994, por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de julio de 1994, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en un país tercero
  type: main
