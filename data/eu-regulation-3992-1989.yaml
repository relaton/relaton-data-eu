title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3992/89 of 22 December 1989 derogating for
    the 1989/90 wine year form Regulation (EEC) No 2721/88 in regard to the date of
    submission for approval of contracts for preventive distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3992/89 de la Commission du 22 décembre 1989 portant
    dérogation pour la campagne 1989/1990 au règlement (CEE) n° 2721/88 en ce qui
    concerne la date de présentation pour agrément des contrats de distillation
    préventive
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3992/89 DER KOMMISSION vom 22. Dezember 1989 zur Abweichung
    von der Verordnung (EWG) Nr. 2721/88 hinsichtlich der Frist fuer die Einreichung
    der die vorbeugende Destillation betreffenden Vertraege im Wirtschaftsjahr 1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3992/89 af 22. december 1989 om undtagelse
    for produktionsåret 1989/1990 fra forordning (EØF) nr. 2721/88, for så vidt
    angår den dato, på hvilken kontrakter om forebyggende destillation senest kan
    indgives til godkendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3992/89 της Επιτροπής
    της 22ας Δεκεμβρίου 1989 για παρέκκλιση, για την
    περίοδο 1989/90, από τον κανονισμό (ΕΟΚ) αριθ. 2721/88
    όσον αφορά την ημερομηνία υποβολής για έγκριση
    των συμβάσεων της προληπτικής απόσταξης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3992/89 DELLA COMMISSIONE del 22 dicembre 1989 recante
    deroga per la campagna 1989/1990 al regolamento (CEE) n. 2721/88 alla data di
    presentazione per l'approvazione dei contratti di distillazione preventiva
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3992/89 VAN DE COMMISSIE van 22 december 1989 houdende
    afwijking, voor het wijnoogstjaar 1989/1990, van Verordening (EEG) nr. 2721/88
    betreffende de termijn waarin preventieve distillatiecontracten ter goedkeuring
    voorgelegd moeten worden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3992/89 DA COMISSAO de 22 de Dezembro de 1989 que
    derroga, relativamente à campanha de 1989/1990, o Regulamento (CEE) n* 2721/88,
    no que diz respeito à data de apresentaçao para aprovaçao dos contratos de
    destilaçao preventiva
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3992/89 DE LA COMISION de 22 de diciembre de 1989 por
    el que se establecen casos de excepcion durante la campana de 1989/90 al Reglamento
    (CEE) no 2721/88 en lo referente a la fecha de presentacion para su autorizacion
    de los contratos de destilacion preventiva
  type: main
