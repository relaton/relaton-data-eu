title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 827/2012 of 29 June 2012 laying
    down implementing technical standards with regard to the means for public disclosure
    of net position in shares, the format of the information to be provided to the
    European Securities and Markets Authority in relation to net short positions,
    the types of agreements, arrangements and measures to adequately ensure that shares
    or sovereign debt instruments are available for settlement and the dates and period
    for the determination of the principal venue for a share according to Regulation
    (EU) No 236/2012 of the European Parliament and of the Council on short selling
    and certain aspects of credit default swaps
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 827/2012 de la Commission du 29 juin
    2012 définissant des normes techniques d'exécution concernant les modalités
    de publication des positions courtes nettes sur actions, le format des informations
    à fournir à l'Agence européenne des marchés financiers sur les positions courtes
    nettes, les types d'accords, d'arrangements et de mesures permettant de garantir
    de manière adéquate que les actions ou instruments de dette souveraine seront
    disponibles pour le règlement, et les dates et périodes de détermination de
    la plate-forme principale de négociation d'une action, conformément au règlement
    (UE) n ° 236/2012 du Parlement européen et du Conseil sur la vente à découvert
    et certains aspects des contrats d'échange sur risque de crédit
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 827/2012 der Kommission vom 29. Juni
    2012 zur Festlegung technischer Durchführungsstandards in Bezug auf die Verfahren
    für die Offenlegung von Nettopositionen in Aktien gegenüber der Öffentlichkeit,
    das Format, in dem der Europäischen Wertpapier- und Marktaufsichtsbehörde Informationen
    zu Netto-Leerverkaufspositionen zu übermitteln sind, die Arten von Vereinbarungen,
    Zusagen und Maßnahmen, die angemessen gewährleisten, dass Aktien oder öffentliche
    Schuldtitel für die Abwicklung des Geschäfts verfügbar sind, und die Daten,
    zu denen die Ermittlung des Haupthandelsplatzes einer Aktie erfolgt, sowie den
    Zeitraum, auf den sich die betreffende Berechnung bezieht, gemäß der Verordnung
    (EU) Nr. 236/2012 des Europäischen Parlaments und des Rates über Leerverkäufe
    und bestimmte Aspekte von Credit Default Swaps
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 827/2012 на Комисията
    от 29 юни 2012 година за определяне на технически
    стандарти за изпълнение по отношение на средствата
    за публично оповестяване на нетна позиция
