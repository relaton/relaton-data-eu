  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 827/2012 van de Commissie van 29 juni 2012
    tot vaststelling van technische uitvoeringsnormen met betrekking tot de manier
    waarop netto shortposities in aandelen openbaar mogen worden gemaakt, de vorm
    van de aan de Europese Autoriteit voor effecten en markten te verstrekken informatie
    over netto shortposities, de soorten overeenkomsten, regelingen en maatregelen
    die er adequaat voor zorgen dat aandelen of overheidsschuldinstrumenten voor afwikkeling
    beschikbaar zijn, alsmede de datum van en de in aanmerking te nemen periode bij
    de bepaling van het belangrijkste handelsplatform van een aandeel, als bedoeld
    in Verordening (EU) nr. 236/2012 van het Europees Parlement en de Raad betreffende
    short selling en bepaalde aspecten van kredietverzuimswaps
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 827/2012 z dnia 29 czerwca 2012
    r. ustanawiające wykonawcze standardy techniczne dotyczące środków podawania
    do publicznej wiadomości pozycji netto z tytułu akcji, formy, w jakiej mają
    być przekazywane Europejskiemu Urzędowi Nadzoru Giełd i Papierów Wartościowych
    informacje w odniesieniu do pozycji krótkich netto, rodzajów umów, porozumień
    i środków, które w odpowiedni sposób zapewniają dostępność akcji lub instrumentów
    związanych z długiem państwowym na potrzeby rozrachunku oraz dat i okresu na
    potrzeby ustalenia głównego systemu obrotu akcją, zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (UE) nr 236/2012 w sprawie krótkiej sprzedaży
    i wybranych aspektów dotyczących swapów ryzyka kredytowego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 827/2012 da Comissão, de 29 de junho
    de 2012 , que estabelece normas técnicas de execução no que diz respeito aos
    meios para a divulgação pública das posições líquidas em ações, ao formato
    das informações a fornecer à Autoridade Europeia dos Valores Mobiliários e
    dos Mercados (ESMA) em relação às posições líquidas curtas, aos tipos de
    acordos, mecanismos e medidas para assegurar de forma adequada que as ações
