  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 827/2012, annettu 29 päivänä
    kesäkuuta 2012 , teknisten täytäntöönpanostandardien vahvistamisesta niiden
    keinojen osalta, joilla osakkeita koskevia nettomääräisiä lyhyitä positioita
    voidaan julkistaa, Euroopan arvopaperimarkkinaviranomaiselle nettomääräisistä
    lyhyistä positioista annettavien tietojen muodon ja niiden sopimusten, järjestelyjen
    ja toimenpiteiden tyyppien osalta, joilla voidaan riittävässä määrin varmistaa,
    että osakkeet tai valtion velkainstrumentit ovat saatavilla selvitystä varten,
    ja niiden päivämäärien ja sen jakson osalta, joita käytetään osakkeen pääasiallisen
    markkinapaikan määrittämisessä lyhyeksimyynnistä ja tietyistä luottoriskinvaihtosopimuksiin
    liittyvistä kysymyksistä annetun Euroopan parlamentin ja neuvoston asetuksen
    (EU) N:o 236/2012 mukaisesti
  type: main
