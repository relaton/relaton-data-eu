  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 827/2012
    της Επιτροπής, της 29ης Ιουνίου 2012 , για τον καθορισμό
    εκτελεστικών τεχνικών προτύπων όσον αφορά
    τα μέσα δημοσιοποίησης καθαρής θέσης σε μετοχές,
    τον μορφότυπο των πληροφοριών που πρέπει να
    παρέχονται στην Ευρωπαϊκή Αρχή Κινητών Αξιών
    και Αγορών σχετικά με τις καθαρές αρνητικές
    θέσεις, τους τύπους συμφωνιών, ρυθμίσεων και
    μέτρων που διασφαλίζουν επαρκώς ότι οι μετοχές
    ή οι κρατικοί χρεωστικοί τίτλοι είναι διαθέσιμοι
    για διακανονισμό, και τις ημερομηνίες και την
    περίοδο για τον προσδιορισμό του βασικού τόπου
    διαπραγμάτευσης για μια μετοχή, σύμφωνα με
    τον κανονισμό (ΕΕ) αριθ. 236/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου για τις ανοικτές
