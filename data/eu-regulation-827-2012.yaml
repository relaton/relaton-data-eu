    суапите за кредитно неизпълнение
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 827/2012 ze dne 29. června 2012
    , kterým se stanoví prováděcí technické normy, pokud jde o způsoby zveřejňování
    čistých pozic v akciích a formát informací, které mají být poskytovány
    Evropskému orgánu pro cenné papíry a trhy v souvislosti s čistými krátkými
    pozicemi, typy dohod, ujednání a opatření, jež odpovídajícím způsobem
    zajišťují, že akcie nebo nástroje financování státního dluhu jsou k dispozici
    pro vypořádání, a data a období pro stanovení hlavního systému akcií
    podle nařízení Evropského parlamentu a Rady (EU) č. 236/2012 o prodeji na
    krátko a některých aspektech swapů úvěrového selhání
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 827/2012 af 29. juni 2012
    om gennemførelsesmæssige tekniske standarder vedrørende fremgangsmåden for
    offentliggørelse af nettopositioner i aktier, formatet for oplysninger, som skal
    indgives til Den Europæiske Værdipapir- og Markedstilsynsmyndighed vedrørende
    korte nettopositioner, typer af aftaler, ordninger og foranstaltninger for i tilstrækkelig
