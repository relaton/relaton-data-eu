  script: Latn
  content: Regolamento di esecuzione (UE) n. 827/2012 della Commissione, del 29 giugno
    2012 , che stabilisce norme tecniche di attuazione relative al metodo di comunicazione
    al pubblico delle posizioni nette in titoli azionari, al formato delle informazioni
    da fornire all'Autorità europea degli strumenti finanziari e dei mercati in relazione
    alle posizioni corte nette, ai tipi di accordi, alle modalità d'intesa e alle
    misure che garantiscono adeguatamente che titoli azionari o debito sovrano siano
    disponibili per il regolamento nonché alle date e al periodo per la determinazione
    della sede principale di negoziazione dei titoli azionari a norma del regolamento
    (UE) n. 236/2012 del Parlamento europeo e del Consiglio relativo alle vendite
    allo scoperto e a taluni aspetti dei contratti derivati aventi ad oggetto la copertura
    del rischio di inadempimento dell'emittente (credit default swap)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 827/2012 ( 2012. gada 29. jūnijs
