    sa stanovujú vykonávacie technické predpisy, pokiaľ ide o zverejňovanie čistých
    pozícií v akciách, formát informácií poskytovaných Európskemu orgánu
    pre cenné papiere a trhy v súvislosti s čistými krátkymi pozíciami, druhy
    zmlúv, dojednaní a opatrení na primerané zabezpečenie toho, že akcie alebo
    štátne dlhové nástroje budú dostupné na vyrovnanie, a dátumy a obdobie
    na určenie hlavného obchodného miesta pre akcie podľa nariadenia Európskeho
    parlamentu a Rady (EÚ) č. 236/2012 o predaji nakrátko a určitých aspektoch
    swapov na úverové zlyhanie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 827/2012 z dne 29. junija 2012 o določitvi
    izvedbenih tehničnih standardov glede sredstev za javno razkritje neto pozicij
    v delnicah, oblike informacij, ki jih je treba predložiti Evropskemu organu za
    vrednostne papirje in trge v zvezi z neto kratkimi pozicijami, vrst dogovorov,
    ureditev in ukrepov za ustrezno zagotovitev, da so delnice ali državni vrednostni
