    datas e período relevantes para a determinação da plataforma de negociação
    principal de uma ação em conformidade com o Regulamento (UE) n. ° 236/2012
    do Parlamento Europeu e do Conselho relativo às vendas a descoberto e a certos
    aspetos dos swaps de risco de incumprimento
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 827/2012 al Comisiei din 29
    iunie 2012 de stabilire a standardelor tehnice de punere în aplicare cu privire
    la mijloacele de publicare a pozițiilor nete pe acțiuni, la formatul informațiilor
    care trebuie furnizate Autorității europene pentru valori mobiliare și piețe
