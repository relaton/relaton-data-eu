    īsās pozīcijas publiskošanas veidiem, Eiropas Vērtspapīru un tirgu iestādei
    par neto īsajām pozīcijām sniedzamās informācijas formātu, līgumu, vienošanās
    un pasākumu veidiem, lai pienācīgi nodrošinātu, ka akcijas vai valsts parāda
    instrumenti ir pieejami norēķiniem konkrētā dienā, un laikposmu akciju galvenās
    tirdzniecības vietas noteikšanai atbilstīgi Eiropas Parlamenta un Padomes Regulai
    (ES) Nr. 236/2012 par īso pārdošanu un dažiem kredītriska mijmaiņas darījumu
    aspektiem
  type: main
- language: lt
  script: Latn
  content: '2012 m. birželio 29 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 827/2012,
    kuriuo nustatomi šie techniniai įgyvendinimo standartai: viešo informacijos
    apie grynąsias trumpąsias akcijų pozicijas atskleidimo būdų; informacijos
    apie grynąsias trumpąsias pozicijas, kurią reikia teikti Europos vertybinių
    popierių ir rinkų institucijai, formato; susitarimų, sutarčių ir priemonių,
    skirtų deramai užtikrinti, kad akcijos arba valstybės skolos finansinės priemonės
    būtų pateiktos, kai reikės atsiskaityti, tipų ir pagrindinės prekybos akcijomis
    vietos nustatymo terminų bei laikotarpio pagal Europos Parlamento ir Tarybos
    reglamentą (ES) Nr. 236/2012 dėl skolintų vertybinių popierių pardavimo ir
    tam tikrų kredito įsipareigojimų neįvykdymo apsikeitimo sandorių aspektų'
  type: main
