    in Sveta o prodaji na kratko in določenih vidikih poslov kreditnih zamenjav
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 827/2012 de la Comisión, de 29 de junio
    de 2012 , por el que se establecen normas técnicas de ejecución en lo que respecta
    a los medios de publicación de las posiciones netas en acciones, el formato de
    la información que deberá facilitarse a la Autoridad Europea de Valores y Mercados
    en relación con las posiciones cortas netas, los tipos de acuerdos, pactos y
    medidas destinados a garantizar adecuadamente que las acciones o instrumentos
