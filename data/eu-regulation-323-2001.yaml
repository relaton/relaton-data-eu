    τόνους τη διαρκή δημοπρασία για τη μεταπώληση
    στην εσωτερική αγορά μαλακού σίτου συγκομιδής
    1999 που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 323/2001, annettu 16 päivänä helmikuuta 2001,
    asetuksen (EY) N:o 2869/2000 muuttamisesta ja pysyvän tarjouskilpailun nostamisesta
    750000 tonniin Ranskan interventioelimen hallussaan pitämän sadonkorjuuvuoden
    1999 vehnämäärän uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 323/2001 della Commissione, del 16 febbraio 2001, che
