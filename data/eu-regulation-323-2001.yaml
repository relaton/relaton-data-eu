title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 323/2001 of 16 February 2001 amending Regulation
    (EC) No 2869/2000 and increasing to 750000 tonnes the amount of common wheat from
    the 1999 harvest held by the French intervention agency for which a standing invitation
    to tender for resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 323/2001 de la Commission du 16 février 2001 modifiant
    le règlement (CE) n° 2869/2000 et portant à 750000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé tendre de la récolte 1999 détenues
    par l'organisme d'intervention français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 323/2001 der Kommission vom 16. Februar 2001 zur Änderung
    der Verordnung (EG) Nr. 2869/2000 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Weichweizen der Ernte 1999 aus Beständen
    der französischen Interventionsstelle auf 750000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 323/2001 af 16. februar 2001 om ændring
