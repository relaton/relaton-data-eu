    der Französischen Republik, aus Indien stammende Kleider aus Geweben und aus
    Gewirken von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/51/EØF: Kommissionens beslutning af 16. januar 1981 om bemyndigelse
