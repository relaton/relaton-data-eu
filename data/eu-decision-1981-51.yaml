title:
- language: en
  script: Latn
  content: '81/51/EEC: Commission Decision of 16 January 1981 authorizing the French
    Republic not to apply Community treatment to woven and knitted or crocheted dresses
    originating in India (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/51/CEE: Décision de la Commission, du 16 janvier 1981, autorisant
