  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 269/85 della Commissione del 31 gennaio 1985 recante
    modifica del regolamento (CEE) n. 1760/83 che stabilisce le modalità particolari
    di applicazione del regime dei titoli di fissazione anticipata per determinati
    prodotti agricoli esportati sotto forma di merci non comprese nell' allegato II
    del trattato e deroga al regolamento (CEE) n. 2730/79 per quanto riguarda il pagamento
    della restituzione per il burro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 269/85 van de Commissie van 31 januari 1985 tot wijziging
    van Verordening (EEG) nr. 1760/83 houdende bijzondere uitvoeringsbepalingen inzake
    het stelsel van voorfixatiecertificaten voor bepaalde landbouwprodukten die worden
    uitgevoerd in de vorm van goederen die niet onder bijlage II van het Verdrag vallen
    en houdende afwijking van Verordening (EEG) nr. 2730/79 ten aanzien van de betaling
    van de restitutie voor boter
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 269/85 da Comissão, de 31 de Janeiro de 1985, que
    altera o Regulamento (CEE) n.° 1760/83 relativo às regras especiais de aplicação
    do regime dos certificados de prefixação para certos produtos agrícolas sob
    a forma de mercadorias não incluídos no Anexo II do Tratado e que revoga o Regulamento
    (CEE) n.° 2730/79 no que diz respeito ao pagamento de restituição para a manteiga
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 269/85 de la Comisión, de 31 de enero de 1985, por
    el que se modifica el Reglamento (CEE) n° 1760/83 por el que se establecen modalidades
    especiales de aplicación del régimen de certificados de fijación anticipada
    para determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el Anexo II del Tratado y por el que se establecen excepciones al Reglamento
    (CEE) n° 2730/79 en lo que se refiere al pago de la restitución para la mantequilla
