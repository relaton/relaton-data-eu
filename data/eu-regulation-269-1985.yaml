title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 269/85 of 31 January 1985 amending Regulation
    (EEC) No 1760/83 on special detailed rules for the application of the system of
    advance-fixing certificates for certain agricultural products exported in the
    form of goods not covered by Annex II to the Treaty and derogating from Regulation
    (EEC) No 2730/79 with regard to payment of refunds on butter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 269/85 de la Commission du 31 janvier 1985 modifiant
    le règlement (CEE) no 1760/83 portant modalités particulières d' application
    du régime des certificats de préfixation pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l' annexe II du traité et dérogeant
    au règlement (CEE) no 2730/79 en ce qui concerne le paiement de la restitution
    pour le beurre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 269/85 der Kommission vom 31. Januar 1985 zur Änderung
    der Verordnung (EWG) Nr. 1760/83 über besondere Durchführungsvorschriften für
    Vorausfestsetzungsbescheinigungen für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt
    werden, und zur Abweichung von der Verordnung (EWG) Nr. 2730/79 hinsichtlich der
    Zahlung der Erstattung für Butter
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 269/85 af 31. januar 1985 om ændring
    af forordning (EØF) nr. 1760/83 om de særlige gennemførelsesbestemmelser for
    ordningen med forudfastsættelsesattester for visse landbrugsprodukter, der udføres
    i form af varer, som ikke omfattes af traktatens bilag II, og om fravigelse af
    forordning (EØF) nr. 2730/79 for så vidt angår betaling af restitutioner for
    smør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 269/85 της Επιτροπής
    της 31ης Ιανουαρίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1760/83 που αφορά τις ειδικές
    λεπτομέρειες εφαρμογής του καθεστώτος των
    πιστοποιητικών προκαθορισμού για ορισμένα
    γεωργικά προϊόντα εξαγόμενα με τη μορφή εμπορευμάτων
