  content: Commission Implementing Regulation (EU) 2026/769 of 7 April 2026 amending
    Implementing Regulation (EU) No 180/2014 as regards the transfer of the amounts
    planned in the CAP Strategic Plan for rural development in the outermost regions
    to POSEI programmes for the year 2026 and the on-the-spot checks to be performed
    in the POSEI scheme and Implementing Regulation (EU) No 181/2014 as regards the
    on-the-spot checks to be performed in the smaller Aegean islands scheme
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/769 de la Commission du 7 avril 2026
    modifiant le règlement d’exécution (UE) no 180/2014 en ce qui concerne le
    transfert des montants prévus dans le plan stratégique relevant de la PAC pour
    le développement rural dans les régions ultrapériphériques vers les programmes
    POSEI pour l’année 2026 et les contrôles sur place à effectuer dans le cadre
    du régime POSEI, et modifiant le règlement d’exécution (UE) no 181/2014 en
    ce qui concerne les contrôles sur place à effectuer dans le cadre du régime
    en faveur des îles mineures de la mer Égée
  type: main
