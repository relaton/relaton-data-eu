title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3507/88 of 10 November 1988 introducing
    a countervailing charge and suspending the preferential customs duty on imports
    of mandarins, including tangerines and satsumas, Wilkings and other similar citrus
    hybrids, with the exception of clementines originating in Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3507/88 de la Commission, du 10 novembre 1988, instituant
    une taxe compensatoire et suspendant le droit de douane préférentiel à l'importation
    de mandarines, y compris les tangerines et satsumas, wilkings et autres hybrides
    similaires d'agrumes, à l'exclusion des clémentines originaires de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3507/88 der Kommission vom 10. November 1988 zur Einführung
    einer Ausgleichsabgabe und zur Aussetzung des Präferenzzolls bei der Einfuhr
    von Mandarinen, einschließlich Tangerinen und Satsumas, Wilkings und ähnliche
    Kreuzungen von Zitrusfrüchten, ausgenommen Clementinen, mit Ursprung in der Türkei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3507/88 af 10. november 1988 om opkrævning
    af en udligningsafgift og om suspension af præferencetoldsatsen ved indførsel
    af mandariner (herunder tangeriner og satsumas) wilkings og andre lignende krydsninger
    af citrusfrugter, bortset fra clementiner med oprindelse i Tyrkiet
  type: main
- language: el
  script: Grek
