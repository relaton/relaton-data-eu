- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2466 of 28 October 2026 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, the United Kingdom and the United States in the lists of third countries,
    territories, or zones thereof authorised for the entry into the Union of consignments
    of poultry and germinal products of poultry, and of fresh meat of poultry and
    game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2466 de la Commission du 28 octobre
    2026 modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Canada, au Royaume-Uni et aux États-Unis
    dans les listes des pays tiers, territoires et zones de pays tiers et territoires
    en provenance desquels l’entrée dans l’Union d’envois de volailles, de
    produits germinaux de volailles et de viandes fraîches de volailles et de gibier
    à plumes est autorisée
  type: main
