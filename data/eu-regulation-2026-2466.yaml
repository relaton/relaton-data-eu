    Staaten in den Listen der Drittländer, Gebiete und Zonen, aus denen der Eingang
    in die Union von Sendungen von Geflügel und Zuchtmaterial von Geflügel sowie
    von frischem Fleisch von Geflügel und Wildgeflügel zulässig ist
  type: main
