    μπορούν να γίνουν αποδεκτές οι αιτήσεις χορηγήσεως
    πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο του 2003 για τις συμπληρωματικές δασμολογικές
