  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1307/2003, annettu 23 päivänä heinäkuuta
    2003, asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä
    koskevien, heinäkuussa 2003 esitettyjen tuontitodistushakemusten hyväksyttävyydestä
    Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian, Bulgarian
    ja Romanian osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1307/2003 della Commissione, del 23 luglio 2003, che
