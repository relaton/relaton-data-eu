title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1307/2003 of 23 July 2003 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in July 2003 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1307/2003 de la Commission du 23 juillet 2003 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 2003 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1279/98 pour la République de Pologne, la
    République de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1307/2003 der Kommission vom 23. Juli 2003 zur Bestimmung
    des Prozentsatzes, zu dem den im Juli 2003 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß der Verordnung
    (EG) Nr. 1279/98 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1307/2003 af 23. juli 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i juli 2003 om importlicenser
    for kød i forbindelse med de toldkontingenter for oksekød, der i forordning
    (EF) nr. 1279/98 er fastsat for Republikken Polen, Republikken Ungarn, Den Tjekkiske
    Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
