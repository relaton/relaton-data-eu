title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/357 of 23 January 2024 imposing
    a definitive anti-dumping duty on imports of certain open mesh fabrics of glass
    fibres originating in the People’s Republic of China as extended to imports
    consigned from India, Indonesia, Malaysia, Taiwan and Thailand following an expiry
    review pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European
    Parliament and the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/357 de la Commission du 23 janvier
    2024 instituant un droit antidumping définitif sur les importations de certains
    tissus de fibre de verre à maille ouverte originaires de la République populaire
    de Chine, tel qu’étendu aux importations expédiées de l’Inde, d’Indonésie,
    de Malaisie, de Taïwan et de Thaïlande, à l’issue d’un réexamen au titre
    de l’expiration des mesures effectué conformément à l’article 11, paragraphe
    2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/357 der Kommission vom 23. Januar 2024
