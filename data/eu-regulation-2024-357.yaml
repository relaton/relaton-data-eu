    offenmaschiger Gewebe aus Glasfasern mit Ursprung in der Volksrepublik China,
    ausgeweitet auf die aus Indien, Indonesien, Malaysia, Taiwan und Thailand versandten
    Einfuhren, im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2
    der Verordnung (EU) 2016/1036 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
