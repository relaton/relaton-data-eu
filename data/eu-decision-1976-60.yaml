id: EUDecision197660
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 November 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's, girls' and infants' undergarments falling within
    heading No 61.04 of the Common Customs Tariff, originating in Taiwan and in free
    circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 novembre 1975, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg, et le Royaume des Pays-Bas à exclure
    du traitement communautaire les vêtements de dessous (linge de corps) pour femmes,
    fillettes et jeunes enfants, de la position 61.04 du Tarif douanier commun, originaires
    de Taiwan et mis en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. November 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Unterkleidung (Leibwäsche) für Frauen, Mädchen und Kleinkinder
    der Tarifnummer 61.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. november 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage underbeklædningsgenstande til kvinder, piger og småbørn, som henhører
    under pos. 61.04 i den fælles toldtarif, har oprindelse i Taiwan og frit kan
    omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 novembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le sottovesti (biancheria da dosso) per donna, per
    ragazza e per bambini della voce 61.04 della tariffa doganale comune, originarie
    di Taiwan e messe in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 november 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd damesonderkleding, meisjes- en kinderonderkleding van post 61.04 van
    het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
