title:
- language: en
  script: Latn
  content: '81/381/EEC: Commission Decision of 27 March 1981 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''woven
    overcoats, raincoats and other coats, cloaks and capes; jackets and blazers originating
    in Hong Kong (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/381/CEE: Décision de la Commission, du 27 mars 1981, autorisant la
    République française à exclure du traitement communautaire les manteaux imperméables
    et vestes, tissés, originaires de Hong-kong (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/381/EWG: Entscheidung der Kommission vom 27. März 1981 zur Ermächtigung
    der Französischen Republik, aus Hongkong stammende Mäntel, Umhänge und Jacken,
    aus Geweben, für Frauen, Mädchen und Kleinkinder von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/381/EØF: Kommissionens beslutning af 27. marts 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede med oprindelse i Hongkong (Kun den franske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/381/ΕΟΚ: Απόφαση τής Επιτροπής τής 27ης
    Μαρτίου 1981 περί εξουσιοδοτήσεως τής Γαλλικής
    Δημοκρατίας νά αποκλείσει από τήν κοινοτική
    μεταχείριση τά επανωφόρια, αδιάβροχα καί σακκάκια,
    υφασμένα, καταγόμενα από τό Χόνγκ Κόνγκ (Το
    κείμενο στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/381/CEE: Decisione della Commissione, del 27 marzo 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cappotti, soprabiti,
    mantelli e simili, e giacche, tessuti, originari di Hong Kong (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/381/EEG: Beschikking van de Commissie van 27 maart 1981 houdende machtiging
    van de Franse Republiek om mantels, regenjassen, blazers en jasjes, geweven, van
    oorsprong uit Hong-Kong van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
