    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού κατά τις συναλλαγές
    μεταξύ της Ισπανίας και της Κοινότητας με τη
    σύνθεσή της στις 31 Δεκεμβρίου 1985 όσον αφορά
    ορισμένα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2265/94 della Commissione, del 20 settembre 1994, che
