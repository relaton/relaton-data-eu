title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 505/82 of 2 March 1982 re-establishing the
    levying of customs duties on acrylonitrile, falling within heading No ex 29.27
    and originating in Brazil, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 505/82 de la Commission, du 2 mars 1982, portant rétablissement
    de la perception des droits de douane applicables à l' acrylonitrile, de la position
    ex 29.27 du tarif douanier commun, originaire du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 505/82 der Kommission vom 2. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Acrylnitril der Tarifnummer ex 29.27, mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 505/82 af 2. marts 1982 om genindførelse
    af opkrævning af told for acrylonitril, henhørende under pos. ex 29.27 og med
    oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 505/82 τής Επιτροπής τής
    2ας Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τό ακρυλονιτρίλιο τής κλάσεως
    ex 29. 27 τού Κοινού Δασμολογίου, καταγωγής Βραζιλίας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 505/82 della Commissione, del 2 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili all' acrilonitrile, della voce ex
    29.27 della tariffa doganale comune, originario del Brasile beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
