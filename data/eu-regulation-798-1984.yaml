  script: Latn
  content: Regolamento (CEE) n. 798/84 della Commissione del 28 marzo 1984 che ripristina
    la riscossione dei dazi doganali applicabili all' urea della sottovoce 31.02 B
    della tariffa doganale comune, originaria del Messico beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
