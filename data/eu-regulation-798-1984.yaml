title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 798/84 of 28 March 1984 re-establishing
    the levying of customs duties on urea, falling within subheading 31.02 B and originating
    in Mexico, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 798/84 de la Commission du 28 mars 1984 portant rétablissement
    de la perception des droits de douane applicables à l' urée, de la sous-position
    31.02 B du tarif douanier commun, originaire du Mexique, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 798/84 der Kommission vom 28. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für Harnstoff der Tarifstelle 31.02 B mit Ursprung in
    Mexiko, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 798/84 af 28. marts 1984 om genindførelse
    af opkrævning af told for urinstof henhørende under pos. 31.02 B og med oprindelse
    i Mexico som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3569/83
  type: main
- language: el
  script: Grek
