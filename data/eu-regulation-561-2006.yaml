    sociale dans le domaine des transports par route, modifiant les règlements (CEE)
    n o 3821/85 et (CE) n o 2135/98 du Conseil et abrogeant le règlement (CEE) n
    o 3820/85 du Conseil (Texte présentant de l'intérêt pour l'EEE) - Déclaration
