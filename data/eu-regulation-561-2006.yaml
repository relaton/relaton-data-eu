  script: Latn
  content: Regulation (EC) No 561/2006 of the European Parliament and of the Council
    of 15 March 2006 on the harmonisation of certain social legislation relating to
    road transport and amending Council Regulations (EEC) No 3821/85 and (EC) No 2135/98
    and repealing Council Regulation (EEC) No 3820/85 (Text with EEA relevance) -
    Declaration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 561/2006 du Parlement européen et du Conseil du 15
