title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant le Royaume de Belgique à suspendre
    temporairement les importations de raisins de table en provenance des États membres,
    classés dans la catégorie de qualité "extra"
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, mit der das Königreich Belgien ermächtigt
    wird, die Einfuhr von Tafeltrauben der Klasse "Extra" aus den Mitgliedstaaten
    vorübergehend auszusetzen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione che autorizza il Regno del Belgio a sospendere
    temporaneamente le importazioni di uve da tavola in provenienza dagli Stati membri,
    classificati nella categoria di qualità «extra»
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie houdende machtiging van het Koninkrijk België
    om de invoer van tafeldruiven, afkomstig uit de Lid-Staten en ingedeeld in de
    kwaliteitsklasse "Extra", tijdelijk te schorsen
