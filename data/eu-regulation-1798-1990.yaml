title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1798/90 of 27 June 1990 imposing a definitive
    anti-dumping duty on imports of monosodium glutamate originating in Indonesia,
    the Republic of Korea, Taiwan and Thailand and definitively collecting the provisional
    anti-dumping duty imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1798/90 du Conseil du 27 juin 1990 instituant un droit
    antidumping définitif sur les importations de glutamate monosodique originaire
    d'Indonésie, de la République de Corée, de Taiwan et de Thaïlande et portant
    réception définitive du droit antidumping provisoire institué à l'importation
    de ces produits
  type: main
- language: de
  script: Latn
