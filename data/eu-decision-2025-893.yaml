---
id: EUDecision2025893
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/893 of 14 May 2025 amending
    Implementing Decision (EU) 2022/2191 as regards harmonised standards for digital
    enhanced cordless telecommunications devices, short range devices, satellite systems,
    broadband and wideband data transmission systems, international mobile telecommunication
    systems, aeronautical and meteorological radars, 5 and 6 GHz WAS/RLAN equipment,
    wireless digital video links, and advanced surface movement guidance and control
    systems
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/893 de la Commission du 14 mai 2025
    modifiant la décision d’exécution (UE) 2022/2191 en ce qui concerne les normes
    harmonisées relatives aux dispositifs de télécommunications numériques sans
    fil améliorées, aux dispositifs à courte portée, aux systèmes de satellites,
    aux systèmes de transmission de données à large bande (broadband) et à bande
    large (wideband), aux systèmes de télécommunications mobiles internationales,
    aux radars aéronautiques et météorologiques, aux équipements WAS/RLAN de 5
    et 6 GHz, aux liaisons vidéo numériques sans fil et aux systèmes perfectionnés
    de guidage et de contrôle des mouvements en surface
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/893 der Kommission vom 14. Mai 2025 zur
    Änderung des Durchführungsbeschlusses (EU) 2022/2191 hinsichtlich harmonisierter
    Normen für digitale schnurlose Telekommunikationsgeräte, Funkanlagen mit geringer
    Reichweite, Satellitensysteme, Breitbanddatenübertragungssysteme, internationale
    mobile Telekommunikationssysteme, Flugfunk- und Wetterradare, WAS/Funk-LAN-Ausrüstung
    im 5- und 6-GHz-Bereich, drahtlose digitale Videoverbindungen und erweiterte Bodenverkehrsleit-
    und Kontrollsysteme
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/893 на Комисията
    от 14 май 2025 година за изменение на Решение за
    изпълнение (ЕС) 2022/2191 по отношение на хармонизираните
    стандарти за устройствата за цифрови усъвършенствани
    безшнурови далекосъобщения, устройствата
    с малък обсег на действие, спътниковите системи,
    широколентовите системи за предаване на данни,
    международните мобилни далекосъобщителни
    системи, въздухоплавателните и метеорологичните
    радари, системите WAS/RLAN в честотния обхват 5
    и 6 GHz, безжичните цифрови видеовръзки и усъвършенстваните
    системи за ръководство на наземното движение
    и управление
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/893 ze dne 14. května 2025,
    kterým se mění prováděcí rozhodnutí (EU) 2022/2191, pokud jde o harmonizované
    normy pro digitální bezšňůrová telekomunikační zařízení, zařízení
    krátkého dosahu, družicové systémy, širokopásmové datové přenosové
    systémy, mezinárodní mobilní telekomunikační systémy, letecké a meteorologické
    radary, zařízení WAS/RLAN 5 a 6 GHz, bezdrátové digitální obrazové spoje
    a pokročilé naváděcí a řídicí systémy pozemního pohybu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/893 af 14. maj 2025 om
    ændring af gennemførelsesafgørelse (EU) 2022/2191 for så vidt angår harmoniserede
    standarder for udstyr til digitalt forstærket trådløs telekommunikation, kortdistanceapparater,
    satellitsystemer, bredbåndssystemer til dataoverførsel, systemer til international
    mobil telekommunikation, aeronautiske og meteorologiske radarer, WAS/RLAN-udstyr
    til frekvenserne 5 GHz og 6 GHz, trådløse digitale videoforbindelser og avancerede
    systemer til styring og kontrol på jorden
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2025/893 της Επιτροπής,
    της 14ης Μαΐου 2025, για την τροποποίηση της εκτελεστικής
    απόφασης (ΕΕ) 2022/2191 όσον αφορά τα εναρμονισμένα
    πρότυπα για βελτιωμένες ψηφιακές ακόρδονες
    τηλεπικοινωνιακές συσκευές, συσκευές μικρής
    εμβέλειας, δορυφορικά συστήματα, ευρυζωνικά
    συστήματα μετάδοσης δεδομένων, διεθνή συστήματα
    κινητών τηλεπικοινωνιών, αεροναυτικά και μετεωρολογικά
    ραντάρ, εξοπλισμό WAS/RLAN 5 και 6 GHz, ασύρματες ψηφιακές
    βιντεοζεύξεις και προηγμένα συστήματα καθοδήγησης
    και ελέγχου κίνησης επιφανείας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2025/893, 14. mai 2025, millega muudetakse
    rakendusotsust (EL) 2022/2191 digitaalseid juhtmeta telekommunikatsiooniseadmeid,
    lähitoimeseadmeid, satelliitsüsteeme, lairiba andmeedastussüsteeme, rahvusvahelisi
    mobiilsidesüsteeme, lennundus- ja meteoroloogiaradareid, 5 ja 6 GHz WAS/RLAN-seadmeid,
    juhtmeta digitaalseid videolinke ning täiustatud maapealse liikluse suuniseid
    ja juhtimissüsteeme käsitlevate harmoneeritud standardite osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2025/893, annettu 14 päivänä
    toukokuuta 2025, täytäntöönpanopäätöksen (EU) 2022/2191 muuttamisesta siltä
    osin kuin on kyse yhdenmukaisista standardeista, jotka koskevat langattomia tietoliikennelaitteita,
    lyhyen kantaman laitteita, satelliittijärjestelmiä, laajakaistaisia ja leveäkaistaisia
    datasiirtojärjestelmiä, kansainvälisiä matkaviestinjärjestelmiä, lento-
    ja säätutkia, 5 ja 6 GHz:n WAS/RLAN-laitteita, langattomia digitaalisia videolinkkejä
    sekä kehittyneitä kenttäalueen liikenteen ohjaus- ja valvontajärjestelmiä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2025/893 ón gCoimisiún an 14 Bealtaine
    2025 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2022/2191 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le gairis le haghaidh teileachumarsáid
    dhigiteach neartaithe gan sreang, gairis ghearr-raoin, córais satailíte, córais
    tarchurtha sonraí leathanbhanda agus banda leathan, córais idirnáisiúnta mhóibíleacha
    teileachumarsáide, radair aerloingseoireachta agus mheitéareolaíocha, trealamh
    WAS/RLAN 5 agus 6 GHz, físnaisc dhigiteacha gan sreang, agus ardchórais treoraíochta
    agus rialaithe gluaiseachtaí ar an dromchla
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2025/893 оd 14. svibnja 2025. o izmjeni
    Provedbene odluke (EU) 2022/2191 u pogledu usklađenih normi za digitalne poboljšane
    bežične uređaje za telekomunikaciju, uređaje kratkog dometa, satelitske sustave,
    brze širokopojasne sustave i širokopojasne sustave za prijenos podataka, međunarodne
    sustave za mobilnu telekomunikaciju, zrakoplovne i meteorološke radare, 5 GHz
    i 6 GHz opremu WAS/RLAN, bežične digitalne videoveze i napredne sustave vođenja
    i kontrole kretanja površinom
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/893 végrehajtási határozata (2025. május 14.)
    az (EU) 2022/2191 végrehajtási határozatnak a digitális, továbbfejlesztett,
    zsinór nélküli távközlési eszközökre, a kis hatótávolságú eszközökre,
    a műholdas rendszerekre, a széles és szélesebb sávú adatátviteli rendszerekre,
    a nemzetközi mobil távközlési rendszerekre, a légiforgalmi és meteorológiai
    radarokra, az 5 és 6 GHz-es WAS-/RLAN-berendezésekre, a vezeték nélküli digitális
    videoátviteli összeköttetésekre, valamint a fejlett, földi mozgást irányító
    és ellenőrző rendszerekre vonatkozó harmonizált szabványok tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/893 della Commissione, del 14 maggio
    2025, che modifica la decisione di esecuzione (UE) 2022/2191 per quanto riguarda
    le norme armonizzate per dispositivi di telecomunicazioni digitali cordless migliorate,
    dispositivi a corto raggio, sistemi satellitari, sistemi di trasmissione dati
    a banda larga e banda estesa, sistemi di telecomunicazioni mobili internazionali,
    radar aeronautici e meteorologici, apparecchiature WAS/RLAN a 5 e 6 GHz, collegamenti
    video digitali senza fili e sistemi di guida e controllo a movimento superficiale
    avanzato
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/893 (2025. gada 14. maijs), ar
    ko Īstenošanas lēmumu (ES) 2022/2191 groza attiecībā uz saskaņotajiem standartiem,
    kas piemērojami uzlaboto ciparu bezauklas telesakaru ierīcēm, maza darbības
    attāluma ierīcēm, satelītu sistēmām, platjoslas un plašjoslas datu pārraides
    sistēmām, starptautisko mobilo telesakaru sistēmām, aeronavigācijas un meteoroloģiskajiem
    radariem, 5 un 6 GHz WAS/RLAN iekārtām, bezvadu ciparu videolīnijām un uzlabotām
    kustības uz zemes vadības un kontroles sistēmām
  type: main
- language: lt
  script: Latn
  content: 2025 m. gegužės 14 d. Komisijos įgyvendinimo sprendimas (ES) 2025/893,
    kuriuo dėl skaitmeninio patobulinto belaidžio nuotolinio ryšio, trumpojo nuotolio
    įtaisų, palydovinių sistemų, plačiajuosčių duomenų perdavimo sistemų,
    tarptautinių judriojo ryšio sistemų, oro navigacijos ir meteorologijos radarų,
    5 ir 6 GHz WAS/RLAN įrenginių, belaidžio skaitmeninio vaizdo ryšio linijų
    ir patobulintųjų antžeminio judėjimo valdymo ir kontrolės sistemų darniųjų
    standartų iš dalies keičiamas Įgyvendinimo sprendimas (ES) 2022/2191
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/893 tal-14
    ta’ Mejju 2025 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2022/2191
    fir-rigward tal-istandards armonizzati għall-apparati tat-telekomunikazzjoni
    diġitali mtejba mingħajr fili, l-apparati fuq medda qasira, is-sistemi satellitari,
    is-sistemi tat-trażmissjoni tad-data broadband u wideband, is-sistemi tat-telekomunikazzjoni
    mobbli internazzjonali, ir-radars ajrunawtiċi u meteoroloġiċi, it-tagħmir
    WAS/RLAN tal-5 u s-6 GHz, il-kollegamenti video diġitali mingħajr fili, u s-sistemi
    avvanzati ta’ gwida u kontroll tal-moviment fuq superfiċe
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/893 van de Commissie van 14 mei 2025 tot wijziging
    van Uitvoeringsbesluit (EU) 2022/2191 wat betreft geharmoniseerde normen voor
    digitaal draadloze telecommunicatieapparatuur, kortbereikapparatuur, satellietsystemen,
    breedband data zendsystemen, internationale mobiele telecommunicatiesystemen,
    aeronautische en meteorologische radars, 5 en 6 GHz WAS/RLAN-apparatuur, draadloze
    digitale videoverbindingen en geavanceerde begeleiding- en controlesystemen voor
    verplaatsing over land
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/893 z dnia 14 maja 2025 r. zmieniająca
    decyzję wykonawczą (UE) 2022/2191 w odniesieniu do norm zharmonizowanych dotyczących
    urządzeń cyfrowego udoskonalonego systemu telekomunikacji bezsznurowej, urządzeń
    bliskiego zasięgu, systemów satelitarnych, szerokopasmowych systemów transmisji
    danych, systemów międzynarodowej łączności ruchomej, radarów lotniczych
    i meteorologicznych, urządzeń WAS/RLAN pracujących w pasmach 5 GHz i 6 GHz,
    bezprzewodowych cyfrowych łączy wizyjnych oraz zaawansowanych systemów zarządzania
    i kontroli ruchu naziemnego na lotnisku
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/893 da Comissão, de 14 de maio de 2025,
    que altera a Decisão de Execução (UE) 2022/2191 no que diz respeito às normas
    harmonizadas para equipamentos de telecomunicações sem fios digitais intensificadas,
    equipamentos de curto alcance, sistemas de satélite, sistemas de transmissão
    de dados em banda larga (broadband e wideband), sistemas de telecomunicações
    móveis internacionais, radares aeronáuticos e meteorológicos, equipamentos
    WAS/RLAN de 5 e 6 GHz, ligações vídeo digital sem fios e sistemas avançados
    de guiamento e controlo de movimentos no solo
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/893 a Comisiei din 14 mai 2025
    de modificare a Deciziei de punere în aplicare (UE) 2022/2191 în ceea ce privește
    standardele armonizate pentru dispozitivele digitale îmbunătățite de telecomunicații
    fără fir, dispozitivele cu rază scurtă de acțiune, sistemele de sateliți,
    echipamentele de transmisii de date de bandă largă, sistemele internaționale
    de telecomunicații mobile, radarele aeronautice și meteorologice, echipamentele
    WAS/RLAN de 5 și 6 GHz, legăturile video digitale fără fir și sistemul avansat
    de control și ghidare a mișcării pe suprafață
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/893 zo 14. mája 2025, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2022/2191, pokiaľ ide o harmonizované
    normy pre digitálne rozšírené bezšnúrové telekomunikačné zariadenia,
    zariadenia s krátkym dosahom, satelitné systémy, širokopásmové systémy
    a širokopásmové systémy prenosu údajov, medzinárodné mobilné telekomunikačné
    systémy, letecké a meteorologické radary, zariadenia WAS/RLAN 5 a 6 GHz, bezdrôtové
    digitálne videospoje a zdokonalené systémy navádzania a riadenia pohybu na
    prevádzkových plochách
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/893 z dne 14. maja 2025 o spremembi
    Izvedbenega sklepa (EU) 2022/2191 glede harmoniziranih standardov za digitalne
    izboljšane brezvrvične telekomunikacijske naprave, naprave kratkega dosega,
    satelitske sisteme, širokopasovne sisteme za prenos podatkov, mednarodne mobilne
    telekomunikacijske sisteme, aeronavtične in meteorološke radarje, opremo WAS/RLAN
    5 in 6 GHz, brezžične digitalne video povezave ter napredne sisteme za vodenje
    in nadzor gibanja po zemlji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2025/893 de la Comisión, de 14 de mayo de
    2025, por la que se modifica la Decisión de Ejecución (UE) 2022/2191 en lo que
    respecta a las normas armonizadas para los dispositivos de telecomunicaciones
    inalámbricas digitales mejoradas, los dispositivos de corto alcance, los sistemas
    de satélites, los sistemas de transmisión de datos de banda ancha, los sistemas
    de telecomunicaciones móviles internacionales, los radares aeronáuticos y meteorológicos,
    los equipos WAS/RLAN en las bandas de 5 GHz y 6 GHz, los enlaces de vídeo digitales
    inalámbricos y los sistemas avanzados de guía y control de movimientos en la
    superficie
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/893 av den 14 maj 2025 om ändring
    av genomförandebeslut (EU) 2022/2191 vad gäller harmoniserade standarder för
    digital förstärkt trådlös telekommunikationsutrustning, kortdistansutrustning,
    satellitsystem, bredbandiga datatransmissionssystem, internationella mobila telekommunikationssystem,
    aeronautisk och metereologisk radar, utrustning för 5 och 6 GHz WAS/RLAN, trådlösa
    digitala videolänkar och avancerade lednings- och styrsystem för markrörelser
  type: main
