title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/164 of 5 February 2020 concerning
    the authorisation of 6-phytase produced by Schizosaccharomyces pombe (ATCC 5233)
    as a feed additive for all avian species and all swine species and repealing Regulation
    (EC) No 379/2009 (holder of authorisation Danisco (UK) Ltd, trading as Danisco
    Animal Nutrition and represented by Genencor International B.V.)
  type: main
- language: fr
  script: Latn
