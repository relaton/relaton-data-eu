    pombe (ATCC 5233) en tant qu’additif pour l’alimentation de toutes les espèces
    aviaires et toutes les espèces porcines et abrogeant le règlement (CE) no 379/2009
    [titulaire de l’autorisation: Danisco (UK) Ltd, agissant sous le nom commercial
    de Danisco Animal Nutrition et représenté par Genencor International B.V.]'
