title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1480/88 of 27 May 1988 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of bone in beef held by certain
    intervention agencies and intended for export, amending Regulation (EEC) No 569/88
    and repealing Regulation (EEC) No 160/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1480/88 de la Commission du 27 mai 1988 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines non désossées détenues par certains organismes d'intervention
    et destinées à être exportées, modifiant le règlement (CEE) n° 569/88 et
    abrogeant le règlement (CEE) n° 160/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1480/88 DER KOMMISSION vom 27. Mai 1988 über den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch mit Knochen aus Beständen einiger
    Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur
    Änderung der Verordnung (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG)
    Nr. 160/88 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1480/88 af 27. maj 1988 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af ikke udbenet oksekød fra visse
    interventionsorganer med henblik på udførsel og om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 160/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1480/88 της Επιτροπής
    της 27ης Μαΐου 1988 με την πώληση, βάσει της διαδικασίας
    που καθορίζεται στον κανονισμό (ΕΟΚ) αριθ. 2539/84,
    βοείου κρέατος με κόκαλα που κρατείται από
    ορισμένους οργανισμούς παρέμβασης και προορίζεται
    για εξαγωγή καθώς και σχετικά με την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 569/88 και την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 160/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1480/88 DELLA COMMISSIONE del 27 maggio 1988 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine non disossate detenute da taluni organismi d'' intervento e destinate
    all'' esportazione, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 160/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1480/88 VAN DE COMMISSIE van 27 mei 1988 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    met been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking
    van Verordening (EEG) nr. 160/88 #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1480/88 da Comissão de 27 de Maio de 1988 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) n.° 2539/84, de
    carne de bovino não desossada detida por certos organismos de intervenção e
    destinada a ser exportada e que também altera o Regulamento (CEE) n.° 569/88
    e que revoga o Regulamento (CEE) n.° 160/88
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 1480/88 DE LA COMISIÓN de 27 de mayo de 1988 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) nº
    2539/84, de carnes de vacuno sin deshuesar en poder de determinados organismos
    de intervención y destinadas a ser exportadas, que modifica el Reglamento (CEE)
    nº 569/88 y deroga el Reglamento (CEE) 160/88 #'
  type: main
