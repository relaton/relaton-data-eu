  content: Règlement (CEE) n 365/68 de la Commission, du 28 mars 1968, modifiant
    la période prévue par le règlement n 941/67/CEE pour la préfixation du prélèvement
    et de la restitution applicables aux aliments composés à base de céréales
    pour les animaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 365/68 der Kommission vom 28. März 1968 zur Änderung
    des in der Verordnung Nr. 941/67/EWG vorgesehenen Zeitraums für die vorherige
    Festsetzung der Abschöpfung und der Erstattung für Getreide- Mischfuttermittel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 365/68 della Commissione, del 28 marzo 1968, che modifica
    il periodo previsto dal regolamento n. 941/67/CEE per la fissazione in anticipo
    del prelievo e della restituzione applicabili agli alimenti composti a base di
    cereali per gli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 365/68 van de Commissie van 28 maart 1968 houdende
    wijziging van de in Verordening nr. 941/67/EEG voorgeschreven termijn voor de
    voorfixatie van de heffing en van de restitutie voor mengvoeders op basis van
    granen
