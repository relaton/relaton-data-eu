  content: Commission Regulation (EEC) No 1217/77 of 6 June 1977 subjecting to authorization
    imports into the Benelux countries, into the Federal Republic of Germany, into
    France and into the United Kingdom of certain knitted or crocheted garments originating
    in the Republic of Singapore
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1217/77 de la Commission, du 6 juin 1977, soumettant
    à autorisation les importations dans la République fédérale d'Allemagne, au
    Benelux, en France et au Royaume-Uni de certains vêtements de bonneterie originaires
    de la République de Singapour
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1217/77 der Kommission vom 6. Juni 1977 zur Einführung
    einer Genehmigungspflicht für die Einfuhr bestimmter Kleidung aus Gewirken, mit
    Ursprung in der Republik Singapur, in die Bundesrepublik Deutschland, die Benelux,
    Frankreich und das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1217/77 af 6. juni 1977 om indførelse
