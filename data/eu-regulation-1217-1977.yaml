    Tyskland og Frankrig af visse beklædningsgenstande af trikotage med oprindelse
    i republikken Singapore
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1217/77 della Commissione, del 6 giugno 1977, che
    sottopone ad autorizzazione le importazioni nella Repubblica federale di Germania,
    nel Benelux, in Francia e nel Regno Unito di taluni indumenti a maglia originari
    della Repubblica di Singapore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1217/77 van de Commissie van 6 juni 1977 houdende
