title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1793/77 of 2 August 1977 re-establishing
    the levying of the customs duties on other butyl alcohols, falling within subheading
    29.04 A III b), originating in Romania to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1793/77 de la Commission, du 2 août 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres alcools
    butyliques, de la sous-position tarifaire 29.04 A III b), originaires de la Roumanie
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1793/77 der Kommission vom 2. August 1977 zur Wiedereinführung
    des Zollsatzes für andere Butylalkohole, der Tarifstelle 29.04 A III b), mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1793/77 af 2. august 1977 om genindførsel
    af opkrævning af toldafgifter for andre buthylalkoholer under underposition 29.04
    A III b), som har oprindelse i Rumænien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1793/77 della Commissione, del 2 agosto 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli altri alcoli butilici
    della sottovoce doganale 29.04 A III b) originari della Romania beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1793/77 van de Commissie van 2 augustus 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere butylalcoholen,
    van post 29.04 A III b), van oorsprong uit Roemenië, ten behoeve waarvan bij
    Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
