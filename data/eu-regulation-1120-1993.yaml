  content: COMMISSION REGULATION (EEC) No 1120/93 of 6 May 1993 re-establishing the
    levying of customs duties on products of categories 36, 72 and 91 (order Nos 40.0360,
    40.0720 and 40.0910), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
