  content: Commission Regulation (EEC) No 1229/76 of 25 May 1976 subjecting to authorization
    imports into the United Kingdom of sacks and bags of woven polyolefin fabrics
    originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1229/76 de la Commission, du 25 mai 1976, soumettant
    à autorisation les importations au Royaume-Uni de sacs et sachets en tissus de
    polyoléfine originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1229/76 der Kommission vom 25. Mai 1976 zur Einführung
    der Genehmigungspflicht hinsichtlich der Einfuhr von Säcken und Beuteln aus Polyolefin-Geweben
    mit Ursprung in der Republik Korea in das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1229/76 af 25. maj 1976 om importtilladelser
