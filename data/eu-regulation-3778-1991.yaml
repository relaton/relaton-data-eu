title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3778/91 of 18 December 1991 determining
    the rate at which the components intended to ensure protection of cereals and
    rice processing in Portugal are to be dismantled and fixing the amount thereof
    for 1992
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3778/91 DE LA COMMISSION du 18 décembre 1991 fixant
    le rythme de démantèlement des éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l'' industrie de transformation applicable
    au Portugal ainsi que leurs montants pour l'' année 1992 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3778/91 DER KOMMISSION vom 18. Dezember 1991 über
    den Abbau des Schutzes der portugiesischen Verarbeitungsindustrie im Sektor Getreide
    und Reis für das Jahr 1992 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3778/91 af 18. december 1991 om afviklingstakten
    for de for Portugal gældende elementer, der inden for korn- og rissektoren skal
    sikre beskyttelsen af forarbejdningsindustrien, og om fastsættelse af beløbene
    for 1992
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3778/91 της Επιτροπής
    της 18ης Δεκεμβρίου 1991 περί καθορισμού του ρυθμού
    κατάργησης, για το 1992, των στοιχείων προς διασφάλιση
    καθώς και των ποσών των στοιχείων αυτών, στον
    τομέα των σιτηρών και του ρυζιού, της προστασίας
    της βιομηχανίας μεταποιήσεως στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3778/91 DELLA COMMISSIONE del 18 dicembre 1991 che
    fissa il ritmo di smantellamento degli elementi destinati a garantire la protezione
    dell'' industria di trasformazione nel settore dei cereali e del riso in Portogallo,
    nonché i relativi importi per il 1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3778/91 VAN DE COMMISSIE van 18 december 1991 tot
    vaststelling van het tempo waarin de voor 1992 in Portugal geldende elementen
    ter bescherming van de verwerkende industrie in de sector granen en rijst worden
    afgebroken, alsmede van de bedragen van deze elementen voor het jaar 1992 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3778/91 DA COMISSÃO de 18 de Dezembro de 1991 que
    fixa o ritmo de desmantelamento dos elementos destinados a assegurar, no sector
    dos cereais e do arroz, a protecção da indústria de transformação aplicável
    em Portugal e os respectivos montantes para 1992 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3778/91 DE LA COMISIÓN de 18 de diciembre de 1991
    por el que se fija el ritmo de desmantelamiento de los elementos destinados a
    garantizar, en el sector de los cereales y del arroz, la protección de la industria
    de transformación aplicable en Portugal y sus importes para el año 1992 #'
  type: main
