    2022 modifiant le règlement (UE) 2017/746 en ce qui concerne les dispositions
    transitoires relatives à certains dispositifs médicaux de diagnostic in vitro
    et l’application différée des conditions en matière de dispositifs fabriqués
    et utilisés en interne
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/112 des Europäischen Parlaments und des Rates vom
