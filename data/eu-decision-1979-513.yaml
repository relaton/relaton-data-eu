title:
- language: en
  script: Latn
  content: '79/513/EEC: Commission Decision of 14 May 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''woven industrial and occupational
    clothing ; women''s, girls''and infants''woven aprons, smock-overalls and other
    industrial clothing (whether or not also suitable for domestic use), of wool,
    of cotton or of man-made textile fibres, falling within heading No ex 61.01 and
    subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.01-13, 15,
    17, 19 ; 61.02-12, 14) (category 76), originating in Bulgaria and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/513/CEE: Décision de la Commission, du 14 mai 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de travail, tissés, pour
    hommes et garçonnets; tabliers, blouses et autres vêtements de travail, tissés,
    pour femmes, fillettes et jeunes enfants, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles des positions ex 61.01 et sous-position ex 61.02
    B du tarif douanier commun (codes Nimexe: 61.01-13, 15, 17, 19; 61.02-12, 14)
    (catégorie 76) originaires de Bulgarie et mis en libre pratique dans les autres
    États membres (Les textes en langues française et néerlandaise sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/513/EWG: Entscheidung der Kommission vom 14. Mai 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Bulgarien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Arbeits- und Berufskleidung aus Geweben, für Männer
    und Knaben; Schürzen, Kittel und andere Arbeits- und Berufskleidung aus Geweben,
    für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Tarifnummern ex 61.01 und ex 61.02 B des Geminsamen
    Zolltarifs (NIMEXE-Kennziffern 61.01-13; 15; 17; 19 und 61.02-12; 14) (Kategorie
    76) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/513/EØF: Kommissionens beslutning af 14. maj 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage arbejds- og beskyttelsespåklædning,
    vævet, til mænd og drenge ; kitler og forklæder samt anden arbejds- og beskyttelsesbeklædning,
    vævet til kvinder, piger og småbørn, af uld, bomuld eller syntetiske eller
    regenererede fibre, som henhører under pos. ex 61.01 ex 61.02 B i den fælles
    toldtarif (NIMEXE-nummer 61.01-13, 15, 17, 19 ; 61.02-12, 14 ; kategori 76), har
    oprindelse i Bulgarien og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/513/CEE: Decisione della Commissione, del 14 maggio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario gli indumenti da lavoro, tessuti, per
    uomo e per ragazzo, e grembiuli, camiciotti e altri indumenti da lavoro, tessuti,
    per donna, per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa
    doganale comune (codici Nimexe: 61.01-13, 15, 17, 19; 61.02-12, 14) (categoria
    76), originari della Bulgaria e messi in libera pratica negli altri Stati membri
    (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/513/EEG: Beschikking van de Commissie van 14 mei 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd geweven werk- en bedrijfskleding voor heren en jongens, geweven schorten,
    jasschorten en andere werkkleding voor dames, meisjes, en kinderen, van wol, van
    katoen of van synthetische of kunstmatige textielvezels, van de posten ex 61.01
    en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01- 13, 15,
    17, 19 ; 61.02-12, 14) (categorie 76), van oorsprong uit Bulgarije en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
