  content: Commission Regulation (EEC) No 2833/86 of 12 September 1986 re-establishing
    the levying of customs duties on protective gloves for all trades, falling within
    subheading 42.03 B I, originating in Thailand, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2833/86 de la Commission du 12 septembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux gants de
    protection pour tous métiers, de la sous-position 42.03 B I du tarif douanier
    commun, originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
