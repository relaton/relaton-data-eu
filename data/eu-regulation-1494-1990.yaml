title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1494/90 of 31 May 1990 derogating for the
    first and second quarters of 1990 from Regulation (EEC) No 2377/80 in respect
    of the issue of import licences under certain special arrangements in the beef
    and veal sector and amending Regulation (EEC) No 3834/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1494/90 de la Commission du 31 mai 1990 portant dérogation
    pour les premier et deuxième trimestres de 1990 au règlement (CEE) n° 2377/80
    en ce qui concerne la délivrance des certificats d'importation dans le cadre
    de certains régimes spéciaux dans le secteur de la viande bovine et modifiant
    le règlement (CEE) n° 3834/89
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1494/90 DER KOMMISSION vom 31. Mai 1990 zur Abweichung
    von der Verordnung (EWG) Nr. 2377/80 hinsichtlich der Erteilung von Einfuhrlizenzen
    im Rahmen von Sonderregelungen im ersten und zweiten Vierteljahr 1990 auf dem
    Sektor Rindfleisch und zur Aenderung der Verordnung (EWG) Nr. 3834/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1494/90 af 31. maj 1990 om undtagelse
    fra forordning (EØF) nr. 2377/80 for første og andet kvartal af 1990 for så
    vidt angår udstedelsen af importlicenser under visse særordninger for oksekødsektoren
    og om ændring af forordning (EØF) nr. 3834/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1494/90 της Επιτροπής
    της 31ης Μαΐου 1990 περί παρεκκλίσεως, για το πρώτο
    και δεύτερο τρίμηνο του 1990, από τον κανονισμό
    (ΕΟΚ) αριθ. 2377/80 όσον αφορά την έκδοση πιστοποιητικών
    εισαγωγής στα πλαίσια ορισμένων ειδικών καθεστώτων
    στον τομέα του βοείου κρέατος που τροποποιεί
    τον κανονισμό (ΕΟΚ) αριθ. 3834/89
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1494/90 DELLA COMMISSIONE del 31 maggio 1990 che deroga,
    per il primo e il secondo trimestre del 1990, al regolamento (CEE) n. 2377/80
    per quanto concerne il rilascio dei titoli d'importazione nell'ambito di regimi
    speciali nel settore delle carni bovine e che modifica il regolamento (CEE) n.
    3834/89
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1494/90 VAN DE COMMISSIE van 31 mei 1990 tot afwijking
    voor het eerste en het tweede kwartaal van 1990 van Verordening (EEG) nr. 2377/80
    ten aanzien van de afgifte van invoercertificaten in het kader van bepaalde bijzondere
    regelingen in de sector rundvlees en tot wijziging van Verordening (EEG) nr. 3834/89
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1494/90 DA COMISSAO de 31 de Maio de 1990 que derroga,
    relativamente ao primeiro e ao segundo trimestres de 1990, o Regulamento (CEE)
    n* 2377/80 no que respeita à emissao de autorizaçoes de importaçao no âmbito
    de certos regimes especiais no sector da carne de bovino e que altera o Regulamento
    (CEE) n* 3834/89
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1494/90 DE LA COMISION de 31 de mayo de 1990 por el
    que se establece que durante el primer y el segundo trimestre de 1990 no se aplicaran
    las disposiciones del Reglamento (CEE) no 2377/80 relativas a la expedicion de
    certificados de importacion en el marco de determinados regimenes especiales en
    el sector de la carne de bovino y por el que se modifica el Reglamento (CEE) no
    3834/89
  type: main
