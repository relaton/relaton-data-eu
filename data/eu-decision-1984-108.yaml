title:
- language: en
  script: Latn
  content: '84/108/EEC: Commission Decision of 16 February 1984 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '84/108/CEE: Décision de la Commission du 16 février 1984 autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '84/108/EWG: Entscheidung der Kommission vom 16. Februar 1984 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '84/108/EØF: Kommissionens beslutning af 16. februar 1984 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '84/108/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Φεβρουαρίου 1984 περί παροχής αδείας στα κράτη
    μέλη να εγκρίνουν προσωρινά την εμπορία δασικού
    πολλαπλασιαστικού υλικού το οποίο δεν ανταποκρίνεται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '84/108/CEE: Decisione della Commissione del 16 febbraio 1984 che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di moltiplicazione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '84/108/EEG: Beschikking van de Commissie van 16 februari 1984 houdende
    machtiging van de Lid-Staten om bosbouwkundig teeltmateriaal dat niet aan de eisen
    van Richtlijn 66/404/EEG van de Raad voldoet, tijdelijk tot de handel toe te laten'
  type: main
- language: pt
  script: Latn
  content: '84/108/CEE: Decisão da Comissão, de 16 de Fevereiro de 1984, que autoriza
    os Estados-membros a admitirem temporariamente a comercialização de materiais
    florestais de reprodução que não correspondam às exigências da Directiva
    66/404/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '84/108/CEE: Decisión de la Comisión, de 16 de febrero de 1984, por la
    que se autoriza a los Estados miembros para que admitan temporalmente la comercialización
    de materiales forestales de reproducción que no cumplan los requisitos de la
    Directiva 66/404/CEE del Consejo'
  type: main
