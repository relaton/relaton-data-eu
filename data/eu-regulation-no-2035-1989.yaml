title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2035/89 of 6 July 1989 re-establishing the
    levying of customs duties on woven fabrics of synthetic filament yarn, products
    of category 33 (order No 40.0330) and overcoats and jackets, knitted or crocheted,
    products of category 83 (order No 40.0830), originating in India to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2035/89 de la Commission du 6 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fils synthétiques de la catégorie 33 (numéro d'ordre 40.0330) et aux manteaux,
    vestes en bonneterie de la catégorie 83 (numéro d'ordre 40.0830), originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2035/89 DER KOMMISSION vom 6. Juli 1989 zur Wiedereinführung
    des Zollsatzes für Gewebe aus Garnen aus synthetischen Filamenten der Warenkategorie
    Nr. 33 (lfd. Nr. 40.0330) sowie Mäntel und Jacken, aus Gewirken, der Warenkategorie
    Nr. 83 (lfd. Nr. 40.0830) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2035/89 af 6. juli 1989 om genindførelse
    af opkrævning af toldafgifter for stoffer af garn af syntetiske filamenter under
    varekategori 33 (løbenummer 40.0330) samt frakker og jakker af trikotage under
    varekategori 83 (løbenummer 40.0830), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2035/89 της 6ης Ιουλίου
    1989 περί αποκαταστάσεως της εφαρμογής τελωνειακών
    δασμών για υφάσματα από συνθετικά νήματα, προϊόντα
    της κατηγορίας 33 (αύξων αριθμός 40.0330 ), και πανωφόρια,
    σακάκια, πλεκτά, προϊόντα της κατηγορίας 83
    ( αύξων αριθμός 40.0830 ), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2035/89 DELLA COMMISSIONE del 6 luglio 1989 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di filati di filamenti
    sintetici della categoria di prodotti n. 33 (numero d'' ordine 40.0330) e ai cappotti
    e giacche a maglia della categoria di prodotti n. 83 (numero d'' ordine 40.0830),
    originari dell'' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2035/89 VAN DE COMMISSIE van 6 juli 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische filamentgarens van de categorie van produkten nr. 33 (volgnummer
    40.0330), en op jassen en colbertjassen, van brei- of haakwerk, van de categorie
    van produkten nr. 83 (volgnummer 40.0830), van oorsprong uit India, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88
    van de Raad #'
  type: main
