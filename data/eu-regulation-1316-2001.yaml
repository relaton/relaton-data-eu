title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1316/2001 of 29 June 2001 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and establishing
    the forecast supply balance for the period 1 July to 31 December 2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1316/2001 de la Commission du 29 juin 2001 modifiant
    le règlement (CEE) n° 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet au 31 décembre 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1316/2001 der Kommission vom 29. Juni 2001 zur Änderung
    der Verordnung (EWG) Nr. 2999/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Erstellung der Versorgungsbilanz für den Zeitraum vom 1. Juli bis 31.
    Dezember 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1316/2001 af 29. juni 2001 om ændring
    af forordning (EØF) nr. 2999/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse, for så vidt angår
    perioden 1. juli-31. december 2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1316/2001 της Επιτροπής,
    της 29ης Ιουνίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2999/92 όσον αφορά τις λεπτομέρειες
    εφαρμογής του ειδικού καθεστώτος για τον εφοδιασμό
    της Μαδέρας με προϊόντα του τομέα των μεταποιημένων
    οπωροκηπευτικών και για τον καθορισμό του
    ισοζυγίου εφοδιασμού για την περίοδο από την
    1η Ιουλίου έως τις 31 Δεκεμβρίου 2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1316/2001, annettu 29 päivänä kesäkuuta 2001,
    Madeiran hedelmä- ja vihannesjalostealan tuotteiden erityisen hankintajärjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintataseen määrittämisestä 1 päivän heinäkuuta
    ja 31 päivän joulukuuta 2001 väliseksi ajaksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1316/2001 della Commissione, del 29 giugno 2001, recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera e che stabilisce il bilancio di approvvigionamento per il periodo dal
    1° luglio al 31 dicembre 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1316/2001 van de Commissie van 29 juni 2001 tot wĳziging
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met producten van de sector van op basis
    van groenten en fruit verwerkte producten en tot vaststelling van de voorzieningsbalans
    voor de periode van 1 juli tot en met 31 december 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1316/2001 da Comissão, de 29 de Junho de 2001, que
    altera o Regulamento (CEE) n.° 2999/92 que estabelece normas de execução do
    regime específico de abastecimento da Madeira em produtos do sector dos produtos
    transformados à base de frutas e produtos hortícolas, e determina a estimativa
    das necessidades de abastecimento para o período compreendido entre 1 de Julho
    e 31 de Dezembro de 2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1316/2001 de la Comisión, de 29 de junio de 2001,
    que modifica el Reglamento (CEE) n° 2999/92 por el que se establecen disposiciones
    de aplicación del régimen específico de abastecimiento a Madeira de productos
    del sector de las frutas y hortalizas transformadas y se establece el plan de
    abastecimiento para el período del 1 de julio al 31 de diciembre de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1316/2001 av den 29 juni 2001 om ändring
    av förordning (EEG) nr 2999/92 om tillämpningsföreskrifter för den särskilda
    försörjningsordningen för Madeira vad avser bearbetade produkter av frukt och
    grönsaker och om fastställande av försörjningsbalansen för perioden 1 juli
    till 31 december 2001
