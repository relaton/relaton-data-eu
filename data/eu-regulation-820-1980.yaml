title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 820/80 of 28 March 1980 re-establishing
    the levying of customs duties on other carpets, made up or not, products of category
    59 (code 0590), originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 820/80 de la Commission, du 28 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres tapis
    même confectionnés, de la catégorie de produits n° 59 (code 0590), originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 820/80 der Kommission vom 28. März 1980 über die
    Wiedereinführung des Zollsatzes für andere Teppiche, auch konfektioniert, der
    Warenkategorie Nr. 59 (Kennziffer 0590), mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 820/80 af 28. marts 1980 om genindførelse
    af opkrævning af toldafgifter for andre gulvtæpper (herunder gulvløbere og
    måtter), også konfektionerede, under kategori 59 (kode 0590), som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 820/80 della Commissione, del 28 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili agli altri tappeti, anche confezionati,
    della categoria di prodotti n. 59 (codice 0590), originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 820/80 van de Commissie van 28 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere tapijten,
    ook indien geconfectioneerd, van de categorie van produkten nr. 59 (codenummer
    0590), van oorsprong uit Joegoslavië waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
