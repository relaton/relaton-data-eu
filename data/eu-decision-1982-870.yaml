title:
- language: en
  script: Latn
  content: '82/870/EEC: Council Decision of 16 December 1982 extending the collection
    of information concerning the activities of carriers participating in cargo liner
    traffic in certain areas of operation, carried out under Decisions 79/4/EEC, 80/1181/EEC
    and 81/189/EEC'
  type: main
- language: fr
  script: Latn
  content: '82/870/CEE: Décision du Conseil, du 16 décembre 1982, prorogeant la
    collecte d'' informations sur les activités des transporteurs participant aux
    transports maritimes de ligne dans certaines zones d'' exploitation effectuée
    au titre des décisions 79/4/CEE, 80/1181/CEE et 81/189/CEE'
  type: main
- language: de
  script: Latn
  content: '82/870/EWG: Entscheidung des Rates vom 16. Dezember 1982 zur Verlängerung
    der gemäß den Entscheidungen 79/4/EWG, 80/1181/EWG und 81/189/EWG durchgeführten
    Einholung von Informationen über die Tätigkeiten von Reedereien, die an Frachtliniendiensten
    in bestimmten Fahrtgebieten teilnehmen'
  type: main
- language: da
  script: Latn
  content: '82/870/EØF: Rådets beslutning af 16. december 1982 om videreførelse
    af indsamlingen i henhold til beslutning 79/4/EØF, 80/1181/EØF og 81/189/EØF
    af oplysninger vedrørende rederivirksomhed i forbindelse med linjefragtfart i
    visse farter'
  type: main
- language: el
  script: Grek
  content: '82/870/EOK: Απόφαση τού Συμβουλίου τής 16ης Δεκεμβρίου
    1982 γιά τήν παράταση τής συλλογής πληροφοριών
    πού αφορούν τίς δραστηριότητες μεταφορέων
    πού συμμετέχουν στίς θαλάσσιες μεταφορές τακτικών
    γραμμών σέ ορισμένες περιοχές εκμεταλλεύσεως
    η οποία διενεργείται βάσει τών αποφάσεων 79/4/EOK,
    80/1181/EOK καί 81/189/EOK'
  type: main
- language: it
  script: Latn
  content: '82/870/CEE: Decisione del Consiglio, del 16 dicembre 1982, che proroga
    la raccolta di informazioni sulle attività dei trasportatori che partecipano
    ai trasporti marittimi di linea in talune zone d'' operazione, effettuata a norma
    delle decisioni 79/4/CEE, 80/1181/CEE e 81/189/CEE'
  type: main
- language: nl
  script: Latn
  content: '82/870/EEG: Beschikking van de Raad van 16 december 1982 houdende verlenging
    van het verzamelen van gegevens over de activiteiten van vervoerders die deelnemen
    aan de lijnvaart in bepaalde vaargebieden, overeenkomstig de Beschikkingen 79/4/EEG,
    80/1181/EEG en 81/189/EEG'
  type: main
- language: pt
  script: Latn
  content: '82/870/CEE: Decisão do Conselho, de 16 de Dezembro de 1982, que prorroga
    a recolha de informações sobre as actividades dos transportadores que participam
    nos transportes marítimos de linha em zonas de exploração, efectuada no âmbito
    das Decisões 79/4/CEE, 80/1181/CEE e 81/189/CEE'
  type: main
- language: es
  script: Latn
  content: '82/870/CEE: Decisión del Consejo, de 16 de diciembre de 1982, por la
    que se prorroga la recogida de información sobre las actividades de los transportistas
    que participan en los transportes marítimos de línea en determinadas zonas de
    explotación, efectuada con arreglo a las Decisiones 79/4/CEE, 80/1181/CEE y 81/189/CEE'
  type: main
