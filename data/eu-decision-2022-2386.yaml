    le marché et l’utilisation du produit biocide Biobor JF conformément au règlement
    (UE) no 528/2012 du Parlement européen et du Conseil [notifiée sous le numéro
    C(2022) 8673] (Les textes en langues allemande, anglaise, espagnole, estonienne,
