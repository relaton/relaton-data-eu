title:
- language: en
  script: Latn
  content: '2005/843/EC: Council Decision of 8 November 2005 establishing, in accordance
    with Article 104(8) of the Treaty establishing the European Community, that the
    action taken by Hungary in response to the recommendation of the Council of 8
    March 2005 pursuant to Article 104(7) of the Treaty is proving to be inadequate'
  type: main
- language: fr
  script: Latn
