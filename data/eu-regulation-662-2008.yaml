  script: Latn
  content: Council Regulation (EC) No 662/2008 of 8 July 2008 amending Regulation
    (EC) No 442/2007 imposing a definitive anti-dumping duty on imports of ammonium
    nitrate originating in Ukraine following an expiry review pursuant to Article
    11(2) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
