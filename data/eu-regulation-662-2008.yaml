    a Regulamentului (CE) nr. 442/2007 de impunere a unei taxe antidumping definitive
    la importurile de azotat de amoniu originar din Ucraina în urma unei reexaminări
    efectuate în perspectiva expirării măsurilor, în temeiul articolului 11 alineatul
    (2) din Regulamentul (CE) nr. 384/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 662/2008 z 8. júla 2008 , ktorým sa mení a
