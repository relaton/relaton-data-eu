  script: Latn
  content: '2000/744/EC: Commission Decision of 30 October 2000 amending Decision
    97/634/EC accepting undertakings offered in connection with the anti-dumping and
    anti-subsidy proceedings concerning imports of farmed Atlantic salmon originating
    in Norway (notified under document number C(2000) 3150)'
  type: main
- language: fr
  script: Latn
  content: '2000/744/CE: Décision de la Commission du 30 octobre 2000 modifiant la
    décision 97/634/CE portant acceptation des engagements offerts dans le cadre
    de la procédure antidumping et de la procédure antisubventions concenant les
    importations de saumons atlantiques d''élevage originaires de Norvège [notifiée
    sous le numéro C(2000) 3150]'
  type: main
