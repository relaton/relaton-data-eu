title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1114/83 of 5 May 1983 re-establishing the
    levying of customs duties on travel goods of other materials, falling within subheading
    42.02 B and originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1114/83 de la Commission du 5 mai 1983 portant rétablissement
    de la perception des droits de douane applicables aux articles de voyage en autres
    matières, de la sous-position 42.02 B du tarif douanier commun, originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1114/83 der Kommission vom 5. Mai 1983 zur Wiedereinführung
    der Erhebung der Zölle für Reiseartikel aus anderen Stoffen der Tarifstelle
    42.02 B, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1114/83 af 5. maj 1983 om genindførelse
    af opkrævning af told for rejseartikler, andre varer, henhørende under pos.
    42.02 B og med oprindelse i Indien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1114/83 της Επιτροπής
    της 5ης Μαΐου 1983 περί αποκαταστάσεως της εφαρμογής
    των δασμών για τα είδη ταξειδίου εξ ετέρων
    υλών της διακρίσεως 42.02 Β του Κοινού Δασμολογίου,
    καταγωγής Ινδίας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1114/83 della Commissione del 5 maggio 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli oggetti da viaggio di altre
    materie, della sottovoce 42.02 B della tariffa doganale comune, originari dell'
    India, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1114/83 van de Commissie van 5 mei 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op reisartikelen
    van andere stoffen van postonderverdeling 42.02 B, van oorsprong uit India, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
