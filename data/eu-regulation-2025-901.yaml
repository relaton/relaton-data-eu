    a outras opções de tratamento disponíveis para espécies equinas, e cujo intervalo
    de segurança para essas espécies é de seis meses, e que revoga o Regulamento
    (CE) n.o 1950/2006
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/901 al Comisiei din 19 mai
