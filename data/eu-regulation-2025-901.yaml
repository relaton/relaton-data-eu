    donose dodatnu kliničku korist u usporedbi s drugim dostupnim mogućnostima liječenja
    životinja vrste kopitara i za koje karencija za životinje vrste kopitara iznosi
    šest mjeseci te o stavljanju izvan snage Uredbe (EZ) br. 1950/2006
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/901 végrehajtási rendelete (2025. május 19.)
