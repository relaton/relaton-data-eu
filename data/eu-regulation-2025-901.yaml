    pentru ecvidee este de șase luni, și de abrogare a Regulamentului (CE) nr. 1950/2006
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/901 z 19. mája 2025, ktorým
    sa zostavuje zoznam látok nevyhnutných na liečbu koňovitých alebo s väčším
    klinickým prínosom v porovnaní s inými možnosťami liečby koňovitých,
    pri ktorých je ochranná lehota pre koňovité šesť mesiacov, a ktorým sa
    zrušuje nariadenie (ES) č. 1950/2006
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/901 z dne 19. maja 2025 o določitvi
    seznama snovi, ki so bistvenega pomena za zdravljenje enoprstih kopitarjev ali
    pomenijo dodano klinično korist v primerjavi z drugimi možnostmi zdravljenja,
