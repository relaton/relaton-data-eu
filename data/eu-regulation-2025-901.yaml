title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/901 of 19 May 2025 establishing
    a list of substances which are essential for the treatment of equine species,
    or which bring added clinical benefit compared to other treatment options available
    for equine species and for which the withdrawal period for equine species shall
    be six months and repealing Regulation (EC) No 1950/2006
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/901 de la Commission du 19 mai 2025
    établissant une liste des substances qui sont essentielles pour le traitement
    des équidés ou qui apportent un bénéfice clinique supplémentaire par rapport
    aux autres possibilités de traitement disponibles pour les équidés et pour
    lesquelles le temps d’attente pour les équidés est de six mois et abrogeant
    le règlement (CE) no 1950/2006
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/901 der Kommission vom 19. Mai 2025
    zur Erstellung einer Liste von Stoffen, die für die Behandlung von Equiden wesentlich
    sind oder gegenüber anderen verfügbaren Behandlungsoptionen für Equiden einen
    zusätzlichen klinischen Nutzen aufweisen und bei denen die Wartezeit für Equiden
    sechs Monate beträgt, sowie zur Aufhebung der Verordnung (EG) Nr. 1950/2006
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/901 на Комисията
    от 19 май 2025 година за съставяне на списък на
    веществата, които са от съществено значение
    за лечението на еднокопитни животни или които
    имат допълнителна клинична полза в сравнение
    с други възможности за лечение на еднокопитни
    животни и при които карентният срок за еднокопитни
    животни е шест месеца, и за отмяна на Регламент
    (ЕО) № 1950/2006
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/901 ze dne 19. května 2025,
    kterým se stanoví seznam látek, které jsou nezbytné pro léčbu koňovitých
    nebo které přinášejí vyšší klinický prospěch ve srovnání s jinými
    možnostmi léčby dostupnými pro koňovité a pro které je ochranná lhůta
    pro koňovité šest měsíců, a kterým se zrušuje nařízení (ES) č. 1950/2006
  type: main
- language: da
  script: Latn
