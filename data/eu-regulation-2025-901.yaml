    andre tilgængelige behandlingsmuligheder for dyr af hestefamilien, og for hvilke
    tilbageholdelsestiden for dyr af hestefamilien skal være seks måneder, og om
    ophævelse af forordning (EF) nr. 1950/2006
  type: main
