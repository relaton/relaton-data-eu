    tekintetében rendelkezésre álló egyéb kezelési lehetőségekkel összehasonlítva
    járulékos klinikai előnnyel járó, és a lófélékre vonatkozóan hat hónapos
    élelmezés-egészségügyi várakozási idő hatálya alá tartozó anyagok jegyzékének
    összeállításáról, valamint az 1950/2006/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/901 della Commissione, del 19 maggio
    2025, che stabilisce un elenco di sostanze che sono essenziali per il trattamento
    della specie equina o che comportano un beneficio clinico supplementare rispetto
    ad altri tipi di trattamento disponibili per la specie equina e per le quali il
    tempo di attesa è di sei mesi e che abroga il regolamento (CE) n. 1950/2006
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/901 (2025. gada 19. maijs), ar
    ko izveido tādu vielu sarakstu, kuras ir būtiskas zirgu dzimtas dzīvnieku ārstēšanai
    vai kuras salīdzinājumā ar citām attiecībā uz zirgu dzimtas dzīvniekiem
    pieejamām ārstēšanas izvēlēm dod papildu klīniskus ieguvumus un kuru gadījumā
    attiecībā uz zirgu dzimtas dzīvniekiem noteiktais zāļu izdalīšanās periods
    ir seši mēneši, un atceļ Regulu (EK) Nr. 1950/2006
  type: main
- language: lt
