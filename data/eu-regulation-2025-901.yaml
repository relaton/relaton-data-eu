    de los équidos, o que aportan un beneficio clínico añadido respecto de otras
    opciones de tratamiento disponibles para los équidos y para las que el tiempo
    de espera debe ser de seis meses y por el que se deroga el Reglamento (CE) n.o
    1950/2006
  type: main
