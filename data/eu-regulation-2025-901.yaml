    kuriuo nustatomas medžiagų, kurios yra būtinos arklinių šeimos gyvūnams
    gydyti arba kurios teikia papildomos klinikinės naudos, palyginti su kitomis
    arklinių šeimos gyvūnų gydymo galimybėmis, ir kurių išlauka arklinių šeimos
    gyvūnams yra šeši mėnesiai, sąrašas ir panaikinamas Reglamentas (EB) Nr.
    1950/2006
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/901 tad-19
    ta’ Mejju 2025 li jistabbilixxi lista ta’ sustanzi li huma essenzjali għat-trattament
    tal-ispeċijiet ekwini, jew li jġibu benefiċċju kliniku miżjud meta mqabbla
    ma’ għażliet oħra ta’ trattament disponibbli għall-ispeċijiet ekwini
    u li għalihom il-perjodu ta’ stennija għall-ispeċijiet ekwini għandu jkun
    ta’ 6 xhur, u li jħassar ir-Regolament (KE) Nru 1950/2006
  type: main
- language: nl
  script: Latn
