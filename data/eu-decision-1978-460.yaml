---
id: EUDecision1978460
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 May 1978 authorizing the French Republic not
    to apply Community treatment to woven fabrics of jute or of other textile bast
    fibres, sacks and bags of a kind used for the packing of goods, of jute or of
    other textile bast fibres of heading No 57.03, falling within heading No 57.10
    or subheading 62.03 ex A of the Common Customs Tariff, originating in India and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/460/CEE: Décision de la Commission, du 10 mai 1978, autorisant la
    République française à exclure du traitement communautaire les tissus de jute
    ou d''autres fibres textiles libériennes et sacs et sachets d''emballage neufs
    en tissus de jute ou d''autres fibres textiles libériennes du n° 57.03 de la
    position 57.10 et de la sous-position 62.03 Ex A du Tarif douanier commun, originaires
    de l''Inde et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Mai 1978, mit der die Französische
    Republik ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Jute oder anderen textilen Bastfasern
    der Tarifnummer 57.03 der Tarifnummern 57.10 und 62.03 ex A des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. maj 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af jute eller andre
    bastfibre, sække og poser til emballage af jute eller andre bastfibre henhørende
    under pos. 57.03, som henhører under pos. 57.10 og 62.03 ex A i den fælles toldtarif,
    har oprindelse i Indien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 maggio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di iuta o di altre
    fibre tessili liberiane della voce 57.03, della voce 57.10 della tariffa doganale
    comune, e i sacchi e sacchetti da imballaggio, nuovi, di tessuti di iuta o di
    altre fibre tessili liberiane della voce 57.03, della sottovoce 62.03 ex A della
    tariffa doganale comune, originari dell'India e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 mei 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van jute of van andere bastvezels, zakken voor verpakkingsdoeleinden
    van weefsels van jute of van andere bastvezels bedoeld bij post 57.03, van de
    posten 57.10 en 62.03 ex A van het gemeenschappelijk douanetarief, van oorsprong
    uit India en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
