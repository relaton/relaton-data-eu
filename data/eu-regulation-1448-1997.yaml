title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1448/97 of 24 July 1997 amending Regulation
    (EEC) No 377/93 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in Articles 35, 36 and 39 of Council
    Regulation (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1448/97 de la Commission du 24 juillet 1997 modifiant
    le règlement (CEE) nº 377/93 établissant les modalités d'application relatives
    à l'écoulement des alcools obtenus au titre des distillations visées aux articles
    35, 36 et 39 du règlement (CEE) nº 822/87 du Conseil et détenus par les organismes
    d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1448/97 der Kommission vom 24. Juli 1997 zur Änderung
    der Verordnung (EWG) Nr. 377/93 mit Durchführungsbestimmungen für den Absatz
    von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der Verordnung
    (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1448/97 af 24. juli 1997 om ændring
    af forordning (EØF) nr. 377/93 om gennemførelsesbestemmelser for afsætning
