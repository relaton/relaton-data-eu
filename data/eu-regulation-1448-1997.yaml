    κανονισμού (ΕΟΚ) αριθ. 377/93, για τη θέσπιση των
    λεπτομερειών εφαρμογής σχετικά με τη διάθεση
    των αλκοολών που λαμβάνονται από τις αποστάξεις
    που αναφέρονται στα άρθρα 35, 36 και 39 του κανονισμού
    (ΕΟΚ) αριθ. 822/97 του Συμβουλίου και βρίσκονται
    στην κατοχή των οργανισμών παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1448/97, annettu 24 päivänä heinäkuuta 1997,
