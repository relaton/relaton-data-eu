  script: Latn
  content: Direttiva delegata 2014/72/UE della Commissione, del 13 marzo 2014 , che
    modifica, adattandolo al progresso tecnico, l'allegato III della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un'esenzione relativa
    al piombo nelle saldature e nelle finiture delle terminazioni di componenti elettrici
    ed elettronici nonché nelle finiture delle schede a circuito stampato utilizzate
    nei moduli di accensione e in altri sistemi elettrici ed elettronici di controllo
    del motore
  type: main
