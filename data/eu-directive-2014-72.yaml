    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla ołowiu w spoiwach
    lutowniczych i wykończeniach końcówek elektrycznych i elektronicznych części
    składowych oraz wykończeniach płytek obwodów drukowanych wykorzystywanych
