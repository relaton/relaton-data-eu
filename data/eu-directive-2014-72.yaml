    III der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Loten und Anschlussbeschichtungen von elektrischen
    und elektronischen Bauteilen und Beschichtungen von Leiterplatten zur Verwendung
    in Zündungsmodulen und anderen elektrischen und elektronischen Motorsteuerungssystemen
  type: main
