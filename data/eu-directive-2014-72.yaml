  script: Latn
  content: Delegirana direktiva Komisije 2014/72/EU оd 13. ožujka 2014. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga III. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za olovo u lemu i završnim obradama električnih
    i elektroničkih komponenti i obradama tiskanih pločica koje se koriste u modulima
    paljenja i drugim sustavima kontrole za električne i elektroničke motore s unutarnjim
    izgaranjem Tekst važan za EGP
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/72/EU felhatalmazáson alapuló irányelve ( 2014. március
    13. ) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a gyújtásmodulokban és a belső égésű motorok egyéb elektromos és elektronikus
    vezérlőrendszereiben használt elektromos és elektronikus alkatrészek forraszanyagában
    és védőbevonatában, valamint az ilyen modulokban és motorokban található
    nyomtatott áramköri lapok bevonatában lévő ólom mentesítése tekintetében,
    a műszaki fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
