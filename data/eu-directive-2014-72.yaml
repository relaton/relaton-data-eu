- language: en
  script: Latn
  content: Commission Delegated Directive 2014/72/EU of 13 March 2014 amending, for
    the purposes of adapting to technical progress, Annex III to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in solders and termination finishes of electrical and electronic components and
    finishes of printed circuit boards used in ignition modules and other electrical
    and electronic engine control systems
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/72/UE de la Commission du 13 mars 2014 modifiant,
    aux fins de son adaptation au progrès technique, l'annexe III de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les soudures et finitions des raccordements des composants
    électriques ou électroniques et les finitions des cartes de circuit imprimé,
    qui sont utilisés dans les modules d'allumage et autres systèmes de commande
    électrique ou électronique des moteurs
  type: main
- language: de
  script: Latn
