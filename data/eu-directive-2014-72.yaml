    2011/65/ES III pielikumu attiecībā uz atbrīvojumu svina lietošanai tādos
    lodmetālos un tādu elektrisko un elektronisko detaļu savienojumu pārklājumos
    un drukātu shēmas plašu pārklājumos, ko izmanto aizdedzes blokos un citās
    elektriskās un elektroniskās motora vadības sistēmās
  type: main
