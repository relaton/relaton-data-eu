title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1573/92 of 19 June 1992 re-establishing
    the levying of customs duties on products falling within CN code 3923 21 00, originating
    in Malaysia, to which the preferential arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1573/92 de la Commission du 19 juin 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 3923
    21 00 originaires de Malaysia, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1573/92 DER KOMMISSION vom 19. Juni 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3923 21 00 mit Ursprung in
    Malaysia, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1573/92 af 19. juni 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3923 21 00 og med oprindelse
    i Malaysia, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
