title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3295/75 of the Commission of 18 December 1975 amending
    Regulation (EEC) No 2115/75 laying down in respect of the 1975/76 wine-growing
    year detailed rules for applying the obligation to distil the by-products of wine-making
    and repealing Regulation (EEC) No 2179/74
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3295/75 de la Commission, du 18 décembre 1975, modifiant
    le règlement (CEE) n° 21 15/75 relatif aux modalités d'application de l'obligation
    de distiller les sous-produits de la vinification pour la campagne 1975/1976 et
    abrogeant le règlement (CEE) n° 2179/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3295/75 der Kommission vom 18. Dezember 1975 zur Änderung
    der Verordnung (EWG) Nr. 2115/75 über Durchführungsbestimmungen für die Verpflichtung
    zur Destillation von Nebenerzeugnissen der Weinbereitung im Wirtschaftsjahr 1975/1976
    und zur Aufhebung der Verordnung (EWG) Nr. 2179/74
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3295/75 af 18. december 1975 om ændring
    af forordning (EØF) nr. 2115/75 om gennemførelsesbestemmelser for forpligtelsen
    til at destillere biprodukter ved vinfremstilling i produktionsåret 1975/1976
    og om ophævelse af forordning (EØF) nr. 2179/74
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3295/75 della Commissione, del 18 dicembre 1975, che
    modifica il regolamento (CEE) n. 2115/75, che stabilisce le modalità di applicazione
    dell'obbligo di distillare i sottoprodotti della vinificazione per la campagna
    viticola 1975/1976 e abroga il regolamento (CEE) n. 2179/74
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3295/75 van de Commissie van 18 december 1975 tot
    wijziging van Verordening (EEG) nr. 2115/75 houdende uitvoeringsbepalingen inzake
    de verplichte distillatie van de bijprodukten van de wijnbereiding in het wijnoogstjaar
    1975/1976 en houdende intrekking van Verordening (EEG) nr. 2179/74
  type: main
