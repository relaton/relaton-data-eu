title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2019/372 of 5 March 2019 authorising
    France to apply a reduced rate of taxation to unleaded petrol used as motor fuel
    and consumed in Corsican departments in accordance with Article 19 of Directive
    2003/96/EC
  type: main
- language: fr
  script: Latn
