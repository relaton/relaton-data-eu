  content: Council Regulation (Euratom, ECSC, EEC) No 3084/78 of 21 December 1978
    adjusting the remuneration and pensions of officials and other servants of the
    European Communities and the weightings applied thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 3084/78 du Conseil, du 21 décembre
    1978, portant adaptation des rémunérations et des pensions des fonctionnaires
    et autres agents des Communautés européennes ainsi que des coefficients correcteurs
    dont sont affectées ces rémunérations et pensions
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom, EGKS, EWG) Nr. 3084/78 des Rates vom 21. Dezember
