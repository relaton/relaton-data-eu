    e degli altri agenti delle Comunità europee, nonché dei coefficienti correttori
    applicabili a tali retribuzioni e pensioni
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom, EGKS, EEG) nr. 3084/78 van de Raad van 21 december
    1978 houdende aanpassing van de bezoldigingen en de pensioenen van de ambtenaren
    en andere personeelsleden der Europese Gemeenschappen, alsmede van de aanpassingscoëfficiënten
    welke van toepassing zijn op deze bezoldigingen en pensioenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (Euratom, CECA, CEE) n.° 3084/78 do Conselho, de 21 de Dezembro
    de 1978, que adapta as remunerações e pensões dos funcionários e dos outros
    agentes das Comunidades Europeias, assim como coeficientes de correcção a que
    estão sujeitas as mesmas remunerações e pensões
  type: main
- language: es
  script: Latn
