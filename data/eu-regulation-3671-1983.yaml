title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3671/83 of 19 December 1983 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the period
    1 January to 31 December 1984
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3671/83 de la Commission du 19 décembre 1983 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    période allant du 1er janvier au 31 décembre 1984, intervenant dans le calcul
    de la compensation financière et de l' avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3671/83 der Kommission vom 19. Dezember 1983 zur Festsetzung
    des Pauschalwerts der in der Zeit vom 1. Januar bis 31. Dezember 1984 aus dem
    Handel genommenen Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs
    und des entsprechenden Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3671/83 af 19. december 1983 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i perioden fra den 1. januar til den 31. december 1984
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3671/83 της Επιτροπής
    της 19ης Δεκεμβρίου 1983 περί καθορισμού της κατ'
    αποκοπή αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την περίοδο από 1 Ιανουαρίου
    έως 31 Δεκεμβρίου 1984, η οποία παρεμβαίνει στον
    υπολογισμό της χρηματικής αντιστάθμισης και
    της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3671/83 della Commissione del 19 dicembre 1983 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nel periodo
    dal 1º gennaio al 31 dicembre 1984
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3671/83 van de Commissie van 19 december 1983 betreffende
    de vaststelling van de forfaitaire waarde van de in de periode van 1 januari tot
    en met 31 december 1984 uit de markt genomen visserijprodukten voor de berekening
    van de financiële vergoeding en het hierop betrekking hebbende voorschot
