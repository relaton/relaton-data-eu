title:
- language: fr
  script: Latn
  content: Règlement n 508/67/CEE de la Commission, du 30 août 1967, portant modification
    du règlement n 235/67/CEE en ce qui concerne là fixation à l'avance de la prime
    de dénaturation pour le sucre et les mesures de contrôle applicables en cas
    de dénaturation du sucre dans un autre État membre
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 508/67/EWG der Kommission vom 30. August 1967 zur Änderung
    der Verordnung Nr. 235/67/EWG hinsichtlich der Festsetzung im voraus der Denaturierungsprämie
    für Zucker und bezüglich der KontrollmaDnahmen bei der Denaturierung von Zucker
    in einem anderen Mitgliedstaat
  type: main
- language: it
  script: Latn
  content: Regolamento n. 508/67/CEE della Commissione, del 30 agosto 1967, che modifica
    il regolamento n. 235/67/CEE per quanto riguarda la fissazione preventiva del
    premio di denaturazione per lo zucchero, nonché le misure di controllo applicabili
    in caso di denaturazione dello zucchero in altro Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening no. 508/67/EEG van de Commissie van 30 augustus 1967 houdende
    wijziging van Verordening no. 235/67/EEG met betrekking tot het van tevoren vaststellen
    van de denatureringspremie voor suiker en met betrekking tot de controlemaatregelen
    bij denaturering van suiker in een andere Lid-Staat
  type: main
