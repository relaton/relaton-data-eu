title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1346/84 of 15 May 1984 amending Regulation
    (EEC) No 349/84 suspending tariff concessions and increasing duties under the
    Common Customs Tariff with regard to certain products originating in the United
    States of America, and establishing quantitative restrictions with regard to other
    products originating in that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1346/84 du Conseil du 15 mai 1984 modifiant le règlement
    (CEE) no 349/84 portant suspension de concessions tarifaires et relèvement des
    droits du tarif douanier commun applicables à certains produits originaires des
    États-Unis d' Amérique et instituant des restrictions quantitatives applicables
    à d' autres produits originaires de ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1346/84 des Rates vom 15. Mai 1984 zur Änderung der
    Verordnung (EWG) Nr. 349/84 betreffend die Aufhebung von Zollzugeständnissen
    und die Erhöhung der Zölle des Gemeinsamen Zolltarifs für die Einfuhr bestimmter
    Erzeugnisse mit Ursprung in den Vereinigten Staaten von Amerika und die Einführung
    mengenmäßiger Beschränkungen für andere Erzeugnisse mit Ursprung in diesem
    Land
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1346/84 af 15. maj 1984 om ændring af forordning
    (EØF) nr. 349/84 om suspension af toldindrømmelser og forhøjelse af satserne
    i den fælles toldtarif for visse varer med oprindelse i Amerikas Forenede Stater
    og om indførelse af kvantitative restriktioner for andre varer med oprindelse
    i dette land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1346/84 του Συμβουλίου
    της 15ης Μαΐου 1984 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 349/84 για την αναστολή των δασμολογικών
    παραχωρήσεων και την αύξηση των δασμών του
    Κοινού Δασμολογίου που εφαρμόζονται σε ορισμένα
    προϊόντα καταγωγής Ηνωμένων Πολιτειών Αμερικής
    και για την επιβολή ποσοτικών περιορισμών
    σε άλλα προϊόντα καταγωγής της χώρας αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1346/84 del Consiglio del 15 maggio 1984 che modifica
    il regolamento (CEE) n. 349/84 recante sospensione delle concessioni tariffarie
    e aumentato dei dazi della tariffa doganale comune applicabili a taluni prodotti
    originari degli Stati Uniti d' America e recante istituzione delle restrizioni
    quantitative applicabili ad altri prodotti originari di detto paese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1346/84 van de Raad van 15 mei 1984 tot wijziging
    van Verordening (EEG) nr. 349/84 houdende schorsing van tariefconcessies en verhoging
    van de rechten van het gemeenschappelijk douanetarief voor bepaalde produkten
    van oorsprong uit de Verenigde Staten van Amerika en houdende instelling van kwantitatieve
    beperkingen voor andere produkten van oorsprong uit dat land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1346/84 do Conselho, de 15 de Maio de 1984, que
    altera o Regulamento (CEE) n.° 349/84 relativo à suspensão das concessões
    pautais e ao agravamento dos direitos da pauta aduaneira comum aplicáveis a certos
    produtos originários dos Estados Unidos da América e que institui restrições
    quantitativas aplicáveis a outros produtos originários desse país
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1346/84 del Consejo, de 15 de mayo de 1984, por el
    que se modifica el Reglamento (CEE) n° 349/84 por el que se suspenden las concesiones
    arancelarias y se elevan los derechos del arancel aduanero común aplicables a
    ciertos productos originarios de los Estados Unidos de América y se establecen
    restricciones cuantitativas con respecto a otros productos originarios de este
    país
  type: main
