title:
- language: en
  script: Latn
  content: '92/543/EEC: Council Decision of 23 November 1992 authorizing the Federal
    Republic of Germany to apply a measures derogating from Article 2 (1), read in
    conjunction with Article 13 B (d) (1) and (2), of the Sixth Directive 77/388/EEC
    on the harmonization of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '92/543/CEE: Décision du Conseil, du 23 novembre 1992, autorisant la République
    fédérale d''Allemagne à appliquer une mesure dérogeant à l''article 2 point
    1, en liaison avec l''article 13 titre B point d) 1 et 2, de la sixième directive
    77/388/CEE en matière d''harmonisation des législations des États membres relatives
    aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '92/543/EWG: Entscheidung des Rates vom 23. November 1992 zur Ermächtigung
    der Bundesrepublik Deutschland, eine von Artikel 2 Nummer 1 in Verbindung mit
    Artikel 13 Teil B Buchstabe d) Nummern 1 und 2 der Sechsten Richtlinie 77/388/EWG
    zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    abweichende Maßnahme anzuwenden'
  type: main
- language: da
  script: Latn
  content: '92/543/EØF: Rådets beslutning af 23. november 1992 om bemyndigelse af
    Forbundsrepublikken Tyskland til at anvende en foranstaltning, der fraviger artikel
    2, nr. 1, sammenholdt med artikel 13, afsnit B, litra d), nr. 1 og 2, i sjette
    direktiv 77/388/EØF om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '92/543/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Νοεμβρίου 1992 με την οποία επιτρέπεται στην
    Ομοσπονδιακή Δημοκρατία της Γερμανίας να εφαρμόσει
    μέτρο κατά παρέκκλιση του άρθρου 2 σημείο 1,
    σε συνδυασμό με το άρθρο 13 τίτλος Β στοιχείο
    δ) σημεία 1 και 2, της έκτης οδηγίας 77/388/ΕΟΚ περί
    εναρμονίσεως των νομοθεσιών των κρατών μελών
    των σχετικών με τους φόρους κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '92/543/CEE: Decisione del Consiglio, del 23 novembre 1992, che autorizza
    la Repubblica federale di Germania ad applicare una misura di deroga all'' articolo
    2, punto 1, in collegamento con l'' articolo 13, parte B, lettera d), punti 1
    e 2 della sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni
    degli Stati membri relative alle imposte sulla cifra di affari'
  type: main
- language: nl
  script: Latn
  content: '92/543/EEG: Beschikking van de Raad van 23 november 1992 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd een maatregel te treffen die afwijkt van artikel 2,
    punt 1, juncto artikel 13, titel B, onder d), punten 1 en 2, van Zesde Richtlijn
    77/388/EEG betreffende de harmonisatie van de wetgevingen der Lid-Staten inzake
    omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '92/543/CEE: Decisão do Conselho, de 23 de Novembro de 1992, que autoriza
