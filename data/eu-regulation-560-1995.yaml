title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 560/95 of 14 March 1995 deducting from the
    quantitative limits on import of textile products of categories 4 and 5 originating
    in the People' s Republic of China amounts corresponding to those imported into
    the Community in circumvention of the Agreement between the European Community
    and the People' s Republic of China on trade in textile products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 560/95 de la Commission, du 14 mars 1995, déduisant
    des limites quantitatives aux importations de produits textiles des catégories
    4 et 5 originaires de la République populaire de Chine, les montants correspondant
    à ceux importés dans la Communauté par détournement de l'accord entre la Communauté
    européenne et la République populaire de Chine sur le commerce des produits
    textiles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 560/95 der Kommission vom 14. März 1995 zur Kürzung
    der Höchstmengen für die Einfuhr von Textilwaren der Kategorien 4 und 5 mit
    Ursprung in der Volksrepublik China entsprechend den unter Umgehung des Abkommens
    zwischen der Europäischen Wirtschaftsgemeinschaft und der Volksrepublik China
    über den Handel mit Textilwaren in die Gemeinschaft eingeführten Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 560/95 af 14. marts 1995 om afskrivning
    på de kvantitative importlofter for tekstilvarer af kategori 4 og 5 med oprindelse
    i Den Kinesiske Folkerepublik af mængder svarende til dem, der er indført i
    Fællesskabet ved omgåelse af aftalen mellem Det Europæiske Fællesskab og Den
    Kinesiske Folkerepublik om handel med tekstilvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 560/95 της Επιτροπής
    της 14ης Μαρτίου 1995 για την αφαίρεση από τα ποσοτικά
    όρια στις εισαγωγές κλωστοϋφαντουργικών προϊόντων
    των κατηγοριών 4 και 5 καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, ποσοτήτων που αντιστοιχούν σε εκείνες
    που εισάχθηκαν στην Κοινότητα με καταστρατήγηση
    της συμφωνίας μεταξύ της Ευρωπαϊκής Κοινότητας
    και της Λαϊκής Δημοκρατίας της Κίνας για το
    εμπόριο των κλωστοϋφαντουργικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 560/95, annettu 14 päivänä maaliskuuta 1995,
    Euroopan yhteisön ja Kiinan kansantasavallan tekstiilituotekauppaa koskevan sopimuksen
    määräyksiä kiertäen yhteisöön tuotuja määriä vastaavien määrien vähentämisestä
    Kiinan kansantasavallasta peräisin olevien 4 ja 5 luokan tekstiilituotteiden
    tuonnin määrällisistä rajoituksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 560/95 della Commissione, del 14 marzo 1995, che deduce
    dai limiti quantitativi sulle importazioni di prodotti tessili delle categorie
    4 e 5 originari della Repubblica popolare cinese volumi corrispondenti a quelli
    importati nella Comunità eludendo le disposizioni dell' accordo tra la Comunità
    europea e la Repubblica popolare cinese sul commercio dei prodotti tessili
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 560/95 van de Commissie van 14 maart 1995 waarbij
    de kwantitatieve maxima voor de invoer van textielprodukten van de categorieën
    4 en 5, van oorsprong uit de Volksrepubliek China, worden verminderd met de hoeveelheden
    die in strijd met de overeenkomst tussen de Europese Gemeenschap en de Volksrepubliek
    China betreffende de handel in textielprodukten in de Gemeenschap zijn ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 560/95 da Comissão, de 14 de Março de 1995, que
    deduz dos limites quantitativos à importação de produtos têxteis das categorias
    4 e 5 originários da República Popular da China as quantidades correspondentes
    às importadas na Comunidade em violação do Acordo entre a Comunidade Europeia
    e a República Popular da China sobre o comércio de produtos têxteis
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 560/95 de la Comisión, de 14 de marzo de 1995, por
    el que se deducen de los límites cuantitativos a la importación de productos
    textiles de las categorías 4 y 5, originarios de la República Popular de China,
    las cantidades correspondientes a los productos importados en la Comunidad eludiendo
    las disposiciones del acuerdo entre la Comunidad Europea y la República Popular
    de China sobre comercio de productos textiles
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 560/95 av den 14 mars 1995 om avdrag
    på de kvantitativa begränsningar av import av textilprodukter i kategorierna
    4 och 5 med ursprung i Folkrepubliken Kina med samma antal som motsvarar importerna
    till gemenskapen, där avtalet mellan Europeiska gemenskapen och Folkrepubliken
    Kina om handel med textilprodukter kringgåtts
