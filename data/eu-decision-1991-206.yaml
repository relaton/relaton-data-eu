    für die Erzeugnisse der Fischerei und der Aquakultur (Nur der griechische Text
    ist verbindlich) (91/206/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 11. marts 1991 om tillæg til fællesskabsstøtterammen
