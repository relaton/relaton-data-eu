title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1389 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified cotton GHB614 × T304-40 × GHB119 pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2021)5996) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1389 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant du coton génétiquement
    modifié GHB614 × T304-40 × GHB119, consistant en ce coton ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 5996] (Le texte en langue allemande
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1389 der Kommission vom 17. August 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Baumwolle der Sorte GHB614 × T304-40 × GHB119 enthalten, aus ihr bestehen oder
    aus ihr hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5996) (Nur
    der deutsche Text ist verbindlich)
  type: main
