    i visse franske territorialfarvande (Occitanien og Provence-Alpes-Côte d'Azur)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/2362 της Επιτροπής
    της 2ας Δεκεμβρίου 2022 για την παράταση της παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την ελάχιστη απόσταση από την ακτή
