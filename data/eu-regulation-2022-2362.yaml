    от брега и дълбочината за риболов с брегови
    грибове в определени териториални води на
    Франция (Occitanie и Provence-Alpes-Côte d’Azur)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2362 ze dne 2. prosince 2022
    kterým se prodlužuje platnost odchylky od nařízení Rady (ES) č. 1967/2006,
    pokud jde o minimální vzdálenost od pobřeží a minimální hloubku moře
    pro pobřežní nevody lovící v některých teritoriálních vodách Francie
    (Occitanie a Provence-Alpes-Côte d’Azur)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2362 af 2. december 2022
    om forlængelse af fravigelsen af Rådets forordning (EF) nr. 1967/2006 for så
