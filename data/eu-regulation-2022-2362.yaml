title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2362 of 2 December 2022 extending
    the derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from the coast and depth granted to shore seines fishing in certain territorial
    waters of France (Occitanie and Provence-Alpes-Côte d’Azur)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2362 de la Commission du 2 décembre
    2022 prolongeant la dérogation au règlement (CE) no 1967/2006 du Conseil en
    ce qui concerne la distance de la côte et la profondeur minimales pour les sennes
    de plage pêchant dans certaines eaux territoriales de la France (Occitanie et
    Provence-Alpes-Côte d’Azur)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2362 der Kommission vom 2. Dezember
    2022 zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des
    Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Strandwaden, die in bestimmten Hoheitsgewässern Frankreichs (Occitanie und
    Provence-Alpes-Côte d’Azur) fischen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2362 на Комисията
    от 2 декември 2022 година за удължаване на срока
    на дерогацията от Регламент (ЕО) № 1967/2006 на
