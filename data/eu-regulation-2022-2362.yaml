    áirithe na Fraince (Occitanie agus Provence-Alpes-Côte d’Azur)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2362 оd 2. prosinca 2022. o produljenju
