    od obale i najmanje dubine za obalne mreže potegače kojima se obavlja ribolov
    u određenim teritorijalnim vodama Francuske (Okcitanija i Provansa-Alpe-Azurna
    obala)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2362 végrehajtási rendelete (2022. december 2.)
    az 1967/2006/EK tanácsi rendelettől a Franciaország felségvizeinek egyes területein
    (Occitanie és Provence-Alpes-Côte d’Azur) folytatott halászatban alkalmazott
    parti kerítőhálók telepítésének parttól számított minimális távolsága
    és minimális mélysége tekintetében engedélyezett eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2362 della Commissione del 2 dicembre
    2022 che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda la distanza minima dalla costa e la profondità minima, concessa
    alle sciabiche da spiaggia operanti in talune acque territoriali della Francia
    (Occitania e Provenza-Alpi-Costa Azzurra)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2362 (2022. gada 2. decembris),
    ar ko pagarina to atkāpi no Padomes Regulas (EK) Nr. 1967/2006, kura attiecībā
    uz minimālo attālumu no krasta un minimālo dziļumu piešķirta kuģiem, kas
    izmanto no krasta velkamos vadus, noteiktos Francijas (Oksitānijas un Provansas-Alpu-Kotdazīras)
    teritoriālajos ūdeņos
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/2362 2022 m. gruodžio 2
    d. kuriuo pratęsiamas nuo Tarybos reglamente (EB) Nr. 1967/2006 nustatytų minimalaus
    atstumo nuo kranto ir minimalaus jūros gylio reikalavimų nukrypti leidžiančios
    nuostatos, taikomos žvejybai kranto traukiamaisiais tinklais tam tikruose Prancūzijos
    (Oksitanijos ir Provanso-Alpių-Žydrojo Kranto) teritoriniuose vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2362 tat-2
    ta’ Diċembru 2022 li jestendi d-deroga mir-Regolament tal-Kunsill (KE) Nru
    1967/2006 f’dak li għandu x’jaqsam mad-distanza minima mill-kosta u mal-fond
    għas-sajd bit-tartaruni tax-xatt f’ċerti ilmijiet territorjali ta’ Franza
    (Occitanie u Provence-Alpes-Côte d’Azur)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/2362 van de Commissie van 2 december 2022
    tot verlenging van de afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumzeediepte die is toegestaan
    voor de visserij met landzegens in bepaalde territoriale wateren van Frankrijk
    (Occitanië en Provence-Alpes-Côte d’Azur)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2362 z dnia 2 grudnia 2022
    r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza, przyznane
    w odniesieniu do niewodów dobrzeżnych stosowanych do połowów na niektórych
    wodach terytorialnych Francji (Oksytania i Prowansja-Alpy-Lazurowe Wybrzeże)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2362 da Comissão de 2 de dezembro
    de 2022 que prorroga a derrogação do Regulamento (CE) n.o 1967/2006 do Conselho
    no respeitante à distância mínima da costa e à profundidade mínima para as
    redes envolventes-arrastantes de alar para a praia utilizadas em determinadas
    águas territoriais de França (Occitânia e Provença-Alpes-Côte d’Azur)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/2362 al Comisiei din 2 decembrie
    2022 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea pentru
    năvoadele de plajă utilizate pentru pescuit în anumite ape teritoriale ale
    Franței (Occitania și Provence-Alpes-Côte d’Azur)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/2362 z 2. decembra 2022, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku mora udelenú v
