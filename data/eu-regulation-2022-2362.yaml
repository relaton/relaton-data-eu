    Francúzska (Occitanie a Provence-Alpes-Côte d’Azur)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/2362 z dne 2. decembra 2022 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in globine za obalne potegalke, ki lovijo v določenih teritorialnih vodah
    Francije (Occitanie in Provence-Alpes-Côte d’Azur)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/2362 de la Comisión de 2 de diciembre
    de 2022 por el que se prorroga la excepción al Reglamento (CE) n.o 1967/2006
    del Consejo en lo relativo a la distancia mínima de la costa y la profundidad
    de la pesca con jábegas en determinadas aguas territoriales de Francia (Occitania
