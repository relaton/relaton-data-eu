  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/2362, annettu 2 päivänä
    joulukuuta 2022, sovellettavaa vähimmäisetäisyyttä rannikolta ja veden vähimmäissyvyyttä
    koskevan poikkeuksen jatkamisesta neuvoston asetuksesta (EY) N:o 1967/2006 kalastettaessa
