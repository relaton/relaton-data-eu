title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2890/90 of 5 October 1990 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    to fruit and vegetables as regards tomatoes, lettuce, broad-loaf endives, carrots,
    artichokes, table grapes and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2890/90 de la Commission du 5 octobre 1990 fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes en ce qui concerne
    les tomates, les laitues, les chicorées scaroles, les carottes, les artichauts,
    les raisins de table et les melons
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2890/90 DER KOMMISSION vom 5. Oktober 1990 mit zusaetzlichen
    Bestimmungen zur Anwendung des ergaenzenden Handelsmechanismus fuer Tomaten, Salat,
    Endivie Eskariol, Karotten, Artischocken, Tafeltrauben und Melonen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2890/90 af 5. oktober 1990 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    i sektoren for frugt og grønsager, for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, druer til spisebrug og meloner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2890/90 της Επιτροπής
    της 5ης Οκτωβρίου 1990 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις τομάτες, τα μαρούλια, τις σκαρόλες, τα καρότα,
    τις αγκινάρες, τα επιτραπέζια σταφύλια και
    τα πεπόνια
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2890/90 DELLA COMMISSIONE del 5 ottobre 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    agli scambi nel settore degli ortofrutticoli per quanto riguarda i pomodori, le
    lattughe, le cicorie scarole, le carote, i carciofi, le uve da tavola e i meloni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2890/90 VAN DE COMMISSIE van 5 oktober 1990 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer in de sector groenten en fruit, ten aanzien van tomaten, sla,
    andijvie, wortelen, artisjokken, tafeldruiven en meloenen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2890/90 DA COMISSAO de 5 de Outubro de 1990 que fixa
    determinadas normas adicionais para a execuçao do mecanismo complementar aplicavel
    às trocas comerciais (MCT) no sector das frutas e produtos horticolas no que
    diz respeito aos tomates, alfaces, chicorias-escarolas, cenouras, alcachofras,
    uvas de mesa e meloes
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2890/90 DE LA COMISION de 5 de octubre de 1990 por
    el que se fijan determinadas normas adicionales para la aplicacion del mecanismo
    complementario a los intercambios (MCI) en el sector de las frutas y hortalizas
    por lo que se refiere a los tomates, las lechugas, las escarolas, las zanahorias,
    las alcachofas, las uvas de mesa y los melones
