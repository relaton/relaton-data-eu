    respectivamente, los estatutos de rebaños bovinos oficialmente indemnes de brucelosis
    y de tuberculosis en determinados Estados miembros y regiones de Estados miembros
    [notificada con el número C(2000) 1943]'
  type: main
- language: sv
  script: Latn
