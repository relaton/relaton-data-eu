    prostih tuberkuloze v nekaterih državah članicah ali območjih držav članic
    (notificirana pod dokumentarno številko K(2000) 1943)
  type: main
- language: es
  script: Latn
  content: '2000/442/CE: Decisión de la Comisión, de 11 de julio de 2000, que modifica
