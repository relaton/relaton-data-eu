    tuberkulozes neskartu ganāmpulku statusu dažu dalībvalstu vai dalībvalstu
    reģionu liellopu ganāmpulkiem (izziņots ar dokumenta numuru C(2000) 1943)
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 11 d. Komisijos sprendimas, antrą kartą iš dalies keičiantis
    Sprendimus 1999/466/EB ir 1999/467/EB, atitinkamai nustatančius tam tikrų valstybių
    narių arba valstybių narių regionų oficialiai bruceliozės ir tuberkuliozės
    neapimtų galvijų bandų statusą (pranešta dokumentu Nr. C(2000) 1943)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-11 ta’ Lulju ta’ l-2000 li temenda
    għat-tieni darba d-Deċiżjonijiet 1999/466/KE u 1999/467/KE li jistabbilixxu
    rispettivament l-istatus uffiċjali ta’ ħelsien mill-bruċellożi u ta’ ħelsien
    mit-tuberkulożi tal-merħliet bovini ta’ ċerti Stati Membri jew reġjuni ta’
    Stati Membri (notifikata taħt id-dokument numru C(2000) 1943)
  type: main
- language: nl
  script: Latn
  content: '2000/442/EG: Beschikking van de Commissie van 11 juli 2000 tot tweede
    wijziging van de Beschikkingen 1999/466/EG en 1999/467/EG houdende erkenning van
    de rundveebeslagen in bepaalde lidstaten of regio''s van lidstaten als officieel
    brucellosevrij, respectievelijk officieel tuberculosevrij (kennisgeving geschied
    onder nummer C(2000) 1943)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 11 lipca 2000 r. zmieniająca po raz drugi decyzje
    1999/466/WE i 1999/467/WE ustanawiające status bydła oficjalnie wolnego odpowiednio
    od brucelozy i gruźlicy dla stad w niektórych Państwach Członkowskich lub
    regionach Państw Członkowskich (notyfikowana jako dokument nr C(2000) 1943)
  type: main
- language: pt
  script: Latn
  content: '2000/442/CE: Decisão da Comissão, de 11 de Julho de 2000, que altera,
    pela segunda vez, as Decisões 1999/466/CE e 1999/467/CE que estabelecem, respectivamente,
    o estatuto de efectivo bovino oficialmente indemne de brucelose e de tuberculose
    em determinados Estados-Membros e regiões dos Estados-Membros [notificada com
    o número C(2000) 1943]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 11. júla 2000, ktoré mení a dopĺňa po druhýkrát
    rozhodnutia 1999/466/ES a 1999/467/ES zavádzajúce oficiálny status stád hovädzieho
    dobytka bez brucelózy a stád hovädzieho dobytka bez tuberkulózy v určitých
    členských štátoch alebo regiónoch členských štátov (oznámené pod dokumentačným
    číslom C (2000) 1943)
  type: main
- language: sl
  script: Latn
