    és tuberkulózismentes státusa megállapításáról szóló 1999/466/EK és
    1999/467/EK határozat második módosításáról (az értesítés a C(2000)
    1943. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2000/442/CE: Decisione della Commissione, dell''11 luglio 2000, che modifica
