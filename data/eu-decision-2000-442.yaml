title:
- language: en
  script: Latn
  content: '2000/442/EC: Commission Decision of 11 July 2000 amending for the second
    time Decisions 1999/466/EC and 1999/467/EC establishing respectively the officially
    brucellosis-free and tuberculosis-free status of bovine herds of certain Member
    States or regions of Member States (notified under document number C(2000) 1943)'
  type: main
- language: fr
  script: Latn
  content: '2000/442/CE: Décision de la Commission du 11 juillet 2000 modifiant pour
    la seconde fois les décisions 1999/466/CE et 1999/467/CE établissant respectivement
    le statut de troupeau officiellement indemne de brucellose et le statut de troupeau
    officiellement indemne de tuberculose dans certains États membres ou régions
    d''États membres [notifiée sous le numéro C(2000) 1943]'
  type: main
- language: de
  script: Latn
  content: '2000/442/EG: Entscheidung der Kommission vom 11. Juli 2000 zur zweiten
    Änderung der Entscheidungen 1999/466/EG und 1999/467/EG über die amtliche Anerkennung
    der Brucellosefreiheit bzw. Tuberkulosefreiheit von Rinderbeständen bestimmter
    Mitgliedstaaten und Regionen von Mitgliedstaaten (Bekanntgegeben unter Aktenzeichen
    K(2000) 1943)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 11. července 2000, kterým se podruhé mění
    rozhodnutí 1999/466/ES a 1999/467/ES, kterými se stádům skotu některých
    členských států nebo regionů členských států uděluje status stád úředně
    prostých brucelózy a status stád úředně prostých tuberkulózy (oznámeno
    pod číslem K(2000) 1943)
  type: main
- language: da
  script: Latn
  content: '2000/442/EF: Kommissionens beslutning af 11. juli 2000 om anden ændring
    af beslutning 1999/466/EF og 1999/467/EF om fastlæggelse af kvægbesætningernes
    status i visse medlemsstater eller regioner i medlemsstater som henholdsvis officielt
    brucellosefri og officielt tuberkulosefri (meddelt under nummer K(2000) 1943)'
  type: main
- language: el
  script: Grek
  content: '2000/442/ΕΚ: Απόφαση της Επιτροπής, της 11ης
    Ιουλίου 2000, για την τροποποίηση των αποφάσεων
    1999/466/ΕΚ και 1999/467/ΕΚ που θεσπίζουν αντιστοίχως
    καθεστώτα επισήμως απαλλαγμένων από τη βρουκέλλωση
    και από τη φυματίωση αγελών βοοειδών σε ορισμένα
    κράτη μέλη ή περιφέρειες κρατών μελών [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 1943]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 11. juuli 2000, millega muudetakse teist korda otsuseid
    1999/466/EÜ ja 1999/467/EÜ, millega vastavalt kehtestatakse teatavate liikmesriikide
    ja liikmesriikide piirkondade veisekarjade ametlikult brutselloosivaba või ametlikult
    tuberkuloosivaba staatus (teatavaks tehtud numbri K(2000) 1943 all)
  type: main
- language: fi
  script: Latn
  content: '2000/442/EY: Komission päätös, tehty 11 päivänä heinäkuuta 2000,
    nautakarjojen virallisesti luomistaudista vapaan ja virallisesti tuberkuloosista
    vapaan aseman vahvistamisesta tiettyjen jäsenvaltioiden tai jäsenvaltioiden
    alueiden osalta tehtyjen päätösten 1999/466/EY ja 1999/467/EY muuttamisesta
    toisen kerran (tiedoksiannettu numerolla K(2000) 1943)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. július 11.) az egyes tagállamok, vagy
