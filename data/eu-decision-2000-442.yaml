    rispettivamente la qualifica di ufficialmente indenne da brucellosi e da tubercolosi
    per gli allevamenti di bovini di alcuni Stati membri o regioni di Stati membri
    [notificata con il numero C(2000) 1943]'
  type: main
- language: lv
  script: Latn
