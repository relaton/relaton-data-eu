  script: Latn
  content: Commission Delegated Decision (EU) 2026/429 of 25 February 2026 on supplementing
    Regulation (EU) 2025/40 of the European Parliament and of the Council by exempting
    certain economic operators that use pallet wrappings and straps from the 100 %
    reuse requirements of these packaging formats
  type: main
- language: fr
  script: Latn
  content: Décision déléguée (UE) 2026/429 de la Commission du 25 février 2026
