    exemptant certains opérateurs économiques qui utilisent des emballages de palettes
    et des sangles des exigences en matière de réemploi de 100 % de ces formats
    d’emballage
  type: main
- language: de
  script: Latn
  content: Delegierter Beschluss (EU) 2026/429 der Kommission vom 25. Februar 2026
