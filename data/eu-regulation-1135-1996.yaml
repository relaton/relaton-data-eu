  content: Commission Regulation (EC) No 1135/96 of 24 June 1996 correcting the German
    language version of Regulation (EC) No 2257/94 laying down quality standards for
    bananas and the English language version of Regulation (EC) No 2898/95 concerning
    verification of compliance with quality standards for bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1135/96 de la Commission du 24 juin 1996 rectifiant la
    version en langue allemande du règlement (CE) nº 2257/94 fixant des normes de
    qualité pour les bananes ainsi que la version en langue anglaise du règlement
    (CE) nº 2898/95 portant dispositions relatives au contrôle du respect des normes
    de qualité dans le secteur de la banane
  type: main
- language: de
  script: Latn
