    per le banane e il testo inglese del regolamento (CE) n. 2898/95 che fissa le
    disposizioni relative al controllo del rispetto delle norme di qualità nel settore
    della banana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1135/96 van de Commissie van 24 juni 1996 houdende
