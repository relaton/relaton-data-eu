    für Bananen und der englischen Fassung der Verordnung (EG) Nr. 2898/95 mit Durchführungsbestimmungen
    zu den Qualitätskontrollen für Bananen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1135/96 af 24. juni 1996 om berigtigelse
