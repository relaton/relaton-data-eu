id: EUDecision2012333
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2012/333/CFSP of 25 June 2012 updating the list of persons,
    groups and entities subject to Articles 2, 3 and 4 of Common Position 2001/931/CFSP
    on the application of specific measures to combat terrorism and repealing Decision
    2011/872/CFSP
  type: main
- language: fr
  script: Latn
  content: Décision 2012/333/PESC du Conseil du 25 juin 2012 portant mise à jour
    de la liste des personnes, groupes et entités auxquels s’appliquent les articles
    2, 3 et 4 de la position commune 2001/931/PESC relative à l’application de
    mesures spécifiques en vue de lutter contre le terrorisme, et abrogeant la décision
    2011/872/PESC
  type: main
- language: de
  script: Latn
  content: Beschluss 2012/333/GASP des Rates vom 25. Juni 2012 zur Aktualisierung
    der Liste der Personen, Vereinigungen und Körperschaften, auf die die Artikel
    2, 3 und 4 des Gemeinsamen Standpunkts 2001/931/GASP über die Anwendung besonderer
    Maßnahmen zur Bekämpfung des Terrorismus Anwendung finden, und zur Aufhebung
    des Beschlusses 2011/872/GASP
  type: main
- language: bg
  script: Cyrl
  content: Решение 2012/333/ОВППС на Съвета от 25 юни 2012
    година за актуализиране на списъка на лицата,
    групите и образуванията, по отношение на които
    се прилагат членове 2, 3 и 4 от Обща позиция 2001/931/ОВППС
    за прилагането на специални мерки за борба
    с тероризма и за отмяна на Решение 2011/872/ОВППС
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2012/333/SZBP ze dne 25. června 2012 , kterým se aktualizuje
    seznam osob, skupin a subjektů, na něž se vztahují články 2, 3 a 4 společného
    postoje 2001/931/SZBP o uplatnění zvláštních opatření k boji proti terorismu
    a kterým se zrušuje rozhodnutí 2011/872/SZBP
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2012/333/FUSP af 25. juni 2012 om ajourføring af listen
    over personer, grupper og enheder, som er omfattet af artikel 2, 3 og 4 i fælles
    holdning 2001/931/FUSP om anvendelse af specifikke foranstaltninger til bekæmpelse
    af terrorisme og om ophævelse af afgørelse 2011/872/FUSP
  type: main
- language: el
  script: Grek
  content: Απόφαση 2012/333/ΚΕΠΠΑ του Συμβουλίου, της
    25ης Ιουνίου 2012 , σχετικά με την ενημέρωση του
    καταλόγου προσώπων, ομάδων και οντοτήτων που
    υπάγονται στα άρθρα 2, 3 και 4 της κοινής θέσης
    2001/931/ΚΕΠΠΑ για την εφαρμογή ειδικών μέτρων
    για την καταπολέμηση της τρομοκρατίας και
    για την κατάργηση της απόφασης 2011/872/ΚΕΠΠΑ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2012/333/ÜVJP, 25. juuni 2012 , millega ajakohastatakse
    loetelu isikutest, rühmitustest ja üksustest, kelle suhtes kohaldatakse ühise
    seisukoha 2001/931/ÜVJP (terrorismivastaste erimeetmete rakendamise kohta) artikleid
    2, 3 ja 4 ja millega tunnistatakse kehtetuks otsus 2011/872/ÜVJP
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2012/333 /YUTP, annettu 25 päivänä kesäkuuta 2012
    , niitä henkilöitä, ryhmiä ja yhteisöjä koskevan luettelon saattamisesta
    ajan tasalle, joihin sovelletaan erityistoimenpiteiden toteuttamisesta terrorismin
    torjumiseksi hyväksytyn yhteisen kannan 2001/931/YUTP 2, 3 ja 4 artiklaa, sekä
    päätöksen 2011/872/YUTP kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2012/333/KKBP határozata ( 2012. június 25. ) a terrorizmus
    elleni küzdelemre vonatkozó különös intézkedések alkalmazásáról szóló
    2001/931/KKBP közös álláspont 2., 3. és 4. cikkének hatálya alá tartozó
    személyek, csoportok és szervezetek listájának naprakésszé tételéről
    és a 2011/872/KKBP határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2012/333/PESC del Consiglio, del 25 giugno 2012 , che aggiorna
    l’elenco delle persone, dei gruppi e delle entità a cui si applicano gli articoli
    2, 3 e 4 della posizione comune 2001/931/PESC, relativa all’applicazione di
    misure specifiche per la lotta al terrorismo, e che abroga la decisione 2011/872/PESC
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2012/333/KĀDP ( 2012. gada 25. jūnijs ), ar ko atjaunina
    to personu, grupu un vienību sarakstu, kurām piemēro 2., 3. un 4. pantu Kopējā
    nostājā 2001/931/KĀDP par konkrētu pasākumu īstenošanu cīņā pret terorismu,
    un atceļ Lēmumu 2011/872/KĀDP
  type: main
- language: lt
  script: Latn
  content: 2012 m. birželio 25 d. Tarybos sprendimas 2012/333/BUSP, kuriuo atnaujinamas
    asmenų, grupių ir subjektų, kuriems taikomi Bendrosios pozicijos 2001/931/BUSP
    dėl konkrečių priemonių taikymo kovojant su terorizmu 2, 3 ir 4 straipsniai,
    sąrašas ir panaikinamas Sprendimas 2011/872/BUSP
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2012/333/PESK tal- 25 ta’ Ġunju 2012 li taġġorna
    l-lista ta’ persuni, gruppi u entitajiet soġġetti għall-Artikoli 2, 3 u 4
    tal-Pożizzjoni Komuni 2001/931/PESK dwar l-applikazzjoni ta’ miżuri speċifiċi
    fil-ġlieda kontra t-terroriżmu u li tħassar id-Deċiżjoni 2011/872/PESK
  type: main
- language: nl
  script: Latn
  content: Besluit 2012/333/GBVB van de Raad van 25 juni 2012 inzake de actualisering
    van de lijst van personen, groepen en entiteiten bedoeld in de artikelen 2, 3
    en 4 van Gemeenschappelijk Standpunt 2001/931/GBVB betreffende de toepassing van
    specifieke maatregelen ter bestrijding van het terrorisme en tot intrekking van
    Besluit 2011/872/GBVB
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2012/333/WPZiB z dnia 25 czerwca 2012 r. dotycząca aktualizacji
    wykazu osób, grup i podmiotów, objętych art. 2, 3 i 4 wspólnego stanowiska
    2001/931/WPZiB w sprawie zastosowania szczególnych środków w celu zwalczania
    terroryzmu, i uchylenia decyzji 2011/872/WPZiB
  type: main
- language: pt
  script: Latn
  content: Decisão 2012/333/PESC do Conselho, de 25 de junho de 2012 , que atualiza
    a lista de pessoas, grupos e entidades a que se aplicam os artigos 2. °, 3. °e
    4. °da Posição Comum 2001/931/PESC relativa à aplicação de medidas específicas
    de combate ao terrorismo e revoga a Decisão 2011/872/PESC
  type: main
- language: ro
  script: Latn
  content: Decizia 2012/333/PESC a Consiliului din 25 iunie 2012 de actualizare a
    listei persoanelor, grupurilor și entităților care fac obiectul articolelor
    2, 3 și 4 din Poziția comună 2001/931/PESC privind aplicarea de măsuri specifice
    pentru combaterea terorismului și de abrogare a Deciziei 2011/872/PESC
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2012/333/SZBP z 25. júna 2012 , ktorým sa aktualizuje
    zoznam osôb, skupín a subjektov, na ktoré sa vzťahujú články 2, 3 a 4 spoločnej
    pozície 2001/931/SZBP o uplatňovaní špecifických opatrení na boj s terorizmom
    a ktorým sa zrušuje rozhodnutie 2011/872/SZBP
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2012/333/SZVP z dne 25. junija 2012 o posodobitvi seznama oseb,
    skupin in organizacij, za katere se uporabljajo členi 2, 3 in 4 Skupnega stališča
    2001/931/SZVP o uporabi posebnih ukrepov za boj proti terorizmu in o razveljavitvi
    Sklepa 2011/872/SZVP
  type: main
- language: es
  script: Latn
  content: Decisión 2012/333/PESC del Consejo, de 25 de junio de 2012 , por la que
    se actualiza la lista de personas, grupos y entidades a los que se aplican los
    artículos 2, 3 y 4 de la Posición Común 2001/931/PESC sobre la aplicación
    de medidas específicas de lucha contra el terrorismo y se deroga la Decisión
    2011/872/PESC
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2012/333/Gusp av den 25 juni 2012 om uppdatering av förteckningen
    över personer, grupper och enheter som omfattas av artiklarna 2, 3 och 4 i gemensam
    ståndpunkt 2001/931/Gusp om tillämpning av särskilda åtgärder i syfte att
    bekämpa terrorism och om upphävande av beslut 2011/872/Gusp
  type: main
