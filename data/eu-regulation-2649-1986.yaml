  content: Commission Regulation (EEC) No 2649/86 of 22 August 1986 re-establishing
    the levying of customs duties on sacks and bags, products of category 33 (code
    40.0330), originating in Malaysia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3600/86 apply
  type: main
- language: fr
  script: Latn
