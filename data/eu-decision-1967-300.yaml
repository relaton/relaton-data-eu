title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 avril 1967, portant extension du champ
    d'application de sa décision du 17 juillet 1962, instituant des méthodes de
    coopération administrative spéciales pour l'application des prélèvements intracommunautaires
    institués dans le cadre de la politique agricole commune, aux produits visés
    par le règlement n° 48/67/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: '67/300/EWG: Entscheidung der Kommission vom 28. April 1967 über die Ausdehnung
    des Anwendungsbereichs ihrer Entscheidung vom 17. Juli 1962, mit der besondere
    Methoden der Zusammenarbeit der Verwaltungen zur Anwendung der innergemeinschaftlichen
    Abschöpfungen, die im Rahmen der gemeinsamen Agrarpolitik vorgesehen worden sind,
    eingeführt wurden, auf die unter die Verordnung Nr. 48/67/EWG des Rates fallenden
    Erzeugnisse'
  type: main
- language: it
  script: Latn
  content: '67/300/CEE: Decisione della Commissione, del 28 aprile 1967, che porta
    estensione del campo di applicazione della sua decisione del 17 luglio 1962, relativa
    ai metodi speciali di cooperazione amministrativa per l''applicazione dei prelievi
    intracomunitari istituiti nell''ambito della politica agricola comune, ai prodotti
    di cui al regolamento n. 48/67/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '67/300/EEG: Beschikking van de Commissie van 28 april 1967 waarbij het
    toepassingsgebied van de beschikking van 17 juli 1962 tot invoering van bijzondere
    methoden van administratieve samenwerking inzake de toepassing van de in het kader
    van het gemeenschappelijk landbouwbeleid ingestelde intracommunautaire heffingen
    wordt uitgebreid tot de bij Verordening Nr. 48/67/EEG van de Raad bedoelde produkten'
  type: main
