    (DSM 33737), als Zusatzstoff in Futtermitteln für alle Mastgeflügelarten oder
    Jungtiere von Lege- oder Zuchtgeflügelarten, Sauen aller Suidae-Arten und alle
    Fische (Zulassungsinhaber: DSM Nutritional Products Ltd, vertreten durch DSM Nutritional
    Products Sp. z o.o.)'
