title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/2177 of 2 September 2024
    concerning the authorisation of a preparation of 6-phytase produced with Aspergillus
    oryzae DSM 33737 as a feed additive for all poultry species for fattening or reared
    for laying or reared for breeding, sows of all Suidae species and all fin fish
    (holder of authorisation: DSM Nutritional Products Ltd, represented by DSM Nutritional
    Products Sp. z o.o.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/2177 de la Commission du 2 septembre
    2024 concernant l’autorisation d’une préparation de 6-phytase produite avec
    Aspergillus oryzae DSM 33737 en tant qu’additif pour l’alimentation de toutes
    les espèces de volailles d’engraissement ou élevées pour la ponte ou la reproduction,
    des truies de toutes les espèces de suidés et de tous les poissons (titulaire
    de l’autorisation: DSM Nutritional Products Ltd, représentée par DSM Nutritional
    Products Sp. z o.o.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/2177 der Kommission vom 2. September
