id: EUDecision1971351
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 octobre 1971, autorisant la République
    française à exclure du traitement communautaire la vaisselle et les articles
    de ménage ou de toilette en porcelaine ou en autres matières céramiques que
    la terre commune ou le grès des positions 69.11 et 69.12 C et D du Tarif douanier
    commun, originaires de la République populaire de Chine et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/351/EWG: Entscheidung der Kommission vom 12. Oktober 1971, mit der
    die Französische Republik ermächtigt wird, aus der Volksrepublik China stammendes
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliches Geschirr sowie
    Haushalts und Toilettengegenstände aus Porzellan oder aus anderen keramischen
    Stoffen als aus gewöhnlichem Ton oder aus Steinzeug der Tarifnummern 69.11 und
    69.12 C und D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/351/CEE: Decisione della Commissione, del 12 ottobre 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il vasellame e
    gli oggetti di uso domestico o da toletta, di porcellana o di materie ceramiche
    diverse dalla terracotta o dal gres, delle voci nn. 69.11 e 69.12 C e D della
    tariffa doganale comune, originari della Repubblica popolare cinese e messi in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/351/EEG: Beschikking van de Commissie van 12 oktober 1971 waarbij de
    Franse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein of van andere keramische stoffen dan van gewoon aardewerk of van
    gres van de posten 69.11 en 69.12 C en D van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
