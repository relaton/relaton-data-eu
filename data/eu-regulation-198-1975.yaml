- language: en
  script: Latn
  content: Regulation (EEC) No 198/75 of the Commission of 27 January 1975 allocating
    for the year 1975 the Community quantitative export quotas for certain types of
    copper ash and residues and for certain types of copper, aluminium and lead waste
    and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 198/75 de la Commission, du 27 janvier 1975, portant
    répartition pour l'année 1975 des contingents quantitatifs communautaires à
    l'exportation pour certains résidus et cendres de cuivre ainsi que pour certains
    déchets et débris de cuivre, d'aluminium et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 198/75 der Kommission vom 27. Januar 1975 zur Aufteilung
    für das Jahr 1975 von mengenmäßigen Ausfuhrkontingenten der Gemeinschaft für
    bestimmte Aschen und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle
    und bestimmten Schrott aus Kupfer, Aluminium und Blei
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 198/75 af 27. januar 1975 om fordeling
    af kvantitative fællesskabskontingenter for udførsel af visse typer aske og
    visse restprodukter fra fremstillingen af kobber samt for udførsel af visse former
    for affald og skrot af kobber, aluminium og bly
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 198/75 della Commissione, del 27 gennaio 1975, che
    ripartisce per il 1975 i contingenti quantitativi comunitari all'esportazione
    per alcuni residui e ceneri di rame, nonché per alcuni cascami e rottami di rame,
    d'alluminio e di piombo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 198/75 van de Commissie van 27 januari 1975 betreffende
