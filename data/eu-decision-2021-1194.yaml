  type: main
- language: hu
  script: Latn
  content: A Tanács (KKBP) 2021/1194 határozata (2021. július 19.) az Európai
    Unió koszovói (Ez a megnevezés nem érinti a jogállással kapcsolatos álláspontokat,
    továbbá összhangban van az 1244/1999 sz.ENSZ BT-határozattal és a Nemzetközi
    Bíróságnak a koszovói függetlenségi nyilatkozatról szóló véleményével.)
    különleges képviselője megbízatásának meghosszabbításáról és a (KKBP)
    2020/1135 határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2021/1194 del Consiglio del 19 luglio 2021 che proroga
    il mandato del rappresentante speciale dell’Unione europea per il Kosovo (Questa
    designazione non pregiudica le posizioni sullo status ed è in linea con l’UNSCR
    1244/1999 e il parere della Corte internazionale di giustizia sulla dichiarazione
    di indipendenza del Kosovo.) e che modifica la decisione (PESC) 2020/1135
  type: main
- language: lv
  script: Latn
