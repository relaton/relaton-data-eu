title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2021/1194 of 19 July 2021 extending the mandate
    of the European Union Special Representative in Kosovo (This designation is without
    prejudice to positions on status, and is in line with UNSCR 1244/1999 and the
    ICJ Opinion on the Kosovo declaration of independence.) and amending Decision
    (CFSP) 2020/1135
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2021/1194 du Conseil du 19 juillet 2021 prorogeant le
    mandat du représentant spécial de l’Union européenne au Kosovo (Cette désignation
    est sans préjudice des positions sur le statut et est conforme à la résolution
    1244/1999 du Conseil de sécurité des Nations unies ainsi qu’à l’avis de
    la CIJ sur la déclaration d’indépendance du Kosovo.) et modifiant la décision
    (PESC) 2020/1135
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2021/1194 des Rates vom 19. Juli 2021 zur Verlängerung
    des Mandats des Sonderbeauftragten der Europäischen Union im Kosovo (Diese Bezeichnung
    berührt nicht die Standpunkte zum Status und steht im Einklang mit der Resolution
    1244 (1999) des VN-Sicherheitsrates und dem Gutachten des Internationalen Gerichtshofs
    zur Unabhängigkeitserklärung des Kosovos.) und zur Änderung des Beschlusses
    (GASP) 2020/1135
  type: main
