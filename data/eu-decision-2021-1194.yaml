    dotčeny postoje k otázce statusu a označení je v souladu s rezolucí Rady
    bezpečnosti OSN 1244/1999 a se stanoviskem Mezinárodního soudního dvora k
    vyhlášení nezávislosti Kosova.) a o změně rozhodnutí (SZBP) 2020/1135
  type: main
