title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3753/91 of 19 December 1991 re-establishing
    the levying of customs duties on products falling within CN code 2941 20 10, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3753/91 DE LA COMMISSION du 19 décembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2941 20 10 originaires de Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3753/91 DER KOMMISSION vom 19. Dezember 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 2941 20
    10 mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3753/91 af 19. december 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2941 20 10 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3753/91 της Επιτροπής
    της 19ης Δεκεμβρίου 1991 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2941 20 10, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό ( ΕΟΚ ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3753/91 DELLA COMMISSIONE del 19 dicembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2941 20 10, originari della Cina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3753/91 VAN DE COMMISSIE van 19 december 1991 houdende
