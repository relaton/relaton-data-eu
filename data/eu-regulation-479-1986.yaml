title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 479/86 of 25 February 1986 determining the
    exceptional cases in which coupage of red Spanish wines with red wines of the
    other Member States, derived from certain varieties of grape and originating in
    certain regions of the Community, shall be allowed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 479/86 du Conseil du 25 février 1986 déterminant
    les cas exceptionnels d' autorisation du coupage de vins rouges espagnols avec
    des vins rouges d' autres États membres provenant de certaines variétés et
    régions de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 479/86 des Rates vom 25. Februar 1986 zur Bestimmung
    der Ausnahmefälle einer Genehmigung des Verschnitts von spanischem Rotwein mit
    rotem Wein bestimmter Sorten und Gebiete der Gemeinschaft aus anderen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 479/86 af 25. februar 1986 om bestemmelse
    af de særlige tilfælde, hvor spanske rødvine kan sammenstikkes med rødvine
    af visse vinstoksorter fra visse områder i andre medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 479/86 του Συμβουλίου
    της 25ης Φεβρουαρίου 1986 για τον καθορισμό των
    εξαιρετικών περιπτώσεων στις οποίες επιτρέπεται
    η ανάμειξη ερυθρών ισπανικών οίνων με ερυθρούς
    οίνους των άλλων κρατών μελών που προέρχονται
    από ορισμένες ποικιλίες και περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 479/86 del Consiglio del 25 febbraio 1986 che determina
    i casi eccezionali di autorizzazione del taglio di vini da tavola rossi spagnoli
    con i vini rossi di altri stati membri, provenienti da talune varietà e regioni
    della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 479/86 van de Raad van 25 februari 1986 houdende
    vaststelling van de uitzonderingsgevallen waarin het versnijden van Spaanse rode
    wijn met rode wijn uit andere Lid-Staten afkomstig van sommige rassen en gebieden
    in de Gemeenschap wordt toegestaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 479/86 do Conselho de 25 de Fevereiro de 1986 que
    determina os casos excepcionais de autorização de lotação de vinhos tintos
    espanhóis com vinhos tintos de outros Estados-membros provenientes de determinadas
    variedades e regiões da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 479/86 del Consejo de 25 de febrero de 1986 por el
    que se determinan los casos excepcionales en que se autorizará la mezcla de vinos
    tintos españoles con vinos tintos de los demás Estados miembros procedentes
    de determinadas variedades y regiones de la Comunidad
  type: main
