    του ελαιολάδου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 666/96, annettu 12 päivänä huhtikuuta 1996,
    Tunisiasta peräisin olevan oliiviöljyn tuontia koskevista erityisistä toimenpiteistä
    annetun asetuksen (EY) N:o 447/96 yksityiskohtaisista soveltamissäännöistä
    ja Uruguayn kierroksen maataloussopimuksen täytäntöönpanoon liittyvistä tietyistä
    siirtymätoimenpiteistä oliiviöljyalalla annetun asetuksen (EY) N:o 1477/95
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 666/96 della Commissione, del 12 aprile 1996, recante
    modalità di applicazione del regolamento (CE) n. 447/96 recante misure speciali
    per l'importazione di olio d'oliva originario della Tunisia e recante modifica
    del regolamento (CE) n. 1477/95 recante misure transitorie relative all'attuazione
    dell'accordo sull'agricoltura dell'Uruguay Round nel settore dell'olio d'oliva
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 666/96 van de Commissie van 12 april 1996 houdende
    uitvoeringsbepalingen van Verordening (EG) nr. 447/96 tot vaststelling van bijzondere
    maatregelen voor de invoer van olijfolie van oorsprong uit Tunesië en houdende
    wijziging van Verordening (EG) nr. 1477/95 tot vaststelling van een aantal overgangsmaatregelen
    voor de tenuitvoerlegging van de landbouwovereenkomst in het kader van de Uruguay-
    Ronde, in de sector olijfolie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 666/96 da Comissão, de 12 de Abril de 1996, que estabelece
    as normas de execução do Regulamento (CE) nº 447/96, que prevê medidas especiais
    para a importação de azeite originário da Tunísia e que altera o Regulamento
    (CE) nº 1477/95, que estabelece certas medidas transitórias relativas à execução
    do acordo agrícola do «Uruguay Round» no sector do azeite
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 666/96 de la Comisión, de 12 de abril de 1996, por
    el que se establecen disposiciones de aplicación del Reglamento (CE) nº 447/96,
    por el que se establecen medidas especiales para la importación de aceite de
    oliva originario de Túnez, y se modifica el Reglamento (CE) nº 1477/95, por
    el que se establecen medidas transitorias para la aplicación del Acuerdo agrícola
    de la Ronda Uruguay en el sector del aceite de oliva
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 666/96 av den 12 april 1996 om tillämpningsföreskrifter
    för förordning (EG) nr 447/96 om särskilda åtgärder för import av olivolja
    med ursprung i Tunisien och om ändring av förordning (EG) nr 1477/95 om vissa
    övergångsåtgärder för genomförandet av Uruguayrundans jordbruksavtal inom
    olivoljesektorn
