title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 666/96 of 12 April 1996 laying down detailed
    rules for the application of Regulation (EC) No 447/96 laying down special measures
    for the import of olive oil from Tunisia and amending Regulation (EC) No 1477/95
    laying down certain transitional measures for the implementation of the Uruguay
    Round Agreement on Agriculture as regards olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 666/96 de la Commission, du 12 avril 1996, portant
    modalités d'application du règlement (CE) n° 447/96 prévoyant des mesures
    spéciales pour l'importation d'huile d'olive originaire de Tunisie et modifiant
    le règlement (CE) n° 1477/95 portant certaines mesures transitoires relatives
    à la mise en oeuvre de l'accord agricole du cycle d'Uruguay dans le secteur de
    l'huile d'olive
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 666/96 der Kommission vom 12. April 1996 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 447/96 mit Sondermaßnahmen für die Einfuhr von Olivenöl
    mit Ursprung in Tunesien und zur Änderung der Verordnung (EG) Nr. 1477/95 mit
    Übergangsmaßnahmen zur Anwendung des im Rahmen der Uruguay-Runde geschlossenen
    Übereinkommens über die Landwirtschaft im Sektor Olivenöl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 666/96 af 12. april 1996 om gennemførelsesbestemmelser
    til forordning (EF) nr. 447/96 om særforanstaltninger for indførsel af olivenolie
    med oprindelse i Tunesien og om ændring af forordning (EF) nr. 1477/95 om visse
    overgangsforanstaltninger for iværksættelsen af Uruguay- rundens landbrugsaftale
    i olivenoliesektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 666/96 της Επιτροπής,
    της 12ης Απριλίου 1996, για λεπτομέρειες εφαρμογής
    του κανονισμού (ΕΚ) αριθ. 447/96 για την πρόβλεψη
    ειδικών μέτρων για την εισαγωγή ελαιολάδου
    καταγωγής Τυνησίας και για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1477/95 για ορισμένα μεταβατικά
