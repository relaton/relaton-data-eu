---
id: EURegulation4282005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 428/2005 of 10 March 2005 imposing a definitive
    anti-dumping duty on imports of polyester staple fibres originating in the People's
    Republic of China and Saudi Arabia, amending Regulation (EC) No 2852/2000 imposing
    a definitive anti-dumping duty on imports of polyester staple fibres originating
    in the Republic of Korea and terminating the anti-dumping proceeding in respect
    of such imports originating in Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 428/2005 du Conseil du 10 mars 2005 instituant un droit
    antidumping définitif sur les importations de fibres discontinues de polyesters
    originaires de la République populaire de Chine et d'Arabie saoudite, modifiant
    le règlement (CE) n° 2852/2000 instituant un droit antidumping définitif sur
    les importations de fibres discontinues de polyesters originaires de la République
    de Corée, et clôturant la procédure antidumping concernant Taïwan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 428/2005 des Rates vom 10. März 2005 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Polyester-Spinnfasern
    mit Ursprung in der Volksrepublik China und Saudi-Arabien, zur Änderung der Verordnung
    (EG) Nr. 2852/2000 zur Einführung eines endgültigen Antidumpingzolls auf die
    Einfuhren von Polyester-Spinnfasern mit Ursprung in der Republik Korea und zur
    Einstellung des Antidumpingverfahrens betreffend solcher Einfuhren mit Ursprung
    in Taiwan
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 428/2005 на Съвета от 10 март
    2005 година за налагане на окончателно антидъмпингово
    мито върху вноса на полиестерни щапелни влакна
    с произход от Китайската народна република
    и Саудитска Арабия и за изменение на Регламент
    (ЕО) № 2852/2000 за налагане на окончателно антидъмпингово
    мито върху вноса на полиестерни щапелни влакна
    с произход от Република Корея и за прекратяване
    на антидъмпинговата процедура по вноса на
    такива продукти с произход от Тайван
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 428/2005 ze dne 10. března 2005 o uložení
    konečného antidumpingového cla z dovozu polyesterových střižových vláken
    pocházejících z Čínské lidové republiky a Saúdské Arábie, změně nařízení
    (ES) č. 2852/2000 o uložení konečného antidumpingového cla z dovozu polyesterových
    střižových vláken pocházejících z Korejské republiky a o zastavení antidumpingového
    řízení týkajícího se dovozů pocházejících z Tchaj-wanu
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 428/2005 af 10. marts 2005 om indførelse af
    en endelig antidumpingtold på importen af korte syntetiske fibre af polyester
    med oprindelse i Folkerepublikken Kina og Saudi-Arabien, om ændring af Rådets
    forordning (EF) nr. 2852/2000 om indførelse af en endelig antidumpingtold på
    importen af korte syntetiske fibre af polyester med oprindelse i Republikken Korea
    og om afslutning af antidumpingproceduren vedrørende importen af sådanne varer
    med oprindelse i Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 428/2005 του Συμβουλίου,
    της 10ης Μαρτίου 2005, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές μη συνεχών
    ινών από πολυεστέρες, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας και Σαουδικής Αραβίας, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2852/2000 για την επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    μη συνεχών ινών από πολυεστέρες, καταγωγής
    Δημοκρατίας της Κορέας, και για την περάτωση
    της διαδικασίας όσον αφορά αυτές τις εισαγωγές,
    καταγωγής Ταϊβάν
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 428/2005, 10. märts 2005, millega kehtestatakse
    Hiina Rahvavabariigist ja Saudi Araabiast pärineva polüesterstaapelkiu impordi
    suhtes lõplik dumpinguvastane tollimaks, millega muudetakse nõukogu määrust
    (EÜ) nr 2852/2000, millega kehtestatakse Korea Vabariigist pärineva polüesterstaapelkiu
    impordi suhtes lõplik dumpinguvastane tollimaks ning lõpetatakse Taiwanist pärineva
    kõnealuse impordi suhtes kohaldatav dumpinguvastane menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 428/2005, annettu 10 päivänä maaliskuuta 2005,
    lopullisen polkumyyntitullin käyttöönotosta Kiinan kansantasavallasta ja Saudi-Arabiasta
    peräisin olevien polyesterikatkokuitujen tuonnissa, lopullisen polkumyyntitullin
    käyttöönotosta Korean tasavallasta peräisin olevien polyesterikatkokuitujen
    tuonnissa annetun asetuksen (EY) N:o 2852/2000 muuttamisesta sekä vastaavaa Taiwanista
    peräisin olevaa tuontia koskevan polkumyynnin vastaisen menettelyn päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 428/2005/EK rendelete (2005. március 10.) végleges dömpingellenes
    vám kivetéséről a Kínai Népköztársaságból és Szaúd-Arábiából származó
    poliészter vágott szálak behozatalára, a Koreai Köztársaságból származó
    poliészter vágott szál behozatalára végleges dömpingellenes vám kivetéséről
    és a Tajvanról származó ilyen behozatalra vonatkozó dömpingellenes eljárás
    lezárásáról szóló 2852/2000/EK rendelet módosításával
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 428/2005 del Consiglio, del 10 marzo 2005, che istituisce
    un dazio antidumping definitivo sulle importazioni di fibre di poliesteri in fiocco
    originarie della Repubblica popolare cinese e dell'Arabia Saudita, che modifica
    il regolamento (CE) n. 2852/2000, che istituisce un dazio antidumping definitivo
    sulle importazioni di fibre di poliesteri in fiocco originarie della Repubblica
    di Corea e che chiude il procedimento antidumping relativo alle importazioni di
    tale prodotto originarie di Taiwan
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 428/2005 (2005. gada 10. marts), ar ko piemēro
    galīgo antidempinga maksājumu Ķīnas Tautas Republikas un Saūda Arābijas
    izcelsmes poliestera štāpeļšķiedru importam, izdarot grozījumus Regulā
    (EK) Nr. 2852/2000, ar ko piemēro galīgo antidempinga maksājumu un galīgi
    iekasē pagaidu maksājumu, kas piemērots par Indijas un Korejas Republikas izcelsmes
    poliestera štāpeļšķiedru importu, un izbeidz antidempinga procedūru attiecībā
    uz Taivānas izcelsmes minētā produkta importu
  type: main
- language: lt
  script: Latn
  content: 2005 m. kovo 10 d. Tarybos reglamentas (EB) Nr. 428/2005, įvedantis importuojamiems
    poliesterių štapelio pluoštams, kurių kilmės šalys – Kinijos Liaudies
    Respublika ir Saudo Arabija, galutinį antidempingo muitą ir iš dalies keičiantis
    Tarybos reglamentą (EB) Nr. 2852/2000, įvedantį galutinį antidempingo muitą
    importuojamiems poliesterių štapelio pluoštams, kurių kilmės šalys - Indija
    ir Korėjos Respublika, ir nutraukiantis antidempingo procedūrą dėl tokio importo,
    kurio kilmės šalis yra Taivanas
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 428/2005 ta' l- 10 ta' Marzu 2005 li jimponi
    dazju definittiv anti – dumping fuq l-importazzjoni ta' fibri diskontinwi tal-poljester
    li joriġinaw mir-Repubblika Popolari taċ-Ċina u mill-Għarabja Sawdita, li
    jemenda r-Regolament (KE) Nru 2852/2000 li jimponi d-dazju definittiv anti –
    dumping fuq l-importazzjoni ta' fibri diskontinwi tal-poljester li joriġinaw
    mir-Repubblika tal-Korea u li jtemm il-proċedura anti – dumping fir-rigward
    ta' tali importazzjonijiet li joriġinaw mit-Tajwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 428/2005 van de Raad van 10 maart 2005 tot instelling
    van een definitief antidumpingrecht op stapelvezels van polyester uit de Volksrepubliek
    China en Saoedi-Arabië en tot wijziging van Verordening (EG) nr. 2852/2000 van
    de Raad houdende instelling van een definitief antidumpingrecht op de invoer van
    stapelvezels van polyesters uit de Republiek Korea en tot beëindiging van de
    antidumpingprocedure ten aanzien van de invoer van dergelijke vezels uit Taiwan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 428/2005 z dnia 10 marca 2005 r. nakładające
    ostateczne cło antydumpingowe na przywóz poliestrowych włókien odcinkowych
    pochodzących z Chińskiej Republiki Ludowej i Arabii Saudyjskiej, zmieniające
    rozporządzenie (WE) nr 2852/2000 nakładające ostateczne cło antydumpingowe
    na przywóz poliestrowych włókien odcinkowych pochodzących z Republiki Korei
    i kończące postępowanie antydumpingowe dotyczące przywozu takich włókien
    pochodzących z Tajwanu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 428/2005 do Conselho, de 10 de Março de 2005, que
    institui um direito anti-dumping definitivo sobre as importações de fibras descontínuas
    de poliésteres originárias da República Popular da China e da Arábia Saudita,
    que altera o Regulamento (CE) n.° 2852/2000 que institui um direito anti-dumping
    definitivo sobre as importações de fibras descontínuas de poliésteres originárias
    da República da Coreia e que encerra o processo anti-dumping em relação às
    importações do mesmo produto originário de Taiwan
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 428/2005 al Consiliului din 10 martie 2005 de instituire
    a unui drept antidumping definitiv la importurile de fibre discontinue de poliester
    originare din Republica Populară Chineză și din Arabia Saudită, de modificare
    a Regulamentului (CE) nr. 2852/2000 de instituire a unui drept antidumping definitiv
    la importurile de fibre discontinue de poliester originare din Republica Coreea
    și de închidere a procedurii antidumping privind astfel de importuri originare
    din Taiwan
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 428/2005 z 10. marca 2005, ktorým sa ukladá
    konečné antidumpingové clo na dovozy polyesterových strižových vlákien
    s pôvodom v Čínskej ľudovej republike a Saudskej Arábii, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2852/2000, ktorým sa ukladá konečné antidumpingové
    clo na dovozy polyesterových strižových vlákien s pôvodom v Kórejskej republike,
    a ktorým sa ukončuje antidumpingové konanie v súvislosti s takými dovozmi
    s pôvodom na Taiwane
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 428/2005 z dne 10. marca 2005 o uvedbi dokončnih
    protidampinških dajatev pri uvozu rezanih vlaken iz poliestra s poreklom iz Ljudske
    republike Kitajske in Saudove Arabije, o spremembi Uredbe (ES) št. 2852/2000
    o uvedbi dokončnih protidampinških dajatev pri uvozu rezanih vlaken iz poliestra
    s poreklom iz Republike Koreje in o zaključku protidampinškega postopka v zvezi
    z uvozom teh izdelkov s poreklom iz Tajvana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 428/2005 del Consejo, de 10 de marzo de 2005, por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    fibras sintéticas discontinuas de poliéster originarias de la República Popular
    China y de Arabia Saudí, por el que se modifica el Reglamento (CE) n° 2852/2000
    por el que se establece un derecho antidumping definitivo sobre las importaciones
    de fibras sintéticas discontinuas de poliéster originarias de la República
    de Corea y por el que se da por concluido el procedimiento antidumping relativo
    a tales importaciones originarias de Taiwán
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 428/2005 av den 10 mars 2005 om införande
    av en slutgiltig antidumpningstull på import av polyesterstapelfibrer med ursprung
    i Folkrepubliken Kina och Konungariket Saudiarabien, om ändring av förordning
    (EG) nr 2852/2000 angående införande av en slutgiltig antidumpningstull på
    import av polyesterstapelfibrer med ursprung i Republiken Korea och om avslutande
    av antidumpningsförfarandet rörande import av polyesterstapelfibrer med ursprung
    i Taiwan
