title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1061/83 of 29 April 1983 re-establishing
    the levying of customs duties on babies' under garments of knitted or crocheted
    fabrics, products of category 68 (code 0680), originating in Malaysia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1061/83 de la Commission du 29 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux sous-vêtements de bonneterie
    pour bébés de la catégorie 68 (code 0680), originaires de la Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1061/83 der Kommission vom 29. April 1983 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken für Säuglinge
    der Warenkategorie Nr. 68 (Kennziffer 0680), mit Ursprung in Malaysia, dem die
    in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1061/83 af 29. april 1983 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage til
    spædbørn, under kategori 68 (kode 0680), som har oprindelse i Malaysia og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1061/83 της Επιτροπής
    της 29ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για έτοιμα ενδύματα
    εσωτερικά πλεκτά διά βρέφη, της κατηγορίας
    προϊόντων 68 (κωδικός αριθμός 0680), καταγωγής
    Μαλαισίας, δικαιούχων των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1061/83 della Commissione del 29 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti a maglia per bambini
    piccoli (bébés), della categoria di prodotti n. 68 (codice 0680), originarie
    della Malaysia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1061/83 van de Commissie van 29 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van brei- of haakwerk voor baby' s, van de categorie van produkten nr. 68 (codenummer
    0680), van oorsprong uit Maleisië, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
