title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1972, autorisant la République
    italienne à exclure du traitement communautaire les propulseurs spéciaux du
    type hors-bord et leurs pièces détachées, de la position 84.06 B et D Ex II
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '72/400/EWG: Entscheidung der Kommission vom 23. November 1972, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Außenbordmotoren und deren Ersatzteile
    der Tarifnummer 84.06 B und D ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/400/CEE: Decisione della Commissione, del 23 novembre 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i propulsori speciali
    del tipo fuoribordo ed i loro pezzi staccati della voce n. 84.06 B e D ex II della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/400/EEG: Beschikking van de Commissie van 23 november 1972 waarbij
    de Italiaanse Republiek wordt gemachtigd buitenboordmotoren en hun onderdelen
    van post 84.06 B en D ex II van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
