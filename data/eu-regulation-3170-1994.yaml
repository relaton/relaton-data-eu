  content: Commission Regulation (EC) No 3170/94 of 21 December 1994 opening for the
    first half of 1995 and laying down detailed rules for the application of an import
    quota for live bovine animals weighing between 160 and 300 kilograms, originating
    in and coming from the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3170/94 de la Commission du 21 décembre 1994 portant
    ouverture pour le premier semestre de 1995, et établissant les modalités d'application
    d'un quota d'importation d'animaux vivants de l'espèce bovine d'un poids de 160
    à 300 kilogrammes, originaires et en provenance de Pologne, de Hongrie, de la
    République tchèque et de la République slovaque
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3170/94 DER KOMMISSION vom 21. Dezember 1994 zur Eröffnung
