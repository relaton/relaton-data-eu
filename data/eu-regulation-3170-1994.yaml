    mit einem Stückgewicht von 160 bis 300 kg mit Ursprung in und Herkunft aus der
    Republik Polen, der Republik Ungarn, der Tschechischen Republik und der Slowakischen
    Republik und zur Festlegung der entsprechenden Durchführungsbestimmungen
  type: main
