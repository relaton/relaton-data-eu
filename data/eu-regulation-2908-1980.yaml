title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2908/80 of 11 November 1980 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china (including biscuit
    porcelain and parian), falling within heading No 69.11, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2908/80 de la Commission, du 11 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette, de la position 69.11 du tarif douanier
    commun, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2908/80 der Kommission vom 11. November 1980 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus Porzellan,
    der Tarifnummer 69.11, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 2789/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2908/80 af 11. november 1980 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af porcelæn, under pos. 69.11, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2908/80 della Commissione, dell' 11 novembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili al vasellame e oggetti
    di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa doganale
    comune, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2908/80 van de Commissie van 11 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van porselein, van post 69.11, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van
    de Raad tariefpreferenties werden geopend
  type: main
