title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1518/93 of 21 June 1993 establishing a list
    of products excluded from the application of Council Regulation (EEC) No 737/90
    on the conditions governing imports of agricultural products originating in third
    countries following the accident at the Chernobyl nuclear power station
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1518/93 de la Commission du 21 juin 1993 établissant
    une liste de produits exclus du champ d'application du règlement (CEE) n° 737/90
    relatif aux conditions d'importation de produits agricoles originaires des pays
    tiers à la suite de l'accident survenu à la centrale nucléaire de Tchernobyl
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1518/93 DER KOMMISSION vom 21. Juni 1993 zur Festlegung
    einer Liste von Erzeugnissen, die von der Durchführung der Verordnung (EWG) Nr.
    737/90 des Rates über die Einfuhrbedingungen für landwirtschaftliche Erzeugnisse
    mit Ursprung in Drittländern nach dem Unfall im Kernkraftwerk Tschernobyl ausgenommen
    sind
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1518/93 af 21. juni 1993 om fastsættelse
    af en fortegnelse over produkter, der undtages fra Rådets forordning (EØF) nr.
    737/90 om betingelser for indførsel af landbrugsprodukter med oprindelse i tredjelande
    som følge af ulykken på kernekraftværket i Tjernobyl
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1518/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Ιουνίου 1993 για την κατάρτιση καταλόγου
    προϊόντων που εξαιρούνται από το πεδίο εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 737/90 του Συμβουλίου
    σχετικά με τους όρους που διέπουν τις εισαγωγές
    γεωργικών προϊόντων που προέρχονται από τρίτες
    χώρες μετά το ατύχημα στον πυρηνικό σταθμό
    ηλεκτροπαραγωγής του Τσερνομπίλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1518/93, annettu 21 päivänä kesäkuuta 1993,
