    Tsernobylin ydinvoimalaonnettomuuden jälkeen annetun asetuksen (ETY) N:o 737/90
    soveltamisalaan kuulumattomien tuotteiden luettelosta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1518/93 DELLA COMMISSIONE del 21 giugno 1993 che stabilisce
    un elenco di prodotti esclusi dal campo di applicazione del regolamento (CEE)
    n. 737/90 del Consiglio relativo alle condizioni d' importazione di prodotti agricoli
    originari dei paesi terzi a seguito dell' incidente verificatosi nella centrale
    nucleare di Cernobil
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1518/93 VAN DE COMMISSIE van 21 juni 1993 tot vaststelling
