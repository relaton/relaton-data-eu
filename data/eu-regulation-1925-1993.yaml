title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1925/93 of 16 July 1993 determining the
    extent to which applications lodged in July 1993 for import licences for certain
    milk products and products covered by the arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1925/93 de la Commission, du 16 juillet 1993, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1993 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords intérimaires conclus par la Communauté
    avec la république de Pologne, la république de Hongrie et la République fédérative
    tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1925/93 der Kommission vom 16. Juli 1993 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Juli 1993 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen, der Republik Ungarn sowie der Tschechischen und Slowakischen
    Föderativen Republik geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1925/93 af 16. juli 1993 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i juli 1993 for visse
    produkter i sektoren for mælk og mejeriprodukter kan imødekommes under den ordning,
    der er fastsat i interimsaftalerne mellem Fællesskabet og Republikken Polen,
    Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
