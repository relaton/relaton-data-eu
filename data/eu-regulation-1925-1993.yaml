  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1925/93 de la Comisión, de 16 de julio de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en julio de 1993, de algunos productos del sector
    de la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
