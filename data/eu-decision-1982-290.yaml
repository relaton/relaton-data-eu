title:
- language: en
  script: Latn
  content: '82/290/EEC: Commission Decision of 13 April 1982 establishing that the
    apparatus described as ''Spex - Double Monochromator'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/290/CEE: Décision de la Commission, du 13 avril 1982, constatant que
    l''importation de l''appareil dénommé "Spex - double monochromator" ne peut
    être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/290/EWG: Entscheidung der Kommission vom 13. April 1982, mit der festgestellt
    wird, daß das Gerät ,,SPEX - Double Monochromator" nicht unter Befreiung von
    den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/290/EØF: Kommissionens beslutning af 13. april 1982 om fastslåelse
    af, at indførsel af apparatet "Spex - double monochromator" ikke kan ske med
    fritagelse for told efter den fælles toldtarif"'
  type: main
- language: el
  script: Grek
  content: '82/290/EOK: Απόφαση τής Επιτροπής τής 13ης Απριλίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «SPEX-Double Monochromator» δέν δύναται
    νά πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/290/CEE: Decisione della Commissione, del 13 aprile 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Spex - Double Monochromator"
    non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/290/EEG: Beschikking van de Commissie van 13 april 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Spex - Double Monochromator" niet met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
