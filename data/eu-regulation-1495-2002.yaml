    alcune denominazioni nel "Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette" di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari (Piment d'Espelette o Piment d'Espelette-Ezpeletako
    Biperra, Oberpfälzer Karpfen, Carne de Charneca, Carne Cachena da Peneda)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1495/2002 (2002. gada 21. augusts), ar kuru papildina
