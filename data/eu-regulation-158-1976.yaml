title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 158/76 of 20 January 1976 on the system for
    guaranteeing the stabilization of earnings from certain commodities exported by
    the ACP States and the overseas countries and territories associated with the
    Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 158/76 du Conseil, du 20 janvier 1976, relatif au
    système visant à garantir la stabilisation des recettes d'exportation de certains
    produits de base, en faveur des États ACP et des pays et territoires d'outre-mer
    associés à la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 158/76 des Rates vom 20. Januar 1976 über das System
    zur Stabilisierung der Erlöse aus der Ausfuhr bestimmter Grundstoffe zugunsten
    der AKP-Staaten und der mit der Gemeinschaft assoziierten überseeischen Länder
    und Gebiete
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 158/76 af 20. januar 1976 om den ordning,
    der skal garantere stabilisering af indtægterne ved udførsel af visse basisprodukter,
    og som skal komme AVS-staterne og de oversøiske lande og territorier, der er
    associeret Fællesskabet, til gode
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 158/76 del Consiglio, del 20 gennaio 1976, concernente
    il sistema inteso a garantire la stabilizzazione dei proventi d'esportazione di
    taluni prodotti di base a favore degli Stati ACP e dei paesi e territori d'oltremare
    associati alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 158/76 van de Raad van 20 januari 1976 inzake het
    systeem dat erop gericht is de stabilisatie van de exportopbrengsten voor bepaalde
    basisprodukten te waarborgen ten gunste van de A.C.S.-Staten en de met de Gemeenschap
    geassocieerde landen en gebieden overzee
  type: main
