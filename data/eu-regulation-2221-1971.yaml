title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2221/71 de la Commission, du 15 octobre 1971, relatif
    à l'ouverture d'une adjudication pour la mobilisation de farine de froment tendre
    destinée à l'Office de secours et de travaux des Nations Unies pour les réfugiés
    de Palestine, ci-après dénommé l'UNRWA, à titre d'aide
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2221/71 der Kommission vom 15. Oktober 1971 über
    die Durchführung einer Ausschreibung zur Bereitstellung von Weichweizenmehl als
    Hilfeleistung für das Hilfswerk der Vereinten Nationen für die Palästinensischen
    Flüchtlinge im Nahen Osten, nachstehend UNRWA genannt
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2221/71 della Commissione, del 15 ottobre 1971, relativo
    ad una gara per la mobilitazione di farina di frumento tenero destinata all'Ufficio
    dei soccorsi delle Nazioni Unite per i rifugiati di Palestina, in seguito denominato
    UNRWA, a titolo di aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2221/71 van de Commissie van 15 oktober 1971 betreffende
    de openstelling van een inschrijving voor het beschikbaar stellen van meel van
    zachte tarwe als voedselhulp aan het bureau voor bijstand en uitvoering van werken
    van de Verenigde Naties ten behoeve van de Palestijnse vluchtelingen, hierna genoemd
    U.N.R.W.A.
