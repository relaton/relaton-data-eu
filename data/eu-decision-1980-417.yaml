title:
- language: en
  script: Latn
  content: '80/417/EEC: Commission Decision of 25 March 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to yarn of synthetic textile fibres (continuous),
    not put up for retail sale, falling within subheading ex 51.01 A of the Common
    Customs Tariff (category 41), originating in Czechoslovakia and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/417/CEE: Décision de la Commission, du 25 mars 1980, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les fils de fibres textiles synthétiques
    continues non conditionnées pour la vente au détail, de la sous-position ex
    51.01 A du tarif douanier commun (catégorie 41), originaires de Tchécoslovaquie
    et mis en libre pratique dans les autres États membres (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/417/EWG: Entscheidung der Kommission vom 25. März 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche synthetische Spinnfäden, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifstelle ex 51.01 A des Gemeinsamen Zolltarifs
    (Kategorie 41) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/417/EØF: Kommissionens beslutning af 25. marts 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage garn af endeløse syntetiske fibre,
    ikke i detailsalgsoplægninger, som henhører under pos. ex 51.01 A i den fælles
    toldtarif (kategori 41), har oprindelse i Tjekkoslovakiet og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/417/CEE: Decisione della Commissione, del 25 marzo 1980, che autorizza
    il Regno dei Paesi Bassi ad escludere dal trattamento comunitario i filati di
    fibre tessili sintetiche continue, non preparati per la vendita al minuto, della
    sottovoce ex 51.01 A della tariffa doganale comune (categoria 41), originari della
    Cecoslovacchia e messi in libera pratica negli altri Stati membri (Il testi in
    lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/417/EEG: Beschikking van de Commissie van 25 maart 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd garens van synthetische vezels, niet gereed voor de verkoop
    in het klein, van post ex 51.01 A van het gemeenschappelijk douanetarief (categorie
    41), van oorsprong uit Tsjechoslowakije en in de overige Lid- Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
