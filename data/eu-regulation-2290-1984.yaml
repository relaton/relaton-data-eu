title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2290/84 of 6 August 1984 re-establishing
    the levying of customs duties on diodes, transistors and similar semi-conductor
    devices; light-emitting diodes; electronic micro-circuits; parts, falling within
    subheadings 85.21 D and E and originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2290/84 de la Commission du 6 août 1984 portant rétablissement
    de la perception des droits de douane applicables aux diodes, transistors et dispositifs
    similaires à semi-conducteur; diodes émettrices de lumière; microstructures
    électroniques; parties et pièces détachées, des sous-positions 85.21 D et
    E du tarif douanier commun, originaires de Malaysia, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2290/84 der Kommission vom 6. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter; Leuchtdioden;
    elektronische Mikroschaltungen; Teile, der Tarifstellen 85.21 D und E, mit Ursprung
    in Malaysia, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2290/84 af 6. august 1984 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter;
    lysemitterende dioder; elektroniske mikrokredsløb; dele henhørende under underpos.
    85.21 D og E og med oprindelse i Malaysia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2290/84 της Επιτροπής
    της 6ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις με ημιαγωγόν, διόδους
    εκπομπής φωτός, ηλεκτρονικές μικροκατασκευές,
    μέρη και μεμονωμένα τεμάχια, των διακρίσεων
    85.21 Δ και Ε του Κοινού Δασμολογίου, καταγωγής
    Μαλαισίας, δικαιούχου των προβλεπόμενων από
    τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2290/84 della Commissione del 6 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai diodi, transistori e simili dispositivi
    semiconduttori, diodi emettitori di luce, microstrutture elettroniche, parti e
    pezzi staccati, delle sottovoci 85.21 D ed E della tariffa doganale comune, originari
    della Malaysia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2290/84 van de Commissie van 6 augustus 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen; luminescentiedioden; elektronische microstructuren,
    delen en onderdelen, van postonderverdeling 85.21 D en E, van oorsprong uit Maleisië,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
