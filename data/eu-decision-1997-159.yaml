title:
- language: en
  script: Latn
  content: Commission Decision of 13 February 1997 authorizing the Member States exceptionally
    to provide for derogations from certain provisions of Council Directive 77/93/EEC
    in respect of plants of Vitis L., other than fruits, originating in Switzerland
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 13 février 1997 autorisant les États membres
    à prévoir à titre exceptionnel des dérogations à certaines dispositions de
    la directive 77/93/CEE du Conseil pour les végétaux de Vitis L., à l'exception
    des fruits, originaires de Suisse
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Februar 1997 zur Ermächtigung der
    Mitgliedstaaten, für Vitis L., außer Früchten, mit Ursprung in der Schweiz
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. februar 1997 om bemyndigelse af medlemsstaterne
    til undtagelsesvis at indrømme undtagelser fra visse bestemmelser i Rådets direktiv
    77/93/EØF for planter af Vitis L., dog ikke frugter, med oprindelse i Schweiz
  type: main
- language: el
  script: Grek
  content: '97/159/ΕΚ: Απόφαση της Επιτροπής της 13ης Φεβρουαρίου
    1997 που επιτρέπει στα κράτη μέλη να παρέχουν
    κατ'' εξαίρεση παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά
    με τα φυτά Vitis L., με εξαίρεση τους καρπούς, καταγωγής
    Ελβετίας'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 13 päivänä helmikuuta 1997, luvan antamisesta
    jäsenvaltioille säätää erityisiä poikkeuksia Sveitsistä peräisin olevia
    suvun Vitis L. kasveja, hedelmiä lukuun ottamatta, koskevista neuvoston direktiivin
    77/93/ETY tietyistä säännöksistä
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 13 febbraio 1997 che autorizza gli Stati
    membri, in via eccezionale, a prevedere deroghe a determinate disposizioni della
    direttiva 77/93/CEE del Consiglio riguardo alle piante di Vitis L., ad eccezione
    dei frutti, originarie della Svizzera
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 februari 1997 tot machtiging van de
    lidstaten om bij uitzondering voor planten van Vitis L., met uitzondering van
    vruchten, van oorsprong uit Zwitserland afwijking van sommige bepalingen van Richtlijn
    77/93/EEG van de Raad toe te staan
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 13 de Fevereiro de 1997 que autoriza os Estados-membros
    a prever, a título excepcional, uma derrogação de certas disposições da Directiva
    77/93/CEE do Conselho relativamente às plantas de Vitis L., com excepção dos
    frutos, originárias da Suíça
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 13 de febrero de 1997 por la que se autoriza
    excepcionalmente a los Estados miembros para establecer excepciones a determinadas
    disposiciones de la Directiva 77/93/CEE del Consejo en relación con las plantas
    de Vitis L. originarias de Suiza, excepto los frutos
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 13 februari 1997 om bemyndigande för medlemsstaterna
    att i enstaka fall medge undantag från vissa bestämmelser i rådets direktiv
    77/93/EEG för plantor av Vitis L., utom frukter, med ursprung i Schweiz
