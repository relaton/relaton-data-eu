id: EUDecision1961716
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à l'autorisation accordée à la République
    italienne, en application de l'article 226 du Traité, pour une période d'un
    an à compter de la date de la notification de la présente décision, d'effectuer,
    pour l'iode (position du tarif italien 28.91 D) un rapprochement de 20 % au lieu
    de 30 % vers le Tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung Italiens gemäß
    Artikel 226 des Vertrages, vom Datum der Notifizierung dieser Entscheidung an
    für die Dauer eines Jahrs die Zölle für rohes und anderes Jod (Nummer des italienischen
    Zolltarifs 28.01 d) statt um 30 % nur um 20 % an den gemeinsamen Zolltarif anzugleichen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, ai sensi dell'articolo 226 del Trattato, per un periodo di
    un anno a decorrere dalla data della notifica della presente decisione, di effettuare
    per lo iodio (voce della tariffa italiana 28.01 d) un ravvicinamento del 20 %,
    invece che del 30 % alla tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging voor een periode
    van één jaar, te rekenen van de datum waarop van deze beschikking kennis wordt
    gegeven, met betrekking tot jodium (post 28.01 d van het Italiaanse tarief), over
    te gaan tot een aanpassing aan het gemeenschappelijk douanetarief met 20 % i.p.v.
    30 %
  type: main
