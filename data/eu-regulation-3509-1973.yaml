    aus Jute und Kokosfasern mit Ursprung in Indien und für Fertigwaren aus Jute
    mit Ursprung in Bangla Desh
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3509/73 af 18. december 1973 om åbning af
