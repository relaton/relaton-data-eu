  content: Regulation (EEC) No 3509/73 of the Council of 18 December 1973 on the opening
    of tariff preferences in the form of a partial suspension of customs duties for
    products made from jute and coir originating in India and products made from jute
    originating in Bangladesh
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3509/73 du Conseil, du 18 décembre 1973, portant
