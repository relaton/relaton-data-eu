    (ΕΟΚ) αριθ. 3587/86 για τη θέσπιση των συντελεστών
    προσαρμογής που εφαρμόζονται στην τιμή αγοράς
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις μελιτζάνες και τα νεκταρίνια
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1403/88, annettu 24 päivänä toukokuuta 1988,
    hedelmä- ja vihannesalalla ostohintoihin sovellettavista mukautuskertoimista
    annetun asetuksen (ETY) N:o 3587/86 muuttamisesta munakoisojen ja nektariinien
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1403/88 della Commissione del 24 maggio 1988 che modifica
    il regolamento (CEE) n. 3587/86 che fissa i coefficienti di adattamento da applicare
    ai prezzi d'acquisto nel settore degli ortofrutticoli in ordine alle melanzane
    e alle nettarine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1403/88 van de Commissie van 24 mei 1988 tot wijziging
