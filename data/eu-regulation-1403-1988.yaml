    prices for fruit and vegetables as regards aubergines and nectarines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1403/88 de la Commission du 24 mai 1988 modifiant
    le règlement (CEE) n° 3587/86 fixant les coefficients d'adaptation à appliquer
    aux prix d'achat dans le secteur des fruits et légumes en ce qui concerne les
    aubergines et les nectarines
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1403/88 der Kommission vom 24. Mai 1988 zur Änderung
