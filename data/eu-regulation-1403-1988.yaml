    die Ankaufspreise auf dem Sektor Obst und Gemüse bezüglich Auberginen und Nektarinen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1403/88 af 24. maj 1988 om ændring
    af forordning (EØF) nr. 3587/86 om fastsættelse af de tilpasningskoefficienter,
    der skal anvendes på opkøbspriserne for frugt og grønsager, for så vidt angår
    auberginer og nektariner
  type: main
- language: el
  script: Grek
