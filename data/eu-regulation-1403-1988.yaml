    die op de aankoopprijzen in de sector groenten en fruit moeten worden toegepast
    ten aanzien van aubergines en nectarines
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1403/88 da Comissão de 24 de Maio de 1988 que altera
    o Regulamento (CEE) n.° 3587/86 que fixa os coeficientes de adaptação a aplicar
    aos preços de compra, no sector das frutas e produtos hortícolas, no que diz
    respeito às beringelas e nectarinas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1403/88 de la Comisión de 24 de mayo de 1988 que
