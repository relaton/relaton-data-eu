title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3559/93 of 22 December 1993 amending Regulation
    (EEC) No 2877/93 determining the extent to which applications lodged in October
    1993 for import licences for fresh, chilled or frozen beef under the import arrangements
    provided for in the Interim Agreements concluded by the Community with the Republic
    of Poland, the Republic of Hungary and the Czech and Slovak Federal Republic (CSFR)
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3559/93 de la Commission, du 22 décembre 1993, modifiant
    le règlement (CEE) n 2877/93 déterminant la mesure dans laquelle peuvent être
    acceptées les demandes de certificats d'importation introduites en octobre 1993
    pour les viandes bovines fraîches, réfrigérées ou congelées dans le cadre
    des régimes d'importation prévus par les accords intérimaires conclus par la
    Communauté avec la république de Pologne, la république de Hongrie et la République
    fédérative tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3559/93 der Kommission vom 22. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 2877/93 zur Festsetzung des Umfangs, in dem die im Oktober
    1993 für frisches, gekühltes oder gefrorenes Rindfleisch gestellten Einfuhrlizenzanträge
    gemäß den Interimsabkommen zwischen der Gemeinschaft und der Republik Polen,
    der Republik Ungarn und der Tschechischen und Slowakischen Föderativen Republik
    (CSFR) genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3559/93 af 22. december 1993 om ændring
    af forordning (EØF) nr. 2877/93 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, indgivet i oktober 1993, om importlicenser for fersk,
    kølet og frosset oksekød i forbindelse med de importordninger, der er fastsat
    i interimsaftalerne mellem Fællesskabet og Republikken Polen, Republikken Ungarn
    og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3559/93 της Επιτροπής
    της 22ας Δεκεμβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2877/93 περί καθορισμού
    του ορίου εντός του οποίου δύνανται να γίνουν
    αποδεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υποβλήθηκαν τον Οκτώβριο 1993 για τα νωπά,
    διατηρημένα με απλή ψύξη ή κατεψυγμένα βόεια
    κρέατα στα πλαίσια των καθεστώτων εισαγωγής
    που προβλέπονται από τις τις προσωρινές συμφωνίες
    που συνήφθησαν από την Κοινότητα με τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας και
    την Τσεχική και Σλοβακική Ομοσπονδιακή Δημοκρατία
    (ΤΣΟΔ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3559/93 della Commissione, del 22 dicembre 1993, che
    modifica il regolamento (CEE) n. 2877/93 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli d'importazione presentate nel mese di ottobre
    1993 per le carni bovine fresche, refrigerate o congelate nel quadro dei regimi
    di importazione previsti dagli accordi interinali conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica federativa
    ceca e slovacca (RFCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3559/93 van de Commissie van 22 december 1993 houdende
    wijziging van Verordening (EEG) nr. 2877/93 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor vers, gekoeld
    of bevroren rundvlees die in oktober 1993 zijn ingediend op grond van de invoerregelingen
    die zijn vastgesteld in de door de Gemeenschap met de Republiek Polen, de Republiek
    Hongarije en de Tsjechische en Slowaakse Federatieve Republiek (TSFR) gesloten
    Interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3559/93 da Comissão, de 22 de Dezembro de 1993, que
    altera o Regulamento (CEE) nº 2877/93, que determina em que medida podem ser
    aceites os pedidos de certificados de importação de carne de bovino fresca,
    refrigerada ou congelada, apresentados em Outubro de 1993 ao abrigo dos regimes
    de importação previstos nos acordos provisórios concluídos pela Comunidade
    com a República da Polónia, a República da Hungria e a República Federativa
    Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 3559/93 de la Comisión, de 22 de diciembre de 1993,
    por el que se modifica el Reglamento (CEE) n 2877/93 por el que se determina la
    proporción en que se satisfarán las solicitudes de licencias de importación
    de carne fresca, refrigerada o congelada de vacuno presentadas en octubre de 1993
    al amparo de los regímenes de importación establecidos en los Acuerdos interinos
    celebrados entre la Comunidad y la República de Polonia, la República de Hungría
    y la República Federativa Checa y Eslovaca (RFCE)
