    de Execução (UE) n. ° 1389/2011 do Conselho que institui um direito anti-dumping
    definitivo sobre as importações de ácido tricloro-isocianúrico originário
    da República Popular da China, que revoga o direito no que respeita às importações
    provenientes de um exportador daquele país e que sujeita essas importações
    a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 727/2014 al Comisiei din 30
    iunie 2014 de deschidere a unei reexaminări în ceea ce privește un nou exportator
    a Regulamentului (UE) nr. 1389/2011 al Consiliului de instituire a unei taxe antidumping
    definitive la importurile de acid tricloroizocianuric originar din Republica Populară
    Chineză, de abrogare a taxei cu privire la importurile care provin de la un exportator
    din această țară și de impunere a obligativității de înregistrare a acestor
    importuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 727/2014 z 30. júna 2014 o začatí
    preskúmania „nového vývozcu“ v súvislosti s vykonávacím nariadením
    Rady (EÚ) č. 1389/2011, ktorým sa ukladá konečné antidumpingové clo na
    dovoz kyseliny trichlórizokyanurovej s pôvodom v Čínskej ľudovej republike,
    o zrušení tohto cla, pokiaľ ide o dovoz od jedného vývozcu v tejto krajine,
    a o zavedení registrácie tohto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 727/2014 z dne 30. junija 2014 o začetku
    pregleda v zvezi z „novim izvoznikom“ v okviru Izvedbene uredbe Sveta (EU)
    št. 1389/2011 o uvedbi dokončne protidampinške dajatve na uvoz triklorizocianurne
    kisline s poreklom iz Ljudske republike Kitajske, odpravi dajatve na uvoz enega
    proizvajalca izvoznika iz te države in uvedbi registracije takšnega uvoza
  type: main
