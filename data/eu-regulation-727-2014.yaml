    del Reglamento de Ejecución (UE) n ° 1389/2011 del Consejo, por el que se establece
    un derecho antidumping definitivo sobre las importaciones de ácido tricloroisocianúrico
    originario de la República Popular China, y por el que se deroga el derecho aplicable
    a las importaciones de un exportador de ese país y se someten a registro dichas
    importaciones
  type: main
