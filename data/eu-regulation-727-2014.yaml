    s obzirom na uvoz od jednog izvoznika iz te zemlje i uvodi evidentiranje tog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság 727/2014/EU végrehajtási rendelete ( 2014. június 30. )
    a Kínai Népköztársaságból származó triklór-izocianursav behozatalára
    végleges dömpingellenes vám kivetéséről és a kivetett ideiglenes vám végleges
    beszedéséről szóló 1389/2011/EU tanácsi végrehajtási rendelet új exportőr
    tekintetében történő felülvizsgálatának megindításáról, az ezen ország
    egyik exportőrétől származó behozatalra vonatkozó vám eltörléséről,
    valamint az e behozatalra vonatkozó nyilvántartásba vételi kötelezettségről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 727/2014 della Commissione, del 30 giugno
    2014 , che avvia un riesame relativo a un «nuovo esportatore» del regolamento
    di esecuzione (UE) n. 1389/2011 del Consiglio che istituisce un dazio antidumping
    definitivo sulle importazioni di acido tricloroisocianurico originario della Repubblica
    popolare cinese, abroga il dazio sulle importazioni provenienti da un esportatore
    di questo paese e stabilisce che tali importazioni siano soggette a registrazione
  type: main
