title:
- language: en
  script: Latn
  content: '96/388/EC: Commission Decision of 17 June 1996 amending Decision 94/836/EC
    approving the Single Programming Document for Community structural measures for
    improving the processing and marketing conditions for agricultural products in
    the United Kingdom, except for the Objective No 1 regions of Merseyside, Highlands
    and Islands and Northern Ireland, in respect of Objective No 5 (a), covering the
    period between 1994 and 1999 (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/388/CE: Décision de la Commission du 17 juin 1996 modifiant la décision
    94/836/CE approuvant le document unique de programmation pour les mesures structurelles
    communautaires relatives à l''amélioration des conditions de transformation
    et de commercialisation des produits agricoles au Royaume-Uni, à l''exception
    des régions de l''objectif nº 1 de Merseyside, des Highlands et Islands et Irlande
    du Nord, au titre de l''objectif nº 5 a), couvrant la période entre 1994 et
    1999 (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/388/EG: Entscheidung der Kommission vom 17. Juni 1996 zur Änderung
    der Entscheidung 94/836/EG zur Genehmigung des den Zeitraum 1994 bis 1999 betreffenden
    einzigen Programmplanungsdokumentes zu den strukturellen Interventionen der Gemeinschaft
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen landwirtschaftlicher
    Erzeugnisse im Rahmen der Zielvorgabe 5a im Vereinigten Königreich, mit Ausnahme
    der Ziel-1-Gebiete Merseyside, Highlands and Islands und Nord-Irland (Nur die
    englische Version ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/388/EF: Kommissionens beslutning af 17. juni 1996 om ændring af beslutning
    94/836/EF om godkendelse af enhedsprogrammeringsdokumentet for EF''s strukturinterventioner
    vedrørende forarbejdning og afsætning af landbrugsprodukter i Det Forenede Kongerige,
    med undtagelse af mål nr. 1-områderne i Merseyside, Højlandene og Øerne samt
    Nordirland, for mål nr. 5a for perioden 1994-1999 (Kun den engelske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/388/ΕΚ: Απόφαση της Επιτροπής της 17ης Ιουνίου
    1996 για την τροποποίηση της απόφασης 94/836/ΕΚ
    σχετικά με την έγκριση του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις που αφορούν τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών προϊόντων
    στο Ηνωμένο Βασίλειο, εκτός των περιοχών του
    στόχου αριθ. 1 Merseyside, Highlands και Islands και Βόρειο
    Ιρλανδία, στο πλαίσιο του στόχου αριθ. 5α που
    καλύπτει την περίοδο από το 1994 έως το 1999 (Το
    κείμενο στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/388/EY: Komission päätös, tehty 17 päivänä kesäkuuta 1996, tavoitteeseen
    5 a liittyviä yhteisön rakenteellisia toimenpiteitä koskevan yhtenäisen ohjelma-asiakirjan
    hyväksymisestä jaksolle 1994 -1999 maataloustuotteiden jalostamisen ja kaupan
    pitämisen edellytysten parantamiseksi Yhdistyneessä kuningaskunnassa lukuun
    ottamatta tavoitteeseen 1 kuuluvia Merseysiden, Ylämaan ja Skotlannin saarten
    sekä Pohjois-Irlannin alueita tehdyn päätöksen 94/836/EY muuttamisesta (Ainoastaan
    englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
