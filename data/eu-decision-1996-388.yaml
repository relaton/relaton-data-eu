    di trasformazione e di commercializzazione dei prodotti agricoli nel Regno Unito,
    escluse le regioni dell''obiettivo n. 1 di Merseyside, Highlands e Isole e Irlanda
    del Nord, nel quadro dell''obiettivo n. 5 a) per il periodo dal 1994 al 1999 (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
