    do Evropské unie
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3093/95 af 22. december 1995 om fastsættelse
    af de toldsatser, som Fællesskabet skal anvende som følge af forhandlingerne
