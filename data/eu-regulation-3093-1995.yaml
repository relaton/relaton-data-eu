title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3093/95 of 22 December 1995 laying down the
    rates of duty to be applied by the Community resulting from negotiations under
    GATT Article XXIV.6 consequent upon the accession of Austria, Finland and Sweden
    to the European Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3093/95 du Conseil, du 22 décembre 1995, fixant les
    taux des droits de douane à appliquer par la Communauté, par suite des négociations
    menées au titre de l'article XXIV:6 du GATT après l'adhésion de l'Autriche,
    de la Finlande et de la Suède à l'Union européenne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3093/95 des Rates vom 22. Dezember 1995 zur Festlegung
    der nach dem Beitritt Österreichs, Finnlands und Schwedens zur Europäischen
    Union in den Verhandlungen gemäß Artikel XXIV Absatz 6 des GATT vereinbarten
    und von der Gemeinschaft anzuwendenden Zollsätze
  type: main
- language: bg
