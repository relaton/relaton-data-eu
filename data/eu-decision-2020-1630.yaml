    compatibilité électromagnétique des appareils industriels, scientifiques et
    médicaux, des appareils électrodomestiques, des outillages électriques et des
    appareils analogues, des appareils électriques d’éclairage et des appareils
    analogues, des équipements multimédias, des appareillages de connexion et de
    commande
  type: main
