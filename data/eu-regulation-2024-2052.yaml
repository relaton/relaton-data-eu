    a určité pracovné kritériá analytických metód v súvislosti s rezíduami
    farmakologicky účinných látok používaných u zvierat určených na výrobu
    potravín
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/2052 z dne 30. julija 2024 o spremembi
