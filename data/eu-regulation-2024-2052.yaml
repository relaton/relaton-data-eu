    му и на някои критерии към аналитичните характеристики
    на аналитичните методи за остатъци от фармакологичноактивни
    субстанции, използвани при животни, отглеждани
    за производство на храни
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2052 ze dne 30. července 2024,
