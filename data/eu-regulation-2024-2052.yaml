    de los métodos analíticos para los residuos de sustancias farmacológicamente
    activas utilizadas en animales productores de alimentos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/2052 av den 30 juli 2024
