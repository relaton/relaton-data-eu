title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2052 of 30 July 2024 amending
    Implementing Regulation (EU) 2021/808 as regards its scope and certain performance
    criteria of analytical methods for residues of pharmacologically active substances
    used in food-producing animals
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2052 de la Commission du 30 juillet
    2024 modifiant le règlement d’exécution (UE) 2021/808 en ce qui concerne son
    champ d’application et certains critères de performance des méthodes d’analyse
    des résidus de substances pharmacologiquement actives utilisées chez les animaux
    producteurs d’aliments
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2052 der Kommission vom 30. Juli 2024
    zur Änderung der Durchführungsverordnung (EU) 2021/808 hinsichtlich ihres Geltungsbereichs
    und bestimmter Leistungskriterien für Analysemethoden für Rückstände pharmakologisch
    wirksamer Stoffe in zur Lebensmittelerzeugung genutzten Tieren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/2052 на Комисията
