    analíticos para os resíduos de substâncias farmacologicamente ativas utilizadas
    em animais produtores de géneros alimentícios
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2052 al Comisiei din 30 iulie
    2024 de modificare a Regulamentului de punere în aplicare (UE) 2021/808 în ceea
    ce privește domeniul său de aplicare și anumite criterii de performanță referitoare
    la metodele analitice pentru reziduurile de substanțe farmacologic active utilizate
    la animalele de la care se obțin produse alimentare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/2052 z 30. júla 2024, ktorým
