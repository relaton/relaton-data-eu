    zakresu stosowania i niektórych kryteriów wydajności metod analitycznych względem
    pozostałości substancji farmakologicznie czynnych stosowanych u zwierząt, od
    których lub z których pozyskuje się żywność
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/2052 da Comissão, de 30 de julho de
