    působnosti a některá pracovní kritéria analytických metod pro rezidua farmakologicky
    účinných látek používaných u zvířat určených k produkci potravin
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2052 af 30. juli 2024
