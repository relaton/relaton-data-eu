    territórios, zonas ou compartimentos a partir dos quais são autorizados a importação
    e o trânsito na União de determinados produtos à base de aves de capoeira relativamente
    à gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/1166 al Comisiei din 6 august
    2020 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Statele Unite din lista cu țări terțe, teritorii, zone
    sau compartimente din care anumite produse obținute de la păsări de curte pot
    fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de gripă
    aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/1166 zo 6. augusta 2020, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
