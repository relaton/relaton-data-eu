title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1166 of 6 August 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1166 de la Commission du 6 août 2020
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l’Union ou transiter par celle-ci, pour ce qui est de l’influenza aviaire
    hautement pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1166 der Kommission vom 6. August 2020
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zu den Vereinigten Staaten in der Liste der Drittländer, Gebiete, Zonen
    und Kompartimente, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, in Bezug auf die hochpathogene
    aviäre Influenza
  type: main
- language: bg
  script: Cyrl
