    de terceros países, territorios, zonas o compartimentos desde los cuales están
    permitidos la importación en la Unión o el tránsito por esta de determinadas
    mercancías de aves de corral, en relación con la influenza aviar de alta patogenicidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/1166 av den 6 augusti
