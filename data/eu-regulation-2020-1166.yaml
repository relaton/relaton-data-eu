    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz nekaterega perutninskega blaga v Unijo ali njegov tranzit skozi
    Unijo v zvezi z visokopatogeno aviarno influenco
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/1166 de la Comisión de 6 de agosto
