  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/1166 van de Commissie van 6 augustus 2020
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
