    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    az Egyesült Államokra vonatkozó bejegyzés tekintetében a magas patogenitású
    vírustörzsek okozta madárinfluenza megjelenése nyomán szükségessé vált
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/1166 della Commissione del 6 agosto
    2020 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa agli Stati Uniti nell’elenco di paesi terzi, loro territori,
    zone o compartimenti da cui determinati prodotti a base di pollame possono essere
    importati o transitare nell’Unione in relazione all’influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/1166 (2020. gada 6. augusts),
    ar ko attiecībā uz ierakstu par Amerikas Savienotajām Valstīm to trešo valstu,
    teritoriju, zonu vai nodalījumu sarakstā, no kurām saistībā ar augsti patogēno
    putnu gripu drīkst importēt Savienībā vai tranzītā caur to pārvadāt konkrētas
    mājputnu izcelsmes preces, groza Regulas (EK) Nr. 798/2008 I pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/1166 2020 m. rugpjūčio
    6 d. kuriuo dėl labai patogeniško paukščių gripo ir su juo susijusio Jungtinių
    Amerikos Valstijų įrašo trečiųjų šalių, teritorijų, zonų ar skyrių,
    iš kurių galima importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam
    tikras naminių paukščių prekes, sąraše iš dalies keičiamas Reglamento
