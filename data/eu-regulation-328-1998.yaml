title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 328/98 of 10 February 1998 determining the
    extent to which applications for import licences submitted in January 1998 for
    certain products in the milk and milk products sector under the schemes provided
    for in the Europe Agreements between the Community, the Republic of Poland and
    Bulgaria and in the Agreements on free trade between the Community and the Baltic
    States may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 328/98 DE LA COMMISSION du 10 février 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1998 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté, la république de Pologne et la Bulgarie et du régime prévu par
    les accords sur la libéralisation des échanges entre la Communauté et les pays
    baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 328/98 DER KOMMISSION vom 10. Februar 1998 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Januar 1998 im Rahmen der Regelungen gemäß
    den Europa-Abkommen zwischen der Gemeinschaft und der Republik Polen und Bulgarien
    und der Regelung gemäß dem Freihandelsabkommen zwischen der Gemeinschaft und
    den baltischen Staaten eingereicht wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 328/98 af 10. februar 1998 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i januar 1998 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Polen og Republikken Bulgarien
    og ordningen i aftalerne om liberalisering af samhandelen mellem Fællesskabet
    og De Baltiske Lande kan accepteres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 328/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 10ης Φεβρουαρίου 1998 για τον προσδιορισμό
    του μέτρου κατά το οποίο μπορούν να γίνονται
    δεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υπεβλήθησαν τον Ιανουάριο του 1998 για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας,
    της Δημοκρατίας της Πολωνίας, της Βουλγαρίας
    και του καθεστώτος που προβλέπεται από τις
    συμφωνίες ελευθέρωσης των συναλλαγών μεταξύ
    της Κοινότητας και των βαλτικών χωρών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 328/98, annettu 10 päivänä helmikuuta 1998,
    yhteisön sekä Puolan tasavallan ja Bulgarian välisissä Eurooppa-sopimuksissa,
    yhteisön sekä Baltian maiden välisissä vapaakauppaa koskevissa sopimuksissa
    määrätyn järjestelmän mukaisesti tietyistä maito- ja maitotuotealan tuotteista
    vuoden 1998 tammikuussa jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 328/98 DELLA COMMISSIONE del 10 febbraio 1998 che stabilisce
    la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel gennaio 1998 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità, la Repubblica di Polonia e la Bulgaria e del regime previsto dagli
    accordi sul libero scambio tra la Comunità e i paesi baltici
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 328/98 VAN DE COMMISSIE van 10 februari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector melk en zuivelproducten, die in januari 1998
    worden ingediend op grond van de regelingen waarin is voorzien bij de Europa-overeenkomsten
    tussen, enerzijds, de Gemeenschap en, anderzijds, de Republiek Polen en Bulgarije,
    en van de regeling waarin is voorzien bij de overeenkomsten betreffende vrijhandel
    en met handel verband houdende zaken tussen de Gemeenschap en de Baltische staten
  type: main
