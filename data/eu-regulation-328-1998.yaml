  script: Latn
  content: REGULAMENTO (CE) Nº 328/98 DA COMISSÃO de 10 de Fevereiro de 1998 que
    determina a medida em que podem ser aceites os pedidos de certificados de importação
    introduzidos em Janeiro de 1998 para determinados produtos do sector de leite
    e dos produtos lácteos no âmbito dos regimes previstos nos acordos europeus
    entre a Comunidade, a República da Polónia e a Bulgária do regime previsto
    nos acordos sobre comércio livre entre a Comunidade e os países bálticos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 328/98 DE LA COMISIÓN de 10 de febrero de 1998 por
    el que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en enero de 1998 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad, la República de Polonia
    y Bulgaria y del régimen previsto en los Acuerdos de libre comercio entre la
    Comunidad y los países bálticos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 328/98 av den 10 februari 1998 om fastställande
    av i vilken utsträckning ansökningar om importlicenser får godkännas som inlämnas
    i januari 1998 för vissa produkter inom sektorn för mjölk och mjölkprodukter
    inom ramen för ordningarna i Europaavtalen mellan gemenskapen, Polen och Bulgarien
    samt ordningen i frihandelsavtalen mellan gemenskapen och de baltiska länderna
