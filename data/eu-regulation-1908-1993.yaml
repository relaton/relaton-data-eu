- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1908/93 of 14 July 1993 re-establishing
    the levying of customs duties on products falling within CN code ex 4203, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1908/93 de la Commission du 14 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC ex 4203 originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1908/93 DER KOMMISSION vom 14. Juli 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes ex 4203 mit Ursprung in Pakistan,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1908/93 af 14. juli 1993 om genindførelse
    af opkrævning af told for varer under KN-kode ex 4203 og med oprindelse i Pakistan,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1908/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
