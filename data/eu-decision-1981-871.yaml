    der Französischen Republik, aus Pakistan stammende Blusen und Hemdblusen aus
    Gewirken oder Geweben von der Gemeinschaftsbehandlung auszuschließen (Nur der
    französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/871/EØF: Kommissionens beslutning af 28. september 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage skjorter, skjortebluser
