title:
- language: en
  script: Latn
  content: '81/871/EEC: Commission Decision of 28 September 1981 authorizing the French
    Republic not to apply Community treatment to blouses and shirt-blouses, knitted,
    crocheted or woven, originating in Pakistan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/871/CEE: Décision de la Commission, du 28 septembre 1981, autorisant
    la République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie tissés, originaires du Pakistan
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
