    u skladu s Uredbom (EU) 2024/573 Europskog parlamenta i Vijeća, minimalnih zahtjeva
    za potvrde o osposobljavanju fizičkih osoba i uvjeta za uzajamno priznavanje
    takvih potvrda o osposobljavanju u pogledu određene pokretne opreme koja sadržava
    fluorirane stakleničke plinove ili zamjenska rješenja za njih te o stavljanju
    izvan snage Uredbe Komisije (EZ) br. 307/2008
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1893 végrehajtási rendelete (2025. szeptember
    17.) a fluortartalmú üvegházhatású gázokat vagy azok alternatíváit tartalmazó
    egyes mobil berendezések tekintetében a természetes személyek képzési igazolásaira
    vonatkozó minimumkövetelményeknek és az ilyen képzési igazolások kölcsönös
    elismerésére vonatkozó feltételeknek az (EU) 2024/573 európai parlamenti
    és tanácsi rendelet szerinti megállapításáról, valamint a 307/2008/EK bizottsági
    rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1893 della Commissione, del 17 settembre
    2025, che stabilisce, in applicazione del regolamento (UE) 2024/573 del Parlamento
    europeo e del Consiglio, i requisiti minimi per gli attestati di formazione delle
    persone fisiche e le condizioni per il riconoscimento reciproco di tali attestati
    per quanto riguarda determinate apparecchiature mobili contenenti gas fluorurati
    a effetto serra o loro alternative e che abroga il regolamento (CE) n. 307/2008
    della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1893 (2025. gada 17. septembris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (ES) 2024/573 attiecībā
    uz noteiktu mobilo aprīkojumu, kas satur fluorētas siltumnīcefekta gāzes vai
    to alternatīvas, nosaka minimālās prasības fizisku personu apmācības apliecībām
    un šādu apmācības apliecību savstarpējas atzīšanas nosacījumus un ar
    ko atceļ Komisijas Regulu (EK) Nr. 307/2008
  type: main
- language: lt
  script: Latn
  content: 2025 m. rugsėjo 17 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1893,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) 2024/573 nustatomi
    fizinių asmenų mokymo pažymėjimų minimalieji reikalavimai ir tokių mokymo
    pažymėjimų tarpusavio pripažinimo sąlygos, susiję su tam tikra mobiliąja
    įranga, kurioje yra tam tikrų fluorintų šiltnamio efektą sukeliančių dujų
    arba jų alternatyvų, ir panaikinamas Komisijos reglamentas (EB) Nr. 307/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1893 tas-17
    ta’ Settembru 2025 li jistabbilixxi, skont ir-Regolament (UE) 2024/573 tal-Parlament
    Ewropew u tal-Kunsill, ir-rekwiżiti minimi għall-attestazzjonijiet ta’ taħriġ
    ta’ persuni fiżiċi u l-kundizzjonijiet għar-rikonoxximent reċiproku ta’
    tali attestazzjonijiet ta’ taħriġ fir-rigward ta’ ċertu tagħmir mobbli
    li fih gassijiet fluworurati b’effett ta’ serra jew alternattivi tagħhom
    u li jħassar ir-Regolament tal-Kummissjoni (KE) Nru 307/2008
  type: main
- language: nl
  script: Latn
