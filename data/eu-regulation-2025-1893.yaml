    ktorým sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2024/573 stanovujú
    minimálne požiadavky na potvrdenia fyzických osôb o absolvovaní odbornej
    prípravy a podmienky vzájomného uznávania takýchto potvrdení o absolvovaní
    odbornej prípravy, pokiaľ ide o určité mobilné zariadenia obsahujúce fluórované
    skleníkové plyny alebo ich alternatívy, a ktorým sa zrušuje nariadenie Komisie
    (ES) č. 307/2008
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1893 z dne 17. septembra 2025 o določitvi
    minimalnih zahtev za potrdila o usposabljanju fizičnih oseb ter pogojev za vzajemno
    priznavanje takih potrdil o usposabljanju v zvezi z določeno premično opremo,
    ki vsebuje fluorirane toplogredne pline ali njihove alternative, na podlagi Uredbe
    (EU) 2024/573 Evropskega parlamenta in Sveta ter o razveljavitvi Uredbe Komisije
    (ES) št. 307/2008
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1893 de la Comisión, de 17 de septiembre
    de 2025, por el que se establecen, de conformidad con el Reglamento (UE) 2024/573
    del Parlamento Europeo y del Consejo, los requisitos mínimos de las acreditaciones
    de formación de las personas físicas y las condiciones para el reconocimiento
    mutuo de dichas acreditaciones de formación en lo que respecta a determinados
    equipos móviles que contengan gases fluorados de efecto invernadero o sus alternativas,
    y por el que se deroga el Reglamento (CE) n.o 307/2008 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1893 av den 17 september
    2025 om fastställande, i enlighet med Europaparlamentets och rådets förordning
    (EU) 2024/573, av minimikrav för utbildningsintyg för fysiska personer och villkoren
    för ömsesidigt erkännande av sådana utbildningsintyg vad gäller viss mobil
    utrustning som innehåller fluorerade växthusgaser eller alternativ till dessa
    samt om upphävande av kommissionens förordning (EG) nr 307/2008
