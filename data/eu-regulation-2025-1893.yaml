    r. ustanawiające, na podstawie rozporządzenia Parlamentu Europejskiego i Rady
    (UE) 2024/573, minimalne wymogi dotyczące zaświadczeń dla osób fizycznych
    o odbytym szkoleniu i warunków wzajemnego uznawania takich zaświadczeń o odbytym
    szkoleniu w odniesieniu do niektórych urządzeń mobilnych zawierających fluorowane
