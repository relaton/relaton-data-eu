    2025 tot vaststelling, op grond van Verordening (EU) 2024/573 van het Europees
    Parlement en de Raad, van minimumeisen voor opleidingsattesten van natuurlijke
    personen en de voorwaarden voor de wederzijdse erkenning van dergelijke opleidingsattesten
    op het gebied van bepaalde mobiele apparatuur die gefluoreerde broeikasgassen
    of alternatieven daarvoor bevat, en tot intrekking van Verordening (EG) nr. 307/2008
    van de Commissie
  type: main
- language: pl
  script: Latn
