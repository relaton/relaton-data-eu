    na hEorpa agus ón gComhairle, íoscheanglais maidir le fianuithe oiliúna daoine
    nádúrtha agus na coinníollacha maidir le haitheantas frithpháirteach a thabhairt
    d’fhianuithe oiliúna den sórt sin a mhéid a bhaineann le trealamh soghluaiste
    áirithe ina bhfuil gáis ceaptha teasa fhluairínithe nó a roghanna malartacha
