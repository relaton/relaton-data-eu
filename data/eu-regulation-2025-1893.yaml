    (WE) nr 307/2008
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1893 da Comissão, de 17 de setembro
    de 2025, que estabelece, nos termos do Regulamento (UE) 2024/573 do Parlamento
    Europeu e do Conselho, os requisitos mínimos relativos aos atestados de formação
    de pessoas singulares e as condições para o reconhecimento mútuo desses atestados
    no respeitante a determinados equipamentos móveis que contenham gases fluorados
    com efeito de estufa ou suas alternativas e que revoga o Regulamento (CE) n.o
    307/2008 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1893 al Comisiei din 17 septembrie
    2025 de stabilire, în temeiul Regulamentului (UE) 2024/573 al Parlamentului European
    și al Consiliului, a cerințelor minime pentru atestatele de formare ale persoanelor
    fizice și a condițiilor pentru recunoașterea reciprocă a acestor atestate
    de formare în ceea ce privește anumite echipamente mobile care conțin gaze
    fluorurate cu efect de seră sau alternative la acestea și de abrogare a Regulamentului
    (CE) nr. 307/2008 al Comisiei
  type: main
- language: sk
  script: Latn
