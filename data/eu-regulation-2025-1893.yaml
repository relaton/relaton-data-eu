---
id: EURegulation20251893
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1893 of 17 September 2025
    establishing, pursuant to Regulation (EU) 2024/573 of the European Parliament
    and of the Council, minimum requirements for training attestations of natural
    persons and the conditions for the mutual recognition of such training attestations
    as regards certain mobile equipment containing fluorinated greenhouse gases or
    their alternatives and repealing Commission Regulation (EC) No 307/2008
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1893 de la Commission du 17 septembre
    2025 établissant, conformément au règlement (UE) 2024/573 du Parlement européen
    et du Conseil, des prescriptions minimales pour les attestations de formation
    des personnes physiques et les conditions applicables à la reconnaissance mutuelle
    de ces attestations de formation en ce qui concerne certains équipements mobiles
    contenant des gaz à effet de serre fluorés ou leurs solutions de substitution,
    et abrogeant le règlement (CE) no 307/2008 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1893 der Kommission vom 17. September
    2025 zur Festlegung — gemäß der Verordnung (EU) 2024/573 des Europäischen
    Parlaments und des Rates — der Mindestanforderungen an Ausbildungsbescheinigungen
    für natürliche Personen sowie der Bedingungen für die gegenseitige Anerkennung
    dieser Ausbildungsbescheinigungen in Bezug auf bestimmte mobile Einrichtungen,
    die fluorierte Treibhausgase oder Alternativen dazu enthalten, und zur Aufhebung
    der Verordnung (EG) Nr. 307/2008 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1893 на Комисията
    от 17 септември 2025 година за установяване, в
    съответствие с Регламент (ЕС) 2024/573 на Европейския
    парламент и на Съвета, на минимални изисквания
    за удостоверенията за обучение на физически
    лица и на условия за взаимното признаване на
    такива удостоверения за обучение по отношение
    на определено подвижно оборудване, заредено
    с флуорсъдържащи парникови газове или съответните
    им алтернативи, и за отмяна на Регламент (ЕО)
    № 307/2008 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1893 ze dne 17. září 2025,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2024/573 stanoví
    minimální požadavky na osvědčení o školení fyzických osob a podmínky
    pro vzájemné uznávání těchto osvědčení o školení, pokud jde o některá
    mobilní zařízení obsahující fluorované skleníkové plyny nebo jejich alternativy,
    a kterým se zrušuje nařízení Komise (ES) č. 307/2008
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/1893 af 17. september
    2025 om fastsættelse i medfør af Europa-Parlamentets og Rådets forordning (EU)
    2024/573 af mindstekrav til fysiske personers uddannelsesbeviser og betingelser
    for gensidig anerkendelse af sådanne uddannelsesbeviser for så vidt angår visse
    mobile anlæg og mobilt udstyr, der indeholder fluorholdige drivhusgasser eller
    alternativer hertil, og om ophævelse af Kommissionens forordning (EF) nr. 307/2008
  type: main
- language: el
  script: Grek
