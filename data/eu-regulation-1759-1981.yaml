title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1759/81 of 30 June 1981 re-establishing
    the levying of customs duties on knitted or crocheted fabric, products of category
    65 (code 0650), originating in India, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1759/81 de la Commission, du 30 juin 1981, portant
    rétablissement de la perception des droits de douane applicables aux étoffes
    de bonneterie de la catégorie de produits n° 65 (code 0650), originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1759/81 der Kommission vom 30. Juni 1981 über die
    Wiedereinführung des Zollsatzes für Gewebe als Meterware der Warenkategorie
    Nr. 65 (Kennziffer 0650), mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1759/81 af 30. juni 1981 om genindførelse
    af opkrævning af toldafgifter for trikotagestof under kategori 65 (kode 0650)
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1759/81 τής Επιτροπής
    τής 30ής Ιουνίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά υφάσματα
    πλεκτά, μή ελαστικά ουδέ συνδεδυασμένα μετά
    καουτσούκ, εις τόπια, τών προϊόντων τής κατηγορίας
    αριθ. 65 (κώδικας 0650), καταγωγής Ινδίας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1759/81 della Commissione, del 30 giugno 1981, che
    ripristina la riscossione dei dazi doganali applicabili alle stoffe a maglia della
    categoria di prodotti n. 65 (codice 0650), originarie dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1759/81 van de Commissie van 30 juni 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op breiwerk
    en haakwerk van categorie van produkten 65 (codenummer 0650) van oorsprong uit
    India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3320/80 van de Raad
  type: main
