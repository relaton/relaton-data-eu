  content: Commission Regulation (EEC) No 441/76 of 27 February 1976 determining the
    amounts applicable as accession compensatory amounts during the month of March
    1976 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 441/76 de la Commission, du 27 février 1976, déterminant
    les montants applicables à titre de montants compensatoires adhésion pendant
    le mois de mars 1976 à certains produits des secteurs des céréales et du riz
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 441/76 der Kommission vom 27. Februar 1976 zur Festsetzung
    der im März 1976 als Beitrittsausgleichsbeträge geltenden Beträge für bestimmte
    Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 441/76 af 27. februar 1976 om fastsættelse
    af de beløb, der i marts 1976 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 441/76 della Commissione, del 27 febbraio 1976, che
    determina gli importi compensativi «adesione» applicabili, durante il mese di
    marzo 1976, a taluni prodotti dei settori dei cereali e del riso esportati sotto
    forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 441/76 van de Commissie van 27 februari 1976 houdende
    vaststelling van de bedragen die gedurende de maand maart 1976 als compenserende
    bedragen ,,toetreding" moeten worden toegepast voor bepaalde produkten van de
    sector granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage
    II van het Verdrag vallende goederen
