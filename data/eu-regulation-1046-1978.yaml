    d' une prime d' abattage au bénéfice des producteurs de bovins prévues par
    le règlement (CEE) n° 926/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1046/78 der Kommission vom 19. Mai 1978 zur Verlängerung
