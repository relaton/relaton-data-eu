  content: Commission Regulation (EEC) No 184/79 of 31 January 1979 fixing the rates
    of the refunds applicable from 1 February 1979 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 184/79 de la Commission, du 31 janvier 1979, fixant
    les taux des restitutions applicables, à compter du 1er février 1979, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 184/79 der Kommission vom 31. Januar 1979 zur Festsetzung
    der ab 1. Februar 1979 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 184/79 af 31. januar 1979 om fastsættelse
    af de restitutionssatser, der fra 1. februar 1979 skal anvendes for visse produkter
    fra korn og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 184/79 della Commissione, del 31 gennaio 1979, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 febbraio 1979,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 184/79 van de Commissie van 31 januari 1979 houdende
    vaststelling van de restituties die met ingang van 1 februari 1979 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
