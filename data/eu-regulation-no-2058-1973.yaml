id: EURegulationNo20581973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2058/73 of the Commission of 27 July 1973 re-establishing
    Common Customs Tariff duties on woven fabrics of silk or of waste silk other than
    noil falling within heading No 50.09, originating in India, to which preferential
    tariff arrangements set out in Council Regulation (EEC) No 2766/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2058/73 de la Commission, du 27 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tissus de soie ou de bourre de soie (schappe) de la position tarifaire 50.09,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 2766/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2058/73 der Kommission vom 27. Juli 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Gewebe aus Seide oder Schappeseide
    der Tarifnummer 50.09, mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 2766/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2058/73 af 27. juli 1973 om genindførelsen
    af told ifølge den fælles toldtarif for vævet stof af natursilke (undtagen
    af bourettesilke) under position 50.09 som har oprindelse i Indien og omfattes
    af toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2766/72 af
    19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2058/73 della Commissione, del 27 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    tessuti di seta o di borra di seta (schappe) della voce doganale n. 50.09 originari
    dell' India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2766/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2058/73 van de Commissie van 27 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op weefsels van zijde of van vlokzijde van post 50.09, van oorsprong
    uit India, ten behoeve waarvan bij Verordening (EEG) nr. 2766/72 van de Raad van
    19 december 1972 tariefpreferenties werden geopend
  type: main
