title:
- language: en
  script: Latn
  content: '79/659/EEC: Commission Decision of 18 July 1979 fixing the time limit
    by which the Governments of certain Member States must adopt decisions relating
    to the establishment of reference tariffs for the carriage of goods by road to
    and from Denmark (Only the French, Danish, German, English and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/659/CEE: Décision de la Commission, du 18 juillet 1979, fixant le
    délai dans lequel les gouvernements de certains Etats membres doivent adopter
    des décisions relatives à l''établissement de tarifs de référence pour les
    transports de marchandises par route avec le Danemark (Les textes en langues française,
    danoise, allemande, anglaise et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/659/EWG: Entscheidung der Kommission vom 18. Juli 1979 zur Setzung
    einer Frist, in der die Regierungen bestimmter Mitgliedstaaten über die Einführung
    der Referenztarife für den Güterkraftverkehr mit Dänemark entscheiden müssen
    (Nur der französische, dänische, deutsche, englische und niederländische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/659/EØF: Kommissionens beslutning af 18. juli 1979 om fastsættelse
    af den frist, inden for hvilken regeringerne i visse medlemsstater skal vedtage
    beslutninger om indførelse af vejledende tariffer for godstransport ad landevej
    i forbindelserne med Danmark (Kun den franske, danske, tyske, engelske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/659/CEE: Decisione della Commissione, del 18 luglio 1979, che fissa
    il termine entro il quale i governi di certi Stati membri devono adottare delle
    decisioni relative alla fissazione di tariffe di riferimento per i trasporti di
    merci su strada nelle relazioni con la Danimarca (I testi in lingua francese,
    danese, tedesca, inglese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/659/EEG: Beschikking van de Commissie van 18 juli 1979 houdende vaststelling
    van de termijn waarbinnen de Regeringen van bepaalde Lid-Staten besluiten inzake
    de vaststelling van referentietarieven voor het goederenvervoer over de weg vanuit
    en naar Denemarken moeten nemen (Slechts de teksten in de Franse, Deense, Duitse,
    Engelse en de Nederlandse taal zijn authentiek)'
  type: main
