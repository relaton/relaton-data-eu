title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1523/2000 of 10 July 2000 imposing a definitive
    countervailing duty and definitively collecting the provisional countervailing
    duty imposed on imports of stainless steel fasteners originating in Malaysia and
    the Philippines and terminating the proceeding concerning imports of stainless
    steel fasteners originating in Singapore and Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1523/2000 du Conseil du 10 juillet 2000 instituant
    un droit compensateur définitif et portant perception définitive du droit compensateur
    provisoire sur les importations d'éléments de fixation en acier inoxydable originaires
    de Malaisie et des Philippines et clôturant la procédure concernant les importations
    de ces produits originaires de Singapour et de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1523/2000 des Rates vom 10. Juli 2000 zur Einführung
    eines endgültigen Ausgleichszolls und zur endgültigen Vereinnahmung des vorläufigen
    Ausgleichszolls auf die Einfuhren von Verbindungselementen aus nichtrostendem
    Stahl mit Ursprung in Malaysia und den Philippinen und zur Einstellung des Verfahrens
    gegenüber den Einfuhren von Verbindungselementen aus nichtrostendem Stahl mit
    Ursprung in Singapur und Thailand
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1523/2000 af 10. juli 2000 om indførelse af
    endelig udligningstold og om endelig opkrævning af den midlertidige udligningstold
    på import af skruer, bolte, møtrikker og lignende varer af rustfrit stål med
    oprindelse i Malaysia og Filippinerne og om afslutning af proceduren vedrørende
    import af skruer, bolte, møtrikker og lignende varer af rustfrit stål med oprindelse
    i Singapore og Thailand
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1523/2000 του Συμβουλίου,
    της 10ης Ιουλίου 2000, για την επιβολή οριστικού
    αντισταθμιστικού δασμού και για την οριστική
    είσπραξη του προσωρινού αντισταθμιστικού
    δασμού που επιβλήθηκε στις εισαγωγές συνδετήρων
    από ανοξείδωτο χάλυβα καταγωγής Μαλαισίας
    και Φιλιππίνων, και για την περάτωση της διαδικασίας
    όσον αφορά τις εισαγωγές συνδετήρων από ανοξείδωτο
    χάλυβα καταγωγής Σιγκαπούρης και Ταϊλάνδης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1523/2000, annettu 10 päivänä heinäkuuta
    2000, lopullisen tasoitustullin käyttöönotosta ja Malesiasta ja Filippiineiltä
    peräisin olevien ruostumattomasta teräksestä valmistettujen kiinnikkeiden tuontiin
    sovellettavan väliaikaisen tasoitustullin lopullisesta kantamisesta sekä Singaporesta
    ja Thaimaasta peräisin olevien ruostumattomasta teräksestä valmistettujen kiinnikkeiden
    tuontia koskevan menettelyn päättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1523/2000 del Consiglio, del 10 luglio 2000, che istituisce
    un dazio compensativo definitivo e riscuote definitivamente il dazio compensativo
    provvisorio istituito sulle importazioni di elementi di fissaggio di acciaio inossidabile
    originarie della Malesia e delle Filippine e che chiude il procedimento relativo
    alle importazioni di elementi di fissaggio di acciaio inossidabile originarie
    di Singapore e della Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1523/2000 van de Raad van 10 juli 2000 voor instelling
    van een definitief compenserend recht en definitieve invordering van het voorlopig
    compenserend recht op de invoer van roestvrijstalen bevestigingsmiddelen van oorsprong
    uit Maleisië en de Filipijnen en tot beëindiging van de procedure ten aanzien
    van de invoer van roestvrijstalen bevestigingsmiddelen van oorsprong uit Singapore
    en Thailand
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1523/2000 do Conselho, de 10 de Julho de 2000, que
    institui um direito de compensação definitivo, que determina a cobrança definitiva
    dos direitos de compensação provisórios criados sobre as importações de parafusos
    de aço inoxidável originários da Malásia e das Filipinas e que encerra o processo
    no que respeita às importações de parafusos de aço inoxidável originários
    de Singapura e da Tailândia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1523/2000 del Consejo, de 10 de julio de 2000, por
    el que se establece un derecho compensatorio definitivo y se percibe definitivamente
    el derecho compensatorio provisional establecido sobre las importaciones de sujeciones
    de acero inoxidable originarias de Malasia y Filipinas y se da por concluido el
    procedimiento referente a las importaciones de sujeciones de acero inoxidable
    originarias de Singapur y Tailandia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1523/2000 av den 10 juli 2000 om införande
    av en slutgiltig utjämningstull på import av fästanordningar av rostfritt stål
    med ursprung i Malaysia och Filippinerna, om slutgiltigt uttag av den provisoriska
    utjämningstull som införts på denna import och om avslutande av förfarandet
    beträffande import av fästanordningar av rostfritt stål med ursprung i Singapore
    och Thailand
  type: main
