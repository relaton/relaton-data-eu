title:
- language: en
  script: Latn
  content: '83/80/EEC: Commission Decision of 11 February 1983 on the second amendment
    of Decision 82/467/EEC authorizing a number of Member States to sell butter at
    a reduced price in the form of concentrated butter (Only the French, German and
    English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/80/CEE: Décision de la Commission du 11 février 1983 portant deuxième
    modification de la décision 82/467/CEE autorisant plusieurs Etats membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Les textes en
    langues française, allemande et anglaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/80/EWG: Entscheidung der Kommission vom 11. Februar 1983 zur zweiten
    Änderung der Entscheidung 82/467/EWG zur Ermächtigung mehrerer Mitgliedstaaten
    zum Verkauf von Butter zu herabgesetzten Preisen in Form von Butterreinfett (Nur
    der französische, deutsche und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/80/EØF: Kommissionens beslutning af 11. februar 1983 om anden ændring
    af beslutning 82/467/EØF om bemyndigelse af medlemsstater til at sælge smør
    til nedsat pris i form af koncentreret smør (Kun den franske, tyske og engelske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/80/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Φεβρουαρίου
    1983 περί δευτέρας τροποποιήσεως της αποφάσεως
    82/467/ΕΟΚ που επιτρέπει σε ορισμένα Κράτη μέλη
    να πωλούν το βούτυρο υπό μορφή συμπυκνωμένου
    βουτύρου σε μειωμένη τιμή (Τα κείμενα στην
    γαλλική, γερμανική και αγγλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '83/80/CEE: Decisione della Commissione dell''11 febbraio 1983 recante
    seconda modifica della decisione 82/467/CEE, che autorizza alcuni Stati membri
    a vendere burro a prezzo ridotto sotto forma di burro concentrato (I testi in
    lingua francese, tedesca e inglese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '83/80/EEG: Beschikking van de Commissie van 11 februari 1983 houdende
    tweede wijziging van Beschikking 82/467/EEG tot machtiging van verschillende Lid-Staten
    om boter tegen verlaagde prijs in de vorm van boterconcentraat te verkopen (Slechts
    de teksten in de Franse, Duitse and Engelse taal zijn authentiek)'
