title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1125/82 of 11 May 1982 re-establishing the
    levying of customs duties on methanol (methylic alcohol), falling within subheading
    29.04 A I and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1125/82 de la Commission, du 11 mai 1982, portant
    rétablissement de la perception des droits de douane applicables au méthanol
    (alcool méthylique) de la sous-position 29.04 A I du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1125/82 der Kommission vom 11. Mai 1982 zur Wiedereinführung
    der Erhebung der Zölle für Methanol (Methylalkohol) der Tarifstelle 29.04 A
    I, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1125/82 af 11. maj 1982 om genindførelse
    af opkrævning af told for methanol (methylalkohol) henhørende under pos. 29.04
    A I og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1125/82 τής Επιτροπής
    τής 11ης Μαΐου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τήν μεθανόλη (μεθυλική αλκοόλη),
    τής διακρίσεως 29. 04 Α Ι τού Κοινού Δασμολογίου,
    καταγωγής Ρουμανίας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1125/82 della Commissione, dell' 11 maggio 1982, che
    ripristina la riscossione dei dazi doganali applicabili al metanolo (alcole metilico),
    della sottovoce 29.04 A I della tariffa doganale comune, originario della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1125/82 van de Commissie van 11 mei 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op methanol (methylalcohol)
