title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2720/78 of 22 November 1978 re-establishing
    the levying of customs duties on textile fabrics impregnated, coated, covered
    or laminated with preparations of cellulose derivatives, etc., falling within
    heading No 59.08 and originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2720/78 de la Commission, du 22 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus imprégnés,
    enduits ou recouverts de dérivés de la cellulose, etc., de la position tarifaire
    59.08, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2720/78 der Kommission vom 22. November 1978 über
    die Wiedereinfúhrung des Zollsatzes fúr Gewebe, mit Zellulosederivaten oder
    anderen Kunststoffen getránkt, bestrichen usw., der Tarifnummer 59.08, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2720/78 af 22. november 1978 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer, imprægneret, overtrukket eller
    lamineret med cellulosederivater etc., under position 59.08, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2720/78 della Commissione, del 22 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti impregnati,
    spalmati o ricoperti di derivati della cellulosa, ecc., della voce doganale 59.08,
    originari della Iugoslavia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2720/78 van de Commissie van 22 november 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels,
    geïmpregneerd met, voorzien van een deklaag van of bekleed met cellulosederivaten,
    enz., van post 59.08, van oorsprong uit Joegoslavië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 1197/78 van de Raad
