title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3888/89 of 11 December 1989 amending for the
    third time Regulation (EEC) No 1873/84 authorizing the offer or disposal for direct
    human consumption of certain imported wines which may have undergone oenological
    processes not provided for in Regulation (EEC) No 337/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3888/89 du Conseil du 11 décembre 1989 portant troisième
    modification du règlement (CEE) n 1873/84 autorisant l'offre et la livraison
    à la consommation humaine directe de certains vins importés susceptibles d'avoir
    fait l'objet de pratiques oenologiques non prévues par le règlement (CEE) n°
    337/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3888/89 des Rates vom 11. Dezember 1989 zur dritten
    Änderung der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder
    der Abgabe zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten
    Weinen, bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung
    (EWG) Nr. 337/79 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3888/89 af 11. december 1989 om tredje ændring
    af forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til
    direkte konsum af visse indførte vine, som eventuelt har været underkastet andre
    ønologiske fremgangsmåder end de i forordning (EØF) nr. 337/79 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3888/89 του Συμβουλίου
    της 11ης Δεκεμβρίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων που
    μπορούν να αποτελέσουν το αντικείμενο των
    αναλογικών πρακτικών που δεν προβλέπονται
    από τον κανονισμό (ΕΟΚ) αριθ. 337/79
  type: main
- language: it
  script: Latn
  content: '3888/89/CEE: Regolamento del Consiglio dell''11 dicembre 1989 recante
    terza modifica del regolamento (CEE) n. 1873/84 che autorizza l''offerta e la
    consegna per il consumo umano diretto di taluni vini importati che possono essere
    stati sottoposti a pratiche enologiche non previste dal regolamento (CEE) n. 337/79'
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3888/89 van de Raad van 11 december 1989 houdende
    derde wijziging van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding
    of levering voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen
    waarop oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij
    Verordening (EEG) nr. 337/79
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3888/89 do Conselho de 11 de Dezembro de 1989 que
    altera pela terceira vez o Regulamento (CEE) nº 1873/84 que autoriza a oferta
    e o fornecimento para consumo humano directo de certos vinhos importados susceptíveis
    de terem sido objectivo de práticas enológicas não previstas no Regulamento
    (CEE) nº 337/79
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3888/89 del Consejo de 11 de diciembre de 1989 que
    modifica por tercera vez el Reglamento (CEE) n° 1873/84 por el que se autoriza
    la oferta y la entrega al consumo humano directo de determinados vinos importados
    que pueden haber sido sometidos a prácticas enológicas no previstas en el Reglamento
    (CEE) n° 337/79
  type: main
