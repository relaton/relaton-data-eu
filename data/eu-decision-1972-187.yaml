title:
- language: en
  script: Latn
  content: '72/187/EEC: Commission Decision of 19 April 1972 amending the decision
    of 5 July 1971 authorizing the kingdom of Belgium, the French republic, the Italian
    republic and the kingdom of the Netherlands to approve, for marketing, forestry
    reproductive material of larix leptolepis ( sieb. and zucc. ), gord., satisfying
    less stringent requirements (Only the French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/187/CEE: Décision de la Commission, du 19 avril 1972, modifiant la
    décision, du 5 juillet 1971, autorisant le Royaume de Belgique, la République
    française, la République italienne et le Royaume des Pays-Bas à admettre à
    la commercialisation des matériels forestiers de reproduction de larix leptolepis
    (sieb. et zucc.), gord., soumis a des exigences réduites (Les textes en langues
    française, italienne et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '72/187/EWG: Entscheidung der Kommission vom 19. April 1972 zur Änderung
    der Entscheidung vom 5. Juli 1971 über die Ermächtigung des Königreichs Belgien,
    der französischen Republik, der italienischen Republik, des grossherzogtums Luxemburg
    und des Königreichs der Niederlande, frostiges vermehrungsgut von larix leptolepis
    ( sieb. et zucc. ) gord. mit minderen Anforderungen zum gewerbsmäßigen Verkehr
    zuzulassen (Nur der französische, italienische und niederländische Text sind
    verbindlich)'
  type: main
- language: it
  script: Latn
  content: '72/187/CEE: Decisione della Commissione, del 19 aprile 1972, che modifica
    la decisione del 5 luglio 1971 che autorizza il regno del Belgio, la repubblica
    francese, la repubblica italiana, il granducato del Lussemburgo e il regno dei
    paesi bassi ad ammettere alla commercializzazione dei materiali forestali di moltiplicazione
    di larix leptolepis ( sieb. et zucc. ) gord., soggetti a requisiti ridotti (I
    testi in lingua francese, italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '72/187/EEG: Beschikking van de Commissie van 19 april 1972 houdende wijziging
    van de beschikking van 5 juli 1971 tot machtiging van het koninkrijk België,
    de Franse republiek, de Italiaanse republiek, het groothertogdom Luxemburg en
    het koninkrijk der Nederlanden om bosbouwkundig teeltmateriaal van larix leptolepis
    ( sieb, en zucc. ) gordo., waaraan minder strenge eisen zijn gesteld, tot de handel
    toe te laten (Slechts de teksten in de Franse, Italiaanse en de Nederlandse taal
    zijn authentiek)'
  type: main
