title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2112/90 of 23 July 1990 imposing a definitive
    anti-dumping duty on imports of certain types of electronic microcircuits known
    as DRAMs (dynamic random access memories) originating in Japan and collecting
    definitively the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2112/90 du Conseil du 23 juillet 1990 instituant un
    droit antidumping définitif sur les importations de certains types de microstructures
    électroniques, dites "DRAM" (dynamic random access memories), originaires du
    Japon et portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2112/90 des Rates vom 23. Juli 1990 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, sogenannter DRAMs (dynamische Schreib- Lesespeicher), mit Ursprung
    in Japan und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2112/90 af 23. juli 1990 om indførelse af
    en endelig antidumpingtold på importen af visse typer elektroniske mikrokredsloeb,
    såkaldte DRAMs (Dynamic Random Access Memories), med oprindelse i Japan og om
    endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Καθορισμός (ΕΟΚ) αριθ. 2112/90 του Συμβουλίου
    της 23ης Ιουλίου 1990 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    τύπων ηλεκτρονικών μικροκυκλωμάτων γνωστών
    ως DRAM (δυναμικές μνήμες τυχαίας προσπέλασης),
    καταγωγής Ιαπωνίας και περί της οριστικής
    είσπραξης του προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2112/90, annettu 23 päivänä heinäkuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Japanista peräisin
    olevien elektronisten mikropiirien, niin sanottujen DRAMien (dynamic random access
    memories), tuonnissa ja väliaikaisen tullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2112/90 del Consiglio del 23 luglio 1990 che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di microcircuiti
    elettronici, detti DRAM (memorie dinamiche ad accesso casuale), originari del
    Giappone e che decide la riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) Nr. 2112/90 van de Raad van 23 juli 1990 tot instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde soorten elektronische
    microschakelingen, bekend als DRAM's (dynamic random- access memories) van oorsprong
    uit Japan en tot definitieve inning van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2112/90 do Conselho de 23 de Julho de 1990 que institui
    um direito anti-dumping definitivo sobre as importações de certos tipos de microcircuitos
    electrónicos conhecidos por DRAM (memórias dinâmicas de acesso directo) originarias
    do Japão e que estabelece a cobrança definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2112/90 del Consejo de 23 de julio de 1990 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    determinados tipos de microcircuitos electrónicos conocidos como DRAMS (dynamic
    random acces memories), originarios de Japón, y por el que se percibe definitivamente
    el derecho provisional
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 2112/90 av den 23 juli 1990 om införande
    av en slutgiltig antidumpningstull på import av elektroniska mikrokretsar av
    DRAM-typ (dynamiska direktminnen) med ursprung i Japan samt om slutgiltigt uttag
    av den preliminära tullen
