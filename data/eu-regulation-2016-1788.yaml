id: EURegulation20161788
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/1788 of 14 July 2016 amending
    Regulation (EU) No 167/2013 of the European Parliament and of the Council as regards
    the list of requirements for vehicle EU type-approval, and amending and correcting
    Commission Delegated Regulations (EU) No 1322/2014, (EU) 2015/96, (EU) 2015/68
    and (EU) 2015/208 with regard to vehicle construction and general requirements,
    to environmental and propulsion unit performance requirements, to vehicle braking
    requirements and to vehicle functional safety requirements
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/1788 de la Commission du 14 juillet 2016
    modifiant le règlement (UE) no 167/2013 du Parlement européen et du Conseil
    en ce qui concerne la liste de prescriptions pour la réception UE par type de
    véhicules et modifiant et corrigeant les règlements délégués de la Commission
    (UE) no 1322/2014, (UE) 2015/96, (UE) 2015/68 et (UE) 2015/208 en ce qui concerne
    la construction des véhicules et les prescriptions générales, les prescriptions
    relatives aux performances environnementales et aux performances de l’unité
    de propulsion, les prescriptions en matière de freinage des véhicules et les
    prescriptions relatives à la sécurité fonctionnelle des véhicules
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/1788 der Kommission vom 14. Juli 2016 zur
    Änderung der Verordnung (EU) Nr. 167/2013 des Europäischen Parlaments und des
    Rates in Bezug auf die Liste der Anforderungen für die EU-Typgenehmigung von
    Fahrzeugen und zur Änderung und Berichtigung der delegierten Verordnungen (EU)
    Nr. 1322/2014, (EU) 2015/96, (EU) 2015/68 und (EU) 2015/208 der Kommission hinsichtlich
    der Anforderungen an die Bauweise von Fahrzeugen und der allgemeinen Anforderungen,
    der Anforderungen an die Umweltverträglichkeit und die Leistung der Antriebseinheit,
    der Anforderungen an die Bremsen von Fahrzeugen und der Anforderungen an die funktionale
    Sicherheit von Fahrzeugen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2016/1788 на Комисията
    от 14 юли 2016 година за изменение на Регламент
    (ЕС) № 167/2013 на Европейския парламент и на Съвета,
    отнасящо се за списъка на изисквания за ЕС
    одобряване на типа на превозни средства, и
    за изменение и поправка на делегирани регламенти
    (ЕС) № 1322/2014, (ЕС) 2015/96, (ЕС) 2015/68 и (ЕС) 2015/208 на Комисията
    по отношение на конструктивните и общите изисквания
    към превозните средства, изискванията за техните
    екологични характеристики и характеристики
    на задвижването, изискванията за спирането
    и изискванията за безопасност при експлоатацията
    на превозните средства
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2016/1788 ze dne 14. července
    2016, kterým se mění nařízení Evropského parlamentu a Rady (EU) č. 167/2013,
    pokud jde o soupis požadavků pro EU schválení typu vozidla, kterým se mění
    a opravuje nařízení Komise v přenesené pravomoci (EU) č. 1322/2014, nařízení
    Komise v přenesené pravomoci (EU) 2015/96, nařízení Komise v přenesené
    pravomoci (EU) 2015/68 a nařízení Komise v přenesené pravomoci (EU) 2015/208,
    pokud jde o požadavky na konstrukci vozidla a obecné požadavky, požadavky
    na environmentální výkonnost a výkonnost pohonné jednotky, požadavky na
    brzdění vozidel a požadavky na funkční bezpečnost vozidel
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/1788 af 14. juli 2016 om
    ændring af Europa-Parlamentets og Rådets forordning (EU) nr. 167/2013 for så
    vidt angår listen over krav til EU-typegodkendelse og om ændring og berigtigelse
    af Kommissionens delegerede forordning (EU) nr. 1322/2014, (EU) 2015/96, (EU)
    2015/68 og (EU) 2015/208 for så vidt angår køretøjskonstruktion og generelle
    krav, miljøpræstationer og fremdriftsydelse, bremsekrav og køretøjets funktionelle
    sikkerhed
  type: main
- language: el
  script: Grek
