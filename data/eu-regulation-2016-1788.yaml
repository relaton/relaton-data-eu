  script: Latn
  content: Regulamentul delegat (UE) 2016/1788 al Comisiei din 14 iulie2016 de modificare
    a Regulamentului (UE) nr. 167/2013 al Parlamentului European și al Consiliului
    în ceea ce privește lista de cerințe pentru omologarea UE de tip a vehiculelor
    și de modificare și de rectificare a Regulamentelor delegate (UE) nr. 1322/2014,
    (UE) 2015/96, (UE) 2015/68 și (UE) 2015/208 ale Comisiei în ceea ce privește
    construcția vehiculelor și cerințele generale, cerințele de mediu și de performanță
    a unității de propulsie, cerințele privind frânarea vehiculelor și cerințele
    privind siguranța funcțională a vehiculelor
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2016/1788 zo 14. júla 2016, ktorým
    sa mení nariadenie Európskeho parlamentu a Rady (EÚ) č. 167/2013, pokiaľ
    ide o zoznam požiadaviek na typové schválenie EÚ vozidiel, a ktorým sa mení
    a opravuje delegované nariadenie Komisie (EÚ) č. 1322/2014, (EÚ) 2015/96,
    (EÚ) 2015/68 a (EÚ) 2015/208 s ohľadom na požiadavky na konštrukciu vozidiel
    a všeobecné požiadavky, požiadavky na environmentálne vlastnosti a výkon
    pohonnej jednotky, požiadavky na brzdenie vozidiel a požiadavky na funkčnú
    bezpečnosť vozidiel
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/1788 z dne 14. julija 2016 o spremembi
    Uredbe (EU) št. 167/2013 Evropskega parlamenta in Sveta glede seznama zahtev
    za EU-homologacijo vozil ter o spremembi in popravku delegiranih uredb Komisije
    (EU) št. 1322/2014, (EU) 2015/96, (EU) 2015/68 in (EU) 2015/208 v zvezi z zahtevami
    za konstrukcijo vozil in splošnimi zahtevami, zahtevami za okoljske značilnosti
    in zmogljivost pogonskega sistema, zahtevami za zavorne sisteme vozil ter zahtevami
    za funkcionalno varnost vozil
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2016/1788 de la Comisión, de 14 de julio de 2016,
    por el que se modifica el Reglamento (UE) n.o 167/2013 del Parlamento Europeo
    y del Consejo en lo relativo a la lista de requisitos para la homologación de
    tipo UE de vehículos, y por el que se modifican y corrigen los Reglamentos Delegados
    (UE) n.o 1322/2014, (UE) 2015/96, (UE) 2015/68 y (UE) 2015/208 de la Comisión
    por lo que respecta a los requisitos de fabricación de los vehículos y los requisitos
    generales, a los requisitos de eficacia medioambiental y de rendimiento de la
    unidad de propulsión, a los requisitos de frenado de los vehículos y a los requisitos
    de seguridad funcional de los vehículos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2016/1788 av den 14 juli 2016
    om ändring av Europaparlamentets och rådets förordning (EU) nr 167/2013 vad
    gäller förteckningen över krav för EU-typgodkännande av fordon och om ändring
    och rättelse av kommissionens delegerade förordningar (EU) nr 1322/2014, (EU)
    2015/96, (EU) 2015/68 och (EU) 2015/208 vad gäller fordonskonstruktion och allmänna
    krav, krav på miljöprestanda och framdrivningsenheters prestanda, krav på fordonsbromsar
    och krav på funktionssäkerhet hos fordon
