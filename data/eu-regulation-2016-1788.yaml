    rendeletnek, az (EU) 2015/68 felhatalmazáson alapuló bizottsági rendeletnek,
    továbbá az (EU) 2015/208 felhatalmazáson alapuló bizottsági rendeletnek a
    járműszerkezeti és általános követelmények, a környezeti teljesítményre
    és meghajtóegység-teljesítményre vonatkozó követelmények, a fékezési
    követelmények, illetve a funkcionális járműbiztonsági követelmények tekintetében
    történő módosításáról és helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2016/1788 della Commissione, del 14 luglio 2016,
    che modifica il regolamento (UE) n. 167/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda l'elenco delle prescrizioni per l'omologazione UE dei veicoli
    e che modifica e rettifica i regolamenti delegati della Commissione (UE) n. 1322/2014,
    (UE) 2015/96, (UE) 2015/68 e (UE) 2015/208 relativamente alla costruzione dei
    veicoli e alle prescrizioni generali, ambientali e delle unità di propulsione,
    alle prescrizioni concernenti la frenatura dei veicoli e alle prescrizioni di
    sicurezza funzionale dei veicoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2016/1788 (2016. gada 14. jūlijs), ar
