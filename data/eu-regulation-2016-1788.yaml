    απαιτήσεις σχετικά με τη λειτουργική ασφάλεια
    των οχημάτων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2016/1788, 14. juuli 2016, millega
    muudetakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 167/2013 seoses sõidukite
    ELi tüübikinnituse nõuete loeteluga ning millega muudetakse ja parandatakse
    komisjoni delegeeritud määruseid (EL) nr 1322/2014, (EL) 2015/96, (EL) 2015/68
    ja (EL) 2015/208 sõiduki konstruktsiooni ja üldise tüübikinnituse nõuete,
    keskkonnamõjule ja mootori võimsusele esitatavate nõuete, sõiduki pidurdusnõuete
    ning sõiduki kasutusohutuse nõuete osas
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2016/1788, annettu 14 päivänä heinäkuuta
    2016, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 167/2013 muuttamisesta
    siltä osin kuin on kyse ajoneuvon EU-tyyppihyväksyntään sovellettavien vaatimusten
    luettelosta sekä komission delegoidun asetuksen (EU) N:o 1322/2014, (EU) 2015/96,
    (EU) 2015/68 ja (EU) 2015/208 muuttamisesta ja oikaisemisesta siltä osin kuin
    on kyse ajoneuvon rakennetta koskevista ja yleisistä vaatimuksista, ympäristöominaisuuksista
    ja käyttövoimayksikön tehoa koskevista vaatimuksista, ajoneuvon jarrutusta
    koskevista vaatimuksista ja ajoneuvon toimintaturvallisuusvaatimuksista
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/1788 оd 14. srpnja 2016. o izmjeni
    Uredbe (EU) br. 167/2013 Europskog Parlamenta i Vijeća u pogledu popisa zahtjeva
    koji se odnose na EU homologaciju tipa vozila te o izmjeni i ispravku delegiranih
    uredbi Komisije (EU) br. 1322/2014, (EU) 2015/96, (EU) 2015/68 i (EU) 2015/208
    u pogledu zahtjeva koji se odnose na konstrukcije vozila i općih zahtjeva te
    zahtjeva koji se odnose na utjecaj na okoliš, učinkovitost pogonskih jedinica,
    kočenje vozila i funkcionalnu sigurnost vozila
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1788 felhatalmazáson alapuló rendelete (2016.
