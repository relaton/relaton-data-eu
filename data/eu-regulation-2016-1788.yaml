  script: Latn
  content: Regulamento Delegado (UE) 2016/1788 da Comissão, de 14 de julho de 2016,
    que altera o Regulamento (UE) n.o 167/2013 do Parlamento Europeu e do Conselho
    no que diz respeito à lista de requisitos para a homologação UE de veículos,
    e que altera e retifica os Regulamentos Delegados (UE) n.o 1322/2014, (UE) 2015/96,
