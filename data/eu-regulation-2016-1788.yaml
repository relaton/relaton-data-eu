  script: Latn
  content: Gedelegeerde Verordening (EU) 2016/1788 van de Commissie van 14 juli 2016
    tot wijziging van Verordening (EU) nr. 167/2013 van het Europees Parlement en
    de Raad wat betreft de lijst van voorschriften voor EU-typegoedkeuring van voertuigen,
