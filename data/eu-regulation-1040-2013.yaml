title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1040/2013 of 24 October 2013
    concerning the authorisation of a preparation of endo-1,4-beta-xylanase produced
    by Trichoderma reesei (MUCL 49755) and endo-1,3(4)-beta-glucanase produced by
    Trichoderma reesei (MUCL 49754) as a feed additive for pigs for fattening and
    minor porcine species for fattening other than Sus scrofa domesticus and turkeys
    for fattening (holder of authorisation Aveve NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 1040/2013 de la Commission du 24 octobre
    2013 concernant l’autorisation d’une préparation à base d’endo-1,4-β-xylanase
    produite par Trichoderma reesei (MUCL 49755) et d’endo-1,3(4)-β-glucanase produite
    par Trichoderma reesei (MUCL 49754) en tant qu’additif pour l’alimentation
    des porcs d’engraissement, des espèces porcines mineures autres que Sus scrofa
    domesticus destinées à l’engraissement et des dindes d’engraissement (titulaire
    de l’autorisation: Aveve NV)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1040/2013 der Kommission vom 24. Oktober
