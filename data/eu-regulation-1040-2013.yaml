    reesei (MUCL 49755) und Endo-1,3(4)-beta-Glucanase aus Trichoderma reesei (MUCL
    49754) als Zusatzstoff in Futtermitteln für Mastschweine und Mastschweinearten
    von geringerer wirtschaftlicher Bedeutung, ausgenommen Sus scrofa domesticus ,
    und Masttruthühner (Zulassungsinhaber Aveve NV)
  type: main
