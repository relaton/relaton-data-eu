    die Ankaufspreise auf dem Sektor Obst und Gemüse bezüglich Tomaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1997/87 af 7. juli 1987 om ændring
    af forordning (EØF) nr. 3587/86 om fastsættelse af de tilpassingskoefficienter,
