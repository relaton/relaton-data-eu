    prices for fruit and vegetables as regards tomatoes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1997/87 de la Commission du 7 juillet 1987 modifiant
    le règlement (CEE) n° 3587/86 fixant les coefficients d'adaptation à appliquer
    aux prix d'achat dans le secteur des fruits et légumes en ce qui concerne les
    tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1997/87 der Kommission vom 7. Juli 1987 zur Änderung
