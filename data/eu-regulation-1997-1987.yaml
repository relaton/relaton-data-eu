    annetun asetuksen (ETY) N:o 3587/86 muuttamisesta tomaattien osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1997/87 della Commissione del 7 luglio 1987 che modifica
    il regolamento (CEE) n. 3587/86 che fissa i coefficienti di adattamento da applicare
