title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 926/84 of 4 April 1984 re-establishing the
    levying of customs duties on other sheep and lamb skin leather, falling within
    subheading 41.03 B II and originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 926/84 de la Commission du 4 avril 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres peaux d' ovins, non
    dénommées, de la sous-position 41.03 B II du tarif douanier commun, originaires
    du Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 926/84 der Kommission vom 4. April 1984 zur Wiedereinführung
    der Erhebung der Zölle für anderes Schaf- und Lammleder der Tarifstelle 41.03
    B II mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 926/84 af 4. april 1984 om genindførelse
    af opkrævning af told for andet læder af fåre- og lammeskind, henhørende under
    pos. 41.03 B II og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
