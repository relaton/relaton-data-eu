title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2123/88 of 15 July 1988 derogating from
    Regulation (EEC) No 3540/85 laying down detailed rules for the application of
    the special measures for peas, field beans and sweet lupins, as regards the term
    of validity of the certificates
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2123/88 de la Commission du 15 juillet 1988 prévoyant
    des dispositions dérogatoires au règlement (CEE) n° 3540/85 portant modalités
    d' application des mesures spéciales pour les pois, fèves, féveroles et lupins
    doux, pour ce qui est de la durée de validité des certificats
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2123/88 der Kommission vom 15. Juli 1988 zur Abweichung
    von der Verordnung (EWG) Nr. 3540/85 mit Durchführungsbestimmungen für die besonderen
    Maßnahmen für Erbsen, Puffbohnen, Ackerbohnen und Süßlupinen hinsichtlich
    der Gültigkeitsdauer der Beihilfebescheinigungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2123/88 af 15. juli 1988 om fastsættelse
    af undtagelsesbestemmelser til forordning (EØF) nr. 3540/85 om gennemførelsesbestemmelser
    til særforanstaltningerne for ærter, bønner, hestebønner og sødlupiner, for
    så vidt angår attesternes gyldighedsperiode
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2123/88 της Επιτροπής
    της 15ης Ιουλίου 1988 που προβλέπει παρέκκλιση
    από τις διατάξεις του κανονισμού (ΕΟΚ) αριθ.
    3450/85 για λεπτομέρειες εφαρμογής των ειδικών
    μέτρων για τα πίσα, τα κουκιά, τα φούλια και
    τα γλυκά λούπινα, όσον αφορά τη διάρκεια ισχύος
    των πιστοποιητικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2123/88 della Commissione del 15 luglio 1988 recante
    deroga al regolamento (CEE) n. 3540/85 recante modalità di applicazione delle
    misure speciali per i piselli, le fave, le favette e i lupini dolci, in ordine
    al periodo di validità dei certificati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2123/88 van de Commissie van 15 juli 1988 tot afwijking
    van Verordening (EEG) nr. 3540/85 houdende bepalingen ter uitvoering van de bijzondere
    maatregelen voor erwten, tuin- en veldbonen en niet-bittere lupinen ten aanzien
    van de geldigheidsduur van de certificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2123/88 da Comissão de 15 de Julho de 1988 que
    prevê disposições derrogatórias ao Regulamento (CEE) n.° 3540/85 que estabelece
    as modalidades de aplicação das medidas especiais para as ervilhas, favas, favarolas
    e tremoços doces, no que respeita ao período de validade dos certificados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2123/88 de la Comisión de 15 de julio de 1988 por
    el que se establecen excepciones al Reglamento (CEE) n° 3540/85 sobre modalidades
    de aplicación de las medidas especiales para guisantes, habas, haboncillos y
    altramuces dulces respecto al período de vigencia de los certificados
