id: EURegulation16921979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1692/79 of 31 July 1979 re-establishing
    the levying of customs duties on basketwork, wickerwork and other articles of
    plaiting materials, made directly to shape ; articles made up from goods falling
    within heading No 46.02 ; articles of loofah, falling within heading No 46.03
    and originating in the Philippines and Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1692/79 de la Commission, du 31 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de vannerie obtenus directement en forme ou confectionnés à l' aide des articles
    du n° 46.02 ; ouvrages en luffa, de la position 46.03 du tarif douanier commun,
    originaires des Philippines et de Yougoslavie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1692/79 der Kommission vom 31. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Korbmacherwaren und andere Waren, unmittelbar aus Flechtstoffen
    hergestellt oder aus Waren der Tarifnummer 46.02 gefertigt; Waren aus Luffa, der
    Tarifnummer 46.03, mit Ursprung in Philippinen und Jugoslawien, denen die in der
    Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1692/79 af 31. juli 1979 om genindførelse
    af opkrævning af toldafgifter for kurvemagerarbejder og andre varer fremstillet
    direkte af flettematerialer eller af de under position 46.02 henhørende varer
    ; varer af luffa under position 46.03, som har oprindelse i Filippinerne og Jugoslavien,
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1692/79 della Commissione, del 31 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a lavori di panieraio
    ottenuti direttamente nelle loro forme oppure confezionati con manufatti della
    voce 46.02, lavori in luffa, della voce 46.03 della tariffa doganale comune, originari
    delle Filippine e della Iugoslavia beneficiarie delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1692/79 van de Commissie van 31 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mandenmakerswerk,
    vervaardigd van vlechtstoffen of van artikelen bedoeld bij post 46.02; werken
    van luffa (loofah), van post 46.03, van oorsprong uit de Filippijnen en Joegoslavië
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
