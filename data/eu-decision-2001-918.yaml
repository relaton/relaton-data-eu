title:
- language: en
  script: Latn
  content: '2001/918/EC: Council Decision of 3 December 2001 on the conclusion of
    an Additional Protocol adjusting the trade aspects of the Stabilisation and Association
    Agreement between the European Communities and their Member States, of the one
    part, and the Republic of Croatia, of the other part, to take account of the outcome
    of the negotiations between the parties on reciprocal preferential concessions
    for certain wines, the reciprocal recognition, protection and control of wine
    names and the reciprocal recognition, protection and control of designations for
    spirits and aromatised drinks'
  type: main
- language: fr
  script: Latn
  content: '2001/918/CE: Décision du Conseil du 3 décembre 2001 relative à la conclusion
    d''un protocole additionnel d''adaptation des aspects commerciaux de l''accord
    de stabilisation et d''association entre les Communautés européennes et leurs
    États membres, d''une part, et la République de Croatie, d''autre part, pour
    tenir compte des résultats des négociations entre les parties concernant l''établissement
    de concessions préférentielles réciproques pour certains vins, la reconnaissance,
    la protection et le contrôle réciproques des dénominations de vins, ainsi que
    la reconnaissance, la protection et le contrôle réciproques des appellations
    de spiritueux et de boissons aromatisées'
  type: main
- language: de
  script: Latn
  content: '2001/918/EG: Beschluss des Rates vom 3. Dezember 2001 über den Abschluss
    eines Zusatzprotokolls zur Anpassung der Handelsaspekte des Stabilisierungs- und
    Assoziierungsabkommens zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der Republik Kroatien andererseits aufgrund der Ergebnisse der
    Verhandlungen zwischen den Parteien über gegenseitige präferenzielle Zugeständnisse
    für bestimmte Weine, über gegenseitige Anerkennung, Schutz und Kontrolle von
    Weinnamen und über gegenseitige Anerkennung, Schutz und Kontrolle von Bezeichnungen
    für Spirituosen und aromatisierte Getränk'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 3 декември 2001 година
    за сключване на Допълнителен протокол за адаптиране
    на търговските аспекти на Споразумението за
    стабилизиране и асоцииране между Европейските
    общности и техните държави-членки, от една
    страна, и Република Хърватска, от друга страна,
    за да се вземат предвид резултатите от преговорите
    между страните за определянето на взаимни
    преференциални отстъпки за някои вина, взаимното
    признаване, защита и контрол на наименованията
    на вина, както и за взаимното признаване, защита
    и контрол на наименованията на спиртни и ароматизирани
    напитки
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 3. prosince 2001 o uzavření Dodatkového protokolu,
