    și de asociere dintre Comunitățile Europene și statele membre, pe de o parte,
    și Republica Croația, pe de altă parte, pentru a ține seama de rezultatul
    negocierilor dintre părți privind stabilirea de concesii preferențiale reciproce
    pentru anumite vinuri, recunoașterea, protecția și controlul reciproc al denumirilor
