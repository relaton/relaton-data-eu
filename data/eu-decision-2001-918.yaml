    trgovinskih vidikov Stabilizacijsko-pridružitvenega sporazuma med Evropskimi
    skupnostmi in njihovimi državami članicami na eni strani ter Republiko Hrvaško
    na drugi strani na podlagi izida pogajanj med pogodbenicama o vzajemnih preferencialnih
    koncesijah za posamezna vina, vzajemnem priznavanju, zaščiti in nadzoru imen
    vin in vzajemnem priznavanju, zaščiti in nadzoru označb za žganja in aromatizirane
