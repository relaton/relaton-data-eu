    Evropskými společenstvími a jejich členskými státy na jedné straně a Chorvatskou
    republikou na straně druhé za účelem zohlednění výsledku jednání mezi
    stranami o vzájemných preferenčních koncesích pro některá vína, o vzájemném
    uznávání, ochraně a kontrole názvů vín a o vzájemném uznávání, ochraně
    a kontrole označení lihovin a aromatizovaných nápojů
  type: main
