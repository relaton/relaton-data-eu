  content: Règlement (CEE) n 1503/70 de la Commission, du 28 juillet 1970, déterminant
    certaines superficies viticoles dont les vins de table peuvent avoir un titre
    alcoomémétrique naturel total maximum de 17
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1503/70 der Kommission vom 28. Juli 1970 zur Festlegung
    bestimmter Weinbauflächen zur Erzeugung von Tafelweinen, die einen natürlichen
    Höchst-Gesamtalkoholgehalt von 17 haben können
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1503/70 della Commissione, del 28 luglio 1970, che
    determina talune superfici viticole nelle quali sono prodotti vini da pasto che
    possono avere gradazione alcolometrica naturale totale massima di 17
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1503/70 van de Commissie van 28 juli 1970 houdende
    bepaling van sommige wijngaardoppervlakten waarvan de tafelwijnen een totaal natuurlijk
    alcoholgehalte van ten hoogste 17 mogen hebben
