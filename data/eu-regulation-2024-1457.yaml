    κανονισμού (ΕΕ) 2018/2019 όσον αφορά ορισμένα φυτά
    προς φύτευση του είδους Prunus persica, Prunus dulcis, Prunus
    armeniaca και Prunus davidiana καταγωγής Τουρκίας, και
