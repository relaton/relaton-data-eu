  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/1457, 27. mai 2024, millega muudetakse
    rakendusmäärust (EL) 2018/2019 seoses teatavate liiki Prunus persica, Prunus
    dulcis, Prunus armeniaca ja Prunus davidiana kuuluvate Türgist pärit ja istutamiseks
    ettenähtud taimedega ning rakendusmäärust (EL) 2020/1213 seoses kõnealuste
    istutamiseks ettenähtud taimede liidu territooriumile sissetoomisel kehtivate
    fütosanitaarmeetmetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/1457, annettu 27 päivänä
    toukokuuta 2024, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta tiettyjen
    Turkista peräisin olevien Prunus persica-, Prunus dulcis-, Prunus armeniaca-
    ja Prunus davidiana -lajien istutettaviksi tarkoitettujen kasvien osalta ja täytäntöönpanoasetuksen
    (EU) 2020/1213 muuttamisesta siltä osin kuin on kyse kyseisten istutettaviksi
    tarkoitettujen kasvien tuomista unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/1457 ón gCoimisiún an 27 Bealtaine
    2024 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe Prunus persica, Prunus dulcis, Prunus armeniaca agus Prunus
    davidiana le haghaidh plandú de thionscnamh na Tuirce agus lena leasaítear Rialachán
    Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann leis na bearta fíteashláintíochta
    chun na plandaí sin le haghaidh plandú a thabhairt isteach i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1457 оd 27. svibnja 2024. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Prunus
    persica, Prunus dulcis, Prunus armeniaca i Prunus davidiana podrijetlom iz Turske
    i Provedbene uredbe (EU) 2020/1213 u pogledu fitosanitarnih mjera za unos tog
    bilja za sadnju na područje Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1457 végrehajtási rendelete (2024. május 27.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Prunus persica, a Prunus dulcis,
    a Prunus armeniaca és a Prunus davidiana bizonyos, Törökországból származó,
    ültetésre szánt növényei tekintetében, valamint az (EU) 2020/1213 végrehajtási
    rendeletnek az említett, ültetésre szánt növények Unióba való behozatalára
    vonatkozó növényegészségügyi intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/1457 della Commissione, del 27 maggio
    2024, che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Prunus persica, Prunus dulcis, Prunus armeniaca e
    Prunus davidiana originarie della Turchia e il regolamento di esecuzione (UE)
    2020/1213 per quanto riguarda le misure fitosanitarie per l’introduzione di
    tali piante da impianto nel territorio dell’Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/1457 (2024. gada 27. maijs), ar
    ko attiecībā uz dažiem stādāmiem Turcijas izcelsmes Prunus persica, Prunus
    dulcis, Prunus armeniaca un Prunus davidiana augiem groza Īstenošanas regulu
    (ES) 2018/2019 un attiecībā uz fitosanitārajiem pasākumiem, kurus piemēro
    minēto stādāmo augu ievešanai Savienības teritorijā, groza Īstenošanas
    regulu (ES) 2020/1213
  type: main
- language: lt
  script: Latn
  content: 2024 m. gegužės 27 d. Komisijos įgyvendinimo reglamentas (ES) 2024/1457,
    kuriuo dėl tam tikrų Turkijos kilmės sodinti skirtų Prunus persica, Prunus
    dulcis, Prunus armeniaca ir Prunus davidiana augalų iš dalies keičiamas Reglamentas
    (ES) 2018/2019 ir dėl fitosanitarinių priemonių, taikomų tiems į Sąjungos
    teritoriją įvežamiems sodinti skirtiems augalams, iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1457 tas-27
    ta’ Mejju 2024 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil ta’ Prunus persica, Prunus dulcis,
    Prunus armeniaca u Prunus davidiana li joriġinaw mit-Turkija, u r-Regolament
    ta’ Implimentazzjoni (UE) 2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni
    ta’ dawk il-pjanti għat-tħawwil fit-territorju tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/1457 van de Commissie van 27 mei 2024
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde uit
    Turkije afkomstige voor opplant bestemde planten van de soorten Prunus persica,
    Prunus dulcis, Prunus armeniaca en Prunus davidiana, en tot wijziging van Uitvoeringsverordening
    (EU) 2020/1213 wat betreft de fytosanitaire maatregelen voor het binnenbrengen
    van die voor opplant bestemde planten op het grondgebied van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/1457 z dnia 27 maja 2024 r.
    zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin przeznaczonych do sadzenia gatunków Prunus persica, Prunus dulcis, Prunus
    armeniaca i Prunus davidiana pochodzących z Turcji, i zmieniające rozporządzenie
    wykonawcze (UE) 2020/1213 w odniesieniu do środków fitosanitarnych do celów
    wprowadzania tych roślin przeznaczonych do sadzenia na terytorium Unii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/1457 da Comissão, de 27 de maio de
    2024, que altera o Regulamento de Execução (UE) 2018/2019, no que diz respeito
    a determinados vegetais para plantação de Prunus persica, Prunus dulcis, Prunus
    armeniaca e Prunus davidiana originários da Turquia, e o Regulamento de Execução
    (UE) 2020/1213, no que diz respeito às medidas fitossanitárias para a introdução
    desses vegetais para plantação no território da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1457 al Comisiei din 27 mai
    2024 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării din speciile Prunus persica,
    Prunus dulcis, Prunus armeniaca și Prunus davidiana originare din Turcia și
    a Regulamentului de punere în aplicare (UE) 2020/1213 în ceea ce privește măsurile
    fitosanitare vizând introducerea plantelor respective destinate plantării pe
    teritoriul Uniunii
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/1457 z 27. mája 2024, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhom Prunus persica, Prunus dulcis, Prunus armeniaca
    a Prunus davidiana pochádzajúce z Turecka, a ktorým sa mení vykonávacie nariadenie
    (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske opatrenia v súvislosti so vstupom
    uvedených rastlín určených na výsadbu na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/1457 z dne 27. maja 2024 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Prunus persica,
    Prunus dulcis, Prunus armeniaca in Prunus davidiana s poreklom iz Turčije ter
    Izvedbene uredbe (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos navedenih
    rastlin za saditev na ozemlje Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/1457 de la Comisión, de 27 de mayo
    de 2024, por el que se modifican el Reglamento de Ejecución (UE) 2018/2019 en
    lo que respecta a determinados vegetales para plantación de Prunus persica, Prunus
    dulcis, Prunus armeniaca y Prunus davidiana originarios de Turquía y el Reglamento
    de Ejecución (UE) 2020/1213 en lo que respecta a las medidas fitosanitarias para
    la introducción de dichos vegetales para plantación en el territorio de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/1457 av den 27 maj 2024
    om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa växter
    för plantering av Prunus persica, Prunus dulcis, Prunus armeniaca och Prunus
    davidiana med ursprung i Turkiet, och om ändring av genomförandeförordning
    (EU) 2020/1213 vad gäller växtskyddsåtgärder för införsel av dessa växter
    för plantering till unionens territorium
