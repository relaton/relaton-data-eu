title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1457 of 27 May 2024 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Prunus persica, Prunus dulcis, Prunus armeniaca and Prunus davidiana originating
    in Türkiye and Implementing Regulation (EU) 2020/1213 as regards the phytosanitary
    measures for the introduction of those plants for planting into the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1457 de la Commission du 27 mai 2024
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation appartenant aux espèces Prunus persica,
    Prunus dulcis, Prunus armeniaca et Prunus davidiana et originaires de Turquie,
    et le règlement d’exécution (UE) 2020/1213 en ce qui concerne les mesures
    phytosanitaires préalables à l’introduction de ces végétaux destinés à
    la plantation sur le territoire de l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1457 der Kommission vom 27. Mai 2024
    zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich einiger
    zum Anpflanzen bestimmter Pflanzen von Prunus persica, Prunus dulcis, Prunus armeniaca
    und Prunus davidiana mit Ursprung in der Türkei sowie zur Änderung der Durchführungsverordnung
    (EU) 2020/1213 hinsichtlich der Pflanzenschutzmaßnahmen für das Einführen dieser
    zum Anpflanzen bestimmten Pflanzen in das Gebiet der Union
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/1457 на Комисията
    от 27 май 2024 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от видовете Prunus persica,
    Prunus dulcis, Prunus armeniaca и Prunus davidiana с произход от Турция
    и за изменение на Регламент за изпълнение (ЕС)
    2020/1213 по отношение на фитосанитарните мерки
    за въвеждането на тези растения за засаждане
    на територията на Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1457 ze dne 27. května 2024,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhu Prunus persica, Prunus dulcis, Prunus armeniaca
    a Prunus davidiana pocházející z Turecka, a prováděcí nařízení (EU) 2020/1213,
    pokud jde o fytosanitární opatření pro dovoz uvedených rostlin k pěstování
    na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1457 af 27. maj 2024
    om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår visse
    planter til plantning af Prunus persica, Prunus dulcis, Prunus armeniaca og Prunus
    davidiana med oprindelse i Tyrkiet og om ændring af gennemførelsesforordning
    (EU) 2020/1213 for så vidt angår de plantesundhedsmæssige foranstaltninger
    for indførsel til Unionens område af disse planter til plantning
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/1457 της Επιτροπής,
