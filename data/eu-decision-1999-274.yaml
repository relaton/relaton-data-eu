title:
- language: en
  script: Latn
  content: '1999/274/EC: Commission Decision of 22 July 1998 on the misuse of restructuring
    aid for MTW-Schiffswerft and Volkswerft Stralsund, two companies formerly belonging
    to Bremer Vulkan Verbund, and the unauthorised provision of an investment loan
    of DEM 112,4 million to MTW- Schiffswerft (Text with EEA relevance) (notified
    under document number C(1998) 2405)'
  type: main
- language: fr
  script: Latn
