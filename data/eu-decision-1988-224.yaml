    afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG toe te staan (Slechts
    de teksten in de Franse, Duitse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/224/CEE: Decisão da Comissão de 7 de Abril de 1988 que autoriza determinados
