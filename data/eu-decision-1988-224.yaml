title:
- language: en
  script: Latn
  content: '88/224/EEC: Commission Decision of 7 April 1988 authorizing certain Member
    States to provide for exceptions from certain provisions of Directive 77/93/EEC
    in respect of potatoes for human consumption originating in Turkey (Only the French,
    German and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/224/CEE: Décision de la Commission du 7 avril 1988 autorisant certains
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE pour les pommes de terre de consommation originaires de Turquie (Les
    textes en langues française, allemande et néerlandaise sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '88/224/EWG: Entscheidung der Kommission vom 7. April 1988 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Speisekartoffeln mit Ursprung in der Türkei
    Ausnahmen von einigen Vorschriften der Richtlinie 77/93/EWG zuzulassen (Nur der
    französische, deutsche und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/224/EØF: Kommissionens beslutning af 7. april 1988 om bemyndigelse
    af visse medlemsstater til at fastsætte undtagelser fra visse bestemmelser i
    direktiv 77/93/EØF for spisekartofler med oprindelse i Tyrkiet (Kun den franske,
    tyske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/224/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Απριλίου
    1988 η οποία επιτρέπει σε ορισμένα κράτη μέλη
    να προβλέψουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ σχετικά με τις πατάτες για
    ανθρώπινη κατανάλωση καταγωγής Τουρκίας (Τα
    κείμενα στην γαλλική, γερμανική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/224/CEE: Decisione della Commissione del 7 aprile 1988 che autorizza
    taluni Stati membri a prevedere deroghe, per le patate da consumo originarie della
    Turchia, ad alcune disposizioni della direttiva 77/93/CEE (Il testi in lingua
    francese, tedesca e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/224/EEG: Beschikking van de Commissie van 7 april 1988 waarbij bepaalde
