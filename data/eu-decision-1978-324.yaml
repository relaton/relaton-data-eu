---
id: EUDecision1978324
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 February 1978 authorizing the French Republic
    not to apply Community treatment to clothing accessories and other articles (except
    outer garments and bathing costumes), knitted or crocheted, not elastic or rubberized,
    falling within heading No ex 60.05 or ex 60.06 of the Common Customs Tariff, originating
    in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/324/CEE: Décision de la Commission, du 24 février 1978, autorisant
    la République française à exclure du traitement communautaire les accessoires
    du vêtement et autres articles (à l''exception des vêtements et maillots de
    bain) de bonneterie non élastique ni caoutchoutée, des positions Ex 60.05 et
    Ex 60.06 du Tarif douanier commun, originaires de Taiwan et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Februar 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches Bekleidungszubehör und andere Wirkwaren (andere
    als Oberkleidung und Badeanzüge), weder gummielastisch noch kautschutiert, der
    Tarifnummern ex 60.05 und ex 60.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 24. februar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage tilbehør til beklædningsgenstande
    og andre varer (undtagen yderbeklædningsgenstande og badedragter) af trikotage,
    ikke elastisk eller gummeret, som henhører under pos. ex 60.05 og ex 60.06 i
    den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 febbraio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli accessori di abbigliamento
    ed altri manufatti (diversi dagli indumenti e costumi da bagno) a maglia non elastica
    né gommata, delle voci ex 60.05 e ex 60.06 della tariffa doganale comune, originari
    di Taiwan e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 februari 1978 waarbij de Franse Republiek
    wordt gemachtigd kledingtoebehoren en andere artikelen (andere dan bovenkleding
    en badkostuums) van niet-elastisch of van niet-gegummeerd brei- of haakwerk van
    de posten ex 60.05 en ex 60.06 van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
