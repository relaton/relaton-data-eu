title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 341/76 of 16 February 1976 temporarily and
    totally suspending the customs duty applicable in the Community as originally
    constituted to foliage of asparagus plumosus falling within subheading ex 06.04
    B I of the Common Customs Tariff and imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 341/76 du Conseil, du 16 février 1976, portant suspension
    totale et temporaire du droit de douane applicable dans la Communauté dans sa
    composition originaire aux feuillages d'asparagus plumosus, de la sous-position
    EX 06.04 B I du tarif douanier commun, importés des nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 341/76 des Rates vom 16. Februar 1976 zur vollständigen
    und zeitweiligen Aussetzung des in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung
    geltenden Zollsatzes für die Einfuhr von Asparagus plumosus Schnittgrün der
    Tarifstelle ex 06.04 B I des Gemeinsamen Zolltarifs aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 341/76 af 16. februar 1976 om fuldstændig
    og midlertidig suspension af den toldsats, der finder anvendelse i Fællesskabet
    i dets oprindelige udstrækning på snitgrønt af asparagus plumosus henhørende
    under pos. ex 06.04 B I i den fælles toldtarif ved indførsel fra de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 341/76 del Consiglio, del 16 febbraio 1976, relativo
    alla sospensione totale e temporanea dei dazi doganali applicabili nella Comunità
    nella sua composizione originaria al fogliame di asparagus plumosus della sottovoce
    ex 06.04 B I della tariffa doganale comune importato dai nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 341/76 van de Raad van 16 februari 1976 houdende
    tijdelijke en algehele schorsing van het douanerecht van toepassing in de Gemeenschap
    in haar oorspronkelijke samenstelling voor loof van asparagus plumosus, van onderverdeling
    ex 06.04 B I van het gemeenschappelijk douanetarief, ingevoerd uit de nieuwe Lid-Staten
