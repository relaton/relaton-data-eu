  content: Décision 66/276/CEE de la Commission, du 19 avril 1966, autorisant la
    perception de taxes compensatoires sur les importations, en République italienne,
    de biscottes et biscuits en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '66/276/EWG: Entscheidung der Kommission vom 19. April 1966 über die Erhebung
    von Ausgleichsabgaben auf Einfuhren von Zwieback und Keksen aus verschiedenen
    Mitgliedstaaten in die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '66/276/CEE: Decisione della Commissione, del 19 aprile 1966, che autorizza
    la riscossione di tasse di compensazione sulle importazioni, nella Repubblica
    italiana, di fette biscottate e di biscotti in provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/276/EEG: Beschikking van de Commissie van 19 april 1966 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Italiaanse Republiek
    van beschuit en biscuits uit bepaalde Lid- Staten'
