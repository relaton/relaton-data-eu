    zur Regelung der Abgabebedingungen und zur Änderung der Verordnung (EWG) Nr.
    1687/76
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3110/76 af 20. december 1976 om tilladelse
    til overdragelse til forarbejdningsindustrierne af appelsiner, der er trukket
    tilbage fra markedet, og om fastsættelse af betingelserne for denne overdragelse,
    ændret ved forordning (EØF) nr. 1687/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3110/76 della Commissione, del 20 dicembre 1976, che
