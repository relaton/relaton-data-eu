  content: Commission Regulation (EEC) No 3110/76 of 20 December 1976 authorizing
    the supply to the processing industries of oranges withdrawn from the market,
    laying down the conditions for such supply and amending Regulation (EEC) No 1687/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3110/76 de la Commission, du 20 décembre 1976, autorisant
    la cession aux industries de transformation d' oranges retirées du marché, fixant
    les conditions de cette cession et modifiant le règlement (CEE) n° 1687/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3110/76 der Kommission vom 20. Dezember 1976 zur Ermächtigung
