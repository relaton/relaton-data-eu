title:
- language: en
  script: Latn
  content: '79/939/EEC: Commission Decision of 22 October 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the French Republic of expenditure incurred
    during 1978 in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/939/CEE: Décision de la Commission, du 22 octobre 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République française des dépenses effectuées
    pendant l''année 1978 dans le cadre d''une action de la Communauté en vue de
    l''éradication de la brucellose, de la tuberculose et de la leucose des bovins
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/939/EWG: Entscheidung der Kommission vom 22. Oktober 1979 über die
    Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an die Französische Republik (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/939/EØF: Kommissionens beslutning af 22. oktober 1979 om refusion
