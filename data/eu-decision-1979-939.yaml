    delle spese effettuate nell''anno 1978 nel quadro di un''azione della Comunità
    per l''eradicazione della brucellosi, della tubercolosi e della leucosi dei bovini
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/939/EEG: Beschikking van de Commissie van 22 oktober 1979 betreffende
