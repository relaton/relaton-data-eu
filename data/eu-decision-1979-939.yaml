    i 1978 i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/939/CEE: Decisione della Commissione, del 22 ottobre 1979, relativa
