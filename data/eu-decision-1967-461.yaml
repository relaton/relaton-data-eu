title:
- language: fr
  script: Latn
  content: Décision 67/461/CEE de la Commission, du 29 juin 1967, autorisant la République
    fédérale d'Allemagne, en vertu de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire les "oxydes d'antimoine" de la position Ex 28.28 M
    du Tarif douanier commun, originaires des pays de l'Est et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/461/EWG: Entscheidung der Kommission vom 29. Juni 1967 zur Ermächtigung
    der Bundesrepublik Deutschland nach Artikel 115 Absatz (1) des Vertrages, um Antimonoxyde
    der Tarifnummer ex 28.28 M des Gemeinsamen Zolltarifs mit Ursprung in den Ostblockländern,
    die sich in den übrigen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/461/CEE: Decisione della Commissione del 29 giugno 1967, che autorizza
    la Repubblica federale di Germania, ai sensi dell''articolo 115, primo comma,
    del Trattato, ad escludere dal trattamento comunitario gli ossidi di antimonio
    della voce ex 28.28 M della tariffa doganale comune originari dei paesi dell''Est
    ed immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/461/EEG: Beschikking van de Commissie van 29 juni 1967 houdende machtiging
    van de Bondsrepubliek Duitsland om, op grond van artikel 115, eerste alinea, van
    het Verdrag, antimoonoxyden van post ex 28.28 M van het gemeenschappelijk douanetarief,
    van oorsprong uit de oostelijke landen en in de andere Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
