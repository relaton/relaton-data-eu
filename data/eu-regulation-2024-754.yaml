title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/754 of 29 February 2024 amending
    Implementing Regulation (EU) 2020/1762 as regards the terms of the authorisation
    of a preparation of Bacillus subtilis DSM 32324, Bacillus subtilis DSM 32325 and
    Bacillus amyloliquefaciens DSM 25840 as a feed additive for all poultry species
    for fattening or reared for laying or reared for breeding (holder of authorisation:
    Chr. Hansen A/S)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/754 de la Commission du 29 février
    2024 modifiant le règlement d’exécution (UE) 2020/1762 en ce qui concerne
    les conditions d’autorisation d’une préparation de Bacillus subtilis DSM
    32324, Bacillus subtilis DSM 32325 et Bacillus amyloliquefaciens DSM 25840 en
    tant qu’additif pour l’alimentation de toutes les espèces de volailles d’engraissement,
    ou élevées pour la ponte ou pour la reproduction (titulaire de l’autorisation:
    Chr. Hansen A/S)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/754 der Kommission vom 29. Februar
    2024 zur Änderung der Durchführungsverordnung (EU) 2020/1762 hinsichtlich der
    Bedingungen für die Zulassung einer Zubereitung aus Bacillus subtilis DSM 32324,
    Bacillus subtilis DSM 32325 und Bacillus amyloliquefaciens DSM 25840 als Zusatzstoff
    in Futtermitteln für alle Geflügelarten für die Mast und Jungtiere aller Geflügelarten
    für Lege- oder Zuchtzwecke (Zulassungsinhaber: Chr. Hansen A/S)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/754 на Комисията
    от 29 февруари 2024 година за изменение на Регламент
    за изпълнение (ЕС) 2020/1762 по отношение на условията
    за разрешаване на употребата на препарат от
    Bacillus subtilis DSM 32324, Bacillus subtilis DSM 32325 и Bacillus amyloliquefaciens
    DSM 25840 като фуражна добавка за всички видове
    домашни птици, отглеждани за угояване, за носачки
    или за разплод (притежател на разрешението
    Chr. Hansen A/S)
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/754 ze dne 29. února 2024,
    kterým se mění prováděcí nařízení (EU) 2020/1762, pokud jde o podmínky
    povolení přípravku Bacillus subtilis DSM 32324, Bacillus subtilis DSM 32325
    a Bacillus amyloliquefaciens DSM 25840 jako doplňkové látky pro výkrm nebo
    odchov všech druhů drůbeže (držitel povolení: Chr. Hansen A/S)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2024/754 af 29. februar 2024
