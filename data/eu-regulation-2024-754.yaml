    for godkendelse af et præparat af Bacillus subtilis DSM 32324, Bacillus subtilis
    DSM 32325 og Bacillus amyloliquefaciens DSM 25840 som fodertilsætningsstof til
    alle fjerkræarter bestemt til slagtning eller opdrættet til æglægning eller
    avl (indehaver af godkendelsen: Chr. Hansen A/S)'
  type: main
