title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 249/79 of 9 February 1979 re-establishing
    the levying of customs duties on other cotton yarn, falling within subheading
    55.05 B I, originating in Peru to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 249/79 de la Commission, du 9 février 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres fils
    de coton, de la sous-position tarifaire 55.05 B I, originaires du Pérou bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 249/79 der Kommission vom 9. Februar 1979 über die
    Wiedereinführung des Zollsatzes für andere Baumwollgarne der Tarifstelle 55.05
    B I, mit Ursprung in Peru, dem die in der Verordnung (EWG) Nr. 3157/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 249/79 af 9. februar 1979 om genindførelse
    af opkrævning af toldafgifter for andre garn af bomuld, henhørende under pos.
    55.05 B I, som har oprindelse i Peru og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 249/79 della Commissione, del 9 febbraio 1979,che
    ripristina la riscossione dei dazi doganali applicabili agli altri filati di cotone,
    della sottovoce doganale 55.05 B I, originari del Perù, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 249/79 van de Commissie van 9 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere garens
    van katoen, van onderverdeling 55.05 B I, van oorsprong uit Peru waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3157/78 van de
    Raad
  type: main
