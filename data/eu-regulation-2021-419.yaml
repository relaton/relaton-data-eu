---
id: EURegulation2021419
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/419 of 9 March 2021 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Jasminum polyanthum Franchet originating in Israel and adapting Combined Nomenclature
    codes for Ullucus tuberosus and amending Implementing Regulation (EU) 2020/1213
    as regards the phytosanitary measures for the introduction of those plants for
    planting into the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/419 de la Commission du 9 mars 2021
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation de l’espèce Jasminum polyanthum Franchet
    originaires d’Israël, adaptant les codes de la nomenclature combinée pour
    Ullucus tuberosus et modifiant le règlement d’exécution (UE) 2020/1213 en
    ce qui concerne les mesures phytosanitaires applicables à l’introduction de
    ces végétaux destinés à la plantation sur le territoire de l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/419 der Kommission vom 9. März 2021
    zur Änderung der Durchführungsverordnung (EU) 2018/2019 in Bezug auf bestimmte
    zum Anpflanzen bestimmte Pflanzen von Jasminum polyanthum Franchet mit Ursprung
    in Israel und zur Anpassung der Codes der Kombinierten Nomenklatur für Ullucus
    tuberosus sowie zur Änderung der Durchführungsverordnung (EU) 2020/1213 in Bezug
    auf die pflanzenschutzrechtlichen Maßnahmen für das Einführen von diesen zum
    Anpflanzen bestimmten Pflanzen in das Gebiet der Union
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/419 на Комисията
    от 9 март 2021 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от вида Jasminum polyanthum Franchet
    с произход от Израел и за приспособяване на
    кодовете по Комбинираната номенклатура за
    вида Ullucus tuberosus, както и за изменение на Регламент
    за изпълнение(ЕС) 2020/1213 по отношение на фитосанитарните
    мерки за въвеждането на тези растения за засаждане
    на територията на Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/419 ze dne 9. března 2021, kterým
    se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé rostliny
    Jasminum polyanthum Franchet k pěstování pocházející z Izraele a úpravu
    kódů kombinované nomenklatury pro rostliny Ullucus tuberosus, a kterým se
    mění prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární opatření
    pro dovoz uvedených rostlin k pěstování na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/419 af 9. marts 2021
    om ændring af gennemførelsesforordning (EU) 2018/2019 for så vidt angår visse
    planter til plantning af Jasminum polyanthum Franchet med oprindelse i Israel
    og tilpasning af kombineret nomenklatur-koderne for Ullucus tuberosus og om ændring
    af gennemførelsesforordning (EU) 2020/1213 for så vidt angår de plantesundhedsmæssige
    foranstaltninger for indførsel til Unionen af disse planter til plantning
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/419 της Επιτροπής
    της 9ης Μαρτίου 2021 για την τροποποίηση του εκτελεστικού
    κανονισμού (ΕΕ) 2018/2019 όσον αφορά ορισμένα φυτά
    προς φύτευση Jasminum polyanthum Franchet, καταγωγής Ισραήλ,
    και όσον αφορά την προσαρμογή των κωδικών της
    Συνδυασμένης Ονοματολογίας για το Ullucus tuberosus,
    και για την τροποποίηση του εκτελεστικού κανονισμού
    (ΕΕ) 2020/1213 όσον αφορά τα φυτοϋγειονομικά μέτρα
    για την είσοδο των εν λόγω φυτών προς φύτευση
    στο έδαφος της Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/419, 9. märts 2021, millega muudetakse
    rakendusmäärust (EL) 2018/2019 seoses teatavate liigi Jasminum polyanthum Franchet
    Iisraelist pärit, istutamiseks ettenähtud taimedega, kohandatakse liigi Ullucus
    tuberosus kombineeritud nomenklatuuri koode ning muudetakse rakendusmäärust
    (EL) 2020/1213 seoses kõnealuste istutamiseks ettenähtud taimede liidu territooriumile
    sissetoomisel kehtivate fütosanitaarmeetmetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/419, annettu 9 päivänä
    maaliskuuta 2021, asetuksen (EU) 2018/2019 muuttamisesta siltä osin kuin on kyse
    tietyistä Israelista peräisin olevista Jasminum polyanthum Franchet -lajin istutettaviksi
    tarkoitetuista kasveista ja yhdistetyn nimikkeistön koodien mukauttamisesta Ullucus
    tuberosus -tuhoojan osalta ja täytäntöönpanoasetuksen (EU) 2020/1213 muuttamisesta
    siltä osin kuin on kyse kyseisten istutettaviksi tarkoitettujen kasvien tuomista
    unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/419 ón gCoimisiún an 9 Márta 2021
    lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 maidir le plandaí
    áirithe a bhfuiltear lena gcur de Jasminum polyanthum Franchet de thionscnamh
    Iosrael agus lena n-oiriúnaítear cóid Ainmníochta Comhcheangailte le haghaidh
    Ullucus tuberosus agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213
    a mhéid a bhaineann leis na bearta fíteashláintíochta chun na plandaí sin
    a bhfuiltear lena gcur a thabhairt isteach i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/419 оd 9. ožujka 2021. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrste Jasminum
    polyanthum Franchet podrijetlom iz Izraela i prilagodbe oznaka kombinirane nomenklature
    za vrstu Ullucus tuberosus te o izmjeni Provedbene uredbe (EU) 2020/1213 u pogledu
    fitosanitarnih mjera za unos tog bilja za sadnju na područje Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/419 végrehajtási rendelete (2021. március 9.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Jasminum polyanthum Franchet egyes
    Izraelből származó, ültetésre szánt növényei és az Ullucus tuberosus-ra
    vonatkozó Kombinált Nómenkaltúra-kódok kiigazítása, valamint az (EU) 2020/1213
    végrehajtási rendeletnek az említett ültetésre szánt növények Unióba
    való behozatalára vonatkozó növényegészségügyi intézkedések tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/419 della Commissione del 9 marzo 2021
    che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda alcune
    piante da impianto di Jasminum polyanthum Franchet originarie di Israele, adegua
    i codici della nomenclatura combinata per l’Ullucus tuberosus e modifica il
    regolamento di esecuzione (UE) 2020/1213 per quanto riguarda le misure fitosanitarie
    per l’introduzione di tali piante da impianto nel territorio dell’Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/419 (2021. gada 9. marts), ar
    ko Īstenošanas regulu (ES) 2018/2019 groza attiecībā uz Izraēlas izcelsmes
    noteiktiem stādāmiem Jasminum polynathum Franchet augiem un Ullucus tuberosus
    kombinētās nomenklatūras kodu pielāgošanu un Īstenošanas regulu (ES) 2020/1213
    groza attiecībā uz minēto stādāmo augu fitosanitāro pasākumu ievešanu
    Savienības teritorijā
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/419 2021 m. kovo 9 d. kuriuo
    dėl tam tikrų Izraelio kilmės sodinti skirtų Jasminum polyanthum Franchet
    augalų ir Ullucus tuberosus Kombinuotosios nomenklatūros kodų pritaikymo iš
    dalies keičiamas Reglamentas (ES) 2018/2019 ir dėl fitosanitarinių priemonių,
    taikomų tiems į Sąjungos teritoriją įvežamiems sodinti skirtiems augalams,
    iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/419 tad-9 ta’
    Marzu 2021 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019 fir-rigward
    ta’ ċerti pjanti għat-tħawwil tal-Jasminum polyanthum Franchet li toriġina
    f’Iżrael, u li jadatta l-kodiċijiet tan-Nomenklatura Magħquda għall-Ullucus
    tuberosus u li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2020/1213 fir-rigward
    tal-miżuri fitosanitarji għall-introduzzjoni ta’ dawk il-pjanti għat-tħawwil
    fit-territorju tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/419 van de Commissie van 9 maart 2021
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde voor
    opplant bestemde planten van de soort Jasminum polyanthum Franchet van oorsprong
    uit Israël, tot aanpassing van de codes van de gecombineerde nomenclatuur voor
    Ullucus tuberosus en tot wijziging van Uitvoeringsverordening (EU) 2020/1213 wat
    betreft de fytosanitaire maatregelen voor het binnenbrengen van die voor opplant
    bestemde planten op het grondgebied van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/419 z dnia 9 marca 2021 r.
    zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin przeznaczonych do sadzenia gatunku Jasminum polyanthum Franchet pochodzących
    z Izraela i dostosowujące kody Nomenklatury scalonej gatunku Ullucus tuberosus
    oraz zmieniające rozporządzenie wykonawcze (UE) 2020/1213 w odniesieniu do środków
    fitosanitarnych do celów wprowadzania tych roślin przeznaczonych do sadzenia
    na terytorium Unii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/419 da Comissão de 9 de março de
    2021 que altera o Regulamento de Execução (UE) 2018/2019 no que diz respeito
    a certos vegetais para plantação de Jasminum polyanthum Franchet originários
    de Israel e que adapta os códigos da Nomenclatura Combinada para Ullucus tuberosus
    e que altera o Regulamento de Execução (UE) 2020/1213 no que se refere às medidas
    fitossanitárias para a introdução desses vegetais para plantação no território
    da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/419 al Comisiei din 9 martie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante aparținând speciei Jasminum polyanthum Franchet
    destinate plantării, originare din Israel, de adaptare a codurilor din Nomenclatura
    combinată pentru Ullucus tuberosus și de modificare a Regulamentului de punere
    în aplicare (UE) 2020/1213 în ceea ce privește măsurile fitosanitare pentru
    introducerea acestor plante destinate plantării pe teritoriul Uniunii
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/419 z 9. marca 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    na výsadbu druhu Jasminum polyanthum Franchet s pôvodom v Izraeli, ktorým sa
    upravujú číselné znaky kombinovanej nomenklatúry pre rastliny druhu Ullucus
    tuberosus a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1213, pokiaľ
    ide o rastlinolekárske opatrenia v súvislosti so vstupom uvedených rastlín
    na výsadbu na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/419 z dne 9. marca 2021 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Jasminum polyanthum
    Franchet s poreklom iz Izraela in prilagoditvi oznak kombinirane nomenklature
    za Ullucus tuberosus ter spremembi Izvedbene uredbe (EU) 2020/1213 glede fitosanitarnih
    ukrepov za vnos navedenih rastlin za saditev na ozemlje Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/419 de la Comisión de 9 de marzo de
    2021 por el que se modifica el Reglamento de Ejecución (UE) 2018/2019 en lo que
    respecta a determinados vegetales para plantación de Jasminum polyanthum Franchet
    originarios de Israel, se adaptan los códigos de la nomenclatura combinada de
    Ullucus tuberosus y se modifica el Reglamento de Ejecución (UE) 2020/1213 en
    lo que respecta a las medidas fitosanitarias para la introducción de dichos vegetales
    para plantación en el territorio de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/419 av den 9 mars 2021
    om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa växter
    för plantering av Jasminum polyanthum Franchet med ursprung i Israel, om anpassning
    av KN-nummer för Ullucus tuberosus samt om ändring av genomförandeförordning
    (EU) 2020/1213 vad gäller växtskyddsåtgärder för införsel av dessa växter
    för plantering till unionens territorium
