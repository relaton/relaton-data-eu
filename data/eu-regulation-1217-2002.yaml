    un veiktu konkrētus testus atbilstīgi Padomes Regulai (EEK) Nr. 793/93
  type: main
- language: lt
  script: Latn
  content: 2002 m. liepos 5 d. Komisijos reglamentas (EB) Nr. 1217/2002, reikalaujantis
