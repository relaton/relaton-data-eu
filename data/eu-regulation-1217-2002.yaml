title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1217/2002 of 5 July 2002 requiring importers
    or manufacturers of certain Einecs substances to supply certain information and
    perform certain tests pursuant to Council Regulation (EEC) No 793/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1217/2002 de la Commission du 5 juillet 2002 demandant
    aux importateurs ou aux fabricants de certaines substances figurant dans l'Einecs
    de fournir certaines informations et de réaliser certains essais, conformément
    au règlement (CEE) n° 793/93 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1217/2002 der Kommission vom 5. Juli 2002 zur Verpflichtung
    der Importeure und Hersteller bestimmter EINECS-Stoffe zur Vorlage bestimmter
    Informationen und Durchführung bestimmter Prüfungen gemäß der Verordnung (EWG)
    Nr. 793/93 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1217/2002 на Комисията от 5
    юли 2002 година относно изискването вносителите
    или производителите на някои Einecs вещества
    да предоставят определена информация и да
    проведат определени изпитвания съгласно Регламент
    (ЕИО) № 793/93 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1217/2002 ze dne 5. července 2002 ukládající
    dovozcům nebo výrobcům některých látek Einecs povinnost předkládat některé
    informace a provádět některé zkoušky na základě nařízení Rady (EHS)
    č. 793/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1217/2002 af 5. juli 2002 om, at importører
    og producenter af visse Einecs-stoffer pålægges at forelægge bestemte oplysninger
    og gennemføre bestemte undersøgelser i medfør af Rådets forordning (EØF)
    nr. 793/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1217/2002 της Επιτροπής,
    της 5ης Ιουλίου 2002, με τον οποίο απαιτείται
    από τους εισαγωγείς ή τους παρασκευαστές ορισμένων
    ουσιών του EINECS να υποβάλουν ορισμένες πληροφορίες
    και να διενεργούν ορισμένες δοκιμές σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 793/93 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1217/2002, 5. juuli 2002, millega vastavalt
    nõukogu määrusele (EMÜ) nr 793/93 kehtestatakse teatavate EINECSisse kantud
    ainete importijatele ja tootjatele teatava teabe andmise ja teatavate katsetuste
    nõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1217/2002, annettu 5 päivänä heinäkuuta 2002,
    tiettyjen Einecsiin sisältyvien aineiden maahantuojien tai valmistajien velvoittamisesta
    toimittamaan tiettyjä tietoja ja suorittamaan tiettyjä kokeita neuvoston asetuksen
    (ETY) N:o 793/93 mukaisesti
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1217/2002 od 5. srpnja 2002. o zahtjevima za uvoznike
