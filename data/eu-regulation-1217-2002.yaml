    određena ispitivanja u skladu s Uredbom Vijeća (EEZ) br. 793/93
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1217/2002/EK rendelete (2002. július 5.) az egyes Einecs-anyagok
    importőreivel és gyártóival szemben a 793/93/EGK tanácsi rendelet értelmében
    fennálló, egyes adatok nyújtására és egyes vizsgálatok elvégzésére vonatkozó
    követelményekről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1217/2002 della Commissione, del 5 luglio 2002, che
    impone agli importatori e ai fabbricanti di alcune sostanze contenute nell'elenco
