    informaciją ir daryti tam tikrus bandymus pagal Tarybos reglamentą (EEB) Nr.
    793/93
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1217/2002 tal-5 ta’ Lulju 2002
    li jirrikjedi li l-importaturi u l-manifatturi ta’ ċerti sustanzi Einecs jagħtu
    ċerta informazzjoni u jwettqu ċerti testijiet skond ir-Regolament tal-Kunsill
    (KEE) Nru 793/93
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1217/2002 van de Commissie van 5 juli 2002 waarbĳ
    van de importeurs of fabrikanten van bepaalde Einecs-stoffen wordt verlangd dat
    zĳ overeenkomstig Verordening (EEG) nr. 793/93 van de Raad bepaalde informatie
    verstrekken en bepaalde onderzoeken uitvoeren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1217/2002 z dnia 5 lipca 2002 r. wymagające
    od importerów i producentów niektórych substancji EINECS dostarczenia określonych
    informacji i wykonania określonych badań na podstawie rozporządzenia Rady (EWG)
    nr 793/93
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1217/2002 da Comissão, de 5 de Julho de 2002, que
    obriga os importadores e fabricantes de certas substâncias listadas no EINECS
    a facultar determinadas informações e efectuar determinados ensaios nos termos
    do Regulamento (CEE) n.° 793/93 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1217/2002 al Comisiei din 5 iulie 2002 de obligare
    a importatorilor sau a producătorilor de anumite substanțe EINECS să furnizeze
    anumite informații și să efectueze anumite testări în temeiul Regulamentului
    (CEE) nr. 793/93 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1217/2000 z 5. júla 2002 vyžadujúce od dovozcov
    alebo výrobcov určitých látok zaradených v zozname EINECS, aby poskytovali
    určité informácie a vykonávali určité testy podľa nariadenia Rady (EHS)
    č. 793/93
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1217/2002 z dne 5. julija 2002 o zahtevi, da
    uvozniki ali proizvajalci nekaterih snovi Einecs predložijo nekatere informacije
    in izvedejo nekatere preskuse na podlagi Uredbe Sveta (EGS) št. 793/93
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1217/2002 de la Comisión, de 5 de julio de 2002, por
    el que se obliga a los importadores y a los fabricantes de determinadas sustancias
    que figuran en el EINECS a que faciliten diversas informaciones y realicen una
    serie de ensayos, en aplicación de lo dispuesto en el Reglamento (CEE) n° 793/93
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1217/2002 av den 5 juli 2002 om att importörer
    och tillverkare av vissa EINECS-ämnen skall åläggas att lämna vissa uppgifter
    och genomföra vissa undersökningar i enlighet med rådets förordning (EEG)
    nr 793/93
