    (CE) nr. 798/2008, (CE) nr. 1251/2008, (CE) nr. 119/2009, (UE) nr. 206/2010, (UE)
    nr. 605/2010, (UE) nr. 142/2011, (UE) nr. 28/2012 ale Comisiei, a Regulamentului
    de punere în aplicare (UE) 2016/759 al Comisiei și a Deciziei 2007/777/CE a
    Comisiei
