  script: Latn
  content: Règlement Délégué (UE) 2019/2124 de la Commission du 10 octobre 2019
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne les règles applicables aux contrôles officiels des envois d’animaux
    et de biens en transit, en transbordement et faisant l’objet d’une poursuite
    du transport par l’Union, et modifiant les règlements (CE) no 798/2008, (CE)
    no 1251/2008, (CE) no 119/2009, (UE) no 206/2010, (UE) no 605/2010, (UE) no 142/2011
    et (UE) no 28/2012 de la Commission, le règlement d’exécution (UE) 2016/759
    de la Commission ainsi que la décision 2007/777/CE de la Commission
  type: main
