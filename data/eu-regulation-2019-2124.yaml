    o pravidlá pre úradné kontroly zásielok zvierat a tovaru v tranzite, zásielok
    určených na prekládku alebo na ďalšiu prepravu cez Úniu a ktorým sa menia
    nariadenia Komisie (ES) č. 798/2008, (ES) č. 1251/2008, (ES) č. 119/2009, (EÚ)
    č. 206/2010, (EÚ) č. 605/2010, (EÚ) č. 142/2011, (EÚ) č. 28/2012, vykonávacie
    nariadenie Komisie (EÚ) 2016/759 a rozhodnutie Komisie 2007/777/ES
  type: main
