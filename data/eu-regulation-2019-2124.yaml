    de la Comisión y la Decisión 2007/777/CE de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens Delegerade Förordning (EU) 2019/2124 av den 10 oktober 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller bestämmelser för offentlig kontroll av sändningar av djur och varor
