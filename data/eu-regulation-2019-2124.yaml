  content: Commission Delegated Regulation (EU) 2019/2124 of 10 October 2019 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council as regards
    rules for official controls of consignments of animals and goods in transit, transhipment
    and onward transportation through the Union, and amending Commission Regulations
    (EC) No 798/2008, (EC) No 1251/2008, (EC) No 119/2009, (EU) No 206/2010, (EU)
    No 605/2010, (EU) No 142/2011, (EU) No 28/2012, Commission Implementing Regulation
