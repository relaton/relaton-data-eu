  script: Latn
  content: Reglamento Delegado (UE) 2019/2124 de la Comisión de 10 de octubre de
    2019 por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo, en cuanto a las normas para los controles oficiales de partidas
    de animales y mercancías objeto de tránsito, transbordo y transporte ulterior
    por la Unión y por el que se modifican los Reglamentos (CE) n.o 798/2008, (CE)
    n.o 1251/2008, (CE) n.o 119/2009, (UE) n.o 206/2010, (UE) n.o 605/2010, (UE) n.o
