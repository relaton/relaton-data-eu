    pošiljk živali in blaga, ki so v tranzitu, se prenašajo ali nadalje prevažajo
    skozi Unijo, ter o spremembi uredb Komisije (ES) št. 798/2008, (ES) št. 1251/2008,
    (ES) št. 119/2009, (EU) št. 206/2010, (EU) št. 605/2010, (EU) št. 142/2011
