    wywołanych przez silniki z zapłonem iskrowym stosowane w kołowych ciągnikach
    rolniczych lub leśnych
  type: main
- language: pt
  script: Latn
  content: Directiva 75/322/CEE do Conselho, de 20 de Maio de 1975, relativa à aproximação
    das legislações dos Estados- Membros respeitantes à supressão das interferências
    radioeléctricas produzidas por motores de ignição comandada que equipam os
    tractores agrícolas ou florestais de rodas
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 20 mai 1975 de apropiere a legislațiilor statelor
    membre cu privire la suprimarea paraziților radioelectrici produși de motoarele
    cu aprindere prin scânteie cu care sunt echipate tractoarele agricole sau forestiere
    pe roți
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 20. mája 1975 o aproximácii právnych predpisov členských
