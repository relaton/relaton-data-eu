- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 83/2011 of 31 January 2011 implementing
    Article 2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism
    and repealing Implementing Regulation (EU) No 610/2010
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 83/2011 du Conseil du 31 janvier 2011
