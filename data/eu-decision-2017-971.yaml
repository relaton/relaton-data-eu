---
id: EUDecision2017971
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2017/971 of 8 June 2017 determining the planning
    and conduct arrangements for EU non-executive military CSDP missions and amending
    Decisions 2010/96/CFSP on a European Union military mission to contribute to the
    training of Somali security forces, 2013/34/CFSP on a European Union military
    mission to contribute to the training of the Malian armed forces (EUTM Mali) and
    (CFSP) 2016/610 on a European Union CSDP military training mission in the Central
    African Republic (EUTM RCA)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/971 du Conseil du 8 juin 2017 déterminant les modalités
    de planification et de conduite des missions militaires à mandat non exécutif
    menées par l'Union européenne dans le cadre de la PSDC et modifiant la décision
    2010/96/PESC relative à une mission militaire de l'Union européenne visant à
    contribuer à la formation des forces de sécurité somaliennes, la décision
    2013/34/PESC relative à une mission militaire de l'Union européenne visant à
    contribuer à la formation des forces armées maliennes (EUTM Mali) et la décision
    (PESC) 2016/610 relative à une mission militaire de formation PSDC de l'Union
    européenne en République centrafricaine (EUTM RCA)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/971 des Rates vom 8. Juni 2017 zur Festlegung der Planungs-
    und Durchführungsmodalitäten für militärische GSVP-Missionen der EU ohne Exekutivbefugnisse
    und zur Änderung des Beschlusses 2010/96/GASP über eine Militärmission der
    Europäischen Union als Beitrag zur Ausbildung somalischer Sicherheitskräfte,
    des Beschlusses 2013/34/GASP über eine Militärmission der Europäischen Union
    als Beitrag zur Ausbildung der malischen Streitkräfte (EUTM Mali) und des Beschlusses
    (GASP) 2016/610 über eine militärische Ausbildungsmission im Rahmen der GSVP
    der Europäischen Union in der Zentralafrikanischen Republik (EUTM RCA)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2017/971 на Съвета от 8 юни 2017 година
    за определяне на реда и условията за планиране
    и провеждане на военни мисии на ЕС по линия
    на ОПСО без изпълнителни правомощия и за изменение
    на решения 2010/96/ОВППС за военна мисия на Европейския
    съюз в подкрепа на обучението на Сомалийските
    сили за сигурност, 2013/34/ОВППС за военна мисия
    на Европейския съюз в подкрепа на обучението
    на въоръжените сили на Мали (EUTM Mали) и (ОВППС)
    2016/610 за военна мисия на Европейския съюз по
    линия на ОПСО за обучение в Централноафриканската
    република (EUTM RCA)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2017/971 ze dne 8. června 2017, kterým se stanoví
    postupy plánování a vedení vojenských misí EU SBOP bez výkonných pravomocí
    a mění rozhodnutí 2010/96/SZBP o vojenské misi Evropské unie s cílem přispět
    k výcviku somálských bezpečnostních sil, rozhodnutí 2013/34/SZBP o vojenské
    misi Evropské unie s cílem přispět k výcviku malijských ozbrojených sil
    (EUTM Mali) a rozhodnutí (SZBP) 2016/610 o vojenské výcvikové misi Evropské
    unie SBOP ve Středoafrické republice (EUTM RCA)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2017/971 af 8. juni 2017 om fastlæggelse af ordningerne
    for planlægning og gennemførelse af EU's FSFP-militærmissioner uden udøvende
    beføjelser og om ændring af afgørelse 2010/96/FUSP om Den Europæiske Unions
    militærmission for at bidrage til uddannelsen af somaliske sikkerhedsstyrker,
    2013/34/FUSP om Den Europæiske Unions militærmission for at bidrage til uddannelsen
    af Malis væbnede styrker (EUTM Mali) og (FUSP) 2016/610 om Den Europæiske Unions
    militære FSFP-uddannelsesmission i Den Centralafrikanske Republik (EUTM RCA)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2017/971 του Συμβουλίου, της 8ης
    Ιουνίου 2017, σχετικά με τον καθορισμό ρυθμίσεων
    για τον σχεδιασμό και τη διεξαγωγή μη εκτελεστικών
    στρατιωτικών αποστολών ΚΠΑΑ της ΕΕ και την
    τροποποίηση των αποφάσεων 2010/96/ΚΕΠΠΑ για μια
    στρατιωτική αποστολή της Ευρωπαϊκής Ένωσης
    που θα συμβάλει στην εκπαίδευση των σομαλικών
    δυνάμεων ασφαλείας, 2013/34/ΚΕΠΠΑ για στρατιωτική
    αποστολή της Ευρωπαϊκής Ένωσης που θα συμβάλει
    στην εκπαίδευση των ενόπλων δυνάμεων του Μάλι
    (EUTM Mali) και (ΚΕΠΠΑ) 2016/610 σχετικά με στρατιωτική
    εκπαιδευτική αποστολή της Ευρωπαϊκής Ένωσης
    στην Κεντροαφρικανική Δημοκρατία ΚΠΠΑ (EUTM
    RCA)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2017/971, 8. juuni 2017, millega kehtestatakse ELi
    täitevvolitusteta sõjaliste ÜJKP missioonide plaanimise ja juhtimise kord ning
    muudetakse otsust 2010/96/ÜVJP Somaalia julgeolekujõudude väljaõppe toetamiseks
    läbi viidava Euroopa Liidu sõjalise missiooni kohta, otsust 2013/34/ÜVJP, mis
    käsitleb Mali relvajõudude väljaõppe toetamiseks läbiviidavat Euroopa Liidu
    sõjalist missiooni (EUTM Mali), ja otsust (ÜVJP) 2016/610 Euroopa Liidu ÜJKP
    sõjalise väljaõppemissiooni kohta Kesk-Aafrika Vabariigis (EUTM RCA)
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2017/971, annettu 8 päivänä kesäkuuta 2017,
    suoraa täytäntöönpanoa sisältämättömien EU:n YTPP-alan sotilasoperaatioiden
    suunnittelu- ja toteutusjärjestelyjen määrittämisestä sekä Somalian turvallisuusjoukkojen
    kouluttamiseen osallistumista koskevasta Euroopan unionin sotilasoperaatiosta
    annetun päätöksen 2010/96/YUTP, Malin asevoimien kouluttamiseen osallistumista
    koskevasta Euroopan unionin sotilasoperaatiosta, EUTM Mali, annetun päätöksen
    2013/34/YUTP ja Keski-Afrikan tasavallassa toteutettavasta Euroopan unionin YTPP-sotilaskoulutusoperaatiosta
    (EUTM RCA) annetun päätöksen (YUTP) 2016/610 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2017/971 od 8. lipnja 2017. o određivanju aranžmana
    za planiranje i provođenje neizvršnih vojnih misija ZSOP-a EU-a i o izmjeni
    odluka 2010/96/ZVSP o vojnoj misiji Europske unije za doprinos osposobljavanju
    somalijskih snaga sigurnosti, 2013/34/ZVSP o vojnoj misiji Europske unije za doprinos
    osposobljavanju oružanih snaga Malija (EUTM Mali) i (ZVSP) 2016/610 o misiji
    ZSOP-a Europske unije za vojno osposobljavanje u Srednjoafričkoj Republici (EUTM
    RCA)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2017/971 határozata (2017. június 8.) a nem végrehajtási
    jellegű uniós katonai KBVP-missziókra vonatkozó tervezési és végrehajtási
    szabályok meghatározásáról, valamint az Európai Uniónak a szomáliai biztonsági
    erők kiképzéséhez hozzájáruló katonai missziójáról szóló 2010/96/KKBP
    határozat, az Európai Uniónak a mali fegyveres erők kiképzéséhez hozzájáruló
    katonai missziójáról (EUTM Mali) szóló 2013/34/KKBP határozat, és az Európai
    Unió közép-afrikai köztársasági katonai kiképzési KBVP-missziójáról
    (EUTM RCA) szóló (KKBP) 2016/610 határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2017/971 del Consiglio, dell'8 giugno 2017, che stabilisce
    le modalità di pianificazione e condotta concernenti le missioni militari senza
    compiti esecutivi dell'UE in ambito PSDC e che modifica la decisione 2010/96/PESC
    relativa alla missione militare dell'Unione europea volta a contribuire alla formazione
    delle forze di sicurezza somale, la decisione 2013/34/PESC relativa a una missione
    militare dell'Unione europea volta a contribuire alla formazione delle forze armate
    maliane (EUTM Mali) e la decisione (PESC) 2016/610 relativa a una missione militare
    di formazione dell'Unione europea in ambito PSDC nella Repubblica centrafricana
    (EUTM RCA)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2017/971 (2017. gada 8. jūnijs), ar ko nosaka pasākumus
    attiecībā uz ES KDAP militāro misiju bez izpildes pilnvarām plānošanu un
    īstenošanu un ar ko groza Lēmumus 2010/96/KĀDP par Eiropas Savienības militāro
    misiju, lai palīdzētu Somālijas drošības spēku apmācībā, 2013/34/KĀDP
    par Eiropas Savienības militāro misiju, lai palīdzētu Mali bruņoto spēku
    apmācībā (EUTM Mali), un (KĀDP) 2016/610 par Eiropas Savienības KDAP militāru
    apmācības misiju Centrālāfrikas Republikā (EUTM RCA)
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 8 d. Tarybos sprendimas (ES) 2017/971, kuriuo nustatoma
    vykdymo įgaliojimų neturinčių ES karinių BSGP misijų planavimo ir vykdymo
    tvarka ir iš dalies keičiami sprendimai 2010/96/BUSP dėl Europos Sąjungos
    karinės misijos siekiant prisidėti prie Somalio saugumo pajėgų mokymo, 2013/34/BUSP
    dėl Europos Sąjungos karinės misijos siekiant prisidėti prie Malio ginkluotųjų
    pajėgų mokymo (EUTM Mali) ir (BUSP) 2016/610 dėl Europos Sąjungos BSGP karinės
    mokymo misijos Centrinės Afrikos Respublikoje (EUTM RCA)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2017/971 tat-8 ta' Ġunju 2017 li tiddetermina
    l-arranġamenti għall-ippjanar u t-tmexxija tal-missjonijiet militari mhux eżekuttivi
    tal-UE fil-qafas tal-PSDK missjonijiet u li temenda d-Deċiżjonijiet 2010/96/PESK
    dwar missjoni militari tal-Unjoni Ewropea biex tikkontribwixxi għat-taħriġ
    tal-Forzi tas-Sigurtà tas-Somalja, 2013/34/PESK dwar missjoni militari tal-Unjoni
    Ewropea biex tikkontribwixxi għat-taħriġ tal-Forzi Armati tal-Mali (EUTM Mali)
    u (PESK) 2016/610 dwar Missjoni ta' taħriġ militari tal-PSDK tal-Unjoni Ewropea
    fir-Repubblika Ċentru-Afrikana (EUTM RCA)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2017/971 van de Raad van 8 juni 2017 tot bepaling van de plannings-
    en uitvoeringsregelingen voor niet-uitvoerende militaire GVDB-missies van de EU
    en tot wijziging van Besluit 2010/96/GBVB betreffende een militaire missie van
    de Europese Unie om de Somalische veiligheidstroepen te helpen opleiden, Besluit
    2013/34/GBVB betreffende een militaire missie van de Europese Unie om de Malinese
    strijdkrachten te helpen opleiden (EUTM Mali) en Besluit (GBVB) 2016/610 betreffende
    een militaire GVDB-opleidingsmissie van de Europese Unie in de Centraal-Afrikaanse
    Republiek (EUTM RCA)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2017/971 z dnia 8 czerwca 2017 r. określająca uzgodnienia
    dotyczące planowania i prowadzenia misji wojskowych UE w dziedzinie WPBIO bez
    mandatu wykonawczego oraz zmieniająca decyzje 2010/96/WPZIB w sprawie misji wojskowej
    Unii Europejskiej mającej na celu przyczynienie się do szkolenia somalijskich
    sił bezpieczeństwa, 2013/34/WPZiB w sprawie misji wojskowej Unii Europejskiej
    mającej na celu przyczynienie się do szkolenia malijskich sił zbrojnych (EUTM
    Mali) i (WPZiB) 2016/610 w sprawie szkoleniowej misji wojskowej Unii Europejskiej
    w dziedzinie WPBiO w Republice Środkowoafrykańskiej (EUTM RCA)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2017/971 do Conselho, de 8 de junho de 2017, que determina
    as disposições em matéria de planeamento e de condução das missões militares
    não executivas da PCSD da UE e que altera as Decisões 2010/96/PESC relativa
    a uma missão militar da União Europeia que tem em vista contribuir para a formação
    das Forças de Segurança da Somália, 2013/34/PESC relativa a uma missão militar
    da União Europeia que tem em vista contribuir para a formação das Forças Armadas
    do Mali (EUTM Mali) e (PESC) 2016/610 relativa a uma Missão PCSD de Formação
    Militar da União Europeia na República Centro-Africana (EUTM RCA)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2017/971 a Consiliului din 8 iunie 2017 de stabilire a modalităților
    de planificare și conducere pentru misiunile PSAC militare neexecutive ale UE
    și de modificare a Deciziilor 2010/96/PESC privind o misiune militară a Uniunii
    Europene pentru a contribui la instruirea forțelor de securitate somaleze, 2013/34/PESC
    privind o misiune militară a Uniunii Europene pentru a contribui la instruirea
    forțelor armate maliene (EUTM Mali) și (PESC) 2016/610 privind o misiune PSAC
    de instruire militară a Uniunii Europene în Republica Centrafricană (EUTM RCA)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2017/971 z 8. júna 2017, ktorým sa stanovujú
    opatrenia v oblasti plánovania a vedenia nevýkonných vojenských misií EÚ
    v rámci SBOP a ktorým sa mení rozhodnutie 2010/96/SZBP o vojenskej misii Európskej
    únie na podporu výcviku bezpečnostných síl Somálska, rozhodnutie 2013/34/SZBP
    o vojenskej misii Európskej únie na podporu výcviku ozbrojených síl Mali
    (EUTM Mali) a rozhodnutie (SZBP) 2016/610 o vojenskej výcvikovej misii Európskej
    únie v rámci SBOP v Stredoafrickej republike (EUTM RCA)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2017/971 z dne 8. junija 2017 o ureditvah za načrtovanje
    in izvajanje vojaških misij EU, v okviru SVOP, brez izvršilnih pooblastil ter
    o spremembi sklepov 2010/96/SZVP o vojaški misiji Evropske unije, ki prispeva
    k usposabljanju somalskih varnostnih sil, 2013/34/SZVP o vojaški misiji Evropske
    unije, ki prispeva k usposabljanju malijskih oboroženih sil (EUTM Mali) in (SZVP)
    2016/610 o misiji Evropske unije za vojaško usposabljanje v okviru SVOP v Srednjeafriški
    republiki (EUTM RCA)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2017/971 del Consejo, de 8 de junio de 2017, por la que
    se determinan las disposiciones de planificación y ejecución de misiones militares
    no ejecutivas PCSD de la UE y por la que se modifican la Decisión 2010/96/PESC
    relativa a una misión militar de la Unión Europea destinada a contribuir a la
    formación de las fuerzas de seguridad somalíes, la Decisión 2013/34/PESC relativa
    a una misión militar de la Unión Europea destinada a contribuir a la formación
    de las fuerzas armadas de Mali (EUTM Mali) y la Decisión (PESC) 2016/610 relativa
    a una Misión de Asesoramiento Militar PCSD de la Unión Europea en la República
    Centroafricana (EUTM RCA)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2017/971 av den 8 juni 2017 om fastställande av planerings-
    och ledningsarrangemangen för EU:s icke-verkställande militära GSFP-uppdrag
    och om ändring av besluten 2010/96/Gusp om Europeiska unionens militära uppdrag
    i syfte att bidra till utbildning av somaliska säkerhetsstyrkor, 2013/34/Gusp
    om Europeiska unionens militära uppdrag i syfte att bidra till utbildning av
    den maliska försvarsmakten (EUTM Mali) och (Gusp) 2016/610 om Europeiska unionens
    militära GSFP-utbildningsuppdrag i Centralafrikanska republiken (EUTM RCA)
