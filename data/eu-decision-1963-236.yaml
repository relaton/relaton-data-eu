  content: Décision de la Commission en date du 14 mars 1963 au bénéfice du Royaume
    des Pays-Bas portant octroi d'un contingent tarifaire pour le thé, autre que
    présenté en emballages immédiats d'un contenu net de 3 kg ou moins
  type: main
- language: de
  script: Latn
  content: '63/236/EWG: Entscheidung der Kommission über die Gewährung eines Zollkontingents
    an das Königreich der Niederlande für Tee, anderer als in unmittelbaren Umschließungen,
    mit einem Gewicht des Inhalts von 3 kg oder weniger'
  type: main
- language: it
  script: Latn
  content: '63/236/CEE: Decisione della Commissione relativa alla concessione di un
    contingente tariffario al Regno dei Paesi Bassi per il tè, diverso da quello
    presentato in recipienti od involucri immediati, di contenuto netto di 3 kg o
    meno'
  type: main
- language: nl
  script: Latn
  content: '63/236/EEG: Beschikking van de Commissie houdende toekenning van een tariefcontingent
    voor thee, andere dan in verpakkingen met een netto-inhoud per onmiddellijke verpakking
    van 3 kg of minder, aan het Koninkrijk der Nederlanden'
