    og den finansielle deltagelse, der er omhandlet i aftalen mellem Det Europæiske
    Økonomiske Fællesskab og regeringen for Den Demokratiske Republik Madagaskar
    om fiskeri ud for Madagaskar, for perioden fra 21. maj 1989 til 20. maj 1992 (89/485/EØF)
    #'
