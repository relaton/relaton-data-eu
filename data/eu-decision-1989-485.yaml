title:
- language: en
  script: Latn
  content: '89/485/EEC: Council Decision of 28 July 1989 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol defining, for the period 21 May 1989 to 20 May 1992, the fishing
    opportunities and the financial contribution provided for by the Agreement between
    the European Economic Community and the Government of the Democratic Republic
    of Madagascar on fishing off Madagascar'
  type: main
- language: fr
  script: Latn
  content: '89/485/CEE: Décision du Conseil du 28 juillet 1989 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la participation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République démocratique de Madagascar concernant la pêche au large de
    Madagascar pour la période du 21 mai 1989 au 20 mai 1992'
  type: main
- language: de
  script: Latn
