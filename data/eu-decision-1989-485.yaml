    Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Demokratischen Republik Madagaskar über die Fischerei vor der Küste Madagaskars
    für die Zeit vom 21. Mai 1989 bis 20. Mai 1992 (89/485/EWG) #'
  type: main
