title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1334/82 of 28 May 1982 accepting an undertaking
    offered in connection with the anti-dumping procedure concerning certain welded
    steel tubes originating in Romania, terminating that procedure and cancelling
    the provisional anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1334/82 de la Commission, du 28 mai 1982, portant
    acceptation d'un engagement dans le cadre de la procédure antidumping concernant
    certains tubes en fer ou en acier, soudés, originaires de Roumanie, clôture
    de la procédure et abrogation du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1334/82 der Kommission vom 28. Mai 1982 über die
    Annahme einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend bestimmte
    geschweißte Rohre aus Stahl mit Ursprung in Rumänien, die Einstellung des Verfahrens
    und die Aufhebung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1334/82 af 28. maj 1982 om godtagelse
