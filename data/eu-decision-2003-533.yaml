  script: Latn
  content: '2003/533/EC: Commission Decision of 17 July 2003 amending Decision 98/371/EC
    concerning the animal health conditions and veterinary certifications for import
    of fresh meat from certain European countries to take into account some aspects
    in relation with Estonia and Lithuania (Text with EEA relevance) (notified under
    document number C(2003) 2561)'
  type: main
- language: fr
  script: Latn
  content: '2003/533/CE: Décision de la Commission du 17 juillet 2003 modifiant la
