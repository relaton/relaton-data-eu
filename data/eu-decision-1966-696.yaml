title:
- language: fr
  script: Latn
  content: Décision 66/696/CEE de la Commission du 4 novembre 1966, autorisant la
    République française, en vertu de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire les appareils d'enregistrement et de reproduction
    du son et les appareils mixtes, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/696/EWG: Entscheidung der Kommission vom 4. November 1966, mit der
    die Französische Republik gemäß Artikel 115 Absatz (1) des Vertrages ermächtigt
    wird, aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Tonaufnahme- und Tonwiedergabegeräte und kombinierte Geräte von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/696/CEE: Decisione della Commissione, del 4 novembre 1966, che autorizza
    la Repubblica francese, a norma dell''articolo 115, primo comma, del Trattato,
    ad escludere dal trattamento comunitario gli apparecchi di registrazione e riproduzione
    del suono e gli apparecchi misti, originari del Giappone ed immessi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/696/EEG: Beschikking van de Commissie van 4 november 1966 houdende
    machtiging van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag toestellen voor het opnemen of weergeven van geluid en gecombineerde
    opname- en weergavetoestellen, die van oorsprong zijn uit Japan en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
