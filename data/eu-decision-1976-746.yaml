---
id: EUDecision1976746
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 July 1976 authorizing the French Republic not
    to apply Community treatment to knives with cutting blades, serrated or not, including
    pruning knives (save for knives with handles of ivory or of gilt- or silver-plated
    base metals), falling within heading No ex 82.09 of the Common Customs Tariff,
    originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/746/CEE: Décision de la Commission, du 19 juillet 1976, autorisant
    la République française à exclure du traitement communautaire les couteaux
    à lame tranchante ou dentelée, y compris les serpettes fermantes (à l''exception
    des couteaux à manche en ivoire ou en métaux communs dorés ou argentés) de
    la position Ex 82.09 du Tarif douanier commun, originaires du Japon et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Juli 1976, mit der die Französische
    Republik ermächtigt wird, die aus Japan stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Messer mit schneidender oder gezahnter Klinge,
    einschließlich Klappmesser für den Gartenbau (mit Ausnahme der Messer mit Griffen
    aus Elfenbein oder unedlen Metallen, vergoldet oder versilbert), der Tarifnummer
    ex 82.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. juli 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage knive med skærende eller savtakket
    æg, herunder beskæreknive (med undtagelse af knive med skaft af elfenben eller
    af forgyldt eller forsølvet uædelt metal), som henhører under pos. ex. 82.09
    i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 luglio 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i coltelli a lama trinciante
    o dentata, compresi i roncoli chiudibili (esclusi i coltelli con manico d'avorio
    o di metalli comuni dorati o argentati) della voce ex 82.09 della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 juli 1976 waarbij de Franse Republiek
    wordt gemachtigd messen, ook indien getand, zaksnoeimessen daaronder begrepen
    (met uitzondering van messen met heft van ivoor of van verguld of verzilverd onedel
    metaal), van post ex 82.09 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
