  content: Règlement (CEE) n 1639/71 de la Commission, du 28 juillet 1971, déterminant
    les montants des éléments mobiles rectifiés applicables, à compter du 1er
    août 1971, à l'importation dans la Communauté de certaines marchandises relevant
    du règlement (CEE) n 1059/69 du Conseil fabriquées à partir de riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1639/71 der Kommission vom 28. Juli 1971 zur Festsetzung
    der Höhe der ab 1. August 1971 bei der Einfuhr der unter die Verordnung (EWG)
    Nr. 1059/69 des Rates fallenden, aus Reis hergestellten Waren anwendbaren Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1639/71 della Commissione, del 28 luglio 1971, che
    determina gli importi degli elementi mobili rettificati applicabili dal 1 agosto
    1971 all'importazione nella Comunità di talune merci fabbricate con riso alle
    quali si applica il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1639/71 van de Commissie van 28 juli 1971 tot vaststelling
    van de verbeterde variabele elementen welke met ingang van 1 augustus 1971 bij
    de invoer in de Gemeenschap van toepassing zijn op bepaalde onder Verordening
    (EEG) nr. 1059/69 van de Raad vallende goederen vervaardigd van rijst
