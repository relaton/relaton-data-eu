    da entidade garante para o trânsito
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2023/403 al Comisiei din 8 februarie
    2023 de modificare a Regulamentului de punere în aplicare (UE) 2015/2447 în
    ceea ce privește furnizarea de informații pentru declarațiile sumare de intrare
    și analiza de risc în scopuri de securitate și siguranță la intrarea mărfurilor
    și adăugarea Ucrainei pe lista țărilor care figurează în angajamentele garantului
    pentru tranzit
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2023/403 z 8. februára 2023, ktorým
