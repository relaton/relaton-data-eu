  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2023/403 de la Comisión de 8 de febrero
    de 2023 por el que se modifica el Reglamento de Ejecución (UE) 2015/2447 en lo
    que respecta al suministro de información para las declaraciones sumarias de
