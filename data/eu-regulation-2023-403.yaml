title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/403 of 8 February 2023 amending
    Implementing Regulation (EU) 2015/2447 as regards the provision of information
    for entry summary declarations and risk analysis for security and safety purposes
    at entry of goods, and adding Ukraine to the list of countries in the guarantor’s
    undertakings for transit
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/403 de la Commission du 8 février
    2023 modifiant le règlement d’exécution (UE) 2015/2447 en ce qui concerne
    la fourniture d’informations pour les déclarations sommaires d’entrée et
    l’analyse de risque à des fins de sécurité et de sûreté lors de l’entrée
    des marchandises, et ajoutant l’Ukraine à la liste des pays figurant dans les
    engagements de caution aux fins du transit
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/403 der Kommission vom 8. Februar 2023
    zur Änderung der Durchführungsverordnung (EU) 2015/2447 hinsichtlich der Bereitstellung
    von Informationen für summarische Eingangsanmeldungen und für die Risikoanalyse
    für die Zwecke der Sicherheit und der Gefahrenabwehr beim Eingang von Waren sowie
    zur Aufnahme der Ukraine in die Liste der Länder in der Verpflichtungserklärung
    des Bürgen für den Versand
  type: main
