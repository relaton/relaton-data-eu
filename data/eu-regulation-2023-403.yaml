  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/403 végrehajtási rendelete (2023. február 8.)
    az (EU) 2015/2447 végrehajtási rendeletnek a belépési gyűjtő árunyilatkozatokhoz
    és az áruk beléptetésekor végzett biztonsági és védelmi célú kockázatelemzéshez
    szükséges információk szolgáltatása, valamint Ukrajnának az árutovábbításhoz
    kapcsolódó kezesi kötelezettségvállalásban felsorolt országok közé való
    felvétele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/403 della Commissione dell'8 febbraio
    2023 che modifica il regolamento di esecuzione (UE) 2015/2447 per quanto riguarda
    la fornitura di informazioni relative alla dichiarazione sommaria di entrata e
    all’analisi dei rischi in materia di sicurezza all’entrata delle merci, e
    che aggiunge l’Ucraina all’elenco dei paesi figuranti negli impegni del garante
    ai fini del transito
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2023/403 (2023. gada 8. februāris),
    ar ko groza Īstenošanas regulu (ES) 2015/2447 attiecībā uz informācijas sniegšanu
    ievešanas kopsavilkuma deklarācijās, riska analīzi drošības un drošuma
    vajadzībām preču ievešanas brīdī un Ukrainas iekļaušanu to valstu sarakstā,
    kuras norādītas galvinieka saistību veidlapā tranzīta procedūrai
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2023/403 2023 m. vasario 8 d.
    kuriuo dėl informacijos, susijusios su įvežimo bendrosiomis deklaracijomis
    ir rizikos analize, atliekama saugumo ir saugos užtikrinimo tikslais, teikimo
    įvežant prekes iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2015/2447
    ir į tranzitui naudojamose garanto įsipareigojimo formose nurodytų šalių
    sąrašą įtraukiama Ukraina
  type: main
- language: mt
  script: Latn
