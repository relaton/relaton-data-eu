  script: Latn
  content: Verordnung (EWG) Nr. 2611/85 der Kommission vom 17. September 1985 zur
    Änderung der Verordnung (EWG) Nr. 1892/85 und zur Erhöhung der Dauerausschreibung
    zur Ausfuhr von im Besitz der italienischen Interventionsstelle befindlichem Hartweizen
    auf 250 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2611/85 af 17. september 1985 om ændring
