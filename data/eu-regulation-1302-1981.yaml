title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1302/81 of 12 May 1981 derogating from Regulation
    (EEC) No 456/80 for the 1980/81 wine year in respect of the date when applicants
    for an abandonment premium must have carried out grubbing of vines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1302/81 du Conseil, du 12 mai 1981, dérogeant, pour
    la campagne 1980/1981, au règlement (CEE) n° 456/80 en ce qui concerne la date
    avant laquelle doit être réalisé l' arrachage des vignes par le demandeur d'
    une prime d' abandon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1302/81 des Rates vom 12. Mai 1981 zur Abweichung
    von der Verordnung (EWG) Nr. 456/80 hinsichtlich des Zeitpunkts, vor dem im Wirtschaftsjahr
    1980/81 die Rodung der Reben durch den Antragsteller auf Aufgabeprämie erfolgt
    sein muß
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1302/81 af 12. maj 1981 om undtagelse for
    produktionsåret 1980/81 fra forordning (EØF) nr. 456/80 for så vidt angår
    den dato, inden hvilken vinarealer skal være ryddet af den, der ansøger om nedlæggelsespræmie
  type: main
- language: el
  script: Grek
