title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 235/2004 of 10 February 2004 amending Regulation
    (EC) No 2320/97 imposing definitive anti-dumping duties on imports of certain
    seamless pipes and tubes of iron or non-alloy steel originating in, inter alia,
    Romania in so far as it concerns imports into the European Community of products
    manufactured by Petrotub SA and Republica SA
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 235/2004 du Conseil du 10 février 2004 modifiant le
    règlement (CE) n° 2320/97 instituant des droits antidumping définitifs sur
    les importations de certains tubes et tuyaux sans soudure, en fer ou en acier
    non allié, originaires entre autres de Roumanie, en ce qui concerne les importations
    dans la Communauté européenne des produits fabriqués par Petrotub SA et Republica
    SA
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 235/2004 des Rates vom 10. Februar 2004 zur Änderung
    der Verordnung (EG) Nr. 2320/97 zur Einführung endgültiger Antidumpingzölle
    auf die Einfuhren bestimmter nahtloser Rohre aus Eisen oder nicht legiertem Stahl
    mit Ursprung unter anderem in Rumänien in Bezug auf die Einfuhren der von Petrotub
    SA und Republica SA hergestellten Waren in die Gemeinschaft
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 235/2004 ze dne 10. února 2004, kterým se mění
    nařízení (ES) č. 2320/97 o uložení konečného antidumpingového cla z dovozu
    některých bezešvých trubek a trubek ze železa a nelegované oceli pocházejících
    mimo jiné z Rumunska, pokud jde o dovoz výrobků vyráběných Petrotub SA a
    Republica SA do Evropského společenství
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 235/2004 af 10. februar 2004 om ændring af
    forordning (EF) nr. 2320/97 om indførelse af endelig antidumpingtold på importen
    af visse sømløse rør af jern eller ulegeret stål med oprindelse i bl.a. Rumænien,
    for så vidt angår importen til Det Europæiske Fællesskab af varer fremstillet
    af Petrotub SA og Republica SA
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 235/2004 του Συμβουλίου,
    της 10ης Φεβρουαρίου 2004, για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2320/97 για την επιβολή οριστικών
    δασμών αντιντάμπινγκ στις εισαγωγές ορισμένων
    σωλήνων χωρίς συγκόλληση από σίδηρο ή μη κραματοποιημένο
    χάλυβα καταγωγής, μεταξύ άλλων, Ρουμανίας,
    εφόσον πρόκειται για εισαγωγές στην Ευρωπαϊκή
    Κοινότητα προϊόντων που κατασκευάζονται από
    τις εταιρείες Petrotub SA και Republica SA
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 235/2004, 10. veebruar 2004, millega parandatakse
    määrust (EÜ) nr 2320/97 lõplike dumpinguvastased tollimaksude kehtestamise
    kohta teatud kindlate muu hulgas Rumeeniast pärinevate rauast või legeerimata
    terasest õmblusteta torude impordile selles osas, mis puudutab Petrotub SA ja
    Republica SA poolt valmistatud toodete importi ühendusse
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 235/2004, annettu 10 päivänä helmikuuta 2004,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen muun muassa Romaniasta
    peräisin olevien raudasta tai seostamattomasta teräksestä valmistettujen saumattomien
    putkien tuonnissa annetun asetuksen (EY) N:o 2320/97 muuttamisesta siltä osin
    kuin se koskee Petrotub SA:n ja Republica SA:n valmistamien tuotteiden tuontia
    Euroopan yhteisöön
  type: main
- language: hu
  script: Latn
  content: A Tanács 235/2004/EK rendelete (2004. február 10.) a többek között
    Romániából származó egyes varrat nélküli vas- és ötvözetlen acél csövek
    behozatalára vonatkozó végleges dömpingellenes vámok kivetéséről szóló
    2320/97/EK rendeletnek a Petrotub SA és Republica SA által gyártott termékek
    az Európai Közösségbe irányuló behozatalát érintő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 235/2004 del Consiglio, del 10 febbraio 2004, recante
    modifica del regolamento (CE) n. 2320/97 che istituisce dazi antidumping definitivi
    sulle importazioni di alcuni tipi di tubi senza saldatura, di ferro o di acciai
    non legati, originari, tra l'altro, della Romania, relativamente alla parte riguardante
    le importazioni nella Comunità europea dei prodotti fabbricati dalla Petrotub
    SA e dalla Repubblica SA
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 235/2004 (2004. gada 10. februāris), ar kuru groza
    Regulu (EK) Nr. 2320/97, ar ko cita starpā uzliek galīgos antidempinga maksājumus
    Rumānijas izcelsmes dzelzs vai neleģētā tērauda bezšuvju cauruļvadu un
    cauruļu importam, ciktāl tas attiecas uz Petrotub SA un Republica SA ražojumu
    importu Eiropas Kopienā
  type: main
- language: lt
  script: Latn
  content: 2004 m. vasario 10 d. Tarybos reglamentas (EB) Nr. 235/2004, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 2320/97 dėl importuojamų tam tikrų besiūlių
    vamzdžių iš geležies arba nelegiruoto plieno, kurių kilmės šalis, inter
    alia, yra Rumunija, apmokestinimo galutiniu antidempingo muitu, importuojant į
    Europos bendriją įmonėse Petrotub SA ir Republica SA pagamintus produktus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 235/2004 ta' l-10 ta' Frar 2004 li jemenda
    r-Regolament (KE) Nru. 2320/97 li jistabbilixxi dazji anti-dumping definittivi
    fuq importazzjoni ta' ċerti kanen u tubi, mingħajr saldatura, tal-ħadid jew
    ta' l-azzar mhux ligat li joriġinaw, fost affarijiet oħra, mir-Rumanija, relattivament
    għall-partijiet li jirrelataw ma' l-importazzjoni fil-Komunità Ewropea ta' prodotti
    fabbrikati mill-Petrotub SA u mir-Repubblika SA
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 235/2004 van de Raad van 10 februari 2004 tot wĳziging
    van Verordening (EG) nr. 2320/97 tot instelling van definitieve antidumpingrechten
    op bepaalde naadloze buizen en pĳpen van ĳzer of van niet-gelegeerd staal uit,
    onder andere, Roemenië, voorzover deze producten zĳn vervaardigd door Petrotub
    SA en Republica SA
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 235/2004 z dnia 10 lutego 2004 r. zmieniające
    rozporządzenie (WE) nr 2320/97 nakładające ostateczne cła antydumpingowe na
    przywóz niektórych rur i przewodów bez szwu z żelaza lub stali niestopowej
    pochodzących między innymi z Rumunii w zakresie dotyczącym przywozu do Wspólnoty
    Europejskiej wyrobów wytwarzanych przez Petrotub SA i Republica SA
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 235/2004 do Conselho, de 10 de Fevereiro de 2004,
    que altera o Regulamento (CE) n.° 2320/97 que institui direitos anti-dumping
    definitivos sobre as importações de certos tubos sem costura, de ferro ou de
    aço não ligado, originários nomeadamente da Roménia, no que respeita às importações
    na Comunidade Europeia desses produtos fabricados pelas empresas Petrotub SA e
    Republica SA
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 235/2004 z 10. februára 2004, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2320/97, ktorým sa ukladá konečné antidumpingové
    clo na dovoz určitých bezšvových rúr a potrubí zo železa alebo nelegovanej
    ocele s pôvodom, okrem iného, v Rumunsku, pokiaľ ide o dovozy výrobkov vyrobených
    spoločnosťami Petrotub SA a Republica SA do Európskeho spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 235/2004 z dne 10. februarja 2004 o spremembi Uredbe
    (ES) št. 2320/97 o uvedbi dokončnih protidampinških dajatev pri uvozu nekaterih
    brezšivnih cevi iz železa ali nelegiranega jekla s poreklom, med drugim, iz
    Romunije, in sicer pri uvozu izdelkov proizvajalcev Petrotub SA in Republica SA
    v Evropsko skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 235/2004 del Consejo, de 10 de febrero de 2004, por
    el que se modifica el Reglamento (CE) n° 2320/97 por el que se establecen derechos
    antidumping definitivos con respecto a las importaciones de determinados tubos
    sin soldadura, de hierro o acero sin alear, originarios, entre otros países,
    de Rumania, en lo que se refiere a las importaciones a la Comunidad Europea de
    productos fabricados por Petrotub SA y Republica SA
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 235/2004 av den 10 februari 2004 ändring av
    förordning (EG) nr 2320/97 om införande av slutgiltiga antidumpningstullar på
    import av vissa sömlösa rör av järn eller olegerat stål med ursprung i bl.a.
    Rumänien med avseende på sådan import till Europeiska gemenskapen som tillverkats
    av Petrotub SA och Republica SA
