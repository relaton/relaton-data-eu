title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 980/72 of 12 May 1972 fixing the date from
    which the compensatory amounts fixed by Regulation (EEC) No 979/72 for wine, beef
    and veal, processed fruit and vegetables and fishery products are to take effect
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 980/72 de la Commission, du 12 mai 1972, fixant, dans
    les secteurs du vin, de la viande bovine, des produits transformés à base de
    fruits et légumes, ainsi que des produits de la pêche, la date de la prise d'effet
    des montants compensatoires fixés par le règlement (CEE) n° 979/72
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 980/72 der Kommission vom 12. Mai 1972 zur Festsetzung
    des Datums des Wirksamwerdens der durch die Verordnung (EWG) Nr. 979/72 festgesetzten
    Ausgleichsbeträge in den Sektoren Wein, Rindfleisch, Verarbeitungserzeugnisse
    aus Obst und Gemüse sowie Erzeugnisse der Fischwirtschaft
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 980/72 della Commissione, del 12 maggio 1972, che
    fissa nei settori del vino, della carne bovina, dei prodotti trasformati a base
    di ortofrutticoli e dei prodotti della pesca la data di decorrenza degli importi
    compensativi fissati dal regolamento (CEE) n. 979/72
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 980/72 van de Commissie van 12 mei 1972 houdende
    vaststelling van de datum van inwerkingtreding van de compenserende bedragen in
    de sectoren wijn, rundvlees, op basis van groenten en fruit verwerkte produkten
    en visserijprodukten, vastgesteld bij Verordening (EEG) nr. 979/72
  type: main
