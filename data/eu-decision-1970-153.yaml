type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 février 1970, autorisant la République
    italienne à exclure du traitement communautaire les carreaux, pavés et dalles
    de pavement des positions Ex 69.07 et Ex 69.08 du Tarif douanier commun et la
    vaisselle et les articles de ménage ou de toilette en porcelaine de la position
    69.11 du Tarif douanier commun, originaires du Japon et des pays de l'Est et mis
    en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: '70/153/EWG: Entscheidung der Kommission vom 6. Februar 1970, mit der die
    Italienische Republik ermächtigt wird, Fliesen, gebrannte Pflastersteine und
    Bodenplatten der Tarifnummern ex 69.07 und ex 69.08 des Gemeinsamen Zolltarifs
    und Geschirr, Haushalts- und Toilettengegenstände aus Porzellan der Tarifnummer
    69.11 des Gemeinsamen Zolltarifs, die aus Japan und den Ostblockländern stammen
    und sich in der Bundesrepublik Deutschland im freien Verkehr befinden, von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/153/CEE: Decisione della Commissione, del 6 febbraio 1970, con cui
    si autorizza la Repubblica italiana a escludere dal trattamento comunitario le
    piastrelle, blocchetti e lastre da pavimentazione delle voci ex 69.07 le ex 69.08
    della tariffa doganale comune e il vasellame ed oggetti di uso domestico o da
    toeletta, di porcellana, della voce 69.11 della tariffa doganale comune, originari
    del Giappone e dei paesi dell''Est e messi in libera pratica nella Repubblica
    federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '70/153/EEG: Beschikking van de Commissie van 6 februari 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd plavuizen, vloer- en wandtegels van de posten
    ex 69.07 en ex 69.08 van het gemeenschappelijk douanetarief, en vaatwerk, huishoudelijke
    artikelen en toiletartikelen van porselein van post 69.11 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en de Oostelijke landen en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
