    reconnaissant que le rapport soumis par la France au titre de l’article 31,
    paragraphe 2, de la directive (UE) 2018/2001 du Parlement européen et du Conseil
    contient des données précises aux fins de la mesure des émissions de gaz à
    effet de serre associées à la culture de la betterave sucrière, du blé tendre
    (froment), du maïs-grain, du colza et du tournesol dans ledit État membre
