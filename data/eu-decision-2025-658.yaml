- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/658 of 3 April 2025 recognising
    that the report submitted by France under Article 31(2) of Directive (EU) 2018/2001
    of the European Parliament and of the Council contains accurate data for the purposes
    of measuring the greenhouse gas emissions associated with the cultivation of sugar
    beet, common wheat, grain maize, rapeseed and sunflower in that Member State
  type: main
- language: fr
  script: Latn
