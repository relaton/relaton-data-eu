  content: Décision de la Commission 64/445/CEE, du 2 juillet 1964, portant autorisation
    à la République fédérale d'Allemagne d'introduire un contingent tarifaire
    pour le zinc brut contenant en poids au moins 99,995 % de zinc
  type: main
- language: de
  script: Latn
  content: '64/445/EWG: Entscheidung der Kommission vom 2. Juli 1964, mit der die
    Bundesrepublik Deutschland ermächtigt wird, ein Zollkontingent für Rohzink,
    mit einem Gehalt an Zink von 99,995 Gewichtshundertteilen oder mehr, zu eröffnen'
  type: main
- language: it
  script: Latn
  content: '64/445/CEE: Decisione della Commissione, del 2 luglio 1964, che autorizza
    la Repubblica federale di Germania ad introdurre un contingente tariffario per
    lo zinco greggio contenente in peso almeno 99,995% di zinco'
  type: main
- language: nl
  script: Latn
  content: '64/445/EEG: Beschikking van de Commissie van 2 juli 1964 houdende machtiging
    van de Bondsrepubliek Duitsland tot het instellen van een tariefcontingent voor
    ruw zink, bevattende ten minste 99,995 gewichtspercenten zink'
  type: main
