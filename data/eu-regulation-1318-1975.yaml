  content: Regulation (EEC) No 1318/75 of the Commission of 23 May 1975 introducing
    the fourth modification of the list of egg and poultrymeat products eligible for
    the advance fixing of export refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1318/75 de la Commission, du 23 mai 1975, portant
    quatrième modification de la liste des produits des secteurs des oeufs et de
    la viande de volaille bénéficiant du régime de la fixation à l' avance des
    restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1318/75 der Kommission vom 23. Mai 1975 zur vierten
    Änderung der Liste der Erzeugnisse auf dem Eiersektor und auf dem Sektor Geflügelfleisch,
    die für eine Vorausfestsetzung der Ausfuhrerstattung in Frage kommen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1318/75 af 23. maj 1975 om fjerde ændring
    af listen over de æg- og fjerkrækødprodukter, der kommer i betragtning ved
    forudfastsættelse af eksportrestitutioner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1318/75 della Commissione, del 23 maggio 1975, che
    modifica per la quarta volta l' elenco dei prodotti del settore delle uova e del
    pollame ai quali è concesso il beneficio della fissazione anticipata della restituzione
    all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1318/75 van de Commissie van 23 mei 1975 houdende
    vierde wijziging van de lijst van produkten in de sector eieren en de sector slachtpluimvee
    die voor vaststelling vooraf van de uitvoerrestitutie in aanmerking komen
