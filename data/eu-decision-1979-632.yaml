id: EUDecision1979632
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/632/EEC: Commission Decision of 28 June 1979 authorizing the French
    Republic not to apply Community treatment to handkerchiefs of woven fabrics, falling
    within heading No ex 61.05 of the Common Customs Tariff (NIMEXE codes 61.05-20,
    30) (categories 19 and 89), originating in Czechoslovakia and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/632/CEE: Décision de la Commission, du 28 juin 1979, autorisant la
    République française à exclure du traitement communautaire les mouchoirs en
    tissus de coton, de la position ex 61.05 du tarif douanier commun (codes Nimexe:
    61.05-20, 30) (catégories 19 et 89), originaires de Tchécoslovaquie et mis en
    libre pratique dans les autres Etats membres (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/632/EWG: Entscheidung der Kommission vom 28. Juni 1979, mit der die
    Französische Republik ermächtigt wird, aus der Tschechoslowakei stammende und
    in den übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher aus
    Baumwolle der Tarifnummer ex 61.05 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.05-20; 30), Kategorien 19 und 89, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/632/EØF: Kommissionens beslutning af 28. juni 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder
    af bomuld, som henhører under pos. ex 61.05 i den fælles toldtarif (NIMEXE-nummer
    61.05-20, 30; kategori 19 og 89), har oprindelse i Tjekkoslovakiet og frit kan
    omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/632/CEE: Decisione della Commissione, del 28 giugno 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i fazzoletti da
    naso, di cotone, della voce ex 61.05 della tariffa doganale comune (codici Nimexe:
    61.05-20, 30), categorie 19 e 89, originari della Cecoslovacchia e messi in libera
    pratica negli altri Stati membri (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/632/EEG: Beschikking van de Commissie van 28 juni 1979 waarbij de Franse
    Republiek wordt gemachtigd zakdoeken van katoenen weefsels, van post ex 61.05
    van het gemeenschappelijk douanetarief (NIMEXE-code 61.05- 20, 30) (categorie
    19 en 89), van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
