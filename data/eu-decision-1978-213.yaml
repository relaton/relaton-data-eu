id: EUDecision1978213
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 31 January 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to cartridges for smooth-base sporting guns, falling within
    heading No ex 93.07 of the Common Customs Tariff, originating in Czechoslovakia
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/213/CEE: Décision de la Commission, du 31 janvier 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les cartouches pour armes de chasse à
    canon lisse, de la position Ex 93.07 du Tarif douanier commun, originaires de
    Tchécoslovaquie et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 31. Januar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Tschechoslowakei stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Patronen für Jagdwaffen mit glattem Lauf der Tarifnummer
    ex 93.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 31. januar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage patroner til glatløbede jagtvåben, som henhører under pos. 93.07
    i den fælles toldtarif, har oprindelse i Tjekkoslovakiet og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 31 gennaio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le cartucce per armi da caccia a canna liscia della
    voce ex 93.07 della tariffa doganale comune, originarie della Cecoslovacchia e
    messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 31 januari 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd hagel-jachtpatronen voor wapens met gladde loop van post ex 93.07 van
    het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
