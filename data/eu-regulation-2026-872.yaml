    pokud jde o regulační technické normy, kterými se upřesňují opatření
    a záruky, jež mají poskytovatelé ratingu ESG uplatnit za účelem oddělení
    svých činností v oblasti ratingu ESG od svých ostatních činností
  type: main
- language: da
  script: Latn
