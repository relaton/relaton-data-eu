title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/872 of 21 April 2026 supplementing
    Regulation (EU) 2024/3005 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the measures and safeguards to be
    implemented by ESG rating providers to separate their ESG rating activities from
    their other activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/872 de la Commission du 21 avril 2026 complétant
    le règlement (UE) 2024/3005 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les mesures et garanties à mettre en
    œuvre par les fournisseurs de notations ESG pour séparer leurs activités de
    notation ESG de leurs autres activités
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/872 der Kommission vom 21. April 2026 zur
    Ergänzung der Verordnung (EU) 2024/3005 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Maßnahmen
    und Schutzvorkehrungen, die von ESG-Rating-Anbietern zu treffen sind, um ihre
    ESG-Rating-Tätigkeiten von ihren anderen Tätigkeiten zu trennen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2026/872 на Комисията
    от 21 април 2026 година за допълнение на Регламент
    (ЕС) 2024/3005 на Европейския парламент и на Съвета
    чрез регулаторни технически стандарти за определяне
    на мерките и гаранциите, които доставчиците
    на ЕСУ рейтинги трябва да въведат за отделяне
    на своите дейности по определяне на ЕСУ рейтинги
    от другите си дейности
  type: main
- language: cs
  script: Latn
