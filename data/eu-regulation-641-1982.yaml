title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 641/82 of 19 March 1982 re-establishing
    the levying of customs duties on bars and rods, of iron or steel, falling within
    subheadings 73.10 B, C, D I b), D II and originating in Romania, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3601/81
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 641/82 de la Commission, du 19 mars 1982, portant
    rétablissement de la perception des droits de douane applicables aux barres en
    fer ou en acier, des sous-positions 73.10 B, C, D I b), D II du tarif douanier
    commun, originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 641/82 der Kommission vom 19. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Stabstahl der Tarifstelle 73.10 B, C, D I b) und
    D II, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 641/82 af 19. marts 1982 om genindførelse
    af opkrævning af told for stænger (herunder valstråd), af jern og stål henhørende
    under pos. 73.10 B, C, D I b), D II og med oprindelse i Rumænien som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
