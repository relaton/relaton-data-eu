title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2719/78 of 22 November 1978 re-establishing
    the levying of customs duties on nets and netting made of twine, cordage or rope,
    etc., falling within heading No 59.05 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2719/78 de la Commission, du 22 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    fabriqués à l' aide des matières reprises au n° 59.04, en nappes, etc., de
    la position tarifaire 59.05, originaires des pays et territoires en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le régime (CEE) n°
    1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2719/78 der Kommission vom 22. November 1978 zur Wiedereinführung
    des Zollsatzes fúr Netze aus Waren der Tarifnummer 59.04, in Stúcken usw., der
    Tarifnummer 59.05, mit Ursprung in Entwicklungslándern, denen die in der Verordnung
    (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2719/78 af 22. november 1978 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    etc. under position 59.05, som har oprindelse i udviklingslande og omfattes af
    de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2719/78 della Commissione, del 22 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle reti ottenute con
    l' impiego di manufatti previsti dalla voce 59.04, in strisce, ecc., della voce
    doganale 59.05, originarie dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2719/78 van de Commissie van 22 november 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, enz., van post 59.05,
    van oorsprong uit de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij
    Verordening (EEG) nr. 1197/78 van de Raad tariefpreferenties werden geopend
