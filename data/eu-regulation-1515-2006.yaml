id: EURegulation15152006
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1515/2006 of 10 October 2006 repealing the anti-dumping
    duty on imports of synthetic staple fibres of polyesters originating in Australia,
    India, Indonesia and Thailand and terminating the proceedings in respect of such
    imports, following expiry reviews pursuant to Article 11(2) of Council Regulation
    (EC) No 384/96, and terminating the partial interim review pursuant to Article
    11(3) of such imports originating in Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1515/2006 du Conseil du 10 octobre 2006 abrogeant le
    droit antidumping institué sur les importations de fibres synthétiques discontinues
    de polyesters, originaires d'Australie, de l'Inde, d'Indonésie et de Thaïlande,
    clôturant la procédure concernant les importations de ces produits à la suite
    de réexamens au titre de l'expiration des mesures, effectués conformément à
    l'article 11, paragraphe 2, du règlement (CE) n o 384/96 du Conseil, et clôturant
    le réexamen intermédiaire partiel, effectué conformément à l'article 11,
    paragraphe 3, de ces importations originaires de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1515/2006 des Rates vom 10. Oktober 2006 zur Aufhebung
    des Antidumpingzolls auf Einfuhren synthetischer Spinnfasern aus Polyestern mit
    Ursprung in Australien, Indien, Indonesien und Thailand, ferner zur Einstellung
    der Verfahren betreffend diese Einfuhren nach Überprüfungen wegen des bevorstehenden
    Außerkrafttretens der Maßnahmen gemäß Artikel 11 Absatz 2 der Verordnung (EG)
    Nr. 384/96 des Rates sowie zur Einstellung der teilweisen Interimsüberprüfung
    gemäß Artikel 11 Absatz 3 betreffend solche Einfuhren mit Ursprung in Thailand
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1515/2006 ze dne 10. října 2006 , kterým se
    zrušuje antidumpingové clo na dovoz syntetických polyesterových střižových
    vláken pocházejících z Austrálie, Indie, Indonésie a Thajska, ukončuje
    řízení týkající se tohoto dovozu na základě přezkumů opatření před
    pozbytím platnosti podle čl. 11 odst. 2 nařízení Rady (ES) č. 384/96 a ukončuje
    částečný prozatímní přezkum dovozu těchto výrobků pocházejících z
    Thajska podle čl. 11 odst. 3 základního nařízení
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1515/2006 af 10. oktober 2006 om ophævelse
    af antidumpingtolden vedrørende korte syntetiske fibre af polyester med oprindelse
    i Australien, Indien, Indonesien og Thailand, om afslutning af procedurerne vedrørende
    importen af sådanne fibre, efter udløbsundersøgelser i henhold til artikel
    11, stk. 2, i Rådets forordning (EF) nr. 384/96, og om afslutning af den delvise
    interimsundersøgelse i henhold til artikel 11, stk. 3, vedrørende importen af
    sådanne fibre med oprindelse i Thailand
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1515/2006 του Συμβουλίου,
    της 10ης Οκτωβρίου 2006 , για την κατάργηση του
