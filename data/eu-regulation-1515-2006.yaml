    Ταϊλάνδης, που διενεργήθηκε σύμφωνα με το άρθρο
    11 παράγραφος 3
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1515/2006, 10. oktoober 2006 , millega tunnistatakse
    kehtetuks Austraaliast, Indiast, Indoneesiast ja Taist pärinevate polüestrist
    sünteesstaapelkiudude impordi suhtes kehtiv dumpinguvastane tollimaks ning lõpetatakse
    sellist importi käsitlevad menetlused pärast nõukogu määruse (EÜ) nr 384/96
    artikli 11 lõike 2 kohaseid aegumise läbivaatamisi ja lõpetatakse sellise Taist
    pärineva impordi artikli 11 lõike 3 kohane osaline vahepealne läbivaatamine
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1515/2006, annettu 10 päivänä lokakuuta 2006
    , Australiasta, Intiasta, Indonesiasta ja Thaimaasta peräisin olevien polyesteriä
    olevien synteettikatkokuitujen tuontiin sovellettavan polkumyyntitullin kumoamisesta
    ja kyseistä tuontia koskevien menettelyjen päättämisestä neuvoston asetuksen
    (EY) N:o 384/96 11 artiklan 2 kohdan mukaisten, toimenpiteiden voimassaolon päättymistä
    koskevien tarkastelujen jälkeen sekä 11 artiklan 3 kohdan mukaisen, vastaavaa
    Thaimaasta peräisin olevaa tuontia koskevan osittaisen välivaiheen tarkastelun
    päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 1515/2006/EK rendelete ( 2006. október 10. ) az Ausztráliából,
    Indiából, Indonéziából és Thaiföldről származó szintetikus poliészter
    vágott szálak behozatalára kivetett dömpingellenes vám hatályon kívül
    helyezéséről, az ilyen behozatalra vonatkozóan a 384/96/EK tanácsi rendelet
    11. cikkének (2) bekezdése szerinti hatályvesztési felülvizsgálatokat követő
    eljárások megszüntetéséről, valamint a Thaiföldről származó ilyen behozatalnak
    a 11. cikk (3) bekezdése szerinti részleges időközi felülvizsgálatának
    megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1515/2006 del Consiglio, del 10 ottobre 2006 , che
    abroga il dazio antidumping sulle importazioni di fibre sintetiche di poliesteri
    in fiocco originarie dell’Australia, dell’India, dell’Indonesia e della
    Thailandia, chiude i procedimenti relativi a tali importazioni, in seguito a riesami
    in previsione della scadenza a norma dell’articolo 11, paragrafo 2, del regolamento
    (CE) n. 384/96 del Consiglio e chiude il riesame intermedio parziale a norma dell’articolo
    11, paragrafo 3, di tali importazioni originarie della Thailandia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1515/2006 ( 2006. gada 10. oktobris ), ar kuru
    atceļ antidempinga maksājumu Austrālijas, Indijas, Indonēzijas un Taizemes
    izcelsmes sintētisko poliestera štāpeļšķiedru importam un izbeidz procedūru
    attiecībā uz šādu importu pēc termiņa beigu pārskatīšanas saskaņā ar
    Padomes Regulas (EK) Nr. 384/96 11. panta 2. punktu un starpposma pārskatu saskaņā
    ar 11. panta 3. punktu, kas attiecas uz šādu importu no Taizemes
  type: main
- language: lt
  script: Latn
  content: 2006 m. spalio 10 d. Tarybos reglamentas (EB) Nr. 1515/2006, panaikinantis
    antidempingo muitą Australijos, Indijos, Indonezijos ir Tailando kilmės poliesterio
    sintetinių kuokštelinių pluoštų importui ir nutraukiantis tyrimo procedūrą
    dėl šio importo, pasibaigus priemonių galiojimo termino peržiūrai pagal Tarybos
    reglamento (EB) Nr. 384/96 11 straipsnio 2 dalį, ir nutraukiantis dalinę tarpinę
    peržiūrą šiam Tailando kilmės importui pagal 11 straipsnio 3 dalį
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1515/2006 ta' l- 10 ta’ Ottubru 2006
    li jneħħi d-dazju kontra d-dumping fuq importazzjonijiet ta’ fibri sintetiċi
    prinċipali ta’ poliesteri li joriġinaw fl-Awstralja, fl-Indja, fl-Indoneżja
    u fit-Tajlandja u li jtemm il-proċedimenti fir-rigward ta’ dawn l-importazzjonijiet,
    wara reviżjonijiet ta’ skadenza skond l-Artikolu 11(2) tar-Regolament tal-Kunsill
    (KE) Nru 384/96, u li jtemm ir-reviżjoni interim parzjali skond l-Artikolu 11(3)
    ta’ dawn l-importazzjonijiet li joriġinaw fit-Tajlandja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1515/2006 van de Raad van 10 oktober 2006 tot intrekking
    van het antidumpingrecht op de invoer van synthetische stapelvezels van polyesters
    uit Australië, India, Indonesië en Thailand en tot beëindiging van de procedures
    betreffende die invoer naar aanleiding van nieuwe onderzoeken in verband met het
    vervallen van maatregelen overeenkomstig artikel 11, lid 2, van Verordening (EG)
    nr. 384/96 van de Raad, alsmede tot beëindiging van het gedeeltelijk tussentijds
    nieuw onderzoek overeenkomstig artikel 11, lid 3, naar die invoer uit Thailand
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1515/2006 z dnia 10 października 2006 r.
    uchylające cło antydumpingowe nałożone na przywóz syntetycznych włókien
    odcinkowych z poliestru pochodzących z Australii, Indii, Indonezji i Tajlandii
    oraz kończące postępowania prowadzone względem tego przywozu, w następstwie
    przeglądów wygaśnięcia zgodnie z art. 11 ust. 2 rozporządzenia Rady (WE)
    nr 384/96 i kończące częściowy przegląd okresowy zgodnie z art. 11 ust. 3
    dotyczący tego przywozu pochodzącego z Tajlandii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1515/2006 do Conselho, de 10 de Outubro de 2006 ,
    que revoga o direito anti-dumping sobre as importações de fibras descontínuas
    sintéticas de poliésteres originárias da Austrália, da Índia, da Indonésia
    e da Tailândia, que encerra os processos respeitantes a essas importações,
    na sequência de reexames da caducidade, iniciados ao abrigo do n. o 2 do artigo
    11. o do Regulamento (CE) n. o 384/96, e que encerra o reexame intercalar parcial,
    iniciado ao abrigo do n. o 3 do artigo 11. o , dessas importações originárias
    da Tailândia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1515/2006 z 10. októbra 2006 , ktorým sa po
    preskúmaniach uplynutia platnosti podľa článku 11 ods. 2 nariadenia Rady (ES)
    č. 384/96 ruší antidumpingové clo na dovoz syntetických strižných vlákien
    z polyesterov s pôvodom v Austrálii, Indii, Indonézii a Thajsku a ukončujú
    konania v súvislosti s týmto dovozom a ktorým sa ukončuje čiastočné predbežné
    preskúmanie takéhoto dovozu s pôvodom v Thajsku podľa článku 11 ods. 3
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1515/2006 z dne 10. oktobra 2006 o razveljavitvi
    protidampinške dajatve na uvoz sintetičnih rezanih vlaken iz poliestra s poreklom
    iz Avstralije, Indije, Indonezije in Tajske ter o zaključku postopkov v zvezi
    s tem uvozom po pregledih zaradi izteka ukrepa v skladu s členom 11(2) Uredbe
    Sveta (ES) št. 384/96 in zaključku delnega vmesnega pregleda v zvezi z uvozom
    s poreklom iz Tajske v skladu s členom 11(3)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1515/2006 del Consejo, de 10 de octubre de 2006 , por
    el que se deroga el derecho antidumping sobre las importaciones de fibras sintéticas
    discontinuas de poliéster procedentes de Australia, la India, Indonesia y Tailandia,
    se dan por concluidos los procedimientos relativos a tales importaciones, tras
    las reconsideraciones por expiración de conformidad con el artículo 11, apartado
    2, del Reglamento (CE) n o 384/96 del Consejo, y se da por concluida la reconsideración
    provisional parcial de tales importaciones originarias de Tailandia, de conformidad
    con el artículo 11, apartado 3
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1515/2006 av den 10 oktober 2006 om upphävande
    av antidumpningstull på import av syntetstapelfibrer av polyestrar med ursprung
    i Australien, Indien, Indonesien och Thailand och om avslutande av förfarandena
    avseende sådan import till följd av översyner vid giltighetstidens utgång
    i enlighet med artikel 11.2 i rådets förordning (EG) nr 384/96 och om avslutande
    av den partiella interimsöversynen enligt artikel 11.3 av sådan import med ursprung
    i Thailand
