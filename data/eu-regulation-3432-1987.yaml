  script: Latn
  content: Commission Regulation (EEC) No 3432/87 of 17 November 1987 re-establishing
    the levying of customs duties on cysteine, cystine and its derivatives, falling
    within subheading 29.31 ex B, and to dolls, falling within heading No 97.02 of
    the Common Customs Tariff, originating in China to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3432/87 de la Commission du 17 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables à la cystéine,
    cystine et leurs dérivés de la sous-position 29.31 ex B et aux poupées de tous
    genres de la position 97.02 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
