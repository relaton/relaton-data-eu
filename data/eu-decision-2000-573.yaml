title:
- language: en
  script: Latn
  content: '2000/573/EC: Commission Decision of 11 September 2000 refusing to grant
    the Turks and Caicos Islands a derogation concerning the definition of the concept
    of ''originating products'' with regard to rice of CN code 100630 (notified under
    document number C(2000) 2652)'
  type: main
- language: fr
  script: Latn
  content: '2000/573/CE: Décision de la Commission du 11 septembre 2000 portant refus
    d''accorder aux îles Turks et Caicos une dérogation à la définition de la
    notion de produits originaires en ce qui concerne le riz relevant du code NC 100630
    [notifiée sous le numéro C(2000) 2652]'
  type: main
- language: de
  script: Latn
  content: '2000/573/EG: Entscheidung der Kommission vom 11. September 2000 über
    die Ablehnung des Antrags der Turks- und Caicosinseln auf eine Abweichung von
