---
id: EUDecision202215
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/15 of 6 January 2022 amending
    Implementing Decision (EU) 2021/1195 as regards harmonised standards for sterilisation
    of health care products, aseptic processing of health care products, quality management
    systems, symbols to be used with information to be supplied by the manufacturer
    and requirements for establishing metrological traceability of values assigned
    to calibrators, trueness control materials and human samples
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/15 de la Commission du 6 janvier 2022
    modifiant la décision d’exécution (UE) 2021/1195 en ce qui concerne les normes
    harmonisées pour la stérilisation des produits de santé, le traitement aseptique
    des produits de santé, les systèmes de management de la qualité, les symboles
    à utiliser avec les informations à fournir par le fabricant et les exigences
    pour l’établissement d’une traçabilité métrologique des valeurs attribuées
    aux étalons, aux matériaux de contrôle de la justesse et aux échantillons
    humains
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/15 der Kommission vom 6. Januar 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2021/1195 hinsichtlich harmonisierter
    Normen für die Sterilisation von Produkten für die Gesundheitsfürsorge, die
    aseptische Herstellung von Produkten für die Gesundheitsfürsorge, Qualitätsmanagementsysteme,
    zu verwendende Symbole mit durch den Hersteller bereitgestellten Informationen
    sowie Anforderungen an die Ermittlung metrologischer Rückführbarkeit von Werten,
    die Kalibratoren, Richtigkeitskontrollmaterialien und Humanproben zugeordnet sind
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/15 на Комисията
    от 6 януари 2022 година за изменение на Решение
    за изпълнение (ЕС) 2021/1195 по отношение на хармонизираните
    стандарти за стерилизацията на продукти за
    здравеопазването, за асептичната обработка
    на продукти за здравеопазването, за системите
    за управление на качеството, за символите,
    използвани в предоставяната от производителя
    информация и за изискванията за установяване
    на метрологична проследимост на предписаните
    стойности на калибратори, реални контролни
    материали и проби от човек
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/15 ze dne 6. ledna 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2021/1195, pokud jde o harmonizované
    normy pro sterilizaci výrobků pro zdravotní péči, aseptické zpracování
    výrobků pro zdravotní péči, systémy managementu kvality, značky, které
    mají být používány s informacemi poskytovanými výrobcem, a požadavky na
    stanovení metrologické návaznosti hodnot přiřazených kalibrátorům, kontrolním
    materiálům pravdivosti a humánním vzorkům
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/15 af 6. januar 2022
    om ændring af gennemførelsesafgørelse (EU) 2021/1195 for så vidt angår harmoniserede
    standarder for sterilisation af sundhedsplejeprodukter, aseptisk behandling af
    sundhedsplejeprodukter, kvalitetsledelsessystemer, symboler, der skal anvendes
    sammen med de oplysninger, som skal leveres af producenten, og krav til bestemmelse
    af metrologisk sporbarhed af værdier tillagt kalibratorer, kontrolmaterialer
    og humane prøver
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/15 της Επιτροπής
    της 6ης Ιανουαρίου 2022 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2021/1195 όσον αφορά
    τα εναρμονισμένα πρότυπα για την αποστείρωση
    προϊόντων για ιατρική χρήση, την ασηπτική επεξεργασία
    προϊόντων ιατρικής φροντίδας, τα συστήματα
    διαχείρισης της ποιότητας, τα σύμβολα που πρέπει
    να χρησιμοποιούνται με τις πληροφορίες που
    παρέχονται από τον κατασκευαστή και τις απαιτήσεις
    για την καθιέρωση μετρολογικής ιχνηλασιμότητας
    των τιμών που αποδίδονται στα υλικά βαθμονόμησης,
    στα υλικά ελέγχου αληθότητας και στα ανθρώπινα
    δείγματα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/15, 6. jaanuar 2022, millega muudetakse
    rakendusotsust (EL) 2021/1195 tervishoiutoodete steriliseerimist, tervishoiutoodete
    aseptilist töötlemist, kvaliteedijuhtimissüsteeme, tootjainfos kasutatavaid
    tingmärke ning kaliibrimisvahenditele, kontrollmaterjalidele ja inimpäritolu
    proovidele omistatud väärtuste metroloogilise jälgitavuse tagamise nõudeid
    käsitlevate harmoneeritud standardite osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/15, annettu 6 päivänä
    tammikuuta 2022, täytäntöönpanopäätöksen (EU) 2021/1195 muuttamisesta siltä
    osin kuin on kyse terveydenhuollon tuotteiden sterilointia, terveydenhoitotuotteiden
    aseptista prosessointia, laadunhallintajärjestelmiä, tuotemerkinnässä ja tuotetiedoissa
    esitettäviä kuvatunnuksia sekä kalibraattoreille, kontrollimateriaaleille ja
    ihmisperäisille näytteille annettujen arvojen metrologista jäljitettävyyttä
    koskevia vaatimuksia koskevista yhdenmukaistetuista standardeista
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/15 ón gCoimisiún an 6 Eanáir 2022
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2021/1195 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le steiriliú táirgí cúraim sláinte,
    próiseáil aiseipteach táirgí cúraim sláinte, córais bainistíochta cáilíochta,
    siombailí atá le húsáid leis an bhfaisnéis atá le soláthar ag an monaróir
    agus ceanglais maidir le hinrianaitheacht mhéadreolaíoch a shuí i gcás luachanna
    a shanntar do chalabróirí, d’ábhair rialaithe fíre agus do shamplaí daonna
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/15 оd 6. siječnja 2022. o izmjeni
    Provedbene odluke (EU) 2021/1195 u pogledu usklađenih normi za sterilizaciju
    medicinskoga pribora, aseptičke postupke za proizvode zdravstvene zaštite, sustave
    upravljanja kvalitetom, simbole koji se upotrebljavaju s podacima koje osigurava
    proizvođač i zahtjeve za uspostavljanje mjeriteljske sljedivosti vrijednosti
    dodijeljenih kalibratorima, tvarima za nadzor istinitosti i uzorcima ljudskog
    tkiva
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/15 végrehajtási határozata (2022. január 6.)
    az (EU) 2021/1195 végrehajtási határozatnak az egészségügyi termékek sterilizálására,
    az egészségügyi termékek aszeptikus kezelésére, a minőségirányítási
    rendszerekre, a gyártó tájékoztatóiban használandó szimbólumokra, valamint
    a kalibrálóanyagokhoz, a valódiságkontrollokhoz és a humán mintákhoz hozzárendelt
    értékek metrológiai visszavezethetőségének megállapítására alkalmazandó
    követelményekre vonatkozó harmonizált szabványok tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/15 della Commissione del 6 gennaio 2022
    che modifica la decisione di esecuzione (UE) 2021/1195 per quanto riguarda le
    norme armonizzate per la sterilizzazione dei dispositivi medici, il trattamento
    asettico dei prodotti per la cura della salute, i sistemi di gestione per la qualità,
    i simboli da utilizzare nelle informazioni che devono essere fornite da parte
    del fabbricante e i requisiti per definire la tracciabilità metrologica dei valori
    assegnati ai calibratori e ai materiali di controllo della giustezza e campioni
    umani
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/15 (2022. gada 6. janvāris),
    ar ko attiecībā uz saskaņotajiem standartiem, kuri attiecas uz veselības aprūpes
    produktu sterilizēšanu, veselības aprūpes līdzekļu aseptisku apstrādi,
    kvalitātes pārvaldības sistēmām, simboliem, kas izmantojami kopā ar ražotāja
    sniegto informāciju, un kalibratoriem, ticamības kontroles materiāliem un no
    cilvēka iegūtiem paraugiem piešķirto vērtību metroloģiskās izsekojamības
    noteikšanas prasībām, groza Īstenošanas lēmumu (ES) 2021/1195
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/15 2022 m. sausio 6 d. kuriuo
    dėl sveikatos priežiūros gaminių sterilizavimo, sveikatos priežiūros gaminių
    aseptinio apdorojimo, kokybės vadybos sistemų, gamintojo pateikiamoje informacijoje
    vartotinų simbolių, darniųjų standartų ir kalibravimo medžiagoms, tikrumo
    tikrinimo medžiagoms ir žmogaus biologiniams mėginiams priskiriamų verčių
    metrologinės sieties nustatymo reikalavimų iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2021/1195
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/15 tas-6 ta’
    Jannar 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2021/1195 fir-rigward
    tal-istandards armonizzati għall-isterilizzazzjoni ta’ prodotti għall-kura
    tas-saħħa, l-ipproċessar asettiku ta’ prodotti għall-kura tas-saħħa, is-sistema
    ta’ mmaniġġjar tal-kwalità, is-simboli biex jintużaw ma' informazzjoni li
    trid tingħata mill-manifattur u r-rekwiżiti għall-istabbiliment tat-traċċabbiltà
    metroloġika tal-valuri assenjati għall-kalibraturi, il-materjali ta' kontroll
    tal-eżattezza u l-kampjuni umani
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/15 van de Commissie van 6 januari 2022 tot
    wijziging van Uitvoeringsbesluit (EU) 2021/1195 wat betreft geharmoniseerde normen
    voor sterilisatie van medische hulpmiddelen, de aseptische verwerking van producten
    in de gezondheidszorg, kwaliteitsmanagementsystemen, symbolen voor het gebruik
    met informatievoorziening door de fabrikant en voorschriften voor het vaststellen
    van de metrologische traceerbaarheid van waarden toegekend aan kalibratiemiddelen,
    materialen voor controle van juistheid en bij mensen genomen monsters
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/15 z dnia 6 stycznia 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2021/1195 w odniesieniu do norm zharmonizowanych dotyczących
    sterylizacji produktów stosowanych w ochronie zdrowia, aseptycznego przetwarzania
    produktów ochrony zdrowia, systemów zarządzania jakością, symboli, które
    mają być stosowane w informacjach dostarczanych przez wytwórcę i wymagań
    dotyczących ustalania spójności pomiarowej wartości wyznaczonych dla kalibratorów,
    materiałów do kontroli poprawności pomiaru oraz próbek pochodzących od ludzi
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/15 da Comissão de 6 de janeiro de 2022
    que altera a Decisão de Execução (UE) 2021/1195 no que diz respeito às normas
    harmonizadas para a esterilização de produtos de cuidados de saúde, o processamento
    assético de produtos de cuidados de saúde, os sistemas de gestão da qualidade,
    os símbolos a utilizar com a informação a ser fornecida pelo fabricante e os
    requisitos para estabelecer a rastreabilidade metrológica dos valores atribuídos
    aos calibradores, aos materiais de controlo da veracidade e às amostras humanas
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/15 a Comisiei din 6 ianuarie 2022
    de modificare a Deciziei de punere în aplicare (UE) 2021/1195 în ceea ce privește
    standardele armonizate pentru sterilizarea produselor de îngrijire a sănătății,
    tratamentul aseptic pentru produse de îngrijire a sănătății, sistemele de
    management al calității, simbolurile de utilizat cu informații de furnizat
    de producător și cerințele pentru stabilirea trasabilității metrologice a
    valorilor atribuite etaloanelor, materialelor pentru controlul justeții și eșantioanelor
    umane
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/15 zo 6. januára 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2021/1195, pokiaľ ide o harmonizované
    normy pre sterilizáciu výrobkov na zdravotnú starostlivosť, aseptické spracovanie
    výrobkov na zdravotnú starostlivosť, systémy manažérstva kvality, značky
    na použitie s informáciami poskytovanými výrobcom a požiadavky na zavedenie
    metrologickej nadväznosti hodnôt priradených kalibračným, skutočným kontrolným
    materiálom a ľudským vzorkám
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/15 z dne 6. januarja 2022 o spremembi
    Izvedbenega sklepa (EU) 2021/1195 glede harmoniziranih standardov za sterilizacijo
    izdelkov za zdravstveno nego, aseptično proizvodnjo izdelkov za zdravstveno nego,
    sisteme vodenja kakovosti, simbole za označevanje podatkov, ki jih mora podati
    dobavitelj, in zahteve za vzpostavitev meroslovne sledljivosti vrednosti, dodeljenih
    kalibratorjem, kontrolnim materialom in vzorcem človeškega izvora
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/15 de la Comisión de 6 de enero de 2022
    por la que se modifica la Decisión de Ejecución (UE) 2021/1195 en lo que respecta
    a las normas armonizadas sobre esterilización de productos para la salud, procesado
    aséptico de productos para la salud, sistemas de gestión de la calidad, símbolos
    a utilizar en las etiquetas, el etiquetado y la información a suministrar de
    los productos sanitarios y requisitos para establecer la trazabilidad metrológica
    de los valores asignados a calibradores, materiales de control de veracidad y
    muestras humanas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/15 av den 6 januari 2022 om
    ändring av genomförandebeslut (EU) 2021/1195 vad gäller harmoniserade standarder
    för sterilisering av medicintekniska produkter, aseptisk behandling av medicintekniska
    produkter, ledningssystem för kvalitet, symboler att användas vid märkning
    av produkt och information till användare samt krav för att fastställa metrologisk
    spårbarhet av värden som tilldelas kalibratorer, truenesskontrollmaterial och
    humanprover
  type: main
