  script: Latn
  content: '81/675/EEC: Commission Decision of 28 July 1981 establishing that particular
    sealing systems are ''non- reusable systems'' within the meaning of Council Directives
    66/400/EEC, 66/401/EEC, 66/402/EEC, 69/208/EEC and 70/458/EEC'
  type: main
- language: fr
  script: Latn
