title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 400/77 of 28 February 1977 amending Regulation
    (EEC) No 3168/76 laying down the conditions for coupage and wine-making in the
    free zones on Community territory for wine products originating in third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 400/77 du Conseil, du 28 février 1977, modifiant
    le règlement (CEE) n° 3168/76 établissant les conditions de coupage et de vinification
    dans les zones franches sur le territoire géographique de la Communauté pour
    les produits du secteur du vin qui sont originaires des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 400/77 des Rates vom 28. Februar 1977 zur Änderung
    der Verordnung (EWG) Nr. 3168/76 zur Festlegung der Bedingungen für den Verschnitt
    und die Verarbeitung von Erzeugnissen des Weinsektors mit Ursprung in Drittländern
    in den Freizonen im Gebiet der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 400/77 af 28. februar 1977 om ændring af
    forordning (EØF) nr. 3168/76 om fastsættelse af betingelserne for sammenstikning
    og fremstilling af vin i frizonerne på Fællesskabets geografiske område for
    produkter inden for vinsektoren med oprindelse i tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 400/77 del Consiglio, del 28 febbraio 1977, recante
    modifica del regolamento (CEE) n. 3168/76 che stabilisce le condizioni di taglio
    e di vinificazione applicabili nelle zone franche del territorio geografico della
    Comunità ai prodotti del settore vinicolo originari dei paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 400/77 van de Raad van 28 februari 1977 houdende
    wijziging van Verordening (EEG) nr. 3168/76 tot vaststelling van de voorwaarden
    voor het versnijden en tot wijn verwerken in de vrije zones op het geografische
    grondgebied van de Gemeenschap van produkten uit de wijnbouwsector, van oorsprong
    uit derde landen
  type: main
