id: EURegulation4651978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 465/78 of 6 March 1978 re-establishing the
    levying of the customs duties on other made up textile articles (including dress
    patterns) other than of jute, other than textile bast fibres of heading No 57.03
    or coir falling within heading No ex 62.05 originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 465/78 de la Commission, du 6 mars 1978, portant rétablissement
    de la perception des droits de douane applicables aux autres articles confectionnés
    en tissus, y compris les patrons de vêtements, à l'exclusion des articles en
    jute ou en autres fibres textiles libériennes du n° 57.03, ou en coco, de la
    position tarifaire EX 62.05, originaires des pays et territoires en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 465/78 der Kommission vom 6. März 1978 zur Wiedereinführung
    des Zollsatzes für andere konfektionierte Waren aus Geweben, einschließlich
    Schnittmuster zum Herstellen von Bekleidung, ausgenommen Waren aus Jute oder anderen
    textilen Bastfasern der Tarifnummer 57.03, oder Kokosfasern, der Tarifnummer ex
    62.05, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 465/78 af 6. marts 1978 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer (herunder
    snitmønstre), med undtagelse af varer af jute, andre bastfibre henhørende under
    position 57.03 eller kokosfibre, under position ex 62.05, som har oprindelse i
    udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 465/78 della Commissione, del 6 marzo 1978, che ripristina
    la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, compresi i modelli di vestiti, esclusi i manufatti di iuta e di altre
    fibre tessili liberiane della voce doganale 57.03, o di cocco della voce ex 62.05,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 465/78 van de Commissie van 6 maart 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere geconfectioneerde
    artikelen van weefsels, patronen en kleding daaronder begrepen, met uitzondering
    van artikelen van jute of andere bastvezels van post 57.03 of van kokosvezels
    van post ex 62.05, van oorsprong uit de ontwikkelingslanden en -gebieden, ten
    behoeve waarvan bij Verordening (EEG) nr. 2706/77 van de Raad tariefpreferenties
    werden geopend
  type: main
