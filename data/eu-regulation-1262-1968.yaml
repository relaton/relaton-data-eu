title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1262/68 de la Commission, du 20 août 1968, relatif
    à des mesures transitoires concernant l'octroi de restitutions particulières
    pour certains produits laitiers livrés à certaines forces étrangères stationnées
    en Europe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1262/68 der Kommission vom 20. August 1968 über Übergangsmaßnahmen
    hinsichtlich der Gewährung von besonderen Erstattungen für bestimmte Milcherzeugnisse,
    die an bestimmte in Europa stationierte ausländische Streitkräfte geliefert
    werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1262/68 della Commissione, del 20 agosto 1968, relativo
    alle misure transitorie concernenti la concessione di restituzioni particolari
    per alcuni prodotti lattiero-caseari consegnati ad alcune forze armate straniere
    di stanza in Europa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1262/68 van de Commissie van 20 augustus 1968 houdende
    overgangsmaatregelen betreffende het verlenen van bijzondere restituties voor
    bepaalde zuivelprodukten, geleverd aan vreemde strijdkrachten, welke in Europa
    gelegerd zijn
  type: main
