title:
- language: en
  script: Latn
  content: '86/219/EEC: Fifth Commission Decision of 16 May 1986 relating to the application
    of Council Directive 72/166/EEC on the approximation of the laws of the Member
    States relating to insurance against civil liability in respect of the use of
    motor vehicles, and to the enforcement of the obligation to insure against such
    liability (Only the Spanish and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/219/CEE: Cinquième décision de la Commission du 16 mai 1986 relative
    à l''application de la directive 72/166/CEE du Conseil, du 24 avril 1972, concernant
    le rapprochement des législations des États membres relatives à l''assurance
    de la responsabilité civile résultant de la circulation de véhicules automoteurs
    et au contrôle de l''obligation d''assurer cette responsabilité (Les textes
    en langues espagnole et portugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/219/EWG: Fünfte Entscheidung der Kommission vom 16. Mai 1986 zur Durchführung
    der Richtlinie 72/166/EWG des Rates betreffend die Angleichung der Rechtsvorschriften
    der Mitgliedstaaten bezüglich der Kraftfahrzeug- Haftpflichtversicherung und
    der Kontrolle der entsprechenden Versicherungspflicht (Nur der spanische und portugiesische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/219/EØF: Kommissionens femte beslutning af 16. maj 1986 om anvendelse
    af Rådets direktiv 72/166/EØF om indbyrdes tilnærmelse af medlemsstaternes
    lovgivning om ansvarsforsikring for motorkøretøjer og kontrollen med forsikringspligtens
    overholdelse (Kun den spanske og portugisiske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '86/219/ΕΟΚ: Πέμπτη απόφαση της Επιτροπής της
    16ης Μαΐου 1986 σχετικά με την εφαρμογή της οδηγίας
    72/166/ΕΟΚ περί εναρμονίσεως των νομοθεσιών των
    κρατών μελών των σχετικών με την ασφάλιση της
    αστικής ευθύνης που προκύπτει από την κυκλοφορία
    των αυτοκινήτων οχημάτων και με τον έλεγχο
    της υποχρέωσης προς ασφάλιση της ευθύνης αυτής
    (Τα κείμενα στην ισπανική και πορτογαλική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '86/219/CEE: Quinta Decisione della Commissione del 16 maggio 1986 relativa
    all''applicazione della direttiva 72/166/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati membri in materia di assicurazione della responsabilità
    civile risultante dalla circolazione di autoveicoli e di controllo di assicurare
    tale responsabilità (Il testi in lingua spagnola e portoghese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '86/219/EEG: Vijfde Beschikking van de Commissie van 16 mei 1986 tot toepassing
    van Richtlijn 72/166/EEG van de Raad inzake de onderlinge aanpassing van de wetgevingen
    der Lid-Staten betreffende de verzekering tegen de wettelijke aansprakelijkheid
    waartoe de deelneming aan het verkeer van motorrijtuigen aanleiding kan geven
    en de controle op de verzekering tegen deze aansprakelijkheid (Slechts de teksten
    in de Spaanse en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/219/CEE: Quinta Decisão da Comissão de 16 de Maio de 1986 sobre a
