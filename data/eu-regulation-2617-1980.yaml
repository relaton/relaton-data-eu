title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2617/80 of 7 October 1980 instituting a specific
    Community regional development measure contributing to overcoming constraints
    on the development of new economic activities in certain zones adversely affected
    by restructuring of the shipbuilding industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2617/80 du Conseil, du 7 octobre 1980, instituant
    une action communautaire spécifique de développement régional contribuant à
    l'élimination des obstacles au développement de nouvelles activités économiques
    dans certaines zones affectées par la restructuration de la construction navale
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2617/80 des Rates vom 7. Oktober 1980 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige in
    bestimmten von der Umstrukturierung der Schiffbauindustrie betroffenen Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2617/80 af 7. oktober 1980 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i skibsbygningsindustrien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2617/80 του Συμβουλίου
    της 7ης Οκτωβρίου 1980 περί αναλήψεως ειδικής
    κοινοτικής ενεργείας περιφερειακής αναπτύξεως
    για τη συμβολή στην εξάλειψη των εμποδίων στην
    ανάπτυξη νέων οικονομικών δραστηριοτήτων
    σε ορισμένες ζώνες που θίγονται από την αναδιάρθρωση
    της ναυπηγικής βιομηχανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2617/80 del Consiglio, del 7 ottobre 1980, che istituisce
    un'azione comunitaria specifica di sviluppo regionale per contribuire ad eliminare
    gli ostacoli allo sviluppo di nuove attività economiche in alcune zone colpite
    dalla ristrutturazione del settore della costruzione navale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2617/80 van de Raad van 7 oktober 1980 tot instelling
    van een specifieke communautaire actie voor regionale ontwikkeling om bij te dragen
    tot de uitschakeling van de hinderpalen voor de ontwikkeling van nieuwe economische
    activiteiten in sommige door de herstructurering van de scheepsbouw getroffen
    zones
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2617/80 do Conselho, de 7 de Outubro de 1980, que
    institui uma acção comunitária específica de desenvolvimento regional para
    contribuir para a eliminação dos obstáculos ao desenvolvimento de novas actividades
    económicas em certas zonas afectadas pela reestruturação da indústria da construção
    naval
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2617/80 del Consejo, de 7 de octubre de 1980, por
    el que se establece una acción comunitaria específica de desarrollo regional
    que contribuya a eliminar los obstáculos al desarrollo de nuevas actividades
    económicas en determinadas zonas afectadas por la reestructuración de la construcción
    naval
  type: main
