title:
- language: en
  script: Latn
  content: '2014/288/EU: Commission Implementing Decision of 12 May 2014 as regards
    the standard reporting requirements for national programmes for the eradication,
    control and monitoring of certain animal diseases and zoonoses co-financed by
    the Union and repealing Decision 2008/940/EC (notified under document C(2014)
    2976)'
  type: main
- language: fr
  script: Latn
  content: '2014/288/UE: Décision d''exécution de la Commission du 12 mai 2014 en
