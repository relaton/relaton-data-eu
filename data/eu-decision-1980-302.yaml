title:
- language: en
  script: Latn
  content: '80/302/EEC: Commission Decision of 25 February 1980 amending Decision
    76/653/EEC authorizing the Kingdom of Denmark and the French Republic to certify
    seed of certain species of cereals, under special conditions (Only the French
    and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/302/CEE: Décision de la Commission, du 25 février 1980, modifiant
    la décision 76/653/CEE autorisant le Royaume du Danemark et la République française
    à certifier les semences de certaines espèces de céréales dans des conditions
    particulières (Les textes en langues française et danoise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/302/EWG: Entscheidung der Kommission vom 25. Februar 1980 zur Änderung
    der Entscheidung 76/653/EWG zur Ermächtigung des Königreichs Dänemark und der
    Französischen Republik, Saatgut einiger Getreidearten unter besonderen Bedingungen
    anzuerkennen (Nur der französische und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/302/EØF: Kommissionens beslutning af 25. februar 1980 om ændring
    af beslutning 76/653/EØF om bemyndigelse til kongeriget Danmark og Den franske
    Republik til at certificere sædekorn af visse kornarter på særlige betingelser
    (Kun den franske og danske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/302/CEE: Decisione della Commissione, del 25 febbraio 1980, recante
    modifica della decisione 76/653/CEE che autorizza il Regno di Danimarca e la Repubblica
    francese a certificare le sementi di alcune specie di cereali in particolari condizioni
    (I testi in lingua francese e danese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/302/EEG: Beschikking van de Commissie van 25 februari 1980 houdende
    wijziging van Beschikking 76/653/EEG tot machtiging van het Koninkrijk Denemarken
    en de Franse Republiek om zaad van sommige graansoorten op bepaalde voorwaarden
    te certificeren (Slechts de teksten in de Franse en de Deense taal zijn authentiek)'
