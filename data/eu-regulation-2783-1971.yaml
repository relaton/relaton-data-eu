title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2783/71 du Conseil, du 20 décembre 1971, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de raisins secs présentés en emballages immédiats d'un contenu net inférieur
    ou égal à 15 kilogrammes, de la position 08.04 B I du tarif douanier commun,
    originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2783/71 des Rates vom 20. Dezember 1971 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete
    Weintrauben, in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von
    15 kg oder weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs, mit
    Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2783/71 del Consiglio, del 20 dicembre 1971, relativo
    all'apertura, alla suddivisione ed alle modalità di gestione del contingente
    tariffario comunitario di uve secche, presentate in imballaggi immediati di contenuto
    netto di 15 kg o meno della voce 08.04 B I della tariffa doganale comune, originarie
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2783/71 van de Raad van 20 december 1971 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor rozijnen en krenten, in verpakkingen met een netto- inhoud per onmiddellijke
    verpakking van 15 kilogram of minder, van post 08.04 B I van het gemeenschappelijk
    douanetarief, van oorsprong uit Spanje
  type: main
