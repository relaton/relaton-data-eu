title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2041/72 de la Commission, du 26 septembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux résistances non chauffantes, potentiomètres et rhéostats de la sous-position
    tarifaire 85.12 B, originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2041/72 der Kommission vom 26. September 1972 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Fest- und Stellwiderstände
    (einschließlich Spannungsteiler, ausgenommen Heizwiderstände), der Tarifnummer
    85.19 B, mit Ursprung in Brasilien, denen die in der Verordnung (EWG) Nr. 2795/71
    des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2041/72 della Commissione, del 26 settembre 1972,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    alle resistenze non scaldanti, potenziometri e reostati, della sottovoce doganale
    n. 85.19 B originari del Brasile, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2041/72 van de Commissie van 26 september 1972 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op weerstanden (andere dan verwarmingsweerstanden), potentiometers
    en reostaten, van onderverdeling 85.19 B, van oorsprong uit Brazilië ten behoeve
    waarvan bij Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 algemene
    tariefpreferenties werden geopend
  type: main
