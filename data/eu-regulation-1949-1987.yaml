title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1949/87 of 3 July 1987 laying down the level
    of the accession compensatory amounts for milk and milk products applicable for
    the 1897/88 milk year in trade with Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1949/87 de la Commission, du 3 juillet 1987, arrêtant
    dans le secteur du lait et des produits laitiers le niveau des montants compensatoires
    «adhésion» dans les échanges avec l'Espagne applicables lors de la campagne
    laitière 1987/1988
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1949/87 der Kommission vom 3. Juli 1987 zur Festsetzung
    der Beitrittsausgleichsbeträge für Milch und Milcherzeugnisse im Handel mit
    Spanien für das Wirtschaftsjahr 1987/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1949/87 af 3. juli 1987 om fastsættelse
    af tiltrædelsesudligningsbeløbene for mælk og mejeriprodukter i samhandelen
    med Spanien for mejeriåret 1987/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1949/87 της Επιτροπής
    της 3ης Ιουλίου 1987 με του οποίο αποφασίζεται,
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, το ύψος των εξισωτικών ποσών προσχώρησης
    στις εμπορικές συναλλαγές με την Ισπανία που
    εφαρμόζονται κατά τη γαλακτοκομική περίοδο
    1987/88
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1949/87 della Commissione, del 3 luglio 1987, che
    fissa, nel settore del latte e dei prodotti lattiero-caseari, il livello degli
    importi compensativi adesione negli scambi con la Spagna applicabili nella campagna
    lattiera 1987/1988
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1949/87 van de Commissie van 3 juli 1987 tot vaststelling
    in de sector melk en zuivelprodukten van het niveau van de in het melkprijsjaar
    1987/ 1988 toe te passen compenserende bedragen toetreding in het handelsverkeer
    met Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1949/87 da Comissão, de 3 de Julho de 1987, que
