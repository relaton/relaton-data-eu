type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3006/76 of 10 December 1976 re-establishing
    the levying of customs duties on building board of wood pulp or of vegetable fibre,
    etc., falling within heading No 48.09, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3006/76 de la Commission, du 10 décembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux plaques
    pour constructions, en pâte à papier, en bois défibrés ou en végétaux divers
    défibrés, etc., de la position tarifaire 48.09, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3006/76 der Kommission vom 10. Dezember 1976 zur Wiedereinführung
    des Zollsatzes für Bauplatten aus Papierhalbstoff, aus Fasern von Holz oder von
    anderen pflanzlichen Stoffen usw., der Tarifnummer 48.09, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3006/76 af 10. december 1976 om genindførelse
    af opkrævning af toldafgifter for byggeplader af papirmasse, træfibre eller
    andre vegetabilske fibre, etc. under position 48.09, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3006/76 della Commissione, del 10 dicembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle lastre per costruzioni,
    di pasta di carta, di legno sfibrato o di vegetali diversi sfibrati, ecc., della
    voce doganale 48.09, originarie dei paesi in via di sviluppo, beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3006/76 van de Commissie van 10 december 1976 houdende
    wederinstelling van de heffing van de douanerechten voor platen voor constructiedoeleinden,
    van papierstof, van houtvezels of van andere plantaardige vezels, enz., van post
    48.09, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3010/75 van de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
