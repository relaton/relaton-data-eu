    personas que han perpetrado actos de violencia durante los incidentes en Mostar
    el 10 de febrero de 1997
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (Gusp) 2018/458 av den 19 mars 2018 om upphävande av gemensam
    ståndpunkt 97/193/Gusp om restriktiva åtgärder riktade mot personer som begått
    våldshandlingar under händelserna i Mostar den 10 februari 1997
