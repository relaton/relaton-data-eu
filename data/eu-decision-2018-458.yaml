    kuras izdarījušas vardarbības aktus Mostarā notikušajos incidentos 1997.
    gada 10. februārī
  type: main
- language: lt
  script: Latn
  content: 2018 m. kovo 19 d. Tarybos sprendimas (BUSP) 2018/458, kuriuo panaikinama
    Bendroji pozicija 97/193/BUSP dėl apribojimų asmenims, įvykdžiusiems smurto
    aktus per įvykius Mostare 1997 m. vasario 10 d.
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (PESK) 2018/458 tad-19 ta' Marzu 2018 li tħassar
    il-Pożizzjoni Komuni 97/193/PESK dwar miżuri restrittivi mmirati lejn persuni
    li wettqu atti vjolenti fl-inċidenti ta' Mostar nhar l-10 ta' Frar 1997
  type: main
- language: nl
  script: Latn
  content: Besluit (GBVB) 2018/458 van de Raad van 19 maart 2018 tot intrekking van
    Gemeenschappelijk Standpunt 97/193/GBVB inzake beperkende maatregelen tegen personen
    die tijdens de incidenten te Mostar op 10 februari 1997 geweld hebben gepleegd
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (WPZiB) 2018/458 z dnia 19 marca 2018 r. uchylająca wspólne
    stanowisko 97/193/WPZiB w sprawie środków ograniczających skierowanych przeciwko
    osobom, które dokonały aktów przemocy podczas wypadków w Mostarze 10 lutego
    1997 r.
  type: main
- language: pt
  script: Latn
  content: Decisão (PESC) 2018/458 do Conselho, de 19 de março de 2018, que revoga
    a Posição Comum 97/193/PESC sobre as medidas restritivas a aplicar aos autores
    de atos de violência cometidos aquando dos incidentes ocorridos em Mostar a 10
    de fevereiro de 1997
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2018/458 a Consiliului din 19 martie 2018 de abrogare a
    Poziției comune 97/193/PESC referitoare la măsurile restrictive îndreptate
    împotriva persoanelor care au comis acte de violență în cursul incidentelor
    de la Mostar din 10 februarie 1997
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (SZBP) 2018/458 z 19. marca 2018, ktorým sa zrušuje
    spoločná pozícia 97/193/SZBP o reštriktívnych opatreniach zameraných na
    osoby, ktoré sa dopustili násilných činov počas konfliktov v Mostare 10.
    februára 1997
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (SZVP) 2018/458 z dne 19. marca 2018 o razveljavitvi Skupnega
    stališča 97/193/SZVP o omejevalnih ukrepih proti osebam, ki so med incidenti
    v Mostarju 10. februarja 1997 izvajale nasilna dejanja
  type: main
- language: es
  script: Latn
  content: Decisión (PESC) 2018/458 del Consejo, de 19 de marzo de 2018, por la que
