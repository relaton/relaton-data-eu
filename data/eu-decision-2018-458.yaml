title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2018/458 of 19 March 2018 repealing Common Position
    97/193/CFSP on restrictive measures aimed at persons having perpetrated violent
    acts during the incidents in Mostar on 10 February 1997
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2018/458 du Conseil du 19 mars 2018 abrogeant la position
    commune 97/193/PESC relative à des mesures restrictives à prendre à l'encontre
    des personnes ayant commis des actes de violence lors des incidents de Mostar
    du 10 février 1997
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2018/458 des Rates vom 19. März 2018 zur Aufhebung des
    Gemeinsamen Standpunkts 97/193/GASP zu restriktiven Maßnahmen gegenüber den
    Personen, die während der Vorfälle in Mostar am 10. Februar 1997 Gewalttaten
    begangen haben
  type: main
- language: bg
  script: Cyrl
  content: Решение (ОВППС) 2018/458 на Съвета от 19 март
    2018 година за отмяна на Обща позиция 97/193/ОВППС
    относно прилагането на ограничителни мерки
    срещу лицата, извършили насилствени действия
    при инцидентите в Mostar на 10 февруари 1997 година
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (SZBP) 2018/458 ze dne 19. března 2018 o zrušení společného
    postoje 97/193/SZBP o omezujících opatřeních vůči osobám, které se dopustily
    násilných činů během incidentů v Mostaru dne 10. února 1997
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (FUSP) 2018/458 af 19. marts 2018 om ophævelse af fælles
    holdning 97/193/FUSP om restriktive foranstaltninger mod de personer, der begik
    voldshandlinger under episoderne i Mostar den 10. februar 1997
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΚΕΠΠΑ) 2018/458 του Συμβουλίου, της
    19ης Μαρτίου 2018, για την κατάργηση της κοινής
    θέσης 97/193/ΚΕΠΠΑ σχετικά με τη λήψη περιοριστικών
    μέτρων έναντι ατόμων που διέπραξαν βιαιότητες
    στη διάρκεια των επεισοδίων του Μοστάρ στις
    10 Φεβρουαρίου 1997
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (ÜVJP) 2018/458, 19. märts 2018, millega tunnistatakse
    kehtetuks ühine seisukoht 97/193/ÜVJP Mostari sündmuste käigus 10. veebruaril
    1997. aastal vägivallaakte toime pannud isikute suhtes rakendatavate piiravate
    meetmete kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (YUTP) 2018/458, annettu 19 päivänä maaliskuuta
    2018, Mostarin tapahtumien aikana 10 päivänä helmikuuta 1997 väkivaltaisiin
    tekoihin syyllistyneitä henkilöitä koskevista rajoittavista toimenpiteistä
    määritellyn yhteisen kannan 97/193/YUTP kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (ZVSP) 2018/458 od 19. ožujka 2018. o stavljanju izvan
    snage Zajedničkog stajališta 97/193/ZVSP o mjerama ograničavanja usmjerenim
    protiv osoba koje su počinile djela nasilja tijekom događaja u Mostaru 10. veljače
    1997.
  type: main
- language: hu
  script: Latn
  content: A Tanács (KKBP) 2018/458 határozata (2018. március 19.) az 1997. február
    10-i mostari események idején erőszakos cselekményeket elkövető személyekkel
    szemben meghozandó korlátozó intézkedésekről a 97/193//KKBP közös álláspont
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2018/458 del Consiglio, del 19 marzo 2018, che abroga
    la posizione comune 97/193/PESC su provvedimenti restrittivi nei confronti di
    persone che hanno commesso atti di violenza durante gli incidenti di Mostar il
    10 febbraio 1997
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (KĀDP) 2018/458 (2018. gada 19. marts), ar ko atceļ Kopējo
