    Kanado, Združeno kraljestvo in Združene države Amerike na seznamih tretjih
    držav, njihovih ozemelj ali območij, s katerih je dovoljen vstop pošiljk perutnine,
    zarodnega materiala perutnine ter svežega mesa perutnine in pernate divjadi v
    Unijo
  type: main
