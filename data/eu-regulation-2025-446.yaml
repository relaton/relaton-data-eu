    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Bosnia y Herzegovina,
    a Canadá, al Reino Unido y a los Estados Unidos en las listas de terceros países,
    territorios o zonas de estos, desde los que se permite la entrada en la Unión
    de partidas de aves de corral, productos reproductivos de aves de corral y carne
    fresca de aves de corral y de aves de caza
  type: main
