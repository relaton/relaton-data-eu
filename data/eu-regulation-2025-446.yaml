    la Canada, la Regatul Unit și la Statele Unite din listele conținând țările
    terțe, teritoriile sau zonele lor care sunt autorizate pentru introducerea în
    Uniune a transporturilor de păsări de curte, de materiale germinative provenite
    de la păsări de curte și de carne proaspătă provenită de la păsări de
    curte și de la vânat cu pene
  type: main
