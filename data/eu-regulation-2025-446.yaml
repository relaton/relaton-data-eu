    Amerikos Valstijoms skirtų įrašų trečiųjų šalių, teritorijų arba jų
    zonų, iš kurių į Sąjungą leidžiama įvežti naminių paukščių, naminių
    paukščių genetinės medžiagos produktų ir naminių paukščių bei medžiojamųjų
