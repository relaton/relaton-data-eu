title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1120/84 of 24 April 1984 re-establishing
    the levying of customs duties on certain diodes, transistors and similar semi-conductor
    devices and to certain parts, falling within subheadings 85.21 D and E and originating
    in the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1120/84 de la Commission du 24 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certaines diodes, transistors
    et dispositifs similaires ainsi qu' à certaines parties et pièces détachées,
    des sous-positions 85.21 D et E du tarif douanier commun, originaires des Philippines,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1120/84 der Kommission vom 24. April 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Dioden, Transistoren und ähnliche Halbleiter
    und für bestimmte Teile der Tarifstellen 85.21 D und E mit Ursprung in den Philippinen,
    denen die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1120/84 af 24. april 1984 om genindførelse
    af opkrævning af told for bestemte dioder, transistorer og lignende halvlederkomponenter,
    bestemte dele, henhørende under pos. 85.21 D, E og med oprindelse i Filippinerne,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1120/84 της Επιτροπής
    της 24ης Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένες διόδους,
    κρυσταλλολυχνίες και παρόμοιες διατάξεις,
    καθώς και για ορισμένα μέρη και μεμονωμένα
    τεμάχια, των διακρίσεων 85.21 Δ και Ε του Κοινού
    Δασμολογίου, καταγωγής Φιλιππίνων, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1120/84 della Commissione del 24 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni diodi, transistori e simili
    dispositivi e alcune parti e pezzi staccati, delle sottovoci 85.21 D ed E della
    tariffa doganale comune, originari delle Filippine beneficiarie delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1120/84 van de Commissie van 24 april 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde dioden,
    transistors en dergelijke halfgeleiderelementen en bepaalde delen en onderdelen,
    van de tariefpostonderverdelingen 85.21 D en E, van oorsprong uit de Filippijnen
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
