title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1224/92 of 12 May 1992 re-establishing the
    levying of customs duties on products falling within CN code 3923 21 00, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1224/92 de la Commission du 12 mai 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 3923
    21 00 originaires de la Thaïlande bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1224/92 DER KOMMISSION vom 12. Mai 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3923 21 00 mit Ursprung in
    Thailand, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1224/92 af 12. maj 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3923 21 00 og med oprindelse
    i Thailand, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1224/92 της Επιτροπής
    της 12ης Μαΐου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα του κωδικού
    ΣΟ 3923 21 00, καταγωγής Ταϊλάνδης, δικαιούχου των
    προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ. 3831/90
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1224/92 DELLA COMMISSIONE del 12 maggio 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 3923 21 00, originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1224/92 VAN DE COMMISSIE van 12 mei 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3923 21 00, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1224/92 DA COMISSÃO de 12 de Maio de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 3923
    21 00, originários da Tailândia, beneficiários das preferências pautais previstas
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1224/92 DE LA COMISIÓN de 12 de mayo de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 3923 21 00 originarios de Tailandia, beneficiarios de
    las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90 del
    Consejo #'
