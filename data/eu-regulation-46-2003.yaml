title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 46/2003 of 10 January 2003 amending the marketing
    standards for fresh fruit and vegetables as regards mixes of different types of
    fresh fruit and vegetables in the same sales package
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 46/2003 de la Commission du 10 janvier 2003 modifiant
    les normes de commercialisation applicables aux fruits et légumes frais, en ce
    qui concerne les mélanges de fruits et légumes frais de différentes espèces
    dans un même emballage de vente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 46/2003 der Kommission vom 10. Januar 2003 zur Änderung
    der Vermarktungsnormen für frisches Obst und Gemüse hinsichtlich Mischungen
    von frischem Obst und Gemüse unterschiedlicher Arten in einer Verkaufsverpackung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 46/2003 на Комисията от 10 януари
    2003 година за изменение на стандартите за търговия
    с пресни плодове и зеленчуци по отношение на
    смесите от пресни плодове и зеленчуци от различни
    видове в една и съща търговска опаковка
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 46/2003 ze dne 10. ledna 2003, kterým se mění
    obchodní normy pro čerstvé ovoce a zeleninu, pokud jde o směsi různých druhů
    čerstvého ovoce a zeleniny v jednom maloobchodním balení
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 46/2003 af 10. januar 2003 om ændring
    af handelsnormerne for friske frugter og grøntsager for så vidt angår blandinger
    af friske frugter og grøntsager af forskellige arter i samme salgspakning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 46/2003 της Επιτροπής,
    της 10ης Ιανουαρίου 2003, για την τροποποίηση
    των προδιαγραφών εμπορίας που εφαρμόζονται
    στα νωπά οπωροκηπευτικά, όσον αφορά τα μείγματα
    διαφορετικών ειδών νωπών οπωροκηπευτικών
    στην ίδια συﾃκευασία πώλησης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 46/2003, 10. jaanuar 2003, millega muudetakse
    värske puu- ja köögivilja turustusnorme samas müügipakendis olevate eri tüüpi
    värske puu- ja köögivilja segude osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 46/2003, annettu 10 päivänä tammikuuta 2003,
    tuoreisiin hedelmiin ja vihanneksiin sovellettavien kaupan pitämistä koskevien
    vaatimusten muuttamisesta samassa myyntipakkauksessa olevien erilajisten tuoreiden
    hedelmien ja vihannesten sekoitusten osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 46/2003/EK rendelete (2003. január 10.) a friss gyümölcs-
    és zöldségfélékre vonatkozó forgalmazási előírásoknak az egyazon kereskedelmi
    csomagban kiszerelt különböző friss gyümölcs- és zöldségfélék keverékei
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 46/2003 della Commissione, del 10 gennaio 2003, che
    modifica le norme di commercializzazione applicabili ai prodotti ortofrutticoli
    freschi per quanto riguarda i miscugli di ortofrutticoli freschi di specie differenti
    contenuti in uno stesso imballaggio di vendita
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 46/2003 (2003. gada 10. janvāris), ar ko groza
    svaigu augļu un dārzeņu tirdzniecības standartus attiecībā uz dažāda veida
    svaigu augļu un dārzeņu maisījumu vienā tirdzniecības iepakojumā
  type: main
- language: lt
  script: Latn
  content: 2003 m. sausio 10 d. Komisijos reglamentas (EB) Nr. 46/2003, iš dalies
    pakeičiantis šviežių vaisių ir daržovių prekybos standartus, taikomus toje
    pačioje prekinėje pakuotėje esantiems įvairių rūšių vaisių bei daržovių
    mišiniams
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 46/2003 tal-10 ta’ Jannar 2003
    li jemenda l-livelli tas-suq ta’ frott u ħaxix frisk dwar it-taħlit ta’
    diversi tipi ta’ frott u ħaxix frisk fl-istess pakkett ta’ bejgħ
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 46/2003 van de Commissie van 10 januari 2003 tot wĳziging
    van de handelsnormen voor verse groenten en fruit ten aanzien van de mengsels
    van verschillende soorten verse groenten en fruit in eenzelfde verkoopverpakking
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 46/2003 z dnia 10 stycznia 2003 r. zmieniające
    normy handlowe dla świeżych owoców i warzyw w odniesieniu do mieszanek różnych
    rodzajów świeżych owoców i warzyw w tych samych opakowaniach przeznaczonych
    do sprzedaży
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 46/2003 da Comissão, de 10 de Janeiro de 2003, que
    altera as normas de comercialização aplicáveis às frutas e produtos hortícolas
    frescos, no que respeita às misturas de frutas e produtos hortícolas frescos
    de diferentes espécies na mesma embalagem de venda
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 46/2003 al Comisiei din 10 ianuarie 2003 de modificare
    a standardelor de comercializare care se aplică fructelor și legumelor proaspete,
    privind amestecul de fructe și legume proaspete de diferite soiuri în același
    ambalaj de comercializare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 46/2003 z 10. januára 2003, ktoré mení a
    dopĺňa obchodné normy pre čerstvé ovocie a zeleninu, čo sa týka zmesí
    rôznych druhov čerstvého ovocia a zeleniny v tom istom predajnom obale
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 46/2003 z dne 10. januarja 2003 o spremembi tržnih
    standardov za sveže sadje in zelenjavo glede mešanic različnih vrst svežega
    sadja in zelenjave v isti prodajni enoti pakiranja
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 46/2003 de la Comisión, de 10 de enero de 2003, por
    el que se modifican las normas de comercialización aplicables a las frutas y
    hortalizas frescas en lo que respecta a las mezclas de frutas y hortalizas frescas
    de diferentes especies contenidas en un mismo envase de venta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 46/2003 av den 10 januari 2003 om ändring
    av handelsnormer för färsk frukt och färska grönsaker när det gäller blandningar
    av färsk frukt och färska grönsaker av olika arter i samma förpackning
  type: main
