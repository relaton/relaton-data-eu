    un integrēto administrēšanas un kontroles sistēmu, kura paredzēta Padomes
    Regulā (EK) Nr. 1782/2003, ar ko ievieš kopīgus tiešā atbalsta shēmu noteikumus
    saskaņā ar kopējo lauksaimniecības politiku un izveido dažas atbalsta shēmas
    lauksaimniekiem
  type: main
