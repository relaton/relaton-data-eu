  type: main
- language: hu
  script: Latn
  content: A Tanács 1886/2004/EK rendelete (2004. október 25.) az 1796/1999/EK tanácsi
    rendelet által a többek között a Kínai Népköztársaságból származó
    acél drótkötelek és -kábelek behozatalára vonatkozó végleges dömpingellenes
    vám kiterjesztéséről a Marokkóban feladott – függetlenül attól, hogy
    azokat Marokkóból származóként jelentik-e be vagy sem – acél drótkötelek
    és -kábelek behozatalára, továbbá egy marokkói exportőrtől származó
    behozatalok tekintetében végzett vizsgálat befejezéséről
