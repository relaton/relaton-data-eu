title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1886/2004 of 25 October 2004 extending the definitive
    anti-dumping duty imposed by Council Regulation (EC) No 1796/1999 on imports of
    steel ropes and cables originating, inter alia, in the People's Republic of China
    to imports of steel ropes and cables consigned from Morocco, whether declared
    as originating in Morocco or not, and terminating the investigation in respect
    of imports from one Moroccan exporter
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1886/2004 du Conseil du 25 octobre 2004 portant extension
    du droit antidumping définitif institué par le règlement (CE) n° 1796/1999
    sur les importations de câbles en acier originaires, entre autres, de la République
    populaire de Chine aux importations de câbles en acier expédiés du Maroc, qu’ils
    aient ou non été déclarés originaires de ce pays, et clôturant l’enquête
    concernant un exportateur marocain
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1886/2004 des Rates vom 25. Oktober 2004 zur Ausweitung
