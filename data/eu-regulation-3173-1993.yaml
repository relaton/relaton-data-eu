  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3173/93 DELLA COMMISSIONE del 18 novembre 1993 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine disossate da taluni organismi d' intervento e destinate all' esportazione
    verso talune destinazioni e recante abrogazione dei regolamenti (CEE) n. 618/92
    e (CEE) n. 2582/93
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3173/93 VAN DE COMMISSIE van 18 november 1993 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar bepaalde
    bestemmingen bestemd rundvlees zonder been en houdende intrekking van de Verordeningen
    (EEG) nr. 618/92 en (EEG) nr. 2582/93
  type: main
