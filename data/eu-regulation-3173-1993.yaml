    de viandes bovines désossées détenues par certains organismes d'intervention
    et destinées à être exportées vers certaines destinations et abrogeant les
    règlements (CEE) n° 618/92 et (CEE) n 2582/93
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3173/93 DER KOMMISSION vom 18. November 1993 über
    den Verkauf von Interventionsrindfleisch ohne Knochen zur Ausfuhr nach gewissen
    Bestimmungsländern nach der Verordnung (EWG) Nr. 2539/84 und zur Aufhebung der
    Verordnungen (EWG) Nr. 618/92 und (EWG) Nr. 2582/93
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3173/93 af 18. november 1993 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af udbenet oksekød fra visse
    interventionsorganer med henblik på eksport til visse bestemmelsessteder og om
    ophævelse af forordning (EØF) nr. 618/92 og (EØF) nr. 2582/93
  type: main
- language: el
  script: Grek
