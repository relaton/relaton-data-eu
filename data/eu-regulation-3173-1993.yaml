  content: COMMISSION REGULATION (EC) No 3173/93 of 18 November 1993 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of boneless beef held by
    certain intervention agencies and intended for export to certain destinations,
    repeating Regulations (EEC) No 618/92 and (EEC) No 2582/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3173/93 de la Commission du 18 novembre 1993 relatif
