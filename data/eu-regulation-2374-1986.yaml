  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2374/86 del Consiglio del 24 luglio 1986 recante quarta
    modifica del regolamento (CEE) n. 3721/85 che fissa, per alcune popolazioni e
    gruppi di popolazioni ittiche, il totale delle catture ammissibile per il 1986
    ed alcune condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2374/86 van de Raad van 24 juli 1986 houdende vierde
    wijziging van Verordening (EEG) nr. 3721/85 inzake de vaststelling van de voor
    1986 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2374/86 do Conselho de 24 de Julho de 1986 que altera
    pela quarta vez o Regulamento (CEE) n.° 3721/85 que fixa, relativamente a certas
    unidades populacionais ou grupos de unidades populacionais de peixes, os totais
    admissíveis de capturas para 1986 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2374/86 del Consejo de 24 de julio de 1986 que modifica
