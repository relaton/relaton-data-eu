title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3206/94 of 22 December 1994 establishing,
    for 1995, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3206/94 de la Commission, du 22 décembre 1994, établissant
    pour 1995 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l' aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3206/94 der Kommission vom 22. Dezember 1994 zur Festlegung
    der Liste für 1995 der Schiffe mit einer Länge über alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3206/94 af 22. december 1994 om listen
    for 1995 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3206/94 της Επιτροπής
    της 22ας Δεκεμβρίου 1994 που καταρτίζει, για το
    1995, τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 3206/94, annettu 22 päivänä joulukuuta 1994,
    vuodeksi 1995 laaditusta alusluettelosta sellaisten alusten osalta, joiden kokonaispituus
    ylittää kahdeksan metriä ja joilla on lupa pyytää kielikampelaa tietyillä
    yhteisön vyöhykkeillä kokonaispituudeltaan yhdeksän metriä ylittävien puomitroolien
    avulla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3206/94 della Commissione, del 22 dicembre 1994, che
    fissa l' elenco per il 1995 dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i nove
    metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3206/94 van de Commissie van 22 december 1994 tot
    vaststelling voor 1995 van de lijst van vaartuigen met een lengte over alles van
    meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan
    de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3206/94 da Comissão, de 22 de Dezembro de 1994, que
    estabelece para 1995 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3206/94 de la Comisión, de 22 de diciembre de 1994,
    por el que se establece para 1995 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 3206/94 av den 22 december 1994 om fastställande
    för 1995 av förteckningen över de fartyg med en största längd som överstiger
    åtta meter vilka vid fiske efter tunga inom vissa av gemenskapens områden har
    tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger nio
    meter
  type: main
