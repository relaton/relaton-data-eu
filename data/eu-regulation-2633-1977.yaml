title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2633/77 of 29 November 1977 fixing the selling
    prices for certain types of frozen beef made available to the Italian intervention
    agency under Regulation (EEC) No 2453/76 and amending Regulations (EEC) No 2875/76
    and (EEC) No 35/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2633/77 de la Commission, du 29 novembre 1977, fixant
    les prix de vente de certaines viandes bovines congelées mises à la disposition
    de l' organisme d' intervention italien en vertu du règlement (CEE) n° 2453/76
    et modifiant les règlements (CEE) n° 2875/76 et (CEE) n° 35/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2633/77 der Kommission vom 29. November 1977 zur Festsetzung
    der Verkaufspreise für bestimmtes gefrorenes Rindfleisch, das der italienischen
    Interventionsstelle gemäß der Verordnung (EWG) Nr. 2453/76 zur Verfügung gestellt
    wurde, und zur Änderung der Verordnungen (EWG) Nr. 2875/76 und (EWG) Nr. 35/77
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2633/77 af 29. november 1977 om fastsættelse
    af salgspriser for visse former for frosset oksekød, der stilles til rådighed
    for det italienske interventionsorgan i medfør af forordning (EØF) nr. 2453/76,
    og om ændring af forordning (EØF) nr. 2875/76 og (EØF) nr. 35/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2633/77 della Commissione, del 29 novembre 1977, che
    fissa i prezzi di vendita di determinate carni bovine congelate messe a disposizione
    dell' organismo d' intervento italiano a norma del regolamento (CEE) n. 2453/76
    e modifica i regolamenti (CEE) n. 2875/76 e (CEE) n. 35/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2633/77 van de Commissie van 29 november 1977 tot
    vaststelling van de verkoopprijzen van bepaalde soorten bevroren rundvlees die
    op grond van Verordening (EEG) nr. 2453/76 ter beschikking van het Italiaanse
    interventiebureau zijn gesteld en tot wijziging van Verordeningen (EEG) nrs. 2875/76
    en 35/77
