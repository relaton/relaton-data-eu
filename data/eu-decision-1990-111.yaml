id: EUDecision1990111
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/111/EEC: Commission Decision of 19 February 1990 amending Decision
    84/248/EEC authorizing the Federal Republic of Germany to adopt, when introducing
    into its territory plants or plant products, special plant health provisions for
    home-grown production of certain fruit plants intended for planting (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/111/CEE: Décision de la Commission du 19 février 1990 modifiant la
    décision 84/248/CEE autorisant la République fédérale d''Allemagne à arrêter,
    lors de l''introduction sur son territoire de végétaux ou de produits végétaux,
    des dispositions phytosanitaires fixées pour la production indigène de certains
    végétaux, des dispositions phytosanitaires fixées pour la production indigène
    de certains végétaux d''espèces fruitières destinés à être plantés (Le
    texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '90/111/EWG: Entscheidung der Kommission vom 19. Februar 1990 zur Änderung
    der Entscheidung 84/248/EWG zur Ermächtigung der Bundesrepublik Deutschland,
    beim Verbringen von Pflanzen oder Pflanzenerzeugnissen in ihr Gebiet besondere
    Pflanzenschutzmassnahmen zu treffen, die für die einheimische Erzeugung von einigen
    zum Anpflanzen bestimmten Obstpflanzen vorgesehen sind (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/111/EØF: Kommissionens beslutning af 19. februar 1990 om aendring
    af beslutning 84/248/EØF om bemyndigelse af Forbundsrepublikken Tyskland til
    for planter og planteprodukter, der indfoeres paa dens omraade, at anvende de
    saerlige plantesundhedsbestemmelser, som er gaeldende for den indenlandske produktion
    af visse frugtbaerende planter bestemt til udplantning (Kun den tyske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/111/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Φεβρουαρίου 1990 για την τροποποίηση της απόφασης
    84/248/ΕΟΚ με την οποία εξουσιοδοτείται η Ομοσπονδιακή
    Δημοκρατία της Γερμανίας να θεσπίσει, κατά
    την εισαγωγή στο έδαφός της φυτών και φυτικών
    προϊόντων, ειδικά φυτοϋγειονομικά μέτρα για
    την εγχώρια παραγωγή ορισμένων οπωροφόρων
    που προορίζονται για φύτευση (Το κείμενο στην
    γερμανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/111/CEE: Decisione della Commissione del 19 febbraio 1990 recante modifica
    della decisione 84/248/CEE che autorizza la Repubblica federale di Germania ad
    adottare, all''atto dell''introduzione nel suo territorio di vegetali o prodotti
    vegetali, disposizioni fitosanitarie particolari previste per la produzione locale
    di determinati vegetali da frutto destinati alla piantagione (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/111/EEG: Beschikking van de Commissie van 19 februari 1990 houdende
    wijziging van Beschikking 84/248/EEG tot machtiging van de Bondsrepubliek Duitsland
    om, bij het binnenbrengen op zijn grondgebied van planten of plantaardige produkten,
    de bijzondere fytosanitaire maatregelen toe te passen, die voor de binnenlandse
    produktie van plantgoed van bepaalde, voor opplant bestemde fruitgewassen gelden
    (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/111/CEE: Decisão da Comissão de 19 de Fevereiro de 1990 que altera
    a Decisao 84/248/CEE, que autoriza a Republica Federal da Alemanha a adoptar,
    aquando da introduçao de plantas e produtos vegetais no seu territorio, disposiçoes
    fitossanitarias especiais aplicaveis à produçao interna de determinadas fruteiras
    destinadas à plantaçao (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '90/111/CEE: Decisión de la Comisión de 19 de febrero de 1990 que modifica
    la Decision 84/248/CEE por la que se autoriza a la Republica Federal de Alemania
    a adoptar, en el momento de la introduccion en su territorio de vegetales o productos
    vegetales, disposiciones fitosanitarias especiales para la produccion autoctona
    de determinados vegetales de especies frutales destinados a ser plantados (El
    texto en lengua alemana es el único auténtico)'
