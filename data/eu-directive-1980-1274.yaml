  script: Latn
  content: Direktiva Sveta z dne 22. decembra 1980 o spremembi Direktive 64/432/EGS
    o problemih zdravstvenega varstva živali, ki vplivajo na trgovino z govedom in
    prašiči med državami članicami Skupnosti, ter Direktive 80/217/EGS o uvedbi
    ukrepov Skupnosti za zatiranje klasične prašičje kuge zaradi pristopa Grčije
  type: main
- language: es
  script: Latn
  content: Directiva 80/1274/CEE del Consejo, de 22 de diciembre de 1980, por la que
