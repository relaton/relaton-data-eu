    įtakos Bendrijos vidaus prekybai galvijais ir kiaulėmis ir Direktyvą 80/217/EEB,
    įdiegiančią Bendrijos priemones klasikiniam kiaulių marui kontroliuoti
  type: main
- language: mt
  script: Latn
