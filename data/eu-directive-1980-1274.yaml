    i svinjama unutar Zajednice i Direktive 80/217/EEZ o uvođenju mjera Zajednice
    za kontrolu klasične svinjske kuge radi pristupanja Grčke'
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1980. december 22.) a szarvasmarhafélék és sertések
