    szóló 64/432/EGK irányelvnek, valamint a klasszikus sertéspestis elleni védekezésre
    irányuló közösségi intézkedések bevezetéséről szóló 80/217/EGK irányelvnek
    Görögország csatlakozása következtében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 80/1274/CEE del Consiglio, del 22 dicembre 1980, che modifica,
    in seguito all'adesione della Grecia, la direttiva 64/432/CEE relativa a problemi
    di polizia sanitaria in materia di scambi intracomunitari di animali della specie
    bovina e suina e la direttiva 80/217/CEE che stabilisce le misure comunitarie
    di lotta contro le peste suina classica
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1980. gada 22. decembris), ar kuru pēc Grieķijas
    pievienošanās groza Direktīvu 64/432/EEK par dzīvnieku veselības problēmām,
    kas ietekmē Kopienas iekšējo tirdzniecību ar liellopiem un cūkām, un Direktīvu
    80/217/EEK, ar ko ievieš Kopienas pasākumus, lai kontrolētu klasisko cūku
    mēri
  type: main
- language: lt
  script: Latn
  content: 1980 m. gruodžio 22 d. Tarybos direktyva, iš dalies keičianti, po Graikijos
