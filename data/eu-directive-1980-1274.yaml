    de l'adhésion de la Grèce, la directive 64/432/CEE relative à des problèmes
    de police sanitaire en matière d'échanges intracommunautaires d'animaux des
    espèces bovine et porcine et la directive 80/217/CEE établissant des mesures
    communautaires de lutte contre la peste porcine classique
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/1274/EWG des Rates vom 22. Dezember 1980 zur Änderung aufgrund
