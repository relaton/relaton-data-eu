    a prasaty uvnitř Společenství a směrnice 80/217/EHS, kterou se zavádějí
    opatření Společenství pro tlumení klasického moru prasat
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/1274/EØF af 22. december 1980 om ændring, som følge
