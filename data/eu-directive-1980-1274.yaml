    het intracommunautaire handelsverkeer in runderen en varkens en Richtlijn 80/217/EEG
    tot vaststelling van gemeenschappelijke maatregelen ter bestrijding van klassieke
    varkenspest ingevolge de toetreding van Griekenland
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 22 grudnia 1980 r. zmieniająca, w następstwie przystąpienia
    Grecji, dyrektywę 64/432/EWG w sprawie problemów zdrowotnych zwierząt wpływających
    na handel wewnątrzwspólnotowy bydłem i trzodą chlewną oraz dyrektywę 80/217/EWG
    wprowadzającą wspólnotowe środki zwalczania klasycznego pomoru świń
  type: main
- language: pt
  script: Latn
  content: Directiva 80/1274/CEE do Conselho, de 22 de Dezembro de 1980, que, devido
