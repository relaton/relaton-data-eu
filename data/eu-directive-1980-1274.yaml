title:
- language: en
  script: Latn
  content: Council Directive 80/1274/EEC of 22 December 1980 amending, consequent
    on the accession of Greece, Directive 64/432/EEC on animal health problems affecting
    intra-Community trade in bovine animals and swine and Directive 80/217/EEC introducing
    Community measures for the control of classical swine fever
  type: main
- language: fr
  script: Latn
