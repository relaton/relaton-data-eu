    aderării Greciei, a Directivei 64/432/CEE privind problemele de inspecție veterinară
    care afectează schimburile intracomunitare cu bovine și porcine și a Directivei
    80/217/CEE de stabilire a măsurilor comunitare de combatere a pestei porcine
    clasice
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 22. decembra 1980, ktorou sa po pristúpení Grécka mení
    a dopĺňa smernica 64/432/EHS o zdravotných problémoch zvierat ovplyvňujúcich
    obchod s hovädzím dobytkom a ošípanými vo vnútri spoločenstva a smernica
    80/217/EHS, ktorou sa zavádzajú opatrenia spoločenstva na kontrolu klasického
    moru ošípaných
  type: main
