    Fragen beim innergemeinschaftlichen Handelsverkehr mit Rindern und Schweinen und
    der Richtlinie 80/217/EWG über Maßnahmen der Gemeinschaft zur Bekämpfung der
    klassischen Schweinepest
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 22 декември 1980 година
    относно изменение, в резултат на присъединяването
    на Гърция, на Директива 64/432/ЕИО относно проблеми,
    свързани със здравето на животните, които засягат
    търговията в Общността с говеда и свине и на
    Директива 80/217/ЕИО относно въвеждане на мерки
    на Общността за контрол на класическата чума
    по свинете
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 22. prosince 1980, kterou se v důsledku přistoupení
