  script: Latn
  content: Council Decision (EU) 2020/1829 of 24 November 2020 on the submission,
    on behalf of the European Union, of proposals to amend Annex IV and certain entries
    in Annexes II and IX to the Basel Convention on the Control of Transboundary Movements
    of Hazardous Wastes and their Disposal for consideration at the fifteenth meeting
    of the Conference of the Parties, and on the position to be adopted on behalf
    of the European Union at that meeting as regards proposals by other Parties to
    that Convention to amend Annex IV and certain entries in Annexes II, VIII and
    IX to that Convention
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1829 du Conseil du 24 novembre 2020 concernant la présentation,
    au nom de l’Union européenne, de propositions d’amendement à l’annexe
    IV et à certaines rubriques des annexes II et IX de la convention de Bâle sur
    le contrôle des mouvements transfrontières de déchets dangereux et de leur
    élimination, à envisager à la quinzième réunion de la conférence des parties,
    et concernant la position à prendre au nom de l’Union européenne à cette
    réunion en ce qui concerne les propositions d’amendement à l’annexe IV et
    à certaines rubriques des annexes II, VIII et IX de ladite convention présentées
    par d’autres parties à celle-ci
  type: main
