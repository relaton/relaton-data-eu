title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 440/71 de la Commission, du 26 février 1971, abrogeant
    le règlement (CEE) n° 218/71 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d'agrumes originaires de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 440/71 der Kommission vom 26. Februar 1971 zur Aufhebung
    der Verordnung (EWG) Nr. 218/71 zur Anwendung des Gemeinsamen Zolltarifs auf Einfuhren
    von Mandarinen, Satsumas, Clementinen, Tangerinen und sonstigen ähnlichen Hybriden
    von Zitrusfrüchten mit Ursprung in Tunesien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 440/71 della Commissione, del 26 febbraio 1971, che
    abroga il regolamento (CEE) n. 218/71 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    ed altri ibridi similari di agrumi originari della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 440/71 van de Commissie van 26 februari 1971 tot
    intrekking van Verordening (EEG) nr. 218/71 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten van
    oorsprong uit Tunesië
  type: main
