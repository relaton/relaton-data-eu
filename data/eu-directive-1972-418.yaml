  content: Council Directive 72/418/EEC of 6 December 1972 amending the Directives
    of 14 June 1966 on the marketing of beet seed, of fodder-crop seed, of cereal
    seed, of seed potatoes, the Directive of 30 June 1969 on the marketing of oleaginous
    and fibrous plant seed, and the Directives of 29 September 1970 on the marketing
    of vegetable seed and on the Common Catalogue of Varieties of Agricultural Plant
    Species
  type: main
