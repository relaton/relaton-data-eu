  content: Règlement n 157/65/CEE de la Commission, du 11 novembre 1965, portant,
    pour le premier trimestre 1966, adaptation et fixation des prix d'écluse et fixation
    des prélèvements envers les pays tiers dans le secteur des oeufs et volailles
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 157/65/EWG der Kommission vom 11. November 1965 über die
    Anpassung und Festsetzung der Einschleusungspreise und die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern im Bereich der Eier- und Geflügelwirtschaft für
    das 1. Vierteljahr 1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 157/65/CEE della Commissione, dell'11 novembre 1965, che
    adatta e fissa per il primo trimestre 1966 i prezzi limite e che fissa i prelievi
    nei confronti dei paesi terzi nel settore delle uova e del pollame
  type: main
- language: nl
  script: Latn
