title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2041/98 of 25 September 1998 deciding not
    to accept tenders submitted in response to the 209th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2041/98 de la Commission du 25 septembre 1998 disposant
    de ne pas donner suite aux offres déposées à la suite de la deux cent neuvième
    adjudication partielle effectuée dans le cadre des mesures générales d'intervention
    conformément au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2041/98 der Kommission vom 25. September 1998 über
    den Beschluß, den zur 209. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2041/98 af 25. september 1998 om ikke
    at tage den 209. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2041/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Σεπτεμβρίου 1998 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για το 209ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2041/98, annettu 25 päivänä syyskuuta 1998,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun kahdennensadannenyhdeksännen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2041/98 della Commissione del 25 settembre 1998 che
    decide di non dar seguito alle offerte presentate per la duecentinovesima gara
    parziale effettuata nel quadro delle misure generali d'intervento conformemente
    al regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2041/98 van de Commissie van 25 september 1998 houdende
    het besluit om geen gevolg te geven aan de offertes in het kader van de 209e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2041/98 da Comissão de 25 de Setembro de 1998 que
    rejeita as propostas apresentadas na sequência do ducentésimo nono concurso
    parcial efectuado no âmbito das medidas gerais de intervenção, em conformidade
    com o Regulamento (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2041/98 de la Comisión de 25 de septiembre de 1998
    por el que se decide no dar curso a las ofertas presentadas para la 209a licitación
    parcial efectuada en el marco de las medidas generales de intervención en virtud
    del Reglamento (CEE) n° 1627/89
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2041/98 av den 25 september 1998 om att
