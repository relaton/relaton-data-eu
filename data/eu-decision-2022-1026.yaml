- language: en
  script: Latn
  content: Council Decision (EU) 2022/1026 of 21 June 2022 on the position to be adopted,
    on behalf of the European Union, within the EEA Joint Committee concerning the
    amendment of Protocol 31 on cooperation in specific fields outside the four freedoms
    and Protocol 32 on financial modalities for implementation of Article 82, annexed
    to the EEA Agreement (InvestEU)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/1026 du Conseil du 21 juin 2022 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’EEE
    en ce qui concerne la modification du protocole 31 concernant la coopération
    dans des secteurs particuliers en dehors des quatre libertés et du protocole
    32 concernant les modalités financières pour la mise en œuvre de l’article
    82, annexés à l’accord EEE (InvestEU)
  type: main
- language: de
  script: Latn
