title:
- language: en
  script: Latn
  content: '91/635/EEC: Commission Decision of 29 November 1991 amending Decision
    90/505/EEC authorizing certain Member States to provide for derogations from certain
    provisions of Council Directive 77/93/EEC in respect of sawn wood of conifers
    originating in Canada (Only the Spanish, German, Greek, English, French, Italian,
    Dutch and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/635/CEE: Décision de la Commission du 29 novembre 1991 modifiant la
    décision 90/505/CEE autorisant certains États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    le bois scié de conifères originaire du Canada (Les textes en langues espagnole,
    allemande, grecque, anglaise, française, italienne, néerlandaise et portugaise
    font foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 29. November 1991 zur Änderung der Entscheidung
    90/505/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für Nadelschnittholz
    mit Ursprung in Kanada Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates vorzusehen (Nur der spanische, der deutsche, der griechische, der englische,
    der französische, der italienische, der niederländische und der portugiesische
    Text sind verbindlich) (91/635/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 29. november 1991 om ændring af beslutning
    90/505/EØF om bemyndigelse af visse medlemsstater til at indrømme undtagelser
    fra visse bestemmelser i Rådets direktiv 77/93/EØF for opskåret nåletræ med
    oprindelse i Canada (Kun de spanske, tyske, græske, engelske, franske, italienske,
    nederlandske og portugisiske udgaver er autentiske) (91/635/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/635/ΕΟΚ: Απόφαση της Επιτροπής της 29ης
    Νοεμβρίου 1991 περί τροποποίησης της απόφασης
    90/505/ΕΟΚ η οποία επιτρέπει σε ορισμένα κράτη
    μέλη να προβλέπουν παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    σχετικά με την πριστή ξυλεία κωνοφόρων καταγωγής
    Καναδά'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 29 novembre 1991 che modifica la decisione
    90/505/CEE che autorizza alcuni Stati membri a prevedere deroghe a talune disposizioni
    della direttiva 77/93/CEE del Consiglio per quanto riguarda il legname segato
    di conifere originario del Canada (I testi in lingua spagnola, tedesca, greca,
    inglese, francese, italiana, olandese e portoghese sono i soli facenti fede) (91/635/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 29 november 1991 houdende wijziging van
    Beschikking 90/505/EEG tot machtiging van een aantal Lid-Staten om voor gezaagd
    naaldhout van oorsprong uit Canada afwijkingen van sommige bepalingen van Richtlijn
    77/93/EEG van de Raad toe te staan (Slechts de teksten in de Spaanse, de Duitse,
    de Griekse, de Engelse, de Franse, de Italiaanse, de Nederlandse en de Portugese
    taal zijn authentiek) (91/635/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 29 de Novembro de 1991 que altera a Decisão 90/505/CEE,
    que autoriza certos Estados- membros a estabelecer derrogações de determinadas
    disposições da Directiva 77/93/CEE do Conselho em relação à madeira serrada
    de coníferas originária do Canadá (Apenas fazem fé os textos nas línguas
    espanhola, alemã, grega, inglesa, francesa, italiana, neerlandesa e portuguesa)
    (91/635/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 29 de noviembre de 1991 que modifica la Decisión
    90/505/CEE por la que se autoriza a determinados Estados miembros para establecer
    excepciones a determinadas disposiciones de la Directiva 77/93/CEE del Consejo
    respecto de la madera aserrada de coníferas originaria de Canadá (Los textos
    en lengua española, alemana, griega, inglesa, francesa, italiana, neerlandesa
    y portuguesa son los únicos auténticos) (91/635/CEE) #'
