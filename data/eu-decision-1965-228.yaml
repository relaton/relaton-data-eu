title:
- language: fr
  script: Latn
  content: Décision 65/228/CEE de la Commission, du 31 mars 1965, portant prorogation
    et nouvelle modification de sa décision du 10 novembre 1964, autorisant la perception
    de taxes compensatoires à l'importation, en République fédérale d'Allemagne,
    de dextrines fabriquées à partir de la fécule de pommes de terre ainsi que
    de fécules de pommes de terre solubles ou torréfiées, en provenance de certains
    États membres
  type: main
- language: de
  script: Latn
  content: '65/228/EWG: Entscheidung der Kommission vom 31. März 1965 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 10. November 1964 über die Erhebung
    von Ausgleichsabgaben auf Einfuhren von Dextrin auf der Grundlage von Kartoffelstärke
    sowie von löslicher oder gerösteter Kartoffelstärke aus verschiedenen Mitgliedstaaten
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '65/228/CEE: Decisione della Commissione, del 31 marzo 1965, che proroga
    e modifica la propria decisione del 10 novembre 1964 con cui si autorizza la riscossione
    di tasse di compensazione all''importazione nella Repubblica federale di Germania,
    di destrine a base di fecola di patate, nonché fecole di patate solubili o torrefatte
    provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/228/EEG: Beschikking van de Commissie van 31 maart 1965 tot verlenging
    en nieuwe wijziging van haar beschikking van 10 november 1964 houdende machtiging
    tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van dextrine vervaardigd uit aardappelzetmeel, alsmede oplosbaar of
    geroost aardappelzetmeel, uit bepaalde Lid-Staten'
  type: main
