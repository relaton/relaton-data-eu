title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 661/80 of 19 March 1980 re-establishing
    the levying of customs duties on locks and padlocks (key, combination or electrically
    operated), and parts thereof, etc., falling within heading No 83.01 and originating
    in Hong Kong, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 661/80 de la Commission, du 19 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux serrures,
    verrous et cadenas, à clef, à secret ou électriques, etc., de la position 83.01
    du tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 661/80 der Kommission vom 19. März 1980 zur Wiedereinführung
    des Zollsatzes für Schlösser (einschließlich Verschlüsse und Verschlußbügel),
    als Geheimschlösser oder elektrische Schlösser, usw., der Tarifnummer 83.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 661/80 af 19. marts 1980 om genindførelse
    af opkrævning af toldafgifter for nøglelåse, kombinationslåse og elektriske
    låse etc., under pos. 83.01, som har oprindelse i Hongkong og omfattes af de
    toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 661/80 della Commissione, del 19 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili alle serrature, catenacci e lucchetti,
    a chiave, a segreto o elettrici, ecc., della voce 83.01 della tariffa doganale
    comune, originari di Hong Kong beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 661/80 van de Commissie van 19 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sloten,
    grendelsloten en hangsloten, welke door middel van een sleutel of langs elektrische
    weg geopend en gesloten worden, van post 83.01, van oorsprong uit Hong-Kong, ten
    behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
