  script: Latn
  content: Neuvoston päätös (EU) 2018/752 annettu 14 päivänä toukokuuta 2018,
    Kansainvälisessä merenkulkujärjestössä meriturvallisuuskomitean 99. istunnossa
    Euroopan unionin puolesta otettavasta kannasta muutosten hyväksymiseen SOLAS-yleissopimuksen
    II-1/1 ja II-1/8-1 sääntöihin, niihin liittyvien aluksen päällikön tueksi
    annettavia operatiivisia tietoja ennen 1 päivää tammikuuta 2014 rakennettujen
    matkustaja-alusten täyttymistilanteessa koskevien suuntaviivojen hyväksymiseen
