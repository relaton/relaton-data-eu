    Marittima tal-Organizzazzjoni Marittima Internazzjonali, dwar l-adozzjoni ta'
    emendi għar-Regolamenti SOLAS II-1/1 u II-1/8-1, fir-rigward tal-approvazzjoni
    ta' linji gwida assoċjati dwar l-informazzjoni operattiva għall-kaptani f'każ
    ta' għargħar għall-vapuri tal-passiġġieri li nbnew qabel l-1 ta' Jannar 2014
