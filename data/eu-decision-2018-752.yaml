    stosowania procedur prób ogniowych z 2010 r.
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2018/752 do Conselho, de 14 de maio de 2018, relativa à
    posição a tomar, em nome da União Europeia, na 99.a sessão do Comité de Segurança
    Marítima da Organização Marítima Internacional, no que diz respeito à adoção
    de alterações às regras SOLAS II-1/1 e II-1/8-1, à aprovação das orientações
    que lhes estão associadas sobre as informações operacionais para o comandante
    do navio na eventualidade de inundação a bordo, para navios de passageiros construídos
    antes de 1 de janeiro de 2014, bem como à adoção das alterações ao Código
    internacional para a aplicação de procedimentos de ensaio de exposição ao
    fogo, de 2010
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2018/752 a Consiliului din 14 mai 2018 privind poziția care
    urmează să fie adoptată în numele Uniunii Europene în cadrul Organizației
    Maritime Internaționale, cu ocazia celei de a 99-a sesiuni a Comitetului pentru
    siguranță maritimă, în ceea ce privește adoptarea unor amendamente la regulile
    II-1/1 și II-1/8-1 din Convenția SOLAS, aprobarea orientărilor aferente privind
    informațiile operaționale destinate comandanților în caz de inundații pentru
    navele de pasageri construite înainte de 1 ianuarie 2014 și adoptarea unor amendamente
    la Codul internațional din 2010 pentru aplicarea metodelor de încercare la foc
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2018/752 zo 14. mája 2018 o pozícii, ktorá sa
