  script: Latn
  content: Rådets beslut (EU) 2018/752 av den 14 maj 2018 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationen
    (IMO) vid den 99:e sessionen i sjösäkerhetskommittén om antagandet av ändringar
    av Solas-reglerna II-1/1 och II-1/8-1, om godkännandet av tillhörande riktlinjer
    för operativ information för befälhavare vid översvämning vad gäller passagerarfartyg
    byggda före den 1 januari 2014 och om antagandet av ändringarna av 2010 års
