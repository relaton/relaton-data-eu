title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/752 of 14 May 2018 on the position to be taken
    on behalf of the European Union at the International Maritime Organization during
    the 99th session of the Maritime Safety Committee, on the adoption of amendments
    to SOLAS Regulations II-1/1 and II-1/8-1, on the approval of associated guidelines
    on operational information for masters in case of flooding for passenger ships
    constructed before 1 January 2014 and on the adoption of amendments to the International
    Code for Application of Fire Test Procedures, 2010
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/752 du Conseil du 14 mai 2018 relative à la position
    à prendre au nom de l'Union européenne au sein de l'Organisation maritime internationale,
    lors de la 99e session du comité de la sécurité maritime, sur l'adoption d'amendements
    aux règles SOLAS II-1/1 et II-1/8-1, sur l'approbation de directives associées
    sur les renseignements en matière d'exploitation à fournir aux capitaines en
    cas d'envahissement de navires à passagers construits avant le 1er janvier 2014,
    ainsi que sur l'adoption d'amendements au Recueil international pour l'application
    des méthodes d'essai au feu de 2010
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/752 des Rates vom 14. Mai 2018 über den Standpunkt,
    der im Namen der Union auf der 99. Tagung des Schiffssicherheitsausschusses der
    Internationalen Seeschifffahrtsorganisation zu der Annahme von Änderungen der
    SOLAS-Regeln II-1/1 und II-1/8-1, der Genehmigung der zugehörigen Richtlinien
    für den Fall der Überflutung von vor dem 1. Januar 2014 über die betrieblichen
    Informationen für Kapitäne gebauten Fahrgastschiffen sowie der Annahme von Änderungen
    des Internationalen Kodex für die Anwendung von Brandprüfverfahren in der Fassung
    von 2010 (FTP-Code 2010) zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2018/752 на Съвета от 14 май 2018 година
    относно позицията, която трябва да се заеме
    от името на Европейския съюз в Международната
    морска организация по време на 99-ата сесия
    на Комитета по морска безопасност във връзка
    с приемането на измененията на глава II-1, правила
    1 и 8-1 от Конвенцията SOLAS, одобряването на съответните
    насоки относно оперативната информация за
    капитани след наводняване за пътнически кораби,
    построени преди 1 януари 2014 г., и приемането
    на измененията на Международния кодекс за
    прилагане на процедури за пожарни изпитания
    от 2010 г.
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2018/752 ze dne 14. května 2018 o postoji, který
