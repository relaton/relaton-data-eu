    i II-1/8-1 Konvencije SOLAS, o odobrenju pripadajućih smjernica o operativnim
    informacijama za zapovjednike brodova u slučaju naplavljivanja za putničke brodove
    izgrađene prije 1. siječnja 2014. i o donošenju izmjena Međunarodnog kodeksa
    o postupcima ispitivanja vatrootpornosti iz 2010.
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2018/752 határozata (2018. május 14.) a Nemzetközi Tengerészeti
