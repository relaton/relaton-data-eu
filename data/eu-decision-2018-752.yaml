    ta' Proċeduri tal-Ittestjar tan-Nirien, 2010
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2018/752 van de Raad van 14 mei 2018 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen tijdens de 99e vergadering van
    de Maritieme Veiligheidscommissie van de Internationale Maritieme Organisatie
    over de vaststelling van wijzigingen aan SOLAS-voorschriften II-1/1 en II-1/8-1,
    de goedkeuring van de bijhorende richtsnoeren inzake operationele informatie voor
    kapiteins in geval van een volloopincident voor vóór 1 januari 2014 gebouwde
    passagiersschepen, en de vaststelling van wijzigingen aan de Internationale Code
    voor brandproefprocedures 2010
  type: main
- language: pl
  script: Latn
