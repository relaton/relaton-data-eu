    Medzinárodnej námornej organizácie, pokiaľ ide o prijatie zmien predpisov
    SOLAS II-1/1 a II-1/8-1, schválenie súvisiacich usmernení o prevádzkových
    informáciách pre kapitánov v prípade zaplavenia pre osobné lode postavené
    pred 1. januárom 2014 a prijatie zmien Medzinárodného kódexu pre použitie
    postupov požiarnych testov z roku 2010
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2018/752 z dne 14. maja 2018 o stališču, ki se zavzame
    v imenu Evropske unije v okviru Mednarodne pomorske organizacije na 99. zasedanju
    Odbora za pomorsko varnost glede sprejetja sprememb pravil II-1/1 in II-1/8-1
    konvencije SOLAS, odobritve zadevnih smernic o operativnih informacijah za poveljnike
    v primeru poplave za obstoječe potniške ladje, zgrajene pred 1. januarjem 2014,
    ter sprejetja sprememb Mednarodnega kodeksa za uporabo postopkov požarnega preskusa
    iz leta 2010
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2018/752 del Consejo, de 14 de mayo de 2018, relativa a
    la posición que debe adoptarse en nombre de la Unión Europea en la Organización
    Marítima Internacional durante el 99.° periodo de sesiones del Comité de Seguridad
    Marítima en relación con la adopción de enmiendas a las reglas II-1/1 y II-1/8-1
    del Convenio SOLAS, con la aprobación de las directrices asociadas sobre la información
    operacional facilitada a los capitanes en caso de inundación en los buques de
    pasaje construidos antes del 1 de enero de 2014, y con la adopción de enmiendas
    al Código Internacional para la Aplicación de Procedimientos de Ensayo de Exposición
    al Fuego, 2010
  type: main
