    Jūrų saugumo komiteto 99-ajame posėdyje, dėl SOLAS taisyklių Nr. II-1/1 ir
    II-1/8-1 pakeitimų priėmimo, dėl atitinkamų susijusių operatyvinės informacijos
    gairių kapitonams iki 2014 m. sausio 1 d. pastatytų keleivinių laivų užtvindymo
    atveju ir dėl 2010 m. Tarptautinio atsparumo ugniai bandymo procedūrų taikymo
    kodekso pakeitimų priėmimo
  type: main
