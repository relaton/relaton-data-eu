    bezpečnost Mezinárodní námořní organizace v souvislosti s plánovaným přijetím
    změn pravidel II-1/1 a II-1/8-1 úmluvy SOLAS, schválením souvisejících pokynů
    k provozním informacím pro velitele v případě zaplavení osobních lodí
    vyrobených před 1. lednem 2014 a přijetím změn Mezinárodního předpisu
    pro použití postupů požárních zkoušek z roku 2010
  type: main
