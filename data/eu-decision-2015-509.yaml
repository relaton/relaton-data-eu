  script: Latn
  content: Decisão (UE) 2015/509 do Banco Central Europeu, de 18 de fevereiro de
    2015 , que revoga a Decisão BCE/2013/6 relativa às regras de utilização, como
    ativos de garantia nas operações de política monetária do Eurosistema, de
    obrigações garantidas pelo Estado não colateralizadas emitidas por instituições
    bancárias para uso próprio, a Decisão BCE/2013/35 relativa a medidas adicionais
    respeitantes às operações de refinanciamento do Eurosistema e à elegibilidade
    dos ativos de garantia, e ainda os artigos 1. °, 3. °e 4. °da Decisão BCE/2014/23
    relativa à remuneração de depósitos, saldos e reservas excedentárias (BCE/2015/9)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2015/509 a Băncii Centrale Europene din 18 februarie 2015
