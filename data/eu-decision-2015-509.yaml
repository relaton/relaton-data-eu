    nekrytých bankových dlhopisov so štátnou zárukou ako zábezpeky v operáciách
    menovej politiky Eurosystému, rozhodnutie ECB/2013/35 o dodatočných opatreniach
    týkajúcich sa refinančných operácií Eurosystému a akceptovateľnosti zábezpeky
    a články 1, 3 a 4 rozhodnutia ECB/2014/23 o úročení vkladov, zostatkov a
    prebytočných rezerv (ECB/2015/9)
  type: main
- language: sl
  script: Latn
  content: Sklep Evropske centralne banke (EU) 2015/509 z dne 18. februarja 2015 o
    razveljavitvi Sklepa ECB/2013/6 o pravilih v zvezi z uporabo lastnih nekritih
    bančnih obveznic, za katere jamči država, kot zavarovanja pri operacijah denarne
    politike Eurosistema, Sklepa ECB/2013/35 o dodatnih ukrepih v zvezi z Eurosistemovimi
    operacijami refinanciranja in primernostjo zavarovanja ter členov 1, 3 in 4 Sklepa
    ECB/2014/23 o obrestovanju depozitov, stanj in imetij presežnih rezerv (ECB/2015/9)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2015/509 del Banco Central Europeo, de 18 de febrero de
    2015 , por la que se deroga la Decisión BCE/2013/6 sobre las normas relativas
    a la utilización como activos de garantía en las operaciones de política monetaria
    del Eurosistema de bonos bancarios simples con la garantía del Estado para uso
    propio, la Decisión BCE/2013/35 sobre medidas adicionales relativas a las operaciones
    de financiación del Eurosistema y la admisibilidad de los activos de garantía
    y los artículos 1, 3 y 4 de la Decisión BCE/2014/23 sobre la remuneración de
    depósitos, saldos y tenencias de exceso de reservas (BCE/2015/9)
  type: main
- language: sv
  script: Latn
  content: Europeiska centralbankens beslut (EU) 2015/509 av den 18 februari 2015
    om upphävande av beslut ECB/2013/6 om regler för att använda icke säkerställda
    statligt garanterade bankobligationer som nyttjas för egen användning som säkerheter
    vid Eurosystemets penningpolitiska transaktioner, beslut ECB/2013/35 om ytterligare
    åtgärder som berör Eurosystemets refinansieringstransaktioner och de säkerheter
    som godtas samt artiklarna 1, 3 och 4 i beslut ECB/2014/23 om förräntningen
    av inlåning, saldon och innehav av överskottsreserver (ECB/2015/9)
