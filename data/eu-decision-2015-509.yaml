title:
- language: en
  script: Latn
  content: Decision (EU) 2015/509 of the European Central Bank of 18 February 2015
    repealing Decision ECB/2013/6 on the rules concerning the use as collateral for
    Eurosystem monetary policy operations of own-use uncovered government-guaranteed
    bank bonds, Decision ECB/2013/35 on additional measures relating to Eurosystem
    refinancing operations and eligibility of collateral and Articles 1, 3 and 4 of
    Decision ECB/2014/23 on the remuneration of deposits, balances and holdings of
    excess reserves (ECB/2015/9)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/509 de la Banque centrale européenne du 18 février
    2015 abrogeant la décision BCE/2013/6 sur les règles relatives à l'utilisation,
    à titre de garantie des opérations de politique monétaire de l'Eurosystème,
    d'obligations propres non sécurisées de banque garanties par un État, la décision
    BCE/2013/35 relative à des mesures supplémentaires concernant les opérations
    de refinancement de l'Eurosystème et l'éligibilité des garanties, ainsi que
    les articles 1 er , 3 et 4 de la décision BCE/2014/23 concernant la rémunération
    des dépôts, soldes et avoirs d'excédents de réserves (BCE/2015/9)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/509 der Europäischen Zentralbank vom 18. Februar 2015
    zur Aufhebung des Beschlusses EZB/2013/6 über die Regelungen bezüglich der Verwendung
    von ungedeckten staatlich garantierten Bankschuldverschreibungen zur Eigennutzung
    als Sicherheiten für geldpolitische Operationen des Eurosystems und des Beschlusses
    EZB/2013/35 über zusätzliche Maßnahmen hinsichtlich der Refinanzierungsgeschäfte
    des Eurosystems und der Notenbankfähigkeit von Sicherheiten sowie zur Aufhebung
    von Artikel 1, 3 und 4 des Beschlusses EZB/2014/23 über die Verzinsung von Einlagen,
    Guthaben und Überschussreserven (EZB/2015/9)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2015/509 на Европейската централна
    банка от 18 февруари 2015 година за отмяна на Решение
    ЕЦБ/2013/6 относно правилата за използване като
    обезпечение за операциите по паричната политика
    на Евросистемата на собствено ползвани необезпечени
    държавно гарантирани банкови облигации, на
    Решение ЕЦБ/2013/35 относно допълнителни мерки
    по отношение на операции по рефинансиране
    на Евросистемата и допустимост на обезпечения,
    и на членове 1, 3 и 4 от Решение ЕЦБ/2014/23 относно
    олихвяването на депозити, салда и наличности
    от свръхрезерви (EЦБ/2015/9)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropské centrální banky (EU) 2015/509 ze dne 18. února
    2015 , kterým se zrušuje rozhodnutí ECB/2013/6 o pravidlech týkajících se
    používání vlastních nekrytých bankovních dluhopisů zaručených státem
    jako zajištění při operacích měnové politiky Eurosystému, rozhodnutí
    ECB/2013/35 o dodatečných opatřeních týkajících se refinančních operací
    Eurosystému a způsobilosti zajištění a články 1, 3 a 4 rozhodnutí ECB/2014/23
    o úročení vkladů, zůstatků a přebytečných rezerv (ECB/2015/9)
  type: main
- language: da
  script: Latn
  content: Den Europæiske Centralbanks afgørelse (EU) 2015/509 af 18. februar 2015
    om ophævelse af afgørelse ECB/2013/6 om reglerne for anvendelsen af udækkede
    statsgaranterede bankobligationer, der anvendes til eget brug, som sikkerhed for
    Eurosystemets pengepolitiske operationer, afgørelse ECB/2013/35 om yderligere
    foranstaltninger vedrørende Eurosystemets refinansieringstransaktioner og belånbar
    sikkerhed og artikel 1, 3 og 4 i afgørelse ECB/2014/23 om forrentningen af indlån,
    saldi og beholdninger af overskudsreserver (ECB/2015/9)
  type: main
- language: el
  script: Grek
  content: Αποφαση (ΕΕ) 2015/509 της Ευρωπαϊκης Κεντρικης
    Τραπεζας, της 18ης Φεβρουαρίου 2015 , που τροποποιεί
    την απόφαση ΕΚΤ/2013/6 για τους όρους σχετικά
    με τη χρησιμοποίηση ως ασφαλειών για πράξεις
    νομισματικής πολιτικής του Ευρωσυστήματος
    μη καλυμμένων εγγυημένων από κυβερνήσεις τραπεζικών
    ομολογιών ιδίας χρήσεως, την απόφαση ΕΚΤ/2013/35
    σχετικά με συμπληρωματικά μέτρα όσον αφορά
    τις πράξεις κύριας αναχρηματοδότησης του Ευρωσυστήματος
    και την καταλληλότητα των ασφαλειών και τα
    άρθρα 1, 3 και 4 της απόφασης ΕΚΤ/2014/23 σχετικά
    με τον τοκισμό των καταθέσεων, υπολοίπων και
    πλεοναζόντων αποθεματικών (EΚΤ/2015/9)
  type: main
- language: et
  script: Latn
  content: Euroopa Keskpanga otsus (EL) 2015/509, 18. veebruar 2015 , millega tunnistatakse
    kehtetuks otsus EKP/2013/6 omakasutuses olevate valitsuse poolt tagatud katmata
    pangavõlakirjade eurosüsteemi rahapoliitika operatsioonide tagatisena kasutamise
    eeskirjade kohta, otsus EKP/2013/35 täiendavate meetmete kohta seoses eurosüsteemi
    refinantseerimisoperatsioonide ja tagatise kõlblikkusega ning otsuse EKP/2014/23
    (hoiuste, jääkide ja ülemääraste reservide tasustamise kohta) artiklid 1,
    3 ja 4 (EKP/2015/9)
  type: main
- language: fi
  script: Latn
  content: Euroopan keskuspankin päätös (EU) 2015/509, annettu 18 päivänä helmikuuta
    2015 , omassa käytössä olevien valtion takaamien kattamattomien pankkien joukkovelkakirjojen
    käyttämistä vakuutena eurojärjestelmän rahapoliittisissa operaatioissa koskevista
    säännöistä annetun päätöksen EKP/2013/6, eurojärjestelmän rahoitusoperaatioihin
    sekä vakuuskelpoisuuteen liittyvistä lisätoimenpiteistä annetun päätöksen
    EKP/2013/35 ja talletuksista, saldoista ja varantovelvoitteen ylittävistä talletuksista
    maksettavista koroista annetun päätöksen EKP/2014/23 1, 3 ja 4 artiklan kumoamisesta
    (EKP/2015/9)
  type: main
- language: hr
  script: Latn
  content: Odluka (EU) 2015/509 Europske središnje banke od 18. veljače 2015. o
    stavljanju izvan snage Odluke ESB/2013/6 o pravilima u vezi s uporabom vlastitih
    nepokrivenih bankovnih obveznica za koje jamči država kao instrumenata osiguranja
    za operacije monetarne politike Eurosustava, Odluke ESB/2013/35 o dodatnim mjerama
    koje se odnose na operacije refinanciranja Eurosustava i prihvatljivost instrumenata
    osiguranja te članaka 1., 3. i 4. Odluke ESB/2014/23 o remuneraciji depozita,
    stanja i držanja viška pričuva (ESB/2015/9)
  type: main
- language: hu
  script: Latn
  content: Az Európai Központi Bank (EU) 2015/509 határozata ( 2015. február 18.
    ) a saját felhasználású, fedezetlen, állam által garantált banki kötvényeknek
    az eurorendszer monetáris politikai műveletei során fedezetként történő
    felhasználására vonatkozó szabályokról szóló EKB/2013/6 határozat, az
    eurorendszer refinanszírozási műveleteivel és a fedezetek elfogadhatóságával
    kapcsolatos további intézkedésekről szóló EKB/2013/35 határozat, valamint
    a betétek, egyenlegek és többlet tartalékállományok díjazásáról szóló
    EKB/2014/23 határozat 1., 3. és 4. cikkének hatályon kívül helyezéséről
    (EKB/2015/9)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2015/509 della Banca centrale europea, del 18 febbraio 2015
    , che abroga la decisione BCE/2013/6 sulle regole in merito all'uso quale garanzia
    per le operazioni di politica monetaria dell'Eurosistema di obbligazioni bancarie
    con la sola garanzia statale emesse per uso proprio, la decisione BCE/2013/35
    relativa a misure supplementari sulle operazioni di rifinanziamento dell'Eurosistema
    e sull'idoneità delle garanzie e gli articoli 1, 3 e 4 della decisione BCE/2014/23
    sulla remunerazione di depositi, saldi e riserve in eccesso (BCE/2015/9)
  type: main
- language: lv
  script: Latn
  content: Eiropas Centrālās bankas Lēmums (ES) 2015/509 ( 2015. gada 18. februāris
    ), ar kuru atceļ Lēmumu ECB/2013/6 par noteikumiem tam, kā pašu emitētas
    nenodrošinātas valsts garantētas banku obligācijas izmanto par nodrošinājumu
    Eurosistēmas monetārās politikas operācijās, Lēmumu ECB/2013/35 par papildu
    pasākumiem attiecībā uz Eurosistēmas refinansēšanas operācijām un nodrošinājuma
    atbilstību un Lēmuma ECB/2014/23 par atlīdzību par noguldījumiem, atlikumiem
    un virsrezervju turējumiem 1., 3. un 4. pantu (ECB/2015/9)
  type: main
- language: lt
  script: Latn
  content: 2015 m. vasario 18 d. Europos Centrinio Banko sprendimas (ES) 2015/509,
    kuriuo panaikinamas Sprendimas ECB/2013/6 dėl nepadengtų Vyriausybės garantuotų
    bankų obligacijų nuosavo naudojimo kaip įkaito Eurosistemos pinigų politikos
    operacijoms taisyklių, Sprendimas ECB/2013/35 dėl papildomų priemonių, susijusių
    su Eurosistemos refinansavimo operacijomis ir įkaito tinkamumu, ir Sprendimo
    ECB/2014/23 dėl atlyginimo už indėlius, balansus ir laikomą atsargų perteklių
    1, 3 ir 4 straipsniai (ECB/2015/9)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni (UE) 2015/509 tal-Bank Ċentrali Ewropew tat- 18 ta' Frar 2015
    li tħassar id-Deċiżjoni BĊE/2013/6 dwar ir-regoli fuq l-użu bħala kollateral
    ta' bonds tal-bank skoperti għall-użu proprju ggarantiti mill-gvern għal operazzjonijiet
    tal-politika monetarja tal-Eurosistema, id-Deċiżjoni BĊE/2013/35 dwar miżuri
    addizzjonali fir-rigward ta' operazzjonijiet ta' rifinanzjament tal-Eurosistema
    u l-eliġibbiltà tal-kollateral u l-Artikoli 1, 3 u 4 tad-Deċiżjoni BĊE/2014/23
    dwar ir-remunerazzjoni ta' depożiti, bilanċi u holdings ta' eċċess ta' riżervi
    (BĊE/2015/9)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2015/509 van de Europese Centrale Bank van 18 februari 2015
    houdende intrekking van Besluit ECB/2013/6 houdende de regels betreffende het
    gebruik van door de overheid gegarandeerde ongedekte bankbrieven voor eigen gebruik
    als onderpand voor monetaire-beleidstransacties van het Eurosysteem, Besluit ECB/2013/35
    inzake aanvullende met herfinancieringstransacties van het Eurosysteem en de beleenbaarheid
    van onderpand verband houdende maatregelen en artikel 1, 3 en 4 van Besluit ECB/2014/23
    betreffende de rentevergoeding op deposito's, saldi en aangehouden extra reserves
    (ECB/2015/9)
  type: main
- language: pl
  script: Latn
  content: Decyzja Europejskiego Banku Centralnego (UE) 2015/509 z dnia 18 lutego
