    colateral pentru operațiunile de politică monetară din Eurosistem a obligațiunilor
    bancare neacoperite utilizate în scopuri proprii și garantate de stat, a Deciziei
    BCE/2013/35 privind măsuri suplimentare legate de operațiunile de refinanțare
    din Eurosistem și eligibilitatea colateralului și a articolelor 1, 3 și 4 din
    Decizia BCE/2014/23 privind remunerarea depozitelor, soldurilor și deținerilor
    de rezerve excedentare (BCE/2015/9)
  type: main
