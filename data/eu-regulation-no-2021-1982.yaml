title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2021/82 of 23 July 1982 re-establishing
    the levying of customs duties on shawls, scarves, mufflers, mantillas, veils and
    the like, products of category 84 (code 0840), originating in India, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3602/81
    applyl
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2021/82 de la Commission, du 23 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables aux châles,
    écharpes, foulards, cache-nez, cache-col, mantilles, voiles et voilettes, et
    articles similaires, de la catégorie 84 (code 0840), originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2021/82 der Kommission vom 23. Juli 1982 über die
    Wiedereinführung des Zollsatzes für Schals, Umschlagtücher, Halstücher, Kragenschoner,
    Kopftücher, Schleier und ähnliche Waren der Warenkategorie Nr. 84 (Kennziffer
    0840), mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3602/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2021/82 af 23. juli 1982 om genindførelse
    af opkrævning af toldafgifter for sjaler, tørklæder, mantiller, slør, o.lign.,
    under kategori 84 (kode 0840), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2021/82 τής Επιτροπής
    τής 23ης Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά επώμια
    εν γένει (σάλια, εσάρπες), μανδήλια λαιμού, ρινοσκέπες,
    κασκόλ, μανδήλες, βέλλα, βελλάκια καί παρόμοια,
    προϊόντων τής κατηγορίας 84 (κώδικας 0840), καταγωγής
    Ινδιών, δικαιούχων τών προβλεπομένων στόν
    κανονισμό (EOK) αριθ. 3602/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2021/82 della Commissione, del 23 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili a scialli, sciarpe, fazzoletti
    da collo, sciarpette, mantiglie, veli e velette e manufatti simili, della categoria
    di prodotti n. 84 (codice 0840), originari dell' India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3602/81 del Consigliol
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2021/82 van de Commissie van 23 juli 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sjaals,
    sjerpen, hoofddoeken, halsdoeken, mantilles, sluiers, voiles en dergelijke artikelen
    van categorie van produkten 84 (codenummer 0840) van oorsprong uit India, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3602/81
    van de Raad
  type: main
