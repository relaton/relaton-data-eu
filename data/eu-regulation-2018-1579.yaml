  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1579 of 18 October 2018 imposing
    a definitive anti-dumping duty and collecting definitively the provisional duty
    imposed on imports of certain pneumatic tyres, new or retreaded, of rubber, of
    a kind used for buses or lorries, with a load index exceeding 121 originating
    in the People's Republic of China and repealing Implementing Regulation (EU) 2018/163
