title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2287/2000 of 13 October 2000 amending Regulation
    (EEC) No 3846/87 establishing an agricultural product nomenclature for export
    refunds and Regulation (EC) No 174/1999 laying down special detailed rules for
    the application of Council Regulation (EEC) No 804/68 as regards export licences
    and export refunds in the case of milk and milk producdts
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2287/2000 de la Commission du 13 octobre 2000 modifiant
    le règlement (CEE) nº 3846/87 établissant la nomenclature des produits agricoles
    pour les restitutions à l'exportation et le règlement (CE) nº 174/1999 établissant
    les modalités particulières d'application du règlement (CEE) nº 804/68 du
    Conseil en ce qui concerne les certificats d'exportation et des restitutions à
    l'exportation dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2287/2000 der Kommission vom 13. Oktober 2000 zur Änderung
    der Verordnung (EWG) Nr. 3846/87 zur Erstellung einer Nomenklatur der landwirtschaftlichen
    Erzeugnisse für Ausfuhrerstattungen und der Verordnung (EG) Nr. 174/1999 mit
    besonderen Durchführungsvorschriften zur Verordnung (EWG) Nr. 804/68 des Rates
    im Hinblick auf die Ausfuhrlizenzen und die Ausfuhrerstattungen im Sektor Milch
    und Milcherzeugnisse
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2287/2000 ze dne 13. října 2000, kterým
    se mění nařízení (EHS) č. 3846/87, kterým se zavádí nomenklatura zemědělských
    produktů pro vývozní náhrady, a nařízení (ES) č. 174/1999, kterým se
    stanoví zvláštní prováděcí pravidla k nařízení Rady (EHS) č. 804/68,
    pokud jde o vývozní licence a vývozní náhrady pro mléko a mléčné výrobky
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2287/2000 af 13. oktober 2000 om ændring
    af forordning (EØF) nr. 3846/87 om fastsættelse af nomenklaturen over eksportrestitutioner
    for landbrugsprodukter og forordning (EF) nr. 174/1999 om særlige gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 804/68 for så vidt angår anvendelsen af eksportlicenser
    og eksportrestitutioner for mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2287/2000 της Επιτροπής,
    της 13ης Οκτωβρίου 2000, για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3846/87 για τον καθορισμό
    της ονοματολογίας των γεωργικών προϊόντων
    για τις επιστροφές κατά την εξαγωγή και του
    κανονισμού (ΕΚ) αριθ. 174/1999 για τον καθορισμό
    των ειδικών λεπτομερειών εφαρμογής του κανονισμού
    (ΕΟΚ) αριθ. 804/68 του Συμβουλίου όσον αφορά τα
