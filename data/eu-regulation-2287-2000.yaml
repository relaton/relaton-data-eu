    των γαλακτοκομικών προϊόντων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2287/2000, 13. oktoober 2000, millega muudetakse
    määrust (EMÜ) nr 3846/87, millega kehtestatakse põllumajandustoodete nomenklatuur
    eksporditoetuste jaoks, ja määrust (EÜ) nr 174/1999, millega kehtestatakse
    nõukogu määruse (EMÜ) nr 804/68 rakendamise üksikasjalikud erieeskirjad piima
    ja piimatoodete ekspordilitsentside ja -toetuste kohta
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2287/2000, annettu 13 päivänä lokakuuta 2000,
    maataloustuotteiden nimikkeistöstä vientitukia varten annetun asetuksen (ETY)
    N:o 3846/87 ja neuvoston asetuksen (ETY) N:o 804/68 soveltamista koskevista yksityiskohtaisista
    erityissäännöistä maito- ja maitotuotealan vientitodistusten ja vientitukien
    osalta annetun asetuksen (EY) N:o 174/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2287/2000/EK rendelete (2000. október 13.) a mezőgazdasági
    termékek export-visszatérítési nómenklatúrájának létrehozásáról szóló
    3846/87/EGK rendelet, valamint a 804/68/EGK tanácsi rendeletnek a tejre és tejtermékekre
    vonatkozó kiviteli engedélyek és export-visszatérítések tekintetében történő
    alkalmazására vonatkozó különös részletes szabályok megállapításáról
    szóló 174/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2287/2000 della Commissione, del 13 ottobre 2000, che
    modifica il regolamento (CEE) n. 3846/87 che stabilisce la nomenclatura dei prodotti
    agricoli per le restituzioni all'esportazione e il regolamento (CE) n. 174/1999
    recante modalità particolari di applicazione del regolamento (CEE) n. 804/68
    del Consiglio, riguardo ai titoli di esportazione e alle restituzioni all'esportazione
    nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2287/2000 (2000. gada 13. oktobris), ar ko groza
    Regulu (EEK) Nr. 3846/87, ar kuru izveido lauksaimniecības produktu nomenklatūru
    eksporta kompensācijām, un Regulu (EK) Nr. 174/1999, ar ko nosaka īpašus sīki
    izstrādātus noteikumus Padomes Regulas (EEK) Nr. 804/68 piemērošanai attiecībā
    uz piena un piena produktu eksporta licencēm un eksporta kompensācijām
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 13 d. Tarybos reglamentas (EB) Nr. 2287/2000, iš dalies
    keičiantis Reglamentą (EEB) Nr. 3846/87, nustatantį žemės ūkio produktų,
    kuriems skiriamos eksporto grąžinamosios išmokos, nomenklatūrą ir Reglamentą
    (EB) Nr. 174/1999, nustatantį išsamias specialiąsias Tarybos reglamento (EEB)
    Nr. 804/68 taikymo taisykles dėl pieno ir pieno produktų eksporto licencijų
    ir eksporto grąžinamųjų išmokų
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 2287/2000 tat-13 ta' Ottubru 2000
    li jemenda r-Regolament (KEE) Nru 3846/87 li jistabbilixxi nomeniklatura ta' prodotti
    agrikoli għal rifużjonijiet ta' l-esportazzjoni u r-Regolament (KE) Nru 174/1999
    li jistabbilixxi regoli speċjali ddettaljati għall-applikazzjoni tar-Regolament
    tal-Kunsill (KEE) Nru 804/68 f'dak li jirrigwardja liċenzji ta' l-esportazzjoni
    u r-rifużjonijiet ta' l-esportazzjoni fil-każ tal-ħalib u l-prodotti tal-ħalib
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2287/2000 van de Commissie van 13 oktober 2000 houdende
    wijziging van Verordening (EEG) nr. 3846/87 tot vaststelling van de landbouwproductennomenclatuur
    voor de uitvoerrestituties en van Verordening (EG) nr. 174/1999 tot vaststelling
    van de specifieke uitvoeringsbepalingen van Verordening (EEG) nr. 804/68 van de
    Raad inzake de uitvoercertificaten en de uitvoerrestituties in de sector melk
    en zuivelproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2287/2000 z dnia 13 października 2000
    r. zmieniające rozporządzenie (EWG) nr 3846/87, ustanawiające nomenklaturę
    produktów rolnych do celów refundacji wywozowych, i rozporządzenie (WE) nr
    174/1999, ustanawiające specjalne szczegółowe zasady stosowania rozporządzenia
    Rady (EWG) nr 804/68 w zakresie pozwoleń na wywóz i refundacji wywozowych do
    mleka i przetworów mlecznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2287/2000 da Comissão, de 13 de Outubro de 2000,
    que altera o Regulamento (CEE) n.o 3846/87 que estabelece a nomenclatura dos produtos
    agrícolas para as restituições à exportação e o Regulamento (CE) n.o 174/1999
    que estabelece as normas especiais de execução do Regulamento (CEE) n.o 804/68
    do Conselho no que respeita aos certificados de exportação e às restituições
    à exportação no sector do leite e dos produtos lácteos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2287/2000 z 13. októbra 2000, ktorým sa mení
    a dopĺňa nariadenie (EHS) č. 3846/87 stanovujúce nomenklatúru poľnohospodárskych
    produktov pre vývozné náhrady a nariadenie (ES) č. 174/1999 stanovujúce osobitné
    pravidlá pre uplatňovanie nariadenia Rady (EHS) č. 804/68, pokiaľ ide o vývozné
    licencie a vývozné náhrady v prípade mlieka a mliečnych výrobkov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2287/2000 z dne 13. oktobra 2000 o spremembi
    Uredbe (EGS) št. 3846/87 o vzpostavitvi nomenklature kmetijskih proizvodov za
    izvozna nadomestila in Uredbe (ES) št. 174/1999 o določitvi posebnih podrobnih
    pravil za uporabo Uredbe Sveta (EGS) št. 804/68 glede izvoznih dovoljenj in izvoznih
    nadomestil v primeru mleka in mlečnih izdelkov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2287/2000 de la Comisión, de 13 de octubre de 2000,
    que modifica el Reglamento (CEE) nº 3846/87 por el que se establece la nomenclatura
    de los productos agrarios para las restituciones a la exportación y el Reglamento
    (CE) nº 174/1999 por el que se establecen disposiciones específicas de aplicación
    del Reglamento (CEE) nº 804/68 del Consejo, relativo a los certificados de exportación
    y de las restituciones por exportación en el sector de la leche y de los productos
    lácteos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2287/2000 av den 13 oktober 2000 om ändring
    av förordning (EEG) nr 3846/87 om upprättandet av en exportbidragsnomenklatur
    för jordbruksprodukter och av förordning (EG) nr 174/1999 om fastställande
    av särskilda tillämpningsföreskrifter till rådets förordning (EEG) nr 804/68
    i fråga om exportlicenser och exportbidrag inom sektorn för mjölk och mjölkprodukter
