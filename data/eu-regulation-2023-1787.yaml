    2023 modifiant les annexes III, IX et X du règlement d’exécution (UE) 2019/2072
    en ce qui concerne la liste des zones protégées et des organismes de quarantaine
    de zone protégée correspondants, l’interdiction de l’introduction de végétaux,
    produits végétaux et autres objets dans certaines zones protégées et les exigences
    particulières applicables à leur introduction ou à leur circulation dans certaines
    zones protégées
  type: main
