  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1787 of 14 September 2023
    amending Annexes III, IX and X to Implementing Regulation (EU) 2019/2072 as regards
    the listing of protected zones and respective protected zone quarantine pests,
    the prohibition of the introduction of plants, plant products and other objects
    into certain protected zones, and the special requirements for their introduction
    into or movement within certain protected zones
  type: main
- language: fr
  script: Latn
