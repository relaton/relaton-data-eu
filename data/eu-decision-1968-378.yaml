  content: Décision de la Commission, du 30 septembre 1968, portant octroi du concours
    du Fonds social européen au bénéfice du Royaume de Belgique pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    l'Office national de l'emploi (O.N.E.M.) et l'Oeuvre nationale des anciens combattants
    et victimes de la guerre (O.N.A.C.)
  type: main
- language: de
  script: Latn
  content: '68/378/EWG: Entscheidung der Kommission vom 30. September 1968 über die
    Gewährung eines Zuschusses aus dem ESF an das Königreich Belgien zu Aufwendungen
    für vom "Office National de l''Emploi (ONEM)" und "Oeuvre nationale des anciens
    combattants et victimes de la guerre (ONAC)" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '68/378/CEE: Decisione della Commissione, del 30 settembre 1968, relativa
    alla concessione di un contributo del FSE a favore del Regno del Belgio per spese
    concernenti operazioni di rieducazione professionale effettuate dall''«Office
    national de l''emploi (ONEM)» e dall''«Oeuvre nationale des anciens combattants
    et victimes de la guerre (ONAC)»'
  type: main
- language: nl
  script: Latn
  content: '68/378/EEG: Beschikking van de Commissie van 30 september 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van het Koninkrijk België
    voor door de Rijksdienst voor Arbeidsvoorziening (R.V.A.) en het Nationaal Werk
    voor Oudstrijders en Oorlogsslachtoffers (N.W.O.S.) gemaakte herscholingskosten'
