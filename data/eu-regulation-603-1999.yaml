title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 603/1999 of 15 March 1999 imposing a definitive
    anti-dumping duty on imports of polypropylene binder or baler twine originating
    in Poland, the Czech Republic and Hungary, and collecting definitively the provisional
    duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 603/1999 du Conseil du 15 mars 1999 instituant un droit
    antidumping définitif sur les importations de ficelle lieuse ou botteleuse en
    polypropylène originaire de Pologne, de République tchèque et de Hongrie et
    portant perception définitive du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 603/1999 des Rates vom 15. März 1999 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Binde- oder Pressengarnen
    aus Polypropylen mit Ursprung in Polen, der Tschechischen Republik und Ungarn
    und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 603/1999 af 15. marts 1999 om indførelse af
    en endelig antidumpingtold på importen af binde- og pressegarn af polypropylen
    med oprindelse i Polen, Tjekkiet og Ungarn og om endelig opkrævning af den midlertidige
    told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 603/1999 του Συμβουλίου
    της 15ης Μαρτίου 1999 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές σπάγκων
    για δεσίματα ή δεματιάσματα από πολυπροπυλένιο,
    καταγωγής Πολωνίας, Τσεχικής Δημοκρατίας και
    Ουγγαρίας, και για την οριστική είσπραξη του
    επιβληθέντος προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 603/1999, annettu 15 päivänä maaliskuuta 1999,
    lopullisen polkumyyntitullin käyttöönotosta Puolasta, Tsekin tasavallasta ja
    Unkarista peräisin olevan polypropeenista valmistetun lyhdelangan ja paalinarun
    tuonnissa sekä väliaikaisen tullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 603/1999 del Consiglio del 15 marzo 1999 che istituisce
    un dazio antidumping definitivo sulle importazioni di spago per legare, di polipropilene,
    originario della Polonia, della Repubblica ceca e dell'Ungheria e che sancisce
    la riscossione definitiva del dazio provvisorio istituito
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 603/1999 van de Raad van 15 maart 1999 tot instelling
    van een definitief antidumpingrecht op de invoer van bindtouw van polypropyleen
    van oorprong uit Polen, de Tsjechische Republiek en Hongarije en tot definitieve
    inning van het voorlopig ingestelde recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 603/1999 do Conselho de 15 de Março de 1999 que cria
    um direito anti-dumping definitivo sobre as importações de cordéis para atadeiras
    ou enfardadeiras de polipropileno originários da Polónia, da República Checa
    e da Hungria e que estabelece a cobrança definitiva do direito provisório
  type: main
- language: es
