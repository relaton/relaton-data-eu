    лекар, включваща и мерки за улесняване eфективното
    упражняване на правото на установяване и на
    свободното предоставяне на услуги
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 18. prosince 1978 o vzájemném uznávání diplomů,
    osvědčení a jiných dokladů o dosažené kvalifikaci veterinárních lékařů
    obsahující opatření k usnadnění účinného výkonu práva usazování a
    volného pohybu služeb
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 78/1026/EØF af 18. december 1978 om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser for dyrlæger,
    omfattende foranstaltninger, som skal lette den faktiske udøvelse af retten til
    etablering og fri udveksling af tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 78/1026/ΕΟΚ του Συμβουλίου της 18ης Δεκεμβρίου
    1978 περί αμοιβαίας αναγνωρίσεως των διπλωμάτων,
    πιστοποιητικών και άλλων τίτλων κτηνιάτρου
    και περί των μέτρων προς διευκόλυνση της πραγματικής
    ασκήσεως του δικαιώματος εγκαταστάσεως και
    του δικαιώματος της ελεύθερης παροχής υπηρεσιών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 18. detsember 1978, mis käsitleb veterinaariaalaste
    diplomite, tunnistuste ja muude kvalifikatsiooni tõendavate dokumentide vastastikust
    tunnustamist ja mis sisaldab meetmeid asutamisõiguse ja teenuste osutamise vabaduse
    kasutamise hõlbustamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 78/1026/ETY, annettu 18 päivänä joulukuuta 1978,
    tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta osoittavien
    asiakirjojen vastavuoroisesta tunnustamisesta eläinlääketieteen alalla sekä
    toimenpiteistä sijoittautumisvapauden ja palvelujen tarjoamisen vapauden tehokkaan
    käyttämisen helpottamiseksi
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1978. december 18.) az állatorvosi oklevelek, bizonyítványok
    és a képesítés megszerzéséről szóló egyéb tanúsítványok kölcsönös
    elismeréséről, illetve a letelepedés és a szolgáltatásnyújtás szabadságának
    tényleges gyakorlását elősegítő intézkedésekről
  type: main
- language: it
  script: Latn
  content: Direttiva 78/1026/CEE del Consiglio, del 18 dicembre 1978, concernente
    il reciproco riconoscimento dei diplomi, certificati ed altri titoli di veterinario
    e comportante misure destinate ad agevolare l'esercizio effettivo del diritto
    di stabilimento e di libera prestazione dei servizi
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1978. gada 18. decembris) par veterinārārstu diplomu,
    sertifikātu un citu kvalifikāciju apliecinošu dokumentu atzīšanu, tostarp
    par pasākumiem, kas palīdz sekmīgi īstenot tiesības veikt uzņēmējdarbību
    un brīvību sniegt pakalpojumus
  type: main
- language: lt
  script: Latn
  content: 1978 m. gruodžio 18 d. Tarybos Direktyva dėl veterinarijos gydytojo diplomų,
    pažymėjimų ir kitų oficialią kvalifikaciją patvirtinančių dokumentų abipusio
    pripažinimo, įskaitant priemones, padedančias veiksmingai naudotis įsisteigimo
    teise ir laisve teikti paslaugas
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tat-18 ta’ Diċembru 1978 li tikkonċerna r-rikonoxximent
    reċiproku ta’ diplomi, ċertifikati u provi oħra ta’ kwalifiki formali fil-mediċina
    veterinarja, inklużi miżuri biex jiffaċilitaw l-eżerċizzju effettiv tad-dritt
    ta’ stabbiliment u l-libertà li jiġu pprovduti servizzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 78/1026/EEG van de Raad van 18 december 1978 inzake de onderlinge
    erkenning van diploma's, certificaten en andere titels van dierenarts, tevens
    houdende maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van
    het recht van vestiging en het vrij verrichten van diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 18 grudnia 1978 r. w sprawie wzajemnego uznawania
    dyplomów, świadectw i innych dokumentów potwierdzających posiadanie kwalifikacji
    w zakresie weterynarii, łącznie ze środkami mającymi na celu ułatwienie skutecznego
    wykonywania prawa przedsiębiorczości i swobody świadczenia usług
  type: main
- language: pt
  script: Latn
  content: Directiva 78/1026/CEE do Conselho, de 18 de Dezembro de 1978, que tem por
    objectivo o reconhecimento mútuo dos diplomas, certificados e outros títulos
    de veterinário e que contém medidas destinadas a facilitar o exercício efectivo
    do direito de estabelecimento e da livre prestação de serviços
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 18 decembrie 1978 privind recunoașterea reciprocă
    a diplomelor, certificatelor și a altor titluri oficiale de calificare în medicina
    veterinară, inclusiv a măsurilor destinate să faciliteze exercitarea efectivă
    a dreptului de stabilire și a libertății de a presta servicii
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 78/1026/EHS z 18. decembra 1978 o vzájomnom uznávaní diplomov,
    osvedčení a iných dokladov o formálnych kvalifikáciách vo veterinárnom
    lekárstve a o opatreniach uľahčujúcich účinné uplatňovanie práva usadiť
    sa a slobody poskytovať služby
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 18. decembra 1978 o vzajemnem priznavanju diplom,
    spričeval in drugih dokazil o formalnih kvalifikacijah v veterinarski medicini,
    vključno z ukrepi za olajšanje učinkovitega uresničevanja pravice do ustanavljanja
    in prostega opravljanja storitev
  type: main
- language: es
  script: Latn
  content: Directiva 78/1026/CEE del Consejo, de 18 de diciembre de 1978, sobre reconocimiento
    recíproco de los diplomas, certificados y otros títulos de veterinario, que
    contiene además medidas destinadas a facilitar el ejercicio efectivo del derecho
    de establecimiento y de libre prestación de servicios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 78/1026/EEG av den 18 december 1978 om ömsesidigt erkännande
    av utbildnings-, examens- och andra behörighetsbevis för veterinärer inklusive
    åtgärder för att underlätta det faktiska utövandet av etableringsrätten
    och friheten att tillhandahålla tjänsterl
