title:
- language: en
  script: Latn
  content: Council Directive 78/1026/EEC of 18 December 1978 concerning the mutual
    recognition of diplomas, certificates and other evidence of formal qualifications
    in veterinary medicine, including measures to facilitate the effective exercise
    of the right of establishment and freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Directive 78/1026/CEE du Conseil, du 18 décembre 1978, visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres de vétérinaire et comportant
    des mesures destinées à faciliter l'exercice effectif du droit d'établissement
    et de libre prestation de services
  type: main
- language: de
  script: Latn
  content: Richtlinie 78/1026/EWG des Rates vom 18. Dezember 1978 für die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    des Tierarztes und für Maßnahmen zur Erleichterung der tatsächlichen Ausübung
    des Niederlassungsrechts und des Rechts auf freien Dienstleistungsverkehr
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 18 декември 1978 година
