    von im Besitz der französischen Interventionsstelle befindlichem Weichweizen
    auf 850 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1293/85 af 21. maj 1985 om ændring
