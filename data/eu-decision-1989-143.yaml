title:
- language: en
  script: Latn
  content: Commission Decision of 21 February 1989 accepting undertakings offered
    in connection with the anti-dumping proceeding concerning imports of urea originating
    in Austria, Hungary, Malaysia or Romania, confirming the undertakings accepted
    pursuant to Council Regulation (EEC) No 3339/87 and terminating the investigations
  type: main
- language: fr
  script: Latn
  content: '89/143/CEE: Décision de la Commission du 21 février 1989 portant acceptation
    d''engagements offerts dans le cadre de la procédure antidumping concernant les
    importations d''urée originaires d''Autriche, de Hongrie, de Malaisie et de Roumanie
    et confirmation des engagements souscrits dans le règlement (CEE) n° 3339/87
    du Conseil et portant clôture de ces enquêtes'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 21. Februar 1989 zur Annahme von Verpflichtungen
    im Rahmen des Antidumpingverfahrens betreffend die Einfuhren von Harnstoff mit
    Ursprung in Malaysia, Österreich, Rumänien und Ungarn, zur Bestätigung der
    im Rahmen der Verordnung (EWG) Nr. 3339/87 des Rates eingegangenen Verpflichtungen
    und zur Einstellung dieser Verfahren (89/143/EWG) (89/143/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 21. februar 1989 om godtagelse af tilsagn
    i forbindelse med antidumpingproceduren vedrørende importen af urinstof med oprindelse
    i Malaysia, Rumænien, Ungarn og Østrig og om bekræftelse af de tilsagn, der
    er afgivet i henhold til Rådets forordning (EØF) nr. 3339/87, og om afslutning
    af disse undersøgelser (89/143/EØF) (89/143/EØF) #'
  type: main
- language: el
  script: Grek
