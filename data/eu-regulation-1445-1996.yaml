title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1445/96 of 24 July 1996 terminating the investigation
    concerning the circumvention of anti-dumping measures imposed by Regulation (EEC)
    No 2861/93 on imports of certain magnetic disks (3,5" microdisks) originating
    in Japan, Taiwan and the People's Republic of China by imports of the same product
    from Canada, Hong Kong, India, Indonesia, Macao, Malaysia, the Philippines, Singapore
    and Thailand, and ceasing registration of this product
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1445/96 de la Commission du 24 juillet 1996 clôturant
    l'enquête sur le contournement des mesures antidumping instituées par le règlement
    (CEE) n° 2861/93 sur les importations de certains disques magnétiques (microdisques
    de 3,5 pouces) originaires du Japon, de T'ai-wan et de République populaire de
    Chine par les importations du même produit originaire du Canada, de Hong-Kong,
    d'Inde, d'Indonésie, de Macao, de Malaysia, des Philippines, de Singapour et
    de Thaïlande et levant l'enregistrement des produits concernés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1445/96 der Kommission vom 24. Juli 1996 zur Einstellung
    der Untersuchung betreffend die Umgehung der mit der Verordnung (EWG) Nr. 2861/93
    eingeführten Antidumpingzölle auf die Einfuhren bestimmter Magnetplatten (3,5"-Mikroplatten)
    mit Ursprung in Japan, Taiwan und der Volksrepublik China durch die Einfuhren
    der gleichen Ware aus Kanada, Hongkong, Indien, Indonesien, Macao, Malaysia, den
    Philippinen, Singapur und Thailand und zur Beendigung der zollamtlichen Erfassung
    dieser Ware
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1445/96 af 24. juli 1996 om afslutning
    af undersøgelsen vedrørende omgåelse af de antidumpingforanstaltninger, der
    ved forordning (EØF) nr. 2861/93 indførtes på importen af visse magnetplader
    (3,5" disketter) med oprindelse i Japan, Taiwan og Den Kinesiske Folkerepublik,
    ved import af samme vare fra Canada, Filippinerne, Hongkong, Indien, Indonesien,
    Macao, Malaysia, Singapore og Thailand og om ophør af registrering af denne vare
  type: main
- language: el
  script: Grek
