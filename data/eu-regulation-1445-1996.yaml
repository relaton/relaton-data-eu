    του ίδιου προϊόντος από τον Καναδά, το Χονγκ
    Κονγκ, την Ινδία, την Ινδονησία, το Μακάο, τη
    Μαλαισία, τις Φιλιππίνες, τη Σιγκαπούρη και
    την Ταϊλάνδη, και για την παύση της υποβολής
    του εν λόγω προϊόντος σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1445/96, annettu 24 päivänä heinäkuuta 1996,
    Japanista, Taiwanista ja Kiinan kansantasavallasta peräisin olevien tiettyjen
    magneettilevykkeiden (3,5 tuuman mikrolevykkeiden) tuonnissa asetuksella (ETY)
    N:o 2861/93 käyttöön otettujen polkumyynnin vastaisten toimenpiteiden kiertämistä
    mainittujen tuotteiden tuonnilla Kanadasta, Hongkongista, Intiasta, Indonesiasta,
