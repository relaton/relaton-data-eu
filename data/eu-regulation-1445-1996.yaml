    sekä kyseisen tuotteen rekisteröinnin lopettamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1445/96 della Commissione del 24 luglio 1996 che chiude
    l'inchiesta relativa all'elusione delle misure antidumping istituite dal regolamento
    (CEE) n. 2861/93 sulle importazioni di alcuni tipi di dischi magnetici (microfloppy
    da 3,5 pollici) originari del Giappone, di Taiwan e della Repubblica popolare
    cinese mediante le importazioni degli stessi prodotti originari del Canada, di
    Hong Kong, dell'India, dell'Indonesia, di Macao, della Malaysia, delle Filippine,
    di Singapore e della Tailandia e mette fino all'obbligo di registrazione per i
    prodotti in questione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1445/96 van de Commissie van 24 juli 1996 tot beëindiging
    van het onderzoek naar de ontwijking van de bij Verordening (EEG) nr. 2861/93
    van de Raad ingestelde anti-dumpingrechten op de invoer van bepaalde magneetschijven
    (3,5" microschijven) van oorsprong uit Japan, Taiwan en de Volksrepubliek China,
    door invoer van dit produkt uit Canada, Hong-Kong, India, Indonesië, Macao, Maleisië,
    de Filippijnen, Singapore en Thailand, en tot beëindiging van de registratie
    van dit produkt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1445/96 da Comissão de 24 de Julho de 1996 que encerra
    o inquérito respeitante à evasão de medidas anti-dumping instituídas pelo
    Regulamento (CEE) nº 2861/93 relativo às importações de certos discos magnéticos
    (microdiscos de 3,5 polegadas) originários do Japão, de Taiwan e da República
    Popular da China por importações do mesmo produto do Canadá, de Hong Kong,
    da Índia, da Indonésia, de Macau, da Malásia, das Filipinas, de Singapura e
    da Tailândia, e que põe termo à obrigação de registo deste produto
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1445/96 de la Comisión de 24 de julio de 1996 por el
    que se da por concluida la investigación referente a la elusión de las medidas
    antidumping establecidas por el Reglamento (CEE) nº 2861/93 sobre las importaciones
    de determinados discos magnéticos (microdiscos de 3,5 pulgadas) originarios de
    Japón, Taiwán y la República Popular China, por las importaciones de determinados
    discos magnéticos originarios de Canadá, Hong Kong, la India, Indonesia, Macao,
    Malasia, Filipinas, Singapur y Tailandia, y por el que se suspende el registro
    de este producto
  type: main
