    της 24ης Ιουλίου 1996 για την προσέγγιση της έρευνας
    σχετικά με την καταστρατήγηση των μέτρων αντιντάμπινγκ
    που επιβλήθηκαν με τον κανονισμό (ΕΟΚ) αριθ.
    2861/93 στις εισαγωγές ορισμένων μαγνητικών δίσκων
    (μικροδίσκων 3,5") καταγωγής Ιαπωνίας, Ταϊβάν
