    HANDEL ZWISCHEN DER ZEHNERGEMEINSCHAFT UND PORTUGAL SOWIE ZWISCHEN PORTUGAL UND
    DRITTLAENDERN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3813/90 af 19. december 1990 om fastsættelse
