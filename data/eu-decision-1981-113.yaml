title:
- language: en
  script: Latn
  content: '81/113/EEC: Commission Decision of 12 February 1981 authorizing Ireland
    not to apply Community treatment to blouses and shirt-blouses, knitted, crocheted
    (not elastic or rubberized), or woven originating in Hong Kong (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/113/CEE: Décision de la Commission, du 12 février 1981, autorisant
    l''Irlande à exclure du traitement communautaire les chemisiers, blouses-chemisiers
    et blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, originaires
    de Hong-kong (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/113/EWG: Entscheidung der Kommission vom 12. Februar 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/113/EØF: Kommissionens beslutning af 12. februar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage (ikke elastisk eller gummeret) eller vævede, med oprindelse
    i Hongkong, og som frit kan omsættes i de øvrige medlemsstater (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/113/ΕΟΚ: Απόφαση τής Επιτροπής τής 12ης
    Φεβρουαρίου 1981 περί εξουσιοδοτήσεως τής Ιρλανδίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    chemisiers, blouses- chemisiers καί μπλούζες, πλεκτά (μή ελαστικά
    ουδέ συνδεδυασμένα μετά καουτσούκ) ή υφασμένα,
    καταγόμενα από τό Χόνγκ Κόνγκ (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/113/CEE: Decisione della Commissione, del 12 febbraio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, le camicette e
    bluse a maglia (non elastica né gommata) o tessute, originarie di Hong Kong (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/113/EEG: Beschikking van de Commissie van 12 februari 1981 houdende
    machtiging van Ierland om blouses en hemdblouses, van brei- of haakwerk (niet-elastisch,
    niet-gegummeerd) of geweven, van oorsprong uit Hong- Kong, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
