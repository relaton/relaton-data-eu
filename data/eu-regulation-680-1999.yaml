title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 680/1999 of 26 March 1999 deciding not to
    accept tenders submitted in response to the 220th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 680/1999 de la Commission du 26 mars 1999 disposant
    de ne pas donner suite aux offres déposées à la suite de la 220e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 680/1999 der Kommission vom 26. März 1999 über den
    Beschluß, den zur 220. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 680/1999 af 26. marts 1999 om ikke at
    tage den 220. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 680/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 26ης Μαρτίου 1999 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για το 220ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 680/1999, annettu 26 päivänä maaliskuuta 1999,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun kahdennensadannenkahdennenkymmenennen osittaisen tarjouskilpailun
    ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 680/1999 della Commissione del 26 marzo 1999 che decide
    di non dar seguito alle offerte presentate per la 220a gara parziale effettuata
    nel quadro delle misure generali d'intervento conformemente al regolamento (CEE)
    n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 680/1999 van de Commissie van 26 maart 1999 houdende
