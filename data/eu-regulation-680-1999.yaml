    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 680/1999 da Comissão de 26 de Março de 1999 que
    rejeita as propostas apresentadas na sequência do ducentésimo vigésimo concurso
    parcial efectuado no âmbito das medidas gerais de intervenção, em conformidade
    com o Regulamento (CEE) n° 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 680/1999 de la Comisión de 26 de marzo de 1999 por
    el que se decide no dar curso a las ofertas presentadas para la 220a licitación
    parcial efectuada en el marco de las medidas generales de intervención en virtud
    del Reglamento (CEE) n° 1627/89
  type: main
- language: sv
  script: Latn
