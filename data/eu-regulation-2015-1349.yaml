title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1349 of 3 August 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for South Africa in
    the list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into or transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1349 de la Commission du 3 août 2015
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives à l'Afrique du Sud dans la liste des pays tiers, territoires, zones
    ou compartiments en provenance desquels certains produits de volailles peuvent
    être importés dans l'Union ou transiter par celle-ci, pour ce qui est de l'influenza
    aviaire hautement pathogène
  type: main
- language: de
  script: Latn
