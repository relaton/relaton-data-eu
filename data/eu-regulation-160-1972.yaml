    autre que le plomb d' oeuvre, en provenance des pays repris de l' annexe II du
    règlement (CEE) n° 1025/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 160/72 der Kommission vom 25. Januar 1972 zur Einführung
