  content: Regulation (EEC) No 160/72 of the Commission of 25 January 1972 establishing
    Community surveillance over imports of unwrought lead, other than bullion lead,
    from countries listed in Annex II to Regulation (EEC) No 1025/70
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 160/72 de la Commission, du 25 janvier 1972, portant
