    modifiant le règlement d’exécution (UE) 2021/403 en ce qui concerne les modèles
    de certificat zoosanitaire et de certificat zoosanitaire/officiel pour l’entrée
    dans l’Union et les mouvements entre les États membres d’envois de certaines
    espèces et catégories de volailles et d’oiseaux captifs et de leurs produits
    germinaux
  type: main
- language: de
  script: Latn
