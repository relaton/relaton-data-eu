  script: Latn
  content: Commission Regulation (EU) No 850/2010 of 27 September 2010 initiating
    a ‘new exporter’ review of Council Regulation (EC) No 1659/2005 imposing a
    definitive anti-dumping duty on imports of certain magnesia bricks originating
    in the People’s Republic of China, repealing the duty with regard to imports
    from one exporter in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 850/2010 de la Commission du 27 septembre 2010 portant
    ouverture d’un réexamen au titre de «nouvel exportateur» du règlement (CE)
    n ° 1659/2005 du Conseil instituant un droit antidumping définitif sur les importations
    de certaines briques de magnésie originaires de la République populaire de Chine,
    abrogeant le droit en ce qui concerne le produit d’un exportateur de ce pays
    et soumettant les importations de ce produit à enregistrement
  type: main
