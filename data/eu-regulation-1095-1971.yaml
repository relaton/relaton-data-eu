title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1095/71 de la Commission, du 27 mai 1971, relatif
    à la constatation qu'il peut être donné suite aux demandes déposées en vue
    de l'obtention des primes à la non-commercialisation du lait et des produits
    laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1095/71 der Kommission vom 27. Mai 1971 zur Feststellung,
    daß den zur Erlangung der Prämien für die Nichtvermarktung von Milch und Milcherzeugnissen
    eingereichten Anträgen stattgegeben werden kann
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1095/71 della Commissione, del 27 maggio 1971, che
    constata la possibilità di dar seguito alle domande presentate per ottenere i
    premi alla non commercializzazione del latte e dei prodotti lattiero- caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1095/71 van de Commissie van 27 mei 1971 met betrekking
    tot de constatering, dat gevolg gegeven kan worden aan de verzoeken die ter verkrijging
    van premies voor het niet in de handel brengen van melk en zuivelprodukten werden
    ingediend
  type: main
