title:
- language: en
  script: Latn
  content: Regulation (EEC) No 411/74 of the Council of 18 February 1974 on certain
    measures to be taken in agriculture for Italy as a result of the fixing, with
    effect from 28 January 1974, of a new representative rate for the Italian lira
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 411/74 du Conseil, du 18 février 1974, relatif à
    certaines mesures à prendre, pour l'Italie, dans le secteur agricole à la suite
    de la fixation avec effet au 28 janvier 1974, d'un nouveau taux représentatif
    pour la lire italienne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 411/74 des Rates vom 18. Februar 1974 über einige
    für Italien auf dem Agrarsektor zu treffende Maßnahmen im Anschluß an die Festsetzung
    eines neuen repräsentativen Kurses für die italienische Lira mit Wirkung vom
    28. Januar 1974
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 411/74 af 18. februar 1974 om visse foranstaltninger,
    der skal træffes for Italien inden for landbruget, som følge af fastsættelse
    af en ny repræsentativ kurs for den italienske lire med virkning fra den 28.
    januar 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 411/74 del Consiglio, del 18 febbraio 1974, relativo
    a talune misure da prendere per l'Italia nel settore agricolo in seguito alla
    fissazione, con effetto dal 28 gennaio 1974, di un nuovo tasso rappresentativo
    per la lira italiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 411/74 van de Raad van 18 februari 1974 betreffende
    bepaalde ten aanzien van Italië in de landbouwsector te nemen maatregelen ingevolge
    de vaststelling, met ingang van 28 januari 1974, van een nieuwe representatieve
    koers voor de Italiaanse lire
  type: main
