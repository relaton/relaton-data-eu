title:
- language: fr
  script: Latn
  content: Décision 68/281/CEE de la Commission, du 14 juin 1968, portant octroi
    au Royaume de Belgique et au Grand-Duché de Luxembourg de contingents tarifaires
    pour les harengs frais, réfrigérés ou congelés, destinés à la transformation
    (position tarifaire Ex 03.01 B I A) 2)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Juni 1968 über die Gewährung von
    Zollkontingenten für Heringe, frisch, gekühlt oder gefroren, zur Verarbeitung
    bestimmt (Tarifnummer ex 03.01 B I a) 2), an das Königreich Belgien und an das
    Großherzogtum Luxemburg
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 giugno 1968, che concede al Regno del
    Belgio e al Granducato del Lussemburgo contingenti tariffari per le aringhe fresche,
    refrigerate o congelate, destinate all'industria conserviera (voce tariffaria
    ex 03.01 B I a) 2)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 juni 1968 houdende toekenning van tariefcontingenten
    aan het Koninkrijk België en het Groothertogdom Luxemburg voor haring, vers,
    gekoeld of bevroren, bestemd voor verwerking (tariefpost ex 03.01 B I a) 2)
  type: main
