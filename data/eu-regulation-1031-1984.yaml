title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1031/84 of 31 March 1984 amending Regulation
    (EEC) No 1469/70 fixing the percentages and quantities of tobacco taken over by
    the intervention agencies and the percentage of Community tobacco production above
    which the procedures laid down in Article 13 of Regulation (EEC) No 727/70 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1031/84 du Conseil du 31 mars 1984 modifiant le règlement
    (CEE) n° 1469/70 fixant les pourcentages et les quantités de tabac pris en charge
    par les organismes d'intervention, ainsi que le pourcentage de la production communautaire
    de tabac, dont le dépassement déclenche les procédures prévues à l'article
    13 du règlement (CEE) n° 727/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1031/84 des Rates vom 31. März 1984 zur Änderung
    der Verordnung (EWG) Nr. 1469/70 zur Festsetzung der Hundertsätze und Mengen
    des von den Interventionsstellen übernommenen Tabaks sowie des Hundertsatzes
    der gemeinschaftlichen Tabakerzeugung, deren Überschreitung die Verfahren nach
    Artikel 13 der Verordnung (EWG) Nr. 727/70 auslöst
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1031/84 af 31. marts 1984 om ændring af
    forordning (EØF) nr. 1469/70 om fastsættelse af procentsatser og mængder af
    den af interventionsorganerne overtagne tobak samt procentsatsen af fællesskabsproduktionen
    af tobak hvis overskridelse udløser foranstaltninger i medfør af artikel 13
    i forordning (EØF) nr. 727/70
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1031/84 του Συμβουλίου
    της 31ης Μαρτίου 1984 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1469/70 περί καθορισμού
    των ποσοστών και των ποσοτήτων καπνού που αναλαμβάνονται
    από τους οργανισμούς παρέμβασης, καθώς και
    του ποσοστού της κοινοτικής παραγωγής καπνού,
    του οποίου η υπέρβαση συνεπάγεται τη θέση σε
    ενέργεια των διαδικασιών που προβλέπονται
    στο άρθρο 13 του κανονισμού (ΕΟΚ) αριθ. 727/70
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1031/84, annettu 31 päivänä maaliskuuta 1984,
    interventioelinten haltuunottaman tupakan prosenttiosuuksista ja määristä sekä
    yhteisön tupakkatuotannon prosenttiosuudesta, jonka ylittyminen käynnistää
    asetuksen (ETY) N:o 727/70 13 artiklassa säädetyn menettelyn annetun asetuksen
    (ETY) N:o 1469/70 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1031/84 del Consiglio del 31 marzo 1984 che modifica
    il regolamento (CEE) n. 1469/70 che fissa le percentuali e i quantitativi di tabacco
    presi a carico da parte degli organismi d'intervento, nonché la percentuale della
    produzione Comunitària di tabacco, il cui superamento è determinante per lo
    scatto delle procedure previste all'articolo 13 del regolamento (CEE) n. 727/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1031/84 van de Raad van 31 maart 1984 tot wijziging
    van Verordening (EEG) nr. 1469/70 houdende vaststelling van de percentages en
    de hoeveelheden door de interventiebureaus overgenomen tabak, alsmede van het
    percentage van de tabaksproduktie in de Gemeenschap bij overschrijding waarvan
    de in artikel 13 van Verordening (EEG) nr. 727/70 bedoelde procedures van toepassing
    worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1031/84 do Conselho, de 31 de Março de 1984, que
    altera o Regulamento (CEE) nº 1469/70 que fixa as percentagens e as quantidades
    de tabaco tomadas a cargo pelos organismos de intervenção, bem como a percentagem
    da produção comunitária de tabaco que, a ser excedida, desencadeia os processos
    previstos no artigo 13º do Regulamento (CEE) nº 727/70
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1031/84 del Consejo, de 31 de marzo de 1984, por el
    que se modifica el Reglamento (CEE) n° 1469/70 por el que se fijan los porcentajes
    y las cantidades de tabaco tomados a su cargo por los organismos de intervención,
    así como el porcentaje de la producción comunitaria de tabaco por encima del
    cual se aplican los procedimientos previstos en el artículo 13 del Reglamento
    (CEE) n° 727/70
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1031/84 av den 31 mars 1984 om ändring av
    förordning (EEG) nr 1469/70 om fastställande av den andel och de kvantiteter
    tobak som övertagits av interventionsorgan samt den andel av tobaksproduktionen
    inom gemenskapen över vilken förfarandet i artikel 13 i förordning (EEG) nr
    727/70 skall tillämpas
