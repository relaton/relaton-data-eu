    frischem, gekühltem oder gefrorenem Rindfleisch der KN-Codes 0201 und 0202 sowie
    von Erzeugnissen der KN-Codes 0206 10 95 und 0206 29 91 für 1992 #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 1158/92 af 28. april 1992 om autonom åbning
