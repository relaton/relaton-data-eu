title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1158/92 of 28 April 1992 opening for 1992,
    as an autonomous measure, a special import quota for high-quality, fresh, chilled
    or frozen beef and veal falling within CN codes 0201 and 0202 and for products
    falling within CN codes 0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1158/92 du Conseil du 28 avril 1992 portant ouverture,
