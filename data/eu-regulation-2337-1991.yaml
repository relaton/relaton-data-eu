title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2337/91 of 1 August 1991 re-establishing
    the levying of customs duties on products falling within CN code 6403, originating
    in India, Thailand and Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2337/91 DE LA COMMISSION du 1er août 1991 portant
