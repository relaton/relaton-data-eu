  content: Commission Regulation (EEC) No 3217/87 of 28 October 1987 re-establishing
    the levying of customs duties on men' s or boys' knitted or crocheted suits, products
    of category 75 (code 40.0750), originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
