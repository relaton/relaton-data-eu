title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 888/79 of 3 May 1979 re-establishing the
    levying of customs duties on terry towelling and similar terry fabrics, of cotton,
    falling within heading No 55.08 and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 888/79 de la Commission, du 3 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux tissus de coton bouclés
    du genre éponge, de la position 55.08 du tarif douanier commun, originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 888/79 der Kommission vom 3. Mai 1979 über die Wiedereinführung
    des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle der Tarifnummer
    55.08, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3157/78 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 888/79 af 3. maj 1979 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, henhørende under pos. 55.08 i den fælles toldtarif, som har oprindelse
    i Indien og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 888/79 della Commissione, del 3 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci del tipo
    spugna, della voce doganale 55.08, originari dell' India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 888/79 van de Commissie van 3 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten van toepassing op bad- of frotteerstof (lussendoek)
    van katoen, van post 55.08, van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3157/78 van de Raad
  type: main
