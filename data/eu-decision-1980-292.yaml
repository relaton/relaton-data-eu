title:
- language: en
  script: Latn
  content: '80/292/EEC: Commission Decision of 18 February 1980 establishing that
    since 1 July 1978 the conditions required for the admission free of Common Customs
    Tariff duties of the scientific apparatus described as ''Varian-Nuclear Magnetic
    Resonance Spectrometer, model XL 100'' , have not been fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/292/CEE: Décision de la Commission, du 18 février 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Varian-Nuclear Magnetic
    Resonance Spectrometer, model XL 100" ne sont plus remplies depuis le 1er juillet
    1978'
  type: main
- language: de
  script: Latn
  content: '80/292/EWG: Entscheidung der Kommission vom 18. Februar 1980, mit der
    festgestellt wird, daß die Voraussetzungen für die Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs für das wissenschaftliche Gerät ,,Varian-Nuclear
    Magnetic Resonance Spectrometer, model XL 100'' '' ab 1. Juli 1978 nicht mehr
    vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/292/EØF: Kommissionens beslutning af 18. februar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Varian-Nuclear Magnetic Resonance Spectrometer,
    model XL 100" ikke er opfyldt efter den 1. juli 1978'
  type: main
- language: el
  script: Grek
  content: '80/292/ΕΟΚ: Απόφαση τής Επιτροπής τής 18ης
    Φεβρουαρίου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Varian — Nuclear Magnetic Resonance Spectrometer,
    model XL 100» δέν συντρέχουν πλέον από τήν 1η Ιουλίου
    1978'
  type: main
- language: it
  script: Latn
  content: '80/292/CEE: Decisione della Commissione, del 18 febbraio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Varian-Nuclear Magnetic
    Resonance Spectrometer, model XL 100" non sono più soddisfatte dal 1° luglio
    1978'
  type: main
- language: nl
  script: Latn
  content: '80/292/EEG: Beschikking van de Commissie van 18 februari 1980 vaststellende
