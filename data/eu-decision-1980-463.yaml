type: standard
title:
- language: en
  script: Latn
  content: '80/463/EEC: Commission Decision of 10 April 1980 not to apply Community
    treatment to men''s and boys''woven breeches, shorts and trousers (including slacks);
    women''s girls''and infants''woven trousers and slacks, falling within subheadings
    ex 61.01 B and ex 61.02 B of the Common Customs Tariff (category 6), originating
    in Yugoslavia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/463/CEE: Décision de la Commission, du 10 avril 1980, autorisant la
    République française à exclure du traitement communautaire les culottes, "shorts"
    et pantalons, tissés, pour hommes et garçonnets, et les pantalons, tissés,
    pour femmes, fillettes et jeunes enfants, des sous-positions ex 61.01 B et ex
    61.02 B du tarif douanier commun (catégorie 6), originaires de Yougoslavie et
    mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/463/EWG: Entscheidung der Kommission vom 10. April 1980, mit der die
    französische Republik ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Shorts und andere kurze
    Hosen und lange Hosen, aus Geweben, für Männer und Knaben ; lange Hosen, aus
    Geweben, für Frauen, Mädchen und Kleinkinder der Tarifstellen ex 61.01 B und
    ex 61.02 B des Gemeinsamen Zolltarifs (Kategorie 6) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/463/EØF: Kommissionens beslutning af 10. april 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage shorts og andre
    korte benklæder til mænd og drenge, vævede ; lange benklæder til kvinder,
    piger og småbørn, vævede, som henhører under pos. ex 61.01 B og ex 61.02 B
    i den fælles toldtarif (kategori 6), har oprindelse i Jugoslavien og frit kan
    omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/463/CEE: Decisione della Commissione, del 10 aprile 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario calzoncini, shorts
    e pantaloni, tessuti, per uomo e per ragazzo, e pantaloni, tessuti, per donna,
    per ragazza e per bambini, delle sottovoci ex 61.01 B e ex 61.02 B della tariffa
    doganale comune (categoria 6), originari della Iugoslavia e messi in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/463/EEG: Beschikking van de Commissie van 10 april 1980 waarbij de
    Franse Republiek wordt gemachtigd shorts en andere korte broeken, lange broeken,
    geweven, voor heren en jongens ; lange broeken, geweven, voor dames, meisjes en
    kinderen, van de posten ex 61.01 B en ex 61.02 B van het gemeenschappelijk douanetarief
    (categorie 6), van oorsprong uit Joegoslavië en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
