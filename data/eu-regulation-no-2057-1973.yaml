title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2057/73 of the Commission of 27 July 1973 re-establishing
    Common Customs Tariff duties on sheep- and lamb-skin leather falling within subheading
    No 41.03 B II, originating in Lebanon, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2057/73 de la Commission, du 27 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux peaux d' ovins de la sous-position tarifaire 41.03 B II, originaires du Liban,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2057/73 der Kommission vom 27. Juli 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Schaf- und Lammleder der Tarifstelle
    41.03 B II, mit Ursprung im Libanon, dem die in der Verordnung (EWG) Nr. 2762/72
    des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2057/73 af 27. juli 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for læder af fåre- og lammeskind under
    underposition 41.03 B II, som har oprindelse i Libanon og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2057/73 della Commissione, del 27 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    pelli ovine della sottovoce doganale n. 41.03 B II originarie del Libano, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2057/73 van de Commissie van 27 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op schapeleder van onderverdeling 41.03 B II, van oorsprong uit
    Libanon, ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van
    19 december 1972 algemene tariefpreferenties werden geopend
  type: main
