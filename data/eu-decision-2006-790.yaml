    und Verfahren für die Streitbeilegung und den anderen einschlägigen WTO-Bestimmungen
    wegen eines Handelshemmnisses in Form einer Zusatzabgabe auf eingeführte Weine
    und Spirituosen und einer Sonderzusatzabgabe auf eingeführte Spirituosen, die
    von Indien erhoben werden, sowie eines Verkaufsverbotes des indischen Bundesstaates
    Tamil Nadu für eingeführte Weine und Spirituosen'
  type: main
