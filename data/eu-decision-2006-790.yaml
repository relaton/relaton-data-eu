title:
- language: en
  script: Latn
  content: '2006/790/EC: Commission Decision of 7 November 2006 concerning initiation
    of dispute settlement proceedings against India under the Understanding on Rules
    and Procedures Governing the Settlement of Disputes and other relevant WTO provisions
    as regards an obstacle to trade constituted by an Additional Duty on imported
    wines and spirits and an Extra Additional Duty on imported spirits maintained
    by India, and a ban on sale of imported wines and spirits maintained by the Indian
    State of Tamil Nadu'
  type: main
- language: fr
  script: Latn
  content: '2006/790/CE: Décision de la Commission du 7 novembre 2006 relative à
    l’ouverture d’une procédure de règlement des différends à l’encontre
    de l’Inde, conformément au mémorandum d’accord sur les règles et procédures
    régissant le règlement des différends et autres dispositions pertinentes de
    l’OMC concernant un obstacle au commerce constitué par un droit additionnel
    appliqué aux vins et spiritueux importés, par un droit additionnel supplémentaire,
    maintenu par l’Inde, sur les spiritueux importés, ainsi que par une interdiction
    des ventes de vins et spiritueux importés maintenue par l’État indien de Tamil
    Nadu'
  type: main
- language: de
  script: Latn
  content: '2006/790/EG: Beschluss der Kommission vom 7. November 2006 über die Einleitung
