title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1251/81 of 11 May 1981 introducing a derogation
    from Regulation (EEC) No 2041/75 on special detailed rules for the application
    of the system of export and import licences and advance-fixing certificates for
    oils and fats in relation to the export of olive oil to Poland
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1251/81 de la Commission, du 11 mai 1981, portant
    dérogation au règlement (CEE) n° 2041/75 portant modalités particulières
    d' application du régime des certificats d' importation, d' exportation et de
    préfixation dans le secteur des matières grasses en vue de l' exportation d'
    huile d' olive vers la Pologne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1251/81 der Kommission vom 11. Mai 1981 zur Abweichung
    von der Verordnung (EWG) Nr. 2041/75 über besondere Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für
    Fette im Hinblick der Ausfuhr von Olivenöl nach Polen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1251/81 af 11. maj 1981 om fravigelse
    af forordning (EØF) nr. 2041/75 om de særlige gennemførelsesbestemmelser for
    ordningen med import- og eksportlicencer og forudfastsættelsesattester for fedtstoffer
    med henblik på eksport af olivenolie til Polen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1251/81 τής Επιτροπής
    τής 11ης Μαΐου 1981 περί παρεκκλίσεως από τόν
    κανονισμό (ΕΟΚ) αριθ. 2041/75 «περί ιδιαίτερων
    λεπτομερειών εφαρμογής τού καθεστώτος τών
    πιστοποιητικών εισαγωγής, εξαγωγής καί προκαθορισμού
    στόν τομέα τών λιπαρών ουσιών», εν όψει τής
    εξαγωγής ελαιολάδου στήν Πολωνία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1251/81 della Commissione, dell' 11 maggio 1981, che
    deroga al regolamento (CEE) n. 2041/75 che stabilisce le modalità particolari
    d' applicazione del regime dei titoli d' importazione, di esportazione e di fissazione
    anticipata nel settore dei grassi per l' esportazione di olio d' oliva a destinazione
    della Polonia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1251/81 van de Commissie van 11 mei 1981 houdende
    afwijking van Verordening (EEG) nr. 2041/75 houdende bijzondere uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten in de sector
    oliën en vetten met het oog op uitvoer van olijfolie naar Polen
  type: main
