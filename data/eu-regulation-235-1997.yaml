title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 235/97 of 7 February 1997 determining to
    what extent applications for import rights for calves not exceeding 80 kilograms
    lodged pursuant to Regulation (EC) No 2501/96 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 235/97 DE LA COMMISSION du 7 février 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au titre du règlement (CE) n° 2051/96 relatif à l'importation de
    veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 235/97 DER KOMMISSION vom 7. Februar 1997 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte von höchstens 80 kg wiegenden
    Rindern gemäß der Verordnung (EG) Nr. 2501/96 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 235/97 af 7. februar 1997 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importrettigheder for
    kalve på ikke over 80 kg i henhold til forordning (EF) nr. 2501/96 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 235/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 7ης Φεβρουαρίου 1997 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως δικαιωμάτων εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 2501/96 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 235/97, annettu 7 päivänä helmikuuta 1997,
    asetuksen (EY) N:o 2501/96 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 235/97 DELLA COMMISSIONE del 7 febbraio 1997 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    nel quadro del regolamento (CE) n. 2501/96 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 235/97 VAN DE COMMISSIE van 7 februari 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten tot invoer
    die zijn ingediend op grond van Verordening (EG) nr. 2501/96 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 235/97 DA COMISSÃO de 7 de Fevereiro de 1997 que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 2501/96, relativo à importação
    de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 235/97 DE LA COMISIÓN de 7 de febrero de 1997 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de derechos
    de importación presentadas con arreglo al Reglamento (CE) n° 2501/96 relativo
    a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 235/97 av den 7 februari 1997 om fastställande
    av i vilken utsträckning ansökningar om importrättigheter som lämnats in i
    enlighet med förordning (EG) nr 2501/96 angående import av kalvar som väger
    högst 80 kg kan godkännas
  type: main
