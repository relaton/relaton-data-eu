title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 475/2011 of 13 May 2011 amending
    Regulation (EC) No 1425/2006 imposing a definitive anti-dumping duty on imports
    of certain plastic sacks and bags originating in the People’s Republic of China
    and Thailand, and terminating the proceeding on imports of certain plastic sacks
    and bags originating in Malaysia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 475/2011 du Conseil du 13 mai 2011
    modifiant le règlement (CE) n ° 1425/2006 instituant un droit antidumping définitif
    sur les importations de certains sacs et sachets en matières plastiques originaires
    de la République populaire de Chine et de Thaïlande, et clôturant la procédure
    concernant les importations de certains sacs et sachets en matières plastiques
    originaires de Malaisie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 475/2011 des Rates vom 13. Mai 2011 zur
    Änderung der Verordnung (EG) Nr. 1425/2006 zur Einführung eines endgültigen
    Antidumpingzolls auf die Einfuhren bestimmter Säcke und Beutel aus Kunststoffen
    mit Ursprung in der Volksrepublik China und Thailand und zur Einstellung des Verfahrens
    betreffend die Einfuhren bestimmter Säcke und Beutel aus Kunststoffen mit Ursprung
    in Malaysia
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 475/2011 на Съвета
    от 13 май 2011 година за изменение на Регламент
