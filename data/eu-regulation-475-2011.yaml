    мито върху вноса на някои пластмасови чували
    и торбички с произход от Китайската народна
    република и Тайланд и прекратяване процедурата
    по вноса на някои пластмасови чували и торбички
    с произход от Малайзия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 475/2011 ze dne 13. května 2011
    o změně nařízení (ES) č. 1425/2006, kterým se ukládá konečné antidumpingové
    clo z dovozu některých plastových pytlů a sáčků pocházejících z Čínské
    lidové republiky a Thajska a kterým se ukončuje řízení týkající se dovozu
    některých plastových pytlů a sáčků pocházejících z Malajsie
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 475/2011 af 13. maj 2011 om
