    vonatkozó eljárás megszüntetéséről szóló 1425/2006/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 475/2011 del Consiglio, del 13 maggio
    2011 , che modifica il regolamento (CE) n. 1425/2006, che impone un dazio antidumping
    definitivo sulle importazioni di alcuni tipi di sacchi e sacchetti di plastica
    originari della Repubblica popolare cinese e della Thailandia e chiude il procedimento
    relativo alle importazioni di alcuni tipi di sacchi e sacchetti di plastica originari
    della Malaysia
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 475/2011 ( 2011. gada 13. maijs ),
    ar kuru groza Regulu (EK) Nr. 1425/2006, ar ko uzliek galīgo antidempinga maksājumu
    dažu Ķīnas Tautas Republikas un Taizemes izcelsmes plastikāta maisu un maisiņu
    importam un pārtrauc procedūru attiecībā uz dažu Malaizijas izcelsmes plastikāta
    maisu un maisiņu importu
  type: main
- language: lt
  script: Latn
  content: 2011 m. gegužės 13 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 475/2011,
    kuriuo iš dalies keičiamas Tarybos reglamentas (EB) Nr. 1425/2006, nustatantis
    galutinį antidempingo muitą tam tikriems importuojamiems Kinijos Liaudies Respublikos
    ir Tailando kilmės plastikiniams maišeliams ir krepšeliams ir nutraukiantis
    tyrimą dėl tam tikrų Malaizijos kilmės plastikinių maišelių ir krepšelių
    importo
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kunsill (UE) Nru 475/2011 tat- 13 ta’
    Mejju 2011 li jemenda r-Regolament (KE) Nru 1425/2006 li jimponi dazju anti-dumping
    definittiv fuq l-importazzjonijiet ta’ ċerti xkejjer u basktijiet tal-plastik
    li joriġinaw fir-Repubblika Popolari taċ-Ċina u fit-Tajlandja, u li jtemm il-proċediment
    dwar l-importazzjonijiet ta’ ċerti xkejjer u basktijiet tal-plastik li joriġinaw
    fil-Malażja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 475/2011 van de Raad van 13 mei 2011 tot
    wijziging van Verordening (EG) nr. 1425/2006 tot instelling van een definitief
    antidumpingrecht op de invoer van bepaalde kunststof zakken uit de Volksrepubliek
    China en Thailand en tot beëindiging van de procedure betreffende de invoer van
    bepaalde kunststof zakken uit Maleisië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 475/2011 z dnia 13 maja 2011 r.
    w sprawie zmiany rozporządzenia (WE) nr 1425/2006 nakładającego ostateczne
    cło antydumpingowe na przywóz niektórych worków i toreb plastikowych pochodzących
    z Chińskiej Republiki Ludowej i Tajlandii oraz kończącego postępowanie dotyczące
    przywozu niektórych worków i toreb plastikowych pochodzących z Malezji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 475/2011 do Conselho, de 13 de Maio
    de 2011 , que altera o Regulamento (CE) n. ° 1425/2006 que institui um direito
    anti-dumping definitivo sobre as importações de determinados sacos de plástico
    de quaisquer dimensões originários da República Popular da China e da Tailândia
    e que encerra o processo relativo às importações de determinados sacos de plástico
    de quaisquer dimensões originários da Malásia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 475/2011 al Consiliului din
    13 mai 2011 de modificare a Regulamentului (CE) nr. 1425/2006 de instituire a
    unui drept antidumping definitiv la importurile unor saci și pungi din materiale
    plastice originare din Republica Populară Chineză și din Thailanda și de închidere
    a procedurii privind importurile unor saci și pungi din materiale plastice originare
    din Malaezia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 475/2011 z 13. mája 2011 , ktorým
    sa mení a dopĺňa nariadenie (ES) č. 1425/2006, ktorým sa ukladá konečné
    antidumpingové clo na dovoz určitých plastových vriec a vrecúšok s pôvodom
    v Čínskej ľudovej republike a Thajsku a ukončuje sa konanie týkajúce sa
    dovozu určitých plastových vriec a vrecúšok s pôvodom v Malajzii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 475/2011 z dne 13. maja 2011 o spremembi
    Uredbe (ES) št. 1425/2006 o uvedbi dokončne protidampinške dajatve na uvoz
    nekaterih vreč in vrečk iz plastičnih mas s poreklom iz Ljudske republike Kitajske
    in Tajske ter o zaključku postopka glede uvoza nekaterih vreč in vrečk iz plastičnih
    mas s poreklom iz Malezije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 475/2011 del Consejo, de 13 de mayo
    de 2011 , que modifica el Reglamento (CE) n ° 1425/2006 por el que se establece
    un derecho antidumping definitivo sobre las importaciones de determinadas bolsas
    y bolsitas de plástico originarias de la República Popular China y Tailandia,
    y se da por concluido el procedimiento relativo a las importaciones de determinadas
    bolsas y bolsitas de plástico originarias de Malasia
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 475/2011 av den 13 maj 2011 om
    ändring av förordning (EG) nr 1425/2006 om införande av en slutgiltig antidumpningstull
    på import av vissa säckar, bärkassar och påsar av plast med ursprung i Folkrepubliken
    Kina och Konungariket Thailand och om avslutande av förfarandet beträffande
    import av vissa säckar, bärkassar och påsar av plast med ursprung i Malaysia
