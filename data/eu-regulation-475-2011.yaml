  script: Latn
  content: A Tanács 475/2011/EU végrehajtási rendelete ( 2011. május 13. ) a Kínai
    Népköztársaságból és Thaiföldről származó egyes műanyag zsákok és
    zacskók behozatalára vonatkozó végleges dömpingellenes vám kivetéséről,
