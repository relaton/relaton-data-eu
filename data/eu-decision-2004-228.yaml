  content: '2004/228/EC: Council Decision of 26 February 2004 authorising Spain to
    apply a measure derogating from Article 21 of the Sixth Council Directive 77/388/EEC
    on the harmonisation of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2004/228/CE: Décision du Conseil du 26 février 2004 autorisant le Royaume
