    der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern abweichende
    Regelung anzuwenden'
  type: main
- language: da
  script: Latn
  content: '2004/228/EF: Rådets beslutning af 26. februar 2004 om bemyndigelse af
