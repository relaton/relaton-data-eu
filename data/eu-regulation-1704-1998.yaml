title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1704/98 of 30 July 1998 determining the extent
    to which import licence applications submitted in July 1998 under the tariff quotas
    for beef provided for by Regulation (EC) No 1926/96 for Estonia, Latvia, and Lithuania
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1704/98 de la Commission du 30 juillet 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1998 pour les contingents tarifaires de la viande bovine
    prévus par le règlement (CE) n° 1926/96 pour l'Estonie, la Lettonie et la Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1704/98 der Kommission vom 30. Juli 1998 zur Bestimmung
    des Ausmaßes, in dem den im Juli 1998 gestellten Anträgen auf Erteilung von
    Einfuhrlizenzen im Rahmen der in der Verordnung (EG) Nr. 1926/96 des Rates für
    Litauen, Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1704/98 af 30. juli 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicenser indgivet
    i juli 1998 for de toldkontingenter i oksekødssektoren, der er fastsat i forordning
    (EF) nr. 1926/96 for Estland, Letland og Litauen
  type: main
- language: el
  script: Grek
