  script: Latn
  content: '82/175/CEE: Decisione della Commissione, del 10 marzo 1982, relativa ad
    un aiuto diretto concesso dal governo belga agli orticoltori professionali soggetti
    a un regime particolare d''imposta sul valore aggiunto, per l''acquisto di combustibili
