title:
- language: en
  script: Latn
  content: '82/175/EEC: Commission Decision of 10 March 1982 on a direct aid for the
    purchase of oil-based fuels for heating glasshouses, granted by the Belgian Government
    to commercial horticulturalists subject to the special value-added tax scheme
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/175/CEE: Décision de la Commission, du 10 mars 1982, relative à une
    aide directe à l''achat des carburants pétroliers utilisés pour le chauffage
    des serres, accordée par le gouvernement belge en faveur des horticulteurs professionnels
    soumis au régime particulier de la taxe sur la valeur ajoutée (Les textes en
    langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/175/EWG: Entscheidung der Kommission vom 10. März 1982 über eine
    von der belgischen Regierung gewährte direkte Beihilfe zum Kauf von Mineralölbrennstoffen
    zur Beheizung von Gewächshäusern zugunsten der einer Mehrwertsteuersonderregelung
    unterliegenden Gartenbaubetriebe (Nur der französische und niederländische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/175/EØF: Kommissionens beslutning af 10. marts 1982 om en direkte
    støtte bevilget af den belgiske regering til gartnere, som omfattes af den særlige
    merværdiafgiftsordning, til indkøb af brændselsolie til opvarmning af væksthuse
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/175/EOK: Απόφαση τής Επιτροπής τής 10ης Μαρτίου
    1982 περί αμέσου ενισχύσεως κατά τήν αγορά καυσίμων
    πετρελαίου πού χρησιμοποιούνται γιά τή θέρμανση
    θερμοκηπίων, η οποία χορηγείται από τή βελγική
    κυβέρνηση σέ ορισμένους επαγγελματίες παραγωγούς
    οπωροκηπευτικών πού υπόκεινται στό ειδικό
    καθεστώς τού φόρου προστιθεμένης αξίας (Τα
