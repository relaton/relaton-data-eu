title:
- language: en
  script: Latn
  content: Regulation (EEC) No 327/71 of the Council of 15 February 1971 laying down
    certain general rules relating to contracts for first processing and market preparation,
    to storage contracts and to disposal of tobacco held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 327/71 du Conseil, du 15 février 1971, fixant certaines
    règles générales relatives aux contrats de première transformation et conditionnement,
    aux contrats de stockage ainsi qu' à l' écoulement des tabacs détenus par les
    organismes d' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 327/71 des Rates vom 15. Februar 1971 zur Festsetzung
    bestimmter Grundregeln für die Verträge über die erste Bearbeitung und Aufbereitung,
    für Lagerverträge sowie für den Absatz des im Besitz der Interventionsstellen
    befindlichen Tabaks
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 327/71 af 15. februar 1971 om fastsættelse
    af visse almindelige regler for kontrakter om den første bearbejdning og behandling,
    for oplagringskontrakter samt for afsætningen af den tobak, som interventionsorganerne
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 327/71 του Συμβουλίου
    της 15ης Φεβρουαρίου 1971 περί καθορισμού ορισμένων
    γενικών κανόνων που αφορούν τις συμβάσεις
    εμπορικής επεξεργασίας και συσκευασίας, τις
    συμβάσεις αποθεματοποιήσεως, καθώς και τη
    διάθεση των κατεχομένων από τους οργανισμούς
    παρεμβάσεως καπνών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 327/71, annettu 15 päivänä helmikuuta 1971,
    tietyistä interventioelinten hallussaan pitämän tupakan ensiasteen jalostus-
    ja kauppakunnostussopimuksia, varastointisopimuksia ja myyntiä koskevista yleisistä
    säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 327/71 del Consiglio, del 15 febbraio 1971, che fissa
    talune norme generali relative ai contratti di prima trasformazione e di condizionamento,
    ai contratti d' ammasso ed allo smercio dei tabacchi detenuti dagli organismi
    d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 327/71 van de Raad van 15 februari 1971 houdende
    vaststelling van bepaalde algemene voorschriften betreffende de contracten voor
    eerste bewerking en verpakking, de opslagcontracten, alsmede de afzet van tabak
    die in het bezit is van de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 327/71 do Conselho, de 15 de Fevereiro de 1971,
    que estabelece certas regras gerais relativas aos contratos de primeira transformação
    e acondicionamento, aos contratos de armazenagem, e ao escoamento dos tabacos
    na posse dos organismos de intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 327/71 del Consejo, de 15 de febrero de 1971, por
    el que se establecen determinadas normas generales relativas a los contratos de
    primera transformación y acondicionamiento, a los contratos de almacenamiento
    y a la comercialización del tabaco en poder de los organismos de intervención
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 327/71 av den 15 februari 1971 om allmänna
    bestämmelser för kontrakt avseende den första bearbetningen och iordningställandet,
