title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2123/77 of 27 September 1977 re-establishing
    the levying of customs duties on other wood sawn lengthwise, falling within subheading
    44.14 B, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2123/77 de la Commission, du 27 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres bois
    simplement sciés longitudinalement, de la sous-position tarifaire 44.14 B, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2123/77 der Kommission vom 27. September 1977 zur
    Wiedereinführung des Zollsatzes für anderes Holz, in der Längsrichtung gesägt,
    der Tarifstelle 44.14 B, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2123/77 af 27. september 1977 om genindførelse
    af opkrævning af toldafgifter for andet træ, savet i længderetningen, skåret
    eller skrællet, etc., under underposition 44.14 B, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2123/77 della Commissione, del 27 settembre 1977,
    che ripristina la riscossione dei dazi doganali applicabili agli altri legni semplicemente
    segati per il lungo, della sottovoce doganale 44.14 B, originari dei paesi in
    via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2123/77 van de Commissie van 27 september 1977 houdende
    wederinstelling van de heffing van de douanerechten voor ander hout, enkel overlangs
    gezaagd, van post 44.14 B, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden
    geopend
  type: main
