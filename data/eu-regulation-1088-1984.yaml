id: EURegulation10881984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1088/84 of 18 April 1984 laying down to
    what extent applications for issue of export licences submitted during April 1984
    for beef and veal products which may benefit from special import treatment in
    a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1088/84 de la Commission, du 18 avril 1984, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 1984 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1088/84 der Kommission vom 18. April 1984 über das
    Ausmaß, in dem den im April 1984 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1088/84 af 18. april 1984 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i april
    1984 for oksekødprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1088/84 της Επιτροπής
    της 18ης Απριλίου 1984 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Απρίλιο 1984 για τα προϊόντα
    του τομέα του βοείου κρέατος που δύνανται να
    τύχουν ειδικής μεταχειρίσεως κατά την εισαγωγή
    σε τρίτη χώρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1088/84 della Commissione, del 18 aprile 1984, che
    stabilisce in quale misura può essere dato eseguito alle domande di titoli di
    esportazione presentate nel mese di aprile 1984 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1088/84 van de Commissie van 18 april 1984 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 1984 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
