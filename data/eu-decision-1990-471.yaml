    Κάτω Χώρες να προβλέπουν έναν ελάχιστο αριθμό
    ζώων στις αιτήσιες πριμοδοτήσεις για τη διατήρηση
    του πληθυσμού των θηλαζουσών αγελάδων (Το κείμενο
    στην ολλανδική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
