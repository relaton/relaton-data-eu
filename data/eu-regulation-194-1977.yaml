  content: Council Regulation (EEC) No 194/77 of 28 January 1977 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Poland, the GDR or the USSR
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 194/77 du Conseil, du 28 janvier 1977, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Pologne, de la République démocratique allemande
    et de l'Union des républiques socialistes soviétiques
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 194/77 des Rates vom 28. Januar 1977 zur Festlegung
    bestimmter Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    gegenüber Schiffen, die die Flagge Polens, der DDR oder der UdSSR führen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 194/77 af 28. januar 1977 om fastlæggelse
