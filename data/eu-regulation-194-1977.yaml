    som skal finde anvendelse på fartøjer, der fører Polens, DDR's eller USSR's
    flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 194/77 del Consiglio, del 28 gennaio 1977, che fissa
