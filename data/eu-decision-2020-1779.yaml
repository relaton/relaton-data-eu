    mérő-, szabályozó- és laboratóriumi készülékekre vonatkozó harmonizált
    szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/1779 della Commissione del 27 novembre
