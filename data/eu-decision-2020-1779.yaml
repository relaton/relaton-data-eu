  content: Commission Implementing Decision (EU) 2020/1779 of 27 November 2020 amending
    Implementing Decision (EU) 2019/1956 as regards harmonised standards for certain
    household and similar appliances, electrical supply track systems for luminaires,
    luminaires for emergency lighting, switches for household and similar fixed electrical
    installations, circuit breakers, proximity switches, arc welding power sources
    and electrical equipment for measurement, control and laboratory use
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1779 de la Commission du 27 novembre
    2020 modifiant la décision d’exécution (UE) 2019/1956 en ce qui concerne les
    normes harmonisées applicables à certains appareils électrodomestiques et analogues,
    aux systèmes d’alimentation électrique par rail pour luminaires, aux luminaires
    pour éclairage de secours, aux interrupteurs pour installations électriques
    fixes domestiques et analogues, aux disjoncteurs, aux détecteurs de proximité,
    aux sources de courant pour le soudage à l’arc et aux appareils électriques
    de mesurage, de régulation et de laboratoire
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1779 der Kommission vom 27. November
