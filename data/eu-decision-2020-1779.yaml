    gospodinjske in podobne aparate, električne tračne napajalne sisteme za svetilke,
    svetilke za razsvetljavo v sili, stikala za gospodinjske in podobne fiksne električne
    napeljave, odklopnike, stikala za prižiganje iz bližine, napajalne vire za obločne
    varilnike ter električno opremo za meritve, nadzor in laboratorijsko uporabo
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/1779 de la Comisión de 27 de noviembre
