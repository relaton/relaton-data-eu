id: EUDecision197772
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 November 1976 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's, girls' and infants' coats, jackets, dresses and
    skirts, falling within heading No ex 61.02 of the Common Customs Tariff, originating
    in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/72/CEE: Décision de la Commission, du 3 novembre 1976, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux, vestes, robes et jupes pour
    femmes, fillettes et jeunes enfants, de la position Ex 61.02 du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. November 1976, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Mäntel, Jäckchen, Kleider und Röcke für Frauen, Mädchen und Kleinkinder,
    der Tarifstelle ex 61.02 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. november 1976 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage frakker og jakker (undtagen arbejds-, hjemme- og strandjakker), kjoler
    og nederdele til kvinder, piger og småbørn, som henhører under pos. ex 61.02
    i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 novembre 1976, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i cappotti, le giacche, i vestiti e le gonne per donna,
    per ragazza e per bambini della voce ex 61.02 della tariffa doganale comune, originari
    di Taiwan e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 november 1976 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd mantels, jasjes, japonnen en rokken voor dames, meisjes en kinderen,
    van post ex 61.02 van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
