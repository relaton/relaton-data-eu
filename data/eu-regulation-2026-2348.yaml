    en lo que respecta a la prórroga de los períodos de aprobación de las sustancias
    activas éster metílico del ácido 2,5-diclorobenzoico, acequinocilo, ácido
    acético, fosfuro de aluminio, amidosulfurón, buprofezina, carburo de calcio,
    emamectina, etileno, ácidos grasos C7 a C20, fenoxaprop-P, flonicamid (IKI-220),
    halosulfurón-metilo, sulfato de hierro, fosfuro de magnesio, metamitrona, aceite
    de naranja, quinmeraco, tiosulfato de plata y sodio, sulcotriona, tembotriona,
    Trichoderma asperellum (cepas ICC012, T25 y TV1), Trichoderma atroviride (cepa
    T-11), Trichoderma gamsii (cepa ICC080), Trichoderma harzianum (cepas T-22 e ITEM
    908) y fosfuro de cinc
  type: main
