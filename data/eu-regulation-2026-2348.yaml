    sulfat, magnezijev fosfid, metamitron, olje pomarančevca, kvinmerak, natrij srebrov
    tiosulfat, sulkotrion, tembotrion, Trichoderma asperellum sevi ICC012, T25 in
    TV1, Trichoderma atroviride sev T-11, Trichoderma gamsii sev ICC080, Trichoderma
    harzianum seva T-22 in ITEM 908 ter cinkov fosfid
