type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 February 1989 authorizing the Kingdom of Spain
    to apply intra-Community surveillance to imports of certain television receivers
    originating in certain third countries
  type: main
- language: fr
  script: Latn
  content: '89/183/CEE: Décision de la Commission du 28 février 1989 autorisant
    le Royaume d''Espagne à procéder à une surveillance intracommunautaire des
    importations de certains appareils récepteurs de télévision originaires de
    certains pays tiers (Le texte en langue espagnole est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 28. Februar 1989 zur Ermaechtigung des
    Koenigreichs Spanien zur Einfuehrung einer innergemeinschaftlichen Ueberwachung
    der Einfuhren bestimmter aus Drittlaendern stammender und in der Gemeinschaft
    im freien Verkehr befindlicher Fernsehempfangsgeraete
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 28. februar 1989 om bemyndigelse af Kongeriget
    Spanien til at indfoere tilsyn inden for Faellesskabet med indfoerslen af visse
    fjernsynsmodtagere med oprindelse i visse tredjelande
  type: main
- language: el
  script: Grek
  content: '89/183/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Φεβρουαρίου 1989 που εξουσιοδοτεί το Βασίλειο
    της Ισπανίας να θεσπίσει ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων τηλεοπτικών δεκτών
    καταγωγής ορισμένων τρίτων χωρών'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 28 febbraio 1989 che autorizza il Regno
    di Spagna ad istituire una sorveglianza intracomunitaria delle importazioni di
    apparecchi riceventi per la televisione originari di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 28 februari 1989 houdende machtiging van
    het Koninkrijk Spanje tot toepassing van een intracommunautair toezicht ten aanzien
    van de invoer van bepaalde ontvangtoestellen voor televisie, van oorsprong uit
    bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 28 de Fevereiro de 1989 que autoriza o Reino de
    Espanha a proceder a uma vigilância intracomunitaria das importaçoes de certos
    aparelhos receptores de televisao originarios de certos paises terceiros
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 28 de febrero de 1989 por la que se autoriza
    al Reino de Espana a establecer medidas de vigilancia intracomunitarias en relacion
    con las importaciones de determinados receptores de television originarios de
    algunos terceros paises
  type: main
