    1996 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1374/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
