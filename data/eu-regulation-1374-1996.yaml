  content: COMMISSION REGULATION (EC) No 1374/96 of 16 July 1996 laying down to what
    extent applications for issue of export licences submitted during July 1996 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1374/96 DE LA COMMISSION du 16 juillet 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 1996 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1374/96 DER KOMMISSION vom 16. Juli 1996 über das
