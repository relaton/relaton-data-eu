title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 771/84 of 26 March 1984 re-establishing
    the levying of customs duties on coumarin, methylcoumarins and ethylcoumarins
    falling within subheading 29.35 N and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 771/84 de la Commission du 26 mars 1984 portant rétablissement
    de la perception des droits de douane applicables à la coumarine, aux méthylcoumarines
    et aux éthylcoumarines de la sous-position 29.35 N du tarif douanier commun,
    originaires de Chine, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 771/84 der Kommission vom 26. März 1984 zur Wiedereinführung
    der Erhebung der Zölle für Cumarin, Methylcumarine und Äthylcumarine der Tarifstelle
    29.35 N mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 771/84 af 26. marts 1984 om genindførelse
    af opkrævning af told for cumarin, methylcumariner og ethylcumariner henhørende
    under pos. 29.35 N og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 771/84 της Επιτροπής
    της 26ης Μαρτίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για την κουμαρίνη, τις
    μεθυλοκουμαρίνες και τις αιθυλοκουμαρίνες,
    της διακρίσεως 29.35 Ν του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 771/84 della Commissione del 26 marzo 1984 che ripristina
    la riscossione dei dazi doganali applicabili alla cumarina, metilcumarine e etilcumarine,
    della sottovoce 29.35 N della tariffa doganale comune, originarie della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 771/84 van de Commissie van 26 maart 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op cumarine, methylcumarinen
    en ethylcumarinen, van postonderverdeling 29.35 N, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
