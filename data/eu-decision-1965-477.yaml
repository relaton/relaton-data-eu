title:
- language: fr
  script: Latn
  content: Décision 65/477/CEE de la Commission, du 12 octobre 1965, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception d'une
    taxe compensatoire sur les importations en République fédérale d'Allemagne,
    de pain et de produits similaires, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '65/477/EWG: Entscheidung der Kommission vom 12. Oktober 1965 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Brot und ähnlichen Erzeugnissen aus dem Königreich der Niederlande
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '65/477/CEE: Decisione della Commissione, del 12 ottobre 1965, che modifica
    nuovamente la decisione del 6 novembre 1964 che autorizza la riscossione di una
    tassa compensativa all''importazione, nella Repubblica federale di Germania, di
    pane e prodotti analoghi in provenienza dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '65/477/EEG: Beschikking van de Commissie van 12 oktober 1965 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van brood en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
