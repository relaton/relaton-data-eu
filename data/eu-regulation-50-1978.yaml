title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 50/78 of 10 January 1978 re-establishing
    the levying of customs duties on cotton yarn, put up for retail sale falling within
    heading No 55.06, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 50/78 de la Commission, du 10 janvier 1978, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton conditionnés pour la vente au détail, de la position tarifaire 55.06,
    originaires de la Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 50/78 der Kommission vom 10. Januar 1978 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne in Aufmachungen für den Einzelverkauf
    der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 50/78 af 10. januar 1978 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger,
    under position 55.06, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 50/78 della Commissione, del 10 gennaio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone preparati
    per la vendita al minuto, della voce doganale 55.06, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 50/78 van de Commissie van 10 januari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    Joegoslavië, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2706/77 van de Raad
  type: main
