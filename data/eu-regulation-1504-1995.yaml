title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1504/95 of 29 June 1995 amending Regulations
    (EEC) No 2699/93 and (EC) No 1559/94 with regard to the transitional adjustment
    of certain rules on imports to the Community of certain egg and poultrymeat products
    from the Republic of Poland, the Republic of Hungary, the Czech Republic, the
    Slovak Republic, the Republic of Bulgaria and Romania in order to implement the
    Agricultural Agreement concluded during the Uruguay Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1504/95 de la Commission, du 29 juin 1995, modifiant
    les règlements (CEE) n° 2699/93 et (CE) n 1559/94 en ce qui concerne l'adaptation
    transitoire de certaines dispositions relatives aux importations dans la Communauté
    de certains produits des secteurs des oeufs et de la viande de volaille en provenance
    de République de Pologne, de République de Hongrie, de République tchèque,
    de République slovaque, de République de Bulgarie et de Roumanie en vue de la
    mise en oeuvre de l'accord sur l'agriculture conclu dans le cadre des négociations
    du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1504/95 der Kommission vom 29. Juni 1995 zur Änderung
    der Verordnungen (EWG) Nr. 2699/93 und (EG) Nr. 1559/94 zur übergangsweisen Anpassung
    mehrerer Bestimmungen betreffend die Einfuhr in die Gemeinschaft von Erzeugnissen
    der Sektoren Eier und Geflügelfleisch aus der Republik Polen, der Republik Ungarn,
    der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien für die Anwendung des im Rahmen der multilateralen
    Handelsverhandlungen der Uruguay-Runde über die Landwirtschaft getroffenen Übereinkommens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1504/95 af 29. juni 1995 om ændring
    af forordning (EØF) nr. 2699/93 og (EF) nr. 1559/94 for så vidt angår midlertidig
    tilpasning af visse bestemmelser for indførsel til Fællesskabet af visse æg-
    og fjerkrækødsprodukter fra Polen, Ungarn, Tjekkiet, Slovakiet, Bulgarien og
    Rumænien med henblik på iværksættelsen af den landbrugsaftale, der er indgået
    i forbindelse med forhandlingerne under Uruguay-runden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1504/95 της Επιτροπής
    της 29ης Ιουνίου 1995 για τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 2699/93 και (ΕΚ) αριθ. 1559/94 όσον αφορά
    την προσωρινή προσαρμογή ορισμένων διατάξεων
    που αφορούν τις εισαγωγές στην Κοινότητα ορισμένων
    προϊόντων των τομέων των αυγών και του κρέατος
    πουλερικών που προέρχονται από τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακική Δημοκρατία,
    τη Δημοκρατία της Βουλγαρίας και της Ρουμανίας
    για την εφαρμογή της Συμφωνίας επί της Γεωργίας
    που συνήφθη στο πλαίσιο των διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1504/95, annettu 29 päivänä kesäkuuta 1995,
    asetusten (ETY) N:o 2699/93 ja (EY) N:o 1559/94 muuttamisesta tiettyjen Puolan
    tasavallasta, Unkarin tasavallasta, Tsekin tasavallasta, Slovakian tasavallasta,
    Bulgarian tasavallasta ja Romaniasta lähtöisin olevien muna- ja siipikarjanliha-alan
    tuotteiden yhteisöön tuontia koskevien tiettyjen säännösten väliaikaisen
    mukautuksen osalta Uruguayn kierroksen yhteydessä käytyjen neuvotteluiden aikana
    tehdyn maataloussopimuksen täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1504/95 della Commissione, del 29 giugno 1995, che
    modifica i regolamenti (CE) n. 2699/93 e (CE) n. 1559/94 per quanto concerne l'
    adeguamento transitorio di talune disposizioni relative alle importazioni nella
    Comunità di alcuni prodotti del settore delle uova e del pollame provenienti
    dalla Repubblica di Polonia, dalla Repubblica d' Ungheria, dalla Repubblica Ceca,
    dalla Repubblica Slovacca, dalla Repubblica di Bulgaria e dalla Romania ai fini
    dell' attuazione dell' accordo sull' agricoltura concluso nel quadro dei negoziati
    dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1504/95 van de Commissie van 29 juni 1995 tot wijziging
    van de Verordeningen (EEG) nr. 2699/93 en (EG) nr. 1559/94 ten aanzien van de
    aanpassing, bij wijze van overgangsmaatregel, van een aantal bepalingen in verband
    met de invoer in de Gemeenschap van bepaalde produkten van de sectoren slachtpluimvee
    en eieren uit de Republiek Polen, de Republiek Hongarije, de Tsjechische Republiek,
    de Slowaakse Republiek, de Republiek Bulgarije en Roemenië met het oog op de
    tenuitvoerlegging van de in het kader van de besprekingen van de Uruguay-Ronde
    gesloten Overeenkomst inzake de landbouw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1504/95 da Comissão, de 29 de Junho de 1995, que
    altera os Regulamentos (CEE) nº 2699/93 e (CE) nº 1559/94, no que diz respeito
    à adaptação transitória de certas disposições relativas às importações
    para a Comunidade de certos produtos dos sectores dos ovos e da carne de aves
    de capoeira provenientes da República da Polónia, da República da Hungria,
    da República Checa, da República Eslovaca, da República da Bulgária e da Roménia
    com vista à aplicação do Acordo sobre a agricultura concluído no âmbito das
    negociações do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1504/95 de la Comisión, de 29 de junio de 1995, por
    el que, con vistas a la aplicación del Acuerdo agrícola celebrado en el marco
    de las negociaciones de la Ronda Uruguay, se modifican los Reglamentos (CEE) nº
    2699/93 y (CE) nº 1559/94 para la adaptación transitoria de algunas disposiciones
    relativas a las importaciones en la Comunidad de ciertos productos de los sectores
    de la carne y de los huevos de aves de corral procedentes de la República de
    Polonia, la República de Hungría, la República Checa, la República Eslovaca,
    la República de Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1504/95 av den 29 juni 1995 om ändring
    av förordningarna (EEG) nr 2699/93 och (EG) nr 1559/94 vad gäller en gradvis
    tillämpning av vissa bestämmelser för import till gemenskapen av vissa ägg-
    och fjäderfäprodukter från Polen, Ungern, Tjeckien, Slovakien, Bulgarien och
    Rumänien och i syfte att genomföra det jordbruksavtal som slöts inom ramen
    för handelsförhandlingarna i Uruguayrundan
  type: main
