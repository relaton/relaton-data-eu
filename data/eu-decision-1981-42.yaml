type: standard
title:
- language: en
  script: Latn
  content: '81/42/EEC: Commission Decision of 19 January 1981 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof), falling within subheading 97.03 A and ex B of the
    Common Customs Tariff, originating in South Korea and Japan and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/42/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exclusion des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées) originaires de Corée
    du Sud et du Japon (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/42/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea und Japan stammende Spielzeuge aus
    Holz und andere (mit Ausnahme der Motor- und Bewegungsmechanismen für Spielzeuge
    und Modelle zum Spielen) sowie deren Ersatzteile von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/42/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil) med oprindelse i Sydkorea og Japan (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/42/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά παιχνίδια από ξύλο καί άλλα (εξαιρέσει τών
    κινητήρων καί μηχανισμών κινήσεως γιά παιχνίδια
    καί μικροκατασκευάσματα, καθώς καί τών μεμονωμένων
    τεμαχίων τους) καταγωγής Νοτίου Κορέας καί
    Ιαπωνίας (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/42/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori ed i meccanismi di animazione per i giocattoli
    e modelli ridotti ed i loro pezzi staccati), originari della Corea del Sud e del
    Giappone (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/42/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van de Franse Republiek om speelgoed uit hout en andere (met uitzondering van
    animatiemotoren en mechanismen voor speelgoed op schaal alsook hun onderdelen)
    van oorsprong uit Zuid-Korea en Japan van de communautaire behandeling uit te
    sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
