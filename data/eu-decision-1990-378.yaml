  content: '90/378/EEC: Commission Decision of 13 July 1990 accepting an undertaking
    given in connection with the anti-dumping review concerning imports of oxalic
    acid originating in Brazil and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '90/378/CEE: Décision de la Commission du 13 juillet 1990 portant acceptation
    d''un engagement dans le cadre de la procédure de réexamen des mesures antidumping
    applicables aux importations d''acide oxalique originaire du Brésil et portant
    clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 13. Juli 1990 ueber die Annahme einer Verpflichtung
    im Rahmen einer Ueberpruefung der Antidumpingmassnahmen betreffend die Einfuhren
    von Oxalsaeure mit Ursprung in Brasilien und ueber die Einstellung des Verfahrens
    (90/378/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 13. juli 1990 om godtagelse af tilsagn i forbindelse
    med den fornyede undersoegelse af antidumpingforanstaltningerne vedroerende importen
    af oxalsyre med oprindelse i Brasilien og om afslutning af undersoegelsen (90/378/EOEF)
  type: main
