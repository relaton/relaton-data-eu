    de certaines variétés des espèces de plantes agricoles (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '78/124/EWG: Entscheidung der Kommission vom 28. Dezember 1977 zur Ermächtigung
    des Großherzogtums Luxemburg, den Verkehr mit Saatgut einiger Sorten landwirtschaftlicher
    Pflanzenarten zu beschränken (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/124/EØF: Kommissionens beslutning af 28. december 1977 om bemyndigelse
