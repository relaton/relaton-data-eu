title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 153/94 of 27 January 1994 determining the
    extent to which applications lodged in January 1994 for import licences for certain
    pigmeat products under the regime provided for by the Bilateral Agreements on
    agriculture concluded between the Community, of the one part, and Austria and
    Finland, of the other part, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 153/94 de la Commission, du 27 janvier 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1994 pour certains produits à base de viande de porc, dans le cadre du
    régime prévu par les accords bilatéraux agricoles conclus entre la Communauté,
    d'une part, et l'Autriche et la Finlande, d'autre part, peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 153/94 der Kommission vom 27. Januar 1994 über die
    Festsetzung des Umfangs, in dem die im Januar 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der bilateralen
    landwirtschaftlichen Abkommen zwischen der Gemeinschaft einerseits und Österreich
    sowie Finnland andererseits genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 153/94 af 27. januar 1994 om fastsættelse
    af, i hvilket omfang det er muligt at imødekomme de ansøgninger, som blev indgivet
    i januar 1994 om importlicenser for visse svinekødsprodukter i forbindelse med
    den ordning, der er fastsat i de bilaterale landbrugsaftaler, som er indgået
    mellem Fællesskabet på den ene side og Østrig og Finland på den anden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 153/94 της Επιτροπής
    της 27ης Ιανουαρίου 1994 περί καθορισμού ορίων
    εντός των οποίων δύναται να γίνουν αποδεκτές
    αιτήσεις που υποβλήθηκαν τον Ιανουάριο του
    1994 για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις διμερείς
    γεωργικές συμφωνίες, οι οποίες συνήφθηκαν
    μεταξύ της Κοινότητας, αφενός, και της Αυστρίας
    και της Φινλανδίας, αφετέρου
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 153/94 della Commissione, del 27 gennaio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi bilaterali agricoli conclusi
    tra la Comunità, da un lato, e l'Austria e la Finlandia, dall'altro
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 153/94 van de Commissie van 27 januari 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in januari 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de bilaterale landbouwovereenkomsten
    tussen enerzijds de Gemeenschap en anderzijds respectievelijk Oostenrijk en Finland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 153/94 da Comissão, de 27 de Janeiro de 1994, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Janeiro
    de 1994 ao abrigo do regime previsto nos acordos bilaterais agrícolas concluídos
    entre, por um lado, a Comunidade, por outro, a Áustria e a Finlândia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 153/94 de la Comisión, de 27 de enero de 1994, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de enero de 1994 al amparo del régimen previsto en los Acuerdos agrarios
    bilaterales celebrados entre la Comunidad por una parte, y Austria y Finlandia,
    por otra
