  script: Latn
  content: Direktiva 2005/55/EZ Europskog parlamenta i Vijeća od 28. rujna 2005.
    o usklađivanju zakonodavstava država članica u odnosu na mjere koje treba poduzeti
    protiv emisije plinovitih i krutih onečišćujućih tvari iz motora s kompresijskim
    paljenjem, za primjenu u vozilima i emisije plinovitih onečišćujućih tvari
    iz motora s vanjskim izvorom paljenja koji kao gorivo koriste prirodni plin ili
    ukapljeni naftni plin za primjenu u vozilima
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2005/55/EK irányelve (2005. szeptember
    28.) a járművek hajtására használt kompressziós gyújtású motorok gáz-halmazállapotú
    szennyezőanyag- és légszennyezőrészecske-kibocsátása, valamint a járművek
    hajtására használt, földgáz- vagy PB-gázüzemű külső gyújtású motorok
    gáz-halmazállapotú szennyezőanyag-kibocsátása elleni intézkedésekre vonatkozó
    tagállami jogszabályok közelítéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 2005/55/CE del Parlamento europeo e del Consiglio, del 28 settembre
    2005, concernente il ravvicinamento delle legislazioni degli Stati membri relative
    ai provvedimenti da prendere contro l'emissione di inquinanti gassosi e di particolato
    prodotti dai motori ad accensione spontanea destinati alla propulsione di veicoli
    e contro l'emissione di inquinanti gassosi prodotti dai motori ad accensione comandata
    alimentati con gas naturale o con gas di petrolio liquefatto destinati alla propulsione
    di veicoli
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2005/55/EK (2005. gada 28. septembris)
    par dalībvalstu tiesību aktu tuvināšanu attiecībā uz pasākumiem, kas jāveic,
    lai samazinātu gāzveida un daļiņveida piesārņotāju emisiju no kompresijaizdedzes
    motoriem, kuri paredzēti transportlīdzekļiem, un gāzveida piesārņotāju
    emisiju no dzirksteļaizdedzes motoriem, ko darbina ar dabasgāzi vai sašķidrinātu
    naftas gāzi un kas paredzēti transportlīdzekļiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 28 d. Europos Parlamento ir Tarybos direktyva 2005/55/EB
    dėl valstybių narių įstatymų, reglamentuojančių priemones, kurių būtina
    imtis mažinant transporto priemonėse naudojamų uždegimo suspaudimu variklių
    išmetamuosius dujinius bei kietųjų dalelių teršalus ir transporto priemonėse
    naudojamų priverstinio uždegimo variklių, degalams naudojančių gamtines dujas
    ir suskystintas naftos dujas, išmetamuosius dujinius teršalus, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2005/55/KE tal-Parlament Ewropew u tal-Kunsill tat-28 ta’
    Settembru 2005 dwar l-approssimazzjoni tal-liġijiet ta’ l-Istati Membri relatati
    mal-miżuri li għandhom jittieħdu kontra l-emissjoni ta’ inkwinanti gassużi
    u partikulati minn magni li jaħdmu b’compression ignition għall-użu f’vetturi,
    u l-emissjoni ta’ inkwinanti gassużi minn magni b’positive ignition li jaħdmu
    bil-gass naturali jew bil-gass likwidu tal-petroljum għall-użu f’vetturi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2005/55/EG van het Europees Parlement en de Raad van 28 september
    2005 inzake de onderlinge aanpassing van de wetgevingen van de lidstaten met betrekking
    tot maatregelen tegen de emissie van verontreinigende gassen en deeltjes door
    voertuigmotoren met compressieontsteking en de emissie van verontreinigende gassen
    door op aardgas of vloeibaar petroleumgas lopende voertuigmotoren met elektrische
    ontsteking
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2005/55/WE Parlamentu Europejskiego i Rady z dnia 28 września
    2005 r. w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących
    się do działań, które należy podjąć przeciwko emisji zanieczyszczeń gazowych
    i cząstek stałych przez silniki wysokoprężne stosowane w pojazdach oraz emisji
    zanieczyszczeń gazowych z silników o zapłonie iskrowym zasilanych gazem ziemnym
    lub gazem płynnym stosowanych w pojazdach
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/55/CE do Parlamento Europeu e do Conselho, de 28 de Setembro
    de 2005, relativa à aproximação das legislações dos Estados-Membros respeitantes
    às medidas a tomar contra a emissão de gases e partículas poluentes provenientes
    dos motores de ignição por compressão utilizados em veículos e a emissão
    de gases poluentes provenientes dos motores de ignição comandada alimentados
    a gás natural ou a gás de petróleo liquefeito utilizados em veículos
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/55/CE a Parlamentului European și a Consiliului din 28
    septembrie 2005 privind apropierea legislațiilor statelor membre cu privire la
    măsurile care trebuie luate împotriva emisiilor de gaze și de particule poluante
    provenite de la motoarele cu aprindere prin comprimare utilizate la vehicule și
    împotriva emisiilor de gaze poluante provenite de la motoarele cu aprindere prin
    scânteie alimentate cu gaz sau cu gaz petrolier lichefiat utilizate la vehicule
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2005/55/ES z 28. septembra 2005
    o aproximácii právnych predpisov členských štátov vzťahujúcich sa na opatrenia,
    ktoré sa majú prijať proti emisiám plynných a tuhých znečisťujúcich látok
    zo vznetových motorov určených na používanie vo vozidlách a proti emisiám
    plynných znečisťujúcich látok zo zážihových motorov poháňaných zemným
    plynom alebo skvapalneným ropným plynom, určených na používanie vo vozidlách
  type: main
- language: sl
  script: Latn
  content: Direktiva 2005/55/ES Evropskega parlamenta in Sveta z dne 28. septembra
    2005 o približevanju zakonodaje držav članic v zvezi z ukrepi, ki jih je treba
    sprejeti proti emisijam plinastih in trdnih onesnaževal iz motorjev na kompresijski
    vžig, ki se uporabljajo v vozilih, ter emisijam plinastih onesnaževal iz motorjev
    na prisilni vžig, ki za gorivo uporabljajo zemeljski plin ali utekočinjeni naftni
    plin in se uporabljajo v vozilih
  type: main
- language: es
  script: Latn
  content: Directiva 2005/55/CE del Parlamento Europeo y del Consejo, de 28 de septiembre
    de 2005, relativa a la aproximación de las legislaciones de los Estados miembros
    sobre las medidas que deben adoptarse contra la emisión de gases y partículas
    contaminantes procedentes de motores de encendido por compresión destinados a
    la propulsión de vehículos, y contra la emisión de gases contaminantes procedentes
    de motores de encendido por chispa alimentados con gas natural o gas licuado del
    petróleo destinados a la propulsión de vehículos
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2005/55/EG av den 28 september
    2005 om tillnärmning av medlemsstaternas lagstiftning om åtgärder mot utsläpp
    av gas- och partikelformiga föroreningar från motorer med kompressionständning
    som används i fordon samt mot utsläpp av gasformiga föroreningar från motorer
    med gnisttändning drivna med naturgas eller gasol vilka används i fordon
