title:
- language: en
  script: Latn
  content: Directive 2005/55/EC of the European Parliament and of the Council of 28
    September 2005 on the approximation of the laws of the Member States relating
    to the measures to be taken against the emission of gaseous and particulate pollutants
    from compression-ignition engines for use in vehicles, and the emission of gaseous
    pollutants from positive-ignition engines fuelled with natural gas or liquefied
    petroleum gas for use in vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 2005/55/CE du Parlement européen et du Conseil du 28 septembre
    2005 concernant le rapprochement des législations des États membres relatives
    aux mesures à prendre contre les émissions de gaz polluants et de particules
    polluantes provenant des moteurs à allumage par compression destinés à la propulsion
    des véhicules et les émissions de gaz polluants provenant des moteurs à allumage
    commandé fonctionnant au gaz naturel ou au gaz de pétrole liquéfié et destinés
    à la propulsion des véhicules
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/55/EG des Europäischen Parlaments und des Rates vom 28.
    September 2005 zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über
    Maßnahmen gegen die Emission gasförmiger Schadstoffe und luftverunreinigender
    Partikel aus Selbstzündungsmotoren zum Antrieb von Fahrzeugen und die Emission
    gasförmiger Schadstoffe aus mit Flüssiggas oder Erdgas betriebenen Fremdzündungsmotoren
    zum Antrieb von Fahrzeugen
  type: main
- language: bg
  script: Cyrl
  content: Директива 2005/55/ЕО на Европейския парламент
    и на Съвета от 28 септември 2005 година за сближаване
    на законодателствата на държавите-членки относно
    мерките, които трябва да се предприемат срещу
    емисиите на газообразни и механични замърсители
    от дизелови двигатели, използвани в превозните
    средства, и емисиите на газообразни замърсители
    от бензинови двигатели, зареждани с гориво
    от природен газ или втечнен нефтен газ, използвани
    в превозните средства
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2005/55/ES ze dne 28. září 2005
    o sbližování právních předpisů členských států týkajících se opatření
    proti emisím plynných znečišťujících látek a znečišťujících částic
    ze vznětových motorů vozidel a emisím plynných znečišťujících látek
    ze zážehových motorů vozidel poháněných zemním plynem nebo zkapalněným
    ropným plynem
  type: main
