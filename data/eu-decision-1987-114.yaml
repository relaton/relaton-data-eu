title:
- language: en
  script: Latn
  content: '87/114/EEC: Commission Decision of 12 December 1986 authorizing the United
    Kingdom to introduce intra- Community surveillance imports of certain television
    receivers originating in the People''s Republic of China which have been put into
    free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/114/CEE: Décision de la Commission du 12 décembre 1986 autorisant
    le Royaume-Uni à instaurer une surveillance intracommunautaire des importations
    de certains appareils de télévision originaires de la République populaire
    de Chine mis en libre pratique dans les autres États membres (Le texte en langue
    anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/114/EWG: Entscheidung der Kommission vom 12. Dezember 1986, mit der
    das Vereinigte Königreich ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren von bestimmten aus der Volksrepublik China stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen Fernsehempfangsgeräten
    einzuführen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/114/EØF: Kommissionens beslutning af 12. december 1986 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse fjernsynsapparater med oprindelse i Den kinesiske Folkerepublik, som
    er overgået til fri omsætning i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/114/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Δεκεμβρίου 1986 που εξουσιοδοτεί το Ηνωμένο
    Βασίλειο να θεσπίσει ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων συσκευών τηλεοράσεως
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας που
    τίθενται σε ελεύθερη κυκλοφορία στα άλλα κράτη
    μέλη (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/114/CEE: Decisione della Commissione del 12 dicembre 1986 che autorizza
