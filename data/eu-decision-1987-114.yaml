    importazioni di alcuni tipi di apparecchi televisi originari della Repubblica
    popolare cinese e immessi in libera pratica negli altri Stati membri (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/114/EEG: Beschikking van de Commissie van 12 december 1986 houdende
