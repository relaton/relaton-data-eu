    für die Einfuhr von in Frankreich hergestelltem Athylalkohol landwirtschaftlichen
    Ursprungs in die anderen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2295/85 af 9. august 1985 om suspension
