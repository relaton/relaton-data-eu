title:
- language: en
  script: Latn
  content: '2002/687/EC: Commission Decision of 24 May 2000 approving a single programming
    document of Community structural assistance under Objective 1 in the region of
    Södra Skogslänen, namely the Counties of Jämtland and Västernorrland, the
    municipality of Torsby in Värmland County, the municipality of Ljusdal in Gävleborg
    County, and the municipalities of Malung, Orsa, Vansbro and Älvdalen and communities
    of Venjan and Våmhus in Dalarna County in Sweden (notified under document number
    C(2000) 1406 COR)'
  type: main
- language: fr
  script: Latn
  content: '2002/687/CE: Décision de la Commission, du 24 mai 2000, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    dans la région du Södra Skogslän, comprenant les départements du Jämtland
    et du Västernorrland, la commune de Torsby dans le département du Värmland,
    la commune de Ljusdal dans le département de Gävleborg, les communes de Malung,
    Orsa, Vansbro et Älvdalen, ainsi que les localités de Venjan et Våmhus dans
    le département des Dalarna, et relevant de l''objectif n° 1 en Suède [notifiée
    sous le numéro C(2000) 1406 COR]'
  type: main
