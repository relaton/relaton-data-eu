title:
- language: en
  script: Latn
  content: '98/203/EC: Commission Decision of 3 March 1998 amending Decision 97/660/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1998 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '98/203/CE: Décision de la Commission du 3 mars 1998 modifiant la décision
    97/660/CE adoptant le plan portant attribution aux États membres de ressources
    imputables à l''exercice 1998 pour l''exécution des fournitures de denrées
    alimentaires provenant des stocks d''intervention au bénéfice des personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '98/203/EG: Entscheidung der Kommission vom 3. März 1998 zur Änderung
    der Entscheidung 97/660/EG mit dem Programm zur Bewilligung von Mitteln, die den
    Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1998 zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '98/203/EF: Kommissionens beslutning af 3. marts 1998 om ændring af beslutning
    97/660/EF om vedtagelse af planen for tildeling til medlemsstaterne af midler,
    der kan afholdes over 1998-budgettet, og som skal dække udgifterne til levering
    af levnedsmidler fra interventionslagre til de socialt dårligst stillede personer
    i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '98/203/ΕΚ: Απόφαση της Επιτροπής της 3ης Μαρτίου
    1998 για την τροποποίηση της απόφασης 97/660/ΕΚ
    για την έγκριση του προγράμματος για την κατανομή
    στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1998 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στα άπορα άτομα της Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '98/203/EY: Komission päätös, tehty 3 päivänä maaliskuuta 1998, varainhoitovuodelle
    1998 kirjattavien varojen jakamista jäsenvaltioille koskevan suunnitelman hyväksymisestä
    interventiovarastoista peräisin olevien elintarvikkeiden toimittamiseksi yhteisön
    vähävaraisimmille henkilöille tehdyn päätöksen 97/660/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '98/203/CE: Decisione della Commissione del 3 marzo 1998 recante modifica
    della decisione 97/660/CE che approva il piano di ripartizione tra gli Stati membri
    delle risorse da imputare all''esercizio finanziario 1998 per l''esecuzione delle
    forniture di derrate alimentari provenienti dalle scorte d''intervento a favore
    degli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '98/203/EG: Beschikking van de Commissie van 3 maart 1998 houdende wijziging
    van Beschikking 97/660/EG tot vaststelling van het jaarplan voor de toewijzing
    aan de lidstaten van voor het begrotingsjaar 1998 te boeken financiële middelen
    voor de levering van levensmiddelen uit interventievoorraden aan de meest hulpbehoevenden
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '98/203/CE: Decisão da Comissão de 3 de Março de 1998 que altera a Decisão
    97/660/CE que adopta o plano que atribui aos Estados-membros recursos a imputar
    ao exercício de 1998 para o fornecimento de géneros alimentícios provenientes
    das existências de intervenção a favor das pessoas mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '98/203/CE: Decisión de la Comisión de 3 de marzo de 1998 que modifica
    la Decisión 97/660/CE por la que se adopta el plan que establece la asignación
    a los Estados miembros de recursos imputables al ejercicio presupuestario de 1998
    para el suministro de alimentos procedentes de las existencias de intervención
    en beneficio de las personas más necesitadas de la Comunidad'
  type: main
- language: sv
  script: Latn
  content: '98/203/EG: Kommissionens beslut av den 3 mars 1998 om ändring av beslut
    97/660/EG om fastställande av planen för att tilldela medlemsstaterna resurser
    som hänförs till räkenskapsåret 1998 för leverans av livsmedel från interventionslager
    till de personer i gemenskapen som har det sämst ställt'
  type: main
