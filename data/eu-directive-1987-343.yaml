    ed amministrative in materia di accesso e di esercizio dell'assicurazione diretta
    diversa dall'assicurazione sulla vita
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1987. gada 22. jūnijs), ar ko attiecībā uz kredītapdrošināšanu
    un galvojuma apdrošināšanu groza Padomes Pirmo direktīvu 73/239/EEK (1973.
    gada 24. jūlijs) par normatīvo un administratīvo aktu koordināciju attiecībā
    uz uzņēmējdarbības sākšanu un veikšanu tiešās apdrošināšanas nozarē,
    kas nav dzīvības apdrošināšana
  type: main
- language: lt
  script: Latn
