  script: Latn
  content: Council Directive 87/343/EEC of 22 June 1987 amending, as regards credit
    insurance and suretyship insurance, First Directive 73/239/EEC on the coordination
    of laws, regulations and administrative provisions relating to the taking-up and
    pursuit of the business of direct insurance other than life assurance
  type: main
- language: fr
