title:
- language: en
  script: Latn
  content: Commission Decision of 23 March 1977 authorizing Ireland to take protective
    measures in respect of certain processed agricultural products under Article 135
    of the Act of Accession
  type: main
- language: fr
  script: Latn
  content: '77/289/CEE: Décision de la Commission, du 23 mars 1977, autorisant l''Irlande
    à adopter des mesures de sauvegarde pour certains produits agricoles transformés
    au titre de l''article 135 de l''Acte d''adhésion'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. März 1977, mit der Irland ermächtigt
    wird, für einige landwirtschaftliche Verarbeitungserzeugnisse Schutzmaßnahmen
    gemäß Artikel 135 der Beitrittsakte zu treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. marts 1977 om bemyndigelse til Irland til
    at træffe beskyttelsesforanstaltninger for visse forædlede landbrugsprodukters
    vedkommende i medfør af artikel 135 i tiltrædelsesakten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 marzo 1977, che autorizza l'Irlanda
    ad attuare misure di salvaguardia per taluni prodotti agricoli trasformati, a
    norma dell'articolo 135 dell'atto di adesione
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 maart 1977 waarbij Ierland wordt gemachtigd
    voor bepaalde verwerkte landbouwprodukten vrijwaringsmaatregelen te nemen op grond
    van artikel 135 van de Toetredingsakte
  type: main
