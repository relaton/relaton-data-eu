  script: Latn
  content: Council Regulation (EEC) No 254/87 of 26 January 1987 extending the provisional
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0,75 kW but not more than 75 kW, originating in Bulgaria,
    Czechoslovakia, the German Democratic Republic, Hungary, Poland, Romania and the
    Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 254/87 du Conseil du 26 janvier 1987 prorogeant le
    droit antidumping provisoire à l' égard des importations de moteurs électriques
    polyphasés normalisés d' une puissance de plus de 0,75 à 75 kilowatts inclus,
    originaires de Bulgarie, de Hongrie, de Pologne, de la République démocratique
    allemande, de Roumanie, de Tchécoslovaquie et d' Union soviétique
  type: main
