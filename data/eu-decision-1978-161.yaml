---
id: EUDecision1978161
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 January 1978 authorizing the French Republic
    not to apply Community treatment to toys of wood and other (except motors and
    movement mechanisms for toys and working models used for recreational purposes,
    and parts thereof) falling within subheadings 97.03 A and ex B of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/161/CEE: Décision de la Commission, du 16 janvier 1978, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres, à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits, ainsi que leurs pièces détachées des sous-positions 97.03
    A et Ex B du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Januar 1978, mit der die Französische
    Republik ermächtigt wird, aus Japan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches anderes Spielzeug aus Holz (mit Ausnahme der Motoren
    und Bewegungsmechanismen für Spielzeug und Modelle zum Spielen sowie deren Ersatzteile)
    der Tarifstellen 97.03 A und ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 16. januar 1978 om bemyndigelse til Den franske
    Republik til fra fællesskabsbehandling at undtage legetøj laf træ eller andre
    materialer (bortset fra motorer og bevægelsesmekanismer til legetøj og modeller
    samt dele hertil), som henhører under position 97.03 A og ex B i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i giocattoli di legno ed altri
    (eccetto i motori e i meccanismi di animazione per giocattoli e modelli ridotti
    ed i loro pezzi staccati) delle sottovoci 97.03 A e ex B della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd speelgoed van hout en andere (met uitzondering van motoren en
    bewegingsmechanismen voor speelgoed en modellen op schaal alsmede hun onderdelen)
    van post 97.03 A en ex B van het gemeenschappelijk douanetarief van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
