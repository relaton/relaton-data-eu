title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 906/72 de la Commission, du 28 avril 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour femmes, fillettes et jeunes enfants, en tissus de
    coton, de la position tarifaire EX 61.02, originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2797/71 du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 906/72 der Kommission vom 28. April 1972 über die
    Wiedereinführung des Gemeinsamen Zolltarifs für Oberkleidung für Frauen, Mädchen
    und Kleinkinder, aus Baumwolle, der Tarifnummer ex 61.02, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 2797/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 906/72 della Commissione, del 28 aprile 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per donna, per ragazza e per bambini, in tessuti di cotone,
    della voce doganale ex 61.02 originari dell'India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2797/71 del Consiglio, del 20 dicembre
    1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 906/72 van de Commissie van 28 april 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op damesbovenkleding, meisjesbovenkleding en kinderbovenkleding
    van katoenen weefsels van post ex 61.02, van oorsprong uit India, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2797/71
    van de Raad van 20 december 1971
  type: main
