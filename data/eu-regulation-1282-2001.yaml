    concerne l'établissement des informations pour la connaissance des produits et
    le suivi du marché dans le secteur vitivinicole et modifiant le règlement (CE)
    n° 1623/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1282/2001 der Kommission vom 28. Juni 2001 mit Durchführungsbestimmungen
