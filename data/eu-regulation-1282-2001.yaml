  script: Latn
  content: Commission Regulation (EC) No 1282/2001 of 28 June 2001 laying down detailed
    rules for the application of Council Regulation (EC) No 1493/1999 as regards the
    gathering of information to identify wine products and to monitor the wine market
    and amending Regulation (EC) No 1623/2000
  type: main
- language: fr
  script: Latn
