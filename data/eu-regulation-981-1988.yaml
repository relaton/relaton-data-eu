  content: Commission Regulation (EEC) No 981/88 of 14 April 1988 providing for an
    exception in Italy for the 1987/88 wine year as regards the notification by producers
    of quantities of table wine to be delivered by them for the compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 981/88 de la Commission du 14 avril 1988 portant mesure
    dérogatoire en Italie, pour la campagne 1987/1988, en matière de communication
    par les producteurs de leurs quantités de vin de table à livrer à la distillation
    obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 981/88 der Kommission vom 14. April 1988 über eine
    abweichende Maßnahme für das Wirtschaftsjahr 1987/88 in Italien für die Mitteilungen
    der Erzeuger über ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 981/88 af 14. april 1988 om en undtagelsesforanstaltning
    i Italien for produktionsåret 1987/88 med hensyn til producenternes meddelelse
    af bordvinsmængder, der skal leveres til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 981/88 της Επιτροπής
