    leveren hoeveelheden tafelwijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 981/88 da Comissão de 14 de Abril de 1988 que estabelece
    uma medida derrogatória, em Itália, para a campanha de 1987/1988, no que diz
    respeito à comunicação pelos produtores das suas quantidades de vinhos de mesa
    a entregar para destilação obrigatória
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 981/88 de la Comisión de 14 de abril de 1988 por
