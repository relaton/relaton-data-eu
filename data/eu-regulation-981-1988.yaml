    στην Ιταλία, για την περίοδο 1987/88, όσον αφορά
    την ανακοίνωση από τους παραγωγούς των ποσοτήτων
    επιτραπέζιου οίνου που παραδίδονται στην υποχρεωτική
    απόσταξη
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 981/1999, annettu 7 päivänä toukokuuta 1999,
    voin ostojen keskeyttämisestä tietyissä jäsenvaltioissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 981/88 della Commissione del 14 aprile 1988 recante
    una misura derogatoria applicabile in Italia per la campagna 1987/1988, per quanto
    riguarda la comunicazione, da parte dei produttori, dei quantitativi di vini da
    tavola che devono consegnare alla distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 981/88 van de Commissie van 14 april 1988 houdende
    afwijkende bepalingen voor Italië en voor het verkoopseizoen 1987/1988 met betrekking
