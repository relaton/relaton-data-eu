  content: Council Decision (EU) 2026/1213 of 29 May 2026 on the position to be taken
    on behalf of the European Union within the Committee of the Parties to the Council
    of Europe Convention on preventing and combating violence against women and domestic
    violence, at its 20th meeting, concerning conclusions on the implementation of
    recommendations in respect of certain Parties to that Convention and concerning
