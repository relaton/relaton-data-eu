    par Komagataella phaffii DSM 33574 en tant qu’additif pour l’alimentation
    de toutes les espèces de volailles d’engraissement et de toutes les espèces
    de volailles élevées pour la ponte et pour la reproduction (titulaire de l’autorisation:
    BioResource, international, Inc., représentée dans l’Union par Pen & Tec Consulting,
    S.L.U.)'
  type: main
