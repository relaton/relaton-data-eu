    phaffii DSM 33574 as a feed additive for all poultry species for fattening and
    all poultry species reared for laying and reared for breeding (holder of authorisation:
    BioResource, international, Inc. represented in the Union by Pen & Tec Consulting,
    S.L.U.)'
  type: main
- language: fr
  script: Latn
