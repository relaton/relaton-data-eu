title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2690/85 of 25 September 1985 re-establishing
    the levying of customs duties on valves and tubes, photocells, including photo-transistors
    falling within subheadings 85.21 A and B, originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3562/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2690/85 de la Commission du 25 septembre 1985 portant
    rétablissement de la perception des droits de douane applicables aux lampes,
    tubes et valves; cellules photo-électriques, y compris les phototransistors,
    des sous-positions 85.21 A et 85.21 B du tarif douanier commun, originaires de
    la Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2690/85 der Kommission vom 25. September 1985 zur
    Wiedereinführung der Erhebung der Zölle für Röhren, Photozellen, einschließlich
    Phototransistoren der Tarifstellen 85.21 A und B mit Ursprung in Südkorea, dem
    die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2690/85 af 25. september 1985 om genindførelse
    af opkrævning af told for elektronrør, fotoceller (herunder fototransistorer)
    henhørende under pos. 85.21 A, B og med oprindelse i Sydkorea, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2690/85 της Επιτροπής
    της 25ης Σεπτεμβρίου 1985 περί επαναφοράς της
    εισπράξεως τελωνειακών δασμών για λυχνίες
    πάσης φύσεως και φωτοηλεκτρικές κυψέλες (συμπεριλαμβανομένων
    και των φωτοκρυσταλλολυχνιών), των διακρίσεων
    85.21 Α και 85.21 Β του Κοινού Δασμολογίου, καταγωγής
    Νότιας Κορέας, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2690/85 della Commissione del 25 settembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili alle lampade, tubi, e
    valvole, cellule fotoelettriche compresi i fototransistori della sottovoce 85.21
    A e B della tariffa doganale comune, originari della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2690/85 van de Commissie van 25 september 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op elektronenbuizen,
    foto-elektrische cellen, fototransistors daaronder begrepen, van de postonderverdelingen
    85.21 A en B, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr.
    3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
