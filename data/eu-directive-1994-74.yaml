    al ravvicinamento delle aliquote di accisa sugli oli minerali
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 94/74/EK (1994. gada 22. decembris), kas groza Direktīvu
    92/12/EEK par vispārēju režīmu akcīzes precēm un par šādu preču glabāšanu,
    transportēšanu un kontroli, groza Direktīvu 92/81/EEK par akcīzes nodokļu
    struktūru saskaņošanu attiecībā uz naftas produktiem un Direktīvu 92/82/EEK
    par naftas produktiem uzlikto akcīzes nodokļu likmju tuvināšanu
  type: main
- language: lt
