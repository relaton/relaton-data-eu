    szállításáról és ellenőrzéséről szóló 92/12/EGK irányelv, az ásványi
    olajok jövedéki adója szerkezetének összehangolásáról szóló 92/81/EGK
    irányelv, valamint az ásványolajok jövedékiadó-mértékének közelítéséről
    szóló 92/82/EGK irányelv módosításáról
  type: main
