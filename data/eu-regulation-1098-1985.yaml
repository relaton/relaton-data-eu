title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1098/85 of 29 April 1985 specifying the
    extent to which applications lodged in April 1985 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1098/85 de la Commission, du 29 avril 1985, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1985 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1098/85 der Kommission vom 29. April 1985 über das
    Ausmaß, in dem den im April 1985 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1098/85 af 29. april 1985 om det omfang
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1985, for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1098/85 της Επιτροπής
    της 29ης Απριλίου 1985 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο του 1985, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1098/85 della Commissione, del 29 aprile 1985, relativo
    al rilascio, il 30 aprile 1985, dei titoli d'importazione per taluni prodotti
    del settore delle carni ovine e caprine originari di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1098/85 van de Commissie van 29 april 1985 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 1985 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
