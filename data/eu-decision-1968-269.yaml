title:
- language: fr
  script: Latn
  content: Décision 68/269/CEE du Conseil du 27 juin 1968, portant ouverture et répartition
    d'un contingent tarifaire communautaire (premier semestre de l'année 1968) à
    droit nul à l'importation de certains types de pneumatiques destinés à être
    utilisés, à des fins d'entretien, sur des avions
  type: main
- language: de
  script: Latn
  content: '68/269/EWG: Entscheidung des Rates vom 27. Juni 1968 über die Eröffnung
    und Aufteilung eines Gemeinschaftszollkontingents (1. Halbjahr 1968) zum Zollsatz
    Null für die Einfuhr bestimmter Typen von Reifen zur Instandhaltung von Flugzeugen'
  type: main
- language: it
  script: Latn
  content: '68/269/CEE: Decisione del Consiglio, del 27 giugno 1968, recante istituzione
    e ripartizione di un contingente tariffario comunitario (1 semestre 1968) in esenzione
    da dazio per l''importazione di taluni tipi di pneumatici destinati ad essere
    utilizzati per l''equipaggiamento di aeroplani'
  type: main
- language: nl
  script: Latn
  content: '68/269/EEG: Beschikking van de Raad van 27 juni 1968 houdende opening
    en verdeling van een communautair tariefcontingent (eerste halfjaar 1968) met
    vrijdom van recht voor de invoer van sommige categorieën van banden welke bestemd
    zijn om ten behoeve van het onderhoud te worden gemonteerd op vliegtuigen'
  type: main
