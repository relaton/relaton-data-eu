  content: Règlement (CEE) n 2014/69 de la Commission, du 13 octobre 1969, portant
    suppression du montant compensatoire à l'importation des huiles de tournesol
    originaires de Bulgarie, de Hongrie, de Roumanie, d'U.R.S.S. et de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2014/69 der Kommission vom 13. Oktober 1969 zur Aufhebung
    der Ausgleichsabgabe bei der Einfuhr von Sonnenblumenöl mit Ursprung in oder
    Herkunft aus Bulgarien, Jugoslawien, Rumänien, Ungarn und der UdSSR
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2014/69 della Commissione, del 13 ottobre 1969, che
    abolisce l'ammontare di compensazione applicabile all'importazione di oli di girasole
    originari o in provenienza dalla Bulgaria, dalla Romania, dalla Yugoslavia, dall'Ungheria
    e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2014/69 van de Commissie van 13 oktober 1969 tot
    intrekking van het compenserende bedrag bij de invoer van zonnebloemolie van oorsprong
    of van herkomst uit Bulgarije, Hongarije, Joegoslavië, Roemenië en de U.S.S.R.
