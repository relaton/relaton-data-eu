- language: en
  script: Latn
  content: '90/501/EEC: Commission Decision of 4 October 1990 amending Decision 73/262/EEC
    establishing provisions for statistical surveys to be carried out by the member
    States on bovine livestock, forecasts on the availability of bovine animals for
    slaughter and statistics on slaughtered bovine animals'
  type: main
- language: fr
  script: Latn
  content: '90/501/CEE: Décision de la Commission, du 4 octobre 1990, modifiant la
    décision 73/262/CEE fixant les dispositions d''application des enquêtes statistiques
    sur le cheptel bovin, des prévisions sur la disponibilité en bovins de boucherie
    et des statistiques abattage de bovins, à effectuer par les États membres'
  type: main
- language: de
  script: Latn
  content: '90/501/EWG: ENTSCHEIDUNG DER KOMMISSION VOM 4. OKTOBER 1990 ZUR AENDERUNG
    DER ENTSCHEIDUNG 73/262/EWG UEBER DURCHFUEHRUNGSBESTIMMUNGEN ZU DEN VON DEN MITGLIEDSTAATEN
    DURCHZUFUEHRENDEN STATISTISCHEN ERHEBUNGEN UEBER DEN RINDERBESTAND, VORAUSSCHAETZUNGEN
    UEBER DEN SCHLACHTRINDERANFALL UND STATISTIKEN UEBER DIE SCHLACHTUNG VON RINDERN'
  type: main
- language: da
  script: Latn
  content: '90/501/EOEF: KOMMISSIONENS BESLUTNING AF 4. OKTOBER 1990 OM AENDRING AF
    BESLUTNING 73/262/EOEF VEDROERENDE DE FORHOLDSREGLER, SOM SKAL TRAEFFES MED HENBLIK
    PAA ANVENDELSE AF DE STATISTISKE OPTAELLINGER AF DEN SAMLEDE HORNKVAEGBESTAND,
    PROGNOSER VEDROERENDE DET TIL RAADIGHED VAERENDE SLAGTEKVAEG OG STATISTIKKER OVER
    SLAGTNINGER AF HORNKVAEG, SOM SKAL UDARBEJDES AF MEDLEMSSTATERNE'
  type: main
- language: el
  script: Grek
  content: '90/501/ΕΟΚ: Απόφαση της Επιτροπής της 4ης Οκτωβρίου
    1990 που τροποποιεί την απόφαση 73/262/ΕΟΚ με την
    οποία καθορίζονται οι διατάξεις εφαρμογής
    στατιστικών ερευνών για το ζωικό κεφάλαιο
    των βοοειδών, προβλέψεων για τη διαθέσιμη ποσότητα
    σε βοοειδή για σφαγή και στατιστικών σφαγής
    βοοειδών που πρέπει να πραγματοποιηθούν από
    τα κράτη μέλη'
  type: main
- language: it
  script: Latn
  content: '90/501/CEE: DECISIONE DELLA COMMISSIONE, DEL 4 OTTOBRE 1990, CHE MODIFICA
    LA DECISIONE 73/262/CEE CHE FISSA LE DISPOSIZIONI D'' ATTUAZIONE RELATIVE ALLE
    INDAGINI STATISTICHE SUL PATRIMONIO BOVINO, ALLE PREVISIONI SULLA DISPONIBILITA
    DI BOVINI DA MACELLO E ALLE STATISTICHE DELLE MACELLAZIONI DI BOVINI, DA EFFETTUARE
    A CURA DEGLI STATI MEMBRI'
  type: main
- language: nl
  script: Latn
  content: '90/501/EEG: BESCHIKKING VAN DE COMMISSIE VAN 4 OKTOBER 1990 TOT WIJZIGING
    VAN BESCHIKKING 73/262/EEG HOUDENDE UITVOERINGSBEPALINGEN BETREFFENDE DE STATISTISCHE
    ENQUETES OVER DE RUNDVEESTAPEL, RAMINGEN VAN HET AANBOD VAN SLACHTRUNDEREN EN
    SLACHTSTATISTIEKEN VAN RUNDEREN, WELKE DOOR DE LID-STATEN DIENEN TE WORDEN VERRICHT'
  type: main
- language: pt
  script: Latn
  content: '90/501/CEE: DECISAO DA COMISSAO, DE 4 DE OUTUBRO DE 1990, QUE ALTERA A
    DECISAO 73/262/CEE, QUE FIXA AS DISPOSICOES DE APLICACAO DOS INQUERITOS ESTATISTICOS
    SOBRE O EFECTIVO BOVINO, AS PREVISOES SOBRE A DISPONIBILIDADE EM BOVINOS DE CARNE
    E AS ESTATISTICAS DE ABATE DE BOVINOS A REALIZAR PELOS ESTADOS-MEMBROS'
  type: main
- language: es
  script: Latn
  content: '90/501/CEE: DECISION DE LA COMISION, DE 4 DE OCTUBRE DE 1990, POR LA QUE
    SE MODIFICA LA DECISION 73/262/CEE POR LA QUE SE ESTABLECEN LAS DISPOSICIONES
    DE APLICACION DE LA ENCUESTAS ESTADISTICAS DEL GANADO BOVINO, LAS PREVISIONES
    DE DISPONIBILIDAD DE BOVINOS DE ABASTO Y LAS ESTADISTICAS DE SACRIFICIO DE BOVINOS
    QUE DEBEN EFECTUAR LOS ESTADOS MIEMBROS'
