  content: Commission Implementing Regulation (EU) 2019/899 of 29 May 2019 concerning
    the renewal of the authorisation of Saccharomyces cerevisiae CNCM I-4407 as a
    feed additive for lambs for fattening, dairy goats, dairy sheep, dairy buffaloes,
    horses and pigs for fattening and repealing Regulations (EC) No 1447/2006, (EC)
