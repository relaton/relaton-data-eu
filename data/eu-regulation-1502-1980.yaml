title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1502/80 of 16 June 1980 re-establishing
    the levying of customs duties on rubber tyres, tyre cases, other (including tyre
    cases with sewn-in inner tubes, for racing bicycles, and tyre flaps), falling
    within heading No ex 40.11 and originating in developing countries, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1502/80 de la Commission, du 16 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux bandages,
    pneumatiques, etc., autres (y compris les "flaps" et les boyaux) de la position
    ex 40.11 du tarif douanier commun, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1502/80 der Kommission vom 16. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Reifen, auswechselbare Überreifen{{{ andere (einschließlich
    Felgenbänder und Schlauchreifen), der Tarifstelle ex 40.11, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1502/80 af 16. juni 1980 om genindførelse
    af opkrævning af toldafgifter for dæk, ringe, etc., andre varer (herunder dæk
    med isat slange, til racercykler, og fælgbånd), under pos. ex 40.11, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1502/80 della Commissione, del 16 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle gomme piene o semipiene,
    coperture, ecc., altri (compresi protettori (flaps) e tubolari), della voce ex
    40.11 della tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1502/80 van de Commissie van 16 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor banden en velglinten,
    {{{ andere (velglinten en tuben daaronder begrepen), van post ex 40.11, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad tariefpreferenties werden geopend
  type: main
