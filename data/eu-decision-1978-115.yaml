title:
- language: en
  script: Latn
  content: Commission Decision of 23 December 1977 on the granting by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of a payment on account
    in respect of expenditure incurred during 1976 on aids and premiums relating to
    the modernization of farms including those in the less-favoured farming areas
  type: main
- language: fr
  script: Latn
  content: '78/115/CEE: Décision de la Commission, du 23 décembre 1977, relative
    au versement par le FEOGA, section "orientation", à la République fédérale
    d''Allemagne, d''un acompte sur les dépenses effectuées pendant l''année 1976
    pour les aides et primes relatives à la modernisation des exploitations agricoles,
    y compris dans les zones agricoles défavorisées'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Dezember 1977 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an die Bundesrepublik Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 23. december 1977 om udbetaling gennem EUGFL,
    udviklingssektionen, til Forbundsrepublikken Tyskland af et acontobeløb for de
    udgifter, som er afholdt i løbet af året 1976 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter, herunder sådanne beliggende i ugunstigt
    stillede områder
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 dicembre 1977, relativa al versamento
    alla Repubblica federale di Germania da parte del FEAOG, sezione orientamento,
    di un anticipo sulle spese effettuate durante il 1976 per gli aiuti ed i premi
    relativi all'ammodernamento delle aziende agricole, comprese quelle nelle zone
    agricole svantaggiate
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 december 1977 betreffende de betaling
    door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland van een
    voorschot in verband met de in 1976 verrichte uitgaven voor steun en premies met
    betrekking tot de modernisering van landbouwbedrijven, waaronder mede begrepen
    die in probleemgebieden in de landbouw
