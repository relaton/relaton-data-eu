title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3264/85 of 21 November 1985 amending Regulation
    (EEC) No 2913/85 as regards the beef products which may be taken into intervention
    in certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3264/85 de la Commission du 21 novembre 1985 modifiant
    le règlement (CEE) no 2913/85 en ce qui concerne les produits du secteur de la
    viande bovine pouvant faire l' objet d' achats à l' intervention dans certains
    États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3264/85 der Kommission vom 21. November 1985 zur Änderung
    der Verordnung (EWG) Nr. 2913/85 hinsichtlich der Rindfleischerzeugnisse, die
    Gegenstand von Interventionskäufen in bestimmten Mitgliedstaaten sein können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3264/85 af 21. november 1985 om ændring
    af forordning (EØF) nr. 2913/85 for så vidt angår oksekødsprodukter, der kan
    opkøbes ved intervention i visse medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3264/85 της Επιτροπής
    της 21ης Νοεμβρίου 1985 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2913/85 όσον αφορά τα προϊόντα στον
    τομέα του βοείου κρέατος που μπορούν να αποτελέσουν
    αντικείμενο αγορών στην παρέμβαση σε ορισμένα
    κράτη μέλη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3264/85 della Commissione del 21 novembre 1985 che
    modifica il regolamento (CEE) n. 2913/85 per quanto concerne i prodotti del settore
    delle carni bovine che possono formare oggetto di acquisti all' intervento in
    taluni stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3264/85 van de Commissie van 21 november 1985 tot
    wijziging van Verordening (EEG) nr. 2913/85 met betrekking tot de produkten van
    de sector rundvlees die in bepaalde Lid-Staten door de interventiebureaus kunnen
    worden aangekocht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3264/85 da Comissão, de 21 de Novembro de 1985,
    que altera o Regulamento (CEE) n.° 2913/85 no que diz respeito aos produtos do
    sector da carne de bovino que podem ser objecto de compras de intervenção em
    determinados Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3264/85 de la Comisión, de 21 de noviembre de 1985,
    por el que se modifica el Reglamento (CEE) n° 2913/85 en lo que se refiere a
    los productos del sector de la carne de bovino que pueden ser objeto de compra
    por parte de los organismos de intervención de determinados Estados miembros
  type: main
