title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1467/80 of 10 June 1980 laying down detailed
    rules limiting the granting of production aid for Williams pears and cherries
    preserved in syrup
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1467/80 de la Commission, du 10 juin 1980, portant
    modalités relatives à la limitation de l' octroi de l' aide à la production
    pour les poires Williams et les cerises conservées au sirop
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1467/80 der Kommission vom 10. Juni 1980 mit Bestimmungen
    zur Begrenzung der Gewährung der Produktionsbeihilfe für in Sirup haltbar gemachte
    Williamsbirnen und Kirschen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1467/80 af 10. juni 1980 om nærmere
    bestemmelser vedrørende begrænsning af produktionsstøtten til Williamspærer
    og kirsebær konserveret i sukkeropløsning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1467/80 τής Επιτροπής
