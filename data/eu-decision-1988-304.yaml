title:
- language: en
  script: Latn
  content: '88/304/EEC: Council Decision of 16 May 1988 concerning the conclusion
    of an Agreement in the form of a joint letter addressed to the Director-General
    of GATT between the European Economic Community and the Kingdom of Thailand negotiated
    under Article XXVIII of the GATT concerning sweet potatoes falling within CN code
    0714 20 00 and intended for uses other than human consumption'
  type: main
- language: fr
  script: Latn
  content: '88/304/CEE: Décision du Conseil du 16 mai 1988 concernant la conclusion
    de l''accord, sous forme de lettre conjointe adressée au directeur général
    de l''accord général sur les tarifs douaniers et le commerce (GATT), entre la
    Communauté économique européenne et le Royaume de Thaïlande, négocié au
    titre de l''article XXVIII du GATT et relatif aux patates douces relevant du code
    NC 0714 20 00 et destinées à une utilisation autre que l''alimentation humaine'
  type: main
- language: de
  script: Latn
  content: '88/304/EWG: Beschluß des Rates vom 16. Mai 1988 über den Abschluß des
    Abkommens - in Form eines gemeinsamen Schreibens an den Generaldirektor des GATT
    - zwischen der Europäischen Wirtschaftsgemeinschaft und dem Königreich Thailand,
    ausgehandelt gemäß Artikel XXVIII des GATT, betreffend nicht zum menschlichen
    Verzehr bestimmte Süßkartoffeln der Codenummer 0714 20 00'
  type: main
- language: da
  script: Latn
  content: '88/304/EØF: Rådets afgørelse af 16. maj 1988 om indgåelse af aftalen
    mellem Det Europæiske Økonomiske Fællesskab og Kongeriget Thailand i form af
    fælles skrivelse til generaldirektøren for GATT, forhandlet i henhold til artikel
    XXVIII i GATT og vedrørende søde kartofler, henhørende under KN-kode 0714 20
    00, bestemt til anden anvendelse end menneskeføde'
  type: main
- language: el
  script: Grek
  content: '88/304/ΕΟΚ: Απόφαση του Συμβουλίου της 16ης
    Μαΐου 1988 για τη σύναψη της συμφωνίας, υπό μορφή
    συνημμένης επιστολής η οποία απευθύνεται στο
    Γενικό Διευθυντή της GATT, μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και του Βασιλείου της
    Ταϊλάνδης, που αποτέλεσε αντικείμενο διαπραγμάτευσης
    δυνάμει του άρθρου XXVIII της GATT και αφορά τις
    γλυκοπατάτες που υπάγονται στη διάκριση 0714
    20 00 της συνδυασμένης ονοματολογίας και προορίζονται
    για άλλη χρήση εκτός από την ανθρώπινη διατροφή'
  type: main
- language: fi
  script: Latn
  content: '88/304/ETY: Neuvoston päätös, tehty 16 päivänä toukokuuta 1988,
    Euroopan talousyhteisön ja Thaimaan kuningaskunnan välisen GATTin 28 artiklan
    mukaisesti neuvotellun, CN-koodiin 0714 20 00 kuuluvia muuksi kuin ihmisravinnoksi
    tarkoitettuja bataatteja koskevan, tullitariffeja ja kauppaa koskevan yleissopimuksen
    (GATT) pääjohtajalle osoitetun yhteisen kirjeen muodossa olevan sopimuksen tekemisestä'
  type: main
- language: it
  script: Latn
  content: '88/304/CEE: Decisione del Consiglio del 16 maggio 1988 relativa alla conclusione
    dell''accordo, in forma di scambio di lettera congiunta indirizzata al direttore
    generale del GATT, tra la Comunità economica europea e il Regno di Tailandia,
    negoziato in virtù dell''articolo XXVIII del GATT e relativo alle patate dolci
    del codice 0714 20 00 della nomenclatura combinata, destinate ad un''utilizzazione
    diversa dall''alimentazione umana'
  type: main
- language: nl
  script: Latn
  content: '88/304/EEG: Besluit van de Raad van 16 mei 1988 betreffende de sluiting
    van de Overeenkomst, in de vorm van een gemeenschappelijk schrijven aan de Directeur-
    generaal van de GATT, tussen de Europese Economische Gemeenschap en het Koninkrijk
    Thailand in het kader van artikel XXVIII van de GATT, over bataten (zoete aardappelen)
    van code 0714 20 00 van de gecombineerde nomenclatuur, bestemd voor andere doeleinden
    dan menselijke consumptie'
  type: main
- language: pt
  script: Latn
  content: '88/304/CEE: Decisão do Conselho de 16 de Maio de 1988 relativa à conclusão
