    de conformidad con el artículo XXVIII del GATT y relativo a las batatas del código
    NC 0714 20 00 y que no se destinen al consumo humano'
  type: main
- language: sv
  script: Latn
  content: '88/304/EEG: Rådets beslut av den 16 maj 1988 om ingående av ett avtal
    mellan Europeiska ekonomiska gemenskapen och Thailand i form av en gemensam skrivelse
    till GATT:s generaldirektör avseende sötpotatis enligt KN-nummer 0714 20 00
