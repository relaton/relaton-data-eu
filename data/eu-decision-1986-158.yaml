title:
- language: en
  script: Latn
  content: '86/158/EEC: Commission Decision of 25 March 1986 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of early ware potatoes originating in Cuba (Only the German,
    French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/158/CEE: Décision de la Commission du 25 mars 1986 autorisant certains
