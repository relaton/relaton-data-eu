    I del regolamento (CEE) n. 1785/81, all'allegato del regolamento (CEE) n. 1010/86
    e all'allegato del regolamento (CEE) n. 1729/78, sulla base della vigente nomenclatura
    combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1126/96 van de Commissie van 24 juni 1996 houdende
