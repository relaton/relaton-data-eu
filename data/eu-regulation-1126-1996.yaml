    i bilag I til forordning (EØF) nr. 1785/81, i bilaget til forordning (EØF) nr.
    1010/86 og i bilaget til forordning (EØF) nr. 1729/78 i overensstemmelse med
    den gældende kombinerede nomenklatur
  type: main
- language: el
  script: Grek
