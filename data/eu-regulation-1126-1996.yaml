title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1126/96 of 24 June 1996 adapting the codes
    and descriptions of goods in the sugar sector appearing in Annex I to Regulation
    (EEC) No 1785/81, the Annex to Regulation (EEC) No 1010/86 and the Annex to Regulation
    (EEC) No 1729/78 to accord with the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1126/96 de la Commission du 24 juin 1996 adaptant pour
    le secteur du sucre les codes et la désignation des marchandises reprises à
    l'annexe I du règlement (CEE) nº 1785/81, à l'annexe du règlement (CEE) nº
    1010/86, ainsi qu'à l'annexe du règlement (CEE) nº 1729/78 en fonction de la
    nomenclature combinée en vigueur
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1126/96 der Kommission vom 24. Juni 1996 zur Anpassung
    der Codes und der Warenbezeichnung in Anhang I der Verordnung (EWG) Nr. 1785/81,
    im Anhang der Verordnung (EWG) Nr. 1010/86 sowie im Anhang der Verordnung (EWG)
    Nr. 1729/78 nach Maßgabe der geltenden Kombinierten Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1126/96 af 24. juni 1996 om tilpasning,
