    sekä asetuksen (ETY) N:o 1729/78 liitteessä lueteltujen tavaran kuvausten ja
    tavarakoodien mukauttamisesta sokerialalla voimassa olevan yhdistetyn nimikkeistön
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1126/96 della Commissione del 24 giugno 1996 che modifica,
