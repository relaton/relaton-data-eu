id: EUDecision20221933
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1933 of 12 October 2022 amending
    Council Directive 2008/90/EC as regards the extension of the derogation relating
    to import conditions for fruit plant propagating material and fruit plants intended
    for fruit production from third countries (notified under document C(2022) 7148)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1933 de la Commission du 12 octobre
    2022 modifiant la directive 2008/90/CE du Conseil en vue de prolonger la dérogation
    relative aux conditions d’importation des matériels de multiplication de plantes
    fruitières et des plantes fruitières destinées à la production de fruits en
    provenance de pays tiers [notifiée sous le numéro C(2022) 7148]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1933 der Kommission vom 12. Oktober 2022
    zur Änderung der Richtlinie 2008/90/EG des Rates hinsichtlich der Verlängerung
    der Ausnahmeregelung für die Einfuhrbedingungen für Vermehrungsmaterial und
    Pflanzen von Obstarten zur Fruchterzeugung aus Drittländern (Bekannt gegeben
    unter Aktenzeichen C(2022) 7148)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1933 на Комисията
    от 12 октомври 2022 година за изменение на Директива
    2008/90/ЕО на Съвета във връзка с удължаването
    на срока на дерогацията по отношение на условията
    за вноса от трети страни на посадъчен материал
    от овощни растения и на овощни растения, предназначени
    за производство на плодове (нотифицирано под
    номер С(2022) 7148)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1933 ze dne 12. října 2022,
    kterým se mění směrnice Rady 2008/90/ES, pokud jde o prodloužení platnosti
    odchylky týkající se dovozních podmínek pro rozmnožovací materiál ovocných
    rostlin a ovocné rostliny určené k produkci ovoce ze třetích zemí (oznámeno
    pod číslem C(2022) 7148)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1933 af 12. oktober 2022
    om ændring af Rådets direktiv 2008/90/EF for så vidt angår forlængelse af
    fravigelsen af betingelserne for import af frugtplanteformeringsmateriale og frugtplanter
    bestemt til frugtproduktion fra tredjelande (meddelt under nummer C(2022) 7148)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2022/1933 της Επιτροπής
    της 12ης Οκτωβρίου 2022 για την τροποποίηση της
    οδηγίας 2008/90/ΕΚ του Συμβουλίου όσον αφορά την
    παράταση της παρέκκλισης σχετικά με τους όρους
    εισαγωγής, από τρίτες χώρες, πολλαπλασιαστικού
    υλικού οπωροφόρων φυτών και οπωροφόρων δένδρων
    που προορίζονται για την παραγωγή φρούτων
    [κοινοποιηθείσα υπό τον αριθμό C(2022) 7148]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1933, 12. oktoober 2022, millega muudetakse
    nõukogu direktiivi 2008/90/EÜ seoses kolmandatest riikidest pärit ning puuviljade
    tootmiseks ettenähtud viljapuude paljundusmaterjali ja viljapuude imporditingimusi
    käsitleva erandi kehtivusaja pikendamisega (teatavaks tehtud numbri C(2022) 7148
    all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1933, annettu 12 päivänä
    lokakuuta 2022, neuvoston direktiivin 2008/90/EY muuttamisesta siltä osin kuin
    on kyse tuontiedellytyksiä koskevan poikkeuksen soveltamisen jatkamisesta kolmansista
    maista tuotavien hedelmäntuotantoon tarkoitettujen hedelmäkasvien ja niiden
    lisäysaineiston osalta (tiedoksiannettu numerolla C(2022) 7148)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1933 ón gCoimisiún an 12 Deireadh
    Fómhair 2022 lena leasaítear Treoir 2008/90/CE ón gComhairle a mhéid a bhaineann
    le síneadh a chur leis an maolú a bhaineann le coinníollacha allmhairiúcháin
    d’ábhar iomadaithe plandaí torthaí agus do phlandaí torthaí a bheartaítear
    do tháirgeadh torthaí ó thríú tíortha (a bhfuil fógra tugtha ina leith
    faoi dhoiciméad C(2022) 7148)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1933 оd 12. listopada 2022. o izmjeni
    Direktive Vijeća 2008/90/EZ u pogledu produljenja odstupanja koje se odnosi na
    uvjete uvoza reprodukcijskog sadnog materijala i sadnica namijenjenih proizvodnji
    voća iz trećih zemalja (priopćeno pod brojem dokumenta C(2022) 7148)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1933 végrehajtási határozata (2022. október
    12.) a 2008/90/EK tanácsi irányelvnek a harmadik országból származó gyümölcstermő
    növények szaporítóanyagaira, illetve a gyümölcstermesztésre szánt gyümölcstermő
    növényekre vonatkozó behozatali feltételekkel kapcsolatos eltérés kiterjesztése
    tekintetében történő módosításáról (az értesítés a C(2022) 7148. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1933 della Commissione del 12 ottobre
    2022 che modifica la direttiva 2008/90/CE del Consiglio per quanto riguarda la
    proroga della deroga relativa alle condizioni di importazione dei materiali di
    moltiplicazione delle piante da frutto e delle piante da frutto destinate alla
    produzione di frutti provenienti da paesi terzi [notificata con il numero C(2022)
    7148]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1933 (2022. gada 12. oktobris),
    ar ko, lai pagarinātu atkāpi attiecībā uz nosacījumiem, kuri piemērojami
    augļaugu pavairošanas materiāla un augļu ražošanai paredzētu augļaugu
    importam no trešām valstīm, groza Padomes Direktīvu 2008/90/EK (izziņots
    ar dokumentu Nr. C(2022) 7148)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1933 2022 m. spalio 12 d.
    kuriuo dėl nukrypti leidžiančios nuostatos dėl vaisinių augalų dauginamosios
    medžiagos ir sodininkystei skirtų vaisinių augalų importo iš trečiųjų
    šalių sąlygų taikymo laikotarpio pratęsimo iš dalies keičiama Tarybos direktyva
    2008/90/EB (pranešta dokumentu Nr. C(2022) 7148)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1933 tat-12
    ta’ Ottubru 2022 li temenda d-Direttiva tal-Kunsill 2008/90/KE fir-rigward tal-estensjoni
    tad-deroga relatata mal-kondizzjonijiet tal-importazzjoni tal-materjal tal-propagazzjoni
    tal-pjanti tal-frott u tal-pjanti tal-frott maħsuba għall-produzzjoni tal-frott
    minn pajjiżi terzi (notifikata bid-dokument C(2022) 7148)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1933 van de Commissie van 12 oktober 2022
    tot wijziging van Richtlijn 2008/90/EG van de Raad wat betreft de verlenging van
    de periode waarin mag worden afgeweken van de voorwaarden voor de invoer van teeltmateriaal
    van fruitgewassen alsmede van voor de fruitteelt gebruikte fruitgewassen uit derde
    landen (Kennisgeving geschied onder nummer C(2022) 7148)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1933 z dnia 12 października 2022
    r. zmieniająca dyrektywę Rady 2008/90/WE w odniesieniu do przedłużenia okresu
    obowiązywania odstępstwa dotyczącego warunków przywozu materiału rozmnożeniowego
    roślin sadowniczych oraz roślin sadowniczych przeznaczonych do produkcji owoców
    z państw trzecich (notyfikowana jako dokument nr C(2022) 7148)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1933 da Comissão de 12 de outubro de
    2022 que altera a Diretiva 2008/90/CE do Conselho no que se refere à prorrogação
    da derrogação relativa às condições de importação a partir de países terceiros
    de material de propagação de fruteiras e de fruteiras destinados à produção
    de frutos [notificada com o número C(2022) 7148]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1933 a Comisiei din 12 octombrie
    2022 de modificare a Directivei 2008/90/CE a Consiliului în ceea ce privește
    prelungirea derogării privind condițiile de import pentru materialul de înmulțire
    și plantare fructifer destinat producției de fructe provenind din țări terțe
    [notificată cu numărul C(2022) 7148]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1933 z 12. októbra 2022, ktorým
    sa mení smernica Rady 2008/90/ES, pokiaľ ide o predĺženie platnosti výnimky
    týkajúcej sa dovozných podmienok na množiteľský materiál ovocných drevín
    a na ovocné dreviny určené na výrobu ovocia z tretích krajín [oznámené
    pod číslom C(2022) 7148]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1933 z dne 12. oktobra 2022 o spremembi
    Direktive Sveta 2008/90/ES glede podaljšanja odstopanja v zvezi z uvoznimi pogoji
    za razmnoževalni material sadnih rastlin in sadne rastline, namenjene za pridelavo
    sadja, iz tretjih držav (notificirano pod dokumentarno številko C(2022) 7148)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1933 de la Comisión de 12 de octubre
    de 2022 por la que se modifica la Directiva 2008/90/CE del Consejo a fin de prorrogar
    la excepción relativa a las condiciones de importación de materiales de multiplicación
    de frutales y plantones de frutal destinados a la producción frutícola procedentes
    de terceros países [notificada con el número C(2022) 7148]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1933 av den 12 oktober 2022
    om ändring av rådets direktiv 2008/90/EG vad gäller förlängningen av undantaget
    beträffande importvillkoren för fruktplantsförökningsmaterial och fruktplantor
    avsedda för fruktproduktion från tredjeländer [delgivet med nr C(2022) 7148]
