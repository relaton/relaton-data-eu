title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1755/90 of 27 June 1990 establishing the
    activating threshold price for aid, the guide price and the minimum price for
    peas, field beans and sweet lupins fixed in ecus by the Council and reduced as
    a result of the monetary realignment of 5 January 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1755/90 de la Commission du 27 juin 1990 déterminant,
    pour les pois, les fèves, les féveroles et les lupins doux, le prix de seuil
    de déclenchement de l'aide, le prix d'objectif et le prix minimal, fixés en
    écus par le Conseil et réduit à la suite du réalignement monétaire du 5 janvier
    1990
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1755/90 DER KOMMISSION vom 27. Juni 1990 zur Festsetzung
    des vom Rat in Ecu festgesetzten und wegen der Waehrungsneufestsetzung vom 5.
    Januar 1990 verringerten Schwellenpreises fuer die Ausloesung der Beihilfe, des
    Zielpreises sowie des Mindestpreises fuer Erbsen, Puffbohnen, Ackerbohnen und
    Suesslupinen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1755/90 af 27. juni 1990 om fastsættelse
    af tærskelprisen for udløsning af støtte for ærter, bønner, hestebønner
    og sødlupiner samt af målprisen og minimumsprisen for disse produkter, som Rådet
    har fastsat i ECU, og som nedsættes som følge af den monetære justering den
    5. januar 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1755/90 της Επιτροπής
    της 27ης Ιουνίου 1990 για τον καθορισμό, για τα
    πίσα, τα κουκιά, τα φούλια και τα γλυκά λούπινα,
    της τιμής κατωφλίου ενεργοποιήσεως της ενισχύσεως,
    της τιμής στόχου και της ελάχιστης τιμής που
    καθορίζονται σε Ecu από το Συμβούλιο και μειώνονται
    λόγω της νομισματικής επανευθυγράμμισης της
    5ης Ιανουαρίου 1990
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1755/90 DELLA COMMISSIONE del 27 giugno 1990 che stabilisce
    il prezzo limite par l'aiuto, il prezzo d'obiettivo e il prezzo minimo per i piselli,
    le fave, le favette e i lupini dolci fissati in ecu dal Consiglio e ridotti a
    seguito del riallineamento monetario del 5 gennaio 1990
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1755/90 VAN DE COMMISSIE van 27 juni 1990 ter bepaling
    van de steundrempelprijs, de streefprijs en de minimumprijs voor erwten, tuin-
    en veldbonen en niet-bittere lupinen die door de Raad in ecu zijn vastgesteld
    en als gevolg van de monetaire herschikking van 5 januari 1990 worden verlaagd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1755/90 DA COMISSAO de 27 de Junho de 1990 que fixa
    o preço limiar de desencadeamento da ajuda, o preço de objectivo e o preço
    minimo para as ervilhas, as favas e as favas forrageiras e os tremoços doces,
    fixados em ecus pelo Conselho e reduzidos em consequência do realinhamento monetario
    de 5 de Janeiro de 1990
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1755/90 DE LA COMISION de 27 de junio de 1990 por el
    que se establece el precio de umbral desencadenante de la ayuda, el precio de
    objetivo y el precio minimo para los guisantes, habas, haboncillos y altramuces
    dulces fijados en ecus por el Consejo, y reducidos como consecuencia del reajuste
    monetario del 5 de enero de 1990
