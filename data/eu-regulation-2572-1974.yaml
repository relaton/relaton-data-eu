title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2572/74 of the Commission of 9 October 1974 re-establishing
    the levying of the customs duties on wrought plates, sheets and strip, of aluminium,
    falling within heading No 76.03, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2572/74 de la Commission, du 9 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en aluminium, d'une épaisseur de plus de 0-20 millimètres,
    de la position tarifaire 76.03, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2572/74 der Kommission vom 9. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Aluminium, mit einer
    Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2572/74 af 9. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af aluminium under position
    76.03, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2572/74 della Commissione, del 9 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri, di alluminio, di spessore superiore a 0,20 mm della voce doganale
    n. 76.03 originari della Iugoslavia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2572/74 van de Commissie van 9 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op platen, bladen
    en strippen, van aluminium, met een dikte van meer dan 0,20 mm van post 76.03,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
