  content: Council Regulation (EEC) No 1129/78 of 22 May 1978 amending Regulation
    (EEC) No 471/76 as regards the period of suspension of the application of the
    condition on prices governing the importation into the Community of fresh lemons
    originating in certain Mediterranean countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1129/78 du Conseil, du 22 mai 1978, modifiant le règlement
    (CEE) n° 471/76 en ce qui concerne la période de suspension de l' application
    de la condition en matière de prix à laquelle est soumise l' importation dans
    la Communauté de citrons frais originaires de certains pays du bassin Méditerranéen
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1129/78 des Rates vom 22. Mai 1978 zur Änderung der
    Verordnung (EWG) Nr. 471/76 hinsichtlich der Dauer der Aussetzung der Anwendung
    der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung in einigen
    Ländern des Mittelmeerraums in die Gemeinschaft unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1129/78 af 22. maj 1978 om ændring af forordning
    (EØF) nr. 471/76 for så vidt angår suspensionsperioden for den vedrørende
    priserne gældende betingelsen for indførsel til Fællesskabet af friske citroner
    med oprindelse i visse middelhavslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1129/78 del Consiglio, del 22 maggio 1978, che modifica
    il regolamento (CEE) n. 471/76 per quanto riguarda il periodo durante il quale
    è sospesa l' applicazione della condizione in materia di prezzi cui è soggetta
    l' importazione nella Comunità di limoni freschi originari di taluni paesi del
    bacino mediterraneo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1129/78 van de Raad van 22 mei 1978 tot wijziging
    van Verordening (EEG) nr. 471/76 met betrekking tot de periode waarin de toepassing
    van de voorwaarde ten aanzien van de prijs waaraan de invoer in de Gemeenschap
    van verse citroenen van oorsprong uit sommige landen van het Middellandse-Zeegebied
    is onderworpen wordt geschorst
