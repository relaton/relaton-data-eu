title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 254/79 of 9 February 1979 re-establishing
    the levying of customs duties on spoons, forks, fish-eaters, butter-knives, ladles
    and similar kitchen or tableware of stainless steel, falling within subheading
    82.14 A, originating in South Korea to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 254/79 de la Commission, du 9 février 1979, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, pelles à tartes, couteaux spéciaux à poisson ou à beurre,
    pinces à sucre et articles similaires, de la sous-position tarifaire 82.14 A,
    originaires de la Corée du Sud bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 254/79 der Kommission vom 9. Februar 1979 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln usw., aus rostfreiem Stahl,
    der Tarifstelle 82.14 A, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 254/79 af 9. februar 1979 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc., af rustfrit
    stål, henhørende under pos. 82.14 A, som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 254/79 della Commissione, del 9 febbraio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai cuchiai, cucchiaioni,
    forchette, ecc., di acciaio inossidabile, della sottovoce doganale 82.14 A, originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 254/79 van de Commissie van 9 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op lepels,
    pollepels, vorken, enz., van roestvrij staal, van onderverdeling 82.14 A, van
    oorsprong uit Zuid-Korea ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
