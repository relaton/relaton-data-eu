    produttori di pomodori e l' importo dell' aiuto alla produzione per i prodotti
    trasformati a base di pomodoro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2160/87 van de Commissie van 22 juli 1987 tot vaststelling,
    voor het verkoopseizoen 1987/1988, van de aan de telers voor tomaten te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2160/87 da Comissão de 22 de Julho de 1987 que
