  content: Commission Regulation (EEC) No 2160/87 of 22 July 1987 fixing for the 1987/88
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2160/87 de la Commission du 22 juillet 1987 fixant,
    pour la campagne 1987/1988, le prix minimal à payer aux producteurs pour les
    tomates ainsi que le montant de l' aide à la production pour les produits transformés
    à base de tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2160/87 der Kommission vom 22. Juli 1987 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1987/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2160/87 af 22. juli 1987 om fastsættelse
    af den minimumspris, der skal betales producenten for tomater, samt producentstøtten
    for forarbejdede tomater i produktionsåret 1987/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2160/87 της Επιτροπής
