title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 février 1968, autorisant la République
    fédérale d'Allemagne, en vertu de l'article 115, alinéa 1, du Traité, à exclure
    du traitement communautaire les "oxydes d'antimoine" de la position n° Ex 28.08
    M du Tarif douanier commun, originaires des pays de l'Est et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '68/112/EWG: Entscheidung der Kommission vom 13. Februar 1968 zur Ermächtigung
    der Bundesrepublik Deutschland gemäß Artikel 115 Absatz 1 des Vertrages, aus
    den Ostblockländern stammende Antimonoxyde der Tarifnummer ex 28.28 M des Gemeinsamen
    Zolltarifs, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/112/CEE: Decisione della Commissione, del 13 febbraio 1968, che autorizza
    la Repubblica federale di Germania in virtù dell''articolo 115, comma 1, del
    trattato, ad escludere dal trattamento comunitario gli ossidi di antimonio della
    voce ex 28.28 M della tariffa doganale comune originari dei paesi dell''Est ed
    immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/112/EEG: Beschikking van de Commissie van 13 februari 1968 houdende
    machtiging van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag antimoonoxyden van post ex 28.28 M van het gemeenschappelijk
    douanetarief, van oorsprong uit de oostelijke landen en in de andere Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
