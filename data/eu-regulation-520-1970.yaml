title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 520/70 du Conseil, du 17 mars 1970, fixant les dispositions
    particulières applicables à l'importation des marchandises relevant du règlement
    (CEE) n° 1059/69, originaires des États africains et malgache associés ou des
    pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 520/70 des Rates vom 17. März 1970 zur Festlegung
    der Sonderbestimmungen, die bei der Einfuhr von unter die Verordnung (EWG) Nr.
    1059/69 fallenden Waren mit Ursprung in den assoziierten afrikanischen Staaten
    und Madagaskar oder den assoziierten überseeischen Ländern und Gebieten anwendbar
    sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 520/70 del Consiglio, del 17 marzo 1970, che determina
    le disposizioni particolari applicabili all'importazione delle merci cui si applica
    il regolamento (CEE) n. 1059/69, originarie degli Stati africani e malgascio associati
    o dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 520/70 van de Raad van 17 maart 1970 tot vaststelling
    van de bijzondere bepalingen welke bij de invoer van goederen, vallende onder
    Verordening (EEG) nr. 1059/69, van oorsprong uit de geassocieerde Afrikaanse Staten
    en Madagaskar of de landen en gebieden overzee, van toepassing zijn
  type: main
