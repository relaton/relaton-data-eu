  content: Council Regulation (EEC) No 2756/77 of 5 December 1977 opening and providing
    for the administration of a Community preferential ceiling for certain petroleum
    products refined in Turkey and establishing Community supervision of imports thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2756/77 du Conseil, du 5 décembre 1977, portant ouverture
    et mode de gestion d'un plafond communautaire préférentiel pour certains produits
    pétroliers raffinés en Turquie et établissement d'une surveillance communautaire
    des importations de ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2756/77 des Rates vom 5. Dezember 1977 zur Eröffnung
