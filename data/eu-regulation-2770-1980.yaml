title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2770/80 of 28 October 1980 re-establishing
    the levying of customs duties on methylamine, dimethylamine and trimethylamine,
    and their salts, falling within subheading 29.22 A I and originating in Romania,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2770/80 de la Commission, du 28 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables à la méthylamine,
    diméthylamine, triméthylamine et leurs sels, de la sous-position 29.22 A I du
    tarif douanier commun, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2770/80 der Kommission vom 28. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Methylamin, Dimethylamin, Trimethylamin und ihre Salze der
    Tarifstelle 29.22 A I mit Ursprung in Rumänien, dem die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2770/80 af 28. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for methylamin, dimethylamin og trimethylamin samt
    salte deraf, under pos. 29.22 A I, som har oprindelse i Rumænien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2770/80 della Commissione, del 28 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alla metilammina, dimetilammina,
    trimetilammina e loro sali, della sottovoce 29.22 A I della tariffa doganale comune,
    originari della Romania beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2770/80 van de Commissie van 28 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op methylamine,
    dimethylamine en trimethylamine, alsmede zouten daarvan, van post 29.22 A I, van
    oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
