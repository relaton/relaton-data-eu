title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1463/79 of 13 July 1979 amending the Annex
    to Regulation (EEC) No 532/75 concerning the recovery on exportation of aids granted
    in respect of skimmed-milk powder for use as feed and in respect of skimmed milk
    processed into compound feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1463/79 de la Commission, du 13 juillet 1979, modifiant
    l' annexe du règlement (CEE) n° 532/75 relatif à la récupération des aides
    pour le lait écrémé en poudre destiné à l' alimentation des animaux et le
    lait écrémé transformé en aliments composés lors de l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1463/79 der Kommission vom 13. Juli 1979 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 532/75 über die Wiedereinziehung der Beihilfen
    für Magermilchpulver für Futterzwecke und zu Milchfutter verarbeitete Magermilch
    bei der Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1463/79 af 13. juli 1979 om ændring
    af bilaget til forordning (EØF) nr. 532/75 om tilbagebetaling, ved udførsel,
    af støtte til skummetmælkspulver til foderbrug og skummetmælk, der forarbejdes
    til foderblandinger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1463/79 τής Επιτροπής
    τής 13ης Ιουλίου 1979 περί τροποποιήσεως τού παραρτήματος
    τού κανονισμού (ΕΟΚ) αριθ. 532/75 «περί τής ανακτήσεως
    τών ενισχύσεων γιά τό αποκορυφωμένο γάλα εις
    κόνιν, τό προοριζόμενο γιά τή διατροφή ζώων,
