  content: Commission Regulation (EEC) No 2087/82 of 29 July 1982 regarding the application
    of Decision No 1/82 of the ACP-EEC Customs Cooperation Committee derogating from
    the definition of the concept of 'originating products' to take into account the
    special situation of Mauritius with regard to its production of canned tuna
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2087/82 de la Commission, du 29 juillet 1982, relatif
    à l' application de la décision n° 1/82 du comité de coopération douanière
    ACP-CEE portant dérogation à la définition de la notion de produits originaires
    pour tenir compte de la situation particulière de l' île Maurice en ce qui concerne
    sa production de conserves de thon
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2087/82 der Kommission vom 29. Juli 1982 zur Durchführung
    des Beschlusses Nr. 1/82 des AKP-EWG-Ausschusses für Zusammenarbeit im Zollwesen
    zur Abweichung von der Begriffsbestimmung für ,,Ursprungswaren' ' zur Berücksichtigung
    der besonderen Lage von Mauritius bei der Herstellung von haltbar gemachtem Thunfisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2087/82 af 29. juli 1982 om gennemførelse
    af AVS/EØF-Toldsamarbejdsudvalgets afgørelse nr. 1/82 om undtagelse fra begrebet
    "varer med oprindelsesstatus" for at tage hensyn til Mauritius' særlige situation
    for så vidt angår produktionen af tunfiskekonserves
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2087/82 τής Επιτροπής
