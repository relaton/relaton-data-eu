title:
- language: en
  script: Latn
  content: '86/318/EEC: Commission Decision of 19 June 1986 establishing the amendments
    to be made in respect of seed potatoes to the measures taken by Denmark to protect
    itself against the introduction of Corynebacterium sepedonicum (Only the Danish
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/318/CEE: Décision de la Commission du 19 juin 1986 fixant les modifications
    à apporter, pour le plant de pommes de terre, aux mesures prises par le Danemark
    pour se protéger contre l''introduction de Corynebacterium sepedonicum (Le texte
    en langue danoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/318/EWG: Entscheidung der Kommission vom 19. Juni 1986 über Änderungen
    zu den Schutzmaßnahmen Dänemarks gegen die Einschleppung von bakterieller Ringfäule
    bei Saatkartoffeln (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/318/EØF: Kommissionens beslutning af 19. juni 1986 om ændringer af
    de foranstaltninger, som Danmark har truffet med hensyn til læggekartofler for
    at beskytte sig imod indslæbning af Corynebacterium sepedonicum (Kun den danske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/318/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουνίου 1986 για τον καθορισμό των τροποποιήσεων
    που πρέπει να επέλθουν στα μέτρα που έλαβε
    η Δανία σχετικά με τα φυτά γεωμήλων προκειμένου
    να προστατευθεί από την είσοδο του Corynebacterium
    sepedonicum στο έδαφός της (Το κείμενο στην δανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/318/CEE: Decisione della Commissione del 19 giugno 1986 relativa alle
    modifiche da apportare alle misure adottate dalla Danimarca nel settore delle
    patate da semina per prevenire l''introduzione nel paese del "Corynebacterium
    sepedonicum" (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/318/EEG: Beschikking van de Commissie van 19 juni 1986 tot vaststelling
    van de wijzigingen die voor pootaardappelen moeten worden aangebracht in de maatregelen
    die Denemarken heeft vastgesteld om zich te beschermen tegen het binnenbrengen
    van Corynebacterium sepedonicum (Slechts de tekst in de Deense taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/318/CEE: Decisão da Comissão de 19 de Junho de 1986 que estabelece
    as alterações a introduzir, relativamente às batatas de semente, nas medidas
    adoptadas pela Dinamarca para se proteger contra a introdução de Corynebacterium
    sepedonicum (Apenas faz fé o texto em língua dinamarquesa)'
  type: main
- language: es
  script: Latn
  content: '86/318/CEE: Decisión de la Comisión de 19 de junio de 1986 por la que
    se establecen modificaciones, en lo relativo a las patatas de siembra, a las medidas
    adoptadas por Dinamarca para protegerse contra la introducción del Corynebacterium
    sepedonicum (El texto en lengua danesa es el único auténtico)'
