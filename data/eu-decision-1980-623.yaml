title:
- language: en
  script: Latn
  content: '80/623/EEC: Commission Decision of 11 June 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''Varian-NMR spectrometer, model EM 390, with variable
    temperature accessory, model EM 3940'' are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/623/CEE: Décision de la Commission, du 11 juin 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "Varian NMR spectrometer, model
    EM 390, with variable temperature accessory, model EM 3940" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/623/EWG: Entscheidung der Kommission vom 11. Juni 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,VARIAN-NMR Spectrometer, model EM 390, with
    variable temperature accessory, model EM 3940'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/623/EØF: Kommissionens beslutning af 11. juni 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "VARIAN - NMR Spectrometer, model EM 390, with variable
    temperature accessory, model EM 3940" ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/623/ΕΟΚ: Απόφαση τής Επιτροπής τής 11ης
    Ιουνίου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Varian—NMR spectrometer, model EM 390, with variable
    temperature accessory, model EM 3940» δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/623/CEE: Decisione della Commissione, dell'' 11 giugno 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Varian NMR spectrometer,
    model EM 390, with variable temperature accessory, model EM 3940" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/623/EEG: Beschikking van de Commissie van 11 juni 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat ,,VARIAN-NMR
    Spectrometer, model EM 390, with variable temperature accessory, model EM 3940''
    '' niet is voldaan'
