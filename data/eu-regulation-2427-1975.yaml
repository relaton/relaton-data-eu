type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2427/75 of the Commission of 24 September 1975 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, of cotton, falling within heading No ex 60.02, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2427/75 de la Commission, du 24 septembre 1975, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée, de coton, de la position tarifaire
    EX 60.02, originaire du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2427/75 der Kommission vom 24. September 1975 über
    die Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifnummer ex 60.02, mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2427/75 af 24. september 1975 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, af bomuld, under position ex 60.02, som har oprindelse
    i Pakistan og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2427/75 della Commissione, del 24 settembre 1975,
    che ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia
    non elastica né gommata, di cotone della voce doganale n. ex 60.02 originari
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2427/75 van de Commissie van 24 september 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van katoen van post ex 60.02, van oorsprong uit Pakistan, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3046/74
    van de Raad van 2 december 1974
  type: main
