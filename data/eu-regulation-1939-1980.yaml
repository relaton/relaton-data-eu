title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1939/80 of 18 July 1980 re-establishing
    the levying of customs duties on chlorides of barium, falling within subheading
    28.30 A II and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1939/80 de la Commission, du 18 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux chlorures
    de baryum, de la sous-position 28.30 A II du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1939/80 der Kommission vom 18. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Chloride des Bariums der Tarifstelle 28.30 A II, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1939/80 af 18. juli 1980 om genindførelse
    af opkrævning af toldafgifter for chlorider af barium, under pos. 28.30 A II,
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1939/80 della Commissione, del 18 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai cloruri di bario della
    sottovoce 28.30 A II della tariffa doganale comune, originari della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1939/80 van de Commissie van 18 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bariumchloride,
    van post 28.30 A II, van oorsprong uit China ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
