    168 bis della direttiva 2006/112/CE relativa al sistema comune d'imposta sul valore
    aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2018/2060 (2018. gada 20. decembris),
