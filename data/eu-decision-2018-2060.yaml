    στη Γερμανία να συνεχίσει να εφαρμόζει μέτρο
    παρέκκλισης από τα άρθρα 168 και 168α της οδηγίας
    2006/112/ΕΚ σχετικά με το κοινό σύστημα φόρου προστιθέμενης
    αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2018/2060, 20. detsember 2018, millega muudetakse
