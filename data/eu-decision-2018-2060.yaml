    да продължи да прилага мярка за дерогация от
    членове 168 и 168а от Директива 2006/112/ЕО относно
    общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2018/2060 ze dne 20. prosince 2018,
    kterým se mění rozhodnutí 2009/791/ES povolující Německu dále uplatňovat
    opatření odchylující se od článků 168 a 168a směrnice 2006/112/ES o společném
    systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2018/2060 af 20. december 2018 om
    ændring af beslutning 2009/791/EF med henblik på at give Tyskland tilladelse
    til fortsat at anvende en foranstaltning, der fraviger artikel 168 og 168a i direktiv
    2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/2060 του Συμβουλίου,
