title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2018/2060 of 20 December 2018 amending
    Decision 2009/791/EC authorising Germany to continue to apply a measure derogating
    from Articles 168 and 168a of Directive 2006/112/EC on the common system of value
    added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/2060 du Conseil du 20 décembre 2018 modifiant
    la décision 2009/791/CE autorisant l'Allemagne à proroger l'application d'une
    mesure dérogeant aux articles 168 et 168 bis de la directive 2006/112/CE relative
    au système commun de taxe sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/2060 des Rates vom 20. Dezember 2018
    zur Änderung der Entscheidung 2009/791/EG zur Ermächtigung Deutschlands, weiterhin
    eine von den Artikeln 168 und 168a der Richtlinie 2006/112/EG über das gemeinsame
    Mehrwertsteuersystem abweichende Regelung anzuwenden
  type: main
- language: bg
  script: Cyrl
