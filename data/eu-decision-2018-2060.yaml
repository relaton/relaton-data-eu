    taikyti priemonę, nukrypstančią nuo Direktyvos 2006/112/EB dėl pridėtinės
    vertės mokesčio bendros sistemos 168 ir 168a straipsnių nuostatų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kunsill (UE) 2018/2060 tal-20 ta'
    Diċembru 2018 li temenda d-Deċiżjoni 2009/791/KE li tawtorizza lill-Ġermanja
    biex tkompli tapplika miżura ta' deroga mill-Artikoli 168 u 168a tad-Direttiva
    2006/112/KE dwar is-sistema komuni ta' taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/2060 van de Raad van 20 december 2018 tot
    wijziging van Beschikking 2009/791/EG waarbij Duitsland wordt gemachtigd een maatregel
    te blijven toepassen die afwijkt van de artikelen 168 en 168 bis van Richtlijn
    2006/112/EG betreffende het gemeenschappelijke stelsel van belasting over de toegevoegde
    waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2018/2060 z dnia 20 grudnia 2018 r. zmieniająca
