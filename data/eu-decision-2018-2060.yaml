    millega tehakse erand direktiivi 2006/112/EÜ (mis käsitleb ühist käibemaksusüsteemi)
    artiklitest 168 ja 168a
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2018/2060, annettu 20 päivänä
    joulukuuta 2018, luvan antamisesta Saksalle jatkaa yhteisestä arvonlisäjärjestelmästä
    annetun direktiivin 2006/112/EY 168 ja 168 a artiklasta poikkeavan toimenpiteen
    soveltamista annetun päätöksen 2009/791/EY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2018/2060 od 20. prosinca 2018. o izmjeni
    Odluke 2009/791/EZ kojom se Njemačkoj odobrava nastavak primjene mjere kojom
    se odstupa od članaka 168. i 168.a Direktive 2006/112/EZ o zajedničkom sustavu
    poreza na dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2018/2060 végrehajtási határozata (2018. december 20.)
