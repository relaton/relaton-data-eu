    pasākumu, ar kuru atkāpjas no 168. panta un 168.a panta Direktīvā 2006/112/EK
    par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 20 d. Tarybos įgyvendinimo sprendimas (ES) 2018/2060,
