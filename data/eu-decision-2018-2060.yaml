    odstępstwo od art. 168 i 168a dyrektywy 2006/112/WE w sprawie wspólnego systemu
    podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/2060 do Conselho, de 20 de dezembro de
    2018, que altera a Decisão 2009/791/CE que autoriza a Alemanha a continuar a
    aplicar uma medida em derrogação aos artigos 168.° e 168.°-A da Diretiva 2006/112/CE
    relativa ao sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/2060 a Consiliului din 20 decembrie
    2018 de modificare a Deciziei 2009/791/CE de autorizare a Germaniei să aplice
    în continuare o măsură de derogare de la articolele 168 și 168a din Directiva
    2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2018/2060 z 20. decembra 2018, ktorým
    sa mení rozhodnutie 2009/791/ES, ktorým sa Nemecku povoľuje naďalej uplatňovať
    opatrenie odchyľujúce sa od článkov 168 a 168a smernice 2006/112/ES o spoločnom
    systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2018/2060 z dne 20. decembra 2018 o spremembi
    Odločbe 2009/791/ES o dovoljenju Nemčiji, da še naprej uporablja ukrep, ki
    odstopa od členov 168 in 168a Direktive 2006/112/ES o skupnem sistemu davka na
    dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/2060 del Consejo, de 20 de diciembre
    de 2018, que modifica la Decisión 2009/791/CE por la que se autoriza a la República
    Federal de Alemania a seguir aplicando una medida de excepción a lo dispuesto
    en los artículos 168 y 168 bis de la Directiva 2006/112/CE, relativa al sistema
    común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2018/2060 av den 20 december 2018 om ändring
    av beslut 2009/791/EG om bemyndigande för Förbundsrepubliken Tyskland att fortsatt
