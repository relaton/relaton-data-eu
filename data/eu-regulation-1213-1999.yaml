title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1213/1999 of 11 June 1999 deciding not to
    accept tenders submitted in response to the 224th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1213/1999 de la Commission, du 11 juin 1999, disposant
    de ne pas donner suite aux offres déposées à la suite de la 224e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1213/1999 der Kommission vom 11. Juni 1999 über den
    Beschluß, den zur 224. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1213/1999 af 11. juni 1999 om ikke at
    tage den 224. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1213/1999 της Επιτροπής,
    της 11ης Ιουνίου 1999, για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για το 224ο μερικό
    διαγωνισμό που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1213/1999, annettu 11 päivänä kesäkuuta 1999,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun 224. osittaisen tarjouskilpailun ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1213/1999 della Commissione, dell'11 giugno 1999, che
    decide di non dar seguito alle offerte presentate per la 224a gara parziale effettuata
    nel quadro delle misure generali d'intervento conformemente al regolamento (CEE)
    n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1213/1999 van de Commissie van 11 juni 1999 houdende
    het besluit om geen gevolg te geven aan de offertes in het kader van de 224e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1213/1999 da Comissão, de 11 de Junho de 1999, que
    rejeita as propostas apresentadas na sequência do ducentésimo vigésimo quarto
    concurso parcial efectuado no âmbito das medidas gerais de intervenção, em
    conformidade com o Regulamento (CEE) n° 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1213/1999 de la Comisión, de 11 de junio de 1999,
    por el que se decide no dar curso a las ofertas presentadas para la 224a licitación
    parcial efectuada en el marco de las medidas generales de intervención en virtud
    del Reglamento (CEE) n° 1627/89
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1213/1999 av den 11 juni 1999 om att
    inte fullfölja det tvåhundratjugofjärde delanbudsförfarandet som inletts som
    en allmän interventionsåtgärd i enlighet med förordning (EEG) nr 1627/89
  type: main
