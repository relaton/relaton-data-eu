title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/1075 of 23 March 2016 supplementing
    Directive 2014/59/EU of the European Parltime and of the Council with regard to
    regulatory technical standards specifying the content of recovery plans, resolution
    plans and group resolution plans, the minimum criteria that the competent authority
    is to assess as regards recovery plans and group recovery plans, the conditions
    for group financial support, the requirements for independent valuers, the contractual
    recognition of write-down and conversion powers, the procedures and contents of
    notification requirements and of notice of suspension and the operational functioning
    of the resolution colleges
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/1075 de la Commission du 23 mars 2016 complétant
    la directive 2014/59/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation précisant le contenu des plans de redressement, des plans
    de résolution et des plans de résolution de groupe, les critères minimaux que
    l'autorité compétente doit prendre en compte pour évaluer les plans de redressement
    et les plans de redressement de groupe, les conditions préalables à un soutien
    financier de groupe, les exigences relatives à l'indépendance des évaluateurs,
    les conditions de la reconnaissance contractuelle des pouvoirs de dépréciation
    et de conversion, les exigences de procédure et de contenu concernant les notifications
    et l'avis de suspension ainsi que le fonctionnement des collèges d'autorités
    de résolution
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/1075 der Kommission vom 23. März 2016
    zur Ergänzung der Richtlinie 2014/59/EU des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards, in denen der Inhalt von Sanierungsplänen,
    Abwicklungsplänen und Gruppenabwicklungsplänen, die Mindestkriterien, anhand
    deren die zuständige Behörde Sanierungs- und Gruppensanierungspläne zu bewerten
    hat, die Voraussetzungen für gruppeninterne finanzielle Unterstützung, die Anforderungen
    an die Unabhängigkeit der Bewerter, die vertragliche Anerkennung von Herabschreibungs-
    und Umwandlungsbefugnissen, die Verfahren und Inhalte von Mitteilungen und Aussetzungsbekanntmachungen
    und die konkrete Arbeitsweise der Abwicklungskollegien festgelegt wird
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2016/1075 на Комисията
    от 23 март 2016 година за допълнение на Директива
    2014/59/ЕС на Европейския парламент и на Съвета
    чрез регулаторни технически стандарти за определяне
    на съдържанието на плановете за възстановяване,
    плановете за преструктуриране и плановете
    за преструктуриране на група, минималните
    критерии, по които компетентният орган трябва
    да оценява плановете за преструктуриране и
    плановете за преструктуриране на група, условията
    за вътрешногрупова финансова подкрепа, изискванията
    към независимите оценители, договорното признаване
    на правомощията за обезценяване и преобразуване,
    изискванията за процедурите за уведомяване
    и съдържанието на уведомленията и съобщението
    за спиране, както и оперативното функциониране
    на колегиите за преструктуриране
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2016/1075 ze dne 23. března
    2016, kterým se doplňuje směrnice Evropského parlamentu a Rady 2014/59/EU,
    pokud jde o regulační technické normy upřesňující obsah ozdravných plánů,
    plánů řešení krize a skupinových plánů řešení krize, minimální kritéria,
    která má příslušný orgán posoudit v souvislosti s ozdravnými plány a
    skupinovými ozdravnými plány, podmínky vnitroskupinové finanční podpory,
    požadavky na nezávislé odhadce, smluvní uznání pravomoci k odpisu a konverzi,
    postupy a obsah požadavků na oznamování a oznámení o pozastavení, jakož
    i běžné fungování kolegií k řešení krize
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/1075 af 23. marts 2016 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2014/59/EU for
    så vidt angår reguleringsmæssige tekniske standarder om indholdet af genopretningsplaner,
    afviklingsplaner og koncernafviklingsplaner, de minimumskriterier, som den kompetente
    myndighed skal vurdere i forbindelse med genopretningsplaner og koncerngenopretningsplaner,
    betingelserne for koncernintern finansiel støtte, kravene vedrørende uafhængige
    valuarer, den kontraktmæssige anerkendelse af nedskrivnings- og konverteringsbeføjelser,
    procedurerne og indholdet i forbindelse med underretningskrav og meddelelsen om
    suspension samt afviklingskollegiernes virkemåde i praksis
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) 2016/1075
    της Επιτροπής, της 23ης Μαρτίου 2016, για τη συμπλήρωση
    της οδηγίας 2014/59/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου σχετικά με τα ρυθμιστικά
    τεχνικά πρότυπα για τον καθορισμό του περιεχομένου
    των σχεδίων ανάκαμψης, των σχεδίων εξυγίανσης
    και των σχεδίων εξυγίανσης ομίλων, των ελάχιστων
    κριτηρίων που πρέπει να αξιολογεί η αρμόδια
    αρχή όσον αφορά τα σχέδια ανάκαμψης και τα
    σχέδια ανάκαμψης ομίλων, των προϋποθέσεων
    για τη χρηματοπιστωτική στήριξη ομίλου, των
    απαιτήσεων για τους ανεξάρτητους εκτιμητές,
    της συμβατικής αναγνώρισης των εξουσιών απομείωσης
    και μετατροπής, των διαδικασιών και του περιεχομένου
    των απαιτήσεων κοινοποίησης και της ειδοποίησης
    αναστολής, καθώς και του τρόπου λειτουργίας
    των σωμάτων εξυγίανσης
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2016/1075, 23. märts 2016, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi 2014/59/EL seoses regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks finantsseisundi taastamise
    kavade, kriisilahenduse kavade ja konsolideerimisgrupi kriisilahenduse kavade
    sisu, miinimumkriteeriumid, mille alusel peab pädev asutus finantsseisundi taastamise
    kavu ja konsolideerimisgrupi finantsseisundi taastamise kavu hindama, konsolideerimisgrupi
    finantstoetuse andmise tingimused, sõltumatute hindajate suhtes kohaldatavad
    nõuded, allahindamise ja konverteerimise õiguse lepingukohane tunnustamine,
    teavitamisnõuete ja peatamisteate menetlused ja sisu ning kriisilahenduse kolleegiumide
    tegevus
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2016/1075, annettu 23 päivänä maaliskuuta
    2016, Euroopan parlamentin ja neuvoston direktiivin 2014/59/EU täydentämisestä
    teknisillä sääntelystandardeilla, joissa määritellään elvytyssuunnitelmien,
    kriisinratkaisusuunnitelmien ja konsernien kriisinratkaisusuunnitelmien sisältö,
    vähimmäisperusteet, jotka toimivaltaisen viranomaisen on arvioitava elvytyssuunnitelmien
    ja konsernien elvytyssuunnitelmien osalta, konsernin rahoitustuen edellytykset,
    riippumattomia arvioijia koskevat vaatimukset, alaskirjaus- ja muuntamisvaltuuksien
    tunnustaminen sopimuksissa, ilmoitusvaatimuksiin ja keskeyttämisilmoitukseen
    liittyvät menettelyt ja sisältö ja kriisinratkaisukollegioiden operatiivinen
    toiminta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/1075 оd 23. ožujka 2016. o dopuni
    Direktive 2014/59/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se pobliže određuju sadržaj planova oporavka, planova sanacije
    i planova sanacije grupe, minimalni kriteriji koje nadležno tijelo treba procijeniti
    u pogledu planova oporavka i planova oporavka grupe, uvjeti za financijsku potporu
    grupe, zahtjevi za neovisne procjenitelje, ugovorno priznavanje ovlasti otpisa
    i konverzije, postupci i sadržaj zahtjeva u pogledu obavješćivanja i obavijesti
    o suspenziji te operativno funkcioniranje sanacijskih kolegija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1075 felhatalmazáson alapuló rendelete (2016.
    március 23.) a 2014/59/EU európai parlamenti és tanácsi irányelvnek a helyreállítási
    tervek, szanálási tervek és csoportszintű szanálási tervek tartalmát, az
    illetékes hatóság által a helyreállítási tervek és csoportszintű helyreállítási
    tervek tekintetében értékelendő minimumkövetelményeket, a csoporton belüli
    pénzügyi támogatás feltételeit, a független értékelőkre vonatkozó követelményeket,
    a leírási és átalakítási hatáskörök szerződéses elismerését, az értesítési
    követelmények és a felfüggesztésre vonatkozó közlemény eljárásait és
    tartalmát, valamint a szanálási kollégiumok operatív működését meghatározó
    szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2016/1075 della Commissione, del 23 marzo 2016,
    che integra la direttiva 2014/59/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che precisano il contenuto
    dei piani di risanamento, dei piani di risoluzione e dei piani di risoluzione
    di gruppo, i criteri minimi che l'autorità competente deve valutare per quanto
    riguarda i piani di risanamento e i piani di risanamento di gruppo, le condizioni
    per il sostegno finanziario di gruppo, i requisiti per i periti indipendenti,
    il riconoscimento contrattuale dei poteri di svalutazione e di conversione, le
    procedure e il contenuto delle disposizioni in materia di notifica e dell'avviso
    di sospensione e il funzionamento operativo dei collegi di risoluzione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2016/1075 (2016. gada 23. marts), ar
    ko papildina Eiropas Parlamenta un Padomes Direktīvu 2014/59/ES attiecībā uz
    regulatīvajiem tehniskajiem standartiem, ar kuriem precizē atveseļošanas plānu,
    noregulējuma plānu un grupas noregulējuma plānu saturu, minimālos kritērijus,
    kas kompetentajai iestādei ir jānovērtē attiecībā uz atveseļošanas plāniem
    un grupas atveseļošanas plāniem, nosacījumus grupas finansiālajam atbalstam,
    prasības neatkarīgiem vērtētājiem, norakstīšanas un konvertācijas pilnvaru
    līgumisku atzīšanu, paziņošanas prasību un apturēšanas paziņojuma procedūras
    un saturu un noregulējuma kolēģiju operatīvās funkcijas
  type: main
- language: lt
  script: Latn
  content: 2016 m. kovo 23 d. Komisijos deleguotasis reglamentas (ES) 2016/1075, kuriuo
    papildoma Europos Parlamento ir Tarybos direktyva 2014/59/ES dėl techninių reguliavimo
    standartų, kuriais nustatomas gaivinimo planų, pertvarkymo planų ir grupių
    pertvarkymo planų turinys, minimalūs kriterijai, kuriuos kompetentinga institucija
    turi įvertinti nagrinėdama gaivinimo planus ir grupių gaivinimo planus, grupių
    finansinės paramos sąlygos, reikalavimai nepriklausomiems vertintojams, nurašymo
    ir konvertavimo įgaliojimų pripažinimas sutartyse, pranešimo reikalavimų
    ir pranešimo apie sustabdymą procedūros bei turinys ir pertvarkymo kolegijų
    veiklos funkcijos
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2016/1075 tat-23 ta' Marzu 2016
    li jissupplimenta d-Direttiva 2014/59/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta' standards tekniċi regolatorji li jispeċifikaw il-kontenut tal-pjanijiet
    ta' rkupru, il-pjanijiet ta' riżoluzzjoni u l-pjanijiet ta' riżoluzzjoni tal-grupp,
    il-kriterji minimi li l-awtorità kompetenti trid tivvaluta fir-rigward tal-pjanijiet
    ta' rkupru u l-pjanijiet ta' rkupru tal-grupp, il-kundizzjonijiet għall-appoġġ
    finanzjarju tal-grupp, ir-rekwiżiti għall-valutaturi indipendenti, ir-rikonoxximent
    kuntrattwali tas-setgħat ta' valwazzjoni negattiva u konverżjoni u l-avviż
    tas-sospensjoni u l-funzjonament operattivi tal-kulleġġi ta' riżoluzzjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2016/1075 van de Commissie van 23 maart 2016
    houdende aanvulling van Richtlijn 2014/59/EU van het Europees Parlement en de
    Raad met betrekking tot technische reguleringsnormen ter specificatie van de inhoud
    van herstelplannen, afwikkelingsplannen en groepsafwikkelingsplannen, de minimumcriteria
    die de bevoegde autoriteiten moeten beoordelen met betrekking tot herstelplannen
    en groepsherstelplannen, de voorwaarden voor financiële steun binnen de groep,
    de voorwaarden voor onafhankelijke taxateurs, de contractuele erkenning van afschrijvings-
    en omzettingsbevoegdheden, de procedures en de inhoud van de kennisgevingsvereisten
    en van de kennisgeving van opschorting en de operationele werking van de afwikkelingscolleges
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2016/1075 z dnia 23 marca 2016
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2014/59/UE w odniesieniu
    do regulacyjnych standardów technicznych określających treść planów naprawy,
    planów restrukturyzacji i uporządkowanej likwidacji oraz grupowych planów restrukturyzacji
    i uporządkowanej likwidacji, minimalne kryteria, które właściwy organ ma poddać
    ocenie w odniesieniu do planów naprawy i grupowych planów naprawy, warunki udzielenia
    wsparcia finansowego w ramach grupy, wymagania wobec niezależnych rzeczoznawców,
    umowne uznanie uprawnień do umorzenia i konwersji, procedury i treść wymogów
    dotyczących powiadomienia i obwieszczenia o zawieszeniu oraz sposób funkcjonowania
    kolegiów ds. restrukturyzacji i uporządkowanej likwidacji
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2016/1075 da Comissão, de 23 de março de 2016,
    que complementa a Diretiva 2014/59/UE do Parlamento Europeu e do Conselho no que
    respeita às normas técnicas de regulamentação que especificam o conteúdo
    dos planos de recuperação, dos planos de resolução e dos planos de resolução
    de grupos, os critérios mínimos que as autoridades competentes devem avaliar
    no que respeita aos planos de recuperação e aos planos de recuperação de grupos,
    as condições para a prestação de apoio financeiro intragrupo, os requisitos
    para os avaliadores independentes, o reconhecimento contratual dos poderes de
    redução e de conversão, os procedimentos e teor dos requisitos de notificação
    e de aviso de suspensão e o funcionamento operacional dos colégios de resolução
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2016/1075 al Comisiei din 23 martie 2016 de completare
    a Directivei 2014/59/UE a Parlamentului European și a Consiliului cu privire
    la standardele tehnice de reglementare care precizează conținutul planurilor
    de redresare, al planurilor de rezoluție și al planurilor de rezoluție a grupului,
    criteriile minime pe care autoritatea competentă trebuie să le examineze în
    ceea ce privește planurile de redresare și planurile de redresare a grupului,
    condițiile de acordare a sprijinului financiar intragrup, cerințele privind
    evaluatorii independenți, recunoașterea contractuală a competențelor de reducere
    a valorii contabile și de conversie, procedurile și conținutul cerințelor
    de notificare și ale avizului de suspendare și funcționarea operațională
    a colegiilor de rezoluție
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2016/1075 z 23. marca 2016, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2014/59/EÚ, pokiaľ ide o
    regulačné technické predpisy, ktorými sa stanovuje obsah plánov ozdravenia,
    plánov riešenia krízových situácií a plánov riešenia krízových situácií
    na úrovni skupiny, minimálne kritériá, ktoré príslušný orgán posúdi,
    pokiaľ ide o plány ozdravenia a plány ozdravenia na úrovni skupiny, podmienky
    pre finančnú podporu v rámci skupiny, požiadavky na nezávislých odhadcov,
    zmluvné uznanie právomoci odpísať dlh a právomoci vykonať jeho konverziu,
    postupy oznamovania a obsah požiadaviek na oznamovanie, obsah oznámenia o pozastavení
    a prevádzkové fungovanie kolégií pre riešenie krízových situácií
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/1075 z dne 23. marca 2016 o dopolnitvi
    Direktive 2014/59/EU Evropskega parlamenta in Sveta glede regulativnih tehničnih
    standardov, ki določajo vsebino načrtov sanacije, načrtov reševanja in načrtov
    reševanja skupine, minimalna merila, ki naj bi jih pristojni organ ocenil v zvezi
    z načrti sanacije in načrti sanacije skupine, pogoje za finančno podporo v
    skupini, zahteve o neodvisnih ocenjevalcih vrednosti, pogodbeno priznavanje pooblastil
    za odpis in konverzijo, postopke in vsebino zahtev v zvezi z obveščanjem in
    obvestilom o mirovanju ter operativno delovanje kolegijev za reševanje
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2016/1075 de la Comisión, de 23 de marzo de 2016,
    que completa la Directiva 2014/59/UE del Parlamento Europeo y del Consejo en lo
    relativo a las normas técnicas de regulación que especifican el contenido de
    los planes de reestructuración, los planes de resolución y los planes de resolución
    de grupos, los criterios mínimos que la autoridad competente debe evaluar en
    lo que respecta a los planes de reestructuración y planes de reestructuración
    de grupos, las condiciones para la ayuda financiera de grupo, los requisitos relativos
    a los valoradores independientes, el reconocimiento contractual de las competencias
    de amortización y de conversión, el procedimiento en relación con los requisitos
    de notificación y el anuncio de suspensión y el contenido de los mismos, y el
    funcionamiento operativo de los colegios de autoridades de resolución
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2016/1075 av den 23 mars 2016
    om komplettering av Europaparlamentets och rådets direktiv 2014/59/EU med avseende
    på tekniska standarder för tillsyn som specificerar innehållet i återhämtningsplaner,
    resolutionsplaner och koncernresolutionsplaner, de minimikriterier som den behöriga
    myndigheten ska bedöma när det gäller återhämtningsplaner och koncernåterhämtningsplaner,
    villkoren för finansiellt stöd inom koncerner, kraven på oberoende värderingsmän,
    avtalsenligt erkännande av nedskrivnings- och konverteringsbefogenheter, förfarandena
    och innehållet för anmälningskrav och underrättelse om uppskjutande samt resolutionskollegiernas
    operativa funktionssätt
