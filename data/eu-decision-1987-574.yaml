    του συμπληρώματος κοινοτικών αδειών για το
    1988, το οποίο προκύπτει από την ετήσια αύξηση
    κατά 15 % της κοινοτικής ποσόστωσης για τις οδικές
    εμπορευματικές μεταφορές'
  type: main
- language: it
  script: Latn
  content: '87/574/CEE: Decisione della Commissione del 6 ottobre 1987 che fissa l''
