    il 1988 derivante dall'' aumento annuo del 15 % del contingente comunitario per
    il trasporto di merci su strada'
  type: main
- language: nl
  script: Latn
  content: '87/574/EEG: Beschikking van de Commissie van 6 oktober 1987 houdende de
    toewijzing aan de Lid-Staten van extra communautaire vergunningen voor het jaar
