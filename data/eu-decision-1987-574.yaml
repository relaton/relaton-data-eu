  script: Latn
  content: '87/574/EEC: Commission Decision of 6 October 1987 allocating among the
    Member States the additional Community authorizations resulting from the 15 %
    annual increase in the Community quota for the carriage of goods by road for 1988'
  type: main
- language: fr
  script: Latn
  content: '87/574/CEE: Décision de la Commission du 6 octobre 1987 fixant l'' attribution
    aux États membres du supplément d'' autorisations communautaires pour l'' année
    1988 résultant de l'' augmentation annuelle de 15 % du contingent communautaire
    concernant les transports de marchandises par route'
  type: main
- language: de
  script: Latn
  content: '87/574/EWG: Entscheidung der Kommission vom 6. Oktober 1987 über die
    Zuweisung zusätzlicher Gemeinschaftsgenehmigungen an die Mitgliedstaaten für
    das Jahr 1988 im Rahmen der jährlichen Erhöhung des Gemeinschaftskontingents
    für den Güterkraftverkehr um 15 %'
  type: main
- language: da
  script: Latn
  content: '87/574/EØF: Kommissionens beslutning af 6. oktober 1987 om tildeling
    af yderligere tilladelser til medlemsstaterne som følge af den årlige forhøjelse
    af fællesskabskontingentet på 15 % for vejgodstransport i 1988'
  type: main
- language: el
  script: Grek
  content: '87/574/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Οκτωβρίου
