    e a Federação Russa que prorroga o sistema de duplo controlo sem limites quantitativos
    aplicável à exportação de certos produtos siderúrgicos abrangidos pelos Tratados
    CECA e CE da Federação Russa para a Comunidade Europeia durante o período compreendido
    entre 1 de Janeiro de 2000 e 31 de Dezembro de 2001'
  type: main
- language: es
  script: Latn
  content: '2000/294/CE: Decisión del Consejo, de 14 de febrero de 2000, relativa
    a la celebración de un Acuerdo en forma de Canje de Notas entre la Comunidad
    Europea y la Federación de Rusia, por el que se prorroga el sistema de doble
    control sin límites cuantitativos con respecto a las exportaciones de determinados
    productos siderúrgicos, incluidos en los Tratados CE y CECA, de la Federación
    de Rusia a la Comunidad Europea en el período comprendido entre el 1 de enero
    de 2000 y el 31 de diciembre de 2001'
  type: main
- language: sv
  script: Latn
  content: '2000/294/EG: Rådets beslut av den 14 februari 2000 om ingående av ett
    avtal genom skriftväxling mellan Europeiska gemenskapen och Ryska federationen
    om förlängning av giltighetstiden för systemet med dubbelkontroll utan kvantitativa
    begränsningar med avseende på export från Ryska federationen till Europeiska
    gemenskapen av vissa stålprodukter som omfattas av EG- och EKSG-fördragen till
    att omfatta perioden 1 januari 2000-31 december 2001'
