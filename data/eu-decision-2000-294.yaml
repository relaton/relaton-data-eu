title:
- language: en
  script: Latn
  content: '2000/294/EC: Council Decision of 14 February 2000 on the conclusion of
    an Agreement in the form of an Exchange of Letters between the European Community
    and the Russian Federation extending the double-checking system without quantitative
    limits in respect of the export of certain steel products covered by the EC and
    ECSC Treaties from the Russian Federation to the European Community for the period
    from 1 January 2000 to 31 December 2001'
  type: main
- language: fr
  script: Latn
  content: '2000/294/CE: Décision du Conseil, du 14 février 2000, relative à la
    conclusion d''un accord sous forme d''échange de lettres entre la Communauté
    européenne et la Fédération russe prorogeant pour la période allant du 1er
    janvier 2000 au 31 décembre 2001 le système de double contrôle sans limite
    quantitative à l''exportation de certains produits sidérurgiques couverts par
    les traités CE et CECA de la Fédération russe dans la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '2000/294/EG: Beschluß des Rates vom 14. Februar 2000 über den Abschluß
    eines Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
    und der Russischen Föderation über die Verlängerung des Systems doppelter Kontrolle
    ohne Höchstmengen für die Ausfuhr bestimmter unter den EG- und den EGKS-Vertrag
    fallender Stahlerzeugnisse aus der Russischen Föderation in die Europäische
    Gemeinschaft für den Zeitraum vom 1. Januar 2000 bis 31. Dezember 2001'
  type: main
- language: da
  script: Latn
  content: '2000/294/EF: Rådets afgørelse af 14. februar 2000 om indgåelse af en
    aftale i form af brevveksling mellem Det Europæiske Fællesskab og Den Russiske
    Føderation om forlængelse af ordningen med dobbeltkontrol uden kvantitative
    lofter i forbindelse med udførsel fra Den Russiske Føderation til Det Europæiske
    Fællesskab af visse stålprodukter, der er omfattet af EF-traktaten og EKSF-traktaten,
    for perioden 1. januar 2000 til 31. december 2001'
  type: main
- language: el
  script: Grek
  content: '2000/294/ΕΚ: Απόφαση του Συμβουλίου, της 14ης
    Φεβρουαρίου 2000, σχετικά με τη σύναψη συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Κοινότητας και της Ρωσικής Ομοσπονδίας
    για την παράταση του συστήματος διπλού ελέγχου
    χωρίς ποσοτικά όρια όσον αφορά την εξαγωγή
    ορισμένων προϊόντων χάλυβα, καλυπτόμενων από
    τις συνθήκες ΕΚ και ΕΚΑΧ, από τη Ρωσική Ομοσπονδία
    προς την Ευρωπαϊκή Κοινότητα για το χρονικό
    διάστημα από 1ης Ιανουαρίου 2000 έως 31 Δεκεμβρίου
    2001'
  type: main
- language: fi
  script: Latn
  content: '2000/294/EY: Neuvoston päätös, tehty 14 päivänä helmikuuta 2000,
    Euroopan yhteisön ja Venäjän federaation välisen sopimuksen tekemisestä kirjeenvaihtona
    kaksinkertaisen tarkkailun järjestelmän soveltamisen jatkamisesta ilman määrällisiä
    rajoituksia 1 päivän tammikuuta 2000 ja 31 päivän joulukuuta 2001 väliseksi
    ajaksi Euroopan yhteisön ja Euroopan hiili- ja teräsyhteisön perustamissopimusten
    alaan kuuluvien tiettyjen terästuotteiden Venäjän federaatiosta Euroopan yhteisöön
    tapahtuvaan vientiin'
  type: main
- language: it
  script: Latn
  content: '2000/294/CE: Decisione del Consiglio, del 14 febbraio 2000, relativa alla
    conclusione di un accordo in forma di scambio di lettere tra la Comunità europea
    e la Federazione russa che proroga per il periodo compreso tra il 1o gennaio 2000
    e il 31 dicembre 2001 il sistema di duplice controllo senza limiti quantitativi
    per le esportazioni di taluni prodotti di acciaio contemplati dai trattati CE
    e CECA dalla Federazione russa nella Comunità europea'
  type: main
- language: nl
  script: Latn
  content: '2000/294/EG: Besluit van de Raad van 14 februari 2000 betreffende de sluiting
    van een overeenkomst in de vorm van een briefwisseling tussen de Europese Gemeenschap
    en de Russische Federatie tot verlenging van het systeem voor dubbele controle
    zonder kwantitatieve beperkingen voor de uitvoer van bepaalde onder het EG-Verdrag
    en het EGKS-Verdrag vallende ijzer- en staalproducten uit de Russische Federatie
    naar de Europese Gemeenschap voor de periode van 1 januari 2000 tot en met 31
    december 2001'
  type: main
- language: pt
  script: Latn
  content: '2000/294/CE: Decisão do Conselho, de 14 de Fevereiro de 2000, relativa
