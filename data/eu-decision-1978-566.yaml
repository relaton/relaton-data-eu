id: EUDecision1978566
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 June 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' woven overcoats, raincoats and
    other coats, cloaks and capes, other than those of category 14A, of wool, of cotton
    or of man-made textile fibres, falling within heading No ex 61.01 (NIMEXE code
    61.01-41; 42; 44; 46; 47) of the Common Customs Tariff, originating in South Korea
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/566/CEE: Décision de la Commission, du 21 juin 1978, autorisant la
    République française à exclure du traitement communautaire les pardessus, imperméables
    et autres manteaux, y compris les capes, tissés, pour hommes et garçonnets,
    autres que ceux de la catégorie 14A, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la position Ex 61.01 du Tarif douanier commun
    (codes Nimexe : 61.01-41, 42, 44, 46, 47), originaires de Corée du Sud et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Juni 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel und Umhänge aus Geweben für Männer und
    Knaben, andere als Waren der Kategorie 14A, aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 61.01-41; 42; 44; 46; 47) von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. juni 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage frakker, kapper og slag, vævede,
    bortset fra varer under kategori 14 A, til mænd og drenge, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 61.01 (NIMEXE-kode
    61.01-41, 42, 44, 46, 47) i den fælles toldtarif, har oprindelse i Sydkorea og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 21 giugno 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli,
    e simili, tessuti, per uomo e per ragazzo, diversi da quelli della categoria 14
    A, di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex
    61.01 della tariffa doganale comune (codice Nimexe: 61.01-41; 42; 44; 46; 47),
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 juni 1978 waarbij de Franse Republiek
    wordt gemachtigd overjassen, regenjassen en andere jassen, capes voor heren en
    jongens, andere dan die van categorie 14 A van wol, katoen of van synthetische
    of van kunstmatige textielvezels van post ex 61.01 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-41, 42, 44, 46, 47), van oorsprong uit Zuid-Korea en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
