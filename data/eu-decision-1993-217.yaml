title:
- language: en
  script: Latn
  content: '93/217/EEC: Commission Decision of 19 March 1993 in accordance with Council
    Decision 93/16/EEC determining the United States of America as a country to the
    companies or other legal persons of which legal protection of topographies of
    semiconductor products is extended'
  type: main
- language: fr
  script: Latn
  content: '93/217/CEE: Décision de la Commission, du 19 mars 1993, prise conformément
    à la décision 93/16/CEE du Conseil et reconnaissant les Etats-Unis d'' Amérique
    comme pays dont les sociétés ou autres personnes morales bénéficient de la
    protection des topographies de produits semi-conducteurs'
  type: main
- language: de
  script: Latn
  content: '93/217/EWG: Entscheidung der Kommission vom 19. März 1993 gemäß der
    Entscheidung 93/16/EWG des Rates zur Bestimmung der Vereinigten Staaten von Amerika
    als Land, auf deren Unternehmen oder sonstige juristische Personen der Rechtsschutz
    für Topographien von Halbleitererzeugnissen ausgedehnt wird'
  type: main
- language: da
  script: Latn
  content: '93/217/EØF: Kommissionens beslutning af 19. marts 1993 i henhold til
    Rådets beslutning 93/16/EØF om udvidelse af den retlige beskyttelse af halvlederprodukters
    topografi til at omfatte selskaber og andre juridiske personer fra Amerikas Forenede
    Stater'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 19ης Μαρτίου 1993
    σύμφωνα με την απόφαση 93/16/ΕΟΚ του Συμβουλίου
    για τον καθορισμό των Ηνωμένων Πολιτειών της
    Αμερικής ως χώρας στις εταιρείες ή τα άλλα
    νομικά πρόσωπα της οποίας επεκτείνεται η νομική
    προστασία των τοπογραφιών προϊόντων ημιαγωγών
  type: main
- language: fi
  script: Latn
  content: '93/217/ETY: Komission päätös, tehty 19 päivänä maaliskuuta 1993,
