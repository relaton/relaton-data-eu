  content: '83/590/EEC: Commission Decision of 24 November 1983 establishing that
    the apparatus described as ''CME - Electromagnetic Blood Flowmeter Cliniflow,
    model 601D, with accessories'' may not be imported free of Common Customs Tariff
    duties'
  type: main
- language: fr
  script: Latn
  content: '83/590/CEE: Décision de la Commission du 24 novembre 1983 constatant
    que l''importation de l''appareil dénommé "CME - Electromagnetic Blood Flowmeter
    Cliniflow, model 601D, with accessories" ne peut être faite en franchise des
    droits du tarif douanier commun'
