    der Unterpositionen 2939 21 10, 2939 21 90 und 2939 29 00 der Kombinierten Nomenklatur
    mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3635/87 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2273/88 af 25. juli 1988 om genindførelse
