title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2273/88 of 25 July 1988 re-establishing
    the levying of customs duties on alcaloids of cinchona and their derivatives;
    salts thereof CN codes 2939 21 10, 2939 21 90 and 2939 29 00 originating in Indonesia
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2273/88 de la Commission du 25 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables aux alcaloïdes
    du quinquina et leurs dérivés, et sels de ces produits, des codes 2939 21 10,
    2939 21 90 et 2939 29 00 de la nomenclature combinée, originaires d' Indonésie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3635/87 du Conseil
  type: main
