title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 902/93 of 16 April 1993 not to accept tenders
    submitted in response to the third partial invitation to tender opened as a special
    intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 902/93 de la Commission, du 16 avril 1993, de ne pas
    donner suite aux offres déposées à la suite de la troisième adjudication partielle
    effectuée dans le cadre des mesures spéciales d'intervention conformément au
    règlement (CEE) n 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 902/93 der Kommission vom 16. April 1993 den Angeboten,
    die aufgrund der dritten Teilausschreibung im Rahmen der mit der Verordnung (EWG)
    Nr. 1627/89 eingeführten besonderen Interventionsmaßnahmen eingereicht wurden,
    nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 902/93 af 16. april 1993 om ikke at
    tage den tredje dellicitation i forbindelse med de særlige interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 902/93 της Επιτροπής
    της 16ης Απριλίου 1993 για να μη δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον τρίτο
    μερικό διαγωνισμό που πραγματοποιείται στο
    πλαίσιο των ειδικών μέτρων παρεμβάσεως σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 902/93 della Commissione, del 16 aprile 1993, di non
    dare seguito alle offerte presentate per la terza gara parziale effettuata nel
    quadro delle misure speciali di intervento a norma del regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 902/93 van de Commissie van 16 april 1993 waarbij
    geen gevolg wordt gegeven aan de offertes voor de derde deelinschrijving die overeenkomstig
    Verordening (EEG) nr. 1627/89 in het kader van de speciale interventiemaatregelen
    is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 902/93 da Comissão, de 16 de Abril de 1993, que
    rejeita as propostas apresentadas na sequência do terceiro concurso parcial realizado
    no âmbito das medidas especiais de intervenção em conformidade com o Regulamento
    (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 902/93 de la Comisión, de 16 de abril de 1993, de no
    dar curso a las ofertas presentadas para la tercera licitación parcial efectuada
    en el marco de las medidas especiales de intervención con arreglo al Reglamento
    (CEE) n 1627/89
  type: main
