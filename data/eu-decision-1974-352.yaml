    certaines mesures de sauvegarde au titre de l'article 108 paragraphe 3 du Traité
    CEE
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Juli 1974 zur Aufhebung der Kommissionsentscheidung
    vom 12. Juni 1974 über die Abänderung der Kommissionsentscheidung vom 8. Mai
    1974, mit der die Italienische Republik ermächtigt wurde, bestimmte Schutzmaßnahmen
    im Sinne von Artikel 108 Absatz 3 des Vertrages zu treffen
  type: main
