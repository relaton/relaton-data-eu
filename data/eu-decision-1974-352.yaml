  content: Commission Decision of 3 July 1974 revoking the Commission Decision of
    12 June 1974 amending the Commission Decision of 8 May 1974 whereby the Italian
    Republic was authorized to take certain safeguard measures under Article 108 (3)
    of the EEC Treaty
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 juillet 1974, abrogeant la décision de
