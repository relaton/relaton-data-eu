title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 mars 1967, portant octroi du concours
    du Fonds social européen au bénéfice du Grand-Duché de Luxembourg pour des
    dépenses relatives à des opérations de rééducation professionnelle effectuées
    par l'Office de placement et de rééducation professionnelle des travailleurs
    handicapés
  type: main
- language: de
  script: Latn
  content: '67/274/EWG: Entscheidung der Kommission vom 23. März 1967 über die Gewährung
    eines Zuschusses aus dem Europäischen Sozialfonds an das Großherzogtum Luxemburg
    zu Aufwendungen für vom "Office de placement et de rééducation professionnelle
    des travailleurs handicapés" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '67/274/CEE: Decisione della Commissione, del 23 marzo 1967, relativa alla
    concessione di un contributo del Fondo sociale europeo a favore del Granducato
    del Lussemburgo per spese concernenti operazioni di rieducazione professionale
    effettuate dall''«Office de placement et de rééducation professionnelle des
    travailleurs handicapés»'
  type: main
- language: nl
  script: Latn
  content: '67/274/EEG: Beschikking van de Commissie van 23 maart 1967 houdende verlening
    van bijstand door het Europees Sociaal Fonds aan het Groothertogdom Luxemburg
    voor de uitgaven met betrekking tot de door het "Office de placement et de rééducation
    professionnelle des travailleurs handicapés" gedane uitgaven met betrekking op
    de verrichtingen op het gebied van de herscholing'
