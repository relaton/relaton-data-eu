title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3631/92 of 15 December 1992 re-establishing
    the levying of customs duties on products of category Nos 15 and 33 (order Nos
    40.0150 and 40.0330), originating in Thailand, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3631/92 de la Commission, du 15 décembre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 15 et 33 (numéros d' ordre 40.0150 et 40.0330) originaires de
    Thaïlande, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
