  content: Règlement (CEE) n° 2057/72 du Conseil, du 26 septembre 1972, portant
    ouverture, répartition et mode de gestion de contingents tarifaires communautaires
    de fils de coton, non conditionnés pour la vente au détail, et d'autres tissus
    de coton, des positions 55.05 et 55.09 du tarif douanier commun, en provenance
    de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2057/72 des Rates vom 26. September 1972 über die
    Eröffnung, Aufteilung und Verwaltung der Gemeinschaftszollkontingente für Baumwollgarne,
    nicht in Aufmachungen für den Einzelverkauf, der Tarifnummer 55.05, und andere
    Gewebe aus Baumwolle der Tarifnummer 55.09 des Gemeinsamen Zolltarifs, mit Herkunft
    aus der Türkei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2057/72 del Consiglio, del 26 settembre 1972, relativo
