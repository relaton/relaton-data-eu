title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 368/2004 of 27 February 2004 amending Regulation
    (EC) No 2262/2003 as regards the available quantity for which import licence applications
    for certain pigmeat products may be lodged for the period 1 to 30 April 2004
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 368/2004 de la Commission du 27 février 2004 modifiant
    le règlement (CE) n° 2262/2003 en ce qui concerne la quantité disponible pour
    laquelle les demandes de certificats d'importation pour certains produits dans
    le secteur de la viande de porc peuvent être introduites pour la période du
    1er au 30 avril 2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 368/2004 der Kommission vom 27. Februar 2004 zur Änderung
    der Verordnung (EG) Nr. 2262/2003 hinsichtlich der verfügbaren Menge, für die
    Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse für den
    Zeitraum vom 1. bis 30. April 2004 eingereicht werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 368/2004 af 27. februar 2004 om ændring
    af forordning (EF) nr. 2262/2003 for så vidt angår den disponible mængde, som
    der kan indgives ansøgninger om importlicenser for visse svinekødsprodukterfor
    i perioden fra den 1. april til den 30. april 2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 368/2004 της Επιτροπής,
    της 27ης Φεβρουαρίου 2004, για τροποποίηση του
    κανονισμού (EK) αριθ. 2262/2003 όσον αφορά τη διαθέσιμη
    ποσότητα για την οποία μπορούν να υποβληθούν
    αιτήσεις πιστοποιητικών εισαγωγής για ορισμένα
    προϊόντα στον τομέα του χοιρείου κρέατος για
    την περίοδο από την 1η έως τις 30 Απριλίου 2004
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 368/2004, annettu 27 päivänä helmikuuta 2004,
    asetuksen (EY) N:o 2262/2003 muuttamisesta siltä osin kuin on kyse käytettävissä
    olevasta määrästä, josta tiettyjä sianliha-alan tuotteita koskevia tuontitodistushakemuksia
    voidaan jättää 1 päivän huhtikuuta ja 30 päivän huhtikuuta 2004 välisen
    ajan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 368/2004 della Commissione, del 27 febbraio 2004, che
    modifica il regolamento (CE) n. 2262/2003 per quanto riguarda il quantitativo
    disponibile per il quale possono essere presentate le domande di titoli d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° aprile
    al 30 aprile 2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 368/2004 van de Commissie van 27 februari 2004 houdende
    wĳziging van Verordening (EG) nr. 2262/2003 met betrekking tot de beschikbare
    hoeveelheid waarvoor certificaataanvragen voor de invoer van bepaalde producten
    van de sector varkensvlees kunnen worden ingediend voor de periode van 1 tot en
    met 30 april 2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 368/2004 da Comissão, de 27 de Fevereiro de 2004,
    que altera o Regulamento (CE) n.° 2262/2003 no respeitante à quantidade disponível
    para a qual podem ser apresentados os pedidos de certificados de importação
    relativos a determinados produtos do sector da carne de suíno para o período
    de 1 de Abril a 30 de Abril de 2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 368/2004 de la Comisión, de 27 de febrero de 2004,
    que modifica el Reglamento (CE) n° 2262/2003 en lo que respecta a la cantidad
    disponible por la que pueden presentarse las solicitudes de certificados de importación
    para determinados productos del sector de la carne de porcino para el periodo
    comprendido entre el 1 y el 30 de abril de 2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 368/2004 av den 27 februari 2004 om ändring
    av förordning (EG) nr 2262/2003 beträffande den tillgängliga kvantitet för
    vilken ansökningar om importlicenser för vissa grisköttsprodukter får lämnas
    inför perioden 1–30 april 2004
  type: main
