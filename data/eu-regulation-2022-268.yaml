id: EURegulation2022268
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/268 of 23 February 2022 amending
    Implementing Regulation (EU) 2016/898 as regards the name of the holder of the
    authorisation of a preparation of Bacillus licheniformis (ATCC 53757) and its
    protease (EC 3.4.21.19) as a feed additive and Implementing Regulation (EU) 2018/982
    as regards the name of the holder of the authorisation of a preparation of benzoic
    acid, calcium formate and fumaric acid as a feed additive
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/268 de la Commission du 23 février
    2022 modifiant le règlement d’exécution (UE) 2016/898 concernant le nom du
    titulaire de l’autorisation d’une préparation de Bacillus licheniformis (ATCC
    53757) et sa protéase (EC 3.4.21.19) en tant qu’additif pour l’alimentation
    animale et le règlement d’exécution (UE) 2018/982 concernant le nom du titulaire
    de l’autorisation d’une préparation d’acide benzoïque, formiate de calcium
    et acide fumarique en tant qu’additif pour l’alimentation animale
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/268 der Kommission vom 23. Februar 2022
    zur Änderung der Durchführungsverordnung (EU) 2016/898 hinsichtlich des Namens
    des Inhabers der Zulassung für eine Zubereitung aus Bacalls licheniformis (ATCC
    53757) und seiner Protease (EC 3.4.21.19) als Futtermittelzusatzstoff sowie der
    Durchführungsverordnung (EU) 2018/982 hinsichtlich des Namens des Zulassungsinhabers
    für eine Zubereitung aus Benzoesäure, Calciumformiat und Fumarsäure als Futtermittelzusatzstoff
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/268 на Комисията
    от 23 февруари 2022 година за изменение на Регламент
    за изпълнение (ЕС) 2016/898 по отношение на наименованието
    на притежателя на разрешението за препарат
    от Bacillus licheniformis (ATCC 53757) и неговата протеаза
    (EC 3.4.21.19) като фуражна добавка и на Регламент
    за изпълнение (ЕС) 2018/982 по отношение на наименованието
    на притежателя на разрешението за препарат
    от бензоена киселина, калциев формат и фумарова
    киселина като фуражна добавка
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/268 ze dne 23. února 2022, kterým
    se mění prováděcí nařízení (EU) 2016/898, pokud jde o jméno držitele
    povolení přípravku Bacillus licheniformis (ATCC 53757) a jeho proteázy (EC
    3.4.21.19) jako doplňkové látky, a prováděcí nařízení (EU) 2018/982,
    pokud jde o jméno držitele povolení přípravku z kyseliny benzoové, mravenčanu
    vápenatého a kyseliny fumarové jako doplňkové látky
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/268 af 23. februar 2022
    om ændring af gennemførelsesforordning (EU) 2016/898 for så vidt angår navnet
    på indehaveren af godkendelsen af et præparat af Bacillus licheniformis (ATCC
    53757) og dets protease (EC 3.4.21.19) som fodertilsætningsstof og af gennemførelsesforordning
    (EU) 2018/982 for så vidt angår navnet på indehaveren af godkendelsen af et
    præparat af benzoesyre, calciumformiat og fumarsyre som fodertilsætningsstof
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/268 της Επιτροπής
    της 23ης Φεβρουαρίου 2022 για την τροποποίηση
    του εκτελεστικού κανονισμού (ΕΕ) 2016/898 όσον
    αφορά την επωνυμία του κατόχου της άδειας για
    το παρασκεύασμα Bacillus licheniformis (ATCC 53757) και της
    πρωτεάσης του (EC 3.4.21.19) ως πρόσθετης ύλης ζωοτροφών
    και του εκτελεστικού κανονισμού (ΕΕ) 2018/982 όσον
    αφορά την επωνυμία του κατόχου της άδειας παρασκευάσματος
    βενζοϊκού οξέος, μυρμηκικού ασβεστίου και
    φουμαρικού οξέος ως πρόσθετης ύλης ζωοτροφών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/268, 23. veebruar 2022, millega muudetakse
    rakendusmäärust (EL) 2016/898 Bacillus licheniformis’e (ATCC 53757) ja selle
    proteaasi (EC 3.4.21.19) valmistise söödalisandina kasutamise loa hoidja nime
    osas ning rakendusmäärust (EL) 2018/982 bensoehappest, kaltsiumformiaadist ja
    fumaarhappest preparaadi söödalisandina kasutamise loa hoidja nime osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/268, annettu 23 päivänä
    helmikuuta 2022, täytäntöönpanoasetuksen (EU) 2016/898 muuttamisesta siltä
    osin kuin on kyse rehun lisäaineeksi hyväksytyn Bacillus licheniformis (ATCC
    53757) -organismia ja sen proteaasia (E.C.3.4.21.19) sisältävän valmisteen
    hyväksynnän haltijan nimestä sekä täytäntöönpanoasetuksen (EU) 2018/982
    muuttamisesta siltä osin kuin on kyse rehun lisäaineeksi hyväksytyn bentsoehaposta,
    kalsiumformiaatista ja fumaarihaposta tehdyn valmisteen hyväksynnän haltijan
    nimestä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/268 ón gCoimisiún an 23 Feabhra
    2022 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2016/898 a mhéid a bhaineann
    le hainm shealbhóir an údaraithe maidir le hullmhóid Bacillus licheniformis
    (ATCC 53757) agus a heinsím phróitéalaíoch (EC 3.4.21.19) mar bhreiseán beathaithe
    agus Rialachán Cur Chun Feidhme (AE) 2018/982 a mhéid a bhaineann le hainm shealbhóir
    an údaraithe maidir le hullmhóid d’aigéad beansóch, formáit chailciam agus
    aigéad fúmarach mar bhreiseán beathaithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/268 оd 23. veljače 2022. o izmjeni
    Provedbene uredbe (EU) 2016/898 u pogledu naziva nositelja odobrenja pripravka
    Bacillus licheniformis (ATCC 53757) i njegove proteaze (EC 3.4.21.19) kao dodatka
    hrani za životinje i Provedbene uredbe (EU) 2018/982 u pogledu naziva nositelja
    odobrenja pripravka benzojeve kiseline, kalcijeva formata i fumarne kiseline kao
    dodatka hrani za životinje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/268 végrehajtási rendelete (2022. február 23.)
    az (EU) 2016/898 végrehajtási rendeletnek a Bacillus licheniformist (ATCC 53757)
    és annak proteázát (EC 3.4.21.19) tartalmazó készítményre mint takarmány-adalékanyagra
    megadott engedély jogosultjának neve tekintetében történő módosításáról
    és az (EU) 2018/982 végrehajtási rendeletnek egy benzoesavat, kalcium-formiátot
    és fumársavat tartalmazó készítményre mint takarmány-adalékanyagra megadott
    engedély jogosultjának neve tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/268 della Commissione del 23 febbraio
    2022 che modifica il regolamento di esecuzione (UE) 2016/898 per quanto riguarda
    il nome del titolare dell’autorizzazione di un preparato di Bacillus licheniformis
    (ATCC 53757) e sua proteasi (EC 3.4.21.19) come additivo per mangimi e il regolamento
    di esecuzione (UE) 2018/982 per quanto riguarda il nome del titolare dell’autorizzazione
    di un preparato di acido benzoico, formiato di calcio e acido fumarico come additivo
    per mangimi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/268 (2022. gada 23. februāris),
    ar kuru attiecībā uz tās atļaujas turētāja nosaukumu, ar ko Bacillus licheniformis
    (ATCC 53757) un tā proteāzes (EC 3.4.21.19) preparātu atļauj lietot par barības
    piedevu, groza Īstenošanas regulu (ES) 2016/898 un attiecībā uz tās atļaujas
    turētāja nosaukumu, ar ko benzoskābes, kalcija formiāta un fumārskābes preparātu
    atļauj lietot par barības piedevu, groza Īstenošanas regulu (ES) 2018/982
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/268 2022 m. vasario 23 d.
    kuriuo dėl leidimo naudoti Bacillus licheniformis (ATCC 53757) preparatą ir
    jo proteazę (EC 3.4.21.19) kaip pašarų priedą turėtojo pavadinimo iš dalies
    keičiamas Įgyvendinimo reglamentas (ES) 2016/898 ir dėl leidimo naudoti benzenkarboksirūgšties,
    kalcio formiato ir fumaro rūgšties preparatą kaip pašarų priedą turėtojo
    pavadinimo iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2018/982
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/268 tat-23
    ta’ Frar 2022 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2016/898 fir-rigward
    tal-isem tad-detentur tal-awtorizzazzjoni ta’ preparazzjoni ta’ Bacillus licheniformis
    (ATCC 53757) u l-proteażi tiegħu (EC 3.4.21.19) bħala addittiv tal-għalf u
    r-Regolament ta’ Implimentazzjoni (UE) 2018/982 fir-rigward tal-isem tad-detentur
    tal-awtorizzazzjoni ta’ preparazzjoni ta’ aċidu benżojku, format tal-kalċju
    u aċidu fumariku bħala addittiv tal-għalf
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/268 van de Commissie van 23 februari 2022
    tot wijziging van Uitvoeringsverordening (EU) 2016/898 wat betreft de naam van
    de houder van de vergunning voor een preparaat van Bacillus licheniformis (ATCC
    53757) en de protease ervan (EC 3.4.21.19) als toevoegingsmiddel voor diervoeding,
    en tot wijziging van Uitvoeringsverordening (EU) 2018/982 wat betreft de naam
    van de houder van de vergunning voor een preparaat van benzoëzuur, calciumformiaat
    en fumaarzuur als toevoegingsmiddel voor diervoeding
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/268 z dnia 23 lutego 2022
    r. zmieniające rozporządzenie wykonawcze (UE) 2016/898 w odniesieniu do nazwy
    posiadacza zezwolenia na stosowanie preparatu Bacillus licheniformis (ATCC 53757)
    i jego proteazy (EC 3.4.21.19) jako dodatku paszowego oraz rozporządzenie wykonawcze
    (UE) 2018/982 w odniesieniu do nazwy posiadacza zezwolenia na stosowanie preparatu
    kwasu benzoesowego, mrówczanu wapnia i kwasu fumarynowego jako dodatku paszowego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/268 da Comissão de 23 de fevereiro
    de 2022 que altera o Regulamento de Execução (UE) 2016/898 no que se refere
    ao nome do detentor da autorização de uma preparação de Bacillus licheniformis
    (ATCC 53757) e sua protease (EC 3.4.21.19) como aditivo em alimentos para animais
    e o Regulamento de Execução (UE) 2018/982 no que se refere ao nome do detentor
    da autorização de uma preparação de ácido benzoico, formiato de cálcio e
    ácido fumárico como aditivo em alimentos para animais
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/268 al Comisiei din 23 februarie
    2022 de modificare a Regulamentului de punere în aplicare (UE) 2016/898 în ceea
    ce privește numele titularului autorizației unui preparat de Bacillus licheniformis
    (ATCC 53757) și proteaza sa (EC 3.4.21.19) ca aditiv furajer și a Regulamentului
    de punere în aplicare (UE) 2018/982 în ceea ce privește numele titularului
    autorizației unui preparat de acid benzoic, formiat de calciu și acid fumaric
    ca aditiv furajer
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/268 z 23. februára 2022, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2016/898, pokiaľ ide o názov držiteľa
    povolenia prípravku z Bacillus licheniformis (ATCC 53757) a jeho proteázy (EC
    3.4.21.19) ako kŕmnej doplnkovej látky, a vykonávacie nariadenie (EÚ) 2018/982,
    pokiaľ ide o názov držiteľa povolenia prípravku s obsahom kyseliny benzoovej,
    mravčanu vápenatého a kyseliny fumarovej ako kŕmnej doplnkovej látky
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/268 z dne 23. februarja 2022 o spremembi
    Izvedbene uredbe (EU) 2016/898 glede imena imetnika dovoljenja za pripravek iz
    Bacillus licheniformis (ATCC 53757) in njegove proteaze (ES 3.4.21.19) kot krmni
    dodatek ter Izvedbene uredbe (EU) 2018/982 glede imena imetnika dovoljenja za
    pripravek iz benzojske kisline, kalcijevega formata in fumarne kisline kot krmni
    dodatek
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/268 de la Comisión de 23 de febrero
    de 2022 por el que se modifican el Reglamento de Ejecución (UE) 2016/898 en lo
    que respecta al nombre del titular de la autorización de un preparado de Bacillus
    licheniformis (ATCC 53757) y su proteasa (EC 3.4.21.19) como aditivo en piensos
    y el Reglamento de Ejecución (UE) 2018/982 en lo que respecta al nombre del titular
    de la autorización de un preparado de ácido benzoico, formiato de calcio y ácido
    fumárico como aditivo en piensos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/268 av den 23 februari
    2022 om ändring av genomförandeförordning (EU) 2016/898 vad gäller namnet
    på innehavaren av godkännandet av ett preparat av Bacillus licheniformis (ATCC
    53757) och dess proteas (EC 3.4.21.19) som fodertillsats, och genomförandeförordning
    (EU) 2018/982 vad gäller namnet på innehavaren av godkännandet av ett preparat
    av bensoesyra, kalciumformat och fumarsyra som fodertillsats
  type: main
