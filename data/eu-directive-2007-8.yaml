    dopuszczalnych poziomów pozostałości fosfamidonu i mewinfosu
  type: main
- language: pt
  script: Latn
  content: Directiva 2007/8/CE da Comissão, de 20 de Fevereiro de 2007 , que altera
    os anexos das Directivas 76/895/CEE, 86/362/CEE e 90/642/CEE do Conselho, no que
    diz respeito aos limites máximos de resíduos de fosfamidão e mevinfos
  type: main
- language: ro
  script: Latn
  content: Directiva 2007/8/CE a Comisiei din 20 februarie 2007 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE și 90/642/CEE ale Consiliului privind conținuturile
    maxime de reziduuri de fosfamidon și mevinfos
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2007/8/ES z 20. februára 2007 , ktorou sa menia a dopĺňajú
