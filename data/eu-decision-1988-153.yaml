    87/492/ΕΟΚ σχετικά με την αναγνώριση ορισμένων
    τμημάτων του εδάφους των Κάτω Χωρών ως επίσημα
    απαλλαγμένων από την πανώλη των χοίρων'
  type: main
- language: it
  script: Latn
  content: '88/153/CEE: Decisione della Commissione del 19 gennaio 1988 recante modifica
    della decisione 87/492/CEE che riconosce ufficialmente indenni dalla peste suina
    alcune parti del territorio del Regno dei Paesi Bassi (Il testo in lingua olandese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/153/EEG: Beschikking van de Commissie van 19 januari 1988 tot wijziging
