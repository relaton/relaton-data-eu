  content: '88/153/EEC: Commission Decision of 19 January 1988 amending Decision 87/492/EEC
    recognizing certain parts of the territory of the Netherlands as being officially
    swine fever free (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/153/CEE: Décision de la Commission du 19 janvier 1988 modifiant la
    décision 87/492/CEE de la Commission reconnaissant certaines parties du territoire
    du Royaume des Pays-Bas comme officiellement indemnes de peste porcine (Le texte
    en langue néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/153/EWG: Entscheidung der Kommission vom 19. Januar 1988 zur Änderung
    der Entscheidung 87/492/EWG, durch die bestimmte Teile des Hoheitsgebiets der
    Niederlande als amtlich schweinepestfrei anerkannt werden (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/153/EØF: Kommissionens beslutning af 19. januar 1988 om ændring af
    beslutning 87/492/EØF om anerkendelse af visse dele af Nederlandenes område
    som værende officielt fri for svinepest (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
