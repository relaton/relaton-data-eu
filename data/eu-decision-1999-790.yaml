    og deres medlemsstater på den ene side og Republikken Letland på den anden side
    for at tage hensyn til Republikken Finlands, Kongeriget Sveriges og Republikken
    Østrigs tiltrædelse af Den Europæiske Union og resultaterne af landbrugsforhandlingerne
    under Uruguay-runden, også forbedringerne af den eksisterende præferenceordning'
  type: main
- language: el
