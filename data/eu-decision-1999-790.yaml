title:
- language: en
  script: Latn
  content: '1999/790/EC: Council Decision of 18 May 1998 on the conclusion of a Protocol
    adjusting trade aspects of the Europe Agreement establishing an association between
    the European Communities and their Member States, of the one part, and the Republic
    of Latvia, of the other part, to take account of the accession of the Republic
    of Austria, the Republic of Finland and the Kingdom of Sweden to the European
    Union and the outcome of the Uruguay Round negotiations on agriculture, including
    improvements to the existing preferential arrangements'
  type: main
- language: fr
  script: Latn
  content: '1999/790/CE: Décision du Conseil du 18 mai 1998 relative à la conclusion
    du protocole d''adaptation des aspects commerciaux de l''accord européen établissant
    une association entre les Communautés européennes et leurs États membres, d''une
    part, et la République de Lettonie, d''autre part, pour tenir compte de l''adhésion
    de la République d''Autriche, de la République de Finlande et du Royaume de
    Suède à l''Union européenne et des résultats des négociations agricoles de
    l''Uruguay Round, y inclus les améliorations du régime préférentiel existant'
  type: main
- language: de
  script: Latn
  content: '1999/790/EG: Beschluß des Rates vom 18. Mai 1998 über den Abschluß
    des Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zur Gründung
    einer Assoziation zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der Republik Lettland andererseits zur Berücksichtigung des Beitritts
    der Republik Österreich, der Republik Finnland und des Königreichs Schweden
    zur Europäischen Union und der Ergebnisse der Agrarverhandlungen der Uruguay-Runde
    einschließlich der Verbesserung der bestehenden Präferenzregelung'
  type: main
- language: da
  script: Latn
  content: '1999/790/EF: Rådets afgørelse af 18. maj 1998 om indgåelse af en protokol
