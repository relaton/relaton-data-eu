    vorübergehender Maßnahmen betreffend die Produktionsbeihilfe für Verarbeitungserzeugnisse
    aus Tomaten #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2204/89 af 20. juli 1989 om ændring
