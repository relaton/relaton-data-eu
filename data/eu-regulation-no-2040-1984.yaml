title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2040/84 of 16 July 1984 derogating, for
    the 1984/85 marketing year in respect of cherries, from the time limit laid down
    for conclusion of contracts under the production aid system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2040/84 de la Commission du 16 juillet 1984 portant
    dérogation, pour la campagne de commercialisation 1984/1985, au délai fixé
    pour la conclusion de contrats dans le cadre du régime d' aide à la production
    applicable aux cerises
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2040/84 der Kommission vom 16. Juli 1984 zur Abweichung
    von der Frist, die für den Abschluß von Verträgen im Rahmen der Produktionsbeihilferegelung
    vorgeschrieben ist, für Kirschen für das Wirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2040/84 af 16. juli 1984 om undtagelse
    i produktionsåret 1984/85 for kirsebær fra den frist, der er fastsat for indgåelse
    af kontrakter i henhold til producentstøtteordningen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2040/84 της Επιτροπής
    της 16ης Ιουλίου 1984 για παρέκκλιση, για την περίοδο
    εμπορίας 1984/85, από την προθεσμία που καθορίζεται
    για τη σύναψη συμβάσεων στο πλαίσιο του συστήματος
    ενίσχυσης στην παραγωγή που εφαρμόζεται στα
    κεράσια
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2040/84 della Commissione del 16 luglio 1984 che proroga,
    per la campagna di commercializzazione 1984/1985, il termine ultimo previsto per
    la conclusione di contratti nell' ambito del regime di aiuto alla produzione per
    le ciliegie
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2040/84 van de Commissie van 16 juli 1984 houdende
    afwijking van de uiterste termijn voor het sluiten van contracten in het kader
    van de produktiesteunregeling ten aanzien van kersen voor het verkoopseizoen 1984/1985
