  content: Regulation (EEC) No 1686/75 of the Council of 30 June 1975 maintaining
    and amending the rules whereby imports into the Federal Republic of Germany and
    the Benelux countries of synthetic socks originating in the Republic of Korea
    are subject to import authorizations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1686/75 du Conseil, du 30 juin 1975, portant maintien
    et modification du régime d'autorisation d'importation, en République fédérale
    d'Allemagne et dans les pays du Benelux, de chaussettes synthétiques originaires
    de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1686/75 des Rates vom 30. Juni 1975 zur Aufrechterhaltung
    und Änderung der Genehmigungspflicht für die Einfuhr synthetischer Socken mit
    Ursprung in der Republik Korea in die Bundesrepublik Deutschland und die Benelux-Länder
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1686/75 af 30. juni 1975 om opretholdelse
    af og ændring af bevillingsordningen for indførsel i forbundsrepublikken Tyskland
    og i Benelux-landene af sokker af kunstfibre med oprindelse i republikken Korea
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1686/75 del Consiglio, del 30 giugno 1975, che mantiene
