    federale di Germania e nei paesi del Benelux di calze sintetiche originarie della
    Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1686/75 van de Raad van 30 juni 1975 houdende handhaving
