title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2065/89 of 10 July 1989 re-establishing
    the levying of customs duties on women's suits and ensembles, other than knitted
    or crocheted, products of category No 29 (order No 40.0290), originating in Pakistan,
    and women's suits and ensembles, knitted or crocheted, products of category No
    74 (order No 40.0740), originating in India to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2065/89 de la Commission du 10 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux costumes-tailleurs,
    autres qu'en bonneterie, pour femmes, de la catégorie 29 (numéro d'ordre 40.0290),
    originaires du Pakistan, et aux costumes-tailleurs, en bonneterie, pour femmes,
    de la catégorie 74 (numéro d'ordre 40.0740), originaires de l'Inde, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2065/89 DER KOMMISSION vom 10. Juli 1989 zur Wiedereinführung
    des Zollsatzes für Kostüme und Kombinationen, andere als aus Gewirken, für
    Frauen, der Warenkategorie Nr. 29 (lfd. Nr. 40.0290) mit Ursprung in Pakistan
    und Kostüme und Kombinationen, aus Gewirken, für Frauen, der Warenkategorie
    Nr. 74 (lfd. Nr. 40.0740) mit Ursprung in Indien, denen die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2065/89 af 10. juli 1989 om genindførelse
