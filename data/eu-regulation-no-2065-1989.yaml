    kvinder, under varekategori 29 (løbenummer 40.0290), som har oprindelse i Pakistan,
    samt dragter og kostumer, af trikotage, til kvinder, under varekategori 74 (løbenummer
    40.0740), som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
