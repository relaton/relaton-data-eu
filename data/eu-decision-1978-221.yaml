id: EUDecision1978221
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 February 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to women's outer garments, falling within heading No ex 61.02
    of the Common Customs Tariff, originating in Poland and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: 78/221/CEE Décision de la Commission, du 8 février 1978, autorisant les
    pays du Benelux à exclure du traitement communautaire les vêtements de dessus
    pour femmes, de la position Ex 61.02 du Tarif douanier commun, originaires de
    Pologne et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Februar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Polen stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberkleidung für Frauen, der Tarifnummer ex 61.02 des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 8. februar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage yderbeklædningsgenstande til kvinder, som henhører under pos. ex
    61.02 i den fælles toldtarif, har oprindelse i Polen og frit kan omsættes i
    de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 febbraio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario gli indumenti esterni per donna della voce ex 61.02
    della tariffa doganale comune, originari della Polonia e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 februari 1978 waarbij de Benelux-landen
    worden gemachtigd damesbovenkleding van post ex 61.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Polen, en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
