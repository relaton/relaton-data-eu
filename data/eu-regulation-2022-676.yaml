  script: Latn
  content: Commission Delegated Regulation (EU) 2022/676 of 3 December 2021 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the conditions in accordance
    with which consolidation is to be carried out in the cases referred to in Article
    18(3) to (6) and Article 18(8) of that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/676 de la Commission du 3 décembre 2021
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les conditions régissant
    la consolidation dans les cas visés à l’article 18, paragraphes 3 à 6, et
    à l’article 18, paragraphe 8, dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/676 der Kommission vom 3. Dezember 2021
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der Bedingungen
    für eine Konsolidierung in den in Artikel 18 Absätze 3 bis 6 sowie 8 beschriebenen
    Fällen
  type: main
