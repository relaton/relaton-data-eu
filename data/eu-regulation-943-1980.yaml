title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 943/80 of 14 April 1980 re-establishing
    the levying of customs duties on wadding and articles of wadding, products of
    category 94 (code 0940), originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 943/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux ouates et
    articles en ouate, de la catégorie 94 (code 0940), originaires de Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 943/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Watte und Waren daraus, der Warenkategorie
    Nr. 94 (Kennziffer 0940), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 943/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for vat og varer deraf, under varekategori nr.
    94 (kode 0940), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 943/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle ovatte e manufatti
    di ovatta, della categoria di prodotti n. 94 (codice 0940), originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 943/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op watten en
    artikelen van watten van de categorie van produkten nr. 94 (codenummer 0940),
    wederinstelling van de heffing van de invoerrechten van toepassing op watten en
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
