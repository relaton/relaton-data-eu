title:
- language: en
  script: Latn
  content: '97/752/EC: Commission Decision of 31 October 1997 amending Decision 94/278/EC
    drawing up a list of third countries from which Member States authorize imports
    of certain products subject to Council Directive 92/118/EEC as regards Iceland'
  type: main
- language: fr
  script: Latn
  content: '97/752/CE: Décision de la Commission du 31 octobre 1997 modifiant, en
    ce qui concerne l''Islande, la décision 94/278/CE établissant la liste des pays
    tiers en provenance desquels les États membres autorisent l''importation de certains
    produits visés par la directive 92/118/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '97/752/EG: Entscheidung der Kommission vom 31. Oktober 1997 zur Änderung
    der Entscheidung 94/278/EG zur Festlegung der Listen von Drittländern, aus denen
    die Mitgliedstaaten die Einfuhr von bestimmten Erzeugnissen der Richtlinie 92/118/EWG
    des Rates zulassen, in bezug auf Island'
  type: main
- language: da
  script: Latn
  content: '97/752/EF: Kommissionens beslutning af 31. oktober 1997 om ændring for
    Islands vedkommende af beslutning 94/278/EF om listen over tredjelande, hvorfra
    medlemsstaterne tillader indførsel af en række produkter omhandlet i Rådets
    direktiv 92/118/EØF'
  type: main
- language: el
  script: Grek
  content: '97/752/ΕΚ: Απόφαση της Επιτροπής της 31ης Οκτωβρίου
    1997 για την τροποποίηση, όσον αφορά την Ισλανδία,
    της απόφασης 94/278/ΕΚ για την κατάρτιση καταλόγου
    τρίτων χωρών από τις οποίες τα κράτη μέλη εγκρίνουν
    τις εισαγωγές ορισμένων προϊόντων που υπόκεινται
    στις διατάξεις της οδηγίας 92/118/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '97/752/EY: Komission päätös, tehty 31 päivänä lokakuuta 1997, luettelosta
    kolmansista maista, joista jäsenvaltiot sallivat tiettyjen neuvoston direktiivissä
    92/118/ETY tarkoitettujen tuotteiden tuonnin, tehdyn päätöksen 94/278/EY muuttamisesta
    Islannin osalta'
  type: main
- language: it
  script: Latn
  content: '97/752/CE: Decisione della Commissione del 31 ottobre 1997 recante modifica,
    per quanto riguarda l''Islanda, della decisione 94/278/CE che stabilisce l''elenco
    dei paesi terzi da cui gli Stati membri autorizzano l''importazione di taluni
    prodotti disciplinati dalla direttiva 92/118/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '97/752/EG: Beschikking van de Commissie van 31 oktober 1997 houdende wijziging,
    wat IJsland betreft, van Beschikking 94/278/EG tot vaststelling van de lijst van
    derde landen waaruit de lidstaten de invoer van bepaalde producten als bedoeld
    bij Richtlijn 92/118/EEG van de Raad toestaan'
  type: main
- language: pt
  script: Latn
  content: '97/752/CE: Decisão da Comissão de 31 de Outubro de 1997 que altera,
    no que diz respeito à Islândia, a Decisão 94/278/CE que estabelece uma lista
    de países terceiros dos quais os Estados-membros autorizam a importação de
    determinados produtos abrangidos pela Directiva 92/118/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '97/752/CE: Decisión de la Comisión de 31 de octubre de 1997 que modifica,
