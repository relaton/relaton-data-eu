title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1637/1999 of 26 July 1999 fixing for the
    1999/2000 marketing year the minimum price to be paid to producers and the buying-in
    price to be applied by storage agencies for unprocessed dried figs, and the amount
    of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1637/1999 de la Commission, du 26 juillet 1999, fixant,
    pour la campagne 1999/2000, le prix minimal à payer aux producteurs et le prix
    d'achat par les organismes stockeurs pour les figues sèches non transformées
    ainsi que le montant de l'aide à la production pour les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1637/1999 der Kommission vom 26. Juli 1999 zur Festsetzung
    des den Erzeugern für unverarbeitete Trockenfeigen zu zahlenden Mindestpreises,
    des Ankaufspreises der Einlagerungsstellen und der Produktionsbeihilfe für Trockenfeigen
    für das Wirtschaftsjahr 1999/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1637/1999 af 26. juli 1999 om fastsættelse
    for produktionsåret 1999/2000 af den minimumspris, der skal udbetales til producenterne,
    og den pris, som oplagringsorganerne skal betale ved opkøb af uforarbejdede tørrede
    figner, samt af produktionsstøtten for tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1637/1999 της Επιτροπής,
    της 26ης Ιουλίου 1999, για τον καθορισμό, για την
    περίοδο 1999/2000 της ελάχιστης τιμής που καταβάλλεται
    στους παραγωγούς και της τιμής αγοράς εκ μέρους
    των οργανισμών αποθεματοποίησης για τα μη
    μεταποιημένα ξηρά σύκα, και για το ποσό της
    ενίσχυσης στην παραγωγή ξηρών σύκων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1637/1999, annettu 26 päivänä heinäkuuta
    1999, jalostamattomien kuivattujen viikunoiden tuottajille maksettavan vähimmäishinnan
    ja varastointielinten ostohinnan sekä kuivattujen viikunoiden tuotantotuen määrän
    vahvistamisesta markkinointivuodeksi 1999/2000
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1637/1999 della Commissione, del 26 luglio 1999, che
    fissa, per la campagna di commercializzazione 1999/2000, il prezzo minimo da pagare
    ai produttori e il prezzo d'acquisto da parte degli organismi ammassatori per
    i fichi secchi non trasformati nonché l'importo dell'aiuto alla produzione per
    i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1637/1999 van de Commissie van 26 juli 1999 tot vaststelling,
    voor het verkoopseizoen 1999/2000, van de voor gedroogde vijgen (basisproduct)
    aan de telers te betalen minimumprijs, van de aankoopprijs daarvan voor de opslaghouders
    en van het bedrag van de productiesteun voor gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1637/1999 da Comissão, de 26 de Julho de 1999, que
    fixa, para a campanha de comercialização de 1999/2000, o preço mínimo a pagar
    aos produtores e o preço de compra pelos organismos de armazenagem de figos secos
    não transformados, bem como o montante da ajuda à produção para os figos secos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1637/1999 de la Comisión, de 26 de julio de 1999,
