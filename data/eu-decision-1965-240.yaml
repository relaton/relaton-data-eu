title:
- language: fr
  script: Latn
  content: Décision 65/240/CEE de la Commission, du 13 avril 1965, relative au concours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire les viandes et abats comestibles frais, réfrigérés
    ou congelés, de lapins domestiques, originaires de Pologne et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/240/EWG: Entscheidung der Kommission vom 13. April 1965 über die Inanspruchnahme
    von Artikel 115 Absatz (1) des Vertrages durch die Französische Republik, um
    "Fleisch und genießbare Schlachtabfälle, frisch, gekühlt oder gefroren, von
    Hauskaninchen", die aus Polen stammen und in den übrigen Mitgliedstaaten in den
    freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/240/CEE: Decisione della Commissione, del 13 aprile 1965, relativa
    al ricorso presentato dalla Repubblica francese ai sensi dell''articolo 115, primo
    comma, del Trattato, per escludere dal trattamento comunitario le «carni e frattaglie
    commestibili, fresche, refrigerate o congelate, di conigli domestici». originarie
    della Polonia, immesse in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/240/EEG: Beschikking van de Commissie van 13 april 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag vlees en eetbare slachtafvallen, vers, gekoeld of bevroren van
    tamme konijnen, die van oorsprong zijn uit Polen en in de andere Lid-Staten in
    het vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
