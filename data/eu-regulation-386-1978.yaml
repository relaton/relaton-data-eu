title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 386/78 of 24 February 1978 amending Regulation
    (EEC) No 2104/75 as regards certain special rules for the application of the system
    of import licences for products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 386/78 de la Commission, du 24 février 1978, modifiant
    le règlement (CEE) n° 2104/75 en ce qui concerne certaines modalités particulières
    d' application du régime des certificats d' importation dans le secteur des produits
    transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 386/78 der Kommission vom 24. Februar 1978 zur Änderung
    der Verordnung (EWG) Nr. 2104/75 hinsichtlich einiger besonderer Durchführungsbestimmungen
    über Einfuhrlizenzen für Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 386/78 af 24. februar 1978 om ændring
    af forordning (EØF) nr. 2104/75 for så vidt angår visse særlige gennemførelsesbestemmelser
    for ordningen med importlicenser for produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 386/78 τής Επιτροπής
