    ειδικών λεπτομερειών εφαρμογής τού καθεστώτος
    τών πιστοποιητικών εισαγωγής στόν τομέα τών
    μεταποιημένων προϊόντων μέ βάση τά οπωροκηπευτικά»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 386/78 della Commissione, del 24 febbraio 1978, recante
    modifica del regolamento (CEE) n. 2104/75, per quanto concerne talune modalità
    particolari di applicazione del regime dei titoli d' importazione nel settore
    dei prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 386/78 van de Commissie van 24 februari 1978 houdende
    wijziging van Verordening (EEG) nr. 2104/75 ten aanzien van enkele bijzondere
    uitvoeringsbepalingen inzake een stelsel van invoercertificaten in de sector van
    op basis van groenten en fruit verwerkte produkten
