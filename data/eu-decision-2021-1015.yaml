    similare, aparatele vaporizatoare pentru țesături, aparatele electromecanice
    pentru circuite de comandă, păturile, pernele, îmbrăcămintea și aparatele
    de încălzit flexibile similare și anumite alte echipamente electrice destinate
    utilizării în cadrul unor anumite limite de tensiune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1015 zo 17. júna 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/1956, pokiaľ ide o harmonizované
    normy pre chladiace zariadenia, zariadenia na výrobu zmrzliny a výrobníky ľadu,
    laboratórne zariadenia na ohrev materiálov, automatické a poloautomatické
    laboratórne zariadenia na analýzu a iné účely, elektrické zariadenia označené
    menovitými údajmi vzťahujúcimi sa na elektrické napájanie, spotrebiče určené
    na ožarovanie pokožky ultrafialovým a infračerveným žiarením, ohrievače
    miestností, elektrické žehličky, stabilné sporáky, varné panely, rúry
    a podobné spotrebiče, naparovače látok, elektromechanické prístroje riadiacich
    obvodov, prikrývky, podložky, podušky, návleky a podobné ohybné tepelné
    spotrebiče a určité ďalšie elektrické zariadenia navrhnuté na používanie
    v rámci určitých limitov napätia
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1015 z dne 17. junija 2021 o spremembi
    Izvedbenega sklepa (EU) 2019/1956 glede harmoniziranih standardov za hladilne
    aparate, aparate za izdelavo sladoleda in ledu, laboratorijsko opremo za segrevanje
    materialov, avtomatsko in polavtomatsko laboratorijsko opremo za analiziranje
    in druge namene, električno opremo s predpisanimi vrednostmi v zvezi z električnim
    napajanjem, aparate za obdelavo kože z ultravijoličnim in infrardečim sevanjem,
    grelnike prostorov, električne likalnike, nepremične štedilnike, kuhalne plošče,
    pečice in podobne aparate, parne aparate za tkanine, elektromehanske krmilne
    naprave, odeje, blazine, oblačila in podobne gibke grelne aparate ter določene
    vrste druge električne opreme, zasnovane za uporabo v določenih napetostnih
    mejah
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1015 de la Comisión de 17 de junio de
    2021 por la que se modifica la Decisión de Ejecución (UE) 2019/1956 en lo que
    respecta a las normas armonizadas aplicables a aparatos de refrigeración, aparatos
    fabricadores de helados y fabricadores de hielo; equipos de laboratorio utilizados
    para el calentamiento de materiales; equipos de laboratorio automáticos y semiautomáticos
    para análisis y otros fines; equipo eléctrico con características nominales
    relativas a la alimentación; aparatos para la exposición de la piel a las radiaciones
    ultravioletas e infrarrojas; aparatos de calefacción de locales; planchas eléctricas;
    cocinas, encimeras de cocción, hornos y aparatos análogos; vaporizadores para
    tejidos; aparatos electromecánicos para circuitos de mando; mantas, almohadas,
    ropas y aparatos calefactores flexibles análogos; y otro material eléctrico
    destinado a utilizarse con determinados límites de tensión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/1015 av den 17 juni 2021 om
    ändring av genomförandebeslut (EU) 2019/1956 vad gäller harmoniserade standarder
    för kylar och frysar för livsmedel samt glassmaskiner och ismaskiner, värmeapparater
    för laboratoriebruk, hel- och halvautomatiska laboratorieutrustningar för analys
    och liknande ändamål, elutrustning med märkning med avseende på matning, bruksföremål
    för hudbehandling med ultraviolett och infraröd bestrålning för hemmabruk
    och liknande användning, rumsuppvärmningsapparater, strykjärn, elspisar, kokhällar,
    ugnar och liknande bruksföremål för hushållsbruk, ångbehandlingsapparater
    för textilier, elektromekaniska manöverkretsapparater, elektriskt värmda filtar,
    värmedynor, kläder och liknande böjliga värmeapparater för hembruk samt viss
    annan elektrisk utrustning avsedd för användning inom vissa spänningsgränser
  type: main
