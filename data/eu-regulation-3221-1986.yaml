- language: en
  script: Latn
  content: Council Regulation (EEC) No 3221/86 of 21 October 1986 amending for the
    fifth time Regulation (EEC) No 3721/85 fixing, for certain fish stocks and groups
    of fish stocks, total allowable catches for 1986 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3221/86 du Conseil du 21 octobre 1986 portant cinquième
    modification du règlement (CEE) n° 3721/85 fixant, pour certains stocks ou groupes
    de stocks de poissons, les totaux admissibles des captures pour 1986 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3221/86 des Rates vom 21. Oktober 1986 zur fünften
