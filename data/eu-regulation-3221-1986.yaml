    μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3221/86 del Consiglio del 21 ottobre 1986 recante
    quinta modifica del regolamento (CEE) n. 3721/85 che fissa, per alcune popolazioni
    e gruppi di popolazioni ittiche, il totale delle catture ammissibile per il 1986
    ed alcune condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3221/86 van de Raad van 21 oktober 1986 houdende
    vijfde wijziging van Verordening (EEG) nr. 3721/85 inzake de vaststelling van
    de voor 1986 geldende totaal toegestane vangsten voor bepaalde visbestanden of
    groepen visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3221/86 do Conselho de 21 de Outubro de 1986 que
    altera pela quinta vez o Regulamento (CEE) n.° 3721/85 que fixa, relativamente
    a certas unidades populacionais (stocks) ou grupos de unidades populacionais de
    peixes, os totais admissíveis de capturas para 1986 e certas condições em que
    podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3221/86 del Consejo de 21 de octubre de 1986 que modifica
    por quinta vez el Reglamento (CEE) n° 3721/85 por el que se fijan, para determinadas
    poblaciones o grupos de poblaciones de peces, los totales admisibles de capturas
    para 1986 y determinadas condiciones en las que pueden pescarse
  type: main
