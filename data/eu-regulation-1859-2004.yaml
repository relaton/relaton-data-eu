  script: Latn
  content: Commission Regulation (EC) No 1859/2004 of 27 October 2004 specifying the
    extent to which applications lodged in October 2004 for import certificates in
    respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1859/2004 de la Commission du 27 octobre 2004 déterminant
