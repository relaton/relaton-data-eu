title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2535/71 de la Commission, du 25 novembre 1971, modifiant
    les montants compensatoires fixés dans le secteur agricole à la suite de l'élargissement
    temporaire des marges de fluctuations des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2535/71 der Kommission vom 25. November 1971 zur Änderung
    der Ausgleichsbeträge, die in der Landwirtschaft im Anschluß an die vorübergehende
    Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten festgesetzt
    wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2535/71 della Commissione, del 25 novembre 1971, che
    modifica gli importi di compensazione fissati per il settore agricolo in seguito
    all'ampliamento temporaneo dei margini di fluttuazione delle monete di taluni
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2535/71 van de Commissie van 25 november 1971 houdende
    wijziging van de compenserende bedragen welke naar aanleiding van de tijdelijke
    verruiming van de fluctuatiemarges van de valuta's van sommige Lid-Staten werden
    vastgesteld in de landbouwsector
  type: main
