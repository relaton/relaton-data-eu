title:
- language: en
  script: Latn
  content: '81/867/EEC: Commission Decision of 17 July 1981 authorizing the French
    Republic not to apply Community treatment to parkas, anoraks, windcheaters, waisted
    jackets and the like, woven, originating in South Korea (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/867/CEE: Décision de la Commission, du 17 juillet 1981, autorisant
    la République française à exclure du traitement communautaire les "parkas",
    anoraks, blousons et similaires tissés, originaires de la Corée du Sud (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/867/EWG: Entscheidung der Kommission vom 17. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea stammende Parkas, Anoraks, Windjacken
    und dergleichen, aus Geweben, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/867/EØF: Kommissionens beslutning af 17. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage parca-coats,
    anorakker, vindjakker, blousonjakker og lignende, vævede, med oprindelse i Sydkorea
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/867/EOK: Απόφαση τής Επιτροπής τής 17ης Ιουλίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά υφασμένα parkas, anoraks, μπλουζόν καί παρόμοια
    καταγωγής Νοτίου Κορέας (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/867/CEE: Decisione della Commissione, del 17 luglio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli eskimo, le
    giacche a vento e i giubbotti con o senza cappuccio e simili, tessuti, originari
    della Corea del Sud (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/867/EEG: Beschikking van de Commissie van 17 juli 1981 houdende machtiging
    van de Franse Republiek om parka''s, anoraks, windjakken en dergelijke, geweven,
    van oorsprong uit Zuid-Korea van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
