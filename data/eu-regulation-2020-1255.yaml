title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2020/1255 of 7 September 2020 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of polycyclic aromatic hydrocarbons
    (PAHs) in traditionally smoked meat and smoked meat products and traditionally
    smoked fish and smoked fishery products and establishing a maximum level of PAHs
    in powders of food of plant origin used for the preparation of beverages
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/1255 de la Commission du 7 septembre 2020 modifiant
    le règlement (CE) no 1881/2006 en ce qui concerne les teneurs maximales en hydrocarbures
    aromatiques polycycliques (HAP) des viandes, produits à base de viande, poissons
    et produits de la pêche fumés de façon traditionnelle et fixant une teneur
    maximale en HAP pour les poudres de denrées alimentaires d’origine végétale
    utilisées pour la préparation de boissons
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2020/1255 der Kommission vom 7. September 2020 zur Änderung
    der Verordnung (EG) Nr. 1881/2006 hinsichtlich der Höchstgehalte an polyzyklischen
    aromatischen Kohlenwasserstoffen (PAK) in traditionell geräuchertem Fleisch,
    traditionell geräucherten Fleischerzeugnissen, traditionell geräuchertem Fisch
    und traditionell geräucherten Fischereierzeugnissen sowie zur Festsetzung eines
    Höchstgehalts für PAK in Pulvern aus Lebensmitteln pflanzlichen Ursprungs, die
    zur Zubereitung von Getränken verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2020/1255 на Комисията от 7 септември
    2020 година за изменение на Регламент (ЕО) № 1881/2006
    по отношение на максимално допустимите количества
    на полициклични ароматни въглеводороди (ПАВ)
    в месо и месни продукти, пушени по традиционен
    начин, и риба и рибни продукти, пушени по традиционен
    начин, и за установяване на максимално допустимите
    количества на ПАВ в прахообразни храни от растителен
    произход, използвани за приготвяне на напитки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2020/1255 ze dne 7. září 2020, kterým se mění
    nařízení (ES) č. 1881/2006, pokud jde o maximální limity polycyklických
    aromatických uhlovodíků (PAU) v tradičně uzeném mase a uzených masných
    výrobcích a tradičně uzených rybách a uzených produktech rybolovu, a kterým
    se stanoví maximální limit PAU v prášcích z potravin rostlinného původu
    používaných k přípravě nápojů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2020/1255 af 7. september 2020 om ændring
    af forordning (EF) nr. 1881/2006 for så vidt angår grænseværdier for polycykliske
    aromatiske hydrocarboner (PAH) i traditionelt røget kød og traditionelt røgede
    kødprodukter og traditionelt røget fisk og traditionelt røgede fiskevarer og
    om fastsættelse af en grænseværdi for PAH i fødevarer af vegetabilsk oprindelse
    i pulverform, der anvendes til tilberedning af drikkevarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2020/1255 της Επιτροπής της
