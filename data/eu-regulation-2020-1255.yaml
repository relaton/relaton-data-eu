    κανονισμού (ΕΚ) αριθ. 1881/2006 όσον αφορά τον καθορισμό
    μέγιστων επιτρεπτών επιπέδων πολυκυκλικών
    αρωματικών υδρογονανθράκων (ΠΑΥ) στα καπνιστά
    με παραδοσιακό τρόπο κρέατα και καπνιστά προϊόντα
    με βάση το κρέας και στα καπνιστά με παραδοσιακό
    τρόπο ψάρια και καπνιστά προϊόντα αλιείας
    και για τον καθορισμό μέγιστου επιτρεπτού
    επιπέδου ΠΑΥ σε σκόνες τροφίμων φυτικής προέλευσης
    που χρησιμοποιούνται για την παρασκευή ποτών
  type: main
- language: et
  script: Latn
  content: Komisjoni Määrus (EL) 2020/1255, 7. september 2020, millega muudetakse
    määrust (EÜ) nr 1881/2006 seoses polütsükliliste aromaatsete süsivesinike
    piirnormidega traditsiooniliselt suitsutatud liha ja suitsulihatoodete ning traditsiooniliselt
    suitsutatud kala ja suitsutatud kalandustoodete puhul ning kehtestatakse polütsükliliste
    aromaatsete süsivesinike piirnormid jookide valmistamiseks kasutatavate taimse
    toidu pulbrite puhul
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2020/1255, annettu 7 päivänä syyskuuta 2020, asetuksen
    (EY) N:o 1881/2006 muuttamisesta siltä osin kuin on kyse polysyklisten aromaattisten
    hiilivetyjen (PAH-yhdisteet) enimmäismääristä perinteisesti savustetuissa
    lihoissa ja lihatuotteissa sekä perinteisesti savustetuissa kaloissa ja kalatuotteissa
    sekä PAH-yhdisteiden enimmäismäärien vahvistamisesta juomien valmistuksessa
    käytettävissä kasviperäisissä elintarvikejauheissa
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2020/1255 оd 7. rujna 2020. o izmjeni Uredbe (EZ)
    br. 1881/2006 u pogledu najvećih dopuštenih količina policikličkih aromatskih
    ugljikovodika (PAH) u tradicionalno dimljenom mesu i dimljenim mesnim proizvodima
    te tradicionalno dimljenoj ribi i dimljenim proizvodima ribarstva te o utvrđivanju
    najveće dopuštene količine PAH-ova u prahovima od hrane biljnog podrijetla
    koji se koriste u proizvodnji pića
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1255 rendelete (2020. szeptember 7.) az 1881/2006/EK
    rendeletnek a hagyományosan füstölt húsban és húskészítményekben, valamint
    a hagyományosan füstölt halban és halászati termékekben előforduló policiklikus
    aromás szénhidrogének (PAH-k) felső határértékei, valamint az italok elkészítéséhez
    használt növényi eredetű élelmiszerporokban előforduló PAH-k felső határértékének
    meghatározása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2020/1255 della Commissione del 7 settembre 2020 che modifica
    il regolamento (CE) n. 1881/2006 per quanto riguarda i tenori massimi di idrocarburi
    policiclici aromatici (IPA) nelle carni e nei prodotti a base di carne affumicati
    in modo tradizionale nonché nel pesce e nei prodotti della pesca affumicati in
    modo tradizionale e che fissa un tenore massimo di IPA negli alimenti di origine
    vegetale in polvere utilizzati per la preparazione di bevande
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2020/1255 (2020. gada 7. septembris), ar ko attiecībā
    uz policiklisko aromātisko ogļūdeņražu (PAO) maksimāli pieļaujamo koncentrāciju
    gan tradicionāli kūpinātā gaļā un kūpinātos gaļas produktos, gan tradicionāli
    kūpinātās zivīs un kūpinātos zivsaimniecības produktos groza Regulu (EK)
    Nr. 1881/2006 un nosaka maksimāli pieļaujamo PAO koncentrāciju augu izcelsmes
    pārtikas pulveros, ko izmanto dzērienu gatavošanā
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (ES) 2020/1255 2020 m. rugsėjo 7 d. kuriuo dėl
    didžiausios leidžiamosios policiklinių aromatinių angliavandenilių (PAA)
    koncentracijos tradiciniu būdu rūkytoje mėsoje bei rūkytos mėsos produktuose
    ir tradiciniu būdu rūkytose žuvyse bei rūkytuose žuvininkystės produktuose
    nustatymo iš dalies keičiamas Reglamentas (EB) Nr. 1881/2006 ir nustatoma didžiausia
    leidžiamoji PAA koncentracija gėrimams ruošti naudojamuose augalinio maisto
    milteliuose
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2020/1255 tas-7 ta’ Settembru 2020 li
    jemenda r-Regolament (KE) Nru 1881/2006 fir-rigward tal-livelli massimi ta’
    idrokarburi aromatiċi poliċikliċi (PAHs) fil-laħam affumikat u fil-prodotti
    tal-laħam affumikati b’mod tradizzjonali u fil-ħut affumikat u fil-prodotti
    tas-sajd affumikati b’mod tradizzjonali u li jistabbilixxi livell massimu ta’
    PAHs fit-trabijiet tal-ikel li joriġinaw mill-pjanti li jintużaw fil-preparazzjoni
    tax-xarbiet
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2020/1255 van de Commissie van 7 september 2020 tot wijziging
    van Verordening (EG) nr. 1881/2006 wat betreft de maximumgehalten aan polycyclische
    aromatische koolwaterstoffen (PAK’s) in traditioneel gerookt vlees en gerookte
    vleesproducten en traditioneel gerookte vis en gerookte visserijproducten en tot
    vaststelling van een maximumgehalte aan PAK’s in poeders van levensmiddelen
    van plantaardige oorsprong die voor de bereiding van dranken worden gebruikt
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2020/1255 z dnia 7 września 2020 r. zmieniające
    rozporządzenie (WE) nr 1881/2006 w odniesieniu do najwyższych dopuszczalnych
    poziomów wielopierścieniowych węglowodorów aromatycznych (WWA) w tradycyjnie
    wędzonych mięsach i produktach mięsnych oraz w tradycyjnie wędzonych rybach
    i produktach rybołówstwa, a także w sprawie ustalenia najwyższego dopuszczalnego
    poziomu WWA w żywności w proszku pochodzenia roślinnego wykorzystywanej do
    przyrządzania napojów
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2020/1255 da Comissão de 7 de setembro de 2020 que altera
    o Regulamento (CE) n.o 1881/2006 no que diz respeito aos teores máximos de hidrocarbonetos
    aromáticos policíclicos (PAH) presentes em carne fumada e produtos à base de
    carne fumados de modo tradicional e em peixe fumado e produtos da pesca fumados
    de modo tradicional e que estabelece um teor máximo de PAH em alimentos de origem
    vegetal em pó utilizados para a preparação de bebidas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2020/1255 al Comisiei din 7 septembrie 2020 de modificare
    a Regulamentului (CE) nr. 1881/2006 în ceea ce privește nivelurile maxime de
    hidrocarburi aromatice policiclice (HAP) prezente în carnea și produsele din
    carne afumate în mod tradițional și în peștele și produsele pescărești
    afumate în mod tradițional și de stabilire a unui nivel maxim de HAP în pulberile
    de alimente de origine vegetală utilizate pentru prepararea băuturilor
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2020/1255 zo 7. septembra 2020, ktorým sa mení
    nariadenie (ES) č. 1881/2006, pokiaľ ide o maximálne hodnoty obsahu polycyklických
    aromatických uhľovodíkov (PAU) v tradične údenom mäse a údených mäsových
    výrobkoch a v tradične údených rybách a údených produktoch rybolovu, a
    ktorým sa stanovujú maximálne hodnoty obsahu PAU v potravinách rastlinného
    pôvodu v prášku používaných na prípravu nápojov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2020/1255 z dne 7. septembra 2020 o spremembi Uredbe
    (ES) št. 1881/2006 glede mejnih vrednosti policikličnih aromatskih ogljikovodikov
    (PAO) v tradicionalno prekajenem mesu in prekajenih mesnih izdelkih ter tradicionalno
    prekajenih ribah in prekajenih ribiških proizvodih ter določitvi mejne vrednosti
    PAO v živilih rastlinskega izvora v prahu, ki se uporabljajo za pripravo pijač
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2020/1255 de la Comisión de 7 de septiembre de 2020 por
    el que se modifica el Reglamento (CE) n.o 1881/2006 en lo que respecta al contenido
    máximo de hidrocarburos aromáticos policíclicos (HAP) en la carne y los productos
    cárnicos ahumados del modo tradicional y en el pescado y los productos de la
    pesca ahumados del modo tradicional, y se establece un contenido máximo de HAP
    en los polvos de alimentos de origen vegetal utilizados para la preparación de
    bebidas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2020/1255 av den 7 september 2020 om ändring
    av förordning (EG) nr 1881/2006 vad gäller gränsvärden för polycykliska aromatiska
    kolväten (PAH) i traditionellt rökt kött och rökta köttprodukter samt traditionellt
    rökt fisk och rökta fiskeriprodukter, och fastställande av ett gränsvärde
    för PAH i livsmedelspulver av vegetabiliskt ursprung som används för framställning
    av drycker
  type: main
