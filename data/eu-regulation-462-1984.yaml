title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 462/84 of 22 February 1984 re-establishing
    the levying of customs duties on certain women' s, girls' and infants' woven suits
    and costumes, products of category 29 (code 0290), originating in Thailand, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 462/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    costumes-tailleurs et ensembles, tissés, pour femmes, fillettes et jeunes enfants,
    de la catégorie 29 (code 0290), originaires de Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 462/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Kostüme und Hosenanzüge, aus
    Geweben, für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 29 (Kennziffer
    0290), mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3570/83 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 462/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte dragter og kostumer, sæt, vævede,
    til kvinder, piger og småbørn, under varekategori nr. 29 (kode 0290), som har
    oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 462/84 της Επιτροπής
    της 22ας Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    κοστούμια—ταγιέρ και σύνολα, υφασμένα, για
    γυναίκες, κορασίδες και μικρά παιδιά, προϊόντα
    της κατηγορίας 29 (κωδικός 0290), καταγωγής Ταϋλάνδης,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 462/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli abiti a giacca e
    completi e insiemi composti, tessuti, per donna, per ragazza e per bambini, della
    categoria di prodotti n. 29 (codice 0290), originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 462/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    geweven mantelpakken en broekpakken voor dames, meisjes en kinderen, van de categorie
    van produkten nr. 29 (codenummer 0290), van oorsprong uit Thailand, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3570/83
    van de Raad
  type: main
