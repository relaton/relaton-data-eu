  script: Latn
  content: '92/182/EEC: Council Decision of 2 March 1992 concerning the conclusion
    of a Cooperation Agreement between the European Economic Community and COST third
    States on 11 concerted action projects in the field of food science and technology
    (Specific research and technological development programme '' Flair'' )'
  type: main
- language: fr
  script: Latn
  content: '92/182/CEE: Décision du Conseil du 2 mars 1992 concernant la conclusion
