  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2154 of 13 August 2021 supplementing
    Directive (EU) 2019/2034 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying appropriate criteria to identify
    categories of staff whose professional activities have a material impact on the
    risk profile of an investment firm or of the assets that it manages
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2154 de la Commission du 13 août 2021
    complétant la directive (UE) 2019/2034 du Parlement européen et du Conseil en
    ce qui concerne les normes techniques de réglementation précisant les critères
    permettant de recenser les catégories de personnel dont les activités professionnelles
    ont une incidence significative sur le profil de risque d’une entreprise d’investissement
    ou des actifs dont elle assure la gestion
  type: main
- language: de
  script: Latn
