    zur Ergänzung der Richtlinie (EU) 2019/2034 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards, die geeignete Kriterien zur
    Ermittlung von Kategorien von Mitarbeitern ergänzen, deren berufliche Tätigkeit
    sich wesentlich auf das Risikoprofil einer Wertpapierfirma oder der von ihr verwalteten
    Vermögenswerte auswirkt
  type: main
