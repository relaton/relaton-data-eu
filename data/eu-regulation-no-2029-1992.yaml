  script: Latn
  content: Commission Regulation (EEC) No 2029/92 of 22 July 1992 determining the
    extent to which applications lodged in July 1992 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2029/92 de la Commission, du 22 juillet 1992, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1992 pour certaines viandes de volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2029/92 der Kommission vom 22. Juli 1992 über das
    Ausmaß, in dem den im Juli 1992 für die Einfuhr von bestimmten Geflügelfleisch
    eingereichten Lizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2029/92 af 22. juli 1992 om fastlæggelse
    af, i hvilket omfang de ansøgninger om udstedelse af importlicenser, der er indgivet
    i juli 1992 for visse former for fjerkrækød, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2029/92 της Επιτροπής
