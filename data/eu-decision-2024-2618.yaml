id: EUDecision20242618
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2618 of 8 October 2024 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize DP202216 pursuant to Regulation (EC) No 1829/2003 of
    the European Parliament and of the Council (notified under document C(2024) 6941)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/2618 de la Commission du 8 octobre 2024
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié DP202216, consistant en ce maïs ou produits à partir de celui-ci, en
    application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2024) 6941]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/2618 der Kommission vom 8. Oktober 2024
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais DP202216 enthalten, aus ihm bestehen oder aus ihm hergestellt werden, gemäß
    der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen C(2024) 6941)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/2618 на Комисията
    от 8 октомври 2024 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица DP202216, в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2024) 6941)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/2618 ze dne 8. října 2024 o
    povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    DP202216, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2024)
    6941)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/2618 af 8. oktober 2024
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret DP202216-majs i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2024) 6941)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/2618 της Επιτροπής,
    της 8ης Οκτωβρίου 2024, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    DP202216 σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό C(2024) 6941]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2024/2618, 8. oktoober 2024, millega lubatakse
    viia turule geneetiliselt muundatud maisi DP202216 sisaldavaid, sellest koosnevaid
    või sellest toodetud tooteid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2024) 6941 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2024/2618, annettu 8 päivänä
    lokakuuta 2024, luvan antamisesta muuntogeenistä maissia DP202216 sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden saattamiseksi markkinoille
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2024) 6941)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2024/2618 ón gCoimisiún an 8 Deireadh
    Fómhair 2024 lena n-údaraítear táirgí ina bhfuil arbhar Indiach géinmhodhnaithe
    DP202216, nó atá comhdhéanta de nó a tháirgtear as, a chur ar an margadh
    de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa agus ón gComhairle
    (tugadh fógra faoi leis an doiciméad C(2024) 6941)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2024/2618 оd 8. listopada 2024. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    DP202216, od njega se sastoje ili su od njega proizvedeni, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2024) 6941)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2618 végrehajtási határozata (2024. október
    8.) a géntechnológiával módosított DP202216 kukoricát tartalmazó, abból
    álló vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK
    európai parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2024) 6941. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/2618 della Commissione, dell'8 ottobre
    2024, che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato DP202216 in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2024) 6941]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/2618 (2024. gada 8. oktobris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu DP202216,
    no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta numuru C(2024)
    6941)
  type: main
- language: lt
  script: Latn
  content: 2024 m. spalio 8 d. Komisijos įgyvendinimo sprendimas (ES) 2024/2618,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    DP202216 arba kurie iš jų sudaryti ar pagaminti (pranešta dokumentu Nr. C(2024)
    6941)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2618 tat-8
    ta’ Ottubru 2024 li tawtorizza l-introduzzjoni fis-suq ta’ prodotti li fihom
    il-qamħirrum ġenetikament modifikat DP202216, li jikkonsistu minnu, jew li huma
    prodotti minnu skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u
    tal-Kunsill (notifikata bid-dokument C(2024) 6941)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/2618 van de Commissie van 8 oktober 2024 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais DP202216 overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement
    en de Raad (Kennisgeving geschied onder nummer C(2024) 6941)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/2618 z dnia 8 października 2024 r.
    zezwalająca na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    kukurydzę DP202216, składających się z niej lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2024) 6941)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2024/2618 da Comissão, de 8 de outubro de
    2024, que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado DP202216 nos
    termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho [notificada
    com o número C(2024) 6941]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/2618 a Comisiei din 8 octombrie
    2024 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic DP202216, în temeiul Regulamentului
    (CE) nr. 1829/2003 al Parlamentului European și al Consiliului [notificată cu
    numărul C(2024) 6941]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/2618 z 8. októbra 2024, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    DP202216, sú z nej zložené alebo vyrobené [oznámené pod číslom C(2024)
    6941]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/2618 z dne 8. oktobra 2024 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo DP202216, so
    iz nje sestavljeni ali proizvedeni, v skladu z Uredbo (ES) št. 1829/2003 Evropskega
    parlamenta in Sveta (notificirano pod dokumentarno številko C(2024) 6941)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/2618 de la Comisión, de 8 de octubre
