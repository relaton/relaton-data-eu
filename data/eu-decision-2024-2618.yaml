    o estén compuestos por maíz modificado genéticamente DP202216 o hayan sido
    producidos a partir de él, con arreglo al Reglamento (CE) n.o 1829/2003 del Parlamento
    Europeo y del Consejo [notificada con el número C(2024) 6941]
  type: main
