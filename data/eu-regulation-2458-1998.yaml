    in euro van de bezoldigingen, de pensioenen en de andere geldelijke rechten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE, CECA, Euratom) nº 2458/98 do Conselho de 12 de Novembro
    de 1998 que altera o Regulamento (CEE, Euratom, CECA) nº 259/68 que fixa o Estatuto
    dos Funcionários das Comunidades Europeias, o Regime aplicável aos Outros Agentes
    destas Comunidades, assim como os outros regulamentos aplicáveis a esses funcionários
    e agentes, no que diz respeito à fixação em euros das remunerações, pensões
    e outros direitos pecuniários
  type: main
- language: es
  script: Latn
  content: Reglamento (CE, CECA, Euratom) nº 2458/98 del Consejo de 12 de noviembre
    de 1998 que modifica el Reglamento (CEE, Euratom, CECA) nº 259/68 por el que
    se establece el Estatuto de los funcionarios de las Comunidades Europeas, el régimen
    aplicable a otros agentes de estas Comunidades, así como los demás reglamentos
    aplicables a dichos funcionarios y agentes en lo relativo a la fijación de las
    retribuciones, pensiones y demás derechos pecuniarios en euros
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG, EKSG, Euratom) nr 2458/98 av den 12 november 1998
    om ändring av förordning (EEG, Euratom, EKSG) nr 259/68 om fastställande av
    tjänsteföreskrifter för tjänstemännen i Europeiska gemenskaperna och anställningsvillkor
    för övriga anställda i dessa gemenskaper samt andra förordningar som skall
    tillämpas på dessa tjänstemän och anställda i dessa gemenskaper vad avser
    fastställande av löner, pensioner och andra ekonomiska ersättningar i euro
  type: main
