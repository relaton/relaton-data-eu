title:
- language: en
  script: Latn
  content: Council Regulation (EC, ECSC, Euratom) No 2458/98 of 12 November 1998 amending
    Regulation (EEC, Euratom, ECSC) No 259/68 laying down the Staff Regulations of
    officials and the conditions of employment of other servants of the European Communities
    and the other Regulations applicable to them with regard to the establishment
    of remuneration, pensions and other financial entitlements in euros
  type: main
- language: fr
  script: Latn
  content: Règlement (CE, CECA, Euratom) nº 2458/98 du Conseil du 12 novembre 1998
    modifiant le règlement (CEE, Euratom, CECA) nº 259/68 fixant le statut des fonctionnaires
    des Communautés européennes, le régime applicable aux autres agents de ces
    Communautés, ainsi que les autres règlements applicables à ces fonctionnaires
    et agents de ces Communautés, en ce qui concerne la fixation des rémunérations,
    pensions et autres droits pécuniaires en euros
  type: main
- language: de
  script: Latn
  content: Verordnung (EG, EGKS, Euratom) Nr. 2458/98 des Rates vom 12. November 1998
    zur Änderung der Verordnung (EWG, Euratom, EGKS) Nr. 259/68 zur Festlegung des
    Statuts der Beamten der Europäischen Gemeinschaften, der Beschäftigungsbedingungen
    für die sonstigen Bediensteten dieser Gemeinschaften sowie der anderen auf die
    Beamten und sonstigen Bediensteten der Europäischen Gemeinschaften anwendbaren
    Verordnungen hinsichtlich der Festsetzung der Dienst- und Versorgungsbezüge und
    der sonstigen finanziellen Ansprüche in Euro
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF, EKSF, Euratom) nr. 2458/98 af 12. november 1998
    om ændring af forordning (EØF, Euratom, EKSF) nr. 259/68 om vedtægten for tjenestemænd
    ved De Europæiske Fællesskaber, ansættelsesvilkårene for de øvrige ansatte
    ved disse Fællesskaber samt de andre forordninger for tjenestemænd og øvrige
    ansatte vedrørende fastsættelse af vederlag, pensioner og andre beløb i euro
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ, ΕΚΑΧ, Ευρατόμ) αριθ. 2458/98
    του Συμβουλίου της 12ης Νοεμβρίου 1998 που τροποποιεί
    τον κανονισμό (ΕΟΚ, Ευρατόμ, ΕΚΑΧ) αριθ. 259/68
    περί καθορισμού του κανονισμού υπηρεσιακής
    κατάστασης των υπαλλήλων και του καθεστώτος
    που εφαρμόζεται επί του λοιπού προσωπικού
    των Ευρωπαϊκών Κοινοτήτων, καθώς και τους λοιπούς
    κανονισμούς που εφαρμόζονται στους εν λόγω
    υπαλλήλους και το λοιπό προσωπικό των Κοινοτήτων,
    όσον αφορά τον καθορισμό των αποδοχών, των
    συντάξεων και των λοιπών χρηματικών δικαιωμάτων
    σε ευρώ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY, EHTY, Euratom) N:o 2458/98, annettu 12 päivänä
    marraskuuta 1998, Euroopan yhteisöjen virkamiehiin sovellettavien henkilöstösääntöjen
