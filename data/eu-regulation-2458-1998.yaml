  type: main
- language: it
  script: Latn
  content: Regolamento (CE, CECA, Euratom) n. 2458/98 del Consiglio del 12 novembre
    1998 recante modifica del regolamento (CEE, Euratom, CECA) n. 259/68, che definisce
    lo statuto dei funzionari delle Comunità europee, il regime applicabile agli
    altri agenti di tali Comunità e gli altri regolamenti e regolamentazioni applicabili
    a detti funzionari e agenti delle Comunità per quanto riguarda la fissazione
    delle retribuzioni, pensioni e altri diritti pecuniari in euro
  type: main
- language: nl
  script: Latn
  content: Verordening (EG, EGKS, Euratom) nr. 2458/98 van de Raad van 12 november
    1998 tot wijziging van Verordening (EEG, Euratom, EGKS) nr. 259/68 van het Statuut
    van de ambtenaren van de Europese Gemeenschappen en de Regeling welke van toepassing
    is op de andere personeelsleden van de Gemeenschappen en van de andere verordeningen
