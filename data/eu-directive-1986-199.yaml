    VI към Директива 76/768/ЕИО на Съвета за сближаване
    на законодателствата на държавите-членки в
    областта на козметичните продукти
  type: main
- language: cs
  script: Latn
  content: Osmá směrnice Komise ze dne 26. března 1986, kterou se přizpůsobují
    technickému pokroku přílohy II, IV a VI směrnice Rady 76/768/EHS o sbližování
    právních předpisů členských států týkajících se kosmetických prostředků
  type: main
- language: da
  script: Latn
  content: Kommissionens ottende direktiv 86/199/EØF af 26. marts 1986 om tilpasning
    til den tekniske udvikling af bilag II, IV og VI til Rådets direktiv 76/768/EØF
    om indbyrdes tilnærmelse af medlemsstaternes lovgivning om kosmetiske midler
  type: main
- language: el
  script: Grek
  content: Όγδοη οδηγία 86/199/ΕΟΚ της Επιτροπής της
    26ης Μαρτίου 1986 που προσαρμόζει στην τεχνική
    πρόοδο τα παραρτήματα ΙΙ, IV και VI της οδηγίας
    76/768/ΕΟΚ του Συμβουλίου περί προσέγγισης των
    νομοθεσιών των κρατών μελών σχετικά με τα καλλυντικά
  type: main
- language: et
  script: Latn
  content: Kaheksas komisjoni direktiiv, 26. märts 1986, millega kohandatakse tehnika
    arengule liikmesriikides kosmeetikatoodete kohta vastuvõetud õigusaktide ühtlustamist
    käsitleva nõukogu direktiivi 76/768/EMÜ II, IV ja VI lisa
  type: main
- language: fi
  script: Latn
  content: Kahdeksas komission direktiivi 86/199/ETY, annettu 26 päivänä maaliskuuta
    1986, kosmeettisia valmisteita koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun neuvoston direktiivin 76/768/ETY liitteiden II, IV, ja VI mukauttamisesta
    tekniikan kehitykseen
  type: main
- language: hr
  script: Latn
  content: '86/199/EEZ: Osma Direktiva Komisije od 26. ožujka 1986. o prilagodbi
    tehničkom napretku priloga II., IV. i VI. Direktivi Vijeća 76/768/EEZ o usklađivanju
    zakonodavstava država članica u odnosu na kozmetičke proizvode'
  type: main
- language: hu
  script: Latn
  content: A Bizottság nyolcadik irányelve (1986. március 26.) a kozmetikai termékekre
