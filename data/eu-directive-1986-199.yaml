    su kosmetikos gaminiais, suderinimo II, IV ir VI priedus
  type: main
- language: mt
  script: Latn
  content: It-tminn Direttiva tal-Kummissjoni tas-26 ta' Marzu 1986 li taddatta għall-progress
    tekniku l-Annessi II, IV u VI tad-Direttiva tal-Kunsill 76/768/KEE dwar l-approssimazzjoni
    tal-liġijiet ta' l-Istati Membri li għandhom x'jaqsmu mal-prodotti kosmetiċi
  type: main
- language: nl
  script: Latn
  content: Achtste Richtlijn 86/199/EEG van de Commissie van 26 maart 1986 tot aanpassing
    aan de vooruitgang van de techniek van de bijlagen II, IV en VI van Richtlijn
    76/768/EEG van de Raad betreffende de onderlinge aanpassing van de wetgevingen
    der Lid-Staten inzake kosmetische produkten
  type: main
- language: pl
  script: Latn
  content: Ósma dyrektywa Komisji z dnia 26 marca 1986 r. dostosowująca do postępu
    technicznego załączniki II, IV i VI do dyrektywy Rady 76/768/EWG w sprawie zbliżenia
    ustawodawstw Państw Członkowskich odnoszących się do produktów kosmetycznych
  type: main
- language: pt
  script: Latn
  content: Oitava Directiva 86/199/CEE da Comissão de 26 de Março de 1986 que adapta
    ao progresso técnico os anexos II, IV e VI da Directiva 76/768/CEE do Conselho
    relativa à aproximação das legislações dos Estados-Membros respeitantes aos
    produtos cosméticos
  type: main
- language: ro
  script: Latn
  content: A opta Directivă a Comisiei din 26 martie 1986 de adaptare la progresul
    tehnic a anexelor II, IV și VI la Directiva 76/768/CEE a Consiliului privind
    apropierea legislației statelor membre cu privire laprodusele cosmetice
  type: main
- language: sk
  script: Latn
  content: Ôsma smernica Komisie z 26. marca 1986, ktorá prispôsobuje technickému
    pokroku prílohy II, IV a VI smernice Rady 76/768/EHS o aproximácii právnych
    predpisov členských štátov vzťahujúcich sa na kozmetické výrobky
  type: main
- language: sl
  script: Latn
  content: Osma direktiva Komisije z dne 26. marca 1986 o prilagoditvi Prilog II,
    IV in VI Direktive Sveta 76/768/EGS o približevanju zakonodaje držav članic
    v zvezi s kozmetičnimi izdelki tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Octava Directiva 86/199/CEE de la Comisión de 26 de marzo de 1986 por
    la que se adaptan al progreso técnico los Anexos II, IV y VI de la Directiva
    76/768/CEE del Consejo relativa a la aproximación de las legislaciones de los
    Estados Miembros en materia de productos domésticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens åttonde direktiv 86/199/EEG av den 26 mars 1986 om anpassning
