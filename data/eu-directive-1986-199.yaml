title:
- language: en
  script: Latn
  content: Eighth Commission Directive 86/199/EEC of 26 March 1986 adapting to technical
    progress Annexes II, IV and VI to Council Directive 76/768/EEC on the approximation
    of the laws of the Member States relating to cosmetic products
  type: main
- language: fr
  script: Latn
  content: Huitième directive 86/199/CEE de la Commission du 26 mars 1986 portant
    adaptation au progrès technique des annexes II, IV et VI de la directive 76/768/CEE
    du Conseil concernant le rapprochement des législations des États membres relatives
    aux cosmétiques
  type: main
- language: de
  script: Latn
  content: Achte Richtlinie 86/199/EWG der Kommission vom 26. März 1986 zur Anpassung
    der Anhänge II, IV und VI der Richtlinie 76/768/EWG des Rates zur Angleichung
    der Rechtsvorschriften der Mitgliedstaaten über kosmetische Mittel an den technischen
    Fortschritt
  type: main
- language: bg
  script: Cyrl
  content: Осма Директива на Комисията от 26 март 1986
    година относно адаптиране към постиженията
