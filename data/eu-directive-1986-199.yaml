    irányelv II., IV. és VI. mellékletének a műszaki fejlődéshez történő
    hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Ottava direttiva 86/199/CEE della Commissione del 26 marzo 1986 che adegua
