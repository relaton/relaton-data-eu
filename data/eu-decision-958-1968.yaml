title:
- language: fr
  script: Latn
  content: Décision n° 958/68/CECA de la Commission, du 25 juin 1968, autorisant
    le gouvernement de la République fédérale d'Allemagne à modifier la dénomination
    d'un contingent d'importation à droit nul dans le cadre des mesures tarifaires
    semestrielles arrêtées pour le premier semestre 1968
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 958/68/EGKS der Kommission vom 25. Juni 1968, mit der
    die Bundesrepublik Deutschland ermächtigt wird, die Benennung eines zollfreien
    Einfuhrkontingents im Rahmen der für das erste Halbjahr 1968 getroffenen halbjährlichen
    Zollmaßnahmen zu ändern
  type: main
- language: it
  script: Latn
  content: DECISIONE N. 958/68/CECA DELLA COMMISSIONE, DEL 25 GIUGNO 1968, CHE AUTORIZZA
    IL GOVERNO DELLA REPUBBLICA FEDERALE DI GERMANIA A MODIFICARE LA DENOMINAZIONE
    DI UN CONTINGENTE DI IMPORTAZIONE IN ESENZIONE DOGANALE NELL' AMBITO DELLE MISURE
    DOGANALI ADOTTATE PER IL PRIMO SEMESTRE 1968
  type: main
- language: nl
  script: Latn
  content: '958/68/EGKS: Beschikking nr. 958/68/EGKS van de Commissie van 25 juni
    1968 houdende machtiging van de Bondsrepubliek Duitsland tot wijziging van de
    omschrijving van een invoercontingent met vrijdom van recht in het kader van de
    halfjaarlijkse douanemaatregelen, vastgesteld voor het eerste halfjaar van 1968'
  type: main
