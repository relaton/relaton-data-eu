  content: Commission Regulation (EEC) No 829/92 of 1 April 1992 amending Regulation
    (EEC) No 598/86 concerning the target ceiling for the 1991/92 marketing year for
    imports into Spain of common wheat of bread-making quality
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 829/92 de la Commission du 1er avril 1992 modifiant
    le règlement (CEE) n° 598/86 en ce qui concerne le plafond indicatif d'importation
    de froment tendre panifiable en Espagne pour la campagne 1991/1992
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 829/92 DER KOMMISSION vom 1. April 1992 zur Änderung
