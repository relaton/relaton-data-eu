    die Einfuhr von backfähigem Weichweizen nach Spanien im Wirtschaftsjahr 1991/92
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 829/92 af 1. april 1992 om ændring
