    in Spagna di frumento tenero panificabile per la campagna 1991/1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 829/92 VAN DE COMMISSIE van 1 april 1992 tot wijziging
