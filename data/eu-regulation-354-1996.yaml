title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 354/96 of 28 February 1996 amending Regulations
    (EEC) No 2699/93 and (EC) No 1559/94 and fixing the available quantities for the
    period 1 April to 30 June 1996 under the Community tariff quotas provided for
    in the Europe Agreements pursuant to Council Regulation (EC) No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 354/96 de la Commission, du 28 février 1996, modifiant
    les règlements (CEE) nº 2699/93 et (CE) nº 1559/94, et fixant les quantités
    disponibles pour la période du 1er avril au 30 juin 1996, dans le cadre des contingents
    tarifaires communautaires prévus par les accords européens, conformément au
    règlement (CE) nº 3066/95 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 354/96 der Kommission vom 28. Februar 1996 zur Änderung
    der Verordnungen (EWG) Nr. 2699/93 und (EG) Nr. 1559/94 und zur Festsetzung der
    für den Zeitraum 1. April bis 30. Juni 1996 im Rahmen der in den Europa-Abkommen
    vorgesehenen gemeinschaftlichen Zollkontingente gemäß der Verordnung (EG) Nr.
    3066/95 des Rates verfügbaren Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 354/96 af 28. februar 1996 om ændring
    af forordning (EØF) nr. 2699/93 og (EF) nr. 1599/94 og om fastsættelse af de
    mængder, der er til rådighed for perioden fra den 1. april til den 30. juni
    1996 i forbindelse med de EF-toldkontingenter, der er fastsat i Europaaftalerne,
    jf. Rådets forordning (EF) nr. 3066/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 354/96 της Επιτροπής,
    της 28ης Φεβρουαρίου 1996, για τροποποίηση των
    κανονισμών (ΕΟΚ) αριθ. 2699/93 και (ΕΚ) αριθ. 1559/94
    και για τον καθορισμό των διαθέσιμων ποσοτήτων,
    για την περίοδο από 1ης Απριλίου έως 30 Ιουνίου
    1996, στο πλαίσιο των κοινοτικών δασμολογικών
    ποσοστώσεων που προβλέπονται στις ευρωπαϊκές
    συμφωνίες, σύμφωνα με τον κανονισμό (ΕΚ) αριθ.
    3066/95 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 354/96, annettu 28 päivänä helmikuuta 1996,
    asetusten (ETY) N:o 2699/93 ja (EY) N:o 1559/94 muuttamisesta ja käytettävissä
    olevien määrien vahvistamisesta 1 päivän huhtikuuta ja 30 päivän kesäkuuta
    1996 väliseksi kaudeksi Eurooppa-sopimuksissa määrättyjen yhteisön tariffikiintiöiden
    osalta neuvoston asetuksen (EY) N:o 3066/95 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 354/96 della Commissione, del 28 febbraio 1996, che
    modifica i regolamenti (CEE) n. 2699/93 e (CE) n. 1559/94 e stabilisce i quantitativi
    disponibili, nel settore del pollame e delle uova, per il periodo compreso tra
    il 1ºaprile e il 30 giugno 1996, nel quadro dei contingenti tariffari comunitari
    previsti dagli accordi europei, conformemente al regolamento (CE) n. 3066/95 del
    Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 354/96 van de Commissie van 28 februari 1996 tot wijziging,
    overeenkomstig Verordening (EG) nr. 3066/95 van de Raad, van de Verordeningen
    (EEG) nr. 2699/93 en (EG) nr. 1559/94 en vaststelling van de hoeveelheden die
    voor de periode van 1 april tot en met 30 juni 1996 beschikbaar zijn in het kader
    van bij de Europa-Overeenkomsten vastgestelde communautaire tariefcontingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 354/96 da Comissão, de 28 de Fevereiro de 1996, que
    altera os Regulamentos (CEE) nº 2699/93 e (CE) nº 1559/94 e fixa as quantidades
    disponíveis para o período compreendido entre 1 de Abril e 30 de Junho de 1996
    no âmbito dos contingentes pautais comunitários previstos pelos acordos europeus,
    em conformidade com o Regulamento (CE) nº 3066/95 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 354/96 de la Comisión, de 28 de febrero de 1996, por
    el que se modifican los Reglamentos (CEE) nº 2699/93 y (CE) nº 1559/94 y se
    fijan las cantidades disponibles para el período comprendido entre el 1 de abril
    y el 30 de junio de 1996, dentro de los contingentes arancelarios comunitarios
    establecidos en los Acuerdos europeos, de conformidad con el Reglamento (CE) nº
    3066/95 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 354/96 av den 28 februari 1996 om ändring
    av förordningar (EEG) nr 2699/93 och (EG) nr 1559/94, och om fastställande av
    de disponibla kvantiteterna för perioden 1 april-30 juni 1996, inom ramen för
    de gemenskapstullkvoter som föreskrivs i Europaavtalen i enlighet med rådets
    förordning (EG) nr 3066/95
