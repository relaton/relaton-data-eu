  content: Tenth Council Directive 84/386/EEC of 31 July 1984 on the harmonization
    of the laws of the Member States relating to turnover taxes, amending Directive
    77/388/EEC - Application of value added tax to the hiring out of movable tangible
    property
  type: main
- language: fr
  script: Latn
