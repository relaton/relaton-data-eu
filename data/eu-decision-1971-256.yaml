title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 juin 1971, autorisant la République
    française à exclure du traitement communautaire l'urée, des positions 29.05
    A I et 31.02 B du Tarif douanier commun, originaire de certains pays de l'Est
    et mise en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/256/EWG: Entscheidung der Kommission vom 17. Juni 1971, mit der die
    Französische Republik ermächtigt wird, die aus bestimmten Ostländern stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen Harnstoffe
    der Tarifnummern 29.25 A I und 31.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/256/CEE: Decisione della Commissione, del 17 giugno 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario l''urea, delle
    voci 29.25 A I e 31.02 B della tariffa doganale comune, originaria di taluni paesi
    dell''Est e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/256/EEG: Beschikking van de Commissie van 17 juni 1971 waarbij de Republiek
    Frankrijk wordt gemachtigd het ureum van de posten 29.25 A I en 31.02 B van het
    gemeenschappelijk douanetarief, van oorsprong uit sommige oostelijke landen en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandelingen
    uit te sluiten'
  type: main
