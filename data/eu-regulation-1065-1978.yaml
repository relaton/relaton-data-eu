id: EURegulation10651978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1065/78 of 22 May 1978 re-establishing the
    levying of customs duties on narrow woven fabrics, and marrow fabrics (bolduc)
    consisting of warp without weft assembled by means of an adhesive, falling within
    heading No 58.05 and originating in developing countries, to which the preferential
    tariff arrangements set out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1065/78 de la Commission, du 22 mai 1978, portant
    rétablissement de la perception des droits de douane applicables à la rubanerie
    et aux rubans sans trame en fils ou fibres, parallélisés et encollés, de la
    position tarifaire 58.05, originaires des pays et territoires en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1065/78 der Kommission vom 22. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Bänder und schußlose Bänder aus parallel gelegten und geklebten
    Garnen der Tarifnummer 58.05, mit Ursprung in Entwicklungsländern, denen die
    in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1065/78 af 22. maj 1978 om genindførelse
    af opkrævning af toldafgifter for vævede bånd og bånd bestående af sammenlimede
    parallelle garner eller fibre, under position 58.05, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1065/78 della Commissione, del 22 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai nastri, galloni e simili,
    nastri senza trama di fibre o di fili disposti parallelamente ed incollati, della
    voce doganale 58.05, originari dei paesi in via di sviluppo, beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1065/78 van de Commissie van 22 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lint, alsmede
    bolduclint, zijnde lint zonder inslag van aaneengelijmde evenwijdig lopende draden
    of textielvezels, van post 58.05, van oorsprong uit de ontwikkelingslanden, ten
    behoeve waarvan bij Verordening (EEG) nr. 2706/77 van de Raad tariefpreferenties
    werden geopend
  type: main
