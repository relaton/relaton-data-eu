title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1246/70 de la Commission, du 29 juin 1970, fixant les
    taux des restitutions applicables, à compter du 1er juillet 1970, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1246/70 der Kommission vom 29. Juni 1970 zur Festsetzung
    der ab 1. Juli 1970 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1246/70 della Commissione, del 29 giugno 1970, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 luglio 1970, a
    taluni prodotti dei settori dei cereali e del riso esportati sotto forma di merci
    non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1246/70 van de Commissie van 29 juni 1970 houdende
    vaststelling van de restituties die met ingang van 1 juli 1970 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
  type: main
