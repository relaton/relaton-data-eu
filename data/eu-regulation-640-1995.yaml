  content: COMMISSION REGULATION (EC) No 640/95 of 24 March 1995 laying down the extent
    to which applications lodged on 20 and 21 March 1995 for certificates for the
    advance-fixing of the export refund for certain poultrymeat products may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 640/95 DE LA COMMISSION du 24 mars 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats de
    préfixation de la restitution à l'exportation de certains produits du secteur
    de la viande de volaille introduites les 20 et 21 mars 1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 640/95 DER KOMMISSION vom 24. März 1995 zur Bestimmung
