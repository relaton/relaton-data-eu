title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1203 of 12 July 2019 determining
    that a temporary suspension of the preferential customs duty is not appropriate
    for imports of bananas originating in Guatemala
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1203 de la Commission du 12 juillet 2019
    déterminant qu'une suspension temporaire du droit de douane préférentiel n'est
    pas appropriée dans le cas des importations de bananes originaires du Guatemala
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1203 der Kommission vom 12. Juli 2019
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls für
    Einfuhren von Bananen mit Ursprung in Guatemala nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2019/1203 на Комисията
    от 12 юли 2019 година за определяне на временното
    спиране на прилагането на преференциалното
    мито за нецелесъобразно по отношение на вноса
    на банани с произход от Гватемала
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1203 ze dne 12. července 2019,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby není
    vhodné pro dovoz banánů pocházejících z Guatemaly
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/1203 af 12. juli 2019
    om fastsættelse af, at en midlertidig suspension af præferencetolden ikke er
    hensigtsmæssig for import af bananer med oprindelse i Guatemala
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/1203 της Επιτροπής,
    της 12ης Ιουλίου 2019, η οποία ορίζει ότι δεν είναι
    σκόπιμη η προσωρινή αναστολή του προτιμησιακού
    δασμού για τις εισαγωγές μπανανών καταγωγής
    Γουατεμάλας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/1203, 12. juuli 2019, milles sätestatakse,
    et Guatemalast pärit banaanide impordi suhtes kehtiva soodustollimaksu ajutine
    peatamine ei ole asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/1203, annettu 12 päivänä
    heinäkuuta 2019, sen määrittämisestä, että etuustullin väliaikainen suspendoiminen
    ei ole aiheellista Guatemalasta peräisin olevien banaanien tuonnissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1203 оd 12. srpnja 2019. kojom se
    utvrđuje da privremena obustava povlaštenih carina nije primjerena za uvoz banana
    podrijetlom iz Gvatemale
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1203 végrehajtási határozata (2019. július 12.)
    a Guatemalából származó banán behozatalára alkalmazott kedvezményes vámtételek
    ideiglenes felfüggesztése nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/1203 della Commissione, del 12 luglio
    2019, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    non è appropriata per le importazioni di banane originarie del Guatemala
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1203 (2019. gada 12. jūlijs),
    ar ko nosaka, ka atvieglotā muitas nodokļa pagaidu atcelšana Gvatemalas izcelsmes
    banānu importam nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 12 d. Komisijos įgyvendinimo sprendimas (ES) 2019/1203,
    kuriuo nustatoma, kad laikinas lengvatinės muito normos taikymo sustabdymas importuojamiems
    Gvatemalos kilmės bananams yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1203 tat-12
    ta' Lulju 2019 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali
    preferenzjali mhijiex xierqa għal importazzjonijiet tal-banana li joriġinaw
    mill-Gwatemala
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/1203 van de Commissie van 12 juli 2019 waarbij
    wordt bepaald dat een tijdelijke opschorting van het preferentiële douanerecht
    niet passend is voor de invoer van bananen van oorsprong uit Guatemala
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/1203 z dnia 12 lipca 2019 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła nie jest odpowiednie w odniesieniu
    do przywozu bananów pochodzących z Gwatemali
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1203 da Comissão, de 12 de julho de 2019,
    que determina que a suspensão temporária do direito aduaneiro preferencial não
    é adequada para as importações de bananas originárias da Guatemala
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1203 a Comisiei din 12 iulie 2019
    de stabilire a faptului că o suspendare temporară a taxei vamale preferențiale
    nu este adecvată pentru importurile de banane originare din Guatemala
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1203 z 12. júla 2019, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla nie je primerané pre
    dovoz banánov s pôvodom v Guatemale
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/1203 z dne 12. julija 2019 o ugotovitvi,
    da začasna opustitev preferencialne carine ni primerna za uvoz banan s poreklom
    iz Gvatemale
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/1203 de la Comisión, de 12 de julio
    de 2019, por la que se determina que una suspensión temporal del arancel aduanero
    preferencial no es apropiada en el caso de las importaciones de plátanos (bananas)
    originarios de Guatemala
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/1203 av den 12 juli 2019 om
    fastställande av att ett tillfälligt upphävande av förmånstullarna inte är
    lämpligt för import av bananer med ursprung i Guatemala
  type: main
