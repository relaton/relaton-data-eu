  content: Council Regulation (EEC) No 1212/79 of 19 June 1979 amending Regulation
    (EEC) No 1418/78 adopting general rules in connection with the special measures
    for peas and field beans used in the feeding of animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1212/79 du Conseil, du 19 juin 1979, modifiant le
    règlement (CEE) n° 1418/78 arrêtant les règles générales relatives aux mesures
    spéciales pour les pois, fèves et féveroles utilisés dans l' alimentation
    des animaux
  type: main
- language: de
  script: Latn
