    der Verordnung (EWG) Nr. 1418/78 zur Festsetzung der Grundregeln betreffend die
    besonderen Maßnahmen für zu Futterzwecken verwendete Erbsen und Ackerbohnen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1212/79 af 19. juni 1979 om ændring af forordning
