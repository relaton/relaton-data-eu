  script: Latn
  content: Reglamento (CE) n° 1288/2005 de la Comisión, de 4 de agosto de 2005,
    por el que se abre una investigación referente a la posible elusión de las medidas
    antidumping impuestas por el Reglamento (CE) n° 964/2003 del Consejo sobre las
    importaciones de determinados accesorios de tubería, de hierro o de acero, originarios
    de la República Popular de China, entre otros países, mediante importaciones
