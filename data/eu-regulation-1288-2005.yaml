title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1288/2005 of 4 August 2005 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 964/2003 on imports of certain tube or pipe fittings,
    of iron or steel originating, inter alia, in the People’s Republic of China
    by imports of certain tube or pipe fittings, of iron or steel, consigned from
    the Philippines, whether declared as originating in the Philippines or not, and
    making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1288/2005 de la Commission du 4 août 2005 ouvrant
    une enquête sur le contournement éventuel des mesures antidumping instituées
    par le règlement (CE) n° 964/2003 du Conseil sur les importations de certains
    accessoires de tuyauterie, en fer ou en acier, originaires, entre autres, de la
    République populaire de Chine par des importations de certains accessoires de
    tuyauterie, en fer ou en acier, expédiés des Philippines, qu’ils aient ou
    non été déclarés originaires de ce pays, et soumettant ces importations à
    enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1288/2005 der Kommission vom 4. August 2005 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 964/2003 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke und Rohrverbindungsstücke
    aus Eisen oder Stahl mit Ursprung unter anderem in der Volksrepublik China durch
    die Einfuhren bestimmter aus den Philippinen versandter Rohrformstücke, Rohrverschlussstücke
    und Rohrverbindungsstücke aus Eisen oder Stahl, ob als Ursprungserzeugnisse der
    Philippinen angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
