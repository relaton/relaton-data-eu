    som genom rådets förordning (EG) nr 964/2003 infördes beträffande import av
    vissa rördelar av järn eller stål med ursprung bl.a. i Folkrepubliken Kina
    genom import av vissa rördelar av järn eller stål som avsänts från Republiken
    Filippinerna, oavsett om de deklarerats ha sitt ursprung i Republiken Filippinerna
    eller ej, och om registrering av sådan import
