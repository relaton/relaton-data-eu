    št. 964/2003, na uvoz nekaterega pribora (fitingov) za cevi iz železa ali jekla
    s poreklom, med drugim, iz Ljudske republike Kitajske, pri uvozu nekaterega pribora
    (fitingov) za cevi iz železa ali jekla, poslanega iz Filipinov, ne glede na to,
    ali je prijavljen kot izdelek s poreklom iz Filipinov ali ne, in o registraciji
    takšnega uvoza
  type: main
