title:
- language: en
  script: Latn
  content: Directive 2001/41/EC of the European Parliament and of the Council of 19
    June 2001 amending, for the twenty-first time, Council Directive 76/769/EEC on
    the approximation of the laws, regulations and administrative provisions of the
    Member States relating to restrictions on the marketing and use of certain dangerous
    substances and preparations, as regards substances classified as carcinogens,
    mutagens or substances toxic to reproduction
  type: main
- language: fr
  script: Latn
  content: Directive 2001/41/CE du Parlement européen et du Conseil du 19 juin 2001
    portant vingt-et-unième modification de la directive 76/769/CEE du Conseil concernant
    le rapprochement des dispositions législatives, réglementaires et administratives
    des États membres relatives à la limitation de la mise sur le marché et de
    l'emploi de certaines substances et préparations dangereuses, en ce qui concerne
    les substances classées cancérogènes, mutagènes ou toxiques pour la reproduction
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/41/EG des Europäischen Parlaments und des Rates vom 19.
    Juni 2001 zur 21. Änderung der Richtlinie 76/769/EWG des Rates zur Angleichung
    der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten für Beschränkungen
    des Inverkehrbringens und der Verwendung gewisser gefährlicher Stoffe und Zubereitungen
    hinsichtlich der als krebserzeugend, erbgutverändernd bzw. fortpflanzungsgefährdend
    eingestuften Stoffe
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/41/ЕО на Европейския парламент
    и на Съвета от 19 юни 2001 година относно двадесет
    и първо изменение на Директива 76/769/ЕИО на Съвета
    за сближаване на законовите, подзаконовите
    и административните разпоредби на държавите-членки
    относно ограниченията за пускането на пазара
    и употребата на някои опасни вещества и препарати,
    по отношение на вещества класифицирани като
    канцерогенни, мутагенни или токсични за репродукцията
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2001/41/ES ze dne 19. června 2001,
    kterou se po dvacáté první mění směrnice Rady 76/769/EHS o sbližování
    právních a správních předpisů členských států týkajících se omezení
    uvádění na trh a používání některých nebezpečných látek a přípravků,
    s ohledem na látky klasifikované jako karcinogeny, mutageny a látky toxické
    pro reprodukci
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2001/41/EF af 19. juni 2001 om
    enogtyvende ændring af Rådets direktiv 76/769/EØF om indbyrdes tilnærmelse
    af medlemsstaternes administrativt eller ved lov fastsatte bestemmelser om begrænsning
    af markedsføring og anvendelse af visse farlige stoffer og præparater for så
    vidt angår stoffer, der er klassificeret som kræftfremkaldende, mutagene eller
    reproduktionstoksiske
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/41/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 19ης Ιουνίου 2001, για
    21η τροποποίηση της οδηγίας 76/769/ΕΟΚ του Συμβουλίου
    για προσέγγιση των νομοθετικών, κανονιστικών
    και διοικητικών διατάξεων των κρατών μελών
    που αφορούν περιορισμούς κυκλοφορίας στην
    αγορά και χρήσης μερικών επικίνδυνων ουσιών
    και παρασκευασμάτων, όσον αφορά τις ουσίες
    που έχουν ταξινομηθεί ως καρκινογόνες, μεταλλαξιογόνες
    ή τοξικές για την αναπαραγωγή
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2001/41/EÜ, 19. juuni 2001, millega
    kahekümne esimest korda muudetakse direktiivi 76/769/EMÜ liikmesriikide õigus-
    ja haldusnormide ühtlustamise kohta seoses teatavate ohtlike ainete ja valmististe
    turustamise ja kasutamise piirangutega seoses ainetega, mis on liigitatud kantserogeenseks,
    mutageenseks või reproduktiivtoksiliseks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2001/41/EY, annettu 19 päivänä
    kesäkuuta 2001, tiettyjen vaarallisten aineiden ja valmisteiden markkinoille
    saattamisen ja käytön rajoituksia koskevien jäsenvaltioiden lakien, asetusten
    ja hallinnollisten määräysten lähentämisestä annetun neuvoston direktiivin
    76/769/ETY muuttamisesta kahdennenkymmenennenensimmäisen kerran syöpää tai
    perimän muutoksia aiheuttaviksi tai lisääntymiselle vaarallisiksi luokiteltavien
    aineiden osalta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2001/41/EZ Europskog parlamenta i Vijeća od 19. lipnja 2001.
    o dvadeset prvoj izmjeni Direktive Vijeća 76/769/EEZ o usklađivanju zakona i
    ostalih propisa država članica u odnosu na ograničenja stavljanja na tržište
    i uporabe određenih opasnih tvari i pripravaka, s obzirom na tvari koje su razvrstane
    kao karcinogene, mutagene ili tvari toksične za reprodukciju
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2001/41/EK irányelve (2001. június
    19.) az egyes veszélyes anyagok és készítmények forgalomba hozatalának és
    felhasználásának korlátozásaira vonatkozó tagállami törvényi, rendeleti
    és közigazgatási rendelkezések közelítéséről szóló 76/769/EGK tanácsi
    irányelv huszonegyedik alkalommal a karcinogénnek, mutagénnek vagy a reprodukciót
    károsító hatásúnak minősített anyagok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/41/CE del Parlamento europeo e del Consiglio, del 19 giugno
    2001, recante ventunesima modifica della direttiva 76/769/CEE del Consiglio concernente
    il ravvicinamento delle disposizioni legislative, regolamentari ed amministrative
    degli Stati membri relative alle restrizioni in materia di immissione sul mercato
    e di uso di talune sostanze e preparati pericolosi, per quanto riguarda le sostanze
    classificate come cancerogene, mutagene o tossiche per la riproduzione
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2001/41/EK (2001. gada 19. jūnijs),
    ar kuru divdesmit pirmo reizi groza Padomes Direktīvu 76/769/EEK par dalībvalstu
    normatīvo un administratīvo aktu tuvināšanu attiecībā uz dažu bīstamu
    vielu un preparātu tirgū laišanas un lietošanas ierobežojumiem, kas attiecas
    uz kancerogēnām, mutagēnām vai reproduktīvajai funkcijai toksiskām vielām
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 19 d. Europos Parlamento ir Tarybos direktyva 2001/41/EB
    dvidešimt pirmą kartą iš dalies keičianti Direktyvą 76/769/EEB dėl valstybių
    narių įstatymų ir kitų teisės aktų, susijusių su tam tikrų pavojingų
    medžiagų ir preparatų pardavimo ir naudojimo apribojimais, suderinimo dėl
    medžiagų, klasifikuojamų kaip kancerogenai, mutagenai arba medžiagos toksiškos
    reprodukcijai
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2001/41/KE tal-Parlament Ewropew u tal-Kunsill tad-19 ta'
    Ġunju 2001 li temenda, għall-wieħed u għoxrin darba d-Direttiva tal-Kunsill
    76/769/KEE dwar l-approssimazzjoni tal-liġijiet, ir-regolamenti u dr;-disposizzjonijiet
    amministrattivi ta' l-Istati Membri li għandhom x'jaqsmu mar-restrizzjonijiet
    dwar il-marketing u l-użu ta' ċerti sustanzi u preparazzjonijiet perikolużi,
    fir-rigward ta' sustanzi kklassifikati bħala karċinoġeni, mutaġeni jew sustanzi
    tossiċi għar-riproduzzjoni
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2001/41/EG van het Europees Parlement en de Raad van 19 juni
    2001 houdende 21e wĳziging van Richtlĳn 76/769/EEG van de Raad betreffende de
    onderlinge aanpassing van de wettelĳke en bestuursrechtelĳke bepalingen der
    lidstaten inzake de beperking van het op de markt brengen en van het gebruik van
    bepaalde gevaarlĳke stoffen en preparaten (stoffen die als kankerverwekkend,
    mutageen of vergiftig voor de voortplanting zĳn ingedeeld)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2001/41/WE Parlamentu Europejskiego i Rady z dnia 19 czerwca
    2001 r. zmieniająca po raz dwudziesty pierwszy dyrektywę Rady 76/769/EWG w sprawie
    zbliżenia przepisów ustawowych, wykonawczych i administracyjnych Państw Członkowskich
    odnoszących się do ograniczeń we wprowadzaniu do obrotu i stosowaniu niektórych
    substancji i preparatów niebezpiecznych w zakresie substancji sklasyfikowanych
    jako substancje kancerogenne, mutagenne lub toksyczne ze względu na zagrożenie
    rozrodczości
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/41/CE do Parlamento Europeu e do Conselho, de 19 de Junho
    de 2001, que altera pela vigésima primeira vez a Directiva 76/769/CEE do Conselho
    relativa à aproximação das disposições legislativas, regulamentares e administrativas
    dos Estados-Membros respeitantes à limitação da colocação no mercado e da
    utilização e algumas substâncias e preparações perigosas, no que se refere
    às substâncias classificadas como cancerígenas, mutagénicas ou tóxicas para
    a reprodução
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/41/CE a Parlamentului European și a Consiliului din 19
    iunie 2001 de efectuare a celei de-a douăzeci și una modificări a Directivei
    76/769/CEE a Consiliului privind apropierea actelor cu putere de lege și a actelor
    administrative ale statelor membre referitoare la restricțiile privind introducerea
    pe piață și utilizarea anumitor substanțe și preparate periculoase, cu privire
    la substanțele clasificate drept carcinogene, mutagene sau toxice pentru reproducere
  type: main
- language: sk
  script: Latn
  content: Smernica 2001/41/ES Európskeho parlamentu a Rady z 19. júna 2001 ktorou
    sa mení a dopĺňa po dvadsiaty prvýkrát smernica Rady 76/769/EHS o aproximácii
    zákonov, iných právnych predpisov a správnych opatrení členských štátov
    vzťahujúcich sa na obmedzenia uvádzania na trh a používania niektorých nebezpečných
    látok a prípravkov a ich používaním, v súvislosti s látkami klasifikovanými
    ako karcinogény, mutagény alebo látky poškodzujúce reprodukciu
  type: main
- language: sl
  script: Latn
  content: Direktiva 2001/41/ES evropskega parlamenta in Sveta z dne 19. junija 2001
    o enaindvajseti spremembi Direktive Sveta 76/769/EGS o približevanju zakonov
    in drugih predpisov držav članic v zvezi z omejitvami pri trženju in uporabi
    nekaterih nevarnih snovi in pripravkov glede snovi, razvrščenih kot rakotvorne,
    mutagene ali snovi, strupene za razmnoževanje
  type: main
- language: es
  script: Latn
  content: Directiva 2001/41/CE del Parlamento Europeo y del Consejo, de 19 de junio
    de 2001, por la que se modifica por vigésima primera vez la Directiva 76/769/CEE
    del Consejo, relativa a la aproximación de las disposiciones legales, reglamentarias
    y administrativas de los Estados miembros que limitan la comercialización y el
    uso de determinadas sustancias y preparados peligrosos, en lo que se refiere a
    sustancias clasificadas como carcinógenas, mutágenas o tóxicas para la reproducción
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2001/41/EG av den 19 juni 2001
    om ändring för tjugoförsta gången av rådets direktiv 76/769/EEG om begränsning
    av användning och utsläppande på marknaden av vissa farliga ämnen och preparat
    (beredningar) vad gäller ämnen som klassificeras som cancerframkallande, mutagena
    eller reproduktionstoxiska
  type: main
