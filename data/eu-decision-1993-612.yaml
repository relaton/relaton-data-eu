    følgende regioner: Abruzzi, Basilicata, Calabria, Campania, Molise, Puglia, Sardinien
    og Sicilien) til forbedring af vilkårene for forarbejdning og afsætning af landbrugs-
    og skovbrugsprodukter (Kun den italienske udgave er autentisk)'
  type: main
- language: el
