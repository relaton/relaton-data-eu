title:
- language: en
  script: Latn
  content: '93/612/EC: Commission Decision of 23 November 1993 amending the Community
    support framework for Community structural assistance on the improvement of the
    conditions under which agricultural and forestry products are processed and marketed
    in Italy (with the exception of the following regions: Abruzzo, Basilicata, Calabria,
    Campania, Molise, Publia, Sardinia and Sicily) (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/612/CE: Décision de la Commission du 23 novembre 1993 concernant l''établissement
    d''une modification au cadre communautaire d''appui pour les interventions structurelles
    communautaires relatives à l''amélioration des conditions de transformation
    et de commercialisation des produits agricoles et sylvicoles en Italie (à l''exception
    des régions suivantes: Abruzzes, Basilicate, Calabre, Campanie, Molise, Pouilles,
    Sardaigne, Sicile (Le texte en langue italienne est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/612/EG: ENTSCHEIDUNG DER KOMMISSION vom 23. November 1993 zur Änderung
