  content: '84/31/EEC: Commission Decision of 6 January 1984 amending Decision 81/92/EEC
    as regards the list of establishments in Uruguay approved for the purposes of
    importing fresh meat into the Community'
  type: main
- language: fr
  script: Latn
  content: '84/31/CEE: Décision de la Commission du 6 janvier 1984 modifiant la décision
    81/92/CEE en ce qui concerne la liste des établissements d'' Uruguay agréés
    pour l'' importation de viandes fraîches dans la Communauté'
  type: main
- language: de
  script: Latn
  content: '84/31/EWG: Entscheidung der Kommission vom 6. Januar 1984 zur Änderung
    der Entscheidung 81/92/EWG hinsichtlich der Liste der Betriebe in Uruguay, aus
    denen die Einfuhr frischen Fleisches in die Gemeinschaft zugelassen ist'
  type: main
