title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1640/94 of 6 July 1994 determining for the
    Member States, for the 1993 marketing year, the estimated loss of income and the
    estimated level of the premium payable per ewe and per female goat and fixing
    the first advance payment for this premium and an advance payment of the specific
    aid for sheep and goat farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1640/94 de la Commission du 6 juillet 1994 déterminant,
    pour les États membres et pour la campagne 1994, la perte estimée de revenu,
    le montant estimé de la prime payable par brebis et par chèvre, ainsi que fixant
    le montant du premier acompte de cette prime ainsi que le montant d'un acompte
    sur l'aide spécifique à l'élevage ovin et caprin dans certaines zones défavorisées
    de la Communauté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1640/94 DER KOMMISSION vom 6. Juli 1994 zur Bestimmung
    des je Mitgliedstaat und für das Wirtschaftsjahr 1994 zu gewährenden Einkommensausfalls
    und der je Mutterschaf und Ziege zu gewährenden Prämie, des ersten Vorschusses
    auf diese Prämie sowie eines Vorschusses auf die Sonderbeihilfe für die Schaf-
    und Ziegenhaltung in bestimmten benachteiligten Gebieten der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1640/94 af 6. juli 1994 om fastsættelse
    for medlemsstaterne for produktionsåret 1994 af det anslåede indkomsttab, det
    anslåede præmiebeløb, der skal betales pr. moderfår og moderged, det første
    forskud på dette præmiebeløb samt acontobeløbet på den særlige støtte til
    fåre- og gedeopdræt i visse ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
