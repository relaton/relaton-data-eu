  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1640/94 DELLA COMMISSIONE del 6 luglio 1994 che determina,
    per gli Stati membri e per la campagna 1994, la perdita stimata di reddito, l'
    importo stimato del premio pagabile per pecora e per capra, l' ammontare del primo
    acconto del premio nonché l' ammontare di un acconto dell' aiuto specifico per
    l' allevamento ovocaprino in alcune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1640/94 VAN DE COMMISSIE van 6 juli 1994 tot vaststelling,
    voor de Lid-Staten en voor het verkoopseizoen 1994, van het geraamde inkomensverlies
    en van het geraamde premiebedrag per ooi en per vrouwelijke geit alsmede van het
    eerste voorschot op deze premie en op het bedrag van een voorschot op de bijzondere
