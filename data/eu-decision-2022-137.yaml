  script: Latn
  content: Commission Implementing Decision (EU) 2022/137 of 28 January 2022 concerning
    the extension of the action taken by the Health and Safety Executive of the United
    Kingdom permitting the making available on the market and use of the biocidal
    product Mydis in accordance with Article 55(1) of Regulation (EU) No 528/2012
    of the European Parliament and of the Council (notified under document C(2022)
    408) (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
