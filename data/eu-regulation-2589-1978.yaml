title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2589/78 of 31 October 1978 re-establishing
    the levying of customs duties on yarn of combed sheep' s or lambs' wool (worsted
    yarn), not put up for retail sale, falling within heading No 53.07 and originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2589/78 de la Commission, du 31 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine peignée, non conditionnés pour la vente au détail, de la position tarifaire
    53.07, originaires de Corée du Sud bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2589/78 der Kommission vom 31. Oktober 1978 über
    die Wiedereinfúhrung des Zollsatzes fúr Kammgarne aus Wolle, nicht in Aufmachungen
    fúr den Einzelverkauf, der Tarifnummer 53.07, mit Ursprung in Súdkorea, dem
    die in der Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2589/78 af 31. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for garn af kæmmet uld (kamgarn), ikke i detailsalgsoplægninger,
    under position 53.07, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2589/78 della Commissione, del 31 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana pettinata,
    non preparati per la vendita al minuto, della voce doganale 53.07, originari della
    Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2589/78 van de Commissie van 31 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op kamgaren
    van wol, niet gereed voor de verkoop in het klein, van post 53.07, van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 1197/78 van de Raad
