title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3736/89 of 13 December 1989 re-establishing
    the levying of customs duties on babies'garments and clothing accessories, excluding
    babies'gloves, mittens and mitts of categories 10 and 87, and babies'stockings,
    socks and sockettes, other than knitted or crocheted of category 88, products
    of category 68 (order No 40.0680), originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3736/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement pour bébés, à l'exception de la ganterie pour bébés
    des catégories de produits n° 10 et 87, et des bas, chaussettes et socquettes
    pour bébés, autres qu'en bonneterie, de la catégorie de produits n° 88, de
    la catégorie de produits n° 68 (numéro d'ordre 40.0680), originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3736/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
    des Zollsatzes fuer Saeuglingskleidung und Bekleidungszubehoer fuer Saeuglinge,
    ausgenommen Handschuhe fuer Saeuglinge der Kategorie 10 und 87, und Struempfe,
    Socken und Soeckchen fuer Saeuglinge, andere als aus Gewirken, der Kategorie 88,
    der Warenkategorie Nr. 68 (lfd. Nr. 40.0680) mit Ursprung in Brasilien, dem die
    in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen gewaehrt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3736/89 af 13. december 1989 om genindførelse
    af opkrævning af toldafgifter for beklædningsgenstande og tilbehør til spædbørn,
    bortset fra vanter af trikotage under kategori 10 og 87, og strømper og sokker
    under kategori 88, ikke af trikotage, under varekategori nr. 68 (løbenummer 40.0680),
    som har oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3736/89 της Επιτροπής
    της 13ης Δεκεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ενδύματα
    και συμπληρώματα ένδυσης για βρέφη, με εξαίρεση
    τα πλεκτά γάντια που περιλαμβάνονται στις
    κατηγορίες 10 και 87 και τις κάλτσες και περιπόδια
    κοντά για βρέφη, εκτός από τα πλεκτά της κατηγορίας
    88, προϊόντα της κατηγορίας 68 ( αύξων αριθμός
    40.0680 ), καταγωγής Βραζιλίας, δικαιούχου των
    προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ. 4259/88
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3736/89 DELLA COMMISSIONE del 13 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti ed accessori
    di abbigliamento per bambini piccoli (bébé), esclusi i guanti per bambini piccoli
    (bébé) delle categorie 10 e 87 e le calze e calzini tessuti della categoria
    88, della categoria di prodotti n. 68 (numero d'ordine 40.0680), originari del
    Brasile, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3736/89 VAN DE COMMISSIE van 13 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op babykleding
    en -kledingtoebehoren, met uitzondering van handschoenen, wanten en dergelijke
    artikelen voor baby'' s, van de categorieën 10 en 87, en kousen en sokken voor
    baby'' s, andere dan van brei- of haakwerk, van categorie 88, van de categorie
    van produkten nr. 68 (volgnummer 40.0680), van oorsprong uit Brazilië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88
    van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3736/89 DA COMISSÃO de 13 de Dezembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis ao vestuário para
    bebés, com excepção das luvas para bebés, das categorias 10 e 87, e das meias,
    peúgas e artefactos semelhantes, de tecido, da categoria 88, da categoria de
    produtos 68 (número de ordem 40.680), originários do Brasil, beneficiário das
    preferências pautais previstas no Regulamento (CEE) nº 4259/88 do Conselho #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3736/89 DE LA COMISION de 13 de diciembre de 1989 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a las prendas y accesorios de vestir para bebés, con excepcion de guantes para
    bebés de las categorias 10 y 87 y medias, calcetines, salvamedias de tejido de
    la categoria 88 de la categoria de productos no 68 (numero de orden 40.0680) originarios
    de Brasil beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 4259/88 del Consejo
