title:
- language: en
  script: Latn
  content: '81/218/EEC: Commission Decision of 6 March 1981 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof) originating in Hong Kong (Only the French text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/218/CEE: Décision de la Commission, du 6 mars 1981, autorisant la
    République française à exclure du traitement communautaire les jouets en bois
    et autres (à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées) originaires de Hong-kong
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/218/EWG: Entscheidung der Kommission vom 6. März 1981 zur Ermächtigung
    der Französischen Republik, aus Hongkong stammende Spielzeuge aus Holz und andere
    (mit Ausnahme der Motor- und Bewegungsmechanismen für Spielzeuge und Modelle
    zum Spielen sowie deren Ersatzteile) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/218/EØF: Kommissionens beslutning af 6. marts 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil) med oprindelse i Hongkong (Kun den franske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/218/ΕΟΚ: Απόφαση τής Επιτροπής τής 6ης Μαρτίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά αθύρματα εκ ξύλου καί έτερα (εξαιρέσει τών
    κινητήρων καί μηχανισμών κινήσεως δί αθύρματα
    καί μικροκατασκευάσματα καθώς καί τών εξαρτημάτων
    τους) καταγόμενα από τό Χόνγκ Κόνγκ (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/218/CEE: Decisione della Commissione, del 6 marzo 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e meccanismi d''animazione per giocattoli e modelli
    ridotti ed i loro pezzi staccati), originari di Hong Kong (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/218/EEG: Beschikking van de Commissie van 6 maart 1981 houdende machtiging
    van de Franse Republiek om speelgoed uit hout en andere (met uitzondering van
    animatiemotoren en mechanismen voor speelgoed op schaal alsook hun onderdelen)
    van oorsprong uit Hong-Kong van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
