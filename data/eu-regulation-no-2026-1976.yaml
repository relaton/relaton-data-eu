title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2026/76 of 27 July 1976 amending Regulation
    (EEC) No 835/76 on the supply of butter or butteroil under Regulation (EEC) No
    1542/75 to the Office of the United Nations High Commissioner for Refugees as
    food aid for the sections of the population affected by the events in Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2026/76 du Conseil, du 27 juillet 1976, modifiant
    le règlement (CEE) n° 835/76 relatif à la fourniture de beurre ou de butteroil,
    dans le cadre du règlement (CEE) n° 1542/75, au Haut Commissariat des Nations
    Unies pour les réfugiés, à titre d'aide alimentaire en faveur des populations
    affectées par les événements de Chypre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2026/76 des Rates vom 27. Juli 1976 zur Änderung
    der Verordnung (EWG) Nr. 835/76 über die im Rahmen der Verordnung (EWG) Nr. 1542/75
    erfolgende Lieferung von Butter oder Butteroil als Nahrungsmittelhilfe an das
    Amt des Hohen Flüchtlingskommissars der Vereinten Nationen zugunsten der von
    den Ereignissen in Zypern betroffenen Bevölkerungsteile
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2026/76 af 27. juli 1976 om ændring af forordning
    (EØF) nr. 835/76 om levering af smør eller butteroil, i henhold til forordning
    (EØF) nr. 1542/75, til De forenede Nationers Højkommissariat for Flygtninge,
    som fødevarehjælp til fordel for de befolkningsgrupper, der er berørt af begivenhederne
    på Cypern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2026/76 del Consiglio, del 27 luglio 1976, che modifica
    il regolamento (CEE) n. 835/76 relativo alla fornitura di burro e di butteroil,
    nel quadro del regolamento (CEE) n. 1542/75 all'Alto Commissariato delle Nazioni
    Unite per i profughi, a titolo di aiuto alimentare a favore delle popolazioni
    colpite dagli eventi di Cipro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2026/76 van de Raad van 27 juli 1976 tot wijziging
    van Verordening (EEG) nr. 835/76 betreffende de levering uit hoofde van Verordening
    (EEG) nr. 1542/75 van boter of butteroil als voedselhulp aan het Hoge Commissariaat
    van de Verenigde Naties voor Vluchtelingen, bestemd voor de door de gebeurtenissen
    op Cyprus getroffen bevolkingsgroepen
