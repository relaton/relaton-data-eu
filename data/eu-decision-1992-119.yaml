  content: '92/119/EEC: Commission Decision of 3 February 1992 extending for Germany
    the period during which seed of a variety of perennial ryegrass may be subject
    to marketing restrictions (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/119/CEE: Décision de la Commission du 3 février 1992 prorogeant,
