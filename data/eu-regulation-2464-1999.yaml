title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2464/1999 of 22 November 1999 amending Regulation
    (EC) No 1729/1999 laying down special measures derogating from Regulations (EEC)
    No 3665/87 and (EEC) No 3719/88 as regards milk and milk products, beef and veal,
    pigmeat, eggs, poultrymeat, agricultural products exported in the form of goods
    not covered by Annex I to the Treaty and certain cereal products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2464/1999 de la Commission, du 22 novembre 1999, modifiant
    le règlement (CE) nº 1729/1999 portant mesures spéciales dérogeant au règlement
    (CEE) nº 3665/87 et au règlement (CEE) nº 3719/88 dans les secteurs du lait
    et des produits laitiers, de la viande bovine, de la viande de porc, des oeufs,
    de la viande de volaille, des produits exportés sous forme de marchandises ne
    relevant pas de l'annexe I du traité et pour certains produits de céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2464/1999 der Kommission vom 22. November 1999 zur
    Änderung der Verordnung (EG) Nr. 1729/1999 mit Sondervorschriften für die Abweichung
    von den Verordnungen (EWG) Nr. 3665/87 und (EWG) Nr. 3719/88 in bezug auf Milch
    und Milcherzeugnisse, Rindfleisch, Schweinefleisch, Eier, Geflügelfleisch, landwirtschaftliche
    Erzeugnisse, die in Form von nicht unter Anhang I des Vertrags fallenden Waren
    ausgeführt werden, sowie bestimmte Getreideprodukte
  type: main
- language: cs
  script: Latn
  content: NAŘÍZENÍ KOMISE (ES) č. 2464/1999 ze dne 22. listopadu 1999, kterým
    se mění nařízení (ES) č. 1729/1999, kterým se stanoví zvláštní opatření
    odchylující se od nařízení (EHS) č. 3665/87 a nařízení (EHS) č. 3719/88,
    v odvětvích mléka a mléčných výrobků, hovězího a telecího masa, vepřového
    masa, vajec, drůbežího masa, zemědělských produktů vyvážených ve formě
    zboží, na něž se nevztahuje příloha I Smlouvy, a pokud jde o některé produkty
    z obilovin
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2464/1999 af 22. november 1999 om ændring
    af forordning (EF) nr. 1729/1999 om fastsættelse af særlige foranstaltninger,
    der udgør undtagelser fra forordning (EØF) nr. 3665/87 og (EØF) nr. 3719/88,
    for så vidt angår mælk, mejeriprodukter, oksekød, svinekød, æg, fjerkrækød,
    landbrugsprodukter, der udføres i form af varer, som ikke er omfattet af traktatens
    bilag I, og visse kornprodukter
  type: main
- language: el
  script: Grek
