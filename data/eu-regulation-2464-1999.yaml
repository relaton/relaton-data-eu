  type: main
- language: hu
  script: Latn
  content: A BIZOTTSÁG 2464/1999/EK RENDELETE (1999. november 22.) a tejre és tejtermékekre,
    marha- és borjúhúsra, sertéshúsra, tojásra, baromfihúsra, a Szerződés
    I. mellékletének hatályán kívül eső termékek formájában exportált mezőgazdasági
    termékekre és egyes gabonatermékekre vonatkozóan a 3665/87/EGK és a 3719/88/EGK
    rendelettől eltérő különleges intézkedések megállapításáról szóló
    1729/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2464/1999 della Commissione, del 22 novembre 1999,
    che modifica il regolamento (CE) n. 1729/1999 recante misure speciali in deroga
    ai regolamenti (CEE) n. 3665/87 e (CEE) n. 3719/88 per quanto riguarda il latte
    e i prodotti lattiero-caseari, le carni bovine, le carni suine, le uova, le carni
    di pollame, i prodotti agricoli esportati sotto forma di merci non comprese nell'allegato
    I del trattato e taluni prodotti del settore dei cereali
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2464/1999 (1999. gada 22. novembris), ar kuru
    groza Regulu (EK) Nr. 1729/1999, ar ko nosaka īpašus pasākumus attiecībā
    uz pienu un piena produktiem, liellopu gaļu un teļa gaļu, cūkgaļu, olām,
    mājputnu gaļu, lauksaimniecības produktiem, kurus eksportē tādu preču veidā,
    uz ko neattiecas Līguma I pielikums, kā arī dažiem graudaugu produktiem, atkāpjoties
    no Regulas (EEK) Nr. 3665/87 un Regulas (EEK) Nr. 3719/88
  type: main
- language: lt
  script: Latn
  content: KOMISIJOS REGLAMENTAS (EB) Nr. 2464/1999 1999 m. lapkričio 22 d. iš dalies
    keičiantis Reglamentą (EB) Nr. 1729/1999, nustatantį specialias priemones dėl
    pieno ir pieno produktų, galvijienos, kiaulienos, kiaušinių, paukštienos ir
    žemės ūkio produktų, eksportuojamų Sutarties I priede nenurodytų prekių
    pavidalu, taip pat ir dėl kai kurių grūdų produktų, nukrypstančias nuo Reglamentų
    (EEB) Nr. 3665/87 ir (EEB) Nr. 3719/88
  type: main
- language: mt
  script: Latn
  content: REGOLAMENT TAL-KUMMISSJONI (EEC) Nru 2464/1999 tat-22 ta' Novembru 1999
    li jemenda r-Regolament (KE) Nru 1729/1999 li jippreskrivi miżuri speċjali li
    jidderogaw mir-Regolamenti (KEE) Nru 3665/87 u (KEE) Nru 3719/88 rigward il-ħalib
    u l-prodotti mill-ħalib, il-laħam taċ-ċanga u l-vitella, il-laħam tal-majjal,
    il-bajd, il-laħam tat-tjur, il-prodotti tal-biedja esportati fil-għamla ta'
    oġġetti mhux kopertibl-Anness I mat-Trattat u ċerti prodotti taċ-ċereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2464/1999 van de Commissie van 22 november 1999 tot
    wijziging van Verordening (EG) nr. 1729/1999 houdende bijzondere maatregelen tot
    afwijking van de Verordeningen (EEG) nr. 3665/87 en (EEG) nr. 3719/88 ten aanzien
    van melk en zuivelproducten, rundvlees, varkensvlees, eieren, slachtpluimvee,
    in de vorm van niet onder bijlage I bij het Verdrag vallende goederen geëxporteerde
    landbouwproducten en bepaalde producten van de sector granen
  type: main
- language: pl
  script: Latn
  content: ROZPORZĄDZENIE KOMISJI (WE) NR 2464/1999 z dnia 22 listopada 1999 r. zmieniające
    rozporządzenie (WE) nr 1729/1999 ustalające specjalne środki stanowiące odstępstwo
    od rozporządzeń (EWG) nr 3665/87 i (EWG) nr 3719/88 w sektorach mleka i przetworów
    mlecznych, wołowiny i cielęciny, wieprzowiny, jaj, mięsa drobiowego, produktów
    rolniczych wywożonych w formie towarów nieobjętych załącznikiem I do Traktatu
    oraz niektórych produktów zbożowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2464/1999 da Comissão, de 22 de Novembro de 1999,
    que altera o Regulamento (CE) n° 1729/1999 que estabelece medidas especiais de
    derrogação dos Regulamentos (CEE) n° 3665/87 e (CEE) n° 3719/88 no que respeita
    ao leite e produtos lácteos, à carne de bovino, à carne de suíno, aos ovos,
    à carne de aves de capoeira, aos produtos agrícolas exportados na forma de mercadorias
    não abrangidas pelo anexo I do Tratado e certos produtos do sector dos cereais
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2464/1999 de la Comisión, de 22 de noviembre de 1999,
    que modifica el Reglamento (CE) nº 1729/1999 por el que se establecen medidas
    especiales de inaplicación de los Reglamentos (CEE) nos 3665/87 y 3719/88 en
    lo que respecta a la leche, los productos lácteos, la carne de vacuno y de porcino,
    los huevos y la carne de aves de corral, los productos agrícolas exportados en
    forma de mercancías no incluidas en el anexo I del Tratado y determinados productos
    del sector de cereales
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2464/1999 av den 22 november 1999 om
    ändring av förordning (EG) nr 1729/1999 om fastställande av särskilda undantag
    från förordningarna (EEG) nr 3665/87 och (EEG) nr 3719/88 när det gäller mjölk
    och mjölkprodukter, nöt-, kalv- och griskött, ägg, fjäderfäkött, jordbruksprodukter
    som exporteras i form av varor som inte omfattas av bilaga I till fördraget,
    och vissa produkter inom spannmålssektorn
