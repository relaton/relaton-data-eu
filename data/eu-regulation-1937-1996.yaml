  content: Commission Regulation (EC) No 1937/96 of 8 October 1996 amending Annexes
    III B and VI to Council Regulation (EC) No 517/94 on common rules for imports
    of textile products from certain third countries not covered by bilateral agreements,
    protocols or other arrangements, or by other specific Community import rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1937/96 de la Commission du 8 octobre 1996 modifiant
    les annexes III B et VI du règlement (CE) nº 517/94 du Conseil relatif au régime
    commun applicable aux importations de produits textiles en provenance de certains
    pays tiers non couverts par des accords, protocoles ou autres arrangements bilatéraux,
    ou par d'autres régimes communautaires spécifiques d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1937/96 der Kommission vom 8. Oktober 1996 zur Änderung
