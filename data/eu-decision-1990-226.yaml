  content: '90/226/EEC: Council Decision of 25 April 1990 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the protocol defining for the period 18 January 1990 to 17 January 1993 the
    fishing opportunities and the financial contribution provided for by the Agreement
    between the European Economic Community and the Republic of Seychelles on fishing
    off the coast of Seychelles'
  type: main
- language: fr
  script: Latn
  content: '90/226/CEE: Décision du Conseil du 25 avril 1990, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant, pour la période du 18 janvier 1990 au 17 janvier 1993, les
    possibilités de pèche et la contribution financière prévues par l''accord
    entre la Communauté économique européenne et la République des Seychelles
    concernant la pèche au large des Seychelles'
  type: main
- language: de
  script: Latn
