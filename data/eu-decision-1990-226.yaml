    PROTOKOLLS ZUR FESTLEGUNG DER FANGMOEGLICHKEITEN UND DES FINANZBEITRAGS NACH DEM
    ABKOMMEN ZWISCHEN DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DER REPUBLIK SESCHELLEN
