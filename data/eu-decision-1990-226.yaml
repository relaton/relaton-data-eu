    AF DE FISKERIMULIGHEDER OG DET FINANSIELLE BIDRAG, DER ER OMHANDLET I AFTALEN
    MELLEM DET EUROPAEISKE OEKONOMISKE FAELLESSKAB OG REPUBLIKKEN SEYCHELLERNE OM
    FISKERI UD FOR SEYCHELLERNE, FOR PERIODEN 18. JANUAR 1990 TIL 17. JANUAR 1993'
  type: main
- language: el
  script: Grek
