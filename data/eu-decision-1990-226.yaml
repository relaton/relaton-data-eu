    Απριλίου 1990 για τη σύναψη συμφωνίας υπό μορφή
    ανταλλαγής επιστολών σχετικά με την προσωρινή
    εφαρμογή του πρωτοκόλλου που καθορίζει, για
    την περίοδο από 18 Ιανουαρίου 1990 έως 17 Ιανουαρίου
    1993, τις αλιευτικές δυνατότητες και τη χρηματική
    συνεισφορά που προβλέπονται από τη συμφωνία
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της Δημοκρατίας των Σεϋχελλών σχετικά
    με την αλιεία στα ανοικτά των Σεϋχελλών'
  type: main
- language: it
  script: Latn
