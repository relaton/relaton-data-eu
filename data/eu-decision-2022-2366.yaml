type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2366 of 2 December 2022 on laying
    down the specifications for a technical solution to facilitate the collection
    of data by Member States and Europol for the purpose of generating statistics
    on the access to the VIS data for law enforcement purposes
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2366 de la Commission du 2 décembre
    2022 établissant les spécifications d’une solution technique visant à faciliter
    la collecte de données par les États membres et Europol en vue de produire des
    statistiques sur l’accès aux données du VIS à des fins répressives
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2366 der Kommission vom 2. Dezember 2022
    zur Festlegung der Spezifikationen für eine technische Lösung zur Erleichterung
    der Erhebung von Daten durch die Mitgliedstaaten und Europol zum Zwecke der Erstellung
    von Statistiken über den Zugang zu VIS-Daten zu Gefahrenabwehr- und Strafverfolgungszwecken
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/2366 на Комисията
    от 2 декември 2022 година за определяне на спецификациите
    за техническо решение за улесняване на събирането
    на данни от държавите членки и Европол с оглед
    на генерирането на статистически данни относно
    достъпа до данни във ВИС за целите на правоприлагането
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2366 ze dne 2. prosince 2022,
    kterým se stanoví specifikace pro technické řešení usnadňující shromažďování
    údajů členskými státy a Europolem pro účely vytváření statistik o přístupu
    k údajům VIS pro účely vymáhání práva
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2366 af 2. december 2022
    om fastsættelse af specifikationer for en teknisk løsning til lettelse af medlemsstaternes
    og Europols indsamling af oplysninger til generering af statistikker om adgangen
    til VIS-oplysninger med henblik på retshåndhævelse
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2366 της Επιτροπής
    της 2ας Δεκεμβρίου 2022 σχετικά με τη θέσπιση
    προδιαγραφών για την τεχνική λύση που θα διευκολύνει
    τη συλλογή δεδομένων από τα κράτη μέλη και
    την Ευρωπόλ με σκοπό την παραγωγή στατιστικών
    σχετικά με την πρόσβαση στα δεδομένα του VIS
    για σκοπούς επιβολής του νόμου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2366, 2. detsember 2022, mis käsitleb
    sellise tehnilise lahenduse kirjelduse kehtestamist, mis hõlbustab liikmesriikidel
    ja Europolil koguda andmeid, et koostada statistikat VISi andmetele õiguskaitse
    eesmärgil juurdepääsu saamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/2366, annettu 2 päivänä
    joulukuuta 2022, eritelmien vahvistamisesta teknistä ratkaisua varten, jolla
    helpotetaan jäsenvaltioiden ja Europolin suorittamaa tietojen keruuta tilastojen
    tuottamiseksi lainvalvontatarkoituksessa tapahtuvasta pääsystä viisumitietojärjestelmän
    tietoihin
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2366 ón gCoimisiún an 2 Nollaig 2022
    maidir leis na sonraíochtaí a leagan síos i ndáil le réiteach teicniúil
    chun éascú a dhéanamh ar an mbailiú sonraí a dhéanann na Ballstáit agus
    Europol le haghaidh staidreamh a ghiniúint maidir le rochtain ar shonraí VIS
    chun críocha fhorfheidhmiú an dlí
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2366 оd 2. prosinca 2022. o utvrđivanju
    specifikacija za tehničko rješenje kako bi se državama članicama i Europolu
    olakšalo prikupljanje podataka u svrhu generiranja statističkih podataka o pristupu
    podacima iz VIS-a za potrebe izvršavanja zakonodavstva
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2366 végrehajtási határozata (2022. december
    2.) a tagállamok és az Europol által a VIS-adatokhoz való bűnüldözési
    célú hozzáférésre vonatkozó statisztikák előállítása céljából végzett
    adatgyűjtést megkönnyítő műszaki megoldásra vonatkozó előírások megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2366 della Commissione del 2 dicembre
    2022 che stabilisce le specifiche per una soluzione tecnica volta ad agevolare
    la raccolta di dati da parte degli Stati membri e di Europol ai fini della produzione
    di statistiche sull’accesso ai dati del VIS a fini di contrasto
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2366 (2022. gada 2. decembris),
    ar ko nosaka specifikācijas tehniskam risinājumam, kura mērķis ir atvieglot
    dalībvalstīm un Eiropolam datu vākšanu nolūkā sagatavot statistiku par tiesībaizsardzības
    nolūkos veiktu piekļuvi VIS datiem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2366 2022 m. gruodžio 2 d.
    dėl techninio sprendimo, kaip valstybėms narėms ir Europolui lengviau rinkti
    duomenis prieigos prie VIS duomenų teisėsaugos tikslais statistikai rengti,
    specifikacijų nustatymo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2366 tat-2
    ta’ Diċembru 2022 dwar l-istabbiliment tal-ispeċifikazzjonijiet għal soluzzjoni
    teknika biex jiġi ffaċilitat il-ġbir ta’ data mill-Istati Membri u l-Europol
    għall-fini ta’ ġenerazzjoni ta’ statistika dwar l-aċċess għad-data tal-VIS
    għal finijiet ta’ infurzar tal-liġi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2366 van de Commissie van 2 december 2022
    tot vaststelling van de specificaties voor een technische oplossing om het de
    lidstaten en Europol gemakkelijker te maken gegevens te verzamelen met het oog
    op het genereren van statistieken over de toegang tot VIS-gegevens voor rechtshandhavingsdoeleinden
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2366 z dnia 2 grudnia 2022 r. określająca
    specyfikacje rozwiązania technicznego ułatwiającego gromadzenie danych przez
    państwa członkowskie i Europol w celu generowania statystyk dotyczących dostępu
    do danych VIS na potrzeby ochrony porządku publicznego
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2366 da Comissão de 2 de dezembro de
    2022 que estabelece as especificações de uma solução técnica destinada a
    facilitar a recolha de dados pelos Estados-Membros e pela Europol para a elaboração
    de estatísticas sobre o acesso aos dados VIS para fins de aplicação da lei
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2366 a Comisiei din 2 decembrie
    2022 de stabilire a specificațiilor pentru o soluție tehnică care să faciliteze
    colectarea datelor de către statele membre și Europol în vederea generării
    de statistici privind accesul la datele VIS în scopul asigurării respectării
    legii
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2366 z 2. decembra 2022 o stanovení
    špecifikácií technického riešenia na uľahčenie zhromažďovania údajov
    členskými štátmi a Europolom na účely tvorby štatistík o prístupe k údajom
    VIS na účely presadzovania práva
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2366 z dne 2. decembra 2022 o določitvi
    specifikacij za tehnično rešitev za lažje zbiranje podatkov s strani držav
    članic in Europola za namene priprave statističnih podatkov o dostopu do podatkov
    iz VIS za namene kazenskega pregona
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2366 de la Comisión de 2 de diciembre
    de 2022 por la que se establecen las especificaciones de una solución técnica
    para facilitar la recopilación de datos por parte de los Estados miembros y Europol
    a fin de generar estadísticas sobre el acceso a los datos del VIS con fines policiales
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/2366 av den 2 december 2022
    om fastställande av specifikationerna för en teknisk lösning för att underlätta
    medlemsstaternas och Europols insamling av uppgifter i syfte att generera statistik
    om åtkomst till VIS-uppgifter för brottsbekämpande ändamål
