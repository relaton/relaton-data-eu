title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 929/1999 of 29 April 1999 amending Regulation
    (EC) No 82/1999 imposing provisional anti-dumping and countervailing duties on
    imports of farmed Atlantic salmon originating in Norway with regard to certain
    exporters, imposing provisional anti-dumping and countervailing duties on imports
    of such salmon with regard to certain exporters, amending Decision 97/634/EC accepting
    undertakings offered in connection with the anti-dumping and anti-subsidies proceedings
    concerning imports of such salmon and amending Council Regulation (EC) No 772/1999
    imposing definitive anti-dumping and countervailing duties on imports of such
    salmon Council Directive 1999/29/EC of 22 April 1999 on the undesirable substances
    and products in animal nutrition
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 929/1999 de la Commission, du 29 avril 1999, modifiant
    le règlement (CE) n° 82/1999 instituant des droits antidumping et compensateurs
    provisoires sur les importations de saumons atlantiques d'élevage originaires
    de Norvège en ce qui concerne certains exportateurs, instituant des droits antidumping
    et compensateurs provisoires sur ces importations en ce qui concerne certains
    exportateurs, modifiant la décision 97/634/CE portant acceptation des engagements
    offerts dans le cadre de la procédure antidumping et de la procédure antisubventions
    concernant ces importations et modifiant le règlement (CE) n° 772/1999 du Conseil
    instituant des droits antidumping et compensateurs définitifs sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 929/1999 der Kommission vom 29. April 1999 zur Änderung
    der Verordnung (EG) Nr. 82/1999 zur Einführung vorläufiger Antidumping- und
    Ausgleichszölle auf die Einfuhren von gezüchtetem Atlantischen Lachs mit Ursprung
    in Norwegen im Fall bestimmter Ausführer, zur Einführung vorläufiger Antidumping-
    und Ausgleichszölle auf die Einfuhren von solchem Lachs im Fall bestimmter Ausführer,
    zur Änderung des Beschlusses 97/634/EG zur Annahme von Verpflichtungsangeboten
    im Zusammenhang mit dem Antidumping- und dem Antisubventionsverfahren betreffend
    die Einfuhren von solchem Lachs und zur Änderung der Verordnung (EG) Nr. 772/1999
    des Rates zur Einführung endgültiger Antidumping- und Ausgleichszölle auf die
    Einfuhren von solchem Lachs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 929/1999 af 29. april 1999 om ændring
