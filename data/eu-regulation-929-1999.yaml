  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 929/1999, annettu 29 päivänä huhtikuuta 1999,
    väliaikaisten polkumyynti- ja tasoitustullien käyttöön ottamisesta Norjasta
    peräisin olevan viljellyn merilohen tuonnissa annetun komission asetuksen (EY)
    N:o 82/1999 muuttamisesta, kyseisen lohen tuontia koskevien väliaikaisten polkumyynti-
    ja tasoitustullien käyttöönotosta tiettyjen viejien osalta, kyseisen lohen
    tuontia koskevien polkumyynnin ja tukien vastaisten menettelyjen yhteydessä esitettyjen
    sitoumusten hyväksymisestä tehdyn päätöksen 97/634/EY muuttamisesta ja kyseisen
    lohen tuontia koskevien lopullisten polkumyynti- ja tasoitustullien käyttöönotosta
    annetun neuvoston asetuksen (EY) N:o 772/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 929/1999 della Commissione, del 29 aprile 1999, che
    modifica il regolamento (CE) n. 82/1999 della Commissione, del 13 gennaio 1999,
    che istituisce dazi antidumping e dazi compensativi provvisori su talune importazioni
    di salmone d'allevamento dell'Atlantico originario della Norvegia e modifica la
    decisione 97/634/CE per quanto riguarda taluni esportatori, che accetta gli impegni
    offerti in relazione ai procedimenti antidumping e antisovvenzioni riguardo alle
    importazioni di tale salmone e che modifica il regolamento (CE) n. 772/1999, del
    Consiglio, che impone dazi antidumping e dazi compensativi definitivi sulle importazioni
    di tale salmone
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 929/1999 van de Commissie van 29 april 1999 tot wijziging
    van Verordening (EG) nr. 82/1999 van de Commissie tot instelling van voorlopige
    antidumping- en compenserende rechten op bepaalde invoer van gekweekte Atlantische
    zalm van oorsprong uit Noorwegen, tot instelling van voorlopige antidumping- en
    compenserende rechten op de invoer van dergelijke zalm ten aanzien van bepaalde
    exporteurs, tot wijziging van Besluit 97/634/EG tot aanvaarding van verbintenissen
    die zijn aangeboden in het kader van de antidumping- en de antisubsidieprocedures
    betreffende de invoer van dergelijke zalm en tot wijziging van Verordening (EG)
    nr. 772/1999 van de Raad tot instelling van definitieve antidumping- en compenserende
    rechten op de invoer van dergelijke zalm
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 929/1999 da Comissão, de 29 de Abril de 1999, que
    altera o Regulamento (CE) n° 82/1999 da Comissão de 13 de Janeiro de 1999 que
    institui direitos anti-dumping provisórios e de compensação sobre certas importações
    de salmão do Atlântico de viveiro originário da Noruega e que altera a Decisão
    97/634/CE que aceita os compromissos oferecidos no âmbito dos processos anti-
    dumping e anti-subvenções relativos às importações de salmão do Atlântico
    de viveiro originário da Noruega e que altera o Regulamento (CE) n° 772/1999
    que institui direitos anti-dumping e de compensação definitivos sobre as referidas
    importações de salmão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 929/1999 de la Comisión, de 29 de abril de 1999, por
    el que se modifica el Reglamento (CE) n° 82/1999 por el que se establecen derechos
    antidumping y compensatorios provisionales sobre las importaciones de salmón
    atlántico de piscifactoría originario de noruega con respecto a determinados
    importadores, por el que se establecen derechos antidumping y compensatorios provisionales
    sobre las importaciones de dicho salmón con respecto a determinados importadores,
    por el que se modifica la Decisión 97/634/CE por la que se aceptan los compromisos
    ofrecidos con respecto a los procedimientos antidumping y antisubvenciones relativos
    a las importaciones de dicho salmón y por el que se modifica el Reglamento (CE)
    n° 772/1999 del Consejo por el que se establecen derechos antidumping y compensatorios
    definitivos sobre las importaciones del mismo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 929/1999 av den 29 april 1999 om ändring,
    vad gäller vissa exportörer, av förordning (EG) nr 82/1999 om införande av
    preliminära antidumpnings- och utjämningstullar på import av odlad atlantlax
    med ursprung i Norge, om införande av preliminära antidumpnings- och utjämningstullar
    på import av sådan lax från vissa exportörer, om ändring av beslut 97/634/EG
    om godtagande av åtaganden som gjorts i samband med antidumpnings- och antisubventionsförfarandena
    rörande import av odlad atlantlax med ursprung i Norge samt om ändring av rådets
    förordning (EG) nr 772/1999 om införande av slutgiltiga antidumpnings- och utjämningstullar
    på import av sådan lax
  type: main
