title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1693/79 of 31 July 1979 re-establishing
    the levying of customs duties on wrought plates, sheets and strip, of copper,
    falling within heading No 74.04 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1693/79 de la Commission, du 31 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en cuivre, d' une épaisseur de plus de 0,15 millimètre,
    de la position 74.04 du tarif douanier commun, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1693/79 der Kommission vom 31. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Kupfer, mit einer
    Dicke von mehr als 0,15 mm, der Tarifnummer 74.04, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1693/79 af 31. juli 1979 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af kobber under position 74.04,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1693/79 della Commissione, del 31 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a lamiere, lastre, fogli
    e nastri di rame, di spessore superiore a 0,15 mm, della voce 74.04 della tariffa
    doganale comune, originari della Iugoslavia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1693/79 van de Commissie van 31 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op platen,
    bladen en strippen, van koper, met een dikte van meer dan 0,15 mm, van post 74.04
    van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
