    di un acconto sulle spese effettuate durante gli anni 1975, 1976 e 1977 per gli
    aiuti ed i premi relativi all''ammodernamento delle aziende agricole (Il testo
    in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/114/EEG: Beschikking van de Commissie van 20 december 1979 inzake de
