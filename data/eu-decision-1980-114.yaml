title:
- language: en
  script: Latn
  content: '80/114/EEC: Commission Decision of 20 December 1979 on the granting by
    the Guidance Section of the EAGGF to the Italian Republic of a payment on account
    in respect of expenditure incurred during 1975, 1976 and 1977 on aids and premiums
    relating to the modernization of farms (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/114/CEE: Décision de la Commission, du 20 décembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", à la République italienne d''un acompte sur les dépenses effectuées
    pendant les années 1975, 1976 et 1977 pour les aides et primes relatives à la
    modernisation des exploitations agricoles (Le texte en langue italienne est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/114/EWG: Entscheidung der Kommission vom 20. Dezember 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die in den
    Jahren 1975, 1976 und 1977 zur Modernisierung landwirtschaftlicher Betriebe an
    Beihilfen und Prämien getätigten Ausgaben an die Italienische Republik (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/114/EØF: Kommissionens beslutning af 20. december 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den italienske Republik af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1975, 1976 og 1977 til støtte
    og præmier vedrørende modernisering af landbrugsbedrifter (Kun den italienske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/114/CEE: Decisione della Commissione, del 20 dicembre 1979, relativa
