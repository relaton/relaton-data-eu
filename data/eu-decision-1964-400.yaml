title:
- language: fr
  script: Latn
  content: Décision 64/400/CEE de la Commission, du 15 juin 1964, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/400/EWG: Entscheidung der Kommission vom 15. Juni 1964 über den Antrag
    der Republik Frankreich nach Artikel 115 Absatz (1) des Vertrages auf Ausschluß
    verschiedener Erzeugnisse aus dritten Ländern aus der Gemeinschaftsbehandlung,
    die in anderen Mitgliedstaaten zum freien Verkehr abgefertigt worden sind'
  type: main
- language: it
  script: Latn
  content: '64/400/CEE: Decisione della Commissione, del 15 giugno 1964, relativa
    al ricorso della Repubblica francese all''articolo 115, comma 1, del Trattato,
    per ottenere l''esclusione dal trattamento comunitario di alcuni prodotti originari
    dai paesi terzi e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/400/EEG: Beschikking van de Commissie van 15 juni 1964 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea
    van het Verdrag bepaalde produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
