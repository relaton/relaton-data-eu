  script: Latn
  content: Council Regulation (EC) No 661/2008 of 8 July 2008 imposing a definitive
    anti-dumping duty on imports of ammonium nitrate originating in Russia following
    an expiry review pursuant to Article 11(2) and a partial interim review pursuant
    to Article 11(3) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 661/2008 du Conseil du 8 juillet 2008 instituant un
    droit antidumping définitif sur les importations de nitrate d’ammonium originaire
    de Russie à la suite d’un réexamen au titre de l’expiration des mesures
    conformément à l’article 11, paragraphe 2, et d’un réexamen intermédiaire
    partiel conformément à l’article 11, paragraphe 3, du règlement (CE) n o
    384/96
  type: main
