title:
- language: en
  script: Latn
  content: '85/188/EEC: Commission Decision of 28 February 1985 amending Commission
    Decision 82/62/EEC of 18 December 1981 authorizing the United Kingdom to grant
    exemptions from Council Regulation (EEC) No 543/69 on the harmonization of certain
    social legislation relating to road transport (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/188/CEE: Décision de la Commission du 28 février 1985 modifiant la
    décision 82/62/CEE de la Commission, du 18 décembre 1981, autorisant le Royaume-Uni
    à accorder des dérogations au règlement (CEE) n° 543/69 du Conseil, relatif
    à l''harmonisation de certaines dispositions en matière sociale dans le domaine
    des transports par route (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/188/EWG: Entscheidung der Kommission vom 28. Februar 1985 zur Änderung
    der Entscheidung 82/62/EWG der Kommission vom 18. Dezember 1981 zur Ermächtigung
    des Vereinigten Königreichs, Ausnahmen von der Verordnung (EWG) Nr. 543/69 des
    Rates über die Harmonisierung bestimmter Sozialvorschriften im Straßenverkehr
    zuzulassen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/188/EØF: Kommissionens beslutning af 28. februar 1985 om ændring
    af Kommissionens beslutning 82/62/EØF af 18. december 1981 om bemyndigelse til
    Det forenede Kongerige til at meddele undtagelser fra Rådets forordning (EØF)
    nr. 543/69 om harmonisering af visse bestemmelser på det sociale område inden
    for landevejstransport (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/188/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Φεβρουαρίου 1985 που τροποποιεί την απόφαση
    82/62/ΕΟΚ της Επιτροπής της 18ης Δεκεμβρίου 1981,
    η οποία επιτρέπει στο Ηνωμένο Βασίλειο να εγκρίνει
    εξαιρέσεις από τον κανονισμό (ΕΟΚ) αριθ. 543/69
    του Συμβουλίου για την εναρμόνιση ορισμένων
    κοινωνικών διατάξεων σχετικών με τις οδικές
    μεταφορές (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/188/CEE: Decisione della Commissione del 28 febbraio 1985 che modifica
    la decisione 82/62/CEE della Commissione, del 18 dicembre 1981, che autorizza
    il Regno Unito di Gran Bretagna ad applicare talune misure in deroga al regolamento
    (CEE) n. 543/69 del Consiglio, relativo all''armonizzazione di alcune disposizioni
    in materia sociale nel settore dei trasporti su strada (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/188/EEG: Beschikking van de Commissie van 28 februari 1985 houdende
    wijziging van Beschikking 82/62/EEG van de Commissie van 18 december 1981 waarbij
    het Verenigd Koninkrijk wordt gemachtigd om afwijkingen van Verordening (EEG)
    nr. 543/69 van de Raad tot harmonisatie van bepaalde voorschriften van sociale
    aard voor het wegvervoer toe te staan (Slechts de tekst in de Engelse taal is
    authentiek)'
