  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2268 of 18 November 2022 terminating
    the ‘new exporter’ review of Implementing Regulation (EU) 2019/1379 imposing
    a definitive anti-dumping duty on imports of bicycles originating in the People’s
    Republic of China following an interim review pursuant to Article 11(4) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council and terminating the
    registration of imports
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2268 de la Commission du 18 novembre
    2022 clôturant le réexamen au titre de «nouvel exportateur» du règlement
    d’exécution (UE) 2019/1379 instituant un droit antidumping définitif sur les
    importations de bicyclettes originaires de la République populaire de Chine à
    l’issue d’un réexamen intermédiaire au titre de l’article 11, paragraphe
    4, du règlement (UE) 2016/1036 du Parlement européen et du Conseil et mettant
    fin à l’enregistrement de ces importations
  type: main
- language: de
