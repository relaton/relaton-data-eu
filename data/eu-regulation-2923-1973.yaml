title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2923/73 of the Commission of 26 October 1973 re-establishing
    Common Customs Tariff duties on men' s and boys' under garments, including collars,
    shirt fronts and cuffs, other than of cotton, of heading No ex 61.03 of the Common
    Customs Tariff, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2629/73 of 26 September
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2923/73 de la Commission, du 26 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessous (linge de corps) pour hommes et garçonnets, y compris
    les cols, faux cols, plastrons et manchettes, en tissus autres que de coton, de
    la position tarifaire ex 61.03, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2629/73 du Conseil du 26 septembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2923/73 der Kommission vom 26. Oktober 1973 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Unterkleidung
    (Leibwäsche) für Männer und Knaben, auch Kragen, Vorhemden und Manschetten,
    aus anderen Geweben als aus Baumwolle, der Tarifnummer ex 61.03, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2629/73 des Rates
    vom 26. September 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2923/73 af 26. oktober 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for underbeklædningsgenstande til mænd
    og drenge, herunder flipper, skjortebryster og manchetter, undtagen af bomuld,
    under position ex 61.03, som har oprindelse i udviklingslande og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2629/73 af 26.
    september 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2923/73 della Commissione, del 26 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    sottovesti (biancheria da dosso) per uomo e per ragazzo, compresi i colli, colletti,
    sparati e polsini in tessuti non di cotone, della voce doganale n. ex 61.03 originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2629/73 del Consiglio, del 26 settembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2923/73 van de Commissie van 26 oktober 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen, van andere weefsels dan van katoen, van tariefpost
    ex 61.03, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2629/73 van de Raad van 26 september 1973 algemene tariefpreferenties
    werden geopend
  type: main
