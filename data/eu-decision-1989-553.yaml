    ορισμένων τμημάτων του εδάφους του Βελγίου
    ως επίσημα απαλλαγμένων από την κλασική πανώλη
    των χοίρων'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 12 ottobre 1989 recante seconda modifica
    alla decisione 89/224/CEE della Commissione che riconosce ufficialmente indenni
    dalla peste suina alcune parti del territorio del Belgio (I testi in lingua francese
    e olandese sono i soli facenti fede) (89/553/CEE) (89/553/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 12 oktober 1989 tot tweede wijziging
