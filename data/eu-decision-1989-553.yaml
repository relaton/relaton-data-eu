title:
- language: en
  script: Latn
  content: '89/551/EEC: Commission Decision of 12 October 1989 amending for the second
    time Decision 89/224/EEC recognizing certain parts of Belgium as being officially
    swine fever free (only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/553/CEE: Décision de la Commission du 12 octobre 1989 modifiant pour
    la deuxième fois la décision 89/224/CEE de la Commission reconnaissant certaines
    parties du territoire de la Belgique comme officiellement indemnes de peste porcine
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 12. Oktober 1989 zur zweiten Änderung
    der Entscheidung 89/224/EWG, durch die bestimmte Teile des Hoheitsgebiets Belgiens
    amtlich als schweinepestfrei anerkannt wurden (Nur der französische und der niederländische
    Text sind verbindlich) (89/553/EWG) (89/553/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 12. oktober 1989 om anden ændring af beslutning
    89/224/EØF om anerkendelse af visse områder i Belgien som værende officielt
    fri for svinepest (Kun den franske og den nederlandske udgave er autentisk) (89/553/EØF)
    (89/553/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/553/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
