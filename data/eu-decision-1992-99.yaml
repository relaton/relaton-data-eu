title:
- language: en
  script: Latn
  content: '92/99/EEC: Commission Decision of 22 January 1992 amending Decision 86/473/EEC
    as regards the list of establishments in Uruguay approved for the purpose of importing
    meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '92/99/CEE: Décision de la Commission du 22 janvier 1992 modifiant la
    décision 86/473/CEE en ce qui concerne la liste des établissements d''Uruguay
    agréés pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 22. Januar 1992 zur Änderung der Entscheidung
    86/473/EWG in bezug auf die Liste der Betriebe in Uruguay, aus denen die Einfuhr
    von Fleischerzeugnissen in die Gemeinschaft zugelassen ist (92/99/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 22. januar 1992 om ændring af beslutning
    86/473/EØF for så vidt angår listen over de virksomheder i Uruguay, der er
    godkendt til indførsel af kødprodukter til Fællesskabet (92/99/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/99/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Ιανουαρίου
    1992 που τροποποιεί την απόφαση 86/473/ΕΟΚ όσον
    αφορά τον πίνακα των εγκαταστάσεων της Ουρουγουάης
    που έχουν εγκριθεί για την εισαγωγή προϊόντων
    με βάση το κρέας στην Κοινότητα'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 gennaio 1992 che modifica la decisione
    86/473/CEE per quanto riguarda l' elenco degli stabilimenti dell' Uruguay, in
    provenienza dai quali è autorizzata l' importazione di prodotti a base di carne
    nella Comunità (92/99/CEE)
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 22 januari 1992 tot wijziging van Beschikking
    86/473/EEG met betrekking tot de lijst van inrichtingen in Uruguay die erkend
    zijn voor de invoer van vleesprodukten in de Gemeenschap (92/99/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '92/99/CEE: Decisão da Comissão, de 22 de Janeiro de 1992, que altera
    a Decisão 86/473/CEE no que respeita à lista dos estabelecimentos do Uruguai
    aprovados para a importação de produtos à base carne pela Comunidade'
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 22 de enero de 1992 por la que se modifica
    la Decisión 85/473/CEE en lo que se refiere a la lista de los establecimientos
    de Uruguay autorizados para la importación de productos a base de carne en la
    Comunidad (92/99/CEE)
  type: main
