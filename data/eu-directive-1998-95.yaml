---
id: EUDirective199895
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 98/95/EC of 14 December 1998 amending, in respect of
    the consolidation of the internal market, genetically modified plant varieties
    and plant genetic resources, Directives 66/400/EEC, 66/401/EEC, 66/402/EEC, 66/403/EEC,
    69/208/EEC, 70/457/EEC and 70/458/EEC on the marketing of beet seed, fodder plant
    seed, cereal seed, seed potatoes, seed of oil and fibre plants and vegetable seed
    and on the common catalogue of varieties of agricultural plant species
  type: main
- language: fr
  script: Latn
  content: Directive 98/95/CE du Conseil du 14 décembre 1998 modifiant, quant à
    la consolidation du marché intérieur, aux variétés végétales génétiquement
    modifiées et aux ressources génétiques des plantes, les directives 66/400/CEE,
    66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE et 70/458/CEE concernant
    la commercialisation des semences de betteraves, des semences de plantes fourragères,
    des semences de céréales, des plants de pommes de terre, des semences de plantes
    oléagineuses et à fibres et des semences de légumes ainsi que le catalogue
    commun des variétés des espèces de plantes agricoles
  type: main
- language: de
  script: Latn
  content: Richtlinie 98/95/EG des Rates vom 14. Dezember 1998 zur Änderung der Richtlinien
    66/400/EWG, 66/401/EWG, 66/402/EWG, 66/403/EWG, 69/208/EWG, 70/457/EWG und 70/458/EWG
    über den Verkehr mit Betarübensaatgut, Futterpflanzensaatgut, Getreidesaatgut,
    Pflanzkartoffeln, Saatgut von Öl- und Faserpflanzen, Gemüsesaatgut und über
    den gemeinsamen Sortenkatalog für landwirtschaftliche Pflanzen, und zwar hinsichtlich
    der Konsolidierung des Binnenmarkts, genetisch veränderter Sorten und pflanzengenetischer
    Ressourcen
  type: main
- language: bg
  script: Cyrl
  content: Директива 98/95/ЕO на Съвета от 14 декември
    1998 година за изменение, по отношение на консолидирането
    на вътрешния пазар, генетично модифицираните
    растителни сортове и растителните генетични
    ресурси, на Директиви 66/400/ЕИО, 66/401/ЕИО, 66/402/ЕИО,
    66/403/ЕИО, 69/208/ЕИО, 70/457/ЕИО и 70/458/ЕИО относно търговията
    със семена от цвекло, фуражни култури, зърнени
    култури, посадъчен материал от картофи, семена
    от маслодайни и влакнодайни култури и зеленчуци
    и относно общия каталог на сортовете от земеделски
    растителни видове
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 98/95/ES ze dne 14. prosince 1998, kterou se mění směrnice
    66/400/EHS, 66/401/EHS, 66/402/EHS, 66/403/EHS, 69/208/EHS, 70/457/EHS a 70/458/EHS
    o uvádění osiva řepy, osiva pícnin, osiva obilovin, sadby brambor, osiva
    olejnin a přadných rostlin a osiva zeleniny na trh a o Společném katalogu
    odrůd druhů zemědělských rostlin, pokud se týká konsolidace vnitřního
    trhu, geneticky modifikovaných rostlinných odrůd a genetických zdrojů rostlin
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 98/95/EF af 14. december 1998 om ændring med hensyn til
    konsolidering af det indre marked, genetisk modificerede plantesorter og plantegenetiske
    ressourcer af direktiv 66/400/EØF, 66/401/EØF, 66/402/EØF, 66/403/EØF, 69/208/EØF,
    70/457/EØF og 70/458/EØF om handel med bederoefrø, frø af foderplanter, sædekorn,
    læggekartofler, frø af olie- og spindplanter og grøntsagsfrø og om den fælles
    sortsliste over landbrugsplantearter
  type: main
- language: el
  script: Grek
  content: Οδηγία 98/95/ΕΚ του Συμβουλίου της 14ης Δεκεμβρίου
    1998 για την τροποποίηση, στα πλαίσια της ενοποίησης
    της εσωτερικής αγοράς, των γενετικώς τροποποιημένων
    φυτικών ποικιλιών και των φυτικών γενετικών
    πόρων, των οδηγιών 66/400/ΕΟΚ, 66/401/ΕΟΚ, 66/402/ΕΟΚ,
    66/403/ΕΟΚ, 69/208/ΕΟΚ, 70/457/ΕΟΚ και 70/458/ΕΟΚ που αφορούν,
    αντίστοιχα, την εμπορία σπόρων προς σπορά τεύτλων,
    κτηνοτροφικών φυτών, σιτηρών, γεωμήλων, ελαιούχων
    και κλωστικών φυτών, κηπευτικών και τον κοινό
    κατάλογο ποικιλιών των καλλιεργούμενων φυτικών
    ειδών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 98/95/EÜ, 14. detsember 1998, millega muudetakse siseturu
    konsolideerimise, geneetiliselt muundatud taimesortide ja taimede geneetiliste
    ressursside osas direktiive 66/400/EMÜ, 66/401/EMÜ, 66/402/EMÜ, 66/403/EMÜ,
    69/208/EMÜ, 70/457/EMÜ ja 70/458/EMÜ peediseemne, söödakultuuride seemne,
    teraviljaseemne, seemnekartuli, õli- ja kiudtaimede seemne ja köögiviljaseemne
    turustamise ning ühise põllumajandustaimesortide kataloogi kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 98/95/EY, annettu 14 päivänä joulukuuta 1998, juurikkaiden
    siementen pitämisestä kaupan annetun direktiivin 66/400/ETY, rehukasvien siementen
    pitämisestä kaupan annetun direktiivin 66/401/ETY, viljakasvien siementen pitämisestä
    kaupan annetun direktiivin 66/402/ETY, siemenperunoiden pitämisestä kaupan annetun
    direktiivin 66/403/ETY, öljy- ja kuitukasvien siementen pitämisestä kaupan
    annetun direktiivin 69/208/ETY, viljelykasvilajien yleisestä lajikeluettelosta
    annetun direktiviin 70/457/ETY ja vihannesten siementen pitämisestä kaupan annetun
    direktiivin 70/458/ETY muuttamisesta sisämarkkinoiden vahvistamisen, geneettisesti
    muunnettujen kasvilajikkeiden ja kasvien geenivarojen osalta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 98/95/EZ od 14. prosinca 1998. o izmjeni direktiva 66/400/EEZ,
    66/401/EEZ, 66/402/EEZ, 66/403/EEZ, 69/208/EEZ, 70/457/EEZ i 70/458/EEZ o stavljanju
    na tržište sjemena repa, sjemena krmnog bilja, sjemena žitarica, sjemenskog
    krumpira, sjemena uljarica i predivog bilja i sjemena povrća te o Zajedničkoj
    sortnoj listi poljoprivrednog bilja, u vezi s konsolidacijom unutarnjeg tržišta,
    genetski modificiranih biljnih vrsta i biljnih genetskih resursa
  type: main
- language: hu
  script: Latn
  content: A Tanács 98/95/EK irányelve (1998. december 14.) a cukorrépa-vetőmag,
    a takarmánynövény-vetőmagok, a gabonavetőmagok, a vetőburgonya, az olaj-
    és rostnövények vetőmagjának és a zöldségvetőmag forgalmazásáról,
    valamint a mezőgazdasági növényfajok közös fajtajegyzékéről szóló 66/400/EGK,
    66/401/EGK, 66/402/EGK, 66/403/EGK, 69/208/EGK, 70/457/EGK és 70/458/EGK irányelveknek
    a belső piac egységesítésére, a géntechnológiával módosított növényfajtákra
    és a növénygenetikai forrásokra tekintettel történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 98/95/CE del Consiglio del 14 dicembre 1998 che modifica, per
    quanto riguarda il consolidamento del mercato interno, le varietà geneticamente
    modificate e le risorse genetiche delle piante, le direttive 66/400/CEE, 66/401/CEE,
    66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE e 70/458/CEE concernenti la commercializzazione
    delle sementi di barbabietole, delle sementi di piante foraggere, delle sementi
    di cereali, dei tuberi-seme di patate, delle sementi di piante oleaginose e da
    fibra e delle sementi di ortaggi e il catalogo comune delle varietà delle specie
    di piante agricole
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 98/95/EK (1998. gada 14. decembris), ar ko attiecībā
    uz iekšējā tirgus konsolidēšanu, ģenētiski modificētu augu šķirnēm
    un augu ģenētiskajiem resursiem groza Direktīvas 66/400/EEK, 66/401/EEK, 66/402/EEK,
    66/403/EEK, 66/208/EEK, 70/457/EEK un 70/458/EEK par biešu sēklu, lopbarības
    augu sēklu, graudaugu sēklu, sēklas kartupeļu, eļļas augu un šķiedraugu
    sēklu, kā arī dārzeņu sēklu tirdzniecību, un par kopējo lauksaimniecības
    augu šķirņu katalogu
  type: main
- language: lt
  script: Latn
  content: 1998 m. gruodžio 14 d. Tarybos direktyva 98/95/EB, iš dalies pakeičianti
    Direktyvų 66/400/EEB, 66/401/EEB, 66/402/EEB, 66/403/EEB, 69/208/EEB, 70/457/EEB
    ir 70/458/EEB dėl prekybos runkelių sėkla, pašarinių augalų sėkla, javų
    sėkla, sėklinėmis bulvėmis, aliejinių ir pluoštinių augalų sėkla, daržovių
    sėkla ir dėl bendrojo žemės ūkio augalų veislių katalogo vidaus rinkos
    stiprinimo ir genetiškai modifikuotų augalų veislių ir augalų genetinių
    išteklių atžvilgiu
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 98/95/KE ta' l-14 ta' Diċembru 1998 li temenda,
    fir-rigward tal-konsolidazzjoni tas-suq intern, il-varjetajiet ta' pjanti ġenetikament
    immodifikati u r-riżorsi ġenetiċi tal-pjanti, id-Direttivi 66/400/KEE, 66/401/EEC,
    66/402/KEE, 66/403/KEE, 69/208/KEE, 70/457/KEE u 70/458/KEE dwar il-kummerċ taż-żerriegħa
    tal-pitravi, iż-żerriegħa tal-pjanti ta' l-għalf, iż-żerriegħa taċ-ċereali,
    il-patata taż-żrigħ, iż-żerriegħa tal-pjanti taż-żejt u l-fibri u ż-żerriegħa
    tal-ħxejjex ta' l-ikel u l-katalogu komuni tal-varjetajiet ta' l-ispeċi tal-pjanti
    agrikoli
  type: main
- language: nl
  script: Latn
  content: Richtlijn 98/95/EG van de Raad van 14 december 1998 houdende wijziging,
    in het kader van de consolidatie van de interne markt en ten aanzien van genetisch
    gemodificeerde plantenrassen en plantgenetische hulpbronnen, van de Richtlijnen
    66/400/EEG, 66/401/EEG, 66/402/EEG, 66/403/EEG, 69/208/EEG, 70/457/EEG en 70/458/EEG
    betreffende het in de handel brengen van bietenzaad, zaaizaad van groenvoedergewassen,
    zaaigranen, pootaardappelen, zaaizaad van oliehoudende planten en vezelgewassen
    en groentezaad, en betreffende de gemeenschappelijke rassenlijst voor landbouwgewassen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 98/95/WE z dnia 14 grudnia 1998 r. zmieniająca, w odniesieniu
    do konsolidacji rynku wewnętrznego odmian roślin modyfikowanych genetycznie
    oraz genetycznych zasobów roślinnych, dyrektywy 66/400/EWG, 66/401/EWG, 66/402/EWG,
    66/403/EWG, 69/208/EWG, 70/457/EWG i 70/458/EWG w sprawie obrotu materiałem siewnym
    buraka, materiałem siewnym roślin pastewnych, materiałem siewnym zbóż, sadzeniakami
    ziemniaków, materiałem siewnym roślin oleistych i włóknistych, oraz materiałem
    siewnym warzyw, oraz w sprawie wspólnego katalogu odmian gatunków roślin uprawnych
  type: main
- language: pt
  script: Latn
  content: Directiva 98/95/CE do Conselho de 14 de Dezembro de 1998 que altera, no
    que diz respeito à consolidação do mercado interno, às variedades de plantas
    geneticamente modificadas e aos recursos genéticos vegetais, as Directivas 66/400/CEE,
    66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE e 70/458/CEE relativas
    à comercialização de sementes de beterraba, sementes de plantas forrageiras,
    sementes de cereais, batatas de semente, sementes de plantas oleaginosas e de
    fibras e sementes de produtos hortícolas e ao catálogo comum das variedades
    das espécies de plantas agrícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 98/95/CE a Consiliului din 14 decembrie 1998 de modificare, cu
    privire la consolidarea pieței interne, a varietăților vegetale modificate
    genetic și a resurselor genetice ale plantelor, a Directivelor 66/400/CEE, 66/401/CEE,
    66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE și 70/458/CEE privind comercializarea
    semințelor de sfeclă, semințelor de plante furajere, semințelor de cereale,
    cartofilor de sămânță, semințelor de plante oleaginoase și de fibră și
    a semințelor de legume, precum și catalogul comun al soiurilor de specii de
    plante agricole
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 98/95/ES zo 14. decembra 1998, ktorou sa vzhľadom na konsolidáciu
    vnútorného trhu, geneticky modifikované odrody rastlín a genetické zdroje
    rastlín, menia a dopĺňajú smernice 66/400EHS, 66/401/EHS, 66/402/EHS, 66/403/EHS,
    69/208/EHS, 70/457/EHS a 70/458/EHS o obchodovaní s osivom repy, osivom krmovín,
    osivom obilnín, so sadivom zemiakov, s osivom olejnín a priadnych rastlín a
    s osivom zelenín a o spoločnom katalógu odrôd poľnohospodárskych rastlín
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 98/95/ES z dne 14. decembra 1998 o spremembi, v zvezi s
    konsolidacijo notranjega trga, gensko spremenjenimi sortami rastlin in rastlinskimi
    genskimi viri, direktiv 66/400/EGS, 66/401/EGS, 66/402/EGS, 66/403/EGS, 69/208/EGS,
    70/457/EGS in 70/458/EGS o trženju semena pese, semena krmnih rastlin, semena
    žit, semenskega krompirja, semena oljnic in predivnic in semena zelenjadnic ter
    o skupnem katalogu sort poljščin
  type: main
- language: es
  script: Latn
  content: Directiva 98/95/CE del Consejo de 14 de diciembre de 1998 que modifica,
    respecto de la consolidación del mercado interior, las variedades de plantas
    modificadas genéticamente y los recursos fitogenéticos, las Directivas 66/400/CEE,
    66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE y 70/458/CEE sobre
    la comercialización de las semillas de remolacha, de las semillas de plantas
    forrajeras, de las semillas de cereales, de las patatas de siembra, de las semillas
    de plantas oleaginosas y textiles, de las semillas de plantas hortícolas y sobre
    el Catálogo común de las variedades de las especies de plantas agrícolas
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 98/95/EG av den 14 december 1998 om ändring angående
    konsolideringen av den inre marknaden, genetiskt modifierade växtsorter samt
    växtgenetiska resurser, av direktiven 66/400/EEG, 66/401/EEG, 66/402/EEG, 66/403/EEG,
    69/208/EEG, 70/457/EEG och 70/458/EEG om saluföring av betutsäde, utsäde av
    foderväxter, utsäde av stråsäd, utsädespotatis, utsäde av olje- och spånadsväxter
    och utsäde av köksväxter samt om den gemensamma sortlistan för arter av lantbruksväxter
  type: main
