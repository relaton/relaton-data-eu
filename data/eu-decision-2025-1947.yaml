title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1947 of 18 September 2025 on the position to
    be taken on behalf of the European Union within the Association Council established
    by the Euro-Mediterranean Agreement establishing an association between the European
    Communities and their Member States, of the one part, and the Kingdom of Morocco,
    of the other part, with regard to a decision amending Protocol 4 to that Agreement
    concerning the definition of the concept of ‘originating products’ and methods
    of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1947 du Conseil du 18 septembre 2025 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    les Communautés européennes et leurs États membres, d’une part, et le Royaume
    du Maroc, d’autre part en ce qui concerne une décision modifiant le protocole
    n° 4 dudit accord relatif à la définition de la notion de «produits originaires»
    et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/1947 des Rates vom 18. September 2025 zur Festlegung
