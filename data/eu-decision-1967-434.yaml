  content: Décision de la Commission, du 30 juin 1967, relative aux méthodes de
    coopération administrative propres à assurer la libre circulation des produits
    des secteurs des céréales, de la viande de porc, des oeufs et de la viande de
    volaille
  type: main
- language: de
  script: Latn
  content: '67/434/EWG: Entscheidung der Kommission vom 30. Juni 1967 über die Methoden
    der Zusammenarbeit der Verwaltungen zur Herstellung eines freien Warenverkehrs
    auf den Märkten für Getreide, Schweinefleisch, Eier und Geflügelfleisch'
  type: main
- language: it
  script: Latn
  content: '67/434/CEE: Decisione della Commissione, del 30 giugno 1967, relativa
    ai metodi di cooperazione amministrativa idonei ad assicurare la libera circolazione
    di prodotti dei settori dei cereali, della carne suina, delle uova e del pollame'
  type: main
- language: nl
  script: Latn
  content: '67/434/EEG: Beschikking van de Commissie van 30 juni 1967 betreffende
    de methoden voor administratieve samenwerking aan de hand waarvan het vrije verkeer
    van de produkten van de sectoren granen, varkensvlees, eieren en slachtpluimvee
    kan worden gewaarborgd'
