  script: Latn
  content: '2001/657/EC: Commission Decision of 6 August 2001 derogating from the
    definition of the concept of "originating products" to take account of the special
    situation of Saint Pierre and Miquelon with regard to frozen fillets of cod, redfish,
    plaice and halibut of CN code 030420 (Text with EEA relevance) (notified under
    document number C(2001) 2462)'
  type: main
- language: fr
  script: Latn
