title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1971/1999 of 15 September 1999 amending the
    Annex to Commission Regulation (EC) No 1084/1999 establishing the list of competent
    authorities referred to in Article 2 of Council Regulation (EC) No 900/1999 prohibiting
    the sale and supply of petroleum and petroleum products to the Federal Republic
    of Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1971/1999 de la Commission, du 15 septembre 1999, modifiant
    l'annexe du règlement (CE) nº 1084/1999 établissant la liste des autorités
    compétentes visées à l'article 2 du règlement (CE) nº 900/1999 du Conseil
    concernant l'interdiction de la vente et de la fourniture de pétrole et de certains
    produits pétroliers à la République fédérale de Yougoslavie
  type: main
