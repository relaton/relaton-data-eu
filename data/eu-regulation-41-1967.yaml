    du bétail
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 41/67/EWG der Kommission vom 28. Februar 1967 über die
    Durchführungsbestimmungen zur Verordnung Nr. 215/66/EWG über die Regelung für
    Milch-Mischfuttermittel und für Milchpulver für Futterzwecke
  type: main
- language: it
  script: Latn
  content: Regolamento n. 41/67/CEE della Commissione, del 28 febbraio 1967, che stabilisce
    le modalità di applicazione del regolamento n. 215/66/CEE relativo al regime
    applicabile agli alimenti composti a base di prodotti lattiero-caseari e al latte
    in polvere destinati all'alimentazione del bestiame
  type: main
- language: nl
  script: Latn
  content: Verordening no. 41/67/EEG van de Commissie van 28 februari 1967 inzake
    de wijze van uitvoering van Verordening no. 215/66/EEG betreffende de regeling
    voor mengvoeders op basis van zuivelprodukten en voor melkpoeder voor voederdoeleinden
