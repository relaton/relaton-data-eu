title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2889/79 of 20 December 1979 re-establishing
    the levying of customs duties on tubes and pipes, pipes and blanks therefor, of
    copper ; hollow bars of copper, falling within heading No 74.07 and originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2889/79 de la Commission, du 20 décembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    74.07 du tarif douanier commun, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2889/79 der Kommission vom 20. Dezember 1979 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2889/79 af 20. december 1979 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under pos. 74.07, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2889/79 della Commissione, del 20 dicembre 1979, che
    ripri-stina la riscossione dei dazi doganali applicabili a tubi (compresi i loro
    sbozzi) e barre forate, di rame della voce 74.07 della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2889/79 van de Commissie van 20 december 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor buizen en pijpen (ook
    indien niet afgewerkt) en holle staven, van koper, van post 74.07, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad tariefpreferenties werden geopend
  type: main
