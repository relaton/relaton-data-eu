title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1729/1999 of 28 July 1999 laying down special
    measures derogating from Regulations (EEC) No 3665/87 and (EEC) No 3719/88 as
    regards milk and milk products, beef and veal, pigmeat, eggs, poultrymeat, agricultural
    products exported in the form of goods not covered by Annex I to the Treaty and
    certain cereal products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1729/1999 de la Commission, du 28 juillet 1999, portant
    mesures spéciales dérogeant au règlement (CEE) nº 3665/87 et au règlement
    (CEE) nº 3719/88 dans les secteurs du lait et des produits laitiers, de la viande
    bovine, de la viande de porc, des oeufs, de la viande de volaille, des produits
    exportés sous forme de marchandises ne relevant pas de l'annexe I du traité
    et pour certains produits de céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1729/1999 der Kommission vom 28. Juli 1999 mit Sondervorschriften
    für die Abweichung von den Verordnungen (EWG) Nr. 3665/87 und (EWG) Nr. 3719/88
    in bezug auf Milch und Milcherzeugnisse, Rindfleisch, Schweinefleisch, Eier, Geflügelfleisch,
    landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang I des Vertrags
    fallenden Waren ausgeführt werden, sowie bestimmte Getreideprodukte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1729/1999 af 28. juli 1999 om fastsættelse
    af særlige foranstaltninger, der udgør undtagelser fra forordning (EØF) nr.
    3665/87 og (EØF) nr. 3719/88, for så vidt angår mælk, mejeriprodukter, oksekød,
    svinekød, æg, fjerkrækød, landbrugsprodukter, der udføres i form af varer,
    som ikke er omfattet af traktatens bilag I, og visse kornprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1729/1999 της Επιτροπής,
    της 28ης Ιουλίου 1999, για ειδικά μέτρα παρέκκλισης
    από τους κανονισμούς (ΕΟΚ) αριθ. 3665/87 και (ΕΟΚ)
    αριθ. 3719/88 όσον αφορά το γάλα και τα γαλακτοκομικά
    προϊόντα, το βόειο κρέας, το χοίρειο κρέας,
    τα αυγά, το κρέας πουλερικών, μερικά προϊόντα
    δημητριακών και γεωργικά προϊόντα που εξάγονται
    υπό μορφή ειδών μη καλυπτόμενων από το παράρτημα
    Ι της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1729/1999, annettu 28 päivänä heinäkuuta
    1999, maitoa ja maitotuotteita, naudanlihaa, sianlihaa, munia, siipikarjanlihaa,
    perustamissopimuksen liitteeseen I kuulumattomina tavaroina vietyjä maataloustuotteita
    sekä tiettyjä viljatuotteita koskevista asetusten (ETY) N:o 3665/87 ja (ETY)
    N:o 3719/88 säännöksistä poikkeavista erityistoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1729/1999 della Commissione, del 28 luglio 1999, recante
    misure speciali in deroga ai regolamenti (CEE) n. 3665/87 e (CEE) n. 3719/88 per
    quanto riguarda il latte e i prodotti lattiero-caseari, le carni bovine, le carni
    suine, le uova, le carni di pollame, i prodotti agricoli esportati sotto forma
    di merci non comprese nell'allegato I del trattato e taluni prodotti del settore
    dei cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1729/1999 van de Commissie van 28 juli 1999 houdende
    bijzondere maatregelen tot afwijking van de Verordeningen (EEG) nr. 3665/87 en
    (EEG) nr. 3719/88 ten aanzien van melk en zuivelproducten, rundvlees, varkensvlees,
    eieren, slachtpluimvee, in de vorm van niet onder bijlage I bij het Verdrag vallende
    goederen geëxporteerde landbouwproducten en bepaalde producten van de sector
    granen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1729/1999 da Comissão, de 28 de Julho de 1999, que
    estabelece medidas especiais de derrogação dos Regulamentos (CEE) n° 3665/87
    e (CEE) n° 3719/88 no que respeita ao leite e produtos lácteos, à carne de
    bovino, à carne de suíno, aos ovos, à carne de aves de capoeira, aos produtos
    agrícolas exportados na forma de mercadorias não abrangidas pelo anexo I do
    Tratado e certos produtos do sector dos cereais
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1729/1999 de la Comisión, de 28 de julio de 1999,
    por el que se establecen medidas especiales de inaplicación de los Reglamentos
    (CEE) nos 3665/87 y 3719/88 en lo que respecta a la leche, los productos lácteos,
    la carne de vacuno y de porcino, los huevos y la carne de aves de corral, los
    productos agrícolas exportados en forma de mercancías no incluidas en el anexo
    I del Tratado y determinados productos del sector de cereales
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1729/1999 av den 28 juli 1999 om fastställande
    av särskilda undantag från förordningarna (EEG) nr 3665/87 och (EEG) nr 3719/88
    när det gäller mjölk och mjölkprodukter, nöt-, kalv- och griskött, ägg,
    fjäderfäkött, jordbruksprodukter som exporteras i form av varor som inte omfattas
    av bilaga I till fördraget, och vissa produkter inom spannmålsektorn
