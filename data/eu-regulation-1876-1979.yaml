title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1876/79 of 24 August 1979 re-establishing
    the levying of customs duties on wooden broom and brush handles, falling within
    subheading 44.25 ex B and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1876/79 de la Commission, du 24 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux manches
    de balais et de brosses, en bois, de la sous-position 44.25 ex B du tarif douanier
    commun, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1876/79 der Kommission vom 24. August 1979 zur Wiedereinführung
    des Zollsatzes für Griffe für Besen, Bürsten und Pinsel, aus Holz, der Tarifstelle
    44.25 ex B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1876/79 af 24. august 1979 om genindførelse
    af opkrævning af toldafgifter for skafter af træ til koste og børster, under
    underposition 44.25 ex B, som har oprindelse i udviklingslande og omfattes af
    de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1876/79 della Commissione, del 24 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai manichi di scope e
    spazzole, di legno, della sottovoce 44.25 ex B della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1876/79 van de Commissie van 24 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor borstel- of bezemstelen,
    van hout, van post 44.25 ex B, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties werden
    geopend
  type: main
