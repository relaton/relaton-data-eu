title:
- language: en
  script: Latn
  content: 2004/738/EC:Council Decision of 21 October 2004 authorising Portugal to
    apply a measure derogating from Articles 21(1)(a) and 22 of Sixth Directive 77/388/EEC
    on the harmonisation of the laws of the Member States relating to turnover taxes
  type: main
- language: fr
  script: Latn
  content: 2004/738/CE:Décision du Conseil du 21 octobre 2004 autorisant le Portugal
    à appliquer une mesure dérogatoire à l’article 21, paragraphe 1, point a),
    et à l’article 22 de la sixième directive 77/388/CEE en matière d’harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d’affaires
  type: main
- language: de
  script: Latn
  content: 2004/738/EG:Entscheidung des Rates vom 21. Oktober 2004 zur Ermächtigung
    Portugals zur Anwendung einer von Artikel 21 Absatz 1 Buchstabe a) und Artikel
    22 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichenden Regelung
  type: main
- language: cs
  script: Latn
  content: 2004/738/ES:Rozhodnutí Rady ze dne 21. října 2004, kterým se Portugalsku
    povoluje uplatňovat opatření odchylující se od čl. 21 odst. 1 písm. a)
    a článku 22 šesté směrnice Rady 77/388/EHS o harmonizaci právních předpisů
    členských států týkajících se daní z obratu
  type: main
- language: da
  script: Latn
  content: 2004/738/EF:Rådets beslutning af 21. oktober 2004 om bemyndigelse af Portugal
    til at anvende en foranstaltning, der fraviger artikel 21, stk. 1, litra a), og
    artikel 22 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter
  type: main
- language: el
  script: Grek
  content: 2004/738/ΕΚ:Απόφαση του Συμβουλίου, της 21ης
    Οκτωβρίου 2004, για την εξουσιοδότηση της Πορτογαλικής
    Δημοκρατίας να εφαρμόσει μέτρο παρέκκλισης
    από το άρθρο 21 παράγραφος 1 στοιχείο α) και το
    άρθρο 22 της έκτης οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών
  type: main
- language: et
  script: Latn
  content: 2004/738/EÜ:Nõukogu otsus, 21. oktoober 2004, millega Portugalil lubatakse
    kohaldada meedet, mis kaldub kõrvale kuuenda direktiivi 77/388/EMÜ (kumuleeruvate
    käibemaksudega seotud liikmesriikide õigusaktide ühtlustamise kohta) artikli
    21 lõike 1 punktist a ja artiklist 22
  type: main
- language: fi
  script: Latn
  content: 2004/738/EY:Neuvoston päätös, tehty 21 päivänä lokakuuta 2004, luvan
    antamisesta Portugalille soveltaa jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin 77/388/ETY 21 artiklan 1 kohdan
    a alakohdasta ja 22 artiklasta poikkeavaa toimenpidettä
  type: main
- language: hu
  script: Latn
  content: 2004/738/EK:A Tanács határozata (2004. október 21.) Portugália felhatalmazásáról
    arra, hogy eltérést jelentő intézkedést alkalmazzon a tagállamok forgalmi
    adóra vonatkozó jogszabályainak összehangolásáról szóló 77/388/EGK hatodik
    tanácsi irányelv 21. cikke (1) bekezdésének a) pontját és 22. cikkét illetően
  type: main
- language: it
  script: Latn
  content: 2004/738/CE:Decisione del Consiglio, del 21 ottobre 2004, che autorizza
    il Portogallo ad applicare un provvedimento di deroga all’articolo 21, paragrafo
    1, lettera a), e all’articolo 22 della sesta direttiva 77/388/CEE del Consiglio,
    in materia di armonizzazione delle legislazioni degli Stati membri relative alle
    imposte sulla cifra di affari
  type: main
- language: lv
  script: Latn
  content: 2004/738/EK:Padomes Lēmums (2004. gada 21. oktobris), ar ko Portugālei
    ļauj piemērot pasākumu, ar kuru atkāpjas no 21. panta 1. punkta a) apakšpunkta
    un 22. panta Sestajā direktīvā 77/388/EEK par to, kā saskaņojami dalībvalstu
    tiesību akti par apgrozījuma nodokļiem
  type: main
- language: lt
  script: Latn
  content: 2004/738/EB:2004 m. spalio 21 d. Tarybos sprendimas, leidžiantis Portugalijai
    taikyti priemonę, nukrypstančią nuo Šeštosios direktyvos 77/388/EEB dėl
    valstybių narių apyvartos mokesčių įstatymų derinimo 21 straipsnio 1 dalies
    a punkto ir 22 straipsnio
  type: main
- language: mt
  script: Latn
  content: '2004/738/KE: Deċiżjoni tal-Kunsill tal- 21 ta’ Ottubru 2004 li tawtorizza
    lill-Portugall japplika miżura derogatorja mill-Artikoli 21(1)(a) u 22 tas-Sitt
    Direttiva 77/388/KEE dwar l-armonizzazzjoni tal-liġijiet ta'' l-Istati Membri
    fir-rigward ta'' taxxi fuq il-valur tal-bejgħ'
  type: main
- language: nl
  script: Latn
  content: 2004/738/EG:Beschikking van de Raad van 21 oktober 2004 waarbij Portugal
    wordt gemachtigd tot toepassing van een maatregel die afwijkt van artikel 21,
    lid 1, onder a), en artikel 22 van de Zesde Richtlijn 77/388/EEG betreffende de
    harmonisatie van de wetgevingen der lidstaten inzake omzetbelasting
  type: main
- language: pl
  script: Latn
  content: 2004/738/WE:Decyzja Rady z dnia 21 października 2004 r. upoważniająca
    Portugalię do zastosowania środka stanowiącego odstępstwo od art. 21 ust.
    1 lit. a) i art. 22 szóstej dyrektywy 77/388/EWG w sprawie harmonizacji ustawodawstw
    Państw Członkowskich w odniesieniu do podatków obrotowych
  type: main
- language: pt
  script: Latn
  content: 2004/738/CE:Decisão do Conselho, de 21 de Outubro de 2004, que autoriza
    a República Portuguesa a aplicar uma medida derrogatória da alínea a) do n.°
    1 do artigo 21.° e do artigo 22.° da sexta Directiva 77/388/CEE relativa à
    harmonização das legislações dos Estados-Membros respeitantes aos impostos
    sobre o volume de negócios
  type: main
- language: sk
  script: Latn
  content: 2004/738/ES:Rozhodnutie Rady z 21. októbra 2004, ktorým sa Portugalsku
    povoľuje výnimka z uplatňovania článku 21 ods. 1 písm. a) a článku 22
    šiestej smernice Rady 77/388/EHS o zosúladení právnych predpisov členských
    štátov týkajúcich sa daní z obratu
  type: main
- language: sl
  script: Latn
  content: 2004/738/ES:Odločba Sveta z dne 21. oktobra 2004 ki dovoljuje Portugalski
    uporabo ukrepa o odstopanju od člena 21(1)(a) in člena 22 Šeste direktive Sveta
    77/388/EGS o usklajevanju zakonodaje držav članic o prometnih davkih
  type: main
- language: es
  script: Latn
  content: 2004/738/CE:Decisión del Consejo, de 21 de octubre de 2004, por la que
    se autoriza a Portugal a aplicar una medida de excepción a lo dispuesto en la
    letra a) del apartado 1 del artículo 21 y en el artículo 22 de la Sexta Directiva
    77/388/CEE en materia de armonización de las legislaciones de los Estados miembros
    relativas a los impuestos sobre el volumen de negocios
  type: main
- language: sv
  script: Latn
  content: 2004/738/EG:Rådets beslut av den 21 oktober 2004 om bemyndigande för
    Portugal att införa en åtgärd som avviker från artikel 21.1 a och artikel
    22 i rådets sjätte direktiv 77/388/EEG om harmonisering av medlemsstaternas
    lagstiftning rörande omsättningsskatter
  type: main
