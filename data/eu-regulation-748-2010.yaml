    (EG) Nr. 1425/2006 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Säcke und Beutel aus Kunststoffen mit Ursprung in der Volksrepublik
    China durch Einfuhren bestimmter Säcke und Beutel aus Kunststoffen über ein
    chinesisches Unternehmen, für das ein niedrigerer Zollsatz gilt, und zur zollamtlichen
    Erfassung der letztgenannten Einfuhren
  type: main
