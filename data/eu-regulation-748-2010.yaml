title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 748/2010 of 19 August 2010 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 1425/2006 on imports of certain plastic sacks and
    bags originating in the People’s Republic of China by imports of certain plastic
    sacks and bags channelled via a Chinese company subject to a lower duty rate,
    and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 748/2010 de la Commission du 19 août 2010 portant
    ouverture d’une enquête sur le contournement éventuel des mesures antidumping
    instituées par le règlement (CE) n ° 1425/2006 du Conseil sur les importations
    de certains sacs et sachets en matières plastiques originaires de la République
    populaire de Chine par des importations de certains sacs et sachets en matières
    plastiques effectuées via une société chinoise bénéficiant d’un taux de
    droit inférieur et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 748/2010 der Kommission vom 19. August 2010 zur Einleitung
