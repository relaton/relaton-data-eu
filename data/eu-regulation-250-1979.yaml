title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 250/79 of 9 February 1979 re-establishing
    the levying of customs duties on gloves, mittens, mitts, stockings, socks and
    sockettes, not being knitted or crocheted goods, falling within heading No 61.10,
    originating in Hong Kong to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 250/79 de la Commission, du 9 février 1979, portant
    rétablissement de la perception des droits de douane applicables à la ganterie,
    bas, chaussettes et socquettes, autres qu' en bonneterie, de la position tarifaire
    61.10, originaires de Hong-kong bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 250/79 der Kommission vom 9. Februar 1979 über die
    Wiedereinführung des Zollsatzes für Handschuhe, Strümpfe, Socken und Söckchen,
    nicht gewirkt, der Tarifnummer 61.10, mit Ursprung in Hongkong, dem die in der
    Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 250/79 af 9. februar 1979 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter, luffer, strømper og sokker,
    ikke af trikotage, henhørende under pos. 61.10, som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 250/79 della Commissione, del 9 febbraio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, calze e calzini,
    esclusi quelli a maglia, della voce doganale 61.10, originari di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 250/79 van de Commissie van 9 februari 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke, kousen en sokken, andere dan van brei- of haakwerk, van
    post 61.10, van oorsprong uit Hong-Kong waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3157/78 van de Raad
  type: main
