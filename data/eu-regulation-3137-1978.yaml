title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3137/78 of 29 December 1978 amending Regulation
    (EEC) No 3008/78 introducing a countervailing charge on mandarins (including tangerines
    and satsumas), clementines, wilkings and other similar citrus hybrids originating
    in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3137/78 de la Commission, du 29 décembre 1978, modifiant
    le règlement (CEE) n 3008/78 instituant une taxe compensatoire à l'importation
    de mandarines, y compris tangerines et satsumas, clémentines, wilkings et autres
    hybrides similaires d'agrumes originaires d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3137/78 der Kommission vom 29. Dezember 1978 zur Änderung
    der Verordnung (EWG) Nr. 3008/78 zur Einführung einer Ausgleichsabgabe auf die
    Einfuhr von Mandarinen, einschließlich Tangerinen und Satsumas, Clementinen,
    Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten, mit Ursprung in
    Algerien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3137/78 af 29. december 1978 om ændring
    af forordning (EØF) nr. 3008/78 om opkrævning af en udligningsafgift ved indførsel
    af mandariner (herunder tangeriner og statsumas), clementiner, wilkings og andre
    lignende krydsninger af citrusfrugter med oprindelse i Algeriet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3137/78 della Commissione, del 29 dicembre 1978, recante
    modifica del regolamento (CEE) n. 3008/78 che istituisce una tassa di compensazione
    all'importazione di mandarini, compresi i tangerini e i mandarini satsuma (o sazuma),
    le clementine, i wilkings e altri ibridi simili di agrumi originari dell'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3137/78 van de Commissie van 29 december 1978 tot
    wijziging van Verordening (EEG) nr. 3008/78 houdende instelling van een compenserende
    heffing bij invoer van mandarijnen, tangerines en satsuma's daaronder begrepen,
    clementines, wilkings en andere dergelijke kruisingen van citrusvruchten van oorsprong
    uit Algerije
