  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 79/2003 της Επιτροπής,
    της 17ης Ιανουαρίου 2003, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1422/95 για τον καθορισμό
    των λεπτομερειών εφαρμογής για την εισαγωγή
    μελάσας στον τομέα της ζάχαρης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 79/2003, 17. jaanuar 2003, millega muudetakse
    määrust (EÜ) nr 1422/95, milles sätestatakse melassi impordi üksikasjalikud
    rakenduseeskirjad suhkrusektoris
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 79/2003, annettu 17 päivänä tammikuuta 2003,
    melassin tuontia sokerialalla koskevista yksityiskohtaisista soveltamissäännöistä
    annetun asetuksen (EY) N:o 1422/95 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 79/2003/EK rendelete (2003. január 17.) a cukorágazatban
    a melasz behozatalára vonatkozó részletes végrehajtási szabályok megállapításáról
    szóló 1422/95/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 79/2003 della Commissione, del 17 gennaio 2003, recante
    modifica del regolamento (CE) n. 1422/95 che stabilisce le modalità d'applicazione
    per l'importazione di melassi nel settore dello zucchero
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 79/2003 (2003. gada 17. janvāris), ar kuru groza
    Regulu (EK) Nr. 1422/95, ar ko paredz sīki izstrādātus īstenošanas noteikumus
    melases importam cukura nozarē
  type: main
- language: lt
  script: Latn
  content: 2003 m. sausio 17 d. Komisijos reglamentas (EB) Nr. 79/2003, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 1422/95, nustatantį išsamiais cukraus sektoriaus
    produkto, melasos, importo įgyvendinimo taisykles
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 79/2003 tas-17 ta’ Jannar 2003
    li jemenda r-Regolament (KE) Nru 1422/95 li jistipula regoli dettaljati għall-implementazzjoni
    ta’ l-importazzjoni tal-ġulepp magħqud fis-settur tas-zokkor
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 79/2003 van de Commissie van 17 januari 2003 houdende
    wĳziging van Verordening (EG) nr. 1422/95 tot vaststelling, voor de sector suiker,
    van de uitvoeringsbepalingen voor de invoer van melasse
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 79/2003 z dnia 17 stycznia 2003 r. zmieniające
    rozporządzenie (WE) nr 1422/95 ustanawiające szczegółowe przepisy wykonawcze
    dotyczące przywozu melasy w sektorze cukru
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 79/2003 da Comissão, de 17 de Janeiro de 2003, que
    altera o Regulamento (CE) n.° 1422/95 que estabelece as regras de aplicação
    relativas à importação de melaços no sector do açúcar
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 79/2003 zo 17. januára 2003, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1422/95, ktorým sa stanovujú podrobné vykonávacie
    pravidlá na dovoz melasy v sektore cukru
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 79/2003 z dne 17. januarja 2003 o spremembi Uredbe
    (ES) št. 1422/95 o podrobnih izvedbenih pravilih za uvoz melase v sektorju sladkorja
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 79/2003 de la Comisión, de 17 de enero de 2003, que
