  script: Latn
  content: Commission Regulation (EC) No 79/2003 of 17 January 2003 amending Regulation
    (EC) No 1422/95 laying down detailed implementing rules for the import of molasses
    in the sugar sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 79/2003 de la Commission du 17 janvier 2003 modifiant
    le règlement (CE) n° 1422/95 établissant les modalités d'application pour
    l'importation de mélasses dans le secteur du sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 79/2003 der Kommission vom 17. Januar 2003 zur Änderung
    der Verordnung (EG) Nr. 1422/95 mit Durchführungsbestimmungen für die Einfuhr
    von Melasse im Zuckersektor
  type: main
- language: cs
  script: Latn
  content: Nařízení komise (ES) č. 79/2003 ze dne 17. ledna 2003, kterým se mění
    nařízení (ES) č. 1422/95, kterým se stanoví prováděcí pravidla pro dovoz
    melasy v odvětví cukru
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 79/2003 af 17. januar 2003 om ændring
