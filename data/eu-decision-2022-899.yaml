    от 8 юни 2022 година относно еквивалентността
    на регулаторната рамка за централните контрагенти
    в Индонезия с изискванията в Регламент (ЕС)
    № 648/2012 на Европейския парламент и на Съвета
    по отношение на централните контрагенти под
    надзора на Органа по финансовите услуги на
    Индонезия (Otoritas Jasa Keuangan)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/899 ze dne 8. června 2022 o
    rovnocennosti regulačního rámce pro ústřední protistrany v Indonésii s
    požadavky nařízení Evropského parlamentu a Rady (EU) č. 648/2012, pokud
    jde o ústřední protistrany, nad nimiž vykonává dohled indonéský úřad
    pro finanční služby (Otoritas Jasa Keuangan)
  type: main
- language: da
  script: Latn
