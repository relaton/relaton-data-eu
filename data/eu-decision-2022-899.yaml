    vidt angår de centrale modparter, der er under tilsyn af Indonesiens myndighed
    for finansielle tjenesteydelser (Otoritas Jasa Keuangan)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/899 της Επιτροπής
