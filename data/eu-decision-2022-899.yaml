    s Uredbom (EU) br. 648/2012 Europskog parlamenta i Vijeća u pogledu središnjih
    drugih ugovornih strana pod nadzorom indonezijskog tijela za financijske usluge
    (Otoritas Jasa Keuangan)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/899 végrehajtási határozata (2022. június 8.)
    az indonéz pénzügyi felügyeleti hatóság (Otoritas Jasa Keuangan) felügyelete
    alá tartozó központi szerződő felekre vonatkozó indonéz szabályozási
    keret 648/2012/EU európai parlamenti és tanácsi rendelet követelményeivel
    való egyenértékűségéről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/899 della Commissione dell'8 giugno 2022
    che stabilisce l’equivalenza del quadro normativo dell’Indonesia in materia
    di controparti centrali ai requisiti del regolamento (UE) n. 648/2012 del Parlamento
    europeo e del Consiglio per quanto riguarda le controparti centrali soggette alla
    vigilanza dell’Indonesia Financial Services Authority (Otoritas Jasa Keuangan)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/899 (2022. gada 8. jūnijs) par
    Indonēzijas normatīvā regulējuma, ko piemēro centrālajiem darījumu partneriem,
    līdzvērtību Eiropas Parlamenta un Padomes Regulas (ES) Nr. 648/2012 prasībām
    attiecībā uz Indonēzijas Finanšu pakalpojumu iestādes (Otoritas Jasa Keuangan)
    uzraudzībā esošajiem centrālajiem darījumu partneriem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/899 2022 m. birželio 8 d.
    dėl pagrindinėms sandorio šalims Indonezijoje taikomos reguliavimo sistemos
    lygiavertiškumo Europos Parlamento ir Tarybos reglamento (ES) Nr. 648/2012 reikalavimams,
    kiek tai susiję su pagrindinėmis sandorio šalimis, kurias prižiūri Indonezijos
    finansinių paslaugų institucija (Otoritas Jasa Keuangan)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/899 tat-8
