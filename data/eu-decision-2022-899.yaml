    ċentrali fl-Indoneżja mar-rekwiżiti tar-Regolament (UE) Nru 648/2012 tal-Parlament
    Ewropew u tal-Kunsill fir-rigward tal-kontropartijiet ċentrali taħt is-superviżjoni
    tal-Awtorità tas-Servizzi Finanzjarji tal-Indoneżja (Otoritas Jasa Keuangan)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/899 van de Commissie van 8 juni 2022 betreffende
