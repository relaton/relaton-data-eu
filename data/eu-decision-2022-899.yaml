id: EUDecision2022899
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/899 of 8 June 2022 on the equivalence
    of the regulatory framework for central counterparties in Indonesia to the requirements
    of Regulation (EU) No 648/2012 of the European Parliament and of the Council as
    regards central counterparties under the supervision of the Indonesia Financial
    Services Authority (Otoritas Jasa Keuangan)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/899 de la Commission du 8 juin 2022
    relative à l’équivalence entre le cadre réglementaire applicable aux contreparties
    centrales en Indonésie et les exigences du règlement (UE) no 648/2012 du Parlement
    européen et du Conseil en ce qui concerne les contreparties centrales placées
    sous la surveillance de l’autorité indonésienne des services financiers (Otoritas
    Jasa Keuangan)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/899 der Kommission vom 8. Juni 2022 über
    die Gleichwertigkeit des Regulierungsrahmens für zentrale Gegenparteien in Indonesien
    mit den Anforderungen der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments
    und des Rates in Bezug auf von der indonesischen Finanzdienstleistungsbehörde
    (Otoritas Jasa Keuangan) beaufsichtigte zentrale Gegenparteien
  type: main
- language: bg
  script: Cyrl
