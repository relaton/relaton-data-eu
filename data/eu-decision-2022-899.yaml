    Indonesische autoriteit voor financiële diensten (Otoritas Jasa Keuangan)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/899 z dnia 8 czerwca 2022 r. w sprawie
