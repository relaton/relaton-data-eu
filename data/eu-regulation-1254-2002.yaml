title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1254/2002 of 11 July 2002 determining the
    extent to which applications for import rights lodged in respect of subquota I
    for frozen meat of bovine animals, provided for in Regulation (EC) No 954/2002,
    can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1254/2002 de la Commission du 11 juillet 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées pour le sous-contingent I de viandes bovines congelées, prévu par
    le règlement (CE) n° 954/2002
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1254/2002 der Kommission vom 11. Juli 2002 zur Bestimmung
    des Umfangs, in welchem den Anträgen auf Einfuhrrechte für das gemäß der Verordnung
    (EG) Nr. 954/2002 vorgesehene Unterkontingent I für gefrorenes Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1254/2002 af 11. juli 2002 om fastsættelse
    af, i hvilket omfang ansøgningerne om importrettigheder for frosset oksekød
    under delkontingent I som fastsat i forordning (EF) nr. 954/2002 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1254/2002 της Επιτροπής,
    της 11ης Ιουλίου 2002, για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για δικαιώματα εισαγωγής που έχουν υποβληθεί
    για την υποποσόστωση Ι, βάσει του κανονισμού
    (ΕΚ) αριθ. 954/2002, στον τομέα του βοείου κρέατος
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1254/2002, annettu 11 päivänä heinäkuuta
    2002, asetuksessa (EY) N:o 954/2002 säädetyn jäädytettyä naudanlihaa koskevan
    osakiintiön I mukaisesti jätettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1254/2002 della Commissione, dell'11 luglio 2002, che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate per il sotto-contingente I di carni bovine congelate previsto dal regolamento
    (CE) n. 954/2002
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1254/2002 van de Commissie van 11 juli 2002 tot vaststelling
