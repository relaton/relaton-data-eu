    voor het in Verordening (EG) nr. 954/2002 bedoelde deelcontingent I voor bevroren
    rundvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1254/2002 da Comissão, de 11 de Julho de 2002, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
