title:
- language: en
  script: Latn
  content: '89/508/EEC: Commission Decision of 10 August 1989 authorizing Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '89/508/CEE: Décision de la Commission du 10 août 1989 autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 10. August 1989 zur Ermächtigung der
    Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht (89/508/EWG)
    (89/508/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 10. august 1989 om bemyndigelse af medlemsstaterne
    til midlertidigt at tillade handel med forstligt formeringsmateriale, der ikke
    opfylder kravene i Rådets direktiv 66/404/EØF (89/508/EØF) (89/508/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/508/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Αυγούστου 1989 που δίνει την άδεια στα κράτη
    μέλη να επιτρέπουν προσωρινά την εμπορία δασικού
    πολλαπλασιαστικού υλικού το οποίο δεν ανταποκρίνεται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 10 agosto 1989 che autorizza gli Stati
    membri ad ammettere temporaneamente la commercializzazione di materiali forestali
    di moltiplicazione non rispondenti ai requisiti prescritti dalla direttiva 66/404/CEE
    del Consiglio (89/508/CEE) (89/508/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 10 augustus 1989 houdende machtiging
    van de Lid-Staten om bosbouwkundig teeltmateriaal dat niet aan de eisen van Richtlijn
    66/404/EEG van de Raad voldoet, tijdelijk tot de handel toe te laten (89/508/EEG)
    (89/508/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 10 de Agosto de 1989 que autoriza os Estados-membros
