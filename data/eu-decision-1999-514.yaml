title:
- language: en
  script: Latn
  content: '1999/514/EC: Commission Decision of 23 July 1999 setting the date on which
    dispatch from the United Kingdom of bovine products under the date-based export
    scheme may commence by virtue of Article 6(5) of Council Decision 98/256/EC (notified
    under document number C(1999) 2500)'
  type: main
- language: fr
  script: Latn
  content: '1999/514/CE: Décision de la Commission, du 23 juillet 1999, fixant la
    date à laquelle l''expédition à partir du Royaume-Uni de produits bovins dans
    le cadre du régime d''exportation sur la base de la date peut commencer au titre
    de l''article 6, paragraphe 5, de la décision 98/256/CE du Conseil [notifiée
    sous le numéro C(1999) 2500]'
  type: main
- language: de
  script: Latn
  content: '1999/514/EG: Entscheidung der Kommission vom 23. Juli 1999 zur Festsetzung
    des Datums, an dem die Versendung von Rindfleischerzeugnissen aus dem Vereinigten
    Königreich im Rahmen der datumsgestützten Ausfuhrregelung (Data-Based Export
    Scheme) gemäß Artikel 6 Absatz 5 der Entscheidung 98/256/EG des Rates aufgenommen
    werden darf (Bekanntgegeben unter Aktenzeichen K(1999) 2500)'
  type: main
- language: da
  script: Latn
  content: '1999/514/EF: Kommissionens beslutning af 23. juli 1999 om fastsættelse
    af den dato, på hvilken forsendelse af kvægprodukter fra Det Forenede Kongerige
    under den datobaserede eksportordning kan indledes i henhold til artikel 6, stk.
    5, i Rådets beslutning 98/256/EF (meddelt under nummer K(1999) 2500)'
  type: main
- language: el
  script: Grek
  content: '1999/514/ΕΚ: Απόφαση της Επιτροπής, της 23ης
    Ιουλίου 1999, για τον καθορισμό της ημερομηνίας
    κατά την οποία μπορεί να αρχίσει η αποστολή
    από το Ηνωμένο Βασίλειο προϊόντων που προέρχονται
    από βοοειδή σύμφωνα με το βασιζόμενο στην ημερομηνία
    καθεστώς εξαγωγής δυνάμει του άρθρου 6 παράγραφος
    5 της απόφασης 98/256/ΕΚ του Συμβουλίου [κοινοποιηθείσα
    υπό τον αριθμό Ε(1999) 2500]'
  type: main
- language: fi
  script: Latn
  content: '1999/514/EY: Komission päätös, tehty 23 päivänä heinäkuuta 1999,
    sen päivämäärän vahvistamisesta, jona nautatuotteiden tuonti Yhdistyneestä
    kuningaskunnasta saa alkaa päivämäärään perustuvassa vientijärjestelmässä
    neuvoston päätöksen 98/256/EY 6 artiklan 5 kohdan nojalla (tiedoksiannettu
    numerolla K(1999) 2500)'
  type: main
- language: it
  script: Latn
  content: '1999/514/CE: Decisione della Commissione, del 23 luglio 1999, che fissa
    la data in cui possono iniziare le spedizioni di prodotti bovini dal Regno Unito
    nel quadro del Programma di esportazione su base cronologica in virtù dell''articolo
    6, paragrafo 5, della decisione 98/256/CE del Consiglio [notificata con il numero
    C(1999) 2500]'
  type: main
- language: nl
  script: Latn
  content: '1999/514/EG: Beschikking van de Commissie van 23 juli 1999 houdende vaststelling
    van de datum waarop mag worden begonnen met de verzending, in het kader van de
    "Date-Based Export Scheme", van van runderen verkregen producten uit het Verenigd
    Koninkrijk, op grond van artikel 6, lid 5, van Beschikking 98/256/EG van de Raad
    (kennisgeving geschied onder nummer C(1999) 2500)'
  type: main
- language: pt
  script: Latn
  content: '1999/514/CE: Decisão da Comissão, de 23 de Julho de 1999, que fixa a
    data em que pode começar a expedição, a partir do Reino Unido, de produtos
    bovinos ao abrigo do regime de exportação baseado na data, nos termos do n°
    5 do artigo 6° da Decisão 98/256/CE do Conselho [notificada com o número C(1999)
    2500]'
  type: main
- language: es
  script: Latn
  content: '1999/514/CE: Decisión de la Comisión, de 23 de julio de 1999, por la
    que se fija la fecha en la que, de conformidad con el apartado 5 del artículo
    6 de la Decisión 98/256/CE, puede iniciarse la expedición desde el Reino Unido
    de productos bovinos con arreglo al régimen de exportación basado en una fecha
    [notificada con el número C(1999) 2500]'
  type: main
- language: sv
  script: Latn
  content: '1999/514/EG: Kommissionens beslut av den 23 juli 1999 om fastställande
    av det datum då sändningarna från Förenade kungariket av nötköttsprodukter
    som omfattas av det datumbaserade exportsystemet får påbörjas genom tillämpning
    av artikel 6.5 i rådets beslut 98/256/EG [delgivet med nr K(1999) 2500]'
