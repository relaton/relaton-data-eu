id: EUDirective1987354
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 87/354/EEC of 25 June 1987 amending certain directives
    on the approximation of the laws of the Member States relating to industrial products
    with respect to the distinctive numbers and letters indicating the Member States
  type: main
- language: fr
  script: Latn
  content: Directive 87/354/CEE du Conseil du 25 juin 1987 modifiant certaines directives
    concernant le rapprochement des législations des États membres relatives aux
    produits industriels en ce qui concerne les sigles distinctifs attribués aux
    États membres
  type: main
- language: de
  script: Latn
  content: Richtlinie 87/354/EWG des Rates vom 25. Juni 1987 zur Änderung bestimmter
    Richtlinien zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über Industrieerzeugnisse
    hinsichtlich der Abkürzungszeichen für die Mitgliedstaaten
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 25 юни 1987 година за
    изменение на някои директиви за сближаване
    на законодателствата на държавите-членки относно
    промишлените продукти по отношение на отличителните
    цифри и букви, обозначаващи държавите-членки
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 25. června 1987, kterou se mění určité směrnice
    o sbližování právních předpisů členských států vztahujících se na
    průmyslové výrobky, pokud se týká rozlišovacích čísel a písmen označujících
    členské státy
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 87/354/EØF af 25. juni 1987 om ændring af visse direktiver
    om tilnærmelse af medlemsstaternes lovgivning om industriprodukter for så vidt
    angår medlemsstaternes kendingsbogstaver
  type: main
- language: el
  script: Grek
  content: Οδηγία 87/354/ΕΟΚ του Συμβουλίου της 25ης Ιουνίου
    1987 για την τροποποίηση ορισμένων οδηγιών για
    την προσέγγιση των νομοθεσιών των κρατών μελών
    σχετικά με τα βιομηχανικά προϊόντα, όσον αφορά
    τα διακριτικά αρχικά που υποδηλώνουν τα κράτη
    μέλη
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 25. juuni 1987, millega muudetakse teatavaid direktiive
    tööstustooteid käsitlevate liikmesriikide õigusaktide ühtlustamise kohta
    seoses liikmesriike tähistavate eraldusnumbrite ja -tähtedega
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1987. június 25.) az ipari termékekre vonatkozó
    tagállami jogszabályok közelítéséről szóló egyes irányelveknek a tagállamokat
    jelző megkülönböztető számok és betűk vonatkozásában történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 87/354/CEE del Consiglio del 25 giugno 1987 che modifica alcune
    direttive concernenti il ravvicinamento delle legislazioni degli Stati Membri
    relative ai prodotti industriali per quanto riguarda le sigle attribuite agli
    Stati Membri
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1987. gada 25. jūnijs), ar ko groza dažas direktīvas
    par dalībvalstu tiesību aktu tuvināšanu attiecībā uz rūpniecības ražojumiem
    saistībā ar dalībvalstu atšķirības zīmēm
  type: main
- language: lt
  script: Latn
  content: 1987 m. birželio 25 d. Tarybos direktyva, iš dalies keičianti tam tikras
    direktyvas dėl valstybių narių įstatymų, susijusių su pramonės produktais,
    derinimo valstybes nares nurodančių skiriamųjų numerių ir raidžių atžvilgiu
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tal-25 ta' Ġunju 1987 li temenda ċerti direttivi
    dwar l-approssimazzjoni tal-liġijiet ta' l-Istati Membri li għandhom x'jaqsmu
    ma' prodotti industrijali fir-rigward tan-numri u l-ittri distintivi li jindikaw
    l-Istati Membri
  type: main
- language: nl
  script: Latn
  content: Richtlijn 87/354/EEG van de Raad van 25 juni 1987 tot wijziging van bepaalde
    Richtlijnen van de Raad betreffende de onderlinge aanpassing van de wetgevingen
    der Lid-Staten voor industriële produkten voor wat de aan de Lid-Staten toegekende
    kenletters betreft
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 25 czerwca 1987 r. zmieniająca niektóre dyrektywy
    w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących się do
    wyrobów przemysłowych ze względu na wyróżniające liczby i litery identyfikujące
    Państwa Członkowskie
  type: main
- language: pt
  script: Latn
  content: Directiva 87/354/CEE do Conselho de 25 de Junho de 1987 que altera determinadas
    directivas relativas à aproximação das legislações dos Estados-Membros aos
    produtos industriais no que diz respeito às siglas distintivas atribuídas aos
    Estados-Membros
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 25 iunie 1987 de modificare a anumitor directive
    privind apropierea legislațiilor statelor membre referitoare la produsele industriale
    în ceea ce privește siglele distinctive atribuite statelor membre
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 25. júna 1987, ktorou sa menia a dopĺňajú určité
    smernice o aproximácii právnych predpisov členských štátov týkajúcich
    sa priemyselných výrobkov vzhľadom na rozlišovacie čísla a písmená označujúce
    členské štáty
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 25. junija 1987 o spremembah nekaterih direktiv o
    približevanju zakonodaje držav članic o industrijskih proizvodih glede na številčne
    in črkovne oznake držav članic
  type: main
- language: es
  script: Latn
  content: Directiva 87/354/CEE del Consejo de 25 de junio de 1987 por la que se modifican
    determinadas Directivas del Consejo relativas a la aproximación de las legislaciones
    de los Estados Miembros sobre los productos industriales en lo que se refiere
    a las siglas distintivas asignadas a los Estados miembros
  type: main
