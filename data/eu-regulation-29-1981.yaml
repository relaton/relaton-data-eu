    von Weinen aus Tafeltrauben für das Weinwirtschaftsjahr 1980/81 infolge des Beitritts
    Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 29/81 af 1. januar 1981 om ændring
