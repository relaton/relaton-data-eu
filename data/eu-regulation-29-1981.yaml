    governing the distillation of wines produced from table grapes, following the
    accession of Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 29/81 de la Commission, du 1er janvier 1981, modifiant
    le règlement (CEE) n° 2253/80 portant certaines modalités d' application en
    ce qui concerne la distillation des vins issus de raisins de table pour la campagne
    viticole 1980/1981 à la suite de l' adhésion de la Grèce
  type: main
