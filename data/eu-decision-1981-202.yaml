  content: '81/202/EEC: Commission Decision of 18 March 1981 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste) originating in South Korea (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/202/CEE: Décision de la Commission, du 18 mars 1981, autorisant le
