    Spinnfasern von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/202/EØF: Kommissionens beslutning af 18. marts 1981 om bemyndigelse
