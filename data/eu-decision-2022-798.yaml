    fremstillet af genetisk modificeret MON 87769 × MON 89788-sojabønne, i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under
    nummer C(2022) 3182) (Kun den nederlandske udgave er autentisk)
