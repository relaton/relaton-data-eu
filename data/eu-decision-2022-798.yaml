title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/798 of 19 May 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 87769 × MON 89788 pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2022) 3182) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/798 de la Commission du 19 mai 2022
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié MON 87769 × MON 89788, consistant en ce soja ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2022) 3182] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/798 der Kommission vom 19. Mai 2022 über
    die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Sojabohnen der Sorte MON 87769 × MON 89788 enthalten, aus ihnen bestehen oder
    aus ihnen hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2022) 3182) (Nur
    der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
