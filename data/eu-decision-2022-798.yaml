    on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/798 ón gCoimisiún an 19 Bealtaine
    2022 lena n-údaraítear táirgí ina bhfuil pónaire soighe géinmhodhnaithe
    MON 87769 × MON 89788, atá comhdhéanta de nó a tháirgtear as, a chur ar an
    margadh de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa agus
    ón gComhairle (a bhfuil fógra tugtha ina leith faoi dhoiciméad C(2022) 3182)
    (Is ag an téacs san Ollainnis a bheidh an t-údarás agus aige sin amháin)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/798 оd 19. svibnja 2022. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificiranu soju
    MON 87769 × MON 89788 ili se sastoje ili su proizvedeni od nje, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2022) 3182) (Vjerodostojan je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/798 végrehajtási határozata (2022. május 19.)
    a géntechnológiával módosított MON 87769 × MON 89788 szójababot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2022) 3182. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/798 della Commissione del 19 maggio 2022
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati da soia geneticamente modificata MON 87769 × MON 89788 a norma del regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2022) 3182] (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/798 (2022. gada 19. maijs), ar
    ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto soju MON 87769 × MON
    89788, sastāv vai ir ražoti no tās (izziņots ar dokumentu Nr. C(2022) 3182)
    (Autentisks ir tikai teksts nīderlandiešu valodā)
  type: main
