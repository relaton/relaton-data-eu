  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/798 ze dne 19. května 2022 o
    povolení uvedení produktů, které obsahují geneticky modifikovanou sóju MON
    87769 × MON 89788, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2022)
    3182) (Pouze nizozemské znění je závazné)
  type: main
