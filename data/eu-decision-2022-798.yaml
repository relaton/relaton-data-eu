    jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/798 da Comissão de 19 de maio de 2022
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de soja geneticamente modificada MON 87769 ×
    MON 89788 nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e
    do Conselho [notificada com o número C(2022) 3182] (Apenas faz fé o texto na
    língua neerlandesa)
  type: main
