title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 février 1972, autorisant la République
    italienne à exclure du traitement communautaire les jus de fruits de la position
    20.07 du Tarif douanier commun des pays tiers et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '72/136/EWG: Entscheidung der Kommission vom 18. Februar 1972, mit der
    die Italienische Republik ermächtigt wird, aus Drittländern stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Fruchtsäfte der Tarifnummer
    20.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/136/CEE: Decisione della Commissione, del 18 febbraio 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i succhi di frutta
    della voce n. 20.07 della tariffa doganale comune, originari dei paesi terzi e
    messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/136/EEG: Beschikking van de Commissie van 18 februari 1972 waarbij
    de Italiaanse Republiek wordt gemachtigd vruchtensappen van post 20.07 van het
    gemeenschappelijk douanetarief, van oorsprong uit derde landen en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
