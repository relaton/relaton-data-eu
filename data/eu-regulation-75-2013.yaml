  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 75/2013, annettu 25 päivänä
    tammikuuta 2013 , asetuksesta (EY) N:o 951/2006 poikkeamisesta edustavien hintojen
    ja lisätuontitullien tiettyihin sokerialan tuotteisiin soveltamisen osalta ja
    sokerialan tiettyjen tuotteiden edustavien hintojen ja lisätuontitullien vahvistamisesta
    markkinointivuodeksi 2012/2013 annetun täytäntöönpanoasetuksen (EU) N:o 892/2012
    kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 75/2013 od 25. siječnja 2013. o odstupanju
    od Uredbe (EZ) br. 951/2006 u pogledu primjene reprezentativnih cijena i dodatnih
    uvoznih carina za određene proizvode u sektoru šećera i o stavljanju izvan
    snage Provedbene uredbe (EU) br. 892/2012 o utvrđivanju reprezentativnih cijena
    i dodatnih uvoznih carina za određene proizvode u sektoru šećera za tržišnu
    godinu 2012./2013.
  type: main
- language: hu
  script: Latn
  content: A Bizottság 75/2013/EU végrehajtási rendelete ( 2013. január 25. )
    a 951/2006/EK rendelettől a cukorágazat egyes termékeire vonatkozó reprezentatív
    árak és kiegészítő behozatali vámok alkalmazása tekintetében való eltérésről
    és a cukorágazat egyes termékeire a 2012/2013. gazdasági évben alkalmazandó
    irányadó árak és kiegészítő importvámok megállapításáról szóló
    892/2012/EU végrehajtási rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 75/2013 della Commissione, del 25 gennaio
    2013 , recante deroga al regolamento (CE) n. 951/2006 per quanto concerne l’applicazione
    dei prezzi rappresentativi e dei dazi addizionali all’importazione per alcuni
    prodotti del settore dello zucchero e che abroga il regolamento di esecuzione
    (UE) n. 892/2012 che fissa i prezzi rappresentativi e gli importi dei dazi addizionali
    all’importazione per alcuni prodotti del settore dello zucchero per la campagna
    2012/2013
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 75/2013 ( 2013. gada 25. janvāris
    ), ar kuru pieļauj atkāpi no Regulas (EK) Nr. 951/2006 attiecībā uz reprezentatīvās
    cenas un papildu ievedmuitas nodokļu piemērošanu dažiem cukura nozares produktiem
    un ar kuru atceļ Īstenošanas regulu (ES) Nr. 892/2012, ar ko nosaka reprezentatīvās
    cenas un papildu ievedmuitas nodokļus dažiem cukura nozares produktiem 2012./2013.
    tirdzniecības gadā
  type: main
- language: lt
  script: Latn
  content: 2013 m. sausio 25 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 75/2013,
    kuriuo dėl kai kurių cukraus sektoriaus produktų tipinių kainų ir papildomo
    importo muito taikymo nukrypstama nuo Reglamento (EB) Nr. 951/2006 ir kuriuo panaikinamas
    Įgyvendinimo reglamentas (ES) Nr. 892/2012, kuriuo nustatomos tipinės kai kurių
    cukraus sektoriaus produktų kainos ir papildomi importo muitai 2012–2013 prekybos
    metais
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 75/2013 tal-
    25 ta’ Jannar 2013 li jidderoga mir-Regolament (KE) Nru 951/2006 fir-rigward
    tal-applikazzjoni ta’ prezzijiet rappreżentattivi u dazji addizzjonali tal-importazzjoni
    ta’ ċerti prodotti tas-settur taz-zokkor, u li jħassar ir-Regolament ta’
    Implimentazzjoni (UE) Nru 892/2012 li jistabbilixxi l-prezzijiet rappreżentattivi
    u l-ammonti tad-dazji addizzjonali għall-importazzjoni ta’ ċerti prodotti
    tas-settur taz-zokkor għas-sena tas-suq 2012/2013
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 75/2013 van de Commissie van 25 januari
    2013 tot afwijking van Verordening (EG) nr. 951/2006 met betrekking tot de toepassing
    van representatieve prijzen en aanvullende invoerrechten voor bepaalde producten
    uit de sector suiker en tot intrekking van Uitvoeringsverordening (EU) nr. 892/2012
    tot vaststelling van de representatieve prijzen en de aanvullende invoerrechten
    voor bepaalde producten uit de sector suiker voor het verkoopseizoen 2012/2013
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 75/2013 z dnia 25 stycznia 2013
    r. wprowadzające odstępstwo od rozporządzenia (WE) nr 951/2006 w odniesieniu
    do stosowania cen reprezentatywnych i dodatkowych należności celnych przywozowych
    w odniesieniu do niektórych produktów w sektorze cukru oraz uchylające rozporządzenie
    wykonawcze (UE) nr 892/2012 ustalające ceny reprezentatywne oraz kwoty dodatkowych
    należności celnych przywozowych w odniesieniu do niektórych produktów w sektorze
    cukru na rok gospodarczy 2012/2013
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 75/2013 da Comissão, de 25 de janeiro
    de 2013 , que derroga ao Regulamento (CE) n. ° 951/2006 no que diz respeito à
    aplicação de preços representativos e direitos de importação adicionais para
    determinados produtos do setor do açúcar e que revoga o Regulamento de Execução
    (UE) n. ° 892/2012 que fixa os preços representativos e os direitos de importação
    adicionais de determinados produtos do setor do açúcar para a campanha de 2012/2013
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 75/2013 al Comisiei din 25
    ianuarie 2013 de derogare de la Regulamentul (CE) nr. 951/2006 în ceea ce privește
    aplicarea prețurilor reprezentative și a taxelor suplimentare la importul anumitor
    produse din sectorul zahărului și de abrogare a Regulamentului de punere în
    aplicare (UE) nr. 892/2012 de stabilire a prețurilor reprezentative și a cuantumurilor
    taxelor suplimentare la importul anumitor produse din sectorul zahărului pentru
    anul de comercializare 2012/2013
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 75/2013 z 25. januára 2013 ,
    ktorým sa ustanovuje výnimka z nariadenia (ES) č. 951/2006, pokiaľ ide o uplatňovanie
    reprezentatívnych cien a výšku dodatočných dovozných ciel na niektoré výrobky
    v sektore cukru a ktorým sa zrušuje vykonávacie nariadenie (EÚ) č. 892/2012,
    ktorým sa stanovujú reprezentatívne ceny a výška dodatočných dovozných
    ciel na niektoré produkty v sektore cukru na hospodársky rok 2012/2013
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 75/2013 z dne 25. januarja 2013 o odstopanju
    od Uredbe (ES) št. 951/2006 v zvezi z uporabo reprezentativnih cen in dodatnih
    uvoznih dajatev za nekatere proizvode v sektorju sladkorja in o razveljavitvi
    Izvedbene uredbe (EU) št. 892/2012 o določitvi reprezentativnih cen in dodatnih
    uvoznih dajatev za nekatere proizvode v sektorju sladkorja za tržno leto 2012/2013
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 75/2013 de la Comisión, de 25 de enero
    de 2013 , que establece excepciones al Reglamento (CE) n ° 951/2006 en lo que
    respecta a la aplicación de los precios representativos y los derechos adicionales
    de importación de determinados productos del sector del azúcar y deroga el Reglamento
    de Ejecución (UE) n ° 892/2012 por el que se fijan los precios representativos
    y los importes de los derechos adicionales de importación de determinados productos
    del sector del azúcar en la campaña 2012/13
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 75/2013 av den 25 januari
    2013 om undantag från förordning (EG) nr 951/2006 vad gäller tillämpningen
    av representativa priser och tilläggsimporttullar för vissa sockerprodukter
    och om upphävande av genomförandeförordning (EU) nr 892/2012 om fastställande
    av de representativa priserna och tilläggstullarna för import av vissa sockerprodukter
    för regleringsåret 2012/13
