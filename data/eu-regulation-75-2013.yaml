title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 75/2013 of 25 January 2013 derogating
    from Regulation (EC) No 951/2006 as regards the application of representative
    prices and additional import duties for certain products in the sugar sector and
    repealing Implementing Regulation (EU) No 892/2012 fixing the representative prices
    and additional import duties for certain products in the sugar sector for the
    2012/2013 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 75/2013 de la Commission du 25 janvier
    2013 portant dérogation au règlement (CE) n ° 951/2006 en ce qui concerne l’application
    des prix représentatifs et des droits additionnels à l’importation pour certains
    produits du secteur du sucre, et abrogeant le règlement d’exécution (UE) n
    ° 892/2012 fixant les prix représentatifs et les montants des droits additionnels
    à l’importation pour certains produits du secteur du sucre pour la campagne
    2012/2013
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 75/2013 der Kommission vom 25. Januar
    2013 zur Abweichung von der Verordnung (EG) Nr. 951/2006 hinsichtlich der Anwendung
    repräsentativer Preise und zusätzlicher Einfuhrzölle auf bestimmte Erzeugnisse
    des Zuckersektors und zur Aufhebung der Durchführungsverordnung (EU) Nr. 892/2012
    zur Festsetzung der repräsentativen Preise und der zusätzlichen Einfuhrzölle
    für bestimmte Erzeugnisse des Zuckersektors im Wirtschaftsjahr 2012/13
  type: main
- language: bg
  script: Cyrl
