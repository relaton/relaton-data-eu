    от 25 януари 2013 година за дерогация от Регламент
    (ЕО) № 951/2006 във връзка с прилагането на представителните
    цени и допълнителните вносни мита за някои
    продукти от сектора на захарта и за отмяна
    на Регламент за изпълнение (ЕС) № 892/2012 за определяне
    на представителните цени и размерите на допълнителните
    вносни мита за някои продукти от сектора на
    захарта за 2012/2013 пазарна година
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 75/2013 ze dne 25. ledna 2013
    , kterým se stanoví odchylka od nařízení (ES) č. 951/2006, pokud jde o uplatňování
    reprezentativních cen a dodatečných dovozních cel pro některé produkty v
    odvětví cukru, a zrušuje prováděcí nařízení (EU) č. 892/2012, kterým
    se stanoví reprezentativní ceny a dodatečná dovozní cla pro některé produkty
    v odvětví cukru na hospodářský rok 2012/2013
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 75/2013 af 25. januar
    2013 om fravigelse af forordning (EF) nr. 951/2006 hvad angår anvendelse af repræsentative
    priser og tillægsimporttold for visse produkter inden for sukkersektoren og om
    ophævelse af gennemførelsesforordning (EU) nr. 892/2012 om fastsættelse af
    de repræsentative priser og tillægsimporttolden for visse produkter inden for
    sukkersektoren for produktionsåret 2012/13
  type: main
