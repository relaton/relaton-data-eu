title:
- language: fr
  script: Latn
  content: Décision 66/500/CEE de la Commission, du 16 août 1966, autorisant la
    République fédérale d'Allemagne à exclure du traitement communautaire les
    "carpes fraîches, réfrigérées et congelées", de la position Ex 03.01 A II
    B du Tarif douanier commun, originaires de Yougoslavie et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '66/500/EWG: Entscheidung der Kommission vom 16. August 1966, durch welche
    die Bundesrepublik Deutschland ermächtigt wird, aus Jugoslawien stammende und
    in den anderen Mitgliedstaaten in den freien Verkehr gebrachte Karpfen, frisch,
    gefroren oder gekühlt, der Tarifnummer ex 03.01 A II b des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/500/CEE: Decisione della Commissione, del 16 agosto 1966, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario le
    carpe fresche, refrigerate e congelate della voce ex 03.01 A II b della tariffa
    doganale comune, originarie dalla Iugoslavia e immesse in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/500/EEG: Beschikking van de Commissie van 16 augustus 1966 waarbij
    de Bondsrepubliek Duitsland wordt gemachtigd karpers, vers, gekoeld of bevroren,
    die van oorsprong zijn uit Joegoslavië en in de andere Lid- Staten in het vrije
    verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
