title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 1 juillet 1970, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer
    le relèvement des droits de leur tarif douanier vers ceux du Tarif douanier commun
    en ce qui concerne les tabacs fabriqués des sous-positions tarifaires 24.02 A,
    B, C, et D
  type: main
- language: de
  script: Latn
  content: '70/348/EWG: Entscheidung der Kommission vom 1. Juli 1970, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die Angleichung (Erhöhung) der Zollsätze ihrer Zolltarife
    an die des Gemeinsamen Zolltarifs für verarbeiteten Tabak der Tarifstellen 24.02
    A, B, C und D aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '70/348/CEE: Decisione della Commissione, del 1 luglio 1970, con la quale
    si autorizza il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei
    Paesi Bassi a differire l''aumento dei dazi previsti nella loro tariffa doganale
    verso quelli della tariffa doganale comune, per quanto concerne i tabacchi di
    cui alle sottovoci tariffarie 24.02 A, B, C e D'
  type: main
- language: nl
  script: Latn
  content: '70/348/EEG: Beschikking van de Commissie van 1 juli 1970 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd de aanpassing van de rechten van hun douanetarief aan die van het gemeenschappelijk
    douanetarief uit te stellen voor tabaksfabrikaten van de tariefpostonderverdeling
    24.02 A, B, C en D'
  type: main
