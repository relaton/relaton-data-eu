title:
- language: en
  script: Latn
  content: '79/777/EEC: Commission Decision of 28 August 1979 on the payment to Ireland
    by the Guidance Section of the EAGGF of an advance on expenditure provided for
    in 1979 under Directive 78/628/EEC on a programme to accelerate drainage operations
    in the less-favoured areas of the west of Ireland (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/777/CEE: Décision de la Commission, du 28 août 1979, relative au
    paiement à l''Irlande par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", d''une avance pour les dépenses prévues en 1979
    dans le cadre de la directive 78/628/CEE relative au programme d''accélération
    des opérations de drainage dans les régions défavorisées de l''ouest de l''Irlande
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/777/EWG: Entscheidung der Kommission vom 28. August 1979 über die
    Zahlung an Irland durch den EAGFL, Abteilung Ausrichtung, eines Vorschusses für
    die für 1979 veranschlagten Ausgaben im Rahmen der Richtlinie 78/628/EWG bezüglich
    des Programms zur Beschleunigung der Entwässerungsarbeiten in den benachteiligten
    Gebieten Westirlands (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/777/EØF: Kommissionens beslutning af 28. august 1979 om udbetaling
    til Irland af Den europæiske udviklings- og garantifond for Landbruget, udviklingssektionen,
    af et forskud til de i 1979 forventede omkostninger i forbindelse med direktiv
    78/628/EØF om programmet for fremskyndelse af afvandings- og dræningsarbejder
    i de ugunstigt stillede områder i det vestlige Irland (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/777/CEE: Decisione della Commissione, del 28 agosto 1979, concernente
    il pagamento all''Irlanda, da parte del FEAOG, sezione orientamento, di un anticipo
    per le spese previste nel 1979 in virtù della direttiva 78/628/CEE relativa al
    programma di accelerazione delle operazioni di drenaggio nelle regioni svantaggiate
    dell''Irlanda occidentale (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/777/EEG: Beschikking van de Commissie van 28 augustus 1979 betreffende
    de betaling aan Ierland door het EOGFL, afdeling Oriëntatie, van een voorschot
    voor de in 1979 verwachte uitgaven in het kader van Richtlijn 78/628/EEG inzake
    het programma voor versnelde uitvoering van de draineringswerkzaamheden in de
    probleemgebieden van West-Ierland (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
