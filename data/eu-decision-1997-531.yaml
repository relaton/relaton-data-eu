  content: '97/531/EC: Council Decision of 24 July 1997 on the conclusion of an Agreement
    in the form of an exchange of letters concerning the interim extension of the
    Protocol to the Agreement between the European Economic Community and the Government
    of the Republic of Senegal on fishing off the coast of Senegal for the period
    from 2 October 1996 to 1 November 1996'
  type: main
- language: fr
  script: Latn
