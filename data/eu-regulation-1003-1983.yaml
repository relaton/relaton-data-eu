title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1003/83 of 27 April 1983 determining the
    extent to which applications lodged in the month of April 1983 for the issue of
    import licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1003/83 de la Commission, du 27 avril 1983, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1983 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1003/83 der Kommission vom 27. April 1983 über den
    Umfang, in dem den im Monat April 1983 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1003/83 af 27. april 1983 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i april 1983, for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1003/83 της Επιτροπής
    της 27ης Απριλίου 1983 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    έχουν υποβληθεί τον μήνα Απρίλιο του 1983 για
    τα κατεψυγμένα βόεια κρέατα που προορίζονται
    για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1003/83 della Commissione, del 27 aprile 1983, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1983 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1003/83 van de Commissie van 27 april 1983 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand april
    1983 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
