title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 971/85 of 15 April 1985 re-establishing
    the levying of customs duties on certain woven suits, products of category 16
    (code 40.0160), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 971/85 de la Commission du 15 avril 1985 portant rétablissement
    de la perception des droits de douane applicables à certains costumes et complets
    tissés de la catégorie 16 (code 40.0160), originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 971/85 der Kommission vom 15. April 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Anzüge und Kombinationen der
    Warenkategorie Nr. 16 (Kennziffer 40.0160) mit Ursprung in Pakistan, dem die in
    der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 971/85 af 15. april 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte jakkesæt, vævede, til mænd og drenge,
    under varekategori nr. 16 (kode 40.0160), som har oprindelse i Pakistan og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 971/85 της Επιτροπής
    της 15ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    κοστούμια και σύνολα υφασμένα, προϊόντα της
    κατηγορίας 16 (κωδικός αριθμός 40.0160), καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 971/85 della Commissione del 15 aprile 1985 che pripristina
    la riscossione dei dazi doganali applicabili ad alcuni vestiti e completi, tessuti,
    della categoria di prodotti n. 16 (codice 40.0160), originari del Pakistan beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 971/85 van de Commissie van 15 april 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    kostuums, geweven, voor heren en jongens, van de categorie van produkten nr. 16
    (codenummer 40.0160), van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
