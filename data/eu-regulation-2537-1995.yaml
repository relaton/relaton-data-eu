title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2537/95 of 30 October 1995 amending the Regulations
    that fixed, prior to 1 February 1995, certain prices and amounts in the market
    in wine, of which the value in ecus was adapted as a consequence of abolishing
    the corrective factor for agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2537/95 de la Commission, du 30 octobre 1995, modifiant
    les règlements, dans le secteur viti-vinicole, qui ont fixé avant le 1er février
    1995 certains prix et montants dont les valeurs en écus ont été adaptées en
    raison de la suppression du facteur de correction des taux de conversion agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2537/95 der Kommission vom 30. Oktober 1995 zur Änderung
    der im Weinbausektor erlassenen Verordnungen, mit denen vor dem 1. Februar 1995
    bestimmte Preise und Beträge festgesetzt wurden, deren Ecu-Werte infolge der
    Abschaffung des Berichtigungsfaktors für die landwirtschaftlichen Umrechnungskurse
    angepaßt worden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2537/95 af 30. oktober 1995 om ændring
    af de forordninger i vinsektoren, der inden den 1. februar 1995 har fastsat visse
    priser og beløb, hvis værdier i ecu er blevet tilpasset som følge af afskaffelsen
    af justeringsfaktoren for landbrugsomregningskurserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2537/95 της Επιτροπής
    της 30ής Οκτωβρίου 1995 για τροποποίηση των κανονισμών,
    στον αμπελοοινικό τομέα, δυνάμει των οποίων
    ορίσθηκαν, πριν από την 1η Φεβρουαρίου 1995, ορισμένες
    τιμές και ποσά οι αξίες των οποίων σε Ecu αναπροσαρμόσθηκαν
    λόγω της κατάργησης του διορθωτικού συντελεστή
    των γεωργικών ισοτιμιών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2537/95, annettu 30 päivänä lokakuuta 1995,
    ennen 1 päivää helmikuuta 1995 sellaiset hinnat ja määrät vahvistavien asetusten,
    joiden ecuina ilmoitetut arvot on mukautettu maatalouden muuntokurssien korjauskertoimen
    poistamisen vuoksi, muuttamisesta viinialalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2537/95 della Commissione, del 30 ottobre 1995, che
    modifica i regolamenti del settore vitivinicolo che fissano anteriormente al 1ºfebbraio
    1995 alcuni prezzi ed importi i cui valori in ecu sono statti adattati a causa
    della soppressione del coefficiente correttore dei tassi di conversione agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2537/95 van de Commissie van 30 oktober 1995 tot wijziging
    van de verordeningen in de wijnbouwsector waarbij vóór 1 februari 1995 bepaalde
    prijzen en bedragen zijn vastgesteld waarvan de waarde in ecu is aangepast als
    gevolg van de afschaffing van de correctiefactor voor de landbouwomrekeningskoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2537/95 da Comissão, de 30 de Outubro de 1995, que
    altera os regulamentos, no sector vitivinícola, que fixaram, antes de 1 de Fevereiro
    de 1995, determinados preços e montantes cujos valores em ecus foram adaptados
    devido à supressão do factor de correcção das taxas de conversão agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2537/95 de la Comisión, de 30 de octubre de 1995,
    por el que se modifican los Reglamentos del sector vitivinícola que fijaron,
    antes del 1 de febrero de 1995, determinados precios e importes cuyos valores
    en ecus han sido adaptados debido a la supresión del factor de corrección de
    los tipos de conversión agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2537/95 av den 30 oktober 1995 om ändring
    av förordningar inom vinsektorn som före den 1 februari 1995 har fastställt
    vissa priser och belopp vars värde i ecu har anpassats med hänsyn till avskaffandet
    av korrigeringsfaktorn för jordbruksomräkningskurserna
  type: main
