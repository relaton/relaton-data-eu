  script: Latn
  content: A Bizottság 246/2006/EK rendelete ( 2006. február 10. ) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a tálibokkal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet 63. alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 246/2006 della Commissione, del 10 febbraio 2006 ,
