  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/303 felhatalmazáson alapuló rendelete (2024. október
    31.) az (EU) 2023/1114 európai parlamenti és tanácsi rendeletnek a bizonyos
    pénzügyi szervezetek által a kriptoeszköz-szolgáltatások nyújtására irányuló
    szándékuk bejelentésekor rendelkezésre bocsátandó információkat meghatározó
    szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/303 della Commissione, del 31 ottobre 2024,
    che integra il regolamento (UE) 2023/1114 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le informazioni
    che devono essere incluse da talune entità finanziarie nella notifica dell’intenzione
    di prestare servizi per le cripto-attività
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/303 (2024. gada 31. oktobris), ar
