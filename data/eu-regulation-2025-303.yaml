    în ceea ce privește standardele tehnice de reglementare care precizează informațiile
    care trebuie incluse de anumite entități financiare în notificarea cu privire
    la intenția lor de a furniza servicii de criptoactive
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/303 z 31. októbra 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2023/1114, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa spresňujú informácie,
    ktoré majú určité finančné subjekty zahrnúť do oznámenia v súvislosti
    so svojím zámerom poskytovať služby kryptoaktív
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/303 z dne 31. oktobra 2024 o dopolnitvi
    Uredbe (EU) 2023/1114 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o določitvi informacij, ki jih je treba vključiti v uradno obvestilo
    o nameri glede opravljanja storitev v zvezi s kriptosredstvi s strani nekaterih
    finančnih subjektov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/303 de la Comisión, de 31 de octubre de
