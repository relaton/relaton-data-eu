- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/303 of 31 October 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the information to be included by
    certain financial entities in the notification of their intention to provide crypto-asset
    services
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/303 de la Commission du 31 octobre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les informations que certaines
    entités financières doivent inclure dans la notification de leur intention de
    fournir des services sur crypto-actifs
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/303 der Kommission vom 31. Oktober 2024
    zur Ergänzung der Verordnung (EU) 2023/1114 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der von bestimmten
    Finanzunternehmen in die Mitteilung zur Bekundung ihrer Absicht zur Erbringung
    von Krypto-Dienstleistungen aufzunehmenden Angaben
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/303 на Комисията
