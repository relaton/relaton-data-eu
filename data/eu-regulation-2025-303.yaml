    reguliavimo standartais, kuriais patikslinama informacija, įtrauktina į tam
    tikrų finansų sektoriaus subjektų pranešimą apie ketinimą teikti kriptoturto
    paslaugas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/303 tal-31 ta’ Ottubru 2024
