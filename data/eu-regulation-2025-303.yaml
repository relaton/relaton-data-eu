    no respeitante às normas técnicas de regulamentação que especificam as informações
    a notificar por determinadas entidades financeiras relativamente à sua intenção
    de prestar serviços de criptoativos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/303 al Comisiei din 31 octombrie 2024 de
