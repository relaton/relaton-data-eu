    w odniesieniu do regulacyjnych standardów technicznych określających informacje,
    które mają być przekazywane przez niektóre podmioty finansowe w powiadomieniu
    o zamiarze świadczenia usług w zakresie kryptoaktywów
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/303 da Comissão, de 31 de outubro de 2024,
