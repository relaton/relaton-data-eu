    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    la información que deben incluir determinadas entidades financieras en la notificación
    de su intención de prestar servicios de criptoactivos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/303 av den 31 oktober 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) 2023/1114
    vad gäller tekniska standarder för tillsyn som specificerar den information
    som vissa finansiella enheter ska ange i anmälan av sin avsikt att tillhandahålla
