    pokud jde o regulační technické normy upřesňující informace, které mají
    některé finanční subjekty uvádět v oznámení o svém záměru poskytovat
    služby související s kryptoaktivy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/303 af 31. oktober 2024 om
