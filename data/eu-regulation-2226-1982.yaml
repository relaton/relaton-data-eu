    της μεταβλητής πριμοδοτήσεως κατά τη σφαγή
    των προβατοειδών για τη Μεγάλη Βρετανία, και
    των ποσών προς είσπραξη για τα προϊόντα πού
    εξάγονται από την εν λόγω περιοχή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2226/82 della Commissione, dell'11 agosto 1982, che
    fissa, per la Gran Bretagna, l'entità del premio variabile alla macellazione
    degli ovini e gli importi da riscuotere all'uscita di determinati prodotti dal
    territorio di detta regione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2226/82 van de Commissie van 11 augustus 1982 tot
    vaststelling, voor Groot-Brittannië, van het bedrag van de variabele slachtpremie
    voorschapen en van de bedragen die moeten worden geheven op produkten bij het
    verlaten van dit grondgebied
