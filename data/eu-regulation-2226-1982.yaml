  content: Commission Regulation (EEC) No 2226/82 of 11 August 1982 fixing for Great
    Britain the level of the variable slaughter premium for sheep and the amounts
    to be charged on products leaving that region
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2226/82 de la Commission, du 11 août 1982, fixant pour
    la Grande-Bretagne le montant de la prime variable à l'abattage des ovins et
    les montants à percevoir sur les produits quittant cette région
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2226/82 der Kommission vom 11. August 1982 zur Festsetzung
    der Höhe der variablen Schlachtprämie für Schafe in Großbritannien und der
    Beträge, die auf dieses Gebiet verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2226/82 af 11. august 1982 om fastsættelse
    for Storbritannien af den variable præmie for slagtning af får og af de beløb,
    der skal opkræves for produkter, som udføres fra dette område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2226/82 της Επιτροπής
