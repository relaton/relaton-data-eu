title:
- language: en
  script: Latn
  content: '2013/164/EU: Commission Implementing Decision of 27 March 2013 repealing
    Decisions 2003/135/EC, 2004/832/EC and 2005/59/EC approving plans for the eradication
    of classical swine fever and the emergency vaccination of feral pigs in Germany,
    France and Slovakia (notified under document C(2013) 1741)'
  type: main
- language: fr
  script: Latn
  content: '2013/164/UE: Décision d’exécution de la Commission du 27 mars 2013
    abrogeant les décisions 2003/135/CE, 2004/832/CE et 2005/59/CE portant approbation
    des plans d’éradication de la peste porcine classique et de vaccination d’urgence
    des porcs sauvages en Allemagne, en France et en Slovaquie [notifiée sous le
    numéro C(2013) 1741]'
  type: main
- language: de
  script: Latn
  content: '2013/164/EU: Durchführungsbeschluss der Kommission vom 27. März 2013
