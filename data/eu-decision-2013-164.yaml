    der Pläne zur Tilgung der klassischen Schweinepest und zur Notimpfung gegen die
    klassische Schweinepest in der Schwarzwildpopulation in Deutschland, Frankreich
    und der Slowakei (Bekanntgegeben unter Aktenzeichen C(2013) 1741)'
  type: main
- language: bg
  script: Cyrl
