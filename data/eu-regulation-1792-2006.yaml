---
id: EURegulation17922006
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1792/2006 of 23 October 2006 adapting certain
    regulations and decisions in the fields of free movement of goods, freedom of
    movement of persons, competition policy, agriculture (veterinary and phytosanitary
    legislation), fisheries, transport policy, taxation, statistics, social policy
    and employment, environment, customs union, and external relations by reason of
    the accession of Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1792/2006 de la Commission du 23 octobre 2006 portant
    adaptation de certains règlements et décisions adoptés dans les domaines de
    la libre circulation des marchandises, de la libre circulation des personnes,
    de la politique de la concurrence, de l'agriculture (législation vétérinaire
    et phytosanitaire), de la pêche, de la politique des transports, de la fiscalité,
    des statistiques, de la politique sociale et de l'emploi, de l'environnement,
    de l'union douanière et des relations extérieures, en raison de l'adhésion
    de la Bulgarie et de la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1792/2006 der Kommission vom 23. Oktober 2006 zur Anpassung
    einiger Verordnungen, Beschlüsse und Entscheidungen in den Bereichen freier Warenverkehr,
    Freizügigkeit, Wettbewerbspolitik, Landwirtschaft (Veterinär- und Pflanzenschutzrecht),
    Fischerei, Verkehrspolitik, Steuerwesen, Statistik, Sozialpolitik und Beschäftigung,
    Umwelt, Zollunion und Außenbeziehungen anlässlich des Beitritts Bulgariens und
    Rumäniens
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1792/2006 на Комисията от 23
    октомври 2006 година за адаптиране на определени
    регламенти и решения в областта на свободното
    движение на стоки, свободно движение на хора,
    политика на конкуренция, земеделие (ветеринарно
    и фитосанирано законодателство), рибарство,
    транспортна политика, данъци, статистика, социална
    политика и заетост, околна среда, митнически
    съюз и външни отношения поради присъединяването
    на България и Румъния
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1792/2006 ze dne 23. října 2006 , kterým
    se v důsledku přistoupení Bulharska a Rumunska upravují některá nařízení
    a rozhodnutí v oblasti volného pohybu zboží, volného pohybu osob, politiky
    hospodářské soutěže, zemědělství (veterinárních a rostlinolékařských
    předpisů), rybolovu, dopravní politiky, daní, statistiky, sociální politiky
    a zaměstnanosti, životního prostředí, celní unie a vnějších vztahů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1792/2006 af 23. oktober 2006 om tilpasning
    af visse forordninger, beslutninger og afgørelser vedrørende frie varebevægelser,
    frie personbevægelser, konkurrencepolitik, landbrug (veterinær- og plantesundhedslovgivning),
    fiskeri, transportpolitik, beskatning, statistikker, socialpolitik og beskæftigelse,
    miljø, toldunion og eksterne forbindelser på grund af Bulgariens og Rumæniens
    tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1792/2006 της Επιτροπής,
    της 23ης Οκτωβρίου 2006 , για την προσαρμογή ορισμένων
    κανονισμών και αποφάσεων στον τομέα της ελεύθερης
    κυκλοφορίας των εμπορευμάτων, της ελεύθερης
    κυκλοφορίας προσώπων, της πολιτικής ανταγωνισμού,
    της γεωργίας (κτηνιατρική και φυτοϋγειονομική
    νομοθεσία), της αλιείας, της πολιτικής μεταφορών,
    της φορολογίας, των στατιστικών, της κοινωνικής
    πολιτικής και της απασχόλησης, του περιβάλλοντος,
    της τελωνειακής ένωσης και των εξωτερικών
    σχέσεων, λόγω της προσχώρησης της Βουλγαρίας
    και της Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1792/2006, 23. oktoober 2006 , millega kohandatakse
    teatavaid määrusi ja otsuseid kaupade vaba liikumise, isikute vaba liikumise,
    konkurentsipoliitika, põllumajanduse (veterinaar- ja fütosanitaarõigusaktid),
    kalanduse, transpordipoliitika, maksustamise, statistika, sotsiaalpoliitika ja
    tööhõive, keskkonna, tolliliidu ning välissuhete valdkonnas seoses Bulgaaria
    ja Rumeenia ühinemisega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1792/2006, annettu 23 päivänä lokakuuta 2006
    , tiettyjen asetusten ja päätösten mukauttamisesta tavaroiden vapaan liikkuvuuden,
    henkilöiden vapaan liikkuvuuden, kilpailupolitiikan, maatalouden (eläinlääkintä-
    ja kasvinsuojelulainsäädäntö), kalastuksen, liikennepolitiikan, verotuksen,
    tilastojen, sosiaalipolitiikan ja työllisyyden, ympäristön, tulliliiton ja
    ulkosuhteiden aloilla Bulgarian ja Romanian liittymisen johdosta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1792/2006/EK rendelete ( 2006. október 23. ) Bulgária és
    Románia csatlakozása következtében az áruk szabad áramlására, a személyek
    szabad mozgására, a versenypolitikára, a mezőgazdaságra (állat- és növény-egészségügyi
    jogszabályok), a halászatra, a közlekedéspolitikára, az adózásra, a statisztikára,
    a foglalkoztatásra és szociálpolitikára, a környezetvédelemre, a vámunióra
    és a külkapcsolatokra vonatkozó egyes rendeletek és határozatok kiigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1792/2006 della Commissione, del 23 ottobre 2006 ,
    che adegua un certo numero di regolamenti e decisioni in materia di libera circolazione
    delle merci, libera circolazione delle persone, politica di concorrenza, agricoltura
    (normativa veterinaria e fitosanitaria), pesca, politica dei trasporti, fiscalità,
    statistiche, politica sociale e occupazione, ambiente, unione doganale e relazioni
    esterne, a motivo dell’adesione della Bulgaria e della Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1792/2006 ( 2006. gada 23. oktobris ), ar ko
    pielāgo noteiktas regulas un lēmumus brīvas preču aprites, personu pārvietošanās
    brīvības, konkurences politikas, lauksaimniecības (tiesību akti veterinārijas
    un fitosanitārijas jomā), zivsaimniecības, transporta politikas, nodokļu politikas,
    statistikas, sociālās politikas un nodarbinātības, vides, muitas savienības
    un ārējo attiecību jomā saistībā ar Bulgārijas un Rumānijas pievienošanos
  type: main
- language: lt
  script: Latn
  content: 2006 m. spalio 23 d. Komisijos reglamentas (EB) Nr. 1792/2006 dėl Bulgarijos
    ir Rumunijos stojimo pritaikantis kai kuriuos reglamentus ir sprendimus laisvo
    prekių judėjimo, laisvo asmenų judėjimo, konkurencijos politikos, žemės
    ūkio (veterinarijos ir fitosanitarijos teisės aktai), žuvininkystės, transporto
    politikos, mokesčių, statistikos, socialinės politikos ir užimtumo, aplinkos,
    muitų sąjungos ir išorės santykių srityse
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1792/2006 van de Commissie van 23 oktober 2006 tot
    aanpassing van bepaalde verordeningen, beschikkingen en besluiten op het gebied
    van het vrije verkeer van goederen en personen, het mededingingsbeleid, de landbouw
    (veterinaire en fytosanitaire wetgeving), de visserij, het vervoersbeleid, de
    belastingen, de statistiek, het sociale beleid en de werkgelegenheid, het milieu,
    de douane-unie en externe betrekkingen, in verband met de toetreding van Bulgarije
    en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1792/2006 z dnia 23 października 2006
    r. dostosowujące niektóre rozporządzenia i decyzje w takich dziedzinach, jak
    swobodny przepływ towarów, swobodny przepływ osób, polityka konkurencji, rolnictwo
    (prawodawstwo weterynaryjne oraz fitosanitarne), rybołówstwo, polityka transportowa,
    podatki, statystyka, polityka społeczna i zatrudnienie, środowisko naturalne,
    unia celna i stosunki zewnętrzne, w związku z przystąpieniem Bułgarii i Rumunii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1792/2006 da Comissão, de 23 de Outubro de 2006
    , que adapta determinados regulamentos e decisões nos domínios da livre circulação
    de mercadorias, livre circulação de pessoas, política de concorrência, agricultura
    (legislação veterinária e fitossanitária), pesca, política de transportes,
    fiscalidade, estatísticas, política social e emprego, ambiente, união aduaneira
    e relações externas, em virtude da adesão da Bulgária e da Roménia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1792/2006 al Comisiei din 23 octombrie 2006 de adaptare
    a anumitor regulamente și decizii adoptate în domeniul liberei circulații a
    mărfurilor, al liberei circulații a persoanelor, al politicii în domeniul concurenței,
    al agriculturii (legislația veterinară și fitosanitară), al pescuitului, al
    politicii în domeniul transporturilor, al impozitării, al statisticii, al politicii
    sociale și al ocupării forței de muncă, al mediului, al uniunii vamale și
    al relațiilor externe, ca urmare a aderării Bulgariei și României
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1792/2006 z 23. októbra 2006 , ktorým sa
    z dôvodu pristúpenia Bulharska a Rumunska upravujú určité nariadenia a rozhodnutia
    v oblasti voľného pohybu tovaru, voľného pohybu osôb, politiky hospodárskej
    súťaže, poľnohospodárstva (veterinárnych a fytosanitárnych právnych predpisov),
    rybného hospodárstva, dopravnej politiky, zdaňovania, štatistiky, sociálnej
    politiky a zamestnananosti, životného prostredia, colnej únie a vonkajších
    vzťahov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1792/2006 z dne 23. oktobra 2006 o prilagoditvi
    nekaterih uredb ter odločb in sklepov na področjih prostega pretoka blaga, prostega
    gibanja oseb, politike konkurence, kmetijstva (veterinarska in fitosanitarna zakonodaja),
    ribištva, prometne politike, obdavčitve, statistike, socialne politike in zaposlovanja,
    okolja, carinske unije in zunanjih odnosov zaradi pristopa Bolgarije in Romunije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1792/2006 de la Comisión, de 23 de octubre de 2006
    , por el que se adaptan determinados reglamentos y decisiones en los ámbitos
    de la libre circulación de mercancías, la libre circulación de personas, la
    política de competencia, la agricultura (legislación veterinaria y fitosanitaria),
    la pesca, la política de transportes, la fiscalidad, las estadísticas, la política
    social y el empleo, el medio ambiente, la unión aduanera y las relaciones exteriores,
    con motivo de la adhesión de Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1792/2006 av den 23 oktober 2006 om anpassning
    av vissa förordningar och beslut när det gäller fri rörlighet för varor,
    fri rörlighet för personer, konkurrenspolitik, jordbruk (veterinärlagstiftning
    och fytosanitär lagstiftning), fiske, transportpolitik, beskattning, statistik,
    socialpolitik och sysselsättning, miljö, tullunion samt yttre förbindelser,
    med anledning av Bulgariens och Rumäniens anslutning
  type: main
