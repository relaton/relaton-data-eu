title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2152/2005 of 23 December 2005 amending Regulation
    (EC) No 327/98 opening and providing for the administration of certain tariff
    quotas for imports of rice and broken rice and Regulation (EC) No 1549/2004 derogating
    from Council Regulation (EC) No 1785/2003 as regards the arrangements for importing
    rice and laying down separate transitional rules for imports of basmati rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2152/2005 de la Commission du 23 décembre 2005 modifiant
    le règlement (CE) n o 327/98 portant ouverture et mode de gestion de certains
    contingents tarifaires d’importation de riz et de brisures de riz ainsi que
    le règlement (CE) n o 1549/2004 dérogeant au règlement (CE) n o 1785/2003 du
    Conseil en ce qui concerne le régime d’importation du riz et fixant des règles
    spécifiques transitoires applicables à l'importation du riz Basmati
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2152/2005 der Kommission vom 23. Dezember 2005 zur
    Änderung der Verordnung (EG) Nr. 327/98 zur Eröffnung und Verwaltung von Einfuhrzollkontingenten
    für Reis und Bruchreis sowie der Verordnung (EG) Nr. 1549/2004 zur Abweichung
    von der Verordnung (EG) Nr. 1785/2003 des Rates hinsichtlich der Einfuhrregelung
    für Reis und zur Festlegung besonderer Übergangsbestimmungen für die Einfuhr
    von Basmati-Reis
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2152/2005 на Комисията от 23
    декември 2005 година за изменение на Регламент
    (ЕО) № 327/98 за откриване и за начин на управление
    на някои тарифни квоти при внос на цял и на
    натрошен ориз, както и на Регламент (ЕО) № 1549/2004
