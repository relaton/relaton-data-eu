    ja hallinnoinnista annetun asetuksen (EY) N:o 327/98 ja neuvoston asetuksesta
    (EY) N:o 1785/2003 poikkeamisesta riisin tuontijärjestelmän osalta ja Basmati-riisin
    tuontiin sovellettavien erityisten siirtymäkauden sääntöjen vahvistamisesta
    annetun asetuksen (EY) N:o 1549/2004 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 2152/2005 od 23. prosinca 2005. o izmjeni Uredbe
    (EZ) br. 327/98 o otvaranju i predviđanju upravljanja određenim carinskim kvotama
    za uvoz riže i lomljene riže te Uredbe (EZ) br. 1549/2004 o odstupanju od Uredbe
    Vijeća (EZ) br. 1785/2003 u pogledu pravila za uvoz riže i o utvrđivanju zasebnih
    prijelaznih pravila za uvoz basmati riže
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2152/2005/EK rendelete ( 2005. december 23. ) a rizs és a
    törmelékrizs behozatalára vonatkozó egyes vámkontingensek megnyitásáról
    és kezeléséről szóló 327/98/EK rendelet és a rizs behozatali rendszere
    tekintetében az 1785/2003/EK tanácsi rendelettől való eltérésről és a
    basmati rizs behozatalára alkalmazandó átmeneti egyedi szabályok megállapításáról
    szóló 1549/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2152/2005 della Commissione, del 23 dicembre 2005 ,
    che modifica il regolamento (CE) n. 327/98 recante apertura e modalità di gestione
    di taluni contingenti tariffari per l’importazione di riso e rotture di riso
    nonché il regolamento (CE) n. 1549/2004 che deroga al regolamento (CE) n. 1785/2003
    del Consiglio in ordine al regime di importazione del riso e che fissa specifiche
    regole transitorie applicabili alle importazioni di riso Basmati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2152/2005 ( 2005. gada 23. decembris ), ar kuru
    groza Regulu (EK) Nr. 327/98, ar ko atver konkrētas tarifa kvotas rīsu un šķelto
    rīsu importam, kā arī paredz šo kvotu pārvaldību, kā arī Regulu (EK) Nr.
    1549/2004, ar ko paredz atkāpes no Padomes Regulas (EK) Nr. 1785/2003 attiecībā
    uz rīsa importēšanas režīmu un nosaka īpašus pagaidu noteikumus basmati
    rīsu importēšanai
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 23 d. Komisijos reglamentas (EB) Nr. 2152/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 327/98, atidarantį tam tikras ryžių ir skaldytų
    ryžių importo tarifines kvotas ir numatantį jų administravimą, ir Reglamentą
    (EB) Nr. 1549/2004, nukrypstantį nuo Tarybos reglamento (EB) Nr. 1785/2003 dėl
    ryžių importo tvarkos ir nustatančio konkrečias pereinamojo laikotarpio taisykles,
    taikomas Basmati ryžių importui
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 2152/2005 tat- 23 ta' Diċembru 2005
    li jemenda r-Regolament (KE) Nru 327/98 li jiftaħ u jipprovdi għall-amministrazzjoni
    ta' ċerti kwoti ta' tariffi għall-importazzjonijiet ta' ross u ross miksur u
    r-Regolament (KE) Nru 1549/2004 li jidderoga mir-Regolament tal-Kunsill (KE) Nru
    1785/2003 fir-rigward tal-arranġamenti għall-importazzjoni ta' ross u li jistabbilixxi
    regoli ta' tranżizzjoni separate għall-importazzjoni tar-ross basmati
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2152/2005 van de Commissie van 23 december 2005 tot
    wĳziging van Verordening (EG) nr. 327/98 inzake de opening en de wĳze van beheer
    van bepaalde tariefcontingenten voor de invoer van rĳst en breukrĳst, alsmede
    van Verordening (EG) nr. 1549/2004 houdende afwijking van Verordening (EG) nr.
    1785/2003 van de Raad ten aanzien van de invoerregeling voor rijst en tot vaststelling
    van een overgangsregeling voor de invoer van Basmati-rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2152/2005 z dnia 23 grudnia 2005 r. zmieniające
    rozporządzenie (WE) nr 327/98 otwierające i ustalające zarządzanie kontyngentami
    taryfowymi na przywóz ryżu i ryżu łamanego oraz rozporządzenie (WE) nr 1549/2004
    wprowadzające odstępstwo od rozporządzenia Rady (WE) nr 1785/2003 dotyczące
    systemu przywozu ryżu i ustanawiające szczegółowe przejściowe zasady mające
    zastosowanie do przywozu ryżu Basmati
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2152/2005 da Comissão, de 23 de Dezembro de 2005
    , que altera o Regulamento (CE) n. o 327/98 relativo à abertura e modo de gestão
    de determinados contingentes pautais de importação de arroz e de trincas de
    arroz e o Regulamento (CE) n. o 1549/2004 que derroga ao Regulamento (CE) n. o
    1785/2003 do Conselho no que diz respeito ao regime de importação do arroz e
    que fixa regras específicas de transição aplicáveis à importação de arroz
    Basmati
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2152/2005 al Comisiei din 23 decembrie 2005 de modificare
    a Regulamentului (CE) nr. 327/98 privind deschiderea și modul de gestionare a
    anumitor contingente tarifare pentru importurile de orez și de brizură de orez,
    precum și a Regulamentului (CE) nr. 1549/2004 de derogare de la Regulamentul
    (CE) nr. 1785/2003 al Consiliului în ceea ce privește regimul de import al orezului
    și de stabilire a unor norme tranzitorii specifice aplicabile importului de orez
    Basmati
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2152/2005 z 23. decembra 2005 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 327/98 otvárajúce a stanovujúce správu
    určitých colných kvót na dovoz ryže a zlomkovej ryže, ako aj nariadenie
    (ES) č. 1549/2004, ktoré sa odlišuje od nariadenia Rady (ES) č. 1785/2003
    týkajúceho sa dovozného režimu pre ryžu, a ktoré stanovuje špecifické
    prechodné pravidlá uplatniteľné na dovoz ryže Basmati
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2152/2005 z dne 23. decembra 2005 o spremembi
    Uredbe (ES) št. 327/98 o odprtju in zagotovitvi upravljanja nekaterih tarifnih
    kvot za uvoz riža in lomljenega riža ter tudi Uredbe (ES) št. 1549/2004 o odstopanju
    od Uredbe Sveta (ES) št. 1785/2003 v delu, ki se nanaša na uvozni režim za
    riž, in o določitvi posebnih prehodnih pravil za uvoz riža basmati
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2152/2005 de la Comisión, de 23 de diciembre de 2005
    , por el que se modifican el Reglamento (CE) n o 327/98 relativo a la apertura
    y el modo de gestión de determinados contingentes arancelarios de importación
    de arroz y arroz partido y el Reglamento (CE) n o 1549/2004 por el que se establecen
    excepciones al Reglamento (CE) n o 1785/2003 del Consejo en lo relativo al régimen
    de importación del arroz y se fijan normas específicas transitorias aplicables
    a la importación de arroz Basmati
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2152/2005 av den 23 december 2005 om
    ändring av förordning (EG) nr 327/98 om öppnande och förvaltning av vissa
    tullkvoter för import av ris och brutet ris och ändring av förordning (EG)
    nr 1549/2004 om undantag från rådets förordning (EG) nr 1785/2003 i fråga
