    des Rindfleischsektors, die Gegenstand von Interventionskäufen in der Bundesrepublik
    Deutschland sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1921/78 af 7. august 1978 om ændring
