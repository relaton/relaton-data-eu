  content: Commission Regulation (EEC) No 1921/78 of 7 August 1978 amending Regulations
    (EEC) No 1896/73 and (EEC) No 1045/78 as regards the products which may be bought
    into intervention in the Federal Republic of Germany, and their coefficients in
    the beef and veal sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1921/78 de la Commission, du 7 août 1978, modifiant
    les règlements (CEE) n° 1896/73 et (CEE) n 1045/78 en ce qui concerne les produits
    pouvant faire l'objet d'achats à l'intervention en République fédérale d'Allemagne,
    ainsi que leurs coefficients dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1921/78 der Kommission vom 7. August 1978 zur Änderung
