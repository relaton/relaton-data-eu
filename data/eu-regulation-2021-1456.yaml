title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1456 of 2 June 2021 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council by specifying
    the conditions under which the commercial terms for clearing services for OTC
    derivatives are to be considered to be fair, reasonable, non-discriminatory and
    transparent
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1456 de la Commission du 2 juin 2021 complétant
    le règlement (UE) no 648/2012 du Parlement européen et du Conseil en précisant
    dans quels cas les conditions commerciales applicables à des services de compensation
    de produits dérivés de gré à gré doivent être considérées comme étant
    équitables, raisonnables, non discriminatoires et transparentes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1456 der Kommission vom 2. Juni 2021 zur
    Ergänzung der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des
    Rates mittels Festlegung der Voraussetzungen, unter denen die handelsüblichen
    Bedingungen von Clearingdiensten für OTC-Derivate als fair, angemessen, diskriminierungsfrei
    und transparent anzusehen sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1456 на Комисията
