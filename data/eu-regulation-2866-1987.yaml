title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2866/87 of 24 September 1987 re-establishing
    the levying of customs duties on lysine and its esters, and their salts falling
    within subheading 29.23 D I of the Common Customs Tariff originating in Mexico
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2866/87 de la Commission du 24 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables à la lysine,
    ses esters et leurs sels de la sous-position 29.23 D I du tarif douanier commun,
    originaires du Mexique, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2866/87 der Kommission vom 24. September 1987 zur
    Wiedereinführung der Erhebung der Zölle für Lysin, seine Ester und ihre Salze
    der Tarifstelle 29.23 D I des Gemeinsamen Zolltarifs mit Ursprung in Mexiko, dem
    die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2866/87 af 24. september 1987 om genindførelse
