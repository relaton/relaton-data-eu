id: EURegulation38211992
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3821/92 of 28 December 1992 repealing Regulation
    (EEC) No 3294/86 and amending Regulations (EEC) No 1393/76, (EEC) No 1780/89,
    (EEC) No 2053/89, (EEC) No 2054/89, (EEC) No 209/88 and No 163/67/EEC so as to
    abolish the derogation from the use of the agricultural conversion rate for the
    amounts in question
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3821/92 de la Commission, du 28 décembre 1992, abrogeant
    le règlement (CEE) n° 3294/86 et modifiant les règlements (CEE) n° 1393/76,
    (CEE) n 1780/89, (CEE) n° 2053/89, (CEE) n 2054/89, (CEE) n 209/88 et n° 163/67/CEE
    afin de supprimer la dérogation à l'utilisation du taux de conversion agricole
    pour les montants concernés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3821/92 der Kommission vom 28. Dezember 1992 zur Aufhebung
    der Verordnung (EWG) Nr. 3294/86 und zur Änderung der Verordnungen (EWG) Nr.
    1393/76, (EWG) Nr. 1780/89, (EWG) Nr. 2053/89, (EWG) Nr. 2054/89, (EWG) Nr. 209/88
    und Nr. 163/67/EWG im Sinne einer Streichung der Abweichung von der Anwendung
    des landwirtschaftlichen Umrechnungskurses für die jeweiligen Beträge
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 3821/92 на Комисията от 28
    декември 1992 година за отмяна на Регламент (ЕИО)
    № 3294/86 и за изменение на Регламенти (ЕИО) №
    1393/76, (ЕИО) № 1780/89, (ЕИО) № 2053/89, (ЕИО) № 2054/89, (ЕИО)
    № 209/88 и № 163/67/ЕИО с оглед премахване на дерогацията
    при използването на селскостопанския обменен
    курс за съответните суми
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 3821/92 ze dne 28. prosince 1992, kterým
    se zrušuje nařízení (EHS) č. 3294/86 a kterým se mění nařízení (EHS)
    č. 1393/76, (EHS) č. 1780/89, (EHS) č. 2053/89, (EHS) č. 2054/89, (EHS) č.
    209/88 a č. 163/67/EHS za účelem zrušení odchylky od použití zemědělského
    přepočítacího koeficientu pro dotyčné částky
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3821/92 af 28. december 1992 om ophævelse
    af forordning (EØF) nr. 3294/86 og ændring af forordning (EØF) nr. 1393/76,
    (EØF) nr. 1780/89, (EØF) nr. 2053/89, (EØF) nr. 2054/89, (EØF) nr. 209/88
    og nr. 163/67/EØF med henblik på at ophæve undtagelsen fra anvendelse af landbrugsomregningskursen
    for de pågældende beløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3821/92 της Επιτροπής
