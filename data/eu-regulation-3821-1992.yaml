    των κανονισμών (ΕΟΚ) αριθ. 1393/76, (ΕΟΚ) αριθ. 1780/89,
    (ΕΟΚ) αριθ. 2053/89, (ΕΟΚ) αριθ. 2054/89, (ΕΟΚ) αριθ. 209/88
    και (ΕΟΚ) αριθ. 163/67, ώστε να καταργηθεί η παρέκκλιση
    από τη χρησιμοποίηση της γεωργικής τιμής μετατροπής
    σε οικεία ποσά
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 3821/92, 28. detsember 1992, millega tunnistatakse
    kehtetuks määrus (EMÜ) nr 3294/86 ja muudetakse määrusi (EMÜ) nr 1393/76,
    (EMÜ) nr 1780/89, (EMÜ) nr 2053/89, (EMÜ) nr 2054/89, (EMÜ) nr 209/88 ja nr
    163/67/EMÜ eesmärgiga tühistada erand põllumajandusliku ümberarvestuskursi
    kasutamisest asjaomaste summade puhul
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3821/92, annettu 28 päivänä joulukuuta 1992,
    asetuksen (ETY) N:o 3294/86 kumoamisesta ja asetusten (ETY) N:o 1393/76, (ETY)
    N:o 1780/89, (ETY) N:o 2053/89, (ETY) N:o 2054/89, (ETY) N:o 209/88 ja N:o 163/67/ETY
    muuttamisesta maatalouden muuntokurssien käyttöä koskevan poikkeuksen poistamiseksi
    kyseisten määrien osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 3821/92 od 28. prosinca 1992. o stavljanju izvan
    snage Uredbe (EEZ) br. 3294/86 i o izmjeni uredaba (EEZ) br. 1393/76, (EEZ) br.
    1780/89, (EEZ) br. 2053/89, (EEZ) br. 2054/89, (EEZ) br. 209/88 i br. 163/67/EEZ
    za ukidanje odstupanja od primjene poljoprivredne stope konverzije za predmetne
    iznose
  type: main
- language: hu
  script: Latn
  content: A Bizottság 3821/92/EGK rendelete (1992. december 28.) az érintett összegek
    felhasználására vonatkozó mezőgazdasági átváltási árfolyamtól történő
    eltérés megszüntetése érdekében a 3294/86/EGK rendelet hatályon kívül
    helyezéséről és az 1393/76/EGK, az 1780/89/EGK, a 2053/89/EGK, a 2054/89/EGK,
    a 209/88/EGK és a 163/67/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3821/92 della Commissione, del 28 dicembre 1992, che
    abroga il regolamento (CEE) n. 3294/86 e modifica i regolamenti (CEE) n. 1393/76,
    (CEE) n. 1780/89, (CEE) n. 2053/89, (CEE) n. 2054/89, (CEE) n. 209/88 e n. 163/67/CEE
    al fine di abolire la deroga all'utilizzazione del tasso di conversione agricolo
    per gli importi interessati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 3821/92 (1992. gada 28. decembris), ar ko atceļ
    Regulu (EEK) Nr. 3294/86 un groza Regulas (EEK) Nr. 1393/76, (EEK) Nr. 1780/89,
    (EEK) Nr. 2053/89, (EEK) Nr. 2054/89, (EEK) Nr. 209/88 un Nr. 163/67/EEK, atceļot
    atkāpi no lauksaimniecības konversijas likmes lietošanas attiecīgajām summām
  type: main
- language: lt
  script: Latn
  content: 1992 m. gruodžio 28 d. Komisijos reglamentas (EEB) Nr. 3821/92, panaikinantis
    Reglamentą (EEB) Nr. 3294/86 ir iš dalies keičiantis Reglamentus (EEB) Nr.
    1393/76, (EEB) Nr. 1780/89, (EEB) Nr. 2053/89, (EEB) Nr. 2054/89, (EEB) Nr. 209/88
    ir Nr. 163/67/EEB, panaikindamas nuostatą, leidžiančią konkrečių sumų atžvilgiu
    nukrypti nuo taikytino žemės ūkio perskaičiavimo kurso
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 3821/92 tat-28 ta’ Diċembru
    1992 li jħassar ir-Regolamenti (KEE) Nru 3294/86 u li jemenda r-Regolament (KEE)
    Nru 1393/76, (KEE) Nru 1780/89, (KEE) Nru 2053/89, (KEE) Nru 2054/89, (KEE) Nru
    209/88 u Nru 163/67/KEE biex jabolixxi d-deroga mill-użu tar-rata ta’ konverżjoni
    agrikola għall-ammonti in kwistjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3821/92 van de Commissie van 28 december 1992 tot
    intrekking van Verordening (EEG) nr. 3294/86 en tot wijziging van de Verordeningen
    (EEG) nr. 1393/76, (EEG) nr. 1780/89, (EEG) nr. 2053/89, (EEG) nr. 2054/89, (EEG)
    nr. 209/88 en nr. 163/67/EEG ten einde de uitzondering op de toepassing van de
    landbouwomrekeningskoers voor de betrokken bedragen af te schaffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 3821/92 z dnia 28 grudnia 1992 r. uchylające
    rozporządzenie (EWG) nr 3294/86 i zmieniające rozporządzenia (EWG) nr 1393/76,
    (EWG) nr 1780/89, (EWG) nr 2053/89, (EWG) nr 2054/89, (EWG) nr 209/88 i nr 163/67/EWG
    w celu zniesienia odstępstw od stosowania rolniczego kursu przeliczeniowego w
    odniesieniu do danych kwot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3821/92 da Comissão, de 28 de Dezembro de 1992,
    que revoga o Regulamento (CEE) nº 3294/86 e altera os Regulamentos (CEE) nº
    1393/76, (CEE) nº 1780/89, (CEE) nº 2053/89, (CEE) nº 2054/89, (CEE) nº 209/88
    e nº 163/67/CEE para se suprimir a derrogação à utilização da taxa de conversão
    agrícola para os montantes em causa
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 3821/92 al Comisiei din 28 decembrie 1992 de abrogare
    a Regulamentului (CEE) nr. 3294/86 și de modificare a Regulamentelor (CEE) nr.
    1393/76, (CEE) nr. 1780/89, (CEE) nr. 2053/89, (CEE) nr. 2054/89, (CEE) nr. 209/88
    și nr. 163/67/CEE, în scopul eliminării derogării privind utilizarea ratei
    de conversie agricole pentru sumele în cauză
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 3821/92 z 28. decembra 1992, ktorým sa zrušuje
    nariadenie (EHS) č. 3294/86, a ktorým sa menia a dopĺňajú nariadenia (EHS)
    č. 1393/76, (EHS) č. 1780/89, (EHS) č. 2053/89, (EHS) č. 2054/89, (EHS) č.
    209/88 a č. 163/67/EHS, aby bola zrušená odchýlka od použitia poľnohospodárskeho
    prepočítacieho koeficientu pre predmetné čiastky
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 3821/92 z dne 28. decembra 1992 o razveljavitvi
    Uredbe (EGS) št. 3294/86 in o spremembi uredb (EGS) št. 1393/76, (EGS) št.
    1780/89, (EGS) št. 2053/89, (EGS) št. 2054/89, (EGS) št. 209/88 in št. 163/67/EGS
    za odpravo odstopanja od uporabe kmetijskega obračunskega tečaja za zadevne
    zneske
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3821/92 de la Comisión, de 28 de diciembre de 1992,
    por el que se deroga el Reglamento (CEE) n° 3294/86 y se modifican los Reglamentos
    (CEE) n°s 1393/76, 1780/89, 2053/89, 2054/89, 209/88 y 163/67 con objeto de suprimir
    la excepción de la utilización del tipo de conversión agrario para los importes
    correspondientes
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3821/92 av den 28 december 1992 om upphävande
    av förordning (EEG) nr 3294/86 och ändring av förordning (EEG) nr 1393/76,
    (EEG) nr 1780/89, (EEG) nr 2053/89, (EEG) nr 2054/89, (EEG) nr 209/88 och nr 163/67/EEG
    för att avskaffa undantaget från tillämpning av jordbruksomräkningskursen
    för de berörda beloppen
