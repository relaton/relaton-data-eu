title:
- language: en
  script: Latn
  content: '89/19/EEC: Commission Decision of 23 December 1988 adopting the 1989 plan
    allocating to the Member States resources to be charged to the 1989 budget year
    for the supply of food from intervention stocks to designated organizations for
    distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '89/19/CEE: Décision de la Commission du 23 décembre 1988 adoptant le
    plan de 1989 portant attribution aux États membres de ressources imputables à
    l''exercice 1989 pour la fourniture de denrées alimentaires provenant des stocks
    d''intervention à des organisations désignées pour les distribuer aux personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 23. Dezember 1988 zur Bewilligung von
    Mitteln, die im Haushaltsjahr 1989 für die Lieferung von Nahrungsmitteln aus
    Interventionsbeständen an bestimmte Einrichtungen zur Verteilung an Bedürftige
    in der Gemeinschaft zu verbuchen sind (89/19/EWG) (89/19/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 23. december 1988 om vedtagelse af 1989-planen
    for tildeling til medlemsstaterne af midler, der skal afholdes over 1989-budgettet,
    og som skal dække udgifterne til levering af levnedsmidler fra interventionslagre
    til de udpegede organisationer med henblik på uddeling til de socialt dårligst
    stillede personer i Fællesskabet (89/19/EØF) (89/19/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 23ης Δεκεμβρίου
    1988 για την έγκριση του προγράμματος 1989 για
    την κατανομή στα κράτη μέλη των πόρων που θα
    καταλογισθούν στο έτος προϋπολογισμού 1989 για
    τη χορήγηση τροφίμων που προέρχονται από τα
    αποθέματα παρέμβασης σε οργανισμούς που έχουν
    ορισθεί για τη διανομή τους στους απόρους της
    Κοινότητας
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 23 dicembre 1988 che approva il piano
    per il 1989 agli Stati membri le risorse da imputare all'' esercizio finanziario
    1989 per la fornitura a determinati organismi di derrate alimentari provenienti
    dalle scorte di intervento e destinate ad essere distribuite agli indigenti nella
    Comunità (89/19/CEE) (89/19/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 23 december 1988 tot vaststelling van
    het jaarplan voor 1989 voor de toewijzing aan de Lid-Staten van voor het begrotingsjaar
    1989 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan de meest behoeftigen
    in de Gemeenschap (89/19/EEG) (89/19/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 23 de Dezembro de 1988 que adopta o plano para
    1989, que atribui aos Estados-membros recursos a incluir no exercício orçamental
    de 1989 para o fornecimento, a determinadas organizações, de géneros alimentícios,
    provenientes das existências de intervenção, para distribuição às pessoas
    mais necessitadas na Comunidade (89/19/CEE) (89/19/CEE) #'
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 23 de diciembre de 1988 por la que se adopta
    el plan para 1989 que establece la asignacion a los Estados Miembros de recursos
    imputables al ejercicio presupuestario para el suministro a determinadas organizaciones
    de alimentos procedentes de existencias de intervencion, para su distribucion
    entre las personas mas necesitadas de la Comunidad (89/19/CEE)
