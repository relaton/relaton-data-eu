title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 avril 1972, autorisant la République
    italienne à exclure du traitement communautaire les propulseurs spéciaux du
    type hors- bord, de la position 84.06 B du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/197/EWG: Entscheidung der Kommission vom 24. April 1972, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Außenbordmotoren der Tarifnummer
    84.06 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/197/CEE: Decisione della Commissione, del 24 aprile 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i propulsori speciali
    del tipo fuoribordo della voce n. 84.06 B della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/197/EEG: Beschikking van de Commissie van 24 april 1972 waarbij de
    Italiaanse Republiek wordt gemachtigd buitenboordmotoren van post 84.06 B van
    het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
