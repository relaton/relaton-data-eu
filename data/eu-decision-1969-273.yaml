title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 juillet 1969, relative à l'autorisation
    de deux mesures tarifaires intérieures spéciales de la SNCF applicables aux
    transports de combustibles minéraux solides en provenance du Centre- Midi à
    destination des départements de la Moselle et de la Meurthe-et-Moselle et du
    département du Calvados
  type: main
- language: de
  script: Latn
  content: '69/273/EGKS: Entscheidung der Kommission vom 28. Juli 1969 über die Genehmigung
    von zwei Ausnahmetarifen der Société Nationale des Chemins de fer français
    (SNCF) im Binnenverkehr für Beförderungen fester Brennstoffe aus dem Centre-Midi
    in die Departements Moselle und Meurthe- et-Moselle sowie in das Departement Calvados'
  type: main
- language: it
  script: Latn
  content: '69/273/CECA: Decisione della Commissione, del 28 luglio 1969, che autorizza
    due tariffe interne speciali della Société nationale des chemins de fer français
    applicabili ai trasporti di combustibili minerali solidi provenienti dal Centre-Midi
    e destinati ai dipartimenti della Mosella e della Meurthe-et-Moselle ed al dipartimento
    del Calvados'
  type: main
- language: nl
  script: Latn
  content: '69/273/EGKS: Beschikking van de Commissie van 28 juli 1969 houdende goedkeuring
    van twee bijzondere binnenlandse tarieven van de Société nationale des chemins
    de fer français (S.N.C.F.) voor het vervoer van vaste minerale brandstoffen vanaf
    Centre-Midi naar de departementen Moselle en Meurthe-et-Moselle en het departement
    Calvados'
  type: main
