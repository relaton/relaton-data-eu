title:
- language: en
  script: Latn
  content: '80/358/EEC: Commission Decision of 12 March 1980 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of cotton, falling
    within heading No 55.09 of the Common Customs Tariff (category 2), originating
    in South Korea and in free circulation in the other Member States (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/358/CEE: Décision de la Commission, du 12 mars 1980, autorisant la
    République italienne à exclure du traitement communautaire les tissus de coton,
    de la position 55.09 du tarif douanier commun (catégorie 2), originaires de la
    Corée du Sud et mis en libre pratique dans les autres Etats membres (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/358/EWG: Entscheidung der Kommission vom 12. März 1980, mit der die
    Italienische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle der Tarifnummer
    55.09 des Gemeinsamen Zolltarifs, Kategorie 2, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/358/EØF: Kommissionens beslutning af 12. marts 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld, som henhører under pos. 55.09 i den fælles toldtarif (kategori 2),
    har oprindelse i Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun
    den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/358/CEE: Decisione della Commissione, del 12 marzo 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario tessuti di cotone
    della voce 55.09 della tariffa doganale comune, categoria 2, originari della Corea
    del Sud e messi in libera pratica negli altri Stati membri (Il testo in lingua
    italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/358/EEG: Beschikking van de Commissie van 12 maart 1980 waarbij de
    Italiaanse Republiek wordt gemachtigd weefsels van katoen van post 55.09 van het
    gemeenschappelijk douanetarief (categorie 2), van oorsprong uit Zuid-Korea en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
