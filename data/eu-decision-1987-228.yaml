type: standard
title:
- language: en
  script: Latn
  content: '87/228/EEC: Commission Decision of 16 March 1987 amending Decision 77/144/EEC
    laying down the standard code and rules governing the transcription into a machine-readable
    form of the data of the surveys of plantations of certain species of fruit trees
    and laying down the boundaries of the production areas for these surveys'
  type: main
- language: fr
  script: Latn
  content: '87/228/CEE: Décision de la Commission du 16 mars 1987 modifiant le décision
    77/144/CEE établissant le code et les règles relatifs à la transcription sous
    une forme lisible par machine des données des enquêtes sur les plantations de
    certaines espèces d''arbres fruitiers et fixant les limites des zones de production
    pour ces enquêtes'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 16. März 1987 zur Änderung der Entscheidung
    77/144/EWG bezüglich der Festlegung eines Standardkodes und einer Regelung zur
    Übertragung der Erhebungsdaten über Anlagen gewisser Obstarten in maschinenlesbare
    Form und zur Festsetzung der Abgrenzung der Produktionszonen (87/228/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 16. marts 1987 om ændring af beslutning 77/144/EØF
    om fastsættelse af den standardkode og de regler, der gælder for omskrivning
    til maskinlæsbar form af resultaterne af undersøgelserne af plantager med visse
    arter af frugttræer og om fastsættelse af grænserne for produktionszonerne
    med henblik på disse undersøgelser (87/228/EØF) #'
  type: main
- language: el
  script: Grek
  content: '87/228/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Μαρτίου 1987 περί τροποποίησης της απόφασης
    77/144/ΕΟΚ που θεσπίζει τον κώδικα και τους πρότυπους
    κανόνες σχετικά με την μεταγραφή σε μορφή αναγνώσιμη
    από μηχανογραφική μονάδα των στοιχείων των
    ερευνών σχετικά με τις φυτείες ορισμένων ειδών
    οπωροφόρων δέντρων· η απόφαση αυτή καθορίζει
    επίσης και τα όρια των ζωνών παραγωγής γι αυτές
    τις έρευνες'
  type: main
- language: fi
  script: Latn
  content: '87/228/ETY: Komission päätös, tehty 16 päivänä maaliskuuta 1987,
    standardikoodista ja -säännöistä, jotka koskevat tiettyjen hedelmälajien
    viljelmiä koskevien tietojen keruun tulosten siirtoa koneellisesti luettavaan
    muotoon, sekä tuotantoalueiden rajoista tätä tietojen keruuta varten tehdyn
    päätöksen 77/144/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 16 marzo 1987 che modifica la decisione
    77/144/CEE che stabilisce il codice standard e le norme per la trascrizione in
    una forma che si presti alla lettura meccanografica dei risultati delle indagini
    sulle piantagioni di alcune specie di alberi da frutto, nonché le delimitazioni
    delle zone di produzione per queste indagini (87/228/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 16 maart 1987 tot wijziging van Beschikking
    77/144/EEG houdende de standaardcode en de voorschriften voor de transcriptie
    in voor de machine leesbare vorm van de gegevens uit de statistische enquêtes,
    ten einde het produktiepotentieel van bepaalde soorten fruitbomen vast te stellen,
    en om de grenzen van de produktiegebieden voor deze enquêtes vast te stellen
    (87/228/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '87/228/CEE: Decisão da Comissão de 16 de Março de 1987 que altera a
    Decisão 77/144/CEE que estabelece o código e as regras-tipo relativas à transcrição
    em forma legível por máquina dos dados dos inquéritos sobre as plantações
    de certas espécies de árvores de fruto e que fixa os limites das zonas de produção
    para estes inquéritos'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 16 de marzo de 1987 por la que se modifica
    la Decisión 77/144/CEE en la que se establece el código y las normas tipo relativas
    a la transcripción en forma legible por máquina de los datos de las encuestas
    sobre las plantaciones de determinadas especies de árboles frutales y por la
    que se determinan los límites de las zonas de producción para dichas encuestas
    (87/228/CEE) #'
  type: main
- language: sv
  script: Latn
  content: '87/228/EEG: Kommissionens beslut av den 16 mars 1987 om ändring av beslut
    77/144/EEG om fastställandet av en standardkod och bestämmelser för överföring
    till maskinläsbar form av data från de statistiska undersökningarna av odlingar
    med vissa slag av fruktträd samt om fastställandet av gränserna för produktionsområdena
    vid dessa undersökningar'
  type: main
