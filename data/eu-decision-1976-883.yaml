---
id: EUDecision1976883
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 1 October 1976 authorizing the French Republic not
    to apply Community treatment to woven fabrics of synthetic textile fibres (discontinuous
    or waste) falling within subheading 56.07 A of the Common Customs Tariff, originating
    in Thailand and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/883/CEE: Décision de la Commission, du 1er octobre 1976, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues de la sous-position 56.07 A du Tarif
    douanier commun, originaires de Thaïlande et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Oktober 1976, mit der die Französische
    Republik ermächtigt wird, aus Thailand stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern der Tarifstelle
    56.07 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 1. oktober 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af korte kemofibre
    eller af affald af kemofibre, som henhører under pos. 56.07 A i den fælles toldtarif,
    har oprindelse i Thailand og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 ottobre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    in fiocco della sottovoce 56.07 A della tariffa doganale comune, originari della
    Tailandia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 oktober 1976 waarbij de Franse Republiek
    wordt gemachtigd weefsels van synthetische stapelvezels, van postonderverdeling
    56.07 A van het gemeenschappelijk douanetarief, van oorsprong uit Thailand en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
