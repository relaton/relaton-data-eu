title:
- language: en
  script: Latn
  content: Regulation (EEC) No 204/69 of the Council of 28 January 1969 laying down
    general rules for granting export refunds on certain agricultural products exported
    in the form of goods not covered by Annex II to the Treaty, and the criteria for
    fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 204/69 du Conseil, du 28 janvier 1969, établissant,
    pour certains produits agricoles exportés sous forme de marchandises ne relevant
    pas de l' annexe II du traité, les règles générales relatives à l' octroi
    des restitutions à l' exportation et les critères de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 204/69 des Rates vom 28. Januar 1969 zur Festlegung
    der allgemeinen Regeln für die Gewährung von Ausfuhrerstattungen und der Kriterien
    zur Festsetzung des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt
    werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 204/69 af 28. januar 1969 om fastsættelse
    af almindelige regler for ydelse af eksportrestitutioner og om fastlæggelse af
    kriterierne for fastsættelse af restitutionsbeløbet for visse landbrugsprodukter,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 204/69 del Consiglio, del 28 gennaio 1969, che stabilisce,
    per taluni prodotti esportati sotto forma di merci non comprese nell' allegato
    II del trattato, le regole generali relative alla concessione delle restituzioni
    all' esportazione e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 204/69 van de Raad van 28 januari 1969 tot vaststelling
    van de algemene regels aangaande de toekenning van restituties bij uitvoer en
    de criteria voor de vaststelling van het restitutiebedrag betreffende bepaalde
    landbouwprodukten, uitgevoerd in de vorm van goederen die niet onder bijlage II
    van het Verdrag vallen
  type: main
