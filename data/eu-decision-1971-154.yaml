title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 mars 1971, autorisant la République
    française à exclure du traitement communautaire les animaux vivants de l'espèce
    ovine, position 01.04 A I B) du Tarif douanier commun et la viande ovine de la
    position 02.01 A Ex IV du Tarif douanier commun, originaires des pays tiers et
    mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/154/EWG: Entscheidung der Kommission vom 23. März 1971, mit der die
    Französische Republik ermächtigt wird, lebende Schafe der Tarifnummer 01.04
    A I b) des Gemeinsamen Zolltarifs und Fleisch von Schafen der Tarifnummer 02.01
    A ex IV des Gemeinsamen Zolltarifs mit Ursprung in dritten Ländern, die sich
    in den anderen Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/154/CEE: Decisione della Commissione, del 23 marzo 1971, con cui si
    autorizza la Repubblica francese ad escludere dal trattamento comunitario gli
    animali vivi della specie ovina (voce della tariffa doganale comune 01.04 A I
    b) e la carne ovina (voce della tariffa doganale comune 02.01 A ex IV), originari
    dei paesi terzi e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/154/EEG: Beschikking van de Commissie van 23 maart 1971 waarbij de
    Franse Republiek wordt gemachtigd levende schapen van post 01.04 A I b) van het
    gemeenschappelijk douanetarief en schapenvlees van post 02.01 A ex IV van het
    gemeenschappelijk douanetarief, van oorsprong uit derde landen en in andere Lid-Staten
    in het vrije verkeer gebracht van de communautaire behandeling uit te sluiten'
  type: main
