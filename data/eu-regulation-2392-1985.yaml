title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2392/85 of 22 August 1985 re-establishing
    the levying of the customs duties on other fishing requisites falling within subheading
    97.07 B originating in South Korea to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2392/85 de la Commission du 22 août 1985 portant rétablissement
    de la perception des droits de douane applicables aux autres articles pour la
    pêche, de la sous-position 97.07 B du tarif douanier commun, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2392/85 der Kommission vom 22. August 1985 zur Wiedereinführung
    der Erhebung der Zölle für andere Fischgeräte der Tarifstelle 97.07 B des Gemeinsamen
    Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2392/85 af 22. august 1985 om genindførelse
    af opkrævning af told for andre fiskegrejer til fiskeri, henhørende under pos.
    97.07 B og med oprindelse i Sydkorea, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2392/85 της Επιτροπής
    της 2ας Αυγούστου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για άλλα είδη αλιείας της
    δασμολογικής διάκρισης 97.07 Β του Κοινού Δασμολογίου,
    καταγωγής Νοτίου Κορέας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2392/85 della Commissione del 22 agosto 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad altri oggetti per la pesca della
    sottovoce 97.07 B della tariffa doganale comune, originari della Corea del Sud
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2392/85 van de Commissie van 22 augustus 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere hengelbenodigdheden
    van postonderverdeling 97.07 B, van oorsprong uit Zuid-Korea, waarvoor de in Verordening
    (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
