title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1586/97 of 29 July 1997 laying down detailed
    implementing rules for the use of set-aside land for the provision of materials
    for the manufacture within the Community of products not primarily intended for
    human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1586/97 de la Commission du 29 juillet 1997 portant
    modalités d'application relatives à l'utilisation des terres mises en jachère
    pour la production de matières premières servant à la fabrication, dans la
    Communauté, de produits destinés à des fins principales autres que la consommation
    humaine ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1586/97 der Kommission vom 29. Juli 1997 mit Durchführungsbestimmungen
    für die Nutzung stillgelegter Flächen für die Erzeugung von Ausgangserzeugnissen,
    die in der Gemeinschaft zu nicht in erster Linie für Lebens- oder Futtermittelzwecke
    bestimmten Erzeugnissen verarbeitet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1586/97 af 29. juli 1997 om gennemførelsesbestemmelser
    for anvendelse af udtagne landbrugsarealer med henblik på tilvejebringelse af
    materialer til fremstilling i Fællesskabet af produkter, som ikke primært er
    bestemt til konsum eller foderbrug
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1586/97 της Επιτροπής
    της 29ης Ιουλίου 1997 περί λεπτομερών κανόνων
    σχετικά με τη χρήση των γαιών που βρίσκονται
    υπό καθεστώς προσωρινής παύσης καλλιέργειας
    για την παραγωγή υλών που χρησιμεύουν κατά
    την παρασκευή, εντός της Κοινότητας, προϊόντων
    τα οποία δεν προορίζονται καταρχήν για κατανάλωση
    από τον άνθρωπο ή τα ζώα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1586/97, annettu 29 päivänä heinäkuuta 1997,
    kesannoidun maan käyttöä koskevista yksityiskohtaisista soveltamissäännöistä
    sellaisten raaka-aineiden tuottamisen osalta, jotka käytetään yhteisössä
    ensisijaisesti muuhun tarkoitukseen kuin ihmisten tai eläinten ravinnoksi tarkoitettujen
    tuotteiden valmistukseen
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1586/97 della Commissione del 29 luglio 1997 recante
    modalità d'applicazione relative all'uso di superfici ritirate dalla produzione
    allo scopo di ottenere materiali per la fabbricazione, nella Comunità, di prodotti
    non destinati in primo luogo al consumo umano o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1586/97 van de Commissie van 29 juli 1997 tot vaststelling
    van uitvoeringsbepalingen betreffende het gebruik van uit productie genomen grond
    voor de productie van grondstoffen voor de vervaardiging, in de Gemeenschap, van
    niet specifiek voor voeding of vervoedering bestemde producten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1586/97 da Comissão de 29 de Julho de 1997 que estabelece
    normas de execução para a utilização de terras retiradas para a produção
    de matérias destinadas ao fabrico, na Comunidade, de produtos não destinados
    primariamente ao consumo humano ou animal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1586/97 de la Comisión de 29 de julio de 1997 por
    el que se establecen disposiciones de aplicación relativas a la utilización
    de las tierras retiradas de la producción con vistas a la obtención de materias
    para la fabricación en la Comunidad de productos que no se destinen principalmente
    al consumo humano o animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1586/97 av den 29 juli 1997 om genomförandebestämmelser
