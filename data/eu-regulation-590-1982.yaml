title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 590/82 of 15 March 1982 re-establishing
    the levying of customs duties on handkerchiefs, products of category 89 (code
    0890), originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 590/82 de la Commission, du 15 mars 1982, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, de la catégorie 89 (code 0890), originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 590/82 der Kommission vom 15. März 1982 über die
    Wiedereinführung des Zollsatzes für Taschentücher der Warenkategorie Nr. 89
    (Kennziffer 0890), mit Ursprung in China, dem die in der Verordnung (EWG) Nr.
    3602/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 590/82 af 15. marts 1982 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, under kategori 89 (kode 0890),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 590/82 τής Επιτροπής τής
    15ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά ρινόμακτρα καί μανδηλάκια
    θυλακίου, τών προϊόντων τής κατηγορίας 89 (κώδικας
    0890), καταγωγής Κίνας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (EOK) αριθ. 3602/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 590/82 della Commissione, del 15 marzo 1982, che ripristina
    la riscossione dei dazi doganali applicabili ai fazzoletti da naso e da taschino,
    della categoria di prodotti n. 89 (codice 0890), originari della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3602/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 590/82 van de Commissie van 15 maart 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken
    van categorie van produkten 89 (codenummer 0890), van oorsprong uit China, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3602/81
    van de Raad
  type: main
