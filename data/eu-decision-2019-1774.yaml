  script: Latn
  content: Commission Implementing Decision (EU) 2019/1774 of 23 October 2019 amending
    Annex I to Decision 2012/137/EU as regards the inclusion of the United Kingdom
    of Great Britain and Northern Ireland in the list of third countries or parts
