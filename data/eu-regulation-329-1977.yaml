  content: Council Regulation (EEC) No 329/77 of 14 February 1977 amending Regulations
    (EEC) No 1464/76 and (EEC) No 1465/76 on the opening, allocation and administration
    of Community tariff quotas for rum, arrack and tafia falling within subheading
    22.09 C I of the Common Customs Tariff and originating in the ACP States and the
    overseas countries and territories associated with the European Economic Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 329/77 du Conseil, du 14 février 1977, portant modification
    des règlements (CEE) n° 1464/76 et n° 1465/76 portant ouverture, répartition
    et mode de gestion des contingents tarifaires communautaires pour le rhum, l'arak
    et le tafia, relevant de la sous-position 22.09 C I du tarif douanier commun,
    originaires des États ACP et des pays et territoires d'outre-mer associés à
    la Communauté économique européenne
  type: main
