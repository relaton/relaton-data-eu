  content: Commission Regulation (EEC) No 1310/86 of 2 May 1986 re-establishing the
    levying of customs duties on gelatin and gelatin derivatives, falling within subheading
    35.03 ex B, originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
