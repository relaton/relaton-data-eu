title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1197/80 of 12 May 1980 re-establishing the
    levying of customs duties on umbrellas and sunshades, falling within heading No
    66.01 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1197/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, de la position 66.01 du tarif douanier commun, originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1197/80 der Kommission vom 12. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme der Tarifnummer 66.01, mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1197/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller, under pos 66.01, som
    har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1197/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia
    e da sole), della voce 66.01 della tariffa doganale comune, originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1197/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op paraplu'
    s en parasols, van post 66.01, van oorsprong uit Zuid-Korea, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
