title:
- language: en
  script: Latn
  content: '80/913/EEC: Commission Decision of 13 August 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''pyjamas knitted or crocheted,
    of cotton or of synthetic textile fibres, falling within heading No ex 60.04 B
    IV of the Common Customs Tariff (category 24), originating in Poland and in free
    circulation in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/913/CEE: Décision de la Commission, du 13 août 1980, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pyjamas de bonneterie, de coton ou
    de fibres textiles synthétiques, pour hommes et garçonnets, de la sous-position
    ex 60.04 B IV du tarif douanier commun (catégorie 24), originaires de Pologne
    et mis en libre pratique dans les autres États membres (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/913/EWG: Entscheidung der Kommission vom 13. August 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Polen stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Schlafanzüge aus Gewirken, aus Baumwolle oder aus
    synthetischen Spinnstoffen, für Männer und Knaben, der Tarifstelle ex 60.04
    B IV des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/913/EØF: Kommissionens beslutning af 13. august 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage pyjamas af trikotage, bomuld eller syntetiske
    fibre, til mænd og drenge, som henhører under pos. ex 60.04 B IV i den fælles
    toldtarif (kategori 24), har oprindelse i Polen og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/913/CEE: Decisione della Commissione, del 13 agosto 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i pigiami a maglia, di cotone o di fibre
    tessili sintetiche, per uomo e per ragazzo, della sottovoce ex 60.04 B IV della
    tariffa doganale comune, categoria 24, originari della Polonia e messi in libera
    pratica negli altri Stati membri (Il testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/913/EEG: Beschikking van de Commissie van 13 augustus 1980 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd pyjama''s van brei- of haakwerk, van katoen of van synthetische
    textielvezels, voor heren en jongens, van post ex 60.04 B IV van het gemeenschappelijk
    douanetarief (categorie 24), van oorsprong uit Polen en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
