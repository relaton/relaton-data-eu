    vastaste kaitsemeetmete kohta loomadel ja loomsetel saadustel toidu kaudu saadavate
    nakkushaiguste ja mürgistuste vältimiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 97/22/EY, annettu 22 päivänä huhtikuuta 1997, tiettyjä
    eläimissä ja eläinperäisissä tuotteissa esiintyviä zoonooseja ja zoonoosien
    aiheuttajia koskevista suojatoimenpiteistä elintarvikkeista aiheutuvien tartunta-
    ja myrkytyspesäkkeiden ehkäisemiseksi annetun direktiivin 92/117/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 97/22/EK irányelve (1997. április 22.) az élelmiszerből származó
