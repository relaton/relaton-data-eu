    1997 περί τροποποιήσεως της οδηγίας 92/117/ΕΟΚ για
    τα μέτρα προστασίας από ορισμένες ζωονόσους
    και ορισμένους ζωονοσογόνους παράγοντες στα
    ζώα και τα προϊόντα ζωικής προέλευσης, προκειμένου
    να αποφευχθούν οι εστίες λοιμώξεων και δηλητηριάσεων
    που οφείλονται στα τρόφιμα
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 97/22/EMÜ, 22. aprill 1997, millega muudetakse direktiivi
