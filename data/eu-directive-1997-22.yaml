  script: Latn
  content: Richtlijn 97/22/EG van de Raad van 22 april 1997 tot wijziging van Richtlijn
    92/117/EEG inzake maatregelen voor de bescherming tegen bepaalde zoönoses en
    bepaalde zoönoseverwekkers bij dieren en in producten van dierlijke oorsprong
    ten einde door voedsel overgedragen infecties en vergiftigingen te voorkomen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 97/22/WE z dnia 22 kwietnia 1997 r. zmieniająca dyrektywę
    92/117/EWG dotyczącą środków ochrony przed określonymi chorobami odzwierzęcymi
    i odzwierzęcymi czynnikami chorobotwórczymi u zwierząt i w produktach pochodzenia
    zwierzęcego, w celu zapobieżenia zakażeniom i zatruciom przenoszonym przez
    żywność
  type: main
- language: pt
  script: Latn
  content: Directiva 97/22/CE do Conselho de 22 de Abril de 1997 que altera a Directiva
    92/117/CEE relativa às medidas de protecção contra zoonoses e certos agentes
    zoonóticos em animais e produtos de origem animal a fim de evitar focos de infecção
    e de intoxicação de origem alimentar
  type: main
- language: sk
  script: Latn
  content: Smernica Rady č. 97/22/ES z 22. apríla 1997, ktorá mení a dopĺňa
