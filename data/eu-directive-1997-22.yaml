    zoonosis y determinados agentes productores de zoonosis en animales y productos
    de origen animal, a fin de evitar el brote de infecciones e intoxicaciones procedentes
    de los alimentos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 97/22/EG av den 22 april 1997 om ändring av direktiv
    92/117/EEG om skyddsåtgärder mot specifika zoonoser och zoonotiska agenser hos
    djur och animaliska produkter för att förhindra utbrott av livsmedelsburna infektioner
    och förgiftningar
