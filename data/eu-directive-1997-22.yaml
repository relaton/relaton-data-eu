title:
- language: en
  script: Latn
  content: Council Directive 97/22/EC of 22 April 1997 amending Directive 92/117/EEC
    concerning measures for protection against specified zoonoses and specified zoonotic
    agents in animals and products of animal origin in order to prevent outbreaks
    of food-borne infections and intoxications
  type: main
- language: fr
  script: Latn
  content: Directive 97/22/CE du Conseil du 22 avril 1997 modifiant la directive 92/117/CEE
    concernant les mesures de protection contre certaines zoonoses et certains agents
    zoonotiques chez des animaux et dans les produits d'origine animale, en vue de
    prévenir les foyers d'infection et d'intoxication dus à des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/22/EG des Rates vom 22. April 1997 zur Änderung der Richtlinie
    92/117/EWG über Maßnahmen zum Schutz gegen bestimmte Zoonosen bzw. ihre Erreger
    bei Tieren und Erzeugnissen tierischen Ursprungs zur Verhütung lebensmittelbedingter
    Infektionen und Vergiftungen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 97/22/ES ze dne 22. dubna 1997, kterou se mění směrnice
