    a špecifickým zástupcom vyvolávajúcich zoonózy u zvierat a v produktoch
    živočíšneho pôvodu na predchádzanie infekcií a otráv
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 97/22/ES z dne 22. aprila 1997 o spremembi Direktive 92/117/EGS
