    původcům zoonóz u zvířat a v produktech živočišného původu se zaměřením
    na předcházení ohniskům infekce a otravám z potravin
  type: main
- language: da
  script: Latn
  content: Rådets Direktiv 97/22/EF af 22. april 1997 om ændring af direktiv 92/117/EØF
