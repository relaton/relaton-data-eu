title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2332/85 of 14 August 1985 re-establishing
    the levying of customs duties on camphor, natural refined and synthetic falling
    within subheading 29.13 B I b) and originating in China to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2332/85 de la Commission du 14 août 1985 portant rétablissement
    de la perception des droits de douane applicables au camphre, naturel, raffiné
    et synthétique de la sous-position 29.13 B I b) du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2332/85 der Kommission vom 14. August 1985 zur Wiedereinführung
    der Erhebung der Zölle für Kampfer, natürlicher, raffiniert, sowie synthetischer,
    der Tarifstelle 29.13 B I b) des Gemeinsamen Zolltarifs mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2332/85 af 14. august 1985 om genindførelse
    af opkrævning af told for campher, raffineret, naturlig og syntetisk, henhørende
    under pos. 29.13 B I b) og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2332/85 της Επιτροπής
    της 14ης Αυγούστου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για την καμφορά, φυσική,
    καθαρή και συνθετική, της δασμολογικής διάκρισης
    29.13 Β Ι β), καταγωγής Κίνας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2332/85 della Commissione del 14 agosto 1985 che ripristina
    la riscossione dei dazi doganali applicabili alla canfora, naturale, raffinata
    e sintetica, della sottovoce doganale 29.13 B I b), originaria della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2332/85 van de Commissie van 14 augustus 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kamfer, natuurlijke,
    andere dan ruwe, alsmede synthetische van postonderverdeling 29.13 B I b), van
    oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
