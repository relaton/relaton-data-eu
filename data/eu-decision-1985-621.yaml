title:
- language: en
  script: Latn
  content: '85/621/EEC: Commission Decision of 13 December 1985 amending, because
    of the accession of Spain and Portugal, Decision 80/765/EEC laying down a code
    and standard rules for the transcription into machine-readable form of the data
    relating to intermediate statistical surveys of areas under vines'
  type: main
- language: fr
  script: Latn
  content: '85/621/CEE: Décision de la Commission du 13 décembre 1985 modifiant
    en raison de l''adhésion de l''Espagne et du Portugal la décision 80/765/CEE
    établissant le code et les règles types relatifs à la transcription sous une
    forme lisible par machine des données des enquêtes statistiques intermédiaires
    sur les superficies viticoles'
  type: main
- language: de
  script: Latn
  content: '85/621/EWG: Entscheidung der Kommission vom 13. Dezember 1985 zur Änderung
    nach dem Beitritt Spaniens und Portugals der Entscheidung 80/765/EWG zur Festlegung
    eines Kodes und einer Standardregelung zur Übertragung der Ergebnisse betreffend
    die Zwischenerhebungen über Rebflächen in maschinenlesbare Form'
  type: main
- language: da
  script: Latn
  content: '85/621/EØF: Kommissionens beslutning af 13. december 1985 om ændring
    af beslutning 80/765/EØF om fastsættelse af kode- og standardregler for overførsel
    i maskinlæsbar form af resultaterne fra de statistiske mellemundersøgelser af
    vinarealerne på grund af Spaniens og Portugals tiltrædelse'
  type: main
- language: el
  script: Grek
  content: '85/621/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Δεκμβρίου 1985 περί τροποποίησης, λόγω ένταξης
    της Ισπανίας και Πορτογαλίας, της απόφασης
    80/765/ΕΟΚ, η οποία καθορίζει των κώδικα και τους
    πρότυπους κανονισμούς σχετικά με τη μεταγραφή
    σε μορφή αναγνώσιμη από ηλεκτρονικό υπολογιστή,
    των δεδομένων των βασικών ερευνών σχετικά
    με τις αμπελουργικές εκτάσεις'
  type: main
- language: fi
  script: Latn
  content: '85/621/ETY: Komission päätös, tehty 13 päivänä joulukuuta 1985,
    viininviljelyalojen välitutkimusten tulosten siirtoa koneellisesti luettavaan
    muotoon koskevista standardikoodista ja -säännöistä tehdyn päätöksen 80/765/ETY
    muuttamisesta Espanjan ja Portugalin liittymisen johdosta'
  type: main
- language: it
  script: Latn
  content: '85/621/CEE: Decisione della Commissione del 13 dicembre 1985 che modifica,
    a motivo dell''adesione della Spagna e del Portogallo, la decisione 80/765/CEE
    che fissa il codice e le norme tipo riguardanti la trascrizione in una forma suscettibile
    di lettura meccanica dei dati concernenti le indagini statistiche intermedie sulle
    superfici viticole'
  type: main
- language: nl
  script: Latn
  content: '85/621/EEG: Beschikking van de Commissie van 13 december 1985 tot wijziging,
    wegens de toetreding van Spanje en Portugal, van Beschikking 80/765/EEG houdende
    vaststelling van de code en de standaardvoorschriften voor het inzenden in een
    voor de machine leesbare vorm van de gegevens van de tussentijdse statistische
    enquêtes naar de wijnbouwoppervlakten'
  type: main
- language: pt
  script: Latn
  content: '85/621/CEE: Decisão da Comissão, de 13 de Dezembro de 1985, que altera,
