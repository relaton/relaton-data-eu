id: EUDecision1999842
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/842/EC: Commission Decision of 30 November 1999 amending Decision
    96/301/EC and authorising Member States temporarily to take emergency measures
    against the dissemination of Pseudomonas solanacearum (Smith) Smith as regards
    Egypt (notified under document number C(1999) 3980)'
  type: main
- language: fr
  script: Latn
  content: '1999/842/CE: Décision de la Commission, du 30 novembre 1999, portant
    modification de la décision 96/301/CE et autorisant les États membres à prendre
    provisoirement des mesures d''urgence en vue de se protéger contre la propagation
    de Pseudomonas solanacearum (Smith) Smith en provenance d''Égypte [notifiée
    sous le numéro C(1999) 3980]'
  type: main
- language: de
  script: Latn
  content: '1999/842/EG: Entscheidung der Kommission vom 30. November 1999 zur Änderung
    der Entscheidung 96/301/EG und zur Ermächtigung der Mitgliedstaaten, vorübergehend
    gegen die Verbreitung von Pseudomonas solanacearum (Smith) Smith befristete Sofortmaßnahmen
    gegenüber Ägypten zu treffen (Bekanntgegeben unter Aktenzeichen K(1999) 3980)'
  type: main
- language: da
  script: Latn
  content: '1999/842/EF: Kommissionens beslutning af 30. november 1999 om ændring
    af beslutning 96/301/EF og om bemyndigelse af medlemsstaterne til midlertidigt
    at træffe hasteforanstaltninger mod spredning af Pseudomonas solanacearum (Smith)
    Smith, for så vidt angår Egypten (meddelt under nummer K(1999) 3980)'
  type: main
- language: el
  script: Grek
  content: '1999/842/ΕΚ: Απόφαση της Επιτροπής, της 30ής
    Νοεμβρίου 1999, με την οποία τροποποιείται η
    απόφαση 96/301/ΕΚ και επιτρέπεται προσωρινά στα
    κράτη μέλη να λάβουν κατεπείγοντα μέτρα κατά
    της εξάπλωσης της Pseudomonas solanacearum (Smith) Smith όσον
    αφορά την Αίγυπτο [κοινοποιηθείσα υπό τον αριθμό
    Ε(1999) 3980]'
  type: main
- language: fi
  script: Latn
  content: '1999/842/EY: Komission päätös, tehty 30 päivänä marraskuuta 1999,
    päätöksen 96/301/EY muuttamisesta ja luvan antamisesta jäsenvaltioille toteuttaa
    väliaikaisesti Egyptiä koskevia kiireellisiä toimenpiteitä Pseudomonas solanacearum
    (Smith) Smith -taudinaiheuttajan leviämisen estämiseksi (tiedoksiannettu numerolla
    K(1999) 3980)'
  type: main
- language: it
  script: Latn
  content: '1999/842/CE: Decisione della Commissione, del 30 novembre 1999, che modifica
    la decisione 96/301/CE e che autorizza gli Stati membri ad adottare, a titolo
    provvisorio, misure d''emergenza contro la propagazione dello Pseudomonas solanacearum
    (Smith) Smith per quanto riguarda l''Egitto [notificata con il numero C(1999)
    3980]'
  type: main
- language: nl
  script: Latn
  content: '1999/842/EG: Beschikking van de Commissie van 30 november 1999 tot wijziging
    van Beschikking 96/301/EG en tot machtiging van de lidstaten om ten aanzien van
    Egypte tijdelijk spoedmaatregelen te nemen tegen de verspreiding van Pseudomonas
    solanacearum (Smith) Smith (kennisgeving geschied onder nummer C(1999) 3980)'
  type: main
- language: pt
  script: Latn
  content: '1999/842/CE: Decisão da Comissão, de 30 de Novembro de 1999, que altera
    a Decisão 96/301/CE e autoriza os Estados-Membros a adoptar provisoriamente medidas
    de emergência contra a propagação de Pseudomonas solanacearum (Smith) Smith
    no que respeita ao Egipto [notificada com o número C(1999) 3980]'
  type: main
- language: es
  script: Latn
  content: '1999/842/CE: Decisión de la Comisión, de 30 de noviembre de 1999, por
    la que se modifica la Decisión 96/301/CE y se autoriza a los Estados miembros
    a adoptar, con carácter temporal, medidas de emergencia contra la propagación
    de Pseudomonas solanacearum (Smith) Smith, con respecto a Egipto [notificada con
    el número C(1999) 3980]'
  type: main
- language: sv
  script: Latn
  content: '1999/842/EG: Kommissionens beslut av den 30 november 1999 om ändring
    av beslut 96/301/EG om tillstånd för medlemsstaterna att tillfälligt vidta
    nödåtgärder för att förhindra spridning av Pseudomonas solanacearum (Smith)
    Smith från Egypten [delgivet med nr K(1999) 3980]'
