title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1992/74 of the Commission of 29 July 1974 re-establishing
    the levying of the customs duties on locks and padlocks, etc., falling within
    heading No 83.01, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1992/74 de la Commission, du 29 juillet 1974, portant
    rétablissement de la perception des droits de douane applicables aux serrures
    verrous, etc., de la position tarifaire 83.01 originaires de Hong-Kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1992/74 der Kommission vom 29. Juli 1974 zur Wiedereinführung
    des Zollsatzes für Schlösser, Sicherheitsriegel usw. ..., der Tarifnummer 83.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1992/74 af 29. juli 1974 om genindførelse
    af opkrævning af toldafgifter for nøglelåse og dele dertil, etc., under position
    83.01, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1992/74 della Commissione, del 29 luglio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle serrature, catenacci,
    ecc., della voce doganale n. 83.01, originari di Hong Kong, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1992/74 van de Commissie van 29 juli 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op sloten, grendelsloten
    enz., van post 83.01, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
