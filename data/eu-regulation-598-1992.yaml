title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 598/92 of 9 March 1992 establishing a list
    of products excluded from the application of Council Regulation (EEC) No 737/90
    on the conditions governing imports of agricultural products originating in third
    countries following the accident at the Chernobyl nuclear power station
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 598/92 de la Commission du 9 mars 1992 établissant
    une liste de produits exclus du champ d'application du règlement (CEE) n° 737/90
    du Conseil relatif aux conditions d'importation de produits agricoles originaires
    des pays tiers à la suite de l'accident survenu à la centrale nucléaire de
    Tchernobyl
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 598/92 DER KOMMISSION vom 9. März 1992 zur Festlegung
    einer Liste von Erzeugnissen, die von der Durchführung der Verordnung (EWG) Nr.
    737/90 des Rates über die Einfuhrbedingungen für landwirtschaftliche Erzeugnisse
    mit Ursprung in Drittländern nach dem Unfall im Kernkraftwerk Tschernobyl ausgenommen
    sind #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 598/92 af 9. marts 1992 indeholdende
    en fortegnelse over produkter, der undtages fra Rådets forordning (EØF) nr.
    737/90 om betingelser for indførsel af landbrugsprodukter med oprindelse i tredjelande
    som følge af ulykken på kernekraftværket i Tjernobyl #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 598/92 της Επιτροπής
    της 9ης Μαρτίου 1992 για την κατάρτιση καταλόγου
    προϊόντων που εξαιρούνται από το πεδίο εφαρμογής
    του κανονισμού ( ΕΟΚ ) αριθ. 737/90 σχετικά με τους
    όρους που διέπουν τις εισαγωγές γεωργικών
    προϊόντων που προέρχονται από τρίτες χώρες
    μετά το ατύχημα στον πυρηνικό σταθμό ηλεκτροπαραγωγής
    του Chernobyl
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 598/92 DELLA COMMISSIONE del 9 marzo 1992 che stabilisce
    un elenco di prodotti esclusi dal campo di applicazione del regolamento (CEE)
    n. 737/90 del Consiglio relativo alle condizioni d'' importazione di prodotti
    agricoli originari dai paesi terzi in seguito all'' incidente intervenuto nella
    centrale nucleare di Cernobil #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 598/92 VAN DE COMMISSIE van 9 maart 1992 tot vaststelling
    van een lijst van produkten die zijn uitgesloten van Verordening (EEG) nr. 737/90
    van de Raad betreffende de voorwaarden voor de invoer van landbouwprodukten van
    oorsprong uit derde landen ingevolge het ongeluk in de kerncentrale van Tsjernobyl
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 598/92 DA COMISSÃO de 9 de Março de 1992 que estabelece
    uma lista de produtos excluídos do âmbito de aplicação do Regulamento (CEE)
    no 737/90 do Conselho, relativo às condições de importação de produtos agrícolas
    originários de países terceiros na sequência do acidente ocorrido na central
    nuclear de Chernobyl #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 598/92 DE LA COMISIÓN de 9 de marzo de 1992 por el
    que se establece una lista de productos excluidos de la aplicación del Reglamento
    (CEE) no 737/90 relativo a las condiciones de importación de productos agrícolas
    originarios de países terceros como consecuencia del accidente ocurrido en la
    central nuclear de Chernobil #'
