title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1125/79 of 7 June 1979 re-establishing the
    levying of customs duties on yarn of combed sheep' s or lambs' wool (worsted yarn),
    not put up for retail sale, falling within heading No 53.07, originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1125/79 de la Commission, du 7 juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine peignée, non conditionnés pour la vente au détail, de la position 53.07
    du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1125/79 der Kommission vom 7. Juni 1979 über die
    Wiedereinführung des Zollsatzes für Kammgarne aus Wolle, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 53.07, mit Ursprung in Südkorea, dem
    die in der Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1125/79 af 7. juni 1979 om genindførelse
    af opkrævning af toldafgifter for garn af kæmmet uld (kamgarn), ikke i detailsalgsoplægning,
    under pos. 53.07, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1125/79 della Commissione, del 7 giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana pettinata,
    non preparati per la vendita al minuto, della voce doganale 53.07, originari della
    Corea del Sud beneficiaria delle preferenze tariffarie previste del regolamento
    (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1125/79 van de Commissie van 7 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kamgaren
    van wol, niet gereed voor de verkoop in het klein, van post 53.07, van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3157/78 van de Raad
  type: main
