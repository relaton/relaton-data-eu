    im Hinblick auf eine etwaige Aufnahme von Kaliumphosphit, Acequinocyl und Cyflufenamid
    in Anhang I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von
    Pflanzenschutzmitteln eingereicht wurden (Text von Bedeutung für den EWR) (Bekannt
    gegeben unter Aktenzeichen K(2003) 3128)'
  type: main
