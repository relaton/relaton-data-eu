title:
- language: en
  script: Latn
  content: '2003/636/EC: Commission Decision of 2 September 2003 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of potassium phosphite, acequinocyl and cyflufenamid in
    Annex I to Council Directive 91/414/EEC concerning the placing of plant-protection
    products on the market (Text with EEA relevance) (notified under document number
    C(2003) 3128)'
  type: main
- language: fr
  script: Latn
  content: '2003/636/CE: Décision de la Commission du 2 septembre 2003 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle du phosphite de potassium, de l''acéquinocyl et
    du cyflufénamid à l''annexe I de la directive 91/414/CEE du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques (Texte présentant de
    l''intérêt pour l''EEE) [notifiée sous le numéro C(2003) 3128]'
  type: main
- language: de
  script: Latn
  content: '2003/636/EG: Entscheidung der Kommission vom 2. September 2003 zur grundsätzlichen
