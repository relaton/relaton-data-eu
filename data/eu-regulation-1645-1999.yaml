title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1645/1999 of 27 July 1999 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the 'Register
    of protected designations of origin and protected geographical indications' provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1645/1999 de la Commission, du 27 juillet 1999, complétant
    l'annexe du règlement (CE) nº 2400/96 relatif à l'inscription de certaines
    dénominations dans le «Registre des appellations d'origine protégées et des
    indications géographiques protégées» prévu au règlement (CEE) nº 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1645/1999 der Kommission vom 27. Juli 1999 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 zur Eintragung bestimmter Bezeichnungen
    in das Verzeichnis der geschützten Ursprungsbezeichnungen und der geschützten
    geographischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß der Verordnung
    (EWG) Nr. 2081/92 des Rates zum Schutz von geographischen Angaben und Ursprungsbezeichnungen
    für Agrarerzeugnisse und Lebensmittel
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1645/1999 на Комисията от 27
    юли 1999 година относно допълнение на приложението
    към Регламент (ЕО) № 2400/96 относно вписването
    на някои означения в „Регистър на защитените
    наименования за произход и на защитените географски
    указания“, предвиден в Регламент (ЕИО) № 2081/92
    на Съвета за защита на географските указания
    и наименованията за произход на селскостопанските
    и хранителни продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1645/1999 ze dne 27. července 1999, kterým
    se doplňuje příloha nařízení (ES) č. 2400/96 o zápisu určitých názvů
    do „Rejstříku chráněných označení původu a chráněných zeměpisných
    označení“ podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných
    označení a označení původu zemědělských produktů a potravin
  type: main
- language: da
  script: Latn
