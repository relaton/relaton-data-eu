    suojattujen maantieteellisten merkintöjen rekisteriin" annetun asetuksen (EY)
    N:o 2400/96 liitteen täydentämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1645/1999 od 27. srpnja 1999. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu određenih naziva u „Registar zaštićenih oznaka
    izvornosti i zaštićenih oznaka zemljopisnog podrijetla” kako je predviđeno
    u Uredbi Vijeća (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i
    oznaka izvornosti za poljoprivredne i prehrambene proizvode
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1645/1999/EK rendelete (1999. július 27.) egyes neveknek
    a mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben foglalt, az oltalom alatt
    álló földrajzi jelzések és eredetmegjelölések nyilvántartásába való
    bejegyzéséről szóló 2400/96/EK rendelet mellékletének kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1645/1999 della Commissione, del 27 luglio 1999, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel «Registro delle denominazioni di origine protette e
    delle indicazioni geografiche protette" di cui al regolamento (CEE) n. 2081/92
    del Consiglio relativo alla protezione delle indicazioni geografiche e delle denominazioni
    di origine dei prodotti agricoli e alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1645/1999 (1999. gada 27. jūlijs), ar ko papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu iekļaušanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kurš paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 27 d. Komisijos reglamentas (EB) Nr. 1645/1999, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Reglamente
    (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų geografinių
    nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų kilmės vietos
    nuorodų ir saugomų geografinių nuorodų registrą“ priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1645/1999 tas-27 ta' Lulju 1999
    li jissupplimenta l-Anness mar-Regolament (KE) Nru 2400/96 dwar id-dħul ta' ċerti
    ismijiet fir-“Reġistru ta’ denominazzjoni protetta ta’ oriġini u indikazzjonijiet
    ġeografiċi protetti” ipprovdut bir-Regolament tal-Kunsill (KEE) Nru 2081/92
    dwar il-protezzjoni ta' l-indikazzjonijiet ġeografiċi u l-ismijiet ta' l-oriġini
    għall-prodotti u l-oġġetti ta' l-ikel agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1645/1999 van de Commissie van 27 juli 1999 tot aanvulling
    van de bijlage bij Verordening (EG) nr. 2400/96 betreffende de inschrijving van
    bepaalde benamingen in het "Register van beschermde oorsprongsbenamingen en beschermde
    geografische aanduidingen" bedoeld in Verordening (EEG) nr. 2081/92 van de Raad
    inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen van
    landbouwproducten en levensmiddelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1645/1999 z dnia 27 czerwca 1999 r. uzupełniające
