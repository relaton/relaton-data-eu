    Βασίλειο να παρατείνει την εφαρμογή μέτρου
    κατά παρέκκλιση από τα άρθρα 6 και 17 της έκτης
    οδηγίας 77/388/ΕΟΚ, για την εναρμόνιση των νομοθεσιών
    των κρατών μελών των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '98/198/EY: Neuvoston päätös, tehty 9 päivänä maaliskuuta 1998, luvan
