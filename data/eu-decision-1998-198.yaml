title:
- language: en
  script: Latn
  content: '98/198/EC: Council Decision of 9 March 1998 authorizing the United Kingdom
    to extend application of a measure derogating from Articles 6 and 17 of the Sixth
    Council Directive (77/388/EEC) on the harmonisation of the laws of the Member
    States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '98/198/CE: Décision du Conseil du 9 mars 1998 autorisant le Royaume-Uni
    à proroger l''application d''une mesure dérogatoire aux articles 6 et 17 de
    la sixième directive (77/388/CEE) en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '98/198/EG: Entscheidung des Rates vom 9. März 1998 zur Ermächtigung
    des Vereinigten Königreichs, die Anwendung einer von den Artikeln 6 und 17 der
    Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten
    über die Umsatzsteuern abweichenden Maßnahme zu verlängern'
  type: main
- language: da
  script: Latn
  content: '98/198/EF: Rådets beslutning af 9. marts 1998 om bemyndigelse til Det
    Forenede Kongerige til at forlænge en foranstaltning, der fraviger bestemmelserne
    i artikel 6 og 17 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '98/198/ΕΚ: Απόφαση του Συμβουλίου της 9ης Μαρτίου
