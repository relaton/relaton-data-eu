    degli Stati membri relative alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '98/198/EG: Beschikking van de Raad van 9 maart 1998 waarbij het Verenigd
    Koninkrijk wordt gemachtigd tot voortzetting van de toepassing van een maatregel
    die afwijkt van de artikelen 6 en 17 van Zesde Richtlijn 77/388/EEG betreffende
    de harmonisatie van de wetgevingen der lidstaten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '98/198/CE: Decisão do Conselho de 9 de Março de 1998 que autoriza o
