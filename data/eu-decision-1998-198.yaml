    yhdenmukaistamisesta annetun kuudennen neuvoston direktiivin 77/388/ETY 6 ja 17
    artiklasta poikkeavan toimenpiteen soveltamista'
  type: main
- language: it
  script: Latn
  content: '98/198/CE: Decisione del Consiglio del 9 marzo 1998 che autorizza il Regno
