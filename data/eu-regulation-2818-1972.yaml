    preferenze tariffarie accordate dalla Comunità economica europea a taluni prodotti
    di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2818/72 van de Commissie van 22 december 1972 betreffende
