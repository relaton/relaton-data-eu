    préférences tarifaires accordées par la Communauté économique européenne
    à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2818/72 der Kommission vom 22. Dezember 1972 über
