title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2697/90 of 20 September 1990 fixing the
    market conversion rates to be applied for certain amounts in the context of the
    common agricultural policy and, in particular, for the calculation of the monetary
    compensatory amounts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2697/90 de la Commission, du 20 septembre 1990, fixant
    les taux de conversion du marché à appliquer pour certains montants dans le
    cadre de la politique agricole commune, et notamment pour le calcul des montants
    compensatoires monétaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2697/90 der Kommission vom 20. September 1990 zur
    Festsetzung der Marktumrechnungskurse, die für bestimmte Beträge im Rahmen der
    gemeinsamen Agrarpolitik, insbesondere für die Berechnung der Währungsausgleichsbeträge,
    angewendet werden müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2697/90 af 20. september 1990 om fastsættelse
    af de markedsomregningskurser, der skal anvendes for visse beløb i forbindelse
    med den fælles landbrugspolitik, navnlig ved beregning af de monetære udligningsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2697/90 της Επιτροπής
    της 20ής Σεπτεμβρίου 1990 για τον καθορισμό των
    ισοτιμιών της αγοράς που θα εφαρμοσθούν σε
    ορισμένα ποσά στο πλαίσιο της κοινής γεωργικής
    πολιτικής και κυρίως για τον υπολογισμό των
    νομισματικών εξισωτικών ποσών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2697/90 della Commissione, del 20 settembre 1990,
    che fissa i tassi di conversione del mercato da applicare a taluni importi nel
    quadro della politica agraria comune, in particolare per il calcolo degli importi
    compensativi monetari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2697/90 van de Commissie van 20 september 1990 tot
    vaststelling van de marktomrekeningskoersen die moeten worden toegepast voor bepaalde
    bedragen in het kader van het gemeenschappelijk landbouwbeleid, en met name voor
    de berekening van de monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2697/90 da Comissão, de 20 de Setembro de 1990,
    que fixa as taxas de conversão do mercado a aplicar em relação a determinados
    montantes no âmbito da política agrícola comum e, nomeadamente, para o cálculo
    dos montantes compensatórios monetários
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2697/90 de la Comisión, de 20 de septiembre de 1990,
    por el que se fijan los tipos de conversión del mercado aplicables a determinados
    importes en el marco de la política agraria común y en particular al cálculo
    de los montantes compensatorios monetarios
  type: main
