title:
- language: en
  script: Latn
  content: '83/133/EEC: Commission Decision of 14 March 1983 authorizing the Italian
    Republic to take intra-Community surveillance measures in respect of imports of
    bananas in certain third countries and put into free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/133/CEE: Décision de la Commission du 14 mars 1983 autorisant la République
    italienne à procéder à une surveillance intracommunautaire des importations
    de bananes originaires de certains pays tiers mises en libre pratique dans les
    autres Etats membres (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/133/EWG: Entscheidung der Kommission vom 14. März 1983 zur Ermächtigung
    der italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von Bananen mit Ursprung in bestimmten dritten Ländern, die sich
    in den übrigen Mitgliedstaaten im freien Verkehr befinden (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/133/EØF: Kommissionens beslutning af 14. marts 1983 om bemyndigelse
    af Den italienske Republik til at føre tilsyn inden for Fællesskabet med indførslen
    af bananer, der har oprindelse i visse tredjelande, og som er overgået til fri
    omsætning i de øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/133/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Μαρτίου 1983 για την παροχή άδειας στην Ιταλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών μπανανών που κατάγονται από
    ορισμένες τρίτες χώρες και τίθενται σε ελεύθερη
    κυκλοφορία στα άλλα Κράτη μέλη (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/133/CEE: Decisione della Commissione del 14 marzo 1983 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di banane originarie di taluni paesi terzi e messe in libera pratica negli altri
    Stati membri (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/133/EEG: Beschikking van de Commissie van 14 maart 1983 waarbij de
    Italiaanse Republiek wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te treffen ten aanzien van de invoer van bananen van oorsprong uit bepaalde derde
    landen en in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst
    in de Italiaanse taal is authentiek)'
  type: main
