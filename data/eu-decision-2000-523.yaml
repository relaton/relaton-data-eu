  script: Latn
  content: '2000/523/EC: Commission Decision of 10 August 2000 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of certain
    malleable cast iron tube or pipe fittings originating in Brazil, Croatia, the
    Czech Republic, the Federal Republic of Yugoslavia, Japan, the People''s Republic
    of China, the Republic of Korea and Thailand and terminating the proceeding in
    respect of imports originating in Croatia and the Federal Republic of Yugoslavia
    (notified under document number C(2000) 2452)'
  type: main
- language: fr
