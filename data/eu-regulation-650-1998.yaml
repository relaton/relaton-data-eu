  content: Commission Regulation (EC) No 650/98 of 23 March 1998 amending Council
    Regulation (EC) No 1981/94 opening and providing for the administration of Community
    tariff quotas for certain products originating in Algeria, Cyprus, Egypt, Israel,
    Jordan, Malta, Morocco, the West Bank and the Gaza Strip, Tunisia and Turkey,
    and providing detailed rules for extending and adapting these tariff quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 650/98 de la Commission du 23 mars 1998 modifiant le
    règlement (CE) n° 1981/94 du Conseil portant ouverture et mode de gestion de
    contingents tarifaires communautaires pour certains produits originaires d'Algérie,
    de Chypre, d'Égypte, d'Israël, de Jordanie, de Malte, du Maroc, de Cisjordanie
    et de la Bande de Gaza, de Tunisie et de Turquie, ainsi que les modalités de
    prorogation ou d'adaptation desdits contingents
  type: main
