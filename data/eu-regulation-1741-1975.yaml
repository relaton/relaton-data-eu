title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1741/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on terry towelling and similar terry fabrics, of
    cotton, falling within heading No 55.08, originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1741/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position tarifaire 55.08, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1741/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle,
    der Tarifnummer 55.08, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1741/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, under position 55.08, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3046/74
    af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1741/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci
    del tipo spugna, della voce doganale 55.08, originari dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3046/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1741/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bad- of frotteerstof
    (lussendoek) van katoen, van tariefpost 55.08, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3046/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
