title:
- language: en
  script: Latn
  content: '2001/734/EC: Commission Decision of 11 October 2001 amending for the sixth
    time Decision 2000/284/EC establishing the list of approved semen collection centres
    for imports of equine semen from third countries and amending Decision 94/63/EC
    (Text with EEA relevance) (notified under document number C(2001) 3036)'
  type: main
- language: fr
  script: Latn
  content: '2001/734/CE: Décision de la Commission du 11 octobre 2001 modifiant pour
    la sixième fois la décision 2000/284/CE établissant la liste des centres agréés
    de collecte de sperme pour les importations de sperme d''équidés en provenance
    de pays tiers et modifiant la décision 94/63/CE (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2001) 3036]'
  type: main
- language: de
  script: Latn
  content: '2001/734/EG: Entscheidung der Kommission vom 11. Oktober 2001 zur sechsten
