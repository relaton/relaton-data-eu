    von Equidensperma aus Drittländern zugelassenen Entnahmestationen und zur Änderung
    der Entscheidung 94/63/EG (Text von Bedeutung für den EWR) (Bekannt gegeben unter
    Aktenzeichen K(2001) 3036)'
  type: main
- language: da
  script: Latn
  content: '2001/734/EF: Kommissionens beslutning af 11. oktober 2001 om sjette ændring
