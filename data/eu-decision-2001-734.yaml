    teksti) (tiedoksiannettu numerolla K(2001) 3036)'
  type: main
- language: it
  script: Latn
  content: '2001/734/CE: Decisione della Commissione, dell''11 ottobre 2001, recante
    sesta modifica della decisione 2000/284/CE, che stabilisce l''elenco dei centri
    di raccolta dello sperma riconosciuti per l''importazione di sperma equino in
    provenienza da paesi terzi, e che modifica la decisione 94/63/CE (Testo rilevante
    ai fini del SEE) [notificata con il numero C(2001) 3036]'
  type: main
- language: nl
  script: Latn
  content: '2001/734/EG: Beschikking van de Commissie van 11 oktober 2001 tot zesde
