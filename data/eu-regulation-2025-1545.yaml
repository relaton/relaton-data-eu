  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/1545 на Комисията
    от 30 юли 2025 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от видовете Cornus alba, Cornus
    sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia и Taxus
    baccata с произход от Обединеното кралство и за
    изменение на Регламент за изпълнение (ЕС) 2020/1213
