title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1545 of 30 July 2025 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Cornus alba, Cornus sanguinea, Populus alba, Populus nigra, Populus tremula,
    Sorbus aucuparia and Taxus baccata originating in the United Kingdom and amending
    Implementing Regulation (EU) 2020/1213 as regards the phytosanitary measures for
    the introduction into the Union territory of plants for planting of Cornus alba
    and Cornus sanguinea originating in the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1545 de la Commission du 30 juillet
    2025 modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne
    certains végétaux destinés à la plantation des espèces Cornus alba, Cornus
    sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia et Taxus
    baccata originaires du Royaume-Uni et modifiant le règlement d’exécution (UE)
    2020/1213 en ce qui concerne les mesures phytosanitaires requises pour l’introduction
    sur le territoire de l’Union de végétaux destinés à la plantation de Cornus
    alba et de Cornus sanguinea originaires du Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1545 der Kommission vom 30. Juli 2025
    zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich einiger
    zum Anpflanzen bestimmter Pflanzen von Cornus alba, Cornus sanguinea, Populus
    alba, Populus nigra, Populus tremula, Sorbus aucuparia und Taxus baccata mit Ursprung
    im Vereinigten Königreich sowie zur Änderung der Durchführungsverordnung (EU)
    2020/1213 hinsichtlich der Pflanzenschutzmaßnahmen für das Einführen von zum
    Anpflanzen bestimmten Pflanzen von Cornus alba und Cornus sanguinea mit Ursprung
    im Vereinigten Königreich in das Gebiet der Union
  type: main
