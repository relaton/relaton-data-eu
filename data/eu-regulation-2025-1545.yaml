    на територията на Съюза на растения за засаждане
    от видовете Cornus alba и Cornus sanguinea с произход от
    Обединеното кралство
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/1545 ze dne 30. července 2025,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny k pěstování druhů Cornus alba, Cornus sanguinea, Populus alba, Populus
    nigra, Populus tremula, Sorbus aucuparia a Taxus baccata pocházející ze Spojeného
    království, a prováděcí nařízení (EU) 2020/1213, pokud jde o fytosanitární
