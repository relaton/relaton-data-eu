    planter til plantning af Cornus alba, Cornus sanguinea, Populus alba, Populus
    nigra, Populus tremula, Sorbus aucuparia og Taxus baccata med oprindelse i Det
    Forenede Kongerige og om ændring af gennemførelsesforordning (EU) 2020/1213
    for så vidt angår plantesundhedsforanstaltninger for indførsel til Unionens
    område af planter til plantning af Cornus alba og Cornus sanguinea med oprindelse
    i Det Forenede Kongerige
  type: main
- language: el
  script: Grek
