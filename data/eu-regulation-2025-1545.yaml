    καταγωγής Ηνωμένου Βασιλείου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/1545, 30. juuli 2025, millega muudetakse
    rakendusmäärust (EL) 2018/2019 seoses teatavate liikidesse Cornus alba, Cornus
    sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia ja Taxus
    baccata kuuluvate Ühendkuningriigist pärit istutamiseks ettenähtud taimedega
    ning rakendusmäärust (EL) 2020/1213 seoses liikidesse Cornus alba ja Cornus
    sanguinea kuuluvate Ühendkuningriigist pärit istutamiseks ettenähtud taimede
    liidu territooriumile sissetoomisel kehtivate fütosanitaarmeetmetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/1545, annettu 30 päivänä
    heinäkuuta 2025, täytäntöönpanoasetuksen (EU) 2018/2019 muuttamisesta tiettyjen
    Yhdistyneestä kuningaskunnasta peräisin olevien istutettaviksi tarkoitettujen
    Cornus alba-, Cornus sanguinea-, Populus alba-, Populus nigra-, Populus tremula-,
    Sorbus aucuparia- ja Taxus baccata -lajien kasvien osalta sekä täytäntöönpanoasetuksen
    (EU) 2020/1213 muuttamisesta siltä osin kuin on kyse Yhdistyneestä kuningaskunnasta
    peräisin olevien istutettaviksi tarkoitettujen Cornus alba- ja Cornus sanguinea
    -lajien tuomista unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/1545 ón gCoimisiún an 30 Iúil
    2025 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe Cornus alba, Cornus sanguinea, Populus alba, Populus nigra,
    Populus tremula, Sorbus aucuparia agus Taxus baccata le haghaidh plandú de thionscnamh
    na Ríochta Aontaithe agus lena leasaítear Rialachán Cur Chun Feidhme (AE) 2020/1213
    a mhéid a bhaineann leis na bearta fíteashláintíochta chun plandaí Cornus
    alba agus Cornus sanguinea de thionscnamh na Ríochta Aontaithe a thabhairt isteach
    i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1545 оd 30. srpnja 2025. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Cornus
    alba, Cornus sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia
    i Taxus baccata podrijetlom iz Ujedinjene Kraljevine te Provedbene uredbe (EU)
    2020/1213 u pogledu fitosanitarnih mjera za unos na područje Unije bilja za sadnju
    vrsta Cornus alba i Cornus sanguinea podrijetlom iz Ujedinjene Kraljevine
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1545 végrehajtási rendelete (2025. július 30.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Cornus alba, a Cornus sanguinea,
    a Populus alba, a Populus nigra, a Populus tremula, a Sorbus aucuparia és a Taxus
    baccata egyes, az Egyesült Királyságból származó, ültetésre szánt növényei
    tekintetében, valamint az (EU) 2020/1213 végrehajtási rendeletnek az Egyesült
    Királyságból származó, ültetésre szánt Cornus alba és Cornus sanguinea
    növények Unió területére történő behozatalára vonatkozó növényegészségügyi
    intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1545 della Commissione, del 30 luglio
    2025, che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Cornus alba, Cornus sanguinea, Populus alba, Populus
    nigra, Populus tremula, Sorbus aucuparia e Taxus baccata originarie del Regno
    Unito, e il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda le misure
    fitosanitarie per l’introduzione nell’Unione delle piante da impianto di Cornus
    alba e Cornus sanguinea originarie del Regno Unito
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1545 (2025. gada 30. jūlijs),
    ar ko attiecībā uz noteiktiem stādāmiem Cornus alba, Cornus sanguinea, Populus
    alba, Populus nigra, Populus tremula, Sorbus aucuparia un Taxus baccata augiem,
    kuru izcelsme ir Apvienotajā Karalistē, groza Īstenošanas regulu (ES) 2018/2019
    un attiecībā uz fitosanitārajiem pasākumiem tādu stādāmu Cornus alba un
    Cornus sanguinea augu ievešanai Savienības teritorijā, kuru izcelsme ir Apvienotajā
    Karalistē, groza Īstenošanas regulu (ES) 2020/1213
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 30 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1545,
    kuriuo dėl tam tikrų Jungtinės Karalystės kilmės sodinti skirtų Cornus alba,
    Cornus sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia
    ir Taxus baccata augalų iš dalies keičiamas Reglamentas (ES) 2018/2019 ir dėl
    fitosanitarinių priemonių, taikomų į Sąjungos teritoriją įvežamiems sodinti
    skirtiems Cornus alba ir Cornus sanguinea augalams, iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/1545 tat-30
    ta’ Lulju 2025 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil tal-Cornus alba, tal-Cornus sanguinea,
    tal-Populus alba, tal-Populus nigra, tal-Populus tremula, tas-Sorbus aucuparia,
    u tat-Taxus baccata li joriġinaw mir-Renju Unit u li jemenda r-Regolament ta’
    Implimentazzjoni (UE) 2020/1213 dwar il-miżuri fitosanitarji għall-introduzzjoni
    fit-territorju tal-Unjoni ta’ pjanti għat-tħawwil tal-Cornus alba u tal-Cornus
    sanguinea li joriġinaw mir-Renju Unit
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1545 van de Commissie van 30 juli 2025
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde uit
    het Verenigd Koninkrijk afkomstige voor opplant bestemde planten van de soorten
    Cornus alba, Cornus sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus
    aucuparia en Taxus baccata, en tot wijziging van Uitvoeringsverordening (EU) 2020/1213
    wat betreft de fytosanitaire maatregelen voor het binnenbrengen op het grondgebied
    van de Unie van uit het Verenigd Koninkrijk afkomstige voor opplant bestemde planten
    van de soorten Cornus alba en Cornus sanguinea
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1545 z dnia 30 lipca 2025
    r. zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin przeznaczonych do sadzenia gatunków Cornus alba, Cornus sanguinea, Populus
    alba, Populus nigra, Populus tremula, Sorbus aucuparia i Taxus baccata pochodzących
    ze Zjednoczonego Królestwa oraz zmieniające rozporządzenie wykonawcze (UE)
    2020/1213 w odniesieniu do środków fitosanitarnych do celów wprowadzania na
    terytorium Unii roślin przeznaczonych do sadzenia gatunków Cornus alba i Cornus
    sanguinea pochodzących ze Zjednoczonego Królestwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1545 da Comissão, de 30 de julho de
    2025, que altera o Regulamento de Execução (UE) 2018/2019, no que diz respeito
    a determinados vegetais para plantação de Cornus alba, Cornus sanguinea, Populus
    alba, Populus nigra, Populus tremula, Sorbus aucuparia e Taxus baccata originários
    do Reino Unido, e o Regulamento de Execução (UE) 2020/1213, no que diz respeito
    às medidas fitossanitárias para a introdução de vegetais para plantação
    de Cornus alba e Cornus sanguinea originários do Reino Unido no território da
    União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1545 al Comisiei din 30 iulie
    2025 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării de Cornus alba, Cornus sanguinea,
    Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia și Taxus baccata
    originare din Regatul Unit și de modificare a Regulamentului de punere în aplicare
    (UE) 2020/1213 în ceea ce privește măsurile fitosanitare pentru introducerea
    pe teritoriul Uniunii a plantelor destinate plantării de Cornus alba și Cornus
    sanguinea originare din Regatul Unit
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1545 z 30. júla 2025, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhom Cornus alba, Cornus sanguinea, Populus
    alba, Populus nigra, Populus tremula, Sorbus aucuparia a Taxus baccata pochádzajúce
    zo Spojeného kráľovstva, a ktorým sa mení vykonávacie nariadenie (EÚ) 2020/1213,
    pokiaľ ide o rastlinolekárske opatrenia v súvislosti so vstupom rastlín určených
    na výsadbu patriacich k druhom Cornus alba a Cornus sanguinea pochádzajúcich
    zo Spojeného kráľovstva na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1545 z dne 30. julija 2025 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Cornus alba,
    Cornus sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia
    in Taxus baccata s poreklom iz Združenega kraljestva ter o spremembi Izvedbene
    uredbe (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos rastlin za saditev
    Cornus alba in Cornus sanguinea s poreklom iz Združenega kraljestva na ozemlje
    Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1545 de la Comisión, de 30 de julio
    de 2025, por el que se modifica el Reglamento de Ejecución (UE) 2018/2019 en
    lo que respecta a determinados vegetales para plantación de Cornus alba, Cornus
    sanguinea, Populus alba, Populus nigra, Populus tremula, Sorbus aucuparia y Taxus
    baccata originarios del Reino Unido y el Reglamento de Ejecución (UE) 2020/1213
    en lo que respecta a las medidas fitosanitarias para la introducción en el territorio
    de la Unión de vegetales para plantación de Cornus alba y Cornus sanguinea originarios
    del Reino Unido
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/1545 av den 30 juli 2025
    om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa växter
    för plantering av Cornus alba, Cornus sanguinea, Populus alba, Populus nigra,
    Populus tremula, Sorbus aucuparia och Taxus baccata med ursprung i Förenade kungariket
    och om ändring av genomförandeförordning (EU) 2020/1213 vad gäller växtskyddsåtgärder
    för införsel till unionens territorium av växter för plantering av Cornus
    alba och Cornus sanguinea med ursprung i Förenade kungariket
