title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1528/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of category 117 (order No 42.1170),
    originating in Pakistan, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1528/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    117 (numéro d'ordre 42.1170), originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1528/93 DER KOMMISSION vom 18. Juni 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 117 (laufende Nummer 42.1170) mit
    Ursprung in Pakistan, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1528/93 af 18. juni 1993 om genindførelse
    af opkrævning af told for varer under kategori 117 (løbenummer 42.1170), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1528/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Ιουνίου 1993 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    117 (αύξων αριθμός 42.1170), καταγωγής Πακιστάν,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1528/93 DELLA COMMISSIONE del 18 giugno 1993 che ripristina
