    d' ordine 42.1170) originari del Pakistan beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1528/93 VAN DE COMMISSIE van 18 juni 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 117 (volgnummer 42.1170), van oorsprong uit Pakistan, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad
  type: main
- language: pt
