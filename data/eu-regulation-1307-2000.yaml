    openbare inschrijving voor de uitvoer van gerst uit Ierse interventievoorraden
    betrekking heeft, tot 74 973 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1307/2000 da Comissão, de 21 de Junho de 2000, que
