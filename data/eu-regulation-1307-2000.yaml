    pour l'exportation d'orge détenue par l'organisme d'intervention irlandais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1307/2000 der Kommission vom 21. Juni 2000 zur Änderung
    der Verordnung (EG) Nr. 441/2000 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der irischen Interventionsstelle befindlicher Gerste auf
    74 973 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1307/2000 af 21. juni 2000 om ændring
    af forordning (EF) nr. 441/2000 og om forhøjelse til 74 973 tons af den løbende
    licitation med henblik på eksport af byg, som er i det irske interventionsorgans
    besiddelse
  type: main
- language: el
  script: Grek
