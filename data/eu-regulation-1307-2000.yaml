    (ΕΚ) αριθ. 441/2000 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 74 973 τόνων κριθής που έχει στη διάθεσή
    του ο ιρλανδικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1307/2000, annettu 21 päivänä kesäkuuta 2000,
    asetuksen (EY) N:o 441/2000 muuttamisesta ja Irlannin interventioelimen hallussaan
    pitämän ohran vientiä koskevan pysyvän tarjouskilpailun kohteena olevan määrän
    nostamisesta 74 973 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1307/2000 della Commissione, del 21 giugno 2000, che
