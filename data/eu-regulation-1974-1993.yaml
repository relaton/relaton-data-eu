    pelo Regulamento (CEE) no 3813/92 da Comissão
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1974/93 DE LA COMISIÓN de 22 de julio de 1993 por
    el que se ajustan determinadas ayudas establecidas por los Reglamentos (CEE) nos
    1600/92 y 1601/92 del Consejo sobre medidas específicas en favor, respectivamente,
    de las Azores y Madeira y de las islas Canarias en aplicación del desmantelamiento
    automático de las desviaciones monetarias establecido en el Reglamento (CEE)
    no 3813/92 del Consejo
  type: main
