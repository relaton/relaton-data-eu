title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1974/93 of 22 July 1993 adjusting certain
    aid amounts provided for in Council Regulations (EEC) No 1600/92 and (EEC) No
    1601/92 concerning specific measures for the Azores and Madeira and for the Canary
    Islands with regard to certain agricultural products in application of the automatic
    dismantling of negative monetary gaps pursuant to Council Regulation (EEC) No
    3813/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1974/93 de la Commission du 22 juillet 1993 ajustant
    certaines aides prévues par les règlements (CEE) n° 1600/92 et (CEE) n 1601/92
    du Conseil relatifs à des mesures spécifiques concernant certains produits agricoles
    en faveur des Açores et de Madère et des îles Canaries en application du démantèlement
    automatique des écarts monétaires prévu par le règlement (CEE) n° 3813/92
    du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1974/93 DER KOMMISSION vom 22. Juli 1993 zur Anpassung
    bestimmter Beihilfen der Verordnungen (EWG) Nr. 1600/92 und (EWG) Nr. 1601/92
    zum Erlaß von Sondermaßnahmen für bestimmte landwirtschaftliche Erzeugnisse
    zugunsten der Azoren und Madeiras bzw. der Kanarischen Inseln im Rahmen des automatischen
    Abbaus der Währungsabweichungen gemäß Verordnung (EWG) Nr. 3813/92
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1974/93 af 22. juli 1993 om justering
    af støtte, der er fastsat i Rådets forordning (EØF) nr. 1600/92 og (EØF) nr.
    1601/92 om særlige foranstaltninger for visse landbrugsprodukter til fordel for
    Azorerne og Madeira samt De Kanariske Øer, i henhold til den ordning med automatisk
    afvikling af monetære afvigelser, der er fastsat ved Rådets forordning (EØF)
    nr. 3813/92
  type: main
- language: el
  script: Grek
