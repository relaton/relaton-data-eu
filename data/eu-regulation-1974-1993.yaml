  script: Latn
  content: VERORDENING (EEG) Nr. 1974/93 VAN DE COMMISSIE van 22 juli 1993 tot aanpassing,
    in het kader van de bij Verordening (EEG) nr. 3813/92 van de Raad ingestelde automatische
    afbraak van de monetaire afwijkingen, van sommige steunbedragen die zijn vastgesteld
