  script: Latn
  content: Komission asetus (ETY) N:o 1974/93, annettu 22 päivänä heinäkuuta 1993,
    Azorien ja Madeiran sekä Kanariansaarten tiettyjä maataloustuotteita koskevista
    erityistoimenpiteistä annetuissa neuvoston asetuksissa (ETY) N:o 1600/92 ja (ETY)
    N:o 1601/92 säädettyjen tiettyjen tukien tarkistamisesta neuvoston asetuksessa
    (ETY) N:o 3813/92 säädetyn valuuttaerojen purkamisen ilman eri toimenpiteitä
    mukaisesti
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1974/93 DELLA COMMISSIONE del 22 luglio 1993 recante
