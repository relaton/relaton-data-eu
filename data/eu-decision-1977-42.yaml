title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1976 on the reimbursement by the Guidance
    Section of the EAGGF to the Kingdom of Belgium of expenditure incurred during
    1975 on annuities relating to measures to encourage the cessation of farming and
    the reallocation of utilized agricultural area for the purposes of structural
    improvement
  type: main
- language: fr
  script: Latn
  content: '77/42/CEE: Décision de la Commission, du 21 décembre 1976, relative
    au remboursement par le FEOGA, section orientation, au Royaume de Belgique des
    dépenses effectuées pendant l''année 1975 pour les indemnités relatives à
    l''encouragement à la cessation de l''activité agricole et à l''affectation
    de la superficie agricole utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1976 über die Rückvergütung
    der im Jahr 1975 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Königreich
    Belgien
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1976 om refusion gennem EUGFL,
    udviklingssektionen, til kongeriget Belgien af de udgifter, som er afholdt i løbet
    af året 1975 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1976, relativa al rimborso
    da parte del FEAOG, sezione orientamento, al Regno del Belgio delle spese effettuate
    durante il 1975 per le indennità concernenti l'incoraggiamento alla cessazione
    dell'attività agricola e alla destinazione della superficie agricola utilizzata
    a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1976 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van de gedurende
    het jaar 1975 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur
