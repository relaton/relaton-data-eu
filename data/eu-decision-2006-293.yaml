title:
- language: en
  script: Latn
  content: '2006/293/EC: Commission Decision of 12 April 2006 amending Commission
    Decision 2006/135/EC as regarding the establishment of areas A and B in certain
    Member States due to outbreaks of highly pathogenic avian influenza (notified
    under document number C(2006) 1583)'
  type: main
- language: fr
  script: Latn
  content: '2006/293/CE: Décision de la Commission du 12 avril 2006 modifiant la
    décision 2006/135/CE en ce qui concerne la mise en place des zones A et B dans
    certains États membres à la suite de l''apparition de foyers d''influenza aviaire
    hautement pathogène [notifiée sous le numéro C(2006) 1583]'
  type: main
- language: de
  script: Latn
  content: '2006/293/EG: Entscheidung der Kommission vom 12. April 2006 zur Änderung
    der Entscheidung 2006/135/EG der Kommission in Bezug auf die Abgrenzung von A-
