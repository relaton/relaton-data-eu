    und zur Aufteilung der in der Zeit vom 1. Januar bis 31. Dezember 1985 ohne Zusatzbetrag
    einzuführenden Menge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3441/84 af 6. december 1984 om ændring
