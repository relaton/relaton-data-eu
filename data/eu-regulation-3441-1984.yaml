  content: Commission Regulation (EEC) No 3441/84 of 6 December 1984 amending Regulation
    (EEC) No 3433/81 as regards imports of preserved cultivated mushrooms and allocating
    the quantity which may be imported without payment of the additional amount during
    the period 1 January to 31 December 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3441/84 de la Commission du 6 décembre 1984 modifiant
