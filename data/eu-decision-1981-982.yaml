title:
- language: en
  script: Latn
  content: '81/982/EEC: Commission Decision of 19 November 1981 establishing that
    the apparatus described as ''Hewlett Packard-network analyzer, model 8410 B, with
    harmonic frequency converter, model 8411 A, polar display, model 8414 A and reflection/transmission
    test unit, model 8743 A'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/982/CEE: Décision de la Commission, du 19 novembre 1981, constatant
    que l''importation de l''appareil dénommé "Hewlett Packard - network analyzer,
    model 8410 B, with harmonic frequency converter, model 8411 A, polar display,
    model 8414 A and reflection/transmission test unit, model 8743 A" ne peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/982/EWG: Entscheidung der Kommission vom 19. November 1981, mit der
    festgestellt wird, daß das Gerät ,,Hewlett Packard-Network Analyzer, model 8410
    B, with Harmonic Frequency Converter, model 8411 A, Polar Display, model 8414
    A and Reflection/Transmission Test Unit, model 8743 A" nicht unter Befreiung von
    Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/982/EØF: Kommissionens beslutning af 19. november 1981 om fastslåelse
    af, at indførsel af apparatet "Hewlett Packard-Network Analyzer, model 8410 B,
    with Harmonic Frequency Converter, model 8411 A, Polar Display, model 8414 A and
    Reflection/Transmission Test Unit, model 8743 A" ikke kan ske med fritagelse for
    told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/982/EOK: Απόφαση τής Επιτροπής τής 19ης Νοεμβρίου
    1981 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Hewlett Packard-Network Analyzer, model 8410 B,
    with Harmonic Frequency Converter, model 8411 A, Polar Display, model 8414 A,
    and Reflection/Transmission Test Unit, model 8743 A» δέν μπορεί νά
    πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/982/CEE: Decisione della Commissione, del 19 novembre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Hewlett Packard - Network analyzer,
    model 8410 B, with harmonic frequency converter, model 8411 A, polar display,
    model 8414 A, and reflection/transmission test unit, model 8743 A" non può avvenire
    in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/982/EEG: Beschikking van de Commissie van 19 november 1981 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,HEWLETT PACKARD-Network Analyzer,
    model 8410B, with Harmonic Frequency Converter, model 8411A, Polar Display, model
    8414A and Reflection/Transmission Test Unit, model 8743A" niet met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
