title:
- language: en
  script: Latn
  content: Regulation (EEC) No 345/71 of the Commission of 17 February 1971 amending
    Annex II to Regulation (EEC) No 571/70 determining the list of egg products covered
    by the provisions for the advance fixing of export refunds and the destination
    of such products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 345/71 de la Commission, du 17 février 1971, modifiant
    l' annexe II du règlement (CEE) n° 571/70, établissant la liste des produits
    du secteur des oeufs bénéficiant du régime de la fixation à l' avance des
    restitutions à l' exportation ainsi que leur destination
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 345/71 der Kommission vom 17. Februar 1971 zur Änderung
    des Anhangs II der Verordnung (EWG) Nr. 571/70 zur Festlegung der Erzeugnisse
    auf dem Eiersektor, die für eine Vorausfestsetzung der Ausfuhrerstattung in Frage
    kommen, und der Bestimmungsländer dieser Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forording (EØF) nr. 345/71 af 17. februar 1971 om ændring
    af bilag II til forordning (EØF) nr. 571/70 om udarbejdelse af en fortegnelse
    over de produkter inden for ægsektoren, for hvilke eksportrestitutionen kan forudfastsættes,
    og af disse produkters destination
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 345/71 della Commissione, del 17 febbraio 1971, che
    modifica l' allegato II del regolamento (CEE) n. 571/70, che stabilisce l' elenco
    e la destinazione dei prodotti nel settore delle uova ai quali è concesso il
    beneficio della fissazione anticipata delle restituzioni all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 345/71 van de Commissie van 17 februari 1971 houdende
    wijziging van bijlage II bij Verordening (EEG) nr. 571/70 tot vaststelling van
    de lijst van produkten in de sector eieren, waarvoor een stelsel van vaststelling
    vooraf van de restituties bij uitvoer geldt alsmede hun bestemming
  type: main
