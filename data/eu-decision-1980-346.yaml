title:
- language: en
  script: Latn
  content: '80/346/EEC: Commission Decision of 3 March 1980 authorizing Ireland not
    to apply Community treatment to knitted or crocheted trousers, falling within
    subheading ex 60.05 A II of the Common Customs Tariff (category 28), originating
    in Hong Kong and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/346/CEE: Décision de la Commission, du 3 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les pantalons de bonneterie de la sous-
    position ex 60.05 A II du tarif douanier commun (catégorie 28), originaires de
    Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/346/EWG: Entscheidung der Kommission vom 3. März 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Hosen aus Gewirken der Tarifstelle ex 60.05 A II des
    Gemeinsamen Zolltarifs, Kategorie 28, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/346/EØF: Kommissionens beslutning af 3. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage benklæder af trikotage, som
    henhører under pos. ex 60.05 A II i den fælles toldtarif (kategori 28), har
    oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater (Kun den
    engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/346/CEE: Decisione della Commissione, del 3 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i pantaloni a maglia della
    sottovoce ex 60.05 A II della tariffa doganale comune, categoria 28, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/346/EEG: Beschikking van de Commissie van 3 maart 1980 waarbij Ierland
    wordt gemachtigd broeken van brei- of haakwerk, van post ex 60.05 A II van het
    gemeenschappelijk douanetarief (categorie 28), van oorsprong uit Hong-Kong en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
