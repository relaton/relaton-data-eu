title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2511/92 of 27 August 1992 fixing, for unginned
    cotton, the actual production for the 1991/92 marketing year, the estimated production
    and the reduction in the aid for the 1992/93 marketing year and the amount by
    which the guide price is to be reduced for the 1993/94 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2511/92 de la Commission, du 27 août 1992, fixant,
    le coton non égrené, la production effective pour la campagne de commercialisation
    1991/1992, déterminant pour la campagne 1992/1993 la production estimée, l'
    abattement de l' aide, et fixant le montant dont sera diminué le prix d' objectif
    pour la campagne 1993/1994
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2511/92 der Kommission vom 27. August 1992 zur Festsetzung
    der tatsächlichen Erzeugung an nicht entkörnter Baumwolle im Wirtschaftsjahr
    1991/92, der geschätzen Erzeugung im Wirtschaftsjahr 1992/93, der Beihilfekürzung
    und der Verringerung des Zielpreises im Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2511/92 af 27. august 1992 om fastsættelse
    for ikke-egreneret bomuld for produktionsåret 1991/92 af den faktiske produktion
    og for produktionsåret 1992/93 af den anslåede produktion, nedsættelse af støttebeløbet
    og fastlæggelse af det beløb, hvormed målprisen or produktionsåret 1993/94
    nedsættes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2511/92 της Επιτροπής
    της 27ης Αυγούστου 1992 που καθορίζει για τον
    μη εκκοκκισμένο βάμβακα την πραγματική παραγωγή
    για την περίοδο εμπορίας 1991/92, προσδιορίζει
    για την περίοδο 1992/93 την εκτιμώμενη παραγωγή
    και καθορίζει το ποσό κατά το οποίο θα μειωθεί
    η τιμή στόχου για την περίοδο 1993/94
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2511/92 della Commissione, del 27 agosto 1992, che
    fissa, per il cotone non sgranato, la produzione effettiva per la campagna di
    commercializzazione 1991/1992, che determina per la campagna 1992/1993 la produzione
    stimata e la riduzione dell' aiuto e che fissa la diminuzione del prezzo di obiettivo
    per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2511/92 van de Commissie van 27 augustus 1992 tot
    vaststelling, voor niet-geëgreneerde katoen, van de feitelijke produktie voor
    het verkoopseizoen 1991/1992 en van de geraamde produktie en de korting op het
    steunbedrag voor het verkoopseizoen 1992/1993, en tot vaststelling van het bedrag
    waarmee de streefprijs voor het verkoopseizoen 1993/1994 zal worden verminderd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2511/92 da Comissão, de 27 de Agosto de 1992, que
    fixa, para o algodão não descaroçado, a produção efectiva para a campanha
    de comercialização de 1991/1992, determina, para a campanha de comercialização
    de 1992/1993, a produção prevista e a redução da ajuda e fixa o montante de
    que será diminuído o preço de objectivo na campanha de 1993/1994
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2511/92 de la Comisión, de 27 de agosto de 1992,
    por el que se fija, para el algodón sin desmotar, la producción efectiva para
    la campaña de comercialización de 1991/92, se determina, para la campaña 1992/93,
    la producción estimada y la reducción de la ayuda y se fija la cuantía en que
    se reducirá el precio de objetivo para la campaña 1993/94
  type: main
