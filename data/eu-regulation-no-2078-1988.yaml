    codes 2937 21 00 and 2937 29 10, originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2078/88 de la Commission du 13 juillet 1988 portant
