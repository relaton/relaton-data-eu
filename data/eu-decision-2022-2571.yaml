title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/2571 of 24 October 2022 on the position to be
    adopted, on behalf of the European Union, within the EEA Joint Committee concerning
    the amendment to Annex XI (Electronic communication, audiovisual services and
    information society) and Protocol 37 (containing the list provided for in Article
    101) to the EEA Agreement (Audiovisual Media Services Directive)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2571 du Conseil du 24 octobre 2022 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’EEE
    en ce qui concerne la modification de l’annexe XI (Communications électroniques,
    services audiovisuels et société de l’information) et du protocole 37 (comportant
    la liste prévue à l’article 101) de l’accord EEE (directive «Services de
    médias audiovisuels»)
  type: main
- language: de
  script: Latn
