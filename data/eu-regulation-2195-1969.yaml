    et de primes à la non-commercialisation du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2195/69 der Kommission vom 4. November 1969 betreffend
    Durchführungsbestimmungen zu der Regelung für die Gewährung von Prämien für
    die Schlachtung von Kühen und für die Nichtvermarktung von Milch und Milcherzeugnissen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2195/69 della Commissione, del 4 novembre 1969, che
    stabilisce le modalità di applicazione relative al regime di premi di macellazione
    delle vacche e di premi di non commercializzazione del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2195/69 van de Commissie van 4 november 1969 houdende
    vaststelling van uitvoeringsbepalingen inzake het stelsel van premies voor het
    slachten van koeien en premies voor het niet in de handel brengen van melk en
    zuivelprodukten
