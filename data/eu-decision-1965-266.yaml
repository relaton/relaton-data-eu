title:
- language: fr
  script: Latn
  content: Décision 65/266/CEE du Conseil du 14 mai 1965, autorisant le Royaume des
    Pays-Bas à suspendre, à l'égard des pays tiers, le droit de son tarif applicable
    aux pommes de terre, autres, non dénommées, de la position 07.01 A III B)
  type: main
- language: de
  script: Latn
  content: '65/266/EWG: Entscheidung des Rates vom 14. Mai 1965, mit der das Königreich
    der Niederlande ermächtigt wird, den Zollsatz seiner Zolltarifs für andere Kartoffeln
    der Tarifnummer 07.01 A III b gegenüber dritten Ländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/266/CEE: Decisione del Consiglio, del 14 maggio 1965, che autorizza
    il Regno dei Paesi Bassi a sospendere nei confronti dei paesi terzi il dazio della
    sua tariffa applicabile alle patate, altre, non nominate, della voce 07.01 A III
    b)'
  type: main
- language: nl
  script: Latn
  content: '65/266/EEG: Beschikking van de Raad van 14 mei 1965 waarbij het Koninkrijk
    der Nederlanden wordt gemachtigd om het recht van zijn douanetarief, dat van toepassing
    is op aardappelen, andere, overige, van tariefpost 07.01 A III b) ten opzichte
    van derde landen te schorsen'
  type: main
