title:
- language: en
  script: Latn
  content: Regulation (EEC) No 847/75 of the Commission of 1 April 1975 supplementing
    Regulation (EEC) No 2163/74 as regards the exportation to another Member State
    of animals from a Member State which applies the system of premiums for the orderly
    marketing of adult bovine animals for slaughter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 847/75 de la Commission, du 1er avril 1975, complétant
    le règlement (CEE) n° 2163/74 en ce qui concerne l' expédition, vers un autre
    État membre, d' animaux d' un État membre qui applique le régime de primes
    de mise sur le marché ordonnée de gros bovins de boucherie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 847/75 der Kommission vom 1. April 1975 zur Ergänzung
    der Verordnung (EWG) Nr. 2163/74 hinsichtlich des Versands von Tieren aus einem
    Mitgliedstaat, der die Prämie für eine geregelte Vermarktung ausgewachsener
    Schlachtrinder anwendet, in einen anderen Mitgliedstaat
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 847/75 af 1. april 1975 om tillæg
    til forordning (EØF) nr. 2163/74 for så vidt angår afsendelse til anden medlemsstat
    af dyr fra en medlemsstat, der anvender præmieordningen for reguleret markedsføring
    af voksent slagtekvæg
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 847/75 della Commissione, del 1° aprile 1975, che
    completa il regolamento (CEE) n. 2163/74, per quanto concerne la spedizione di
    animali da uno Stato membro che applichi il regime di premi per un' ordinata immissione
    in commercio di taluni bovini adulti destinati alla macellazione, verso un altro
    Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 847/75 van de Commissie van 1 april 1975 tot aanvulling
    van Verordening (EEG) nr. 2163/74 met betrekking tot de verzending naar een andere
    Lid-Staat van dieren uit een Lid-Staat waar de premieregeling voor het geordend
    op de markt brengen van bepaalde volwassen slachtrunderen wordt toegepast
  type: main
