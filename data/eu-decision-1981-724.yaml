title:
- language: en
  script: Latn
  content: '81/724/EEC: Commission Decision of 30 July 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to track suits of knitted or crocheted fabric originating
    in Romania (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/724/CEE: Décision de la Commission, du 30 juillet 1981, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les survêtements de sport ("trainings")
    de bonneterie originaires de la Roumanie (Les textes en langues française et
    néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/724/EWG: Entscheidung der Kommission vom 30. Juli 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Rumänien stammende Trainingsanzüge aus Gewirken von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/724/EØF: Kommissionens beslutning af 30. juli 1981 om bemyndigelse
    til kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage træningsdragter af trikotage med oprindelse
    i Rumænien (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/724/EOK: Απόφαση τής Επιτροπής τής 30ής Ιουλίου
    1981 περί χορηγήσεως αδείας στό Βασίλειο τού
    Βελγίου, στό Μεγάλο Δουκάτο τού Λουξεμβούργου
    καί στό Βασίλειο τών Κάτω Χωρών νά εξαιρέσουν
    από τήν κοινοτική μεταχείριση τίς πλεκτές
    αθλητικές φόρμες (trainings) καταγωγής Ρουμανίας
    (Τα κείμενα στην γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/724/CEE: Decisione della Commissione, del 30 luglio 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le tute sportive a maglia originarie
    della Romania (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/724/EEG: Beschikking van de Commissie van 30 juli 1981 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden om trainingspakken van brei- of haakwerk van oorsprong uit Roemenië
    van de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
