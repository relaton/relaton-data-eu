- language: en
  script: Latn
  content: Council Regulation (EEC) No 1851/78 of 25 July 1978 laying down certain
    conservation and management measures for common fishery resources off the West
    Greenland coast applicable in 1978 to vessels flying the flag of Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1851/78 du Conseil, du 25 juillet 1978, fixant certaines
    mesures de conservation et de gestion des ressources de pêche communes, dans
    les eaux situées au large des côtes ouest du Groenland, applicables en 1978
    aux navires battant pavillon du Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1851/78 des Rates vom 25. Juli 1978 zur Festlegung
    für 1978 von Maßnahmen zur Erhaltung und Bewirtschaftung der gemeinsamen Fischbestände
    vor den Westküsten Grönlands für Schiffe, die die Flagge Kanadas führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1851/78 af 25. juli 1978 om fastsættelse
    af visse foranstaltninger til bevarelse og forvaltning af de fælles fiskeressourcer
    i farvandene langs Grønlands vestkyst, som skal anvendes i 1978 på fartøjer,
    der fører canadisk flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1851/78 del Consiglio, del 25 luglio 1978, che fissa
