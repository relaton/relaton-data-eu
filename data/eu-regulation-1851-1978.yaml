    acque situate al largo delle coste occidentali della Groenlandia, applicabili
    nel 1978 ai pescherecci battenti bandiera del Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1851/78 van de Raad van 25 juli 1978 tot vaststelling
