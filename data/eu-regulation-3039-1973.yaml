  content: Regulation (EEC) No 3039/73 of the Commission of 8 November 1973 closing
    the standing invitation to tender for the purpose of determining denaturing premiums
    for white sugar for feeding to bees provided for in Regulation (EEC) No 2711/73
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3039/73 de la Commission, du 8 novembre 1973, clôturant
    l'adjudication permanente pour la détermination de primes de dénaturation de
    sucre blanc destiné à l'alimentation des abeilles visée au règlement (CEE)
    n° 2711/73
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3039/73 der Kommission vom 8. November 1973 zur Einstellung
