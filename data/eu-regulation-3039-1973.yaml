    for hvidt sukker bestemt til foder for bier, der er nævnt i forordning (EØF)
    nr. 2711/73
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3039/73 della Commissione, dell'8 novembre 1973, che
    chiude la gara permanente per la determinazione di premi di denaturazione dello
    zucchero bianco destinato all'alimentazione delle api di cui al regolamento (CEE)
    n. 2711/73
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3039/73 van de Commissie van 8 november 1973 tot
