    se Mexika v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz živých koňovitých a spermatu, vajíček a embryí druhů koňovitých
    do Unie (oznámeno pod číslem C(2013) 1794)'
  type: main
- language: da
  script: Latn
