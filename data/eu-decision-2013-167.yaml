    за Мексико в списъка на трети страни и части
    от тях, от които е разрешен вносът в Европейския
    съюз на живи еднокопитни и на сперма, яйцеклетки
    и ембриони от еднокопитни (нотифицирано под
    номер C(2013) 1794)'
  type: main
- language: cs
  script: Latn
