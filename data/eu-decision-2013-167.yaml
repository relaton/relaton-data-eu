title:
- language: en
  script: Latn
  content: '2013/167/EU: Commission Implementing Decision of 3 April 2013 amending
    Annex I to Decision 2004/211/EC as regards the entry for Mexico in the list of
    third countries and parts thereof from which imports into the Union of live equidae
    and semen, ova and embryos of the equine species are authorised (notified under
    document C(2013) 1794)'
  type: main
- language: fr
  script: Latn
  content: '2013/167/UE: Décision d’exécution de la Commission du 3 avril 2013
    modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne la mention
    relative au Mexique sur la liste des pays tiers et des parties de ces pays en
    provenance desquels les importations dans l’Union européenne d’équidés
    vivants et de sperme, d’ovules et d’embryons de l’espèce équine sont autorisées
    [notifiée sous le numéro C(2013) 1794]'
  type: main
- language: de
  script: Latn
  content: '2013/167/EU: Durchführungsbeschluss der Kommission vom 3. April 2013
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich des Eintrags
    für Mexiko in der Liste von Drittländern und Teilen von Drittländern, aus denen
    Einfuhren von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    in die Europäische Union zugelassen sind (Bekanntgegeben unter Aktenzeichen C(2013)
    1794)'
  type: main
- language: bg
  script: Cyrl
