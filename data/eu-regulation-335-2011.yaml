  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 335/2011 della Commissione, del 7 aprile 2011 , che
    modifica il regolamento (CE) n. 1091/2009 per quanto concerne il tenore minimo
    del preparato enzimatico di endo-1,4-beta-xilanasi prodotta dal Trichoderma reesei
    (MUCL 49755) e di endo-1,3(4)-beta-glucanasi prodotta dal Trichoderma reesei (MUCL
    49754) come additivo per mangimi destinato ai polli da ingrasso
  type: main
