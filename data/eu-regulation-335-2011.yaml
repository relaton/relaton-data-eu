title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 335/2011 of 7 April 2011 amending Regulation
    (EC) No 1091/2009 as regards the minimum content of the enzyme preparation of
    endo-1,4-beta-xylanase produced by Trichoderma reesei (MUCL 49755) and endo-1,3(4)-beta-glucanase
    produced by Trichoderma reesei (MUCL 49754) as a feed additive in feed for chickens
    for fattening
  type: main
- language: fr
  script: Latn
