title:
- language: en
  script: Latn
  content: '90/548/EEC: Commission Decision of 26 October 1990 amending Commission
    Decision 85/634/EEC authorizing certain Member States to provide for derogations
    from certain provisions of Council Directive 77/93/EEC in respect of oak wood
    originating in Canada or the United States of America (Only the Spanish, Danish,
    German, French, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/548/CEE: Décision de la Commission du 26 octobre 1990 modifiant la
    décision 85/634/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour le bois de
    chêne originaire du Canada ou des Etats-Unis d''Amérique (Les textes en langues
    espagnole, danoise, allemande, française, italienne et néerlandaise sont les
    seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/548/EWG: Entscheidung der Kommission vom 26. Oktober 1990 zur Aenderung
    der Entscheidung 85/634/EWG der Kommission zur Ermaechtigung bestimmter Mitgliedståten,
    für Eichenholz mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
    (Nur der spanische, dänische, deutsche, französische, italienische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/548/EØF: Kommissionens beslutning af 26. oktober 1990 om ændring
    af Kommissionens beslutning 85/634/EØF om bemyndigelse af visse medlemsstater
    til at undtage egetrae med oprindelse i Canada eller USA fra visse bestemmelser
    i Rådets direktiv 77/93/EØF (Kun den spanske, danske, tyske, franske, italienske
    og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '90/548/ΕΟΚ: Απόφαση της Επιτροπής της 26ης
    Οκτωβρίου 1990 για την τροποποίηση της απόφασης
    85/634/ΕΟΚ της Επιτροπής για την παροχή αδείας
    σε ορισμένα κράτη μέλη να παρεκκλίνουν από
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου,
    όσον αφορά το ξύλο βελανιδιάς, καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών της Αμερικής (Τα κείμενα
    στην ισπανική, δανική, γερμανική, γαλλική, ιταλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '90/548/CEE: Decisione della Commissione del 26 ottobre 1990 recante modifica
    della decisione 85/634/CEE della Commissione che autorizza taluni Stati membri
    a prevedere deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio
    per quanto riguarda il legname di quercia originario del Canada o degli Stati
    Uniti d''America (Il testi in lingua spagnola, danese, tedesca, francese, italiana
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '90/548/EEG: Beschikking van de Commissie van 26 oktober 1990 tot wijziging
    van Beschikking 85/634/EEG houdende machtiging van bepaalde Lid-Staten om voor
    eikehout van oorsprong uit Canada of de Verenigde Staten van Amerika afwijking
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Spaanse, Deense, Duitse, Franse, Italiaanse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/548/CEE: Decisão da Comissão de 26 de Outubro de 1990 que altera
    a Decisao 85/634/CEE, que autoriza determinados Estados-membros a prever derrogaçoes
    a determinadas disposiçoes da Directiva 77/93/CEE do Conselho relativamente à
    madeira de carvalho originaria do Canada ou dos Estados Unidos da América (Apenas
    fazem fé os textos nas línguas espanhola, dinamarquesa, alemã, francesa, italiana
    e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '90/548/CEE: Decisión de la Comisión de 26 de octubre de 1990 que modifica
    la Decision 85/634/CEE de la Comision por la que se autoriza a determinados Estados
    miembros a establecer excepciones a determinadas disposiciones de la Directiva
    77/93/CEE del Consejo respecto de la madera de roble originaria de Canada o de
    los Estados Unidos de América (Los textos en lenguas española, danesa, alemana,
    francesa, italiana y neerlandesa son los únicos auténticos)'
