    bedragen naar aanleiding van de wijziging van de in het kader van het gemeenschappelijk
    landbouwbeleid toe te passen omrekeningskoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2387/95 da Comissão, de 11 de Outubro de 1995, que
