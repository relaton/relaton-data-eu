    to the conversion rates to be applied for the purposes of the common agricultural
    policy
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2387/95 de la Commission, du 11 octobre 1995, modifiant
    certains montants fixés en écus par le règlement (CEE) nº 2328/91 du Conseil
    suite à la modification des taux de conversion à appliquer dans le cadre de
    la politique agricole commune
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2387/95 der Kommission vom 11. Oktober 1995 zur Änderung
