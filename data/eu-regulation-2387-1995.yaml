    nach Änderung der im Rahmen der Gemeinsamen Agrarpolitik anzuwendenden Umrechnungskurse
    in Ecu festgesetzt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2387/95 af 11. oktober 1995 om ændring
    af forordning (EØF) nr. 2328/91 for så vidt angår visse i EU fastsatte beløb
    som følge af ændringen af de omregningskurser, der skal anvendes i den fælles
    landbrugspolitik
  type: main
- language: el
  script: Grek
