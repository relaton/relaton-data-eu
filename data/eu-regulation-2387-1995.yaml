    in ecu dopo la modifica dei tassi di conversione applicabili nel quadro della
    politica agraria comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2387/95 van de Commissie van 11 oktober 1995 tot wijziging
