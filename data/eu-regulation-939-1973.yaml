title:
- language: en
  script: Latn
  content: Regulation (EEC) No 939/73 of the Commission of 5 April 1973 reintroducing
    the charging of Common Customs Tariff duties on glazed setts, flags and paving,
    hearth and wall tiles, falling within heading No 69.08 originating in South Korea,
    covered by the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2762/72 of 19 December 1972
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 939/73 de la Commission, du 5 avril 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux autres carreaux, pavés et dalles de pavement ou de revêtement, de la position
    tarifaire 69.08, originaires de la Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 939/73 der Kommission vom 5. April 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Fliesen, gebrannte Pflastersteine,
    Boden- und Wandplatten, glasiert, der Tarifnummer 69.08, mit Ursprung in Korea
    (Süd-), dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember
    1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 939/73 af 5. april 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for glaserede sten og fliser til brolægning,
    gulvbelægning eller beklædning af underposition 69.08, som har oprindelse i
    Syd-Korea og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 939/73 della Commissione, del 5 aprile 1973, che ripristina
    la riscossione dei dazi della tariffa doganale comune applicabili alle piastrelle,
    blocchetti e lastre da pavimentazione o da rivestimento della voce doganale n.
    69.08 originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 939/73 van de Commissie van 5 april 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op andere plavuizen en andere vloer- en wandtegels van post 69.08,
    van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening (EEG) nr. 2762/72
    van de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
