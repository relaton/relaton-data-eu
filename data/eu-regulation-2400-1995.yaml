    maataloustuotteiden ennakkovahvistustodistusten järjestelmän soveltamista koskevista
    erityisistä yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 1223/94
    muuttamisesta ja asetuksen (EY) N:o 2476/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2400/95 della Commissione, del 12 ottobre 1995, recante
    modifica del regolamento (CE) n. 1223/94 che stabilisce le modalità particolari
    di applicazione del regime dei titoli di fissazione anticipata per determinati
    prodotti agricoli esportati sotto forma di merci non comprese nell'allegato II
    del trattato e del regolamento (CE) n. 2476/94
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2400/95 van de Commissie van 12 oktober 1995 houdende
