    do regime dos certificados de prefixação para certos produtos agrícolas exportados
    sob a forma de mercadorias não abrangidas pelo anexo II do Tratado, e o Regulamento
    (CE) nº 2476/94
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2400/95 de la Comisión, de 12 de octubre de 1995,
