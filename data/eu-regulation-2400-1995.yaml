title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2400/95 of 12 October 1995 amending Regulation
    (EC) No 1223/94 laying down special detailed rules for the application of the
    system of advance fixing certificates for certain agricultural products exported
    in the form of goods not covered by Annex II to the Treaty and amending Regulation
    (EC) No 2476/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2400/95 de la Commission, du 12 octobre 1995, modifiant
    le règlement (CE) n° 1223/94 portant modalités particulières d'application
    du régime des certificats de préfixation pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité et modifiant
    le règlement (CE) n° 2476/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2400/95 der Kommission vom 12. Oktober 1995 zur Änderung
