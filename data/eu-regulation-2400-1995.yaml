    Vorausfestsetzungsbescheinigungen für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrags fallenden Waren ausgeführt
    werden sowie zur Änderung der Verordnung (EG) Nr. 2476/94
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2400/95 af 12. oktober 1995 om ændring
