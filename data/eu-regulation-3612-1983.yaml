title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3612/83 of 15 December 1983 extending the
    Community surveillance of imports of certain live plants and floricultural products
    originating in various countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3612/83 de la Commission du 15 décembre 1983 prorogeant
    la surveillance communautaire des importations de certaines plantes vivantes et
    de certains produits de la floriculture, originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3612/83 der Kommission vom 15. Dezember 1983 zur Verlängerung
    der gemeinschaftlichen Überwachung der Einfuhren von bestimmten lebenden Pflanzen
    und Waren des Blumenhandels mit Ursprung in bestimmten Ländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3612/83 af 15. december 1983 om forlængelse
    af fællesskabstilsynet med indførsel af visse levende planter m.m. og visse
    afskårne blomster og blade med oprindelse i bestemte tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3612/83 της Επιτροπής
    της 15ης Δεκεμβρίου 1983 περί παρατάσεως της κοινοτικής
    εποπτείας των εισαγωγών ορισμένων ζώντων φυτών
    και ορισμένων προϊόντων ανθοκομίας καταγωγής
    ορισμένων τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3612/83 della Commissione del 15 dicembre 1983 che
    proroga il controllo comunitario delle importazioni di talune piante vive e di
    taluni prodotti della floricoltura, originari di diversi paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3612/83 van de Commissie van 15 december 1983 houdende
    verlenging van de geldigheidsduur van het communautair toezicht op de invoer van
    sommige levende planten en van sommige produkten van de bloementeelt, van oorsprong
    uit verschillende landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3612/83 da Comissão, de 15 de Dezembro de 1983,
    que prorroga a fiscalização comunitária das importações de certas plantas
    vivas e de certos produtos da floricultura originários de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3612/83 de la Comisión, de 15 de diciembre de 1983,
    por el que se prorroga la vigilancia comunitaria de las importaciones de determinadas
    plantas vivas y de determinados productos de la floricultura, originarios de determinados
    terceros países
  type: main
