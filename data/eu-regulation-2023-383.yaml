title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/383 of 16 February 2023 amending
    Regulation (EC) No 2870/2000 laying down Community reference methods for the analysis
    of spirit drinks, and repealing Regulation (EEC) No 2009/92 determining Community
    analysis methods for ethyl alcohol of agricultural origin in the preparation of
    spirit drinks, aromatized wines, aromatized wine-based drinks and aromatized wine-product
    cocktails
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/383 de la Commission du 16 février
    2023 modifiant le règlement (CE) no 2870/2000 établissant des méthodes d’analyse
    communautaires de référence applicables dans le secteur des boissons spiritueuses,
    et abrogeant le règlement (CEE) no 2009/92 déterminant les méthodes d’analyse
    communautaires de l’alcool éthylique d’origine agricole utilisé pour l’élaboration
    des boissons spiritueuses, des vins aromatisés, des boissons aromatisées à
    base de vin et des cocktails aromatisés de produits vitivinicoles
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/383 der Kommission vom 16. Februar 2023
    zur Änderung der Verordnung (EG) Nr. 2870/2000 mit gemeinschaftlichen Referenzanalysemethoden
    für Spirituosen und zur Aufhebung der Verordnung (EWG) Nr. 2009/92 zur Festlegung
    der gemeinschaftlichen Analysemethoden zum Nachweis des zur Bereitung von Spirituosen
    und aromatisierter weinhaltiger Getränke und Cocktails verwendeten landwirtschaftlichen
    Äthylalkohols
  type: main
- language: bg
  script: Cyrl
