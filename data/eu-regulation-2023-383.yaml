    dzērienu analīzei un atceļ Regulu (EEK) Nr. 2009/92, kas nosaka Kopienas analīžu
    metodes lauksaimnieciskās izcelsmes etilspirtam, ko izmanto stipro alkoholisko
    dzērienu, aromatizēto vīnu, aromatizētos vīnus saturošu dzērienu un aromatizēto
    vīna produktu kokteiļu izgatavošanai
  type: main
