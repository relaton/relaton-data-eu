    síos modhanna tagartha de chuid an Chomhphobail le haghaidh anailís ar dheochanna
    biotáilleacha, agus lena n-aisghairtear Rialachán (CEE) Uimh. 2009/92 ón gCoimisiún
    lena gcinntear modhanna anailíse de chuid an Chomhphobail le haghaidh alcól
    eitile de thionscamh talmhaíochta in ullmhú deochanna biotáilleacha, fíonta
    cumhraithe, deochanna cumhraithe fíonbhunaithe agus manglam táirgí fíonta
    cumhraithe
  type: main
