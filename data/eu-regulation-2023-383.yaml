    gėrimų analizės Bendrijos etaloninius metodus, ir panaikinamas Tarybos reglamentas
    (EEB) Nr. 2009/92, nustatantis Bendrijos analizės metodus, taikytinus žemės
    ūkio kilmės etilo alkoholiui, naudojamam gaminant spiritinius gėrimus, aromatintus
    vynus, aromatintus vyno gėrimus ir aromatintus vyno kokteilius
  type: main
