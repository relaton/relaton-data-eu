    d’analisi comunitari di riferimento applicabili nel settore delle bevande spiritose,
    e abrogazione del regolamento (CEE) n. 2009/92, che stabilisce metodi comunitari
    di analisi dell’alcole etilico di origine agricola per l’elaborazione di bevande
    spiritose, vini aromatizzati, bevande aromatizzate a base di vino e cocktail aromatizzati
    a base di prodotti vitivinicoli
  type: main
- language: lv
  script: Latn
