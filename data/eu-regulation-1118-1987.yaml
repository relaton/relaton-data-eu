  content: Commission Regulation (EEC) No 1118/87 of 23 April 1987 re-establishing
    the levying of customs duties on alkyds and other polyesters falling within subheading
    39.01 C III ex a), originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
