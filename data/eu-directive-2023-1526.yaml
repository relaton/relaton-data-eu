title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2023/1526 of 16 May 2023 amending Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for lead as a thermal stabilizer in polyvinyl chloride used as base material in
    sensors used in in vitro diagnostic medical devices
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2023/1526 de la Commission du 16 mai 2023 modifiant
    la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au plomb en tant que stabilisateur thermique dans le polychlorure
    de vinyle employé comme matériau de base dans les capteurs utilisés dans les
    dispositifs médicaux de diagnostic in vitro
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2023/1526 der Kommission vom 16. Mai 2023 zur
    Änderung der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates
    hinsichtlich einer Ausnahme für Blei als thermischer Stabilisator in Polyvinylchlorid,
    das als Grundwerkstoff für Sensoren dient, die in medizinischen In-vitro-Diagnostika
    verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2023/1526 на Комисията
    от 16 май 2023 година за изменение на Директива
    2011/65/ЕС на Европейския парламент и на Съвета
    по отношение на освобождаване от ограничението
    за употребата на олово като термичен стабилизатор
    в поливинилхлорид, използван като базов материал
    в датчици, използвани в медицински изделия
    за инвитро диагностика
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2023/1526 ze dne 16. května
    2023, kterou se mění směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití olova jako tepelného stabilizátoru v polyvinylchloridu
    použitém jako výchozí materiál v čidlech používaných v diagnostických
    zdravotnických prostředcích in vitro
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2023/1526 af 16. maj 2023 om ændring
    af Europa-Parlamentets og Rådets direktiv 2011/65/EU, for så vidt angår en
    undtagelse for anvendelse af bly som termisk stabilisator i polyvinylchlorid,
    der anvendes som basismateriale i sensorer, der anvendes i medicinsk udstyr til
    in vitro-diagnostik
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2023/1526 της
    Επιτροπής της 16ης Μαΐου 2023 για την τροποποίηση
    της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τον μόλυβδο ως θερμικό σταθεροποιητή σε πολυβινυλοχλωρίδιο
    που χρησιμοποιείται ως βασικό υλικό σε αισθητήρες
    οι οποίοι χρησιμοποιούνται σε ιατροτεχνολογικά
    προϊόντα για διάγνωση in vitro
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2023/1526, 16. mai 2023, millega
    muudetakse Euroopa Parlamendi ja nõukogu direktiivi 2011/65/EL seoses erandiga,
    mis hõlmab plii kasutamist termostabilisaatorina polüvinüülkloriidis, mida
    kasutatakse alusmaterjalina in vitro diagnostika meditsiiniseadmete andurites
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2023/1526, annettu 16 päivänä toukokuuta
    2023, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU muuttamisesta siltä
    osin kuin on kyse poikkeuksen myöntämisestä lyijyn käytölle termaalisena
    stabiloivana aineena polyvinyylikloridissa, jota käytetään perusmateriaalina
    in vitro -diagnostiikkaan tarkoitettujen lääkinnällisten laitteiden sensoreissa
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2023/1526 ón gCoimisiún an 16 Bealtaine 2023 lena
    leasaítear Treoir 2011/65/AE ó Pharlaimint na hEorpa agus ón gComhairle a mhéid
    a bhaineann le díolúine maidir le luaidhe mar chobhsaitheoir teirmeach i gclóiríd
    pholaivinile a úsáidtear mar bhunábhar i mbraiteoirí a úsáidtear i bhfeistí
    leighis diagnóiseacha in vitro
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/1526 оd 16. svibnja 2023. o izmjeni
    Direktive 2011/65/EU Europskog parlamenta i Vijeća u pogledu izuzeća za olovo
    kao termički stabilizator u polivinil-kloridu koji se upotrebljava kao osnovni
    materijal u senzorima koji se koriste u in vitro dijagnostičkim medicinskim proizvodima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1526 felhatalmazáson alapuló irányelve (2023.
    május 16.) a 2011/65/EU európai parlamenti és tanácsi irányelvnek az in vitro
    diagnosztikai orvostechnikai eszközökben használt érzékelők alapanyagaként
    szolgáló polivinilkloridban lévő ólomra vonatkozó mentesség tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2023/1526 della Commissione del 16 maggio 2023
    che modifica la direttiva 2011/65/UE del Parlamento europeo e del Consiglio per
    quanto riguarda un’esenzione relativa al piombo come stabilizzatore termico
    del cloruro di polivinile impiegato come materiale di base nei sensori utilizzati
    nei dispositivi medico-diagnostici in vitro
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2023/1526 (2023. gada 16. maijs),
    ar ko attiecībā uz atbrīvojumu izmantot svinu kā tāda polivinilhlorīda termisko
    stabilizatoru, ko lieto par bāzes materiālu sensoros, kurus izmanto in vitro
    diagnostikas medicīniskajās ierīcēs, groza Eiropas Parlamenta un Padomes Direktīvu
    2011/65/ES
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2023/1526 2023 m. gegužės 16 d.
    kuria dėl išimties, taikomos švinui kaip polivinilchlorido, naudojamo kaip
    bazinė in vitro diagnostikos medicinos priemonių jutiklių medžiaga, šiluminiam
    stabilizatoriui, iš dalies keičiama Europos Parlamento ir Tarybos direktyva
    2011/65/ES
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2023/1526 tas-16 ta’ Mejju 2023
    li temenda d-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għaċ-ċomb bħala stabbilizzatur termali fil-klorur tal-polivinil
    użat bħala materjal ta’ bażi f’sensuri li jintużaw f’apparat mediku
    dijanjostiku in vitro
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2023/1526 van de Commissie van 16 mei 2023
    tot wijziging van Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat
    betreft een vrijstelling voor lood als thermische stabilisator in polyvinylchloride
    dat wordt gebruikt als basismateriaal in sensoren die worden gebruikt in medische
    hulpmiddelen voor in-vitrodiagnostiek
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2023/1526 z dnia 16 maja 2023 r. zmieniająca
    dyrektywę Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dotyczącego ołowiu jako stabilizatora termicznego w polichlorku winylu stosowanym
    jako materiał podstawowy w czujnikach stosowanych w wyrobach medycznych do diagnostyki
    in vitro
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2023/1526 da Comissão de 16 de maio de 2023 que
    altera a Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção aplicável à utilização de chumbo como estabilizador térmico
    em poli(cloreto de vinilo) utilizado como material de base em sensores usados
    em dispositivos médicos de diagnóstico in vitro
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2023/1526 a Comisiei din 16 mai 2023 de modificare
    a Directivei 2011/65/UE a Parlamentului European și a Consiliului în ceea ce
    privește o derogare pentru plumbul folosit ca stabilizator termic în clorura
    de polivinil utilizată drept material de bază în senzorii din dispozitivele
    medicale pentru diagnostic in vitro
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2023/1526 zo 16. mája 2023, ktorou
    sa mení smernica Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    týkajúcu sa olova ako tepelného stabilizátora v polyvinylchloride použitom
    ako východiskový materiál v snímačoch, ktoré sa používajú v diagnostických
    zdravotníckych pomôckach in vitro
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2023/1526 z dne 16. maja 2023 o spremembi
    Direktive 2011/65/EU Evropskega parlamenta in Sveta glede izjeme za svinec kot
    termični stabilizator v polivinilnem kloridu, ki se uporablja kot osnovni material
    v senzorjih v in vitro diagnostičnih medicinskih pripomočkih
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2023/1526 de la Comisión de 16 de mayo de 2023
    que modifica la Directiva 2011/65/UE del Parlamento Europeo y del Consejo en lo
    relativo a una exención para el plomo como estabilizador térmico en el cloruro
    de polivinilo empleado como material de base en los sensores que se utilizan en
    los productos sanitarios de diagnóstico in vitro
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2023/1526 av den 16 maj 2023 om
    ändring av Europaparlamentets och rådets direktiv 2011/65/EU vad gäller undantag
    för bly som termisk stabilisator i polyvinylklorid som utgör grundmaterialet
    i sensorer som används i medicintekniska produkter för in vitro-diagnostik
  type: main
