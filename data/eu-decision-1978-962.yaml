title:
- language: en
  script: Latn
  content: '78/962/EEC: Commission Decision of 9 November 1978 authorizing the French
    Republic not to apply Community treatment to men'' s and boys'' outer garments:
    men'' s and boys'' woven jackets and blazers, of wool, of cotton or of man-made
    textile fibres, falling within heading No ex 61.01 of the Common Customs Tariff
    (NIMEXE codes 61.01-34, 36, 37), originating in Romania and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/962/CEE: Décision de la Commission, du 9 novembre 1978, autorisant
    la République française à exclure du traitement communautaire les vêtements
    de dessus pour hommes et garçonnets: vestes et vestons tissés pour hommes et
    garçonnets, de laine, de coton ou de fibres textiles synthétiques ou artificielles
    de la position ex 61.01 du tarif douanier commun (codes Nimexe: 61.01-34; 36;
    37), originaires de Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/962/EWG: Entscheidung der Kommission vom 9. November 1978, mit der
    die Französische Republik ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Oberkleidung für Männer
    und Knaben: Sakkos und Jacken aus Geweben, für Männer und Knaben, aus Wolle,
    Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex
    61.01 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-34; 36; 37) von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/962/EØF: Kommissionens beslutning af 9. november 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage yderbeklædningsgenstande
    til mænd og drenge: jakker og blazere (undtagen arbejdsjakker, hjemmejakker og
    strandjakker), vævede, til mænd og drenge, af uld, bomuld eller kunstige og
    syntetiske fibre, som henhører under pos. ex 61.01 i den fælles toldtarif (NIMEXE-kode
    61.01-34, 36, 37), har oprindelse i Rumænien og frit kan omsættes i de øvrige
    medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/962/CEE: Decisione della Commissione, del 9 novembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli indumenti
    esterni per uomo e per ragazzo (giacche e giacchette per uomo e per ragazzo, di
    lana, di cotone o di fibre tessili sintetiche o artificiali) della voce ex 61.01
    della tariffa doganale comune (codice Nimexe: 61.01-34, 36, 37), originari della
    Romania e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/962/EEG: Beschikking van de Commissie van 9 november 1978 waarbij de
    Franse Republiek wordt gemachtigd herenbovenkleding en jongensbovenkleding : colbertjassen,
    blazers, geweven, van wol, van katoen of van synthetische of van kunstmatige textielvezels
    voor heren en jongens, van post ex 61.01 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-34, 36, 37), van oorsprong uit Roemenië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
