  content: Regulation (EEC) No 2523/72 of the Commission of 30 November 1972 amending
    the period of validity of export licences and the closing date for the submission
    of tenders specified in Regulation (EEC) No 1897/72 on a standing invitation to
    tender to determine the export refund for white sugar
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2523/72 de la Commission, du 30 novembre 1972, modifiant
    la durée de validité des certificats d' exportation et les délais de présentation
    des offres prévus par le règlement (CEE) n° 1897/72 concernant une adjudication
    permanente pour la détermination de la restitution à l' exportation pour le
    sucre blanc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2523/72 der Kommission vom 30. November 1972 zur Änderung
    der in der Verordnung (EWG) Nr. 1897/72 über eine Dauerausschreibung zur Bestimmung
    der Ausfuhrerstattungen für Weißzucker vorgesehenen Gültigkeitsdauer der Ausfuhrlizenzen
    und Einreichungsfristen für die Angebote
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2523/72 af 30. november 1972 om ændring
