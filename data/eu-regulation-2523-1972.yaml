    eksportrestitutionen for hvidt sukker
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2523/72 della Commissione, del 30 novembre 1972, che
    modifica la durata di validità dei titoli d' esportazione e i termini di presentazione
    delle offerte previsti dal regolamento (CEE) n. 1897/72 relativo ad una gara permanente
    per la determinazione della restituzione all' esportazione per lo zucchero bianco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2523/72 van de Commissie van 30 november 1972 tot
    wijziging van de geldigheidsduur der uitvoercertificaten en van de termijnen voor
