title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1142/80 of 6 May 1980 re-establishing the
    levying of customs duties on woven pneumatic matresses, products of category 110
    (code 1100), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1142/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux matelas pneumatiques, tissés,
    de la catégorie de produits n° 110 (code 1100), originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1142/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Luftmatratzen aus Geweben der Warenkategorie Nr. 110 (Kennziffer
    1100), mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 2894/79 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1142/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for luftmadrasser, vævede, under varekategori
    110 (kode 1100), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1142/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai materassi pneumatici,
    tessuti, della categoria di prodotti n. 110 (codice 1100), originari della Cina
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1142/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    luchtbedden, van de categorie van produkten nr. 110 (codenummer 1100), van oorsprong
    uit China waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2894/79 van de Raad
  type: main
