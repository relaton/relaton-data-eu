    ex 22.05 B des Gemeinsamen Zolltarifs und zur Aufhebung der Verordnung (EWG) Nr.
    2319/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2685/70 della Commissione, del 29 dicembre 1970, relativo
