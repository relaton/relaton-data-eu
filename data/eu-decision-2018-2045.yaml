    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu NK603 × MON 810 (MON-ØØ6Ø3-6 × MON-ØØ81Ø-6), sú z nej zložené
    alebo vyrobené [oznámené pod číslom C(2018) 8239]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/2045 z dne 19. decembra 2018 o obnovitvi
