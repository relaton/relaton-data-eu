title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/2045 of 19 December 2018 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize NK603 × MON 810 (MON-ØØ6Ø3-6
    × MON-ØØ81Ø-6) pursuant to Regulation (EC) No 1829/2003 of the European Parliament
    and of the Council (notified under document C(2018) 8239)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/2045 de la Commission du 19 décembre
