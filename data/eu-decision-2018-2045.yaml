    sejam constituídos por, ou produzidos a partir de milho geneticamente modificado
    NK603 × MON 810 (MON-ØØ6Ø3-6 × MON-ØØ81Ø-6) nos termos do Regulamento
    (CE) n.° 1829/2003 do Parlamento Europeu e do Conselho [notificada com o número
    C(2018) 8239]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/2045 a Comisiei din 19 decembrie
    2018 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, sunt compuse sau fabricate din porumb modificat genetic NK603 × MON
    810 (MON-ØØ6Ø3-6 × MON-ØØ81Ø-6) în temeiul Regulamentului (CE) nr. 1829/2003
    al Parlamentului European și al Consiliului [notificată cu numărul C(2018)
    8239]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/2045 z 19. decembra 2018, ktorým
