  script: Latn
  content: Decisión de Ejecución (UE) 2018/2045 de la Comisión, de 19 de diciembre
    de 2018, por la que se renueva la autorización de comercialización de productos
    que contengan, se compongan o se hayan producido a partir de maíz modificado
    genéticamente NK603 × MON 810 (MON-ØØ6Ø3-6 × MON-ØØ81Ø-6) con arreglo
    al Reglamento (CE) n.° 1829/2003 del Parlamento Europeo y del Consejo [notificada
    con el número C(2018) 8239]
  type: main
