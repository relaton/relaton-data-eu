title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1143/81 of 22 April 1981 determining the
    amounts of the variable components, accession compensatory amounts and additional
    duties applicable from 1 May to 31 July 1981 on the importation into the Community
    of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1143/81 de la Commission, du 22 avril 1981, déterminant
    les montants des éléments mobiles et les montants compensatoires «adhésion»,
    ainsi que les droits additionnels applicables pendant la période du 1er mai au
    31 juillet 1981 à l'importation dans la Communauté des marchandises relevant
    du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1143/81 der Kommission vom 22. April 1981 zur Festsetzung
    der Höhe der vom 1. Mai bis einschließlich 31. Juli 1981 bei der Einfuhr der
    unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft geltenden
    beweglichen Teilbeträge, Beitrittsausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1143/81 af 22. april 1981 om fastsættelse
    af størrelsen af de variable elementer, tiltrædelsesudligningsbeløb og tillægstold
    for indførsel i Fællesskabet af varer henhørende under forordning (EØF) nr.
    3033/80 for perioden fra den 1. maj til den 31. juli 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1143/81 της Επιτροπής
    της 22ας Απριλίου 1981 περί καθορισμού των ποσών
    των κινητών στοιχείων και των εξισωτικών ποσών
    προσχωρήσεως καθώς και των πρόσθετων δασμών
    πού εφαρμόζονται κατά την περίοδο από 1ης Μαΐου
    μέχρι και 31ης Ιουλίου 1981 κατά την εισαγωγή
    στην Κοινότητα εμπορευμάτων πού υπάγονται
    στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1143/81 della Commissione, del 22 aprile 1981, che
