    nonché i dazi addizionali applicabili all'importazione nella Comunità, per il
    periodo dal 1 maggio al 31 luglio 1981, delle merci cui si applica il regolamento
    (CEE) n. 3033/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1143/81 van de Commissie van 22. april 1981 tot vaststelling
