title:
- language: en
  script: Latn
  content: '83/637/EEC: Commission Decision of 12 December 1983 amending Commission
    Decision 81/135/EEC establishing that the apparatus described as ''EG and G PAR-OMA
    2 System'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/637/CEE: Décision de la Commission du 12 décembre 1983 modifiant
    la décision 81/135/CEE de la Commission constatant que l''importation de l''appareil
    dénommé "EG and G PAR-OMA 2 System" ne peut être faite en franchise des droits
    du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/637/EWG: Entscheidung der Kommission vom 12. Dezember 1983 zur Änderung
    der Entscheidung 81/135/EWG der Kommission, mit der festgestellt wird, daß das
    Gerät ,,EG and G PAR-OMA 2 System" nicht unter Befreiung von den Zöllen des
    Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/637/EØF: Kommissionens beslutning af 12. december 1983 om ændring
    af Kommissionens beslutning 81/135/EØF om fastslåelse af, at indførsel af apparatet
    "EG and G PAR-OMA 2 System" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/637/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Δεκεμβρίου 1983 η οποία τροποποιεί την απόφαση
    81/135/ΕΟΚ της Επιτροπής περί διαπιστώσεως ότι
    η εισαγωγή της συσκευής με την ονομασία «EG
    and G PAR-OMA 2 System» δεν δύναται να πραγματοποιηθεί
    ατελώς ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/637/CEE: Decisione della Commissione del 12 dicembre 1983 che modifica
    la decisione 81/135/CEE della Commissione che stabilisce che l''importazione dell''apparecchio
    denominato "EG and G PAR-OMA 2 System" non può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/637/EEG: Beschikking van de Commissie van 12 december 1983 tot wijziging
    van Beschikking 81/135/EEG van de Commissie waarbij wordt vastgesteld dat de invoer
    van het apparaat genaamd ,,EG and G PAR-OMA 2 System" niet met vrijstelling van
    de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
