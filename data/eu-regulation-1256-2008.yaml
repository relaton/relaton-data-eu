  content: Council Regulation (EC) No 1256/2008 of 16 December 2008 imposing a definitive
    anti-dumping duty on imports of certain welded tubes and pipes of iron or non-alloy
    steel originating in Belarus, the People's Republic of China and Russia following
    a proceeding pursuant to Article 5 of Regulation (EC) No 384/96, originating in
    Thailand following an expiry review pursuant to Article 11(2) of the same Regulation,
    originating in Ukraine following an expiry review pursuant to Article 11(2) and
    an interim review pursuant to Article 11(3) of the same Regulation, and terminating
    the proceedings in respect of imports of the same product originating in Bosnia
    and Herzegovina and Turkey
