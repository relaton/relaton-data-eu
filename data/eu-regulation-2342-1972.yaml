title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2342/72 of the Commission of 7 November 1972 on a fifth
    amendment to Regulation (EEC) No 1013/71 laying down detailed rules of application
    for Regulation (EEC) No 974/71 on certain measures of conjunctural policy to be
    taken in agriculture following the temporary widening of the margins of fluctuation
    for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2342/72 de la Commission, du 7 novembre 1972, portant
    cinquième modification du règlement (CEE) n° 1013/71, portant modalités d'
    application du règlement (CEE) n° 974/71 relatif à certaines mesures de politique
    de conjoncture à prendre dans le secteur agricole à la suite de l' élargissement
    temporaire des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2342/72 der Kommission vom 7. November 1972 zur fünften
    Änderung der Verordnung (EWG) Nr. 1013/71 zur Festlegung der Durchführungsbestimmungen
    für die Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2342/72 af 7. november 1972 om den
    femte ændring af forordning (EØF) nr. 1013/71 om fastsættelse af gennemførelsesbestemmelser
    til forordning (EØF) nr. 974/71 om visse konjunkturpolitiske foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i visse medlemsstaters valutaer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2342/72 della Commissione, del 7 novembre 1972, relativo
    alla quinta modifica del regolamento (CEE) n. 1013/71 recante modalità di applicazione
    del regolamento (CEE) n. 974/71 relativo a talune misure di politica congiunturale
    da adottare nel settore agricolo in seguito all' ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2342/72 van de Commissie van 7 november 1972 houdende
    vijfde wijziging van Verordening (EEG) nr. 1013/71 houdende uitvoeringsbepalingen
    van Verordening (EEG) nr. 974/71 betreffende conjunctuurpolitieke maatregelen
    welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van
    de valuta' s van sommige Lid-Staten dienen te worden genomen in de landbouwsector
  type: main
