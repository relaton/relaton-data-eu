title:
- language: fr
  script: Latn
  content: Règlement n 477/67/CEE de la Commission, du 23 août 1967, fixant les
    montants maxima des restitutions pour le riz exporté vers les pays tiers sous
    la forme de marchandises ne relevant pas de l'annexe II du traité, pour les mois
    de juillet et août 1967
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 477/67/EWG der Kommission vom 23. August 1967 zur Festsetzung
    der Höchstbeträge der Erstattungen für die Monate Juli und August 1967 für
    Reis, der nach Drittländern in Form von nicht unter Anhang II des Vertrages fallenden
    Waren ausgeführt wird
  type: main
- language: it
  script: Latn
  content: Regolamento n. 477/67/CEE della Commissione, del 23 agosto 1967, che fissa
    gli ammontari massimi delle restituzioni per il riso esportato verso i paesi terzi
    sotto forma di merci non riprese nell'allegato II del Trattato per i mesi di luglio
    e agosto 1967
  type: main
- language: nl
  script: Latn
  content: Verordening no. 477/67/EEG van de Commissie van 23 augustus 1967 houdende
    vaststelling van de maximumbedragen van de restituties voor rijst uitgevoerd naar
    derde landen in de vorm van de niet in bijlage II van het Verdrag vermelde goederen
    voor de maanden juli en augustus 1967
  type: main
