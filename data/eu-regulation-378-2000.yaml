  content: Commission Regulation (EC) No 378/2000 of 17 February 2000 amending Regulation
    (EC) No 1494/1999 laying down the reduced agricultural components and additional
    duties applicable from 1 July to 31 December 1999 inclusive to the importation
    into the Community of goods covered by Council Regulation (EC) No 3448/93 under
    Europe Agreements
