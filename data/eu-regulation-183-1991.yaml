  content: Commission Regulation (EEC) No 183/91 of 25 January 1991 laying down definitive
    measures on the issuing of STM licences for milk and milk products as regards
    Spain
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 183/91 DE LA COMMISSION du 25 janvier 1991 arrêtant
    les mesures définitives concernant la délivrance des certificats « MCE » dans
    le secteur du lait et des produits laitiers en ce qui concerne l'' Espagne #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 183/91 DER KOMMISSION vom 25. Januar 1991 mit den
    Spanien betreffenden endgültigen Maßnahmen zur Erteilung von EHM-Lizenzen im
    Sektor Milch und Milcherzeugnisse #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 183/91 af 25. januar 1991 om fastsættelse
    af endelige foranstaltninger vedrørende udstedelse af SMS-licenser for mælk
    og mejeriprodukter for Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 183/91 της Επιτροπής
    της 25ης Ιανουαρίου 1991 για τη θέσπιση οριστικών
    μέτρων όσον αφορά την έκδοση πιστοποιητικών
    " ΣΜΣ " στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων όσον αφορά την Ισπανία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 183/91 DELLA COMMISSIONE del 25 gennaio 1991 recante
    misure definitive per il rilascio dei titoli MCS nel settore del latte e dei prodotti
    lattiero-caseari in Spagna #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 183/91 VAN DE COMMISSIE van 25 januari 1991 tot
    vaststelling van de voor Spanje geldende definitieve maatregelen in verband met
    de afgifte van de ARH-certificaten in de sector melk en zuivelprodukten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 183/91 DA COMISSÃO de 25 de Janeiro de 1991 que
    adopta as medidas definitivas relativas à emissão dos certificados MCT, no sector
    do leite e dos produtos lácteos, no que diz respeito a Espanha #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 183/91 DE LA COMISIÓN de 25 de enero de 1991 por
