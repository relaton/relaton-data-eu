title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2796/83 of 6 October 1983 re-establishing
    the levying of customs duties on footwear with outer soles and uppers of rubber
    or artificial plastic material, falling within heading No 64.01 and originating
    in Malaysia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2796/83 de la Commission du 6 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à semelles extérieures et dessus en caoutchouc ou en matière plastique artificielle,
    de la position 64.01 du tarif douanier commun, originaires de la Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2796/83 der Kommission vom 6. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff der Tarifnummer 64.01, mit Ursprung in Malaysia, dem die in der
    Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2796/83 af 6. oktober 1983 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi eller plast,
    henhørende under pos. 64.01 og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2796/83 της Επιτροπής
    της 6ης Οκτωβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για υποδήματα έχοντα
    το εξωτερικόν πέλμα και το άνω μέρος αυτών
    εκ καουτσούκ ή εκ τεχνητής πλαστικής ύλης,
    της κλάσεως 64.01 του Κοινού Δασμολογίου, καταγωγής
    Μαλαισίας, δικαιούχου των προβλεπομένων από
    τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2796/83 della Commissione del 6 ottobre 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle calzature con suole esterne
    e tomaia di gomma o di materia plastica artificiale, della voce 64.01 della tariffa
    doganale comune, originarie della Malaysia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2796/83 van de Commissie van 6 oktober 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool en bovendeel van rubber of van kunstmatige plastische stof, van tariefpost
    64.01, van oorsprong uit Maleisië, waarvoor de in Verordening (EEG) nr. 3377/82
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
