    на Регламент (ЕО) 881/2002 на Съвета за налагане
    на някои специфични ограничителни мерки, насочени
    срещу определени лица и образувания, свързани
    с Осама бен Ладен, мрежата на Ал Кайда и талибаните,
    и за отмяна на Регламент (ЕО) № 467/2001 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 866/2003 ze dne 19. května 2003, kterým se
    po osmnácté mění nařízení Rady (ES) č. 881/2002 o zavedení některých
    zvláštních omezujících opatření namířených proti některým osobám
    a subjektům spojeným s Usámou bin Ládinem, sítí Al-Kajdá a Talibanem a
    o zrušení nařízení Rady (ES) č. 467/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 866/2003 af 19. maj 2003 om 18. ændring
    af Rådets forordning (EF) nr. 881/2002 om indførelse af visse specifikke restriktive
    foranstaltninger mod visse personer og enheder, der har tilknytning til Usama
    bin Laden, Al-Qaida-organisationen og Taliban, og om ophævelse af Rådets forordning
    (EF) nr. 467/2001
  type: main
- language: el
  script: Grek
