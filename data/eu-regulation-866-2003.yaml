    obmedzujúce opatrenia namierené proti niektorým osobám a subjektom spojeným
    s Usámom bin Ládinom, sieťou Al-Qaida a Talibanom a zrušuje nariadenie Rady
    (ES) č. 467/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 866/2003 z dne 19. maja 2003 o 18. spremembi
    Uredbe Sveta (ES) št. 881/2002 o nekaterih posebnih omejevalnih ukrepih proti
    nekaterim osebam in entitetam, povezanim z Osamo bin Ladnom, mrežo Al-Kaida in
    talibani, ter o razveljavitvi Uredbe Sveta (ES) št. 467/2001
  type: main
