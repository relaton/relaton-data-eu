    suunatud eripiirangud ja tunnistatakse kehtetuks nõukogu määrus (EÜ) nr 467/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 866/2003, annettu 19 päivänä toukokuuta 2003,
