    hebben met Usama bin Laden, het Al Qa'ida-netwerk en de Taliban, en tot intrekking
    van Verordening (EG) nr. 467/2001 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 866/2003 z dnia 19 maja 2003 r. zmieniające
    po raz osiemnasty rozporządzenie Rady (WE) nr 881/2002 wprowadzające niektóre
    szczególne środki ograniczające skierowane przeciwko niektórym osobom i podmiotom
    związanym z Osamą bin Ladenem, siecią Al-Kaida i Talibami i uchylające rozporządzenie
    Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 866/2003 da Comissão, de 19 de Maio de 2003, que
    altera pela décima oitava vez o Regulamento (CE) n.° 881/2002 que institui certas
    medidas restritivas específicas contra determinadas pessoas e entidades associadas
    a Osama bin Laden, à rede Al-Qaida e aos Talibã, e que revoga o Regulamento
    (CE) n.° 467/2001 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 866/2003 al Comisiei din 19 mai 2003 de efectuarea
    a celei de-a optsprezecea modificări a Regulamentului (CE) nr. 881/2002 al Consiliului
    de instituire a unor măsuri restrictive specifice împotriva anumitor persoane
    și entități care au legătură cu Osama ben Laden, cu rețeaua Al-Qaida și
    cu talibanii și de abrogare a Regulamentului (CE) nr. 467/2001 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 866/2003 z 19. mája 2003, ktorým sa osemnástykrát
