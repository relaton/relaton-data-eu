    osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom i talibanima
    te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 866/2003/EK rendelete (2003. május 19.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről,
    valamint a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK tanácsi rendelet tizennyolcadik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 866/2003 della Commissione, del 19 maggio 2003, recante
    diciottesima modifica del regolamento (CE) n. 881/2002 del Consiglio che impone
    specifiche misure restrittive nei confronti di determinate persone ed entità
    associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento
    (CE) n. 467/2001
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 866/2003 (2003. gada 19. maijs), ar kuru astoņpadsmito
    reizi groza Padomes Regulu (EK) Nr. 881/2002, ar ko nosaka konkrētus, īpašus,
    ierobežojošus, pret noteiktām personām un organizācijām, kuras saistītas
    ar Osamu Bin Ladenu, organizācijas Al-Qaida tīklu un Taliban, vērstus pasākumus
    un ar ko atceļ Padomes Regulu (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2003 m. gegužės 19 d. Komisijos reglamentas (EB) Nr. 866/2003, aštuonioliktą
    kartą iš dalies keičiantis Tarybos reglamentą (EB) Nr. 881/2002, nustatantį
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Osama bin Ladenu, Alkaeda tinklu ir Talibanu, ir panaikinantį
    Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 866/2003 tad-19 ta' Mejju 2003 li
    jemenda għat-18-il darba r-Regolament tal-Kunsill (KE) Nru 881/2002 li jimponi
    ċerti miżuri speċifiċi rispettivi diretti kontra ċerti persuni u entitajiet
    imsieħba ma' Usama bin Laden, in-network ta' l-Al-Qaida u t-Taliban, u li jħassar
    ir-Regolament tal-Kunsill (KE) Nru 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 866/2003 van de Commissie van 19 mei 2003 tot achttiende
