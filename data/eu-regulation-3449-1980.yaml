  script: Latn
  content: Regolamento (CEE) n. 3449/80 del Consiglio, del 22 dicembre 1980, che stabilisce
    talune modalità di applicazione dell' accordo tra la Comunità economica europea
    e la Repubblica socialista di Romania sul commercio di prodotti industriali e
    che modifica l' allegato III del regolamento (CEE) n. 3286/80 relativo ai regimi
    d' importazione applicabili ai paesi a commercio di Stato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3449/80 van de Raad van 22 december 1980 houdende
    bepaalde voorschriften voor de toepassing van de Overeenkomst tussen de Europese
    Economische Gemeenschap en de Socialistische Republiek Roemenië betreffende de
    handel in industrieprodukten en houdende wijziging van bijlage III bij Verordening
