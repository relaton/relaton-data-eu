  content: Council Regulation (EEC) No 3449/80 of 22 December 1980 laying down certain
    detailed rules for the implementation of the Agreement between the European Economic
    Community and the Socialist Republic of Romania on trade in industrial products
    and amending Annex III to Regulation (EEC) No 3286/80 on import arrangements in
    respect of State-trading countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3449/80 du Conseil, du 22 décembre 1980, portant
    certaines modalités d'application de l'accord entre la Communauté économique
    européenne et la République socialiste de Roumanie sur le commerce de produits
    industriels et modifiant l'annexe III du règlement (CEE) n° 3286/80 relatif
    aux régimes d'importation à l'égard des pays à commerce d'État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3449/80 des Rates vom 22. Dezember 1980 mit Durchführungsvorschriften
    zum Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Sozialistischen
    Republik Rumänien über den Handel mit gewerblichen Waren und zur Änderung des
    Anhangs III der Verordnung (EWG) Nr. 3286/80 über die Einfuhrregelung gegenüber
    Staatshandelsländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3449/80 af 22. december 1980 om visse gennemførelsesbestemmelser
    til aftalen mellem Det europæiske økonomiske Fællesskab og Den socialistiske
    republik Rumænien om handelen med industrivarer og om ændring af bilag III til
    forordning (EØF) nr. 3286/80 om ordningerne for indførsel fra statshandelslandene
  type: main
- language: el
  script: Grek
