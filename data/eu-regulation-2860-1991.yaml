  content: Commission Regulation (EEC) No 2860/91 of 27 September 1991 on the rate
    of interest to be used for calculating the costs of financing intervention measures
    comprising buying in, storage and disposal
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2860/91 DE LA COMMISSION du 27 septembre 1991 fixant
