    επιτοκίων που θα εφαρμοσθούν για τον υπολογισμό
    των δαπανών χρηματοδοτήσεως των παρεμβάσεων
    που συνίστανται σε αγορά, αποθεματοποίηση
    και διάθεση
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2860/91 DELLA COMMISSIONE del 27 settembre 1991 che
