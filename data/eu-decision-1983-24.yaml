  content: '83/24/EEC: Commission Decision of 19 January 1983 establishing that the
    apparatus described as ''Macbeth - X-Y Recorder'' may not be imported free of
    Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/24/CEE: Décision de la Commission du 19 janvier 1983 constatant que
    l''importation de l''appareil dénommé "Macbeth - X-Y Recorder" ne peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
