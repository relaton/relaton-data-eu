title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 32/79 of 8 January 1979 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 32/79 de la Commission, du 8 janvier 1979, fixant le
    montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 32/79 der Kommission vom 8. Januar 1979 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 32/79 af 8. januar 1979 om fastsættelse
    af det beløb, hvormed det variable element for afgiften, der anvendes for klid
    med oprindelse i Algeriet, Marokko og Tunesien, skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 32/79 della Commissione, dell'8 gennaio 1979, che
    fissa l'importo di cui deve essere diminuito l'elemento mobile del prelievo applicabile
    alle crusche e stacciature originarie dell'Algeria, del Marocco e della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 32/79 van de Commissie van 8 januari 1979 tot vaststelling
    van het bedrag waarmee het variabele element van de heffing die van toepassing
    is op zemelen en slijpsel van oorsprong uit Algerije, Marokko en Tunesië moet
    worden verminderd
