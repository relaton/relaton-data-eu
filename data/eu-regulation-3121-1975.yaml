title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3121/75 of the Commission of 28 November 1975 re-establishing
    the levying of customs duties on calculating machines; accounting machines, cash
    registers, etc., falling within heading No 84.52, originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3121/75 de la Commission, du 28 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à calculer, machines à écrire dites "comptables" etc., de la position tarifaire
    84.52, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3121/75 der Kommission vom 28. November 1975 zur Wiedereinführung
    des Zollsatzes für Rechenmaschinen, Abrechnungsmaschinen, Registrierkassen, Frankiermaschinen,
    Fahrkarten- oder Eintrittskarten-Ausgabemaschinen und dergleichen, mit Rechenwerk,
    der Tarifnummer 84.52, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3121/75 af 28. november 1975 om genindførelse
    af opkrævning af toldafgifter for regnemaskiner; bogholderimaskiner etc., under
    position 84.52, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3121/75 della Commissione, del 28 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine calcolatrici,
    macchine da scrivere dette «contabili», ecc., della voce doganale 84.52, originarie
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3121/75 van de Commissie van 28 november 1975 houdende
    wederinstelling van de heffing van de douanerechten voor rekenmachines, boekhoudmachines,
    enz., van post 84.52, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 tariefpreferenties
    werden geopend
  type: main
