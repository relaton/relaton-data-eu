title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2772/78 of 28 November 1978 re-establishing
    the levying of customs duties on perborate of sodium, falling within subheading
    28.46 ex B, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2772/78 de la Commission, du 28 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables au perborate
    de sodium, de la sous-position tarifaire 28.46 ex B, originaire de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2772/78 der Kommission vom 28. November 1978 zur Wiedereinführung
    des Zollsatzes fúr Natriumperborat der Tarifstelle 28.46 ex B, mit Ursprung in
    Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2772/78 af 28. november 1978 om genindførelse
    af opkrævning af toldafgifter for natriumperoxyborat, under underposition 28.46
    ex B, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2772/78 della Commissione, del 28 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili al perborato di sodio,
    della sottovoce doganale 28.46 ex B, originario della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/ del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2772/78 van de Commissie van 28 november 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op natriumperboraat,
    van post 28.46 ex B, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
