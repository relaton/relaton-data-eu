title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2144/89 of 17 July 1989 derogating from
    Regulation (EEC) No 2377/80 in respect of the period of validity of import licences
    for frozen thin skirt of bovine animals and amending Regulation (EEC) No 1368/89
    in respect of the items on the said licences
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2144/89 de la Commission du 17 juillet 1989 dérogeant
    au règlement (CEE) n° 2377/80 en ce qui concerne la durée de validité des
    certificats d'importation pour la hampe congelée de l'espèce bovine et modifiant
    le règlement (CEE) n° 1368/89 en ce qui concerne les mentions sur lesdits certificats
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2144/89 DER KOMMISSION vom 17. Juli 1989 zur Abweichung
    von der Verordnung (EWG) Nr. 2377/80 bezüglich der Geltungsdauer der Einfuhrlizenzen
    für gefrorenes Saumfleisch von Rindern und zur Änderung der Verordnung (EWG)
    Nr. 1368/89 bezüglich der Angaben auf solchen Lizenzen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2144/89 af 17. juli 1989 om undtagelse
    fra forordning (EØF) nr. 2377/80, for så vidt angår gyldighedsperioden for
    importlicenser, og om ændring af forordning (EØF) nr. 1368/89 for så vidt angår
    oplysningerne på importlicenserne for frosset mellemgulv af oksekød
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2144/89 της Επιτροπής
    της 17ης Ιουλίου 1989 περί παρεκκλίσεως από τον
    κανονισμό (ΕΟΚ) αριθ. 2377/80 όσον αφορά τη διάρκεια
    ισχύος των πιστοποιητικών εισαγωγής για το
    κατεψυγμένο διάφραγμα βοοειδών και περί τροποποιήσεως
    του κανονισμού (ΕΟΚ) αριθ. 1368/89 όσον αφορά τις
    ενδείξεις στα εν λόγω πιστοποιητικά
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2144/89 DELLA COMMISSIONE del 17 luglio 1989 che
    deroga al regolamento (CEE) n. 2377/80 per quanto riguarda il termine di validità
    dei titoli d'' importazione per i pezzi detti « hampes » congelati della specie
    bovina, e modifica il regolamento (CEE) n. 1368/89 del Consiglio per quanto riguarda
    le indicazioni figuranti in tali titoli #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2144/89 VAN DE COMMISSIE van 17 juli 1989 houdende
    afwijking van Verordening (EEG) nr. 2377/80 wat de geldigheidsduur van de invoercertificaten
    voor bevroren omlopen van runderen betreft, en tot wijziging van Verordening (EEG)
    nr. 1368/89 wat de vermeldingen op die certificaten betreft #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2144/89 DA COMISSÃO de 17 de Julho de 1989 que
    derroga o Regulamento (CEE) nº 2377/80 no que respeita à eficácia dos certificados
    de importação para os diafragmas congelados de animais da espécie bovina e
    que altera o Regulamento (CEE) nº 1368/89 no que respeita às menções sobre
    os certificados #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2144/89 DE LA COMISIÓN de 17 de julio de 1989 por
    el que se establece una excepción a lo dispuesto en el Reglamento (CEE) no 2377/80,
    en lo relativo al período de validez de los certificados de importación para
    los músculos del diafragma y los delgados congelados de la especie bovina, y
    por el que se modifica el Reglamento (CEE) no 1368/89 en lo relativo a las menciones
    que deben figurar en dichos certificados #'
  type: main
