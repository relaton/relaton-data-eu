title:
- language: en
  script: Latn
  content: '81/882/EEC: Commission Decision of 9 October 1981 establishing that the
    apparatus described as ''Perkin Elmer Scanning Auger Microprobe, model 590, with
    accessories'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/882/CEE: Décision de la Commission, du 9 octobre 1981, constatant
    que l''importation de l''appareil dénommé "Perkin Elmer - scanning auger microprobe,
    model 590, with accessories" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/882/EWG: Entscheidung der Kommission vom 9. Oktober 1981, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer scanning auger microprobe, model 590, with
    accessories" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/882/EØF: Kommissionens beslutning af 9. oktober 1981 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer scanning auger microprobe, model
    590, with accessories" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
