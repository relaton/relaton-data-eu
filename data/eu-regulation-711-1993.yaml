title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 711/93 of 25 March 1993 re- establishing
    the levying of customs duties on products of category 9 (order No 40.0090), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 711/93 de la Commission, du 25 mars 1993, portant
