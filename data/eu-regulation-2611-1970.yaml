title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2611/70 du Conseil, du 15 décembre 1970, modifiant
    le règlement n° 137/67/CEE établissant les règles générales relatives au
    système dit des "produits pilotes et dérivés" permettant la fixation de montants
    supplémentaires dans le secteur de la viande de porc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2611/70 des Rates vom 15. Dezember 1970 zur Änderung
    der Verordnung Nr. 137/67/EWG über die Grundregeln für das sogenannte "System
    von Leit- und Folgeerzeugnissen", das die Festsetzung von Zusatzbeträgen auf
    dem Schweinefleischsektor ermöglicht
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2611/70 del Consiglio, del 15 dicembre 1970, che modifica
    il regolamento n. 137/67/CEE che stabilisce le norme generali relative al sistema
    detto «prodotti pilota e prodotti derivati» che consente la fissazione di importi
    supplementari nel settore delle carni suine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2611/70 van de Raad van 15 december 1970 tot wijziging
    van Verordening nr. 137/67/EEG houdende algemene regels inzake het zogenaamde
    stelsel van "hoofdprodukten en afgeleide produkten" voor de vaststelling van extra
    bedragen in de sector varkensvlees
  type: main
