title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2268/92 of 3 August 1992 re-establishing
    the levying of customs duties on products falling within CN code 3503 00 10, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2268/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 3503
    00 10 originaires du Brésil, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2268/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
