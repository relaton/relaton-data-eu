    от 17 август 2021 година за подновяване на разрешението
    за пускане на пазара на фуражи и продукти, различни
    от храни и фуражи, съдържащи или състоящи се
    от генетично модифицирана маслодайна рапица
    GT73 (MON-ØØØ73-7), в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2021) 5992) (само текстът
    на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1385 ze dne 17. srpna 2021 o
    obnovení povolení pro uvádění krmiv a jiných produktů než potravin a krmiv,
    které obsahují geneticky modifikovanou řepku olejnou GT73 (MON-ØØØ73-7)
    nebo z ní sestávají, na trh podle nařízení Evropského parlamentu a Rady
    (ES) č. 1829/2003 (oznámeno pod číslem C(2021) 5992) (Pouze nizozemské znění
    je závazné)
  type: main
