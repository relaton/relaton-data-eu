    5992) (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1385 da Comissão de 17 de agosto de 2021
    que renova a autorização de colocação no mercado de alimentos para animais
    e produtos, que não sejam géneros alimentícios e alimentos para animais, que
    contenham ou sejam constituídos por colza geneticamente modificada GT73 (MON-ØØØ73-7),
    nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho
    [notificada com o número C(2021) 5992] (Apenas faz fé o texto na língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1385 a Comisiei din 17 august
    2021 de reînnoire a autorizației de introducere pe piață a furajelor și a
    produselor, altele decât produsele alimentare și furajele, care conțin sau
    constau în rapiță modificată genetic GT73 (MON-ØØØ73-7), în temeiul Regulamentului
    (CE) nr. 1829/2003 al Parlamentului European și al Consiliului [notificată cu
    numărul C(2021) 5992] (Numai textul în limba neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1385 zo 17. augusta 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh krmivo a výrobky iné než krmivo a potraviny,
    ktoré obsahujú geneticky modifikovanú repku olejku GT73 (MON-ØØØ73-7) alebo
    sú z nej zložené [oznámené pod číslom C(2021) 5992] (Iba holandské znenie
    je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1385 z dne 17. avgusta 2021 o obnovitvi
    odobritve dajanja na trg krme in proizvodov razen živil in krme, ki vsebujejo
    gensko spremenjeno oljno ogrščico GT73 (MON-ØØØ73-7) ali so iz nje sestavljeni,
    v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano
    pod dokumentarno številko C(2021) 5992) (Besedilo v nizozemskem jeziku je edino
    verodostojno)
  type: main
