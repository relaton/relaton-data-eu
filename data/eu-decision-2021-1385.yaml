  content: Decisión de Ejecución (UE) 2021/1385 de la Comisión de 17 de agosto
    de 2021 por la que se renueva la autorización de comercialización de los piensos
    y los productos distintos de los alimentos y los piensos que contengan o estén
    compuestos por la colza oleaginosa modificada genéticamente GT73 (MON-ØØØ73-7),
