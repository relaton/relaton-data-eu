    GT73-raps (MON-ØØØ73-7), i henhold til Europa-Parlamentets og Rådets forordning
    (EF) nr. 1829/2003 (meddelt under nummer C(2021) 5992) (Kun den nederlandske udgave
    er autentisk)
  type: main
