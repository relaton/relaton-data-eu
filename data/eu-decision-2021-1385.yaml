  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1385 z dnia 17 sierpnia 2021 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, paszy i produktów innych niż żywność i pasza,
    zawierających genetycznie zmodyfikowany rzepak GT73 (MON-ØØØ73-7), składających
