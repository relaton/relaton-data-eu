  content: Komission täytäntöönpanopäätös (EU) 2021/1385, annettu 17 päivänä
    elokuuta 2021, muuntogeenistä rapsia GT73 (MON-ØØØ73-7) sisältävien tai
    siitä koostuvien rehujen ja tuotteiden, jotka eivät ole elintarvikkeita tai
    rehuja, markkinoille saattamista koskevan luvan uusimisesta Euroopan parlamentin
    ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla
    C(2021) 5992) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/1385 оd 17. kolovoza 2021. o produljenju
    odobrenja za stavljanje na tržište hrane za životinje i proizvoda osim hrane
    i hrane za životinje koji sadržavaju genetski modificiranu uljanu repicu GT73
    (MON-ØØØ73-7) ili se od nje sastoje na temelju Uredbe (EZ) br. 1829/2003 Europskog
    parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2021) 5992) (Vjerodostojan
    je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1385 végrehajtási határozata (2021. augusztus
    17.) a géntechnológiával módosított GT73 (MON-ØØØ73-7) olajrepcét tartalmazó
    vagy abból álló takarmány és az ilyen olajrepcét tartalmazó vagy abból
    álló, élelmiszeren és takarmányon kívüli termékek forgalomba hozatalára
    vonatkozó engedélynek az 1829/2003/EK európai parlamenti és tanácsi rendelet
    szerinti megújításáról (az értesítés a C(2021) 5992. számú dokumentummal
    történt) (Csak a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1385 della Commissione del 17 agosto
    2021 che rinnova l’autorizzazione all’immissione in commercio di mangimi e
    di prodotti diversi da alimenti e mangimi contenenti o costituiti da colza geneticamente
    modificata GT73 (MON-ØØØ73-7) in conformità al regolamento (CE) n. 1829/2003
    del Parlamento europeo e del Consiglio [notificata con il numero C(2021)5992]
    (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1385 (2021. gada 17. augusts),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū barību un produktus, kas satur ģenētiski modificēto
    eļļas rapsi GT73 (MON-ØØØ73-7) vai no tā sastāv, bet kas nav pārtika un
    barība (izziņots ar dokumenta numuru C(2021) 5992) (Autentisks ir tikai teksts
    nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/1385 2021 m. rugpjūčio 17
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai pašarus ir kitus nei maistas ar pašarai produktus,
    kurių sudėtyje yra genetiškai modifikuotų aliejinių rapsų GT73 (MON-ØØØ73–7)
    arba kurie iš jų sudaryti (pranešta dokumentu Nr. C(2021) 5992) (Tekstas autentiškas
    tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
