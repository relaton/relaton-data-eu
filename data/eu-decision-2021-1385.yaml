title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1385 of 17 August 2021 renewing
    the authorisation for the placing on the market of feed and products other than
    food and feed containing or consisting of genetically modified oilseed rape GT73
    (MON-ØØØ73-7) pursuant to Regulation (EC) No 1829/2003 of the European Parliament
    and of the Council (notified under document C(2021) 5992) (Only the Dutch text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1385 de la Commission du 17 août 2021
    renouvelant l’autorisation de mise sur le marché d’aliments pour animaux
    et de produits autres que les denrées alimentaires ou les aliments pour animaux
    contenant le colza génétiquement modifié GT73 (MON-ØØØ73-7) ou consistant
    en ce colza, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 5992] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1385 der Kommission vom 17. August 2021
    zur Erneuerung der Zulassung für das Inverkehrbringen von Futtermitteln und anderen
    Erzeugnissen als Lebens- und Futtermittel, die genetisch veränderten Raps GT73
    (MON-ØØØ73-7) enthalten oder aus ihm bestehen, gemäß der Verordnung (EG)
    Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter
    Aktenzeichen C(2021) 5992) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
