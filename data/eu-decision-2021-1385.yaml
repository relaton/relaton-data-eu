    tot verlenging van de vergunning voor het in de handel brengen van diervoeders
    en van andere producten dan levensmiddelen en diervoeders die geheel of gedeeltelijk
    bestaan uit het genetisch gemodificeerde koolzaad GT73 (MON-ØØØ73-7), overeenkomstig
