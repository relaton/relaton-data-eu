title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1661/2000 of 27 July 2000 determining to
    what extent applications for the right to import for cows and heifers of certain
    mountain breeds lodged under Regulation (EC) No 1143/98 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1661/2000 de la Commission du 27 juillet 2000 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 1143/98 relatif à l'importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1661/2000 der Kommission vom 27. Juli 2000 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte für Kühe und Färsen bestimmter
    Höhenrassen gemäß der Verordnung (EG) Nr. 1143/98 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1661/2000 af 27. juli 2000 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergracer i henhold til forordning (EF) nr. 1143/98 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1661/2000 της Επιτροπής,
    της 27ης Ιουλίου 2000, για να καθορισθεί σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται
    βάσει του κανονισμού (ΕΚ) αριθ. 1143/98 όσον αφορά
    την εισαγωγή αγελάδων και δαμάλεων ορισμένων
    ορεσίβιων φυλών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1661/2000, annettu 27 päivänä heinäkuuta
    2000, asetuksen (EY) N:o 1143/98 mukaisesti jätettyjen tiettyihin vuoristorotuihin
    kuuluvia lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1661/2000 della Commissione, del 27 luglio 2000, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel quadro del regolamento (CE) n. 1143/98 relativo all'importazione
    di vacche e giovenche di alcune razze di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1661/2000 van de Commissie van 27 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de ingediende aanvragen voor
    invoerrechten op grond van Verordening (EG) nr. 1143/98 betreffende de invoer
    van koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1661/2000 da Comissão, de 27 de Julho de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) n.° 1143/98 relativo à importação
    de vacas e de novilhas de determinadas raças de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1661/2000 de la Comisión, de 27 de julio de 2000,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    expedición de certificados de importación presentadas con arreglo al Reglamento
    (CE) n° 1143/98 relativo a las importaciones de vacas y novillas de determinadas
    razas de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1661/2000 av den 27 juli 2000 om fastställande
    av i vilken utsträckning sådana ansökningar om importlicenser skall beviljas
    som lämnats in i enlighet med förordning (EG) nr 1143/98 angående import av
    kor och kvigor av vissa bergraser
  type: main
