  content: '2001/882/EC: Commission Decision of 25 July 2001 on the State aid implemented
    by France in the form of development assistance for the cruise vessel "Le Levant",
    built by Alstom Leroux Naval for operation in Saint-Pierre-et-Miquelon (Text with
    EEA relevance) (notified under document number C(2001) 2435)'
  type: main
- language: fr
  script: Latn
