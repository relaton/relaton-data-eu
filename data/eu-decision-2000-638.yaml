---
id: EUDecision2000638
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2000/638/EC: Commission Decision of 22 September 2000 on the application
    of Article 3(3)(e) of Directive 1999/5/EC to marine radio communication equipment
    intended to be fitted to seagoing non-SOLAS vessels and which is intended to participate
    in the global maritime distress and safety system (GMDSS) and not covered by Council
    Directive 96/98/EC on marine equipment (notified under document number C(2000)
    2719)'
  type: main
- language: fr
  script: Latn
  content: '2000/638/CE: Décision de la Commission du 22 septembre 2000 relative
    à l''application de l''article 3, paragraphe 3, point e), de la directive 1999/5/CE
    aux équipements hertziens marins mis à bord des navires non soumis à la SOLAS
    en vue de participer au système mondial de détresse et de sécurité en mer
    (SMDSM) et non visés par la directive 96/98/CE du Conseil relative aux équipements
    marins [notifiée sous le numéro C(2000) 2719]'
  type: main
- language: de
  script: Latn
  content: '2000/638/EG: Entscheidung der Kommission vom 22. September 2000 über
    die Anwendung von Artikel 3 Absatz 3 Buchstabe e) der Richtlinie 1999/5/EG auf
    Seefunkanlagen, die für die Ausrüstung von nicht dem SOLAS-Übereinkommen unterliegenden
    Seeschiffen zwecks Teilnahme am weltweiten Seenot- und Sicherheitsfunksystem bestimmt
    sind und nicht unter die Richtlinie 96/98/EG des Rates über Schiffsausrüstung
    fallen (Bekannt gegeben unter Aktenzeichen K(2000) 2719)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 22. září 2000 o použití čl. 3 odst. 3 písm.
    e) směrnice 1999/5/ES u námořních radiokomunikačních zařízení, která
    jsou určena k instalaci na námořních plavidlech, na něž se nevztahuje úmluva
    SOLAS, za účelem účasti v globálním námořním tísňovém a bezpečnostním
    systému (GMDSS) a na která se nevztahuje směrnice Rady 96/98/ES o námořním
    zařízení (oznámeno pod číslem K(2000) 2719)
  type: main
- language: da
  script: Latn
  content: '2000/638/EF: Kommissionens beslutning af 22. september 2000 om anvendelse
    af artikel 3, stk. 3, litra e), i direktiv 1999/5/EF på radiokommunikationsudstyr,
    der er beregnet til installering på søgående ikke-SOLAS-skibe med henblik på
    deltagelse i det globale maritime nød- og sikkerhedssystem (GMDSS), og som ikke
    er omfattet af Rådets direktiv 96/98/EF om udstyr på skibe (meddelt under nummer
    K(2000) 2719)'
  type: main
- language: el
  script: Grek
  content: '2000/638/ΕΚ: Απόφαση της Επιτροπής, της 22ας
    Σεπτεμβρίου 2000, για εφαρμογή του άρθρου 3 παράγραφος
    3 στοιχείο ε) της οδηγίας 1999/5/ΕΚ σε ναυτικό ραδιοεπικοινωνιακό
    εξοπλισμό ο οποίος προορίζεται να τοποθετηθεί
    σε μη καλυπτόμενα από τη σύμβαση SOLAS θαλασσοπλοούντα
    πλοία για να μπορούν να συμμετέχουν στο παγκόσμιο
    ναυτιλιακό σύστημα κινδύνου και ασφάλειας
    και ο οποίος δεν καλύπτεται από την οδηγία
    96/98/ΕΚ του Συμβουλίου σχετικά με τον εξοπλισμό
    πλοίων [κοινοποιηθείσα υπό τον αριθμό Ε(2000)
    2719]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 22. september 2000, direktiivi 1999/5/EÜ artikli 3 lõike
    3 punkti e kohaldamise kohta laevade raadioseadmete suhtes, mis on mõeldud paigaldamiseks
    SOLASega hõlmamata merelaevadele ja kavandatud osalema ülemaailmses merepääste-
    ja -ohutussüsteemis (GMDSS) ning mida ei käsitle nõukogu direktiiv 96/98/EÜ
    laevavarustuse kohta (teatavaks tehtud numbri K(2000) 2719 all)
  type: main
- language: fi
  script: Latn
  content: '2000/638/EY: Komission päätös, tehty 22 päivänä syyskuuta 2000,
    direktiivin 1999/5/EY 3 artiklan 3 kohdan e alakohdan soveltamisesta SOLAS-sopimuksen
    ulkopuolelle jääviin merialuksiin asennettavaksi tarkoitettuihin radiolaitteisiin,
    joiden tarkoituksena on osallistua merenkulun maailmanlaajuiseen hätä- ja turvallisuuusjärjestelmään
    ja jotka eivät kuulu laivavarusteista annetun neuvoston direktiivin 96/98/EY
    soveltamisalaan (tiedoksiannettu numerolla K(2000) 2719)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2000. szeptember 22.) az 1999/5/EK irányelv
    3. cikke (3) bekezdése e) pontjának tengerjáró, nem SOLAS hajókba való beszerelésre
    szánt, az általános tengeri vészjelző és biztonsági rendszerben (GMDSS)
    szerepeltetni kívánt, és a tengerészeti felszerelésekről szóló 96/98/EK
    tanácsi irányelv hatálya alá nem tartozó tengeri rádiókommunikációs berendezésekre
    történő alkalmazásáról (az értesítés a C(2000) 2719. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: '2000/638/CE: Decisione della Commissione, del 22 settembre 2000, relativa
    all''applicazione dell''articolo 3, paragrafo 3, lettera e) della direttiva 1999/5/CE
    alle apparecchiature radio marittime destinate ad essere installate su navi marittime
    non-SOLAS al fine di partecipare al Sistema mondiale di soccorso e sicurezza in
    mare (SMSSM) e non contemplate dalla direttiva 96/98/CE del Consiglio sull''equipaggiamento
    marittimo [notificata con il numero C(2000) 2719]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2000. gada 22. septembris) par Direktīvas 1999/5/EK
    3. panta 3. punkta e) apakšpunkta piemērošanu jūras radiosakaru iekārtām,
    kas paredzētas uzstādīšanai SOLAS Konvencijai nepakļautos jūras kuģos un
    līdzdalībai Vispasaules Jūras avāriju un drošības sistēmā (GMDSS) un uz
    ko neattiecas Padomes Direktīva 96/98/EK par kuģu aprīkojumu (paziņots ar
    dokumenta Nr. C(2000) 2719)
  type: main
- language: lt
  script: Latn
  content: 2000 m. rugsėjo 22 d. Komisijos sprendimas dėl Direktyvos 1999/5/EB 3
    straipsnio 3 dalies e punkto taikymo jūrų radijo ryšio įrangai, skirtai jūriniams
    laivams, nepatenkantiems į SOLAS taikymo sritį, ir kuri skirta dalyvauti globalinėje
    jūrų avarinio ryšio ir saugumo sistemoje (GMDSS), ir nenumatytai Tarybos direktyvoje
    96/98/EB dėl laivų įrenginių (pranešta dokumentu Nr. C(2000) 2719)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kumissjoni tat-22 ta' Settembru 2000 dwar l-applikazzjoni
    ta' l-Artikolu 3(3)(e) tad-Direttiva 1999/5/KE għal tagħmir ta' komunikazzjoni
    bir-radju tal-baħar maħsub li jiġi armat fuq bastimenti mibnija biex jaqsmu
    l-ibħra mhux SOLAS u li huwa maħsub li jieħu sehem fis-sistema globali ta'
    għawġ u sigurtà marittima (GMDSS) u li mhux kopert bid-Direttiva tal-Kunsill
    96/98/KE dwar tagħmir tal-baħar (innotifikat taħt id-dokument numru C(2000)
    2719)
  type: main
- language: nl
  script: Latn
  content: '2000/638/EG: Beschikking van de Commissie van 22 september 2000 over de
    toepassing van artikel 3, lid 3, onder e), van Richtlijn 1999/5/EG van het Europees
    Parlement en de Raad op radioapparatuur die bestemd is om op niet-SOLAS-zeeschepen
    te worden geïnstalleerd voor deelname aan het wereldwijde maritieme nood- en
    veiligheidssysteem en die niet onder Richtlijn 96/98/EG van de Raad inzake uitrusting
    van zeeschepen valt (kennisgeving geschied onder nummer C(2000) 2719)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 22 września 2000 r. w sprawie stosowania art. 3
    ust. 3 lit. e) dyrektywy 1999/5/WE w stosunku do urządzeń morskiej łączności
    radiowej przeznaczonych do zainstalowania na statkach pełnomorskich nieobjętych
    przepisami Międzynarodowej Konwencji o bezpieczeństwie życia na morzu (SOLAS)
    i który ma być stosowany w Światowym Morskim Systemie Łączności Alarmowej
    i Bezpieczeństwa (GMDSS), i który nie jest objęty dyrektywą Rady 96/98/WE
    w sprawie wyposażenia statków (notyfikowana jako dokument nr C(2000) 2719)
  type: main
- language: pt
  script: Latn
  content: '2000/638/CE: Decisão da Comissão, de 22 de Setembro de 2000, relativa
    à aplicação da alínea e) do n.o 3 do artigo 3.o da Directiva 1999/5/CE a equipamento
    de rádio marítimo destinado a ser instalado em navios de mar não abrangidos
    pela Convenção SOLAS, com vista à participação no sistema mundial de socorro
    e segurança marítima (GMDSS) e não referido na Directiva 96/98/CE do Conselho
    relativa aos equipamentos marítimos [notificada com o número C(2000) 2719]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 22. septembra 2000 o uplatňovaní článku 3 ods.
    3 písm. e) smernice 1999/5/ES na námorné rádiové zariadenie určené na inštaláciu
    na námorné lode, ktoré nepodliehajú dohovoru SOLAS, a ktoré sa podieľa na
    globálnom núdzovom a bezpečnostnom systéme na mori (GMDSS) a nie je predmetom
    smernice 96/98/ES o námornom vybavení (oznámené pod číslom dokumentu C(2000)
    2719)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 22. septembra 2000 o uporabi člena 3(3)(e) Direktive
    1999/5/ES za pomorske radiokomunikacijske naprave, namenjene za vgradnjo v morska
    plovila, ki niso zajeta s Konvencijo SOLAS, in predvidene za vključitev v univerzalni
    pomorski sistem za varnost in stisko na morju (GMDSS) ter niso zajete z Direktivo
    Sveta 96/98/ES o pomorski opremi (notificirano pod dokumentarno številko K(2000)
    2719)
  type: main
- language: es
  script: Latn
  content: '2000/638/CE: Decisión de la Comisión, de 22 de septiembre de 2000, relativa
    a la aplicación de la letra e) del apartado 3 del artículo 3 de la Directiva
    1999/5/CE a los equipos marinos de comunicación por radio destinados a su instalación
    en buques marítimos no cubiertos por el Convenio SOLAS, con objeto de participar
    en el sistema mundial de socorro y seguridad marítima (SMSSM), y no cubiertos
    tampoco por la Directiva 96/98/CE del Consejo sobre equipos marinos [notificada
    con el número C(2000) 2719]'
  type: main
- language: sv
  script: Latn
  content: '2000/638/EG: Kommissionens beslut av den 22 september 2000 om tillämpningen
    av artikel 3.3 e i direktiv 1999/5/EG på marin radioutrustning vilken är avsedd
    att installeras på de havsgående fartyg som inte omfattas av SOLAS för deltagande
    i det globala nödsignals- och säkerhetssystemet till sjöss (GMDSS) och vilken
    inte omfattas av rådets direktiv 96/98/EG om marin utrustning [delgivet med nr
    K(2000) 2719]'
