- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2232/86 of 16 July 1986 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export amending Regulation (EEC) No 1687/76 and repealing
    Regulation (EEC) No 1573/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2232/86 de la Commission du 16 juillet 1986 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d' intervention et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76 et abrogant le
    règlement (CEE) n° 1573/86
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2232/86 der Kommission vom 16. Juli 1986 über den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch aus Beständen einiger Interventionsstellen
    nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung
    (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG) Nr. 1573/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2232/86 af 16. juli 1986 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på udførsel og om ændring af forordning (EØF) nr. 1687/76 og om
    ophævelse af forordning (EØF) nr. 1573/86
  type: main
- language: el
  script: Grek
