title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2908/92 of 6 October 1992 amending Regulation
    (EEC) No 2178/92 determining, for tobacco from the 1991 harvest, the quantity
    actually produced and the prices and premiums payable under the system of maximum
    guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2908/92 de la Commission, du 6 octobre 1992, modifiant
    le règlement (CEE) n° 2178/92 établissant, pour le tabac de la récolte 1991,
    la production effective ainsi que les prix et les primes à payer en application
    du régime des quantités maximales garanties
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2908/92 der Kommission vom 6. Oktober 1992 zur Änderung
    der Verordnung (EWG) Nr. 2178/92 zur Festlegung der tatsächlichen Erzeugung und
    zur Festsetzung der in Anwendung der Regelung der Höchstgarantiemengen zu zahlenden
    Preise und Prämien für Tabak der Ernte 1991
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2908/92 af 6. oktober 1992 om ændring
    af forordning (EØF) nr. 2178/92 om fastsættelse af den faktiske produktion af
    samt de priser og præmier, der i henhold til ordningen med maksimale garantimængder
    skal betales for tobak fra 1991-høsten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2908/92 της Επιτροπής
    της 6ης Οκτωβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2178/92 περί καθορισμού,
    για τον καπνό της συγκομιδής 1991, της πραγματικής
    παραγωγής καθώς και των τιμών και πριμοδοτήσεων
    που πληρώνονται κατ' εφαρμογήν του καθεστώτος
    των μέγιστων εγγυημένων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2908/92 della Commissione, del 6 ottobre 1992, che
    modifica il regolamento (CEE) n. 2178/92 che stabilisce, per il tabacco del raccolto
    1991, la produzione effettiva, nonché i prezzi ed i premi da pagare in applicazione
    del regime dei quantitativi massimi garantiti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2908/92 van de Commissie van 6 oktober 1992 tot wijziging
    van Verordening (EEG) nr. 2178/92 tot bepaling van de werkelijke produktie voor
    tabakssoorten van de oogst 1991 en tot vaststelling van de geldende prijzen en
    premies in het kader van de regeling inzake gegarandeerde maximumhoeveelheden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2908/92 da Comissão, de 6 de Outubro de 1992, que
    altera o Regulamento (CEE) n° 2178/92, que estabelece, para o tabaco da colheita
    de 1991, a produção efectiva, bem como os preços e os prémios a pagar em aplicação
    do regime de quantidades máximas garantidas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2908/92 de la Comisión, de 6 de octubre de 1992,
    que modifica el Reglamento (CEE) n° 2178/92 por el que se establecen, para el
    tabaco de la cosecha de 1991, la producción efectiva, los precios y las primas
    que deberán pagarse en aplicación del régimen de las cantidades máximas garantizadas
  type: main
