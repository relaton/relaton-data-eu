title:
- language: en
  script: Latn
  content: '91/511/EEC: Commission Decision of 23 September 1991 accepting an undertaking
    offered in connection with the countervailing proceeding concerning imports of
    polyester fibres and polyester yarns originating in Turkey and terminating the
    investigation'
  type: main
- language: fr
  script: Latn
  content: '91/511/CEE: Décision de la Commission du 23 septembre 1991 portant acceptation
    d''un engagement dans le cadre de la procédure antisubventions concernant les
    importations de fibres et de fils de polyester originaires de Turquie et portant
    clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 23. September 1991 über die Annahme einer
    Verpflichtung im Rahmen des Antisubventionsverfahrens betreffend die Einfuhren
    von Polyesterspinnfasern und Polyestergarnen mit Ursprung in der Türkei und über
    die Einstellung des Verfahrens (91/511/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 23. september 1991 om godtagelse af tilsagn
    afgivet i forbindelse med antisubsidieproceduren vedrørende importen af fibre
    og garn af polyester med oprindelse i Tyrkiet og om afslutning af undersøgelsen
    (91/511/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/511/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Σεπτεμβρίου 1991 για την αποδοχή ανάληψης υποχρέωσης
    σχετικά με τη διαδικασία επιβολής αντισταθμιστικών
    δασμών όσον αφορά τις εισαγωγές ινών και νημάτων
    από πολυεστέρα, καταγωγής Τουρκίας και για
    την περάτωση της έρευνας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 23 settembre 1991 relativa all'' accettazione
    di un impegno offerto nell'' ambito della procedura antisovvenzioni riguardante
    le importazioni di fibre e di filati di poliesteri originari della Turchia e alla
    chiusura dell'' inchiesta (91/511/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 23 september 1991 tot aanvaarding van een
    verbintenis aangeboden in verband met de anti-subsidieprocedure betreffende de
    invoer van polyestervezels en polyestergarens van oorsprong uit Turkije en tot
    beëindiging van het onderzoek (91/511/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 23 de Setembro de 1991 que aceita um compromisso
    oferecido em relação ao processo de compensação relativo às importações
    de fibras de poliéster e de fios de poliéster, originários da Turquia, e que
    encerra o inquérito (91/511/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 23 de septiembre de 1991 por la que se acepta
    un compromiso ofrecido en relación con el procedimiento compensatorio de las
    importaciones de fibras de poliéster e hilados de poliéster originarios de Turquía
    y se da por concluida la investigación (91/511/CEE) #'
