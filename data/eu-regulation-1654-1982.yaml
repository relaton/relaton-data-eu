title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1654/82 of 25 June 1982 fixing for the third
    quarter of 1982 the quantities of high-quality fresh, chilled or frozen beef and
    veal which may be imported under special conditions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1654/82 de la Commission, du 25 juin 1982, fixant les
    quantités de viandes bovines de haute qualité, fraîches, réfrigérées ou
    congelées pouvant être importées à des conditions spéciales pour le troisième
    trimestre de 1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1654/82 der Kommission vom 25. Juni 1982 zur Festsetzung
    der Mengen frischen, gekühlten oder gefrorenen Qualitätsrindfleisches, die für
    das dritte Vierteljahr 1982 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1654/82 af 25. juni 1982 om fastsættelse
    af de mængder fersk, kølet eller frosset oksekød af høj kvalitet, der kan
    indføres på særbetingelser i tredje kvartal af 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1654/82 της Επιτροπής
    της 25ης Ιουνίου 1982 περί καθορισμού των ποσοτήτων
    βοείου κρέατος ανωτέρας ποιότητος, νωπού, διατηρημένου
    δι' απλής ψύξεως η κατεψυγμένου, πού δύνανται
    να εισαχθούν υπό ειδικούς όρους για το τρίτο
    τρίμηνο του 1982
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1654/82 della Commissione, del 25 giugno 1982, che
    fissa le quantità di carni bovine di qualità pregiata, fresche, refrigerate
    o congelate, che possono essere importate a condizioni speciali per il terzo trimestre
    1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1654/82 van de Commissie van 25 juni 1982 tot vaststelling
    van de hoeveelheid vers, gekoeld of bevroren kwaliteitsrundvlees dat in het derde
    kwartaal van 1982 op bijzondere voorwaarden kan worden ingevoerd
  type: main
