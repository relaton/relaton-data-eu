  content: Regulation (EEC) No 1107/71 of the Commission of 28 May 1971 amending the
    Annex to Regulation (EEC) No 698/71 fixing standard values for fishery products
    withdrawn from the market and used in calculating financial compensation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1107/71 de la Commission, du 28 mai 1971, portant
