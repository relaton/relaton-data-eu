    dei prodotti della pesca ritirati dal mercato, figurante nel calcolo della compensazione
    finanziaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1107/71 van de Commissie van 28 mei 1971 houdende
