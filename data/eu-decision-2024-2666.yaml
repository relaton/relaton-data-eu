    2024 reconnaissant, conformément à l’article 31, paragraphes 2 et 4, de la
    directive (UE) 2018/2001, que le rapport contient des données précises aux fins
    de la mesure des émissions de gaz à effet de serre associées à la culture
    du blé, du seigle, du maïs, de l’orge, du triticale, de la betterave à sucre,
    du colza, d’herbe de plein champ et de prairies de fauche en Allemagne
  type: main
