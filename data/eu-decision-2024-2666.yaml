    efectos de la medición de las emisiones de gases de efecto invernadero asociadas
    al cultivo de trigo, centeno, maíz, cebada, tritical, remolacha azucarera, colza,
    cultivos forrajeros y hierba de pastizales en Alemania
  type: main
