title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2666 of 14 October 2024 recognising
    under Article 31(2) and (4) of Directive (EU) 2018/2001 that the report contains
    accurate data for the purposes of measuring the greenhouse gas emissions associated
    with the cultivation of wheat, rye, maize, barley, triticale, sugar beet, rapeseed,
    field grass and grassland cuttings in Germany
  type: main
- language: fr
  script: Latn
