title:
- language: en
  script: Latn
  content: '96/127/EC: Commission Decision of 22 January 1996 on the application,
    at the request of Germany, of Article 5 (4) of Council Directive 93/75/EEC concerning
    minimum requirements for vessels bound for or leaving Community ports and carrying
    dangerous or polluting goods (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/127/CE: Décision de la Commission, du 22 janvier 1996, en application,
    sur demande de l''Allemagne, de l''article 5 paragraphe 4 de la directive 93/75/CEE
    du Conseil relative aux conditions minimales exigées pour les navires à destination
    des ports maritimes de la Communauté ou en sortant et transportant des marchandises
    dangereuses ou polluantes (Le texte en langue allemande est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/127/EG: Entscheidung der Kommission vom 22. Januar 1996 betreffend
    die von Deutschland beantragte Anwendung von Artikel 5 Absatz 4 der Richtlinie
    93/75/EWG des Rates über Mindestanforderungen an Schiffe, die Seehäfen der Gemeinschaft
    anlaufen oder aus ihnen auslaufen und gefährliche oder umweltschädliche Güter
    befördern (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/127/EF: Kommissionens beslutning af 22. januar 1996 efter anmodning
    fra Tyskland i henhold til artikel 5, stk. 4, i Rådets direktiv 93/75/EØF om
    mindstekrav til skibe, som er på vej til eller fra Fællesskabets søhavne med
    farligt eller forurenende gods (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/127/ΕΚ: Απόφαση της Επιτροπής, της 22ας Ιανουαρίου
    1996, για εφαρμογή κατόπιν αιτήσεως της Γερμανίας
    του άρθρου 5 παράγραφος 4 της οδηγίας 93/75/ΕΟΚ
    του Συμβουλίου για τις ελάχιστες προδιαγραφές
    που απαιτούνται για τα πλοία τα οποία κατευθύνονται
    σε ή αποπλέουν από κοινοτικούς λιμένες μεταφέροντας
    επικίνδυνα ή ρυπογόνα εμπορεύματα (Το κείμενο
    στη γερμανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/127/EY: Komission päätös, tehty 22 päivänä tammikuuta 1996, vaarallisia
    tai ympäristöä pilaavia aineita kuljettavia aluksia koskevista vähimmäisvaatimuksista
    niiden ollessa matkalla yhteisön merisatamiin tai poistuessa sieltä annetun
    neuvoston direktiivin 93/75/ETY 5 artiklan 4 kohdan soveltamisesta Saksan pyynnöstä
    (Ainoastaan saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/127/CE: Decisione della Commissione, del 22 gennaio 1996, in applicazione,
    su domanda della Germania, dell''articolo 5, paragrafo 4, della direttiva 93/75/CEE
    del Consiglio, relativa alle condizioni minime necessarie per le navi dirette
    a porti marittimi della Comunità o che ne escono e che trasportano merci pericolose
    o inquinanti (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/127/EG: Beschikking van de Commissie van 22 januari 1996 ter uitvoering,
    op verzoek van Duitsland, van artikel 5, lid 4, van Richtlijn 93/75/EEG van de
    Raad betreffende de minimumeisen voor schepen die gevaarlijke of verontreinigende
    goederen vervoeren en die naar of uit de zeehavens van de Gemeenschap varen (Slechts
    de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/127/CE: Decisão da Comissão, de 22 de Janeiro de 1996, em aplicação,
    a pedido da Alemanha, do nº 4 do artigo 5º da Directiva 93/75/CEE do Conselho,
    relativa às condições mínimas exigidas aos navios com destino aos portos marítimos
    da Comunidade ou que deles saiam transportando mercadorias perigosas ou poluentes
    (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '96/127/CE: Decisión de la Comisión, de 22 de enero de 1996, en aplicación,
    a petición de Alemania, del apartado 4 del artículo 5 de la Directiva 93/75/CEE
    del Consejo sobre las condiciones mínimas exigidas a los buques con destino a
    los puertos marítimos de la Comunidad o que salgan de los mismos y transporten
    mercancías peligrosas o contaminantes (El texto en lengua alemana es el único
    auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/127/EG: Kommissionens beslut av den 22 januari 1996 om tillämpning
    på begäran av Tyskland av artikel 5.4 i rådets direktiv 93/75/EEG om minimikrav
    för fartyg som anlöper eller avgår från gemenskapens hamnar med farligt eller
    förorenande gods (Endast den tyska texten är giltig)'
  type: main
