title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 165/81 of 21 January 1981 amending for the
    fifth time Regulation (EEC) No 2872/79 fixing an additional rate for determining
    the quantities of alcohol to be delivered for compulsory distillation for the
    1979/80 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 165/81 de la Commission, du 21 janvier 1981, portant
    cinquième modification du règlement (CEE) n° 2872/79 fixant un taux supplémentaire
    pour la détermination des quantités d' alcool à livrer dans le cadre des prestations
    viniques pour la campagne 1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 165/81 der Kommission vom 21. Januar 1981 zur fünften
    Änderung der Verordnung (EWG) Nr. 2872/79 zur Festsetzung eines zusätzlichen
    Satzes für die Bestimmung der im Rahmen der obligatorischen Destillation zu liefernden
    Alkoholmenge für das Wirtschaftsjahr 1979/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 165/81 af 21. januar 1981 om femte
    ændring af forordning (EØF) nr. 2872/79 om fastsættelse af en tillægssats
    for fastlæggelse af de mængder alkohol, der skal indleveres inden for rammerne
    af de pligtige vinydelser for produktionsåret 1979/80
  type: main
- language: el
  script: Grek
