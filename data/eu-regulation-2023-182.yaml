title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/182 of 23 November 2022 correcting
    certain language versions of Annex III to Delegated Regulation (EU) 2019/2122
    supplementing Regulation (EU) 2017/625 of the European Parliament and of the Council
    as regards certain categories of animals and goods exempted from official controls
    at border control posts, specific controls on passengers’ personal luggage and
    on small consignments of goods sent to natural persons which are not intended
    to be placed on the market
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/182 de la Commission du 23 novembre 2022
    rectifiant certaines versions linguistiques de l’annexe III du règlement délégué
    (UE) 2019/2122 complétant le règlement (UE) 2017/625 du Parlement européen
    et du Conseil en ce qui concerne certaines catégories d’animaux et de biens
    exemptées des contrôles officiels aux postes de contrôle frontaliers, des contrôles
    spécifiques des bagages personnels des passagers et de petits envois de biens
    expédiés à des personnes physiques, qui ne sont pas destinés à être mis
    sur le marché
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/182 der Kommission vom 23. November 2022
