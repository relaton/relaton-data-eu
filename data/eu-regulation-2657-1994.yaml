  script: Latn
  content: Commission Regulation (EC) No 2657/94 of 31 October 1994 re-establishing
    the levying of customs duties applicable to products falling within CN code 3102
    40, originating in Poland, to which the tariff ceilings set out in Council Regulation
    (EEC) No 3918/92 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2657/94 de la Commission du 31 octobre 1994 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3102 40 originaires de Pologne, bénéficiaires de plafonds tarifaires
    prévus par le règlement (CEE) n° 3918/92 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2657/94 DER KOMMISSION vom 31. Oktober 1994 zur Wiedereinführung
