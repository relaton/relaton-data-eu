title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1785/90 of 28 June 1990 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    to fruit and vegetables as regards tomatoes, lettuce, carrots, table grapes, melons,
    apricots peaches and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1785/90 de la Commission du 28 juin 1990 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges dans le secteur des fruits et légumes en ce qui concerne les tomates,
    les laitues, les carottes, les raisins de table, les melons, les abricots, les
    pêches et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1785/90 DER KOMMISSION vom 28. Juni 1990 zur Festsetzung
    zusaetzlicher Bestimmungen zur Anwendung des ergaenzenden Handelsmechanismus im
    Sektor Obst und Gemuese hinsichtlich Tomaten, Salat, Karotten, Tafeltrauben, Melonen,
    Aprikosen, Pfirsichen und Erdbeeren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1785/90 af 28. juni 1990 om fastsættelse
    af visse yderligere gennemførelsesbestemmelser for den supplerende mekanisme
    for samhandelen i sektoren for frugt og grønsager, for så vidt angår tomater,
    salat, gulerødder, druer til spisebrug, meloner, abrikoser, ferskner og jordbær
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1785/90 περί καθορισμού
    ορισμένων πρόσθετων λεπτομερειών για την εφαρμογή
    του συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις τομάτες, τα μαρούλια, τα καρότα, τα επιτραπέζια
    σταφύλια, τα πεπόνια, τα βερίκοκα, τα ροδάκινα
    και τις φράουλες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1785/90 DELLA COMMISSIONE del 28 giugno 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    applicabile agli scambi nel settore degli ortofrutticoli per quanto riguarda i
    pomodori, le lattughe, le carote, le uve da tavola i meloni, le albicocche, le
    pesche e le fragole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1785/90 VAN DE COMMISSIE van 28 juni 1990 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer in de sector groenten en fruit, ten aanzien van tomaten, sla,
    wortelen, tafeldruiven, meloenen, abrikozen, perziken en aardbeien
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1785/90 DA COMISSAO de 28 de Junho de 1990 que fixa
    determinadas regras complementares para execuçao do mecanismo complementar aplicavel
    às trocas comerciais no sector das frutas e produtos horticolas, no que se refere
    aos tomates, alfaces, cenouras, uvas de mesa, meloes, damascos, pêssegos e morangos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1785/90 DE LA COMISION de 28 de junio de 1990 por el
    que se establecen determinadas disposiciones adicionales de aplicacion del mecanismo
    complementario aplicable a los intercambios en el sector de las frutas y hortalizas
    en lo que se refiere a los tomates, las lechugas, las zanahorias, las uvas de
    mesa, los melones, los albaricoques, los melocotones y las fresas
