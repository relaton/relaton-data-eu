    consumo humano directo de certos vinhos importados da Argentina susceptíveis
    de terem sido objecto de práticas enológicas não previstas no Regulamento (CE)
    n. o 1493/1999
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 519/2007 al Consiliului din 7 mai 2007 de modificare
    a Regulamentului (CE) nr. 527/2003 privind autorizarea ofertei și livrării destinate
    consumului uman direct a anumitor vinuri importate din Argentina, susceptibile
    de a fi făcut obiectul unor tratamente oenologice care nu sunt prevăzute în
    Regulamentul (CE) nr. 1493/1999
  type: main
- language: sk
  script: Latn
