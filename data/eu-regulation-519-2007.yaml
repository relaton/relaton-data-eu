title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 519/2007 of 7 May 2007 amending Regulation (EC)
    No 527/2003 authorising the offer and delivery for direct human consumption of
    certain wines imported from Argentina which may have undergone oenological processes
    not provided for in Regulation (EC) No 1493/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 519/2007 du Conseil du 7 mai 2007 modifiant le règlement
    (CE) n o 527/2003 autorisant l’offre et la livraison à la consommation humaine
    directe de certains vins importés d’Argentine susceptibles d’avoir fait l’objet
    de pratiques œnologiques non prévues par le règlement (CE) n o 1493/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 519/2007 des Rates vom 7. Mai 2007 zur Änderung der
    Verordnung (EG) Nr. 527/2003 zur Genehmigung des Anbietens oder der Abgabe zum
    unmittelbaren menschlichen Verbrauch von bestimmten aus Argentinien eingeführten
    Weinen, bei denen angenommen werden kann, dass sie Gegenstand von in der Verordnung
    (EG) Nr. 1493/1999 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: bg
  script: Cyrl
