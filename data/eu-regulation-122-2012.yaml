    betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 122/2012 z dnia 13 lutego 2012
    r. zmieniające, w odniesieniu do substancji metyloprednizolon, załącznik do
    rozporządzenia (UE) nr 37/2010 w sprawie substancji farmakologicznie czynnych
    i ich klasyfikacji w odniesieniu do maksymalnych limitów pozostałości w środkach
