    účinných látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí
    v potravinách živočíšneho pôvodu týkajúce sa látky metylprednizolón
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 122/2012 z dne 13. februarja 2012 o
    spremembi Priloge k Uredbi (EU) št. 37/2010 o farmakološko aktivnih snoveh in
    njihovi razvrstitvi glede mejnih vrednosti ostankov v živilih živalskega izvora
    v zvezi s snovjo metilprednizolon
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 122/2012 de la Comisión, de 13 de febrero
