  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 122/2012 da Comissão, de 13 de fevereiro
    de 2012 , que altera o anexo do Regulamento (UE) n. ° 37/2010 relativo a substâncias
    farmacologicamente ativas e respetiva classificação no que respeita aos limites
    máximos de resíduos nos alimentos de origem animal, relativamente à substância
    metilprednisolona
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 122/2012 al Comisiei din 13
    februarie 2012 de modificare a anexei la Regulamentul (UE) nr. 37/2010 privind
    substanțele active din punct de vedere farmacologic și clasificarea lor în
    funcție de limitele reziduale maxime din produsele alimentare de origine animală,
    în ceea ce privește substanța metilprednisolon
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 122/2012 z 13. februára 2012
