  script: Latn
  content: Commission Implementing Regulation (EU) No 122/2012 of 13 February 2012
    amending the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance methylprednisolone
  type: main
- language: fr
  script: Latn
