  content: Commission Regulation (EC) No 419/94 of 25 February 1994 laying down certain
    additional detailed rules for the application of the Supplementary Trade Mechanism
    (STM) between Spain and the Community as constituted on 31 December 1985 as regards
    certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 419/94 de la Commission du 25 février 1994 fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) entre l'Espagne et la Communauté dans sa composition au 31
    décembre 1985 en ce qui concerne certains fruits et légumes
  type: main
- language: de
  script: Latn
