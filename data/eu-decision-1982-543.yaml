title:
- language: en
  script: Latn
  content: '82/543/EEC: Commission Decision of 6 August 1982 accepting an undertaking
    given in connection with the anti-dumping proceeding concerning paracetamol (INN)
    crystals or powder originating in China and terminating the proceeding'
  type: main
- language: fr
  script: Latn
  content: '82/543/CEE: Décision de la Commission, du 6 août 1982, portant acceptation
    d'' un engagement souscrit dans le cadre de la procédure anti-"dumping" concernant
    les importations de cristaux ou poudre de paracétamol (INN) originaires de Chine
    et portant clôture de la procédure)'
  type: main
- language: de
  script: Latn
  content: '82/543/EWG: Beschluß der Kommission vom 6. August 1982 über die Annahme
    einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend die Einfuhr
    von Paracetamol (INN) in Kristall- oder Pulverform mit Ursprung in China und über
    die Einstellung des Verfahrense'
  type: main
- language: da
  script: Latn
  content: '82/543/EØF: Kommissionens afgørelse af 6. august 1982 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende paracetamol (INN),
    krystaller eller pulver, med oprindelse i Kina og om afslutning af denne procedurel'
  type: main
- language: el
  script: Grek
  content: '82/543/EOK: Απόφαση τής Επιτροπής τής 6ης Αυγούστου
    1982 περί αποδοχής αναλήψεως υποχρεώσεων σχετικά
    μέ τή διαδικασία αντιντάμπινγκ όσον αφορά
    τίς εισαγωγές κρυστάλλων ή κόνεως παρακεταμόλης
    (INN) καταγωγής Κίνας καί περί περατώσεως τής
    διαδικασίας'
  type: main
- language: it
  script: Latn
  content: '82/543/CEE: Decisione della Commissione, del 6 agosto 1982, che accetta
    gli impegni assunti nell'' ambito della procedura antidumping relativa alle importazioni
    di paracetamolo in cristalli o in polvere (CID) originario della Cina e che conclude
    tale procedura'
  type: main
- language: nl
  script: Latn
  content: '82/543/EEG: Besluit van de Commissie van 6 augustus 1982 houdende aanvaarding
