title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1188/88 of 29 April 1988 specifying the
    extent to which applications lodged in April 1988 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1188/88 de la Commission, du 29 avril 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1988 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1188/88 der Kommission vom 29. April 1988 über das
    Ausmaß, in dem den im April 1988 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1188/88 af 29. april 1988 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1988 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1188/88 της Επιτροπής
    της 29ης Απριλίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο του 1988, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1188/88 della Commissione, del 29 aprile 1988, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1988 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1188/88 van de Commissie van 29 april 1988 waarbij
