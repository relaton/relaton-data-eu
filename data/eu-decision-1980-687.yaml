id: EUDecision1980687
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/687/EEC: Commission Decision of 26 June 1980 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, falling
    within subheading 61.03 A of the Common Customs Tariff (category 8), originating
    in South Korea and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/687/CEE: Décision de la Commission, du 26 juin 1980, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes tissées, de la sous-position 61.03 A du tarif douanier commun (catégorie
    8), originaires de la Corée du Sud et mises en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/687/EWG: Entscheidung der Kommission vom 26. Juni 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, für Männer und Knaben, der Tarifstelle 61.03 A des Gemeinsamen
    Zolltarifs (Kategorie 8) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/687/EØF: Kommissionens beslutning af 26. juni 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter) til mænd og drenge, som henhører under
    pos. 61.03 A i den fælles toldtarif (kategori 8), har oprindelse i Sydkorea og
    frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/687/CEE: Decisione della Commissione, del 26 giugno 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e camicette
    tessute per uomo e per ragazzo, della sottovoce 61.03 A della tariffa doganale
    comune, categoria 8, originarie della Corea del Sud e messe in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/687/EEG: Beschikking van de Commissie van 26 juni 1980 waarbij de Franse
    Republiek wordt gemachtigd overhemden en sporthemden, geweven, van post 61.03
    A van het gemeenschappelijk douanetarief (categorie 8), van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
