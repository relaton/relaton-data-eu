    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3532/73 della Commissione, del 28 dicembre 1973, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 gennaio 1974,
    allo zucchero e al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3532/73 van de Commissie van 28 december 1973 houdende
