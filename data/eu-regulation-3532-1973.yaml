  script: Latn
  content: Regulation (EEC) No 3532/73 of the Commission of 28 December 1973 fixing
    the rates of the refunds applicable from 1 January 1974 to sugar and molasses
    exported in the form of goods not covered by the Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3532/73 de la Commission, du 28 décembre 1973, fixant
    les taux des restitutions applicables, à compter du 1er janvier 1974, au sucre
    et à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3532/73 der Kommission vom 28. Dezember 1973 zur Festsetzung
