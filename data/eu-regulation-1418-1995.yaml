  content: Commission Regulation (EC) No 1418/95 of 23 June 1995 fixing for the 1995/96
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1418/95 de la Commission, du 23 juin 1995, fixant, pour
    la campagne 1995/1996, le prix minimal à payer aux producteurs pour les figues
    sèches non transformées ainsi que le montant de l'aide à la production pour
    les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1418/95 der Kommission vom 23. Juni 1995 zur Festsetzung
    des den Erzeugern unverarbeiteter getrockneter Feigen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe für getrocknete Feigen im Wirtschaftsjahr 1995/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1418/95 af 23. juni 1995 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede tørrede figner
    i produktionsåret 1995/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1418/95 της Επιτροπής
    της 23ης Ιουνίου 1995 σχετικά με τον καθορισμό,
    για την περίοδο εμπορίας 1995/96 της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    τα μη μεταποιημένα ξηρά σύκα και του ποσού
    της ενίσχυσης στην παραγωγή για τα ξηρά σύκα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1418/95, annettu 23 päivänä kesäkuuta 1995,
    jalostamattomien kuivattujen viikunoiden tuottajille maksettavan vähimmäishinnan
    ja kuivattujen viikunoiden tuotantotuen vahvistamisesta markkinointivuodeksi 1995/1996
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1418/95 della Commissione, del 23 giugno 1995, che
    fissa, per la campagna di commercializzazione 1995/1996, il prezzo minimo da pagare
    ai produttori di fichi secchi non trasformati e l'importo dell'aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1418/95 van de Commissie van 23 juni 1995 tot vaststelling,
