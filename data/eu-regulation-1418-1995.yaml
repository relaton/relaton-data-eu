    aan de telers te betalen minimumprijs, alsmede van het bedrag van de produktiesteun
    voor gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1418/95 da Comissão, de 23 de Junho de 1995, que
    fixa, para a campanha de comercialização de 1995/1996, o preço mínimo a pagar
    aos produtores para os figos secos não transformados e o montante da ajuda à
    produção para os figos secos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1418/95 de la Comisión, de 23 de junio de 1995, por
