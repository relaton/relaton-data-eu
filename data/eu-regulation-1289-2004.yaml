  content: Commission Regulation (EC) No 1289/2004 of 14 July 2004 concerning the
    authorisation for 10 years of the additive Deccox® in feedingstuffs, belonging
    to the group of coccidiostats and other medicinal substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1289/2004 de la Commission du 14 juillet 2004 concernant
