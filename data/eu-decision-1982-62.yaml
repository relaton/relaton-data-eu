title:
- language: en
  script: Latn
  content: '82/62/EEC: Commission Decision of 18 December 1981 authorizing the United
    Kingdom to grant exemptions from Council Regulation (EEC) No 543/69 on the harmonization
    of certain social legislation relating to road transport (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/62/CEE: Décision de la Commission, du 18 décembre 1981, autorisant
    le Royaume-Uni à accorder des dérogations au règlement (CEE) n° 543/69 du
    Conseil, relatif à l''harmonisation de certaines dispositions en matière sociale
    dans le domaine des transports par route (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/62/EWG: Entscheidung der Kommission vom 18. Dezember 1981 zur Ermächtigung
    des Vereinigten Königreichs, Ausnahmen von der Verordnung (EWG) Nr. 543/69 des
    Rates über die Harmonisierung bestimmter Sozialvorschriften im Straßenverkehr
    zuzulassen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/62/EØF: Kommissionens beslutning af 18. december 1981 om bemyndigelse
    til Det forenede Kongerige til at meddele undtagelser fra Rådets forordning (EØF)
    nr. 543/69 om harmonisering af visse bestemmelser på det sociale område inden
    for landevejstransport (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/62/EOK: Απόφαση τής Επιτροπής τής 18ης Δεκεμβρίου
    1981 περί παροχής αδείας στό Ηνωμένο Βασίλειο
    τής Μεγάλης Βρετανίας καί Βορείου Ιρλανδίας
    νά εξαιρεί από τήν εφαρμογή τού κανονισμού
    (EOK) αριθ. 543/69 τού Συμβουλίου περί τής εναρμονίσεως
    ορισμένων κοινωνικών διατάξεων πού αφορούν
    τίς οδικές μεταφορές (Το κείμενο στην αγγλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/62/CEE: Decisione della Commissione, del 18 dicembre 1981, che autorizza
    il Regno Unito di Gran Bretagna e Irlanda del Nord ad applicare talune misure
    in deroga al regolamento (CEE) n. 543/69 del Consiglio, relativo all''armonizzazione
    di alcune disposizioni in materia sociale nel settore dei trasporti su strada
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/62/EEG: Beschikking van de Commissie van 18 december 1981 waarbij het
