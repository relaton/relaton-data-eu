title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1233/72 of the Council of 15 June 1972 on the partial
    suspension of the autonomous Common Customs Tariff duty on mackerel, fresh, chilled
    or frozen, whole, headless or in pieces, falling within subheading No ex 03.01
    B I (m) 2 and intended for the processing industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1233/72 du Conseil, du 15 juin 1972, portant suspension
    partielle du droit autonome du tarif douanier commun sur les maquereaux frais,
    réfrigérés ou congelés, entiers, décapités ou tronçonnés, destinés à
    l' industrie de transformation, de la sous-position ex 03.01 B I m) 2
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1233/72 des Rates vom 15. Juni 1972 über die teilweise
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Makrelen,
    frisch, gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt, für die Verarbeitungsindustrie,
    der Tarifstelle ex 03.01 B I m) 2
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1233/72 af 15. juni 1972 om delvis suspension
    af den autonome toldsats i den fælles toldtarif for makrel, fersk, kølet eller
    frosset, hel, uden hoved, renset eller skåret, bestemt til forarbejdningsindustrien,
    under pos. ex 03.01 B.I.m) 2
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1233/72 del Consiglio, del 15 giugno 1972, che sospende
    parzialmente il dazio autonomo della tariffa doganale comune sugli sgombri freschi,
    refrigerati o congelati, interi, decapitati o in pezzi, destinati all' industria
    di trasformazione, della sottovoce ex 03.01 B I m) 2
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1233/72 van de Raad van 15 juni 1972 houdende gedeeltelijke
    schorsing van het autonome recht van het gemeenschappelijk douanetarief op makreel,
    vers, gekoeld of bevroren, ook indien ontdaan van kop of in moten gesneden, bestemd
    voor de verwerkende industrie, van onderverdeling ex 03.01 B I m) 2
  type: main
