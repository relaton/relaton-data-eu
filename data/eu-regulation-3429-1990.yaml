    της 27ης Νοεμβρίου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    της κατηγορίας 37 ( αύξων αριθμός 40.0370 ) και τα
    προϊόντα της κατηγορίας 75 ( αύξων αριθμός 40.0750
