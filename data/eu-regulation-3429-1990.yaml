    στον κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3429/90 DELLA COMMISSIONE del 27 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    di prodotti n. 37 (numero d'ordine 40.0370) e di prodotti della categoria di prodotti
    n. 75 (numero d'ordine 40.0750) originari della Tailandia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3429/90 VAN DE COMMISSIE van 27 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 37 (volgnummer 40.0370) en de produkten van categorie nr. 75
    (volgnummer 40.0750), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3429/90 DA COMISSAO de 27 de Novembro de 1990 que
