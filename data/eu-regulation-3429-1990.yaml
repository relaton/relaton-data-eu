title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3429/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to products of category No 37 (order
    No 40.0370) and the products of category No 75 (order No 40.0750) originating
    in Thailand, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3429/90 de la Commission du 27 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 37 (numéro d'ordre 40.0370) et aux produits de la catégorie
    n° 75 (numéro d'ordre 40.0750) originaires de la Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3429/90 DER KOMMISSION vom 27. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 37
    (lfd. Nummer 40.0370) und die Waren der Warenkategorie Nr. 75 (lfd. Nummer 40.0750)
    mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3897/89 des Rates
    vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3429/90 af 27. november 1990 om genindførelse
    af opkrævning af told for varer under varekategori 37 (løbenummer 40.0370) og
    varer under varekategori 75 (løbenummer 40.0750), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3897/89
  type: main
- language: el
  script: Grek
