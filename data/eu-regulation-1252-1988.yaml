  content: Commission Regulation (EEC) No 1252/88 of 4 May 1988 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export, amending Regulation (EEC) No 1687/76 and repealing
    Regulation (EEC) No 727/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1252/88 de la Commission du 4 mai 1988 relatif à
