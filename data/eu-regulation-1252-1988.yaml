    nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung
    (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG) Nr. 727/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1252/88 af 4. maj 1988 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
