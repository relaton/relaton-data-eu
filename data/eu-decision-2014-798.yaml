  type: main
- language: et
  script: Latn
  content: '2014/798/EL: Komisjoni rakendusotsus, 13. november 2014, millega muudetakse
    nõukogu direktiivi 64/432/EMÜ F lisa seoses veiste ja sigade liidusisese kaubanduse
    puhul kasutatava veterinaarsertifikaadi näidise vormiga ning kodusigade liidusiseses
