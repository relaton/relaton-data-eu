    în interiorul Uniunii de bovine și porcine și cerințele suplimentare în materie
    de sănătate cu privire la Trichinella pentru schimburile comerciale în interiorul
    Uniunii de porcine domestice [notificată cu numărul C(2014) 8336]'
  type: main
