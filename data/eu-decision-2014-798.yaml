    bid-dokument C(2014) 8336)'
  type: main
- language: nl
  script: Latn
  content: '2014/798/EU: Uitvoeringsbesluit van de Commissie van 13 november 2014
    tot wijziging van bijlage F bij Richtlijn 64/432/EEG van de Raad met betrekking
    tot het formaat van de modelgezondheidscertificaten voor het handelsverkeer van
