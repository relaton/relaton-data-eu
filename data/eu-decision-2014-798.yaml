    om ændring af bilag F til Rådets direktiv 64/432/EØF for så vidt angår formatet
    for standardsundhedscertifikaterne for samhandel inden for Unionen med kvæg og
    svin og de yderligere sundhedskrav vedrørende trikiner i forbindelse med handel
    inden for Unionen med tamsvin (meddelt under nummer C(2014) 8336)'
  type: main
- language: el
  script: Grek
