    όσον αφορά τη μορφή των υποδειγμάτων υγειονομικών
    πιστοποιητικών για το ενδοενωσιακό εμπόριο
    βοοειδών και χοιροειδών και τις συμπληρωματικές
    υγειονομικές απαιτήσεις όσον αφορά την Trichinella
    για το ενδοενωσιακό εμπόριο κατοικίδιων χοιροειδών
