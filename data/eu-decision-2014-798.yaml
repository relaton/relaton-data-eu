    za trgovinu govedima i svinjama unutar Unije te dodatnih zdravstvenih zahtjeva
    povezanih s trihinelom za trgovinu domaćim svinjama unutar Unije (priopćeno
    pod brojem dokumenta C(2014) 8336)'
  type: main
- language: hu
  script: Latn
  content: '2014/798/EU: A Bizottság végrehajtási határozata ( 2014. november
    13. ) a 64/432/EGK tanácsi irányelv F. mellékletének a szarvasmarhafélék
    és a sertések Unión belüli kereskedelmében alkalmazandó állat-egészségügyi
    bizonyítványminták formátuma és a házisertések Unión belüli kereskedelmét
    érintő, trichinellával kapcsolatos kiegészítő egészségügyi követelmények
    tekintetében történő módosításáról (az értesítés a C(2014) 8336. számú
    dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/798/UE: Decisione di esecuzione della Commissione, del 13 novembre
    2014 , che modifica l''allegato F della direttiva 64/432/CEE del Consiglio per
    quanto riguarda il formato dei modelli di certificati sanitari per gli scambi
    all''interno dell''Unione di animali delle specie bovina e suina e le ulteriori
    condizioni di polizia sanitaria relative alla presenza di Trichine per gli scambi
    all''interno dell''Unione di suini domestici [notificata con il numero C(2014)
    8336]'
  type: main
- language: lv
  script: Latn
  content: '2014/798/ES: Komisijas Īstenošanas lēmums ( 2014. gada 13. novembris
    ), ar ko attiecībā uz Savienības iekšējai tirdzniecībai ar liellopiem un
    cūkām paredzēto veselības sertifikātu paraugu veidlapām un papildu veselības
    prasībām, kuras Savienības iekšējā tirdzniecībā ar mājas cūkām piemērojamas
    attiecībā uz Trichinella , groza Padomes Direktīvas 64/432/EEK F pielikumu
    (izziņots ar dokumenta numuru C(2014) 8336)'
  type: main
- language: lt
  script: Latn
  content: '2014/798/ES: 2014 m. lapkričio 13 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl Sąjungos vidaus prekybos galvijais ir kiaulėmis sveikatos sertifikatų
    pavyzdžių formato ir papildomų sveikatos reikalavimų, susijusių su Trichinella
    ir taikomų Sąjungos vidaus prekybai naminėmis kiaulėmis, iš dalies keičiamas
    Tarybos direktyvos 64/432/EEB F priedas (pranešta dokumentu Nr. C(2014) 8336)'
  type: main
- language: mt
  script: Latn
