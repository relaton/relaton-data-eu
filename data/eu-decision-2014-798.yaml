    veterinárních osvědčení pro obchod se skotem a prasaty uvnitř Unie a doplňkové
    veterinární požadavky týkající se trichinel pro obchod s domácími prasaty
    uvnitř Unie (oznámeno pod číslem C(2014) 8336)'
  type: main
- language: da
  script: Latn
