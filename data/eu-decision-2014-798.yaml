    на формàта на образците на здравни сертификати
    за търговия в рамките на Съюза с говеда и със
    свине и относно допълнителните здравни изисквания
    във връзка с Trichinella при търговия в рамките на
    Съюза с домашни свине (нотифицирано под номер
    С(2014) 8336)'
  type: main
- language: cs
  script: Latn
  content: '2014/798/EU: Prováděcí rozhodnutí Komise ze dne 13. listopadu 2014,
