title:
- language: en
  script: Latn
  content: '2014/798/EU: Commission Implementing Decision of 13 November 2014 amending
    Annex F to Council Directive 64/432/EEC as regards the format of the model health
    certificates for intra-Union trade in bovine animals and swine and the additional
    health requirements relating to Trichinella for intra-Union trade in domestic
    swine (notified under document C(2014) 8336)'
  type: main
- language: fr
  script: Latn
  content: '2014/798/UE: Décision d''exécution de la Commission du 13 novembre 2014
    modifiant l''annexe F de la directive 64/432/CEE du Conseil en ce qui concerne
    le format des modèles de certificat sanitaire pour les échanges dans l''Union
    d''animaux des espèces bovines et porcines et les conditions sanitaires supplémentaires
    relatives à Trichinella applicables aux échanges dans l''Union de porcins domestiques
    [notifiée sous le numéro C(2014) 8336]'
  type: main
- language: de
  script: Latn
  content: '2014/798/EU: Durchführungsbeschluss der Kommission vom 13. November 2014
    über die Änderung von Anhang F der Richtlinie 64/432/EWG des Rates im Hinblick
    auf das Format der Mustergesundheitsbescheinigungen für den Handel mit Rindern
    und Schweinen innerhalb der Union und auf die zusätzlichen Gesundheitsanforderungen
    bezüglich Trichinen beim Handel mit Hausschweinen innerhalb der Union (Bekannt
    gegeben unter Aktenzeichen C(2014) 8336)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/798/ЕС: Решение за изпълнение на Комисията
