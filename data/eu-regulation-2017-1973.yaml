    effectuer sur les produits de la pêche capturés par des navires battant pavillon
    d'un État membre et introduits dans l'Union après être passés par des pays
    tiers, et établissant un modèle de certificat sanitaire pour ces produits
  type: main
- language: de
  script: Latn
