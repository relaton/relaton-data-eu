  script: Latn
  content: Commission Regulation (EU) 2017/1973 of 30 October 2017 amending Regulation
    (EC) No 2074/2005 as regards official controls on fishery products caught by vessels
    flying the flag of a Member State and introduced into Union after being transferred
    in third countries and establishing a model health certificate for those products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/1973 de la Commission du 30 octobre 2017 modifiant
