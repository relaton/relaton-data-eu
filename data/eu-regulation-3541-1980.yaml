    Preisbedingung für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung in Spanien
    in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3541/80 af 22. december 1980 om ændring
