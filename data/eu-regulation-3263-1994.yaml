  content: Commission Regulation (EC) No 3263/94 of 20 December 1994 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1995
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3263/94 de la Commission, du 20 décembre 1994, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1995 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3263/94 der Kommission vom 20. Dezember 1994 zur Festsetzung
