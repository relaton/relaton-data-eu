    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3263/94 af 20. december 1994 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1995
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3263/94 της Επιτροπής
    της 20ής Δεκεμβρίου 1994 περί καθορισμού της κατ’αποκοπήν
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1995
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντιστάθμισης και της σχετικής προκαταβολής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 3263/94, annettu 20 päivänä joulukuuta 1994,
    kalastusvuoden 1995 aikana markkinoilta vedettyjen kalastustuotteiden taloudellisen
    korvauksen ja sen ennakon laskennassa käytettävästä kiinteästä arvosta (ETAn
    kannalta merkityksellinen teksti)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3263/94 della Commissione, del 20 dicembre 1994, che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1995
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3263/94 van de Commissie van 20 december 1994 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1995 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3263/94 da Comissão, de 20 de Dezembro de 1994, que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1995
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3263/94 de la Comisión, de 20 de diciembre de 1994,
