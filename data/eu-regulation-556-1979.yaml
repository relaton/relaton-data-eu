title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 556/79 of 23 March 1979 amending for the
    fifth time the list in Regulation (EEC) No 572/73 of egg and poultrymeat products
    eligible for the advance fixing of export refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 556/79 de la Commission, du 23 mars 1979, portant
    cinquième modification du règlement (CEE) n° 572/73 en ce qui concerne la liste
    des produits des secteurs des oeufs et de la viande de volaille bénéficiant
    du régime de la fixation à l' avance des restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 556/79 der Kommission vom 23. März 1979 zur fünften
    Änderung der Verordnung (EWG) Nr. 572/73 einschließlich der Liste der Erzeugnisse
    auf dem Eiersektor und auf dem Sektor Geflügelfleisch, die für eine Vorausfestsetzung
    der Ausfuhrerstattung in Frage kommen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 556/79 af 23. marts 1979 om femte ændring
    af forordning (EØF) nr. 572/73 for så vidt angår listen over de æg- og fjerkrækødprodukter,
    der kommer i betragtning ved forudfastsættelse af eksportrestitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 556/79 της Επιτροπής της
    23ης Μαρτίου 1979 περί πέμπτης τροποποιήσεως
    του κανονισμού (EOK) αριθ. 572/73 όσον αφορά τον
    κατάλογο των προϊόντων των τομέων των αυγών
    και του κρέατος πουλερικών για τα οποία ισχύει
    το καθεστώς του προκαθορισμού των επιστροφών
    κατά την εξαγωγή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 556/79 della Commissione, del 23 marzo 1979, recante
    quinta modifica del regolamento (CEE) n. 572/73 per quanto concerne l' elenco
    dei prodotti del settore delle uova e del pollame ai quali è concesso il beneficio
    della fissazione anticipata della restituzione all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 556/79 van de Commissie van 23 maart 1979 houdende
    vijfde wijziging van Verordening (EEG) nr. 572/73 ten aanzien van de lijst van
    produkten in de sector eieren en de sector slachtpluimvee die voor vaststelling
    vooraf van de uitvoerrestitutie in aanmerking komen
