id: EURegulation15291974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1529/74 of the Commission of 19 June 1974 re-establishing
    the levying of the customs duties on electrical goods, etc., parts, falling within
    subheading 85.01 C, originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1529/74 de la Commission, du 19 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux machines
    génératrices, etc., parties et pièces détachées, de la sous-position tarifaire
    85.01 C, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1529/74 der Kommission vom 19. Juni 1974 zur Wiedereinführung
    des Zollsatzes für elektrische Generatoren, Motoren und rotierende Umformer usw.,
    der Tarifstelle 85.01 C, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1529/74 af 19. juni 1974 om genindførelse
    af opkrævning af toldafgifter for elektriske generatorer etc., dele, underposition
    85.01 C, som har oprindelse i Jugoslavien, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1529/74 della Commissione, del 19 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine generatrici,
    etc., parti e pezzi staccati della sottovoce doganale n. 85.01 C originari della
    Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1529/74 van de Commissie van 19 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op generatoren,
    elektromotoren, enz., delen en onderdelen, van onderverdeling 85.01 C, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de
    Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
