    Raad betreffende de minimumeisen voor schepen die gevaarlijke of verontreinigende
    goederen vervoeren en die naar of uit de zeehavens van de Gemeenschap varen (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/513/CE: Decisão da Comissão de 29 de Julho de 1996 em aplicação,
