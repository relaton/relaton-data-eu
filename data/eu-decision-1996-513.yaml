title:
- language: en
  script: Latn
  content: '96/513/EC: Commission Decision of 29 July 1996 in application, at the
    request of France, of Article 5 (4) of Council Directive 93/75/EEC concerning
    minimum requirements for vessels bound for or leaving Community ports and carrying
    dangerous or polluting goods (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/513/CE: Décision de la Commission du 29 juillet 1996 en application,
    sur demande de la France, de l''article 5 paragraphe 4 de la directive 93/75/CEE
    du Conseil relative aux conditions minimales exigées pour les navires à destination
    des ports maritimes de la Communauté ou en sortant et transportant des marchandises
    dangereuses ou polluantes (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/513/EG: Entscheidung der Kommission vom 29. Juli 1996 auf Antrag Frankreichs
    in Anwendung von Artikel 5 Absatz 4 der Richtlinie 93/75/EWG des Rates über Mindestanforderungen
    an Schiffe, die Seehäfen der Gemeinschaft anlaufen oder aus ihnen auslaufen und
    gefährliche oder umweltschädliche Güter befördern (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/513/EF: Kommissionens beslutning af 29. juli 1996 vedtaget på Frankrigs
    anmodning i medfør af artikel 5, stk. 4, i Rådets direktiv 93/75/EØF om mindstekrav
    til skibe, som er på vej til eller fra Fællesskabets søhavne med farligt eller
    forurenende gods (Den franske tekst er den eneste autentiske)'
  type: main
- language: el
  script: Grek
  content: '96/513/ΕΚ: Απόφαση της Επιτροπής της 29ης Ιουλίου
    1996 κατ'' εφαρμογή, με αίτημα της Γαλλίας, του
    άρθρου 5 παράγραφος 4 της οδηγίας 93/75/ΕΟΚ του
    Συμβουλίου για τις ελάχιστες προδιαγραφές
    που απαιτούνται για τα πλοία που κατευθύνονται
    σε ή αποπλέουν από κοινοτικούς λιμένες μεταφέροντας
    επικίνδυνα ή ρυπογόνα εμπορεύματα (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/513/EY: Komission päätös, tehty 29 päivänä heinäkuuta 1996,
    vaarallisia tai ympäristöä pilaavia aineita kuljettavia aluksia koskevista
    vähimmäisvaatimuksista niiden ollessa matkalla yhteisön merisatamiin tai poistuessa
    sieltä annetun neuvoston direktiivin 93/75/ETY 5 artiklan 4 kohdan soveltamisesta
    Ranskan pyynnöstä (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/513/CE: Decisione della Commissione del 29 luglio 1996 su richiesta
    della Francia, a norma dell''articolo 5, paragrafo 4 della direttiva 93/75/CEE
    del Consiglio relativa alle condizioni minime necessarie per le navi dirette a
    porti marittimi della Comunità o che ne escono e che trasportano merci pericolose
    o inquinanti (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/513/EG: Beschikking van de Commissie van 29 juli 1996 ter uitvoering,
