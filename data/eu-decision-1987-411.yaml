title:
- language: en
  script: Latn
  content: '87/411/EEC: Commission Decision of 8 July 1987 authorizing the Kingdom
    of Spain to apply intra- Community surveillance to imports of certain tools and
    hand tools originating in certain third countries and placed in free circulation
    in one of the Member States (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/411/CEE: Décision de la Commission du 8 juillet 1987 autorisant le
    Royaume d''Espagne à instaurer une surveillance intracommunautaire des importations
    de certains outils et outillage à main originaires de certains pays tiers, mis
    en libre pratique dans un des États membres (Le texte en langue espagnole est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/411/EWG: Entscheidung der Kommission vom 8. Juli 1987 zur Ermächtigung
    des Königreichs Spanien zur Einführung einer innergemeinschaftlichen Überwachung
    bei Einfuhren von aus Drittländern stammenden und in einem der Mitgliedstaaten
    im zollrechtlich freien Verkehr befindlichen Werkzeugen und Handwerkzeugen (Nur
    der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/411/EØF: Kommissionens beslutning af 8. juli 1987 om bemyndigelse
    af Kongeriget Spanien til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse former for håndværktøj og -redskaber, der har oprindelse i visse tredjelande
    og er overgået til fri omsætning i de øvrige medlemsstater (Kun den spanske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/411/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Ιουλίου
    1987 που εξουσιοδοτεί το Βασίλειο της Ισπανίας
    να υποβάλλει σε ενδοκοινοτική επιτήρηση τις
    εισαγωγές ορισμένων εργαλείων και συλλογών
    εργαλείων του χεριού, καταγωγής τρίτων χωρών,
    που έχουν τεθεί σε ελεύθερη κυκλοφορία σε ένα
    κράτος μέλος (Το κείμενο στην ισπανική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/411/CEE: Decisione della Commissione dell''8 luglio 1987 che autorizza
    il Regno di Spagna a instaurare una sorveglianza intracomunitaria sulle importazioni
    di utensili e utensileria a mano originari di alcuni paesi terzi e immessi in
    libera pratica in uno degli Stati membri (Il testo in lingua spagnola è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/411/EEG: Beschikking van de Commissie van 8 juli 1987 houdende machtiging
    van het Koninkrijk Spanje om intracommunautair toezicht in te stellen op de invoer
    van bepaalde gereedschappen en handgereedschappen van oorsprong uit bepaalde derde
    landen en in een der Lid- Staten in het vrije verkeer gebracht (Slechts de tekst
    in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/411/CEE: Decisão da Comissão de 8 de Julho de 1987 que autoriza o
    Reino de Espanha a instaurar uma vigilância intracomunitária das importações
    de certas ferramentas e aparelhos de uso manual originários de certos países
    terceiros e introduzidos em livre-prática num dos Estados-membros (Apenas faz
    fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '87/411/CEE: Decisión de la Comisión de 8 de julio de 1987 por la que
    se autoriza al Reino de España a establecer una vigilancia intracomunitaria de
    las importaciones de determinados utensilios y herramientas de uso manual originarios
    de determinados terceros países, despachados a libre práctica en uno de los
    Estados miembros (El texto en lengua española es el único auténtico)'
