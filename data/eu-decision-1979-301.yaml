title:
- language: en
  script: Latn
  content: '79/301/EEC: Commission Decision of 2 March 1979 authorizing the Italian
    Republic not to apply Community treatment to primary cells and primary batteries,
    falling within heading No 85.03 of the Common Customs Tariff, originating in Japan
    and in free circulation in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/301/CEE: Décision de la Commission, du 2 mars 1979, autorisant la
    République italienne à exclure du traitement communautaire les piles électriques
    de la position 85.03 du tarif douanier commun, originaires du Japon et mises en
    libre pratique dans les autres Etats membres (Le texte en langue italienne est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/301/EWG: Entscheidung der Kommission vom 2. März 1979, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Primärelemente und Primärbatterien
    der Tarifnummer 85.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/301/EØF: Kommissionens beslutning af 2. marts 1979 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage primærelementer
    og primærbatterier, som henhører under pos. 85.03 i den fælles toldtarif, har
    oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den italienske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/301/CEE: Decisione della Commissione, del 2 marzo 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le pile elettriche,
    della voce 85.03 della tariffa doganale comune, originarie del Giappone e messe
    in libera pratica negli altri Stati membri (Il testo in lingua italiana è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/301/EEG: Beschikking van de Commissie van 2 maart 1979 waarbij de Italiaanse
    Republiek wordt gemachtigd elektrische batterijen van post 85.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Italiaanse taal is authentiek)'
  type: main
