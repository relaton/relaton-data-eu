title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1721/2005 of 20 October 2005 amending Regulation
    (EC) No 312/2001 laying down detailed rules of application for the importation
    of olive oil originating in Tunisia and derogating from certain provisions of
    Regulations (EC) No 1476/95 and (EC) No 1291/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1721/2005 de la Commission du 20 octobre 2005 modifiant
    le règlement (CE) n° 312/2001 portant modalités d’application pour l’importation
    d’huile d’olive originaire de Tunisie et dérogeant à certaines dispositions
    des règlements (CE) n° 1476/95 et (CE) n° 1291/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1721/2005 der Kommission vom 20. Oktober 2005 zur Änderung
    der Verordnung (EG) Nr. 312/2001 mit Durchführungsbestimmungen für die Einfuhr
    von Olivenöl mit Ursprung in Tunesien und zur Abweichung von einigen Vorschriften
    der Verordnungen (EG) Nr. 1476/95 und (EG) Nr. 1291/2000
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1721/2005 ze dne 20. října 2005 o změně
    nařízení (ES) č. 312/2001, kterým se stanoví prováděcí pravidla pro dovoz
    olivového oleje pocházejícího z Tuniska a odchylka od některých ustanovení
    nařízení (ES) č. 1476/95 a (ES) č. 1291/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1721/2005 af 20. oktober 2005 om ændring
    af forordning (EF) nr. 312/2001 om gennemførelsesbestemmelser for indførsel
    af olivenolie med oprindelse i Tunesien og om fravigelse af visse bestemmelser
    i forordning (EF) nr. 1476/95 og (EF) nr. 1291/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1721/2005 της Επιτροπής,
    της 20ής Οκτωβρίου 2005, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 312/2001 περί λεπτομερειών
    εφαρμογής για την εισαγωγή ελαιολάδου καταγωγής
    Τυνησίας και περί παρεκκλίσεων από ορισμένες
    διατάξεις των κανονισμών (ΕΚ) αριθ. 1476/95 και
    (ΕΚ) αριθ. 1291/2000
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1721/2005, 20. oktoober 2005, millega muudetakse
    määrust (EÜ) nr 312/2001, milles sätestatakse Tuneesiast pärit oliiviõli
    impordi üksikasjalikud rakenduseeskirjad ning erandid teatavatest määruste
    (EÜ) nr 1476/95 ja (EÜ) nr 1291/2000 sätetest
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1721/2005, annettu 20 päivänä lokakuuta 2005,
    Tunisiasta peräisin olevan oliiviöljyn tuontia koskevista yksityiskohtaisista
    soveltamissäännöistä sekä asetusten (EY) N:o 1476/95 ja (EY) N:o 1291/2000
    tietyistä säännöksistä poikkeamisesta annetun asetuksen (EY) N:o 312/2001
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1721/2005/EK rendelete (2005. október 20.) a Tunéziából
    származó olívaolaj behozatalára vonatkozó részletes alkalmazási szabályokról,
    valamint az 1476/95/EK és az 1291/2000/EK rendeletekben megállapított egyes
    rendelkezésektől való eltérésről szóló 312/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1721/2005 della Commissione, del 20 ottobre 2005, recante
    modifica del regolamento (CE) n. 312/2001 che stabilisce le modalità d’applicazione
    per l’importazione di olio d’oliva originario della Tunisia e deroga a talune
    disposizioni dei regolamenti (CE) n. 1476/95 e (CE) n. 1291/2000
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1721/2005 (2005. gada 20. oktobris), ar kuru
    groza Regulu (EK) Nr. 312/2001, ar ko paredz sīki izstrādātus piemērošanas
    noteikumus Tunisijas izcelsmes olīveļļas importēšanai un ar ko atkāpjas
    no dažiem Regulas (EK) Nr. 1476/95 un (EK) Nr. 1291/2000 noteikumiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. spalio 20 d. Komisijos reglamentas (EB) Nr. 1721/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 312/2001, nustatantį išsamias taisykles dėl
    alyvų aliejaus, kurio kilmės šalis Tunisas, importavimo ir nukrypimo nuo Reglamentų
    (EB) Nr. 1476/95 ir (EB) Nr. 1291/2000 tam tikrų nuostatų
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1721/2005 van de Commissie van 20 oktober 2005 tot
    wijziging van Verordening (EG) nr. 312/2001 houdende uitvoeringsbepalingen voor
    de invoer van olijfolie van oorsprong uit Tunesië en tot afwijking van een aantal
    bepalingen van de Verordeningen (EG) nr. 1476/95 en (EG) nr. 1291/2000
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1721/2005 z dnia 20 października 2005
    r. zmieniające rozporządzenie (WE) nr 312/2001 ustanawiające szczegółowe
    zasady wnioskowania o przywóz oliwy z oliwek pochodzącej z Tunezji oraz uchylające
    niektóre przepisy rozporządzeń (WE) nr 1476/95 oraz (WE) nr 1291/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1721/2005 da Comissão, de 20 de Outubro de 2005,
    que altera o Regulamento (CE) n.° 312/2001 que estabelece normas de execução
    para a importação de azeite originário da Tunísia e derroga a certas disposições
    dos Regulamentos (CE) n.° 1476/95 e (CE) n.° 1291/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1721/2005 z 20. októbra 2005, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 312/2001, ktorým sa ustanovujú podrobné pravidlá
    uplatňovania nariadení (ES) č. 1476/95 a (ES) č. 1291/2000 pri dovoze olivového
    oleja s pôvodom v Tunisku a udeľujú sa výnimky z určitých ustanovení týchto
    nariadení
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1721/2005 z dne 20. oktobra 2005 o spremembi
    Uredbe (ES) št. 312/2001 o podrobnih pravilih uporabe za uvoz oljčnega olja
    s poreklom iz Tunizije in o odstopanju od nekaterih predpisov uredb (ES) št.
    1476/95 in (ES) št. 1291/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1721/2005 de la Comisión, de 20 de octubre de 2005,
    que modifica el Reglamento (CE) n° 312/2001, por el que se establecen disposiciones
    de aplicación para la importación de aceite de oliva originario de Túnez y
    excepciones de determinadas disposiciones de los Reglamentos (CE) n° 1476/95
    y (CE) n° 1291/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1721/2005 av den 20 oktober 2005 om ändring
    av förordning (EG) nr 312/2001 om tillämpningsföreskrifter för import av olivolja
    med ursprung i Tunisien och om undantag från vissa bestämmelser i förordningarna
    (EG) nr 1476/95 och (EG) nr 1291/2000
  type: main
