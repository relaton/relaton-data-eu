title:
- language: en
  script: Latn
  content: '95/490/EC: Council Decision of 17 November 1995 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the Protocol defining, for the period 21 May 1995 to 20 May 1998, the fishing
    opportunities and the financial contribution provided for by the Agreement between
    the European Economic Community and the Government of the Republic of Madagascar
    on fishing off Madagascar'
  type: main
- language: fr
  script: Latn
  content: '95/490/CE: Décision du Conseil, du 17 novembre 1995, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Madagascar concernant la pêche au large de Madagascar pour
    la période du 21 mai 1995 au 20 mai 1998'
  type: main
- language: de
  script: Latn
  content: '95/490/EG: Beschluß des Rates vom 17. November 1995 über den Abschluß
    des Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des
    Protokolls zur Festlegung der Fangmöglichkeiten und der finanziellen Beteiligung
    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Madagaskar über die Fischerei vor der Küste Madagaskars für die
    Zeit vom 21. Mai 1995 bis zum 20. Mai 1998'
  type: main
- language: da
  script: Latn
  content: '95/490/EF: Rådets afgørelse af 17. november 1995 om indgåelse af aftalen
