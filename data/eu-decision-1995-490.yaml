    af de fiskerimuligheder og den finansielle modydelse, der er omhandlet i aftalen
    mellem Det Europæiske Økonomiske Fællesskab og regeringen for Republikken Madagaskar
    om fiskeri ud for Madagaskar, for perioden fra 21. maj 1995 til 20. maj 1998'
  type: main
- language: el
  script: Grek
