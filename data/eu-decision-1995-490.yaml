  type: main
- language: fi
  script: Latn
  content: '95/490/EY: Neuvoston päätös, tehty 17 päivänä marraskuuta 1995,
    Euroopan talousyhteisön ja Madagaskarin tasavallan hallituksen välillä Madagaskarin
    rannikon edustalla harjoitettavasta kalastuksesta tehdyssä sopimuksessa määrättyjen
    kalastusmahdollisuuksien ja taloudellisen korvauksen vahvistamisesta 21 päivän
    toukokuuta 1995 ja 20 päivän toukokuuta 1998 väliseksi ajaksi tehdyn pöytäkirjan
    väliaikaista soveltamista koskevan sopimuksen tekemisestä kirjeenvaihtona'
  type: main
- language: it
  script: Latn
  content: '95/490/CE: Decisione del Consiglio, del 17 novembre 1995, relativa alla
