    Νοεμβρίου 1995 για τη σύναψη συμφωνίας υπό μορφή
    ανταλλαγής επιστολών που αφορά την προσωρινή
    εφαρμογή του πρωτοκόλλου με το οποίο καθορίζονται
    οι αλιευτικές δυνατότητες και η χρηματοδοτική
    αντιστάθμιση που προβλέπονται στη συμφωνία
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της κυβέρνησης της Μαδαγασκάρης, όσον αφορά
