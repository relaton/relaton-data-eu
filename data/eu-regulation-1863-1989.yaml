title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1863/89 of 27 June 1989 re-establishing
    the levying of customs duties on other toys falling within CN code 9503, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1863/89 de la Commission du 27 juin 1989 portant rétablissement
    de la perception des droits de douane applicables aux autres jouets, du code NC
    9503, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1863/89 DER KOMMISSION vom 27. Juni 1989 zur Wiedereinführung
    der Erhebung der Zölle für anderes Spielzeug des KN-Code 9503 mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1863/89 af 27. juni 1989 om genindførelse
