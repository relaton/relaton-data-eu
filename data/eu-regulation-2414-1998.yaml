    zur Regelung für Erzeugnisse mit Ursprung in den Staaten in Afrika, im karibischen
    Raum und im Pazifischen Ozean (AKP-Staaten) und zur Aufhebung der Verordnung (EWG)
    Nr. 1150/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2414/98 af 9. november 1998 om gennemførelsesbestemmelser
