  script: Latn
  content: Commission Regulation (EC) No 2414/98 of 9 November 1998 laying down detailed
    rules for the application of the arrangements applicable to imports of milk products
    originating in the African, Caribbean and Pacific States (ACP States) and repealing
    Regulation (EEC) No 1150/90
  type: main
- language: fr
