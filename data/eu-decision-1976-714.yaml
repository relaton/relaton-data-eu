title:
- language: en
  script: Latn
  content: Commission Decision of 4 August 1976 specifying the extent to which applications
    for import licences lodged from 26 to 30 July 1976 for young bovine animals of
    highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/714/CEE: Décision de la Commission, du 4 août 1976, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 26 au 30 juillet 1976 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. August 1976 darüber, inwieweit den
    vom 26. bis 30. Juli 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder
    der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. august 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i perioden fra den 26. til den
    30. juli 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 agosto 1976, che determina in quale
    misura può essere dato seguito alle domande d'importazione, presentate dal 26
    al 30 luglio 1976, per i giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 augustus 1976 tot vaststelling van de
    mate waarin van 26 tot en met 30 juli 1976 ingediende aanvragen om afgifte van
    invoercertificaten voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
  type: main
