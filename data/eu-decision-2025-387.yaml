title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/387 of 27 February 2025 recognising
    under Article 31(2) and (4) of Directive (EU) 2018/2001 that the report contains
    accurate data for the purposes of measuring the greenhouse gas emissions associated
    with the cultivation of wheat, rye, winter barley, spring barley, triticale, rapeseed,
    grain maize, sunflower, soybean, sugar beet, potato and silage maize in Austria
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/387 de la Commission du 27 février
    2025 reconnaissant, conformément à l’article 31, paragraphes 2 et 4, de la
    directive (UE) 2018/2001, que le rapport contient des données précises aux fins
    de la mesure des émissions de gaz à effet de serre associées à la culture
    du blé, du seigle, de l’orge d’hiver, de l’orge de printemps, du triticale,
    du colza, du maïs-grain, du tournesol, du soja, de la betterave sucrière, de
    la pomme de terre et du maïs-fourrage en Autriche
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/387 der Kommission vom 27. Februar 2025
    zur Anerkennung gemäß Artikel 31 Absätze 2 und 4 der Richtlinie (EU) 2018/2001,
    dass der Bericht genaue Daten für die Messung der auf den Anbau von Weizen, Roggen,
    Wintergerste, Sommergerste, Triticale, Raps, Körnermais, Sonnenblumen, Sojabohnen,
    Zuckerrüben, Kartoffeln und Silomais in Österreich zurückgehenden Treibhausgasemissionen
    enthält
  type: main
- language: bg
  script: Cyrl
