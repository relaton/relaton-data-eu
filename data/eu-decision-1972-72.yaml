title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de rééducation professionnelle et de réinstallation
    effectuées par le "Bundesministerium für Post und Verkehr", la "Bundesknappschaft"
    et les organismes d'assurances sociales des travailleurs
  type: main
- language: de
  script: Latn
  content: '72/72/EWG: Entscheidung der Kommission vom 23. Dezember 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für vom Bundesministerium für Post und Verkehr,
    von der Bundesknappschaft, den Berufsgenossenschaften und den Arbeiterrentenversicherungsträgern
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/72/CEE: Decisione della Commissione, del 23 dicembre 1971, che concede
    un contributo del Fondo sociale europeo alla Repubblica federale di Germania per
    spese relative ad operazioni di riqualificazione e di nuova sistemazione effettuate
    dal «Bundesministerium für Post und Verkehr», dalla «Bundesknappschaft» e
    dagli enti di assicurazione sociale dei lavoratori'
  type: main
- language: nl
  script: Latn
  content: '72/72/EEG: Beschikking van de Commissie van 23 december 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Bondsrepubliek
    Duitsland voor door het "Bundesministerium für Post und Verkehr", de "Bundes-knappschaft"
    en de uitvoeringsorganen van de sociale werknemersverzekeringen gemaakte herscholings-
    en verplaatsingskosten'
  type: main
