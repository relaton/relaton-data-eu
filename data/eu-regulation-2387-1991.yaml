title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2387/91 of 5 August 1991 re-establishing
    the levying of customs duties on products falling within CN code 4203 29 10, originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2387/91 DE LA COMMISSION du 5 août 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 4203
    29 10 originaires de l'' Inde, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2387/91 DER KOMMISSION vom 5. August 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 4203 29 10 mit Ursprung in
    Indien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2387/91 af 5. august 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4203 29 10 og med oprindelse
    i Indien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2387/91 της Επιτροπής
    της 5ης Αυγούστου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    του κωδικού ΣΟ 4203 29 10, καταγωγής Ινδίας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2387/91 DELLA COMMISSIONE del 5 agosto 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 4203 29
    10, originari dell'' India, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2387/91 VAN DE COMMISSIE van 5 augustus 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
