    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e oltre il 30 % sino al 90 % incluso di cromo (ferro-cromo superrafinato),
    della sottovoce ex 73.02 E I della tariffa doganale comune (1986)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3676/85 van de Raad van 20 december 1985 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van post ex 73.02 E I van het gemeenschappelijk douanetarief (1986)
  type: main
