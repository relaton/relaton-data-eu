title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3676/85 of 20 December 1985 opening, allocating
    and providing for the administration of a Community tariff quota for ferro-chromium
    containing not more than 0,10 % by weight of carbon and more than 30 % but not
    more than 90 % by weight of chromium (super-refined ferro-chromium), falling within
    subheading ex 73.02 E I of the Common Customs Tariff (1986)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3676/85 du Conseil du 20 décembre 1985 portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de ferrochrome
    contenant en poids 0,10 % ou moins de carbone et plus de 30 %, jusqu' à 90 %
    inclus, de chrome (ferrochrome surraffiné) de la sous-position ex 73.02 E I du
    tarif douanier commun (1986)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3676/85 des Rates vom 20. Dezember 1985 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs (1986)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3676/85 af 20. december 1985 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for ferrochrom med et
    kulstofindhold på 0,10 vægtprocent eller derunder og med et indhold af chrom
    (raffineret ferrochrom) på over 30 %, men højst 90 %, henhørende under pos.
    ex 73.02 E I i den fælles toldtarif (1986)
  type: main
- language: el
  script: Grek
