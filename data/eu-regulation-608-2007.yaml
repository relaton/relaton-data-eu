  content: Regolamento (CE) n. 608/2007 della Commissione, del 1 o giugno 2007 , che
    modifica il regolamento (CE) n. 795/2004 recante modalità di applicazione del
    regime di pagamento unico di cui al regolamento (CE) n. 1782/2003 del Consiglio
    che stabilisce norme comuni relative ai regimi di sostegno diretto nell’ambito
    della politica agricola comune e istituisce taluni regimi di sostegno a favore
    degli agricoltori
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 608/2007 ( 2007. gada 1. jūnijs ), ar kuru groza
    Regulu (EK) Nr. 795/2004, ar ko nosaka sīki izstrādātus noteikumus par to,
    kā īstenot vienreizējo maksājumu shēmu, kura paredzēta Padomes Regulā (EK)
    Nr. 1782/2003, ar ko izveido kopīgus tiešā atbalsta shēmu noteikumus saskaņā
