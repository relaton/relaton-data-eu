id: EUDecision1999254
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/254/EC: Decision of the Council of 30 March 1999 authorising the
    French Republic to apply or to continue to apply reductions in, or exemptions
    from, excise duties on certain mineral oils used for specific purposes, in accordance
    with the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '1999/254/CE: Décision du Conseil du 30 mars 1999 autorisant la République
    française à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques des réductions ou des exonérations d''accises,
    conformément à la procédure prévue à l''article 8, paragraphe 4, de la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '1999/254/EG: Entscheidung des Rates vom 30. März 1999 zur Ermächtigung
    der Französischen Republik, gemäß dem Verfahren des Artikels 8 Absatz 4 der
    Richtlinie 92/81/EWG für Mineralöle mit bestimmten Verwendungszwecken Verbrauchsteuerbefreiungen
    oder - ermäßigungen anzuwenden oder beizubehalten'
  type: main
- language: da
  script: Latn
  content: '1999/254/EF: Rådets beslutning af 30. Marts 1999 om bemyndigelse af Den
    Franske Republik til at indføre eller fortsat anvende punktafgiftsfritagelser
    eller - lempelser for visse typer mineralolier, der anvendes til særlige formål,
    jf. Fremgangsmåden i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '1999/254/ΕΚ: Απόφαση του Συμβουλίου, της 30ής
    Μαρτίου 1999, με την οποία επιτρέπεται στη Γαλλική
    Δημοκρατία να εφαρμόσει ή να συνεχίσει να εφαρμόζει
    μειώσεις ή απαλλαγές όσον αφορά τους ειδικούς
    φόρους κατανάλωσης που επιβάλλονται σε ορισμένα
    πετρελαιοειδή που χρησιμοποιούνται για ειδικούς
    σκοπούς, σύμφωνα με τη διαδικασία που προβλέπεται
    στο άρθρο 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '1999/254/EY: Neuvoston päätös, tehty 30 päivänä maaliskuuta 1999,
    luvan antamisesta Ranskan tasavallalle soveltaa tai soveltaa edelleen valmisteveron
    alennuksia tai valmisteverovapautuksia tiettyihin erityistarkoituksiin käytettyihin
    kivennäisöljyihin direktiivin 92/81/ETY 8 artiklan 4 kohdassa tarkoitetun menettelyn
    mukaisesti'
  type: main
- language: it
  script: Latn
  content: '1999/254/CE: Decisione del Consiglio, del 30 marzo 1999, che autorizza
    la Repubblica francese ad applicare o a continuare ad applicare ad alcuni oli
    minerali utilizzati a fini specifici esenzioni o riduzioni d''accisa, conformemente
    alla procedura di cui all''articolo 8, paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '1999/254/EG: Besluit van de Raad van 30 maart 1999 waarbij de Franse Republiek
    wordt gemachtigd om overeenkomstig de procedure van artikel 8, lid 4, van Richtlijn
    92/81/EEG, verlaagde accijnstarieven of vrijstellingen van accijnzen toe te passen
    of te blijven toepassen op bepaalde minerale oliën die voor bijzondere doeleinden
    worden gebruikt'
  type: main
- language: pt
  script: Latn
  content: '1999/254/CE: Decisão do Conselho, de 30 de Março de 1999, que autoriza
    a República Francesa a aplicar ou a continuar a aplicar a certos óleos minerais
    utilizados para fins específicos reduções ou isenções de impostos especiais
    de consumo, nos termos do n° 4 do artigo 8° da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '1999/254/CE: Decisión del Consejo, de 30 de marzo de 1999, por la que
    se autoriza a la República Francesa a aplicar o seguir aplicando reducciones
    o exenciones del impuesto especial sobre determinados hidrocarburos utilizados
    para fines específicos, con arreglo al procedimiento establecido en el apartado
    4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '1999/254/EG: Rådets beslut av den 30 mars 1999 om tillåtelse för Franska
    republiken att på vissa mineraloljor som används för särskilda ändamål tillämpa
    eller fortsätta tillämpa nedsättning av eller befrielse från punktskatt, i
    enlighet med det förfarande som föreskrivs i artikel 8.4 i direktiv 92/81/EEG'
  type: main
