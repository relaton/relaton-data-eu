title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1377/2006 of 18 September 2006 amending Council
    Regulation (EC) No 1236/2005 concerning trade in certain goods which could be
    used for capital punishment, torture or other cruel, inhuman or degrading treatment
    or punishment
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1377/2006 de la Commission du 18 septembre 2006 modifiant
    le règlement (CE) n o 1236/2005 du Conseil concernant le commerce de certains
    biens susceptibles d’être utilisés en vue d’infliger la peine capitale,
    la torture ou d’autres peines ou traitements cruels, inhumains ou dégradants
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1377/2006 der Kommission vom 18. September 2006 zur
    Änderung der Verordnung (EG) Nr. 1236/2005 des Rates betreffend den Handel mit
    bestimmten Gütern, die zur Vollstreckung der Todesstrafe, zu Folter oder zu anderer
    grausamer, unmenschlicher oder erniedrigender Behandlung oder Strafe verwendet
    werden könnten
  type: main
- language: bg
