  content: Council Regulation (EEC) No 2931/76 of 29 November 1976 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1977) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2931/76 du Conseil, du 29 novembre 1976, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de papier
    journal de la sous-position 48.01 A du tarif douanier commun (année 1977) et
    étendant le bénéfice de ce même contingent à certains autres papiers
  type: main
- language: de
  script: Latn
