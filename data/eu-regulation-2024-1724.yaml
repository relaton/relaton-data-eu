  script: Latn
  content: Council Implementing Regulation (EU) 2024/1724 of 17 June 2024 implementing
    Article 12 of Regulation (EU) No 356/2010 imposing certain specific restrictive
    measures directed against certain natural or legal persons, entities or bodies,
    in view of the situation in Somalia
  type: main
- language: fr
  script: Latn
