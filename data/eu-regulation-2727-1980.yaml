title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2727/80 of 24 October 1980 authorizing the
    Federal Republic of Germany, the French Republic and the Grand Duchy of Luxembourg
    to permit under certain conditions an additional increase in the alcoholic strength
    of certain wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2727/80 de la Commission, du 24 octobre 1980, autorisant
    la République fédérale d'Allemagne, la République française et le Grand-Duché
    de Luxembourg à permettre, sous certaines conditions, une augmentation supplémentaire
    du titre alcoométrique de certains vins et de certains produits destinés à
    l'élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2727/80 der Kommission vom 24. Oktober 1980 zur Ermächtigung
    der Bundesrepublik Deutschland, der Französischen Republik und des Großherzogtums
    Luxemburg, unter bestimmten Voraussetzungen eine zusätzliche Erhöhung des Alkoholgehalts
    bestimmter Weine und bestimmter zur Weinherstellung vorgesehener Erzeugnisse zu
    gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2727/80 af 24. oktober 1980 om bemyndigelse
    til Forbundsrepublikken Tyskland, Den franske Republik og storhertugdømmet Luxembourg
    til under visse omstændigheder at tillade en yderligere forhøjelse af alkoholindholdet
    i visse vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2727/80 τής Επιτροπής
    τής 24ης Οκτωβρίου 1980 περί εξουσιοδοτήσεως
    τής Ομοσπονδιακής Δημοκρατίας τής Γερμανίας,
    τής Γαλλικής Δημοκρατίας καί τού Μεγάλου Δουκάτου
    τού Λουξεμβούργου νά επιτρέπουν, υπό ορισμένες
    προϋποθέσεις, τή συμπληρωματική αύξηση τού
    αλκοολικού τίτλου ορισμένων οίνων καί ορισμένων
    προϊόντων προοριζομένων γιά τήν παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2727/80 della Commissione, del 24 ottobre 1980, che
    autorizza la Repubblica federale di Germania, la Repubblica francese e il Granducato
    del Lussemburgo a permettere in determinate condizioni un aumento supplementare
    della gradazione alcolometrica di taluni vini e di taluni prodotti destinati all'
    elaborazione dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2727/80 van de Commissie van 24 oktober 1980 waarbij
    de Bondsrepubliek Duitsland, de Franse Republiek en het Groothertogdom Luxemburg
    gemachtigd worden om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte
    van bepaalde wijnen en van bepaalde voor de bereiding van wijn bestemde produkten
    toe te staan
  type: main
