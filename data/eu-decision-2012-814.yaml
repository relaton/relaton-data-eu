  script: Latn
  content: '2012/814/EU, Euratom: Commission Implementing Decision of 19 December
    2012 amending Decision 90/184/Euratom, EEC authorising Denmark not to take into
    account certain categories of transactions and to use certain approximate estimates
    for the calculation of the VAT own resources base (notified under document C(2012)
    9538)'
  type: main
- language: fr
  script: Latn
  content: '2012/814/UE, Euratom: Décision d’exécution de la Commission du 19
    décembre 2012 modifiant la décision 90/184/Euratom, CEE autorisant le Danemark
    à ne pas tenir compte de certaines catégories d’opérations et à utiliser
    certaines estimations approximatives pour le calcul de la base des ressources
    propres provenant de la taxe sur la valeur ajoutée [notifiée sous le numéro
    C(2012) 9538]'
  type: main
- language: de
  script: Latn
  content: '2012/814/EU, Euratom: Durchführungsbeschluss der Kommission vom 19. Dezember
