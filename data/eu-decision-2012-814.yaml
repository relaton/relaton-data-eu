    wird, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln (Bekanntgegeben
    unter Aktenzeichen C(2012) 9538)'
