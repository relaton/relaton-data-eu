  type: main
- language: de
  script: Latn
  content: '68/150/EWG: Entscheidung des Rates vom 6. März 1968 über die zeitweilige
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Balsamterpentinöl der
    Tarifnummer 38.07 A sowie für Kolophonium der Tarifnummer 38.08 A (Jahr 1968)'
  type: main
- language: it
  script: Latn
