    koskevan luettelon vahvistamisesta annetun täytäntöönpanoasetuksen (EU) 2015/1018
    muuttamisesta siltä osin kuin on kyse miehittämättömistä ilma-alusjärjestelmistä
    (UAS), U-space-poikkeamista ja osa IS -poikkeamista sekä tiettyjen ilmailun turvaamiseen
    liittyvien poikkeamien poistamisesta pakollisista ilmoitusvaatimuksista
  type: main
