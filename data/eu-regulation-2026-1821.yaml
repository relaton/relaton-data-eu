    događaji u civilnom zrakoplovstvu koje treba obvezno prijaviti, u pogledu sustava
    bespilotnih zrakoplova (UAS), događaja u U-space zračnom prostoru, događaja
    u okviru dijela IS i uklanjanja određenih događaja povezanih sa zaštitom zračnog
    prometa iz zahtjeva za obvezno izvješćivanje
  type: main
