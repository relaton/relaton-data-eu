    síos liosta lena n-aicmítear tarluithe san eitlíocht shibhialta atá le tuairisciú
    ar bhonn éigeantach, a mhéid a bhaineann le córais aerárthaí gan foireann,
    tarluithe U-space, tarluithe slándála faisnéise páirtí, agus tarluithe slándála
    eitlíochta áirithe a bhaint de cheanglais tuairiscithe éigeantacha
  type: main
- language: hr
  script: Latn
