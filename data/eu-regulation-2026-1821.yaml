    un elenco per la classificazione di eventi nel settore dell’aviazione civile
    che devono essere obbligatoriamente segnalati, per quanto riguarda i sistemi aeromobili
    senza equipaggio (UAS), gli eventi U-space, gli eventi relativi alla sicurezza
    delle informazioni e la soppressione di determinati eventi relativi alla sicurezza
    aerea dai requisiti di segnalazione obbligatoria
  type: main
- language: lv
  script: Latn
