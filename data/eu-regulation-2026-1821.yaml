title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1821 of 27 July 2026 amending
    Implementing Regulation (EU) 2015/1018 laying down a list classifying occurrences
    in civil aviation to be mandatorily reported, as regards Unmanned Aircraft Systems
    (UAS), U-space occurrences, part-IS occurrences, and the removal of certain aviation
    security occurrences from mandatory reporting requirements
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1821 de la Commission du 27 juillet
    2026 modifiant le règlement d’exécution (UE) 2015/1018 établissant une liste
    classant les événements dans l’aviation civile devant être obligatoirement
    notifiés, en ce qui concerne les systèmes d’aéronefs sans équipage à bord
    (UAS), les événements dans l’U-space et les événements relevant de la partie
    IS, et supprimant certains événements liés à la sûreté de l’aviation des
    exigences en matière de comptes rendus obligatoires
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1821 der Kommission vom 27. Juli 2026
    zur Änderung der Durchführungsverordnung (EU) 2015/1018 zur Festlegung einer
    Liste zur Einstufung meldepflichtiger Ereignisse in der Zivilluftfahrt in Bezug
    auf unbemannte Luftfahrzeugsysteme (UAS), U-Space-Ereignisse und Teil-IS-Ereignisse
    sowie zur Ausnahme bestimmter Ereignisse im Bereich der Luftsicherheit von den
    Meldepflichten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/1821 на Комисията
    от 27 юли 2026 година за изменение на Регламент
    за изпълнение (ЕС) 2015/1018 за установяване на
    списък с класификация на събитията в гражданското
    въздухоплаване, които трябва задължително
    да бъдат докладвани, по отношение на безпилотните
    летателни системи (БЛС), събитията в U-space, събитията
    по част IS, както и за премахване на изискванията
    за задължително докладване за някои събития,
    свързани със сигурността на въздухоплаването
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/1821 ze dne 27. července 2026,
    kterým se mění prováděcí nařízení (EU) 2015/1018, kterým se stanoví
    seznam klasifikovaných událostí v civilním letectví, které podléhají povinnému
    hlášení, pokud jde o bezpilotní systémy (UAS), události ve vzdušném prostoru
    U-space, události podle části IS a vynětí některých událostí v oblasti
    ochrany letectví před protiprávními činy ze seznamu událostí podléhajících
    povinnému hlášení
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/1821 af 27. juli 2026
    om ændring af gennemførelsesforordning (EU) 2015/1018 om opstilling af en liste,
    der klassificerer begivenheder inden for civil luftfart, som skal indberettes,
    for så vidt angår ubemandede luftfartøjssystemer (UAS'er), U-space-begivenheder,
    begivenheder henhørende under del-IS og om fjernelse af obligatoriske indberetningskrav
    for visse luftfartssikkerhedsrelaterede begivenheder
  type: main
- language: el
