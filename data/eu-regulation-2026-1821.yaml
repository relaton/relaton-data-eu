    s klasifikáciou udalostí v civilnom letectve, ktoré sa majú povinne hlásiť,
    pokiaľ ide o bezpilotné letecké systémy (UAS), udalosti v priestore U-space,
    udalosti podľa časti IS a vyňatie určitých udalostí bezpečnostnej ochrany
    letectva spod požiadaviek na povinné ohlasovanie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/1821 z dne 27. julija 2026 o spremembi
    Izvedbene uredbe (EU) 2015/1018 o določitvi seznama za razvrščanje dogodkov
    v civilnem letalstvu, o katerih je treba poročati, v zvezi s sistemi brezpilotnih
    zrakoplovov (UAS), dogodkov v okviru sistema U-space in dogodkov v okviru dela
    IS ter o črtanju nekaterih dogodkov na področju varovanja v letalstvu iz zahtev
    glede obveznega poročanja
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/1821 de la Comisión, de 27 de julio
    de 2026, que modifica el Reglamento de Ejecución (UE) 2015/1018, por el que se
    establece una lista de clasificación de los sucesos en la aviación civil de
    notificación obligatoria, en lo que respecta a los sistemas de aeronaves no tripuladas
    (UAS), los sucesos U-Space, los sucesos de la parte IS, y la supresión de determinados
    sucesos relacionados con la seguridad física de la aviación de los requisitos
    de notificación obligatoria
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/1821 av den 27 juli 2026
    om ändring av genomförandeförordning (EU) 2015/1018 om fastställande av en
    förteckning som klassificerar händelser inom civil luftfart som obligatoriskt
    måste rapporteras, vad gäller obemannade luftfartygssystem (UAS), U-space-händelser,
    del-IS-händelser och borttagande av vissa luftfartsskyddshändelser från de
    obligatoriska rapporteringskraven
