  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2026/1821 da Comissão, de 27 de julho de
    2026, que altera o Regulamento de Execução (UE) 2015/1018 que estabelece uma
    lista com a classificação das ocorrências na aviação civil que devem ser
    obrigatoriamente comunicadas, no que diz respeito a sistemas de aeronaves não
    tripuladas (UAS), ocorrências no espaço U, ocorrências Parte IS, e a eliminação
    de certas ocorrências relacionadas com a segurança da aviação dos requisitos
    de comunicação obrigatória
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/1821 al Comisiei din 27 iulie
    2026 de modificare a Regulamentului de punere în aplicare (UE) 2015/1018 de stabilire
    a unei liste de clasificare a evenimentelor de aviație civilă care trebuie raportate
    în mod obligatoriu, în ceea ce privește sistemele de aeronave fără pilot
    la bord (UAS), evenimentele U-space, evenimentele prevăzute în partea IS, precum
    și eliminarea anumitor evenimente de securitate a aviației din cerințele de
    raportare obligatorie
  type: main
- language: sk
  script: Latn
