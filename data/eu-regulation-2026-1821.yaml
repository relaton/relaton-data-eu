    įvykių, su IS dalimi susijusių įvykių ir privalomo pranešimų teikimo reikalavimų
    netaikymo tam tikriems aviacijos saugumo įvykiams iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2015/1018, kuriuo nustatomas civilinės aviacijos įvykių, apie
