    Izvedbenega sklepa 2013/707/EU o potrditvi sprejetja zaveze, ponujene v okviru
    protidampinškega in protisubvencijskega postopka v zvezi z uvozom fotonapetostnih
    modulov iz kristalnega silicija in njihovih ključnih sestavnih delov (tj. celic)
