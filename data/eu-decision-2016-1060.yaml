    záväzku ponúknutého v súvislosti s antidumpingovým konaním a antisubvenčným
    konaním, ktoré sa týkajú dovozu fotovoltických modulov na báze kryštalického
    kremíka a hlavných komponentov (t. j. článkov) s pôvodom v Čínskej ľudovej
