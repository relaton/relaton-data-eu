    modifiant la décision d'exécution 2013/707/UE confirmant l'acceptation d'un
    engagement offert dans le cadre des procédures antidumping et antisubventions
    concernant les importations de modules photovoltaïques en silicium cristallin
    et leurs composants essentiels (cellules) originaires ou en provenance de la République
    populaire de Chine pour la période d'application des mesures définitives
  type: main
