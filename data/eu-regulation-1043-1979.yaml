  content: Commission Regulation (EEC) No 1043/79 of 28 May 1979 completing Regulation
    (EEC) No 2036/74 fixing prices for the sale at reduced prices to certain institutions
    and bodies of a social character of hindquarters of adult bovine animals held
    by the intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1043/79 de la Commission, du 28 mai 1979, complétant
    le règlement (CEE) n° 2036/74 fixant les prix de vente de quartiers arrière
    de gros bovins détenus par les organismes d' intervention à prix réduit à
    certaines institutions et collectivités à caractère social
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1043/79 der Kommission vom 28. Mai 1979 zur Ergänzung
    der Verordnung (EWG) Nr. 2036/74 zur Festsetzung der Preise für den Verkauf zu
    herabgesetzten Preisen der von den Interventionsstellen gelagerten Hinterviertel
    von ausgewachsenen Rindern an soziale Einrichtungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1043/79 af 28. maj 1979 om tillæg
