    som sælges til visse institutioner og organer med socialt formål
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1043/79 della Commissione, del 28 maggio 1979, che
    completa il regolamento (CEE) n. 2036/74 che fissa i prezzi di vendita dei quarti
    posteriori di bovini adulti detenuti dagli organismi d' intervento, a prezzo ridotto,
    a determinate istituzioni ed enti di carattere sociale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1043/79 van de Commissie van 28 mei 1979 houdende
    aanvulling van Verordening (EEG) nr. 2036/74 tot vaststelling van de verkoopprijzen
    voor door de interventiebureaus opgeslagen achtervoeten van volwassen runderen
    in het kader van de verkoop tegen verlaagde prijs aan bepaalde instellingen en
    gemeenschappen zonder winstoogmerk
