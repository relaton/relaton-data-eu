title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1265/2012 of 17 December 2012
    amending Implementing Regulation (EU) No 837/2012 as regards the minimum activity
    of a preparation of 6-phytase produced by Aspergillus oryzae (DSM 22594) as feed
    additive for poultry, weaned piglets, pigs for fattening and sows (holder of authorisation
    DSM Nutritional Products)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 1265/2012 de la Commission du 17 décembre
    2012 modifiant le règlement d’exécution (UE) n ° 837/2012 en ce qui concerne
    l’activité minimale d’une préparation de 6-phytase produite par Aspergillus
    oryzae (DSM 22594) en tant qu’additif pour l’alimentation des volailles, des
    porcelets sevrés, des porcs d’engraissement et des truies (titulaire de l’autorisation:
    DSM Nutritional Products)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) Nr. 1265/2012 der Kommission vom 17. Dezember
    2012 zur Änderung der Durchführungsverordnung (EU) Nr. 837/2012 der Kommission
    in Bezug auf die Mindestaktivität einer Zubereitung von 6-Phytase aus Aspergillus
    oryzae (DSM 22594) als Futtermittelzusatzstoff für Geflügel, entwöhnte Ferkel,
    Mastschweine und Sauen (Zulassungsinhaber: DSM Nutritional Products)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1265/2012 на
    Комисията от 17 декември 2012 година за изменение
    на Регламент за изпълнение (ЕС) № 837/2012 по отношение
    на минималната активност на препарат от 6-фитаза,
    получена от Aspergillus oryzae (DSM 22594), като фуражна
    добавка за домашни птици, отбити прасенца,
    свине за угояване и свине майки (притежател
    на разрешителното DSM Nutritional Products)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1265/2012 ze dne 17. prosince
    2012 , kterým se mění prováděcí nařízení (EU) č. 837/2012, pokud jde
    o minimum aktivity přípravku 6-fytázy z Aspergillus oryzae (DSM 22594) jako
    doplňkové látky pro drůbež, selata po odstavu, výkrm prasat a prasnice (držitel
    povolení DSM Nutritional Products)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1265/2012 af 17. december
    2012 om ændring af gennemførelsesforordning (EU) nr. 837/2012 for så vidt angår
    minimumsaktiviteten af et præparat af 6-fytase produceret af Aspergillus oryzae
    (DSM 22594) som fodertilsætningsstof til fjerkræ, fravænnede smågrise, slagtesvin
    og søer (indehaver af godkendelsen er DSM Nutritional Products)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1265/2012
    της Επιτροπής, της 17ης Δεκεμβρίου 2012 , για την
    τροποποίηση του εκτελεστικού κανονισμού (ΕΕ)
    αριθ. 837/2012 όσον αφορά την ελάχιστη δραστικότητα
    του παρασκευάσματος 6-φυτάσης που παράγεται
    από τον μύκητα Aspergillus oryzae (DSM 22594) ως πρόσθετης
    ύλης ζωοτροφών για πουλερικά, απογαλακτισμένα
    χοιρίδια, χοίρους προς πάχυνση και χοιρομητέρες
    (κάτοχος της άδειας είναι η εταιρεία DSM Nutritional
    Products)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1265/2012, 17. detsember 2012 , millega
    muudetakse komisjoni rakendusmäärust (EL) nr 837/2012 Aspergillus oryzae (DSM
    22594) abil toodetud 6-fütaasi valmistise minimaalse aktiivsuse osas kodulindude,
    võõrutatud põrsaste, nuumsigade ja emiste söödalisandina (loa hoidja DSM
    Nutritional Products)
  type: main
- language: fi
  script: Latn
