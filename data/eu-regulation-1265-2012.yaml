    siltä osin kuin on kyse siipikarjan, vieroitettujen porsaiden, lihasikojen ja
    emakkojen rehun lisäaineena käytettävän, Aspergillus oryzaen (DSM 22594) tuottaman
    6-fytaasivalmisteen vähimmäisaktiivisuudesta (hyväksynnän haltija DSM Nutritional
    Products)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1265/2012 od 17. prosinca 2012. o izmjeni
    Provedbene uredbe (EU) br. 837/2012 u pogledu minimalne aktivnosti pripravka 6-fitaze
    dobivenog od Aspergillus oryzae (DSM 22594) kao dodatka hrani za životinje za
    perad, odbijenu prasad, svinje za tov i krmače (nositelj odobrenja DSM Nutritional
    Products)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1265/2012/EU végrehajtási rendelete ( 2012. december 17.
    ) a 837/2012/EU végrehajtási rendeletnek az Aspergillus oryzae (DSM 22594) által
    termelt 6-fitáz baromfik, elválasztott malacok, hízósertések és kocák takarmány-adalékanyagaként
    felhasznált készítményének (az engedély jogosultja a DSM Nutritional Products)
    legkisebb aktivitása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1265/2012 della Commissione, del 17 dicembre
    2012 , che modifica il regolamento di esecuzione (UE) n. 837/2012 per quanto riguarda
    l’attività minima di un preparato della 6-fitasi prodotta da Aspergillus oryzae
    (DSM 22594) come additivo per mangimi destinati a pollame, suinetti svezzati,
    suini da ingrasso e scrofe (titolare dell’autorizzazione DSM Nutritional Products)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1265/2012 ( 2012. gada 17. decembris
    ), ar ko groza Īstenošanas regulu (ES) Nr. 837/2012 attiecībā uz 6-fitāzes
    preparāta, kas iegūts no Aspergillus oryzae (DSM 22594), kā barības piedevas
    minimālo aktivitāti mājputnu, atšķirtu sivēnu, nobarojamu cūku un sivēnmāšu
    barībā (atļaujas turētājs DSM Nutritional Products )
  type: main
- language: lt
  script: Latn
  content: 2012 m. gruodžio 17 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1265/2012,
    kuriuo dėl 6-fitazės, gautos iš Aspergillus oryzae (DSM 22594), preparato,
    naudojamo kaip naminių paukščių, nujunkytų paršelių, penimų kiaulių ir
    paršavedžių pašarų priedo, mažiausio aktyvumo (leidimo turėtojas – DSM
    Nutritional Products) iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr.
    837/2012
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1265/2012 tas-
    17 ta’ Diċembru 2012 li jemenda r-Regolament ta’ Implimentazzjoni (UE) Nru
    837/2012 fir-rigward attività minima ta’ preparazzjoni ta’ 6-fitażi prodotta
    minn Aspergillus oryzae (DSM 22594) bħala addittiv fl-għalf għat-tajr, il-ħnie
    nes miftuma, il-ħnieżer għat-tismin u l-ħnieżer nisa (id-dententur tal-awtorizzazzjoni
    huwa DSM Nutritional Products)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1265/2012 van de Commissie van 17 december
    2012 tot wijziging van Uitvoeringsverordening (EU) nr. 837/2012 wat betreft de
    minimale activiteit van een preparaat van 6-fytase, geproduceerd door Aspergillus
    oryzae (DSM 22594), als toevoegingsmiddel voor diervoeding voor pluimvee, gespeende
    biggen, mestvarkens en zeugen (vergunninghouder DSM Nutritional Products)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) nr 1265/2012 z dnia 17 grudnia
    2012 r. zmieniające rozporządzenie wykonawcze (UE) nr 837/2012 w odniesieniu
    do minimalnej aktywności preparatu 6-fitazy wytwarzanej przez Aspergillus oryzae
    (DSM 22594) jako dodatku paszowego dla drobiu, prosiąt odsadzonych od maciory,
    tuczników i macior (posiadacz zezwolenia: DSM Nutritional Products)'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) n. ° 1265/2012 da Comissão, de 17 de
