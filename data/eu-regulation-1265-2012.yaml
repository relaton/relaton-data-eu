    no que diz respeito à atividade mínima de uma preparação de 6-fitase produzida
    por Aspergillus oryzae (DSM 22594) como aditivo em alimentos para aves de capoeira,
    leitões desmamados, suínos de engorda e marrãs (detentor da autorização:
    DSM Nutritional Products)'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) nr. 1265/2012 al Comisiei din
    17 decembrie 2012 de modificare a Regulamentului de punere în aplicare (UE) nr.
    837/2012 în ceea ce privește activitatea minimă a unui preparat de 6-fitază
    produs de Aspergillus oryzae (DSM 22594) ca aditiv furajer pentru păsări de
    curte, purcei înțărcați, porci pentru îngrășat și scroafe (titularul autorizației:
    DSM Nutritional Products)'
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1265/2012 zo 17. decembra 2012
    , ktorým sa mení a dopĺňa vykonávacie nariadenie (EÚ) č. 837/2012, pokiaľ
    ide o minimálnu aktivitu prípravku zo 6-fytázy produkovanej Aspergillus oryzae
    (DSM 22594) ako kŕmnej doplnkovej látky pre hydinu, odstavčatá, ošípané
    vo výkrme a prasnice (držiteľ povolenia DSM Nutritional Products)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1265/2012 z dne 17. decembra 2012 o
