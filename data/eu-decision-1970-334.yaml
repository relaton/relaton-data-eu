title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 juin 1970, portant dérogation à la
    recommandation n° 2-64 de la Haute Autorité relative à l'introduction d'une
    protection spécifique frappant les importations de fonte de moulage (quarante
    et unième dérogation)
  type: main
- language: de
  script: Latn
  content: '70/334/EGKS: Entscheidung der Kommission vom 29. Juni 1970 betreffend
    Ausnahmen von der Empfehlung Nr. 2/64 der Hohen Behörde über die Einführung
    eines spezifischen Außenschutzes gegenüber Einfuhren von Gießereiroheisen (Einundvierzigste
    Ausnahmeentscheidung)'
  type: main
- language: it
  script: Latn
  content: '70/334/CECA: Decisione della Commissione, del 29 giugno 1970, che autorizza
    deroghe alla raccomandazione n. 2-64 dell''Alta Autorità relativa all''instaurazione
    di una protezione speciale che colpisce le importazioni di ghise da fonderia (quarantunesima
    deroga)'
  type: main
- language: nl
  script: Latn
  content: '70/334/EGKS: Beschikking van de Commissie van 29 juni 1970 houdende afwijking
    van Aanbeveling nr. 2-64 van de Hoge Autoriteit betreffende de invoering van een
    specifieke bescherming bij de invoer van ruw gietijzer (eenenveertigste uitzonderingsbeschikking)'
