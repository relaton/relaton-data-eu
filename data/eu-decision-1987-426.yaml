    uit Thailand, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/426/CEE: Decisão da Comissão de 15 de Julho de 1987 que autoriza
