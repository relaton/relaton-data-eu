title:
- language: en
  script: Latn
  content: '87/426/EEC: Commission Decision of 15 July 1987 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of certain textile
    products falling within category 1, originating in Thailand which have been put
    into free circulation in the Community (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/426/CEE: Décision de la Commission du 15 juillet 1987 autorisant la
    République italienne à procéder à une surveillance intracommunautaire des
    importations de certains produits textiles (catégorie 1) originaires de Thaïlande
    et mis en libre pratique dans la Communauté économique européenne (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/426/EWG: Entscheidung der Kommission vom 15. Juli 1987 zur Ermächtigung
    der Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Thailand stammenden und in der Gemeinschaft im freien Verkehr
    befindlichen Textilwaren (Kategorie 1) (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/426/EØF: Kommissionens beslutning af 15. juli 1987 om bemyndigelse
    af Den Italienske Republik til at indføre tilsyn inden for Fællesskabet med
    indførsel af visse tekstilvarer (kategori 1) med oprindelse i Thailand til fri
    omsætning i Fællesskabet (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/426/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Ιουλίου 1987 περί χορηγήσεως αδείας στη Δημοκρατία
    της Ιταλίας για την καθιέρωση ενδοκοινοτικής
    επιβλέψεως των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής Ταϋλάνδης που βρίσκονται
    σε ελεύθερη κυκλοφορία στην Κοινότητα (κατηγορία
    1) (Το κείμενο στην ιταλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/426/CEE: Decisione della Commissione del 15 luglio 1987 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti tessili (categoria 1), originari della Tailandia e messi in
    libera pratica nella Comunità (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '87/426/EEG: Beschikking van de Commissie van 15 juli 1987 houdende machtiging
