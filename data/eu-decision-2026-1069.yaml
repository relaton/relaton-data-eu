title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/1069 of 12 May 2026 on the position to be taken
    on behalf of the European Union vis-à-vis the United Kingdom of Great Britain
    and Northern Ireland regarding the determination under Article 540(2) of the Trade
    and Cooperation Agreement between the European Union and the European Atomic Energy
    Community, of the one part, and the United Kingdom of Great Britain and Northern
    Ireland, of the other part, of the date from which personal data relating to vehicle
    registration data as referred to in Article 537 of that Agreement may be supplied
    by Member States to the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/1069 du Conseil du 12 mai 2026 relative à la position
    à prendre, au nom de l’Union européenne, à l’égard du Royaume-Uni de Grande-Bretagne
    et d’Irlande du Nord en ce qui concerne la détermination, en vertu de l’article
    540, paragraphe 2, de l’accord de commerce et de coopération entre l’Union
    européenne et la Communauté européenne de l’énergie atomique, d’une part,
    et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre part, de
    la date à partir de laquelle les États membres peuvent communiquer au Royaume-Uni
    les données à caractère personnel relatives à l’immatriculation des véhicules
    visées à l’article 537 dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/1069 des Rates vom 12. Mai 2026 über den im Namen
    der Europäischen Union gegenüber dem Vereinigten Königreich Großbritannien
    und Nordirland in Bezug auf den gemäß Artikel 540 Absatz 2 des Abkommens über
    Handel und Zusammenarbeit zwischen der Europäischen Union und der Europäischen
    Atomgemeinschaft einerseits und dem Vereinigten Königreich Großbritannien und
    Nordirland andererseits festzulegenden Zeitpunkt, ab dem personenbezogene Daten
    in Bezug auf Fahrzeugregisterdaten gemäß Artikel 537 des genannten Abkommens
    von den Mitgliedstaaten an das Vereinigte Königreich übermittelt werden dürfen,
    zu vertretenden Standpunkt
