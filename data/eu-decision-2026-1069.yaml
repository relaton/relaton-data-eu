  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2026/1069 ze dne 12. května 2026 o postoji, který
    má být zaujat jménem Evropské unie vůči Spojenému království Velké Británie
    a Severního Irska, pokud jde o určení data podle čl. 540 odst. 2 Dohody o
    obchodu a spolupráci mezi Evropskou unií a Evropským společenstvím pro atomovou
    energii na jedné straně a Spojeným královstvím Velké Británie a Severního
    Irska na straně druhé, od něhož mohou členské státy zahájit předávání
    osobních údajů týkajících se údajů o registraci vozidel uvedených v článku
    537 zmíněné dohody Spojenému království
  type: main
