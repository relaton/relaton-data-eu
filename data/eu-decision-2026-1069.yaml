    Storbritannien og Nordirland med hensyn til fastsættelsen i henhold til artikel
    540, stk. 2, i handels- og samarbejdsaftalen mellem Den Europæiske Union og Det
    Europæiske Atomenergifællesskab på den ene side og Det Forenede Kongerige Storbritannien
