    al Reino Unido de Gran Bretaña e Irlanda del Norte en relación con la fijación,
    de conformidad con el artículo 540, apartado 2, del Acuerdo de Comercio y Cooperación
    entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una
