  content: Commission Regulation (EC) No 447/97 of 7 March 1997 establishing Community
    quantitative limits on re- importation into the European Community of certain
    textile products originating in the People's Republic of China after outward processing
    operations in that country and amending the table appended to Annex VII to Council
    Regulation (EEC) No 3030/93 on common rules for imports of certain textile products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 447/97 de la Commission du 7 mars 1997 établissant
    des limites quantitatives communautaires à la réimportation dans la Communauté
    européenne de certains produits textiles originaires de République populaire
    de Chine à l'issue d'opérations de perfectionnement passif effectuées dans
    ce pays et modifiant le tableau joint à l'annexe VII du règlement (CEE) n°
    3030/93 du Conseil relatif au régime commun applicable aux importations de certains
    produits textiles originaires des pays tiers
  type: main
