  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 447/97 da Comissão de 7 de Março de 1997 que estabelece
    limites quantitativos comunitários para a reimportação na Comunidade Europeia
    de certos produtos têxteis originários da República Popular da China após
    operações de aperfeiçoamento passivo realizadas neste país e que altera o
    quadro que acompanha o anexo VII do Regulamento (CEE) nº 3030/93 do Conselho
    relativo ao regime comum aplicável às importações de certos produtos têxteis
    originários de países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 447/97 de la Comisión de 7 de marzo de 1997 por el
    que se introducen límites cuantitativos comunitarios a la reimportación en la
    Comunidad Europea de algunos productos textiles originarios de la República Popular
    de China como consecuencia de operaciones de perfeccionamiento pasivo efectuadas
    en este país y por el que se modifica el cuadro que acompaña al Anexo VII del
    Reglamento (CEE) nº 3030/93 del Consejo relativo al régimen común aplicable
    a las importaciones de determinados productos textiles originarios de terceros
    países
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 447/97 av den 7 mars 1997 om införande
    av kvantitativa gemenskapsbegränsningar vid återinförsel till Europeiska gemenskapen
    av vissa textilprodukter med ursprung i Kina efter passiv förädling i detta
    land och om ändring av tabellen i bilaga VII till rådets förordning (EEG) nr
    3030/93 om gemensamma regler för import av vissa textilprodukter från tredje
    land
  type: main
