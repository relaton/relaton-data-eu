  content: Règlement n 1049/67/CEE de la Commission, du 22 décembre 1967, déterminant
    les montants des éléments mobiles applicables pendant le premier trimestre de
    l'année 1968 à l'importation dans les États membres des marchandises auxquelles
    s'applique le règlement n 160/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 1049/67/EWG der Kommission vom 22. Dezember 1967 zur Festsetzung
    der Höhe der im ersten Vierteljahr des Jahres 1968 bei der Einfuhr der unter
    die Verordnung Nr. 160/66/EWG des Rates fallenden Waren in die Mitgliedstaaten
    anwendbaren beweglichen Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento n. 1049/67/CEE della Commissione, del 22 dicembre 1967, che
