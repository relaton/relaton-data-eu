    κανονισμού (ΕΚ) αριθ. 1235/2008 όσον αφορά τα πιστοποιητικά
    ελέγχου που αποστέλλονται με ηλεκτρονικά μέσα
    για εισαγόμενα βιολογικά προϊόντα και για
    κάποια άλλα στοιχεία, και του κανονισμού (ΕΚ)
