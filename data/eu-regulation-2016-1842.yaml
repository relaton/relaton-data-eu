    πληροφοριών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/1842, 14. oktoober 2016, millega muudetakse
    määrust (EÜ) nr 1235/2008 imporditud mahepõllumajanduslike toodete elektroonilise
    kontrollsertifikaadi ja teatava muu teabe osas ning määrust (EÜ) nr 889/2008
    säilitatud või töödeldud mahepõllumajanduslikele toodetele esitatavate nõuete
    ja teabe edastamise osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/1842, annettu 14 päivänä
    lokakuuta 2016, asetuksen (EY) N:o 1235/2008 muuttamisesta tuotavien luonnonmukaisten
    tuotteiden sähköisen tarkastussertifikaatin ja eräiden muiden seikkojen osalta
