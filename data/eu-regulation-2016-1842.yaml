    luonnonmukaisia tuotteita koskevien vaatimusten ja tietojen toimittamisen osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/1842 оd 14. listopada 2016. o izmjeni
    Uredbe (EZ) br. 1235/2008 u pogledu elektroničke potvrde o inspekciji za uvezene
    ekološke proizvode i određenih drugih elemenata i Uredbe (EZ) br. 889/2008 u
    pogledu zahtjeva za konzervirane ili prerađene ekološke proizvode i prijenos
    informacija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1842 végrehajtási rendelete (2016. október 14.)
    az 1235/2008/EK rendeletnek az importált ökológiai termékek elektronikus ellenőrzési
    tanúsítványa és egyes más elemek tekintetében, valamint a 889/2008/EK rendeletnek
    a tartósított vagy feldolgozott ökológiai termékekre vonatkozó követelmények
    és az információszolgáltatás tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/1842 della Commissione, del 14 ottobre
    2016, che modifica il regolamento (CE) n. 1235/2008 per quanto riguarda i certificati
    di ispezione elettronici per i prodotti biologici importati e taluni altri elementi,
    e il regolamento (CE) n. 889/2008 per quanto riguarda i requisiti per i prodotti
    biologici conservati o trasformati e la trasmissione delle informazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/1842 (2016. gada 14. oktobris),
    ar ko groza Regulu (EK) Nr. 1235/2008 attiecībā uz elektronisko inspekcijas
    sertifikātu importētiem bioloģiskiem produktiem, kā arī dažiem citiem elementiem
    un Regulu (EK) Nr. 889/2008 attiecībā uz prasībām, ko piemēro saglabātiem
    vai pārstrādātiem bioloģiskajiem produktiem, un informācijas nodošanu
  type: main
- language: lt
  script: Latn
  content: 2016 m. spalio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2016/1842,
    kuriuo iš dalies keičiamos Reglamento (EB) Nr. 1235/2008 nuostatos dėl elektroninio
    importuojamų ekologiškų produktų patikrinimo sertifikato ir tam tikrų kitų
    elementų ir Reglamento (EB) Nr. 889/2008 nuostatos dėl konservuotiems ir perdirbtiems
    ekologiškiems produktams taikomų reikalavimų ir informacijos perdavimo
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1842 tal-14 ta'
    Ottubru 2016 li jemenda r-Regolament (KE) Nru 1235/2008 f'dak li għandu x'jaqsam
    maċ-ċertifikat elettroniku ta' spezzjoni għall-prodotti organiċi importati
    u għal ċerti affarijiet oħrajn u r-Regolament (KE) Nru 889/2008 dwar ir-rekwiżiti
    għall-prodotti organiċi ppreservati jew ipproċessati u t-trażmissjoni tal-informazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/1842 van de Commissie van 14 oktober 2016
    tot wijziging van Verordening (EG) nr. 1235/2008 wat betreft het elektronische
    controlecertificaat voor ingevoerde biologische producten en bepaalde andere elementen,
    en Verordening (EG) nr. 889/2008 wat betreft de voorschriften voor verduurzaamde
    of verwerkte biologische producten en informatieverstrekking
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/1842 z dnia 14 października
    2016 r. zmieniające rozporządzenie (WE) nr 1235/2008 w odniesieniu do elektronicznych
    świadectw kontroli dotyczących przywożonych produktów ekologicznych i niektórych
    innych elementów oraz zmieniające rozporządzenie (WE) nr 889/2008 w odniesieniu
    do wymogów dotyczących konserwowanych lub przetworzonych produktów ekologicznych
    i przekazywania informacji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/1842 da Comissão, de 14 de outubro
    de 2016, que altera o Regulamento (CE) n.° 1235/2008 no que diz respeito ao certificado
    de inspeção eletrónico de produtos biológicos importados e de outros elementos
    e o Regulamento (CE) n.° 889/2008 no que diz respeito aos requisitos aplicáveis
    a produtos biológicos transformados ou conservados e a transmissão de informações
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/1842 al Comisiei din 14 octombrie
    2016 de modificare a Regulamentului (CE) nr. 1235/2008 în ceea ce privește certificatul
    de inspecție electronic pentru produsele ecologice importate și anumite alte
    elemente, precum și de modificare a Regulamentului (CE) nr. 889/2008 în ceea
    ce privește cerințele referitoare la produsele ecologice conservate sau prelucrate
    și la transmiterea informațiilor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/1842 zo 14. októbra 2016, ktorým
    sa mení nariadenie (ES) č. 1235/2008, pokiaľ ide o elektronický certifikát
    o inšpekcii dovážaných produktov ekologickej poľnohospodárskej výroby a
    o určité iné prvky, a nariadenie (ES) č. 889/2008, pokiaľ ide o požiadavky
    na uchované alebo spracované produkty ekologickej výroby a o prenos informácií
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/1842 z dne 14. oktobra 2016 o spremembi
    Uredbe (ES) št. 1235/2008 glede elektronskega potrdila o kontrolnem pregledu
    za uvožene ekološke proizvode in nekaterih drugih elementov ter Uredbe (ES)
    št. 889/2008 glede zahtev za konzervirane ali predelane ekološke proizvode in
    posredovanja informacij
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/1842 de la Comisión, de 14 de octubre
    de 2016, por el que se modifica el Reglamento (CE) n.° 1235/2008, en lo que se
    refiere al certificado de control electrónico para los productos ecológicos
    importados y otros elementos, y el Reglamento (CE) n.° 889/2008, en lo que se
    refiere a los requisitos que han de cumplir los productos ecológicos transformados
    o conservados y a la transmisión de información
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/1842 av den 14 oktober
    2016 om ändring av förordning (EG) nr 1235/2008 vad gäller det elektroniska
    kontrollintyget för importerade ekologiska produkter och vissa andra inslag,
    och av förordning (EG) nr 889/2008 vad gäller kraven för konserverade eller
    bearbetade ekologiska produkter och överföring av information
