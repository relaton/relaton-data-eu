title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1842 of 14 October 2016 amending
    Regulation (EC) No 1235/2008 as regards the electronic certificate of inspection
    for imported organic products and certain other elements, and Regulation (EC)
    No 889/2008 as regards the requirements for preserved or processed organic products
    and the transmission of information
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/1842 de la Commission du 14 octobre 2016
    modifiant le règlement (CE) n° 1235/2008 en ce qui concerne le certificat d'inspection
    électronique pour les produits biologiques importés et certains autres éléments
    ainsi que le règlement (CE) n° 889/2008 en ce qui concerne les exigences relatives
    aux produits biologiques conservés ou transformés et la transmission d'informations
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/1842 der Kommission vom 14. Oktober
    2016 zur Änderung der Verordnung (EG) Nr. 1235/2008 in Bezug auf die elektronische
    Kontrollbescheinigung für eingeführte ökologische/biologische Erzeugnisse und
    bestimmte andere Elemente sowie zur Änderung der Verordnung (EG) Nr. 889/2008
    in Bezug auf die Anforderungen für haltbar gemachte oder verarbeitete ökologische/biologische
    Erzeugnisse und die Übermittlung von Informationen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/1842 на Комисията
    от 14 октомври 2016 година за изменение на Регламент
    (ЕО) № 1235/2008 по отношение на електронния сертификат
    за инспекция на вносните биологични продукти
    и някои други елементи и на Регламент (ЕО) №
    889/2008 по отношение на изискванията към консервираните
    или преработени биологични продукти и предаването
    на информация
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/1842 ze dne 14. října 2016,
    kterým se mění nařízení (ES) č. 1235/2008, pokud jde o elektronické potvrzení
    o kontrole pro dovážené ekologické produkty a určité další prvky, a nařízení
    (ES) č. 889/2008, pokud jde o požadavky na konzervované nebo zpracované ekologické
    produkty a předávání informací
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/1842 af 14. oktober 2016
    om ændring af forordning (EF) nr. 1235/2008 for så vidt angår den elektroniske
    kontrolattest for importerede økologiske produkter og visse andre elementer og
    af forordning (EF) nr. 889/2008 for så vidt angår kravene vedrørende konserverede
    eller forarbejdede økologiske produkter og fremsendelse af oplysninger
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/1842 της Επιτροπής,
