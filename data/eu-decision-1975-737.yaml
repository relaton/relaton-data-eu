title:
- language: en
  script: Latn
  content: Commission Decision of 21 November 1975 on the granting by the Guidance
    Section of the EAGGF to the Kingdom of the Netherlands of a payment on account
    in respect of expenditure incurred during 1974 on aids and premiums relating to
    the modernization of farms
  type: main
- language: fr
  script: Latn
  content: '75/737/CEE: Décision de la Commission, du 21 novembre 1975, relative
    au versement par le FEOGA, section orientation, au Royaume des Pays-Bas d''un
    acompte sur les dépenses effectuées pendant l''année 1974 pour les aides et
    primes relatives à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. November 1975 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1974 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    das Königreich der Niederlande
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. november 1975 om udbetaling gennem EUGFL,
    udviklingssektionen, til kongeriget Nederlandene af et å contobeløb for de udgifter,
    som er afholdt i løbet af året 1974 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 novembre 1975, relativa al versamento
    da parte del FEAOG, sezione orientamento, al regno dei Paesi Bassi di un anticipo
    sulle spese effettuate durante il 1974 per gli aiuti ed i premi relativi all'ammodernamento
    delle aziende agricole
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 november 1975 inzake de betaling door
    het E.O.G.F.L., afdeling Oriëntatie, aan het Koninkrijk der Nederlanden van een
    voorschot voor de gedurende het jaar 1974 gedane uitgaven voor de steun en premies
    met betrekking tot de modernisering van landbouwbedrijven
