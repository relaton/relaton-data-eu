    forårsaget af influenzatype A, subtype H5N1, fra vildtlevende fugle til fjerkræ
    og andre fugle i fangenskab og om et system for tidlig påvisning i områder med
    særlig risiko (meddelt under nummer K(2005) 4163)'
  type: main
