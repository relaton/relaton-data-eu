title:
- language: en
  script: Latn
  content: '2005/734/EC: Commission Decision of 19 October 2005 laying down biosecurity
    measures to reduce the risk of transmission of highly pathogenic avian influenza
    caused by Influenza virus A subtype H5N1 from birds living in the wild to poultry
    and other captive birds and providing for an early detection system in areas at
    particular risk (notified under document number C(2005) 4163)'
  type: main
- language: fr
  script: Latn
  content: '2005/734/CE: Décision de la Commission du 19 octobre 2005 arrêtant des
    mesures de biosécurité destinées à limiter le risque de transmission aux volailles
    et autres oiseaux captifs, par des oiseaux vivant à l’état sauvage, de l’influenza
    aviaire hautement pathogène causée par le sous-type H5N1 du virus de l’influenza
    A, et établissant un système de détection précoce dans les zones particulièrement
    exposées [notifiée sous le numéro C(2005) 4163]'
  type: main
- language: de
  script: Latn
  content: '2005/734/EG: Entscheidung der Kommission vom 19. Oktober 2005 mit Biosicherheitsmaßnahmen
    zur Verringerung des Risikos der Übertragung hoch pathogener aviärer Influenza-A-Viren
    des Subtyps H5N1 von Wildvögeln auf Hausgeflügel und andere in Gefangenschaft
    gehaltene Vogelarten und zur Früherkennung der Krankheit in besonders gefährdeten
    Gebieten (Bekannt gegeben unter Aktenzeichen K(2005) 4163)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 19 октомври 2005 година
    за установяване на мерки за биосигурност с
    цел намаляване на риска от пренасяне на високо
    патогенна инфлуенца по птиците, причинена
    от вирус на инфлуенца А, подтип H5N1, от птици,
    живеещи в дивата среда, към домашни птици и
    други птици, отглеждани на закрито, и за осигуряване
    на система за ранно откриване в области с особен
    риск (нотифицирано под номер С(2005) 4163)
  type: main
- language: cs
  script: Latn
  content: '2005/734/ES: Rozhodnutí Komise ze dne 19. října 2005, kterým se stanoví
    opatření biologické bezpečnosti, jež mají snížit riziko přenosu vysoce
    patogenní influenzy ptáků způsobované virem influenzy typu A podtypu H5N1
    z volně žijících ptáků na drůbež a jiné ptáky chované v zajetí, a
