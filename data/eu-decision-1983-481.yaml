title:
- language: en
  script: Latn
  content: '83/481/EEC: Commission Decision of 14 September 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain textile products,
    originating in Turkey, which have been put into free circulation in the Community
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/481/CEE: Décision de la Commission du 14 septembre 1983 autorisant
    la République française à procéder à une surveillance intracommunautaire
    des importations de certains produits textiles originaires de Turquie et mis en
    libre pratique dans la Communauté (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/481/EWG: Entscheidung der Kommission vom 14. September 1983 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von bestimmten aus der Türkei stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Textilwaren (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/481/EØF: Kommissionens beslutning af 14. september 1983 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse tekstilprodukter med oprindelse i Tyrkiet og overgået til fri omsætning
    i Fællesskabet (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/481/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Σεπτεμβρίου 1983 για τη χορήγηση αδείας στη Γαλλική
    Δημοκρατία να προχωρήσει σε ενδοκοινοτική
    επιτήρηση των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής Τουρκίας που έχουν τεθεί
    σε ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/481/CEE: Decisione della Commissione del 14 settembre 1983 che autorizza
    la Repubblica francese a istituire una sorveglianza intracomunitaria sulle importazioni
    di taluni prodotti tessili originari della Turchia e immessi in libera pratica
    nella Comunità (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/481/EEG: Beschikking van de Commissie van 14 september 1983 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde textielprodukten, van oorsprong uit Turkije,
    die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst in
    de Franse taal is authentiek)'
