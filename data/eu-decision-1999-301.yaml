id: EUDecision1999301
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/301/EC: Commission Decision of 30 April 1999 amending Decision 87/257/EEC
    on the list of establishments in the United States of America approved for the
    purpose of importing fresh meat into the Communiy and amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorise
    imports of bovine animals, swine, fresh meat and meat products [notified under
    document number C(1999) 1165]'
  type: main
- language: fr
  script: Latn
  content: '1999/301/CE: Décision de la Commission, du 30 avril 1999, modifiant la
    décision 87/257/CEE relative à la liste des établissements des États-Unis
    d''Amérique agréés pour l''importation de viandes fraîches dans la Communauté
    et la décision 79/542/CEE du Conseil établissant une liste des pays tiers en
    provenance desquels les États membres autorisent l''importation d''animaux des
    espèces bovine et porcine, de viandes fraîches et de produits à base de viande
    [notifiée sous le numéro C(1999) 1165]'
  type: main
- language: de
  script: Latn
  content: '1999/301/EG: Entscheidung der Kommission vom 30. April 1999 zur Änderung
    der Entscheidung 87/257/EWG über eine Liste der Betriebe in den Vereinigten Staaten
    von Amerika, die zur Einfuhr frischen Fleisches in die Gemeinschaft zugelassen
    sind, und zur Änderung der Entscheidung 79/542/EWG des Rates zur Aufstellung
    einer Liste von Drittländern, aus denen die Mitgliedstaaten Einfuhren von Rindern,
    Schweinen, Einhufern, Schafen und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen
    zulassen [Bekanntgegeben unter Aktenzeichen K(1999) 1165]'
  type: main
- language: da
  script: Latn
  content: '1999/301/EF: Kommissionens beslutning af 30. april 1999 om ændring af
    beslutning 87/257/EØF om listen over virksomheder i Amerikas Forenede Stater,
    der er godkendt til indførsel af fersk kød til Fællesskabet, og om ændring
    af Rådets beslutning 79/542/EØF om listen over de tredjelande, hvorfra medlemsstaterne
    tillader indførsel af kvæg, svin, fersk kød og kødprodukter [meddelt under
    nummer K(1999) 1165]'
  type: main
- language: el
  script: Grek
  content: '1999/301/ΕΚ: Απόφαση της Επιτροπής, της 30ής
    Απριλίου 1999, για τροποποίηση της απόφασης 87/257/ΕΟΚ
    σχετικά με τον πίνακα των εγκαταστάσεων των
    Ηνωμένων Πολιτειών της Αμερικής που εγκρίνονται
    για την εισαγωγή νωπών κρεάτων στην Κοινότητα
    και για τροποποίηση της απόφασης 79/542/ΕΟΚ του
    Συμβουλίου περί καταρτίσεως καταλόγου τρίτων
    χωρών από τις οποίες τα κράτη μέλη επιτρέπουν
    τις εισαγωγές βοοειδών, χοιροειδών, νωπού κρέατος
    και προϊόντων κρέατος - [κοινοποιηθείσα υπό
    τον αριθμό Ε(1999) 1165] -'
  type: main
- language: fi
  script: Latn
  content: '1999/301/EY: Komission päätös, tehty 30 päivänä huhtikuuta 1999,
    luettelosta Amerikan yhdysvaltojen laitoksista, joista tuoreen lihan tuonti yhteisöön
    sallitaan, tehdyn päätöksen 87/257/ETY ja luettelosta kolmansista maista, joista
    jäsenvaltiot sallivat nautaeläinten, sikojen ja tuoreen lihan tuonnin, tehdyn
    neuvoston päätöksen 79/542/ETY muuttamisesta [tiedoksiannettu numerolla K(1999)
    1165]'
  type: main
- language: it
  script: Latn
  content: '1999/301/CE: Decisione della Commissione, del 30 aprile 1999, che modifica
    la desisione 87/257/CEE relativa all''elenco degli stabilimenti degli Stati Uniti
    d''America dai quali è autorizzata l''importazione di carni fresche nella Comunità
    e la decisione 79/542/CEE del Consiglio recante l''elenco dei paesi terzi da cui
    gli Stati membri autorizzano l''importazione di animali delle specie bovina, suina,
    ovina e caprina, di equidi nonché di carni fresche e di prodotti a base di carne
    [notificata con il numero C(1999) 1165]'
  type: main
- language: nl
  script: Latn
  content: '1999/301/EG: Beschikking van de Commissie van 30 april 1999 houdende wijziging
    van Beschikking 87/257/EEG inzake de lijst van voor de invoer van vers vlees in
    de Gemeenschap erkende inrichtingen in de Verenigde Staten van Amerika en van
    Beschikking 79/542/EEG van de Raad tot vaststelling van een lijst van derde landen
    waaruit de lidstaten de invoer van runderen, varkens, vers vlees en vleesproducten
    toestaan [kennisgeving geschied onder nummer C(1999) 1165]'
  type: main
- language: pt
  script: Latn
  content: '1999/301/CE: Decisão da Comissão, de 30 de Abril de 1999, que altera
    a Decisão 87/257/CEE relativa á lista dos estabelecimentos dos Estados Unidos
    da América aprovados para a importação de carnes frescas na Comunidade e que
    altera a Decisão 79/542/CEE do Conselho que estabelece uma lista de países terceiros
    de onde os Estados-membros autorizam a importação de animais das espécies bovina
    e suína e de carne fresca [notificada com o número C(1999) 1165]'
  type: main
- language: es
  script: Latn
  content: '1999/301/CE: Decisión de la Comisión, de 30 de abril de 1999, por la
    que se modifican la Decisión 87/257/CEE relativa a la lista de establecimientos
    de los Estados Unidos de América autorizados a efectos de importación de carnes
    frescas en la Comunidad y la Decisión 79/542/CEE del Consejo por la que confecciona
    una lista de terceros países desde los cuales los Estados miembros autorizan
    importaciones de animales de las especies bovina, porcina, ovina y caprina, de
    équidos, de carnes frescas y de productos a base de carne [notificada con el
    número C(1999) 1165]'
  type: main
- language: sv
  script: Latn
  content: '1999/301/EG: Kommissionens beslut av den 30 april 1999 om ändring av
    beslut 87/257/EEG om förteckningen över de anläggningar i USA som är godkända
    för import av färskt kött till gemenskapen och om ändring av rådets beslut
    79/542/EEG om upprättande av en förteckning över de tredje länder från vilka
    medlemsstaterna tillåter import av nötkreatur, svin, färskt kött och köttprodukter
    [delgivet med nr K(1999) 1165]'
