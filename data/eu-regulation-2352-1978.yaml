title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2352/78 of 9 October 1978 re-establishing
    the levying of customs duties on wrought plates, sheets and strip, of copper,
    falling within heading No 74.04, originating in Chile, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2352/78 de la Commission, du 9 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en cuivre, d' une épaisseur de plus de 0,15 millimètre,
    de la position 74.04 du tarif douanier commun, originaires du Chili, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2352/78 der Kommission vom 9. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Bleche, Platten, Tafeln und Bánder, aus Kupfer, mit einer
    Dicke von mehr als 0,15 mm, der Tarifnummer 74.04, mit Ursprung in Chile, dem
    die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2352/78 af 9. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af kobber, under position 74.04,
    som har oprindelse i Chile og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2352/78 della Commissione, del 9 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri di rame, di spessore superiore a 0,15 mm della voce doganale 74.04,
    originari del Cile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2352/78 van de Commissie van 9 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen,
    bladen en strippen, van koper, met een dikte van meer dan 0,15 mm, van post 74.04,
    van oorsprong uit Chili, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad algemene tariefpreferenties werden geopend
  type: main
