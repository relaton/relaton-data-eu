  script: Latn
  content: Commission Regulation (EC) No 260/2003 of 12 February 2003 amending Regulation
    (EC) No 999/2001 of the European Parliament and of the Council as regards the
    eradication of transmissible spongiform encephalopathies in ovine and caprine
    animals and rules for the trade in live ovine and caprine animals and bovine embryos
  type: main
- language: fr
  script: Latn
