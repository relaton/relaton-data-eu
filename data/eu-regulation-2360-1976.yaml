title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2360/76 of 29 September 1976 supplementing
    Regulations (EEC) No 743/76 and (EEC) No 803/76 laying down detailed rules for
    the granting of certain premiums for beef and veal as regards the event giving
    rise to payment of the premiums
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2360/76 de la Commission, du 29 septembre 1976, complétant
    les règlements (CEE) n° 743/76 et n° 803/76 établissant des modalités d'application
    relatives à l'octroi de certaines primes dans le secteur de la viande bovine,
    en ce qui concerne le fait générateur du paiement de ces primes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2360/76 der Kommission vom 29. September 1976 zur
    Ergänzung der Verordnungen (EWG) Nr. 743/76 und Nr. 803/76 über Durchführungsvorschriften
    für die Gewährung bestimmter Prämien im Sektor Rindfleisch hinsichtlich des
    die Zahlung der Prämien begründenden Tatbestands
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2360/76 af 29. september 1976 om supplering
    af forordning (EØF) nr. 743/76 og (EØF) nr. 803/76 om gennemførelsesbestemmelser
    vedrørende visse præmier i oksekødsektoren for så vidt angår det forhold,
    der ligger til grund for betalingen af disse præmier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2360/76 della Commissione, del 29 settembre 1976,
    che completa i regolamenti (CEE) n. 743/76 e (CEE) n. 803/76 che stabiliscono
    le modalità di concessione di taluni premi nel settore delle carni bovine per
    quanto riguarda il fatto generatore del pagamento dei premi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2360/76 van de Commissie van 29 september 1976 tot
    aanvulling van de Verordeningen (EEG) nr. 743/76 en (EEG) nr. 803/76 tot vaststelling
    van de uitvoeringsbepalingen inzake toekenning van premies in de sector rundvlees,
    ten aanzien van het feit waardoor het premiebedrag verschuldigd wordt
  type: main
