title:
- language: en
  script: Latn
  content: '78/638/EEC: Commission Decision of 30 June 1978 authorizing the United
    Kingdom of Great Britain and Northern Ireland to grant exemptions for national
    road transport operations from the Community Regulations on social matters relating
    to road transport (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/638/CEE: Décision de la Commission, du 30 juin 1978, autorisant le
    Royaume-Uni de Grande-Bretagne et d''Irlande du Nord à appliquer, pour les transports
    nationaux par route, des mesures dérogeant aux dispositions des règlements communautaires
    en matière sociale dans le domaine des transports par route (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '78/638/EWG: Entscheidung der Kommission vom 30. Juni 1978, durch die das
    Vereinigte Königreich von Großbritannien und Nordirland ermáchtigt wird, im
    innergemeinschaftlichen Gúterverkehr von den Bestimmungen der gemeinschaftlichen
    Sozialregelungen im Straßenverkehr abweichende Maßnahmen zu treffen (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/638/EØF: Kommissionens beslutning af 30. juni 1978 om bemyndigelse
    af Det forenede kongerige Storbritannien og Nordirland til, for så vidt angår
    indenlandsk transport ad landevej, at træffe foranstaltninger som undtagelse
    fra bestemmelserne i Rådets forordninger på det sociale område inden for landevejstransport
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '78/638/ΕΟΚ : Απόφαση της Επιτροπής, της 30ής
    Ιουνίου 1978, με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο της Μεγάλης Βρετανίας και Βορείου
    Ιρλανδίας να εφαρμόσει για τις εθνικές οδικές
    μεταφορές, μέτρα που αποκλίνουν από τις διατάξεις
    των κοινοτικών κανονισμών για τις κοινωνικές
    ασφαλίσεις στον τομέα των οδικών μεταφορών
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '78/638/CEE: Decisione della Commissione, del 30 giugno 1978, che autorizza
    il Regno Unito di Gran Bretagna e Irlanda del Nord ad applicare, per i trasporti
    nazionali su strada, talune misure in deroga alle disposizioni dei regolamenti
    comunitari in materia sociale nel settore dei trasporti su strada (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '78/638/EEG: Beschikking van de Commissie van 30 juni 1978 waarbij het
    Verenigd Koninkrijk van Groot- Brittannië en Noord-Ierland worden gemachtigd
    om met betrekking tot het nationale wegvervoer, maatregelen toe te passen die
    afwijken van de voorschriften van de communautaire verordeningen van sociale aard
    voor het wegvervoer (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
