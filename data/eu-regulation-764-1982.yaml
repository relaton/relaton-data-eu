title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 764/82 of 31 March 1982 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 764/82 du Conseil, du 31 mars 1982, modifiant le règlement
    (CEE) n° 3035/80 établissant, pour certains produits agricoles exportés sous
    forme de marchandises ne relevant pas de l' annexe II du traité, les règles
    générales relatives à l' octroi des restitutions à l' exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 764/82 des Rates vom 31. März 1982 zur Änderung
    der Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln für die
    Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 764/82 af 31. marts 1982 om ændring af forordning
    (EØF) nr. 3035/80 om fastlæggelse af almindelige regler for ydelse af eksportrestitutioner
    og om fastlæggelse af kriterierne for fastsættelse af restitutionsbeløbet for
    visse landbrugsprodukter, der udføres i form af varer, som ikke omfattes af traktatens
    bilag IIA
  type: main
- language: el
  script: Grek
