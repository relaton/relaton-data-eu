  script: Latn
  content: '82/412/EEC: Commission Decision of 7 June 1982 establishing that the apparatus
    described as ''Cahn - Recording Electrobalance, model Cahn 2000'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/412/CEE: Décision de la Commission, du 7 juin 1982, constatant que
    l''importation de l''appareil dénommé "Cahn-recording electrobalance, model
    Cahn 2000" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/412/EWG: Entscheidung der Kommission vom 7. Juni 1982, mit der festgestellt
    wird, daß das Gerät ,,Cahn- Recording Electrobalance, model Cahn 2000" nicht
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/412/EØF: Kommissionens beslutning af 7. juni 1982 om fastslåelse
    af, at indførsel af apparatet "Cahn- Recording Electrobalance, model Cahn 2000"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
