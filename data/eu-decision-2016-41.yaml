id: EUDecision201641
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/41 of 14 January 2016 amending
    Annex II to Decision 2007/777/EC as regards the entry for Mexico in the list of
    third countries or parts thereof from which the introduction of meat products
    and treated stomachs, bladders and intestines into the Union is authorised in
    relation to highly pathogenic avian influenza (notified under document C(2016)
    41)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/41 de la Commission du 14 janvier 2016
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne l'entrée
    relative au Mexique sur la liste des pays tiers ou parties de pays tiers à partir
    desquels l'introduction dans l'Union de produits à base de viande et d'estomacs,
    vessies et boyaux traités est autorisée, pour ce qui est de l'influenza aviaire
    hautement pathogène [notifiée sous le numéro C(2016) 41]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/41 der Kommission vom 14. Januar 2016
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    zu Mexiko in der Liste der Drittländer bzw. der Teile von Drittländern, aus
    denen die Einfuhr von Fleischerzeugnissen und behandelten Mägen, Blasen und Därmen
    in die Europäische Union gestattet ist, in Bezug auf die hochpathogene Aviäre
    Influenza (Bekanntgegeben unter Aktenzeichen C(2016) 41)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/41 на Комисията
    от 14 януари 2016 година за изменение във връзка
    с високопатогенна инфлуенца по птиците на
    приложение II към Решение 2007/777/ЕО по отношение
    на вписването за Мексико в списъка на трети
    държави или части от тях, от които е разрешено
    въвеждането в Съюза на месни продукти и обработени
    стомаси, пикочни мехури и черва (нотифицирано
    под номер С(2016) 41)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/41 ze dne 14. ledna 2016, kterým
    se mění příloha II rozhodnutí 2007/777/ES, pokud jde o položku pro Mexiko
    na seznamu třetích zemí nebo jejich částí, z nichž je do Unie povolen dovoz
    masných výrobků a opracovaných žaludků, močových měchýřů a střev
    v souvislosti s vysoce patogenní influenzou ptáků (oznámeno pod číslem C(2016)
    41)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/41 af 14. januar 2016
    om ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysningerne
    om Mexico i listen over tredjelande og dele af tredjelande, hvorfra indførsel
    af kødprodukter og behandlede maver, blærer og tarme til Unionen er tilladt
    i forbindelse med højpatogen aviær influenza (meddelt under nummer C(2016) 41)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/41 της Επιτροπής,
    της 14ης Ιανουαρίου 2016, για την τροποποίηση
    του παραρτήματος II της απόφασης 2007/777/ΕΚ όσον
    αφορά την καταχώριση για το Μεξικό στον κατάλογο
    τρίτων χωρών ή τμημάτων τους εκ των οποίων
    επιτρέπεται η εισαγωγή στην Ένωση προϊόντων
    με βάση το κρέας και επεξεργασμένων στομαχιών,
    ουροδόχων κύστεων και εντέρων, όσον αφορά την
    υψηλής παθογονικότητας γρίπη των πτηνών [κοινοποιηθείσα
    υπό τον αριθμό C(2016) 41]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/41, 14. jaanuar 2016, millega muudetakse
    seoses kõrge patogeensusega linnugripiga otsuse 2007/777/EÜ II lisas esitatud
    Mehhikot käsitlevat kannet loetelus, kus on esitatud need kolmandad riigid või
    nende osad, kust lubatakse liitu tuua lihatooteid ning töödeldud magusid, põisi
    ja sooli (teatavaks tehtud numbri C(2016) 41 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/41, annettu 14 päivänä
    tammikuuta 2016, päätöksen 2007/777/EY liitteen II muuttamisesta Meksikoa koskevan
    kohdan osalta niiden kolmansien maiden ja kolmansien maiden osien luettelossa,
    joista lihavalmisteiden sekä käsiteltyjen mahojen, rakkojen ja suolten tuonti
    unioniin on sallittua korkeapatogeenisen lintuinfluenssan yhteydessä (tiedoksiannettu
    numerolla C(2016) 41)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/41 оd 14. siječnja 2016. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Meksiko na popisu trećih zemalja
    ili dijelova trećih zemalja iz kojih je odobreno unošenje mesnih proizvoda i
    obrađenih želudaca, mjehura i crijeva u Uniju u vezi s visokopatogenom influencom
    ptica (priopćeno pod brojem dokumenta C(2016) 41)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/41 végrehajtási határozata (2016. január 14.)
    az erősen patogén madárinfluenza kapcsán a 2007/777/EK határozat II. mellékletének
    a húskészítmények, a kezelt gyomor, a hólyag és a belek Unióba történő
    behozatalára engedélyezett harmadik országok vagy részeik jegyzékének a
    Mexikóra vonatkozó bejegyzés tekintetében történő módosításáról (az
    értesítés a C(2016) 41. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/41 della Commissione, del 14 gennaio
    2016, che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    la voce relativa al Messico nell'elenco di paesi terzi o di parti di paesi terzi
    dai quali l'introduzione nell'Unione di prodotti a base di carne e stomaci, vesciche
    e intestini trattati è autorizzata, in relazione all'influenza aviaria ad alta
    patogenicità [notificata con il numero C(2016) 41]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/41 (2016. gada 14. janvāris),
    ar ko Lēmuma 2007/777/EK II pielikumu groza attiecībā uz ierakstu par Meksiku
    to trešo valstu vai to daļu sarakstā, no kurām saistībā ar augsti patogēno
    putnu gripu atļauts Savienībā importēt gaļas produktus un apstrādātus kuņģus,
    pūšļus un zarnas (izziņots ar dokumenta numuru C(2016) 41)
  type: main
- language: lt
  script: Latn
  content: 2016 m. sausio 14 d. Komisijos įgyvendinimo sprendimas (ES) 2016/41, kuriuo
    dėl labai patogeniško paukščių gripo ir su ta liga susijusio Meksikos įrašo
    trečiųjų šalių ir jų dalių, iš kurių leidžiama įvežti į Sąjungą
    mėsos gaminius ir apdorotus skrandžius, pūsles ir žarnas, sąraše iš dalies
    keičiamas Sprendimo 2007/777/EB II priedas (pranešta dokumentu Nr. C(2016) 41)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/41 tal-14 ta'
    Jannar 2016 li temenda l-Anness II tad-Deċiżjoni 2007/777/KE rigward l-entrata
    għall-Messiku fil-lista ta' pajjiżi terzi jew partijiet tagħhom, li minnhom
    hija awtorizzata l-introduzzjoni ta' prodotti tal-laħam u ta' stonkijiet, bżieżaq
    tal-awrina u msaren ittrattati lejn l-Unjoni b'rabta mal-influwenza tat-tjur b'patoġeniċità
    għolja (notifikata bid-dokument C(2016) 41)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/41 van de Commissie van 14 januari 2016 tot
    wijziging van bijlage II bij Beschikking 2007/777/EG wat betreft de vermelding
    voor Mexico in de lijst van derde landen of delen daarvan waaruit vleesproducten
    en behandelde magen, blazen en darmen in de Unie mogen worden binnengebracht in
    verband met hoogpathogene aviaire influenza (Kennisgeving geschied onder nummer
    C(2016) 41)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/41 z dnia 14 stycznia 2016 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w odniesieniu do wpisu dotyczącego Meksyku
    w wykazie państw trzecich lub ich części, z których dozwolone jest wprowadzanie
    do Unii produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit,
    w związku z wysoce zjadliwą grypą ptaków (notyfikowana jako dokument nr C(2016)
    41)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/41 da Comissão, de 14 de janeiro de 2016,
    que altera o anexo II da Decisão 2007/777/CE no que se refere à entrada relativa
    ao México na lista de países terceiros ou de partes de países terceiros a partir
    dos quais é autorizada a introdução na União de produtos à base de carne
    e de estômagos, bexigas e intestinos tratados, relativamente à gripe aviária
    de alta patogenicidade [notificada com o número C(2016) 41]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/41 a Comisiei din 14 ianuarie
    2016 de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubrica
    referitoare la Mexic din lista țărilor terțe sau a părților acestora din
    care se autorizează introducerea în Uniune de produse din carne și stomacuri,
    vezici și intestine tratate, în contextul riscului de gripă aviară înalt
    patogenă [notificată cu numărul C(2016) 41]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/41 zo 14. januára 2016, ktorým
    sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o zápis týkajúci
    sa Mexika v zozname tretích krajín alebo ich častí, z ktorých je povolený
    vstup mäsových výrobkov a opracovaných žalúdkov, mechúrov a čriev do Únie
    v súvislosti s vysokopatogénnou aviárnou influenzou [oznámené pod číslom
    C(2016) 41]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/41 z dne 14. januarja 2016 o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosa za Mehiko na seznamu tretjih držav
    ali njihovih delov, iz katerih je dovoljen vnos mesnih izdelkov ter obdelanih
    želodcev, mehurjev in črev v Unijo v zvezi z visokopatogeno aviarno influenco
    (notificirano pod dokumentarno številko C(2016) 41)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/41 de la Comisión, de 14 de enero de
    2016, que modifica el anexo II de la Decisión 2007/777/CE en lo que respecta
    a la entrada correspondiente a México de la lista de terceros países y partes
    de estos desde donde está autorizada la introducción en la Unión de productos
    cárnicos y de estómagos, vejigas e intestinos tratados, en relación con la
    gripe aviar altamente patógena [notificada con el número C(2016) 41]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/41 av den 14 januari 2016 om
    ändring av bilaga II till beslut 2007/777/EG vad gäller uppgifterna om Mexiko
    i förteckningen över tredjeländer och delar av tredjeländer från vilka köttprodukter
    och behandlade magar, blåsor och tarmar får föras in till unionen i samband
