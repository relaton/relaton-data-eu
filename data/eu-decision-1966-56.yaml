title:
- language: fr
  script: Latn
  content: Décision 66/56/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République française, de sucreries sans
    cacao, ne contenant pas de liqueur alcoolique, en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: '66/56/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Zuckerwaren ohne Kakaogehalt, nicht alkoholhaltig, aus verschiedenen
    Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '66/56/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    ulteriormente la decisione del 6 novembre 1964 che autorizza la riscossione di
    tasse di compensazione sulle importazioni nella Repubblica francese di prodotti
    a base di zuccheri senza cacao, non contenenti sostanze alcoliche, in provenienza
    dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/56/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van suikerwerk
    zonder cacao, geen likeur bevattende, uit de overige Lid-Staten'
  type: main
