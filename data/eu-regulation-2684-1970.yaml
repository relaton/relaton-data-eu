  content: Règlement (CEE) n° 2684/70 de la Commission du 29 décembre 1970, prorogeant
    en modifiant les règlements (CEE) n° 1430/70, 1679/70 et 1634/70, le régime
    applicable aux vins importés en provenance d'Algérie, du Maroc, de la Turquie
    ou de la Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2684/70 der Kommission vom 29. Dezember 1970 zur Änderung
    der Verordnungen (EWG) Nr. 1430/70, Nr. 1679/70 und Nr. 1634/70 über die Verlängerung
    der Regelung für aus Algerien, Marokko oder Tunesien und der Türkei eingeführte
    Weine
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2684/70 della Commissione, del 29 dicembre 1970, che
    proroga modificando i regolamenti (CEE) nn. 1430/70, 1679/70 e 1634/70 il regime
    applicabile ai vini importati in provenienza dall'Algeria, dal Marocco, dalla
    Tunisia o dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2684/70 van de Commissie van 29 december 1970 houdende
    wijziging van de Verordeningen (EEG) nrs. 1430/70, 1679/70 en 1634/70, ter verlenging
    van de regeling welke van toepassing is op uit Algerije, Marokko, Tunesië of
    Turkije ingevoerde wijn
  type: main
