title:
- language: en
  script: Latn
  content: '2008/404/EC: Commission Decision of 21 May 2008 amending Decision 2003/467/EC
    as regards the declaration that a certain administrative region of Italy is officially
    free of bovine tuberculosis and that certain administrative regions of Poland
    are officially free of enzootic bovine leukosis (notified under document number
    C(2008) 1876)'
  type: main
- language: fr
  script: Latn
