title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2210/73 of the Commission of 27 July 1973 adjusting
    the compensatory amounts and variable components applicable during the third quarter
    of 1973 on importation of goods covered by Regulation (EEC) No 1059/69 and containing
    cereals or rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2210/73 de la Commission, du 27 juillet 1973, portant
    rectification des montants compensatoires et des éléments mobiles applicables,
    pendant le troisième trimestre de l'année 1973, à l'importation de marchandises
    relevant du règlement (CEE) n 1059/69, contenant des céréales ou du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2210/73 der Kommission vom 27. Juli 1973 zur Berichtigung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das dritte Vierteljahr
    1973 bei der Einfuhr von Waren, die Getreide oder Reis enthalten und unter die
    Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2210/73 af 27. juli 1973 om berigtigelse
    af de udligningsbeløb og variable elementer, som i tredje kvartal af 1973 skal
    anvendes ved indførsel af varer, henhørende under forordning (EØF) nr. 1059/69
    og indeholdende korn eller ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2210/73 della Commissione, del 27 luglio 1973, che
    rettifica gli importi compensativi e gli elementi mobili applicabili durante il
    terzo trimestre dell'anno 1973, all'importazione delle merci cui si applica il
    regolamento (CEE) n. 1059/69, contenenti cereali o riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2210/73 van de Commissie van 27 juli 1973 houdende
    verbetering van de variabele elementen en compenserende bedragen, toepasselijk
    gedurende het derde kwartaal van 1973 bij invoer van onder Verordening (EEG) nr.
    1059/69 vallende goederen welke graan of rijst bevatten
  type: main
