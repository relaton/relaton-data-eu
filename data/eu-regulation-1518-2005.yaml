  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1518/2005 della Commissione, del 19 settembre 2005,
    recante modifica degli allegati I e III del regolamento (CEE) n. 2377/90 del Consiglio,
    del 26 giugno 1990, che definisce una procedura comunitaria per la determinazione
    dei limiti massimi di residui di medicinali veterinari negli alimenti di origine
    animale, per quanto riguarda l’acetilisovaleriltilosina e il fluazuron
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1518/2005 (2005. gada 19. septembris), ar kuru
