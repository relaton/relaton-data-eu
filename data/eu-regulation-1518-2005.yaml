    procedūru veterināro zāļu maksimāli pieļaujamo atlieku daudzumu noteikšanai
    dzīvnieku izcelsmes produktos, attiecībā uz acetilizovaleriltilozīnu un fluazuronu
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 19 d. Komisijos reglamentas (EB) Nr. 1518/2005, iš dalies
