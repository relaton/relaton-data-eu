title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1518/2005 of 19 September 2005 amending Annexes
    I and III to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin, as regards acetylisovaleryltylosin and fluazuron
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1518/2005 de la Commission du 19 septembre 2005 modifiant
    les annexes I et III du règlement (CEE) n° 2377/90 du Conseil établissant une
    procédure communautaire pour la fixation des limites maximales de résidus de
    médicaments vétérinaires dans les aliments d’origine animale en ce qui concerne
    l’acétylisovaléryltylosine et le fluazuron
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1518/2005 der Kommission vom 19. September 2005 zur
    Änderung der Anhänge I und III der Verordnung (EWG) Nr. 2377/90 des Rates zur
    Schaffung eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen
    für Tierarzneimittelrückstände in Nahrungsmitteln tierischen Ursprungs in Bezug
    auf Acetylisovaleryltylosin und Fluazuron
  type: main
