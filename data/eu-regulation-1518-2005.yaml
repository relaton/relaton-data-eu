  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1518/2005 z dnia 19 września 2005 r. zmieniające
    załączniki I i III do rozporządzenia Rady (EWG) nr 2377/90 ustanawiającego
    wspólnotową procedurę określania najwyższych dopuszczalnych poziomów pozostałości
    weterynaryjnych produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego
