  script: Latn
  content: Commission Regulation (EEC) No 503/84 of 27 February 1984 fixing for Great
    Britain the level of the variable slaughter premium for sheep and the amounts
    to be charged on products leaving that region
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 503/84 de la Commission, du 27 février 1984, fixant
    pour la Grande-Bretagne le montant de la prime variable à l'abattage des ovins
    et les montants à percevoir sur les produits quittant cette région
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 503/84 der Kommission vom 27. Februar 1984 zur Festsetzung
    der Höhe der variablen Schlachtprämie für Schafe in Großbritannien und der
    Beträge, die auf die dieses Gebiet verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 503/84 af 27. februar 1984 om fastsættelse
    for Storbritannien af den variable præmie for slagtning af får og af de beløb,
    der skal opkræves for produkter, som udføres fra dette område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 503/84 της Επιτροπής
