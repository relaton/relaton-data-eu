    da assistência financeira da União para autorizações plurianuais no setor
    dos frutos e produtos hortícolas, devido à crise causada pela invasão da Ucrânia
    pela Rússia
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1623 al Comisiei din 14 iulie 2022 de derogare
