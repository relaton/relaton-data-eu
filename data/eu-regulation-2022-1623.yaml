    de afgezette productie, de nationale strategie en de terugvordering van financiële
    bijstand van de Unie voor meerjarige verbintenissen in de sector groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1623 z dnia 14 lipca 2022
