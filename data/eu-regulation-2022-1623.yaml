    financiare din partea Uniunii pentru angajamentele multianuale în sectorul fructelor
    și legumelor ca urmare a crizei cauzate de invadarea Ucrainei de către Rusia
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1623 zo 14. júla 2022, ktorým
