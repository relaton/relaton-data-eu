    nuo Deleguotojo reglamento (ES) 2017/891 nuostatų dėl parduodamos produkcijos
    vertės, nacionalinės strategijos ir Sąjungos finansinės paramos, skirtos daugiamečiams
    įsipareigojimams vaisių ir daržovių sektoriuje vykdyti, susigrąžinimo
  type: main
- language: mt
  script: Latn
