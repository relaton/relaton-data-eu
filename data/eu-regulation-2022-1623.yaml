    odzyskania pomocy finansowej Unii na wieloletnie zobowiązania w sektorze owoców
    i warzyw w związku z kryzysem spowodowanym inwazją Rosji na Ukrainę
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1623 da Comissão de 14 de julho de 2022
