  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1623 оd 14. srpnja 2022. o odstupanju
    od Delegirane uredbe (EU) 2017/891 za 2022. u pogledu vrijednosti proizvodnje
    stavljene na tržište, nacionalne strategije i povrata financijske pomoći Unije
    za višegodišnje obveze u sektoru voća i povrća zbog krize uzrokovane ruskom
    invazijom na Ukrajinu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1623 felhatalmazáson alapuló rendelete (2022.
    július 14.) az (EU) 2017/891 felhatalmazáson alapuló rendelettől a forgalmazott
    termékek értéke, a nemzeti stratégia, valamint a gyümölcs- és zöldségágazatban
    tett többéves kötelezettségvállalásokhoz nyújtott uniós pénzügyi támogatás
    visszafizettetése tekintetében az Ukrajna elleni orosz invázió nyomán kialakult
    válság miatt a 2022. évben történő eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1623 della Commissione del 14 luglio 2022
    recante deroga, per l’anno 2022, al regolamento delegato (UE) 2017/891 per quanto
    riguarda il valore della produzione commercializzata, la strategia nazionale e
    il recupero dell’aiuto finanziario dell’Unione per gli impegni pluriennali
    nel settore degli ortofrutticoli a causa della crisi provocata dall’invasione
    russa dell’Ucraina
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1623 (2022. gada 14. jūlijs), ar
    kuru sakarā ar krīzi, ko izraisījis Krievijas iebrukums Ukrainā, attiecībā
    uz tirgū laistās produkcijas vērtību, valsts stratēģiju un par daudzgadu
    saistībām saņemtās Savienības finansiālās palīdzības atgūšanu augļu
    un dārzeņu nozarē uz 2022. gadu atkāpjas no Deleģētās regulas (ES) 2017/891
  type: main
- language: lt
  script: Latn
