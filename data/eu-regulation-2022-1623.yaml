    tal-produzzjoni kkummerċjalizzata, l-istrateġija nazzjonali u l-irkupru tal-assistenza
    finanzjarja tal-Unjoni għal impenji pluriennali fis-settur tal-frott u l-ħxejjex
    minħabba l-kriżi kkawżata mill-invażjoni tal-Ukrajna mir-Russja
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1623 van de Commissie van 14 juli 2022
