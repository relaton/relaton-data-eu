title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1623 of 14 July 2022 derogating
    from Delegated Regulation (EU) 2017/891 for the year 2022 as regards the value
    of marketed production, the national strategy and the recovery of Union financial
    assistance for multiannual commitments in the fruit and vegetables sector due
    to the crisis caused by Russia’s invasion of Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1623 de la Commission du 14 juillet 2022
    établissant une dérogation au règlement délégué (UE) 2017/891 pour l’année
    2022 en ce qui concerne la valeur de la production commercialisée, la stratégie
    nationale et le recouvrement de l’aide financière de l’Union à des engagements
    pluriannuels dans le secteur des fruits et légumes en raison de la crise causée
    par l’invasion russe en Ukraine
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1623 der Kommission vom 14. Juli 2022 zur
    Abweichung von der Delegierten Verordnung (EU) 2017/891 in Bezug auf den Wert
    der vermarkteten Erzeugung, die nationale Strategie und die Wiedereinziehung der
    finanziellen Unterstützung der Union für mehrjährige Verpflichtungen im Sektor
    Obst und Gemüse für das Jahr 2022 aufgrund der durch die russische Invasion
    der Ukraine verursachten Krise
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1623 на Комисията
    от 14 юли 2022 година за дерогация от Делегиран
    регламент (ЕС) 2017/891 за 2022 година по отношение
    на стойността на предлаганата на пазара продукция,
    националната стратегия и възстановяването
    на финансова помощ от Съюза за многогодишни
    ангажименти в сектора на плодовете и зеленчуците
    поради кризата, причинена от нашествието на
    Русия в Украйна
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1623 ze dne 14. července
    2022, kterým se stanoví odchylka od nařízení v přenesené pravomoci (EU)
    2017/891 pro rok 2022, pokud jde o hodnotu produkce uvedené na trh, vnitrostátní
    strategii a vracení finanční podpory Unie na víceleté závazky v odvětví
    ovoce a zeleniny v důsledku krize způsobené ruskou invazí na Ukrajinu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1623 af 14. juli 2022 om
    fravigelse af delegeret forordning (EU) 2017/891 for så vidt angår værdien
    af den afsatte produktion, den nationale strategi og inddrivelsen af den finansielle
    støtte fra Unionen til flerårige forpligtelser inden for frugt- og grøntsagssektoren
    for 2022 på grund af den krise, der er forårsaget af Ruslands invasion af Ukraine
  type: main
- language: el
  script: Grek
