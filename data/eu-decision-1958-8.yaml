    della Ruhr raggruppate in seno all'Ufficio di vendita «Präsident Ruhrkohlen-Verkaufsgesellschaft
    mit beschränkter Haftung»
  type: main
- language: nl
  script: Latn
  content: Beschikking No.8-58 van 18 juni 1958 houdende ontheffing van de verbodsbepaling
    inzake het sluiten van langlopende leveringsovereenkomsten door de in de "Präsident"
    Ruhrkohlen-Verkaufsgesellschaft mit beschränkter Haftung verenigde kolenmijnondernemingen
    van het Ruhrbekken
