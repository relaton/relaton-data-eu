  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 8/58 vom 18. Juni 1958 über die Genehmigung des Abschlusses
    von langfristigen Lieferverträgen durch die in der "Präsident" Ruhrkohlen- Verkaufsgesellschaft
    mit beschränkter Haftung zusammengeschlossenen Bergwerksgesellschaften des Ruhrreviers
  type: main
- language: it
  script: Latn
  content: Decisione N° 8-58 del 18 giugno 1958 concernente l'autorizzazione di stipulare
