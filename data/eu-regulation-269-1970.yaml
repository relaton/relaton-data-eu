  content: Règlement (CEE) n 269/70 de la Commission, du 12 février 1970, abrogeant
    le règlement (CEE) n 236/70 portant application du droit du tarif douanier commun
    aux importations de certaines variétés d'oranges douces originaires d'Israël
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 269/70 der Kommission vom 12. Februar 1970 zur Aufhebung
    der Verordnung (EWG) Nr. 236/70 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren bestimmter Sorten von SüDorangen mit Ursprung in Israel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 269/70 della Commissione, del 12 febbraio 1970, che
    abroga il regolamento (CEE) n. 236/70 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di alcune varietà di arance dolci originarie
    d'Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 269/70 van de Commissie van 12 februari 1970 tot
    intrekking van Verordening (EEG) nr. 236/70 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van bepaalde variëteiten
    zoete sinaasappelen van oorsprong uit Israël
