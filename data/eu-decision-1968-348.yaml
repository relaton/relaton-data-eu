title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 31 juillet 1968, relative à l'autorisation
    d'une mesure tarifaire intérieure spéciale applicable aux transports ferroviaires
    d'acier brut en lingots et de demi-produits sidérurgiques en provenance des usines
    lorraines de la société Usinor, à destination de Dunkerque
  type: main
- language: de
  script: Latn
  content: '68/348/EGKS: Entscheidung der Kommission vom 31. Juli 1968 über die Genehmigung
    eines Ausnahmetarifs im Binnenverkehr für Eisenbahntransporte von Rohstahl in
    Blöcken und Halbzeug der Eisen- und Stahlindustrie von lothringischen Werken
    der Gesellschaft Usinor nach Dünkirchen'
  type: main
- language: it
  script: Latn
  content: '68/348/CECA: Decisione della Commissione, del 31 luglio 1968, che autorizza
    una tariffa speciale interna per i trasporti ferroviari di acciaio grezzo in lingotti
    e di semilavorati siderurgici dagli stabilimenti lorenesi della societé Usinor
    a Dunkerque'
  type: main
- language: nl
  script: Latn
  content: '68/348/EGKS: Beschikking van de Commissie van 31 juli 1968 houdende goedkeuring
    van een bijzonder binnenlands tarief voor het vervoer per spoor van ruw staal
    in blokken en van halffabrikaten der ijzer- en staalindustrie, afkomstig van de
    Lotharingse fabrieken van de vennootschap Usinor, naar Duinkerken'
  type: main
