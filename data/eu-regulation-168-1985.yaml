  script: Latn
  content: Regolamento (CEE) n. 168/85 della Commissione del 23 gennaio 1985 che ripristina
    la riscossione dei dazi doganali applicabili alla vitamina C, della sottovoce
    29.38 B IV della tariffa doganale comune, originaria della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
