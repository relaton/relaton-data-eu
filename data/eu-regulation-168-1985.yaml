title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 168/85 of 23 January 1985 re-establishing
    the levying of customs duties applicable to vitamin C, falling within subheading
    29.38 B IV and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 168/85 de la Commission du 23 janvier 1985 portant
    rétablissement de la perception des droits de douane applicables à la vitamine
    C, de la sous-position 29.38 B IV du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 168/85 der Kommission vom 23. Januar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Vitamin C der Tarifstelle 29.38 B IV mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 168/85 af 23. januar 1985 om genindførelse
    af opkrævning af told for vitamin C, henhørende under pos. 29.38 B IV og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
