title:
- language: en
  script: Latn
  content: '71/10/EEC: Commission decision of 7 December 1970 amending the decision
    of 3 June 1970, authorizing the French republic to approve, for marketing purposes,
    seed of pseudotsuga menziesii ( mirb. ) franco and of picea sitchensis trautv.
    and mey., satisfying less stringent requirements (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '71/10/CEE: Décision de la Commission, du 7 décembre 1970, modifiant
    la décision du 3 juin 1970, autorisant la République française à admettre,
    à la commercialisation, des semences de pseudotsuga menziesii (mirb.) franco
    et de picea sitchensis trautv. et mey., soumises à des exigences réduites (Le
    texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '71/10/EWG: Entscheidung der Kommission vom 7. Dezember 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der die französische Republik ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco und von picea sitchensis
    trautv. und mey. mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: it
  script: Latn
  content: '71/10/CEE: Decisione della Commissione, del 7 dicembre 1970, che modifica
    la decisione del 3 giugno 1970 che autorizza la repubblica francese ad ammettere
    alla commercializzazione le sementi di pseudotsuga menziesii ( mirb. ) franco
    e di picea sitchensis trautv. e mey., sottoposte a requisiti ridotti (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '71/10/EEG: Beschikking van de Commissie van 7 december 1970 houdende wijziging
    van de beschikking van 3 juni 1970 waarbij de Franse republiek gemachtigd wordt
    om zaden, waaraan minder strenge eisen zijn gesteld, van pseudotsuga menziesii
    ( mirb. ) franco en picea sitchensis trautv. en mey in de handel toe te laten
    (slechts de tekst in de Franse taal is authentiek)'
  type: main
