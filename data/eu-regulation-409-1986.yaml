    al 31 dicembre 1985, da un lato, e la Spagna e il Portogallo, dall' altro, nonché
    negli scambi tra questi due nuovi stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 409/86 van de Commissie van 20 februari 1986 betreffende
