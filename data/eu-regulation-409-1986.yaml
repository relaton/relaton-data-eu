    διοικητικής συνεργασίας, οι οποίες αποσκοπούν
    στην εξασφάλιση, κατά τη διάρκεια της μεταβατικής
    περιόδου, της ελεύθερης κυκλοφορίας των εμπορευμάτων
    κατά τις συναλλαγές μεταξύ, αφενός, της Κοινότητας,
    υπό τη σύνθεσή της στις 31 Δεκεμβρίου 1985, και,
