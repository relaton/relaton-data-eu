    siirtymäkauden aikana toisaalta yhteisön, sellaisena kuin se oli 31 päivänä
    joulukuuta 1985, ja toisaalta Espanjan ja Portugalin sekä näiden kahden uuden
    jäsenvaltion välisessä kaupassa
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 409/86 della Commissione del 20 febbraio 1986 relativo
