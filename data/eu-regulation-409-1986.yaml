title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 409/86 of 20 February 1986 on methods of
    administrative cooperation to safeguard during the transitional period the free
    movement of goods between the Community as constituted on 31 December 1985 on
    the one hand and Spain and Portugal on the other and between those two new Member
    States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 409/86 de la Commission du 20 février 1986 relatif
    aux méthodes de coopération administrative destinées à assurer, pendant la
    période de transition, la libre circulation des marchandises dans les échanges
    entre la Communauté dans sa composition au 31 décembre 1985, d' une part, et
    l' Espagne et le Portugal, d' autre part, ainsi que dans les échanges entre ces
    deux nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 409/86 der Kommission vom 20. Februar 1986 über die
    Methoden der Zusammenarbeit der Verwaltungen zur Gewährleistung des freien Warenverkehrs
    zwischen der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985 einerseits
    und Spanien und Portugal andererseits sowie zwischen diesen beiden neuen Mitgliedstaaten
    während der Übergangszeit
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 409/86 af 20. februar 1986 om metoderne
    for det administrative samarbejde, der i overgangsperioden skal sikre frie varebevægelser
    mellem Fællesskabet i dets sammensætning pr. 31. december 1985 på den ene side
    og Spanien og Portugal på den anden side, samt mellem de to nye medlemsstater
    indbyrdes
  type: main
- language: el
  script: Grek
