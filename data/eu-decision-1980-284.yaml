type: standard
title:
- language: en
  script: Latn
  content: '80/284/EEC: Commission Decision of 14 February 1980 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton and woven
    fabrics of synthetic textile fibres, falling within heading No 55.09 and subheading
    56.07 A of the Common Customs Tariff (categories 2 and 3), originating in Thailand
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/284/CEE: Décision de la Commission, du 14 février 1980, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton et de fibres textiles synthétiques de la position 55.09 et de la sous-position
    56.07 A du tarif douanier commun (catégories 2 et 3), originaires de Thaïlande
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/284/EWG: Entscheidung der Kommission vom 14. Februar 1980, mit der
    die Französische Republik ermächtigt wird, aus Thailand stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle und
    Gewebe aus synthetischen Spinnfasern der Tarifnummern 55.09 und 56.07 A des Gemeinsamen
    Zolltarifs, Kategorien 2 und 3, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/284/EØF: Kommissionens beslutning af 14. februar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld og vævet stof af syntetiske fibre, som henhører under pos. 55.09 og
    56.07 A i den fælles toldtarif (kategori 2 og 3), har oprindelse i Thailand og
    frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/284/CEE: Decisione della Commissione, del 14 febbraio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario tessuti di cotone
    e tessuti di fibre tessili sintetiche della voce 55.09 e della sottovoce 56.07
    A della tariffa doganale comune, categorie 2 e 3, originari della Tailandia e
    messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/284/EEG: Beschikking van de Commissie van 14 februari 1980 waarbij
    de Franse Republiek wordt gemachtigd weefsels van katoen en weefsels van synthetische
    stapelvezels, van de posten 55.09 en 56.07 A van het gemeenschappelijk douanetarief
    (categorie 2 en 3), van oorsprong uit Thailand en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
