title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2229/2001 of 16 November 2001 amending Regulation
    (EC) No 1801/2001 and increasing to 518267 tonnes the amount of barley held by
    the Spanish intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2229/2001 de la Commission du 16 novembre 2001 modifiant
    le règlement (CE) n° 1801/2001 et portant à 518267 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur d'orge par l'organisme d'intervention
    espagnol
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2229/2001 der Kommission vom 16. November 2001 zur
    Änderung der Verordnung (EG) Nr. 1801/2001 und zur Erhöhung der Dauerausschreibung
    für den Wiederverkauf auf dem Binnenmarkt von Gerste aus Beständen der spanischen
    Interventionsstelle auf 518267 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2229/2001 af 16. november 2001 om ændring
    af forordning (EF) nr. 1801/2001 og om forhøjelse til 518267 tons af den løbende
    licitation med henblik på videresalg på det indre marked af byg, som det spanske
    interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2229/2001 της Επιτροπής,
    της 16ης Νοεμβρίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1801/2001 και ορίζει σε 518267
    τόνους τη διαρκή δημοπρασία για τη μεταπώληση
    στην εσωτερική αγορά κριθής που έχει στη διάθεσή
    του ο ισπανικός οργανισμός παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2229/2001, annettu 16 päivänä marraskuuta
    2001, asetuksen (EY) N:o 1801/2001 muuttamisesta ja pysyvän tarjouskilpailun
    nostamisesta 518267 tonniin Espanjan interventioelimen hallussaan pitämän ohramäärän
    uudelleen myymiseksi sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2229/2001 della Commissione, del 16 novembre 2001,
    che modifica il regolamento (CE) n. 1801/2001 e che porta a 518267 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    orzo detenuto dall'organismo d'intervento spagnolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2229/2001 van de Commissie van 16 november 2001 tot
    wĳziging van Verordening (EG) nr. 1801/2001 teneinde de hoeveelheid waarop de
    permanente openbare inschrĳving voor de verkoop op de interne markt van gerst
    uit de voorraden van het Spaanse interventiebureau betrekking heeft, tot 518267
    ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2229/2001 da Comissão, de 16 de Novembro de 2001,
    que altera o Regulamento (CE) n.° 1801/2001 e que eleva para 518267 toneladas
