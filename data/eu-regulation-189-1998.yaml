id: EURegulation1891998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 189/98 of 23 January 1998 determining to
    what extent import right applications submitted for live bovine animals weighing
    between 80 and 300 kilograms as part of a tariff quota provided for in Regulation
    (EC) No 2524/97 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 189/98 de la Commission du 23 janvier 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites pour les animaux vivants de l'espèce bovine d'un poids de 80 à 300
    kilogrammes dans le cadre d'un contingent tarifaire prévu par le règlement (CE)
    n° 2524/97
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 189/98 der Kommission vom 23. Januar 1998 zur Festsetzung
    des Umfangs, in dem die Anträge auf Einfuhrrechte für lebende, 80 bis 300 kg
    schwere Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG) Nr.
    2524/97 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 189/98 af 23. januar 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder for
    levende kvæg af en vægt på 80 til 300 kg i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 2524/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 189/98 της Επιτροπής
    της 23ης Ιανουαρίου 1998 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις δικαιωμάτων εισαγωγής που έχουν
    υποβληθεί για ζωντανά βοοειδή, βάρους από 80
    έως 300 χιλιόγραμμα, στο πλαίσιο μιας δασμολογικής
    ποσόστωσης η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 2524/97
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 189/98, annettu 23 päivänä tammikuuta 1998,
    eläviä 80-300 kilogrammaa painavia nautaeläimiä koskevien tuontioikeushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 2524/97 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 189/98 della Commissione del 23 gennaio 1998 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    per gli animali vivi della specie bovina, da 80 a 300 chilogrammi, nel quadro
    del contingente tariffario previsto dal regolamento(CE) n. 2524/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 189/98 van de Commissie van 23 januari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de invoerrechtenaanvragen voor
    levende runderen met een gewicht van 80 tot 300 kg, die zijn ingediend op grond
    van een bij Verordening (EG) nr. 2524/97 vastgesteld tariefcontingent
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 189/98 da Comissão de 23 de Janeiro de 1998 que determina
    em que medida podem ser aceites os pedidos de direitos de importação de animais
    vivos da espécie bovina com peso compreendido entre 80 e 300 quilogramas, apresentados
    ao abrigo de um contingente pautal previsto pelo Regulamento (CE) nº 2524/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 189/98 de la Comisión de 23 de enero de 1998 por el
    que se determina la proporción en que se satisfarán la solicitudes de derechos
    de importación de animales vivos de la especie bovina con un peso entre 80 y
    300 kilogramos, presentadas dentro de un contingente arancelario establecido en
    el Reglamento (CE) n° 2524/97
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 189/98 av den 23 januari 1998 om i vilken
    utsträckning ansökningar om importrättigheter inlämnade för levande nötkreatur
    med en vikt på 80-300 kg inom ramen för den avgiftskvot som fastställts i förordning
    (EG) nr 2524/97 kan beviljas
  type: main
