id: EURegulation2042005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 204/2005 of 4 February 2005 determining to
    what extent import right applications submitted during the month of January 2005
    for live bovine animals weighing between 80 and 300 kg as part of a tariff quota
    provided for in Regulation (EC) No 1204/2004 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 204/2005 de la Commission du 4 février 2005 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites au mois de janvier 2005 pour les animaux vivants de l'espèce bovine
    d'un poids de 80 à 300 kg dans le cadre d'un contingent tarifaire prévu par
    le règlement (CE) n° 1204/2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 204/2005 der Kommission vom 4. Februar 2005 zur Festsetzung
    des Umfangs, in dem die im Januar 2005 eingereichten Anträge auf Einfuhrlizenzen
    für lebende Rinder mit einem Stückgewicht von 80 bis 300 kg im Rahmen eines
    Zollkontingents gemäß der Verordnung (EG) Nr. 1204/2004 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 204/2005 ze dne 4. února 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních práv
    pro dovoz živého skotu o váze 80 až 300 kg, podaným v lednu 2005 v rámci
    celní kvóty dle nařízení (ES) č. 1204/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 204/2005 af 4. februar 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicencer, som er
    indsendt i januar 2005, for levende kvæg af en vægt på 80 til 300 kg i forbindelse
    med et toldkontingent, der er fastsat i forordning (EF) nr. 1204/2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 204/2005 της Επιτροπής,
    της 4ης Φεβρουαρίου 2005, για καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιανουάριο του 2005 για ζωντανά
    βοοειδή βάρους 80 έως 300 χιλιόγραμμα, στο πλαίσιο
    μιας δασμολογικής ποσόστωσης η οποία προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 1204/2004
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 204/2005, 4. veebruar 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi jaanuaris
    2005, mis on esitatud 80–300 kilogrammiste elusveiste kohta määrusega (EÜ)
    nr 1204/2004 ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 204/2005, annettu 4 päivänä helmikuuta 2005,
    eläviä 80–300 kg painavia nautaeläimiä koskevien tammikuussa 2005 jätettyjen
    tuontitodistushakemusten hyväksyttävyydestä asetuksessa (EY) N:o 1204/2004
    määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 204/2005/EK rendelete (2005. február 4.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1204/2004/EK rendeletben szabályozott
    vámkontingens keretében, a 80 és 300 kg közötti súlyú szarvasmarhaféle
    élőállatokra vonatkozóan 2005. januárjában benyújtott importjogosultság
    iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 204/2005 della Commissione, del 4 febbraio 2005, che
    stabilisce in che misura possono essere accolte le domande di certificati di importazione
    presentate nel mese di gennaio 2005 per gli animali vivi della specie bovina,
    da 80 a 300 chilogrammi, nel quadro del contingente tariffario previsto dal regolamento
    (CE) n. 1204/2004
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 204/2005 (2005. gada 4. februāris), ar ko nosaka,
    cik lielā mērā var pieņemt importa tiesību pieprasījumus, kuri iesniegti
    2005. gada janvārī attiecībā uz dzīviem liellopiem, kuru svars ir no 80 līdz
    300 kg, tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr. 1204/2004
  type: main
- language: lt
  script: Latn
  content: 2005 m. vasario 4 d. Komisijos reglamentas (EB) Nr. 204/2005, nustatantis,
    kokia dalimi galima patenkinti paraiškas gyvų galvijų, kurių svoris yra nuo
    80 iki 300 kilogramų, importo licencijoms gauti 2005 m. sausio mėn., pateiktas
    remiantis tarifine kvota, nustatyta Reglamente (EB) Nr. 1204/2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 204/2005 van de Commissie van 4 februari 2005 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen voor
    invoercertificaten voor levende mannelijke runderen met een gewicht van 80 tot
    300 kg, die in januari 2005 zijn ingediend op grond van een bij Verordening (EG)
    nr. 1204/2004 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 204/2005 z dnia 4 lutego 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski, złożone w styczniu 2005 r.
    o wydanie uprawnień na przywóz żywego bydła o wadze od 80 do 300 kg w ramach
    kontyngentu taryfowego przewidzianego w rozporządzeniu (WE) nr 1204/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 204/2005 da Comissão, de 4 de Fevereiro de 2005,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 80 e 300 kg, apresentados
    no mês de Janeiro de 2005 ao abrigo de um contingente pautal previsto pelo Regulamento
    (CE) n.° 1204/2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 204/2005 zo 4. februára 2005, ustanovujúce
    podmienky, za ktorých je možné vyhovieť žiadostiam o dovozné povolenie podaným
    v mesiaci január 2005 pre živé zvieratá hovädzieho druhu s hmotnosťou od
    80 do 300 kg v rámci colnej kvóty ustanovenej v nariadení (ES) č. 1204/2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 204/2005 z dne 4. februarja 2005 o določitvi,
    v kakšnem obsegu se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi v
    mesecu januarju 2005 za živo govedo, ki je težko od 80 do 300 kg, v okviru tarifne
    kvote, predvidene z Uredbo (ES) št. 1204/2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 204/2005 de la Comisión, de 4 de febrero de 2005,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación en el mes de enero de 2005 de animales vivos de la
    especie bovina con un peso entre 80 y 300 kg, presentadas dentro de un contingente
    arancelario establecido en el Reglamento (CE) n° 1204/2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 204/2005 av den 4 februari 2005 om i
    vilken utsträckning ansökningar om importlicenser inlämnade under januari 2005
    för levande nötkreatur med en vikt på 80–300 kg inom ramen för den avgiftskvot
    som fastställts i förordning (EG) nr 1204/2004 kan beviljas
  type: main
