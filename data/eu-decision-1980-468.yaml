title:
- language: en
  script: Latn
  content: '80/468/EEC: Commission Decision of 14 April 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''ORTEC-Ge (Li) Coaxial Detector, model 8101-2021 T'' ,
    are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/468/CEE: Décision de la Commission, du 14 avril 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "Ortec-Ge (Li) Coaxial Detector,
    model 8101-2021 T" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/468/EWG: Entscheidung der Kommission vom 14. April 1980, mit der festgestellt
    wird, daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs für das wissenschaftliche Gerät ,,ORTEC-GE(Li) Coxial Detector, model
    8101-2021 T'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/468/EØF: Kommissionens beslutning af 14. april 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "ORTEC-Ge (Li) Coaxial Detector, model 8101-2021
    T" ikke er opfyldt'
  type: main
- language: el
  script: Grek
