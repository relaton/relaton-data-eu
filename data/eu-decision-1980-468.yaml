    τούς δασμούς τού Κοινού Δασμολογίου στήν επιστημονική
    συσκευή μέ τήν ονομασία «Ortec—Ge (Li) Coaxial Detector,
    model 8101—2021 T» δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/468/CEE: Decisione della Commissione, del 14 aprile 1980, che stabilisce
