    sé dearbhaithe gur de thionscnamh na Téaváine, na Tuirce nó Vítneam iad nó
    ná bíodh, agus lena gcuirtear allmhairí de tháirgí cruach dosmálta cothroma
    fuar-rollta a choinsínítear ón Téaváin, ón Tuirc agus ó Vítneam faoi réir
