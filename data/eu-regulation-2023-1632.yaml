  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1632 of 11 August 2023 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2021/2012 on imports of stainless steel
    cold-rolled flat products originating in Indonesia, by imports of stainless steel
    cold-rolled flat products consigned from Taiwan, Türkiye and Vietnam, whether
    declared as originating in Taiwan, Türkiye and Vietnam or not, and making imports
    of stainless steel cold-rolled flat products consigned from Taiwan, Türkiye and
    Vietnam subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1632 de la Commission du 11 août 2023
    ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2021/2012 sur les importations
    de produits plats laminés à froid en aciers inoxydables originaires d’Indonésie
    par des importations de produits plats laminés à froid en aciers inoxydables
    expédiés de Taïwan, de Turquie et du Viêt Nam, qu’ils aient ou non été
    déclarés originaires de ces pays, et soumettant à enregistrement les importations
    de produits plats laminés à froid en aciers inoxydables expédiés de Taïwan,
    de Turquie et du Viêt Nam
  type: main
