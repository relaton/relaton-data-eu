  content: Commission Regulation (EC) No 361/1999 of 18 February 1999 on the sale
    by the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for supplying the Canary Islands and repealing
    Regulations (EC) No 2509/98 and (EC) No 2319/98
  type: main
