  content: Règlement (CEE, Euratom, CECA) n° 3766/92 du Conseil, du 21 décembre
    1992, rectifiant le règlement (CECA, CEE, Euratom) n° 3834/91 et le règlement
    (CEE, Euratom, CECA) n° 2014/92 en ce qui concerne les coefficients correcteurs
