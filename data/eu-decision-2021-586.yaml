title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/586 of 12 April 2021 amending
    Decision 2007/330/EC lifting prohibitions on the movement of certain animal products
    on the island of Cyprus under Council Regulation (EC) No 866/2004 and laying down
    conditions for the movement of those products with regard to ‘Χαλλούμι’
    (Halloumi)/‘Hellim’ (PDO) (notified under document C(2021) 2386)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/586 de la Commission du 12 avril 2021
    modifiant la décision 2007/330/CE levant les interdictions relatives à la circulation
    de certains produits d’origine animale sur l’île de Chypre, imposées par
    le règlement (CE) no 866/2004 du Conseil, et fixant les conditions de circulation
    de ces produits en ce qui concerne «Χαλλούμι» (Halloumi)/«Hellim»
    (AOP) [notifiée sous le numéro C(2021) 2386]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/586 der Kommission vom 12. April 2021
    zur Änderung der Entscheidung 2007/330/EG zur Aufhebung des Verbringungsverbots
    für bestimmte tierische Erzeugnisse auf der Insel Zypern gemäß der Verordnung
    (EG) Nr. 866/2004 des Rates und zur Festlegung von Bedingungen für das Verbringen
    dieser Produkte in Bezug auf „Χαλλούμι“ (Halloumi)/„Hellim“ (g.
    U.) (Bekannt gegeben unter Aktenzeichen C(2021) 2386)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/586 на Комисията
    от 12 април 2021 година за изменение на Решение
    2007/330/ЕО на Комисията относно отмяна на забраните
    за движение на определени продукти от животински
    произход на остров Кипър по силата на Регламент
    (ЕО) № 866/2004 на Съвета и определяне на условия
    за движение на въпросните продукти по отношение
    на „Χαλλούμι“ (Halloumi)/„Hellim“ (ЗНП) (нотифицирано
    под номер C(2021) 2386)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/586 ze dne 12. dubna 2021, kterým
    se mění rozhodnutí Komise 2007/330/ES, kterým se zrušují zákazy týkající
    se pohybu některých produktů živočišného původu na ostrově Kypr podle
    nařízení Rady (ES) č. 866/2004 a kterým se stanoví podmínky pro pohyb těchto
    produktů, pokud jde o produkt „Χαλλούμι“ (Halloumi)/„Hellim“
    (CHOP) (oznámeno pod číslem C(2021) 2386)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/586 af 12. april 2021
    om ændring af beslutning 2007/330/EF om ophævelse af forbud mod transport af
    visse animalske produkter på øen Cypern i henhold til Rådets forordning (EF)
    nr. 866/2004 og fastsættelse af vilkår for transport af disse produkter for
    så vidt angår »Χαλλούμι« (Halloumi)/»Hellim« (BOB) (meddelt under
    nummer C(2021) 2386)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/586 της Επιτροπής
    της 12ης Απριλίου 2021 για την τροποποίηση της
    απόφασης 2007/330/ΕΚ για την άρση των απαγορεύσεων
    σχετικά με τη διακίνηση ορισμένων ζωικών προϊόντων
    στην Κύπρο δυνάμει του κανονισμού (ΕΚ) αριθ.
    866/2004 του Συμβουλίου και τον καθορισμό των όρων
    που διέπουν τη διακίνηση των εν λόγω προϊόντων
    όσον αφορά το «Χαλλούμι»/«Hellim» (ΠΟΠ) [κοινοποιηθείσα
    υπό τον αριθμό C(2021) 2386]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/586, 12. aprill 2021, millega muudetakse
    otsust 2007/330/EÜ (millega tühistatakse teatavate loomsete saaduste liikumiste
    suhtes Küprose saarel kohaldatavad keelud, lähtudes nõukogu määrusest (EÜ)
    nr 866/2004, ning sätestatakse tingimused nende saaduste liikumiseks) seoses
    tootega „Χαλλούμι“ (Halloumi) / „Hellim“ (KPN) (teatavaks tehtud
    numbri C(2021) 2386 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/586, annettu 12 päivänä
    huhtikuuta 2021, tiettyjen eläintuotteiden liikkumista Kyproksen saarella koskevien
    kieltojen poistamisesta neuvoston asetuksen (EY) N:o 866/2004 puitteissa ja edellytysten
    vahvistamisesta kyseisten tuotteiden liikkuvuudelle tehdyn päätöksen 2007/330/EY
    muuttamisesta nimen ”Χαλλούμι” (Halloumi) / ”Hellim” (SAN) osalta
    (tiedoksiannettu numerolla C(2021) 2386)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/586 оd 12. travnja 2021. o izmjeni
    Odluke 2007/330/EZ o ukidanju zabrana kretanja određenih životinjskih proizvoda
    na otoku Cipru na temelju Uredbe Vijeća (EZ) br. 866/2004 i o utvrđivanju uvjeta
    za kretanje tih proizvoda u pogledu proizvoda „Χαλλούμι” (Halloumi)/”Hellim”
    (ZOI) (priopćeno pod brojem dokumenta C(2021) 2386)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/586 végrehajtási határozata (2021. április 12.)
    az egyes állati termékek Ciprus szigetén történő mozgására vonatkozó
    tilalmaknak a 866/2004/EK tanácsi rendelet szerinti megszüntetéséről és
    azon termékek mozgására vonatkozó feltételeknek a megállapításáról szóló
    2007/330/EK határozatnak a „Χαλλούμι” (Halloumi)/”Hellim” (OEM)
    sajt vonatkozásában történő módosításáról (az értesítés a C(2021)
    2386. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/586 della Commissione del 12 aprile 2021
    recante modifica della decisione 2007/330/CE che elimina i divieti relativi alla
    circolazione di taluni prodotti di origine animale nell’isola di Cipro, applicati
    in virtù del regolamento (CE) n. 866/2004 del Consiglio, e che fissa le condizioni
    per la circolazione di tali prodotti per quanto riguarda lo «Χαλλούμι»
    (Halloumi)/«Hellim» (DOP) [notificata con il numero C(2021) 2386]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/586 (2021. gada 12. aprīlis),
    ar kuru attiecībā uz “Χαλλούμι” (Halloumi)/“Hellim” (ACVN) groza
    Lēmumu 2007/330/EK, ar ko atceļ aizliegumus konkrētu dzīvnieku izcelsmes produktu
    pārvietošanai Kipras salā saskaņā ar Padomes Regulu (EK) Nr. 866/2004 un
    paredz nosacījumus šo produktu pārvietošanai (izziņots ar dokumenta numuru
    C(2021) 2386)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/586 2021 m. balandžio 12
    d. kuriuo dėl „Χαλλούμι“ (Halloumi)/„Hellim“ (SKVN) iš dalies
    keičiamas Komisijos sprendimas 2007/330/EB, panaikinantis tam tikrų gyvūninės
    kilmės produktų vežimui taikomus draudimus Kipro saloje pagal Tarybos reglamentą
    (EB) Nr. 866/2004 ir nustatantis šių produktų vežimo sąlygas (pranešta dokumentu
    Nr. C(2021) 2386)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/586 tat-12
    ta’ April 2021 li temenda d-Deċiżjoni 2007/330/KE li tħassar il-projbizzjonijet
    dwar il-moviment ta’ ċerti prodotti li joriġinaw mill-annimali fuq il-gżira
    ta’ Ċipru skont ir-Regolament tal-Kunsill (KE) Nru 866/2004 u li tistabbilixxi
    l-kondizzjonijiet għall-moviment ta’ dawn il-prodotti fir-rigward tal-“Χαλλούμι”
    (Halloumi)/“Hellim” (DOP) (notifikata bid-dokument C(2021) 2386)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/586 van de Commissie van 12 april 2021 tot
    wijziging van Beschikking 2007/330/EG van de Commissie tot opheffing van het verbod
    op het verkeer van bepaalde dierlijke producten op het eiland Cyprus krachtens
    Verordening (EG) nr. 866/2004 van de Raad en tot vaststelling van de voorwaarden
    voor het verkeer van die producten met betrekking tot “Χαλλούμι” (Halloumi)/“Hellim”
    (BOB) (Kennisgeving geschied onder nummer C(2021) 2386)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/586 z dnia 12 kwietnia 2021 r. zmieniająca
    decyzję 2007/330/WE znoszącą zakaz przemieszczania niektórych produktów zwierzęcych
    na wyspie Cypr zgodnie z rozporządzeniem Rady (WE) nr 866/2004 i ustanawiającą
    warunki przemieszczania tych produktów w odniesieniu do „Χαλλούμι”
    (Halloumi)/„Hellim” (ChNP) (notyfikowana jako dokument nr C(2021) 2386)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/586 da Comissão de 12 de abril de 2021
    que altera a Decisão 2007/330/CE que levanta as proibições à circulação
    de determinados produtos de origem animal na Ilha de Chipre ao abrigo do Regulamento
    (CE) n.o 866/2004 do Conselho e que define condições para a circulação desses
    produtos no que diz respeito ao «Χαλλούμι» (Halloumi)/«Hellim» (DOP)
    [notificada com o número C(2021) 2386]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/586 a Comisiei din 12 aprilie
    2021 de modificare a Deciziei 2007/330/CE de ridicare a interdicțiilor privind
    circulația anumitor produse de origine animală în insula Cipru în conformitate
    cu Regulamentul (CE) nr. 866/2004 al Consiliului și de stabilire a condițiilor
    privind circulația produselor respective cu privire la „Χαλλούμι”
    (Halloumi)/„Hellim” (DOP) [notificată cu numărul C(2021) 2386]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/586 z 12. apríla 2021, ktorým
    sa mení rozhodnutie 2007/330/ES, ktorým sa rušia zákazy na pohyb niektorých
    výrobkov živočíšneho pôvodu na ostrove Cyprus podľa nariadenia Rady (ES)
    č. 866/2004 a ustanovujú podmienky pohybu týchto výrobkov, pokiaľ ide o syr
    „Χαλλούμι“ (Halloumi)/„Hellim“ (CHOP) [oznámené pod číslom
    C(2021) 2386]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/586 z dne 12. aprila 2021 o spremembi
    Odločbe 2007/330/ES o odpravi prepovedi pretoka nekaterih proizvodov živalskega
    izvora na otoku Ciper v skladu z Uredbo Sveta (ES) št. 866/2004 in določitvi
    pogojev za pretok teh proizvodov v zvezi s „Χαλλούμι“ (Halloumi)/„Hellim“
    (ZOP) (notificirano pod dokumentarno številko C(2021) 2386)
  type: main
