  script: Latn
  content: Decisión de Ejecución (UE) 2021/586 de la Comisión de 12 de abril de
    2021 que modifica la Decisión 2007/330/CE, por la que se levantan las prohibiciones
    de circulación de determinados productos de origen animal en la isla de Chipre
    conforme al Reglamento (CE) n.o 866/2004 del Consejo y se fijan las condiciones
    aplicables a su circulación en relación con el «Χαλλούμι» (Halloumi)/«Hellim»
    (DOP) [notificada con el número C(2021) 2386]
  type: main
