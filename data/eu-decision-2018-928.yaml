  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/928 av den 28 juni 2018 om
    avslutande av återupptagandet av undersökningen av domarna i de förenade målen
    C-186/14 P och C-193/14 P rörande rådets förordning (EG) nr 926/2009 om införande
    av en slutgiltig antidumpningstull och slutgiltigt uttag av den preliminära tull
    som införts på import av vissa sömlösa rör av järn eller stål med ursprung
    i Folkrepubliken Kina och kommissionens genomförandeförordning (EU) 2015/2272
    om införande av en slutgiltig antidumpningstull på import av vissa sömlösa
    rör av järn eller stål med ursprung i Folkrepubliken till följd av en översyn
    vid giltighetstidens utgång i enlighet med artikel 11.2 i rådets förordning
    (EG) nr 1225/2009
