    Hunden, Katzen und Frettchen und die Verbringung von mehr als fünf Hunden, Katzen
    oder Frettchen zu anderen als Handelszwecken in die Union zulässig sind, sowie
    zur Festlegung der Bescheinigungsmuster für die Einfuhr dieser Tiere und für
    deren Verbringung zu anderen als Handelszwecken in die Union (Bekanntgegeben unter
    Aktenzeichen K(2011) 9232)'
