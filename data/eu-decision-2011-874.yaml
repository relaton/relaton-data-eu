  script: Latn
  content: '2011/874/EU: Commission Implementing Decision of 15 December 2011 laying
    down the list of third countries and territories authorised for imports of dogs,
    cats and ferrets and for non-commercial movements of more than five dogs, cats
    and ferrets into the Union and the model certificates for imports and non-commercial
    movements of those animals into the Union (notified under document C(2011) 9232)'
  type: main
- language: fr
  script: Latn
  content: '2011/874/UE: Décision d''exécution de la Commission du 15 décembre
    2011 établissant la liste des pays tiers et des territoires en provenance desquels
    les importations de chiens, de chats et de furets ainsi que les mouvements non
    commerciaux à destination de l’Union d’un nombre de chiens, de chats ou de
    furets supérieur à cinq sont autorisés, et établissant les modèles de certificats
    pour l’importation et les mouvements non commerciaux de ces animaux à destination
    de l’Union [notifiée sous le numéro C(2011) 9232]'
  type: main
- language: de
  script: Latn
  content: '2011/874/EU: Durchführungsbeschluss der Kommission vom 15. Dezember 2011
