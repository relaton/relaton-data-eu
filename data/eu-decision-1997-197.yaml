title:
- language: en
  script: Latn
  content: '97/197/EC: Commission Decision of 18 March 1997 amending Decision 94/446/EC
    laying down the requirements for the importation from third countries of bones
    and bone products, horns and horn products and hooves and hoof products, excluding
    meals thereof, for further processing not intended for human or animal consumption'
  type: main
- language: fr
  script: Latn
  content: '97/197/CE: Décision de la Commission du 18 mars 1997 modifiant la décision
    94/446/CE définissant les exigences relatives à l''importation en provenance
    de pays tiers d''os et de produits à base d''os, de cornes et de produits à
    base de corne ainsi que d''onglons et de produits à base d''onglons, à l''exclusion
    des farines tirées de ces produits, non destinés à l''alimentation humaine
    ou animale, en vue de leur transformation'
  type: main
- language: de
  script: Latn
  content: '97/197/EG: Entscheidung der Kommission vom 18. März 1997 zur Änderung
    der Entscheidung 94/446/EG zur Regelung der Einfuhr aus Drittländern von Knochen
    und Knochenerzeugnissen, Hörnern und Hornerzeugnissen sowie Hufen und Klauen
    und ihren Erzeugnissen, ausgenommen Mehle, die zur Weiterverarbeitung und nicht
    zum Verzehr oder zur Verfütterung bestimmt sind'
  type: main
- language: da
  script: Latn
  content: '97/197/EF: Kommissionens Beslutning af 18. marts 1997 om ændring af beslutning
    94/446/EF om kravene ved indførsel fra tredjelande af ben og benprodukter (bortset
    fra benmel) horn og hornprodukter (bortset fra hornmel) samt hove og klove og
    produkter fremstillet heraf (bortset fra hovmel) til videreforarbejdning, der
    ikke er bestemt til konsum eller foder'
  type: main
- language: el
  script: Grek
  content: '97/197/ΕΚ: Απόφαση της Επιτροπής της 18ης Μαρτίου
    1997 για την τροποποίηση της απόφασης 94/446/ΕΚ
    περί καθορισμού των προϋποθέσεων για τις εισαγωγές
    από τρίτες χώρες οστών και προϊόντων οστών,
    κεράτων και προϊόντων κεράτων και οπλών και
    προϊόντων οπλών, εκτός από τα άλευρά τους, για
    περαιτέρω επεξεργασία, τα οποία δεν προορίζονται
    για ανθρώπινη ή ζωική κατανάλωση'
  type: main
- language: fi
  script: Latn
  content: '97/197/EY: Komission päätös, tehty 18 päivänä maaliskuuta 1997,
    ihmisten tai eläinten ravinnoksi kelpaamattomien jalostettavaksi tarkoitettujen
    luun ja luutuotteiden, sarvien ja sarvituotteiden, kavioiden ja sorkkien ja niistä
    valmistettujen tuotteiden, lukuun ottamatta näistä tuotteista valmistettuja
    jauhoja, kolmansista maista tulevan tuonnin vaatimuksista tehdyn päätöksen
    94/446/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '97/197/CE: Decisione della Commissione del 18 marzo 1997 recante modifica
    della decisione 94/446/CE che stabilisce le norme per l''importazione da paesi
    terzi di ossa e relativi prodotti, corna e relativi prodotti e zoccoli e relativi
    prodotti, escluse le farine, da sottoporre ad ulteriore trasformazione e non destinati
    al consumo umano o animale'
  type: main
- language: nl
  script: Latn
  content: '97/197/EG: Beschikking van de Commissie van 18 maart 1997 houdende wijziging
    van Beschikking 94/446/EG tot vaststelling van de voorschriften voor de invoer
    uit derde landen voor verdere verwerking van niet voor menselijke of dierlijke
    voeding bestemde beenderen en producten uit beenderen (met uitzondering van beendermeel),
    hoornen en producten uit hoorn (met uitzondering van hoornmeel) en hoeven en producten
    uit hoeven (met uitzondering van meel van hoeven)'
  type: main
- language: pt
  script: Latn
  content: '97/197/CE: Decisão da Comissão de 18 de Março de 1997 que altera a
    Decisão 94/446/CE da Comissão, de 14 de Junho de 1994, que estabelece as condições
    para a importação de países terceiros de ossos e produtos à base de ossos,
    chifres e produtos à base de chifres e unhas e cascos e produtos à base de cascos,
    com exclusão das respectivas farinhas, para transformação e não destinados
    ao consumo humano ou animal'
  type: main
- language: es
  script: Latn
  content: '97/197/CE: Decisión de la Comisión de 18 de marzo de 1997 que modifica
    la Decisión 94/446/CE por la que se establecen las condiciones para la importación
    de terceros países de huesos y productos óseos, cuernos y productos córneos
    y pezuñas y productos a base de pezuñas (excluidas las harinas de estos productos)
    para su transformación, y no destinados a la alimentación humana ni animal'
  type: main
- language: sv
  script: Latn
  content: '97/197/EG: Kommissionens beslut av den 18 mars 1997 om ändring av beslut
    94/446/EG om villkoren för import från tredje land av ben och benprodukter,
    horn och hornprodukter, hovar och hovprodukter, utom mjöl därav, avsedda för
    vidare bearbetning till produkter som inte är avsedda som livsmedel eller djurfoder'
