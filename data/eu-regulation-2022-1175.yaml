title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1175 of 7 July 2022 making
    imports of certain pneumatic tyres, new or retreaded, of rubber, of a kind used
    for buses or lorries and with a load index exceeding 121 originating in the People’s
    Republic of China subject to registration following the re-opening of the investigation
    in order to implement the judgments of 4 May 2022 in joined cases T-30/19 and
    T-72/19, with regard to Implementing Regulation (EU) 2018/1579 and Implementing
    Regulation (EU) 2018/1690
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1175 de la Commission du 7 juillet
    2022 soumettant à enregistrement les importations de certains pneumatiques neufs
    ou rechapés, en caoutchouc, du type utilisé pour les autobus ou camions, ayant
    un indice de charge supérieur à 121, originaires de la République populaire
    de Chine, à la suite de la réouverture de l’enquête afin de mettre en œuvre
    les arrêts du 4 mai 2022 dans les affaires jointes T-30/19 et T-72/19, en ce
    qui concerne le règlement d’exécution (UE) 2018/1579 et le règlement d’exécution
    (UE) 2018/1690
  type: main
- language: de
  script: Latn
