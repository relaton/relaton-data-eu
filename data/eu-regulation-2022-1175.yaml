    für den Transport von Waren verwendeten Art bestimmter neuer oder runderneuerter
    Luftreifen aus Kautschuk mit einer Tragfähigkeitskennzahl von mehr als 121 mit
    Ursprung in der Volksrepublik China nach der Wiederaufnahme der Untersuchung zur
    Umsetzung der Urteile vom 4. Mai 2022 in den verbundenen Rechtssachen T-30/19
    und T-72/19 in Bezug auf die Durchführungsverordnung (EU) 2018/1579 und die Durchführungsverordnung
    (EU) 2018/1690
  type: main
