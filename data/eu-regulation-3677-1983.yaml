title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3677/83 of 23 December 1983 authorizing
    the conclusion of long-term private storage contracts for grape must, concentrated
    grape must and rectified concentrated grape must in respect of the 1983/84 wine
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3677/83 de la Commission du 23 décembre 1983 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    des moûts de raisins, des moûts de raisins concentrés et des moûts de raisins
    concentrés rectifiés pour la campagne 1983/1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3677/83 der Kommission vom 23. Dezember 1983 zur Ermöglichung
    des Abschlusses von Verträgen für die langfristige private Lagerhaltung von
    Traubenmosten, konzentrierten Traubenmosten und rektifizierten konzentrierten
    Traubenmosten für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3677/83 af 23. december 1983 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af druemost, koncentreret
    druemost og koncentreret rektificeret druemost for produktionsåret 1983/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3677/83 της Επιτροπής
    της 23ης Δεκεμβρίου 1983 για την παροχή δυνατότητας
    συνάψεως συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης γλευκών σταφυλής, συμπυκνωμένων
    γλευκών σταφυλής και συμπυκνωμένων διορθωμένων
    γλευκών σταφυλής για την περίοδο εμπορίας
    1983/84
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3677/83 della Commissione del 23 dicembre 1983 che
    concede, per la campagna 1983/1984, la possibilità di concludere contratti di
    magazzinaggio privato a lungo termine per i mosti di uve, i mosti di uve concentrati
    e i mosti di uve concentrati rettificati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3677/83 van de Commissie van 23 december 1983 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van druivemost, geconcentreerde druivemost en gerectificeerde
    geconcentreerde druivemost voor het wijnoogstjaar 1983/1984
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3677/83 de la Comisión de 23 de diciembre de 1983
    por el que se abre la posibilidad de celebrar contratos de almacenamiento privado
    a largo plazo para mosto de uva, mosto de uva concentrado y mosto concentrado
    rectificado para la campaña 1983/1984
  type: main
