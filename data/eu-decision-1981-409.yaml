title:
- language: en
  script: Latn
  content: '81/409/EEC: Commission Decision of 8 April 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, impregnated or coated with artificial
    plastic materials originating in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/409/CEE: Décision de la Commission, du 8 avril 1981, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie,
    non élastique ni caoutchoutée, imprégnée ou enduite de matières plastiques,
    originaire de T''ai-wan (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/409/EWG: Entscheidung der Kommission vom 8. April 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Handschuhe aus Gewirken, weder
    gummielastisch noch kautschutiert, mit Kunststoff getränkt oder bestrichen von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/409/EØF: Kommissionens beslutning af 8. april 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, imprægnerede eller overtrukket med plast med oprindelse i Taiwan (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/409/ΕΟΚ: Απόφαση τής Επιτροπής τής 8ης Απριλίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά πλεκτά χειρόκτια μή ελαστικά ούτε συνδυασμένα
    μέ καουτσούκ, εμποτισμένα ή επιχρισμένα μέ
    πλαστικές ύλες, καταγωγής Ταϊβάν (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/409/CEE: Decisione della Commissione, dell''8 aprile 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario guanti a maglia,
    non elastica né gommata, impregnati o spalmati di materie plastiche, originari
    di Taiwan (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/409/EEG: Beschikking van de Commissie van 8 april 1981 houdende machtiging
    van de Franse Republiek om handschoenen, wanten en dergelijke artikelen, van niet-
    elastisch of van niet-gegummeerd brei- of haakwerk, geïmpregneerd of met een
    deklaag van plastische stoffen, van oorsprng uit Taiwan van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
