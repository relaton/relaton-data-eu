title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2467/80 of 25 September 1980 on the sale
    at a price fixed in advance of boned beef and veal held by the Irish intervention
    agency and intended for export, and amending Regulation (EEC) No 1687/76 and repealing
    Regulation (EEC) No 1649/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2467/80 de la Commission, du 25 septembre 1980, relatif
    à la vente à prix fixé forfaitairement à l' avance de certaines viandes bovines
    désossées détenues par l' organisme d' intervention irlandais et destinées
    à être exportées, modifiant le règlement (CEE) n° 1687/76 et abrogeant le
    règlement (CEE) n° 1649/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2467/80 der Kommission vom 25. September 1980 über
    den Verkauf von zur Ausfuhr bestimmten entbeintem Rindfleisch aus Beständen der
    irischen Interventionsstelle zu pauschal im voraus festgesetzten Preisen und zur
    Änderung der Verordnung (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG)
    Nr. 1649/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2467/80 af 25. september 1980 om salg
    til forudfastsat pris med henblik på udførsel af visse former for udbenet oksekød
    fra det irske interventionsorgan, om ændring af forordning (EØF) nr. 1687/76
    og om ophævelse af forordning (EØF) nr. 1649/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2467/80 της Επιτροπής
    της 25ης Σεπτεμβρίου 1980 περί πωλήσεως, σε τιμές
    προκαθοριζόμενες κατ’αποκοπή, ορισμένων ειδών
    αποστεωμένου βοείου κρέατος ευρισκομένων
    στην κατοχή του ιρλανδικού οργανισμού παρεμβάσεως
    και προοριζομένων να εξαχθούν, και περί τροποποιήσεως
    του κανονισμού (EOK) αριθ. 1687/76, καθώς και περί
    καταργήσεως του κανονισμού (EOK) αριθ. 1649/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2467/80 della Commissione, del 25 settembre 1980,
    relativo alla vendita, a prezzo fissato forfettariamente in anticipo, di talune
    carni bovine disossate detenute dall' organismo d' intervento irlandese e destinate
    ad essere esportate, recante modifica del regolamento (CEE) n. 1687/76 e abrogazione
    del regolamento (CEE) n. 1649/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2467/80 van de Commissie van 25 september 1980 betreffende
    de verkoop, tegen vooraf vastgestelde prijs, van bepaald voor uitvoer bestemd
    en door het Ierse interventiebureau opgeslagen rundvlees zonder been en houdende
    wijziging van Verordening (EEG) nr. 1687/76 en tot intrekking van Verordening
    (EEG) nr. 1649/80
