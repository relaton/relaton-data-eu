---
id: EUDecision20171910
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1910 of 17 October 2017 amending
    Decision 93/52/EEC as regards the brucellosis (B. melitensis)-free status of certain
    regions of Spain, Decision 2003/467/EC as regards the official bovine brucellosis-free
    status of Cyprus and of certain regions of Spain, and as regards the official
    enzootic-bovine-leucosis-free status of Italy, and Decision 2005/779/EC as regards
    the swine vesicular disease-free status of the region of Campania of Italy (notified
    under document C(2017) 6891)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1910 de la Commission du 17 octobre 2017
    modifiant la décision 93/52/CEE en ce qui concerne le statut «indemne de brucellose
    (B. melitensis)» de certaines régions d'Espagne, la décision 2003/467/CE en
    ce qui concerne le statut «officiellement indemne de brucellose bovine» de Chypre
    et de certaines régions d'Espagne et le statut «officiellement indemne de leucose
    bovine enzootique» de l'Italie, ainsi que la décision 2005/779/CE en ce qui
    concerne le statut «indemne de la maladie vésiculeuse du porc» de la région
    de Campanie en Italie [notifiée sous le numéro C(2017) 6891]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1910 der Kommission vom 17. Oktober 2017
    zur Änderung der Entscheidung 93/52/EWG in Bezug auf den Status bestimmter Regionen
    Spaniens als frei von Brucellose (B. melitensis), der Entscheidung 2003/467/EG
    in Bezug auf den Status Zyperns und bestimmter Regionen Spaniens als amtlich frei
    von Rinderbrucellose und in Bezug auf den Status Italiens als amtlich frei von
    Rinderleukose sowie der Entscheidung 2005/779/EG in Bezug auf den Status der italienischen
    Region Kampanien als frei von Vesikulärer Schweinekrankheit (Bekannt gegeben
    unter Aktenzeichen C(2017) 6891)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1910 на Комисията
    от 17 октомври 2017 година за изменение на Решение
    93/52/ЕИО по отношение на статута на някои региони
    в Испания на официално свободни от бруцелоза
    (B. melitensis), Решение 2003/467/ЕО по отношение на статута
    на Кипър и някои региони в Испания на официално
    свободни от бруцелоза по говедата, както и
    статута на Италия на официално свободна от
    ензоотична левкоза по говедата, както и Решение
    2005/779/ЕО по отношение на статута на региона
    Campania в Италия на свободен от везикулозна болест
    по свинете (нотифицирано под номер C(2017) 6891)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1910 ze dne 17. října 2017,
    kterým se mění rozhodnutí 93/52/EHS, pokud jde o status území prostého
    brucelózy (B. melitensis) určitých oblastí Španělska, rozhodnutí 2003/467/ES,
    pokud jde o status území úředně prostého brucelózy skotu Kypru a některých
    regionů Španělska a pokud jde o status území úředně prostého enzootické
    leukózy skotu Itálie, a rozhodnutí 2005/779/ES, pokud jde o status území
    prostého vezikulární choroby prasat regionu Kampánie v Itálii (oznámeno
    pod číslem C(2017) 6891)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/1910 af 17. oktober 2017
    om ændring af beslutning 93/52/EØF for så vidt angår anerkendelse af bestemte
    regioner i Spanien som officielt frie for brucellose (B. melitensis), beslutning
    2003/467/EF for så vidt angår kvægbesætningers status i Cypern og visse regioner
    i Spanien som officielt frie for brucellose og for så vidt angår kvægbesætningers
    status i Italien som officielt frie for enzootisk kvægleukose og beslutning 2005/779/EF
    for så vidt angår anerkendelse af regionen Campania i Italien som fri for smitsomt
    blæreudslæt hos svin (meddelt under nummer C(2017) 6891)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1910 της Επιτροπής,
    της 17ης Οκτωβρίου 2017, για την τροποποίηση της
    απόφασης 93/52/ΕΟΚ όσον αφορά το καθεστώς επίσημης
    απαλλαγής από τη βρουκέλλωση (B. melitensis) σε ορισμένες
    περιφέρειες της Ισπανίας, της απόφασης 2003/467/ΕΚ
    όσον αφορά το καθεστώς επίσημης απαλλαγής
    από τη βρουκέλλωση των βοοειδών στην Κύπρο
    και σε ορισμένες περιφέρειες της Ισπανίας,
    και όσον αφορά το καθεστώς επίσημης απαλλαγής
    από την ενζωοτική λεύκωση των βοοειδών στην
    Ιταλία, και της απόφασης 2005/779/ΕΚ όσον αφορά
    το καθεστώς επίσημης απαλλαγής από τη φυσαλιδώδη
    νόσο των χοίρων στην περιφέρεια της Καμπανίας
    στην Ιταλία [κοινοποιηθείσα υπό τον αριθμό
    C(2017) 6891]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/1910, 17. oktoober 2017, millega muudetakse
    otsust 93/52/EMÜ seoses teatavate Hispaania piirkondade ametlikult brutselloosist
    (B. melitensis) vaba staatusega, otsust 2003/467/EÜ seoses Küprose ja teatavate
    Hispaania piirkondade ametlikult veiste brutselloosist vaba staatusega ning Itaalia
    ametlikult veiste enzootilisest leukoosist vaba staatusega ning otsust 2005/779/EÜ
    seoses Itaalia Campania maakonna ametlikult sigade vesikulaarhaigusest vaba staatusega
    (teatavaks tehtud numbri C(2017) 6891 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/1910, annettu 17 päivänä
    lokakuuta 2017, päätöksen 93/52/ETY muuttamisesta siltä osin kuin kyse on
    tiettyjen Espanjan alueiden luomistaudista (B. melitensis) vapaasta asemasta,
    päätöksen 2003/467/EY muuttamisesta siltä osin kuin kyse on Kyproksen ja tiettyjen
    Espanjan alueiden virallisesti naudan luomistaudista vapaasta asemasta ja Italian
    virallisesti naudan tarttuvasta leukoosista vapaasta asemasta, ja päätöksen
    2005/779/EY muuttamisesta siltä osin kuin kyse on Italian Campanian alueen sian
    vesikulaaritaudista vapaasta asemasta (tiedoksiannettu numerolla C(2017) 6891)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/1910 оd 17. listopada 2017. o izmjeni
    Odluke 93/52/EEZ u pogledu priznavanja određenih regija Španjolske kao slobodnih
    od bruceloze (B. melitensis), Odluke 2003/467/EZ u pogledu priznavanja Cipra i
    određenih regija Španjolske kao službeno slobodnih od bruceloze goveda i u
    pogledu priznavanja Italije kao službeno slobodne od enzootske leukoze goveda
    te Odluke 2005/779/EZ u pogledu priznavanja talijanske regije Kampanije kao slobodne
    od vezikularne enterovirusne bolesti svinja (priopćeno pod brojem dokumenta C(2017)
    6891)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1910 végrehajtási határozata (2017. október
    17.) Spanyolország egyes régiói brucellózismentessége (B. melitensis) tekintetében
    a 93/52/EGK határozat módosításáról, Ciprus, valamint Spanyolország egyes
    régióinak a szarvasmarhák tekintetében a brucellózistól való hivatalos
    mentessége tekintetében és Olaszországnak a szarvasmarhák enzootikus leukózisától
    való hivatalos mentessége tekintetében a 2003/467/EK határozat módosításáról,
    továbbá Olaszország Campania régiójának a sertések hólyagos betegségétől
    való mentessége tekintetében a 2005/779/EK határozat módosításáról (az
    értesítés a C(2017) 6891. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1910 della Commissione, del 17 ottobre
    2017, che modifica la decisione 93/52/CEE per quanto riguarda la qualifica di
    indenni da brucellosi (B. melitensis) di alcune regioni della Spagna, la decisione
    2003/467/CE per quanto riguarda la qualifica di ufficialmente indenni da brucellosi
    bovina di Cipro e di alcune regioni della Spagna e di ufficialmente indenne da
    leucosi bovina enzootica dell'Italia, e la decisione 2005/779/CE per quanto riguarda
    la qualifica di indenne da malattia vescicolare dei suini della regione italiana
    della Campania [notificata con il numero C(2017) 6891]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1910 (2017. gada 17. oktobris),
    ar ko attiecībā uz dažu Spānijas reģionu statusu “brīvi no brucelozes
    (B. melitensis)” groza Lēmumu 93/52/EEK, attiecībā uz Kipras un dažu Spānijas
    reģionu statusu “oficiāli brīvi no liellopu brucelozes” un attiecībā
    uz Itālijas statusu “oficiāli brīva no govju enzootiskās leikozes” groza
    Lēmumu 2003/467/EK un attiecībā uz Itālijas reģiona Kampānijas statusu “brīvs
    no cūku vezikulārās slimības” groza Lēmumu 2005/779/EK (izziņots ar dokumenta
    numuru C(2017) 6891)
  type: main
- language: lt
  script: Latn
  content: 2017 m. spalio 17 d. Komisijos įgyvendinimo sprendimas (ES) 2017/1910,
    kuriuo dėl pripažinimo, kad tam tikruose Ispanijos regionuose nenustatyta bruceliozės
    (B. melitensis), iš dalies keičiamas Sprendimas 93/52/EEB, dėl pripažinimo,
    kad Kipre ir tam tikruose Ispanijos regionuose oficialiai nenustatyta galvijų
    bruceliozės, o Italijoje – enzootinės galvijų leukozės, iš dalies keičiamas
    Sprendimas 2003/467/EB ir dėl pripažinimo, kad Italijos Kampanijos regione nenustatyta
    kiaulių vezikulinės ligos, iš dalies keičiamas Sprendimas 2005/779/EB (pranešta
    dokumentu Nr. C(2017) 6891)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1910 tas-17
    ta' Ottubru 2017 li temenda d-Deċiżjoni 93/52/KEE rigward l-istat ta' ħelsien
    mill-bruċellożi (B. melitensis) f'ċerti reġjuni ta' Spanja, id-Deċiżjoni
    2003/467/KE rigward l-istat uffiċjali ta' ħelsien mill-bruċellożi bovina f'Ċipru
    u f'ċerti reġjuni ta' Spanja, u dwar l-istat uffiċjali ta' ħelsien mil-lewkożi
    enzootika bovina fl-Italja u d-Deċiżjoni 2005/779/KE rigward l-istat ta' ħelsien
    mill-marda vexxikulari tal-ħnieżer fir-reġjun tal-Campania tal-Italja (notifikata
    bid-dokument C(2017) 6891)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1910 van de Commissie van 17 oktober 2017
    tot wijziging van Beschikking 93/52/EEG wat betreft de brucellosevrije status
    (B. melitensis) van bepaalde regio's van Spanje, van Beschikking 2003/467/EG wat
    betreft de officiële runderbrucellosevrije status van Cyprus en van bepaalde
    regio's van Spanje en wat betreft de officiële enzoötische-runderleukosevrije
    status van Italië, en Beschikking 2005/779/EG wat betreft de vesiculaire-varkensziektevrije
    status van de regio Campanië in Italië (Kennisgeving geschied onder nummer C(2017)
    6891)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/1910 z dnia 17 października 2017
    r. zmieniająca decyzję 93/52/EWG w odniesieniu do statusu niektórych regionów
    Hiszpanii jako obszarów wolnych od brucelozy (B. melitensis), decyzję 2003/467/WE
    w odniesieniu do statusu Cypru i niektórych regionów Hiszpanii jako obszarów
    oficjalnie wolnych od brucelozy bydła oraz statusu Włoch jako obszaru oficjalnie
    wolnego od enzootycznej białaczki bydła, a także decyzję 2005/779/WE w odniesieniu
    do statusu regionu Kampanii we Włoszech jako obszaru wolnego od choroby pęcherzykowej
    świń (notyfikowana jako dokument nr C(2017) 6891)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1910 da Comissão, de 17 de outubro de
    2017, que altera a Decisão 93/52/CEE no que diz respeito ao estatuto de indemne
    de brucelose (B. melitensis) de certas regiões de Espanha, a Decisão 2003/467/CE
    no que se refere ao estatuto de oficialmente indemne de brucelose bovina de Chipre
    e de certas regiões de Espanha, e no que diz respeito ao estatuto de oficialmente
    indemne de leucose bovina enzoótica de Itália, e a Decisão 2005/779/CE no que
    diz respeito ao estatuto de indemne da doença vesiculosa dos suínos da região
    de Campânia de Itália [notificada com o número C(2017) 6891]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1910 a Comisiei din 17 octombrie
    2017 de modificare a Deciziei 93/52/CEE cu privire la statutul oficial indemn
    de bruceloză (B. Melitensis) al anumitor regiuni din Spania, a Deciziei 2003/467/CE
    cu privire la statutul oficial indemn de bruceloză bovină al Ciprului și al
    anumitor regiuni din Spania și cu privire la statutul oficial indemn de leucoză
    enzootică bovină al Italiei, precum și a Deciziei 2005/779/CE cu privire la
    statutul oficial indemn de boala veziculoasă a porcului al regiunii Campania
    din Italia [notificat cu numărul C(2017) 6891]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/1910 zo 17. októbra 2017,
    ktorým sa mení rozhodnutie 93/52/EHS, pokiaľ ide o štatút určitých regiónov
    Španielska ako oblastí bez výskytu brucelózy (B. melitensis), rozhodnutie
    2003/467/ES, pokiaľ ide o úradný status Cypru ako členského štátu bez výskytu
    bovinnej brucelózy a určitých regiónov Španielska ako oblastí bez výskytu
    bovinnej brucelózy a úradný status Talianska ako členského štátu bez výskytu
    enzootickej bovinnej leukózy, a rozhodnutie 2005/779/ES, pokiaľ ide o štatút
    talianskeho regiónu Kampánia ako oblasti bez výskytu vezikulárnej choroby
    ošípaných [oznámené pod číslom C(2017) 6891]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/1910 z dne 17. oktobra 2017 o spremembi
    Odločbe 93/52/EGS glede priznanja nekaterih regij Španije kot prostih bruceloze
    (B. melitensis), Odločbe 2003/467/ES glede priznanja Cipra in nekaterih regij
    Španije kot uradno prostih goveje bruceloze ter priznanja Italije kot uradno
    proste enzootske goveje levkoze ter Odločbe 2005/779/ES glede priznanja regije
    Kampanija v Italiji kot proste vezikularne bolezni prašičev (notificirano pod
    dokumentarno številko C(2017) 6891)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/1910 de la Comisión, de 17 de octubre
    de 2017, que modifica la Decisión 93/52/CEE por lo que respecta a la calificación
    de determinadas regiones de España como indemnes de brucelosis (Brucella melitensis),
    la Decisión 2003/467/CE por lo que respecta a la calificación de Chipre y de
    determinadas regiones de España como oficialmente indemnes de brucelosis bovina
    y por lo que respecta a la calificación de Italia como oficialmente indemne de
    leucosis bovina enzoótica, y la Decisión 2005/779/CE por lo que respecta a la
    calificación de la región de Campania (Italia) como indemne de enfermedad vesicular
    porcina [notificada con el número C(2017) 6891]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/1910 av den 17 oktober 2017
    om ändring av beslut 93/52/EEG vad gäller vissa regioner i Spaniens status som
    fria från brucellos (B. melitensis), beslut 2003/467/EG vad gäller Cyperns och
    vissa regioner i Spaniens status som officiellt fria från bovin brucellos och
    vad gäller Italiens status som officiellt fritt från enzootisk bovin leukos
    samt beslut 2005/779/EG vad gäller den italienska regionen Kampaniens status
    som fri från vesikulär svinsjuka [delgivet med nr C(2017) 6891]
