  script: Latn
  content: '2001/601/EC: Commission Decision of 18 July 2001 amending Decision 1999/283/EC
    concerning the animal health conditions and veterinary certification for imports
    of fresh meat from certain African countries to take account of the animal health
    situation in South Africa (Text with EEA relevance) (notified under document number
    C(2001) 1977)'
  type: main
- language: fr
  script: Latn
