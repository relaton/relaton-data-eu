title:
- language: en
  script: Latn
  content: '85/521/EEC: Commission Decision of 14 November 1985 recognizing that production
    of certain quality wines produced in specified regions is, because of their quality
    characteristics, far below demand (Only the Italian and French texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/521/CEE: Décision de la Commission du 14 novembre 1985 reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    est, du fait des caractéristiques qualitatives de ces vins, largement inférieure
    à la demande (Les textes en langues italienne et française sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '85/521/EWG: Entscheidung der Kommission vom 14. November 1985 zur Feststellung,
    daß von Qualitätswein b. A. wegen der qualitativen Merkmale dieses Weines weit
    weniger erzeugt als nachgefragt wird (Nur der französische und der italienische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/521/EØF: Kommissionens beslutning af 14. november 1985 om anerkendelse
    af, at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder på
    grund af deres kvalitative egenskaber langt fra er tilstrækkelig til at dække
    efterspørgslen (Kun den italienske og franske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '85/521/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Νοεμβρίου 1985 που αναγνωρίζει ότι η παραγωγή
    ορισμένων οίνων ποιότητας που παράγονται σε
    καθορισμένες περιοχές είναι, λόγω των ποιοτικών
    χαρακτηριστικών αυτών των οίνων, σημαντικά
    κατώτερη από τη ζήτηση (Τα κείμενα στην ιταλική
    και γαλλική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '85/521/CEE: Decisione della Commissione del 14 novembre 1985 che riconosce
    che la produzione di taluni vini di qualità prodotti in regioni determinate è
    largamente inferiore alla domanda, a motivo delle caratteristiche qualitative
    di tali vini (I testi in lingua francese e italiana sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '85/521/EEG: Beschikking van de Commissie van 14 november 1985 waarbij
    wordt erkend dat de produktie van sommige in bepaalde gebieden voortgebrachte
    kwaliteitswijnen, gezien de kwaliteitskenmerken van die wijnen, ver bij de vraag
    achterblijft (Slechts de teksten in de Italiaanse en de Franse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '85/521/CEE: Decisão da Comissão, de 14 de Novembro de 1985, que reconhece
    que a produção de certos vinhos de qualidade produzidos em regiões determinadas
    é largamente inferior à procura, devido às características qualitativas destes
    vinhos (Apenas fazem fé os textos nas línguas italiana e francesa)'
  type: main
- language: es
  script: Latn
  content: '85/521/CEE: Decisión de la Comisión, de 14 de noviembre de 1985 por
    la que se reconoce que la producción de determinados vinos de calidad producidos
    en determinadas regiones es, debido a las características cualitativas de dichos
    vinos, muy inferior a la demanda (Los textos en lenguas italiana y francesa son
    los únicos auténticos)'
  type: main
