title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 216/85 of 25 January 1985 determining the
    amounts of the variable components and additional duties applicable from 1 February
    to 30 April 1985 on the importation into the Community of goods covered by Regulation
    (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 216/85 de la Commission, du 25 janvier 1985, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er février au 30 avril 1985 indus à l'importation dans
    la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 216/85 der Kommission vom 25. Januar 1985 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1985 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 216/85 af 25. januar 1985 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. februar til den 30. april 1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 216/85 της Επιτροπής
    της 25ης Ιανουαρίου 1985 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά την περίοδο από
    1ης Φεβρουαρίου μέχρι και 30ής Απριλίου 1985 κατά
    την εισαγωγή στην Κοινότητα εμπορευμάτων που
    υπάγονται στον κανονισμό (ΕOK) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE ) n. 216/85 della Commissione, del 25 gennaio 1985, che
    determina gli importi degli elementi mobili e i dazi addizionali applicabili all'importazione
    nella Comunità, per il periodo dal 1 febbraio al 30 aprile 1985, delle merci
    cui si applica il regolamento (CEE) n. 3033/80
  type: main
