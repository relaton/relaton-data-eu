title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 889/93 of 15 April 1993 derogating for the
    1992/93 wine year from the producers' requirement to notify the quantities of
    table wine they must deliver for compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 889/93 de la Commission, du 15 avril 1993, portant
    mesure dérogatoire pour la campagne 1992/1993 en matière de communication par
    les producteurs de leurs quantités de vin de table à livrer à la distillation
    obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 889/93 der Kommission vom 15. April 1993 über eine
    abweichende Maßnahme für das Wirtschaftsjahr 1992/93 für die Mitteilungen der
    Erzeuger über ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 889/93 af 15. april 1993 om en undtagelsesforanstaltning
    for produktionsåret 1992/1993 med hensyn til producenternes meddelelse af bordvinsmængder,
    der skal leveres til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 889/93 της Επιτροπής
    της 15ης Απριλίου 1993 που προβλέπει μέτρο παρέκκλισης,
    για την περίοδο 1992/93, όσον αφορά την ανακοίνωση
    από τους παραγωγούς των ποσοτήτων επιτραπέζιου
    οίνου που θα παραδοθούν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 889/93 della Commissione, del 15 aprile 1993, recante
    una misura derogatoria per la campagna 1992/1993, per quanto riguarda la comunicazione,
    da parte dei produttori, dei quantitativi di vini da tavola che devono consegnare
    alla distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 889/93 van de Commissie van 15 april 1993 houdende
    afwijkende bepalingen voor het wijnoogstjaar 1992/1993 met betrekking tot de mededeling,
    door de producenten, van de voor verplichte distillatie te leveren hoeveelheden
    tafelwijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 889/93 da Comissão, de 15 de Abril de 1993, que
    estabelece uma medida derrogatória para a campanha de 1992/1993 no que diz respeito
    à comunicação pelos produtores das suas quantidades de vinho de mesa a entregar
    para destilação obrigatória
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 889/93 de la Comisión, de 15 de abril de 1993, por
    el que se establece una medida de excepción, con respecto a la campaña de 1992/93,
    en cuanto a la comunicación que deben efectuar los productores sobre las cantidades
    de vino de mesa que tienen que destinar a destilación obligatoria
  type: main
