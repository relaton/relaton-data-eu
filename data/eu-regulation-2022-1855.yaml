    van de aan transactieregisters te rapporteren gegevens en het te gebruiken rapportagetype
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1855 z dnia 10 czerwca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 648/2012
    w odniesieniu do regulacyjnych standardów technicznych określających minimalny
    poziom szczegółowości danych podlegających zgłoszeniu repozytoriom transakcji
    oraz rodzaj zgłoszeń, które należy stosować
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1855 da Comissão de 10 de junho de 2022
    que complementa o Regulamento (UE) n.o 648/2012 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam os
    pormenores mínimos dos dados a comunicar aos repositórios de transações e
    o tipo de comunicações de informações a utilizar
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1855 al Comisiei din 10 iunie 2022 de completare
    a Regulamentului (UE) nr. 648/2012 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare în care sunt precizate
    detaliile minime ale datelor care trebuie raportate registrelor centrale de tranzacții
    și tipul de rapoarte care trebuie utilizate
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1855 z 10. júna 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 648/2012, pokiaľ
    ide o regulačné technické normy stanovujúce minimálnu úroveň údajov, ktoré
    sa majú ohlasovať archívom obchodných údajov, a druh správ, ktoré sa majú
    použiť
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1855 z dne 10. junija 2022 o dopolnitvi
    Uredbe (EU) št. 648/2012 Evropskega parlamenta in Sveta glede regulativnih tehničnih
    standardov, ki določajo minimalne podatke, o katerih je treba poročati repozitorijem
    sklenjenih poslov, in vrsto poročil, ki jo je treba uporabiti
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1855 de la Comisión de 10 de junio de 2022
    por el que se completa el Reglamento (UE) n.o 648/2012 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los elementos mínimos de los datos que deben notificarse a los registros de operaciones
    y el tipo de notificaciones que deben utilizarse
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1855 av den 10 juni 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 648/2012 vad
    gäller tekniska tillsynsstandarder som specificerar vilka uppgifter som minst
    ska rapporteras till transaktionsregister och vilken typ av rapporter som ska
