  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1855 della Commissione del 10 giugno 2022
    che integra il regolamento (UE) n. 648/2012 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le informazioni
    minime da segnalare al repertorio di dati sulle negoziazioni e il tipo di segnalazioni
    da utilizzare
  type: main
- language: lv
  script: Latn
