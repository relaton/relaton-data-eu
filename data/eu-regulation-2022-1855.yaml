    648/2012, pokud jde o regulační technické normy, které blíže určují minimální
    náležitosti údajů, které se mají vykazovat do registru obchodních údajů,
    a typ zpráv, které se mají používat
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1855 af 10. juni 2022 om
