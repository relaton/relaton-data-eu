    uz regulatīvajiem tehniskajiem standartiem, kuros precizē darījumu reģistriem
    ziņojamo datu minimumu un izmantojamo ziņojumu veidu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1855 2022 m. birželio 10
