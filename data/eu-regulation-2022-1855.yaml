    saugykloms pateiktini duomenys ir teiktinų pranešimų rūšis
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1855 tal-10 ta’ Ġunju 2022
