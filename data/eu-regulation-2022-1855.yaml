  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1855 of 10 June 2022 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the minimum details of the
    data to be reported to trade repositories and the type of reports to be used
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1855 de la Commission du 10 juin 2022 complétant
    le règlement (UE) no 648/2012 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les informations minimales à déclarer
    aux référentiels centraux et le type de déclarations à utiliser
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1855 der Kommission vom 10. Juni 2022 zur
