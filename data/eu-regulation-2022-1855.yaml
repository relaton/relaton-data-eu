    Rates bezüglich technischer Regulierungsstandards, in denen die Mindestangaben
    der Meldungen an Transaktionsregister und die Art der zu verwendenden Meldungen
    festgelegt werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1855 на Комисията
