    (ЕС) № 648/2012 на Европейския парламент и на Съвета
    във връзка с регулаторните технически стандарти
    за определяне на минималните данни, отчитани
    пред регистрите на трансакции, и вида на използваните
    отчети
  type: main
- language: cs
  script: Latn
