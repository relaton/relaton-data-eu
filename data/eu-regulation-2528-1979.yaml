title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2528/79 of 14 November 1979 re-establishing
    the levying of customs duties on gramophone records and other sound etc., falling
    within heading No 92.12 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2528/79 de la Commission, du 14 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux supports
    de son pour appareils du n° 92.11 etc., de la position 92.12 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2528/79 der Kommission vom 14. November 1979 zur Wiedereinführung
    des Zollsatzes für Tonträger und andere Aufzeichnungsträger, usw., der Tarifnummer
    92.12, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3156/78 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2528/79 af 14. november 1979 om genindførelse
    af opkrævning af toldafgifter for grammofonplader og andre lydoptagere, etc.,
    under position 92.12, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2528/79 della Commissione, del 14 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai supporti di suono per
    apparecchi della voce 92.11, ecc., della voce 92.12 della tariffa doganale comune,
    originari di Hong Kong, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2528/79 van de Commissie van 14 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op grammofoonplaten;
    platen, cilinders, rollen, banden, films, draad, enz. voor de toestellen bedoeld
    bij post 92.11, enz., van post 92.12, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
