id: EUDecision1975114
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 February 1975 authorizing the Republic of Italy
    to permit the marketing of certified seed of the varieties of rice 'Romeo', 'Redi',
    'Rosa Marchetti', 'Monticelli' and 'Italpatna' satisfying less stringent requirements,
    for a period which expires on 30 June 1975
  type: main
- language: fr
  script: Latn
  content: '75/114/CEE: Décision de la Commission, du 3 février 1975, autorisant
    la République italienne à admettre, pour une période expirant le 30 juin 1975,
    la commercialisation des semences certifiées de riz des variétés Romeo, Redi,
    Rosa marchetti, Monticelli et Italpatna soumises à des exigences réduites'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Februar 1975 zur Ermächtigung der Italienischen
    Republik, für einen Zeitraum, der am 30. Juni 1975 ausläuft, zertifiziertes
    Saatgut von Reis der Sorten "Romeo" "Redi", "Rosa Marchetti", "Monticelli" und
    "Italpatna" mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. februar 1975 om bemyndigelse af Den italienske
    Republik til at tillade, at »certificeret sædekorn«, som opfylder mindre strenge
    krav, af rissorterne »Italpatna«, »Monticelli«, »Redi«, »Romeo« og »Rosa
    Marchetti« bringes erhversmæssigt i handelen i et tidsrum, der udløber den
    30. juni 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 febbraio 1975, che autorizza la Repubblica
    italiana ad ammettere, per un periodo che scade il 30 giugno 1975, la commercializzazione
    di «sementi certificate» di riso delle varietà «Romeo», «Redi», «Rosa
    Marchetti», «Monticelli» e «Italpatna» a requisiti ridotti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 februari 1975 tot machtiging van de
    Italiaanse Republiek om voor een periode eindigend op 30 juni 1975 gecertificeerd
    zaad van rijst van de rassen "Romeo", "Redi", "Rosa Marchetti", "Monticelli" en
    "Italpatna", waaraan minder strenge eisen zijn gesteld, tot de handel toe te laten
  type: main
