title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1871/71 of the Commission of 27 August 1971 amending
    Regulation (EEC) No 1013/71 as regards the detailed rules of application to be
    adopted in agriculture following the temporary widening of the margins of fluctuation
    for the currencies of Belgium and Luxembourg
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1871/71 de la Commission, du 27 août 1971, modifiant
    le règlement (CEE) n° 1013/71 en ce qui concerne les modalités d'application
    à prendre dans le secteur agricole à la suite de l'élargissement temporaire
    des marges de fluctuation des monnaies de la Belgique et du Luxembourg
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1871/71 der Kommission vom 27. August 1971 zur Änderung
    der Verordnung (EWG) Nr. 1013/71 hinsichtlich der zu erlassenden Durchführungsbestimmungen
    in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der Bandbreiten
    der Währungen Belgiens und Luxemburgs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1871/71 af 27. august 1971 om ændring
    af forordning (EØF) nr. 1013/71 med hensyn til de gennemførelsesbestemmelser,
    der skal udstedes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i Belgiens og Luxembourgs valutaer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1871/71 della Commissione, del 27 agosto 1971, che
    modifica il regolamento (CEE) n. 1013/71 per quanto riguarda le modalità di applicazione
    da adottare nel settore agricolo in seguito all'ampliamento temporaneo dei margini
    di fluttuazione delle monete del Belgio e del Lussemburgo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1871/71 van de Commissie van 27 augustus 1971 tot
    wijziging van Verordening (EEG) nr. 1013/71 met betrekking tot de uitvoeringsbepalingen
    welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van
    de valuta's van België en Luxemburg dienen te worden vastgesteld in de landbouwsector
  type: main
