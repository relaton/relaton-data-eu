title:
- language: en
  script: Latn
  content: '85/643/EEC: Commission Decision of 23 December 1985 supplementing and
    modifying Decision 83/461/EEC laying down, for the purposes of a structure survey
    for 1983 as part of the programme of surveys on the structure of agricultural
    holdings, the definitions relating to the list of characteristics and the list
    of agricultural products'
  type: main
- language: fr
  script: Latn
  content: '85/643/CEE: Décision de la Commission du 23 décembre 1985 complétant
    et modifiant la décision 83/461/CEE, portant fixation des définitions se rapportant
    à la liste des caractéristiques et de la liste des produits agricoles en vue
    d''une enquête «Structures 1983» dans le cadre d''un programme d''enquêtes
    sur la structure des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: '85/643/EWG: Entscheidung der Kommission vom 23. Dezember 1985 zur Ergänzung
    und Änderung der Entscheidung 83/461/EWG über eine Festlegung der Definitionen
    für den Merkmalskatalog und die Liste der landwirtschaftlichen Erzeugnisse für
    eine Strukturerhebung 1983 im Rahmen eines Erhebungsprogramms über die Struktur
    der landwirtschaftlichen Betriebe'
  type: main
- language: da
  script: Latn
  content: '85/643/EØF: Kommissionens beslutning af 23. december 1985 til supplering
    og ændring af beslutning 83/461/EØF om fastlæggelse af definitionerne i forbindelse
    med listen over kendetegn og af listen over landbrugsprodukter med henblik på
    en strukturundersøgelse i 1983 som led i et program til undersøgelse af landbrugsbedrifternes
    struktur'
  type: main
- language: el
  script: Grek
  content: '85/643/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Δεκεμβρίου 1985 που συμπληρώνει και τροποποιεί
    την απόφαση 83/461/ΕΟΚ για τον καθορισμό των ορισμών
    που αναφέρονται στον κατάλογο των χαρακτηριστικών
    και του καταλόγου των γεωργικών προϊόντων
    ενόψει έρευνας διαρθρώσεων 1983 στα πλαίσια
    προγράμματος ερευνών για τη διάρθρωση των
    γεωργικών εκμεταλλεύσεων'
  type: main
- language: it
  script: Latn
  content: '85/643/CEE: Decisione della Commissione del 23 dicembre 1985 che completa
    e modifica la decisione 83/461/CEE che stabilisce le definizioni relative all''elenco
    delle caratteristiche e l''elenco dei prodotti agricoli per l''esecuzione dell''indagine
    «strutture 1983» nel quadro di un programma di indagini sulla struttura delle
    aziende agricole'
  type: main
- language: nl
  script: Latn
  content: '85/643/EEG: Beschikking van de Commissie van 23 december 1985 tot aanvulling
    en wijziging van Beschikking 83/461/EEG houdende vaststelling van de bij de lijst
    van kenmerken behorende definities en van de lijst van landbouwprodukten voor
    de structuurenquête 1983 in het kader van een enquêteprogramma inzake de structuur
    van de landbouwbedrijven'
  type: main
- language: pt
  script: Latn
  content: '85/643/CEE: Decisão da Comissão, de 13 de Dezembro de 1985, que completa
    e altera a Decisão 83/461/CEE que fixa as definições relativas à lista das
    características e a lista dos produtos agrícolas com vista a um inquérito «Estruturas
    1983» no âmbito de um programa de inquéritos sobre a estrutura das explorações
    agrícolas'
  type: main
- language: es
  script: Latn
  content: '85/643/CEE: Decisión de la Comisión, de 13 de diciembre de 1985, por
    la que se completa y modifica la Decisión 83/461/CEE por la que se fijan las
    definiciones referentes a la lista de características y a la lista de productos
    agrícolas para la realización de una encuesta «Estructuras 1983» en el marco
    de un programa de encuestas sobre la estructura de las explotaciones agrícolas'
  type: main
