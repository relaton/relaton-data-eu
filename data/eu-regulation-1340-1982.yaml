title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1340/82 of 28 May 1982 re-establishing the
    levying of customs duties on flax or ramie yarn, products of category 115 (code
    1150), originating in Brazil, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1340/82 de la Commission, du 28 mai 1982, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie de la catégorie 115 (code 1150), originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1340/82 der Kommission vom 28. Mai 1982 über die
    Wiedereinführung des Zollsatzes für Leinengarne und Ramiegarne der Warenkategorie
    Nr. 115 (Kennziffer 1150), mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3602/81 des Rates vorgesehenen Zollpräferenzen gewährt werdene
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1340/82 af 28. maj 1982 om genindførelse
    af opkrævning af toldafgifter for garn af hør eller ramie under kategori nr.
    115 (kode 1150), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1340/82 τής Επιτροπής
    τής 28ης Μαΐου 1982 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά τά νήματα εκ λίνου ή
    ραμί κατηγορίας 115 (κώδικας 1150), καταγωγής Βραζιλίας,
    δικαιούχα τών προβλεπομένων στόν κανονισμό
    (EOK) αριθ. 3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1340/82 della Commissione, del 28 maggio 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramiè della categoria di prodotti n. 115 (codice 1150), originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3602/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1340/82 van de Commissie van 28 mei 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    vlas of ramee, van de categorie van produkten nr. 115 (codenummer 1150), van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3602/81 van de RaadT
  type: main
