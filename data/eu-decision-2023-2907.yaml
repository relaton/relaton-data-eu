    à appliquer, en ce qui concerne l’Irlande du Nord, une mesure particulière
    dérogatoire aux articles 16 et 168 de la directive 2006/112/CE relative au système
    commun de taxe sur la valeur ajoutée en ce qui concerne la prorogation de l’autorisation
  type: main
