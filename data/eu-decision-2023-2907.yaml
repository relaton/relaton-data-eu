    sistemul comun al taxei pe valoarea adăugată în ceea ce privește o prelungire
    a autorizării
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2023/2907 z 21. decembra 2023, ktorým
