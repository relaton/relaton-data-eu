id: EUDecision20171949
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1949 of 25 October 2017 repealing
    Implementing Decision 2014/715/EU identifying Sri Lanka as a third country that
    the Commission considers as a non-cooperating third country pursuant to Council
    Regulation (EC) No 1005/2008 establishing a Community system to prevent, deter
    and eliminate illegal, unreported and unregulated fishing
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1949 de la Commission du 25 octobre 2017
    abrogeant la décision d'exécution 2014/715/UE relative au recensement de Sri
    Lanka comme un pays tiers que la Commission considère comme pays tiers non coopérant
    en application du règlement (CE) n° 1005/2008 du Conseil établissant un système
    communautaire destiné à prévenir, à décourager et à éradiquer la pêche
    illicite, non déclarée et non réglementée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1949 der Kommission vom 25. Oktober 2017
    zur Aufhebung des Durchführungsbeschlusses 2014/715/EU zur Ermittlung eines Drittlandes,
    das die Kommission als nichtkooperierendes Drittland gemäß der Verordnung (EG)
    Nr. 1005/2008 des Rates über ein Gemeinschaftssystem zur Verhinderung, Bekämpfung
    und Unterbindung der illegalen, nicht gemeldeten und unregulierten Fischerei einstuft,
    in Bezug auf Sri Lanka
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1949 на Комисията
    от 25 октомври 2017 година за отмяна на Решение
    за изпълнение 2014/715/ЕС, определящо Шри Ланка
    за трета държава, която Комисията смята за
    несътрудничеща съгласно Регламент (ЕО) № 1005/2008
    на Съвета за създаване на система на Общността
    за предотвратяване, възпиране и премахване
    на незаконния, недеклариран и нерегулиран
    риболов
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1949 ze dne 25. října 2017,
    kterým se zrušuje prováděcí rozhodnutí 2014/715/EU, které určuje Šrí
    Lanku jako třetí zemi, kterou Komise považuje za nespolupracující třetí
    zemi podle nařízení Rady (ES) č. 1005/2008, kterým se zavádí systém Společenství
    pro předcházení, potírání a odstranění nezákonného, nehlášeného a
    neregulovaného rybolovu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/1949 af 25. oktober 2017
    om ophævelse af gennemførelsesafgørelse 2014/715/EU om identifikation af Sri
    Lanka som et tredjeland, som Kommissionen betragter som et ikkesamarbejdende tredjeland
    i henhold til Rådets forordning (EF) nr. 1005/2008 om en EF-ordning, der skal
    forebygge, afværge og standse ulovligt, urapporteret og ureguleret fiskeri
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1949 της Επιτροπής,
