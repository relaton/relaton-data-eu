    komissio katsoo yhteistyöhön osallistumattomaksi kolmanneksi maaksi laittoman,
    ilmoittamattoman ja sääntelemättömän kalastuksen ehkäisemistä, estämistä
    ja poistamista koskevasta yhteisön järjestelmästä annetun neuvoston asetuksen
    (EY) N:o 1005/2008 mukaisesti, annetun täytäntöönpanopäätöksen 2014/715/EU
    kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/1949 оd 25. listopada 2017. o stavljanju
    izvan snage Provedbene odluke 2014/715/EU kojom se utvrđuje da je Šri Lanka
    treća zemlja za koju Komisija smatra da je nekooperativna treća zemlja u skladu
    s Uredbom Vijeća (EZ) br. 1005/2008 o uspostavi sustava Zajednice za sprečavanje,
