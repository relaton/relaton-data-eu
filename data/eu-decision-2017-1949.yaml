    της Σρι Λάνκα ως τρίτης χώρας που η Επιτροπή
    θεωρεί ως μη συνεργαζόμενη τρίτη χώρα σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1005/2008 του Συμβουλίου
    περί δημιουργίας κοινοτικού συστήματος πρόληψης,
