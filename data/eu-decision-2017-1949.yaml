  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1949 végrehajtási határozata (2017. október
    25.) a jogellenes, nem bejelentett és szabályozatlan halászat megelőzésére,
    megakadályozására és felszámolására irányuló közösségi rendszer létrehozásáról
    szóló 1005/2008/EK tanácsi rendelet értelmében Srí Lankát mint a Bizottság
    által nem együttműködő harmadik országnak tekintett harmadik országot azonosító
    2014/715/EU végrehajtási határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1949 della Commissione, del 25 ottobre
    2017, recante abrogazione della decisione di esecuzione 2014/715/UE che identifica
    lo Sri Lanka come un paese terzo che la Commissione considera paese terzo non
    cooperante a norma del regolamento (CE) n. 1005/2008 del Consiglio che istituisce
    un regime comunitario per prevenire, scoraggiare ed eliminare la pesca illegale,
    non dichiarata e non regolamentata
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1949 (2017. gada 25. oktobris),
    ar ko atceļ Īstenošanas lēmumu 2014/715/ES par Šrilankas noteikšanu par
    tādu trešo valsti, kuru Komisija uzskata par nesadarbīgu trešo valsti saskaņā
    ar Padomes Regulu (EK) Nr. 1005/2008, ar ko izveido Kopienas sistēmu, lai aizkavētu,
    novērstu un izskaustu nelegālu, nereģistrētu un neregulētu zveju
  type: main
- language: lt
  script: Latn
  content: 2017 m. spalio 25 d. Komisijos įgyvendinimo sprendimas (ES) 2017/1949,
