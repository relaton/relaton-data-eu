  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1949 tal-25
    ta' Ottubru 2017 li tħassar id-Deċiżjoni ta' Implimentazzjoni 2014/715/UE li
    tidentifika pajjiż terz li l-Kummissjoni tqis li huwa pajjiż terz li ma jikkooperax
    skont ir-Regolament tal-Kunsill (KE) Nru 1005/2008 li jistabbilixxi sistema Komunitarja
    sabiex tipprevjeni, tiskoraġġixxi u telimina sajd illegali, mhux irrappurtat
    u mhux irregolat
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1949 van de Commissie van 25 oktober 2017
    tot intrekking van Uitvoeringsbesluit 2014/715/EU waarbij Sri Lanka wordt aangemerkt
    als een derde land dat door de Commissie als een niet-meewerkend derde land wordt
    beschouwd op grond van Verordening (EG) nr. 1005/2008 van de Raad houdende de
    totstandbrenging van een communautair systeem om illegale, ongemelde en ongereglementeerde
    visserij te voorkomen, tegen te gaan en te beëindigen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/1949 z dnia 25 października 2017
    r. uchylająca decyzję wykonawczą Komisji 2014/715/UE określającą Sri Lankę
    jako państwo trzecie, które Komisja uznaje za niewspółpracujące państwo
    trzecie zgodnie z rozporządzeniem Rady (WE) nr 1005/2008 ustanawiającym wspólnotowy
    system zapobiegania nielegalnym, nieraportowanym i nieuregulowanym połowom oraz
    ich powstrzymywania i eliminowania
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1949 da Comissão, de 25 de outubro de
    2017, que revoga a Decisão de Execução 2014/715/UE que identifica o Sri Lanca
    como um país terceiro considerado não cooperante pela Comissão, na aceção
    do Regulamento (CE) n.° 1005/2008 do Conselho, que estabelece um regime comunitário
    para prevenir, impedir e eliminar a pesca ilegal, não declarada e não regulamentada
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1949 a Comisiei din 25 octombrie
    2017 de abrogare a Deciziei de punere în aplicare 2014/715/UE prin care Sri Lanka
    este identificată ca țară terță pe care Comisia o consideră necooperantă
    în temeiul Regulamentului (CE) nr. 1005/2008 al Consiliului de instituire a unui
    sistem comunitar pentru prevenirea, descurajarea și eliminarea pescuitului ilegal,
    nedeclarat și nereglementat
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/1949 z 25. októbra 2017, ktorým
    sa zrušuje vykonávacie rozhodnutie 2014/715/EÚ, ktorým bola Srí Lanka identifikovaná
    ako tretia krajina, ktorú Komisia považuje za nespolupracujúcu tretiu krajinu
    podľa nariadenia Rady (ES) č. 1005/2008, ktorým sa ustanovuje systém Spoločenstva
    na zabraňovanie nezákonnému, nenahlásenému a neregulovanému rybolovu, na
    odrádzanie od neho a jeho odstránenie
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/1949 z dne 25. oktobra 2017 o razveljavitvi
    Izvedbenega sklepa 2014/715/EU o opredelitvi tretje države, ki jo Komisija obravnava
    kot nesodelujočo tretjo državo v skladu z Uredbo Sveta (ES) št. 1005/2008 o
    vzpostavitvi sistema Skupnosti za preprečevanje nezakonitega, neprijavljenega
    in nereguliranega ribolova, za odvračanje od njega ter za njegovo odpravljanje
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/1949 de la Comisión, de 25 de octubre
    de 2017, que deroga la Decisión de Ejecución 2014/715/UE, por la que se identifica
    a un tercer país que la Comisión considera tercer país no cooperante conforme
    al Reglamento (CE) n.° 1005/2008 del Consejo por el que se establece un sistema
    comunitario para prevenir, desalentar y eliminar la pesca ilegal, no declarada
    y no reglamentada
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/1949 av den 25 oktober 2017
    om upphävande av genomförandebeslut 2014/715/EU om identifiering av Sri Lanka
    som ett tredjeland som kommissionen anser vara ett icke-samarbetande tredjeland
    enligt rådets förordning (EG) nr 1005/2008 om upprättande av ett gemenskapssystem
    för att förebygga, motverka och undanröja olagligt, orapporterat och oreglerat
    fiske
