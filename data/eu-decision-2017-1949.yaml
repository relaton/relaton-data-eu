  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/1949, 25. oktoober 2017, millega tunnistatakse
    kehtetuks rakendusotsus 2014/715/EL, millega määratakse kolmanda riigina kindlaks
    Sri Lanka, keda komisjon peab koostööd mittetegevaks kolmandaks riigiks vastavalt
