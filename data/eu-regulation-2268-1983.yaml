title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2268/83 of 8 August 1983 re-establishing
    the levying of customs duties on new pianos, falling within subheading 92.01 A
    ex I originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2268/83 de la Commission du 8 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux pianos neufs, de la sous-position
    92.01 A ex I du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2268/83 der Kommission vom 8. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Klaviere, neu, der Tarifstelle 92.01 A ex I, mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2268/83 af 8. august 1983 om genindførelse
    af opkrævning af told for klaverer, nye, henhørende under pos. 92.01 A ex I
    og med oprindelse i Sydkorea, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2268/83 της Επιτροπής
    της 8ης Αυγούστου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για τα κλειδοκύμβαλα καινουργή
    της δασμολογικής διακρίσεως 92.01 Α ex Ι του Κοινού
    Δασμολογίου καταγωγής Νότιας Κορέας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2268/83 della Commissione dell' 8 agosto 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai pianoforti nuovi della
    sottovoce 92.01 A ex I della tariffa doganale comune, originari della Corea del
    Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2268/83 van de Commissie van 8 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op piano' s, nieuwe,
    van postonderverdeling 92.01 A ex I, van oorsprong uit Zuid-Korea, waarvoor de
    in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
