title:
- language: en
  script: Latn
  content: "(2014/184/EU): Commission Implementing Decision of 2 April 2014 exempting certain services in the postal sector in Austria from the application of Directive 2004/17/EC of the European Parliament and of the Council coordinating the procurement procedures of entities operating in the water, energy, transport and postal services sectors (notified under document C(2014) 2093)"
  type: main
- language: fr
  script: Latn
  content: "(2014/184/UE): Décision d'exécution de la Commission du 2 avril 2014 exemptant certains services du secteur postal, en Autriche, de l'application de la directive 2004/17/CE du Parlement européen et du Conseil portant coordination des procédures de passation des marchés dans les secteurs de l'eau, de l'énergie, des transports et des services postaux [notifiée sous le numéro C(2014) 2093]"
  type: main
- language: de
  script: Latn
  content: "(2014/184/EU): Durchführungsbeschluss der Kommission vom 2. April 2014 zur Ausnahme bestimmter Dienste des Postsektors in Österreich von der Anwendung der Richtlinie 2004/17/EG des Europäischen Parlaments und des Rates zur Koordinierung der Zuschlagserteilung durch Auftraggeber im Bereich der Wasser-, Energie- und Verkehrsversorgung sowie der Postdienste (Bekanntgegeben unter Aktenzeichen C(2014) 2093)"
  type: main
- language: bg
  script: Cyrl
  content: "(2014/184/ЕС): Решение за изпълнение на Комисията от 2 април 2014 година за освобождаване на някои услуги от сектора на пощенските услуги в Австрия от прилагането на Директива 2004/17/ЕО на Европейския парламент и на Съвета относно координиране на процедурите за възлагане на обществени поръчки от възложители, извършващи дейност във водоснабдяването, енергетиката, транспорта и пощенските услуги (нотифицирано под номер С(2014) 2093)"
  type: main
- language: cs
  script: Latn
  content: "(2014/184/EU): Prováděcí rozhodnutí Komise ze dne 2. dubna 2014 o vynětí některých služeb v poštovním odvětví v Rakousku z použití směrnice Evropského parlamentu a Rady 2004/17/ES o koordinaci postupů při zadávání zakázek subjekty působícími v odvětví vodního hospodářství, energetiky, dopravy a poštovních služeb (oznámeno pod číslem C(2014) 2093)"
  type: main
- language: da
  script: Latn
  content: "(2014/184/EU): Kommissionens gennemførelsesafgørelse af 2. april 2014 om undtagelse af visse tjenester i postsektoren i Østrig fra anvendelsen af Europa-Parlamentets og Rådets direktiv 2004/17/EF om samordning af fremgangsmåderne ved indgåelse af kontrakter inden for vand- og energiforsyning, transport samt posttjenester (meddelt under nummer C(2014) 2093)"
  type: main
- language: el
  script: Grek
  content: "(2014/184/ΕΕ): Εκτελεστική απόφαση της Επιτροπής, της 2ας Απριλίου 2014 , σχετικά με την εξαίρεση ορισμένων υπηρεσιών του τομέα των ταχυδρομείων στην Αυστρία από την εφαρμογή της οδηγίας 2004/17/ΕΚ του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου περί συντονισμού των διαδικασιών σύναψης συμβάσεων στους τομείς του ύδατος, της ενέργειας, των μεταφορών και των ταχυδρομικών υπηρεσιών [κοινοποιηθείσα υπό τον αριθμό C(2014) 2093]"
  type: main
- language: et
  script: Latn
  content: "(2014/184/EL): Komisjoni rakendusotsus, 2. aprill 2014 , teatavate Austria postiteenuste väljajätmise kohta Euroopa Parlamendi ja nõukogu direktiivi 2004/17/EÜ (millega kooskõlastatakse vee-, energeetika-, transpordi- ja postiteenuste sektoris tegutsevate ostjate hankemenetlused) kohaldamisalast (teatavaks tehtud numbri C(2014) 2093 all)"
  type: main
- language: fi
  script: Latn
  content: "(2014/184/EU): Komission täytäntöönpanopäätös, annettu 2 päivänä huhtikuuta 2014 , tiettyjen Itävallassa tarjottavien postialan palvelujen jättämisestä vesi- ja energiahuollon sekä liikenteen ja postipalvelujen alalla toimivien yksiköiden hankintamenettelyjen yhteensovittamisesta annetun Euroopan parlamentin ja neuvoston direktiivin 2004/17/EY soveltamisen ulkopuolelle (tiedoksiannettu numerolla C(2014) 2093)"
  type: main
- language: hr
  script: Latn
  content: "(2014/184/EU): Provedbena odluka Komisije оd 2. travnja 2014. o izuzimanju određenih usluga u poštanskom sektoru u Austriji od primjene Direktive 2004/17/EZ Europskog parlamenta i Vijeća o usklađivanju postupaka nabave subjekata koji djeluju u sektoru vodnog gospodarstva, energetskom i prometnom sektoru te sektoru poštanskih usluga (priopćeno pod brojem dokumenta C(2014) 2093)"
  type: main
- language: hu
  script: Latn
  content: "(2014/184/EU): A Bizottság végrehajtási határozata ( 2014. április 2. ) bizonyos ausztriai postai ágazati szolgáltatásoknak a vízügyi, energiaipari, közlekedési és postai ágazatban működő ajánlatkérők beszerzési eljárásainak összehangolásáról szóló 2004/17/EK európai parlamenti és tanácsi irányelv alkalmazása alóli mentesítéséről (az értesítés a C(2014) 2093. számú dokumentummal történt)"
  type: main
- language: it
  script: Latn
  content: "(2014/184/UE): Decisione di esecuzione della Commissione, del 2 aprile 2014 , che esonera taluni servizi del settore postale in Austria dall'applicazione della direttiva 2004/17/CE del Parlamento europeo e del Consiglio che coordina le procedure di appalto degli enti erogatori di acqua e di energia, degli enti che forniscono servizi di trasporto e servizi postali [notificata con il numero C(2014) 2093]"
  type: main
- language: lv
  script: Latn
  content: "(2014/184/ES): Komisijas Īstenošanas lēmums ( 2014. gada 2. aprīlis ), ar kuru dažiem pakalpojumiem pasta nozarē Austrijā piemēro atbrīvojumu no Eiropas Parlamenta un Padomes Direktīvas 2004/17/EK, ar ko koordinē iepirkuma procedūras, kuras piemēro subjekti, kas darbojas ūdensapgādes, enerģētikas, transporta un pasta pakalpojumu nozarēs (izziņots ar dokumenta numuru C(2014) 2093)"
  type: main
- language: lt
  script: Latn
  content: "(2014/184/ES): 2014 m. balandžio 2 d. Komisijos įgyvendinimo sprendimas dėl Europos Parlamento ir Tarybos direktyvos 2004/17/EB dėl subjektų, vykdančių veiklą vandens, energetikos, transporto ir pašto paslaugų sektoriuose, vykdomų pirkimų tvarkos derinimo netaikymo tam tikroms Austrijos pašto sektoriaus paslaugoms (pranešta dokumentu Nr. C(2014) 2093)"
  type: main
- language: mt
  script: Latn
  content: "(2014/184/UE): Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni tat- 2 ta' April 2014 li teżenta ċertu servizzi fis-settur postali fl-Awstrija mill-applikazzjoni tad-Direttiva 2004/17/KE tal-Parlament Ewropew u tal-Kunsill li tikkoordina l-proċeduri ta' akkwisti ta' entitajiet li joperaw fis-setturi tas-servizzi tal-ilma, l-enerġija, it-trasport u s-servizzi postali (notifikata bid-dokument C(2014) 2093)"
  type: main
- language: nl
  script: Latn
  content: "(2014/184/EU): Uitvoeringsbesluit van de Commissie van 2 april 2014 tot vrijstelling van bepaalde financiële diensten in de postsector in Oostenrijk van de toepassing van Richtlijn 2004/17/EG van het Europees Parlement en de Raad houdende coördinatie van de procedures voor het plaatsen van opdrachten in de sectoren water- en energievoorziening, vervoer en postdiensten (Kennisgeving geschied onder nummer C(2014) 2093)"
  type: main
- language: pl
  script: Latn
  content: "(2014/184/UE): Decyzja wykonawcza Komisji z dnia 2 kwietnia 2014 r. wyłączająca niektóre usługi w sektorze pocztowym w Austrii z zakresu zastosowania dyrektywy 2004/17/WE Parlamentu Europejskiego i Rady koordynującej procedury udzielania zamówień przez podmioty działające w sektorach gospodarki wodnej, energetyki, transportu i usług pocztowych (notyfikowana jako dokument nr C(2014) 2093)"
  type: main
- language: pt
  script: Latn
  content: "(2014/184/UE): Decisão de Execução da Comissão, de 2 de abril de 2014 , que isenta certos serviços do setor postal da Áustria da aplicação da Diretiva 2004/17/CE do Parlamento Europeu e do Conselho relativa à coordenação dos processos de adjudicação de contratos nos setores da água, da energia, dos transportes e dos serviços postais [notificada com o número C(2014) 2093]"
  type: main
- language: ro
  script: Latn
  content: "(2014/184/UE): Decizia de punere în aplicare a Comisiei din 2 aprilie 2014 privind scutirea anumitor servicii din sectorul poștal din Austria de la aplicarea Directivei 2004/17/CE a Parlamentului European și a Consiliului de coordonare a procedurilor de atribuire a contractelor de achiziții în sectoarele apei, energiei, transporturilor și serviciilor poștale [notificată cu numărul C(2014) 2093]"
  type: main
- language: sk
  script: Latn
  content: "(2014/184/EÚ): Vykonávacie rozhodnutie Komisie z 2. apríla 2014 ktorým sa určité služby v poštovom sektore v Rakúsku vynímajú z uplatňovania smernice Európskeho parlamentu a Rady 2004/17/ES o koordinácii postupov obstarávania subjektov pôsobiacich v odvetviach vodného hospodárstva, energetiky, dopravy a poštových služieb [oznámené pod číslom C(2014) 2093]"
  type: main
- language: sl
  script: Latn
  content: "(2014/184/EU): Izvedbeni sklep Komisije z dne 2. aprila 2014 o izvzetju nekaterih storitev v poštnem sektorju v Avstriji iz uporabe Direktive 2004/17/ES Evropskega parlamenta in Sveta o usklajevanju postopkov za oddajo javnih naročil naročnikov v vodnem, energetskem in transportnem sektorju ter sektorju poštnih storitev (notificirano pod dokumentarno številko C(2014) 2093)"
  type: main
- language: es
  script: Latn
  content: "(2014/184/UE): Decisión de Ejecución de la Comisión, de 2 de abril de 2014 , por la que se exime a algunos servicios del sector postal de Austria de la aplicación de la Directiva 2004/17/CE del Parlamento Europeo y del Consejo sobre la coordinación de los procedimientos de adjudicación de contratos en los sectores del agua, de la energía, de los transportes y de los servicios postales [notificada con el número C(2014) 2093]"
  type: main
- language: sv
  script: Latn
  content: "(2014/184/EU): Kommissionens genomförandebeslut av den 2 april 2014 om undantag av vissa tjänster inom postsektorn i Österrike från tillämpningen av Europaparlamentets och rådets direktiv 2004/17/EG om samordning av förfarandena vid upphandling på områdena vatten, energi, transporter och posttjänster [delgivet med nr C(2014) 2093]"
