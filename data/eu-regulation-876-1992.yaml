title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 876/92 of 6 April 1992 re-establishing the
    levying of customs duties on products of category 20 (order No 40.0200), originating
    in Bulgaria and Thailand, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 876/92 de la Commission du 6 avril 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    20 (numéro d'ordre 40.0200) originaires de Bulgarie et de Thaïlande, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 876/92 DER KOMMISSION vom 6. April 1992 zur Wiedereinführung
