title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3107/74 of the Commission of 5 December 1974 derogating
    in respect of the countries of the Association of South East Asian Nations from
    Articles 1, 6 and 13 of Commission Regulation (EEC) No 3106/74 of 5 December 1974
    on the definition of the concept of originating products for purposes of the application
    of tariff preferences granted by the European Economic Community in respect of
    certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3107/74 de la Commission, du 5 décembre 1974, portant
    dérogation pour les pays de l' Association des nations de l' Asie du Sud-Est
    aux articles 1er, 6 et 13 du règlement (CEE) n° 3106/74 de la Commission, du
    5 décembre 1974, relatif à la définition de la notion de produits originaires
    pour l' application des préférences tarifaires accordées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3107/74 der Kommission vom 5. Dezember 1974 über
    die zugunsten der Assoziation der südostasiatischen Länder vorgesehene Abweichung
    von den Artikeln 1, 6 und 13 der Verordnung (EWG) Nr. 3106/74 der Kommission vom
    5. Dezember 1974 über die Begriffsbestimmung des Warenursprungs bei der Anwendung
    der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3107/74 af 5. december 1974 om undtagelse
    for Associeringen af sydøstasiatiske lande fra artikel 1, 6 og 13 i Kommissionens
    forordning (EØF) nr. 3106/74 af 5.december 1974 om definitionen af begrebet varer
    med oprindelsesstatus til brug ved anvendelsen af de af Det europæiske Fællesskab
    ydede toldpræferencer for visse varer fra udviklingslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3107/74 della Commissione, del 5 dicembre 1974, che
    deroga, a favore dell' associazione delle nazioni dell' Asia del Sud-Est, agli
    articoli 1, 6 e 13 del regolamento (CEE) n. 3106/74 della Commissione, del 5 dicembre
    1974, relativo alla definizione della nozione di prodotti originari ai fini dell'
    applicazione delle preferenze tariffarie accordate dalla Comunità economica europea
    a taluni prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3107/74 van de Commissie van 5 december 1974 houdende
