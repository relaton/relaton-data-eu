title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 687/2011 of 18 July 2011 implementing
    Article 2(3) of Regulation (EC) No 2580/2001 on specific restrictive measures
    directed against certain persons and entities with a view to combating terrorism,
    and repealing Implementing Regulations (EU) No 610/2010 and (EU) No 83/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 687/2011 du Conseil du 18 juillet 2011
    mettant en œuvre l’article 2, paragraphe 3, du règlement (CE) n ° 2580/2001
    concernant l’adoption de mesures restrictives spécifiques à l’encontre de
    certaines personnes et entités dans le cadre de la lutte contre le terrorisme,
    et abrogeant les règlements d’exécutions (UE) n ° 610/2010 et (UE) n ° 83/2011
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 687/2011 des Rates vom 18. Juli 2011
    zur Durchführung des Artikels 2 Absatz 3 der Verordnung (EG) Nr. 2580/2001 über
    spezifische, gegen bestimmte Personen und Organisationen gerichtete restriktive
    Maßnahmen zur Bekämpfung des Terrorismus und zur Aufhebung der Durchführungsverordnungen
    (EU) Nr. 610/2010 und (EU) Nr. 83/2011
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 687/2011 на Съвета
    от 18 юли 2011 година за прилагане на член 2, параграф
    3 от Регламент (ЕО) № 2580/2001 относно специалните
    ограничителни мерки за борба с тероризма, насочени
    срещу определени лица и образувания, и за отмяна
    на регламенти за изпълнение (ЕС) № 610/2010 и (ЕС)
    № 83/2011
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 687/2011 ze dne 18. července 2011
    , kterým se provádí čl. 2 odst. 3 nařízení (ES) č. 2580/2001 o zvláštních
    omezujících opatřeních namířených proti některým osobám a subjektům
    s cílem bojovat proti terorismu a kterým se zrušují prováděcí nařízení
    (EU) č. 610/2010 a (EU) č. 83/2011
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 687/2011 af 18. juli 2011 om
    gennemførelse af artikel 2, stk. 3, i forordning (EF) nr. 2580/2001 om specifikke
    restriktive foranstaltninger mod visse personer og enheder med henblik på at
    bekæmpe terrorisme og om ophævelse af gennemførelsesforordning (EU) nr. 610/2010
    og gennemførelsesforordning (EU) nr. 83/2011
  type: main
