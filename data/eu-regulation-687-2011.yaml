    hozott különleges korlátozó intézkedésekről szóló 2580/2001/EK rendelet
    2. cikke (3) bekezdésének végrehajtásáról, valamint a 610/2010/EU és a
    83/2011/EU végrehajtási rendeletek hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
