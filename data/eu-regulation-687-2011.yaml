    relativo a misure restrittive specifiche, contro determinate persone e entità,
    destinate a combattere il terrorismo, e che abroga i regolamenti di esecuzione
    (UE) n. 610/2010 e (UE) n. 83/2011
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 687/2011 ( 2011. gada 18. jūlijs
    ), ar kuru īsteno 2. panta 3. punktu Regulā (EK) Nr. 2580/2001 par īpašiem
    ierobežojošiem pasākumiem, kas terorisma apkarošanas nolūkā vērsti pret
