    beperkende maatregelen tegen bepaalde personen en entiteiten met het oog op de
    strijd tegen het terrorisme, en tot intrekking van Uitvoeringsverordeningen (EU)
    nr. 610/2010 en (EU) nr. 83/2011
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 687/2011 z dnia 18 lipca 2011 r.
    dotyczące wdrożenia art. 2 ust. 3 rozporządzenia (WE) nr 2580/2001 w sprawie
    szczególnych środków restrykcyjnych skierowanych przeciwko niektórym osobom
    i podmiotom mających na celu zwalczanie terroryzmu oraz uchylenia rozporządzeń
    wykonawczych (UE) nr 610/2010 oraz (UE) nr 83/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 687/2011 do Conselho, de 18 de Julho
    de 2011 , que dá execução ao artigo 2. °, n. ° 3, do Regulamento (CE) n.
    ° 2580/2001 relativo a medidas restritivas específicas de combate ao terrorismo
    dirigidas contra determinadas pessoas e entidades, e que revoga os Regulamentos
    de Execução (UE) n. ° 610/2010 e (UE) n. ° 83/2011
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 687/2011 al Consiliului din
    18 iulie 2011 privind punerea în aplicare a articolului 2 alineatul (3) din Regulamentul
    (CE) nr. 2580/2001 privind măsuri restrictive specifice îndreptate împotriva
    anumitor persoane și entități în vederea combaterii terorismului și de abrogare
    a Regulamentelor de punere în aplicare (UE) nr. 610/2010 și (UE) nr. 83/2011
  type: main
