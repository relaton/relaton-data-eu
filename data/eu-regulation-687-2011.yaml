    dwar miżuri restrittivi speċifiċi diretti kontra ċerti persuni u entitajiet
    bil-għan li jiġi miġġieled it-terroriżmu, u li jħassar ir-Regolamenti ta’
    Implimentazzjoni (UE) Nru 610/2010 u (UE) Nru 83/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 687/2011 van de Raad van 18 juli 2011 tot
