title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 140/70 de la Commission, du 26 janvier 1970, relatif
    à la constatation qu'il peut être donné suite aux demandes déposées en vue
    de l'obtention des primes à l'abattage des vaches et des primes à la non-commercialisation
    du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 140/70 der Kommission vom 26. Januar 1970 über die
    Feststellung, daD den zur Erlangung der Prämien für die Schlachtung von Kühen
    und für die Nichtvermarktung von Milch und Milcherzeugnissen eingereichten Anträgen
    stattgegeben werden kann
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 140/70 della Commissione, del 26 gennaio 1970, relativo
    alla constatazione della possibilità di dar seguito alle domande presentate per
    ottenere i premi di macellazione delle vacche e i premi alla non commercializzazione
    del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 140/70 van de Commissie van 26 januari 1970 met betrekking
    tot de constatering, dat gevolg gegeven kan worden aan de verzoeken die ter verkrijging
    van premies voor het slachten van koeien en premies voor het niet in de handel
    brengen van melk en zuivelprodukten werden ingediend
  type: main
