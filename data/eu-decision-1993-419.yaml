title:
- language: en
  script: Latn
  content: Commission Decision of 28 July 1993 amending for the third time Decision
    93/180/EEC concerning certain protection measures with regard to foot-and- mouth
    disease in Italy and repealing Decision 93/168/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 28 juillet 1993 portant troisième modification
    de la décision 93/180/CEE concernant certaines mesures de protection contre la
    fièvre aphteuse en Italie et abrogeant la décision 93/168/CEE
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 28. Juli 1993 zur dritten Änderung der
    Entscheidung 93/180/EWG mit Maßnahmen zum Schutz gegen die Maul- und Klauenseuche
    in Italien und zur Aufhebung der Entscheidung 93/168/EWG
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 28. juli 1993 om tredje ændring af beslutning
    93/180/EØF om visse beskyttelsesforanstaltninger mod mund- og klovesyge i Italien
    og om ophævelse af beslutning 93/168/EØF
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 28ης Ιουλίου 1993
    που τροποποιεί για τρίτη φορά την απόφαση 93/180/ΕΟΚ
    της 26ης Μαρτίου 1993 για ορισμένα μέτρα προστασίας
    από τον αφθώδη πυρετό στην Ιταλία και για την
    κατάργηση της απόφασης 93/168/ΕΟΚ
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 28 luglio 1993 che modifica per la terza
    volta la decisione 93/180/CEE recante misure di protezione contro l' afta epizootica
    in Italia e abrogazione della decisione 93/168/CEE
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 28 juli 1993 houdende derde wijziging
    van Beschikking 93/180/EEG tot vaststelling van beschermende maatregelen in verband
    met mond- en klauwzeer in Italië en tot intrekking van Beschikking 93/168/EEG
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 28 de Julho de 1993 que altera pela terceira vez
    a Decisão 93/180/CEE, relativa a determinadas medidas de protecção contra a
    febre aftosa em Itália e que revoga a Decisão 93/168/CEE
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 28 de julio de 1993 por la que se modifica
    por tercera vez la Decisión 93/180/CEE sobre medidas de protección contra la
    fiebre aftosa en Italia y por la que se deroga la Decisión 93/168/CEE
  type: main
