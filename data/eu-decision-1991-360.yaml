title:
- language: en
  script: Latn
  content: '91/360/EEC: Council Decision of 8 July 1991 on the conclusion of the Agreement
    in the form of an exchange of letters concerning the provisional application of
    Protocol 2 establishing for the period 1 April 1991 to 29 February 1992 the crawfish
    fishing opportunities and the corresponding financial compensation provided for
    in the Agreement on relations in the sea fisheries sector between the European
    Economic Community and the Kingdom of Morocco'
  type: main
- language: fr
  script: Latn
  content: '91/360/CEE: Décision du Conseil du 8 juillet 1991 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole n° 2 fixant les possibilités de pêche à la langouste et la compensation
    financière correspondante prévues dans l''accord sur les relations en matière
    de pêches maritimes entre la Communauté économique européenne et le Royaume
    du Maroc pour la période du 1er avril 1991 au 29 février 1992'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 8. Juli 1991 über den Abschluß des Abkommens
    in Form eines Briefwechsels zur vorläufigen Anwendung der Protokolls Nr. 2 zur
    Festsetzung der Fangmöglichkeiten für die Langustenfischerei und des finanziellen
    Ausgleichs nach dem Abkommen über die Fischereibeziehungen zwischen der Europäischen
    Wirtschaftsgemeinschaft und dem Königreich Marokko für die Zeit vom 1. April
    1991 bis zum 29. Februar 1992 (91/360/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 8. juli 1991 om indgåelse af aftalen i form af
    brevveksling om midlertidig anvendelse af protokol nr. 2 om fastsættelse af mulighederne
    for fiskeri efter languster og af den finansielle godtgørelse, der er omhandlet
    i aftalen om forbindelserne mellem Det Europæiske Økonomiske Fællesskab og
    Kongeriget Marokko på havfiskeriområdet, for perioden 1. april 1991 til 29.
    februar 1992 (91/360/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/360/ΕΟΚ: Απόφαση του Συμβουλίου της 8ης
    Ιουλίου 1991 σχετικά με τη σύναψη της συμφωνίας
    υπό μορφήν ανταλλαγής επιστολών όσον αφορά
    την προσωρινή εφαρμογή του πρωτοκόλλου αριθ.
    2 το οποίο καθορίζει τις δυνατότητες αλιείας
    αστακού και την αντίστοιχη χρηματοδοτική αντιστάθμιση
    οι οποίες προβλέπονται στη συμφωνία για τις
    σχέσεις στον τομέα της θαλάσσιας αλιείας μεταξύ
    της Ευρωπαϊκής Οικονομικής Κοινότητας και
    του Βασιλείου του Μαρόκου για την περίοδο από
    1ης Απριλίου 1991 έως τις 29 Φεβρουαρίου 1992'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO dell'' 8 luglio 1991 concernente la conclusione
    dell'' accordo in forma di scambio di lettere relativo all'' applicazione del
    protocollo n. 2 che fissa le possibilità di pesca dell'' aragosta e la compensazione
    finanziaria corrispondente previste nell'' accordo sulle relazioni in materia
    di pesca marittima tra la Comunità economica europea e il Regno del Marocco per
    il periodo dal 1o aprile 1991 al 29 febbraio 1992 (91/360/CEE) #'
  type: main
