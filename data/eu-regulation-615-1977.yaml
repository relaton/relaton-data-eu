title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 615/77 of 23 March 1977 re-establishing
    the levying of the customs duties on umbrellas and sunshades, falling within heading
    No 66.01, originating in Hong Kong to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 615/77 de la Commission, du 23 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, de la position tarifaire 66.01, originaires de Hong-Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 615/77 der Kommission vom 23. März 1977 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme usw. der Tarifnummer 66.01,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 615/77 af 23. marts 1977 om genindførelse
    af opkrævning af toldafgifter for paraplyer og parasoller, under position 66.01,
    som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 615/77 della Commissione, del 23 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia e da sole)
    della voce doganale 66.01, originari di Hong Kong, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 615/77 van de Commissie van 23 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op paraplu's
    en parasols, alsmede wandelstokparaplu's, van post 66.01, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
