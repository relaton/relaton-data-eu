- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3521/82 of 21 December 1982 amending and
    extending the period of applicability of Regulation (EEC) No 2819/79 making the
    imports of certain textile products from certain third countries subject to Community
    surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3521/82 de la Commission, du 21 décembre 1982, modifiant
    et prorogeant le règlement (CEE) m° 2819/79 soumettant à un régime de surveillance
    communautaire les importations de certains produits textiles originaires de certains
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3521/82 der Kommission vom 21. Dezember 1982 zur Änderung
    und Verlängerung der Verordnung (EWG) Nr. 2819/79, mit der die Einfuhr bestimmter
    Textilwaren aus bestimmten Drittländern einer Gemeinschaftsüberwachung unterworfen
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3521/82 af 21. december 1982 om ændring
    af forlængelse af gyldighedsperioden for forordning (EØF) nr. 2819/79 om indførelse
    af fællesskabstilsyn med indførsel af visse tekstilvarer fra visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3521/82 τής Επιτροπής
    τής 21ης Δεκεμβρίου 1982 γιά τήν τροποποίηση καί
    παράταση τού κανονισμού (EOK) αριθ. 2819/79 περί
    υπαγωγής τών εισαγωγών ορισμένων υφαντουργικών
    προϊόντων καταγωγής ορισμένων τρίτων χωρών
    σέ καθεστώς κοινοτικής επιβλέψεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3521/82 della Commissione, del 21 dicembre 1982, che
    modifica e proroga il regolamento (CEE) n. 2819/79 che sottopone ad un regime
    di sorveglianza comunitario le importazioni di taluni prodotti tessili originari
    di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3521/82 van de Commissie van 21 december 1982 tot
    wijziging en verlenging van de geldigheidsduur van Verordening (EEG) nr. 2819/79
    houdende plaatsing onder communautair toezicht van de invoer van bepaalde textielprodukten
    uit enkele derde landenE
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3521/82 da Comissão, de 21 de Dezembro de 1982,
    que altera e prorroga o Regulamento (CEE) n.° 2819/79 que submete a um regime
    de vigilância comunitária as importações de certos produtos têxteis originários
    de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3521/82 de la Comisión, de 21 de diciembre de 1982,
    por el que se modifica y prorroga el Reglamento (CEE) n° 2819/79 por el que se
    someten a un régimen de vigilancia comunitaria las importaciones de determinados
    productos textiles originarios de determinados terceros países
