title:
- language: en
  script: Latn
  content: '82/647/EEC: Commission Decision of 10 September 1982 establishing that
    the apparatus described as ''Varian - EPR Spectrometer, model E-104 A, with variable
    temperature, model E-257'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/647/CEE: Décision de la Commission, du 10 septembre 1982, constatant
    que l''importation de l''appareil dénommé "Varian - EPR Spectrometer, model
    E-104 A, with variable temperature, model E-257" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/647/EWG: Entscheidung der Kommission vom 10. September 1982 mit der
    festgestellt wird, daß das Gerät ,,Varian-EPR Spectrometer, model E-104 A, with
    variable temperature, model E-257" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/647/EØF: Kommissionens beslutning af 10. september 1982 om fastslåelse
