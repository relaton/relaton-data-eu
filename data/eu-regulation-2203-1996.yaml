    τη Δημοκρατία της Λεττονίας και τη Δημοκρατία
    της Λιθουανίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2203/96, annettu 18 päivänä marraskuuta 1996,
    yhteisön sekä Viron tasavallan, Latvian tasavallan ja Liettuan tasavallan kanssa
    tehdyissä vapaakauppasopimuksissa määrätyn järjestelmän mukaisesti marraskuuta
    1996 esitettyjen tiettyjen maito- ja maitotuotealan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2203/96 DELLA COMMISSIONE del 18 novembre 1996 che
    stabilisce entro quali limiti possono essere accettate le domande di titoli di
    importazione presentate nel mese di novembre 1996 per taluni prodotti del settore
    lattiero-caseario nel quadro del regime previsto dagli accordi di liberalizzazione
    degli scambi conclusi tra la Comunità e la Repubblica estone, la Repubblica lettone
    e la Repubblica lituana
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2203/96 VAN DE COMMISSIE van 18 november 1996 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de invoercertificaataanvragen
    voor bepaalde produkten in de sector melk en zuivelprodukten, die in november
