title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2203/96 of 18 November 1996 determining the
    extent to which applications lodged in November 1996 for certain milk and milk
    products covered by the arrangements provided for in the free-trade Agreements
    concluded by the Community with the Republic of Estonia, the Republic of Latvia
    and the Republic of Lithuania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2203/96 DE LA COMMISSION du 18 novembre 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    novembre 1996 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords sur la libéralisation des échanges
    conclus par la Communauté avec les pays baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2203/96 DER KOMMISSION vom 18. November 1996 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im November 1996
    für die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    einerseits und den Republiken Estland, Lettland und Litauen andererseits geschlossenen
    Abkommen über Freihandel und Handelsfragen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2203/96 af 18. november 1996 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i november 1996 for
    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i frihandelsaftalerne mellem Fællesskabet og Republikken
    Estland, Republikken Letland og Republikken Litauen
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2203/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Νοεμβρίου 1996 για τον καθορισμό των
    ποσοστών αποδοχής των αιτήσεων για άδειες
    εισαγωγής που υποβάλλονται τον Νοέμβριο 1996,
    για ορισμένα προϊόντα στον τομέα του γάλακτος
    και των γαλακτοκομικών προϊόντων στα πλαίσια
    του καθεστώτος που προβλέπεται από τις συμφωνίες
    απελευθέρωσης των συναλλαγών που έχει συνάψει
