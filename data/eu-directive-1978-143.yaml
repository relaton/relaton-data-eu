title:
- language: en
  script: Latn
  content: Council Directive 78/143/EEC of 30 January 1978 amending for the second
    time Directive 70/357/EEC on the approximation of the laws of the Member States
    concerning the antioxidants authorized for use in foodstuffs intended for human
    consumption
  type: main
- language: fr
  script: Latn
  content: Directive 78/143/CEE du Conseil, du 30 janvier 1978, portant deuxième
    modification de la directive 70/357/CEE relative au rapprochement des législations
    des États membres concernant les substances ayant des effets antioxygènes et
    pouvant être employées dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 78/143/EWG des Rates vom 30. Januar 1978 zur zweiten Änderung
    der Richtlinie 70/357/EWG des Rates zur Angleichung der Rechtsvorschriften der
    Mitgliedstaaten für Stoffe mit antioxydierender Wirkung, die in Lebensmitteln
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 78/143/EØF af 30. januar 1978 om anden ændring af direktiv
    70/357/EØF om tilnærmelse af medlemsstaternes lovgivning om antioxidanter, som
    må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 78/143/ΕΟΚ του Συμβουλίου της 30ής Ιανουαρίου
    1978 περί δεύτερης τροποποιήσεως της οδηγίας
    70/357/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τις ουσίες που έχουν
    αντιοξειδωτικά αποτελέσματα και επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 78/143/ETY, annettu 30 päivänä tammikuuta 1978,
    elintarvikkeissa sallittuja hapettumisenestoaineita koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun direktiivin 70/357/ETY muuttamisesta
    toisen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 78/143/CEE del Consiglio, del 30 gennaio 1978, recante seconda
    modifica della direttiva 70/357/CEE relativa al ravvicinamento delle legislazioni
    degli Stati Membri concernenti le sostanze che hanno effetti antiossidanti che
    possono essere impiegate nei prodotti destinati all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 78/143/EEG van de Raad van 30 januari 1978 houdende tweede wijziging
    van Richtlijn 70/357/EEG van de Raad betreffende de onderlinge aanpassing van
    de wettelijke voorschriften der Lid-Staten inzake oxydatie tegengaande stoffen
    waarvan het gebruik in levensmiddelen is toegestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 78/143/CEE do Conselho, de 30 de Janeiro de 1978, que altera
    pela segunda vez a Directiva 70/357/CEE relativa à aproximação das legislações
    dos Estados- membros respeitantes às substâncias antioxidantes que podem ser
    utilizadas nos géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 78/143/CEE del Consejo, de 30 de enero de 1978, que modifica
    por segunda vez la Directiva 70/357/CEE relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre las sustancias que tienen efectos antioxidantes
    y pueden utilizarse en los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 78/143/EEG av den 30 januari 1978 om den andra ändringen
    av direktiv 70/357/EEG om tillnärmning av medlemsstaternas lagstiftning om antioxidationsmedel
    som är godkända för användning i livsmedel
  type: main
