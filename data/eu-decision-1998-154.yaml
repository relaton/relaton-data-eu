    presented by Finland (Only the Finnish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/154/CE: Décision de la Commission du 10 février 1998 approuvant le
    plan de surveillance pour la recherche des résidus ou substances dans les animaux
