    und Stoffen in lebenden Tieren und tierischen Erzeugnissen (Nur der finnische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/154/EF: Kommissionens beslutning af 10. februar 1998 om godkendelse
