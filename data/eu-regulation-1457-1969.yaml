  content: Règlement (CEE) n 1457/69 de la Commission, du 25 juillet 1969, modifiant
    le règlement (CEE) n 1231/69 relatif aux droits additionnels applicables, à
    compter du 1er juillet 1969, à l'importation dans la Communauté des marchandises
    relevant du règlement (CEE) n 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1457/69 der Kommission vom 25. Juli 1969 zur Änderung
    der Verordnung (EWG) Nr. 1231/69 über die Zusatzzölle, die ab 1. Juli 1969 bei
    der Einfuhr in die Gemeinschaft von unter die Verordnung (EWG) Nr. 1059/69 des
    Rates fallenden Waren anwendbar sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1457/69 della Commissione, del 25 luglio 1969, che
    modifica il regolamento (CEE) n. 1231/69 relativo ai dazi addizionali applicabili,
    a decorrere dal 1 luglio 1969, all'importazione nella Comunità delle merci cui
    si applica il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1457/69 van de Commissie van 25 juli 1969 houdende
    wijziging van Verordening (EEG) nr. 1231/69 betreffende de bedragen der aanvullende
    invoerrechten welke met ingang van 1 juli 1969 moeten worden toegepast bij de
    invoer in de Gemeenschap van onder Verordening (EEG) nr. 1059/69 van de Raad vallende
    goederen
