title:
- language: en
  script: Latn
  content: '81/220/EEC: Commission Decision of 12 March 1981 authorizing Ireland not
    to apply Community treatment to blouses and shirt blouses, knitted, crocheted
    (not elastic or rubberized) or woven, originating in Pakistan (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/220/CEE: Décision de la Commission, du 12 mars 1981, autorisant l''Irlande
    à exclure du traitement communautaire les chemisiers, blouses-chemisiers et blouses
    de bonneterie ou tissés, originaires du Pakistan (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/220/EWG: Entscheidung der Kommission vom 12. März 1981 zur Ermächtigung
    Irlands, aus Pakistan stammende Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/220/EØF: Kommissionens beslutning af 12. marts 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage (ikke elastisk eller gummeret) eller vævede med oprindelse
    i Pakistan (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/220/ΕΟΚ: Απόφαση τής Επιτροπής τής 12ης
    Μαρτίου 1981 περί εξουσιοδοτήσεως τής Ιρλανδίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά chemisiers, blouses-chemisiers καί μπλούζας, πλεκτά ή υφασμένα,
    καταγόμενα από τό Πακιστάν (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/220/CEE: Decisione della Commissione, del 12 marzo 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette e bluse
    a maglia (non elastica né gommata) o tessute, originarie del Pakistan (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/220/EEG: Beschikking van de Commissie van 12 maart 1981 houdende machtiging
    van Ierland om blouses en hemdblouses, van brei- of haakwerk (niet-elastisch,
    niet-gegummeerd) of geweven, van oorsprong uit Pakistan van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
