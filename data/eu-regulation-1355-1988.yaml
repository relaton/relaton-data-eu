title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1355/88 of 18 May 1988 amending Commission
    Regulation (EEC) No 3847/87 establishing the list of vessels exceeding eight metres
    length overall permitted to use within certain coastal areas of the Community
    beam trawls whose aggregate length exceeds eight metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1355/88 de la Commission du 18 mai 1988 modifiant
    le règlement (CEE) n° 3847/87 établissant la liste des bateaux dont la longueur
    hors tout dépasse huit mètres, autorisés à pêcher dans certaines zones côtières
    de la Communauté à l' aide de chaluts à perches dont la longueur totale dépasse
    huit mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1355/88 der Kommission vom 18. Mai 1988 zur Änderung
    der Verordnung (EWG) Nr. 3847/87 zur Festlegung der Liste der Schiffe mit einer
    Länge über alles von mehr als 8 m, die in bestimmten Küstengebieten der Gemeinschaft
    mit Baumkurren fischen dürfen, deren Gesamtbaumlänge mehr als 8 m beträgt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1355/88 af 18. maj 1988 om ændring
    af forordning (EØF) nr. 3847/87 om listen over fartøjer med en længde overalt
    på over 8 m, der i visse af Fællesskabets kystområder har tilladelse til at
    anvende bomtrawl, hvis samlede længde overstiger 8 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1355/88 της Επιτροπής
    της 18ης Μαΐου 1988 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3847/87 που καταρτίζει τον κατάλογο
    των σκαφών συνολικού μήκους άνω των 8 μέτρων
    τα οποία επιτρέπεται να αλιεύουν σε ορισμένες
    παράκτιες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα 8 μέτρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1355/88 della Commissione del 18 maggio 1988 recante
    modifica del regolamento (CEE) n. 3847/87 della Commissione che fissa l' elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati ad
    usare, in determinate zone costiere della Comunità, reti a strascico a pali,
    la cui lunghezza complessiva superi gli otto metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1355/88 van de Commissie van 18 mei 1988 tot wijziging
    van Verordening (EEG) nr. 3847/87 tot vaststelling van de lijst van vaartuigen
    met een lengte over alles van meer dan acht meter en die in bepaalde kustzones
    van de Gemeenschap boomkorren mogen gebruiken waarvan de totale boomlengte meer
    dan acht meter bedraagt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1355/88 da Comissão de 18 de Maio de 1988 que altera
    o Regulamento (CEE) n.° 3847/87 que estabelece a lista dos navios com mais de
    oito metros de comprimento de fora a fora autorizados a utilizar em determinadas
    zonas costeiras da Comunidade redes de arrasto de vara em que o comprimento total
    das varas seja superior a oito metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1355/88 de la Comisión de 18 de mayo de 1988 que
    modifica al Reglamento (CEE) n° 3847/87 por el que se establece la lista de barcos
    cuya eslora total exceda los ocho metros y a los que se permite utilizar, dentro
    de determinadas zonas costeras de la Comunidad, artes de arrastre de vara cuya
    longitud total supere los ocho metros
  type: main
