title:
- language: en
  script: Latn
  content: Council Decision 2006/228/JHA of 9 March 2006 fixing the date of application
    of certain provisions of Decision 2005/211/JHA concerning the introduction of
    some new functions for the Schengen Information System, including the fight against
    terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2006/228/JAI du Conseil du 9 mars 2006 fixant la date d'application
    de certaines dispositions de la décision 2005/211/JAI concernant l'attribution
    de certaines fonctions nouvelles au système d'information Schengen, y compris
    dans le cadre de la lutte contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2006/228/JI des Rates vom 9. März 2006 zur Festlegung des Beginns
    der Anwendung einiger Bestimmungen des Beschlusses 2005/211/JI über die Einführung
    neuer Funktionen für das Schengener Informationssystem, auch im Hinblick auf
    die Terrorismusbekämpfung
  type: main
- language: bg
  script: Cyrl
  content: Решение 2006/228/ПВР на Съвета от 9 март 2006 година
    за определяне на датата за прилагане на определени
    разпоредби от Решение 2005/211/ПВР за въвеждането
    на нови функции на Шенгенската информационна
    система, включително и с оглед борбата срещу
    тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2006/228/SVV ze dne 9. března 2006 , kterým se stanoví
    den použitelnosti některých ustanovení rozhodnutí 2005/211/SVV o zavedení
    některých nových funkcí v Schengenském informačním systému, včetně boje
    proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2006/228/RIA af 9. marts 2006 om fastsættelse af datoen
    for anvendelse af visse bestemmelser i afgørelse 2005/211/RIA om indførelse
    af nye funktioner i Schengen-informationssystemet, bl.a. med henblik på terrorismebekæmpelse
  type: main
- language: el
  script: Grek
  content: Απόφαση 2006/228/ΔΕΥ του Συμβουλίου, της 9ης
    Μαρτίου 2006 , για καθορισμό της ημερομηνίας
    εφαρμογής ορισμένων διατάξεων της απόφασης
    2005/211/ΔΕΥ, για την εισαγωγή ορισμένων νέων λειτουργιών
    του συστήματος πληροφοριών Σένγκεν, συμπεριλαμβανομένης
    της καταπολέμησης της τρομοκρατίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2006/228/JSK, 9. märts 2006 , millega määratakse kindlaks
    otsuse 2005/211/JSK (Schengeni infosüsteemi jaoks mõnede uute, sealhulgas terrorismivastast
    võitlust käsitlevate toimingute sisseseadmise kohta) teatavate sätete kohaldamise
    kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2006/228/YOS, tehty 9 päivänä maaliskuuta 2006 ,
    Schengenin tietojärjestelmän eräiden uusien toimintojen käyttöönottamisesta,
    myös terrorismin torjunnassa, tehdyn päätöksen 2005/211/YOS tiettyjen säännösten
    soveltamispäivän vahvistamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/228/IB határozata ( 2006. március 9. ) a terrorizmus elleni
    küzdelem keretében a Schengeni Információs Rendszer egyes új funkcióinak
    bevezetéséről szóló 2005/211/IB tanácsi határozat egyes rendelkezései
    alkalmazási időpontjának meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2006/228/GAI del Consiglio, del 9 marzo 2006 , che stabilisce
    la data di applicazione di talune disposizioni della decisione 2005/211/GAI relativa
    all'introduzione di alcune nuove funzioni del sistema d'informazione Schengen,
    compresa la lotta contro il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2006/228/TI ( 2006. gada 9. marts ), ar ko nosaka datumu
    dažu noteikumu piemērošanai, kas paredzēti Lēmumā 2005/211/TI par dažu
    jaunu Šengenas Informācijas sistēmas funkciju ieviešanu, tostarp attiecība
    uz terorisma apkarošanu
  type: main
- language: lt
  script: Latn
  content: 2006 m. kovo 9 d. Tarybos sprendimas 2006/228/TVR, nustatantis Sprendimo
    2005/211/TVR dėl Šengeno informacinės sistemos kai kurių naujų funkcijų
    nustatymo, įskaitant kovos su terorizmu srityje, tam tikrų nuostatų taikymo
    datą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2006/228/ĠAI tad- 9 ta' Marzu 2006 li tistabbilixxi
    d-data ta' applikazzjoni ta' ċerti dispożizzjonijiet tad-Deċiżjoni 2005/211/ĠAI
    dwar l-introduzzjoni ta' xi funzjonijiet ġodda għas-Sistema ta' Informazzjoni
    ta' Schengen, inkluż fil-ġlieda kontra t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit 2006/228/JBZ van de Raad van 9 maart 2006 tot vaststelling van
    de datum voor de toepassing van sommige bepalingen van Besluit 2005/211/JBZ betreffende
    de invoering van enkele nieuwe functies in het Schengeninformatiesysteem, inclusief
    bij de bestrijding van terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2006/228/WSiSW z dnia 9 marca 2006 r. ustalająca datę rozpoczęcia
    stosowania niektórych przepisów decyzji 2005/211/WSiSW dotyczącej wprowadzenia
    kilku nowych funkcji do Systemu Informacyjnego Schengen, w tym związanych z walką
    z terroryzmem
  type: main
- language: pt
  script: Latn
  content: Decisão 2006/228/JAI do Conselho, de 9 de Março de 2006 , que fixa a
    data de aplicação de determinadas disposições da Decisão 2005/211/JAI relativa
    à introdução de novas funções no sistema de Informação de Schengen, incluindo
    o combate ao terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia 2006/228/JAI a Consiliului din 9 martie 2006 de stabilire a datei
    de aplicare a anumitor dispoziții ale Deciziei 2005/211/JAI privind introducerea
    unor noi funcții ale Sistemului de informații Schengen, inclusiv în combaterea
    terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2006/228/SVV z 9. marca 2006 , ktorým sa stanovuje dátum
    uplatňovania určitých ustanovení rozhodnutia 2005/211/SVV o zavedení niektorých
    nových funkcií pre Schengenský informačný systém vrátane boja proti terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2006/228/PNZ z dne 9. marca 2006 o določitvi datuma uporabe
    nekaterih določb Sklepa 2005/211/PNZ o uvedbi nekaterih novih funkcij za schengenski
    informacijski sistem, vključno v zvezi z bojem proti terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión 2006/228/JAI del Consejo, de 9 de marzo de 2006 , por la que
    se fija la fecha de aplicación de determinadas disposiciones de la Decisión
    2005/211/JAI relativa a la introducción de nuevas funciones para el Sistema de
    Información de Schengen, inclusive en materia de lucha contra el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2006/228/RIF av den 9 mars 2006 om fastställande av datum
    för tillämpningen av vissa bestämmelser i beslut 2005/211/RIF om införande
    av ett antal nya funktioner för Schengens informationssystem, bland annat i kampen
    mot terrorism
