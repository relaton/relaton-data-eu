title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1094/77 of 25 May 1977 re-establishing the
    levying of the customs duties on wood, planed, tongued, grooved etc., falling
    within heading No 44.13, originating in Brazil to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1094/77 de la Commission, du 25 mai 1977 , portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés, bouvetés, etc., de la position tarifaire 44.13, originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1094/77 der Kommission vom 25. Mai 1977 zur Wiedereinführung
    des Zollsatzes für Holz, gehobelt, genutet usw., der Tarifnummer 44.13, mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1094/77 af 25. maj 1977 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, etc., under
    position 44.13, som har oprindelse i Brasilien, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1094/77 della Commissione, del 25 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, ecc., della voce doganale 44.13, originario del
    Brasile, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1094/77 van de Commissie van 25 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op hout, geschaafd,
    geploegd of van sponningen voorzien, enz., van post 44.13, van oorsprong uit Brazilië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
