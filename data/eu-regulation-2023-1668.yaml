    sau a elementelor de risc care nu sunt acoperite sau nu sunt acoperite suficient
    de cerințele de fonduri proprii prevăzute în părțile a treia și a patra
    ale Regulamentului (UE) 2019/2033 al Parlamentului European și al Consiliului
    și indicatorii calitativi orientativi pentru cuantumurile fondurilor proprii
