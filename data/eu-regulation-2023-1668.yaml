title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1668 of 25 May 2023 supplementing
    Directive (EU) 2019/2034 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the measurement of risks or elements
    of risks not covered or not sufficiently covered by the own funds requirements
    set out in Parts Three and Four of Regulation (EU) 2019/2033 of the European Parliament
    and of the Council and the indicative qualitative metrics for the amounts of additional
    own funds
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1668 de la Commission du 25 mai 2023 complétant
    la directive (UE) 2019/2034 du Parlement européen et du Conseil par des normes
    techniques de réglementation apportant des précisions sur la mesure des risques,
    ou des éléments de risques, non couverts ou insuffisamment couverts par les
    exigences de fonds propres prévues dans les troisième et quatrième parties
    du règlement (UE) 2019/2033 du Parlement européen et du Conseil, et sur les
    indicateurs qualitatifs indicatifs à utiliser pour les montants de fonds propres
    supplémentaires
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1668 der Kommission vom 25. Mai 2023 zur
    Ergänzung der Richtlinie (EU) 2019/2034 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Messung von
    Risiken oder Risikokomponenten, die durch die in den Teilen 3 und 4 der Verordnung
    (EU) 2019/2033 des Europäischen Parlaments und des Rates festgelegten Eigenmittelanforderungen
    nicht oder nicht ausreichend abgedeckt sind, und der qualitativen Richtwerte für
    die Höhe der zusätzlichen Eigenmittel
  type: main
- language: bg
  script: Cyrl
