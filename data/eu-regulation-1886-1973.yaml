id: EURegulation18861973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1886/73 of the Commission of 12 July 1973 re-establishing
    Common Customs Tariff duties on handkerchiefs, other than cotton, falling within
    heading No ex 61.05, originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1886/73 de la Commission, du 12 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux mouchoirs et pochettes, autres que de coton, de la position tarifaire ex 61.05,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1886/73 der Kommission vom 12. Juli 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Taschentücher
    und Ziertaschentücher, andere als aus Baumwolle, der Tarifnummer ex 61.05, mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 2764/72 des Rates vom
    19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1886/73 af 12. juli 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for lommetørklæder, ikke af bomuld under
    position ex 61.05, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1886/73 della Commissione, del 12 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    fazzoletti da naso e da taschino, altri che di cotone, della voce doganale n.
    ex 61.05 originari dell' India, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1886/73 van de Commissie van 12 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op zakdoeken, andere dan van katoen, van post ex 61.05. van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2764/72 van de Raad van 19 december 1972
  type: main
