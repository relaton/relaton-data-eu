  content: Commission Regulation (EEC) No 1542/90 of 7 June 1990 introducing a corrective
    amount on the import of apricots into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1542/90 de la Commission, du 7 juin 1990, instituant
