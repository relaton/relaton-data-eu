title:
- language: en
  script: Latn
  content: '2013/766/EU: Commission Implementing Decision of 13 December 2013 approving
    certain amended programmes for the eradication, control and monitoring of animal
    diseases and zoonoses for the year 2013, amending Decision 2008/897/EC approving
    annual and multiannual programmes for 2009 and following years and amending Implementing
    Decision 2012/761/EU as regards the Union financial contribution for certain programmes
    approved by that Decision (notified under document C(2013) 8891)'
  type: main
- language: fr
  script: Latn
  content: '2013/766/UE: Décision d’exécution de la Commission du 13 décembre
    2013 portant approbation de certains programmes modifiés de surveillance, de
    lutte et d’éradication concernant des maladies animales et zoonoses pour l’année
    2013, modifiant la décision 2008/897/CE portant approbation des programmes annuels
    et pluriannuels pour l’année 2009 et les années suivantes et modifiant la
    décision d’exécution 2012/761/UE en ce qui concerne la contribution financière
    de l’Union à certains programmes approuvés par ladite décision [notifiée
    sous le numéro C(2013) 8891]'
  type: main
- language: de
  script: Latn
  content: '2013/766/EU: Durchführungsbeschluss der Kommission vom 13. Dezember 2013
