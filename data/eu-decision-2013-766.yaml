    Überwachung von Tierseuchen und Zoonosen für das Jahr 2013, zur Änderung der
    Entscheidung 2008/897/EG zur Genehmigung der für 2009 und die Folgejahre vorgelegten
    Jahres- und Mehrjahresprogramme sowie zur Änderung des Durchführungsbeschlusses
    2012/761/EU hinsichtlich der finanziellen Beteiligung der Union an bestimmten,
