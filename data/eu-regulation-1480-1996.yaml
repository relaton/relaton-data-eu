  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1480/96, annettu 26 päivänä heinäkuuta 1996,
    Tunisiasta peräisin olevan oliiviöljyn tuontia koskevista erityisistä toimenpiteistä
    annetun neuvoston asetuksen (EY) N:o 447/96 yksityiskohtaisista soveltamissäännöistä
    ja Uruguayn kierroksen maataloussopimuksen täytäntöönpanoon liittyvistä tietyistä
    siirtymätoimenpiteistä oliiviöljyalalla annetun asetuksen (EY) N:o 1477/95
    muuttamisesta annetun asetuksen (EY) N:o 666/96 oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1480/96 della Commissione del 26 luglio 1996 che rettifica
    il regolamento (CE) n. 666/96 recante modalità di applicazione del regolamento
    (CE) n. 447/96 del Consiglio, recante misure speciali per l'importazione di olio
    d'oliva originario della Tunisia e recante modifica del regolamento (CE) n. 1477/95
    recante misure transitorie relative all'attuazione dell'accordo sull'agricoltura
    dell'Uruguay Round nel settore dell'olio d'oliva
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1480/96 van de Commissie van 26 juli 1996 houdende
    rectificatie van Verordening (EG) nr. 666/96 houdende uitvoeringsbepalingen van
    Verordening (EG) nr. 447/96 tot vaststelling van bijzondere maatregelen voor de
    invoer van olijfolie van oorsprong uit Tunesië en houdende wijziging van Verordening
