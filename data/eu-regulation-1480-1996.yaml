    in de sector olijfolie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1480/96 da Comissão de 26 de Julho de 1996 que rectifica
    o Regulamento (CE) nº 666/96 que estabelece as normas de execução do Regulamento
    (CE) nº 447/96, que prevê medidas especiais para a importação de azeite originário
    da Tunísia, e que altera o Regulamento (CE) nº 1477/95, que estabelece certas
    medidas transitórias relativas à execução do acordo agrícola do «Uruguay
    Round» no sector do azeite
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1480/96 de la Comisión de 26 de julio de 1996 por el
    que se modifica el Reglamento (CE) nº 666/96 por el que se establecen disposiciones
    de aplicación del Reglamento (CE) nº 447/96 del Consejo por el que se establecen
    medidas especiales para la importación de aceite de oliva originario de Túnez,
    y se modifica el Reglamento (CE) nº 1477/95, por el que se establecen medidas
    transitorias para la aplicación del Acuerdo agrícola de la Ronda Uruguay en
    el sector del aceite de oliva
  type: main
- language: sv
  script: Latn
