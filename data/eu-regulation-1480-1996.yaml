  content: Commission Regulation (EC) No 1480/96 of 26 July 1996 amending Regulation
    (EC) No 666/96 laying down detailed rules for the application of Regulation (EC)
    No 447/96 laying down special measures for the import of olive oil from Tunisia
    and amending Regulation (EC) No 1477/95 laying down certain transitional measures
    for the implementation of the Uruguay Round Agreement on Agriculture as regards
    olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1480/96 de la Commission du 26 juillet 1996 rectifiant
    le règlement (CE) nº 666/96 portant modalités d'application du règlement (CE)
    nº 447/96 du Conseil prévoyant des mesures spéciales pour l'importation d'huile
    d'olive originaire de Tunisie et modifiant le règlement (CE) nº 1477/95 portant
    certaines mesures transitoires relatives à la mise en oeuvre de l'accord agricole
    du cycle d'Uruguay dans le secteur de l'huile d'olive
  type: main
- language: de
  script: Latn
