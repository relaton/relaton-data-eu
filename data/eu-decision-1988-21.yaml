title:
- language: en
  script: Latn
  content: '88/21/EEC: Commission Decision of 18 December 1987 authorizing the United
    Kingdom to extend intra-Community surveillance in respect of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/21/CEE: Décision de la Commission du 18 décembre 1987 autorisant
    le Royaume-Uni à proroger les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres États membres (Le texte en langue anglaise est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 18. Dezember 1987 zur Ermächtigung des
    Vereinigten Königreichs zur Verlängerung einer innergemeinschaftlichen Überwachung
    von aus bestimmten Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Bananen (Nur der englische Text ist verbindlich) (88/21/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. december 1987 om bemyndigelse af Det Forenede
    Kongerige til at forlænge foranstaltninger med henblik på tilsyn inden for Fællesskabet
    med indførsel af bananer, der har oprindelse i visse tredjelande, og som er overgået
    til fri omsætning i de øvrige medlemsstater (Kun den engelske udgave er autentisk)
    (88/21/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1987 περί χορηγήσεως αδείας στο Ηνωμένο Βασίλειο
    να παρατείνει την ενδοκοινοτική επιτήρηση
    όσον αφορά τις μπανάνες καταγωγής ορισμένων
    τρίτων χωρών οι οποίες τίθενται σε ελεύθερη
    κυκλοφορία στα άλλα κράτη μέλη ( Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό
    ) ( 88/21/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 dicembre 1987 che autorizza il Regno
    Unito a prorogare le misure di sorveglianza intracomunitaria nei confronti delle
    banane originarie di taluni paesi terzi e messe in libera pratica negli altri
    Stati membri (Il testo in lingua inglese è il solo facente fede) (88/21/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 18 december 1987 waarbij het Verenigd
    Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair toezicht te verlengen
    ten aanzien van bananen van oorsprong uit bepaalde derde landen en in de andere
    Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in de Engelse taal
    is authentiek) (88/21/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '88/21/CEE: Decisão da Comissão de 18 de Dezembro de 1987 que autoriza
    o Reino Unido a prorrogar as medidas de vigilância intracomunitária em relação
    às bananas originárias de certos países terceiros e introduzidas em livre-prática
    nos outros Estados-membros'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 18 de diciembre de 1987 por la que se autoriza
    al Reino Unido a prorrogar las medidas de vigilancia intracomunitaria respecto
    de los plátanos originarios de determinados terceros países y despachados a
    libre práctica en los demás Estados miembros (El texto en lengua inglesa es
    el único auténtico) (88/21/CEE) #'
