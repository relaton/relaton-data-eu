    2022 portant extension du droit compensateur définitif institué par le règlement
    d’exécution (UE) 2020/776 sur les importations de certains tissus en fibres
    de verre tissées et/ou cousues originaires de la République populaire de Chine
    et d’Égypte aux importations de certains tissus en fibres de verre tissées
    et/ou cousues expédiés de Turquie, qu’ils aient ou non été déclarés originaires
    de ce pays
  type: main
