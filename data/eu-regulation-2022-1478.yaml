title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1478 of 6 September 2022 extending
    the definitive countervailing duty imposed by Implementing Regulation (EU) 2020/776,
    on imports of certain woven and/or stitched glass fibre fabrics originating in
    the People’s Republic of China and Egypt to imports of certain woven and/or
    stitched glass fibre fabrics consigned from Turkey, whether declared as originating
    in Turkey or not
  type: main
- language: fr
  script: Latn
