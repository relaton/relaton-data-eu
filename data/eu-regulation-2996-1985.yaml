title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2996/85 of 28 October 1985 re-establishing
    the levying of customs duties on certain men' s and boys' underpants and briefs,
    and on certain women' s, girls' and infants' knickers and briefs, knitted or crocheted,
    products of category 13 (code 40.0130) originating in India to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2996/85 de la Commission du 28 octobre 1985 portant
    rétablissement de la perception des droits de douane applicables à certains
    slips et caleçons pour hommes et garçonnets et à certains slips et culottes
    pour femmes, fillettes et jeunes enfants, de bonneterie, de la catégorie 13 (code
    40.0130), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2996/85 der Kommission vom 28. Oktober 1985 über
    die Wiedereinführung des Zollsatzes für bestimmte Unterhosen und Slips für
    Männer und Knaben und für bestimmte Schlüpfer und dergleichen für Frauen,
    Mädchen und Kleinkinder, aus Gewirken, der Warenkategorie Nr. 13, Kennziffer
    40.0130, mit Ursprung in Indien, denen die in der Verordnung (EWG) Nr. 3563/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2996/85 af 28. oktober 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte trusser og andre underbenklæder til
    mænd og drenge, bestemte trusser og andre underbenklæder til kvinder, piger
    og småbørn af bomuld under varekategori nr. 13 (kode 40.0130), som har oprindelse
    i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2996/85 της Επιτροπής
    της 28ης Οκτωβρίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    σλιπς και εσώβρακα για άνδρες και παιδιά, καθώς
    και ορισμένα σλιπς και κυλόττες για γυναίκες,
    κορασίδες και μικρά παιδιά, πλεκτά, της κατηγορίας
