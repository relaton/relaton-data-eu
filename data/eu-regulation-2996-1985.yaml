    (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2996/85 della Commissione del 28 ottobre 1985 che
    ripristina la riscossione dei dazi doganali applicabili a certe mutande, mutandine
    e slip per uomo e per ragazzo, nonché per donna, per ragazza e per bambini, a
    maglia, della categoria di prodotti n. 13, (codice 40.0130) originari dell' India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3563/84
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2996/85 van de Commissie van 28 oktober 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    slips en onderbroeken voor heren en jongens, bepaalde slips en broeken voor dames,
    meisjes en kinderen van brei- of haakwerk, van de categorie van produkten nr.
    13 (codenummer 40.0130), van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
