id: EUDecision1980450
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/450/EEC: Commission Decision of 10 April 1980 authorizing Ireland not
    to apply Community treatment to woven table linen, toilet and kitchen linen, falling
    within subheading ex 62.02 B of the Common Customs Tariff (category 39), originating
    in Brazil and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/450/CEE: Décision de la Commission, du 10 avril 1980, autorisant l''Irlande
    à exclure du traitement communautaire le linge de table, de toilette, d''office
    ou de cuisine, tissé, de la sous-position ex 62.02 B du tarif douanier commun
    (catégorie 39), originaire du Brésil et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/450/EWG: Entscheidung der Kommission vom 10. April 1980, mit der Irland
    ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Tischwäsche, Wäsche zur Körperpflege und andere
    Haushaltswäsche, aus Geweben, der Tarifstelle ex 62.02 B des Gemeinsamen Zolltarifs
    (Kategorie 39) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/450/EØF: Kommissionens beslutning af 10. april 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude, viskestykker og lignende køkkentekstiler, vævede, som henhører
    under pos. ex 62.02 B i den fælles toldtarif (kategori 39), har oprindelse i
    Brasilien og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/450/CEE: Decisione della Commissione, del 10 aprile 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario la biancheria da tavola, da
    toletta, da servizio o da cucina, tessuta, della sottovoce ex 62.02 B della tariffa
    doganale comune, categoria 39, originaria del Brasile e messa in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/450/EEG: Beschikking van de Commissie van 10 april 1980 waarbij Ierland
    wordt gemachtigd tafellinnen, huishoudlinnen, van post ex 62.02 B van het gemeenschappelijk
    douanetarief (categorie 39), van oorsprong uit Brazilië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
