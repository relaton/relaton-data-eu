title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2203/90 of 24 July 1990 amending Regulation
    (EEC) No 1581/86 laying down general rules for intervention on the market in cereals
    and Regulations No 724/67/EEC and (EEC) No 2754/78 on intervention in the oils
    and fats sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2203/90 du Conseil du 24 juillet 1990 modifiant le
    règlement (CEE) n° 1581/86 fixant les règles générales de l'intervention
    dans le secteur des céréales, ainsi que les règlements n° 724/67/CEE et (CEE)
    n° 2754/78 en ce qui concerne l'intervention dans le secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2203/90 des Rates vom 24. Juli 1990 zur Änderung
    der Verordnung (EWG) Nr. 1581/86 zur Festlegung der Grundregeln für die Intervention
    bei Getreide sowie der Verordnungen Nr. 724/67/EWG und (EWG) Nr. 2754/78 hinsichtlich
    der Interventionen auf dem Fettsektor
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EHS) č. 2203/90 ze dne 24. července 1990, kterým se
    mění nařízení (EHS) č. 1581/86, kterým se stanoví obecná pravidla pro
    intervenci v odvětví obilovin, a nařízení č. 724/67/EHS a (EHS) č. 2754/78
    o intervenci v odvětví olejů a tuků
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2203/90 af 24. juli 1990 om ændring af forordning
    (EØF) nr. 1581/86 om fastsættelse af de almindelige regler for intervention
    inden for kornsektoren, samt af forordning nr. 724/67/EØF og (EØF) nr. 2754/78
    for så vidt angår intervention inden for sektoren for fedtstoffer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2203/90 του Συμβουλίου
    της 24ης Ιουλίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1581/86 περί του καθορισμού
    των γενικών κανόνων παρέμβασης στον τομέα
    των σιτηρών καθώς και των κανονισμών αριθ.
    724/67/ΕΟΚ και (ΕΟΚ) αριθ. 2754/78 όσον αφορά την παρέμβαση
    στον τομέα των λιπαρών ουσιών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EMÜ) nr 2203/90, 24. juuli 1990, millega muudetakse
    määrust (EMÜ) nr 1581/86, millega sätestatakse sekkumist reguleerivad üldeeskirjad
    teraviljaturul, ning õlide ja rasvade sektoris sekkumist käsitlevaid määrusi
    nr 724/67/EMÜ ja (EMÜ) nr 2754/78
  type: main
- language: hu
  script: Latn
  content: A Tanács 2203/90/EGK rendelete (1990. július 24.) a gabonafélék piacán
    alkalmazott intervenció általános szabályainak megállapításáról szóló
    1581/86/EGK rendelet, valamint az olaj- és zsírágazatban alkalmazott intervencióról
    szóló 724/67/EGK és 2754/78/EGK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2203/90 del Consiglio del 24 luglio 1990 recante modifica
    del regolamento (CEE) n. 1581/86 che fissa le norme generali dell'intervento nel
    settore dei cereali, nonché dei regolamenti n. 724/67/CEE e (CEE) n. 2754/78
    per quanto riguarda l'intervento nel settore dei grassi
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EEK) Nr. 2203/90 (1990. gada 24. jūlijs), ar ko groza
    Regulu (EEK) Nr. 1581/86, ar kuru paredz vispārējus noteikumus intervencei labības
    tirgū, kā arī Regulu Nr. 724/67/EEK un Regulu (EEK) Nr. 2754/78 par intervenci
    eļļas un tauku nozarē
  type: main
- language: lt
  script: Latn
  content: 1990 m. liepos 24 d. Tarybos Reglamentas (EEB) Nr. 2203/90 iš dalies keičiantis
    Reglamentą (EEB) Nr. 1581/86, nustatantį bendrąsias intervencijos į grūdų
    rinką taisykles, ir Reglamentus Nr. 724/67/EEB ir (EEB) Nr. 2754/78 dėl intervencijos
    aliejų ir riebalų sektoriuje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KEE) Nru 2203/90 ta’ l-24 ta’ Lulju 1990
    li jemenda r-Regolament (KEE) Nru 1581/86 li jistabbilixxi regoli ġenerali dwar
    l-intervent fis-suq taċ-ċereali u r-Regolamenti Nru 724/67/KEE u (KEE) Nru 2754/78
    dwar l-intervent fis-suq taż-żjut u tax-xaħmijiet
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2203/90 van de Raad van 24 juli 1990 tot wijziging
    van Verordening (EEG) nr. 1581/86 tot vaststelling van de algemene voorschriften
    voor interventie in de sector granen, en tot wijziging van de Verordeningen nr.
    724/67/EEG en (EEG) nr. 2754/78 wat de interventie in de sector oliën en vetten
    betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (EWG) NR 2203/90 z dnia 24 lipca 1990 r. zmieniające
    rozporządzenie (EWG) nr 1581/86 ustanawiające ogólne zasady interwencji na
    rynku zbóż i rozporządzenia nr 724/67/EWG i (EWG) nr 2754/78 w sprawie interwencji
    w sektorze olejów i tłuszczów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2203/90 do Conselho de 24 de Julho de 1990 que altera
    o Regulamento (CEE) nº 1581/86, que fixa as regras gerais de intervenção no
    sector dos cereais, bem como os Regulamentos nº 724/67/CEE e (CEE) nº 2754/78
    no que diz respeito à intervenção no sector das matérias gordas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EHS) č. 2203/90 z 24. júla 1990, ktorým sa mení a
    dopĺňa nariadenie (EHS) č. 1581/86, ktorým sa ustanovujú všeobecné pravidlá
    intervencie na trhu s obilninami, a nariadenia č. 724/67/EHS a (EHS) č. 2754/78
    o intervencii v odvetví olejov a tukov
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EGS) št. 2203/90 z dne 24. julija 1990 o spremembi Uredbe
    (EGS) št. 1581/86 o določitvi splošnih pravil za intervencije na trgu za žita
    in uredb št. 724/67/EGS in (EGS) št. 2754/78 o intervenciji v sektorju olja
    in masti
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2203/90 del Consejo de 24 de julio de 1990 que modifica
    el Reglamento (CEE) n° 1581/86 por el que se fijan las reglas generales de intervención
    en el sector de los cereales, así como los Reglamentos n° 724/67/CEE y (CEE)
    n° 2754/78 en lo relativo a la intervención en el sector de las materias grasas
  type: main
