title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/401 of 24 February 2026 laying
    down rules for the application of Council Directive 92/43/EEC as regards the list
    of sites of Community importance and repealing Implementing Decisions (EU) 2024/428,
    (EU) 2025/238, (EU) 2025/239, (EU) 2025/240, (EU) 2025/242, (EU) 2025/244, (EU)
