---
id: EURegulation20231686
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1686 of 30 June 2023 amending
    Delegated Regulation (EU) 2021/1698 as regards certain procedural requirements
    for the recognition of control authorities and control bodies that are competent
    to carry out controls on operators and groups of operators certified organic and
    on organic products in third countries and certain requirements on their supervision
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1686 de la Commission du 30 juin 2023 modifiant
    le règlement délégué (UE) 2021/1698 en ce qui concerne certaines règles de
    procédure relatives à la reconnaissance des autorités et organismes de contrôle
    qui ont compétence pour effectuer des contrôles portant sur les opérateurs
    et groupes d’opérateurs certifiés biologiques et sur les produits biologiques
    dans les pays tiers et certaines règles relatives à leur supervision
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1686 der Kommission vom 30. Juni 2023 zur
    Änderung der Delegierten Verordnung (EU) 2021/1698 hinsichtlich bestimmter Verfahrensvorschriften
    für die Anerkennung von Kontrollbehörden und Kontrollstellen, die für die Durchführung
    von Kontrollen von als ökologisch/biologisch zertifizierten Unternehmern und
    Unternehmergruppen und ökologischen/biologischen Erzeugnissen in Drittländern
    zuständig sind, sowie hinsichtlich bestimmter Anforderungen an deren Überwachung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1686 на Комисията
    от 30 юни 2023 година за изменение на Делегиран
    регламент (ЕС) 2021/1698 по отношение на някои процедурни
    изисквания за признаването на контролните
    и надзорните органи, които са компетентни да
    извършват контрол върху оператори и групи
    от оператори, сертифицирани за биологично
    производство, и върху биологични продукти
    в трети държави, както и по отношение на някои
    изисквания за надзора върху тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1686 ze dne 30. června
    2023 kterým se mění nařízení v přenesené pravomoci (EU) 2021/1698, pokud
    jde o určité procesní požadavky na uznávání kontrolních orgánů a kontrolních
    subjektů, které jsou příslušné provádět kontroly hospodářských subjektů
    a skupin hospodářských subjektů certifikovaných jako ekologické a ekologických
    produktů ve třetích zemích, a o některé požadavky na dohled nad nimi
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/1686 af 30. juni 2023 om
    ændring af delegeret forordning (EU) 2021/1698 for så vidt angår visse proceduremæssige
    krav for anerkendelsen af kontrolmyndigheder og kontrolorganer, der er kompetente
    til at foretage kontrol af økologisk certificerede erhvervsdrivende og grupper
    af erhvervsdrivende og økologiske produkter i tredjelande, og for så vidt angår
    visse regler om deres tilsyn
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/1686
    της Επιτροπής της 30ής Ιουνίου 2023 για την τροποποίηση
    του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2021/1698
    όσον αφορά ορισμένες διαδικαστικές απαιτήσεις
    για την αναγνώριση των αρχών ελέγχου και των
    φορέων ελέγχου που είναι αρμόδιοι να διενεργούν
    ελέγχους σε επιχειρήσεις και ομάδες επιχειρήσεων
    που έχουν λάβει πιστοποίηση βιολογικής παραγωγής
    και σε βιολογικά προϊόντα σε τρίτες χώρες,
    καθώς και ορισμένες απαιτήσεις σχετικά με
    την εποπτεία τους
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/1686, 30. juuni 2023, millega
    muudetakse delegeeritud määrust (EL) 2021/1698 osas, mis puudutab teatavaid
    menetlusnõudeid selliste kontrolliasutuste ja kontrollorganite tunnustamiseks,
    kes on pädevad kontrollima kolmandates riikides mahepõllumajanduslikuna sertifitseeritud
    ettevõtjaid ja ettevõtjate rühmi ja mahepõllumajanduslikke tooteid ning teatavaid
    eeskirju kontrolliasutuste ja kontrollorganite üle järelevalve teostamiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/1686, annettu 30 päivänä kesäkuuta
    2023, delegoidun asetuksen (EU) 2021/1698 muuttamisesta siltä osin kuin on kyse
    tietyistä menettelyvaatimuksista sellaisten valvontaviranomaisten ja tarkastuslaitosten
    hyväksymiseksi, joilla on toimivalta tehdä tarkastuksia luonnonmukaisiksi sertifioiduille
    toimijoille ja toimijaryhmille ja luonnonmukaisesti tuotetuille tuotteille kolmansissa
    maissa, sekä tietyistä niiden valvontaa koskevista vaatimuksista
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/1686 ón gCoimisiún an 30 Meitheamh 2023
    lena leasaítear Rialachán Tarmligthe (AE) 2021/1698 a mhéid a bhaineann le
    ceanglais áirithe nós imeachta maidir le húdaráis rialaithe agus comhlachtaí
    rialaithe atá inniúil chun rialuithe a dhéanamh ar oibreoirí agus ar ghrúpaí
    oibreoirí arna ndeimhniú mar oibreoirí orgánacha a aithint agus ar tháirgí
    orgánacha i dtríú tíortha agus le ceanglais áirithe maidir lena maoirseacht
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1686 оd 30. lipnja 2023. o izmjeni
    Delegirane uredbe (EU) 2021/1698 u pogledu određenih postupovnih uvjeta za priznavanje
    kontrolnih tijela i kontrolnih ustanova nadležnih za obavljanje kontrola subjekata
    i skupina subjekata koji su certificirani kao ekološki te ekoloških proizvoda
    u trećim zemljama i određenih zahtjeva koji se odnose na njihov nadzor
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1686 felhatalmazáson alapuló rendelete (2023.
    június 30.) az (EU) 2021/1698 felhatalmazáson alapuló rendeletnek a tanúsított,
    ökológiai termelést folytató gazdasági szereplők, gazdálkodói csoportok
    és ökológiai termékek harmadik országban végzett ellenőrzésére jogosult
    ellenőrző hatóságok és ellenőrző szervezetek elismerésére vonatkozó
    egyes eljárási követelmények, valamint a felügyeletükre vonatkozó egyes
    követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/1686 della Commissione del 30 giugno 2023
    che modifica il regolamento delegato (UE) 2021/1698 per quanto riguarda taluni
    obblighi procedurali per il riconoscimento delle autorità di controllo e degli
    organismi di controllo competenti per eseguire controlli sugli operatori e sui
    gruppi di operatori certificati biologici e sui prodotti biologici nei paesi terzi
    e talune norme relative alla loro supervisione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1686 (2023. gada 30. jūnijs), ar
    ko Deleģēto regulu (ES) 2021/1698 groza attiecībā uz dažām procedūras prasībām
    tādu kontroles iestāžu un kontroles institūciju atzīšanai, kuras ir kompetentas
    veikt kontroles attiecībā uz sertificētiem bioloģisko produktu operatoriem
    un operatoru grupām un bioloģiskiem produktiem trešās valstīs, un attiecībā
    uz dažām prasībām par to uzraudzību
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1686 2023 m. birželio 30
    d. kuriuo dėl tam tikrų kontrolės institucijų ir kontrolės įstaigų, turinčių
    kompetenciją vykdyti sertifikuotų ekologinės gamybos vykdytojų ir jų grupių
    ir ekologiškų produktų kontrolę trečiosiose valstybėse, pripažinimo procedūrinių
    reikalavimų ir tam tikrų jų priežiūros reikalavimų iš dalies keičiamas
    Deleguotasis reglamentas (ES) 2021/1698
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/1686 tat-30 ta’ Ġunju 2023
    li jemenda r-Regolament Delegat (UE) 2021/1698 fir-rigward ta’ ċerti rekwiżiti
    proċedurali għar-rikonoxximent tal-awtoritajiet ta’ kontroll u tal-korpi ta’
    kontroll li huma kompetenti biex iwettqu kontrolli fuq operaturi u gruppi ta’
    operaturi ċċertifikati organiċi u fuq prodotti organiċi f’pajjiżi terzi
    u ċerti rekwiżiti dwar is-superviżjoni tagħhom
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/1686 van de Commissie van 30 juni 2023
    tot wijziging van Gedelegeerde Verordening (EU) 2021/1698 wat betreft bepaalde
    procedurele voorschriften voor de erkenning van controleautoriteiten en controleorganen
    die bevoegd zijn voor de controle van exploitanten en groepen exploitanten die
    in derde landen biologisch gecertificeerd zijn en van biologische producten in
    derde landen, en wat betreft bepaalde voorschriften inzake het toezicht daarop
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1686 z dnia 30 czerwca 2023
    r. zmieniające rozporządzenie delegowane (UE) 2021/1698 w odniesieniu do niektórych
    wymogów proceduralnych dotyczących uznawania organów kontrolnych i jednostek
    certyfikujących właściwych do przeprowadzania kontroli podmiotów i grup podmiotów
    certyfikowanych jako ekologiczne oraz produktów ekologicznych w państwach trzecich,
    a także niektórych wymogów dotyczących nadzoru nad nimi
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1686 da Comissão de 30 de junho de 2023
    que altera o Regulamento Delegado (UE) 2021/1698 no respeitante a determinados
    requisitos processuais para o reconhecimento das autoridades de controlo e dos
    organismos de controlo competentes para efetuar controlos de operadores e grupos
    de operadores certificados biológicos e de produtos biológicos em países terceiros,
    e a determinados requisitos relativos à sua supervisão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1686 al Comisiei din 30 iunie 2023 de modificare
    a Regulamentului delegat (UE) 2021/1698 în ceea ce privește anumite cerințe
    procedurale pentru recunoașterea autorităților de control și a organismelor
    de control care sunt competente să efectueze controale în ceea ce privește
    operatorii ecologici certificați, grupurile de operatori ecologici certificate
    și produsele ecologice din țări terțe, precum și anumite cerințe referitoare
    la supravegherea respectivelor autorități de control și organisme de control
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1686 z 30. júna 2023, ktorým
    sa mení delegované nariadenie (EÚ) 2021/1698, pokiaľ ide o určité procedurálne
    požiadavky na uznávanie štátnych inšpekčných organizácií a súkromných
    inšpekčných organizácií spôsobilých vykonávať kontroly certifikovaných
    prevádzkovateľov a skupín prevádzkovateľov ekologickej poľnohospodárskej
    výroby a produktov ekologickej poľnohospodárskej výroby v tretích krajinách
    a o určité požiadavky na dohľad nad nimi
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1686 z dne 30. junija 2023 o spremembi
    Delegirane uredbe (EU) 2021/1698 glede nekaterih postopkovnih zahtev za priznanje
    nadzornih organov in izvajalcev nadzora, pristojnih za izvajanje nadzora nad izvajalci
    dejavnosti in skupinami izvajalcev dejavnosti, ki so certificirani kot ekološki,
    ter nad ekološkimi proizvodi v tretjih državah, ter nekaterih zahtev za njihov
    nadzor
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1686 de la Comisión de 30 de junio de 2023
    que modifica el Reglamento Delegado (UE) 2021/1698 en lo que respecta a determinados
    requisitos de procedimiento para el reconocimiento de las autoridades de control
    y los organismos de control competentes para llevar a cabo controles de los operadores
    y grupos de operadores certificados ecológicos y de los productos ecológicos
    en terceros países, y a determinados requisitos sobre su supervisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1686 av den 30 juni 2023
    om ändring av delegerad förordning (EU) 2021/1698 vad gäller förfarandekrav
    för erkännande av kontrollmyndigheter och kontrollorgan som är behöriga att
    utföra kontroller av ekologiskt certifierade aktörer och aktörsgrupper och
    av ekologiska produkter i tredjeländer samt vissa krav på deras tillsyn
  type: main
