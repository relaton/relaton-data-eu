id: EURegulation6871975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 687/75 of the Commission of 14 March 1975 re-establishing
    the levying of customs duties on outer garments and clothing accessories, falling
    within subheading 60.05 A I, originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3048/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 687/75 de la Commission, du 14 mars 1975, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessus et accessoires du vêtement, de la sous-position tarifaire 60.05 A I,
    originaires du Mexique, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3048/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 687/75 der Kommission vom 14. März 1975 über die
    Wiedereinführung des Zollsatzes für Oberkleidung, Bekleidungszubehör und andere
    Wirkwaren, der Tarifstelle 60.05 A I, mit Ursprung in Mexiko, dem die in der Verordnung
    (EWG) Nr. 3048/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 687/75 af 14. marts 1975 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og tilbehør til
    beklædningsgenstande, under underposition 60.05 A I, som har oprindelse i Mexico
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3048/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 687/75 della Commissione, del 14 marzo 1975, che ripristina
    la riscossione dei dazi doganali applicabili agli indumenti esterni ed accessori
    di abbigliamento della sottovoce doganale n. 60.05 A I, originari del Messico,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3048/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 687/75 van de Commissie van 14 maart 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bovenkleding,
    kledingtoebehoren en andere artikelen, van onderverdeling 60.05 A I, van oorsprong
    uit Mexico, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3048/74 van de Raad van 2 december 1974
  type: main
