    σφαγίων προβάτων εντός της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 314/84 della Commissione del 1o febbraio 1984 recante
    quarta modifica del regolamento (CEE) n. 2657/80 relativo alla determinazione
    dei prezzi delle carcasse ovine, fresche o refrigerate, constatati sui mercati
    rappresentativi della Comunità e al rilevamento dei prezzi di talune altre qualità
    di carcasse ovine nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 314/84 van de Commissie van 1 februari 1984 houdende
    vierde wijziging van Verordening (EEG) nr. 2657/80 betreffende de vaststelling
    van de op de representatieve markten van de Gemeenschap geconstateerde prijzen
    voor geslachte schapen, vers of gekoeld, en betreffende de constatering van de
    prijzen voor sommige andere kwaliteiten geslachte schapen in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 314/84 da Comissão, de 1 de Fevereiro de 1984,
