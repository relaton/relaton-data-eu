  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1471/2001, annettu 16 päivänä heinäkuuta
    2001, välivaiheen tarkastelun päättämisestä sekä asetuksella (EY) N:o 423/97
    muun muassa Thaimaasta peräisin olevien sytytinkivellisten kaasukäyttöisten
    kertatäyttöisten taskusytyttimien tuonnissa käyttöön otetun lopullisen polkumyyntitullin
    muuttamisesta asianomaisen thaimaalaisen vientiä harjoittavan tuottajan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1471/2001 del Consiglio, del 16 luglio 2001, che chiude
    il riesame intermedio e modifica il dazio antidumping definitivo istituito con
    regolamento (CE) n. 423/97 sulle importazioni di accendini tascabili a pietra
    focaia e a gas, non ricaricabili, originari, tra l'altro, della Tailandia per
    quanto riguarda un produttore esportatore tailandese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1471/2001 van de Raad van 16 juli 2001 tot beëindiging
