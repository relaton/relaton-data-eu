title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1471/2001 of 16 July 2001 terminating the interim
    review and amending the definitive anti-dumping duty imposed by Regulation (EC)
    No 423/97 on imports of gas-fuelled non-refillable pocket flint lighters originating,
    inter alia, in Thailand insofar as a Thai exporting producer is concerned
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1471/2001 du Conseil du 16 juillet 2001 clôturant
    le réexamen intermédiaire et modifiant, en ce qui concerne le producteur-exportateur
    thaïlandais, le droit antidumping définitif institué par le règlement (CE)
    n° 423/97 sur les importations de briquets de poche avec pierre, à gaz, non
    rechargeables originaires, notamment, de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1471/2001 des Rates vom 16. Juli 2001 zur Einstellung
