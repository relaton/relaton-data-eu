  script: Latn
  content: '83/460/EEC: Commission Decision of 4 July 1983 laying down, for the purposes
    of the survey on the structure of agricultural holdings for 1983, the Community
    outline of a schedule of tables, the standard code and rules for the transcription
    on to magnetic tape of the data contained in those tables'
  type: main
- language: fr
  script: Latn
  content: '83/460/CEE: Décision de la Commission du 4 juillet 1983 fixant, en vue
    de l'' enquête sur la structure des exploitations agricoles pour 1983, le schéma
    communautaire d'' un programme de tableaux, le code uniforme et les modalités
    de transcription sur bande magnétique des données de ces tableaux'
  type: main
- language: de
  script: Latn
  content: '83/460/EWG: Entscheidung der Kommission vom 4. Juli 1983 zur Festlegung
    eines nach dem Gemeinschaftsschema erstellten Tabellenprogramms, eines einheitlichen
    Kodes sowie der Durchführungsbestimmungen für die Übertragung der Daten aus
    den genannten Tabellen auf Magnetbänder zum Zweck der Durchführung einer Erhebung
    über die Struktur der landwirtschaftlichen Betriebe 1983'
  type: main
- language: da
  script: Latn
  content: '83/460/EØF: Kommissionens beslutning af 4. juli 1983 om fastsættelse,
