    λεπτομερείς κανόνες εγγραφής σε μαγνητοταινία
    των στοιχείων που περιέχονται στους πίνακες
    αυτούς'
  type: main
- language: it
  script: Latn
  content: '83/460/CEE: Decisione della Commissione del 4 luglio 1983 che stabilisce,
