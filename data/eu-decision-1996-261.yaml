title:
- language: en
  script: Latn
  content: '96/261/EC: Commission Decision of 23 February 1996 allocating import quotas
    for the fully halogenated chlorofluorocarbons 11, 12, 113, 114 and 115, the other
    fully halogenated chlorofluorocarbons, halons, carbon tetrachloride, 1,1,1-trichloroethane
    and hydrobromofluorocarbons for the period 1 January to 31 December 1996. In addition
    allocating production and import quotas for methyl bromide for the period 1 January
    to 31 December 1996'
  type: main
- language: fr
  script: Latn
  content: '96/261/CE: Décision de la Commission, du 23 février 1996, fixant les
    quotas d''importation des chlorofluorocarbures entièrement halogénés 11, 12,
    113, 114 et 115, des autres chlorofluorocarbures entièrement halogénés, des
    halons, du tétrachlorure de carbone, du 1,1,1-trichloroéthane et des hydrobromofluorocarbures
    pour la période allant du 1er janvier au 31 décembre 1996, et fixant en outre
    les quotas de production et d''importation du bromure de méthyle pour la période
    allant du 1er janvier au 31 décembre 1996'
  type: main
- language: de
  script: Latn
  content: '96/261/EG: Entscheidung der Kommission vom 23. Februar 1996 zur Festsetzung
    von Quoten für vollhalogenierte Fluorchlorkohlenwasserstoffe 11, 12, 113, 114
    und 115, die übrigen vollhalogenierten Fluorchlorkohlenwasserstoffe, Halone,
    Tetrachlormethan, 1,1,1-Trichlorethan und teilhalogenierte Fluorbromkohlenwasserstoffe
    für den Zeitraum vom 1. Januar bis 31. Dezember 1996 sowie Produktions- und Einfuhrquoten
    für Methylbromid für die Zeit vom 1. Januar bis 31. Dezember 1996'
  type: main
- language: da
  script: Latn
  content: '96/261/EF: Kommissionens beslutning af 23. februar 1996 om tildeling af
    importkvoter for de fuldt halogenerede chlorfluorcarboner 11, 12, 113, 114 og
