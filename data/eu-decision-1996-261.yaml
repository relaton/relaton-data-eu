    1,1,1-trichlorethan og hydrobromfluorcarboner for perioden 1. januar til 31. december
    1996 og endvidere tildeling af produktions- og importkvoter for methylbromid for
    perioden 1. januar til 31. december 1996'
  type: main
- language: el
  script: Grek
