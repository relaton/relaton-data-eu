    για το διάστημα από 1ης Ιανουαρίου έως τις 31
    Δεκεμβρίου 1996'
  type: main
- language: fi
  script: Latn
  content: '96/261/EY: Komission päätös, tehty 23 päivänä helmikuuta 1996, tuontikiintiöiden
