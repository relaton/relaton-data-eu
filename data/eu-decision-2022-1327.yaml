  script: Latn
  content: Council Decision (EU) 2022/1327 of 26 July 2022 requesting the Commission
    to submit a study on the situation of the internal market of Union postal services,
    in particular regarding the application of Directive 97/67/EC of the European
    Parliament and of the Council, and a proposal, if appropriate, in view of the
    outcomes of the study
  type: main
- language: fr
  script: Latn
