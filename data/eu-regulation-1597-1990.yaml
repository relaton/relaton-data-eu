title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1597/90 of 14 June 1990 on the arrangement
    applicable to agricultural products subject to reference quantities and originating
    in the African, Caribbean and Pacific States or in the overseas countries and
    territories (1990/91)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1597/90 de la Commission du 14 juin 1990 concernant
    la procédure à appliquer à certains produits agricoles, soumis à quantités
    de référence, originaires des États d'Afrique, des Caraïbes et du Pacifique
    ou des pays et territoires d'outre-mer (1990/1991)
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1597/90 DER KOMMISSION vom 14. Juni 1990 ueber das
    Verfahren, das auf bestimmte landwirtschaftliche Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP) oder in den ueberseeischen
    Laendern und Gebieten (UeLG), die Referenzmengen unterworfen sind, anzuwenden
    ist (1990/91)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1597/90 af 14. juni 1990 om den ordning,
    der skal gælde for visse landbrugsprodukter, som er undergivet en referencemængde,
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier (1990/91)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1597/90 της Επιτροπής
    της 14ης Ιουνίου 1990 σχετικά με τη διαδικασία
    που θα εφαρμόζεται σε ορισμένα αγροτικά προϊόντα
    που υπόκεινται σε ποσότητες αναφοράς, καταγωγής
    των κρατών της Αφρικής, της Καραϊβικής και
    του Ειρηνικού ( ΑΚΕ ) ή των υπερποντίων χωρών
    και εδαφών ( ΥΧΕ ) ( 1990/91 )
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1597/90 DELLA COMMISSIONE del 14 giugno 1990 relativo
    alla procedura applicabile a determinati prodotti agricoli, sottoposti a delle
    quantità di riferimento, originari dei paesi d'Africa, dei Caraibi e del Pacifico
    (ACP) o dei paesi e territori d'oltremare (PTOM) (1990/1991)
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1597/90 VAN DE COMMISSIE van 14 juni 1990 betreffende
    de toe te passen procedure voor bepaalde landbouwprodukten, waarvoor een referentiehoeveelheid
    is vastgesteld, van oorsprong uit de Staten in Afrika, het Caribische gebied en
    de Stille Oceaan (ACP) of uit de landen en gebieden overzee (LGO) (1990/1991)
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1597/90 DA COMISSAO de 14 de Junho de 1990 relativo
    ao procedimento aplicavel a certos produtos agricolas sujeitos a quantidades de
    referência e originarios dos Estados de Africa, das Caraibas e do Pacifico ou
    dos paises e territorios ultramarinos (1990/1991)
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1597/90 DE LA COMISION de 14 de junio de 1990 relativo
    al procedimiento a aplicar para determinados productos agricolas, sometidos a
    cantidades de referencia y originarios de los Estados de Africa, del Caribe y
    del Pacifico (ACP) o de los paises y territorios de Ultramar (PTU) (1990/91)
  type: main
