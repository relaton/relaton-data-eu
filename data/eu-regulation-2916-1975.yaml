title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2916/75 of the Council of 5 November 1975 extending
    for the fourth time Regulations (EEC) No 2313/71 and (EEC) No 2823/71 partially
    and temporarily suspending Common Customs Tariff duties applicable to wines originating
    in and coming from Algeria, Morocco, Tunisia and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2916/75 du Conseil, du 5 novembre 1975, prorogeant
    pour la quatrième fois les règlements (CEE) n° 2313/71 et n 2823/71 portant
    suspension temporaire partielle des droits du tarif douanier commun applicables
    aux vins originaires et en provenance de l'Algérie, du Maroc, de la Tunisie et
    de la Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2916/75 des Rates vom 5. November 1975 zur vierten
    Verlängerung der Verordnungen (EWG) Nr. 2313/71 und Nr. 2823/71 über die zeitweilige
    teilweise Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Wein mit Ursprung
    in und Herkunft aus Algerien, Marokko, Tunesien und der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2916/75 af 5. november 1975 om den fjerde
    forlængelse af forordning (EØF) nr. 2313/71 og (EØF) nr. 2823/71 om midlertidig
    og delvis suspension af satserne i den fælles toldtarif for vin, der har oprindelse
    i og kommer fra Algeriet, Marokko, Tunesien og Tyrkiet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2916/75 del Consiglio, del 5 novembre 1975, che proroga
    per la quarta volta i regolamenti (CEE) n. 2313/71 e n. 2823/71, recanti sospensione
    temporanea parziale dei dazi della tariffa doganale comune applicabili ai vini
    originari e provenienti dall'Algeria, dal Marocco, dalla Tunisia e dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2916/75 van de Raad van 5 november 1975 houdende
    vierde verlenging van de Verordeningen (EEG) nr. 2313/71 en nr. 2823/71 houdende
    tijdelijke gedeeltelijke schorsing van de rechten van het gemeenschappelijk douanetarief
    voor wijn van oorsprong en herkomst uit Algerië, Marokko, Tunesië en Turkije
  type: main
