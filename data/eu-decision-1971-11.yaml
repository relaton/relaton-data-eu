title:
- language: en
  script: Latn
  content: '71/11/EEC: Commission Decision of 7 December 1970 amending the decision
    of 3 June 1970, authorizing the grand-duchy of Luxembourg to approve, for marketing
    purposes, seed of pseutotsuga menziesii ( mirb. ) franco and of picea sitchensis
    trautv. and mey., satisfying less stringent requirements (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '71/11/CEE: Décision de la commission, du 7 décembre 1970, modifiant
    la décision du 3 juin 1970, autorisant le grand-duché de Luxembourg a admettre,
    a la commercialisation, des semences de pseutotsuga menziesii (mirb.) franco et
    de picea sitchensis trautv. et mey., soumises a des exigences réduites (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '71/11/EWG: Entscheidung der Kommission vom 7. Dezember 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der das grossherzogtum Luxemburg ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco und von picea sitchensis
    trautv. und mey. mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: it
  script: Latn
  content: '71/11/CEE: decisione della commissione, del 7 dicembre 1970, che modifica
    la decisione del 3 giugno 1970 che autorizza il granducato del Lussemburgo ad
    ammettere alla commercializzazione le sementi di pseudotsuga menziesii ( mirb.
    ) franco e di picea sitchensis trautv. e mey., sottoposte a requisiti ridotti
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '71/11/EEG: beschikking van de commissie van 7 december 1970 houdende wijziging
    van de beschikking van 3 juni 1970 waarbij het groothertogdom Luxemburg gemachtigd
    wordt om zaden, waaraan minder strenge eisen zijn gesteld, van pseudotsuga menziesii
    ( mirb. ) franco en picea sitchensis trautv. en mey in de handel toe te laten
    ( slechts de tekst in de Franse taal is authentiek )'
