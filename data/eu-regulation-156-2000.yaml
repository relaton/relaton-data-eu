    de determinados produtos do sector da carne de suíno apresentados em Janeiro
    de 2000 ao abrigo do regime previsto no acordo concluído pela Comunidade com
    a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 156/2000 de la Comisión, de 24 de enero de 2000, por
