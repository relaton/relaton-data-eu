title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 156/2000 of 24 January 2000 determining the
    extent to which applications lodged in January 2000 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 156/2000 de la Commission, du 24 janvier 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2000 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 156/2000 der Kommission vom 24. Januar 2000 über die
    Festsetzung des Umfangs, in dem die im Januar 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 156/2000 af 24. januar 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    2000 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 156/2000 της Επιτροπής,
    της 24ης Ιανουαρίου 2000, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Ιανουάριο
    2000 για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τη
    συμφωνία που συνήψε η Κοινότητα με τη Σλοβενία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 156/2000, annettu 24 päivänä tammikuuta 2000,
    yhteisön Slovenian kanssa tekemässä sopimuksessa määrätyn järjestelmän
    mukaisesti tammikuussa 2000 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 156/2000 della Commissione, del 24 gennaio 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 2000 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 156/2000 van de Commissie van 24 januari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in januari
    2000 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomst met Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 156/2000 da Comissão, de 24 de Janeiro de 2000,
