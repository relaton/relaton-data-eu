title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2770/74 of the Commission of 30 October 1974 re-establishing
    the levying of the customs duties on building board, falling within heading No
    48.09, originating in Brazil, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2770/74 de la Commission, du 30 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux plaques
    pour constructions, de la position tarifaire 48.09, originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2770/74 der Kommission vom 30. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Bauplatten aus Papierhalbstoff, der Tarifnummer 48.09, mit
    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates vom
    18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2770/74 af 30. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for byggeplader af papirmasse under position 48.09,
    som har oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2770/74 della Commissione, del 30 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle lastre per costruzioni
    della voce doganale n. 48.09 originarie del Brasile beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre
    1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2770/74 van de Commissie van 30 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op platen voor
    constructiedoeleinden, van post 48.09, van oorsprong uit Brazilië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene
    tariefpreferenties werden geopend
  type: main
