    arhitecturii, inclusiv a măsurilor destinate să faciliteze exercitarea efectivă
    a dreptului de stabilire și a libertății de a presta servicii
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 10. júna 1985 o vzájomnom uznávaní diplomov, osvedčení
