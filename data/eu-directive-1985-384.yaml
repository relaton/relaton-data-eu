    storitev
  type: main
- language: es
  script: Latn
  content: Directiva 85/384/CEE del Consejo, de 10 de junio de 1985, para el reconocimiento
    mutuo de diplomas, certificados y otros títulos en el sector de la arquitectura,
    y que incluye medidas destinadas a facilitar el ejercicio efectivo del derecho
    de establecimiento y de la libre prestación de servicios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 85/384/EEG av den 10 juni 1985 om det ömsesidiga erkännandet
