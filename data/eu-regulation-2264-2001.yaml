title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2264/2001 of 21 November 2001 introducing certain
    temporary autonomous concessions in the form of Community tariff quotas applicable
    to imports into the Community of tomatoes originating in the Kingdom of Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2264/2001 du Conseil du 21 novembre 2001 établissant
    certaines concessions autonomes et transitoires sous forme de contingents tarifaires
    communautaires applicables à l'importation dans la Communauté de tomates originaires
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2264/2001 des Rates vom 21. November 2001 über vorübergehende
    autonome Zugeständnisse in Form von gemeinschaftlichen Zollkontingenten für
    die Einfuhr von Tomaten mit Ursprung im Königreich Marokko in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2264/2001 af 21. november 2001 om midlertidige
    autonome indrømmelser i form af fællesskabstoldkontingenter for import i Fællesskabet
    af tomater med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2264/2001 του Συμβουλίου,
    της 21ης Νοεμβρίου 2001, για τον καθορισμό ορισμένων
    αυτόνομων και μεταβατικών παραχωρήσεων υπό
    μορφήν κοινοτικών δασμολογικών ποσοστώσεων
    που εφαρμόζονται κατά την εισαγωγή στην Κοινότητα
    ντομάτας, καταγωγής Μαρόκου
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2264/2001, annettu 21 päivänä marraskuuta
    2001, Marokosta peräisin olevien tomaattien tuonnissa yhteisöön tariffikiintiöiden
    muodossa sovellettavista tietyistä yksipuolisista siirtymäkauden myönnytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2264/2001 del Consiglio, del 21 novembre 2001, che
    stabilisce talune concessioni autonome e transitorie sotto forma di contingenti
    tariffari comunitari applicabili all'importazione nella Comunità di pomodori
    originari del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2264/2001 van de Raad van 21 november 2001 tot vaststelling
    van autonome overgangsconcessies in de vorm van communautaire tariefcontingenten
    voor de invoer van tomaten van oorsprong uit Marokko in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2264/2001 do Conselho, de 21 de Novembro de 2001,
    que estabelece certas concessões autónomas e transitórias sob a forma de contingentes
    pautais comunitários aplicáveis à importação para a Comunidade de tomate
    originário de Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2264/2001 del Consejo, de 21 de noviembre de 2001,
    por el que se establecen determinadas concesiones autónomas y transitorias en
    forma de contingentes arancelarios comunitarios aplicables a la importación en
    la Comunidad de tomates originarios de Marruecos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2264/2001 av den 21 november 2001 om upprättande
    av vissa autonoma och tillfälliga medgivanden i form av gemenskapstullkvoter
    som skall tillämpas på import till gemenskapen av tomater med ursprung i Marocko
  type: main
