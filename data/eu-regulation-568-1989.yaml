title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 568/89 of 3 March 1989 amending Regulation
    (EEC) No 649/86 adopting the list of wines produced in Portugal falling within
    heading No 22.05 of the common customs tariff that are to be treated as quality
    wines produced in specified regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 568/89 de la Commission du 3 mars 1989 modifiant le
    règlement (CEE) n° 649/86 arrêtant la liste des vins produits au Portugal assimilés
    aux vins de qualité produits dans des régions déterminées relevant de la position
    22.05 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 568/89 DER KOMMISSION vom 3. Maerz 1989 zur Aenderung
    der Verordnung (EWG) Nr. 649/86 zur Festlegung des Verzeichnisses der in Portugal
    erzeugten und den Qualitaetsweinen bestimmter Anbaugebiete gleichgestellten Weine
    der Tarifnummer 22.05 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 568/89 af 3. marts 1989 om ændring
    af forordning (EØF) nr. 649/86 om fastsættelse af listen over de i Portugal
    fremstillede vine, der sidestilles med kvalitetsvine fra bestemte dyrkningsområder,
    henhørende under pos. 22.05 i Den Fælles Toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 568/89 της Επιτροπής
    της 3ης μαρτίου 1989 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 649/86 που θεσπίζει τον κατάλογο των
    οίνων που παράγονται στην Πορτογαλία οι οποίοι
    εξομοιούνται με οίνους ποιότητας που παράγονται
    σε καθορισμένες περιοχές που υπάγονται στην
    κλάση 22.05 του κοινού δασμολογίου
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 568/89 DELLA COMMISSIONE del 3 marzo 1989 che modifica
    il regolamento (CEE) n. 649/86 che stabilisce l'elenco dei vini prodotti in Portogallo
    assimilati ai vini di qualità prodotti in regioni determinate di cui alla voce
    22.05 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 568/89 VAN DE COMMISSIE van 3 maart 1989 tot wijziging
    van Verordening (EEG) nr. 649/86 tot vaststelling van de lijst van in Portugal
    voortgebrachte wijnen die met v.q.p.r.d.-wijn van post 22.05 van het gemeenschappelijk
    douanetarief gelijkgesteld worden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 568/89 DA COMISSAO de 3 de Março de 1989 que altera
    o Regulamento (CEE) nº 649/86 que adopta a lista dos vinhos produzidos em Portugal
    equiparados aos vinhos de qualidade produzidos em regiões determinadas, incluídos
    na posição 22.05 da Pauta Aduaneira Comum
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 568/89 DE LA COMISION de 3 de marzo de 1989 por el
    que se modifica el Reglamento (CEE) no 649/86 por el que se adopta la lista de
    vinos producidos en Portugal asimilados a los vinos de calidad producidos en regiones
    determinadas, incluidos en la partida no 22.05 del arancel aduanero comun
  type: main
