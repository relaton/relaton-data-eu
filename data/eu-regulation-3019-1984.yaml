title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3019/84 of 29 October 1984 determining the
    extent to which applications lodged in October 1984 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3019/84 de la Commission, du 29 octobre 1984, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1984 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/84 der Kommission vom 29. Oktober 1984 über
    den Umfang, in dem den im Monat Oktober 1984 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3019/84 af 29. oktober 1984 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i oktober måned 1984, for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3019/84 της Επιτροπής
    της 29ης Οκτωβρίου 1984 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1984, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3019/84 della Commissione, del 29 ottobre 1984, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1984 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3019/84 van de Commissie van 29 oktober 1984 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand oktober
    1984 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
