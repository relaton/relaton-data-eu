    uit de Filippijnen en Thailand, waarvoor de in Verordening (EEG) nr. 3924/86 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1657/87 da Comissão de 12 de Junho de 1987 que
