title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1657/87 of 12 June 1987 re-establishing
    the levying of customs duties applicable to other footwear, falling within subheading
    64.02 B, originating in the Philippines and Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1657/87 de la Commission du 12 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux autres chaussures, de la
    sous-position 64.02 B du tarif douanier commun, originaires des Philippines et
    de la Thaïlande, bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1657/87 der Kommission vom 12. Juni 1987 zur Wiedereinführung
    der Erhebung der Zölle für andere Schuhe der Tarifstelle 64.02 B des Gemeinsamen
    Zolltarifs mit Ursprung in den Philippinen und Thailand, denen die in der Verordnung
    (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1657/87 af 12 juni 1987 om genindførelse
    af opkrævning af told for andet fodtøj, henhørende under 64.02 B og med oprindelse
    i Filippinerne og Thailand, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1657/87 της Επιτροπής
