    64.02 B della tariffa doganale comune originarie delle Filippine beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1657/87 van de Commissie van 12 juni 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander schoeisel,
