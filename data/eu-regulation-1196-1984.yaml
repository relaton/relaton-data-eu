title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1196/84 of 30 April 1984 re-establishing
    the levying of customs duties on certain men' s and boys' woven suits, of wool,
    of cotton or of man-made textile fibres, products of category 16 (code 0160),
    originating in Thailand, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1196/84 de la Commission du 30 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certains costumes, complets
    et ensembles tissés, de laine, de coton ou de fibres textiles synthétiques ou
    artificielles, de la catégorie 16 (code 0160), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1196/84 der Kommission vom 30. April 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Anzüge und Kombinationen, aus
    Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Warenkategorie
    Nr. 16 (Kennziffer 0160) mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1196/84 af 30. april 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte jakkesæt, vævede, til mænd og drenge,
    af uld, bomuld eller kemofibre, under varekategori nr. 16 (kode 0160), som har
    oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1196/84 της Επιτροπής
    της 30ής Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    κοστούμια και σύνολα, υφασμένα, εξ ερίου, εκ
    βάμβακος ή εκ συνθετικών ή τεχνητών υφαντικών
    ινών, προϊόντα της κατηγορίας 16 (κωδικός 0160),
    καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1196/84 della Commissione del 30 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili a taluni vestiti e completi, tessuti,
    per uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche, della
    categoria di prodotti n. 16 (codice 0160), originari della Tailandia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1196/84 van de Commissie van 30 april 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sommige
    kostuums, geweven, van wol, van katoen of van synthetische of van kunstmatige
    textielvezels, van de categorie van produkten nr. 16 (codenummer 0160), van oorsprong
    uit Thailand, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3570/83 van de Raad
  type: main
