- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1041/79 of 23 May 1979 amending the list
    of countries and products annexed to Regulation (EEC) No 1251/78 making the import
    of certain textile products from certain third countries subject to Community
    surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1041/79 de la Commission, du 23 mai 1979, portant
    modification de la liste des pays et des produits annexée au règlement (CEE)
    n° 1251/78 soumettant à un régime de surveillance communautaire les importations
    de certains produits textiles originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1041/79 der Kommission vom 23. Mai 1979 zur Änderung
    der Liste der Länder und Waren im Anhang der Verordnung (EWG) Nr. 1251/78, mit
    der die Einfuhr bestimmter Textilwaren aus bestimmten Drittländern einer Gemeinschaftsüberwachung
    unterworfen wurde
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF nr. 1041/79 af 23. maj 1979 om ændring
    af den liste over lande og varer, der er knyttet som bilag til forordning (EØF)
    nr. 1251/78 om indførelse af fællesskabstilsyn med indførselen af visse tekstilvarer
    fra en række tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1041/79 della Commissione, del 23 maggio 1979, che
    modifica l' elenco di paesi e prodotti allegato al regolamento (CEE) n. 1251/78
    che sottopone a sorveglianza comunitaria le importazioni di taluni prodotti tessili
    originari di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1041/79 van de Commissie van 23 mei 1979 tot wijziging
