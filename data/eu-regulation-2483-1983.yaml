id: EURegulation24831983
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2483/83 of 30 August 1983 revoking the protective
    measures on certain beach slippers originating in China, instituting a system
    of import authorizations in France for such products and certain slippers and
    other indoor footwear originating in that country and terminating the Community
    investigation in respect of imports of the products falling within Common Customs
    Tariff heading No ex 64.04
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2483/83 de la Commission du 30 août 1983 abrogeant
    les mesures de protection applicables à certaines espadrilles, originaires de
    Chine, instituant un régime d' autorisations d' importation en France pour ces
    mêmes produits et certaines pantoufles et chaussures d' intérieur, originaires
    de ce même pays tiers, et clôturant l' enquête communautaire relative à l'
    importation de produits de la position ex 64.04 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2483/83 der Kommission vom 30. August 1983 zur Aufhebung
    der auf bestimmte Schuhe des Typs ,,Espadrilles' ' mit Ursprung in China anwendbaren
    Schutzmaßnahmen, zur Einführung in Frankreich von Einfuhrregelungen für die
    genannten Waren sowie für bestimmte Pantoffeln und Hausschuhe mit Ursprung in
    dem genannten Drittland und zum Abschluß des gemeinschaftlichen Untersuchungsverfahrens
    betreffend die Einfuhr der Waren der Tarifstelle ex 64.04 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2483/83 af 30. august 1983 om ophævelse
    af beskyttelsesforanstaltningerne for visse strandsandaler med oprindelse i Kina,
    om indførelse af en importbevillingsordning i Frankrig for samme varer og visse
    typer hjemmefodtøj med oprindelse i dette tredjeland samt om afslutning af fællesskabsundersøgelsen
    vedrørende importen af varer, henhørende under pos. ex 64.04 i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2483/83 της Επιτροπής
    της 30ής Αυγούστου 1983 περί καταργήσεως των μέτρων
    προστασίας που εφαρμόζονται σε ορισμένα υποδήματα
    με εξωτερικό πέλμα από σκοινί καταγωγής Κίνας,
    περί θεσπίσεως ενός καθεστώτος εγκρίσεων εισαγωγής
    στη Γαλλία για τα ίδια προϊόντα και ορισμένες
    παντόφλες και έτερα υποδήματα δωματίου καταγωγής
    της τρίτης αυτής χώρας, και περί περατώσεως
    της κοινοτικής έρευνας σχετικά με την εισαγωγή
    των προϊόντων της κλάσης ex 64.04 του Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2483/83 della Commissione del 30 agosto 1983 che abroga
    i provvedimenti di salvaguardia applicabili ad alcune scarpe di tela o di sparto
    originarie della Cina, che istituisce un regime di autorizzazione in Francia all'
    importazione per gli stessi prodotti e per alcune pantofole ed altre calzature
    da camera originarie dello stesso paese terzo e che conclude l' indagine comunitaria
    relativa all' importazione dei prodotti di cui alla voce ex 64.04 della tariffa
    doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2483/83 van de Commissie van 30 augustus 1983 houdende
    afschaffing van de beschermende maatregelen die van toepassing zijn op bepaalde
    strandschoenen van oorsprong uit China, instelling van een stelsel van invoervergunningen
    in Frankrijk voor deze produkten en voor bepaalde pantoffels en huisschoeisel
    van oorsprong uit dit derde land en sluiting van het communautaire onderzoek inzake
    de invoer van de produkten van post ex 64.04 van het gemeenschappelijk douanetarief
  type: main
