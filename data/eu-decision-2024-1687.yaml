    (OTIF) in Bezug auf die Überarbeitung der einheitlichen technischen Vorschriften
    für das Teilsystem „Fahrzeuge — Güterwagen“, das Teilsystem „Fahrzeuge
    — Lärm“, die Zugbildung und Prüfung der Streckenkompatibilität sowie das
    Teilsystem „Telematikanwendungen für den Güterverkehr“ zu vertretenden Standpunkt
