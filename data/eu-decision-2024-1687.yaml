    d’experts techniques de l’Organisation intergouvernementale pour les transports
    internationaux ferroviaires (OTIF) en ce qui concerne la révision des prescriptions
    techniques uniformes applicables au sous-système «Matériel roulant — Wagons
    de marchandises», au sous-système «Matériel roulant — Bruit», à la composition
    des trains et à la vérification de la compatibilité avec l’itinéraire ainsi
    qu’au sous-système «Applications télématiques au service du fret»
