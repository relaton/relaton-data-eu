  content: Council Decision (EU) 2024/1687 of 10 June 2024 on the position to be taken
    on behalf of the European Union at the 16th session of the Committee of Technical
    Experts of the Intergovernmental Organisation for International Carriage by Rail
    (OTIF) as regards the revision of the Uniform Technical Prescription applicable
    to the subsystem ‘rolling stock – freight wagons’, to the subsystem ‘rolling
    stock – noise’, to train composition and route compatibility checks, as well
    as to the subsystem ‘telematics applications for freight services’
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/1687 du Conseil du 10 juin 2024 relative à la position
