    za uvozna dovoljenja za banane s poreklom iz držav AKP za obdobje do 31. decembra
    2007
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 47/2007 de la Comisión, de 19 de enero de 2007 , que
    modifica el Reglamento (CE) n o 34/2007 por el que se fijan los coeficientes de
    asignación aplicables a las solicitudes de certificados de importación de plátanos
    originarios de los países ACP hasta el 31 de diciembre de 2007
  type: main
- language: sv
  script: Latn
