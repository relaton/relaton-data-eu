    uplatniteľný na žiadosti o dovozné povolenia na banány s pôvodom v krajinách
    AKT na obdobie do 31. decembra 2007
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 47/2007 z dne 19. januarja 2007 o spremembi Uredbe
