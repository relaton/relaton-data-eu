    gruodžio 31 d.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 47/2007 van de Commissie van 19 januari 2007 tot wijziging
    van Verordening (EG) nr. 34/2007 houdende vaststelling van de toewijzingscoëfficiënt
    die moet worden toegepast op de aanvragen van certificaten voor de invoer van
    bananen van oorsprong uit de ACS-landen voor het tijdvak tot en met 31 december
    2007
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 47/2007 z dnia 19 stycznia 2007 r. zmieniające
    rozporządzenie (WE) nr 34/2007 ustalające współczynnik przydziału, jaki należy
    zastosować do wniosków o pozwolenie na przywóz bananów pochodzących z krajów
    AKP na okres do dnia 31 grudnia 2007 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 47/2007 da Comissão, de 19 de Janeiro de 2007 ,
    que altera o Regulamento (CE) n. o 34/2007 que fixa o coeficiente de atribuição
    a aplicar aos pedidos de certificado de importação de bananas originárias dos
    países ACP para o período que decorre até 31 de Dezembro de 2007
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 47/2007 al Comisiei din 19 ianuarie 2007 de modificare
    a Regulamentului (CE) nr. 34/2007 de stabilire a coeficientului de atribuire care
    urmează să fie aplicat cererilor pentru licențe de import pentru banane originare
    din țările ACP, pentru perioada până la 31 decembrie 2007
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 47/2007 z 19. januára 2007 , ktorým sa mení
