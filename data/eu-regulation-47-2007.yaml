title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 47/2007 of 19 January 2007 amending Regulation
    (EC) No 34/2007 fixing the allocation coefficient to be applied to applications
    for import licences for bananas originating in the ACP countries for the period
    to 31 December 2007
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 47/2007 de la Commission du 19 janvier 2007 modifiant
    le règlement (CE) n o 34/2007 fixant le coefficient d’attribution à appliquer
    aux demandes de certificats d’importation de bananes originaires des pays ACP
    pour la période allant jusqu’au 31 décembre 2007
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 47/2007 der Kommission vom 19. Januar 2007 zur Änderung
    der Verordnung (EG) Nr. 34/2007 zur Festsetzung des Zuteilungskoeffizienten, der
    für die Zeit bis zum 31. Dezember 2007 auf die Lizenzanträge für die Einfuhr
    von Bananen mit Ursprung in den AKP-Staaten anzuwenden ist
  type: main
- language: bg
  script: Cyrl
