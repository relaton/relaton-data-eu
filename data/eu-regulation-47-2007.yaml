    na žádosti o dovozní licence pro banány pocházející ze zemí AKT pro období
    do 31. prosince 2007
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 47/2007 af 19. januar 2007 om ændring
    af forordning (EF) nr. 34/2007 om fastsættelse af den tildelingskoefficient,
    der skal anvendes på importlicensansøgninger for bananer med oprindelse i AVS-landene
    for perioden til den 31. december 2007
  type: main
- language: el
  script: Grek
