title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1976 amending Decision 73/30/EEC authorizing
    the Federal Republic of Germany to apply special health guarantees for the prevention
    of leucosis in the case of bovine animals imported for breeding or production
  type: main
- language: fr
  script: Latn
  content: '77/58/CEE: Décision de la Commission, du 22 décembre 1976, modifiant
    la décision 73/30/CEE autorisant la République fédérale d''Allemagne à appliquer
    des garanties sanitaires particulières relatives à la lutte contre la leucose
    en cas d''introduction sur son territoire de bovins d''élevage ou de rente'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1976 zur Änderung der Entscheidung
    73/30/EWG, mit der die Bundesrepublik Deutschland ermächtigt wird, beim Verbringen
    von Zucht- und Nutzrindern in ihr Hoheitsgebiet zur Bekämpfung der Leukose besondere
    gesundheitspolizeiliche Garantien anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1976 om ændring af beslutning
    73/30/ EØF om bemyndigelse af Forbundsrepublikken Tyskland til ved indbringelse
    på dens område af avls- eller brugskvæg at anvende særlige sundhedsmæssige
    garantier med henblik på bekæmpelse af leukose
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1976, recante modifica della
    decisione 73/30/CEE, che autorizza la Repubblica federale di Germania ad applicare
    speciali garanzie sanitarie all'introduzione di bovini da allevamento e da produzione
    nel proprio territorio, con riferimento alla lotta contro la leucosi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1976 tot wijziging van Beschikking
    73/30/EEG waarbij de Bondsrepubliek Duitsland wordt gemachtigd om bij invoer van
    fok- en gebruiksrunderen bijzondere gezondheidsgaranties in het kader van de leukosebestrijding
    toe te passen
  type: main
