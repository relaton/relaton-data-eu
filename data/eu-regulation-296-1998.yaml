title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 296/98 of 4 February 1998 determining to
    what extent applications for import rights for calves not exceeding 80 kilograms
    lodged pursuant to Regulation (EC) No 2542/97 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 296/98 DE LA COMMISSION du 4 février 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au titre du règlement (CE) n° 2542/97 relatif à l'importation de
    veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 296/98 DER KOMMISSION vom 4. Februar 1998 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte von höchstens 80 kg wiegenden
    Rindern gemäß der Verordnung (EG) Nr. 2542/97 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 296/98 af 4. februar 1998 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importrettigheder for
    kalve på ikke over 80 kg i henhold til forordning (EF) nr. 2542/97 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 296/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 4ης Φεβρουαρίου 1998 για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως δικαιωμάτων εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 2542/97 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 296/98, annettu 4 päivänä helmikuuta 1998,
    asetuksen (EY) N:o 2542/97 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 296/98 DELLA COMMISSIONE del 4 febbraio 1998 che stabilisce
    in che misura possono essere accolte le domande di diritti di importazione presentate
    nel quadro del regolamento (CE) n. 2542/97 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 296/98 VAN DE COMMISSIE van 4 februari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten tot invoer
    die zijn ingediend op grond van Verordening (EG) nr. 2542/97 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 296/98 DA COMISSÃO de 4 de Fevereiro de 1998 que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 2542/97 relativo à importação
    de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 296/98 DE LA COMISIÓN de 4 de febrero de 1998 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de derechos
    de importación presentadas con arreglo al Reglamento (CE) n° 2542/97 relativo
    a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 296/98 av den 4 februari 1998 om fastställande
    av i vilken utsträckning ansökningar om importrättigheter som lämnats in i
    enlighet med förordning (EG) nr 2542/97 angående import av kalvar som väger
    högst 80 kg kan godkännas
