    na základe stabilizačného mechanizmu pre banány v rámci Dohody o obchode
    medzi Európskou úniou a jej členskými štátmi na jednej strane a Kolumbiou
    a Peru na strane druhej nie je vhodné pre dovoz banánov s pôvodom v Peru za
    rok 2014'
  type: main
- language: sl
  script: Latn
  content: '2014/926/EU: Izvedbeni sklep Komisije z dne 17. decembra 2014 o ugotovitvi,
