    Colômbia e o Peru, por outro lado, não é adequada para as importações de
    bananas originárias do Peru no ano de 2014'
  type: main
- language: ro
  script: Latn
  content: '2014/926/UE: Decizia de punere în aplicare a Comisiei din 17 decembrie
