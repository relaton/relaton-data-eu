title:
- language: en
  script: Latn
  content: '2014/926/EU: Commission Implementing Decision of 17 December 2014 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Trade Agreement between the European
    Union and its Member States, of the one part, and Colombia and Peru, of the other
    part, is not appropriate for imports of bananas originating in Peru for the year
    2014'
  type: main
- language: fr
  script: Latn
  content: '2014/926/UE: Décision d''exécution de la Commission du 17 décembre
    2014 déterminant que la suspension temporaire du droit de douane préférentiel
    établi au titre du mécanisme de stabilisation pour les bananes prévu par l''accord
    commercial entre l''Union européenne et ses États membres, d''une part, et la
    Colombie et le Pérou, d''autre part, n''est pas appropriée dans le cas des importations
    de bananes originaires du Pérou pour l''année 2014'
  type: main
- language: de
  script: Latn
  content: '2014/926/EU: Durchführungsbeschluss der Kommission vom 17. Dezember 2014
    zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls, der
    im Rahmen des Stabilisierungsmechanismus für Bananen des Handelsübereinkommens
    zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits und Kolumbien
    und Peru andererseits festgesetzt wurde, für Einfuhren von Bananen mit Ursprung
    in Peru für das Jahr 2014 nicht angemessen ist'
  type: main
- language: bg
  script: Cyrl
  content: '2014/926/ЕС: Решение за изпълнение на Комисията
    от 17 декември 2014 година за определяне на временното
    спиране на прилагането на преференциалното
    мито, установено по силата на механизма за
    стабилизиране по отношение на бананите от
    Споразумението за търговия между Европейския
    съюз и неговите държави членки, от една страна,
    и Колумбия и Перу, от друга страна, за нецелесъобразно
    по отношение на вноса на банани с произход
    от Перу за 2014 година'
  type: main
- language: cs
  script: Latn
