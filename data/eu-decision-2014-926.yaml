    una parte, y Colombia y el Perú, por otra, no es apropiada para las importaciones
    de plátanos (bananas) originarios del Perú para el año 2014'
  type: main
- language: sv
  script: Latn
  content: '2014/926/EU: Kommissionens genomförandebeslut av den 17 december 2014
    om fastställande av att det tillfälliga upphävandet av förmånstullarna enligt
