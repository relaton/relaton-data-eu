  content: Commission Regulation (EEC) No 582/92 of 6 March 1992 laying down detailed
    rules for the application, in respect of potato starch, of the import arrangements
    provided for in the Interim Agreement concluded between the European Economic
    Community and the European Coal and Steel Community, on the one hand, and the
    Republic of Poland, on the other
  type: main
- language: fr
  script: Latn
