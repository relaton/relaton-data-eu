title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/258 of 13 February 2017 concerning
    revised performance targets and appropriate measures included in the national
    or functional airspace block plan submitted by Switzerland pursuant to Regulation
    (EC) No 549/2004 of the European Parliament and of the Council that are not adequate
    in respect to the Union-wide performance targets for the second reference period
    and setting out obligations for corrective measures (notified under document C(2017)
    728)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/258 de la Commission du 13 février 2017
    concernant les objectifs de performance révisés et les mesures utiles qui figurent
    dans le plan national ou le plan au niveau du bloc d'espace aérien fonctionnel
    présenté par la Suisse conformément au règlement (CE) n° 549/2004 du Parlement
    européen et du Conseil et qui ne satisfont pas aux objectifs de performance de
    l'Union pour la deuxième période de référence et définissant des obligations
    en matière de mesures correctrices [notifiée sous le numéro C(2017) 728]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/258 der Kommission vom 13. Februar 2017
    bezüglich der überarbeiteten Leistungsziele und angemessenen Maßnahmen in den
    von der Schweiz gemäß der Verordnung (EG) Nr. 549/2004 des Europäischen Parlaments
    und des Rates vorgelegten nationalen Plänen oder Plänen für funktionale Luftraumblöcke,
    die nicht mit den unionsweit geltenden Leistungszielen für den zweiten Bezugszeitraum
    vereinbar sind, sowie Verpflichtungen zur Ergreifung von Behebungsmaßnahmen (Bekannt
    gegeben unter Aktenzeichen C(2017) 728)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/258 на Комисията
    от 13 февруари 2017 година относно някои преразгледани
    цели за ефективност и подходящи мерки, включени
    в националния план или плана за функционалните
    блокове въздушно пространство, представен
    от Швейцария съгласно Регламент (ЕО) № 549/2004
    на Европейския парламент и на Съвета, които
    не са адекватни по отношение на валидните за
    целия Европейски съюз цели за ефективност,
    отнасящи се за втория референтен период, както
    и определяне на задължения за коригиращи мерки
    (нотифицирано под номер С(2017) 728)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/258 ze dne 13. února 2017, které
    se týká revidovaných výkonnostních cílů a příslušných opatření zahrnutých
    do vnitrostátního plánu či plánu funkčních bloků vzdušného prostoru
    předloženého Švýcarskem podle nařízení Evropského parlamentu a Rady (ES)
    č. 549/2004, jež nejsou přiměřené vzhledem k výkonnostním cílům celé
    Unie na druhé referenční období, a kterým se stanoví povinnosti provedení
    nápravných opatření (oznámeno pod číslem C(2017) 728)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/258 af 13. februar 2017
