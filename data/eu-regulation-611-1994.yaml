title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 611/94 of 18 March 1994 specifying the extent
    to which applications lodged in February 1994 for import licences in respect of
    young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 611/94 de la Commission, du 18 mars 1994, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de février 1994 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 611/94 der Kommission vom 18. März 1994 über das
    Ausmaß, in dem den im Februar 1994 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 611/94 af 18. marts 1994 om fastsættelse
    af, i hvilket omfang ansøgninger om udstedelse af importlicenser, som er indsendt
    i februar 1994 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 611/94 της Επιτροπής
    της 18ης Μαρτίου 1994 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1994 για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 611/94 della Commissione, del 18 marzo 1994, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1994 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 611/94 van de Commissie van 18 maart 1994 tot bepaling
    van de mate waarin de in februari 1994 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 611/94 da Comissão, de 18 de Março de 1994, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Fevereiro de 1994 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 611/94 de la Comisión, de 18 de marzo de 1994, que determina
    en qué medida podrá darse curso a las solicitudes de expedición de certificados
    de importación presentadas en el mes de febrero de 1994, para los machos jóvenes
    de la especie bovina destinados al engorde
  type: main
