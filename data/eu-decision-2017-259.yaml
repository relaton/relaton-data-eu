---
id: EUDecision2017259
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/259 of 13 February 2017 concerning
    certain revised performance targets and appropriate measures included in the national
    or functional airspace block plans submitted pursuant to Regulation (EC) No 549/2004
    of the European Parliament and of the Council that are not adequate in respect
    to the Union-wide performance targets for the second reference period and setting
    out obligations for corrective measures (notified under document C(2017) 729)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/259 de la Commission du 13 février 2017
    concernant certains objectifs de performance révisés et mesures appropriées
    figurant dans les plans nationaux ou les plans au niveau des blocs d'espace aérien
    fonctionnels présentés conformément au règlement (CE) n° 549/2004 du Parlement
    européen et du Conseil qui ne sont pas adaptés au regard des objectifs de performance
    de l'Union pour la deuxième période de référence et formulant des obligations
    relatives à des mesures correctrices [notifiée sous le numéro C(2017) 729]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/259 der Kommission vom 13. Februar 2017
    bezüglich bestimmter überarbeiteter Leistungsziele und geeigneter Maßnahmen
    in den gemäß der Verordnung (EG) Nr. 549/2004 des Europäischen Parlaments und
    des Rates vorgelegten nationalen Plänen oder Plänen für funktionale Luftraumblöcke,
    die nicht mit den unionsweit geltenden Leistungszielen für den zweiten Bezugszeitraum
    vereinbar sind, sowie Verpflichtungen zur Ergreifung von Behebungsmaßnahmen (Bekannt
    gegeben unter Aktenzeichen C(2017) 729)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/259 на Комисията
    от 13 февруари 2017 година относно някои преразгледани
    цели за ефективност и подходящи мерки, включени
    в националния план или плана за функционалните
    блокове въздушно пространство, представени
    съгласно Регламент (ЕО) № 549/2004 на Европейския
    парламент и на Съвета, които не са адекватни
    по отношение на валидните за целия Европейски
    съюз цели за ефективност, отнасящи се за втория
    референтен период, както и определяне на задължения
    за коригиращи мерки (нотифицирано под номер
    С(2017) 729)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/259 ze dne 13. února 2017, které
    se týká některých revidovaných výkonnostních cílů a příslušných opatření
    zahrnutých do vnitrostátních plánů či plánů funkčních bloků vzdušného
    prostoru předložených podle nařízení Evropského parlamentu a Rady (ES)
    č. 549/2004, jež nejsou přiměřené vzhledem k výkonnostním cílům celé
    Unie na druhé referenční období, a kterým se stanoví povinnosti provedení
    nápravných opatření (oznámeno pod číslem C(2017) 729)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/259 af 13. februar 2017
    om visse reviderede præstationsmål og passende foranstaltninger, der indgår
    i de nationale planer eller planerne for funktionelle luftrumsblokke, der er fremlagt
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 549/2004, som
    ikke stemmer overens med de EU-dækkende præstationsmål for den anden referenceperiode,
    og om fastsættelse af forpligtelser vedrørende korrigerende foranstaltninger
    (meddelt under nummer C(2017) 729)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/259 της Επιτροπής,
    της 13ης Φεβρουαρίου 2017, σχετικά με ορισμένους
    αναθεωρημένους στόχους επιδόσεων και ενδεδειγμένα
    μέτρα των εθνικών σχεδίων ή των σχεδίων λειτουργικού
    τμήματος εναέριου χώρου που υποβλήθηκαν σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 549/2004 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου τα οποία δεν
    συνάδουν με τους στόχους επιδόσεων σε κλίμακα
    Ένωσης για τη δεύτερη περίοδο αναφοράς, καθώς
    και σχετικά με τον καθορισμό υποχρεώσεων για
    τη λήψη διορθωτικών μέτρων [κοινοποιηθείσα
    υπό τον αριθμό C(2017) 729]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/259, 13. veebruar 2017, milles käsitletakse
    Euroopa Parlamendi ja nõukogu määruse (EÜ) nr 549/2004 kohaselt esitatud riiklikes
    või funktsionaalse õhuruumiosa kavades sisalduvaid teatavaid läbivaadatud tulemuseesmärke,
