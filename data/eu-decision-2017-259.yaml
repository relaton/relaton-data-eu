  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/259, annettu 13 päivänä
    helmikuuta 2017, Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 549/2004
    mukaisesti esitettyihin kansallisiin tai toiminnallisia ilmatilan lohkoja koskeviin
    suunnitelmiin sisältyvistä tietyistä tarkistetuista suorituskykytavoitteista
    ja aiheellisista toimenpiteistä, jotka eivät ole riittäviä suhteessa unionin
    laajuisiin suorituskykytavoitteisiin toisella viiteajanjaksolla, sekä velvoitteesta
    toteuttaa korjaavia toimenpiteitä (tiedoksiannettu numerolla C(2017) 729)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/259 оd 13. veljače 2017. o određenim
    revidiranim ciljevima izvedbe i odgovarajućim mjerama uključenima u planove
    na nacionalnoj razini ili na razini funkcionalnog bloka zračnog prostora dostavljenim
    u skladu s Uredbom (EZ) br. 549/2004 Europskog parlamenta i Vijeća koji nisu
    odgovarajući u odnosu na ciljeve izvedbe na razini Unije za drugo referentno
    razdoblje te o utvrđivanju obveza za korektivne mjere (priopćeno pod brojem
    dokumenta C(2017) 729)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/259 végrehajtási határozata (2017. február 13.)
    az 549/2004/EK európai parlamenti és tanácsi rendelet értelmében benyújtott
    nemzeti tervekben vagy funkcionális légtérblokkokra vonatkozó tervekben foglalt,
    a második referencia-időszakra meghatározott uniós szintű teljesítménycéloknak
    nem megfelelő bizonyos felülvizsgált teljesítménycélokról és megfelelő
    intézkedésekről, valamint korrekciós intézkedésekre vonatkozó kötelezettségek
    meghatározásáról (az értesítés a C(2017) 729. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/259 della Commissione, del 13 febbraio
    2017, relativa a taluni obiettivi prestazionali rivisti e a misure appropriate
    inclusi nei piani nazionali o nei piani per i blocchi funzionali di spazio aereo
    presentati a norma del regolamento (CE) n. 549/2004 del Parlamento europeo e del
    Consiglio e non adeguati in relazione agli obiettivi prestazionali a livello dell'Unione
    per il secondo periodo di riferimento, che stabilisce l'obbligo di misure correttive
    [notificata con il numero C(2017) 729]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/259 (2017. gada 13. februāris),
