    dokumenta numuru C(2017) 729)
  type: main
- language: lt
  script: Latn
  content: 2017 m. vasario 13 d. Komisijos įgyvendinimo sprendimas (ES) 2017/259
    dėl kai kurių į nacionalinius arba funkcinių oro erdvės blokų planus, pateiktus
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 549/2004, įrašytų
    persvarstytų tikslinių veiklos rodiklių ir atitinkamų priemonių, neatitinkančių
    visos Sąjungos antrojo ataskaitinio laikotarpio tikslinių veiklos rodiklių,
    ir dėl įpareigojimo taikyti taisomąsias priemones (pranešta dokumentu Nr.
    C(2017) 729)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/259 tat-13 ta'
    Frar 2017 dwar ċerti miri tal-prestazzjoni riveduti u miżuri xierqa inklużi
    fil-pjanijiet għall-blokok tal-ispazju tal-ajru nazzjonali jew funzjonali mressqa
    skont ir-Regolament (KE) Nru 549/2004 tal-Parlament Ewropew u tal-Kunsill li m'humiex
    adekwati skont il-miri tal-prestazzjoni għall-Unjoni kollha għat-tieni perjodu
    ta' referenza u li tistabbilixxi obbligi għal miżuri korrettivi (notifikata
    bid-dokument C(2017) 729)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/259 van de Commissie van 13 februari 2017
    inzake bepaalde herziene prestatiedoelstellingen en passende maatregelen in de
    overeenkomstig Verordening (EG) nr. 549/2004 van het Europees Parlement en de
    Raad ingediende nationale plannen of plannen voor functionele luchtruimblokken
    die niet sporen met de EU-wijde prestatiedoelstellingen voor de tweede referentieperiode,
    en tot vaststelling van verplichte corrigerende maatregelen (Kennisgeving geschied
    onder nummer C(2017) 729)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/259 z dnia 13 lutego 2017 r. dotycząca
    niektórych zmienionych parametrów docelowych skuteczności działania oraz odpowiednich
    środków zawartych w planach krajowych lub dotyczących funkcjonalnych bloków
    przestrzeni powietrznej, przedłożonych zgodnie z rozporządzeniem (WE) nr 549/2004
    Parlamentu Europejskiego i Rady, które nie są właściwe w stosunku do ogólnounijnych
    docelowych parametrów skuteczności działania na drugi okres odniesienia, i
    określająca obowiązki dotyczące środków naprawczych (notyfikowana jako dokument
    nr C(2017) 729)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/259 da Comissão, de 13 de fevereiro de
    2017, relativa a certos objetivos de desempenho revistos e medidas adequadas,
    incluídos nos planos nacionais ou planos relativos aos blocos funcionais de espaço
    aéreo apresentados nos termos do Regulamento (CE) n.° 549/2004 do Parlamento
    Europeu e do Conselho, não adequados no que respeita aos objetivos de desempenho
    a nível da União para o segundo período de referência, e que estabelece obrigações
    de adoção de medidas corretivas [notificada com o número C(2017) 729]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/259 a Comisiei din 13 februarie
    2017 privind anumite obiective de performanță revizuite și anumite măsuri
    corespunzătoare incluse în planurile naționale sau în planurile blocurilor
    funcționale de spațiu aerian prezentate în conformitate cu Regulamentul (CE)
    nr. 549/2004 al Parlamentului European și al Consiliului, care nu sunt adecvate
    în ceea ce privește obiectivele de performanță la nivelul Uniunii pentru cea
    de a doua perioadă de referință, și de stabilire a obligațiilor referitoare
    la măsurile corective [notificată cu numărul C(2017) 729]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/259 z 13. februára 2017 o
    niektorých revidovaných výkonnostných cieľoch a primeraných opatreniach
    zahrnutých do národného plánu alebo plánu funkčných blokov vzdušného
    priestoru predložených v súlade s nariadením Európskeho parlamentu a Rady
    (ES) č. 549/2004, ktoré nie sú adekvátne vzhľadom na výkonnostné ciele
    pre celú Úniu na druhé referenčné obdobie, a ktorým sa stanovujú povinnosti
    v oblasti nápravných opatrení [oznámené pod číslom C(2017) 729]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/259 z dne 13. februarja 2017 o nekaterih
    revidiranih ciljih uspešnosti in ustreznih ukrepih, vključenih v nacionalne
    načrte ali načrte funkcionalnih blokov zračnega prostora, predložene v skladu
    z Uredbo (ES) št. 549/2004 Evropskega parlamenta in Sveta, ki niso ustrezni glede
    na vseevropske cilje uspešnosti za drugo referenčno obdobje, in o določitvi
    obveznosti korektivnih ukrepov (notificirano pod dokumentarno številko C(2017)
    729)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/259 de la Comisión, de 13 de febrero
    de 2017, relativa a determinados objetivos de rendimiento revisados y medidas
    pertinentes incluidos en los planes a escala nacional o de bloque funcional de
    espacio aéreo presentados con arreglo al Reglamento (CE) n.° 549/2004 del Parlamento
    Europeo y del Consejo que no se adecuan a los objetivos de rendimiento para toda
    la Unión en el segundo período de referencia, y por la que se imponen medidas
    correctoras [notificada con el número C(2017) 729]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/259 av den 13 februari 2017
    om vissa reviderade prestationsmål och lämpliga åtgärder i de nationella planer
    eller planer för funktionella luftrumsblock som lämnats in enligt Europaparlamentets
    och rådets förordning (EG) nr 549/2004, som inte är tillräckliga i förhållande
    till de unionstäckande prestationsmålen för den andra referensperioden samt
    om fastställande av skyldigheter i fråga om korrigerande åtgärder [delgivet
    med nr C(2017) 729]
