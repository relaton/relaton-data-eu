    als frei von Brucellose (B. melitensis) und enzootischer Rinderleukose und der
    Slowakei als frei von Rindertuberkulose und Rinderbrucellose (Bekannt gegeben
    unter Aktenzeichen K(2005) 483)'
  type: main
- language: bg
