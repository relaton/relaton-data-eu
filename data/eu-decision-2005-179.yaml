title:
- language: en
  script: Latn
  content: '2005/179/EC: Commission Decision of 4 March 2005 amending Decisions 93/52/EEC
    and 2003/467/EC as regards the declaration that Slovenia is free of brucellosis
    (B. melitensis) and enzootic bovine leukosis and Slovakia of bovine tuberculosis
    and bovine brucellosis (notified under document number C(2005) 483)'
  type: main
- language: fr
  script: Latn
  content: '2005/179/CE: Décision de la Commission du 4 mars 2005 modifiant les décisions
    93/52/CEE et 2003/467/CE en ce qui concerne la déclaration selon laquelle la
    Slovénie est indemne de brucellose (B. melitensis) et de leucose bovine enzootique
    et la Slovaquie, indemne de tuberculose bovine et de brucellose bovine [notifiée
    sous le numéro C(2005) 483]'
  type: main
- language: de
  script: Latn
  content: '2005/179/EG: Entscheidung der Kommission vom 4. März 2005 zur Änderung
