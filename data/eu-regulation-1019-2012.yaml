  script: Latn
  content: Commission Implementing Regulation (EU) No 1019/2012 of 6 November 2012
    amending Commission Regulation (EC) No 1096/2009 as regards the minimum content
    of endo-1,4-beta-xylanase produced by Aspergillus niger (CBS 109.713) as a feed
    additive in feed for chickens for fattening and for ducks (holder of authorisation
    BASF SE)
  type: main
- language: fr
  script: Latn
