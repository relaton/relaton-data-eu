title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1970, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par le "Ministero
    del lavora e della previdenza sociale" et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: '70/477/EWG: Entscheidung der Kommission vom 30. September 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Republik
    Italien zu Aufwendungen für vom "Ministero del lavoro e della previdenza sociale"
    und mehreren italienischen Körperschaften durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '70/477/CEE: Decisione della Commissione, del 30 settembre 1970, che concede
    un contributo del Fondo sociale europeo alla Repubblica italiana per spese concernenti
    operazioni di riqualificazione effettuate dal «Ministero del lavoro e della previdenza
    sociale» e da vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: '70/477/EEG: Beschikking van de Commissie van 30 september 1970 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero del lavoro e della previdenza sociale" en diverse Italiaanse
    instellingen gemaakte herscholingskosten'
  type: main
