title:
- language: en
  script: Latn
  content: Commission Directive 2000/80/EC of 4 December 2000 amending Annex I to
    Council Directive 91/414/EEC concerning the placing of plant protection products
    on the market, so as to consolidate that Annex and include a further active substance
    (lambda-cyhalothrin)
  type: main
- language: fr
  script: Latn
  content: Directive 2000/80/CE de la Commission du 4 décembre 2000 modifiant l'annexe
    I de la directive 91/414/CEE du Conseil concernant la mise sur le marché des
    produits phytopharmaceutiques en vue de la consolider et d'y inscrire une autre
    substance active (lambda-cyhalothrine)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/80/EG der Kommission vom 4. Dezember 2000 zur Änderung
    von Anhang I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von
    Pflanzenschutzmitteln und infolgedessen zur Konsolidierung dieses Anhangs sowie
    zur Aufnahme eines weiteren Wirkstoffs (Lambda-Cyhalothrin)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/80/ЕО на Комисията от 4 декември
    2000 година за изменение на приложение I към Директива
    91/414/ЕИО на Съвета относно пускането на пазара
    на продукти за растителна защита, както и консолидирането
    на това приложение и включването на още едно
    активно вещество (ламбда-цихалотрин)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/80/ES ze dne 4. prosince 2000, kterou se mění příloha
    I směrnice Rady 91/414/EHS o uvádění přípravků na ochranu rostlin na trh
    za účelem konsolidace dané přílohy a zařazení další účinné látky
    (lambda-cyhalothrin)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/80/EF af 4. december 2000 om ændring af bilag
    I til Rådets direktiv 91/414/EØF om markedsføring af plantebeskyttelsesmidler,
    med henblik på konsolidering af dette bilag og optagelse af endnu et aktivt stof
    (lambda-cyhalothrin)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/80/ΕΚ της Επιτροπής, της 4ης Δεκεμβρίου
    2000, περί τροποποιήσεως του παραρτήματος Ι της
    οδηγίας 91/414/ΕΟΚ του Συμβουλίου σχετικά με τη
    διάθεση φυτοπροστατευτικών προϊόντων στην
    αγορά, ώστε να ενοποιηθεί το παράρτημα αυτό
    και να καταχωρηθεί μια ακόμη δραστική ουσία
    (lambda-cyhalothrine)
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/80/EÜ, 4. detsember 2000, millega muudetakse
    taimekaitsevahendite turuleviimist käsitleva nõukogu direktiivi 91/414/EMÜ
    I lisa nimetatud lisa konsolideerimiseks ja toimeaine (lambda-tsühalotriini)
    lisamiseks
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/80/EY, annettu 4 päivänä joulukuuta 2000,
    kasvinsuojeluaineiden markkinoille saattamisesta annetun neuvoston direktiivin
    91/414/ETY liitteen I muuttamisesta mainitun liitteen kodifioimiseksi ja tehoaineen
    (lambda-syhalotriinin) sisällyttämiseksi siihen
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/80/EK irányelve (2000. december 4.) a növényvédő
    szerek forgalomba hozataláról szóló 91/414/EGK tanácsi irányelv I. mellékletének
    egységes szerkezetbe foglalásával és egy további hatóanyagnak (lambda-cihalotrin)
    a mellékletbe történő felvételével történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/80/CE della Commissione, del 4 dicembre 2000, che modifica
    l'allegato I della direttiva 91/414/CEE del Consiglio, relativa all'immissione
    in commercio dei prodotti fitosanitari, per consolidare tale allegato e includervi
    un'altra sostanza attiva (lambda-cialotrina)
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/80/EK (2000. gada 4. decembris), ar ko groza
    I pielikumu Padomes Direktīvā 91/414/EEK par augu aizsardzības līdzekļu laišanu
    tirgū nolūkā konsolidēt šo pielikumu un ietvert vēl vienu aktīvo vielu
    (lambda-cihalotrīnu)
  type: main
- language: lt
  script: Latn
  content: 2000 m. gruodžio 4 d. Komisijos direktyva 2000/80/EB, iš dalies keičianti
    Tarybos direktyvos 91/414/EEB dėl augalų apsaugos produktų pateikimo į rinką
    I priedą siekiant jį konsoliduoti ir įrašyti papildomą veikliąją medžiagą
    (λ-cihalotriną)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2000/80/KE ta’ l-4 ta’ Diċembru 2000
    li temenda l-Anness I tad-Direttiva tal-Kunsill 91/414/KEE dwar it-tqegħid fuq
    is-suq ta’ prodotti li jipproteġu l-pjanti, sabiex jiġi kkonsolidat dak l-Anness
    u tiġi nkluża sustanza attiva oħra (lambda-cyhalothrin)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/80/EG van de Commissie van 4 december 2000 tot wijziging
    van bijlage I bij Richtlijn 91/414/EEG betreffende het op de markt brengen van
    gewasbeschermingsmiddelen, met het oog op de consolidatie van die bijlage en de
    opneming van een nieuwe werkzame stof (lambda-cyhalothrin)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/80/WE z dnia 4 grudnia 2000 r. zmieniająca załącznik
    I do dyrektywy Rady 91/414/EWG dotyczącej wprowadzania do obrotu środków ochrony
    roślin w celu ujednolicenia tego załącznika oraz włączenia kolejnej substancji
    czynnej (lambda-cyhalotryna)
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/80/CE da Comissão, de 4 de Dezembro de 2000, que altera
    o anexo I da Directiva 91/414/CEE do Conselho relativa à colocação dos produtos
    fitofarmacêuticos no mercado, com o objectivo de consolidá-lo e incluir uma
    nova substância activa (lambda-cialotrina)
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/80/CE a Comisiei din 4 decembrie 2000 de modificare a anexei
    I la Directiva 91/414/CEE a Consiliului privind introducerea pe piață a produselor
    fitosanitare în scopul consolidării acestei anexe și al includerii unei substanțe
    active (lambda-cihalotrin)
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/80/ES zo 4. decembra 2000, ktorou sa mení a dopĺňa
    príloha I smernice Rady 91/414/EHS o uvádzaní prípravkov na ochranu rastlín
    na trh s cieľom konsolidovať prílohu a zaradiť do nej ďalšiu účinnú látku
    (lambda-cyhalotrín)
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2000/80/ES z dne 4. decembra 2000, o spremembi Priloge
    I k Direktivi Sveta 91/414/EGS o dajanju fitofarmacevtskih sredstev v promet,
    da se ta priloga prečisti in doda nova aktivna snov (lambda-cihalotrin)
  type: main
- language: es
  script: Latn
  content: Directiva 2000/80/CE de la Comisión, de 4 de diciembre de 2000, por la
    que se modifica el anexo I de la Directiva 91/414/CEE del Consejo relativa a la
    comercialización de productos fitosanitarios, a fin de consolidar dicho anexo
    e incluir en él otra sustancia activa (lambda-cihalotrina)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2000/80/EG av den 4 december 2000 om ändring av
    bilaga I till rådets direktiv 91/414/EEG om utsläppande av växtskyddsmedel
    på marknaden, i syfte att konsolidera den bilagan och föra in ytterligare ett
    verksamt ämne (lambda-cyhalotrin)
