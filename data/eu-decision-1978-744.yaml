id: EUDecision1978744
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 August 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to bed linen, woven, falling within subheading ex 62.02 B
    (NIMEXE codes 62.02-11, 19) of the Common Customs Tariff, originating in Romania
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/744/CEE: Décision de la Commission, du 11 août 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le linge de lit tissé de la sous-position
    Ex 60.02 B du Tarif douanier commun (codes Nimexe : 62.02-11; 19), originaire
    de Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. August 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Bettwäsche aus Geweben der Tarifnummer ex 62.02 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 62.02-11; 19) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 11. august 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage sengelinned, vævet, som henhører under pos. ex 62.02 B (NIMEXE-kode:
    62.02-11, 19) i den fælles toldtarif, har oprindelse i Rumænien og frit kan
    omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, dell''11 agosto 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario biancheria da letto, tessuta, della voce ex 62.02
    B (codice Nimexe: 62.02-11, 19) della tariffa doganale comune, originaria della
    Romania e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 augustus 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd beddelinnen, geweven, van post ex 62.02 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 62.02-11, 19), van oorsprong uit Roemenië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
