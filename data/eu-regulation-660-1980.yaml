title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 660/80 of 19 March 1980 re-establishing
    the levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels, falling within heading No 70.12 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 660/80 de la Commission, du 19 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position 70.12 du tarif douanier commun,
    originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 660/80 der Kommission vom 19. März 1980 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12, mit
    Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 660/80 af 19. marts 1980 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere, under pos. 70.12, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 660/80 della Commissione, del 19 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili alle ampolle di vetro per recipienti
    isolanti della voce 70.12 della tariffa doganale comune, originarie dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 660/80 van de Commissie van 19 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor binnenflessen voor thermisch
    isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen van
    post 70.12, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
