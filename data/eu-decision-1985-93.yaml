title:
- language: en
  script: Latn
  content: '85/93/EEC: Commission Decision of 20 December 1984 authorizing the French
    Republic to introduce intra- Community surveillance in respect of certain piezo-
    electric quartz crystal electronic digital watches originating in the People''s
    Republic of China, India, Japan, Macao, Pakistan, the Philippines, Singapore and
    Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/93/CEE: Décision de la Commission du 20 décembre 1984 autorisant
    la République française à instaurer une surveillance intracommunautaire à
    l''égard de certaines montres électroniques à quartz piézo-électrique à
    affichage numérique originaires de la République populaire de Chine, de l''Inde,
    du Japon, de Macao, du Pakistan, des Philippines, de Singapour et de T''ai-wan
    (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/93/EWG: Entscheidung der Kommission vom 20. Dezember 1984 zur Ermächtigung
    der Französischen Republik, für die Einfuhren von bestimmten elektronischen
    Uhren mit piezoelektrischem Quarz und numerischer Anzeige mit Ursprung in der
    Volksrepublik China, Indien, Japan, Macao, Pakistan, den Philippinen, Singapur
    und Taiwan eine innergemeinschaftliche Überwachung einzuführen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/93/EØF: Kommissionens beslutning af 20. december 1984 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med importen
    af visse elektroniske ure med piezoelektrisk kvartsregulator og digitalt display
    med oprindelse i Den kinesiske Folkerepublik, Indien, Japan, Macao, Pakistan,
    Filippinerne, Singapore og Taiwan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/93/ΕΟΚ: Απόφαση της Επιτροπής της 20ής Δεκεμβρίου
    1984 για την παροχή αδείας στη Γαλλική Δημοκρατία
    να θεσπίσει ενδοκοινοτική επιτήρηση για τις
    εισαγωγές ορισμένων ηλεκτρονικών ρολογιών
    με πιεζοηλεκτρικό χαλαζία (quartz) και ψηφιακή
    ένδειξη, καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας, Ινδίας, Ιαπωνίας, Μακάο, Πακιστάν, Φιλιππίνων,
    Σιγκαπούρης και Ταϊβάν (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/93/CEE: Decisione della Commissione del 20 dicembre 1984 che autorizza
    la Repubblica francese a istituire una sorveglianza intracomunitaria nei confronti
    delle importazioni di alcuni tipi di orologi elettronici a quarzo piezoelettrico,
    digitali, numerici, originari della Repubblica popolare cinese, dell''India, del
    Giappone, di Macao, del Pakistan, delle Filippine, di Singapore e di Taiwan (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/93/EEG: Beschikking van de Commissie van 20 december 1984 houdende
    machtiging van de Franse Republiek om een intracommunautair toezicht in te stellen
    ten aanzien van de invoer van bepaalde elektronische, piëzo-elektrische kwartshorloges
    met digitale tijdsaanduiding, van oorsprong uit de Volksrepubliek China, India,
    Japan, Macao, Pakistan, de Filippijnen, Singapore en Taiwan (Slechts de tekst
    in de Franse taal is authentiek)'
