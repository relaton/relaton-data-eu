  script: Latn
  content: Règlement (CE) n° 1855/2005 de la Commission du 14 novembre 2005 complétant
    l'annexe du règlement (CE) n° 2400/96 en ce qui concerne l’enregistrement
    de certaines dénominations dans le «Registre des appellations d’origine protégées
    et des indications géographiques protégées» [Mela Alto Adige ou Südtiroler
    Apfel (IGP), asperge des sables des Landes (IGP), pâtes d’Alsace (IGP), Jamón
    de Trevélez (IGP), Oliva Ascolana del Piceno (AOP)]
