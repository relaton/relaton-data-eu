title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1855/2005 of 14 November 2005 supplementing
    the Annex to Regulation (EC) No 2400/96 as regards the entry of certain names
    in the Register of protected designations of origin and protected geographical
    indications (Mela Alto Adige or Südtiroler Apfel (PGI), Asperge des Sables des
    Landes (PGI), Pâtes d’Alsace (PGI), Jamón de Trevélez (PGI), Oliva Ascolana
    del Piceno (PDO))
  type: main
