title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1948/82 of 19 July 1982 fixing the minimum
    price payable to producers for dried plums derived from prunes d' Ente and the
    amount of production aid for prunes for the 1982/83 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1948/82 de la Commission, du 19 juillet 1982, fixant,
    pour la campagne 1982/1983, le prix minimal à payer aux producteurs pour les
    prunes d' Ente séchées ainsi que le montant de l' aide à la production pour
    les pruneaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1948/82 der Kommission vom 19. Juli 1982 zur Festsetzung
    des für das Wirtschaftsjahr 1982/83 den Erzeugern von getrockneten Pflaumen (,,prunes
    d' Ente' ' ) zu zahlenden Mindestpreises sowie der Produktionsbeihilfe für Trockenpflaumen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1948/82 af 19. juli 1982 om fastsættelse
    for produktionsåret 1982/83 af den minimumspris, der skal betales til producenterne
    for tørrede "prunes d' Ente" af producentstøtten for svesker
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1948/82 τής Επιτροπής
