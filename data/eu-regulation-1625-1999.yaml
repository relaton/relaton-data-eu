title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1625/1999 of 23 July 1999 determining the
    extent to which the applications for import licences submitted in July 1999 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1625/1999 de la Commission, du 23 juillet 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1999 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1625/1999 der Kommission vom 23. Juli 1999 zur Festlegung
    des Umfangs, in dem den im Juli 1999 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 1374/98 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1625/1999 af 23. juli 1999 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i juli 1999 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 1374/98, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1625/1999 της Επιτροπής,
    της 23ης Ιουλίου 1999, που καθορίζει το κατά πόσον
    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Ιουλίο 1999 για
    ορισμένα γαλακτοκομικά προϊόντα στο πλαίσιο
    ορισμένων δασμολογικών ποσοστώσεων που θεσπίσθηκαν
    με τον κανονισμό (ΕΚ) αριθ. 1374/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1625/1999, annettu 23 päivänä heinäkuuta
    1999, asetuksessa (EY) N:o 1374/98 avattuihin tariffikiintiöihin kuuluville maitotuotteille
    heinäkuussa 1999 käyttöön otettujen tuontitodistusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1625/1999 della Commissione, del 23 luglio 1999, che
    stabilisce in quale misura possano essere accettate le domande di titoli di importazione
    presentate nel mese di luglio 1999 per determinati prodotti lattiero-caseari nell'ambito
    di taluni contingenti tariffari aperti dal regolamento (CE) n. 1374/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1625/1999 van de Commissie van 23 juli 1999 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    die in juli 1999 voor bepaalde melkproducten zijn ingediend in het kader van bepaalde
    tariefcontingenten, geopend bij Verordening (EG) nr. 1374/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1625/1999 da Comissão, de 23 de Julho de 1999, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
