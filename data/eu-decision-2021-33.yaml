id: EUDecision202133
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/33 of 14 January 2021 as regards
    the authorisation for Spain not to take into account certain categories of transactions
    for the calculation of the VAT own resources base in respect of supply of services
    by authors until the end of 2024 (notified under document C(2021) 80) (only the
    Spanish text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/33 de la Commission du 14 janvier 2021
    concernant l’autorisation, pour l’Espagne, de ne pas tenir compte, jusqu’à
    la fin de 2024, de certaines catégories d’opérations aux fins du calcul de
    la base des ressources propres provenant de la taxe sur la valeur ajoutée pour
    les prestations de services des auteurs [notifiée sous le numéro C(2021) 80]
    (Le texte en langue espagnole est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/33 der Kommission vom 14. Januar 2021
    im Hinblick auf die Ermächtigung Spaniens, bei der Berechnung der Bemessungsgrundlage
    für die MwSt.-Eigenmittel in Bezug auf Dienstleistungen von Autoren bis Ende
    2024 bestimmte Gruppen von Umsätzen nicht zu berücksichtigen (Bekannt gegeben
    unter Aktenzeichen C(2021) 80) (Nur der spanische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/33 на Комисията
    от 14 януари 2021 година относно разрешението
    Испания да не взема предвид някои категории
    сделки при изчисляването на базата за собствените
    ресурси от ДДС по отношение на предоставянето
    на услуги от автори до края на 2024 г. (нотифицирано
    под номер С(2021) 80) (само текстът на испански
    език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/33, ze dne 14. ledna 2021, pokud
    jde o povolení, kterým se Španělsku umožnuje nebrat do konce roku 2024 v
    úvahu některé kategorie plnění pro výpočet základu vlastních zdrojů
    z DPH, které se týkají poskytování služeb autory (oznámeno pod číslem
    C(2021) 80) (Pouze španělské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/33 af 14. januar 2021
    om bemyndigelse af Spanien til ved beregningen af grundlaget for de egne momsindtægter
    at fritage visse kategorier af transaktioner for så vidt angår ydelser leveret
    af forfattere indtil udgangen af 2024 (meddelt under nummer C(2021) 80) (Kun den
    spanske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/33 της Επιτροπής
    της 14ης Ιανουαρίου 2021 όσον αφορά τη χορήγηση
    εξουσιοδότησης στην Ισπανία για να εξακολουθήσει
    να χρησιμοποιεί ορισμένες κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από τον ΦΠΑ σε
    σχέση με τις παροχές υπηρεσιών από συγγραφείς
    έως τα τέλη του 2024 [κοινοποιηθείσα υπό τον αριθμό
    C(2021) 80] (Το κείμενο στην ισπανική γλώσσα είναι
    το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/33, 14. jaanuar 2021, seoses Hispaaniale
    loa andmisega mitte võtta käibemaksu omavahendite baasi arvutamisel 2024. aasta
    lõpuni arvesse teatavat liiki tehinguid autorite osutatud teenuste puhul (teatavaks
    tehtud numbri C(2021) 80 all) (Ainult hispaaniakeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/33, annettu 14 päivänä
    tammikuuta 2021, luvan antamisesta Espanjalle olla ottamatta huomioon eräitä
    liiketoimiluokkia arvonlisäverosta kertyvien omien varojen perusteen laskennassa
    kirjailijoiden suorittamien palvelujen osalta vuoden 2024 loppuun asti (tiedoksiannettu
    numerolla C(2021) 80) (ainoastaan espanjankielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/33 оd 14. siječnja 2021. kojom se
    Španjolskoj odobrava da do kraja 2024. za izračun osnovice vlastitih sredstava
    od PDV-a za usluge koje isporučuju autori ne uzima u obzir određene kategorije
    transakcija (priopćeno pod brojem dokumenta C(2021) 80) (Vjerodostojan je samo
    tekst na španjolskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/33 végrehajtási határozata (2021. január 14.)
    az alkotók által nyújtott szolgáltatások tekintetében a héasajátforrás-alap
    kiszámításához bizonyos ügyleti kategóriák figyelmen kívül hagyásának
    Spanyolország számára 2024 végéig való engedélyezéséről (az értesítés
    a C(2021) 80. számú dokumentummal történt) (Csak a spanyol nyelvű szöveg
    hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/33 della Commissione del 14 gennaio 2021
    relativa all’autorizzazione alla Spagna a non tener conto di talune categorie
    di operazioni per il calcolo della base delle risorse proprie provenienti dall’IVA
    per quanto riguarda le prestazioni di servizi degli autori fino alla fine del
    2024 [notificata con il numero C(2021) 80] (Il testo in lingua spagnola è il
    solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/33 (2021. gada 14. janvāris)
    par atļauju Spānijai neņemt vērā noteiktas darījumu kategorijas PVN pašu
    resursu bāzes aprēķinam attiecībā uz autoru pakalpojumiem līdz 2024. gada
    beigām (izziņots ar dokumenta numuru C(2021) 80) (Autentisks ir tikai teksts
    spāņu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/33 2021 m. sausio 14 d. dėl
    leidimo Ispanijai apskaičiuojant nuosavų išteklių iš PVM bazę iki 2024 m.
    pabaigos neatsižvelgti į tam tikrų kategorijų sandorius, susijusius su autorių
    teikiamomis paslaugomis (pranešta dokumentu Nr. C(2021) 80) (Tekstas autentiškas
    tik ispanų kalba)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/33 tal-14
    ta’ Jannar 2021 fir-rigward tal-awtorizzazzjoni għal Spanja biex ma tikkunsidrax
    ċerti kategoriji ta’ tranżazzjonijiet għall-kalkolu tal-bażi tar-riżorsi
    proprji tal-VAT fir-rigward tal-provvista ta’ servizzi mill-awturi sal-aħħar
    tal-2024 (notifikata bid-dokument C(2021) 80) (it-test bl-Ispanjol biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/33 van de Commissie van 14 januari 2021 inzake
    de machtiging van Spanje om geen rekening te houden met bepaalde categorieën
    handelingen voor de berekening van de grondslag van de eigen middelen uit de btw
    met betrekking tot diensten van auteurs tot eind 2024 (Kennisgeving geschied onder
    nummer C(2021) 80) (Slechts de tekst in de Spaanse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/33 z dnia 14 stycznia 2021 r. dotycząca
    upoważnienia Hiszpanii do nieuwzględniania określonych kategorii transakcji
    przy obliczaniu podstawy zasobów własnych opartych na VAT w odniesieniu do usług
    świadczonych przez twórców do końca 2024 r. (notyfikowana jako dokument nr
    C(2021) 80) (Jedynie tekst w języku hiszpańskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/33 da Comissão de 14 de janeiro de 2021
    no que diz respeito à autorização concedida a Espanha para não ter em conta
    certas categorias de operações no cálculo da base dos recursos próprios provenientes
    do IVA no que diz respeito à prestação de serviços realizados por autores
    até ao final de 2024 [notificada com o número C(2021) 80] (Apenas faz fé o
    texto na língua espanhola)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/33 a Comisiei din 14 ianuarie
    2021 privind autorizarea Spaniei de a nu ține seama de anumite categorii de operațiuni
    pentru calculul bazei resurselor proprii provenite din TVA în ceea ce privește
    prestarea de servicii de către autori până la sfârșitul anului 2024 [notificată
    cu numărul C(2021) 80] (Numai textul în limba spaniolă este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/33 zo 14. januára 2021, pokiaľ
    ide o povolenie pre Španielsko nezohľadňovať určité kategórie transakcií
    pri výpočte základu vlastných zdrojov založených na DPH v súvislosti s
    poskytovaním služieb autormi do konca roku 2024 [oznámené pod číslom C(2021)
    80] (Iba španielske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/33 z dne 14. januarja 2021 o pooblastitvi
    Španije, da pri izračunu osnove za lastna sredstva iz naslova DDV ne upošteva
    nekaterih kategorij transakcij v zvezi s storitvami avtorjev do konca leta 2024
    (notificirano pod dokumentarno številko C(2021) 80) (Besedilo v španskem jeziku
    je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/33 de la Comisión de 14 de enero de
    2021 por la que se autoriza a España a no tomar en consideración, hasta finales
    de 2024, determinadas clases de operaciones en el cálculo de la base de los recursos
    propios procedentes del IVA en relación con las prestaciones de servicios efectuadas
    por autores [notificada con el número C(2021) 80] (El texto en lengua española
    es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/33 av den 14 januari 2021 om
    att ge Spanien tillstånd att inte ta med vissa kategorier av transaktioner vid
    beräkning av underlaget för egna medel från mervärdesskatt vad avser tillhandahållande
    av tjänster av författare fram till och med utgången av år 2024 (delgivet
    med nr C(2021) 80) (Endast den spanska texten är giltig)
