  script: Latn
  content: '2005/908/EC: Commission Decision of 14 December 2005 amending Council
    Directive 2002/56/EC as regards the date laid down in Article 21(3) until which
    Member States are authorised to extend the validity of decisions concerning equivalence
    of seed potatoes from third countries (notified under document number C(2005)
    5020)'
  type: main
- language: fr
  script: Latn
