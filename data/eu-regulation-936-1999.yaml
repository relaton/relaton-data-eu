id: EURegulation9361999
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 936/1999 of 27 April 1999 amending or repealing
    certain regulations on the classification of goods in the Combined Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 936/1999 de la Commission du 27 avril 1999 concernant
    la modification ou l'annulation de certains règlements relatifs au classement
    des marchandises dans la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 936/1999 der Kommission vom 27. April 1999 zur Änderung
    oder Aufhebung bestimmter Verordnungen zur Einreihung von Waren in die Kombinierte
    Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 936/1999 на Комисията от 27
    април 1999 година за изменение или отмяна на
    някои регламенти относно класирането на стоки
    в Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 936/1999 ze dne 27. dubna 1999, kterým se
    mění nebo ruší některá nařízení o zařazení zboží do kombinované
    nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 936/1999 af 27. april 1999 om ændring
    eller ophævelse af visse forordninger om klassificering af varer i den kombinerede
    nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 936/1999 της Επιτροπής,
    της 27ης Απριλίου 1999, για την τροποποίηση ή την
    κατάργηση ορισμένων κανονισμών για την κατάταξη
    εμπορευμάτων στη συνδυασμένη ονοματολογία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 936/1999, 27. aprill 1999, millega muudetakse
    või tunnistatakse kehtetuks teatavad määrused kaupade klassifitseerimise kohta
    koondnomenklatuuris
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 936/1999, annettu 27 päivänä huhtikuuta 1999,
    tavaroiden luokittelua yhdistettyyn nimikkeistöön koskevien tiettyjen asetusten
    muuttamisesta tai kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 936/1999 od 27. travnja 1999. o izmjeni ili stavljanju
    izvan snage određenih uredaba o razvrstavanju robe u kombiniranu nomenklaturu
  type: main
- language: hu
  script: Latn
  content: A Bizottság 936/1999/EK rendelete (1999. április 27.) az árucikkeknek
    a Kombinált Nómenklatúra szerinti besorolásáról szóló egyes rendeletek
    módosításáról, illetve hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 936/1999 della Commissione, del 27 aprile 1999, che
    modifica o abroga alcuni regolamenti relativi alla classificazione delle merci
    nella nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 936/1999 (1999. gada 27. aprīlis), ar ko groza
    vai atceļ atsevišķas regulas par preču klasifikāciju kombinētajā nomenklatūrā
  type: main
- language: lt
  script: Latn
  content: 1999 m. balandžio 27 d. Komisijos reglamentas (EB) Nr. 936/1999 iš dalies
    keičiantis arba panaikinantis tam tikrus reglamentus dėl prekių klasifikavimo
    Kombinuotoje nomenklatūroje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) nru 936/1999 tas-27 ta' April 1999 li
    jemenda jew jirrevoka ċerti regolamenti dwar il-klassifika ta' merkanzija fin-Nomenklatura
    Magħquda
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 936/1999 van de Commissie van 27 april 1999 tot wijziging
    of intrekking van bepaalde verordeningen voor de indeling van goederen in de gecombineerde
    nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 936/1999 z dnia 27 kwietnia 1999 r. zmieniające
    lub uchylające niektóre rozporządzenia dotyczące klasyfikacji towarów według
    Nomenklatury Scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 936/1999 da Comissão, de 27 de Abril de 1999, que
    altera ou revoga certos regulamentos relativos à classificação de mercadorias
    na Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 936/1999 al Comisiei din 27 aprilie 1999 de modificare
    sau abrogare a anumitor regulamente privind clasificarea mărfurilor în Nomenclatura
    Combinată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 936/1999 z 27. apríla 1999, ktorým sa menia
    a dopĺňajú alebo zrušujú niektoré nariadenia o zatrieďovaní tovaru do
    kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 936/1999 z dne 27. aprila 1999 o spremembi ali
    razveljavitvi nekaterih uredb o uvrstitvi blaga v kombinirano nomenklaturo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 936/1999 de la Comisión, de 27 de abril de 1999, por
    el que se modifican o derogan determinados Reglamentos para la clasificación
    de mercancías en la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 936/1999 av den 27 april 1999 om ändring
    eller upphävande av vissa förordningar om klassificeringen av varor i Kombinerade
    nomenklaturen
  type: main
