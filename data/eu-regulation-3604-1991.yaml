    for vessels fishing in the Norwegian exclusive economic zone and the fishing zone
    around Jan Mayen
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3604/91 DU CONSEIL du 3 décembre 1991 modifiant le
