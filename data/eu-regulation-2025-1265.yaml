    par des normes techniques de réglementation précisant la méthode permettant
    d’identifier le principal facteur de risque d’une position et de déterminer
    si une opération constitue une position longue ou courte au sens de l’article
    94, paragraphe 3, de l’article 273 bis, paragraphe 3, et de l’article 325
    bis, paragraphe 2
  type: main
