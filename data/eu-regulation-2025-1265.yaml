  content: Commission Delegated Regulation (EU) 2025/1265 of 1 July 2025 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the method for identifying
    the main risk driver of a position and for determining whether a transaction represents
    a long or a short position as referred to in Articles 94(3), 273a(3) and 325a(2)
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1265 de la Commission du 1er juillet 2025
