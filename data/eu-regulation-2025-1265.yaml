    des Hauptrisikofaktors einer Position und zur Feststellung, ob ein Geschäft eine
    Kauf- oder Verkaufsposition nach Artikel 94 Absatz 3, Artikel 273a Absatz 3 und
    Artikel 325a Absatz 2 darstellt
