id: EURegulation2022887
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/887 of 28 March 2022 amending
    Delegated Regulation (EU) 2019/625 as regards Combined Nomenclature and Harmonised
    System codes and import conditions of certain composite products, amending Delegated
    Regulation (EU) 2019/2122 as regards certain goods and pet birds exempted from
    official controls at border control posts and amending Delegated Regulation (EU)
    2021/630 as regards requirements for composite products exempted from official
    controls at border control posts
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/887 de la Commission du 28 mars 2022 modifiant
    le règlement délégué (UE) 2019/625 en ce qui concerne les codes de la nomenclature
    combinée et du système harmonisé et les conditions d’importation de certains
    produits composés, modifiant le règlement délégué (UE) 2019/2122 en ce qui
    concerne certains biens et oiseaux de compagnie exemptés des contrôles officiels
    aux postes de contrôle frontaliers et modifiant le règlement délégué (UE)
    2021/630 en ce qui concerne les exigences applicables aux produits composés exemptés
    des contrôles officiels aux postes de contrôle frontaliers
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/887 der Kommission vom 28. März 2022 zur
    Änderung der Delegierten Verordnung (EU) 2019/625 hinsichtlich der Codes der
    Kombinierten Nomenklatur und des Harmonisierten Systems sowie der Einfuhrbedingungen
    für bestimmte zusammengesetzte Erzeugnisse, zur Änderung der Delegierten Verordnung
    (EU) 2019/2122 hinsichtlich bestimmter von amtlichen Kontrollen an Grenzkontrollstellen
    ausgenommener Waren und Heimvögel sowie zur Änderung der Delegierten Verordnung
    (EU) 2021/630 hinsichtlich der Anforderungen an von amtlichen Kontrollen an Grenzkontrollstellen
    ausgenommene zusammengesetzte Erzeugnisse
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/887 на Комисията
    от 28 март 2022 година за изменение на Делегиран
    регламент (ЕС) 2019/625 по отношение на кодовете
    по Комбинираната номенклатура и по Хармонизираната
    система и условията за внос на някои съставни
    продукти, за изменение на Делегиран регламент
    (ЕС) 2019/2122 по отношение на определени стоки
    и птици домашни любимци, освободени от официален
    контрол на граничните контролни пунктове,
    и за изменение на Делегиран регламент (ЕС) 2021/630
    по отношение на изискванията за съставни продукти,
    освободени от официален контрол на граничните
    контролни пунктове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/887 ze dne 28. března
    2022, kterým se mění nařízení v přenesené pravomoci (EU) 2019/625, pokud
    jde o kódy kombinované nomenklatury a harmonizovaného systému a podmínky
    dovozu určitých směsných produktů, mění nařízení v přenesené pravomoci
    (EU) 2019/2122, pokud jde o určité zboží a ptáky v zájmovém chovu osvobozené
    od úředních kontrol na stanovištích hraniční kontroly, a mění nařízení
    v přenesené pravomoci (EU) 2021/630, pokud jde o požadavky na směsné produkty
    osvobozené od úředních kontrol na stanovištích hraniční kontroly
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/887 af 28. marts 2022 om
    ændring af delegeret forordning (EU) 2019/625 for så vidt angår koder i den
    kombinerede nomenklatur og det harmoniserede system og importbetingelser for visse
    sammensatte produkter, om ændring af delegeret forordning (EU) 2019/2122 for
    så vidt angår visse varer og fugle holdt som selskabsdyr, der er undtaget fra
    offentlig kontrol på grænsekontrolstederne, og om ændring af delegeret forordning
    (EU) 2021/630 for så vidt angår krav til sammensatte produkter, der er undtaget
    fra offentlig kontrol på grænsekontrolstederne
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/887
    της Επιτροπής της 28ης Μαρτίου 2022 για την τροποποίηση
    του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2019/625
    όσον αφορά κωδικούς της Συνδυασμένης Ονοματολογίας
    και του Εναρμονισμένου Συστήματος, καθώς και
    τους όρους εισαγωγής ορισμένων σύνθετων προϊόντων,
    για την τροποποίηση του κατ’ εξουσιοδότηση
    κανονισμού (ΕΕ) 2019/2122 όσον αφορά ορισμένα αγαθά
    και πτηνά συντροφιάς που εξαιρούνται από τους
    επίσημους ελέγχους στους συνοριακούς σταθμούς
    ελέγχου, και για την τροποποίηση του κατ’ εξουσιοδότηση
    κανονισμού (ΕΕ) 2021/630 όσον αφορά τις απαιτήσεις
    για τα σύνθετα προϊόντα που εξαιρούνται από
    τους επίσημους ελέγχους στους συνοριακούς
    σταθμούς ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/887, 28. märts 2022, millega
    muudetakse delegeeritud määrust (EL) 2019/625 seoses kombineeritud nomenklatuuri
    ja harmoneeritud süsteemi koodide ning teatavate liittoodete imporditingimustega,
    delegeeritud määrust (EL) 2019/2122 seoses teatavate piiripunktides tehtavast
    ametlikust kontrollist vabastatud kaupade ja lemmiklindudega ning delegeeritud
    määrust (EL) 2021/630 seoses piiripunktides tehtavast ametlikust kontrollist
    vabastatud liittoodetele esitatavate nõuetega
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/887, annettu 28 päivänä maaliskuuta
    2022, delegoidun asetuksen (EU) 2019/625 muuttamisesta tiettyjä yhdistelmätuotteita
    koskevien yhdistetyn nimikkeistön ja harmonoidun järjestelmän koodien sekä
    tuontiedellytysten osalta, delegoidun asetuksen (EU) 2019/2122 muuttamisesta rajatarkastusasemilla
    suoritettavasta virallisesta valvonnasta vapautettujen tiettyjen tavaroiden ja
    lemmikkilintujen osalta sekä delegoidun asetuksen (EU) 2021/630 muuttamisesta
    rajatarkastusasemilla suoritettavasta virallisesta valvonnasta vapautettuja yhdistelmätuotteita
    koskevien vaatimusten osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/887 ón gCoimisiún an 28 Márta 2022 lena
    leasaítear Rialachán Tarmligthe (AE) 2019/625 a mhéid a bhaineann le cóid
    na hAinmníochta Comhcheangailte agus cóid an Chórais Chomhchuibhithe agus coinníollacha
    allmhairiúcháin táirgí ilchodacha áirithe, lena leasaítear Rialachán Tarmligthe
    (AE) 2019/2122 a mhéid a bhaineann le hearraí áirithe agus peataí éin atá
    díolmhaithe ó rialuithe oifigiúla ag poist rialaithe teorann agus lena leasaítear
    Rialachán Tarmligthe (AE) 2021/630 a mhéid a bhaineann le ceanglais maidir le
    táirgí ilchodacha atá díolmhaithe ó rialuithe oifigiúla ag poist rialaithe
    teorann
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/887 оd 28. ožujka 2022. o izmjeni
    Delegirane uredbe (EU) 2019/625 u pogledu oznaka kombinirane nomenklature i Harmoniziranog
    sustava te uvjeta uvoza određenih mješovitih proizvoda, o izmjeni Delegirane
    uredbe (EU) 2019/2122 u pogledu određene robe i ptica kućnih ljubimaca izuzetih
    od službenih kontrola na graničnim kontrolnim postajama te o izmjeni Delegirane
    uredbe (EU) 2021/630 u pogledu zahtjevâ za mješovite proizvode izuzete od službenih
    kontrola na graničnim kontrolnim postajama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/887 felhatalmazáson alapuló rendelete (2022. március
    28.) az (EU) 2019/625 felhatalmazáson alapuló rendeletnek a Kombinált Nómenklatúra
    és a Harmonizált Rendszer szerinti kódok, valamint egyes összetett élelmiszer-készítményekre
    vonatkozó behozatali feltételek tekintetében történő módosításáról,
    az (EU) 2019/2122 felhatalmazáson alapuló rendeletnek a határállomásokon
    végzett hatósági ellenőrzések alól mentesített bizonyos áruk és kedvtelésből
    tartott madarak tekintetében történő módosításáról, valamint az (EU)
    2021/630 felhatalmazáson alapuló rendeletnek a határállomásokon végzett
    hatósági ellenőrzések alól mentesített összetett élelmiszer-készítményekre
    vonatkozó követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/887 della Commissione del 28 marzo 2022
    recante modifica del regolamento delegato (UE) 2019/625 per quanto riguarda i
    codici della nomenclatura combinata e del sistema armonizzato e le condizioni
    di importazione di determinati prodotti composti, del regolamento delegato (UE)
    2019/2122 per quanto riguarda alcune merci e alcuni uccelli da compagnia esenti
    da controlli ufficiali ai posti di controllo frontalieri e del regolamento delegato
    (UE) 2021/630 per quanto riguarda le prescrizioni per i prodotti composti esenti
    da controlli ufficiali ai posti di controllo frontalieri
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/887 (2022. gada 28. marts), ar ko
    groza Deleģēto regulu (ES) 2019/625 attiecībā uz kombinētās nomenklatūras
    un harmonizētās sistēmas kodiem un importa nosacījumiem, kurus piemēro noteiktiem
    kombinētiem produktiem, Deleģēto regulu (ES) 2019/2122 attiecībā uz noteiktām
    precēm un lolojumputniem, kuri ir atbrīvoti no oficiālajām kontrolēm robežkontroles
    punktos, un Deleģēto regulu (ES) 2021/630 attiecībā uz prasībām, kuras piemēro
    kombinētajiem produktiem, kas ir atbrīvoti no oficiālajām kontrolēm robežkontroles
    punktos
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/887 2022 m. kovo 28 d. kuriuo
    dėl tam tikrų sudėtinių produktų Kombinuotosios nomenklatūros ir Suderintos
    sistemos kodų ir importo sąlygų iš dalies keičiamas Deleguotasis reglamentas
    (ES) 2019/625, dėl tam tikrų prekių ir kambarinių paukščių, kuriems netaikoma
    oficialioji kontrolė pasienio kontrolės postuose, iš dalies keičiamas Deleguotasis
    reglamentas (ES) 2019/2122 ir dėl sudėtiniams produktams, kuriems netaikoma
    oficialioji kontrolė pasienio kontrolės postuose, taikomų reikalavimų iš
    dalies keičiamas Deleguotasis reglamentas (ES) 2021/630
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/887 tat-28 ta’ Marzu 2022
    li jemenda r-Regolament Delegat (UE) 2019/625 fir-rigward tal-kodiċijiet tan-Nomenklatura
    Magħquda u tas-Sistema Armonizzata u l-kundizzjonijiet tal-importazzjoni ta’
    ċerti prodotti komposti, li jemenda r-Regolament Delegat (UE) 2019/2122 fir-rigward
    ta’ ċerti oġġetti u għasafar domestiċi eżentati mill-kontrolli uffiċjali
    fil-postijiet ta’ kontroll fuq il-fruntiera u li jemenda r-Regolament Delegat
    (UE) 2021/630 fir-rigward tar-rekwiżiti għall-prodotti komposti eżentati mill-kontrolli
    uffiċjali fil-postijiet ta’ kontroll fuq il-fruntiera
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/887 van de Commissie van 28 maart 2022
    tot wijziging van Gedelegeerde Verordening (EU) 2019/625 wat betreft de codes
    van de gecombineerde nomenclatuur en het geharmoniseerde systeem en de invoervoorwaarden
    voor bepaalde samengestelde producten, tot wijziging van Gedelegeerde Verordening
    (EU) 2019/2122 wat betreft bepaalde goederen en gezelschapsvogels die zijn vrijgesteld
    van officiële controles aan grenscontroleposten en tot wijziging van Gedelegeerde
    Verordening (EU) 2021/630 wat betreft voorschriften voor samengestelde producten
    die zijn vrijgesteld van officiële controles aan grenscontroleposten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/887 z dnia 28 marca 2022 r.
    zmieniające rozporządzenie delegowane (UE) 2019/625 w odniesieniu do kodów
    Nomenklatury scalonej i systemu zharmonizowanego oraz warunków przywozu niektórych
    produktów złożonych, zmieniające rozporządzenie delegowane (UE) 2019/2122
    w odniesieniu do niektórych towarów i ptaków domowych zwolnionych z kontroli
    urzędowych w punktach kontroli granicznej oraz zmieniające rozporządzenie delegowane
    (UE) 2021/630 w odniesieniu do wymogów dotyczących produktów złożonych zwolnionych
    z kontroli urzędowych w punktach kontroli granicznej
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/887 da Comissão de 28 de março de 2022
    que altera o Regulamento Delegado (UE) 2019/625 no que diz respeito aos códigos
    da Nomenclatura Combinada e do Sistema Harmonizado e às condições de importação
    de determinados produtos compostos, que altera o Regulamento Delegado (UE) 2019/2122
    no que diz respeito a determinadas mercadorias e aves de companhia isentas de
    controlos oficiais nos postos de controlo fronteiriços e que altera o Regulamento
    Delegado (UE) 2021/630 no que diz respeito aos requisitos aplicáveis aos produtos
    compostos isentos de controlos oficiais nos postos de controlo fronteiriços
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/887 al Comisiei din 28 martie 2022 de modificare
    a Regulamentului delegat (UE) 2019/625 în ceea ce privește codurile din Nomenclatura
    combinată și din Sistemul armonizat, precum și condițiile de import ale anumitor
    produse compuse, de modificare a Regulamentului delegat (UE) 2019/2122 în ceea
    ce privește anumite mărfuri și păsări de companie exceptate de la efectuarea
    controalelor oficiale la posturile de control la frontieră și de modificare
    a Regulamentului delegat (UE) 2021/630 în ceea ce privește cerințele pentru
    produsele compuse exceptate de la efectuarea controalelor oficiale la posturile
    de control la frontieră
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/887 z 28. marca 2022, ktorým
    sa mení delegované nariadenie (EÚ) 2019/625, pokiaľ ide o číselné znaky
    kombinovanej nomenklatúry a harmonizovaného systému a dovozné podmienky určitých
    zmiešaných výrobkov, ktorým sa mení delegované nariadenie (EÚ) 2019/2122,
    pokiaľ ide o určitý tovar a vtáky ako spoločenské zvieratá oslobodené
    od úradných kontrol na hraničných kontrolných staniciach, a ktorým sa mení
    delegované nariadenie (EÚ) 2021/630, pokiaľ ide o požiadavky na zmiešané
    výrobky oslobodené od úradných kontrol na hraničných kontrolných staniciach
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/887 z dne 28. marca 2022 o spremembi
    Delegirane uredbe (EU) 2019/625 glede oznak kombinirane nomenklature in harmoniziranega
    sistema ter uvoznih pogojev za nekatere sestavljene proizvode, spremembi Delegirane
    uredbe (EU) 2019/2122 glede nekaterega blaga in hišnih ptic, izvzetih iz uradnega
    nadzora na mejnih kontrolnih točkah, in spremembi Delegirane uredbe (EU) 2021/630
    glede zahtev za sestavljene proizvode, izvzete iz uradnega nadzora na mejnih kontrolnih
    točkah
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/887 de la Comisión de 28 de marzo de 2022
    por el que se modifica el Reglamento Delegado (UE) 2019/625 en lo que respecta
    a los códigos de la nomenclatura combinada y del sistema armonizado y a las condiciones
    de importación de determinados productos compuestos, se modifica el Reglamento
    Delegado (UE) 2019/2122 en lo que respecta a determinadas mercancías y aves de
    compañía exentas de controles oficiales en los puestos de control fronterizos
    y se modifica el Reglamento Delegado (UE) 2021/630 en lo que respecta a los requisitos
    para los productos compuestos exentos de controles oficiales en los puestos de
    control fronterizos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/887 av den 28 mars 2022
    om ändring av delegerad förordning (EU) 2019/625 vad gäller nummer i Kombinerade
    nomenklaturen och nummer enligt Harmoniserade systemet samt importvillkor för
    vissa sammansatta produkter, om ändring av delegerad förordning (EU) 2019/2122
    vad gäller vissa varor och sällskapsfåglar som är undantagna från offentlig
    kontroll vid gränskontrollstationer och om ändring av delegerad förordning
    (EU) 2021/630 vad gäller krav för sammansatta produkter som är undantagna från
    offentlig kontroll vid gränskontrollstationer
  type: main
