  script: Latn
  content: Commission Delegated Regulation (EU) 2024/1780 of 13 March 2024 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the conditions under which
    institutions are allowed to calculate KIRB in relation to the underlying exposures
    of a securitisation transaction
  type: main
- language: fr
  script: Latn
