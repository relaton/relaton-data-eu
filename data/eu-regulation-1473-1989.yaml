title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1473/89 of 26 May 1989 amending Regulation
    (EEC) No 4141/87 determining the conditions under which goods for certain categories
    of aircraft and ships are eligible on import for a favourable tariff arrangement
    by reason of their end-use
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1473/89 de la Commission du 26 mai 1989 modifiant
    le règlement (CEE) n° 4141/87 déterminant les conditions d'admission de produits
    destinés à certaines catégories d'aéronefs ou de bateaux au bénéfice d'un
    régime tarifaire favorable à l'importation en raison de leur destination particulière
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1473/89 DER KOMMISSION vom 26. Mai 1989 zur Änderung
    der Verordnung (EWG) Nr. 4141/87 zur Festlegung der Voraussetzungen für die Zulassung
    von Waren, die für bestimmte Arten von Luft- und Wasserfahrzeugen bestimmt sind,
    zur abgabenbegünstigten Einfuhr aufgrund ihrer besonderen Verwendung #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1473/89 af 26. maj 1989 om ændring
    af forordning (EØF) nr. 4141/87 om fastsættelse af betingelserne for adgang
    til toldlempelser ved indførsel af varer, bestemt til visse fly- eller skibskategorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1473/89 της Επιτροπής
    της 26ης Μαΐου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 4141/87 για τον καθορισμό των όρων υπαγωγής
    προϊόντων που προορίζονται για ορισμένες κατηγορίες
    αεροσκαφών ή πλοίων σε ευνοϊκό δασμολογικό
    καθεστώς κατά την εισαγωγή λόγω του ειδικού
    προορισμού τους
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1473/89 DELLA COMMISSIONE del 26 maggio 1989 che
    modifica il regolamento (CEE) n. 4141/87 che determina le condizioni per l'' ammissione
    di taluni prodotti destinati a talune categorie di aeromobili o di navi al beneficio
    di un regime tariffario favorevole all'' importazione in funzione della loro destinazione
    particolare #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1473/89 VAN DE COMMISSIE van 26 mei 1989 houdende
    wijziging van Verordening (EEG) nr. 4141/87 tot vaststelling van de voorwaarden
    en bepalingen waaraan voor produkten die voor bepaalde categorieën vliegtoestellen
    of schepen zijn bestemd, bij invoer, de toepassing van een gunstige tariefregeling
    in verband met de bijzondere bestemming van die produkten is onderworpen #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1473/89 DA COMISSAO de 26 de Maio de 1989 que altera
    o Regulamento (CEE) n* 4141/87, que determina as condiçoes a que subordina a
    admissao de produtos destinados a determinadas categorias de aeronaves ou de embarcaçoes
    ao beneficio de um regime pautal favoravel à importaçao em funçao do seu destino
    especial
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1473/89 DE LA COMISIÓN de 26 de mayo de 1989 por
    el que se modifica el Reglamento (CEE) no 4141/87 por el que se determinan las
    condiciones de admisión de productos destinados a determinadas categorías de
    aeronaves o de buques a los beneficios de un régimen arancelario de importación
    favorable, en razón de su destino especial #'
  type: main
