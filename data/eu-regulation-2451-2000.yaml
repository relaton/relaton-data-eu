    szabályainak megállapításáról, valamint a borászati eljárások és kezelések
    közösségi kódexének létrehozásáról szóló 1622/2000/EK rendeletnek a
    XIV. melléklet tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2451/2000 della Commissione, del 7 novembre 2000, recante
    modifica del regolamento (CE) n. 1622/2000 che fissa talune modalità d'applicazione
    del regolamento (CE) n. 1493/1999 relativo all'organizzazione comune del mercato
    vitivinicolo e che istituisce un codice comunitario delle pratiche e dei trattamenti
    enologici per quanto riguarda l'allegato XIV
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2451/2000 (2000. gada 7. novembris), ar kuru
    groza XIV pielikumu Regulai (EK) Nr. 1622/2000, kas nosaka konkrētus sīki izstrādātus
    noteikumus Regulas (EK) Nr. 1493/1999 par vīna tirgus kopīgo organizāciju ieviešanai
    un kas izveido Kopienas enoloģiskās prakses un procesu kodeksu
  type: main
- language: lt
  script: Latn
  content: 2000 m. lapkričio 7 d. Komisijos reglamentas (EB) Nr. 2451/2000, iš dalies
    keičiantis Reglamento (EB) Nr. 1622/2000, nustatančio tam tikras išsamias Reglamento
    (EB) Nr. 1493/1999 dėl bendro vyno rinkos organizavimo įgyvendinimo taisykles
    ir Bendrijos vynininkystės metodų ir procesų kodeksą, XIV priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2451/2000 tas-7 ta’ Novembru,
    2000, li jemenda r-Regolament (KE) Nru 1622/2000, li jipprovdi ċerti regoli dettaljati
    għall-implimentazzjoni tar-Regolament (KE) Nru 1493/1999 dwar l-organizzazzjoni
    komuni tas-suq ta’ l-inbid u li jistabilixxi kodiċi tal-Komunità dwar prattika
    u proċessi enoloġiċi, f’dak li għandu x’jaqsam ma’ Anness XIV
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2451/2000 van de Commissie van 7 november 2000 houdende
    wijziging van Verordening (EG) nr. 1622/2000 tot vaststelling van uitvoeringsbepalingen
    van Verordening (EG) nr. 1493/1999 houdende een gemeenschappelijke ordening van
    de wijnmarkt, en tot instelling van een communautaire regeling inzake oenologische
    procédés en behandelingen, wat bijlage XIV betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2451/2000 z dnia 7 listopada 2000 r. zmieniające
    rozporządzenie (WE) nr 1622/2000 ustanawiające niektóre szczegółowe zasady
    wykonania rozporządzenia (WE) nr 1493/1999 w sprawie wspólnej organizacji rynku
    wina oraz ustanawiające wspólnotowy kodeks praktyk i procesów enologicznych,
    w odniesieniu do załącznika XIV
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2451/2000 da Comissão, de 7 de Novembro de 2000,
    que altera o anexo XIV do Regulamento (CE) n.o 1622/2000, que estabelece determinadas
    normas de execução do Regulamento (CE) n.o 1493/1999, que estabelece a organização
    comum do mercado vitivinícola, e constitui um código comunitário das práticas
    e tratamentos enológicos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2451/2000 al Comisiei din 7 noiembrie 2000 de modificare
    a Regulamentului (CE) nr. 1622/2000 de stabilire a anumitor norme de aplicare
    a Regulamentului (CE) nr. 1493/1999 privind organizarea comună a pieței vitivinicole
    și de stabilire a Codului comunitar de practici și procedee oenologice, referitor
    la anexa XIV
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2451/2000 zo 7. novembra 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1622/2000 ustanovujúce určité podrobné pravidlá
    na vykonávanie nariadenia (ES) č. 1493/1999 o spoločnej organizácii trhu s
    vínom a zavádzajúce kód spoločenstva pre enologické metódy a postupy vzťahujúce
    sa na prílohu XIV
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2451/2000 z dne 7. novembra 2000 o spremembi
    Uredbe (ES) št. 1622/2000 o določitvi nekaterih podrobnih pravil za izvajanje
    Uredbe (ES) št. 1493/1999 o skupni ureditvi trga za vino in vzpostavitvi kodeksa
    Skupnosti na področju enoloških postopkov in obdelav, v zvezi s Prilogo XIV
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2451/2000 de la Comisión, de 7 de noviembre de 2000,
    que modifica, en lo que respecta al anexo XIV, el Reglamento (CE) nº 1622/2000
    que fija determinadas disposiciones de aplicación del Reglamento (CE) nº 1493/1999,
    por el que se establece la organización común del mercado vitivinícola, e introduce
    un código comunitario de prácticas y tratamientos enológicos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2451/2000 av den 7 november 2000 om ändring
    av förordning (EG) nr 1622/2000 om vissa tillämpningsföreskrifter för förordning
    (EG) nr 1493/1999 om den gemensamma organisationen av marknaden för vin och införandet
    av en gemenskapskodex för oenologiska metoder och behandlingar vad gäller bilaga
    XIV
