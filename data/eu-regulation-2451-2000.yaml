    le règlement (CE) nº 1622/2000 fixant certaines modalités d'application du
    règlement (CE) nº 1493/1999 portant organisation commune du marché vitivinicole
    et instituant un code communautaire des pratiques et traitements oenologiques
    en ce qui concerne l'annexe XIV
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2451/2000 der Kommission vom 7. November 2000 zur Änderung
