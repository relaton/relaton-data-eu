  script: Latn
  content: Commission Regulation (EC) No 2451/2000 of 7 November 2000 amending Regulation
    (EC) No 1622/2000 laying down certain detailed rules for implementing Regulation
    (EC) No 1493/1999 on the common organisation of the market in wine and establishing
    a Community code of oenological practices and processes, as regards Annex XIV
  type: main
- language: fr
  script: Latn
