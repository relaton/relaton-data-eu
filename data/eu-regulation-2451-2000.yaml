    zur Verordnung (EG) Nr. 1493/1999 über die gemeinsame Marktorganisation für
    Wein und zur Einführung eines Gemeinschaftskodex der önologischen Verfahren
    und Behandlungen
  type: main
- language: bg
  script: Cyrl
