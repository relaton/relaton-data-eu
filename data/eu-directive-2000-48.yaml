title:
- language: en
  script: Latn
  content: Commission Directive 2000/48/EC of 25 July 2000 amending the Annexes to
    Council Directives 86/362/EEC and 90/642/EEC on the fixing of maximum levels for
    pesticide residues in and on cereals and certain products of plant origin, including
    fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/48/CE de la Commission du 25 juillet 2000 modifiant les
    annexes des directives 86/362/CEE et 90/642/CEE du Conseil concernant la fixation
    de teneurs maximales pour les résidus de pesticides respectivement sur et dans
    les céréales et certains produits d'origine végétale, y compris les fruits
    et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/48/EG der Kommission vom 25. Juli 2000 zur Änderung der
    Anhänge der Richtlinien 86/362/EWG und 90/642/EWG des Rates über die Festsetzung
    von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln auf und
    in Getreide und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich
    Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/48/ЕО на Комисията от 25 юли
    2000 година за изменение на приложенията към
    Директиви 86/362/ЕИО и 90/642/ЕИО на Съвета относно
    определянето на максималните количества на
    остатъци от пестициди във и върху зърнените
    култури, храните от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/48/ES ze dne 25. července 2000, kterou se mění
    přílohy směrnic Rady 86/362/EHS a 90/642/EHS o stanovení maximálních limitů
    reziduí pesticidů v obilovinách a v některých produktech rostlinného původu,
    včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/48/EF af 25. juli 2000 om ændring af bilagene
    til Rådets direktiv 86/362/EØF og 90/642/EØF om fastsættelse af maksimalgrænseværdier
    for indholdet af pesticidrester i og på korn og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/48/ΕΚ της Επιτροπής, της 25ης Ιουλίου
    2000, για την τροποποίηση των παραρτημάτων των
    οδηγιών 86/362/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου
    που αφορούν, αντιστοίχως, τον καθορισμό των
    ανωτάτων περιεκτικοτήτων για τα υπολείμματα
    φυτοφαρμάκων πάνω και μέσα στα σιτηρά και σε
    ορισμένα προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/48/EÜ, 25. juuli 2000, millega muudetakse direktiivide
    86/362/EMÜ ja 90/642/EMÜ (vastavalt teraviljas ja teatavates taimsetes saadustes,
    kaasa arvatud puu- ja köögiviljas sisalduvate ja nende pinnal esinevate pestitsiidide
    jääkide piirnormide kehtestamise kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/48/EY, annettu 25 päivänä heinäkuuta 2000,
    viljojen torjunta-ainejäämien enimmäismääristä annetun neuvoston direktiivin
    86/362/ETY ja torjunta-ainejäämien enimmäismäärien vahvistamisesta tietyille
    kasvikunnasta peräisin oleville tuotteille, mukaan lukien hedelmät ja vihannekset,
    annetun neuvoston direktiivin 90/642/ETY liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/48/EK irányelve (2000. július 25.) a gabonafélékben,
    illetőleg az egyes növényi eredetű termékekben – többek között a gyümölcsökben
    és zöldségekben –, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 86/362/EGK,
    illetőleg 90/642/EGK irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/48/CE della Commissione, del 25 luglio 2000, recante modificazione
    degli allegati delle direttive 86/362/CEE e 90/642/CEE del Consiglio, che fissano
    le quantità massime di residui di antiparassitari rispettivamente sui e nei cereali
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/48/EK (2000. gada 25. jūlijs), ar ko groza pielikumus
    Padomes Direktīvām 86/362/EEK un 90/642/EEK par pesticīdu atliekvielu maksimāli
    pieļaujamo daudzumu noteikšanu attiecīgi labībā un uz tās un dažos augu
    izcelsmes produktos, tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 25 d. Komisijos direktyva 2000/48/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB ir 90/642/EEB, dėl didžiausių pesticidų likučių
    koncentracijų atitinkamai grūduose ir tam tikruose augalinės kilmės produktuose,
    įskaitant vaisius ir daržoves, bei ant jų, nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2000/48/KE tal-25 ta' Lulju 2000 li temenda
    l-Annessi mad-Direttivi tal-Kunsill 86/362/KEE u 90/642/KEE dwar l-iffissar tal-livelli
    massimi tal-fdalijiet tal-pestiċidi ġewwa u fuq iċ-ċereali u ċerti prodotti
    ta' oriġini mill- pjanti, inklużi l-frott u l-ħxejjex ta' l-ikel rispettivament
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/48/EG van de Commissie van 25 juli 2000 houdende wijziging
    van de bijlagen bij de Richtlijnen 86/362/EEG en 90/642/EEG van de Raad tot vaststelling
    van maximumgehalten aan residuen van bestrijdingsmiddelen in en op granen, respectievelijk
    in en op bepaalde producten van plantaardige oorsprong, met inbegrip van groenten
    en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/48/WE z dnia 25 lipca 2000 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG i 90/642/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w zbożach i niektórych produktach pochodzenia
    roślinnego, w tym, odpowiednio, w owocach i warzywach oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/48/CE da Comissão, de 25 de Julho de 2000, que altera os
    anexos das Directivas 86/362/CEE e 90/642/CEE do Conselho, relativas à fixação
    de teores máximos para os resíduos de pesticidas à superfície e no interior
    dos cereais e de determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/48/CE a Comisiei din 25 iulie 2000 de modificare a anexelor
    la Directivele 86/362/CEE și 90/642/CEE ale Consiliului de stabilire a conținuturilor
    maxime de reziduuri de pesticide din și de pe cereale și unele produse de origine
    vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/48/ES z 25. júla 2000, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS a 90/642/EHS o stanovení maximálnych hladín
    rezíduí pesticídov v a na obilninách a určitých produktoch rastlinného
    pôvodu vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije2000/48/ES z dne 25. julija 2000 o spremembi prilog k
    Direktivi Sveta 86/362/EGS in 90/642/EGS o določanju mejnih vrednosti ostankov
    pesticidov v in na žitih in nekaterih živilih rastlinskega izvora, vključno
    s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2000/48/CE de la Comisión, de 25 de julio de 2000, por la que
    se modifican los anexos de las Directivas 86/362/CEE y 90/642/CEE del Consejo,
    relativas a la fijación de los contenidos máximos de residuos de plaguicidas
    en los cereales y en determinados productos de origen vegetal, incluidas las frutas
    y hortalizas, respectivamente
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2000/48/EG av den 25 juli 2000 om ändring av bilagorna
    till rådets direktiv 86/362/EEG och 90/642/EEG om fastställande av gränsvärden
    för bekämpningsmedelsrester i och på spannmål samt vissa produkter av vegetabiliskt
    ursprung inklusive frukt och grönsaker
