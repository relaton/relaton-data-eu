    suunatud eripiirangud ja tunnistatakse kehtetuks nõukogu määrus (EÜ) nr 467/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1644/2002, annettu 13 päivänä syyskuuta 2002,
