    određenih osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom
    i talibanima te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1644/2002/EK rendelete (2002. szeptember 13.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet harmadik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1644/2002 della Commissione, del 13 settembre 2002,
    recante terza modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1644/2002 (2002. gada 13. septembris), ar ko
    trešo reizi groza Padomes Regulu (EK) Nr. 881/2002, ar kuru nosaka īpašus ierobežojošus
    pasākumus, kas vērsti pret konkrētām personām un organizācijām, kas saistītas
    ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban, un ar kuru atceļ Padomes Regulu
    (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2002 m. rugsėjo 13 d. Komisijos reglamentas (EB) Nr. 1644/2002, trečią
    kartą iš dalies keičiantis Tarybos reglamentą (EB) Nr. 881/2002, nustatantį
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Usama bin Ladenu, Al-Qaida tinklu ir Talibanu, ir panaikinantį
    Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1644/2002 tat-13 ta' Settembru 2002
    li jemenda għat-tielet darba r-Regolament tal-Kunsill (KE) Nru 881/2002 u jimponi
    ċerti miżuri speċifiċi restrittivi diretti lejn ċerti persuni u entitajiet
    assoċjati ma’ Usama bin Laden, in-networks ta' l-Al-Qaida u t-Taliban, u jirrevoka
    Regolament tal-Kunsill (KE) Nru 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1644/2002 van de Commissie van 13 september 2002 tot
