    szczególne środki ograniczające skierowane przeciwko niektórym osobom i podmiotom
    związanym z Osamą bin Ladenem, siecią Al-Kaida i talibami i uchylające rozporządzenie
    Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1644/2002 da Comissão, de 13 de Setembro de 2002,
    que altera pela terceira vez o Regulamento (CE) n.° 881/2002 do Conselho que
    institui certas medidas restritivas específicas contra determinadas pessoas e
    entidades associadas a Osama bin Laden, à rede Al-Qaida e aos talibã, e que
    revoga o Regulamento (CE) n.° 467/2001 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1644/2002 al Comisiei din 13 septembrie 2002 de efectuare
