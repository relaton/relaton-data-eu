title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1644/2002 of 13 September 2002 amending for
    the third time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1644/2002 de la Commission du 13 septembre 2002 modifiant
    pour la troisième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1644/2002 der Kommission vom 13. September 2002 zur
    dritten Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung
    bestimmter spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates
  type: main
- language: bg
  script: Cyrl
