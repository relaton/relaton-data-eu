    die banden hebben met Usama bin Laden, het Al Qa'ida-netwerk en de Taliban, en
    tot intrekking van Verordening (EG) nr. 467/2001
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1644/2002 z dnia 13 września 2002 r. zmieniające
