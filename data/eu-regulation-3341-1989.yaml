  content: Commission Regulation (EEC) No 3341/89 of 7 November 1989 re-establishing
    the levying of customs duties on women's or girls'dresses, of wool, cotton or
    man-made fibres, products of category 26 (order No 40.0260), originating in Indonesia,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3341/89 de la Commission du 7 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux robes pour
    femmes ou fillettes, de laine, de coton ou de fibres synthétiques ou artificielles,
    de la catégorie de produits n° 26 (numéro d'ordre 40.0260) originaires de l'Indonésie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3341/89 DER KOMMISSION vom 7. November 1989 zur Wiedereinführung
