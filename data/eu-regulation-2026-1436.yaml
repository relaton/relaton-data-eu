  content: Commission Delegated Regulation (EU) 2026/1436 of 1 July 2026 supplementing
    Directive (EU) 2024/2841 of the European Parliament and of the Council as regards
    setting the QR code on the physical version of the European Disability Card and
    setting the QR code and establishing common technical specifications that ensure
    the security of the physical version of the European Parking Card for persons
    with disabilities, as well as interoperability matters
  type: main
