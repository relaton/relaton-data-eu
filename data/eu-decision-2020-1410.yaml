    Systemu Zharmonizowanego Światowej Organizacji Celnej w odniesieniu do planowanego
    przyjęcia opinii klasyfikacyjnych, decyzji dotyczących klasyfikacji, zmian not
    wyjaśniających do Systemu Zharmonizowanego (HS) lub innych wskazówek dotyczących
    interpretacji Systemu Zharmonizowanego, a także zaleceń mających zabezpieczać
    jednolitość interpretacji Systemu Zharmonizowanego w ramach konwencji w sprawie
    Systemu Zharmonizowanego
  type: main
