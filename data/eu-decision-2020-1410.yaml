    taħt il-Konvenzjoni dwar is-Sistema Armonizzata
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2020/1410 van de Raad van 25 september 2020 betreffende het
    standpunt dat namens de Europese Unie moet worden ingenomen tijdens de 66e zitting
    van het Comité voor het geharmoniseerde systeem van de Werelddouaneorganisatie
    met betrekking tot de beoogde vaststelling van indelingsadviezen, indelingsbesluiten,
    wijzigingen van de toelichting bij het geharmoniseerde systeem of andere adviezen
    voor de interpretatie van het geharmoniseerde systeem en van aanbevelingen teneinde
    de uniformiteit in de interpretatie van het geharmoniseerde systeem in het kader
    van het Verdrag betreffende het geharmoniseerde systeem te verzekeren
  type: main
