  script: Latn
  content: Nõukogu otsus (EL) 2020/1410, 25. september 2020, Euroopa Liidu nimel
    võetava seisukoha kohta Maailma Tolliorganisatsiooni harmoneeritud süsteemi
    komitee 66. istungil seoses klassifitseerimise arvamuste, klassifitseerimise otsuste,
    harmoneeritud süsteemi selgitavate märkuste muudatuste või muude harmoneeritud
    süsteemi tõlgendamist käsitlevate nõuannete kavandatud vastuvõtmisega ning
    soovituste kavandatud vastuvõtmisega harmoneeritud süsteemi ühetaolise tõlgendamise
    tagamiseks harmoneeritud süsteemi konventsiooni alusel
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2020/1410, annettu 25 päivänä syyskuuta 2020,
    Maailman tullijärjestön harmonoidun järjestelmän komitean 66. istunnossa Euroopan
    unionin puolesta otettavasta kannasta, joka koskee suunnitteilla olevaa luokittelusuositusten,
    luokittelupäätösten, harmonoidun järjestelmän selitysten tai muiden ohjeiden
    muuttamista harmonoidun järjestelmän tulkinnan osalta sekä suosituksia harmonoidun
    järjestelmän tulkinnan yhdenmukaisuuden varmistamiseksi harmonoidun järjestelmän
    yleissopimuksen mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2020/1410 ón gComhairle an 25 Meán Fómhair 2020 maidir
