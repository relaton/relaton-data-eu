    do Sistema Harmonizado da Organização Mundial das Alfândegas, no que respeita
    à adoção prevista de pareceres de classificação, decisões de classificação,
    alterações das notas explicativas do Sistema Harmonizado ou outros pareceres
    sobre a interpretação do Sistema Harmonizado e recomendações destinadas a
    assegurar a interpretação uniforme do Sistema Harmonizado no âmbito da Convenção
    do Sistema Harmonizado
  type: main
