title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/1410 of 25 September 2020 on the position to
    be taken, on behalf of the European Union, in the 66th session of the Harmonized
    System Committee of the World Customs Organization in relation to the envisaged
    adoption of Classification opinions, classification decisions, amendments to the
    Harmonized System Explanatory Notes or other advice on the interpretation of the
    Harmonized System, and of recommendations to secure uniformity in the interpretation
    of the Harmonized System under the Harmonized System Convention
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1410 du Conseil du 25 septembre 2020 relative à la
    position à prendre, au nom de l’Union européenne, lors de la 66e session du
    comité du système harmonisé de l’Organisation mondiale des douanes en ce
    qui concerne l’adoption envisagée d’avis de classement, de décisions de
    classement, de modifications des notes explicatives du système harmonisé ou
    d’autres avis se rapportant à l’interprétation du système harmonisé, ainsi
    que de recommandations visant à assurer l’interprétation uniforme du système
    harmonisé dans le cadre de la convention sur le système harmonisé
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/1410 des Rates vom 25. September 2020 über den im
    Namen der Europäischen Union in der 66. Sitzung des Ausschusses für das Harmonisierte
    System der Weltzollorganisation hinsichtlich der geplanten Annahme von Einreihungsavisen,
    Beschlüssen über die zolltarifliche Einreihung, Änderungen der Erläuterungen
    zum Harmonisierten System oder sonstigen Stellungnahmen zur Auslegung des Harmonisierten
    Systems sowie von Empfehlungen zur Gewährleistung einer einheitlichen Auslegung
    des Harmonisierten Systems im Rahmen des Übereinkommens über das Harmonisierte
    System zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2020/1410 на Съвета от 25 септември
    2020 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 66-ата
    сесия на Комитета по Хармонизираната система
    към Световната митническа организация във
    връзка с предвиденото приемане на мнения за
    класиране, решения за класиране, изменения
    на Обяснителните бележки към Хармонизираната
    система или други съвети относно тълкуването
    на Хармонизираната система и на препоръки
    за осигуряване на унифицирано тълкуване на
    Хармонизираната система съгласно Конвенцията
    за Хармонизираната система
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) 2020/1410 ze dne 25. září 2020 o postoji, který
    má být jménem Evropské unie zaujat na 66. zasedání Výboru pro harmonizovaný
    systém Světové celní organizace, pokud jde o plánované přijetí stanovisek
    k sazebnímu zařazení, rozhodnutí o sazebním zařazení, změn vysvětlivek
    k harmonizovanému systému nebo jiných pokynů k výkladu harmonizovaného systému
    a doporučení potřebných k zajištění jednotného výkladu harmonizovaného
    systému podle úmluvy o harmonizovaném systému
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2020/1410 af 25. september 2020 om den holdning,
    der skal indtages på Den Europæiske Unions vegne på det 66. møde i Udvalget
    for Det Harmoniserede System under Verdenstoldorganisationen, med hensyn til den
    påtænkte vedtagelse af tariferingsudtalelser, tariferingsafgørelser, ændringer
    af de forklarende bemærkninger til det harmoniserede system eller øvrige udtalelser
    vedrørende fortolkningen af det harmoniserede system samt til rekommandationer
    til sikring af ensartethed i fortolkningen af det harmoniserede system i henhold
    til konventionen om det harmoniserede system
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2020/1410 του Συμβουλίου της 25ης
    Σεπτεμβρίου 2020 σχετικά με τη θέση που πρέπει
    να ληφθεί, εξ ονόματος της Ευρωπαϊκής Ένωσης,
