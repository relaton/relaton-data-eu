    il-pożizzjoni li trid tittieħed, f’isem l-Unjoni Ewropea, fis-66 sessjoni
    tal-Kumitat tas-Sistema Armonizzata tal-Organizzazzjoni Dinjija Doganali fir-rigward
    tal-adozzjoni maħsuba ta’ Opinjonijiet ta’ Klassifikazzjoni, deċiżjonijiet
    ta’ klassifikazzjoni, emendi għan-Noti ta’ Spjegazzjoni tas-Sistema Armonizzata
