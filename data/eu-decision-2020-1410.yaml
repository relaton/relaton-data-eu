    sistēmas komitejas 66. sesijā attiecībā uz klasifikācijas atzinumu, klasifikācijas
    lēmumu, Harmonizētās sistēmas skaidrojumu grozījumu vai citu padomu par Harmonizētās
    sistēmas interpretāciju iecerēto pieņemšanu un attiecībā uz ieteikumu pieņemšanu
