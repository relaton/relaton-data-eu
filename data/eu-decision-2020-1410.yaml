  script: Latn
  content: Rozhodnutie Rady (EÚ) 2020/1410 z 25. septembra 2020 o pozícii, ktorá
    sa má v mene Európskej únie zaujať na 66. zasadnutí Výboru pre harmonizovaný
    systém Svetovej colnej organizácie, pokiaľ ide o pripravované prijatie stanovísk
    k zatriedeniu, rozhodnutí o zatriedení, zmien vysvetliviek k harmonizovanému
    systému alebo iného poradenstva týkajúceho sa výkladu harmonizovaného systému
    a odporúčaní na zabezpečenie jednotnosti pri výklade harmonizovaného systému
    podľa dohovoru o harmonizovanom systéme
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2020/1410 z dne 25. septembra 2020 o stališču, ki se
    v imenu Evropske unije zastopa na 66. seji Odbora za harmonizirani sistem Svetovne
    carinske organizacije v zvezi s predvidenim sprejetjem mnenj o uvrstitvi, odločitev
    o uvrstitvi, sprememb pojasnjevalnih opomb harmoniziranega sistema ali drugih
    nasvetov glede razlage harmoniziranega sistema ter predvidenim sprejetjem priporočil
    za zagotovitev enotne razlage harmoniziranega sistema v skladu s Konvencijo o
    harmoniziranem sistemu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2020/1410 del Consejo de 25 de septiembre de 2020 sobre
    la posición que debe adoptarse, en nombre de la Unión Europea, en la 66.a sesión
    del Comité del Sistema Armonizado de la Organización Mundial de Aduanas en relación
    con la adopción prevista de criterios de clasificación, decisiones de clasificación,
    modificaciones de las notas explicativas del Sistema Armonizado u otros criterios
    para la interpretación del Sistema Armonizado, y recomendaciones para asegurar
    la interpretación uniforme del Sistema Armonizado en el marco del Convenio del
    Sistema Armonizado
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2020/1410 av den 25 september 2020 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar vid det sextiosjätte mötet i kommittén
    för Harmoniserade systemet inom ramen för Världstullorganisationen avseende
    det planerade antagandet av klassificeringsuttalanden, klassificeringsbeslut,
    ändringar av de förklarande anmärkningarna till Harmoniserade systemet eller
    andra anvisningar till ledning vid tolkningen av Harmoniserade systemet samt av
    rekommendationer för att säkerställa en enhetlig tolkning av Harmoniserade
    systemet inom ramen för konventionen om Harmoniserade systemet
