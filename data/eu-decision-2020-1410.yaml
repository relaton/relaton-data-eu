  script: Latn
  content: Decizia (UE) 2020/1410 a Consiliului din 25 septembrie 2020 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul celei de
    a 66-a sesiuni a Comitetului Sistemului armonizat al Organizației Mondiale a
    Vămilor în ceea ce privește adoptarea preconizată de avize de clasificare,
    decizii de clasificare, modificări aduse notelor explicative ale Sistemului armonizat
    sau de alte avize privind interpretarea Sistemului armonizat și de recomandări
    pentru asigurarea unei interpretări uniforme a Sistemului armonizat în temeiul
    Convenției privind sistemul armonizat
  type: main
