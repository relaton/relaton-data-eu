  script: Latn
  content: Odluka Vijeća (EU) 2020/1410 od 25. rujna 2020. o stajalištu koje treba
    zauzeti u ime Europske unije na 66. sjednici Odbora za Harmonizirani sustav u
    okviru Svjetske carinske organizacije u pogledu predviđenog donošenja mišljenja
    o razvrstavanju, odluka o razvrstavanju, izmjena napomena s objašnjenjem Harmoniziranog
    sustava ili drugih stajališta za tumačenje Harmoniziranog sustava te donošenja
    preporuka radi osiguravanja jedinstvenog tumačenja Harmoniziranog sustava u skladu
    s Konvencijom o Harmoniziranom sustavu
  type: main
