    organizacijos Suderintos sistemos komiteto sesijoje, dėl pagal Konvenciją dėl
    Suderintos sistemos numatomų priimti klasifikavimo nuomonių, klasifikavimo sprendimų,
    Suderintos sistemos aiškinamųjų pastabų ar kitų pasiūlymų dėl Suderintos
    sistemos aiškinimo pakeitimų ir rekomendacijų Suderintos sistemos aiškinimo
    vienodumui užtikrinti
  type: main
