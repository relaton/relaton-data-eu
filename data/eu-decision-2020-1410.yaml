  script: Latn
  content: A Tanács (EU) 2020/1410 határozata (2020. szeptember 25.) az Európai
    Unió által a Vámigazgatások Világszervezete (WCO) Harmonizált Rendszer Bizottságának
    66. ülésén az áruosztályozási vélemények, osztályba sorolási határozatok,
    a Harmonizált Rendszer Magyarázatának módosításai, valamint a Harmonizált
    Rendszer értelmezésére vonatkozó egyéb tanácsok, továbbá a Harmonizált
    Rendszernek a Harmonizált Áruleíró és Kódrendszerről szóló nemzetközi
    egyezmény szerinti egységes értelmezését és alkalmazását biztosító ajánlások
    tervezett elfogadásával kapcsolatban képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2020/1410 del Consiglio del 25 settembre 2020 sulla posizione
    da adottare, a nome dell’Unione europea, nella 66a sessione del comitato del
    sistema armonizzato dell’Organizzazione mondiale delle dogane in relazione alla
    prevista adozione di pareri di classificazione, decisioni di classificazione,
    modifiche delle note esplicative del sistema armonizzato o altri pareri relativi
    all’interpretazione del sistema armonizzato, nonché di raccomandazioni intese
    ad assicurare un’interpretazione uniforme del sistema armonizzato nell’ambito
    della convenzione del sistema armonizzato
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2020/1410 (2020. gada 25. septembris) par nostāju,
