  script: Latn
  content: COMMISSION REGULATION (EEC) No 1802/93 of 6 July 1993 on the arrangement
    applicable to agricultural products subject to reference quantities and statistical
    surveillance originating in the African, Carribean and Pacific States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1802/93 de la Commission du 6 juillet 1993 concernant
    la procédure à appliquer à certains produits agricoles, soumis à quantités
    de référence et à surveillance statistique, originaires des États d'Afrique,
    des Caraïbes et du Pacifique
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1802/93 DER KOMMISSION vom 6. Juli 1993 über das
    Verfahren, das auf bestimmte landwirtschaftliche Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean, die einer Kontrolle der
    Referenzmengen und statistischer Überwachung unterworfen sind, anzuwenden ist
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1802/93 af 6. juli 1993 om den ordning,
    der skal gælde for visse landbrugsprodukter, som er undergivet en referencemængde
    og statistisk overvågning, med oprindelse i staterne i Afrika, Vestindien og
    Stillehavet
  type: main
- language: el
  script: Grek
