    της 6ης Ιουλίου 1993 σχετικά με τη διαδικασία
    που θα εφαρμόζεται σε ορισμένα αγροτικά προϊόντα
    που υπόκεινται σε ποσότητες αναφοράς και στατιστική
    επιτήρηση, καταγωγής των κρατών της Αφρικής,
    της Καραϊβικής και του Ειρηνικού
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1802/93 DELLA COMMISSIONE del 6 luglio 1993 relativo
    alla procedura applicabile a determinati prodotti agricoli, sottoposti a delle
    quantità di riferimento, a sorveglianza statistica originari degli Stati dell'
    Africa, dei Caraibi e del Pacifico (ACP)
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1802/93 VAN DE COMMISSIE van 6 juli 1993 betreffende
    de procedure die van toepassing is op bepaalde landbouwprodukten, waarvoor een
    referentiehoeveelheid en een statistisch toezicht zijn vastgesteld, van oorsprong
    uit de Staten in Afrika, het Caribische gebied en de Stille Oceaan (ACS-Staten)
  type: main
