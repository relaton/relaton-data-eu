    von im GATT gebundenen Gemeinschaftszollkontingenten und bestimmten anderen Gemeinschaftszollkontingenten
    für einige landwirtschaftliche und gewerbliche Erzeugnisse sowie Fischereierzeugnisse
    und zur Einführung eines Verfahrens zur Änderung oder Anpassung dieser Zollkontingente
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EG) nr. 1340/97 af 11. juli 1997 om ændring
