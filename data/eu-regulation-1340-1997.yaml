  script: Latn
  content: Commission Regulation (EC) No 1340/97 of 11 July 1997 amending Annex I
    to Council Regulation (EC) No 1808/95 opening and providing for the administration
    of Community tariff quotas bound in GATT and certain other Community tariff quotas
    for certain agricultural, industrial and fisheries products and establishing the
    detailed provisions for adapting these quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1340/97 de la Commission du 11 juillet 1997 modifiant
    l'annexe I du règlement (CE) nº 1808/95 du Conseil portant ouverture et mode
    de gestion de contingents tarifaires communautaires consolidés au GATT et de
    certains autres contingents tarifaires communautaires pour certains produits agricoles,
    industriels et de la pêche, et définissant les modalités d'amendement ou d'adaptation
    desdits contingents
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1340/97 der Kommission vom 11. Juli 1997 zur Änderung
