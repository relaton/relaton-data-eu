  script: Latn
  content: Commission Regulation (EC) No 498/2008 of 4 June 2008 amending Regulation
    (EC) No 1580/2007 as regards the trigger levels for additional duties on tomatoes,
    apricots, lemons, plums, peaches, including nectarines, pears and table grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 498/2008 de la Commission du 4 juin 2008 modifiant
    le règlement (CE) n o 1580/2007, en ce qui concerne les volumes de déclenchement
    des droits additionnels pour les tomates, les abricots, les citrons, les prunes,
    les pêches, y compris les brugnons et nectarines, les poires et les raisins de
    table
  type: main
- language: de
  script: Latn
