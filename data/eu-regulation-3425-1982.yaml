title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3425/82 of 17 December 1982 opening, allocating
    and providing for the administration of a Community tariff quota for newsprint
    falling within subheading 48.01 A of the Common Customs Tariff (1983) and extending
    this quota to include certain other types of paper
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3425/82 du Conseil, du 17 décembre 1982, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de papier journal, de la sous-position 48.01 A du tarif douanier commun (année
    1983), et étendant le bénéfice de ce même contingent à certains autres papiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3425/82 des Rates vom 17. Dezember 1982 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Zeitungsdruckpapier
    der Tarifstelle 48.01 A des Gemeinsamen Zolltarifs (1983) und zur Ausdehnung dieses
    Kontingents auf bestimmte andere Papiere
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3425/82 af 17. december 1982 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for avispapir henhørende
    under pos. 48.01 A i den fælles toldtarif (1983) og om udvidelse af dette kontingent
    til også at omfatte visse andre former for papir
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3425/82 τού Συμβουλίου
    τής 17ης Δεκεμβρίου 1982 περί ανοίγματος, κατανομής
    καί τρόπου διαχειρίσεως μιάς κοινοτικής δασμολογικής
    ποσοστώσεως γιά τόν χάρτη εφημερίδων, τής διακρίσεως
    48. 01 Α τού Κοινού Δασμολογίου (1983), καί περί επεκτάσεως
    τού ευεργετήματος τής ίδιας ποσοστώσεως σέ
    ορισμένους άλλους χάρτες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3425/82 del Consiglio, del 17 dicembre 1982, relativo
    all' apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di carta da giornale, della sottovoce 48.01 A della tariffa
    doganale comune (1983), e relativo all' estensione del beneficio dello stesso
    contingente a talune altre carte
  type: main
- language: nl
