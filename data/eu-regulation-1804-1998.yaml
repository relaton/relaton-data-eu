  type: main
- language: hu
  script: Latn
  content: A Tanács 1804/98/EK rendelete (1998. augusztus 14.) a kukoricakeményítő-gyártás
    23031019 és 23099020 KN-kód alá tartozó maradékaira alkalmazandó autonóm
    vám létrehozásáról, valamint az Amerikai Egyesült Államokból származó,
