  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1804/98 del Consiglio del 14 agosto 1998 che stabilisce
    un dazio autonomo applicabile ai residui della fabbricazione degli amidi di granturco
    dei codici NC 2303 10 19 e 2309 90 20 e che introduce un contingente tariffario
    per le importazioni di residui della fabbricazione degli amidi di granturco (farina
    glutinata di granturco - corn gluten feed) dei codici NC 2303 10 19 e 2309 90
    20, originarie degli Stati Uniti d'America
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1804/98 (1998. gada 14. augusts), ar ko nosaka
    autonomu nodokli, kuru piemēro atliekām no kukurūzas cietes ražošanas, uz
    ko attiecas KN kodi 23031019 un 23099020, un ievieš tarifu likmes kvotu par to
    atlieku importu, kas iegūtas no kukurūzas cietes ražošanas (kukurūzas lipekļa
    lopbarība), uz kuru attiecas KN kodi 23031019 un 23099020, un kā izcelsme ir
