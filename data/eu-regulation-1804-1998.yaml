title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1804/98 of 14 August 1998 establishing an autonomous
    duty applicable for residues from the manufacture of starch from maize falling
    within CN codes 2303 10 19 and 2309 90 20 and introducing a tariff rate quota
    on imports of residues from the manufacture of starch from maize (corn gluten
    feed) falling within CN codes 2303 10 19 and 2309 90 20 originating in the United
    States of America
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1804/98 du Conseil du 14 août 1998 établissant un
    droit autonome applicable aux résidus de la fabrication d'amidon de maïs relevant
    des codes NC 2303 10 19 et 2309 90 20 et introduisant un contingent tarifaire
    pour les importations des résidus de la fabrication d'amidon de maïs (aliment
    à base de gluten de maïs) relevant des codes NC 2303 10 19 et 2309 90 20 en
    provenance des États-Unis d'Amérique
  type: main
