title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2440/87 of 12 August 1987 re-establishing
    the levying of customs duties on quartz watches, falling within heading No ex
    91.01, originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2440/87 de la Commission du 12 août 1987 portant
    rétablissement de la perception des droits de douane applicables aux montres
    à quartz, de la position ex 91.01 du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3924/86 du Conseil
  type: main
- language: de
  script: Latn
