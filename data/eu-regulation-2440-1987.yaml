    Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3924/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2440/87 af 12. august 1987 om genindførelse
