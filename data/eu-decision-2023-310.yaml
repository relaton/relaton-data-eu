  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/310 van de Raad van 6 februari 2023 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen in het Gespecialiseerd Comité
    voor coördinatie van de sociale zekerheid — dat is opgericht uit hoofde van
    de handels- en samenwerkingsovereenkomst tussen de Europese Unie en de Europese
    Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk van Groot-Brittannië
    en Noord-Ierland, anderzijds — met betrekking tot het gebruik van het systeem
    voor de elektronische uitwisseling van gegevens betreffende sociale zekerheid
    voor de uitwisseling van gegevens tussen organen en verbindingsorganen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/310 z dnia 6 lutego 2023 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii w ramach Specjalnego Komitetu ds. Koordynacji
    Zabezpieczenia Społecznego ustanowionego na mocy Umowy o handlu i współpracy
    między Unią Europejską i Europejską Wspólnotą Energii Atomowej, z jednej
    strony, a Zjednoczonym Królestwem Wielkiej Brytanii i Irlandii Północnej, z
    drugiej strony, w związku z wykorzystaniem systemu elektronicznej wymiany informacji
    dotyczących zabezpieczenia społecznego na potrzeby przekazywania danych między
    instytucjami lub instytucjami łącznikowymi
  type: main
- language: pt
  script: Latn
