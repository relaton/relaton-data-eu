    specializat privind coordonarea sistemelor de securitate socială instituit în
    temeiul Acordului comercial și de cooperare dintre Uniunea Europeană și Comunitatea
    Europeană a Energiei Atomice, pe de o parte, și Regatul Unit al Marii Britanii
    și Irlandei de Nord, pe de altă parte, în ceea ce privește utilizarea Schimbului
    electronic de informații privind securitatea socială pentru transmiterea datelor
    între instituții sau organisme de legătură
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/310 zo 6. februára 2023 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Osobitnom výbore pre koordináciu sociálneho
    zabezpečenia zriadenom Dohodou o obchode a spolupráci medzi Európskou úniou
    a Európskym spoločenstvom pre atómovú energiu na jednej strane a Spojeným
    kráľovstvom Veľkej Británie a Severného Írska na strane druhej, pokiaľ
    ide o používanie elektronickej výmeny informácií o sociálnom zabezpečení
    na prenos údajov medzi inštitúciami alebo styčnými orgánmi
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/310 z dne 6. februarja 2023 o stališču, ki se v
    imenu Evropske unije zastopa v Specializiranem odboru za koordinacijo sistemov
    socialne varnosti, ustanovljenem s Sporazumom o trgovini in sodelovanju med Evropsko
    unijo in Evropsko skupnostjo za atomsko energijo na eni strani ter Združenim
    kraljestvom Velika Britanija in Severna Irska na drugi strani, glede uporabe elektronske
    izmenjave informacij o socialni varnosti za prenos podatkov med nosilci ali organi
    za zvezo
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/310 del Consejo de 6 de febrero de 2023 sobre la posición
    que debe adoptarse, en nombre de la Unión Europea, en el Comité Especializado
    en Coordinación de la Seguridad Social creado en el marco del Acuerdo de Comercio
    y Cooperación entre la Unión Europea y la Comunidad Europea de la Energía Atómica,
    por una parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra,
    en lo que respecta al uso del intercambio electrónico de información sobre seguridad
    social para la transmisión de datos entre las instituciones o los organismos
    de enlace
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/310 av den 6 februari 2023 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den specialiserade kommitté för
    samordning av de sociala trygghetssystemen som inrättats genom avtalet om handel
    och samarbete mellan Europeiska unionen och Europeiska atomenergigemenskapen,
    å ena sidan, och Förenade konungariket Storbritannien och Nordirland, å andra
    sidan, vad gäller användningen av systemet för elektroniskt utbyte av socialförsäkringsuppgifter
    vid överföring av uppgifter mellan institutioner eller förbindelseorgan
