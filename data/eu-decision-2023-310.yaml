  script: Latn
  content: Odluka Vijeća (EU) 2023/310 od 6. veljače 2023. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Posebnog odbora za koordinaciju socijalne
    sigurnosti koji je osnovan Sporazumom o trgovini i suradnji između Europske unije
    i Europske zajednice za atomsku energiju, s jedne strane, i Ujedinjene Kraljevine
    Velike Britanije i Sjeverne Irske, s druge strane, u pogledu uporabe elektroničke
    razmjene informacija o socijalnoj sigurnosti za prijenos podataka između ustanova
    ili tijela za vezu
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/310 határozata (2023. február 6.) az egyrészről
    az Európai Unió és az Európai Atomenergia-közösség, és másrészről Nagy-Britannia
    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodással létrehozott, a szociális biztonsági rendszerek koordinációjával
    foglalkozó szakbizottságban a szociális biztonságra vonatkozó információk
    elektronikus adatcseréjének az intézmények vagy összekötő szervek közötti
    adattovábbításra történő alkalmazása tekintetében az Európai Unió nevében
    képviselendő álláspont meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/310 del Consiglio del 6 febbraio 2023 relativa alla
    posizione da adottare a nome dell’Unione europea in sede di comitato specializzato
    per il coordinamento della sicurezza sociale istituito a norma dell’accordo
    sugli scambi commerciali e la cooperazione tra l’Unione europea e la Comunità
    europea dell’energia atomica, da una parte, e il Regno Unito di Gran Bretagna
    e Irlanda del Nord, dall’altra, per quanto riguarda l’utilizzo del sistema
    di scambio elettronico di informazioni sulla sicurezza sociale per la trasmissione
    dei dati tra le istituzioni o gli organismi di collegamento
  type: main
