title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/310 of 6 February 2023 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Social
    Security Coordination established under the Trade and Cooperation Agreement between
    the European Union and the European Atomic Energy Community, of the one part,
    and the United Kingdom of Great Britain and Northern Ireland, of the other part,
    as regards the use of the Electronic Exchange of Social Security Information for
    the transmission of data between institutions or liaison bodies
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/310 du Conseil du 6 février 2023 établissant la position
    à prendre, au nom de l’Union européenne, au sein du comité spécialisé chargé
    de la coordination de la sécurité sociale institué en vertu de l’accord de
    commerce et de coopération entre l’Union européenne et la Communauté européenne
    de l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et
    d’Irlande du Nord, d’autre part, en ce qui concerne l’utilisation de l’échange
    électronique d’informations sur la sécurité sociale aux fins de la transmission
    de données entre les institutions ou les organismes de liaison
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/310 des Rates vom 6. Februar 2023 zur Festlegung des
    im Namen der Europäischen Union in dem durch das Abkommen über Handel und Zusammenarbeit
    zwischen der Europäischen Union und der Europäischen Atomgemeinschaft einerseits
    und dem Vereinigten Königreich Großbritannien und Nordirland andererseits eingesetzten
    Sonderausschuss für die Koordinierung der sozialen Sicherheit im Hinblick auf
    die Nutzung des elektronischen Austauschs von Sozialversicherungsdaten für die
    Übermittlung von Daten zwischen den Trägern oder den Verbindungsstellen zu vertretenden
    Standpunkts
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/310 на Съвета от 6 февруари
    2023 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Специализирания комитет по координация
    в областта на социалната сигурност, създаден
    съгласно Споразумението за търговия и сътрудничество
    между Европейския съюз и Европейската общност
    за атомна енергия, от една страна, и Обединеното
    кралство Великобритания и Северна Ирландия,
    от друга страна, във връзка с използването
    на системата за електронен обмен на данни за
    социалната сигурност при предаването на данни
    между институциите и органите за връзка
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/310 ze dne 6. února 2023 o postoji, který
    má být jménem Evropské unie zaujat ve specializovaném výboru pro koordinaci
    sociálního zabezpečení zřízeném Dohodou o obchodu a spolupráci mezi Evropskou
    unií a Evropským společenstvím pro atomovou energii na jedné straně a Spojeným
    královstvím Velké Británie a Severního Irska na straně druhé, pokud jde
    o používání systému elektronické výměny informací o sociálním zabezpečení
    pro přenos údajů mezi institucemi nebo styčnými místy
  type: main
