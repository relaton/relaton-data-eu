  script: Latn
  content: Rådets afgørelse (EU) 2023/310 af 6. februar 2023 om den holdning, der
    skal indtages på Den Europæiske Unions vegne i Specialudvalget om Koordinering
    af Sociale Sikringsordninger, som er nedsat ved handels- og samarbejdsaftalen
    mellem Den Europæiske Union og Det Europæiske Atomenergifællesskab på den
    ene side og Det Forenede Kongerige Storbritannien og Nordirland på den anden
