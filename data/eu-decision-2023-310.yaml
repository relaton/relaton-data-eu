    nodrošinājuma koordinācijas jomā, kura izveidota ar Tirdzniecības un sadarbības
    nolīgumu starp Eiropas Savienību un Eiropas Atomenerģijas kopienu, no vienas
    puses, un Lielbritānijas un Ziemeļīrijas Apvienoto Karalisti, no otras puses,
    attiecībā uz sociālā nodrošinājuma informācijas elektroniskās apmaiņas
    izmantošanu datu nosūtīšanai starp iestādēm vai sadarbības struktūrām
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/310 2023 m. vasario 6 d. dėl pozicijos, kurios
    Europos Sąjungos vardu turi būti laikomasi Specialiajame socialinės apsaugos
    koordinavimo komitete, įsteigtame pagal Europos Sąjungos bei Europos atominės
    energijos bendrijos ir Jungtinės Didžiosios Britanijos ir Šiaurės Airijos
    Karalystės prekybos ir bendradarbiavimo susitarimą, dėl elektroninio keitimosi
    socialinės apsaugos informacija naudojimo įstaigoms ir susižinojimo tarnyboms
    tarpusavyje perduodant duomenis
  type: main
