    posição a adotar em nome da União Europeia no âmbito do Comité Especializado
    da Coordenação da Segurança Social criado pelo Acordo de Comércio e Cooperação
    entre a União Europeia e a Comunidade Europeia da Energia Atómica, por um lado,
