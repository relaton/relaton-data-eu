    yhdistyneen kuningaskunnan välisellä kauppa- ja yhteistyösopimuksella perustetussa
    sosiaaliturvan yhteensovittamista käsittelevässä erityiskomiteassa Euroopan
    unionin puolesta otettavasta kannasta, joka koskee sosiaaliturvan sähköisen
    tiedonvaihtojärjestelmän käyttöä laitosten tai yhteyselinten väliseen tiedonsiirtoon
  type: main
