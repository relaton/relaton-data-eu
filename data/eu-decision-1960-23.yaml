  content: DECISION NO. 23 OF 20 MAY 1960 CONCERNING PROOF OF FITNESS FOR EMPLOYMENT
    REQUIRED UNDER ARTICLE 17, PARAGRAPH ( 1 ) OF REGULATION NO. 3 RELATING TO THE
    GRANTING OF SICKNESS INSURANCE COVER TO MIGRANT WORKERS AND MEMBERS OF THEIR FAMILY
    WHO ACCOMPANY THEM TO THE COUNTRY OFFERING THEM WORK
  type: main
- language: fr
  script: Latn
  content: DECISION NO 23 DU 20 MAI 1960 CONCERNANT LA PREUVE DE L' APTITUDE AU TRAVAIL
    REQUISE AUX TERMES DE L' ARTICLE 17, PARAGRAPHE (1), DU REGLEMENT NO 3 RELATIF
    A L' OCTROI DES PRESTATIONS D' ASSURANCE-MALADIE AUX TRAVAILLEURS MIGRANTS ET
    AUX MEMBRES DE LEUR FAMILLE LES ACCOMPAGNANT DANS LE PAYS DU NOUVEL EMPLOI
  type: main
- language: de
  script: Latn
  content: BESCHLUSS NR. 23 VOM 20. MAI 1960 UEBER DEN NACHWEIS DER ARBEITSFAHIGKEIT,
    DIE NACH ARTIKEL 17 ABSATZ ( 1 ) DER VERORDNUNG NR. 3 VORAUSSETZUNG FUER DIE GEWAEHRUNG
    VON LEISTUNGEN DER KRANKENVERSICHERUNG AN WANDERARBEITNEHMER UND IHRE FAMILIENANGEHOERIGEN
    IM NEUEN BESCHAEFTIGUNGSLAND IST
  type: main
- language: it
  script: Latn
  content: DECISIONE N. 23 DEL 20 MAGGIO 1960, CONCERNENTE LA PROVA DELL' ATTITUDINE
    AL LAVORO RICHIESTA AI TERMINI DELL' ARTICOLO 17 PARAGRAFO ( 1 ) DEL REGOLAMENTO
    N. 3 RELATIVO ALLA CORRESPONSIONE DI PRESTAZIONI D' ASSICURAZIONE MALATTIA AI
    LAVORATORI MIGRANTI ED AI FAMILIARI CHE LI ACCOMPAGNANO NEL PAESE DELLA NUOVA
    OCCUPAZIONE
  type: main
- language: nl
  script: Latn
  content: BESLUIT NO. 23 VAN 20 MEI 1960 INZAKE HET BEWIJS VAN DE INGEVOLGE ARTIKEL
    17, LID ( 1 ), VAN VERORDENING NO. 3 VEREISTE ARBEIDSGESCHIKTHEID MET BETREKKING
    TOT DE VERLENING VAN UITKERINGEN EN VERSTREKKINGEN VAN DE ZIEKTEVERZEKERING AAN
    MIGRERENDE WERKNEMERS EN HUN GEZINSLEDEN DIE HEN VERGEZELLEN NAAR HET LAND WAAR
    ZIJ HUN NIEUWE WERKZAAMHEDEN VERRICHTEN
