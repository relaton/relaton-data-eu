title:
- language: en
  script: Latn
  content: '76/33/EEC: Commission Decision of 12 December 1975 authorizing the Kingdom
    of Belgium to waive the provisions relating to the wrapping of beef quarters subject
    to intervention measures (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/33/CEE: Décision de la Commission, du 12 décembre 1975, autorisant
    le Royaume de Belgique à déroger aux dispositions relatives à l''emballage
    des quartiers de viande bovine soumis à des mesures d''intervention (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '76/33/EWG: Entscheidung der Kommission vom 12. Dezember 1975 zur Ermächtigung
    des Königreichs Belgien, von den Bestimmungen über die Verpackung der unter
    Interventionsmaßnahmen fallenden Rindfleischviertel abzuweichen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/33/EØF: Kommissionens Beslutning af 12. december 1975 om bemyndigelse
    af kongeriget Belgien til at afvige fra bestemmelserne vedrørende indpakning
    af oksefjerdinger, der er undergivet interventionsforanstaltninger (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '76/33/ΕΟΚ : Απόφαση της Επιτροπής, της 12ης
    Δεκεμβρίου 1975, με την οποία επιτρέπεται στο
    Βασίλειο του Βελγίου να αποκλίνει από τις διατάξεις
    σχετικά με τη συσκευασία τεταρτημορίων βοΐου
    κρέατος που υπόκεινται σε μέτρα παρέμβασης
    (Τα κείμενα στην γαλλική και ΥΥΥΥΥ γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '76/33/CEE: Decisione della Commissione, del 12 dicembre 1975, che autorizza
    il Regno del Belgio a derogare alle disposizioni relative all''imballaggio delle
    carni bovine presentate in quarti, soggette a misure d''intervento (I testi in
    lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '76/33/EEG: Beschikking van de Commissie van 12 december 1975 waarbij het
    Koninkrijk België wordt gemachtigd af te wijken van de bepalingen inzake de verpakking
    van voor- en achtervoeten van runderen waarop interventiemaatregelen van toepassing
    zijn (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '76/33/CEE: Decisión de la Comisión, de 12 de diciembre de 1975, por
    la que se autoriza al Reino de Bélgica a establecer excepciones a las disposiciones
    relativas al envasado de los cuartos de carne de vacuno sometidos a medidas de
    intervención (Los textos en lenguas francesa y neerlandesa son los únicos auténticos)'
  type: main
