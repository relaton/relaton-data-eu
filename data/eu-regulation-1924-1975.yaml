  content: Regulation (EEC) No 1924/75 of the Commission of 25 July 1975 amending
    for the sixth time Regulation (EEC) No 2223/70 waiving the countervailing charge
    on imports of certain wines originating in and coming from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1924/75 de la Commission, du 25 juillet 1975, portant
    sixième modification du règlement (CEE) n° 2223/70 relatif à la non-perception
    d' une taxe compensatoire sur les importations de certains vins originaires et
    en provenance de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1924/75 der Kommission vom 25. Juli 1975 zur sechsten
    Änderung der Verordnung (EWG) Nr. 2223/70 über die Nichterhebung einer Ausgleichsabgabe
    bei Einfuhren von Wein mit Ursprung in und Herkunft aus bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1924/75 af 25. juli 1975 om en sjette
    ændring af forordning (EØF) nr. 2223/70 om undladelse af opkrævning af en udligningsafgift
    ved indførsel af vin, der har oprindelse i eller kommer fra visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1924/75 della Commissione, del 25 luglio 1975, recante
    sesta modifica del regolamento (CEE) n. 2223/70 relativo alla non riscossione
    di una tassa di compensazione all' importazione di taluni vini originari e in
    provenienza da alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1924/75 van de Commissie van 25 juli 1975 houdende
    zesde wijziging van Verordening (EEG) nr. 2223/70 betreffende het niet-toepassen
    van een compenserende heffing bij invoer van bepaalde wijnen van oorsprong en
    van herkomst uit sommige derde landen
