    portant modalités d’application du règlement (CE) no 1223/2009 du Parlement
    européen et du Conseil en ce qui concerne le glossaire des dénominations communes
    des ingrédients à utiliser dans l’étiquetage des produits cosmétiques
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/677 der Kommission vom 31. März 2022
