  script: Latn
  content: Commission Implementing Decision (EU) 2022/677 of 31 March 2022 laying
    down rules for the application of Regulation (EC) No 1223/2009 of the European
    Parliament and of the Council as regards the glossary of common ingredient names
    for use in the labelling of cosmetic products
  type: main
- language: fr
  script: Latn
