  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/677 z dnia 31 marca 2022 r. ustanawiająca
    zasady stosowania rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 1223/2009
    w odniesieniu do słownika wspólnych nazw składników do stosowania na etykietach
    produktów kosmetycznych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/677 da Comissão, de 31 de março de 2022,
