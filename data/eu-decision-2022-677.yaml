    des Europäischen Parlaments und des Rates hinsichtlich des Glossars der gemeinsamen
    Bezeichnungen von Bestandteilen zur Verwendung bei der Kennzeichnung kosmetischer
    Mittel
  type: main
- language: bg
  script: Cyrl
