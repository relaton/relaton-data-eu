title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1798/2005 of 28 October 2005 specifying the
    extent to which applications lodged in October 2005 for import certificates in
    respect of young male bovine animals for fattening as part of a tariff quota provided
    for in Regulation (EC) No 992/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1798/2005 de la Commission du 28 octobre 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois d'octobre 2005 pour les jeunes bovins mâles destinés à l'engraissement
    dans le cadre d'un contingent tarifaire prévu par le règlement (CE) n° 992/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1798/2005 der Kommission vom 28. Oktober 2005 über
    das Ausmaß, in dem den im Oktober 2005 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 992/2005 stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1798/2005 ze dne 28. října 2005, kterým
    se stanoví, do jaké míry lze vyhovět žádostem o dovozní licence pro dovoz
    mladého skotu samčího pohlaví určeného na výkrm, podaným v října 2005
    v rámci celní kvóty dle nařízení (ES) č. 992/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1798/2005 af 28. oktober 2005 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indsendt i oktober
    2005 for ungtyre bestemt til opfedning, i forbindelse med et toldkontingent, der
    er fastsat i forordning (EF) nr. 992/2005, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1798/2005 της Επιτροπής,
    της 28ης Οκτωβρίου 2005, για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για πιστοποιητικά εισαγωγής που υποβλήθηκαν
    τον Οκτωβρίου 2005 για τα νεαρά άρρενα βοοειδή
    που προορίζονται για πάχυνση στο πλαίσιο μιας
    δασμολογικής ποσόστωσης η οποία προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 992/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1798/2005, 28. oktoober 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada taotlusi, mis on esitatud oktoobris
    2005 noorte nuumamiseks ettenähtud isasveiste impordilitsentside saamiseks määrusega
    (EÜ) nr 992/2005 ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1798/2005, annettu 28 päivänä lokakuuta 2005,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen lokakuuta 2005 esitettyjen
    tuontitodistushakemusten hyväksyttävyydestä asetuksessa (EY) N:o 992/2005 määriteltyjen
    tariffikiintiöiden rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1798/2005/EK rendelete (2005. október 28.) annak meghatározásáról,
