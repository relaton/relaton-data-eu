    amelyeket 2005 október hónapjában nyújtottak be hizlalásra szánt növendék
    hím szarvasmarhák vonatkozásában a 992/2005/EK rendeletben szabályozott vámkontingens
    keretében
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1798/2005 della Commissione, del 28 ottobre 2005, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 2005 per i giovani bovini maschi destinati all'ingrasso,
    nel quadro del contingente tariffario previsto dal regolamento (CE) n. 992/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1798/2005 (2005. gada 28. oktobris), ar ko nosaka,
