title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2037/75 of the Commission of 5 August 1975 re-establishing
    the levying of customs duties on handkerchiefs, of fabrics other than cotton,
    falling within heading No ex 61.05, originating in developing countries to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3046/74
    of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2037/75 de la Commission, du 5 août 1975, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes en tissus autres que de coton, de la position tarifaire EX 61.05,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2037/75 der Kommission vom 5. August 1975 über die
    Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher aus
    anderen Geweben als Baumwolle, der Tarifnummer ex 61.05, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2037/75 af 5. august 1975 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, andre varer end bomuldsvarer,
    under position ex 61.05, som har oprindelse i udviklingslande og omfattes af de
    toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2.
    december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2037/75 della Commissione, del 5 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, in tessuti non di cotone, della voce doganale n. ex 61.05 originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2037/75 van de Commissie van 5 augustus 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van andere weefsels dan van katoen, van tariefpost ex 61.05, van oorsprong uit
    de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3046/74 van
    de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
