title:
- language: en
  script: Latn
  content: Regulation (EEC) No 225/74 of the Commission of 28 January 1974 amending
    Regulation (EEC) No 3335/73 on the movement of goods obtained in the Community
    under a procedure for the suspension or drawback of customs duties or other import
    charges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 225/74 de la Commission, du 28 janvier 1974, modifiant
    le règlement (CEE) n° 3335/73 relatif à la circulation des marchandises obtenues
    dans la Communauté sous un régime comportant suspension ou ristourne de droits
    de douane et autres impositions à l' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 225/74 der Kommission vom 28. Januar 1974 zur Änderung
    der Verordnung (EWG) Nr. 3335/73 über den Verkehr mit Waren, die in der Gemeinschaft
    in einem Verfahren hergestellt sind, das die Nichterhebung oder Rückvergütung
    der Zölle oder anderer Eingangsabgaben vorsieht
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 225/74 af 28. januar 1974 om ændring
    af forordning (EØF) nr. 3335/73 om bevægeligheden af varer, som er fremstillet
    i Fællesskabet under en ordning, der indebærer suspension eller godtgørelse
    af told eller andre importafgifter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 225/74 della Commissione, del 28 gennaio 1974, che
    modifica il regolamento (CEE) n. 3335/73 relativo alla circolazione delle merci
    ottenute nella Comunità sotto un regime recante sospensione o riduzione di dazi
    o di altre imposizioni all' importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 225/74 van de Commissie van 28 januari 1974 tot wijziging
    van Verordening (EEG) nr. 3335/73 betreffende het verkeer van goederen die in
    de Gemeenschap zijn verkregen onder een regeling houdende opschorting of teruggave
    van douanerechten of andere belastingen bij invoer
  type: main
