title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 457/94 of 28 February 1994 amending Regulation
    (EC) No 3409/93 introducing management measures for imports of certain bovine
    animals for 1994 and determining to what extent applications for import licences
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 457/94 de la Commission du 28 février 1994 modifiant
    le règlement (CE) n° 3409/93 établissant pour l'année 1994 des mesures de
    gestion relatives aux importations de certains animaux vivants de l'espèce bovine
    et déterminant dans quelle mesure il peut être donné suite aux demandes de
    délivrance de certificats d'importation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 457/94 DER KOMMISSION vom 28. Februar 1994 zur Änderung
    der Verordnung (EG) Nr. 3409/93 zur Regelung der Einfuhr von lebenden Rindern
    und zur Festlegung des Anteils an den mit den Einfuhrlizenzen beantragten Mengen
    für 1994
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 457/94 af 28. februar 1994 om ændring
    af forordning (EF) nr. 3409/93 om fastsættelse for 1994 af foranstaltninger til
    forvaltning af indførslen af visse former for levende kvæg, og om fastsættelse
    af, i hvilken udstrækning ansøgninger om importlicenser kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 457/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Φεβρουαρίου 1994 για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 3409/93 για τον καθορισμό,
    για το 1994, μέτρων διαχείρισης σχετικά με τις
    εισαγωγές ορισμένων ζωντανών βοοειδών και
    για τον καθορισμό του μέτρου στο οποίο πρέπει
    να δοθεί συνέχεια στις αιτήσεις χορήγησης
    πιστοποιητικών εισαγωγής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 457/94 DELLA COMMISSIONE del 28 febbraio 1994 che modifica
    il regolamento (CE) n. 3409/93 recante misure di gestione relative alle importazioni
    di animali vivi della specie bovina per il 1994 e che stabilisce in che misura
    possono essere accolte le domande di titoli di importazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 457/94 VAN DE COMMISSIE van 28 februari 1994 houdende
    wijziging van Verordening (EG) nr. 3409/93 tot vaststelling, voor 1994, van maatregelen
    voor het beheer van de invoer van bepaalde categorieën levende runderen en van
    de mate waarin gevolg kan worden gegeven aan de aanvragen om afgifte van invoercertificaten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 457/94 DA COMISSÃO de 28 de Fevereiro de 1994 que
    altera o Regulamento (CE) nº 3409/93, que estabelece, para 1994, medidas de gestão
    relativas às importações de certos animais vivos da espécie bovina, e que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 457/94 DE LA COMISIÓN de 28 de febrero de 1994 por
    el que se modifica el Reglamento (CE) nº 3409/93 por el que se establecen, para
    1994, medidas de gestión relativas a las importaciones de determinados animales
    vivos de la especie bovina y se indica la medida en que podrá darse curso a las
    solicitudes de expedición de certificados de importación
  type: main
