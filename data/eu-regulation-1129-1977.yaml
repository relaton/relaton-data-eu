title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1129/77 of 27 May 1977 re-establishing the
    levying of customs duties on gloves, mittens, mitts, stockings, socks and sockettes,
    not being knitted or crocheted goods, falling within heading No 61.10, originating
    in Hong Kong to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1129/77 de la Commission, du 27 mai 1977, portant
    rétablissement de la perception des droits de douane applicables à la ganterie,
    bas, chaussettes et socquettes, autres qu'en bonneterie, de la position tarifaire
    61.10, originaires de Hong-Kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1129/77 der Kommission vom 27. Mai 1977 über die
    Wiedereinführung des Zollsatzes für Handschuhe, Strümpfe, Socken und Söckchen,
    nicht gewirkt, der Tarifnummer 61.10, mit Ursprung in Hongkong, dem die in der
    Verordnung (EWG) Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1129/77 af 27. maj 1977 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter, luffer, strømper og sokker,
    ikke af trikotage, under position 61.10, som har oprindelse i Hongkong, og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1129/77 della Commissione, del 27 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, calze e calzini,
    esclusi quelli a maglia, della voce doganale 61.10, originari di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1129/77 van de Commissie van 27 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke, kousen en sokken, andere dan die van brei- of haakwerk,
    van post 61.10, van oorsprong uit Hong-Kong waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3022/76 van de Raad
  type: main
