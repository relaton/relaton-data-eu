    (EØF) nr. 758/86 om importordningen for 1986 for produkter henhørende under
    pos. 07.06 A i den fælles toldtarif med oprindelse i tredjelande, der ikke er
    medlemmer af GATT, som følge af forhøjelsen af mængden, for så vidt angår
    varigheden af visse licensers gyldighedsperiode
  type: main
- language: el
  script: Grek
