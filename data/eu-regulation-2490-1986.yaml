title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2490/86 of 1 August 1986 amending Regulation
    (EEC) No 1902/86 laying down detailed rules for the application of Council Regulation
    (EEC) No 758/86 on the import system applicable in 1986 to products falling within
    subheading 07.06 A of the Common Customs Tariff and originating in third countries
    which are not members of GATT, in respect of the period of validity of certain
    licences
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2490/86 de la Commission du 1er août 1986 modifiant
    le règlement (CEE) n° 1902/86, portant modalités d' application du règlement
    (CEE) n° 758/86 du Conseil relatif au régime à l' importation applicable, pour
    l' année 1986, aux produits relevant de la sous-position 07.06 A du tarif douanier
    commun originaires des pays tiers non membres de l' accord général sur les tarifs
    douaniers et le commerce (GATT), en ce qui concerne la durée de validité de
    certains certificats
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2490/86 der Kommission vom 1. August 1986 zur Änderung
    der Verordnung (EWG) Nr. 1902/86 mit Durchführungsbestimmungen zu der Verordnung
    (EWG) Nr. 758/86 des Rates über die 1986 geltende Einfuhrregelung für Erzeugnisse
    der Tarifstelle 07.06 A des Gemeinsamen Zolltarifs aus nicht dem GATT angehörenden
    Drittländern hinsichtlich der Gültigkeitsdauer bestimmter Lizenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2490/86 af 1. august 1986 om ændring
