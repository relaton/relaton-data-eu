  script: Latn
  content: Verordnung (EWG) Nr. 1149/70 der Kommission vom 19. Juni 1970 über die
    Durchführung einer Ausschreibung zur Bereitstellung von HartweizengrieD, GerstengrieD,
    MaisgrieD, Weichweizenmehl und Gerstenmehl als Hilfeleistung für das "Komitee
    vom Roten Kreuz"
  type: main
- language: it
  script: Latn
