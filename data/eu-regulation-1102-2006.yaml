title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1102/2006 of 17 July 2006 determining to
    what extent import right applications submitted during the month of June 2006
    for certain live bovine animals as part of a tariff quota provided for in Regulation
    (EC) No 1241/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1102/2006 de la Commission du 17 juillet 2006 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites au mois de juin 2006 pour certains bovins vivants dans le cadre d'un
    contingent tarifaire prévu par le règlement (CE) n o 1241/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1102/2006 der Kommission vom 17. Juli 2006 zur Festsetzung
    des Umfangs, in dem die im Juni 2006 eingereichten Anträge auf Einfuhrlizenzen
    für bestimmte lebende Rinder im Rahmen eines Zollkontingents gemäß der Verordnung
    (EG) Nr. 1241/2005 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1102/2006 ze dne 17. července 2006 , kterým
    se stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních licencí
    na měsíc června 2006 pro určitý živý skot, podaným v rámci celní kvóty
    dle nařízení (ES) č. 1241/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1102/2006 af 17. juli 2006 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicencer, som er
    indsendt i juni 2006, for levende kreaturer i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1241/2005
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1102/2006 της Επιτροπής,
    της 17ης Ιουλίου 2006 , για καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιουνίου του 2006 για ορισμένα ζώντα
    βοοειδή, στο πλαίσιο μιας δασμολογικής ποσόστωσης
    η οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    1241/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1102/2006, 17. juuli 2006 , millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordilitsentside taotlusi juunis
    2006, mis on esitatud teatavate elusveiste kohta määrusega (EÜ) nr 1241/2005
    ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1102/2006, annettu 17 päivänä heinäkuuta
    2006 , eläviä nautaeläimiä koskevien kesäkuussa 2006 jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1241/2005 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1102/2006/EK rendelete ( 2006. július 17. ) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1241/2005/EK rendeletben szabályozott
    vámkontingens keretében, az egyes élő szarvasmarhafélékre vonatkozóan 2006
    júniusában benyújtott importtanúsítvány iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1102/2006 della Commissione, del 17 luglio 2006 , che
    stabilisce in che misura possono essere accolte le domande di certificati di importazione
    presentate nel mese di giugno 2006 per bovini vivi nel quadro del contingente
    tariffario previsto dal regolamento (CE) n. 1241/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1102/2006 ( 2006. gada 17. jūlijs ), ar ko nosaka,
    cik lielā mērā var pieņemt importa tiesību ievešanas atļauju saņemšanai,
    kuras iesniegtas 2006. gada jūnijā attiecībā uz konkrētiem dzīviem Rumānijas
    izcelsmes liellopiem tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr.
    1241/2005
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 17 d. Komisijos reglamentas (EB) Nr. 1102/2006, nustatantis,
    kokia dalimi galima patenkinti paraiškas tam tikrų gyvų galvijų importo licencijoms
    gauti, pateiktas 2006 m. birželio mėn., remiantis tarifine kvota, nustatyta
    Reglamente (EB) Nr. 1241/2005
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1102/2006 van de Commissie van 17 juli 2006 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    voor bepaalde levende runderen, die in juni 2006 zijn ingediend op grond van een
    bij Verordening (EG) nr. 1241/2005 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1102/2006 z dnia 17 lipca 2006 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie pozwoleń na przywóz
    w miesiącu czerwcu 2006 r. niektórych sztuk żywego bydła w ramach kontyngentu
    taryfowego przewidzianego w rozporządzeniu (WE) nr 1241/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1102/2006 da Comissão, de 17 de Julho de 2006 ,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados animais vivos da espécie bovina, apresentados no mês de Junho
    de 2006 ao abrigo de um contingente pautal previsto pelo Regulamento (CE) n. o
    1241/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1102/2006 zo 17. júla 2006 , ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií na
    mesiac jún 2006 na niektorý živý hovädzi dobytok v rámci colnej kvóty ustanovenej
    v nariadení (ES) č. 1241/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1102/2006 z dne 17. julija 2006 o določitvi,
    v kakšnem obsegu se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi v
    mesecu juniju 2006 za nekatero živo govedo, v okviru tarifne kvote, predvidene
    z Uredbo (ES) št. 1241/2005
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1102/2006 de la Comisión, de 17 de julio de 2006 ,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación en el mes de junio de 2006 de animales vivos de la
    especie bovina, presentadas dentro de un contingente arancelario establecido en
    el Reglamento (CE) n o 1241/2005
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1102/2006 av den 17 juli 2006 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under juni 2006 för vissa
    levande nötkreatur inom ramen för den avgiftskvot som fastställts i förordning
    (EG) nr 1241/2005 kan beviljas
  type: main
