title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2289/91 of 30 July 1991 fixing for the 1991/92
    marketing year the minimum price to be paid to producers for Williams and Rocha
    pears and the amount of production aid for such pears in syrup and/or natural
    fruit juice
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2289/91 DE LA COMMISSION du 30 juillet 1991 fixant,
    pour la campagne 1991/1992, le prix minimal à payer aux producteurs pour les
    poires Williams et Rocha ainsi que le montant de l'' aide à la production pour
    ces poires au sirop et/ou au jus naturel de fruit #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2289/91 DER KOMMISSION vom 30. Juli 1991 zur Festsetzung
    des den Erzeugern von Williams- und Rocha-Birnen zu zahlenden Mindestpreises sowie
    der Produktionsbeihilfe für diese Birnen in Sirup und/oder natürlichem Fruchtsaft
    im Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2289/91 af 30. juli 1991 om fastsættelse
    af den minimumspris, der skal betales producenten for Williams- og Rochapærer,
    samt producentstøtten for disse pærer i sukkeropløsning og/eller naturlig frugtsaft
    i produktionsåret 1991/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2289/91 της Επιτροπής
    της 30ής Ιουλίου 1991 που καθορίζει, για την περίοδο
    εμπορίας 1991/92, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τα αχλάδια Williams και Rocha,
    καθώς και το ποσό της ενίσχυσης στην παραγωγή
    για τα ροδάκινα σε σιρόπι ή / και σε φυσικό χυμό
    φρούτου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2289/91 DELLA COMMISSIONE del 30 luglio 1991 che
