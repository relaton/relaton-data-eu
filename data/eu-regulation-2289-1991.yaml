    ai produttori di pere Williams e Rocha e l'' importo dell'' aiuto alla produzione
    di tali pere sciroppate e/o conservate al succo naturale di frutta #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2289/91 VAN DE COMMISSIE van 30 juli 1991 tot vaststelling,
