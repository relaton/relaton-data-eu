  content: Commission Regulation (EC) No 702/95 of 30 March 1995 amending Regulation
    (EC) No 478/95 on additional rules for the application of Council Regulation (EEC)
    No 404/93 as regards the tariff quota arrangements for imports of bananas into
    the Community and amending Regulation (EEC) No 1442/93
  type: main
- language: fr
  script: Latn
