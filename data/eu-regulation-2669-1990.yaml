  content: Commission Regulation (EEC) No 2669/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to underpants and briefs, products
    of category 13 (order No 40.0130) originating in Thailand, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2669/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux slips et
    caleçons de la catégorie de produits n° 13 (numéro d'ordre 40.0130), originaires
    de la Thaïlande, bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2669/90 DER KOMMISSION vom 17. September 1990 zur
