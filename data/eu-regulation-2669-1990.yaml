    Nr. 13 (laufende Nummer 40.0130) mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2669/90 af 17. september 1990 om genindførelse
