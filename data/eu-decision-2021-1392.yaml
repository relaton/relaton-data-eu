    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu Bt11
    (SYN-BTØ11-1), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2021) 5999) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
