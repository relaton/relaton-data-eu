    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų Bt 11 (SYN-BTØ11–1), kurie iš jų sudaryti arba pagaminti (pranešta
    dokumentu Nr. C(2021) 5999) (Tekstas autentiškas tik nyderlandų ir prancūzų
    kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1392 tas-17
