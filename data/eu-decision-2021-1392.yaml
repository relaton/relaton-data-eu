  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1392 ze dne 17. srpna 2021 o
    obnovení povolení pro uvádění produktů, které obsahují geneticky modifikovanou
    kukuřici Bt11 (SYN-BTØ11-1), sestávají z ní nebo jsou z ní vyrobeny, na
    trh podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2021) 5999) (Pouze nizozemské a francouzské znění je závazné)
  type: main
