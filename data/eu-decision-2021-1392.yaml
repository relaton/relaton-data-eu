    består af eller er fremstillet af genetisk modificeret Bt 11-majs (SYN-BTØ11-1),
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt
    under nummer C(2021) 5999) (Kun den franske og den nederlandske udgave er autentiske)
  type: main
