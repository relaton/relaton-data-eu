    som innehåller, består av eller har framställts av den genetiskt modifierade
    majsen Bt 11 (SYN-BTØ11-1), i enlighet med Europaparlamentets och rådets förordning
    (EG) nr 1829/2003 [delgivet med nr C(2021) 5999] (Endast de nederländska och
