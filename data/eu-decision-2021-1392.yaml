    koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamista koskevan
    luvan uusimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003
    mukaisesti (tiedoksiannettu numerolla C(2021) 5999) (Ainoastaan hollannin- ja
    ranskankieliset tekstit ovat todistusvoimaisia)
  type: main
