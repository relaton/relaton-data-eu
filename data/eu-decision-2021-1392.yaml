    kukuruz Bt 11 (SYN-BTØ11-1) ili se sastoje ili su proizvedeni od njega, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2021) 5999) (Vjerodostojni su samo tekstovi na francuskom i nizozemskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1392 végrehajtási határozata (2021. augusztus
    17.) a géntechnológiával módosított Bt 11 (SYN-BTØ11-1) kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2021) 5999. számú dokumentummal történt) (Csak a holland
    és a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1392 della Commissione del 17 agosto
    2021 che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da granturco geneticamente modificato Bt11 (SYN-BTØ11-1)
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2021)5999] (I testi in lingua francese e neerlandese
    sono i soli facenti fede)
  type: main
