    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    mais Bt11 (SYN-BTØ11-1) overeenkomstig Verordening (EG) nr. 1829/2003 van het
