title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1392 of 17 August 2021 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize Bt 11 (SYN-BTØ11-1) pursuant to
    Regulation (EC) No 1829/2003 of the European Parliament and of the Council (notified
    under document C(2021)5999) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1392 de la Commission du 17 août 2021
    renouvelant l’autorisation de mise sur le marché de produits contenant du maïs
    génétiquement modifié Bt 11 (SYN-BTØ11-1), consistant en ce maïs ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2021) 5999] (Les textes en
    langues française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1392 der Kommission vom 17. August 2021
    zur Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen, die genetisch
    veränderten Mais Bt 11 (SYN-BTØ11-1) enthalten, aus ihm bestehen oder aus ihm
    hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5999) (Nur
    der französische und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/1392 на Комисията
    от 17 август 2021 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    царевица Bt11 (SYN-BTØ11-1), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2021) 5999) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
