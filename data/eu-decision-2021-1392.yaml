  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1392 z dnia 17 sierpnia 2021 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    kukurydzę Bt11 (SYN-BTØ11-1), składających się z niej lub z niej wyprodukowanych
    (notyfikowana jako dokument nr C(2021) 5999) (Jedynie teksty w języku francuskim
    i niderlandzkim są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1392 da Comissão de 17 de agosto de 2021
    que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de milho geneticamente modificado
    Bt 11 (SYN-BTØ11-1) nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2021) 5999] (Apenas fazem fé
    os textos nas línguas neerlandesa e francesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1392 a Comisiei din 17 august
    2021 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din porumb modificat genetic Bt11 (SYN-BTØ11-1),
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2021) 5999] (Numai textele în limbile
    neerlandeză și franceză sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1392 zo 17. augusta 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu Bt11 (SYN-BTØ11-1), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2021) 5999] (Iba holandské a francúzske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1392 z dne 17. avgusta 2021 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo Bt
    11 (SYN-BTØ11-1), so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo (ES)
    št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno številko
    C(2021) 5999) (Besedilo v francoskem in nizozemskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1392 de la Comisión de 17 de agosto
    de 2021 por la que se renueva la autorización de comercialización de productos
    que contengan, se compongan o se hayan producido a partir de maíz modificado
    genéticamente Bt11 (SYN-BTØ11-1) con arreglo al Reglamento (CE) n.o 1829/2003
    del Parlamento Europeo y del Consejo [notificada con el número C(2021) 5999]
    (Los textos en lenguas francesa y neerlandesa son los únicos auténticos)
  type: main
