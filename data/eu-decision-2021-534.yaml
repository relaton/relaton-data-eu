id: EUDecision2021534
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2021/534 of 24 March 2021 determining under Article
    39(1) of Directive 2014/33/EU of the European Parliament and of the Council whether
    a measure taken by Germany to prohibit the placing on the market of a lift model
    manufactured by Orona is justified or not (notified under document C(2021) 1863)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/534 de la Commission du 24 mars 2021 déterminant,
    conformément à l’article 39, paragraphe 1, de la directive 2014/33/UE du Parlement
    européen et du Conseil, si une mesure adoptée par l’Allemagne visant à interdire
    la mise sur le marché d’un modèle d’ascenseur fabriqué par Orona est justifiée
    ou non [notifiée sous le numéro C(2021) 1863]
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/534 der Kommission vom 24. März 2021 zur Feststellung
    gemäß Artikel 39 Absatz 1 der Richtlinie 2014/33/EU des Europäischen Parlaments
    und des Rates, ob eine Maßnahme Deutschlands im Hinblick auf die Untersagung
    des Inverkehrbringens eines von Orona hergestellten Aufzugsmodells gerechtfertigt
    ist oder nicht (Bekannt gegeben unter Aktenzeichen C(2021) 1863)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/534 на Комисията от 24 март
    2021 година за определяне дали мярката, предприета
    от Германия за забрана на пускането на пазара
    на модел асансьор, произведен от Orona, е оправдана
    или не в съответствие с член 39, параграф 1 от
    Директива 2014/33/ЕС на Европейския парламент
    и на Съвета (нотифицирано под номер C(2021) 1863)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise (EU) 2021/534 ze dne 24. března 2021, kterým se podle
    čl. 39 odst. 1 směrnice Evropského parlamentu a Rady 2014/33/EU stanoví, zda
    je opatření přijaté Německem s cílem zakázat, aby byl na trh uveden model
    výtahu vyráběný společností Orona, důvodné, či nikoli (oznámeno pod
    číslem C(2021) 1863)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse (EU) 2021/534 af 24. marts 2021 om fastsættelse
    i henhold til artikel 39, stk. 1, i Europa-Parlamentets og Rådets direktiv 2014/33/EU
    af, hvorvidt en foranstaltning truffet af Tyskland om at forbyde markedsføring
    af en elevatormodel fremstillet af Orona, er begrundet eller ej (meddelt under
    nummer C(2021) 1863)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2021/534 της Επιτροπής της 24ης
    Μαρτίου 2021 για τον καθορισμό του εάν ένα μέτρο
    που έλαβε η Γερμανία για την απαγόρευση της
    διάθεσης στην αγορά μοντέλου ανελκυστήρα κατασκευής
    της Orona είναι δικαιολογημένο ή όχι, βάσει του
    άρθρου 39 παράγραφος 1 της οδηγίας 2014/33/ΕΕ του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό C(2021) 1863]
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus (EL) 2021/534, 24. märts 2021, millega määratakse Euroopa
    Parlamendi ja nõukogu direktiivi 2014/33/EL artikli 39 lõike 1 alusel kindlaks,
    kas Saksamaa võetud meede Orona toodetud liftimudeli turule laskmise keelamiseks
    on põhjendatud või mitte (teatavaks tehtud numbri C(2021) 1863 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2021/534, annettu 24 päivänä maaliskuuta 2021,
    sen määrittämisestä Euroopan parlamentin ja neuvoston direktiivin 2014/33/EU
    39 artiklan 1 kohdan mukaisesti, onko Saksan toteuttama Oronan valmistaman hissimallin
    markkinoille saattamisen kieltämistä koskeva toimenpide perusteltu (tiedoksiannettu
    numerolla C(2021) 1863)
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2021/534 ón gCoimisiún an 24 Márta 2021 lena gcinntear
    faoi Airteagal 39(1) de Threoir 2014/33/AE ó Pharlaimint na hEorpa agus ón gComhairle
    an bhfuil údar le beart a rinne an Ghearmáin chun cosc a chur ar mhúnla ardaitheora
    arna mhonarú ag Orona a chur ar an margadh nó nach bhfuil údar leis (tugtar
    fógra faoi dhoiciméad C(2021) 1863)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2021/534 оd 24. ožujka 2021. kojom se u skladu s
    člankom 39. stavkom 1. Direktive 2014/33/EU Europskog parlamenta i Vijeća određuje
    je li mjera koju je Njemačka poduzela radi zabrane stavljanja na tržište modela
    dizala proizvođača Orone opravdana (priopćeno pod brojem dokumenta C(2021)
    1863)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/534 határozata (2021. március 24.) a Németország
    által az Orona által gyártott felvonómodell forgalomba hozatalának megtiltása
    érdekében hozott intézkedés indokolt voltának a 2014/33/EU európai parlamenti
    és tanácsi irányelv 39. cikkének (1) bekezdése értelmében történő meghatározásáról
    (az értesítés a C(2021) 1863. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/534 della Commissione del 24 marzo 2021 che determina
    a norma dell’articolo 39, paragrafo 1, della direttiva 2014/33/UE del Parlamento
    europeo e del Consiglio se è giustificata o no una misura adottata dalla Germania
    volta a impedire l’immissione sul mercato di un modello di ascensore prodotto
    da Orona [notificata con il numero C(2021) 1863]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2021/534 (2021. gada 24. marts), ar ko saskaņā
    ar Eiropas Parlamenta un Padomes Direktīvas 2014/33/ES 39. panta 1. punktu nosaka,
    vai Vācijas veiktais pasākums, ar kuru aizliedz laist tirgū Orona ražotu lifta
    modeli, ir pamatots (izziņots ar dokumenta numuru C(2021) 1863)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas (ES) 2021/534 2021 m. kovo24 d. kuriuo pagal Europos
    Parlamento ir Tarybos direktyvos 2014/33/ES 39 straipsnio 1 dalį nustatoma, ar
    priemonė, kurios ėmėsi Vokietija siekdama uždrausti pateikti rinkai įmonės
    „Orona“ gaminamus tam tikro modelio liftus, yra pagrįsta, ar ne (pranešta
    dokumentu Nr. C(2021) 1863)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2021/534 tal-24 ta’ Marzu 2021 li tiddetermina,
    skont l-Artikolu 39(1) tad-Direttiva 2014/33/UE tal-Parlament Ewropew u tal-Kunsill,
    jekk miżura meħuda mill-Ġermanja biex jiġi pprojbit it-tqegħid fis-suq ta’
    mudell ta’ lift immanifatturat minn Orona hijiex ġustifikata jew le (notifikata
    bid-dokument C(2021) 1863)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/534 van de Commissie van 24 maart 2021 ter bepaling,
    overeenkomstig artikel 39, lid 1, van Richtlijn 2014/33/EU van het Europees Parlement
    en de Raad, of een door Duitsland genomen maatregel om het in de handel brengen
    van een door Orona vervaardigd liftmodel te verbieden al dan niet gerechtvaardigd
    is (Kennisgeving geschied onder nummer C(2021) 1863)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2021/534 z dnia 24 marca 2021 r. określająca, na
    podstawie art. 39 ust. 1 dyrektywy Parlamentu Europejskiego i Rady 2014/33/UE,
    czy środek zastosowany przez Niemcy w celu zakazania wprowadzania do obrotu modelu
    dźwigu produkowanego przez spółkę Orona jest uzasadniony (notyfikowana jako
    dokument nr C(2021) 1863)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/534 da Comissão de 24 de março de 2021 que determina,
    nos termos do artigo 39.o, n.o 1, da Diretiva 2014/33/UE do Parlamento Europeu
    e do Conselho, a justificação ou não justificação da medida tomada pela Alemanha
    que proíbe a colocação no mercado de um modelo de ascensor fabricado pela Orona
    [notificada com o número C(2021) 1863]
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/534 a Comisiei din 24 martie 2021 de stabilire, în temeiul
    articolului 39 alineatul (1) din Directiva 2014/33/UE a Parlamentului European
    și a Consiliului, dacă o măsură luată de Germania cu privire la interdicția
    introducerii pe piață a unui model de ascensor fabricat de Orona este justificată
    sau nu [notificată cu numărul C(2021) 1863]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (EÚ) 2021/534 z 24. marca 2021, ktorým sa podľa
    článku 39 ods. 1 smernice Európskeho parlamentu a Rady 2014/33/EÚ určuje,
    či opatrenie prijaté Nemeckom s cieľom zakázať uvedenie modelu výťahu vyrobeného
    spoločnosťou Orona na trh je alebo nie je opodstatnené [oznámené pod číslom
    C(2021) 1863]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije (EU) 2021/534 z dne 24. marca 2021 o določitvi v skladu
    s členom 39(1) Direktive 2014/33/EU Evropskega parlamenta in Sveta, ali je ukrep,
    ki ga je sprejela Nemčija za prepoved dajanja na trg modela dvigala, ki ga proizvaja
    družba Orona, upravičen ali ne (notificirano pod dokumentarno številko C(2021)
    1863)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/534 de la Comisión de 24 de marzo de 2021 por la que
    se determina, de conformidad con el artículo 39, apartado 1, de la Directiva
    2014/33/UE del Parlamento Europeo y el Consejo, si está justificada la medida
    adoptada por Alemania para prohibir la introducción en el mercado de un modelo
    de ascensor fabricado por Orona [notificada con el número C(2021) 1863]
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut (EU) 2021/534 av den 24 mars 2021 om fastställande
    enligt artikel 39.1 i Europaparlamentets och rådets direktiv 2014/33/EU av huruvida
    en åtgärd som har vidtagits av Tyskland för att förbjuda utsläppande på
    marknaden av en viss hissmodell tillverkad av Orona är berättigad eller inte
    [delgivet med nr C(2021) 1863]
