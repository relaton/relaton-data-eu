  script: Latn
  content: Commission Regulation (EEC) No 519/81 of 27 February 1981 fixing the rates
    of the refunds applicable from 1 March 1981 to sugar and molasses exported in
    the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 519/81 de la Commission, du 27 février 1981, fixant
    les taux des restitutions applicables, à compter du 1er mars 1981, au sucre et
    à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 519/81 der Kommission vom 27. Februar 1981 zur Festsetzung
    der ab 1. März 1981 geltenden Erstattungssätze bei der Ausfuhr von Zucker und
    Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 519/81 af 27. februar 1981 om fastsættelse
    af de restitutionssatser, der fra 1. marts 1981 skal anvendes for sukker og melasse,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
