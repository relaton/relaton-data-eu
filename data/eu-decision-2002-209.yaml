title:
- language: en
  script: Latn
  content: '2002/209/EC: Commission Decision of 11 March 2002 updating the conditions
    for the granting of authorisation for the removal of pigs from holdings located
    within the protection and surveillance zones established in Spain in relation
    to classical swine fever and establishing conditions for the marking and use of
    pigmeat in application of Article 11 of Council Directive 2001/89/EC (Text with
    EEA relevance) (notified under document number C(2002) 985)'
  type: main
- language: fr
  script: Latn
  content: '2002/209/CE: Décision de la Commission du 11 mars 2002 mettant à jour
    les conditions d''octroi des autorisations de sortie pour les porcs détenus dans
    les exploitations situées à l''intérieur des zones de protection et de surveillance
    établies en Espagne dans le contexte de la peste porcine classique et établissant
    les conditions de marquage et d''utilisation de viandes porcines en application
    de l''article 11 de la directive 2001/89/CE du Conseil (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2002) 985]'
  type: main
- language: de
  script: Latn
  content: '2002/209/EG: Entscheidung der Kommission vom 11. März 2002 zur Aktualisierung
    der Bedingungen für die Genehmigung der Verbringung von Schweinen aus Betrieben
    innerhalb der in Spanien wegen klassischer Schweinepest abgegrenzten Schutz- und
    Überwachungszonen und zur Regelung der Kennzeichnung und Verwendung von Schweinefleisch
    in Anwendung des Artikels 11 der Richtlinie 2001/89/EG des Rates (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 985)'
  type: main
- language: da
  script: Latn
  content: '2002/209/EF: Kommissionens beslutning af 11. marts 2002 om ajourføring
    af betingelserne for, at der kan gives tilladelse til flytning af svin fra bedrifter
    i de iagttagelsesdistrikter og overvågningsområder, som er oprettet i Spanien
    i forbindelse med klassisk svinepest, og om mærkning og anvendelse af svinekød
    i henhold til artikel 11 i Rådets direktiv 2001/89/EF (EØS-relevant tekst) (meddelt
    under nummer K(2002) 985)'
  type: main
- language: el
  script: Grek
  content: '2002/209/ΕΚ: Απόφαση της Επιτροπής, της 11ης
    Μαρτίου 2002, για την αναπροσαρμογή των όρων
    χορήγησης αδείας για την απομάκρυνση χοίρων
    από εγκαταστάσεις που βρίσκονται εντός των
    ζωνών προστασίας και επιτήρησης που έχουν
    οριστεί στην Ισπανία σε σχέση με την κλασική
    πανώλη των χοίρων και για τη θέσπιση των όρων
    για την εμπορία και τη χρησιμοποίηση χοιρείου
    κρέατος, κατ'' εφαρμογή του άρθρου 11 της οδηγίας
    2001/89/EΚ του Συμβουλίου (Κείμενο που παρουσιάζει
    ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα υπό
    τον αριθμό Ε(2002) 985]'
  type: main
- language: fi
  script: Latn
  content: '2002/209/EY: Komission päätös, tehty 11 päivänä maaliskuuta 2002,
    sikojen siirtämistä Espanjaan klassisen sikaruton vuoksi perustetuilla suoja-
    ja valvontavyöhykkeillä sijaitsevilta tiloilta koskevan luvan antamiseen liittyvien
    edellytysten saattamisesta ajan tasalle sekä sianlihan merkitsemistä ja käyttöä
    koskevien edellytysten vahvistamisesta neuvoston direktiivin 2001/89/EY 11 artiklan
    mukaisesti (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla
    K(2002) 985)'
  type: main
- language: it
  script: Latn
  content: '2002/209/CE: Decisione della Commissione, dell''11 marzo 2002, che aggiorna
    le modalità per la concessione dell''autorizzazione di trasferimento dei suini
    dalle aziende situate nelle zone di protezione e di sorveglianza istituite in
    Spagna a seguito della peste suina classica e che fissa le condizioni per la marcatura
    e l''utilizzazione delle carni suine a norma dell''articolo 11 della direttiva
    2001/89/CE del Consiglio (Testo rilevante ai fini del SEE) [notificata con il
    numero C(2002) 985]'
  type: main
- language: nl
  script: Latn
  content: '2002/209/EG: Beschikking van de Commissie van 11 maart 2002 houdende bĳwerking
    van de bepalingen voor het verlenen van de toestemming om varkens te verwĳderen
    van bedrĳven in beschermings- en in toezichtsgebieden die in Spanje zĳn ingesteld
    in verband met klassieke varkenspest en inzake het merken en het gebruik van varkensvlees
    overeenkomstig artikel 11 van Richtlĳn 2001/89/EG van de Raad (Voor de EER relevante
    tekst) (kennisgeving geschied onder nummer C(2002) 985)'
  type: main
- language: pt
  script: Latn
  content: '2002/209/CE: Decisão da Comissão, de 11 de Março de 2002, que actualiza
    as condições de concessão da autorização de saída de suínos de explorações
    situadas nas zonas de protecção e vigilância estabelecidas em Espanha devido
    à peste suína clássica e que estabelece as condições de marcação e utilização
    de carne de suíno em aplicação do artigo 11.° da Directiva 2001/89/CE do Conselho
    (Texto relevante para efeitos do EEE) [notificada com o número C(2002) 985]'
  type: main
- language: es
  script: Latn
  content: '2002/209/CE: Decisión de la Comisión, de 11 de marzo de 2002, por la
    que se actualizan las condiciones para la concesión de autorizaciones para sacar
    cerdos de explotaciones situadas dentro de las zonas de protección y vigilancia
    establecidas en España debido a la peste porcina clásica y por la que se establecen
    disposiciones sobre el marcado y la utilización de la carne de porcino con arreglo
    a lo establecido en el artículo 11 de la Directiva 2001/89/CE del Consejo (Texto
    pertinente a efectos del EEE) [notificada con el número C(2002) 985]'
  type: main
- language: sv
  script: Latn
  content: '2002/209/EG: Kommissionens beslut av den 11 mars 2002 om uppdatering av
    villkoren för att ge tillstånd för transport av svin från anläggningar som
    ligger inom de skydds- och övervakningszoner för klassisk svinpest som upprättats
    i Spanien och om upprättande av villkor för märkning och användning av griskött
    enligt artikel 11 i rådets direktiv 2001/89/EG (Text av betydelse för EES) [delgivet
    med nr K(2002) 985]'
