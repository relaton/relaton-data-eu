title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 947/2006 of 26 June 2006 specifying the extent
    to which applications lodged in June 2006 for import certificates in respect of
    young male bovine animals for fattening as part of a tariff quota provided for
    in Regulation (EC) No 800/2006 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 947/2006 de la Commission du 26 juin 2006 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois de juin 2006 pour les jeunes bovins mâles destinés à l'engraissement
    dans le cadre d'un contingent tarifaire prévu par le règlement (CE) n o 800/2006
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 947/2006 der Kommission vom 26. Juni 2006 über das
