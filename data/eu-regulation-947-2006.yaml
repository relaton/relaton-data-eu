    mladého skotu samčího pohlaví určeného na výkrm, podaným v červnu 2006
    v rámci celní kvóty dle nařízení (ES) č. 800/2006
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 947/2006 af 26. juni 2006 om fastsættelse
