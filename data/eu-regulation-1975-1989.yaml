title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1975/89 of 3 July 1989 re-establishing the
    levying of customs duties on polymers of halogenated olefins falling within CN
    code 3904 originating in Mexico to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1975/89 de la Commission du 3 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux polymères
    d'oléfines halogénés, du code NC 3904, originaires du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1975/89 DER KOMMISSION vom 3. Juli 1989 zur Wiedereinführung
    der Erhebung der Zölle für Polymere der halogenierten Olefine des KN-Code 3904
    mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1975/89 af 3. juli 1989 om genindførelse
