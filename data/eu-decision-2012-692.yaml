title:
- language: en
  script: Latn
  content: '2012/692/EU: Commission Implementing Decision of 6 November 2012 amending
    the Annexes to Decision 2006/766/EC as regards the entries in the lists of third
    countries and territories from which imports of bivalve molluscs, echinoderms,
    tunicates, marine gastropods and fishery products for human consumption are permitted
    (notified under document C(2012) 7696)'
  type: main
- language: fr
  script: Latn
  content: '2012/692/UE: Décision d’exécution de la Commission du 6 novembre 2012
    modifiant les annexes de la décision 2006/766/CE en ce qui concerne les inscriptions
    sur les listes des pays tiers et territoires en provenance desquels l’importation
    de mollusques bivalves, d’échinodermes, de tuniciers, de gastéropodes marins
    et de produits de la pêche destinés à l’alimentation humaine est autorisée
    [notifiée sous le numéro C(2012) 7696]'
  type: main
- language: de
  script: Latn
  content: '2012/692/EU: Durchführungsbeschluss der Kommission vom 6. November 2012
    zur Änderung der Anhänge der Entscheidung 2006/766/EG hinsichtlich der Einträge
    in den Listen der Drittländer und Gebiete, aus denen die Einfuhr von Muscheln,
    Stachelhäutern, Manteltieren und Meeresschnecken sowie Fischereierzeugnissen
    zum menschlichen Verzehr zulässig ist (Bekanntgegeben unter Aktenzeichen C(2012)
    7696)'
  type: main
- language: bg
