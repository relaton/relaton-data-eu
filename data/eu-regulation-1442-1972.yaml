  content: Règlement (CEE) n° 1442/72 de la Commission, du 6 juillet 1972, modifiant
    le règlement (CEE) n° 2496/71 en prorogeant jusqu'au 31 août 1972 le délai
    pour la livraison de l'alcool obtenu au titre de la distillation obligatoire des
    sous-produits de la vinification
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1442/72 der Kommission vom 6. Juli 1972 zur Änderung
    der Verordnung (EWG) Nr. 2496/71 und zur Verlängerung des Zeitpunkts für die
    Ablieferung des aus der vorgeschriebenen Destillierung von Nebenerzeugnissen der
    Weinbereitung gewonnenen Alkohols bis 31. August 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1442/72 della Commissione, del 6 luglio 1972, che
    modifica il regolamento (CEE) n. 2496/71 prorogando fino al 31 agosto 1972 il
    termine di consegna dell'alcole ottenuto a titolo della distillazione obbligatoria
    dei sotto-prodotti della vinificazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1442/72 van de Commissie van 6 juli 1972 tot wijziging
