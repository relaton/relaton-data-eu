title:
- language: en
  script: Latn
  content: '91/349/EEC: Commission Decision of 17 June 1991 modifying the Decision
    91/211/EEC concerning the establishment of the addendum to the Community support
    framework for the Community structural assistance for Portugal concerning the
    improvement of conditions for the processing and marketing of fishery and aquaculture
    products (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/349/CEE: Décision de la Commission du 17 juin 1991 modifiant la décision
    91/211/CEE concernant l''établissement d''un avenant au cadre communautaire d''appui
    pour les interventions structurelles communautaires au Portugal relatif à l''amélioration
    des conditions de transformation et de commercialisation des produits de la pêche
    et de l''aquaculture (Le texte en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 17. Juni 1991 zur Änderung der Entscheidung
    91/211/EWG über einen Nachtrag zum Gemeinschaftlichen Förderkonzept für gemeinschaftliche
    Strukturinterventionen in Portugal zur Verbesserung der Verarbeitungs- und der
    Vermarktungsbedingungen für Erzeugnisse der Fischerei und der Aquakultur (Nur
    der portugiesische Text ist verbindlich) (91/349/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 17. juni 1991 om modifikation af beslutning
    91/211/EØF vedrørende indsættelse af tillæg til fællesskabsstøtterammen
    for Fællesskabets strukturinterventioner i Portugal vedrørende forbedring af
    vilkårene for forarbejdning og afsætning af fiskerivarer og akvakulturprodukter
    (Kun den portugisiske udgave er autentisk) (91/349/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/349/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Ιουνίου 1991 που τροποποιεί την απόφαση 91/211/ΕΟΚ
    για την καθιέρωση τροποποιητικής πράξης στο
    κοινοτικό πλαίσιο στήριξης για τις κοινοτικές
    διαρθρωτικές παρεμβάσεις στην Πορτογαλία
    όσον αφορά τη βελτίωση των συνθηκών μεταποίησης
    και εμπορίας των προϊόντων αλιείας και υδατοκαλλιέργειας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 17 giugno 1991 che modifica la decisione
    91/211/CEE concernente la definizione di una clausola aggiuntiva al quadro comunitario
    di sostegno per gli interventi strutturali comunitari in Portogallo relativi al
    miglioramento delle condizioni di trasformazione e di commercializzazione dei
    prodotti della pesca e dell'' acquicoltura (Il testo in lingua portoghese è il
    solo facente fede) (91/349/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 17 juni 1991 tot wijziging van Beschikking
    91/211/EEG betreffende de vaststelling van een aanhangsel bij het communautaire
    bestek voor de structurele bijstandsverlening van de Gemeenschap in Portugal voor
    de verbetering van de verwerking en de afzet van visserij- en aquicultuurprodukten
    (Slechts de tekst in de Portugese taal is authentiek) (91/349/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 17 de Junho de 1991 que altera a Decisão 91/211/CEE
    relativa ao estabelecimento de um aditamento ao quadro comunitário de apoio para
    as intervenções estruturais comunitárias relativas à melhoria das condições
    de transformação e comercialização dos produtos da pesca e da aquicultura
    em Portugal (Apenas faz fé o texto em língua portuguesa) (91/349/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 17 de junio de 1991 que modifica la Decisión
    91/211/CEE sobre el establecimiento de una cláusula adicional al marco comunitario
    de apoyo para las intervenciones estructurales comunitarias en Portugal, relativa
    a la mejora de las condiciones de transformación y de comercialización de los
    productos de la pesca y de la acuicultura (El texto en lengua portuguesa es el
    único auténtico) (91/349/CEE) #'
