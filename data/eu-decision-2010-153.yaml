    nodrošināt, ka tirgū netiek laisti vai nav pieejami biocīdu dimetilfumerātu
    saturoši produkti (izziņots ar dokumenta numuru C(2010) 1337)'
  type: main
- language: lt
  script: Latn
  content: '2010/153/: 2010 m. kovo 11 d. Komisijos sprendimas, pratęsti Sprendimo
