    pateikiami arba tiekiami gaminiai, kurių sudėtyje yra biocido dimetilfumarato,
    galiojimą (pranešta dokumentu Nr. C(2010) 1337)'
  type: main
- language: mt
  script: Latn
  content: '2010/153/: Deċiżjoni tal-Kummissjoni tal- 11 ta’ Marzu 2010 li ġġedded
