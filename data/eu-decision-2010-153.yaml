title:
- language: en
  script: Latn
  content: '2010/153/: Commission Decision of 11 March 2010 prolonging the validity
    of Decision 2009/251/EC requiring Member States to ensure that products containing
    the biocide dimethylfumarate are not placed or made available on the market (notified
    under document C(2010) 1337)'
  type: main
- language: fr
  script: Latn
  content: '2010/153/: Décision de la Commission du 11 mars 2010 prorogeant la validité
    de la décision 2009/251/CE exigeant des États membres qu’ils veillent à ce
    que les produits contenant du fumarate de diméthyle (produit biocide) ne soient
    pas commercialisés ou mis à disposition sur le marché [notifiée sous le numéro
    C(2010) 1337]'
  type: main
- language: de
  script: Latn
  content: '2010/153/: Beschluss der Kommission vom 11. März 2010 zur Verlängerung
    des Anwendungszeitraums der Entscheidung 2009/251/EG zur Verpflichtung der Mitgliedstaaten,
    dafür zu sorgen, dass Produkte, die das Biozid Dimethylfumarat enthalten, nicht
    in Verkehr gebracht oder auf dem Markt bereitgestellt werden (Bekannt gegeben
    unter Aktenzeichen K(2010) 1337)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/153/ЕС: Решение на Комисията от 11 март
    2010 година за продължаване на валидността на
    Решение 2009/251/ЕО за изискване към държавите-членки
    да гарантират, че на пазара не се пускат или
    предлагат продукти, които съдържат биоцида
    диметилфумарат (нотифицирано под номер C(2010)
    1337)'
  type: main
- language: cs
  script: Latn
  content: '2010/153/: Rozhodnutí Komise ze dne 11. března 2010 , kterým se prodlužuje
    platnost rozhodnutí 2009/251/ES, kterým se členským státům ukládá povinnost
    zajistit, aby výrobky obsahující biocid dimethyl-fumarát nebyly uváděny
    nebo dodávány na trh (oznámeno pod číslem K(2010) 1337)'
  type: main
- language: da
  script: Latn
  content: '2010/153/: Kommissionens afgørelse af 11. marts 2010 om forlængelse
    af gyldigheden af beslutning 2009/251/EF om et krav til medlemsstaterne om at
    sørge for, at produkter indeholdende biocidet dimethylfumarat ikke bringes i
    omsætning eller gøres tilgængelige på markedet (meddelt under nummer K(2010)
    1337)'
  type: main
- language: el
  script: Grek
  content: '2010/153/: Απόφαση της Επιτροπής, της 11ης Μαρτίου
    2010 , για την παράταση της ισχύος της απόφασης
    2009/251/ΕΚ η οποία απαιτεί από τα κράτη μέλη να
    διασφαλίσουν ότι δεν τίθενται ούτε διατίθενται
    στην αγορά προϊόντα που περιέχουν το βιοκτόνο
    φουμαρικό διμεθύλιο [κοινοποιηθείσα υπό τον
    αριθμό Ε(2010) 1337]'
  type: main
- language: et
  script: Latn
  content: '2010/153/: Komisjoni otsus, 11. märts 2010 , millega pikendatakse otsuse
    2009/251/EÜ (millega kohustatakse liikmesriike tagama, et biotsiidi dimetüülfumaraati
    sisaldavaid tooteid ei lasta turule ega tehta turul kättesaadavaks) kehtivust
    (teatavaks tehtud numbri K(2010) 1337 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/153/: Komission päätös, annettu 11 päivänä maaliskuuta 2010
    , jäsenvaltioiden velvoittamisesta varmistamaan, että dimetyylifumaraatti-nimistä
    biosidia sisältäviä tuotteita ei saateta markkinoille eikä aseteta saataville
    markkinoilla, tehdyn päätöksen 2009/251/EY voimassaolon pidentämisestä (tiedoksiannettu
    numerolla K(2010) 1337)'
  type: main
- language: hr
  script: Latn
  content: '2010/153/EU: Odluka Komisije od 11. ožujka 2010. o produljenju valjanosti
    Odluke 2009/251/EZ o zahtijevanju od država članica da osiguraju da se proizvodi
    koji sadrže biocid dimetil fumarat ne stavljaju na tržište i da nisu dostupni
    na njemu (priopćena pod brojem dokumenta C(2010) 1337)'
  type: main
- language: hu
  script: Latn
  content: '2010/153/: A Bizottság határozata ( 2010. március 11.) a dimetil-fumarát
    biocidot tartalmazó termékek forgalomba hozatala vagy piaci hozzáférhetővé
    tétele megtiltásának a tagállamok számára való előírásáról szóló
    2009/251/EK határozat érvényességének meghosszabbításáról (az értesítés
    a C(2010) 1337. számú dokumentummal történt)'
  type: main
