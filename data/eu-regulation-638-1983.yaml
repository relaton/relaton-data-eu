title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 638/83 of 18 March 1983 re-establishing
    the levying of customs duties on under garments, knitted or crocheted, products
    of category 25 (code 0250), originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 638/83 de la Commission du 18 mars 1983 portant rétablissement
    de la perception des droits de douane applicables aux pyjamas et chemises de nuit
    de bonneterie de la catégorie 25 (code 0250), originaires de l' Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 638/83 der Kommission vom 18. März 1983 über die
    Wiedereinführung des Zollsatzes für Schlafanzüge und Nachthemden aus Gewirken
    der Warenkategorie Nr. 25 (Kennziffer 0250), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 638/83 af 18. marts 1983 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage under
    kategori 25 (kode 0250), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 638/83 της Επιτροπής
    της 18ης Μαρτίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για πυζάμες και
    νυκτικά, πλεκτά, των προϊόντων της κατηγορίας
    25 (κωδικός 0250), καταγωγής Ινδίας, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 638/83 della Commissione del 18 marzo 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai pigiami e alle camicie da notte
    a maglia, della categoria di prodotti n. 25 (codice 0250), originari dell' India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 638/83 van de Commissie van 18 maart 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op pyjama'
    s en nachthemden van brei- of haakwerk van de categorie van produkten nr. 25 (codenummer
    0250), van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
