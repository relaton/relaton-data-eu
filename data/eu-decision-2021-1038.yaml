  script: Latn
  content: Commission Decision (EU) 2021/1038 of 23 June 2021 granting a transitional
    period to the Kingdom of the Netherlands pursuant to Decision 2008/477/EC as regards
    an update of relevant technical conditions applicable to the 2500-2690 MHz frequency
    band (notified under document C(2021) 4433) (Only the Dutch text is authentic)
  type: main
