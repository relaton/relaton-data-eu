title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1379/90 of 22 May 1990 re-establishing the
    levying of customs duties on woven fabrics of synthetic fibres (staple or waste),
    products of category 3 (order No 40.0033), originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1379/90 de la Commission du 22 mai 1990 portant rétablissement
    de la perception des droits de douane applicables aux tissus de fibres synthétiques
    discontinues de la catégorie de produits n° 3 (numéro d'ordre 40.0033) originaires
    de l'Inde, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1379/90 DER KOMMISSION vom 22. Mai 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Gewebe aus synthetischen Spinnfasern der
    Warenkategorie 3 (laufende Nummer 40.0033) mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1379/90 af 22. maj 1990 om genindførelse
    af opkrævning af told for vævet stof af korte syntetiske fibre, under varekategori
    nr. 3 (løbenummer 40.0033), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1379/90 της Επιτροπής
    της 22ας Μαΐου 1990 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για υφάσματα από συνθετικές
    και τεχνητές ίνες, προϊόντα της κατηγορίας
    3 ( αύξων αριθμός 40.0033 ), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3897/89 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1379/90 DELLA COMMISSIONE del 22 maggio 1990 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche
    in fiocco, della categoria di prodotti n. 3 (numero d'ordine 40.0033) originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1379/90 VAN DE COMMISSIE van 22 mei 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische stapelvezels, van de categorie van produkten nr. 3 (volgnummer
    40.0033), van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1379/90 DA COMISSAO de 22 de Maio de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis aos tecidos de fibras sintéticas
    (descontinuas), da categoria de produtos 3 (numero de ordem 40.0033), originarios
    da India, beneficiarios das preferências pautais previstas no Regulamento (CEE)
    n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
