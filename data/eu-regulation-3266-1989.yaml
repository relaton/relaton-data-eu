title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3266/89 of 30 October 1989 re-establishing
    the levying of customs duties on statuettes and other ornamental ceramic articles
    falling within CN code 6913 originating in China to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3266/89 de la Commission du 30 octobre 1989 portant
    rétablissement de la perception des droits de douane applicables aux statuettes
    et autres objets d'ornementation en céramique du code NC 6913, originaires de
    la Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3266/89 DER KOMMISSION vom 30. Oktober 1989 zur Wiedereinführung
    der Erhebung der Zölle für Statuetten und andere keramische Ziergegenstände
    des KN-Code 6913 mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 4257/88
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3266/89 af 30. oktober 1989 om genindførelse
    af opkrævning af told for statuetter og andre dekorationsgenstande af keramisk
    materiale henhørende under KN-kode 6913 og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3266/89 της Επιτροπής
