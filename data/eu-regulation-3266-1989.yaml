    και άλλα αντικείμενα διακόσμησης από κεραμευτική
    ύλη, του κωδικού ΣΟ 6913, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4257/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
