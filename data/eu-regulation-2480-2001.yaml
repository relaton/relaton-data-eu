title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2480/2001 of 17 December 2001 determining
    the quantity available for the first half of 2002 for certain products in the
    milk and milk products sector under the schemes provided for in the Europe Agreements
    between the Community and the Republic of Hungary, the Republic of Poland, the
    Czech Republic, the Slovak Republic, Bulgaria, Romania and Slovenia, and in the
    Agreements on free trade between the Community and the Baltic States
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2480/2001 de la Commission du 17 décembre 2001 déterminant
    la quantité disponible pour le premier semestre de 2002 pour certains produits
    dans le secteur du lait et des produits laitiers dans le cadre des régimes prévus
    par les accords européens entre la Communauté et la République de Hongrie,
    la République de Pologne, la République tchèque, la République slovaque, la
    Bulgarie, la Roumanie et la Slovénie et du régime prévu par les accords sur
    la libéralisation des échanges entre la Communauté et les pays baltes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2480/2001 der Kommission vom 17. Dezember 2001 zur
