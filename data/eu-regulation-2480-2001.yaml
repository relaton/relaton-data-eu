    Menge im Rahmen der Regelungen gemäß den Europa-Abkommen zwischen der Gemeinschaft
    und der Republik Ungarn, der Republik Polen, der Tschechischen Republik, der Slowakischen
    Republik, Bulgarien, Rumänien und Slowenien und der Regelung gemäß dem Freihandelsabkommen
    zwischen der Gemeinschaft und den Baltischen Staaten
  type: main
- language: da
