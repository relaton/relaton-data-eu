    zur Annahme des Änderungsantrags 46 zu Anhang 6 Teil I und des Änderungsantrags
    39 zu Anhang 6 Teil II des Abkommens über die Internationale Zivilluftfahrt,
    den Aufschub der künftigen Anforderung der Ausstattung mit 25-Stunden-Tonaufzeichnungsanlagen
    für das Cockpit zur Vermeidung unbeabsichtigter Folgen aufgrund der COVID-19-Pandemie
    betreffend, zu vertreten ist
