- language: en
  script: Latn
  content: Council Decision (EU) 2020/1584 of 26 October 2020 on the position to be
    taken on behalf of the European Union within the Council of the International
    Civil Aviation Organization as regards the adoption of Amendment 46 to Annex 6,
    Part I, and Amendment 39 to Annex 6, Part II, to the Convention on International
    Civil Aviation, related to deferral of the future equipage requirement for 25-hour
    cockpit voice recorder to avoid unintended consequences due to the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1584 du Conseil du 26 octobre 2020 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil de l’Organisation
    de l’aviation civile internationale en ce qui concerne l’adoption de l’amendement
    46 à l’annexe 6, partie I, et de l’amendement 39 à l’annexe 6, partie
    II, de la convention relative à l’aviation civile internationale relatifs au
    report de la future exigence en matière d’enregistreurs de conversation du
    poste de pilotage de vingt-cinq heures afin d’éviter des conséquences involontaires
    dues à la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/1584 des Rates vom 26. Oktober 2020 über den Standpunkt,
