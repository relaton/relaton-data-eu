title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1672/98 of 29 July 1998 determining the extent
    to which applications lodged in July 1998 for licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1672/98 de la Commission du 29 juillet 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1998 pour certains produits des secteurs de la viande de volaille et
    des oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque,
    la Slovaquie, la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1672/98 der Kommission vom 29. Juli 1998 über die
    Festsetzung des Umfangs, in dem die im Juli 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakei, Rumänien und Bulgarien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1672/98 af 29. juli 1998 om fastættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1998 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Slovakiet, Rumænien
    og Republikken Bulgarien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1672/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Ιουλίου 1998 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Ιούλιο του 1998 για πιστοποιητικά
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
    τις οποίες συνήψε η Κοινότητα με τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακία τη Ρουμανία
    και τη Βουλγαρία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1672/98, annettu 29 päivänä heinäkuuta 1998,
    yhteisön sekä Puolan, Unkarin, Tsekin tasavallan, Slovakian, Romanian ja Bulgarian
    välisissä väliaikaisissa sopimuksissa määrättyyn järjestelmään liittyvien
    heinäkuussa 1998 jätettyjen tiettyjä siipikarjanliha- ja muna-alan tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1672/98 della Commissione del 29 luglio 1998 che stabilisce
