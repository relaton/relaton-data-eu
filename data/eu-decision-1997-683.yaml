title:
- language: en
  script: Latn
  content: '97/683/EC: Council Decision of 22 April 1997 approving the Agreement in
    the form of an exchange of letters between the Community and the ACP States concerning
    Annex XL to the fourth ACP-EC Convention relating to the Joint Declaration concerning
    agricultural products referred to in Article 168 (2) (a) (ii)'
  type: main
- language: fr
  script: Latn
  content: '97/683/CE: Décision du Conseil du 22 avril 1997 approuvant l''accord
    sous forme d''échange de lettres entre la Communauté et les États ACP relatif
    à l''annexe XL de la quatrième convention ACP-CE concernant la déclaration
    commune relative aux produits agricoles visés à son article 168 paragraphe 2
    point a) ii)'
  type: main
- language: de
  script: Latn
  content: '97/683/EG: Beschluß des Rates vom 22. April 1997 zur Genehmigung des
    Abkommens in Form eines Briefwechsels zwischen der Gemeinschaft und den AKP-Staaten
    zu der in Anhang XL des Vierten AKP-EG-Abkommens enthaltenen Gemeinsamen Erklärung
    betreffend die in Artikel 168 Absatz 2 Buchstabe a) Ziffer ii) genannten landwirtschaftlichen
    Erzeugnisse'
  type: main
- language: da
  script: Latn
  content: '97/683/EF: Rådets afgørelse af 22. april 1997 om godkendelse af aftalen
    i form af brevveksling mellem Fællesskabet og AVS-staterne vedrørende bilag
    XL til fjerde AVS-EF-konvention om den fælles erklæring om de landbrugsprodukter,
    der er omhandlet i konventionens artikel 168, stk. 2, litra a), nr. ii)'
  type: main
- language: el
  script: Grek
  content: '97/683/ΕΚ: Απόφαση του Συμβουλίου της 22ας
