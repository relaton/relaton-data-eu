    maataloustuotteista annettua yhteistä julistusta koskevaa kyseisen sopimuksen
    liitettä XL koskevan yhteisön ja AKT-valtioiden kirjeenvaihtona tehdyn sopimuksen
    hyväksymisestä'
  type: main
- language: it
