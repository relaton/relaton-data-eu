    μορφή ανταλλαγής επιστολών μεταξύ της Κοινότητας
    και των κρατών ΑΚΕ σχετικά με το παράρτημα
    XL της τέταρτης σύμβασης ΑΚΕ-ΕΚ που αφορά την
    κοινή δήλωση σχετικά με τα γεωργικά προϊόντα
    που αναφέρονται στο άρθρο 168 παράγραφος 2 στοιχείο
    α) σημείο ii)'
  type: main
- language: fi
  script: Latn
  content: '97/683/EY: Neuvoston päätös, tehty 22 päivänä huhtikuuta 1997, neljännen
