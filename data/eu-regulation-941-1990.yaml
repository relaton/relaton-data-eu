title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 941/90 of 11 April 1990 reintroducing the
    levying of the customs duties applicable to reception apparatus of CN codes 8527,
    8528 and 8529 originating in Malaysia to which the preferential arrangements of
    Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 941/90 de la Commission du 11 avril 1990 portant rétablissement
    de la perception des droits de douane applicables aux appareils récepteurs des
    codes NC 8527, 8528 et 8529, originaires de Malaysia, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 941/90 DER KOMMISSION vom 11. April 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Empfangsgeraete der KN-Code 8527, 8528 und 8529 mit
    Ursprung in Malaysia, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 941/90 af 11. april 1990 om genindførelse
    af opkrævning af told for fjernsynsmodtagere, henhørende under KN-kode 8527,
    8528 og 8529 og med oprindelse i Malaysia, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 941/90 της Επιτροπής
