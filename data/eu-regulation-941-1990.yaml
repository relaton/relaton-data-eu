  script: Latn
  content: REGOLAMENTO (CEE) N. 941/90 DELLA COMMISSIONE dell'11 aprile 1990 che ripristina
    la riscossione dei dazi doganali applicabili agli apparecchi riceventi dei codici
    NC 8527, 8528 e 8529, originari della Malaysia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 941/90 VAN DE COMMISSIE van 11 april 1990 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ontvangtoestellen
    van de GN-codes 8527, 8528 en 8529, van oorsprong uit Maleisië, waarvoor de in
    Verordening (EEG) nr. 3896/89 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
