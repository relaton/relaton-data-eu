    към Регламент (ЕО) № 2400/96 относно вписването
    на някои означения в Регистъра на защитените
    наименования за произход и на защитените географски
    указания, предвидено в Регламент (ЕИО) № 2081/92
    на Съвета за защитата на географските указания
    и наименованията за произход на селскостопанските
    и хранителните продукти (Calçot de Valls)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 905/2002 ze dne 30. května 2002, kterým se
    doplňuje příloha nařízení (ES) č. 2400/96 o zápisu určitých názvů
    do „Rejstříku chráněných označení původu a chráněných zeměpisných
    označení“ podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných
    označení a označení původu zemědělských produktů a potravin (Calçot
    de Valls)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 905/2002 af 30. maj 2002 om supplering
