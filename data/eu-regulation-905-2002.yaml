    (Calçot de Valls)
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 905/2002 od 30. svibnja 2002. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu određenih naziva u Registar zaštićenih oznaka
    izvornosti i zaštićenih oznaka zemljopisnog podrijetla kako je predviđeno u
    Uredbi Vijeća (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i oznaka
    izvornosti za poljoprivredne i prehrambene proizvode (Calçot de Valls)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 905/2002/EK rendelete (2002. május 30.) egyes neveknek a
    mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben foglalt, az oltalom alatt
    álló földrajzi jelzések és eredetmegjelölések nyilvántartásába való
    bejegyzéséről szóló 2400/96/EK rendelet mellékletének kiegészítéséről
    (Calçot de Valls)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 905/2002 della Commissione, del 30 maggio 2002, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel "Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette" di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari (Calçot de Valls)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 905/2002 (2002. gada 30. maijs), ar kuru papildina
    pielikumu Regulai (EK) Nr. 2400/96 par konkrētu nosaukumu iekļaušanu Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā,
    kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
    (Calçot de Valls)
  type: main
- language: lt
  script: Latn
  content: 2002 m. gegužės 30 d. Komisijos reglamentas (EB) Nr. 905/2002, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Reglamente
    (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų geografinių
    nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų kilmės vietos
    nuorodų ir saugomų geografinių nuorodų registrą“ priedą (Calçot de Valls)
  type: main
- language: mt
  script: Latn
