  script: Latn
  content: Council Directive 80/597/EEC of 29 May 1980 amending for the second time
    Directive 74/329/EEC on the approximation of the laws of the Member States relating
    to emulsifiers, stabilizers, thickeners and gelling agents for use in foodstuffs
  type: main
- language: fr
  script: Latn
  content: Directive 80/597/CEE du Conseil, du 29 mai 1980, portant deuxième modification
