    für Emulgatoren, Stabilisatoren, Verdickungs- und Geliermittel, die in Lebensmitteln
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/597/EØF af 29. maj 1980 om anden ændring af direktiv
