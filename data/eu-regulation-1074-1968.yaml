  content: Règlement (CEE) n 1074/68 de la Commission, du 25 juillet 1968, fixant
    un montant compensatoire à l'importation des huiles de tournesol originaires
    ou en provenance de Bulgarie, de Roumanie, de Hongrie, de Yougoslavie ou de l'U.R.S.S.
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1074/68 der Kommission vom 25. Juli 1968 zur Festsetzung
    einer Ausgleichsabgabe bei der Einfuhr von Sonnenblumenöl mit Ursprung in oder
    mit Herkunft aus Bulgarien, Rumänien, Ungarn, Jugoslawien oder der UdSSR
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1074/68 della Commissione, del 25 luglio 1968, che
    fissa un ammontare di compensazione all'importazione di oli di girasole originari
    o in provenienza dalla Bulgaria, dalla Jugoslavia, dall'Ungheria, dalla Romania
    e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1074/68 van de Commissie van 25 juli 1968 houdende
    vaststelling van een compenserend bedrag bij invoer van zonnebloemolie van oorsprong
    of van herkomst uit Bulgarije, Roemenië, Hongarije, Joegoslavië of de U.S.S.R
