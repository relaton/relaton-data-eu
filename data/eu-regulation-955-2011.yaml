  script: Latn
  content: Verordening (EU) nr. 955/2011 van het Europees Parlement en de Raad van
    14 september 2011 tot intrekking van Verordening (EG) nr. 1541/98 van de Raad
    betreffende de bewijsstukken inzake de oorsprong van bepaalde, in de Gemeenschap
    in het vrije verkeer gebrachte textielproducten van afdeling XI van de gecombineerde
    nomenclatuur en betreffende de voorwaarden waaronder die bewijsstukken kunnen
    worden aanvaard, en tot wijziging van Verordening (EEG) nr. 3030/93 van de Raad
    betreffende een gemeenschappelijke regeling voor de invoer van bepaalde textielproducten
    uit derde landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 955/2011 z dnia
    14 września 2011 r. uchylające rozporządzenie Rady (WE) nr 1541/98 w sprawie
    dowodu pochodzenia niektórych wyrobów włókienniczych objętych sekcją XI
    Nomenklatury scalonej i dopuszczonych do swobodnego obrotu we Wspólnocie oraz
    w sprawie warunków przyjęcia takiego dowodu, a także zmieniające rozporządzenie
