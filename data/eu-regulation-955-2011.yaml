    dažām tekstilprecēm, kas iekļautas kombinētās nomenklatūras XI iedaļā
    un ir laistas brīvā apgrozībā Kopienā, kā arī par šāda apliecinājuma
    akceptēšanas nosacījumiem, un groza Padomes Regulu (EEK) Nr. 3030/93 par kopīgiem
    noteikumiem konkrētu tekstilizstrādājumu importam no trešām valstīm
  type: main
- language: lt
  script: Latn
  content: 2011 m. rugsėjo 14 d. Europos Parlamento ir Tarybos reglamentas (ES) Nr.
    955/2011, kuriuo panaikinamas Tarybos reglamentas (EB) Nr. 1541/98 dėl tam tikrų
    tekstilės gaminių, klasifikuojamų Kombinuotosios nomenklatūros XI skyriuje
    ir išleidžiamų į laisvą apyvartą Bendrijoje, kilmės įrodymo ir dėl tokio
    įrodymo pripažinimo sąlygų ir kuriuo iš dalies keičiamas Tarybos reglamentas
    (EEB) Nr. 3030/93 dėl tam tikrų tekstilės gaminių importo iš trečiųjų
    šalių bendrųjų taisyklių
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) Nru 955/2011 tal-Parlament Ewropew u tal-Kunsill tal- 14
    ta’ Settembru 2011 li jħassar ir-Regolament tal-Kunsill (KE) Nru 1541/98 dwar
    il-prova tal-oriġini ta’ ċerti prodotti tessili li jidħlu fit-Taqsima XI
    tan-Nomenklatura Magħquda u rilaxxjati għaċ-ċirkolazzjoni ħielsa fil-Komunità
    u dwar il-kundizzjonijiet tal-aċċettazzjoni ta’ din il-prova, u li jemenda
    r-Regolament tal-Kunsill (KEE) Nru 3030/93 dwar regoli komuni għall-importazzjoni
    ta’ ċerti prodotti tat-tessuti minn pajjiżi terzi
  type: main
