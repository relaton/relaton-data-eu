    włókienniczych z państw trzecich
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. o 955/2011 do Parlamento Europeu e do Conselho, de
    14 de Setembro de 2011 , que revoga o Regulamento (CE) n. o 1541/98 do Conselho
    relativo à prova de origem de determinados produtos têxteis da secção XI da
    Nomenclatura Combinada, introduzidos em livre prática na Comunidade, bem como
    aos termos de admissibilidade da prova, e que altera o Regulamento (CEE) n. o
    3030/93 do Conselho relativo ao regime comum aplicável às importações de certos
    produtos têxteis originários de países terceiros
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 955/2011 al Parlamentului European și al Consiliului
    din 14 septembrie 2011 de abrogare a Regulamentului (CE) nr. 1541/98 al Consiliului
    privind dovezile de origine pentru anumite produse textile încadrate la secțiunea
    XI din Nomenclatura combinată, puse în liberă circulație în cadrul Comunității,
    precum și condițiile de acceptare a acestor dovezi, și de modificare a Regulamentului
    (CEE) nr. 3030/93 al Consiliului privind regimul comun aplicabil importurilor
    unor produse textile originare din țări terțe
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) č. 955/2011 zo 14. septembra
    2011 , ktorým sa zrušuje nariadenie Rady (ES) č. 1541/98 o preukázaní pôvodu
    niektorých textilných výrobkov patriacich do oddielu XI kombinovanej nomenklatúry
    a prepustených do režimu voľného obehu v Spoločenstve a o podmienkach prijatia
    takého preukázania a ktorým sa mení a dopĺňa nariadenie Rady (EHS) č. 3030/93
    o spoločných pravidlách dovozu určitých textilných výrobkov z tretích
    krajín
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) št. 955/2011 Evropskega parlamenta in Sveta z dne 14. septembra
    2011 o razveljavitvi Uredbe Sveta (ES) št. 1541/98 o dokazilu o poreklu blaga
    za nekatere tekstilne izdelke, iz oddelka XI kombinirane nomenklature, sproščene
    v prosti promet v Skupnosti, ter o pogojih za sprejem takšnega dokazila ter o
    spremembi Uredbe Sveta (EGS) št. 3030/93 o skupnih pravilih za uvoz nekaterih
    tekstilnih izdelkov po poreklu iz tretjih držav
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n o 955/2011 del Parlamento Europeo y del Consejo, de 14
    de septiembre de 2011 , por el que se deroga el Reglamento (CE) n o 1541/98 del
    Consejo, relativo a las justificaciones del origen de ciertos productos textiles
    incluidos en la sección XI de la nomenclatura combinada y despachados a libre
    práctica en la Comunidad, así como a las condiciones en que dichas justificaciones
    pueden ser aceptadas, y por el que se modifica el Reglamento (CEE) n o 3030/93
    del Consejo, relativo al régimen común aplicable a las importaciones de algunos
    productos textiles originarios de países terceros
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och Rådets Förordning (EU) nr 955/2011 av den 14 september
    2011 om upphävande av rådets förordning (EG) nr 1541/98 om ursprungsbevis för
    vissa textilprodukter enligt avdelning XI i Kombinerade nomenklaturen som övergått
    till fri omsättning i gemenskapen och om villkoren för godkännande av dessa
    ursprungsbevis, och om ändring av rådets förordning (EEG) nr 3030/93 om gemensamma
    regler för import av vissa textilprodukter från tredje land
  type: main
