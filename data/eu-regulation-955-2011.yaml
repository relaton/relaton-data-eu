title:
- language: en
  script: Latn
  content: Regulation (EU) No 955/2011 of the European Parliament and of the Council
    of 14 September 2011 repealing Council Regulation (EC) No 1541/98 on proof of
    origin for certain textile products falling within Section XI of the Combined
    Nomenclature and released for free circulation in the Community and on the conditions
    for the acceptance of such proof, and amending Council Regulation (EEC) No 3030/93
    on common rules for imports of certain textile products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 955/2011 du Parlement européen et du Conseil du 14
    septembre 2011 abrogeant le règlement (CE) n o 1541/98 du Conseil relatif aux
    justifications de l'origine de certains produits textiles relevant de la section
    XI de la nomenclature combinée mis en libre pratique dans la Communauté ainsi
    qu'aux conditions selon lesquelles ces justifications peuvent être acceptées,
    et modifiant le règlement (CEE) n o 3030/93 du Conseil relatif au régime commun
    applicable aux importations de certains produits textiles originaires des pays
    tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 955/2011 des Europäischen Parlaments und des Rates
    vom 14. September 2011 zur Aufhebung der Verordnung (EG) Nr. 1541/98 des Rates
    über die Ursprungsnachweise für bestimmte, in der Gemeinschaft in den zollrechtlich
    freien Verkehr übergeführte Textilwaren des Abschnitts XI der Kombinierten Nomenklatur
    sowie über die Voraussetzungen für die Anerkennung dieser Nachweise und zur
    Änderung der Verordnung (EWG) Nr. 3030/93 des Rates über die gemeinsame Einfuhrregelung
    für bestimmte Textilwaren mit Ursprung in Drittländern
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 955/2011 на Европейския парламент
    и на Съвета от 14 септември 2011 година за отмяна
    на Регламент (ЕО) № 1541/98 на Съвета относно доказателствата
    за произход на някои текстилни продукти, включени
    в раздел ХI от Комбинираната номенклатура и
    пуснати в свободно обращение в Общността, както
    и относно условията за приемане на тези доказателства,
    и за изменение на Регламент (ЕИО) № 3030/93 на Съвета
    относно общите правила за внос на някои текстилни
    продукти с произход от трети страни
  type: main
