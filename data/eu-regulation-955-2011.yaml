  script: Latn
  content: Uredba (EZ) br. 955/2011 Europskog parlamenta i Vijeća od 14. rujna 2011.
    o stavljanju izvan snage Uredbe Vijeća (EZ) br. 1541/98 o dokazu o podrijetlu
    za određene tekstilne proizvode obuhvaćene odjeljkom XI. kombinirane nomenklature
    koji se puštaju u slobodan promet u Zajednici i o uvjetima prihvaćanja takvog
    dokaza te o izmjeni Uredbe Vijeća (EEZ) br. 3030/93 o zajedničkim pravilima
    za uvoz određenih tekstilnih proizvoda iz trećih zemalja
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 955/2011/EU rendelete ( 2011. szeptember
    14. ) a Kombinált Nómenklatúra XI. áruosztályába tartozó és a Közösségben
    szabad forgalomba bocsátott egyes textiltermékek származásának igazolásáról,
    valamint az ilyen igazolás elfogadásának feltételeiről szóló 1541/98/EK
    tanácsi rendelet hatályon kívül helyezéséről, valamint a meghatározott
    textiltermékek harmadik országokból történő behozatalának közös szabályairól
    szóló 3030/93/EGK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 955/2011 del Parlamento europeo e del Consiglio, del
    14 settembre 2011 , che abroga il regolamento (CE) n. 1541/98 del Consiglio, relativo
    alle attestazioni d’origine di taluni prodotti tessili della sezione XI della
    nomenclatura combinata immessi in libera pratica nella Comunità, nonché alle
    condizioni cui è subordinata l’accettazione di tali attestazioni, e che modifica
    il regolamento (CEE) n. 3030/93 del Consiglio, relativo al regime comune da applicare
    alle importazioni di alcuni prodotti tessili originari dei paesi terzi
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) Nr. 955/2011 ( 2011. gada 14.
