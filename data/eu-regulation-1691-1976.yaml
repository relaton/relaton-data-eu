id: EURegulation16911976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1691/76 of 13 July 1976 re-establishing
    the levying of customs duties on other outer garments, clothing accessories, etc.,
    of cotton, falling within subheadings 60.05 A ex II and ex B, originating in Pakistan,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1691/76 de la Commission, du 13 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres vêtements
    de dessus, accessoires du vêtement, etc., de coton, des sous-positions tarifaires
    60.05 A, EX II, EX B, originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3002/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1691/76 der Kommission vom 13. Juli 1976 über die
    Wiedereinführung des Zollsatzes für bestimmte Oberkleidung, Bekleidungszubehör
    und andere Wirkwaren usw., aus Baumwolle, der Tarifstellen 60.05 A ex II und ex
    B, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3002/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1691/76 af 13. juli 1976 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande og andre varer af
    trikotage, etc., af bomuld, under underpositionerne 60.05 A ex II og ex B, som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1691/76 della Commissione, del 13 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli altri indumenti esterni,
    accessori di abbigliamento, ecc., di cotone, delle sottovoci doganali 60.05 A
    ex II ed ex B, originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1691/76 van de Commissie van 13 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere bovenkleding,
    kledingtoebehoren, enz., van katoen, van onderverdelingen 60.05 A ex II en ex
    B, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november 1975
  type: main
