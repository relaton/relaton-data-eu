id: EUDecision1980788
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/788/EEC: Commission Decision of 18 July 1980 authorizing Ireland not
    to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats, twinsets,
    cardigans, bed-jackets and jumpers, falling within subheading ex 60.05 A II of
    the Common Customs Tariff (category 5), originating in Taiwan and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/788/CEE: Décision de la Commission, du 18 juillet 1980, autorisant
    l''Irlande à exclure du traitement communautaire les chandails, "pullovers",
    "twinsets", gilets et vestes de la sous-position ex 60.05 A II du tarif douanier
    commun (catégorie 5), originaires de T''ai-wan et mis en libre pratique dans
    les autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/788/EWG: Entscheidung der Kommission vom 18. Juli 1980, mit der Irland
    ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und Strickjacken
    der Tarifstelle ex 60.05 A II des Gemeinsamen Zolltarifs (Kategorie 5) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/788/EØF: Kommissionens beslutning af 18. juli 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage sweatere, pull-overe, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste, som henhører under pos. ex
    60.05 A II i den fælles toldtarif (kategori 5), har oprindelse i Taiwan og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/788/CEE: Decisione della Commissione, del 18 luglio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario maglie, pullover, con o senza
    maniche, slip-over, twinset, giubbetti e giacche, della sottovoce ex 60.05 A II
    della tariffa doganale comune, categoria 5, originari di Taiwan e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/788/EEG: Beschikking van de Commissie van 18 juli 1980 waarbij Ierland
    wordt gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten en jasjes
    van post ex 60.05 A II van het gemeenschappelijk douanetarief (categorie 5), van
    oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
