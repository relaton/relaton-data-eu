title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 668/79 of 4 April 1979 re-establishing the
    levying of customs duties on tarpaulins, sails, awnings, etc., falling within
    heading No 62.04 and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 668/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations, stores d' extérieur, tentes et articles de campement,
    de la position 62.04 du tarif douanier commun, originaires des pays et territoires
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 668/79 der Kommission vom 4. April 1979 zur Wiedereinführung
    des Zollsatzes für Planen, Segel, Markisen, Zelte und Zeltlagerausrüstungen
    der Tarifnummer 62.04, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 668/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl, markiser, etc., under pos.
    62.04, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 668/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai copertoni, vele per imbarcazioni,
    tende per l' esterno, ecc., della voce doganale 62.04, originari dei paesi in
    via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 668/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dekkleden,
    scheepszeilen, zonneschermen voor winkelpuien, enz., van post 62.04, van oorsprong
    uit de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij Verordening (EEG)
    nr. 3157/78 van de Raad tariefpreferenties werden geopend
  type: main
