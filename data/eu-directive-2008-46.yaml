    reikalavimų, susijusių su fizikinių veiksnių (elektromagnetinių laukų) keliama
    rizika darbuotojams (aštuonioliktoji atskira direktyva, kaip apibrėžta Direktyvos
    89/391/EEB 16 straipsnio 1 dalyje)
  type: main
- language: mt
  script: Latn
