    s obzirom na izloženost radnika rizicima uzrokovanim fizikalnim čimbenicima
    (elektromagnetska polja) (18. pojedinačna direktiva u smislu članka 16. stavka
    1. Direktive 89/391/EEZ)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2008/46/EK irányelve ( 2008. április
    23. ) a munkavállalók fizikai tényezők (elektromágneses terek) hatásából
    keletkező kockázatoknak való expozíciójára vonatkozó egészségügyi és
    biztonsági minimumkövetelményekről szóló 2004/40/EK irányelv (18. egyedi
    irányelv a 89/391/EGK irányelv 16. cikke (1) bekezdésének értelmében) módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2008/46/CE del Parlamento europeo e del Consiglio, del 23 aprile
    2008 , che modifica la direttiva 2000/40/CE sulle prescrizioni minime di sicurezza
    e di salute relative all’esposizione dei lavoratori ai rischi derivanti dagli
    agenti fisici (campi elettromagnetici) (diciottesima direttiva particolare ai
    sensi dell’articolo 16, paragrafo 1, della direttiva 89/391/CEE)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2008/46/EK ( 2008. gada 23. aprīlis
    ), ar kuru groza Direktīvu 2004/40/EK par minimālajām drošības un veselības
    aizsardzības prasībām attiecībā uz darba ņēmēju pakļaušanu riskam, ko
    rada fizikāli faktori (elektromagnētiskie lauki) (18. atsevišķā direktīva
    Direktīvas 89/391/EEK 16. panta 1. punkta nozīmē)
  type: main
- language: lt
  script: Latn
  content: 2008 m. balandžio 23 d. Europos Parlamento ir Tarybos direktyva 2008/46/EB,
