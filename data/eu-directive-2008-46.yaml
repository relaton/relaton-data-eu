    u s-sigurtà fir-rigward ta’ l-espożizzjoni ta’ ħaddiema għal riskji li
    jiġu minn aġenti fiżiċi (kampi elettro-manjetiċi) (It-tmintax-il Direttiva
    individwali fis-sens ta’ l-Artikolu 16(1) tad-Direttiva 89/391/KEE)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/46/EG van het Europees Parlement en de Raad van 23 april
