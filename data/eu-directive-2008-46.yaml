title:
- language: en
  script: Latn
  content: Directive 2008/46/EC of the European Parliament and of the Council of 23
    April 2008 amending Directive 2004/40/EC on minimum health and safety requirements
    regarding the exposure of workers to the risks arising from physical agents (electromagnetic
    fields) (18th individual Directive within the meaning of Article 16(1) of Directive
    89/391/EEC)
  type: main
- language: fr
  script: Latn
  content: Directive 2008/46/CE du Parlement européen et du Conseil du 23 avril 2008
    modifiant la directive 2004/40/CE concernant les prescriptions minimales de sécurité
    et de santé relatives à l’exposition des travailleurs aux risques dus aux
    agents physiques (champs électromagnétiques) (dix-huitième directive particulière
    au sens de l’article 16, paragraphe 1, de la directive 89/391/CEE)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/46/EG des Europäischen Parlaments und des Rates vom 23.
    April 2008 zur Änderung der Richtlinie 2004/40/EG über Mindestvorschriften zum
    Schutz von Sicherheit und Gesundheit der Arbeitnehmer vor der Gefährdung durch
    physikalische Einwirkungen (elektromagnetische Felder) (18. Einzelrichtlinie im
    Sinne des Artikels 16 Absatz 1 der Richtlinie 89/391/EWG)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2008/46/ЕО на Европейския парламент
    и на Съвета от 23 април 2008 година за изменение
    на Директива 2004/40/ЕО относно минималните изисквания
    за здраве и безопасност, свързани с експозицията
    на работниците на рискове, дължащи се на физически
    агенти (електромагнитни полета) (Осемнадесета
    специална директива по смисъла на член 16, параграф
    1 от Директива 89/391/ЕИО)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2008/46/ES ze dne 23. dubna 2008
    , kterou se mění směrnice 2004/40/ES o minimálních požadavcích na bezpečnost
    a ochranu zdraví před expozicí zaměstnanců rizikům spojeným s fyzikálními
    činiteli (elektromagnetickými poli) (osmnáctá samostatná směrnice ve smyslu
    čl. 16 odst. 1 směrnice 89/391/EHS)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2008/46/EF af 23. april 2008 om
    ændring af direktiv 2004/40/EF om minimumsforskrifter for sikkerhed og sundhed
    i forbindelse med arbejdstagernes eksponering for risici på grund af fysiske
    agenser (elektromagnetiske felter) (18. særdirektiv i henhold til artikel 16,
    stk. 1, i direktiv 89/391/EØF)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2008/46/ΕΚ του Ευρωπαïκού Κοινοβουλίου
