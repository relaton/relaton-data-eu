    aan de risico’s van fysische agentia (elektromagnetische velden) (achttiende
    bijzondere richtlijn in de zin van artikel 16, lid 1, van Richtlijn 89/391/EEG)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2008/46/WE z dnia 23 kwietnia
    2008 r. zmieniająca dyrektywę 2004/40/WE w sprawie minimalnych wymagań w zakresie
    ochrony zdrowia i bezpieczeństwa dotyczących narażenia pracowników na ryzyko
    spowodowane czynnikami fizycznymi (polami elektromagnetycznymi) (osiemnasta dyrektywa
    szczegółowa w rozumieniu art. 16 ust. 1 dyrektywy 89/391/EWG)
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/46/CE do Parlamento Europeu e do Conselho, de 23 de Abril
    de 2008 , que altera a Directiva 2004/40/CE relativa às prescrições mínimas
    de segurança e saúde em matéria de exposição dos trabalhadores aos riscos
    devidos aos agentes físicos (campos electromagnéticos) (18.° directiva especial
    na acepção do n.° 1 do artigo 16.° da Directiva 89/391/CEE)
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/46/CE a Parlamentului European și a Consiliului din 23
    aprilie 2008 de modificare a Directivei 2004/40/CE privind cerințele minime de
