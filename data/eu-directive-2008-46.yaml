    de agenții fizici (câmpuri electromagnetice) [a optsprezecea directivă specială
    în sensul articolului 16 alineatul (1) din Directiva 89/391/CEE]
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2008/46/ES z 23. apríla 2008 ,
    ktorou sa mení a dopĺňa smernica 2004/40/ES o minimálnych zdravotných a bezpečnostných
    požiadavkách týkajúcich sa vystavenia pracovníkov rizikám vyplývajúcim
    z fyzikálnych činidiel (elektromagnetické polia) (18. individuálna smernica
    v zmysle článku 16 ods. 1 smernice 89/391/EHS)
  type: main
