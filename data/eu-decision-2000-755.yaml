    κτηνιατρικής πιστοποίησης που απαιτούνται
    για την εισαγωγή νωπών κρεάτων προερχόμενων
    από ορισμένες χώρες της Νότιας Αμερικής, έτσι
    ώστε να ληφθεί υπόψη η υγειονομική κατάσταση
