    und der Veterinärzeugnisse für die Einfuhr von frischem Fleisch aus einigen
    südamerikanischen Ländern angesichts der Tiergesundheitslage in Uruguay (Bekannt
    gegeben unter Aktenzeichen K(2000) 3560)'
  type: main
- language: da
  script: Latn
  content: '2000/755/EF: Kommissionens beslutning af 24. november 2000 om ændring
