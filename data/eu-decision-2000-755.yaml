title:
- language: en
  script: Latn
  content: '2000/755/EC: Commission Decision of 24 November 2000 amending Decision
    93/402/EEC concerning animal health conditions and veterinary certification for
    imports of fresh meat from South American countries to take account of the animal
    health situation in Uruguay (notified under document number C(2000) 3560)'
  type: main
- language: fr
  script: Latn
  content: '2000/755/CE: Décision de la Commission du 24 novembre 2000 modifiant
    la décision 93/402/CEE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays d''Amérique du Sud, afin de tenir compte de certains aspects concernant
    l''Uruguay [notifiée sous le numéro C(2000) 3560]'
  type: main
- language: de
  script: Latn
  content: '2000/755/EG: Entscheidung der Kommission vom 24. November 2000 zur Änderung
