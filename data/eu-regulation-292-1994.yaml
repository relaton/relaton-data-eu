    την Τσεχική Δημοκρατία και τη Σλοβακική Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 292/94 della Commissione, del 9 febbraio 1994, che
    rettifica il regolamento (CE) n. 152/94 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli di importazione presentate nel mese di gennaio
    1994 per taluni prodotti del settore delle carni suine nel quadro del regime previsto
    dagli accordi interinali conclusi tra la Comunità e la Repubblica di Polonia,
    la Repubblica d'Ungheria, la Repubblica ceca e la Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 292/94 van de Commissie van 9 februari 1994 tot wijziging
    van Verordening (EG) nr. 152/94 tot vaststelling van de mate waarin gevolg kan
    worden gegeven aan de aanvragen om invoercertificaten voor bepaalde produkten
    in de sector varkensvlees, die in januari 1994 worden ingediend op grond van de
