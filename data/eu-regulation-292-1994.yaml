title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 292/94 of 9 February 1994 amending Regulation
    (EC) No 152/94 determining the extent to which applications lodged in January
    1994 for import licences for certain pigmeat products under the arrangements provided
    for by the Interim Agreements concluded by the Community with the Republic of
    Poland, the Republic of Hungary, the Czech Republic and the Slovak Republic can
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 292/94 de la Commission, du 9 février 1994, rectifiant
    le règlement (CE) n 152/94 déterminant la mesure dans laquelle les demandes
    de licences d'importation introduites en janvier 1994 pour certains produits à
    base de viande de porc dans le cadre du régime prévu par les accords intérimaires
    conclus par la Communauté avec la république de Pologne, la république de Hongrie,
    la République tchèque et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 292/94 der Kommission vom 9. Februar 1994 zur Berichtigung
    der Verordnung (EG) Nr. 152/94 über die Festsetzung des Umfangs, in dem die im
    Januar 1994 gestellten Anträge auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse
    entsprechend der Regelung der Interimsabkommen zwischen der Gemeinschaft und Polen,
    Ungarn, der Tschechischen Republik und der Slowakischen Republik genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 292/94 af 9. februar 1994 om berigtigelse
    af forordning (EF) nr. 152/94 om fastsættelse af, i hvilket omfang der kan accepteres
    ansøgninger, der blev indgivet i januar 1994 om importlicenser for visse svinekødsprodukter
    i forbindelse med den ordning, der er fastsat i de interimsaftaler, som Fællesskabet
    har indgået med Republikken Polen, Republikken Ungarn og Den Tjekkiske Republik
    og Den Slovakiske Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 292/94 της Επιτροπής
    της 9ης Φεβρουαρίου 1994 για διόρθωση του κανονισμού
    (ΕΚ) αριθ. 152/94 περί καθορισμού ορίων εντός των
    οποίων δύναται να γίνει αποδεκτή η αίτηση που
    υποβλήθηκε τον Ιανουάριο του 1994 για άδειες
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις ενδιάμεσες συμφωνίες,
    τις οποίες συνήψε η Κοινότητα με τη Δημοκρατία
