title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2294/83 of 10 August 1983 re-establishing
    the levying of customs duties on bags, sachets and similar articles, of polyethylene,
    falling within subheading 39.07 B V ex d) and originating in Singapore, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3377/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2294/83 de la Commission du 10 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux sacs, sachets et articles
    similaires, en polyéthylène, de la sous-position 39.07 B V ex d) du tarif douanier
    commun, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2294/83 der Kommission vom 10. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Säcke, Beutel und ähnliche Waren, aus Polyäthylen,
    der Tarifstelle 39.07 B V ex d), mit Ursprung in Singapur, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2294/83 af 10. august 1983 om genindførelse
    af opkrævning af told for sække og poser, o.lign., af polyethylen, henhørende
    under pos. 39.07 B V ex d) og med oprindelse i Singapore, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2294/83 της Επιτροπής
    της 10ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τους σάκκους, σακκίδια
    και παρόμοια είδη, εκ πολυαιθυλενίου, της διακρίσεως
    39.07 Β V ex δ) του Κοινού Δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2294/83 della Commissione del 10 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai sacchi, sacchetti ed altri simili
    contenitori di polietilene, della sottovoce 39.07 B V ex d) della tariffa doganale
    comune, originari di Singapore beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2294/83 van de Commissie van 10 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op zakken, zakjes,
    en dergelijke, van polyethyleen, van postonderverdeling 39.07 B V ex d), van oorsprong
    uit Singapore, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
