title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1081/2000 of 22 May 2000 prohibiting the sale,
    supply and export to Burma/Myanmar of equipment which might be used for internal
    repression or terrorism, and freezing the funds of certain persons related to
    important governmental functions in that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1081/2000 du Conseil du 22 mai 2000 concernant l'interdiction
    de la vente, de la fourniture et de l'exportation à la Birmanie/au Myanmar de
    matériel susceptible d'être utilisé à des fins de répression interne ou de
    terrorisme, et le gel des fonds appartenant à certaines personnes ayant un lien
    avec d'importantes fonctions gouvernementales dans ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1081/2000 des Rates vom 22. Mai 2000 über das Verbot
    des Verkaufs, der Lieferung und der Ausfuhr nach Birma/Myanmar von Ausrüstungen,
    die zur internen Repression oder für terroristische Zwecke benutzt werden können,
    und über das Einfrieren der Gelder bestimmter, mit wichtigen Regierungsfunktionen
    verbundener Personen in diesem Land
  type: main
- language: cs
  script: Latn
  content: NAŘÍZENÍ RADY (ES) č. 1081/2000 ze dne 22. května 2000, kterým se
    zakazuje prodej, dodávky a vývoz výzbroje do Barmy/Myanmaru, která by mohla
    být použita k vnitřní represi nebo terorismu, a kterým se zmrazují prostředky
    určitých osob, které jsou spojeny s významnými vládními funkcemi v této
    zemi
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1081/2000 af 22. maj 2000 om forbud mod salg,
    levering og eksport til Burma/Myanmar af udstyr, der kan anvendes til intern undertrykkelse
    eller terrorisme, og om indefrysning af midler tilhørende visse personer, der
    har tilknytning til vigtige regeringsfunktioner i nævnte land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1081/2000 του Συμβουλίου,
    της 22ας Μαΐου 2000, σχετικά με την απαγόρευση
    πώλησης, προμήθειας και εξαγωγής στη Βιρμανία/Μιανμάρ
    εξοπλισμού δυνάμενου να χρησιμοποιηθεί για
    εσωτερική καταστολή ή τρομοκρατία, και τη δέσμευση
    των κεφαλαίων ορισμένων υψηλών δημοσίων αξιωματούχων
    στην εν λόγω χώρα
  type: main
- language: et
  script: Latn
  content: NÕUKOGU MÄÄRUS (EÜ) nr 1081/2000, 22. mai 2000, millega keelatakse
    selliste vahendite müük, tarnimine ja eksport Birmasse/Myanmari, mida võidakse
    kasutada siserepressioonideks või terroriaktide korraldamiseks, ning külmutatakse
    teatavate kõnealuse riigi valitsustegevusega seotud isikute rahalised vahendid
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1081/2000, annettu 22 päivänä toukokuuta 2000,
    kansallisiin tukahduttamistoimiin tai terrorismiin mahdollisesti käytettävien
    tarvikkeiden Burmaan/Myanmariin tapahtuvan myynnin, toimittamisen ja viennin kieltämisestä
    sekä tiettyjen tärkeissä valtiollisissa tehtävissä kyseisessä maassa toimivien
    henkilöiden varojen jäädyttämisestä
  type: main
- language: hu
  script: Latn
  content: A TANÁCS 1081/2000/EK RENDELETE (2000. május 22.) a belső elnyomásra
    vagy terrorizmusra felhasználható felszerelések Burmába/Mianmarba való értékesítésének,
    szállításának és kivitelének tilalmáról, valamint az ebben az országban
    jelentős kormányzati tisztséget betöltő egyes személyek pénzkészleteinek
    befagyasztásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1081/2000 del Consiglio, del 22 maggio 2000, che vieta
    la vendita, la fornitura e l'esportazione in Birmania/Myanmar di attrezzature
    che possono essere utilizzate per la repressione interna o a fini terroristici
    e congela i capitali di determinate persone che ricoprono importanti cariche pubbliche
    sul suo territorio
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1081/2000 (2000. gada 22. maijs), ar kuru aizliedz
    pārdot, piegādāt Birmai/Mjanmai un eksportēt uz turieni iekārtas, ko varētu
    izmantot iekšējai apspiešanai vai terorismam, un iesaldē līdzekļus dažām
    tādām personām, kas saistītas ar svarīgām valsts funkcijām minētajā valstī
  type: main
- language: lt
  script: Latn
  content: TARYBOS REGLAMENTAS (EB) Nr. 1081/2000 2000 m. gegužės 22 d. dėl įrangos,
    kuri gali būti panaudota vidinėms represijoms ar teroristiniais tikslais, pardavimo,
    tiekimo ir eksporto į Birmą (Mianmarą) uždraudimo ir asmenų, kurie šioje
    šalyje yra susiję su svarbiomis Vyriausybinėmis funkcijomis, lėšų įšaldymo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1081/2000 van de Raad van 22 mei 2000 betreffende
    een verbod op de verkoop en de levering aan en de uitvoer naar Birma/Myanmar van
    uitrusting die voor binnenlandse repressie of terrorisme kan worden gebruikt,
    en betreffende het bevriezen van de middelen van bepaalde personen die in dat
    land belangrijke regeringsposten bekleden
  type: main
- language: pl
  script: Latn
  content: ROZPORZĄDZENIE RADY (WE) NR 1081/2000 z dnia 22 maja 2000 r. zakazujące
    sprzedaży, dostaw i wywozu do Birmy/Myanmaru sprzętu, który mógłby zostać
    użyty w celu stosowania wewnętrznych represji lub terroryzmu oraz zamrażające
    środki niektórych osób pełniących ważne funkcje rządowe w tym kraju
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1081/2000 do Conselho, de 22 de Maio de 2000, que
    proíbe a venda, o fornecimento e a exportação para a Birmânia/Myanmar de equipamento
    susceptível de ser utilizado para actividades de repressão interna ou de terrorismo
    e que congela os fundos de determinadas pessoas ligadas a importantes cargos públicos
    nesse país
  type: main
- language: sk
  script: Latn
  content: NARIADENIE RADY (ES) č. 1081/2000 z 22. mája 2000 o zákaze predaja,
    dodávania a vývozu zariadení, ktoré môžu byť použité na vnútornú represiu
    alebo terorizmus, do Barmy/Mjanmarska a o zmrazení finančných prostriedkov
    určitých osôb v súvislosti s dôležitými vládnymi funkciami v tejto krajine
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1081/2000 z dne 22. maja 2000 o prepovedi prodaje,
    dobave in izvoza opreme v Burmo/Mijanmar, ki se lahko uporablja za notranje zatiranje
    terorizma, in o zamrznitvi sredstev nekaterih oseb, povezanih s pomembnimi državnimi
    funkcijami v tej državi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1081/2000 del Consejo, de 22 de mayo de 2000, por el
    que se prohíbe la venta, suministro y exportación a Birmania/Myanmar de equipos
    que pudieran utilizarse para la represión interior o en acciones de terrorismo,
    y por el que se congelan los capitales de determinadas personas relacionadas con
    importantes funciones gubernamentales en dicho país
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1081/2000 av den 22 maj 2000 om förbud mot
    försäljning, leverans och export till Burma/Myanmar av utrustning som kan användas
    i det inre förtrycket eller för terrorhandlingar och om frysande av tillgångar
    som innehas av vissa personer med anknytning till viktiga offentliga tjänster
    i Burma/Myanmar
