    kot uradno prostih tuberkuloze in uradno prostih bruceloze ter Priloge II k Odločbi
    93/52/EGS glede priznanja nekaterih regij Španije kot uradno prostih bruceloze
    (B. melitensis) (notificirano pod dokumentarno številko C(2019) 39)
  type: main
