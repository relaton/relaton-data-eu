title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/65 of 14 January 2019 amending
    Annexes I and II to Decision 2003/467/EC in relation to the officially tuberculosis-free
    and the officially brucellosis-free status and Annex II to Decision 93/52/EEC
    in relation to the officially brucellosis (B. melitensis)-free status of certain
    regions of Spain (notified under document C(2019) 39)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/65 de la Commission du 14 janvier 2019
    modifiant les annexes I et II de la décision 2003/467/CE en ce qui concerne les
    statuts «officiellement indemne de tuberculose» et «officiellement indemne
    de brucellose» de certaines régions d'Espagne, et l'annexe II de la décision
    93/52/CEE en ce qui concerne le statut «officiellement indemne de brucellose
    (B. melitensis)» desdites régions [notifiée sous le numéro C(2019) 39]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/65 der Kommission vom 14. Januar 2019
    zur Änderung der Anhänge I und II der Entscheidung 2003/467/EG in Bezug auf
    den amtlich tuberkulosefreien und den amtlich brucellosefreien Status sowie des
    Anhangs II der Entscheidung 93/52/EWG in Bezug auf den Status als amtlich frei
    von Brucellose (B. melitensis) bestimmter Gebiete Spaniens (Bekannt gegeben unter
    Aktenzeichen C(2019) 39)
  type: main
