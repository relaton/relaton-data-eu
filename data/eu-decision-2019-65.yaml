    ta' uffiċjalment ħielsa mit-tuberkulożi u uffiċjalment ħielsa mill-bruċellożi
    u l-Anness II tad-Deċiżjoni 93/52/KEE b'rabta mal-istatus ta' uffiċjalment
    ħielsa mill-bruċellożi (B. melitensis) ta' ċerti reġjuni ta' Spanja (notifikata
    bid-dokument C(2019) 39)
  type: main
