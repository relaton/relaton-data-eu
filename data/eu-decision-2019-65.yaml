    wijziging van de bijlagen I en II bij Beschikking 2003/467/EG met betrekking tot
    de erkenning van bepaalde delen van Spanje als officieel vrij van tuberculose
    en officieel vrij van brucellose en van bijlage II bij Beschikking 93/52/EEG met
    betrekking tot de erkenning van bepaalde delen van Spanje als officieel vrij van
    brucellose (B. melitensis) (Kennisgeving geschied onder nummer C(2019) 39)
  type: main
