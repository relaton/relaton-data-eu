    hivatalosan tuberkulózismentes és hivatalosan brucellózismentes státusza,
    valamint a 93/52/EGK határozat II. mellékletének Spanyolország egyes régióinak
    hivatalosan brucellózismentes (B. melitensis) státusza tekintetében történő
    módosításáról (az értesítés a C(2019) 39. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/65 della Commissione, del 14 gennaio
    2019, che modifica gli allegati I e II della decisione 2003/467/CE per quanto
    riguarda la qualifica di ufficialmente indenni da tubercolosi e ufficialmente
    indenni da brucellosi e l'allegato II della decisione 93/52/CEE per quanto riguarda
    la qualifica di ufficialmente indenni da brucellosi (B. melitensis) di alcune
    regioni della Spagna [notificata con il numero C(2019) 39]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/65 (2019. gada 14. janvāris),
    ar ko Lēmuma 2003/467/EK I un II pielikumu groza attiecībā uz no tuberkulozes
    oficiāli brīvu un no brucelozes oficiāli brīvu statusu un Lēmuma 93/52/EEK
    II pielikumu groza attiecībā uz no brucelozes (B. melitensis) oficiāli brīvu
    statusu dažiem Spānijas reģioniem (izziņots ar dokumenta numuru C(2019) 39)
  type: main
- language: lt
  script: Latn
  content: 2019 m. sausio 14 d. Komisijos įgyvendinimo sprendimas (ES) 2019/65, kuriuo
    dėl pripažinimo, kad tam tikruose Ispanijos regionuose oficialiai nenustatyta
    tuberkuliozės ir bruceliozės, iš dalies keičiami Sprendimo 2003/467/EB I ir
    II priedai, ir dėl pripažinimo, kad tam tikruose Ispanijos regionuose oficialiai
    nenustatyta bruceliozės (B. melitensis), iš dalies keičiamas Sprendimo 93/52/EEB
    II priedas (pranešta dokumentu Nr. C(2019) 39)
  type: main
