  script: Latn
  content: Decisión de Ejecución (UE) 2019/65 de la Comisión, de 14 de enero de
    2019, por la que se modifican los anexos I y II de la Decisión 2003/467/CE en
    lo que respecta al estatuto de oficialmente indemnes de tuberculosis y oficialmente
    indemnes de brucelosis y el anexo II de la Decisión 93/52/CEE en lo que respecta
    al estatuto de oficialmente indemnes de brucelosis (Brucella melitensis) de determinadas
    regiones de España [notificada con el número C(2019) 39]
  type: main
- language: sv
  script: Latn
