    de oficialmente indemnes de tuberculose e oficialmente indemnes de brucelose e
    o anexo II da Decisão 93/52/CEE no que diz respeito ao estatuto de oficialmente
    indemnes de brucelose (B. melitensis) de certas regiões de Espanha [notificada
    com o número C(2019) 39]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/65 a Comisiei din 14 ianuarie
    2019 de modificare a anexelor I și II la Decizia 2003/467/CE în ceea ce privește
    statutul oficial de indemne de tuberculoză și statutul oficial de indemne de
    bruceloză și a anexei II la Decizia 93/52/CEE în ceea ce privește statutul
    oficial de indemne de bruceloză (B. melitensis) al unor regiuni din Spania [notificată
    cu numărul C(2019) 39]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/65 zo 14. januára 2019, ktorým
    sa menia prílohy I a II k rozhodnutiu 2003/467/ES, pokiaľ ide o úradné uznanie
    oblastí bez výskytu tuberkulózy a úradné uznanie oblastí bez výskytu brucelózy,
    a príloha II k rozhodnutiu 93/52/EHS, pokiaľ ide o úradné uznanie oblastí
    bez výskytu brucelózy (B. melitensis) v určitých regiónoch Španielska [oznámené
    pod číslom C(2019) 39]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/65 z dne 14. januarja 2019 o spremembi
