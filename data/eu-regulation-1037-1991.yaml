- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1037/91 of 25 April 1991 re-establishing
    the levying of customs duties on the products falling within CN code 3102 80 00,
    originating in Bulgaria, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1037/91 DE LA COMMISSION du 25 avril 1991 portant
