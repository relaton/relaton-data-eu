title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 416/85 of 19 February 1985 abolishing the
    countervailing charge on mandarins (including tangerines and satsumas), wilkings
    and other similar citrus hydrids, excluding clementines originating in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 416/85 de la Commission, du 19 février 1985, supprimant
    la taxe compensatoire à l'importation de mandarines, y compris tangerines et
    satsumas, wilkings et autres hybrides similaires d'agrumes, à l'exclusion des
    clémentines, originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 416/85 der Kommission vom 19. Februar 1985 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten,
    ausgenommen Clementinen, mit Ursprung in Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 416/85 af 19. februar 1985 om ophævelse
    af udligningsafgiften ved indførsel af mandariner (herunder tangeriner og satsumas),
    Wilkings og andre lignende krydsninger af citrusfrugter, undtagen clementiner,
    med oprindelse i Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 416/85 της Επιτροπής
    της 19ης Φεβρουαρίου 1985 περί καταργήσεως της
    εξισωτικής εισφοράς κατά την εισαγωγή μανταρινιών,
    συμπεριλαμβανομένων των tangerines και satsumas, wilkings
    και άλλων παρομοίων υβριδίων εσπεριδοειδών
    εξαιρουμένων των κλημεντινών, καταγωγής Ισπανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 416/85 della Commissione, del 19 febbraio 1985, che
    sopprime la tassa di compensazione all'importazione di mandarini, compresi i tangerini
    e i mandarini satsuma (o sazuma), wilkings, e altri simili ibridi di agrumi, ad
    esclusione delle clementine, originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 416/85 van de Commissie van 19 februari 1985 houdende
