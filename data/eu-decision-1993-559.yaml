    do artigo 17o da Sexta Directiva 77/388/CEE, relativa à harmonização das legislações
    dos Estados-membros respeitantes aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '93/559/CEE: DECISIÓN DEL CONSEJO de 25 de octubre de 1993 por la que
