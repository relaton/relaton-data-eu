title:
- language: en
  script: Latn
  content: '93/559/EEC: Council Decision of 25 October 1993 authorizing the Italian
    Republic to apply a measure derogating from Article 2 (1) and Article 17 of the
    Sixth Directive 77/388/EEC on the harmonization of the laws of the Member States
    relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '93/559/CEE: Décision du Conseil du 25 octobre 1993 autorisant la République
    italienne à appliquer une mesure dérogatoire à l''article 2 point 1 et à l''article
    17 de la sixième directive 77/388/CEE en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '93/559/EWG: ENTSCHEIDUNG DES RATES vom 25. Oktober 1993 zur Ermächtigung
    der Italienischen Republik zur Einführung einer von Artikel 2 Nummer 1 und Artikel
    17 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichenden Sondermaßnahme'
  type: main
- language: da
  script: Latn
  content: '93/559/EØF: RÅDETS BESLUTNING af 25. oktober 1993 om bemyndigelse af
    Den Italienske Republik til at anvende en foranstaltning, der fraviger artikel
    2, stk. 1, og artikel 17 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '93/559/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 25ης
    Οκτωβρίου 1993 με την οποία εξουσιοδοτείται
    η Ιταλική Δημοκρατία να εφαρμόσει μέτρο παρέκκλισης
    από το άρθρο 2, σημείο 1 και το άρθρο 17 της έκτης
    οδηγίας 77/388/ΕΟΚ σε θέματα εναρμόνισης των νομοθεσιών
    των κρατών μελών των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '93/559/CEE: DECISIONE DEL CONSIGLIO del 25 ottobre 1993 che autorizza
    la Repubblica Italiana ad applicare una misura di deroga all'' articolo 2, paragrafo
    1 e all'' articolo 17 della sesta direttiva 77/388/CEE in materia di armonizzazione
    delle legislazioni degli Stati membri relative alle imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '93/559/EEG: BESCHIKKING VAN DE RAAD van 25 oktober 1993 waarbij de Italiaanse
    Republiek wordt gemachtigd een maatregel toe te passen die afwijkt van artikel
    2, punt 1, en artikel 17 van Zesde Richtlijn 77/388/EEG betreffende de harmonisatie
    van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '93/559/CEE: DECISÃO DO CONSELHO de 25 de Outubro de 1993 que autoriza
