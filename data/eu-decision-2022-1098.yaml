---
id: EUDecision20221098
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1098 of 30 June 2022 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by Kosovo (This designation is without
    prejudice to positions on status, and is in line with UNSCR 1244/1999 and the
    ICJ Opinion on the Kosovo declaration of independence.)to the certificates issued
    in accordance with Regulation (EU) 2021/953 of the European Parliament and of
    the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1098 de la Commission du 30 juin 2022
    établissant l’équivalence, aux fins de faciliter l’exercice du droit à
    la libre circulation au sein de l’Union, des certificats COVID-19 délivrés
    par le Kosovo (Cette désignation est sans préjudice des positions sur le statut
    et est conforme à la résolution 1244 (1999) du Conseil de sécurité des Nations
    unies ainsi qu'à l'avis de la CIJ sur la déclaration d'indépendance du Kosovo.)
    avec les certificats délivrés conformément au règlement (UE) 2021/953 du Parlement
    européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1098 der Kommission vom 30. Juni 2022
    zur Feststellung der Gleichwertigkeit der vom Kosovo (Diese Bezeichnung berührt
    nicht die Standpunkte zum Status und steht im Einklang mit der Resolution 1244/1999
    des VN-Sicherheitsrates und dem Gutachten des Internationalen Gerichtshofs zur
    Unabhängigkeitserklärung des Kosovos.) ausgestellten COVID-19-Zertifikate mit
    den nach der Verordnung (EU) 2021/953 des Europäischen Parlaments und des Rates
    ausgestellten Zertifikaten zwecks Erleichterung der Ausübung des Rechts auf Freizügigkeit
    innerhalb der Union
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/1098 на Комисията
    от 30 юни 2022 година за установяване на равностойност
    на сертификатите за COVID-19, издадени от Косово
    (Това название не засяга позициите по отношение
    на статута и е съобразено с Резолюция 1244/1999
    на Съвета за сигурност на ООН и становището
    на Международния съд относно обявяването на
    независимост от страна на Косово.), със сертификатите,
    издадени в съответствие с Регламент (ЕС) 2021/953
    на Европейския парламент и на Съвета, с цел
    улесняване на упражняването на правото на
    свободно движение в рамките на Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1098 ze dne 30. června 2022,
    kterým se za účelem usnadnění práva na volný pohyb v rámci Unie stanoví
    rovnocennost certifikátů týkajících se onemocnění COVID-19 vydaných Kosovem
    (Tímto označením nejsou dotčeny postoje k otázce statusu a označení je
    v souladu s rezolucí Rady bezpečnosti OSN 1244/1999 a se stanoviskem Mezinárodního
    soudního dvora k vyhlášení nezávislosti Kosova.) a certifikátů vydaných
    v souladu s nařízením Evropského parlamentu a Rady (EU) 2021/953
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1098 af 30. juni 2022
    om ækvivalens mellem de covid-19-certifikater, der udstedes af Kosovo (Denne
    betegnelse indebærer ingen stillingtagen til Kosovos status, og den er i overensstemmelse
    med UNSCR 1244/1999 og ICJ's udtalelse om Kosovos uafhængighedserklæring.),
    og de certifikater, der udstedes i overensstemmelse med Europa-Parlamentets og
    Rådets forordning (EU) 2021/953, med henblik på at lette udøvelsen af retten
    til fri bevægelighed inden for Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1098 της Επιτροπής
    της 30ής Ιουνίου 2022 για τη θέσπιση της ισοδυναμίας,
    με σκοπό τη διευκόλυνση του δικαιώματος ελεύθερης
    κυκλοφορίας εντός της Ένωσης, των πιστοποιητικών
    COVID-19 που εκδίδονται από το Κόσοβο (Η ονομασία
    αυτή χρησιμοποιείται με την επιφύλαξη των
    θέσεων ως προς το καθεστώς και συνάδει με την
    απόφαση 1244/1999 του Συμβουλίου Ασφαλείας των
    Ηνωμένων Εθνών και τη γνωμοδότηση του Διεθνούς
    Δικαστηρίου σχετικά με τη διακήρυξη της ανεξαρτησίας
    του Κοσόβου.) με τα πιστοποιητικά που εκδίδονται
    σύμφωνα με τον κανονισμό (ΕΕ) 2021/953 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1098, 30. juuni 2022, millega määratakse
    liidus vaba liikumise õiguse kasutamise hõlbustamiseks kindlaks Kosovo (Kõnealune
    nimetus ei piira seisukohti staatuse suhtes ning on kooskõlas ÜRO Julgeolekunõukogu
    resolutsiooniga 1244/1999 ja Rahvusvahelise Kohtu arvamusega Kosovo iseseisvusdeklaratsiooni
    kohta.) välja antud COVID-19 tõendite samaväärsus Euroopa Parlamendi ja nõukogu
    määruse (EL) 2021/953 kohaselt välja antud tõenditega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1098, annettu 30 päivänä
    kesäkuuta 2022, Kosovon (Tämä nimitys ei vaikuta asemaa koskeviin kantoihin,
    ja se on YK:n turvallisuusneuvoston päätöslauselman 1244/1999 ja Kansainvälisen
    tuomioistuimen Kosovon itsenäisyysjulistuksesta antaman lausunnon mukainen.)
    antamien koronatodistusten ja Euroopan parlamentin ja neuvoston asetuksen (EU)
    2021/953 mukaisesti annettujen todistusten vastaavuuden vahvistamisesta vapaata
    liikkuvuutta koskevan oikeuden käyttämisen helpottamiseksi unionissa
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1098 ón gCoimisiún an 30 Meitheamh
    2022 lena leagtar síos gur coibhéiseach iad deimhnithe COVID-19 arna n-eisiúint
    ag an gCosaiv (Tá an t-ainmniú seo gan dochar do sheasaimh maidir le stádas,
    agus tá sé ag teacht le UNSCR 1244/1999 agus le Tuairim CBI maidir le dearbhú
    neamhspleáchais na Cosaive.) leis na deimhnithe arna n-eisiúint i gcomhréir
    le Rialachán (AE) 2021/953 ó Pharlaimint na hEorpa agus ón gComhairle, chun
    an ceart chun saorghluaiseachta a éascú laistigh den Aontas
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1098 оd 30. lipnja 2022. o utvrđivanju
    jednakovrijednosti, u svrhu olakšavanja ostvarivanja prava na slobodno kretanje
    unutar Unije, COVID-19 potvrda koje izdaje Kosovo (Ovim se nazivom ne dovode u
    pitanje stajališta o statusu te je on u skladu s RVSUN-om 1244/1999 i mišljenjem
    Međunarodnog suda o proglašenju neovisnosti Kosova.) s potvrdama izdanima u
    skladu s Uredbom (EU) 2021/953 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1098 végrehajtási határozata (2022. június 30.)
    a Koszovó (Ez a megnevezés nem érinti a jogállással kapcsolatos álláspontokat,
    továbbá összhangban van az 1244 (1999) sz. ENSZ BT-határozattal és a Nemzetközi
    Bíróságnak a koszovói függetlenségi nyilatkozatról szóló véleményével.)
    által kiállított Covid19-igazolványoknak az (EU) 2021/953 európai parlamenti
    és tanácsi rendelettel összhangban kiállított igazolványokkal való egyenértékűségének
    az Unión belüli szabad mozgáshoz való jog előmozdítása céljából történő
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1098 della Commissione del 30 giugno
    2022 che stabilisce l’equivalenza, al fine di agevolare il diritto di libera
    circolazione nell’ambito dell’Unione, dei certificati COVID-19 rilasciati
    dal Kosovo (Tale designazione non pregiudica le posizioni riguardo allo status
    ed è in linea con la risoluzione 1244 (1999) dell’UNSC e con il parere della
    CIG sulla dichiarazione di indipendenza del Kosovo.) ai certificati rilasciati
    in conformità del regolamento (UE) 2021/953 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1098 (2022. gada 30. jūnijs),
    ar ko nolūkā atvieglot tiesības brīvi pārvietoties Savienībā nosaka Kosovas
    (Šis nosaukums neskar nostājas par statusu un atbilst ANO DP Rezolūcijai 1244
    (1999) un Starptautiskās Tiesas atzinumam par Kosovas neatkarības deklarāciju.)
    izdoto Covid-19 sertifikātu līdzvērtīgumu sertifikātiem, kuri izdoti saskaņā
    ar Eiropas Parlamenta un Padomes Regulu (ES) 2021/953
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1098 2022 m. birželio 30
    d. kuriuo, siekiant sudaryti palankesnes sąlygas naudotis laisvo judėjimo teise
    Sąjungoje, nustatomas Kosovo (Šis pavadinimas nekeičia pozicijų dėl statuso
    ir atitinka JT ST rezoliuciją 1244 /1999 bei Tarptautinio Teisingumo Teismo nuomonę
    dėl Kosovo nepriklausomybės deklaracijos.) išduotų COVID-19 pažymėjimų
    lygiavertiškumas pagal Europos Parlamento ir Tarybos reglamentą (ES) 2021/953
    išduotiems pažymėjimams
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1098 tat-30
    ta’ Ġunju 2022 li tistabbilixxi l-ekwivalenza, għall-fini tal-faċilitazzjoni
    tad-dritt tal-moviment liberu fl-Unjoni, taċ-ċertifikati COVID-19 maħruġa
    mill-Kosovo (Dan l-isem huwa mingħajr preġudizzju għall-pożizzjonijiet dwar
    l-istatus, u huwa konformi mal-UNSCR 1244/1999 u l-Opinjoni tal-QIĠ dwar id-dikjarazzjoni
    tal-indipendenza tal-Kosovo.) maċ-ċertifikati maħruġa f’konformità mar-Regolament
    (UE) 2021/953 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1098 van de Commissie van 30 juni 2022 houdende
    vaststelling van de gelijkwaardigheid, teneinde het recht van vrij verkeer binnen
    de Unie te faciliteren, van door Kosovo (Deze benaming laat de standpunten over
    de status van Kosovo onverlet, en is in overeenstemming met Resolutie 1244 (1999)
    van de VN-Veiligheidsraad en het advies van het Internationaal Gerechtshof over
    de onafhankelijkheidsverklaring van Kosovo.) afgegeven COVID-19-certificaten met
    de overeenkomstig Verordening (EU) 2021/953 van het Europees Parlement en de Raad
    afgegeven certificaten
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1098 z dnia 30 czerwca 2022 r. ustanawiająca
    równoważność, w celu ułatwienia korzystania z prawa do swobodnego przemieszczania
    się w Unii, zaświadczeń COVID-19 wydawanych przez Kosowo (Użycie tej nazwy
    nie wpływa na stanowiska w sprawie statusu Kosowa i jest zgodne z rezolucją
    Rady Bezpieczeństwa ONZ 1244/1999 oraz z opinią Międzynarodowego Trybunału
    Sprawiedliwości w sprawie deklaracji niepodległości Kosowa.) z zaświadczeniami
    wydawanymi zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2021/953
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1098 da Comissão de 30 de junho de 2022
    que estabelece a equivalência, a fim de facilitar o exercício do direito de
    livre circulação na União, dos certificados COVID-19 emitidos pelo Kosovo (Esta
    designação não prejudica as posições relativas ao estatuto e é conforme
    com a Resolução 1244/1999 do CSNU e com o parecer do TIJ sobre a declaração
    de independência do Kosovo.) aos certificados emitidos em conformidade com o
    Regulamento (UE) 2021/953 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1098 a Comisiei din 30 iunie 2022
    de stabilire, cu scopul de a facilita exercitarea dreptului la liberă circulație
    pe teritoriul Uniunii, a echivalenței certificatelor privind COVID-19 eliberate
    de Kosovo (Această denumire nu aduce atingere pozițiilor privind statutul și
    este conformă cu RCSONU 1244/1999, precum și cu Avizul CIJ privind Declarația
    de independență a Kosovoului.) cu certificatele eliberate în conformitate cu
    Regulamentul (UE) 2021/953 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1098 z 30. júna 2022, ktorým
    sa na účely uľahčenia práva na voľný pohyb v rámci Únie stanovuje rovnocennosť
    potvrdení súvisiacich s ochorením COVID-19 vydávaných Kosovom (Týmto označením
    nie sú dotknuté pozície k štatútu a označenie je v súlade s rezolúciou
    BR OSN č. 1244/1999 a so stanoviskom Medzinárodného súdneho dvora k vyhláseniu
    nezávislosti Kosova.) s potvrdeniami vydávanými v súlade s nariadením Európskeho
    parlamentu a Rady (EÚ) 2021/953
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1098 z dne 30. junija 2022 o določitvi
    enakovrednosti COVID-19 potrdil, ki jih izdaja Kosovo (To poimenovanje ne posega
    v stališča glede statusa ter je v skladu z RVSZN 1244/1999 in mnenjem Meddržavnega
    sodišča o razglasitvi neodvisnosti Kosova.), in potrdil, izdanih v skladu z
    Uredbo (EU) 2021/953 Evropskega parlamenta in Sveta, da se olajša uveljavljanje
    pravice do prostega gibanja v Uniji
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1098 de la Comisión de 30 de junio de
    2022 por la que se establece la equivalencia, a fin de facilitar el derecho a
    la libre circulación dentro de la Unión, entre los certificados COVID-19 expedidos
    por Kosovo (Esta denominación se entiende sin perjuicio de las posiciones sobre
    su estatuto y está en consonancia con la Resolución 1244 (1999) del Consejo
    de Seguridad de las Naciones Unidas y con la Opinión de la Corte Internacional
    de Justicia sobre la declaración de independencia de Kosovo.) y los expedidos
    de conformidad con el Reglamento (UE) 2021/953 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1098 av den 30 juni 2022 om
    fastställande, i syfte att underlätta den fria rörligheten inom unionen, av
    att covid-19-intyg som utfärdas av Kosovo (Denna beteckning påverkar inte ståndpunkter
    om Kosovos status och är i överensstämmelse med FN:s säkerhetsråds resolution
    1244/1999 och med Internationella domstolens utlåtande om Kosovos självständighetsförklaring.)
    är likvärdiga med de intyg som utfärdas i enlighet med Europaparlamentets och
    rådets förordning (EU) 2021/953
  type: main
