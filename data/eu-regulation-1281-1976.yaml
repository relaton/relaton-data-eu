title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1281/76 of 1 June 1976 amending for the second
    time Regulation (EEC) No 567/76 laying down general rules governing the distillation
    of table wines for which the distillation contract must be approved before 15
    April 1976
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1281/76 du Conseil, du 1er juin 1976, modifiant pour
    la deuxième fois le règlement (CEE) n° 567/76 établissant les règles générales
    relatives à des opérations de distillation des vins de table dont le contrat
    de distillation doit être agréé avant le 15 avril 1976
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1281/76 des Rates vom 1. Juni 1976 zur zweiten Änderung
    der Verordnung (EWG) Nr. 567/76 über allgemeine Regeln für die Destillation
    von Tafelwein, für den der Destillationsvertrag vor dem 15. April 1976 genehmigt
    werden muß
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1281/76 af 1. juni 1976 om anden ændring
    af forordning (EØF) nr. 567/76 om de almindelige regler for destillering af bordvin
    for hvilken destilleringskontrakten skal godkendes inden den 15. april 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1281/76 del Consiglio, del 1° giugno 1976, recante
    seconda modifica del regolamento (CEE) n. 567/76 che stabilisce le norme generali
    relative ad operazioni di distillazione dei vini da pasto il cui contratto di
    distillazione deve essere approvato entro il 15 aprile 1976
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1281/76 van de Raad van 1 juni 1976 houdende tweede
    wijziging van Verordening (EEG) nr. 567/76 houdende vaststelling van de algemene
    regels betreffende de distillatie van tafelwijn waarvan het distillatiecontract
    vóór 15 april 1976 moet zijn goedgekeurd
  type: main
