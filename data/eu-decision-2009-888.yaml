    2002/741/ΕΚ, 2002/747/ΕΚ, 2003/200/ΕΚ, 2005/341/ΕΚ, 2005/342/ΕΚ, 2005/343/ΕΚ,
    2005/344/ΕΚ, 2005/360/ΕΚ, 2006/799/ΕΚ, 2007/64/ΕΚ, 2007/506/ΕΚ και
    2007/742/ΕΚ ώστε να παραταθεί η ισχύς των οικολογικών
    κριτηρίων απονομής του κοινοτικού οικολογικού
    σήματος σε ορισμένα προϊόντα [κοινοποιηθείσα
    υπό τον αριθμό Ε(2009) 9599]'
  type: main
- language: et
  script: Latn
  content: '2009/888/EÜ: Komisjoni otsus, 30. november 2009 , millega muudetakse
    otsuseid 2002/741/EÜ, 2002/747/EÜ, 2003/200/EÜ, 2005/341/EÜ, 2005/342/EÜ,
    2005/343/EÜ, 2005/344/EÜ, 2005/360/EÜ, 2006/799/EÜ, 2007/64/EÜ, 2007/506/EÜ
    ja 2007/742/EÜ, et pikendada teatavatele toodetele ühenduse ökomärgise andmise
    ökoloogiliste kriteeriumide kehtivust (teatavaks tehtud numbri K(2009) 9599 all)'
  type: main
- language: fi
  script: Latn
  content: '2009/888/EY: Komission päätös, annettu 30 päivänä marraskuuta 2009
    , päätösten 2002/741/EY, 2002/747/EY, 2003/200/EY, 2005/341/EY, 2005/342/EY,
    2005/343/EY, 2005/344/EY, 2005/360/EY, 2006/799/EY, 2007/64/EY, 2007/506/EY ja
    2007/742/EY muuttamisesta yhteisön ympäristömerkin myöntämistä eräille
    tuotteille koskevien ekologisten arviointiperusteiden voimassaolon pidentämiseksi
    (tiedoksiannettu numerolla K(2009) 9599)'
  type: main
- language: hu
  script: Latn
  content: '2009/888/EK: A Bizottság határozata ( 2009. november 30.) a 2002/741/EK,
    2002/747/EK, 2003/200/EK, 2005/341/EK, 2005/342/EK, 2005/343/EK, 2005/344/EK,
    2005/360/EK, 2006/799/EK, 2007/64/EK, 2007/506/EK és 2007/742/EK határozatnak
    az egyes termékekre vonatkozó közösségi ökocímke odaítélésével kapcsolatos
    ökológiai kritériumok érvényességének meghosszabbítása céljából történő
    módosításáról (az értesítés a C(2009) 9599. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2009/888/CE: Decisione della Commissione, del 30 novembre 2009 , recante
    modifica delle decisioni 2002/741/CE, 2002/747/CE, 2003/200/CE, 2005/341/CE, 2005/342/CE,
    2005/343/CE, 2005/344/CE, 2005/360/CE, 2006/799/CE, 2007/64/CE, 2007/506/CE e
    2007/742/CE al fine di prorogare la validità dei criteri ecologici per l’assegnazione
    del marchio comunitario di qualità ecologica a taluni prodotti [notificata con
    il numero C(2009) 9599]'
  type: main
- language: lv
  script: Latn
  content: '2009/888/EK: Komisijas Lēmums ( 2009. gada 30. novembris), ar ko groza
    Lēmumus 2002/741/EK, 2002/747/EK, 2003/200/EK, 2005/341/EK, 2005/342/EK, 2005/343/EK,
    2005/344/EK, 2005/360/EK, 2006/799/EK, 2007/64/EK, 2007/506/EK un 2007/742/EK,
    lai pagarinātu ekoloģisko kritēriju spēkā esības termiņu Kopienas ekomarķējuma
    piešķiršanai dažiem ražojumiem (izziņots ar dokumenta numuru C(2009) 9599)'
  type: main
- language: lt
  script: Latn
  content: '2009/888/EB: 2009 m. lapkričio 30 d. Komisijos sprendimas, iš dalies
    keičiantis sprendimus 2002/741/EB, 2002/747/EB, 2003/200/EB, 2005/341/EB, 2005/342/EB,
    2005/343/EB, 2005/344/EB, 2005/360/EB, 2006/799/EB, 2007/64/EB, 2007/506/EB ir
    2007/742/EB, siekiant pratęsti ekologinių kriterijų, taikomų tam tikriems
    produktams suteikiant Bendrijos ekologinį ženklą, galiojimą (pranešta dokumentu
    Nr. C(2009) 9599)'
  type: main
- language: mt
  script: Latn
  content: '2009/888/KE: Deċiżjoni tal-Kummissjoni tat- 30 ta’ Novembru 2009 li
    temenda d-Deċiżjonijiet Nru 2002/741/KE, 2002/747/KE, 2003/200/KE, 2005/341/KE,
    2005/342/KE, 2005/343/KE, 2005/344/KE, 2005/360/KE, 2006/799/KE, 2007/64/KE, 2007/506/KE
    u 2007/742/KE sabiex ittawwal il-validità tal-kriterji ekoloġiċi għall-għoti
    tal-Ekotikketta Komunitarja lil ċerti prodotti (notifikata bid-dokument numru
    C(2009) 9599)'
  type: main
- language: nl
  script: Latn
  content: '2009/888/EG: Beschikking van de Commissie van 30 november 2009 tot wijziging
    van de Beschikkingen 2002/741/EG, 2002/747/EG, 2003/200/EG, 2005/341/EG, 2005/342/EG,
    2005/343/EG, 2005/344/EG, 2005/360/EG, 2006/799/EG, 2007/64/EG, 2007/506/EG en
    2007/742/EG teneinde de geldigheidsduur van de milieucriteria voor de toekenning
    van de communautaire milieukeur aan bepaalde producten te verlengen (Kennisgeving
    geschied onder nummer C(2009) 9599)'
  type: main
- language: pl
  script: Latn
  content: '2009/888/WE: Decyzja Komisji z dnia 30 listopada 2009 r. zmieniająca
    decyzje 2002/741/WE, 2002/747/WE, 2003/200/WE, 2005/341/WE, 2005/342/WE, 2005/343/WE,
    2005/344/WE, 2005/360/WE, 2006/799/WE, 2007/64/WE, 2007/506/WE i 2007/742/WE w
    celu przedłużenia okresu ważności kryteriów ekologicznych stosowanych przy
    przyznawaniu wspólnotowego oznakowania ekologicznego niektórym produktom (notyfikowana
    jako dokument nr C(2009) 9599)'
  type: main
- language: pt
  script: Latn
  content: '2009/888/CE: Decisão da Comissão, de 30 de Novembro de 2009 , que altera
    as Decisões 2002/741/CE, 2002/747/CE, 2003/200/CE, 2005/341/CE, 2005/342/CE,
    2005/343/CE, 2005/344/CE, 2005/360/CE, 2006/799/CE, 2007/64/CE, 2007/506/CE e
    2007/742/CE com o objectivo de prorrogar a validade dos critérios ecológicos
    para a atribuição do rótulo ecológico comunitário a certos produtos [notificada
    com o número C(2009) 9599]'
  type: main
- language: ro
  script: Latn
  content: '2009/888/CE: Decizia Comisiei din 30 noiembrie 2009 de modificare a Deciziilor
    2002/741/CE, 2002/747/CE, 2003/200/CE, 2005/341/CE, 2005/342/CE, 2005/343/CE,
    2005/344/CE, 2005/360/CE, 2006/799/CE, 2007/64/CE, 2007/506/CE și 2007/742/CE
    în vederea prelungirii perioadei de valabilitate a criteriilor ecologice de acordare
    a etichetei ecologice comunitare pentru anumite produse [notificată cu numărul
    C(2009) 9599]'
  type: main
- language: sk
  script: Latn
  content: '2009/888/ES: Rozhodnutie Komisie z 30. novembra 2009 , ktorým sa menia
    a dopĺňajú rozhodnutia 2002/741/ES, 2002/747/ES, 2003/200/ES, 2005/341/ES,
    2005/342/ES, 2005/343/ES, 2005/344/ES, 2005/360/ES, 2006/799/ES, 2007/64/ES, 2007/506/ES
    a 2007/742/ES s cieľom predĺžiť platnosť ekologických kritérií na udeľovanie
    environmentálnej značky Spoločenstva určitým výrobkom [oznámené pod číslom
    K(2009) 9599]'
  type: main
- language: sl
  script: Latn
  content: '2009/888/ES: Odločba Komisije z dne 30. novembra 2009 o spremembi odločb
    2002/741/ES, 2002/747/ES, 2003/200/ES, 2005/341/ES, 2005/342/ES, 2005/343/ES,
    2005/344/ES, 2005/360/ES, 2006/799/ES, 2007/64/ES, 2007/506/ES in 2007/742/ES
    zaradi podaljšanja veljavnosti okoljskih meril za podelitev znaka za okolje Skupnosti
    nekaterim izdelkom (notificirano pod dokumentarno številko C(2009) 9599)'
  type: main
- language: es
  script: Latn
  content: '2009/888/CE: Decisión de la Comisión, de 30 de noviembre de 2009 , por
    la que se modifican las Decisiones 2002/741/CE, 2002/747/CE, 2003/200/CE, 2005/341/CE,
    2005/342/CE, 2005/343/CE, 2005/344/CE, 2005/360/CE, 2006/799/CE, 2007/64/CE, 2007/506/CE
    y 2007/742/CE con objeto de prorrogar la vigencia de los criterios ecológicos
    para la concesión de la etiqueta ecológica comunitaria a determinados productos
    [notificada con el número C(2009) 9599]'
  type: main
- language: sv
  script: Latn
  content: '2009/888/EG: Kommissionens beslut av den 30 november 2009 om ändring
    av besluten 2002/741/EG, 2002/747/EG, 2003/200/EG, 2005/341/EG, 2005/342/EG, 2005/343/EG,
    2005/344/EG, 2005/360/EG, 2006/799/EG, 2007/64/EG, 2007/506/EG och 2007/742/EG
    i syfte att förlänga giltigheten för de ekologiska kriterierna för tilldelning
    av gemenskapens miljömärke till vissa produkter [delgivet med nr K(2009) 9599]'
