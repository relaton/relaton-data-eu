title:
- language: en
  script: Latn
  content: '2009/888/EC: Commission Decision of 30 November 2009 amending Decisions
    2002/741/EC, 2002/747/EC, 2003/200/EC, 2005/341/EC, 2005/342/EC, 2005/343/EC,
    2005/344/EC, 2005/360/EC, 2006/799/EC, 2007/64/EC, 2007/506/EC and 2007/742/EC
    in order to prolong the validity of the ecological criteria for the award of the
    Community Ecolabel to certain products (notified under document C(2009) 9599)'
  type: main
- language: fr
  script: Latn
  content: '2009/888/CE: Décision de la Commission du 30 novembre 2009 modifiant
    les décisions 2002/741/CE, 2002/747/CE, 2003/200/CE, 2005/341/CE, 2005/342/CE,
    2005/343/CE, 2005/344/CE, 2005/360/CE, 2006/799/CE, 2007/64/CE, 2007/506/CE et
    2007/742/CE afin de prolonger la période de validité des critères écologiques
    pour l’attribution du label écologique communautaire à certains produits [notifiée
    sous le numéro C(2009) 9599]'
  type: main
- language: de
  script: Latn
  content: '2009/888/EG: Entscheidung der Kommission vom 30. November 2009 zur Änderung
    der Entscheidungen 2002/741/EG, 2002/747/EG, 2003/200/EG, 2005/341/EG, 2005/342/EG,
    2005/343/EG, 2005/344/EG, 2005/360/EG, 2006/799/EG, 2007/64/EG, 2007/506/EG und
    2007/742/EG zwecks Verlängerung der Geltungsdauer der Umweltkriterien für die
    Vergabe des EG-Umweltzeichens für bestimmte Produkte (Bekannt gegeben unter Aktenzeichen
    K(2009) 9599)'
  type: main
- language: bg
  script: Cyrl
  content: '2009/888/ЕО: Решение на Комисията от 30 ноември
    2009 година за изменение на решения 2002/741/ЕО, 2002/747/ЕО,
    2003/200/ЕО, 2005/341/ЕО, 2005/342/ЕО, 2005/343/ЕО, 2005/344/ЕО, 2005/360/ЕО,
    2006/799/ЕО, 2007/64/ЕО, 2007/506/ЕО и 2007/742/ЕО за продължаване
    на срока на валидност на екологичните критерии
    за присъждане на знака за екомаркировка на
    Общността за някои продукти (нотифицирано
    под номер C(2009) 9599)'
  type: main
- language: cs
  script: Latn
  content: '2009/888/ES: Rozhodnutí Komise ze dne 30. listopadu 2009 , kterým se
    mění rozhodnutí 2002/741/ES, 2002/747/ES, 2003/200/ES, 2005/341/ES, 2005/342/ES,
    2005/343/ES, 2005/344/ES, 2005/360/ES, 2006/799/ES, 2007/64/ES, 2007/506/ES a
    2007/742/ES, aby se prodloužila platnost ekologických kritérií pro udělení
    ekoznačky Společenství některým výrobkům (oznámeno pod číslem K(2009)
    9599)'
  type: main
- language: da
  script: Latn
  content: '2009/888/EF: Kommissionens beslutning af 30. november 2009 om ændring
    af beslutning 2002/741/EF, 2002/747/EF, 2003/200/EF, 2005/341/EF, 2005/342/EF,
    2005/343/EF, 2005/344/EF, 2005/360/EF, 2006/799/EF, 2007/64/EF, 2007/506/EF og
    2007/742/EF for at forlænge gyldigheden af miljøkriterierne for tildeling af
    EF-miljømærket til bestemte produkter (meddelt under nummer K(2009) 9599)'
  type: main
- language: el
  script: Grek
