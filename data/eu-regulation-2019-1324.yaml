    (притежател на разрешението Puratos)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1324 ze dne 5. srpna 2019 o povolení
    přípravku endo-1,4-beta-xylanázy z Bacillus subtilis LMG S-27588 jako doplňkové
    látky pro výkrm kuřat nebo odchov kuřat a kuřice, výkrm krůt nebo odchov
