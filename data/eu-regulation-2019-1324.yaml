title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1324 of 5 August 2019 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase produced by Bacillus
    subtilis LMG S-27588 as a feed additive for chickens for fattening or reared for
    laying, turkeys for fattening or reared for breeding, minor poultry species for
    fattening or reared for laying or for breeding, weaned piglets, pigs for fattening
    and minor porcine species (holder of authorisation Puratos)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2019/1324 de la Commission du 5 août 2019
    concernant l''autorisation d''une préparation d''endo-1,4-bêta-xylanase produite
    par Bacillus subtilis LMG S-27588 en tant qu''additif pour l''alimentation des
    poulets à l''engrais, des poulettes élevées pour la ponte, des dindes à l''engrais
    ou élevées pour la reproduction, des espèces mineures de volailles à l''engrais
    ou élevées pour la ponte ou la reproduction, des porcelets sevrés, des porcs
    à l''engrais et des espèces porcines mineures (titulaire de l''autorisation:
    Puratos)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2019/1324 der Kommission vom 5. August 2019
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase, gewonnen aus Bacillus
    subtilis LMG S-27588, als Zusatzstoff in Futtermitteln für Masthühner oder Junghennen,
    Masttruthühner oder Zuchttruthühner, Geflügelarten von geringerer wirtschaftlicher
    Bedeutung für die Mast oder Jungtiere von Geflügelarten von geringerer wirtschaftlicher
    Bedeutung für Legezwecke oder zur Zucht, Absetzferkel, Mastschweine und Schweinearten
    von geringerer wirtschaftlicher Bedeutung (Zulassungsinhaber: Puratos)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1324 на Комисията
    от 5 август 2019 година за разрешаване на употребата
    на препарат от ендо-1,4-бета-ксиланаза, получена
    от Bacillus subtilis LMG S-27588, като фуражна добавка за
    пилета за угояване или отглеждани за кокошки
    носачки, пуйки за угояване или отглеждани за
