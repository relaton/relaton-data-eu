title:
- language: en
  script: Latn
  content: '84/251/EEC: Commission Decision of 3 May 1984 establishing that the apparatus
    described as ''Perkin- Elmer - Liquid Chromatograph, model Series 2/1 with spectrophotometric
    detector, model LC-75 and accessories'' may not be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/251/CEE: Décision de la Commission du 3 mai 1984 constatant que l''importation
    de l''appareil dénommé "Perkin-Elmer - Liquid Chromatograph, model Series 2/1
    with spectrophotometric detector, model LC-75, and accessories" ne peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/251/EWG: Entscheidung der Kommission vom 3. Mai 1984 mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer - Liquid Chromatograph, model Series 2/1
    with spectrophotometric detector, model LC-75 and accessories" nicht unter Befreiung
    von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '84/251/EØF: Kommissionens beslutning af 3. maj 1984 om fastslåelse af,
    at indførsel af apparatet "Perkin-Elmer - Liquid Chromatograph, model Series
    2/1 with spectrophotometric detector, model LC-75 and accessories" ikke kan ske
    med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '84/251/ΕΟΚ: Απόφαση της Επιτροπής της 3ης Μαΐου
    1984 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «Perkin-Elmer — Liquid Chromatograph, model Series
    2/1 with spectrophotometric detector, model LC-75 and accessories» δεν δύναται
    να πραγματοποιηθεί ατελώς ως προς τους δασμούς
    του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '84/251/CEE: Decisione della Commissione del 3 maggio 1984 che stabilisce
    che l''importazione dell''apparecchio denominato "Perkin-Elmer - Liquid Chromatograph,
    model Series 2/1 with spectrophotometric detector, model LC- 75, and accessories"
    non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '84/251/EEG: Beschikking van de Commissie van 3 mei 1984 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Perkin-Elmer - Liquid Chromatograph, model
    Series 2/1 with spectrophotometric detector, model LC-75 and accessories" niet
    met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag worden
    ingevoerd'
  type: main
