title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1527/2001 of 26 July 2001 amending Regulation
    (EC) No 825/2001 laying down special measures derogating from Regulation (EC)
    No 800/1999 and Regulation (EC) No 1520/2000 as regards products exported in the
    form of goods not covered by Annex I to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1527/2001 de la Commission du 26 juillet 2001 modifiant
    le règlement (CE) n° 825/2001 portant mesures spéciales dans le secteur des
    produits exportés sous forme de marchandise ne relevant pas de l'annexe I du
    traité, dérogeant au règlement (CE) n° 800/1999 et au règlement (CE) n°
    1520/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1527/2001 der Kommission vom 26. Juli 2001 zur Änderung
    der Verordnung (EG) Nr. 825/2001 mit Sondervorschriften für die Abweichung von
    den Verordnungen (EG) Nr. 800/1999 und (EG) Nr. 1520/2000 in Bezug auf Ausfuhrerzeugnisse
    in Form von nicht unter Anhang I des Vertrags fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1527/2001 af 26. juli 2001 om ændring
    af forordning (EF) nr. 825/2001 om særlige foranstaltninger for produkter, der
    udføres i form af varer, som ikke er opført i traktatens bilag I, og om fravigelse
    af forordning (EF) nr. 800/1999 og forordning (EF) nr. 1520/2000
  type: main
- language: el
  script: Grek
