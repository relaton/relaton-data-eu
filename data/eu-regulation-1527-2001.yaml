    (ΕΚ) αριθ. 825/2001 για τη θέσπιση ειδικών μέτρων
    κατά παρέκκλιση από τον κανονισμό (ΕΚ) αριθ.
    800/1999 και από τον κανονισμό (ΕΚ) αριθ. 1520/2000 για
    ορισμένα γεωργικά προϊόντα εξαγόμενα υπό μορφή
    εμπορευμάτων μη υπαγομένων στο παράρτημα Ι
    της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1527/2001, annettu 26 päivänä heinäkuuta
    2001, perustamissopimuksen liitteeseen I kuulumattomina tavaroina vietyjä tuotteita
    koskevista erityistoimenpiteistä sekä poikkeuksista asetukseen (EY) N:o 800/1999
    ja asetukseen (EY) N:o 1520/2000 annetun asetuksen (EY) N:o 825/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1527/2001 della Commissione, del 26 luglio 2001, che
    modifica il regolamento (CE) n. 825/2001 recante misure speciali nel settore dei
    prodotti esportati sotto forma di merci non comprese nell'allegato I del trattato,
    che derogano al regolamento (CE) n. 800/1999 e al regolamento (CE) n. 1520/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1527/2001 van de Commissie van 26 juli 2001 tot wĳziging
    van Verordening (EG) nr. 825/2001 houdende bĳzondere maatregelen in de sector
    van de producten uitgevoerd in de vorm van goederen die niet onder bĳlage I van
    het Verdrag vallen, tot afwĳking van Verordening (EG) nr. 800/1999 en Verordening
    (EG) nr. 1520/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1527/2001 da Comissão, de 26 de Julho de 2001, que
    altera o Regulamento (CE) n.° 825/2001 que estabelece medidas especiais para
    o sector dos produtos exportados sob a forma de mercadorias não abrangidas pelo
    anexo I do Tratado e que derroga o Regulamento (CE) n.° 800/1999 e o Regulamento
    (CE) n.° 1520/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1527/2001 de la Comisión, de 26 de julio de 2001,
    que modifica el Reglamento (CE) n° 825/2001 por el que se adoptan medidas especiales
    en el sector de los productos exportados en forma de mercancías no incluidas
    en el anexo I del Tratado, como excepción al Reglamento (CE) n° 800/1999 y al
    Reglamento (CE) n° 1520/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1527/2001 av den 26 juli 2001 om ändring
