title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2286/81 of 7 August 1981 providing, for
    the 1981/82 wine year, for the possible termination of long-term storage contracts
    for grape must and concentrated grape must
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2286/81 de la Commission, du 7 août 1981, ouvrant,
    pour la campagne 1981/1982, la possibilité de résiliation des contrats de stockage
    à long terme pour les moûts de raisins et les moûts de raisins concentrés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2286/81 der Kommission vom 7. August 1981 zur Ermöglichung
    einer Lösung langfristiger Lagerverträge für Traubenmost und konzentrierten
    Traubenmost für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2286/81 af 7. august 1981 om adgang
    for produktionsåret 1981/82 til at opsige kontrakter om langfristet oplagring
    af druemost og koncentreret druemost
  type: main
- language: el
  script: Grek
