    NUMMER 40.0280 ) MIT URSPRUNG IN THAILAND UND PAKISTAN, DENEN DIE DIE IN DER VERORDNUNG
    ( EWG ) NR. 3897/89 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
