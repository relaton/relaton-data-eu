  content: Commission Regulation (EEC) No 3891/90 of 21 December 1990 reintroducing
    the levying of the customs duties applicable to the products of category No 28
    (order No 40.0280) originating in Thailand and Pakistan, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3891/90 de la Commission, du 21 décembre 1990, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 28 (numéro d'ordre 40.0280) originaires de la Thaïlande
    et du Pakistan, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
