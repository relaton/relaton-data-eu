    authentiek)'
  type: main
- language: es
  script: Latn
  content: '83/386/CEE: Decisión de la Comisión de 28 de julio de 1983 por la que
    se autoriza al Reino de Dinamarca a eximir a determinados transportes nacionales
    de la aplicación del Reglamento (CEE) n° 543/69 del Consejo, relativo a la armonización
    de determinadas disposiciones en materia social en el sector del transporte por
    carretera, y del Reglamento (CEE) n° 1463/70 del Consejo relativo a la introducción
    de un aparato de control en el sector de los transportes por carretera (El texto
