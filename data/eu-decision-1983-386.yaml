title:
- language: en
  script: Latn
  content: '83/386/EEC: Commission Decision of 28 July 1983 authorizing Denmark to
    exempt certain national transport operations from the application of Council Regulation
    (EEC) No 543/69 on the harmonization of certain social legislation relating to
    road transport and Council Regulation (EEC) No 1463/70 on the introduction of
    recording equipment in road transport (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/386/CEE: Décision de la Commission du 28 juillet 1983 autorisant le
    Royaume de Danemark à exempter certains transports nationaux de l''application
    du règlement (CEE)n 543/69 du Conseil, relatif à l''harmonisation de certaines
    dispositions en matière sociale dans le domaine des transports par route, et
    du règlement (CEE) n 1463/70 du Conseil concernant l''introduction d''un appareil
    de contrôle dans le domaine des transports par route (Le texte en langue danoise
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '83/386/EWG: Entscheidung der Kommission vom 28. Juli 1983 zur Ermächtigung
    des Königreichs Dänemark, bestimmte innerstaatliche Beförderungen von der Anwendung
    der Verordnung (EWG) Nr. 543/69 des Rates über die Harmonisierung bestimmter
    Sozialvorschriften im Straßenverkehr und der Verordnung (EWG) Nr. 1463/70 über
    die Einführung eines Kontrollgeräts im Straßenverkehr freizustellen (Nur der
    dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/386/EØF: Kommissionens beslutning af 28. juli 1983 om bemyndigelse
    af den danske regering til at meddele undtagelse for visse former for indenlandsk
    kørsel fra Rådets forordning (EØF) nr. 543/69 om harmonisering af visse bestemmelser
    på det sociale område inden for landevejstransport og (EØF) nr. 1463/70 om
    indførelse af et kontrolapparat inden for landevejstransport (Kun den danske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/386/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Ιουλίου 1983 με την οποία χορηγείται άδεια στο
    Βασίλειο της Δανίας να απαλλάξει ορισμένες
    εθνικές μεταφορές από την εφαρμογή των κανονισμών
    (ΕΟΚ) αριθ. 543/69 του Συμβουλίου σχετικά με την
    εναρμόνιση ορισμένων κοινωνικών διατάξεων
    στον τομέα των οδικών μεταφορών, και (ΕΟΚ) αριθ.
    1463/70 του Συμβουλίου σχετικά με την καθιέρωση
    συσκευής ελέγχου στον τομέα των οδικών μεταφορών.
    (Το κείμενο στην δανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/386/CEE: Decisione della Commissione del 28 luglio 1983 che autorizza
    il regno di Danimarca ad esonerare taluni trasporti nazionali dall''applicazione
    dei regolamenti (CEE) n. 543/69 del Consiglio, relativo all''armonizzazione di
    alcune disposizioni in materia sociale nel settore dei trasporti su strada, e
    (CEE) n. 1463/70 del Consiglio relativo all''introduzione di un apparecchio di
    controllo nel settore dei trasporti su strada (Il testo in lingua danese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/386/EEG: Beschikking van de Commissie van 28 juli 1983 waarbij het
    Koninkrijk Denemarken wordt gemachtigd bepaalde soorten van nationaal vervoer
    vrij te stellen van de toepassing van Verordening (EEG) nr. 543/69 van de Raad
    tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer
    en van Verordening (EEG) nr. 1463/70 van de Raad betreffende de invoering van
