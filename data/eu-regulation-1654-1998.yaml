title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1654/98 of 27 July 1998 determining the extent
    to which applications lodged in July 1998 for import licences for certain pigmeat
    sector products under the regime provided for by Council Regulation (EC) No 774/94
    opening and providing for the administration of certain Community tariff quotas
    for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1654/98 de la Commission du 27 juillet 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1998 pour certains produits du secteur de la viande de porc peuvent
    être acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94
    du Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1654/98 der Kommission vom 27. Juli 1998 über die
    Festsetzung des Umfangs, in dem die im Juli 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1654/98 af 27. juli 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1998 om importlicenser for visse produkter inden for svinekødssektoren i forbindelse
    med Rådets forordning (EF) nr. 774/94 om åbning og forvaltning af en række
    EF-toldkontingenter for oksekød af høj kvalitet, svinekød, fjerkrækød, hvede
    og blandsæd af hvede og rug samt klid og andre restprodukter
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1654/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1998 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο 1998 για
    πιστοποιητικά εισαγωγής για ορισμένα προϊόντα
    του τομέα του χοιρείου κρέατος βάσει του καθεστώτος
