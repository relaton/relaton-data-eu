title:
- language: en
  script: Latn
  content: Commission Directive 94/23/EC of 8 June 1994 amending, with a view to fixing
    the minimum standards for testing vehicle braking systems, Council Directive 77/143/EEC
    on the approximation of the laws of the Member States relating to roadworthiness
    tests for motor vehicles and their trailers
  type: main
- language: fr
  script: Latn
  content: Directive 94/23/CE de la Commission, du 8 juin 1994, modifiant la directive
    77/143/CEE du Conseil concernant le rapprochement des législations des États
    membres relatives au contrôle technique des véhicules à moteur et de leurs
    remorques et fixant les normes minimales de contrôle des systèmes de freinage
    des véhicules
  type: main
- language: de
  script: Latn
  content: Richtlinie 94/23/EG der Kommission vom 8. Juni 1994 zur Änderung - im
    Hinblick auf die Festsetzung von Mindestnormen für die Prüfung der Bremsanlagen
    von Kraftfahrzeugen - der Richtlinie 77/143/EWG des Rates zur Angleichung der
    Rechtsvorschriften der Mitgliedstaaten über die technische Überwachung der Kraftfahrzeuge
    und Kraftfahrzeuganhänger
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 94/23/EF af 8. juni 1994 om ændring af Rådets
    direktiv 77/143/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning
    om teknisk kontrol med motordrevne køretøjer og påhængskøretøjer dertil
    med henblik på fastsættelse af minimumsstandarder for kontrol af motorkøretøjers
    bremsesystemer
  type: main
- language: el
  script: Grek
  content: Οδηγία 94/23/ΕΚ της Επιτροπής της 8ης Ιουνίου
    1994 που τροποποιεί, ενόψει του καθορισμού ελάχιστων
    προτύπων για τον έλεγχο των συστημάτων πέδησης
    των οχημάτων, την οδηγία 77/143/ΕΟΚ του Συμβουλίου
    περί προσεγγίσεως των νομοθεσιών των κρατών
    μελών σχετικά με τον τεχνικό έλεγχο των οχημάτων
    και των ρυμουλκουμένων τους
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 94/23/EY, annettu 8 päivänä kesäkuuta 1994, moottoriajoneuvojen
    ja niiden perävaunujen katsastusta koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun neuvoston direktiivin 77/143/ETY muuttamisesta ja jarrujärjestelmien
    katsastusta koskevien vähimmäisstandardien vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 94/23/CE della Commissione, dell'8 giugno 1994, che modifica,
    al fine di fissare le norme minime per il controllo dei dispositivi di frenatura
    dei veicoli, la direttiva 77/143/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati membri relative al controllo tecnico dei veicoli
    a motore e dei loro rimorchi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 94/23/EG van de Commissie van 8 juni 1994 tot wijziging, met
    het oog op de vaststelling van minimumnormen voor het testen van de reminrichtingen
    van voertuigen, van Richtlijn 77/143/EEG van de Raad betreffende de onderlinge
    aanpassing van de wetgevingen van de Lid-Staten inzake de technische controle
    van motorvoertuigen en aanhangwagens
  type: main
- language: pt
  script: Latn
  content: Directiva 94/23/CE da Comissão, de 8 de Junho de 1994, que altera, a fim
