  content: Commission Regulation (EEC) No 3714/89 of 11 December 1989 introducing
    retrospective surveillance of the reimportation after outward processing of certain
    textile products originating in Malta, Morocco, Tunisia and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3714/89 de la Commission du 11 décembre 1989 instaurant
