title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1303/80 of 29 May 1980 determining to what
    extent applications for import licences lodged during the month of May 1980 for
    high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1303/80 de la Commission, du 29 mai 1980, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d' importation
    déposées au mois de mai 1980 pour les viandes bovines de haute qualité, fraîches,
    réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1303/80 der Kommission vom 29. Mai 1980 zur Bestimmung
    des Maßstabs für die Genehmigung der im Mai 1980 eingereichten Anträge auf
    Einfuhrlizenzen für frisches, gekühltes oder gefrorenes Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1303/80 af 29. maj 1980 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indgivet i maj 1980
    for oksekød af høj kvalitet, fersk, kølet eller frosset kan imødekommes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1303/80 della Commissione, del 29 maggio 1980, che
    determina in quale misura possono essere accolte le domande di titoli d' importazione
    presentate nel maggio 1980 per le carni bovine di qualità pregiata, fresche,
    refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1303/80 van de Commissie van 29 mei 1980 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de certificaataanvragen die in
    mei 1980 zijn ingediend voor de invoer van vers, gekoeld of bevroren kwaliteitsrundvlees
  type: main
