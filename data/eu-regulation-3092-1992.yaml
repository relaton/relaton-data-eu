title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3092/92 of 27 October 1992 re- establishing
    the levying of customs duties on products of categories No 62, 84 and 96 (order
    No 40.0620, 40.0840 and 40.0960), originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3092/92 de la Commission, du 27 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 62, 84 et 96 (numéros d' ordre 40.0620, 40.0840 et 40.0960),
    originaires de Chine, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
