title:
- language: en
  script: Latn
  content: '90/472/EEC: Commission Decision of 10 September 1990 recognizing that
    production of certain quality wines produced in specified regions is, because
    of their qualitative features, far below demand (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/472/CEE: Décision de la Commission du 10 septembre 1990 reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    est, du fait des caractéristiques qualitatives de ces vins, largement inférieure
    à la demande (Le texte en langue allemande est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/472/EWG: Entscheidung der Kommission vom 10. September 1990 zur Anerkennung,
    daß die Nachfrage die Erzeugung an bestimmten Qualitätsweinen b.A. wegen der
    qualitativen Merkmale weit überschreitet (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/472/EØF: Kommissionens beslutning af 10. september 1990 om anerkendelse
    af, at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder på
    grund af disse vines kvalitative egenskaber langt fra er tilstrækkelig til at
    dække efterspørgslen (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/472/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Σεπτεμβρίου 1990 που αναγνωρίζει ότι η παραγωγή
    ορισμένων οίνων ποιότητας που παράγονται σε
    καθορισμένες περιοχές λόγω των ποιοτικών χαρακτηριστικών
    των οίνων αυτών, είναι πολύ μικρότερη από τη
    ζήτηση (Το κείμενο στη γερμανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/472/CEE: Decisione della Commissione del 10 settembre 1990 che riconosce
    che la produzione di taluni vini di qualità prodotti in regioni determinate,
    in considerazione delle loro caratteristiche qualitative, è ampiamente inferiore
    alla domanda (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/472/EEG: Beschikking van de commissie van 10 september 1990 houdende
    erkenning van het feit dat de produktie van bepaalde v.q.p.r.d., gezien haar kwaliteitskenmerken,
    ver bij de vraag achterblijft (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/472/CEE: Decisão da Comissão de 10 de Setembro de 1990 que reconhece
    que a produção de determinados vinhos de qualidade produzidos em regiões determinadas
    (vqprd) é, devido às características qualitativas destes vinhos, largamente
    inferior à procura (Apenas faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '90/472/CEE: Decisión de la Comisión de 10 de septiembre de 1990 por
    la que se reconoce que la producción de determinados vinos de calidad producidos
    en regiones determinadas, debido a las características cualitativas de dichos
    vinos, es ampliamente inferior a la demanda (El texto en lengua alemana es el
    único auténtico)'
  type: main
