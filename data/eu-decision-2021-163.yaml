title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/163 of 21 January 2021 adopting
    the fourteenth update of the list of sites of Community importance for the Atlantic
    biogeographical region (notified under document C(2021) 23)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/163 de la Commission du 21 janvier 2021
    arrêtant la quatorzième actualisation de la liste des sites d’importance communautaire
    pour la région biogéographique atlantique [notifiée sous le numéro C(2021)
    23]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/163 der Kommission vom 21. Januar 2021
    zur Annahme einer vierzehnten aktualisierten Liste von Gebieten von gemeinschaftlicher
    Bedeutung in der atlantischen biogeografischen Region (Bekannt gegeben unter Aktenzeichen
    C(2021) 23)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/163 на Комисията
    от 21 януари 2021 година за приемане на четиринадесетата
    актуализация на списъка на териториите от
    значение за Общността в Атлантическия биогеографски
    регион (нотифицирано под номер C(2021) 23)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/163, ze dne 21. ledna 2021, kterým
    se přijímá čtrnáctá aktualizace seznamu lokalit významných pro Společenství
    v atlantské biogeografické oblasti (oznámeno pod číslem C(2021) 23)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/163 af 21. januar 2021
    om vedtagelse af 14. ajourførte liste over lokaliteter af fællesskabsbetydning
    i det atlantiske biogeografiske område (meddelt under nummer C(2021) 23)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/163 της Επιτροπής
    της 21ης Ιανουαρίου 2021 για την έγκριση του δέκατου
    τέταρτου επικαιροποιημένου καταλόγου τόπων
    κοινοτικής σημασίας για την ατλαντική βιογεωγραφική
    περιοχή [κοινοποιηθείσα υπό τον αριθμό C(2021)
    23]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/163, 21. jaanuar 2021, millega võetakse
    vastu atlantilises biogeograafilises piirkonnas asuvate ühenduse tähtsusega
    alade loetelu neljateistkümnes uuendatud versioon (teatavaks tehtud numbri C(2021)
    23 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/163, annettu 21 päivänä
    tammikuuta 2021, Atlantin vyöhykkeen luonnonmaantieteellisellä alueella olevista
    yhteisön tärkeinä pitämistä alueista tehdyn luettelon neljännestätoista
    päivityksestä (tiedoksiannettu numerolla C(2021) 23)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/163 оd 21. siječnja 2021. o donošenju
    četrnaestog ažuriranog popisa područja od značaja za Zajednicu za atlantsku
    biogeografsku regiju (priopćeno pod brojem dokumenta C(2021) 23)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/163 végrehajtási határozata (2021. január 21.)
    az atlanti biogeográfiai régió közösségi jelentőségű természeti területeit
    tartalmazó, tizennegyedik alkalommal frissített jegyzék elfogadásáról (az
    értesítés a C(2021) 23. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/163 della Commissione del 21 gennaio
    2021 che adotta il quattordicesimo aggiornamento dell’elenco dei siti di importanza
    comunitaria per la regione biogeografica atlantica [notificata con il numero C(2021)
    23]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/163 (2021. gada 21. janvāris),
    ar ko pieņem četrpadsmito atjaunināto Atlantijas bioģeogrāfiskā reģiona
    Kopienā nozīmīgo teritoriju sarakstu (izziņots ar dokumenta numuru C(2021)
    23)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/163 2021 m. sausio 21 d. kuriuo
    patvirtinamas keturioliktą kartą atnaujintas atlantinio biogeografinio regiono
    Bendrijos svarbos teritorijų sąrašas (pranešta dokumentu Nr. C(2021) 23)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/163 tal-21
    ta’ Jannar 2021 li tadotta l-erbatax-il aġġornament tal-lista ta’ siti ta’
    importanza Komunitarja għar-reġjun bijoġeografiku tal-Atlantiku (notifikata
    bid-dokument C(2021) 23)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/163 van de Commissie van 21 januari 2021 tot
    vaststelling van een veertiende bijgewerkte lijst van gebieden van communautair
    belang voor de Atlantische biogeografische regio (Kennisgeving geschied onder
    nummer C(2021) 23)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/163 z dnia 21 stycznia 2021 r. w sprawie
    przyjęcia czternastego zaktualizowanego wykazu terenów mających znaczenie dla
    Wspólnoty składających się na atlantycki region biogeograficzny (notyfikowana
    jako dokument nr C(2021) 23)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/163 da Comissão de 21 de janeiro de 2021
    que adota a décima quarta atualização da lista dos sítios de importância
    comunitária da região biogeográfica atlântica [notificada com o número C(2021)
    23]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/163 a Comisiei din 21 ianuarie
    2021 de adoptare a celei de a paisprezecea actualizări a listei siturilor de
    importanță comunitară pentru regiunea biogeografică atlantică [notificată
    cu numărul C(2021) 23]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/163 z 21. januára 2021, ktorým
    sa prijíma štrnásta aktualizácia zoznamu lokalít s európskym významom v
    atlantickom biogeografickom regióne [oznámené pod číslom C(2021) 23]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/163 z dne 21. januarja 2021 o sprejetju
    štirinajste posodobitve seznama območij, pomembnih za Skupnost, v atlantski
    biogeografski regiji (notificirano pod dokumentarno številko C(2021) 23)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/163 de la Comisión de 21 de enero de
    2021 por la que se adopta la decimocuarta lista actualizada de lugares de importancia
    comunitaria de la región biogeográfica atlántica [notificada con el número
    C(2021) 23]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/163 av den 21 januari 2021
    om antagande av en fjortonde uppdatering av listan över områden av gemenskapsintresse
    i den atlantiska biogeografiska regionen [delgivet med nr C(2021) 23]
