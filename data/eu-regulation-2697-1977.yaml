title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2697/77 of 7 December 1977 amending the
    Annex to Regulation (EEC) No 1535/77 determining the conditions under which certain
    goods are eligible upon importation for a favourable tariff arrangement by reason
    of their end-use
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2697/77 de la Commission, du 7 décembre 1977, modifiant
    l' annexe du règlement (CEE) n° 1535/77 déterminant les conditions auxquelles
    est subordonnée l' admission de certaines marchandises au bénéfice d' un régime
    tarifaire favorable à l' importation en raison de leur destination particulière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2697/77 der Kommission vom 7. Dezember 1977 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 1535/77 der Kommission zur Festlegung der
    Voraussetzungen für die Zulassung bestimmter Waren zu einer Abgabenbegünstigung
    bei der Einfuhr auf Grund ihrer besonderen Verwendung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2697/77 af 7. december 1977 om ændring
    af bilaget til forordning (EØF) nr. 1535/77 om fastsættelse af betingelserne
    for adgangen til toldlempelser ved indførsel af varer for hvilke der er foreskrevet
    et særligt anvendelsesformål
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2697/77 τής Επιτροπής
    τής 7ης Δεκεμβρίου 1977 περί τροποποιήσεως τού
    παραρτήματος τού κανονισμού (ΕΟΚ) αριθ. 1535/77
    «περί καθορισμού τών προϋποθέσεων από τίς
    οποίες εξαρτάται η εισαγωγή ορισμένων εμπορευμάτων
    μέ τό ευεργέτημα ενός ευνοϊκού δασμολογικού
    καθεστώτος εισαγωγής λόγω τού ειδικού προορισμού
    τους»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2697/77 della Commissione, del 7 dicembre 1977, che
    modifica l' allegato del regolamento (CEE) n. 1535/77 della Commissione, che determina
    le condizioni di ammissione di talune merci al beneficio di un regime tariffario
    favorevole all' importazione in funzione della loro destinazione particolare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2697/77 van de Commissie van 7 december 1977 tot
    wijziging van de bijlage van Verordening (EEG) nr. 1535/77 houdende vaststelling
    van de voorwaarden en bepalingen waaraan bij invoer van bepaalde goederen, de
    toepassing van een gunstige tariefregeling in verband met hun bijzondere bestemming,
    is onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2697/77 da Comissão, de 7 de Dezembro de 1977,
    que altera o anexo ao Regulamento (CEE) n.° 1535/77 que determina as condições
    de admissão de algumas mercadorias ao benefício de um regime pautal favorável
    à importação em função do seu destino a um fim especial
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2697/77 de la Comisión, de 7 de diciembre de 1977,
    por el que se modifica el Anexo del Reglamento (CEE) n° 1535/77 por el que se
    fijan las condiciones a las que está supeditada la concesión a algunas mercancías
    de los beneficios de un régimen arancelario de importación favorable por razón
    de su destino especial
  type: main
