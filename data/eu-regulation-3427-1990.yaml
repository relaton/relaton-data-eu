    της κατηγορίας 23 ( αύξων αριθμός 40.0230 ), καταγωγής
    Ουγγαρίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3427/90 DELLA COMMISSIONE del 27 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 23 (numero d'ordine 40.0230) originari dell'Ungheria beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3427/90 VAN DE COMMISSIE van 27 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 23 (volgnummer 40.0230), van oorsprong uit Hongarije, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3897/89
    van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3427/90 DA COMISSAO de 27 de Novembro de 1990 que
