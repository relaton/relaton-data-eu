title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3427/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to the products of category No 23
    (order No 40.0230) originating in Hungary, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3427/90 de la Commission du 27 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 23 (numéro d'ordre 40.0230) originaires de la Hongrie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3427/90 DER KOMMISSION vom 27. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 23
    (lfd. Nummer 40.0230) mit Ursprung in Ungarn, dem die in der Verordnung (EWG)
    Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3427/90 af 27. november 1990 om genindførelse
    af opkrævning af told for varer under varekategori 23 (løbenummer 40.0230),
    som har oprindelse i Ungarn og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3427/90 της Επιτροπής
