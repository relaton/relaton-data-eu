  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 1025/2014 van de Commissie van 25 juli
    2014 tot wijziging van bijlage I bij Verordening (EG) nr. 1528/2007 tot toepassing
    van de regelingen voor goederen van oorsprong uit bepaalde staten behorende tot
    de groep van staten in Afrika, het Caribisch gebied en de Stille Oceaan (ACS),
    die zijn opgenomen in overeenkomsten tot instelling van, of leidende tot instelling
    van, economische partnerschapsovereenkomsten, zoals gewijzigd bij Verordening
    (EU) nr. 38/2014 van het Europees Parlement en de Raad tot wijziging van bepaalde
    verordeningen in verband met het gemeenschappelijke handelsbeleid wat betreft
    de verlening van gedelegeerde bevoegdheden en uitvoeringsbevoegdheden voor de
    vaststelling van bepaalde maatregelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 1025/2014 z dnia 25 lipca 2014
