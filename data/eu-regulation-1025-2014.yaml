  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 1025/2014 ze dne 25.
    července 2014 , kterým se mění příloha I nařízení Rady (ES) č. 1528/2007
    o uplatňování režimu stanoveného v dohodách zakládajících hospodářské
    partnerství nebo vedoucích k jeho založení na produkty pocházející z některých
    států, které jsou součástí skupiny afrických, karibských a tichomořských
    států (AKT) v znění nařízení Evropského parlamentu a Rady (EU) č. 38/2014
    ze dne 15. ledna 2014 , kterým se mění některá nařízení týkající se
    společné obchodní politiky, pokud jde o svěření přenesených a prováděcích
    pravomocí k přijímání určitých opatření
  type: main
