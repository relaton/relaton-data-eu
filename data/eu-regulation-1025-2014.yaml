    stosowania uzgodnień dotyczących produktów pochodzących z niektórych państw
    wchodzących w skład grupy państw Afryki, Karaibów i Pacyfiku (AKP) przewidzianych
    w umowach ustanawiających lub prowadzących do ustanowienia umów o partnerstwie
    gospodarczym, zmienionego rozporządzeniem Parlamentu Europejskiego i Rady (UE)
    nr 38/2014 zmieniającym niektóre rozporządzenia dotyczące wspólnej polityki
    handlowej w odniesieniu do przyznania uprawnień przekazanych i wykonawczych do
    przyjmowania niektórych środków
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 1025/2014 da Comissão, de 25 de julho
    de 2014 , que altera o anexo I do Regulamento (CE) n. ° 1528/2007 do Conselho
    que aplica às mercadorias originárias de determinados Estados pertencentes ao
    Grupo de Estados de África, das Caraíbas e do Pacífico (ACP) os regimes previstos
    em acordos que estabelecem ou conduzem ao estabelecimento de Acordos de Parceria
    Económica, com a redação que lhe foi dada pelo Regulamento (UE) n. ° 38/2014
    do Parlamento Europeu e do Conselho, que altera determinados regulamentos relativos
    à política comercial comum no que diz respeito à atribuição de poderes delegados
    e de execução para a adoção de certas medidas
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 1025/2014 al Comisiei din 25 iulie 2014 de
    modificare a anexei I la Regulamentul (CE) nr. 1528/2007 al Consiliului privind
    aplicarea regimurilor aplicabile produselor originare din anumite state care fac
    parte din grupul statelor din Africa, zona Caraibelor și Pacific (ACP) prevăzute
    în acordurile de stabilire sau care duc la stabilirea Acordurilor de parteneriat
    economic, astfel cum a fost modificat prin Regulamentul (UE) nr. 38/2014 al Parlamentului
    European și al Consiliului de modificare a anumitor regulamente referitoare la
    politica comercială comună, în ceea ce privește acordarea de competențe delegate
    și de executare pentru adoptarea anumitor măsuri
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 1025/2014 z 25. júla 2014 , ktorým
    sa mení príloha I k nariadeniu Rady (ES) č. 1528/2007, ktorým sa uplatňujú
    opatrenia na výrobky s pôvodom v určitých štátoch, ktoré sú súčasťou
    skupiny afrických, karibských a tichomorských (AKT) štátov, stanovené v
    dohodách, ktorými sa uzatvárajú alebo ktoré vedú k uzatvoreniu dohôd o
    hospodárskom partnerstve, zmenenému nariadením Európskeho parlamentu a Rady
    (EÚ) č. 38/2014, ktorým sa menia určité nariadenia týkajúce sa spoločnej
    obchodnej politiky, pokiaľ ide o udelenie delegovaných a vykonávacích právomocí
    na účely prijímania určitých opatrení
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 1025/2014 z dne 25. julija 2014 o
    spremembi Priloge I k Uredbi Sveta (ES) št. 1528/2007 o uporabi ureditev za blago
    s poreklom iz nekaterih držav iz skupine afriških, karibskih in pacifiških
    držav (AKP), določenih v sporazumih, ki vzpostavljajo ali vodijo k vzpostavitvi
    sporazumov o gospodarskem partnerstvu, kakor je bila spremenjena z Uredbo (EU)
    št. 38/2014 Evropskega parlamenta in Sveta o spremembi določenih uredb o skupni
    trgovinski politiki v zvezi z dodelitvijo delegiranih in izvedbenih pooblastil
    za sprejetje določenih ukrepov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n °1025/2014 de la Comisión, de 25 de julio
    de 2014 , que modifica el anexo I del Reglamento (CE) n ° 1528/2007 del Consejo,
    por el que se aplica el régimen previsto para las mercancías originarias de
    determinados Estados pertenecientes al grupo de Estados de África, del Caribe
    y del Pacífico (ACP) en los acuerdos que establecen Acuerdos de Asociación Económica
    o conducen a su establecimiento, modificado por el Reglamento (UE) n ° 38/2014
    del Parlamento Europeo y del Consejo, por el que se modifican determinados reglamentos
    relativos a la política comercial común en lo referente a la concesión de poderes
    delegados y competencias de ejecución para la adopción de determinadas medidas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 1025/2014 av den 25 juli 2014
    om ändring av bilaga I till rådets förordning (EG) nr 1528/2007 om tillämpning
    av de ordningar som ska tillämpas på produkter med ursprung i vissa stater som
    ingår i gruppen av stater i Afrika, Västindien och Stillahavsområdet (AVS)
    enligt avtal om att sluta ekonomiska partnerskapsavtal eller som leder till att
    sådana partnerskapsavtal sluts som ändrats genom Europaparlamentets och rådets
    förordning (EU) nr 38/2014 om ändring av vissa förordningar om den gemensamma
    handelspolitiken vad gäller beviljande av delegerade befogenheter och genomförandebefogenheter
    för antagande av vissa åtgärder
