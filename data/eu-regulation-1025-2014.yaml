- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 1025/2014 of 25 July 2014 amending
    Annex I to Council Regulation (EC) No 1528/2007 applying the arrangements for
    products originating in certain states which are part of the African, Caribbean
    and Pacific (ACP) Group of States provided for in agreements establishing, or
    leading to the establishment of, Economic Partnership Agreements, as amended by
    Regulation (EU) No 38/2014 of the European Parliament and of the Council amending
    certain regulations relating to the common commercial policy as regards the granting
    of delegated and implementing powers for the adoption of certain measures
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 1025/2014 de la Commission du 25 juillet
    2014 modifiant l'annexe I du règlement (CE) n ° 1528/2007 du Conseil appliquant
    aux produits originaires de certains États appartenant au groupe des États d'Afrique,
    des Caraïbes et du Pacifique (ACP) les régimes prévus dans les accords établissant
    ou conduisant à établir des accords de partenariats économiques, modifié par
    le règlement (UE) n ° 38/2014 du Parlement européen et du Conseil modifiant
    certains règlements relatifs à la politique commerciale commune en ce qui concerne
    l'octroi de pouvoirs délégués et de compétences d'exécution en vue de l'adoption
    de certaines mesures
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 1025/2014 der Kommission vom 25. Juli 2014
