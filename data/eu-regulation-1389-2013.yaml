  content: A Tanács 1389/2013/EU rendelete ( 2013. december 16. ) az Európai Unió
    és a Madagaszkári Köztársaság közötti, a két fél között jelenleg hatályban
    lévő halászati partnerségi megállapodásban előírt halászati lehetőségek
    és pénzügyi hozzájárulás megállapításáról szóló jegyzőkönyv szerinti
