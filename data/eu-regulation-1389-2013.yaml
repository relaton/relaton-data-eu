    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 1389/2013 del Consiglio, del 16 dicembre 2013 , che
    modifica il regolamento (UE) n. 1258/2012 del Consiglio relativo alla ripartizione
    delle possibilità di pesca a norma del protocollo concordato tra l'Unione europea
    e la Repubblica del Madagascar che fissa le possibilità di pesca e la contropartita
    finanziaria previste dall'accordo di partenariato nel settore della pesca in vigore
    tra le due parti
  type: main
- language: lv
  script: Latn
