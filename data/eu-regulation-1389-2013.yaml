    setting out fishing opportunities and the financial contribution provided for
    in the Fisheries Partnership Agreement between the two parties currently in force
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1389/2013 du Conseil du 16 décembre 2013 modifiant
