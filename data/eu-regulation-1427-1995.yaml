  content: COMMISSION REGULATION (EC) No 1427/95 of 23 June 1995 laying down the extent
    to which applications lodged on 19 and 20 June 1995 for certificates for the advance-fixing
    of the export refund for certain poultrymeat products may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1427/95 DE LA COMMISSION du 23 juin 1995 déterminant
