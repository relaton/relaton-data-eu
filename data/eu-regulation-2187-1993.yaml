title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2187/93 of 22 July 1993 providing for an offer
    of compensation to certain producers of milk and milk products temporarily prevented
    from carrying on their trade
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2187/93 du Conseil, du 22 juillet 1993, prévoyant l'offre
    d'une indemnisation à certains producteurs de lait ou de produits laitiers qui
    ont été empêchés temporairement d'exercer leur activité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2187/93 des Rates vom 22. Juli 1993 über das Angebot
    einer Entschädigung an bestimmte Erzeuger von Milch oder Milcherzeugnissen, die
    vorübergehend an der Ausübung ihrer Tätigkeit gehindert waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2187/93 af 22. juli 1993 om tilbud om erstatning
    til visse producenter af mælk og mejeriprodukter, som midlertidigt har været
    forhindret i at udøve deres virksomhed
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2187/93 του Συμβουλίου
    της 22ας Ιουλίου 1993 για την προσφορά αποζημίωσης
    σε ορισμένους παραγωγούς γάλακτος ή γαλακτοκομικών
    προϊόντων, οι οποίοι εμποδίστηκαν προσωρινά
    να ασκήσουν τη δραστηριότητά τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2187/93 del Consiglio, del 22 luglio 1993, che prevede
    un'offerta di indennizzo a taluni produttori di latte o di prodotti lattiero-
    caseari cui è stato temporaneamente impedito di esercitare la loro attività
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2187/93 van de Raad van 22 juli 1993 inzake het vergoedingsvoorstel
    aan bepaalde producenten van melk of zuivelprodukten die hun activiteit tijdelijk
    niet hebben kunnen uitoefenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2187/93 do Conselho, de 22 de Julho de 1993, que
    prevê uma indemnização a favor de determinados produtores de leite ou de produtos
    lácteos que foram temporariamente impedidos de exercer a sua actividade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2187/93 del Consejo, de 22 de julio de 1993, por el
    que se fija la oferta de indemnización a determinados productores de leche o
    de productos lácteos a los que se impidió temporalmente ejercer su actividad
  type: main
