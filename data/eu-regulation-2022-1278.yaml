    τροποποίηση του κανονισμού (ΕΕ) αριθ. 508/2014 όσον
    αφορά ειδικά μέτρα για την άμβλυνση των συνεπειών
    του επιθετικού πολέμου της Ρωσίας κατά της
    Ουκρανίας στις αλιευτικές δραστηριότητες
    και για τον μετριασμό των επιπτώσεων της διατάραξης
