    πόλεμο στην εφοδιαστική αλυσίδα της αλιείας
    και της υδατοκαλλιέργειας
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2022/1278, 18. juuli 2022,
    millega muudetakse määrust (EL) nr 508/2014 seoses erimeetmetega, millega leevendatakse
    Ukraina vastu suunatud Venemaa agressioonisõja tagajärgi püügitegevusele ning
    selle agressioonisõja põhjustatud turuhäirete mõju kalandus- ja vesiviljelustoodete
    tarneahelale
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2022/1278, annettu 18 päivänä
    heinäkuuta 2022, asetuksen (EU) N:o 508/2014 muuttamisesta siltä osin kuin kyseessä
    ovat erityistoimenpiteet, joilla lievennetään kalastustoiminnalle Venäjän
    Ukrainaan kohdistamasta hyökkäyssodasta aiheutuvia seurauksia ja kyseisestä
    hyökkäyssodasta johtuvasta markkinahäiriöstä kalastus- ja vesiviljelytuotteiden
    toimitusketjuun aiheutuvia vaikutuksia
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2022/1278 ó Pharlaimint na hEorpa agus ón gComhairle
    an 18 Iúil 2022 lena leasaítear Rialachán (AE) Uimh. 508/2014 a mhéid a bhaineann
    le bearta sonracha chun iarmhairtí chogadh foghach na Rúise i gcoinne na hÚcráine
    ar ghníomhaíochtaí iascaireachta a laghdú agus chun éifeachtaí na míshocrachta
    sa mhargadh ar an slabhra soláthair táirgí iascaigh agus dobharshaothraithe
    mar thoradh ar an gcogadh foghach sin a mhaolú
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2022/1278 Europskog parlamenta i Vijeća od 18. srpnja 2022.
    o izmjeni Uredbe (EU) br. 508/2014 u pogledu posebnih mjera za ublažavanje posljedica
    agresivnog rata Rusije protiv Ukrajine na ribolovne aktivnosti i za ublažavanje
    učinaka poremećaja tržišta uzrokovanog tim agresivnim ratom na lanac opskrbe
    proizvodima ribarstva i akvakulture
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/1278 rendelete (2022. július
    18.) az 508/2014/EU rendeletnek az Oroszország által Ukrajnával szemben indított
    agresszív háború halászati tevékenységeket érintő következményeinek
    enyhítésére, valamint az említett agresszív háború nyomán a halászati
    és akvakultúra-termékek ellátási láncában jelentkező piaci zavarok hatásainak
    mérséklésére irányuló egyedi intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/1278 del Parlamento europeo e del Consiglio del 18
    luglio 2022 che modifica il regolamento (UE) n. 508/2014 per quanto riguarda misure
    specifiche volte ad attenuare le conseguenze della guerra di aggressione della
    Russia nei confronti dell’Ucraina sulle attività di pesca e gli effetti della
    perturbazione del mercato causata da tale guerra di aggressione sulla catena di
    approvvigionamento dei prodotti della pesca e dell’acquacoltura
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2022/1278 (2022. gada 18. jūlijs),
    ar ko groza Regulu (ES) Nr. 508/2014 attiecībā uz konkrētiem pasākumiem, kuri
    veicami, lai vājinātu sekas, ko Krievijas agresijas karš pret Ukrainu atstāj
    uz zvejas darbībām, un mazinātu šā agresijas kara radīto tirgus traucējumu
    ietekmi uz zvejas un akvakultūras produktu piegādes ķēdi
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2022/1278 2022 m. liepos
    18 d. kuriuo iš dalies keičiamas Reglamentas (ES) Nr. 508/2014, kiek tai susiję
    su konkrečiomis priemonėmis, kuriomis siekiama sušvelninti Rusijos agresijos
    karo prieš Ukrainą pasekmes žvejybos veiklai ir to agresijos karo keliamų
    rinkos trikdžių poveikį žvejybos ir akvakultūros produktų tiekimo grandinei
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2022/1278 tal-Parlament Ewropew u tal-Kunsill tat-18 ta’
    Lulju 2022 li jemenda r-Regolament (UE) Nru 508/2014 fir-rigward ta’ miżuri
    speċifiċi sabiex jittaffew il-konsegwenzi tal-gwerra ta’ aggressjoni tar-Russja
    kontra l-Ukrajna fuq l-attivitajiet tas-sajd u biex jiġu mitigati l-effetti tat-tfixkil
    fis-suq ikkawżat minn dik il-gwerra ta’ aggressjoni fuq il-katina tal-provvista
    ta’ prodotti tas-sajd u tal-akkwakultura
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/1278 van het Europees Parlement en de Raad van 18
    juli 2022 tot wijziging van Verordening (EU) nr. 508/2014 wat betreft specifieke
    maatregelen ter verlichting van de gevolgen van de aanvalsoorlogvan Rusland tegen
    Oekraïne op de visserijactiviteiten en ter beperking van de effecten van de marktverstoring
    als gevolg van die aanvalsoorlog op de toeleveringsketen van visserij- en aquacultuurproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2022/1278 z dnia 18
    lipca 2022 r. w sprawie zmiany rozporządzenia (UE) nr 508/2014 w odniesieniu
    do środków szczególnych mających na celu złagodzenie skutków prowadzonej
    przez Rosję wojny napastniczej przeciwko Ukrainie dla działalności połowowej
    oraz ograniczenie wpływu zakłóceń rynku spowodowanych tą wojną napastniczą
    na łańcuch dostaw produktów rybołówstwa i akwakultury
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/1278 do Parlamento Europeu e do Conselho de 18 de
    julho de 2022 que altera o Regulamento (UE) n.o 508/2014 no que diz respeito a
    medidas específicas para atenuar as consequências da guerra de agressão da
    Rússia contra a Ucrânia nas atividades de pesca e para mitigar os efeitos da
    perturbação do mercado causada por essa guerra de agressão na cadeia de abastecimento
    de produtos da pesca e da aquicultura
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/1278 al Parlamentului European și al Consiliului
    din 18 iulie 2022 de modificare a Regulamentului (UE) nr. 508/2014 în ceea ce
    privește anumite măsuri specifice pentru atenuarea consecințelor războiului
    de agresiune al Rusiei împotriva Ucrainei asupra activităților de pescuit și
    pentru atenuarea efectelor perturbării pieței cauzate de respectivul război
    de agresiune asupra lanțului de aprovizionare cu produse pescărești și din
    acvacultură
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2022/1278 z 18. júla 2022,
    ktorým sa mení nariadenie (EÚ) č. 508/2014, pokiaľ ide o osobitné opatrenia
    na zmiernenie dôsledkov útočnej vojny Ruska proti Ukrajine na rybolovné činnosti
    a zmiernenie vplyvov narušenia trhu spôsobeného touto útočnou vojnou na dodávateľský
    reťazec produktov rybolovu a akvakultúry
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2022/1278 Evropskega parlamenta in Sveta z dne 18. julija 2022
    o spremembi Uredbe (EU) št. 508/2014 v zvezi s posebnimi ukrepi za ublažitev
    posledic vojne agresije Rusije proti Ukrajini za ribolovne dejavnosti in omilitev
    učinkov motenj na trgu, ki jih je povzročila navedena vojna agresija na dobavno
    verigo ribiških proizvodov in proizvodov iz akvakulture
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/1278 del Parlamento Europeo y del Consejo de 18 de
    julio de 2022 por el que se modifica el Reglamento (UE) n.o 508/2014 en lo que
    se refiere a las medidas específicas para mitigar las consecuencias de la guerra
    de agresión de Rusia contra Ucrania en las actividades pesqueras y atenuar los
    efectos de la perturbación del mercado causada por esa guerra de agresión en
    la cadena de suministro de productos de la pesca y la acuicultura
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2022/1278 av den 18 juli
    2022 om ändring av förordning (EU) nr 508/2014 vad gäller särskilda åtgärder
    för att mildra konsekvenserna för fiskeverksamheten av Rysslands anfallskrig
    mot Ukraina och för att begränsa effekterna på leveranskedjan för fiskeri-
    och vattenbruksprodukter av de marknadsstörningar som orsakas av det anfallskriget
