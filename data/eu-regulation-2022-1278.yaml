title:
- language: en
  script: Latn
  content: Regulation (EU) 2022/1278 of the European Parliament and of the Council
    of 18 July 2022 amending Regulation (EU) No 508/2014 as regards specific measures
    to alleviate the consequences of Russia’s war of aggression against Ukraine
    on fishing activities and to mitigate the effects of the market disruption caused
    by that war of aggression on the supply chain of fishery and aquaculture products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1278 du Parlement européen et du Conseil du 18 juillet
    2022 modifiant le règlement (UE) no 508/2014 en ce qui concerne des mesures spécifiques
    visant à alléger les conséquences de la guerre d’agression menée par la
    Russie contre l’Ukraine sur les activités de pêche et à atténuer les effets
    de la perturbation du marché causée par cette guerre d’agression sur la chaîne
    d’approvisionnement des produits de la pêche et de l’aquaculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/1278 des Europäischen Parlaments und des Rates vom
    18. Juli 2022 zur Änderung der Verordnung (EU) Nr. 508/2014 hinsichtlich spezifischer
    Maßnahmen zur Abmilderung der Auswirkungen des Angriffskriegs Russlands gegen
    die Ukraine auf die Fangtätigkeiten und zur Abfederung der Folgen der durch diesen
    Angriffskrieg verursachten Marktstörungen für die Lieferkette von Fischerei-
    und Aquakulturerzeugnissen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2022/1278 на Европейския парламент
    и на Съвета от 18 юли 2022 година за изменение
    на Регламент (ЕС) № 508/2014 по отношение на специални
    мерки за смекчаване на последиците от агресивната
    война на Русия срещу Украйна върху риболовните
    дейности и за ограничаване на въздействието
    от сътресението на пазара, причинено от тази
    агресивна война, върху веригата на доставки
    на продукти от риболов и аквакултури
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2022/1278 ze dne 18. července
    2022, kterým se mění nařízení (EU) č. 508/2014, pokud jde o zvláštní
    opatření ke zmírnění důsledků útočné války Ruska vůči Ukrajině pro
    rybolovné činnosti a zmírnění dopadů narušení trhu způsobeného touto
    útočnou válkou na dodavatelský řetězec produktů rybolovu a akvakultury
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/1278 af 18. juli 2022
    om ændring af forordning (EU) nr. 508/2014 for så vidt angår særlige foranstaltninger
    til at afbøde konsekvenserne af Ruslands angrebskrig mod Ukraine på fiskeriaktiviteterne
    og afbøde virkningerne af de markedsforstyrrelser, som er forårsaget af denne
    angrebskrig, på forsyningskæden for fiskevarer eller akvakulturprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2022/1278 του Ευρωπαϊκού Κοινοβουλίου
