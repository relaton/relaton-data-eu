title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1231/70 du Conseil, du 29 juin 1970, modifiant le
    règlement (CEE) n° 1060/69 fixant les quantités de produits de base considérées
    comme étant entrées dans la fabrication des marchandises relevant du règlement
    (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1231/70 des Rates vom 29. Juni 1970 zur Änderung
    der Verordnung (EWG) Nr. 1060/69 zur Festlegung der Grunderzeugnismengen, bei
    denen davon ausgegangen wird, daß sie zur Herstellung der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren verwendet worden sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1231/70 del Consiglio, del 29 giugno 1970, che modifica
    il regolamento (CEE) n. 1060/69, relativo alla fissazione dei quantitativi di
    prodotti di base che si considerano entrati nella fabbricazione delle merci cui
    si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1231/70 van de Raad van 29 juni 1970 houdende wijziging
    van Verordening (EEG) nr. 1060/69 tot vaststelling van de hoeveelheden basisprodukten
    die worden geacht bij de vervaardiging van de onder Verordening (EEG) nr. 1059/69
    vallende goederen te zijn gebruikt
  type: main
