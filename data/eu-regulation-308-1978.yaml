title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 308/78 of 15 February 1978 re-establishing
    the levying of customs duties on glass inners for vacuum flasks or for other vacuum
    vessels, falling within heading No 70.12, originating in Yugoslavia to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 308/78 de la Commission, du 15 février 1978, portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants de la position tarifaire 70.12, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 308/78 der Kommission vom 15. Februar 1978 zur Wiedereinführung
    des Zollsatzes für Glaskolben für Isolierbehälter der Tarifnummer 70.12 mit
    Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 308/78 af 15. februar 1978 om genindførelse
    af opkrævning af toldafgifter for glaskolber til termoflasker og lignende isotermiske
    beholdere under position 70.12, som har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 308/78 della Commissione, del 15 febbraio 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti della voce doganale 70.12, originarie della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 308/78 van de Commissie van 15 februari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op binnenflessen
    voor thermisch isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen,
    van post 70.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
