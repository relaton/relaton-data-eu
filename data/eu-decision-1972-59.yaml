    1971
  type: main
- language: de
  script: Latn
  content: '72/59/EWG: Entscheidung der Kommission vom 17. Dezember 1971 über die
    Erstattung der bei den am 1. April und 1. August 1971 durchgeführten Erhebungen
    über den Schweinebestand entstandenen Kosten durch den EAGFL, Abteilung Ausrichtung,
    an die Französische Republik'
  type: main
- language: it
  script: Latn
