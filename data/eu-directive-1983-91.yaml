    trikiinitutkimuksesta annetun direktiivin 77/96/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1983. február 7.) a szarvasmarhafélék, a sertések
    és a friss hús harmadik országból történő behozatalára vonatkozó egészségügyi
    és állat-egészségügyi vizsgálatok problémáiról szóló 72/462/EGK irányelv,
    valamint a harmadik országból behozott friss sertéshús trichinellavizsgálatáról
    szóló 77/96/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 83/91/CEE del Consiglio del 7 febbraio 1983 che modifica la direttiva
    72/462/CEE relativa a problemi sanitari e di polizia sanitaria all'importazione
    di animali delle specie bovina e suina e di carni fresche in provenienza dai paesi
    terzi e la direttiva 77/96/CEE concernente la ricerca delle trichine all'importazione
    dai paesi terzi di carni fresche provenienti da animali domestici della specie
    suina
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1983. gada 7. februāris), ar ko groza Direktīvu 72/462/EEK
    par veselības un veterinārās pārbaudes problēmām, ievedot liellopus, cūkas
    un svaigu gaļu no trešām valstīm, un Direktīvu 77/96/EEK par trihīnu (trichinella
    spiralis) pārbaudi, ievedot no trešām valstīm svaigu mājas cūku gaļu
  type: main
- language: lt
  script: Latn
  content: 1983 m. vasario 7 d. Tarybos Direktyva iš dalies keičianti Direktyvą
    72/462/EEB dėl sveikatos ir veterinarinio patikrinimo problemų importuojant
    galvijus, kiaules ir šviežią mėsą iš trečiųjų šalių ir Direktyvą 77/96/EEB
    dėl trichinelų (trichinella spiralis) tyrimo naminių kiaulių šviežioje mėsoje,
    importuojamoje iš trečiųjų šalių
  type: main
- language: mt
  script: Latn
  content: Id-direttiva tal-kunsill tas-7 tac Frar 1983 li temenda d-Direttiva 72/462/KEE
    dwar il-problemi tas-saħħa u l-ispezzjonijiet veterinarji fl-importazzjoni ta’
    l-annimali ta’ l-ifrat u tal-majjali u tal-laħam frisk minn pajjiżi terzi
    u d-Direttiva 77/96/KEE u l-eżami għat-trichinae (trichinella spiralis) ma l-importazzjoni
    minn pajjiżi terzi tal-laham frisk akwistat mill-majjali domestiċi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 83/91/EEG van de Raad van 7 februari 1983 tot wijziging van Richtlijn
    72/462/EEG inzake gezondheidsvraagstukken en veterinairrechtelijke vraagstukken
    bij de invoer van runderen en varkens en van vers vlees uit derde landen en van
    Richtlijn 77/96/EEG inzake het opsporen van trichinen bij de invoer van vers vlees
    van varkens, huisdieren, uit derde landen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 7 lutego 1983 r. zmieniająca dyrektywę 72/462/EWG
    w sprawie problemów zdrowotnych i inspekcji weterynaryjnej przed przywozem z
    państw trzecich bydła, trzody chlewnej i świeżego mięsa, jak również dyrektywę
    77/96/EWG w sprawie badań świeżego mięsa wieprzowego na obecność włosieni
    (Trichinella spiralis) przed przywozem z państw trzecich
  type: main
- language: pt
  script: Latn
  content: Directiva 83/91/CEE do Conselho, de 7 de Fevereiro de 1983, que altera
    a Directiva 72/462/CEE referente aos problemas sanitários e de polícia sanitária
    por ocasião da importação de animais das espécies bovina e suína e de carnes
    frescas provenientes de países terceiros e a Directiva 77/96/CEE relativa à
    pesquisa de triquinas por ocasião das importações provenientes de países terceiros,
    de carnes frescas de animais domésticos da espécie suína
  type: main
- language: sk
  script: Latn
  content: Smernica Rady zo 7. februára 1983, ktorou sa mení a dopĺňa smernica
    72/462/EHS o problémoch zdravotnej a veterinárnej kontroly pri dovoze hovädzieho
    dobytka a ošípaných a čerstvého mäsa z tretích krajín a smernica 77/96/EHS
    o vyšetrovaní na výskyt svalovca stočeného (trichinella spiralis) pri dovoze
    z tretích krajín čerstvého mäsa pochádzajúceho z domácich ošípaných
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 7. februarja 1983 o spremembah Direktive 72/462/EGS
    o problemih glede zdravstvenih in veterinarskih pregledov ob uvozu goveda in prašičev
    ter svežega mesa iz tretjih držav in Direktive 77/96/EGS o pregledu na trihinele
    (Trichinella spiralis) pri uvozu svežega mesa domačih prašičev iz tretjih
    držav
  type: main
- language: es
  script: Latn
  content: Directiva 83/91/CEE del Consejo, de 7 de febrero de 1983, por la que se
    modifica la Directiva 72/462/CEE relativa a problemas sanitarios y de policía
    sanitaria en la importación de animales de la especie bovina y porcina y de carnes
    frescas procedentes de terceros países y la Directiva 77/96/CEE relativa a la
    investigación de triquinas en las importaciones procedentes de terceros países,
    de carnes frescas que proceden de animales domésticos de la especie porcina
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 83/91/EEG av den 7 februari 1983 om ändring av direktiv
    72/462/EEG om hälsoproblem och problem som rör veterinärbesiktning vid import
    från tredje land av nötkreatur, svin och färskt kött och direktiv 77/96/EEG
    om trikinkontroll (trichinella spiralis) vid import av färskt kött av tamsvin
    från tredje landh
