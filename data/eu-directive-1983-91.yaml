    72/462/EØF om sundhedsmæssige og veterinærpolitimæssige problemer i forbindelse
    med indførsel af kvæg og svin samt fersk kød fra tredjelande og af direktiv
    77/96/EØF om trikinundersøgelse i forbindelse med indførsel af fersk kød af
    tamsvin fra tredjelande
  type: main
