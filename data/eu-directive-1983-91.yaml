- language: en
  script: Latn
  content: Council Directive 83/91/EEC of 7 February 1983 amending Directive 72/462/EEC
    on health and veterinary inspection problems upon importation of bovine animals
    and swine and fresh meat from third countries and Directive 77/96/EEC on the examination
    for trichinae (trichinella spiralis) upon importation from third countries of
    fresh meat derived from domestic swine
  type: main
- language: fr
  script: Latn
  content: Directive 83/91/CEE du Conseil du 7 février 1983 modifiant la directive
    72/462/CEE concernant les problèmes sanitaires et de police sanitaire lors de
    l'importation d'animaux des espèces bovine et porcine et de viandes fraîches
    en provenance de pays tiers et la directive 77/96/CEE relative à la recherche
    de trichines lors des importations en provenance des pays tiers, des viandes fraîches
    provenant d'animaux domestiques de l'espèce porcine
  type: main
- language: de
  script: Latn
  content: Richtlinie 83/91/EWG des Rates vom 7. Februar 1983 zur Änderung der Richtlinie
    72/462/EWG zur Regelung viehseuchenrechtlicher und gesundheitlicher Fragen bei
    der Einfuhr von Rindern und Schweinen und von frischem Fleisch aus Drittländern
    und der Richtlinie 77/96/EWG über die Untersuchung von frischem Schweinefleisch
    auf Trichinen bei der Einfuhr aus Drittländern
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 7. února 1983, kterou se mění směrnice 72/462/EHS
    o veterinárních a hygienických otázkách dovozu skotu, prasat a čerstvého
    masa ze třetích zemí a směrnice 77/96/EHS o vyšetření čerstvého masa
    domácích prasat na svalovce (trichinella spiralis) při jeho dovozu ze třetích
    zemí
  type: main
