title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 408/93 of 24 February 1993 determining the
    extent to which applications in the beef and veal sector for the issue of import
    licences lodged pursuant to Regulation (EEC) No 3771/92 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 408/93 de la Commission, du 24 février 1993, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d' importation déposées, au titre du règlement (CEE) n° 3771/92, dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 408/93 der Kommission vom 24. Februar 1993 über den
    Umfang, in dem den Anträgen auf Erteilung von Einfuhrlizenzen für Rindfleisch
    im Rahmen der Verordnung (EWG) Nr. 3771/92 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 408/93 af 24. februar 1993 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for oksekød
    i henhold til forordning (EØF) nr. 3771/92 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 408/93 της Επιτροπής
    της 24ης Φεβρουαρίου 1993 περί προσδιορισμού
    των όρων για την αποδοχή των αιτήσεων εκδόσεως
    πιστοποιητικών εισαγωγής που έχουν υποβληθεί
    βάσει του κανονισμού (ΕΟΚ) αριθ. 3771/92 στον τομέα
    του βοείου κρέατος
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 408/93, annettu 24 päivänä helmikuuta 1993,
    naudanliha-alaa koskevien jätettyjen tuontitodistushakemusten hyväksymisestä
    asetuksen (ETY) N:o 3771/92 nojalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 408/93 della Commissione, del 24 febbraio 1993, che
    stabilisce la misura in cui possono essere accolte le domande di titoli di importazione
    presentate a norma del regolamento (CEE) n. 3771/91 nel settore delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 408/93 van de Commissie van 24 februari 1993 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de op grond van
    Verordening (EEG) nr. 3771/92 ingediende aanvragen om afgifte van invoercertificaten
    in de rundvleessector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 408/93 da Comissão, de 24 de Fevereiro de 1993,
    que determina em que medida pode ser dado seguimento aos pedidos de emissão de
    certificados de importação apresentados ao abrigo do Regulamento (CEE) n° 3771/92
    no sector da carne de bovino
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 408/93 de la Comisión, de 24 de febrero de 1993,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    expedición de certificados de importación presentadas con arreglo al Reglamento
    (CEE) n° 3771/92 en el sector de la carne de vacuno
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 408/93 av den 24 februari 1993 om fastställande
