    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    3 (αύξων αριθμός 40.0033), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) 3832/90
    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1016/92 DELLA COMMISSIONE del 23 aprile 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 3 (numero d'' ordine 40.0033), originari dell'' India, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1016/92 VAN DE COMMISSIE van 23 april 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 3 (volgnummer 40.0033), van oorsprong uit India, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
