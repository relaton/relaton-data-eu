title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1016/92 of 23 April 1992 re-establishing
    the levying of customs duties on products of category 3 (order No 40.0033), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1016/92 de la Commission du 23 avril 1992 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 3 (numéro d'ordre 40.0033) originaires de l'Inde, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1016/92 DER KOMMISSION vom 23. April 1992 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 3 (lfd. Nummer
    40.0033) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3832/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1016/92 af 23. april 1992 om genindførelse
    af opkrævning af told for varer under kategori nr. 3 (løbenummer 40.0033) som
    har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1016/92 της Επιτροπής
