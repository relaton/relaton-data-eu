  script: Latn
  content: '98/484/EC: Council Decision of 20 July 1998 on the conclusion of the Agreement
    in the form of an Exchange of Letters between the European Community and the Islamic
    Federal Republic of the Comoros concerning the provisional application of the
    Protocol setting out, for the period 28 February 1998 to 27 February 2001, the
    fishing opportunities and financial contribution provided for in the Agreement
    between the European Economic Community and the Islamic Federal Republic of the
    Comoros on fishing off the Comoros'
  type: main
- language: fr
  script: Latn
  content: '98/484/CE: Décision du Conseil du 20 juillet 1998 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté européenne
    et la République fédérale islamique des Comores relatif à l''application provisoire
    du protocole fixant, pour la période du 28 février 1998 au 27 février 2001,
    les possibilités de pêche et la contrepartie financière prévues dans l''accord
    entre la Communauté économique européenne et la République fédérale islamique
    des Comores concernant la pêche au large des Comores'
  type: main
