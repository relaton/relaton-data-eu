title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1237/77 of 9 June 1977 re-establishing the
    levying of the customs duties on equipment for parlour, table and funfair games,
    falling within heading No 97.04, originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1237/77 de la Commission, du 9 juin 1977, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, de la position tarifaire 97.04, originaires de Hong-Kong
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1237/77 der Kommission vom 9. Juni 1977 zur Wiedereinführung
    des Zollsatzes für Gesellschaftsspiele der Tarifnummer 97.04, mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1237/77 af 9. juni 1977 om genindførelse
    af toldafgifter for selskabsspil under position 97.04, som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1237/77 della Commissione, del 9 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti per giuochi
    di società, della voce doganale 97.04 originari di Hong Kong beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1237/77 van de Commissie van 9 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op artikelen
    voor gezelschapsspellen, van post 97.04, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
