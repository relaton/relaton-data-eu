---
id: EUDecision201486
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/86/EU: Commission Implementing Decision of 13 February 2014 amending
    Decision 93/195/EEC as regards animal health and veterinary certification conditions
    for the re-entry of registered horses for racing, competition and cultural events
    after temporary export to Mexico and amending Annex I to Decision 2004/211/EC
    as regards the entry for Mexico in the list of third countries and parts thereof
    from which imports into the Union of live equidae and semen, ova and embryos of
    the equine species are authorised (notified under document C(2014) 692)'
  type: main
- language: fr
  script: Latn
  content: '2014/86/UE: Décision d’exécution de la Commission du 13 février 2014
    modifiant la décision 93/195/CEE en ce qui concerne les conditions sanitaires
    et la certification sanitaire requises pour la réadmission de chevaux enregistrés
    en vue des courses, de la compétition et de manifestations culturelles après
    exportation temporaire au Mexique, et modifiant l’annexe I de la décision 2004/211/CE
    en ce qui concerne la mention relative au Mexique sur la liste des pays tiers
    et des parties de ces pays en provenance desquels les importations dans l’Union
    européenne d’équidés vivants et de sperme, d’ovules et d’embryons de
    l’espèce équine sont autorisées [notifiée sous le numéro C(2014) 692]'
  type: main
- language: de
  script: Latn
  content: '2014/86/EU: Durchführungsbeschluss der Kommission vom 13. Februar 2014
    zur Änderung der Entscheidung 93/195/EWG hinsichtlich der tierseuchenrechtlichen
    Bedingungen und der Beurkundung für die Wiedereinfuhr von registrierten Renn-,
    Turnier- und für kulturelle Veranstaltungen bestimmten Pferden nach vorübergehender
    Ausfuhr nach Mexiko sowie zur Änderung des Anhangs I der Entscheidung 2004/211/EG
    hinsichtlich des Eintrags für Mexiko in der Liste von Drittländern und Teilen
    von Drittländern, aus denen die Einfuhr von lebenden Equiden sowie von Equidensperma,
    -eizellen und -embryonen in die Union zugelassen ist (Bekanntgegeben unter Aktenzeichen
    C(2014) 692)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/86/ЕС: Решение за изпълнение на Комисията
    от 13 февруари 2014 година за изменение на Решение
    93/195/ЕИО по отношение на ветеринарно-санитарните
    условия и ветеринарното сертифициране при
    повторното въвеждане на регистрирани коне
    за надбягвания, спортни състезания и културни
    прояви, след временен износ в Мексико и за изменение
    на приложение I към Решение 2004/211/ЕО по отношение
    на вписването за Мексико в списъка на трети
    страни и части от тях, от които е разрешен вносът
    в Европейския съюз на живи еднокопитни и сперма,
    яйцеклетки и ембриони от еднокопитни животни
    (нотифицирано под номер C(2014) 692)'
  type: main
- language: cs
  script: Latn
  content: '2014/86/EU: Prováděcí rozhodnutí Komise ze dne 13. února 2014 , kterým
    se mění rozhodnutí 93/195/EHS, pokud jde o veterinární podmínky a veterinární
    osvědčení pro zpětný dovoz evidovaných koní určených pro dostihy, soutěže
    a kulturní akce po jejich dočasném vývozu do Mexika, a příloha I rozhodnutí
    2004/211/ES, pokud jde o zápis Mexika na seznam třetích zemí a částí jejich
    území, ze kterých je povolen dovoz živých koňovitých a spermatu, vajíček
    a embryí druhů koňovitých do Unie (oznámeno pod číslem C(2014) 692)'
  type: main
- language: da
  script: Latn
  content: '2014/86/EU: Kommissionens gennemførelsesafgørelse af 13. februar 2014
    om ændring af Kommissionens beslutning 93/195/EØF for så vidt angår dyresundhedsmæssige
    betingelser og udstedelse af sundhedscertifikat ved genindførsel af heste, der
    er registreret med henblik på væddeløb, konkurrencer og kulturelle arrangementer,
    efter midlertidig udførsel til Mexico og om ændring af bilag I til beslutning
    2004/211/EF for så vidt angår oplysninger om Mexico i listen over tredjelande
    og dele deraf, hvorfra import til Unionen af levende dyr af hestefamilien samt
    sæd, æg og embryoner fra dyr af hestefamilien tillades (meddelt under nummer
    C(2014) 692)'
  type: main
- language: el
  script: Grek
  content: '2014/86/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 13ης Φεβρουαρίου 2014 , για την τροποποίηση
    της απόφασης 93/195/ΕΟΚ για τους υγειονομικούς
    όρους και την υγειονομική πιστοποίηση που
    απαιτούνται για την επανείσοδο εγγεγραμμένων
    ίππων προοριζόμενων για ιπποδρομίες, διαγωνισμούς
    και πολιτιστικές εκδηλώσεις μετά από προσωρινή
    εξαγωγή στο Μεξικό και την τροποποίηση του
    παραρτήματος I της απόφασης 2004/211/ΕΚ για την
    καταχώριση του Μεξικού στον κατάλογο των τρίτων
    χωρών και των περιοχών τους από τις οποίες
    εγκρίνονται εισαγωγές ζώντων ιπποειδών και
    σπέρματος, ωαρίων και εμβρύων ιπποειδών στην
    Ένωση [κοινοποιηθείσα υπό τον αριθμό C(2014) 692]'
  type: main
- language: et
  script: Latn
  content: '2014/86/EL: Komisjoni rakendusotsus, 13. veebruar 2014 , millega muudetakse
    otsust 93/195/EMÜ seoses loomatervishoiunõuete ja veterinaarsertifikaatidega
    registreeritud hobuste taassisenemiseks pärast võidusõidu, võistlemise ja
    kultuuriürituste tõttu toimunud ajutist eksporti Mehhikosse ning otsuse 2004/211/EÜ
    I lisa seoses Mehhiko lisamisega kolmandate riikide ja nende territooriumi osade
    loetelusse, millest on lubatud importida elushobuslasi ning hobuslaste spermat,
    munarakke ja embrüoid (teatavaks tehtud numbri C(2014) 692 all)'
  type: main
- language: fi
  script: Latn
  content: '2014/86/EU: Komission täytäntöönpanopäätös, annettu 13 päivänä
    helmikuuta 2014 , päätöksen 93/195/ETY muuttamisesta siltä osin kuin on kyse
    eläinten terveyttä ja eläinlääkärintodistuksia koskevista vaatimuksista
    rekisteröityjen hevosten takaisintuonnissa raveja, kilpailuja ja kulttuuritapahtumia
    varten tapahtuneen tilapäisen Meksikoon viennin jälkeen ja päätöksen 2004/211/EY
    liitteen I muuttamisesta siltä osin kuin on kyse Meksikoa koskevasta kohdasta
    niiden kolmansien maiden ja kolmansien maiden alueiden luettelossa, joista elävien
    hevoseläinten ja hevoseläinten siemennesteen, munasolujen ja alkioiden tuonti
    unioniin on sallittua (tiedoksiannettu numerolla C(2014) 692)'
  type: main
- language: hr
  script: Latn
  content: '2014/86/EU: Provedbena odluka Komisije оd 13. veljače 2014. o izmjeni
    Odluke 93/195/EEZ o uvjetima zdravlja životinja i veterinarskom certificiranju
    za ponovni ulazak registriranih konja za utrke, natjecanja i kulturna događanja
    nakon privremenog izvoza u Meksiko te o izmjeni Priloga I. Odluci 2004/211/EZ
    u pogledu unosa za Meksiko na popisu trećih zemalja i njihovih dijelova iz kojih
    je dopušten uvoz u Uniju živih kopitara i sjemena, jajnih stanica i zametaka
    vrste kopitara (priopćeno pod brojem dokumenta C(2014) 692)'
  type: main
- language: hu
  script: Latn
  content: '2014/86/EU: A Bizottság végrehajtási határozata ( 2014. február 13.
    ) a 93/195/EGK határozatnak a lóverseny, lovassportrendezvények vagy kulturális
    események céljára szánt törzskönyvezett lovak Mexikóba történő ideiglenes
    kivitele utáni újrabehozatalára vonatkozó állat-egészségügyi feltételek
    tekintetében, valamint a 2004/211/EK határozat I. mellékletének az élő lófélék,
    továbbá a lófélék spermájának, petesejtjeinek és embrióinak az Unióba
    történő behozatalára feljogosított harmadik országok és azok részei jegyzékében
    a Mexikóra vonatkozó bejegyzések tekintetében történő módosításáról
    (az értesítés a C(2014) 692. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/86/UE: Decisione di esecuzione della Commissione, del 13 febbraio
    2014 , che modifica la decisione 93/195/CEE per quanto riguarda le condizioni
    di polizia sanitaria e la certificazione veterinaria cui è subordinata la reintroduzione
    di cavalli registrati per corse, competizioni e manifestazioni culturali dopo
    un’esportazione temporanea in Messico, che modifica l’allegato I della decisione
    2004/211/CE per quanto concerne la voce relativa al Messico nell’elenco dei
    paesi terzi e delle parti di paesi terzi a partire dai quali sono autorizzate
    le importazioni nell’Unione di equidi vivi nonché di sperma, ovuli ed embrioni
    della specie equina [notificata con il numero C(2014) 692]'
  type: main
- language: lv
  script: Latn
  content: '2014/86/ES: Komisijas Īstenošanas lēmums ( 2014. gada 13. februāris
    ), ar ko groza Lēmumu 93/195/EEK attiecībā uz dzīvnieku veselības nosacījumiem
    un veterināro sertifikāciju reģistrētu zirgu atpakaļievešanai pēc pagaidu
    izvešanas uz Meksiku skriešanās sacīkstēm, sacensībām un kultūras pasākumiem
    un ar ko groza Lēmuma 2004/211/EK I pielikumu attiecībā uz ierakstu par Meksiku
    to trešo valstu un to daļu sarakstā, no kurām atļauts importēt Savienībā
    dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un embrijus (izziņots
    ar dokumenta numuru C(2014) 692)'
  type: main
- language: lt
  script: Latn
  content: '2014/86/ES: 2014 m. vasario 13 d. Komisijos įgyvendinimo sprendimas,
    kuriuo iš dalies keičiamas Sprendimas 93/195/EEB dėl gyvūnų sveikatos reikalavimų
    ir veterinarinio sertifikavimo pakartotinai įvežant registruotus arklius lenktynėms,
    varžyboms ir kultūriniams renginiams po jų laikino eksporto į Meksiką ir
    Sprendimo 2004/211/EB I priedas dėl Meksikos įrašo trečiųjų šalių ir jų
    dalių, iš kurių į Sąjungą leidžiama importuoti gyvus arklinių šeimos
    gyvūnus ir arklių rūšių spermą, kiaušialąstes ir embrionus, sąraše (pranešta
    dokumentu Nr. C(2014) 692)'
  type: main
- language: mt
  script: Latn
  content: '2014/86/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tat- 13
    ta’ Frar 2014 li temenda d-Deċiżjoni 93/195/KEE dwar il-kondizzjonijiet tas-saħħa
    tal-annimali u ċ-ċertifikazzjoni veterinarja għad-dħul mill-ġdid ta’ żwiemel
    reġistrati għal tlielaq, kompetizzjonijiet u avvenimenti kulturali wara l-esportazzjoni
    temporanja lejn il-Messiku u li temenda l-Anness I tad-Deċiżjoni 2004/211/KE
    fir-rigward tal-entrata tal-Messiku fil-lista ta’ pajjiżi terzi u partijiet
    minnhom minn fejn l-importazzjonijiet fl-Unjoni ta’ ekwidi ħajjin u ta’ semen,
    ova u embrijoni tal-ispeċi ekwina huma awtorizzati (notifikata bid-dokument C(2014)
    692)'
  type: main
- language: nl
  script: Latn
  content: '2014/86/EU: Uitvoeringsbesluit van de Commissie van 13 februari 2014 tot
    wijziging van Beschikking 93/195/EEG wat betreft veterinairrechtelijke voorschriften
    en veterinaire certificering voor het opnieuw binnenbrengen, na tijdelijke uitvoer
    naar Mexico, van geregistreerde paarden voor wedrennen, wedstrijden en culturele
    manifestaties en tot wijziging van bijlage I bij Beschikking 2004/211/EG wat betreft
    de gegevens over Mexico in de lijst van derde landen en delen van hun grondgebied
    waaruit de lidstaten de invoer toestaan van levende paardachtigen en sperma, eicellen
    en embryo’s van paarden (Kennisgeving geschied onder nummer C(2014) 692)'
  type: main
- language: pl
  script: Latn
  content: '2014/86/UE: Decyzja wykonawcza Komisji z dnia 13 lutego 2014 r. zmieniająca
    decyzję 93/195/EWG w odniesieniu do warunków dotyczących zdrowia zwierząt
    przy powrotnym wwozie zarejestrowanych koni przeznaczonych do udziału w wyścigach,
    zawodach i wydarzeniach kulturalnych po ich wywozie czasowym do Meksyku i zmieniająca
    załącznik I do decyzji 2004/211/WE w odniesieniu do wpisu dotyczącego Meksyku
    w wykazie państw trzecich oraz części ich terytoriów, z których dozwolony
    jest przywóz do Unii żywych zwierząt z rodziny koniowatych, nasienia, komórek
    jajowych i zarodków koni (notyfikowana jako dokument nr C(2014) 692)'
  type: main
- language: pt
  script: Latn
  content: '2014/86/UE: Decisão de Execução da Comissão, de 13 de fevereiro de
    2014 , que altera a Decisão 93/195/CEE no que diz respeito às condições sanitárias
    e de certificação veterinária para a reentrada de cavalos registados para corridas,
    concursos e acontecimentos culturais após exportação temporária para o México
    e que altera o anexo I da Decisão 2004/211/CE no que diz respeito à entrada
    relativa ao México na lista de países terceiros e partes de países terceiros
    a partir dos quais são autorizadas as importações para a União de equídeos
    vivos e de sémen, óvulos e embriões de equídeos [notificada com o número
    C(2014) 692]'
  type: main
- language: ro
  script: Latn
  content: '2014/86/UE: Decizia de punere în aplicare a Comisiei din 13 februarie
    2014 de modificare a Deciziei 93/195/CEE în ceea ce privește condițiile de
    sănătate animală și certificarea veterinară pentru reintroducerea cailor
    înregistrați pentru curse, competiții și evenimente culturale după exportul
    temporar în Mexic și de modificare a anexei I la Decizia 2004/211/CE în ceea
    ce privește rubrica referitoare la Mexic din lista țărilor terțe și a regiunilor
    acestora din care importurile în Uniune de ecvidee vii și de material seminal,
    de ovule și de embrioni din specia ecvină sunt autorizate [notificată cu numărul
    C(2014) 692]'
  type: main
- language: sk
  script: Latn
  content: '2014/86/EÚ: Vykonávacie rozhodnutie Komisie z 13. februára 2014 , ktorým
    sa mení rozhodnutie 93/195/EHS, pokiaľ ide o podmienky zdravia zvierat a veterinárnej
    certifikácie v súvislosti s opakovaným vstupom registrovaných koní určených
    na dostihy, súťaže a kultúrne podujatia po dočasnom vývoze do Mexika a ktorým
    sa mení príloha I k rozhodnutiu 2004/211/ES, pokiaľ ide o položku pre Mexiko
    v zozname tretích krajín a ich častí, z ktorých je povolený dovoz živých
    koňovitých a ich spermy, vajíčok a embryí [oznámené pod číslom C(2014)
    692]'
  type: main
- language: sl
  script: Latn
  content: '2014/86/EU: Izvedbeni sklep Komisije z dne 13. februarja 2014 o spremembi
    Odločbe 93/195/EGS glede pogojev v zvezi z zdravstvenim varstvom živali in izdajanjem
    veterinarskih spričeval za ponovni vstop registriranih konjev za dirke, tekmovanja
    in kulturne prireditve po začasnem izvozu v Mehiko ter o spremembi Priloge I
    k Odločbi 2004/211/ES glede vnosa za Mehiko na seznamu tretjih držav in njihovih
    delov, iz katerih je dovoljen uvoz živih enoprstih kopitarjev ter njihovega semena,
    jajčnih celic in zarodkov v Unijo (notificirano pod dokumentarno številko C(2014)
    692)'
  type: main
- language: es
  script: Latn
  content: '2014/86/UE: Decisión de Ejecución de la Comisión, de 13 de febrero
    de 2014 , que modifica la Decisión 93/195/CEE en lo relativo a las condiciones
    zoosanitarias y de certificación veterinaria necesarias para la reintroducción
    de caballos registrados para participar en carreras, concursos hípicos o actos
    culturales, después de su exportación temporal a México, y que modifica el
    anexo I de la Decisión 2004/211/CE en lo relativo a la entrada correspondiente
    a México de la lista de terceros países y partes de los mismos desde los que
    se autorizan importaciones en la Unión de équidos vivos y su esperma, sus óvulos
    y sus embriones [notificada con el número C(2014) 692]'
  type: main
- language: sv
  script: Latn
  content: '2014/86/EU: Kommissionens genomförandebeslut av den 13 februari 2014
    om ändring av beslut 93/195/EEG vad gäller djurhälsovillkor och villkor för
    utfärdande av veterinärintyg för återinförsel av hästar som registrerats
    för kapplöpningar, tävlingar och kulturevenemang, efter tillfällig export
    till Mexiko, och om ändring av bilaga I till beslut 2004/211/EG vad gäller posten
    för Mexiko i förteckningen över tredjeländer och delar av tredjeländer från
    vilka import till unionen av levande hästdjur och sperma, ägg och embryon från
    hästdjur är tillåten [delgivet med nr C(2014) 692]'
  type: main
