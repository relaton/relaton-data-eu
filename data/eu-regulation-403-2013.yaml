    endo-1,3(4)-beta-glucanase e endo-1,4-beta-glucanase produzida por Trichoderma
    reesei (ATCC 74444) como aditivo em alimentos para aves de capoeira de engorda
    e de postura e para leitões desmamados e que altera os Regulamentos (CE) n. °
    1259/2004, (CE) n. ° 1206/2005 e (CE) n. ° 1876/2006 (detentor da autorização:
