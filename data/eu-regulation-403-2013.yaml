    endo-1,3(4)-beta-glucanasa y endo-1,4-beta-glucanasa producido por Trichoderma
    reesei (ATCC 74444) como aditivo para la alimentación de aves de engorde y ponedoras
    y para lechones destetados, y por el que se modifican el Reglamento (CE) n °
    1259/2004, el Reglamento (CE) n ° 1206/2005 y el Reglamento (CE) n ° 1876/2006
    (titular de la autorización: DSM Nutritional Products)'
