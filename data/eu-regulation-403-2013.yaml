---
id: EURegulation4032013
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 403/2013 of 2 May 2013 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase, endo-1,3(4)-beta-glucanase
    and endo-1,4-beta-glucanase produced by Trichoderma reesei (ATCC 74444) as a feed
    additive for poultry for fattening and for laying and for weaned piglets and amending
    Regulations (EC) No 1259/2004, (EC) No 1206/2005 and (EC) No 1876/2006 (holder
    of authorisation DSM Nutritional Products)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) n ° 403/2013 de la Commission du 2 mai
    2013 concernant l’autorisation d’une préparation à base d’endo-1,4-bêta-xylanase,
    d’endo-1,3(4)-bêta-glucanase et d’endo-1,4-bêta-glucanase produites par
    Trichoderma reesei (ATCC 74444) comme additif dans l’alimentation des volailles
    d’engraissement et de ponte et des porcelets sevrés et modifiant les règlements
    (CE) n ° 1259/2004, (CE) n ° 1206/2005 et (CE) n ° 1876/2006 (titulaire de
    l’autorisation: DSM Nutritional Products)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 403/2013 der Kommission vom 2. Mai 2013
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase, Endo-1,3(4)-beta-Glucanase
    und Endo-1,4-beta-Glucanase aus Trichoderma reesei (ATCC 74444) als Futtermittelzusatzstoff
    für Mast- und Legegeflügel und abgesetzte Ferkel sowie zur Änderung der Verordnungen
    (EG) Nr. 1259/2004, (EG) Nr. 1206/2005 und (EG) Nr. 1876/2006 (Zulassungsinhaber
    DSM Nutritional Products)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 403/2013 на Комисията
    от 2 май 2013 година за разрешаване на употребата
    на препарат от ендо-1,4-бета-ксиланаза, ендо-1,3(4)-бета-глюканаза
    и ендо-1,4-бета-глюканаза, получен от Trichoderma reesei
    (ATCC 74444), като фуражна добавка за домашни птици
    за угояване и за кокошки носачки, както и за
    отбити прасенца и за изменение на регламенти
    (ЕО) № 1259/2004, (ЕО) № 1206/2005 и (ЕО) № 1876/2006 (притежател
    на разрешителното DSM Nutritional Products)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 403/2013 ze dne 2. května 2013
    o povolení přípravku z endo-1,4-beta-xylanázy, endo-1,3(4)-beta-glukanázy
    a endo-1,4-beta-glukanázy z Trichoderma reesei (ATCC 74444) jako doplňkové
    látky pro výkrm drůbeže, nosnice a pro odstavená selata a kterým se mění
    nařízení (ES) č. 1259/2004, (ES) č. 1206/2005 a (ES) č. 1876/2006 (držitel
    povolení DSM Nutritional Products)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 403/2013 af 2. maj 2013
    om godkendelse af et præparat af endo-1,4-beta-xylanase, endo-1,3(4)-beta-glucanase
    og endo-1,4-beta-glucanase produceret af Trichoderma reesei (ATCC 74444) som fodertilsætningsstof
    til slagtefjerkræ, æglæggende fjerkræ og fravænnede smågrise og om ændring
    af forordning (EF) nr. 1259/2004, (EF) nr. 1206/2005 og (EF) nr. 1876/2006 (indehaver
    af godkendelsen er DSM Nutritional products)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 403/2013
    της Επιτροπής, της 2ας Μαΐου 2013 , σχετικά με
    την έγκριση παρασκευάσματος ενδο-1,4-β-ξυλανάσης,
    ενδο-1,3(4)-β-γλυκανάσης και ενδο-1,4-β- γλυκανάσης
    που παράγεται από Trichoderma reesei (ATCC 74444) ως πρόσθετης
    ύλης ζωοτροφών για πουλερικά προς πάχυνση
    και ωοπαραγωγή καθώς και για απογαλακτισμένα
    χοιρίδια και για την τροποποίηση των κανονισμών
    (ΕΚ) αριθ. 1259/2004, (ΕΚ) αριθ. 1206/2005 και (ΕΚ) αριθ.
    1876/2006 (κάτοχος άδειας DSM Nutritional Products)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 403/2013, 2. mai 2013 , millega antakse
    luba Trichoderma reesei (ATCC 74444) abil saadud endo-1,4-β-ksülanaasi, endo-1,3(4)-β-glükanaasi
    ja endo-1,4-β-glükanaasi valmistise kasutamiseks nuumlindude ja munalindude
    ning võõrdepõrsaste söödalisandina ning muudetakse määrusi (EÜ) nr 1259/2004,
    (EÜ) nr 1206/2005 ja (EÜ) nr 1876/2006 (loa omanik DSM Nutritional Products)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 403/2013, annettu 2 päivänä
    toukokuuta 2013 , Trichoderma reesei (ATCC 74444) -organismin tuottaman endo-1,4-beeta-ksylanaasia,
    endo-1,3(4)-beeta-glukanaasia ja endo-1,4-beeta-glukanaasia sisältävän valmisteen
    hyväksymisestä lihasiipikarjan, munivan siipikarjan ja vieroitettujen porsaiden
    rehun lisäaineena sekä asetusten (EY) N:o 1259/2004, (EY) N:o 1206/2005 ja (EY)
    N:o 1876/2006 muuttamisesta (hyväksynnän haltija DSM Nutritional Products)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 403/2013 od 2. svibnja 2013. o odobrenju
    enzimskog pripravka endo-1,4-beta-ksilanaze, endo-1,3(4)-beta-glukanaze i endo-1,4-beta-glukanaze
    proizvedenog od Trichoderma reesei (ATCC 74444) kao dodatka hrani za životinje
    za perad za tov i nesenje i za odbijenu prasad i o izmjeni uredaba (EZ) br. 1259/2004,
    (EZ) br. 1206/2005 i (EZ) br. 1876/2006 (nositelj odobrenja DSM Nutritional Products)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság 403/2013/EU végrehajtási rendelete ( 2013. május 2. )
    a Trichoderma reesei (ATCC 74444) által termelt endo-1,4-béta-xilanázt, endo-1,3(4)-béta-glükanázt
    és endo-1,4-béta-glükanázt tartalmazó készítmény hízó- és tojóbaromfik,
    valamint elválasztott malacok takarmány-adalékanyagaként történő felhasználásának
    engedélyezéséről, valamint az 1259/2004/EK, az 1206/2005/EK és az 1876/2006/EK
    rendelet módosításáról (az engedély jogosultja: DSM Nutritional Products)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 403/2013 della Commissione, del 2 maggio
    2013 , relativo all’autorizzazione di un preparato di endo-1,4-beta-xilanasi,
    endo-1,3(4)-beta-glucanasi ed endo-1,4-beta-glucanasi prodotto da Trichoderma
    reesei (ATCC 74444) come additivo per mangimi destinati al pollame da ingrasso
    e da produzione di uova e a suinetti svezzati, recante modifica dei regolamenti
    (CE) n. 1259/2004, (CE) n. 1206/2005 e (CE) n. 1876/2006 (titolare dell’autorizzazione
    DSM Nutritional Products)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 403/2013 ( 2013. gada 2. maijs
    ), ar ko atļauj lietot endo-1,4-beta-ksilanāzes, endo-1,3(4)-beta-glikanāzes
    un endo-1,4-beta-glikanāzes preparātu, kas iegūts no Trichoderma reesei (ATCC
    74444), kā barības piedevu gaļas mājputniem, dējējputniem un atšķirtiem
    sivēniem un groza Regulu (EK) Nr. 1259/2004, (EK) Nr. 1206/2005 un (EK) Nr. 1876/2006
    (atļaujas turētājs – DSM Nutritional Products )
  type: main
- language: lt
  script: Latn
  content: 2013 m. gegužės 2 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 403/2013
    dėl leidimo naudoti endo-1,4-beta-ksilanazės, endo-1,3(4)-beta-gliukanazės
    ir endo-1,4-beta-gliukanazės, gautų iš Trichoderma reesei (ATCC 74444), preparatą
    kaip mėsinių naminių paukščių, dedeklių ir nujunkytų paršelių pašarų
    priedą, kuriuo iš dalies keičiami reglamentai (EB) Nr. 1259/2004, (EB) Nr.
    1206/2005 ir (EB) Nr. 1876/2006 (leidimo turėtojas – DSM Nutritional Products
    )
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 403/2013 tat-
    2 ta’ Mejju 2013 li jikkonċerna l-awtorizzazzjoni tal-preparazzjoni ta’ endo-1,4
    beta-ksilanażi, endo-1,3 (4) -beta-glukanażi u l-endo-1,4-beta-glukanażi prodotta
    minn Trichoderma reesei (ATCC 74444) bħala addittiv mal-għalf għat-tjur tal-irziezet
    għas-simna u biex ibidu u għall-ħnienes miftuma u li jemenda r-Regolamenti
    (KE) Nru 1259/2004, (KE) Nru 1206/2005 u (KE) Nru 1876/2006 (detentur tal-awtorizzazzjoni
    DSM Nutritional Products)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 403/2013 van de Commissie van 2 mei 2013
    tot verlening van een vergunning voor een preparaat van endo-1,4-bèta-xylanase,
    endo-1,3(4)-bèta-glucanase en endo-1,4-bèta-glucanase, geproduceerd door Trichoderma
    reesei (ATCC 74444), als toevoegingsmiddel voor diervoeding voor mest- en legpluimvee
    en gespeende biggen, en tot wijziging van de Verordeningen (EG) nr. 1259/2004,
    (EG) nr. 1206/2005 en (EG) nr. 1876/2006 (vergunninghouder DSM Nutritional Products)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) nr 403/2013 z dnia 2 maja 2013
    r. dotyczące zezwolenia na stosowanie preparatu z endo-1,4-beta-ksylanazy, endo-1,3(4)-beta-glukanazy
    i endo-1,4-beta-glukanazy wytwarzanych przez Trichoderma reesei (ATCC 74444) jako
    dodatku paszowego dla drobiu rzeźnego i nieśnego i dla prosiąt odstawionych
    od maciory oraz zmieniające rozporządzenia (WE) nr 1259/2004, (WE) nr 1206/2005
    i (WE) nr 1876/2006 (posiadacz zezwolenia: DSM Nutritional Products)'
  type: main
- language: pt
