    a endo-1,4- β -glukanáza produkované kmeňom Trichoderma reesei (ATCC 74444)
    ako kŕmne doplnkové látky pre hydinu chovanú na výkrm a znášku a pre odstavené
    prasiatka a ktorým sa menia nariadenia (ES) č. 1259/2004, (ES) č. 1206/2005
    a (ES) č. 1876/2006 (držiteľ povolenia DSM Nutritional Products)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 403/2013 z dne 2. maja 2013 o izdaji
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, endo-1,3(4)-beta-glukanaze
    in endo-1,4-beta-glukanaze, ki jih proizvaja Trichoderma reesei (ATCC 74444),
    kot krmni dodatek za perutnino za pitanje in nesnice ter za odstavljene pujske
    in o spremembi uredb (ES) št. 1259/2004, (ES) št. 1206/2005 in (ES) št. 1876/2006
    (imetnik dovoljenja DSM Nutritional Products)
  type: main
