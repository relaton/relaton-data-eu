type: standard
title:
- language: en
  script: Latn
  content: '79/405/EEC: Commission Decision of 30 March 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''woven breeches, shorts and trousers
    (including slacks) ; women''s, girls''and infants''woven trousers and slacks,
    of wool, cotton or man-made textile fibres, falling within heading No ex 61.01
    or subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.01-62,
    64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (category 6), originating in Hong Kong
    and in free circulation in the other Member States (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/405/CEE: Décision de la Commission, du 30 mars 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les culottes, "shorts" et pantalons, tissés
    pour hommes et garçonnets, pantalons tissés pour jeunes fillettes et jeunes
    enfants, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    de la position ex 61.01 et de la sous- position ex 61.02 B du tarif douanier commun
    (codes Nimexe: 61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68, 72) (catégorie 6),
    originaires de Hong-Kong et mis en libre pratique dans les autres États membres
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/405/EWG: Entscheidung der Kommission vom 30. März 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze Hosen und lange Hosen aus
    Geweben, für Männer und Knaben, lange Hosen aus Geweben, für Frauen, Mädchen
    und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen,
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-62, 64, 66, 72, 74, 76 - 61.02-66, 68, 72) (Kategorie 6) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/405/EØF: Kommissionens beslutning af 30. marts 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage shorts og andre korte benklæder til
    mænd og drenge, vævede, lange benklæder til kvinder, piger og småbørn, vævede
    af uld, bomuld eller syntetiske eller regenererede fibre, som henhører under
    pos. ex. 61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.01-62,
    64, 66, 72, 74, 76 ; 61.02-66, 68, 72 ; kategori 6), har oprindelse i Hongkong
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/405/CEE: Decisione della Commissione, del 30 marzo 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario calzoncini, shorts e pantaloni, tessuti
    per uomo e per ragazzo, pantaloni tessuti, per donna, per ragazza e per bambini,
    di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.01
    e della sottovoce ex 61.02 B della tariffa doganale comune (codici Nimexe 61.01-62,
    64, 66, 72, 74, 76; 61.02-66, 68, 72 - categoria 6), originari di Hong Kong e
    messi in libera pratica negli altri Stati membri (I testi in lingua francese e
    olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/405/EEG: Beschikking van de Commissie van 30 maart 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd shorts en andere korte broeken, lange broeken, geweven, voor
    heren en jongens, lange broeken voor dames, meisjes en kinderen van de posten
    ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-62,
    64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (categorie 6), van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
