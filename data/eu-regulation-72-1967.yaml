    applicabile all'esportazione di prodotti a base di latte conservato verso i paesi
    terzi, in casi particolari
  type: main
- language: nl
  script: Latn
  content: Verordening no. 72/67/EEG van de Commissie van 10 april 1967 houdende verlenging
