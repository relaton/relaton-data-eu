title:
- language: en
  script: Latn
  content: '93/349/EEC: Commission Decision of 9 March 1993 concerning aid provided
    by the United Kingdom Government to British Aerospace for its purchase of Rover
    Group Holdings over and above those authorized in Commission Decision 89/58/EEC
    authorizing a maximum aid to this operation subject to certain conditions (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/349/CEE: Décision de la Commission, du 9 mars 1993, concernant une
    aide accordée par le gouvernement britannique à British Aerospace pour l''acquisition
    par celle-ci du groupe Rover, dépassant les aides autorisées dans la décision
    89/58/CEE de la Commission fixant un plafond aux aides accordées pour cette opération
    ainsi que certaines conditions (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '93/349/EWG: Entscheidung der Kommission vom 9. März 1993 betreffend die
    Gewährung einer Beihilfe durch die Regierung des Vereinigten Königreichs für
    den Kauf der Rover Group Holdings durch British Aerospace, soweit damit die von
    der Kommission bedingt genehmigten Höchstgrenzen der Entscheidung 89/58/EWG überschritten
    wurden (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/349/EØF: Kommissionens beslutning af 9. marts 1993 om den støtte,
    som den britiske regering har ydet til British Aerospace i forbindelse med dette
    selskabs overtagelse af Rover Group Holdings, og som ligger ud over, hvad der
    blev godkendt i Kommissionens beslutning 89/58/EØF om godkendelse, på visse
    betingelser, af maksimumsstøtte til denne transaktion (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/349/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Μαρτίου
    1993 σχετικά με τη χορήγηση από την κυβέρνηση
    του Ηνωμένου Βασιλείου προς την British Aerospace ενίσχυσης
    για την εξαγορά της Rover Group Holdings η οποία υπερβαίνει
    το ποσό που εγκρίθηκε με την απόφαση 89/58/ΕΟΚ
    της Επιτροπής που επιτρέπει, υπό ορισμένες
