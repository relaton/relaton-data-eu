  type: main
- language: it
  script: Latn
  content: '93/349/CEE: Decisione della Commissione, del 9 marzo 1993, concernente
    gli aiuti concessi dal governo del Regno Unito a British Aerospace per l''acquisto
    di Rover Group Holdings in aggiunta agli aiuti autorizzati con la decisione 89/58/CEE
    della Commissione che ne stabiliva l''importo massimo e le condizioni cui erano
    subordinati (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/349/EEG: Beschikking van de Commissie van 9 maart 1993 betreffende
