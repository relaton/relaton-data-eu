    overschreden die goedgekeurd was bij Beschikking 89/58/EEG, waarbij de maximale
    steun voor deze operatie is goedgekeurd en bepaalde voorwaarden zijn opgelegd
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
