    της Ουγγαρίας και την Τσεχική και Σλοβακική
    Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 114/93 della Commissione, del 22 gennaio 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli di
    importazione presentate nel mese di gennaio 1993 per taluni prodotti del settore
    lattiero-caseari nel quadro del regime previsto dagli accordi interinali conclusi
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica
    federativa ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 114/93 van de Commissie van 22 januari 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector melk en zuivelprodukten, die in januari 1993
    zijn ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met de Republiek Polen, de Republiek Hongarije
    en de Tsjechische en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 114/93 da Comissão, de 22 de Janeiro de 1993, que
    determina a medida em que podem ser aceites os pedidos de licenças de importação,
    apresentados em Janeiro de 1993, para determinados produtos do sector do leite
    e dos produtos lácteos, no âmbito do regime previsto nos acordos provisórios
    concluídos pela Comunidade com a República da Polónia, a República da Hungria
    e a República Federativa Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 114/93 de la Comisión, de 22 de enero de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en enero de 1993, de algunos productos del sector
    de la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
    interinos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría y la República Federativa Checa y Eslovaca
