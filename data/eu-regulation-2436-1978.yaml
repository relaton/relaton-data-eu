  script: Latn
  content: Commission Regulation (EEC) No 2436/78 of 18 October 1978 re-establishing
    the levying of customs duties on chamois-dressed leather, falling within heading
    No 41.06, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2436/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux cuirs et
    peaux chamoisés, de la position tarifaire 41.06, originaires des pays en voie
    de développement, bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2436/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
