    di carni bovine disossate da taluni organismi d'intervento e destinate all'esportazione
    verso talune destinazioni e recante abrogazione del regolamento (CE) n. 3173/93
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3554/93 van de Commissie van 22 december 1993 betreffende
