  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2324/2003, annettu 17 päivänä joulukuuta 2003,
    muilla kuin asetuksessa (EY) N:o 1493/1999 säädetyillä viininvalmistusmenetelmillä
    mahdollisesti käsiteltyjen tiettyjen tuontiviinien sellaisenaan nautittavaksi
    tarjoamisen ja toimittamisen sallimisesta annetun asetuksen (EY) N:o 1037/2001
    muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 2324/2003 od 17. prosinca 2003. o izmjeni Uredbe
    (EZ) br. 1037/2001 o odobravanju ponude i isporuke za neposrednu prehranu ljudi
    određenih uvoznih vina koja su možda bila podvrgnuta enološkim postupcima koji
    nisu predviđeni Uredbom (EZ) br. 1493/1999
  type: main
- language: hu
  script: Latn
  content: A Tanács 2324/2003/EK rendelete (2003. december 17.) az 1493/1999/EK rendeletben
    nem szereplő borászati kezeléseken esetlegesen átesett importált borok közvetlen
    emberi fogyasztásra történő kínálatának és értékesítésének engedélyezéséről
    szóló 1037/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2324/2003 del Consiglio, del 17 dicembre 2003, recante
    modifica del regolamento (CE) n. 1037/2001 che autorizza l'offerta e la consegna
    per il consumo umano diretto di taluni vini importati che possono essere stati
    sottoposti a pratiche enologiche non previste dal regolamento (CE) n. 1493/1999
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2324/2003 (2003. gada 17. decembris), ar kuru groza
    Regulu (EK) Nr. 1037/2001, ar ko atļauj piedāvāt un piegādāt tiešam patēriņam
    pārtikā dažus importētus vīnus, kas, iespējams, ir bijuši pakļauti Regulā
    (EK) Nr. 1493/1999 neparedzētiem vīndarības procesiem
  type: main
- language: lt
  script: Latn
  content: 2003 m. gruodžio 17 d. Komisijos reglamentas (EB) Nr. 2324/2003, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 1037/2001 leidžiantį siūlyti ir tiekti tiesiogiai
    vartoti žmonėms kai kuriuos importuotus vynus, kuriems buvo taikomi vynininkystės
    procesai, nenumatyti Reglamente (EB) Nr. 1493/1999
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2324/2003 tas-17 ta’ Diċembru 2003
    li jemenda Regolament (KE) Nru 1037/2001 li jawtorizza l-offerta u t-tqassim għall-konsum
    uman ta’ ċertu inbid impurtat li seta’ għadda minn proċessi oenoloġiċi
    mhux prevvisti fir-Regolament (KE) Nru 1493/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2324/2003 van de Raad van 17 december 2003 tot wĳziging
    van Verordening (EG) nr. 1037/2001 houdende machtiging tot aanbieding of levering,
    voor rechtstreekse menselĳke consumptie, van bepaalde ingevoerde wĳnen waarop
    œnologische procédé's kunnen zĳn toegepast waarin niet is voorzien bĳ Verordening
    (EG) nr. 1493/1999
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2324/2003 z dnia 17 grudnia 2003 r. zmieniające
    rozporządzenie (WE) 1037/2001 zezwalające na oferowanie i dostarczanie do bezpośredniego
    spożycia przez ludzi niektórych przywożonych win, które mogły być poddane
    procesom enologicznym nieprzewidzianym w rozporządzeniu (WE) nr 1493/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2324/2003 do Conselho, de 17 de Dezembro de 2003,
    que altera o Regulamento (CE) n.° 1037/2001 que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de terem
    sido objecto de práticas enológicas não previstas no Regulamento (CE) n.°
    1493/1999
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2324/2003 al Consiliului din 17 decembrie 2003 de
    modificare a Regulamentului (CE) nr. 1037/2001 de autorizare a ofertei și livrării
    pentru consumul uman direct a anumitor vinuri importate care ar fi putut face
    obiectul unor procese oenologice neprevăzute de Regulamentul (CE) nr. 1493/1999
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2324/2003 zo 17. decembra 2003, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1037/2001 povoľujúce ponuku a dodávku určitých
    dovážaných vín na priamu ľudskú spotrebu, ktoré boli pravdepodobne enologicky
    spracované postupmi neustanovenými v nariadení (ES) č. 1493/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2324/2003 z dne 17. decembra 2003 o spremembi Uredbe
    (ES) št. 1037/2001 o odobritvi ponudbe in dobave za neposredno prehrano ljudi
    nekaterih uvoženih vin, ki so lahko bila obdelana z enološkimi postopki, ki
    niso predvideni v Uredbi (ES) št. 1493/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2324/2003 del Consejo, de 17 de diciembre de 2003,
    que modifica el Reglamento (CE) n° 1037/2001 por el que se autoriza la oferta
    y la entrega para el consumo humano directo de determinados vinos importados que
    pueden haber sido sometidos a prácticas enológicas no previstas en el Reglamento
    (CE) n° 1493/1999
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2324/2003 av den 17 december 2003 om ändring
    av förordning (EG) nr 1037/2001 om tillstånd för utbjudande och levererans
    för direkt konsumtion av vissa importerade viner som kan ha varit föremål för
    otillåtna oenologiska metoder enligt förordning (EG) nr 1493/1999
