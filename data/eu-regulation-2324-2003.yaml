title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2324/2003 of 17 December 2003 amending Regulation
    (EC) No 1037/2001 authorising the offer and delivery for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EC) No 1493/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2324/2003 du Conseil du 17 décembre 2003 modifiant
    le règlement (CE) n° 1037/2001 autorisant l'offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d'avoir fait l'objet de
    pratiques œnologiques non prévues par le règlement (CE) n° 1493/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2324/2003 des Rates vom 17. Dezember 2003 zur Änderung
    der Verordnung (EG) Nr. 1037/2001 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, dass sie Gegenstand von in der Verordnung (EG)
    Nr. 1493/1999 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2324/2003 на Съвета от 17 декември
    2003 година за изменение на Регламент (ЕО) № 1037/2001
    за разрешаване на предлагането и доставянето
    за пряка консумация от човека на някои вносни
    вина, които може да са били подложени на енологични
    практики, непредвидени в Регламент (ЕО) № 1493/1999
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2324/2003 ze dne 17. prosince 2003, kterým se
    mění nařízení (ES) č. 1037/2001, kterým se povoluje nabízení nebo dodávání
    některých dovážených vín, u nichž mohlo být použito enologických postupů
    nestanovených v nařízení (ES) č. 1493/1999, k přímé lidské spotřebě
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2324/2003 af 17. december 2003 om ændring
    af forordning (EF) nr. 1037/2001 om tilladelse til udbud eller afsætning til
    direkte konsum af visse indførte vine, som eventuelt har været underkastet andre
    ønologiske fremgangsmåder end de i forordning (EF) nr. 1493/1999 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2324/2003 του Συμβουλίου,
    της 17ης Δεκεμβρίου 2003, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1037/2001 που επιτρέπει
    την προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγόμενων οίνων στους
    οποίους μπορεί να έχουν χρησιμοποιηθεί οινολογικές
