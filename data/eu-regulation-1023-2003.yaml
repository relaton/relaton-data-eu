    την Αργεντινή, είτε δηλώνονται ως καταγωγής
    Αργεντινής είτε όχι, και για την περάτωση της
    έρευνας όσον αφορά τις εισαγωγές από έναν εισαγωγέα
    της Αργεντινής
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1023/2003, 13. juuni 2003, millega laiendatakse
    teatavate Brasiiliast pärinevate tempermalmist toruliitmike impordi ja teatavate
    Argentinast saadetavate tempermalmist toruliitmike impordi, olenemata sellest,
    kas päritolumaana on deklareeritud Argentina või mitte, impordi suhtes määrusega
