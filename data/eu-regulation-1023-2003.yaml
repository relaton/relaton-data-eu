    uurimine ühe Argentina eksportija impordi suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1023/2003, annettu 13 päivänä kesäkuuta 2003,
    tiettyjen Brasiliasta peräisin olevien tempervalurautaisten putkien liitos- ja
    muiden osien tuonnissa asetuksella (EY) N:o 1784/2000 käyttöön otetun lopullisen
    polkumyyntitullin laajentamisesta koskemaan tiettyjä Argentiinasta tuotavia tempervalurautaisia
    putkien liitos- ja muita osia riippumatta siitä, onko niiden alkuperämaaksi
    ilmoitettu Argentiina, ja yhden argentiinalaisviejän tuotteiden tuontia koskevan
    tutkimuksen päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 1023/2003/EK rendelete (2003. június 13.) az 1784/2000/EK rendelettel
    a Brazíliából származó egyes temperöntvény csőszerelvények vagy -illesztések
    behozatalára kivetett végleges dömpingellenes vámnak az Argentínában feladott
    egyes temperöntvény csőszerelvények vagy -illesztések behozatalára való
    kiterjesztéséről, függetlenül attól, hogy Argentínából származónak
    nyilvánították-e, valamint egy argentin exportőrtől származó behozatal
    tekintetében a vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1023/2003 del Consiglio, del 13 giugno 2003, che estende
    il dazio antidumping definitivo istituito con il regolamento (CE) n. 1784/2000
    sulle importazioni di alcuni accessori per tubi di ghisa malleabile originari
    del Brasile e sulle importazioni di alcuni accessori per tubi di ghisa malleabile
    spediti dall'Argentina, indipendentemente dal fatto che siano dichiarati originari
    dell'Argentina o meno, e chiude l'inchiesta in merito alle importazioni di un
    esportatore argentino
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1023/2003 (2003. gada 13. jūnijs), ar ko paplašina
    galīgo antidempinga maksājumu, kuru paredz Regula (EK) Nr. 1784/2000 par noteiktu
    Brazīlijas izcelsmes formējamā čuguna cauruļu veidgabalu jeb cauruļu veidgabalu
    importu vai no Argentīnas sūtītu formējamā čuguna cauruļu veidgabalu jeb
    cauruļu veidgabalu importu, neatkarīgi no tā, vai Argentīna ir norādīta
    kā to izcelsmes valsts, un aptur izmeklēšanu attiecībā uz importu no viena
    Argentīnas eksportētāja
  type: main
- language: lt
  script: Latn
  content: 2003 m. birželio 13 d. Tarybos Reglamentas (EB) Nr. 1023/2003 išplečiantis
    galutinį antidempingo muitą, įvestą Reglamentu (EB) Nr. 1784/2000, Brazilijos
    kilmės importuojamoms tam tikroms kaliojo ketaus vamzdžių arba vamzdelių jungiamosioms
    detalėms ir importuojamoms iš Argentinos siųstoms tam tikroms kaliojo ketaus
    vamzdžių arba vamzdelių jungiamosioms detalėms, deklaruotoms kaip Argentinos
    kilmės arba ne, ir nutraukiantis tyrimą dėl vieno Argentinos eksportuotojo
    importo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 1023/2003 tat-13 ta' Ġunju 2003 li
    jestendi d-dazju kontra d-dumping definittiv impost mir-Regolament (KE) Nru 1784/2000
    fuq l-importazzjoni ta' ċertu aċċessorji għal tubi u pajpijiet tal-ħadid
    imsammar li jista' jinħadem li joriġinaw mill-Brażil u fuq l-importazzjoni
    ta' ċertu aċċessorji għal tubi u pajpijiet tal-ħadid imsammar li jista' jinħadem
    kunsinnat mill-Arġentina, kemm jekk ikun dikjarat li ġej mill-Arġentina jew
    le, u li jtemm l-investigazzjoni dwar l-importazzjoni minn esportatur mill-Arġentina
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1023/2003 van de Raad van 13 juni 2003 tot uitbreiding
    van het definitieve antidumpingrecht dat bĳ Verordening (EG) nr. 1784/2000 werd
    ingesteld op hulpstukken van smeedbaar gietĳzer voor buisleidingen uit Brazilië
    tot dezelfde producten die vanuit Argentinië zĳn verzonden, al dan niet aangegeven
    als van oorsprong uit Argentinië, en tot beëindiging van het onderzoek ten aanzien
    van één Argentĳnse exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1023/2003 z dnia 13 czerwca 2003 r. rozszerzające
    ostateczne cło antydumpingowe nałożone rozporządzeniem (WE) nr 1784/2000 na
    przywóz niektórych rodzajów rur i kształtek rurowych z żeliwa ciągliwego
    pochodzących z Brazylii oraz na przywóz niektórych rodzajów rur i kształtek
    rurowych z żeliwa ciągliwego wysyłanych z Argentyny, zgłoszonych jako pochodzące
    z Argentyny lub nie, oraz kończące dochodzenie w odniesieniu do przywozu dokonywanego
    przez jednego eksportera z Argentyny
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1023/2003 do Conselho, de 13 de Junho de 2003, que
    torna o direito anti-dumping definitivo instituído pelo Regulamento (CE) n.°
    1784/2000 sobre as importações de certos acessórios para tubos de ferro fundido
    maleável originários do Brasil extensivo às importações de certos acessórios
    para tubos de ferro fundido maleável expedidos da Argentina, independentemente
    de serem declarados originários da Argentina, e que encerra o inquérito relativo
    a um exportador argentino
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1023/2003 z 13. júna 2003, ktorým sa rozširuje
    konečné antidumpingové clo uplatnené nariadením (ES) č. 1784/2000 na dovozy
    určitého príslušenstva na rúry a rúrky z kujnej liatiny, s pôvodom v Brazílii
    a na dovozy určitého príslušenstva na rúry a rúrky z kujnej liatiny, zasielaného
    z Argentíny, tiež deklarovaného ako výrobok s pôvodom v Argentíne, a ktorým
    sa ukončuje šetrenie vzhľadom na dovozy jedného argentínskeho vývozcu
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1023/2003 z dne 13. junija 2003 o razširitvi dokončne
    protidampinške dajatve, uvedene z Uredbo (ES) št. 1784/2000, pri uvozu nekaterega
    tempranega litoželeznega pribora (fitingov) za cevi s poreklom iz Brazilije in
    pri uvozu nekaterega tempranega litoželeznega pribora (fitingov) za cevi, poslanega
    iz Argentine, z oznako o poreklu iz Argentine ali brez, in o zaključku preiskave
    uvoza od argentinskega izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1023/2003 del Consejo, de 13 de junio de 2003, por
    el que se amplía el derecho antidumping definitivo establecido por el Reglamento
    (CE) n° 1784/2000 sobre las importaciones de accesorios de tubería de fundición
    maleable originarias de Brasil y sobre las importaciones de accesorios de tubería
    de fundición maleable procedentes de Argentina, hayan sido o no declaradas originarias
    de Argentina, y se da por concluida la investigación por lo que se refiere a
    las importaciones de un exportador argentino
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1023/2003 av den 13 juni 2003 om utvidgning
    av den slutgiltiga antidumpningstull som genom förordning (EG) nr 1784/2000 införts
    på import av vissa rördelar av aducerat gjutjärn med ursprung i Brasilien och
    på import av vissa rördelar av aducerat gjutjärn avsända från Argentina,
    oavsett om deras deklarerade ursprung är Argentina, och om avslutande av undersökningen
    avseende import från en argentinsk exportör
