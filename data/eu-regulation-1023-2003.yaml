title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1023/2003 of 13 June 2003 extending the definitive
    anti-dumping duty imposed by Regulation (EC) No 1784/2000 on imports of certain
    malleable cast iron tube or pipe fittings originating in Brazil and on imports
    of certain malleable cast iron tube or pipe fittings consigned from Argentina,
    whether declared as originating in Argentina or not, and terminating the investigation
    in respect of imports from one Argentinian exporter
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1023/2003 du Conseil du 13 juin 2003 portant extension
    du droit antidumping définitif institué par le règlement (CE) n° 1784/2000
    sur les importations de certains accessoires de tuyauterie en fonte malléable
    originaires du Brésil aux importations de certains accessoires de tuyauterie
    en fonte malléable expédiés d'Argentine, qu'ils aient ou non été déclarés
    originaires de ce pays, et clôturant l'enquête concernant un exportateur argentin
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1023/2003 des Rates vom 13. Juni 2003 zur Ausweitung
    des mit der Verordnung (EG) Nr. 1784/2000 eingeführten endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter Rohrformstücke aus verformbarem Gusseisen mit Ursprung
    in Brasilien auf die aus Argentinien versandten Einfuhren bestimmter Rohrformstücke
    aus verformbarem Gusseisen, als Ursprungserzeugnisse Argentiniens angemeldet oder
    nicht, und zur Einstellung der Untersuchung gegenüber den Einfuhren der Ware
    eines argentinischen Ausführers
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1023/2003 ze dne 13. června 2003, kterým se
    rozšiřuje konečné antidumpingové clo uložené nařízením (ES) č. 1784/2000
    na dovozy některých potrubních tvarovek z tvárné litiny pocházejících
    z Brazílie na dovozy některých potrubních tvarovek z tvárné litiny odesílaných
    z Argentiny, ať už jsou prohlášeny za pocházející z Argentiny či nikoliv,
    a kterým se zastavuje šetření týkající se dovozů od jednoho argentinského
    vývozce
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1023/2003 af 13. juni 2003 om udvidelse af
    den endelige antidumpingtold, der indførtes ved forordning (EF) nr. 1784/2000
    på importen af visse rørfittings af deformerbart støbejern med oprindelse i
    Brasilien, til også at omfatte importen af visse rørfittings af deformerbart
    støbejern afsendt fra Argentina, uanset om de er angivet med oprindelse i Argentina
    eller ej, og om afslutning af undersøgelsen vedrørende importen fra en argentinsk
    eksportør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1023/2003 του Συμβουλίου,
    της 13ης Ιουνίου 2003, για την επέκταση του οριστικού
    δασμού αντιντάμπινγκ που έχει επιβληθεί από
    τον κανονισμό (ΕΚ) αριθ. 1784/2000 στις εισαγωγές
    ορισμένων εξαρτημάτων σωληνώσεων από ελατό
    χυτοσίδηρο με σπείρωμα καταγωγής Βραζιλίας,
