title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 803/79 of 20 April 1979 amending Regulation
    (EEC) No 2036/74 fixing prices for the sale at reduced prices to certain institutions
    and bodies of a social character of hindquarters of adult bovine animals held
    by the intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 803/79 de la Commission, du 20 avril 1979, modifiant
    le règlement (CEE) n° 2036/74 fixant les prix de vente de quartiers arrière
    de gros bovins détenus par les organismes d' intervention à prix réduit à
    certaines institutions et collectivités à caractère social
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 803/79 der Kommission vom 20. April 1979 zur Änderung
    der Verordnung (EWG) Nr. 2036/74 zur Festsetzung der Preise für den Verkauf zu
    herabgesetzten Preisen der von den Interventionsstellen gelagerten Hinterviertel
    von ausgewachsenen Rindern an soziale Einrichtungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 803/79 af 20. april 1979 om ændring
    af forordning (EØF) nr. 2036/74 om fastsættelse af nedsatte salgspriser for
    bagfjerdinger af voksent kvæg, som interventionsorganerne ligger inde med, og
    som sælges til visse institutioner og organer med socialt formål
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 803/79 della Commissione, del 20 aprile 1979, che
    modifica il regolamento (CEE) n. 2036/74 che fissa i prezzi di vendita dei quarti
    posteriori di bovini adulti detenuti dagli organismi d' intervento, a prezzo ridotto,
    a determinate istituzioni ed enti di carattere sociale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 803/79 van de Commissie van 20 april 1979 houdende
    wijziging van Verordening (EEG) nr. 2036/74 tot vaststelling van de verkoopprijzen
    voor door de interventiebureaus opgeslagen achtervoeten van volwassen runderen
    in het kader van de verkoop tegen verlaagde prijs aan bepaalde instellingen en
    gemeenschappen zonder winstoogmerk
