  script: Latn
  content: Commission Implementing Regulation (EU) 2020/464 of 26 March 2020 laying
    down certain rules for the application of Regulation (EU) 2018/848 of the European
    Parliament and of the Council as regards the documents needed for the retroactive
    recognition of periods for the purpose of conversion, the production of organic
    products and information to be provided by Member States
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/464 de la Commission du 26 mars 2020
    portant certaines modalités d’application du règlement (UE) 2018/848 du Parlement
    européen et du Conseil en ce qui concerne les documents nécessaires à la reconnaissance
    rétroactive des périodes de conversion, la production de produits biologiques
    et les informations communiquées par les États membres
  type: main
- language: de
  script: Latn
