id: EUDecision20232392
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2392 of 3 October 2023 amending
    Implementing Decision (EU) 2022/2191 as regards harmonised standards for international
    mobile telecommunications cellular network equipment, transmitting equipment for
    digital audio broadcasting and digital radio mondiale services, very high frequency
    maritime survivor locating devices, and satellite earth stations and systems
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/2392 de la Commission du 3 octobre 2023
    modifiant la décision d’exécution (UE) 2022/2191 en ce qui concerne les normes
    harmonisées applicables à l’équipement de réseaux cellulaires de télécommunications
    mobiles internationales, à l’équipement de transmission pour le service de
    diffusion audionumérique et pour le service numérique de radiodiffusion mondiale,
    aux balises individuelles de géolocalisation en mer de faible puissance VHF,
    et aux systèmes et stations terriennes de communications par satellite
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/2392 der Kommission vom 3. Oktober 2023
    zur Änderung des Durchführungsbeschlusses (EU) 2022/2191 im Hinblick auf harmonisierte
    Normen für IMT-Geräte für zellulare Netze, sendertechnische Einrichtungen für
    den digitalen Ton-Rundfunkdienst (DAB) und sendertechnische Einrichtungen für
    den Digital-Radio-Mondiale-(DRM-)Ton-Rundfunkdienst, VHF-Seefunkbaken zur Suche
    von Überlebenden im Seeverkehr sowie Satelliten-Erdfunkstellen und -systeme
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/2392 на Комисията
    от 3 октомври 2023 година за изменение на Решение
    за изпълнение (ЕС) 2022/2191 по отношение на хармонизираните
    стандарти, приложими за оборудването на клетъчни
    мрежи за международни мобилни далекосъобщения,
    за предавателните съоръжения за цифрово радиоразпръскване
    и глобално цифрово радиоразпръскване, за морските
    устройства за метровия обхват за локализиране
    на оцелели и за земните станции и системи за
    връзка чрез спътник
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/2392 ze dne 3. října 2023,
    kterým se mění prováděcí rozhodnutí (EU) 2022/2191, pokud jde o harmonizované
    normy pro zařízení buňkové sítě mezinárodních mobilních telekomunikací,
    přenosové zařízení pro službu digitálního rozhlasového vysílání a
    služby celosvětového digitálního rozhlasového systému, námořní zařízení
    pro vyhledávání trosečníků provozovaná na velmi vysokých kmitočtech a
    družicové pozemské stanice a systémy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/2392 af 3. oktober 2023
    om ændring af gennemførelsesafgørelse (EU) 2022/2191 for så vidt angår harmoniserede
    standarder for udstyr til IMT-netværk, sendeudstyr til DAB-radiofoni, sendeudstyr
    til DRM-radiofoni, maritime VHF-laveffektradiofyr med DSC-kald samt satellitjordstationer
    og -systemer
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/2392 της Επιτροπής,
    της 3ης Οκτωβρίου 2023, για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2022/2191 όσον αφορά
    τα εναρμονισμένα πρότυπα για τον εξοπλισμό
    κυψελοειδούς δικτύου διεθνών κινητών τηλεπικοινωνιών,
    τον εξοπλισμό εκπομπής για υπηρεσίες ψηφιακής
    εκπομπής ήχου και την Παγκόσμια Υπηρεσία Ψηφιακής
    Ραδιοευρυεκπομπής, τις συσκευές εντοπισμού
    θαλάσσιων επιζώντων πολύ υψηλής συχνότητας,
    και τους δορυφορικούς επίγειους σταθμούς και
    συστήματα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/2392, 3. oktoober 2023, millega muudetakse
    rakendusotsust (EL) 2022/2191 seoses rahvusvahelise mobiilside kärgvõrgu seadmeid,
    digitaalse raadioringhäälingu ja digitaalse raadioringhäälingusüsteemi DRM
    (Digital Radio Mondiale) teenuste raadiosaateseadmeid, mereside VHF pääsenu
    asukoha määramise seadmeid (MSLD-seadmeid) ja satelliitside maajaamu ja süsteeme
    käsitlevate harmoneeritud standarditega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/2392, annettu 3 päivänä
    lokakuuta 2023, täytäntöönpanopäätöksen (EU) 2022/2191 muuttamisesta siltä
    osin kuin on kyse kansainvälisen matkaviestintäverkon laitteita, digitaalisten
    ääniyleisradiolähetysten ja digitaalisten yleisradiolähetysten jakeluun tarvittavia
    lähetyslaitteistoja, merenkulun henkilökohtaisia VHF-paikannuslähettimiä ja
    satelliittimaa-asemia ja -järjestelmiä koskevista yhdenmukaistetuista standardeista
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/2392 ón gCoimisiún an 3 Deireadh
    Fómhair 2023 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2022/2191 a mhéid
    a bhaineann le caighdeáin chomhchuibhithe maidir le trealamh líonra ceallaigh
    na teileachumarsáide móibílí idirnáisiúnta, trealamh tarchuir don tseirbhís
    craolta dhigitigh fuaime agus don tseirbhís raidió dhigitigh dhomhanda, gairis
    aimsithe marthanóirí muirí an-ardmhinicíochta, agus stáisiúin agus córais
    talún satailíte
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/2392 оd 3. listopada 2023. o izmjeni
    Provedbene odluke (EU) 2022/2191 u pogledu usklađenih normi za opremu za međunarodne
    mobilne telekomunikacijske celularne mreže, odašiljačku opremu za digitalnu
    audio radiodifuzijsku službu, odašiljačku opremu koja upotrebljava digitalni
    radijski standard, pomorske uređaje vrlo visoke frekvencije za lociranje preživjelih
    te satelitske zemaljske postaje i sustave
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2392 végrehajtási határozata (2023. október
    3.) az (EU) 2022/2191 végrehajtási határozatnak a nemzetközi mobiltávközlési
    cellás hálózati berendezésekre, a digitális hangműsorszóró szolgálat
    és a digitális világrádió szolgálatának adóberendezésére, a tengeri
    kis teljesítményű, VHF-sávú személyi helymeghatározó jeladókra, valamint
    a műholdas földi állomásokra és rendszerekre vonatkozó harmonizált szabványok
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2392 della Commissione, del 3 ottobre
    2023, che modifica la decisione di esecuzione (UE) 2022/2191 per quanto riguarda
    le norme armonizzate per le apparecchiature di reti cellulari di telecomunicazioni
    mobili internazionali, le apparecchiature trasmittenti per servizi di trasmissioni
    audio digitali e Digital Radio Mondiale, i segnalatori di localizzazione personale
    marittimi ad altissima frequenza e le stazioni e i sistemi satellitari terrestri
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/2392 (2023. gada 3. oktobris),
    ar ko Īstenošanas lēmumu (ES) 2022/2191 groza attiecībā uz saskaņotajiem
    standartiem starptautisko mobilo telesakaru šūnu tīkla iekārtām, ciparu skaņas
    apraides raidošajām iekārtām un DRM pakalpojumiem, jūrā izdzīvojušo atrašanās
    vietas noteikšanas ļoti augstas frekvences ierīcēm un satelītsakaru Zemes
    stacijām un sistēmām
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 3 d. Komisijos įgyvendinimo sprendimas (ES) 2023/2392,
    kuriuo dėl tarptautinio mobiliojo ryšio korinių tinklų įrangos, skaitmeninio
    radijo programų transliavimo tarnybos perdavimo ir pasaulinio skaitmeninio radijo
    įrangos, jūrinių labai aukšto dažnio asmeninių vietos nustatymo švyturių
    ir palydovinių Žemės stočių ir sistemų darniųjų standartų iš dalies
    keičiamas Įgyvendinimo sprendimas (ES) 2022/2191
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/2392 tat-3
    ta’ Ottubru 2023 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2022/2191
    fir-rigward tal-istandards armonizzati għat-tagħmir tan-networks ċellulari
    tat-telekomunikazzjoni mobbli internazzjonali, għat-tagħmir tat-trażmissjoni
    għas-servizzi tax-xandir awdjo diġitali u Digital Radio Mondiale, għall-apparati
    marittimi bi frekwenza għolja ħafna għal-lokalizzazzjoni tas-superstiti, u
    għal stazzjonijiet u sistemi terrestri satellitari
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2023/2392 van de Commissie van 3 oktober 2023 tot
    wijziging van Uitvoeringsbesluit (EU) 2022/2191 wat betreft geharmoniseerde normen
    voor apparatuur voor cellulaire netwerken voor internationale mobiele telecommunicatie,
    zendapparatuur voor de digitale radio-omroep en digitale mondiale radio-omroep,
    maritieme apparatuur met zeer hoge frequentie voor lokalisatie van overlevenden,
    en satellietgrondstations en -systemen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2023/2392 z dnia 3 października 2023 r.
    zmieniająca decyzję wykonawczą (UE) 2022/2191 w odniesieniu do norm zharmonizowanych
    dotyczących urządzeń sieci komórkowej międzynarodowej telekomunikacji ruchomej,
    urządzeń nadawczych naziemnej radiofonii cyfrowej (DAB) i systemu światowej
    radiofonii cyfrowej (DRM), morskich radiolatarni VHF do lokalizacji osobistej
    oraz naziemnych stacji i systemów satelitarnych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/2392 da Comissão, de 3 de outubro de
    2023, que altera a Decisão de Execução (UE) 2022/2191 no que diz respeito às
    normas harmonizadas para equipamentos de redes celulares de telecomunicações
    móveis internacionais, equipamentos transmissores para os serviços de radiodifusão
    áudio digital e do rádio digital mundial, balizas marítimas para localização
    de pessoas, operando em frequência muito alta, e estações e sistemas terrestres
    de satélites
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/2392 a Comisiei din 3 octombrie
    2023 de modificare a Deciziei de punere în aplicare (UE) 2022/2191 în ceea ce
    privește standardele armonizate pentru echipamentele pentru rețelele celulare
    de telecomunicații mobile internaționale, echipamentele de emisie pentru serviciul
    de radiodifuziune audio digitală și serviciul mondial de radiodifuziune sonoră
    digitală, dispozitivele maritime de localizare a supraviețuitorilor de frecvență
    foarte înaltă și stațiile și sistemele terestre prin satelit
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2023/2392 z 3. októbra 2023, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2022/2191, pokiaľ ide o harmonizované
    normy pre zariadenia bunkovej siete medzinárodnej mobilnej telekomunikácie,
    vysielacie zariadenia na digitálne rozhlasové vysielanie a zariadenia na vysielanie
    svetového digitálneho rozhlasu, vysokofrekvenčné námorné zariadenia na lokalizáciu
    preživších a družicové zemské stanice a systémy
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2023/2392 z dne 3. oktobra 2023 o spremembi
    Izvedbenega sklepa (EU) 2022/2191 glede harmoniziranih standardov za opremo za
    celična omrežja mednarodnih mobilnih telekomunikacij, oddajniško opremo za
    storitev digitalne zvokovne radiodifuzije in storitve svetovnega digitalnega radia,
    zelo visokofrekvenčne naprave za lociranje preživelih na morju ter satelitske
    zemeljske postaje in sisteme
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2023/2392 de la Comisión, de 3 de octubre
    de 2023, por la que se modifica la Decisión de Ejecución (UE) 2022/2191 en lo
    que se refiere a las normas armonizadas relativas a los equipos para redes celulares
    IMT (telecomunicaciones móviles internacionales), los equipos transmisores para
    el servicio de radiodifusión de audio digital y los servicios de Digital Radio
    Mondiale, las balizas marítimas de localización personal de muy alta frecuencia
    y las estaciones y sistemas terrestres por satélite
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2023/2392 av den 3 oktober 2023
    om ändring av genomförandebeslut (EU) 2022/2191 vad gäller harmoniserade standarder
    för utrustning för IMT mobilnät, sändarutrustning för marksänd digital ljudrundradio
    och Digital Radio Mondiale-tjänster, maritima låg effekt VHF personliga lokaliseringsfyrar
    samt satellitjordstationer och -system
