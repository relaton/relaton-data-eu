title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1085/85 of 26 April 1985 re-establishing
    the levying of customs duties on oxalic acid and its salts and esters falling
    within subheading 29.15 A I, originating in China, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1085/85 de la Commission du 26 avril 1985 portant rétablissement
    de la perception des droits de douane applicables à l' acide oxalique, ses sels
    et ses esters, de la sous-position 29.15 A I du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1085/85 der Kommission vom 26. April 1985 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester, der Tarifstelle
    29.15 A I mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1085/85 af 26. april 1985 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf henhørende under
    pos. 29.15 A I og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1085/85 της Επιτροπής
    της 26ης Απριλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για το οξαλικό οξύ, άλατα
    και εστέρες αυτού, της διακρίσεως 29.15 Α Ι του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1085/85 della Commissione del 26 aprile 1985 che ripristina
    la riscossione dei dazi doganali applicabili all' acido ossalico, suoi sali e
    suoi esteri, della sottovoce doganale 29.15 A I, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1085/85 van de Commissie van 26 april 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op oxaalzuur,
    alsmede zouten en esters daarvan, van postonderverdeling 29.15 A I, van oorsprong
    uit China, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
