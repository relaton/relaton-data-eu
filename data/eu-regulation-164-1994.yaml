    nach Tabakgruppen sowie der Garantieschwellen, verteilt nach Sortengruppen und
    Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 164/94 af 24. januar 1994 om ændring af forordning
