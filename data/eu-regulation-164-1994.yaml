    and the processing quotas allocated by group of varieties and by Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 164/94 du Conseil du 24 janvier 1994 modifiant le règlement
    (CEE) n° 2076/92 fixant les primes pour le tabac en feuilles par groupe de tabac
    ainsi que les seuils de garantie répartis par groupe de variétés par État
    membre
  type: main
