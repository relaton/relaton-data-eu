title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1534/87 of 2 June 1987 re-establishing the
    levying of customs duties on other woven fabrics of cotton, other than unbleached
    or bleached, products of category 2a (code 40.0024), originating in Indonesia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1534/87 de la Commission du 2 juin 1987 portant rétablissement
    de la perception des droits de douane applicables à d' autres tissus de coton,
    autres qu' écrus ou blanchis, de la catégorie de produits n° 2 a) (code 40.0024),
    originaires de l' Indonésie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1534/87 der Kommission vom 2. Juni 1987 zur Wiedereinführung
