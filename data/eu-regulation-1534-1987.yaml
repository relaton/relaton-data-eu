    dai greggi o imbianchiti della categoria di prodotti 2 a) (codice 40.0024), originari
    dell' Indonesia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1534/87 van de Commissie van 2 juni 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere weefsels
    van katoen, andere dan ongebleekt of gebleekt, van de categorie van produkten
    nr. 2 a) (codenummer 40.0024), van oorsprong uit Indonesië, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3925/86 van de
    Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1534/87 da Comissão de 2 de Junho de 1987 que restabelece
