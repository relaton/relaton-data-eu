    stoffer ublegede og blegede, under varekategori nr. 2 a) (kode 40.0024), som har
    oprindelse i Indonesien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
