    der Warenkategorie Nr. 2 a) (Kennziffer 40.0024) mit Ursprung in Indonesien, dem
    die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
