    chargé de la coordination de la sécurité sociale institué par l’accord de
    commerce et de coopération entre l’Union européenne et la Communauté européenne
    de l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et
    d’Irlande du Nord, d’autre part, en ce qui concerne la modification de certaines
    annexes du protocole en matière de coordination de la sécurité sociale
  type: main
