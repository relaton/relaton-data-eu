  script: Latn
  content: Council Decision (EU) 2024/2585 of 24 September 2024 on the position to
    be adopted on behalf of the European Union within the Specialised Committee on
    Social Security Coordination established by the Trade and Cooperation Agreement
    between the European Union and the European Atomic Energy Community, of the one
    part, and the United Kingdom of Great Britain and Northern Ireland, of the other
    part, as regards the amendment of certain Annexes to the Protocol on Social Security
    Coordination
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2585 du Conseil du 24 septembre 2024 relative à la
