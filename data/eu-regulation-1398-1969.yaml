title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1398/69 du Conseil, du 17 juillet 1969, reportant
    la date d'extension à toute la Communauté du champ d'application des certificats
    d'importation, d'exportation et de préfixation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1398/69 des Rates vom 17. Juli 1969 zur Verschiebung
    des Zeitpunkts, zu dem der Geltungsbereich der Einfuhr- und Ausfuhrlizenzen sowie
    der Bescheinigungen über die vorherige Festsetzung auf die gesamte Gemeinschaft
    ausgedehnt werden soll
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1398/69 del Consiglio, del 17 luglio 1969, che rinvia
    la data di estensione a tutta la Comunità del campo di applicazione dei titoli
    d'importazione e d'esportazione e dei certificati di fissazione anticipata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1398/69 van de Raad van 17 juli 1969 tot verschuiving
    van de datum waarop het toepassingsgebied van de invoer- en uitvoercertificaten
    en van de certificaten van vaststelling vooraf tot de gehele Gemeenschap zal worden
    uitgebreid
  type: main
