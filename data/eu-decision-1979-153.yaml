title:
- language: en
  script: Latn
  content: '79/153/EEC: Commission Decision of 21 December 1978 on the granting by
    the Guidance Section of the EAGGF to the Italian Republic of a payment on account
    in respect of expenditure incurred during 1976/77 on aids for the less-favoured
    farming areas (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/153/CEE: Décision de la Commission, du 21 décembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République italienne d''un acompte sur les dépenses
    effectuées pendant les années 1976 et 1977 pour les aides en faveur des zones
    agricoles défavorisées (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/153/EWG: Entscheidung der Kommission vom 21. Dezember 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die in den
    Jahren 1976/1977 in benachteiligten landwirtschaftlichen Gebieten gewährten Hilfen
    an die Italienische Republik (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/153/EØF: Kommissionens beslutning af 21. december 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den italienske Republik af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1976-1977 til støtte til ugunstigt
    stillede landbrugsområder (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/153/CEE: Decisione della Commissione, del 21 dicembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, alla Repubblica italiana
    di un anticipo sulle spese effettuate durante il 1976-1977 per gli aiuti in favore
    delle zone agricole svantaggiate (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/153/EEG: Beschikking van de Commissie van 21 december 1978 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan de Italiaanse Republiek
    van een voorschot in verband met de in 1976-77 verrichte uitgaven voor steun aan
    probleemgebieden in de landbouw (Slechts de tekst in de Italiaanse taal is authentiek)'
