    и на Съвета, както и на регламенти (ЕО) № 1726/1999,
    (ЕО) № 1916/2000, (ЕО) № 198/2006, (ЕО) № 1062/2008 и (ЕС) №
    349/2011 на Комисията по отношение на позоваванията
    на статистическата класификация на икономическите
    дейности NACE Rev. 2, установена с Регламент (ЕО)
    № 1893/2006 на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2025/447 ze dne 7. března 2025, kterým se mění
