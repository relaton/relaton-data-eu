title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2025/447 of 7 March 2025 amending Regulations
    (EC) No 2150/2002 and (EC) No 1552/2005 of the European Parliament and of the
    Council, as well as Commission Regulations (EC) No 1726/1999, (EC) No 1916/2000,
    (EC) No 198/2006, (EC) No 1062/2008 and (EU) No 349/2011, as regards references
    to the statistical classification of economic activities NACE Revision 2 established
    by Regulation (EC) No 1893/2006 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/447 de la Commission du 7 mars 2025 modifiant les
    règlements (CE) no 2150/2002 et (CE) no 1552/2005 du Parlement européen et du
    Conseil, ainsi que les règlements (CE) no 1726/1999, (CE) no 1916/2000, (CE)
    no 198/2006, (CE) no 1062/2008 et (UE) no 349/2011 de la Commission, en ce qui
    concerne les références à la nomenclature statistique des activités économiques
    NACE Rév. 2 établie par le règlement (CE) no 1893/2006 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2025/447 der Kommission vom 7. März 2025 zur Änderung
    der Verordnungen (EG) Nr. 2150/2002 und (EG) Nr. 1552/2005 des Europäischen Parlaments
    und des Rates sowie der Verordnungen (EG) Nr. 1726/1999, (EG) Nr. 1916/2000, (EG)
    Nr. 198/2006, (EG) Nr. 1062/2008 und (EU) Nr. 349/2011 der Kommission hinsichtlich
    der Verweise auf die mit der Verordnung (EG) Nr. 1893/2006 des Europäischen Parlaments
    und des Rates aufgestellte statistische Systematik der Wirtschaftszweige NACE
    Revision 2
  type: main
- language: bg
