    Rev. 2. rendszerére való hivatkozások tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2025/447 della Commissione, del 7 marzo 2025, che modifica
    i regolamenti (CE) n. 2150/2002 e (CE) n. 1552/2005 del Parlamento europeo e del
    Consiglio nonché i regolamenti (CE) n. 1726/1999, (CE) n. 1916/2000, (CE) n.
