    auf die Einfuhren bestimmter Buersten zum Auftragen von Anstrichfarben, Lack oder
    dergleichen mit Ursprung in der Volksrepublik China
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3453/88 af 4. november 1988 om ændring
