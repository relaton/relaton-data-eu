    w związku z przystąpieniem Bułgarii i Rumunii
  type: main
- language: pt
  script: Latn
  content: Directiva 2006/104/CE do Conselho, de 20 de Novembro de 2006 , que adapta
    determinadas directivas no domínio da agricultura (legislação veterinária
    e fitossanitária), em virtude da adesão da Bulgária e da Roménia
  type: main
- language: ro
  script: Latn
  content: Directiva 2006/104/CE a Consiliului din 20 noiembrie 2006 de adaptare a
    anumitor directive în domeniul agriculturii (legislație sanitar-veterinară
    și fitosanitară), ca urmare a aderării Bulgariei și a României
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2006/104/ES z 20. novembra 2006 , ktorou sa z dôvodu pristúpenia
    Bulharska a Rumunska upravujú určité smernice v oblasti poľnohospodárstva
    (veterinárnych a fytosanitárnych právnych predpisov)
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2006/104/ES z dne 20. novembra 2006 o prilagoditvi nekaterih
    direktiv na področju kmetijstva (vključno z veterinarsko in fitosanitarno zakonodajo)
    zaradi pristopa Bolgarije in Romunije
  type: main
- language: es
  script: Latn
  content: Directiva 2006/104/CE del Consejo, de 20 de noviembre de 2006 , por la
