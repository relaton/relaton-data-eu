title:
- language: en
  script: Latn
  content: Council Directive 2006/104/EC of 20 November 2006 adapting certain Directives
    in the field of agriculture (veterinary and phytosanitary legislation), by reason
    of the accession of Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Directive 2006/104/CE du Conseil du 20 novembre 2006 portant adaptation
    de certaines directives dans le domaine de l'agriculture (législation vétérinaire
    et phytosanitaire), en raison de l'adhésion de la République de Bulgarie et
    de la Roumanie
  type: main
- language: de
  script: Latn
  content: Richtlinie 2006/104/EG des Rates vom 20. November 2006 zur Anpassung bestimmter
    Richtlinien im Bereich Landwirtschaft (Veterinär- und Pflanzenschutzrecht) anlässlich
    des Beitritts Bulgariens und Rumäniens
  type: main
- language: bg
  script: Cyrl
  content: Директива 2006/104/ЕО на Съвета от 20 ноември
