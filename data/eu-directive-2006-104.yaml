    seoses Bulgaaria ja Rumeenia ühinemisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2006/104/EY, annettu 20 päivänä marraskuuta 2006
    , tiettyjen direktiivien mukauttamisesta maatalouden alalla (eläinlääkintä-
    ja kasvinsuojelulainsäädäntö) Bulgarian ja Romanian liittymisen johdosta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 2006/104/EZ od 20. studenoga 2006. o prilagodbi određenih
