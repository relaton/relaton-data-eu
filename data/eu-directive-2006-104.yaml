    законодателство) поради присъединяването
    на България и Румъния
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2006/104/ES ze dne 20. listopadu 2006 , kterou se z důvodu
    přistoupení Bulharska a Rumunska upravují některé směrnice v oblasti zemědělství
    (veterinární a rostlinolékařské předpisy)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2006/104/EF af 20. november 2006 om tilpasning af visse
    direktiver vedrørende landbrug (lovgivning på veterinær- og plantesundhedsområdet)
    på grund af Bulgariens og Rumæniens tiltrædelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 2006/104/ΕΚ του Συμβουλίου, της 20ής Νοεμβρίου
    2006 , για την προσαρμογή ορισμένων οδηγιών στον
    τομέα της γεωργίας (κτηνιατρική και φυτοϋγειονομική
    νομοθεσία), λόγω της προσχώρησης της Βουλγαρίας
    και της Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu Direktiiv 2006/104/EÜ, 20. november 2006 , millega kohandatakse
