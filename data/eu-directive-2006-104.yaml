    zbog pristupanja Bugarske i Rumunjske
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/104/EK irányelve ( 2006. november 20. ) a mezőgazdaság
    területén elfogadott egyes irányelveknek (állat- és növény-egészségügyi
    jogszabályok) Bulgária és Románia csatlakozására tekintettel történő
    kiigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/104/CE del Consiglio, del 20 novembre 2006 , che adegua
