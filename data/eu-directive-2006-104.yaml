  type: main
- language: nl
  script: Latn
  content: Richtlijn 2006/104/EG van de Raad van 20 november 2006 tot aanpassing van
    een aantal richtlijnen op het gebied van landbouw (veterinaire en fytosanitaire
    wetgeving), in verband met de toetreding van Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2006/104/WE z dnia 20 listopada 2006 r. dostosowująca niektóre
