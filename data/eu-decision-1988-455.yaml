    como sendo oficialmente indemnes de peste suína (Apenas faz fé o texto em língua
    neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '88/455/CEE: Decisión de la Comisión de 1 de julio de 1988 por la que
