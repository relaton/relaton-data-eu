title:
- language: en
  script: Latn
  content: '88/455/EEC: Commission Decision of 1 July 1988 amending Decision 87/492/EEC
    recognizing certain parts of the territory of the Netherlands as being officially
    swine fever free (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/455/CEE: Décision de la Commission du 1er juillet 1988 portant modification
    de la décision 87/492/CEE reconnaissant certaines parties du territoire du Royaume
    des Pays-Bas comme officiellement indemnes de la peste porcine (Le texte en langue
    néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/455/EWG: Entscheidung der Kommission vom 1. Juli 1988 zur Änderung
    der Entscheidung 87/492/EWG, durch die bestimmte Teile des Hoheitsgebiets der
    Niederlande amtlich als schweinepestfrei anerkannt werden (Nur der niederländische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/455/EØF: Kommissionens beslutning af 1. juli 1988 om ændring af beslutning
    87/492/EØF om anerkendelse af visse dele af Nederlandenes område som værende
    officielt fri for svinepest (Kun den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/455/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Ιουλίου
    1988 που τροποποιεί την απόφαση 87/492/ΕΟΚ σχετικά
    με την αναγνώριση ορισμένων τμημάτων του εδάφους
    των Κάτω Χωρών ως επίσημα απαλλαγμένων από
    την πανώλη των χοίρων (Το κείμενο στη ολλανδική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/455/CEE: Decisione della Commissione del 1° luglio 1988 recante modifica
    della decisione 87/492/CEE che riconosce ufficialmente indenni dalla peste suina
    alcune parti del territorio del Regno dei Paesi Bassi (Il testo in lingua olandese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/455/EEG: Beschikking van de Commissie van 1 juli 1988 tot wijziging
    van Beschikking 87/492/EEG waarbij bepaalde delen van het grondgebied van het
    Koninkrijk der Nederlanden als officieel vrij van varkenspest worden erkend (Slechts
