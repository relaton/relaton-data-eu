    for visse landbrugsprodukter, der udføres i form af varer, der ikke omfattes
    af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3409/73 della Commissione, del 17 dicembre 1973, che
    modifica il regolamento (CEE) n. 2637/70 per quanto riguarda la durata di validità
    dei prodotti agricoli esportati sotto forma di merci non comprese nell' allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3409/73 van de Commissie van 17 december 1973 houdende
    wijziging van Verordening (EEG) nr. 2637/70 voor wat betreft de geldigheidsduur
    van voorfixatiecertificaten voor bepaalde landbouwprodukten, uitgevoerd in de
    vorm van goederen die niet onder bijlage II van het Verdrag vallen
