  content: Regulation (EEC) No 3409/73 of the Commission of 17 December 1973 amending
    Regulation (EEC) No 2637/70 concerning the period of validity of advance fixing
    certificates for certain agricultural products exported in the form of goods not
    covered by Annex II of the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3409/73 de la Commission, du 17 décembre 1973, modifiant
    le règlement (CEE) n° 2637/70 en ce qui concerne la durée de validité des
    certificats de préfixation de certains produits agricoles exportés sous forme
    de marchandises ne relevant pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3409/73 der Kommission vom 17. Dezember 1973 zur Änderung
    der Verordnung (EWG) Nr. 2637/70 hinsichtlich der Gültigkeitsdauer der Vorausfestsetzungsbescheinigungen
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3409/73 af 17. december 1973 om ændring
