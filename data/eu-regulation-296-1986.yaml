- language: en
  script: Latn
  content: Commission Regulation (EEC) No 296/86 of 10 February 1986 on the implementation
    of the arrangements for inward processing, outward processing and processing under
    customs control in trade between Member States of the Community as constituted
    on 31 December 1985 and Spain or Portugal and also in trade between the two new
    Member States for such time as customs duties are levied in such trade
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 296/86 de la Commission du 10 février 1986 relatif
    à l' application des régimes de perfectionnement actif, de perfectionnement
    passif et de la transformation sous douane dans les échanges entre les États
    membres de la Communauté dans sa composition au 31 décembre 1985, d' une part,
    et l' Espagne ou le Portugal, d' autre part, ainsi que dans les échanges entre
    les deux nouveaux États membres, pendant la période durant laquelle des droits
    de douane sont perçus lors de ces échanges
  type: main
- language: de
  script: Latn
