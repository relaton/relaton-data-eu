  content: Regolamento (CEE) n. 296/86 della Commissione del 10 febbraio 1986 relativo
    all' applicazione dei regimi di perfezionamento attivo, di perfezionamento passivo
    e della trasformazione sotto controllo doganale negli scambi tra gli stati membri
    della Comunità nella sua composizione al 31 dicembre 1985, da una parte, e la
