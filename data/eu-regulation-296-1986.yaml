    am 31. Dezember 1985 einerseits und Spanien und Portugal andererseits sowie im
    Handel zwischen den beiden neuen Mitgliedstaaten, solange in diesem Handel Zölle
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 296/86 af 10. februar 1986 om anvendelse
