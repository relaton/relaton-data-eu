title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 367/82 of 17 February 1982 re-establishing
    the levying of customs duties on oxalic acid and its salts and esters, falling
    within subheading 29.15 A I and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 367/82 de la Commission, du 17 février 1982, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    oxalique, ses sels et ses esters, de la sous-position 29.15 A I du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 367/82 der Kommission vom 17. Februar 1982 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester, der Tarifstelle
    29.15 A I, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 367/82 af 17. februar 1982 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf, henhørende under
    pos. 29.15 A I og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 367/82 τής Επιτροπής τής
    17ης Φεβρουαρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τό οξαλικό οξύ, τά
    άλατα καί τούς εστέρες αυτού, τής διακρίσεως
    29. 15 Α Ι τού Κοινού Δασμολογίου, καταγωγής Κίνας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 367/82 della Commissione, del 17 febbraio 1982, che
    ripristina la riscossione dei dazi doganali applicabili all' acido ossalico, suoi
    sali e suoi esteri, della sottovoce 29.15 A I della tariffa doganale comune, originari
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 367/82 van de Commissie van 17 februari 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op oxaalzuur,
    alsmede zouten en esters daarvan, van post 29.15 A I, van oorsprong uit China
    waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
