    til Unionen af sendinger af bløddyr og krebsdyr bestemt til at blive holdt som
    pryddyr i lukkede anlæg og om fastlæggelse af listen over tredjelande eller
    territorier eller zoner eller kompartmenter deri, hvorfra det er tilladt at indføre
    sådanne sendinger til Unionen
  type: main
