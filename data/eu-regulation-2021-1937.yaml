  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1937 al Comisiei din 9 noiembrie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2021/404 în ceea
    ce privește intrarea în Uniune a transporturilor de moluște și de crustacee
    destinate a fi deținute în scopuri ornamentale în facilități închise și
    de stabilire a listei țărilor terțe, teritoriilor terțe, zonelor sau compartimentelor
    acestora din care este autorizată intrarea în Uniune a unor astfel de transporturi
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1937 z 9. novembra 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2021/404, pokiaľ ide o vstup zásielok
    mäkkýšov a kôrovcov do Únie, ktoré majú byť držané na okrasné účely
    v uzavretých zariadeniach, a ktorým sa stanovuje zoznam tretích krajín, alebo
    území alebo ich pásiem či kompartmentov, z ktorých je povolený vstup takýchto
    zásielok do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1937 z dne 9. novembra 2021 o spremembi
    Izvedbene uredbe (EU) 2021/404 glede vstopa pošiljk mehkužcev in rakov, namenjenih
    za gojenje v okrasne namene v zaprtih objektih, v Unijo ter o določitvi seznama
    tretjih držav ali ozemelj ali njihovih območij ali kompartmentov, iz katerih
    je dovoljen vstop takih pošiljk v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1937 de la Comisión de 9 de noviembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) 2021/404 en lo
    que respecta a la entrada en la Unión de partidas de moluscos y crustáceos destinados
    a ser mantenidos con fines ornamentales en instalaciones cerradas y se establece
    la lista de terceros países o territorios y zonas o compartimentos de ellos desde
    los que está autorizada la entrada en la Unión de tales partidas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1937 av den 9 november
    2021 om ändring av genomförandeförordning (EU) 2021/404 vad gäller införsel
    till unionen av sändningar av blötdjur och kräftdjur avsedda att hållas för
