title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1937 of 9 November 2021 amending
    Implementing Regulation (EU) 2021/404 as regards the entry into the Union of consignments
    of molluscs and crustaceans intended to be kept for ornamental purposes in closed
    facilities and laying down the list of third countries or territories, or the
    zones or compartments thereof from which the entry into the Union of such consignments
    is authorised
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1937 de la Commission du 9 novembre
    2021 modifiant le règlement d’exécution (UE) 2021/404 en ce qui concerne l’entrée
    dans l’Union d’envois de mollusques et de crustacés destinés à être détenus
    à des fins ornementales dans des installations fermées et établissant la liste
    des pays tiers ou territoires, ou des zones ou compartiments de pays tiers ou
    territoire, en provenance desquels l’entrée dans l’Union de tels envois est
    autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1937 der Kommission vom 9. November
    2021 zur Änderung der Durchführungsverordnung (EU) 2021/404 hinsichtlich des
    Eingangs von Sendungen mit Weich- und Krebstieren, die für geschlossene Systeme
    zu Zierzwecken bestimmt sind, in die Union sowie zur Festlegung der Liste der
    Drittländer oder Gebiete bzw. Zonen oder Kompartimente derselben, aus denen der
    Eingang solcher Sendungen in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/1937 на Комисията
    от 9 ноември 2021 година за изменение на Регламент
    за изпълнение (ЕС) 2021/404 по отношение на въвеждането
    в Съюза на пратки с мекотели и ракообразни,
    предназначени за отглеждане за декоративни
    цели в затворени съоръжения, и за установяване
    на списък на трети държави или територии или
    зони, или компартменти от тях, от които е разрешено
    въвеждането в Съюза на такива пратки
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/1937 ze dne 9. listopadu 2021,
    kterým se mění prováděcí nařízení (EU) 2021/404, pokud jde o vstup zásilek
    měkkýšů a korýšů určených k chovu pro okrasné účely v uzavřených
    zařízeních do Unie, a kterým se stanoví seznam třetích zemí nebo území
    nebo jejich oblastí či jednotek, z nichž je povolen vstup těchto zásilek
    do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1937 af 9. november 2021
