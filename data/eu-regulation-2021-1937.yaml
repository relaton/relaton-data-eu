  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/1937 оd 9. studenoga 2021. o izmjeni
    Provedbene uredbe (EU) 2021/404 u pogledu ulaska u Uniju pošiljaka mekušaca
    i rakova namijenjenih držanju za ukrasne svrhe u zatvorenim objektima te o utvrđivanju
    popisa trećih zemalja ili područja odnosno njihovih zona ili kompartmenata iz
    kojih je odobren ulazak takvih pošiljaka u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1937 végrehajtási rendelete (2021. november 9.)
    az (EU) 2021/404 végrehajtási rendeletnek a díszállatként, zárt létesítményben
    való tartásra szánt puhatestűek és rákfélék szállítmányainak az Unióba
    történő beléptetése, valamint az ilyen szállítmányok Unióba történő
    beléptetése vonatkozásában engedélyezett harmadik országokat és területeket,
    illetve azok körzeteit vagy kompartmentjeit felsoroló jegyzék megállapítása
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1937 della Commissione del 9 novembre
    2021 che modifica il regolamento di esecuzione (UE) 2021/404 per quanto riguarda
    l'ingresso nell'Unione di partite di molluschi e crostacei destinati a essere
    detenuti a scopo ornamentale in impianti chiusi e che stabilisce l'elenco di paesi
    terzi o territori o loro zone o loro compartimenti da cui è autorizzato l'ingresso
    nell'Unione di tali partite
  type: main
