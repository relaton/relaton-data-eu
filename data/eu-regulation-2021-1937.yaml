    tot wijziging van Uitvoeringsverordening (EU) 2021/404 wat betreft de binnenkomst
    in de Unie van zendingen week- en schaaldieren die bestemd zijn om voor sierdoeleinden
    in gesloten voorzieningen te worden gehouden, en tot vaststelling van de lijst
    van derde landen of gebieden, of zones of compartimenten daarvan, waaruit de binnenkomst
    in de Unie van dergelijke zendingen is toegestaan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/1937 z dnia 9 listopada 2021
    r. zmieniające rozporządzenie wykonawcze (UE) 2021/404 w odniesieniu do wprowadzania
    do Unii przesyłek mięczaków i skorupiaków przeznaczonych do utrzymywania do
    celów ozdobnych w obiektach zamkniętych oraz ustanawiające wykaz państw trzecich
    lub terytoriów bądź ich stref lub kompartmentów, z których dozwolone jest
    wprowadzanie takich przesyłek do Unii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/1937 da Comissão de 9 de novembro
    de 2021 que altera o Regulamento de Execução (UE) 2021/404 no que se refere
    à entrada na União de remessas de moluscos e crustáceos destinados a ser mantidos
    para fins ornamentais em instalações fechadas e que estabelece a lista de países
    terceiros ou territórios, ou das respetivas zonas ou compartimentos, a partir
    dos quais é autorizada a entrada na União de tais remessas
  type: main
