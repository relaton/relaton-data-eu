    moileasc agus crústach a theacht isteach san Aontas a bhfuil sé beartaithe iad
    a choimeád chun críoch ornáideachais i saoráidí dúnta agus lena leagtar
    síos liosta de thríú tíortha nó de chríocha, nó na de chriosanna nó de
    dheighleoga de thríú tír nó de chrios óna n-údaraítear na coinsíneachtaí
    sin a theacht isteach san Aontas
  type: main
