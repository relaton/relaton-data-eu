  script: Latn
  content: Commission Regulation (EEC) No 2818/87 of 21 September 1987 re-establishing
    the levying of customs duties on other regenerated cellulose falling within subheading
    39.03 B I b) originating in Brazil to which the tariff preferences set out in
    Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2818/87 de la Commission du 21 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux autres celluloses
    régénérées de la sous-position 39.03 B I b) du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
