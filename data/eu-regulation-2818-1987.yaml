    Tarifstelle 39.03 B I b) des Gemeinsamen Zolltarifs mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2818/87 af 21. september 1987 om genindførelse
