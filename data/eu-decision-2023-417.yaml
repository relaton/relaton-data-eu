    2023 relative à l’acceptation d’une demande présentée par les Pays-Bas
    et l’Allemagne, conformément à la directive (UE) 2016/797 du Parlement européen
    et du Conseil, de ne pas appliquer temporairement le point 4.2.5.1 «Communications
