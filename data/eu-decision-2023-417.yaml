  content: Commission Implementing Decision (EU) 2023/417 of 22 February 2023 accepting
    a request submitted by the Netherlands and Germany, pursuant to Directive (EU)
    2016/797 of the European Parliament and of the Council, not to apply temporarily
    point 4.2.5.1. ‘Radio communications with the train’ and point 4.2.8. ‘Key
    Management’ of the Annex to Commission Regulation (EU) 2016/919 for the eight
    trainsets FLIRT3 EMU3 Limburg MS (L-435) (notified under document C(2023) 1154)
    (Only the Dutch and German texts are authentic)
  type: main
