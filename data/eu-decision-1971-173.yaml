title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 avril 1971, autorisant la République
    italienne à exclure du traitement communautaire les jouets, de la position 97.03
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '71/173/EWG: Entscheidung der Kommission vom 5. April 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Spielzeuge aller Art der Position
    97.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/173/CEE: Decisione della Commissione, del 5 aprile 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i giocattoli,
    della voce 97.03 della tariffa doganale comune, originari del Giappone e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/173/EEG: Beschikking van de Commissie van 5 april 1971 waarbij de Italiaanse
    Republiek wordt gemachtigd speelgoed van post 97.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
