  content: Council Regulation (EC) No 1811/2002 of 24 September 2002 amending Regulation
    (EC) No 2555/2001 fixing for 2002 the fishing opportunities and associated conditions
    for certain fish stocks and groups of fish stocks, applicable in Community waters
    and, for Community vessels, in waters where limitations in catch are required
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1811/2002 du Conseil du 24 septembre 2002 modifiant
