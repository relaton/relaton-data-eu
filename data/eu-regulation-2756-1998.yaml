title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2756/98 of 18 December 1998 opening Community
    tariff quotas for 1999 for sheep, goats, sheepmeat and goatmeat falling within
    CN codes 0104 10 30, 0104 10 80, 0104 20 10, 0104 20 90 and 0204 and derogating
    from Regulation (EC) No 1439/95 laying down detailed rules for the application
    of Council Regulation (EC) No 2467/98 as regards the import and export of products
    in the sheepmeat and goatmeat sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2756/98 de la Commission du 18 décembre 1998 portant
    ouverture de contingents tarifaires communautaires au titre de 1999 pour les animaux
    vivants des espèces ovine et caprine et pour la viande des animaux des espèces
    ovine et caprine relevant des codes NC 0104 10 30, 0104 10 80, 0104 20 10, 0104
    20 90 et 0204, et portant dérogation au règlement (CE) nº 1439/95 établissant
    les modalités d'application du règlement (CEE) nº 2467/98 du Conseil en ce
    qui concerne l'importation et l'exportation de produits du secteur des viandes
    ovine et caprine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2756/98 der Kommission vom 18. Dezember 1998 zur Eröffnung
    von Gemeinschaftszollkontingenten für Schafe und Ziegen sowie Schaf- und Ziegenfleisch
    der KN-Codes 0104 10 30, 0104 10 80, 0104 20 10, 0104 20 90 und 0204 für 1999
    sowie zur Abweichung von der Verordnung (EG) Nr. 1439/95 zur Durchführung der
    Verordnung (EG) Nr. 2467/98 des Rates hinsichtlich der Einfuhr und Ausfuhr von
    Schaf- und Ziegenfleischerzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2756/98 af 18. december 1998 om åbning
