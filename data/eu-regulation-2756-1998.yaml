    under KN-kode 0104 10 30, 0104 10 80, 0104 20 10, 0104 20 90 og 0204 og om undtagelse
    fra forordning (EF) nr. 1439/95 om gennemførelsesbestemmelser til Rådets forordning
    (EF) nr. 2467/98 for så vidt angår indførsel og udførsel af fåre- og gedekød
  type: main
- language: el
  script: Grek
