    1999 όσον αφορά αιγοπρόβατα και κρέας αιγοπροβάτων
    που εμπίπτουν στους κωδικούς ΣΟ 0104 10 30, 0104 10
    80, 0104 20 10, 0104 20 90 και 0204 και κατά παρέκκλιση από
