    omfattas av KN-nummer 0104 10 30, 0104 10 80, 0104 20 10, 0104 20 90 och 0204
    och om undantag från förordning (EG) nr 1439/95 om tillämpningsföreskrifter
    för rådets förordning (EG) nr 2467/98 beträffande import och export av produkter
    inom sektorn för får- och getkött
