    e as carnes de ovino e caprino dos códigos NC 0104 10 30, 0104 10 80, 0104 20
    10, 0104 20 90 e 0204 e derroga o Regulamento (CE) nº 1439/95 que estabelece
    normas de execução do Regulamento (CE) nº 2467/98 do Conselho no que respeita
    à importação e exportação de produtos do sector das carnes de ovino e caprino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2756/98 de la Comisión de 18 de diciembre de 1998
    por el que se abren contingentes arancelarios comunitarios de ganado ovino y caprino
    y de carne de ovino y caprino de los códigos NC 0104 10 30, 0104 10 80, 0104
    20 10, 0104 20 90 y 0204 para 1999 y se establecen excepciones al Reglamento (CE)
    nº 1439/95 por el que se establecen disposiciones de aplicación del Reglamento
    (CE) nº 2467/98 del Consejo en lo relativo a la importación y exportación de
    productos del sector de la carne de ovino y caprino
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2756/98 av den 18 december 1998 om öppnande
