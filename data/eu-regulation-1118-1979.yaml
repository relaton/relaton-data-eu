title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1118/79 of 6 June 1979 supplementing, as
    regards seeds, Regulation (EEC) No 193/75 laying down common detailed rules for
    the application of the system of import and export licences and advance fixing
    certificates for agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1118/79 de la Commission, du 6 juin 1979, complétant,
    en ce qui concerne les semences, le règlement (CEE) n° 193/75 portant modalités
    communes d' application du régime de certificats d' importation, d' exportation
    et de préfixation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1118/79 der Kommission vom 6. Juni 1979 zur Ergänzung
    der Verordnung (EWG) Nr. 193/75 über gemeinsame Durchführungsvorschriften für
    Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für landwirtschaftliche
    Erzeugnisse in bezug auf Saatgut
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1118/79 af 6. juni 1979 om supplering
    - for så vidt angår frø - af forordning (EØF) nr. 193/75 om fælles gennemførelsesbestemmelser
    for import- og eksportlicenser samt forudfastsættelsesattester for landbrugsvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1118/79 τής Επιτροπής
    τής 6ης Ιουνίου 1979 περί συμπληρώσεως, όσον αφορά
    τούς σπόρους πρός σπορά, τού κανονισμού (ΕΟΚ)
    αριθ. 193/75 «περί τών κοινών λεπτομερειών εφαρμογής
    τού καθεστώτος πιστοποιητικών εισαγωγής, εξαγωγής
    καί προκαθορισμού γιά τά γεωργικά προϊόντα»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1118/79 della Commissione, del 6 giugno 1979, che
    completa, per quanto riguarda le sementi, il regolamento (CEE) n. 193/75, che
    stabilisce le modalità comuni d' applicazione del regime dei titoli d' importazione,
    d' esportazione e di fissazione anticipata relativi ai prodotti agricoli
  type: main
- language: nl
