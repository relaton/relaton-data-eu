id: EURegulation7211977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 721/77 of 4 April 1977 re-establishing the
    levying of customs duties on nets and netting made of twine, etc., falling within
    heading No 59.05, originating in the Philippines to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 721/77 de la Commission, du 4 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    fabriqués à l'aide des matières reprises au n° 59.04, en nappes, etc. de la
    position tarifaire 59.05, originaires des Philippines bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 721/77 der Kommission vom 4. April 1977 über die
    Wiedereinführung des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in
    Stücken, als Meterware oder abgepaßt; usw., der Tarifnummer 59.05, mit Ursprung
    in den Philippinen, denen die in der Verordnung (EWG) Nr. 3022/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 721/77 af 4. april 1977 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    også i tilskårne stykker eller konfektionerede, etc, under position 59.05, som
    har oprindelse i Philippinerne og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 721/77 della Commissione, del 4 aprile 1977, che ripristina
    la riscossione dei dazi doganali applicabili alle reti, ottenute con l'impiego
    di manufatti previsti dalla voce 59.04, in strisce, ecc., della voce doganale
    59.05, originarie delle Filippine, beneficiarie delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 721/77 van de Commissie van 4 april 1977 houdende
    wederinstelling van de heffingen van de douanerechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, enz., van post 59.05,
    van oorsprong uit de Filippijnen, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3022/76 van de Raad
  type: main
