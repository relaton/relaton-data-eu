id: EUDecision197316
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 February 1973 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to cutlery, spoons and forks of stainless steel falling within
    headings Nos ex 82.09 and 82.14 A of the Common Customs Tariff, originating in
    Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/16/CEE de la Commission, du 14 février 1973, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les couteaux et les couverts en acier inoxydable,
    des positions Ex 82.09 et 82.14 A du Tarif douanier commun, originaires du Japon
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Februar 1973, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Messer und Bestecke aus rostfreiem Stahl der Tarifnummern ex 82.09
    und 82.14 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. februar 1973 om bemyndigelse for kongeriget
    Belgien, strohertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage knive og gafler af rustfrit stål, som henhører under position ex
    82.09 og 82.14 A i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 febbraio 1973, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i coltelli e le posate di acciaio inossidabile delle
    voci ex 82.09 e 82.14 A della tariffa doganale comune, originari del Giappone,
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 februari 1973 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd messen en bestekken van roestvrij staal van de posten ex 82.09 en 82.14
    A van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
