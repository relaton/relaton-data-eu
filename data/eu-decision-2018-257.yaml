    с предоставянето на статистически данни по
    реда на Регламент (ЕО) № 1338/2008 на Европейския
    парламент и на Съвета, по отношение на статистическите
    данни, основаващи се на Европейската система
    за здравни интервюта (EHIS) (нотифицирано под
    номер С(2018) 832)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/257 ze dne 19. února 2018, kterým
    se některým členským státům povolují odchylky týkající se předávání
    statistik podle nařízení Evropského parlamentu a Rady (ES) č. 1338/2008,
    pokud jde o statistiky vycházející z evropského dotazníkového šetření
    o zdraví (EHIS) (oznámeno pod číslem C(2018) 832)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/257 af 19. februar 2018
    om indrømmelse af undtagelser for visse medlemsstater med hensyn til fremsendelse
    af statistikker i henhold til Europa-Parlamentets og Rådets forordning (EF) nr.
    1338/2008 for så vidt angår statistikker baseret på interviewundersøgelsen
    vedrørende sundhed i EU (EHIS) (meddelt under nummer C(2018) 832)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/257 της Επιτροπής,
    της 19ης Φεβρουαρίου 2018, για τη χορήγηση παρεκκλίσεων
    σε ορισμένα κράτη μέλη ως προς τη διαβίβαση
    στατιστικών σύμφωνα με τον κανονισμό (ΕΚ) αριθ.
