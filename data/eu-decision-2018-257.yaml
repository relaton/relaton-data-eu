    dokumentu Nr. C(2018) 832)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/257 tad-19 ta'
    Frar 2018 dwar l-għoti ta' derogi lil ċerti Stati Membri fir-rigward tat-trażmissjoni
    tal-istatistika skont ir-Regolament (KE) Nru 1338/2008 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tal-istatistika msejsa fuq l-Istħarriġ b'Intervista
    dwar is-Saħħa Ewropea (EHIS) (notifikata bid-dokument C(2018) 832)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/257 van de Commissie van 19 februari 2018
    waarbij aan bepaalde lidstaten afwijkingen worden toegestaan ten aanzien van de
    indiening van statistieken overeenkomstig Verordening (EG) nr. 1338/2008 van het
    Europees Parlement en de Raad, wat de statistieken op basis van de European Health
    Interview Survey (EHIS) betreft (Kennisgeving geschied onder nummer C(2018) 832)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/257 z dnia 19 lutego 2018 r. w sprawie
    przyznania niektórym państwom członkowskim odstępstw dotyczących przekazywania
    statystyk na podstawie rozporządzenia Parlamentu Europejskiego i Rady (WE) nr
    1338/2008 w odniesieniu do statystyk sporządzonych na podstawie Europejskiego
    Ankietowego Badania Zdrowia (EHIS) (notyfikowana jako dokument nr C(2018) 832)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/257 da Comissão, de 19 de fevereiro de
    2018, que concede derrogações a certos Estados-Membros relativamente à transmissão
    de estatísticas nos termos do Regulamento (CE) n.° 1338/2008 do Parlamento Europeu
    e do Conselho, no que se refere às estatísticas baseadas no inquérito europeu
    de saúde por entrevista (EHIS) [notificada com o número C(2018) 832]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/257 a Comisiei din 19 februarie
    2018 de acordare a unor derogări anumitor state membre în ceea ce privește
    transmiterea de statistici în temeiul Regulamentului (CE) nr. 1338/2008 al Parlamentului
    European și al Consiliului în ceea ce privește statisticile bazate pe Ancheta
    europeană de sănătate realizată prin interviu (EHIS) [notificată cu numărul
    C(2018) 832]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/257 z 19. februára 2018, ktorým
    sa určitým členským štátom udeľujú výnimky týkajúce sa prenosu štatistiky
    podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1338/2008, pokiaľ ide
    o štatistiku založenú na európskom zisťovaní o zdraví formou rozhovoru
    (EHIS – European Health Interview Survey) [oznámené pod číslom C(2018) 832]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/257 z dne 19. februarja 2018 o odobritvi
    odstopanj nekaterim državam članicam glede sporočanja statističnih podatkov
    v skladu z Uredbo (ES) št. 1338/2008 Evropskega parlamenta in Sveta glede statističnih
    podatkov, ki temeljijo na Evropski anketi o zdravju in zdravstvenem varstvu (EHIS)
    (notificirano pod dokumentarno številko C(2018) 832)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/257 de la Comisión, de 19 de febrero
