title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/257 of 19 February 2018 granting
    derogations to certain Member States with respect to the transmission of statistics
    pursuant to Regulation (EC) No 1338/2008 of the European Parliament and of the
    Council, as regards statistics based on the European Health Interview Survey (EHIS)
    (notified under document C(2018) 832)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/257 de la Commission du 19 février 2018
    accordant des dérogations à certains États membres en ce qui concerne la transmission
    de statistiques en vertu du règlement (CE) n° 1338/2008 du Parlement européen
    et du Conseil, pour ce qui est des statistiques fondées sur l'enquête européenne
    par interview sur la santé (EHIS) [notifiée sous le numéro C(2018) 832]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/257 der Kommission vom 19. Februar 2018
    zur Gewährung von Ausnahmeregelungen für bestimmte Mitgliedstaaten bezüglich
    der Übermittlung von Statistiken gemäß der Verordnung (EG) Nr. 1338/2008 des
    Europäischen Parlaments und des Rates in Bezug auf Statistiken auf der Grundlage
    der Europäischen Gesundheitsbefragung (EHIS) (Bekannt gegeben unter Aktenzeichen
    C(2018) 832)
  type: main
- language: bg
  script: Cyrl
