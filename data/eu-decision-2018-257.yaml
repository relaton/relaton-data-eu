    podataka u skladu s Uredbom (EZ) br. 1338/2008 Europskog parlamenta i Vijeća
    s obzirom na statističke podatke Europske ankete o zdravlju (EHIS) (priopćeno
    pod brojem dokumenta C(2018) 832)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/257 végrehajtási határozata (2018. február 19.)
    az 1338/2008/EK európai parlamenti és tanácsi rendelet szerinti statisztikai
    adatszolgáltatásra vonatkozóan egyes tagállamok számára az európai egészségfelmérésen
    alapuló statisztikák tekintetében eltérések engedélyezéséről (az értesítés
    a C(2018) 832. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/257 della Commissione, del 19 febbraio
    2018, che accorda ad alcuni Stati membri deroghe in merito alla trasmissione di
    statistiche a norma del regolamento (CE) n. 1338/2008 del Parlamento europeo e
    del Consiglio per quanto riguarda le statistiche basate sull'indagine europea
    sulla salute condotta mediante interviste (EHIS) [notificata con il numero C(2018)
    832]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/257 (2018. gada 19. februāris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1338/2008 konkrētām
    dalībvalstīm piešķir atkāpes attiecībā uz tādas statistikas nosūtīšanu,
    kas balstās uz Eiropas veselības aptauju apsekojumu (EHIS) (izziņots ar dokumenta
    numuru C(2018) 832)
  type: main
- language: lt
  script: Latn
  content: 2018 m. vasario 19 d. Komisijos įgyvendinimo sprendimas (ES) 2018/257,
