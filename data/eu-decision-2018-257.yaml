    om beviljande av undantag för vissa medlemsstater beträffande inrapporteringen
    av statistik i enlighet med Europaparlamentets och rådets förordning (EG) nr
    1338/2008, vad gäller statistik som grundas på den europeiska hälsoenkäten
    [delgivet med nr C(2018) 832]
