id: EUDecision1998275
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '98/275/EC: Council Decision of 21 April 1998 authorising the Kingdom of
    the Netherlands to apply to certain mineral oils when used for specific purposes
    reductions in or exemptions from excise duty, in accordance with the procedure
    provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '98/275/CE: Décision du Conseil du 21 avril 1998 autorisant le Royaume
    des Pays-Bas à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques des réductions ou des exonérations d''accises
    conformément à la procédure prévue à l''article 8, paragraphe 4, de la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '98/275/EG: Entscheidung des Rates vom 21. April 1998 zur Ermächtigung
    des Königreichs der Niederlande, gemäß dem Verfahren des Artikels 8 Absatz
    4 der Richtlinie 92/81/EWG für Mineralöle mit bestimmten Verwendungszwecken
    Verbrauchsteuerbefreiungen oder -ermäßigungen einzuführen'
  type: main
- language: da
  script: Latn
  content: '98/275/EF: Rådets beslutning af 21. april 1998 om at give Kongeriget
    Nederlandene tilladelse til i overensstemmelse med proceduren i artikel 8, stk.
    4, i direktiv 92/81/EØF at anvende reducerede punktafgiftssatser eller punktafgiftsfritagelser
    for bestemte mineralolier, der anvendes til særlige formål'
  type: main
- language: el
  script: Grek
  content: '98/275/ΕΚ: Απόφαση του Συμβουλίου της 21ης
    Απριλίου 1998 που εξουσιοδοτεί το Βασίλειο των
    Κάτω Χωρών, με τη διαδικασία του άρθρου 8 παράγραφος
    4 της οδηγίας 92/81/ΕΟΚ, να εφαρμόσει ή να συνεχίσει
    να εφαρμόζει μειωμένους συντελεστές ειδικών
    φόρων κατανάλωσης ή απαλλαγές εξ αυτών για
    ορισμένα πετρελαιοειδή ειδικού σκοπού'
  type: main
- language: fi
  script: Latn
  content: '98/275/EY: Neuvoston päätös, tehty 21 päivänä huhtikuuta 1998, luvan
    antamisesta Alankomaiden kuningaskunnalle soveltaa valmisteveron alennuksia tai
    valmisteverovapautuksia tiettyihin erityistarkoituksiin käytettyihin kivennäisöljyihin
    direktiivin 92/81/ETY 8 artiklan 4 kohdassa tarkoitetun menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '98/275/CE: Decisione del Consiglio del 21 aprile 1998 che autorizza il
    Regno dei Paesi Bassi, secondo la procedura di cui all''articolo 8, paragrafo
    4, della direttiva 92/81/CEE, ad applicare riduzioni delle aliquote d''accisa
    o esenzioni dalle accise per determinati oli minerali utilizzati a fini specifici'
  type: main
- language: nl
  script: Latn
  content: '98/275/EG: Beschikking van de Raad van 21 april 1998 waarbij het Koninkrijk
    der Nederlanden wordt gemachtigd om volgens de procedure van artikel 8, lid 4,
    van Richtlijn 92/81/EEG verlaagde accijnstarieven of vrijstellingen van accijnzen
    toe te passen of te blijven toepassen op bepaalde minerale oliën die voor bijzondere
    doeleinden worden gebruikt'
  type: main
- language: pt
  script: Latn
  content: '98/275/CE: Decisão do Conselho de 21 de Abril de 1998 que autoriza o
    Reino dos Países Baixos a aplicar ou a continuar a aplicar a certos óleos minerais,
    quando utilizados para fins específicos, reduções ou isenções de impostos
    especiais de consumo, de acordo com o procedimento previsto no nº 4 do artigo
    8º da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '98/275/CE: Decisión del Consejo de 21 de abril de 1998 por la que se
    autoriza al Reino de los Países Bajos a aplicar reducciones o exenciones del
    impuesto especial sobre determinados hidrocarburos utilizados para fines específicos,
    de conformidad con el procedimiento previsto en el apartado 4 del artículo 8
    de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '98/275/EG: Rådets beslut av den 21 april 1998 om tillåtelse för Konungariket
    Nederländerna att på vissa mineraloljor som används för särskilda ändamål
    tillämpa nedsättning av eller befrielse av punktskatt i enlighet med förfarandet
    i artikel 8.4 i direktiv 92/81/EEG'
  type: main
