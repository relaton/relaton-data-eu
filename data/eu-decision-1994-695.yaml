title:
- language: en
  script: Latn
  content: '94/695/EC: Commission Decision of 19 October 1994 establishing the list
    of Community establishments for which temporary and limited derogations are granted
    from specific Community health rules on the production and placing on the market
    of raw milk, heat-treated milk and milk-based products'
  type: main
- language: fr
  script: Latn
  content: '94/695/CE: Décision de la Commission, du 19 octobre 1994, arrêtant la
    liste des établissements de la Communauté auxquels est accordée une dérogation
    temporaire et limitée aux règles communautaires sanitaires spécifiques pour
    la production et la mise sur le marché de lait cru, de lait traité thermiquement
    et de produits à base de lait'
  type: main
- language: de
  script: Latn
  content: '94/695/EG: Entscheidung der Kommission vom 19. Oktober 1994 mit dem Verzeichnis
    der Betriebe in der Gemeinschaft, denen zeitlich und inhaltlich begrenzte Ausnahmen
    von den besonderen Hygienevorschriften der Gemeinschaft für die Herstellung und
    Vermarktung von Rohmilch, wärmebehandelter Milch und Erzeugnissen auf Milchbasis
    gewährt wird'
  type: main
- language: da
  script: Latn
  content: '94/695/EF: Kommissionens beslutning af 19. oktober 1994 om opstilling
    af en fortegnelse over virksomheder i Fællesskabet, som indrømmes midlertidig,
    begrænset undtagelse fra de særlige EF-sundhedsbestemmelser for produktion og
    afsætning af rå mælk, varmebehandlet mælk og mælkebaserede produkter'
  type: main
- language: el
  script: Grek
