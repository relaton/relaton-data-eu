title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2975/90 of 15 October 1990 amending regulation
    (EEC) No 1150/90 laying down detailed rules for the application of the arrangements
    applicable to imports of certain milk products originating in the African, Caribbean
    and pacific states (acp states) or in the overseas countries and territories (oct)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2975/90 de la Commission, du 15 octobre 1990, modifiant
    le règlement (CEE) n° 1150/90 établissant les modalités d'application du régime
    applicable à l'importation de certains produits relevant du secteur du lait et
    des produits laitiers originaires des états d'Afrique, des Caraïbes et du Pacifique
    (ACP) ou des pays et territoires d'outre-mer (PTOM)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2975/90 der Kommission vom 15. Oktober 1990 zur Änderung
    der Verordnung (EWG) Nr. 1150/90 zur Festlegung der den Sektor Milch und Milcherzeugnisse
    betreffenden Durchführungsbestimmungen zur Regelung der einfuhr bestimmter Erzeugnisse
    mit Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifisten Ozean
    (akp-staaten) oder in den überseeischen Ländern und gebieten (UELG)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2975/90 af 15. oktober 1990 om ændring
    af forordning (EØF) nr. 1150/90 om gennemførelsesbestemmelser til importordningen
    for visse produkter i sektoren for mælk og mejeriprodukter med oprindelse i staterne
    i Afrika, Vestindien og Stillehavet (AVS) eller i de oversøiske lande og territorier
    (OLT)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2975/90 της Επιτροπής
    της 15ης Οκτωβρίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1150/90 περί της θέσπισης
    λεπτομερών κανόνων εφαρμογής του καθεστώτος
    που εφαρμόζεται κατά την εισαγωγή ορισμένων
    προϊόντων που υπάγονται στον τομέα του γάλακτος
    και των γαλακτοκομικών προϊόντων καταγωγής
    των κρατών της Αφρικής, της Καραϊβικής και
    του Ειρηνικού (ΑΚΕ) ή των υπερποντίων χωρών
    και εδαφών (ΥΧΕ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2975/90 della commissione, del 15 ottobre 1990, recante
    modifica del regolamento (CEE) n. 1150/90 che stabilisce le modalita di applicazione
    del regime applicabile all'importazione di taluni prodotti del settore lattiero-caseario
    originari degli stati dell'africa, dei caraibi e del pacifico (Stati ACP) o dei
    paesi e territori d'oltremare (PTOM)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2975/90 van de commissie van 15 oktober 1990 tot
    wijziging van verordening (EEG) nr. 1150/90 houdende bepalingen ter uitvoering
    van de regeling die geldt bij invoer van bepaalde produkten van de sector melk
    en zuivelprodukten, van oorsprong uit de staten van Afrika, het caribische gebied
    en de stille oceaan (acs-staten) of uit de landen en gebieden overzee (lgo)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2975/90 da comissão, de 15 de outubro de 1990, que
    altera o Regulamento (CEE) n° 1150/90, que estabelece as regras de execução
    do regime aplicável na importação de determinados produtos do sector do leite
    e dos produtos lácteos originários dos estados de África, das Caraibas e do
    pacifico (acp) ou dos países e territórios ultramarinos (ptu)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2975/90 de la comisión, de 15 de octubre de 1990,
    por el que se modifica el Reglamento (CEE) n° 1150/90 por el que se establecen
    las disposiciones de aplicación del régimen aplicable a la importación de determinados
    productos del sector de la leche y productos lácteos originarios de los estados
    de África, del caribe y del pacifico (acp) o de los países y territorios de
    ultramar (ptu)
  type: main
