title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2114/1999 of 5 October 1999 suspending application
    of the measures provided for in Council Regulation (EC) No 1349/1999 establishing
    certain measures concerning imports of processed agricultural products from Switzerland
    in order to take account of the results of the Uruguay Round negotiations in the
    agricultural sector and suspending Regulation (EC) No 1496/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2114/1999 de la Commission, du 5 octobre 1999, suspendant
    l'application des mesures prévues au règlement (CE) nº 1349/1999 du Conseil
    établissant certaines mesures concernant l'importation de produits agricoles
    transformés de Suisse pour tenir compte des résultats des négociations du cycle
    d'Uruguay dans le secteur agricole et suspendant le règlement (CE) nº 1496/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2114/1999 der Kommission vom 5. Oktober 1999 zur Aussetzung
    der Anwendung der in der Verordnung (EG) Nr. 1349/1999 des Rates über bestimmte
    Maßnahmen betreffend die Einfuhr landwirtschaftlicher Verarbeitungserzeugnisse
    aus der Schweiz zur Berücksichtigung der Ergebnisse der Verhandlungen der Uruguay-Runde
    im Agrarbereich vorgesehenen Maßnahmen und zur Aussetzung der Verordnung (EG)
    Nr. 1496/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2114/1999 af 5. oktober 1999 om suspension
    af anvendelsen af de foranstaltninger, der er fastsat i Rådets forordning (EF)
    nr. 1349/1999 om visse foranstaltninger vedrørende import af forarbejdede landbrugsprodukter
    fra Schweiz for at tage hensyn til resultaterne af Uruguay-rundens forhandlinger
    på landbrugsområdet, og om suspension af forordning (EF) nr. 1496/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2114/1999 της Επιτροπής,
    της 5ης Οκτωβρίου 1999, σχετικά με την αναστολή
    της εφαρμογής των μέτρων που προβλέπονται
    στον κανονισμό (ΕΚ) αριθ. 1349/1999 του Συμβουλίου
    για τη θέσπιση ορισμένων μέτρων σχετικών με
    την εισαγωγή μεταποιημένων γεωργικών προϊόντων
    από την Ελβετία προκειμένου να ληφθούν υπόψη
    τα αποτελέσματα των διαπραγματεύσεων του Γύρου
    της Ουρουγουάης στο γεωργικό τομέα και την
    αναστολή του κανονισμού (ΕΚ) αριθ. 1496/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2114/1999, annettu 5 päivänä lokakuuta 1999,
    jalostettujen maataloustuotteiden tuontia Sveitsistä koskevien tiettyjen toimenpiteiden
    toteuttamisesta Uruguayn kierroksen neuvottelujen tulosten huomioon ottamiseksi
    maatalouden alalla annetussa neuvoston asetuksessa (EY) N:o 1349/1999 säädettyjen
    toimenpiteiden toteuttamisen keskeyttämisestä ja asetuksen N:o 1496/1999 soveltamisen
    keskeyttämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2114/1999 della Commissione, del 5 ottobre 1999, che
    sospende l'applicazione delle misure previste al regolamento (CE) n. 1349/1999
    del Consiglio, che stabilisce talune misure relative all'importazione di prodotti
    agricoli trasformati dalla Svizzera per tenere conto dei risultati dei negoziati
    dell'Uruguay Round nel settore agricolo e sospende il regolamento (CE) n. 1496/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2114/1999 van de Commissie van 5 oktober 1999 tot
    opschorting van de toepassing van de maatregelen van Verordening (EG) nr. 1349/1999
    van de Raad tot vaststelling van bepaalde maatregelen betreffende de invoer van
    be- en verwerkte landbouwproducten uit Zwitserland om rekening te houden met de
    resultaten van de in het kader van de Uruguayronde gevoerde onderhandelingen in
    de landbouwsector en tot opschorting van Verordening (EG) nr. 1496/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2114/1999 da Comissão, de 5 de Outubro de 1999, que
    suspende a aplicação das medidas previstas no Regulamento (CE) n° 1349/1999
    do Conselho que estabelece certas medidas relativas à importação de produtos
    agrícolas do «Uruguay Round» no sector agrícola e que suspende o Regulamento
    (CE) n° 1496/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2114/1999 de la Comisión, de 5 de octubre de 1999,
    por el que se suspende la aplicación de las medidas previstas en el Reglamento
    (CE) nº 1349/1999 del Consejo por el que se establecen medidas relativas a las
    importaciones de productos agrícolas transformados de Suiza a fin de tener en
    cuenta los resultados de las negociaciones de la Ronda Uruguay en el sector agrícola
    y por el que se suspende el Reglamento (CE) nº 1496/1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2114/1999 av den 5 oktober 1999 om upphävande
    av tillämpningen av de åtgärder som föreskrivs i rådets förordning (EG)
    nr 1349/1999 om att fastställa vissa åtgärder rörande import av bearbetade
    jordbruksprodukter från Schweiz för att ta hänsyn till resultaten av förhandlingarna
    i Uruguayrundan inom jordbrukssektorn och om upphävande av förordning (EG) nr
    1496/1999
