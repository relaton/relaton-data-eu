  content: Regulation (EEC) No 2767/72 of the Council of 19 December 1972 establishing
    in respect of certain products falling within Chapters 1 to 24 of the Common Customs
    Tariff a scheme of generalized preferences in favour of developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2767/72 du Conseil, du 19 décembre 1972, établissant,
    pour certains produits des chapitres 1 à 24 du tarif douanier commun, un système
    de préférences généralisées en faveur des pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2767/72 des Rates vom 19. Dezember 1972 über die
    Einführung eines allgemeinen Präferenzsystems für bestimmte Erzeugnisse der
    Kapitel 1 bis 24 des Gemeinsamen Zolltarifs zugunsten von Entwicklungsländern
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2767/72 af 19. december 1972 om oprettelse
    af en generel præferenceordning for visse varer fra kapitlerne 1 til 24 i den
    fælles toldtarif til fordel for udviklingslandene
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2767/72 del Consiglio, del 19 dicembre 1972, che attua
    un sistema di preferenze generalizzate in favore dei paesi in via di sviluppo
    per taluni prodotti dei capitoli da 1 a 24 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2767/72 van de Raad van 19 december 1972 houdende
    invoering van een stelsel van algemene preferenties ten behoeve van de ontwikkelingslanden
    voor sommige produkten van de hoofdstukken 1 tot en met 24 van het gemeenschappelijk
    douanetarief
