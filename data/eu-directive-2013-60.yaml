- language: en
  script: Latn
  content: Commission Directive 2013/60/EU of 27 November 2013 amending for the purposes
    of adapting to technical progress, Directive 97/24/EC of the European Parliament
    and of the Council on certain components and characteristics of two or three-wheel
    motor vehicles, Directive 2002/24/EC of the European Parliament and of the Council
    relating to the type-approval of two or three-wheel motor vehicles and Directive
    2009/67/EC of the European Parliament and of the Council on the installation of
    lighting and light-signalling devices on two- or three-wheel motor vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 2013/60/UE de la Commission du 27 novembre 2013 modifiant, aux
    fins de leur adaptation au progrès technique, la directive 97/24/CE du Parlement
    européen et du Conseil relative à certains éléments ou caractéristiques des
    véhicules à moteur à deux ou trois roues, la directive 2002/24/CE du Parlement
    européen et du Conseil relative à la réception des véhicules à moteur à
    deux ou trois roues et la directive 2009/67/CE du Parlement européen et du Conseil
    relative à l’installation des dispositifs d’éclairage et de signalisation
    lumineuse sur les véhicules à moteur à deux ou trois roues
  type: main
- language: de
  script: Latn
