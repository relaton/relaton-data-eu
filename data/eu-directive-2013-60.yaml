    97/24/EK európai parlamenti és tanácsi irányelvnek, a motorkerékpárok és
    segédmotoros kerékpárok típusjóváhagyásáról szóló 2002/24/EK európai
    parlamenti és tanácsi irányelvnek és a motorkerékpárok és segédmotoros
    kerékpárok világító- és fényjelző berendezéseinek beépítéséről szóló
    2009/67/EK európai parlamenti és tanácsi irányelvnek a műszaki fejlődéshez
    való hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2013/60/UE della Commissione, del 27 novembre 2013 , che modifica,
    ai fini dell’adeguamento al progresso tecnico, la direttiva 97/24/CE del Parlamento
    europeo e del Consiglio, relativa a taluni elementi o caratteristiche dei veicoli
    a motore a due o a tre ruote, la direttiva 2002/24/CE del Parlamento europeo e
    del Consiglio, relativa all’omologazione dei veicoli a motore a due o tre ruote
    e la direttiva 2009/67/CE del Parlamento europeo e del Consiglio, relativa all’installazione
    dei dispositivi di illuminazione e di segnalazione luminosa sui veicoli a motore
    a due o a tre ruote
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2013/60/ES ( 2013. gada 27. novembris ), ar ko pielāgojot
