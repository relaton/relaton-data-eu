    97/24/EK par dažām divriteņu vai trīsriteņu mehānisko transportlīdzekļu
    detaļām un parametriem, Eiropas Parlamenta un Padomes Direktīvu 2002/24/EK,
    kas attiecas uz divriteņu vai trīsriteņu mehānisko transportlīdzekļu tipa
    apstiprinājumu, un Eiropas Parlamenta un Padomes Direktīvu 2009/67/EK par apgaismes
    ierīču un gaismas signālierīču uzstādīšanu divriteņu vai trīsriteņu
    mehāniskajiem transportlīdzekļiem
  type: main
- language: lt
  script: Latn
  content: 2013 m. lapkričio 27 d. Komisijos direktyva 2013/60/ES, kuria dėl derinimo
    prie technikos pažangos iš dalies keičiamos Europos Parlamento ir Tarybos direktyva
    97/24/EB dėl tam tikrų dviračių ir triračių motorinių transporto priemonių
    sudėtinių dalių ir charakteristikų, Europos Parlamento ir Tarybos direktyva
    2002/24/EB dėl dviračių ir triračių motorinių transporto priemonių tipo
    patvirtinimo ir Europos Parlamento ir Tarybos direktyva 2009/67/EB dėl apšvietimo
    ir šviesos signalo įtaisų įrengimo dviratėse arba triratėse motorinėse
    transporto priemonėse
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2013/60/UE tas- 27 ta’ Novembru 2013 li temenda
