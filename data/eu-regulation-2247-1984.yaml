title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2247/84 of 30 July 1984 amending Regulation
    (EEC) No 435/80 to include strawberries falling within subheading 08.08 A ex II
    of the Common Customs Tariff and originating in the African, Caribbean and Pacific
    States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2247/84 du Conseil du 30 juillet 1984 modifiant le
    règlement (CEE) no 435/80 en ce qu' il étend son champ d' application aux fraises
    de la sous-position 08.08 A ex II du tarif douanier commun, originaires des États
    d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2247/84 des Rates vom 30. Juli 1984 zur Änderung
    der Verordnung (EWG) Nr. 435/80, insoweit ihr Geltungsbereich auf Erdbeeren der
    Tarifstelle 08.08 A ex II des Gemeinsamen Zolltarifs mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean oder in den überseeischen
    Ländern und Gebieten ausgedehnt wird
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2247/84 af 30. juli 1984 om ændring af forordning
    (EØF) nr. 435/80 for så vidt angår udvidelse af anvendelsesområdet til at
    omfatte jordbær, henhørende under pos. 08.08 A ex II i den fælles toldtarif,
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier
  type: main
- language: el
  script: Grek
