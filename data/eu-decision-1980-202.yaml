title:
- language: en
  script: Latn
  content: '80/202/EEC: Commission Decision of 25 January 1980 authorizing Ireland
    not to apply Community treatment to woven and knitted or crocheted dresses, falling
    within subheadings ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff
    (category 26), originating in India and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/202/CEE: Décision de la Commission, du 25 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les robes tissées et robes
    de bonneterie des sous-positions ex 60.05 A II et ex 61.02 B II du tarif douanier
    commun (catégorie 26), originaires de l''Inde et mises en libre pratique dans
    les autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/202/EWG: Entscheidung der Kommission vom 25. Januar 1980, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Kleider aus Geweben und aus Gewirken der Tarifstellen
    ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie 26, von
    der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/202/EØF: Kommissionens beslutning af 25. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage kjoler af vævede stoffer
    eller af trikotage, som henhører under pos. ex 60.05 A II og ex 61.02 B II i
    den fælles toldtarif (kategori 26), har oprindelse i Indien og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/202/CEE: Decisione della Commissione, del 25 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli abiti interi, tessuti
    e a maglia, delle sottovoci ex 60.05 A II e ex 61.02 B II della tariffa doganale
    comune, categoria 26, originari dell''India e messi in libera pratica negli altri
    Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/202/EEG: Beschikking van de Commissie van 25 januari 1980 waarbij Ierland
    wordt gemachtigd japonnen, geweven en van brei- of haakwerk, van de posten ex
    60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie
    26), van oorsprong uit India en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
