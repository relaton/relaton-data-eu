title:
- language: en
  script: Latn
  content: '95/435/EC: Council Decision of 23 October 1995 authorizing the Federal
    Republic of Germany to conclude an agreement with the Republic of Poland containing
    measures derogating from Articles 2 and 3 of the Sixth Directive 77/388/EEC on
    the harmonization of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '95/435/CE: Décision du Conseil, du 23 octobre 1995, autorisant la République
    fédérale d''Allemagne à conclure un accord avec la République de Pologne contenant
    des dispositions dérogatoires aux articles 2 et 3 de la sixième directive 77/388/CEE
    en matière d''harmonisation des législations des États membres relatives aux
    taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '95/435/EG: Entscheidung des Rates vom 23. Oktober 1995 zur Ermächtigung
    der Bundesrepublik Deutschland, mit der Republik Polen ein Abkommen zu schließen,
    das Abweichungen von den Artikeln 2 und 3 der Sechsten Richtlinie 77/388/EWG zur
    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    enthält'
  type: main
- language: da
  script: Latn
  content: '95/435/EF: Rådets beslutning af 23. oktober 1995 om bemyndigelse af Forbundsrepublikken
    Tyskland til at indgå en aftale med Republikken Polen indeholdende en række
    bestemmelser, der fraviger bestemmelserne i artikel 2 og 3 i sjette direktiv 77/388/EØF
    om harmonisering af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '95/435/ΕΚ: Απόφαση του Συμβουλίου της 23ης
    Οκτωβρίου 1995 με την οποία επιτρέπεται στην
