    johon kuuluu poikkeusmääräyksiä jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen neuvoston direktiivin 77/388/ETY 2 ja 3
    artiklaan'
  type: main
- language: it
  script: Latn
  content: '95/435/CE: Decisione del Consiglio, del 23 ottobre 1995, che autorizza
