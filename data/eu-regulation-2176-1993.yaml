  content: COMMISSION REGULATION (EEC) No 2176/93 of 2 August 1993 re-establishing
    the levying of customs duties on products falling within CN code 2929 90 00, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2176/93 de la Commission du 2 août 1993 portant rétablissement
