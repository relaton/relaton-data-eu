  content: Commission Regulation (EC) No 2567/94 of 21 October 1994 determining the
    extent to which applications lodged in October 1994 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2567/94 de la Commission, du 21 octobre 1994, déterminant
