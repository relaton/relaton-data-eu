title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1505 of 25 July 2025 imposing
    a definitive anti-dumping duty and definitively collecting the provisional duty
    imposed on imports of epoxy resins originating in the People’s Republic of China,
    Taiwan, and Thailand and terminating the investigation on imports of epoxy resins
    originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1505 de la Commission du 25 juillet
    2025 instituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de résines époxydes originaires
    de la République populaire de Chine, de Taïwan et de Thaïlande et clôturant
    l’enquête sur les importations de résines époxydes originaires de la République
    de Corée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1505 der Kommission vom 25. Juli 2025
