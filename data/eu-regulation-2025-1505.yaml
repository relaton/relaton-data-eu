    behozatalára vonatkozó végleges dömpingellenes vám kivetéséről és a kivetett
    ideiglenes vám végleges beszedéséről, valamint a Koreai Köztársaságból
    származó epoxigyanták behozatala tekintetében végzett vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1505 della Commissione, del 25 luglio
