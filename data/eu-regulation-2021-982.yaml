    sigade ja kodulindude söödalisandina (loa hoidja Roal Oy) ning tunnistatakse
    kehtetuks määrused (EL) nr 277/2010, (EL) nr 891/2010 ja rakendusmäärus (EL)
    nr 886/2011
  type: main
- language: fi
  script: Latn
