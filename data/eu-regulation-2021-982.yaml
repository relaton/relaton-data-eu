    preparatą kaip kiaulių ir naminių paukščių pašarų priedą atnaujinimo
    (leidimo turėtojas – bendrovė „Roal Oy“), kuriuo panaikinami reglamentai
    (ES) Nr. 277/2010, (ES) Nr. 891/2010 ir Įgyvendinimo reglamentas (ES) Nr. 886/2011
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/982 tas-17
    ta’ Ġunju 2021 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparazzjoni ta’
    6-fitażi prodotta mit-Trichoderma reesei CBS 122001 bħala addittiv tal-għalf
    għall-ħnieżer u t-tjur (detentur tal-awtorizzazzjoni: Roal Oy), u li jħassar
    ir-Regolamenti (UE) Nru 277/2010, (UE) Nru 891/2010 u r-Regolament ta’ Implimentazzjoni
    (UE) Nru 886/2011'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2021/982 van de Commissie van 17 juni 2021
