    από Trichoderma reesei CBS 122001 ως πρόσθετης ύλης ζωοτροφών
    για χοίρους και πουλερικά (κάτοχος της άδειας:
    Roal Oy) και για την κατάργηση των κανονισμών (ΕΕ)
