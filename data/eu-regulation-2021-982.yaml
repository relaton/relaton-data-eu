    hrani za svinje i perad (nositelj odobrenja: Roal Oy) te o stavljanju izvan snage
    uredbi (EU) br. 277/2010, (EU) br. 891/2010 i Provedbene uredbe (EU) br. 886/2011'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2021/982 végrehajtási rendelete (2021. június 17.)
