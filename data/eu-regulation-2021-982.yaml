    doplňkové látky pro prasata a drůbež (držitel povolení: Roal Oy) a o zrušení
    nařízení (EU) č. 277/2010, (EU) č. 891/2010 a prováděcího nařízení
    (EU) č. 886/2011'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2021/982 af 17. juni 2021
