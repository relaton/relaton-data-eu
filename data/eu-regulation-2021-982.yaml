    ag Trichoderma reesei CBS 122001 mar bhreiseán beathaithe le haghaidh muca agus
    éanlaith chlóis (sealbhóir an údaraithe: Roal Oy), agus lena n-aisghairtear
    Rialacháin (AE) Uimh. 277/2010, (AE) Uimh. 891/2010 agus Rialachán Cur Chun
    Feidhme (AE) Uimh. 886/2011'
  type: main
- language: hr
  script: Latn
