    kesäkuuta 2021, Trichoderma reesei (CBS 122001) -organismin tuottamaa 6-fytaasia
    sisältävän valmisteen hyväksynnän uusimisesta sikojen ja siipikarjan rehun
    lisäaineena (hyväksynnän haltija Roal Oy) sekä asetusten (EU) N:o 277/2010
    ja (EU) N:o 891/2010 ja täytäntöönpanoasetuksen (EU) N:o 886/2011 kumoamisesta
  type: main
- language: ga
  script: Latn
