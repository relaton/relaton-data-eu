title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2021/982 of 17 June 2021 concerning
    the renewal of the authorisation of a preparation of 6-phytase produced by Trichoderma
    reesei CBS 122001 as a feed additive for pigs and poultry (holder of the authorisation:
    Roal Oy), and repealing Regulations (EU) No 277/2010, (EU) No 891/2010 and Implementing
    Regulation (EU) No 886/2011'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2021/982 de la Commission du 17 juin 2021
    concernant le renouvellement de l’autorisation d’une préparation de 6-phytase
    produite par Trichoderma reesei CBS 122001 en tant qu’additif pour l’alimentation
    des porcs et des volailles (titulaire de l’autorisation: Roal Oy), et abrogeant
    les règlements (UE) no 277/2010 et (UE) no 891/2010 ainsi que le règlement d’exécution
    (UE) no 886/2011'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2021/982 der Kommission vom 17. Juni 2021
    zur Verlängerung der Zulassung von 6-Phytase aus Trichoderma reesei (CBS 122001)
    als Futtermittelzusatzstoff für Schweine und Geflügel (Zulassungsinhaber: Royal
    Oy) sowie zur Aufhebung der Verordnungen (EU) Nr. 277/2010, (EU) Nr. 891/2010
    und der Durchführungsverordnung (EU) Nr. 886/2011'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2021/982 на Комисията
    от 17 юни 2021 година за подновяване на разрешението
    за употреба на препарат на 6-фитаза, получена
    от Trichoderma reesei CBS 122001, като фуражна добавка за
    свине и домашни птици (притежател на разрешителното:
    Roal Oy) и за отмяна на регламенти (ЕС) № 277/2010, (ЕС)
    № 891/2010 и Регламент за изпълнение (ЕС) № 886/2011'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2021/982 ze dne 17. června 2021
