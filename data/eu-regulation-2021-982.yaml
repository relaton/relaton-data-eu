    sertések és baromfi takarmány-adalékanyagaként történő engedélyezésének
    megújításáról (az engedély jogosultja: Roal Oy), valamint a 277/2010/EU
    rendelet, a 891/2010/EU rendelet és a 886/2011/EU végrehajtási rendelet hatályon
    kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2021/982 della Commissione del 17 giugno
    2021 relativo al rinnovo dell’autorizzazione di un preparato di 6-fitasi prodotta
    da Trichoderma reesei CBS 122001 come additivo per mangimi destinati a suini e
    pollame (titolare dell’autorizzazione: Roal Oy), e che abroga i regolamenti
    (UE) n. 277/2010, (UE) n. 891/2010 e il regolamento di esecuzione (UE) n. 886/2011'
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/982 (2021. gada 17. jūnijs),
    ar ko atjauno atļauju no Trichoderma reesei CBS 122001 iegūtas 6-fitāzes preparātu
    izmantot par barības piedevu cūkām un mājputniem (atļaujas turētājs Roal
    Oy) un ar ko atceļ Regulu (ES) Nr. 277/2010, (ES) Nr. 891/2010 un Īstenošanas
    regulu (ES) Nr. 886/2011
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/982 2021 m. birželio 17
