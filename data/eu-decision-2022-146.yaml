type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/146 of 1 February 2022 determining
    whether a product containing Alkyl (C12-16) dimethylbenzyl ammonium chloride is
    a biocidal product, pursuant to Article 3(3) of Regulation (EU) No 528/2012 of
    the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/146 de la Commission du 1er février
    2022 déterminant, en vertu de l’article 3, paragraphe 3, du règlement (UE)
    no 528/2012 du Parlement européen et du Conseil, si un produit contenant du chlorure
    d’alkyl(C12-16)diméthylbenzylammonium est un produit biocide
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/146 der Kommission vom 1. Februar 2022
    zur Feststellung, ob es sich bei einem Alkyl(C12-16)dimethylbenzylammoniumchlorid
    enthaltenden Produkt um ein Biozidprodukt gemäß Artikel 3 Absatz 3 der Verordnung
    (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates handelt
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/146 на Комисията
    от 1 февруари 2022 година за определяне дали продуктът,
    съдържащ Алкил (C12-16) диметилбензиламониев
    хлорид, е биоцид в съответствие с член 3, парагаф
    3 от Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/146 ze dne 1. února 2022, kterým
    se stanoví, zda se přípravek obsahující alkyl (C12-16) dimethylbenzylamoniumchlorid
    považuje za biocidní přípravek podle čl. 3 odst. 3 nařízení Evropského
    parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/146 af 1. februar 2022
    om fastlæggelse af, hvorvidt et produkt indeholdende alkyl(C12-16)dimethylbenzylammoniumchlorid
    er et biocidholdigt produkt i henhold til artikel 3, stk. 3, i Europa-Parlamentets
    og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/146 της Επιτροπής
    της 1ης Φεβρουαρίου 2022 που καθορίζει κατά πόσον
    ένα προϊόν που περιέχει χλωριούχο αλκυλο(C12-16)διμεθυλοβενζυλαμμώνιο
    είναι βιοκτόνο, σύμφωνα με το άρθρο 3 παράγραφος
    3 του κανονισμού (ΕΕ) αριθ. 528/2012 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/146, 1. veebruar 2022, millega määratakse
    vastavalt Euroopa Parlamendi ja nõukogu määruse (EL) nr 528/2012 artikli 3
    lõikele 3 kindlaks, kas (C12–16)-alküüldimetüülbensüülammooniumkloriidi
    sisaldav toode on biotsiid
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/146, annettu 1 päivänä
    helmikuuta 2022, sen määrittämisestä, onko alkyyli-(C12-16)-dimetyylibentsyyliammoniumkloridia
    sisältävä tuote biosidivalmiste, Euroopan parlamentin ja neuvoston asetuksen
    (EU) N:o 528/2012 3 artiklan 3 kohdan mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/146 ón gCoimisiún an 1 Feabhra 2022
    lena gcinntear an táirge bithicídeach é táirge ina bhfuil Clóiríd amóiniam
    démheitilbeinsile ailcile (C12-16), de bhun Airteagal 3(3) de Rialachán (AE)
    Uimh. 528/2012 ó Pharlaimint na hEorpa agus ón gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/146 оd 1. veljače 2022. o utvrđivanju
    je li proizvod koji sadržava alkil (C12-16) dimetilbenzil amonijev klorid biocidni
    proizvod na temelju članka 3. stavka 3. Uredbe (EU) br. 528/2012 Europskog parlamenta
    i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/146 végrehajtási határozata (2022. február 1.)
    az 528/2012/EU európai parlamenti és tanácsi rendelet 3. cikkének (3) bekezdése
    alapján egy alkil (C12-16) dimetilbenzil-ammónium-kloridot tartalmazó termék
    biocid termékként való meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/146 della Commissione del 1o febbraio
    2022 che stabilisce se un prodotto contenente cloruro di alchil (C12-16) dimetilbenzilammonio
    sia un biocida a norma dell’articolo 3, paragrafo 3, del regolamento (UE) n.
    528/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/146 (2022. gada 1. februāris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulas (ES) Nr. 528/2012 3.
    panta 3. punktu nosaka, vai alkil(C12–16) dimetilbenzilamonija hlorīdu saturošs
    līdzeklis ir biocīds
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/146 2022 m. vasario 1 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamento (ES) Nr. 528/2012 3 straipsnio
    3 dalį nustatoma, ar produktas, kurio sudėtyje yra alkil (C12-16) dimetilbenzilamonio
    chlorido, yra biocidinis produktas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/146 tal-1
    ta’ Frar 2022 li tiddetermina jekk prodott li fih il-klorur tal-alkil (C12–16)
    dimetilbenżilammonju huwiex prodott bijoċidali, skont l-Artikolu 3(3) tar-Regolament
    (UE) Nru 528/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/146 van de Commissie van 1 februari 2022 tot
    bepaling of een product dat alkyl(C12-16)dimethylbenzylammoniumchloride bevat
    een biocide is, overeenkomstig artikel 3, lid 3, van Verordening (EU) nr. 528/2012
    van het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/146 z dnia 1 lutego 2022 r. w sprawie
    określenia, czy produkt zawierający alkil (C12-16) chlorku dimetylobenzyloamonu
    jest produktem biobójczym, na podstawie art. 3 ust. 3 rozporządzenia Parlamentu
    Europejskiego i Rady (UE) nr 528/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/146 da Comissão de 1 de fevereiro de
    2022 que determina se um produto contendo cloreto de alquil(C12-16)dimetilbenzilamónio
    é um produto biocida nos termos do artigo 3.o, n.o 3, do Regulamento (UE) n.o
    528/2012 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/146 a Comisiei din 1 februarie
    2022 de stabilire, în temeiul articolului 3 alineatul (3) din Regulamentul (UE)
    nr. 528/2012 al Parlamentului European și al Consiliului, a faptului dacă un
    produs care conține clorură de alchil (C12-16) dimetilbenzil amoniu este un
    produs biocid
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/146 z 1. februára 2022, ktorým
    sa podľa článku 3 ods. 3 nariadenia Európskeho parlamentu a Rady (EÚ) č.
    528/2012 určuje, či výrobok obsahujúci alkyl (C12-16)benzyldimetylamónium-chlorid
    je biocídnym výrobkom
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/146 z dne 1. februarja 2022 o določitvi,
    ali je proizvod, ki vsebuje alkil (C12–16) dimetilbenzil amonijev klorid, biocidni
    proizvod, v skladu s členom 3(3) Uredbe (EU) št. 528/2012 Evropskega parlamenta
    in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/146 de la Comisión de 1 de febrero de
    2022 por la que se determina si un producto que contiene cloruro de C12-16-alquildimetilbencilamonio
    es un biocida, de conformidad con el artículo 3, apartado 3, del Reglamento (UE)
    n.o 528/2012 del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/146 av den 1 februari 2022
    om fastställande av huruvida en produkt som innehåller alkyl(C12-16)dimetylbensylammoniumklorid
    är en biocidprodukt i enlighet med artikel 3.3 i Europaparlamentets och rådets
    förordning (EU) nr 528/2012
