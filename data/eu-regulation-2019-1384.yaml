---
id: EURegulation20191384
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1384 of 24 July 2019 amending
    Regulations (EU) No 965/2012 and (EU) No 1321/2014 as regards the use of aircraft
    listed on an air operator certificate for non-commercial operations and specialised
    operations, the establishment of operational requirements for the conduct of maintenance
    check flights, the establishment of rules on non-commercial operations with reduced
    cabin crew on board and introducing editorial updates concerning air operations
    requirements
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1384 de la Commission du 24 juillet 2019
    modifiant les règlements (UE) n° 965/2012 et (UE) n° 1321/2014 en ce qui concerne
    l'utilisation d'un aéronef figurant sur un certificat de transporteur aérien
    pour des exploitations non commerciales et des exploitations spécialisées, l'établissement
    d'exigences opérationnelles relatives à l'exécution des vols de contrôle de
    maintenance, l'établissement de règles relatives aux exploitations non commerciales
    avec un équipage de cabine réduit à bord et l'introduction de mises à jour
    éditoriales concernant les exigences relatives aux opérations aériennes
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1384 der Kommission vom 24. Juli 2019
    zur Änderung der Verordnungen (EU) Nr. 965/2012 und (EU) Nr. 1321/2014 in Bezug
    auf den Einsatz von in einem Luftverkehrsbetreiberzeugnis für den nichtgewerblichen
    Flugbetrieb und spezialisierten Flugbetrieb aufgeführten Luftfahrzeugen, die
    Festlegung betrieblicher Anforderungen an die Durchführung von Instandhaltungstestflügen,
    die Festlegung von Vorschriften für den nichtgewerblichen Flugbetrieb mit verringerter
    Kabinenbesatzung an Bord und redaktionelle Aktualisierungen in Bezug auf die Anforderungen
    an den Flugbetrieb
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1384 на Комисията
    от 24 юли 2019 година за изменение на регламенти
    (ЕС) № 965/2012 и (ЕС) № 1321/2014 по отношение на използването
    на въздухоплавателни средства, вписани в свидетелство
    за авиационен оператор, за нетърговски и специализирани
    операции, определянето на оперативни изисквания
    за провеждането на полети за проверка на техническото
    обслужване, установяването на правила за нетърговски
    операции с намален брой членове на кабинния
    екипаж на борда и за въвеждане на редакционни
    актуализации относно изискванията за летателната
    експлоатация
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1384 ze dne 24. července 2019,
    kterým se mění nařízení (EU) č. 965/2012 a (EU) č. 1321/2014, pokud jde
    o používání letadel uvedených v osvědčení leteckého provozovatele pro
    neobchodní provoz a zvláštní provoz, stanovení provozních požadavků pro
    provádění kontrolních letů po údržbě, stanovení pravidel pro neobchodní
    provoz se sníženým počtem palubních průvodčích na palubě, a kterým se
    provádí redakční aktualizace týkající se požadavků na letový provoz
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1384 af 24. juli 2019
    om ændring af forordning (EU) nr. 965/2012 og (EU) nr. 1321/2014 for så vidt
    angår brugen af luftfartøjer, der er opført på et AOC, til ikkeerhvervsmæssige
    operationer og specialoperationer, fastsættelse af operationelle krav til gennemførelse
    af vedligeholdelseskontrolflyvninger, fastsættelse af regler om ikkeerhvervsmæssige
    operationer med reduceret kabinebesætning om bord og indførelse af redaktionelle
    opdateringer vedrørende krav til flyveoperationer
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/1384 της Επιτροπής,
    της 24ης Ιουλίου 2019, για την τροποποίηση των
    κανονισμών (ΕΕ) αριθ. 965/2012 και (ΕΕ) αριθ. 1321/2014
    όσον αφορά τη χρήση αεροσκαφών αναγραφόμενων
    στο πιστοποιητικό αερομεταφορέα για μη εμπορικές
    πτητικές λειτουργίες και ειδικευμένες πτητικές
    λειτουργίες, τον καθορισμό επιχειρησιακών
    απαιτήσεων για τη διενέργεια πτήσεων ελέγχου
    της συντήρησης, την καθιέρωση κανόνων για τις
    μη εμπορικές πτητικές λειτουργίες με μειωμένο
    πλήρωμα θαλάμου επιβατών και την εισαγωγή
    συντακτικού χαρακτήρα επικαιροποιήσεων στις
    απαιτήσεις για τις πτητικές λειτουργίες
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/1384, 24. juuli 2019, millega muudetakse
    määruseid (EL) nr 965/2012 ja (EL) nr 1321/2014 seoses lennuettevõtja sertifikaadis
    loetletud õhusõidukite kasutamisega mitteärilisteks lendudeks ja erilendudeks,
    käitamisnõuete kehtestamisega tehniliste kontroll-lendude suhtes, eeskirjade
    kehtestamisega selliste mitteäriliste lendude käitamise suhtes, mille pardal
    on vähendatud arv salongimeeskonna liikmeid, ning lennutegevusnõuete toimetusliku
    ajakohastamisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/1384, annettu 24 päivänä
    heinäkuuta 2019, asetusten (EU) N:o 965/2012 ja (EU) N:o 1321/2014 muuttamisesta
    niiltä osin kuin on kyse lentotoimintaluvassa lueteltujen ilma-alusten käytöstä
    muuhun kuin kaupalliseen lentotoimintaan ja erityislentotoimintaan, huollon jälkeisten
    koelentojen suorittamista koskevista vaatimuksista, muuta kuin kaupallista lentotoimintaa
    vähennetyllä matkustamomiehistöllä koskevista säännöistä sekä toimituksellisista
    päivityksistä lentotoimintavaatimuksiin
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/1384 оd 24. srpnja 2019. o izmjeni
    uredaba (EU) br. 965/2012 i (EU) br. 1321/2014 s obzirom na upotrebu zrakoplova
    navedenih u svjedodžbi zračnog prijevoznika za nekomercijalne operacije i specijalizirane
    operacije, utvrđivanje operativnih zahtjeva za probne letove nakon održavanja,
    utvrđivanje pravila za nekomercijalne operacije sa smanjenom kabinskom posadom
    i urednička ažuriranja u vezi sa zahtjevima za letačke operacije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1384 végrehajtási rendelete (2019. július 24.)
    a 965/2012/EU és az 1321/2014/EU rendeletnek az üzembentartási engedélyben
    feltüntetett légi jármű nem kereskedelmi célú műveletekre és egyedi műveletekre
    történő használata, a karbantartási célú ellenőrző repülések végzésére
    vonatkozó üzembentartási követelmények megállapítása, a csökkentett létszámú,
    fedélzeten lévő légiutas-kísérő személyzettel végzett nem kereskedelmi
    célú műveletekre vonatkozó szabályok megállapítása, valamint a légi szállítási
    követelményeket érintő szerkesztési frissítések tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1384 della Commissione, del 24 luglio
    2019, che modifica i regolamenti (UE) n. 965/2012 e (UE) n. 1321/2014 per quanto
    riguarda l'uso di aeromobili indicati in un certificato di operatore aereo per
    operazioni non commerciali e operazioni specializzate, la definizione di requisiti
    operativi per l'effettuazione di voli di collaudo, la definizione di norme relative
    alle operazioni non commerciali con a bordo equipaggio di cabina ridotto e che
    introduce aggiornamenti editoriali concernenti i requisiti delle operazioni di
    volo
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1384 (2019. gada 24. jūlijs),
    ar ko groza Regulas (ES) Nr. 965/2012 un (ES) Nr. 1321/2014 attiecībā uz gaisa
    kuģa ekspluatanta apliecībā uzskaitīto gaisa kuģu izmantošanu nekomerciāliem
    pārvadājumiem un specializētiem pārvadājumiem, operatīvo prasību noteikšanu
    tehniskās apkopes pārbaudes lidojumu veikšanai, noteikumu par nekomerciāliem
    pārvadājumiem ar samazinātu salona apkalpi izveidošanu un redakcionālu atjauninājumu
    ieviešanu attiecībā uz gaisa kuģu ekspluatācijas prasībām
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 24 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1384,
    kuriuo dėl oro vežėjo pažymėjime išvardytų orlaivių naudojimo nekomerciniams
    ir specialiesiems skrydžiams, su technine priežiūra susijusių bandomųjų
    skrydžių veiklos reikalavimų nustatymo, nekomercinių skrydžių su mažesne
    keleivių salono įgula taisyklių nustatymo ir skrydžių vykdymo reikalavimų
    redakcinio atnaujinimo iš dalies keičiami reglamentai (ES) Nr. 965/2012 ir (ES)
    Nr. 1321/2014
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1384 tal-24 ta'
    Lulju 2019 li jemenda r-Regolamenti (UE) Nru 965/2012 u (UE) Nru 1321/2014 fir-rigward
    tal-użu tal-inġenji tal-ajru elenkati fuq ċertifikat ta' operatur tal-ajru
    għal operazzjonijiet mhux kummerċjali u operazzjonijiet speċjalizzati, l-istabbiliment
    ta' rekwiżiti operattivi għat-twettiq ta' titjiriet ta' kontroll tal-manutenzjoni,
    l-istabbiliment ta' regoli dwar operazzjonijiet mhux kummerċjali b'ekwipaġġ
    tal-kabina mnaqqas abbord u l-introduzzjoni ta' aġġornamenti editorjali dwar
    ir-rekwiżiti tal-operazzjonijiet bl-ajru
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/1384 van de Commissie van 24 juli 2019
    tot wijziging van de Verordeningen (EU) nr. 965/2012 en (EU) nr. 1321/2014 met
    betrekking tot het gebruik van luchtvaartuigen die zijn vermeld op een vergunning
    tot vluchtuitvoering voor niet-commerciële luchtvervoersactiviteiten en gespecialiseerde
    vluchtuitvoeringen, de vaststelling van operationele voorschriften voor het uitvoeren
    van onderhoudscontrolevluchten, de vaststelling van regels voor niet-commerciële
    vluchtuitvoeringen met beperkt cabinepersoneel aan boord en het aanbrengen van
    redactionele aanvullingen met betrekking tot de eisen inzake vluchtuitvoeringen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/1384 z dnia 24 lipca 2019
    r. zmieniające rozporządzenia (UE) nr 965/2012 i (UE) nr 1321/2014 w odniesieniu
    do użytkowania statków powietrznych wymienionych w certyfikacie przewoźnika
    lotniczego do operacji niezarobkowych i operacji specjalistycznych, ustanowienia
    wymogów operacyjnych dotyczących przeprowadzania lotów próbnych po obsłudze,
    ustanowienia przepisów dotyczących operacji niezarobkowych z udziałem zmniejszonego
    personelu pokładowego na pokładzie oraz wprowadzenia aktualizacji redakcyjnych
    dotyczących wymogów w zakresie operacji lotniczych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1384 da Comissão, de 24 de julho de
    2019, que altera os Regulamentos (UE) n.° 965/2012 e (UE) n.° 1321/2014 no que
    diz respeito à utilização das aeronaves que figuram no certificado de operador
    aéreo para operações não comerciais e operações especializadas, ao estabelecimento
    de requisitos operacionais para a realização de voos de verificação da manutenção
    e de regras em matéria de operações não comerciais com tripulação reduzida
    a bordo, bem como à introdução de atualizações de ordem redacional nos requisitos
    aplicáveis às operações aéreas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/1384 al Comisiei din 24 iulie
    2019 de modificare a Regulamentelor (UE) nr. 965/2012 și (UE) nr. 1321/2014 în
    ceea ce privește utilizarea pentru operațiuni necomerciale și pentru operațiuni
    specializate a aeronavelor înscrise pe un certificat de operator aerian, stabilirea
    de cerințe operaționale pentru desfășurarea zborurilor de verificare a întreținerii,
    stabilirea de norme privind operațiunile necomerciale cu un număr redus de membri
    ai echipajului de cabină la bord și introducerea unor modificări de redactare
    pentru actualizarea cerințelor privind operațiunile aeriene
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1384 z 24. júla 2019, ktorým
    sa menia nariadenia (EÚ) č. 965/2012 a (EÚ) č. 1321/2014, pokiaľ ide o používanie
    lietadiel uvedených v osvedčeniach leteckého prevádzkovateľa na neobchodnú
    prevádzku a špeciálnu prevádzku, stanovenie prevádzkových požiadaviek na
    vykonávanie kontrolných letov na účely údržby, stanovenie pravidiel týkajúcich
    sa neobchodnej prevádzky so zníženým počtom palubných sprievodcov na palube
    a zavedenie redakčných aktualizácií týkajúcich sa požiadaviek na leteckú
    prevádzku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1384 z dne 24. julija 2019 o spremembi
    uredb (EU) št. 965/2012 in (EU) št. 1321/2014 glede uporabe zrakoplovov, navedenih
    v spričevalu letalskega prevoznika za nekomercialne operacije in specializirane
    operacije, določitve operativnih zahtev za izvajanje vzdrževalnih testnih letov,
    določitve pravil o nekomercialnih operacijah s kabinskim osebjem z manj člani
    na krovu ter uvedbe posodobitev besedila v zvezi z zahtevami za letalske operacije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1384 de la Comisión, de 24 de julio
    de 2019, por el que se modifican los Reglamentos (UE) n.° 965/2012 y (UE) n.°
    1321/2014 en lo que respecta a la utilización de las aeronaves enumeradas en
    un certificado de operador aéreo para operaciones no comerciales y operaciones
    especializadas, al establecimiento de requisitos operativos para la realización
    de los vuelos de verificación de mantenimiento, al establecimiento de normas
    relativas a las operaciones no comerciales con tripulación reducida de cabina
    a bordo y a la introducción de actualizaciones de redacción en relación con
    los requisitos de las operaciones aéreas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/1384 av den 24 juli 2019
    om ändring av förordningarna (EU) nr 965/2012 och (EU) nr 1321/2014 vad gäller
    användning av luftfartyg som är förtecknade i ett drifttillstånd för icke-kommersiell
    verksamhet och specialiserad verksamhet, fastställande av operativa krav för
    genomförandet av kontrollflygningar efter underhåll, fastställande av regler
    om icke-kommersiell verksamhet med minskat antal kabinbesättningsmedlemmar ombord
    och införande av redaktionella uppdateringar med avseende på flygdriftskrav
  type: main
