title:
- language: en
  script: Latn
  content: '83/363/EEC: Commission Decision of 13 July 1983 establishing that the
    apparatus described as ''Canberra - GE(Li) Detector, model 7229, with Cryostat,
    model 7500, Spectroscopy Preamplifier model 2001, Liquid Nitrogen Monitor, model
    1786, Spectroscopy Amplifier, model 2010, High Voltage Bias Supply, model 3105,
    Analog-to-Digital Converter, model 8070 and ADC Expander, model 8825'' may be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/363/CEE: Décision de la Commission du 13 juillet 1983 constatant que
    l''importation de l''appareil dénommé "Canberra - Ge(Li) Detector, model 7229,
    with cryostat, model 7500, Spectroscopy preamplifier, model 2001, Liquid Nitrogen
    Monitor, model 1786, Spectroscopy Amplifier, model 2010, High Voltage Bias Supply,
    model 3105, Analog-to-Digital Converter, model 8070 and ADC Expander, model 8825"
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/363/EWG: Entscheidung der Kommission vom 13. Juli 1983, mit der festgestellt
    wird, daß das Gerät ,,Canberra - Ge(Li) Detector, model 7229, with Cryostat,
    model 7500, Spectroscopy Preamplifier, model 2001, Liquid Nitrogen Monitor, model
    1786, Spectroscopy Amplifier, model 2010, High Voltage Bias Supply, model 3105,
    Analog-to-Digital Converter, model 8070 and ADC Expander, model 8825" unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/363/EØF: Kommissionens beslutning af 13. juli 1983 om fastslåelse
    af, at indførsel af apparatet "Canberra - Ge(Li) Detector, model 7229, with cryostat,
    model 7500, Spectroscopy preamplifier, model 2001, Liquid Nitrogen Monitor, model
    1786, Spectroscopy Amplifier, model 2010, High Voltage Bias Supply, model 3105,
    Analog-to-Digital Converter, model 8070 and ADC Expander, model 8825" kan ske
    med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/363/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Ιουλίου 1983 περί διαπιστώσεως ότι η εισαγωγή
    της συσκευής με την ονομασία «Canberra — Ge (Li) Detector,
    model 7229, with Cryostat, model 7500, Spectroscopy preamplifier, model 2001,
    Liquid Nitrogen Monitor, model 1786, Spectroscopy Amplifier, model 2010, High
    Voltage Bias Supply, model 3105, Analog-to-Digital Converter, model 8070 and ADC
    Expander, model 8825» δύναται να πραγματοποιηθεί ατελώς
    ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/363/CEE: Decisione della Commissione del 13 luglio 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "Canberra - Ge(Li)Detector, model
    7229, with cryostat, model 7500, Spectroscopy preamplifier, model 2001, Liquid
    Nitrogen Monitor, model 1786, Spectroscopy Amplifier, model 2010, High Voltage
    Bias Supply, model 3105, Analog-to-Digital Converter, model 8070 and ADC Expander,
    model 8825" può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/363/EEG: Beschikking van de Commissie van 13 juli 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Canberra - Ge(Li) Detector, model 7229,
    with Cryostat, model 7500, Spectroscopy Preamplifier, model 2001, Liquid Nitrogen
    Monitor, model 1786, Spectroscopy Amplifier, model 2010, High Voltage Bias Supply,
    model 3105, Analog-to-Digital Converter, model 8070 and ADC- Expander model 8825"
