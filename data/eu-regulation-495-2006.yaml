    za nekatere proizvode iz sektorjev jajc in perutninskega mesa v skladu z uredbama
    (ES) št. 593/2004 in (ES) št. 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 495/2006 de la Comisión, de 27 de marzo de 2006 ,
