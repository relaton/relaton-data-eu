    nozares produktu importa atļauju pieteikumus, saskaņā ar shēmām, kas ir paredzētas
    Regulās (EK) Nr. 593/2004 un (EK) Nr. 1251/96
  type: main
- language: lt
  script: Latn
  content: 2006 m. kovo 27 d. Komisijos reglamentas (EB) Nr. 495/2006, nustatantis
