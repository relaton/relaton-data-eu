title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 495/2006 of 27 March 2006 determining the
    extent to which applications lodged in March 2006 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 593/2004 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 495/2006 de la Commission du 27 mars 2006 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2006 pour certains produits du secteur des œufs et de la viande de volaille
    dans le cadre des règlements (CE) n o 593/2004 et (CE) n o 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 495/2006 der Kommission vom 27. März 2006 über die
    Festsetzung des Umfangs, in dem die im März 2006 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 593/2004 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 495/2006 ze dne 27. března 2006 , kterým
    se stanoví rozsah, v němž mohou být přijímány žádosti o dovozní licence
    na některé výrobky z odvětví vajec a drůbežího masa podané v březnu
    2006 na základě nařízení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 495/2006 af 27. marts 2006 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2006 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 593/2004 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 495/2006 της Επιτροπής,
    της 27ης Μαρτίου 2006 , για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν το Μάρτιο του 2006 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 593/2004 και (ΕΚ) αριθ.
    1251/96
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 495/2006, 27. märts 2006 , millega määratakse
    kindlaks, millises ulatuses võib heaks kiita määruste (EÜ) nr 593/2004 ja
    (EÜ) nr 1251/96 alusel märtsis 2006 esitatud teatavate muna- ja kodulinnulihasektorite
    toodete impordilitsentsi taotlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 495/2006, annettu 27 päivänä maaliskuuta 2006
    , määrättyyn järjestelmään liittyvien maaliskuussa 2006 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 593/2004 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság 495/2006/EK rendelete ( 2006. március 27. ) az 593/2004/EK
