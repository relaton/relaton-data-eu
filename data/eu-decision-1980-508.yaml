id: EUDecision1980508
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/508/EEC: Commission Decision of 29 April 1980 authorizing the French
    Republic not to apply Community treatment to woven overcoats, raincoats and other
    coats, cloaks and capes, jackets and blazers, falling within subheading ex 61.02
    B II of the Common Customs Tariff (category 15 B), originating in Albania and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/508/CEE: Décision de la Commission, du 29 avril 1980, autorisant la
    République française à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés de la sous-position ex 61.02 B II du tarif
    douanier commun (catégorie 15 B), originaires d''Albanie et mis en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/508/EWG: Entscheidung der Kommission vom 29. April 1980, mit der die
    Französische Republik ermächtigt wird, aus Albanien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus
    Geweben, der Tarifstelle ex 61.02 B II des Gemeinsamen Zolltarifs (Kategorie 15
    B) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/508/EØF: Kommissionens beslutning af 29. april 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede, som henhører under pos. ex 61.02 B II i
    den fælles toldtarif (kategori 15 B), har oprindelse i Albanien og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/508/CEE: Decisione della Commissione, del 29 aprile 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario cappotti, soprabiti,
    mantelli e simili, e giacche, tessuti, della sottovoce ex 61.02 B II della tariffa
    doganale comune, categoria 15 B, originari dell''Albania e messi in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/508/EEG: Beschikking van de Commissie van 29 april 1980 waarbij de
    Franse Republiek wordt gemachtigd mantels, regenjassen en capes daaronder begrepen,
    blazers en jasjes, geweven, van post ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 15 B), van oorsprong uit Albanië en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
