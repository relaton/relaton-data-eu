    ar ko attiecībā uz Lielbritānijas un Ziemeļīrijas Apvienotās Karalistes
    un noteiktu tās atkarīgo teritoriju iekļaušanu to trešo valstu sarakstā,
    no kurām Eiropas Savienībā atļauts ievest liellopu embrijus, groza Lēmuma
    2006/168/EK I pielikumu (izziņots ar dokumenta numuru C(2019) 7636)
  type: main
- language: lt
  script: Latn
