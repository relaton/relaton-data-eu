title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1768 of 23 October 2019 amending
    Annex I to Decision 2006/168/EC as regards the inclusion of the United Kingdom
    of Great Britain and Northern Ireland and certain of its Crown Dependencies in
    the list of third countries authorised for the introduction into the European
    Union of bovine embryos (notified under document C(2019) 7636)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/1768 de la Commission du 23 octobre
    2019 modifiant l’annexe I de la décision 2006/168/CE en ce qui concerne l’inscription
    du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord et de certaines dépendances
    de la Couronne sur la liste des pays tiers en provenance desquels l’introduction
    dans l’Union européenne d’embryons de bovin est autorisée [notifiée sous
    le numéro C(2019) 7636]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1768 der Kommission vom 23. Oktober 2019
    zur Änderung des Anhangs I der Entscheidung 2006/168/EG im Hinblick auf die Aufnahme
    des Vereinigten Königreichs Großbritannien und Nordirland und mancher seiner
    unmittelbar der englischen Krone unterstehenden Gebiete in die Liste der Drittländer,
    aus denen die Einfuhr von Rinderembryonen in die Union zugelassen ist (Bekannt
    gegeben unter Aktenzeichen C(2019) 7636)
  type: main
- language: bg
  script: Cyrl
