    Regatului Unit al Marii Britanii și Irlandei de Nord și a anumitor teritorii
    dependente ale Coroanei Britanice în lista țărilor terțe autorizate pentru
    introducerea de embrioni de bovine în Uniunea Europeană [notificată cu numărul
    C(2019) 7636]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1768 z 23. októbra 2019, ktorým
