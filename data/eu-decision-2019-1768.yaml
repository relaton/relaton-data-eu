    království Velké Británie a Severního Irska a určitých jeho závislých
    území do seznamu třetích zemí, ze kterých je povolen vstup embryí skotu
    na území Evropské unie (oznámeno pod číslem C(2019) 7636)
  type: main
- language: da
  script: Latn
  content: Kommissionens Gennemførelsesafgørelse (EU) 2019/1768 af 23. oktober 2019
    om ændring af bilag I til beslutning 2006/168/EF for så vidt angår opførelse
    af Det Forenede Kongerige Storbritannien og Nordirland og visse af dets kronbesiddelser
    på listen over tredjelande, som er godkendt med hensyn til indførsel til Den
    Europæiske Union af kvægembryoner (meddelt under nummer C(2019) 7636)
  type: main
- language: el
  script: Grek
