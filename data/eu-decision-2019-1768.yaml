    на Обединеното кралство Великобритания и Северна
    Ирландия и на някои от териториите, зависими
    от Британската корона, в списъка на третите
    държави, от които е разрешено въвеждането в
    Съюза на ембриони от едър рогат добитък (нотифицирано
    под номер С(2019) 7636)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1768 ze dne 23. října 2019,
