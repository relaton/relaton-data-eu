    Egyesült Királyságának és egyes koronafüggőségeinek a szarvasmarha-embriók
    Európai Unióba való behozatalára engedéllyel rendelkező harmadik országok
    jegyzékébe való felvétele tekintetében történő módosításáról (az
    értesítés a C(2019) 7636. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/1768 della Commissione del 23 ottobre
    2019 che modifica l'allegato I della decisione 2006/168/CE per quanto riguarda
    l'inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord e di alcune dipendenze
    della Corona nell'elenco di paesi terzi autorizzati a introdurre nell'Unione europea
    embrioni di bovini [notificata con il numero C(2019) 7636]
  type: main
- language: lv
  script: Latn
