id: EUDecision1977427
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 April 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to certain men's, boys', women's, girl's and infants' outer
    garments falling within heading Nos ex 61.01 and ex 61.02 of the Common Customs
    Tariff, originating in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/427/CEE: Décision de la Commission, du 14 avril 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire certains vêtements de dessus pour hommes,
    garçonnets, femmes, fillettes et jeunes enfants, des positions Ex 61.01 et Ex
    61.02 du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. April 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, bestimmte aus Hongkong stammende und in den anderen Mitgliedstaaten im
    freien Verkehr befindliche Oberkleidung für Männer, Knaben, Frauen, Mädchen
    und Kleinkinder, der Tarifstellen ex 61.01 und ex 61.02 des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. april 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage visse yderbeklædningsgenstande til mænd. drenge, kvinder, piger og
    småbørn, som henhører under pos. ex 61.01 og ex 61.02 i den fælles toldtarif,
    har oprindelse i Hongkong og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 aprile 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario alcuni indumenti esterni per uomo, ragazzo, donna,
    ragazza e bambini, delle voci ex 61.01 e ex 61.02 della tariffa doganale comune,
    originari di Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 april 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    bepaalde bovenkleding voor heren, jongens, dames, meisjes en kinderen, van posten
    ex 61.01 en ex 61.02 van het gemeenschappelijk douanetarief, van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
