title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 14 July 2014 on authorising the placing
    on the market of oil from the micro-algae Schizochytrium sp. as a novel food ingredient
    under Regulation (EC) No 258/97 of the European Parliament and of the Council
    and repealing Decisions 2003/427/EC and 2009/778/EC (notified under document C(2014)
    4670)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution de la Commission du 14 juillet 2014 portant autorisation
    de mise sur le marché d'une huile extraite de la microalgue Schizochytrium sp.
    en tant que nouvel ingrédient alimentaire en application du règlement (CE) no
    258/97 du Parlement européen et du Conseil et abrogeant les décisions 2003/427/CE
    et 2009/778/CE [notifiée sous le numéro C(2014) 4670]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss der Kommission vom 14. Juli 2014 zur Genehmigung
    des Inverkehrbringens von Öl aus der Mikroalge Schizochytrium sp. als neuartige
    Lebensmittelzutat im Sinne der Verordnung (EG) Nr. 258/97 des Europäischen Parlaments
    und des Rates und zur Aufhebung der Entscheidungen 2003/427/EG und 2009/778/EG
    (Bekanntgegeben unter Aktenzeichen C(2014) 4670)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение на Комисията от 14
    юли 2014 година за разрешаване на пускането на
    пазара на масло от микроводорасли Schizochytrium
    sp. като нова хранителна съставка съгласно Регламент
    (ЕО) № 258/97 на Европейския парламент и на Съвета
    и за отмяна на решения 2003/427/ЕО и 2009/778/ЕО (нотифицирано
    под номер С(2014) 4670)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise ze dne 14. července 2014, kterým se povoluje
    uvedení oleje z mikrořas Schizochytrium sp. na trh jako nové složky potravin
    podle nařízení Evropského parlamentu a Rady (ES) č. 258/97 a zrušují rozhodnutí
    2003/427/ES a 2009/778/ES (oznámeno pod číslem C(2014) 4670)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse af 14. juli 2014 om tilladelse
    til markedsføring af olie fremstillet af mikroalgen Schizochytrium sp. som ny
    levnedsmiddelingrediens i henhold til Europa-Parlamentets og Rådets forordning
    (EF) nr. 258/97 og om ophævelse af beslutning 2003/427/EF og 2009/778/EF (meddelt
    under nummer C(2014) 4670)
  type: main
- language: el
  script: Grek
