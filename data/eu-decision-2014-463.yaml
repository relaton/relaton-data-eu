    rendelet szerinti új élelmiszer-összetevőként való forgalomba hozataláról,
    valamint a 2003/427/EK és a 2009/778/EK határozat hatályon kívül helyezéséről
    (az értesítés a C(2014) 4670. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione della Commissione, del 14 luglio 2014, che autorizza
    l'immissione in commercio di olio derivato dalla microalga Schizochytrium sp.
    quale nuovo ingrediente alimentare a norma del regolamento (CE) n. 258/97 del
    Parlamento europeo e del Consiglio nonché abroga le decisioni 2003/427/CE e 2009/778/CE
    [notificata con il numero C(2014) 4670]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (2014. gada 14. jūlijs), ar ko atbilstīgi
    Eiropas Parlamenta un Padomes Regulai (EK) Nr. 258/97 ļauj laist tirgū no mikroaļģēm
    Schizochytrium sp. iegūtu eļļu kā jaunu pārtikas produktu sastāvdaļu un
