    Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 258/97 ning tunnistatakse
    kehtetuks otsused 2003/427/EÜ ja 2009/778/EÜ (teatavaks tehtud numbri C(2014)
    4670 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös, annettu 14 päivänä heinäkuuta
