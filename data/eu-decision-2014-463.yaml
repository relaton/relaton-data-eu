    markkinoille elintarvikkeiden uutena ainesosana Euroopan parlamentin ja neuvoston
    asetuksen (EY) N:o 258/97 mukaisesti ja päätösten 2003/427/EY ja 2009/778/EY
    kumoamisesta (tiedoksiannettu numerolla C(2014) 4670)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije оd 14. srpnja 2014. o odobravanju stavljanja
