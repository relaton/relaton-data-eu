    14ης Ιουλίου 2014, για την έγκριση της διάθεσης
    στην αγορά ελαίου που προέρχεται από το μικροφύκος
    Schizochytrium sp. ως νέου συστατικού τροφίμων σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 258/97 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου και για την
    κατάργηση των αποφάσεων 2003/427/ΕΚ και 2009/778/ΕΚ
    [κοινοποιηθείσα υπό τον αριθμό C(2014) 4670]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus, 14. juuli 2014, millega lubatakse mikrovetikatest
