title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2721/71 de la Commission, du 21 décembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux articles et engins pour les jeux de plein air, etc., des sous-positions tarifaires
    97.06 B et C, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1309/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2721/71 der Kommission vom 21. Dezember 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Geräte für
    Freiluftspiele usw. der Tarifstellen 97.06 B und C, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 1309/71 des Rates vom 21. Juni 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2721/71 della Commissione, del 21 dicembre 1971, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    oggetti ed attrezzi per giuochi all'aperto, ecc., delle sottovoci doganali 97.06
    B e C, originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 1309/71 del Consiglio, del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2721/71 van de Commissie van 21 december 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op artikelen en toestellen voor openluchtspelen, enz., van onderverdelingen
    97.06 B en C, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 1309/71 van de Raad van 21 juni 1971 tariefpreferenties werden geopend
  type: main
