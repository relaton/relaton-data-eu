  content: Commission Regulation (EC) No 753/1999 of 12 April 1999 amending Council
    Regulation (EC) No 1705/98 as regards the list of UNITA persons established pursuant
    to paragraph 11 of Security Council Resolution 1127 (1997) and the names and addresses
    of competent national authorities
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 753/1999 de la Commission, du 12 avril 1999, modifiant
    le règlement (CE) n° 1705/98 du Conseil en ce qui concerne la liste des personnes
    liées à l'UNITA, établie en vertu du paragraphe 11 de la résolution 1127 (1997)
    du Conseil de sécurité, et les noms et adresses des autorités nationales compétentes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 753/1999 der Kommission vom 12. April 1999 zur Änderung
    der Verordnung (EG) Nr. 1705/98 des Rates hinsichtlich der Liste der UNITA-Personen
    nach Absatz 11 der Resolution 1127 (1997) des Sicherheitsrates sowie der Namen
    und Anschriften der zuständigen nationalen Behörden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 753/1999 af 12. april 1999 om ændring
