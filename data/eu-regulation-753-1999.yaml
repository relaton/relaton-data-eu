    dei membri dell'UNITA elaborato a norma del paragrafo 11 della risoluzione del
    Consiglio di sicurezza 1127 (1997) e i nomi e gli indirizzi delle competenti autorità
    nazionali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 753/1999 van de Commissie van 12 april 1999 tot wijziging
    van Verordening (EG) nr. 1705/98 van de Raad wat de overeenkomstig paragraaf 11
    van resolutie 1127 (1997) van de Veiligheidsraad vastgestelde lijst van Unita-personen
    en de namen en adressen van de bevoegde nationale autoriteiten betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 753/1999 da Comissão, de 12 de Abril de 1999, que
