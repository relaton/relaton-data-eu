    κανονισμού (ΕΚ) αριθ. 1705/98 του Συμβουλίου όσον
    αφορά τον κατάλογο αναγνωρισμένων προσώπων
    της UNITA δυνάμει της παραγράφου 11 του ψηφίσματος
    1127 (1997) του Συμβουλίου Ασφαλείας και τα ονόματα
    και τις διευθύνσεις των αρμόδιων εθνικών αρχών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 753/1999, annettu 12 päivänä huhtikuuta 1999,
