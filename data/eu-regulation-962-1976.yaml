title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 962/76 of 27 April 1976 re-establishing
    the levying of customs duties on carbonates of sodium anhydrite, falling within
    subheading 28.42 ex II, originating in Romania to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 962/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 A EX II, originaire de
    la Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 962/76 der Kommission vom 27. April 1976 zur Wiedereinführung
    des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle 28.42 A ex II
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 962/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for natriumcarbonat vandfri, under underposition
    28.42 A ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 962/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili al carbonato di sodio
    anidro della sottovoce doganale n. 28.42 A ex II originario della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 962/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op watervrij
    natriumcarbonaat, van onderverdeling 28.42 A ex II, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
