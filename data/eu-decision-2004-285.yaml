    i henhold til proceduren vedrørende kontrol med fusioner og virksomhedsovertagelser
    (Sag COMP/M.2624 — BP/Erdölchemie) (EØS-relevant tekst) (meddelt under nummer
    K(2002) 2208)'
  type: main
