    ein Unternehmen, das unrichtige und entstellte Angaben in einer Anmeldung zu einem
    Fusionskontrollverfahren gemacht hat (Fall COMP/M.2624 — BP/Erdölchemie) (Text
    von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 2208)'
  type: main
- language: da
  script: Latn
