title:
- language: en
  script: Latn
  content: '2004/285/EC: Commission Decision of 19 June 2002 pursuant to Article 14
    of Council Regulation (EEC) No 4064/89 imposing fines on an undertaking for supplying
    incorrect and misleading information in a notification in merger control proceedings
    (Case No COMP/M.2624 — BP/Erdölchemie) (Text with EEA relevance) (notified
    under document number C(2002) 2208)'
  type: main
- language: fr
  script: Latn
  content: '2004/285/CE: Décision de la Commission du 19 juin 2002 arrêtée en vertu
    de l''article 14 du règlement (CEE) n° 4064/89 du Conseil, infligeant des amendes
    à une entreprise pour communication de renseignements incorrects et mensongers
    à l''occasion d''une notification effectuée dans le cadre d''une procédure
    de contrôle d''une opération de concentration (Affaire COMP/M.2624 — BP/Erdölchemie)
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2002)
    2208]'
  type: main
- language: de
  script: Latn
  content: '2004/285/EG: Entscheidung der Kommission vom 19. Juni 2002 gemäß Artikel
