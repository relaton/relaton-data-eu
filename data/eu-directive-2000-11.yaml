    prostředků
  type: main
- language: da
  script: Latn
  content: Kommissionens femogtyvende direktiv 2000/11/EF af 10. marts 2000 om tilpasning
    til den tekniske udvikling af bilag II til Rådets direktiv 76/768/EØF om indbyrdes
    tilnærmelse af medlemsstaternes lovgivning om kosmetiske midler
  type: main
- language: el
  script: Grek
  content: Εικοστή πέμπτη οδηγία 2000/11/ΕΚ της Επιτροπής,
    της 10ης Μαρτίου 2000, σχετικά με την προσαρμογή
    στην τεχνική πρόοδο του παραρτήματος ΙΙ της
    οδηγίας 76/768/ΕΟΚ του Συμβουλίου περί προσεγγίσεως
    των νομοθεσιών των κρατών μελών των αναφερομένων
    στα καλλυντικά προϊόντα
  type: main
- language: et
  script: Latn
  content: Kahekümne viies komisjoni direktiiv 2000/11/EÜ, 10. märts 2000, millega
