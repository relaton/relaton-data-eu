    produktów kosmetycznych
  type: main
- language: pt
  script: Latn
  content: Vigésima quinta directiva 2000/11/CE da Comissão, de 10 de Março de
    2000, que adapta ao progresso técnico o anexo II da Directiva 76/768/CEE do Conselho,
