title:
- language: en
  script: Latn
  content: Twenty-Fifth Commission Directive 2000/11/EC of 10 March 2000 adapting
    to technical progress Annex II to Council Directive 76/768/EEC on the approximation
    of the laws of the Member States relating to cosmetic products
  type: main
- language: fr
  script: Latn
  content: Vingt-cinquième directive 2000/11/CE de la Commission, du 10 mars 2000,
    portant adaptation au progrès technique de l'annexe II de la directive 76/768/CEE
    du Conseil concernant le rapprochement des législations des États membres relatives
    aux produits cosmétiques
  type: main
- language: de
  script: Latn
  content: Fünfundzwanzigste Richtlinie 2000/11/EG der Kommission vom 10. März 2000
    zur Anpassung des Anhangs II der Richtlinie 76/68/EWG des Rates zur Angleichung
    der Rechtsvorschriften der Mitgliedstaaten über kosmetische Mittel an den technischen
    Fortschritt
  type: main
- language: bg
  script: Cyrl
  content: Двадесет и пета Директива 2000/11/ЕО на Комисията
