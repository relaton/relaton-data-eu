  content: Décision de la Commission n° 64/92/CEE, du 19 décembre 1963, portant
    octroi de contingents tarifaires à la République fédérale d'Allemagne pour
    les cubes, plaques, feuilles et bandes en liège naturel et pour les cubes ou
    carrés pour la fabrication des bouchons
  type: main
- language: de
  script: Latn
  content: '64/92/EWG: Entscheidung der Kommission vom 19. Dezember 1963 über die
    Gewährung von Zollkontingenten für Würfel, Platten, Blätter und Streifen aus
    Naturkork und für Würfel oder Quader zur Herstellung von Stopfen an die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/92/CEE: Decisione della Commissione, del 19 dicembre 1963, relativa
    alla concessione di contingenti tariffari alla Repubblica federale di Germania
    per i cubi, le lastre, i fogli e le strisce di sughero naturale e per i cubi o
    quadretti per la fabbricazione dei turaccioli'
  type: main
- language: nl
  script: Latn
  content: '64/92/EEG: Beschikking van de Commissie van 19 december 1963 houdende
