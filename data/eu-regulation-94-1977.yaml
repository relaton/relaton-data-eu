title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 94/77 of 17 January 1977 amending Regulation
    (EEC) No 753/76 as regards the time limit fixed for the denaturing of skimmed-milk
    powder, and Regulations (EEC) No 1948/76 and (EEC) No 2850/76 on the supply of
    skimmed-milk powder to the Italian intervention agency for use in accordance with
    Regulation (EEC) No 563/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 94/77 de la Commission, du 17 janvier 1977, modifiant
    le règlement (CEE) n° 753/76 en ce qui concerne le délai fixé pour la dénaturation
    du lait écrémé en poudre et les règlements (CEE) n°s 1948/76 et 2850/76 relatifs
    à la mise à disposition de l' organisme d' intervention italien de lait écrémé
    en poudre destiné à être utilisé conformément au règlement (CEE) n° 563/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 94/77 der Kommission vom 17. Januar 1977 zur Änderung
    der Verordnung (EWG) Nr. 753/76 hinsichtlich der Frist für die Denaturierung
    des Magermilchpulvers sowie der Verordnungen (EWG) Nr. 1948/76 und Nr. 2850/76
    über die Versorgung der italienischen Interventionsstelle mit Magermilchpulver,
    das zur Verwendung gemäß der Verordnung (EWG) Nr. 563/76 bestimmt ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 94/77 af 17. januar 1977 om ændring
    af forordning (EØF) nr. 753/76 for så vidt angår den fastsatte frist for denaturering
    af skummetmælkspulver, og forordning (EØF) nr. 1948/76 og (EØF) nr. 2850/76
    vedrørende det italienske interventionsorgans forsyning med skummetmælkspulver,
    som skal anvendes i overensstemmelse med forordning (EØF) nr. 563/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 94/77 della Commissione, del 17 gennaio 1977, che
    modifica il regolamento (CEE) n. 753/76 per quanto riguarda il termine fissato
    per la denaturazione del latte scremato in polvere, nonché i regolamenti (CEE)
    n. 1948/76 e (CEE) n. 2850 /76 che mettono a disposizione dell' organismo d' intervento
    italiano latte scremato in polvere destinato ad essere utilizzato conformemente
    al regolamento (CEE) n. 563/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 94/77 van de Commissie van 17 januari 1977 houdende
    wijziging van Verordening (EEG) nr. 753/76 ten aanzien van de voor de denaturering
    van het magere-melkpoeder vastgestelde termijn en van de Verordeningen (EEG) nr.
    1948/76 en (EEG) nr. 2850/76 met betrekking tot de terbeschikkingstelling aan
    het Italiaanse interventiebureau van magere-melkpoeder bestemd om te worden gebruikt
    overeenkomstig Verordening (EEG) nr. 563/76
  type: main
