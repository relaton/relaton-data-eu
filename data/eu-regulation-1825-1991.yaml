  content: Commission Regulation (EEC) No 1825/91 of 27 June 1991 fixing the accession
    compensatory amounts applicable to Spain to cereals for the 1991/92 marketing
    year and the coefficient to be used for calculating the amounts applicable to
    processed products
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1825/91 DE LA COMMISSION du 27 juin 1991 fixant les
