id: EUDecision1976747
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 August 1976 authorizing the United Kingdom not
    to apply Community treatment to woven fabrics of cotton, other than gauze or terry
    towelling and similar terry fabrics, unbleached, falling within heading No ex
    55.09 of the Common Customs Tariff, originating in Taiwan and in free circulation
    in Ireland
  type: main
- language: fr
  script: Latn
  content: '76/747/CEE: Décision de la Commission, du 20 août 1976, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tissus de coton, autres
    qu''à point de gaze ou boucles du genre éponge, écrus, de la position Ex 55.09
    du Tarif douanier commun, originaires de Taiwan et mis en libre pratique en Irlande'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. August 1976, mit der das Vereinigte
    Königreich ermächtigt wird, aus Taiwan stammende und in Irland im freien Verkehr
    befindliche Gewebe aus Baumwolle, andere als Drehergewebe oder Schlingengewebe
    (Frottiergewebe), roh, der Tarifnummer ex 55.09 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung anzuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. august 1976 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage vævede stoffer af bomuld,
    undtagen drejervævet stof eller håndklædefrottérstof og lignende frottérstof
    af bomuld, ubleget, som henhører under pos. ex 55.09 i den fælles toldtarif,
    har oprindelse i Taiwan og frit kan omsættes i Irland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 agosto 1976, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i tessuti di cotone, diversi da
    quelli a punto di garza o ricci del tipo spugna, grezzi, della voce ex 55.09 della
    tariffa doganale comune, originari di Taiwan e messi in libera pratica in Irlanda
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 augustus 1976 waarbij het Verenigd
    Koninkrijk wordt gemachtigd weefsels van katoen, andere dan met gaasbinding of
    dan bad- of frotteerstof (lussendoek), ongebleekt, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in Ierland in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
