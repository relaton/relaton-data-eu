title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1215/2009 of 30 November 2009 introducing exceptional
    trade measures for countries and territories participating in or linked to the
    European Union’s Stabilisation and Association process (Codified version)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1215/2009 du Conseil du 30 novembre 2009 introduisant
    des mesures commerciales exceptionnelles en faveur des pays et territoires participants
    et liés au processus de stabilisation et d’association mis en œuvre par l’Union
    européenne (Version codifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1215/2009 des Rates vom 30. November 2009 zur Einführung
    besonderer Handelsmaßnahmen für die am Stabilisierungs- und Assoziierungsprozess
    der Europäischen Union teilnehmenden oder damit verbundenen Länder und Gebiete
    (kodifizierte Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1215/2009 на Съвета от 30 ноември
    2009 година за въвеждане на изключителни търговски
    мерки за страни и територии, участващи или
    свързани с процеса на стабилизиране и асоцииране,
    осъществяван от Европейския съюз (Кодифицирана
    версия)
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1215/2009 ze dne 30. listopadu 2009 , kterým
    se zavádějí mimořádná obchodní opatření pro země a území účastnící
    se procesu stabilizace a přidružení zavedeného Evropskou unií či s tímto
    procesem spjaté (kodifikované znění)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1215/2009 af 30. november 2009 om exceptionelle
    handelsforanstaltninger for lande og territorier, der deltager i eller er knyttet
    til Den Europæiske Unions stabiliserings- og associeringsproces (Kodificeret
    udgave)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1215/2009 του Συμβουλίου,
    της 30ής Νοεμβρίου 2009 , για την εισαγωγή εκτάκτων
    εμπορικών μέτρων για χώρες και εδάφη που συμμετέχουν
    ή συνδέονται με τη διαδικασία σταθεροποίησης
    και σύνδεσης της Ευρωπαϊκής Ένωσης (Κωδικοποιημένη
    έκδοση)
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1215/2009, 30. november 2009 , millega kehtestatakse
    erandlikud kaubandusmeetmed Euroopa Liidu stabiliseerimis- ja assotsieerimisprotsessis
    osalevate või sellega seotud maade ja territooriumide suhtes (kodifitseeritud
    versioon)
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1215/2009, annettu 30 päivänä marraskuuta
    2009 , poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan unionin
    vakautus- ja assosiaatioprosessiin osallistuville tai siihen yhteydessä oleville
    maille ja alueille (Kodifioitu toisinto)
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 1215/2009 od 30. studenoga 2009. o uvođenju izvanrednih
    trgovinskih mjera za zemlje i područja koji sudjeluju u Procesu stabilizacije
    i pridruživanja Europske unije ili su s njim povezani (kodificirana verzija)
  type: main
- language: hu
  script: Latn
  content: A Tanács 1215/2009/EK rendelete ( 2009. november 30. ) az Európai Unió
    stabilizációs és társulási folyamatában részt vevő vagy ahhoz kapcsolódó
    országokra és területekre vonatkozóan kivételes kereskedelmi intézkedések
    bevezetéséről (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1215/2009 del Consiglio, del 30 novembre 2009 , recante
    misure commerciali eccezionali applicabili ai paesi e territori che partecipano
    o sono legati al processo di stabilizzazione e di associazione dell’Unione europea
    (versione codificata)
  type: main
- language: lv
  script: Latn
