    procese dalyvaujančioms arba su juo susijusioms šalims ir teritorijoms (Kodifikuota
    redakcija)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1215/2009 tat- 30 ta’ Novembru 2009 li
