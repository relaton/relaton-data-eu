    Ewropea jew li huma marbutin miegħu (Verżjoni kkodifikata)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1215/2009 van de Raad van 30 november 2009 tot vaststelling
    van uitzonderlijke handelsmaatregelen ten behoeve van de landen en gebieden die
    deelnemen aan of verbonden zijn met het stabilisatie- en associatieproces van
    de Europese Unie (gecodificeerde versie)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1215/2009 z dnia 30 listopada 2009 r. wprowadzające
    nadzwyczajne środki handlowe dla krajów i terytoriów uczestniczących lub powiązanych
    z procesem stabilizacji i stowarzyszania Unii Europejskiej (Wersja ujednolicona)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1215/2009 do Conselho, de 30 de Novembro de 2009
    , que adopta medidas comerciais excepcionais em favor dos países e territórios
    que participam ou estão ligados ao processo de estabilização e associação
    da União Europeia (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1215/2009 al Consiliului din 30 noiembrie 2009 privind
    introducerea unor măsuri comerciale excepționale în favoarea țărilor și
    teritoriilor participante și legate de procesul de stabilizare și de asociere
    pus în aplicare de către Uniunea Europeană (Versiune codificată)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1215/2009 z 30. novembra 2009 , ktorým sa zavádzajú
    výnimočné obchodné opatrenia pre krajiny a územia zúčastňujúce sa na
    procese stabilizácie a pristúpenia k Európskej únii (kodifikované znenie)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1215/2009 z dne 30. novembra 2009 o uvedbi izjemnih
