title:
- language: en
  script: Latn
  content: Directive 2004/38/EC of the European Parliament and of the Council of 29
    April 2004 on the right of citizens of the Union and their family members to move
    and reside freely within the territory of the Member States amending Regulation
    (EEC) No 1612/68 and repealing Directives 64/221/EEC, 68/360/EEC, 72/194/EEC,
    73/148/EEC, 75/34/EEC, 75/35/EEC, 90/364/EEC, 90/365/EEC and 93/96/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 2004/38/CE du Parlement européen et du Conseil du 29 avril 2004
    relative au droit des citoyens de l'Union et des membres de leurs familles de
    circuler et de séjourner librement sur le territoire des États membres, modifiant
    le règlement (CEE) n° 1612/68 et abrogeant les directives 64/221/CEE, 68/360/CEE,
    72/194/CEE, 73/148/CEE, 75/34/CEE, 75/35/CEE, 90/364/CEE, 90/365/CEE et 93/96/CEE
  type: main
- language: de
  script: Latn
