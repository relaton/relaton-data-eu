    règlement (UE) 2023/915 en ce qui concerne les teneurs maximales pour la somme
    du 3-monochloropropanediol (3-MCPD) et de ses esters d’acides gras dans les
    préparations pour nourrissons, préparations de suite, denrées alimentaires
    destinées à des fins médicales spéciales pour les nourrissons et les enfants
    en bas âge et préparations pour enfants en bas âge
  type: main
- language: de
  script: Latn
