    di 3-monocloropropandiolo (3-MCPD) e 3-MCPD esteri degli acidi grassi nelle formule
    per lattanti, nelle formule di proseguimento, negli alimenti a fini medici speciali
    destinati ai lattanti e ai bambini nella prima infanzia e nelle formule per bambini
    nella prima infanzia
  type: main
