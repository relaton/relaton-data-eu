title:
- language: en
  script: Latn
  content: '98/351/EC: Commission Decision of 29 May 1998 setting the date on which
    dispatch from Northern Ireland of bovine products under the Export Certified Herds
    Scheme may commence by virtue of Article 6(5) of Council Decision 98/256/EC'
  type: main
- language: fr
  script: Latn
  content: '98/351/CE: Décision de la Commission du 29 mai 1998 fixant la date à
    partir de laquelle les expéditions d''Irlande du Nord de produits provenant de
    bovins peuvent débuter dans le cadre du régime d''exportation de troupeaux certifiés
    en vertu de l''article 6, paragraphe 5, de la décision 98/256/CE du Conseil'
  type: main
- language: de
  script: Latn
  content: '98/351/EG: Entscheidung der Kommission vom 29. Mai 1998 zur Festsetzung
    des Datums, ab dem die Versendung aus Nordirland von Rindererzeugnissen im Rahmen
    der Regelung zur Freigabe von Herden für die Ausfuhr (Export Certified Herds
    Scheme) gemäß Artikel 6 Absatz 5 der Entscheidung 98/256/EG des Rates aufgenommen
    werden darf'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. května 1998, kterým se stanoví datum,
    od kterého může začít odesílání produktů ze skotu ze Severního Irska
    v rámci vývozního režimu osvědčených stád podle čl. 6 odst. 5 rozhodnutí
    Rady 98/256/ES
  type: main
- language: da
  script: Latn
  content: '98/351/EF: Kommissionens beslutning af 29. maj 1998 om fastsættelse af
    datoen, på hvilken forsendelse af oksekødsprodukter fra Nordirland under ordningen
    for besætninger, der opfylder betingelserne for eksport, må begynde, jf. artikel
    6, stk. 5, i Rådets beslutning 98/256/EF'
  type: main
- language: el
  script: Grek
  content: '98/351/ΕΚ: Απόφαση της Επιτροπής της 29ης Μαΐου
    1998 για τον καθορισμό της ημερομηνίας από την
    οποία επιτρέπεται να αρχίσουν να αποστέλλονται
    από τη Βόρεια Ιρλανδία προϊόντα βοοειδών στο
    πλαίσιο του προγράμματος εξαγωγών από πιστοποιημένες
    αγέλες, δυνάμει του άρθρου 6 παράγραφος 5 της
    απόφασης 98/256/ΕΚ του Συμβουλίου'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. mai 1998, millega määratakse kindlaks kuupäev,
    millal võib Põhja-Iirimaalt alustada eksporditavate karjade sertifitseerimise
    skeemi alusel veiselihatoodete saatmist vastavalt nõukogu otsuse 98/256/EÜ artikli
    6 lõikele 5
  type: main
- language: fi
  script: Latn
  content: '98/351/EY: Komission päätös, tehty 29 päivänä toukokuuta 1998, päivämäärästä,
    jona naudanlihatuotteiden toimittamisen saa aloittaa vientiin tarkoitettujen karjojen
    varmentamisjärjestelmän (Export Certified Herds Scheme) mukaisesti neuvoston
    päätöksen 98/256/EY 6 artiklan 5 kohdan nojalla'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1998. május 29.) a szarvasmarhaféléből készült
    termékeknek az exportképes állományokat igazoló rendszer keretében Észak-Írországból
    történő szállítása megkezdésére vonatkozó időpontnak a 98/256/EK határozat
    6. cikke (5) bekezdésével összhangban történő megállapításáról
  type: main
- language: it
  script: Latn
  content: '98/351/CE: Decisione della Commissione del 29 maggio 1998 che fissa la
    data in cui possono iniziare le spedizioni dall''Irlanda del Nord di prodotti
    ottenuti da bovini, nel quadro del programma di esportazione di mandrie certificate,
    a norma dell''articolo 6, paragrafo 5, della decisione 98/256/CE della Commissione'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1998. gada 29. maijs), ar ko atbilstīgi Padomes Lēmuma
    98/256/EK 6. panta 5. punktam nosaka dienu, no kuras Ziemeļīrija var sākt govju
    produktu nosūtīšanu saskaņā ar eksportam sertificētu ganāmpulku sistēmu
  type: main
- language: lt
  script: Latn
  content: 1998 m. gegužės 29 d. Komisijos sprendimas, nustatantis datą, kada iš
    Šiaurės Airijos pagal Eksportui sertifikuotų bandų schemą galima pradėti
    siųsti galvijienos produktus, taikant Tarybos sprendimo 98/256/EB 6 straipsnio
    5 dalį
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta’ Mejju 1998 li tiffissa d-data
    li fiha jistgħu jibdew jintbagħtu prodotti bovini mill-Irlanda ta’ Fuq taħt
    l-Iskema ta’ Merħliet Iċċertifikati għall-Esportazzjoni bis-setgħa ta’
    l-Artikolu 6(5) tad-Deċiżjoni tal-Kunsill Nru 98/256/KE
  type: main
- language: nl
  script: Latn
  content: '98/351/EG: Beschikking van de Commissie van 29 mei 1998 houdende vaststelling
    van de datum waarop mag worden begonnen met de verzending, in het kader van de
    "Export Certified Herds Scheme" van van runderen verkregen producten uit Noord-Ierland,
    op grond van artikel 6, lid 5, van Beschikking 98/256/EG van de Raad'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 maja 1998 r. ustalająca datę rozpoczęcia wysyłania
    produktów bydlęcych z Irlandii Północnej w ramach systemu kwalifikowania stad
    do wywozu na mocy art. 6 ust. 5 decyzji Rady 98/256/WE
  type: main
- language: pt
  script: Latn
  content: '98/351/CE: Decisão da Comissão de 29 de Maio de 1998 que, por força
    do nº 5 do artigo 6º da Decisão 98/256/CE do Conselho, fixa a data em que pode
    ser iniciada a expedição, a partir da Irlanda do Norte, de produtos derivados
    de bovinos a título do regime de efectivos autorizados para exportação'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. mája 1998 ktorým sa stanovuje dátum, odkedy
    môže začať expedícia hovädzích produktov zo Severného Írska podľa Schémy
    stád certifikovaných na vývoz na základe článku 6 ods. 5 rozhodnutia Rady
    98/256/ES
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. maja 1998 o določitvi datuma, s katerim se
    lahko na podlagi člena 6(5) Odločbe Sveta 98/256/ES prične odpremljanje izdelkov
    iz mesa govedi v skladu s programom certificiranih čred za izvoz
  type: main
- language: es
  script: Latn
  content: '98/351/CE: Decisión de la Comisión de 29 de mayo de 1998 por la que,
    de conformidad con el apartado 5 del artículo 6 de la Decisión 98/256/CE del
    Consejo, se fija la fecha en la que podrá iniciarse la expedición desde Irlanda
    del Norte de productos elaborados con carne de animales de la especie bovina en
    el marco del régimen de exportación de ganado certificado'
  type: main
- language: sv
  script: Latn
  content: '98/351/EG: Kommissionens beslut av den 29 maj 1998 om fastställande,
    i enlighet med artikel 6.5 i rådets beslut 98/256/EG, av det datum då sändningarna
    av nötköttsprodukter från Nordirland enligt programmet för djurbesättningar
    med exportintyg får påbörjas'
