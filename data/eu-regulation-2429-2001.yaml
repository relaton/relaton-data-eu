  script: Latn
  content: Komisjoni määrus (EÜ) nr 2429/2001, 12. detsember 2001, millega muudetakse
    määrust (EÜ) nr 1623/2000, milles sätestatakse veinituru ühist korraldust
    käsitleva määruse (EÜ) nr 1493/1999 üksikasjalikud rakenduseeskirjad turumehhanismide
