title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2429/2001 of 12 December 2001 amending Regulation
    (EC) No 1623/2000 laying down detailed rules for implementing Council Regulation
    (EC) No 1493/1999 on the common organisation of the market in wine with regard
    to market mechanisms and amending Regulation (EC) No 442/2001 opening crisis distillation
    as provided for in Article 30 of Council Regulation (EC) No 1493/1999 for table
    wines in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2429/2001 de la Commission du 12 décembre 2001 modifiant
    le règlement (CE) n° 1623/2000 fixant les modalités d'application du règlement
    (CE) n° 1493/1999 du Conseil portant organisation commune du marché vitivinicole,
    en ce qui concerne les mécanismes de marché et modifiant le règlement (CE)
    n° 442/2001 ouvrant la distillation de crise visée à l'article 30 du règlement
    (CE) n° 1493/1999 du Conseil pour les vins de table au Portugal
  type: main
- language: de
  script: Latn
