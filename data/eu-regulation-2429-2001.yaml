    Verordnung (EG) Nr. 1493/1999 des Rates über die gemeinsame Marktorganisation
    für Wein bezüglich der Marktmechanismen und zur Änderung der Verordnung (EG)
    Nr. 442/2001 zur Eröffnung der Dringlichkeitsdestillation gemäß Artike 30 der
    Verordnung (EG) Nr. 1493/1999 des Rates für Tafelweine in Portugal
  type: main
