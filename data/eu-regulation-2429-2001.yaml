    puhul määruse (EÜ) nr 1493/1999 artikliga 30 ettenähtud erakorralist destilleerimist
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2429/2001, annettu 12 päivänä joulukuuta 2001,
    viinin yhteisestä markkinajärjestelystä annetun neuvoston asetuksen (EY) N:o
    1493/1999 soveltamista koskevista yksityiskohtaisista säännöistä markkinamekanismien
    osalta annetun asetuksen (EY) N:o 1623/2000 ja neuvoston asetuksen (EY) N:o 1493/1999
    30 artiklassa tarkoitetun erityisen tislaustoimenpiteen aloittamisesta Portugalissa
    pöytäviinien osalta annetun asetuksen (EY) N:o 442/2001 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2429/2001/EK rendelete (2001. december 12.) a piaci mechanizmusokra
    tekintettel a borpiac közös szervezéséről szóló 1493/1999/EK rendelet végrehajtása
    részletes szabályainak megállapításáról szóló 1623/2000/EK rendelet módosításáról,
    valamint az 1493/1999/EK tanácsi rendelet 30. cikkében előírt krízislepárlásnak
    a portugáliai asztali borokra vonatkozóan történő megindításáról szóló
    442/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2429/2001 della Commissione, del 12 dicembre 2001,
    che modifica il regolamento (CE) n. 1623/2000 recante modalità d'applicazione
    del regolamento (CE) n. 1493/1999 del Consiglio, relativo all'organizzazione comune
    del mercato vitivinicolo, per quanto riguarda i meccanismi di mercato e recante
    modifica del regolamento (CE) n. 442/2001 recante apertura della distillazione
    di crisi di cui all'articolo 30 del regolamento (CE) n. 1493/1999 del Consiglio
    per taluni vini in Portogallo
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2429/2001 (2001. gada 12. decembris), ar kuru
    groza Regulu (EK) Nr. 1623/2000, ar ko paredz sīki izstrādātus noteikumus Padomes
    Regulas (EK) Nr. 1493/1999 par vīna tirgus kopīgo organizāciju ieviešanai,
    attiecībā uz tirgus mehānismiem, un groza Regulu (EK) Nr. 442/2001, ar ko Portugālē
    attiecībā uz galda vīniem paredz sākt Padomes Regulas (EK) Nr. 1493/1999 30.
    pantā paredzēto krīzes destilāciju
  type: main
- language: lt
  script: Latn
  content: 2001 m. gruodžio 12 d. Komisijos reglamentas (EB) Nr. 2429/2001, iš dalies
    keičiantis Reglamentą (EB) Nr. 1623/2000, nustatantį išsamias Tarybos reglamento
    (EB) Nr. 1493/1999 dėl bendro vyno rinkos organizavimo įgyvendinimo taisykles,
    susijusias su rinkos mechanizmais, ir iš dalies pakeičiantis Reglamentą (EB)
    Nr. 442/2001, pradedantį taikyti Portugalijos stalo vynams distiliavimą krizės
    atveju, numatytą Tarybos reglamento (EB) Nr. 1493/1999 30 straipsnyje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2429/2001 tat-12 ta’ Diċembru
    2001 li jemenda r-Regolament (KE) Nru 1623/2000 li jistabbilixxi regoli dettaljati
    għall-implimentazzjoni tar-Regolament tal-Kunsill (KE) Nru 1493/1999 fuq l-organizzazzjoni
    komuni tas-suq ta’ l-inbid dwar mekkaniżmi tas-suq, u li jemenda r-Regolament
    (KE) Nru 442/2001 dwar ftuħ ta’ distillazzjoni ta’ kriżi, kif imsemmi fl-Artikolu
    30 tar-Regolament tal-Kunsill (KE) Nru 1493/1999 għal inbejjed tal-mejda fil-Portugall
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2429/2001 van de Commissie van 12 december 2001 houdende
    wĳziging van Verordening (EG) nr. 1623/2000 tot vaststelling van de uitvoeringsbepalingen
    met betrekking tot de marktmechanismen als bedoeld in Verordening (EG) nr. 1493/1999
    van de Raad houdende een gemeenschappelĳke ordening van de wĳnmarkt, en houdende
    wĳziging van Verordening (EG) nr. 442/2001 tot opening van de in artikel 30 van
    Verordening (EG) nr. 1493/1999 van de Raad bedoelde crisisdistillatie voor tafelwĳn
    in Portugal
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2429/2001 z dnia 12 grudnia 2001 r. zmieniające
    rozporządzenie (WE) nr 1623/2000 ustalające szczegółowe zasady wykonywania
    rozporządzenia (WE) nr 1493/1999 w sprawie wspólnej organizacji rynku wina w
    zakresie mechanizmów rynkowych oraz zmieniające rozporządzenie (WE) nr 442/2001
    otwierające destylację interwencyjną, przewidzianą w artykule 30 rozporządzenia
    Rady (WE) nr 1493/1999 w odniesieniu do win stołowych w Portugalii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2429/2001 da Comissão, de 12 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 1623/2000 que fixa, no respeitante aos mecanismos
    de mercado, as regras de execução do Regulamento (CE) n.° 1493/1999 do Conselho
    que estabelece a organização comum do mercado vitivinícola, e o Regulamento
    (CE) n.° 442/2001 que abre a destilação de crise referida no artigo 30.° do
    Regulamento (CE) n.° 1493/1999 do Conselho para os vinhos de mesa em Portugal
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2429/2001 al Comisiei din 12 decembrie 2001 de modificare
    a Regulamentului (CE) nr. 1623/2000 de stabilire a normelor de aplicare a Regulamentului
    (CE) nr. 1493/1999 al Consiliului privind organizarea comună a pieței vitivinicole
    în ceea ce privește mecanismele pieței și de modificare a Regulamentului (CE)
    nr. 442/2001 privind inițierea distilării de criză, în conformitate cu articolul
    30 din Regulamentul (CE) nr. 1493/1999 al Consiliului, pentru vinurile de masă
    din Portugalia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2429/2001 z 12. decembra 2001, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1623/2000 stanovujúce podrobné pravidlá implementácie
    nariadenia Rady (ES) č. 1493/1999 o spoločnom organizovaní trhu s vínom, týkajúce
    sa trhových mechanizmov, a ktorým sa mení a dopĺňa nariadenie (ES) č. 442/2001
    otvárajúce krízovú destiláciu, ako stanovuje článok 30 nariadenia Rady
    (ES) č. 1493/1999 pre stolové vína v Portugalsku
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2429/2001 z dne 12. decembra 2001 o spremembi
    Uredbe (ES) št. 1623/2000 o določitvi podrobnih izvedbenih pravil za Uredbo
    Sveta (ES) št. 1493/1999 o skupni ureditvi trga z vinom ob upoštevanju tržnih
    mehanizmov in o spremembi Uredbe (ES) št. 442/2001 o odprtju krizne destilacije,
    kakor je predvideno v členu 30 Uredbe Sveta (ES) št. 1493/1999 za namizna vina
    na Portugalskem
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2429/2001 de la Comisión, de 12 de diciembre de 2001,
    que modifica el Reglamento (CE) n° 1623/2000 por el que se fijan las disposiciones
    de aplicación del Reglamento (CE) n° 1493/1999 del Consejo por el que se establece
    la organización común del mercado vitivinícola, en lo que respecta a los mecanismos
    de mercado, y que modifica el Reglamento (CE) n° 442/2001 que abre la destilación
    de crisis mencionada en el artículo 30 del Reglamento (CE) n° 1493/1999 del
    Consejo para los vinos de mesa de Portugal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2429/2001 av den 12 december 2001 om
    ändring av förordning (EG) nr 1623/2000 om tillämpningsföreskrifter för rådets
    förordning (EG) nr 1493/1999 om den gemensamma organisationen av marknaden för
    vin vad beträffar marknadsmekanismerna, och ändring av förordning (EG) nr 442/2001
    om krisdestillation av bordsviner i Portugal enligt artikel 30 i rådets förordning
    (EG) nr 1493/1999
