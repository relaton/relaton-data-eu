title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1101/95 of 24 April 1995 amending Regulation
    (EEC) No 1785/81 on the common organization of the market in the sugar sector
    and Regulation (EEC) No 1010/86 laying down general rules for the production refund
    on certain sugar products used in the chemical industry
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1101/95 du Conseil du 24 avril 1995 modifiant le règlement
    (CEE) n° 1785/81 portant organisation commune des marchés dans le secteur du
    sucre et le règlement (CEE) n° 1010/86 établissant les règles générales
    applicables à la restitution à la production pour certains produits du secteur
    sucre utilisés dans l'industrie chimique
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1101/95 des Rates vom 24. April 1995 zur Änderung
    der Verordnung (EWG) Nr. 1785/81 über die gemeinsame Marktorganisation für Zucker
    und der Verordnung (EWG) Nr. 1010/86 zur Festlegung der Grundregeln für die Produktionserstattung
    bei der Verwendung von bestimmten Erzeugnissen des Zuckersektors in der chemischen
    Industrie
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 1101/95 af 24. april 1995 om ændring af forordning
    (EØF) nr. 1785/81 om den fælles markedsordning for sukker og af forordning (EØF)
    nr. 1010/86 om almindelige regler for produktionsrestitutioner for visse produkter
    fra sukkersektoren, der anvendes i den kemiske industri
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1101/95 του Συμβουλίου
    της 24ης Απριλίου 1995 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1785/81 περί κοινής οργανώσεως των αγορών
    στον τομέα της ζάχαρης και του κανονισμού (ΕΟΚ)
    αριθ. 1010/86 που θεσπίζει τους γενικούς κανόνες
    που εφαρμόζονται στην επιστροφή στην παραγωγή
    για ορισμένα προϊόντα του τομέα της ζάχαρης
    τα οποία χρησιμοποιούνται στη χημική βιομηχανία
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1101/95, annettu 24 päivänä huhtikuuta 1995,
    sokerialan yhteisestä markkinajärjestelystä annetun asetuksen (ETY) N:o 1785/81
    ja tiettyjen kemianteollisuudessa käytettävien sokerialan tuotteiden tuotantotukeen
    sovellettavista yleisistä säännöistä annetun asetuksen (ETY) N:o 1010/86
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1101/95 del Consiglio del 24 aprile 1995 recante modifica
    del regolamento (CEE) n. 1785/81 relativo all'organizzazione comune dei mercati
    nel settore dello zucchero nonché del regolamento (CEE) n. 1010/86 che stabilisce
    le norme generali applicabili alla restituzione alla produzione per alcuni prodotti
    nel settore dello zucchero utilizzati nell'industria chimica
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1101/95 van de Raad van 24 april 1995 tot wijziging
    van Verordening (EEG) nr. 1785/81 houdende een gemeenschappelijke ordening der
    markten in de sector suiker en van Verordening (EEG) nr. 1010/86 houdende vaststelling
    van de algemene voorschriften inzake de restitutie bij de produktie voor bepaalde
    in de chemische industrie gebruikte produkten van de sector suiker
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1101/95 do Conselho de 24 de Abril de 1995 que altera
    o Regulamento (CEE) nº 1785/81, que estabelece a organização comum de mercado
    no sector do açúcar, e o Regulamento (CEE) nº 1010/86, que estabelece as regras
    gerais aplicáveis à restituição à produção para determinados produtos do
    sector do açúcar utilizados na indústria química
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1101/95 del Consejo de 24 de abril de 1995 por el que
    se modifica el Reglamento (CEE) n° 1785/81 por el que se establece la organización
    común de mercados en el sector del azúcar y el Reglamento (CEE) n 1010/86 por
    el que se establecen las normas generales aplicables a la restitución a la producción
    para determinados productos del sector del azúcar utilizados en la industria
    química
  type: main
- language: sv
  script: Latn
