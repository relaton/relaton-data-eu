title:
- language: en
  script: Latn
  content: '2010/670/EU: Commission Decision of 3 November 2010 laying down criteria
    and measures for the financing of commercial demonstration projects that aim at
    the environmentally safe capture and geological storage of CO 2 as well as demonstration
    projects of innovative renewable energy technologies under the scheme for greenhouse
    gas emission allowance trading within the Community established by Directive 2003/87/EC
    of the European Parliament and of the Council (notified under document C(2010)
    7499)'
  type: main
- language: fr
  script: Latn
  content: '2010/670/UE: Décision de la Commission du 3 novembre 2010 établissant
    les critères et les mesures pour le financement de projets commerciaux de démonstration
    axés sur le captage et le stockage géologique du CO 2 sans danger pour l’environnement,
    ainsi que de projets de démonstration de technologies innovantes liées aux énergies
    renouvelables, dans le cadre du système d’échange de quotas d’émission
    de gaz à effet de serre dans la Communauté établi par la directive 2003/87/CE
    du Parlement européen et du Conseil [notifiée sous le numéro C(2010) 7499]'
  type: main
- language: de
  script: Latn
  content: '2010/670/EU: Beschluss der Kommission vom 3. November 2010 über Kriterien
    und Maßnahmen für die Finanzierung von kommerziellen Demonstrationsprojekten,
    die auf eine umweltverträgliche Abscheidung und geologische Speicherung von CO
    2 abzielen, und von Demonstrationsprojekten für innovative Technologien für
    erneuerbare Energien im Rahmen des Gemeinschaftssystems für den Handel mit Treibhausgasemissionszertifikaten
    nach der Richtlinie 2003/87/EG des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen K(2010) 7499)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/670/ЕС: Решение на Комисията от 3 ноември
    2010 година за определяне на критерии и мерки
