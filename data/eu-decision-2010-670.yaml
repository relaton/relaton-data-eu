    със стопански характер за безопасно за околната
    среда улавяне и съхранение в геоложки обекти
    на CO 2 , както и за финансирането на демонстрационни
    проекти за новаторски технологии за възобновяема
    енергия, чрез схемата за търговия с квоти за
    емисии на парникови газове в Общността, въведена
    с Директива 2003/87/ЕО на Европейския парламент
    и на Съвета (нотифицирано под номер C(2010) 7499)'
  type: main
- language: cs
  script: Latn
  content: '2010/670/EU: Rozhodnutí Komise ze dne 3. listopadu 2010 , kterým se
