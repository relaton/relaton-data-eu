title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1092/89 of 27 April 1989 specifying the
    extent to which applications lodged in April 1989 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1092/89 de la Commission, du 27 avril 1989, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'avril 1989 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1092/89 der Kommission vom 27. April 1989 über das
    Ausmaß, in dem den im April 1989 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1092/89 af 27. april 1989 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i april
    1989 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1092/89 της Επιτροπής
    της 27ης Απριλίου 1989 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο του 1989, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1092/89 della Commissione, del 27 aprile 1989, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di aprile 1989 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1092/89 van de Commissie van 27 april 1989 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in april 1989 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1092/89 da Comissão, de 27 de Abril de 1989, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Abril de 1989 para os bovinos machos jovens
    destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1092/89 de la Comisión, de 27 de abril de 1989, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de abril de 1989 respecto a
    los jóvenes bovinos machos destinados al engorde
  type: main
