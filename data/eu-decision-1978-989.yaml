title:
- language: en
  script: Latn
  content: '78/989/EEC: Commission Decision of 20 November 1978 authorizing the French
    Republic not to apply Community treatment to natural honey, falling within heading
    No 04.06 of the Common Customs Tariff, originating in Mexico and Argentina and
    in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/989/CEE: Décision de la Commission, du 20 novembre 1978, autorisant
    la République française à exclure du traitement communautaire le miel naturel
    de la position 04.06 du tarif douanier commun originaire du Mexique et de l''
    Argentine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/989/EWG: Entscheidung der Kommission vom 20. November 1978, mit der
    die Französische Republik ermächtigt wird, aus Mexiko und Argentinien stammenden
    und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen natürlichen
    Honig der Tarifnummer 04.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/989/EØF: Kommissionens beslutning af 20. november 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage naturlig honning,
    som henhører under pos. 04.06 i den fælles toldtarif, har oprindelse i Mexiko
    og Argentina og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/989/CEE: Decisione della Commissione, del 20 novembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il miele naturale
    della voce 04.06 della tariffa doganale comune, originario del Messico e dell''
    Argentina e messo in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/989/EEG: Beschikking van de Commissie van 20 november 1978 waarbij
    de Franse Republiek wordt gemachtigd natuurhonig van post 04.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit Mexico en Argentinië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
