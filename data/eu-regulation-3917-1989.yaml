    Spanje mag toepassen, en van enige uitvoeringsbepalingen ter zake #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3917/89 DA COMISSAO de 20 de Dezembro de 1989 que
