title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2704/82 of 7 October 1982 re-establishing
    the levying of customs duties on pontaerythritol, falling within subheading 29.04
    C ex I and originating in Chile, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2704/82 de la Commission, du 7 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables au pentaérythritol,
    de la sous-position 29.04 C ex I du tarif douanier commun, originaire du Chili,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2704/82 der Kommission vom 7. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Pentaerythritol (Pentaerythrit) der Tarifstelle 29.04
    C ex I, mit Ursprung in Chile, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2704/82 af 7. oktober 1982 om genindførelse
    af opkrævning af told for pentaerythritol, henhørende under pos. 29.04 C ex
    I og med oprindelse i Chile, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81o
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2704/82 τής Επιτροπής
    τής 7ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τήν πενταερυθριτόλη
    τής διακρίσεως 29. 04 Γ ex I τού Κοινού Δασμολογίου,
    καταγωγής Χιλής, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2704/82 della Commissione, del 7 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili al pentaeritritolo, della
    sottovoce 29.04 C ex I della tariffa doganale comune, originario del Cile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2704/82 van de Commissie van 7 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op pentaërythritol
    (pentaërythriet) van postonderverdeling 29.04 C ex I van het gemeenschappelijk
    douanetarief, van oorsprong uit Chili, waarvoor de in Verordening (EEG) nr. 3601/81
    van de Raad vermelde tariefpreferenties zijn verleend
