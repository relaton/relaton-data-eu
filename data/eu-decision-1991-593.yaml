title:
- language: en
  script: Latn
  content: '91/593/EEC: Commission Decision of 5 November 1991 amending Decision 89/152/EEC
    authorizing certain Member States to provide for exceptions to certain provisions
    of Council Directive 77/93/EEC in respect of potatoes for human consumption originating
    in Cuba (Only the German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/593/CEE: Décision de la Commission du 5 novembre 1991 modifiant la
    décision 89/152/CEE autorisant certains États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE pour les pommes de terre de
    consommation originaires de Cuba (Les textes en langues allemande, française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 5. November 1991 zur Änderung der Entscheidung
    89/152/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für Speisekartoffeln
    mit Ursprung in Kuba Ausnahmen von einigen Vorschriften der Richtlinie 77/93/EWG
    des Rates vorzusehen (Nur der deutsche, der französische und der niederländische
    Text sind verbindlich) (91/593/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 5. november 1991 om ændring af beslutning
    89/152/EØF om bemyndigelse af visse medlemsstater til at fastsætte undtagelser
    fra visse bestemmelser i Rådets direktiv 77/93/EØF for spisekartofler med oprindelse
    i Cuba (Kun de franske, nederlandske og tyske udgaver er autentiske) (91/593/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '91/593/ΕΟΚ: Απόφαση της Επιτροπής, της 5ης
    Νοεμβρίου 1991, που τροποποιεί την απόφαση 89/152/ΕΟΚ
    η οποία επιτρέπει σε ορισμένα κράτη μέλη να
    προβλέψουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά
    με τις πατάτες για ανθρώπινη κατανάλωση καταγωγής
    Κούβας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 5 novembre 1991 recante modifica della
    decisione 89/152/CEE che autorizza taluni Stati membri a prevedere deroghe, per
    le patate da consumo originarie di Cuba, ad alcune disposizioni della direttiva
    77/93/CEE (I testi in lingua francese, olandese e tedesca sono i soli facenti
    fede) (91/593/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 5 november 1991 tot wijziging van Beschikking
    89/152/EEG waarbij bepaalde Lid-Staten worden gemachtigd om voor consumptieaardappelen
    van oorsprong uit Cuba uitzonderingen op sommige bepalingen van Richtlijn 77/93/EEG
    toe te staan (Slechts de teksten in de Duitse, de Franse en de Nederlandse taal
    zijn authentiek) (91/593/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 5 de Novembro de 1991 que altera a Decisão 89/152/CEE,
    que autoriza certos Estados- membros a derrogar a determinadas normas da Directiva
    77/93/CEE em relação à batata de consumo originária de Cuba (Apenas fazem
    fé os textos nas línguas alemã, francesa e neerlandesa) (91/593/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 5 de noviembre de 1991 por la que se modifica
    la Decisión 89/152/CEE, por la que se autoriza a determinados Estados miembros
    para prever excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    respecto de las patatas destinadas al consumo humano, originarias de Cuba (Los
    textos en lenguas alemana, francesa y neerlandesa son los únicos auténticos)
    (91/593/CEE) #'
