title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juin 1969, autorisant la République
    française en vertu de l'article 115 alinéa 1 du Traité, à exclure du traitement
    communautaire les "autres jouets; modèles réduits pour le divertissement", de
    la position 97.03 B du Tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '69/217/EWG: Entscheidung der Kommission vom 30. Juni 1969, mit der die
    Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, "anderes Spielzeug; Modelle zum Spielen" der Tarifnummer 97.03 B des Gemeinsamen
    Zolltarifs, die aus Japan stammen und sich in den übrigen Mitgliedstaaten im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/217/CEE: Decisione della Commissione, del 30 giugno 1969, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo comma, del trattato,
    ad escludere dal trattamento comunitario gli «altri giocattoli ; modelli ridotti
    per divertimento», della voce 97.03 B della TDC originari del Giappone e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/217/EEG: Beschikking van de Commissie van 30 juni 1969 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea van het Verdrag
    ander speelgoed, modellen op schaal voor ontspanning, van post 97.03 B van het
    gemeenschappelijk douanetarief, die van oorsprong zijn uit Japan en in andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
