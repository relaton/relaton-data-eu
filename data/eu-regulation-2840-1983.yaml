title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2840/83 of 10 October 1983 re-establishing
    the levying of customs duties on stranded wire, cables, cordage, ropes, plaited
    bands, slings and the like, falling within heading No 73.25 and originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2840/83 de la Commission du 10 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux câbles,
    cordages, tresses, élingues et similaires, de la position 73.25 du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2840/83 der Kommission vom 10. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Kabel, Seile, Litzen, Seilschlingen und ähnliche
    Waren der Tarifnummer 73.25, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2840/83 af 10. oktober 1983 om genindførelse
    af opkrævning af told for snoet tråd, kabler, tovværk, flettede bånd, stropper
    o.l. henhørende under pos. 73.25 og med oprindelse i Sydkorea, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2840/83 της Επιτροπής
    της 10ης Οκτωβρίου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για καλώδια, σχοινία, πλεξίδες,
    περιλάβεια (σαμπάνια) και τα παρόμοια, της κλάσεως
    73.25 του Κοινού Δασμολογίου, καταγωγής Νότιας
    Κορέας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2840/83 della Commissione del 10 ottobre 1983 che
    ripristina la riscossione dei dazi doganali applicabili a cavi, corde, trecce,
    brache e simili, della voce 73.25 della tariffa doganale comune, originari della
    Corea del Sud beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2840/83 van de Commissie van 10 oktober 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kabel, geslagen
    of gevlochten, lengen en dergelijke kabels, van tariefpost 73.25, van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
