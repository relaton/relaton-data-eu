  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 131/1999, annettu 21 päivänä tammikuuta 1999,
    Norjasta peräisin olevan viljellyn merilohen tiettyyn tuontiin sovellettavien
    väliaikaisten polkumyynti- ja tasoitustullien käyttöönotosta annetun komission
    asetuksen (EY) N:o 2249/98 ja Norjasta peräisin olevan viljellyn merilohen tuontia
    koskevien polkumyynnin ja tukien vastaisten menettelyjen yhteydessä esitettyjen
    sitoumusten hyväksymisestä tehdyn komission päätöksen 97/634/EY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 131/1999 della Commissione del 21 gennaio 1999 recante
    modifica del regolamento (CE) n. 2249/98 che istituisce dazi antidumping e dazi
    compensativi definitivi sulle importazioni di salmone d'allevamento dell'Atlantico
    originario della Norvegia, per quanto riguarda determinati esportatori, e modifica
    la decisione 97/634/CE che accetta gli impegni offerti in relazione ai procedimenti
    antidumping e antisovvenzioni nei confronti delle importazioni di salmone dell'Atlantico
    di allevamento originario della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 131/1999 van de Commissie van 21 januari 1999 tot
    wijziging van Verordening (EG) nr. 2249/98 tot instelling van een voorlopig antidumpingrecht
    en een voorlopig compenserend recht op de invoer van gekweekte Atlantische zalm
    van oorsprong uit Noorwegen ten aanzien van bepaalde exporteurs en tot wijziging
    van Besluit 97/634/EG tot aanvaarding van verbintenissen die zijn aangeboden in
    het kader van de antidumping- en antisubsidieprocedures betreffende de invoer
    van gekweekte Atlantische zalm van oorsprong uit Noorwegen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 131/1999 da Comissão de 21 de Janeiro de 1999 que
    altera o Regulamento (CE) n.o 2249/98 que institui direitos anti-dumping provisórios
    e de compensação sobre certas importações de salmão do Atlântico de viveiro
    originário da Noruega e que altera a Decisão 97/634/CE que aceita os compromissos
    oferecidos no âmbito dos processos anti-dumping e anti-subvenções relativos
    às importações de salmão do Atlântico de viveiro originário da Noruega
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 131/1999 de la Comisión de 21 de enero de 1999 por
    el que se modifica el Reglamento (CE) nº 2249/98 por el que se establecen derechos
    antidumping y derechos compensatorios provisionales sobre determinadas importaciones
    de salmón atlántico de piscifactoría originario de Noruega y por el que se
    modifica la Decisión 97/634/CE por la que se aceptan los compromisos ofrecidos
    con respecto a los procedimientos antidumping y antisubvenciones relativos a las
    importaciones de salmón atlántico de piscifactoría originario de Noruega
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 131/1999 av den 21 januari 1999 om ändring,
    vad beträffar vissa exportörer, av förordning (EG) nr 2249/98 rörande införande
    av preliminära antidumpnings- och utjämningstullar på viss import av odlad
    atlantlax med ursprung i Norge och om ändring av beslut 97/634/EG om godtagande
    av åtaganden som gjorts i samband med antidumpnings- och antisubventionsförfarandena
    rörande import av odlad atlantlax med ursprung i Norge
