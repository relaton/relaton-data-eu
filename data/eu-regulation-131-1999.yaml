title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 131/1999 of 21 January 1999 amending Regulation
    (EC) No 2249/98 imposing provisional anti-dumping and countervailing duties on
    imports of farmed Atlantic salmon originating in Norway with regard to certain
    exporters and amending Commission Decision 97/634/EC accepting undertakings offered
    in connection with the anti-dumping and anti-subsidies proceedings concerning
    imports of farmed Atlantic salmon originating in Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 131/1999 de la Commission du 21 janvier 1999 modifiant
    le règlement (CE) nº 2249/98 instituant des droits antidumping et compensateurs
    provisoires sur les importations de saumons atlantiques d'élevage originaires
    de Norvège en ce qui concerne certains exportateurs et modifiant la décision
    97/634/CE portant acceptation des engagements offerts dans le cadre de la procédure
    antidumping et de la procédure antisubventions concernant les importations de
    saumons atlantiques d'élevage originaires de Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 131/1999 der Kommission vom 21. Januar 1999 zur Änderung
    der Verordnung (EG) Nr. 2249/98 der Kommission zur Einführung vorläufiger Antidumping-
    und Ausgleichszölle auf bestimmte Einfuhren von gezüchtetem Atlantischen Lachs
    mit Ursprung in Norwegen für bestimmte Ausführer und zur Änderung des Beschlusses
    97/634/EG zur Annahme von Verpflichtungsangeboten im Zusammenhang mit dem Antidumping-
    und dem Antisubventionsverfahren betreffend die Einfuhren von gezüchtetem Atlantischen
    Lachs mit Ursprung in Norwegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 131/1999 af 21. januar 1999 om ændring
    af forordning (EF) nr. 2249/98 om indførelse af en midlertidig antidumping- og
    udligningstold på importen af opdrættede atlanterhavslaks med oprindelse i Norge
    for så vidt angår visse eksportører og om ændring af afgørelse 97/634/EF
    om godtagelse af tilsagn i forbindelse med antidumping- og antisubsidieprocedurerne
    vedrørende importen af opdrættede atlanterhavslaks med oprindelse i Norge
  type: main
- language: el
  script: Grek
