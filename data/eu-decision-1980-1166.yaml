title:
- language: en
  script: Latn
  content: '80/1166/EEC: Commission Decision of 1 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the French Republic of expenditure incurred
    during 1978 on aids and premiums relating to the modernization of farms including
    those in the less favoured farming areas (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1166/CEE: Décision de la Commission, du 1er décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à la République française des dépenses effectuées
    pendant l''année 1978 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris dans les zones agricoles défavorisées
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1166/EWG: Entscheidung der Kommission vom 1. Dezember 1980 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1978 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an die Französische Republik (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1166/EØF: Kommissionens beslutning af 1. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til den franske Republik af udgifter, som er
    afholdt i løbet af året 1978 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, også i ugunstigt stillede områder (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1166/CEE: Decisione della Commissione, del 1 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica francese
    delle spese effettuate durante il 1978 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1166/EEG: Beschikking van de Commissie van 1 december 1980 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek voor
    de in 1978 verrichte uitgaven voor steun en premies met betrekking tot de modernisering
    van landbouwbedrijven waaronder mede begrepen die in probleemgebieden in de landbouw
    (Slechts de tekst in de Franse taal is authentiek)'
