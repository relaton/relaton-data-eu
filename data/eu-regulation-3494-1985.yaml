title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3494/85 of 11 December 1985 re-establishing
    the levying of customs duties applicable to other clocks, falling within heading
    No 91.04, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3494/85 de la Commission du 11 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables aux horloges,
    pendules, réveils et appareils d' horlogerie similaires à mouvement autre que
    de montre, de la position 91.04 du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3494/85 der Kommission vom 11. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für andere Uhren der Tarifnummer 91.04 des Gemeinsamen
    Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3494/85 af 11. december 1985 om genindførelse
    af opkrævning af told for andre ure, henhørende under pos. 91.04 i den fælles
    toldtarif og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3494/85 της Επιτροπής
    της 11ης Δεκεμβρίου 1985 περί αποκαταστάσεως
    της εφαρμογής των δασμών για ρολόγια μεγάλα,
    εκκρεμή, ξυπνητήρια και παρόμοιες συσκευές
    ωρολογοποιίας, της κλάσεως 91.04 του κοινού δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3494/85 della Commissione dell' 11 dicembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili agli orologi, pendole,
    sveglie e simili apparecchi di orologeria, con movimento diverso da quello degli
    orologi tascabili della voce 91.04 della tariffa doganale comune, originari della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3494/85 van de Commissie van 11 december 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokken, pendules,
    wekkers en dergelijke artikelen met ander uurwerk dan horlogeuurwerk, van tariefpost
    91.04 van het gemeenschappelijk douanetarief, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
