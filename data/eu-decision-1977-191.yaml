id: EUDecision1977191
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 December 1976 authorizing the Kingdom of Belgium
    and the Grand Duchy of Luxembourg not to apply Community treatment to tomatoes
    and table grapes falling within subheading 07.01 M I or 08.04 A I of the Common
    Customs Tariff, originating in Spain and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '77/191/CEE: Décision de la Commission, du 23 décembre 1976, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les tomates et les raisins de table, des sous-positions 07.01 M
    I et 08.04 A I du Tarif douanier commun, originaires d''Espagne et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Dezember 1976, mit der das Königreich
    Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus Spanien stammende
    und in den anderen Mitgliedstaaten im freien Verkehr befindliche Tomaten und Tafeltrauben
    der Tarifstellen 07.01 M I bzw. 08.04 A I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. december 1976 om bemyndigelse af kongeriget
    Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling at undtage
    tomater og friske druer til spisebrug, som henhører under pos. 07.01 M I og pos.
    08.04 A I i den fælles toldtarif, har oprindelse i Spanien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 dicembre 1976, che autorizza il Regno
    del Belgio ed il Granducato del Lussemburgo ad escludere dal trattamento comunitario
    i pomodori e le uve da tavola, delle sottovoci 07.01 M I e 08.04 A I della tariffa
    doganale comune, originari della Spagna e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 december 1976 waarbij het Koninkrijk
    België en het Groothertogdom Luxemburg worden gemachtigd tomaten en tafeldruiven
    van posten 07.01 M I en 08.04 A I van het gemeenschappelijk douanetarief, van
    oorsprong uit Spanje en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
