    disease for pigs destined for regions free of the disease in France'
  type: main
- language: fr
  script: Latn
  content: '93/664/CE: Décision de la Commission du 6 décembre 1993 modifiant pour
    la deuxième fois la décision 93/24/CEE relative à des garanties supplémentaires
    concernant la maladie d''Aujeszky pour les porcs destinés aux régions indemnes
    de la maladie en France'
  type: main
- language: de
  script: Latn
  content: '93/664/EG: Entscheidung der Kommission vom 6. Dezember 1993 zur zweiten
    Abänderung der Entscheidung 93/24/EWG und zur Festlegung zusätzlicher Garantien
    hinsichtlich der Aujeszky-Krankheit für Schweine, die für seuchenfreie Regionen
    in Frankreich bestimmt sind'
  type: main
- language: da
  script: Latn
  content: '93/664/EF: Kommissionens beslutning af 6. december 1993 om anden ændring
    af beslutning 93/24/EØF og om supplerende garantier vedrørende Aujeszkys sygdom
    for svin bestemt til regioner i Frankrig, der er fri for sygdommen'
  type: main
- language: el
  script: Grek
