    και για την παροχή συμπληρωματικών εγγυήσεων
    όσον αφορά τη νόσο του Aujeszky (ψευδολύσσα) για
    χοίρους που προορίζονται για περιφέρειες της
    Γαλλίας απαλλαγμένες από τη νόσο'
  type: main
- language: it
  script: Latn
  content: '93/664/CE: Decisione della Commissione del 6 dicembre 1993 recante seconda
