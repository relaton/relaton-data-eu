title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2521/77 of 15 November 1977 re-establishing
    the levying of customs duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper falling within heading No 74.07, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2521/77 de la Commission, du 15 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses en cuivre, de la position
    tarifaire 74.07, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2521/77 der Kommission vom 15. November 1977 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2521/77 af 15. november 1977 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger af kobber,
    under position 74.07, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2521/77 della Commissione, del 15 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi (compresi i loro
    sbozzi) e barre forate, di rame, della voce doganale 74.07, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2521/77 van de Commissie van 15 november 1977 houdende
    wederinstelling van de heffing van de douanerechten voor buizen en pijpen (ook
    indien niet afgewerkt) en holle staven, van koper, van post 74.07, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76
    van de Raad tariefpreferenties werden geopend
  type: main
