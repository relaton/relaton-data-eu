title:
- language: en
  script: Latn
  content: '88/223/EEC: Commission Decision of 5 April 1988 authorizing certain Member
    States to provide for exceptions from certain provisions of Directive 77/93/EEC
    in respect of potatoes for human consumption originating in Cuba (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/223/CEE: Décision de la Commission du 5 avril 1988 autorisant certains
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE pour les pommes de terre de consommation originaires de Cuba (Les textes
    en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/223/EWG: Entscheidung der Kommission vom 5. April 1988 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Speisekartoffeln mit Ursprung in Kuba Ausnahmen
    von einigen Vorschriften der Richtlinie 77/93/EWG zuzulassen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/223/EØF: Kommissionens beslutning af 5. april 1988 om bemyndigelse
    af visse medlemsstater til at fastsætte undtagelser fra visse bestemmelser i
    direktiv 77/93/EØF for spisekartofler med oprindelse i Cuba (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/223/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Απριλίου
    1988 η οποία επιτρέπει σε ορισμένα κράτη μέλη
    να προβλέψουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ σχετικά με τις πατάτες για
    ανθρώπινη κατανάλωση καταγωγής Κούβας (Τα
    κείμενα στη γαλλική και ολλανδική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/223/CEE: Decisione della Commissione del 5 aprile 1988 che autorizza
    taluni Stati membri a prevedere deroghe, per le patate da consumo originarie di
    Cuba, ad alcune disposizioni della direttiva 77/93/CEE (I testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/223/EEG: Beschikking van de Commissie van 5 april 1988 waarbij bepaalde
    Lid-Staten worden gemachtigd om voor consumptieaardappelen van oorsprong uit Cuba
    afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG toe te staan (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/223/CEE: Decisão da Comissão de 5 de Abril de 1988 que permite a
    determinados Estados-membros estabelecer derrogações a determinadas normas da
    Directiva 77/93/CEE em relação à batata de consumo originária de Cuba (Apenas
    fazem fé os textos nas línguas francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '88/223/CEE: Decisión de la Comisión de 5 de abril de 1988 por la que
    se autoriza a determinados Estados miembros para prever excepciones a determinadas
    disposiciones de la Directiva 77/93/CEE respecto de las patatas destinadas al
    consumo humano, originarias de Cuba (Los textos en lenguas francesa y neerlandesa
    son los únicos auténticos)'
