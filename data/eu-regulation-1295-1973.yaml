id: EURegulation12951973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1295/73 of the Commission of 15 May 1973 re-establishing
    Common Customs Tariff duties on women' s, girls' and infants' outer garments,
    not of cotton, falling within heading No ex 61.02, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2764/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1295/73 de la Commission, du 15 mai 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour femmes, fillettes et jeunes enfants, en tissus autres
    que de coton, de la position tarifaire ex 61.02, originaires de la Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2764/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1295/73 der Kommission vom 15. Mai 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Frauen, Mädchen und Kleinkinder, aus anderen Geweben als aus Baumwolle,
    der Tarifnummer ex 61.02, mit Ursprung in Süd-Korea, dem die in der Verordnung
    (EWG) Nr. 2764/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1295/73 af 15. maj 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for yderbeklædningsgenstande til kvinder,
    piger og småbørn, ikke af bomuld, under position ex 61.02, som har oprindelse
    i Syd-Korea og omfattes af de toldpræferencer, som fastsat i Rådets forordning
    (EØF) nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1295/73 della Commissione, del 15 maggio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per donna, per ragazza e per bambini, in tessuti non di cotone,
    della voce doganale n. ex 61.02, originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2764/72 del Consiglio,
    del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1295/73 van de Commissie van 15 mei 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op damesbovenkleding, meisjesbovenkleding en kinderbovenkleding,
    van andere weefsels dan van katoen van post ex 61.02, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2764/72 van de Raad van 19 december 1972
  type: main
