    irányelvnek a friss hús előállítására és forgalomba hozatalára való
    kiterjesztése céljából történő módosításáról és egységes szerkezetbe
    foglalásáról
  type: main
- language: it
  script: Latn
  content: Direttiva 91/497/CEE del Consiglio del 29 luglio 1991 che modifica e codifica
