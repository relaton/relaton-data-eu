    annetun direktiivin 64/433/ETY muuttamisesta ja ajan tasalle saattamisesta direktiivin
    ulottamiseksi koskemaan tuoreen lihan tuotantoa ja saattamista markkinoille
  type: main
- language: hu
  script: Latn
  content: A Tanács 91/497/EGK irányelve (1991. július 29.) a friss hús Közösségen
