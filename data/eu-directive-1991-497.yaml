  content: Council Directive 91/497/EEC of 29 July 1991 amending and consolidating
    Directive 64/433/EEC on health problems affecting intra-Community trade in fresh
    meat to extend it to the production and marketing of fresh meat
  type: main
- language: fr
  script: Latn
  content: Directive 91/497/CEE du Conseil du 29 juillet 1991 modifiant et codifiant
