    intracommunautaire handelsverkeer in vers vlees ten einde deze uit te breiden
    tot de produktie en het in de handel brengen van vers vlees
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 29 lipca 1991 r. zmieniająca i ujednolicająca dyrektywę
    64/433/EWG dotyczącą problemów sanitarnych wpływających na handel świeżym
    mięsem we Wspólnocie w celu rozszerzenia jej stosowania na produkcję i wprowadzanie
    na rynek świeżego mięsa
  type: main
- language: pt
  script: Latn
  content: Directiva 91/497/CEE do Conselho de 29 de Julho de 1991 que altera e codifica
    a Directiva 64/433/CEE, relativa aos problemas sanitários em matéria de comércio
    intracomunitário de carne fresca, a fim de a alargar à produção de carnes
    frescas e à sua colocação no mercado
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 29. júla 1991, ktorou sa mení, dopĺňa a vydáva úplné
    znenie smernice č. 64/433/EHS o zdravotných problémoch ovplyvňujúcich obchod
    s čerstvým mäsom vnútri spoločenstva, aby sa jej pôsobnosť rozšírila
    aj na výrobu a predaj čerstvého mäsa
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 29. julija 1991 o spremembi in pripravi prečiščenega
