title:
- language: en
  script: Latn
  content: Commission Decision of 2 September 1976 specifying the extent to which
    applications for import licences lodged from 23 to 27 August 1976 for young bovine
    animals of highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/741/CEE: Décision de la Commission, du 2 septembre 1976, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 23 au 27 août 1976 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. September 1976 darüber, inwieweit den
    vom 23. bis 27. August 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder
    der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 2. september 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i perioden fra den 23. til den
    27. august 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 settembre 1976, che determina in quale
    misura può essere dato seguito alle domande d'importazione, presentate dal 23
    al 27 agosto 1976, per giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 september 1976 tot vaststelling van
    de mate waarin van 23 tot en met 27 augustus 1976 ingediende aanvragen om afgifte
    van invoercertificaten voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
