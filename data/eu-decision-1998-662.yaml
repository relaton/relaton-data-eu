  script: Latn
  content: '98/662/EC: Commission Decision of 16 November 1998 amending Decision 97/365/EC
    on the drawing up of provisional lists of third country establishments from which
    the Member States authorise imports of products prepared from meat of bovine animals,
    swine, equidae and sheep and goats (notified under document number C(1998) 3504)'
  type: main
- language: fr
  script: Latn
