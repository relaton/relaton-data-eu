title:
- language: en
  script: Latn
  content: '80/418/EEC: Commission Decision of 25 March 1980 authorizing Ireland not
    to apply Community treatment to babies''knitted outer garments, falling within
    heading No ex 60.05 of the Common Customs Tariff (category 71), originating in
    Hong Kong and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/418/CEE: Décision de la Commission, du 25 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les vêtements de dessus de bonneterie
    pour bébés, de la position ex 60.05 du tarif douanier commun (catégorie 71),
    originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/418/EWG: Entscheidung der Kommission vom 25. März 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Oberkleidung für Säuglinge, gewirkt, der Tarifnummer
    ex 60.05 des Gemeinsamen Zolltarifs (Kategorie 71) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/418/EØF: Kommissionens beslutning af 25. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage yderbeklædningsgenstande
    af trikotage, til spædbørn, som henhører under pos. ex 60.05 i den fælles
    toldtarif (kategori 71), har oprindelse i Hongkong og frit kan omsættes i de
    øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/418/CEE: Decisione della Commissione, del 25 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli indumenti esterni a maglia
    per bambini piccoli (bébés), della voce ex 60.05 della tariffa doganale comune
    (categoria 71), originari di Hong Kong e messi in libera pratica negli altri Stati
    membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/418/EEG: Beschikking van de Commissie van 25 maart 1980 waarbij Ierland
    wordt gemachtigd bovenkleding van brei- of haakwerk voor baby''s, van post ex
    60.05 van het gemeenschappelijk douanetarief (categorie 71), van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
