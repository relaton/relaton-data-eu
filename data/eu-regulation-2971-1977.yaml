title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2971/77 of 29 December 1977 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flags of certain non-member countries in the 200 nautical
    mile zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2971/77 du Conseil, du 29 décembre 1977, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    à l'égard des navires battant pavillon de certains pays tiers dans la zone de
    200 milles nautiques située au large des côtes du département français de
    la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2971/77 des Rates vom 29. Dezember 1977 über einige
    vorläufige Maßnahmen gegenüber Schiffen, die die Flagge bestimmter Drittländer
    führen, zur Erhaltung und Bewirtschaftung der Fischbestände in der Zone von
    200 Seemeilen vor der Küste des französischen Departements Guyana
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2971/77 af 29. december 1977 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører visse tredjelandes flag i
    200 sømilezonen ud for det franske departement Guyanas kyster
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2971/77 del Consiglio, del 29 dicembre 1977, che stabilisce
    talune misure temporanee di conservazione e di gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di alcuni paesi terzi nella zona di 200
    miglia nautiche al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2971/77 van de Raad van 29 december 1977 tot vaststelling
    van bepaalde overgangsmaatregelen voor de instandhouding en het beheer van de
    visbestanden, die van toepassing zijn op vaartuigen die de vlag van sommige derde
    landen voeren in de zone van 200 zeemijl gelegen langs de kusten van het Franse
    departement Guyana
  type: main
