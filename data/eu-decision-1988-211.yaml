    να προβεί σε ενδοκοινοτική επιτήρηση όσον
    αφορά τις εισαγωγές φερμουάρ με κλείσιμο που
    δεν είναι από κοινό μέταλλο και των ανταλλακτικών
    τους, καταγωγής Ταϊβάν (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/211/CEE: Decisione della Commissione dell''8 marzo 1988 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria nei confronti
    delle importazioni di talune chiusure lampo con dentini di metalli non comuni
    e nastri con dentini di metalli non comuni, originarie di Taiwan (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/211/EEG: Beschikking van de Commissie van 8 maart 1988 houdende machtiging
    van de Italiaanse Republiek om over te gaan tot een intracommunautair toezicht
    op de invoer van bepaalde treksluitingen, andere dan met haakjes van onedel metaal,
    en delen daarvan, van oorsprong uit Taiwan (Slechts de tekst in de Italiaanse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/211/CEE: Decisão da Comissão de 8 de Março de 1988 que autoriza
