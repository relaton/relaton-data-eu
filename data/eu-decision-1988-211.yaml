title:
- language: en
  script: Latn
  content: '88/211/EEC: Commission Decision of 8 March 1988 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of slide fasteners
    with scoops not of base metal and parts thereof originating in Taiwan (Only the
    Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/211/CEE: Décision de la Commission du 8 mars 1988 autorisant la République
    italienne à procéder à une surveillance intracommunautaire des importations
    de fermetures à glissières avec agrafes non en métaux communs et leurs parties,
    originaires de T''ai-wan (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/211/EWG: Entscheidung der Kommission vom 8. März 1988 zur Ermächtigung
    der italienischen Republik, eine innergemeinschaftliche Überwachung der Einfuhren
    von Reißverschlüssen mit Zähnen aus unedlen Metallen und Teilen davon mit Ursprung
    in Taiwan einzuführen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/211/EØF: Kommissionens beslutning af 8. marts 1988 om bemyndigelse
    af Den Italienske Republik til at indføre tilsyn inden for Fællesskabet med
    importen af lynlåse med hægter af andet materiale end uædelt metal og dele
    dertil, med oprindelse i Taiwan (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/211/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Μαρτίου
