title:
- language: en
  script: Latn
  content: '96/190/EC: Commission Decision of 22 February 1996 amending Decision 93/24/EEC
    and Decision 93/244/EEC and concerning additional guarantees relating to Aujeszky''s
    disease for pigs destined to regions free of the disease in Germany'
  type: main
- language: fr
  script: Latn
  content: '96/190/CE: Décision de la Commission, du 22 février 1996, modifiant
    les décisions 93/24/CEE et 93/244/CEE et relative à des garanties supplémentaires
    concernant la maladie d''Aujeszky pour les porcs destinés aux régions indemnes
    de la maladie en Allemagne'
  type: main
- language: de
  script: Latn
  content: '96/190/EG: Entscheidung der Kommission vom 22. Februar 1996 zur Änderung
    der Entscheidungen 93/24/EWG und 93/244/EWG und zur Festlegung zusätzlicher Garantien
    hinsichtlich der Aujeszky-Krankheit für Schweine, die für seuchenfreie Regionen
    in Deutschland bestimmt sind'
  type: main
- language: da
  script: Latn
  content: '96/190/EF: Kommissionens beslutning af 22. februar 1996 om ændring af
    beslutning 93/24/EØF og 93/244/EØF og om supplerende garantier med hensyn til
    Aujeszkys sygdom for svin bestemt til regioner i Tyskland, der er fri for sygdommen'
  type: main
- language: el
  script: Grek
  content: '96/190/ΕΚ: Απόφαση της Επιτροπής, της 22ας Φεβρουαρίου
    1996, που τροποποιεί τις αποφάσεις 93/24/ΕΟΚ και
    93/244/ΕΟΚ και αφορά την παροχή συμπληρωματικών
    εγγυήσεων όσον αφορά τη νόσο του Aujeszky (ψευδολύσσα)
    για χοίρους που προορίζονται για περιφέρειες
    της Γερμανίας απαλλαγμένες από τη νόσο'
  type: main
- language: fi
  script: Latn
  content: '96/190/EY: Komission päätös, tehty 22 päivänä helmikuuta 1996, päätösten
    93/24/ETY ja 93/244/ETY muuttamisesta sekä Aujeszkyn tautia koskevista lisätakeista
    taudista vapaille alueille tarkoitettujen sikojen osalta Saksassa'
  type: main
- language: it
  script: Latn
  content: '96/190/CE: Decisione della Commissione, del 22 febbraio 1996, recante
    modifica delle decisioni 93/24/CEE e 93/244/CEE e relativa a garanzie supplementari
    per la malattia di Aujeszky previste per i suini destinati a regioni esenti dalla
    malattia in Germania'
  type: main
- language: nl
  script: Latn
  content: '96/190/EG: Beschikking van de Commissie van 22 februari 1996 tot wijziging
    van de Beschikkingen 93/24/EEG en 93/244/EEG van de Commissie en betreffende aanvullende
    garanties ten aanzien van de ziekte van Aujeszky voor varkens die bestemd zijn
    voor van deze ziekte vrije regio''s in Duitsland'
  type: main
- language: pt
  script: Latn
  content: '96/190/CE: Decisão da Comissão, de 22 de Fevereiro de 1996, que altera
    as Decisões 93/24/CEE e 93/244/CEE e relativa a garantias adicionais quanto à
    doença de Aujeszky para suínos destinados a regiões da Alemanha indemnes da
    doença'
  type: main
- language: es
  script: Latn
  content: '96/190/CE: Decisión de la Comisión, de 22 de febrero de 1996, por la
    que se modifican las Decisiones 93/24/CEE y 93/244/CEE y se establecen garantías
    suplementarias referentes a la enfermadad de Aujeszky para los cerdos destinados
    a regiones alemanas libres de dicha enfermedad'
  type: main
- language: sv
  script: Latn
  content: '96/190/EG: Kommissionens beslut av den 22 februari 1996 om ändring av
