title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1296/89 of 10 May 1989 re-establishing the
    levying of customs duties on men's or boys'suits and ensembles, other than knitted
    or crocheted, products of category 16 (order No 40.0160) and men's or boys'singlets
    and other vests, underpants, briefs, nightshirts, other than knitted or crocheted,
    products of category 18 (order No 40.0180), originating in Pakistan to which the
    preferential tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1296/89 de la Commission du 10 mai 1989 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets, etc.,
    autres que de bonneterie, pour hommes et garçonnets, de la catégorie de produits
    16 (numéro d'ordre 40.0160) et aux gilets de corps, slips, chemises de nuit,
    etc., autres qu'en bonneterie, de la catégorie de produits n° 18 (numéro d'ordre
    40.0180) originaires de Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1296/89 DER KOMMISSION vom 10. Mai 1989 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen, andere als aus Gewirken, für Männer
    und Knaben der Warenkategorie Nr. 16 (lfd. Nr. 40.0160) sowie Unterhemden, Slips,
    Nachthemden und andere Unterhosen usw., andere als aus Gewirken, der Warenkategorie
    Nr. 18 (lfd. Nr. 40.0180) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1296/89 af 10. maj 1989 om genindførelse
    af opkrævning af toldafgifter for - jakkesæt, ikke af trikotage, til mænd og
    drenge, under varekategori nr. 16 (løbenummer 40.0160) - undertrøjer, underbenklæder,
    pyjamas og anden natbeklædning, ikke af trikotage, under varekategori nr. 18
    (løbenummer 40.0180), som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1296/89 της Επιτροπής
    της 10ης Μαΐου 1989 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για κοστούμια και σύνολα,
    εκτός από τα πλεκτά για άντρες και αγόρια, προϊόντα
    της κατηγορίας 16 ( αύξων αριθμός 40.0160 ), φανέλες,
    σλιπ, νυχτικά εκτός από τα πλεκτά, προϊόντα
    της κατηγορίας 18 ( αύξων αριθμός 40.0180 ), καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 4259/88 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1296/89 DELLA COMMISSIONE del 10 maggio 1989 che
    ripristina la riscossione dei dazi doganali applicabili a vestiti, completi e
    insiemi, ecc., esclusi quelli a maglia, per uomo e per ragazzo, della categoria
    dei prodotti n. 16 (numero d'' ordine 40.0160), e a canottiere, mutande, mutandine
    e slip, camicie da notte, ecc., esclusi quelli a maglia, della categoria di prodotti
    n. 18 (numero d'' ordine 40.0180) originari del Pakistan, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1296/89 VAN DE COMMISSIE van 10 mei 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 16 (volgnummer 40.0160) en onderhemden, slips, onderbroeken,
    nachthemden, enz., andere dan van brei- of haakwerk, van de categorie van produkten
    nr. 18 (volgnummer 40.0180), van oorsprong uit Pakistan, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1296/89 DA COMISSAO de 10 de Maio de 1989 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis aos fatos completos e conjuntos,
    excluindo os de malha, para homens e rapazes, da categoria de produtos n* 16 (n*
    de ordem 40.0160), e às camisolas interiores, slips, cuecas, camisas de noite,
    (excluindo os de malha), da categoria de produtos n* 18 (n* de ordem 40.0180),
    originarios do Paquistao, beneficiario das preferências pautais previstas no
    Regulamento (CEE) n* 4259/88 do Conselho
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 1296/89 DE LA COMISIÓN de 10 de mayo de 1989 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los trajes completos y conjuntos, que no sean de punto, para hombres y niños,
    con excepción de las prendas de esquí, de la categoría no 16 (número de orden
    40.0160) y a las fajas, calzoncillos, albornoces, etc., con excepción de las
    prendas de esquí de la categoría no 18 (número de orden 40.0180) originarios
    de Pakistán beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) nº 4259/88 del Consejo #'
