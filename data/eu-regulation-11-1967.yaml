title:
- language: en
  script: Latn
  content: Regulation No 11/67/Euratom of the Council of 21 December 1967 amending
    Regulation No 4/63/Euratom as regards the rates of allowances which may be granted
    to certain officials covered by Article 92 of the Staff Regulations to compensate
    for the arduous nature of certain work
  type: main
- language: fr
  script: Latn
  content: Règlement n° 11/67/Euratom du Conseil, du 21 décembre 1967, modifiant
    le règlement n° 4/63/Euratom en ce qui concerne les taux des indemnités qui
    peuvent être accordées à certains des fonctionnaires visés à l article 92
    du statut pour tenir compte du caractère pénible de certains travaux
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 11/67/Euratom des Rates vom 21. Dezember 1967 zur Änderung
    der Verordnung Nr. 4/63/Euratom in bezug auf die Sätze der Entschädigung, die
    einigen der in Artikel 92 des Statuts genannten Beamten zum Ausgleich für besonders
    beschwerliche Arbeiten gewährt werden kann
  type: main
- language: da
  script: Latn
  content: Rådets forordning nr. 11/67/EURATOM af 21. december 1967 om ændring af
    forordning nr. 4/63/EURATOM om størrelsen af de godtgørelser, der kan ydes for
    særlig byrdefuldt arbejde til visse af de i artikel 92 i vedtægten nævnte tjenestemænd
  type: main
- language: it
  script: Latn
  content: Regolamento n. 11/67/Euratom del Consiglio, del 21 dicembre 1967, che modifica
    il regolamento n. 4/63/Euratom per quanto riguarda l ammontare delle indennità
    che possono essere concesse a taluni funzionari menzionati nell articolo 92 dello
    statuto per tener conto del carattere gravoso di alcuni lavori
  type: main
- language: nl
  script: Latn
  content: Verordening nr. 11/67/Euratom van de Raad van 21 december 1967 tot wijziging
    van Verordening nr. 4/63/Euratom inzake de toeslagen die in verband met het bezwaarlijke
    karakter van bepaalde werkzaamheden kunnen worden toegekend aan bepaalde der in
    artikel 92 van het Statuut bedoelde ambtenaren
  type: main
