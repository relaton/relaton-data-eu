title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1387/77 of 21 June 1977 extending the validity
    of Regulation (EEC) No 1267/69 laying down special provisions applicable to imports
    into the Community from Greece of goods coming under Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1387/77 du Conseil, du 21 juin 1977, prolongeant la
    validité du règlement (CEE) n° 1267/69 fixant les dispositions particulières
    applicables lors de l'importation dans la Communauté, en provenance de Grèce,
    des marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1387/77 des Rates vom 21. Juni 1977 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 1267/69 zur Festlegung der Sonderbestimmungen,
    die bei der Einfuhr von unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren
    aus Griechenland in die Gemeinschaft anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1387/77 af 21. juni 1977 om forlængelse
    af gyldigheden af forordning (EØF) nr. 1267/69 om fastsættelse af særlige bestemmelser
    for indførsel i Fællesskabet af varer fra Grækenland, som henhører under forordning
    (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1387/77 del Consiglio, del 21 giugno 1977, che proroga
    la validità del regolamento (CEE) n. 1267/69 che fissa le disposizioni particolari
    applicabili all'importazione nella Comunità di merci soggette al regolamento
    (CEE) n. 1059/69 e provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1387/77 van de Raad van 21 juni 1977 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 1267/69 houdende vaststelling
    van de speciale voorschriften die van toepassing zijn bij de invoer in de Gemeenschap
    uit Griekenland van onder Verordening (EEG) nr. 1059/69 vallende goederen
  type: main
