title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2882/90 of 5 October 1990 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held by
    certain intervention agencies and intended for export, amending Regulation (EEC)
    No 569/88 and repealing Regulation (EEC) No 2398/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2882/90 de la Commission du 5 octobre 1990 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines non désossées détenues par certains organismes d'intervention
    et destinées à être exportées, modifiant le règlement (CEE) n° 569/88 et
    abrogeant le règlement (CEE) n° 2398/90
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2882/90 DER KOMMISSION vom 5. Oktober 1990 ueber den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch mit Knochen aus Bestaenden einiger
    Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur
    Aenderung der Verordnung (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG)
    Nr. 2398/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2882/90 af 5. oktober 1990 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af ikke-udbenet oksekød fra
    visse interventionsorganer med henblik på udførsel, om ændring af forordning
    (EØF) nr. 569/88 og om ophævelse af forordning (EØF) nr. 2398/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2882/90 της Επιτροπής
    της 5ης Οκτωβρίου 1990 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος με
    κόκαλα που κρατείται από ορισμένους οργανισμούς
    παρέμβασης και προορίζεται για εξαγωγή καθώς
    και σχετικά με την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 569/88 και την κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 2398/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2882/90 DELLA COMMISSIONE del 5 ottobre 1990 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine non disossate detenute da taluni organismi d'intervento e destinate
    all'esportazione, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 2398/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2882/90 VAN DE COMMISSIE van 5 oktober 1990 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    met been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking
    van Verordening (EEG) nr. 2398/90
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2882/90 DA COMISSAO de 5 de Outubro de 1990 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) n* 2539/84, de
    carne de bovino nao desossada detida por certos organismos de intervençao e destinada
    a ser exportada, que altera o Regulamento (CEE) n* 569/88 e que revoga o Regulamento
    (CEE) n* 2398/90
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2882/90 DE LA COMISION de 5 de octubre de 1990 relativo
