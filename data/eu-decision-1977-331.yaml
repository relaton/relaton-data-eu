title:
- language: en
  script: Latn
  content: '77/331/EEC: Commission Decision of 22 April 1977 authorizing Denmark and
    the Netherlands to apply special health guarantees for the prevention of leukosis
    in the case of bovine animals imported for breeding or production (Only the Dutch
    and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '77/331/CEE: Décision de la Commission, du 22 avril 1977, autorisant le
    Danemark et les Pays-Bas à appliquer des garanties sanitaires particulières
    relatives à la lutte contre la leucose, en cas d''introduction sur leur territoire
    de bovins d''élevage ou de rente (Les textes en langues néerlandaise et danoise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '77/331/EWG: Entscheidung der Kommission vom 22. April 1977, mit der Dänemark
    und die Niederlande ermächtigt werden, beim Verbringen von Zucht- und Nutzrindern
    in ihr Hoheitsgebiet zur Bekämpfung er Leukose besondere gesundheitspolizeiliche
    Garantien anzuwenden (Nur der niederländische und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '77/331/EØF: Kommissionens Beslutning af 22. april 1977 om bemyndigelse
    af Danmark og Nederlandene til ved indbringelse på deres område af avls- eller
    brugskvæg at anvende særlige sundhedsmæssige garantier med henblik på bekæmpelse
    af leukose (Kun den nederlandske og danske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '77/331/CEE: Decisione della Commissione, del 22 aprile 1977, che autorizza
    la Danimarca e i Paesi Bassi ad applicare speciali garanzie sanitarie all''introduzione
    di bovini da allevamento e da produzione nel proprio territorio con riferimento
    alla lotta contro la leucosi (I testi in lingua olandese e danese sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '77/331/EEG: Beschikking van de Commissie van 22 april 1977 waarbij Denemarken
    en Nederland worden gemachtigd om bij invoer van fok- of gebruiksrunderen bijzondere
    gezondheidsgaranties in het kader van de leukosebestrijding toe te passen (Slechts
    de teksten in de Nederlandse en de Deense taal zijn authentiek)'
  type: main
