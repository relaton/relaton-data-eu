id: EURegulation911965
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n 91/65/CEE de la Commission, du 29 juin 1965, portant, pour
    la période du 1er juillet au 30 septembre 1965, adaptation et fixation des prix
    d'écluse pour les oeufs de volailles en coquille et les volailles vivantes et
    abattues et fixation des prélèvements envers les pays tiers pour les oeufs de
    volailles en coquille, les volailles vivantes d'un poids n'excédant pas 185 grammes
    et les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 91/65/EWG der Kommission vom 29. Juni 1965 über die Anpassung
    und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel, lebendes
    und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. Juli bis zum 30. September 1965
  type: main
- language: it
  script: Latn
  content: Regolamento n. 91/65/CEE della Commissione, del 29 giugno 1965, che adatta
    e fissa i prezzi limite per le uova di volatili, per i volatili da cortile vivi
    e macellati e fissa i prelievi nei confronti dei paesi terzi per le uova in guscio
    di volatili da cortile, per i volatili da cortile vivi di peso non superiore a
    185 grammi e per i volatili da cortile macellati, per il periodo 1 luglio - 30
    settembre 1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 91/65/EEG van de Commissie van 29 juni 1965 houdende aanpassing
    en vaststelling van de sluisprijzen voor eieren van pluimvee, levend pluimvee
    en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte van derde
    landen op eieren in de schaal van pluimvee, levend pluimvee dat niet meer dan
    185 gram weegt en geslacht pluimvee, voor de periode van 1 juli 1965 tot en met
    30 september 1965
  type: main
