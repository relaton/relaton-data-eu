title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 388/93 of 22 February 1993 determining for
    the period 1 March 1993 to 30 June 1993 the quantities of raw sugar produced in
    the French overseas departments benefiting from the refining aid referred to in
    Council Regulation (EEC) No 2225/86 and amending Regulation (EEC) No 476/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 388/93 de la Commission, du 22 février 1993, déterminant,
    pour la période du 1er mars au 30 juin 1993, les quantités de sucre brut produites
    dans les départements français d' outre-mer bénéficiant de l' aide au raffinage
    visée au règlement (CEE) n° 2225/86 du Conseil et modifiant le règlement (CEE)
    n° 476/92
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 388/93 der Kommission vom 22. Februar 1993 zur Bestimmung
    der Mengen von im Zeitraum vom 1. März 1993 bis 30. Juni 1993 in den französischen
    überseeischen Departements erzeugtem Rohzucker, die die Raffinationsbeihilfe
    nach der Verordnung (EWG) Nr. 2225/86 des Rates erhalten können, und zur Änderung
    der Verordnung (EWG) Nr. 476/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 388/93 af 22. februar 1993 om fastsættelse
    for perioden 1. marts 1993 til 30. juni 1993 af de mængder råsukker produceret
    i de franske oversøiske departementer, der omfattes af den i Rådets forordning
    (EØF) nr. 2225/86 omhandlede raffineringsstøtte, og om ændring af forordning
    (EØF) nr. 476/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 388/93 της Επιτροπής
    της 22ας Φεβρουαρίου 1993 για τον καθορισμό, για
    την περίοδο από 1ης Μαρτίου έως 30 Ιουνίου 1993
    των ποσοτήτων ακατέργαστης ζάχαρης που παράγονται
    στα γαλλικά υπερπόντια διαμερίσματα που επωφελούνται
    της ενισχύσεως στο ραφινάρισμα που αναφέρεται
    στον κανονισμό (ΕΟΚ) αριθ. 2225/86 του Συμβουλίου
    και για τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    476/92
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 388/93 della Commissione, del 22 febbraio 1993, che
    fissa, per il periodo dal 1° marzo al 30 giugno 1993, i quantitativi di zucchero
    greggio prodotti nei dipartimenti francesi d' oltremare che beneficiano dell'
    aiuto alla raffinazione di cui al regolamento (CEE) n. 2225/86 del Consiglio e
    che modifica il regolamento (CEE) n. 476/92
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 388/93 van de Commissie van 22 februari 1993 tot
    vaststelling voor de periode van 1 maart tot en met 30 juni 1993 van de in de
    Franse overzeese departementen geproduceerde hoeveelheden ruwe suiker die in aanmerking
    komen voor de in Verordening (EEG) nr. 2225/86 van de Raad bedoelde steun voor
    raffinage en tot wijziging van Verordening (EEG) nr. 476/92
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 388/93 da Comissão, de 22 de Fevereiro de 1993,
    que determina, para o período compreendido entre 1 de Março e 30 de Junho de
    1993, as quantidades de açúcar bruto produzidas nos departamentos franceses
    ultramarinos que beneficiam da ajuda à refinação referida no Regulamento (CEE)
    n° 2225/86 do Conselho e que altera o Regulamento (CEE) n° 476/92
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 388/93 de la Comisión, de 22 de febrero de 1993,
    por el que se determinan, para el período del 1 de marzo al 30 de junio de 1993,
    las cantidades de azúcar terciado producidas en los departamentos franceses de
    Ultramar que se benefician de la ayuda al refinado contemplada en el Reglamento
    (CEE) n° 2225/86 del Consejo y por el que se modifica el Reglamento (CEE) n°
    476/92
