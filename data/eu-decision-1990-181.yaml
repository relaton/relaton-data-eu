    resources base (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/181/Euratom, CEE: Décision de la Commission, du 23 mars 1990, autorisant
    l''Italie à utiliser certaines estimations approximatives pour le calcul de la
    base des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/181/Euratom, EWG: Entscheidung der Kommission vom 23. März 1990 mit
    der Italien ermächtigt wird, die Grundlage für die MwSt.-Eigenmittel anhand
    annähernder Schätzungen zu ermitteln (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/181/Euratom, EØF: Kommissionens beslutning af 23. marts 1990 om bemyndigelse
    af Italien til at beregne grundlaget for Fællesskabernes momsindtægter på basis
    af en tilnærmelsesvis vurdering af momsgrundlaget for visse transaktioner (Kun
    den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/181/Ευρατόμ, ΕΟΚ: Απόφαση της Επιτροπής
    της 23ης Μαρτίου 1990 με την οποία επιτρέπεται
    στην Ιταλία να χρησιμοποιεί κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από το φόρο επί
    της προστιθέμενης αξίας (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/181/Euratom, CEE: Decisione della Commissione, del 23 marzo 1990, che
    autorizza la Repubblica italiana a ricorrere a talune valutazioni approssimative
    per il calcolo della base delle risorse proprie provenienti dall''imposta sul
    valore aggiunto (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/181/Euratom, EEG: Beschikking van de Commissie van 23 maart 1990 waarbij
