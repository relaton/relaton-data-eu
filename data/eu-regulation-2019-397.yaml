- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/397 of 19 December 2018 amending
    Delegated Regulation (EU) 2016/2251 supplementing Regulation (EU) No 648/2012
    of the European Parliament and of the Council as regards the date until which
    counterparties may continue to apply their risk-management procedures for certain
    OTC derivative contracts not cleared by a CCP
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/397 de la Commission du 19 décembre 2018
    modifiant le règlement délégué (UE) 2016/2251 complétant le règlement (UE)
    n° 648/2012 du Parlement européen et du Conseil en ce qui concerne la date jusqu'à
    laquelle les contreparties pourront continuer à appliquer leurs procédures de
    gestion des risques pour certains contrats dérivés de gré à gré non compensés
    par une contrepartie centrale
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/397 der Kommission vom 19. Dezember 2018
    zur Änderung der Delegierten Verordnung (EU) 2016/2251 zur Ergänzung der Verordnung
    (EU) Nr. 648/2012 des Europäischen Parlaments und des Rates im Hinblick auf das
    Datum, bis zu dem Gegenparteien ihre Risikomanagementverfahren weiterhin auf bestimmte,
    nicht durch eine zentrale Gegenpartei geclearte OTC-Derivatekontrakte anwenden
    dürfen
  type: main
