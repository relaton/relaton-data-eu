  content: Commission Regulation (EEC) No 174/87 of 22 January 1987 fixing, for 1987,
    the quotas for imports into Portugal of certain egg and poultrymeat products from
    Spain and certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 174/87 de la Commission du 22 janvier 1987 fixant,
    pour l' année 1987, les contingents applicables à l' importation au Portugal
    de certains produits des secteurs des oeufs et de la viande de volaille en provenance
    d' Espagne et certaines modalités pour leur application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 174/87 der Kommission vom 22. Januar 1987 zur Festsetzung
    der 1987 in Portugal anwendbaren Kontingente für die Einfuhr bestimmter Erzeugnisse
    der Sektoren Eier und Geflügelfleisch aus Spanien und diesbezüglicher Durchführungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 174/87 af 22. januar 1987 om fastsættelse
    for 1987 af kontingenterne for import til Portugal af visse æg- og fjerkrækødprodukter
    fra Spanien og af visse bestemmelser for deres anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 174/87 της Επιτροπής
    της 22ας Ιανουαρίου 1987 σχετικά με τον καθορισμό
    των ποσοστώσεων, για το έτος 1987, οι οποίες εφαρμόζονται
    κατά την εισαγωγή στην Πορτογαλία ορισμένων
    προϊόντων του τομέα των αυγών και του κρέατος
    των πουλερικών προέλευσης Ισπανίας, και σχετικά
    με ορισμένες λεπτομέρειες εφαρμογής τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 174/87 della Commissione del 22 gennaio 1987 che fissa
    i contingenti, per il 1987, applicabili all' importazione in Portogallo di taluni
    prodotti del settore delle uova e del pollame in provenienza dalla Spagna, nonché
    talune modalità per la loro applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 174/87 van de Commissie van 22 januari 1987 tot vaststelling
    van de contingenten voor het jaar 1987 welke door Portugal kunnen worden toegepast
    bij invoer van bepaalde produkten van de sectoren eieren en slachtpluimvee van
    herkomst uit Spanje, en van uitvoeringsbepalingen terzake
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 174/87 da Comissão de 22 de Janeiro de 1987 que
