    de determinados produtos dos sectores dos ovos e da carne de aves de capoeira
    provenientes de Espanha e determinadas regras para a sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 174/87 de la Comisión de 22 de enero de 1987 por
