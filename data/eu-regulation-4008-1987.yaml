  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4008/87 della Commissione del 23 dicembre 1987 recante
    modalità di applicazione del regime d' importazione per i prodotti rispondenti
    al codice 0714 10 90 della nomenclatura combinata, originari delle attuali parti
    contraenti del GATT, esclusa la Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4008/87 van de Commissie van 23 december 1987 houdende
