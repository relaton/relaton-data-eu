    0714 10 90 originating in countries other than Thailand that are at present Contracting
    Parties to the GATT
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4008/87 de la Commission du 23 décembre 1987 portant
    modalités d' application du régime à l' importation applicable aux produits
    du code 0714 10 90 de la nomenclature combinée originaires des parties contractantes
    actuelles du GATT, autres que la Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4008/87 der Kommission vom 23. Dezember 1987 über
    Durchführungsbestimmungen zur Einfuhrregelung für Erzeugnisse der Unterposition
    0714 10 90 der Kombinierten Nomenklatur mit Ursprung in den Mitgliedsländern
    des GATT außer Thailand
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4008/87 af 23. december 1987 om gennemførelsesbestemmelser
