title:
- language: fr
  script: Latn
  content: Règlement n 58/67/CEE de la Commission, du 22 mars 1967, adaptant et fixant
    les prix d'écluse pour les porcs, la viande de porc et les produits à base de
    viande de porc pour les importations effectuées durant le deuxième trimestre
    1967
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 58/67/EWG der Kommission vom 22. März 1967 zur Anpassung
    und Festsetzung der Einschleusungspreise für Schweine, Schweinefleisch und Schweinefleisch
    enthaltende Erzeugnisse für Einfuhren im zweiten Vierteljahr 1967
  type: main
- language: it
  script: Latn
  content: Regolamento n. 58/67/CEE della Commissione, del 22 marzo 1967, che adatta
    e fissa i prezzi limite applicabili ai suini, alle carni suine e ai prodotti a
    base di carni suine per le importazioni effettuate durante il secondo trimestre
    1967
  type: main
- language: nl
  script: Latn
  content: Verordening no. 58/67/EEG van de Commissie van 22 maart 1967 houdende aanpassing
    en vaststelling van de sluisprijzen voor varkens, varkensvlees en produkten op
    basis van varkensvlees, met betrekking tot de invoer welke plaatsvindt in het
    tweede kwartaal van 1967
