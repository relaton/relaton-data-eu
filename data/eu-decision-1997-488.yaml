  script: Latn
  content: '97/488/EC: Commission Decision of 28 July 1997 authorizing Member States
    to provide for derogations from certain provisions of Council Directive 77/93/EEC
    in respect of plants of strawberry (Fragaria L.), intended for planting, other
    than seeds, originating in the Republic of South Africa'
  type: main
- language: fr
