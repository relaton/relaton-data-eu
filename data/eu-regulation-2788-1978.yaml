title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2788/78 of 29 November 1978 amending Regulation
    (EEC) No 2695/77 determining the conditions under which goods for certain categories
    of aircraft and ships are eligible upon importation for a favourable tariff arrangement
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2788/78 de la Commission, du 29 novembre 1978, modifiant
    le règlement (CEE) n° 2695/77 déterminant les conditions auxquelles est subordonnée
    l' admission de produits destinés à certaines catégories d' aérodynes ou de
    bateaux au bénéfice d' un régime tarifaire favorable à l' importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2788/78 der Kommission vom 29. November 1978 zur Änderung
    der Verordnung (EWG) Nr. 2695/77 zur Festlegung der Voraussetzungen, denen abgabenbegünstigt
    eingeführte Waren für bestimmte Arten von Luft- und Wasserfahrzeugen unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2788/78 af 29. november 1978 om ændring
    af forordning (EØF) nr. 2695/77 om fastsættelse af betingelserne for indrømmelse
    af toldlempelser ved indførsel af varer, bestemt til visse fly- eller skibskategorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2788/78 τής Επιτροπής
    τής 29ης Νοεμβρίου 1978 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 2695/77 «περί καθορισμού
    τών όρων από τούς οποίους εξαρτάται η εισαγωγή
    προϊόντων προοριζομένων γιά ορισμένες κατηγορίες
    αεροδυνάμων ή πλοίων μέ τό ευεργέτημα ευνοϊκού
    δασμολογικού καθεστώτος»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2788/78 della Commissione, del 29 novembre 1978, che
    modifica il regolamento (CEE) n. 2695/77 che determina le condizioni per l' ammissione
    dei prodotti destinati a talune categorie di aerodine o di navi al beneficio di
    un regime tariffario favorevole all' importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2788/78 van de Commissie van 29 november 1978 tot
    wijziging van Verordening (EEG) nr. 2695/77 houdende vaststelling van de voorwaarden
    en bepalingen, waaraan bij invoer van produkten bestemd voor bepaalde categorieën
    vliegtoestellen of schepen, de toepassing van een gunstige tariefregeling is onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2788/78 da Comissão, de 29 de Novembro de 1978,
    que altera o Regulamento (CEE) n.° 2695/77 que determina as condições a que
    se subordina a admissão de produtos destinados a determinadas categorias de aeródinos
    ou de embarcações ao benefício de um regime pautal favorável à importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2788/78 de la Comisión, de 29 de noviembre de 1978,
    por el que se modifica el Reglamento (CEE) n° 2695/77 por el que se fijan las
    condiciones a las que está supeditada la concesión a productos destinados a
    ciertas categorías de aerodinos o de barcos de los beneficios de un régimen
    arancelario de importación favorable
  type: main
