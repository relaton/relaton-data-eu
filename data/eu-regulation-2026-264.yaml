    modifiant les normes techniques de réglementation définies dans le règlement
    délégué (UE) 2018/1645 en ce qui concerne la forme et le contenu à respecter
    pour les demandes de reconnaissance soumises à l’Autorité européenne des
    marchés financiers et dans le règlement délégué (UE) 2018/1646 en ce qui
    concerne les informations à fournir dans les demandes d’agrément et les demandes
    d’enregistrement
