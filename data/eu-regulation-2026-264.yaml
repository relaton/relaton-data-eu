  content: Commission Delegated Regulation (EU) 2026/264 of 27 October 2025 amending
    the regulatory technical standards laid down in Delegated Regulation (EU) 2018/1645
    as regards the form and content of an application for recognition with the European
    Securities and Markets Authority and in Delegated Regulation (EU) 2018/1646 as
    regards the information to be provided in an application for authorisation and
    registration
  type: main
- language: fr
  script: Latn
