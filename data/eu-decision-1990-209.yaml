---
id: EUDecision1990209
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/209/EEC: Commission Decision of 19 April 1990 releasing the Member
    States from the obligation to apply to certain species the provisions of Council
    Directive 70/458/EEC on the marketing of vegetable seed, amending Decisions 73/122/EEC
    and 74/358/EEC and repealing Decision 74/363/EEC'
  type: main
- language: fr
  script: Latn
  content: '90/209/CEE: Décision de la Commission, du 19 avril 1990, dispensant les
    États membres d''appliquer à certaines espèces la directive 70/458/CEE du Conseil
    concernant la commercialisation des semences de légumes, modifiant les décisions
    73/122/CEE et 74/358/CEE et abrogeant la décision 74/363/CEE'
  type: main
- language: de
  script: Latn
  content: '90/209/EWG: Entscheidung der Kommission vom 19. April 1990 zur Freistellung
    der Mitgliedstaaten von der Verpflichtung zur Anwendung der Richtlinie 70/458/EWG
    des Rates über den Verkehr mit Gemüsesaatgut auf bestimmte Arten sowie zur Änderung
    der Entscheidungen 73/122/EWG und 74/358/EWG und zur Aufhebung der Entscheidung
    74/363/EWG'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 19 април 1990 година
    за освобождаване на държавите-членки от задължението
    да прилагат към определени видове разпоредбите
    на Директива 70/458/ЕИО на Съвета относно търговията
    със семена от зеленчуци, за изменение на Решения
    73/122/ЕИО и 74/358/ЕИО и за отмяна на Решение 74/363/ЕИО
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 19. dubna 1990, kterým se členské státy osvobozují
    od povinnosti používat směrnici Rady 70/458/EHS o uvádění osiva zeleniny
    na trh na některé druhy, kterým se mění rozhodnutí 73/122/EHS a 74/358/EHS
    a kterým se zrušuje rozhodnutí 74/363/EHS (90/209/EHS)
  type: main
- language: da
  script: Latn
  content: '90/209/EØF: Kommissionens beslutning af 19. april 1990 om fritagelse
    af medlemsstaterne fra for nogle arters vedkommende at anvende bestemmelserne
    i Rådets direktiv 70/458/EØF om handel med grønsagsfrø, om ændring af beslutning
    73/122/EØF og 74/358/EØF og om ophævelse af beslutning 74/363/EØF'
  type: main
- language: el
  script: Grek
  content: '90/209/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Απριλίου 1990 περί απαλλαγής των κρατών μελών
    από την υποχρέωση εφαρμογής σε ορισμένα είδη
    των διατάξεων της οδηγίας 70/458/ΕΟΚ του Συμβουλίου
    περί της εμπορίας σπόρων προς σπορά κηπευτικών,
    περί της τροποποίησης των αποφάσεων 73/122/ΕΟΚ
    και 74/358/ΕΟΚ και κατάργησης της απόφασης 74/363/ΕΟΚ'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 19. aprill 1990, millega liikmesriigid vabastatakse kohustusest
    kohaldada teatavate liikide suhtes nõukogu direktiivi 70/458/EMÜ (köögiviljaseemne
    turustamise kohta) sätteid, muudetakse otsust 73/122/EMÜ ja tunnistatakse kehtetuks
    otsus 74/363/EMÜ
  type: main
- language: fi
  script: Latn
  content: '90/209/ETY: Komission päätös, tehty 19 päivänä huhtikuuta 1990,
    jäsenvaltioiden vapauttamisesta velvollisuudesta soveltaa vihannesten siementen
    pitämisestä kaupan annettua neuvoston direktiiviä tiettyihin lajeihin 70/458/ETY,
    päätösten 73/122/ETY ja 74/358/ETY muuttamisesta sekä päätöksen 74/363/ETY
    kumoamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1990. április 19.) a tagállamoknak a zöldségvetőmag
    forgalmazásáról szóló 70/458/EGK tanácsi irányelv rendelkezéseinek egyes
    fajokra történő alkalmazása alóli mentesítéséről, a 73/122/EGK és a
    74/358/EGK határozatok módosításáról és a 74/363/EGK határozat hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: '90/209/CEE: Decisione della Commissione, del 19 aprile 1990, che dispensa
    gli Stati membri dell''obbligo di applicare a talune specie le disposizioni della
    direttiva 70/458/CEE del Consiglio relativa alla commercializzazione delle sementi
    di ortaggi, che modifica le decisioni 73/122/CEE e 74/358/CEE e che abroga la
    decisione 74/363/CEE'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1990. gada 19. aprīlis), ar ko dalībvalstis tiek atbrīvotas
    no pienākuma piemērot noteiktām sugām Padomes Direktīvas 70/458/EEK par dārzeņu
    sēklu tirdzniecību noteikumus, groza Lēmumu 73/122/EEK un 74/358/EEK, kā arī
    atceļ Lēmumu 74/363/EEK
  type: main
- language: lt
  script: Latn
  content: 1990 m. balandžio 19 d. Komisijos Sprendimas atleidžiantis valstybes
    nares nuo įpareigojimo tam tikroms rūšims taikyti Tarybos direktyvos 70/458/EEB
    dėl prekybos daržovių sėkla, nuostatas, iš dalies keičiantis Sprendimus
    73/122/EEB ir 74/358/EEB ir panaikinantis Sprendimą 74/363/EEB
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-kummissjoni tad-19 ta' April 1990 li tħoll lill-Istati
    Membri mill-obbligu li japplikaw għal ċerti speċi d-disposizzjonijiet tad-Direttiva
    tal-Kunsill 70/458/KEE dwar il-marketing ta' żerriegħa tal-ħaxix, li temenda
    d-Deċiżjonijiet 73/122/KEE u 74/358/KEE waqt li tirrevoka 74/363/KEE
  type: main
- language: nl
  script: Latn
  content: '90/209/EEG: Beschikking van de Commissie van 19 april 1990 tot vrijstelling
    van de Lid-Staten van de verplichting om voor sommige soorten de bepalingen van
    Richtlijn 70/458/EEG van de Raad betreffende het in de handel brengen van groentezaad
    toe te passen, wijziging van de Beschikkingen 73/122/EEG en 74/358/EEG en intrekking
    van Beschikking 74/363/EEG'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 19 kwietnia 1990 r. zwalniająca Państwa Członkowskie
    z obowiązku stosowania w odniesieniu do niektórych gatunków przepisów dyrektywy
    Rady 70/458/EWG w sprawie obrotu materiałem siewnym warzyw, zmieniająca decyzje
    73/122/EWG i 74/358/EWG oraz uchylająca decyzję 74/363/EWG
  type: main
- language: pt
  script: Latn
  content: '90/209/CEE: Decisão da Comissão, de 19 de Abril de 1990, que dispensa
    os Estados-membros de aplicar a determinadas espécies o disposto na Directiva
    70/458/CEE do Conselho, relativa à comercialização de sementes de produtos
    hortícolas, altera as Decisões 73/122/CEE e 74/358/CEE e revoga a Decisão 74/363/CEE'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 19 aprilie 1990 privind exonerarea statelor membre
    de la aplicarea, pentru anumite specii, a Directivei 70/458/CEE a Consiliului
    privind comercializarea semințelor de legume, modificând Deciziile 73/122/CEE
    și 74/358/CEE și abrogând Decizia 74/363/CEE
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 19. apríla 1990, ktorým sa členské štáty oslobodzujú
    od povinnosti uplatňovať na určité druhy ustanovenia smernice Rady 70/458/EHS
    o obchodovaní s osivom zelenín, ktorým sa menia a dopĺňajú rozhodnutia 73/122/EHS
    a 74/358/EHS a ruší rozhodnutie 74/363/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 19. aprila 1990 o razrešitvi obveznosti držav
    članic, da za določene vrste uporabljajo določbe Direktive Sveta 70/458/EGS
    o trženju semena zelenjadnic, o spremembi odločb 73/122/EGS in 74/358/EGS ter
    razveljavitvi Odločbe 74/363/EGS
  type: main
- language: es
  script: Latn
  content: '90/209/CEE: Decisión de la Comisión, de 19 de abril de 1990, por la
    que se exime a los Estados miembros de la obligación de aplicar a determinadas
    especies las disposiciones de la Directiva 70/458/CEE del Consejo referente a
    la comercialización de las semillas de plantas hortícolas, por la que se modifican
    las Decisiones 73/122/CEE y 74/358/CEE y por la que se deroga la Decisión 74/363/CEE'
  type: main
- language: sv
  script: Latn
  content: '90/209/EEG: Kommissionens beslut av den 19 april 1990 om tillstånd för
    medlemsstaterna att, för vissa arter, inte behöva tillämpa bestämmelserna
    i rådets direktiv 70/458/EEG om saluföring av utsäde av köksväxter och om
    ändring av beslut 73/122/EEG och 74/358/EEG och om upphävande av beslut 74/363/EEG'
  type: main
