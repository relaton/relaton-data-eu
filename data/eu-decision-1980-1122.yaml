title:
- language: en
  script: Latn
  content: '80/1122/EEC: Commission Decision of 20 November 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure
    incurred during 1979 on aids and premiums relating to the modernization of farms,
    including those in the less-favoured farming areas (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1122/CEE: Décision de la Commission, du 20 novembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", au Royaume de Belgique des dépenses effectuées pendant
    l''année 1979 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1122/EWG: Entscheidung der Kommission vom 20. November 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben für Beihilfen
    und Prämien zur Modernisierung landwirtschaftlicher Betriebe - einschließlich
    der Hilfen für benachteiligte landwirtschaftliche Gebiete - durch den EAGFL,
    Abteilung Ausrichtung, an das Königreich Belgien (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1122/EØF: Kommissionens beslutning af 20. november 1980 om refusion
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af de udgifter, som
    er afholdt i løbet af året 1979 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, herunder bedrifter beliggende i ugunstigt stillede områder
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/1122/CEE: Decisione della Commissione, del 20 novembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate nel 1979 per gli aiuti e i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1122/EEG: Beschikking van de Commissie van 20 november 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de in het jaar 1979 door
    het Koninkrijk België gedane uitgaven voor steun en premies voor de modernisering
    van landbouwbedrijven, ook in agrarische probleemgebieden (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
