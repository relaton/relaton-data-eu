title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1713/2004 of 30 september 2004 laying down
    derogations from Regulation (EC) No 800/1999 as regards products in the form of
    goods not covered by Annex I to the Treaty exported to third countries other than
    Bulgaria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1713/2004 de la Commission du 30 septembre 2004 fixant
    des dérogations au règlement (CE) n° 800/1999 dans le secteur des produits
    exportés sous forme de marchandises ne relevant pas de l'annexe I du traité
    vers des pays tiers autres que la Bulgarie
  type: main
- language: de
  script: Latn
