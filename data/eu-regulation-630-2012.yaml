title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 630/2012 of 12 July 2012 amending Regulation
    (EC) No 692/2008, as regards type-approval requirements for motor vehicles fuelled
    by hydrogen and mixtures of hydrogen and natural gas with respect to emissions,
    and the inclusion of specific information regarding vehicles fitted with an electric
    power train in the information document for the purpose of EC type-approval
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 630/2012 de la Commission du 12 juillet 2012 modifiant
    le règlement (CE) n ° 692/2008 en ce qui concerne, d'une part, les prescriptions
    pour la réception par type des véhicules à moteur fonctionnant à l'hydrogène
    ou avec des mélanges d'hydrogène et de gaz naturel au regard des émissions,
    et, d'autre part, l'inclusion d'informations spécifiques concernant les véhicules
    équipés d'une chaîne de traction électrique dans la fiche de renseignements
    pour la réception CE par type
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 630/2012 der Kommission vom 12. Juli 2012 zur Änderung
    der Verordnung (EG) Nr. 692/2008 bezüglich der Anforderungen für die Typgenehmigung
    von mit Wasserstoff und Gemischen aus Wasserstoff und Erdgas betriebenen Kraftfahrzeugen
    hinsichtlich der Emissionen und bezüglich der Aufnahme spezifischer Informationen
    zu Fahrzeugen mit Elektroantrieb in den Beschreibungsbogen für die EG-Typgenehmigung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 630/2012 на Комисията от 12
    юли 2012 година за изменение на Регламент (ЕО)
    № 692/2008 относно изискванията за одобрение на
    типа на моторни превозни средства, задвижвани
    от водород и смеси от водород и природен газ,
    по отношение на емисиите, и включването на
    специфична информация относно превозни средства,
    оборудвани с електрическо силово предаване,
    в информационния документ за целите на ЕО одобрението
    на типа
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 630/2012 ze dne 12. července 2012 , kterým
    se mění nařízení (ES) č. 692/2008, pokud jde o požadavky na schvalování
    typu motorových vozidel poháněných vodíkem a směsmi vodíku a zemního plynu
    z hlediska emisí a o specifické informace o vozidlech poháněných elektrickým
    hnacím ústrojím uváděné v informačním dokumentu pro účely ES schválení
    typu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 630/2012 af 12. juli 2012 om ændring
    af forordning (EF) nr. 692/2008, med hensyn til krav til typegodkendelse af motorkøretøjer,
    der kører på hydrogen og blandinger af hydrogen og naturgas med hensyn til emissioner
    og optagelse af specifikke oplysninger vedrørende køretøjer udstyret med et
    elektrisk effektdrev i oplysningsskema til brug ved EF-typegodkendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 630/2012 της Επιτροπής,
    της 12ης Ιουλίου 2012 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 692/2008 σχετικά με τις απαιτήσεις
    έγκρισης τύπου μηχανοκίνητων οχημάτων που
    κινούνται με υδρογόνο και μείγματα υδρογόνου
    και φυσικού αερίου όσον αφορά εκπομπές, και
    τη προσθήκη ειδικών πληροφοριών σχετικά με
    οχήματα εφοδιασμένα με ηλεκτρικό σύστημα κίνησης
    στο έγγραφο πληροφοριών με σκοπό την έγκριση
    τύπου ΕΚ
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 630/2012, 12. juuli 2012 , millega muudetakse
    määrust (EÜ) nr 692/2008 seoses vesinikul ning vesiniku ja maagaasi segude
    kütusel töötavate mootorsõidukite tüübikinnituse nõuetega heitkoguste osas
    ning seoses paigaldatud elektrijõuallikaga sõidukeid käsitleva eriteabe lisamisega
    EÜ tüübikinnituse teabedokumenti
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 630/2012, annettu 12 päivänä heinäkuuta 2012
    , asetuksen (EY) N:o 692/2008 muuttamisesta siltä osin kuin kyse on vetyä ja
    vety-maakaasuseoksia polttoaineenaan käyttävien moottoriajoneuvojen tyyppihyväksynnästä
    päästöjen osalta sekä sähköistä voimalaitetta käyttäviä ajoneuvoja koskevista
    erityisistä tiedoista, jotka annetaan EY-tyyppihyväksyntää varten käytettävässä
    ilmoituslomakkeessa
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 630/2012 od 12. srpnja 2012. o izmjeni Uredbe
    (EZ) br. 692/2008 u odnosu na zahtjeve za homologaciju tipa motornih vozila s
    pogonom na vodik i mješavine vodika i prirodnog plina s obzirom na emisije i
    uključivanje posebnih podataka o vozilima s elektropogonom u opisnom dokumentu
    za EZ homologaciju tipa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 630/2012/EU rendelete ( 2012. július 12. ) a 692/2008/EK
    rendelet hidrogénnel és hidrogén és földgáz keverékével üzemelő gépjárműveknek
    a kibocsátásra vonatkozó típus-jóváhagyási követelményei, valamint a
    villamos erőátviteli rendszerrel rendelkező járművekre vonatkozó egyedi
    információknak az EK-típusjóváhagyáshoz beadandó adatközlő lapon való
    feltüntetése tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 630/2012 della Commissione, del 12 luglio 2012 , che
    modifica il regolamento (CE) n. 692/2008 per quanto concerne le prescrizioni relative
    all'omologazione dei veicoli a motore alimentati a idrogeno e a miscele di idrogeno
    e gas naturale riguardo alle emissioni e l'inclusione di informazioni specifiche
    sui veicoli muniti di un motopropulsore elettrico nella scheda informativa ai
    fini dell'omologazione CE
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 630/2012 ( 2012. gada 12. jūlijs ), ar ko groza
    Regulu (EK) Nr. 692/2008 attiecībā uz tipa apstiprinājuma prasībām mehāniskiem
    transportlīdzekļiem, kuros kā degvielu izmanto ūdeņradi un ūdeņraža un
    dabasgāzes maisījumus, saistībā ar emisijām un attiecībā uz konkrētas
    informācijas iekļaušanu saistībā ar transportlīdzekļiem, kas aprīkoti
    ar elektrisko spēka piedziņas bloku, informācijas dokumentā transportlīdzekļu
    EK tipa apstiprinājumam
  type: main
- language: lt
  script: Latn
  content: 2012 m. liepos 12 d. Komisijos reglamentas (ES) Nr. 630/2012, kuriuo iš
    dalies keičiamos Reglamento (EB) Nr. 692/2008 nuostatos dėl vandeniliu ir vandenilio
    ir gamtinių dujų mišiniais varomų variklinių transporto priemonių tipo patvirtinimo
    reikalavimų, atsižvelgiant į išmetamųjų teršalų kiekį, ir specialios
    informacijos apie transporto priemones, kuriose įrengta elektros pavara, pateikimo
    informaciniame dokumente, suteikiant EB tipo patvirtinimą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 630/2012 tat- 12 ta’ Lulju 2012 li
    jemenda r-Regolament (KE) Nru 692/2008, dwar l-approvazzjoni tat-tip ta’ vetturi
    bil-mutur li jużaw l-idroġenu u taħlitiet ta' idroġenu u gass naturali bħala
    fjuwil fir-rigward ta' emissjonijiet, u l-inklużjoni ta' informazzjoni speċifika
    dwar vetturi mgħammra b'power train elettrika fid-dokument ta' informazzjoni
    għall-għan tal-approvazzjoni tat-tip tal-KE
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 630/2012 van de Commissie van 12 juli 2012 tot wijziging
    van Verordening (EG) nr. 692/2008 wat betreft de typegoedkeuringsvoorschriften
    voor motorvoertuigen op waterstof en op mengsels van waterstof en aardgas met
    betrekking tot emissies, alsmede de opneming van specifieke informatie betreffende
    met een elektrische aandrijflijn uitgeruste voertuigen in het inlichtingenformulier
    voor EG-typegoedkeuring
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 630/2012 z dnia 12 lipca 2012 r. zmieniające
    rozporządzenie (WE) nr 692/2008 w zakresie wymagań dotyczących homologacji
    typu pojazdów silnikowych napędzanych wodorem oraz mieszaniną wodoru i gazu
    ziemnego w odniesieniu do emisji oraz uwzględniania szczegółowych informacji
    dotyczących pojazdów wyposażonych w elektryczny układ napędowy w dokumencie
    informacyjnym dla celów homologacji typu WE
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 630/2012 da Comissão, de 12 de julho de 2012 ,
    que altera o Regulamento (CE) n. ° 692/2008 relativamente aos requisitos para
    a homologação dos veículos a motor alimentados a hidrogénio e misturas de
    hidrogénio e gás natural no que respeita às emissões e à inclusão de informação
    específica no tocante a veículos equipados com um grupo motopropulsor eléctrico
    na ficha de informações para efeitos de homologação CE
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 630/2012 al Comisiei din 12 iulie 2012 de modificare
    a Regulamentului (CE) nr. 692/2008, privind cerințele în ceea ce privește emisiile
    pentru omologarea de tip a autovehiculelor care utilizează hidrogen și amestecuri
    de hidrogen și gaz natural și includerea informațiilor specifice privind vehiculele
    echipate cu grup motopropulsor electric în documentul de informare, în scopul
    omologării CE de tip
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 630/2012 z 12. júla 2012 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 692/2008, pokiaľ ide o požiadavky na typové
    schvaľovanie motorových vozidiel poháňaných vodíkom a zmesami vodíka a
    zemného plynu z hľadiska emisií a o uvádzanie osobitných informácií týkajúcich
    sa vozidiel vybavených elektrickou hnacou súpravou v informačnom dokumente
    na účely typového schvaľovania ES
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 630/2012 z dne 12. julija 2012 o spremembi Uredbe
    Komisije (ES) št. 692/2008 v zvezi z zahtevami za homologacijo motornih vozil
    s pogonom na vodik ter mešanice vodika in zemeljskega plina glede na emisije
    ter v zvezi z vključitvijo specifičnih informacij o vozilih, opremljenih z električnim
    prenosom moči, v opisni list za namen ES-homologacije
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 630/2012 de la Comisión, de 12 de julio de 2012 ,
    por el que se modifica el Reglamento (CE) n ° 692/2008 en lo que respecta a los
    requisitos de homologación de tipo de los vehículos de motor alimentados con
    hidrógeno o con una mezcla de hidrógeno y gas natural por lo que se refiere
    a las emisiones, y en lo que respecta a la inclusión de información específica
    relativa a los vehículos equipados con una cadena de tracción eléctrica en
    la ficha de características a efectos de la homologación de tipo CE
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 630/2012 av den 12 juli 2012 om ändring
    av förordning (EG) nr 692/2008 när det gäller typgodkännandekrav i fråga
    om utsläpp för motorfordon som drivs av vätgas och blandningar av vätgas och
    naturgas, och införande av specifik information om fordon utrustade med eldrift
    i informationsdokumentet för EG-typgodkännande
