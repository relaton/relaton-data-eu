    period (notified under document C(2022) 8740) (Only the Romanian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2424 de la Commission du 5 décembre 2022 concernant
    la compatibilité des objectifs de performance contenus dans le projet de plan
