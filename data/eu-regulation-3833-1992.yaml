    afgebroken, alsmede van de bedragen van deze elementen voor het jaar 1993
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3833/92 da Comissão, de 28 de Dezembro de 1992,
    que fixa o ritmo de desmantelamento dos elementos destinados a assegurar, no sector
    dos cereais e do arroz, a protecção da indústria de transformação aplicável
    em Portugal e os respectivos montantes para 1993
  type: main
