  content: Commission Regulation (EEC) No 3833/92 of 28 December 1992 determining
    the rate at which the components intended to ensure protection of cereals and
    rice processing in Portugal are to be dismantled and fixing the amount thereof
    for 1993
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3833/92 de la Commission, du 28 décembre 1992, fixant
    le rythme de démantèlement des éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l'industrie de transformation applicable
    au Portugal ainsi que leurs montants pour l'année 1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3833/92 der Kommission vom 28. Dezember 1992 über
    den Abbau des Schutzes der portugiesischen Verarbeitungsindustrie im Sektor Getreide
    und Reis für das Jahr 1993
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3833/92 af 28. december 1992 om afviklingstakten
    for de for Portugal gældende elementer, der inden for korn- og rissektoren skal
    sikre beskyttelsen af forarbejdningsindustrien, og om fastsættelse af beløbene
    for 1993
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3833/92 της Επιτροπής
