  script: Latn
  content: '2004/367/EC: Commission Decision of 19 April 2004 amending Decision 95/30/EC
    to lay down the conditions for imports from Morocco of bivalve molluscs belonging
    to the species Acanthocardia tuberculatum harvested and processed under the conditions
    of Decision 96/77/EC (Text with EEA relevance) (notified under document number
    C(2004) 1386)'
  type: main
- language: fr
  script: Latn
  content: '2004/367/CE: Décision de la Commission du 19 avril 2004 modifiant la
    décision 95/30/CE afin de fixer les conditions d''importation en provenance du
    Maroc des mollusques bivalves appartenant à l''espèce Acanthocardia tuberculatum
    récoltés et transformés conformément aux conditions de la décision 96/77/CE
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2004)
    1386]'
  type: main
- language: de
