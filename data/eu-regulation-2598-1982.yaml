title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2598/82 of 28 September 1982 re-establishing
    the levying of customs duties on vitamins B* and H, falling within subheading
    29.38 B ex II and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2598/82 de la Commission, du 28 septembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux vitamines
    B* et H, de la sous-position 29.38 B ex II du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseile
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2598/82 der Kommission vom 28. September 1982 zur
    Wiedereinführung der Erhebung der Zölle für Vitamine B* und H der Tarifstelle
    29.38 B ex II, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2598/82 af 28. september 1982 om genindførelse
    af opkrævning af told for vitamin B* og H henhørende under pos. 29.38 B ex II
    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81t
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2598/82 τής Επιτροπής
    τής 28ης Σεπτεμβρίου 1982 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τίς βιταμίνες
    Β6 καί Η τής διακρίσεως 29. 38 Β ex II τού Κοινού
    Δασμολογίου, καταγωγής Κίνας, δικαιούχου τών
    προβλεπομένων από τόν κανονισμό (EOK) αριθ. 3601/81
    τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2598/82 della Commissione, del 28 settembre 1982,
    che ripristina la riscossione dei dazi doganali applicabili alle vitamine B* e
    H, della sottovoce 29.38 B ex II della tariffa doganale comune, originarie della
    Cina, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3601/81 del Consigliod
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2598/82 van de Commissie van 28 september 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vitaminen B*
    en H van postonderverdeling 29.38 B ex II, van oorsprong uit China, waarvoor de
    in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
