    Rates über Mindestanforderungen an Schiffe, die Seehäfen der Gemeinschaft anlaufen
    oder aus ihnen auslaufen und gefährliche oder umweltschädliche Güter befördern
    (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
