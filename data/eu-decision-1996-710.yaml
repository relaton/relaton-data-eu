title:
- language: en
  script: Latn
  content: '96/710/EC: Commission Decision of 27 November 1996 in application, at
    the request of Germany, of Article 5 (4) of Council Directive 93/75/EEC of 13
    September 1993 concerning minimum requirements for vessels bound for or leaving
    Community ports and carrying dangerous or polluting goods (The German text alone
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/710/CE: Décision de la Commission du 27 novembre 1996 en application,
    sur demande de l''Allemagne, de l''article 5 paragraphe 4 de la directive 93/75/CEE
    du Conseil, du 13 septembre 1993, relative aux conditions minimales exigées pour
    les navires à destination des ports maritimes de la Communauté ou en sortant
    et transportant des marchandises dangereuses ou polluantes (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/710/EG: Entscheidung der Kommission vom 27. November 1996 auf Antrag
