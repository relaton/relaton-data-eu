title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3153/78 of 21 December 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of certain non-member countries in the 200 nautical-mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3153/78 du Conseil, du 21 décembre 1978, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de certains pays tiers dans la zone de 200 milles
    située au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3153/78 des Rates vom 21. Dezember 1978 zur Festlegung
    von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    in der 200-Meilen-Zone vor der Küste des französischen Departements Guyana gegenüber
    Schiffen, die die Flagge von Drittländern führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3153/78 af 21. december 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse af fiskeressourcerne,
    gældende for fartøjer, der fører visse tredjelandes flag, i 200 sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3153/78 del Consiglio, del 21 dicembre 1978, che stabilisce
    talune misure temporanee per la conservazione e la gestione delle risorse ittiche
    da applicare alle navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia nautiche situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3153/78 van de Raad van 21 december 1978 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    visbestanden, van toepassing op schepen die de vlag voeren van bepaalde derde
    landen in de 200-mijlszone voor de kust van het Franse departement Guyana
  type: main
