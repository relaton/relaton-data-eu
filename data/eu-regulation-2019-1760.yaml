    určitých voľne žijúcich suchozemských cicavcov a chovných králikov do
    Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1760 z dne 23. oktobra 2019 o spremembi
