    įtraukimo į trečiųjų šalių arba jų dalių, iš kurių leidžiama į Sąjungą
    įvežti laukinių leporidae genties gyvūnų, tam tikrų laukinių sausumos žinduolių
    ir ūkiuose auginamų triušių mėsos siuntas, sąrašą iš dalies keičiamas
