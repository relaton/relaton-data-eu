  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1760 della Commissione del 23 ottobre
    2019 che modifica l’allegato I del regolamento (CE) n. 119/2009 per quanto riguarda
    l’inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord nell’elenco
    dei paesi terzi, o di parti di essi, autorizzati a introdurre nell’Unione partite
    di carne di leporidi selvatici, di alcuni mammiferi terrestri selvatici e di conigli
    d’allevamento
  type: main
- language: lv
  script: Latn
