title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1760 of 23 October 2019 amending
    Annex I to Regulation (EC) No 119/2009 as regards the inclusion of the United
    Kingdom of Great Britain and Northern Ireland in the list of third countries or
    parts thereof authorised for the introduction into the Union of consignments of
    meat of wild leporidae, of certain wild land mammals and of farmed rabbits
  type: main
- language: fr
  script: Latn
  content: Reglement D’execution (UE) 2019/1760 de la Commission du 23 octobre 2019
    modifiant l’annexe I du règlement (CE) no 119/2009 en ce qui concerne l’inscription
    du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord sur la liste des pays
    tiers ou parties de pays tiers en provenance desquels l’introduction dans l’Union
    de lots de viandes de léporidés sauvages, de certains mammifères terrestres
    sauvages et de lapins d’élevage est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1760 der Kommission vom 23. Oktober
