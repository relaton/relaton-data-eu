    iekļaušanu to trešo valstu vai to daļu sarakstā, no kurām Savienībā atļauts
    ievest savvaļas zaķu dzimtas dzīvnieku, noteiktu savvaļas sauszemes zīdītāju
    un saimniecībās audzētu trušu gaļas sūtījumus, groza Regulas (EK) Nr. 119/2009
