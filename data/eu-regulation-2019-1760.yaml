    auf die Aufnahme des Vereinigten Königreichs Großbritannien und Nordirland in
    die Liste von Drittländern und Teilen von Drittländern, aus denen die Einfuhr
    von Sendungen mit Fleisch von wildlebenden Hasenartigen, bestimmten wildlebenden
    Landsäugetieren und Nutzkaninchen in die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
