title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1482/95 of 28 June 1995 determining as a
    transitional measure the conversion rates to be applied under the Common Customs
    Tariff to agricultural products and certain products obtained from the processing
    thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1482/95 de la Commission, du 28 juin 1995, déterminant
    les taux de conversion à appliquer transitoirement dans le cadre du tarif douanier
    commun pour les produits des secteurs agricoles et certaines marchandises issues
    de la transformation de ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1482/95 der Kommission vom 28. Juni 1995 zur Bestimmung
    der im Rahmen des gemeinsamen Zolltarifs auf die landwirtschaftlichen Erzeugnisse
    und bestimmte Verarbeitungserzeugnisse befristet anzuwendenden Umrechnungskurse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1482/95 af 28. juni 1995 om fastsættelse
    af de omregningskurser, der skal anvendes i en overgangsperiode i forbindelse
    med den fælles toldtarif for landbrugsprodukter og visse varer, der er fremstillet
    ved forarbejdning af disse produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1482/95 της Επιτροπής
    της 28ης Ιουνίου 1995 για τον καθορισμό των ισοτιμιών
    που θα εφαρμοσθούν προσωρινώς στο πλαίσιο
    του κοινού δασμολογίου για τα προϊόντα των
    γεωργικών τομέων και ορισμένα εμπορεύματα
    που προέρχονται από τη μεταποίηση των προϊόντων
    αυτών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1482/95, annettu 28 päivänä kesäkuuta 1995,
    maatalousalojen tuotteiden ja kyseisistä tuotteista jalostuksessa saatujen tiettyjen
    tavaroiden osalta yhteisessä tullitariffissa väliaikaisesti sovellettavista
    muuntokursseista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1482/95 della Commissione, del 28 giugno 1995, che
    stabilisce i tassi di conversione da applicare in via transitoria nel quadro della
    tariffa doganale comune per i prodotti dei settori agricoli e per alcune merci
    ottenute dalla trasformazione di tali prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1482/95 van de Commissie van 28 juni 1995 tot vaststelling
    van de in het kader van het gemeenschappelijk douanetarief bij wijze van overgangsmaatregel
    toe te passen omrekeningskoersen voor landbouwprodukten en voor bepaalde door
    verwerking daarvan verkregen goederen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1482/95 da Comissão, de 28 de Junho de 1995, que
    determina as taxas de conversão a aplicar transitoriamente no âmbito da Pauta
    Aduaneira Comum para os produtos do sector agrícola e certas mercadorias resultantes
    da transformação desses produtos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1482/95 de la Comisión, de 28 de junio de 1995, por
    el que se determinan los tipos de conversión aplicables con carácter transitorio
    y con arreglo al arancel aduanero común a los productos del sector agrario y
    a determinadas mercancías procedentes de la transformación de dichos productos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1482/95 av den 28 juni 1995 om övergångsbestämmelser
    för omräkningskurserna inom ramen för Gemensamma tulltaxan för produkter från
    jordbrukssektorn och vissa bearbetade jordbruksvaror
