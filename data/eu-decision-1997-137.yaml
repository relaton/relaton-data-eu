title:
- language: en
  script: Latn
  content: '97/137/EC: Commission Decision of 3 February 1997 recognizing in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of prosulfuron and cyclanilide in Annex I of Council Directive
    91/414/EEC concerning the placing of plant protection products on the market'
  type: main
- language: fr
  script: Latn
  content: '97/137/CE: Décision de la Commission du 3 février 1997 reconnaissant
    en principe la conformité du dossier transmis pour examen détaillé dans la
    perspective de l''inscription du prosulfuron et du cyclanilide dans l''annexe
    I de la directive 91/414/CEE du Conseil concernant la mise sur le marché des
    produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
  content: '97/137/EG: Entscheidung der Kommission vom 3. Februar 1997 über die grundsätzliche
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Prosulfuron und Cyclanilid in Anhang
    I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    eingereicht wurden'
  type: main
- language: da
  script: Latn
  content: '97/137/EF: Kommissionens beslutning af 3. februar 1997 om principiel anerkendelse
    af, at det dossier, som er forelagt til grundig behandling med henblik på eventuel
    optagelse af prosulfuron og cyclanilid i bilag I til Rådets direktiv 91/414/EØF
    om markedsføring af plantebeskyttelsesmidler, er fuldstændigt'
  type: main
- language: el
  script: Grek
  content: '97/137/ΕΚ: Απόφαση της Επιτροπής της 3ης Φεβρουαρίου
    1997 με την οποία αναγνωρίζεται, καταρχήν, ότι
    είναι πλήρεις οι φάκελοι οι οποίοι έχουν υποβληθεί
    για λεπτομερή εξέταση ενόψει της ενδεχόμενης
    συμπερίληψης των ουσιών prosulfuron και cyclanilide στο
    παράρτημα Ι της οδηγίας 91/414/ΕΟΚ του Συμβουλίου
    όσον αφορά τη διάθεση στην αγορά φυτοπροστατευτικών
    προϊόντων'
  type: main
- language: fi
  script: Latn
  content: '97/137/EY: Komission päätös, tehty 3 päivänä helmikuuta 1997, yksityiskohtaista
