    prosulfuronin ja cyclanilidin mahdolliseksi sisällyttämiseksi kasvinsuojeluaineiden
    markkinoille saattamisesta annetun neuvoston direktiivin 91/414/ETY liitteeseen
    I'
  type: main
- language: it
  script: Latn
  content: '97/137/CE: Decisione della Commissione del 3 febbraio 1997 che riconosce
    in linea di massima la conformità dei fascicoli trasmessi per un esame dettagliato
    in vista di un eventuale inserimento di prosulfuron e ciclanilide nell''allegato
    I della direttiva 91/414/CEE del Consiglio, relativa all''immissione in commercio
    dei prodotti fitosanitari'
  type: main
- language: nl
  script: Latn
  content: '97/137/EG: Beschikking van de Commissie van 3 februari 1997 waarbij in
