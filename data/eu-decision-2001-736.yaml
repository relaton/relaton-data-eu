  content: '2001/736/EG: Kommissionens beslut av den 17 oktober 2001 om ändring av
    beslut 1999/283/EG om djurhälsovillkor och utfärdande av veterinärintyg för
    import av färskt kött från vissa afrikanska länder och om ändring av beslut
    2000/585/EG om djurhälso- och hygienkrav och utfärdande av veterinärintyg för
    import av kött av vilt, hägnat vilt och kanin från tredje länder (Text av
    betydelse för EES) [delgivet med nr K(2001) 3109]'
