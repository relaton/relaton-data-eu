  type: main
- language: it
  script: Latn
  content: '2001/736/CE: Decisione della Commissione, del 17 ottobre 2001, che modifica
    la decisione 1999/283/CE relativa alle condizioni di polizia sanitaria e alla
    certificazione veterinaria cui è subordinata l''importazione di carni fresche
    provenienti da alcuni paesi africani e la decisione 2000/585/CE della Commissione
    che stabilisce le condizioni sanitarie, di polizia sanitaria e di certificazione
    veterinaria per l''importazione dai paesi terzi di carni di selvaggina, carni
    di selvaggina di allevamento e carni di coniglio, per quanto concerne lo Zimbabwe
    (Testo rilevante ai fini del SEE) [notificata con il numero C(2001) 3109]'
  type: main
- language: nl
  script: Latn
  content: '2001/736/EG: Beschikking van de Commissie van 17 oktober 2001 tot wĳziging
    van Beschikking 1999/283/EG tot vaststelling van de veterinairrechtelĳke voorschriften
    en de voorschriften inzake veterinaire certificering voor de invoer van vers vlees
    uit bepaalde Afrikaanse landen en tot wĳziging van Beschikking 2000/585/EG tot
    vaststelling van de veterinairrechtelĳke voorschriften, de gezondheidsvoorschriften
    en de voorschriften inzake veterinaire certificering voor de invoer van vlees
    van vrĳ wild, vlees van gekweekt wild en konĳnenvlees uit derde landen, met
    betrekking tot Zimbabwe (Voor de EER relevante tekst) (kennisgeving geschied onder
    nummer C(2001) 3109)'
  type: main
- language: pt
  script: Latn
  content: '2001/736/CE: Decisão da Comissão, de 17 de Outubro de 2001, que altera
    a Decisão 1999/283/CE relativa às condições sanitárias e à certificação
    veterinária exigidas para a importação de carne fresca proveniente de determinados
    países africanos e que altera, no que respeita ao Zimbabué, a Decisão 2000/585/CE
    que estabelece as condições de saúde pública e de sanidade animal e a certificação
    veterinária para a importação de carne de coelho e de carne de caça selvagem
    e de criação proveniente de países terceiros (Texto relevante para efeitos
    do EEE) [notificada com o número C(2001) 3109]'
  type: main
- language: es
  script: Latn
  content: '2001/736/CE: Decisión de la Comisión, de 17 de octubre de 2001, que
    modifica la Decisión 1999/283/CE relativa a las condiciones zoosanitarias y a
    la certificación veterinaria aplicables a las importaciones de carne fresca procedente
    de determinados países africanos y que modifica la Decisión 2000/585/CE por
    que se establecen las condiciones zoosanitarias y de sanidad pública, así como
    la certificación veterinaria aplicables a la importación de carne silvestre,
    carne de caza de cría y carne de conejo procedente de terceros países, en lo
    que respecta a Zimbabue (Texto pertinente a efectos del EEE) [notificada con el
    número C(2001) 3109]'
  type: main
- language: sv
