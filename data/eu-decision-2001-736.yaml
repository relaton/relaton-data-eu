title:
- language: en
  script: Latn
  content: '2001/736/EC: Commission Decision of 17 October 2001 amending Decision
    1999/283/EC laying down the animal health conditions and veterinary certification
    for imports of fresh meat from certain African countries and amending Decision
    2000/585/EC laying down animal health conditions and veterinary certification
    for imports of wild and farmed game meat and rabbit meat from third countries,
    as regards Zimbabwe (Text with EEA relevance) (notified under document number
    C(2001) 3109)'
  type: main
- language: fr
  script: Latn
  content: '2001/736/CE: Décision de la Commission du 17 octobre 2001 modifiant la
    décision 1999/283/CE arrêtant les conditions sanitaires et de police sanitaire
    ainsi que la certification vétérinaire requises pour les importations de viandes
    fraîches en provenance de certains pays africains et modifiant la décision 2000/585/CE
    arrêtant les conditions sanitaires et de police sanitaire ainsi que la certification
    vétérinaire requises pour les importations de viandes de gibier d''élevage
    et de viandes de lapin en provenance de pays tiers, en ce qui concerne le Zimbabwe
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001)
    3109]'
  type: main
- language: de
  script: Latn
  content: '2001/736/EG: Entscheidung der Kommission vom 17. Oktober 2001 zur Änderung
    der Entscheidung 1999/283/EG über die Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von frischem Fleisch aus bestimmten afrikanischen Ländern und
    zur Änderung der Entscheidung 2000/585/EG zur Festlegung der Veterinärbedingungen
    und Veterinärbescheinigungen für die Einfuhr von Fleisch von frei lebendem Wild,
    Fleisch von Zuchtwild und Kaninchenfleisch aus Drittländern hinsichtlich Simbabwe
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001)
    3109)'
  type: main
- language: da
  script: Latn
  content: '2001/736/EF: Kommissionens beslutning af 17. oktober 2001 om ændring
    af beslutning 1999/283/EF om dyresundhedsmæssige betingelser og udstedelse af
    veterinærcertifikat ved indførsel af fersk kød fra visse afrikanske lande og
    om ændring af beslutning 2000/585/EF om dyre- og folkesundhedsmæssige betingelser
    og udstedelse af sundheds- og hygiejnecertifikat ved import af kød af vildtlevende
    og opdrættet vildt og kaninkød fra tredjelande for så vidt angår Zimbabwe
    (EØS-relevant tekst) (meddelt under nummer K(2001) 3109)'
  type: main
- language: el
