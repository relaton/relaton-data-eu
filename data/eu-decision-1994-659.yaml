    92/571/ΕΟΚ σχετικά με νέα μεταβατικά μέτρα που
    είναι αναγκαία για τη διευκόλυνση της μετάβασης
    στο καθεστώς κτηνιατρικών ελέγχων που προβλέπεται
    στην οδηγία 90/675/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '94/659/EY: Komission päätös, tehty 30 päivänä syyskuuta 1994, neuvoston
