    järjestelmään siirtymisen helpottamiseksi tarvittavista uusista siirtymätoimenpiteistä
    tehdyn päätöksen 92/571/ETY muuttamisesta neljännen kerran'
  type: main
- language: it
  script: Latn
  content: '94/659/CE: Decisione della Commissione del 30 settembre 1994 che modifica
