title:
- language: en
  script: Latn
  content: '94/659/EC: Commission Decision of 30 September 1994 amending for the fourth
    time Decision 92/571/EEC relating to new transitional measures which are necessary
    to facilitate the move to the system of veterinary checks provided for in Council
    Directive 90/675/EEC'
  type: main
- language: fr
  script: Latn
  content: '94/659/CE: Décision de la Commission du 30 septembre 1994 modifiant pour
    la quatrième fois la décision 92/571/CEE relative à de nouvelles mesures transitoires
    nécessaires afin de faciliter le passage au régime de contrôle vétérinaire
    prévu par la directive 90/675/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '94/659/EG: Entscheidung der Kommission vom 30. September 1994 zur vierten
    Änderung der Entscheidung 92/571/EWG über neue Überleitungsmaßnahmen zu Erleichterung
    des Übergangs zu der in der Richtlinie 90/675/EWG des Rates vorgesehenen Veterinärkontrollregelung'
  type: main
- language: da
  script: Latn
  content: '94/659/EF: Kommissionens beslutning af 30. september 1994 om fjerde ændring
    af beslutning 92/571/EØF om nye overgangsforanstaltninger, der kræves for at
    lette overgangen til veterinærkontrolordningen efter direktiv 90/675/EØF'
  type: main
- language: el
  script: Grek
  content: '94/659/ΕΚ: Απόφαση της Επιτροπής της 30ής Σεπτεμβρίου
