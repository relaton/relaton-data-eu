title:
- language: en
  script: Latn
  content: '83/374/EEC: Commission Decision of 19 July 1983 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of certain products
    originating in certain third countries which have been put into free circulation
    in the Community (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/374/CEE: Décision de la Commission du 19 juillet 1983 autorisant la
    République italienne à procéder à une surveillance intracommunautaire des
    importations de certains produits originaires de certains pays tiers et mis en
    libre pratique dans la Communauté (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '83/374/EWG: Entscheidung der Kommission vom 19. Juli 1983 zur Ermächtigung
    der Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Waren (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/374/EØF: Kommissionens beslutning af 19. juli 1983 om bemyndigelse
    af Den italienske Republik til at indføre tilsyn inden for Fællesskabet med
    indførsel af visse produkter med oprindelse i visse tredjelande til fri omsætning
    i Fællesskabet (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/374/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουλίου 1983 περί χορηγήσεως αδείας στην Ιταλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων προϊόντων, καταγωγής
    ορισμένων τρίτων χωρών, τα οποία τίθενται σε
    ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/374/CEE: Decisione della Commissione del 19 luglio 1983 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti originari di taluni paesi terzi e messi in libera pratica nella
    Comunità (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/374/EEG: Beschikking van de Commissie van 19 juli 1983 houdende machtiging
    van de Italiaanse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde produkten van oorsprong uit bepaalde derde
    landen die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst
    in de Italiaanse taal is authentiek)'
  type: main
