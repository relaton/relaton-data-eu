title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3033/79 of 28 December 1979 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3033/79 du Conseil, du 28 décembre 1979, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3033/79 des Rates vom 28. Dezember 1979 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände, die
    für Schiffe gelten, die die Flagge Norwegens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3033/79 af 28. december 1979 om fastsættelse
    af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, som fører norsk flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3033/79 del Consiglio, del 28 dicembre 1979, che dispone
    talune misure provvisorie di conservazione e di gestione delle risorse di pesca,
    da applicare alle navi battenti bandiera della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3033/79 van de Raad van 28 december 1979 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op vaartuigen die de vlag van Noorwegen voeren
  type: main
