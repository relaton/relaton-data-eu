title:
- language: en
  script: Latn
  content: '98/638/EC: Council Decision of 5 October 1998 relating to the conclusion
    of a Protocol for the adaptation of the trade aspects of the Europe Agreement
    between the European Communities and their Member States, of the one part, and
    the Slovak Republic, of the other part, to take into account the accession of
    the Republic of Austria, the Republic of Finland and the Kingdom of Sweden to
    the European Union and the results of the agricultural negotiations of the Uruguay
    Round, including the improvements of the existing preferential regime'
  type: main
- language: fr
  script: Latn
  content: '98/638/CE: Décision du Conseil du 5 octobre 1998 relative à la conclusion
    du protocole portant adaptation des aspects commerciaux de l''accord européen
    entre les Communautés européennes et leurs États membres, d''une part, et la
    République slovaque, d''autre part, afin de tenir compte de l''adhésion de la
    République d''Autriche, de la République de Finlande et du Royaume de Suède
    à l''Union européenne, ainsi que du résultat des négociations agricoles du
    cycle d''Uruguay et notamment des améliorations du régime préférentiel existant'
  type: main
- language: de
  script: Latn
  content: '98/638/EG: Beschluß des Rates vom 5. Oktober 1998 über den Abschluß
    des Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der
    Slowakischen Republik andererseits zur Berücksichtigung des Beitritts der Republik
    Österreich, der Republik Finnland und des Königreichs Schweden zur Europäischen
    Union und der Ergebnisse der Agrarverhandlungen der Uruguay-Runde einschließlich
    der Verbesserung der bestehenden Präferenzregelung'
  type: main
- language: da
  script: Latn
  content: '98/638/EF: Rådets afgørelse af 5. oktober 1998 om indgåelse af en protokol
    om tilpasning af handelsaspekterne i Europaaftalen mellem De Europæiske Fællesskaber
    og deres medlemsstater på den ene side og Den Slovakiske Republik på den anden
    side for at tage hensyn til Republikken Finlands, Kongeriget Sveriges og Republikken
    Østrigs tiltrædelse af Den Europæiske Union og resultaterne af landbrugsforhandlingerne
    under Uruguay-runden, også forbedringerne af den eksisterende præferenceordning'
  type: main
- language: el
  script: Grek
  content: '98/638/ΕΚ: Απόφαση του Συμβουλίου της 5ης Οκτωβρίου
    1998 σχετικά με τη σύναψη πρωτοκόλλου για την
    προσαρμογή των εμπορικών πτυχών της ευρωπαϊκής
    συμφωνίας μεταξύ των Ευρωπαϊκών Κοινοτήτων
    και των κρατών μελών τους, αφενός, και της Σλοβακικής
    Δημοκρατίας, αφετέρου, προκειμένου να ληφθούν
    υπόψη η προσχώρηση της Δημοκρατίας της Αυστρίας,
