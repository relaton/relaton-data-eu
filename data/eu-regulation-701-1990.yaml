title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 701/90 of 22 March 1990 suspending advance
    fixing of export refunds on certain cereals exported in the form of prepared foods
    obtained by the swelling or roasting of cereals or cereal products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 701/90 de la Commission du 22 mars 1990 portant suspension
    de la fixation à l'avance des restitutions à l'exportation de certaines céréales
    exportées sous forme de produits à base de céréales obtenus par soufflage
    ou grillage
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 701/90 DER KOMMISSION vom 22. Maerz 1990 zur Aussetzung
    der Vorausfestsetzung der Ausfuhrerstattungen fuer in Form von Lebensmitteln,
    durch Aufblaehen oder Roesten von Getreide oder Getreideerzeugnissen hergestellt,
    ausgefuehrtes Getreide
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 701/90 af 22. marts 1990 om suspension
    af forudfastsættelse af eksportrestitutioner for visse kornsorter, der udføres
    i form af varer fremstillet ved ekspandering eller ristning af korn eller kornprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 701/90 της Επιτροπής
    της 22ας Μαρτίου 1990 περί αναστολής του προκαθορισμού
    των επιστροφών κατά την εξαγωγή ορισμένων
    σιτηρών που εξάγονται υπό μορφή προϊόντων
    με βάση τα δημητριακά που λαμβάνονται με διόγκωση
    ή φρύξη
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 701/90 DELLA COMMISSIONE del 22 marzo 1990 recante
    sospensione della fissazione anticipata delle restituzioni all'esportazione di
    alcuni cereali esportati sotto forma di prodotti a base di cereali ottenuti per
    soffiatura o tostatura
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 701/90 VAN DE COMMISSIE van 22 maart 1990 houdende
    schorsing van de vaststelling vooraf van restituties bij uitvoer van bepaalde
    granen die worden uitgevoerd in de vorm van graanpreparaten verkregen door poffen
    of door roosteren
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 701/90 DA COMISSAO de 22 de Março de 1990 que estabelece
