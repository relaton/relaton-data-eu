    cereais exportados sob a forma de produtos à base de cereais, obtidos por expansao
    ou por torrefacçao
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 701/90 DE LA COMISION de 22 de marzo de 1990 por el
    que se establece la suspension de la fijacion por adelantado de las restituciones
    a la exportacion de determinados cereales exportados en forma de productos a base
    de cereales, obtenidos por insuflado o tostado
