- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1323 of 30 June 2025 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, the United Kingdom and the United States in the lists of third countries,
    territories or zones thereof authorised for the entry into the Union of consignments
    of poultry and germinal products of poultry and of fresh meat of poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1323 de la Commission du 30 juin 2025
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Canada, au Royaume-Uni et aux États-Unis
    dans les listes de pays tiers, de territoires ou de zones de pays tiers en provenance
    desquels l’entrée dans l’Union d’envois de volailles et de produits germinaux
    de volailles ainsi que de viandes fraîches de volailles est autorisée
  type: main
- language: de
  script: Latn
