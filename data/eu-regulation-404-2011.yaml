title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 404/2011 of 8 April 2011 laying
    down detailed rules for the implementation of Council Regulation (EC) No 1224/2009
    establishing a Community control system for ensuring compliance with the rules
    of the Common Fisheries Policy
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 404/2011 de la Commission du 8 avril
    2011 portant modalités d’application du règlement (CE) n ° 1224/2009 du Conseil
    instituant un régime communautaire de contrôle afin d’assurer le respect des
    règles de la politique commune de la pêche
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 404/2011 der Kommission vom 8. April
    2011 mit Durchführungsbestimmungen zu der Verordnung (EG) Nr. 1224/2009 des Rates
    zur Einführung einer gemeinschaftlichen Kontrollregelung zur Sicherstellung der
    Einhaltung der Vorschriften der gemeinsamen Fischereipolitik
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 404/2011 на Комисията
    от 8 април 2011 година за определяне на подробни
    правила за прилагането на Регламент (ЕО) №
    1224/2009 на Съвета за създаване на система за контрол
    на Общността за гарантиране на спазването
    на правилата на общата политика в областта
    на рибарството
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 404/2011 ze dne 8. dubna 2011
    , kterým se stanoví prováděcí pravidla k nařízení Rady (ES) č. 1224/2009
    o zavedení kontrolního režimu Společenství k zajištění dodržování pravidel
    společné rybářské politiky
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 404/2011 af 8. april 2011
    om gennemførelsesbestemmelser til Rådets forordning (EF) nr. 1224/2009 om oprettelse
    af en EF-kontrolordning med henblik på at sikre overholdelse af reglerne i den
    fælles fiskeripolitik
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 404/2011
    της Επιτροπής, της 8ης Απριλίου 2011 , για τη θέσπιση
    λεπτομερών κανόνων σχετικά με την εφαρμογή
    του κανονισμού (ΕΚ) αριθ. 1224/2009 περί της θέσπισης
    κοινοτικού συστήματος ελέγχου για την εξασφάλιση
    της τήρησης των κανόνων της κοινής αλιευτικής
    πολιτικής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 404/2011, 8. aprill 2011 , millega kehtestatakse
    nõukogu määruse (EÜ) nr 1224/2009 (millega luuakse ühenduse kontrollisüsteem
    ühise kalanduspoliitika eeskirjade järgimise tagamiseks) üksikasjalikud rakenduseeskirjad
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 404/2011, annettu 8 päivänä
    huhtikuuta 2011 , yhteisön valvontajärjestelmästä, jonka tarkoituksena on
    varmistaa yhteisen kalastuspolitiikan sääntöjen noudattaminen, annetun neuvoston
    asetuksen (EY) N:o 1224/2009 soveltamista koskevista yksityiskohtaisista säännöistä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 404/2011 od 8. travnja 2011. o detaljnim
    pravilima za provedbu Uredbe Vijeća (EZ) br. 1224/2009 o uspostavi sustava kontrole
    Zajednice za osiguranje sukladnosti s pravilima zajedničke ribarstvene politike
  type: main
- language: hu
  script: Latn
  content: A Bizottság 404/2011/EU végrehajtási rendelete ( 2011. április 8. )
    a közös halászati politika szabályainak betartását biztosító közösségi
    ellenőrző rendszer létrehozásáról szóló 1224/2009/EK tanácsi rendelet
    végrehajtására vonatkozó részletes szabályok megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 404/2011 della Commissione, dell' 8 aprile
    2011 , recante modalità di applicazione del regolamento (CE) n. 1224/2009 del
    Consiglio che istituisce un regime di controllo comunitario per garantire il rispetto
    delle norme della politica comune della pesca
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 404/2011 ( 2011. gada 8. aprīlis
    ), ar kuru pieņem sīki izstrādātus noteikumus par to, kā īstenojama Padomes
    Regula (EK) Nr. 1224/2009, ar ko izveido Kopienas kontroles sistēmu, lai nodrošinātu
    atbilstību kopējās zivsaimniecības politikas noteikumiem
  type: main
- language: lt
  script: Latn
  content: 2011 m. balandžio 8 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 404/2011,
    kuriuo nustatomos išsamios Tarybos reglamento (EB) Nr. 1224/2009, nustatančio
    Bendrijos kontrolės sistemą, kuria užtikrinamas bendrosios žuvininkystės
    politikos taisyklių laikymasis, įgyvendinimo taisyklės
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 404/2011 tat-
    8 ta’ April 2011 li jistabbilixxi regoli dettaljati għall-implimentazzjoni
    tar-Regolament tal-Kunsill (KE) Nru 1224/2009 li jistabbilixxi sistema Komunitarja
    ta’ kontroll għall-iżgurar tal-konformità mar-regoli tal-Politika Komuni
    tas-Sajd
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 404/2011 van de Commissie van 8 april 2011
    houdende bepalingen voor de uitvoering van Verordening (EG) nr. 1224/2009 van
    de Raad tot vaststelling van een communautaire controleregeling die de naleving
    van de regels van het gemeenschappelijk visserijbeleid moet garanderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 404/2011 z dnia 8 kwietnia 2011
    r. ustanawiające szczegółowe przepisy wykonawcze do rozporządzenia Rady (WE)
    nr 1224/2009 ustanawiającego wspólnotowy system kontroli w celu zapewnienia
    przestrzegania przepisów wspólnej polityki rybołówstwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 404/2011 da Comissão, de 8 de Abril
    de 2011 , que estabelece as regras de execução do Regulamento (CE) n. ° 1224/2009
    do Conselho que institui um regime comunitário de controlo a fim de assegurar
    o cumprimento das regras da Política Comum das Pescas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 404/2011 al Comisiei din 8
    aprilie 2011 de stabilire a normelor detaliate de aplicare a Regulamentului (CE)
    nr. 1224/2009 al Consiliului de stabilire a unui sistem comunitar de control pentru
    asigurarea respectării normelor politicii comune în domeniul pescuitului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 404/2011 z 8. apríla 2011 ,
    ktorým sa ustanovujú podrobné pravidlá vykonávania nariadenia Rady (ES) č.
    1224/2009, ktorým sa zriaďuje systém kontroly Spoločenstva na zabezpečenie
    dodržiavania pravidiel spoločnej politiky rybného hospodárstva
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 404/2011 z dne 8. aprila 2011 o določitvi
    podrobnih pravil za izvajanje Uredbe Sveta (ES) št. 1224/2009 o vzpostavitvi
    nadzornega sistema Skupnosti za zagotavljanje skladnosti s pravili skupne ribiške
    politike
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 404/2011 de la Comisión, de 8 de abril
    de 2011 , que establece las normas de desarrollo del Reglamento (CE) n ° 1224/2009
    del Consejo por el que se establece un régimen comunitario de control para garantizar
    el cumplimiento de las normas de la política pesquera común
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 404/2011 av den 8 april
    2011 om tillämpningsföreskrifter för rådets förordning (EG) nr 1224/2009
    om införande av ett kontrollsystem i gemenskapen för att säkerställa att bestämmelserna
    i den gemensamma fiskeripolitiken efterlevs
  type: main
