  content: Commission Regulation (EEC) No 3684/86 of 2 December 1986 fixing the prices
    to be used for calculating the value of agricultural products in intervention
    storage to be carried forward to the 1987 financial year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3684/86 de la Commission du 2 décembre 1986 fixant
    les prix à retenir pour le calcul de la valeur des produits agricoles en stock
    d' intervention et à reporter à l' exercice 1987
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3684/86 der Kommission vom 2. Dezember 1986 zur Festsetzung
    der Preise, die bei der Berechnung des Wertes der in Interventionslagerbeständen
    befindlichen und auf das Haushaltsjahr 1987 zu übertragenden landwirtschaftlichen
    Erzeugnisse zugrunde zu legen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3684/86 af 2. december 1986 om fastsættelse
    af de priser, der skal gælde ved beregning af værdien af de interventionslagre
    af landbrugsprodukter, som skal overføres til regnskabsåret 1987
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3684/86 της Επιτροπής
    της 2ας Δεκεμβρίου 1986 που καθορίζει τις τιμές
    που πρέπει να ληφθούν υπόψη για τον υπολογισμό
    της αξίας των γεωργικών προϊόντων που βρίσκονται
    σε απόθεμα παρέμβασης και πρόκειται να μεταφερθούν
    στη χρήση 1987
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3684/86 della Commissione del 2 dicembre 1986 che
    fissa i prezzi da prendere in considerazione per calcolare il valore dei prodotti
    agricoli giacenti all' intervento da riportare all' esercizio 1987
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3684/86 van de Commissie van 2 december 1986 houdende
    vaststelling van de prijzen die voor de berekening van de waarde van naar het
    begrotingsjaar 1987 over te boeken landbouwprodukten in interventievoorraden moeten
    worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3684/86 da Comissão de 2 de Dezembro de 1986 que
    fixa os preços a tomar em consideração para o cálculo do valor dos produtos
    agrícolas em existências de intervenção a transitar para o exercício de 1987
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3684/86 de la Comisión de 2 de diciembre de 1986
    por el que se fijan los precios que deben utilizarse para calcular el valor de
    los productos agrícolas que se encuentren en reserva de intervención y que deban
    ser pasados al ejercicio 1987
  type: main
