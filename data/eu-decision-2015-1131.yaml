    privremenu mjeru u skladu s člankom 129. Uredbe (EZ) br. 1907/2006 Europskog
    parlamenta i Vijeća o registraciji, evaluaciji, autorizaciji i ograničavanju
    kemikalija (REACH) radi ograničavanja uporabe amonijevih soli u izolacijskim
