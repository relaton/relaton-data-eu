title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/1131 of 10 July 2015 amending
    Implementing Decision 2013/505/EU authorising the provisional measure taken by
    the French Republic in accordance with Article 129 of Regulation (EC) No 1907/2006
    of the European Parliament and of the Council concerning the Registration, Evaluation,
    Authorisation and Restriction of Chemicals (REACH) to restrict the use of ammonium
    salts in cellulose wadding insulation materials (notified under document C(2015)
    4470)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/1131 de la Commission du 10 juillet 2015
    modifiant la décision d'exécution 2013/505/UE autorisant la mesure provisoire
    prise par la République française de restreindre l'utilisation des sels d'ammonium
    dans les isolants à base de ouate de cellulose, conformément à l'article 129
    du règlement (CE) n° 1907/2006 du Parlement européen et du Conseil concernant
    l'enregistrement, l'évaluation et l'autorisation des substances chimiques, ainsi
    que les restrictions applicables à ces substances (REACH) [notifiée sous le
    numéro C(2015) 4470]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/1131 der Kommission vom 10. Juli 2015
