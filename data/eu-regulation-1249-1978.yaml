    visse restprodukter af kobber samt visse former for affald og skrot af kobber,
    aluminium og bly
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1249/78 della Commissione, del 9 giugno 1978, che
    ripartisce i contingenti quantitativi comunitari all'esportazione per talune ceneri
    e per taluni residui da rame, nonché per taluni cascami e rottami di rame, di
    alluminio e di piombo
  type: main
- language: nl
