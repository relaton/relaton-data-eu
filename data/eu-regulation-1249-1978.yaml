    certaines cendres et certains résidus de cuivre ainsi que pour certains déchets
    et débris de cuivre, d'aluminium et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1249/78 der Kommission vom 9. Juni 1978 zur Aufteilung
