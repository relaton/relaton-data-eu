  content: Commission Regulation (EEC) No 1249/78 of 9 June 1978 allocating the Community
    quantitative export quotas for certain types of copper ash and residues and for
    certain types of copper, aluminium and lead waste and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1249/78 de la Commission, du 9 juin 1978, portant
