    von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten Schrott aus
    Kupfer, Aluminium und Blei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1249/78 af 9. juni 1978 om fordeling
