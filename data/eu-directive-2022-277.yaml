---
id: EUDirective2022277
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/277 of 13 December 2021 amending,
    for the purpose of adapting to technical and scientific progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of mercury in single capped (compact) fluorescent lamps
    for general lighting purposes < 30 W with a lifetime equal to or above 20000 h
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/277 de la Commission du 13 décembre 2021
    modifiant, aux fins de son adaptation au progrès technique et scientifique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption pour l’utilisation du mercure dans les lampes fluorescentes
    à simple culot (compactes), à usage d’éclairage général, de moins de 30
    W et à durée de vie égale ou supérieure à 20000 h
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/277 der Kommission vom 13. Dezember 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Quecksilber in einseitig
    gesockelten (Kompakt-)Leuchtstofflampen für allgemeine Beleuchtungszwecke < 30
    W mit einer Lebensdauer von 20000 Stunden oder mehr
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/277 на Комисията
    от 13 декември 2021 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение III към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаване от ограничението за употребата
    на живак в едноцокълни (компактни) луминесцентни
    лампи за целите на общото осветление < 30 W с
    продължителност на експлоатация, равна на
    или по-голяма от 20000 часа
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/277 ze dne 13. prosince
    2021, kterou se z důvodu přizpůsobení technickému a vědeckému pokroku mění
    příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o
    výjimku pro používání rtuti v jednopaticových (kompaktních) zářivkách
    pro všeobecné osvětlování < 30 W s životností 20000 h nebo vyšší
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/277 af 13. december 2021 om
    tilpasning til den tekniske og videnskabelige udvikling af bilag III til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af kviksølv i (kompakt)lysstofrør med én sokkel til almenbelysning < 30 W med
    en levetid på mindst 20000 timer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/277 της
    Επιτροπής της 13ης Δεκεμβρίου 2021 για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική και επιστημονική
    πρόοδο, του παραρτήματος IΙΙ της οδηγίας 2011/65/ΕΕ
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου,
    όσον αφορά εξαίρεση για τη χρήση υδραργύρου
    σε (συμπαγείς) λαμπτήρες φθορισμού ενός κάλυκα
    για σκοπούς γενικού φωτισμού < 30 W με διάρκεια
    ζωής 20000 ωρών και άνω
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/277, 13. detsember 2021, millega
    muudetakse tehnika ja teaduse arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL III lisa seoses erandiga, mis hõlmab elavhõbeda
    kasutamist üldotstarbelistes ühe sokliga (kompaktsetes) luminofoorlampides,
    mille võimsus on < 30 W ja mille tööiga on vähemalt 20000 tundi
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/277, annettu 13 päivänä joulukuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    poikkeuksesta, joka koskee elohopean käyttöä yleiskäyttöön tarkoitetuissa
    alle 30 watin yksikantaisissa pienloistelampuissa, joiden käyttöikä on vähintään
    20000 tuntia
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/277 ón gCoimisiún an 13 Nollaig 2021 lena
    leasaítear Iarscríbhinn III a ghabhann le Treoir 2011/65/AE ó Pharlaimint na
    hEorpa agus ón gComhairle, chun oiriúnú don dul chun cinn teicniúil agus eolaíoch,
    a mhéid a bhaineann le díolúine chun mearcair a úsáid i ndlúthshoilse fluaraiseacha
    aonchaidhpeacha chun críoch soilsithe ghinearálta < 30 W a maireann a saolré
    cothrom le 20000 u nó níos mo ná sin
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/277 оd 13. prosinca 2021. o izmjeni,
    u svrhu prilagodbe tehničkom i znanstvenom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu žive u (kompaktnim)
    fluorescentnim žaruljama s jednim podnoškom, za opće primjene osvjetljenja
    < 30 W, sa životnim vijekom jednakim ili duljim od 20000 h
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/277 felhatalmazáson alapuló irányelve (2021.
    december 13.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a higanynak az általános világítási célra szolgáló, 30 W alatti teljesítményű,
    legalább 20000 óra élettartamú, egy végükön fejelt kompakt fénycsövekben
    való felhasználására vonatkozó mentesség tekintetében, a tudományos és
    műszaki fejlődéshez történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/277 della Commissione del 13 dicembre 2021
    che modifica, adattandolo al progresso tecnico e scientifico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    un’esenzione relativa all’uso di mercurio nelle lampade fluorescenti ad attacco
    singolo (compatte) per usi generali di illuminazione < 30 W aventi una durata
    di vita di almeno 20000 ore
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/277 (2021. gada 13. decembris),
    ar ko, pielāgojot tehnikas un zinātnes attīstībai, groza Eiropas Parlamenta
    un Padomes Direktīvas 2011/65/ES III pielikumu attiecībā uz atbrīvojumu dzīvsudraba
    izmantošanai viencokola (kompaktajās) luminiscences spuldzēs vispārējai apgaismei
    < 30 W, ar kalpošanas laiku, kas vienāds ar vai lielāks par 20000 h
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/277 2021 m. gruodžio 13 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties naudoti gyvsidabrį
    bendrojo apšvietimo viencokolėse (kompaktinėse) liuminescencinėse < 30 W lempose,
    kurių naudojimo trukmė 20000 h arba ilgesnė, iš dalies keičiamas Europos
    Parlamento ir Tarybos direktyvos 2011/65/ES III priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/277 tat-13 ta’ Diċembru
    2021 li temenda, għall-fini ta’ adattament għall-progress tekniku u xjentifiku,
    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-merkurju fil-lampi fluworexxenti (kompatti) b’kappa
    waħda għal finijiet ta’ tidwil ġenerali < 30 W b’tul tal-ħajja ta’ 20000
    siegħa jew iktar
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/277 van de Commissie van 13 december 2021
    tot wijziging, met het oog op aanpassing aan de technische en wetenschappelijke
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van kwik in (compacte)
    fluorescentielampen met enkelvoudige lampvoet voor algemene verlichtingsdoeleinden
    < 30 W met een levensduur van ten minste 20000 branduren
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/277 z dnia 13 grudnia 2021 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik III do dyrektywy Parlamentu
    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego stosowania
    rtęci w jednotrzonkowych (kompaktowych) lampach fluorescencyjnych na potrzeby
    oświetlenia ogólnego < 30 W z okresem trwałości wynoszącym 20000 godzin lub
    więcej
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/277 da Comissão de 13 de dezembro de 2021
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de mercúrio em lâmpadas fluorescentes
    de casquilho simples (compactas) para iluminação geral, de potência < 30 W
    e vida útil igual ou superior a 20000 h
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/277 a Comisiei din 13 decembrie 2021 de modificare,
    în scopul adaptării la progresul tehnic și științific, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea mercurului în lămpi fluorescente cu un singur soclu
    (compacte) destinate iluminatului general < 30 W, cu o durată de viață mai
    mare sau egală cu 20000 de ore
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/277 z 13. decembra 2021, ktorou
    sa na účely prispôsobenia technickému a vedeckému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    na používanie ortuti v jednopäticových (kompaktných) žiarivkách na všeobecné
    účely osvetlenia s výkonom < 30 W a so životnosťou najmenej 20000 h
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/277 z dne 13. decembra 2021 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo živega srebra v (kompaktnih) fluorescentnih sijalkah z enojnim podnožjem
    za splošno razsvetljavo < 30 W z življenjsko dobo enako ali daljšo od 20000
    h zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/277 de la Comisión de 13 de diciembre de
    2021 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por
    lo que respecta a una exención relativa al uso de mercurio en lámparas fluorescentes
    de casquillo único (compactas) para usos generales de alumbrado, de menos de
    30 W con una vida útil igual o superior a 20000 horas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/277 av den 13 december 2021
    om ändring, för anpassning till den tekniska och vetenskapliga utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av kvicksilver i enkelsocklade (kompakta) lysrörslampor
    för allmänna belysningsändamål < 30 W med en livslängd lika med eller över
    20000 h
  type: main
