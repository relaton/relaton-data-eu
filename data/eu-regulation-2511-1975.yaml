id: EURegulation25111975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2511/75 of the Commission of 1 October 1975 re-establishing
    the levying of customs duties on women's, girls and infants' under garments, other
    than of cotton, falling within heading No ex 61.04, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3048/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2511/75 de la Commission, du 1er octobre 1975, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour femmes, fillettes et jeunes enfants, autres que
    de coton, de la position tarifaire EX 61.04, originaires des pays en voie de développement,
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    3048/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2511/75 der Kommission vom 1. Oktober 1975 zur Wiedereinführung
    des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen, Mädchen und Kleinkinder,
    andere als aus Baumwolle, der Tarifnummer ex 61.04, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3048/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2511/75 af 1. oktober 1975 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til kvinder, piger
    og småbørn, undtagen varer af bomuld, under position ex 61.04, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3048/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2511/75 della Commissione, del 1 ottobre 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per donna, per ragazza e per bambini, escluse quelle di cotone, della
    voce doganale ex 61.04, originarie dei paesi in via di sviluppo, beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3048/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2511/75 van de Commissie van 1 oktober 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op damesonderkleding,
    meisjesonderkleding en kinderonderkleding, andere dan van katoen van post ex 61.04,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3048/74 van de Raad van 2 december 1974 tariefpreferenties werden geopend
  type: main
