    vrst sadja s poreklom iz Argentine v Unijo, da se prepreči vnos vrste Phyllosticta
    citricarpa (McAlpine) Van der Aa v Unijo in njeno širjenje znotraj Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/1199 de la Comisión de 13 de agosto
