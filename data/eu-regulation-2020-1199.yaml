    u Uniju određenih plodova podrijetlom iz Argentine u svrhu sprečavanja unošenja
    u Uniju organizma Phyllosticta citricarpa (McAlpine) Van der Aa i njegova širenja
    unutar Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1199 végrehajtási rendelete (2020. augusztus 13.)
