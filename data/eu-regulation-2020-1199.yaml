    от 13 август 2020 година за изменение на приложение
    VI към Регламент за изпълнение (ЕС) 2019/2072 с цел
    временна забрана за въвеждане в Съюза на някои
    плодове с произход от Аржентина, за да се предотврати
    въвеждането и разпространението в Съюза на
    вредителя Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/1199 ze dne 13. srpna 2020, kterým
    se mění příloha VI prováděcího nařízení (EU) 2019/2072 s cílem dočasně
    zakázat dovoz některých plodů pocházejících z Argentiny do Unie, aby se
    zamezilo zavlékání organismu Phyllosticta citricarpa (McAlpine) Van der Aa
    do Unie a jeho rozšiřování na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/1199 af 13. august 2020
    om ændring af bilag VI til gennemførelsesforordning (EU) 2019/2072 for midlertidigt
    at forbyde indførsel til Unionen af visse frugter med oprindelse i Argentina
    for at forhindre indslæbning og spredning i Unionen af Phyllosticta citricarpa
    (McAlpine) Van der Aa
  type: main
- language: el
  script: Grek
