title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1199 of 13 August 2020 amending
    Annex VI to Implementing Regulation (EU) 2019/2072 to temporarily prohibit the
    introduction into the Union of certain fruits originating in Argentina to prevent
    the introduction into and the spread within the Union of Phyllosticta citricarpa
    (McAlpine) Van der Aa
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1199 de la Commission du 13 août 2020
    modifiant l’annexe VI du règlement d’exécution (UE) 2019/2072 en vue d’interdire
    temporairement l’introduction dans l’Union de certains fruits originaires
    d’Argentine afin d’éviter l’introduction et la propagation dans l’Union
    de Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1199 der Kommission vom 13. August 2020
    zur Änderung des Anhangs VI der Durchführungsverordnung (EU) 2019/2072 zum vorübergehenden
    Verbot der Einfuhr bestimmter Früchte mit Ursprung in Argentinien, um die Einschleppung
    und Ausbreitung von Phyllosticta citricarpa (McAlpine) Van der Aa in die Union
    zu verhindern
  type: main
- language: bg
  script: Cyrl
