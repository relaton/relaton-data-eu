    származó termések Unióba történő behozatalának – a Phyllosticta citricarpa
    (McAlpine) Van der Aa Unióba történő behurcolásának és Unión belüli elterjedésének
    megakadályozása céljából történő – ideiglenes tilalma érdekében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/1199 della Commissione del 13 agosto
    2020 che modifica l’allegato VI del regolamento di esecuzione (UE) 2019/2072
    per vietare temporaneamente l’introduzione nell’Unione di taluni frutti originari
    dell’Argentina al fine di impedire l’introduzione e la diffusione nell’Unione
    di Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/1199 (2020. gada 13. augusts),
    ar ko groza Īstenošanas regulas (ES) 2019/2072 VI pielikumu, lai nolūkā novērst
    Phyllosticta citricarpa (McAlpine) Van der Aa ievešanu un izplatīšanos Savienībā
    uz laiku aizliegtu Savienībā ievest atsevišķus Argentīnas izcelsmes augļus
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/1199 2020 m. rugpjūčio
