    tijdelijk te verbieden ter voorkoming van het binnenbrengen en de verspreiding
    in de Unie van Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/1199 z dnia 13 sierpnia 2020
    r. zmieniające załącznik VI do rozporządzenia wykonawczego (UE) 2019/2072
    w celu tymczasowego zakazu wprowadzania do Unii niektórych owoców pochodzących
    z Argentyny w celu zapobieżenia wprowadzeniu do Unii i rozprzestrzenianiu się
    w niej Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/1199 da Comissão de 13 de agosto de
