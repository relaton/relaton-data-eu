    tiettyjen Argentiinasta peräisin olevien hedelmien unioniin tuonnin kieltämiseksi
    väliaikaisesti Phyllosticta citricarpa (McAlpine) Van der Aa -organismin unioniin
    kulkeutumisen ja siellä leviämisen estämiseksi
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/1199 оd 13. kolovoza 2020. o izmjeni
