    temporariamente a introdução na União de determinados frutos originários da
    Argentina, a fim de impedir a introdução e propagação na União de Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/1199 al Comisiei din 13 august
    2020 de modificare a anexei VI la Regulamentul de punere în aplicare (UE) 2019/2072
    cu scopul de a interzice temporar introducerea în Uniune a anumitor fructe originare
    din Argentina pentru a împiedica introducerea și răspândirea în Uniune a
    organismului dăunător Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/1199 z 13. augusta 2020, ktorým
