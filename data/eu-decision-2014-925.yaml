title:
- language: en
  script: Latn
  content: '2014/925/EU: Commission Implementing Decision of 16 December 2014 approving
    certain amended programmes for the eradication, control and monitoring of animal
    diseases and zoonoses for the year 2014 and amending Implementing Decision 2013/722/EU
    as regards the Union financial contribution for certain programmes approved by
    that Decision (notified under document C(2014) 9650)'
  type: main
- language: fr
  script: Latn
  content: '2014/925/UE: Décision d''exécution de la Commission du 16 décembre
