    el que se crea una Autoridad Europea de Supervisión (Autoridad Bancaria Europea);
    el Reglamento (UE) n.º 1094/2010, por el que se crea una Autoridad Europea de
    Supervisión (Autoridad Europea de Seguros y Pensiones de Jubilación); el Reglamento
    (UE) n.o 1095/2010, por el que se crea una Autoridad Europea de Supervisión (Autoridad
    Europea de Valores y Mercados); el Reglamento (UE) n.o 600/2014, relativo a los
    mercados de instrumentos financieros; el Reglamento (UE) 2016/1011, sobre los
    índices utilizados como referencia en los instrumentos financieros y en los contratos
    financieros o para medir la rentabilidad de los fondos de inversión; y el Reglamento
    (UE) 2015/847 relativo a la información que acompaña a las transferencias de fondos
