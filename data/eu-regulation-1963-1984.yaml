  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1963/84 della Commissione del 10 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a talune sottovesti a maglia non
    elastica né gommata per bambini piccoli (bébés), della categoria di prodotti
    n. 68 (codice 0680), originari della Cina beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1963/84 van de Commissie van 10 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    onderkleding van niet-elastisch of van niet-gegummeerd brei- of haakwerk voor
    baby' s, van de categorie van produkten nr. 68 (codenummer 0680), van oorsprong
    uit China, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3570/83 van de Raad
