title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1963/84 of 10 July 1984 re-establishing
    the levying of customs duties on certain babies' under garments of knitted or
    crocheted fabrics, not elastic or rubberized, products of category 68 (code 0680),
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1963/84 de la Commission du 10 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    sous-vêtements de bonneterie non élastique ni caoutchoutée, pour bébés, de
    la catégorie 68 (code 0680), originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1963/84 der Kommission vom 10. Juli 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Unterkleidung aus Gewirken, weder
    gummielastisch noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68
    (Kennziffer 0680) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3570/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1963/84 af 10. juli 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte underbeklædningsgenstande af trikotage,
    ikke elastisk eller gummeret, til spædbørn under varekategori nr. 68 (kode 0680),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1963/84 της Επιτροπής
    της 10ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για έτοιμα ενδύματα
    εσωτερικά (εσώρουχα), πλεκτά, μη ελαστικά ουδέ
    συνδεδυασμένα μετά καουτσούκ, διά βρέφη, προϊόντα
    της κατηγορίας 68 (κωδικός 0680), καταγωγής Κίνας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
