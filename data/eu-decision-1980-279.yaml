title:
- language: en
  script: Latn
  content: '80/279/EEC: Commission Decision of 14 February 1980 authorizing Ireland
    not to apply Community treatment to skirts, including divided skirts, falling
    within subheadings ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff
    (category 27), originating in India and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/279/CEE: Décision de la Commission, du 14 février 1980, autorisant
    l''Irlande à exclure du traitement communautaire les jupes, y inclus jupes-culottes,
    des sous-positions ex 60.05 A II et ex 61.02 B II du tarif douanier commun (catégorie
    27), originaires de l''Inde et mises en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/279/EWG: Entscheidung der Kommission vom 14. Februar 1980, mit der
    Irland ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Röcke, einschließlich Hosenröcke, der Tarifstellen
    ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie 27, von
    der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/279/EØF: Kommissionens beslutning af 14. februar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage nederdele, indbefattet buksenederdele,
    som henhører under pos. ex 60.05 A II og ex 61.02 B II i den fælles toldtarif
    (kategori 27), har oprindelse i Indien og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/279/CEE: Decisione della Commissione, del 14 febbraio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gonne, comprese le gonne-
    pantalone delle sottovoci ex 60.05 A II e ex 61.02 B II della tariffa doganale
    comune, categoria 27, originarie dell''India e messe in libera pratica negli altri
    Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/279/EEG: Beschikking van de Commissie van 14 februari 1980 waarbij
    Ierland wordt gemachtigd rokken, broekrokken inbegrepen, van de posten ex 60.05
    A II en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie 27), van
    oorsprong uit India en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
