title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2332/76 of 27 September 1976 authorizing
    Denmark and the United Kingdom to suspend temporarily and totally the customs
    duties on certain agricultural products intended mainly for animal feed and imported
    from other Member States and from non-member countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2332/76 de la Commission, du 27 septembre 1976, autorisant
    le Danemark et le Royaume-Uni à suspendre temporairement et totalement les droits
    de douane applicables à certains produits agricoles destinés essentiellement
    à l'alimentation des animaux, importés en provenance des autres États membres
    et des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2332/76 der Kommission vom 27. September 1976 zur
    Ermächtigung Dänemarks und des Vereinigten Königreichs, die Zölle auf einige
    vornehmlich zur Fütterung bestimmte landwirtschaftliche Erzeugnisse bei der Einfuhr
    aus den anderen Mitgliedstaaten und dritten Ländern vorübergehend vollständig
    auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2332/76 af 27. september 1976 om bemyndigelse
    til Danmark og Det forenede Kongerige til midlertidigt helt at suspendere tolden
    på visse landbrugsprodukter, der hovedsagelig er bestemt til foderbrug, og som
    importeres fra de øvrige medlemsstater og visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2332/76 della Commissione, del 27 settembre 1976,
    che autorizza la Danimarca e il Regno Unito a sospendere temporaneamente e totalmente
    i dazi doganali applicabili ad alcuni prodotti agricoli destinati essenzialmente
    all'alimentazione degli animali ed importati dagli altri Stati membri e dai paesi
    terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2332/76 van de Commissie van 27 september 1976 waarbij
    Denemarken en het Verenigd Koninkrijk worden gemachtigd tot een tijdelijke en
    algehele schorsing van de douanerechten op sommige hoofdzakelijk voor veevoeding
    bestemde landbouwprodukten die uit de andere Lid-Staten en uit derde landen worden
    ingevoerd
  type: main
