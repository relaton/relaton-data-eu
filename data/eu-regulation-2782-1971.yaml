title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2782/71 du Conseil, du 20 décembre 1971, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de figues sèches, présentées en emballages immédiats d'un contenu net inférieur
    ou égal à 15 kilogrammes, de la position EX 08.03 B du tarif douanier commun,
    originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2782/71 des Rates vom 20. Dezember 1971 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete
    Feigen, in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15
    kg oder weniger, der Tarifstelle ex 08.03 B des Gemeinsamen Zolltarifs, mit Ursprung
    in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2782/71 del Consiglio, del 20 dicembre 1971, relativo
    all'apertura, alla suddivisione e alle modalità di gestione del contingente tariffario
    comunitario di fichi secchi, presentati in imballaggi immediati di contenuto netto
    di 15 kg o meno, della voce ex 08.03 B della tariffa doganale comune, originari
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2782/71 van de Raad van 20 december 1971 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor gedroogde vijgen, in verpakkingen met een netto- inhoud per onmiddellijke
    verpakking van 15 kilogram of minder, van post ex 08.03 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Spanje
