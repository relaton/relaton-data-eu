  content: Council Regulation (EEC) No 1847/76 of 27 July 1976 extending for the fifth
    time the system of temporary partial suspension of the Common Customs Tariff duties
    on wine originating in and coming from Turkey provided for in Regulation (EEC)
    No 2823/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1847/76 du Conseil, du 27 juillet 1976, prorogeant
