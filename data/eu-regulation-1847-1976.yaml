    der Zollsätze des Gemeinsamen Zolltarifs für Wein mit Ursprung in und Herkunft
    aus der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1847/76 af 27. juli 1976 om den femte forlængelse
