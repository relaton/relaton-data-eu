    du tarif douanier commun applicables aux vins originaires et en provenance de
    Turquie prévu par le règlement (CEE) n° 2823/71
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1847/76 des Rates vom 27. Juli 1976 zur fünften Verlängerung
