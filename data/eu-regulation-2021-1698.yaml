title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1698 of 13 July 2021 supplementing
    Regulation (EU) 2018/848 of the European Parliament and of the Council with procedural
    requirements for the recognition of control authorities and control bodies that
    are competent to carry out controls on operators and groups of operators certified
    organic and on organic products in third countries and with rules on their supervision
    and the controls and other actions to be performed by those control authorities
    and control bodies
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1698 de la Commission du 13 juillet 2021
    complétant le règlement (UE) 2018/848 du Parlement européen et du Conseil par
    des règles de procédure concernant la reconnaissance des autorités et organismes
    de contrôle qui ont compétence pour effectuer des contrôles portant sur les
    opérateurs et groupes d’opérateurs certifiés biologiques et sur les produits
    biologiques dans les pays tiers, et par des règles concernant leur supervision
    et les contrôles et autres tâches à effectuer par ces autorités et organismes
    de contrôle
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1698 der Kommission vom 13. Juli 2021 zur
    Ergänzung der Verordnung (EU) 2018/848 des Europäischen Parlaments und des Rates
    durch Verfahrensvorschriften für die Anerkennung von Kontrollbehörden und Kontrollstellen,
    die für die Durchführung von Kontrollen von als ökologisch/biologisch zertifizierten
    Unternehmern und Unternehmergruppen und ökologischen/biologischen Erzeugnissen
    in Drittländern zuständig sind, und durch Vorschriften über deren Überwachung
    sowie über die Kontrollen und sonstigen Maßnahmen, die von diesen Kontrollbehörden
    und Kontrollstellen durchgeführt werden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1698 на Комисията
    от 13 юли 2021 година за допълнение на Регламент
    (ЕС) 2018/848 на Европейския парламент и на Съвета
    с процедурни изисквания за признаването на
    контролни и надзорни органи, които са компетентни
    да извършват контрол върху оператори и групи
    от оператори, сертифицирани за биологично
    производство, и върху биологични продукти
    в трети държави, и с правила за надзора върху
    тях и за контрола и други действия, които трябва
    да се извършват от тези контролни и надзорни
    органи
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1698 ze dne 13. července
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2018/848
    o procesní požadavky na uznávání kontrolních orgánů a kontrolních subjektů,
    které jsou příslušné provádět kontroly hospodářských subjektů a skupin
    hospodářských subjektů certifikovaných jako ekologické a ekologických produktů
    ve třetích zemích, a o pravidla pro dohled nad těmito subjekty a pro jejich
    kontroly a další opatření, která mají tyto kontrolní orgány a kontrolní
    subjekty provádět
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1698 af 13. juli 2021 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2018/848
    for så vidt angår proceduremæssige krav for anerkendelsen af kontrolmyndigheder
    og kontrolorganer, der er kompetente til at foretage kontrol af økologisk certificerede
    erhvervsdrivende og grupper af erhvervsdrivende og økologiske produkter i tredjelande,
    og for så vidt angår regler om deres tilsyn og kontroller og andre foranstaltninger,
    der skal gennemføres af disse kontrolmyndigheder og kontrolorganer
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/1698
    της Επιτροπής της 13ης Ιουλίου 2021 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2018/848 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου με διαδικαστικές απαιτήσεις
    για την αναγνώριση των αρχών ελέγχου και των
    φορέων ελέγχου που είναι αρμόδιοι να διενεργούν
    ελέγχους σε επιχειρήσεις και ομάδες επιχειρήσεων
    που έχουν λάβει πιστοποίηση βιολογικής παραγωγής
    και σε βιολογικά προϊόντα σε τρίτες χώρες,
    καθώς και με κανόνες για την εποπτεία τους
    και τους ελέγχους και τις λοιπές ενέργειες
    στις οποίες πρέπει να προβαίνουν οι εν λόγω
    αρχές ελέγχου και φορείς ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/1698, 13. juuli 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2018/848 menetlusnõuetega
    selliste kontrolliasutuste ja kontrollorganite tunnustamiseks, kes on pädevad
    kontrollima kolmandates riikides mahepõllumajanduslikuna sertifitseeritud ettevõtjaid
    ja mahepõllumajanduslikke tooteid, samuti eeskirjadega kõnealuste kontrolliasutuste
    ja kontrollorganite üle järelevalve teostamiseks ning eeskirjadega nende tehtavate
    kontrollide ja muude toimingute kohta
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/1698, annettu 13 päivänä heinäkuuta
    2021, Euroopan parlamentin ja neuvoston asetuksen (EU) 2018/848 täydentämisestä
    niiden valvontaviranomaisten ja tarkastuslaitosten hyväksymistä koskevilla menettelyvaatimuksilla,
    jotka ovat toimivaltaisia tekemään tarkastuksia luonnonmukaisiksi sertifioiduille
    toimijoille ja toimijaryhmille ja luonnonmukaisesti tuotetuille tuotteille kolmansissa
    maissa, sekä kyseisiin valvontaviranomaisiin ja tarkastuslaitoksiin kohdistettavaa
    valvontaa ja näiden suorittamia tarkastuksia ja muita toimia koskevilla säännöillä
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/1698 ón gCoimisiún an 13 Iúil 2021 lena
    bhforlíontar Rialachán (AE) 2018/848 ó Pharlaimint na hEorpa agus ón gComhairle
    le ceanglais nós imeachta maidir le húdaráis rialaithe agus comhlachtaí rialaithe
    atá inniúil chun rialuithe a dhéanamh ar oibreoirí agus ar ghrúpaí oibreoirí
    arna ndeimhniú mar oibreoirí orgánacha a aithint agus ar tháirgí orgánacha
    i dtríú tíortha agus le rialacha maidir lena maoirseacht agus na rialuithe
    agus na gníomhaíochtaí eile atá le déanamh ag na húdaráis rialaithe agus
    na comhlachtaí rialaithe sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1698 оd 13. srpnja 2021. o dopuni
    Uredbe (EU) 2018/848 Europskog parlamenta i Vijeća postupovnim uvjetima za priznavanje
    kontrolnih tijela i kontrolnih ustanova nadležnih za provođenje kontrola subjekata
    i skupina subjekata koji su certificirani kao ekološki te ekoloških proizvoda
    u trećim zemljama te pravilima o njihovu nadzoru, kontrolama i drugim mjerama
    koje ta kontrolna tijela i kontrolne ustanove trebaju provoditi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1698 felhatalmazáson alapuló rendelete (2021.
    július 13.) az (EU) 2018/848 európai parlamenti és tanácsi rendeletnek a tanúsított,
    ökológiai termelést folytató gazdasági szereplők, gazdálkodói csoportok
    és ökológiai termékek harmadik országban végzett ellenőrzésére jogosult
    ellenőrző hatóságok és ellenőrző szervezetek elismerésére vonatkozó
    eljárási követelmények, továbbá az ilyen ellenőrző hatóságok és ellenőrző
    szervezetek felügyeletére, valamint az általuk elvégzendő ellenőrzésekre
    és egyéb tevékenységekre vonatkozó szabályok tekintetében való kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1698 della Commissione del 13 luglio 2021
    che integra il regolamento (UE) 2018/848 del Parlamento europeo e del Consiglio
    con obblighi procedurali per il riconoscimento delle autorità di controllo e
    degli organismi di controllo competenti per eseguire controlli sugli operatori
    e sui gruppi di operatori certificati biologici e sui prodotti biologici nei paesi
    terzi, e con norme relative alla loro supervisione nonché ai controlli e ad altre
    azioni che tali autorità di controllo e organismi di controllo devono eseguire
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1698 (2021. gada 13. jūlijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2018/848 papildina, paredzot procedūras
    prasības tādu kontroles iestāžu un kontroles institūciju atzīšanai, kuras
    ir kompetentas veikt kontroles attiecībā uz sertificētiem bioloģisko produktu
    operatoriem un operatoru grupām un bioloģiskiem produktiem trešās valstīs,
    un noteikumus par to uzraudzību un kontrolēm un citām darbībām, kas jāveic
    minētajām kontroles iestādēm un kontroles institūcijām
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/1698 2021 m. liepos 13 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2018/848 papildomas kontrolės
    institucijų ir kontrolės įstaigų, turinčių kompetenciją vykdyti sertifikuotų
    ekologinės gamybos vykdytojų ir jų grupių ir ekologiškų produktų kontrolę
    trečiosiose valstybėse, pripažinimo procedūriniais reikalavimais ir tų kontrolės
    institucijų ir kontrolės įstaigų priežiūros taisyklėmis, taip pat kontrolės
    ir kitų veiksmų, kuriuos turi vykdyti tos institucijos ir įstaigos, taisyklėmis
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/1698 tat-13 ta’ Lulju 2021
    li jissupplimenta r-Regolament (UE) 2018/848 tal-Parlament Ewropew u tal-Kunsill
    bir-rekwiżiti proċedurali għar-rikonoxximent tal-awtoritajiet ta’ kontroll
    u l-korpi ta’ kontroll li huma kompetenti biex iwettqu l-kontrolli fuq operaturi
    u gruppi ta’ operaturi ċċertifikati organiċi u fuq il-prodotti organiċi
    f’pajjiżi terzi u bir-regoli dwar is-superviżjoni u l-kontrolli tagħhom u
    azzjonijiet oħra li għandhom jitwettqu minn dawk l-awtoritajiet ta’ kontroll
    u l-korpi ta’ kontroll
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/1698 van de Commissie van 13 juli 2021
    tot aanvulling van Verordening (EU) 2018/848 van het Europees Parlement en de
    Raad met procedurele voorschriften voor de erkenning van controleautoriteiten
    en controleorganen die bevoegd zijn voor de controle van exploitanten en groepen
    exploitanten die in derde landen biologisch gecertificeerd zijn en van biologische
    producten in derde landen, en met voorschriften inzake het toezicht daarop en
    de door die controleautoriteiten en controleorganen uit te voeren controles en
    andere activiteiten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/1698 z dnia 13 lipca 2021
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2018/848
    o wymogi proceduralne dotyczące uznawania organów kontrolnych i jednostek certyfikujących
    właściwych do przeprowadzania kontroli podmiotów i grup podmiotów certyfikowanych
    jako ekologiczne oraz produktów ekologicznych w państwach trzecich, a także
    o zasady nadzoru nad nimi i ich kontroli oraz innych działań, które mają być
    prowadzone przez te organy kontrolne i jednostki certyfikujące
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1698 da Comissão de 13 de julho de 2021
    que completa o Regulamento (UE) 2018/848 do Parlamento Europeu e do Conselho com
    requisitos relativos ao processo de reconhecimento das autoridades de controlo
    e dos organismos de controlo competentes para efetuar controlos de produtos biológicos
    e de operadores e grupos de operadores que disponham de certificação biológica,
    em países terceiros, e com regras sobre a supervisão desses organismos e autoridades
    de controlo e sobre os controlos e outras ações a realizar por esses organismos
    e autoridades
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1698 al Comisiei din 13 iulie 2021 de completare
    a Regulamentului (UE) 2018/848 al Parlamentului European și al Consiliului cu
    cerințe procedurale pentru recunoașterea autorităților de control și a organismelor
    de control care sunt competente să efectueze controale în ceea ce privește
    operatorii ecologici certificați, grupurile de operatori ecologici certificate
    și produsele ecologice din țări terțe, precum și cu norme privind supravegherea
    respectivelor autorități de control și organisme de control și controalele
    și alte acțiuni care trebuie efectuate de respectivele autorități de control
    și organisme de control
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1698 z 13. júla 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2018/848 o procedurálne
    požiadavky na uznávanie štátnych inšpekčných organizácií a súkromných
    inšpekčných organizácií spôsobilých vykonávať kontroly certifikovaných
    prevádzkovateľov a skupín prevádzkovateľov ekologickej poľnohospodárskej
    výroby a produktov ekologickej poľnohospodárskej výroby v tretích krajinách
    a o pravidlá dohľadu nad nimi a o kontroly a iné opatrenia, ktoré majú tieto
    štátne inšpekčné organizácie a súkromné inšpekčné organizácie vykonávať
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1698 z dne 13. julija 2021 o dopolnitvi
    Uredbe (EU) 2018/848 Evropskega parlamenta in Sveta s postopkovnimi zahtevami
    za priznanje nadzornih organov in izvajalcev nadzora, ki so pristojni za izvajanje
    nadzora nad izvajalci dejavnosti in skupinami izvajalcev dejavnosti, certificiranimi
    kot ekološkimi, ter nad ekološkimi proizvodi v tretjih državah, in s pravili
    o njihovem nadzoru ter nadzorih in drugih ukrepih, ki jih izvajajo ti nadzorni
    organi in izvajalci nadzora
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1698 de la Comisión de 13 de julio de 2021
    que complementa el Reglamento (UE) 2018/848 del Parlamento Europeo y del Consejo
    con requisitos de procedimiento para el reconocimiento de autoridades de control
    y organismos de control competentes para llevar a cabo controles de los operadores
    y grupos de operadores certificados ecológicos y de productos ecológicos en
    terceros países así como con normas sobre su supervisión y los controles y
    otras acciones que han de realizar dichas autoridades de control y organismos
    de control
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1698 av den 13 juli 2021
    om komplettering av Europaparlamentets och rådets förordning (EU) 2018/848 med
    förfarandekrav för erkännande av kontrollmyndigheter och kontrollorgan som
    är behöriga att utföra kontroller av ekologiskt certifierade aktörer och aktörsgrupper
    och av ekologiska produkter i tredjeländer samt med regler om deras tillsyn och
    de kontroller och andra åtgärder som dessa kontrollmyndigheter och kontrollorgan
    ska utföra
