title:
- language: en
  script: Latn
  content: '79/978/EEC: Commission Decision of 31 October 1979 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''outer
    garments: blouses and shirt-blouses, knitted, crocheted (not elastic or rubberized),
    or woven, for women, girls and infants, of wool, of cotton or of man-made textile
    fibres, falling within heading Nos ex 60.05 and ex 61.02 of the Common Customs
    Tariff (NIMEXE codes 60.05-22, 23, 24, 25 ; 61.02-78, 82, 84) (category 7), originating
    in Yugoslavia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/978/CEE: Décision de la Commission, du 31 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les vêtements
    de dessus pour femmes, fillettes et jeunes enfants [chemisiers, blouses-chemisiers
    et blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles], des positions ex 60.05 et ex 61.02 du tarif douanier commun
    (codes Nimexe: 60.05-22, 23, 24, 25; 61.02-78, 82, 84) (catégorie 7), originaires
    de Yougoslavie et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/978/EWG: Entscheidung der Kommission vom 31. Oktober 1979, mit der
    Frankreich ermächtigt wird, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberkleidung für Frauen, Mädchen und Kleinkinder
    : Blusen und Hemdblusen aus Gewirken (weder gummielastisch noch kautschutiert)
    oder Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen
    oder künstlichen Spinnstoffen, der Tarifnummern ex 60.05 und ex 61.02 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 60.05-22, 23, 24, 25 und 61.02-78, 82, 84) (Kategorie
    7) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/978/EØF: Kommissionens beslutning af 31. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage skjorter, skjortebluser
    og bluser af trikotage (ikke elastisk eller gummeret) eller vævede, til kvinder,
    piger og småbørn, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. ex 60.05 og ex 61.02 i den fælles toldtarif (NIMEXE-nummer
    60.05-22, 23, 24, 25 ; 61.02- 78, 82, 84 ; kategori 7), har oprindelse i Jugoslavien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/978/CEE: Decisione della Commissione, del 31 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli indumenti
    esterni per donna, per ragazza e per bambini [camicie, camicette e bluse a maglia
    (non elastica né gommata), o tessute, di lana, di cotone o di fibre tessili sintetiche
    o artificiali], delle voci ex 60.05 e ex 61.02 della tariffa doganale comune (codici
    Nimexe: 60.05-22, 23, 24, 25 e 61.02-78, 82, 84), categoria 7, originari della
    Iugoslavia e messi in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/978/EEG: Beschikking van de Commissie van 31 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd blouses, overhemdblouses, van brei- of haakwerk
    (niet elastisch, niet gegummeerd) of geweven, voor dames, meisjes en kinderen,
    van wol, van katoen of van synthetische of van kunstmatige textielvezels van de
    posten ex 60.05 en ex 61.02 van het gemeenschappelijk douanetarief (NIMEXE-code
