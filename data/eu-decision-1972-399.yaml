title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 novembre 1972, autorisant le Royaume
    des Pays-Bas à admettre, jusqu'au 31 janvier 1973 inclus, à la commercialisation
    des semences de deux autres variétés de blé d'hiver, soumises à des exigences
    réduites
  type: main
- language: de
  script: Latn
  content: '72/399/EWG: Entscheidung der Kommission vom 17. November 1972 zur Ermächtigung
    des Königreichs der Niederlande, bis zum 31. Januar 1973 einschließlich Saatgut
    von weiteren zwei Winterweizensorten mit minderen Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '72/399/CEE: Decisione della Commissione, del 17 novembre 1972, che autorizza
    il Regno dei Paesi Bassi ad ammettere alla commercializzazione fino al 31 gennaio
    1973 incluso sementi di due altre varietà di grano invernale, soggette a requisiti
    ridotti'
  type: main
- language: nl
  script: Latn
  content: '72/399/EEG: Beschikking van de Commissie van 17 november 1972 tot machtiging
    van het Koninkrijk der Nederlanden om tot en met 31 januari 1973 zaaizaad van
    twee andere rassen van wintertarwe, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten'
  type: main
