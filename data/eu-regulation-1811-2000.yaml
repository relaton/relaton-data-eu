    zur Bestimmung des Umfangs, in dem nicht erledigten Ausfuhrlizenzanträgen stattgegeben
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1811/2000 af 24. august 2000 om midlertidig
    suspension af udstedelsen af eksportlicenser for visse mejeriprodukter og om fastsættelse
    af, i hvilket omfang indgivne ansøgninger om eksportlicenser kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1811/2000 της Επιτροπής,
    της 24ης Αυγούστου 2000, για προσωρινή αναστολή
    της έκδοσης πιστοποιητικών εξαγωγής ορισμένων
    γαλακτοκομικών προϊόντων και για καθορισμό
    του βαθμού στον οποίο μπορούν να ικανοποιηθούν
    οι αιτήσεις για πιστοποιητικά εξαγωγής που
    εκκρεμούν
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1811/2000, annettu 24 päivänä elokuuta 2000,
    tiettyjä maitotuotteita koskevien vientitodistusten antamisen väliaikaisesta
    keskeyttämisestä ja käsiteltävänä olevien vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1811/2000 della Commissione, del 24 agosto 2000, che
    sospende in via temporanea il rilascio dei titoli di esportazione di taluni prodotti
    lattiero-caseari e stabilisce in che misura possono essere accolte le domande
    di titoli di esportazione pendenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1811/2000 van de Commissie van 24 augustus 2000 houdende
    tijdelijke schorsing van de afgifte van uitvoercertificaten voor bepaalde zuivelproducten
    en vaststelling van de mate waarin op nog niet afgewikkelde aanvragen voor uitvoercertificaten
    kan worden ingegaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1811/2000 da Comissão, de 24 de Agosto de 2000,
    que suspende temporariamente a emissão dos certificados de exportação de certos
    produtos lácteos e determina a medida em que podem ser atribuídos os certificados
    de exportação pendentes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1811/2000 de la Comisión, de 24 de agosto de 2000,
