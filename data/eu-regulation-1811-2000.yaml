  script: Latn
  content: Commission Regulation (EC) No 1811/2000 of 24 August 2000 temporarily suspending
    the issuing of export licences for certain milk products and determining what
    proportion of the amounts covered by pending applications for export licences
    may be allocated
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1811/2000 de la Commission du 24 août 2000 portant
    suspension temporaire de la délivrance des certificats à l'exportation de certains
    produits laitiers et déterminant la mesure dans laquelle peuvent être attribuées
    les demandes de certificats d'exportation en instance
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1811/2000 der Kommission vom 24. August 2000 zur vorläufigen
