title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 739/94 of 30 March 1994 derogating for the
    1993/94 wine year from the producers'requirement to notify the quantities of table
    wine they must deliver for compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 739/94 de la Commission du 30 mars 1994 portant mesure
    dérogatoire pour la campagne 1993/1994 en matière de communication par les producteurs
    de leurs quantités de vin de table à livrer à la distillation obligatoire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 739/94 DER KOMMISSION vom 30. März 1994 über eine
    abweichende Maßnahme für das Wirtschaftsjahr 1993/94 für die Mitteilungen der
    Erzeuger über ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 739/94 af 30. marts 1994 om en undtagelsesforanstaltning
    for produktionsåret 1993/94 med hensyn til producenternes meddelelse af bordvinsmængder,
    der skal leveres til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 739/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Μαρτίου 1994 που προβλέπει μέτρο παρέκκλισης,
    για την περίοδο 1993/94, όσον αφορά την ανακοίνωση
    από τους παραγωγούς των ποσοτήτων επιτραπέζιου
    οίνου που θα παραδοθούν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 739/94 DELLA COMMISSIONE del 30 marzo 1994 recante
    una misura derogatoria per la campagna 1993/1994, per quanto riguarda la comunicazione,
    da parte dei produttori, dei quantitativi di vini da tavola che devono consegnare
    alla distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 739/94 VAN DE COMMISSIE van 30 maart 1994 houdende
    afwijkende bepalingen voor het wijnoogstjaar 1993/1994 met betrekking tot de mededeling,
    door de producenten, van de voor verplichte distillatie te leveren hoeveelheden
    tafelwijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 739/94 DA COMISSÃO de 30 de Março de 1994 que estabelece
    uma medida derrogatória para a campanha de 1993/1994 no que diz respeito à comunicação
    pelos produtores das suas quantidades de vinho de mesa a entregar para destilação
    obrigatória
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 739/94 DE LA COMISIÓN de 30 de marzo de 1994 por el
    que se establece una medida de excepción, con respecto a la campaña 1993/94
    en cuanto a la comunicación que deben efectuar los productores sobre las cantidades
    de vino de mesa que tienen que destinar a destilación obligatoria
  type: main
