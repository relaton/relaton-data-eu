title:
- language: en
  script: Latn
  content: '82/781/EEC: Commission Decision of 4 November 1982 establishing that the
    apparatus described as ''Varian - Automated Auger Microprobe, model 981-2850''
    , ''PHI - Vacuum Console, model 60'' , ''PHI - Transfer Probe, model 160/661''
    and ''PHI - Specimen Fracture Attachment, model 10-520'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/781/CEE: Décision de la Commission, du 4 novembre 1982, constatant
    que l'' importation des appareils dénommés "Varian - Automated Auger Microprobe,
    model 981-2850", "PHI - Vacuum Console, model 60", "PHI - Transfer Probe, model
    160/661" et "PHI - Specimen Fracture Attachment, model 10-520" ne peut être faite
    en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/781/EWG: Entscheidung der Kommission vom 4. November 1982, mit der
    festgestellt wird, daß die Geräte ,,Varian - Automated Auger Microprobe, model
    981-2850'' '' , ,,P.H.I. - Vacuum Console, model 60'' '' , ,,P.H.I. - Transfer
    Probe, model 160/661'' '' und ,,P.H.I. - Specimen Fracture Attachment, model 10-520''
    '' nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden können'
  type: main
- language: da
  script: Latn
  content: '82/781/EØF: Kommissionens beslutning af 4. november 1982 om fastslåelse
    af, at indførsel af apparaterne "Varian - Automated Auger Microprobe, model 981-2850",
    "P.H.I. - Vacuum Console, model 60", "P.H.I. - Transfer Probe, model 160/661"
    og "P.H.I. - Specimen Fracture Attachment, model 10-520" ikke kan ske med fritagelse
    for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/781/EOK: Απόφαση τής Επιτροπής τής 4ης Νοεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τών συσκευών
    μέ τίς ονομασίες «VARIAN - Automated Auger Microprobe, model 981-2850»,
    «PHI - Vacuum Console, model 60», «PHI - Transfer Probe, model 160/661» καί
    «PHI - Specimen Fracture Attachment, model 10-520» δέν δύναται νά
    πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/781/CEE: Decisione della Commissione, del 4 novembre 1982, che stabilisce
    che l'' importazione degli apparecchi denominati "Varian - Automated Auger Microprobe,
    model 981-2850", "P.H.I. - Vacuum Console, model 60", "P.H.I. - Transfer Probe,
    model 160/661" e "P.H.I. - Specimen Fracture Attachment, model 10-520" non può
    avvenire in franchigia dai dazi della tariffa doganale'
  type: main
- language: nl
  script: Latn
  content: '82/781/EEG: Beschikking van de Commissie van 4 november 1982 waarbij wordt
    vastgesteld dat de apparaten genaamd ,,Varian-Automated Auger Microprobe, model
    981-2850'' '' , ,,PHI-Vacuum Console, model 60'' '' , ,,PHI-Transfer Probe, model
    160/661'' '' en ,,PHI-Specimen Fracture Attachment, model 10-520'' '' niet met
    vrijstelling van de rechten van het gemeenschappelijk douanetarief mogen worden
    ingevoerd'
  type: main
