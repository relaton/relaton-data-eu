    действие 2008/851/ОВППС относно военната операция
    на Европейския съюз, предназначена да допринесе
    за възпирането, предотвратяването и потушаването
    на пиратските действия и въоръжените грабежи
    край бреговете на Сомалия'
  type: main
- language: cs
