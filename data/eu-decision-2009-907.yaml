    ryöstöjen ehkäisemiseen ja torjuntaan Somalian rannikkovesillä, hyväksytyn
    yhteisen toiminnan 2008/851/YUTP muuttamisesta
  type: main
- language: hr
  script: Latn
  content: '2009/907/ZVSP: Odluka Vijeća 2009/907/ZVSP od 8. prosinca 2009. o izmjeni
