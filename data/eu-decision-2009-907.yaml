    ar mērķi palīdzēt Somālijas piekrastē novērst un apkarot pirātismu un
    bruņotas laupīšanas, un atturēt no šādiem nodarījumiem
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 8 d. Tarybos sprendimas 2009/907/BUSP, iš dalies keičiantis
    Bendruosius veiksmus 2008/851/BUSP dėl Europos Sąjungos karinės operacijos,
    skirtos prisidėti prie atgrasymo nuo piratavimo veiksmų ir ginkluotų plėšimų
    jūroje prie Somalio krantų ir jų prevencijos bei sustabdymo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2009/907/PESK tat- 8 ta' Diċembru 2009 li temenda
    l-Azzjoni Konġunta 2008/851/PESK dwar l-operazzjoni militari tal-Unjoni Ewropea
    bil-ħsieb ta’ kontribut għad-deterrenza, il-prevenzjoni u t-trażżin tal-atti
    ta’ piraterija u ta’ serq bl-użu tal-armi 'l barra mix-xtut tas-Somalja
  type: main
- language: nl
  script: Latn
  content: Besluit 2009/907/GBVB van de Raad van 8 december 2009 houdende wijziging
    van Gemeenschappelijk Optreden 2008/851/GBVB inzake de militaire operatie van
    de Europese Unie teneinde bij te dragen tot het ontmoedigen, het voorkomen en
    bestrijden van piraterij en gewapende overvallen voor de Somalische kust
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2009/907/WPZiB z dnia 8 grudnia 2009 r. zmieniająca wspólne
    działanie 2008/851/WPZiB w sprawie operacji wojskowej Unii Europejskiej mającej
    na celu udział w powstrzymywaniu, zapobieganiu i zwalczaniu aktów piractwa i
    rozboju u wybrzeży Somalii
  type: main
- language: pt
  script: Latn
  content: Decisão 2009/907/PESC do Conselho, de 8 de Dezembro de 2009 , que altera
    a Acção Comum 2008/851/PESC relativa à operação militar da União Europeia
    tendo em vista contribuir para a dissuasão, a prevenção e a repressão dos
    actos de pirataria e dos assaltos à mão armada ao largo da costa da Somália
  type: main
- language: ro
  script: Latn
  content: Decizia 2009/907/PESC a Consiliului din 8 decembrie 2009 de modificare
    a Acțiunii comune 2008/851/PESC privind operația militară a Uniunii Europene
    în vederea unei contribuții la descurajarea, prevenirea și reprimarea actelor
    de piraterie și de jaf armat din largul coastelor Somaliei
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2009/907/SZBP z 8. decembra 2009 , ktorým sa mení a
    dopĺňa jednotná akcia 2008/851/SZBP o vojenskej operácii Európskej únie
    na podporu odradzovania od pirátskych činov a ozbrojených lúpeží pri somálskom
    pobreží, prevencie pred nimi a ich potláčania
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2009/907/SZVP z dne 8. decembra 2009 o spremembi Skupnega ukrepa
    Sveta 2008/851/SZVP o vojaški operaciji Evropske unije kot prispevku k odvračanju,
    preprečevanju in zatiranju piratstva in oboroženih ropov pred somalsko obalo
  type: main
- language: es
  script: Latn
  content: Decisión 2009/907/PESC del Consejo, de 8 de diciembre de 2009 , por la
    que se modifica la Acción Común 2008/851/PESC relativa a la Operación Militar
    de la Unión Europea destinada a contribuir a la disuasión, prevención y la
    represión de los actos de piratería y del robo a mano armada frente a las costas
    de Somalia
  type: main
- language: sv
  script: Latn
