    lähedal aset leidvate piraatlusjuhtumite ja relvastatud röövimiste tõkestamiseks,
    ennetamiseks ja ohjamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2009/907/YUTP, tehty 8 päivänä joulukuuta 2009 ,
