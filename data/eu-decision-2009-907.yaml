    κοινής δράσης 2008/851/ΚΕΠΠΑ για τη στρατιωτική
    επιχείρηση της Ευρωπαϊκής Ένωσης που θα συμβάλει
    στην αποτροπή, στην πρόληψη και στην καταστολή
    των πειρατικών επιθέσεων και των ένοπλων ληστειών
    στα ανοικτά των ακτών της Σομαλίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2009/907/ÜVJP, 8. detsember 2009 , millega muudetakse ühismeedet
