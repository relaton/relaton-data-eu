    společná akce 2008/851/SZBP o vojenské operaci Evropské unie s cílem přispět
    k odvrácení, prevenci a potlačení pirátství a ozbrojených loupeží u pobřeží
    Somálska
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2009/907/FUSP af 8. december 2009 om ændring af fælles
    aktion 2008/851/FUSP om Den Europæiske Unions operation med henblik på at bidrage
    til at afskrække fra, forebygge og bekæmpe piratvirksomhed og væbnede røverier
    ud for Somalias kyster
  type: main
- language: el
  script: Grek
  content: Απόφαση 2009/907/ΚΕΠΠΑ του Συμβουλίου, της
