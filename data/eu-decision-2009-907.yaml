    volta a contribuire alla dissuasione, alla prevenzione e alla repressione degli
    atti di pirateria e delle rapine a mano armata al largo della Somalia
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2009/907/KĀDP ( 2009. gada 8. decembris ), ar ko groza
