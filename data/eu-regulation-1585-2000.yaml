title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1585/2000 of 19 July 2000 determining the
    extent to which applications lodged in July 2000 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1585/2000 de la Commission du 19 juillet 2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2000 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la République
    de Pologne, la République de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1585/2000 der Kommission vom 19. Juli 2000 über die
    Festsetzung des Umfangs, in dem die im Juli 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakei,
    Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1585/2000 af 19. juli 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    2000 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1585/2000 της Επιτροπής,
    της 19ης Ιουλίου 2000, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο 2000 για
    πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1585/2000, annettu 19 päivänä heinäkuuta
    2000, yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti heinäkuussa 2000 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1585/2000 della Commissione, del 19 luglio 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 2000 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia,
    la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1585/2000 van de Commissie van 19 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in juli 2000 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomsten met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek, de Slowaakse Republiek, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1585/2000 da Comissão, de 19 de Julho de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Julho de
    2000 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
    a República da Polónia, a República da Hungria, a República Checa, a Eslováquia,
    a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1585/2000 de la Comisión, de 19 de julio de 2000,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de julio de 2000 al amparo del régimen previsto en los
    Acuerdos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría, la República Checa, Eslovaquia, Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1585/2000 av den 19 juli 2000 om fastställande
    av i vilken utsträckning ansökningar som lämnats in i juli 2000 om importlicenser
    för vissa grisköttsprodukter i enlighet med den ordning som fastställs i avtalen
    mellan gemenskapen samt Polen, Ungern, Tjeckien, Slovakien, Bulgarien och Rumänien
    kan godkännas
  type: main
