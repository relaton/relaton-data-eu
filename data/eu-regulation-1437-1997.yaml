title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1437/97 of 23 July 1997 fixing for the 1997/98
    marketing year the minimum price to be paid to producers and the buying-in price
    to be applied by storage agencies for unprocessed dried figs, the amount of production
    aid for dried figs, and amending Regulation (EEC) No 626/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1437/97 de la Commission du 23 juillet 1997 fixant,
    pour la campagne 1997/1998, le prix minimal à payer aux producteurs et le prix
    d'achat par les organismes stockeurs pour les figues sèches non transformées
    ainsi que le montant de l'aide à la production pour les figues sèches et modifiant
    le règlement (CEE) nº 626/85
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1437/97 der Kommission vom 23. Juli 1997 zur Festsetzung
    des den Erzeugern für nicht verarbeitete Trockenfeigen zu zahlenden Mindestpreises,
    des Ankaufspreises der Einlagerungsstellen und der für die Produktion von getrockneten
    Feigen zu gewährenden Beihilfe für das Wirtschaftsjahr 1997/98 sowie zur Änderung
    der Verordnung (EWG) Nr. 626/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1437/97 af 23. juli 1997 om fastsættelse
    for produktionsåret 1997/98 af den minimumspris, der skal betales producenterne,
    og oplagringsorganernes opkøbspris for uforarbejdede tørrede figner samt produktionsstøttebeløbet
    for tørrede figner og om ændring af forordning (EØF) nr. 626/85
  type: main
- language: el
  script: Grek
