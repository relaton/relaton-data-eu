    produtores e o preço de compra pelos organismos de armazenagem de figos secos
    não transformados e o montante da ajuda à produção para os figos secos e que
    altera o Regulamento (CEE) nº 626/85
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1437/97 de la Comisión de 23 de julio de 1997 por
    el que se establece, para la campaña 1997/98, el precio mínimo pagadero a los
    productores y el precio de compra por parte de los organismos almacenadores por
    los higos secos no transformados y el importe de la ayuda a la producción de
    higos secos y por el que se modifica el Reglamento (CEE) nº 626/85
  type: main
- language: sv
  script: Latn
