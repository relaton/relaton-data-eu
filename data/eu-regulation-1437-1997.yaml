    και για την τροποποίηση του κανονισμού (ΕΟΚ)
    αριθ. 626/85
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1437/97, annettu 23 päivänä heinäkuuta 1997,
    jalostamattomien kuivattujen viikunoiden tuottajille maksettavan vähimmäishinnan
    ja varastointielinten ostohinnan sekä kuivattujen viikunoiden tuotantotuen määrän
    vahvistamisesta markkinointivuodeksi 1997/1998 ja asetuksen (ETY) N:o 626/85 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1437/97 della Commissione del 23 luglio 1997 che fissa,
    per la campagna di commercializzazione 1997/1998, il prezzo minimo da pagare ai
    produttori e il prezzo d'acquisto da parte degli organismi ammassatori per i fichi
    secchi non trasformati nonché l'importo dell'aiuto alla produzione per i fichi
    secchi e che modifica il regolamento (CEE) n. 626/85
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1437/97 van de Commissie van 23 juli 1997 tot vaststelling,
    voor het verkoopseizoen 1997/1998, van de voor niet-verwerkte gedroogde vijgen
    aan de telers te betalen minimumprijs, van de aankoopprijs daarvan voor de opslaghouders
    en van het bedrag van de productiesteun voor gedroogde vijgen, en tot wijziging
    van Verordening (EEG) nr. 626/85
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1437/97 da Comissão de 23 de Julho de 1997 que fixa,
