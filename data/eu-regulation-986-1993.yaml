    Wiederverkauf auf dem Binnenmarkt auf 150 000 Tonnen Gerste aus Beständen der
    spanischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 986/93 af 27. april 1993 om ændring
