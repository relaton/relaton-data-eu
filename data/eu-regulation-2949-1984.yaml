title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2949/84 of 22 October 1984 re-establishing
    the levying of customs duties on diodes, transistors and similar semi-conductor
    devices; parts, falling within subheadings 85.21 D and E and originating in South
    Korea, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2949/84 de la Commission du 22 octobre 1984 portant
    rétablissement de la perception des droits de douane applicables aux diodes,
    transistors et dispositifs similaires, et aux parties et pièces détachées,
    des sous-positions 85.21 D et E du tarif douanier commun, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2949/84 der Kommission vom 22. Oktober 1984 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter und
    Teile der Tarifstellen 85.21 D und E mit Ursprung in Südkorea, dem die in der
    Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2949/84 af 22. oktober 1984 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter;
    dele henhørende under underpos. 85.21 D og E og med oprindelse i Sydkorea, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2949/84 της Επιτροπής
    της 22ας Οκτωβρίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις με ημιαγωγό μέρη και
    μεμονωμένα τεμάχια, των διακρίσεων 85.21 Δ και
    Ε του Κοινού Δασμολογίου, καταγωγής Νότιας
    Κορέας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2949/84 della Commissione del 22 ottobre 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai diodi, transistori
    e simili dispositivi semiconduttori, parti e pezzi staccati, delle sottovoci 85.21
    D ed E della tariffa doganale comune, originari della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2949/84 van de Commissie van 22 oktober 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen, delen en onderdelen, van de postonderverdelingen
    85.21 D en E, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr.
    3569/83 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
