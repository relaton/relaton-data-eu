title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 202/78 of 30 January 1978 determining the
    amounts of the variable components and additional duties applicable from 1 February
    to 30 April 1978 inclusive, on the importation into the Community of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 202/78 de la Commission, du 30 janvier 1978, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    la période du 1er février au 30 avril 1978 inclus, à l'importation dans la
    Communauté des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 202/78 der Kommission vom 30. Januar 1978 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1978 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 202/78 af 30. januar 1978 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 1059/69 for perioden 1. februar
    til og med 30. april 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 202/78 della Commissione, del 30 gennaio 1978, che
    determina gli importi degli elementi mobili e dazi addizionali applicabili all'importazione
    nella Comunità, per il periodo dal 1 febbraio al 30 aprile 1978 incluso, delle
    merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 202/78 van de Commissie van 30 januari 1978 tot vaststelling
    van het beloop der van 1 februari tot en met 30 april 1978 bij invoer in de Gemeenschap
    van onder Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele
    elementen en aanvullende invoerrechten
  type: main
