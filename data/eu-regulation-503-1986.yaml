    (EWG) Nr. 3796/81 aufgeführte Fischereierzeugnisse für den Zeitraum vom 1. März
    bis zum 31. Dezember 1986 und zur Änderung der Verordnung (EWG) Nr. 3602/85 hinsichtlich
    der Orientierungspreise für Atlantiksardinen und Sardellen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 503/86 af 25. februar 1986 om fastsættelse
