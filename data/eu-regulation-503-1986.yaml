    os preços de orientação de certos produtos da pesca enumerados nas letras A
    e E do Anexo I do Regulamento (CEE) n.° 3796/81 e que altera o Regulamento (CEE)
    n.° 3602/85 no que se refere ao preço de orientação das sardinhas do Atlântico
    e das anchovas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 503/86 del Consejo de 25 de febrero de 1986 por el
    que se fija, para el período que va del 1 de marzo al 31 de diciembre de 1986,
    los precios de orientación de determinados productos de la pesca enumerados en
    los puntos A y E del Anexo I del Reglamento (CEE) n° 3796/81, y por el que se
