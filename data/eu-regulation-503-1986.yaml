  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 503/86 del Consiglio del 25 febbraio 1986 che fissa,
    per il periodo 1° marzo - 31 dicembre 1986, i prezzi d' orientamento di taluni
    prodotti della pesca elencati nell' allegato I, lettere A ed E, del regolamento
    (CEE) n. 3796/81 e che modifica il regolamento (CEE) n. 3602/85 per quanto riguarda
    il prezzo d' orientamento delle sardine dell' Atlantico e delle acciughe
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 503/86 van de Raad van 25 februari 1986 tot vaststelling,
    voor de periode van 1 maart tot en met 31 december 1986, van de oriëntatieprijzen
    voor bepaalde visserijprodukten genoemd in bijlage I, onder A en E, van Verordening
    (EEG) nr. 3796/81 en tot wijziging van Verordening (EEG) nr. 3602/85 voor wat
    betreft de oriëntatieprijs voor sardines uit de Atlantische Oceaan en ansjovis
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 503/86 do Conselho de 25 de Fevereiro de 1986 que
