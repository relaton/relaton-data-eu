title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 503/86 of 25 February 1986 fixing, for the
    period 1 March to 31 December 1986, the guide prices for certain fishery products
    listed in Annex I A and E of Regulation (EEC) No 3796/81, and amending Regulation
    (EEC) No 3602/85 as regards the guide price for Atlantic sardines and anchovies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 503/86 du Conseil du 25 février 1986 fixant, pour
    la période du 1er mars au 31 décembre 1986, les prix d' orientation de certains
    produits de la pêche énumérés à l' annexe I points A et E du règlement (CEE)
    n° 3796/81 et modifiant le règlement (CEE) n° 3602/85 en ce qui concerne le
    prix d' orientation de la sardine atlantique et de l' anchois
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 503/86 des Rates vom 25. Februar 1986 zur Festsetzung
