  script: Latn
  content: Council Decision 2011/857/CFSP of 19 December 2011 amending and extending
    Joint Action 2005/889/CFSP on establishing a European Union Border Assistance
    Mission for the Rafah Crossing Point (EU BAM Rafah)
  type: main
- language: fr
  script: Latn
  content: Décision 2011/857/PESC du Conseil du 19 décembre 2011 modifiant et prorogeant
    l’action commune 2005/889/PESC établissant une mission de l’Union européenne
    d’assistance à la frontière au point de passage de Rafah (EU BAM Rafah)
  type: main
- language: de
  script: Latn
  content: Beschluss 2011/857/GASP des Rates vom 19. Dezember 2011 zur Änderung und
    Verlängerung der Gemeinsamen Aktion 2005/889/GASP zur Einrichtung einer Mission
    der Europäischen Union zur Unterstützung des Grenzschutzes am Grenzübergang
    Rafah (EU BAM Rafah)
  type: main
- language: bg
  script: Cyrl
