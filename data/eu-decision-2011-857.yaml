    de Asistență la Frontieră a Uniunii Europene pentru punctul de trecere Rafah
    (EU BAM Rafah)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2011/857/SZBP z 19. decembra 2011 , ktorým sa mení a
