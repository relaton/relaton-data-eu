title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2966/79 of 18 December 1979 amending Regulation
    (EEC) No 1054/68 determining the list of agencies certifying the admissibility
    to certain tariff headings of certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2966/79 de la Commission, du 18 décembre 1979, modifiant
    le règlement (CEE) n° 1054/68 établissant la liste des organismes émetteurs
    de certificats destinés à permettre l' admission de certains produits laitiers
    en provenance des pays tiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2966/79 der Kommission vom 18. Dezember 1979 zur Änderung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    Drittländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2966/79 af 18. december 1979 om ændring
    af forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse over de organer,
    der er kompetente til at udstede certifikater vedrørende visse fra tredjelande
    indførte mejeriprodukters henførsel under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2966/79 τής Επιτροπής
    τής 18ης Δεκεμβρίου 1979 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 1054/68 «περί καταρτίσεως
    τού πίνακα τών οργανισμών πού εκδίδουν πιστοποιητικά
    προοριζόμενα νά επιτρέπουν τήν υπαγωγή ορισμένων
    γαλακτοκομικών προϊόντων προελεύσεως τρίτων
    χωρών σέ ορισμένες δασμολογικές κλάσεις»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2966/79 della Commissione, del 18 dicembre 1979, recante
    modifica del regolamento (CEE) n. 1054/68, che stabilisce l' elenco degli organismi
    emittenti dei certificati destinati a permettere l' ammissione in alcune voci
    tariffarie di alcuni prodotti lattiero-caseari in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2966/79 van de Commissie van 18 december 1979 tot
    wijziging van Verordening (EEG) nr. 1054/68 houdende vaststelling van de lijst
    van organisaties voor de afgifte van certificaten ten behoeve van de indeling
    van sommige zuivelprodukten uit derde landen onder bepaalde tariefposten
  type: main
