title:
- language: en
  script: Latn
  content: '96/507/EC, Euratom: Commission Decision of 24 July 1996 amending Decision
    90/178/Euratom, EEC authorizing Luxembourg not to take into account certain categories
    of transactions and to use certain approximate estimates for the calculation of
    the VAT own resources base (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/507/CE, Euratom: Décision de la Commission du 24 juillet 1996 modifiant
    la décision 90/178/Euratom, CEE autorisant le Luxembourg à ne pas tenir compte
    de certaines catégories d''opérations et à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/507/EG, Euratom: Entscheidung der Kommission vom 24. Juli 1996 zur
    Änderung der Entscheidung 90/178/Euratom, EWG, mit der Luxemburg ermächtigt
    wird, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/507/EF, Euratom: Kommissionens beslutning af 24. juli 1996 om ændring
    af beslutning 90/178/Euratom, EØF om bemyndigelse af Luxembourg til at beregne
    grundlaget for Fællesskabernes momsindtægter på basis af en tilnærmelsesvis
    vurdering af momsgrundlaget for visse transaktioner (Kun den franske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/507/ΕΚ, Ευρατόμ: Απόφαση της Επιτροπής
    της 24ης Ιουλίου 1996 για την τροποποίηση της
    απόφασης 90/178/Ευρατόμ, ΕΟΚ, με την οποία επιτρέπεται
    στο Λουξεμβούργο να μην λαμβάνει υπόψη ορισμένες
    κατηγορίες δραστηριοτήτων και να χρησιμοποιεί
    κατά προσέγγιση εκτιμήσεις κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο επί της προστιθέμενης αξίας (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/507/EY, Euratom: Komission päätös, tehty 24 päivänä heinäkuuta
    1996, luvan antamisesta Luxemburgille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi tehdyn päätöksen 90/178/Euratom, ETY muuttamisesta
    (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/507/CE, Euratom: Decisione della Commissione del 24 luglio 1996 che
    modifica la decisione 90/178/Euratom, CEE che autorizza il Granducato del Lussemburgo
    a non tener conto di determinate categorie di operazioni e a ricorrere a talune
    valutazioni approssimative per il calcolo della base delle risorse proprie provenienti
    dall''imposta sul valore aggiunto (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '96/507/EG, Euratom: Beschikking van de Commissie van 24 juli 1996 tot
    wijziging van Beschikking 90/178/Euratom, EEG, waarbij Luxemburg wordt gemachtigd
    geen rekening te houden met bepaalde categorieën handelingen en gebruik te maken
    van ramingen voor de berekening van de grondslag van de eigen middelen uit de
    belasting over de toegevoegde waarde (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/507/CE, Euratom: Decisão da Comissão de 24 de Julho de 1996 que altera
    a Decisão 90/178/Euratom, CEE, que autoriza o Luxemburgo a não ter em conta
    certas categorias de operações e a utilizar determinadas estimativas aproximativas
    para o cálculo da matéria colectável dos recursos próprios provenientes do
    Imposto sobre o Valor Acrescentado (Apenas faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '96/507/CE, Euratom: Decisión de la Comisión de 24 de julio de 1996 por
    la que se modifica la Decisión 90/178/Euratom, CEE por la que se autoriza a Luxemburgo
    a no tomar en consideración determinadas categorías de operaciones y a utilizar
    estimaciones aproximadas para el cálculo de la base de los recursos propios procedentes
    del impuesto sobre el valor añadido (El texto en lengua francesa es el único
    auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/507/EG, Euratom: Kommissionens beslut av den 24 juli 1996 om ändring
    av beslut 90/178/Euratom, EEG, som bemyndigar Luxemburg att inte beakta vissa
    kategorier av transaktioner och att använda vissa ungefärliga uppskattningar
    vid beräkning av den bas av egna medel som härrör från mervärdeskatten (Endast
    den franska språkversionen är giltig)'
