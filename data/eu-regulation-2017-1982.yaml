    apvienotajās lietās C-659/13 un C-34/14
  type: main
- language: lt
  script: Latn
  content: 2017 m. spalio 31 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1982,
    kuriuo iš naujo nustatomas galutinis antidempingo muitas ir galutinai surenkamas
    laikinasis muitas, nustatytas tam tikrai importuojamai Kinijos Liaudies Respublikos
    ir Vietnamo kilmės avalynei su batviršiais iš odos, pagamintai bendrovių „Dongguan
