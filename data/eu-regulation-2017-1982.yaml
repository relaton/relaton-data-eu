    Shoes Co. Ltd“, „Guangzhou Evervan Footwear Co. Ltd“, „Guangzhou Guangda
    Shoes Co. Ltd“, „Long Son Joint Stock Company“ ir „Zhaoqing Li Da Shoes
    Co., Ltd“, ir kuriuo įgyvendinamas Teisingumo Teismo sprendimas sujungtose
    bylose C-659/13 ir C-34/14
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1982 tal-31 ta'
    Ottubru 2017 li jimponi mill-ġdid dazju antidumping definittiv u jiġbor b'mod
    definittiv id-dazju provviżorju impost fuq l-importazzjonijiet ta' ċerti tipi
    ta' żraben bil-parti ta' fuq tal-ġilda li joriġinaw mir-Repubblika tal-Poplu
    taċ-Ċina u mill-Vjetnam u prodotti minn Dongguan Luzhou Shoes Co. Ltd, Dongguan
    Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear
    Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock Company u Zhaoqing
    Li Da Shoes Co., Ltd, u li jimplimenta s-sentenza tal-Qorti tal-Ġustizzja fil-Kawżi
    Magħquda C-659/13 u C-34/14
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/1982 van de Commissie van 31 oktober 2017
    betreffende het opnieuw instellen van een definitief antidumpingrecht en tot definitieve
    inning van het voorlopige recht op bepaald schoeisel met bovendeel van leder van
    oorsprong uit de Volksrepubliek China en Vietnam en geproduceerd door Dongguan
    Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes
    Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd,
    Long Son Joint Stock Company en Zhaoqing Li Da Shoes Co., Ltd, ter uitvoering
    van het arrest van het Hof van Justitie in de gevoegde zaken C-659/13 en C-34/14
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/1982 z dnia 31 października
    2017 r. nakładające ponownie ostateczne cło antydumpingowe oraz stanowiące
    o ostatecznym pobraniu cła tymczasowego nałożonego na przywóz niektórych
    rodzajów obuwia ze skórzanymi cholewkami pochodzących z Chińskiej Republiki
    Ludowej i Wietnamu i wyprodukowanych przez Dongguan Luzhou Shoes Co. Ltd, Dongguan
    Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear
    Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock Company i Zhaoqing
    Li Da Shoes Co., Ltd, wykonujące wyrok Trybunału Sprawiedliwości w sprawach
    połączonych C-659/13 i C-34/14
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/1982 da Comissão, de 31 de outubro
    de 2017, que reinstitui um direito anti-dumping definitivo e estabelece a cobrança
    definitiva do direito provisório instituído sobre as importações de determinado
    tipo de calçado com a parte superior de couro natural originário da República
    Popular da China e do Vietname e produzido pelas empresas Dongguan Luzhou Shoes
    Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou
    Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock
    Company e Zhaoqing Li Da Shoes Co., Ltd, e dá cumprimento ao acórdão do Tribunal
    de Justiça nos processos apensos C-659/13 e C-34/14
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/1982 al Comisiei din 31 octombrie
    2017 de reinstituire a unei taxe antidumping definitive și de percepere definitivă
    a taxei provizorii instituite asupra importurilor de anumite tipuri de încălțăminte
    cu fețe din piele originare din Republica Populară Chineză și Vietnam și
    produse de Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou
    Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes
    Co. Ltd, Long Son Joint Stock Company și Zhaoqing Li Da Shoes Co., Ltd, precum
    și de punere în aplicare a hotărârii Curții de Justiție în cauzele conexate
    C-659/13 și C-34/14
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/1982 z 31. októbra 2017, ktorým
    sa opätovne ukladá konečné antidumpingové clo a s konečnou platnosťou sa
    vyberá predbežné clo uložené na dovoz určitej obuvi so zvrškom z usne s
    pôvodom v Čínskej ľudovej republike a vo Vietname a vyrobenej spoločnosťami
    Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon
    Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co.
    Ltd, Long Son Joint Stock Company a Zhaoqing Li Da Shoes Co., Ltd a ktorým sa
    vykonáva rozsudok Súdneho dvora v spojených veciach C-659/13 a C-34/14
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/1982 z dne 31. oktobra 2017 o ponovni
    uvedbi dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve
    na uvoz določene obutve z zgornjim delom iz usnja s poreklom iz Ljudske republike
    Kitajske in Vietnama, ki jo proizvajajo družbe Dongguan Luzhou Shoes Co. Ltd,
    Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan
    Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock Company
    in Zhaoqing Li Da Shoes Co., Ltd, ter o izvrševanju sodbe Sodišča v združenih
    zadevah C-659/13 in C-34/14
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/1982 de la Comisión, de 31 de octubre
