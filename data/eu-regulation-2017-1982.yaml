title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1982 of 31 October 2017 re-imposing
    a definitive anti-dumping duty and collecting definitively the provisional duty
    imposed on imports of certain footwear with uppers of leather originating in the
    People's Republic of China and Vietnam and produced by Dongguan Luzhou Shoes Co.
    Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou
    Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock
    Company and Zhaoqing Li Da Shoes Co., Ltd, implementing the judgment of the Court
    of Justice in Joined Cases C-659/13 and C-34/14
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/1982 de la Commission du 31 octobre 2017
    réinstituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de certaines chaussures à
    dessus en cuir originaires de la République populaire de Chine et du Viêt Nam
    et produites par Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd,
    Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou
    Guangda Shoes Co. Ltd, Long Son Joint Stock Company et Zhaoqing Li Da Shoes Co.,
    Ltd, et exécutant l'arrêt rendu par la Cour de justice dans les affaires jointes
    C-659/13 et C-34/14
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/1982 der Kommission vom 31. Oktober
    2017 zur Wiedereinführung eines endgültigen Antidumpingzolls und zur endgültigen
    Vereinnahmung des vorläufigen Zolls auf die Einfuhren bestimmter Schuhe mit Oberteil
    aus Leder mit Ursprung in der Volksrepublik China und Vietnam, die von Dongguan
    Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes
    Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd,
    Long Son Joint Stock Company und Zhaoqing Li Da Shoes Co., Ltd, hergestellt werden,
    sowie zur Durchführung des Urteils der Gerichtshofs in den verbundenen Rechtssachen
    C-659/13 und C-34/14
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/1982 на Комисията
    от 31 октомври 2017 година за повторно налагане
    на окончателно антидъмпингово мито и окончателно
    събиране на временното мито, наложено върху
    вноса на някои обувки с горна част от кожа с
    произход от Китайската народна република и
    Виетнам и произведени от Dongguan Luzhou Shoes Co. Ltd, Dongguan
    Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear
    Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock Company и Zhaoqing
    Li Da Shoes Co. Ltd, и за изпълнение на решението на
    Съда на Европейския съюз по съединени дела
    C-659/13 и C-34/14
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/1982 ze dne 31. října 2017,
    kterým se opětovně ukládá konečné antidumpingové clo na dovoz některé
    obuvi se svrškem z usně pocházející z Čínské lidové republiky a Vietnamu
    a vyráběné společnostmi Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes
    Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou
    Guangda Shoes Co. Ltd, Long Son Joint Stock Company a Zhaoqing Li Da Shoes Co.,
    Ltd, s konečnou platností vybírá uložené prozatímní clo a kterým se provádí
    rozsudek Soudního dvora ve spojených věcech C-659/13 a C-34/14
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/1982 af 31. oktober 2017
