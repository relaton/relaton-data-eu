    definitivamente el derecho provisional establecido sobre las importaciones de
    determinado calzado con parte superior de cuero originario de la República Popular
    China y Vietnam y fabricado por Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak
    Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co.
    Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son Joint Stock Company y Zhaoqing
    Li Da Shoes Co. Ltd, y se ejecuta la sentencia del Tribunal de Justicia en los
    asuntos acumulados C-659/13 y C-34/14
  type: main
