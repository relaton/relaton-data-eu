    Shoes Co. Ltd, a Dongguan Shingtak Shoes Co. Ltd, a Guangzhou Dragon Shoes Co.
    Ltd, a Guangzhou Evervan Footwear Co. Ltd, a Guangzhou Guangda Shoes Co. Ltd,
    a Long Son Joint Stock Company és a Zhaoqing Li Da Shoes Co., Ltd által gyártott
    egyes bőr felsőrésszel rendelkező lábbelik behozatalára vonatkozó végleges
    dömpingellenes vám ismételt kivetéséről és a kivetett ideiglenes vám végleges
    beszedéséről, valamint a Bíróság által a C-659/13. és C-34/14. sz. egyesített
    ügyekben hozott ítélet végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1982 della Commissione, del 31 ottobre
    2017, che reistituisce un dazio antidumping definitivo e dispone la riscossione
    definitiva del dazio provvisorio istituito sulle importazioni di alcuni tipi di
    calzature con tomaie di cuoio originarie della Repubblica popolare cinese e del
    Vietnam e prodotte da Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co.
    Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou
    Guangda Shoes Co. Ltd, Long Son Joint Stock Company e Zhaoqing Li Da Shoes Co.
    Ltd, in esecuzione della sentenza della Corte di giustizia nelle cause riunite
    C-659/13 e C-34/14
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1982 (2017. gada 31. oktobris),
    ar kuru atkārtoti nosaka galīgo antidempinga maksājumu un galīgi iekasē pagaidu
    maksājumu, kas noteikts konkrētu Ķīnas Tautas Republikas un Vjetnamas izcelsmes
    apavu importam, kuriem ir ādas virsa un kurus ražo Dongguan Luzhou Shoes Co.
    Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou
