  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2017/1982, 31. oktoober 2017, millega kehtestatakse
    uuesti lõplik dumpinguvastane tollimaks teatavate Hiina Rahvavabariigist ja Vietnamist
    pärit ning äriühingute Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes
    Co. Ltd, Guangzhou Dragon Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou
    Guangda Shoes Co. Ltd, Long Son Joint Stock Company ja Zhaoqing Li Da Shoes Co.
    Ltd toodetud nahast pealsetega jalatsite impordi suhtes ja nõutakse lõplikult
    sisse kõnealuse impordi suhtes kehtestatud ajutine tollimaks ning täidetakse
    Euroopa Kohtu otsust liidetud kohtuasjades C-659/13 ja C-34/14
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/1982, annettu 31 päivänä
    lokakuuta 2017, lopullisen polkumyyntitullin ottamisesta uudelleen käyttöön
    tiettyjen Kiinan kansantasavallasta ja Vietnamista peräisin olevien sellaisten
    jalkineiden tuonnissa, joiden päälliset ovat nahkaa ja jotka on valmistanut
    Dongguan Luzhou Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon
    Shoes Co. Ltd, Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co.
    Ltd, Long Son Joint Stock Company ja Zhaoqing Li Da Shoes Co. Ltd, ja kyseisessä
    tuonnissa käyttöön otetun väliaikaisen tullin lopullisesta kantamisesta sekä
    unionin tuomioistuimen yhdistetyissä asioissa C-659/13 ja C-34/14 antaman tuomion
    täytäntöön panemisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/1982 оd 31. listopada 2017. o ponovnom
    uvođenju konačne antidampinške pristojbe i konačnoj naplati privremene pristojbe
    uvedene na uvoz određene obuće s gornjim dijelom od kože podrijetlom iz Narodne
    Republike Kine i Vijetnama koju proizvode trgovačka društva Dongguan Luzhou
    Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd,
    Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son
