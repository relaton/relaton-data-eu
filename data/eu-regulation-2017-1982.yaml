    midlertidige told på importen af visse typer af fodtøj med overdel af læder
    med oprindelse i Folkerepublikken Kina og Vietnam, produceret af Dongguan Luzhou
    Shoes Co. Ltd, Dongguan Shingtak Shoes Co. Ltd, Guangzhou Dragon Shoes Co. Ltd,
    Guangzhou Evervan Footwear Co. Ltd, Guangzhou Guangda Shoes Co. Ltd, Long Son
    Joint Stock Company og Zhaoqing Li Da Shoes Co., Ltd, og om gennemførelse af
