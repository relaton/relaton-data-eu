id: EUDirective199665
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 96/65/EC of 11 October 1996 adapting to technical
    progress for the fourth time Council Directive 88/379/EEC on the approximation
    of the laws, regulations and administrative provisions of the Member States relating
    to the classification, packaging and labelling of dangerous preparations and modifying
    Directive 91/442/EEC on dangerous preparations the packaging of which must be
    fitted with child-resistant fastenings
  type: main
- language: fr
  script: Latn
  content: Directive 96/65/CE de la Commission du 11 octobre 1996 portant quatrième
    adaptation au progrès technique de la directive 88/379/CEE du Conseil concernant
    le rapprochement des dispositions législatives, réglementaires et administratives
    des États membres relatives à la classification, à l'emballage et à l'étiquetage
    des préparations dangereuses, et modifiant la directive 91/442/CEE relative aux
    préparations dangereuses dont les emballages doivent être munis de fermeture
    de sécurité pour enfants
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/65/EG der Kommission vom 11. Oktober 1996 zur vierten Anpassung
    der Richtlinie 88/379/EWG des Rates zur Angleichung der Rechts- und Verwaltungsvorschriften
    der Mitgliedstaaten für die Einstufung, Verpackung und Kennzeichnung gefährlicher
    Zubereitungen an den technischen Fortschritt und zur Änderung der Richtlinie
    91/442/EWG über gefährliche Zubereitungen, deren Verpackungen mit kindergesicherten
    Verschlüssen versehen sein müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens Direktiv 96/65/EF af 11. oktober 1996 om tilpasning til den
    tekniske udvikling for fjerde gang af Rådets direktiv 88/379/EØF om indbyrdes
    tilnærmelse af medlemsstaternes love og administrative bestemmelser om klassificering,
    emballering og etikettering af farlige præparater og om ændring af direktiv
    91/442/EØF om farlige præparater, hvis emballage skal være forsynet med børnesikrede
    lukninger
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/65/ΕΚ της Επιτροπής της 11ης Οκτωβρίου
    1996 για τέταρτη προσαρμογή στην τεχνική πρόοδο
    της οδηγίας 88/379/ΕΟΚ του Συμβουλίου για την
    προσέγγιση των νομοθετικών, κανονιστικών και
    διοικητικών διατάξεων των κρατών μελών που
    αφορούν την ταξινόμηση, τη συσκευασία και την
    επισήμανση των επικίνδυνων παρασκευασμάτων
    και για τροποποίηση της οδηγίας 91/442/ΕΟΚ σχετικά
    με τα επικίνδυνα παρασκευάσματα των οποίων
    οι συσκευασίες πρέπει να φέρουν σφράγισμα
    ασφαλείας για τα παιδιά
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 96/65/EY, annettu 11 päivänä lokakuuta 1996, vaarallisten
    valmisteiden luokitusta, pakkaamista ja merkintöjä koskevien jäsenvaltioiden
    lakien, asetusten ja hallinnollisten määräysten lähentämisestä annetun neuvoston
    direktiivin 88/379/ETY mukauttamisesta tekniikan kehitykseen neljännen kerran
    ja lapsiturvallisilla sulkimilla varustettavien vaarallisten valmisteiden pakkauksista
    annetun direktiivin 91/442/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 96/65/CE della Commissione dell'11 ottobre 1996 che adegua per
    la quarta volta al progresso tecnico la direttiva 88/379/CEE del Consiglio concernente
    il ravvicinamento delle disposizioni legislative, regolamentari ed amministrative
    degli Stati membri, relative alla classificazione, all'imballaggio e all'etichettatura
    dei preparati pericolosi, e che modifica la direttiva 91/442/CEE relativa ai preparati
    pericolosi i cui imballaggi debbono essere muniti di chiusura di sicurezza per
    bambini
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/65/EG van de Commissie van 11 oktober 1996 tot vierde aanpassing
    aan de vooruitgang van de techniek van Richtlijn 88/379/EEG van de Raad betreffende
    de onderlinge aanpassing van de wettelijke en bestuursrechtelijke bepalingen van
    de Lid-Staten inzake de indeling, de verpakking en het kenmerken van gevaarlijke
    preparaten en tot wijziging van Richtlijn 91/442/EEG betreffende gevaarlijke preparaten
    waarvan de verpakking van een kinderveilige sluiting moet zijn voorzien
  type: main
- language: pt
  script: Latn
  content: Directiva 96/65/CE da Comissão de 11 de Outubro de 1996 que adapta pela
    quarta vez ao progresso técnico a Directiva 88/379/CEE do Conselho relativa à
    aproximação das disposições legislativas, regulamentares e administrativas
    dos Estados-membros respeitantes à classificação, embalagem e rotulagem das
    preparações perigosas e altera a Directiva 91/442/CEE relativa às preparações
    perigosas cujas embalagens devem ser munidas de um fecho de segurança para crianças
  type: main
- language: es
  script: Latn
  content: Directiva 96/65/CE de la Comisión de 11 de octubre de 1996 por la que
    se adapta al progreso técnico por cuarta vez la Directiva 88/379/CEE del Consejo,
    sobre la aproximación de las disposiciones legales, reglamentarias y administrativas
    de los Estados miembros relativas a la clasificación, envasado y etiquetado de
    preparados peligrosos y por la que se modifica la Directiva 91/442/CEE, relativa
    a los preparados peligrosos cuyos envases deben ir provistos de un cierre de seguridad
    para niños
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 96/65/EG av den 11 oktober 1996 om anpassning till
    tekniska framsteg, för fjärde gången, av rådets direktiv 88/379/EEG om tillnärmning
    av medlemsstaternas lagar och andra författningar om klassificering, förpackning
    och märkning av farliga preparat (beredningar), och ändring av direktiv 91/442/EEG
    om farliga preparat vilkas förpackningar måste vara försedda med barnsäkra
    förslutningsanordningar
  type: main
