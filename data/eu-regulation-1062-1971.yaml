title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1062/71 du Conseil, du 25 mai 1971, fixant, pour la
    campagne sucrière 1971/1972, les prix d'intervention dérivés, les prix d'intervention
    pour le sucre de betterave brut, les prix minima de la betterave, les prix de
    seuil, la quantité garantie, le montant maximum de la cotisation à la production
    et le quota maximum spécial
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1062/71 des Rates vom 25. Mai 1971 zur Festsetzung
    der abgeleiteten Interventionspreise, der Interventionspreise für Rübenrohzucker,
    der Zuckerrübenmindestpreise, der Schwellenpreise, der Garantiemenge, des Höchstbetrags
    der Produktionsabgabe und der besonderen Höchstquote für das Zuckerwirtschaftsjahr
    1971/1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1062/71 del Consiglio, del 25 maggio 1971, che fissa,
    per la campagna saccarifera 1971/1972, i prezzi d'intervento derivati, i prezzi
    d'intervento per lo zucchero greggio di barbabietola, i prezzi minimi delle barbabietole,
    i prezzi d'entrata, la quantità garantita e l'importo massimo del contributo
    gravante sulla produzione e la quota massima speciale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1062/71 van de Raad van 25 mei 1971 houdende vaststelling,
    voor het verkoopseizoen voor suiker 1971/1972 van de afgeleide interventieprijzen,
    de interventieprijzen voor ruwe bietsuiker, de minimumprijzen voor suikerbieten,
    de drempelprijzen, de gegarandeerde hoeveelheid, het maximumbedrag van de produktieheffing
    en het bijzonder maximum quotum
  type: main
