  content: Commission Delegated Regulation (EU) 2023/1117 of 12 January 2023 supplementing
    Directive (EU) 2019/2034 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying requirements for the type and nature
    of the information to be exchanged by competent authorities of home and host Member
    States
  type: main
- language: fr
  script: Latn
