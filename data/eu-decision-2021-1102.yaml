title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1102 of 28 June 2021 requesting the Commission
    to submit a study on the Union’s situation and options regarding the introduction,
    evaluation, production, marketing and use of invertebrate biological control agents
    within the territory of the Union and a proposal, if appropriate in view of the
    outcomes of the study
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1102 du Conseil du 28 juin 2021 invitant la Commission
    à soumettre une étude sur la situation et les options de l’Union en ce qui
    concerne l’introduction, l’évaluation, la production, la mise sur le marché
    et l’utilisation d’agents de lutte biologique invertébrés sur le territoire
    de l’Union, et une proposition, le cas échéant, pour tenir compte des résultats
    de l’étude
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1102 des Rates vom 28. Juni 2021 mit dem Ersuchen an
    die Kommission, eine Untersuchung über die Lage der Union und ihre Möglichkeiten
    im Hinblick auf Einführung, Bewertung, Herstellung, Inverkehrbringen und Einsatz
    von wirbellosen biologischen Bekämpfungsmitteln im Gebiet der Union sowie, falls
    dies angesichts der Ergebnisse der Untersuchung angemessen ist, einen Vorschlag
    vorzulegen
  type: main
- language: bg
  script: Cyrl
