    проучване относно ситуацията в Съюза и вариантите
    за въвеждане, оценка, производство, предлагане
    на пазара и използване на безгръбначни агенти
    за биологичен контрол на територията на Съюза,
    както и предложение, ако е целесъобразно предвид
    резултатите от проучването
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/1102 ze dne 28. června 2021, jímž se Komise
    žádá o předložení studie, která mapuje situaci v Unii a možnosti týkající
    se dovozu, hodnocení, produkce, uvádění na trh a používání činitelů
    biologické kontroly ze skupiny bezobratlých na území Unie, a s ohledem na
    výsledky této studie případně o předložení návrhu
  type: main
