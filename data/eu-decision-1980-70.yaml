title:
- language: en
  script: Latn
  content: '80/70/EEC: Commission Decision of 10 December 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1978 on aids and premiums relating to
    the modernization of farms including those in the less-favoured farming areas
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/70/CEE: Décision de la Commission, du 10 décembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris les zones agricoles défavorisées (Les
    textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/70/EWG: Entscheidung der Kommission vom 10. Dezember 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen und Prämien
    - einschließlich der Hilfen für benachteiligte landwirtschaftliche Gebiete -
    getätigten Ausgaben an das Königreich Belgien (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/70/EØF: Kommissionens beslutning af 10. december 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1978 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter, herunder sådanne beliggende i ugunstigt
    stillede områder (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/70/CEE: Decisione della Commissione, del 10 dicembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un acconto sulle spese effettuate durante il 1978 per gli aiuti ed i premi relativi
    all''ammodernamento delle aziende agricole, comprese quelle nelle zone agricole
    svantaggiate (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/70/EEG: Beschikking van de Commissie van 10 december 1979 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de in 1978 verrichte uitgaven voor steun en premies
    met betrekking tot de modernisering van landbouwbedrijven, waaronder mede begrepen
    die in probleemgebieden in de landbouw (Slechts de teksten in de Franse en de
    Nederlandse taal zijn authentiek)'
  type: main
