  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3386/90 DELLA COMMISSIONE del 26 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 23 (numero d'ordine 40.0230) e ai prodotti della categoria n. 37 (numero d'ordine
    40.0370) originari dell'Indonesia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3386/90 VAN DE COMMISSIE van 26 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van de categorie van produkten nr. 23 (volgnummer 40.0230) en van de categorie
    van produkten nr. 37 (volgnummer 40.0370), van oorsprong uit Indonesië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3897/89
    van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3386/90 DA COMISSAO de 26 de Novembro de 1990 que
