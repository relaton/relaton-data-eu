    de produtos n* 23 (numero de ordem 40.0230) e aos produtos da categoria de produtos
    n* 37 (numero de ordem 40.0370), originarios da Indonésia beneficiaria das preferências
    pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
