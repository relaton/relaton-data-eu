title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3386/90 of 26 November 1990 re-establishing
    the levying of customs duties on products of categories 23 (order No 40.0230)
    and 37 (order No 40.0370), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3386/90 de la Commission du 26 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories n° 23 (numéro d'ordre 40.0230) et n 37 (numéro d'ordre 40.0370)
    originaires de l'Indonésie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3386/90 DER KOMMISSION vom 26. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 23
    (laufende Nummer 40.0230) und die Waren der Warenkategorie Nr. 37 (laufende Nummer
    40.0370) mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3897/89
    des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3386/90 af 26. november 1990 om genindførelse
    af opkrævning af toldafgifter for varer under varekategori nr. 23 (løbenummer
    40.0230) og varer under varekategori nr. 37 (løbenummer 40.0370), som har oprindelse
    i Indonesien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
