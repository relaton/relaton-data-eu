title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2598 of 4 October 2024 laying
    down the list of third countries or regions thereof authorised for the entry into
    the Union of certain animals and products of animal origin intended for human
    consumption in accordance with Regulation (EU) 2017/625 of the European Parliament
    and of the Council as regards the application of the prohibition on the use of
    certain antimicrobial medicinal products
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2598 de la Commission du 4 octobre
    2024 établissant la liste des pays tiers ou régions de pays tiers en provenance
    desquels l’entrée dans l’Union de certains animaux et produits d’origine
    animale destinés à la consommation humaine est autorisée conformément au règlement
    (UE) 2017/625 du Parlement européen et du Conseil en ce qui concerne l’application
    de l’interdiction d’utiliser certains médicaments antimicrobiens
  type: main
- language: de
  script: Latn
