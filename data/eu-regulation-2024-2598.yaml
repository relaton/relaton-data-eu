    in die Union bestimmter für den menschlichen Verzehr bestimmter Tiere und Erzeugnisse
    tierischen Ursprungs zulässig ist, im Hinblick auf die Anwendung des Verbots
    der Verwendung bestimmter antimikrobieller Arzneimittel
  type: main
