title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1996/2001 of 11 October 2001 amending, for
    the second time, Council Regulation (EC) No 467/2001 prohibiting the export of
    certain goods and services to Afghanistan, strengthening the flight ban and extending
    the freeze of funds and other financial resources in respect of the Taliban of
    Afghanistan and repealing Regulation (EC) No 337/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1996/2001 de la Commission du 11 octobre 2001 modifiant,
    pour la deuxième fois, le règlement (CE) n° 467/2001 du Conseil interdisant
    l'exportation de certaines marchandises et de certains services vers l'Afghanistan,
    renforçant l'interdiction des vols et étendant le gel des fonds et autres ressources
    financières décidés à l'encontre des Taliban d'Afghanistan, et abrogeant le
    règlement (CE) n° 337/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1996/2001 der Kommission vom 11. Oktober 2001 zur zweiten
    Änderung der Verordnung (EG) Nr. 467/2001 des Rates über das Verbot der Ausfuhr
    bestimmter Waren und Dienstleistungen nach Afghanistan, über die Ausweitung des
    Flugverbots und des Einfrierens von Geldern und anderen Finanzmitteln betreffend
    die Taliban von Afghanistan und zur Aufhebung der Verordnung (EG) Nr. 337/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1996/2001 af 11. oktober 2001 om anden
    ændring af Rådets forordning (EF) nr. 467/2001 om forbud mod udførsel af visse
    varer og tjenesteydelser til Afghanistan, om styrkelse af flyveforbuddet og om
    udvidelse af indefrysningen af midler og andre økonomiske ressourcer over for
    Taliban i Afghanistan og om ophævelse af forordning (EF) nr. 337/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1996/2001 της Επιτροπής,
    της 11ης Οκτωβρίου 2001, για την τροποποίηση, για
    δεύτερη φορά, του κανονισμού (ΕΚ) αριθ. 467/2001
    του Συμβουλίου για την απαγόρευση της εξαγωγής
    ορισμένων αγαθών και υπηρεσιών στο Αφγανιστάν,
    την ενίσχυση της απαγόρευσης πτήσεων και την
    παράταση της δέσμευσης κεφαλαίων και άλλων
    οικονομικών πόρων όσον αφορά την Ταλιμπάν
    του Αφγανιστάν, και την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 337/2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1996/2001, annettu 11 päivänä lokakuuta 2001,
    Afganistaniin suuntautuvan tiettyjen tavaroiden ja palvelujen viennin kieltämisestä,
    Afganistanin Talebania koskevien lentokiellon ja varojen sekä muiden taloudellisten
    resurssien jäädyttämisen laajentamisesta ja asetuksen (EY) N:o 337/2000 kumoamisesta
    annetun neuvoston asetuksen (EY) N:o 467/2001 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1996/2001 della Commissione, dell'11 ottobre 2001,
    che modifica per la seconda volta il regolamento (CE) n. 467/2001 del Consiglio
    che vieta l'esportazione di talune merci e servizi in Afghanistan, inasprisce
    il divieto dei voli e estende il congelamento dei capitali e delle altre risorse
    finanziarie nei confronti dei talibani dell'Afghanistan, e abroga il regolamento
    (CE) n. 337/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1996/2001 van de Commissie van 11 oktober 2001 houdende
    de tweede wĳziging van Verordening (EG) nr. 467/2001 van de Raad tot instelling
    van een verbod op de uitvoer van bepaalde goederen en diensten naar Afghanistan,
    tot versterking van het verbod op vluchten en de bevriezing van tegoeden en andere
    financiële middelen ten aanzien van de Taliban van Afghanistan en tot intrekking
    van Verordening (EG) nr. 337/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1996/2001 da Comissão, de 11 de Outubro de 2001,
    que altera, pela segunda vez, o Regulamento (CE) n.° 467/2001 do Conselho, que
    proíbe a exportação de certas mercadorias e de certos serviços para o Afeganistão,
    reforça a proibição de voos, prorroga o congelamento de fundos e de outros
    recursos financeiros aplicável aos Talibã do Afeganistão e revoga o Regulamento
    (CE) n.° 337/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1996/2001 de la Comisión, de 11 de octubre de 2001,
    que modifica por segunda vez el Reglamento (CE) n° 467/2001 del Consejo por el
    que se prohíbe la exportación de determinadas mercancías y servicios a Afganistán,
    se refuerza la prohibición de vuelos y se amplía la congelación de capitales
    y otros recursos financieros de los talibanes de Afganistán y por el que se deroga
    el Reglamento (CE) n° 337/2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1996/2001 av den 11 oktober 2001 om ändring,
    för andra gången, av rådets förordning (EG) nr 467/2001 om förbud mot export
    av vissa varor och tjänster till Afghanistan, skärpning av flygförbudet och
    förlängning av spärrandet av tillgångar och andra finansiella medel beträffande
    talibanerna i Afghanistan och om upphävande av förordning (EG) nr 337/2000
  type: main
