  content: COMMISSION REGULATION (EC) No 2066/96 of 29 October 1996 determining the
    extent to which applications lodged in October 1996 for licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic, the Slovak Republic, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2066/96 DE LA COMMISSION du 29 octobre 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1996 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque,
    la République slovaque, la Roumanie et la Bulgarie peuvent être acceptées
