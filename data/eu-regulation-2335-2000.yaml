title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2335/2000 of 20 October 2000 determining
    the percentage of quantities which may be allowed in respect of import licence
    applications lodged in October 2000 under tariff quotas for beef and veal provided
    for in Regulation (EC) No 1279/98 for the Republic of Poland, the Republic of
    Hungary, the Czech Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2335/2000 de la Commission du 20 octobre 2000 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en octobre 2000 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1279/98 pour la République de Pologne, la
    République de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2335/2000 der Kommission vom 20. Oktober 2000 zur Bestimmung
    des Prozentsatzes, zu dem den im Oktober 2000 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß der Verordnung
    (EG) Nr. 1279/98 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2335/2000 af 20. oktober 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i oktober 2000 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 1279/98 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2335/2000 της Επιτροπής,
    της 20ής Οκτωβρίου 2000, για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Οκτώβριο 2000 για τις συμπληρωματικές δασμολογικές
    ποσοστώσεις βοείου κρέατος που προβλέπονται
    από τον κανονισμό (ΕΚ) αριθ. 1279/98 για την Πολωνία,
    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακία, τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2335/2000, annettu 20 päivänä lokakuuta 2000,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    lokakuussa 2000 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2335/2000 della Commissione, del 20 ottobre 2000, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di ottobre 2000 per i contingenti tariffari supplementari
    di carni bovine previsti dal regolamento (CE) n. 1279/98 per la Repubblica di
    Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria
    e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2335/2000 van de Commissie van 20 oktober 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in oktober 2000
    ingediende aanvragen om invoercertificaten voor de tariefcontingenten voor rundvlees,
    die bij Verordening (EG) nr. 1279/98 zijn vastgesteld voor de Republiek Polen,
    de Republiek Hongarije, de Tsjechische Republiek, Slowakije, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2335/2000 da Comissão, de 20 de Outubro de 2000,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Outubro de 2000 para os contingentes pautais de carnes de bovino
    previstos pelo Regulamento (CE) n.° 1279/98 para a República da Polónia, a
    República da Hungria, a República Checa, a Eslováquia, a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2335/2000 de la Comisión, de 20 de octubre de 2000,
    por el que se determina la proporción en que podrán aceptarse las solicitudes
    de certificados de importación correspondientes a los contingentes arancelarios
    de carne de vacuno establecidos en el Reglamento (CE) n° 1279/98 para la República
    de Polonia, la República de Hungría, la República Checa, Eslovaquia, Bulgaria
    y Rumanía, presentadas en octubre de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2335/2000 av den 20 oktober 2000 om i
    vilken utsträckning ansökningar om importlicenser inlämnade under oktober 2000
    för de tilläggskvoter för nötkött som föreskrivs i förordning (EG) nr 1279/98
    för Bulgarien, Polen, Rumänien, Slovakien, Tjeckien och Ungern kan godkännas
