    voor bepaalde producten in de sector varkensvlees, die in maart 2004 worden ingediend,
    in het kader van de regeling die is vastgesteld in de tussen de Gemeenschap, enerzĳds,
    en Estland, Letland en Litouwen, anderzĳds, gesloten overeenkomsten betreffende
    vrĳhandel
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 528/2004 da Comissão, de 22 de Março de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Março de
    2004 no âmbito do regime previsto nos acordos de comércio livre entre a Comunidade,
