title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 528/2004 of 22 March 2004 determining the
    extent to which applications lodged in March 2004 for import licences for certain
    pigmeat sector products under the arrangements provided for by the Free Trade
    Agreements between the Community, of the one part, and Latvia, Lithuania and Estonia,
    of the other part, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 528/2004 de la Commission du 22 mars 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2004 pour certains produits du secteur de la viande de porc peuvent être
    acceptées dans le cadre du régime prévu par les accords sur la libéralisation
    des échanges entre la Communauté, d'une part, et la Lettonie, la Lituanie et
    l'Estonie, d'autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 528/2004 der Kommission vom 22. März 2004 zur Festsetzung
    des Umfangs, in dem die im März 2004 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors genehmigt werden können
    gemäß dem Abkommen über Freihandel und Handelsfragen zwischen der Gemeinschaft
    einerseits und Lettland, Litauen und Estland andererseits
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 528/2004 af 22. marts 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2004 om importlicenser for visse produkter inden for svinekødssektoren under
    den ordning, der er fastsat i frihandelsaftalerne mellem Det Europæiske Fællesskab
    på den ene side og Estland, Letland og Litauen på den anden side, for så vidt
    angår svinekød
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 528/2004 της Επιτροπής,
    της 22ας Μαρτίου 2004, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Μάρτιο του 2004
    για πιστοποιητικά εισαγωγής για ορισμένα προϊντα
    του τομέα του χοιρείου κρέατος στο πλαίσιο
    του καθεστώτος που προβλέπεται από τις συμφωνίες
    απελευθέρωσης των συναλλαγών μεταξύ της Κοινότητας,
    αφενός, και της Λεττονίας, της Λιθουανίας και
    της Εσθονίας, αφετέρου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 528/2004, annettu 22 päivänä maaliskuuta 2004,
    yhteisön Latvian, Liettuan ja Viron kanssa tekemissä vapaakauppaa koskevissa
    sopimuksissa määrätyn järjestelmän mukaisesti maaliskuussa 2004 jätettyjen
    tiettyjä sianliha-alan tuotteita koskevien tuontitodistushakemusten hyväksyttävyyden
    määrittämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 528/2004 della Commissione, del 22 marzo 2004, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di marzo 2004 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi sul libero scambio conclusi
    tra la Comunità, da una parte, e la Lettonia, la Lituania e l'Estonia, dall'altra
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 528/2004 van de Commissie van 22 maart 2004 tot vaststelling
