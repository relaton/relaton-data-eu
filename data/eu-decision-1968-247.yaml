title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 juin 1968, autorisant la République fédérale
    d'Allemagne, en vertu de l'article 115 alinéa 1 du Traité, à appliquer des
    mesures de protection lors de l'importation de vins industriels, originaires de
    la Grèce
  type: main
- language: de
  script: Latn
  content: '68/247/EWG: Entscheidung der Kommission vom 5. Juni 1968 zur Ermächtigung
    der Bundesrepublik Deutschland gemäß Artikel 115 Absatz 1 des Vertrages, bei
    der Einfuhr von Industrieweinen mit Ursprung in Griechenland Schutzmaßnahmen
    zu treffen'
  type: main
- language: it
  script: Latn
  content: '68/247/CEE: Decisione della Commissione, del 5 giugno 1968, che autorizza
    la Repubblica federale di Germania, a norma dell''articolo 115, comma 1, del trattato,
    ad applicare misure di protezione all''importazione di vini per uso industriale
    originari della Grecia'
  type: main
- language: nl
  script: Latn
  content: '68/247/EEG: Beschikking van de Commissie van 5 juni 1968, waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd om op grond van artikel 115, eerste alinea, van het
    Verdrag beschermende maatregelen toe te passen bij de invoer van industriewijn,
    van oorsprong uit Griekenland'
  type: main
