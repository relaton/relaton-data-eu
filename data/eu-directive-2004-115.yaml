  type: main
- language: ro
  script: Latn
  content: Directiva 2004/115/CE a Comisiei din 15 decembrie 2004 de modificare a
    Directivei 90/642/CEE a Consiliului în ceea ce privește conținuturile maxime
    de reziduuri stabilite pentru anumite pesticide
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2004/115/ES z 15. decembra 2004, ktorou sa mení a dopĺňa
