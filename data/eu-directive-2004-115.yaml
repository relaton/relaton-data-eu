  content: Commission Directive 2004/115/EC of 15 December 2004 amending Council Directive
    90/642/EEC as regards the maximum levels for certain pesticide residues fixed
    therein
  type: main
- language: fr
  script: Latn
  content: Directive 2004/115/CE de la Commission du 15 décembre 2004 modifiant la
    directive 90/642/CEE du Conseil en ce qui concerne les teneurs maximales en résidus
    fixées pour certains pesticides
  type: main
- language: de
  script: Latn
  content: Richtlinie 2004/115/EG der Kommission vom 15. Dezember 2004 zur Änderung
