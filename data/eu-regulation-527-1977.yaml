title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 527/77 of 14 March 1977 laying down general
    rules for the system of compensatory amounts applicable, by virtue of the various
    forms of added sugar, to products processed from fruit and vegetables following
    the accession of new Member States to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 527/77 du Conseil, du 14 mars 1977, déterminant les
    règles générales du régime des montants compensatoires applicables, au titre
    des sucres divers d' addition, dans le secteur des produits transformés à base
    de fruits et légumes à la suite de l' adhésion de nouveaux États membres à
    la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 527/77 des Rates vom 14. März 1977 über die Grundregeln
    für die Anwendung von Ausgleichsbeträgen für zugesetzte Zuckerarten bei Verarbeitungserzeugnissen
    aus Obst und Gemüse als Folge des Beitritts der neuen Mitgliedstaaten zur Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 527/77 af 14. marts 1977 om fastlæggelse
    af de almindelige regler for udligningsbeløbsordningen, som for forskellige tilsatte
    sukkerarter finder anvendelse på produkter forarbejdet på basis af frugt og
    grønsager som følge af de nye medlemsstaters tiltrædelse af Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 527/77 τού Συμβουλίου
    τής 14ης Μαρτίου 1977 περί καθορισμού τών γενικών
    κανόνων τού καθεστώτος τών εξισωτικών ποσών
    πού εφαρμόζονται, βάσει τών διαφόρων προσθέτων
    σακχάρων, στόν τομέα τών μεταποιημένων προϊόντων
    μέ βάση τά οπωροκηπευτικά, συνεπεία τής προσχωρήσεως
    στήν Κοινότητα τών νέων Κρατών μελών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 527/77 del Consiglio, del 14 marzo 1977, che determina
    le norme generali del regime degli importi compensativi applicabili, per gli zuccheri
    diversi addizionati, nel settore dei prodotti trasformati a base di ortofrutticoli
    in seguito all' adesione di nuovi Stati membri alla Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 527/77 van de Raad van 14 maart 1977 tot vaststelling
    van de algemene regels van het stelsel van de compenserende bedragen die voor
    de verschillende soorten toegevoegde suiker in de sector van op basis van groenten
    en fruit verwerkte produkten van toepassing zijn ingevolge de toetreding van nieuwe
    Lid-Staten tot de Gemeenschap
  type: main
