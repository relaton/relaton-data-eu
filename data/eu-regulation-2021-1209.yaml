    súvislosti s vykonávacím nariadením (EÚ) 2017/2230, ktorým sa ukladá konečné
    antidumpingové clo na dovoz kyseliny trichlórizokyanurovej s pôvodom v Čínskej
    ľudovej republike, v prípade troch čínskych vyvážajúcich výrobcov, zrušuje
    sa clo na dovoz od týchto vyvážajúcich výrobcov a zavádza sa registrácia
    tohto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/1209 z dne 22. julija 2021 o začetku
    pregledov v zvezi z „novimi izvozniki“ v okviru Izvedbene uredbe (EU) 2017/2230
    o uvedbi dokončne protidampinške dajatve na uvoz triklorizocianurne kisline
    s poreklom iz Ljudske republike Kitajske za tri kitajske proizvajalce izvoznike,
    odpravi dajatve na uvoz teh proizvajalcev izvoznikov in uvedbi registracije tega
    uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/1209 de la Comisión de 22 de julio
    de 2021 por el que se inician reconsideraciones para un nuevo exportador del Reglamento
    de Ejecución (UE) 2017/2230, por el que se establece un derecho antidumping definitivo
    sobre las importaciones de ácido tricloroisocianúrico originario de la República
    Popular China, con respecto a tres productores exportadores chinos, se deroga
    el derecho aplicable a las importaciones de esos productores exportadores y se
    someten a registro tales importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/1209 av den 22 juli 2021
    om inledande av en översyn, avseende ny exportör, av genomförandeförordning
    (EU) 2017/2230 om införande av en slutgiltig antidumpningstull på import av
    triklorisocyanursyra med ursprung i Folkrepubliken Kina avseende tre kinesiska
    exporterande tillverkare, om upphävande av tullen på import från dessa exporterande
    tillverkare och om registrering av denna import
  type: main
