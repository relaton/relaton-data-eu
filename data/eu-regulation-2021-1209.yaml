  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/1209 ón gCoimisiún an 22 Iúil
    2021 lena dtionscnaítear athbhreithnithe “onnmhaireora nua” i ndáil le Rialachán
    Cur Chun Feidhme (AE) 2017/2230 lena bhforchuirtear dleacht frithdhumpála chinntitheach
    ar allmhairí aigéid thríchlóraisicianúraigh de thionscnamh Dhaon-Phoblacht
    na Síne, ar athbhreithnithe iad le haghaidh trí tháirgeoir onnmhairiúcháin
    de chuid na Síne, agus lena n-aisghairtear an dleacht a mhéid a bhaineann le
    hallmhairí ó na táirgeoirí onnmhairiúcháin sin agus lena gcuirtear na hallmhairí
    sin faoi réir a gcláraithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/1209 оd 22. srpnja 2021. o pokretanju
    revizija Provedbene uredbe (EU) 2017/2230 o uvođenju konačne antidampinške
    pristojbe na uvoz trikloroizocijanurne kiseline podrijetlom iz Narodne Republike
    Kine za tri kineska proizvođača izvoznika (revizije „novih izvoznika”),
    kojom se stavlja izvan snage pristojba s obzirom na uvoz od tih proizvođača
    izvoznika i uvodi evidentiranje tog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1209 végrehajtási rendelete (2021. július 22.)
    a Kínai Népköztársaságból származó triklór-izocianursav behozatalára
    végleges dömpingellenes vám kivetéséről szóló (EU) 2017/2230 végrehajtási
    rendelet három kínai exportáló gyártóra tekintettel új exportőrre vonatkozó
    felülvizsgálatának megindításáról, az ezen exportáló gyártóktól származó
    behozatalra vonatkozó vám eltörléséről, valamint az e behozatalokra vonatkozó
    nyilvántartásba vételi kötelezettségről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1209 della Commissione del 22 luglio
    2021 che avvia un riesame relativo ai «nuovi esportatori» del regolamento di
    esecuzione (UE) 2017/2230 della Commissione che istituisce un dazio antidumping
    definitivo sulle importazioni di acido tricloroisocianurico originarie della Repubblica
    popolare cinese per tre produttori esportatori cinesi, abroga il dazio in vigore
    sulle importazioni di tali produttori esportatori e dispone la registrazione di
    dette importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/1209 (2021. gada 22. jūlijs),
    ar kuru jauna eksportētāja dēļ sāk pārskatīt Komisijas Īstenošanas regulu
    (ES) 2017/2230, ar ko nosaka galīgo antidempinga maksājumu Ķīnas Tautas Republikas
    izcelsmes trihlorizocianūrskābes importam, attiecībā uz trīs Ķīnas ražotājiem
    eksportētājiem un ar kuru atceļ maksājumu šā ražotāja eksportētāja veiktajam
    importam un nosaka šā importa reģistrāciju
  type: main
