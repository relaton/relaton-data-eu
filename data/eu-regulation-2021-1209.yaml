    изпълнение (ЕС) 2017/2230 за налагане на окончателно
    антидъмпингово мито върху вноса на трихлороизоцианопикочна
    киселина с произход от Китайската народна
    република за трима китайски производители
    износители, за отмяна на митото по отношение
    на вноса от тези производители износители
    и за въвеждане на регистрационен режим за този
    внос
  type: main
