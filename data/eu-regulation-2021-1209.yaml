title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1209 of 22 July 2021 initiating
    ‘new exporter’ reviews of Implementing Regulation (EU) 2017/2230 imposing
    a definitive anti-dumping duty on imports of trichloroisocyanuric acid originating
    in the People’s Republic of China for three Chinese exporting producers, repealing
    the duty with regard to imports from these exporting producers and making these
    imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1209 de la Commission du 22 juillet
    2021 portant ouverture d’un réexamen au titre de «nouvel exportateur» du
    règlement d’exécution (UE) 2017/2230 instituant un droit antidumping définitif
    sur les importations d’acide trichloro-isocyanurique originaire de la République
    populaire de Chine pour trois producteurs-exportateurs chinois, abrogeant le droit
    en ce qui concerne les importations provenant de ces producteurs-exportateurs
    et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1209 der Kommission vom 22. Juli 2021
    zur Einleitung von Neuausführerüberprüfungen im Rahmen der Durchführungsverordnung
    (EU) 2017/2230 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    von Trichlorisocyanursäure mit Ursprung in der Volksrepublik China für drei
    chinesische ausführende Hersteller, zur Außerkraftsetzung des Zolls auf die
    von diesen ausführenden Herstellern stammenden Einfuhren und zur zollamtlichen
    Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/1209 на Комисията
    от 22 юли 2021 година за започване на прегледи
