  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/1209 ze dne 22. července 2021,
    kterým se zahajují přezkumy pro „nové vývozce“ prováděcího nařízení
    (EU) 2017/2230 o uložení konečného antidumpingového cla z dovozu kyseliny
    trichlorisokyanurové pocházející z Čínské lidové republiky pro tři čínské
    vyvážející výrobce, zrušuje clo na dovoz uvedených vyvážejících výrobců
    a zavádí celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1209 af 22. juli 2021
    om indledning af fornyede undersøgelser (ny eksportør) inden for rammerne af
    gennemførelsesforordning (EU) 2017/2230 om indførelse af en endelig antidumpingtold
    på importen af trichlorisocyanursyre med oprindelse i Folkerepublikken Kina for
    så vidt angår tre kinesiske eksporterende producenter, om ophævelse af tolden
    på importen fra de pågældende eksporterende producenter og om at gøre denne
    import til genstand for registrering
  type: main
