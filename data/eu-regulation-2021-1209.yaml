    w odniesieniu do przywozu od tych producentów eksportujących i poddające ten
    przywóz wymogowi rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/1209 da Comissão de 22 de julho de
    2021 que inicia reexames relativos a um «novo exportador» do Regulamento de
    Execução (UE) 2017/2230 que institui um direito anti-dumping definitivo sobre
    as importações de ácido tricloro-isocianúrico originário da República Popular
    da China no que diz respeito a três produtores-exportadores chineses, que revoga
    o direito no que respeita às importações provenientes desses produtores-exportadores
    e que sujeita essas importações a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/1209 al Comisiei din 22 iulie
    2021 de deschidere a unor reexaminări, în ceea ce privește un nou exportator,
    a Regulamentului de punere în aplicare (UE) 2017/2230 de instituire a unei taxe
    antidumping definitive la importurile de acid tricloroizocianuric originar din
    Republica Populară Chineză pentru trei producători-exportatori chinezi, de
    abrogare a taxei cu privire la importurile provenite de la respectivii producători-exportatori
    și de impunere a obligativității de înregistrare a acestor importuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1209 z 22. júla 2021, ktorým
