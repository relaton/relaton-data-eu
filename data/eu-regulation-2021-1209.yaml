    ta’ Implimentazzjoni (UE) 2017/2230 li jimponu dazju anti-dumping definittiv
    fuq l-importazzjonijiet ta’ aċidu triklorojsoċjanuriku li joriġina mir-Repubblika
    tal-Poplu taċ-Ċina għal tliet produtturi esportaturi Ċiniżi, li jħassar
