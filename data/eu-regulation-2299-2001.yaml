  script: Latn
  content: A Bizottság 2299/2001/EK rendelete (2001. november 26.) a mezőgazdasági
    termékek után járó export-visszatérítési rendszer alkalmazása közös
    részletes szabályainak megállapításáról szóló 800/1999/EK rendelet, valamint
    a mezőgazdasági termékek után járó export-visszatérítési rendszer alkalmazása
    közös részletes szabályainak megállapításáról szóló 1291/2000/EK rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2299/2001 della Commissione, del 26 novembre 2001,
    che modifica il regolamento (CE) n. 800/1999 recante modalità comuni di applicazione
    del regime delle restituzioni all'esportazione per i prodotti agricoli, e il regolamento
    (CE) n. 1291/2000 che stabilisce le modalità comuni di applicazione del regime
    dei titoli di importazione, di esportazione e di fissazione anticipata relativi
    ai prodotti agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2299/2001 (2001. gada 26. novembris), ar kuru
    groza Regulu (EK) Nr. 800/1999, kas nosaka sīki izstrādātus kopīgus noteikumus
    eksporta kompensāciju sistēmas piemērošanai attiecībā uz lauksaimniecības
    produktiem, un Regulu (EK) Nr. 1291/2000, kas nosaka sīki izstrādātus kopējus
    noteikumus importa un eksporta licenču un iepriekš noteiktas kompensācijas
    sertifikātu sistēmas piemērošanai lauksaimniecības produktiem
  type: main
- language: lt
  script: Latn
  content: 2001 m. lapkričio 26 d. Komisijos reglamentas (EB) Nr. 2299/2001, iš
