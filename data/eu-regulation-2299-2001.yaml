    eksporto grąžinamųjų išmokų sistemos taikymo žemės ūkio produktams taisykles
    ir Reglamentą (EB) Nr. 1291/2000, nustatantį bendrąsias išsamias taisykles
    dėl importo ir eksporto licencijų bei išankstinio nustatymo sertifikatų sistemos
    taikymo žemės ūkio produktams
  type: main
- language: mt
