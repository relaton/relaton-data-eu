    do regime de certificados de importação, de exportação e de prefixação para
    os produtos agrícolas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2299/2001 al Comisiei din 26 noiembrie 2001 de modificare
    a Regulamentului (CE) nr. 800/1999 de stabilire a normelor de aplicare a sistemului
    de restituiri la export pentru produsele agricole și a Regulamentului (CE) nr.
    1291/2000 de stabilire a normelor de aplicare a sistemului de licențe de import
    și export și de certificate de stabilire în avans a restituirii pentru produsele
    agricole
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2299/2001 z 26. novembra 2001, ktoré mení
    a dopĺňa nariadenie (ES) č. 800/1999 stanovujúce spoločné podrobné pravidlá
    uplatňovania systému vývozných náhrad týkajúcich sa poľnohospodárskych
