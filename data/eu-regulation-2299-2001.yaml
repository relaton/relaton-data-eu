  script: Latn
  content: Commission Regulation (EC) No 2299/2001 of 26 November 2001 amending Regulation
    (EC) No 800/1999 laying down common detailed rules for the application of the
    system of export refunds on agricultural products, and Regulation (EC) No 1291/2000
    laying down common detailed rules for the application of the system of import
    and export licences and advance fixing certificates for agricultural products
  type: main
- language: fr
