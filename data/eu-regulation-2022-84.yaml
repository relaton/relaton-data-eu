title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/84 of 19 January 2022 amending
    for the 327th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures against certain persons and entities associated with the
    ISIL (Da'esh) and Al-Qaida organisations
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/84 de la Commission du 19 janvier 2022
    modifiant pour la trois cent vingt-septième fois le règlement (CE) no 881/2002
    du Conseil instituant certaines mesures restrictives spécifiques à l’encontre
    de certaines personnes et entités liées aux organisations EIIL (Daech) et Al-Qaida
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/84 der Kommission vom 19. Januar 2022
    zur 327. Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung
    bestimmter spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit den ISIL (Da’esh)- und Al-Qaida-Organisationen in Verbindung stehen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/84 на Комисията
    от 19 януари 2022 година за изменение за 327-и път
    на Регламент (ЕО) № 881/2002 на Съвета за налагане
    на някои специфични ограничителни мерки, насочени
    срещу определени лица и образувания, свързани
    с организациите ИДИЛ (Даиш) и Ал Кайда
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/84 ze dne 19. ledna 2022, kterým
    se po třísté dvacáté sedmé mění nařízení Rady (ES) č. 881/2002 o zavedení
    některých zvláštních omezujících opatření namířených proti některým
    osobám a subjektům spojeným s organizacemi ISIL (Dá'iš) a Al-Kajdá
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/84 af 19. januar 2022
    om 327. ændring af Rådets forordning (EF) nr. 881/2002 om indførelse af visse
    specifikke restriktive foranstaltninger mod visse personer og enheder, der har
    tilknytning til ISIL- (Da'esh) og Al-Qaida-organisationerne
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/84 της Επιτροπής
    της 19ης Ιανουαρίου 2022 σχετικά με την 327η τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 881/2002 του Συμβουλίου
    για την επιβολή συγκεκριμένων περιοριστικών
    μέτρων κατά ορισμένων προσώπων και οντοτήτων
    που συνδέονται με τις οργανώσεις ISIL (Da'esh) και
    Αλ Κάιντα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/84, 19. jaanuar 2022, millega muudetakse
    327. korda nõukogu määrust (EÜ) nr 881/2002, millega kehtestatakse teatavad
    eripiirangud organisatsioonidega ISIL (Daesh) ja Al-Qaida seotud teatavate isikute
    ja üksuste vastu
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/84, annettu 19 päivänä
    tammikuuta 2022, tiettyihin ISIL- (Daesh-) ja al-Qaida-järjestöjä lähellä
    oleviin henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista
    toimenpiteistä annetun neuvoston asetuksen (EY) N:o 881/2002 muuttamisesta 327.
    kerran
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/84 ón gCoimisiún an 19 Eanáir
    2022 lena leasaítear den 327ú huair Rialachán (CE) Uimh. 881/2002 ón gComhairle
    lena bhforchuirtear bearta sriantacha sonracha áirithe i gcoinne daoine agus
    eintitis áirithe atá bainteach leis na heagraíochtaí SIIS (Da’esh) agus
    Al-Qaida
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/84 оd 19. siječnja 2022. o 327.
    izmjeni Uredbe Vijeća (EZ) br. 881/2002 o uvođenju određenih posebnih mjera
    ograničavanja protiv određenih osoba i subjekata povezanih s organizacijama
    ISIL-om (Da'esh) i Al-Qaidom
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/84 végrehajtási rendelete (2022. január 19.)
    az ISIL-lel (Dáissal) és az al-Kaida szervezetekkel összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott egyes korlátozó
    intézkedések bevezetéséről szóló 881/2002/EK tanácsi rendelet 327. alkalommal
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/84 della Commissione del 19 gennaio
    2022 recante trecentoventisettesima modifica del regolamento (CE) n. 881/2002
    del Consiglio che impone specifiche misure restrittive nei confronti di determinate
    persone ed entità associate alle organizzazioni dell'ISIL (Da'esh) e di Al-Qaeda
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/84 (2022. gada 19. janvāris),
    ar ko 327. reizi groza Padomes Regulu (EK) Nr. 881/2002, ar kuru paredz īpašus
    ierobežojošus pasākumus, kas vērsti pret konkrētām personām un organizācijām,
    kuras saistītas ar organizācijām ISIL (Da'esh) un Al-Qaida
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/84 2022 m. sausio 19 d. kuriuo
    327-ą kartą iš dalies keičiamas Tarybos reglamentas (EB) Nr. 881/2002, kuriuo
    nustatomos tam tikros specialios ribojamosios priemonės, taikomos tam tikriems
    asmenims ir subjektams, susijusiems su ISIL („Da'esh“) ir Al-Qaida organizacijomis
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/84 tad-19 ta’
    Jannar 2022 li jemenda għat-327 darba r-Regolament tal-Kunsill (KE) Nru 881/2002
    li jimponi ċerti miżuri speċifiċi restrittivi diretti kontra ċerti persuni
    u entitajiet assoċjati mal-ISIL (Da’esh) u mal-organizzazzjoni Al-Qaida
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/84 van de Commissie van 19 januari 2022
    tot 327e wijziging van Verordening (EG) nr. 881/2002 van de Raad tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten
    die banden hebben met de organisaties ISIS (Da’esh) en Al Qaida
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/84 z dnia 19 stycznia 2022
    r. zmieniające po raz 327. rozporządzenie Rady (WE) nr 881/2002 wprowadzające
    niektóre szczególne środki ograniczające skierowane przeciwko niektórym osobom
    i podmiotom związanym z organizacjami ISIL (Daisz) i Al-Kaida
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/84 da Comissão de 19 de janeiro de
    2022 que altera pela 327.a vez o Regulamento (CE) n.o 881/2002 do Conselho que
    impõe certas medidas restritivas específicas contra determinadas pessoas e entidades
    associadas às organizações EIIL (Daexe) e Alcaida
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/84 al Comisiei din 19 ianuarie
    2022 de modificare pentru a 327-a oară a Regulamentului (CE) nr. 881/2002 al
    Consiliului de instituire a unor măsuri restrictive specifice împotriva anumitor
    persoane și entități asociate cu organizațiile ISIL (Da'esh) și Al-Qaida
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/84 z 19. januára 2022, ktorým
    sa tristodvadsiaty siedmykrát mení nariadenie Rady (ES) č. 881/2002, ktoré
    ukladá niektoré špecifické obmedzujúce opatrenia namierené proti niektorým
    osobám a subjektom spojeným s organizáciami ISIL (Dá'iš) a al-Káida
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/84 z dne 19. januarja 2022 o tristosedemindvajseti
    spremembi Uredbe Sveta (ES) št. 881/2002 o posebnih omejevalnih ukrepih za nekatere
    osebe in subjekte, povezane z organizacijama ISIL (Daiš) in Al-Kaida
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/84 de la Comisión de 19 de enero de
    2022 por el que se modifica por 327.a vez el Reglamento (CE) n.o 881/2002 del
    Consejo, por el que se imponen determinadas medidas restrictivas específicas
    dirigidas contra determinadas personas y entidades asociadas con las organizaciones
    EIIL (Daesh) y Al-Qaida
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/84 av den 19 januari 2022
