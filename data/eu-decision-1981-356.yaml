title:
- language: en
  script: Latn
  content: '81/356/EEC: Commission Decision of 11 May 1981 establishing that the apparatus
    described as ''Daybreak- TL oven temperature controller, model 520, with AC power
    control model 521; - alpha counter, model 580/1; - icepoint compensator with module
    bin and rack mounting'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/356/CEE: Décision de la Commission, du 11 mai 1981, constatant que
    l''importation des appareils dénommés "Daybreak - TL oven, temperature controller,
    model 520, with AC power control model 521, alpha counter, model 580/1 - icepoint
    compensator with module bin and rack mounting" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '81/356/EWG: Entscheidung der Kommission vom 11. Mai 1981, mit der festgestellt
    wird, daß die Geräte ,,Daybreak - TL Oven Temperature Controller, model 520,
    with AC Power Control model 521 - Alpha Counter, model 580/1 - Icepoint Compensator
    with module bin and rack mounting" nicht unter Befreiung von Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '81/356/EØF: Kommissionens beslutning af 11. maj 1981 om fastslåelse
    af, at indførsel af apparatet "Daybreak-TL Oven Temperature Controller, model
    520, with AC Power Control model 521, Alpha Counter, model 580/1, Icepoint Compensator
    with module bin and rack mounting", ikke kan ske med fritagelse for told efter
    den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '81/356/ΕΟΚ: Απόφαση τής Επιτροπής τής 11ης
    Μαΐου 1981 περί διαπιστώσεως ότι η εισαγωγή τών
    συσκευών υπό τήν ονομασία «Daybreak — TL oven temperature
    controller, model 520, with AC power control model 521, — alpha counter, model
    580/1, — icepoint compensator with module bin and rack mounting» δέν δύναται
    νά πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '81/356/CEE: Decisione della Commissione, dell''11 maggio 1981, che stabilisce
    che l''importazione degli apparecchi denominati "Daybreak - TL oven temperature
    controller, model 520, with AC power control model 521, - alpha counter, model
    580/1-icepoint compensator with module bin and rack mountaing" non può avvenire
    in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/356/EEG: Beschikking van de Commissie van 11 mei 1981 waarbij wordt
    vastgesteld dat de apparaten genaamd ,,DAYBREAK-TL Oven Temperature Controller,
    model 520, with AC Power Control, model 521 - Alpha Counter, model 580/1 - Icepoint
    Compensator with module bin and rack mounting" niet met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief mogen worden ingevoerd'
  type: main
