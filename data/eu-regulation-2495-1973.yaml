title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2495/73 of the Commission of 13 September 1973 authorizing
    Denmark to abolish the component for the protection of the processing industry
    as regards certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2495/73 de la Commission, du 13 septembre 1973, autorisant
    le Danemark à supprimer l' élément destiné à assurer la protection de l'
    industrie de transformation pour certains produits céréaliers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2495/73 der Kommission vom 13. September 1973 zur
    Ermächtigung Dänemarks, den Bestandteil zum Schutz der Verarbeitungsindustrie
    bei bestimmten Getreideerzeugnissen aufzuheben
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2495/73 af 13. september 1973 om bemyndigelse
    for Danmark til at afskaffe det element, der har til formål at sikre beskyttelsen
    af forarbejdningsindustrien, for så vidt angår visse kornprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2495/73 τής Επιτροπής
    τής 13ης Σεπτεμβρίου 1973 περί εξουσιοδοτήσεως
    τής Δανίας νά καταργήσει τό στοιχείο τό προορισμένο
    νά διασφαλίσει τήν προστασία τής βιομηχανίας
    μεταποιήσεως ορισμένων δημητριακών προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2495/73 della Commissione, del 13 settembre 1973,
    che autorizza la Danimarca a sopprimere l' elemento destinato ad assicurare la
    protezione dell' industria di trasformazione per alcuni prodotti cerealicoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2495/73 van de Commissie van 13 september 1973 houdende
    machtiging van Denemarken tot afschaffing van het element ter bescherming van
    de verwerkende industrie voor bepaalde graanprodukten
  type: main
