title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1967, portant octroi du concours
    du Fonds social européen au bénéfice de la République italienne pour des dépenses
    relatives à des opérations de réinstallation effectuées par l'"Opera nazionale
    per gli invalidi di guerra"
  type: main
- language: de
  script: Latn
  content: '68/80/EWG: Entscheidung der Kommission vom 22. Dezember 1967 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für von der "Opera nazionale per gli invalidi di guerra" durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '68/80/CEE: Decisione della Commissione, del 22 dicembre 1967, relativa
    alla concessione di un contributo del FSE a favore della Repubblica italiana per
    spese concernenti operazioni di nuova sistemazione effettuate dall'' «Opera nazionale
    per gli invalidi di guerra»'
  type: main
- language: nl
  script: Latn
  content: '68/80/EEG: Beschikking van de Commissie van 22 december 1967 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Opera nazionale per gli invalidi di guerra" gemaakte verplaatsingskosten'
