    tam tikras ribojančias priemones, remiančias veiksmingą Tarptautinio baudžiamojo
    tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 830/2005 van de Commissie van 30 mei 2005 houdende
    vijfde wijziging van Verordening (EG) nr. 1763/2004 van de Raad tot vaststelling
    van bepaalde beperkende maatregelen ter ondersteuning van de daadwerkelijke uitvoering
    van het mandaat van het Internationaal Straftribunaal voor het voormalige Joegoslavië
    (ICTY)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 830/2005 z dnia 30 maja 2005 r. zmieniające
    po raz piąty rozporządzenie Rady (WE) nr 1763/2004 nakładające określone
    środki ograniczające celem wspierania skutecznego wykonania mandatu Międzynarodowego
    Trybunału Karnego dla byłej Jugosławii (MTKJ)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 830/2005 da Comissão, de 30 de Maio de 2005, que
    altera pela quinta vez o Regulamento (CE) n.° 1763/2004 do Conselho que impõe
    determinadas medidas restritivas de apoio ao exercício efectivo do mandato do
    Tribunal Penal Internacional para a antiga Jugoslávia (TPIJ)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 830/2005 al Comisiei din 30 mai 2005 de efectuare
    a celei de-a cincea modificări a Regulamentului (CE) nr. 1763/2004 al Consiliului
    de instituire a anumitor măsuri restrictive în sprijinul punerii efective în
    aplicare a mandatului Tribunalului Penal Internațional pentru fosta Iugoslavie
    (TPII)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 830/2005 z 30. mája 2005, ktorým sa po piatykrát
    mení a dopĺňa nariadenie Rady (ES) č. 1763/2004, ktorým sa ukladajú určité
    obmedzujúce opatrenia na podporu efektívneho vykonávania mandátu Medzinárodného
    trestného tribunálu pre bývalú Juhosláviu (ICTY)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 830/2005 z dne 30. maja 2005 o peti spremembi
