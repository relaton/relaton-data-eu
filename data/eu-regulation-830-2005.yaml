title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 830/2005 of 30 May 2005 amending, for the
    fifth time, Council Regulation (EC) No 1763/2004 imposing certain restrictive
    measures in support of effective implementation of the mandate of the International
    Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 830/2005 de la Commission du 30 mai 2005 modifiant,
    pour la cinquième fois, le règlement (CE) n° 1763/2004 du Conseil instituant
    certaines mesures restrictives à l'appui d'une mise en œuvre effective du mandat
    du Tribunal pénal international de l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 830/2005 der Kommission vom 30. Mai 2005 zur fünften
    Änderung der Verordnung (EG) Nr. 1763/2004 des Rates über die Anwendung bestimmter
    restriktiver Maßnahmen zur Unterstützung der wirksamen Ausführung des Mandats
    des Internationalen Strafgerichtshofs für das ehemalige Jugoslawien (ICTY)
  type: main
