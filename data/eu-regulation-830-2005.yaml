    eripiirangud, millega toetatakse endise Jugoslaavia asjade rahvusvahelise kriminaalkohtu
    (EJRK) volituste tõhusat rakendamist
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 830/2005, annettu 30 päivänä toukokuuta 2005,
