  script: Latn
  content: Commission Regulation (EEC) No 1471/92 of 4 June 1992 re- establishing
    the levying of customs duties on products of category 18 (order No 40.0180), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1471/92 de la Commission, du 4 juin 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 18 (numéro d' ordre 40.0180) originaires du Pakistan, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
