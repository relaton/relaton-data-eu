title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2511/90 of 30 August 1990 fixing, for unginned
    cotton, the actual production for the 1989/90 marketing year and the estimated
    production, the adjustment in the maximum guaranteed quantity and the reduction
    in the aid for the 1990/91 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2511/90 de la Commission du 30 août 1990 fixant,
    pour le coton non égrené, la production effective pour la campagne de commercialisation
    1989/1990, et déterminant pour la campagne 1990/1991 la production estimée,
    l'ajustement de la quantité maximale garantie et l'abattement de l'aide
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2511/90 DER KOMMISSION vom 30. August 1990 zur Festsetzung
    der tatsaechlichen Erzeugung fuer nicht entkoernte Baumwolle im Wirtschaftsjahr
    1989/90 und der geschaetzten Erzeugung, der Anpassung der garantierten Hoechstmenge
    und der Kuerzung der Beihilfe fuer das Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2511/90 af 30. august 1990 om fastsættelse
    for ikke-egreneret bomuld for produktionsåret 1989/90 af den faktiske produktion
    og for produktionsåret 1990/91 af den anslåede produktion, justering af den
    maksimale garantimængde og nedsættelse af støttebeløbet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2511/90 της Επιτροπής
    της 30ής Αυγούστου 1990 που καθορίζει, για τον
    μη εκκοκκισμένο βάμβακα, την πραγματική παραγωγή
    για την περίοδο εμπορίας 1989/90 και προσδιορίζει
    για την περίοδο 1990/91 την εκτιμώμενη παραγωγή,
    την προσαρμογή της μέγιστης εγγυημένης ποσότητας
    και τη μείωση της ενίσχυσης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2511/90 DELLA COMMISSIONE del 30 agosto 1990 che fissa,
    per il cotone non sgranato, la produzione effettiva per la campagna di commercializzazione
    1989/1990 e che determina per la campagna di commercializzazione 1990/1991 la
    produzione stimata, l'adeguamento del quantitativo massimo garantito e la riduzione
    dell'importo dell'integrazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2511/90 VAN DE COMMISSIE van 30 augustus 1990 tot
    vaststelling, voor niet ontpitte katoen, van de feitelijke produktie voor het
    verkoopseizoen 1989/1990 en van de geraamde produktie, de aangepaste gegarandeerde
    maximumhoeveelheid en de korting op het steunbedrag voor het verkoopseizoen 1990/1991
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2511/90 DA COMISSAO de 30 de Agosto de 1990 que fixa,
    para o algodao nao descaroçado, a produçao efectiva para a campanha de comercializaçao
    de 1989/1990 e determina, para a campanha de comercializaçao de 1990/1991, a
    produçao prevista, o ajustamento da quantidade maxima garantida e a reduçao
    da ajuda
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2511/90 DE LA COMISION de 30 de agosto de 1990 que
    fija para el algodon sin desmotar la produccion efectiva para la campana de comercializacion
    de 1989/90, y que determina para la campana de 1990/91 la produccion estimada,
    el ajuste de la cantidad maxima garantizada y la reduccion de la ayuda
  type: main
