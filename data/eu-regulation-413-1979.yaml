  content: Commission Regulation (EEC) No 413/79 of 28 February 1979 fixing the rates
    of the refunds applicable from 1 March 1979 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 413/79 de la Commission, du 28 février 1979, fixant
