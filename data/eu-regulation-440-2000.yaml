title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 440/2000 of 25 February 2000 laying down
    for 2000 the quantities for which the annual allocations for newcomer operators
    are granted under the tariff quotas and for traditional ACP bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 440/2000 de la Commission, du 25 février 2000, déterminant
    les quantités pour lesquelles les allocations annuelles aux «opérateurs nouveaux
    arrivés» sont octroyées, pour l'année 2000, dans le cadre des contingents
    tarifaires à l'importation et de la quantité de bananes traditionnelles ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 440/2000 der Kommission vom 25. Februar 2000 zur Festsetzung
    der den "neuen Marktbeteiligten" zuzuteilenden Jahresmengen an den Zolleinfuhrkontingenten
    und den traditionellen AKP-Bananen für 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 440/2000 af 25. februar 2000 om fastlæggelse
    af de årlige tildelinger til de nytilkomne erhvervsdrivende for 2000 i forbindelse
    med toldkontingenterne og mængden af traditionelle AVS-bananer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 440/2000 της Επιτροπής,
    της 25ης Φεβρουαρίου 2000, περί καθορισμού των
    ποσοτήτων για τις οποίες χορηγούνται ετήσιες
    κατανομές στους «νεοεμφανιζόμενους εμπορικούς
    φορείς», για το έτος 2000, στο πλαίσιο των δασμολογικών
    ποσοστώσεων εισαγωγής και της ποσότητας παραδοσιακών
    μπανανών ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 440/2000, annettu 25 päivänä helmikuuta 2000,
    tuontitariffikiintiöiden ja AKT-banaanien perinteisten määrien mukaisista uusille
    toimijoille vuodeksi 2000 myönnettävistä vuosittaisista määristä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 440/2000 della Commissione, del 25 febbraio 2000, che
    determina i quantitativi per i quali sono concesse, per l'anno 2000, le assegnazioni
    annuali agli «operatori nuovi arrivati» nel quadro dei contingenti tariffari
    all'importazione delle banane ACP tradizionali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 440/2000 van de Commissie van 25 februari 2000 tot
    bepaling van de hoeveelheden waarvoor voor het jaar 2000 de jaarlijkse toewijzingen
    voor de invoer in het kader van de tariefcontingenten en de invoer van de hoeveelheid
    traditionele ACS-bananen aan de marktdeelnemers-nieuwkomers worden toegekend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 440/2000 da Comissão, de 25 de Fevereiro de 2000,
    que determina as quantidades em relação às quais são concedidas, para 2000,
    as atribuições anuais aos novos operadores, no âmbito dos contingentes pautais
    de importação e da quantidade de bananas tradicionais ACP
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 440/2000 de la Comisión, de 25 de febrero de 2000,
    por el que se fijan las cantidades por las que se conceden las asignaciones anuales
    a los «operadores recién llegados», para el año 2000, en el marco de los contingentes
    arancelarios de importación y de la cantidad de plátanos tradicionales ACP
  type: main
- language: sv
  script: Latn
