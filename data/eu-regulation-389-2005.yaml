  script: Latn
  content: Commission Regulation (EC) No 389/2005 of 8 March 2005 laying down derogations
    from Council Regulation (EC) No 2201/96 and Regulation (EC) No 800/1999 as regards
    certain sugars used in certain products processed from fruit and vegetables exported
    to third countries other than Switzerland and Liechtenstein
  type: main
