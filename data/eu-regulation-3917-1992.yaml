title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3917/92 of 21 December 1992 extending into
    1993 the application of Regulations (EEC) No 3831/90, (EEC) No 3832/90, (EEC)
    No 3833/90, (EEC) No 3834/90, (EEC) No 3835/90 and (EEC) No 3900/91 applying generalized
    tariff preferences for 1991 in respect of certain products originating in developing
    countries, and adding to the list of beneficiaries of such preferences
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3917/92 du Conseil, du 21 décembre 1992, prorogeant
    en 1993 l' application des règlements (CEE) nº 3831/90, (CEE) nº 3832/90, (CEE)
    nº 3833/90, (CEE) nº 3834/90, (CEE) nº 3835/90 et (CEE) nº 3900/91, portant
    application de préférences tarifaires généralisées pour l' année 1991 à
    certains produits originaires de pays en développement et complétant la liste
    des bénéficiaires de ces préférences
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3917/92 des Rates vom 21. Dezember 1992 zur Verlängerung
