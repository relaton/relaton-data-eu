    (EWG) Nr. 3834/90, (EWG) Nr. 3835/90 sowie (EWG) Nr. 3900/91 zur Anwendung allgemeiner
    Zollpräferenzen für bestimmte Erzeugnisse mit Ursprung in Entwicklungsländern
    im Jahr 1991 und zur Ergänzung der Liste der Begünstigten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3917/92 af 21. december 1992 om forlængelse
