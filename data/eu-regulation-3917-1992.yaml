    των προτιμήσεων αυτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3917/92 del Consiglio, del 21 dicembre 1992, che proroga
    nel 1993 l' applicazione dei regolamenti (CEE) n. 3831/90, (CEE) n. 3832/92, (CEE)
    n. 3833/90, (CEE) n. 3834/90, (CEE) n. 3835/90 e (CEE) n. 3900/91 recanti applicazione
    di preferenze tariffarie generalizzate, per l' anno 1991, a taluni prodotti originari
    di paesi in via di sviluppo e che completa l' elenco dei beneficiari di dette
    preferenze
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3917/92 van de Raad van 21 december 1992 tot verlenging
