    nr. 3833/90, (EØF) nr. 3834/90, (EØF) nr. 3835/90 og (EØF) nr. 3900/91 om anvendelse
    af generelle toldpræferencer i 1991 for visse varer med oprindelse i udviklingslande
    og om supplering af listen over præferenceberettigede lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3917/92 του Συμβουλίου
