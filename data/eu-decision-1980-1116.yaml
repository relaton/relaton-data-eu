title:
- language: en
  script: Latn
  content: '80/1116/EEC: Commission Decision of 4 December 1980 accepting undertakings
    offered by the exporters of saccharin and its salts originating in China and the
    United States of America and terminating the proceedings concerning imports of
    saccharin and its salts from China, Japan and the United States of America'
  type: main
- language: fr
  script: Latn
  content: '80/1116/CEE: Décision de la Commission, du 4 décembre 1980, portant
    acceptation des engagements pris par les exportateurs de saccharine et de ses
    sels originaires de Chine et des États-Unis d'' Amérique et clôturant la procédure
    concernant des importations de saccharine et de ses sels en provenance de Chine,
    du Japon et des États-Unis d'' Amérique'
  type: main
- language: de
  script: Latn
  content: '80/1116/EWG: Beschluß der Kommission vom 4. Dezember 1980 über die Annahme
    von Verpflichtungen der Ausführer von Saccharin und seinen Salzen mit Ursprung
    in China und den Vereinigten Staaten von Amerika und über die Beendigung des
    Verfahrens betreffend die Einfuhren von Saccharin und seinen Salzen aus China,
    Japan und den Vereinigten Staaten von Amerika'
  type: main
- language: da
  script: Latn
  content: '80/1116/EØF: Kommissionens afgørelse af 4. december 1980 om godtagelse
    af tilsagn afgivet af eksportørerne af saccharin og salte deraf med oprindelse
    i Kina og Amerikas forenede Stater og om afslutning af proceduren vedrørende
    indførslen af saccharin og salte deraf fra Kina, Japan og Amerikas forenede Stater'
  type: main
- language: it
  script: Latn
  content: '80/1116/CEE: Decisione della Commissione, del 4 dicembre 1980, che accetta
    gli impegni offerti dagli esportatori di saccarina e dei suoi sali originari della
    Cina e degli Stati Uniti d'' America e conclude le procedure riguardanti le importazioni
    di saccarina e dei suoi sali dalla Cina, dal Giappone e dagli Stati Uniti d''
    America'
  type: main
- language: nl
  script: Latn
  content: '80/1116/EEG: Besluit van de Commissie van 4 december 1980 houdende aanvaarding
    van de verbintenissen die door de exporteurs van saccharine en zouten daarvan,
    van oorsprong uit China en de Verenigde Staten van Amerika, zijn aangeboden en
    beëindiging van de procedure betreffende de invoer van saccharine en zouten daarvan
    uit China, Japan en de Verenigde Staten van Amerika'
  type: main
