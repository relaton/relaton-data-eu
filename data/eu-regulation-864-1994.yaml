title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 864/94 of 18 April 1994 determining the extent
    to which applications lodged in April 1994 for import licences for certain milk
    products and products covered by the arrangements provided for in the European
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Interim Agreement concluded with the Czech Republic and Slovak
    Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 864/94 de la Commission, du 18 avril 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    avril 1994 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords européens conclus par la Communauté
    avec la république de Pologne, la république de Hongrie et par l'accord intérimaire
    conclu avec la République tchèque et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 864/94 der Kommission vom 18. April 1994 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im April 1994 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen und der Republik Ungarn geschlossenen Europa-Abkommen sowie
    dem mit der Tschechischen Republik und der Slowakischen Republik geschlossenen
    Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 864/94 af 18. april 1994 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i april 1994 for
    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i europaaftalerne mellem Fællesskabet og Republikken
    Polen, Republikken Ungarn og interimsaftaler med Den Tjekkiske Republik og Den
    Slovakiske Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 864/94 της Επιτροπής
    της 18ης Απριλίου 1994 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    αδειών εισαγωγής που υποβάλλονται τον Απρίλιο
    1994 για ορισμένα προϊόντα στον τομέα του γάλακτος
    και των γαλακτοκομικών προϊόντων στα πλαίσια
    του καθεστώτος που προβλέπεται από τις ευρωπαϊκές
    συμφωνίες που έχουν συναφθεί από την Κοινότητα
    με τη Δημοκρατία της Πολωνίας, τη Δημοκρατία
    της Ουγγαρίας και την προσωρινή συμφωνία που
    έχει συναφθεί με την Τσεχική Δημοκρατία και
    τη Σλοβακική Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 864/94 della Commissione, del 18 aprile 1994, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli di importazione
    presentate nel mese di aprile 1994 per taluni prodotti del settore lattiero-caseari
    nel quadro del regime previsto dagli accordi europei conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria e dall'accordo interinale
    concluso con la Repubblica Ceca e la Repubblica Slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 864/94 van de Commissie van 18 april 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector melk en zuivelprodukten, die in april 1994
    zijn ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Europese overeenkomsten met de Republiek Polen, de Republiek Hongarije
    en de Interimovereenkomst gesloten met de Tsjechische Republiek en de Slowaakse
    Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 864/94 da Comissão, de 18 de Abril de 1994, que determina
    a medida em que podem ser aceites os pedidos de licenças de importação, apresentados
    em Abril de 1994, para determinados produtos do sector do leite e dos produtos
    lácteos, no âmbito do regime previsto nos acordos europeus concluídos pela
    Comunidade com a República da Polónia, a República da Hungria e no Acordo provisório
    concluído com a República Checa e a República Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 864/94 de la Comisión, de 18 de abril de 1994, por el
    que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en abril de 1994, de algunos productos del sector
    de la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
    europeos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría y por el Acuerdo interino celebrado con la República Checa y la República
    Eslovaca
