    ammatinharjoittajien sijoittautumisvapauden ja palvelujen tarjoamisen vapauden
    toteuttamiseksi
  type: main
- language: it
  script: Latn
  content: Direttiva 67/654/CEE del Consiglio, del 24 ottobre 1967, che fissa le modalità
