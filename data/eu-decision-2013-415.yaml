---
id: EUDecision2013415
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2013/415/EU: Commission Implementing Decision of 31 July 2013 amending
    Annex II to Decision 2006/766/EC as regards the inclusion of Tristan da Cunha
    in the list of third countries and territories from which imports of certain fishery
    products for human consumption are permitted and the deletion of Mayotte from
    that list (notified under document C(2013) 4848)'
  type: main
- language: fr
  script: Latn
  content: '2013/415/UE: Décision d’exécution de la Commission du 31 juillet 2013
    modifiant l’annexe II de la décision 2006/766/CE en ce qui concerne l’inscription
    de Tristan da Cunha sur la liste des pays tiers et territoires en provenance desquels
    l’importation de certains produits de la pêche destinés à la consommation
    humaine est autorisée ainsi que la suppression de Mayotte de cette liste [notifiée
    sous le numéro C(2013) 4848]'
  type: main
- language: de
  script: Latn
  content: '2013/415/EU: Durchführungsbeschluss der Kommission vom 31. Juli 2013
    zur Änderung des Anhangs II der Entscheidung 2006/766/EG zwecks Aufnahme von
    Tristan da Cunha in die Liste der Drittländer und Gebiete, aus denen Einfuhren
    bestimmter Fischereierzeugnisse zum menschlichen Verzehr zulässig sind, und zur
    Streichung von Mayotte von dieser Liste (Bekanntgegeben unter Aktenzeichen C(2013)
    4848)'
  type: main
- language: bg
  script: Cyrl
  content: '2013/415/ЕС: Решение за изпълнение на Комисията
    от 31 юли 2013 година за изменение на приложение
    II към Решение 2006/766/ЕО по отношение на вписването
    на Тристан да Куня в списъка с третите страни
    и териториите, от които е разрешен вносът на
    рибни продукти, предназначени за консумация
    от човека, както и по отношение на заличаването
    на Майот от посочения списък (нотифицирано
    под номер C(2013) 4848)'
  type: main
- language: cs
  script: Latn
  content: '2013/415/EU: Prováděcí rozhodnutí Komise ze dne 31. července 2013
    , kterým se mění příloha II rozhodnutí 2006/766/ES, pokud jde o zařazení
    ostrova Tristan da Cunha do seznamu třetích zemí a území, ze kterých je
    povolen dovoz některých produktů rybolovu určených k lidské spotřebě,
    a odstranění ostrova Mayotte z uvedeného seznamu (oznámeno pod číslem C(2013)
    4848)'
  type: main
- language: da
  script: Latn
  content: '2013/415/EU: Kommissionens gennemførelsesafgørelse af 31. juli 2013
    om ændring af bilag II til beslutning 2006/766/EF for så vidt angår optagelsen
    af Tristan da Cunha på listen over tredjelande og områder, hvorfra det er tilladt
    at importere visse fiskevarer til konsum, og om sletning af Mayotte fra samme
    liste (meddelt under nummer C(2013) 4848)'
  type: main
- language: el
  script: Grek
  content: '2013/415/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 31ης Ιουλίου 2013 , για την τροποποίηση του
    παραρτήματος II της απόφασης 2006/766/ΕΚ όσον αφορά
    την προσθήκη του Τριστάν ντα Κούνα στον κατάλογο
    των τρίτων χωρών και των εδαφών τους από τα
    οποία επιτρέπονται οι εισαγωγές ορισμένων
    αλιευτικών προϊόντων για ανθρώπινη κατανάλωση
    και τη διαγραφή του Μαγιότ από τον εν λόγω κατάλογο
    [κοινοποιηθείσα υπό τον αριθμό C(2013) 4848]'
  type: main
- language: et
  script: Latn
  content: '2013/415/EL: Komisjoni rakendusotsus, 31. juuli 2013 , millega muudetakse
    otsuse 2006/766/EÜ II lisa seoses Tristan da Cunha lisamisega loetelusse kolmandate
    riikide ja territooriumide kohta, millest on lubatud importida teatavaid inimtoiduks
    ettenähtud kalatooteid, ja Mayotte’i väljajätmisega sellest loetelust (teatavaks
    tehtud numbri C(2013) 4848 all)'
  type: main
- language: fi
  script: Latn
  content: '2013/415/EU: Komission täytäntöönpanopäätös, annettu 31 päivänä
    heinäkuuta 2013 , päätöksen 2006/766/EY liitteen II muuttamisesta Tristan
    da Cunhan lisäämiseksi sellaisten kolmansien maiden ja alueiden luetteloon,
    joista on sallittua tuoda tiettyjä ihmisravinnoksi tarkoitettuja kalastustuotteita,
    sekä Mayotten poistamiseksi kyseisestä luettelosta (tiedoksiannettu numerolla
    C(2013) 4848)'
  type: main
- language: hr
  script: Latn
  content: '2013/415/EU: Provedbena odluka Komisije оd 31. srpnja 2013. o izmjeni
    Priloga II. Odluci 2006/766/EZ o uključivanju Tristana da Cunha na popis trećih
    zemalja i državnih područja iz kojih je dozvoljen uvoz određenih proizvoda
    ribarstva namijenjenih prehrani ljudi i brisanju Mayotte s tog popisa (priopćeno
    pod brojem dokumenta C(2013) 4848)'
  type: main
- language: hu
  script: Latn
  content: '2013/415/EU: A Bizottság végrehajtási határozata ( 2013. július 31.
    ) a 2006/766/EK határozat II. mellékletének Tristan da Cunhának az emberi
    fogyasztásra szánt egyes halászati termékek behozatalára jogosult harmadik
    országok és területek jegyzékébe való felvétele és Mayotte-nak e jegyzékből
    való törlése tekintetében történő módosításáról (az értesítés a
    C(2013) 4848. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2013/415/UE: Decisione di esecuzione della Commissione, del 31 luglio
    2013 , che modifica l’allegato II della decisione 2006/766/CE per quanto concerne
    l’inserimento di Tristan da Cunha nell’elenco dei paesi terzi e dei territori
    da cui sono autorizzate le importazioni di determinati prodotti della pesca destinati
    al consumo umano e la soppressione di Mayotte da tale elenco [notificata con il
    numero C(2013) 4848]'
  type: main
- language: lv
  script: Latn
  content: '2013/415/ES: Komisijas Īstenošanas lēmums ( 2013. gada 31. jūlijs
    ), ar kuru groza II pielikumu Lēmumā 2006/766/EK attiecībā uz Tristana da
    Kuņas salu iekļaušanu to trešo valstu un teritoriju sarakstā, no kurām ir
    atļauts ievest konkrētus zvejniecības produktus, kas paredzēti lietošanai
    pārtikā, un Majotas svītrošanu no minētā saraksta (izziņots ar dokumenta
    numuru C(2013) 4848)'
  type: main
- language: lt
  script: Latn
  content: '2013/415/ES: 2013 m. liepos 31 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl Tristano da Kunjos salų įtraukimo į trečiųjų šalių ir teritorijų,
    iš kurių leidžiama importuoti tam tikrus žmonėms vartoti skirtus žuvininkystės
    produktus, sąrašą ir Majoto išbraukimo iš to sąrašo iš dalies keičiamas
    Sprendimo 2006/766/EB II priedas (pranešta dokumentu Nr. C(2013) 4848)'
  type: main
- language: mt
  script: Latn
  content: '2013/415/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tal- 31
    ta’ Lulju 2013 li temenda l-Anness II tad-Deċiżjoni 2006/766/KE rigward l-inklużjoni
    ta’ Tristan da Cunha fil-lista ta’ pajjiżi terzi u territorji li minnhom
    l-importazzjonijiet ta’ ċerti prodotti tas-sajd għall-konsum mill-bniedem
    huma permessi u t-tħassir ta’ Mayotte minn dik il-lista (notifikata bid-dokument
    C(2013) 4848)'
  type: main
- language: nl
  script: Latn
  content: '2013/415/EU: Uitvoeringsbesluit van de Commissie van 31 juli 2013 tot
    wijziging van bijlage II bij Beschikking 2006/766/EG wat betreft de opneming van
    Tristan da Cunha in de lijst van derde landen en gebieden waaruit bepaalde visserijproducten
    voor menselijke consumptie mogen worden ingevoerd en de schrapping van Mayotte
    uit die lijst (Kennisgeving geschied onder nummer C(2013) 4848)'
  type: main
- language: pl
  script: Latn
  content: '2013/415/UE: Decyzja wykonawcza Komisji z dnia 31 lipca 2013 r. zmieniająca
    załącznik II do decyzji 2006/766/WE w odniesieniu do włączenia Tristan da
    Cunha do wykazu państw i terytoriów trzecich, z których dopuszczony jest przywóz
    niektórych produktów rybołówstwa przeznaczonych do spożycia przez ludzi,
    oraz skreślenia Majotty z tego wykazu (notyfikowana jako dokument nr C(2013)
    4848)'
  type: main
- language: pt
  script: Latn
  content: '2013/415/UE: Decisão de Execução da Comissão, de 31 de julho de 2013
    , que altera o anexo II da Decisão 2006/766/CE no que respeita à inclusão de
    Tristão da Cunha na lista de países terceiros e territórios a partir dos quais
    são autorizadas as importações de determinados produtos da pesca para consumo
    humano e a supressão de Maiote dessa mesma lista [notificada com o número C(2013)
    4848]'
  type: main
- language: ro
  script: Latn
  content: '2013/415/UE: Decizia de punere în aplicare a Comisiei din 31 iulie 2013
    de modificare a anexei II la Decizia 2006/766/CE în ceea ce privește includerea
    Tristan da Cunha pe lista țărilor terțe și a teritoriilor din care se autorizează
    importurile de anumite produse pescărești pentru consumul uman și eliminarea
    Mayotte de pe această listă [notificat cu numărul C(2013) 4848]'
  type: main
- language: sk
  script: Latn
  content: '2013/415/EÚ: Vykonávacie rozhodnutie Komisie z 31. júla 2013 , ktorým
    sa mení príloha II k rozhodnutiu 2006/766/ES, pokiaľ ide o zaradenie súostrovia
    Tristan da Cunha do zoznamu tretích krajín a území, z ktorých je povolený
    dovoz určitých produktov rybolovu určených na ľudskú spotrebu, a o vypustenie
    ostrova Mayotte z tohto zoznamu [oznámené pod číslom C(2013) 4848]'
  type: main
- language: sl
  script: Latn
  content: '2013/415/EU: Izvedbeni sklep Komisije z dne 31. julija 2013 o spremembi
    Priloge II k Odločbi 2006/766/ES glede vnosa Tristan da Cunha na seznam tretjih
    držav in ozemelj, iz katerih je dovoljen uvoz nekaterih ribiških proizvodov
    za prehrano ljudi, ter črtanja Mayotta z navedenega seznama (notificirano pod
    dokumentarno številko C(2013) 4848)'
  type: main
- language: es
  script: Latn
  content: '2013/415/UE: Decisión de Ejecución de la Comisión, de 31 de julio de
    2013 , por la que se modifica el anexo II de la Decisión 2006/766/CE en lo que
    respecta a la inclusión de Tristán da Cunha en la lista de terceros países
    y territorios desde los que se autorizan las importaciones de determinados productos
    de la pesca destinados al consumo humano y a la supresión de Mayotte de dicha
    lista [notificada con el número C(2013) 4848]'
  type: main
- language: sv
  script: Latn
  content: '2013/415/EU: Kommissionens genomförandebeslut av den 31 juli 2013 om
    ändring av bilaga II till beslut 2006/766/EG vad gäller införande av Tristan
    da Cunha i förteckningen över tredjeländer och delar av tredjeländer från
    vilka import av vissa fiskeriprodukter för användning som livsmedel är tillåten
    och strykning av Mayotte från förteckningen [delgivet med nr C(2013) 4848]'
