- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/856 of 30 May 2022 accepting
    a request submitted by Ireland pursuant to Article 7(4) of Directive (EU) 2016/797
    of the European Parliament and of the Council not to apply Commission Regulation
    (EU) No 1302/2014 and Commission Regulation (EU) No 1303/2014 to IÉ-RU Class
    22000 ICDMU – ‘B2’ intermediate cars (notified under document C(2022) 3365)
    (Only the English and the Irish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/856 de la Commission du 30 mai 2022
    acceptant une demande présentée par l’Irlande, conformément à l’article
    7, paragraphe 4, de la directive (UE) 2016/797 du Parlement européen et du Conseil,
    de ne pas appliquer le règlement (UE) no 1302/2014 de la Commission et le règlement
    (UE) no 1303/2014 de la Commission aux voitures intermédiaires IÉ-RU classe
    22000 ICDMU «B2» [notifiée sous le numéro C(2022) 3365] (Les textes en langues
    anglaise et irlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
