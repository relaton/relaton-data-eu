    Genehmigung eines Antrags Irlands gemäß Artikel 7 Absatz 4 der Richtlinie (EU)
    2016/797 des Europäischen Parlaments und des Rates, die Verordnung (EU) Nr. 1302/2014
    der Kommission und die Verordnung (EU) Nr. 1303/2014 der Kommission nicht auf
    IÉ-RU Klasse 22000 ICDMU — „B2“-Mittelwagen anzuwenden (Bekannt gegeben
    unter Aktenzeichen C(2022) 3365) (Nur der englische und der irische Text sind
    verbindlich)
