title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2774/78 of 28 November 1978 re-establishing
    the levying of customs duties on plaiting materials bound together in parallel
    strands or woven in sheet form, including matting, mats and screens; straw envelopes
    for bottles, falling within heading No ex 46.02, originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2774/78 de la Commission, du 28 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux matières
    à tresser, tissées à plat ou parallélisées, y compris les nattes de Chine,
    les paillassons grossiers et les claies ; paillons pour bouteilles, de la position
    tarifaire ex 46.02, originaires des pays et territoires en voie de développement
    bénéficiaires de préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2774/78 der Kommission vom 28. November 1978 zur Wiedereinführung
    des Zollsatzes fúr Flechtstoffe, in Fláchenform verwebt oder parallel aneinandergefúgt,
    einschließlich Chinamatten, grobe Strohmatten und Gittergeflechte; Flaschenhúlsen
    aus Stroh, der Tarifnummer ex 46.02, mit Ursprung in Entwicklungslándern, denen
    die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2774/78 af 28. november 1978 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i pladeform, sammenbundne
    eller vævede (herunder måtter, tæpper og skærme); flaskehylstre, under position
    ex 46.02, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2774/78 della Commissione, del 28 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai materiali da intreccio
    tessuti o parallelizzati, comprese le stuoie di Cina, le stuoie grossolane ed
    i graticci; impagliature per l' imballaggio di bottiglie, della voce doganale
    ex 46.02, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2774/78 van de Commissie van 28 november 1978 houdende
    wederinstelling van de heffing van de douanerechten voor vlechtstoffen, vlak geweven
    of samengebonden, Chinamatten, grove stromatten en horden daaronder begrepen ;
    strohulzen voor flessen, van post ex 46.02, van oorsprong, uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties
    werden geopend
