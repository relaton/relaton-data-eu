id: EUDecision19806
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 November 1979 authorizing Ireland not to apply
    Community treatment to women's, girls'and infants'(other than babies') woven and
    knitted or crocheted dresses, of wool, of cotton or of man-made textile fibres,
    falling within subheadings ex 60.05 A II and ex 61.02 B of the Common Customs
    Tariff (NIMEXE codes 60.05-41, 42, 43, 44; 61.02-48, 52, 53, 54) (category 26),
    originating in the Philippines and in free circulation in the other Member States
    (Only the English text is authentic)
  type: main
- language: fr
  script: Latn
  content: 'Décision de la Commission, du 29 novembre 1979, autorisant l''Irlande
    à exclure du traitement communautaire les robes tissées et robes de bonneterie,
    pour femmes, fillettes et jeunes enfants (autres que bébés), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles, des sous-positions ex 60.05
    A II et ex 61.02 B du tarif douanier commun (codes Nimexe: 60.05-41, 42, 43, 44;
    61.02-48, 52, 53, 54) (catégorie 26), originaires des Philippines et mises en
    libre pratique dans les autres Etats membres (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. November 1979, mit der Irland ermächtigt
    wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Kleider aus Geweben und aus Gewirken, für Frauen, Mädchen
    und Kleinkinder (ausgenommen Säuglinge), aus Wolle, Baumwolle oder aus synthetischen
    oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05 A II und ex 61.02 B
    des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-41, 42, 43, 44 ; 61.02-48,
    52, 53, 54) (Kategorie 26) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der englische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 29. november 1979 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage
    til kvinder, piger og småbørn (undtagen spædbørn), af uld, bomuld eller kemofibre,
    som henhører under pos. ex 60.05 A II og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-41, 42, 43, 44; 61.02-48, 52, 53, 54; kategori 26), har oprindelse i Filippinerne
    og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 29 novembre 1979, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario abiti interi tessuti ed a maglia, per
    donna, per ragazza e per bambini, diversi dai bambini piccoli (bébés), di lana,
    di cotone o di fibre tessili sintetiche o artificiali, delle sottovoci ex 60.05
    A II e ex 61.02 B della tariffa doganale comune (codici Nimexe : 60.05-41, 42,
    43, 44 ; 61.02-48, 52, 53, 54), categoria 26, originari delle Filippine e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 november 1979 waarbij Ierland wordt
    gemachtigd japonnen voor dames, meisjes en kinderen (andere dan die voor baby's),
    geweven en van brei- of haakwerk, van wol, van katoen of van synthetische of kunstmatige
    vezels, van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 60.05-41, 42, 43, 44; 61.02- 48, 52, 53, 54) (categorie 26), van
    oorsprong uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)
  type: main
