id: EURegulation10341972
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1034/72 de la Commission du 18 mai 1972 portant rétablissement
    de la perception des droits du tarif douanier commun applicables aux vêtements
    de dessus, accessoires du vêtement et autres articles de bonneterie non élastique
    ni caoutchoutée des sous- positions tarifaires 60.05 à EX II et EX B, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2797/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1034/72 der Kommission vom 18. Mai 1972 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberbekleidung,
    Bekleidungszubehör und andere Wirkwaren, weder gummielastisch noch kautschutiert,
    der Tarifstellen 60.05 A ex II und ex B. mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2797/71 des Rates vom 20. Dezember 1971
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1034/72 della Commissione, del 18 maggio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni, accessori di abbigliamento ed altri manufatti, a maglia non
    elastica né gommata, delle sottovoci doganali nn. 60.05 A ex II ed ex B, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2797/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1034/72 van de Commissie van 18 mei 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bovenkleding, kledingtoebehoren en andere artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk van onderverdelingen 60.05 A ex II en
    ex B van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2797/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend
  type: main
