    prescripțiile tehnice uniforme privind aplicațiile telematice pentru transportul
    de marfă, precum și privind revizuirea ATMF în ceea ce privește entitățile
    responsabile cu mentenanța
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/935 z 3. júna 2021 o pozícii, ktorá sa má
    v mene Európskej únie zaujať na 13. zasadnutí Výboru znalcov pre technické
    otázky Medzivládnej organizácie pre medzinárodnú železničnú prepravu,
    pokiaľ ide o prijatie zmien jednotných technických predpisov o rušňoch a
    osobných železničných koľajových vozidlách, o nákladných vozňoch, o
    prístupnosti železničného systému pre osoby so zdravotným postihnutím a
    osoby so zníženou pohyblivosťou, prijatie jednotných technických predpisov,
    ktoré sa vzťahujú na zostavu vlaku a kontroly kompatibility s traťou a na
    subsystém „infraštruktúra“, aktualizáciu odkazov na technické dokumenty
    uvedené v dodatku I k jednotnému technickému predpisu o telematických aplikáciách
    v nákladnej doprave a revíziu ATMF s ohľadom na subjekty zodpovedné za údržbu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/935 z dne 3. junija 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 13. zasedanju Odbora strokovnjakov za tehnična vprašanja
    Medvladne organizacije za mednarodni železniški promet glede sprejetja sprememb
    enotnega tehničnega predpisa za lokomotive in potniška tirna vozila, tovorne
    vagone ter dostopnosti železniškega sistema za invalide in osebe z zmanjšano
    mobilnostjo, sprejetja enotnega tehničnega predpisa, ki se uporablja za vlakovne
    kompozicije in preverjanja združljivosti s progo, ter za podsistem „infrastruktura“,
    posodobitve sklicev na tehnične dokumente iz Dodatka I k enotnemu tehničnemu
    predpisu v zvezi z telematskimi aplikacijami za tovorni promet, ter glede revizije
    ATMF v zvezi s subjekti, zadolženimi za vzdrževanje
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/935 del Consejo de 3 de junio de 2021 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en la 13.a reunión
    de la Comisión de Expertos Técnicos de la Organización Intergubernamental para
    los Transportes Internacionales por Ferrocarril para la adopción de modificaciones
    de las prescripciónes técnicas uniformes relativas a locomotoras y material
    rodante de viajeros, vagones de mercancías, accesibilidad del sistema ferroviario
    para personas con discapacidad y personas de movilidad reducida, la adopción
    de las prescripciónes técnicas uniformes aplicables a la composición de trenes
    y la comprobación de la compatibilidad de las rutas y al subsistema de infraestructura,
    la actualización de referencias a los documentos técnicos contemplados en el
    apéndice I de la prescripción técnica uniforme sobre las Aplicaciones Telemáticas
    para el Transporte de Mercancías, y la revisión de las ATMF con respecto a las
    entidades encargadas del mantenimiento
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/935 av den 3 juni 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar vid det 13:e mötet i kommittén för
    tekniska experter vid Mellanstatliga organisationen för internationell järnvägstrafik
    vad gäller antagandet av ändringar av enhetliga tekniska föreskrifter för
    lok och passagerarfordon, rullande materiel i form av godsvagnar, järnvägssystemets
    tillgänglighet för personer med funktionsnedsättningar och personer med nedsatt
    rörlighet, antagandet av enhetliga tekniska föreskrifter som är tillämpliga
    på kontroller av tågsammansättning och ruttkompatibilitet och på delsystemet
    Infrastruktur, uppdateringen av hänvisningarna till de tekniska dokument som
    avses i tillägg I till den enhetliga tekniska föreskriften om telematikapplikationer
    för godstrafik, och revideringen av ATMF med avseende på enheter som ansvarar
    för underhåll
  type: main
