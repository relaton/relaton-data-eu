id: EUDecision1975469
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 May 1975 authorizing the Republic of France not
    to apply Community treatment to knitted or crocheted goods of textiles other than
    cotton, falling within heading Nos ex 60.02, ex 60.04 and ex 60.05 of the Common
    Customs Tariff, originating in Hong Kong and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '75/469/CEE: Décision de la Commission, du 14 mai 1975, autorisant la
    République française à exclure du traitement communautaire les articles de
    bonneterie en matières textiles autres que le coton, des positions Ex 60.02,
    Ex 60.04 et Ex 60.05 du Tarif douanier commun, originaires de Hong-Kong et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Mai 1975, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Wirkwaren aus anderen Spinnstoffen als Baumwolle
    der Tarifnummer ex 60.02, ex 60.04 und ex 60.05 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. maj 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage trikotagevarer af andre tekstilmaterialer
    end bomuld som henhører under position ex 60.02, ex 60.04 og ex 60.05 i den fælles
    toldtarif, har oprindelse i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 maggio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli articoli di maglieria in
    materie tessili diverse dal cotone delle voci ex 60.02, ex 60.04 ed ex 60.05 della
    tariffa doganale comune, originari di Hong Kong e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 mei 1975 waarbij de Franse Republiek
    wordt gemachtigd geconfectioneerde artikelen uit textielstoffen andere dan van
    katoen van posten ex 60.02, ex 60.04 en ex 60.05 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
