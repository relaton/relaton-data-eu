id: EURegulation18391976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1839/76 of 28 July 1976 re-establishing
    the levying of customs duties on electronic calculating machines, falling within
    subheading 84.52 A, originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1839/76 de la Commission, du 28 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à calculer électroniques, de la sous-position tarifaire 84.52 A, originaires
    de Singapour bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1839/76 der Kommission vom 28. Juli 1976 zur Wiedereinführung
    des Zollsatzes für elektronische Rechenmaschinen der Tarifstelle 84.52 A, mit
    Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom
    17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1839/76 af 28. juli 1976 om genindførelse
    af opkrævning af toldafgifter for elektroniske regnemaskiner under underposition
    84.52 A, som har oprindelse i Singapore og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1839/76 della Commissione, del 28 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine calcolatrici
    elettroniche della sottovoce doganale 84.52 A originarie di Singapore beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1839/76 van de Commissie van 28 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op elektronische
    rekenmachines, van onderverdeling 84.52 A, van oorsprong uit Singapore, ten behoeve
    waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene
    tariefpreferenties werden geopend
  type: main
