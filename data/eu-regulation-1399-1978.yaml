    Hóchstquote
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1399/78 af 20. juni 1978 om fastsættelse
    for sukkerproduktionsåret 1978/1979 af de afledte interventionspriser, interventionsprisen
    for roeråsukker, minimumspriserne for sukkerroer, tærskelpriserne, maksimumsbeløbet
    for produktionsafgiften og refusionsbeløbet til udligning af lageromkostninger,
    samt om fastsættelse af beregningskoefficienten for den særlige maksimumskvota
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1399/78 del Consiglio, del 20 giugno 1978, che fissa,
    per la campagna saccarifera 1978/1979, i prezzi d' intervento derivati, il prezzo
    d' intervento per lo zucchero greggio di barbabietola, i prezzi minimi della barbabietola,
    i prezzi d' entrata, l' importo massimo del contributo gravante sulla produzione
