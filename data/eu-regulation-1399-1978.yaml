  content: Council Regulation (EEC) No 1399/78 of 20 June 1978 fixing, for the 1978/79
    sugar year, the derived intervention prices, the intervention price for raw beet
    sugar, the minimum prices for beet, the threshold prices, the maximum amount of
    the production levy and the amount of the repayment to offset storage costs, and
    fixing the coefficient for calculating the special maximum quota
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1399/78 du Conseil, du 20 juin 1978, fixant, pour
    la campagne sucrière 1978/1979, les prix d' intervention dérivés, le prix d'
    intervention pour le sucre de betterave brut, les prix minimaux de la betterave,
    les prix de seuil, le montant maximal de la cotisation à la production et le
    montant du remboursement pour la compensation des frais de stockage et fixant
    le coefficient de calcul du quota maximal spécial
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1399/78 des Rates vom 20. Juni 1978 zur Festsetzung
