  content: '81/890/EEC: Council Decision of 3 November 1981 authorizing the Italian
    Republic to derogate temporarily from the value added tax arrangements in the
    context of aid to earthquake victims in southern Italy'
  type: main
- language: fr
  script: Latn
  content: '81/890/CEE: Décision du Conseil, du 3 novembre 1981, autorisant la République
    italienne à déroger transitoirement au régime de la taxe sur la valeur ajoutée
    dans le cadre des aides en faveur des victimes des tremblements de terre dans
    le sud de l'' Italie'
  type: main
- language: de
  script: Latn
  content: '81/890/EWG: Entscheidung des Rates vom 3. November 1981 zur Ermächtigung
    der Italienischen Republik, im Rahmen der Hilfe zugunsten der Erdbebenopfer in
    Süditalien vorübergehend von der Mehrwertsteuerregelung abzuweichen'
  type: main
- language: da
  script: Latn
  content: '81/890/EØF: Rådets beslutning af 3. november 1981 om bemyndigelse til
    Den italienske Republik til midlertidig at undtage bistanden til den jordskælvsramte
    befolkning i Syditalien fra bestemmelserne om merværdiafgift'
  type: main
