title:
- language: en
  script: Latn
  content: '2013/301/EU: Commission Implementing Decision of 11 June 2013 amending
    Implementing Decision 2012/715/EU establishing a list of third countries with
    a regulatory framework applicable to active substances for medicinal products
    for human use and the respective control and enforcement activities ensuring a
    level of protection of public health equivalent to that in the Union'
  type: main
- language: fr
  script: Latn
  content: '2013/301/UE: Décision d’exécution de la Commission du 11 juin 2013
    modifiant la décision d’exécution 2012/715/UE établissant une liste de pays
    tiers dont le cadre réglementaire applicable aux substances actives destinées
    aux médicaments à usage humain ainsi que les activités de contrôle et d’exécution
    respectives garantissent un niveau de protection de la santé publique équivalent
    à celui apporté par l’Union'
  type: main
- language: de
  script: Latn
  content: '2013/301/EU: Durchführungsbeschluss der Kommission vom 11. Juni 2013
    zur Änderung des Durchführungsbeschlusses 2012/715/EU zur Festlegung einer Liste
    von Drittländern mit einem Rechtsrahmen für Wirkstoffe von Humanarzneimitteln
    und den entsprechenden Kontroll- und Durchsetzungsmaßnahmen zur Sicherstellung
    eines dem der EU gleichwertigen Gesundheitsschutzniveaus'
  type: main
- language: bg
  script: Cyrl
  content: '2013/301/ЕС: Решение за изпълнение на Комисията
