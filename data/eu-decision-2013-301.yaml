    изпълнение 2012/715/ЕС за установяване на списък
    на третите държави, чиято регулаторна рамка,
    приложима за активните вещества за лекарствените
    продукти за хуманна употреба, и чиито съответни
    дейности за контрол и прилагане на законодателството
    гарантират равнище на опазване на общественото
    здраве, равностойно на това в Съюза'
  type: main
- language: cs
  script: Latn
  content: '2013/301/EU: Prováděcí rozhodnutí Komise ze dne 11. června 2013 ,
    kterým se mění prováděcí rozhodnutí 2012/715/EU, kterým se zřizuje seznam
    třetích zemí, jejichž právní rámec pro účinné látky pro humánní léčivé
    přípravky a příslušné kontrolní činnosti a činnosti pro vymáhání práva
    zajišťují úroveň ochrany veřejného zdraví rovnocennou úrovni této ochrany
    v Unii'
  type: main
- language: da
  script: Latn
