    over tredjelande med en gældende lovgivningsramme vedrørende virksomme stoffer
    til humanmedicinske lægemidler og de respektive kontrol- og håndhævelsesaktiviteter,
    som sikrer et beskyttelsesniveau af folkesundheden, der svarer til Unionens'
  type: main
- language: el
