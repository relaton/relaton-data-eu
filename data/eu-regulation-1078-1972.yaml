title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1078/72 de la Commission, du 25 mai 1972, fixant dans
    le secteur des marchandises relevant du règlement (CEE) n° 1059/69 la date de
    la prise d'effet des montants compensatoires fixés par le règlement (CEE) n°
    979/72
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1078/72 der Kommission vom 25. Mai 1972 zur Festsetzung
    des Datums, ab welchem die neuen, durch die Verordnung (EWG) Nr. 979/72 festgelegten
    Ausgleichsbeträge auf dem Warensektor, der unter die Verordnung (EWG) Nr. 1059/69
    fällt, anzuwenden sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1078/72 della Commissione, del 25 maggio 1972, che
    fissa la data a decorrere dalla quale saranno applicati i nuovi importi compensativi
    determinati nel regolamento (CEE) n. 979/72 nel settore delle merci di cui al
    regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1078/72 van de Commissie van 25 mei 1972 houdende
    vaststelling van de datum van inwerkingtreding van de compenserende bedragen in
    de sector goederen, vallend onder Verordening (EEG) nr. 1059/69, vastgesteld bij
    Verordening (EEG) nr. 979/72
  type: main
