  script: Latn
  content: '2008/982/EC: Commission Decision of 8 December 2008 authorising the United
    Kingdom to conclude an agreement with the Bailiwick of Jersey, the Bailiwick of
    Guernsey and the Isle of Man for transfers of funds between the United Kingdom
    and each of these territories to be treated as transfers of funds within the United
    Kingdom, pursuant to Regulation (EC) No 1781/2006 of the European Parliament and
    of the Council (notified under document number C(2008) 7812)'
  type: main
- language: fr
  script: Latn
  content: '2008/982/CE: Décision de la Commission du 8 décembre 2008 autorisant
