title:
- language: en
  script: Latn
  content: '88/517/EEC: Commission Decision of 29 September 1988 amending for the
    third time Decision 87/361/EEC recognizing certain parts of the territory of the
    French Republic as being officially swine-fever free (Only the French text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/517/CEE: Décision de la Commission du 29 septembre 1988 portant troisième
    modification de la décision 87/361/CEE de la Commission reconnaissant certaines
    parties du territoire de la République française comme officiellement indemnes
    de peste porcine (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/517/EWG: Entscheidung der Kommission vom 29. September 1988 zur dritten
    Änderung der Entscheidung 87/361/EWG der Kommission, durch die bestimmte Teile
    des Hoheitsgebiets der Französischen Republik amtlich als schweinepestfrei anerkannt
    werden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/517/EØF: Kommissionens beslutning af 29. september 1988 om ændring
