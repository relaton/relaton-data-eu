title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1983/72 of the Commission of 15 September 1972 amplifying
    Regulation (EEC) No 2588/69 establishing the list of airline companies exempt
    from providing the guarantee required within the framework of the Community transit
    system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1983/72 de la Commission, du 15 septembre 1972, complétant
    le règlement (CEE) n° 2588/69, portant établissement de la liste des compagnies
    aériennes auxquelles s' applique la dispense de garantie dans le cadre du régime
    du transit communautaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1983/72 der Kommission vom 15. September 1972 zur
    Ergänzung der Verordnung (EWG) Nr. 2588/69 über die Aufstellung der Liste der
    Luftfahrtgesellschaften, die im Rahmen des gemeinschaftlichen Versandverfahrens
    von der Sicherheitsleistung befreit sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1983/72 af 15. september 1972 om tilføjelse
    til forordning (EØF) nr. 2588/69 om udarbejdelse af listen over de luftfartsselskaber,
    der er fritaget for at stille sikkerhed inden for rammerne af ordningen for fællesskabsforsendelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1983/72 della Commissione, del 15 settembre 1972,
    che completa il regolamento (CEE) n. 2588/69 che stabilisce l' elenco delle compagnie
    aeree alle quali si applica l' esonero della garanzia nel quadro del regime del
    transito comunitario
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1983/72 van de Commissie van 15 september 1972 tot
    aanvulling van Verordening (EEG) nr. 2588/69 waarbij de lijst wordt opgesteld
    van de luchtvaartmaatschappijen waarop de vrijstelling van zekerheid in het kader
    van de regeling voor communautair douanevervoer van toepassing is
