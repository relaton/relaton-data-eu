title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 juillet 1962 adressée aux États membres
    instituant des méthodes de coopération administrative spéciales pour l'application
    des prélèvements intracommunautaires institués dans le cadre de la politique
    agricole
  type: main
- language: de
  script: Latn
  content: An die Mitgliedstaaten gerichtete Entscheidung der Kommission über die
    besonderen Methoden der Zusammenarbeit der Verwaltungen für die Anwendung der
    innergemeinschaftlichen Abschöpfung, die durch die Verordnungen des Rats über
    die schrittweise Errichtung gemeinsamer Marktorganisationen auf bestimmten Landwirtschaftssektoren
    vorgesehen worden sind (Anwendung der Artikel 10 Absatz (2) erster Unterabsatz
    und 38 Absatz (2) EWG)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa ai metodi speciali di cooperazione
    amministrativa per l'applicazione dei prelievi intracomunitari istituiti nell'ambito
    della politica agricola comune
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie tot invoering van bijzondere methoden van
    administratieve samenwerking inzake de toepassing van de in het kader van het
    gemeenschappelijk landbouwbeleid ingestelde intracommunautaire heffingen
  type: main
