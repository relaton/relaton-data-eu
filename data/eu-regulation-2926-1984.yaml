title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2926/84 of 18 October 1984 authorizing the
    Federal Republic of Germany, France, the United Kingdom and Luxembourg to permit
    under certain conditions an additional increase in the alcoholic strength of certain
    wines and certain products intended for wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2926/84 de la Commission du 18 octobre 1984 autorisant
    la République fédérale d'Allemagne, la France, le Royaume-Uni et le Luxembourg
    à permettre, sous certaines conditions, une augmentation supplémentaire du titre
    alcoométrique de certains vins et de certains produits destinés à l'élaboration
    des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2926/84 der Kommission vom 18. Oktober 1984 zur Ermächtigung
    der Bundesrepublik Deutschland, Frankreichs, des Vereinigten Königreichs und
    Luxemburgs, unter bestimmten Voraussetzungen eine zusätzliche Erhöhung des Alkoholgehalts
    bestimmter Weine und bestimmter zur Weinherstellung vorgesehener Erzeugnisse zu
    gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2926/84 af 18. oktober 1984 om bemyndigelse
    til Forbundsrepublikken Tyskland, Frankrig, Det forenede Kongerige og Luxembourg
    til under visse omstændigheder at tillade en yderligere forhøjelse af alkoholindholdet
    i visse vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2926/84 της Επιτροπής
    της 18ης Οκτωβρίου 1984 που εξουσιοδοτεί την Ομοσπονδιακή
    Δημοκρατία της Γερμανίας, τη Γαλλία, το Ηνωμένο
    Βασίλειο και το Λουξεμβούργο να επιτρέψουν,
    υπό ορισμένους όρους, μία συμπληρωματική αύξηση
    του αλκοολικού τίτλου ορισμένων οίνων και
    ορισμένων προϊόντων που προορίζονται για την
    παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2926/84 della Commissione del 18 ottobre 1984 che
    autorizza la Repubblica federale di Germania, la Francia, il Regno Unito e il
    Lussemburgo a permettere in determinate condizioni un aumento supplementare della
    gradazione alcolometrica di alcuni vini e di taluni prodotti destinati all' elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2926/84 van de Commissie van 18 oktober 1984 waarbij
    de Bondsrepubliek Duitsland, Frankrijk, het Verenigd Koninkrijk en Luxemburg gemachtigd
    worden om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte van
    bepaalde wijnen en van bepaalde voor de bereiding van wijn bestemde produkten
    toe te staan
  type: main
