id: EUDecision1976745
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 December 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to drawn or blown glass, falling within heading No ex 70.05
    of the Common Customs Tariff, originating in the USSR and in free circulation
    in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/745/CEE: Décision de la Commission, du 26 décembre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit verre
    à vitres, de la position Ex 70.05 du Tarif douanier commun, originaire d''URSS
    et mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. Dezember 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der UdSSR stammendes und in der Bundesrepublik Deutschland im freien
    Verkehr befindliches gezogenes oder geblasenes Flachglas, sogenanntes ,,Tafelglas"
    der Tarifnummer ex 70.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. december 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage planglas, trukket eller blæst, som henhører under pos. ex 70.05 i
    den fælles toldtarif, har oprindelse i USSR og frit kan omsættes i Forbundsrepublikken
    Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 dicembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi, ad escludere
    dal trattamento comunitario il vetro tirato o soffiato detto «vetro per vetrate»
    della voce ex 70.05 della tariffa doganale comune, originario dell'URSS e messo
    in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 december 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd getrokken of geblazen glas (z.g. vensterglas) van post ex 70.05 van
    het gemeenschappelijk douanetarief, van oorsprong uit de U.S.S.R. en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
