title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 651/87 of 4 March 1987 re-establishing the
    levying of customs duties on stockings, knickers, panty-hose, understockings,
    socks, ankle-socks, sockettes and the like, products of category No 12 (NIMEXE
    code 40.01.20) originating in Sri Lanka to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 651/87 de la Commission du 4 mars 1987 portant rétablissement
    de la perception des droits de douane applicables aux bas-culottes, et collants,
    sous-bas, chaussettes, socquettes, protège-bas ou articles similaires de la catégorie
    de produits n° 12 (code 40.0120) originaires de Sri Lanka, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 651/87 der Kommission vom 4. März 1987 zur Wiedereinführung
    des Zollsatzes für Strumpfhosen, Unterziehstrümpfe, Socken, Söckchen, Strumpfschoner
    und ähnliche Wirkwaren der Warenkategorie Nr. 12 (Kennziffer 40.0120) mit Ursprung
    in Sri Lanka, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 651/87 af 4. marts 1987 om genindførelse
    af opkrævning af toldafgifter for strømper, strømpebenklæder, understrømper,
    sokker, ankelsokker og lignende under varekategori nr. 12 (kode 40.0120), som
    har oprindelse i Sri Lanka og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3925/86
  type: main
