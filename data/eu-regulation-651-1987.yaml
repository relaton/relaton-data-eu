    n. 12 (codice 40.0120), originari dello Sri Lanka beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 651/87 van de Commissie van 4 maart 1987 houdende
