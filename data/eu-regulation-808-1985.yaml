title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 808/85 of 27 March 1985 re-establishing
    the levying of customs duties applicable to alginic acid and its salts and esters
    falling within subheading 39.06 A, originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 808/85 de la Commission du 27 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à l' acide alginique, ses sels
    et ses esters, de la sous-position 39.06 A du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 808/85 der Kommission vom 27. März 1985 zur Wiedereinführung
    der Erhebung der Zölle für Alginsäure, ihre Salze und Ester, der Tarifstelle
    39.06 A mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 808/85 af 27. marts 1985 om genindførelse
    af opkrævning af told for alginsyre samt salte og estere deraf, henhørende under
    pos. 39.06 A og med oprindelse i Kina, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 808/85 της Επιτροπής
    της 27ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για το αλγινικό οξύ, άλατα
    και εστέρες αυτού, της διακρίσεως 39.06 Α του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 808/85 della Commissione del 27 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili all' acido alginico, suoi sali e
    suoi esteri, della sottovoce 39.06 A della tariffa doganale comune, originario
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 808/85 van de Commissie van 27 maart 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op alginezuren,
    alsmede zouten en ersters daarvan, van postonderverdeling 39.06 A, van oorsprong
    uit China, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
