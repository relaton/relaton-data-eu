title:
- language: en
  script: Latn
  content: '80/729/EEC: Commission Decision of 15 July 1980 authorizing Ireland to
    store outside its territory during the third quarter of 1980 beef products held
    by its intervention agency (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/729/CEE: Décision de la Commission, du 15 juillet 1980, autorisant
    l''Irlande à stocker hors de son territoire pendant le troisième trimestre 1980,
    des produits du secteur de la viande bovine détenus par son organisme d''intervention
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/729/EWG: Entscheidung der Kommission vom 15. Juli 1980 zur Ermächtigung
    Irlands, während des dritten Vierteljahres 1980 Erzeugnisse des Rindfleischsektors
    im Besitz seiner Interventionsstelle außerhalb seines Hoheitsgebiets zu lagern
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/729/EØF: Kommissionens beslutning af 15. juli 1980 om bemyndigelse
    af Irland til i tredje kvartal 1980 uden for sit område at oplagre produkter
    fra oksekødsektoren, som dets interventionsorgan ligger inde med (Kun den engelske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/729/CEE: Decisione della Commissione, del 15 luglio 1980, che autorizza
    l''Irlanda ad immagazzinare nel terzo trimestre 1980 fuori del proprio territorio
    prodotti del settore delle carni bovine detenuti dall''organismo d''intervento
    irlandese (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/729/EEG: Beschikking van de Commissie van 15 juli 1980 waarbij Ierland
    wordt gemachtigd om produkten van de sector rundvlees die in het bezit zijn van
    het Ierse interventiebureau, gedurende het derde kwartaal 1980 buiten zijn grondgebied
    op te slaan (Slechts de tekst in de Engelse taal is authentiek)'
