title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 796/77 of 19 April 1977 re-establishing
    the levying of the customs duties on other mineral or chemical fertilizers, nitrogenous,
    falling within subheading 31.02 C, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 796/77 de la Commission, du 19 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres engrais
    minéraux ou chimiques azotés, de la sous-position tarifaire 31.02 C, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 796/77 der Kommission vom 19. April 1977 zur Wiedereinführung
    des Zollsatzes für andere mineralische oder chemische Stickstoffdüngemittel
    der Tarifstelle 31.02 C, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 796/77 af 19. april 1977 om genindførelse
    af opkrævning af toldafgifter for andre nitrogenholdige gødningsstoffer, mineralske
    eller kemiske, under underposition 31.02 C, som har oprindelse i Jugoslavien og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 796/77 della Commissione, del 19 aprile 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli altri concimi minerali
    o chimici azotati, della sottovoce doganale 31.02 C, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 796/77 van de Commissie van 19 april 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere minerale
    of chemische stikstofhoudende meststoffen, van post 31.02 C, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
