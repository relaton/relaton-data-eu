title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3838/92 of 28 December 1992 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the supplementary
    trade mechanism to the live plants and floriculture products listed in Annex XXII
    to the Act of Accession and imported into Portugal concerning the target ceilings
    for the year 1993
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3838/92 de la Commission, du 28 décembre 1992, modifiant
    le règlement (CEE) n° 643/86 déterminant les modalités d' application du mécanisme
    complémentaire aux échanges pour les produits du secteur des plantes vivantes
    et de la floriculture importés au Portugal visées à l' annexe XXII de l' acte
    d' adhésion en ce qui concerne les plafonds indicatifs pour l' année 1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3838/92 der Kommission vom 28. Dezember 1992 zur Änderung
    der Verordnung (EWG) Nr. 643/86 mit Durchführungsbestimmungen zum ergänzenden
    Handelsmechanismus für die in Anhang XXII der Beitrittsakte aufgeführten, nach
    Portugal eingeführten Erzeugnisse des Sektors lebende Pflanzen und Waren des
    Blumenhandels betreffend die Richtplafonds für das Jahr 1993
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3838/92 af 28. december 1992 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal, som omhandlet i bilag XXII til tiltrædelsesakten vedrørende
    de vejledende lofter for 1993
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3838/92 της Επιτροπής
    της 28ης Δεκεμβρίου 1992 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία που αναφέρονται στο παράρτημα
