    indicativos para el año 1993
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 3838/92 av den 28 december 1992 om ändring
    av förordning (EEG) nr 643/86 om tillämpningsföreskrifter för den kompletterande
    handelsmekanismen beträffande levande växter och blomsterprodukter som är förtecknade
