title:
- language: fr
  script: Latn
  content: Décision 66/290/CEE de la Commission, du 2 mai 1966, autorisant le Royaume
    de Belgique et le Grand-Duché de Luxembourg à suspendre partiellement à l'égard
    des pays tiers leurs droits de douane applicables à l'importation de certaines
    viandes bovines congelées destinées, sous contrôle douanier à la transformation
  type: main
- language: de
  script: Latn
  content: '66/290/EWG: Entscheidung der Kommission vom 2. Mai 1966 zur Ermächtigung
    an das Königreich Belgien und an das Großherzogtum Luxemburg, die bei der Einfuhr
    einiger zur Verarbeitung unter Zollaufsicht bestimmter Arten von gefrorenem Rindfleisch
    erhobenen Zollsätze gegenüber dritten Ländern teilweise auszusetzen'
  type: main
- language: it
  script: Latn
  content: '66/290/CEE: Decisione della Commissione, del 2 maggio 1966, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo a sospendere parzialmente,
    nei confronti dei paesi terzi, i rispettivi dazi doganali sull''importazione di
    determinate carni bovine congelate destinate alla trasformazione sotto controllo
    doganale'
  type: main
- language: nl
  script: Latn
  content: '66/290/EEG: Beschikking van de Commissie van 2 mei 1966 waarbij het Koninkrijk
    België en het Groothertogdom Luxemburg worden gemachtigd hun douanerechten ten
    opzichte van derde landen bij de invoer van bepaalde soorten bevroren rundvlees,
    bestemd voor verwerking onder douanetoezicht, gedeeltelijk te schorsen'
  type: main
