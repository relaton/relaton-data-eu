title:
- language: en
  script: Latn
  content: '82/141/EEC: Commission Decision of 5 February 1982 establishing that the
    apparatus described as ''Tracor digital signal analyzer, model TN-1500-8, with
    accessories'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/141/CEE: Décision de la Commission, du 5 février 1982, constatant
    que l''importation de l''appareil dénommé "Tracor-Digital Signal Analyzer, model
    TN-1500-8, with accessories" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/141/EWG: Entscheidung der Kommission vom 5. Februar 1982, mit der festgestellt
    wird, daß das Gerät ,,TRACOR- Digital Signal Analyzer, model TN-1500-8, with
    accessories" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/141/EØF: Kommissionens beslutning af 5. februar 1982 om fastslåelse
    af, at indførsel af apparatet "TRACOR- Digital Signal Analyzer, model TN-1500-8,
    with accessories" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/141/EOK: Απόφαση τής Επιτροπής τής 5ης Φεβρουαρίου
