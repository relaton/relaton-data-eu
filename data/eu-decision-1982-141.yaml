    model TN- 1500-8, with accessories" non può avvenire in franchigia dai dazi della
    tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/141/EEG: Beschikking van de Commissie van 5 februari 1982 waarbij wordt
