    μέ τήν ονομασία «Tracor digital signal analyzer, model TN- 1500-8,
    with accessories» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/141/CEE: Decisione della Commissione, del 5 febbraio 1982, che stabilisce
