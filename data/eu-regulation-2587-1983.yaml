  content: Commission Regulation (EEC) No 2587/83 of 14 September 1983 fixing the
    quantities of frozen beef intended for processing which may be imported on special
    conditions for the fourth quarter of 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2587/83 de la Commission, du 14 septembre 1983, fixant
    les quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour le quatrième trimestre de
    1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2587/83 der Kommission vom 14. September 1983 zur
    Festsetzung der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die
    für das vierte Vierteljahr 1983 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2587/83 af 14. september 1983 om fastsættelse
