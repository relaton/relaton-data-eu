    οποίες προορίζονται για μεταποίηση και είναι
    δυνατόν να εισαχθούν υπό ειδικούς όρους για
    το τέταρτο τρίμηνο του 1983
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2587/83 della Commissione, del 14 settembre 1983,
