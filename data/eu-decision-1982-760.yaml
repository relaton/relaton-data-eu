    en application de l''article 13 paragraphe 2 du règlement (CEE, Euratom, CECA)
    n° 2892/77 concernant les ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue danoise est le seul faisant foi.)'
