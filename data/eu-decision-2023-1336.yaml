    Belgium és Luxemburg által az 549/2004/EK európai parlamenti és tanácsi rendelettel
    összhangban meghozandó korrekciós intézkedésekről (az értesítés a C(2023)
    3852. számú dokumentummal történt) (Csak a holland és a francia nyelvű szöveg
    hiteles)
  type: main
