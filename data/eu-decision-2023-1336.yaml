    uz noteiktiem darbības mērķiem trešajam pārskata periodam saskaņā ar Eiropas
    Parlamenta un Padomes Regulu (EK) Nr. 549/2004 (izziņots ar dokumenta numuru
    C(2023) 3852) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
