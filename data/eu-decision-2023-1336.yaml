title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1336 of 16 June 2023 on corrective
    measures to be taken by Belgium and Luxembourg regarding certain performance targets
    for the third reference period in accordance with Regulation (EC) No 549/2004
    of the European Parliament and of the Council (notified under document C(2023)3852)
    Only the Dutch and French texts are authentic
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1336 de la Commission du 16 juin 2023
    concernant les mesures correctrices à prendre par la Belgique et le Luxembourg
    relativement à certains objectifs de performance pour la troisième période
    de référence conformément au règlement (CE) no 549/2004 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2023) 3852] (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
