    performansi za treće referentno razdoblje u skladu s Uredbom (EZ) br. 549/2004
    Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2023) 3852)
    (Vjerodostojni su samo tekstovi na francuskom i nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
