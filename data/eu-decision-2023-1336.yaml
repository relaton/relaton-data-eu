    über die von Belgien und Luxemburg gemäß der Verordnung (EG) Nr. 549/2004 des
    Europäischen Parlaments und des Rates ergriffenen Behebungsmaßnahmen in Bezug
    auf bestimmte Leistungsziele des dritten Bezugszeitraums (Bekannt gegeben unter
    Aktenzeichen C(2023) 3852) (Nur der französische und der niederländische Text
    sind verbindlich)
  type: main
