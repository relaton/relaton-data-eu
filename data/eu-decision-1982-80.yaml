title:
- language: en
  script: Latn
  content: '82/80/EEC: Commission Decision of 23 December 1981 establishing that the
    apparatus described as ''Canberra Ge(Li) detector, model 7229, with cryostat,
    model 7500'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/80/CEE: Décision de la Commission, du 23 décembre 1981, constatant
    que l''importation de l''appareil dénommé "Canberra Ge(Li) detector, model 7229,
    with cryostat, model 7500" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/80/EWG: Entscheidung der Kommission vom 23. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,Canberra Ge(Li) detector, model 7229, with
    cryostat, model 7500" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/80/EØF: Kommissionens beslutning af 23. december 1981 om fastslåelse
    af, at indførsel af apparatet "Canberra- Ge(Li) detector, model 7229, with cryostat,
    model 7500" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/80/EOK: Απόφαση τής Επιτροπής τής 23ης Δεκεμβρίου
