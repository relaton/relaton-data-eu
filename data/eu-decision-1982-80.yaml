    μέ τήν ονομασία «Canberra Ge(Li) detector, model 7229, with cryostat,
    model 7500» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/80/CEE: Decisione della Commissione, del 23 dicembre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Canberra Ge(Li) detector, model
    7229, with cryostat, model 7500" non può avvenire in franchigia dai dazi della
    tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/80/EEG: Beschikking van de Commissie van 23 december 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Canberra Ge(Li) detector, model 7229, with
    cryostat, model 7500" niet met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
