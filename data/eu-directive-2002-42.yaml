title:
- language: en
  script: Latn
  content: Commission Directive 2002/42/EC of 17 May 2002 amending the Annexes to
    Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC as regards the fixing
    of maximum levels for pesticide residues (bentazone and pyridate) in and on cereals,
    foodstuffs of animal origin and certain products of plant origin, including fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/42/CE de la Commission du 17 mai 2002 modifiant les annexes
    des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil, en ce qui concerne
    la fixation de teneurs maximales pour les résidus de pesticides (bentazone et
    pyridate) sur et dans les céréales, les denrées alimentaires d'origine animale
    et certains produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/42/EG der Kommission vom 17. Mai 2002 zur Änderung der
    Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates hinsichtlich
    der Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    (Bentazon und Pyridat) auf und in Getreide, Lebensmitteln tierischen Ursprungs
    und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/42/ЕО на Комисията от 17 май
    2002 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определяне на максимални количества
    на остатъци от пестициди (бентазон и пиридат)
    във и върху зърнени култури, храни от животински
    произход и някои продукти от растителен произход,
    включително плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/42/ES ze dne 17. května 2002, kterou se mění přílohy
    směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud jde o stanovení maximálních
    limitů reziduí pesticidů (bentazonu a pyridátu) v obilovinách, v potravinách
    živočišného původu a v některých produktech rostlinného původu, včetně
    ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/42/EF af 17. maj 2002 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester (bentazon og pyridat)
    i og på korn, i og på levnedsmidler af animalsk oprindelse og på og i visse
    produkter af vegetabilsk oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/42/ΕΚ της Επιτροπής, της 17ης Μαΐου
    2002, για την τροποποίηση των παραρτημάτων των
    οδηγιών του Συμβουλίου 86/362/ΕΟΚ, 86/363/ΕΟΚ και
    90/642/ΕΟΚ όσον αφορά τον καθορισμό των ανωτάτων
    ορίων για τα υπολείμματα φυτοφαρμάκων (bentazone
    και pyridate) πάνω και μέσα στα σιτηρά, στα τρόφιμα
    ζωικής προέλευσης και σε ορισμένα προϊόντα
    φυτικής προέλευσης, συμπεριλαμβανομένων των
    οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/42/EÜ, 17. mai 2002, millega muudetakse nõukogu
    direktiivide 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ lisasid teraviljades, loomsetes
    toitudes ja teatud taimset päritolu saadustes, sealhulgas puu- ja köögiviljades
    ning nende pinnal esinevatele pestitsiidide bentasooni ja püridaadi jääkidele
    piirnormide kehtestamise osas
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/42/EY, annettu 17 päivänä toukokuuta 2002,
    neuvoston direktiivien 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden muuttamisesta
    viljoissa ja niiden pinnassa, eläinkunnasta peräisin olevissa elintarvikkeissa
    ja niiden pinnassa sekä tietyissä kasvikunnasta peräisin olevissa tuotteissa,
    mukaan luettuina hedelmät ja vihannekset, ja niiden pinnassa olevien torjunta-ainejäämien
    (bentatsoni ja pyridaatti) enimmäismäärien vahvistamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2002/42/EK irányelve (2002. május 17.) a gabonafélékben,
    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található (bentazon és piridát) peszticid-szermaradványok megengedett legmagasabb
    mértékének meghatározására tekintettel a 86/362/EGK, 86/363/EGK, illetőleg
    90/642/EGK tanácsi irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/42/CE della Commissione, del 17 maggio 2002, recante modifica
    degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    che fissano le quantità massime di residui di antiparassitari (bentazone e piridato)
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/42/EK (2002. gada 17. maijs), ar ko groza pielikumus
    Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK attiecībā uz pesticīdu
    (bentazona un piridāta) atliekvielu maksimāli pieļaujamā daudzuma noteikšanu
    labībā un uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem un dažos
    augu izcelsmes produktos, tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. gegužės 17 d. Komisijos direktyva 2002/42/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB, 86/363/EEB ir 90/642/EEB, dėl didžiausių leistinų
    pesticidų (bentazono ir piridato) koncentracijų atitinkamai grūduose, gyvūninės
    kilmės maisto produktuose ir kai kuriuose augalinės kilmės produktuose, įskaitant
    vaisius ir daržoves, ir ant jų, priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/42/KE tas-17 ta' Mejju 2002 li temenda
    l-Annessi tad-Direttivi tal-Kunsill 86/362/KEE, 86/363/KEE u 90/642/KEE fir-rigward
    ta' l-istabbiliment tal-livelli massimi għal residwi tal-pestiċidi (bentazone
    u pyridate) ġewwa u fuq iċ-ċereali, l-oġġetti ta' l-ikel ta' oriġini annimali
    u ċerti prodotti li joriġinaw mill-pjanti, inklużi l-frott u l-ħxejjexTest
    b’relevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/42/EG van de Commissie van 17 mei 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad tot vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    (bentazon en pyridaat) in en op granen, levensmiddelen van dierlĳke oorsprong
    en bepaalde producten van plantaardige oorsprong, met inbegrip van groenten en
    fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/42/WE z dnia 17 maja 2002 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG i 90/642/EWG w odniesieniu do ustalania
    maksymalnych dopuszczalnych poziomów pozostałości pestycydów (bentazonu i
    pirydatu) w zbożach, środkach spożywczych pochodzenia zwierzęcego i niektórych
    produktach pochodzenia roślinnego, w tym owocach i warzywach oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/42/CE da Comissão, de 17 de Maio de 2002, que altera os
    anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho no respeitante
    à fixação de teores máximos de resíduos dos pesticidas bentazona e piridato
    à superfície e no interior dos cereais, dos géneros alimentícios de origem
    animal e de determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/42/CE a Comisiei din 17 mai 2002 de modificare a anexelor
    la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului în ceea
    ce privește stabilirea conținuturilor maxime de reziduuri de pesticide (bentazonă
    și piridat) din și de pe cereale, alimente de origine animală și anumite produse
    de origine vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/42/ES zo 17. mája 2002, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    hladín rezíduí pesticídov (bentazón a pyridát) v a na obilninách, potravinách
    živočíšneho pôvodu a určitých výrobkoch rastlinného pôvodu vrátane
    ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/42/ES z dne 17. maja 2002 o spremembah prilog k
    direktivam Sveta 86/362/EGS, 86/363/EGS in 90/642/EGS o določanju najvišjih
    dovoljenih vrednosti ostankov pesticidov (bentazona in piridata) v in na žitih,
    živilih živalskega izvora in nekaterih proizvodih rastlinskega izvora, vključno
    s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/42/CE de la Comisión, de 17 de mayo de 2002, por la que
    se modifican los anexos de las Directivas 86/362/CEE, 86/363/CEE y 90/642/CEE
    del Consejo, en lo relativo a la fijación de los límites máximos de residuos
    de plaguicidas (bentazona y piridato) en cereales, en productos alimenticios de
    origen animal y en determinados productos de origen vegetal, incluidas las frutas
    y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/42/EG av den 17 maj 2002 om ändring av bilagorna
    till rådets direktiv 86/362/EEG, 86/363/EEG och 90/642/EEG beträffande fastställande
    av gränsvärden för bekämpningsmedelsrester (bentazon och pyridat) i och på
    spannmål, livsmedel av animaliskt ursprung samt vissa produkter av vegetabiliskt
    ursprung, inklusive frukt och grönsaker
