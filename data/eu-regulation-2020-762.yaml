title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2020/762 of 9 June 2020 amending Regulation
    (EU) No 142/2011 as regards microbiological standards for raw petfood, requirements
    concerning approved establishments, technical parameters applicable to the alternative
    method Brookes’ gasification process and hydrolysis of rendered fats, and exports
    of processed manure, certain blood, blood products and intermediate products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/762 de la Commission du 9 juin 2020 modifiant le règlement
    (UE) no 142/2011 en ce qui concerne les normes microbiologiques applicables aux
    aliments crus pour animaux familiers, les exigences concernant les établissements
    agréés, les paramètres techniques applicables à la méthode dénommée «procédé
    de gazéification Brookes» et à l’hydrolyse des graisses fondues, et l’exportation
    du lisier transformé, de certains sangs, produits sanguins et produits intermédiaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2020/762 der Kommission vom 9. Juni 2020 zur Änderung
    der Verordnung (EU) Nr. 142/2011 hinsichtlich der mikrobiologischen Normen für
    rohes Heimtierfutter, der Anforderungen an zugelassene Betriebe, der technischen
    Parameter für die alternative Methode der Brookes-Vergasung und der Hydrolyse
    ausgeschmolzener Fette sowie der Ausfuhren von verarbeiteter Gülle, bestimmtem
    Blut, bestimmten Blutprodukten und Zwischenerzeugnissen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2020/762 на Комисията от 9 юни
    2020 година за изменение на Регламент (ЕС) № 142/2011
    по отношение на микробиологичните стандарти
    за сурови храни за домашни любимци, изискванията
    за одобрените предприятия, техническите параметри,
    приложими за алтернативния метод процес на
    газификация по Бруукс, хидролизата на топените
    мазнини и износа на преработен оборски тор,
    някои видове кръв, кръвни продукти и междинни
    продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2020/762 ze dne 9. června 2020, kterým se mění
    nařízení (EU) č. 142/2011, pokud jde o mikrobiologické normy pro syrové
    krmivo pro zvířata v zájmovém chovu, požadavky na schválená zařízení,
    technické parametry použitelné na alternativní metodu proces zplyňování
    podle Brookese a hydrolýzu tavených/škvařených tuků a vývoz zpracovaného
    hnoje, určité krve, krevních výrobků a meziproduktů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2020/762 af 9. juni 2020 om ændring af forordning
    (EU) nr. 142/2011 for så vidt angår mikrobiologiske normer for råt foder til
    selskabsdyr, krav vedrørende godkendte virksomheder, tekniske parametre for den
    alternative metode Brookes-forgasning og hydrolyse af afsmeltet fedt samt eksport
    af forarbejdet husdyrgødning, visse former for blod, blodprodukter og mellemprodukter
  type: main
- language: el
  script: Grek
