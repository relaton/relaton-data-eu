  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) 2020/762, 9. juuni 2020, millega muudetakse määrust
    (EL) nr 142/2011 seoses töötlemata lemmikloomatoidu mikrobioloogiliste normidega,
    tunnustatud ettevõtetega seotud nõuetega, Brookesi gaasistamismeetodi alternatiivmeetodi
    ja sulatatud rasvade hüdrolüüsi suhtes kohaldatavate tehniliste parameetritega
    ning töödeldud sõnniku, teatava vere, teatavate veretoodete ja vahetoodete
    ekspordiga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2020/762, annettu 9 päivänä kesäkuuta 2020, asetuksen
    (EU) N:o 142/2011 muuttamisesta raa’an lemmikkieläinten ruoan mikrobiologisten
    vaatimusten, hyväksyttyjä laitoksia koskevien vaatimusten, vaihtoehtoisena menetelmänä
    käytettävään Brookesin kaasutusmenetelmään ja renderöityjen rasvojen hydrolyysiin
    sovellettavista teknisistä parametreista sekä käsitellyn lannan ja tiettyjen
    veren, verituotteiden ja välituotteiden viennin osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2020/762 оd 9. lipnja 2020. o izmjeni Uredbe (EU)
    br. 142/2011 u pogledu mikrobioloških standarda za sirovu hranu za kućne ljubimce,
    zahtjeva povezanih s odobrenim objektima, tehničkih parametara koji se primjenjuju
    na alternativnu metodu Brookesov postupak uplinjavanja i hidrolizu topljenih masti
    te izvoza prerađenog stajskog gnoja, određene krvi, proizvoda od krvi i međuproizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/762 rendelete (2020. június 9.) a 142/2011/EU rendeletnek
    a kedvtelésből tartott állatok nyers eledelére vonatkozó mikrobiológiai
    előírások, az engedélyezett létesítményekre vonatkozó követelmények,
    az alternatív módszerként alkalmazott Brookes gázosítási eljárásra és
    a kiolvasztott zsírok hidrolízisére alkalmazandó technikai paraméterek, valamint
    a feldolgozott trágyának, bizonyos állatok vérének, valamint bizonyos vértermékeknek
    és köztes termékeknek a kivitele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2020/762 della Commissione del 9 giugno 2020 che modifica
    il regolamento (UE) n. 142/2011 per quanto riguarda le norme microbiologiche riguardanti
    gli alimenti greggi per animali da compagnia, le prescrizioni gli stabilimenti
    riconosciuti, i parametri tecnici applicabili al metodo alternativo detto processo
    di gassificazione Brookes e all’idrolisi dei grassi fusi e le esportazioni di
    stallatico trasformato, determinati tipi di sangue, prodotti sanguigni e prodotti
    intermedi
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2020/762 (2020. gada 9. jūnijs), ar ko attiecībā
    uz jēlas lolojumdzīvnieku barības mikrobioloģiskajiem standartiem un prasībām,
    kas izvirzītas apstiprinātiem uzņēmumiem, tehniskajiem parametriem, kuri piemērojami
    alternatīvajai metodei jeb Brūka gazifikācijas procesam un kausētu tauku hidrolīzei,
    kā arī prasībām, kas izvirzītas pārstrādātu kūtsmēslu, noteiktu asiņu,
    asins pagatavojumu un starpproduktu eksportam, groza Regulu (ES) Nr. 142/2011
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (ES) 2020/762 2020 m. birželio 9 d. kuriuo iš dalies
    keičiamos Reglamento (ES) Nr. 142/2011 nuostatos dėl žalio gyvūnų augintinių
    ėdalo mikrobiologinių standartų, su patvirtintomis įmonėmis susijusių reikalavimų,
    alternatyviam metodui – Brookes dujinimo procesui – ir lydytų riebalų hidrolizei
    taikomų techninių parametrų ir perdirbto mėšlo, tam tikro kraujo, kraujo
    produktų ir tarpinių produktų eksporto
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2020/762 tad-9 ta’ Ġunju 2020 li jemenda
    r-Regolament (UE) Nru 142/2011 fir-rigward tal-istandards mikrobijoloġiċi għall-ikel
    nej għall-annimali domestiċi, ir-rekwiżiti li jikkonċernaw l-istabbilimenti
    approvati, il-parametri tekniċi applikabbli għall-metodu alternattiv tal-proċess
    ta’ Brookes ta’ bdil f’gass u għall-idroliżi tax-xaħmijiet imdewba, u
    l-esportazzjonijiet ta’ demel ipproċessat, ta’ ċertu demm, ta’ prodotti
    tad-demm u ta’ prodotti intermedji
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2020/762 van de Commissie van 9 juni 2020 tot wijziging
    van Verordening (EU) nr. 142/2011 wat betreft de microbiologische normen voor
    rauw voeder voor gezelschapsdieren, voorschriften voor erkende inrichtingen, technische
    parameters voor de alternatieve methode brookesvergassing en de hydrolyse van
    gesmolten vet, en de uitvoer van verwerkte mest, bepaald bloed en bepaalde bloedproducten
    en tussenproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2020/762 z dnia 9 czerwca 2020 r. zmieniające
    rozporządzenie (UE) nr 142/2011 w odniesieniu do norm mikrobiologicznych dotyczących
    surowej karmy dla zwierząt domowych, wymogów dotyczących zatwierdzonych przedsiębiorstw,
    parametrów technicznych mających zastosowanie do alternatywnej metody procesu
    gazyfikacji Brookesa i hydrolizy tłuszczów wytopionych oraz wywozu przetworzonego
    obornika, niektórych rodzajów krwi, produktów z krwi i produktów pośrednich
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2020/762 da Comissão de 9 de junho de 2020 que altera
    o Regulamento (UE) n.o 142/2011 no que diz respeito às normas microbiológicas
    aplicáveis aos alimentos crus para animais de companhia, aos requisitos relativos
    aos estabelecimentos aprovados, aos parâmetros técnicos aplicáveis ao método
    alternativo «processo de gaseificação de Brookes» e à hidrólise de gorduras
    fundidas, e às exportações de chorume transformado, de determinados tipos de
    sangue, produtos derivados de sangue e produtos intermédios
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2020/762 al Comisiei din 9 iunie 2020 de modificare a
    Regulamentului (UE) nr. 142/2011 în ceea ce privește standardele microbiologice
    pentru hrana neprelucrată pentru animalele de companie, cerințele privind unitățile
    autorizate, parametrii tehnici aplicabili metodei alternative intitulate „procesul
    de gazificare Brookes” și hidrolizei grăsimilor topite, precum și exporturile
    de dejecții animaliere prelucrate, de anumite tipuri de sânge, de produse din
    sânge și de produse intermediare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2020/762 z 9. júna 2020, ktorým sa mení nariadenie
    (EÚ) č. 142/2011, pokiaľ ide o mikrobiologické normy pre surové krmivo pre
    spoločenské zvieratá, požiadavky týkajúce sa schválených prevádzkarní,
    technické parametre uplatniteľné na alternatívnu metódu „proces splyňovania
    podľa Brookesa“ a hydrolýzu kafilerických tukov, ako aj vývoz spracovaného
    hnoja, určitej krvi, krvných produktov a medziproduktov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2020/762 z dne 9. junija 2020 o spremembi Uredbe (EU)
    št. 142/2011 glede mikrobioloških standardov za surovo hrano za hišne živali,
    zahtev za odobrene obrate, tehničnih parametrov, ki se uporabljajo za alternativni
    metodi Brookesov postopek uplinjanja in hidroliza topljenih maščob, ter glede
    izvoza predelanega gnoja, nekaterih proizvodov iz krvi, krvi in vmesnih proizvodov
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2020/762 de la Comisión de 9 de junio de 2020 que modifica
    el Reglamento (UE) n.o 142/2011 en lo que respecta a las normas microbiológicas
    aplicables a los alimentos crudos para animales de compañía, las condiciones
    sobre determinados establecimientos aprobados, los parámetros técnicos aplicables
    al método alternativo «proceso de gasificación de Brookes» y a la hidrólisis
    de grasas extraídas, así como a las exportaciones de estiércol transformado,
    determinada sangre, hemoderivados y productos intermedios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2020/762 av den 9 juni 2020 om ändring
    av förordning (EU) nr 142/2011 vad gäller mikrobiologiska krav för färskt
    sällskapsdjursfoder, krav avseende godkända anläggningar, tekniska parametrar
    för den alternativa metoden Brookes förgasning och hydrolys av utsmält fett
    samt export av bearbetad naturgödsel, visst blod och vissa blodprodukter och
    mellanprodukter
