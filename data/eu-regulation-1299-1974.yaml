id: EURegulation12991974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1299/74 of the Commission of 22 May 1974 re-establishing
    the levying of the customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, not optically worked or of optical glass, falling
    within subheading No 70.14 B, originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1299/74 de la Commission, du 22 mai 1974, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, de la sous-position tarifaire
    70.14 B originaires de Hong-Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1299/74 der Kommission vom 22. Mai 1974 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, nicht optisch bearbeitet, der
    Tarifstelle 70.14 B, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1299/74 af 22. maj 1974 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, optiske artikler
    af glas, hverken optisk bearbejdet eller af optisk glas under underposition 70.14
    B, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1299/74 della Commissione, del 22 maggio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, della sottovoce doganale n. 70.14 B, originari
    di Hongkong, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1299/74 van de Commissie van 22 mei 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, van onderverdeling 70.14 B, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
