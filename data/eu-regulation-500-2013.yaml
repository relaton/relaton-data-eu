  content: Commission Regulation (EU) No 500/2013 of 30 May 2013 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for acetamiprid, Adoxophyes orana
    granulovirus strain BV-0001, azoxystrobin, clothianidin, fenpyrazamine, heptamaloxyloglucan,
    metrafenone, Paecilomyces lilacinus strain 251, propiconazole, quizalofop-P, spiromesifen,
    tebuconazole, thiamethoxam and zucchini yellow mosaik virus - weak strain in or
    on certain products
  type: main
- language: fr
  script: Latn
