    osadel seemnekartuli turustamise puhul kasutada rangemaid meetmeid teatud haiguste
    vastu, kui on sätestatud nõukogu direktiivi 66/403/EMÜ I ja II lisas
  type: main
- language: fi
  script: Latn
  content: '95/76/EY: Komission päätös, tehty 10 päivänä maaliskuuta 1995, luvasta
