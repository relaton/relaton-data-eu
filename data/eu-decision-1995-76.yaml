    den Verkehr mit Pflanzkartoffeln auf ihrem gesamten oder auf Teilen ihres Hoheitsgebiets
    strengere als die in den Anlagen I und II der Richtlinie 66/403/EWG des Rates
    vorgesehenen Maßnahmen gegen bestimmte Krankheitserreger anzuwenden'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 10. března 1995, kterým se mění rozhodnutí
