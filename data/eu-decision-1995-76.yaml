    93/231/EØF om tilladelse til, at der for handelen med læggekartofler på visse
    medlemsstaters samlede område eller dele deraf gennemføres strengere foranstaltninger
    mod bestemte sygdomme end fastsat i bilag i og II til Rådets direktiv 66/403/EØF'
  type: main
- language: el
  script: Grek
