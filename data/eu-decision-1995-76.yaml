    kollu jew parti minnu ta’ ċerti Stati Membri, miżuri aktar rigorużi kontra
    ċertu mard milli hemm ipprovdut dwaru fl-Annessi I u II tad-Direttiva tal-Kunsill
    66/403/KEE
  type: main
- language: nl
  script: Latn
  content: '95/76/EG: Beschikking van de Commissie van 10 maart 1995 houdende wijziging
    van Beschikking 93/231/EEG tot machtiging van sommige Lid-Staten om, wat de handel
    in pootaardappelen betreft, voor hun gehele grondgebied of een gedeelte daarvan
    ten aanzien van bepaalde ziekten strengere maatregelen toe te passen dan op grond
    van de bijlagen I en II bij Richtlijn 66/403/EEG is vereist'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 10 marca 1995 r. zmieniająca decyzję 93/231/EWG
    upoważniającą, w zakresie obrotu sadzeniakami ziemniaka na całym lub części
    terytorium niektórych Państw Członkowskich, do podjęcia bardziej rygorystycznych
    środków przeciwko niektórym chorobom niż przewidziane w załącznikach I i
    II do dyrektywy Rady 66/403/EWG
  type: main
- language: pt
  script: Latn
  content: '95/76/CE: Decisão da Comissão de 10 de Março de 1995 que altera a Decisão
    93/231/CEE que autoriza medidas mais restritivas do que as previstas nos anexos
    I e II da Directiva 66/403/CEE do Conselho, a adoptar relativamente a certas doenças,
    no que se refere à comercialização de batatas de semente em todo o território
    de determinados Estados-membros ou em partes destes'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 10. marca 1995 o zmene a doplnení rozhodnutia 93/231/EHS,
    ktoré povoľuje pri uvádzaní sadbových zemiakov na trh na celom alebo na časti
    územia niektorých členských štátov prísnejšie opatrenia proti niektorým
    nákazám, ako sú ustanovené v prílohách I a II k smernici Rady 66/403/EHS
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 10. marca 1995 o spremembi Odločbe 93/231/EGS
    o pooblastitvi nekaterih držav članic, da za trženje semenskega krompirja na
    njihovem celotnem ozemlju ali le na delu njihovega ozemlja, uporabljajo strožja
    merila glede nekaterih bolezni, kot so določena v prilogah I in II k Direktivi
    Sveta 66/403/EGS
  type: main
- language: es
  script: Latn
  content: '95/76/CE: Decisión de la Comisión de 10 de marzo de 1995 por la que
    se modifica la Decisión 93/231/CEE por la que se autoriza la adopción, contra
    determinadas enfermedades, de medidas más estrictas que las previstas en los
    Anexos I y II de la Directiva 66/403/CEE del Consejo respecto de la comercialización
    de patatas de siembra en todo el territorio de determinados Estados miembros o
    en una parte del mismo'
  type: main
- language: sv
  script: Latn
  content: '95/76/EG: Kommissionens beslut av den 10 mars 1995 om ändring av kommissionens
    beslut 93/231/EEG om tillåtelse, vid saluföring av utsädespotatis i hela eller
    en del av vissa medlemsstaters territorium, till strängare åtgärder mot vissa
    sjukdomar än vad som föreskrivs i bilagorna I och II till rådets direktiv 66/403/EEG'
