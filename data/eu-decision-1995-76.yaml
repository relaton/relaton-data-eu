    uz sēklas kartupeļu tirdzniecību paredzēt pret noteiktām slimībām vērstus
    stingrākus pasākumus, nekā paredzēts Padomes Direktīvas 66/403/EEK I un II
    pielikumā
  type: main
- language: lt
  script: Latn
  content: 1995 m. kovo 10 d. Komisijos Sprendimas iš dalies keičiantis Sprendimą
    93/231/EEB, leidžiantį prekiaujant sėklinėmis bulvėmis tam tikrų valstybių
    narių visoje arba dalyje teritorijos taikyti griežtesnes nei nurodyta Tarybos
    direktyvos 66/403/EEB I ir II prieduose priemones nuo tam tikrų ligų
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-kummissjoni ta’ l-10 ta’ Marzu 1995 li temenda d-Deċiżjoni
