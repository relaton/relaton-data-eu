title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1365/87 of 18 May 1987 amending Regulation
    (EEC) No 4034/86 fixing, for certain fish stocks and groups of fish stocks, the
    total allowable catches for 1987 and certain conditions under which they may be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1365/87 du Conseil du 18 mai 1987 modifiant le règlement
    (CEE) n° 4034/86 fixant, pour certains stocks ou groupes de stocks de poissons,
    les totaux admissibles des captures pour 1987 et certaines conditions dans lesquelles
    ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1365/87 des Rates vom 18. Mai 1987 zur Änderung der
    Verordnung (EWG) Nr. 4034/86 zur Festlegung der zulässigen Gesamtfangmengen und
    bestimmter Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für
    bestimmte Fischbestände oder Bestandsgruppen für 1987
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1365/87 af 18. maj 1987 om ændring af forordning
    (EØF) nr. 4034/86 om fastsættelse for 1987 af de samlede tilladte fangstmængder
    for visse fiskebestande og grupper af fiskebestande samt af visse betingelser
    for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1365/87 του Συμβουλίου
    της 18ης Μαΐου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 4034/86 για τον καθορισμό, για ορισμένα
    αποθέματα ιχθύων ή ομάδες αποθεμάτων ιχθύων,
    του συνόλου επιτρεπομένων αλιευμάτων για το
    1987 και ορισμένων όρων υπό τους οποίους μπορούν
    να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1365/87 del Consiglio del 18 maggio 1987 recante modifica
    del regolamento (CEE) n. 4034/86 che fissa, per alcune popolazioni o gruppi di
    popolazioni ittiche, il totale delle catture ammissibile per il 1987 e alcune
    condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1365/87 van de Raad van 18 mei 1987 tot wijziging
    van Verordening (EEG) nr. 4034/86 inzake de vaststelling van de voor 1987 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden
    en bepaalde bij de visserij in het kader van de totaal toegestane vangsten in
    acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1365/87 do Conselho de 18 de Maio de 1987 que altera
    o Regulamento (CEE) n.° 4034/86, que fixa, relativamente a certas unidades populacionais
    (stocks) ou grupos de unidades populacionais de peixes, os totais admissíveis
    de capturas para 1987 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1365/87 del Consejo de 18 de mayo de 1987 por el que
    se modifica el Reglamento (CEE) n° 4034/86 por el que se fijan, para determinadas
    poblaciones o grupos de problaciones de peces, los totales admisibles de capturas
    para 1987 y determinadas condiciones en las que pueden pescarse
  type: main
