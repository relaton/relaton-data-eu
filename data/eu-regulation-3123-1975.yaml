id: EURegulation31231975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3123/75 of the Commission of 28 November 1975 re-establishing
    the levying of customs duties on certain appliances, apparatus, accessories and
    requisites for gymnastics or athletics, or for sports or outdoor games (other
    than articles falling within heading No 97.04), falling within subheadings 97.06
    B and C, originating in India, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3123/75 de la Commission, du 28 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables à certains
    articles et engins pour les jeux de plein air, la gymnastique, l'athlétisme et
    autres sports, à l'exclusion des articles du n° 97.04, des sous-positions tarifaires
    97.06B et C, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3123/75 der Kommission vom 28. November 1975 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten, ausgenommen Waren der Tarifnummer 97.04, der Tarifstellen 97.06
    B und C, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3054/74 des
    Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3123/75 af 28. november 1975 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil
    samt til gymnastik, atletik og andre sportsgrene, (bortset fra varer henhørende
    under position 97.04), under underposition 97.06 B, C, som har oprindelse i Indien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3123/75 della Commissione, del 28 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all'aperto, da ginnastica, da atletica ed altri sport, diversi da
    quelli della voce 97.04, delle sottovoci doganali 97.06 B e C, originari dell'India,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3123/75 van de Commissie van 28 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op artikelen
    en toestellen voor openluchtspelen, voor atletiek en voor andere sporten, met
    uitzondering van de artikelen bedoeld bij post 97.04, van onderverdelingen 97.06
    B en C, van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG) nr.
    3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
