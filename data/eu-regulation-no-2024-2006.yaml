id: EURegulationNo20242006
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2024/2006 of 22 December 2006 laying down
    transitional measures derogating from Regulation (EC) No 2076/2002 and Decisions
    98/270/EC, 2002/928/EC, 2003/308/EC, 2004/129/EC, 2004/141/EC, 2004/247/EC, 2004/248/EC,
    2005/303/EC and 2005/864/EC as regards the continued use of plant protection products
    containing certain active substances not included in Annex I to Directive 91/414/EEC
    by reason of the accession of Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2024/2006 de la Commission du 22 décembre 2006 établissant
    des mesures transitoires portant dérogation au règlement (CE) n o 2076/2002
    et aux décisions 98/270/CE, 2002/928/CE, 2003/308/CE, 2004/129/CE, 2004/141/CE,
    2004/247/CE, 2004/248/CE, 2005/303/CE et 2005/864/CE en ce qui concerne le maintien
    de l’utilisation de certaines substances actives non énumérées à l’annexe
    I de la directive 91/414/CEE, du fait de l’adhésion de la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2024/2006 der Kommission vom 22. Dezember 2006 zur
    Festlegung von Übergangsmaßnahmen, mit denen aufgrund des Beitritts Rumäniens
    abgewichen wird von der Verordnung (EG) Nr. 2076/2002 und den Entscheidungen 98/270/EG,
    2002/928/EG, 2003/308/EG, 2004/129/EG, 2004/141/EG, 2004/247/EG, 2004/248/EG,
    2005/303/EG und 2005/864/EG hinsichtlich der Weiterverwendung von Pflanzenschutzmitteln,
    die bestimmte, in Anhang I der Richtlinie 91/414/EWG nicht aufgeführte Wirkstoffe
    enthalten
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EO) № 2024/2006 на Комисията от 22 декември
    2006 година за установяване на преходни мерки
    за дерогация от Регламент (EO) № 2076/2002 и от Решения
    98/270/EO, 2002/928/EO, 2003/308/EO, 2004/129/EO, 2004/141/EO, 2004/247/EO, 2004/248/EO,
    2005/303/EO и 2005/864/EO относно запазване на употребата
    на някои активни вещества, които не фигурират
    в приложение I към Директива 91/414/ЕИО, поради
    присъединяването на Румъния
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2024/2006 ze dne 22. prosince 2006 , kterým
    se stanoví přechodná opatření odchylující se od nařízení (ES) č. 2076/2002
    a rozhodnutí 1998/270/ES, 2002/928/ES, 2003/308/ES, 2004/129/ES, 2004/141/ES,
    2004/247/ES, 2004/248/ES, 2005/303/ES a 2005/864/ES, pokud jde o další používání
    přípravků na ochranu rostlin obsahujících některé účinné látky neuvedené
    v příloze I směrnice 91/414/EHS v důsledku přistoupení Rumunska
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2024/2006 af 22. december 2006 om overgangsforanstaltninger
    vedrørende undtagelse fra forordning (EF) nr. 2076/2002 samt beslutning 98/270/EF,
    2002/928/EF, 2003/308/EF, 2004/129/EF, 2004/141/EF, 2004/247/EF, 2004/248/EF,
    2005/303/EF og 2005/864/EF for så vidt angår fortsat anvendelse af plantebeskyttelsesmidler
    indeholdende visse aktivstoffer, der ikke er optaget i bilag I til direktiv 91/414/EØF,
    på grund af Rumæniens tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2024/2006 της Επιτροπής,
    της 22ας Δεκεμβρίου 2006 , για τη θέσπιση μεταβατικών
    μέτρων κατά παρέκκλιση από τον κανονισμό (ΕΚ)
    αριθ. 2076/2002 και από τις αποφάσεις 98/270/ΕΚ, 2002/928/ΕΚ,
    2003/308/ΕΚ, 2004/129/ΕΚ, 2004/141/ΕΚ, 2004/247/ΕΚ, 2004/248/ΕΚ, 2005/303/ΕΚ
    και 2005/864/ΕΚ όσον αφορά τη συνεχιζόμενη χρήση
    φυτοπροστατευτικά προϊόντα που περιέχουν
    ορισμένες δραστικές ουσίες οι οποίες δεν περιλαμβάνονται
    στο παράρτημα I της οδηγίας 91/414/ΕΟΚ, λόγω της
    προσχώρησης της Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2024/2006, 22. detsember 2006 , millega sätestatakse
    üleminekumeetmed, et teha Rumeenia ühinemise tõttu erand määrusest (EÜ)
    nr 2076/2002 ning otsustest 1998/270/EMÜ, 2002/928/EÜ, 2003/308/EÜ, 2004/129/EÜ,
    2004/141/EÜ, 2004/247/EÜ, 2004/248/EÜ, 2005/303/EÜ ja 2005/864/EÜ seoses
    teatavaid direktiivi 91/414/EMÜ I lisas loetlemata toimeaineid sisaldavate taimekaitsevahendite
    jätkuva kasutamisega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2024/2006, annettu 22 päivänä joulukuuta 2006
    , asetuksesta (EY) N:o 2076/2002 ja päätöksistä 98/270/EY, 2002/928/EY, 2003/308/EY,
    2004/129/EY, 2004/141/EY, 2004/247/EY, 2004/248/EY, 2005/303/EY ja 2005/864/EY
    poikkeavien siirtymätoimenpiteiden vahvistamisesta Romanian liittymisen vuoksi
    direktiivin 91/414/ETY liitteessä I mainitsemattomia tehoaineita sisältävien
    kasvinsuojeluaineiden käytön jatkamisen osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 2024/2006 od 22. prosinca 2006. o utvrđivanju
    prijelaznih mjera koje odstupaju od Uredbe (EZ) br. 2076/2002 i odluka 98/270/EZ,
    2002/928/EZ, 2003/308/EZ, 2004/129/EZ, 2004/141/EZ, 2004/247/EZ, 2004/248/EZ,
    2005/303/EZ i 2005/864/EZ o daljnjoj uporabi sredstava za zaštitu bilja koji
    sadrže određene aktivne tvari koje nisu uvrštene u Prilog I. Direktivi 91/414/EEZ,
    zbog pristupanja Rumunjske
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2024/2006/EK rendelete ( 2006. december 22. ) Románia csatlakozása
    következtében a 2076/2002/EK rendeletet, továbbá az 1998/270/EK, a 2002/928/EK,
    a 2003/308/EK, a 2004/129/EK, a 2004/141/EK, a 2004/247/EK, a 2004/248/EK, a 2005/303/EK
    és a 2005/864/EK határozatot a 91/414/EGK irányelv I. mellékletébe fel nem
    vett egyes hatóanyagok további alkalmazása tekintetében eltérő átmeneti
    intézkedések megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2024/2006 della Commissione, del 22 dicembre 2006 ,
    recante misure transitorie in deroga al regolamento (CE) n. 2076/2002 e alle decisioni
    98/270/CE, 2002/928/CE, 2003/308/CE, 2004/129/CE, 2004/141/CE, 2004/247/CE, 2004/248/CE,
    2005/303/CE e 2005/864/CE intesi a mantenere l'impiego di prodotti fitosanitari
    contenenti alcune sostanze attive non figuranti nell'allegato I alla direttiva
    91/414/CEE in seguito all'adesione della Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2024/2006 ( 2006. gada 22. decembris ) par pagaidu
    pasākumiem, ar ko sakarā ar Rumānijas pievienošanos atkāpjas no Regulas (EK)
    Nr. 2076/2002 un Lēmumiem 98/270/EK, 2002/928/EK, 2003/308/EK, 2004/129/EK, 2004/141/EK,
    2004/247/EK, 2004/248/EK, 2005/303/EK un 2005/864/EK attiecībā uz tādu augu
    aizsardzības līdzekļu lietošanas turpināšanu, kuros ir dažas aktīvās
    vielas, kas nav iekļautas Direktīvas 91/414/EEK I pielikumā
  type: main
- language: lt
  script: Latn
  content: 2006 m. gruodžio 22 d. Komisijos reglamentas (EB) Nr. 2024/2006, nustatantis
    pereinamojo laikotarpio priemones, nukrypstančias nuo Reglamento (EB) Nr. 2076/2002
    ir Sprendimų 1998/270/EB, 2002/928/EB, 2003/308/EB, 2004/129/EB, 2004/141/EB,
    2004/247/EB, 2004/248/EB, 2005/303/EB bei 2005/864/EB, dėl tolesnio tam tikrų
    veikliųjų medžiagų, neįtrauktų į Direktyvos 91/414/EEB I priedą, naudojimo
    atsižvelgiant į Rumunijos stojimą į Europos Sąjungą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 2024/2006 tat- 22 ta’ Diċembru 2006
    li jfassal miżuri tranżitorji li jidderogaw mir-Regolament (KE) Nru 2076/2002
    u d-Deċiżjonijiet 1998/270/KEE, 2002/928/EC, 2003/308/KE, 2004/129/KE, 2004/141/KE,
    2004/247/KE, 2004/248/KE, 2005/303/KE u 2005/864/KE
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2024/2006 van de Commissie van 22 december 2006 tot
    vaststelling van overgangsmaatregelen tot afwijking van Verordening (EG) nr. 2076/2002
    en de Beschikkingen 98/270/EG, 2002/928/EG, 2003/308/EG, 2004/129/EG, 2004/141/EG,
    2004/247/EG, 2004/248/EG, 2005/303/EG en 2005/864/EG wat betreft het voortgezette
    gebruik van gewasbeschermingsmiddelen die bepaalde werkzame stoffen bevatten die
    niet zijn opgenomen in bijlage I bij Richtlijn 91/414/EEG, wegens de toetreding
    van Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2024/2006 z dnia 22 grudnia 2006 r. ustanawiające
    środki przejściowe stanowiące odstępstwa od rozporządzenia (WE) nr 2076/2002
    oraz od decyzji 98/270/WE, 2002/928/WE, 2003/308/WE, 2004/129/WE, 2004/141/WE,
    2004/247/WE, 2004/248/WE, 2005/303/WE i 2005/864/WE w odniesieniu do dalszego
    stosowania środków ochrony roślin zawierających niektóre substancje czynne
    niewłączone do załącznika I do dyrektywy 91/414/EWG, ze względu na przystąpienie
    Rumunii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2024/2006 da Comissão, de 22 de Dezembro de 2006
    , que estabelece medidas transitórias de derrogação do Regulamento (CE) n.
    o 2076/2002 e das Decisões 98/270/CE, 2002/928/CE, 2003/308/CE, 2004/129/CE,
    2004/141/CE, 2004/247/CE, 2004/248/CE, 2005/303/CE e 2005/864/CE no que diz respeito
    ao prosseguimento da utilização de produtos fitofarmacêuticos que contêm determinadas
    substâncias activas não incluídas no anexo I da Directiva 91/414/CEE em virtude
    da adesão da Roménia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2024/2006 al Comisiei din 22 decembrie 2006 de stabilire
    a măsurilor tranzitorii de derogare de la Regulamentul (CE) nr. 2076/2002 și
    de la Deciziile 98/270/CE, 2002/928/CE, 2003/308/CE, 2004/129/CE, 2004/141/CE,
    2004/247/CE, 2004/248/CE, 2005/303/CE și 2005/864/CE privind continuarea utilizării
    produselor fitosanitare conținând anumite substanțe active care nu au fost
    incluse în anexa I la Directiva 91/414/CEE, ca urmare a aderării României
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2024/2006 z 22. decembra 2006 , ktorým sa
    stanovujú prechodné opatrenia predstavujúce výnimku z nariadenia (ES) č.
    2076/2002 a rozhodnutí 1998/270/EHS, 2002/928/ES, 2003/308/ES, 2004/129/ES, 2004/141/ES,
    2004/247/ES, 2004/248/ES, 2005/303/ES a 2005/864/ES, pokiaľ ide o ďalšie používanie
    prípravkov na ochranu rastlín obsahujúcich určité aktívne látky, ktoré
    nie sú zaradené do prílohy I k smernici 91/414/EHS z dôvodu pristúpenia Rumunska
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2024/2006 z dne 22. decembra 2006 o uvedbi prehodnih
    ukrepov za odstopanje od Uredbe (ES) št. 2076/2002 in odločb 98/270/ES, 2002/928/ES,
    2003/308/ES, 2004/129/ES, 2004/141/ES, 2004/247/ES, 2004/248/ES, 2005/303/ES in
    2005/864/ES glede nadaljnje uporabe fitofarmacevtskih sredstev, ki vsebujejo nekatere
    aktivne snovi, ki niso vključene v Prilogo I k Direktivi 91/414/EGS, zaradi pristopa
    Romunije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2024/2006 de la Comisión, de 22 de diciembre de 2006
    , por el que se establecen medidas transitorias que introducen una excepción
    a lo dispuesto en el Reglamento (CE) n o 2076/2002 y las Decisiones 98/270/CE,
    2002/928/CE, 2003/308/CE, 2004/129/CE, 2004/141/CE, 2004/247/CE, 2004/248/CE,
    2005/303/CE y 2005/864/CE en lo relativo a la continuación del uso de productos
    fitosanitarios que contienen determinadas sustancias activas no incluidas en el
    anexo I de la Directiva 91/414/CEE, con motivo de la adhesión de Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2024/2006 av den 22 december 2006 om
    övergångsbestämmelser som innebär ett undantag från förordning (EG) nr 2076/2002
    och besluten 98/270/EG, 2002/928/EG, 2003/308/EG, 2004/129/EG, 2004/141/EG, 2004/247/EG,
    2004/248/EG, 2005/303/EG och 2005/864/EG när det gäller fortsatt användning
    av växtskyddsmedel som innehåller vissa verksamma ämnen som inte ingår i bilaga
    I till direktiv 91/414/EEG med anledning av Rumäniens anslutning
  type: main
