title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 958/93 of 5 April 1993 establishing a Community
    procedure for administering quantitative import restrictions and monitoring of
    textile and clothing products originating in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 958/93 du Conseil, du 5 avril 1993, établissant une
    procédure communautaire pour la gestion des restrictions quantitatives d' importation
    et la surveillance des produits textiles et d' habillement originaires de certains
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 958/93 des Rates vom 5. April 1993 zur Einführung
    eines Gemeinschaftsverfahrens für die Verwaltung der mengenmäßigen Beschränkungen
    und die Überwachung der Einfuhren von Textilien und Bekleidung mit Ursprung in
    bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 958/93 af 5. april 1993 om en fællesskabsprocedure
    for forvaltning af kvantitative importrestriktioner og overvågning af tekstilvarer
    og beklædningsgenstande med oprindelse i visse tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 958/93 του Συμβουλίου
    της 5ης Απριλίου 1993 για την καθιέρωση κοινοτικής
    διαδικασίας διαχείρισης των ποσοτικών περιορισμών
    κατά την εισαγωγή και παρακολούθησης των κλωστοϋφαντουργικών
    προϊόντων και προϊόντων ενδύσεως, καταγωγής
    ορισμένων τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 958/93 del Consiglio, del 5 aprile 1993, che istituisce
    una procedura comunitaria per la gestione delle restrizioni quantitative all'
    importazione e il controllo sui prodotti tessili e di abbigliamento originari
    di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 958/93 van de Raad van 5 april 1993 tot vaststelling
    van een communautaire procedure voor het beheer van de kwantitatieve invoerbeperkingen
    en voor het toezicht bij de invoer van textiel- en kledingprodukten uit bepaalde
    derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 958/93 do Conselho, de 5 de Abril de 1993, que estabelece
    um procedimento comunitário para a gestão das restrições quantitativas à
    importação de produtos têxteis e de vestuário originários de determinados
    países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 958/93 del Consejo, de 5 de abril de 1993, por el
    que se establece un procedimiento comunitario para la gestión y supervisión
    de las restricciones cuantitativas a las importaciones de productos textiles y
    prendas de vestir originarios de determinados países terceros
  type: main
