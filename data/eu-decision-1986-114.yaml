  type: main
- language: it
  script: Latn
  content: '86/114/CEE: Decisione della Commissione del 6 marzo 1986 che modifica
    la decisione 85/634/CEE che autorizza taluni stati membri a prevedere deroghe
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda il legname di quercia originario del Canada o degli Stati Uniti d''America
    (Il testi in lingua francese, olandese, danese, tedesca e italiana sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '86/114/EEG: Beschikking van de Commissie van 6 maart 1986 tot wijziging
