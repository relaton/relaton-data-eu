title:
- language: en
  script: Latn
  content: '86/114/EEC: Commission Decision of 6 March 1986 amending Decision 85/634/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of oak wood originating in Canada or
    the United States of America (Only the French, Dutch, Danish, German and Italian
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/114/CEE: Décision de la Commission du 6 mars 1986 modifiant la décision
    85/634/CEE autorisant certains États membres à prévoir des dérogations à
    certaines dispositions de la directive 77/93/CEE du Conseil pour le bois de chêne
    originaire du Canada ou des États-Unis d''Amérique (Les textes en langues française,
    néerlandaise, danoise, allemande et italienne sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/114/EWG: Entscheidung der Kommission vom 6. März 1986 zur Änderung
    der Entscheidung 85/634/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Eichenholz mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika Ausnahmen
    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur
    der französische, niederländische, dänische, deutsche und italienische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/114/EØF: Kommissionens beslutning af 6. marts 1986 om ændring af
    beslutning 85/634/EØF om bemyndigelse af visse medlemsstater til at undtage egetræ
    med oprindelse i Canada eller USA fra visse bestemmelser i Rådets direktiv 77/93/EØF
    (Kun den franske, nederlandske, danske, tyske og italienske udgave er autentiske)'
  type: main
- language: el
  script: Grek
