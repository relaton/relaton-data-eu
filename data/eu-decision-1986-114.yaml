    1986 που τροποποιεί την απόφαση 85/634/ΕΟΚ για την
    παροχή αδείας σε ορισμένα κράτη μέλη να παρεκκλίνουν
    από διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά το ξύλο βελανιδιάς καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών της Αμερικής (Τα κείμενα
    στην γαλλική, ολλανδική, δανική, γερμανική
