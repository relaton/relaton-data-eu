---
id: EURegulation9192005
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 919/2005 of 13 June 2005 amending Regulation
    (EC) No 827/2004 as regards the prohibition of imports of Atlantic bigeye tuna
    from Cambodia, Equatorial Guinea and Sierra Leone, and repealing Regulation (EC)
    No 826/2004 prohibiting imports of blue-fin tuna from Equatorial Guinea and Sierra
    Leone and Regulation (EC) No 828/2004 prohibiting imports of swordfish from Sierra
    Leone
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 919/2005 du Conseil du 13 juin 2005 modifiant le règlement
    (CE) n° 827/2004 interdisant l’importation de thon obèse de l’Atlantique
    originaire du Cambodge, de Guinée équatoriale et de Sierra Leone, et abrogeant
    le règlement (CE) n° 826/2004 interdisant l’importation de thon rouge originaire
    de la Guinée équatoriale et de Sierra Leone ainsi que le règlement (CE) n°
    828/2004 interdisant l’importation d’espadon originaire de Sierra Leone
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 919/2005 des Rates vom 13. Juni 2005 zur Änderung
    der Verordnung (EG) Nr. 827/2004 hinsichtlich des Verbots der Einfuhr von atlantischem
    Großaugenthun aus Kambodscha, Äquatorialguinea und Sierra Leone und zur Aufhebung
    der Verordnung (EG) Nr. 826/2004 über das Verbot der Einfuhr Roten Thuns aus
    Äquatorialguinea und Sierra Leone und der Verordnung (EG) Nr. 828/2004 über
    das Verbot der Einfuhr von Schwertfisch aus Sierra Leone
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EO) № 919/2005 на Съвета от 13 юни 2005
    година за изменение на Регламент (ЕО) № 827/2004
    относно забраната за внос на атлантически
    черноперест (големоок) тон от Камбоджа, Екваториална
    Гвинея и Сиера Леоне и за отмяна на Регламент
    (ЕО) № 826/2004 за забрана вноса на риба меч от Сиера
    Леоне
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 919/2005 ze dne 13. června 2005, kterým se
    mění nařízení (ES) č. 827/2004, pokud jde o zákaz dovozu atlantického
    tuňáka velkookého pocházejícího z Kambodže, Rovníkové Guiney a Sierry
    Leone, a kterým se zrušuje nařízení (ES) č. 826/2004, kterým se zakazuje
    dovoz tuňáka obecného pocházejícího z Rovníkové Guineje a Sierry Leone,
    a nařízení (ES) č. 828/2004, kterým se zakazuje dovoz mečouna obecného
    pocházejícího ze Sierry Leone
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 919/2005 af 13. juni 2005 om ændring af forordning
    (EF) nr. 827/2004, for så vidt angår forbuddet mod import af storøjet tun med
    oprindelse i Cambodja, Ækvatorialguinea og Sierra Leone, og om ophævelse af
    forordning (EF) nr. 826/2004 om forbud mod import af atlantisk tun med oprindelse
    i Ækvatorialguinea og Sierra Leone og forordning (EF) nr. 828/2004 om forbud
    mod indførsel af atlantisk sværdfisk med oprindelse i Sierra Leone
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 919/2005 του Συμβουλίου,
    της 13ης Ιουνίου 2005, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 827/2004 για την απαγόρευση
    της εισαγωγής τόνου μεγαλόφθαλμου του Ατλαντικού,
    καταγωγής Καμπότζης, Ισημερινής Γουινέας και
    Σιέρα Λεόνε και την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 826/2004 για την απαγόρευση της εισαγωγής
    ερυθρού τόνου του Ατλαντικού καταγωγής Ισημερινής
    Γουινέας και Σιέρα Λεόνε και του κανονισμού
    (ΕΚ) αριθ. 828/2004 για την απαγόρευση των εισαγωγών
    ξιφία του Ατλαντικού, καταγωγής Σιέρα Λεόνε
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 919/2005, 13. juuni 2005, millega muudetakse
    määrust (EÜ) nr 827/2004 Kambodžast, Ekvatoriaal-Guineast ja Sierra Leonest
    pärit atlandi suursilm-tuuni impordi keelustamise osas ja tunnistatakse kehtetuks
    määrus (EÜ) nr 826/2004, millega keelatakse Ekvatoriaal-Guineast ja Sierra
    Leonest pärit hariliku tuuni import ja määrus (EÜ) nr 828/2004, millega keelatakse
    Sierra Leonest pärit mõõkkala import
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 919/2005, annettu 13 päivänä kesäkuuta 2005,
    asetuksen (EY) N:o 827/2004 muuttamisesta Kambodžasta, Päiväntasaajan Guineasta
    ja Sierra Leonesta peräisin olevan Atlantin isosilmätonnikalan (Thunnus obesus)
    tuonnin kieltämisen osalta sekä Päiväntasaajan Guineasta ja Sierra Leonesta
    peräisin olevan Atlantin tonnikalan (Thunnus thynnus) tuonnin kieltämisestä
    annetun asetuksen (EY) N:o 826/2004 ja Sierra Leonesta peräisin olevan Atlantin
    miekkakalan (Xiphias gladius) tuonnin kieltämisestä annetun asetuksen (EY) N:o
    828/2004 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 919/2005 od 13. lipnja 2005. o izmjeni Uredbe (EZ)
    br. 827/2004 o zabrani uvoza atlantskog velikookog tunja iz Kambodže, Ekvatorske
    Gvineje i Sijera Leonea, te stavljanju izvan snage Uredbe (EZ) br. 826/2004 o
    zabrani uvoza plavoperajnog tunja iz Ekvatorske Gvineje i Sijera Leonea i Uredbe
    (EZ) br. 828/2004 o zabrani uvoza igluna iz Sijera Leonea
  type: main
- language: hu
  script: Latn
  content: A Tanács 919/2005/EK rendelete (2005. június 13.) a Kambodzsából, Egyenlítői-Guineából
    és Sierra Leonéból származó atlanti nagyszemű tonhal behozatali tilalma
    tekintetében a 827/2004/EK rendelet módosításáról, valamint az Egyenlítői-Guineából
    és Sierra Leonéból származó kékúszójú tonhal behozatali tilalma tekintetében
    a 826/2004/EK rendelet és a Sierra Leonéból származó kardhal behozatali tilalma
    tekintetében a 828/2004/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 919/2005 del Consiglio, del 13 giugno 2005, che modifica
    il regolamento (CE) n. 827/2004 relativamente al divieto di importazione di tonno
    obeso dell’Atlantico originario della Cambogia, della Guinea equatoriale e della
    Sierra Leone e abroga il regolamento (CE) n. 826/2004 che vieta l’importazione
    di tonno rosso originario della Guinea equatoriale e della Sierra Leone e il regolamento
    (CE) n. 828/2004 che vieta l’importazione di pesce spada originario della Sierra
    Leone
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 919/2005 (2005. gada 13. jūnijs), ar ko groza
    Regulu (EK) Nr. 827/2004 attiecībā uz aizliegumu ievest Kambodžas, Ekvatoriālās
    Gvinejas un Sjerraleones izcelsmes Atlantijas lielacu tunzivis un atceļ Regulu
    (EK) Nr. 826/2004, ar ko aizliedz tādu Atlantijas zilo tunzivju importu, kuru
    izcelsme ir Ekvatoriālajā Gvinejā un Sjerraleonē, un Regulu (EK) Nr. 828/2004,
    ar ko aizliedz tādu Atlantijas zobenzivju importu, kuru izcelsme ir Sjerraleonē
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 13 d. Tarybos reglamentas (EB) Nr. 919/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 827/2004 dėl Atlanto didžiaakių tunų (Thunnus
    obesus) importo iš Kambodžos, Pusiaujo Gvinėjos ir Siera Leonės draudimo ir
    panaikinantis Reglamentą (EB) Nr. 826/2004, draudžiantį importuoti paprastuosius
    tunus (Thunnus thynnus) iš Pusiaujo Gvinėjos ir Siera Leonės, bei Reglamentą
    (EB) Nr. 828/2004, draudžiantį importuoti iš Siera Leonės durklažuves (Xiphias
    gladius)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 919/2005 tat- 13 ta' Ġunju 2005 li jemenda
    r-Regolament (KE) Nru 827/2004 fir-rigward tal-projbizzjoni ta' l-importazzjoni
    tat-tonn t' għajnu kbira ta' l-atlantiku impurtat mill-Kambodja, mill-Ginea Ekwatorjali
    u mis-Sierra Leone, u li jħassar ir-Regolament (KE) Nru 826/2004 li jiprojbixxi
    l-importazzjoni tat-tonn tax-xewka kaħla mill-Ginea Ekwatorjali u mis-Sierra
    Leone u r-Regolament (KE) Nru 828/2004 li jiprojbixxi l-importazzjoni tal-pixxispad
    mis-Sierra Leone
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 919/2005 van de Raad van 13 juni 2005 tot wijziging
    van Verordening (EG) nr. 827/2004 wat betreft het verbod op de invoer van grootoogtonijn
    uit Cambodja, Equatoriaal-Guinea en Sierra Leone, tot intrekking van Verordening
    (EG) nr. 826/2004 houdende een verbod op de invoer van Atlantische blauwvintonijn
    uit Equatoriaal-Guinea en Sierra Leone en tot intrekking van Verordening (EG)
    nr. 828/2004 houdende een verbod op de invoer van Atlantische zwaardvis uit Sierra
    Leone
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 919/2005 z dnia 13 czerwca 2005 r. zmieniające
    rozporządzenie (WE) nr 827/2004 w odniesieniu do zakazu przywozu opastuna pochodzącego
    z Kambodży, Gwinei Równikowej i Sierra Leone i uchylającego rozporządzenie
    (WE) nr 826/2004 zakazujące przywozu opastuna z Gwinei Równikowej i Sierra Leone
    oraz rozporządzenie (WE) nr 828/2004 zakazujące przywozu miecznika z Sierra
    Leone
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 919/2005 do Conselho, de 13 de Junho de 2005, que
    altera o Regulamento (CE) n.° 827/2004 no que respeita à importação de atum
    patudo do Atlântico do Camboja, da Guiné Equatorial e da Serra Leoa e que revoga
    o Regulamento (CE) n.° 826/2004 que proíbe a importação de atum rabilho da
    Guiné Equatorial e da Serra Leoa e o Regulamento (CE) n.° 828/2004 que proíbe
    a importação de peixe espada originário da Serra Leoa
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 919/2005 al Consiliului din 13 iunie 2005 de modificare
    a Regulamentului (CE) nr. 827/2004 de interzicere a importurilor de ton obez din
    Atlantic originar din Cambodgia, Guineea Ecuatorială și Sierra Leone și de
    abrogare a Regulamentului (CE) nr. 826/2004 de interzicere a importului de ton
    roșu originar din Guineea Ecuatorială și Sierra Leone și a Regulamentului
    (CE) nr. 828/2004 de interzicere a importului de pește spadă originar din Sierra
    Leone
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 919/2005 z 13. júna 2005, ktorým sa mení a
    dopĺňa nariadenie (ES) č. 827/2004, pokiaľ ide o zákaz dovozu tuniaka zavalitého
    (Thunnus obesus) s pôvodom v Kambodži, v Rovníkovej Guinei a v Sierra Leone,
    a ktorým sa zrušuje nariadenie (ES) č. 826/2004, ktorým sa zakazuje dovoz
    tuniaka modroplutvého (Thunnus thynnus) pochádzajúceho z Rovníkovej Guiney
    a zo Sierra Leony a nariadenie (ES) č. 828/2004, ktorým sa zakazuje dovoz mečiara
    obyčajného (Xiphias gladius) s pôvodom v Sierra Leone
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 919/2005 z dne 13. junija 2005 o spremembi Uredbe
    (ES) št. 827/2004 v zvezi s prepovedjo uvoza atlantskega veleokega tuna iz Kambodže,
    Ekvatorialne Gvineje in Sierre Leone ter razveljavitvi Uredbe (ES) št. 826/2004
    o prepovedi uvoza modroplavutih tunov iz Ekvatorialne Gvineje in Sierre Leone
    in Uredbe (ES) št. 828/2004 o prepovedi uvoza mečarice iz Sierre Leone
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 919/2005 del Consejo, de 13 de junio de 2005, por el
    que se modifica el Reglamento (CE) n° 827/2004 en lo que respecta a la prohibición
    de importar patudo del Atlántico de Camboya, Guinea Ecuatorial y Sierra Leona,
    y se derogan el Reglamento (CE) n° 826/2004, por el que se prohíbe la importación
    de atún rojo originario de Guinea Ecuatorial y Sierra Leona, y el Reglamento
    (CE) n° 828/2004, por el que se prohíbe la importación de pez espada originario
    de Sierra Leona
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 919/2005 av den 13 juni 2005 om ändring av
    förordning (EG) nr 827/2004 rörande förbud mot import av storögd tonfisk från
    Ekvatorialguinea, Kambodja och Sierra Leone samt om upphävande av förordning
    (EG) nr 826/2004 rörande förbud mot import av blåfenad tonfisk från Ekvatorialguinea
    och Sierra Leone och förordning (EG) nr 828/2004 rörande förbud mot import
    av svärdfisk från Sierra Leone
