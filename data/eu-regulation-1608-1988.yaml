    n° 29 (numéro d' ordre 40.0290), aux costumes tailleur et ensembles, en bonneterie,
    pour femmes ou fillettes, de la catégorie de produits n° 74 (numéro d' ordre
    40.0740), et aux vêtements, autres qu' en bonneterie, de la catégorie de produits
    n° 78 (numéro d' ordre 40.0780), originaires du Pakistan, bénéficiaire des
