title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1608/88 of 9 June 1988 re-establishing the
    levying of customs duties on women' s or girls' suits and ensembles other than
    knitted or crocheted, products of category 29 (order No 40.0290), women' s or
    girls' knitted or crocheted suits and ensembles, products of category 74 (order
    No 40.0740) and garments, other than knitted or crocheted, products of category
    78 (order No 40.0780), originating in Pakistan, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
