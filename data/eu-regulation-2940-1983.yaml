title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2940/83 of 20 October 1983 re-establishing
    the levying of customs duties on builders' carpentry, falling within heading No
    44.23 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2940/83 de la Commission du 20 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de menuiserie, de la position 44.23 du tarif douanier commun, originaires de Singapour,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2940/83 der Kommission vom 20. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Bautischlerarbeiten der Tarifnummer 44.23, mit Ursprung
    in Singapur, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2940/83 af 20. oktober 1983 om genindførelse
    af opkrævning af told for tømrerarbejder henhørende under pos. 44.23 og med
    oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
