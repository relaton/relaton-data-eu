    Gemeinsamen Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3670/86 af 1. december 1986 om genindførelse
