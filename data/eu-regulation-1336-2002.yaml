title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1336/2002 of 23 July 2002 specifying the
    extent to which applications lodged in July 2002 for import rights in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1336/2002 de la Commission du 23 juillet 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juillet 2002 pour les jeunes bovins mâles destinés à
    l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1336/2002 der Kommission vom 23. Juli 2002 über das
    Ausmaß, in dem den im Juli 2002 eingereichten Anträgen auf Einfuhrrechte für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1336/2002 af 23. juli 2002 om fastsættelse
    af, i hvilket omfang ansøgninger om importrettigheder, som er indsendt i juli
    2002 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1336/2002 της Επιτροπής,
