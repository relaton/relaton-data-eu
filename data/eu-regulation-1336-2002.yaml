    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    δικαίωμα εισαγωγής που υποβλήθηκαν τον Ιούλιο
    2002 για τα νεαρά άρρενα βοοειδή που προορίζονται
    για πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1336/2002, annettu 23 päivänä heinäkuuta
