    esitettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1336/2002 della Commissione, del 23 luglio 2002, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto d'importazione
    presentate nel mese di luglio 2002 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
