title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2040/72 de la Commission, du 26 septembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux accumulateurs électriques au plomb de la sous-position tarifaires 85.04 A,
    originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre
    1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2040/72 der Kommission vom 26. September 1972 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für elektrische Akkumulatoren
    aus Blei, der Tarifstelle 85.04 A, mit Ursprung in Entwicklungsländern, denen
    die in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2040/72 della Commissione, del 26 settembre 1972,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    agli accumulatori elettrici al piombo della sottovoce doganale n. 85.04 A originari
    dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2040/72 van de Commissie van 26 september 1972 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor elektrische accumulatoren met loden platen, van onderverdeling 85.04 A, van
    oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG)
    nr. 2795/71 van de Raad van 20 december 1971 tariefpreferenties werden geopend
  type: main
