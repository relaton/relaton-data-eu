    or prevention, presented by the Netherlands (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/75/CEE: Décision de la Commission, du 1er février 1991, approuvant
    des actions visant à l''établissement de projets pilotes destinés à lutter
    contre la rage en vue de son éradication ou de sa prévention présentés par
    les Pays-Bas (Le texte en langue néerlandaise est le seul faisant foi)'
