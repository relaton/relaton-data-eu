title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2420/80 of 19 September 1980 re-establishing
    the levying of customs duties on phosphates of sodium, falling within subheading
    28.40 B ex II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2420/80 de la Commission, du 19 septembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux phosphates
    de sodium, de la sous-position 28.40 B ex II du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2420/80 der Kommission vom 19. September 1980 zur
    Wiedereinführung des Zollsatzes für Phosphate des Natriums der Tarifstelle 28.40
    B ex II, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2789/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2420/80 af 19. september 1980 om genindførelse
    af opkrævning af toldafgifter for phosphater af natrium, under pos. 28.40 B ex
    II, som har oprindelse i Rumænien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2420/80 della Commissione, del 19 settembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili ai fosfati di sodio
    della sottovoce 28.40 B ex II della tariffa doganale comune, originari della Romania,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2420/80 van de Commissie van 19 september 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op natriumfosfaten,
    van post 28.40 B ex II, van oorsprong uit Roemenië ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
