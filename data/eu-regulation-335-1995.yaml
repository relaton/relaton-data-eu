  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 335/95 DE LA COMISIÓN de 17 de febrero de 1995 por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de animales vivos de la especie bovina con un peso entre 160 y
    300 kilogramos, presentadas en enero de 1995 dentro de la cuota de importación
    establecida en los Acuerdos europeos celebrados entre la Comunidad y la República
    de Polonia, la República de Hungría, la República Checa y la República Eslovaca
  type: main
