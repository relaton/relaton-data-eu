title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 335/95 of 17 February 1995 determining to
    what extent licence applications submitted during January 1995 for live bovine
    animals weighing between 160 and 300 kg as part of an import quota provided for
    under European agreements concluded between the Community and the Republic of
    Poland, the Republic of Hungary, the Czech Republic and the Slovak Republic may
    be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 335/95 DE LA COMMISSION du 17 février 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1995 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un quota d'importation prévu
    par les accords européens conclus par la Communauté avec la république de Pologne,
    la république de Hongrie, la République tchèque et la République slovaque
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 335/95 DER KOMMISSION vom 17. Februar 1995 zur Festsetzung
    des Umfangs, in dem die im Januar 1995 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder gemäß den Europa-Abkommen zwischen der Gemeinschaft und der
    Republik Polen, der Republik Ungarn, der Tschechischen Republik und der Slowakischen
    Republik beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 335/95 af 17. februar 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i januar 1995 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et importkontingent, der er fastsat i Europaaftalerne mellem Fællesskabet
    og Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik og Den Slovakiske
    Republik
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 335/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Φεβρουαρίου 1995 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιανουάριο 1995 για ζωντανά ζώα
    του βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας ποσόστωσης εισαγωγής η οποία
    προβλέπεται από τις ευρωπαϊκές συμφωνίες που
    έχουν συναφθεί μεταξύ, αφενός, της Κοινότητας
    και, αφετέρου, της Δημοκρατίας της Πολωνίας,
    της Δημοκρατίας της Ουγγαρίας, της Τσεχικής
    Δημοκρατίας και της Σλοβακικής Δημοκρατίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 335/95, annettu 17 päivänä helmikuuta 1995,
    eläviä 160@300 kilogrammaa painavia nautaeläimiä koskevien tammikuussa 1995
    jätettyjen tuontilupahakemusten hyväksyttävyydestä yhteisön ja Puolan tasavallan,
    Unkarin tasavallan, Tsekin tasavallan ja Slovakian tasavallan välillä tehdyissä
    väliaikaisissa sopimuksissa määriteltyjen tuontikiintiöiden rajoissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 335/95 DELLA COMMISSIONE del 17 febbraio 1995 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel mese di gennaio 1995 per gli animali vivi della specie bovina, dai 160 ai
    300 chilogrammi, nel quadro del contingente di importazione previsto dagli accordi
    europei conclusi dalla Comunità con la Repubblica di Polonia, la Repubblica d'Ungheria,
    la Repubblica Ceca e la Repubblica Slovacca
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 335/95 VAN DE COMMISSIE van 17 februari 1995 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor levende runderen met een gewicht van 160 tot 300 kg, die in januari 1995
    zijn ingediend op grond van de invoerregeling die is vastgesteld in de door de
    Gemeenschap met de Republiek Polen, de Republiek Hongarije, de Tsjechische Republiek
    en de Slowaakse Republiek gesloten Europa-Overeenkomsten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 335/95 DA COMISSÃO de 17 de Fevereiro de 1995 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
