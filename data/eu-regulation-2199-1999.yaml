    κανονισμού (ΕΚ) αριθ. 1729/1999 για ειδικά μέτρα
    παρέκκλισης από τους κανονισμούς (ΕΟΚ) αριθ.
    3665/87 και (ΕΟΚ) αριθ. 3719/88 όσον αφορά το γάλα και
    τα γαλακτοκομικά προϊόντα, το βόειο κρέας,
    το χοίρειο κρέας, τα αυγά, το κρέας πουλερικών,
    μερικά προϊόντα δημητριακών και γεωργικά προϊόντα
    που εξάγονται υπό μορφή ειδών μη καλυπτόμενων
    από το παράρτημα Ι της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2199/1999, annettu 15 päivänä lokakuuta 1999,
    maitoa ja maitotuotteita, naudanlihaa, sianlihaa, munia, siipikarjanlihaa, perustamissopimuksen
    liitteeseen I kuulumattomina tavaroina vietyjä maataloustuotteita sekä tiettyjä
    viljatuotteita koskevista asetusten (ETY) N:o 3665/87 ja (ETY) N:o 3719/88 säännöksistä
