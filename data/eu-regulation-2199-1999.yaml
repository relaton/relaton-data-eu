  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2199/1999 della Commissione, del 15 ottobre 1999, che
    modifica il regolamento (CE) n. 1729/1999 recante misure speciali in deroga ai
    regolamenti (CEE) n. 3665/87 e (CEE) n. 3719/88 per quanto riguarda il latte e
    i prodotti lattiero-caseari, le carni bovine, le carni suine, le uova, le carni
    di pollame, i prodotti agricoli esportati sotto forma di merci non comprese nell'allegato
    I del trattato e taluni prodotti del settore dei cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2199/1999 van de Commissie van 15 oktober 1999 tot
    wijziging van Verordening (EG) nr. 1729/1999 houdende bijzondere maatregelen tot
    afwijking van de Verordeningen (EEG) nr. 3665/87 en (EEG) nr. 3719/88 ten aanzien
    van melk en zuivelproducten, rundvlees, varkensvlees, eieren, slachtpluimvee,
    in de vorm van niet onder bijlage I bij het Verdrag vallende goederen geëxporteerde
    landbouwproducten en bepaalde producten van de sector granen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2199/1999 da Comissão, de 15 de Outubro de 1999,
    que altera o Regulamento (CE) n° 1729/1999 que estabelece medidas especiais de
    derrogação dos Regulamentos (CEE) n° 3665/87 e (CEE) n° 3719/88 no que respeita
    ao leite e produtos lácteos, à carne de bovino, à carne de suíno, aos ovos,
    à carne de aves de capoeira, aos produtos agrícolas exportados na forma de mercadorias
    não abrangidas pelo anexo I do Tratado e certos produtos do sector dos cereais
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2199/1999 de la Comisión, de 15 de octubre de 1999,
    por el que se modifica el Reglamento (CE) nº 1729/1999 por el que se establecen
    medidas especiales de inaplicación de los Reglamentos (CEE) nos 3665/87 y 3719/88
    en lo que respecta a la leche, los productos lácteos, la carne de vacuno y de
    porcino, los huevos y la carne de aves de corral, los productos agrícolas exportados
    en forma de mercancías no incluidas en el anexo I del Tratado y determinados
    productos del sector de cereales
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2199/1999 av den 15 oktober 1999 om ändring
    av förordning (EG) nr 1729/1999 om fastställande av särskilda undantag från
    förordningarna (EEG) nr 3665/87 och (EEG) nr 3719/88 när det gäller mjölk
    och mjölkprodukter, nöt-, kalv- och griskött, ägg, fjäderfäkött och jordbruksprodukter
    som exporteras i form av varor som inte omfattas av bilaga I till fördraget,
    och vissa produkter inom spannmålssektorn
