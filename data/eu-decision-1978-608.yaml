---
id: EUDecision1978608
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 July 1978 authorizing the Italian Republic not
    to apply Community treatment to spoons, forks, fish-eaters, butter-knives, ladles
    and similar kitchen or tableware, falling within heading No 82.14 of the Common
    Customs Tariff, originating in Japan and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/608/CEE: Décision de la Commission, du 6 juillet 1978, autorisant
    la République italienne à exclure du traitement communautaire les cuillers,
    louches, fourchettes, pelles à tartes, couteaux spéciaux à poisson ou à beurre,
    pinces à sucre et articles similaires, de la position 82.14 du Tarif douanier
    commun, originaires du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. Juli 1978, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Löffel, Schöpfkellen, Gabeln, Tortenschaufeln,
    Fischmesser, Buttermesser, Zuckerzangen und ähnliche Tischgeräte der Tarifnummer
    82.14 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 6. juli 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage skeer, gafler, fiskeknive,
    smørknive, potageskeer og lignende artikler til køkken og bordbrug, som henhører
    under pos. 82.14 i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 luglio 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario cucchiai, cucchiaioni, forchette,
    palette da torta, coltelli speciali da pesce o da burro, pinze da zucchero o oggetti
    similari della voce 82.14 della tariffa doganale comune, originari del Giappone
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 juli 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd lepels, pollepels, vorken, taartscheppen, vismessen en botermesjes,
    suikertangen en dergelijke artikelen van post 82.14 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
