- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3190/81 of 9 November 1981 re-establishing
    the levying of customs duties on carbonates of barium falling within subheading
    28.42 A ex VII, and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3190/81 de la Commission, du 9 novembre 1981, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de baryum de la sous-position 28.42 A ex VII du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues au règlement (CEE)
    n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3190/81 der Kommission vom 9. November 1981 zur Wiedereinführung
