    VII, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3190/81 af 9. november 1981 om genindførelse
