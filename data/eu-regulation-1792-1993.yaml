    importordning for konserves af visse arter af tunfisk, bonit og sardin og om fastsættelse
    af de mængder af samme produkter, der kan indføres i 1993, og om ændring af
    de særlige bestemmelser for udstedelse af importdokumenter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1792/93 της Επιτροπής
