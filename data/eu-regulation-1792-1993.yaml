  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1792/93, annettu 30 päivänä kesäkuuta 1993,
    eräiden tonnikala-, boniitti- ja sardiinilajien säilykkeiden yhteisön tuontijärjestelmän
    soveltamisen yksityiskohtaisista erityissäännöistä ja kyseisten tuotteiden
    sallituista tuontimääristä vuodelle 1993 annetun asetuksen (ETY) N:o 3900/92
    muuttamisesta sekä tuontiasiakirjojen myöntämistä koskevien erityissäännösten
    antamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1792/93 della Commissione, del 30 giugno 1993, che
    modifica il regolamento (CEE) n. 3900/92 che stabilisce le modalità particolari
    di applicazione del regime comunitario di importazione per le conserve di talune
    specie di tonno, di palamita e di sardine e che fissa i quantitativi di tali prodotti
    ammessi all'importazione per il 1993 e che reca adozione delle disposizioni particolari
    relative al rilascio dei documenti d'importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1792/93 van de Commissie van 30 juni 1993 tot wijziging
    van Verordening (EEG) nr. 3900/92 houdende uitvoeringsbepalingen van de communautaire
    invoerregeling voor conserven van bepaalde soorten tonijn, boniet en sardines,
    alsmede de hoeveelheden van deze produkten die in 1993 mogen worden ingevoerd
    en tot vaststelling van bijzondere bepalingen voor de afgifte van de invoerdocumenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1792/93 da Comissão, de 30 de Junho de 1993, que
    altera o Regulamento (CEE) nº 3900/92, que estabelece as normas de execução
    específicas do regime comunitário de importação de conservas de determinadas
    espécies de atum, de bonito e de sardinha e fixa as quantidades destes produtos
    admitidas para importação em 1993, e adopta disposições específicas para
    a emissão dos documentos de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1792/93 de la Comisión, de 30 de junio de 1993, por
    el que se modifica el Reglamento (CEE) nº 3900/92 por el que se establecen las
    disposiciones especiales de aplicación del régimen comunitario de importación
    de conservas de determinadas especies de atún, bonito y sardina y por el que
    se fijan las cantidades de estos productos que se admiten para importación en
    1993, y establece disposiciones especiales de expedición de los documentos de
    importación
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 1792/93 av den 30 juni 1993 om ändring
    av förordning (EEG) nr 3900/92 om särskilda bestämmelser för tillämpningen
    av gemenskapens importordning för vissa arter av konserverad tonfisk, bonit och
    sardiner och fastställande av vilka kvantiteter av dessa produkter som får importeras
    under 1993, och om särskilda bestämmelser för utfärdande av importdokument
