    (ΕΟΚ) αριθ. 3900/92 για τη θέσπιση των ειδικών λεπτομερειών
    εφαρμογής του κοινοτικού καθεστώτος εισαγωγής
    κονσερβών τόνου, παλαμίδας και σαρδέλλας και
    για τον καθορισμό των ποσοτήτων των εν λόγω
