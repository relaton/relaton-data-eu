title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1792/93 of 30 June 1993 amending Regulation
    (EEC) No 3900/92 layig down the special rules of application for the Community
    import arrangements for certain species of preserved tuna, bonito and sardines
    and fixing the quantities of those products which may be imported during 1993
    and laying down special rules for issuing import documents
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1792/93 de la Commission, du 30 juin 1993, modifiant
    le règlement (CEE) n 3900/92 établissant les modalités d'application particulières
    du régime communautaire d'importation de conserves de certaines espèces de thon,
    de bonites et de sardines et fixant les quantités de ces produits admises à
    l'importation pour 1993, et arrêtant des dispositions particulières pour la
    délivrance des documents d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1792/93 der Kommission vom 30. Juni 1993 zur Änderung
    der Verordnung (EWG) Nr. 3900/92 mit besonderen Durchführungsbestimmungen zu
    der Einfuhrregelung für bestimmte Thunfisch-, Bonito- und Sardinenkonserven und
    zur Festsetzung der zugelassenen Einfuhrmengen für 1993 und zur Festsetzung besonderer
    Vorschriften für die Ausstellung der Einfuhrdokumente
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1792/93 af 30. juni 1993 om ændring
