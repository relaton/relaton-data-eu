title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1210/91 of 6 May 1991 re- establishing the
    levying of customs duties on products falling within CN codes 8527, 8528 and 8529,
    originating in Malaysia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1210/91 DE LA COMMISSION du 6 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 8527,
    8528 et 8529, originaires de la Malaysia, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1210/91 DER KOMMISSION vom 6. Mai 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 8527, 8528 und 8529 mit Ursprung
    in Malaysia, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1210/91 af 6. maj 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8527, 8528 og 8529
    og med oprindelse i Malaysia, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1210/91 της Επιτροπής
    της 6ης Μαΐου περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για προϊόντα των κωδικών
    ΣΟ 8527, 8528 και 8529, καταγωγής Μαλαισίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1210/91 DELLA COMMISSIONE del 6 maggio 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti dei codici NC 8527, 8528
    e 8529, originari della Malaysia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1210/91 VAN DE COMMISSIE van 6 mei 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepasing op produkten van
    de GN-codes 8527, 8528 en 8529, van oorsprong uit Maleisië, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1210/91 DA COMISSÃO de 6 de Maio de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos NC 8527,
    8528 e 8529, originários da Malásia, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
