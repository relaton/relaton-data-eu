title:
- language: en
  script: Latn
  content: '81/805/EEC: Commission Decision of 17 July 1981 authorizing the French
    Republic not to apply Community treatment to radio receivers, whether or not incorporating
    sound recorders or reproducers, originating in Taiwan, Hong Kong and Japan (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/805/CEE: Décision de la Commission, du 17 juillet 1981, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de radio, même combinés avec un appareil d''enregistrement ou de
    reproduction du son, originaires de T''ai-wan, de Hong-kong et du Japon (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/805/EWG: Entscheidung der Kommission vom 17. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan, Hongkong und Japan stammende Rundfunkempfangsgeräte
    (einschließlich der kombinierten Empfänger) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/805/EØF: Kommissionens beslutning af 17. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage radiomodtagere
    også kombineret med lydoptagere eller lydgengivere med oprindelse i Taiwan, Hongkong
    og Japan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/805/EOK: Απόφαση τής Επιτροπής τής 17ης Ιουλίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τίς συσκευές λήψεως ραδιοφώνου, έστω καί συνδυασμένες
    μέ συσκευές καταγραφής ή αναπαραγωγής τού
    ήχου καταγωγής Ταϊβάν, Χόνγκ Κόνγκ καί Ιαπωνίας
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/805/CEE: Decisione della Commissione, del 17 luglio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi per la radiodiffusione, anche combinati con un apparecchio di registrazione
    o di riproduzione del suono, originari di Taiwan, di Hong Kong e del Giappone
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/805/EEG: Beschikking van de Commissie van 17 juli 1981 houdende machtiging
    van de Franse Republiek om ontvangtoestellen voor radio''s ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid van oorsprong uit Taiwan,
    Hong-Kong en Japan van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
