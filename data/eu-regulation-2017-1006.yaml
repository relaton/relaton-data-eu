title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/1006 of 15 June 2017 amending
    Implementing Regulation (EU) No 1206/2012 as regards the change of the production
    strain of the preparation of endo-1,4-beta-xylanase, produced by Aspergillus oryzae
    (DSM 10287) as feed additive for poultry for fattening, weaned piglets and pigs
    for fattening (holder of authorisation DSM Nutritional Products Ltd)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/1006 de la Commission du 15 juin 2017
    modifiant le règlement d''exécution (UE) n° 1206/2012 en vue du changement
    de la souche de production de la préparation d''endo-1,4-β-xylanase produite
    par Aspergillus oryzae (DSM 10287) et utilisée en tant qu''additif pour l''alimentation
    des volailles à l''engrais, des porcelets sevrés et des porcs à l''engrais
    (titulaire de l''autorisation: DSM Nutritional Products Ltd)'
  type: main
