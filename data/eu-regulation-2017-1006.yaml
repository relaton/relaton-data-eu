    törzs megváltoztatásának tekintetében történő módosításáról (az engedély
    jogosultjának neve: DSM Nutritional Products Ltd.)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/1006 della Commissione, del 15 giugno
    2017, che modifica il regolamento di esecuzione (UE) n. 1206/2012 della Commissione
    per quanto riguarda la modifica del ceppo produttore del preparato di endo-1,4-beta-xilanasi
    prodotta da Aspergillus oryzae (DSM 10287) come additivo per mangimi destinati
    a pollame da ingrasso, suinetti svezzati e suini da ingrasso (titolare dell'autorizzazione
    DSM Nutritional Products Ltd.)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/1006 (2017. gada 15. jūnijs),
