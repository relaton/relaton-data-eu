    iegūtas endo-1,4-beta-ksilanāzes preparātam kā barības piedevai gaļas mājputniem,
    atšķirtiem sivēniem un gaļas cūkām (atļaujas turētājs – DSM Nutritional
    Products Ltd) groza Īstenošanas regulu (ES) Nr. 1206/2012
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 15 d. Komisijos įgyvendinimo reglamentas (ES) 2017/1006,
    kuriuo dėl endo-1,4-beta-ksilanazės preparatui, naudojamam kaip mėsinių naminių
    paukščių, nujunkytų paršelių ir penimųjų kiaulių pašarų priedui, gaminti
    naudojamos Aspergillus oryzae padermės (DSM 10287) (leidimo turėtojas – „DSM
    Nutritional Products“) pakeitimo iš dalies keičiamas Įgyvendinimo reglamentas
    (ES) Nr. 1206/2012
  type: main
