  content: Council Regulation ( EEC ) No 190/92 of 27 January 1992 opening and providing
    for the administration of a Community tariff quota for fresh strawberries originating
    in the Occupied Territories and laying down the procedure applicable to certain
    agricultural products subject to reference quantities originating in the said
    territories ( 1992 )
  type: main
