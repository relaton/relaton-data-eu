  content: '85/109/EEC: Commission Decision of 15 January 1985 amending Decision 81/92/EEC
    as regards the list of establishments in Uruguay approved for the purpose of importing
    fresh meat into the Community'
  type: main
- language: fr
  script: Latn
  content: '85/109/CEE: Décision de la Commission du 15 janvier 1985 modifiant la
