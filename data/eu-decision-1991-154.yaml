title:
- language: en
  script: Latn
  content: '91/154/EEC: Commission Decision of 1 March 1991 authorizing the Kingdom
    of Spain to apply intra- Community surveillance to textile products falling with
    category 117, originating in the USSR, which have been put into free circulation
    in the Community (only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/154/CEE: Décision de la Commission du 1er mars 1991 autorisant le
    Royaume d''Espagne à instituer une surveillance intracommunautaire pour les produits
    textiles de la catégorie 117 originaires de l''Union soviétique mis en libre
    pratique dans la Communauté (Le texte en langue espagnole est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 1. März 1991 zur Ermächtigung des Königreichs
    Spanien zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    bestimmter aus der UdSSR stammender und in der Gemeinschaft im freien Verkehr
    befindlicher Textilwaren der Kategorie 117 (Nur der spanische Text ist verbindlich)
    (91/154/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 1. marts 1991 om bemyndigelse af Kongeriget
    Spanien til at indføre tilsyn inden for Fællesskabet med indførslen af tekstilvarer,
    henhørende under kategori 117, der har oprindelse i Sovjetunionen og er overgået
    til fri omsætning i Fællesskabet (Kun den spanske udgave er autentisk) (91/154/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '91/154/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Μαρτίου
    1991 που εξουσιοδοτεί το Βασίλειο της Ισπανίας
    να θεσπίσει ενδοκοινοτική επιτήρηση για τα
    κλωστοϋφαντουργικά προϊόντα της κατηγορίας
    117 καταγωγής Σοβιετικής Ένωσης που τίθενται
    σε ελεύθερη κυκλοφορία στην Κοινότητα'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 1o marzo 1991 che autorizza il Regno di
    Spagna ad istituire una sorveglianza intracomunitaria per i prodotti tessili della
    categoria 117 originari dell'' Unione Sovietica immessi in libera pratica nella
    Comunità (Il testo in lingua spagnola è il solo facente fede) (91/154/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 1 maart 1991 houdende machtiging van
    het Koninkrijk Spanje tot instelling van een intracommunautair toezicht op textielprodukten
    van categorie 117, van oorsprong uit de USSR, die in de Gemeenschap in het vrije
    verkeer zijn gebracht (Slechts de tekst in de Spaanse taal is authentiek) (91/154/EEG)
    #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 1 de Março de 1991 que autoriza o Reino de Espanha
    a proceder a uma vigilância intracomunitária das importações dos produtos
    têxteis da categoria 117, originários da União Soviética e introduzidos em
    livre prática na Comunidade (Apenas faz fé o texto em língua espanhola) (91/154/CEE)
    #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 1 de marzo de 1991 por la que se autoriza
    al Reino de España a establecer medidas de vigilancia intracomunitaria en relación
    con las importaciones de determinados productos textiles de la categoría 117,
    originarios de la Unión Soviética y despachados a libre práctica en la Comunidad
    (El texto en lengua española es el único auténtico) (91/154/CEE) #'
