title:
- language: fr
  script: Latn
  content: Décision de la Commission 64/249/CEE, du 8 avril 1964, relative au recours
    de la République italienne à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et transformés
    ou mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/249/EWG: Entscheidung der Kommission vom 8. April 1964 über die Inanspruchnahme
    von Artikel 115 Absatz (1) des Vertrages durch die Italienische Republik, um bestimmte
    aus dritten Ländern stammende und in den übrigen Mitgliedstaaten verarbeitete
    oder im freien Verkehr befindliche Waren von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/249/CEE: Decisione della Commissione, dell''8 aprile 1964, relativa
    alla richiesta presentata dalla Repubblica italiana perché - in applicazione
    dell''articolo 115, comma 1 del Trattato - vengano esclusi dal trattamento comunitario
    alcuni prodotti originari dei paesi terzi e lavorati o immessi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/249/EEG: Beschikking van de Commissie van 8 april 1964 betreffende
    het verzoek van de Italiaanse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten van oorsprong uit derde landen, die in de andere
    Lid-Staten zijn verwerkt of in het vrije verkeer zijn gebracht, van communautaire
    behandeling uit te sluiten'
  type: main
