  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2480/87 della Commissione, del 14 agosto 1987, recante
    quarta modifica del regolamento (CEE) n. 2196/87 che istituisce una tassa di compensazione
    all'importazione di limoni freschi originari della Spagna (eccetto le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2480/87 van de Commissie van 14 augustus 1987 tot
