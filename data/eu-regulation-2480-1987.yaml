  content: Commission Regulation (EEC) No 2480/87 of 14 August 1987 amending Regulation
    (EEC) No 2196/87 introducing a countervailing charge for the fourth time on fresh
    lemons originating in Spain (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2480/87 de la Commission, du 14 août 1987, modifiant
    pour la quatrième fois le règlement (CEE) n 2196/87 instituant une taxe compensatoire
    à l'importation de citrons frais originaires d'Espagne (excepté les îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2480/87 der Kommission vom 14. August 1987 zur vierten
    Änderung der Verordnung (EWG) Nr. 2196/87 zur Einführung einer Ausgleichsabgabe
    auf die Einfuhr von frischen Zitronen mit Ursprung in Spanien (mit Ausnahme der
    Kanarischen Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2480/87 af 14. august 1987 om fjerde
    ændring af forordning (EØF) nr. 2196/87 om opkrævning af en udligningsafgift
    ved indførsel af friske citroner med oprindelse i Spanien (undtagen De Kanariske
    Øer)
  type: main
- language: el
  script: Grek
