    μέ τήν ονομασία «ABS — Electronic Motorless Magnetic Stirrer»
    δέν δύναται νά πραγματοποιηθεί ατελώς ως πρός
    τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/381/CEE: Decisione della Commissione, del 19 maggio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "ABS - Electronic Motorless Magnetic
    Stirrer" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/381/EEG: Beschikking van de Commissie van 19 mei 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,A.B.S.-Electronic Motorless Magnetic Stirrer"
    niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag
    worden ingevoerd'
  type: main
