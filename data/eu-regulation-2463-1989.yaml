title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2463/89 of 10 August 1989 re-establishing
    the levying of customs duties on trousers, knitted or crocheted, products of category
    28 (order No 40.0280), babies'garments, products of category 68 (order No 40.0680),
    and nets and netting, cordage or rope, products of category 97 (order No 40.0970),
    originating in Thailand, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2463/89 de la Commission du 10 août 1989 portant
    rétablissement de la perception des droits de douane applicables aux pantalons
    de bonneterie de la catégorie de produits n° 28 (numéro d'ordre 40.0280), aux
    vêtements pour bébés de la catégorie de produits n° 68 (numéro d'ordre 40.0680)
    et aux filets de ficelles, cordes ou cordages de la catégorie de produits n°
    97 (numéro d'ordre 40.0970), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2463/89 DER KOMMISSION vom 10. August 1989 zur Wiedereinführung
    des Zollsatzes für lange Hosen aus Gewirken der Warenkategorie Nr. 28 (lfd. Nr.
    40.0280); Säuglingskleidung der Warenkategorie Nr. 68 (lfd. Nr. 40.0680) sowie
    Netze, Seite oder Taue der Warenkategorie Nr. 97 (lfd. Nr. 40.0970) mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2463/89 af 10. august 1989 om genindførelse
    af opkrævning af toldafgifter for benklæder af trikotage, under varekategori
    nr. 28 (løbenummer 40.0280), beklædningsgenstande til spædbørn, under varekategori
    nr. 68 (løbenummer 40.0680), samt knyttede netstoffer reb og tovværk, under
    varekategori nr. 97 (løbenummer 40.0970), som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
