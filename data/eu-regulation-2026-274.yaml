  content: Commission Implementing Regulation (EU) 2026/274 of 5 February 2026 amending
    Implementing Regulation (EU) 2025/1981 imposing a definitive anti-dumping duty
    on imports of ceramic tableware and kitchenware originating in the People's Republic
    of China following an expiry review pursuant to Article 11(2) of Regulation (EU)
    2016/1036 of the European Parliament and of the Council, following a partial interim
    review pursuant to Article 11(3) of Regulation (EU) 2016/1036
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/274 de la Commission du 5 février
    2026 modifiant le règlement d’exécution (UE) 2025/1981 instituant un droit
    antidumping définitif sur les importations d’articles en céramique pour la
    table et la cuisine originaires de la République populaire de Chine à l’issue
    d’un réexamen au titre de l’expiration des mesures effectué conformément
    à l’article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil et d’un réexamen intermédiaire partiel effectué conformément
    à l’article 11, paragraphe 3, du règlement (UE) 2016/1036
  type: main
