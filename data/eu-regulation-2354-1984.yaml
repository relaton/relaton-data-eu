title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2354/84 of 13 August 1984 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III and originating in Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2354/84 de la Commission du 13 août 1984 portant rétablissement
    de la perception des droits de douane applicables à l' acide glutamique et ses
    sels, de la sous-position 29.23 D III du tarif douanier commun, originaires de
    l' Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2354/84 der Kommission vom 13. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für Glutaminsäure und ihre Salze der Tarifstelle 29.23
    D III mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3569/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2354/84 af 13. august 1984 om genindførelse
    af opkrævning af told for glutaminsyre samt salte deraf, henhørende under pos.
    29.23 D III og med oprindelse i Indonesien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2354/84 της Επιτροπής
    της 13ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για το γλουταμινικόν
    οξύ και τα άλατα αυτού της διακρίσεως 29.23 Δ
    ΙΙΙ του Κοινού Δασμολογίου, καταγωγής Ινδονησίας,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2354/84 della Commissione del 13 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili all' acido glutammico e suoi sali
    della sottovoce 29.23 D III della tariffa doganale comune, originari dell' Indonesia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2354/84 van de Commissie van 13 augustus 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op glutaminezuur
    en zouten daarvan, van postonderverdeling 29.23 D III, van oorsprong uit Indonesië,
    waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
