    na certifikáty, mení nariadenie (ES) č. 2074/2005 a zrušuje rozhodnutie 2003/812/ES
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/759 z dne 28. aprila 2016 o pripravi
