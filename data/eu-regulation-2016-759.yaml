    países y territorios desde los cuales los Estados miembros deben autorizar la
    introducción en la Unión de determinados productos de origen animal destinados
    al consumo humano, se establecen los requisitos relativos a los certificados,
    se modifica el Reglamento (CE) n.° 2074/2005 y se deroga la Decisión 2003/812/CE
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/759 av den 28 april 2016
