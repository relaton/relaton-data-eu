title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/759 of 28 April 2016 drawing
    up lists of third countries, parts of third countries and territories from which
    Member States are to authorise the introduction into the Union of certain products
    of animal origin intended for human consumption, laying down certificate requirements,
    amending Regulation (EC) No 2074/2005 and repealing Decision 2003/812/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/759 de la Commission du 28 avril 2016
    établissant les listes des pays tiers, parties de pays tiers et territoires en
    provenance desquels les États membres doivent autoriser l'introduction dans l'Union
    de certains produits d'origine animale destinés à la consommation humaine, fixant
    les exigences en matière de certification, modifiant le règlement (CE) n° 2074/2005
    et abrogeant la décision 2003/812/CE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/759 der Kommission vom 28. April 2016
    zur Erstellung der Listen der Drittländer, Teile von Drittländern und Gebiete,
    aus denen die Mitgliedstaaten die Verbringung bestimmter Erzeugnisse tierischen
    Ursprungs für den menschlichen Verzehr in die Union zulassen, zur Festlegung
    der Bescheinigungsanforderungen, zur Änderung der Verordnung (EG) Nr. 2074/2005
    und zur Aufhebung der Entscheidung 2003/812/EG
  type: main
- language: bg
