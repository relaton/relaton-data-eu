title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2624/76 of 28 October 1976 re-establishing
    the levying of the customs duties on articles of asphalt or of similar material
    falling within heading No 68.08, originating in Romania to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2624/76 de la Commission, du 28 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en asphalte ou en produits similaires, de la position tarifaire 68.08, originaires
    de la Roumanie bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2624/76 der Kommission vom 28. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für Waren aus Asphalt oder aus ähnlichen Stoffen, der Tarifnummer
    68.08, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2624/76 af 28. november 1976 om genindførelse
    af opkrævning af toldafgifter for varer af asfalt eller lignende materialer,
    under position 68.08, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2624/76 della Commissione, del 28 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di asfalto o
    di prodotti simili della voce doganale 68.08, originari della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2624/76 van de Commissie van 28 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op werken van
    asfalt of van dergelijke produkten, van post 68.08, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
