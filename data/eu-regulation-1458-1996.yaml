  content: COMMISSION REGULATION (EC) No 1458/96 of 25 July 1996 determining the extent
    to which applications lodged in July 1996 for import licences for certain pigmeat
    products under the regime provided for by the Agreements concluded by the Community
    with the Republic of Poland, the Republic of Hungary, the Czech Republic and the
    Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1458/96 DE LA COMMISSION du 25 juillet 1996 déterminant
