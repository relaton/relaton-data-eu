    juillet 1996 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords conclus par la Communauté avec la république
    de Pologne, la république de Hongrie, la République tchèque et la République
    slovaque peuvent être acceptées
  type: main
