  script: Latn
  content: '91/604/EEC: Commission Decision of 25 October 1991 accepting an undertaking
    given by a Thai exporter in connection with the anti-dumping proceeding concerning
    imports of gas-fuelled, non-refillable pocket flint lighters originating in Japan,
    the People''s Republic of China, the Republic of Korea and Thailand and terminating
    the investigation with regard to the exporter in question'
  type: main
- language: fr
  script: Latn
  content: '91/604/CEE: Décision de la Commission du 25 octobre 1991 portant acceptation
    d''un engagement souscrit par un exportateur thaïlandais dans le cadre de la
    procédure antidumping concernant les importations de briquets de poche avec pierre,
    à gaz, non rechargeables, originaires du Japon, de la République populaire de
    Chine, de la République de Corée et de la Thaïlande et portant clôture de
    l''enquête afférente à l''exportateur en question'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 25. Oktober 1991 über die Annahme eines
