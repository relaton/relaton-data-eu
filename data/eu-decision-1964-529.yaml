title:
- language: fr
  script: Latn
  content: Décision 64/529/CEE de la Commission, du 15 septembre 1964, relative au
    recours de la République fédérale d'Allemagne à l'article 115 alinéa 1 du
    Traité pour exclure du traitement communautaire les carpes, originaires de Yougoslavie
    et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '64/529/EWG: Entscheidung der Kommission vom 15. September 1964 über die
    Inanspruchnahme von Artikel 115 Absatz (1) des Vertrages durch die Bundesrepublik
    Deutschland, um aus Jugoslawien stammende Karpfen, die in den anderen Mitgliedstaaten
    in den freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '64/529/CEE: Decisione della Commissione, del 15 settembre 1964, relativa
    al ricorso della Repubblica federale di Germania ai sensi dell''art. 115, primo
    comma del Trattato, al fine di escludere dal trattamento comunitario le carpe
    provenienti dalla Iugoslavia e immesse in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/529/EEG: Beschikking van de Commissie van 15 september 1964 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag karpers, die van oorsprong zijn uit Joegoslavië en in
    de andere Lid- Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
