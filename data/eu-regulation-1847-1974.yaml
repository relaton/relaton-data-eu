  content: Regulation (EEC) No 1847/74 of the Council of 15 July 1974 on certain measures
    to be taken in agriculture in respect of Italy, following the fixing of a new
    representative rate for the Italian lira
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1847/74 du Conseil, du 15 juillet 1974, relatif à
