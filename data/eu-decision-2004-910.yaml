    Republiken Kongo, Fiji, Republiken Guyana, Republiken Elfenbenskusten, Jamaica,
    Republiken Kenya, Republiken Madagaskar, Republiken Malawi, Republiken Mauritius,
    Republiken Surinam, Saint Christopher och Nevis, Konungariket Swaziland, Republiken
    Tanzania, Republiken Trinidad och Tobago, Republiken Uganda, Republiken Zambia
    samt Republiken Zimbabwe, och, å andra sidan, Republiken Indien om garantipriser
    för rörsocker under leveransperioderna 2003/2004 och 2004/2005 (2004/910/EG)'
