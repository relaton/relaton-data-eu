    boviene rhinotracheïtis en de goedkeuring van de door sommige lidstaten ingediende
    uitroeiingsprogramma''s (Voor de EER relevante tekst) (kennisgeving geschied onder
    nummer C(2004) 573)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 1 marca 2004 r. wykonująca dyrektywę Rady 64/432/EWG
    w odniesieniu do dodatkowych gwarancji dla handlu wewnątrzwspólnotowego bydłem,
    odnoszących się do zakaźnego zapalenia nosa i tchawicy bydła i zatwierdzenia
    programów zwalczania przedstawionych przez Państwa Członkowskie (notyfikowana
    jako dokument nr C(2004) 573)
  type: main
- language: pt
  script: Latn
  content: '2004/215/CE: Decisão da Comissão, de 1 de Março de 2004, que dá execução
    à Directiva 64/432/CEE do Conselho no que se refere a garantias suplementares
    para o comércio intracomunitário de bovinos relativamente à rinotraqueíte
    infecciosa dos bovinos e à aprovação dos programas de erradicação apresentados
    por determinados Estados-Membros (Texto relevante para efeitos do EEE) [notificada
    com o número C(2004) 573]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 1. marca 2004, ktorým sa vykonáva smernica Rady
    64/432/EHS, ktorá sa týka dodatočných záruk pre obchod s hovädzím dobytkom
    vo vnútri spoločenstva v súvislosti s infekčnou rinotracheitídou hovädzieho
    dobytka a so schvaľovaním eradikačných programov predložených určitými
    členskými štátmi [oznámené pod číslom K(2004) 573]
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 1. marca 2004 o izvajanju Direktive Sveta 64/432/EGS
