title:
- language: en
  script: Latn
  content: '2004/215/EC: Commission Decision of 1 March 2004 implementing Council
    Directive 64/432/EEC as regards additional guarantees for intra-Community trade
    in bovine animals relating to infectious bovine rhinotracheitis and the approval
    of the eradication programmes presented by certain Member States (Text with EEA
    relevance) (notified under document number C(2004) 573)'
  type: main
- language: fr
  script: Latn
  content: '2004/215/CE: Décision de la Commission du 1er mars 2004 mettant en œuvre
    la directive 64/432/CEE du Conseil en ce qui concerne des garanties supplémentaires
    pour les échanges intracommunautaires de bovins en rapport avec la rhinotrachéite
    infectieuse bovine et l''approbation des programmes d''éradication présentés
    par certains États membres (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2004) 573]'
  type: main
- language: de
  script: Latn
  content: '2004/215/EG: Entscheidung der Kommission vom 1. März 2004 zur Umsetzung
    der Richtlinie 64/432/EWG des Rates hinsichtlich ergänzender Garantien im innergemeinschaftlichen
    Handel mit Rindern in Bezug auf die infektiöse bovine Rhinotracheitis und der
    Genehmigung der von einigen Mitgliedstaaten vorgelegten Tilgungsprogramme (Text
    von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2004) 573)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 1. března 2004, kterým se provádí směrnice
