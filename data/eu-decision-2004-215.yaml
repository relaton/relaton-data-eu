    riguarda le garanzie supplementari per gli scambi intracomunitari di animali della
    specie bovina in relazione alla rinotracheite bovina infettiva e l''approvazione
    dei programmi di eradicazione presentati da alcuni Stati membri (Testo rilevante
    ai fini del SEE) [notificata con il numero C(2004) 573]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2004. gada 1. marts), ar ko īsteno Padomes Direktīvu
    attiecībā uz papildu garantijām saistībā ar infekciozo liellopu rinotraheītu
    Kopienas iekšējai tirdzniecībai ar liellopiem un attiecībā uz noteiktu dalībvalstu
    iesniegto slimības izskaušanas programmu apstiprināšanu (izziņots ar dokumenta
    numuru C(2004) 573)
  type: main
- language: lt
  script: Latn
  content: 2004 m. kovo 1 d. Komisijos sprendimas, įgyvendinantis Tarybos direktyvą
    64/432/EEB dėl Bendrijos vidaus prekybai taikytinų papildomų garantijų, susijusių
    su galvijų rinotracheitu, ir tam tikrų valstybių narių pateiktų likvidavimo
    programų patvirtinimo (pranešta dokumentu Nr. C(2004) 573)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni ta’ l-1 ta’ Marzu 2004 li timplimenta
    d-Direttiva tal-Kunsill 64/432/KEE fir-rigward ta’ garanziji addizzjonali għal
    kummerċ intra-Komunitarji ta’ annimali bovini li jirrelataw ma’ rhinotracheitis
    bovina nfettiva u l-approvazzjoni tal-programmi ta’ qirda ppreżentati minn
    ċerti Stati Membri (notifikata bid-dokument numru K(2004) 573)
  type: main
- language: nl
  script: Latn
  content: '2004/215/EG: Beschikking van de Commissie van 1 maart 2004 tot uitvoering
    van Richtlĳn 64/432/EEG van de Raad voor wat betreft aanvullende garanties voor
