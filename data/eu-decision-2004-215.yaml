    rhinotracheitidy pro obchod se skotem uvnitř Společenství a o schválení programů
    eradikace předložených některými členskými státy (oznámeno pod číslem
    K(2004) 573)
  type: main
- language: da
  script: Latn
  content: '2004/215/EF: Kommissionens beslutning af 1. marts 2004 om gennemførelse
    af Rådets direktiv 64/432/EØF for så vidt angår supplerende garantier med
    hensyn til IBR i forbindelse med handel inden for Fællesskabet med kvæg og godkendelse
    af de udryddelsesprogrammer, som visse medlemsstater har forelagt (EØS-relevant
    tekst) (meddelt under nummer K(2004) 573)'
  type: main
