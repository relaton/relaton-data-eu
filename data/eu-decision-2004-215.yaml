    nautaeläinten kaupassa naudan tarttuvaan rinotrakeiittiin liittyvien lisätakeiden
    osalta ja tiettyjen jäsenvaltioiden esittämien hävittämisohjelmien hyväksymisen
    osalta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla K(2004)
    573)'
  type: main
- language: hu
  script: Latn
