    zu pauschal im voraus festgesetzten Preisen aus Beständen der Interventionsstellen
    infolge des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3465/80 af 30. december 1980 om ændring
