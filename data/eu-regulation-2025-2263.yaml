    Standardformblätter und elektronischen Formate, über die der verpflichtende
    automatische Informationsaustausch über meldepflichtige Kryptowerte sowie die
    Übermittlung der jährlichen Bewertung und die Übermittlung der von den Mitgliedstaaten
    vorzulegenden statistischen Daten gemäß der Richtlinie 2011/16/EU des Rates
    zu erfolgen hat
  type: main
