  content: Commission Implementing Regulation (EU) 2025/2263 of 12 November 2025 amending
    Implementing Regulation (EU) 2015/2378 as regards the standard forms and computerised
    formats for the mandatory automatic exchange of information on reportable crypto-assets,
    the communication of the yearly assessment and the list of statistical data to
    be provided by Member States under Council Directive 2011/16/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2263 de la Commission du 12 novembre
    2025 modifiant le règlement d’exécution (UE) 2015/2378 en ce qui concerne
    les formulaires types et les formats informatiques pour l’échange automatique
    et obligatoire d’informations sur les crypto-actifs devant faire l’objet d’une
    déclaration, la communication de l’évaluation annuelle et la liste des données
    statistiques à fournir par les États membres en vertu de la directive 2011/16/UE
    du Conseil
  type: main
