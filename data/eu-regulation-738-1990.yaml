title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 738/90 of 22 March 1990 amending Regulation
    (EEC) No 4047/89 fixing, for certain fish stock and groups of fish stocks, the
    total allowable catches for 1990 and certain conditions under which they may be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 738/90 du Conseil du 22 mars 1990 modifiant le règlement
    (CEE) n° 4047/89 fixant, pour certains stocks et groupes de stocks de poissons,
    les totaux admissibles des captures pour 1990 et certaines conditions dans lesquelles
    ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 738/90 DES RATES vom 22. März 1990 zur Änderung
    der Verordnung (EWG) Nr. 4047/89 über die zulässige Gesamtfangmenge und über
    Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen (1990) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 738/90 af 22. marts 1990 om ændring af forordning
    (EØF) nr. 4047/89 om fastsættelse, for visse fiskebestande og grupper af bestande,
    af de samlede tilladte fangstmængder for 1990 og af visse betingelser for fiskeri
    af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 738/90 του Συμβουλίου
