    για το 1990 και ορισμένων όρων υπό τους οποίους
    μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 738/90 DEL CONSIGLIO del 22 marzo 1990 recante modifica
    del regolamento (CEE) n. 4047/89 che fissa, per alcune popolazioni o gruppi di
    popolazioni ittiche, il totale delle catture ammissibili per il 1990 ed alcune
    condizioni cui è soggetta la pesca del totale delle catture ammissibile #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 738/90 VAN DE RAAD van 22 maart 1990 tot wijziging
    van Verordening (EEG) nr. 4047/89 inzake de vaststelling van de voor 1990 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden
    en bepaalde bij de visserij in het kader van de totaal toegestane vangsten acht
    te nemen voorschriften #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 738/90 DO CONSELHO de 22 de Março de 1990 que altera
    o Regulamento (CEE) nº 4047/89 que fixa, relativamente a certas unidades populacionais
    (stocks) ou grupos de unidades populacionais de peixes, os totais admissíveis
    de capturas para 1990 e certas condições em que podem ser pescados #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 738/90 DEL CONSEJO de 22 de marzo de 1990 que modifica
    el Reglamento (CEE) no 4047/89 por el que se fijan, para determinadas poblaciones
    o grupos de poblaciones de peces, los totales admisibles de capturas para 1990
    y determinadas condiciones en las que pueden pescarse #'
  type: main
