title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2974/93 of 28 October 1993 re-establishing
    the levying of customs duties on products of categories 12 and 24 (order Nos 40.0120
    and 40.0240), originating in Malaysia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2974/93 de la Commission du 28 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 12 et 24 (numéros d'ordre 40.0120 et 40.0240) originaires de
    Malaysia, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2974/93 DER KOMMISSION vom 28. Oktober 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 12 und 24 (laufende Nummern 40.0120
    und 40.0240) mit Ursprung in Malaysia, für die die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2974/93 af 28. oktober 1993 om genindførelse
    af opkrævning af told for varer under kategori 12 og 24 (løbenummer 40.0120
    og 40.0240), som har oprindelse i Malaysia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
