title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1619/72 de la Commission du 26 juillet 1972, fixant
    les taux des restitutions applicables, à compter du 1er août 1972, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1619/72 der Kommission vom 26. Juli 1972 zur Festsetzung
    der ab 1. August 1972 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1619/72 della Commissione, del 26 luglio 1972, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 agosto 1972 alle
    uova e al giallo d'uova esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1619/72 van de Commissie van 26 juli 1972 houdende
    vaststelling van de restituties die met ingang van 1 augustus 1972 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
