id: EUDecision1975197
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 February 1975 authorizing the French Republic
    not to apply Community treatment to umbrellas and sunshades (including walking-stick
    umbrellas, umbrella tents, and garden and similar umbrellas), falling within heading
    No 66.01 of the Common Customs Tariff, originating in Taïwan, and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/197/CEE: Décision de la Commission, du 26 février 1975, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles, y compris les parapluies-cannes et les parasols-tentes
    et similaires, de la position 66.01 du Tarif douanier commun, originaires de Taiwan
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. Februar 1975, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Regenschirme und Sonnenschirme, einschließlich
    Stockschirme, Schirmzelte und dergleichen, der Tarifnummer 66.01 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. februar 1975 om bemyndigelse for Den franske
    Republik til fra Fællesskabsbehandling at undtage paraplyer og parasoller (herunder
    stokkeparaplyer, paraplytelte, haveparasoller o. lign.), som henhører under position
    66.01 i den fælles toldtarif, har oprindelse i Taïwan og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 febbraio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli ombrelli (da pioggia o da
    sole), compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e simili,
    della voce 66.01 della tariffa doganale comune, originari di Taiwan, e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 februari 1975 waarbij de Franse Republiek
    wordt gemachtigd paraplu's en parasols, alsmede wandelstokparaplu's, tuinparasols,
    parasoltenten en dergelijke van post 66.01 van het gemeenschappelijk douanetarief,
    van oorsprong uit Tai-wan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
