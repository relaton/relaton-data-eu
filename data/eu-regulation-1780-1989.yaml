title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1780/89 of 21 June 1989 laying down detailed
    rules for the disposal of alcohol obtained from the distillation operations referred
    to in Articles 35, 36 and 39 of Regulation (EEC) No 822/87 and held by intervention
    agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1780/89 de la Commission du 21 juin 1989 établissant
    les modalités d'application relatives à l'écoulement des alcools obtenus au
    titre des distillations visées aux articles 35, 36 et 39 du règlement (CEE)
    n° 822/87 du Conseil et détenus par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1780/89 DER KOMMISSION vom 21. Juni 1989 mit Durchführungsbestimmungen
    für den Absatz von Alkohol aus der Destillation nach den Artikeln 35, 36 und
    39 der Verordnung (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1780/89 af 21. juni 1989 om gennemførelsesbestemmelser
    for afsætning af alkohol, der er fremstillet i henhold til de i artikel 35, 36
    og 39 i forordning (EØF) nr. 822/87 omhandlede destillationer, og som interventionsorganerne
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1780/89 της Επιτροπής
    της 21ης Ιουνίου 1989 για τη θέσπιση των λεπτομερειών
    εφαρμογής σχετικά με τη διάθεση των αλκοολών
    που λαμβάνονται από τις αποστάξεις που αναφέρονται
    στα άρθρα 35, 36 και 39 του Συμβουλίου και ευρίσκονται
    στην κατοχή των οργανισμών παρέμβασης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1780/89 DELLA COMMISSIONE del 21 giugno 1989 che
    stabilisce le modalità d'' applicazione relative allo smercio degli alcoli ottenuti
    dalle distillazioni di cui agli articoli 35, 36 e 39 del regolamento (CEE) n.
    822/87 e detenuti dagli organismi d'' intervento #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1780/89 VAN DE COMMISSIE van 21 juni 1989 tot vaststelling
    van de uitvoeringsbepalingen voor de afzet van alcohol die is verkregen bij distillatie
    als bedoeld in de artikelen 35, 36 en 39 van Verordening (EEG) nr. 822/87 en die
    in het bezit is van de interventiebureaus #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1780/89 DA COMISSÃO de 21 de Junho de 1989 que
    estabelece as regras de execução relativas ao escoamento dos álcoois provenientes
    das destilações referidas nos artigos 35º, 36º e 39º do Regulamento (CEE)
    nº 822/87 do Conselho e detidos pelos organismos de intervenção #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1780/89 DE LA COMISIÓN de 21 de junio de 1989 por
    el que se establecen las disposiciones de aplicación relativas a la salida al
    mercado de los alcoholes obtenidos con arreglo a las destilaciones contempladas
    en los artículos 35, 36 y 39 del Reglamento (CEE) no 822/87, en posesión de
    los organismos de intervención #'
