title:
- language: fr
  script: Latn
  content: Règlement n° 161 de la Commission portant nouvelle fixation du prix d'écluse
    et du montant des prélèvements pour les oeufs dépourvus de leur coquille et
    les jaunes d'oeufs de volaille de basse-cour, propres à des usages alimentaires,
    frais, conservés, séchés ou sucrés
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 161 der Kommission über die Neufestsetzung der Einschleusungspreise
    und der Abschöpfungsbeträge für Eier ohne Schale und Eigelb, von Hausgeflügel,
    genießbar, frisch, haltbar gemacht, getrocknet oder gezuckert
  type: main
- language: it
  script: Latn
  content: Regolamento n. 161 della Commissione relativo alla fissazione dei prezzi
    limite e dei prelievi per le uova sgusciate ed il giallo d'uova di volatili da
    cortile, atti ad usi alimentari, freschi, conservati, essiccati o con l'aggiunta
    di zuccheri
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 161 van de Commissie betreffende de nieuwe vaststelling
    van de sluisprijzen en de heffingen voor eieren uit de schaal en eigeel, van pluimvee,
    geschikt voor menselijke consumptie, vers, verduurzaamd, gedroogd of met toegevoegde
    suiker
  type: main
