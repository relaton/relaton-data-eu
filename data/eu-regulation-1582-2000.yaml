title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1582/2000 of 19 July 2000 determining the
    extent to which applications lodged in July 2000 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 July to 30 September 2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1582/2000 de la Commission du 19 juillet 2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2000 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er juillet au 30 septembre 2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1582/2000 der Kommission vom 19. Juli 2000 über die
    Festsetzung des Umfangs für die im Juli 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    Juli bis zum 30. September 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1582/2000 af 19. juli 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    2000 om importlicenser for toldkontingenter for indførsel af bestemte svinekødsprodukter
    for perioden 1. juli til 30. september 2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1582/2000 της Επιτροπής,
    της 19ης Ιουλίου 2000, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο 2000 για
    άδειες εισαγωγής, βάσει των καθεστώτων δασμολογικών
    ποσοστώσεων εισαγωγής για ορισμένα προϊόντα
    του τομέα του χοιρείου κρέατος, για την περίοδο
    από την 1η Ιουλίου έως τις 30 Σεπτεμβρίου 2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1582/2000, annettu 19 päivänä heinäkuuta
    2000, heinäkuussa 2000 jätettyjen tuontitodistushakemusten hyväksyttävyydestä
    koskien tuontitariffikiintiöiden avaamista ja hallintaa sianliha-alalla tiettyjen
    tuotteiden osalta 1 päivän heinäkuuta ja 30 päivän syyskuuta 2000 välisellä
    kaudella
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1582/2000 della Commissione, del 19 luglio 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 2000 nel quadro dei contingenti tariffari d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° luglio
    al 30 settembre 2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1582/2000 van de Commissie van 19 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten,
    die in juli 2000 worden ingediend op grond van de tariefcontingenten voor de invoer
    van bepaalde producten in de varkensvleessector voor de periode van 1 juli tot
    en met 30 september 2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1582/2000 da Comissão, de 19 de Julho de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Julho de 2000 ao abrigo dos contingentes pautais de importação
    para determinados produtos no sector da carne de suíno, para o período compreendido
    entre 1 de Julho e 30 de Setembro de 2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1582/2000 de la Comisión, de 19 de julio de 2000,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación presentadas en julio de 2000 de contingentes arancelarios
    de importación de productos del sector de la carne de porcino durante el período
    comprendido entre el 1 de julio y el 30 de septiembre de 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1582/2000 av den 19 juli 2000 om den
    utsträckning i vilken ansökningar om importlicens som inlämnas i juli 2000
    skall beviljas inom ramen för tullkvoterna för import av vissa grisköttsprodukter
    under perioden 1 juli-30 september 2000
  type: main
