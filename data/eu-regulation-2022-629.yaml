    (ES) 2017/583 attiecībā uz likviditātes kritēriju robežvērtību un attiecībā
    uz tās tirdzniecības procentīles pielāgošanu, ko izmanto, lai noteiktu konkrētiem
    instrumentiem, kuri nav kapitāla vērtspapīru finanšu instrumenti, piemērojamā
    instrumenta raksturīgo apjomu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/629 2022 m. sausio 12 d. kuriuo
