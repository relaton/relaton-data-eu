    prilagodbe pragova likvidnosti i percentila trgovanja za utvrđivanje veličine
    karakteristične za instrument koji se primjenjuju na određene nevlasničke instrumente
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/629 felhatalmazáson alapuló rendelete (2022. január
    12.) az (EU) 2017/583 felhatalmazáson alapuló rendeletben meghatározott szabályozástechnikai
    standardoknak az egyes nem tulajdonviszonyt megtestesítő eszközökre alkalmazandó,
    az eszközre jellemző nagyságrend meghatározásához használt likviditási
    küszöbértékek és kereskedési percentilisek kiigazítása tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/629 della Commissione del 12 gennaio 2022
    che modifica le norme tecniche di regolamentazione stabilite nel regolamento delegato
    (UE) 2017/583 per quanto riguarda l’adeguamento delle soglie di liquidità e
    dei percentili delle operazioni utilizzati per determinare la dimensione specifica
    dello strumento che si applicano a taluni strumenti non rappresentativi di capitale
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/629 (2022. gada 12. janvāris),
