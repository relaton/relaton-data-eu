title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/629 of 12 January 2022 amending
    the regulatory technical standards laid down in Delegated Regulation (EU) 2017/583
    as regards adjustment the liquidity thresholds and trade percentile used to determine
    the size specific to the instrument applicable to certain non-equity instruments
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/629 de la Commission du 12 janvier 2022
    modifiant les normes techniques de réglementation définies par le règlement
    délégué (UE) 2017/583 en ce qui concerne l’ajustement des seuils de liquidité,
    ainsi que des percentiles transactions utilisés pour déterminer la taille spécifique
    à l’instrument, applicables à certains instruments autres que des actions
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/629 der Kommission vom 12. Januar 2022
