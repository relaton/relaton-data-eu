    en de transactiepercentielen gebruikt om voor bepaalde andere dan eigenvermogensinstrumenten
    de voor het instrument specifieke omvang vast te stellen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/629 z dnia 12 stycznia 2022
    r. zmieniające regulacyjne standardy techniczne określone w rozporządzeniu
    delegowanym (UE) 2017/583 w odniesieniu do dostosowania progów płynności i
    percentyla transakcji wykorzystywanych do określenia wielkości specyficznej
    dla danego instrumentu mającej zastosowanie do niektórych instrumentów nieudziałowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/629 da Comissão de 12 de janeiro de 2022
    que altera as normas técnicas de regulamentação estabelecidas no Regulamento
    Delegado (UE) 2017/583 no que diz respeito à adaptação dos limiares de liquidez
    e do percentil de negociação utilizados para determinar o volume específico
    do instrumento aplicável a certos instrumentos não representativos de capital
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/629 al Comisiei din 12 ianuarie 2022 de
    modificare a standardelor tehnice de reglementare prevăzute în Regulamentul
    delegat (UE) 2017/583 în ceea ce privește ajustarea pragurilor de lichiditate
    și a percentilei de tranzacționare utilizate pentru determinarea mărimii specifice
    instrumentului aplicabile anumitor instrumente financiare care nu sunt de capitaluri
    proprii
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/629 z 12. januára 2022, ktorým
    sa menia regulačné technické predpisy stanovené v delegovanom nariadení (EÚ)
    2017/583, pokiaľ ide o úpravu prahových hodnôt likvidity a obchodného percentilu
    používaného na určenie objemu špecifického pre daný nástroj, ktoré sú
    uplatniteľné na určité nekapitálové nástroje
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/629 z dne 12. januarja 2022 o spremembi
    regulativnih tehničnih standardov iz Delegirane uredbe (EU) 2017/583 zaradi prilagoditve
    pragov likvidnosti in percentilov trgovanja, ki se uporabljajo za določitev obsega,
    značilnega za instrument, pri nekaterih nelastniških instrumentih
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/629 de la Comisión de 12 de enero de 2022
    por el que se modifican las normas técnicas de regulación establecidas en el
    Reglamento Delegado (UE) 2017/583 en lo que respecta al ajuste de los umbrales
    de liquidez y los percentiles de transacción utilizados para determinar el tamaño
    específico del instrumento aplicable a determinados instrumentos distintos de
    acciones y de instrumentos asimilados
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/629 av den 12 januari 2022
    om ändring av de tekniska tillsynsstandarderna i delegerad förordning (EU) 2017/583
    vad gäller justering av likviditetströsklar och handelspercentil som används
    för att fastställa storlek som är specifik för instrumentet, för tillämpning
