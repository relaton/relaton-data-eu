---
id: EURegulation8812002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 881/2002 of 27 May 2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with Usama bin Laden, the Al-Qaida network and the Taliban, and repealing Council
    Regulation (EC) No 467/2001 prohibiting the export of certain goods and services
    to Afghanistan, strengthening the flight ban and extending the freeze of funds
    and other financial resources in respect of the Taliban of Afghanistan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 881/2002 du Conseil du 27 mai 2002 instituant certaines
    mesures restrictives spécifiques à l'encontre de certaines personnes et entités
    liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et abrogeant
    le règlement (CE) n° 467/2001 du Conseil interdisant l'exportation de certaines
    marchandises et de certains services vers l'Afghanistan, renforçant l'interdiction
    des vols et étendant le gel des fonds et autres ressources financières décidées
    à l'encontre des Taliban d'Afghanistan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 881/2002 des Rates vom 27. Mai 2002 über die Anwendung
    bestimmter spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates über das Verbot
    der Ausfuhr bestimmter Waren und Dienstleistungen nach Afghanistan, über die
    Ausweitung des Flugverbots und des Einfrierens von Geldern und anderen Finanzmitteln
    betreffend die Taliban von Afghanistan
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 881/2002 на Съвета от 27 май
    2002 година за налагане на някои специфични ограничителни
    мерки, насочени срещу определени физически
    лица и образувания, свързани с Осама бен Ладен,
    мрежата на Ал Кайда и талибаните, и за отмяна
    на Регламент (ЕО) № 467/2001 на Съвета за забрана
    на износа на някои стоки и услуги за Афганистан,
    за засилване на забраната на полети и удължаване
    на замразяването на средства и други финансови
    ресурси по отношение на талибаните в Афганистан
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 881/2002 ze dne 27. května 2002 o zavedení
    některých zvláštních omezujících opatření namířených proti některým
    osobám a subjektům spojeným s Usámou bin Ládinem, sítí Al-Kajdá a Talibanem
    a o zrušení nařízení Rady (ES) č. 467/2001, kterým se zakazuje vývoz určitého
    zboží a služeb do Afghánistánu, zesiluje zákaz letů a rozšiřuje zmrazení
    prostředků a jiných finančních zdrojů afghánského Talibanu
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 881/2002 af 27. maj 2002 om indførelse af
    visse specifikke restriktive foranstaltninger mod visse personer og enheder, der
    har tilknytning til Usama bin Laden, Al-Qaida-organisationen og Taliban, og om
    ophævelse af Rådets forordning (EF) nr. 467/2001 om forbud mod udførsel af
    visse varer og tjenesteydelser til Afghanistan, om styrkelse af flyveforbuddet
    og om udvidelse af indefrysningen af midler og andre økonomiske ressourcer over
    for Taliban i Afghanistan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 881/2002 του Συμβουλίου,
    της 27ης Μαΐου 2002, για την επιβολή συγκεκριμένων
    περιοριστικών μέτρων κατά ορισμένων προσώπων
    και οντοτήτων που συνδέονται με τον Οσάμα Μπιν
    Λάντεν, το δίκτυο της Αλ Κάιντα και τους Ταλιμπάν,
    και για την κατάργηση του κανονισμού (ΕΚ) αριθ.
    467/2001 του Συμβουλίου για την απαγόρευση της
    εξαγωγής ορισμένων αγαθών και υπηρεσιών στο
    Αφγανιστάν, την ενίσχυση της απαγόρευσης πτήσεων
    και την παράταση της δέσμευσης κεφαλαίων και
    άλλων οικονομικών πόρων όσον αφορά τους Ταλιμπάν
    του Αφγανιστάν
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 881/2002, 27. mai 2002, millega kehtestatakse
    teatavate Osama bin Ladeni, Al-Qaida võrgu ja Talibaniga seotud isikute ja üksuste
    vastu suunatud eripiirangud ja tunnistatakse kehtetuks nõukogu määrus (EÜ)
    nr 467/2001, millega keelustatakse teatavate kaupade ja teenuste eksport Afganistani,
    laiendatakse Afganistani rühmitusega Taliban seotud lennukeeldu ning rahaliste
    vahendite ja muude finantsallikate külmutamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 881/2002, annettu 27 päivänä toukokuuta 2002,
    tiettyihin Osama bin Ladenia, al-Qaida-verkostoa ja Talebania lähellä oleviin
    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    sekä Afganistaniin suuntautuvan tiettyjen tavaroiden ja palvelujen viennin kieltämisestä,
    Afganistanin Talebania koskevien lentokiellon ja varojen sekä muiden taloudellisten
    resurssien jäädyttämisen laajentamisesta annetun neuvoston asetuksen (EY) N:o
    467/2001 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 881/2002 od 27. svibnja 2002. o određenim posebnim
    mjerama ograničavanja protiv određenih osoba i subjekata povezanih s Osamom
    bin Ladenom, mrežom Al-Qaidom i talibanima te o stavljanju izvan snage Uredbe
    Vijeća (EZ) br. 467/2001 o zabrani izvoza određene robe i usluga u Afganistan,
    pooštravanju zabrane leta i proširivanju zamrzavanja financijskih sredstava
    i ostalih financijskih izvora u odnosu na afganistanske talibane
  type: main
- language: hu
  script: Latn
  content: A Tanács 881/2002/EK Rendelete (2002. május 27.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről,
    valamint az egyes termékek és szolgáltatások Afganisztánba történő kivitelének
    tilalmáról, a repülési tilalom megerősítéséről és az afganisztáni Tálibánt
    illető pénzkészletek és egyéb pénzügyi források befagyasztásáról szóló,
    467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 881/2002 del Consiglio, del 27 maggio 2002, che impone
    specifiche misure restrittive nei confronti di determinate persone ed entità
    associate a Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento
    (CE) n. 467/2001 che vieta l'esportazione di talune merci e servizi in Afghanistan,
    inasprisce il divieto dei voli e estende il congelamento dei capitali e delle
    altre risorse finanziarie nei confronti dei Talibani dell'Afghanistan
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 881/2002 (2002. gada 27. maijs), ar kuru paredz
    īpašus ierobežojošus pasākumus, kas vērsti pret konkrētām personām un
    organizācijām, kas saistītas ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban,
    un ar kuru atceļ Padomes Regulu (EK) Nr. 467/2001, ar ko aizliedz eksportēt
    noteiktas preces un pakalpojumus uz Afganistānu, pastiprina lidojumu aizliegumu
    un attiecina uz Afganistānas Taliban līdzekļu un citu finanšu resursu iesaldēšanu
  type: main
- language: lt
  script: Latn
  content: 2002 m. gegužės 27 d. Tarybos Reglamentas (EB) Nr. 881/2002 nustatantis
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Usama bin Ladenu, Al-Qaida tinklu ir Talibanu, ir panaikinantis
    Tarybos reglamentą (EB) Nr. 467/2001, uždraudžiantį tam tikrų prekių ir
    paslaugų eksportą į Afganistaną, sustiprinantį skrydžių uždraudimą ir
    pratęsiantį Afganistano Talibano lėšų ir kitų finansinių išteklių įšaldymą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 881/2002 tas-27 ta’ Mejju 2002 li
    jimponi ċerti miżuri speċifiċi restrittivi diretti kontra ċerti persuni u
    entitajiet assoċjati mal-organizzazzjonijiet ISIL (Da’esh) u Al-Qaida u t-Taliban,
    u li jħassar ir-Regolament tal-Kunsill (KE) Nru 467/2001 li jipprojbixxi l-esportazzjoni
    ta’ ċerti merkanzija u servizzi lejn l-Afganistan, waqt li jsaħħaħ il-projbizzjoni
    ta’ titjiriet u jestendi l-friża fuq fondi u riżorsi finanzjarji oħra rigward
    it-Taliban ta’ l-Afganistan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 881/2002 van de Raad van 27 mei 2002 tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten
    die banden hebben met Usama bin Laden, het Al-Qa'ida-netwerk en de Taliban, en
    tot intrekking van Verordening (EG) nr. 467/2001 van de Raad tot instelling van
    een verbod op de uitvoer van bepaalde goederen en diensten naar Afghanistan, tot
    versterking van het verbod op vluchten en verlenging van de bevriezing van tegoeden
    en andere financiële middelen ten aanzien van de Taliban van Afghanistan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 881/2002 z dnia 27 maja 2002 r. wprowadzające
    niektóre szczególne środki ograniczające skierowane przeciwko niektórym osobom
    i podmiotom związanym z Osamą bin Ladenem, siecią Al-Kaida i Talibami i uchylające
    rozporządzenie Rady (WE) nr 467/2001 zakazujące wywozu niektórych towarów
    i usług do Afganistanu, wzmacniające zakaz lotów i rozszerzające zamrożenie
    funduszy i innych środków finansowych w odniesieniu do Talibów w Afganistanie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 881/2002 do Conselho, de 27 de Maio de 2002, que
    institui certas medidas restritivas específicas contra determinadas pessoas e
    entidades associadas a Osama Bin Laden, à rede Al-Qaida e aos talibã, e que
    revoga o Regulamento (CE) n.° 467/2001 que proíbe a exportação de certas mercadorias
    e de certos serviços para o Afeganistão, reforça a proibição de voos e prorroga
    o congelamento de fundos e de outros recursos financeiros aplicável aos talibã
    do Afeganistão
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 881/2002 al Consiliului din 27 mai 2002 de instituire
    a unor măsuri restrictive specifice împotriva anumitor persoane și entități
    care au legătură cu Osama ben Laden, cu rețeaua Al-Qaida și cu talibanii și
    de abrogare a Regulamentului (CE) nr. 467/2001 al Consiliului de interzicere a
    exportului anumitor mărfuri și servicii către Afganistan, de întărire a interdicției
    de zbor și de extindere a înghețării fondurilor și a altor resurse financiare
    în ceea ce-i privește pe talibanii din Afganistan
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 881/2002 z 27. mája 2002, ktoré ukladá niektoré
    špecifické obmedzujúce opatrenia namierené proti niektorým osobám spojeným
    s Usámom bin Ládinom, sieťou Al-Qaida a Talibanom a ruší nariadenie Rady
    (ES) č. 467/2001, ktoré zakazuje vývoz určitého tovaru a služieb do Afganistanu,
    posilňuje zákaz letov a rozširuje zmrazenie finančných prostriedkov a ďalších
    finančných zdrojov vo vzťahu k Talibanu v Afganistane
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 881/2002 z dne 27. maja 2002 o posebnih omejevalnih
    ukrepih za nekatere osebe in subjekte, povezane z Osama bin Ladnom, mrežo Al-Kaida
    in talibani, in o razveljavitvi Uredbe Sveta (ES) št. 467/2001 o prepovedi izvoza
    nekaterega blaga in storitev v Afganistan, o poostritvi prepovedi poletov in podaljšanju
    zamrznitve sredstev in drugih finančnih virov talibanov iz Afganistana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 881/2002 del Consejo, de 27 de mayo de 2002, por el
    que se imponen determinadas medidas restrictivas específicas dirigidas contra
    determinadas personas y entidades asociadas con Usamah bin Ladin, la red Al-Qaida
    y los talibanes y por el que se deroga el Reglamento (CE) n° 467/2001 del Consejo
    por el que se prohíbe la exportación de determinadas mercancías y servicios
    a Afganistán, se refuerza la prohibición de vuelos y se amplía la congelación
    de capitales y otros recursos financieros de los talibanes de Afganistán
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 881/2002 av den 27 maj 2002 om införande av
    vissa särskilda restriktiva åtgärder mot vissa med Usama bin Ladin, nätverket
    al-Qaida och talibanerna associerade personer och enheter och om upphävande av
    förordning (EG) nr 467/2001 om förbud mot export av vissa varor och tjänster
    till Afghanistan, skärpning av flygförbudet och förlängning av spärrandet
    av tillgångar och andra finansiella medel beträffande talibanerna i Afghanistan
  type: main
