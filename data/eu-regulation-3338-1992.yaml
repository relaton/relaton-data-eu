title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3338/92 of 16 November 1992 amending Regulation
    (EEC) No 2997/87 laying down, in respect of hops, the amount of aid to producers
    for the 1986 harvest and providing for special measures for certain regions of
    production
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3338/92 du Conseil, du 16 novembre 1992, modifiant
    le règlement (CEE) n° 2997/87 fixant, dans le secteur du houblon, le montant
    de l' aide aux producteurs pour la récolte de 1986 et prévoyant des mesures
    spéciales en faveur de certaines regions de production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3338/92 des Rates vom 16. November 1992 zur Änderung
    der Verordnung (EWG) Nr. 2997/87 zur Festsetzung der Beihilfe an Hopfenerzeuger
    für die Ernte 1986 und von Sondermaßnahmen für bestimmte Erzeugungsgebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3338/92 af 16. november 1992 om ændring
    af forordning (EØF) nr. 2997/87 om fastsættelse af producentstøtten for humle
    for 1986-høsten og om fastlæggelse af særforanstaltninger for visse produktionsområder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3338/92 του Συμβουλίου
    της 16ης Νοεμβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2997/87 για τον καθορισμό
    στον τομέα του λυκίσκου του ύψους της ενισχύσεως
    στους παραγωγούς για τη συγκομιδή του 1986 και
    για ειδικά μέτρα υπέρ ορισμένων περιοχών παραγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3338/92 del Consiglio, del 16 novembre 1992, recante
    modifica del regolamento (CEE) n. 2997/87 che fissa, nel settore del luppolo,
    l' importo dell' aiuto ai produttori per il raccolto 1986 e prevede misure speciali
    a favore di determinate regioni di produzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3338/92 van de Raad van 16 november 1992 houdende
    wijziging van Verordening (EEG) nr. 2997/87 tot vaststelling van het bedrag van
    de steun aan de telers voor de oogst 1986 en van bijzondere maatregelen voor bepaalde
    produktiegebieden in de sector hop
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3338/92 do Conselho, de 16 de Novembro de 1992, que
    altera o Regulamento (CEE) n° 2997/87, que fixa, no sector do lúpulo, o montante
    da ajuda aos produtores para o colheita de 1986 e prevê medidas especiais a favor
    de determinadas regiões de produção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3338/92 del Consejo, de 16 de noviembre de 1992, que
    modifica el Reglamento (CEE) n° 2997/87 por el que se fija, en el sector del
    lúpulo, el importe de la ayuda a los productores para la cosecha de 1986 y en
    el que se establecen medidas especiales en favor de determinadas zonas de producción
  type: main
