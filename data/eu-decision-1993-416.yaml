title:
- language: en
  script: Latn
  content: '93/416/EEC: Commission Decision of 17 June 1993 amending the Seventh Council
    Decision 85/355/EEC on the equivalence of field inspections carried out in third
    countries on seed-producing crops and the Seventh Council Decision 85/356/EEC
    on the equivalence of seed produced in third countries'
  type: main
- language: fr
  script: Latn
  content: '93/416/CEE: Décision de la Commission du 17 juin 1993 modifiant la septième
    décision 85/355/CEE du Conseil concernant l''équivalence des inspections sur
    pied des cultures productrices des semences effectuées dans des pays tiers ainsi
    que la septième décision 85/356/CEE du Conseil concernant l''équivalence des
    semences produites dans des pays tiers'
  type: main
- language: de
  script: Latn
  content: '93/416/EWG: ENTSCHEIDUNG DER KOMMISSION vom 17. Juni 1993 zur Änderung
    der Siebenten Entscheidung 85/355/EWG des Rates über die Gleichstellung von Feldbesichtigungen
    von Saatgutvermehrungsbeständen in dritten Ländern und der Siebenten Entscheidung
    85/356/EWG des Rates über die Gleichstellung von in dritten Ländern erzeugtem
    Saatgut'
  type: main
- language: da
  script: Latn
  content: '93/416/EØF: KOMMISSIONENS BESLUTNING af 17. juni 1993 om ændring af
    Rådets syvende beslutning 85/355/EØF om ligestilling af markinspektioner af
    arealer til formering af udsæd i tredjelande og af Rådets syvende beslutning
    85/356/EØF om ligestilling af frø produceret i tredjelande'
  type: main
- language: el
  script: Grek
  content: '93/416/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 17ης
    Ιουνίου 1993 που τροποποιεί την έβδομη απόφαση
    85/355/ΕΟΚ του Συμβουλίου για την ισοδυναμία των
    επιτόπιων ελέγχων των σποροπαραγωγικών καλλιεργειών
    οι οποίοι διενεργούνται σε τρίτες χώρες και
    την έβδομη απόφαση 85/356/ΕΟΚ του Συμβουλίου για
    την ισοδυναμία των σπόρων που παράγονται σε
    τρίτες χώρες'
  type: main
- language: fi
  script: Latn
  content: '93/416/ETY: Komission päätös, tehty 17 päivänä kesäkuuta 1993,
