title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2242/84 of 31 July 1984 re-establishing
    the levying of customs duties on woven fabrics of sheep' s or lambs' wool or of
    fine animal hair, products of category 50 (code 0500), originating in Peru, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2242/84 de la Commission du 31 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    laine et de poils fins de la catégorie 50 (code 0500), originaires du Pérou,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2242/84 der Kommission vom 31. Juli 1984 über die
    Wiedereinführung des Zollsatzes für Gewebe aus Wolle oder feinen Tierhaaren
    der Warenkategorie Nr. 50 (Kennziffer 0500) mit Ursprung in Peru, dem die in der
    Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2242/84 af 31. juli 1984 om genindførelse
    af opkrævning af toldafgifter for vævet stof af uld eller fine dyrehår, under
    varekategori nr. 50 (kode 0500), som har oprindelse i Peru og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2242/84 της Επιτροπής
    της 31ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα υφάσματα
    εξ ερίου ή τριχών εκλεκτής ποιότητας, προϊόντα
    της κατηγορίας 50 (κωδικός 0500), καταγωγής Περού,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2242/84 della Commissione del 31 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di lana o di peli fini,
    della categoria di prodotti n. 50 (codice 0500), originari del Perù beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2242/84 van de Commissie van 31 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van wol of van fijn haar, van de categorie van produkten nr. 50 (codenummer 0500),
    van oorsprong uit Peru waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
