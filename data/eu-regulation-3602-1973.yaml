    of administrative cooperation , and Decision No 3/73 of the Joint Committee laying
    down methods of administrative cooperation in the customs field
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3602/73 du Conseil, du 27 décembre 1973, concernant
    l'application de la décision n° 10/73 du Comité mixte CEE-Islande modifiant
    le protocole n° 3 relatif à la définition de la notion de "produits originaires"
    et aux méthodes de coopération administrative, ainsi que la décision n° 3/73
    du Comité mixte fixant les méthodes de coopération administrative dans le domaine
    douanier
  type: main
