  content: Commission Regulation (EU) 2021/1807 of 13 October 2021 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for acibenzolar-S-methyl, aqueous
    extract from the germinated seeds of sweet Lupinus albus, azoxystrobin, clopyralid,
    cyflufenamid, fludioxonil, fluopyram, fosetyl, metazachlor, oxathiapiprolin, tebufenozide
    and thiabendazole in or on certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/1807 de la Commission du 13 octobre 2021 modifiant
    les annexes II, III et IV du règlement (CE) no 396/2005 du Parlement européen
    et du Conseil en ce qui concerne les limites maximales applicables aux résidus
    d’acibenzolar-S-méthyle, d’azoxystrobine, de clopyralide, de cyflufénamid,
    d’extrait aqueux des graines germées de Lupinus albus doux, de fludioxonil,
    de fluopyram, de fosétyl, de métazachlore, d’oxathiapiproline, de tébufénozide
    et de thiabendazole présents dans ou sur certains produits
