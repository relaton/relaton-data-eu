title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 novembre 1972, portant prorogation de
    la décision de la Commission du 9 novembre 1970, autorisant la République fédérale
    d'Allemagne, la République française et la République italienne à appliquer
    des mesures de protection concernant les échanges intracommunautaires de vins,
    de la position 22.05 B du Tarif douanier commun, provenant de Grèce
  type: main
- language: de
  script: Latn
  content: '72/411/EWG: Entscheidung der Kommission vom 30. November 1972 zur Verlängerung
    der Geltungsdauer der Entscheidung vom 9. November 1970, mit der die Bundesrepublik
    Deutschland, die Französische Republik und die Italienische Republik ermächtigt
    werden, Schutzmaßnahmen betreffend den innergemeinschaftlichen Handel von Weinen
    der Position 22.05 B des Gemeinsamen Zolltarifs mit Herkunft aus Griechenland
    anzuwenden'
  type: main
- language: it
  script: Latn
  content: '72/411/CEE: Decisione della Commissione, del 30 novembre 1972, relativa
    alla proroga della decisione della Commissione del 9 novembre 1970, che autorizza
    la Repubblica federale di Germania, la Repubblica francese e la Repubblica italiana
    ad applicare delle misure di protezione negli scambi intracomunitari di vini,
    della voce 22.05 B della tariffa doganale comune, provenienti dalla Grecia'
  type: main
- language: nl
  script: Latn
  content: '72/411/EEG: Beschikking van de Commissie van 30 november 1972 houdende
    verlenging van de beschikking van 9 november 1970 waarbij de Duitse Bondsrepubliek,
    de Franse Republiek en de Italiaanse Republiek worden gemachtigd om beschermende
    maatregelen te treffen bij het intracommunautaire handelsverkeer van wijn uit
    Griekenland van post 22.05 B van het gemeenschappelijk douanetarief'
  type: main
