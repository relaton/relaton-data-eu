id: EURegulation30011980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3001/80 of 20 November 1980 re-establishing
    the levying of customs duties on fibre building boards of wood or other vegetable
    material, falling within heading No 44.11 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3001/80 de la Commission, du 20 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux panneaux
    de fibres de bois ou d' autres matières végétales de la position 44.11 du tarif
    douanier commun, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3001/80 der Kommission vom 20. November 1980 zur Wiedereinführung
    des Zollsatzes für Platten aus Fasern von Holz oder von anderen pflanzlichen
    Stoffen der Tarifnummer 44.11 mit Ursprung in Entwicklungsländern, denen die
    in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3001/80 af 20. november 1980 om genindførelse
    af opkrævning af toldafgifter for træfiberplader og fiberplader af andre vetetabilske
    materialer, under pos. 44.11, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3001/80 della Commissione, del 20 novembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai pannelli di fibre di
    legno o di altre materie vegetali della voce 44.11 della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3001/80 van de Commissie van 20 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor platen van houtvezels
    of van andere plantaardige vezels van post 44.11, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties
    werden geopend
  type: main
