title:
- language: en
  script: Latn
  content: '78/790/EEC: Commission Decision of 13 September 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to unbleached fabrics of synthetic rayon staple fibres,
    falling within subheading 56.07 ex B of the Common Customs Tariff (NIMEXE code
    56.07-42), originating in Romania and in free circulation in the other Member
    States'
  type: main
- language: fr
  script: Latn
  content: '78/790/CEE: Décision de la Commission, du 13 septembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus écrus de fibres synthétiques
    de fibranne, de la sous-position 56.07 ex B du tarif douanier commun (code Nimexe
    56.07-42) originaires de la Roumanie et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: '78/790/EWG: Entscheidung der Kommission vom 13. September 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Kónigreich der
    Niederlande ermáchtigt werden, aus Rumánien stammende und in den úbrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischer Zellwolle, roh, der Tarifstelle
    56.07 ex B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 56.07-42) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/790/EØF: Kommissionens beslutning af 13. september 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nedelandene
    til fra fællesskabsbehandling at undtage ublegede stoffer af syntetiske rayonstabelfibre,
    som henhører under pos. 56.07 ex B i den fælles toldtarif (NIMEXE-kode 56.07-42),
    har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/790/CEE: Decisione della Commissione, del 13 settembre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti greggi di fibre sintetiche
    di rayon fiocco della sottovoce 56.07 ex B della tariffa doganale comune (codice
    Nimexe: 56.07-42), originari della Romania e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/790/EEG: Beschikking van de Commissie van 13 september 1978 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd ongebleekte vezels van kunstmatige rayon-stapelvezels van post
    56.07 ex B van het gemeenschappelijk douanetarief (NIMEXE-code 56.07-42) van oorsprong
    uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
