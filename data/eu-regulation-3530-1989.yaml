- language: en
  script: Latn
  content: Council Regulation (EEC) No 3530/89 of 23 November 1989 amending Regulation
    (EEC) No 486/85 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific (ACP) States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3530/89 du Conseil du 23 novembre 1989 modifiant le
    règlement (CEE) n° 486/85 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d'Afrique, des Caraïbes et du Pacifique (États ACP) ou
    des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3530/89 DES RATES vom 23. November 1989 zur Änderung
    der Verordnung (EWG) Nr. 486/85 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in Afrika, im karibischen Raum und im Pazifischen Ozean oder in den überseeischen
    Ländern und Gebieten #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3530/89 af 23. november 1989 om ændring
