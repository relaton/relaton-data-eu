title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1314/84 of 11 May 1984 re-establishing the
    levying of customs duties on other static converters, falling within subheading
    85.01 B ex II and originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1314/84 de la Commission du 11 mai 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres convertisseurs statiques,
    de la sous-position 85.01 B ex II du tarif douanier commun, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1314/84 der Kommission vom 11. Mai 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Stromrichter der Tarifstelle 85.01 B ex II
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1314/84 af 11. maj 1984 om genindførelse
    af opkrævning af told for andre statiske omformere henhørende under pos. 85.01
    B ex II og med oprindelse i Hongkong, som præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1314/84 της Επιτροπής
    της 11ης Μαΐου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για έτερους μετατροπείς
    στατούς, της διακρίσεως 85.01 Β ex ΙΙ του Κοινού
    Δασμολογίου, καταγωγής Χονγκ Κονγκ, δικαιούχου
    των προβλεπομένων, από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου, δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1314/84 della Commissione dell' 11 maggio 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli altri convertitori
    statici della sottovoce 85.01 B ex II della tariffa doganale comune, originari
    di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1314/84 van de Commissie van 11 mei 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere statische
    omvormers van postonderverdeling 85.01 B ex II, van oorsprong uit Hong-Kong, waarvoor
    de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
