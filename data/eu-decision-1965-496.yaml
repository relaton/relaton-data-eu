title:
- language: fr
  script: Latn
  content: Décision 65/496/CEE de la Commission, du 27 octobre 1965, portant nouvelle
    prorogation et modification de sa décision du 6 novembre 1964, autorisant la
    perception de taxes compensatoires sur les importations en République française
    de chocolat et de confiseries et préparations comportant du cacao ou du chocolat,
    sans liqueur alcoolique, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '65/496/EWG: Entscheidung der Kommission vom 27. Oktober 1965 über die
    erneute Verlängerung und Änderung ihrer Entscheidung vom 6. November 1964 über
    die Erhebung von Ausgleichsabgaben bei der Einfuhr von Schokolade, Schokoladewaren
    und Kakao- oder schokoladehaltigen Zuckerwaren, nicht alkoholhaltig, aus verschiedenen
    Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '65/496/CEE: Decisione della Commissione, del 27 ottobre 1965, che proroga
    nuovamente e modifica la decisione del 6 novembre 1964 con cui si autorizza la
    riscossione di tasse di compensazione sulle importazioni, nella Repubblica francese,
    di cioccolata, di dolciumi e di preparazioni contenenti cacao o cioccolata, senza
    alcolici, provenienti da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/496/EEG: Beschikking van de Commissie van 27 oktober 1965 tot hernieuwde
    verlenging en wijziging van haar beschikking van 6 november 1964 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Franse Republiek
    van chocolade en van suikerwerk en voedingsmiddelen met cacao of met chocolade,
    zonder likeur, uit bepaalde Lid-Staten'
  type: main
