id: EUDecision1978390
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 March 1978 authorizing the French Republic not
    to apply Community treatment to blouses and shirts, knitted or crocheted (not
    elastic or rubberized) or woven, for women, girls and infants, of wool, cotton
    or man-made textile fibres, falling within subheading 60.05 A II or 61.02 B of
    the Common Customs Tariff, originating in Hong Kong and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/390/CEE: Décision de la Commission, du 29 mars 1978, autorisant la
    République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie (non élastique ni caoutchoutée)
    ou tissés, pour femmes, fillettes et jeunes enfants, de laine, de coton ou de
    fibres textiles synthétiques ou artificielles des sous-positions Ex 60.05 A II
    et Ex 61.02 B du Tarif douanier commun, originaires de Hong-Kong et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert oder Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle,
    Baumwolle, synthetischen oder künstlichen Spinnstoffen der Tarifnummern ex 60.05
    A II und ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 29. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage (ikke elastisk eller gummeret) eller vævede, til kvinder,
    piger og småbørn, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. 60.05 A II og 61.02 B i den fælles toldtarif, har oprindelse
    i Hongkong og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario camicie, camicette e bluse a
    maglia (non elastica né gommata) o tessute, per donna, per ragazza e per bambini,
    di lana, di cotone o di fibre tessili sintetiche o artificiali, delle sottovoci
    ex 60.05 A II e 61.02 B della tariffa doganale comune, originarie di Hong Kong
    e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 maart 1978 waarbij de Franse Republiek
    gemachtigd wordt blouses, overhemdblouses, van brei- of haakwerk (niet-elastisch,
    niet-gegummeerd) of geweven, voor dames, meisjes en kinderen, van wol, van katoen,
    of van synthetische of kunstmatige textielvezels, van de posten 60.05 A II en
    61.02 B van het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
