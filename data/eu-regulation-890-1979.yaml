title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 890/79 of 3 May 1979 re-establishing the
    levying of customs duties on knives with cutting blades, serrated or not, falling
    within heading No ex 82.09 and originating in developing countries, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3156/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 890/79 de la Commission, du 3 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux couteaux à lame tranchante
    ou dentelée, de la position ex 82.09 du tarif douanier commun, originaires des
    pays en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 890/79 der Kommission vom 3. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Messer mit schneidender oder gezahnter Klinge der Tarifnummer
    ex 82.09, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 890/79 af 3. maj 1979 om genindførelse
    af opkrævning af toldafgifter for knive med skærende eller savtakket æg, henhørende
    under pos. ex 82.09 i den fælles toldtarif, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 890/79 della Commissione, del 3 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante o dentata,
    della voce doganale ex 82.09, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 890/79 van de Commissie van 3 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten voor messen met snijdend lemmet, ook indien
    getand, van post ex 82.09, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties werden
    geopend
  type: main
