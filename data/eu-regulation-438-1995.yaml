  content: COMMISSION REGULATION (EC) No 438/95 of 28 February 1995 amending Commission
    Regulation (EEC) No 1620/93 laying down detailed rules for the application of
    Council Regulation (EEC) No 1766/92 and Regulation (EEC) No 1418/76 regarding
    the import and export system for products processed from cereals and rice respectively
  type: main
- language: fr
  script: Latn
