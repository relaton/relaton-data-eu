    eines Kontingents von Zubereitungen der zur Fütterung verwendeten Art der KN-Codes
    2309 90 31 und 2309 90 41 mit Ursprung in Bulgarien
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 623/94 af 21. marts 1994 om gennemførelsesbestemmelser
    for forvaltning af et kontingent for tilberedt dyrefoder henhørende under KN-kode
    2309 90 31 og 2309 90 41, der er fastsat i interimsaftalen om handel og handelsanliggender
    med Bulgarien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 623/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
