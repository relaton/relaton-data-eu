    εφαρμογής για τη διαχείριση ποσόστωσης παρασκευασμάτων
    των τύπων που χρησιμοποιούνται για τη διατροφή
    των ζώων και υπάγονται στους κωδικούς ΣΟ 2309
    90 31 και 2309 90 41, η οποία προβλέπεται από την ενδιάμεση
