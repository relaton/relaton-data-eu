title:
- language: en
  script: Latn
  content: Council Directive 76/629/EEC of 20 July 1976 amending for the twelfth time
    Directive 64/54/EEC on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 76/629/CEE du Conseil, du 20 juillet 1976, portant douzième
    modification de la directive 64/54/CEE relative au rapprochement des législations
    des États membres concernant les agents conservateurs pouvant être employés
    dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 76/629/EWG des Rates vom 20. Juli 1976 zur zwölften Änderung
    der Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 76/629/EØF af 20. juli 1976 om den tolvte ændring af
    direktiv 64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 76/629/ΕΟΚ του Συμβουλίου της 20ής Ιουλίου
    1976 περί δωδεκάτης τροποποιήσεως της οδηγίας
    64/54/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τα συντηρητικά που
    επιτρέπεται να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: it
  script: Latn
  content: Direttiva 76/629/CEE del Consiglio, del 20 luglio 1976, recante dodicesima
    modifica della direttiva 64/54/CEE, relativa al ravvicinamento delle legislazioni
    degli Stati Membri sui conservativi che possono essere impiegati nelle derrate
    destinate all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 76/629/EEG van de Raad van 20 juli 1976 houdende twaalfde wijziging
    van Richtlijn 64/54/EEG betreffende de aanpassing van de wetgevingen van de Lid-
    Staten inzake conserveermiddelen die mogen worden gebruikt in voor menselijke
    voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 76/629/CEE do Conselho, de 20 de Julho de 1976, que altera pela
    décima segunda vez a Directiva 64/54/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes aos conservantes que podem ser utilizados nos
    géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 76/629/CEE del Consejo, de 20 de julio de 1976, que modifica
    por duodécima vez la Directiva 64/54/CEE relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre los agentes conservadores que pueden utilizarse
    en los productos destinados al consumo humano
