title:
- language: fr
  script: Latn
  content: Décision de la Commission portant nouvelle modification de sa décision
    du 9 octobre 1962, autorisant la perception d'une taxe compensatoire sur les importations,
    en République fédérale d'Allemagne, de caramels mous, de caramels durs et de
    dragées en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '63/193/EWG: Entscheidung der Kommission über eine neue Änderung ihrer
    Entscheidung vom 9. Oktober 1962 über die Erhebung einer Ausgleichsabgabe auf
    Einfuhren von Hartkaramellen, Weichkaramellen und Dragees in die Bundesrepublik
    Deutschland aus einigen Mitgliedstaaten'
  type: main
- language: it
  script: Latn
  content: '63/193/CEE: Decisione della Commissione relativa ad una nuova modifica
    della propria decisione del 9 ottobre 1962, che autorizza la riscossione di una
    tassa di compensazione sulle importazioni nella Repubblica federale di Germania
    di caramelle tenere, di caramelle dure e di confetti in provenienza da alcuni
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/193/EEG: Beschikking van de Commissie houdende wijziging van de beschikking
    van de Commissie van 9 oktober 1962, houdende machtiging tot het leggen van een
    compenserende heffing op de invoer in de Bondsrepubliek Duitsland van harde karamels,
    zachte karamels en dragées uit sommige Lid-Staten'
  type: main
