id: EUDecision1978746
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 August 1978 authorizing the French Republic not
    to apply Community treatment to woven fabrics of regenerated textile fibres (discontinuous
    or waste) other than narrow woven fabrics, pile fabrics (including terry fabrics)
    and chenille fabrics, other than unbleached or bleached, falling within subheading
    56.07 B (NIMEXE codes 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66,
    72, 73, 74, 77, 78, 82, 83, 84, 87; 56.07-37, 44, 48, 52, 54, 57, 58, 63, 64,
    66, 73, 74, 77, 78, 83, 84, 87) of the Common Customs Tariff, originating in South
    Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/746/CEE: Décision de la Commission, du 21 août 1978, autorisant la
    République française à exclure du traitement communautaire les tissus de fibres
    textiles artificielles discontinues, autres que rubanerie, velours, peluches,
    tissus boucles (y compris les tissus boucles du genre éponge) et tissus de chenille,
    autres qu''écrus ou blanchis, de la sous-position 56.07 B du Tarif douanier commun
    (codes Nimexe : 56.07-37; 42; 44; 48; 52; 53; 54; 57; 58; 62; 63; 64; 66; 72;
    73; 74; 77; 78; 82; 83; 84; 87 - 56.07-37; 44; 48; 52; 54; 57; 58; 63; 64; 66;
    73; 74; 77; 78; 83; 84; 87), originaires de la Corée du Sud et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. August 1978, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus künstlichen Spinnfasern, andere als
    Bänder, Samt, Plüsch und Schlingengewebe (einschließlich Frottiergewebe) und
    Chenillegewebe, andere als roh oder gebleicht, der Tarifnummer 56.07 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 56.07-37; 42; 44; 48; 52; 53; 54; 57; 58; 62; 63;
    64; 66; 72; 73; 74; 77; 78; 82; 83; 84; 87 - 56.07-37; 44; 48; 52; 54; 57; 58;
    63; 64; 66; 73; 74; 77; 78; 83; 84; 87) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. august 1978 om bemyndigelse af den franske
    republik til fra fællesskabsbehandling at undtage vævet stof af endeløse regenererede
    fibre eller af affald af kemofibre, børstet fra vævede bånd, vævede fløjs-,
    plys- og chenillestoffer herunder håndklædefrotterstof og lignende frotterstof,
    andre end ublegede eller blegede, som henhører under pos. 56.07 B (NIMEXE-kode
    56.07, 37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64, 66, 72, 73, 74, 77, 78,
    82, 83, 84, 87 - 56.07-37, 44, 48, 52, 54, 57, 58, 63, 64, 66, 73, 74, 77, 78,
    83, 84, 87) i den fælles toldtarif, har oprindelse i Sydkorea
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 21 agosto 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario tessuti di fibre tessili artificiali
    in fiocco, diversi dai nastri, galloni e simili, velluti, felpe, tessuti ricci
    (compresi i tessuti ricci di tipo spugna) e tessuti di ciniglia, non greggi o
    imbianchiti della voce 56.07 B (codice Nimexe: 56.07-37, 42, 44, 48, 52, 53, 54,
    57, 58, 62, 64, 66, 72, 73, 74, 77, 78, 82, 83, 84, 87 - 56.07-37, 44, 48, 52,
    54, 57, 58, 63, 64, 66, 73, 74, 77, 78, 83, 84, 87) della tariffa doganale comune,
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 augustus 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van kunstmatige stapelvezels, uitgezonderd lint, fluweel,
    pluche, lussenweefsels (bad- of frotteerstof inbegrepen) en chenilleweefsels,
    andere dan ongebleekt of gebleekt, van post 56.07 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 56.07-37, 42, 44, 48, 52, 53, 54, 57, 58, 62, 63, 64,
    66, 72, 73, 74, 77, 78, 82, 83, 84, 87; 56.07-37, 44, 48, 52, 54, 57, 58, 63,
    64, 66, 73, 74, 77, 78, 83, 84, 87), van oorsprong uit Zuid-Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
