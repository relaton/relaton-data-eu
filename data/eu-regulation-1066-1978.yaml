id: EURegulation10661978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1066/78 of 22 May 1978 re-establishing the
    levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 and originating in
    Pakistan and the Philippines, to which the preferential tariff arrangements set
    out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1066/78 de la Commission, du 22 mai 1978, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastiqué ni caoutchoutée, de la position tarifaire 60.02,
    originaire du Pakistan et des Philippines, bénéficiaires de préférences tarifaires
    prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1066/78 der Kommission vom 22. Mai 1978 über die
    Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02, mit Ursprung in Pakistan und Philippinen,
    denen die in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1066/78 af 22. maj 1978 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, under position 60.02, som har oprindelse i Pakistan og
    Filippinerne og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1066/78 della Commissione, del 22 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia non
    elastica né gommata, della voce doganale 60.02, originari del Pakistan e delle
    Filippine, beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1066/78 van de Commissie van 22 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit Pakistan en de Filippijnen, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2706/77
    van de Raad
  type: main
