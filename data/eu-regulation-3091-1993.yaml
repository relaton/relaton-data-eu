    licitation med henblik på videresalg på det indre marked af hård hvede som
    det græske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3091/93 της Επιτροπής
    της 10ης Νοεμβρίου 1993 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 2782/93 και ορίζει σε 200 000 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση στην εσωτερική
    αγορά σκληρού σίτου που έχει στη διάθεσή του
    ο ελληνικός οργανισμός παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3091/93 della Commissione, del 10 novembre 1993, che
    modifica il regolamento (CEE) n. 2782/93 e che porta a 200 000 t il quantitativo
    globale oggetto della gara permanente per la rivendita sul mercato interno di
    frumento duro detenuto dall'organismo d'intervento greco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3091/93 van de Commissie van 10 november 1993 tot
