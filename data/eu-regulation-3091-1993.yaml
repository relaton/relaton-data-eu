title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3091/93 of 10 November 1993 amending Regulation
    (EEC) No 2782/93 and increasing to 200 000 tonnes the amount of durum wheat held
    by the Greek intervention agency for which a standing invitation to tender for
    resale on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3091/93 de la Commission, du 10 novembre 1993, modifiant
    le règlement (CEE) n 2782/93 et portant à 200 000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé dur détenu par l'organisme
    d'intervention grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3091/93 der Kommission vom 10. November 1993 zur Änderung
    der Verordnung (EWG) Nr. 2782/93 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 200 000 Tonnen Hartweizen aus Beständen
    der griechischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3091/93 af 10. november 1993 om ændring
