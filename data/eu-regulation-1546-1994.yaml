    1994 in conseguenza dei riallineamenti monetari del gennaio 1993 e del maggio
    1993 nonché del superamento del limite d'intervento fissato per la campagna 1993/1994
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1546/94 van de Commissie van 29 juni 1994 tot verlaging
