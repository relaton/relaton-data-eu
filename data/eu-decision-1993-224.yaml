title:
- language: en
  script: Latn
  content: '93/224/EEC: Commission Decision of 29 March 1993 on the establishment
    of an addendum to the Community support framework for Community structural assistance
    in the improvement of the conditions under which agricultural and forestry products
    are processed and marketed in Germany (excluding the five new Länder) (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/224/CEE: Décision de la Commission, du 29 mars 1993, concernant l''établissement
    d''un avenant au cadre communautaire d''appui pour les interventions structurelles
    communautaires relatives à l''amélioration des conditions de transformation
    et de commercialisation des produits agricoles et sylvicoles en Allemagne (à
    l''exception des cinq nouveaux Länder) (Le texte en langue allemande est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/224/EWG: Entscheidung der Kommission vom 29. März 1993 über eine
    Ergänzung des gemeinschaftlichen Förderkonzeptes für gemeinschaftliche Strukturinterventionen
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen Land- und forstwirtschaftlicher
    Erzeugnisse in Deutschland (ohne die fünf neuen Länder) (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/224/EØF: Kommissionens beslutning af 29. marts 1993 om et supplement
    til fællesskabsstøtterammen for EF''s strukturinterventioner i Tyskland (bortset
    fra de fem nye delstater) til forbedring af vilkårene for forarbejdning og afsætning
    af landbrugs- og skovbrugsprodukter (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 29ης Μαρτίου 1993
    για συμπλήρωση του κοινοτικού πλαισίου στήριξης
    για παροχή κοινοτικής διαρθρωτικής βοήθειας
    για τη βελτίωση των συνθηκών μεταποίησης και
    εμπορίας γεωργικών και δασοκομικών προϊόντων
    στη Γερμανία (χωρίς τα πέντε νέα ομοσπονδιακά
    κράτη) (Το κείμενο στην γερμανική γλώσσα είναι
    το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: '93/224/CEE: Decisione della Commissione, del 29 marzo 1993, relativa a
    un addendum del quadro comunitario di sostegno per gli interventi strutturali
    della Comunità in ordine al miglioramento delle condizioni di trasformazione
    e di commercializzazione dei prodotti agricoli e della silvicoltura in Germania
    (esclusi i cinque nuovi Länder) (Il testo in lingua tedesca è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '93/224/EEG: Beschikking van de Commissie van 29 maart 1993 tot vaststelling
