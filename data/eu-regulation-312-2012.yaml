    autonomiczne Wspólnej taryfy celnej na przywóz niektórych produktów przemysłowych
    do regionów autonomicznych Azorów i Madery
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 312/2012 da Comissão, de 9 de janeiro
    de 2012 , que altera o Regulamento (UE) n. ° 973/2010 do Conselho relativo à
    suspensão temporária dos direitos autónomos da Pauta Aduaneira Comum sobre
    as importações de um determinado número de produtos industriais pelas regiões
    autónomas dos Açores e da Madeira
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 312/2012 al Comisiei din 9 ianuarie 2012
