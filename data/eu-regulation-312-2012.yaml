title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 312/2012 of 9 January 2012 amending
    Council Regulation (EU) No 973/2010 temporarily suspending autonomous Common Customs
    Tariff duties on imports of certain industrial products into the autonomous regions
    of the Azores and Madeira
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 312/2012 de la Commission du 9 janvier
    2012 modifiant le règlement (UE) n ° 973/2010 du Conseil portant suspension,
    à titre temporaire, des droits autonomes du tarif douanier commun à l’importation
    de certains produits industriels dans les régions autonomes des Açores et de
    Madère
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 312/2012 der Kommission vom 9. Januar 2012
