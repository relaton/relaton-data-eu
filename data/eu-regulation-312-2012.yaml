    pozastavení všeobecných cel společného celního sazebníku na dovoz některých
    průmyslových výrobků do autonomních oblastí Azor a Madeiry
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 312/2012 af 9. januar 2012
