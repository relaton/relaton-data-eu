id: EURegulation30281979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3028/79 of 20 December 1979 opening, allocating
    and providing for the administration of a Community tariff quota for ferro-chromium
    containing not less than 4% by weight of carbon, falling within subheading ex
    73.02 E I of the Common Customs Tariff and extending the benefit of this quota
    to certain imports of ferro-chromium containing a quantity of between 3 and 4%
    by weight of carbon (1980)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3028/79 du Conseil, du 20 décembre 1979, portant
    ouverture, répartition et mode de gestion d' un contingent tarifaire communautaire
    de ferro-chrome contenant en poids 4% ou plus de carbone de la sous-position ex
    73.02 E I du tarif douanier commun et étendant le bénéfice de ce contingent
    à certaines importations de ferro-chrome contenant en poids une quantité de
    carbone comprise entre 3 et 4% (année 1980)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3028/79 des Rates vom 20. Dezember 1979 über die
    Eröffnung, Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für
    Ferrochrom mit einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs und über die Ausdehnung
    dieses Kontingents auf bestimmte Einfuhren von Ferrochrom mit einem Gehalt an
    Kohlenstoff von 3 bis 4 Gewichtshundertteilen (1980)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3028/79 af 20. december 1979 om åbning,
    fordeling og forvaltning af fællesskabstoldkontingent for ferrochrom indeholdende
    mindst 4 vægtprocent kulstof, henhørende under pos. ex 73.02 E I i den fælles
    toldtarif, og om udvidelse af dette kontingent til ligeledes at omfatte visse
    indførsler af ferrochrom indeholdende mellem 3 og 4 vægtprocent kulstof (1980)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3028/79 del Consiglio, del 20 dicembre 1979, relativo
    all' apertura, alla ripartizione ed alle modalità di gestione di un contingente
    tariffario comunitario di ferro-cromo contenente, in peso, il 4% o più di carbonio,
    della sottovoce ex 73.02 E I della tariffa doganale comune, e relativo all' estensione
    del beneficio di tale contingente a talune importazioni di ferro-cromo contenente,
    in peso, una quantità di carbonio compresa fra il 3 e il 4% (anno 1980)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3028/79 van de Raad van 20 december 1979 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor ferrochroom, bevattende 4 of meer gewichtspercenten koolstof, van onderverdeling
    ex 73.02 E I van het gemeenschappelijk douanetarief, en de uitbreiding van dit
    contingent tot bepaalde invoer van ferrochroom, bevattende ten minste 3 doch niet
    meer dan 4 gewichtspercenten koolstof (1980)
  type: main
