  content: Commission Regulation (EEC) No 3016/83 of 27 October 1983 re-establishing
    the levying of customs duties on paracetamol (INN), falling within subheading
    29.25 B III ex b) and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3016/83 de la Commission du 27 octobre 1983 portant
    rétablissement de la perception des droits de douane applicables au paracétamol
    (DCI), de la sous-position 29.25 B III ex b) du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3016/83 der Kommission vom 27. Oktober 1983 zur Wiedereinführung
    der Erhebung der Zölle für Paracetamol (INN) der Tarifstelle 29.25 B III ex
    b) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3016/83 af 27. oktober 1983 om genindførelse
