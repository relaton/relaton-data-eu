    auf die Notierungen von Tomaten der Güteklasse II anzuwenden ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1521/70 della Commissione, del 29 luglio 1970, che
    fissa un coefficiente di adattamento da applicare ai corsi dei pomodori di categoria
    II per il calcolo del prezzo d'entrata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1521/70 van de Commissie van 29 juli 1970 houdende
    vaststelling van een aanpassingscoëfficiënt die op de prijzen van tomaten van
    kwaliteitsklasse II moet worden toegepast met het oog op de berekening van de
    invoerprijs
