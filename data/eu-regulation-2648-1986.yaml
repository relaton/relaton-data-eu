    in fiocco, non preparati per la vendita al minuto, della categoria di prodotti
    n. 22 (codice 40.0220), originari del Pakistan beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2648/86 van de Commissie van 22 augustus 1986 houdende
