title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2648/86 of 22 August 1986 re-establishing
    the levying of customs duties on yarn of discontinuous or waste synthetic fibres,
    not put up for retail sale, products of category 22 (code 40.0220), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2648/86 de la Commission du 22 août 1986 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues, non conditionnés pour la vente au
    détail, de la catégorie de produits n° 22 (code 40.0220), originaires de Pakistan,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2648/86 der Kommission vom 22. August 1986 zur Wiedereinführung
