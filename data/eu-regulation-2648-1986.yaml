    für den Einzelverkauf, der Warenkategorie Nr. 22 (Kennziffer 40.0220) mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2648/86 af 22. august 1986 om genindførelse
