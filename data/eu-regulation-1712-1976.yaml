title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1712/76 of 15 July 1976 amending Regulation
    (EEC) No 1643/76 on the exceptional intervention measures in the beef and veal
    sector to be taken in certain regions of the Community most affected by the drought
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1712/76 de la Commission, du 15 juillet 1976, modifiant
    le règlement (CEE) n° 1643/76 relatif à des mesures exceptionnelles d'intervention
    dans le secteur de la viande bovine, à prendre dans certaines régions de la
    Communauté les plus touchées par la sécheresse
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1712/76 der Kommission vom 15. Juli 1976 zur Änderung
    der Verordnung (EWG) Nr. 1643/76 betreffend außergewöhnliche Interventionsmaßnahmen
    auf dem Rindfleischsektor für bestimmte durch die Trokkenheit am stärksten betroffene
    Gebiete der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1712/76 af 15. juli 1976 om ændring
    af forordning (EØF) nr. 1643/76 om særlige interventionsforanstaltninger, der
    skal gennemføres på oksekødmarkedet i visse af Fællesskabets områder, som
    er mest berørt af tørken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1712/76 della Commissione, del 15 luglio 1976, che
    modifica il regolamento (CEE) n. 1643/76 relativo a misure eccezionali d'intervento
    nel settore delle carni bovine da adottare nelle regioni della Comunità più
    colpite dalla siccità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1712/76 van de Commissie van 15 juli 1976 houdende
    wijziging van Verordening (EEG) nr. 1643/76 betreffende uitzonderlijke interventiemaatregelen
    in de sector rundvlees, die worden genomen in de door de droogte het meest getroffen
    gebieden van de Gemeenschap
