  script: Latn
  content: Commission Regulation (EEC) No 1883/81 of 8 July 1981 fixing the rates
    of the refunds applicable from 9 July 1981 to eggs and egg yolks exported in the
    form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1883/81 de la Commission, du 8 juillet 1981, fixant
    les taux des restitutions applicables, à compter du 9 juillet 1981, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1883/81 der Kommission vom 8. Juli 1981 zur Festsetzung
    der ab 9. Juli 1981 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1883/81 af 8. juli 1981 om fastsættelse
    af de restitutionssatser, der fra 9. juli 1981 skal anvendes for æg og æggeblommer,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
