    kuin on kyse Yhdistynyttä kuningaskuntaa ja tiettyjä sen kruunun alaisuuteen
    kuuluvia alueita koskevista kohdista sellaisten kolmansien maiden luettelossa,
    joista nautaeläinten alkioiden tuonti unioniin on sallittua
  type: main
- language: hr
  script: Latn
