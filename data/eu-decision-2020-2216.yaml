    mention relative au Royaume-Uni et à certaines dépendances de la Couronne dans
    la liste des pays tiers autorisés à importer dans l’Union des embryons de
    bovins
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2216 der Kommission vom 22. Dezember
    2020 zur Änderung des Anhangs I der Entscheidung 2006/168/EG im Hinblick auf
    die Aufnahme des Vereinigten Königreichs und mancher seiner unmittelbar der englischen
    Krone unterstehenden Gebiete in die Liste der Drittländer, aus denen die Einfuhr
    von Rinderembryonen in die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/2216 на Комисията
