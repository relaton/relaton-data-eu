    se Spojeného království a některých jeho závislých území v seznamu třetích
    zemí, ze kterých je povolen dovoz embryí skotu do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/2216 af 22. december
