  script: Latn
  content: Commission Implementing Decision (EU) 2020/2216 of 22 December 2020 amending
    Annex I to Decision 2006/168/EC as regards the entry for the United Kingdom and
    certain of the Crown Dependencies in the list of third countries authorised for
    imports into the Union of bovine embryos
  type: main
- language: fr
  script: Latn
