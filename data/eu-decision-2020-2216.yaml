    relativa ao Reino Unido e a certas dependências da Coroa na lista de países
    terceiros autorizados para importações na União de embriões de bovinos
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2216 a Comisiei din 22 decembrie
    2020 de modificare a anexei I la Decizia 2006/168/CE în ceea ce privește rubrica
    referitoare la Regatul Unit și anumite dependențe ale Coroanei britanice din
    lista țărilor terțe autorizate pentru importurile în Uniune de embrioni de
    bovine
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/2216 z 22. decembra 2020, ktorým
