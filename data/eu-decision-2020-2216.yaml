    за Обединеното кралство и някои подчинени
    на Британската корона територии в списъка
    на трети страни, от които е разрешен вносът
    в Съюза на ембриони от едър рогат добитък
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/2216, ze dne 22. prosince 2020,
