    kronska odvisna območja na seznamu tretjih držav, iz katerih je dovoljen vnos
    govejih zarodkov
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/2216 de la Comisión de 22 de diciembre
