    lijst van derde landen waaruit runderembryo’s in de Unie mogen worden ingevoerd
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/2216 z dnia 22 grudnia 2020 r. zmieniająca
    załącznik I do decyzji 2006/168/WE w odniesieniu do wpisu dotyczącego Zjednoczonego
    Królestwa i niektórych terytoriów zależnych Korony Brytyjskiej w wykazie państw
    trzecich, z których dozwolony jest przywóz do Unii zarodków bydlęcych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/2216 da Comissão de 22 de dezembro de
