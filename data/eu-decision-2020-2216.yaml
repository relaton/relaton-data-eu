    sa Spojeného kráľovstva a niektorých korunných dependencií v zozname tretích
    krajín, z ktorých je povolený dovoz embryí hovädzieho dobytka do Únie
  type: main
- language: sl
  script: Latn
  content: Delegirani sklep Komisije (EU) 2020/2216 z dne 22. decembra 2020 o spremembi
