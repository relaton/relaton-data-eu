  content: Commission Regulation (EEC) No 3629/89 of 4 December 1989 re-establishing
    the levying of customs duties on other made up textile articles, woven, excluding
    those of categories 113 and 114, products of category 112 (order No 40.1120),
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3629/89 de la Commission du 4 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, à l'exception de ceux des catégories 113 et 114, de
    la catégorie de produits n° 112 (numéro d'ordre 40.1120), originaires de la
    Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
