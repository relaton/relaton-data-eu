title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 498/76 of 4 March 1976 re-establishing the
    levying of customs duties on men's and boys' under garments, etc., of cotton fabric,
    falling within heading No ex 61.03, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3002/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 498/76 de la Commission, du 4 mars 1976, portant rétablissement
    de la perception des droits de douane applicables aux vêtements de dessous (linge
    de corps) pour hommes et garçonnets, etc. en tissus de coton, de la position
    tarifaire EX 61.03, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 498/76 der Kommission vom 4. März 1976 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Männer
    und Knaben usw., aus Baumwolle, der Tarifnummer ex 61.03, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3002/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 498/76 af 4. marts 1976 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til mænd og drenge
    af bomuld under position ex 61.03 som har oprindelse i Indien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3002/75 af 17.
    november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 498/76 della Commissione, del 4 marzo 1976, che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti (biancheria da dosso)
    per uomo e per ragazzo, ecc., in tessuti di cotone, della voce doganale ex 61.03,
    originari dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 498/76 van de Commissie van 4 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op herenonderkleding
    en jongensonderkleding, enz., van weefsels van katoen, van post ex 61.03, van
    oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november 1975
  type: main
