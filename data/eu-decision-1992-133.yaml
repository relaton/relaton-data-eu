    συνεργασίας μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της Δημοκρατίας της Ισλανδίας
    και του Βασιλείου της Σουηδίας, αντιστοίχως,
    για την έρευνα και την ανάπτυξη στον τομέα
    του περιβάλλοντος: "Επιστήμη και τεχνολογία
