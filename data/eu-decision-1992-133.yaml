title:
- language: en
  script: Latn
  content: '92/133/EEC: Council Decision of 3 February 1992 concerning the conclusion
    of bilateral Cooperation Agreements between the European Economic Community and
    the Republic of Iceland and the Kingdom of Sweden respectively on research and
    development in the field of the environment: Science and Technology for Environmental
    Protection (STEP) and European Programme on Climatology and Natural Hazards (Epoch)'
  type: main
- language: fr
  script: Latn
  content: '92/133/CEE: Décision du Conseil du 3 février 1992 concernant la conclusion
    d''accords de coopération bilatérale entre la Communauté économique européenne
    et, respectivement, la République d''Islande et le Royaume de Suède, relatifs
    à la recherche et au développement dans le domaine de l''environnement: science
    et technologie pour la protection de l''environnement (STEP) et programme européen
    en matière de climatologie et de risques naturels (EPOCH)'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 3. Februar 1992 über den Abschluß bilateraler
    Kooperationsabkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der
    Republik Island bzw. dem Königreich Schweden über Forschung und Entwicklung
    im Bereich der Umwelt: "Wissenschaft und Technologie für den Umweltschutz (STEP)"
    und "Europäisches Programm über Klimatologie und natürliche Risiken (EPOCH)"
    (92/133/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 3. februar 1992 om indgåelse af bilaterale samarbejdsaftaler
    mellem Det Europæiske Økonomiske Fællesskab og henholdsvis Republikken Island
    og Kongeriget Sverige om forskning og udvikling på miljøområdet: videnskab
    og teknologi på miljøbeskyttelsesområdet (STEP) og europæisk program for klimatologi
    og naturkatastrofer (EPOCH) (92/133/EØF) #'
  type: main
- language: el
  script: Grek
