    ta’ standards tekniċi regolatorji għall-applikazzjoni ta’ limiti ta’ pożizzjoni
    għal derivattivi ta’ komoditajiet u proċeduri għall-applikazzjoni għal eżenzjoni
    mil-limiti ta’ pożizzjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1302 van de Commissie van 20 april 2022
    tot aanvulling van Richtlijn 2014/65/EU van het Europees Parlement en de Raad
    met betrekking tot technische reguleringsnormen voor de toepassing van positielimieten
    op grondstoffenderivaten en procedures voor het aanvragen van een vrijstelling
    van positielimieten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1302 z dnia 20 kwietnia 2022
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2014/65/UE w odniesieniu
    do regulacyjnych standardów technicznych dotyczących stosowania limitów pozycji
    do towarowych instrumentów pochodnych oraz procedur ubiegania się o wyłączenie
    z limitów pozycji
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1302 da Comissão de 20 de abril de 2022
    que complementa a Diretiva 2014/65/UE do Parlamento Europeu e do Conselho no que
    diz respeito às normas técnicas de regulamentação para a aplicação de limites
    às posições em derivados de mercadorias e ao procedimento a seguir a fim de
    requerer a isenção de limites às posições
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1302 al Comisiei din 20 aprilie 2022 de
    completare a Directivei 2014/65/UE a Parlamentului European și a Consiliului
    cu privire la standardele tehnice de reglementare pentru aplicarea de limite ale
    pozițiilor în cazul instrumentelor financiare derivate pe mărfuri și la procedurile
    de solicitare de derogări de la limitele pozițiilor
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1302 z 20. apríla 2022, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2014/65/EÚ, pokiaľ ide o
    regulačné technické predpisy na uplatňovanie obmedzení pozícií komoditných
    derivátov a postupy uplatňovania výnimky z obmedzení pozícií
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1302 z dne 20. aprila 2022 o dopolnitvi
    Direktive 2014/65/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi za uporabo omejitev pozicij za izvedene finančne instrumente na blago
    in postopke za prošnjo za izvzetje iz omejitev pozicij
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1302 de la Comisión de 20 de abril de 2022
    por el que se completa la Directiva 2014/65/UE del Parlamento Europeo y del Consejo
    en lo relativo a las normas técnicas de regulación para la aplicación de límites
    de posición a los derivados sobre materias primas y los procedimientos de solicitud
    de exención de los límites de posición
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1302 av den 20 april 2022
    om komplettering av Europaparlamentets och rådets direktiv 2014/65/EU vad gäller
    tekniska tillsynsstandarder för tillämpning av positionslimiter för råvaruderivat
    och förfaranden för ansökan om undantag från positionslimiter
