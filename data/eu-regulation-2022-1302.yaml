    a dhéanamh ar dhíolmhú ó theorainneacha suímh
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1302 оd 20. travnja 2022. o dopuni
    Direktive 2014/65/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda za primjenu ograničenja pozicija na robne izvedenice i postupaka za
    podnošenje zahtjeva za izuzeće od ograničenja pozicija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1302 felhatalmazáson alapuló rendelete (2022.
    április 20.) a 2014/65/EU európai parlamenti és tanácsi irányelvnek a pozíciólimitek
    árualapú származtatott termékekre való alkalmazását és a pozíciólimitek
    alóli mentesség kérelmezésére vonatkozó eljárásokat meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1302 della Commissione del 20 aprile 2022
    che integra la direttiva 2014/65/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione relative all’applicazione
    dei limiti di posizione ai derivati su merci e le procedure per la richiesta di
    un’esenzione dai limiti di posizione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1302 (2022. gada 20. aprīlis),
    ar ko Eiropas Parlamenta un Padomes Direktīvu 2014/65/ES papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem par pozīciju limitu piemērošanu
    preču atvasinātajiem instrumentiem un procedūrām, lai pieteiktos atbrīvojumam
    no pozīciju limitiem
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1302 2022 m. balandžio 20
    d. kuriuo Europos Parlamento ir Tarybos direktyva 2014/65/ES papildoma biržos
    prekių išvestinių finansinių priemonių pozicijų apribojimų taikymo ir tvarkos,
    kaip pateikti prašymą netaikyti pozicijų apribojimų, techniniais reguliavimo
    standartais
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1302 tal-20 ta’ April 2022
