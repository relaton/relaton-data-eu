title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1302 of 20 April 2022 supplementing
    Directive 2014/65/EU of the European Parliament and of the Council with regard
    to regulatory technical standards for the application of position limits to commodity
    derivatives and procedures for applying for exemption from position limits
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1302 de la Commission du 20 avril 2022
    complétant la directive 2014/65/UE du Parlement européen et du Conseil par des
    normes techniques de réglementation sur l’application de limites de position
    aux instruments dérivés sur matières premières et sur les procédures de demande
    d’exemption de ces limites
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1302 der Kommission vom 20. April 2022
    zur Ergänzung der Richtlinie 2014/65/EU des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für die Anwendung von Positionslimits
    für Warenderivate und für Verfahren für Anträge auf Ausnahmen von Positionslimits
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1302 на Комисията
    от 20 април 2022 година за допълнение на Директива
    2014/65/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за прилагане на ограничения на позициите, свързани
    със стокови деривати, и за установяване на
    процедури за подаване на заявление за освобождаване
    от ограниченията на позициите
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1302 ze dne 20. dubna
    2022, kterým se doplňuje směrnice Evropského parlamentu a Rady 2014/65/EU,
    pokud jde o regulační technické normy pro uplatňování limitů pozic na komoditní
    deriváty a postupy pro žádost o výjimku z limitů pozic
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1302 af 20. april 2022 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2014/65/EU for
    så vidt angår reguleringsmæssige tekniske standarder for anvendelse af positionslofter
    på råvarederivater og procedurer for ansøgning om undtagelse fra positionslofter
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1302
    της Επιτροπής της 20ής Απριλίου 2022 για τη συμπλήρωση
    της οδηγίας 2014/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά ρυθμιστικά τεχνικά
    πρότυπα για την εφαρμογή ορίων θέσεων σε παράγωγα
    επί εμπορευμάτων καθώς και διαδικασίες για
    την υποβολή αίτησης εξαίρεσης από τα όρια θέσεων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/1302, 20. aprill 2022, millega
