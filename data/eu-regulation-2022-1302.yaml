  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/1302, annettu 20 päivänä huhtikuuta
    2022, Euroopan parlamentin ja neuvoston direktiivin 2014/65/EU täydentämisestä
    positiolimiittien hyödykejohdannaisiin soveltamista sekä positiolimiittejä
    koskevan poikkeuksen hakumenettelyjä koskevilla teknisillä sääntelystandardeilla
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/1302 ón gCoimisiún an 20 Aibreán 2022
    lena bhforlíontar Treoir 2014/65/AE ó Pharlaimint na hEorpa agus ón gComhairle
    maidir le caighdeáin theicniúla rialála chun teorainneacha suímh a chur i
