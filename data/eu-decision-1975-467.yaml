title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1975 authorizing the Italian Republic not
    to apply Community treatment to cotton shirts falling within heading No ex 61.03
    of the Common Customs Tariff, originating in Hong Kong and in free circulation
    in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '75/467/CEE: Décision de la Commission, du 10 avril 1975, autorisant la
    République italienne à exclure du traitement communautaire les chemises en coton,
    de la position Ex 61.03 du Tarif douanier commun, originaires de Hong-Kong et
    mises en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1975, mit der die Italienische
    Republik ermächtigt wird, aus Hongkong stammende und in der Bundesrepublik Deutschland
    im freien Verkehr befindliche Hemden aus Baumwolle der Tarifnummer ex 61.03 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. april 1975 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage skjorter af bomuld, som henhører
    under pos. ex 61.03 i den fælles toldtarif, har oprindelse i Hongkong og frit
    kan omsættes i forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le camicie di cotone della voce
    ex 61.03 della tariffa doganale comune, originarie di Hong Kong e messe in libera
    pratica nella Repubblica federale tedesca
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1975 waarbij de Italiaanse Republiek
    wordt gemachtigd de hemden van katoen van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de Duitse Bondsrepubliek in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
