title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3546/73 of the Commission of 21 December 1973 authorizing
    the United Kingdom to suspend temporarily and totally the customs duties on dried
    asparagus, celery and onions imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3546/73 de la Commission, du 21 décembre 1973, autorisant
    le Royaume-Uni à suspendre temporairement et totalement les droits de douane
    applicables aux asperges, céleris et oignons séchés importés en provenance
    des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3546/73 der Kommission vom 21. Dezember 1973 zur Ermächtigung
    des Vereinigten Königreichs, die Zollsätze auf aus anderen Mitgliedstaaten eingeführte
    getrocknete Spargel, Knollensellerie und Zwiebeln zeitweilig und vollständig
    auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3546/73 af 21. december 1973 om bemyndigelse
    for Det forenede Kongerige til midlertidigt helt at suspendere tolden på tørrede
    asparges, knoldselleri og spiseløg indført fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3546/73 della Commissione, del 21 dicembre 1973, che
    autorizza il Regno Unito a sospendere temporaneamente e totalmente i dazi doganali
    applicabili agli asparagi, sedani-rape, cipolle disseccati importati in provenienza
    dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3546/73 van de Commissie van 21 december 1973 waarbij
    het Verenigd Koninkrijk wordt gemachtigd tot een tijdelijke en gehele schorsing
    van de douanerechten op uit andere Lid-Staten ingevoerde gedroogde asperges, knolselderij
    en uien
  type: main
