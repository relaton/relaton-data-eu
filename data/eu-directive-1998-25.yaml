    ou naveguem sob jurisdição dos Estados-membros, das normas internacionais respeitantes
    à segurança da navegação, à prevenção da poluição e às condições de
    vida e de trabalho a bordo dos navios (inspecção pelo Estado do porto)
  type: main
- language: ro
  script: Latn
  content: Directiva 98/25/CE a Consiliului din 27 aprilie 1998 de modificare a Directivei
    95/21/CE privind punerea în aplicare, în ceea ce privește navele care fac escală
    în porturile comunitare sau în apele care intră sub jurisdicția statelor membre,
    a standardelor internaționale privind siguranța maritimă, prevenirea poluării
    și condițiile de viață și de muncă de la bordul navelor (controlul statului
    de port)
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 98/25/ES z 27. apríla 1998, ktorou sa mení a dopĺňa smernica
