title:
- language: en
  script: Latn
  content: Council Directive 98/25/EC of 27 April 1998 amending Directive 95/21/EC
    concerning the enforcement, in respect of shipping using Community ports and sailing
    in the waters under the jurisdiction of the Member States, of international standards
    for ship safety, pollution prevention and shipboard living and working conditions
    (port State control)
  type: main
- language: fr
  script: Latn
  content: Directive 98/25/CE du Conseil du 27 avril 1998 modifiant la directive 95/21/CE
    concernant l'application aux navires faisant escale dans les ports de la Communauté,
    ou dans les eaux relevant de la juridiction des États membres, des normes internationales
    relatives à la sécurité maritime, à la prévention de la pollution et aux
    conditions de vie et de travail à bord des navires (contrôle par l'État du
    port)
  type: main
- language: de
  script: Latn
  content: Richtlinie 98/25/EG des Rates vom 27. April 1998 zur Änderung der Richtlinie
    95/21/EG zur Durchsetzung internationaler Normen für die Schiffssicherheit, die
    Verhütung von Verschmutzung und die Lebens- und Arbeitsbedingungen an Bord von
    Schiffen, die Gemeinschaftshäfen anlaufen und in Hoheitsgewässern der Mitgliedstaaten
    fahren (Hafenstaatkontrolle)
  type: main
- language: bg
  script: Cyrl
  content: Директива 98/25/ЕО на Съвета от 27 април 1998
    година за изменение на Директива 95/21/ЕО относно
    прилагането по отношение на кораби, които използват
    пристанища на Общността или плават във води
    под юрисдикцията на държавите-членки, на международните
    стандарти за безопасност на корабоплаването,
    предотвратяване на замърсяването и за условията
    на живот и работа на борда на корабите (Държавен
    пристанищен контрол)
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 98/25/ES ze dne 27. dubna 1998, kterou se mění směrnice
    95/21/ES o uplatňování mezinárodních norem pro bezpečnost lodí, zabránění
    znečištění a životní a pracovní podmínky na lodích, které využívají
    přístavy Společenství a plují ve výsostných vodách členských států
    (státní přístavní inspekce)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 98/25/EF af 27. april 1998 om ændring af direktiv 95/21/EF
    om håndhævelse over for skibe, der anløber Fællesskabets havne og sejler i
    farvande under medlemsstaternes jurisdiktion, af internationale standarder for
    skibes sikkerhed, for forureningsforebyggelse samt for leve- og arbejdsvilkår
    om bord (havnestatskontrol)
  type: main
- language: el
  script: Grek
  content: Οδηγία 98/25/ΕΚ του Συμβουλίου της 27ης Απριλίου
