    szóló 95/21/EK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 98/25/CE del Consiglio del 27 aprile 1998 che modifica la direttiva
    95/21/CE, relativa all'attuazione di norme internazionali per la sicurezza delle
    navi, la prevenzione dell'inquinamento e le condizioni di vita e di lavoro a bordo,
    per le navi che approdano nei porti comunitari e che navigano nelle acque sotto
    la giurisdizione degli Stati membri (controllo dello Stato di approdo)
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 98/25/EK (1998. gada 27. aprīlis), ar kuru groza Direktīvu
    95/21/EK, kas nosaka, kā kuģošanai Kopienas ostās un dalībvalstu jurisdikcijai
    pakļautos ūdeņos piemērot starptautiskos standartus attiecībā uz kuģu drošību,
    piesārņojuma novēršanu un dzīves un darba apstākļiem uz kuģiem (ostas
    valsts kontrole)
  type: main
