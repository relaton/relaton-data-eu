    u l-kondizzjonijiet ta' l-għajxien u tax-xogħol abbord (kontroll portwali ta'
    l-Istat)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 98/25/EG van de Raad van 27 april 1998 houdende wijziging van
    Richtlijn 95/21/EG betreffende de naleving, met betrekking tot de schepen die
    gebruik maken van havens in de Gemeenschap en varen in de onder de jurisdictie
    van de lidstaten vallende wateren, van internationale normen op het gebied van
    de veiligheid van schepen, voorkoming van verontreiniging en leef- en werkomstandigheden
    aan boord (havenstaatcontrole)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 98/25/WE z dnia 27 kwietnia 1998 r. zmieniająca dyrektywę
    95/21/WE dotyczącą przestrzegania, w odniesieniu do żeglugi morskiej korzystającej
    ze wspólnotowych portów oraz żeglugi morskiej po wodach znajdujących się
    pod jurysdykcją Państw Członkowskich, międzynarodowych norm bezpieczeństwa
    statków i zapobiegania zanieczyszczeniom oraz pokładowych warunków życia i
    pracy (kontrola państwa portu)
  type: main
- language: pt
  script: Latn
