id: EUDecision19601202
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision relative à la circulation des marchandises relevant de la Communauté
    économique européenne qui sont obtenues dans un État membre et dans la fabrication
    desquelles sont entrés des produits de pays tiers relevant de la Communauté
    européenne du charbon et de l'acier qui n'ont été soumis dans aucun État membre
    aux droits de douane et taxes d'effet équivalent qui leur étaient applicables
    ou qui ont bénéficié d'une ristourne totale ou partielle de ces droits ou taxes
  type: main
- language: de
  script: Latn
  content: Entscheidung über den Verkehr mit EWG-Waren, die in einem Mitgliedstaat
    unter Verwendung von EGKS- Erzeugnissen dritter Länder hergestellt wurden, für
    welche in einem Mitgliedstaat die auf sie anwendbaren Zölle und Abgaben gleicher
    Wirkung nicht erhoben oder vollständig oder teilweise rückvergütet worden sind
  type: main
- language: it
  script: Latn
  content: Decisione relativa alla circolazione delle merci di competenza della Comunità
    Economica Europea, ottenute in uno Stato membro e nella fabbricazione delle quali
    siano stati impiegati prodotti di paesi terzi di competenza della Comunità Europea
    del Carbone e dell'Acciaio, che non siano stati assoggettati, in alcuno Stato
    membro, né ai dazi doganali né alle tasse di effetto equivalente loro applicabili,
    o che abbiano beneficiato di un ristorno totale o parziale di tali dazi o tasse
  type: main
- language: nl
  script: Latn
  content: Beschikking inzake het verkeer van de onder de Europese Economische Gemeenschap
    vallende goederen die in een Lidstaat zijn verkregen en waarin onder de Europese
    Gemeenschap voor Kolen en Staal vallende produkten van derde landen zijn verwerkt
    op welke in geen enkele Lidstaat de toepasselijke douanerechten en heffingen van
    gelijke werking zijn geheven of waarvoor gehele of gedeeltelijke teruggave van
    die rechten of heffingen is verleend
  type: main
