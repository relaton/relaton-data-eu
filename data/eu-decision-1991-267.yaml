    " URSPRUNGSWAREN " ZUR BERUECKSICHTIGUNG DER BESONDEREN LAGE FIDSCHIS BEI DER
    HERSTELLUNG VON BESTIMMTER KLEIDUNG'
  type: main
- language: da
  script: Latn
  content: '91/267/EOEF: AFGOERELSE NR. 4/91 TRUFFET AF AVS / EOEF-TOLDSAMARBEJDSUDVALGET
    AF 23. APRIL 1991 OM UNDTAGELSE FRA BEGREBET " VARER MED OPRINDELSESSTATUS " FOR
    AT TAGE HENSYN TIL FIJIS SAERLIGE SITUATION FOR SAA VIDT ANGAAR PRODUKTIONEN AF
    VISSE BEKLAEDNINGSGENSTANDE'
  type: main
- language: el
  script: Grek
  content: '91/267/ΕΟΚ: Απόφαση αριθ. 4/91 της Επιτροπής
