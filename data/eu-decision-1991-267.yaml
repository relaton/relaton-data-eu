  content: '91/267/EEC: Decision No4/91 of the ACP - EEC customs cooperation committee
    of 23 April 1991 derogating from the definition of the concept of '' originating
    products '' to take account of the special situation of FIJI with regard to its
    production of certain garments'
  type: main
- language: fr
  script: Latn
  content: '91/267/CEE: Décision n° 4/91 du comité de coopération douanière ACP-CEE,
    du 23 avril 1991, portant dérogation à la définition de la notion de "produits
    originaires" pour tenir compte de la situation particulière de Fidji en ce qui
    concerne sa production de certains vêtements'
  type: main
- language: de
  script: Latn
  content: '91/267/EWG: BESCHLUSS NR. 4/91 DES AKP - EWG-AUSSCHUSSES FUER ZUSAMMENARBEIT
