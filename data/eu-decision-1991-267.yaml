    1991 για παρέκκλιση από τον ορισμό της έννοιας
    των " προϊόντων καταγωγής " ώστε να ληφθεί υπόψη
    η ιδιαίτερη κατάσταση του Φίτζι όσον αφορά
    την παραγωγή ορισμένων ειδών ένδυσης'
  type: main
- language: it
  script: Latn
  content: '91/267/CEE: DECISIONE N. 4/91 DEL COMITATO DI COOPERAZIONE DOGANALE ACP
    - CEE, DEL 23 APRILE 1991, RECANTE DEROGA ALLA DEFINIZIONE DEL CONCETTO DI " PRODOTTI
    ORIGINARI " PER LA PARTICOLARE SITUAZIONE DELLE ISOLE FIGI IN ORDINE ALLA PRODUZIONE
    DI TALUNI INDUMENTI'
  type: main
- language: nl
  script: Latn
  content: '91/267/EEG: BESLUIT NR. 4/91 VAN HET ACS - EEG-COMITE VOOR DOUANESAMENWERKING
    VAN 23 APRIL 1991 HOUDENDE AFWIJKING VAN DE DEFINITIE VAN HET BEGRIP " PRODUKTEN
    VAN OORSPRONG " TEN EINDE REKENING TE HOUDEN MET DE BIJZONDERE SITUATIE VAN FIDJI
    WAT DE PRODUKTIE VAN BEPAALDE KLEDINGSTUKKEN BETREFT'
  type: main
- language: pt
  script: Latn
  content: '91/267/CEE: DECISAO NO 4/91 DO COMITE DE COOPERACAO ADUANEIRA ACP - CEE,
    DE 23 DE ABRIL DE 1991, QUE DERROGA A DEFINICAO DA NOCAO DE " PRODUTOS ORIGINARIOS
    " PARA TER EM CONTA A SITUACAO ESPECIAL DAS ILHAS FIJI NO QUE RESPEITA A SUA PRODUCAO
    DE DETERMINADO VESTUARIO'
  type: main
- language: es
  script: Latn
  content: '91/267/CEE: DECISION NO 4/91 DEL COMITE DE COOPERACION ADUANERA ACP -
    CEE, DE 23 DE ABRIL DE 1991, POR LA QUE SE ESTABLECE UNA EXCEPCION A LA DEFINICION
    DE LA NOCION DE " PRODUCTOS ORIGINARIOS ", A FIN DE TENER EN CUENTA LA SITUACION
    ESPECIAL DE FIJI EN LO QUE SE REFIERE A SU PRODUCCION DE CIERTAS PRENDAS DE VESTIR'
