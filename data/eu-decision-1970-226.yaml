title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 mars 1970, autorisant la République
    française à exclure du traitement communautaire les carreaux, pavés, dalles
    de pavement ou de revêtement, des positions 69.07 A et B II et 69.08 A et B II
    du Tarif douanier commun, originaires du Japon et mis en libre pratique en Allemagne
  type: main
- language: de
  script: Latn
  content: '70/226/EWG: Entscheidung der Kommission vom 24. März 1970, mit der die
    Französische Republik ermächtigt wird, die aus Japan stammenden und in der Bundesrepublik
    Deutschland im freien Verkehr befindlichen Fliesen, gebrannten Pflastersteine,
    Boden- oder Wandplatten der Tarifnummern 69.07 A und B II und 69.08 A und B II
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/226/CEE: Decisione della Commissione, del 24 marzo 1970, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le piastrelle,
    i blocchetti e le lastre da pavimentazione e da rivestimento, delle voci 69.07
    A e B II e 69.08 A e B II della tariffa doganale comune, originari del Giappone
    e messi in libera pratica nella Repubblica federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '70/226/EEG: Beschikking van de Commissie van 24 maart 1970 waarbij de
    Franse Republiek wordt gemachtigd plavuizen, vloer- en wandtegels van de posten
    69.07 A en B II en 69.08 A en B II van het gemeenschappelijk douanetarief, van
    oorsprong uit Japan en in de Bondsrepubliek Duitsland in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
