  content: Commission Delegated Regulation (EU) 2022/1636 of 5 July 2022 supplementing
    Council Directive (EU) 2020/262 by establishing the structure and content of the
    documents exchanged in the context of movement of excise goods, and establishing
    a threshold for the losses due to the nature of the goods
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1636 de la Commission du 5 juillet 2022
