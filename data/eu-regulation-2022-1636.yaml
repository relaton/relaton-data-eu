    le contenu des documents échangés dans le cadre des mouvements de produits soumis
    à accise, et établissant un seuil pour les pertes dues à la nature des produits
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1636 der Kommission vom 5. Juli 2022 zur
