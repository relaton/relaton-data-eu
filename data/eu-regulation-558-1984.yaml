  content: Commission Regulation (EEC) No 558/84 of 29 February 1984 imposing a provisional
    anti-dumping duty on imports of hardboard originating in the Soviet Union and
    re-opening the anti-dumping proceeding concerning those imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 558/84 de la Commission du 29 février 1984 instituant
    un droit anti-dumping provisoire sur les importations de panneaux durs originaires
    d' Union soviétique, d' une part, et portant réouverture de la procédure anti-dumping
    concernant ces importations, d' autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 558/84 der Kommission vom 29. Februar 1984 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren von Hartplatten mit Ursprung
    in der Sowjetunion und zur Wiedereinleitung des Antidumpingverfahrens betreffend
    diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 558/84 af 29. februar 1984 om indførelse
    af en midlertidig antidumpingtold på importen af hårde fiberplader med oprindelse
    i Sovjetunionen og om genoptagelse af antidumpingproceduren vedrørende importen
    af denne vare
  type: main
