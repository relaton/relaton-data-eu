title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 627/86 of 28 February 1986 derogating, in
    the case of olive oil, from Regulation (EEC) No 410/86 on transitional measures
    to be adopted on account of the accession of Spain and Portugal, in respect of
    trade in agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 627/86 de la Commission du 28 février 1986 dérogeant
    au règlement (CEE) n° 410/86 relatif aux mesures transitoires à prendre, du
    fait de l' adhésion de l' Espagne et du Portugal, concernant les échanges de
    produits agricoles en ce qui concerne l' huile d' olive
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 627/86 der Kommission vom 28. Februar 1986 zur Abweichung
    von der Verordnung (EWG) Nr. 410/86 über die aufgrund des Beitritts Spaniens
    und Portugals zu treffenden Übergangsmaßnahmen für den Handel mit landwirtschaftlichen
    Erzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 627/86 af 28. februar 1986 om fravigelse
    fra forordning (EØF) nr. 410/86 om de overgangsforanstaltninger, der på grund
    af Spaniens og Portugals tiltrædelse skal træffes med hensyn til samhandelen
    med landbrugsprodukter, for så vidt angår olivenolie
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 627/86 της Επιτροπής
    της 28ης Φεβρουαρίου 1986 για παρέκκλιση από τον
    κανονισμό (ΕΟΚ) αριθ. 410/86 σχετικά με τα μεταβατικά
    μέτρα που πρέπει να ληφθούν, λόγω της προσχώρησης
    της Ισπανίας και της Πορτογαλίας, στις συναλλαγές
    γεωργικών προϊόντων, όσον αφορά το ελαιόλαδο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 627/86 della Commissione del 28 febbraio 1986 che
    deroga nel settore dell' olio d' oliva, al regolamento (CEE) n. 410/86, relativo
    alle misure transitorie da adottare, in seguito all' adesione della Spagna e del
    Portogallo, per quanto riguarda gli scambi di prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 627/86 van de Commissie van 28 februari 1986 houdende
    afwijking van Verordening (EEG) nr. 410/86 betreffende de wegens de toetreding
    van Spanje en Portugal voor het handelsverkeer in landbouwprodukten te nemen overgangsmaatregelen,
    ten aanzien van olijfolie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 627/86 da Comissão de 28 de Fevereiro de 1986 que
    derroga o Regulamento (CEE) n.° 410/86 relativo às medidas transitórias a adoptar,
    aquando da adesão de Espanha e de Portugal, no que diz respeito às trocas comerciais
    de produtos agrícolas relativamente ao azeite
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 627/86 de la Comisión de 28 de febrero de 1986 que
    establece supuestos de inaplicación del Reglamento (CEE) n° 410/86, relativo
    a las medidas transitorias que deben tomarse con motivo de la adhesión de España
    y Portugal, por lo que respecta a los intercambios de productos agrícolas en
    el caso concreto del aceite de oliva
  type: main
