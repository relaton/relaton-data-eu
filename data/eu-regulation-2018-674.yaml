    do punktów ładowania dla pojazdów silnikowych kategorii L, zasilania statków
    żeglugi śródlądowej energią elektryczną z lądu i punktów tankowania skroplonego
    gazu ziemnego na potrzeby transportu wodnego, oraz zmieniające tę dyrektywę
    w odniesieniu do złączy dla pojazdów silnikowych stosowanych do tankowania
    wodoru w stanie gazowym
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2018/674 da Comissão, de 17 de novembro de 2017,
    que completa a Diretiva 2014/94/UE do Parlamento Europeu e do Conselho no que
    diz respeito aos pontos de carregamento para veículos a motor de categoria L,
    ao fornecimento de eletricidade a partir da rede terrestre às embarcações de
    navegação interior e aos pontos de abastecimento de GNL para o transporte aquático,
    e que altera a referida diretiva em matéria de dispositivos de conexão para
    veículos a motor para o abastecimento com hidrogénio gasoso
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2018/674 al Comisiei din 17 noiembrie 2017 de
    completare a Directivei 2014/94/UE a Parlamentului European și a Consiliului
    în ceea ce privește punctele de reîncărcare pentru autovehiculele de categoria
    L, alimentarea de la rețeaua electrică terestră a navelor de navigație interioară
    și punctele de realimentare cu GNL pentru transportul naval și de modificare
    a directivei respective în ceea ce privește conectoarele pentru realimentarea
    cu hidrogen gazos a autovehiculelor
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2018/674 zo 17. novembra 2017, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2014/94/EÚ, pokiaľ ide o
    nabíjacie stanice pre motorové vozidlá kategórie L, pobrežné zásobovanie
    plavidiel vnútrozemskej vodnej dopravy elektrickou energiou a čerpacie stanice
    LNG pre vodnú dopravu, a ktorým sa mení uvedená smernica, pokiaľ ide o konektory
    pre motorové vozidlá na tankovanie plynného vodíka
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2018/674 z dne 17. novembra 2017 o dopolnitvi
