  content: Commission Delegated Regulation (EU) 2018/674 of 17 November 2017 supplementing
    Directive 2014/94/EU of the European Parliament and of the Council as regards
    recharging points for L-category motor vehicles, shore-side electricity supply
    for inland waterway vessels and refuelling points for LNG for waterborne transport,
    and amending that Directive as regards connectors for motor vehicles for the refuelling
    of gaseous hydrogen
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/674 de la Commission du 17 novembre 2017
    complétant la directive 2014/94/UE du Parlement européen et du Conseil en ce
    qui concerne les points de recharge pour les véhicules à moteur de catégorie
    L, l'alimentation électrique à quai pour les bateaux de navigation intérieure
    et les points de ravitaillement en GNL pour les transports par voie d'eau, et
    modifiant cette directive en ce qui concerne les connecteurs de véhicules à
    moteur pour le ravitaillement en hydrogène gazeux
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/674 der Kommission vom 17. November 2017
    zur Ergänzung der Richtlinie 2014/94/EU des Europäischen Parlaments und des
    Rates im Hinblick auf Ladepunkte für Kraftfahrzeuge der Klasse L, die landseitige
    Stromversorgung für Binnenschiffe und LNG-Tankstellen für den Schiffsverkehr
    und zur Änderung dieser Richtlinie im Hinblick auf Kupplungen zur Betankung von
    Kraftfahrzeugen mit gasförmigem Wasserstoff
  type: main
- language: bg
  script: Cyrl
