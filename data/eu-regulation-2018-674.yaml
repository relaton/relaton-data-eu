    gépjárművek töltőállomásai, a belvízi hajók part menti villamosenergia-ellátása
    és a vízi közlekedést szolgáló LNG-töltőállomások tekintetében történő
    kiegészítéséről, valamint az irányelvnek a gépjárművek gáz-halmazállapotú
    hidrogénnel való töltésére szolgáló csatlakozók tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2018/674 della Commissione, del 17 novembre 2017,
    che integra la direttiva 2014/94/UE del Parlamento europeo e del Consiglio per
    quanto riguarda i punti di ricarica per i veicoli a motore della categoria L,
    la fornitura di elettricità lungo le coste per le navi adibite alla navigazione
    interna e i punti di rifornimento per il GNL per il trasporto per via navigabile,
    e modifica tale direttiva per quanto riguarda i connettori per veicoli a motore
    per il rifornimento di idrogeno gassoso
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2018/674 (2017. gada 17. novembris),
