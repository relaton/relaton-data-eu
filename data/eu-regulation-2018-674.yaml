    motornih vozila kategorije L, opskrbe električnom energijom s kopna plovila na
    unutarnjim vodnim putovima i mjesta za opskrbu ukapljenim prirodnim plinom vodnog
    prometa te o izmjeni te direktive u pogledu priključaka za motorna vozila za
    opskrbu plinovitim vodikom
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/674 felhatalmazáson alapuló rendelete (2017. november
