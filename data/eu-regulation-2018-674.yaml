    za motorna vozila kategorije L, oskrbo z električno energijo z obale za plovila
    za plovbo po celinskih plovnih poteh in oskrbovalnimi mesti za UZP za vodni promet
    ter o spremembi navedene direktive v zvezi s priključki za motorna vozila za
    dovod plinastega vodika
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2018/674 de la Comisión, de 17 de noviembre de
    2017, por el que se completa la Directiva 2014/94/UE del Parlamento Europeo y
    del Consejo en lo que respecta a los puntos de recarga para vehículos de motor
    de categoría L, el suministro de electricidad en puerto a los buques de navegación
    interior y los puntos de repostaje de GNL para los transportes acuáticos, y por
    el que se modifica dicha Directiva en lo que respecta a los conectores de los
    vehículos de motor para el repostaje de hidrógeno gaseoso
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2018/674 av den 17 november 2017
    om komplettering av Europaparlamentets och rådets direktiv 2014/94/EU vad gäller
    laddningsstationer för motorfordon i kategori L, landströmsförsörjning till
    fartyg i inlandssjöfart och LNG-tankstationer för vattenvägstransporter, och
    om ändring av det direktivet vad gäller anslutningsdon till motorfordon för
