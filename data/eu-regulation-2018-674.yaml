    2017, Euroopan parlamentin ja neuvoston direktiivin 2014/94/EU täydentämisestä
    siltä osin kuin kyse on L-luokan moottoriajoneuvojen latauspisteistä, sisävesialusten
    maasähkönsyötöstä ja vesiliikenteen nesteytetyn maakaasun tankkauspisteistä
    sekä mainitun direktiivin muuttamisesta siltä osin kuin kyse on kaasumaisen
    vedyn tankkaukseen tarkoitetuista moottoriajoneuvojen liittimistä
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2018/674 оd 17. studenoga 2017. o dopuni
