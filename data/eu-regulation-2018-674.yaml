    jidħlu l-punti tal-iċċarġjar għal vetturi bil-mutur tal-kategorija L, il-provvista
    tal-elettriku max-xatt għal bastimenti tal-passaġġi fuq l-ilma interni u bejn
    il-punti tar-riforniment tal-LNG għat-trasport fuq l-ilma, u li jemenda dik id-Direttiva
