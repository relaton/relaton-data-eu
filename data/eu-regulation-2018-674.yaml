    uz L kategorijas mehānisko transportlīdzekļu uzlādes punktiem, krasta elektropadevi
    iekšzemes ūdensceļu kuģiem un ūdens transporta LNG uzpildes punktiem un groza
    minēto direktīvu attiecībā uz savienojumiem mehānisko transportlīdzekļu
    uzpildei ar gāzveida ūdeņradi
  type: main
- language: lt
  script: Latn
  content: 2017 m. lapkričio 17 d. Komisijos deleguotasis reglamentas (ES) 2018/674,
