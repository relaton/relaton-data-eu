    utilizzare i certificati veterinari previsti per l''importazione di carni di selvaggina,
    carni di selvaggina d''allevamento e carni di coniglio provenienti da paesi terzi
    [notificata con il numero C(1998) 3332]'
  type: main
- language: nl
