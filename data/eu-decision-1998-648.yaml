title:
- language: en
  script: Latn
  content: '98/648/EC: Commission Decision of 5 November 1998 amending Decision 97/217/EC
    establishing groups of third countries which are able to use the veterinary certification
    for imports of wild game meat, farmed game meat and rabbit meat from third countries
    (notified under document number C(1998) 3332)'
  type: main
- language: fr
  script: Latn
  content: '98/648/CE: Décision de la Commission du 5 novembre 1998 modifiant la
    décision 97/217/CE établissant des groupes de pays tiers pouvant utiliser les
    certificats vétérinaires pour les importations de viandes de gibier, de viandes
    de gibier d''élevage et de viandes de lapin en provenance de pays tiers [notifiée
    sous le numéro C(1998) 3332]'
  type: main
- language: de
  script: Latn
  content: '98/648/EG: Entscheidung der Kommission vom 5. November 1998 zur Änderung
    der Entscheidung 97/217/EG zur Bildung von Gruppen von Drittländern, die die
    Veterinärbescheinigung für die Einfuhr von Fleisch von freilebendem Wild, Zuchtwild
    und Kaninchen aus Drittländern verwenden dürfen (Bekanntgegeben unter Aktenzeichen
    K(1998) 3332)'
  type: main
- language: da
  script: Latn
  content: '98/648/EF: Kommissionens beslutning af 5. november 1998 om ændring af
    beslutning 97/217/EF om grupper af tredjelande, der kan benytte sundheds- og hygiejnecertifikaterne
    i forbindelse med indførsel af kød af vildtkød, opdrættet vildt og kaninkød
    fra tredjelande (meddelt under nummer K(1998) 3332)'
  type: main
- language: el
  script: Grek
  content: '98/648/ΕΚ: Απόφαση της Επιτροπής, της 5ης Νοεμβρίου
    1998, για τροποποίηση της απόφασης 97/217/ΕΚ για
    τον καθορισμό ομάδων τρίτων χωρών οι οποίες
    δύνανται να χρησιμοποιούν την κτηνιατρική
    πιστοποίηση για εισαγωγές κρέατος αγρίων θηραμάτων,
    κρέατος εκτρεφομένων θηραμάτων και κρέατος
    κουνελιών από τρίτες χώρες [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 3332]'
  type: main
- language: fi
  script: Latn
  content: '98/648/EY: Komission päätös, tehty 5 päivänä marraskuuta 1998, niiden
    kolmansien maiden ryhmistä, jotka voivat käyttää eläinlääkärintodistuksia
    luonnonvaraisen riistan lihan ja tarhatun riistan sekä kaninlihan tuonnissa kolmansista
    maista tehdyn päätöksen 97/217/EY muuttamisesta (tiedoksiannettu numerolla
    K(1998) 3332)'
  type: main
- language: it
  script: Latn
  content: '98/648/CE: Decisione della Commissione del 5 novembre 1998 recante modifica
