title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2622/84 of 14 September 1984 re-establishing
    the levying of the customs duties on activated carbon, falling within subheading
    38.03 A, originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2622/84 de la Commission du 14 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables aux charbons
    activés, de la sous-position 38.03 A du tarif douanier commun, originaires de
    Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2622/84 der Kommission vom 14. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für Aktivkohle der Tarifstelle 38.03
    A mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2622/84 af 14. september 1984 om genindførelse
    af opkrævning af told for aktiveret kul, henhørende under pos. 38.03 A og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2622/84 της Επιτροπής
    της 14ης Σεπτεμβρίου 1984 περί επαναφοράς της
    εισπράξεως τελωνειακών δασμών για άνθρακες
    ενεργοποιημένους, της διακρίσεως 38.03 Α του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2622/84 della Commissione del 14 settembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai carboni attivati della
    sottovoce 38.03 A della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2622/84 van de Commissie van 14 september 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op actieve kool,
    van postonderverdeling 38.03 A, van oorsprong uit China, waarvoor de in Verordening
    (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
