    Aonair um Dhrugaí Támhshuanacha 1961, arna leasú ag Prótacal 1972, agus faoin
    gCoinbhinsiún maidir le Substaintí Síceatrópacha 1971
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2025/493 od 5. ožujka 2025. o stajalištu koje treba
    zauzeti u ime Europske unije na 68. sjednici Komisije za opojne droge u pogledu
    uvrštavanja tvari na popise u Jedinstvenoj konvenciji o opojnim drogama iz 1961.,
    kako je izmijenjena Protokolom iz 1972., i Konvenciji o psihotropnim tvarima iz
    1971.
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2025/493 határozata (2025. március 5.) az 1972. évi jegyzőkönyvvel
    módosított, 1961. évi Egységes Kábítószer Egyezmény és a pszichotrop
    anyagokról szóló, 1971. évi egyezmény szerinti anyagjegyzékekbe való felvétel
    tekintetében a Kábítószer-bizottság 68. ülésszakán az Európai Unió által
    képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2025/493 del Consiglio, del 5 marzo 2025, relativa alla
    posizione da adottare, a nome dell’Unione europea, alla sessantottesima sessione
    della commissione Stupefacenti sull’inclusione di sostanze nelle tabelle della
    convenzione unica sugli stupefacenti del 1961, modificata dal protocollo del 1972,
    e della convenzione sulle sostanze psicotrope del 1971
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2025/493 (2025. gada 5. marts) par nostāju, kas Eiropas
    Savienības vārdā jāieņem Narkotisko vielu komisijas sešdesmit astotajā
    sesijā par vielu iekļaušanu sarakstos, kuri pievienoti 1961. gada Vienotajai
    konvencijai par narkotiskajām vielām, kas grozīta ar 1972. gada protokolu,
    un 1971. gada Konvencijai par psihotropajām vielām
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 5 d. Tarybos sprendimas (ES) 2025/493, dėl pozicijos, kurios
    Europos Sąjungos vardu turi būti laikomasi šešiasdešimt aštuntojoje Narkotinių
    medžiagų komisijos sesijoje, dėl medžiagų įtraukimo į sąrašą pagal 1961
    m. Bendrąją narkotinių medžiagų konvenciją su pakeitimais, padarytais 1972
    m. protokolu, ir pagal 1971 m. Psichotropinių medžiagų konvenciją
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2025/493 tal-5 ta’ Marzu 2025 dwar il-pożizzjoni
