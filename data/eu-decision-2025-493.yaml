title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/493 of 5 March 2025 on the position to be adopted
    on behalf of the European Union in the sixty-eighth session of the Commission
    on Narcotic Drugs on the scheduling of substances under the Single Convention
    on Narcotic Drugs of 1961, as amended by the 1972 Protocol, and the Convention
    on Psychotropic Substances of 1971
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/493 du Conseil du 5 mars 2025 relative à la position
    à prendre, au nom de l’Union européenne, lors de la soixante-huitième session
    de la Commission des stupéfiants, en ce qui concerne l’inscription de substances
    aux tableaux annexés à la Convention unique sur les stupéfiants de 1961, telle
    que modifiée par le protocole de 1972, et à la Convention sur les substances
    psychotropes de 1971
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/493 des Rates vom 5. März 2025 über den im Namen
    der Europäischen Union auf der 68. Tagung der Suchtstoffkommission über die
    Aufnahme von Stoffen in die Anhänge des Einheits-Übereinkommens von 1961 über
    Suchtstoffe in der durch das Protokoll von 1972 geänderten Fassung und des Übereinkommens
    von 1971 über psychotrope Stoffe zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2025/493 на Съвета от 5 март 2025 година
    относно позицията, която трябва да се заеме
    от името на Европейския съюз на шестдесет и
    осмата сесия на Комисията за упойващите вещества
    по отношение на включването на вещества в списъците
    към Единната конвенция по упойващите вещества
    от 1961 г., изменена с Протокола от 1972 г., и към
    Конвенцията за психотропните вещества от 1971
    г.
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/493 ze dne 5. března 2025 o postoji, který
    má být zaujat jménem Evropské unie na 68. zasedání Komise pro narkotika,
    pokud jde o zařazení látek na seznamy připojené k Jednotné úmluvě o omamných
    látkách z roku 1961 ve znění protokolu z roku 1972 a Úmluvě o psychotropních
    látkách z roku 1971
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2025/493 af 5. marts 2025 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 68. møde i Kommissionen
    for Narkotiske Midler for så vidt angår opførelsen af stoffer i bilagene til
    enkeltkonventionen angående narkotiske midler fra 1961 som ændret ved protokollen
    fra 1972 og konventionen om psykotrope stoffer fra 1971
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2025/493 του Συμβουλίου, της 5ης
    Μαρτίου 2025, για τη θέση που πρέπει να ληφθεί
    εξ ονόματος της Ευρωπαϊκής Ένωσης κατά την
    εξηκοστή όγδοη σύνοδο της Επιτροπής για τα
    Ναρκωτικά όσον αφορά την καταχώριση ουσιών
    στους πίνακες της ενιαίας σύμβασης για τα ναρκωτικά
    του 1961, όπως τροποποιήθηκε από το πρωτόκολλο
    του 1972, και της σύμβασης για τις ψυχοτρόπους
    ουσίες του 1971
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2025/493, 5. märts 2025, Euroopa Liidu nimel võetava
