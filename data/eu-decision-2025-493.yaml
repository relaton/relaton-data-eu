    Convenção Única sobre os Estupefacientes de 1961, alterada pelo Protocolo de
    1972, e da Convenção sobre as Substâncias Psicotrópicas de 1971
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/493 a Consiliului din 5 martie 2025 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul celei
    de a șaizeci și opta sesiuni a Comisiei pentru stupefiante, cu privire la modificarea
    tabelelor de substanțe anexate la Convenția unică asupra stupefiantelor din
    1961, astfel cum a fost modificată prin Protocolul din 1972, și la Convenția
    asupra substanțelor psihotrope din 1971
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/493 z 5. marca 2025 o pozícii, ktorá sa má
    v mene Európskej únie prijať na šesťdesiatom ôsmom zasadnutí Komisie pre
    omamné látky v súvislosti so zaradením látok do zoznamov k Jednotnému dohovoru
    o omamných látkach z roku 1961 zmenenému protokolom z roku 1972 a k Dohovoru
    o psychotropných látkach z roku 1971
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/493 z dne 5. marca 2025 o stališču, ki se v imenu
    Evropske unije sprejme na oseminšestdesetem zasedanju Komisije ZN za droge v
    zvezi z vključitvijo snovi v tabele v okviru Enotne konvencije o mamilih iz leta
    1961, kakor je bila spremenjena s Protokolom iz leta 1972, in Konvencije o psihotropnih
    substancah iz leta 1971
  type: main
- language: es
