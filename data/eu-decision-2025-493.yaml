    ósmego posiedzenia Komisji ds. Środków Odurzających odnośnie do umieszczenia
    substancji w wykazie na mocy Jednolitej konwencji o środkach odurzających z
    1961 r. zmienionej protokołem z 1972 r. oraz Konwencji o substancjach psychotropowych
    z 1971 r.
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2025/493 do Conselho, de 5 de março de 2025, relativa à
