    lisamisega 1961. aasta narkootiliste ainete ühtsesse konventsiooni, mida on muudetud
    1972. aasta protokolliga, ja 1971. aasta psühhotroopsete ainete konventsiooni
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2025/493, annettu 5 päivänä maaliskuuta 2025,
    huumausainetoimikunnan 68. istunnossa Euroopan unionin puolesta esitettävästä
    kannasta, joka koskee aineiden listaamista vuoden 1961 huumausaineyleissopimuksen,
    sellaisena kuin se on muutettuna vuoden 1972 pöytäkirjalla, ja psykotrooppisia
    aineita koskevan vuoden 1971 yleissopimuksen mukaisesti
  type: main
- language: ga
  script: Latn
