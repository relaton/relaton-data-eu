    tal-Kummissjoni dwar id-Drogi Narkotiċi dwar l-iskedar ta’ sustanzi skont il-Konvenzjoni
    Unika dwar Drogi Narkotiċi tal-1961, kif emendata bil-Protokoll tal-1972, u l-Konvenzjoni
    dwar is-Sustanzi Psikotropiċi tal-1971
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2025/493 van de Raad van 5 maart 2025 betreffende het namens
    de Europese Unie op de 68e zitting van de Commissie Verdovende Middelen in te
    nemen standpunt over het toevoegen van stoffen aan de lijsten die gehecht zijn
    aan het Enkelvoudig Verdrag inzake verdovende middelen van 1961, zoals gewijzigd
    bij het Protocol van 1972, en aan het Verdrag inzake psychotrope stoffen van 1971
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2025/493 z dnia 5 marca 2025 r. w sprawie stanowiska,
