  content: Décision de la Commission, du 19 décembre 1968, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de réinstallation effectuées par la "Bundesanstalt
    für Arbeitsvermittlung und Arbeitslosenversicherung (BAVAV)" et par quels "Berufsgenossenschaften"
  type: main
- language: de
  script: Latn
  content: '69/27/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Bundesrepublik Deutschland zu Aufwendungen
    für von der Bundesanstalt für Arbeitsvermittlung und Arbeitslosenversicherung
    (BAVAV) und einigen Berufsgenossenschaften durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '69/27/CEE: Decisione della Commissione, del 19 dicembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica federale di
    Germania per spese concernenti operazioni di nuova sistemazione effettuate dalla
    «Bundesanstalt für Arbeitsvermittlung und Arbeitslosenversicherung (BAVAV)»
    e da alcune «Berufsgenossenschaften»'
  type: main
- language: nl
  script: Latn
  content: '69/27/EEG: Beschikking van de Commissie van 19 december 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Bondsrepubliek Duitsland
    voor door de "Bundesanstalt für Arbeitsvermittlung und Arbeitslosenversicherung
    (B.A.V.A.V.)" en enkele "Berufsgenossenschaften" gemaakte herscholingskosten'
