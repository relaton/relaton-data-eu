title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 664/78 of 3 April 1978 re-establishing the
    levying of customs duties on gloves, including mittens and mitts, protective,
    for all trades, falling within subheading 42.03 B I and originating in Hong Kong,
    to which the preferential tariff arrangements set out in Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 664/78 de la Commission, du 3 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de protection pour tous métiers, de la sous-position tarifaire
    42.03 B I, originaires de Hong-Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 664/78 der Kommission vom 3. April 1978 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Fausthandschuhe, Schutzhandschuhe
    für alle Berufe, der Tarifstelle 42.03 B I, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 664/78 af 3. april 1978 om genindførelse
    af opkrævning af toldafgifter for handsker (herunder vanter), såvel syede som
    kun tilskårne, beskyttelseshandsker til erhvervsmæssig brug (arbejdshandsher)
    underposition 42.03 B I, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 664/78 della Commissione, del 3 aprile 1978, che ripristina
    la riscossione dei dazi doganali applicabili ai guanti, comprese le muffole, di
    protezione per qualunque mestiere, della sottovoce doganale 42.03 B I, originari
    di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 664/78 van de Commissie van 3 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen
    en wanten, werkhandschoenen en -wanten, van post 42.03 B I, van oorsprong uit
    Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
