  content: COMMISSION REGULATION (EEC) No 1410/93 of 8 June 1993 re-establishing the
    levying of customs duties on products falling within CN codes ex 9101 and ex 9102,
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1410/93 de la Commission du 8 juin 1993 portant rétablissement
