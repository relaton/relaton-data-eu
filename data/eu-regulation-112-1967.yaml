title:
- language: fr
  script: Latn
  content: Règlement n° 112/67/CEE de la Commission, du 1er juin 1967, fixant des
    coefficients forfaitaires pour les aliments composés pour animaux, en vue du
    calcul des remboursements des restitutions à l'exportation vers les pays tiers
    pour les périodes de comptabilisation du 1er juillet 1964 au 30 juin 1965 et
    du 1er juillet 1965 au 30 juin 1966
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 112/67/EWG der Kommission vom 1. Juni 1967 über die Festsetzung
    von Pauschalkoeffizienten für Mischfuttermittel im Hinblick auf die Berechnung
    der Rückvergütungen der Erstattungen bei der Ausfuhr nach dritten Ländern für
    die Verbuchungszeiträume vom 1. Juli 1964 bis zum 30. Juni 1965 und vom 1. Juli
    1965 bis zum 30. Juni 1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 112/67/CEE della Commissione, del 1 giugno 1967, che fissa
    i coefficienti forfetari per gli alimenti composti per animali, ai fini del calcolo
    dei rimborsi delle restituzioni all'esportazione verso i paesi terzi per i periodi
    di contabilizzazione 1 luglio 1964 - 30 giugno 1965 e 1 luglio 1965 - 30 giugno
    1966
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 112/67/EEG van de Commissie van 1 juni 1967 houdende vaststelling
    van de forfaitaire coëfficiënten voor mengvoeders voor dieren ter berekening
    van de uitgaven voor restituties bij uitvoer naar derde landen voor de berekeningsperioden
    van 1 juli 1964 t/m 30 juni 1965 en van 1 juli 1965 t/m 30 juni 1966
  type: main
