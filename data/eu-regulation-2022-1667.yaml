  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1667 av den 19 juli 2022
    om rättelse av vissa språkversioner av delegerad förordning (EU) 2019/2090
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
