  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1667 z dne 19. julija 2022 o popravku
    nekaterih jezikovnih različic Delegirane uredbe (EU) 2019/2090 o dopolnitvi Uredbe
    (EU) 2017/625 Evropskega parlamenta in Sveta glede primerov suma ali ugotovljene
    neskladnosti s pravili Unije, ki veljajo za uporabo ali ostanke farmakološko
