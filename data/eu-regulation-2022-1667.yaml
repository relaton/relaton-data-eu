title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1667 of 19 July 2022 correcting
    certain language versions of Delegated Regulation (EU) 2019/2090 supplementing
    Regulation (EU) 2017/625 of the European Parliament and Council regarding cases
    of suspected or established non-compliance with Union rules applicable to the
    use or residues of pharmacologically active substances authorised in veterinary
    medicinal products or as feed additives or with Union rules applicable to the
    use or residues of prohibited or unauthorised pharmacologically active substances
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1667 de la Commission du 19 juillet 2022
    rectifiant certaines versions linguistiques du règlement délégué (UE) 2019/2090
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne les cas de non-conformité, établie ou soupçonnée, aux règles
    de l’Union applicables à l’utilisation ou aux résidus de substances pharmacologiquement
    actives autorisées dans les médicaments vétérinaires ou en tant qu’additifs
    destinés à l’alimentation des animaux, ou aux règles de l’Union applicables
    à l’utilisation ou aux résidus de substances pharmacologiquement actives interdites
    ou non autorisées
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1667 der Kommission vom 19. Juli 2022 zur
