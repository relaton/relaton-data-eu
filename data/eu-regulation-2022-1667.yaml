  script: Latn
  content: Reglamento Delegado (UE) 2022/1667 de la Comisión de 19 de julio de 2022
    por el que se corrigen determinadas versiones lingüísticas del Reglamento Delegado
    (UE) 2019/2090, que complementa al Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo en lo que respecta a los casos de sospecha o constatación de incumplimiento
