  content: Council Regulation (EEC) No 1378/82 of 25 May 1982 opening, allocating
    and providing for the administration of a Community tariff quota for yarn of poly
    (p-phenyleneterephthalamide) for use in the manufacture of tyres or of products
    used in the manufacture of tyres, falling within subheading ex 51.01 A of the
    Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1378/82 du Conseil, du 25 mai 1982, portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire pour
    des fils de poly ("p"-phénylène téréphtalamide), destinés à être utilisés
    dans la fabrication de pneumatiques ou de produits utilisés dans la fabrication
    de pneumatiques, de la sous-position ex 51.01 A du tarif douanier communi
  type: main
- language: de
  script: Latn
