    leite e da carne de bovino e que altera o Regulamento (CEE) n.° 1890/87 no que
    respeita às taxas de conversão aplicáveis no sector agrícola
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 887/88 DEL CONSEJO de 30 de marzo de 1988 por el
