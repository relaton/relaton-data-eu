  content: Council Regulation (EEC) No 887/88 of 30 March 1988 extending the 1987/88
    marketing year in the milk and beef and veal sectors and amending Regulation (EEC)
    No 1890/87 with regard to the conversion rates to be applied in agriculture
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 887/88 du Conseil du 30 mars 1988 portant prolongation
    de la campagne de commercialisation 1987/1988 dans les secteurs du lait et de
    la viande bovine et modifiant le règlement (CEE) n° 1890/87 en ce qui concerne
    les taux de conversion à appliquer dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 887/88 DES RATES vom 30. März 1988 zur Verlängerung
    des Wirtschaftsjahres 1987/88 für die Sektoren Milch und Milcherzeugnisse sowie
    Rindfleisch und zur Änderung der Verordnung (EWG) Nr. 1890/87 hinsichtlich der
    in der Landwirtschaft anzuwendenden Umrechnungskurse #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 887/88 af 30. marts 1988 om forlængelse
    af produktionsåret 1987/88 for mælk og mejeriprodukter samt oskekød og om ændring
    af forordning (EØF) nr. 1890/87 for så vidt angår de omregningskurser, der
    skal anvendes i landbrugssektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 887/88 του Συμβουλίου
    της 30ής Μαρτίου 1988 για την παράταση της περιόδου
    εμπορίας 1987/88 στους τομείς του γάλακτος και
    του βοείου κρέατος και για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1890/87 όσον αφορά τους
    συντελεστές μετατροπής που θα εφαρμοστούν
    στον γεωργικό τομέα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 887/88 DEL CONSIGLIO del 30 marzo 1988 che proroga
    la campagna di commercializzazione 1987/1988 nei settori lattiero-caseario e delle
    carni bovine e che modifica il regolamento (CEE) n. 1890/87 per quanto riguarda
    i tassi di conversione da applicare nel settore agricolo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 887/88 VAN DE RAAD van 30 maart 1988 tot verlenging
