title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1128/92 of 29 April 1992 amending the list
    annexed to Regulation (EEC) No 3715/91 establishing, for 1992, the list of vessels
    exceeding eight metres length overall permitted to fish for sole within certain
    areas of the Community using beam trawls whose aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1128/92 de la Commission du 29 avril 1992 modifiant
    la liste annexée au règlement (CEE) n° 3715/91 établissant, pour 1992, la
    liste des bateaux dont la longueur hors tout dépasse huit mètres, qui sont autorisés
    à pêcher la sole dans certaines zones de la Communauté à l'aide de chaluts
    à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1128/92 DER KOMMISSION vom 29. April 1992 zur Änderung
    der Liste im Anhang der Verordnung (EWG) Nr. 3715/91 zur Festlegung der Liste
    für 1992 der Schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten
    Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge mehr als 9 beträgt,
    auf Seezunge fischen dürfen #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1128/92 af 29. april 1992 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 3715/91 om listen
    for 1992 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1128/92 της Επιτροπής
    της 29ης Απριλίου 1992 για την τροποποίηση του
    καταλόγου που είναι προσαρτημένος στον κανονισμό
    (ΕΟΚ) αριθ. 3715/91 που καταρτίζει, για το 1992, τον
    κατάλογο των σκαφών συνολικού μήκους άνω των
    οκτώ μέτρων τα οποία επιτρέπεται να αλιεύουν
    γλώσσες σε ορισμένες περιοχές της Κοινότητας
    χρησιμοποιώντας δοκότρατες των οποίων το συνολικό
    μήκος υπερβαίνει τα εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1128/92 DELLA COMMISSIONE del 29 aprile 1992 recante
    modifica dell'' elenco allegato al regolamento (CEE) n. 3715/91 che fissa, per
    il 1992, l'' elenco dei pescherecci di lunghezza fuori tutto superiore a 8 m,
    autorizzati a pescare la sogliola in determinate zone della Comunità con reti
    a strascico a pali, di lunghezza complessiva superiore a 9 m #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1128/92 VAN DE COMMISSIE van 29 april 1992 houdende
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 3715/91 tot vaststelling
    voor 1992 van de lijst van vaartuigen met een lengte over alles van meer dan 8
    meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale
    boomlengte meer dan 9 meter bedraagt, op tong mogen vissen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1128/92 DA COMISSÃO de 29 de Abril de 1992 que altera
    a lista anexa ao Regulamento (CEE) no 3715/91 que estabelece, para 1992, a lista
    dos navios com mais de oito metros de comprimento de fora a fora autorizados a
    pescar linguado em determinadas zonas da Comunidade utilizando redes de arrasto
    de vara em que o comprimento total das varas seja superior a nove metros #'
  type: main
