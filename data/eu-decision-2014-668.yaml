    entre l''Union européenne et la Communauté européenne de l''énergie atomique
    et leurs États membres, d''une part, et l''Ukraine, d''autre part, en ce qui
    concerne son titre III (à l''exclusion des dispositions relatives au traitement
    des ressortissants des pays tiers employés légalement sur le territoire de l''autre
    partie) et ses titres IV, V, VI et VII, ainsi que les annexes et protocoles correspondants'
  type: main
