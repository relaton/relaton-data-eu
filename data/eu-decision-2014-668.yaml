  script: Latn
  content: '2014/668/EU: Council Decision of 23 June 2014 on the signing, on behalf
    of the European Union, and provisional application of the Association Agreement
    between the European Union and the European Atomic Energy Community and their
    Member States, of the one part, and Ukraine, of the other part, as regards Title
    III (with the exception of the provisions relating to the treatment of third-country
    nationals legally employed as workers in the territory of the other Party) and
    Titles IV, V, VI and VII thereof, as well as the related Annexes and Protocols'
  type: main
- language: fr
  script: Latn
  content: '2014/668/UE: Décision du Conseil du 23 juin 2014 relative à la signature,
