title:
- language: en
  script: Latn
  content: '81/804/EEC: Commission Decision of 13 July 1981 authorizing the Italian
    Republic not to apply Community treatment to cross-country motor vehicles for
    the transport of persons and of goods, originating in Japan and to cross-country
    motor vehicles for the transport of persons, originating in the USSR (Only the
    Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/804/CEE: Décision de la Commission, du 13 juillet 1981, autorisant
    la République italienne à exclure du traitement communautaire les voitures automobiles
    tout terrain pour le transport de personnes et de marchandises, originaires du
    Japon, et les voitures automobiles tout terrain pour le transport de personnes,
    originaires de l''Union soviétique (Le texte en langue italienne est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/804/EWG: Entscheidung der Kommission vom 13. Juli 1981 zur Ermächtigung
    der Italienischen Republik, aus Japan stammende geländegängige Kraftfahrzeuge
    zum Befördern von Personen und Gütern und aus der UdSSR stammende geländegängige
    Personenkraftwagen von der Gemeinschaftsbehandlung auszuschließen (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/804/EØF: Kommissionens beslutning af 13. juli 1981 om bemyndigelse
    til Den italienske Republik til fra fællesskabsbehandling at undtage terrængående
    automobiler til person- og godsbefordring med oprindelse i Japan og terrængående
    automobiler til personbefordring med oprindelse i Sovjetunionen (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/804/EOK: Απόφαση τής Επιτροπής τής 13ης Ιουλίου
    1981 περί χορηγήσεως αδείας στήν Ιταλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά αυτοκίνητα οχήματα, «γιά κάθε είδος εδάφους»
    γιά τή μεταφορά προσώπων καί εμπορευμάτων,
    καταγωγής Ιαπωνίας καί τά αυτοκίνητα οχήματα,
    «γιά κάθε είδος εδάφους» γιά τή μεταφορά προσώπων,
    καταγωγής Σοβιετικής Ενώσεως (Το κείμενο στην
    ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/804/CEE: Decisione della Commissione, del 13 luglio 1981, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli autoveicoli
    del tipo "fuori strada" per il trasporto di persone e di merci, originari del
    Giappone, e gli autoveicoli del tipo "fuori strada" per il trasporto di persone,
    originari dell''URSS (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/804/EEG: Beschikking van de Commissie van 13 juli 1981 houdende machtiging
    van de Italiaanse Republiek om terreinautomobielen voor personen- en goederenvervoer
    van oorsprong uit Japan en terreinautomobielen voor personenvervoer van oorsprong
    uit de Sovjetunie van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Italiaanse taal is authentiek)'
  type: main
