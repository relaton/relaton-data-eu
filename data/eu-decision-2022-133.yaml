title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2022/133 of 25 January 2022 authorising
    France to introduce a special measure derogating from Articles 218 and 232 of
    Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/133 du Conseil du 25 janvier 2022 autorisant
    la France à introduire une mesure particulière dérogatoire aux articles 218
    et 232 de la directive 2006/112/CE relative au système commun de taxe sur la
    valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/133 des Rates vom 25. Januar 2022 zur
    Ermächtigung Frankreichs, eine von den Artikeln 218 und 232 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme einzuführen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/133 на Съвета
    от 25 януари 2022 година за предоставяне на разрешение
    на Франция да въведе специална мярка за дерогация
    от членове 218 и 232 от Директива 2006/112/ЕО относно
    общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2022/133 ze dne 25. ledna 2022, kterým
    se Francii povoluje zavést zvláštní opatření odchylující se od článků
    218 a 232 směrnice 2006/112/ES o společném systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2022/133 af 25. januar 2022 om at
    give Frankrig tilladelse til at indføre en særlig foranstaltning, der fraviger
    artikel 218 og 232 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/133 του Συμβουλίου
    της 25ης Ιανουαρίου 2022 με την οποία επιτρέπεται
    στη Γαλλία να εφαρμόσει ειδικό μέτρο παρέκκλισης
    από τα άρθρα 218 και 232 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2022/133, 25. jaanuar 2022, millega antakse
    Prantsusmaale luba kehtestada erimeede, millega tehakse erand direktiivi 2006/112/EÜ
    (mis käsitleb ühist käibemaksusüsteemi) artiklitest 218 ja 232
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2022/133, annettu 25 päivänä
    tammikuuta 2022, luvan antamisesta Ranskalle ottaa käyttöön yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 218 ja 232 artiklasta poikkeava erityistoimenpide
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/133 ón gComhairle an 25 Eanáir 2022
    lena n-údaraítear don Fhrainc beart speisialta a thabhairt isteach de mhaolú
    ar Airteagail 218 agus 232 de Threoir 2006/112/CE maidir leis an gcomhchóras
    cánach breisluacha
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2022/133 od 25. siječnja 2022. kojom se
    Francuskoj odobrava uvođenje posebne mjere odstupanja od članaka 218. i 232.
    Direktive 2006/112/EZ o zajedničkom sustavu poreza na dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/133 végrehajtási határozata (2022. január 25.)
    Franciaországnak a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK
    irányelv 218. és 232. cikkétől eltérő különös intézkedés bevezetésére
    történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/133 del Consiglio del 25 gennaio 2022
    che autorizza la Francia a introdurre una misura speciale di deroga agli articoli
    218 e 232 della direttiva 2006/112/CE relativa al sistema comune d’imposta sul
    valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2022/133 (2022. gada 25. janvāris),
    ar ko Francijai atļauj ieviest īpašu pasākumu, atkāpjoties no 218. un 232.
    panta Direktīvā 2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: Tarybos įgyvendinimo sprendimas (ES) 2022/133 2022 m. sausio 25 d. kuriuo
    Prancūzijai leidžiama nustatyti specialią priemonę, kuria nukrypstama nuo
    Direktyvos 2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos 218
    ir 232 straipsnių
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill (UE) 2022/133 tal-25 ta’
    Jannar 2022 li tawtorizza lil Franza sabiex tintroduċi miżura speċjali li tidderoga
    mill-Artikoli 218 u 232 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta’
    taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/133 van de Raad van 25 januari 2022 waarbij
    Frankrijk wordt gemachtigd een bijzondere maatregel toe te passen die afwijkt
    van de artikelen 218 en 232 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke
    stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2022/133 z dnia 25 stycznia 2022 r. w sprawie
    upoważnienia Francji do wprowadzenia szczególnego środka stanowiącego odstępstwo
    od art. 218 oraz art. 232 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku
    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/133 do Conselho de 25 de janeiro de 2022
    que autoriza a França a aplicar uma medida especial em derrogação dos artigos
    218.o e 232.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/133 a Consiliului din 25 ianuarie
    2022 de autorizare a Franței să aplice o măsură specială de derogare de la
    articolele 218 și 232 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/133 z 25. januára 2022, ktorým
    sa Francúzsku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článkov
    218 a 232 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2022/133 z dne 25. januarja 2022 o dovoljenju
    Franciji, da uvede posebni ukrep, ki odstopa od členov 218 in 232 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/133 del Consejo de 25 de enero de 2022
    por la que se autoriza a Francia a aplicar una medida especial de excepción a
    lo dispuesto en los artículos 218 y 232 de la Directiva 2006/112/CE relativa
    al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2022/133 av den 25 januari 2022 om bemyndigande
    för Frankrike att införa en särskild åtgärd som avviker från artiklarna
    218 och 232 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
  type: main
