title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3947/89 of 20 December 1989 amending Regulation
    (EEC) No 3665/87 as regards the grant of export refunds in the case of transshipment
    or transit operations within the Community of products deemed to have left the
    customs territory of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3947/89 de la Commission du 20 décembre 1989 modifiant
    le règlement (CEE) n° 3665/87 en ce qui concerne l'octroi des restitutions à
    l'exportation dans le cas des opérations de transbordement ou de transit dans
    la Communauté de produits considérés comme ayant quitté le territoire douanier
    de la Communauté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3947/89 DER KOMMISSION vom 20. Dezember 1989 zur Aenderung
    der Verordnung (EWG) Nr. 3665/87 hinsichtlich der Gewaehrung von Ausfuhrerstattungen
    bei der Umladung oder beim Versand von Erzeugnissen, bei denen angenommen wird,
    dass sie das Zollgebiet der Gemeinschaft verlassen haben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3947/89 af 20. december 1989 om ændring
    af forordning (EØF) nr. 3665/87 for så vidt angår ydelse af eksportrestitutioner
    i tilfælde af omladning eller transitforsendelse i Fællesskabet af produkter,
    der anses for at have forladt Fællesskabets toldområde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3947/89 της Επιτροπής
    της 20ής Δεκεμβρίου 1989 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3665/87 όσον αφορά τη χορήγηση επιστροφών
    κατά την εξαγωγή στις περιπτώσεις μεταμόρφωσης
    ή διαμετακόμισης στην Κοινότητα προϊόντων
    που θεωρούνται ότι έχουν εγκαταλείψει το τελωνειακό
    έδαφος της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3947/89, annettu 20 päivänä joulukuuta 1989,
    asetuksen (ETY) N:o 3665/87 muuttamisesta vientituen myöntämisen osalta yhteisön
    tullialueelta vietyinä tuotteina pidettyjä tuotteita uudelleenlastattaessa tai
    kuljetettaessa yhteisön kautta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3947/89 DELLA COMMISSIONE del 20 dicembre 1989 che
    modifica il regolamento (CEE) n. 3665/87 per quanto riguarda la concessione delle
    restituzioni all'esportazione nel caso delle operazioni di trasbordo o di transito
    nella Comunità di prodotti che si considerano aver lasciato il territorio doganale
    della Comunità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3947/89 VAN DE COMMISSIE van 20 december 1989 tot
    wijziging van Verordening (EEG) nr. 3665/87 ten aanzien van de toekenning van
    restituties bij uitvoer in het geval van overlading in en doorvoer door de Gemeenschap
    van produkten die worden geacht het douanegebied van de Gemeenschap te hebben
    verlaten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3947/89 DA COMISSAO de 20 de Dezembro de 1989 que
    altera o Regulamento (CEE) n* 3665/87, no que respeita à concessao das restituiçoes
    à exportaçao nos casos de operaçoes de transbordo ou de trânsito na Comunidade
    de produtos considerados como tendo deixado o territorio aduaneiro da Comunidade
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3947/89 DE LA COMISION de 20 de diciembre de 1989 por
    el que se modifica el Reglamento (CEE) no 3665/87 en lo referente a la concesion
    de restituciones por exportacion en los casos de operaciones de transbordo o transito
    en la Comunidad de productos que se considere que han salido del territorio aduanero
    de la Comunidad
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 3947/89 av den 20 december 1989 om ändring
    av förordning (EEG) nr 3665/87 vad avser beviljande av exportbidrag i de fall
    då omlastning eller transitering sker inom gemenskapen av produkter som anses
    ha lämnat gemenskapens tullområde
  type: main
