title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1273/88 of 29 April 1988 laying down criteria
    for delimiting the regions or areas which may be exempted from the schemes for
    the set-aside of arable land, extensification and the conversion of production
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1273/88 de la Commission du 29 avril 1988 fixant les
    critères pour la délimitation des régions ou zones pouvant être exemptées
    des régimes de retrait des terres arables, d' extensification et de reconversion
    de la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1273/88 der Kommission vom 29. April 1988 zur Festlegung
    der Kriterien für die Abgrenzung der Regionen und Gebiete, die von den Regelungen
    zur Stillegung von Anbauflächen und zur Extensivierung und Umstellung der Erzeugung
    ausgenommen werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1273/88 af 29. april 1988 om fastsættelse
    af kriterier for afgrænsning af de regioner eller områder, der kan fritages
    for ordningerne med nedlæggelse af agerjord samt ekstensivering og omstilling
    af produktionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1273/88 της Επιτροπής
    της 29ης Απριλίου 1988 περί του ορισμού των κριτηρίων
    για τον καθορισμό των περιοχών ή ζωνών που
    δύνανται να εξαιρεθούν από την εφαρμογή των
    καθεστώτων προσωρινής παύσης καλλιέργειας
    των αρόσιμων γαιών, εκτατικοποίησης και μετατροπής
    της παραγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1273/88 della Commissione del 29 aprile 1988 che stabilisce
    i criteri applicabii per la delimitazione delle regioni o delle zone che possono
    essere esentate dai regimi di messa a riposo dei seminativi, di estensivazione
    e di riconversione della produzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1273/88 van de Commissie van 29 april 1988 tot vaststelling
    van de criteria voor de aanwijzing van de gebieden of zones die mogen worden vrijgesteld
    van toepassing van de regelingen voor het uit produktie nemen van bouwland, de
    extensivering en de omschakeling van de produktie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1273/88 da Comissão de 29 de Abril de 1988 que
    fixa os critérios para a delimitação das regiões ou zonas que podem ser isentas
    da aplicação dos regimes de retirada das terras aráveis de extensificação
    e de reconversão da produção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1273/88 de la Comisión de 29 de abril de 1988 por
    el que se establecen los criterios para delimitar las regiones o zonas que pueden
    quedar exentas de los regímenes de abandono de tierras arables, de extensificación
    y de reconversión de la producción
  type: main
