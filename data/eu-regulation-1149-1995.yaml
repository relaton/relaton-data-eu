---
id: EURegulation11491995
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1149/95 of 22 May 1995 amending Regulation
    (EC) No 1222/94 laying down common detailed rules for the application of the system
    of granting export refunds on certain agricultural products exported in the form
    of goods not covered by Annex II to the Treaty, and the criteria for fixing the
    amount of such refunds and amending Regulation (EC) No 3223/93 on statistical
    information relating to the payment of export refunds on certain agricultural
    products exported in the form of goods covered by Council Regulation (EEC) No
    3035/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1149/95 de la Commission du 22 mai 1995 modifiant le
    règlement (CE) n° 1222/94, établissant, pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité, les modalités
    communes d'application du régime d'octroi des restitutions à l'exportation et
    des critères de fixation de leurs montants et modifiant le règlement (CE) n°
    3223/93 concernant certaines données statistiques relatives aux restitutions
    payées pour l'exportation de certains produits agricoles sous forme de marchandises
    relevant du règlement (CEE) n° 3035/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1149/95 der Kommission vom 22. Mai 1995 zur Änderung
    der Verordnung (EG) Nr. 1222/94 zur Festlegung der gemeinsamen Durchführungsvorschriften
    für die Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung
    des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse, die in
    Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt werden
    sowie zur Änderung der Verordnung (EG) Nr. 3223/93 über bestimmte statistische
    Angaben zu den Erstattungen für die Ausfuhr bestimmter Agrarerzeugnisse in Form
    von Waren, die unter die Verordnung (EWG) Nr. 3035/80 des Rates fallen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1149/95 ze dne 22. května 1995, kterým se
    mění nařízení Komise (ES) č. 1222/94 ze dne 30. května 1994, kterým se
    stanoví obecná pravidla pro poskytování vývozních náhrad pro některé
    zemědělské produkty vyvážené ve formě zboží, na něž se nevtahuje příloha
    II Smlouvy, a kritéria pro stanovení výše těchto náhrad, a kterým se mění
    nařízení (ES) č. 3223/93 ze dne 25. listopadu 1993 o statistických informacích
    týkajících se platby vývozních náhrad pro některé zemědělské produkty
    vyvážené ve formě zboží, na něž se vztahuje nařízení (EHS) č. 3035/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1149/95 af 22. maj 1995 om ændring af
    forordning (EF) nr. 1222/94 om fastsættelse af fælles gennemførelsesregler
    for ordningen for ydelse af eksportrestitutioner og om fastlæggelse af kriterierne
    for fastsættelse af restitutionsbeløbet for visse landbrugsprodukter, der udføres
    i form af varer, som ikke er opført i traktatens bilag II, og om ændring af
    forordning (EF) nr. 3223/93 om visse statistiske oplysninger om de restitutioner,
    der betales ved eksport af visse landbrugsprodukter i form af varer, der omfattes
    af Rådets forordning (EØF) nr. 3035/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1149/95 της Επιτροπής
    της 22ας Μαΐου 1995 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1222/94 για τη θέσπιση κοινών λεπτομερών
    κανόνων στην εφαρμογή του συστήματος επιστροφών
    κατά την εξαγωγή και των κριτηρίων καθορισμού
    του ύψους αυτών για ορισμένα γεωργικά προϊόντα
    εξαγόμενα υπό μορφή εμπορευμάτων μη υπαγόμενων
