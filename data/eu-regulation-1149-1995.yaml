    μορφή εμπορευμάτων καλυπτομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3035/80 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1149/95, 22. mai 1995, millega muudetakse määrust
    (EÜ) nr 1222/94, millega sätestatakse teatavate asutamislepingu II lisas loetlemata
    kaupadena eksporditavate põllumajandussaaduste ja -toodete eksporditoetuste andmise
    korra ühised üksikasjalikud rakenduseeskirjad ja nende toetussummade kinnitamise
    kriteeriumid, ning millega muudetakse määrust (EÜ) nr 3223/93 statistilise
    teabe kohta, mis on seotud eksporditoetuste maksmisega nõukogu määrusega (EMÜ)
    nr 3035/80 reguleeritud kaupadena eksporditavatele teatavatele põllumajandustoodetele
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1149/95, annettu 22 päivänä toukokuuta 1995,
    tiettyjen perustamissopimuksen liitteeseen II kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1222/94 muuttamisesta sekä tiettyjen neuvoston asetuksen (ETY)
    N:o 3035/80 soveltamisalaan kuuluvina tavaroina vietävien maataloustuotteiden
    viennissä maksettua tukea koskevista tietyistä tilastotiedoista annetun asetuksen
    (EY) N:o 3223/93 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1149/95/EK Rendelete (1995. május 22.) a Szerződés II.
    mellékletében nem szereplő áruk formájában exportált egyes mezőgazdasági
    termékekre vonatkozó export-visszatérítési rendszer alkalmazásának közös
    részletes szabályairól, valamint az e visszatérítések összegének megállapítására
    szolgáló szempontokról szóló 1222/94/EK rendelet, továbbá a 3035/80/EGK
    rendeletben szereplő árucikkek formájában exportált egyes mezőgazdasági
    termékekre vonatkozó export-visszatérítések fizetésével összefüggő statisztikai
    adatokról szóló 3223/93/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1149/95 della Commissione del 22 maggio 1995 che modifica
    il regolamento (CE) n. 1222/94 che stabilisce per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell'allegato II del trattato, le modalità
    comuni di applicazione relative alla concessione delle restituzioni all'esportazione
    e i criteri per stabilire il loro importo e che modifica il regolamento (CE) n.
    3223/93 relativo a taluni dati statistici riguardanti le restituzioni pagate per
    l'esportazione di determinati prodotti agricoli sotto forma di merci contemplate
    dal regolamento (CEE) n. 3035/80 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1149/95 (1995. gada 22. maijs), ar kuru groza
    Regulu (EK) Nr. 1222/94, ar ko nosaka sīki izstrādātus kopīgus noteikumus
    par to, kā piemērot eksporta kompensāciju piešķiršanas sistēmu atsevišķiem
    lauksaimniecības produktiem, ko eksportē kā preces, uz kurām neattiecas Līguma
    II pielikums, kā arī kritērijus, šādu kompensāciju lieluma noteikšanai,
    un groza Regulu (EK) Nr. 3223/93 par statistikas informāciju attiecībā uz eksporta
    kompensācijas maksājumu par atsevišķiem lauksaimniecības produktiem, ko eksportē
    kā preces, uz kurām attiecas Padomes Regula (EEK) Nr. 3035/80
  type: main
- language: lt
  script: Latn
  content: 1995 m. gegužės 22 d. Komisijos Reglamentas (EB) Nr. 1149/95 iš dalies
    keičiantis Reglamentą (EB) Nr. 1222/94, nustatantį bendras išsamias eksporto
    grąžinamųjų išmokų už tam tikrų žemės ūkio produktų, eksportuojamų
    kaip į Sutarties II priedą neįtrauktos prekės, skyrimo sistemos taikymo taisykles
    ir tokių grąžinamųjų išmokų sumos nustatymo kriterijus, bei Reglamentą
    (EB) Nr. 3223/93 dėl statistinės informacijos, susijusios su eksporto grąžinamųjų
    išmokų už tam tikrus žemės ūkio produktus, eksportuojamus kaip Tarybos reglamente
    (EEB) Nr. 3035/80 nurodytos prekės, mokėjimu
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) nru 1149/95 tat-22 ta' Mejju 1995 li
    jemenda r-Regolament (KE) Nru 1222/94 li jistabbilixxi regoli komuni ddettaljati
    sabiex tiġi applikata s-sistema ta' l-għotja ta' rifużjonijiet fuq l-esportazzjoni
    ta' ċerti prodotti agrikoli esportati fil-għamla ta' oġġetti mhux koperti
    bl-Anness II mat-Trattat, u l-kriterji sabiex jiġu ffissati l-ammonti ta' dawn
    ir-rifużjonijiet u li jemenda r-Regolament (KE) Nru 3223/93 dwar it-tagħrif
    statistiku li għandu x'jaqsam mal-ħlas tar-rifużjonijiet fuq l-esportazzjoni
    ta' ċerti prodotti agrikoli esportati fil-għamla ta' oġġetti koperti bir-Regolament
    tal-Kunsill (KEE) Nru 3035/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1149/95 van de Commissie van 22 mei 1995 houdende
    wijziging van Verordening (EG) nr. 1222/94 tot vaststelling van de gemeenschappelijke
    uitvoeringsbepalingen voor de regeling aangaande de toekenning van restituties
    bij uitvoer en de criteria voor de vaststelling van het restitutiebedrag betreffende
    bepaalde landbouwprodukten, uitgevoerd in de vorm van goederen die niet onder
    bijlage II van het Verdrag vallen, en wijziging van Verordening (EG) nr. 3223/93
    betreffende statistische gegevens inzake de restituties die bij de uitvoer van
    bepaalde landbouwprodukten in de vorm van onder Verordening (EEG) nr. 3035/80
    van de Raad vallende goederen worden betaald
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) NR 1149/95 z dnia 22 maja 1995 r. zmieniające
    rozporządzenie (WE) nr 1222/94 ustanawiające wspólne szczegółowe zasady stosowania
    systemu przyznawania refundacji wywozowych do niektórych produktów rolnych wywożonych
    jako towary nieobjęte załącznikiem II do Traktatu oraz kryteria ustalania kwoty
    takich refundacji i zmieniające rozporządzenie (WE) nr 3223/93 w sprawie informacji
    statystycznych odnoszących się do refundacji wywozowych do niektórych produktów
    rolnych wywożonych w formie towarów objętych rozporządzeniem Rady (EWG) nr
    3035/80
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1149/95 da Comissão de 22 de Maio de 1995 que altera
    o Regulamento (CE) nº 1222/94, que estabelece, para certos produtos agrícolas
    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as normas comuns de aplicação do regime de concessão de restituições à exportação
    e os critérios de fixação do seu montante, e o Regulamento (CEE) nº 3223/93,
    relativo a determinados dados estatísticos referentes às restituições pagas
    pela exportação de certos produtos agrícolas sob a forma de mercadorias abrangidas
    pelo Regulamento (CEE) nº 3035/80 do Conselho
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1149/95 z 22. mája 1995, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1222/94 stanovujúce spoločné podrobné pravidlá
    pre uplatňovanie režimu poskytovania vývozných náhrad pre určité poľnohospodárske
    výrobky vyvážané vo forme tovaru nezahrnutého v prílohe II zmluvy a kritériá
    pre stanovenie výšky týchto náhrad a ktorým sa mení a dopĺňa nariadenie
    (ES) č. 3223/93 o štatistických informáciách týkajúcich sa platby vývozných
    náhrad pre určité poľnohospodárske výrobky vyvezené vo forme tovaru uvedeného
    v nariadení Rady (EHS) č. 3035/80
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1149/95 z dne 22. maja 1995 o spremembah Uredbe
    Komisije (ES) št. 1222/94 o skupnih podrobnih pravilih za uporabo sistema odobravanja
    izvoznih nadomestil za nekatere kmetijske proizvode, izvožene v obliki blaga,
    ki ga ne zajema Priloga II k Pogodbi, in o merilih za določanje višine takšnih
    nadomestil ter o spremembi Uredbe Komisije (ES) št. 3223/93 o statističnih podatkih
    v zvezi z izplačili izvoznih nadomestil za nekatere kmetijske proizvode, izvožene
    v obliki blaga iz Uredbe Sveta (EGS) št. 3035/80
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1149/95 de la Comisión de 22 de mayo de 1995 por el
    que se modifica el Reglamento (CE) n° 1222/94, en el que se establecen, para
    determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el Anexo II del Tratado, las disposiciones comunes de aplicación del régimen
    de concesión de las restituciones a la exportación y los criterios para la fijación
    de su importe, y se modifica el Reglamento (CE) n 3223/93 sobre los datos estadísticos
    relativos a las restituciones abonadas por exportación de determinados productos
    agrícolas en forma de mercancías comprendidas en el Reglamento (CEE) n° 3035/80
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1149/95 av den 22 maj 1995 om ändring
    av förordning (EG) nr 1222/94 om gemensamma tillämpningsföreskrifter för ordningen
    för beviljande av exportbidrag för vissa jordbruksprodukter som exporteras i
    form av varor som inte omfattas av bilaga II till fördraget samt om kriterierna
    för fastställande av bidragsbeloppen, och om ändring av förordning (EG) nr
    3223/93 om statistiska uppgifter om utbetalning av exportbidrag för vissa jordbruksprodukter
    som exporteras i form av varor som omfattas av rådets förordning (EEG) nr 3035/80
  type: main
