title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 482/2013 of 24 May 2013 amending
    Regulation (EU) No 206/2010 laying down lists of third countries, territories
    or parts thereof authorised for the introduction into the European Union of certain
    animals and fresh meat and the veterinary certification requirements
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 482/2013 de la Commission du 24 mai
    2013 portant modification du règlement (UE) n ° 206/2010 établissant des listes
    des pays tiers, territoires ou parties de pays tiers ou territoires en provenance
    desquels l’introduction dans l’Union européenne de certains animaux et viandes
    fraîches est autorisée, et définissant les exigences applicables en matière
    de certification vétérinaire
  type: main
- language: de
  script: Latn
