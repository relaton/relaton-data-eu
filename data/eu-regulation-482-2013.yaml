    Gebiete und Teile davon, aus denen das Verbringen bestimmter Tiere und bestimmten
    frischen Fleisches in die Europäische Union zulässig ist, und zur Festlegung
    der diesbezüglichen Veterinärbescheinigungen
  type: main
- language: bg
