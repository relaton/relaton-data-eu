id: EUDecision1978493
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 May 1978 authorizing the Italian Republic not
    to apply Community treatment to synthetic textile fibres (discontinuous), not
    carded, combed or otherwise prepared for spinning, falling within heading No ex
    56.01 of the Common Customs Tariff (NIMEXE code 56.01-15), originating in the
    German Democratic Republic and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/493/CEE: Décision de la Commission, du 22 mai 1978, autorisant la
    République italienne à exclure du traitement communautaire les fibres textiles
    synthétiques discontinues en masse, de la position Ex 56.01 (code Nimexe 56.01-15)
    du Tarif douanier commun, originaires de la République démocratique allemande
    et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Mai 1978, mit der die Italienische
    Republik ermächtigt wird, aus der Deutschen Demokratischen Republik stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche synthetische
    Spinnfasern, weder gekrempelt noch gekämmt, der Tarifnummer ex 56.01 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 56.01-15) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 22. maj 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage syntetiske fibre, ikke kartede,
    kæmmede eller på anden måde beredte til spinding, som henhører under pos.
    ex 56.01 (NIMEXE-kode 56.01-15) i den fælles todtarif, har oprindelse i Den tyske
    demokratiske Republik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 maggio 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario il fiocco di fibre tessili sintetiche
    (acriliche) in massa della voce ex 56.01 della tariffa doganale comune (codice
    Nimexe 56.01-15), originarie della Repubblica democratica tedesca e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 mei 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd synthetische stapelvezels, van post ex 56.01 van het gemeenschappelijk
    douanetarief (NIMEXE-code 56.01-15), van oorsprong uit de Duitse Democratische
    Republiek en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
