    myöntämisestä annetun asetuksen (ETY) N:o 1842/81 muuttamisesta neljännen
    kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2440/82 della Commissione, dell' 8 settembre 1982,
