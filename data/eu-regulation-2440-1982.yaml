    τετάρτη φορά τού κανονισμού (EOK) αριθ. 1842/81 περί
    χορηγήσεως επιστροφών πού έχουν προσαρμοστεί
    γιά τήν περίπτωση τών σιτηρών πού εξάγονται
    υπό μορφή ορισμένων οινοπνευματωδών ποτών
  type: main
