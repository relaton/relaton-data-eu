    restitutions adaptées pour les céréales exportées sous forme de certaines
    boissons spiritueuses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2440/82 der Kommission vom 8. September 1982 zur vierten
    Änderung der Verordnung (EWG) Nr. 1842/81 hinsichtlich der Gewährung angepaßter
    Erstattungen für in Form bestimmter alkoholischer Getränke ausgeführtes Getreide
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2440/82 af 8. september 1982 om fjerde
