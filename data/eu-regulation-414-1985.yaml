title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 414/85 of 18 February 1985 re-establishing
    the levying of customs duties applicable to glass inners for vacuum flasks or
    for other vacuum vessels, falling within heading No 70.12 and originating in India,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 414/85 de la Commission du 18 février 1985 portant
    rétablissement de la perception des droits de douane applicables aux ampoules
    en verre pour récipients isolants, de la position 70.12 du tarif douanier commun,
    originaires de l' Inde, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 414/85 der Kommission vom 18. Februar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Glaskolben für Isolierbehälter der Tarifnummer
    70.12 mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 414/85 af 18. februar 1985 om genindførelse
    af opkrævning af told for glaskolber til termoflasker og lignende isotermiske
    beholdere henhørende under pos. 70.12 og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 414/85 της Επιτροπής
    της 18ης Φεβρουαρίου 1985 περί αποκαταστάσεως
    της εφαρμογής των δασμών για γυάλινες φύσιγγες
    για μονωτικά δοχεία, της κλάσεως 70.12 του Κοινού
    Δασμολογίου, καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 414/85 della Commissione del 18 febbraio 1985 che
    ripristina la riscossione dei dazi doganali applicabili alle ampolle di vetro
    per recipienti isolanti, della voce 70.12 della tariffa doganale comune, originarie
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 414/85 van de Commissie van 18 februari 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op binnenflessen
    voor thermisch isolerende flessen en voor andere soortgelijke isolerende bergingsmiddelen
    van tariefpost 70.12, van oorsprong uit India, waarvoor de in Verordening (EEG)
    nr. 3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
