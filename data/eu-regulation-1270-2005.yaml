title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1270/2005 of 1 August 2005 specifying the
    extent to which applications lodged in July 2005 for import certificates in respect
    of young male bovine animals for fattening as part of a tariff quota provided
    for in Regulation (EC) No 992/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1270/2005 de la Commission du 1er août 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois de juillet 2005 pour les jeunes bovins mâles destinés à
    l'engraissement dans le cadre d'un contingent tarifaire prévu par le règlement
    (CE) n° 992/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1270/2005 der Kommission vom 1. August 2005 über das
    Ausmaß, in dem den im Juli 2005 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder im Rahmen eines Zollkontingents gemäß
    der Verordnung (EG) Nr. 992/2005 stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1270/2005 ze dne 1. srpna 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní licence pro dovoz
    mladého skotu samčího pohlaví určeného na výkrm, podaným v červenci 2005
    v rámci celní kvóty dle nařízení (ES) č. 992/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1270/2005 af 1. august 2005 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indsendt i juli 2005
    for ungtyre bestemt til opfedning, i forbindelse med et toldkontingent, der er
    fastsat i forordning (EF) nr. 992/2005, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1270/2005 της Επιτροπής,
    της 1ης Αυγούστου 2005, για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για πιστοποιητικά εισαγωγής που υποβλήθηκαν
    τον Ιουλίου 2005 για τα νεαρά άρρενα βοοειδή
    που προορίζονται για πάχυνση στο πλαίσιο μιας
    δασμολογικής ποσόστωσης η οποία προβλέπεται
    από τον κανονισμό (ΕΚ) αριθ. 992/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1270/2005, 1. august 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada taotlusi, mis on esitatud juulis
    2005 noorte nuumamiseks ettenähtud isasveiste impordilitsentside saamiseks määrusega
    (EÜ) nr 992/2005 ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1270/2005, annettu 1 päivänä elokuuta 2005,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen heinäkuuta 2005 esitettyjen
    tuontitodistushakemusten hyväksyttävyydestä asetuksessa (EY) N:o 992/2005 määriteltyjen
    tariffikiintiöiden rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1270/2005/EK rendelete (2005. augusztus 1.) annak meghatározásáról,
    hogy milyen mértékben teljesíthetők azok az importtanúsítvány iránti kérelmek,
    amelyeket 2005 július hónapjában nyújtottak be hizlalásra szánt növendék
    hím szarvasmarhák vonatkozásában a 992/2005/EK rendeletben szabályozott vámkontingens
    keretében
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1270/2005 della Commissione, del 1o agosto 2005, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 2005 per i giovani bovini maschi destinati all'ingrasso,
    nel quadro del contingente tariffario previsto dal regolamento (CE) n. 992/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1270/2005 (2005. gada 1. augusts), ar ko nosaka,
