    gada jūlijs un attiecas uz nobarošanai paredzētiem vīriešu kārtas jaunlopiem,
    tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr. 992/2005
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugpjūčio 1 d. Komisijos reglamentas (EB) Nr. 1270/2005, nustatantis,
    kokia dalimi galima patenkinti paraiškas gauti penimų jaunų galvijų patinų
    importo licencijas, pateiktas 2005 m. liepos mėnesį, pateiktas remiantis tarifine
    kvota, nustatyta Reglamente (EB) Nr. 992/2005
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1270/2005 van de Commissie van 1 augustus 2005 tot
    bepaling van de mate waarin de in juli 2005 ingediende aanvragen voor invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden op grond van een
    bij Verordening (EG) nr. 992/2005 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1270/2005 z dnia 1 sierpnia 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o pozwolenia na przywóz młodych
    byków opasowych, składane w lipcu 2005 r. w ramach kontyngentu taryfowego przewidzianego
    w rozporządzeniu (WE) nr 992/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1270/2005 da Comissão, de 1 de Agosto de 2005, que
    determina em que medida pode ser dado seguimento aos pedidos de certificados de
    importação apresentados no mês de Julho de 2005 para os bovinos machos jovens
    destinados à engorda ao abrigo de um contingente pautal previsto pelo Regulamento
    (CE) n.° 992/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1270/2005 z 1. augusta 2005, ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií predloženým
    v júli 2005 na dovoz mladých samcov hovädzieho dobytka určených na výkrm
    v rámci colnej kvóty ustanovenej v nariadení (ES) č. 992/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1270/2005 z dne 1. avgusta 2005 o določitvi,
    v kakšnem obsegu je mogoče ugoditi zahtevkom za uvozna dovoljenja, vloženim
    v juliju 2005 za mlado govedo moškega spola za pitanje, v okviru tarifne kvote,
    predvidene z Uredbo (ES) št. 992/2005
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1270/2005 de la Comisión, de 1 de agosto de 2005,
    que determina en qué medida podrá darse curso a las solicitudes de certificados
    de importación presentadas en el mes de julio de 2005 para los bovinos machos
    jóvenes destinados al engorde, dentro de un contingente arancelario establecido
    en el Reglamento (CE) n° 992/2005
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1270/2005 av den 1 augusti 2005 om i
    vilken utsträckning ansökningar om importlicenser inlämnade under juli 2005
    för unga nötkreatur av hankön avsedda för gödning inom ramen för den avgiftskvot
    som fastställts i förordning (EG) nr 992/2005 kan godkännas
