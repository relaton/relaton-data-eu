title:
- language: en
  script: Latn
  content: '79/564/EEC: Commission Decision of 22 May 1979 authorizing Ireland not
    to apply Community treatment to blouses and shirt blouses, knitted or crocheted
    (not elastic or rubberized), or woven, for women, girls and infants, of wool,
    of cotton or of man-made textile fibres, falling within subheadings ex 60.05 A
    II and ex 61.02 B of the Common Customs Tariff (NIMEX codes 60.05- 22, 23, 24,
    25; 61.02- 78, 82, 84) (category 7), originating in Hong Kong and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/564/CEE: Décision de la Commission, du 22 mai 1979, autorisant l''Irlande
    à exclure du traitement communautaire les chemisiers, blouses-chemisiers et blouses
    de bonneterie non élastique ni caoutchoutée, ou tissés, pour femmes, fillettes
    et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques ou artificielles,
    des sous-positions ex 60.05 A II et ex 61.02 B du tarif douanier commun (codes
    Nimexe: 60.05- 22, 23, 24, 25; 61.02-78, 82, 84) (catégorie 7), originaires de
    Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/564/EWG: Entscheidung der Kommission vom 22. Mai 1979, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken (weder gummielastisch
    noch kautschutiert) oder Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle,
    Baumwolle, synthetischen oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05
    A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-22; 23;
    24; 25 und 61.02-78; 82; 84) (Kategorie 7) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/564/EØF: Kommissionens beslutning af 22. maj 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, skjortebluser og
    bluser af trikotage (ikke elastisk eller gummeret) eller vævede, til kvinder,
    piger og småbørn, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. ex 60.05 A II og ex 64.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-22, 23, 24, 25 ; 61.02-78, 82, 84 ; kategori 7), har oprindelse i Hongkong
    og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/564/CEE: Decisione della Commissione, del 22 maggio 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette e bluse,
    a maglia non elastica né gommata, o tessute, per donna, per ragazza e per bambini,
    di lana, di cotone o di fibre tessili sintetiche o artificiali, delle sottovoci
    ex 60.05 A II e ex 61.02 B della tariffa doganale comune (codici Nimexe: 60.05-22,
    23, 24, 25 e 61.02-78, 82, 84) (categoria 7), originarie di Hong Kong e messe
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/564/EEG: Beschikking van de Commissie van 22 mei 1979 waarbij Ierland
    wordt gemachtigd blouses, overhemdblouses, van brei- of haakwerk (niet elastisch,
    niet gegummeerd) of geweven, voor dames, meisjes en kinderen, van wol, van katoen
    of van synthetische of van kunstmatige textielvezels, van de posten ex 60.05 A
    II en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-22,
    23, 24, 25 ; 61.02-78, 82, 84) (categorie 7), van oorsprong uit Hong-Kong en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
