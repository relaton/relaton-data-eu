---
id: EURegulation32901994
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3290/94 of 22 December 1994 on the adjustments
    and transitional arrangements required in the agriculture sector in order to implement
    the agreements concluded during the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3290/94 du Conseil, du 22 décembre 1994, relatif aux
    adaptations et aux mesures transitoires nécessaires dans le secteur de l'agriculture
    pour la mise en oeuvre des accords conclus dans le cadre des négociations commerciales
    multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3290/94 des Rates vom 22. Dezember 1994 über erforderliche
    Anpassungen und Übergangsmaßnahmen im Agrarsektor zur Anwendung der im Rahmen
    der multilateralen Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkünfte
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 3290/94 на Съвета от 22 декември
    1994 година относно адаптациите и преходните
    мерки, необходими в сектора на земеделието
    с цел прилагане на споразуменията, сключени
    по време на Уругвайския кръг на многостранните
    търговски преговори
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 3290/94 ze dne 22. prosince 1994 o úpravách
    a přechodných opatřeních nezbytných v odvětví zemědělství k provádění
    dohod uzavřených v rámci Uruguayského kola mnohostranných obchodních jednání
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3290/94 af 22. december 1994 om de tilpasninger
    og overgangsforanstaltninger, der er nødvendige i landbrugssektoren for gennemførelsen
    af de aftaler, som er indgået under de multilaterale handelsforhandlinger i Uruguay-rundens
    regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3290/94 του Συμβουλίου
    της 22ας Δεκεμβρίου 1994 σχετικά με τις προσαρμογές
    και τα μεταβατικά μέτρα στον τομέα της γεωργίας
    που είναι αναγκαία για την εφαρμογή των συμφωνιών
    οι οποίες έχουν συναφθεί στο πλαίσιο των πολυμερών
    εμπορικών διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 3290/94, 22. detsember 1994, põllumajandussektoris
    mitmepoolsete kaubandusläbirääkimiste Uruguay voorus sõlmitud lepingute rakendamiseks
    vajalike kohanduste ja üleminekukorralduste kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3290/94, annettu 22 päivänä joulukuuta 1994,
    maatalousalalla Uruguayn kierroksen monenvälisissä kauppaneuvotteluissa tehtyjen
    sopimusten täytäntöönpanemiseksi tarvittavista mukautuksista ja siirtymäjärjestelyistä
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 3290/94 od 22. prosinca 1994. o prilagodbama i
    prijelaznim aranžmanima koji su potrebni u poljoprivrednom sektoru radi provedbe
    sporazuma sklopljenih tijekom Urugvajske runde multilateralnih trgovinskih pregovora
  type: main
- language: hu
  script: Latn
  content: A Tanács 3290/94/EK rendelete (1994. december 22.) a többoldalú kereskedelmi
    tárgyalások uruguayi fordulója során megkötött megállapodások végrehajtásához
    a mezőgazdasági ágazatban szükséges kiigazításokról és átmeneti intézkedésekről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3290/94 del Consiglio, del 22 dicembre 1994, relativo
    agli adattamenti e alle misure transitorie necessarie nel settore dell'agricoltura
    per l'attuazione degli accordi conclusi nel quadro dei negoziati commerciali multilaterali
    dell'Uruguay Round
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 3290/94 (1994. gada 22. decembris) par pielāgojumiem
    un pārejas pasākumiem, kas vajadzīgi lauksaimniecības nozarē, lai īstenotu
    daudzpusējo tirdzniecības sarunu Urugvajas kārtā noslēgtos nolīgumus
  type: main
- language: lt
  script: Latn
  content: 1994 m. gruodžio 22 d. Tarybos reglamentas (EB) Nr. 3290/94 dėl žemės
    ūkio sektoriuje būtinų pritaikomųjų pataisų ir pereinamojo laikotarpio priemonių,
    kad būtų įgyvendintos daugiašalių derybų dėl prekybos Urugvajaus raunde
    sudarytos sutartys
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 3290/94 tat-22 ta' Diċembru 1994 dwar
    l-aġġustamenti u l-arranġamenti transitorji meħtieġa fis-settur agrikolu
    sabiex jiġi implimentat ftehim konkluż matul ir-Round Urugwajan tan-negozjati
    kummerċjali multilaterali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3290/94 van de Raad van 22 december 1994 inzake de
    aanpassingen en de overgangsmaatregelen in de landbouwsector voor de tenuitvoerlegging
    van de overeenkomsten in het kader van de multilaterale handelsbesprekingen van
    de Uruguay-Ronde
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 3290/94 z dnia 22 grudnia 1994 r. w sprawie
    dostosowań i przejściowych uzgodnień wymaganych w sektorze rolnym w celu wprowadzenia
    w życie porozumień zawartych w ramach wielostronnych negocjacji handlowych Rundy
    Urugwajskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3290/94 do Conselho, de 22 de Dezembro de 1994, relativo
    às adaptações e medidas transitórias necessárias no sector da agricultura
    para a execução dos acordos concluídos no âmbito das negociações comerciais
    multilaterais do «Uruguay Round»
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 3290/94 al Consiliului din 22 decembrie 1994 privind
    adaptările și măsurile tranzitorii necesare în sectorul agricol pentru aplicarea
    acordurilor încheiate în cadrul negocierilor comerciale multilaterale din Runda
    Uruguay
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 3290/94 z 22. decembra 1994 o úpravách a prechodných
    opatreniach požadovaných v odvetví poľnohospodárstva na účely realizácie
    dohôd, ktoré sa uzatvorili počas Uruguajského kola multilaterálnych obchodných
    rokovaní
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 3290/94 z dne 22. decembra 1994 o potrebnih prilagoditvah
    in prehodnih ukrepih v kmetijskem sektorju za uporabo sporazumov, sklenjenih med
    urugvajskim krogom večstranskih trgovinskih pogajanj
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3290/94 del Consejo, de 22 de diciembre de 1994, relativo
    a las adaptaciones y las medidas transitorias necesarias en el sector agrícola
    para la aplicación de los acuerdos celebrados en el marco de las negociaciones
    comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3290/94 av den 22 december 1994 om de anpassningar
    och övergångsåtgärder som krävs inom jordbrukssektorn för att genomföra
    avtalen som slöts inom ramen för de multilaterala handelsförhandlingarna i
    Uruguayrundan
  type: main
