title:
- language: en
  script: Latn
  content: '89/6/EEC: Commission Decision of 9 December 1988 amending for the third
    time Decision 76/653/EEC authorizing the Kingdom of Denmark and the French Republic
    to certify seed of certain species of cereals, under special conditions (only
    the Danish and the French versions of this text are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/6/CEE: Décision de la Commission du 9 décembre 1988 portant troisième
    modification de la décision 76/653/CEE autorisant le Royaume du Danemark et la
    République française à certifier les semences de certaines espèces de céréales
    dans des conditions particulières (Les textes en langues française et danoise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 9. Dezember 1988 zur dritten Änderung
    der Entscheidung 76/653/EWG zur Ermächtigung des Königreichs Dänemark und der
    Französischen Republik, Saatgut einiger Getreidearten unter besonderen Bedingungen
    anzuerkennen (Nur der dänische und der französische Text ist verbindlich) (89/6/EWG)
    (89/6/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 9. december 1988 om tredje ændring af beslutning
    75/653/EØF om bemyndigelse af Kongeriget Danmark og Den Franske Republik til
    at certificere sædekorn af visse kornarter på særlige betingelser (Kun den
    danske og den franske udgave er autentisk) (89/6/EØF) (89/6/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 9ης Δεκεμβρίου
