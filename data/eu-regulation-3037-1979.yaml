title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3037/79 of 21 December 1979 amending for
    the second time Regulation (EEC) No 2695/77 determining the conditions under which
    goods for certain categories of aircraft and ships are eligible upon importation
    for a favourable tariff arrangement
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3037/79 de la Commission, du 21 décembre 1979, portant
    deuxième modification du règlement (CEE) n° 2695/77 déterminant les conditions
    auxquelles est subordonnée l'admission de produits destinés à certaines catégories
    d'aérodynes ou de bateaux au bénéfice d'un régime tarifaire favorable à l'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3037/79 der Kommission vom 21. Dezember 1979 zur zweiten
    Änderung der Verordnung (EWG) Nr. 2695/77 zur Festlegung der Voraussetzungen,
    denen abgabenbegünstigt eingeführte Waren für bestimmte Arten von Luft- und
    Wasserfahrzeugen unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3037/79 af 21. december 1979 om den
    anden ændring af forordning (EØF) nr. 2695/77 om fastsættelse af betingelserne
    for indrømmelse af toldlempelser ved indførsel af varer, bestem til visse fly-
    eller skibskategorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3037/79 τής Επιτροπής
