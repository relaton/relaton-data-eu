  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3037/79 della Commissione, del 21 dicembre 1979, recante
    seconda modifica del regolamento (CEE) n. 2695/77 che determina le condizioni
    per l' ammissione dei prodotti destinati a talune categorie di aerodine o di navi
    al beneficio di un regime favorevole all' importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3037/79 van de Commissie van 21 december 1979 tot
    tweede wijziging van Verordening (EEG) nr. 2695/77 houdende vaststelling van de
    voorwaarden en bepalingen waaraan bij invoer van produkten bestemd voor bepaalde
    categorieën vliegtoestellen of schepen, de toepassing van een gunstige tariefregeling
    is onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3037/79 da Comissão, de 21 de Dezembro de 1979,
    que contém a segunda alteração do Regulamento (CEE) n.° 2695/77 que determina
    as condições a que se subordina a admissão de produtos destinados a determinadas
    categorias de aeródinos ou de embarcações ao benefício de um regime pautal
    favorável à importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3037/79 de la Comisión, de 21 de diciembre de 1979,
    por el que se modifica por segunda vez el Reglamento (CEE) n° 2695/77 por el
    que se fijan las condiciones a las que está supeditada la concesión a productos
    destinados a ciertas categorías de aerodinos o barcos de los beneficios de un
    régimen arancelario de importación favorable
