title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1196 of 19 July 2021 amending
    Implementing Decision (EU) 2020/167 as regards harmonised standards for certain
    radio equipment concerning ground- and wall-probing radio determination devices,
    radio frequency identification equipment, radio equipment for Euroloop railway
    systems, networked short range devices, wireless industrial applications and broadband
    communication radiolink for ships and off-shore installations
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1196 de la Commission du 19 juillet
    2021 modifiant la décision d’exécution (UE) 2020/167 en ce qui concerne les
    normes harmonisées relatives à certains équipements radioélectriques pour
    les dispositifs de radiorepérage pour le sondage des sols et des murs, les dispositifs
    d’identification par radiofréquences, les équipements radioélectriques destinés
    aux systèmes ferroviaires Euroloop, les dispositifs à courte portée fonctionnant
    en réseau, les applications industrielles sans fil et la radiocommunication à
    large bande pour les navires et les installations en mer
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1196 der Kommission vom 19. Juli 2021
    zur Änderung des Durchführungsbeschlusses (EU) 2020/167 hinsichtlich harmonisierter
    Normen für bestimmte Funkanlagen betreffend Anlagen zur Boden- und Wandsondierung
    mittels Funkortung, Funkfrequenz-Identifikationsgeräte, Funkanlagen für Euroloop-Eisenbahnsysteme,
    netzbasierte Funkanlagen mit geringer Reichweite, drahtlose industrielle Anwendungen
    und Breitband-Funkverbindungen für Schiffe und Offshore-Anlagen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2021/1196 на Комисията
    от 19 юли 2021 година за изменение на Решение за
    изпълнение (ЕС) 2020/167 по отношение на хармонизираните
    стандарти за някои радиосъоръжения относно
    устройства за радиоопределяне чрез радар за
    обследване на терени и стени, съоръжения за
    радиочестотна идентификация, радиосъоръжения
    за системи за обратна връзка в железопътния
    транспорт (Euroloop), мрежово базирани устройства
    с малък обсег на действие, безжични промишлени
    приложения и широколентова съобщителна радиовръзка
    за кораби и разположени в морето инсталации
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1196 ze dne 19. července 2021,
    kterým se mění prováděcí rozhodnutí (EU) 2020/167, pokud jde o harmonizované
    normy pro některá rádiová zařízení týkající se zařízení pro radarové
    sondování země a zdí, radiofrekvenčních identifikačních zařízení, rádiových
    zařízení pro drážní systémy Euroloop, zařízení krátkého dosahu založených
    na síti, bezdrátových průmyslových aplikací a širokopásmového komunikačního
    rádiového spoje pro lodní a pobřežní instalace
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1196 af 19. juli 2021
    om ændring af gennemførelsesafgørelse (EU) 2020/167 for så vidt angår harmoniserede
    standarder for visse typer af radioudstyr vedrørende visualiseringssystemer til
    radarsondering af jord og væg, radiofrekvent identifikationsudstyr, radioudstyr
    til Euroloop-jernbanesystemer, kortdistanceapparater i datanetværk, trådløse
    industrielle applikationer og bredbåndsradiolink beregnet til skibs- og offshoreinstallationer
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/1196 της Επιτροπής
    της 19ης Ιουλίου 2021 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2020/167 όσον αφορά
    τα εναρμονισμένα πρότυπα για ορισμένους τύπους
    ραδιοεξοπλισμού που περιλαμβάνουν συσκευές
    ραδιοπροσδιορισμού ανίχνευσης εδάφους και
    τοίχων, εξοπλισμό ραδιοσυχνικής αναγνώρισης,
    ραδιοεξοπλισμό για σιδηροδρομικά συστήματα
    Euroloop, δικτυωμένες συσκευές μικρής εμβέλειας,
    ασύρματες βιομηχανικές εφαρμογές και ευρυζωνική
    επικοινωνία ραδιοζεύξης για πλοία και υπεράκτιες
    εγκαταστάσεις
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/1196, 19. juuli 2021, millega muudetakse
    rakendusotsust (EL) 2020/167 seoses harmoneeritud standarditega, mis käsitlevad
    teatavaid raadioseadmeid (pinnase ja seina sondeerimisradarid, raadiosagedustuvastusseadmed,
    raudteesidesüsteemi Euroloop raadioseadmed, võrgupõhised lähitoimeseadmed,
    juhtmeta tööstuslikud rakendused ning lairiba raadiolingid laevadele ja avamere
    ehitistele)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/1196, annettu 19 päivänä
    heinäkuuta 2021, täytäntöönpanopäätöksen (EU) 2020/167 muuttamisesta siltä
    osin kuin on kyse tiettyjä radiolaitteita koskevista yhdenmukaistetuista standardeista,
    jotka koskevat maa- ja seinätutkakäyttöön tarkoitettuja radiomäärityslaitteita,
    radiotaajuisia etätunnistuslaitteita, rautateillä käytettävän Euroloop-järjestelmän
    radiolaitteita, verkotettuja lyhyen kantaman laitteita, langattomia teollisia
    sovelluksia sekä laivoissa ja avomerellä käytettäviä laajakaistaisia radiolinkkejä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/1196 ón gCoimisiún an 19 Iúil 2021
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2020/167 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe le haghaidh trealamh áirithe raidió, mar atá
    caighdeáin a bhaineann le gairis rad-aimsithe a dhéanann grinnscrúdú ar an
    talamh agus ar bhallaí, le trealamh aitheanta radaimhinicíochta, le trealamh
    raidió le haghaidh córais iarnróid Euroloop, le gairis líonraithe gearr-raoin,
    le feidhmchláir thionsclaíocha gan sreang agus le nasc raidió cumarsáide leathanbhanda
    le haghaidh long agus suiteálacha amach ón gcósta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/1196 оd 19. srpnja 2021. o izmjeni
    Provedbene odluke (EU) 2020/167 u pogledu usklađenih normi za određenu radijsku
    opremu koje se odnose na radarske uređaje za određivanje odraza od zemlje i
    od krute prepreke, radiofrekvencijsku opremu za identifikaciju, radijske uređaje
    za željezničke sustave europetlje, umrežene uređaje kratkoga dometa, bežične
    industrijske primjene i širokopojasnu komunikacijsku radiovezu za brodove i izvanobalne
    instalacije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1196 végrehajtási határozata (2021. július 19.)
    az (EU) 2020/167 végrehajtási határozatnak a talaj- és falvizsgáló rádiómeghatározó
    eszközök, a rádiófrekvenciás azonosító berendezések, az Euroloop vonatbefolyásoló
    rendszerek rádióberendezései, a hálózatalapú kis hatótávolságú eszközök,
    a vezeték nélküli ipari alkalmazások, valamint a hajók és part menti létesítmények
    széles sávú rádió-összeköttetése esetében az egyes rádióberendezésekre
    vonatkozó harmonizált szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1196 della Commissione del 19 luglio
    2021 che modifica la decisione di esecuzione (UE) 2020/167 per quanto riguarda
    le norme armonizzate per determinate apparecchiature radio relative a dispositivi
    di radiodeterminazione per l'introspezione sotterranea e intramuraria, apparecchiature
    di identificazione a radio frequenza, apparecchiature radio per sistemi ferroviari
    Euroloop, dispositivi in rete a corto raggio, applicazioni industriali wireless
    e trasmissioni radio marittime a banda larga per navi e installazioni off-shore
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1196 (2021. gada 19. jūlijs),
    ar ko Īstenošanas lēmumu (ES) 2020/167 groza attiecībā uz saskaņotajiem
    standartiem konkrētām radioiekārtām, kas attiecas uz zemes un sienu zondēšanas
    radionoteikšanas ierīcēm, radiofrekvenču identificēšanas iekārtām, radioiekārtām
    dzelzceļa Euroloop sistēmām, tīklā savienotām maza darbības attāluma ierīcēm,
    bezvadu rūpnieciskiem lietojumiem un platjoslas sakaru radiolīnijām kuģiem
    un atkrastes iekārtām
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/1196 2021 m. liepos 19 d.
    kuriuo iš dalies keičiamos Įgyvendinimo sprendimo (ES) 2020/167 nuostatos dėl
    tam tikrų radijo ryšio įrenginių, susijusių su žemės ir sienų zondavimo
    radijo bangomis įtaisais, radijo dažnių atpažinimo įrangos, radijo ryšio
    įrangos, skirtos Euroloop geležinkelio sistemoms, mažojo nuotolio įrenginių,
    veikiančių tinkluose, belaidės pramonėje naudojamos įrangos ir laivų ir
    jūrinių įrenginių plačiajuostės radijo ryšio linijos darniųjų standartų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1196 tad-19
    ta’ Lulju 2021 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2020/167
    fir-rigward ta’ standards armonizzati għal ċertu tagħmir tar-radju li jikkonċernaw
    apparati ta’ radjudeterminazzjoni għas-sondaġġ tal-art u tal-ħitan, tagħmir
    ta’ identifikazzjoni bil-frekwenza tar-radju, tagħmir tar-radju għas-sistemi
    ferrovjarji tal-Euroloop, apparati ta’ medda qasira f’network, applikazzjonijiet
    industrijali mingħajr fili u konnessjonijiet bir-radju fuq banda wiesgħa għall-vapuri
    u għal installazzjonijiet lil hinn mill-kosta
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1196 van de Commissie van 19 juli 2021 tot
    wijziging van Uitvoeringsbesluit (EU) 2020/167 wat betreft geharmoniseerde normen
    voor bepaalde radartoepassingen voor bodem- en wandsondering, radiofrequentie-identificatieapparatuur,
    radioapparatuur voor “Euroloop”-spoorwegsystemen, genetwerkte korteafstandsapparatuur,
    draadloze industriële toepassingen en breedbandcommunicatieradioverbindingen
    voor schepen en offshore-installaties
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1196 z dnia 19 lipca 2021 r. zmieniająca
    decyzję wykonawczą (UE) 2020/167 w odniesieniu do norm zharmonizowanych dotyczących
    niektórych urządzeń do radiowego próbkowania gruntu i ścian, urządzeń do
    identyfikacji radiowej, urządzeń radiowych dla systemów kolejowych Euroloop,
    sieciowych urządzeń bliskiego zasięgu, bezprzewodowych zastosowań przemysłowych
    oraz szerokopasmowych łączy radiowych stosowanych przez statki i morskie instalacje
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1196 da Comissão de 19 de julho de 2021
    que altera a Decisão de Execução (UE) 2020/167 no que diz respeito às normas
    harmonizadas para determinados equipamentos de rádio respeitantes a dispositivos
    de radiodeterminação de sondagem de solos e paredes, equipamento de identificação
    por radiofrequência, equipamento de rádio para sistemas ferroviários Euroloop,
    equipamento de curto alcance suportado em rede, aplicações industriais sem fios
    e ligações rádio marítimas de banda larga para embarcações e instalações
    no mar
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1196 a Comisiei din 19 iulie 2021
    de modificare a Deciziei de punere în aplicare (UE) 2020/167 în ceea ce privește
    standardele armonizate pentru anumite echipamente radio privind dispozitivele
    de radioreperaj terestru și de explorare a pereților, echipamentele de identificare
    a frecvenței radio, echipamentele radio pentru sistemele feroviare Euroloop,
    dispozitivele în rețea cu rază scurtă de acțiune, aplicațiile industriale
    fără fir și radiocomunicațiile în bandă largă pentru nave și instalații
    off-shore
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1196 z 19. júla 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2020/167, pokiaľ ide o harmonizované
    normy pre určité rádiové zariadenia týkajúce sa zariadení rádiového sondovania
    zeme a stien, zariadení na rádiofrekvenčnú identifikáciu, rádiových zariadení
    pre dráhové systémy Euroloop, sieťových zariadení s krátkym dosahom, bezdrôtových
    priemyselných aplikácií a širokopásmového komunikačného rádiového spojenia
    pre lode a zariadenia na mori
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1196 z dne 19. julija 2021 o spremembi
    Izvedbenega sklepa (EU) 2020/167 glede harmoniziranih standardov za določeno
    radijsko opremo v zvezi z napravami za radijsko določanje v tleh in stenah, opremo
    za radiofrekvenčno identifikacijo, radijsko opremo za železniške sisteme Euroloop,
    omrežnimi napravami kratkega dosega, brezžičnimi industrijskimi aplikacijami
    ter širokopasovnimi radiokomunikacijskimi povezavami za ladje in odobalne naprave
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1196 de la Comisión de 19 de julio de
    2021 por la que se modifica la Decisión de Ejecución (UE) 2020/167 en lo que
    respecta a las normas armonizadas aplicables a determinados equipos radioeléctricos
    en relación con los dispositivos de determinación de radar penetrante en suelos
    y muros, los equipos de identificación de radiofrecuencias, los equipos de radiocomunicaciones
    para sistemas de comunicación Euroloop, los dispositivos fijos de corto alcance
    en redes de datos, las aplicaciones industriales inalámbricas y el radioenlace
    marítimo de banda ancha para buques e instalaciones marítimas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/1196 av den 19 juli 2021 om
    ändring av genomförandebeslut (EU) 2020/167 vad gäller harmoniserade standarder
    för viss radioutrustning gällande radiobestämningsenheter för mark- och väggundersökning,
    utrustning för identifiering med radiofrekvens, radioutrustning för Euroloop-järnvägssystem,
    nätverksbaserad kortdistansutrustning, trådlösa industriella tillämpningar
    samt bredbandsradiolänk för fartyg och offshoreanläggningar
