  content: Directiva 2008/62/CE a Comisiei din 20 iunie 2008 de stabilire a anumitor
    derogări pentru acceptarea soiurilor locale și a varietăților agricole adaptate
    natural la condițiile locale și regionale și amenințate de eroziunea generică
    și pentru comercializarea semințelor și cartofilor de sămânță ale acestor
    soiuri locale și varietăți
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2008/62/ES z 20. júna 2008 , ktorou sa stanovujú určité
