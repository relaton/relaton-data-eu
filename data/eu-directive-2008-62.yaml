    dérogations pour l’admission des races primitives et variétés agricoles naturellement
    adaptées aux conditions locales et régionales et menacées d’érosion génétique,
    et pour la commercialisation de semences et de plants de pommes de terre de ces
    races primitives et variétés
  type: main
- language: de
  script: Latn
