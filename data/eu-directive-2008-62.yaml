title:
- language: en
  script: Latn
  content: Commission Directive 2008/62/EC of 20 June 2008 providing for certain derogations
    for acceptance of agricultural landraces and varieties which are naturally adapted
    to the local and regional conditions and threatened by genetic erosion and for
    marketing of seed and seed potatoes of those landraces and varieties
  type: main
- language: fr
  script: Latn
