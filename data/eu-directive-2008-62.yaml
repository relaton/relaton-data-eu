  type: main
- language: it
  script: Latn
  content: Direttiva 2008/62/CE della Commissione, del 20 giugno 2008 , recante deroghe
    per l'ammissione di ecotipi e varietà agricole naturalmente adattate alle condizioni
    locali e regionali e minacciate di erosione genetica, nonché per la commercializzazione
    di sementi e di tuberi di patata a semina di tali ecotipi e varietà
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2008/62/EK ( 2008. gada 20. jūnijs), ar ko paredz
    atsevišķas atkāpes saistībā ar to lauksaimniecības savvaļas sugu un šķirņu,
    atzīšanu, kuras ir dabiskā veidā pielāgotas vietējiem un reģionālajiem
    apstākļiem un ko apdraud ģenētiska erozija, un minēto savvaļas sugu un šķirņu
    sēklu un sēklas kartupeļu tirdzniecību
  type: main
- language: lt
  script: Latn
  content: 2008 m. birželio 20 d. Komisijos direktyva 2008/62/EB, numatanti tam tikras
    leidžiančias nukrypti nuostatas, taikomas žemės ūkio vietinių populiacijų
    ir veislių, kurios natūraliai prisitaikiusios prie vietos ir regiono sąlygų
    ir kurioms gresia genetinė erozija, patvirtinimui ir prekybai tų vietinių populiacijų
    bei veislių sėkla ir sėklinėmis bulvėmis
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2008/62/KE ta’ l- 20 ta’ Ġunju 2008 li tipprevedi
    ċerti derogi għall-approvazzjoni ta’ landraces (tipi partikolari) u varjetajiet
    agrikoli li huma adattati b’mod naturali għall-kundizzjonijiet lokali u reġjonali
    u mhedda minn tagħwir ġenetiku, u t-tqegħid fis-suq ta’ żerriegħa u patata
    taż-żerriegħa ta’ dawk il-landraces u varjetajiet
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/62/EG van de Commissie van 20 juni 2008 tot vaststelling
    van bepaalde afwijkingen voor de toelating van landrassen en rassen in de landbouw
    die zich op natuurlijke wijze hebben aangepast aan de lokale en regionale omstandigheden
    en die door genetische erosie worden bedreigd, en voor het in de handel brengen
    van zaaizaad en pootaardappelen van die landrassen en rassen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2008/62/WE z dnia 20 czerwca 2008 r. przewidująca pewne
