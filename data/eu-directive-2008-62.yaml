    ziemniaka tych populacji miejscowych i odmian
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/62/CE da Comissão, de 20 de Junho de 2008 , que prevê
    determinadas derrogações aplicáveis à admissão de variedades autóctones
    e variedades agrícolas naturalmente adaptadas às condições regionais e locais
    e ameaçadas pela erosão genética, bem como à comercialização de sementes
    e batatas de semente dessas variedades
  type: main
- language: ro
