title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1805/91 of 24 June 1991 re-establishing
    the levying of customs duties on products of category 17 (order No 40.0170), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1805/91 DE LA COMMISSION du 24 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    17 (numéro d'' ordre 40.0170) originaires de l'' Inde, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1805/91 DER KOMMISSION vom 24. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 17 (laufende
    Nummer 40.0170) mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1805/91 af 24. juni 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 17 (løbenummer 40.0170),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1805/91 της Επιτροπής
    της 24ης Ιουνίου 1991 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    17 ( αύξων αριθμός 40.0170 ), καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1805/91 DELLA COMMISSIONE del 24 giugno 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 17 (numero d'' ordine 40.0170) originari dell'' India, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1805/91 VAN DE COMMISSIE van 24 juni 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie nr. 17 (volgnummer 40.0170) van oorsprong uit India waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1805/91 DA COMISSÃO de 24 de Junho de 1991 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 17 (número
    de ordem 40.0170), originários da Índia, beneficiários das preferências pautais
    previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1805/91 DE LA COMISIÓN de 24 de junio de 1991 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 17 (número de orden 40.0170) originarios
    de la India, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3832/90 del Consejo #'
