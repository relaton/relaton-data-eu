    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    νημάτων από πολυεστέρες, καταγωγής Μαλαισίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1992/2000, annettu 18 päivänä syyskuuta 2000,
    Malesiasta peräisin olevien teksturoitujen polyesterifilamenttilankojen tuontia
    koskevan lopullisen polkumyyntitullin käyttöönottamisesta annetun asetuksen
    (EY) N:o 1001/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1992/2000 del Consiglio, del 18 settembre 2000, recante
    modifica del regolamento (CE) n. 1001/97 che istituisce un dazio antidumping definitivo
    sulle importazioni di filati di poliesteri testurizzati originari della Malaysia
  type: main
- language: nl
  script: Latn
