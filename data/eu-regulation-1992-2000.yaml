    auf die Einfuhren texturierter Polyester-Filamentgarne mit Ursprung in Malaysia
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1992/2000 af 18. september 2000 om ændring
    af forordning (EF) nr. 1001/97 om indførelse af en endelig antidumpingtold på
    importen af tekstureret garn af endeløse polyesterfibre med oprindelse i Malaysia
  type: main
- language: el
  script: Grek
