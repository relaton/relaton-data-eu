  content: Council Regulation (EC) No 1992/2000 of 18 September 2000 amending Regulation
    (EC) No 1001/97 imposing a definitive anti-dumping duty on imports of polyester
    textured filament yarn originating in Malaysia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1992/2000 du Conseil du 18 septembre 2000 modifiant
    le règlement (CE) nº 1001/97 instituant un droit antidumping définitif sur
    les importations de fils continus texturés de polyesters originaires de Malaisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1992/2000 des Rates vom 18. September 2000 zur Änderung
