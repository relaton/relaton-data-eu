  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1992/2000 do Conselho, de 18 de Setembro de 2000,
    que altera o Regulamento (CE) n.o 1001/97 que cria um direito anti-dumping definitivo
    sobre as importações de fios de filamentos texturizados de poliésteres originários
    da Malásia
  type: main
- language: es
  script: Latn
