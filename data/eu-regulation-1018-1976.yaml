title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1018/76 of 30 April 1976 amending Regulations
    (EEC) No 1896/73 and (EEC) No 582/76 as regards the products which may be bought
    into intervention in Germany and in the United Kingdom and the coefficients for
    Belgium in the beef sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1018/76 de la Commission, du 30 avril 1976, modifiant
    les règlements (CEE) n°s 1896/73 et 582/76 en ce qui concerne les produits pouvant
    faire l' objet d' achats à l' intervention en Allemagne et au Royaume-Uni, ainsi
    que les coefficients pour la Belgique dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1018/76 der Kommission vom 30. April 1976 zur Änderung
    der Verordnungen (EWG) Nrn. 1896/73 und 582/76 hinsichtlich der zur Intervention
    in Deutschland und im Vereinigten Königreich anzukaufenden Erzeugnisse sowie
    der Koeffizienten für Belgien auf dem Rindfleischsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1018/76 af 30. april 1976 om ændring
    af forordning (EØF) nr. 1896/73 og forordning (EØF) nr. 582/76 for så vidt
    angår de produkter, der kan opkøbes ved intervention i Forbundsrepublikken Tyskland
    og Det forenede Kongerige, samt koefficienterne for Belgien inden for oksekødsektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1018/75 della Commissione, del 30 aprile 1976, che
    modifica i regolamenti (CEE) n. 1896/73 e (CEE) n. 582/76 per quanto riguarda
    i prodotti che possono essere acquistati all' intervento in Germania e nel Regno
    Unito e i coefficienti applicabili per il Belgio nel settore delle carni bovine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1018/76 van de Commissie van 30 april 1976 tot wijziging
    van de Verordeningen (EEG) nr. 1896/73 en nr. 582/76 inzake de produkten die in
    Duitsland en het Verenigd Koninkrijk door de interventiebureaus kunnen worden
    aangekocht en inzake de voor België geldende coëfficiënten in de rundvleessector
