  content: Décision de la Commission, du 3 février 1971, autorisant la République
    fédérale d'Allemagne à admettre jusqu'au 30 avril 1972, la commercialisation
    de semences certifiées de fromental et d'avoine jaunâtre soumises à des exigences
    réduites
  type: main
- language: de
  script: Latn
  content: '71/94/EWG: Entscheidung der Kommission vom 3. Februar 1971 zur Ermächtigung
    der Bundesrepublik Deutschland, bis zum 30. April 1972 zertifiziertes Saatgut
    von Glatthafer und Goldhafer mit minderen Anforderungen zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '71/94/CEE: Decisione della Commissione, del 3 febbraio 1971, che autorizza
    la Repubblica federale di Germania ad ammettere, fino al 30 aprile 1972, la commercializzazione
    di sementi certificate di avena altissima e di avena bionda soggette a requisiti
    ridotti'
  type: main
- language: nl
  script: Latn
  content: '71/94/EEG: Beschikking van de Commissie van 3 februari 1971 waarbij de
    Duitse Bondsrepubliek wordt gemachtigd om tot en met 30 april 1972 gecertificeerd
    zaad van Frans raaigras en goudhaver, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten'
