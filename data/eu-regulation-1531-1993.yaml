- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1531/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of category 16 (order No 40.0160), originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1531/93 de la Commission, du 18 juin 1993, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 16 (numéro d' ordre 40.0160) originaires de Thaïlande, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1531/93 DER KOMMISSION vom 18. Juni 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 16 (laufende Nummer 40.0160) mit Ursprung
    in Thailand, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1531/93 af 18. juni 1993 om genindførelse
    af opkrævning af told for varer under kategori 16 (løbenummer 40.0160), som
    har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
