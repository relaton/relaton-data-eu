title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 341/90 of 5 February 1990 accepting undertakings
    and imposing a definitive anti- dumping duty on imports of ferro-silicon originating
    in Iceland, Norway, Sweden, Venezuela or Yugoslavia, except those sold for export
    to the Community by companies whose undertakings have been accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 341/90 du Conseil du 5 février 1990 portant acceptation
    d'engagements et instituant un droit antidumping définitif sur les importations
    de ferrosilicium originaire d'Islande, de Norvège, de Suède, du Venezuela et
    de Yougoslavie, à l'exception de celles réalisées à partir de ventes à l'exportation
    à destination de la Communauté effectuées par les sociétés dont les engagements
    sont acceptés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 341/90 DES RATES vom 5. Februar 1990 zur Annahme von
    Verpflichtungen und zur Einfuehrung eines endgueltigen Antidumpingzolls auf Einfuhren
    von Ferrosilicium mit Ursprung in Island, Norwegen, Schweden, Venezuela und Jugoslawien
    _ mit Ausnahme der Exportverkaeufe in die Gemeinschaft von Unternehmen, deren
    Verpflichtungen angenommen wurden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 341/90 af 5. februar 1990 om godtagelse af
    tilsagn og om indførelse af en endelig antidumpingtold på importen af ferrosilicium
    med oprindelse i Island, Norge, Sverige, Venezuela og Jugoslavien, bortset fra
    den import, der finder sted ved salg til eksport til Fællesskabet fra de selskaber,
    hvis tilsagn er godtaget
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 341/90 του Συμβουλίου
    της 5ης Φεβρουαρίου 1990 για την αποδοχή ανάληψης
    υποχρεώσεων και την επιβολή οριστικού δασμού
    αντιντάμπινγκ στις εισαγωγές σιδηροπυριτίου,
    καταγωγής Ισλανδίας, Νορβηγίας, Σουηδίας, Βενεζουέλας
    και Γιουγκοσλαβίας, εκτός από τις εισαγωγές
    που πραγματοποιούνται στα πλαίσια πωλήσεων
    για εξαγωγή προς την Κοινότητα από τις εταιρείες
    των οποίων η ανάληψη υποχρεώσεων έχει γίνει
    αποδεκτή
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 341/90 DEL CONSIGLIO del 5 febbraio 1990 che accetta
    gli impegni e che istituisce un dazio antidumping definitivo sulle importazioni
    di ferrosilicio originario dell'Islanda, della Norvegia, della Svezia, del Venezuela
    e della Iugoslavia, fatta eccezione per quelle effettuate a partire da vendite
    ai fini dell'esportazione nella Comunità da parte di società i cui impegni sono
    stati accettati
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 341/90 VAN DE RAAD van 5 februari 1990 houdende aanvaarding
    van verbintenissen en instelling van een definitief anti-dumpingrecht op de invoer
    van ferrosilicium van oorsprong uit IJsland, Noorwegen, Zweden, Venezuela en Joegoslavië,
    behoudens op de invoer van ferrosilicium die heeft plaatsgevonden op basis van
    verkopen voor de uitvoer door de ondernemingen waarvan de verbintenissen worden
    aanvaard
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 341/90 DO CONSELHO de 5 de Fevereiro de 1990 que aceita
    os compromissos e que institui um direito anti-dumping definitivo sobre as importaçoes
    de ferro-silicio originarias da Islândia, da Noruega, da Suécia, da Venezuela
    e da Jugoslavia, com excepçao das realizadas a partir de vendas para exportaçao
    com destino à Comunidade efectuadas pelas empresas cujos compromissos sao aceites
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 341/90 DEL CONSEJO de 5 de febrero de 1990 por el que
    se establece un derecho antidumping definitivo sobre las importaciones de ferrosilicio
    originario de Islandia, Noruega, Suecia, Venezuela y Yugoslavia, excepto para
    aquéllas realizadas a partir de ventas de exportacion con destino a la Comunidad
    por sociedades cuyo compromiso ha sido aceptado
