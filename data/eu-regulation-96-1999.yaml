title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 96/1999 of 12 January 1999 amending Regulation
    (EC) No 1950/97 imposing a definitive anti-dumping duty on imports of sacks and
    bags made of polyethylene or polypropylene originating in India, Indonesia and
    Thailand and collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 96/1999 du Conseil du 12 janvier 1999 modifiant le
    règlement (CE) nº 1950/97 instituant un droit antidumping définitif sur les
    importations de sacs et sachets de polyéthylène ou de polypropylène originaires
    d'Inde, d'Indonésie et de Thaïlande et portant perception définitive du droit
    provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 96/1999 des Rates vom 12. Januar 1999 zur Änderung
    der Verordnung (EG) Nr. 1950/97 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Säcken und Beuteln aus Polyethylen oder Polypropylen mit
    Ursprung in Indien, Indonesien und Thailand und zur endgültigen Vereinnahmung
    des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 96/1999 af 12. januar 1999 om ændring af forordning
