type: standard
title:
- language: en
  script: Latn
  content: '79/499/EEC: Commission Decision of 7 May 1979 authorizing Ireland not
    to apply Community treatment to track suits of knitted or crocheted fabric, not
    elastic or rubberized, of wool, cotton or man-made textile fibres, falling within
    subheading ex 60.05 A II of the Common Customs Tariff (NIMEXE codes 60.05-16,
    17, 19) (category 73), originating in South Korea and in free circulation in the
    other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/499/CEE: Décision de la Commission, du 7 mai 1979, autorisant l''Irlande
    à exclure du traitement communautaire les survêtements de sport (trainings)
    de bonneterie non élastique ni caoutchoutée, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la sous-position ex 60.05 A II du
    tarif douanier commun (codes Nimexe: 60.05-16, 17, 19) (catégorie 73), originaires
    de la Corée du Sud et mis en libre pratique dans les autres Etats membres (Le
    texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/499/EWG: Entscheidung der Kommission vom 7. Mai 1979, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Trainingsanzüge aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Tarifstelle ex 60.05 A II des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.05-16; 17; 19) (Kategorie 73) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/499/EØF: Kommissionens beslutning af 7. maj 1979 om bemyndigelse af
    Irland til fra fællesskabsbehandling at undtage træningsdragter af trikotage,
    ikke elastisk eller gummeret, som henhører under pos. ex 60.05 A II i den fælles
    toldtarif (NIMEXE-nummer 60.05-16, 17, 19; kategori 73), har oprindelse i Sydkorea
    og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/499/CEE: Decisione della Commissione, del 7 maggio 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le tute sportive a maglia
    non elastica né gommata, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della sottovoce ex 60.05-A II della tariffa doganale comune (codici Nimexe: 60.05-16,
    17, 19) (categoria 73), originarie della Corea del Sud e messe in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/499/EEG: Beschikking van de Commissie van 7 mei 1979 waarbij Ierland
    wordt gemachtigd trainingspakken van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van wol, van katoen of van synthetische of kunstmatige textielvezels,
    van post ex 60.05 A II van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-16,
    17, 19) (categorie 73), van oorsprong uit Zuid-Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
