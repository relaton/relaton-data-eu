title:
- language: en
  script: Latn
  content: '89/228/EEC: Commission Decision of 30 November 1988 on Decree-Law No 370/87
    of 7 September 1987 of the Italian Government subsequently converted into Law
    No 460 of 4 November 1987 on production and marketing, including new standards
    for the production and marketing of wine sector products (Only the Italian text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/228/CEE: Décision de la Commission du 30 novembre 1988 relative au
    décret-loi n° 370/87, du gouvernement italien, du 7 septembre 1987, converti
    en loi n° 460, du 4 novembre 1987, relative à la production et à la commercialisation
    et portant notamment nouvelles normes en matière de production et de commercialisation
    des produits viti-vinicoles (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
