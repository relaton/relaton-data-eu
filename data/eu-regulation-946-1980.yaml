title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 946/80 of 14 April 1980 re-establishing
    the levying of customs duties on knives, falling within subheading 82.09 A, originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2788/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 946/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    de la sous-position 82.09 A du tarif douanier commun, originaires des pays en
    voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2788/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 946/80 der Kommission vom 14. April 1980 zur Wiedereinführung
    des Zollsatzes für Messer der Tarifstelle 82.09 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2788/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 946/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter for knive under underposition 82.09 A, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2788/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 946/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli, della sottovoce
    doganale 82.09 A, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2788/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 946/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor messen van post 82.09
    A, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2788/79 van de Raad tariefpreferenties werden geopend
  type: main
