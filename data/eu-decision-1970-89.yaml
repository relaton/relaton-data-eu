title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1969, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de réinstallation effectuées par le "Bundesministerium
    für Post und Verkehr" et par la "Bundesanstalt für Arbeitsvermittlung und Arbeitslosenversicherung
    (BAVAV)"
  type: main
- language: de
  script: Latn
  content: '70/89/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Gewährung eines Zuschusses aus dem ESF an die Bundesrepublik Deutschland zu Aufwendungen
    für vom Bundesministerium für Post und Verkehr und von der Bundesanstalt für
    Arbeitsvermittlung und Arbeitslosenversicherung (BAVAV) durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '70/89/CEE: Decisione della Commissione, del 22 dicembre 1969, relativa
    alla concessione di un contributo del FSE a favore della Repubblica federale di
    Germania per spese concernenti operazioni di nuova sistemazione effettuate dal
    «Bundesministerium für Post und Verkehr» e dal «Bundesanstalt für Arbeitsvermittlung
    und Arbeitslosenversicherung (BAVAV)»'
  type: main
- language: nl
  script: Latn
  content: '70/89/EEG: Beschikking van de Commissie van 22 december 1969 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Bondsrepubliek Duitsland
    voor door het "Bundesministerium für Post und Verkehr" en door de "Bundesanstalt
    für Arbeitsvermittlung und Arbeitslosenversicherung" (B.A.V.A.V.) gemaakte verplaatsingskosten'
