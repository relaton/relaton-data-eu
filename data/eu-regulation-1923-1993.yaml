    für den Absatz von Hartweizen aus Beständen der griechischen und italienischen
    Interventionsstelle auf dem Binnenmarkt zur Verarbeitung in bestimmten Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1923/93 af 16. juli 1993 om ændring
