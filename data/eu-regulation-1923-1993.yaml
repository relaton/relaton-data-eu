  content: Commission Regulation (EEC) No 1923/93 of 16 July 1993 amending Regulations
    (EEC) No 1645/93 and (EEC) No 1795/93 opening standing invitations to tender for
    the resale on the internal market of durum wheat held by the Greek and Italian
    intervention agencies with a view to its processing in certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1923/93 de la Commission, du 16 juillet 1993, modifiant
