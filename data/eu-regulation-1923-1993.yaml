    permanentes pour la revente sur le marché intérieur de froment dur détenu par
    les organismes d'intervention hellénique et italien en vue de sa transformation
    dans certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1923/93 der Kommission vom 16. Juli 1993 zur Änderung
