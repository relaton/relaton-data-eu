    de opening van permanente openbare inschrijvingen voor de verkoop op de interne
    markt van durum tarwe uit Griekse en Italiaanse interventievoorraden met het oog
    op verwerking in bepaalde Lid-Staten
  type: main
- language: pt
  script: Latn
