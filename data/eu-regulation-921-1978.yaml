title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 921/78 of 28 April 1978 re-establishing
    the levying of customs duties on fibre building board of wood or other vegetable
    material, falling within heading No 44.11 and originating in Brazil, to which
    the preferential tariff arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 921/78 de la Commission, du 28 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux panneaux
    de fibres de bois ou d'autres matières végétales, de la position tarifaire
    44.11, originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 921/78 der Kommission vom 28. April 1978 zur Wiedereinführung
    des Zollsatzes für Platten aus Fasern von Holz oder anderen pflanzlichen Stoffen
    der Tarifnummer 44.11, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 921/78 af 28. april 1978 om genindførelse
    af opkrævning af toldafgifter for træfiberplader og fiberplader af andre vegetabilske
    materialer, under position 44.11, som har oprindelse i Brasilien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 921/78 della Commissione, del 28 aprile 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai pannelli di fibre di
    legno o di altre materie vegetali, della voce doganale 44.11, originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 921/78 van de Commissie van 28 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen van
    houtvezels of van andere plantaardige vezels, van post 44.11, van oorsprong uit
    Brazilië ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
