    υπό μορφή ανταλλαγής επιστολών, για την προσωρινή
    παράταση της ισχύος του πρωτοκόλλου που προσαρτάται
    στη συμφωνία μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της κυβέρνησης της Δημοκρατίας
    της Σενεγάλης όσον αφορά την αλιεία στα ανοικτά
    των ακτών της Σενεγάλης για την περίοδο από
    1ης έως 30 Απριλίου 1990'
  type: main
- language: it
