title:
- language: en
  script: Latn
  content: '90/405/EEC: Council Decision of 27 July 1990 on the conclusion of an Agreement
    in the form of an exchange of letters temporarily extending from 1 to 30 April
    1990 the Protocol to the Agreement between the European Economic Community and
    the Government of the Republic of Senegal on fishing off the coast of Senegal'
  type: main
- language: fr
  script: Latn
  content: '90/405/CEE: Décision du Conseil du 27 juillet 1990 relative à la conclusion
    de l''accord sous forme d''échange de lettres portant prorogation intérimaire
    du protocole annexé à l''accord entre la Communauté économique européenne
    et le gouvernement de la République du Sénégal concernant la pêche au large
    de la côte sénégalaise pour la période allant du du 1er avril 1990 au 30 avril
    1990'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 27. Juli 1990 ueber den Abschluss des Abkommens
    in Form eines Briefwechsels zur voruebergehenden Verlaengerung des Protokolls
    zu dem Abkommen zwischen der Europaeischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Senegal ueber die Fischerei vor der senegalesischen Kueste fuer die
    Zeit vom 1. bis 30. April 1990 (90/405/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 27. juli 1990 om indgaaelse af aftalen i form af
    brevveksling om midlertidig forlaengelse af protokollen til aftalen mellem Det
    Europaeiske OEkonomiske Faellesskab og regeringen for Republikken Senegal om fiskeri
    ud for Senegals kyst for perioden 1. til 30. april 1990 (90/405/EOEF)
  type: main
- language: el
  script: Grek
