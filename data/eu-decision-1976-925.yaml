---
id: EUDecision1976925
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 4 November 1976 authorizing the French Republic
    not to apply Community treatment to umbrellas and sunshades (including walking-stick
    umbrellas and similar umbrellas) falling within heading No 66.01 of the Common
    Customs Tariff, originating in Taiwan and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '76/925/CEE: Décision de la Commission, du 4 novembre 1976, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles y compris les parapluies-cannes et similaires, de la position
    66.01 du Tarif douanier commun, originaires de Taiwan et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. November 1976, mit der die Französische
    Republik ermächtigt wird, die aus Taiwan stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Regenschirme und Sonnenschirme, einschließlich
    Stockschirme und dergleichen, der Tarifnummer 66.01 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. november 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage paraplyer og parasoller (herunder
    stokkeparaplyer og lignende), som henhører under pos. 66.01 i den fælles toldtarif,
    har oprindelse i Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 novembre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli ombrelli (da pioggia e da
    sole), compresi gli ombrelli-bastone, i parasoli-tende, gli ombrelloni e simili,
    della voce 66.01 della tariffa doganale comune, originari di Taiwan e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 november 1976 waarbij de Franse Republiek
    wordt gemachtigd paraplu's en parasols, alsmede wandelstokparaplu's, tuinparasols,
    parasoltenten en dergelijke, van post 66.01 van het gemeenschappelijk douanetarief,
    van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
