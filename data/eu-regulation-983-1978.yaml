title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 983/78 of 16 May 1978 re-establishing the
    levying of customs duties on woven fabrics of regenerated textile fibres falling
    within subheading 56.07 B, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2706/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 983/78 de la Commission, du 16 mai 1978, portant rétablissement
    de la perception des droits de douane applicables aux tissus de fibres textiles
    artificielles, de la sous-position tarifaire 56.07 B, originaires des pays et
    territoires en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 983/78 der Kommission vom 16. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Gewebe aus künstlichen Spinnfasern, der Tarifstelle 56.07
    B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 983/78 af 16. maj 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af regenererede fibre, under underposition
    56.07 B, som har oprindelse i udviklingslandene og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 983/78 della Commissione, del 16 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    artificiali della sottovoce doganale 56.07 B originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 983/78 van de Commissie van 16 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van kunstmatige vezels, van post 56.07 B, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2706/77 van de Raad tariefpreferenties
    werden geopend
  type: main
