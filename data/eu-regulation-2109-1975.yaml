title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2109/75 of the Council of 11 August 1975 fixing the
    date of application of the tariff reductions provided for in Articles 8 and 9
    of Protocol 1 to the Agreement between the European Economic Community and the
    State of Israel for certain agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2109/75 du conseil, du 11 août 1975, fixant la date
    de mise en application des réductions tarifaires prévues aux articles 8 et 9
    du protocole n° 1 de l'accord entre la communauté économique européenne et
    L'État d'Israël et relatives à certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2109/75 des Rates vom 11. August 1975 zur Festsetzung
    des Zeitpunkts für die Anwendung der Zollsenkungen, die für einige landwirtschaftliche
    Erzeugnisse in den Artikeln 8 und 9 des Protokolls Nr. 1 des Abkommens zwischen
    der Europäischen Wirtschaftsgemeinschaft und dem Staat Israel vorgesehen sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2109/75 af 11. august 1975 om fastsættelse
    af datoen for gonnemførelse af de toldnedsættelser, der er fastsat i artikel
    8 og 9 i protokol nr. 1 til aftalen mellem Det europæiske økonomiske Fællesskab
    og Israel, for så vidt angår visse landbrugsvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2109/75 του Συμβουλίου,
    της 11ης Αυγούστου 1975, περί καθορισμού της ημερομηνίας
    εφαρμογής των δασμολογικών μειώσεων που προβλέπονται
    στα άρθρα 8 και 9 του πρωτοκόλλου υπ' αριθ. 1 της
    συμφωνίας μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και του κράτους του Ισραήλ σχετικά
    με ορισμένα αγροτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2109/75, annettu 11 päivänä elokuuta 1975,
    Euroopan talousyhteisön ja Israelin valtion sopimuksen pöytäkirjassa N:o 1
    olevan 8 ja 9 artiklan mukaisten tullinalennusten soveltamispäivästä tiettyjen
    maataloustuotteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2109/75 del Consiglio, dell'11 agosto 1975, che fissa
    la data di applicazione delle riduzioni tariffarie previste per alcuni prodotti
    agricoli agli articoli 8 e 9 del protocollo n. 1 dell'accordo tra la Comunità
    economica europea e lo Stato d'Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2109/75 van de Raad van 11 augustus 1975 houdende
    vaststelling van de datum waarop de in de artikelen 8 en 9 van protocol nr. 1
    van de overeenkomst tussen de Europese economische gemeenschap en de staat Israël
    vastgestelde tariefverlagingen met betrekking tot bepaalde landbouwprodukten van
    toepassing worden
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 2109/75 av den 11 augusti 1975 om fastställande
