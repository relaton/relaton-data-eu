    tiegħu
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2016/1232 van de Raad van 18 juli 2016 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen in de stabilisatie- en associatieraad
    die is opgericht bij de stabilisatie- en associatieovereenkomst tussen de Europese
    Unie en de Europese Gemeenschap voor Atoomenergie, enerzijds, en Kosovo (Deze
    benaming laat de standpunten over de status onverlet en is in overeenstemming
    met Resolutie 1244 (1999) van de VN-Veiligheidsraad en het advies van het Internationaal
    Gerechtshof over de onafhankelijkheidsverklaring van Kosovo.), anderzijds, met
    betrekking tot de vaststelling door de stabilisatie- en associatieraad van zijn
    reglement van orde
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2016/1232 z dnia 18 lipca 2016 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Rady Stabilizacji i
    Stowarzyszenia ustanowionej na mocy Układu o stabilizacji i stowarzyszeniu między
    Unią Europejską i Europejską Wspólnotą Energii Atomowej, z jednej strony,
    a Kosowem (Użycie tej nazwy nie wpływa na stanowiska w sprawie statusu i jest
    zgodne z rezolucją Rady Bezpieczeństwa ONZ 1244/1999 oraz z opinią Międzynarodowego
    Trybunału Sprawiedliwości w sprawie Deklaracji niepodległości Kosowa.), z
    drugiej strony, w odniesieniu do decyzji Rady Stabilizacji i Stowarzyszenia w
    sprawie przyjęcia jej regulaminu wewnętrznego
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2016/1232 do Conselho, de 18 de julho de 2016, que estabelece
    a posição a adotar, em nome da União Europeia, no âmbito do Conselho de Estabilização
    e de Associação criado pelo Acordo de Estabilização e de Associação entre
    a União Europeia e a Comunidade Europeia da Energia Atómica, por um lado, e
    o Kosovo (Esta designação não prejudica as posições relativas ao estatuto
    e está conforme com a Resolução 1244/1999 do CSNU e com o parecer do TIJ sobre
    a declaração de independência do Kosovo.), por outro, no que diz respeito a
    uma decisão do Conselho de Estabilização e de Associação que adota o seu
    regulamento interno
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2016/1232 a Consiliului din 18 iulie 2016 de stabilire a poziției
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de stabilizare și de asociere instituit prin Acordul de stabilizare și de asociere
    dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice, pe de
    o parte, și Kosovo (Această denumire nu aduce atingere pozițiilor privind statutul
    și este conformă cu RCSONU 1244/1999, precum și cu Avizul CIJ privind Declarația
    de independență a Kosovo.), pe de altă parte, cu privire la Decizia Consiliului
    de stabilizare și de asociere de adoptare a regulamentului său de procedură
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2016/1232 z 18. júla 2016, ktorým sa stanovuje
    pozícia, ktorá sa má v mene Európskej únie zaujať v Rade pre stabilizáciu
    a pridruženie zriadenej Dohodou o stabilizácii a pridružení medzi Európskou
    úniou a Európskym spoločenstvom pre atómovú energiu na jednej strane a Kosovom
    (Týmto označením nie sú dotknuté pozície k štatútu a označenie je v súlade
    s rezolúciou BR OSN č. 1244/1999 a so stanoviskom Medzinárodného súdneho
    dvora k vyhláseniu nezávislosti Kosova.) na strane druhej v súvislosti s rozhodnutím
    Rady pre stabilizáciu a pridruženie, ktorým sa prijíma jej rokovací poriadok
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2016/1232 z dne 18. julija 2016 o stališču, ki se v
    imenu Evropske unije zavzame v Stabilizacijsko-pridružitvenem svetu, vzpostavljenem
    s Stabilizacijsko-pridružitvenim sporazumom med Evropsko unijo in Evropsko skupnostjo
    za atomsko energijo na eni strani ter Kosovom (To poimenovanje ne posega v stališča
    o statusu ter je v skladu z RVSZN 1244/1999 in mnenjem Meddržavnega sodišča
    o razglasitvi neodvisnosti Kosova.) na drugi strani, v zvezi s sklepom Stabilizacijsko-pridružitvenega
    sveta o sprejetju poslovnika
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/1232 del Consejo, de 18 de julio de 2016, por la que
    se establece la posición que se ha de adoptar en nombre de la Unión Europea
    en el Consejo de Estabilización y Asociación creado por el Acuerdo de Estabilización
    y Asociación entre la Unión Europea y la Comunidad Europea de la Energía Atómica,
    por una parte, y Kosovo (La denominación «Kosovo» se entiende sin perjuicio
    de las posiciones sobre su estatuto y está en consonancia con la Resolución
    1244 (1999) del Consejo de Seguridad de las Naciones Unidas y con la Opinión
    de la Corte Internacional de Justicia sobre la declaración de independencia de
    Kosovo.), por otra, relativa a una decisión del Consejo de Estabilización y
    Asociación por la que adopta su reglamento interno
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2016/1232 av den 18 juli 2016 om fastställande av
    den ståndpunkt som på Europeiska unionens vägnar ska intas i det stabiliserings-
    och associeringsråd som inrättats genom stabiliserings- och associeringsavtalet
    mellan Europeiska unionen och Europeiska atomenergigemenskapen, å ena sidan,
    och Kosovo (Denna beteckning påverkar inte ståndpunkter om Kosovos status och
    är i överensstämmelse med FN:s säkerhetsråds resolution 1244/1999 och med
    Internationella domstolens utlåtande om Kosovos självständighetsförklaring.),
    å andra sidan, vad gäller stabiliserings- och associeringsrådets beslut om
    antagande av dess arbetsordning
