    kura izveidota ar Stabilizācijas un asociācijas nolīgumu starp Eiropas Savienību
    un Eiropas Atomenerģijas kopienu, no vienas puses, un Kosovu (Šis nosaukums
    neskar nostājas par statusu un atbilst ANO DP Rezolūcijai 1244/1999 un Starptautiskās
    Tiesas atzinumam par Kosovas neatkarības deklarāciju.), no otras puses, attiecībā
    uz Stabilizācijas un asociācijas padomes lēmumu, ar ko pieņem tās reglamentu
  type: main
