    απόφαση του συμβουλίου σταθεροποίησης και
    σύνδεσης για τη θέσπιση του εσωτερικού κανονισμού
    του
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2016/1232, 18. juuli 2016, millega määratakse kindlaks
    ühelt poolt Euroopa Liidu ja Euroopa Aatomienergiaühenduse ning teiselt poolt
    Kosovo (Kõnealune nimetus ei piira seisukohti staatuse suhtes ning on kooskõlas
    ÜRO Julgeolekunõukogu resolutsiooniga 1244/1999 ja Rahvusvahelise Kohtu arvamusega
    Kosovo iseseisvusdeklaratsiooni kohta.) vahelise stabiliseerimis- ja assotsieerimislepinguga
    moodustatud stabiliseerimis- ja assotsieerimisnõukogus Euroopa Liidu nimel võetav
    seisukoht seoses stabiliseerimis- ja assotsieerimisnõukogu otsusega, millega
    võetakse vastu nimetatud nõukogu töökord
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2016/1232, annettu 18 päivänä heinäkuuta 2016,
    Euroopan unionin ja Euroopan atomienergiayhteisön sekä Kosovon (Tämä nimitys
    ei vaikuta asemaa koskeviin kantoihin, ja se on YK:n turvallisuusneuvoston päätöslauselman
    1244/1999 ja Kansainvälisen tuomioistuimen Kosovon itsenäisyysjulistuksesta
    antaman lausunnon mukainen.) välisellä vakautus- ja assosiaatiosopimuksella
    perustetussa vakautus- ja assosiaationeuvostossa Euroopan unionin puolesta esitettävästä
    kannasta vakautus- ja assosiaationeuvoston päätökseen työjärjestyksensä
    vahvistamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2016/1232 od 18. srpnja 2016. o utvrđivanju stajališta
    koje treba zauzeti u ime Europske unije u okviru Vijeća za stabilizaciju i pridruživanje
    osnovanoga Sporazumom o stabilizaciji i pridruživanju između Europske unije
    i Europske zajednice za atomsku energiju, s jedne strane, i Kosova (Ovim se nazivom
    ne dovode u pitanje stajališta o statusu te je on u skladu s RVSUN-om 1244/1999
    i mišljenjem Međunarodnog suda o proglašenju neovisnosti Kosova.), s druge
    strane, u vezi s Odlukom Vijeća za stabilizaciju i pridruživanje o donošenju
    svojeg poslovnika
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2016/1232 határozata (2016. július 18.) az egyrészről
    az Európai Unió és az Európai Atomenergia-közösség, másrészről Koszovó
    (Ez a megnevezés nem érinti a jogállással kapcsolatos álláspontokat, továbbá
    összhangban van az 1244 (1999) ENSZ BT-határozattal és a Nemzetközi Bíróságnak
    a koszovói függetlenségi nyilatkozatról szóló véleményével.) közötti
    stabilizációs és társulási megállapodással létrehozott Stabilizációs
    és Társulási Tanácsban a Stabilizációs és Társulási Tanács eljárási
    szabályzatának elfogadásáról szóló határozattal kapcsolatban az Európai
    Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2016/1232 del Consiglio, del 18 luglio 2016, relativa alla
    posizione da adottare a nome dell'Unione europea in sede di consiglio di stabilizzazione
    e di associazione istituito dall'accordo di stabilizzazione e di associazione
    tra l'Unione europea e la Comunità europea dell'energia atomica, da una parte,
