id: EUDecision20161232
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2016/1232 of 18 July 2016 establishing the position
    to be taken on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Union and the European Atomic Energy Community, of the one part, and
    Kosovo (This designation is without prejudice to positions on status, and is in
    line with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo declaration of independence.),
    of the other part, concerning a Decision of the Stabilisation and Association
    Council adopting its rules of procedure
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/1232 du Conseil du 18 juillet 2016 établissant la
    position à prendre au nom de l'Union européenne au sein du conseil de stabilisation
    et d'association institué par l'accord de stabilisation et d'association entre
    l'Union européenne et la Communauté européenne de l'énergie atomique, d'une
    part, et le Kosovo (Cette désignation est sans préjudice des positions sur le
    statut et est conforme à la résolution 1244 (1999) du Conseil de sécurité
    des Nations unies ainsi qu'à l'avis de la CIJ sur la déclaration d'indépendance
    du Kosovo.), d'autre part, concernant une décision de ce conseil portant adoption
    de son règlement intérieur
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/1232 des Rates vom 18. Juli 2016 zur Festlegung des
    Standpunkts, der im Namen der Europäischen Union im Stabilitäts- und Assoziationsrat,
    der gemäß dem Stabilisierungs- und Assoziierungsabkommen zwischen der Europäischen
    Union und der Europäischen Atomgemeinschaft einerseits und dem Kosovo (Diese
    Bezeichnung berührt nicht die Standpunkte zum Status und steht im Einklang mit
    der Resolution 1244/1999 des VN-Sicherheitsrates und dem Gutachten des Internationalen
    Gerichtshofs zur Unabhängigkeitserklärung des Kosovo.) andererseits eingesetzt
    wurde, im Hinblick auf den Beschluss des Stabilitäts- und Assoziationsrates zur
    Annahme seiner Geschäftsordnung zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2016/1232 на Съвета от 18 юли 2016 година
    за определяне на позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвета за стабилизиране и асоцииране, създаден
    със Споразумението за стабилизиране и асоцииране
    между Европейския съюз и Европейската общност
    за атомна енергия, от една страна, и Косово
    (Това название не засяга позициите по отношение
    на статута и е съобразено с Резолюция 1244/1999
    на Съвета за сигурност на ООН и становището
    на Международния съд относно обявяването на
    независимост от страна на Косово.), от друга
    страна, по отношение на Решението на Съвета
    за стабилизиране и асоцииране за приемане
    на неговия процедурен правилник
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2016/1232 ze dne 18. července 2016 o postoji, který
    má být zaujat jménem Evropské unie v Radě stabilizace a přidružení zřízené
    Dohodou o stabilizaci a přidružení mezi Evropskou unií a Evropským společenstvím
    pro atomovou energii na jedné straně a Kosovem (Tímto označením nejsou dotčeny
    postoje k otázce statusu a označení je v souladu s rezolucí Rady bezpečnosti
    OSN 1244/1999 a se stanoviskem Mezinárodního soudního dvora k vyhlášení
    nezávislosti Kosova.) na straně druhé k rozhodnutí Rady stabilizace a přidružení,
    kterým se přijímá její jednací řád
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2016/1232 af 18. juli 2016 om den holdning, der
    skal indtages på Den Europæiske Unions vegne i det stabiliserings- og associeringsråd,
    der er oprettet ved stabiliserings- og associeringsaftalen mellem Den Europæiske
    Union og Det Europæiske Atomenergifællesskab på den ene side og Kosovo (Denne
    betegnelse indebærer ingen stillingtagen til Kosovos status, og den er i overensstemmelse
    med UNSCR 1244/1999 og ICJ's udtalelse om Kosovos uafhængighedserklæring.) på
    den anden side for så vidt angår stabiliserings- og associeringsrådets afgørelse
    om vedtagelse af dets forretningsorden
  type: main
- language: el
  script: Grek
