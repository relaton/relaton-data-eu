title:
- language: fr
  script: Latn
  content: Décision de la Commission relative aux recours de la République italienne
    et de la République fédérale d'Allemagne à l'article 115, alinéa 1, CEE,
    pour exclure du traitement communautaire certains ferro-alliages originaires de
    pays tiers et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Inanspruchnahme von Artikel 115 Absatz
    1 des Vertrages durch die Italienische Republik und die Bundesrepublik Deutschland,
    um bestimmte Ferrolegierungen, die aus dritten Ländern stammen und in den anderen
    Mitgliedstaaten in den freien Verkehr gebracht wurden, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa al ricorso della Repubblica Italiana
    e della Repubblica federale di Germania all'articolo 115, comma 1 del Trattato,
    per escludere dal trattamento comunitario talune ferroleghe originarie di paesi
    terzi e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende het beroep van de Italiaanse Republiek
    en van de Bondsrepubliek Duitsland op artikel 115, lid 1, van het EEG-Verdrag,
    om bepaalde ferrolegeringen die van oorsprong zijn uit derde landen en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
