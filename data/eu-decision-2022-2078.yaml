title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/2078 of 24 October 2022 on the position to be
    taken on behalf of the European Union within the International Maritime Organization’s
    Maritime Safety Committee during its 106th session and within the International
    Maritime Organization’s Marine Environment Protection Committee during its 79th
    session as regards the amendment of the International Convention for the Safety
    of Life at Sea (SOLAS), of the International Code on the Enhanced Programme of
    Inspections during Surveys of Bulk Carriers and Oil Tankers, 2011 (the ‘2011
    ESP Code’) and of Annex VI to the International Convention for the Prevention
    of Pollution from Ships (MARPOL)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2078 du Conseil du 24 octobre 2022 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité de la sécurité
    maritime de l’Organisation maritime internationale lors de sa 106e session et
    au sein du Comité de la protection du milieu marin de l’Organisation maritime
    internationale lors de sa 79e session en ce qui concerne les amendements à la
    convention internationale pour la sauvegarde de la vie humaine en mer (convention
    SOLAS), au recueil international sur le programme renforcé d’inspections à
    l’occasion des visites des vraquiers et des pétroliers, 2011 (recueil ESP de
    2011) et à l’annexe VI de la convention internationale pour la prévention
    de la pollution par les navires (convention MARPOL)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/2078 des Rates vom 24. Oktober 2022 über den Standpunkt,
    der im Namen der Europäischen Union in der Internationalen Seeschifffahrtsorganisation
    auf der 106. Tagung des Schiffssicherheitsausschusses und auf der 79. Tagung des
    Ausschusses für den Schutz der Meeresumwelt im Hinblick auf die Änderungen des
    Internationalen Übereinkommens zum Schutz des menschlichen Lebens auf See, des
    Internationalen Codes für das erweiterte Programm von Untersuchungen während
    der Besichtigung von Massengutschiffen und Öltankschiffen von 2011 und der Anlage
    VI zum Internationalen Übereinkommen zur Verhütung der Meeresverschmutzung durch
    Schiffe zu vertreten ist
