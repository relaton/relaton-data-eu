    herunder schappesilke eller bourettesilke, af vævet stof under varekategori 159
    (løbenummer 42.1590), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
