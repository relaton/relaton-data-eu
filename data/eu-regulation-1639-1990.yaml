  content: Commission Regulation (EEC) No 1639/90 of 15 June 1990 re-establishing
    the levying of customs duties on dresses, blouses and shirt-blouses of silk or
    of noil or of other waste silk, of textile fabric, products of category 159 (order
    No 42.1590), originating in China, to which the preferential tariffa arrangements
    set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1639/90 de la Commission du 15 juin 1990 portant rétablissement
    de la perception des droits de douane applicables aux robes, chemisiers, blouses-
    chemisiers et blouses de soie, de schappe ou de bourrette de la catégorie de
    produits n° 159 (numéro d'ordre 42.1590) originaires de la Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1639/90 DER KOMMISSION vom 15. Juni 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Kleider, Blusen und Hemdblusen aus Seide,
    Schappeseide oder Bourretteseide, aus Geweben der Warenkategorie Nr. 159 (laufende
    Nummer 42.1590) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3897/89
    des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
