    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1639/90 VAN DE COMMISSIE van 15 juni 1990 houdende
