title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/908 of 27 April 2026 amending
    Delegated Regulation (EU) 2021/630 as regards the private attestation requirements
    of the composite products exempted from official controls at border control posts,
    and the inclusion of certain cereal products, prepared or preserved vegetables,
    fruits, nuts, sauces, condiments, seasonings and confectionery in the list of
    exempted composite products
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/908 de la Commission du 27 avril 2026 modifiant
    le règlement délégué (UE) 2021/630 en ce qui concerne les exigences en matière
    d’attestation privée applicables aux produits composés exemptés des contrôles
    officiels aux postes de contrôle frontaliers et l’inscription de certains produits
    céréaliers, légumes, fruits et fruits à coque préparés ou conservés, sauces,
    condiments, assaisonnements et confiseries sur la liste des produits composés
    exemptés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/908 der Kommission vom 27. April 2026 zur
