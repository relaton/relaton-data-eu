    in Bezug auf die private Bestätigung für die von amtlichen Kontrollen an Grenzkontrollstellen
    ausgenommenen zusammengesetzten Erzeugnisse und der Aufnahme von bestimmten Getreideerzeugnissen,
    zubereitetem oder haltbar gemachtem Gemüse, Früchten, Nüssen, Soßen, Würzmitteln,
    Würzstoffen sowie Süßwaren in die Liste der ausgenommenen zusammengesetzten
    Erzeugnisse
  type: main
