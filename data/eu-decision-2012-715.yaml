    activités de contrôle et d’exécution respectives garantissent un niveau de
    protection de la santé publique équivalent à celui apporté par l’Union,
    conformément à la directive 2001/83/CE du Parlement européen et du Conseil'
  type: main
- language: de
  script: Latn
