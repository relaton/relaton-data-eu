id: EUDecision1978794
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 September 1978 authorizing the United Kingdom
    not to apply Community treatment to women's, girls' and infants' woven overcoats,
    raincoats and other coats, cloaks and capes, jackets and blazers, of wool, of
    cotton or of man-made textile fibres, falling within subheading ex 61.02 B of
    the Common Customs Tariff (NIMEXE codes 61.02-31, 32, 33, 35, 36, 37, 39, 40),
    originating in Yugoslavia and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/794/CEE: Décision de la Commission, du 14 septembre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes, tissés pour femmes, fillettes et jeunes enfants,
    de laine, de coton ou de fibres textiles synthétiques ou artificielles, de la
    sous-position Ex 61.02 B du Tarif douanier commun (codes Nimexe 61.02-31, 32,
    33, 35, 36, 37, 39, 40) originaires de Yougoslavie et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. September 1978, mit der das Vereinigte
    Königreich ermächtigt wird, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel, Umhänge und Jacken aus Geweben für Frauen,
    Mädchen und Kleinkinder, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.02-31; 32; 33; 35; 36; 37; 39; 40) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 14. september 1978 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker
    og blazere, vævede, til kvinder, piger og småbørn, herunder varer af uld, bomuld
    eller kemofibre, som henhører under pos. ex 61.02 B i den fælles toldtarif (NIMEXE-kode
    61.02-31, 32, 33, 35, 36, 37, 39, 40), har oprindelse i Jugoslavien og frit kan
    omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 14 settembre 1978, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli e
    simili e giacche, tessuti per donna, per ragazza e per bambini, di lana, di cotone
    o di fibre tessili sintetiche o artificiali della sottovoce ex 61.02 B della tariffa
    doganale comune (codice Nimexe: 61.02-31; 32; 33; 35; 36; 37; 39; 40), originari
    della Iugoslavia e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 september 1978 waarbij het Verenigd
    Koninkrijk wordt gemachtigd mantels, regenjassen en andere jassen, capes, blazers
    en jasjes, geweven van wol, van katoen of van synthetische of van kunstmatige
    textielvezels, van post ex 61.02 B van het gemeenschappelijke douanetarief (NIMEXE-code
    61.02-31, 32, 33, 35, 36, 37, 39, 40), van oorsprong uit Joegoslavië en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
