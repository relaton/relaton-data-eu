title:
- language: fr
  script: Latn
  content: 'Décision de la Commission, du 19 décembre 1968, portant augmentation
    du volume du contingent tarifaire octroyé à la République italienne pour les
    graines de betteraves à sucre, des variétés: "Eagle Hill", "Maribo", Buszczinski",
    "Janaz" et "Saroz" (position Ex 12.03 A du TDC)'
  type: main
- language: de
  script: Latn
  content: '69/16/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Erhöhung des der Italienischen Republik gewährten Zollkontingents für Zuckerrübensamen
    der Sorten "Eagle Hill", "Maribo", "Buszczinski", "Janaz" und "Saroz" (Tarifnummer
    ex 12.03 A des Gemeinsamen Zolltarifs)'
  type: main
- language: it
  script: Latn
  content: '69/16/CEE: Decisione della Commissione, del 19 dicembre 1968, relativa
    all''aumento del contingente tariffario concesso alla Repubblica italiana per
    semi di barbabietola da zucchero, delle varietà: Eagle Hill, Maribo, Buszczinski,
    Janaz e Saroz (sottovoce ex 12.03 A della tariffa doganale comune)'
  type: main
- language: nl
  script: Latn
  content: '69/16/EEG: Beschikking van de Commissie van 19 december 1968 houdende
    vergroting van het aan de Italiaanse Republiek toegekende tariefcontingent voor
