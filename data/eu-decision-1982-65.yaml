    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/65/EEG: Beschikking van de Commissie van 21 december 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Becton Dickinson-Fluorescence Activated
    Cell Sorter, FACS IV" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
