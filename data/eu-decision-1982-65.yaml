title:
- language: en
  script: Latn
  content: '82/65/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''Becton Dickinson-fluorescence-activated cell sorter,
    FACS IV'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/65/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "Becton Dickinson-Fluorescence Activated
    Cell Sorter, FACS IV" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/65/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,BECTON DICKINSON-Fluorescence Activated Cell
    Sorter, FACS IV" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/65/EØF: Kommissionens beslutning af 21. december 1981 om fastslåelse
    af, at indførsel af apparatet "Becton Dickinson-fluorescence Activated Cell Sorter,
    FACS IV" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
