  content: Council Regulation (EU) 2016/907 of 9 June 2016 repealing Regulation (EC)
    No 174/2005 imposing restrictions on the supply of assistance related to military
    activities to Côte d'Ivoire and Regulation (EC) No 560/2005 imposing certain
    specific restrictive measures directed against certain persons and entities in
    view of the situation in Côte d'Ivoire
  type: main
- language: fr
  script: Latn
