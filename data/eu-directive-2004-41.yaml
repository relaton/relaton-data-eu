  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2004/41/EÜ, 21. aprill 2004,
    millega tunnistatakse kehtetuks teatavad direktiivid, mis käsitlevad teatavate
    inimtoiduks ettenähtud loomse päritoluga toodete tootmise ja turuleviimise toiduhügieeni
    ning tervishoiunõudeid, ja muudetakse nõukogu direktiive 89/662/EMÜ ja 92/118/EMÜ
    ning nõukogu otsust 95/408/EÜ
  type: main
- language: fi
  script: Latn
  content: EUROOPAN PARLAMENTIN JA NEUVOSTON DIREKTIIVI 2004/41/EY, ANNETTU 21 PÄIVÄNÄ
    HUHTIKUUTA 2004, IHMISRAVINNOKSI TARKOITETTUJEN TIETTYJEN ELÄINPERÄISTEN TUOTTEIDEN
    TUOTANTOA JA MARKKINOILLE SAATTAMISTA KOSKEVISTA ELINTARVIKEHYGIENIA- JA TERVEYSSÄÄNNÖISTÄ
    ANNETTUJEN TIETTYJEN DIREKTIIVIEN KUMOAMISESTA SEKÄ NEUVOSTON DIREKTIIVIEN 89/662/ETY
    JA 92/118/ETY JA NEUVOSTON PÄÄTÖKSEN 95/408/EY MUUTTAMISESTA
  type: main
- language: hr
  script: Latn
  content: Direktiva 2004/41/EZ Europskog parlamenta i Vijeća od 21. travnja 2004.
    o stavljanju izvan snage određenih direktiva o higijeni hrane i zdravstvenim
    uvjetima za stavljanje na tržište određenih proizvoda životinjskog podrijetla
    namijenjenih za prehranu ljudi te o izmjeni direktiva Vijeća 89/662/EEZ i 92/118/EEZ
    i Odluke Vijeća 95/408/EZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2004/41/EK irányelve (2004. április
    21.) az emberi fogyasztásra szánt egyes állati eredetű termékek előállítására
    és forgalomba hozatalára vonatkozó élelmiszer-higiéniai és állat-egészségügyi
    feltételekről szóló egyes irányelvek hatályon kívül helyezéséről, valamint
    a 89/662/EGK és a 92/118/EGK tanácsi irányelv és a 95/408/EK tanácsi határozat
    módosításáról
  type: main
- language: it
  script: Latn
  content: DIRETTIVA 2004/41/CE DEL PARLAMENTO EUROPEO E DEL CONSIGLIO DEL 21 APRILE
    2004 CHE ABROGA ALCUNE DIRETTIVE RECANTI NORME SULL'IGIENE DEI PRODOTTI ALIMENTARI
    E LE DISPOSIZIONI SANITARIE PER LA PRODUZIONE E LA COMMERCIALIZZAZIONE DI DETERMINATI
    PRODOTTI DI ORIGINE ANIMALE DESTINATI AL CONSUMO UMANO E CHE MODIFICA LE DIRETTIVE
    89/662/CEE DEL CONSIGLIO E 92/118/CEE E LA DECISIONE 95/408/CE DEL CONSIGLIO
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2004/41/EK (2004. gada 21. aprīlis),
    ar ko atceļ dažas direktīvas par pārtikas higiēnu un dzīvnieku veselības
    nosacījumiem attiecībā uz dažu lietošanai pārtikā paredzētu dzīvnieku
    izcelsmes produktu ražošanu un laišanu tirgū un groza Padomes Direktīvas
    89/622/EEK un 92/118/EK un Padomes Lēmumu 95/408/EK
  type: main
- language: lt
  script: Latn
  content: 2004 m. balandžio 21 d. Europos Parlamento ir Tarybos direktyva 2004/41/EB,
    panaikinanti tam tikras direktyvas dėl tam tikrų žmonėms skirtų gyvūninės
    kilmės produktų gamybos ir pateikimo į rinką maisto higienos ir sveikatos
    sąlygų ir iš dalies keičianti Tarybos direktyvas 89/662/EEB ir 92/118/EB bei
    Tarybos sprendimą 95/408/EB
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2004/41/KE tal-Parlament Ewropew u tal-Kunsill tal-21 ta'
    April 2004 li tirrevoka ċerti direttivi rigward iġene ta' l-ikel u kondizzjonijiet
    ta' saħħa għall-produzzjoni u sabiex ikun mqiegħda fis-suq ċerti prodotti
    li joriġinaw mill-annimali intżi li għall-konsum mill-bniedem u li temenda
    d-Direttiva tal-Kunsill 89/662/KEE u 92/118/KEE u Deċiżjoni tal-Kunsill Nru
    95/408/KE
  type: main
- language: nl
  script: Latn
  content: RICHTLIJN 2004/41/EG VAN HET EUROPEES PARLEMENT EN DE RAAD VAN 21 APRIL
    2004 HOUDENDE INTREKKING VAN BEPAALDE RICHTLIJNEN INZAKE LEVENSMIDDELENHYGIËNE
    EN TOT VASTSTELLING VAN GEZONDHEIDSVOORSCHRIFTEN VOOR DE PRODUCTIE EN HET IN DE
    HANDEL BRENGEN VAN BEPAALDE VOOR MENSELIJKE CONSUMPTIE BESTEMDE PRODUCTEN VAN
    DIERLIJKE OORSPRONG, EN TOT WIJZIGING VAN DE RICHTLIJNEN 89/662/EEG EN 92/118/EEG
    VAN DE RAAD EN VAN BESCHIKKING 95/408/EG VAN DE RAAD
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2004/41/WE Parlamentu Europejskiego i Rady z dnia 21 kwietnia
    2004 r. uchylająca niektóre dyrektywy dotyczące higieny i warunków zdrowia
    przy produkcji i wprowadzaniu do obrotu niektórych produktów pochodzenia zwierzęcego
    przeznaczonych do spożycia przez ludzi i zmieniająca dyrektywy Rady 89/662/EWG
    i 92/118/EWG oraz decyzję Rady 95/408/WE
  type: main
- language: pt
  script: Latn
  content: DIRECTIVA 2004/41/CE DO PARLAMENTO EUROPEU E DO CONSELHO DE 21 DE ABRIL
    DE 2004 QUE REVOGA CERTAS DIRECTIVAS RELATIVAS À HIGIENE DOS GÉNEROS ALIMENTÍCIOS
    E ÀS REGRAS SANITÁRIAS APLICÁVEIS À PRODUÇÃO E À COMERCIALIZAÇÃO DE DETERMINADOS
    PRODUTOS DE ORIGEM ANIMAL DESTINADOS AO CONSUMO HUMANO E ALTERA AS DIRECTIVAS
    89/662/CEE E 92/118/CEE DO CONSELHO E A DECISÃO 95/408/CE DO CONSELHO
  type: main
- language: ro
  script: Latn
  content: Directiva 2004/41/CE a Parlamentului European și a Consiliului din 21
    aprilie 2004 de abrogare a unor directive privind igiena alimentară și normele
    sanitar-veterinare referitoare la producția și comercializarea anumitor produse
    de origine animală destinate consumului uman și de modificare a Directivelor
    89/662/CEE și 92/118/CEE ale Consiliului, precum și a Deciziei 95/408/CE a Consiliului
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2004/41/ES z 21. apríla 2004, ktorou
    sa zrušujú určité smernice týkajúce sa hygieny potravín a zdravotných
    podmienok výroby a uvádzania určitých produktov živočíšneho pôvodu určených
    pre ľudskú spotrebu na trh a ktorou sa menia a dopĺňajú smernice Rady 89/662/EHS
    a 92/118/EHS a rozhodnutie Rady 95/408/ES
  type: main
- language: sl
  script: Latn
  content: Direktiva Evropskega parlamenta in Sveta 2004/41/ES z dne 21. aprila 2004
    o razveljavitvi nekaterih direktiv o higieni živil in zdravstvenih pogojih za
    proizvodnjo in dajanje na trg nekaterih proizvodov živalskega izvora, namenjenih
    za prehrano ljudi, in o spremembi direktiv Sveta 89/662/EGS in 92/118/EGS in Odločbe
    Sveta 95/408/ES
  type: main
- language: es
  script: Latn
  content: DIRECTIVA 2004/41/CE DEL PARLAMENTO EUROPEO Y DEL CONSEJO DE 21 DE ABRIL
    DE 2004 POR LA QUE SE DEROGAN DETERMINADAS DIRECTIVAS QUE ESTABLECEN LAS CONDICIONES
    DE HIGIENE DE LOS PRODUCTOS ALIMENTICIOS Y LAS CONDICIONES SANITARIAS PARA LA
    PRODUCCIÓN Y COMERCIALIZACIÓN DE DETERMINADOS PRODUCTOS DE ORIGEN ANIMAL DESTINADOS
    AL CONSUMO HUMANO Y SE MODIFICAN LAS DIRECTIVAS 89/662/CEE Y 92/118/CEE DEL CONSEJO
    Y LA DECISIÓN 95/408/CE DEL CONSEJO
  type: main
- language: sv
  script: Latn
  content: EUROPAPARLAMENTETS OCH RÅDETS DIREKTIV 2004/41/EG AV DEN 21 APRIL 2004
    OM UPPHÄVANDE AV VISSA DIREKTIV OM LIVSMEDELSHYGIEN OCH HYGIENKRAV FÖR TILLVERKNING
    OCH UTSLÄPPANDE PÅ MARKNADEN AV VISSA PRODUKTER AV ANIMALISKT URSPRUNG AVSEDDA
    ATT ANVÄNDAS SOM LIVSMEDEL OCH OM ÄNDRING AV RÅDETS DIREKTIV 89/662/EEG OCH
    92/118/EEG SAMT RÅDETS BESLUT 95/408/EG
  type: main
