  content: DIRECTIVE 2004/41/EC OF THE EUROPEAN PARLIAMENT AND OF THE COUNCIL OF 21
    APRIL 2004 REPEALING CERTAIN DIRECTIVES CONCERNING FOOD HYGIENE AND HEALTH CONDITIONS
    FOR THE PRODUCTION AND PLACING ON THE MARKET OF CERTAIN PRODUCTS OF ANIMAL ORIGIN
    INTENDED FOR HUMAN CONSUMPTION AND AMENDING COUNCIL DIRECTIVES 89/662/EEC AND
    92/118/EEC AND COUNCIL DECISION 95/408/EC
  type: main
- language: fr
  script: Latn
  content: DIRECTIVE 2004/41/CE DU PARLEMENT EUROPÉEN ET DU CONSEIL DU 21 AVRIL 2004
    ABROGEANT CERTAINES DIRECTIVES RELATIVES À L'HYGIÈNE DES DENRÉES ALIMENTAIRES
    ET AUX RÈGLES SANITAIRES RÉGISSANT LA PRODUCTION ET LA MISE SUR LE MARCHÉ DE
    CERTAINS PRODUITS D'ORIGINE ANIMALE DESTINÉS À LA CONSOMMATION HUMAINE, ET MODIFIANT
    LES DIRECTIVES 89/662/CEE ET 92/118/CEE DU CONSEIL AINSI QUE LA DÉCISION 95/408/CE
    DU CONSEIL
  type: main
- language: de
  script: Latn
  content: RICHTLINIE 2004/41/EG DES EUROPÄISCHEN PARLAMENTS UND DES RATES VOM 21.
    APRIL 2004 ZUR AUFHEBUNG BESTIMMTER RICHTLINIEN ÜBER LEBENSMITTELHYGIENE UND
    HYGIENEVORSCHRIFTEN FÜR DIE HERSTELLUNG UND DAS INVERKEHRBRINGEN VON BESTIMMTEN,
    ZUM MENSCHLICHEN VERZEHR BESTIMMTEN ERZEUGNISSEN TIERISCHEN URSPRUNGS SOWIE ZUR
    ÄNDERUNG DER RICHTLINIEN 89/662/EWG UND 92/118/EWG DES RATES UND DER ENTSCHEIDUNG
    95/408/EG DES RATES
  type: main
- language: bg
  script: Cyrl
  content: Директива 2004/41/ЕО на Европейския парламент
    и на Съвета от 21 април 2004 година за отмяна на
    някои директиви, отнасящи се до хигиената на
    хранитe и здравните условия при производството
    и пускането на пазара на някои продукти от
    животински произход, предназначени за консумация
    от човека, и за изменение на Директиви 89/662/ЕИО
    и 92/118/ЕИО на Съвета и на Решение 95/408/ЕО на Съвета
  type: main
- language: cs
  script: Latn
  content: Směrnice evropského parlamentu a Rady 2004/41/ES ze dne 21. dubna 2004,
    kterou se zrušují některé směrnice týkající se hygieny potravin a hygienických
    podmínek pro produkci některých produktů živočišného původu určených
    k lidské spotřebě a pro jejich uvádění na trh a kterou se mění směrnice
    Rady 89/662/EHS a 92/118/EHS a rozhodnutí Rady 95/408/ES
  type: main
- language: da
  script: Latn
  content: EUROPA-PARLAMENTETS OG RÅDETS DIREKTIV 2004/41/EF AF 21. APRIL 2004 OM
    OPHÆVELSE AF VISSE DIREKTIVER OM LEVNEDSMIDDELHYGIEJNE OG SUNDHEDSBETINGELSER
    FOR PRODUKTION OG AFSÆTNING AF VISSE ANIMALSKE PRODUKTER TIL KONSUM OG OM ÆNDRING
    AF RÅDETS DIREKTIV 89/662/EØF OG 92/118/EØF OG RÅDETS AFGØRELSE 95/408/EF
  type: main
- language: el
  script: Grek
