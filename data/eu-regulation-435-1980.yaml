title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 435/80 of 18 February 1980 on the arrangements
    applicable to agricultural products and certain goods resulting from the processing
    of agricultural products originating in the African, Caribbean and Pacific States
    and the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 435/80 du Conseil, du 18 février 1980, relatif au
    régime applicable à des produits agricoles et à certaines marchandises résultant
    de la transformation de produits agricoles originaires des États d' Afrique,
    des Caraïbes et du Pacifique ou des pays et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 435/80 des Rates vom 18. Februar 1980 über die Regelung
    für landwirtschaftliche Erzeugnisse und bestimmte aus landwirtschaftlichen Erzeugnissen
    hergestellte Waren mit Ursprung in den Staaten in Afrika, im karibischen Raum
    und im Pazifischen Ozean oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 435/80 af 18. februar 1980 om den ordning,
    der skal gælde for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 435/80 τού Συμβουλίου
    τής 18ης Φεβρουαρίου 1980 περί τού καθεστώτος
    πού εφαρμόζεται σέ γεωργικά προϊόντα καί σέ
    ορισμένα εμπορεύματα τά οποία προκύπτουν από
    τή μεταποίηση γεωργικών προϊόντων καταγωγής
    χωρών Αφρικής, Καραϊβικής καί Ειρηνικού ή Υπερποντίων
    Χωρών καί Εδαφών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 435/80 del Consiglio, del 18 febbraio 1980, relativo
    al regime applicabile a taluni prodotti agricoli e a talune merci risultanti dalla
    trasformazione di prodotti agricoli, originari degli Stati dell' Africa, dei Caraibi
    e del Pacifico o dei paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 435/80 van de Raad van 18 februari 1980 inzake de
    regeling voor landbouwprodukten en bepaalde door verwerking van landbouwprodukten
    verkregen goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied
    en de Stille Oceaan of uit de landen en gebieden overzee
  type: main
