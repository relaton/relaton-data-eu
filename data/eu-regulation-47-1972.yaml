title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 47/72 de la Commission, du 7 janvier 1972, fixant
    les montants compensatoires valables à partir du 3 janvier 1972 pour les marchandises
    relevant du règlement (CEE) n° 1059/69 à la suite de l'élargissement temporaire
    des marges de fluctuation des monnaies des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 47/72 der Kommission vom 7. Januar 1972 zur Festsetzung
    der ab 3. Januar 1972 geltenden Ausgleichsbeträge für die unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren im Anschluß an die vorübergehende Erweiterung
    der Bandbreiten der Währungen der Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 47/72 della Commissione, del 7 gennaio 1972, che fissa
    gli importi di compensazione valevoli a partire dal 3 gennaio 1972 per le merci
    comprese nel regolamento (CEE) n. 1059/69 in seguito all'ampliamento temporaneo
    dei margini di fluttuazione delle monete di alcuni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 47/72 van de Commissie van 7 januari 1972 houdende
    vaststelling van de compenserende bedragen voor de produkten vallende onder Verordening
    (EEG) nr. 1059/69, geldend met ingang van 3 januari 1972, naar aanleiding van
    de tijdelijke verruiming van de fluctuatiemarges van de valuta's van Lid-Staten
  type: main
