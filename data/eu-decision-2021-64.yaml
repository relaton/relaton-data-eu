    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένη σόγια
    SYHT0H2 (SYN-ØØØH2-5), σύμφωνα με τον κανονισμό (ΕΚ)
    αριθ. 1829/2003 του Ευρωπαϊκού Κοινοβουλίου και
    του Συμβουλίου [κοινοποιηθείσα υπό τον αριθμό
    C(2021) 266] (Τα κείμενα στη γαλλική και την ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/64, 22. jaanuar 2021, millega lubatakse
    turule lasta geneetiliselt muundatud sojauba SYHT0H2 (SYN-ØØØH2-5) sisaldavaid,
    sellest koosnevaid või sellest toodetud tooteid vastavalt Euroopa Parlamendi
    ja nõukogu määrusele (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2021) 266
    all) (Ainult hollandi- ja prantsuskeelne tekst on autentsed)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/64, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä soijaa SYHT0H2 (SYN-ØØØH2-5) sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamisen
    sallimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti
    (tiedoksiannettu numerolla C(2021) 266) (Ainoastaan hollannin- ja ranskankieliset
    tekstit ovat todistusvoimaisia)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/64 оd 22. siječnja 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificiranu soju
    SYHT0H2 (SYN-ØØØH2-5) ili se sastoje ili su proizvedeni od nje na temelju Uredbe
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2021) 266) (Vjerodostojan je samo tekst na nizozemskom i francuskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/64 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított SYHT0H2 (SYN-ØØØH2-5) szójababot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2021) 266. számú dokumentummal történt) (Csak a holland
    és a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/64 della Commissione del 22 gennaio 2021
    che autorizza l'immissione in commercio di prodotti contenenti, costituiti o derivati
    da soia geneticamente modificata SYHT0H2 (SYN-ØØØH2-5) in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2020) 266] (I testi in lingua francese e neerlandese sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/64 (2021. gada 22. janvāris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto soju SYHT0H2 (SYN-ØØØH2-5),
    no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta numuru C(2021)
    266) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/64 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų sojų
    SYHT0H2 (SYN-ØØØH2-5), kurie iš jų sudaryti arba pagaminti (pranešta dokumentu
    Nr. C (2021) 266) (Tekstas autentiškas tik nyderlandų ir prancūzų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/64 tat-22
    ta’ Jannar 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu minn, jew li huma prodotti, mill-fażola tas-sojja modifikata ġenetikament
    SYHT0H2 (SYN-ØØØH2-5) skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill (notifikata bid-dokument C(2021) 266) (It-testi bl-Olandiż
    u bil-Franċiż biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/64 van de Commissie van 22 januari 2021 tot
