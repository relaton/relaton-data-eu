    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną soję
    SYHT0H2 (SYN-ØØØH2-5), składających się z niej lub z niej wyprodukowanych
