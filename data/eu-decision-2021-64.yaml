  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/64 a Comisiei din 22 ianuarie
    2021 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din soia modificată genetic SYHT0H2 (SYN-ØØØH2-5),
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2021) 266] (Numai textele în limbile franceză
    și neerlandeză sunt autentice)
  type: main
