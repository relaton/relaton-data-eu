  script: Latn
  content: Decisão de Execução (EU) 2021/64 da Comissão de 22 de janeiro de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de soja geneticamente modificada SYHT0H2 (SYN-ØØØH2-5),
    nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho
