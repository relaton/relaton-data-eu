    of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    soja SYHT0H2 (SYN-ØØØH2-5) overeenkomstig Verordening (EG) nr. 1829/2003 van
    het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2021)
    266) (Slechts de teksten in de Nederlandse en de Franse taal zijn authentiek)
  type: main
