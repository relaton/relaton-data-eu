    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú sóju SYHT0H2
    (SYN-ØØØH2-5), sú z nej zložené alebo vyrobené [oznámené pod číslom
    C(2021)266] (Iba francúzske a holandské znenie je autentické)
  type: main
