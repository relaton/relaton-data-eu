id: EUDecision202164
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/64 of 22 January 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean SYHT0H2 (SYN-ØØØH2-5), pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2021) 266) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/64 de la Commission du 22 janvier 2021
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié SYHT0H2 (SYN-ØØØH2-5), consistant en ce soja ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 266] (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/64 der Kommission vom 22. Januar 2021
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Sojabohnen der Sorte SYHT0H2 (SYN-ØØØH2-5) enthalten, aus ihnen bestehen oder
    aus ihnen hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 266) (Nur
    der französische und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/64 на Комисията
    от 22 януари 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    соя SYHT0H2 (SYN-ØØØH2-5), съгласно Регламент (ЕО) №
    1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2021) 266) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/64, ze dne 22. ledna 2021 o povolení
    uvedení produktů, které obsahují geneticky modifikovanou sóju SYHT0H2 (SYN-ØØØH2-5),
    sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení Evropského
    parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2021) 266) (Pouze
    nizozemské a francouzské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/64 af 22. januar 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret SYHT0H2-sojabønne (SYN-ØØØH2-5), i
    henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt
    under nummer C(2021) 266) (Kun den nederlandske og den franske udgave er autentiske)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/64 της Επιτροπής
