title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1401/82 of 4 June 1982 re-establishing the
    levying of customs duties on antimony oxides, falling within subheading 28.28
    ex N and originating in Bolivia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 applyr
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1401/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables aux oxydes d'
    antimoine de la sous-position 28.28 ex N du tarif douanier commun, originaires
    de Bolivie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1401/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Antimonoxide der Tarifstelle 28.28 ex N, mit Ursprung
    in Bolivien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1401/82 af 4. juni 1982 om genindførelse
    af opkrævning af told for antimonoxider, henhørende under pos. 28.28 ex N og
    med oprindelse i Bolivia, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1401/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά οξείδια αντιμονίου
    τής διακρίσεως 28. 28 ex N τού Κοινού Δασμολογίου,
    καταγωγής Βολιβίας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1401/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli ossidi di antimonio
    della sottovoce 28.28 ex N della tariffa doganale comune, originari della Bolivia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consigliod
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1401/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op antimoonoxyden
    van postonderverdeling 28.28 ex N, van oorsprong uit Bolivia, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
