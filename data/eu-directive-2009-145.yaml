    видове и сортове, които са традиционно отглеждани
    в определени местности и райони и са застрашени
    от генетична ерозия, и на зеленчукови сортове
    без истинска стойност за производството на
    търговски култури, но развивани с цел отглеждане
    при специални условия, както и относно търговията
    със семена от посочените местни видове и сортове
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2009/145/ES ze dne 26. listopadu 2009 , kterou se stanovují
    některé odchylky pro povolování krajových odrůd zeleniny a odrůd zeleniny,
    které se tradičně pěstují v určitých místech a oblastech a jsou ohroženy
    genetickou erozí, a odrůd zeleniny, které samy o sobě nemají hodnotu pro
