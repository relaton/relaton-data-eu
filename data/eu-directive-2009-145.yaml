    kas ir tradicionāli audzētas noteiktos apvidos un reģionos un ko apdraud ģenētiskā
    erozija, un tādu dārzeņu šķirņu atzīšanu, kam nav būtiskas vērtības
    attiecībā uz komerciālu augkopību, bet kas ir izveidotas audzēšanai noteiktos
    apstākļos un šo savvaļas sugu un šķirņu sēklu tirdzniecībai
  type: main
