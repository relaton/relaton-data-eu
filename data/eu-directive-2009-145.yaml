  script: Latn
  content: Dyrektywa Komisji 2009/145/WE z dnia 26 listopada 2009 r. przewidująca
    pewne odstępstwa w odniesieniu do zatwierdzania populacji miejscowych i odmian
    warzyw tradycyjnie uprawianych w poszczególnych miejscach i regionach i zagrożonych
    erozją genetyczną oraz odmian warzyw niemających wewnętrznej wartości dla
