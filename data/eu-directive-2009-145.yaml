    odstopanj za sprejetje domačih sort in sort zelenjadnic, ki se tradicionalno
    gojijo v posebnih krajih in regijah in so ogrožene zaradi genske erozije, in
    sort zelenjadnic, ki nimajo resnične vrednosti za komercialno pridelavo, ampak
