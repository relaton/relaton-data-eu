    e outras variedades tradicionalmente cultivadas em determinadas localidades e
    regiões e ameaçadas pela erosão genética e de variedades de produtos agrícolas
    sem valor intrínseco para uma produção vegetal comercial, mas desenvolvidas
    para cultivo em determinadas condições, e à comercialização de sementes dessas
    variedades autóctones e outras variedades
  type: main
- language: ro
  script: Latn
  content: Directiva 2009/145/CE a Comisiei din 26 noiembrie 2009 de stabilire a anumitor
    derogări pentru acceptarea varietăților primitive și a soiurilor de legume
    care sunt cultivate, în mod tradițional, în localități și regiuni speciale
    și care sunt amenințate de erodare genetică și a soiurilor de legume lipsite
    de valoare intrinsecă pentru producția vegetală comercială, dar create pentru
    a fi cultivate în condiții speciale, precum și pentru comercializarea semințelor
    acestor varietăți primitive și soiuri
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2009/145/ES z 26. novembra 2009 , ktorou sa stanovujú
