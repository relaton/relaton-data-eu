    za priznavanje tradicijskih sorti povrća i sorti povrća koje se tradicionalno
    uzgajaju u određenim područjima i regijama i kojima prijeti genetska erozija
    i sorti povrća bez stvarne vrijednosti za komercijalnu proizvodnju, ali razvijenih
    za uzgoj pri određenim uvjetima i za stavljanje na tržište sjemena navedenih
    tradicijskih sorti i sorti povrća
  type: main
