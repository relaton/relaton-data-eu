  script: Latn
  content: Richtlijn 2009/145/EG van de Commissie van 26 november 2009 tot vaststelling
    van bepaalde afwijkingen voor de toelating van landrassen en rassen van groenten
    die van oudsher op bepaalde plaatsen en in bepaalde gebieden worden gekweekt en
