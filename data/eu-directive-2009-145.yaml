    honos zöldségfajok és fajták, illetve a kereskedelmi növénytermesztési
    szempontból tényleges értékkel nem rendelkező, csupán bizonyos feltételek
    melletti termesztésre nemesített zöldségek fajtáinak elismerése, és ezen
    honos fajok és fajták vetőmagjának forgalmazása esetében alkalmazható eltérésekről
  type: main
