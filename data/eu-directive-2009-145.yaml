title:
- language: en
  script: Latn
  content: Commission Directive 2009/145/EC of 26 November 2009 providing for certain
    derogations, for acceptance of vegetable landraces and varieties which have been
    traditionally grown in particular localities and regions and are threatened by
    genetic erosion and of vegetable varieties with no intrinsic value for commercial
    crop production but developed for growing under particular conditions and for
    marketing of seed of those landraces and varieties
  type: main
- language: fr
  script: Latn
  content: Directive 2009/145/CE de la Commission du 26 novembre 2009 introduisant
    certaines dérogations pour l’admission des races primitives et variétés de
    légumes traditionnellement cultivées dans des localités et régions spécifiques
    et menacées d’érosion génétique, et des variétés de légumes sans valeur
    intrinsèque pour la production commerciale mais créées en vue de répondre
    à des conditions de culture particulières, ainsi que pour la commercialisation
    de semences de ces races primitives et variétés
  type: main
- language: de
  script: Latn
  content: Richtlinie 2009/145/EG der Kommission vom 26. November 2009 mit Ausnahmeregelungen
    für die Zulassung von Gemüselandsorten und anderen Sorten, die traditionell
    an besonderen Orten und in besonderen Regionen angebaut werden und von genetischer
    Erosion bedroht sind, sowie von Gemüsesorten, die an sich ohne Wert für den
    Anbau zu kommerziellen Zwecken sind, aber für den Anbau unter besonderen Bedingungen
    gezüchtet werden, sowie für das Inverkehrbringen von Saatgut dieser Landsorten
    und anderen Sorten
  type: main
- language: bg
  script: Cyrl
  content: Директива 2009/145/ЕО на Комисията от 26 ноември
