  script: Latn
  content: Direttiva 2009/145/CE della Commissione, del 26 novembre 2009 , che prevede
    talune deroghe per l’ammissione di ecotipi e varietà vegetali tradizionalmente
    coltivati in particolari località e regioni e minacciati dall’erosione genetica,
    nonché di varietà vegetali prive di valore intrinseco per la produzione vegetale
    a fini commerciali ma sviluppate per la coltivazione in condizioni particolari
    e per la commercializzazione di sementi di tali ecotipi e varietà
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2009/145/EK ( 2009. gada 26. novembris), ar ko paredz
