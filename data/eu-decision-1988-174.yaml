    to BUG- Alutechnik GmbH, an undertaking producing semi-finished and finished aluminium
    products (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/174/CEE: Décision de la Commission du 17 novembre 1987 concernant
