    koskemaan sellaisen biodieselseoksen tuontia, jossa on enintään 20 painoprosenttia
    biodieseliä, ja tutkimuksen päättämisestä Singaporesta lähetetyn tuonnin
    osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Vijeća (EU) br. 443/2011 od 5. svibnja 2011. o proširenju
    konačne kompenzacijske pristojbe uvedene Uredbom (EZ) br. 598/2009 na uvoz biodizela
    podrijetlom iz Sjedinjenih Američkih Država na uvoz biodizela koji je otpremljen
    iz Kanade, bez obzira je li deklariran kao podrijetlom iz Kanade ili ne, i o produljenju
    konačne kompenzacijske pristojbe uvedene Uredbom (EZ) br. 598/2009 na uvoz biodizela
    u mješavini s masenim udjelom biodizela od 20 % ili manjim podrijetlom iz Sjedinjenih
    Američkih Država, te o prekidu ispitnog postupka u vezi uvoza otpremljenog iz
    Singapura
  type: main
- language: hu
  script: Latn
  content: A Tanács 443/2011/EU végrehajtási rendelete ( 2011. május 5. ) az 598/2009/EK
    rendelettel kivetett, az Egyesült Államokból származó biodízel behozatalára
    vonatkozó végleges kiegyenlítő vámnak a Kanadában feladott biodízel behozatalára
    – függetlenül attól, hogy Kanadából származóként jelentették-e be –
    történő kiterjesztéséről, az 598/2009/EK rendelettel kivetett végleges
    kiegyenlítő vámnak az Egyesült Államokból származó, legfeljebb 20 tömegszázalék
    biodízelt tartalmazó keverékben előforduló biodízel behozatalára történő
    kiterjesztéséről, valamint a Szingapúrban feladott behozatalokra vonatkozó
    vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 443/2011 del Consiglio, del 5 maggio
    2011 , che estende il dazio compensativo definitivo istituito dal regolamento
    (CE) n. 598/2009 sulle importazioni di biodiesel originario degli Stati Uniti
    d’America alle importazioni di biodiesel spedito dal Canada, a prescindere dal
    fatto che venga dichiarato originario del Canada o no, e che estende il dazio
    compensativo definitivo istituito dal regolamento (CE) n. 598/2009 alle importazioni
    di biodiesel in miscela contenente in peso il 20 % o meno di biodiesel originario
    degli Stati Uniti d’America, e chiude l’inchiesta riguardante le importazioni
    spedite da Singapore
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 443/2011 ( 2011. gada 5. maijs ),
    ar ko galīgo kompensācijas maksājumu, kurš ar Regulu (EK) Nr. 598/2009 noteikts
    Amerikas Savienoto Valstu izcelsmes biodīzeļdegvielas importam, piemēro arī
    biodīzeļdegvielas importam, kas sūtīts no Kanādas un kam ir vai nav deklarēta
    izcelsme Kanādā, ar ko importētai biodīzeļdegvielai maisījumā, kurā Amerikas
    Savienoto Valstu izcelsmes biodīzeļdegvielas saturs nepārsniedz 20 masas %,
    piemēro arī galīgo kompensācijas maksājumu, kas noteikts ar Regulu (EK) Nr.
    598/2009, un ar ko izbeidz izmeklēšanu par importu, kas sūtīts no Singapūras
  type: main
- language: lt
  script: Latn
  content: 2011 m. gegužės 5 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 443/2011,
