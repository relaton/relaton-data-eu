title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 443/2011 of 5 May 2011 extending
    the definitive countervailing duty imposed by Regulation (EC) No 598/2009 on imports
    of biodiesel originating in the United States of America to imports of biodiesel
    consigned from Canada, whether declared as originating in Canada or not, and extending
    the definitive countervailing duty imposed by Regulation (EC) No 598/2009 to imports
    of biodiesel in a blend containing by weight 20 % or less of biodiesel originating
    in the United States of America, and terminating the investigation in respect
    of imports consigned from Singapore
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 443/2011 du Conseil du 5 mai 2011 portant
    extension du droit compensateur définitif institué par le règlement (CE) n
    ° 598/2009 sur les importations de biodiesel originaire des États-Unis d’Amérique
    aux importations de biodiesel expédié du Canada, qu’il ait ou non été déclaré
    originaire de ce pays, portant extension du droit compensateur définitif institué
    par le règlement (CE) n ° 598/2009 aux importations de biodiesel sous forme
    de mélange contenant, en poids, 20 % ou moins de biodiesel, originaire des États-Unis
    d’Amérique, et clôturant l’enquête concernant les importations expédiées
    de Singapour
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 443/2011 des Rates vom 5. Mai 2011 zur
    Ausweitung des mit der Verordnung (EG) Nr. 598/2009 eingeführten endgültigen
    Ausgleichszolls auf die Einfuhren von Biodiesel mit Ursprung in den Vereinigten
    Staaten von Amerika auf die aus Kanada versandten Einfuhren von Biodiesel, ob
    als Ursprungserzeugnisse Kanadas angemeldet oder nicht, und zur Ausweitung des
    mit der Verordnung (EG) Nr. 598/2009 eingeführten endgültigen Ausgleichszolls
    auf die Einfuhren von Biodiesel als Mischung mit einem Gehalt an Biodiesel von
    bis zu 20 GHT mit Ursprung in den Vereinigten Staaten von Amerika und zur Einstellung
    der Untersuchung betreffend die aus Singapur versandten Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 443/2011 на Съвета
    от 5 май 2011 година за разширяване на обхвата
    на наложеното с Регламент (ЕО) № 598/2009 окончателно
    изравнително мито върху вноса на биодизел
    с произход от Съединените американски щати
    по отношение на внос на биодизел, изпращан
    от Канада, деклариран или не с произход от Канада,
    и за разширяване на обхвата на наложеното с
    Регламент (ЕО) № 598/2009 окончателно изравнително
    мито по отношение на внос на биодизел в смес
    с тегловно съдържание на биодизел, по-малко
    или равно на 20 %, с произход от Съединените американски
    щати, както и за прекратяване на разследването
    по отношение на вноса, изпращан от Сингапур
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 443/2011 ze dne 5. května 2011
    , kterým se konečné vyrovnávací clo uložené nařízením Rady (ES) č.
    598/2009 na dovoz bionafty pocházející ze Spojených států amerických rozšiřuje
    na dovoz bionafty zasílané z Kanady, bez ohledu na to, zda je u ní deklarován
    původ z Kanady, kterým se konečné vyrovnávací clo uložené nařízením
    (ES) č. 598/2009 rozšiřuje na dovoz bionafty ve formě směsi obsahující
    20 % hmotnostních nebo méně bionafty pocházející ze Spojených států amerických
    a kterým se ukončuje šetření týkající se dovozu bionafty zasílané ze
    Singapuru
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 443/2011 af 5. maj 2011 om udvidelse
    af den endelige udligningstold, der blev indført ved forordning (EF) nr. 598/2009
    på importen af biodiesel med oprindelse i Amerikas Forenede Stater, til importen
    af biodiesel afsendt fra Canada, uanset om den er angivet med oprindelse i Canada,
    om udvidelse af den endelige udligningstold, der blev indført ved forordning
    (EF) nr. 598/2009, til importen af biodiesel i blandinger indeholdende 20 vægtprocent
    eller mindre biodiesel med oprindelse i Amerikas Forenede Stater og om afslutning
    af undersøgelsen vedrørende import afsendt fra Singapore
  type: main
