  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 443/2011, annettu 5 päivänä
    toukokuuta 2011 , Amerikan yhdysvalloista peräisin olevan biodieselin tuonnissa
    asetuksella (EY) N:o 598/2009 käyttöön otetun lopullisen tasoitustullin laajentamisesta
    koskemaan Kanadasta lähetetyn biodieselin tuontia riippumatta siitä, onko alkuperämaaksi
