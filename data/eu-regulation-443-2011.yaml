  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 443/2011 van de Raad van 5 mei 2011 tot
    uitbreiding van het definitieve compenserende recht dat bij Verordening (EG) nr.
    598/2009 is ingesteld op biodiesel van oorsprong uit de Verenigde Staten van Amerika
    tot uit Canada verzonden biodiesel, al dan niet aangegeven als van oorsprong uit
    Canada, en tot uitbreiding van het definitieve compenserende recht dat bij Verordening
    (EG) nr. 598/2009 is ingesteld tot biodiesel in een mengsel bevattende 20 of minder
    gewichtsprocenten biodiesel van oorsprong uit de Verenigde Staten van Amerika,
    en tot beëindiging van het onderzoek naar de uit Singapore verzonden biodiesel
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 443/2011 z dnia 5 maja 2011 r.
    rozszerzające ostateczne cło wyrównawcze nałożone rozporządzeniem (WE) nr
    598/2009 na przywóz biodiesla pochodzącego ze Stanów Zjednoczonych Ameryki,
    na przywóz biodiesla wysyłanego z Kanady, zgłoszonego lub niezgłoszonego jako
    pochodzący z Kanady, oraz rozszerzające ostateczne cło wyrównawcze nałożone
    rozporządzeniem (WE) nr 598/2009 na przywóz biodiesla w postaci mieszanki zawierającej
    wagowo maksymalnie 20 % biodiesla pochodzącego ze Stanów Zjednoczonych Ameryki,
    oraz kończące dochodzenie w odniesieniu do przywozu wysyłanego z Singapuru
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 443/2011 do Conselho, de 5 de Maio
    de 2011 , que torna extensivo o direito de compensação definitivo instituído
    pelo Regulamento (CE) n. ° 598/2009 sobre as importações de biodiesel originário
    dos Estados Unidos da América às importações de biodiesel expedido do Canadá,
    quer seja ou não declarado originário do Canadá, e que torna extensivo o direito
    de compensação definitivo instituído pelo Regulamento (CE) n. ° 598/2009 sobre
    as importações de biodiesel numa mistura que contenha, em peso, 20 % ou menos
    de biodiesel originário dos Estados Unidos da América, e que encerra o inquérito
    no que diz respeito às importações expedidas de Singapura
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 443/2011 al Consiliului din
    5 mai 2011 de extindere a aplicării taxei compensatorii definitive instituite
    de Regulamentul (CE) nr. 598/2009 asupra importurilor de biomotorină originare
    din Statele Unite ale Americii la importurile de biomotorină expediate din Canada,
    indiferent dacă au fost sau nu declarate ca fiind originare din Canada, și de
    extindere a aplicării taxei compensatorii definitive instituite de Regulamentul
    (CE) nr. 598/2009 la importurile de biomotorină în amestec cu un conținut în
    greutate de maximum 20 % de biomotorină originară din Statele Unite ale Americii
    și de încheiere a anchetei privind importurile expediate din Singapore
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 443/2011 z 5. mája 2011 , ktorým
    sa konečné vyrovnávacie clo uložené nariadením (ES) č. 598/2009 na dovoz
    bionafty s pôvodom v Spojených štátoch amerických rozširuje na dovoz bionafty
    odosielanej z Kanady bez ohľadu na to, či má alebo nemá deklarovaný pôvod
    v Kanade, a ktorým sa rozširuje konečné vyrovnávacie clo uložené nariadením
    (ES) č. 598/2009 na dovoz bionafty v podobe zmesi s obsahom najviac 20 % hmotnosti
    bionafty s pôvodom v Spojených štátoch amerických a ktorým sa ukončuje
    prešetrovanie týkajúce sa dovozu odosielaného zo Singapuru
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 443/2011 z dne 5. maja 2011 o razširitvi
    dokončne izravnalne dajatve, uvedene z Uredbo (ES) št. 598/2009 za uvoz biodizla
    s poreklom iz Združenih držav Amerike, na uvoz biodizla, poslanega iz Kanade,
    ne glede na to, ali je deklariran s poreklom iz Kanade ali ne, in o razširitvi
    dokončne izravnalne dajatve uvedene z Uredbo (ES) št. 598/2009 na uvoz biodizla
    v mešanici s vsebnostjo 20 mas. % ali manj biodizla s poreklom iz Združenih
    držav Amerike, in o zaključku preiskave v zvezi z uvozom, poslanim iz Singapurja
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 443/2011 del Consejo, de 5 de mayo de
    2011 , que amplía a las importaciones de biodiésel expedido desde Canadá, esté
    o no declarado como originario de Canadá, el derecho compensatorio definitivo
    impuesto por el Reglamento (CE) n ° 598/2009 a las importaciones de biodiésel
    originario de los Estados Unidos de América, amplía el derecho compensatorio
    definitivo impuesto por el Reglamento (CE) n ° 598/2009 a las importaciones de
    biodiésel en mezclas con un contenido igual o inferior al 20 % en peso de biodiésel
    originario de los Estados Unidos de América, y da por concluida la investigación
    sobre las importaciones expedidas desde Singapur
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 443/2011 av den 5 maj 2011 om
    utvidgning av den slutgiltiga utjämningstull som genom förordning (EG) nr 598/2009
    infördes på import av biodiesel med ursprung i Amerikas förenta stater till
    att omfatta import av biodiesel som avsänts från Kanada, oavsett om dess deklarerade
    ursprung är Kanada eller inte, om utvidgning av den slutgiltiga utjämningstull
    som infördes genom förordning (EG) nr 598/2009 till att omfatta import av biodiesel
    i en blandning innehållande högst 20 viktprocent biodiesel med ursprung i Amerikas
    förenta stater, och om avslutande av undersökningen rörande import som avsänts
    från Republiken Singapore
