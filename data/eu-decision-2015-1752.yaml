  script: Latn
  content: Commission Implementing Decision (EU) 2015/1752 of 29 September 2015 amending
    Implementing Decision 2013/426/EU on measures to prevent the introduction into
    the Union of the African swine fever virus from certain third countries or parts
    of the territory of third countries in which the presence of that disease is confirmed
    and repealing Decision 2011/78/EU (notified under document C(2015) 6519)
  type: main
- language: fr
  script: Latn
