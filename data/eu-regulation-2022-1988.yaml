  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1988 of 12 July 2022 extending
    the transitional period for continuing to provide crowdfunding services in accordance
    with national law as referred to in Article 48(1) of Regulation (EU) 2020/1503
    of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
