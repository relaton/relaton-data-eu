title:
- language: en
  script: Latn
  content: '92/103/EEC: Commission Decision of 31 January 1992 amending for the third
    time Decision 80/775/EEC, on laying down methods of control for maintaining the
    officially brucellosis-free status of bovine herds in certain regions of the Federal
    Republic of Germany (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/103/CEE: Décision de la Commission du 31 janvier 1992 portant troisième
    modification de la décision 80/775/CEE établissant les méthodes de contrôle
    visant à maintenir le statut de cheptels officiellement indemnes de brucellose
    dans certaines régions de la République fédérale d''Allemagne (Le texte en
    langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '92/103/EWG: Entscheidung der Kommission vom 31. Januar 1992 zur dritten
    Änderung der Entscheidung 80/775/EWG zur Festlegung der Kontrollmethoden für
    die Beibehaltung des amtlich anerkannt brucellosefreien Status der Rinderbestände
    in bestimmten Gebieten der Bundesrepublik Deutschland (Nur der deutsche Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/103/EØF: Kommissionens beslutning af 31. januar 1992 om tredje ændring
    af beslutning 80/775/EØF om fastsættelse af kontrolbestemmelser med henblik
    på i visse regioner i Forbundsrepublikken Tyskland at bevare kvægbesætningernes
    status som værende officielt fri for brucellose (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/103/ΕΟΚ: Απόφαση της Επιτροπής της 31ης
    Ιανουαρίου 1992 που τροποποιεί για τρίτη φορά
    την απόφαση 80/775/ΕΟΚ περί θεσπίσεως μεθόδων
    ελέγχου για τη διατήρηση των επίσημα απαλλαγμένων
    από βρουκέλλωση αγελών βοοειδών σε ορισμένες
    περιοχές της Ομοσπονδιακής Δημοκρατίας της
    Γερμανίας'
  type: main
- language: it
  script: Latn
  content: '92/103/CEE: Decisione della Commissione del 31 gennaio 1992 recante terza
    modifica della decisione 80/775/CEE, che fissa le modalità del controllo cui
    è subordinata la qualifica «ufficialmente indenne da brucellosi» degli allevamenti
    bovini in alcune regioni della Repubblica federale di Germania (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/103/EEG: Beschikking van de Commissie van 31 januari 1992 houdende
    derde wijziging van Beschikking 80/775/EEG tot vaststelling van een controleregeling
    om in bepaalde delen van de Bondsrepubliek Duitsland de rundveebeslagen verder
    als officieel brucellosevrij te kunnen erkennen (Slechts de tekst in de Duitse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/103/CEE: Decisão da Comissão, de 31 de Janeiro de 1992, que altera
    pela terceira vez a Decisão 80/775/CEE, que estabelece os métodos de controlo
    destinados a manter o estatuto de efectivos bovinos oficialmente indemnes de brucelose
    em determinadas regiões da República Federal da Alemanha'
  type: main
- language: es
  script: Latn
  content: '92/103/CEE: Decisión de la Comisión de 31 de enero de 1992 que modifica
    por tercera vez la Decisión 80/775/CEE, por la que se establecen los métodos
    de control necesarios para mantener la calificación de cabaña bovina oficialmente
    indemne de brucelosis en determinadas regiones de la República Federal de Alemania
    (El texto en lengua alemana es el único auténtico)'
  type: main
