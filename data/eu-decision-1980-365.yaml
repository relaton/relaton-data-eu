  content: '80/365/EEC: Council Decision of 26 March 1980 under the Treaties, concerning
    the fishery activities in waters under the sovereignty or jurisdication of Member
    States, taken on a temporary basis pending the adoption of permanent Community
    measures'
  type: main
- language: fr
  script: Latn
  content: '80/365/CEE: Décision du Conseil, du 26 mars 1980, fondée sur les traités,
