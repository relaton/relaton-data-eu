title:
- language: en
  script: Latn
  content: '72/188/EEC: Commission Decision of 19 April 1972 authorizing the Kingdom
    of Belgium, the Federal Republic of Germany, the French Republic and the Kingdom
    of the Netherlands to approve for marketing reproductive material of Larix decidua
    Mill., satisfying less stringent requirements (Only the German, French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/188/CEE: Décision de la Commission, du 19 avril 1972, autorisant le
    Royaume de Belgique, la République fédérale d''Allemagne, la République française
    et le Royaume des Pays-Bas à admettre à la commercialisation des matériels
    de reproduction de Larix decidua Mill., soumis à des exigences réduites (Les
    textes en langues allemande, française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '72/188/EWG: Entscheidung der Kommission vom 19. April 1972, mit der das
    Königreich Belgien, die Bundesrepublik Deutschland, die Französische Republik
    und das Königreich der Niederlande ermächtigt werden, Vermehrungsgut von Larix
    decidua Mill. mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
    (Nur der deutsche, französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/188/EØF: Kommissionens beslutning af 19. april 1972, om bemyndigelse
    af kongeriget Belgien, Forbundsrepublikken Tyskland, Den franske Republik og kongeriget
    Nederlandene til at tillade handel med formeringsmateriale af Larix decidua Mill.,
    der opfylder mindre strenge krav (Kun den tyske, franske og nederlandske udgave
    er autentiske)'
  type: main
- language: it
  script: Latn
  content: '72/188/CEE: Decisione della Commissione, del 19 aprile 1972, che autorizza
    il Regno del Belgio, la Repubblica federale di Germania, la Repubblica francese
    e il Regno dei Paesi Bassi ad ammettere alla commercializzazione dei materiali
    di moltiplicazione di Larix decidua Mill., soggetti a requisiti ridotti (Il testi
    in lingua tedesca, francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '72/188/EEG: Beschikking van de Commissie van 19 april 1972 houdende machtiging
    van het Koninkrijk België, de Bondsrepubliek Duitsland, de Franse Republiek en
    het Koninkrijk der Nederlanden om teeltmaterial van Larix decidua Mill., waaraan
    minder strenge eisen zijn gesteld, tot de handel toe te laten (Slechts de teksten
    in de Duitse, Franse en de Nederlandse taal zijn authentiek)'
  type: main
