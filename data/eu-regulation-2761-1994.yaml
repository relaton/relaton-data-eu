  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2761/94 DEL CONSIGLIO del 10 novembre 1994 recante
    modifica del regolamento (CE) n. 3676/93 che stabilisce, per alcuni stock o gruppi
    di stock ittici, il totale ammissibile di catture (TAC) per il 1994 e talune condizioni
    cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2761/94 VAN DE RAAD van 10 november 1994 tot wijziging
    van Verordening (EG) nr. 3676/93 inzake de vaststelling van de voor 1994 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen van visbestanden,
    alsmede de bij de visserij in het kader van de totaal toegestane vangsten in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2761/94 DO CONSELHO de 10 de Novembro de 1994 que
