id: EUDecision1975701
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '75/701/EEC: Commission Decision of 17 October 1975 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to unworked drawn or blown glass in rectangles having
    a thickness of 4 mm or less, falling within heading No ex 70.05 of the Common
    Customs Tariff, originating in the USSR and in free circulation in the Federal
    Republic of Germany'
  type: main
- language: fr
  script: Latn
  content: '75/701/CEE: Décision de la Commission, du 17 octobre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit verre
    à vitres en feuilles, de forme carrée ou rectangulaire, d''une épaisseur de
    4 mm ou moins, de la position ex 70.05 du tarif douanier commun, originaire d''URSS
    et mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: '75/701/EWG: Entscheidung der Kommission vom 17. Oktober 1975, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, gezogenes oder geblasenes Flachglas, sogenanntes
    ,,Tafelglas'' '' , in quadratischen oder rechteckigen Platten oder Scheiben, mit
    einer Dicke von 4 mm oder weniger, der Tarifstelle ex 70.05 des Gemeinsamen Zolltarifs,
    das aus der UdSSR stammt und sich in der Bundesrepublik Deutschland im freien
    Verkehr befindet, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '75/701/EØF: Kommissionens Beslutning af 17. oktober 1975 om bemyndigelse
    for kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til at udelukke trukket eller pustet glas, såkaldt "vinduesglas", i plader af
    kvadratisk eller rektangulær form, med en tykkelse på 4 mm eller herunder, henhørende
    under pos. ex 70.05 i den fælles toldtarif, med oprindelse i Sovjetunionen, og
    som er i fri omsætning i Forbundsrepublikken Tyskland, fra fællesskabsbehandling'
  type: main
- language: it
  script: Latn
  content: '75/701/CEE: Decisione della Commissione, del 17 ottobre 1975, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario il vetro tirato o soffiato, detto "vetro
    per vetrate", in lastre di forma quadrata o rettangolare di spessore uguale o
    inferiore a 4 mm, della voce ex 70.05 della tariffa doganale comune, originario
    dell'' URSS e immesso in libera pratica nella Repubblica federale di Germania'
  type: main
- language: nl
  script: Latn
  content: '75/701/EEG: Beschikking van de Commissie van 17 oktober 1975 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd getrokken of geblazen glas (zogenaamd vensterglas) in vierkante
    of rechthoekige platen met een dikte van 4 mm of minder van post ex 70.05 van
    het gemeenschappelijk douanetarief, van oorsprong uit de U.S.S.R. en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
