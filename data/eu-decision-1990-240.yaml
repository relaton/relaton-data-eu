id: EUDecision1990240
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/240/EEC: Commission Decision of 22 May 1990 terminating the proceeding
    in connection with a review of anti-dumping measures regarding imports of fibre
    building-board (hardboard) originating in Finland, Argentina, Switzerland and
    Yugoslavia and repealing Decisions 86/35/EEC and 86/232/EEC accepting the undertakings
    given by the exporters concerned'
  type: main
- language: fr
  script: Latn
  content: '90/240/CEE: Décision de la Commission du 22 mai 1990 clôturant la procédure
    de réexamen des mesures antidumping concernant les importations de panneaux de
    fibres (panneaux durs) originaires de Finlande, d''Argentine, de Suisse et de
    Yougoslavie et abrogeant les décisions 86/35/CEE et 86/232/CEE portant acceptation
    des engagements souscrits par les exportateurs concernés'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 22. Mai 1990 zur Einstellung des Verfahrens
    nach der Ueberpruefung der Antidumpingmassnahmen betreffend die Einfuhren von
    Faserplatten (hardboard) mit Ursprung in Finnland, Argentinien, der Schweiz und
    Jugoslawien und zur Aufhebung der Beschluesse 86/35/EWG und 86/232/EWG ueber die
    Annahme der Verpflichtungen der betroffenen Ausfuehrer (90/240/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 22. maj 1990 om afslutning af proceduren i
    forbindelse med en fornyet undersoegelse af antidumpingforanstaltningerne vedroerende
    importen af fiberplader (haarde plader) med oprindelse i Argentina, Finland, Jugoslavien
    og Schweiz og om ophaevelse af afgoerelse 86/35/EOEF og 86/232/EOEF vedroerende
    godtagelse af de tilsagn, der er afgivet af de beroerte eksportoerer (90/240/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/240/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Μαΐου 1990 για την περάτωση της διαδικασίας όσον
    αφορά την επανεξέταση των μέτρων αντιντάμπινγκ
    σχετικά με τις εισαγωγές οικοδομικών πλακών
    διαφραγμάτων από ίνες καταγωγής Φινλανδίας,
    Αργεντινής, Ελβετίας και Γιουγκοσλαβίας και
    για την κατάργηση των αποφάσεων 86/35/ΕΟΚ και
    86/232/ΕΟΚ περί αποδοχής των αναλήψεων υποχρεώσεων
    από τους εν λόγω εξαγωγείς'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 maggio 1990 che chiude la procedura
    di riesame delle misure antidumping relative alle importazioni di pannelli di
    fibre (pannelli duri) originari della Finlandia, dell'Argentina, della Svizzera
    e della Iugoslavia e abroga le decisioni 86/35/CEE e 86/232/CEE che accettano
    gli impegni offerti dagli esportatori interessati (90/240/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 22 mei 1990 tot beëindiging van de procedure
    in verband met een nieuw onderzoek van anti-dumpingmaatregelen betreffende de
    invoer van vezelplaat van houtvezels (hardboard), van oorsprong uit Finland, Argentinië,
    Zwitserland en Joegoslavië en tot intrekking van de Besluiten 86/35/EEG en 86/232/EEG
    tot aanvaarding van de verbintenissen van de betrokken exporteurs (90/240/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Maio de 1990 que encerra o processo de reexame
    das medidas anti-dumping relativo às importaçoes de painéis duros de fibras
    de madeira (painéis duros) originarios da Finlândia, da Argentina, da Suiça
    e da Jugoslavia e que revoga as Decisoes 86/35/CEE e 86/232/CEE que aceitam os
    compromissos oferecidos pelos exportadores em causa (90/240/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 22 de mayo de 1990 por la que se concluye el
    procedimiento de reconsideracion de las medidas antidumping relativas a la importacion
    de tableros de fibra de madera (tableros duros) originarios de Finlandia, Argentina,
    Suiza y Yugoslavia, y por la que se derogan las Decisiones 86/35/CEE y 86/232/CEE
    de la Comision por las que se aceptan los compromisos ofrecidos por los exportadores
    en cuestion (90/240/CEE)
  type: main
