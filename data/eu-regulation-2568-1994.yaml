title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2568/94 of 21 October 1994 determining the
    extent to which applications lodged in October 1994 licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2568/94 de la Commission, du 21 octobre 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1994 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords intérimaires conclus entre
    la Communauté et la république de Pologne, la république de Hongrie, la République
    tchèque et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2568/94 der Kommission vom 21. Oktober 1994 über die
    Festsetzung des Umfangs, in dem die im Oktober 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik und der Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2568/94 af 21. oktober 1994 om fastsættelse
