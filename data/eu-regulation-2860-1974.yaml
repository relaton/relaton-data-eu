title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2860/74 of the Commission of 14 November 1974 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of earthenware or fine pottery, falling
    within subheading 69.12 C, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2860/74 de la Commission, du 14 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage, en faïence ou en poterie fine, de la sous-position
    tarifaire 69.12 C, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2860/74 der Kommission vom 14. November 1974 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus Steingut
    oder feinen Erden, der Tarifstelle 69.12 C, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2860/74 af 14. november 1974 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdningsvarer af fajance
    eller fint ler under underposition 69.12 C, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2860/74 della Commissione, del 14 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e agli oggetti
    di uso domestico, di terracotta fine o di terraglia della sottovoce doganale n.
    69.12 C, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2860/74 van de Commissie van 14 november 1974 houdende
    wederinstelling van de heffing van de douanerechten voor vaatwerk, huishoudelijke
    artikelen van faience of van fijn aardewerk, van onderverdeling 69.12 C, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
