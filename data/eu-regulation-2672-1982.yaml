title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2672/82 of 4 October 1982 repealing the definitive
    anti-dumping duty applying to imports of certain sodium carbonate originating
    in the Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2672/82 du Conseil, du 4 octobre 1982, abrogeant le
    droit anti-"dumping" définitif en vigueur à l' égard des importations d' un
    carbonate de sodium déterminé, originaire d' Union soviétique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2672/82 des Rates vom 4. Oktober 1982 zur Aufhebung
    des endgültigen Antidumpingzolls für die Einfuhren eines bestimmten Natriumkarbonats
    mit Ursprung in der Sowjetunion
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2672/82 af 4. oktober 1982 om ophævelse
    af den endelige antidumpingtold, der gælder for importen af en bestemt type natriumcarbonat
    med oprindelse i Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2672/82 τής Συμβουλίου
    τής 4ης Οκτωβρίου 1982 γιά τήν κατάργηση τού οριστικού
    δασμού αντιντάμπινγκ πού ισχύει έναντι τών
    εισαγωγών ενός συγκεκριμένου τύπου ανθρακικού
    νατρίου καταγωγής Σοβιετικής Ενώσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2672/82 del Consiglio, del 4 ottobre 1982, che abroga
    il dazio antidumping definitivo in vigore nei confronti delle importazioni di
    un determinato carbonato di sodio originario dell' Unione Sovieticao
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2672/82 van de Raad van 4 oktober 1982 houdende intrekking
    van het definitieve anti-dumpingrecht op de invoer van een bepaalde soort natriumcarbonaat
    van oorsprong uit de Sowjetunie
  type: main
