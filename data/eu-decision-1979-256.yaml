title:
- language: en
  script: Latn
  content: '79/256/EEC: Commission Decision of 21 February 1979 authorizing the French
    Republic not to apply Community treatment to electrical measuring, checking, analyzing
    or automatically controlling instruments and apparatus, falling within heading
    No 90.28 of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/256/CEE: Décision de la Commission, du 21 février 1979, autorisant
    la République française à exclure du traitement communautaire les instruments
    et appareils électriques ou électroniques de mesure, de vérification, de contrôle,
    de régulation ou d'' analyse, de la position 90.28 du tarif douanier commun,
    originaires du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/256/EWG: Entscheidung der Kommission vom 21. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche elektrische oder elektronische Instrumente,
    Apparate und Geräte zum Messen, Prüfen, Kontrollieren, Regeln oder zum Analysieren,
    der Tarifnummer 90.28 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/256/EØF: Kommissionens beslutning af 21. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage elektriske og
    elektroniske instrumenter og apparater, til måling, afprøvning, kontrollering,
    analysering og automatisk regulering, som henhører under pos. 90.28 i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/256/CEE: Decisione della Commissione, del 21 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli strumenti
    e gli apparecchi elettrici o elettronici di misura, di verifica, di controllo,
    di regolazione o di analisi, della voce 90.28 della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/256/EEG: Beschikking van de Commissie van 21 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd elektrische of elektronische meet-, verificatie-,
    controle-, regel- of analyseerinstrumenten, -apparaten en - toestellen, van post
    90.28 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
