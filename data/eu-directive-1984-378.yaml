  script: Latn
  content: Council Directive 84/378/EEC of 28 June 1984 amending the Annexes to Directive
    77/93/EEC on protective measures against the introduction into the Member States
    of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Directive 84/378/CEE du Conseil du 28 juin 1984 modifiant les annexes de
    la directive 77/93/CEE concernant les mesures de protection contre l'introduction
    dans les États membres d'organismes nuisibles aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Richtlinie 84/378/EWG des Rates vom 28. Juni 1984 zur Änderung der Anhänge
    der Richtlinie 77/93/EWG über Maßnahmen zum Schutz gegen das Verbringen von
    Schadorganismen der Pflanzen oder Pflanzenerzeugnisse in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 84/378/EØF af 28. juni 1984 om ændring af bilagene til
    direktiv 77/93/EØF om foranstaltninger mod indslæbning i medlemsstaterne af
    skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Οδηγία 84/378/ΕΟΚ του Συμβουλίου της 28ης Ιουνίου
