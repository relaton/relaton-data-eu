    οδηγίας 77/93/ΕΟΚ περί των μέτρων προστασίας
    κατά της εισαγωγής στα κράτη μέλη οργανισμών
    επιβλαβών για τα φυτά ή τα φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 84/378/ETY, annettu 28 päivänä kesäkuuta 1984,
    kasvien tai kasvituotteiden haitallisten organismien yhteisöön kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun direktiivin 77/93/ETY liitteiden
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 84/378/CEE del Consiglio del 28 giugno 1984 che modifica gli
    allegati della direttiva 77/93/CEE concernente le misure di protezione contro
    l'introduzione negli Stati Membri di organismi nocivi ai vegetali o ai prodotti
    vegetali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 84/378/EEG van de Raad van 28 juni 1984 tot wijziging van de
    bijlagen van Richtlijn 77/93/EEG betreffende de beschermende maatregelen tegen
    het binnenbrengen op het grondgebied van de Lid-Staten van voor planten of plantaardige
    produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Directiva 84/378/CEE do Conselho, de 28 de Junho de 1984, que altera os
    anexos da Directiva 77/93/CEE respeitante às medidas de protecção contra a
    introdução nos Estados-Membros de organismos nocivos às plantas ou aos produtos
    vegetais
  type: main
- language: es
  script: Latn
  content: Directiva 84/378/CEE del Consejo, de 28 de junio de 1984, por la que se
    modfican los Anexos de la Directiva 77/93/CEE relativa a las medidas de protección
    contra la introducción en los Estados Miembros de organismos nocivos para los
    vegetales o productos vegetales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 84/378/EEG av den 28 juni 1984 om ändring av bilagorna
    till direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare på växter eller
    växtprodukter förs in till medlemsstaterna
