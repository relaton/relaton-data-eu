title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 719/92 of 23 March 1992 re-establishing
    the levying of customs duties on products falling within CN code 6403, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 719/92 de la Commission du 23 mars 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 6403,
    originaires de Thaïlande, bénéficiaires des préférences tarifaires prévues
    au règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 719/92 DER KOMMISSION vom 23. März 1992 zur Wiedereinführung
