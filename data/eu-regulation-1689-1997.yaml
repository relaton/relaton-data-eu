- language: en
  script: Latn
  content: Commission Regulation (EC) No 1689/97 of 29 August 1997 authorizing advance
    payment to producers in certain regions of Germany of compensatory allowances
    for cereals, protein crops and linseed and of compensation for compulsory set-aside
    in respect of the 1997/98 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1689/97 de la Commission du 29 août 1997 autorisant
    le paiement à l'avance, aux producteurs de certaines régions d'Allemagne, de
    paiements compensatoires, au titre de la campagne de commercialisation 1997/1998,
    pour les céréales, les protéagineux et les graines de lin oléagineux ainsi
    que de la compensation pour le gel des terres obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) nr. 1689/97 der Kommission vom 29. August 1997 zur Genehmigung
