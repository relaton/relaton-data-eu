    mehreren Gebieten Deutschlands im Wirtschaftsjahr 1997/98 für Getreide, Eiweißpflanzen
    und Öllein sowie für die vorgeschriebene Flächenstillegung zu gewähren sind
  type: main
- language: da
  script: Latn
