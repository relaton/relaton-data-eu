title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 763/90 of 26 March 1990 imposing a provisional
    anti-dumping duty on imports of tungsten carbide and fused tungsten carbide originating
    in the people's Republic of China and terminating the anti-dumping proceeding
    concerning imports of those products from the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 763/90 de la Commission du 26 mars 1990 instituant
    un droit antidumping provisoire sur les importations de carbure de tungstène
    et de carbure de tungstène fondu originaires de la République populaire de Chine
    et portant clôture de la procédure concernant les importations de ces produits
    originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 763/90 DER KOMMISSION vom 26. Maerz 1990 zur Einfuehrung
    eines vorlaeufigen Antidumpingzolls auf die Einfuhren von Wolframkarbid und Mischwolframkarbid
    mit Ursprung in der Volksrepublik China und zur Einstellung des Verfahrens gegenueber
    den Einfuhren derselben Erzeugnisse mit Ursprung in der Republik Korea
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 763/90 af 26. marts 1990 om indførelse
    af en midlertidig antidumpingtold på importen af wolframcarbid og sammensmeltet
    wolframcarbid med oprindelse i Den Kinesiske Folkerepublik og om afslutning af
    proceduren vedrørende importen af disse varer med oprindelse i Republikken Korea
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 763/90 της Επιτροπής
    της 26ης Μαρτίου 1990 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές καρβιδίου
    βολφραμίου και συντετηγμένου καρβιδίου βολφραμίου
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας και
    για την περάτωση της διαδικασίας σχετικά με
    τις εισαγωγές των προϊόντων, αυτών καταγωγής
    Δημοκρατίας της Κορέας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 763/90 DELLA COMMISSIONE del 26 marzo 1990 che istituisce
    un dazio antidumping provvisorio sulle importazioni di carburo di tungsteno e
    di carburo di tungsteno fuso originarie della Repubblica popolare cinese e chiude
    la procedura relativa alle importazioni dei medesimi prodotti originari della
    Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 763/90 VAN DE COMMISSIE van 26 maart 1990 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van wolfraamcarbide en gesmolten
    wolfraamcarbide van oorsprong uit de Volksrepubliek China, en tot beëindiging
    van de procedure betreffende de invoer ervan van oorsprong uit de Republiek Korea
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 763/90 DA COMISSAO de 26 de Março de 1990 que institui
    um direito anti-dumping provisorio sobre as importaçoes de carboneto de tungsténio
    e de carboneto de tungsténio fundido originarias da Republica Popular da China
    e que encerra o processo relativo às importaçoes dos referidos produtos originarias
    da Republica da Coreia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 763/90 DE LA COMISION de 26 de marzo de 1990 por el
    que se establece un derecho antidumping provisional sobre las importaciones de
    carburo de volframio y de carburo de volframio fundido originarias de la Republica
    Popular de China y por el que se concluye el procedimiento relativo a las importaciones
    de los mismos productos originarios de la Republica de Corea
