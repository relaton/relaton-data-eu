title:
- language: en
  script: Latn
  content: '79/938/EEC: Commission Decision of 22 October 1979 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Denmark of a payment on account
    in respect of expenditure incurred during 1978 on aids relating to the provision
    of socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/938/CEE: Décision de la Commission, du 22 octobre 1979, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Danemark d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides relatives à l''information
    socio-économique et à la qualification professionnelle des personnes travaillant
    dans l''agriculture (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/938/EWG: Entscheidung der Kommission vom 22. Oktober 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben an das Königreich
    Dänemark (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/938/EØF: Kommissionens beslutning af 22. oktober 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Danmark af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1978 til støtte vedrørende social
    og erhvervsmæssig vejledning og faglige kvalifikationer hos de personer, som
    arbejder i landbruget (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/938/CEE: Decisione della Commissione, del 22 ottobre 1979, relativa
    al versamento, da parte del FEAOG, sezione orientamento, al Regno di Danimarca
    di un anticipo sulle spese effettuate durante il 1978 per gli aiuti concernenti
    l''informazione socioeconomica e la qualificazione professionale delle persone
    che lavorano nell''agricoltura (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/938/EEG: Beschikking van de Commissie van 22 oktober 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken van
    een voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor de
    steun met betrekking tot de sociaal-economische voorlichting en de scholing van
    de personen die in de landbouw werkzaam zijn (Slechts de tekst in de Deense taal
    is authentiek)'
  type: main
