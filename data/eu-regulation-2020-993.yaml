title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/993 of 9 July 2020 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase (EC 3.2.1.8) produced
    by Trichoderma reesei (BCCM/MUCL 49755) as a feed additive for all avian species
    for fattening other than chickens for fattening, ornamental birds, all weaned
    porcine species other than weaned piglets and all porcine species for fattening
    other than pigs for fattening (holder of authorisation Berg und Schmidt GmbH Co.
    KG)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/993 de la Commission du 9 juillet
    2020 relatif à l’autorisation d’une préparation d’endo-1,4-β-xylanase
    (EC 3.2.1.8) produite par Trichoderma reesei (BCCM/MUCL 49755) en tant qu’additif
    dans l’alimentation de tous les oiseaux d’engraissement autres que les poulets
    d’engraissement, des oiseaux d’ornement, de tous les porcins sevrés autres
    que les porcelets sevrés et de tous les porcins d’engraissement autres que
    les porcs d’engraissement (titulaire de l’autorisation: Berg und Schmidt GmbH
    Co. KG)'
  type: main
