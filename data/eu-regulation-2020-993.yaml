    aus Trichoderma reesei (BCCM/MUCL 49755), als Futtermittelzusatzstoff für alle
    Mastvogelarten außer Masthühnern, für Ziervögel, für alle Absatzschweinearten
    außer Absatzferkeln sowie für alle Mastschweinearten außer Mastschweinen (Zulassungsinhaber:
    Berg und Schmidt GmbH Co. KG)'
  type: main
