title:
- language: en
  script: Latn
  content: '2010/149/: Commission Decision of 9 March 2010 allowing Member States
    to extend provisional authorisations granted for the new active substances flonicamid,
    silver thiosulphate and tembotrione (notified under document C(2010) 1255)'
  type: main
- language: fr
  script: Latn
  content: '2010/149/: Décision de la Commission du 9 mars 2010 autorisant les États
    membres à prolonger les autorisations provisoires accordées pour les nouvelles
    substances actives flonicamide, thiosulfate d’argent et tembotrione [notifiée
    sous le numéro C(2010) 1255]'
  type: main
- language: de
  script: Latn
  content: '2010/149/: Beschluss der Kommission vom 9. März 2010 zur Ermächtigung
    der Mitgliedstaaten, vorläufige Zulassungen für die neuen Wirkstoffe Flonicamid,
    Silberthiosulfat und Tembotrion zu verlängern (Bekannt gegeben unter Aktenzeichen
    K(2010) 1255)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/149/ЕС: Решение на Комисията от 9 март
    2010 година за даване на възможност на държавите-членки
    да удължат временните разрешения, издадени
    за новите активни вещества флоницамид, сребърен
    тиосулфат и темботрион (нотифицирано под номер
    C(2010) 1255)'
  type: main
- language: cs
  script: Latn
  content: '2010/149/: Rozhodnutí Komise ze dne 9. března 2010 , kterým se členským
    státům umožňuje prodloužit dočasná povolení udělená pro nové účinné
    látky flonicamid, thiosíran stříbrný a tembotrion (oznámeno pod číslem
    K(2010) 1255)'
  type: main
- language: da
  script: Latn
  content: '2010/149/: Kommissionens afgørelse af 9. marts 2010 om medlemsstaternes
    forlængelse af midlertidige godkendelser af de nye aktivstoffer flonicamid, sølvthiosulphat
    og tembotrion (meddelt under nummer K(2010) 1255)'
  type: main
- language: el
  script: Grek
  content: '2010/149/: Απόφαση της Επιτροπής, της 9ης Μαρτίου
    2010 , με την οποία επιτρέπεται στα κράτη μέλη
    να παρατείνουν τη διάρκεια των προσωρινών
    αδειών κυκλοφορίας που έχουν χορηγηθεί για
    τις νέες δραστικές ουσίες flonicamid, silver thiosulphate
    και tembotrione [κοινοποιηθείσα υπό τον αριθμό Ε(2010)
    1255]'
  type: main
- language: et
  script: Latn
  content: '2010/149/: Komisjoni otsus, 9. märts 2010 , millega lubatakse liikmesriikidel
    pikendada uute toimeainete flonikamiidi, hõbetiosulfaadi ja tembotriooni ajutisi
    kasutuslube (teatavaks tehtud numbri K(2010) 1255 all)'
  type: main
- language: fi
  script: Latn
  content: '2010/149/: Komission päätös, annettu 9 päivänä maaliskuuta 2010
    , jäsenvaltioiden mahdollisuudesta pidentää uusien tehoaineiden flonikamidin,
    hopeatiosulfaatin ja tembotrionin väliaikaisia lupia (tiedoksiannettu numerolla
    K(2010) 1255)'
  type: main
- language: hu
  script: Latn
  content: '2010/149/: A Bizottság határozata ( 2010. március 9. ) a flonikamid,
    az ezüst-tioszulfát és a tembotrion elnevezésű új hatóanyagra vonatkozó
    ideiglenes engedélyek tagállamok általi meghosszabbításának engedélyezéséről
    (az értesítés a C(2010) 1255. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2010/149/: Decisione della Commissione, del 9 marzo 2010 , che consente
