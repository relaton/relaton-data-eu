    nr C(2010) 1255)'
  type: main
- language: pt
  script: Latn
  content: '2010/149/: Decisão da Comissão, de 9 de Março de 2010 , que autoriza
    a prorrogação, pelos Estados-Membros, das autorizações provisórias das novas
    substâncias activas flonicamida, tiossulfato de prata e tembotriona [notificada
    com o número C(2010) 1255]'
  type: main
- language: ro
  script: Latn
  content: '2010/149/: Decizia Comisiei din 9 martie 2010 de autorizare a statelor
