title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2245/89 of 24 July 1989 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 337/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2245/89 du Conseil du 24 juillet 1989 modifiant le
    règlement (CEE) n° 1873/84 autorisant l'offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d'avoir fait l'objet de
    pratiques oenologiques non prévues par le règlement (CEE) n° 337/79
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2245/89 DES RATES vom 24. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 337/79 nicht vorgesehenen önologischen Verfahren waren #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2245/89 af 24. juli 1989 om ændring af forordning
    (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte konsum
    af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 337/79 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2245/89 του Συμβουλίου
    της 24ης Ιουλίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων που
    μπορούν να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 337/79
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2245/89 DEL CONSIGLIO del 24 luglio 1989 recante
    modifica del regolamento (CEE) n. 1834/84 che autorizza l'' offerta e la consegna
    per il consumo diretto di taluni vini importati che possono essere stati sottoposti
    a pratiche enologiche non previste dal regolamento (CEE) n. 337/79 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2245/89 VAN DE RAAD van 24 juli 1989 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 337/79 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2245/89 DO CONSELHO de 24 de Julho de 1989 que altera
