title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1224/68 de la Commission, du 9 août 1968, relatif
    à l'établissement des modèles d'autorisation communautaire et de formulaire
    pour l'obtention de renseignement statistiques au sujet de l'utilisation de l'autorisation
    communautaire, visés aux articles 2 paragraphe 2, et 5 paragraphe 1 alinéa 2
    du règlement (CEE) n° 1018/68 du Conseil relatif à la constitution d'un contingent
    communautaire pour les transports de marchandises par route effectués entre États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1224/68 der Kommission vom 9. August 1968 über die
    Festlegung der Muster der Gemeinschaftsgenehmigung und des Formulars für die
    statistischen Angaben über die Verwendung der Gemeinschaftsgenehmigung, die in
    Artikel 2 Absatz 2 sowie Artikel 5 Absatz 1 Unterabsatz 2 der Verordnung (EWG)
    Nr. 1018/68 des Rates über die Bildung eines Gemeinschaftskontingents für den
    Güterkraftverkehr zwischen den Mitgliedstaaten genannt sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1224/68 della Commissione, del 9 agosto 1968, che
    stabilisce i modelli di autorizzazione comunitaria e i formulari per ottenere
    informazioni statistiche circa l'utilizzazione delle autorizzazioni comunitarie,
    di cui agli articoli 2, paragrafo 2, e 5, paragrafo 1, secondo comma, del regolamento
    (CEE) n. 1018/68 del Consiglio relativo alla costituzione di un contingente comunitario
    per i trasporti di merci su strada effettuati fra Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1224/68 van de Commissie van 9 augustus 1968 betreffende
    de vaststelling van de modellen van de communautaire vergunning en het formulier
    voor het verzamelen van statistische inlichtingen betreffende het gebruik van
    de communautaire vergunning, bedoeld in de artikelen 2, lid 2, en 5, lid 1, tweede
    alinea, van Verordening (EEG) nr. 1018/68 van de Raad houdende de vorming van
    een communautair contingent voor het goederenvervoer over de weg tussen Lid-Staten
  type: main
