title:
- language: en
  script: Latn
  content: '2014/885/EU: Commission Decision of 29 April 2014 on the State aid SA.34825
    (2012/C), SA.34825 (2014/NN), SA.36006 (2013/NN), SA.34488 (2012/C) (ex 2012/NN),
    SA.31155 (2013/C) (2013/NN) (ex 2010/N) implemented by Greece for the Eurobank
    Group related to: Recapitalisation and Restructuring of Eurobank Ergasias S.A.;
    Restructuring aid to Proton bank through creation and capitalisation of Nea Proton
    and additional recapitalisation of New Proton Bank by the Hellenic Financial Stability
    Fund; Resolution of Hellenic Postbank through the creation of a bridge bank (notified
    under document C(2014) 2933)'
  type: main
- language: fr
  script: Latn
  content: '2014/885/UE: Décision de la Commission du 29 avril 2014 concernant l’aide
    d’État SA.34825 (2012/C), SA.34825 (2014/NN), SA.36006 (2013/NN), SA.34488
    (2012/C) (ex 2012/NN), SA.31155 (2013/C) (2013/NN) (ex 2010/N) mise à exécution
    par la Grèce en faveur d’Eurobank Group et relative à: la recapitalisation
    et la restructuration d’Eurobank Ergasias SA; l’aide à la restructuration
    en faveur de Proton bank consistant en la création et la capitalisation de Nea
    Proton et une recapitalisation supplémentaire de Nea Proton Bank par le Fonds
    hellénique de stabilité financière; la résolution de la défaillance de Hellenic
    Postbank consistant en la création d’une banque-relais [notifiée sous le numéro
    C(2014) 2933]'
  type: main
- language: de
