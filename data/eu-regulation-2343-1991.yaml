title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2343/91 of 1 August 1991 re-establishing
    the levying of customs duties on products falling within CN code 3503 00 10, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2343/91 DE LA COMMISSION du 1er août 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3503 00 10 originaires du Brésil, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2343/91 DER KOMMISSION vom 1. August 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3503 00 10 mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2343/91 af 1. august 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3503 00 10 og med oprindelse
    i Brasilien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
