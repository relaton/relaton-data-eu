title:
- language: en
  script: Latn
  content: '79/717/EEC: Commission Decision of 27 July 1979 authorizing the United
    Kingdom not to apply Community treatment to men''s and boys''woven industrial
    and occupational clothing ; women''s, girls''and infants''woven aprons, smock
    overalls and other industrial clothing (whether or not also suitable for domestic
    use), of wool, cotton or man-made textile fibres, falling within heading Nos ex
    61.01 and ex 61.02 B of the Common Customs Tariff (NIMEXE codes 61.01-13, 15,
    17, 19 ; 61.02-12, 14) (category 76), originating in Bulgaria and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/717/CEE: Décision de la Commission, du 27 juillet 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire les vêtements de travail,
    tissés, pour hommes et garçonnets, et les tabliers, blouses et autres vêtements
    de travail, tissés, pour femmes, fillettes et jeunes enfants, de laine, de coton
    ou de fibres textiles synthétiques ou artificielles des positions ex 61.01 et
    ex 61.02 B du tarif douanier commun (codes Nimexe : 61.01-13, 15, 17, 19 ; 61.02-12,
    14) (catégorie 76), originaires de Bulgarie et mis en libre pratique dans les
    autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/717/EWG: Entscheidung der Kommission vom 27. Juli 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Bulgarien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Arbeits- und Berufskleidung aus
    Geweben, für Männer und Knaben; Schürzen, Kittel und andere Arbeits- und Berufskleidung
    aus Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle oder
    synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex 61.01 und ex
    61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-13, 15, 17, 19 und
    61.02-12, 14) (Kategorie 76) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/717/EØF: Kommissionens beslutning af 27. juli 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage arbejds- og
    beskyttelsesbeklædning, vævet, til mænd og drenge ; kitler og forklæder samt
    anden arbejds- og beskyttelsesbeklædning, vævet, til kvinder, piger og småbørn
    ; af uld, bomuld eller syntetiske eller regenererede fibre, som henhører under
    pos. ex 61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.01- 13 ;
    15 ; 17 ; 19 og 61.02-12 ; 14) kategori 76, har oprindelse i Bulgarien og frit
    kan omsættes i den øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/717/CEE: Decisione della Commissione, del 27 luglio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario gli indumenti da lavoro,
    tessuti, per uomo e per ragazzo, i grembiuli, i camiciotti e altri indumenti da
    lavoro, tessuti, per donna, per ragazza e per bambini, di lana, di cotone o di
    fibre tessili sintetiche o artificiali, della voce ex 61.01 e della sottovoce
    ex 61.02 B della tariffa doganale comune (codici Nimexe: 61.01-13, 15, 17, 19
    ; 61.02-12, 14), categoria 76, originari della Bulgaria e messi in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/717/EEG: Beschikking van de Commissie van 27 juli 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd geweven werk- en bedrijfskleding voor heren
    en jongens, geweven schorten, jasschorten en andere werkkleding voor dames, meisjes
    en kinderen, van wol, van katoen of van synthetische of kunstmatige textielvezels,
    van de posten ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code
    61.01-13, 15, 17, 19 ; 61.02- 12, 14) (categorie 76), van oorsprong uit Bulgarije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
