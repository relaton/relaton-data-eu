title:
- language: en
  script: Latn
  content: '79/733/EEC: Commission Decision of 2 August 1979 authorizing the French
    Republic not to apply Community treatment to cotton yarn, not put up for retail
    sale, falling within heading n° 55.05 of the Common Customs Tariff (NIMEXE codes
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) (category 1), originating in Pakistan and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/733/CEE: Décision de la Commission, du 2 août 1979, autorisant la
    République française à exclure du traitement communautaire les fils de coton
    non conditionnés pour la vente au détail, de la position 55.05 du tarif douanier
    commun (codes Nimexe : 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48,
    52, 58, 61, 65, 67, 69, 72, 78, 92, 98) (catégorie 1), originaires du Pakistan
    et mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/733/EWG: Entscheidung der Kommission vom 2. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Pakistan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 55.05 des gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    55.05-13 ; 19 ; 21 ; 25 ; 27 ; 29 ; 33 ; 35 ; 37 ; 41 ; 45 ; 46 ; 48 ; 52 ; 58
    ; 61 ; 65 ; 67 ; 69 ; 72 ; 78 ; 92 ; 98) (Kategorie 1) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/733/EØF: Kommissionens beslutning af 2. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage garn af bomuld,
    ikke i detailsalgsoplægninger, som henhører under pos. 55.05 i den fælles toldtarif
    (NIMEXE-nummer 55.05-13 ; 19 ; 21 ; 25 ; 27 ; 29 ; 33 ; 35 ; 37 ; 41 ; 45 ; 46
    ; 48 ; 52 ; 58 ; 61 ; 65 ; 67 ; 69 ; 72 ; 78 ; 92 ; 98) kategori 1, har oprindelse
    i Pakistan og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/733/CEE: Decisione della Commissione, del 2 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i filati di cotone
    non preparati per la vendita al minuto, della voce 55.05 della tariffa doganale
    comune (codici Nimexe: 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48,
    52, 58, 61, 65, 67, 69, 72, 78, 92, 98), categoria 1, originari del Pakistan e
    messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/733/EEG: Beschikking van de Commissie van 2 augustus 1979 waarbij de
    Franse Republiek wordt gemachtigd garens van katoen, niet gereed voor de verkoop
    in het klein, van post 55.05 van het gemeenschappelijk douanetarief (NIMEXE-code
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) (categorie 1), van oorsprong uit Pakistan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Franse taal is authentiek)'
