---
id: EUDecision1977429
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 May 1977 authorizing the Italian Republic not
    to apply Community treatment to essential oil of oranges, not terpeneless, falling
    within subheading 33.01 ex A of the Common Customs Tariff, originating in the
    Federative Republic of Brazil and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/429/CEE: Décision de la Commission, du 17 mai 1977, autorisant la
    République italienne à exclure du traitement communautaire les huiles essentielles
    non déterpenées d''orange, de la sous-position 33.01 Ex A du Tarif douanier
    commun, originaires de la République fédérale du Brésil et mises en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Mai 1977, mit der die Italienische
    Republik ermächtigt wird, die aus der Föderativen Republik Brasilien stammenden
    und in den anderen Mitgliedstaaten im freien Verkehr befindlichen ätherischen
    Öle von Süß- und Bitterorangen, nicht terpenfrei gemacht, der Tarifstelle 33.01
    ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. maj 1977 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage flygtige vegetabilske olier,
    ikke terpenfri, af appelsin- og pomeransskal, som henhører under pos. 33.01 ex
    A i den fælles toldtarif, har oprindelse i forbundsrepublikken Brasilien og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 maggio 1977, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli olii essenziali deterpenati
    di arancio della sottovoce 33.01 ex A della tariffa doganale comune, originari
    della Repubblica federativa del Brasile e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 mei 1977 waarbij de Italiaanse Republiek
    wordt gemachtigd etherische oliën, waaruit terpenen niet zijn afgesplitst, van
    sinaasappelen, van post 33.01 ex A van het gemeenschappelijk douanetarief, van
    oorsprong uit de Federatieve Republiek Brazilië en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
