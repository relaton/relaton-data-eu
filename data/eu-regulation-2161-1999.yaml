title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2161/1999 of 12 October 1999 imposing further
    testing requirements on the importers or manufacturers of a certain priority substance
    as foreseen under Council Regulation (EEC) No 793/93 on the evaluation and control
    of the risks of existing substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2161/1999 de la Commission, du 12 octobre 1999, imposant
