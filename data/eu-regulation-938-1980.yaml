id: EURegulation9381980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 938/80 of 14 April 1980 re-establishing
    the levying of customs duties on babies' under garments, knitted or crocheted,
    not elastic or rubberized, products of category 68 (code 0680), originating in
    the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 938/80 de la Commission, du 14 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, pour bébés, de la catégorie
    68 (code 0680), originaires des Philippines, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 938/80 der Kommission vom 14. April 1980 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, für Säuglinge, der Warenkategorie Nr. 68 (Kennziffer 0680),
    mit Ursprung in den Philippinen, denen die in der Verordnung (EWG) Nr. 2894/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 938/80 af 14. april 1980 om genindførelse
    af opkrævning af toldafgifter, ikke elastisk eller gummeret til spædbørn, under
    varekategori nr. 68 (kode 0680), som har oprindelse i Filippinerne og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 938/80 della Commissione, del 14 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata, per bambini piccoli (bébés), della categoria di prodotti
    n. 68 (codice 0680), originarie delle Filippine beneficiarie delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 938/80 van de Commissie van 14 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, voor baby' s, van
    de categorie van produkten nr. 68 (codenummer 0680), van oorsprong uit de Filippijnen
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
