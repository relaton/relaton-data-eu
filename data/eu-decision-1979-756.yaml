type: standard
title:
- language: en
  script: Latn
  content: '79/756/EEC: Commission Decision of 8 August 1979 authorizing the French
    Republic not to apply Community treatment to blouses and shirt-blouses, knitted
    or crocheted (not elastic or rubberized), or woven, for women, girls and infants,
    of wool, of cotton or of man- made textile fibres, falling within subheadings
    ex 60.05 A II and ex 61.02 B of the Common Customs Tariff (NIMEXE codes 60.05-22,
    23, 24, 25 ; 61.02-78, 82, 84) (category 7), originating in Pakistan and in free
    circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/756/CEE: Décision de la Commission, du 8 août 1979, autorisant la
    République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie (non élastique ni caoutchoutée),
    tissés, pour femmes, fillettes et jeunes enfants, de laine, de coton, ou de fibres
    textiles synthétiques ou artificielles des sous-positions ex 60.05 A II et ex
    61.02 B du tarif douanier commun (codes Nimexe : 60.05-22, 23, 24, 25 ; 61.02-78,
    82, 84) (catégorie 7) originaires du Pakistan et mis en libre pratique dans les
    autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/756/EWG: Entscheidung der Kommission vom 8. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Pakistan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken
    (weder gummielastisch noch kautschutiert) oder Geweben, für Frauen, Mädchen
    und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen,
    der Tarifstellen ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-
    Kennziffern 60.05-22 ; 23 ; 24 ; 25 und 61.02-78 ; 82 ; 84) (Kategorie 7) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/756/EØF: Kommissionens beslutning af 8. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage skjorter, skjortebluser
    og bluser af trikotage (ikke elastisk eller gummeret) eller vævede til kvinder,
    piger og småbørn, af uld, bomuld eller syntetiske eller regenererede fibre,
    som henhører under pos. ex 60.05 A II og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-22, 23, 24, 25 ; 61.02-78, 82, 84 ; kategori 7), har oprindelse i Pakistan
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/756/CEE: Decisione della Commissione, dell''8 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie, camicette
    e bluse a maglia (non elastica né gommata) o tessute, per donna, per ragazza
    e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    delle sottovoci ex 60.05 A II e ex 61.02 B della tariffa doganale comune (codici
    Nimexe: 60.05-22, 23, 24, 25 - 61.02-78, 82, 84) (categoria 7), originarie del
    Pakistan e messe in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/756/EEG: Beschikking van de Commissie van 8 augustus 1979 waarbij de
    Franse Republiek wordt gemachtigd blouses, overhemdblouses, van brei- of haakwerk
    (niet- elastisch, niet-gegummeerd) of geweven, voor dames, meisjes en kinderen,
    van wol, van katoen of van kunstmatige textielvezels, van de posten ex 60.05 A
    II en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-22,
    23, 24, 25; 61.02-78, 82, 84) (categorie 7), van oorsprong uit Pakistan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
