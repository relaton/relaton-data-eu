title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 141/90 of 19 January 1990 amending Regulation
    (EEC) No 1780/89 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in articles 35, 36 and 39 of Council
    Regulation (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 141/90 de la Commission du 19 janvier 1990 modifiant
    le règlement (CEE) n° 1780/89 établissant les modalités d'application relatives
    à l'écoulement des alcools obtenus au titre des distillations visées aux articles
    35, 36 et 39 du règlement (CEE) n° 822/87 et détenus par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 141/90 DER KOMMISSION vom 19. Januar 1990 zur Aenderung
    der Verordnung (EWG) Nr. 1780/89 mit Durchfuehrungsbestimmungen fuer den Absatz
    von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der Verordnung
    (EWG) Nr. 822/87 des Rates aus Bestaenden der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 141/90 af 19. januar 1990 om ændring
    af forordning (EØF) nr. 1780/89 om gennemførelsesbestemmelser for afsætning
    af alkohol, der er fremstillet i henhold til de i artikel 35, 36 og 39 i Rådets
    forordning (EØF) nr. 822/87 omhandlede destillationer, og som interventionsorganerne
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 141/90 της Επιτροπής
    της 19ης Ιανουαρίου 1990 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1780/89 για τη θέσπιση λεπτομερειών
    εφαρμογής σχετικά με τη διάθεση των αλκοολών
    που λαμβάνονται από τις αποστάξεις που αναφέρονται
    στα άρθρα 35, 36 και 39 του κανονισμού (ΕΟΚ) αριθ.
    822/87 και ευρίσκονται στην κατοχή των οργανισμών
    παρέμβασης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 141/90 DELLA COMMISSIONE del 19 gennaio 1990 recante
    quarta modifica del regolamento (CEE) n. 1780/89 che stabilisce le modalità di
    applicazione relative allo smercio degli alcoli ottenuti dalle distillazioni di
    cui agli articoli 35, 36 e 39 del regolamento (CEE) n. 822/87 del Consiglio e
    detenuti dagli organismi d'intervento
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 141/90 VAN DE COMMISSIE van 19 januari 1990 tot wijziging
    van Verordening (EEG) nr. 1780/89 tot vaststelling van de uitvoeringsbepalingen
    voor de afzet van alcohol die is verkregen bij distillatie als bedoeld in de artikelen
    35, 36 en 39 van Verordening (EEG) nr. 822/87 van de Raad en die in het bezit
    is van de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 141/90 DA COMISSAO de 19 de Janeiro de 1990 que altera
    o Regulamento (CEE) n* 1780/89 que estabelece as regras de execuçao relativas
    ao escoamento dos alcoois provenientes das destilaçoes referidas nos artigos
    35*, 36* e 39* do Regulamento (CEE) n* 822/87 do Conselho e detidos pelos organismos
    de intervençao
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 141/90 DE LA COMISION de 19 de enero de 1990 por el
    que se modifica el Reglamento (CEE) no 1780/89 por el que se establecen las disposiciones
    de aplicacion relativas a la salida al mercado de los alcoholes obtenidos con
    arreglo a las destilaciones contempladas en los articulos 35, 36 y 39 del Reglamento
    (CEE) no 822/87 del Consejo, en posesion de los organismos de intervencion
  type: main
