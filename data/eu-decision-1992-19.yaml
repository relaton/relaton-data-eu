    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '92/19/CEE: Decisione della Commissione, del 10 dicembre 1991, recante
    approvazione per la Danimarca dei criteri di cui all''articolo 2, paragrafo 4,
    lettera c) del regolamento (CEE) n. 1637/91 che fissa un''indennità relativa
    alla riduzione dei quantitativi di riferimento previsti all''articolo 5 quater
    del regolamento (CEE) n. 804/68 e un''indennità per l''abbandono definitivo della
    produzione lattiera (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/19/EEG: Beschikking van de Commissie van 10 december 1991 houdende
    goedkeuring van de door Denemarken meegedeelde criteria als bedoeld in artikel
    2, lid 4, onder c), van Verordening (EEG) nr. 1637/91 tot vaststelling van een
    vergoeding met betrekking tot de verlaging van de in artikel 5 quater van Verordening
