title:
- language: en
  script: Latn
  content: '92/19/EEC: Commission Decision of 10 December 1991 approving the criteria
    relating to Denmark as referred to in Article 2 (4) (c) of Council Regulation
    (EEC) No 1637/91 fixing compensation with regard to the reduction of the reference
    quantities referred to in Article 5c of Regulation (EEC) No 804/68 and compensation
    for the definitive discontinuation of milk production (Only the Danish text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/19/CEE: Décision de la Commission, du 10 décembre 1991, portant approbation
    pour le Danemark des critères visés à l''article 2 paragraphe 4 point c) du
    règlement (CEE) n° 1637/91 fixant une indemnité relative à la réduction des
    quantités de référence visées à l''article 5 quater du règlement (CEE) n°
    804/68 et une indemnité à l''abandon définitif de la production laitière (Le
    texte en langue danoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/19/EWG: Entscheidung der Kommission vom 10. Dezember 1991 zur Genehmigung
    der von Dänemark festgelegten, in Artikel 2 Absatz 4 Buchstabe c) der Verordnung
    (EWG) Nr. 1637/91 des Rates zur Festsetzung einer Vergütung für die Verringerung
    der Referenzmengen nach Artikel 5c der Verordnung (EWG) Nr. 804/68 und einer Vergütung
    bei der endgültigen Aufgabe der Milcherzeugung genannten Kriterien (Nur der dänische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/19/EØF: Kommissionens beslutning af 10. december 1991 om godkendelse
    for Danmark af de kriterier, der er omhandlet i artikel 2, stk. 4, litra c), i
    Rådets forordning (EØF) nr. 1637/91 om fastsættelse af en godtgørelse i forbindelse
    med nedsættelsen af de i artikel 5c i forordning (EØF) nr. 804/68 omhandlede
    referencemængder og af en godtgørelse for definitivt ophør med mælkeproduktion
    (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/19/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Δεκεμβρίου
    1991 για την έγκριση από τη Δανία των κριτηρίων
    που αναφέρονται στο άρθρο 2, παράγραφος 4, στοιχείο
    γ), του κανονισμού (ΕΟΚ) αριθ. 1637/91 περί αποζημιώσεως
    της μείωσης των ποσοτήτων αναφοράς που αναφέρονται
