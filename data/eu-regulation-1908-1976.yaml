title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1908/76 of 30 July 1976 determining the
    amounts applicable as accession compensatory amounts during the month of August
    1976 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1908/76 de la Commission, du 30 juillet 1976, déterminant
    les montants applicables à titre de montants compensatoires «adhésion» pendant
    le mois d'août 1976 à certains produits des secteurs des céréales et du riz
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1908/76 der Kommission vom 30. Juli 1976 zur Festsetzung
    der im August 1976 als Beitrittsausgleichsbeträge geltenden Beträge für bestimmte
    Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1908/76 af 30. juli 1976 om fastsættelse
    af de beløb, der i august 1976 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1908/76 della Commissione, del 30 luglio 1976, che
    determina gli importi compensativi «adesione» applicabili, durante il mese di
    agosto 1976, a taluni prodotti dei settori dei cereali e del riso esportati sotto
    forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1908/76 van de Commissie van 30 juli 1976 houdende
    vaststelling van de bedragen die gedurende de maand augustus 1976 als compenserende
    bedragen ,,toetreding" moeten worden toegepast voor bepaalde produkten van de
    sector granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage
    II van het Verdrag vallende goederen
  type: main
