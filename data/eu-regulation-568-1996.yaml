title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 568/96 of 29 March 1996 determining to what
    extent applications for import licences for calves not exceeding 80 kilograms
    lodged pursuant to Regulation (EC) No 403/96 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 568/96 DE LA COMMISSION du 29 mars 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CE) n° 403/96 relatif à l'importation
    de veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 568/96 DER KOMMISSION vom 29. März 1996 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Erteilung von Lizenzen für die Einfuhr
    von höchstens 80 kg wiegenden Rindern gemäß der Verordnung (EG) Nr. 403/96
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 568/96 af 29. marts 1996 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for kalve
    på ikke over 80 kg i henhold til forordning (EF) nr. 403/96 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 568/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Μαρτίου 1996 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 403/96 για την εισαγωγή
    μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 568/96, annettu 29 päivänä maaliskuuta 1996,
    asetuksen (EY) N:o 403/96 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 568/96 DELLA COMMISSIONE del 29 marzo 1996 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel quadro del regolamento (CE) n. 403/96 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 568/96 VAN DE COMMISSIE van 29 maart 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om afgifte van invoercertificaten
    die zijn ingediend op grond van Verordening (EG) nr. 403/96 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 568/96 DA COMISSÃO de 29 de Março de 1996 que determina
    em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados ao abrigo do Regulamento (CE) nº 3018/95 relativo
    à importação de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 568/96 DE LA COMISIÓN de 29 de marzo de 1996 por el
    que se determina en qué medida se podrá dar curso a las solicitudes de expedición
    de certificados de importación presentadas con arreglo al Reglamento (CE) n°
    403/96 relativo a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 568/96 av den 29 mars 1996 om fastställande
    av i vilken utsträckning ansökningar om importlicenser som lämnats in i enlighet
    med förordning (EG) nr 403/96 angående import av kalvar som väger högst 80
    kg kan godkännas
  type: main
