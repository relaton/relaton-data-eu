title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1710/83 of 24 June 1983 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres not put up for
    retail sale, products of category 41 (code 0410), originating in Thailand, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1710/83 de la Commission du 24 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux fils de fibres textiles
    synthétiques, non conditionnés pour la vente au détail, de la catégorie 41
    (code 0410), originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1710/83 der Kommission vom 24. Juni 1983 über die
    Wiedereinführung des Zollsatzes für synthetische Spinnfäden, nicht in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 41 (Kennziffer 0410), mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1710/83 af 24. juni 1983 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse syntetiske fibre, ikke i
    detailsalgsoplægninger, under varekategori nr. 41 (kode 0410), som har oprindelse
    i Thailand og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1710/83 της Επιτροπής
    της 24ης Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα νήματα
    εκ συνθετικών ή τεχνητών υφαντικών ινών συνεχών,
    μη συσκευασμένα για τη λιανική πώληση, της
    κατηγορίας προϊόντων 41 (κωδικός αριθμός 0410),
    καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1710/83 della Commissione del 24 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai filati di fibre tessili sintetiche
    continue, non preparati per la vendita al minuto, della categoria di prodotti
    n. 41 (codice 0410), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1710/83 van de Commissie van 24 juni 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische vezels, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 41 (codenummer 0410) van oorsprong uit Thailand waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
