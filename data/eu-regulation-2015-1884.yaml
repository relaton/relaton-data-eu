title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1884 of 20 October 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entries for Canada and the
    United States in the list of third countries, territories, zones or compartments
    from which poultry and poultry products may be imported into or transit through
    the Union in relation to highly pathogenic avian influenza outbreaks in these
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1884 de la Commission du 20 octobre 2015
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives au Canada et aux États-Unis sur la liste des pays tiers, territoires,
    zones ou compartiments en provenance desquels certaines volailles et certains
    produits de volailles peuvent être importés dans l'Union ou transiter par celle-ci,
    à la suite de l'apparition de foyers d'influenza aviaire hautement pathogène
    dans ces pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/1884 der Kommission vom 20. Oktober
    2015 zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich
    der Einträge zu Kanada und den Vereinigten Staaten in der Liste von Drittländern,
    Gebieten, Zonen und Kompartimenten, aus denen Geflügel und Geflügelerzeugnisse
    in die Union eingeführt bzw. durch die Union durchgeführt werden dürfen, im
    Zusammenhang mit Ausbrüchen der hochpathogenen Aviären Influenza in diesen Ländern
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/1884 на Комисията
    от 20 октомври 2015 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписванията
    за Канада и Съединените щати в списъка на третите
    държави, територии, зони или компартменти,
    от които са разрешени вносът и транзитът през
    Съюза на домашни птици и продукти от домашни
    птици, във връзка с появата на огнища от високопатогенна
    инфлуенца по птиците в тези държави
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/1884 ze dne 20. října 2015,
    kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položky
    týkající se Kanady a Spojených států amerických na seznamu třetích zemí,
    území, oblastí nebo jednotek, z nichž lze do Unie dovážet nebo přes její
    území přepravovat drůbež a drůbeží produkty, v souvislosti s ohnisky vysoce
    patogenní influenzy ptáků v těchto zemích
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/1884 af 20. oktober 2015
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Canada og USA i listen over tredjelande, områder, zoner og segmenter, hvorfra
    import til eller transit gennem Unionen af fjerkræ og fjerkræprodukter er tilladt
    i forbindelse med udbrud af højpatogen aviær influenza i disse lande
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/1884 της Επιτροπής,
