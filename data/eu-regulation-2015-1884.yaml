    do wpisów dotyczących Kanady i Stanów Zjednoczonych w wykazie państw trzecich,
    terytoriów, stref lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt
    przez jej terytorium drobiu oraz produktów drobiowych, w związku z wystąpieniem
    w tych państwach ognisk wysoce zjadliwej grypy ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/1884 da Comissão, de 20 de outubro
