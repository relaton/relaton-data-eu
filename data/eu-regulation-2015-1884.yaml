    Savienotajām Valstīm to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā,
    no kuriem attiecībā uz augsti patogēnās putnu gripas uzliesmojumiem minētajās
    valstīs atļauts Savienībā importēt vai tranzītā caur to pārvadāt mājputnus
    un mājputnu produktus
  type: main
- language: lt
  script: Latn
  content: 2015 m. spalio 20 d. Komisijos įgyvendinimo reglamentas (ES) 2015/1884,
