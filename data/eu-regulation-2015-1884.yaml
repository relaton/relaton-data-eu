    às entradas relativas ao Canadá e aos Estados Unidos na lista de países terceiros,
    territórios, zonas ou compartimentos a partir dos quais são autorizados a importação
    e o trânsito na União de aves de capoeira e produtos à base de aves de capoeira,
    relativamente aos surtos de gripe aviária de alta patogenicidade nesses países
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/1884 al Comisiei din 20 octombrie
    2015 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubricile referitoare la Canada și Statele Unite din lista cu țări terțe,
    teritorii, zone sau compartimente din care păsările de curte și produsele obținute
    de la păsări de curte pot fi importate în Uniune sau pot tranzita Uniunea în
    contextul apariției unor focare de gripă aviară înalt patogenă în țările
    respective
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/1884 z 20. októbra 2015, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položky týkajúce
    sa Kanady a Spojených štátov amerických v zozname tretích krajín, území,
    oblastí alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej
    územie prevážať hydinu a výrobky z hydiny v súvislosti s ohniskami vysokopatogénnej
    aviárnej influenzy v daných krajinách
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/1884 z dne 20. oktobra 2015 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosov za Kanado in Združene države
    Amerike na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih
    je dovoljen uvoz perutnine in perutninskih proizvodov v Unijo ali njihov tranzit
    skozi Unijo, v zvezi z izbruhi visokopatogene aviarne influence v navedenih državah
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/1884 de la Comisión, de 20 de octubre
    de 2015, por el que se modifica el anexo I del Reglamento (CE) n° 798/2008 en
    lo que respecta a las entradas de Canadá y los Estados Unidos en la lista de
    terceros países, territorios, zonas o compartimentos desde los cuales están
    permitidos la importación en la Unión o el tránsito por esta de aves de corral
    y productos derivados, en relación con los brotes de influenza aviar de alta
    patogenicidad en estos países
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/1884 av den 20 oktober
    2015 om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Kanada och Förenta staterna i förteckningen över tredjeländer, områden,
    zoner eller delområden från vilka fjäderfä och fjäderfäprodukter får importeras
    till eller transiteras genom unionen i samband med utbrott av högpatogen aviär
    influensa i de länderna
