    Države na popisu trećih zemalja, državnih područja, zona ili kompartmenta
    iz kojih je dozvoljen uvoz i provoz peradi i proizvoda od peradi kroz Uniju u
    vezi s izbijanjem visokopatogene influence ptica u tim zemljama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/1884 végrehajtási rendelete (2015. október 20.)
    a 798/2008/EK rendelet I. mellékletének a baromfi és baromfitermékek Unióba
    történő behozatala vagy Unión keresztül történő átszállítása céljából
    engedélyezett harmadik országok, területek, övezetek és területi egységek
    jegyzékében a Kanadára és az Amerikai Egyesült Államokra vonatkozó bejegyzés
    tekintetében az erősen patogén vírustörzsek okozta madárinfluenza ezen országokban
    való megjelenése nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/1884 della Commissione, del 20 ottobre
    2015, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    le voci relative al Canada e agli Stati Uniti nell'elenco di paesi terzi, loro
    territori, zone o compartimenti da cui sono consentiti le importazioni e il transito
    nell'Unione di pollame e di prodotti a base di pollame, in relazione alla comparsa
    di focolai di influenza aviaria ad alta patogenicità in tali paesi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/1884 (2015. gada 20. oktobris),
