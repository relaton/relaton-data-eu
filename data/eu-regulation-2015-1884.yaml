    Kanados ir Jungtinių Amerikos Valstijų įrašų trečiųjų šalių, teritorijų,
    zonų ar skyrių, iš kurių galima importuoti į Sąjungą ir vežti tranzitu
    per Sąjungą tam tikrus naminius paukščius ir jų produktus, sąraše iš dalies
