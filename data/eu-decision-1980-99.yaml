title:
- language: en
  script: Latn
  content: '80/99/EEC: Commission Decision of 18 December 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1976 on aids and premiums relating to the modernization of farms including
    those in the less-favoured farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/99/CEE: Décision de la Commission, du 18 décembre 1979, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des dépenses effectuées pendant
    l''année 1976 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/99/EWG: Entscheidung der Kommission vom 18. Dezember 1979 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an das Vereinigte Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/99/EØF: Kommissionens beslutning af 18. december 1979 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af udgifter, som
    er afholdt i løbet af året 1976 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, også i ugunstigt stillede områder (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/99/CEE: Decisione della Commissione, del 18 dicembre 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno Unito delle spese
    effettuate durante il 1976 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/99/EEG: Beschikking van de Commissie van 18 december 1979 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk voor
    de in 1976 verrichte uitgaven voor steun en premies met betrekking tot de modernisering
    van landbouwbedrijven waaronder mede begrepen die in probleemgebieden in de landbouw
    (Slechts de tekst in de Engelse taal is authentiek)'
