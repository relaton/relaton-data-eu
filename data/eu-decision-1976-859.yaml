title:
- language: en
  script: Latn
  content: Commission Decision of 4 November 1976 specifying the extent to which applications
    for import licences lodged between 18 and 22 October 1976 for young bovine animals
    of highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/859/CEE: Décision de la Commission, du 4 novembre 1976, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 18 au 22 octobre 1976 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. November 1976 darüber, inwieweit den
    vom 18. bis 22. Oktober 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder
    der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. november 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicencer, som er indgivet i perioden fra den 18. til den
    22. oktober 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 novembre 1976, che determina in quale
    misura può essere dato seguito alle domande di titoli d'importazione, presentate
    dal 18 al 22 ottobre 1976, per i giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 november 1976 tot vaststelling van de
    mate waarin de van 18 tot en met 22 oktober 1976 ingediende aanvragen om afgifte
    van invoercertificaten voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
  type: main
