title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 993/2004 of 17 May 2004 amending Regulation
    (EC) No 658/2002 imposing a definitive anti-dumping duty on imports of ammonium
    nitrate originating in Russia and Regulation (EC) No 132/2001 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of ammonium nitrate originating in Poland and Ukraine, and terminating
    the anti-dumping proceeding in respect of imports originating in Lithuania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 993/2004 du Conseil du 17 mai 2004 modifiant les règlements
    (CE) n° 658/2002 instituant un droit antidumping définitif sur les importations
    de nitrate d’ammonium originaire de Russie et (CE) n° 132/2001 instituant un
    droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de nitrate d’ammonium originaire de Pologne et
    d’Ukraine et clôturant la procédure antidumping à l’encontre des importations
    originaires de Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 993/2004 des Rates vom 17. Mai 2004 Änderung der Verordnung
    (EG) Nr. 658/2002 zur Einführung eines endgültigen Antidumpingzolls auf die
    Einfuhren von Ammoniumnitrat mit Ursprung in Russland und zur Änderung der Verordnung
    (EG) Nr. 132/2001 zur Einführung eines endgültigen Antidumpingzolls und zur
    endgültigen Vereinnahmung des vorläufigen Zolls auf die Einfuhren von Ammoniumnitrat
    mit Ursprung in Polen und der Ukraine sowie zur Einstellung des Antidumpingverfahrens
    die Einfuhren mit Ursprung in Litauen betreffend
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 993/2004 на Съвета от 17 май
    2004 година за изменение на Регламент (ЕО) № 658/2002
    на Съвета за налагане на окончателно антидъмпингово
    мито върху вноса на амониев нитрат с произход
    от Русия и Регламент (ЕО) № 132/2001 за налагане
    на окончателно антидъмпингово мито и окончателно
    събиране на временното мито, наложено за вноса
    на амониев нитрат с произход от Полша и Украйна
    и за прекратяване на антидъмпинговата процедура
    на вноса с произход от Литва
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 993/2004 ze dne 17. května 2004, kterým se
    mění nařízení (ES) č. 658/2002 o uložení konečného antidumpingového
    cla z dovozu dusičnanu amonného pocházejícího z Ruska a nařízení (ES)
    č. 132/2001 o uložení konečného antidumpingového cla z dovozu dusičnanu
    amonného pocházejícího z Polska a Ukrajiny a o konečném výběru prozatímního
    cla uloženého z těchto dovozů a o ukončení antidumpingového řízení týkajícího
    se dovozu z Litvy
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 993/2004 af 17. maj 2004 om ændring af forordning
    (EF) nr. 658/2002 om indførelse af en endelig antidumpingtold på importen af
    ammoniumnitrat med oprindelse i Rusland og forordning (EF) nr. 132/2001 om indførelse
    af en endelig antidumpingtold og om endelig opkrævning af den midlertidige told
    på import af ammoniumnitrat med oprindelse i Polen og Ukraine og om afslutning
    af antidumpingproceduren for så vidt angår import med oprindelse i Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 993/2004 του Συμβουλίου,
    της 17ης Μαΐου 2004, για την τροποποίηση των κανονισμών
    (ΕΚ) αριθ. 658/2002 για την επιβολή οριστικού δασμού
    αντιντάμπινγκ επί των εισαγωγών νιτρικού αμμωνίου,
    καταγωγής Ρωσίας, και (EΚ) αριθ. 132/2001 για την
    επιβολή οριστικού δασμού αντιντάμπινγκ και
    την οριστική είσπραξη του προσωρινού δασμού
    αντιντάμπινγκ στις εισαγωγές νιτρικού αμμωνίου,
    καταγωγής Πολωνίας και Ουκρανίας, καθώς και
    για την περάτωση της διαδικασίας αντιντάμπινγκ
    όσον αφορά τις εισαγωγές, καταγωγής Λιθουανίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 993/2004, 17. mai 2004, millega muudetakse määrust
    (EÜ) nr 658/2002, millega Venemaalt pärineva ammooniumnitraadi impordi suhtes
    kehtestatakse lõplik dumpinguvastane tollimaks, ja määrust (EÜ) nr 132/2001,
    millega kehtestatakse Poolast ja Ukrainast pärineva ammooniumnitraadi impordi
    suhtes lõplik dumpinguvastane tollimaks ja nõutakse lõplikult sisse selle suhtes
    kehtestatud ajutine tollimaks ning millega lõpetatakse Leedust pärineva impordi
    suhtes kohaldatav dumpinguvastane menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 993/2004, annettu 17 päivänä toukokuuta 2004,
    lopullisen polkumyyntitullin käyttöönotosta Venäjältä peräisin olevan ammoniumnitraatin
    tuonnissa annetun asetuksen (EY) N:o 658/2002 ja lopullisen polkumyyntitullin
    käyttöönotosta ja väliaikaisen tullin lopullisesta kantamisesta Puolasta ja
    Ukrainasta peräisin olevan ammoniumnitraatin tuonnissa sekä polkumyynnin vastaisen
    menettelyn päättämisestä Liettuasta peräisin olevan tuonnin osalta annetun
    asetuksen (EY) N:o 132/2001 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 993/2004 od 17. svibnja 2004. o izmjeni Uredbe
    (EZ) br. 658/2002 o uvođenju konačne antidampinške pristojbe na uvoz amonijevog
    nitrata podrijetlom iz Rusije i Uredbe (EZ) br. 132/2001 o uvođenju konačne
    antidampinške pristojbe i konačnoj naplati privremene pristojbe uvedene na uvoz
    amonijevog nitrata podrijetlom iz Poljske i Ukrajine, i završetku antidampinškog
    postupka u vezi s uvozom podrijetlom iz Litve
  type: main
- language: hu
  script: Latn
  content: A Tanács 993/2004/EK rendelete (2004. május 17.) az Oroszországból
    származó ammónium-nitrát behozatalára vonatkozó végleges dömpingellenes
    vám kivetéséről szóló 658/2002/EK rendelet és a Lengyelországból és
    Ukrajnából származó ammónium-nitrát behozatalára vonatkozó végleges dömpingellenes
    vám kivetéséről és a kivetett ideiglenes vám végleges beszedéséről,
    valamint a Litvániából származó behozatal tekintetében a dömpingellenes
    eljárás megszüntetéséről szóló 132/2001/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 993/2004 del Consiglio, del 17 maggio 2004, che modifica
    i regolamenti (CEE) n. 658/2002 che istituisce un dazio antidumping definitivo
    sulle importazioni di nitrato di ammonio originario della Russia e (CE) n. 132/2001
    che istituisce un dazio antidumping definitivo, riscuote definitivamente il dazio
    provvisorio istituito sulle importazioni di nitrato d’ammonio originario della
    Polonia e dell’Ucraina e chiude il procedimento antidumping per quanto riguarda
    le importazioni originarie della Lituania
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 993/2004 (2004. gada 17. maijs), ar kuru groza
    Regulu (EK) Nr. 658/2002, ar ko nosaka galīgu antidempinga maksājumu attiecībā
    uz Krievijas izcelsmes amonija nitrāta importu, un Regulu (EK) Nr. 132/2001,
    ar ko nosaka galīgu antidempinga maksājumu un galīgi iekasē pagaidu maksājumu,
    kurš uzlikts Polijas un Ukrainas izcelsmes amonija nitrāta importam, un izbeidz
    antidempinga procesu attiecībā uz Lietuvas izcelsmes importu
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 17 d. Tarybos reglamentas (EB) Nr. 993/2004 iš dalies
    keičiantis Reglamentą (EB) Nr. 658/2002 dėl importuojamo amonio nitrato, kurio
    kilmės šalis yra Rusija, apmokestinimo galutiniu antidempingo muitu ir Reglamentą
    (EB) Nr. 132/2001 dėl importuojamo amonio nitrato, kurio kilmės šalys yra Lenkija
    ir Ukraina, apmokestinimo galutiniu antidempingo muitu ir laikino muito galutinio
    surinkimo, bei Lietuvos kilmės importui taikomos antidempingo procedūros nutraukimo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 993/2004 tas- 17 ta' Mejju 2004 li jemenda
    r-Regolamenti (KE) Nru 658/2002 li jimponi dazju anti-dumping definittiv fuq importazzjonijiet
    ta' ammonium nitrate li joriġinaw mir-Russja u (KE) Nru 132/2001 li jimponi dazju
    anti-dumping definittiv u li jiġbor definittivament id-dazju provviżorju impost
    fuq importazzjonijiet ta' ammonium nitrate li joriġinaw mill-Polonja u l-Ukrajna,
    u li jtemm il-proċedura anti-dumping fir-rigward ta' importazzjonijiet li joriġinaw
    mil-Litwanja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 993/2004 van de Raad van 17 mei 2004 houdende wijziging
    van Verordening (EG) nr. 658/2002 tot instelling van een definitief antidumpingrecht
    op de invoer van ammoniumnitraat van oorsprong uit Rusland en van Verordening
    (EG) nr. 132/2001 tot instelling van definitieve antidumpingrechten en tot definitieve
    inning van de voorlopige antidumpingrechten op ammoniumnitraat uit Polen en Oekraïne
    en tot beëindiging van de antidumpingprocedure ten aanzien van Litouwen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 993/2004 z dnia 17 maja 2004 r. zmieniające
    rozporządzenie (WE) nr 658/2002 nakładające ostateczne cło antydumpingowe
    na przywóz azotanu amonu pochodzącego z Rosji i rozporządzenie (WE) nr 132/2001
    nakładające ostateczne cło antydumpingowe i ustanawiające ostateczne pobranie
    tymczasowego cła nałożonego na przywóz azotanu amonu pochodzącego z Polski
    i Ukrainy oraz kończące postępowanie w odniesieniu do przywozu pochodzącego
    z Litwy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 993/2004 do Conselho, de 17 de Maio de 2004, que
    altera o Regulamento (CE) n.° 658/2002 que cria um direito anti-dumping definitivo
    sobre as importações de nitrato de amónio originário da Rússia, bem como
    o Regulamento (CE) n.° 132/2001 que cria um direito anti-dumping definitivo e
    que estabelece a cobrança definitiva do direito provisório instituído sobre
    as importações de nitrato de amónio originário da Polónia e da Ucrânia,
    e que encerra o processo anti-dumping relativo às importações originárias
    da Lituânia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 993/2004 al Consiliului din 17 mai 2004 de modificare
    a Regulamentului (CE) nr. 658/2002 de instituire a unui drept antidumping definitiv
    la importurile de nitrat de amoniu originar din Rusia și a Regulamentului (CE)
    nr. 132/2001 de instituire a unui drept antidumping definitiv și de percepere
    definitivă a dreptului provizoriu instituit la importurile de nitrat de amoniu
    originar din Polonia și din Ucraina și de încheiere a procedurii antidumping
    privind importurile originare din Lituania
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 993/2004 zo 17. mája 2004, ktorým sa menia a
    dopĺňajú nariadenia (ES) č. 658/2002, ktorým sa ukladá konečné antidumpingové
    clo na dovozy dusičnanu amónneho s pôvodom v Rusku, a (ES) č. 132/2001, ktorým
    sa ukladá konečné antidumpingové clo a s konečnou platnosťou vyberá dočasné
    clo uložené na dovozy dusičnanu amónneho s pôvodom v Poľsku a na Ukrajine,
    a ktorým sa zastavuje antidumpingové konanie týkajúce sa dovozov s pôvodom
    v Litve
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 993/2004 z dne 17. maja 2004 o spremembi Uredb (ES)
    št. 658/2002 o uvedbi dokončne protidampinške dajatve za uvoz amonijevega nitrata
    s poreklom iz Rusije in (ES) št. 132/2001 o uvedbi dokončne protidampinške
    dajatve za uvoz in o dokončnem pobiranju začasne dajatve, uvedene za uvoz amonijevega
    nitrata s poreklom iz Poljske in Ukrajine ter o ustavitvi protidampinškega postopka
    v zvezi z uvozom blaga s poreklom iz Litve
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 993/2004 del Consejo, de 17 de mayo de 2004, por el
    que se modifican el Reglamento (CE) n° 658/2002, por el que se establece un derecho
    antidumping definitivo sobre las importaciones de nitrato de amonio originarias
    de Rusia y el Reglamento (CE) n° 132/2001, por el que se establece un derecho
    antidumping definitivo, por el que se perciben definitivamente los derechos provisionales
    impuestos sobre las importaciones de nitrato de amonio originarias de Polonia
    y Ucrania, y por el que se da por concluido el procedimiento antidumping por lo
    que se refiere a las importaciones originarias de Lituania
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 993/2004 av den 17 maj 2004 om ändring av
    förordningarna (EG) nr 658/2002 om införande av en slutgiltig antidumpningstull
    på import av ammoniumnitrat med ursprung i Ryssland och (EG) nr 132/2001 om införande
    av en slutgiltig antidumpningstull och slutgiltigt uttag av den preliminära antidumpningstull
    som införts på import av ammoniumnitrat med ursprung i Polen och Ukraina och
    om avslutande av antidumpningsförfarandet rörande import med ursprung i Litauen
  type: main
