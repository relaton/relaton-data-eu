title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1360/81 of 20 May 1981 re-establishing the
    levying of customs duties on tapestries, hand-made, products of category 60 (code
    0600), originating in Brazil, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1360/81 de la Commission, du 20 mai 1981, portant
    rétablissement de la perception des droits de douane applicables aux tapisseries
    faites à la main, de la catégorie 60 (code 0600), originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1360/81 der Kommission vom 20. Mai 1981 über die
    Wiedereinführung des Zollsatzes für Tapisserien, handgefertigt, der Warenkategorie
    Nr. 60 (Kennziffer 0600) mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1360/81 af 20. maj 1981 om genindførelse
    af opkrævning af toldafgifter for håndfremstillede tapisserier, under kategori
    60 (kode 0600), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1360/81 τής Επιτροπής
    τής 20ής Μαΐου 1981 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά είδη επιστρώσεων, υφασμένα
    διά χειρός, τών προϊόντων τής κατηγορίας αριθ.
    60 (κώδικας 0600), καταγωγής Βραζιλίας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1360/81 della Commissione, del 20 maggio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli arazzi tessuti a
    mano della categoria di prodotti n. 60 (codice 0600), originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1360/81 van de Commissie van 20 mei 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapisserieën,
    met de hand geweven, van de categorie van produkten nr. 60 (codenummer 0600),
    van oorsprong uit Brazilië, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
