title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1889/78 of 2 August 1978 re-establishing
    the levying of customs duties on heavy oils, falling within subheadings 27.10
    C I c), C II c), C III c) and d) and originating in developing countries, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1889/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes des sous-positions 27.10 C I c), C II c), C III c) et C III d)
    du tarif douanier commun, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1889/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), C II c), C III c)
    und d) mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1889/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for tunge olier, under pos. 27.10 C I c), II c),
    III c) og d), som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1889/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio pesanti
    delle sottovoci doganali 27.10 C I c), 27.10 C II c), 27.10 C III c) e 27.10 C
    III d), originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1889/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zware oliën,
    van post 27.10 C I c), C II c), C III c) en d), van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
