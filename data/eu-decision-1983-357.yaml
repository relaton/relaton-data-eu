    ovine et de solipèdes domestiques en provenance des établissements de la République
    argentine autorisés à figurer jusqu'' au 30 juin 1983 sur la liste des établissements
    de la République argentine agréés pour l'' importation de viandes fraîches
    dans la Communauté'
  type: main
