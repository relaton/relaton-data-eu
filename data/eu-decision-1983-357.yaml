  content: '83/357/EEC: Commission Decision of 7 July 1983 on the date of unloading
    in Community territory of fresh meat of bovine, ovine and domestic soliped animals
    from establishments in the Argentine Republic authorized to appear until 30 June
    1983 on the list of establishments in the Argentine Republic approved for the
    purpose of importing fresh meat into the Community'
  type: main
- language: fr
  script: Latn
  content: '83/357/CEE: Décision de la Commission du 7 juillet 1983 concernant la
