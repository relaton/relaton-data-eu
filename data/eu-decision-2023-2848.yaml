title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/2848 of 9 November 2023 authorising the opening
    of negotiations for agreements, in the form of an Exchange of Letters, amending
    and supplementing the agreements for scientific and technological cooperation
    between the European Union and the People’s Democratic Republic of Algeria,
    the Arab Republic of Egypt, the Hashemite Kingdom of Jordan, the Republic of Lebanon
    and the Kingdom of Morocco, respectively, setting out the terms and conditions
    for their participation with regard to Horizon Europe in the Partnership for Research
    and Innovation in the Mediterranean Area (PRIMA) jointly undertaken by several
    Member States
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/2848 du Conseil du 9 novembre 2023 autorisant l’ouverture
    de négociations en vue de la conclusion d’accords, sous forme d’échange
    de lettres, modifiant et complétant les accords de coopération scientifique
    et technologique entre l’Union européenne et la République algérienne démocratique
    et populaire, la République arabe d’Égypte, le Royaume hachémite de Jordanie,
    la République libanaise et le Royaume du Maroc, respectivement, fixant les conditions
    et modalités de leur participation, au regard d’Horizon Europe, au partenariat
    en matière de recherche et d’innovation dans la zone méditerranéenne (PRIMA)
    entrepris conjointement par plusieurs États membres
  type: main
- language: de
  script: Latn
