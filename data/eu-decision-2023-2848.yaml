    o znanstvenoj i tehnološkoj suradnji između Europske unije i Alžirske Narodne
    Demokratske Republike, Arapske Republike Egipta, Hašemitske Kraljevine Jordana,
    Libanonske Republike odnosno Kraljevine Maroka, kojima se utvrđuju uvjeti za
