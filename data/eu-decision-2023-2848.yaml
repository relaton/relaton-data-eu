  script: Latn
  content: A Tanács (EU) 2023/2848 határozata (2023. november 9.) az Európai Unió,
    valamint az Algériai Demokratikus és Népi Köztársaság, az Egyiptomi Arab
    Köztársaság, a Jordán Hásimita Királyság, a Libanoni Köztársaság, illetve
    a Marokkói Királyság közötti, a több tagállam által együttesen indított,
    a földközi-tengeri térségben folytatott kutatási és innovációs partnerségben
    (PRIMA) a Horizont Európa tekintetében való részvételükre vonatkozó feltételeket
    meghatározó tudományos és technológiai együttműködési megállapodásokat
    módosító és kiegészítő, levélváltás formájában létrehozandó megállapodásokra
    irányuló tárgyalások megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/2848 del Consiglio, del 9 novembre 2023, che autorizza
    l’avvio di negoziati per la conclusione di accordi, in forma di scambio di lettere,
    che modifichino e integrino gli accordi di cooperazione scientifica e tecnologica
    tra l’Unione europea e la Repubblica algerina democratica e popolare, la Repubblica
    araba d’Egitto, il Regno hascemita di Giordania, la Repubblica libanese e il
    Regno del Marocco volti a stabilire, rispettivamente, i termini e le condizioni
    della loro partecipazione al partenariato per la ricerca e l’innovazione nell’area
    del Mediterraneo (PRIMA) nell’ambito di Orizzonte Europa avviato congiuntamente
    da diversi Stati membri
  type: main
