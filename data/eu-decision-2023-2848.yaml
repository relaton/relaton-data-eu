    iš dalies keičiami ir papildomi Europos Sąjungos ir atitinkamai Alžyro Liaudies
    Demokratinės Respublikos, Egipto Arabų Respublikos, Jordanijos Hašimitų Karalystės,
    Libano Respublikos ir Maroko Karalystės mokslinio ir technologinio bendradarbiavimo
    susitarimai, kuriais išdėstomos jų dalyvavimo, atsižvelgiant į programą
    Europos horizontas, kelių valstybių narių bendrai vykdomoje Partnerystėje
    mokslinių tyrimų ir inovacijų srityje Viduržemio jūros regione (PRIMA) sąlygos
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/2848 tad-9 ta’ Novembru 2023 li tawtorizza
    l-ftuħ ta’ negozjati għal ftehimiet, fil-forma ta’ skambju ta’ ittri,
    li jemendaw u jissupplimentaw il-ftehimiet għal kooperazzjoni xjentifika u teknoloġika
    bejn l-Unjoni Ewropea u r-Repubblika Demokratika tal-Poplu tal-Alġerija, ir-Repubblika
    Għarbija tal-Eġittu, ir-Renju Ħaxemita tal-Ġordan, ir-Repubblika Libaniża
    u r-Renju tal-Marokk, rispettivament, li jistabbilixxu t-termini u l-kundizzjonijiet
    tal-parteċipazzjoni tagħhom fir-rigward ta’ Orizzont Ewropa fis-Sħubija fir-Riċerka
    u l-Innovazzjoni fiż-Żona tal-Mediterran (PRIMA) imwettqa b’mod konġunt minn
    diversi Stati Membri
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/2848 van de Raad van 9 november 2023 tot machtiging tot
    het openen van onderhandelingen over overeenkomsten, in de vorm van een briefwisseling,
    tot wijziging en aanvulling van de overeenkomsten inzake wetenschappelijke en
    technologische samenwerking tussen de Europese Unie en respectievelijk de Democratische
    Volksrepubliek Algerije, de Arabische Republiek Egypte, het Hasjemitisch Koninkrijk
    Jordanië, de Republiek Libanon en het Koninkrijk Marokko, waarin de voorwaarden
    worden vastgelegd voor hun deelname aan het door verscheidene lidstaten gezamenlijk
    opgezette partnerschap voor onderzoek en innovatie in het Middellandse Zeegebied
    (het Prima-initiatief) wat Horizon Europa betreft
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/2848 z dnia 9 listopada 2023 r. w sprawie upoważnienia
    do podjęcia negocjacji dotyczących umów, w formie wymiany listów, zmieniających
    i uzupełniających umowy o współpracy naukowo-technicznej między Unią Europejską
    a Algierską Republiką Ludowo-Demokratyczną, Arabską Republiką Egiptu, Jordańskim
    Królestwem Haszymidzkim, Republiką Libańską i Królestwem Marokańskim, określających
    warunki uczestnictwa, w odniesieniu do programu Horyzont Europa, w partnerstwie
    w dziedzinie badań i innowacji w regionie Morza Śródziemnego (PRIMA) podjętym
    wspólnie przez szereg państw członkowskich
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/2848 do Conselho, de 9 de novembro de 2023, que autoriza
    a abertura de negociações tendo em vista acordos, sob a forma de troca de cartas,
    que alterem e completem os acordos de cooperação científica e tecnológica
    entre a União Europeia e a República Argelina Democrática e Popular, a República
    Árabe do Egito, o Reino Haxemita da Jordânia, a República do Líbano e o Reino
    de Marrocos, respetivamente, estabelecendo os termos e as condições da sua participação,
    no que respeita ao Horizonte Europa, na Parceria para a Investigação e a Inovação
    na Região Mediterrânica (PRIMA) empreendida conjuntamente por vários Estados-Membros
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/2848 a Consiliului din 9 noiembrie 2023 de autorizare
    a începerii negocierilor în vederea încheierii unor acorduri, sub forma unui
    schimb de scrisori, de modificare și de completare a acordurilor de cooperare
    științifică și tehnologică dintre Uniunea Europeană și Republica Algeriană
    Democratică și Populară, Republica Arabă Egipt, Regatul Hașemit al Iordaniei,
    Republica Libaneză și, respectiv, Regatul Maroc, de stabilire a clauzelor și
    condițiilor pentru participarea acestora, în ceea ce privește programul-cadru
    Orizont Europa, la Parteneriatul în domeniul cercetării și inovării în zona
    mediteraneeană (PRIMA) derulat în comun de mai multe state membre
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/2848 z 9. novembra 2023 o poverení začať
    rokovania o dohodách vo forme výmeny listov, ktorými sa menia a dopĺňajú
    jednotlivé dohody o vedeckej a technickej spolupráci medzi Európskou úniou
    a Alžírskou demokratickou ľudovou republikou, Egyptskou arabskou republikou,
    Jordánskym hášimovským kráľovstvom, Libanonskou republikou a Marockým kráľovstvom,
    ktorými sa stanovujú podmienky ich účasti v súvislosti s programom Horizont
    Európa na Partnerstve pre výskum a inováciu v oblasti Stredozemia (PRIMA),
    na ktorom sa spoločne podieľajú niektoré členské štáty
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/2848 z dne 9. novembra 2023 o pooblastilu za začetek
    pogajanj o sporazumih v obliki izmenjave pisem o spremembi in dopolnitvi sporazumov
    o znanstvenem in tehnološkem sodelovanju med Evropsko unijo ter Ljudsko demokratično
    republiko Alžirijo, Arabsko republiko Egipt, Hašemitsko kraljevino Jordanijo,
    Libanonsko republiko in Kraljevino Maroko, v katerih so določeni pogoji za njihovo
    sodelovanje v zvezi s programom Obzorje Evropa v partnerstvu na področju raziskav
    in inovacij v Sredozemlju (PRIMA), ki ga skupaj izvaja več držav članic
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/2848 del Consejo, de 9 de noviembre de 2023, por la
    que se autoriza la apertura de negociaciones para la celebración de acuerdos,
    en forma de canje de notas, que modifiquen y completen los acuerdos de cooperación
    científica y tecnológica entre la Unión Europea y la República Argelina Democrática
    y Popular, la República Árabe de Egipto, el Reino Hachemí de Jordania, la República
    Libanesa y el Reino de Marruecos, respectivamente, por los que se establecen las
    condiciones para su participación, por lo que se refiere a Horizonte Europa,
    en la Asociación para la Investigación e Innovación en la Región del Mediterráneo
    (PRIMA), emprendida conjuntamente por varios Estados miembros
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/2848 av den 9 november 2023 om bemyndigande att
    genom skriftväxling inleda förhandlingar om avtal om ändring och komplettering
    av avtalen om vetenskapligt och tekniskt samarbete mellan Europeiska unionen och
    Demokratiska folkrepubliken Algeriet, Arabrepubliken Egypten, Hashemitiska konungariket
    Jordanien, Republiken Libanon respektive Konungariket Marocko som fastställer
