title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3776/91 of 18 December 1991 amending Regulation
    (EEC) No 1780/89 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in Articles 35, 36 and 39 of Regulation
    (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3776/91 DE LA COMMISSION du 18 décembre 1991 modifiant
    le règlement (CEE) no 1780/89 établissant les modalités relatives à l'' écoulement
    des alcools obtenus au titre des distillations visées aux articles 35, 36 et
    39 du règlement (CEE) no 822/87 du Conseil et détenus par les organismes d''
    intervention #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3776/91 DER KOMMISSION vom 18. Dezember 1991 zur
    Änderung der Verordnung (EWG) Nr. 1780/89 mit Durchführungsbestimmungen für
    den Absatz von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der
    Verordnung (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen
    #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3776/91 af 18. december 1991 om ændring
    af forordning (EØF) nr. 1780/89 om gennemførelsesbestemmelser for afsætning
    af alkohol, der er fremstillet i henhold til de i artikel 35, 36 og 39 i Rådets
    forordning (EØF) nr. 822/87 omhandlede destillationer, og som interventionsorganerne
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3776/91 της Επιτροπής
    της 18ης Δεκεμβρίου 1991 για την τροποποίηση του
    κανονισμού ( ΕΟΚ ) αριθ. 1780/89 περί καθορισμού
    των λεπτομερειών εφαρμογής σχετικά με τη διάθεση
    των αλκοολών που λαμβάνονται από τις αποστάξεις
    που αναφέρονται στα άρθρα 35, 36 και 39 του κανονισμού
    ( ΕΟΚ ) αριθ. 822/87 του Συμβουλίου και κατέχονται
    από τους οργανισμούς παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3776/91 DELLA COMMISSIONE del 18 dicembre 1991 recante
    modifica del regolamento (CEE) n. 1780/89 che stabilisce le modalità di applicazione
    relative allo smercio degli alcoli ottenuti dalle distillazioni di cui agli articoli
    35, 36 e 39 del regolamento (CEE) n. 822/87 del Consiglio e detenuti dagli organismi
    d'' intervento #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3776/91 VAN DE COMMISSIE van 18 december 1991 tot
    wijziging van Verordening (EEG) nr. 1780/89 tot vaststelling van de uitvoeringsbepalingen
    voor de afzet van alcohol die is verkregen bij distillatie als bedoeld in de artikelen
    35, 36 en 39 van Verordening (EEG) nr. 822/87 van de Raad en die in het bezit
    is van de interventiebureaus #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3776/91 DA COMISSÃO de 18 de Dezembro de 1991 que
