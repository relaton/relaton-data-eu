---
id: EUDirective20146
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/6/EU of 18 October 2013 amending, for
    the purposes of adapting to technical progress, the Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in the surface coatings of pin connector systems requiring nonmagnetic connectors
    which are used durably at a temperature below – 20 °C under normal operating
    and storage conditions
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/6/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les revêtements de surface des systèmes de connecteurs à
    broches nécessitant des connecteurs amagnétiques qui sont utilisés durablement
    à des températures inférieures à – 20 °C dans des conditions normales de
    fonctionnement et de stockage
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/6/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Oberflächenbeschichtungen von Einsteckpressverbindern,
    die nichtmagnetische Verbinder erfordern und dauerhaft bei einer Temperatur von
    unter – 20 °C unter normalen Betriebs- und Lagerbedingungen verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/6/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в повърхностните покрития на щифтови съединителни
    системи, за които са необходими немагнитни
    съединители и които се използват дълготрайно
    при температури под – 20 °C при съответните
    нормални условия на работа и съхранение
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/6/EU ze dne 18. října 2013
    , kterou se z důvodu přizpůsobení technickému pokroku mění příloha IV
    směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro olovo
    v povrchových povlacích systémů kolíkových konektorů vyžadujících nemagnetické
    konektory, které jsou za normálních a skladovacích podmínek trvale používány
    při teplotách nižších než – 20 °C
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/6/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU, for så vidt angår undtagne anvendelser af bly i overfladebelægninger
    til konnektorsystemer, som kræver ikke-magnetiske konnektorer, der anvendes varigt
    ved en temperatur under – 20 °C under normale drifts- og opbevaringsforhold
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/6/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τον μόλυβδο στις επικαλύψεις
    επιφανείας συστημάτων συζευκτήρων με ακίδες
    ενσφήνωσης που απαιτούν μη μαγνητικούς συζευκτήρες,
    τα οποία χρησιμοποιούνται μονίμως σε θερμοκρασία
    κάτω των – 20 °C, υπό κανονικές συνθήκες λειτουργίας
    και αποθήκευσης, με σκοπό την προσαρμογή στην
    τεχνική πρόοδο
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/6/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist mittemagnetiliste
    sõrmkonnektorite pinnakattes, mis on vastupidav tavapärastes töö- ja ladustamistingimustes,
    mille puhul temperatuur on alla – 20 °C
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/6/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen lyijyä sellaisten nastaliitinjärjestelmien
    pinnoitteissa, joissa on käytettävä ei-magneettisia liittimiä ja joita käytetään
    jatkuvasti alle – 20 °C lämpötilassa tavanomaisissa käyttö- ja varastointiolosuhteissa
    koskevan poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/6/EU оd 18. listopada 2013. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća o izuzeću za olovo u površinskim premazima na sustavima
    pinskih konektora koji zahtijevaju konektore od nemagnetnih materijala koji se
    trajno upotrebljavaju na temperaturi ispod – 20 °C pod normalnim uvjetima rada
    i skladištenja
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/6/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a standard működési és tárolási körülmények között tartósan – 20
    °C alatt használt, nemmágneses csatlakozókat igénylő tűs csatlakozórendszerek
    bevonatában lévő ólom mentesítése tekintetében, a műszaki fejlődéshez
    történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/6/UE della Commissione, del 18 ottobre 2013 , che
    modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione relativa
    al piombo nei rivestimenti di superficie dei sistemi di connettori a pin che necessitano
    di connettori non magnetici e che sono utilizzati per periodi prolungati a una
    temperatura inferiore a – 20 °C in condizioni normali di funzionamento e di
    stoccaggio
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/6/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam kontaktspraudņu
    sistēmu virsmas pārklājumos, kad ir vajadzīgi nemagnētiski spraudņi, ko
    normālos ekspluatācijas un glabāšanas apstākļos ilgstoši izmanto temperatūrā,
    kas zemāka par – 20 °C
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/6/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną mikroschemų jungčių sistemų, kuriose turi būti naudojamos
    nemagnetinės ir įprastomis eksploatavimo bei saugojimo sąlygomis žemesnėje
    kaip – 20 °C temperatūroje ilgą laiką tinkamos naudoti jungtys, paviršiaus
    dangose
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/6/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb fil-kisi tal-uċuħ tas-sistemi tal-konnetturi bil-pinnijiet
    li jirrikjedu konnetturi mhux manjetiċi reżistenti għall-użu f’temperaturi
    inqas minn – 20 °C f’kundizzjonijiet normal ta’ tħaddim u ħżin
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/6/EU van de Commissie van 18 oktober 2013 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in oppervlaktecoatings van pinconnecties waarvoor niet-magnetische
    connectoren nodig zijn voor duurzaam gebruik bij een temperatuur van minder dan
    – 20 °C onder normale bedrijfs- en opslagvoorwaarden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/6/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu w powłokach powierzchniowych systemów złączy stykowych wymagających
    złączy niemagnetycznych, które są długotrwale użytkowane w temperaturze
    poniżej – 20 °C w normalnych warunkach pracy i składowania
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/6/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para chumbo em revestimentos de superfície de sistemas de conexão por pinos
    que necessitem de conectores não magnéticos, utilizados de forma durável a
    temperaturas inferiores a – 20 °C, em condições normais de funcionamento
    e armazenagem
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/6/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul din stratul de suprafață al sistemelor de conectori cu pini care necesită
    conectori nemagnetici ce pot fi utilizați în mod sustenabil la o temperatură
    sub – 20 °C în condiții normale de funcționare și depozitare
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/6/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre používanie olova v
    povrchových náteroch systémov kolíkových konektorov, pre ktoré sú potrebné
    nemagnetické konektory, ktoré sa za bežných prevádzkových a skladovacích
    podmienok trvalo používajú pri teplotách nižších ako – 20 °C
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/6/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem za
    svinec v površinskih prevlekah sistemov nožičnih konektorjev, pri katerih so
    potrebni nemagnetni konektorji, ki se uporabljajo dolgotrajno pri temperaturi
    pod – 20 °C pod običajnimi pogoji obratovanja in skladiščenja, zaradi prilagoditve
    tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/6/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en los revestimientos de superficie de los sistemas de conectores
    de clavijas que requieren conectores no magnéticos y se utilizan durante un período
    prolongado de tiempo a una temperatura inferior a – 20 °C en condiciones normales
    de funcionamiento y almacenamiento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/6/EU av den 18 oktober 2013 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för ”bly i ytbeläggningar
    i anslutningssystem som kräver icke-magnetiska anslutningsdon som används varaktigt
    vid temperaturer under – 20 °C under normala drifts- och lagringsförhållanden”
