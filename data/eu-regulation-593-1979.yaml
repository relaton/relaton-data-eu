    των περιοχών στις οποίες η ενίσχυση στην παραγωγή
    λυκίσκου χορηγείται μόνο στις αναγνωρισμένες
    ομάδες παραγωγών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 593/79 del Consiglio, del 26 marzo 1979, che stabilisce
