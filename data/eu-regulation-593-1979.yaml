  content: Council Regulation (EEC) No 593/79 of 26 March 1979 drawing up the list
    of regions in which production aid for hops is granted only to recognized producer
    groups
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 593/79 du Conseil, du 26 mars 1979, arrêtant la liste
    des régions dans lesquelles l' aide à la production de houblon n' est octroyée
    qu' aux groupements reconnus de producteurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 593/79 des Rates vom 26. März 1979 zur Festlegung
    des Verzeichnisses der Gebiete, in denen die Produktionsbeihilfe für Hopfen nur
    anerkannten Erzeugergemeinschaften gewährt wird
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 593/79 af 26. marts 1979 om opstilling af
    en liste over områder, hvor producentstøtten vedrørende humle kun ydes til
    anerkendte producentsammenslutninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 593/79 του Συμβουλίου
