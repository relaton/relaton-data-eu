---
id: EURegulation20151220
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1220 of 24 July 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza following recent outbreaks in
    the States of Indiana and Nebraska
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1220 de la Commission du 24 juillet 2015
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    à partir desquels certains produits de volailles peuvent être importés dans
    l'Union ou transiter par celle-ci, dans le cadre des mesures prises à la suite
    de l'apparition récente de foyers d'influenza aviaire hautement pathogène dans
    les États de l'Indiana et du Nebraska
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/1220 der Kommission vom 24. Juli 2015
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags der Vereinigten Staaten in der Liste von Drittländern, Gebieten, Zonen
    und Kompartimenten, aus denen die Einfuhr von Geflügel und Geflügelerzeugnissen
    in die Union und ihre Durchfuhr durch die Union gestattet ist, im Zusammenhang
    mit Ausbrüchen der hochpathogenen Aviären Influenza in den Bundesstaaten Indiana
    und Nebraska
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/1220 на Комисията
    от 24 юли 2015 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Съединените щати в списъка на трети държави,
    територии, зони или компартменти, от които
    могат да бъдат внасяни и да преминават транзитно
    през територията на Съюза определени стоки,
    получени от домашни птици, във връзка с последната
    поява на огнища на високопатогенна инфлуенца
    по птиците в щатите Индиана и Небраска
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/1220 ze dne 24. července 2015,
    kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku
    týkající se Spojených států amerických na seznamu třetích zemí, území,
    oblastí nebo jednotek, z nichž lze do Unie dovážet nebo přes její území
    přepravovat určité drůbeží komodity, v souvislosti s ohnisky vysoce patogenní
    influenzy ptáků ve státech Indiana a Nebraska
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/1220 af 24. juli 2015
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om USA i listen over tredjelande, områder, zoner og segmenter, hvorfra import
    til eller transit gennem Unionen af visse fjerkræprodukter er tilladt i forbindelse
    med højpatogen aviær influenza, som følge af nylige udbrud i staterne Indiana
    og Nebraska
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/1220 της Επιτροπής,
    της 24ης Ιουλίου 2015, για την τροποποίηση του
    παραρτήματος I του κανονισμού (ΕΚ) αριθ. 798/2008
    όσον αφορά την καταχώριση των Ηνωμένων Πολιτειών
    στον κατάλογο τρίτων χωρών, εδαφών, ζωνών ή
    διαμερισμάτων από τα οποία επιτρέπεται να
    εισαχθούν στην Ένωση ή να διαμετακομιστούν
    μέσω της Ένωσης ορισμένα εμπορεύματα πουλερικών
    σε σχέση με την υψηλής παθογονικότητας γρίπη
    των πτηνών μετά την πρόσφατη εκδήλωση εστιών
    στις πολιτείες Ιντιάνα και Νεμπράσκα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/1220, 24. juuli 2015, millega muudetakse
    seoses kõrge patogeensusega linnugripi hiljutiste puhangutega Indiana ja Nebraska
    osariigis määruse (EÜ) nr 798/2008 I lisas Ameerika Ühendriike käsitlevat
    kannet loetelus, milles on esitatud need kolmandad riigid, territooriumid, tsoonid
    ja piirkonnad, millest võib importida liitu või vedada läbi liidu teatavaid
    linnukasvatussaadusi
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/1220, annettu 24 päivänä
    heinäkuuta 2015, asetuksen (EY) N:o 798/2008 liitteen I muuttamisesta Yhdysvaltoja
    koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden
    luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden tuonti unioniin
    tai kuljettaminen sen kautta on sallittua korkeapatogeenisen lintuinfluenssan
    yhteydessä Indianan ja Nebraskan osavaltioissa hiljattain sattuneiden taudinpurkausten
    seurauksena
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/1220 оd 24. srpnja 2015. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Sjedinjene Američke Države
    na popisu trećih zemalja, državnih područja, zona ili kompartmenta iz kojih
    je dozvoljen uvoz i provoz određenih proizvoda od peradi kroz Uniju u vezi s
    visokopatogenom influencom ptica nakon nedavnih izbijanja bolesti u saveznim državama
    Indiani i Nebraski
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/1220 végrehajtási rendelete (2015. július 24.)
    a 798/2008/EK rendelet I. mellékletének az egyes baromfiáruk Unióba történő
    behozatala vagy Unión keresztül történő átszállítása céljából engedélyezett
    harmadik országok, területek, övezetek és területi egységek jegyzékében
    az Egyesült Államokra vonatkozó bejegyzés tekintetében az erősen patogén
    vírustörzs okozta madárinfluenza Indiana és Nebraska államban való, nemrég
    észlelt megjelenése nyomán szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/1220 della Commissione, del 24 luglio
    2015, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa agli Stati Uniti nell'elenco di paesi terzi, loro territori,
    zone o compartimenti da cui sono consentiti le importazioni e il transito nell'Unione
    di determinati prodotti a base di pollame, in relazione all'influenza aviaria
    ad alta patogenicità a seguito della recente comparsa di focolai negli Stati
    dell'Indiana e del Nebraska
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/1220 (2015. gada 24. jūlijs),
    ar ko pēc nesenajiem augsti patogēnās putnu gripas uzliesmojumiem Indiānas
    štatā un Nebraskas štatā Regulas (EK) Nr. 798/2008 I pielikumā groza ierakstu
    par Amerikas Savienotajām Valstīm to trešo valstu, teritoriju, zonu un nodalījumu
    sarakstā, no kuriem attiecībā uz šo gripu atļauts Savienībā importēt vai
    tranzītā caur to pārvadāt noteiktas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
  content: 2015 m. liepos 24 d. Komisijos įgyvendinimo reglamentas (ES) 2015/1220,
    kuriuo dėl naujausių labai patogeniško paukščių gripo protrūkių Jungtinių
    Amerikos Valstijų Indianos ir Nebraskos valstijose ir Jungtinių Amerikos Valstijų
    įrašo trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių galima
    importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių paukščių
    prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/1220 tal-24 ta'
    Lulju 2015 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 dwar l-entrata
    għall-Istati Uniti fil-lista ta' pajjiżi terzi, territorji, żoni jew kumpartimenti
    li minnhom jistgħu jiġu importati ċerti prodotti tat-tjur lejn l-Unjoni jew
    isir tranżitu minnha fir-rigward tal-influwenza tat-tjur b'patoġeniċità għolja
    wara t-tifqigħat fl-Istati ta' Indiana u Nebraska
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/1220 van de Commissie van 24 juli 2015
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de gegevens
    voor de Verenigde Staten in de lijst van derde landen, gebieden, zones of compartimenten
    waaruit bepaalde pluimveeproducten mogen worden ingevoerd in en doorgevoerd door
    de Unie in verband met hoogpathogene aviaire influenza naar aanleiding van recente
    uitbraken in de staten Indiana en Nebraska
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/1220 z dnia 24 lipca 2015
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w zakresie wpisu
    dotyczącego Stanów Zjednoczonych w wykazie państw trzecich, terytoriów, stref
    lub grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez jej terytorium
    niektórych produktów drobiowych, w odniesieniu do wysoce zjadliwej grypy ptaków
    w następstwie wystąpienia niedawnych ognisk choroby w stanach Indiana i Nebraska
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/1220 da Comissão, de 24 de julho de
    2015, que altera o anexo I do Regulamento (CE) n.° 798/2008 no que se refere
    à entrada relativa aos Estados Unidos na lista de países terceiros, territórios,
    zonas ou compartimentos a partir dos quais são autorizados a importação e o
    trânsito na União de determinados produtos à base de aves de capoeira, no seguimento
    de surtos recentes de gripe aviária de alta patogenicidade nos Estados de Indiana
    e Nebrasca
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/1220 al Comisiei din 24 iulie
    2015 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Statele Unite din lista cu țări terțe, teritorii, zone
    sau compartimente din care anumite produse obținute de la păsări de curte pot
    fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de gripă
    aviară înalt patogenă, în urma apariției unor focare în statele Indiana
    și Nebraska
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/1220 z 24. júla 2015, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
    v dôsledku nedávnych ohnísk v štátoch Indiana a Nebraska
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/1220 z dne 24. julija 2015 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Združene države Amerike
    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz nekaterih perutninskih proizvodov v Unijo ali njihov tranzit skozi
    Unijo, v zvezi z visokopatogeno aviarno influenco po nedavnih izbruhih v zveznih
    državah Indiana in Nebraska
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/1220 de la Comisión, de 24 de julio
    de 2015, por el que se modifica el anexo I del Reglamento (CE) n° 798/2008 con
    respecto a la entrada relativa a los Estados Unidos en la lista de terceros países,
    territorios, zonas o compartimentos desde los cuales están permitidos la importación
    en la Unión o el tránsito por la misma de determinados productos de aves de
    corral, en relación con la influenza aviar de alta patogenicidad, a raíz de
    la reciente aparición de brotes en los Estados de Indiana y Nebraska
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/1220 av den 24 juli 2015
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Förenta staterna i förteckningen över tredjeländer, områden, zoner eller
    delområden från vilka vissa varor av fjäderfä får importeras till eller transiteras
    genom unionen i samband med högpatogen aviär influensa efter nya utbrott i delstaterna
    Indiana och Nebraska
