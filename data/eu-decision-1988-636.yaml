title:
- language: en
  script: Latn
  content: '88/636/EEC: Commission Decision of 15 December 1988 authorizing the United
    Kingdom to extend intra-Community surveillance in respect of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (88/636/EEC) (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/636/CEE: Décision de la Commission du 15 décembre 1988 autorisant
    le Royaume-Uni à proroger les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/636/EWG: Entscheidung der Kommission vom 15. Dezember 1988 zur Ermächtigung
    des Vereinigten Königreichs zur Verlängerung einer innergemeinschaftlichen Überwachung
    von aus bestimmten Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Bananen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/636/EØF: Kommissionens beslutning af 15. december 1988 om bemyndigelse
    af Det Forenede Kongerige til at forlaenge foranstaltninger med henblik paa tilsyn
    inden for Faellesskabet med indfoersel af bananer, der har oprindelse i visse
    tredjelande, og som er overgaaet omsaetning i de oevrige medlemsstater (Kun den
    engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/636/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Δεκεμβρίου 1988 περί χορηγήσεως αδείας στο Ηνωμένο
    Βασίλειο να παρατείνει την ενδοκοινοτική επιτήρηση
    όσον αφορά τις μπανάνες καταγωγής ορισμένων
    τρίτων χωρών οι οποίες τίθενται σε ελεύθερη
    κυκλοφορία στα άλλα κράτη μέλη (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/636/CEE: Decisione della Commissione del 15 dicembre 1988 che autorizza
    il Regno Unito a prorogare le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/636/EEG: Beschikking van de Commissie van 15 december 1988 waarbij
    het Verenigd Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair
    toezicht te verlengen ten aanzien van bananen van oorsprong uit bepaalde derde
    landen en in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst
    in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/636/CEE: Decisão da Comissão de 15 de Dezembro de 1988 que autoriza
    o Reino Unido a prorrogar as medidas de vigilância intracomunitára em relação
    às bananas originarias de certos paises terceiros e introduzidas em livre pratica
    nos outros Estados-membros (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '88/636/CEE: Decisión de la Comisión de 15 de diciembre de 1988 por la
    que se autoriza al Reino Unido a prorrogar las medidas de vigilancia intracomunitaria
    respecto de los platanos originarios de determinados terceros paises y despachados
    a libre practica en los demas Estados miembros (El texto en lengua inglesa es
    el único auténtico)'
