title:
- language: en
  script: Latn
  content: '95/19/EC: Commission Decision of 2 February 1995 deferring, as regards
    the importation of ornamental plant propagating material and ornamental plants
    from third countries, the date referred to in Article 16 (2) of Directive 91/682/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/19/CE: Décision de la Commission du 2 février 1995 prorogeant, en
    ce qui concerne les importations de matériels de multiplication des plantes ornementales
    et de plantes ornementales en provenance de pays tiers, le délai fixé à l''article
    16 paragraphe 2 de la directive 91/682/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/19/EG: ENTSCHEIDUNG DER KOMMISSION vom 2. Februar 1995 zur Verlängerung
    der in Artikel 16 Absatz 2 der Richtlinie 91/682/EWG des Rates genannten Frist
    für die Einfuhr von Vermehrungsmaterial und Pflanzen von Zierpflanzenarten aus
    Drittländern'
  type: main
- language: da
  script: Latn
  content: '95/19/EF: KOMMISSIONENS BESLUTNING af 2. februar 1995 om udsættelse af
