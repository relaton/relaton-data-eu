    for så vidt angår indførsel fra tredjelande af prydplanteformeringsmateriale
    og prydplanter'
  type: main
- language: el
  script: Grek
  content: '95/19/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 2ας Φεβρουαρίου
    1995 περί παρατάσεως, όσον αφορά την εισαγωγή
    από τρίτες χώρες πολλαπλασιαστικού των καλλωπιστικών
    φυτών και των καλλωπιστικών φυτών, της προθεσμίας
    που αναφέρεται στο άρθρο 16 παράγραφος 2 της
    οδηγίας 91/682/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '95/19/EY: Komission päätös, tehty 2 päivänä helmikuuta 1995, direktiivin
