  content: Règlement (CEE) n° 2616/69 du Conseil, du 15 décembre 1969, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de 34.000 tonnes de morues entières, décapitées ou tronçonnées, simplement
    salées ou en saumure, ou séchées, de la position 03.02 A I b) du tarif douanier
    commun (année 1970)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2616/69 des Rates vom 15. Dezember 1969 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents in Höhe
    von 34 000 Tonnen für Kabeljau, ganz, ohne Kopf oder zerteilt, nur gesalzen,
    in Salzlake oder getrocknet, der Tarifstelle 03.02 A I b) des Gemeinsamen Zolltarifs
    (1970)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2616/69 del Consiglio, del 15 dicembre 1969, relativo
    all'apertura, alla ripartizione e alle modalità di gestione del contingente tariffario
    comunitario di 34.000 tonnellate di merluzzi interi, decapitati o in pezzi, semplicemente
    salati o in salamoia, o secchi, della voce 03.02 A I b) della tariffa doganale
    comune (anno 1970)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2616/69 van de Raad van 15 december 1969 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    van 34.000 ton kabeljauw, ook indien ontdaan van kop of in moten gesneden, enkel
    gezouten, gepekeld of gedroogd, van post 03.02 A I b) van het gemeenschappelijk
    douanetarief (1970)
