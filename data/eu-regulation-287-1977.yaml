title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 287/77 of 10 February 1977 amending the
    list of landing areas situated at a considerable distance from the main centres
    of consumption in the Community and the conversion factors and withdrawal prices
    applicable in those areas to mackerel
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 287/77 de la Commission, du 10 février 1977, modifiant
    la détermination des zones de débarquement très éloignées des principaux
    centres de consommation de la Communauté, les coefficients d' ajustement ainsi
    que les prix de retrait applicables dans ces zones en ce qui concerne les maquereaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 287/77 der Kommission vom 10. Februar 1977 zur Änderung
    der Bestimmung der von den wichtigsten Verbrauchszentren der Gemeinschaft sehr
    entfernt liegenden Anlandegebiete, der Anpassungskoeffizienten sowie der in diesen
    Gebieten auf Makrelen anzuwendenden Rücknahmepreise
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 287/77 af 10. februar 1977 om ændring
    af fastsættelsen af de landingsområder, som ligger meget fjernt fra Fællesskabets
    vigtigste forbrugscentre, af omregningskoefficienterne samt af de tilbagetagelsespriser,
    der gælder i disse områder for makrel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 287/77 della Commissione, del 10 febbraio 1977, che
    modifica la determinazione delle zone di sbarco molto distanti dai principali
    centri di consumo della Comunità, i coefficienti di adattamento e i prezzi di
    ritiro applicabili in tali zone per gli sgombri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 287/77 van de Commissie van 10 februari 1977 tot
    wijziging van de omschrijving van de lossingsgebieden die verafgelegen zijn van
    de voornaamste verbruikscentra van de Gemeenschap, van de aanpassingscoëfficiënten,
    alsmede van de ophoudprijzen van toepassing in die gebieden voor wat betreft makreel
  type: main
