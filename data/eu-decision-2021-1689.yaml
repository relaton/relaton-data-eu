title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1689 of 17 September 2021 concerning
    the extension of the action taken by the Bulgarian Ministry of Health permitting
    the making available on the market and use of the biocidal products Ecolab P3-Topax
    66/Еколаб P3-Tопакс 66 and Ecolab BACFORCE EL 900/Еколаб БАКФОРС
    EL 900 in accordance with Article 55(1) of Regulation (EU) No 528/2012 of the
    European Parliament and of the Council (notified under document C(2021)6693) (Only
    the Bulgarian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1689 de la Commission du 17 septembre
    2021 concernant la prorogation de la mesure prise par le ministère bulgare de
    la santé autorisant la mise à disposition sur le marché et l’utilisation
    des produits biocides Écolab P3-Topax 66/Еколаб P3-Tопакс 66 et Écolab
    BACFORCE EL 900/Еколаб БАКФОРС EL 900 conformément à l’article
    55, paragraphe 1, du règlement (UE) no 528/2012 du Parlement européen et du
    Conseil [notifiée sous le numéro C(2021) 6693] (Le texte en langue bulgare est
    le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1689 der Kommission vom 17. September
    2021 über die Verlängerung der vom bulgarischen Gesundheitsministerium ergriffenen
