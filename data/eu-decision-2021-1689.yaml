    Biozidprodukte Ecolab P3-Topax 66/Еколаб P3-Topaks 66 und Ecolab BACFORCE
    EL 900/Еколаб БАКФОРС EL 900 gemäß Artikel 55 Absatz 1 der Verordnung
    (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates (Bekannt gegeben
    unter Aktenzeichen C(2021) 6693) (Nur der bulgarische Text ist verbindlich)
  type: main
