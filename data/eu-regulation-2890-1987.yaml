    Zolltarifs der Tarifnummer 28.19 mit Ursprung in Mexiko, dem die in der Verordnung
    (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2890/87 af 28. september 1987 om genindførelse
