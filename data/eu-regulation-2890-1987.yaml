title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2890/87 of 28 September 1987 re-establishing
    the levying of customs duties on zinc and zinc oxide falling within heading No
    28.19 of the Common Customs Tariff originating in Mexico to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2890/87 de la Commission du 28 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables à l' oxyde
    de zinc; peroxyde de zinc, de la position 28.19 du tarif douanier commun, originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
