title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/878 of 18 June 2018 adopting
    the list of Member States, or parts of the territory of Member States, that comply
    with the rules for categorisation laid down in Article 2(2) and (3) of Delegated
    Regulation (EU) 2018/772 concerning the application of preventive health measures
    for the control of Echinococcus multilocularis infection in dogs
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/878 de la Commission du 18 juin 2018
