    membres qui respectent les règles de classification énoncées à l'article 2,
    paragraphes 2 et 3, du règlement délégué (UE) 2018/772 en ce qui concerne
    l'application de mesures sanitaires préventives nécessaires à la lutte contre
    l'infection à Echinococcus multilocularis chez les chiens
  type: main
