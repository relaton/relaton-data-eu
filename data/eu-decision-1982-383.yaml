  content: '82/383/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Thermo Electron - Thermal Energy Analyzer, model 502'' may be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/383/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "Thermo Electron - Thermal Energy Analyzer,
    model 502" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/383/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß das Gerät ,,Thermo Electron-Thermal Energy Analyzer, model 502" unter
    Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/383/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
