title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3053/82 of 16 November 1982 on the sale
    at prices fixed at a standard rate in advance of certain beef from intervention
    stocks for processing in the Community and repealing Regulation (EEC) No 2769/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3053/82 de la Commission, du 16 novembre 1982, relatif
    à la vente à prix fixé forfaitairement à l' avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d' intervention
    et abrogeant le règlement (CEE) n° 2769/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3053/82 der Kommission vom 16. November 1982 über
    den Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der
    Gemeinschaft bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur
    Aufhebung der Verordnung (EWG) Nr. 2769/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3053/82 af 16. november 1982 om salg
    til forudfastsatte priser af visse former for oksekød fra interventionslagrene
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 2769/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3053/82 τής Επιτροπής
    τής 16ης Νοεμβρίου 1982 περί πωλήσεως μέ κατ αποκοπή
    τιμή καθοριζόμενη εκ τών προτέρων, εν όψει
    τής μεταποιήσεώς τους εντός τής Κοινότητας,
    ορισμένων βοείων κρεάτων πού προέρχονται από
    αποθέματα οργανισμών παρεμβάσεως, καί περί
    τροποποιήσεως τού κανονισμού (EOK) αριθ. 2769/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3053/82 della Commissione, del 16 novembre 1982, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte dintervento e destinate alla trasformazione nella Comunità
    e recante abrogazione del regolamento (CEE) n. 2769/82
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3053/82 van de Commissie van 16 november 1982 inzake
    de verkoop, tegen vooraf forfaitair vastgestelde prijzen, voor verwerking in de
    Gemeenschap, van rundvlees uit de voorraden van de interventiebureaus en houdende
    intrekking van Verordening (EEG) nr. 2769/82
  type: main
