title:
- language: en
  script: Latn
  content: '86/626/EEC: Commission Decision of 17 December 1986 changing the import
    arangements established by Council Regulation (EEC) No 3420/83 and applied in
    the Benelux countries, in Denmark, and in Spain in respect of Romania regarding
    various industrial products (Only the Dutch, Danish, French and Spanish texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/626/CEE: Décision de la Commission du 17 décembre 1986 modifiant
    le régime d''importation prévu par le règlement (CEE) n° 3420/83 du Conseil
    et appliqué au Benelux, au Danemark et en Espagne à l''égard de la Roumanie
    en ce qui concerne divers produits industriels (Les textes en langues néerlandaise,
    danoise, française et espagnole sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/626/EWG: Entscheidung der Kommission vom 17. Dezember 1986 zur Änderung
    der durch die Verordnung (EWG) Nr. 3420/83 des Rates festgelegten und in den Beneluxländern,
    in Dänemark und in Spanien gegenüber Rumänien für einige gewerbliche Waren
    angewandten Einfuhrregelung (Nur der niederländische, dänische, französische
    und spanische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/626/EØF: Kommissionens beslutning af 17. december 1986 om ændring
    af den importordning, der er fastsat ved Rådets forordning (EØF) nr. 3420/83,
    og som anvendes i Benelux-landene, kongeriget Danmark og kongeriget Spanien over
    for Rumænien for så vidt angår forskellige industrivarer (Kun den nederlandske,
    danske, franske og spanske udgave er autentiske)'
  type: main
- language: el
  script: Grek
