  content: Commission Regulation (EEC) No 796/79 of 20 April 1979 amending Regulation
    (EEC) No 542/79 on the sale at prices fixed at a standard rate in advance of certain
    quantities of frozen beef held by the Italian intervention agency and intended
    for direct consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 796/79 de la Commission, du 20 avril 1979, modifiant
    le règlement (CEE) n° 542/79 relatif à la vente à prix fixé forfaitairement
    à l' avance de certaines viandes bovines congelées détenues par l' organisme
    d' intervention italien et destinées à la consommation directe dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 796/79 der Kommission vom 20. April 1979 zur Änderung
    der Verordnung (EWG) Nr. 542/79 über den Verkauf von gefrorenem Rindfleisch,
    das sich im Besitz der italienischen Interventionsstelle befindet und zum unmittelbaren
    Verbrauch in der Gemeinschaft bestimmt ist, zu pauschal im voraus festgesetztem
    Preis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 796/79 af 20. april 1979 om ændring
