    forfettariamente in anticipo di talune carni bovine congelate detenute dall' organismo
    d' intervento italiano e destinate al consumo diretto nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 796/79 van de Commissie van 20 april 1979 tot wijziging
    van Verordening (EEG) nr. 542/79 betreffende de verkoop tegen vooraf forfaitair
    vastgestelde prijzen van bepaalde soorten bevroren rundvlees die ter beschikking
    van het Italiaanse interventiebureau zijn gesteld en bestemd zijn voor rechtstreeks
    verbruik in de Gemeenschap
