title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1857 of 13 October 2017 on the
    recognition of the legal, supervisory and enforcement arrangements of the United
    States of America for derivatives transactions supervised by the Commodity Futures
    Trading Commission as equivalent to certain requirements of Article 11 of Regulation
    (EU) No 648/2012 of the European Parliament and Council on OTC derivatives, central
    counterparties and trade repositories
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1857 de la Commission du 13 octobre 2017
    reconnaissant l'équivalence du cadre juridique et du dispositif de surveillance
    et de mise en œuvre des États-Unis d'Amérique relatifs aux transactions sur
    dérivés surveillées par la Commodity Futures Trading Commission avec certaines
    des exigences de l'article 11 du règlement (UE) n° 648/2012 du Parlement européen
    et du Conseil sur les produits dérivés de gré à gré, les contreparties centrales
    et les référentiels centraux
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1857 der Kommission vom 13. Oktober 2017
    über die Anerkennung der Gleichwertigkeit der Rechts-, Aufsichts- und Durchsetzungsmechanismen
    der Vereinigten Staaten von Amerika für der Aufsicht der Commodity Futures Trading
    Commission (Aufsichtsbehörde für den Warenterminhandel) unterliegende Derivatgeschäfte
    mit bestimmten Anforderungen des Artikels 11 der Verordnung (EU) Nr. 648/2012
    des Europäischen Parlaments und des Rates über OTC-Derivate, zentrale Gegenparteien
    und Transaktionsregister
  type: main
- language: bg
  script: Cyrl
