schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 November 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Kingdom of Belgium
    for expenditure on vocational retraining operations carried out by the Fonds National
    de Reclassement Social des Handicapés
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1973, portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice du
    Royaume de Belgique pour des dépenses relatives à des opérations de rééducation
    professionnelle effectuées par le fonds national de reclassement social des handicapés
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. November 1973 über die Gewährung
    des in Artikel 125 des Vertrages vorgesehenen Zuschusses aus dem Europäischen
    Sozialfonds an das Königreich Belgien zu Aufwendungen für vom "Fonds national
    de reclassement social des handicapés" durchgeführte Berufsumschulungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. november 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til kongeriget
    Belgien i forbindelse med omkostninger vedrørende faglig omskoling, som er gennemført
    af »Fonds national de reclassement social des handicapés«
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 novembre 1973, recante concessione
    del contributo del Fondo sociale europeo, previsto dall'articolo 125 del trattato,
    a favore del Regno del Belgio, per spese concernenti operazioni di riqualificazione
    professionale effettuate dal Fonds national de reclassement social des handicapés
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 november 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van het Koninkrijk België voor door het Rijksfonds voor sociale
    reclassering van de minder-validen gemaakte herscholingskosten
  type: main
