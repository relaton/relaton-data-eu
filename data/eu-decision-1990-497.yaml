id: EUDecision1990497
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/497/EEC: Council Decision of 24 September 1990 authorizing the United
    Kingdom to apply an optional measure derogating from Article 17 of the Sixth Directive
    (77/388/EEC) on the harmonization of the laws of the Member States relating to
    turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '90/497/CEE: Décision du Conseil du 24 septembre 1990 autorisant le Royaume-Uni
    à appliquer une mesure facultative dérogatoire à l''article 17 de la sixième
    directive 77/388/CEE en matière d''harmonisation des législations des États
    membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DES RATES vom 24. September 1990 zur Ermaechtigung des Vereinigten
    Koenigreichs, eine fakultative abweichende Massnahme zu Artikel 17 der Sechsten
    Richtlinie (77/388/EWG) zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten
    ueber die Umsatzsteuern anzuwenden (90/497/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS BESLUTNING af 24. september 1990 om bemyndigelse af Det Forenede
    Kongerige til at anvende en fakultativ foranstaltning, der fraviger artikel 17
    i sjette direktiv 77/388/EOEF om harmonisering af medlemsstaternes lovgivning
    om omsaetningsafgifter (90/497/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/497/ΕΟΚ: Απόφαση του Συμβουλίου της 24ης
    Σεπτεμβρίου 1990 για την εξουσιοδότηση του Ηνωμένου
    Βασιλείου να εφαρμόσει ένα προαιρετικό μέτρο
    κατά παρέκκλιση του άρθρου 17 της έκτης οδηγίας
    ( 77/388/ΕΟΚ ) περί εναρμονίσεως των νομοθεσιών
    των κρατών μελών σχετικά με το φόρο κύκλου
    εργασιών'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 24 settembre 1990 che autorizza il Regno Unito
    ad applicare una misura facoltativa di deroga all'articolo 17 della sesta direttiva
    77/388/CEE in materia di armonizzazione delle legislazioni degli Stati membri
    relative alle imposte sulla cifra d'affari (90/497/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE RAAD van 24 september 1990 waarbij het Verenigd Koninkrijk
    wordt gemachtigd om een facultatieve maatregel toe te passen die afwijkt van artikel
    17 van Zesde Richtlijn 77/388/EEG betreffende de harmonisatie van de wetgevingen
    der Lid-Staten inzake omzetbelasting (90/497/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 24 de Setembro de 1990 que autoriza o Reino Unido
    a aplicar uma medida facultativa derrogatoria ao artigo 17* da Sexta Directiva
    77/388/CEE, em matéria de harmonizaçao das legislaçoes dos Estados-membros
    relativas aos impostos sobre o volume de negocios (90/497/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 24 de septiembre de 1990 por la que se autoriza
    al Reino Unido a aplicar una medida optativa de no aplicacion del articulo 17
    de la Sexta Directiva 77/388/CEE en materia de armonizacion de las legislaciones
    de los Estados miembros relativas a los impuestos sobre el volumen de negocios
    (90/497/CEE)
  type: main
