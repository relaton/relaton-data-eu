  script: Latn
  content: Decisione del Consiglio, del 2 dicembre 1974, relativa alla conclusione
    dell'accordo tra la Comunità economica europea e l'alto commissariato delle Nazioni
    Unite per i rifugiati per la fornitura di butteroil, di latte scremato in polvere,
    di farina di frumento tenero e di riso a titolo di aiuto alimentare d'urgenza
    a favore delle popolazioni colpite dai recenti avvenimenti di Cipro
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 2 december 1974 houdende sluiting van de Overeenkomst
    tussen de Europese Economische Gemeenschap en het Hoge Commissariaat van de Verenigde
    Naties voor Vluchtelingen inzake de levering van butteroil, magere-melkpoeder,
