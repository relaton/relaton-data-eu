    Det europæiske økonomiske Fællesskab og De forenede Nationers Højkommissariat
    for Flygtninge om levering af butteroil, skummetmælkspulver, mel af blød hvede
    samt ris som nødhjælp til de befolkningsgrupper, der er berørt af de seneste
    begivenheder på Cypern
  type: main
