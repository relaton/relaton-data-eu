  content: Council Decision of 2 December 1974 on the conclusion of the Agreement
    between the European Economic Community and the Office of the United Nations High
    Commissioner for Refugees on the supply of butteroil, skimmed-milk powder, flour
    of common wheat and rice as emergency food aid for the populations affected by
    the recent events in Cyprus
  type: main
- language: fr
  script: Latn
  content: '75/32/CEE: Décision du Conseil du 2 décembre 1974, portant conclusion
    de l''accord entre la Communauté économique européenne et le Haut Commissariat
    des Nations Unies pour les réfugiés relatif à la fourniture de butteroil, de
    lait écrémé en poudre, de farine de froment tendre et de riz à titre d''aide
    alimentaire d''urgence en faveur des populations affectées par les récents évènements
    de Chypre'
  type: main
- language: de
  script: Latn
  content: Beschluß des Rates vom 2. Dezember 1974 über den Abschluß des Abkommens
    zwischen der Europäischen Wirtschaftsgemeinschaft und dem Hochkommissariat der
    Vereinten Nationen für Flüchtlinge über die Lieferung von butteroil, Magermilchpulver,
    Weichweizenmehl und Reis im Rahmen der Nahrungsmittelsoforthilfe für die von
    den jüngsten Ereignissen auf Zypern betroffene Bevölkerung
  type: main
