title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 693/2012 of 25 July 2012 amending
    Implementing Regulation (EU) No 723/2011 (extending the definitive anti-dumping
    duty imposed by Regulation (EC) No 91/2009 on imports of certain iron or steel
    fasteners originating in the People’s Republic of China to imports of certain
    iron or steel fasteners consigned from Malaysia, whether declared as originating
    in Malaysia or not), by granting an exemption from those measures to one Malaysian
    exporting producer and terminating the registration of imports from that exporting
    producer
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 693/2012 du Conseil du 25 juillet 2012
    modifiant le règlement d'exécution (UE) n ° 723/2011 [portant extension du
    droit antidumping définitif institué par le règlement (CE) n ° 91/2009 sur
    les importations de certains éléments de fixation en fer ou en acier originaires
    de la République populaire de Chine aux importations de certains éléments de
    fixation en fer ou en acier expédiés de Malaisie, qu'ils aient ou non été
    déclarés originaires de ce pays], en accordant une exemption de ces mesures
    à un producteur-exportateur malaisien et en mettant fin à l'enregistrement des
    importations provenant de ce producteur-exportateur
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 693/2012 des Rates vom 25. Juli 2012
    zur Änderung der Durchführungsverordnung (EU) Nr. 723/2011 des Rates (Ausweitung
    des mit der Verordnung (EG) Nr. 91/2009 eingeführten endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter Verbindungselemente aus Eisen oder Stahl mit Ursprung
    in der Volksrepublik China auf aus Malaysia versandte Einfuhren bestimmter Verbindungselemente
    aus Eisen oder Stahl, ob als Ursprungserzeugnisse Malaysias angemeldet oder nicht)
    zwecks Befreiung eines malaysischen ausführenden Herstellers von diesen Maßnahmen
    und Einstellung der zollamtlichen Erfassung der Einfuhren von Waren dieses ausführenden
    Herstellers
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 693/2012 на Съвета
    от 25 юли 2012 година за изменение на Регламент
    за изпълнение (ЕС) № 723/2011 (за разширяване обхвата
    на окончателното антидъмпингово мито, наложено
    с Регламент (ЕО) № 91/2009 върху вноса на някои
    скрепителни елементи от желязо или стомана
    с произход от Китайската народна република,
    върху вноса на някои скрепителни елементи
    от желязо или стомана, изпращани от Малайзия,
    с деклариран или не произход от Малайзия) посредством
    предоставяне на освобождаване от действието
    на посочените мерки на един малайзийски производител
    износител и прекратяване регистрацията на
    вноса от този производител износител
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 693/2012 ze dne 25. července 2012
    , kterým se mění prováděcí nařízení (EU) č. 723/2011 (kterým se rozšiřuje
    konečné antidumpingové clo uložené nařízením (ES) č. 91/2009 na dovoz
    některých spojovacích prostředků ze železa nebo oceli pocházejících z
    Čínské lidové republiky na dovoz některých spojovacích prostředků ze
    železa nebo oceli zasílaných z Malajsie, bez ohledu na to, zda je u nich deklarován
    původ z Malajsie) tak, že se jeden malajský vyvážející výrobce osvobozuje
    od uvedených opatření a ukončuje se celní evidence dovozu tohoto vyvážejícího
    výrobce
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 693/2012 af 25. juli 2012 om
    ændring af gennemførelsesforordning (EU) nr. 723/2011 (om udvidelse af den endelige
    antidumpingtold, der er indført ved forordning (EF) nr. 91/2009 på importen
    af visse skruer, bolte, møtrikker og lignende varer af jern og stål med oprindelse
    i Folkerepublikken Kina, til også at omfatte importen af visse skruer, bolte,
    møtrikker og lignende varer af jern og stål afsendt fra Malaysia, uanset om
    varen er angivet med oprindelse i Malaysia eller ej), ved indrømmelse af fritagelse
    for disse foranstaltninger til en eksporterende producent fra Malaysia, og om
    ophør af registreringen af importen fra denne eksporterende producent
  type: main
