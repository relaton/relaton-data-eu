  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 693/2012, annettu 25 päivänä
    heinäkuuta 2012 , täytäntöönpanoasetuksen (EU) N:o 723/2011 (Kiinan kansantasavallasta
    peräisin olevien tiettyjen rauta- ja teräskiinnittimien tuonnissa asetuksella
    (EY) N:o 91/2009 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta
    koskemaan Malesiasta lähetettyjen tiettyjen rauta- ja teräskiinnittimien tuontia
    riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu Malesia) muuttamisesta
    myöntämällä vapautus asianomaisista toimenpiteistä yhdelle malesialaiselle
    vientiä harjoittavalle tuottajalle ja kyseisen vientiä harjoittavan tuottajan
    tuonnin kirjaamisen päättämisestä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 693/2012 od 25. srpnja 2012. o izmjeni
    Provedbene uredbe Vijeća (EU) br. 723/2011 (o proširenju konačne antidampinške
    pristojbe uvedene Uredbom Vijeća (EZ) br. 91/2009 o uvozu određenih željeznih
    ili čeličnih elemenata za pričvršćivanje podrijetlom iz Narodne Republike
    Kine na uvoz određenih željeznih ili čeličnih elemenata za pričvršćivanje
    poslanih iz Malezije, bez obzira na to imaju li deklarirano podrijetlo iz Malezije
    ili ne) dodjeljivanjem izuzeća od tih mjera jednom malezijskom proizvođaču
    izvozniku i o prekidu evidentiranja uvoza od tog izvoznika
  type: main
- language: hu
  script: Latn
  content: A Tanács 693/2012/EU végrehajtási rendelete ( 2012. július 25. ) a
    (91/2009/EK rendelettel a Kínai Népköztársaságból származó egyes vas vagy
    acél kötőelemek behozatalára kivetett végleges dömpingellenes vámnak a
    Malajziában feladott, akár Malajziából származóként, akár nem ilyenként
    bejelentett egyes vas vagy acél kötőelemek behozatalára történő kiterjesztéséről
    szóló) 723/2011/EU végrehajtási rendelet módosításáról, valamint egy
    malajziai exportőr számára az ezen intézkedések alóli mentesség megadásáról
    és a tőle származó behozatalra vonatkozó nyilvántartásba-vételi kötelezettség
    megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 693/2012 del Consiglio, del 25 luglio
    2012 , che modifica il regolamento di esecuzione (UE) n. 723/2011, che estende
    il dazio antidumping definitivo istituito dal regolamento (CE) n. 91/2009 sulle
    importazioni di determinati elementi di fissaggio in ferro o acciaio originari
    della Repubblica popolare cinese alle importazioni di determinati elementi di
    fissaggio in ferro o acciaio spediti dalla Malaysia, indipendentemente dal fatto
    che siano dichiarati o no originari della Malaysia, concedendo l’esenzione da
    queste misure a un produttore esportatore malese e ponendo termine alla registrazione
    delle importazioni di tale produttore esportatore
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 693/2012 ( 2012. gada 25. jūlijs
    ), ar ko groza Īstenošanas regulu (ES) Nr. 723/2011 (ar kuru galīgo antidempinga
    maksājumu, kas ar Regulu (EK) Nr. 91/2009 noteikts dažu Ķīnas Tautas Republikas
    izcelsmes dzelzs vai tērauda savienotājelementu importam, attiecina arī uz
    dažu dzelzs vai tērauda savienotājelementu importu, ko veic, tos nosūtot no
    Malaizijas un deklarējot vai nedeklarējot kā Malaizijas izcelsmes ražojumus),
    atbrīvojot no šiem pasākumiem vienu Malaizijas ražotāju eksportētāju un
    pārtraucot šā ražotāja eksportētāja importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2012 m. liepos 25 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 693/2012,
    kuriuo iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr. 723/2011 (kuriuo
    išplečiamas galutinio antidempingo muito, nustatyto Reglamentu (EB) Nr. 91/2009
