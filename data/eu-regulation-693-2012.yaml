  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 693/2012, 25. juuli 2012 , millega muudetakse
    rakendusmäärust (EL) nr 723/2011 (millega laiendatakse teatavate Hiina Rahvavabariigist
    pärit rauast või terasest kinnitusdetailide impordi suhtes määrusega (EÜ)
    nr 91/2009 kehtestatud lõplikku dumpinguvastast tollimaksu Malaisiast lähetatud
