    importuojamoms geležinėms arba plieninėms tvirtinimo detalėms, deklaruojamoms
    arba nedeklaruojamoms kaip Malaizijos kilmės) ir kuriuo vienas Malaizijos eksportuojantis
    gamintojas atleidžiamas nuo šių priemonių ir panaikinama šio eksportuojančio
    gamintojo importuojamo produkto registracija
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 693/2012 tal- 25
    ta' Lulju 2012 li jemenda r-Regolament ta’ Implimentazzjoni tal-Kunsill (UE)
    Nru 723/2011 (li jestendi d-dazju anti-dumping definittiv impost mir-Regolament
    (KE) Nru 91/2009 fuq l-importazzjonijiet ta’ ċerti qfieli tal-ħadid u tal-azzar
    li joriġinaw fir-Repubblika Popolari taċ-Ċina għall-importazzjonijiet ta’
    ċerti qfieli tal-ħadid u tal-azzar ikkunsinjati mill-Malasja, kemm jekk iddikjarati
    li joriġinaw mill-Malasja kif ukoll jekk le), billi jagħti eżenzjoni minn dawk
    il-miżuri lil produttur esportatur Malasjan wieħed u jtemm ir-reġistrazzjoni
    tal-importazzjonijiet mingħand dak il-produttur esportatur
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 693/2012 van de Raad van 25 juli 2012 tot
    wijziging van Uitvoeringsverordening (EU) nr. 723/2011 (tot uitbreiding van het
    bij Verordening (EG) nr. 91/2009 ingestelde definitieve antidumpingrecht op bepaalde
    soorten ijzeren of stalen bevestigingsmiddelen van oorsprong uit de Volksrepubliek
    China tot bepaalde soorten uit Maleisië verzonden ijzeren of stalen bevestigingsmiddelen,
    al dan niet aangegeven als van oorsprong uit Maleisië) door vrijstelling van
    die maatregelen te verlenen aan een Maleisische producent-exporteur en tot beëindiging
    van de registratie van de invoer, afkomstig van die producent-exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 693/2012 z dnia 25 lipca 2012 r.
    zmieniające rozporządzenie wykonawcze (UE) nr 723/2011 (rozszerzające ostateczne
    cło antydumpingowe nałożone rozporządzeniem (WE) nr 91/2009 na przywóz niektórych
    elementów złącznych z żeliwa lub stali pochodzących z Chińskiej Republiki
    Ludowej na przywóz niektórych elementów złącznych z żeliwa lub stali wysyłanych
    z Malezji, zgłoszonych lub niezgłoszonych jako pochodzące z Malezji) poprzez
    przyznanie jednemu malezyjskiemu producentowi eksportującemu zwolnienia z tych
    środków i zakończenie rejestracji przywozu pochodzącego od tego producenta
    eksportującego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 693/2012 do Conselho, de 25 de julho
    de 2012 , que altera o Regulamento de Execução (UE) n. ° 723/2011 [que torna
    extensivo o direito anti-dumping definitivo instituído pelo Regulamento (CE)
    n. ° 91/2009 sobre as importações de determinados parafusos de ferro ou aço
    originários da República Popular da China às importações de determinados
    parafusos de ferro ou aço expedidos da Malásia, independentemente de serem ou
    não declarados originários da Malásia] através da concessão de uma isenção
    dessas medidas a um produtor-exportador malaio, e faz cessar o registo das importações
    provenientes desse produtor-exportador
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 693/2012 al Consiliului din
    25 iulie 2012 de modificare a Regulamentului de punere în aplicare (UE) nr. 723/2011
    [privind extinderea taxei antidumping definitive impuse prin Regulamentul (CE)
    nr. 91/2009 privind importurile de anumite elemente de fixare din fier sau oțel
    originare din Republica Populară Chineză la importurile de anumite elemente
    de fixare din fier sau oțel expediate din Malaysia, indiferent dacă au fost
    sau nu declarate ca provenind din Malaysia], prin acordarea unei scutiri de la
    aplicarea respectivelor măsuri unui producător-exportator malaysian și de încheiere
    a înregistrării importurilor provenind de la acel producător-exportator
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 693/2012 z 25. júla 2012 , ktorým
    sa mení a dopĺňa vykonávacie nariadenie (EÚ) č. 723/2011 [ktorým sa rozširuje
    konečné antidumpingové clo uložené nariadením (ES) č. 91/2009 na dovoz
    určitých spojovacích materiálov zo železa alebo ocele s pôvodom v Čínskej
    ľudovej republike, na dovoz určitých spojovacích materiálov zo železa alebo
    ocele zasielaných z Malajzie bez ohľadu na to, či sú deklarované ako výrobky
    s pôvodom v Malajzii, alebo nie] tak, že sa jednému malajzijskému výrobcovi
    udeľuje oslobodenie od týchto opatrení a ukončuje registrácia dovozu od tohto
    vyvážajúceho výrobcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 693/2012 z dne 25. julija 2012 o spremembi
    Izvedbene uredbe (EU) št. 723/2011 (o razširitvi dokončne protidampinške dajatve,
    uvedene z Uredbo (ES) št. 91/2009 o uvozu nekaterih pritrdilnih elementov iz
    železa ali jekla s poreklom iz Ljudske republike Kitajske, na uvoz nekaterih
    pritrdilnih elementov iz železa ali jekla, poslanih iz Malezije, ne glede na
    to, ali je deklariran kot izdelek s poreklom iz Malezije ali ne) z odobritvijo
    izvzetja iz teh ukrepov enemu malezijskemu proizvajalcu izvozniku in prenehanjem
    registracije uvoza za tega proizvajalca izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 693/2012 del Consejo, de 25 de julio
    de 2012 , por el que se modifica el Reglamento de Ejecución (UE) n ° 723/2011,
    por el que se amplía el derecho antidumping definitivo establecido por el Reglamento
    (CE) n ° 91/2009 a las importaciones de determinados elementos de fijación de
    hierro o acero originarios de la República Popular China a las importaciones
    de determinados elementos de fijación de hierro o acero procedentes de Malasia,
    hayan sido declarados o no originarios de Malasia, eximiendo de tales medidas
    a un productor exportador de Malasia y poniendo fin al registro de las importaciones
    de dicho productor exportador
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 693/2012 av den 25 juli 2012 om
    ändring av rådets genomförandeförordning (EU) nr 723/2011 (om utvidgning av
    den slutgiltiga antidumpningstull som genom förordning (EG) nr 91/2009 införts
    på import av vissa fästdon av järn eller stål med ursprung i Folkrepubliken
    Kina till att även omfatta import av vissa fästdon av järn eller stål som
    avsänts från Malaysia, oavsett om produkternas deklarerade ursprung är Malaysia
    eller inte) genom att bevilja en exporterande tillverkare från Malaysia befrielse
    från dessa bestämmelser och genom att sluta registrera importen från den exporterande
    tillverkaren
  type: main
