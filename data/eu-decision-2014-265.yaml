    ar ko tiek grauta vai apdraudēta Ukrainas teritoriālā integritāte, suverenitāte
    un neatkarība
  type: main
- language: lt
  script: Latn
  content: 2014 m. gegužės 12 d. Tarybos sprendimas 2014/265/BUSP, kuriuo iš dalies
    keičiamas Sprendimas 2014/145/BUSP dėl ribojamųjų priemonių, taikytinų atsižvelgiant
    į veiksmus, kuriais kenkiama Ukrainos teritoriniam vientisumui, suverenitetui
    ir nepriklausomybei arba į juos kėsinamasi
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2014/265/PESK tat- 12 ta’ Mejju 2014 li temenda
    d-Deċiżjoni 2014/145/PESK dwar miżuri restrittivi fir-rigward ta' azzjonijiet
    li jipperikolaw jew jheddu l-integrità territorjali, is-sovranità u l-indipendenza
    tal-Ukraina
  type: main
- language: nl
  script: Latn
  content: Besluit 2014/265/GBVB van de Raad van 12 mei 2014 tot wijziging van Besluit
    2014/145/GBVB betreffende beperkende maatregelen met betrekking tot acties die
    de territoriale integriteit, soevereiniteit en onafhankelijkheid van Oekraïne
    ondermijnen of bedreigen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2014/265/WPZiB z dnia 12 maja 2014 r. zmieniająca decyzję
    2014/145/WPZiB w sprawie środków ograniczających w związku z działaniami
    podważającymi integralność terytorialną, suwerenność i niezależność
    Ukrainy lub im zagrażającymi
  type: main
- language: pt
  script: Latn
  content: Decisão 2014/265/PESC do Conselho, de 12 de Maio de 2014 , que altera
    a Decisão 2014/145/PESC, que impõe medidas restritivas no que diz respeito a
    ações que comprometam ou ameacem a integridade territorial, a soberania e a
    independência da Ucrânia
  type: main
- language: ro
  script: Latn
  content: Decizia 2014/265/PESC a Consiliului din 12 mai 2014 de modificare a Deciziei
    2014/145/PESC privind măsuri restrictive în raport cu acțiunile care subminează
    sau amenință integritatea teritorială, suveranitatea și independența Ucrainei
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2014/265/SZBP z 12. mája 2014 , ktorým sa mení rozhodnutie
    2014/145/SZBP o reštriktívnych opatreniach vzhľadom na konanie, ktorým sa
    narúša alebo ohrozuje územná celistvosť, zvrchovanosť a nezávislosť Ukrajiny
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2014/265/SZVP z dne 12. maja 2014 o spremembi Sklepa 2014/145/SZVP
    o omejevalnih ukrepih v zvezi z ukrepi, ki spodkopavajo ali ogrožajo ozemeljsko
    nedotakljivost, suverenost in neodvisnost Ukrajine
  type: main
- language: es
  script: Latn
  content: Decisión 2014/265/PESC del Consejo, de 12 de mayo de 2014 , por la que
    se modifica la Decisión 2014/145/PESC relativa a medidas restrictivas respecto
    de acciones que menoscaban o amenazan la integridad territorial, la soberanía
    y la independencia de Ucrania
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2014/265/Gusp av den 12 maj 2014 om ändring av beslut 2014/145/Gusp
    om restriktiva åtgärder mot åtgärder som undergräver eller hotar Ukrainas
    territoriella integritet, suveränitet och oberoende
