title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/438 of 24 February 2023 granting
    a derogation requested by certain Member States pursuant to Regulation (EU) No
    952/2013 of the European Parliament and of the Council to use means other than
    electronic data-processing techniques for the exchange and storage of information
    for Release 2 of the Import Control System 2 (notified under document C(2023)
    1174) (Only the Croatian, Danish, Dutch, Estonian, French, German, Greek, Polish,
    Romanian and Swedish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/438 de la Commission du 24 février
    2023 accordant une dérogation demandée par certains États membres en application
    du règlement (UE) no 952/2013 du Parlement européen et du Conseil relative à
    l’utilisation de moyens autres que des procédés informatiques de traitement
    des données pour l’échange et le stockage d’informations aux fins de la
    deuxième version du système de contrôle des importations 2 [notifiée sous
    le numéro C(2023) 1174] (Les textes en langues allemande, croate, danoise, estonienne,
    française, grecque, néerlandaise, polonaise, roumaine et suédoise sont les
    seuls faisant foi.)
  type: main
