    der Gemeinschaft zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen
    für land- und forstwirtschaftliche Erzeugnisse in Portugal (Nur der portugiesische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/666/EF: KOMMISSIONENS BESLUTNING af 7. december 1993 om ændring af
