    του κοινοτικού πλαισίου στήριξης που αναφέρεται
    στη χορήγηση κοινοτικής διαρθρωτικής βοήθειας
    στην Πορτογαλία προκειμένου να βελτιωθούν
    οι συνθήκες μεταποίησης και εμπορίας των γεωργικών
    και δασοκομικών προϊόντων (Το κείμενο στην
