title:
- language: en
  script: Latn
  content: '93/666/EC: Commission Decision of 7 December 1993 amending the supplement
    to the addendum to the Community support framework for Community structural assistance
    in Portugal on the improvement of the conditions under which agricultural and
    forestry products are processed and marketed (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/666/CE: Décision de la Commission du 7 décembre 1993 établissant
    une modification au supplément à l''avenant au cadre communautaire d''appui
    pour les interventions structurelles communautaires au Portugal relatif à l''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    et sylvicoles (Le texte en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/666/EG: ENTSCHEIDUNG DER KOMMISSION vom 7. Dezember 1993 zur Änderung
