  script: Latn
  content: '93/666/CE: DECISIONE DELLA COMMISSIONE del 7 dicembre 1993 che modifica
    il supplemento all'' addendum del quadro comunitario di sostegno per gli interventi
    strutturali comunitari in Portogallo in ordine al miglioramento delle condizioni
    di trasformazione e di commercializzazione dei prodotti agricoli e della silvicoltura
    (Il testo in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
