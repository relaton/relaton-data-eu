title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1136/92 of 4 May 1992 determining the extent
    to which applications lodged in April 1992 for import licences for fresh, chilled
    or frozen beef under the import arrangements provided for in the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary
    and the Czech and Slovak Federal Republic (CSFR) can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1136/92 de la Commission du 4 mai 1992 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 1992 pour les viandes bovines fraîches, réfrigérées ou
    congelées dans le cadre des régimes d'importation prévus par les accords intérimaires
    conclus par la Communauté avec la République de Pologne, la République de Hongrie
    et la République fédérative tchèque et slovaque (RFTS)
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1136/92 DER KOMMISSION vom 4. Mai 1992 zur Festsetzung
    des Umfangs, in dem die im April 1992 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Interimsabkommen zwischen
    der Gemeinschaft und der Republik Polen, der Republik Ungarn und der Tschechischen
    und Slowakischen Föderativen Republik (TSFR) genehmigt werden können #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1136/92 af 4. maj 1992 om fastsættelse
