    του οποίου δύναται να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Απρίλιο του 1992 για τα νωπά, διατηρημένα
    με απλή ψύξη ή κατεψυγμένα βόεια κρέατα στα
