  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1136/92 DELLA COMMISSIONE del 4 maggio 1992 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'' importazione
    presentate nel mese di aprile 1992 per le carni bovine fresche, refrigerate o
    congelate nel quadro dei regimi di importazione previsti dagli accordi interinali
    conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria
    e la Repubblica federativa ceca e slovacca (RFCS) #'
  type: main
