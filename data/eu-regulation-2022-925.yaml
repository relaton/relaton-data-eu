    les maladies répertoriées d’animaux aquatiques et la liste des espèces et
    groupes d’espèces présentant un risque considérable du point de vue de la
    propagation de ces maladies répertoriées
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/925 der Kommission vom 14. Juni 2022
