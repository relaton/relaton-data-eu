- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/925 of 14 June 2022 amending
    the Annex to Implementing Regulation (EU) 2018/1882 concerning listed diseases
    of aquatic animals and the list of species and groups of species posing a considerable
    risk for the spread of those listed diseases
  type: main
- language: fr
  script: Latn
