    o nákazy vodních živočichů uvedené na seznamu a o seznam druhů a skupin
    druhů, které představují značné riziko šíření zmíněných nákaz uvedených
    na seznamu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/925 af 14. juni 2022
