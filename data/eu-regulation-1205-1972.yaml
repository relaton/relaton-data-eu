title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1205/72 de la Commission, du 8 juin 1972, modifiant
    le taux de la restitution à l'exportation fixé à l'avance en ce qui concerne
    certains produits agricoles exportés sous forme de certaines marchandises ne
    relevant pas de l'annexe II du Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1205/72 der Kommission vom 8. Juni 1972 zur Änderung
    des im voraus festgesetzten Ausfuhrerstattungsbetrags für bestimmte landwirtschaftliche
    Erzeugnisse, die in Form von bestimmten Waren ausgeführt werden, die nicht unter
    Anhang II des Vertrages fallen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1205/72 della Commissione, dell'8 giugno 1972, che
    modifica il tasso delle restituzioni all'esportazione fissato in anticipo per
    certi prodotti agricoli esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1205/72 van de Commissie van 8 juni 1972 houdende
    wijziging van de vooraf vastgestelde restituties bij uitvoer van bepaalde landbouwprodukten
    in de vorm van bepaalde niet onder bijlage II van het Verdrag vallende goederen
  type: main
