    undertaking EPAC - Empresa Para a Agroalimentação e Cereais SA (Only the Portuguese
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/433/CE: Décision de la Commission du 30 avril 1997 demandant au gouvernement
