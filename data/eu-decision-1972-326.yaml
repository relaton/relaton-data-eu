title:
- language: fr
  script: Latn
  content: '72/326/CEE: Décision de la Commission, du 25 août 1972, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les tissus de fibres textiles synthétiques
    discontinues, contenant moins de 85 % en poids de fibres textiles synthétiques,
    mélangées principalement ou exclusivement de laine ou de poils finis, fabriqués
    avec des fils de diverses couleurs, de la position 56.07 A Ex II du Tarif douanier
    commun, originaires de Roumanie et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: '72/326/EWG: Entscheidung der Kommission vom 25. August 1972, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern, mit einem
    Anteil an synthetischen Spinnfasern von weniger als 85 Gewichtshundertteilen,
    hauptsächlich oder nur mit Wolle oder feinen Tierhaaren gemischt, buntgewebt,
    der Tarifnummer 56.07 A ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/326/CEE: Decisione della Commissione, del 25 agosto 1972, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i tessuti di fibre tessili sintetiche
    in fiocco, contenenti meno dell''85 %, in peso, di fibre tessili sintetiche, principalmente
    o esclusivamente misti con lana o peli fini, fabbricati con fili di diversi colori
    della voce n. 56.07 A ex II della tariffa doganale comune, originari della Romania
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/326/EEG: Beschikking van de Commissie van 25 augustus 1972 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd weefsels van synthetische stapelvezels, bevattende minder dan
    85 gewichtspercenten synthetische vezels, enkel of hoofdzakelijk met wol of fijn
    haar gemengd, geweven met verschillend gekleurd garen van post 56.07 A ex II van
    het gemeenschappelijk douanetarief, van oorsprong uit Roemenië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
