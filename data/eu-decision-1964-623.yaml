  content: Décision 64/623/CEE de la Commission, du 26 octobre 1964, portant nouvelle
    modification de sa décision du 20 décembre 1963, autorisant la République italienne
    à adopter des mesures de sauvegarde pour le plomb brut et le zinc brut
  type: main
- language: de
  script: Latn
  content: '64/623/EWG: Entscheidung der Kommission vom 26. Oktober 1964 zur erneuten
    Änderung der Entscheidung vom 20. Dezember 1963, mit der die Italienische Republik
    ermächtigt wird, Schutzmaßnahmen für Rohblei und für Rohzink anzuwenden'
  type: main
- language: it
  script: Latn
  content: '64/623/CEE: Decisione della Commissione, del 26 ottobre 1964, che modifica
    nuovamente la sua decisione del 20 dicembre 1963, con la quale ha accordato alla
    Repubblica italiana misure di salvaguardia per il piombo e lo zinco greggi'
  type: main
- language: nl
  script: Latn
  content: '64/623/EEG: Beschikking van de Commissie van 26 oktober 1964 tot verdere
    wijziging van haar beschikking van 20 december 1963, waarbij de Italiaanse Republiek
    wordt gemachtigd tot het nemen van vrijwaringsmaatregelen voor ruw lood en ruw
    zink'
  type: main
