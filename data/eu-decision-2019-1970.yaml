    8378)
  type: main
- language: hu
  script: Latn
  content: A Bizottság Végrehajtási Határozata 2019/1970 (2019. november 26.)
    a 93/52/EGK határozat II. mellékletének a hivatalosan brucellózistól (B.
    melitensis) mentes státusz tekintetében, a 2003/467/EK határozat II. mellékletének
    Spanyolország egyes régióinak hivatalosan brucellózistól mentes státusza
    tekintetében, valamint a 2008/185/EK határozat I. és II. mellékletének az
    Aujeszky-féle betegségtől való mentes státusz, illetve a betegség felszámolására
    irányuló, Olaszország egyes régióira kiterjedő programok jóváhagyása
    tekintetében történő módosításáról (az értesítés a C(2019) 8378. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione Di Esecuzione (UE) 2019/1970 Della Commissione del 26 novembre
    2019 che modifica l’allegato II della decisione 93/52/CEE per quanto riguarda
    la qualifica di ufficialmente indenni da brucellosi (B. melitensis) e l’allegato
    II della decisione 2003/467/CE per quanto riguarda la qualifica di ufficialmente
    indenni da brucellosi di alcune regioni della Spagna e gli allegati I e II della
    decisione 2008/185/CE per quanto riguarda la qualifica di indenni e l’approvazione
    dei programmi di eradicazione della malattia di Aujeszky di alcune regioni dell’Italia
    [notificata con il numero C(2019) 8378]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1970 (2019. gada 26. novembris),
    ar ko attiecībā uz oficiāli no brucelozes (B. melitensis) brīvu statusu groza
    Lēmuma 93/52/EEK II pielikumu, attiecībā uz atsevišķu Spānijas reģionu
    kā oficiāli no brucelozes brīvu reģionu statusu groza Lēmuma 2003/467/EK
    II pielikumu un attiecībā uz atsevišķu Itālijas reģionu kā no Aujeski slimības
    brīvu reģionu statusu un attiecībā uz Aujeski slimības izskaušanas programmu
    apstiprināšanu atsevišķiem Itālijas reģioniem groza Lēmuma 2008/185/EK
    I un II pielikumu (izziņots ar dokumenta numuru C(2019) 8378)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Sprendimas (ES) 2019/1970 2019 m. lapkričio 26
    d. kuriuo dėl pripažinimo, kad tam tikruose Ispanijos regionuose bruceliozės
    (B. melitensis)) oficialiai nenustatyta, iš dalies keičiamas Sprendimo 93/52/EEB
    II priedas, dėl pripažinimo, kad tam tikruose Ispanijos regionuose bruceliozės
    oficialiai nenustatyta, iš dalies keičiamas Sprendimo 2003/467/EB II priedas
    ir dėl pripažinimo, kad tam tikruose Italijos regionuose Aujeskio ligos nenustatyta,
    ir dėl Aujeskio ligos likvidavimo tam tikruose Italijos regionuose programų
    patvirtinimo iš dalies keičiami Sprendimo 2008/185/EB I ir II priedai (pranešta
    dokumentu Nr. C(2019) 8378)
  type: main
