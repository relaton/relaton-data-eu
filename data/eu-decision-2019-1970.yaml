    liitteen II muuttamisesta siltä osin kuin on kyse Espanjan tiettyjen alueiden
    luomistaudista (B. melitensis) virallisesti vapaasta asemasta sekä päätöksen
    2008/185/EY liitteiden I ja II muuttamisesta siltä osin kuin on kyse Italian
    tiettyjen alueiden Aujeszkyn taudista vapaasta asemasta ja Aujeszkyn taudin hävittämisohjelmien
    hyväksymisestä (tiedoksiannettu numerolla C(2019) 8378)
  type: main
