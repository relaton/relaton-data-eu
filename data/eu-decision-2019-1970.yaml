    на програмите за ликвидиране на болестта за
    някои региони на Италия (нотифицирано под номер
    С(2019) 8378)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1970 ze dne 26. listopadu 2019,
