title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1970 of 26 November 2019 amending
    Annex II to Decision 93/52/EEC as regards the officially brucellosis (B. melitensis)-free
    status and Annex II to Decision 2003/467/EC as regards the officially brucellosis-free
    status of certain regions of Spain and Annexes I and II to Decision 2008/185/EC
    as regards the free status and the approval of the eradication programmes for
    Aujeszky’s disease for certain regions of Italy (notified under document C(2019)
    8378)
  type: main
- language: fr
  script: Latn
  content: Décision d’Exécution (UE) 2019/1970 de la Commission du 26 novembre
    2019 modifiant l’annexe II de la décision no 93/52/CEE en ce qui concerne le
    statut officiellement indemne de brucellose (B. Melitensis) et l’annexe II de
    la décision no 2003/467/CE en ce qui concerne le statut officiellement indemne
    de brucellose de certaines régions d’Espagne ainsi que les annexes I et II
    de la décision 2008/185/CE en ce qui concerne le statut indemne et l’approbation
    des programmes d’éradication de la maladie d’Aujeszky pour certaines régions
    d’Italie [notifiée sous le numéro C(2019) 8378]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1970 der Kommission vom 26. November
    2019 zur Änderung des Anhangs II der Entscheidung 93/52/EWG in Bezug auf den
    Status als amtlich anerkannt frei von Brucellose (B. melitensis) und des Anhangs
    II der Entscheidung 2003/467/EG in Bezug auf den Status bestimmter Regionen Spaniens
    als amtlich anerkannt brucellosefrei sowie der Anhänge I und II der Entscheidung
    2008/185/EG in Bezug auf den Status als amtlich anerkannt frei von der Aujeszky-Krankheit
    und die Genehmigung der Programme zur Tilgung dieser Krankheit in bestimmten Regionen
    Italiens (Bekannt gegeben unter Aktenzeichen C(2019) 8378)
  type: main
