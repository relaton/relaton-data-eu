  script: Latn
  content: '94/226/EEG: Beschikking van de Commissie van 27 oktober 1993 inzake de
    toekenning van bijstand uit het cohesie- financieringsinstrument voor een project
    in Griekenland inzake: - riolering voor de gemeente Souflio - afvoer van riool-
    en regenwater uit Chania - riolering in Parga - riolering in Kiato - riolering
    in Xilokastro - een hoofdafvoerkanaal voor Veria - de afvoer van riool- en regenwater
    uit Veria - een rioleringsstelsel in Patras - de uitbouw van het net van riolen
    en hoofdriolen in Egio - uitbouw van het rioleringsstelsel in Karditsa - aanleg
    van riolering op Skiathos Nr. CF: 93/09/61/021 - 93/09/61/022 - 93/09/61/024 -
    93/09/61/031 - 93/09/61/032 - 93/09/61/033 - 93/09/61/049 - (Slechts de tekst
    in de Griekse taal is authentiek)'
  type: main
