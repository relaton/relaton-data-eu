    l''estensione della rete fognaria e il completamento di opere essenziali della
    stessa nel comune di Egio - l''estensione della rete fognaria della città di
    Karditsa - la rete fognaria di Skiathos n. FC: 93/09/61/021 - 93/09/61/022 - 93/09/61/024
