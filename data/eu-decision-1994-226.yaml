  script: Latn
  content: '94/226/EEC: Commission Decision of 27 October 1993 concerning the granting
    of assistance from the cohesion financial instrument to the project in Greece
    - Drainage for the Municipality of Souflio - Drainage for sewage and rainwater
    for the town of Chania - Drainage of Parga - Drainage in Kiato - Drainage in Xilokastro
    - Central drain for Veria - Drainage for sewage/rainwater for the town of Veria
    - Drainage system for Patra - Extension of the drainage system and completion
    of basic drainage work for the Municipality of Egio - Extension of the drainage
    system for the town of Karditsa - Drainage system for Skiathos. Nos CF: 93/09/61/021
    - 93/09/61/022 - 93/09/61/024 - 93/09/61/031 - 93/09/61/032 - 93/09/61/033 - 93/09/61/049
    (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/226/CEE: Décision de la Commission du 27 octobre 1993 relative à
    l''octroi d''un concours de l''instrument financier de cohésion pour les projets
    suivants en Grèce: évacuation des eaux usées de la municipalité de Souflio
    - évacuation des effluents d''égouts et de l''eau de pluie de la ville de La
    Canée - évacuation des eaux usées de Parga - évacuation des eaux usées de
    Kiato - évacuation des eaux usées de Xilokastro - installation d''un système
    central d''évacuation des eaux usées à Veria - évacuation des effluents d''égouts
    et de l''eau de pluie à Veria - évacuation des eaux usées de Patras - agrandissement
    du système d''évacuation des eaux usées et achèvement des infrastructures
    d''évacuation de base dans la municipalité d''Egion - agrandissement du système
    d''évacuation des eaux usées à Karditsa - installation d''un système d''évacuation
    des eaux usées à Skiathos n° FC: 93/09/61/021 - 93/09/61/022 - 93/09/61/024
    - 93/09/61/031 - 93/09/61/032 - 93/09/61/033 - 93/09/61/049 - (Le texte en langue
    grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/226/EWG: Entscheidung der Kommission vom 27. Oktober 1993 über die
    Gewährung einer Unterstützung aus dem Kohäsions-Finanzinstrument für ein Vorhaben
    in Griechenland betreffend - Kanalisation für die Gemeinde Souflio - Kanalisation
    für Abwasser und Niederschlagswasser in der Stadt Chania - Kanalisation in Parga
    - Kanalisation in Kiato - Kanalisation in Xilokastro - Zentrales Sickerrohr für
    Veria - Kanalisation für Abwasser / Niederschlagswasser in der Stadt Veria -
    Kanalisationsanlage für Patras - Erweiterung der Kanalisationsanlage und Abschluß
