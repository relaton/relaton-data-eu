  content: '94/226/CEE: Decisione della Commissione del 27 ottobre 1993 relativa alla
    concessione di un contributo dello strumento finanziario di coesione a favore
    di un progetto in Grecia riguardante: - la rete fognaria del comune di Souflio
    - la rete fognaria e di raccolta delle acque meteoriche della città di Chania
    - la rete fognaria di Parga - la rete fognaria di Kiato - la rete fognaria di
    Xilokastro - il collettore centrale di Veria - la rete fognaria e di raccolta
