title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 octobre 1971, autorisant la République
    italienne à exclure du traitement communautaire les roulements de tous genres,
    de la position 84.62 du Tarif douanier commun, originaires du Japon et mis en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/358/EWG: Entscheidung der Kommission vom 21. Oktober 1971, mit der
    die Italienische Republik ermächtigt wird, die aus Japan stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen Wälzlager aller Art der
    Tarifnummer 84.62 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/358/CEE: Decisione della Commissione, del 21 ottobre 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i cuscinetti a
    rotolamento di ogni specie, della voce n. 84.62 della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/358/EEG: Beschikking van de Commissie van 21 oktober 1971 waarbij de
    Italiaanse Republiek wordt gemachtigd kogellagers, naaldlagers en rollagers van
    post 84.62 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
