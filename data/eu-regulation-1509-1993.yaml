    40.0590, 40.1090 und 42.1590) mit Ursprung in China, für die die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1509/93 af 18. juni 1993 om genindførelse
