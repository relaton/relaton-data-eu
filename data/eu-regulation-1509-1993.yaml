  content: COMMISSION REGULATION (EEC) No 1509/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 59, 109 and 159 (order
    Nos 40.0590, 40.1090 and 42.1590), originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1509/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    59, 109 et 159 (numéros d'ordre 40.0590, 40.1090 et 42.1590) originaires de Chine
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1509/93 DER KOMMISSION vom 18. Juni 1993 zur Wiedereinführung
