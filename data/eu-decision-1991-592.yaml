title:
- language: en
  script: Latn
  content: '91/592/EEC: Commission Decision of 5 November 1991 amending Commission
    Decision 89/599/EEC approving derogations provided for by Greece, Italy and Portugal
    from certain provisions of Council Directive 77/93/EEC in respect of seed potatoes
    originating in Canada (Only the Greek, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/592/CEE: Décision de la Commission du 5 novembre 1991 modifiant la
    décision 89/599/CEE approuvant des dérogations prévues par la Grèce, l''Italie
    et le Portugal à certaines dispositions de la directive 77/93/CEE du Conseil
    en ce qui concerne les plants de pommes de terre originaires du Canada (Les textes
    en langues grecque, italienne et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 5. November 1991 zur Änderung der Entscheidung
    89/599/EWG zur Genehmigung der von Griechenland, Italien und Portugal für Pflanzkartoffeln
    mit Ursprung in Kanada vorgesehenen Ausnahmen von bestimmten Vorschriften der
    Richtlinie 77/93/EWG des Rates (Nur der griechische, der italienische und der
    portugiesische Text sind verbindlich) (91/592/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 5. november 1991 om ændring af beslutning
    89/599/EØF om godkendelse af de af Grækenland, Italien og Portugal fastsatte
    undtagelser fra visse bestemmelser i Rådets direktiv 77/93/EØF for så vidt
    angår læggekartofler med oprindelse i Canada (Kun de græske, italienske og
    portugisiske udgaver er autentiske) (91/592/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/592/ΕΟΚ: Απόφαση της Επιτροπής, της 5ης
    Νοεμβρίου 1991, που τροποποιεί την απόφαση 89/599/ΕΟΚ
    για την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ελλάδα, την Ιταλία και την Πορτογαλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 5 novembre 1991 recante modifica della
    decisione 89/599/CEE che approva le deroghe, previste dalla Grecia, dall'' Italia
    e dal Portogallo, a talune disposizioni della direttiva 77/93/CEE del Consiglio
    per quanto riguarda i tuberi-seme di patate originari del Canada (I testi in lingua
    greca, italiana e portoghese sono i soli facenti fede) (91/592/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 5 november 1991 tot wijziging van Beschikking
    89/599/EEG tot goedkeuring van de door Griekenland, Italië en Portugal vastgestelde
    afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG van de Raad ten aanzien
    van pootaardappelen van oorsprong uit Canada (Slechts de teksten in de Griekse,
    de Italiaanse en de Portugese taal zijn authentiek) (91/592/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 5 de Novembro de 1991 que altera a Decisão 89/599/CEE,
    que aprova derrogações estabelecidas pela Grécia, pela Itália e por Portugal
    de determinadas normas da Directiva 77/93/CEE do Conselho no que respeita às
    batatas de semente originárias do Canadá (Apenas fazem fé os textos nas línguas
    grega, italiana e portuguesa) (91/592/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 5 de noviembre de 1991 por la que se modifica
    la Decisión 89/599/CEE, por la que se autorizan las excepciones previstas por
    Grecia, Italia y Portugal respecto de determinadas disposiciones de la Directiva
    77/93/CEE del Consejo relativas a las patatas de siembra originarias de Canadá
    (Los textos en lengua griega, italiana y portuguesa son los únicos auténticos)
    (91/592/CEE) #'
