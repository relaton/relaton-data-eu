    meaning of Directive 75/268/EEC on mountain and hill farming and farming in certain
    less-favoured areas'
  type: main
- language: fr
  script: Latn
  content: '76/557/CEE: Décision du Conseil, du 21 juin 1976, concernant l'' assimilation
