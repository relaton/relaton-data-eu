title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1962/81 of 10 July 1981 fixing the coefficients
    to be applied to production aid for tomato concentrates and prunes and to the
    minimum price for dried plums (prunes d' Ente)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1962/81 de la Commission, du 10 juillet 1981, fixant
    les coefficients à appliquer au montant de l' aide à la production pour les
    concentrés de tomates et les pruneaux et au prix minimal fixé pour les prunes
    d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1962/81 der Kommission vom 10. Juli 1981 zur Festsetzung
    der Koeffizienten, mit denen der für Tomatenmark und Trockenpflaumen festgesetzte
    Betrag der Produktionsbeihilfe und der für getrocknete Pflaumen (pruned d' Ente)
    festgesetzte Mindestpreis zu multiplizieren sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1962/81 af 10. juli 1981 om fastsættelse
    af de koefficienter, hvormed producentstøtten for tomatkoncentrater og svesker
    samt minimumsprisen for tørrede blommer ("prunes d' ente") skal multipliceres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1962/81 τής Επιτροπής
    τής 10ης Ιουλίου 1981 περί καθορισμού τών συντελεστών
    πού πρέπει νά εφαρμοσθούν στό ποσό τής ενισχύσεως
    στήν παραγωγή γιά τόν τοματοπολτό καί τά αποξηραμένα
    δαμάσκηνα καθώς καί στήν ελάχιστη τιμή πού
    καθορίζεται γιά τά αποξηραμένα δαμάσκηνα Ente
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1962/81 della Commissione, del 10 luglio 1981, che
    stabilisce i coefficienti da applicare all' aiuto alla produzione per i concentrati
    di pomodori e per le prugne secche ed al prezzo minimo fissato per le susine da
    innesto (prunes d' Ente)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1962/81 van de Commissie van 10 juli 1981 tot vaststelling
    van de coëfficiënten die moeten worden toegepast op het bedrag van de steun
    bij de produktie die voor tomatenconcentraat en pruimedanten en op de voor gedroogde
    geënte pruimen (,,Prunes d' Ente' ' ) vastgestelde minimumprijs
