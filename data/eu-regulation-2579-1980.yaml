title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2579/80 of 8 October 1980 re-establishing
    the levying of customs duties on antimony oxides, falling within subheading 28.28
    ex N and originating in Bolivia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2579/80 de la Commission, du 8 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux oxydes d'
    antimoine, de la sous-position 28.28 ex N du tarif douanier commun, originaires
    de Bolivie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2579/80 der Kommission vom 8. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Antimonoxide der Tarifstelle 28.28 ex N, mit Ursprung in Bolivien,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2579/80 af 8. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for antimonoxider, under pos. 28.28 ex N, som har
    oprindelse i Bolivia og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2579/80 della Commissione, dell' 8 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli ossidi di antimonio
    della sottovoce 28.28 ex N della tariffa doganale comune, originari della Bolivia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2579/80 van de Commissie van 8 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op antimoonoxyden
    van post 28.28 ex N, van oorsprong uit Bolivië ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
