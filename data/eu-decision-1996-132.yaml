title:
- language: en
  script: Latn
  content: '96/132/EC: Commission Decision of 26 January 1996 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products'
  type: main
- language: fr
  script: Latn
  content: '96/132/CE: Décision de la Commission, du 26 janvier 1996, modifiant la
    décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l'' importation d'' animaux des espèces
    bovine, porcine, des équidés, des ovins et des caprins, des viandes fraîches
    et des produits à base de viande'
  type: main
- language: de
  script: Latn
  content: '96/132/EG: Entscheidung der Kommission vom 26. Januar 1996 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen'
  type: main
- language: da
  script: Latn
  content: '96/132/EF: Kommissionens beslutning af 26. januar 1996 om ændring af
    Rådets beslutning 79/542/EØF om listen over de tredjelande, hvorfra medlemsstaterne
    tillader indførsel af kvæg, svin, enhovede dyr, får og geder samt fersk kød
    og kødprodukter'
  type: main
- language: el
  script: Grek
  content: '96/132/ΕΚ: Απόφαση της Επιτροπής, της 26ης Ιανουαρίου
    1996, για την τροποποίηση της απόφασης 79/542/ΕΟΚ
    του Συμβουλίου με την οποία καταρτίζεται πίνακας
    των τρίτων χωρών από τις οποίες τα κράτη μέλη
    επιτρέπουν την εισαγωγή ζώων όπως τα βοοειδή,
    οι χοίροι, τα ιπποειδή, οι αίγες και τα πρόβατα,
    τα νωπά κρέατα και τα προϊόντα με βάση το κρέας'
  type: main
- language: fi
  script: Latn
  content: '96/132/EY: Komission päätös, tehty 26 päivänä tammikuuta 1996, luettelosta
    kolmansista maista, joista jäsenvaltiot sallivat nautaeläinten, sikojen, kavioeläinten,
    lampaiden ja vuohien, tuoreen lihan sekä lihavalmisteiden tuonnin, tehdyn neuvoston
    päätöksen 79/542/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/132/CE: Decisione della Commissione, del 26 gennaio 1996, che modifica
    la decisione 79/542/CEE del Consiglio, recante l'' elenco dei paesi terzi da cui
    gli Stati membri autorizzano l'' importazione di animali delle specie bovina,
    suina, equina, ovina e caprina, di carni fresche e di prodotti a base di carne'
  type: main
- language: nl
  script: Latn
  content: '96/132/EG: Beschikking van de Commissie van 26 januari 1996 houdende wijziging
    van Beschikking 79/542/EEG van de Raad tot vaststelling van een lijst van derde
    landen waaruit de Lid-Staten de invoer van runderen, varkens, paardachtigen, schapen
    en geiten, vers vlees en vleesprodukten toestaan'
  type: main
- language: pt
  script: Latn
  content: '96/132/CE: Decisão da Comissão, de 26 de Janeiro de 1996, que altera
    a Decisão 79/542/CEE do Conselho, que estabelece uma lista de países terceiros
    a partir dos quais os Estados-membros autorizam a importação de bovinos, suínos,
    equídeos, ovinos e caprinos, carne fresca e produtos à base de carne'
  type: main
- language: es
  script: Latn
  content: '96/132/CE: Decisión de la Comisión, de 26 de enero de 1996, por la que
