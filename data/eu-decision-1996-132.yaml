    lista de terceros países desde los cuales los Estados miembros autorizan importaciones
    de animales de las especies bovina, porcina, ovina y caprina, de équidos, de
    carne fresca y de productos a base de carne'
  type: main
- language: sv
  script: Latn
  content: '96/132/EG: Kommissionens beslut av den 26 januari 1996 om ändring av
