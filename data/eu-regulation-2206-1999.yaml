  script: Latn
  content: Komission asetus (EY) N:o 2206/1999, annettu 18 päivänä lokakuuta 1999,
    euron muuntokursseista kansalliseksi rahayksiköksi tai 1 päivästä syyskuuta
    1999 alkaen sovellettavista valuuttakursseista johtuvien tasaustukien enimmäismäärän
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2206/1999 della Commissione, del 18 ottobre 1999, che
