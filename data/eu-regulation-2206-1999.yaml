    το ανώτατο ποσό της αντισταθμιστικής ενίσχυσης
    που προκύπτει από το συντελεστή του ευρώ σε
    μονάδες εθνικού νομίσματος ή τις ισοτιμίες
    που εφαρμόζονται την 1η Σεπτεμβρίου 1999
  type: main
