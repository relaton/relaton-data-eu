    die Militäroperation der Europäischen Union als Beitrag zur maritimen Sicherheit
    im westlichen Indischen Ozean und im Roten Meer (EUNAVFOR ATALANTA) und zur Aufhebung
    des Beschlusses (GASP) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: bg
  script: Cyrl
