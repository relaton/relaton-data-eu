    и сигурност от 7 февруари 2023 година за назначаване
    на командващия силите на ЕС за военната операция
    на Европейския съюз, предназначена да допринесе
    за морската сигурност в западната част на Индийския
    океан и в Червено море (EUNAVFOR ATALANTA), и за отмяна
    на Решение (ОВППС) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Politického a Bezpečnostního Výboru (SZBP) 2023/311 ze
