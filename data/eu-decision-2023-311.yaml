    unie s cílem přispět k námořní bezpečnosti v západní části Indického
    oceánu a v Rudém moři (EUNAVFOR ATALANTA) a o zrušení rozhodnutí (SZBP)
    2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: da
  script: Latn
