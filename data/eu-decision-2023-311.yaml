    Europejskiej mającej na celu wnoszenie wkładu w bezpieczeństwo morskie w zachodniej
    części Oceanu Indyjskiego i na Morzu Czerwonym (EUNAVFOR Atalanta) oraz uchylająca
    decyzję (WPZiB) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
