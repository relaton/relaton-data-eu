  type: main
- language: hr
  script: Latn
  content: Odluka Političkog i sigurnosnog odbora (ZVSP) 2023/311 od 7. veljače
    2023. o imenovanju zapovjednika snaga EU-a za vojnu operaciju Europske unije za
    doprinos pomorskoj sigurnosti u zapadnom Indijskom oceanu i Crvenom moru (EUNAVFOR
    ATALANTA) i stavljanju izvan snage Odluke (ZVSP) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: hu
  script: Latn
  content: A Politikai és Biztonsági Bizottság (KKBP) 2023/311 határozata (2023.
    február 7.) az Indiai-óceán nyugati térségében és a Vörös-tengeren a
    tengeri védelemhez való hozzájárulás céljából folytatott európai uniós
    katonai művelethez (EUNAVFOR ATALANTA) az EU-erők parancsnokának kinevezéséről
    és a (KKBP) 2022/2205 határozat hatályon kívül helyezéséről (EUNAVFOR
    ATALANTA/1/2023)
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2023/311 del comitato politico e di sicurezza del 7 febbraio
    2023 relativa alla nomina del comandante della forza dell’UE per l’operazione
    militare dell’Unione europea volta a contribuire alla sicurezza marittima nell’Oceano
    Indiano occidentale e nel Mar Rosso (EUNAVFOR ATALANTA) e che abroga la decisione
    (PESC) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: lv
  script: Latn
  content: Politikas un drošības komitejas Lēmums (KĀDP) 2023/311 (2023. gada
    7. februāris), ar ko ieceļ ES spēku komandieri Eiropas Savienības militārajai
    operācijai ar mērķi palīdzēt nodrošināt jūras drošību Indijas okeāna
    rietumdaļā un Sarkanajā jūrā (EUNAVFOR ATALANTA) un atceļ Lēmumu (KĀDP)
    2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: lt
  script: Latn
  content: Politinio ir saugumo komiteto sprendimas (BUSP) 2023/311 2023 m. vasario
    7 d. dėl Europos Sąjungos karinės operacijos, skirtos prisidėti prie laivybos
    saugumo vakarinėje Indijos vandenyno dalyje ir Raudonojoje jūroje (EUNAVFOR
    ATALANTA), ES pajėgų vado skyrimo, kuriuo panaikinamas Sprendimas (BUSP) 2022/2205
    (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kumitat Politiku u ta’ Sigurtà (PESK) 2023/311 tas-7
    ta’ Frar 2023 dwar il-ħatra tal-Kmandant tal-Forza tal-UE għall-operazzjoni
    militari tal-Unjoni Ewropea bil-ħsieb ta’ kontribut għas-sigurtà marittima
    fil-Punent tal-Oċean Indjan u fil-Baħar l-Aħmar (EUNAVFOR ATALANTA), u li tħassar
    id-Deċiżjoni (PESK) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: nl
  script: Latn
