    Euroopan unionin sotilasoperaatioon, jolla edistetään merellistä turvallisuutta
    läntisellä Intian valtamerellä ja Punaisellamerellä (EUNAVFOR ATALANTA), sekä
    päätöksen (YUTP) 2022/2205 kumoamisesta (EUNAVFOR ATALANTA/1/2023)
  type: main
