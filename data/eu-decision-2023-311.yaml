    για τη στρατιωτική επιχείρηση της Ευρωπαϊκής
    Ένωσης που θα συμβάλει στην ασφάλεια στη θάλασσα
    στον Δυτικό Ινδικό Ωκεανό και στην Ερυθρά Θάλασσα
