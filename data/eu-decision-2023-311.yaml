  content: Political and Security Committee Decision (CFSP) 2023/311 of 7 February
    2023 on the appointment of the EU Force Commander for the European Union military
    operation to contribute to maritime security in the West Indian Ocean and in the
    Red Sea (EUNAVFOR ATALANTA), and repealing Decision (CFSP) 2022/2205 (EUNAVFOR
    ATALANTA/1/2023)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2023/311 du Comité politique et de sécurité du 7 février
    2023 portant nomination du commandant de la force de l’Union européenne pour
    l’opération militaire de l’Union européenne en vue d’une contribution
    à la sûreté maritime dans l’ouest de l’océan Indien et en mer Rouge (EUNAVFOR
    ATALANTA) et abrogeant la décision (PESC) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: de
  script: Latn
