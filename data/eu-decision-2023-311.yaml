    k pomorski varnosti v zahodnem Indijskem oceanu in Rdečem morju (EUNAVFOR ATALANTA),
    ter razveljavitvi Sklepa (SZVP) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
