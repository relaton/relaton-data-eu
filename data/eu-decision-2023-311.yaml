  script: Latn
  content: Beslut (GUSP) 2023/311 av kommittén för utrikes- och säkerhetspolitik
    av den 7 februari 2023 om utnämning av befälhavaren för EU-styrkan för Europeiska
    unionens militära insats i syfte att bidra till sjöfartsskydd i västra Indiska
