    no oceano Índico ocidental e no mar Vermelho (EUNAVFOR ATALANTA), e que revoga
    a Decisão (PESC) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2023/311 a Comitetului politic și de securitate din 7 februarie
    2023 privind numirea comandantului forței UE pentru operația militară a Uniunii
    Europene în vederea unei contribuții la securitatea maritimă în vestul Oceanului
    Indian și în Marea Roșie (EUNAVFOR ATALANTA) și de abrogare a Deciziei (PESC)
    2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Politického a bezpečnostného výboru (SZBP) 2023/311 zo
    . februára 2023 o vymenovaní veliteľa ozbrojených síl EÚ pre vojenskú operáciu
    Európskej únie na podporu námornej bezpečnosti v západnom Indickom oceáne
    a Červenom mori (EUNAVFOR ATALANTA) a o zrušení rozhodnutia (SZBP) 2022/2205
    (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: sl
  script: Latn
  content: Sklep Političnega in varnostnega odbora (SZVP) 2023/311 z dne 7. februarja
