  content: Decisión (PESC) 2023/311 del Comité Político y de Seguridad de 7 de
    febrero de 2023 por la que se nombra al comandante de la fuerza de la UE en la
    operación militar de la Unión Europea destinada a contribuir a la seguridad
    marítima en el océano Índico occidental y en el mar Rojo (EUNAVFOR Atalanta),
