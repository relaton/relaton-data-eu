    Europæiske Unions militæroperation med henblik på at bidrage til maritim sikkerhed
    i den vestlige del af Det Indiske Ocean og i Det Røde Hav (EUNAVFOR Atalanta)
    og om ophævelse af afgørelse (FUSP) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: el
  script: Grek
