    de militaire operatie van de Europese Unie teneinde bij te dragen aan maritieme
    veiligheid in het westelijke deel van de Indische Oceaan en in de Rode Zee (EUNAVFOR
    Atalanta), en tot intrekking van Besluit (GBVB) 2022/2205 (EUNAVFOR ATALANTA/1/2023)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komitetu Politycznego i Bezpieczeństwa (WPZiB) 2023/311 z dnia
