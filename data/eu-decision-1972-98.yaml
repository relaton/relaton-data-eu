title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 janvier 1972, autorisant la République
    italienne à exclure du traitement communautaire certains produits des positions
    87.02 A, Ex 87.05, Ex 87.06 et 87.09 du Tarif douanier commun, originaires du
    Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/98/EWG: Entscheidung der Kommission vom 11. Januar 1972, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche bestimmte Erzeugnisse der Tarifnummern
    87.02 A, ex 87.05, ex 87.06 und 87.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/98/CEE: Decisione della Commissione, dell''11 gennaio 1972, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario taluni prodotti
    delle voci nn. 87.02 A, ex 87.05, ex 87.06 e 87.09 della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/98/EEG: Beschikking van de Commissie van 11 januari 1972 waarbij de
    Italiaanse Republiek wordt gemachtigd bepaalde produkten van de posten 87.02 A,
    ex 87.05, ex 87.06 en 87.09 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
