  content: Commission Regulation (EU) 2023/1315 of 23 June 2023 amending Regulation
    (EU) No 651/2014 declaring certain categories of aid compatible with the internal
    market in application of Articles 107 and 108 of the Treaty and Regulation (EU)
    2022/2473 declaring certain categories of aid to undertakings active in the production,
    processing and marketing of fishery and aquaculture products compatible with the
    internal market in application of Articles 107 and 108 of the Treaty
  type: main
