    avec le marché intérieur en application des articles 107 et 108 du traité et
    le règlement (UE) 2022/2473 déclarant certaines catégories d’aides aux entreprises
    actives dans la production, la transformation et la commercialisation des produits
    de la pêche et de l’aquaculture compatibles avec le marché intérieur en application
    des articles 107 et 108 du traité
  type: main
