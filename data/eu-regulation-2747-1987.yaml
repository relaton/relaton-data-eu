    Nr. 41 (Kennziffer 40.0410) mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2747/87 af 14. september 1987 om genindførelse
