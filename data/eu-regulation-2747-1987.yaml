  content: Commission Regulation (EEC) No 2747/87 of 14 September 1987 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres, products of
    category 41 (code 40.0410), originating in Thailand to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2747/87 de la Commission du 14 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques de la catégorie de produits n° 41 (code 40.0410),
    originaires de Thaïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
