  content: Commission Regulation (EC) No 2568/1999 of 3 December 1999 correcting Regulation
    (EC) No 2528/1999 fixing Community producer and import prices for carnations and
    roses with a view to the application of the arrangements governing imports of
    certain floricultural products originating in Cyprus, Israel, Jordan, Morocco
    and the West Bank and Gaza Strip
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2568/1999 de la Commission, du 3 décembre 1999, rectifiant
