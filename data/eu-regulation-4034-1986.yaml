  script: Latn
  content: Council Regulation (EEC) No 4034/86 of 22 December 1986 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1987 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4034/86 du Conseil du 22 décembre 1986 fixant, pour
    certains stocks ou groupes de stocks de poissons, les totaux admissibles des captures
    pour 1987 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4034/86 des Rates vom 22. Dezember 1986 zur Festlegung
    der zulässigen Gesamtfangmenge und bestimmter Fangbedingungen hinsichtlich der
    zulässigen Gesamtfangmengen für bestimmte Fischbestände oder Bestandsgruppen
    für 1987
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4034/86 af 22. december 1986 om fastsættelse
