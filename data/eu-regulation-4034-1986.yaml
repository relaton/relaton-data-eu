    ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων
    για το 1987 και ορισμένων όρων υπό τους οποίους
    μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4034/86 del Consiglio del 22 dicembre 1986 che fissa,
    per alcune popolazioni e gruppi di popolazioni ittiche, il totale delle catture
    ammissibile per il 1987 e alcune condizioni cui è soggetta la pesca del totale
    delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4034/86 van de Raad van 22 december 1986 inzake de
    vaststelling van de voor 1987 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden en bepaalde bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4034/86 do Conselho de 22 de Dezembro de 1986 que
    fixa, relativamente a certas unidades populacionais (stocks) ou grupos de unidades
    populacionais de peixes, os totais admissíveis de capturas para 1987 e certas
    condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4034/86 del Consejo de 22 de diciembre de 1986 por
    el que se fijan, para determinadas poblaciones o grupos de poblaciones de peces,
    los totales admisibles de capturas para 1987 y determinadas condiciones en las
    que pueden pescarse
