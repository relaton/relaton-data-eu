    så vidt angår oplysningerne om Canada og USA i listerne over tredjelande, territorier
    eller zoner deri, hvorfra det er tilladt at indføre sendinger af fjerkræ og
    avlsmateriale af fjerkræ og fersk kød af fjerkræ og fjervildt til Unionen
  type: main
