title:
- language: en
  script: Latn
  content: '97/194/EC: Commission Decision of 4 March 1997 recognizing that the production
    of certain quality wines in specified regions and of certain ''local wines'' in
    Greece is, by reason of their qualitative characteristics, far from able to satisfy
    demand (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/194/CE: Décision de la Commission du 4 mars 1997 reconnaissant que
    la production en Grèce de certains vins de qualité produits dans des régions
    déterminées et de certains «vins locaux» est, du fait des caractéristiques
    qualitatives de ces vins, largement inférieure à la demande (Le texte en langue
    grecque est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/194/EG: Entscheidung der Kommission vom 4. März 1997 zur Anerkennung,
    daß die Erzeugung von Qualitätsweinen bestimmter Anbaugebiete und von bestimmten
    lokalen Weinen in Griechenland wegen qualitativer Merkmale der Nachfrage nicht
    entspricht (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/194/EF: Kommissionens Beslutning af 4. marts 1997 om anerkendelse af,
    at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder i Grækenland
    og af visse lokale vine på grund af disse vines kvalitative egenskaber langtfra
    er tilstrækkelig til at dække efterspørgslen (Kun den græske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/194/ΕΚ: Απόφαση της Επιτροπής της 4ης Μαρτίου
    1997 που αναγνωρίζει ότι η παραγωγή στην Ελλάδα
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές και ορισμένων «τοπικών οίνων» είναι,
    λόγω των ποιοτικών χαρακτηριστικών των οίνων,
    κατά πολύ μικρότερη από τη ζήτηση (Το κείμενο
    στην ελληνική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/194/EY: Komission päätös, tehty 4 päivänä maaliskuuta 1997, tiettyjen
    Kreikassa määritetyillä alueilla tuotettujen laatuviinien sekä tiettyjen "paikallisten
    viinien" tuotannon toteamisesta niiden laatuominaisuuksien vuoksi huomattavasti
    kysyntää pienemmäksi (Ainoastaan kreikankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/194/CE: Decisione della Commissione del 4 marzo 1997 con la quale si
    riconosce che la produzione di alcuni vini di qualità prodotti in regioni determinate
    e di taluni «vini locali» in Grecia è ampiamente inferiore alla domanda, in
    ragione delle caratteristiche qualitative di tali vini (Il testo in lingua greca
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/194/EG: Beschikking van de Commissie van 4 maart 1997 houdende erkenning
    van het feit dat de produktie van bepaalde v.q.p.r.d.''s en bepaalde "plaatselijke
    wijnen" in Griekenland, gezien de kwaliteitskenmerken van deze wijnen, ver bij
    de vraag achterblijft (Slechts de tekst in de Griekse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/194/CE: Decisão da Comissão de 4 de Março de 1997 que reconhece
    que a produção na Grécia de certos vinhos de qualidade produzidos em regiões
    determinadas e de certos «vinhos locais» é, pelas suas características de
    qualidade, substancialmente inferior à procura (Apenas faz fé o texto em língua
    grega)'
  type: main
- language: es
  script: Latn
  content: '97/194/CE: Decisión de la Comisión de 4 de marzo de 1997 por la que
    se reconoce que la producción en Grecia de algunos vinos de calidad producidos
    en regiones determinadas y de algunos vinos locales es muy inferior a la demanda
    debido a sus características cualitativas (El texto en lengua griega es el único
    auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/194/EG: Kommissionens beslut av den 4 mars 1997 om förklarande av
    att produktionen av vissa kvalitetsviner från specificerade områden i Grekland
    och av vissa "lokala viner", på grund av dessa viners kvalitativa egenskaper,
    ligger långt under efterfrågan (Endast den grekiska texten är giltig)'
  type: main
