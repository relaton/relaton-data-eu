id: EURegulation23801989
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2380/89 of 2 August 1989 laying down provisions
    for the implementation of article 5 (2) of Council Regulation (EEC) No 1697/79
    on the post-clearance recovery of import duties or export duties which have not
    been required of the person liable for payment on goods entered for a customs
    procedure involving the obligation to pay such duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2380/89 de la Commission du 2 août 1989 fixant les
    dispositions d'application de l'article 5 paragraphe 2 du règlement (CEE) n°
    1697/79 du Conseil concernant le recouvrement a posteriori des droits à l'importation
    ou des droits à l'exportation qui n'ont pas été exigés du redevable pour des
    marchandises déclarées pour un régime douanier comportant l'obligation de payer
    de tels droits
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2380/89 DER KOMMISSION vom 2. August 1989 zur Durchführung
    des Artikels 5 Absatz 2 der Verordnung (EWG) Nr. 1697/79 des Rates betreffend
    die Nacherhebung von noch nicht vom Abgabenschuldner angeforderten Eingangs- oder
    Ausfuhrabgaben für Waren, die zu einem Zollverfahren angemeldet worden sind,
    das die Verpflichtung zur Zahlung derartiger Abgaben beinhaltet #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2380/89 af 2. august 1989 om gennemførelsesbestemmelserne
    til artikel 5, stk. 2, i Rådets forordning (EØF) nr. 1697/79 om efteropkrævning
    af import- eller eksportafgifter, der ikke er opkrævet hos debitor for varer,
    der er angivet til en toldprocedure, som medfører en forpligtelse til at betale
    sådanne afgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2380/89 της Επιτροπής
    της 2ας Αυγούστου 1989 περί καθορισμού των διατάξεων
    εφαρμογής του άρθρου 5 παράγραφος 2 του κανονισμού
    (ΕΟΚ) αριθ. 1697/79 του Συμβουλίου περί της εκ των
    υστέρων εισπράξεως εισαγωγικών ή εξαγωγικών
    δασμών που δεν κατέστησαν απαιτητοί από τον
    φορολογούμενο, για εμπορεύματα που διασαφήθηκαν
    σε τελωνειακό καθεστώς συνεπαγόμενο την υποχρέωση
    καταβολής τέτοιων δασμών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2380/89 DELLA COMMISSIONE del 2 agosto 1989 che stabilisce
    le disposizioni d'' applicazione dell'' articolo 5, paragrafo 2 del regolamento
    (CEE) n. 1697/79 del Consiglio, relativo al recupero a posteriori dei dazi all''
    importazione o dei dazi all'' esportazione che non sono stati corrisposti dal
    debitore per le merci dichiarate per un regime doganale comportante l'' obbligo
    di effettuarne il pagamento #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2380/89 VAN DE COMMISSIE van 2 augustus 1989 tot
    vaststelling van de uitvoeringsbepalingen van artikel 5, lid 2, van Verordening
    (EEG) nr. 1697/79 van de Raad inzake navordering van de rechten bij invoer of
    bij uitvoer die niet van de belastingschuldige zijn opgeëist voor goederen welke
    zijn aangegeven voor een douaneregeling waaruit de verplichting tot betaling van
    dergelijke rechten voortvloeide #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2380/89 DA COMISSÃO de 2 de Agosto de 1989 que
    fixa as regras de aplicação de nº 2 do artigo 5º do Regulamento (CEE) nº
    1697/79 do Conselho, relativo à cobrança a posteriori dos direitos de importação
    ou dos direitos de exportação que não tenham sido exigidos ao devedor para
    mercadorias declaradas para um regime aduaneiro que implica a obrigação de pagamento
    dos referidos direitos #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2380/89 DE LA COMISIÓN de 2 de agosto de 1989 por
    el que se establecen las disposiciones de aplicación del apartado 2 del artículo
    5 del Reglamento (CEE) no 1697/79 del Consejo referente a la recaudación a posteriori
    de los derechos de importación o de los derechos de exportación que no hayan
    sido exigidos al deudor por mercancías declaradas en un régimen aduanero que
    suponga la obligación de pagar tales derechos #'
  type: main
