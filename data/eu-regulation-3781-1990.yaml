title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3781/90 of 19 December 1990 laying down
    detailed rules for the application of Council Regulation (EEC) No 3576/90 as regards
    the temporary suspension of the regulatory amounts mechanism and of customs duties
    on wine products released for consumption in the territory of the former German
    Democratic Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3781/90 de la Commission, du 19 décembre 1990, portant
    modalités d' application du règlement (CEE) nº 3576/90 du Conseil en ce qui
    concerne la suspension temporaire du régime des montants régulateurs ainsi que
    des droits de douane pour les produits viti-vinicoles mis à la consommation sur
    le territoire de l' ancienne République démocratique allemande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3781/90 der Kommission vom 19. Dezember 1990 mit Durchführungsvorschriften
