  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3781/90 della Commissione, del 19 dicembre 1990, recante
    modalità d' applicazione del regolamento (CEE) n. 3576/90 del Consiglio per quanto
    riguarda la sospensione temporanea del regime degli importi regolatori, nonché
    dei dazi doganali, per i prodotti vitivinicoli immessi al consumo sul territorio
    dell' ex Repubblica democratica tedesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3781/90 van de Commissie van 19 december 1990 houdende
    bepalingen ter uitvoering van Verordening (EEG) nr. 3576/90 van de Raad wat betreft
    de tijdelijke schorsing van de regeling inzake de regulerende bedragen alsmede
    van de douanerechten voor produkten van de wijnbouwsector die worden aangegeven
    ten verbruike op het grondgebied van de voormalige Duitse Democratische Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3781/90 da Comissão, de 19 de Dezembro de 1990,
    que estabelece normas de execução do Regulamento (CEE) nº 3576/90 do Conselho,
    no que diz respeito à suspensão temporária do regime dos montantes reguladores
    bem como dos direitos aduaneiros para os produtos vitivinícolas introduzidos
    no consumo no território da antiga República Democrática Alemã
  type: main
- language: es
  script: Latn
