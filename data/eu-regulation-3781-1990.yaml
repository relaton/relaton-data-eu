    der Ausgleichsbetrags- und der Zollregelung für auf dem Gebiet der ehemaligen
    Deutschen Demokratischen Republik zum freien Verkehr abgefertigte Weinbauerzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3781/90 af 19. december 1990 om gennemførelsesbestemmelser
