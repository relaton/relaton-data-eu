  script: Latn
  content: '92/183/EEC: Commission Decision of 3 March 1992 laying down the general
    conditions to be complied with for the import of certain raw materials for the
    pharmaceutical processing industry, coming from third countries, which appear
    on the list established by Council Decision 79/542/EEC'
  type: main
- language: fr
  script: Latn
  content: '92/183/CEE: Décision de la Commission, du 3 mars 1992, établissant les
    conditions générales à respecter lors de l''importation de certaines matières
    premières destinées à l''industrie de transformation pharmaceutique, en provenance
    de pays tiers figurant sur la liste établie par la décision 79/542/CEE du Conseil'
  type: main
