  type: main
- language: hu
  script: Latn
  content: A Bizottság 2121/2004/EK rendelete (2004. december 13.) a Közösség
    erdőinek tűz elleni védelméről szóló 2158/92/EGK tanácsi rendelet alkalmazására
    vonatkozó egyes részletes szabályok megállapításáról szóló 1727/1999/EK
    rendelet és a Közösség erdőinek a légköri szennyezés elleni védelméről
    szóló 3528/86/EGK tanácsi rendelet alkalmazására vonatkozó egyes részletes
    szabályok megállapításáról szóló 2278/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2121/2004 della Commissione, del 13 dicembre 2004,
    che modifica il regolamento (CE) n. 1727/1999, recante talune modalità di applicazione
    del regolamento (CEE) n. 2158/92 del Consiglio relativo alla protezione delle
    foreste nella Comunità contro gli incendi, e il regolamento (CE) n. 2278/1999,
    recante talune modalità di applicazione del regolamento (CEE) n. 3528/86 del
    Consiglio relativo alla protezione delle foreste nella Comunità contro l’inquinamento
    atmosferico
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2121/2004 (2004. gada 13. decembris), ar kuru
    groza Regulu (EK) Nr. 1727/1999, ar ko nosaka atsevišķus sīki izstrādātus
    piemērošanas noteikumus Padomes Regulai (EEK) Nr. 2158/92 par Kopienas mežu
    aizsardzību pret ugunsgrēkiem un Regulu (EK) Nr. 2278/1999, ar ko nosaka dažus
    sīki izstrādātus piemērošanas noteikumus Padomes Regulai (EEK) Nr. 3528/86
    par Kopienas mežu aizsardzību no atmosfēras piesārņojuma
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 13 d. Komisijos reglamentas (EB) Nr. 2121/2004, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 1727/1999, nustatantį tam tikras išsamias
    Tarybos reglamento (EEB) Nr. 2158/92 dėl Bendrijos miškų priešgaisrinės apsaugos
    taikymo taisykles, ir Reglamentą (EB) Nr. 2278/1999, nustatantį tam tikras išsamias
    Tarybos reglamento (EEB) Nr. 3528/86 dėl Bendrijos miškų apsaugos nuo atmosferos
    teršalų taikymo taisykles
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2121/2004 van de Commissie van 13 december 2004 tot
    wijziging van Verordening (EG) nr. 1727/1999 houdende enige uitvoeringsbepalingen
    van Verordening (EEG) nr. 2158/92 van de Raad betreffende de bescherming van de
    bossen in de Gemeenschap tegen brand en Verordening (EG) nr. 2278/1999 houdende
    enige uitvoeringsbepalingen van Verordening (EEG) nr. 3528/86 van de Raad betreffende
    de bescherming van de bossen in de Gemeenschap tegen luchtverontreiniging
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2121/2004 z dnia 13 grudnia 2004 r. zmieniające
    rozporządzenie (WE) nr 1727/1999 ustanawiające niektóre szczegółowe zasady
    stosowania rozporządzenia Rady (EWG) nr 2158/92 w sprawie ochrony lasów wspólnotowych
    przed pożarami oraz rozporządzenie (WE) nr 2278/1999 ustanawiające niektóre
    szczegółowe zasady stosowania rozporządzenia Rady (EWG) nr 3528/86 w sprawie
    ochrony lasów Wspólnoty przed zanieczyszczeniem atmosferycznym
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2121/2004 da Comissão, de 13 de Dezembro de 2004,
    que altera o Regulamento (CE) n.° 1727/1999 que estabelece certas normas de execução
    do Regulamento (CEE) n.° 2158/92 do Conselho relativo à protecção das florestas
    da Comunidade contra os incêndios e o Regulamento (CE) n.° 2278/1999 que estabelece
    certas normas de execução do Regulamento (CEE) n.° 3528/86 do Conselho relativo
    à protecção das florestas na Comunidade contra a poluição atmosférica
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie ES č. 2121/2004 z 13. decembra 2004, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1727/1999, ktoré stanovuje určité podrobné
    pravidlá na uplatňovanie nariadenia Rady (EHS) č. 2158/92 o ochrane lesov Spoločenstva
    pred požiarmi a nariadenie (ES) č. 2278/1999 stanovujúce niektoré podrobné
    pravidlá na uplatňovanie nariadenia Rady (EHS) č. 3528/86 o ochrane lesov Spoločenstva
    pred atmosferickým znečistením
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2121/2004 z dne 13. decembra 2004 o spremembi
    Uredbe (ES) št. 1727/1999 o nekaterih podrobnih pravilih za uporabo Uredbe Sveta
    (EGS) št. 2158/92 o varstvu gozdov Skupnosti pred požari in Uredbe (ES) št.
    2278/1999 o določitvi nekaterih podrobnih pravil za uporabo Uredbe Sveta (EGS)
    št. 3528/86 o varstvu gozdov Skupnosti pred onesnaženostjo zraka
  type: main
