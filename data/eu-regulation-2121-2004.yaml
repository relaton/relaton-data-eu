  content: Commission Regulation (EC) No 2121/2004 of 13 December 2004 amending Regulation
    (EC) No 1727/1999 laying down certain detailed rules for the application of Council
    Regulation (EEC) No 2158/92 on protection of the Community's forests against fire
    and Regulation (EC) No 2278/1999 laying down certain detailed rules for the application
    of Council Regulation (EEC) N) 3528/86 on the protection of the Community’s
    forests against atmospheric pollution
  type: main
- language: fr
  script: Latn
