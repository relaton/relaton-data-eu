id: EUDecision1980152
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/152/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to umbrallas and sunshades (including
    walking- stick umbrellas, umbrella tents, and garden and similar umbrellas), falling
    within heading No 66.01 of the Common Customs Tariff, originating in South Korea
    and Hong Kong and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/152/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles, y compris les parapluies-cannes, parasols- tentes et similaires,
    de la position 66.01 du tarif douanier commun, originaires de Corée du Sud et
    de Hong- kong et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/152/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea und Hongkong stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Regenschirme
    und Sonnenschirme, einschließlich Stockschirme, Schirmzelte und dergleichen,
    der Tarifnummer 66.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/152/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage paraplyer og
    parasoller (herunder stokkeparaplyer, paraplytelte) haveparasoller og lignende,
    som henhører under pos. 66.01 i den fælles toldtarif, har oprindelse i Sydkorea
    og Hongkong og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/152/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli ombrelli,
    compresi gli ombrelli-bastone, i parasole-tende, gli ombrelloni e simili, della
    voce 66.01 della tariffa doganale comune, originari della Corea del Sud e di Hong
    Kong e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/152/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd paraplu''s en parasols, alsmede wandelstokparaplu''s,
    tuinparasols, parasoltenten en dergelijke van post 66.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Zuid-Korea en Hong-Kong en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
