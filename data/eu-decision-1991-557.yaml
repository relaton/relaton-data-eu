title:
- language: en
  script: Latn
  content: '91/557/EEC: Commission Decision of 23 October 1991 making an initial allocation
    to Italy of part of the resources to be charged to the 1992 budget year for the
    supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '91/557/CEE: Décision de la Commission, du 23 octobre 1991, allouant à
    l'' Italie une première tranche des ressources imputables à l'' exercice 1992
    pour la fourniture de denrées alimentaires provenant des stocks d'' intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '91/557/EWG: Entscheidung der Kommission vom 23. Oktober 1991 über die
    anfängliche Bewilligung eines Teils der im Haushaltsjahr 1992 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an bedürftige Personen in der Gemeinschaft zu verbuchenden Mittel
    für Italien'
  type: main
- language: da
  script: Latn
  content: '91/557/EØF: Kommissionens beslutning af 23. oktober 1991 om en første
    tildeling til Italien af en del af de midler, der skal opføres på 1992-budgettet
    for levering af levnedsmidler fra interventionslagre til nærmere bestemte organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '91/557/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Οκτωβρίου 1991 για τη χορήγηση στην Ιταλία μιας
    πρώτης μερίδας πόρων που καταλογίζονται στο
    οικονομικό έτος 1992 για την προμήθεια τροφίμων
    που προέρχονται από τα αποθέματα της παρέμβασης
    στους οργανισμούς που έχουν οριστεί για να
    τα διανείμουν στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '91/557/CEE: Decisione della Commissione, del 23 ottobre 1991, concernente
    un primo stanziamento all'' Italia di parte delle risorse da imputare all'' anno
    di bilancio 1992 per la fornitura a talune organizzazioni di derrate alimentari
    provenienti dalle scorte d'' intervento e destinate ad essere distribuite agli
    indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '91/557/EEG: Beschikking van de Commissie van 23 oktober 1991 houdende
