    orçamental de 1992 para o fornecimento de alimentos provenientes de existências
    de intervenção às organizações designadas para distribuição às pessoas
    mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '91/557/CEE: Decisión de la Comisión, de 23 de octubre de 1991, por la
