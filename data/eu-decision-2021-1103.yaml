title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1103 of 5 July 2021 on the recognition
    of the legal, supervisory and enforcement arrangements of Brazil for derivatives
    transactions entered into by Brazilian institutions under the regulation of the
    Central Bank of Brazil as equivalent to certain requirements of Article 11 of
    Regulation (EU) No 648/2012 of the European Parliament and Council on OTC derivatives,
    central counterparties and trade repositories
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1103 de la Commission du 5 juillet 2021
    reconnaissant l’équivalence du cadre juridique et du dispositif de surveillance
    et de mise en œuvre du Brésil relatifs aux transactions sur dérivés conclues
    par les établissements brésiliens relevant de la régulation de la Banque centrale
    du Brésil avec certaines des exigences de l’article 11 du règlement (UE) no
    648/2012 du Parlement européen et du Conseil sur les produits dérivés de gré
    à gré, les contreparties centrales et les référentiels centraux
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1103 der Kommission vom 5. Juli 2021
    zur Anerkennung der Gleichwertigkeit der Rechts-, Aufsichts- und Durchsetzungsmechanismen
    Brasiliens für der Aufsicht der Zentralbank von Brasilien unterliegende, von
    brasilianischen Instituten geschlossene Derivategeschäfte mit bestimmten Anforderungen
    des Artikels 11 der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments
    und des Rates über OTC-Derivate, zentrale Gegenparteien und Transaktionsregister
  type: main
- language: bg
  script: Cyrl
