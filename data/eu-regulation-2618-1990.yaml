    μέτρων τα οποία αφορούν τους κατόχους συμφωνητικών
    μακροπρόθεσμης αποθεματοποίησης επιτραπέζιων
    οίνων για την περίοδο εμπορίας 1989/90
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2618/90 DELLA COMMISSIONE dell'11 settembre 1990 relativo
