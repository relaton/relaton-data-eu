title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1917/76 of 28 July 1976 adjusting for the
    second time the compensatory amounts, variable components and additional duties
    applicable during the third quarter of 1976 on the importation of goods, covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1917/76 de la Commission, du 28 juillet 1976, modifiant
    pour la deuxième fois les montants compensatoires, les éléments mobiles et
    les droits additionnels applicables, pendant le troisième trimestre de l'année
    1976, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1917/76 der Kommission vom 28. Juli 1976 zur zweiten
    Änderung der Ausgleichsbeträge, beweglichen Teilbeträge und Zusatzzölle für
    das dritte Vierteljahr 1976 bei der Einfuhr von Waren, die unter die Verordnung
    (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1917/76 af 28. juli 1976 om berigtigelse
    for anden gang af de udligningsbeløb og variable elementer og tillægstold, som
    i tredje kvartal af 1976 skal anvendes ved indførsel af varer henhørende under
    forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1917/76 della Commissione, del 28 luglio 1976, che
    modifica per la seconda volta gli importi compensativi e gli elementi mobili,
    nonché i dazi addizionali applicabili, durante il terzo trimestre dell'anno 1976,
    all'importazione delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1917/76 van de Commissie van 28 juli 1976 houdende
    tweede wijziging van de variabele elementen, compenserende bedragen en aanvullende
    invoerrechten, toepasselijk gedurende het derde kwartaal van 1976 bij invoer van
    onder Verordening (EEG) nr. 1059/69 vallende goederen
  type: main
