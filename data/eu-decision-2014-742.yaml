    seotud isikute vastu suunatud eripiirangute säilitamise kohta ning sellega seonduvad
    ühised seisukohad 98/240/ÜVJP, 98/326/ÜVJP, 1999/318/ÜVJP ja 2000/599/ÜVJP
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2014/742/YUTP, annettu 28 päivänä lokakuuta 2014
    , Slobodan Milosevicia ja häntä lähellä olevia henkilöitä koskevien rajoittavien
    erityistoimenpiteiden pitämisestä voimassa hyväksytyn yhteisen kannan 2000/696/YUTP
    sekä asiaan liittyvien yhteisten kantojen 98/240/YUTP, 98/326/YUTP, 1999/318/YUTP
    ja 2000/599/YUTP kumoamisesta
  type: main
- language: hr
  script: Latn
