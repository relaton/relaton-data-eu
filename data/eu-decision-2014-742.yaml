    speċifiċi restrittivi indirizzati kontra s-Sur Milosevic u persuni assoċjati
    miegħu u l-Pożizzjonijiet Komuni relatati 98/240/PESK, 98/326/PESK, 1999/318/PESK
    u 2000/599/PESK
  type: main
- language: nl
  script: Latn
  content: Besluit 2014/742/GBVB van de Raad van 28 oktober 2014 tot intrekking van
    Gemeenschappelijk Standpunt 2000/696/GBVB betreffende de handhaving van specifieke
    beperkende maatregelen tegen Slobodan Milošević en de met hem verbonden personen,
    alsmede van de bijbehorende Gemeenschappelijke Standpunten 98/240/GBVB, 98/326/GBVB,
    1999/318/GBVB en 2000/599/GBVB
  type: main
- language: pl
  script: Latn
