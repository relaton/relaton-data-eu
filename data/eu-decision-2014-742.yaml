title:
- language: en
  script: Latn
  content: Council Decision 2014/742/CFSP of 28 October 2014 repealing Common Position
    2000/696/CFSP on the maintenance of specific restrictive measures directed against
    Mr Milosevic and persons associated with him and related Common Positions 98/240/CFSP,
    98/326/CFSP, 1999/318/CFSP and 2000/599/CFSP
  type: main
- language: fr
  script: Latn
  content: Décision 2014/742/PESC du Conseil du 28 octobre 2014 abrogeant la position
    commune 2000/696/PESC concernant le maintien de mesures restrictives spécifiques
    à l'encontre de M. Milosevic et des personnes qui lui sont associées, ainsi
    que les positions communes 98/240/PESC, 98/326/PESC, 1999/318/PESC et 2000/599/PESC
    correspondantes
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/742/GASP des Rates vom 28. Oktober 2014 zur Aufhebung des
    Gemeinsamen Standpunkts 2000/696/GASP zur Aufrechterhaltung von spezifischen restriktiven
    Maßnahmen gegen Herrn Milošević und Personen seines Umfelds und der damit verbundenen
    Gemeinsamen Standpunkte 98/240/GASP, 98/326/GASP, 1999/318/GASP und 2000/599/GASP
  type: main
- language: bg
  script: Cyrl
  content: Решение 2014/742/ОВППС на Съвета от 28 октомври
    2014 година за отмяна на Обща позиция 2000/696/ОВППС
    за поддържане на специални ограничителни мерки,
    насочени срещу г-н Милошевич и лицата, свързани
    с него, и свързаните с нея общи позиции 98/240/ОВППС,
    98/326/ОВППС, 1999/318/ОВППС и 2000/599/ОВППС
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2014/742/SZBP ze dne 28. října 2014 , kterým se zrušuje
    společný postoj 2000/696/SZBP o zachování zvláštních omezujících opatření
    namířených proti panu Miloševićovi a osobám s ním spojeným a související
    společné postoje 98/240/SZBP, 98/326/SZBP, 1999/318/SZBP a 2000/599/SZBP
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2014/742/FUSP af 28. oktober 2014 om ophævelse af fælles
    holdning 2000/696/FUSP om opretholdelse af særlige restriktive foranstaltninger
    rettet mod Slobodan Milosevic og personer, der er knyttet til ham, og de tilknyttede
    fælles holdninger 98/240/FUSP, 98/326/FUSP, 1999/318/FUSP og 2000/599/FUSP
  type: main
- language: el
  script: Grek
  content: Απόφαση 2014/742/ΚΕΠΠΑ του Συμβουλίου, της
    28ης Οκτωβρίου 2014 , για την κατάργηση της κοινής
    θέσης 2000/696/ΚΕΠΠΑ σχετικά με τη διατήρηση ειδικών
    περιοριστικών μέτρων κατά του κ. Σ. Μιλόσεβιτς
    και των συνδεόμενων με αυτόν προσώπων και των
    συναφών κοινών θέσεων 98/240/ΚΕΠΠΑ, 98/326/ΚΕΠΠΑ,
    1999/318/ΚΕΠΠΑ και 2000/599/ΚΕΠΠΑ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2014/742/ÜVJP, 28. oktoober 2014 , millega tunnistatakse
