    usmjerenih protiv g. Miloševića i osoba povezanih s njim i povezanih zajedničkih
    stajališta 98/240/ZVSP, 98/326/ZVSP, 1999/318/ZVSP i 2000/599/ZVSP
  type: main
- language: hu
  script: Latn
  content: A Tanács 2014/742/KKBP határozata ( 2014. október 28. ) a Milošević
    úr és a környezetébe tartozó személyek ellen irányuló egyedi korlátozó
    intézkedések fenntartásáról szóló 2000/696/KKBP közös álláspont, valamint
    az ahhoz kapcsolódó 98/240/KKBP, 98/326/KKBP, 1999/318/KKBP és 2000/599/KKBP
    közös álláspontok hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2014/742/PESC del Consiglio, del 28 ottobre 2014 , che abroga
    la posizione comune 2000/696/PESC relativa al mantenimento delle misure restrittive
    specifiche nei confronti di Milosevic e delle persone a lui collegate e le posizioni
    comuni connesse 98/240/PESC, 98/326/PESC, 1999/318/PESC e 2000/599/PESC
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2014/742/KĀDP ( 2014. gada 28. oktobris ), ar ko atceļ
    Kopējo nostāju 2000/696/KĀDP par īpašu ierobežojošu pasākumu saglabāšanu,
    kas vērsti pret Miloševiča kungu un ar viņu saistītām personām, un saistītās
    Kopējās nostājas 98/240/KĀDP, 98/326/KĀDP, 1999/318/KĀDP un 2000/599/KĀDP
  type: main
- language: lt
  script: Latn
  content: 2014 m. spalio 28 d. Tarybos sprendimas 2014/742/BUSP, kuriuo panaikinama
    Bendroji pozicija 2000/696/BUSP dėl tolesnio konkrečių ribojančių priemonių,
    nukreiptų prieš p. Milosevic ir su juo susijusius asmenis, taikymo ir susijusios
    bendrosios pozicijos 98/240/BUSP, 98/326/BUSP, 1999/318/BUSP ir 2000/599/BUSP
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2014/742/PESK tat- 28 ta' Ottubru 2014 li tħassar
