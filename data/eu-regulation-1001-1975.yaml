title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1001/75 of the Commission of 17 April 1975 re-establishing
    the levying of customs duties on sacks and bags, of a kind used for the packing
    of goods, other, of cotton, falling within subheading 62.03 B ex II, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1001/75 de la Commission, du 17 avril 1975, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d'emballage, autres, en tissus de coton, de la sous-position tarifaire
    62.03 B EX II, originaires du Pakistan bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1001/75 der Kommission vom 17. April 1975 über die
    Wiedereinführung des Zollsatzes für Säcke und Beutel zu Verpackungszwecken,
    andere, aus Baumwolle, der Tarifstelle 62.03 B ex II, mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1001/75 af 17. april 1975 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage, andre varer,
    af bomuldsstof, under underposition 62.03 B ex II, som har oprindelse i Pakistan
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1001/75 della Commissione, del 17 aprile 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi e sacchetti
    da imballaggio, altri, in tessuti di cotone, della sottovoce doganale n. 62.03
    B ex II, originari del Pakistan, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1001/75 van de Commissie van 17 april 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakken voor
    verpakkingsdoeleinden, andere, van weefsels van katoen, van onderverdeling 62.03
    B ex II, van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3046/74 van de Raad van 2 december 1974
  type: main
