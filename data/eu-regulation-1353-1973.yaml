title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1353/73 of the Council of 15 May 1973 introducing a
    premium system for the conversion of dairy cow herds to meat production and a
    development premium for the specialized raising of cattle for meat production
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1353/73 du Conseil, du 15 mai 1973, instituant un
    régime de prime à la reconversion, vers la production de viande, de troupeaux
    bovins à orientation laitière et de prime au développement de l' élevage bovin
    spécialisé vers la production de viande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1353/73 des Rates vom 15. Mai 1973 zur Einführung
    einer Prämienregelung für die Umstellung von Milchkuhbeständen auf Bestände
    zur Fleischerzeugung und Prämien zur Förderung der speziell auf die Fleischerzeugung
    ausgerichteten Rinderaufzucht
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1353/73 af 15. maj 1973 om indførelse af
    en præmieordning for omlægning af besætninger af mælkekvæg til kødproduktion
    og for opdræt af kvæg specielt til kødproduktion
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1353/73 del Consiglio, del 15 maggio 1973, che istituisce
    un regime di premio per la riconversione di mandrie bovine ad orientamento lattiero
    verso la produzione di carne e di premio allo sviluppo dell' allevamento bovino
    specializzato nella produzione di carne
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1353/73 van de Raad van 15 mei 1973 tot invoering
    van een stelsel van premies voor de omschakeling van de melkveestapel op de rundvleesproduktie
    en van premies voor de ontwikkeling van de teelt van rundvee bestemd voor de vleesproduktie
  type: main
