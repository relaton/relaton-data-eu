  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2697/93 DELLA COMMISSIONE del 30 settembre 1993 che
    stabilisce per il periodo dal 1o luglio 1993 al 30 giugno 1994 le modalità d'
    applicazione dei regimi d' importazione di carni bovine fresche, refrigerate o
