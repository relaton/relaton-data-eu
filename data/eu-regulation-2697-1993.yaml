  content: COMMISSION REGULATION (EEC) No 2697/93 of 30 September 1993 laying down
    detailed rules for the period 1 July 1993 to 30 June 1994 for the application
    of the import arrangements for fresh, chilled or frozen beef provided for in the
    Additional Protocols to the Interim Association Agreements between the Community
    and the Republic of Poland, the Republic of Hungary and the former Czech and Slovak
    Federal Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2697/93 de la Commission du 30 septembre 1993 établissant
    pour la période du 1er juillet 1993 au 30 juin 1994 les modalités d'application
    des régimes d'importation de viandes bovines fraîches, réfrigérées ou congelées,
    prévus dans les protocoles additionnels aux accords intermédiaires d'association
    entre la Communauté et la République de Pologne, la République de Hongrie et
    l'ancienne République fédérative tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2697/93 DER KOMMISSION vom 30. September 1993 mit
    Durchführungsvorschriften zu den in den Zusatzprotokollen der Interimsabkommen
    zwischen der Europäischen Gemeinschaft und der Republik Polen, der Republik Ungarn
    und der ehemaligen Tschechischen und Slowakischen Föderativen Republik für den
    Zeitraum vom 1. Juli 1993 bis 30. Juni 1994 vorgesehenen Einfuhrregelung für
    frisches, gekühltes oder gefrorenes Rindfleisch
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2697/93 af 30. september 1993 om gennemførelsesbestemmelser
