    til interimsaftalerne mellem Fællesskabet og Republikken Polen, Republikken Ungarn
    og Den Tjekkiske og Slovakiske Føderative Republik for perioden 1. juli 1993
    til 30. juni 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2697/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Σεπτεμβρίου 1993 κατά την περίοδο από
    1ης Ιουλίου 1993 έως 30 Ιουνίου 1994 για τον καθορισμό
    των λεπτομερειών εφαρμογής των καθεστώτων
