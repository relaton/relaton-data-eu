type: standard
title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 246/97 of 11 February 1997 determining to
    what extent licence applications submitted during January 1997 for live bovine
    animals weighing between 160 and 300 kg as part of a tariff quota provided for
    pursuant to Regulation (EC) No 2511/96
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 246/97 DE LA COMMISSION du 11 février 1997 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1997 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un contingent tarifaire prévu
    par le règlement (CE) n° 2511/96
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 246/97 DER KOMMISSION vom 11. Februar 1997 zur Festsetzung
    des Umfangs, in dem die im Januar 1997 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG)
    Nr. 2511/96 beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 246/97 af 11. februar 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i januar 1997 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et toldkontingent, der er fastsat i forordning (EF) nr. 2511/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 246/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 11ης Φεβρουαρίου 1997 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιανουάριο 1997 για ζωντανά ζώα
    του βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας δασμολογικής ποσόστωσης η
    οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    2511/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 246/97, annettu 11 päivänä helmikuuta 1997,
    eläviä 160-300 kilogrammaa painavia nautaeläimiä koskevien tammikuussa 1997
    jätettyjen tuontilupahakemusten hyväksyttävyydestä asetuksessa (EY) N:o 2511/96
    määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 246/97 DELLA COMMISSIONE dell'11 febbraio 1997 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di gennaio 1997 per gli animali vivi della specie bovina,
    dai 160 ai 300 chilogrammi, nel quadro del contingente tariffario previsto dal
    regolamento (CE) n. 2511/96
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 246/97 VAN DE COMMISSIE van 11 februari 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor levende runderen met een gewicht van 160 tot 300 kg, die in januari 1997
    zijn ingediend op grond van een tariefcontingent dat is vastgesteld bij Verordening
    (EG) nr. 2511/96
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 246/97 DA COMISSÃO de 11 de Fevereiro de 1997 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 160 e 300 quilogramas,
    apresentados em Janeiro de 1997 ao abrigo de um contingente tarifário previsto
    pelo Regulamento (CE) nº 2511/96
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 246/97 DE LA COMISIÓN de 11 de febrero de 1997 por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de animales vivos de la especie bovina con un peso entre 160 y
    300 kilogramos, presentadas en enero de 1997 dentro de un contingente arancelario
    establecido en el Reglamento (CE) n° 2511/96
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 246/97 av den 11 februari 1997 om i vilken
    utsträckning licensansökningar inlämnade under januari 1997 för levande nötkreatur
    med en vikt på 160-300 kg inom ramen för den avgiftskvot som fastställts i
    förordning (EG) nr 2511/96
  type: main
