  content: COMMISSION REGULATION (EC) No 3064/93 of 5 November 1993 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to fruit and vegetable trade between Spain and the Community as constituted
    at 31 December 1985 as regards tomatoes, artichokes and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3064/93 de la Commission du 5 novembre 1993 fixant
