title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1505/79 of 18 July 1979 enabling short-term
    private storage contracts to be concluded for table wines closely related economically
    to the R II type of table wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1505/79 de la Commission, du 18 juillet 1979, étendant
    la possibilité de conclure des contrats de stockage privé à court terme aux
    vins de table se trouvant dans une relation économique étroite avec les vins
    de table du type R II
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1505/79 der Kommission vom 18. Juli 1979 zur Ausdehnung
    der Möglichkeit des Abschlusses von Verträgen für die kurzfristige private
    Lagerhaltung auf Tafelweine, die in engem wirtschaftlichem Zusammenhang mit den
    Tafelweinen der Art R II stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1505/79 af 18. juli 1979 om udvidelse
    af muligheden for at indgå kontrakter om privat oplagring på kort sigt af bordvine,
    der står i nær økonomisk forbindelse med bordvine af type R II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1505/79 τής Επιτροπής
    τής 18ης Ιουλίου 1979 περί επεκτάσεως τής δυνατότητος
    συνάψεως συμφωνητικών βραχυπροθέσμου ιδιωτικής
    αποθεματοποιήσεως γιά τούς επιτραπέζιους
    οίνους πού ευρίσκονται σέ στενή οικονομική
    σχέση μέ τούς επιτραπέζιους οίνους τού τύπου
    R II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1505/79 della Commissione, del 18 luglio 1979, che
    estende la possibilità di concludere contratti di magazzinaggio privato a breve
    termine per i vini da tavola che si trovano in stretta relazione economica coi
    vini da tavola del tipo R II
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1505/79 van de Commissie van 18 juli 179 tot uitbreiding
    van de mogelijkheid om kortlopende contracten te sluiten voor de particuliere
    opslag van tafelwijn die in nauw economisch verband staat met tafelwijn van soort
    R II
  type: main
