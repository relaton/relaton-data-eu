    le troisième trimestre de l'année 1971, à l'importation dans la Communauté
    des marchandises relevant du règlement (CEE) n 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1347/71 der Kommission vom 25. Juni 1971 zur Festsetzung
    der Höhe der im dritten Vierteljahr 1971 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft anwendbaren beweglichen
    Teilbeträge und Zusatzzölle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1347/71 della Commissione, del 25 giugno 1971, che
