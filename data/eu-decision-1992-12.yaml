title:
- language: en
  script: Latn
  content: Commission Decision of 18 December 1991 amending Decision 91/107/EEC authorizing
    certain Member States to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of sawn wood of conifers originating in the USA
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 décembre 1991, modifiant la décision
    91/107/CEE autorisant certains États membres à prévoir des dérogations à
    certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    le bois scié de conifères originaire des États-Unis
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Dezember 1991 zur Änderung der Entscheidung
    91/107/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für Nadelschnittholz
    mit Ursprung in den Vereinigten Staaten von Amerika Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 18. december 1991 om ændring af beslutning
    91/107/EØF om bemyndigelse af visse medlemsstater til at indrømme undtagelser
    fra visse bestemmelser i Rådets direktiv 77/93/EØF for så vidt angår opskåret
    nåletræ med oprindelse i USA (Kun de engelske, franske, græske, italienske,
    nederlandske, portugisiske, spanske og tyske udgaver er autentiske)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1991 για την τροποποίηση της απόφασης 91/107/ΕΟΚ
    η οποία επιτρέπει σε ορισμένα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    την πριστή ξυλεία κωνοφόρων, καταγωγής Ηνωμένων
    Πολιτειών της Αμερικής
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 dicembre 1991, recante modifica della
    decisione 91/107/CEE, che autorizza alcuni Stati membri a prevedere deroghe a
    determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto riguarda
    il legname segato di conifere originario degli Stati Uniti d' America
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 december 1991 tot wijziging van Beschikking
    91/107/EEG tot machtiging van een aantal Lid-Staten om voor gezaagd naaldhout
    van oorsprong uit de Verenigde Staten van Amerika afwijkingen van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad toe te staan
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 18 de Dezembro de 1991, que altera a Decisão
    91/107/CEE, que autoriza certos Estados-membros a estabelecer derrogações de
    determinadas disposições da Directiva 77/93/CEE do Conselho em relação à
    madeira serrada de coníferas originária dos Estados Unidos da América
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 18 de diciembre de 1991, que modifica la
    Decisión 91/107/CEE, por la que se autoriza a determinados Estados miembros a
    establecer excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    del Consejo respecto de la madera aserrada de coníferas originaria de Estados
    Unidos de América
  type: main
