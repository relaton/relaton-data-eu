  content: Council Regulation (EEC) No 3975/86 of 22 December 1986 amending Regulation
    (EEC) No 2764/77 extending the period for which Class III may be applied in respect
    of certain fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3975/86 du Conseil du 22 décembre 1986 modifiant
    le règlement (CEE) n° 2764/77 prorogeant la période pendant laquelle la catégorie
    de qualité III de certains fruits et légumes peut être rendue applicable
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3975/86 des Rates vom 22. Dezember 1986 zur Änderung
    der Verordnung (EWG) Nr. 2764/77 zur Verlängerung des Zeitraums, in dem die Güteklasse
    III bei bestimmten Obst- und Gemüsearten angewendet werden kann
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3975/86 af 22. december 1986 om ændring
    af forordning (EØF) nr. 2764/77 om forlængelse af perioden, i hvilken kvalitetsklasse
    III kan tillades anvendt for visse arter af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3975/86 του Συμβουλίου
    της 22ας Δεκεμβρίου 1986 για την τροποποίηση για
    δεύτερη φορά του κανονισμού (ΕΟΚ) αριθ. 2764/77
    περί παρατάσεως της περιόδου κατά τη διάρκεια
    της οποίας δύναται να εφαρμόζεται η ποιοτική
    κατηγορία ΙΙΙ ορισμένων οπωροκηπευτικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3975/86 del Consiglio del 22 dicembre 1986 che modifica
    il regolamento (CEE) n. 2764/77 che proroga, per determinati prodotti ortofrutticoli,
    il periodo in cui la categoria di qualità III può essere resa applicabile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3975/86 van de Raad van 22 december 1986 tot wijziging
    van Verordening (EEG) nr. 2764/77 tot verlenging van de periode waarin voor bepaalde
    soorten groenten en fruit de kwaliteitsklasse III kan worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3975/86 do Conselho de 22 de Dezembro de 1986 que
    altera o Regulamento (CEE) n.° 2764/77 que prorroga o período durante o qual
    pode tornar-se aplicável a categoria de qualidade III de certas frutas e produtos
    hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3975/86 del Consejo de 22 de diciembre de 1986 por
