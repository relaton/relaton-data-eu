  content: VERORDENING (EEG) Nr. 735/91 VAN DE COMMISSIE van 19 maart 1991 tot vaststelling
    voor de periode van 1 maart tot en met 30 juni 1991 van in de Franse overzeese
    departementen geproduceerde hoeveelheden ruwe suiker die in aanmerking komen voor
    de in Verordening (EEG) nr. 2225/86 van de Raad bedoelde steun voor raffinage
    en tot wijziging van Verordening (EEG) nr. 1835/90
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 735/91 DA COMISSÃO de 19 de Março de 1991 que
    determina, para o período compreendido entre 1 de Março e 30 de Junho de 1991,
    as quantidades de açúcar bruto produzidas nos departamentos franceses ultramarinos
    que beneficiam da ajuda à refinação referida no Regulamento (CEE) nº 2225/86
    do Conselho e que altera o Regulamento (CEE) nº 1835/90 #A COMISSÃO DAS COMUNIDADES
    EUROPEIAS, # Tendo em conta o Tratado que institui a Comunidade Económica Europeia,
    # Tendo em conta o Regulamento (CEE) nº 1785/81 do Conselho, de 30 de Junho de
    1981, que estabelece a organização comum de mercado no sector do açúcar (1),
    com a última redacção que lhe foi dada pelo Regulamento (CEE) nº 305/91 (2),
    e, nomeadamente, o no 6 do seu artigo 9º, # Tendo em conta o Regulamento (CEE)
    nº 2225/86 do Conselho, de 15 de Julho de 1986, que adopta medidas para o escoamento
    dos açúcares produzidos nos departamentos franceses ultramarinos e para a igualização
    das condições de preços com o açúcar bruto preferencial (3), e, nomeadamente,
    o nº 2, segundo parágrafo, do seu artigo 3º, # Considerando que o artigo 3º
    do Regulamento (CEE) nº 2225/86 prevê a concessão de uma ajuda para o açúcar
    bruto produzido nos departamentos franceses ultramarinos e refinado numa refinaria
    situada nas regiões europeias da Comunidade no limite de quantidades a determinar
    segundo as regiões de destino em causa e separadamente segundo a sua proveniência;
    que a determinação dessas quantidades deve ser efectuada com base num balanço
    de abastecimento comunitário de açúcar bruto; que, numa primeira fase, o Regulamento
    (CEE) nº 1835/90 da Comissão (4) determinou as quantidades, com base num balanço
    previsional, para o período compreendido entre 1 de Julho de 1990 e 28 de Fevereiro
    de 1991; # Considerando que a produção definitiva do departamento francês da
    Reunião, bem como as quantidades disponíveis para refinação são agora conhecidas;
    que, por conseguinte, devem ser determinadas as últimas quantidades que podem
    beneficiar da ajuda à refinação em relação ao restante período da campanha
    de 1990/1991; que a produção de açúcar bruto dos departamentos franceses ultramarinos
    e as disponibilidades para a refinação se encontram sensivelmente reduzidas;
    que é necessário, por conseguinte, rever, a fim de reequilibrar o abastecimento
    das diferentes refinarias comunitárias, as quantidades fixadas para o período
    compreendido entre Julho de 1990 e Fevereiro de 1991 pelo Regulamento (CEE) nº
    1835/90; que, em virtude dos problemas relacionados com o programa de carga dos
    navios, uma quantidade suplementar de 1 000 toneladas foi refinada nas refinarias
    francesas, ultrapassando a quantidade inicialmente prevista; # Considerando que
    as medidas previstas no presente regulamento estão em conformidade com o parecer
    do Comité de Gestão do Açúcar, # ADOPTOU O PRESENTE REGULAMENTO: Artigo 1º
    As quantidades de açúcar referidas no nº 2 do artigo 3º do Regulamento (CEE)
    nº 2225/86 são fixadas, para o período compreendido entre 1 de Março e 30
    de Junho de 1991, em conformidade com o anexo I do presente regulamento. Artigo
    2º O anexo do Regulamento (CEE) nº 1835/90 é substituído pelo anexo II do
    presente regulamento. Artigo 3º O presente regulamento entra em vigor na data
    da sua publicação no Jornal Oficial das Comunidades Europeias. # É aplicável
    a partir de 1 de Março de 1991, excepto o seu artigo 2º que é aplicável a
    partir de 1 de Julho de 1990. O presente regulamento é obrigatório em todos
    os seus elementos e directamente aplicável em todos os Estados-membros. # Feito
    em Bruxelas, em 19 de Março de 1991. Pela Comissão # Ray MAC SHARRY # Membro
    da Comissão (1) JO nº L 177 de 1. 7. 1981, p. 4. (2) JO nº L 37 de 9. 2. 1991,
    p. 1. (3) JO nº L 194 de 17. 7. 1986, p. 7. (4) JO nº L 168 de 30. 6. 1990,
    p. 1. # ANEXO I #Quantidades de açúcar bruto de cana, expressas em 1 000 toneladas
    de valor em açúcar branco # Período: 1 de Março a 30 de Junho de 1991 # Provenientes
    dos departamentos franceses ultramarinos Para refinação Na França metropolitana
    Em Portugal No Reino Unido Nas outras regiões da Comunidade 1. Reunião 0 0 0
    0 2. Guadalupe e Martinica 43 0 0 0 # # ANEXO II #Quantidades de açúcar bruto
    de cana, expressas em 1 000 toneladas de valor em açúcar branco # Período:
    1 de Julho de 1990 a 28 de Fevereiro de 1991 # Provenientes dos departamentos
    franceses ultramarinos Para refinação Na França metropolitana Em Portugal No
    Reino Unido Nas outras regiões da Comunidade 1. Reunião 160 0 0 0 2. Guadalupe
    e Martinica 1 0 0 0 # BM391R0728REGULAMENTO (CEE) Nº 728/91 DO CONSELHO de 21
    de Março de 1991 que altera o Regulamento (CEE) nº 1514/76, relativo às importações
    de azeite proveniente da Argélia #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 735/91 DE LA COMISIÓN de 19 de marzo de 1991 por
    el que se determinan, para el período del 1 de marzo al 30 de junio de 1991,
    las cantidades de azúcar terciado producidas en los departamentos franceses de
    Ultramar que se benefician de la ayuda al refinado contemplada en el Reglamento
    (CEE) nº 2225/88 del Consejo, y por el que se modifica el Reglamento (CEE) nº
    1835/90
