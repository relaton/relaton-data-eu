    in Bezug auf spezifische Anforderungen an die Durchführung amtlicher Kontrollen
    der Verwendung pharmakologisch wirksamer Stoffe, die als Tierarzneimittel oder
    als Futtermittelzusatzstoffe zugelassen sind, und verbotener oder nicht zugelassener
    pharmakologisch wirksamer Stoffe und der jeweiligen Rückstände
  type: main
