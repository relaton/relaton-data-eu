- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1644 of 7 July 2022 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council with specific
    requirements for the performance of official controls on the use of pharmacologically
    active substances authorised as veterinary medicinal products or as feed additives
    and of prohibited or unauthorised pharmacologically active substances and residues
    thereof
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1644 de la Commission du 7 juillet 2022
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil par
    des exigences spécifiques pour la réalisation des contrôles officiels de l’utilisation
    des substances pharmacologiquement actives autorisées en tant que médicaments
    vétérinaires ou en tant qu’additifs destinés à l’alimentation des animaux
    et des substances pharmacologiquement actives interdites ou non autorisées et
    de leurs résidus
  type: main
