---
id: EUDecision20191244
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/1244 of 1 July 2019 amending
    Decision 2002/364/EC as regards requirements for HIV and HCV antigen and antibody
    combined tests and as regards requirements for nucleic acid amplification techniques
    with respect to reference materials and qualitative HIV assays (notified under
    document C(2019) 4632)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1244 de la Commission du 1er juillet 2019
    modifiant la décision 2002/364/CE en ce qui concerne les exigences applicables
    aux tests combinés antigènes et anticorps du VIH et du VHC et en ce qui concerne
    les exigences applicables aux techniques d'amplification des acides nucléiques
    pour ce qui a trait aux matériaux de référence et aux tests qualitatifs VIH
    [notifiée sous le numéro C(2019) 4632]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/1244 der Kommission vom 1. Juli 2019
    zur Änderung der Entscheidung 2002/364/EG in Bezug auf die Anforderungen an kombinierte
    HIV- und HCV-Antigen/Antikörper-Tests und in Bezug auf die Anforderungen an Nukleinsäureamplifikationstechniken
    im Hinblick auf Referenzmaterialien und qualitative HIV-Tests (Bekannt gegeben
    unter Aktenzeichen C(2019) 4632)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/1244 на Комисията
    от 1 юли 2019 година за изменение на Решение 2002/364/ЕО
    по отношение на изискванията, приложими към
    комбинираните тестове за антигени и антитела
    на HIV и на HCV и към техниките за амплификация
    на нуклеинови киселини във връзка с референтните
    материали и качествените изследвания за HIV
    (нотифицирано под номер C(2019) 4632)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/1244 ze dne 1. července 2019,
    kterým se mění rozhodnutí 2002/364/ES, pokud jde o požadavky na kombinované
    zkoušky na antigen a protilátku HIV a HCV a pokud jde o požadavky na techniky
    amplifikace nukleových kyselin s ohledem na referenční materiály a kvalitativní
    testy na HIV (oznámeno pod číslem C(2019) 4632)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/1244 af 1. juli 2019
    om ændring af beslutning 2002/364/EF for så vidt angår kravene til kombinerede
    HIV- og HCV-antigen- og -antistof-test og for så vidt angår nukleinsyreamplifikationsteknikker
    vedrørende referencematerialer og kvalitative HIV-assays (meddelt under nummer
    C(2019) 4632)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/1244 της Επιτροπής,
    της 1ης Ιουλίου 2019, για την τροποποίηση της
    απόφασης 2002/364/ΕΚ όσον αφορά τις απαιτήσεις
    για συνδυασμένες δοκιμασίες αντιγόνου και
    αντισωμάτων για τους ιούς HIV και HCV και όσον
    αφορά τις απαιτήσεις για τεχνικές ενίσχυσης
    νουκλεϊκών οξέων σχετικά με τα υλικά αναφοράς
    και τις ποιοτικές δοκιμασίες για τον ιό HIV [κοινοποιηθείσα
    υπό τον αριθμό C(2019) 4632]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/1244, 1. juuli 2019, millega muudetakse
    otsust 2002/364/EÜ seoses nõuetega HIV ja HCV antigeeni ja antikeha kombineeritud
    testidele ning seoses nõuetega nukleiinhapete amplifikatsiooni meetoditele võrdlusmaterjalide
    ja HIV kvalitatiivse määramise testide osas (teatavaks tehtud numbri C(2019)
    4632 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/1244, annettu 1 päivänä
    heinäkuuta 2019, päätöksen 2002/364/EY muuttamisesta siltä osin kuin on kyse
    HIV- ja HCV-antigeeni-vasta-aine-yhdistelmätestien vaatimuksista sekä nukleiinihappojen
    monistustekniikoita koskevista vaatimuksista vertailumateriaalien ja HIV:n kvalitatiivisten
    testien osalta (tiedoksiannettu numerolla C(2019) 4632)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1244 оd 1. srpnja 2019. o izmjeni
    Odluke 2002/364/EZ u pogledu zahtjeva za kombinirane testove na HIV antigen i
    antitijela na HIV odnosno HCV antigen i antitijela na HCV te u pogledu zahtjeva
    za tehnike umnožavanja nukleinske kiseline s obzirom na referentne materijale
    i kvalitativne testove za HIV (priopćeno pod brojem dokumenta C(2019) 4632)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1244 végrehajtási határozata (2019. július 1.)
    a 2002/364/EK határozatnak a HIV és a HCV esetében alkalmazott kombinált antigén-
    és antitesttesztekre, valamint a referenciaanyagok és a kvalitatív HIV-tesztek
    vonatkozásában a nukleinsav-amplifikációs technikákra vonatkozó követelmények
    tekintetében történő módosításáról (az értesítés a C(2019) 4632. számú
    dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/1244 della Commissione, dell'1 luglio
    2019, recante modifica della decisione 2002/364/CE per quanto riguarda i requisiti
    per i test combinati antigene e anticorpo dell'HIV e dell'HCV e i requisiti per
    le tecniche di amplificazione dell'acido nucleico in relazione ai materiali di
    riferimento e ai test qualitativi dell'HIV [notificata con il numero C(2019) 4632]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1244 (2019. gada 1. jūlijs),
    ar ko Lēmumu 2002/364/EK groza attiecībā uz prasībām, kas izvirzāmas kombinētajiem
    HIV un HCV antigēnu un antivielu testiem un nukleīnskābi pastiprinošajām
    metodēm attiecībā uz atsauces materiāliem un kvalitatīvām HIV pārbaudēm
    (izziņots ar dokumenta numuru C(2019) 4632)
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 1 d. Komisijos įgyvendinimo sprendimas (ES) 2019/1244,
    kuriuo dėl ŽIV ir HCV antigenų ir antikūnų jungtiniams tyrimams taikomų
    reikalavimų ir dėl nukleorūgščių amplifikacijos metodams taikomų reikalavimų,
    susijusių su pamatinėmis medžiagomis ir kokybiniais ŽIV tyrimais, iš dalies
    keičiamas Sprendimas 2002/364/EB (pranešta dokumentu Nr. C(2019) 4632)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1244 tal-1 ta'
    Lulju 2019 li temenda d-Deċiżjoni 2002/364/KE fir-rigward tal-ħtiġijiet għat-testijiet
    kombinati tal-antikorpi/antiġeni tal-HIV u tal-HCV u fir-rigward tal-ħtiġijiet
    tat-tekniki ta' amplifikazzjoni tal-aċidu nuklejku b'rabta mal-materjali ta'
    referenza u mal-analiżijiet kwalitattivi tal-HIV (notifikata bid-dokument C(2019)
    4632)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/1244 van de Commissie van 1 juli 2019 tot
    wijziging van Beschikking 2002/364/EG wat betreft de eisen voor gecombineerde
    antigeen/antilichaamtests voor hiv en HCV en de eisen voor nucleïnezuuramplificatietechnieken
    met betrekking tot referentiematerialen en kwalitatieve hiv-tests (Kennisgeving
    geschied onder nummer C(2019) 4632)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/1244 z dnia 1 lipca 2019 r. zmieniająca
    decyzję 2002/364/WE w odniesieniu do wymogów dotyczących testów łączonych
    na obecność antygenów i przeciwciał HIV i HCV oraz wymogów dotyczących technik
    amplifikacji kwasu nukleinowego w odniesieniu do materiałów referencyjnych i
    testów jakościowych HIV (notyfikowana jako dokument nr C(2019) 4632)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/1244 da Comissão, de 1 de julho de 2019,
    que altera a Decisão 2002/364/CE no que diz respeito aos requisitos para os testes
    combinados de antigénios e anticorpos para o VHC e VIH e para as técnicas de
    amplificação dos ácidos nucleicos relacionados com os materiais de referência
    e os ensaios qualitativos para o VIH [notificada com o número C(2019) 4632]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/1244 a Comisiei din 1 iulie 2019
    de modificare a Deciziei 2002/364/CE în ceea ce privește cerințele pentru testele
    combinate antigen/anticorp pentru HIV și VHC și în ceea ce privește cerințele
    pentru tehnicile de amplificare a acizilor nucleici în raport cu materialele
    de referință și testele calitative de depistare a HIV [notificată cu numărul
    C(2019) 4632]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/1244 z 1. júla 2019, ktorým
    sa mení rozhodnutie 2002/364/ES, pokiaľ ide o požiadavky na kombinované testy
    antigénov a protilátok HIV a HCV a pokiaľ ide o požiadavky na techniky amplifikácie
    kyseliny nukleovej vo vzťahu k referenčným materiálom a kvalitatívnym testom
    na HIV [oznámené pod číslom C(2019) 4632]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/1244 z dne 1. julija 2019 o spremembi
    Odločbe 2002/364/ES v zvezi z zahtevami za kombinirane teste za antigen HIV in
    protitelesa proti HIV ter za antigen HCV in protitelesa proti HCV ter v zvezi
    z zahtevami za tehnike pomnoževanja nukleinske kisline glede referenčnih materialov
    in kakovostnih testov za HIV (notificirano pod dokumentarno številko C(2019)
    4632)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/1244 de la Comisión, de 1 de julio de
    2019, por la que se modifica la Decisión 2002/364/CE en lo que concierne a los
    requisitos de las pruebas combinadas de detección del antígeno y el anticuerpo
    del VIH y el VHC y a los requisitos de las técnicas de amplificación de ácidos
    nucleicos por lo que respecta a los materiales de referencia y los ensayos cualitativos
    para el VIH [notificada con el número C(2019) 4632]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/1244 av den 1 juli 2019 om
    ändring av beslut 2002/364/EG vad gäller krav på kombinerade antigen- och antikroppstester
    för HIV och HCV samt vad gäller krav på nukleinsyraamplifikationstekniker med
    avseende på referensmaterial och kvalitativa HIV-tester [delgivet med nr C(2019)
    4632]
