id: EUDecision197322
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 March 1973 authorizing the French Republic not
    to apply Community treatment to optical microscopes falling within heading No
    ex 90.12 of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/22/CEE de la Commission, du 12 mars 1973, autorisant la République
    française à exclure du traitement communautaire les microscopes optiques, de
    la position Ex 90.12 du Tarif douanier commun, originaires du Japon et mis en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. März 1973, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche optische Mikroskope der Tarifnummer ex 90.12 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 12. marts 1973 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage optiske mikroskoper som henhører
    under position ex 90.12 i den fælles toldtarif, har oprindelse i Japan og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 marzo 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i microscopi ottivi della voce
    ex 90.12 della tariffa doganale comune, originari del Giappone e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 maart 1973 waarbij de Franse Republiek
    wordt gemachtigd optische microscopen van post ex 90.12 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
