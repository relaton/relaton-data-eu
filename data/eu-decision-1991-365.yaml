  content: '91/365/EEC: Commission Decision of 27 June 1991 authorizing the United
    Kingdom and the Federal Republic of Germany to permit temporarily the marketing
    of black medick seed not satisfying the requirements of Council Directive 66/401/EEC'
  type: main
- language: fr
  script: Latn
  content: '91/365/CEE: Décision de la Commission du 27 juin 1991 autorisant le Royaume-Uni
    et la République fédérale d''Allemagne à admettre temporairement la commercialisation
    de graines de minette qui ne satisfont pas aux exigences de la directive 66/401/CEE'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 27. Juni 1991 zur Ermächtigung des Vereinigten
    Königreichs und der Bundesrepublik Deutschland, vorübergehend Saatgut von Gelbklee
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 66/401/EWG des Rates
    nicht entspricht (91/365/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 27. juni 1991 om bemyndigelse af Det Forenede
    Kongerige og Forbundsrepublikken Tyskland til midlertidigt at tillade handel med
    frø af humlesneglbælg, der ikke opfylder kravene i Rådets direktiv 66/401/EØF
    (91/365/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/365/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Ιουνίου 1991 που εξουσιοδοτεί το Ηνωμένο Βασίλειο
    και την Ομοσπονδιακή Δημοκρατία της Γερμανίας
    να επιτρέψουν προσωρινά την εμπορία σπόρων
    μηδικής της λυκίσκης, που δεν ικανοποιούν τις
    απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 27 giugno 1991 che autorizza il Regno
    Unito e la Repubblica federale di Germania a consentire temporaneamente la commercializzazione
    di sementi di luppolina che non soddisfano i requisiti della direttiva 66/401/CEE
    (91/365/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 27 juni 1991 waarbij het Verenigd Koninkrijk
    en de Bondsrepubliek Duitsland worden gemachtigd om tijdelijk toe te staan dat
    hopperupsklaverzaad in de handel wordt gebracht dat niet voldoet aan de eisen
    van Richtlijn 66/401/EEG van de Raad (91/365/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 27 de Junho de 1991 que autoriza o Reino Unido
    e a República Federal da Alemanha a permitir temporariamente a comercialização
    de sementes de luzerna lupulina que não satisfazem as exigências da Directiva
    66/401/CEE do Conselho (91/365/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 27 de junio de 1991 por la que se autoriza
    al Reino Unido y a la República Federal de Alemania para permitir temporalmente
    la comercialización de lupulina que no cumpla los requisitos establecidos en
    la Directiva 66/401/CEE del Consejo (91/365/CEE) #'
