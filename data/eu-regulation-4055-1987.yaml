  content: Commission Regulation (EEC) No 4055/87 of 22 December 1987 amending Council
    Regulation (EEC) No 3035/80 laying down general rules for granting export refunds
    on certain agricultural products exported in the form of goods not covered by
    Annex II to the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4055/87 de la Commission du 22 décembre 1987 modifiant
    le règlement (CEE) n° 3035/80 du Conseil, établissant pour certains produits
    agricoles exportés sous forme de marchandises ne relevant pas de l' annexe II
    du traité, les règles générales relatives à l' octroi des restitutions à
    l' exportation et les critères de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4055/87 der Kommission vom 22. Dezember 1987 zur Änderung
    der Verordnung (EWG) Nr. 3035/80 des Rates zur Festlegung der allgemeinen Regeln
    für die Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung
    des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse, die in
    Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4055/87 af 22. december 1987 om ændring
