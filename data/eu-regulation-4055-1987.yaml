    for ydelse af eksportrestitutioner og om fastlæggelse af kriterierne for fastsættelse
    af restitutionsbeløbet for visse landbrugsprodukter, der udføres i form af varer,
    som ikke omfattes af Traktatens bilag II
  type: main
- language: el
  script: Grek
