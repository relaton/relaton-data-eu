title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1930/73 of the Council of 16 July 1973 laying down,
    for the 1973/74 wine-growing year, the price to be paid for alcohol delivered
    to intervention agencies under the obligation to distil the by-products of wine
    making, and the amount of the contribution towards this price by the Guarantee
    Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1930/73 du Conseil, du 16 juillet 1973, déterminant,
    pour la campagne viticole 1973/1974, le prix à payer pour l'alcool livré aux
    organismes d'intervention au titre de la distillation obligatoire des sous-produits
    de la vinification et le montant de l'intervention, dans ce prix, du Fonds européen
    d'orientation et de garantie agricole, section garantie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1930/73 des Rates vom 16. Juli 1973 zur Festlegung
    - für das Weinwirtschaftsjahr 1973/1974 - des von den Interventionsstellen zu
    zahlenden Preises für den Alkohol, der ihnen im Rahmen der vorgeschriebenen Destillation
    der Nebenerzeugnisse der Weinbereitung geliefert wird, und des dabei vom Europäischen
    Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung Garantie, zu
    übernehmenden Anteils
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1930/73 af 16. juli 1973 om fastsættelse
    for vinhøståret 1973/1974 af den pris, der skal betales for alkohol, som leveres
    til interventionsorganerne som følge af forpligtelsen til destillering af biprodukter
    ved vinfremstilling samt af det beløb, hvormed Den europæiske Udviklings- og
    Garantifond for Landbruget, garantisektoren, skal intervenere med hensyn til denne
    pris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1930/73 del Consiglio, del 16 luglio 1973, che fissa
    per la campagna viticola 1973/1974, il prezzo dell'alcole consegnato agli organismi
    d'intervento per la distillazione obbligatoria dei sottoprodotti della vinificazione
    e determina l'importo dell'intervento in tale prezzo del Fondo europeo agricolo
    di orientamento e di garanzia, sezione garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1930/73 van de Raad van 16 juli 1973 tot vaststelling,
    voor het wijnoogstjaar 1973/1974, van de prijs die moet worden betaald voor de
    aan de interventiebureaus uit hoofde van de verplichte distillatie van de bijprodukten
    van de wijnbereiding geleverde alcohol, alsmede van het gedeelte van deze prijs
    dal voor rekening komt van het Europees Oriëntatie- en Garantiefonds voor de
    Landbouw afdeling Garantie
  type: main
