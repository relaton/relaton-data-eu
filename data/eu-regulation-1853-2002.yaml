  script: Latn
  content: Verordening (EG) nr. 1853/2002 van de Commissie van 17 oktober 2002 houdende
    wĳziging van Verordening (EG) nr. 2305/95 tot vaststelling van de uitvoeringsbepalingen,
    in de sector varkensvlees, van de regeling waarin is voorzien bĳ de Overeenkomsten
    betreffende vrĳhandel tussen de Gemeenschap, enerzĳds, en Estland, Letland en
    Litouwen, anderzĳds, en tot wĳziging van Verordening (EG) nr. 1117/2002 tot
    vaststelling van de hoeveelheid van bepaalde producten van de sector varkensvlees
