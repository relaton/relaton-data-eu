    enerzĳds, en Letland, Litouwen en Estland, anderzĳds, gesloten overeenkomsten
    betreffende vrĳhandel, beschikbaar is voor het vierde kwartaal van 2002
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1853/2002 da Comissão, de 17 de Outubro de 2002,
    que altera o Regulamento (CE) n.° 2305/95 que estabelece as normas de execução
    no sector da carne de suíno do regime previsto nos acordos sobre comércio livre
    entre a Comunidade, por um lado, e a Estónia, a Letónia e a Lituânia, por outro,
    e altera o Regulamento (CE) n.° 1117/2002 que determina a quantidade disponível
    de determinados produtos do sector da carne de suíno, para o quarto trimestre
    de 2002, no âmbito do regime previsto nos acordos de comércio livre entre a
    Comunidade, por um lado, e a Letónia, a Lituânia e a Estónia, por outro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1853/2002 de la Comisión, de 17 de octubre de 2002,
    que modifica el Reglamento (CE) n° 2305/95 por el que se establecen las disposiciones
    de aplicación, en el sector de la carne de porcino, del régimen previsto en
    los Acuerdos de libre comercio entre la Comunidad, por una parte, y Estonia, Letonia
    y Lituania, por otra, y el Reglamento (CE) n° 1117/2002 por el que se fijan,
    en aplicación del régimen previsto en los Acuerdos de libre comercio entre la
    Comunidad, por una parte, y Letonia, Lituania y Estonia, por otra, las cantidades
    disponibles durante el cuarto trimestre de 2002 en lo que se refiere a determinados
    productos del sector de la carne de porcino
