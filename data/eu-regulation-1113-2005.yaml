title:
- language: en
  script: Latn
  content: Council Regulation (EC) no 1113/2005 of 12 July 2005 terminating the new
    exporter review of Regulation (EC) No 1995/2000 imposing definitive anti-dumping
    duties on imports of solutions of urea and ammonium nitrate (UAN) originating,
    inter alia, in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1113/2005 du Conseil du 12 juillet 2005 clôturant
    le réexamen au titre de «nouvel exportateur» du règlement (CE) n° 1995/2000
    instituant un droit antidumping définitif sur les importations de solutions d’urée
    et de nitrate d’ammonium originaires, entre autres, d’Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1113/2005 des Rates vom 12. Juli 2005 zur Einstellung
    der Überprüfung für einen neuen Ausführer der Verordnung (EG) Nr. 1995/2000
    zur Einführung endgültiger Antidumpingzölle auf die Einfuhren von Lösungen
    von Harnstoff und Ammoniumnitrat (HAN) mit Ursprung unter anderem in Algerien
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1113/2005 ze dne 12. července 2005, kterým
    se zastavuje přezkum pro nového vývozce nařízení (ES) č. 1995/2000 o uložení
    konečného antidumpingového cla z dovozu směsí močoviny a dusičnanu amonného
    pocházejících mimo jiné z Alžírska
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1113/2005 af 12. juli 2005 om afslutning af
    den fornyede undersøgelse af forordning (EF) nr. 1995/2000 om indførelse af
    en endelig antidumpingtold på importen af opløsninger af urinstof og ammoniumnitrat
    med oprindelse i bl.a. Algeriet, vedrørende en ny eksportør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1113/2005 του Συμβουλίου,
    της 12ης Ιουλίου 2005, για περάτωση της επανεξέτασης
    ως προς νέο εξαγωγέα του κανονισμού (ΕΚ) αριθ.
    1995/2000 για την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές διαλυμάτων ουρίας και νιτρικού
    αμμωνίου, καταγωγής, μεταξύ άλλων, Αλγερίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1113/2005, 12. juuli 2005, millega lõpetatakse
    muu hulgas Alžeeriast pärit uurea ja ammooniumnitraadi lahuste impordi suhtes
    lõpliku dumpinguvastase tollimaksu kehtestamist käsitleva määruse (EÜ) nr
    1995/2000 läbivaatamine, mis käsitleb uut eksportijat
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1113/2005, annettu 12 päivänä heinäkuuta
    2005, lopullisen polkumyyntitullin käyttöönotosta muun muassa Algeriasta peräisin
    olevan urean ja ammoniumnitraatin liuosseoksen (UAN) tuonnissa annettua asetusta
    (EY) N:o 1995/2000 koskevan uuden viejän tarkastelun päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 1113/2005/EK rendelete (2005. július 12.) a többek között
    Algériából származó karbamid- és ammónium-nitrát importjára vonatkozó
    végleges dömpingellenes vám kivetéséről szóló 1995/2000/EK tanácsi rendelet
    új exportőrre vonatkozó felülvizsgálatának befejezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1113/2005 del Consiglio, del 12 luglio 2005, che chiude
    il riesame relativo ai «nuovi esportatori» del regolamento (CE) n. 1995/2000
    che istituisce dazi antidumping definitivi sulle importazioni di soluzioni di
    urea e di nitrato di ammonio originarie, tra l’altro, dell’Algeria
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1113/2005 (2005. gada 12. jūlijs), ar kuru jauna
