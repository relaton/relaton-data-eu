  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1113/2005 tat- 12 ta' Lulju 2005 li jtemm
    ir-reviżjoni ta' esportaturi ġodda tar-Regolament tal-Kunsill (KE) Nru 1995/2000
    li jimponi dazji definittivi anti-dumping fuq l-importazzjonijiet ta' urea u nitrati
    ta' l-ammonja (UAN) li joriġinaw, fost l-oħrajn, mill-Alġerija
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1113/2005 van de Raad van 12 juli 2005 tot beëindiging
    van de procedure, ten behoeve van een nieuwe exporteur, voor de eventuele herziening
    van Verordening (EG) nr. 1995/2000 tot instelling van definitieve antidumpingrechten
    op ureum en ammoniumnitraat uit, onder meer, Algerije
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1113/2005 z dnia 12 lipca 2005 r. kończące
    pod kątem nowego eksportera przegląd rozporządzenia (WE) nr 1995/2000 nakładającego
    ostateczne cła antydumpingowe na przywóz roztworu saletrzano-mocznikowego, pochodzącego
    między innymi z Algierii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1113/2005 do Conselho, de 12 de Julho de 2005, que
    encerra o reexame a título de «novo exportador» do Regulamento (CE) n.° 1995/2000
    que cria um direito anti-dumping definitivo sobre as importações de soluções
    de ureia e de nitrato de amónio originárias, entre outros países, da Argélia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1113/2005 z 12. júla 2005 o ukončení preskúmania
    nového vývozcu v súvislosti s nariadením (ES) č. 1995/2000, ktorým sa ukladá
    konečné antidumpingové clo na dovozy roztokov močoviny a dusičnanu amónneho
    s pôvodom, okrem iného, v Alžírsku
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1113/2005 z dne 12. julija 2005 o prenehanju pregleda
    za novega izvoznika iz Uredbe (ES) št. 1995/2000 o uvedbi dokončnih protidampinških
    dajatev na uvoz sečnine in amonijevega nitrata (SAN) s poreklom med drugim iz
    Alžirije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1113/2005 del Consejo, de 12 de julio de 2005, por
