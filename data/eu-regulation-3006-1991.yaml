title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3006/91 of 14 October 1991 re-establishing
    the levying of customs duties on products of category 35 (order No 40.0350), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3006/91 DE LA COMMISSION du 14 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 35 (numéro d'' ordre 40.0350) originaires du Pakistan, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3006/91 DER KOMMISSION vom 14. Oktober 1991 über
    die Wiedereinführung des Zollsatzes für die Waren der Kategorie 35 (laufende
    Nummer 40.0350) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3006/91 af 14. oktober 1991 om genindførelse
