    sintetiche ed artificiali in fiocco, greggi o imbianchiti, della categoria di
    prodotti n. ex 3 (codice 40.0033), originari del Pakistan beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3559/86 van de Commissie van 20 november 1986 houdende
