title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3559/86 of 20 November 1986 re-establishing
    the levying of customs duties on woven fabrics of man-made fibres (discontinuous
    or waste), unbleached or bleached, products of category ex 3 (code 40.0033), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3559/86 de la Commission du 20 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques et artificielles discontinues, écrus ou blanchis,
    de la catégorie ex 3 (code 40.0033), originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3559/86 der Kommission vom 20. November 1986 über
    die Wiedereinführung des Zollsatzes für Gewebe aus synthetischen oder künstlichen
    Spinnfasern, roh oder gebleicht, der Warenkategorie Nr. ex 3 (Kennziffer 40.0033),
    mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3600/85 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3559/86 af 20. november 1986 om genindførelse
    af opkrævning af toldafgifter for vævet stof af korte kemofibre eller af affald
    af kemofibre, ublegede og blegede, under varekategori nr. ex 3 (kode 40.0033),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3600/85
  type: main
- language: el
  script: Grek
