  content: Council Regulation (EC) No 976/1999 of 29 April 1999 laying down the requirements
    for the implementation of Community operations, other than those of development
    cooperation, which, within the framework of Community cooperation policy, contribute
    to the general objective of developing and consolidating democracy and the rule
    of law and to that of respecting human rights and fundamental freedoms in third
    countries
  type: main
- language: fr
  script: Latn
