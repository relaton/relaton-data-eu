title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1101/78 of 25 May 1978 re-establishing the
    levying of customs duties on radiotelegraphic and radiotelephonic transmission
    and reception apparatus, etc., falling within subheadings 85.15 A I, A II, A IV,
    B, C I and C II, originating in India to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1101/78 de la Commission, du 25 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de transmission et de réception pour la radiotéléphonie, la radiotélégraphie,
    etc., des sous-positions tarifaires 85.15 A I, II et IV, B et C I et II, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1101/78 der Kommission vom 25. Mai 1978 zur Wiedereinführung
    des Zollsatzes für Sende- und Empfangsgeräte für den Fernsprech- oder Funktelegraphieverkehr
    usw., der Tarifstellen 85.15 A I, II, IV, B, C I und II, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1101/78 af 25. maj 1978 om genindførelse
    af opkrævning af toldafgifter for sendere og modtagere til radiotelegrafi og
    radiotelefoni, etc., under underposition 85.15 A I, II, IV, B, C I, II, som har
    oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1101/78 della Commissione, del 25 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi di trasmissione
    e di ricezione per la radiotelefonia e la radiotelegrafia, ecc., delle sottovoci
    doganali 85.15 A I, II, IV, B, C I, II, originari dell'India, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1101/78 van de Commissie van 25 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zend- en
    ontvangtoestellen voor radiotelefonie of voor radiotelegrafie, enz., van post
    85.15 A I, II, IV, B, C I, II, van oorsprong uit India, ten behoeve waarvan bij
    Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
