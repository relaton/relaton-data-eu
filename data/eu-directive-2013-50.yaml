---
id: EUDirective201350
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Directive 2013/50/EU of the European Parliament and of the Council of 22
    October 2013 amending Directive 2004/109/EC of the European Parliament and of
    the Council on the harmonisation of transparency requirements in relation to information
    about issuers whose securities are admitted to trading on a regulated market,
    Directive 2003/71/EC of the European Parliament and of the Council on the prospectus
    to be published when securities are offered to the public or admitted to trading
    and Commission Directive 2007/14/EC laying down detailed rules for the implementation
    of certain provisions of Directive 2004/109/EC
  type: main
- language: fr
  script: Latn
  content: Directive 2013/50/UE du Parlement européen et du Conseil du 22 octobre
    2013 modifiant la directive 2004/109/CE du Parlement européen et du Conseil sur
    l’harmonisation des obligations de transparence concernant l’information sur
    les émetteurs dont les valeurs mobilières sont admises à la négociation sur
    un marché réglementé, la directive 2003/71/CE du Parlement européen et du
    Conseil concernant le prospectus à publier en cas d’offre au public de valeurs
    mobilières ou en vue de l’admission de valeurs mobilières à la négociation
    et la directive 2007/14/CE de la Commission portant modalités d’exécution
    de certaines dispositions de la directive 2004/109/CE
  type: main
- language: de
  script: Latn
  content: Richtlinie 2013/50/EU des Europäischen Parlaments und des Rates vom 22.
    Oktober 2013 zur Änderung der Richtlinie 2004/109/EG des Europäischen Parlaments
    und des Rates zur Harmonisierung der Transparenzanforderungen in Bezug auf Informationen
    über Emittenten, deren Wertpapiere zum Handel auf einem geregelten Markt zugelassen
    sind, der Richtlinie 2003/71/EG des Europäischen Parlaments und des Rates betreffend
    den Prospekt, der beim öffentlichen Angebot von Wertpapieren oder bei deren Zulassung
    zum Handel zu veröffentlichen ist, sowie der Richtlinie 2007/14/EG der Kommission
    mit Durchführungsbestimmungen zu bestimmten Vorschriften der Richtlinie 2004/109/EG
  type: main
- language: bg
  script: Cyrl
  content: Директива 2013/50/ЕС на Европейския парламент
    и на Съвета от 22 октомври 2013 година за изменение
    на Директива 2004/109/ЕО на Европейския парламент
    и на Съвета относно хармонизиране изискванията
    за прозрачност по отношение на информацията
    за издателите, чиито ценни книжа са допуснати
    за търгуване на регулиран пазар, Директива
    2003/71/ЕО на Европейския парламент и на Съвета
    относно проспекта, който следва да се публикува,
    когато публично се предлагат ценни книжа или
    когато се допускат ценни книжа до търгуване,
    и Директива 2007/14/ЕО на Комисията за определяне
    на подробни правила за прилагането на определени
    разпоредби от Директива 2004/109/ЕО
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2013/50/EU ze dne 22. října 2013
    , kterou se mění směrnice Evropského parlamentu a Rady 2004/109/ES o harmonizaci
    požadavků na průhlednost týkajících se informací o emitentech, jejichž
    cenné papíry jsou přijaty k obchodování na regulovaném trhu, směrnice Evropského
    parlamentu a Rady 2003/71/ES o prospektu, který má být zveřejněn při veřejné
    nabídce nebo přijetí cenných papírů k obchodování a směrnice Komise 2007/14/ES,
    kterou se stanoví prováděcí pravidla k některým ustanovením směrnice 2004/109/ES
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2013/50/EU af 22. oktober 2013
    om ændring af Europa-Parlamentets og Rådets direktiv 2004/109/EF om harmonisering
    af gennemsigtighedskrav i forbindelse med oplysninger om udstedere, hvis værdipapirer
    er optaget til handel på et reguleret marked, Europa-Parlamentets og Rådets
    direktiv 2003/71/EF om det prospekt, der skal offentliggøres, når værdipapirer
    udbydes til offentligheden eller optages til handel, og Kommissionens direktiv
    2007/14/EF om gennemførelsesbestemmelser til visse bestemmelser i direktiv 2004/109/EF
  type: main
- language: el
  script: Grek
  content: Οδηγία 2013/50/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 22ας Οκτωβρίου 2013 , για
    την τροποποίηση της οδηγίας 2004/109/ΕΚ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου για την εναρμόνιση
    των προϋποθέσεων διαφάνειας αναφορικά με την
    πληροφόρηση σχετικά με εκδότες των οποίων
    οι κινητές αξίες έχουν εισαχθεί προς διαπραγμάτευση
    σε ρυθμιζόμενη αγορά, της οδηγίας 2003/71/ΕΚ του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    σχετικά με το ενημερωτικό δελτίο που πρέπει
    να δημοσιεύεται κατά τη δημόσια προσφορά κινητών
    αξιών ή την εισαγωγή τους προς διαπραγμάτευση
    και της οδηγίας 2007/14/ΕΚ της Επιτροπής σχετικά
    με τον καθορισμό αναλυτικών κανόνων για την
    εφαρμογή ορισμένων διατάξεων της οδηγίας 2004/109/ΕΚ
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2013/50/EL, 22. oktoober 2013
    , millega muudetakse Euroopa Parlamendi ja nõukogu direktiivi 2004/109/EÜ läbipaistvusnõuete
    ühtlustamise kohta teabele, mis kuulub avaldamisele emitentide kohta, kelle väärtpaberid
    on lubatud reguleeritud turul kauplemisele, Euroopa Parlamendi ja nõukogu direktiivi
    2003/71/EÜ väärtpaberite üldsusele pakkumisel või kauplemisele lubamisel
    avaldatava prospekti kohta ja komisjoni direktiivi 2007/14/EÜ, milles sätestatakse
    direktiivi 2004/109/EÜ teatavate sätete üksikasjalikud rakenduseeskirjad
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2013/50/EU, annettu 22 päivänä
    lokakuuta 2013 , säännellyillä markkinoilla kaupankäynnin kohteeksi otettavien
    arvopaperien liikkeeseenlaskijoita koskeviin tietoihin liittyvien avoimuusvaatimusten
    yhdenmukaistamisesta annetun Euroopan parlamentin ja neuvoston direktiivin 2004/109/EY,
    arvopapereiden yleisölle tarjoamisen tai kaupankäynnin kohteeksi ottamisen yhteydessä
    julkistettavasta esitteestä annetun Euroopan parlamentin ja neuvoston direktiivin
    2003/71/EY ja direktiivin 2004/109/EY tiettyjen säännösten täytäntöönpanoa
    koskevista yksityiskohtaisista säännöistä annetun komission direktiivin 2007/14/EY
    muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2013/50/EU Europskog parlamenta i Vijeća od 22. listopada 2013.
    o izmjenama Direktive 2004/109/EZ Europskog parlamenta i Vijeća o usklađivanju
    zahtjeva za transparentnošću u vezi s informacijama o izdavateljima čiji su
    vrijednosni papiri uvršteni za trgovanje na uređenom tržištu, Direktive 2003/71/EZ
    Europskog parlamenta i Vijeća o prospektu koji je potrebno objaviti prilikom
    javne ponude vrijednosnih papira ili prilikom uvrštavanja u trgovanje i Direktive
    Komisije 2007/14/EZ o utvrđivanju detaljnih pravila za provedbu određenih odredbi
    Direktive 2004/109/EZ
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2013/50/EU irányelve ( 2013. október
    22. ) a szabályozott piacra bevezetett értékpapírok kibocsátóival kapcsolatos
    információkra vonatkozó átláthatósági követelmények harmonizációjáról
    szóló 2004/109/EK európai parlamenti és tanácsi irányelv, az értékpapírok
    nyilvános kibocsátásakor vagy piaci bevezetésekor közzéteendő tájékoztatóról
    szóló 2003/71/EK európai parlamenti és tanácsi irányelv, valamint a 2004/109/EK
    irányelv egyes rendelkezéseinek végrehajtására irányadó részletes szabályok
    megállapításáról szóló 2007/14/EK bizottsági irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2013/50/UE del Parlamento europeo e del Consiglio, del 22 ottobre
    2013 , recante modifica della direttiva 2004/109/CE del Parlamento europeo e del
    Consiglio, sull’armonizzazione degli obblighi di trasparenza riguardanti le
    informazioni sugli emittenti i cui valori mobiliari sono ammessi alla negoziazione
    in un mercato regolamentato, la direttiva 2003/71/CE del Parlamento europeo e
    del Consiglio, relativa al prospetto da pubblicare per l’offerta pubblica o
    l’ammissione alla negoziazione di strumenti finanziari, e la direttiva 2007/14/CE
    della Commissione, che stabilisce le modalità di applicazione di talune disposizioni
    della direttiva 2004/109/CE
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2013/50/ES ( 2013. gada 22. oktobris
    ), ar kuru groza Eiropas Parlamenta un Padomes Direktīvu 2004/109/EK par atklātības
    prasību saskaņošanu attiecībā uz informāciju par emitentiem, kuru vērtspapīrus
    atļauts tirgot regulētā tirgū, Eiropas Parlamenta un Padomes Direktīvu 2003/71/EK
    par prospektu, kurš jāpublicē, publiski piedāvājot vērtspapīrus vai atļaujot
    to tirdzniecību, un Komisijas Direktīvu 2007/14/EK, ar ko nosaka sīki izstrādātus
    noteikumus Direktīvas 2004/109/EK atsevišķu noteikumu īstenošanai
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 22 d. Europos Parlamento ir Tarybos direktyva 2013/50/ES,
    kuria iš dalies keičiama Europos Parlamento ir Tarybos direktyva 2004/109/EB
    dėl informacijos apie emitentus, kurių vertybiniais popieriais leista prekiauti
    reguliuojamoje rinkoje, skaidrumo reikalavimų suderinimo, Europos Parlamento
    ir Tarybos direktyva 2003/71/EB dėl prospekto, kuris turi būti skelbiamas, kai
    vertybiniai popieriai siūlomi visuomenei ar įtraukiami į prekybos sąrašą,
    ir Komisijos direktyva 2007/14/EB, nustatanti išsamias tam tikrų Direktyvos
    2004/109/EB nuostatų įgyvendinimo taisykles
  type: main
- language: mt
  script: Latn
  content: Direttiva 2013/50/UE tal-Parlament Ewropew u tal-Kunsill tat- 22 ta’
    Ottubru 2013 li temenda d-Direttiva 2004/109/KE tal-Parlament Ewropew u tal-Kunsill
    dwar l-armonizzazzjoni tar-rekwiżiti ta’ trasparenza f’dak li għandu x’jaqsam
    ma’ informazzjoni dwar emittenti li t-titoli tagħhom huma ammessi għall-kummerċ
    f’suq regolat, id-Direttiva 2003/71/KE tal-Parlament Ewropew u tal-Kunsill dwar
    il-prospett li għandu jiġi ppubblikat meta titoli jiġu offruti lill-pubbliku
    jew jiġu ammessi għall-kummerċ u d-Direttiva tal-Kummissjoni 2007/14/KE li
    tistabbilixxi regoli dettaljati għall-implimentazzjoni ta’ xi dispożizzjonijiet
    tad-Direttiva 2004/109/KE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2013/50/EU van het Europees Parlement en de Raad van 22 oktober
    2013 tot wijziging van Richtlijn 2004/109/EG van het Europees Parlement en de
    Raad betreffende de transparantievereisten die gelden voor informatie over uitgevende
    instellingen waarvan effecten tot de handel op een gereglementeerde markt zijn
    toegelaten, Richtlijn 2003/71/EG van het Europees Parlement en de Raad betreffende
    het prospectus dat gepubliceerd moet worden wanneer effecten aan het publiek worden
    aangeboden of tot de handel worden toegelaten en Richtlijn 2007/14/EG van de Commissie
    tot vaststelling van concrete uitvoeringsvoorschriften van een aantal bepalingen
    van Richtlijn 2004/109/EG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2013/50/UE z dnia 22 października
    2013 r. zmieniająca dyrektywę 2004/109/WE Parlamentu Europejskiego i Rady w
    sprawie harmonizacji wymogów dotyczących przejrzystości informacji o emitentach,
    których papiery wartościowe dopuszczane są do obrotu na rynku regulowanym,
    dyrektywę 2003/71/WE Parlamentu Europejskiego i Rady w sprawie prospektu emisyjnego
    publikowanego w związku z publiczną ofertą lub dopuszczeniem do obrotu papierów
    wartościowych oraz dyrektywę Komisji 2007/14/WE ustanawiającą szczegółowe
    zasady wdrożenia niektórych przepisów dyrektywy 2004/109/WE
  type: main
- language: pt
  script: Latn
  content: Diretiva 2013/50/UE do Parlamento Europeu e do Conselho, de 22 de outubro
    de 2013 , que altera a Diretiva 2004/109/CE do Parlamento Europeu e do Conselho
    relativa à harmonização dos requisitos de transparência no que se refere às
    informações respeitantes aos emitentes cujos valores mobiliários estão admitidos
    à negociação num mercado regulamentado, a Diretiva 2003/71/CE do Parlamento
    Europeu e do Conselho relativa ao prospeto a publicar em caso de oferta pública
    de valores mobiliários ou da sua admissão à negociação e a Diretiva 2007/14/CE
    da Comissão que estabelece as normas de execução de determinadas disposições
    da Diretiva 2004/109/CE
  type: main
- language: ro
  script: Latn
  content: Directiva 2013/50/UE a Parlamentului European și a Consiliului din 22
    octombrie 2013 de modificare a Directivei 2004/109/CE a Parlamentului European
    și a Consiliului privind armonizarea obligațiilor de transparență în ceea
    ce privește informația referitoare la emitenții ale căror valori mobiliare
    sunt admise la tranzacționare pe o piață reglementată, a Directivei 2003/71/CE
    a Parlamentului European și a Consiliului privind prospectul care trebuie publicat
    în cazul unei oferte publice de valori mobiliare sau pentru admiterea valorilor
    mobiliare la tranzacționare și a Directivei 2007/14/CE a Comisiei de stabilire
    a normelor de aplicare a anumitor dispoziții ale Directivei 2004/109/CE
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2013/50/EÚ z 22. októbra 2013
    , ktorou sa mení smernica Európskeho parlamentu a Rady 2004/109/ES o harmonizácii
    požiadaviek na transparentnosť v súvislosti s informáciami o emitentoch, ktorých
    cenné papiere sú prijaté na obchodovanie na regulovanom trhu, smernica Európskeho
    parlamentu a Rady 2003/71/ES o prospekte, ktorý sa zverejňuje pri verejnej ponuke
    cenných papierov alebo ich prijatí na obchodovanie, a smernica Komisie 2007/14/ES,
    ktorou sa stanovujú podrobné pravidlá implementácie určitých ustanovení
    smernice 2004/109/ES
  type: main
- language: sl
  script: Latn
  content: Direktiva 2013/50/EU Evropskega parlamenta in Sveta z dne 22. oktobra 2013
    o spremembi Direktive 2004/109/ES Evropskega parlamenta in Sveta o uskladitvi
    zahtev v zvezi s preglednostjo informacij o izdajateljih, katerih vrednostni papirji
    so sprejeti v trgovanje na organiziranem trgu, Direktive 2003/71/ES Evropskega
    parlamenta in Sveta o prospektu, ki se objavi ob javni ponudbi ali sprejemu vrednostnih
    papirjev v trgovanje, ter Direktive Komisije 2007/14/ES o določitvi podrobnih
    pravil za izvajanje nekaterih določb Direktive 2004/109/ES
  type: main
- language: es
  script: Latn
  content: Directiva 2013/50/UE del Parlamento Europeo y del Consejo, de 22 de octubre
    de 2013 , por la que se modifican la Directiva 2004/109/CE del Parlamento Europeo
    y del Consejo sobre la armonización de los requisitos de transparencia relativos
    a la información sobre los emisores cuyos valores se admiten a negociación en
    un mercado regulado, la Directiva 2003/71/CE del Parlamento Europeo y del Consejo
    sobre el folleto que debe publicarse en caso de oferta pública o admisión a
    cotización de valores, y la Directiva 2007/14/CE de la Comisión por la que se
    establecen disposiciones de aplicación de determinadas prescripciones de la Directiva
    2004/109/CE
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2013/50/EU av den 22 oktober 2013
    om ändring av Europaparlamentets och rådets direktiv 2004/109/EG om harmonisering
    av insynskraven angående upplysningar om emittenter vars värdepapper är upptagna
    till handel på en reglerad marknad, av Europaparlamentets och rådets direktiv
    2003/71/EG om de prospekt som skall offentliggöras när värdepapper erbjuds
    till allmänheten eller tas upp till handel och av kommissionens direktiv 2007/14/EG
    om tillämpningsföreskrifter för vissa bestämmelser i direktiv 2004/109/EG
  type: main
