title:
- language: en
  script: Latn
  content: '79/859/EEC: Commission Decision of 28 September 1979 extending the period
    of application of the systems of authorization for trade in crude oil and/or petroleum
    products between certain Member States provided for by Decisions 79/126/EEC, 79/135/EEC,
    79/397/EEC and 79/548/EEC (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/859/CEE: Décision de la Commission, du 28 septembre 1979, prorogeant
    les systèmes d''autorisation pour les échanges de pétrole brut et/ou de produits
    pétroliers entre certains Etats membres prévus par les décisions 79/126/CEE,
    79/135/CEE, 79/397/CEE et 79/548/CEE (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/859/EWG: Entscheidung der Kommission vom 28. September 1979 zur Verlängerung
    der Geltungsdauer des in den Entscheidungen 79/126/EWG, 79/135/EWG, 79/397/EWG
    und 79/548/EWG vorgesehenen Systems automatisch erteilter Genehmigungen von Ausfuhren
    von Rohöl und/oder Erdölerzeugnissen zwischen verschiedenen Mitgliedstaaten
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/859/EØF: Kommissionens beslutning af 28. september 1979 om forlængelse
    af ordningerne med licenser for samhandelen med mineralolie og/eller mineralolieprodukter
    mellem visse medlemsstater som fastsat i beslutningerne 79/126/EØF, 79/135/EØF,
    79/397/EØF og 79/548/EØF (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/859/CEE: Decisione della Commissione, del 28 settembre 1979, che proroga
    i sistemi di autorizzazione per gli scambi di petrolio greggio e/o di prodotti
    petroliferi fra taluni Stati membri previsti dalle decisioni 79/126/CEE, 79/135/CEE,
    79/397/CEE e 79/548/CEE (I testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/859/EEG: Beschikking van de Commissie van 28 september 1979 tot verlenging
    van de geldigheidsduur van de vergunningstelsels voor het handelsverkeer van ruwe
    aardolie en/of aardolieprodukten tussen bepaalde Lid- Staten, neergelegd in de
    Beschikkingen 79/126/EEG, 79/135/EEG, 79/397/EEG en 79/548/EEG (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
