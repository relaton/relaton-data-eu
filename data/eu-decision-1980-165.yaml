type: standard
title:
- language: en
  script: Latn
  content: '80/165/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof), falling within subheadings 97.03 A and ex B of the
    Common Customs Tariff, originating in South Korea, Japan, Taiwan and Hong Kong
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/165/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exclusion des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées), des sous-positions
    97.03 A et ex B du tarif douanier commun, originaires de la Corée du Sud, du
    Japon, de T''ai-wan et de Hong-kong et mis en libre pratique dans les autres Etats
    membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/165/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Südkorea, Japan, Taiwan und Hongkong
    stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Spielzeuge
    aus Holz und andere (mit Ausnahme der Motor- und Bewegungsmechanismen für Spielzeuge
    und Modelle zum Spielen sowie deren Ersatzteile) der Tarifstellen 97.03 A und
    ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/165/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil), som henhører under pos. 97.03 A og
    ex B i den fælles toldtarif, har oprindelse i Sydkorea, Japan, Taiwan og Hongkong
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/165/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e i meccanismi d''animazione per giocattoli e
    modelli ridotti ed i loro pezzi staccati), della sottovoce 97.03 A e ex B della
    tariffa doganale comune, originari della Corea del Sud, del Giappone, di Taiwan
    e di Hong Kong e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/165/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd speelgoed van hout en andere (met uitzondering
    van animatiemotoren en mechanismen voor speelgoed op schaal alsook hun onderdelen)
    van post 97.03 A en ex B van het gemeenschappelijk douanetarief, van oorsprong
    uit Zuid- Korea, Japan, Taiwan en Hong-Kong en in de overige Lid- Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
