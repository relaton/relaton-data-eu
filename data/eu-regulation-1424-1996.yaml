  content: COMMISSION REGULATION (EC) No 1424/96 of 22 July 1996 determining the extent
    to which the applications for import licences submitted in July 1996 for certain
    dairy products under certain tariff quotas opened by Regulation (EC) No 1600/95
    can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1424/96 DE LA COMMISSION du 22 juillet 1996 déterminant
