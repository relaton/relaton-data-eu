  script: Latn
  content: Council Directive 92/122/EEC of 21 December 1992 authorizing the Hellenic
    Republic to defer liberalization of certain capital movements pursuant to Article
    6 (2) of Directive 88/361/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 92/122/CEE du Conseil, du 21 décembre 1992, autorisant la République
