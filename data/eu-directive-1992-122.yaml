    Artikel 6 Absatz 2 der Richtlinie 88/361/EWG zu verschieben
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/122/EØF af 21. december 1992 om bemyndigelse af Den
    Hellenske Republik til at udskyde liberaliseringen af visse kapitalbevægelser
