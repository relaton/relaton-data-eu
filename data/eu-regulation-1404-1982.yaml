title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1404/82 of 4 June 1982 re-establishing the
    levying of customs duties on paracetamol (INN), falling within subheading 29.25
    B III ex b) and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1404/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables au paracétamol
    (DC I) de la sous-position 29.25 B III ex b) du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1404/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Paracetamol (INN) der Tarifstelle 29.25 B III ex
    b), mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1404/82 af 4. juni 1982 om genindførelse
    af told for paracetamol (INN), henhørende under pos. 29.25 B III ex b) og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1404/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά παρακεταμόλη (DCI) τής
    διακρίσεως 29. 25 B III ex β) τού Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1404/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili al paracetamol (DCI) della
    sottovoce 29.25 B III ex b) della tariffa doganale comune, originario della Cina,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1404/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op paracetamol
    (INN) van postonderverdeling 29.25 B III ex b), van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
