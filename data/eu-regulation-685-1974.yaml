type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 685/74 of the Commission of 27 March 1974 re-establishing
    the levying of customs duties on women's, girls' and infants' undergarments, other
    than of cotton falling within heading No ex 61.04, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3505/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 685/74 de la Commission, du 27 mars 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour femmes, fillettes et jeunes enfants, autres que
    de coton, de la position tarifaire EX 61.04, originaires de la Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3505/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 685/74 der Kommission vom 27. März 1974 zur Wiedereinführung
    des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen, Mädchen und Kleinkinder,
    andere als aus Baumwolle der Tarifnummer ex 61.04, mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3505/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 685/74 af 27. marts 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til kvinder, piger
    og småbørn, undtagen varer af bomuld under position ex 61.04, som har oprindelse
    i Syd-Korea og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 685/74 della Commissione, del 27 marzo 1974, che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti (biancheria da dosso)
    per donna, per ragazza e per bambini, escluse quelle di cotone, della voce doganale
    ex 61.04, originarie della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3505/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 685/74 van de Commissie van 27 maart 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op damesonderkleding,
    meisjesonderkleding en kinderonderkleding, andere dan van katoen, van post ex
    61.04, van oorsprong uit Zuid-Korea ten behoeve waarvan bij Verordening (EEG)
    nr. 3505/73 van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
