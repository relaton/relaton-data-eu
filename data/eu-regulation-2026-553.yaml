    на условията на разрешението за употребата
    на препарат от Weizmannia faecalis DSM 32016 като фуражна
    добавка за всички видове домашни птици, отглеждани
    за угояване, за разплод и за носачки, и декоративни
    птици (притежател на разрешението: Biochem Zusatzstoffe
    Handels- und Produktionsges. mbH)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2026/553 ze dne 13. března 2026,
