    jde o podmínky povolení přípravku Weizmannia faecalis DSM 32016 jako doplňkové
    látky pro výkrm a odchov všech druhů drůbeže a okrasné ptactvo (držitel
    povolení: Biochem Zusatzstoffe Handels- und Produktionsges. mbH)'
