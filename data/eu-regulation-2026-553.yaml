title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/553 of 13 March 2026 amending
    Implementing Regulations (EU) 2020/1755 and (EU) 2024/1054 as regards the terms
    of the authorisation of a preparation of Weizmannia faecalis DSM 32016 as a feed
    additive for all poultry species for fattening, reared for breeding and laying
    and ornamental birds (holder of authorisation: Biochem Zusatzstoffe Handels- und
    Produktionsges. mbH)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/553 de la Commission du 13 mars 2026
    modifiant les règlements d’exécution (UE) 2020/1755 et (UE) 2024/1054 en ce
    qui concerne les conditions d’autorisation d’une préparation de Weizmannia
    faecalis DSM 32016 en tant qu’additif pour l’alimentation de toutes les espèces
    de volailles d’engraissement, élevées pour la reproduction et destinées à
    la ponte et des oiseaux d’ornement (titulaire de l’autorisation: Biochem Zusatzstoffe
    Handels- und Produktionsges. mbH)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/553 der Kommission vom 13. März 2026
    zur Änderung der Durchführungsverordnungen (EU) 2020/1755 und (EU) 2024/1054
    hinsichtlich der Bedingungen für die Zulassung einer Zubereitung aus Weizmannia
    faecalis DSM 32016 als Zusatzstoff in Futtermitteln für alle Mastgeflügelarten,
    Jungtiere von Lege- und Zuchtgeflügelarten sowie Ziervögel (Zulassungsinhaber:
    Biochem Zusatzstoffe Handels- und Produktionsges. mbH)'
  type: main
- language: bg
