    de viandes bovines non désossées détenues par certains organismes d' intervention
    et destinées à être exportées, modifiant le règlement (CEE) n° 1687/76 et
    abrogeant le règlement (CEE) n° 3816/87
  type: main
- language: de
  script: Latn
