    Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur
    Änderung der Verordnung (EWG) Nr. 1687/76 und zur Aufhebung der Verordnung (EWG)
    Nr. 3816/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 160/88 af 20. januar 1988 om salg efter
