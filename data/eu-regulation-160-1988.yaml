  content: Commission Regulation (EEC) No 160/88 of 20 January 1988 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held by
    certain intervention agencies and intended for export, amending Regulation (EEC)
    No 1687/76 and repealing Regulation (EEC) No 3816/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 160/88 de la Commission du 20 janvier 1988 relatif
