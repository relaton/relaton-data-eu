    informacijos apie privataus asmens iš Jungtinės Karalystės privačiam asmeniui
    į Airiją pašto siuntomis, kurioms pagal Tarybos reglamento (EB) Nr. 1186/2009
    25–27 straipsnius taikomas atleidimas nuo importo muitų, siunčiamų prekių
    išleidimą į laisvą apyvartą mainams ir saugojimui leidžiama naudoti neelektronines
    duomenų apdorojimo priemones (pranešta dokumentu Nr. C(2024) 7322)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2740 tal-24
    ta’ Ottubru 2024 li tagħti deroga li tippermetti lill-Irlanda tuża mezzi oħra
    għajr tekniki tal-ipproċessar elettroniku tad-data għall-iskambju u l-ħżin
    ta’ informazzjoni għar-rilaxx fiċ-ċirkolazzjoni libera ta’ oġġetti f’kunsinni
    postali li jibbenifikaw minn eżenzjoni skont l-Artikoli 25 sa 27 tar-Regolament
    (KE) Nru 1186/2009 mibgħuta minn individwu privat fir-Renju Unit lil individwu
    privat fl-Irlanda (notifikata bid-dokument C(2024) 7322)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2024/2740 van de Commissie van 24 oktober 2024
    tot verlening van een afwijking op grond waarvan Ierland andere middelen dan elektronische
    gegevensverwerkingstechnieken mag gebruiken voor de uitwisseling en de opslag
    van informatie voor het in het vrije verkeer brengen van krachtens de artikelen
    25, 26 en 27 van Verordening (EG) nr. 1186/2009 vrijgestelde goederen in postzendingen
    die door een particulier in het Verenigd Koninkrijk naar een particulier in Ierland
    worden verzonden (Kennisgeving geschied onder nummer C(2024) 7322)
  type: main
- language: pl
  script: Latn
