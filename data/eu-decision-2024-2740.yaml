    innych niż techniki elektronicznego przetwarzania danych do wymiany i przechowywania
    informacji w celu dopuszczenia do obrotu towarów w przesyłkach pocztowych korzystających
    ze zwolnienia na mocy art. 25–27 rozporządzenia Rady (WE) nr 1186/2009 wysyłanych
    przez osobę prywatną w Zjednoczonym Królestwie do osoby prywatnej w Irlandii
    (notyfikowana jako dokument nr C(2024) 7322)
  type: main
