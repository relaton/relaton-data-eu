    N:o 1186/2009 25–27 artiklan mukaisissa tullittomissa, Yhdistyneessä kuningaskunnassa
    olevan yksityishenkilön Irlannissa olevalle yksityishenkilölle lähettämissä
    postilähetyksissä olevien tavaroiden vapaaseen liikkeeseen luovutusta koskevien
    tietojen vaihtamiseen ja tallentamiseen muita menetelmiä kuin sähköisiä tietojenkäsittelymenetelmiä
