  content: Decisão de Execução (UE) 2024/2740 da Comissão, de 24 de outubro de
    2024, que concede uma derrogação que autoriza a Irlanda a utilizar outros meios
    que não técnicas de processamento eletrónico de dados para o intercâmbio e
    o armazenamento de informações para a introdução em livre prática de mercadorias
    em remessas postais que beneficiem da franquia nos termos dos artigos 25.o a 27.o
    do Regulamento (CE) n.o 1186/2009 enviadas por um particular no Reino Unido a
    um particular na Irlanda [notificada com o número C(2024) 7322]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/2740 a Comisiei din 24 octombrie
    2024 de acordare a unei derogări care să permită Irlandei să utilizeze alte
    mijloace decât tehnicile de prelucrare electronică a datelor pentru schimbul
    și stocarea de informații în vederea punerii în liberă circulație a mărfurilor
    din trimiterile poștale care beneficiază de scutire în temeiul articolelor
    25-27 din Regulamentul (CE) nr. 1186/2009 expediate de o persoană fizică din
    Regatul Unit unei persoane fizice din Irlanda [notificată cu numărul C(2024)
    7322]
  type: main
