    metodes, informācijas apmaiņai un glabāšanai, lai laistu brīvā apgrozībā
    tādas preces pasta sūtījumos, kurām izmanto atbrīvojumu saskaņā ar Padomes
    Regulas (EK) Nr. 1186/2009 25. līdz 27. pantu un kuras privātpersona Apvienotajā
