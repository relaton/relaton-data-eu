  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2024/2740 ón gCoimisiún an 24 Deireadh
    Fómhair 2024 lena ndeonaítear maolú lena gceadaítear d’Éirinn modhanna
    eile seachas teicnící leictreonacha próiseála sonraí a úsáid chun faisnéis
