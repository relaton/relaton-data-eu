    C(2024) 7322)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2024/2740 оd 24. listopada 2024. o odobravanju
    odstupanja kojim se Irskoj dopušta korištenje sredstava za razmjenu i pohranu
    informacija koja nisu tehnike elektroničke obrade podataka za puštanje u slobodni
    promet robe u poštanskim pošiljkama na koje se primjenjuje oslobođenje u skladu
    s člancima od 25. do 27. Uredbe Vijeća (EZ) br. 1186/2009 koje privatna osoba
    u Ujedinjenoj Kraljevini šalje privatnoj osobi u Irskoj (priopćeno pod brojem
    dokumenta C(2024) 7322)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2740 végrehajtási határozata (2024. október
