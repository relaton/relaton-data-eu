    sa udeľuje výnimka, ktorou sa Írsku povoľuje používať iné prostriedky
    než techniky elektronického spracovania údajov na výmenu a uchovávanie informácií
    pri prepúšťaní tovaru v poštových zásielkach do voľného obehu, na ktorý
    sa vzťahuje oslobodenie podľa článkov 25 až 27 nariadenia (ES) č. 1186/2009
    a ktorý je zasielaný fyzickou osobou v Spojenom kráľovstve fyzickej osobe
    v Írsku [oznámené pod číslom C(2024) 7322]
  type: main
