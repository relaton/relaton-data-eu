  script: Latn
  content: Decisión de Ejecución (UE) 2024/2740 de la Comisión, de 24 de octubre
    de 2024, por la que se concede una excepción que permite a Irlanda utilizar medios
    distintos de las técnicas de tratamiento electrónico de datos para el intercambio
    y almacenamiento de información para el despacho a libre práctica de mercancías
    en envíos postales acogidos a la franquicia prevista en los artículos 25 a 27
    del Reglamento (CE) n.o 1186/2009 del Consejo enviados por un particular en el
    Reino Unido a un particular en Irlanda [notificada con el número C(2024) 7322]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2024/2740 av den 24 oktober 2024
    om beviljande av ett undantag som gör det möjligt för Irland att använda andra
    metoder än elektronisk databehandlingsteknik för utbyte och lagring av uppgifter
    för övergång till fri omsättning av varor i postförsändelser som omfattas
    av befrielse enligt artiklarna 25–27 i rådets förordning (EG) nr 1186/2009
    och som skickas av en privatperson i Förenade kungariket till en privatperson
    i Irland [delgivet med nr C(2024) 7322]
