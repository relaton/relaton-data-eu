    odstopanja, ki Irski dovoljuje uporabo drugih sredstev za izmenjavo in shranjevanje
    informacij, kot so tehnike elektronske obdelave podatkov, za sprostitev blaga
    v poštnih pošiljkah, za katere se uporablja oprostitev iz členov 25 do 27 Uredbe
    Sveta (ES) št. 1186/2009 ter ki jih fizična oseba v Združenem kraljestvu pošlje
    fizični osebi na Irskem, v prosti promet (notificirano pod dokumentarno številko
    C(2024) 7322)
  type: main
