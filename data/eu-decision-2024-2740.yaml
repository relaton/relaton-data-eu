    küldött postai küldeményekben lévő, az 1186/2009/EK rendelet 25–27. cikke
    szerinti vámmentesség alá tartozó áruk szabad forgalomba bocsátásához
    szükséges információcsere és adattárolás céljából az elektronikus adatfeldolgozási
    eljárásoktól eltérő eszközök alkalmazását lehetővé tevő eltérés
    Írország számára történő engedélyezéséről (az értesítés a C(2024)
    7322. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/2740 della Commissione, del 24 ottobre
    2024, relativa alla concessione di una deroga che consente all’Irlanda di utilizzare
    mezzi diversi dai procedimenti informatici per lo scambio e l’archiviazione
    di informazioni ai fini dell’immissione in libera pratica di merci contenute
    in spedizioni postali che beneficiano della franchigia a norma degli articoli
    da 25 a 27 del regolamento (CE) n. 1186/2009 del Consiglio inviate da un privato
    nel Regno Unito a un privato in Irlanda [notificata con il numero C(2024) 7322]
  type: main
- language: lv
  script: Latn
