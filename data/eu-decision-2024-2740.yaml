type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/2740 of 24 October 2024 granting
    a derogation allowing Ireland to use means other than electronic data-processing
    techniques for the exchange and storage of information for the release into free
    circulation of goods in postal consignments availing of relief under Articles
    25 to 27 of Council Regulation (EC) No 1186/2009 sent by a private individual
    in the United Kingdom to a private individual in Ireland (notified under document
    C(2024) 7322)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/2740 de la Commission du 24 octobre
    2024 accordant une dérogation autorisant l’Irlande à utiliser des moyens autres
    que des procédés informatiques de traitement des données pour l’échange
    et le stockage d’informations aux fins de la mise en libre pratique de marchandises
    contenues dans des envois postaux bénéficiant d’une franchise au titre des
    articles 25 à 27 du règlement (CE) no 1186/2009 du Conseil expédiées par un
    particulier au Royaume-Uni à un particulier en Irlande [notifiée sous le numéro
    C(2024) 7322]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/2740 der Kommission vom 24. Oktober 2024
    zur Gewährung einer abweichenden Regelung, die es Irland ermöglicht, andere
    Mittel als solche der elektronischen Datenverarbeitung zum Austausch und zur Speicherung
    von Informationen für die Überführung von Waren in Postsendungen in den freien
    Verkehr zu nutzen, die von Privatpersonen im Vereinigten Königreich an Privatpersonen
    in Irland gerichtet werden und für die die Befreiung gemäß den Artikeln 25
    bis 27 der Verordnung (EG) Nr. 1186/2009 des Rates gilt (Bekannt gegeben unter
    Aktenzeichen C(2024) 7322)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/2740 на Комисията
    от 24 октомври 2024 година за предоставяне на
    дерогация, с която на Ирландия се разрешава
    да използва средства, различни от средствата
    за електронна обработка на данни, за обмена
    и съхранението на информация с цел допускане
    за свободно обращение на стоки в пощенски пратки,
    ползващи се от освобождаване съгласно членове
    25—27 от Регламент (ЕО) № 1186/2009 на Съвета, изпратени
    от частно лице в Обединеното кралство на частно
    лице в Ирландия (нотифицирано под номер С(2024)
    7322)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/2740 ze dne 24. října 2024,
    kterým se stanoví odchylka umožňující Irsku používat pro výměnu a uchovávání
    informací pro propuštění zboží v poštovních zásilkách využívajících
    osvobození podle článků 25 až 27 nařízení Rady (ES) č. 1186/2009 a zasílaných
    soukromou osobou ve Spojeném království soukromé osobě v Irsku do volného
    oběhu jiné způsoby než metody elektronického zpracování dat (oznámeno
    pod číslem C(2024) 7322)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/2740 af 24. oktober 2024
    om indrømmelse af en undtagelse, der giver Irland mulighed for at anvende andre
    midler end elektroniske databehandlingsteknikker til udveksling og lagring af
    oplysninger i forbindelse med overgang til fri omsætning af varer i postforsendelser,
    der er omfattet af fritagelse i henhold til artikel 25-27 i Rådets forordning
    (EF) nr. 1186/2009, og som sendes af en privatperson i Det Forenede Kongerige
    til en privatperson i Irland (meddelt under nummer C(2024) 7322)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/2740 της Επιτροπής,
    της 24ης Οκτωβρίου 2024, για τη χορήγηση παρέκκλισης
    που επιτρέπει στην Ιρλανδία να χρησιμοποιεί
