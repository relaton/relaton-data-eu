title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2262/69 of the Commission of 13 November 1969 amending,
    in respect of Romania, Regulation (EEC) No 1054/68 determining the list of agencies
    certifying the admissibility to certain tariff headings of certain milk products
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2262/69 de la Commission, du 13 novembre 1969, complétant
    en ce qui concerne la Roumanie, le règlement (CEE) n° 1054/68 établissant la
    liste des organismes émetteurs de certificats destinés à permettre l' admission
    de certains produits laitiers en provenance des pays tiers dans certaines positions
    tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2262/69 der Kommission vom 13. November 1969 zur Ergänzung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern in bezug auf Rumänien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2262/69 af 13. november 1969 om supplement
    vedrørende Rumænien, til forordning (EØF) nr. 1054/68 om udarbejdelse af en
    fortegnelse over de organer, der er kompetente til udstedelse af certifikater
    vedrørende visse fra tredjelande udførte mejeriprodukters henførelse til bestemte
    toldpositioner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2262/69 della Commissione, del 13 novembre 1969, che
    completa, per quanto concerne la Romania, il regolamento (CEE) n. 1054/68 che
    stabilisce l' elenco degli organismi emittenti dei certificati destinati a permettere
    l' ammissione in alcune voci tariffarie di alcuni prodotti lattiero-caseari in
    provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2262/69 van de Commissie van 13 november 1969 houdende
    aanvulling, voor wat betreft Roemenië, van Verordening (EEG) nr. 1054/68 houdende
    vaststelling van de lijst van instellingen belast met de afgifte van de certificaten
    welke bestemd zijn om bepaalde zuivelprodukten uit derde landen in te delen in
    bepaalde tariefposten
  type: main
