title:
- language: en
  script: Latn
  content: '80/1257/EEC: Commission Decision of 22 December 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the Kingdom of Belgium of expenditure incurred
    during 1978 on aids and premiums relating to the modernization of farms including
    those in the less-favoured farming areas (Only the French and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1257/CEE: Décision de la Commission, du 22 décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", au Royaume de Belgique des dépenses effectuées pendant
    l''année 1978 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1257/EWG: Entscheidung der Kommission vom 22. Dezember 1980 über die
    Rückvergütung durch den EAGFL, Abteilung Ausrichtung, der im Jahr 1978 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an das Königreich Belgien (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1257/EØF: Kommissionens beslutning af 22. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af udgifter, som er
    afholdt i løbet af året 1978 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, også i ugunstigt stillede områder (Kun den franske og
    nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/1257/CEE: Decisione della Commissione, del 22 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate durante il 1978 per gli aiuti ed i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1257/EEG: Beschikking van de Commissie van 22 december 1980 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België voor
    de in 1978 verrichte uitgaven voor steun en premies met betrekking tot de modernisering
    van landbouwbedrijven waaronder mede begrepen die in probleemgebieden in de landbouw
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
