title:
- language: en
  script: Latn
  content: '2012/677/EU: Commission Implementing Decision of 30 October 2012 allowing
    Member States to extend provisional authorisations granted for the new active
    substances ametoctradin (initially applied for under the development code BAS
    650 F) and disodium phosphonate (notified under document C(2012) 7581)'
  type: main
- language: fr
  script: Latn
  content: '2012/677/UE: Décision d’exécution de la Commission du 30 octobre 2012
    autorisant les États membres à prolonger les autorisations provisoires accordées
    pour les nouvelles substances actives amétoctradine (objet de la demande initiale
    sous le code de développement BAS 650 F) et phosphonate de disodium [notifiée
    sous le numéro C(2012) 7581]'
  type: main
- language: de
  script: Latn
  content: '2012/677/EU: Durchführungsbeschluss der Kommission vom 30. Oktober 2012
    zur Ermächtigung der Mitgliedstaaten, vorläufige Zulassungen in Bezug auf die
    neuen Wirkstoffe Ametoctradin (ursprünglicher Antrag unter Entwicklungscode BAS
    650 F) und Dinatriumphosphonat zu verlängern (Bekanntgegeben unter Aktenzeichen
    C(2012) 7581)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/677/ЕС: Решение за изпълнение на Комисията
    от 30 октомври 2012 година за даване на право на
    държавите членки да удължат срока на временните
    разрешения, издадени за новите активни вещества
    аметоктрадин (първоначалното заявление за
    това вещество е подадено под код на разработката
    BAS 650 F) и динатриев фосфонат (нотифицирано под
    номер C(2012) 7581)'
  type: main
- language: cs
  script: Latn
  content: '2012/677/EU: Prováděcí rozhodnutí Komise ze dne 30. října 2012 ,
    kterým se členským státům umožňuje prodloužit dočasná povolení udělená
    pro nové účinné látky ametoctradin (původní žádost pod vývojovým kódem
    BAS 650 F) a fosforitan disodný (oznámeno pod číslem C(2012) 7581)'
  type: main
- language: da
  script: Latn
  content: '2012/677/EU: Kommissionens gennemførelsesafgørelse af 30. oktober 2012
    om medlemsstaternes forlængelse af midlertidige godkendelser af de nye aktivstoffer
    ametoctradin (der oprindeligt blev ansøgt om under udviklingskode BAS 650 F)
    og dinatriumphosphonat (meddelt under nummer C(2012) 7581)'
  type: main
- language: el
  script: Grek
  content: '2012/677/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 30ής Οκτωβρίου 2012 , που επιτρέπει στα κράτη
    μέλη να παρατείνουν τη διάρκεια των προσωρινών
    αδειών που έχουν χορηγηθεί για τις νέες δραστικές
    ουσίες ametoctradin (για την οποία είχε αρχικά υποβληθεί
    αίτηση με τον αναγνωριστικό κωδικό BAS 650 F) και
    disodium phosphonate [κοινοποιηθείσα υπό τον αριθμό
    C(2012) 7581]'
  type: main
- language: et
  script: Latn
  content: '2012/677/EL: Komisjoni rakendusotsus, 30. oktoober 2012 , millega lubatakse
    liikmesriikidel pikendada uute toimeainete ametoktradiini (algselt taotletud arenduskoodi
    BAS 650 F all) ja dinaatriumfosfonaadi jaoks antud ajutisi kasutuslubasid (teatavaks
    tehtud numbri C(2012) 7581 all)'
  type: main
- language: fi
  script: Latn
