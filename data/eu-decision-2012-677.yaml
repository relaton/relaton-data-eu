    7581. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2012/677/UE: Decisione di esecuzione della Commissione, del 30 ottobre
    2012 , che consente agli Stati membri di prorogare le autorizzazioni provvisorie
