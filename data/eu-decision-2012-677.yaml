    di sviluppo BAS 650 F nella domanda) e fosfonato di di sodio [notificata con il
    numero C(2012) 7581]'
  type: main
- language: lv
  script: Latn
  content: '2012/677/ES: Komisijas Īstenošanas lēmums ( 2012. gada 30. oktobris
