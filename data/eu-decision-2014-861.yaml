    der Vorbereitungskommission der Organisation des Vertrags für das umfassende
    Verbot von Nuklearversuchen zur Stärkung ihrer Überwachungs- und Verifikationsfähigkeiten
    im Rahmen der Umsetzung der Strategie der EU gegen die Verbreitung von Massenvernichtungswaffen
  type: main
- language: bg
  script: Cyrl
