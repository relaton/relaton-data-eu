    o potpori Unije djelatnostima Pripremne komisije Organizacije ugovora o sveobuhvatnoj
    zabrani nuklearnih pokusa radi jačanja njezinih sposobnosti praćenja i provjeravanja
    i u okviru provedbe Strategije EU-a za sprečavanje širenja oružja za masovno
    uništavanje
  type: main
- language: hu
  script: Latn
  content: A Tanács 2014/861/KKBP határozata ( 2014. december 1. ) az Átfogó Atomcsend-szerződés
    Szervezete előkészítő bizottsága által monitoring- és ellenőrzési képességeinek
    megerősítése céljából, valamint a tömegpusztító fegyverek elterjedése
    elleni EU-stratégia intézkedéseinek végrehajtása keretében folytatott tevékenységek
    uniós támogatásáról szóló 2012/699/KKBP határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2014/861/PESC del Consiglio, del 1 °dicembre 2014 , che modifica
    la decisione 2012/699/PESC sul sostegno dell'Unione alle attività della commissione
    preparatoria dell'Organizzazione del trattato sulla messa al bando totale degli
    esperimenti nucleari per il rafforzamento delle sue capacità di monitoraggio
    e di verifica e nell'ambito dell'attuazione della strategia dell'UE contro la
    proliferazione delle armi di distruzione di massa
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2014/861/KĀDP ( 2014. gada 1. decembris ), ar ko groza
    Lēmumu 2012/699/KĀDP par Savienības atbalstu Līguma par kodolizmēģinājumu
    vispārējo aizliegumu organizācijas sagatavošanas komisijas darbībām, lai
    nostiprinātu tās uzraudzības un pārbaudes spējas, kā arī īstenojot ES
    Stratēģiju masu iznīcināšanas ieroču izplatīšanas novēršanai
  type: main
- language: lt
  script: Latn
  content: 2014 m. gruodžio 1 d. Tarybos sprendimas 2014/861/BUSP, kuriuo iš dalies
    keičiamas Sprendimas 2012/699/BUSP dėl Sąjungos paramos Visuotinio branduolinių
    bandymų uždraudimo sutarties organizacijos Parengiamosios komisijos veiklai
    siekiant stiprinti jos stebėsenos bei tikrinimo pajėgumus ir įgyvendinant ES
    kovos su masinio naikinimo ginklų platinimu strategiją
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2014/861/PESK tal- 1 ta' Diċembru 2014 li temenda
    d-Deċiżjoni 2012/699/PESK dwar l-appoġġ tal-Unjoni għall-attivitajiet tal-Kummissjoni
    Preparatorja tal-Organizzazzjoni tat-Trattat dwar il-Projbizzjoni Totali ta' Provi
    Nukleari sabiex issaħħaħ il-kapaċitajiet ta' monitoraġġ u verifika tagħha
    u fil-qafas tal-implimentazzjoni tal-Istrateġija tal-UE kontra l-Proliferazzjoni
    tal-Armi ta' Qerda Massiva
  type: main
- language: nl
  script: Latn
  content: Besluit 2014/861/GBVB van de Raad van 1 december 2014 tot wijziging van
    Besluit 2012/699/GBVB betreffende de ondersteuning door de Unie van de activiteiten
    van de voorbereidende commissie van de Verdragsorganisatie voor een alomvattend
    verbod op kernproeven ter versterking van haar toezichts- en verificatiecapaciteit
    en in het kader van de uitvoering van de strategie van de Unie tegen de verspreiding
    van massavernietigingswapens
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2014/861/WPZiB z dnia 1 grudnia 2014 r. zmieniająca decyzję
    2012/699/WPZiB w sprawie wspierania przez Unię działań komisji przygotowawczej
    Organizacji do spraw Traktatu o Całkowitym Zakazie Prób Jądrowych w celu zwiększenia
    jej zdolności monitorowania i kontroli oraz w ramach realizacji strategii UE
    przeciw rozprzestrzenianiu broni masowego rażenia
  type: main
- language: pt
  script: Latn
  content: Decisão 2014/861/PESC do Conselho, de 1 de dezembro de 2014 , que altera
    a Decisão 2012/699/PESC, relativa ao apoio da União às atividades da Comissão
    Preparatória da Organização do Tratado de Proibição Total de Ensaios Nucleares,
    a fim de reforçar as suas capacidades de vigilância e verificação e no âmbito
    da execução da Estratégia da UE contra a Proliferação de Armas de Destruição
    Maciça
  type: main
- language: ro
  script: Latn
  content: Decizia 2014/861/PESC a Consiliului din 1 decembrie 2014 de modificare
    a Deciziei 2012/699/PESC privind susținerea de către Uniune a activităților
    comisiei pregătitoare a Organizației Tratatului de interzicere totală a experiențelor
    nucleare în vederea consolidării capacităților acesteia de monitorizare și
    verificare și în cadrul punerii în aplicare a Strategiei UE împotriva proliferării
    armelor de distrugere în masă
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2014/861/SZBP z 1. decembra 2014 , ktorým sa mení rozhodnutie
    2012/699/SZBP o podpore Únie pre činnosti prípravnej komisie Organizácie Zmluvy
    o všeobecnom zákaze jadrových skúšok s cieľom posilniť jej monitorovacie
    a overovacie spôsobilosti a v rámci vykonávania stratégie EÚ proti šíreniu
    zbraní hromadného ničenia
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2014/861/SZVP z dne 1. decembra 2014 o spremembi Sklepa 2012/699/SZVP
    o podpori Unije dejavnostim Pripravljalne komisije Organizacije pogodbe o celoviti
    prepovedi jedrskih poskusov za okrepitev njenih zmogljivosti opazovanja in preverjanja
    ter v okviru izvajanja Strategije EU proti širjenju orožja za množično uničevanje
  type: main
- language: es
  script: Latn
  content: Decisión 2014/861/PESC del Consejo, de 1 de diciembre de 2014 , por la
    que se modifica la Decisión 2012/699/PESC relativa al apoyo de la Unión a las
    actividades de la Comisión Preparatoria de la Organización del Tratado de Prohibición
    Completa de los Ensayos Nucleares con objeto de reforzar sus capacidades de observación
    y verificación, en el marco de la ejecución de la Estrategia de la UE contra
    la proliferación de armas de destrucción masiva
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2014/861/Gusp av den 1 december 2014 om ändring av beslut
    2012/699/Gusp om unionens stöd för den verksamhet som bedrivs av den förberedande
    kommissionen för organisationen för fördraget om fullständigt förbud mot
    kärnsprängningar i syfte att stärka dess övervaknings- och kontrollkapacitet
    och inom ramen för genomförandet av EU:s strategi mot spridning av massförstörelsevapen
