title:
- language: en
  script: Latn
  content: Council Decision 2014/861/CFSP of 1 December 2014 amending Decision 2012/699/CFSP
    on the Union support for the activities of the Preparatory Commission of the Comprehensive
    Nuclear-Test-Ban Treaty Organisation in order to strengthen its monitoring and
    verification capabilities and in the framework of the implementation of the EU
    Strategy against Proliferation of Weapons of Mass Destruction
  type: main
- language: fr
  script: Latn
  content: Décision 2014/861/PESC du Conseil du 1 er décembre 2014 modifiant la
    décision 2012/699/PESC concernant le soutien de l'Union aux activités de la
    commission préparatoire de l'Organisation du traité d'interdiction complète
    des essais nucléaires, afin de renforcer ses capacités en matière de surveillance
    et de vérification, dans le cadre de la mise en œuvre de la stratégie de l'Union
    européenne contre la prolifération des armes de destruction massive
  type: main
- language: de
  script: Latn
  content: Beschluss 2014/861/GASP des Rates vom 1. Dezember 2014 zur Änderung des
