title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2355/84 of 13 August 1984 re-establishing
    the levying of customs duties on other clocks, falling within heading No 91.04
    and originating in Hong Kong, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2355/84 de la Commission du 13 août 1984 portant rétablissement
    de la perception des droits de douane applicables aux horloges, pendules, réveils
    et appareils d' horlogerie similaires à mouvement autre que de montre, de la
    position 91.04 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2355/84 der Kommission vom 13. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Uhren der Tarifnummer 91.04 mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2355/84 af 13. august 1984 om genindførelse
    af opkrævning af told for andre ure, henhørende under pos. 91.04 og med oprindelse
    i Hongkong, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2355/84 της Επιτροπής
    της 13ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα ωρολόγια μεγάλα,
    εκκρεμή, εγερτήρια και παρόμοιες συσκευές
    ωρολογοποιίας με μηχανισμό διάφορο του των
    ωρολογίων θυλακίου της κλάσεως 91.04 του Κοινού
    Δασμολογίου, καταγωγής Χονγκ Κονγκ, δικαιούχου
    των προβλεπόμενων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2355/84 della Commissione del 13 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli orologi, pendole, sveglie e
    simili apparecchi di orologeria, con movimento diverso da quello degli orologi
    tascabili, della voce 91.04 della tariffa doganale comune, originari di Hong Kong,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2355/84 van de Commissie van 13 augustus 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokken, pendules,
    wekkers en dergelijke artikelen met ander uurwerk dan horloge-uurwerk, van tariefpost
    91.04, van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3569/83
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
