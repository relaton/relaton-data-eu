title:
- language: en
  script: Latn
  content: '79/262/EEC: Commission Decision of 22 February 1979 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''woven
    overcoats, raincoats and other coats, cloaks and capes, jackets and blazers, other
    than garments of category 15 A, of wool, of cotton or of man-made textile fibres,
    falling within subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.02-31, 32, 33, 35, 36, 37, 39, 40) (category 15 B), originating in Yugoslavia
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/262/CEE: Décision de la Commission, du 22 février 1979, autorisant
    la République française à exclure du traitement communautaire les manteaux,
    imperméables (y compris les capes) et vestes, tissés, pour femmes, fillettes
    et jeunes enfants, autres que les vêtements de la catégorie 15 A, de laine,
    de coton ou de fibres textiles synthétiques ou artificielles, de la sous- position
    ex 61.02 B du tarif douanier commun (codes Nimexe: 61.02-31, 32, 33, 35, 36, 37,
    39, 40) catégorie 15 B, originaires de la Yougoslavie et mis en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/262/EWG: Entscheidung der Kommission vom 22. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus Jugoslawien stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und
    Jacken aus Geweben, für Frauen, Mädchen und Kleinkinder, andere als Kleidung
    der Kategorie 15 A, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern:
    61.02-31; 32; 33; 35; 36; 37; 39; 40) (Kategorie 15 B) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/262/EØF: Kommissionens beslutning af 22. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage frakker, kapper
    og slag, jakker og blazere, vævede, til kvinder, piger og småbørn, andre end
    de under kategori 15 A hørende varer af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.02- 31, 32, 33,
    35, 36, 37, 39, 40) kategori 15 B, har oprindelse i Jugoslavien og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/262/CEE: Decisione della Commissione, del 22 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i cappotti, soprabiti,
    mantelli, e simili, e giacche, tessuti, per donna, per ragazza e per bambini,
    diversi dagli indumenti della categoria 15 A, di lana, di cotone o di fibre tessili
    sintetiche o artificiali, della sottovoce ex 61.02 B della tariffa doganale comune
    (codice Nimexe: 61.02-31, 32, 33, 35, 36, 37, 39, 40), categoria 15 B, originari
    della Iugoslavia e messi in libera pratica negli altri Stati membri (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/262/EEG: Beschikking van de Commissie van 22 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd mantels, regenjassen en andere jassen, capes,
    blazers en jasjes, geweven, andere dan de kledingstukken van categorie 15 A, van
    wol, van katoen of van synthetische of van kunstmatige textielvezels, van post
    ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.02-31, 32, 33,
    35, 36, 37, 39, 40) (categorie 15 B), van oorsprong uit Joegoslavië en in de
    overige Lid- Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
