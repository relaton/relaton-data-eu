title:
- language: en
  script: Latn
  content: Commission Decision of 19 June 1974 amending Commission Decision No 74/133/EEC
    of 14 February 1974 on the application by the United Kingdom of Great Britain
    and Northern Ireland of protective measures in respect of certain iron and steel
    products in Chapter 73 of the Common Customs Tariff, under Article 135 of the
    Act concerning the conditions of accession and the adjustments to the Treaties
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 juin 1974, portant modification de la
    décision de la Commission n° 74/133/CEE, du 14 février 1974, relative à l'application
    par le Royaume-Uni de Grande-Bretagne et d'Irlande du Nord de mesures de sauvegarde
    pour certains produits sidérurgiques, du chapitre 73 du Tarif douanier commun,
    au titre de l'article 135 de l'Acte relatif aux conditions d'adhésion et d'adaptation
    des Traités
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Juni 1974 zur Änderung der Entscheidung
    der Kommission 74/133/EWG vom 14. Februar 1974 über die Anwendung von Schutzmaßnahmen
    für bestimmte unter Kapitel 73 des Gemeinsamen Zolltarifs fallende Stahlerzeugnisse
    durch das Vereinigte Königreich Großbritannien und Nordirland gemäß Artikel
    135 der Akte über die Beitrittsbedingungen und die Anpassungen der Verträge
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. juni 1974 om ændring af Kommissionens
    beslutning nr. 74/133/EØF af 14. februar 1974 vedrørende Det forenede Kongerige
    og Nordirlands anvendelse af beskyttelsesforanstaltninger for visse stålprodukter
    i kapitel 73 i den fælles toldtarif i henhold til artikel 135 i akten om tiltrædelsesvilkårene
    og tilpasningerne af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 giugno 1974, che modifica la decisione
    della Commissione n. 74/133/CEE del 14 febbraio 1974, relativa all'applicazione
    da parte del Regno Unito di Gran Bretagna e Irlanda del Nord di misure di salvaguardia
    per taluni prodotti siderurgici, del capitolo 73 della tariffa doganale comune,
    a norma dell'articolo 135 dell'atto relativo alle condizioni di adesione e agli
    adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 juni 1974 houdende wijziging van haar
    Beschikking nr. 74/133/EEG van 14 februari 1974 betreffende de toepassing door
    het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland van beschermende
    maatregelen voor bepaalde ijzer- en staalprodukten uit hoofdstuk 73 van het gemeenschappelijk
    douanetarief, krachtens artikel 135 van de Akte inzake de toetredingsvoorwaarden
    en de aanpassing der Verdragen
