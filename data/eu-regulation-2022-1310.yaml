- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1310 of 26 July 2022 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2020/1408 on imports of certain hot rolled
    stainless steel sheets and coils originating in Indonesia by imports of certain
    hot rolled stainless steel sheets and coils consigned from Turkey, whether declared
    as originating in Turkey or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1310 de la Commission du 26 juillet
    2022 ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées parle règlement d’exécution (UE) 2020/1408 sur les importations
    de certains produits laminés à chaud plats en aciers inoxydables, enroulés
    ou en feuilles, originaires d’Indonésie par des importations de certains produits
    laminés à chaud plats en aciers inoxydables, enroulés ou en feuilles, expédiés
    de Turquie, qu’ils aient ou non été déclarés originaires de ce pays, et
    soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1310 der Kommission vom 26. Juli 2022
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2020/1408 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter warmgewalzter Flacherzeugnisse aus nicht rostendem
    Stahl in Tafeln oder Rollen (Coils) mit Ursprung in Indonesien durch aus der Türkei
    versandte Einfuhren bestimmter warmgewalzter Flacherzeugnisse aus nicht rostendem
    Stahl in Tafeln oder Rollen (Coils), ob als Ursprungserzeugnisse der Türkei angemeldet
    oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
