    for sukker efter de nye medlemsstaters tiltrædelse fungerer bedst muligt
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 223/73 del Consiglio, del 31 gennaio 1973, che adotta
    le norme generali per garantire il buon funzionamento dell' organizzazione comune
    dei mercati nel settore dello zucchero in seguito all' adesione dei nuovi Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 223/73 van de Raad van 31 januari 1973 houdende vaststelling
