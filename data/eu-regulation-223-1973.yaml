  content: Regulation (EEC) No 223/73 of the Council of 31 January 1973 laying down
    general rules to ensure the proper functioning of the common organization of the
    market in sugar following the Accession of the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 223/73 du Conseil, du 31 janvier 1973, arrêtant les
    règles générales en vue d' assurer le bon fonctionnement de l' organisation
    commune des marchés du sucre à la suite de l' adhésion des nouveaux États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 223/73 des Rates vom 31. Januar 1973 zur Aufstellung
    allgemeiner Regeln, die das gute Funktionieren der gemeinsamen Marktorganisation
    für Zucker im Anschluß an den Beitritt der neuen Mitgliedstaaten gewährleisten
    sollen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 223/73 af 31. januar 1973 om fastsættelse
