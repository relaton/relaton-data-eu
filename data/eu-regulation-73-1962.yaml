title:
- language: fr
  script: Latn
  content: Règlement n° 73 de la Commission portant fixation du montant des prélèvements
    pour les oeufs dépourvus de leur coquille et les jaunes d'oeufs de volaille de
    basse-cour, propres à des usages alimentaires, frais, conservés, séchés ou
    sucrés
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 73 der Kommission über die Festsetzung der Abschöpfungsbeträge
    für Eier ohne Schale und Eigelb, von Hausgeflügel, genießbar, frisch, haltbar
    gemacht, getrocknet oder gezuckert
  type: main
- language: it
  script: Latn
  content: Regolamento n. 73 della Commissione relativo alla fissazione dell'ammontare
    del prelievo per le uova sgusciate e del giallo d'uova di volatili da cortile,
    atti ad usi alimentari, freschi, conservati, essiccati o con aggiunta di zuccheri
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 73 van de Commissie betreffende de vaststelling van het
    bedrag der heffingen op eieren uit de schaal en eigeel, van pluimvee, geschikt
    voor menselijke consumptie, vers, verduurzaamd, gedroogd of met toegevoegde suiker
