type: standard
title:
- language: en
  script: Latn
  content: '80/303/EEC: Commission Decision of 25 February 1980 authorizing the United
    Kingdom to permit temporarily the marketing of seed of specific varieties of rye,
    chiefly intended for use as fodder, which do not satisfy the conditions of Directive
    66/402/EEC (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/303/CEE: Décision de la Commission, du 25 février 1980, autorisant
    le Royaume-Uni à admettre temporairement la commercialisation de semences de
    variétés déterminées de seigle destinées essentiellement à des fins fourragères,
    qui ne répondent pas aux conditions de la directive 66/402/CEE (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/303/EWG: Entscheidung der Kommission vom 25. Februar 1980 zur Ermächtigung
    des Vereinigten Königreichs, zeitweise Saatgut, das die Anforderungen der Richtlinie
    66/402/EWG nicht erfüllt, von bestimmten Sorten von Roggen, die überwiegend
    zu Futterzwecken bestimmt sind, zum Verkehr zuzulassen (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/303/EØF: Kommissionens beslutning af 25. februar 1980 om bemyndigelse
    af Det forenede Kongerige til midlertidigt at forhandle sædekorn af visse rugsorter,
    der hovedsagelig er bestemt til foderbrug, og som ikke opfylder betingelserne
    i direktiv 66/402/EØF (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/303/ΕΟΚ : Απόφαση της Επιτροπής, της 25ης
    Φεβρουαρίου 1980, με την οποία επιτρέπεται στο
    Ηνωμένο Βασίλειο να αποδεχθεί προσωρινά την
    εμπορία σπόρων καθορισμένων ποικιλιών σίκαλης
    που προορίζονται κυρίως για ζωοτροφές και
    που δεν ανταποκρίνονται στους όρους που θέτει
    η Οδηγία 66/402/ΕΟΚ (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/303/CEE: Decisione della Commissione, del 25 febbraio 1980, che autorizza
    il Regno Unito ad ammettere temporaneamente la commercializzazione di sementi
    di segale di varietà determinate, destinate soprattutto all''utilizzazione foraggera,
    che non soddisfano alle condizioni della direttiva 66/402/CEE (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/303/EEG: Beschikking van de Commissie van 25 februari 1980 tot machtiging
    van het Verenigd Koninkrijk om tijdelijk zaaizaad van sommige vooral voor voederdoeleinden
    bestemde rassen van rogge, dat niet voldoet aan de eisen van Richtlijn 66/402/EEG,
    tot de handel toe te laten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
