type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 20 September 1978 authorizing Ireland not to apply
    Community treatment to outer garments and other articles, knitted or crocheted,
    not elastic or rubberized; outer garments and clothing accessories; jerseys, pullovers,
    slip-overs; twinsets, cardigans, bed-jackets and jumpers, knitted or crocheted,
    not elastic or rubberized, of wool, of cotton or of man-made textile fibres, falling
    within subheading ex 60.05 A of the Common Customs Tariff (NIMEXE codes 60.05-01,
    27, 28, 29, 30, 33, 36, 37, 38), originating in Macao and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/818/CEE: Décision de la Commission, du 20 septembre 1978, autorisant
    l''Irlande à exclure du traitement communautaire les vêtements de dessus, accessoires
    du vêtement et autres articles de bonneterie non élastique ni caoutchoutée,
    chandails, "pullovers", "slip-overs", "twinsets", gilets et vestes de bonneterie
    non élastique ni caoutchoutée de laine, de coton, de fibres textiles synthétiques
    ou artificielles de la sous-position Ex 60.05 A du Tarif douanier commun (codes
    Nimexe : 60.05- 01; 27; 28; 29; 30; 33; 36; 37; 38), originaires de Macao et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. September 1978, mit der Irland ermächtigt
    wird, aus Macau stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Oberkleidung, Bekleidungszubehör und andere Wirkwaren, weder gummielastisch
    noch kautschutiert, Oberkleidung und Bekleidungszubehör, Pullover, Slipover und
    dergleichen aus Gewirken aus Wolle, Baumwolle, synthetischen oder künstlichen
    Spinnstoffen (weder gummielastisch noch kautschutiert), der Tarifstelle ex 60.05
    A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-01, 27, 28, 29, 30, 33,
    36, 37, 38) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 20. september 1978 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage yderbeklædningsgenstande og andre varer
    af trikotage, ikke elastisk eller gummeret, yderbeklædningsgenstande og tilbehør
    til beklædningsgenstande: sweatere, pullovere, slipovere, cardigansæt, veste
    og trøjer af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 60.05 A i den fælles toldtarif (NIMEXE-kode 60.05-01, 27, 28, 29,
    30, 33, 36, 37, 38), har oprindelse i Macao og frit kan omsættes i de øvrige
    medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 settembre 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario indumenti esterni, accessori di abbigliamento
    ed altri manufatti a maglia non elastica né gommata, indumenti esterni ed accessori
    di abbigliamento, maglie, pullover, slip-over, twinset, giubbotti, giacche e bluse
    a maglia non elastica né gommata, di lana, di cotone o di fibre sintetiche o
    artificiali, della sottovoce ex 60.05 A della tariffa doganale comune (codice
    Nimexe 60.05-01; 27; 28; 29; 30; 33; 36; 37; 38), originari di Macao e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 september 1978 waarbij Ierland wordt
    gemachtigd bovenkleding, kledingtoebehoren en andere artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, bovenkleding en kledingtoebehoren, truien,
    jumpers, pullovers en slip-overs, twinsets, vesten en jasjes van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels, van post ex 60.05 A van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.05-01, 27, 28, 29, 30, 33, 36, 37, 38), van oorsprong
    uit Macao en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
