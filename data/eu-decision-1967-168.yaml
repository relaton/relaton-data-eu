title:
- language: fr
  script: Latn
  content: Décision 67/168/CEE de la Commission, du 22 février 1967, autorisant
    la République française, en vertu de l'article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire "les chaussures à semelles extérieures en
    caoutchouc et à dessus en autres matières", de la position n° 64.02 Ex B du
    Tarif douanier commun, originaires de Tchécoslovaquie et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/168/EWG: Entscheidung der Kommission vom 22. Februar 1967, mit der
    die Französische Republik auf Grund von Artikel 115 Absatz (1) des Vertrages
    ermächtigt wird, aus der Tschechoslowakei stammende und in anderen Mitgliedstaaten
    im freien Verkehr befindliche "Schuhe mit Laufsohlen aus Kautschuk und Oberteil
    aus anderen Stoffen" der Tarifnummer 64.02 ex B des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/168/CEE: Decisione della Commissione, del 22 febbraio 1967, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, paragrafo 1, del Trattato,
    ad escludere dal trattamento comunitario «le calzature con suole esterne di gomma
    e con tomaie di altre materie» della voce n. 64.02 ex B della TDC, originari
    della Cecoslovacchia e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/168/EEG: Beschikking van de Commissie van 22 februari 1967 waarbij
    de Franse Republiek wordt gemachtigd om, op grond van artikel 115, eerste alinea,
    van het Verdrag, schoeisel met buitenzool van rubber en bovendeel van andere stoffen,
    van post 64.02 ex B van het gemeenschappelijk douanetarief, van oorsprong uit
    Tsjechoslowakije en in andere Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
