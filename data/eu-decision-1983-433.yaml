title:
- language: en
  script: Latn
  content: '83/433/EEC: Commission Decision of 5 August 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain products
    originating in third countries which have been put into free circulation in the
    Community (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/433/CEE: Décision de la Commission du 5 août 1983 autorisant la République
    française à procéder à une surveillance intracommunautaire des importations
    de certains produits originaires de pays tiers et mis en libre pratique dans la
    Communauté (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/433/EWG: Entscheidung der Kommission vom 5. August 1983 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/433/EØF: Kommissionens beslutning af 5. august 1983 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse produkter med oprindelse i tredjelande til fri omsætning i Fællesskabet
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/433/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Αυγούστου
    1983 περί χορηγήσεως αδείας στη Γαλλική Δημοκρατία
    να προβεί σε ενδοκοινοτική επιτήρηση των εισαγωγών
    ορισμένων προϊόντων, καταγωγής τρίτων χωρών,
    τα οποία τίθενται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/433/CEE: Decisione della Commissione del 5 agosto 1983 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti originari di paesi terzi e messi in libera pratica nella Comunità
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/433/EEG: Beschikking van de Commissie van 5 augustus 1983 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde produkten van oorsprong uit derde landen,
    die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst in
    de Franse taal is authentiek)'
