title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2214/83 of 2 August 1983 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    products of category 10 (code 0100) and originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2214/83 de la Commission du 2 août 1983 portant rétablissement
    de la perception des droits de douane applicables à la ganterie de bonneterie,
    de la catégorie de produits 10 (code 0100), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2214/83 der Kommission vom 2. August 1983 über die
    Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken der Warenkategorie
    Nr. 10 (Kennziffer 0100), mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2214/83 af 2. august 1983 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, under
    kategori nr. 10 (kode 0100), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2214/83 της Επιτροπής
    της 2ας Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για χειρόκτια
    πλεκτά, προϊόντα της κατηγορίας 10 (κωδικός
    0100), καταγωγής Ταϋλάνδης, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2214/83 della Commissione del 2 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai guanti a maglia della categoria
    di prodotti n. 10 (codice 0100), originari della Tailandia, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2214/83 van de Commissie van 2 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van de categorie van produkten nr. 10 (codenummer
    0100), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
