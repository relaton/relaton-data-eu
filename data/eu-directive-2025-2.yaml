    e à supervisão de grupos e transfronteiriça, e que altera as Diretivas 2002/87/CE
    e 2013/34/UE
  type: main
- language: ro
  script: Latn
  content: Directiva (UE) 2025/2 a Parlamentului European și a Consiliului din 27
