  content: Commission Regulation (EEC) No 3744/91 of 18 December 1991 laying down
    detailed rules for the application of import arrangements provided for in Council
    Regulation (EEC) No 3670/91 for frozen thin skirt of bovine animals
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3744/91 DE LA COMMISSION du 18 décembre 1991 établissant
    les modalités d'' application du régime d'' importation prévu par le règlement
    (CEE) no 3670/91 du Conseil pour la hampe congelée de l'' espèce bovine #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3744/91 DER KOMMISSION vom 18. Dezember 1991 über
    Durchführungsbestimmungen zu der Einfuhrregelung gemäß der Verordnung (EWG)
    Nr. 3670/91 des Rates für gefrorenes Saumfleisch von Rindern #'
  type: main
- language: da
  script: Latn
