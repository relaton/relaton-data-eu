title:
- language: en
  script: Latn
  content: '92/35/EEC: Commission Decision of 11 June 1991 requiring France to suspend
    the implementation of the aid described below in favour of the Pari Mutuel Urbain
    (PMU), introduced in breach of Article 93 (3) of the EEC Treaty (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/35/CEE: Décision de la Commission, du 11 juin 1991, demandant au gouvernement
    français de suspendre les aides décrites ci-dessous et qu''il a octroyées au
    Pari mutuel urbain (PMU), et mises en vigueur en violation de l''article 93 paragraphe
    3 du traité CEE (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/35/EWG: Entscheidung der Kommission vom 11. Juni 1991 mit der Frankreich
    aufgefordert wird, die nachstehend beschriebenen Beihilfen, die sie der Firma
    Pari Mutuel Urbain (P.M.U.) unter Verstoß gegen Artikel 93 Absatz 3 EWG-Vertrag
    gewährt hat, auszusetzen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/35/EØF: Kommissionens beslutning af 11. juni 1991 om anmodning til
    den franske regering om at suspendere nedennævnte støtte, som regeringen har
    ydet Pari Mutuel Urbain (PMU) og gennemført i strid med EØF-Traktatens artikel
    93, stk. 3 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/35/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Ιουνίου
    1991 με την οποία ζητείται από τη γαλλική κυβέρνηση
    να αναστείλει την εφαρμογή των κατωτέρω περιγραφόμενων
    ενισχύσεων υπέρ του Par Mutuel Urbain (PMU), οι οποίες
    χορηγήθηκαν κατά παράβαση του άρθρου 93, παράγραφος
    3, της Συνθήκης ΕΟΚ (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '92/35/CEE: Decisione della Commissione, dell''11 giugno 1991 che ingiunge
    al governo francese di sospendere il versamento a favore di Pari Mutuel Urbain
    (PMU) degli aiuti definiti in appresso cui ha dato esecuzione in violazione dell''articolo
    93, paragrafo 3 del trattato CEE (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '92/35/EEG: Beschikking van de Commissie van 11 juni 1991 waarmee van de
    Franse Regering de opschorting wordt verlangd van de tenuitvoerlegging van de
    hieronder beschreven steunmaatregelen ten gunste van de Pari Mutuel Urbain (PMU)
    die in strijd met artikel 93, lid 3, van het EEG-Verdrag zijn verleend (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/35/CEE: Decisão da Comissão, de 11 de Junho de 1991, que exige do
    Estado francês a suspensão da concessão dos auxílios subsequentemente referidos
    a favor do Pari Mutuel Urbain (PMU), introduzidos em violação do disposto no
    n° 3 do artigo 93º do Tratado CEE (Apenas faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '92/35/CEE: Decisión de la Comisión, de 11 de junio de 1991, por la que
    se requiere al Gobierno francés para que suspenda las ayudas que se describen
    a continuación en beneficio de Pari Mutuel Urbain (PMU), cuya concesión infringe
    lo dispuesto en el apartado 3 del artículo 93 del Tratado CEE (El texto en lengua
    francesa es el único auténtico)'
