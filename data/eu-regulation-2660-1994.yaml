    κανονισμού (ΕΚ) αριθ. 675/94 περί λεπτομερών κανόνων
    εφαρμογής των κανονισμών (ΕΚ) αριθ. 3640/93 και
    (ΕΚ) αριθ. 3670/93 του Συμβουλίου όσον αφορά τα
