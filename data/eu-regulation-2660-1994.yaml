  content: Commission Regulation (EC) No 2660/94 of 31 October 1994 amending Regulation
    (EC) No 675/94 laying down detailed rules for the application of Council Regulations
    (EC) No 3640/93 and (EC) No 3670/93 as regards the special arrangements for imports
    of maize and sorghum into Spain and of maize into Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2660/94 de la Commission du 31 octobre 1994 modifiant
