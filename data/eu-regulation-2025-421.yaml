- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/421 of 16 December 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the data necessary for the classification
    of crypto-asset white papers and the practical arrangements to ensure that such
    data is machine-readable
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/421 de la Commission du 16 décembre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les données nécessaires
    au classement des livres blancs sur les crypto-actifs et les modalités pratiques
    visant à garantir que ces données sont lisibles par machine
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/421 der Kommission vom 16. Dezember 2024
