title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 4108/87 of 22 December 1987 opening and providing
    for the administration of a Community tariff quota for boysenberries, preserved
    by freezing, not containing added sugar, intended for any form of processing except
    for the manufacture of jam entirely from boysenberries, falling within subheading
    ex 0811 90 90 of the combined nomenclature (1988)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4108/87 du Conseil du 22 décembre 1987 portant ouverture
    et mode de gestion d' un contingent tarifaire communautaire pour des "boysenberries",
    congelées, sans addition de sucre, destinées à toute transformation, à l'
    exception de la fabrication de confiture entièrement de "boysenberries", relevant
    du code ex 0811 90 90 de la nomenclature combinée (1988)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4108/87 des Rates vom 22. Dezember 1987 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für Boysenbeeren,
    gefroren, ohne Zusatz von Zucker, für jegliche Verarbeitung, ausgenommen zum
    Herstellen von vollständig aus Boysenbeeren bestehender Konfitüre, der Codenummer
    ex 0811 90 90 der Kombinierten Nomenklatur (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4108/87 af 22. december 1987 om åbning og
    forvaltning af et fællesskabstoldkontingent for boysenbær, frosne, ikke tilsat
    sukker, bestemt til al slags forarbejdning med undtagelse af fremstilling af marmelade
    udelukkende af boysenbær, henhørende under pos. ex 0811 90 90 i Den Kombinerede
    Nomenklatur (1988)
  type: main
- language: el
  script: Grek
