title:
- language: fr
  script: Latn
  content: Décision 65/217/CEE de la Commission, du 31 mars 1965, portant prorogation
    et nouvelle modification de sa décision du 10 novembre 1964 autorisant la perception
    de taxes compensatoires à l'importation, dans la République italienne, de dextrines
    fabriqués à partir de la fécule de pommes de terre, de fécules de pommes de
    terre solubles ou torréfiées, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '65/217/EWG: Entscheidung der Kommission vom 31. März 1965 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 10. November 1964 über die Erhebung
    von Ausgleichsabgaben auf Einfuhren von Dextrin auf der Grundlage von Kartoffelstärke,
    löslicher oder gerösteter Kartoffelstärke, aus verschiedenen Mitgliedstaaten
    in die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '65/217/CEE: Decisione della Commissione, del 31 marzo 1965, che proroga
    e modifica nuovamente la decisione del 10 novembre 1964, che autorizza la riscossione
    di tasse di compensazione all''importazione nella Repubblica italiana di destrine
    fabbricate con fecola di palate, di fecole di patate solubili o torrefalle, provenienti
    da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/217/EEG: Beschikking van de Commissie van 31 maart 1965 tot verlenging
    en nieuwe wijziging van haar beschikking van 10 november 1964 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Italiaanse Republiek
    van dextrine vervaardigd uit aardappelzetmeel, oplosbaar of geroost aardappelzetmeel,
    uit bepaalde Lid-Staten'
  type: main
