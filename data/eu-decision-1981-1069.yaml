    of the United Kingdom (Wales, north-west of England, north of England, Scotland,
    south-west of England, Yorkshire and Humberside and Northern Ireland) (Only the
    English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/1069/CEE: Décision de la Commission, du 22 décembre 1981, modifiant
    les décisions de la Commission des 31 décembre 1980, 26 janvier 1981 et 18 mars
    1981 octroyant une assistance financière dans le cadre des mesures supplémentaires
    instituées en faveur du Royaume-Uni (pays de Galles, nord-ouest de l''Angleterre,
    nord de l''Angleterre, Écosse, sud-ouest de l''Angleterre, Yorkshire et Humberside
