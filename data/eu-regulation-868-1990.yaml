title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 868/90 of 2 April 1990 imposing a definitive
    anti-dumping duty on imports of certain welded tubes, of iron or non-alloy steel,
    originating in Yugoslavia and Romania and definitively collecting the provisional
    anti-dumping duties imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 868/90 du Conseil du 2 avril 1990 instituant un droit
    antidumping définitif sur les importations de certains tubes soudés, en fer
    ou en aciers non alliés, originaires de Yougoslavie et de Roumanie et portant
    perception définitive du droit antidumping provisoire imposé sur ces importations
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 868/90 DES RATES vom 2. April 1990 zur Einfuehrung
    eines endgueltigen Antidumpingzolls auf die Einfuhren bestimmter geschweisster
    Rohre aus Eisen oder nichtlegiertem Stahl mit Ursprung in Jugoslawien und in Rumaenien
    und zur endgueltigen Vereinnahmung der vorlaeufigen Antidumpingzoelle auf diese
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 868/90 af 2. april 1990 om indførelse af
    en endelig antidumpingtold på importen af visse svejsede rør af jern eller ulegeret
    stål, med oprindelse i Jugoslavien og Rumænien, og om endelig opkrævning af
    den midlertidige antidumpingtold på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 868/90 του Συμβουλίου
    της 2ας Απριλίου 1990 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    συγκολλητών σωλήνων από σίδηρο ή μη κεκραμένο
    χάλυβα, καταγωγής Γιουγκοσλαβίας και Ρουμανίας,
    και για την οριστική είσπραξη των προσωρινών
    δασμών αντιντάμπινγκ που επιβάλλονται στις
    εισαγωγές αυτές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 868/90, annettu 2 päivänä huhtikuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Jugoslaviasta ja
    Romaniasta peräisin olevien raudasta tai seostamattomasta teräksestä valmistettujen
    hitsattujen putkien tuonnissa ja tälle tuonnille säädetyn väliaikaisen polkumyyntitullin
    lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 868/90 DEL CONSIGLIO del 2 aprile 1990 che istituisce
    un dazio antidumping definitivo sulle importazioni di alcuni tipi di tubi saldati,
    di ferro o di acciai non legati, originari della Iugoslavia e della Romania, e
    dispone la riscossione definitiva dei dazi antidumping provvisori su dette importazioni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 868/90 VAN DE RAAD van 2 april 1990 tot instelling
    van een definitief anti-dumpingrecht op de invoer van bepaalde gelaste buizen,
    van ijzer of van niet-gelegeerd staal, van oorsprong uit Joegoslavië en Roemenië,
    en tot definitieve inning van de op deze invoer ingestelde voorlopige anti-dumpingrechten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 868/90 DO CONSELHO de 2 de Abril de 1990 que institui
    um direito anti-dumping definitivo sobre as importaçoes de certos tubos soldados,
    de ferro ou de aço nao ligado, originarios da Jugoslavia e da Roménia, e que
    estabelece a cobrança definitiva do direito anti-dumping provisorio instituido
    sobre essas importaçoes
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 868/90 DEL CONSEJO de 2 de abril de 1990 por el que
    se establece un derecho antidumping definitivo sobre las importaciones de determinados
    tubos soldados de hierro o de acero sin alear, originarios de Yugoslavia y Rumania,
    y por el que se perciben definitivamente los derechos antidumping provisionales
    establecidos sobre dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 868/90 av den 2 april 1990 om införande av
    en slutgiltig antidumpningstull på import av vissa svetsade rör av järn eller
    olegerat stål, med ursprung i Jugoslavien och Rumänien och om slutgiltigt uttag
    av den preliminära antidumpningstullen för sådan import
  type: main
