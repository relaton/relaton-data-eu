---
id: EUDecision1978424
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 April 1978 authorizing the French Republic not
    to apply Community treatment to jerseys, pullovers, slip-overs, twinsets, cardigans,
    bedjackets and jumpers, of wool, cotton or of man-made textile fibres, falling
    within subheading ex 60.05 A of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/424/CEE: Décision de la Commission, du 21 avril 1978, autorisant la
    République française à exclure du traitement communautaire les chandails, "pullovers",
    "slipovers", "twinsets", gilets et vestes, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la sous-position Ex 60.05 A du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. April 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und dergleichen,
    aus Wolle, Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen der
    Tarifnummer ex 60.05 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigansæt, veste og trøjer, af uld, bomuld eller syntetiske eller regenererede
    fibre, som henhører under pos. ex 60.05 A i den fælles toldtarif, har oprindelse
    i Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario maglie, pullover, slip-over,
    twinset, giubbotti, giacche e bluse a maglia non elastica né gommata, di lana,
    di cotone o di fibre sintetiche o artificiali della sottovoce ex 60.05 A della
    tariffa doganale comune, originari di Taiwan e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 april 1978 waarbij de Franse Republiek
    wordt gemachtigd truien, jumpers, pull-overs en slip-overs, twinsets, vesten en
    jasjes, van wol, van katoen of van synthetische of van kunstmatige textielvezels
    van post ex 60.05 A van het gemeenschappelijk douanetarief, van oorsprong uit
    Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
