  content: Council Regulation (EEC) No 1642/77 of 18 July 1977 concerning import arrangements
    for certain textile products originating in Thailand and repealing Regulation
    (EEC) No 845/77 for Thailand and Regulation (EEC) No 1183/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1642/77 du Conseil, du 18 juillet 1977, relatif au
