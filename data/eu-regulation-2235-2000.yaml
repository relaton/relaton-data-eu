    annetun asetuksen (EY) N:o 1249/96 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2235/2000/EK rendelete (2000. október 9.) a Spanyolországba
    történő kukorica- és cirokimport és a Portugáliába történő kukoricaimport
    vámkontingenseinek alkalmazására vonatkozó részletes szabályok megállapításáról
    szóló 1839/95/EK rendelet és az 1766/92/EGK tanácsi rendelet alkalmazásának
    szabályairól (importvámok a gabonaágazatban) szóló 1249/96/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2235/2000 della Commissione, del 9 ottobre 2000, che
    modifica i regolamenti (CE) n. 1839/95 recante modalità d'applicazione dei contingenti
    tariffari per l'importazione di granturco e di sorgo in Spagna e di granturco
    in Portogallo nonché (CE) n. 1249/96 recante modalità d'applicazione del regolamento
    (CEE) n. 1766/92 del Consiglio in ordine ai dazi all'importazione nel settore
    dei cereali
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2235/2000 (2000. gada 9. oktobris), ar ko groza
    Regulu (EK) Nr. 1839/95, ar kuru paredz sīki izstrādātus noteikumus tarifu
    kvotu piemērošanai kukurūzas un sorgo importam Spānijā un kukurūzas importam
    Portugālē, un Regulu (EK) Nr. 1249/96 par Padomes Regulas (EEK) Nr. 1766/92
    piemērošanas noteikumiem (ievedmuitas nodokļi labības nozarē)
  type: main
- language: lt
  script: Latn
  content: 2000 m. spalio 9 d. Komisijos reglamentas (EB) Nr. 2235/2000 iš dalies
