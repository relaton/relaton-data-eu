    kukurūzų ir sorgo importo į Ispaniją ir kukurūzų importo į Portugaliją
    tarifines kvotas, ir Reglamentą (EB) Nr. 1249/96 dėl Tarybos reglamento (EEB)
    Nr. 1766/92 (grūdų sektoriaus importo muito mokesčiai) taikymo taisyklių
  type: main
