title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1412/86 of 13 May 1986 re-establishing the
    levying of customs duties on automatic data-processing machines and units thereof,
    falling within subheading 84.53 B, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1412/86 de la Commission du 13 mai 1986 portant rétablissement
    de la perception des droits de douane applicables à certaines machines automatiques
    de traitement de l' information et leur unités de la sous-position 84.53 B du
    tarif douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1412/86 der Kommission vom 13. Mai 1986 zur Wiedereinführung
    der Erhebung der Zölle für gewisse automatische Datenverarbeitungsmaschinen
    und ihre Einheiten der Tarifstelle 84.53 B des Gemeinsamen Zolltarifs mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1412/86 af 13. maj 1986 om genindførelse
    af opkrævning af told for automatiske databehandlingsmaskiner og enheder dertil,
    henhørende under pos. 84.53 B i den fælles toldtarif og med oprindelse i Sydkorea,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1412/86 της Επιτροπής
    της 13ης Μαΐου 1986 περί αποκαταστάσεως της εφαρμογής
    των δασμών για ορισμένες αυτόματες μηχανές
    επεξεργασίας πληροφοριών και μονάδες (στοιχεία)
    αυτών, της διακρίσεως 84.53 Β του κοινού δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1412/86 della Commissione del 13 maggio 1986 che ripristina
    la riscossione dei dazi doganali applicabili a talune macchine automatiche per
    l' elaborazione dell' informazione e loro unità della sottovoce 84.53 B della
    tariffa doganale comune, originarie della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1412/86 van de Commissie van 13 mei 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op automatische
    gegevensverwerkende machines en eenheden daarvoor, van postonderverdeling 84.53
    B, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3599/85
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1412/86 da Comissão de 13 de Maio de 1986 que restabelece
