  script: Latn
  content: '2000/186/EC: Council Decision of 28 February 2000 authorising the Federal
    Republic of Germany to apply measures derogating from Articles 6 and 17 of the
    Sixth Directive 77/388/EEC on the harmonisation of the laws of the Member States
    relating to turnover taxes - common system of value added tax: uniform basis of
    assessment'
  type: main
- language: fr
  script: Latn
