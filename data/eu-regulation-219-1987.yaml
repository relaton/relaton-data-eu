title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 219/87 of 26 January 1987 amending Regulation
    (EEC) No 1634/86 laying down detailed rules for the application of the supplementary
    trade mechanism to olive oil and oil-cake imported into Portugal and fixing the
    target ceiling for imports into Portugal during 1987 of olive oil and oilcake
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 219/87 de la Commission du 26 janvier 1987 modifiant
    le règlement (CEE) n° 1634/86 portant modalité d' application du mécanisme
    complémentaire aux échanges pour l' huile d' olive et les tourteaux importés
    au Portugal et fixant le plafond indicatif d' importation au Portugal au cours
    de l' année 1987 pour l' huile d' olive et les tourteaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 219/87 der Kommission vom 26. Januar 1987 zur Änderung
    der Verordnung (EWG) Nr. 1634/86 mit Durchführungsbestimmungen zum ergänzendem
    Handelsmechanismus bei nach Portugal eingeführtem Olivenöl und Ölkuchen sowie
    zur Festsetzung des Richtplafonds für im Jahr 1987 nach Portugal eingeführtes
    Olivenöl bzw. eingeführten Ölkuchen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 219/87 af 26. januar 1987 om ændring
    af forordning (EØF) nr. 1634/86 om fastsættelse af gennemførelsesbestemmelserne
    til den supplerende mekanisme for samhandelen med olivenolie og oliekager, der
    indføres til Portugal, og om fastsættelse af det vejledende loft for indførsel
    af olivenolie og oliekager til Portugal i 1987
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 219/87 της Επιτροπής
    της 26ης Ιανουαρίου 1987 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1634/86 για λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για το ελαιόλαδο και τους πλακούντες
    που εισάγονται στην Πορτογαλία και για τον
    καθορισμό του ενδεικτικού ανώτατου ορίου εισαγωγής
    στην Πορτογαλία κατά το 1987 για το ελαιόλαδο
    και τους πλακούντες
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 219/87, annettu 26 päivänä tammikuuta 1987,
    Portugaliin tuotavien oliiviöljyn ja öljykakkujen täydentävän kaupan järjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 1634/86 muuttamisesta sekä ohjeellisen katon vahvistamisesta oliiviöljyn
    ja öljykakkujen tuonnille Portugaliin vuonna 1987
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 219/87 della Commissione del 26 gennaio 1987 che modifica
    il regolamento (CEE) n. 1634/86 che stabilisce le modalità di applicazione del
    meccanismo complementare applicabile agli scambi per l' olio d' oliva e i panelli
    importati in Portogallo e che fissa, per il 1987, il massimale indicativo per
    l' importazione in Portogallo di olio d' oliva e di panelli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 219/87 van de Commissie van 26 januari 1987 houdende
    wijziging van Verordening (EEG) nr. 1634/86 tot vaststelling van de uitvoeringsbepalingen
    van de aanvullende regeling voor het handelsverkeer voor in Portugal ingevoerde
    olijfolie en perskoeken en houdende vaststelling van de indicatieve plafonds voor
    de invoer van olijfolie en perskoeken in Portugal gedurende het jaar 1987
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 219/87 da Comissão de 26 de Janeiro de 1987 que
    altera o Regulamento (CEE) n.° 1634/86 que estabelece as regras de execução
    do mecanismo complementar aplicável às trocas comerciais para o azeite e os
    bagaços importados em Portugal e que fixa o limite indicativo de importação
    em Portugal no decurso de 1987 para o azeite e os bagaços
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 219/87 de la Comisión de 26 de enero de 1987 por
    el que se modifica el Reglamento (CEE) n° 1634/86, por el que se establecen las
    modalidades de aplicación del mecanismo complementario de los intercambios para
    el aceite de oliva y las tortas importadas en Portugal, y por el que se fija el
    límite máximo indicativo para las importaciones en Portugal de aceite de oliva
    y de tortas durante 1987
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 219/87 av den 26 januari 1987 om ändring
