    for så vidt angår listerne over dyr, animalske produkter, avlsmateriale, animalske
    biprodukter, afledte produkter, sammensatte produkter samt hø og halm, der er
    omfattet af offentlig kontrol på grænsekontrolsteder, og om ophævelse af Kommissionens
    gennemførelsesforordning (EU) 2019/2007 og Kommissionens beslutning 2007/275/EF
