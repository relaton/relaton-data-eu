title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/632 of 13 April 2021 laying
    down rules for the application of Regulation (EU) 2017/625 of the European Parliament
    and of the Council as regards the lists of animals, products of animal origin,
    germinal products, animal by-products and derived products, composite products,
    and hay and straw subject to official controls at border control posts, and repealing
    Commission Implementing Regulation (EU) 2019/2007 and Commission Decision 2007/275/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/632 de la Commission du 13 avril 2021
    portant modalités d’application du règlement (UE) 2017/625 du Parlement européen
    et du Conseil en ce qui concerne les listes indiquant les animaux, les produits
    d’origine animale, les produits germinaux, les sous-produits animaux et les
    produits dérivés, les produits composés et le foin et la paille soumis à des
    contrôles officiels aux postes de contrôle frontaliers et abrogeant le règlement
    d’exécution (UE) 2019/2007 de la Commission et la décision 2007/275/CE de
    la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/632 der Kommission vom 13. April 2021
    zur Festlegung von Durchführungsbestimmungen zur Verordnung (EU) 2017/625 des
    Europäischen Parlaments und des Rates in Bezug auf die Liste der Tiere, der Erzeugnisse
    tierischen Ursprungs, des Zuchtmaterials, der tierischen Nebenprodukte und Folgeprodukte,
    der zusammengesetzten Erzeugnisse sowie des Heus und des Strohs, die an Grenzkontrollstellen
    amtlich zu kontrollieren sind, und zur Aufhebung der Durchführungsverordnung
    (EU) 2019/2007 der Kommission und der Entscheidung 2007/275/EG der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/632 на Комисията
    от 13 април 2021 година за определяне на правила
    за прилагането на Регламент (ЕС) 2017/625 на Европейския
    парламент и на Съвета по отношение на списъците
    на животни, продукти от животински произход,
    зародишни продукти, странични животински продукти
    и производни продукти, съставни продукти, сено
    и слама, които подлежат на официален контрол
    на граничните контролни пунктове, и за отмяна
    на Регламент за изпълнение (ЕС) 2019/2007 на Комисията
    и Решение № 2007/275/ЕО на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/632 ze dne 13. dubna 2021, kterým
    se stanoví prováděcí pravidla k nařízení Evropského parlamentu a Rady
    (EU) 2017/625, pokud jde o seznamy zvířat, produktů živočišného původu,
    zárodečných produktů, vedlejších produktů živočišného původu a získaných
    produktů, směsných produktů a sena a slámy, na něž se vztahují úřední
    kontroly na stanovištích hraniční kontroly, a kterým se zrušuje prováděcí
    nařízení Komise (EU) 2019/2007 a rozhodnutí Komise 2007/275/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/632 af 13. april 2021
