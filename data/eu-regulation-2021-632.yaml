    (EÚ) 2017/625, pokiaľ ide o zoznamy zvierat, produktov živočíšneho pôvodu,
    zárodočných produktov, vedľajších živočíšnych produktov a odvodených
    produktov, zmiešaných výrobkov, ako aj sena a slamy podliehajúcich úradným
    kontrolám na hraničných kontrolných staniciach, a ktorým sa zrušuje vykonávacie
    nariadenie Komisie (EÚ) 2019/2007 a rozhodnutie Komisie 2007/275/ES
  type: main
