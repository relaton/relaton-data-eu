    pravil za uporabo Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta glede seznamov
    živali, proizvodov živalskega izvora, zarodnega materiala, živalskih stranskih
    proizvodov in pridobljenih proizvodov, sestavljenih proizvodov ter sena in slame,
    za katere velja uradni nadzor na mejnih kontrolnih točkah, ter o razveljavitvi
    Izvedbene uredbe Komisije (EU) 2019/2007 in Odločbe Komisije 2007/275/ES
  type: main
