  script: Latn
  content: Reglamento de Ejecución (UE) 2021/632 de la Comisión de 13 de abril de
    2021 por el que se establecen normas de desarrollo del Reglamento (UE) 2017/625
    del Parlamento Europeo y del Consejo en lo que respecta a las listas de los animales,
    los productos de origen animal, los productos reproductivos, los subproductos
    animales y los productos derivados, los productos compuestos y la paja y el heno
    sujetos a controles oficiales en los puestos de control fronterizos, y por el
    que se derogan el Reglamento de Ejecución (UE) 2019/2007 de la Comisión y la
    Decisión 2007/275/CE de la Comisión
  type: main
