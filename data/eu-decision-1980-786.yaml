id: EUDecision1980786
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/786/EEC: Commission Decision of 17 July 1980 authorizing the French
    Republic not to apply Community treatment to women''s, girls''and infants''(other
    than babies'') woven suits and costumes (including coordinate suits consisting
    of two or three pieces which are ordered, packed, consigned and normally sold
    together), of wool, of cotton or of man-made textile fibres excluding ski suits,
    falling within subheading ex 61.02 B II of the Common Customs Tariff (category
    29), originating in India and in free circulation in the other Member States (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/786/CEE: Décision de la Commission, du 17 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les costumes-tailleurs
    tissés (y compris les ensembles qui se composent de deux ou trois pièces qui
    sont commandées, conditionnées, transportées et normalement vendues ensemble)
    pour femmes, fillettes et jeunes enfants (autres que bébés), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles, à l''exception des vêtements
    de ski, de la sous-position ex 61.02 B II du tarif douanier commun (catégorie
    29), originaires de l''Inde et mis en libre pratique dans les autres Etats membres
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/786/EWG: Entscheidung der Kommission vom 17. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus Indien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Kostüme und Hosenanzüge, ausgenommen
    Skianzüge, aus Geweben (einschließlich der aus zwei oder drei Teilen bestehenden
    Kombinationen, die zusammen bestellt, aufgemacht und befördert und normalerweise
    zusammen verkauft werden), für Frauen, Mädchen und Kleinkinder (ausgenommen
    Säuglinge), aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen,
    der Tarifstelle ex 61.02 B II des Gemeinsamen Zolltarifs (Kategorie 29) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/786/EØF: Kommissionens beslutning af 17. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage dragter og kostumer
    herunder kjoledragter og buksedragter, vævede (herunder sæt, der består af
    to eller tre stykker, der bestilles, emballeres, transporteres og normalt sælges
    sammen), til kvinder, piger og småbørn (andre end spædbørn), af uld, bomuld
    eller kemofibre, undtagen skisæt, som henhører under pos. ex 61.02 B II i den
    fælles toldtarif (kategori 29), har oprindelse i Indien og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/786/CEE: Decisione della Commissione, del 17 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario abiti a giacca
    e completi tessuti (compresi gli insiemi composti da due o tre pezzi, ordinati,
    preparati, trasportati e normalmente venduti insieme), per donna, per ragazza
    e per bambini, diversi dai bambini piccoli (bébés), di lana, di cotone o di
    fibre tessili sintetiche o artificiali, esclusi quelli da sci, della sottovoce
    ex 61.02 B II della tariffa doganale comune, categoria 29, originari dell''India
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/786/EEG: Beschikking van de Commissie van 17 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd geweven mantelpakken en broekpakken voor dames, meisjes
    en kinderen (andere dan die voor baby''s), daaronder begrepen uit twee of drie
    delen bestaande pakken welke gewoonlijk samen besteld, verpakt, verstuurd en verkocht
    worden, van wol, van katoen of van synthetische of van kunstmatige textielvezels,
    met uitzondering van skikleding, van post ex 61.02 B II van het gemeenschappelijk
    douanetarief (categorie 29), van oorsprong uit India en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
