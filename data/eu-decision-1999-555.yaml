title:
- language: en
  script: Latn
  content: '1999/555/EC: Commission Decision of 22 July 1999 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of BAS 656H (dimethenamid-p AC 900001(picolinafen), ZA
    1963 (picoxystrobin) in Annex I to Council Directive 91/414/EEC concerning the
    placing of plant-protection products on the market (notified under document number
    C(1999) 2276)'
  type: main
- language: fr
  script: Latn
  content: '1999/555/CE: Décision de la Commission du 22 juillet 1999 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle des substances actives BAS 656H (diméthénamide-p),
    AC 900001 (picolinafène) et ZA 1963 (picoxystrobine) à l''annexe I de la directive
    91/414/CEE du Conseil concernant la mise sur le marché des produits phytopharmaceutiques
    [notifiée sous le numéro C(1999) 2276]'
  type: main
- language: de
  script: Latn
  content: '1999/555/EG: Entscheidung der Kommission vom 22. Juli 1999 über die grundsätzliche
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von BAS 656H (Dimethenamid-p), AC 900001
    (Picolinafen) und ZA 1963 (Picoxystrobin) in Anhang I der Richtlinie 91/414/EWG
    des Rates über das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden
    (Bekanntgegeben unter Aktenzeichen K(1999) 2276)'
  type: main
- language: bg
  script: Cyrl
