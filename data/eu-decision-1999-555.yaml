    zařazení BAS 656H (dimethenamid-P), AC 900001 (pikolinafen) a ZA 1963 (pikoxystrobin)
    do přílohy I směrnice Rady 91/414/EHS o uvádění přípravků na ochranu
    rostlin na trh (oznámeno pod číslem K(1999) 2276)
  type: main
