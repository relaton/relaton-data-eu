    на досиетата, предадени за подробен преглед
    с оглед на възможното включване на активните
    вещества BAS 656H (dimethenamid-p AC 900001(picolinafen), ZA 1963 (picoxystrobin)
    в приложение I към Директива 91/414/ЕИО на Съвета
    относно пускането на пазара на продукти за
    растителна защита (нотифицирано под номер
    С(1999) 2276)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 22. července 1999, kterým se v zásadě uznává
