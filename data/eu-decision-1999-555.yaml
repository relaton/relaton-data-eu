    AC 900001 (pikolinafēna) un ZA 1963 (pikoksistrobīna) iespējamai iekļaušanai
    Padomes Direktīvas 91/414/EEK par augu aizsardzības līdzekļu laišanu tirgū
    I pielikumā (izziņots ar dokumenta numuru C(1999) 2276)
