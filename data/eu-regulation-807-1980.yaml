title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 807/80 of 27 March 1980 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 807/80 du Conseil, du 27 mars 1980, fixant, pour l'
    année 1980, certaines mesures intérimaires de conservation et de gestion des
    ressources de pêche applicables aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 807/80 des Rates vom 27. März 1980 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    Schiffe unter norwegischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 807/80 af 27. marts 1980 om fastsættelse
    for 1980 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører norsk flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 807/80 del Consiglio, del 27 marzo 1980, che dispone
    per il 1980 talune misure provvisorie di conservazione e di gestione delle risorse
    di pesca, da applicare alle navi battenti bandiera norvegese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 807/80 van de Raad van 27 maart 1980 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op vaartuigen die de vlag van Noorwegen voeren
  type: main
