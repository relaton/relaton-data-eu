title:
- language: en
  script: Latn
  content: Commission Decision of 30 December 1974 authorizing the French Republic
    to apply protective measures in trade within the Community in wines, falling within
    subheading 22.05 C of the Common Customs Tariff, coming from Greece
  type: main
- language: fr
  script: Latn
  content: '75/70/CEE: Décision de la Commission, du 30 décembre 1974, autorisant
    la République française à appliquer des mesures de protection concernant les
    échanges intracommunautaires de vins, de la sous-position 22.05 C du Tarif douanier
    commun, provenant de Grèce'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. Dezember 1974, mit der die Französische
    Republik ermächtigt wird, Schutzmaßnahmen betreffend den innergemeinschaftlichen
    Handel von Weinen der Tarifnummer 22.05 C des Gemeinsamen Zolltarifs mit Herkunft
    aus Griechenland anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. december 1974 hvorved Den franske Republik
    bemyndiges til at anvende beskyttelsesforanstaltninger vedrørende handelen inden
    for Fællesskabet med vine under pos. 22.05 C i den fælles toldtarif, indført
    fra Grækenland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 dicembre 1974, che autorizza la Repubblica
    francese ad applicare delle misure di protezione negli scambi intracomunitari
    di vini, della voce 22.05 C della tariffa doganale comune, provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 december 1974 tot machtiging van de
    Franse Republiek om beschermende maatregelen te treffen bij het intracommunautaire
    handelsverkeer van wijn, van post 22.05 C van het gemeenschappelijk douanetarief,
    van herkomst uit Griekenland
