    της Ένωσης σε χώρες ΕΟΧ-ΕΖΕΣ
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 100/2012, 3. veebruar 2012 , millega muudetakse
    määrust (EÜ) nr 748/2009 nimekirja kohta õhusõiduki käitajatest, kes teostasid
    Euroopa Parlamendi ja nõukogu direktiivi 2003/87/EÜ I lisas loetletud lennutegevusi
    1. jaanuaril 2006 või pärast seda, millega täpsustatakse iga õhusõiduki käitajat
    haldav liikmesriik, võttes muu hulgas arvesse ELi heitkogustega kauplemise süsteemi
    laienemist EMP-EFTA riikidele
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 100/2012, annettu 3 päivänä helmikuuta 2012
    , niiden ilma-alusten käyttäjien luettelosta, jotka harjoittivat Euroopan parlamentin
    ja neuvoston direktiivin 2003/87/EY liitteessä I tarkoitettua ilmailutoimintaa
    1 päivänä tammikuuta 2006 tai sen jälkeen, ja hallinnoivan jäsenvaltion yksilöimisestä
    kunkin ilma-aluksen käyttäjän osalta annetun asetuksen (EY) N:o 748/2009 muuttamisesta
    ottaen myös huomioon unionin päästökauppajärjestelmän laajentamisen koskemaan
    ETA/EFTA-maita
  type: main
- language: hu
  script: Latn
  content: A Bizottság 100/2012/EU rendelete ( 2012. február 3. ) a 2006. január
    1-jén vagy azt követően a 2003/87/EK európai parlamenti és tanácsi irányelv
    I. mellékletének jegyzéke értelmében légi közlekedési tevékenységet
    végző légijármű-üzemeltetők listáját és az egyes légijármű-üzemeltetőkhöz
    igazgatási célból rendelt tagállamokat megállapító, az uniós kibocsátáskereskedelmi
    rendszernek az EGT-EFTA országokra való kiterjesztését is figyelembe vevő
    748/2009/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 100/2012 della Commissione, del 3 febbraio 2012 , che
    modifica il regolamento (CE) n. 748/2009 relativo all’elenco degli operatori
    aerei che hanno svolto una delle attività di trasporto aereo che figurano nell’allegato
    I della direttiva 2003/87/CE del Parlamento europeo e del Consiglio al 1 °gennaio
    2006 o successivamente a tale data, che specifica lo Stato membro di riferimento
    di ciascun operatore aereo, tenendo conto inoltre dell’estensione del sistema
    per lo scambio di quote di emissioni dell’Unione agli Stati membri del SEE e
    dell’EFTA
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 100/2012 ( 2012. gada 3. februāris ), ar ko
    groza Regulu (EK) Nr. 748/2009 par to gaisakuģu operatoru sarakstu, kuri 2006.
    gada 1. janvārī vai pēc minētā datuma ir veikuši Eiropas Parlamenta un Padomes
    Direktīvas 2003/87/EK I pielikumā uzskaitītās aviācijas darbības, katram
    gaisakuģa operatoram norādot administrējošo dalībvalsti un arī ņemot vērā
    Savienības emisijas kvotu tirdzniecības sistēmas darbības paplašināšanu,
    tajā iekļaujot EEZ EBTA valstis
  type: main
- language: lt
  script: Latn
  content: 2012 m. vasario 3 d. Komisijos reglamentas (ES) Nr. 100/2012, kuriuo iš
    dalies keičiamas Reglamentas (EB) Nr. 748/2009 dėl orlaivių naudotojų, kurie
    2006 m. sausio 1 d. arba vėliau vykdė Europos Parlamento ir Tarybos direktyvos
    2003/87/EB I priede nurodytą aviacijos veiklą, sąrašo, kuriame nurodoma kiekvieno
    orlaivių naudotojo administruojanti valstybė narė, drauge atsižvelgiant į
    Europos laisvosios prekybos asociacijos valstybių, kurios yra Europos ekonominės
    erdvės narės, įtraukimą į Sąjungos apyvartinių taršos leidimų prekybos
    sistemą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 100/2012 tat- 3 ta' Frar 2012 li jemenda
    r-Regolament (KE) Nru 748/2009 dwar il-lista ta’ operaturi ta’ inġenji tal-ajru
    li wettqu attività ta’ avjazzjoni elenkata fl-Anness I għad-Direttiva 2003/87/KE
    tal-Parlament Ewropew u tal-Kunsill fl- 1 ta’ Jannar 2006 jew wara, li tispeċifika
    l-Istat Membru ta’ amministrazzjoni għal kull operatur ta’ inġenji tal-ajru,
    u li jikkunsidra wkoll l-espansjoni tal-iskema tal-UE għan-negozjar ta’ emissjonijiet
    għall-pajjiżi taż-ŻEE-EFTA
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 100/2012 van de Commissie van 3 februari 2012 houdende
    wijziging van Verordening (EG) nr. 748/2009 betreffende de lijst van vliegtuigexploitanten
    die op of na 1 januari 2006 een in bijlage I bij Richtlijn 2003/87/EG van het
    Europees Parlement en de Raad genoemde luchtvaartactiviteit hebben uitgeoefend,
    met specificatie van de administrerende lidstaat van elke vliegtuigexploitant,
    tevens rekening houdend met de uitbreiding van de regeling van de Unie voor de
    handel in emissierechten naar EER-EVA-landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 100/2012 z dnia 3 lutego 2012 r. zmieniające
    rozporządzenie (WE) nr 748/2009 w sprawie wykazu operatorów statków powietrznych,
    którzy wykonywali działalność lotniczą wymienioną w załączniku I do dyrektywy
    2003/87/WE Parlamentu Europejskiego i Rady poczynając od dnia 1 stycznia 2006
    r. ze wskazaniem administrującego państwa członkowskiego dla każdego operatora
    statków powietrznych, z uwzględnieniem również rozszerzenia unijnego systemu
    handlu uprawnieniami do emisji gazów cieplarnianych na państwa EOG-EFTA
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 100/2012 da Comissão, de 3 de fevereiro de 2012
    , que altera o Regulamento (CE) n. ° 748/2009, relativo à lista de operadores
    de aeronaves que realizaram uma das atividades de aviação enumeradas no anexo
    I da Diretiva 2003/87/CE em ou após 1 de janeiro de 2006 , inclusive, com indicação
    do Estado-Membro responsável em relação a cada operador de aeronave, tendo
    igualmente em conta a expansão do regime de comércio de licenças de emissão
    da União aos países EEE-EFTA
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 100/2012 al Comisiei din 3 februarie 2012 de modificare
    a Regulamentului (CE) nr. 748/2009 privind lista operatorilor de aeronave care
    au desfășurat o activitate de aviație menționată în anexa I la Directiva
    2003/87/CE a Parlamentului European și a Consiliului la 1 ianuarie 2006 sau ulterior,
    specificând statul membru de administrare pentru fiecare operator de aeronave,
    ținând seama și de extinderea schemei UE de comercializare a certificatelor
    de emisie la țările SEE-AELS
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 100/2012 z 3. februára 2012 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 748/2009 o zozname prevádzkovateľov lietadiel,
    ktorí vykonávali činnosť leteckej dopravy uvedenú v prílohe I k smernici
    Európskeho parlamentu a Rady 2003/87/ES k 1. januáru 2006 alebo po tomto dátume,
    v ktorom sa každému prevádzkovateľovi lietadiel určuje riadiaci členský
    štát, pričom sa zohľadňuje aj rozšírenie systému obchodovania s emisiami
    v Únii na krajiny EHP – EZVO
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 100/2012 z dne 3. februarja 2012 o spremembi
    Uredbe (ES) št. 748/2009 o seznamu operaterjev zrakoplovov, ki so 1. januarja
    2006 ali pozneje izvajali letalsko dejavnost s seznama v Prilogi I k Direktivi
    2003/87/ES Evropskega parlamenta in Sveta, z navedbo države članice upravljavke
    za vsakega operaterja zrakoplova ob upoštevanju razširitve sistema Unije za
    trgovanje s pravicami do emisije na države članice EGP-EFTA
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 100/2012 de la Comisión, de 3 de febrero de 2012
    , por el que se modifica el Reglamento (CE) n ° 748/2009 de la Comisión sobre
    la lista de operadores de aeronaves que han realizado una actividad de aviación
    enumerada en el anexo I de la Directiva 2003/87/CE del Parlamento Europeo y del
    Consejo el 1 de enero de 2006 o a partir de esta fecha, en la que se especifica
    el Estado miembro responsable de la gestión de cada operador de aeronaves teniendo
    en cuenta también la ampliación del régimen de comercio de derechos de emisión
    de la Unión Europea a los países EEE-AELC
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 100/2012 av den 3 februari 2012 om ändring
    av förordning (EG) nr 748/2009 om en förteckning över luftfartygsoperatörer
    som den 1 januari 2006 eller senare har bedrivit sådan luftfartsverksamhet som
    omfattas av bilaga I i direktiv 2003/87/EG med angivande av administrerande medlemsstat
    för varje luftfartygsoperatör, även vad gäller utvidgningen av unionens system
    för handel med utsläppsrätter till EES- och Eftaländer
  type: main
