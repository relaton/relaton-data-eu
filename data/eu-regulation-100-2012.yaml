title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 100/2012 of 3 February 2012 amending Regulation
    (EC) No 748/2009 on the list of aircraft operators that performed an aviation
    activity listed in Annex I to Directive 2003/87/EC of the European Parliament
    and of the Council on or after 1 January 2006 specifying the administering Member
    State for each aircraft operator also taking into consideration the expansion
    of the Union emission trading scheme to EEA-EFTA countries
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 100/2012 de la Commission du 3 février 2012 modifiant
    le règlement (CE) n ° 748/2009 concernant la liste des exploitants d'aéronefs
    ayant exercé une activité aérienne visée à l’annexe I de la directive 2003/87/CE
    du Parlement européen et du Conseil à compter du 1 er janvier 2006 et précisant
    l’État membre responsable de chaque exploitant d’aéronef, compte tenu de
    l'extension du système d'échange de quotas d'émission aux pays de l'AELE membres
    de l’EEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 100/2012 der Kommission vom 3. Februar 2012 zur Änderung
    der Verordnung (EG) Nr. 748/2009 über die Liste der Luftfahrzeugbetreiber, die
    am oder nach dem 1. Januar 2006 einer Luftverkehrstätigkeit im Sinne von Anhang
    I der Richtlinie 2003/87/EG des Europäischen Parlaments und des Rates nachgekommen
    sind, mit Angabe des für die einzelnen Luftfahrzeugbetreiber zuständigen Verwaltungsmitgliedstaats
    und unter Berücksichtigung der Einbeziehung der EWR-/EFTA-Länder in das Emissionshandelssystem
    der EU
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 100/2012 на Комисията от 3 февруари
    2012 година за изменение на Регламент (ЕО) № 748/2009
    относно списъка на операторите на въздухоплавателни
    средства, които са извършвали авиационна дейност,
    включена в списъка от приложение I към Директива
    2003/87/ЕО на Европейския парламент и на Съвета,
    към 1 януари 2006 г. или след това, като за всеки
    отделен оператор на въздухоплавателни средства
    се посочва администриращата държава-членка
    и се взема под внимание разширяването на схемата
    на Съюза за търговия с квоти за емисии към държавите
    от ЕИП—ЕАСТ
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 100/2012 ze dne 3. února 2012 , kterým se
    mění nařízení (ES) č. 748/2009 o seznamu provozovatelů letadel, kteří
    ke dni 1. ledna 2006 nebo po tomto datu vykonávali činnost v oblasti letectví
    uvedenou v příloze I směrnice 2003/87/ES, s uvedením členského státu správy
    u jednotlivých provozovatelů letadel a rovněž s ohledem na rozšíření systému
    Unie pro obchodování s emisemi na země EHP-ESVO
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 100/2012 af 3. februar 2012 om ændring
    af forordning (EF) nr. 748/2009 om en liste over luftfartøjsoperatører, som
    den 1. januar 2006 udførte eller derefter har udført en af luftfartsaktiviteterne
    i bilag I til Europa-Parlamentets og Rådets direktiv 2003/87/EF, med angivelse
    af den til hver luftfartøjsoperatør hørende administrerende medlemsstat, idet
    der også tages hensyn til udvidelsen af Unionens ordning for handel med emissioner
    til EØS/EFTA-lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 100/2012 της Επιτροπής,
    της 3ης Φεβρουαρίου 2012 , για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 748/2009 σχετικά με τον
    κατάλογο των φορέων εκμετάλλευσης αεροσκαφών
