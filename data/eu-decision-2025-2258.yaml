  content: Council Decision (EU) 2025/2258 of 31 October 2025 on the position to be
    taken on behalf of the European Union at the sixth meeting of the Conference of
    the Parties to the Minamata Convention on Mercury as regards the adoption of decisions
    amending Annexes A and B to that Convention on mercury-added products and manufacturing
    processes in which mercury or mercury compounds are used
  type: main
- language: fr
  script: Latn
