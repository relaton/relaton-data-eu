    conférence des parties à la convention de Minamata sur le mercure en ce qui
    concerne l’adoption de décisions amendant les annexes A et B de ladite convention
    concernant les produits contenant du mercure ajouté et les procédés de fabrication
    dans lesquels du mercure ou des composés du mercure sont utilisés
  type: main
