title:
- language: en
  script: Latn
  content: '94/838/EC: Commission Decision of 19 December 1994 approving the Single
    Programming Document for Community structural measures for improving the processing
    and marketing conditions for agricultural and forestry products in Spain (except
    for Andalusia, Asturias, the Canary Islands, Cantabria, Castile and Leon, Castile-La
    Mancha, the Valencian Community, Extremadura, Galicia, Murcia, Ceuta and Melilla)
    in respect of Objective 5a, covering the period between 1994 and 1999 (Only the
    Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/838/CE: Décision de la Commission, du 19 décembre 1994, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en Espagne (à l''exception de l''Andalousie,
    des Asturies, des Canaries, de la Cantabrie, la Castille et León, la Castille-La
    Manche, la Communauté valencienne, l''Estrémadure, la Galice, la Murcie, Ceuta
    et Melilla), au titre de l''objectif nº 5 a), couvrant la période entre 1994
    et 1999 (Le texte en langue espagnole est le seul faisant foi)'
  type: main
- language: de
