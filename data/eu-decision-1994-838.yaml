    der Zielvorgabe 5a in Spanien (mit Ausnahme von Andalusien, Asturien, den Kanarischen
    Inseln, Cantabria, Castilla und León, Castilla-La Mancha, der Gemeinde Valencia,
    Estremadura, Galizien, Murcia sowie Ceuta und Melilla) (Nur der spanische Text
    ist verbindlich)'
