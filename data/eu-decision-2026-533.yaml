  script: Latn
  content: Commission Implementing Decision (EU) 2026/533 of 11 March 2026 laying
    down rules for the application of Regulation (EU) 2024/1358 of the European Parliament
    and of the Council as regards the content of the monthly cross-system statistics
    using data from Eurodac, the Visa Information System, the European Travel Information
    and Authorisation System and the Entry/Exit System pursuant to Article 12(3) of
    that Regulation
  type: main
- language: fr
  script: Latn
