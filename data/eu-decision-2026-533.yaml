    Statistiken unter Rückgriff auf Daten von Eurodac, des Visa-Informationssystems,
    des Europäischen Reiseinformations- und -genehmigungssystems und des Einreise-/Ausreisesystems
    gemäß Artikel 12 Absatz 3 der genannten Verordnung
  type: main
