    et du Conseil en ce qui concerne le contenu des statistiques intersystèmes mensuelles
    établies à partir des données d’Eurodac, du système d’information sur
    les visas, du système européen d’information et d’autorisation concernant
    les voyages et du système d’entrée/de sortie, conformément à l’article
    12, paragraphe 3, dudit règlement
  type: main
