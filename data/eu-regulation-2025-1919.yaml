- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1919 of 25 September 2025
    imposing a definitive anti-dumping duty and definitively collecting the provisional
    duty imposed on imports of certain hot-rolled flat products of iron, non-alloy
    or other alloy steel originating in Egypt, Japan and Vietnam, and terminating
    the investigation on imports thereof originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1919 de la Commission du 25 septembre
    2025 instituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de certains produits plats
    laminés à chaud en fer, en aciers non alliés ou en autres aciers alliés, originaires
    d’Égypte, du Japon et du Viêt Nam, et clôturant l’enquête sur les importations
    de ces produits originaires de l’Inde
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1919 der Kommission vom 25. September
    2025 zur Einführung eines endgültigen Antidumpingzolls und zur endgültigen
    Vereinnahmung des vorläufigen Zolls auf die Einfuhren bestimmter warmgewalzter
    Flacherzeugnisse aus Eisen, nicht legiertem Stahl oder anderem legiertem Stahl
    mit Ursprung in Ägypten, Japan und Vietnam und zur Einstellung der Untersuchung
    betreffend die Einfuhren dieser Erzeugnisse mit Ursprung in Indien
  type: main
