    van die producten uit India
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/1919 z dnia 25 września 2025
    r. nakładające ostateczne cło antydumpingowe i stanowiące o ostatecznym pobraniu
    cła tymczasowego nałożonego na przywóz niektórych wyrobów płaskich walcowanych
    na gorąco, z żeliwa, stali niestopowej i pozostałej stali stopowej, pochodzących
    z Egiptu, Japonii i Wietnamu oraz kończące dochodzenie dotyczące przywozu tych
    wyrobów pochodzących z Indii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/1919 da Comissão, de 25 de setembro
    de 2025, que institui um direito anti-dumping definitivo e estabelece a cobrança
    definitiva do direito provisório instituído sobre as importações de determinados
    produtos planos laminados a quente, de ferro, de aço não ligado ou de outras
    ligas de aço, originários do Egito, da Índia, do Japão e do Vietname, e que
    encerra o inquérito sobre as importações desses produtos originários da Índia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/1919 al Comisiei din 25 septembrie
    2025 de instituire a unei taxe antidumping definitive și de percepere definitivă
    a taxei provizorii instituite la importurile de anumite produse plate laminate
    la cald din fier, din oțel nealiat sau din alte oțeluri aliate, originare din
    Egipt, Japonia și Vietnam și de închidere a investigației privind importurile
    de astfel de produse originare din India
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/1919 z 25. septembra 2025, ktorým
    sa ukladá konečné antidumpingové clo a s konečnou platnosťou vyberá predbežné
    clo uložené na dovoz určitých plochých výrobkov zo železa, z nelegovanej
    ocele alebo ostatnej legovanej ocele, valcovaných za tepla s pôvodom v Egypte,
    Japonsku a vo Vietname a ktorým sa ukončuje prešetrovanie dovozu týchto výrobkov
    s pôvodom v Indii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/1919 z dne 25. septembra 2025 o uvedbi
    dokončne protidampinške dajatve in dokončnem pobiranju začasne dajatve, uvedene
    na uvoz nekaterih vroče valjanih ploščatih izdelkov iz železa, nelegiranega
    jekla ali drugega legiranega jekla s poreklom iz Egipta, Japonske in Vietnama,
    ter zaključku preiskave o uvozu teh izdelkov s poreklom iz Indije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/1919 de la Comisión, de 25 de septiembre
