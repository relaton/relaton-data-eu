  script: Latn
  content: Uitvoeringsverordening (EU) 2025/1919 van de Commissie van 25 september
    2025 tot instelling van een definitief antidumpingrecht en tot definitieve inning
    van het voorlopige antidumpingrecht op bepaalde warmgewalste platte producten
    van ijzer, van niet-gelegeerd staal of van ander gelegeerd staal van oorsprong
