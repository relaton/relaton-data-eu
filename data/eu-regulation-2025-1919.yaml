    táirgí cothroma teorollta áirithe d’iarann, de chruach neamh-chóimhiotail
    nó de chruach chóimhiotail eile de thionscnamh na hÉigipte, na Seapáine agus
    Vítneam agus lena mbailítear go cinntitheach an dleacht shealadach arna forchur
