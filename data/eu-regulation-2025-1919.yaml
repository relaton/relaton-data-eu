    ta’ Settembru 2025 li jimponi dazju anti-dumping definittiv u li jiġbor b’mod
    definittiv id-dazju proviżorju impost fuq l-importazzjonijiet ta’ ċerti prodotti
    ċatti, illaminati bis-sħana tal-ħadid, tal-azzar mhux illigat jew ta’ liga
