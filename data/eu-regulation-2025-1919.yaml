    na dtáirgí sin de thionscnamh na hIndia
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/1919 оd 25. rujna 2025. o uvođenju
    konačne antidampinške pristojbe i konačnoj naplati privremene pristojbe uvedene
    na uvoz određenih toplovaljanih plosnatih proizvoda od željeza, nelegiranog
    čelika ili drugog legiranog čelika podrijetlom iz Egipta, Japana i Vijetnama
    te o prekidu ispitnog postupka u vezi s uvozom takvih proizvoda podrijetlom iz
    Indije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1919 végrehajtási rendelete (2025. szeptember
    25.) az Egyiptomból, Japánból és Vietnámból származó egyes vasból, ötvözetlen
    acélból vagy más ötvözött acélból készült melegen hengerelt sík termékek
    behozatalára vonatkozó végleges dömpingellenes vám kivetéséről és a kivetett
    ideiglenes vám végleges beszedéséről, valamint az ugyanezen termékek Indiából
    származó behozatalára vonatkozó vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/1919 della Commissione, del 25 settembre
    2025, che istituisce un dazio antidumping definitivo e riscuote definitivamente
    il dazio provvisorio istituito sulle importazioni di determinati prodotti piatti
    laminati a caldo, di ferro, di acciai non legati o di altri acciai legati originari
    dell’Egitto, del Giappone e del Vietnam e che chiude l’inchiesta sulle importazioni
    di tali prodotti originari dell’India
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/1919 (2025. gada 25. septembris),
    ar ko nosaka galīgo antidempinga maksājumu un galīgi iekasē pagaidu maksājumu,
    kurš noteikts konkrētu Ēģiptes, Japānas un Vjetnamas izcelsmes karsti velmētu
    plakanu dzelzs, neleģētā tērauda vai cita leģētā tērauda velmējumu importam,
    un izbeidz izmeklēšanu attiecībā uz Indijas izcelsmes minētā ražojuma importu
  type: main
- language: lt
  script: Latn
  content: 2025 m. rugsėjo 25 d. Komisijos įgyvendinimo reglamentas (ES) 2025/1919,
