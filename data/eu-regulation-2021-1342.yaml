  script: Latn
  content: Regolamento delegato (UE) 2021/1342 della Commissione del 27 maggio 2021
    che integra il regolamento (UE) 2018/848 del Parlamento europeo e del Consiglio
    con norme relative alle informazioni che devono essere trasmesse dai paesi terzi
    e dalle autorità e organismi di controllo ai fini della supervisione del loro
    riconoscimento a norma dell’articolo 33, paragrafi 2 e 3, del regolamento (CE)
    n. 834/2007 del Consiglio per le importazioni di prodotti biologici e alle misure
    da adottare nell’esercizio di tale supervisione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1342 (2021. gada 27. maijs), ar
