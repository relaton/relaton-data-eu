    bestämmelser om den information som ska sändas av tredjeländer och av kontrollmyndigheter
    och kontrollorgan för tillsynen av deras erkännande enligt artikel 33.2 och
    33.3 i rådets förordning (EG) nr 834/2007 när det gäller importerade ekologiska
    produkter och de åtgärder som ska vidtas vid utövandet av denna tillsyn
