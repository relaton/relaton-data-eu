    de autoritățile de control și organismele de control în scopul supravegherii
    recunoașterii acestora în temeiul articolului 33 alineatele (2) și (3) din
    Regulamentul (CE) nr. 834/2007 al Consiliului în ceea ce privește produsele
    ecologice importate, precum și la măsurile care urmează să fie luate în cadrul
    exercitării supravegherii respective
  type: main
