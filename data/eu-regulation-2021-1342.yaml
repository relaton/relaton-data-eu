    par informāciju, kura trešām valstīm, kontroles iestādēm un kontroles institūcijām
    jāiesūta, lai būtu iespējams uzraudzīt to atzīšanu, kas saskaņā ar Padomes
    Regulas (EK) Nr. 834/2007 33. panta 2. un 3. punktu piešķirta attiecībā uz
    bioloģisko produktu importu, un papildina arī ar minētās uzraudzības īstenošanā
    veicamajiem pasākumiem
  type: main
