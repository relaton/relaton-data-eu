title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1342 of 27 May 2021 supplementing
    Regulation (EU) 2018/848 of the European Parliament and of the Council with rules
    on the information to be sent by third countries and by control authorities and
    control bodies for the purpose of supervision of their recognition under Article
    33(2) and (3) of Council Regulation (EC) No 834/2007 for imported organic products
    and the measures to be taken in the exercise of that supervision
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1342 de la Commission du 27 mai 2021 complétant
    le règlement (UE) 2018/848 du Parlement européen et du Conseil par des règles
    relatives aux informations à transmettre par les pays tiers et par les autorités
    et organismes de contrôle aux fins de la supervision de leur reconnaissance au
    titre de l’article 33, paragraphes 2 et 3, du règlement (CE) no 834/2007 du
    Conseil en ce qui concerne les produits biologiques importés ainsi qu’aux mesures
    à prendre dans le cadre de cette supervision
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1342 der Kommission vom 27. Mai 2021 zur
    Ergänzung der Verordnung (EU) 2018/848 des Europäischen Parlaments und des Rates
    durch Vorschriften über die Informationen, die von Drittländern sowie von Kontrollbehörden
    und Kontrollstellen zwecks Überwachung ihrer Anerkennung gemäß Artikel 33 Absätze
    2 und 3 der Verordnung (EG) Nr. 834/2007 des Rates für eingeführte ökologische/biologische
    Erzeugnisse zu übermitteln sind, sowie über die Maßnahmen, die zur Ausübung
    dieser Überwachung zu ergreifen sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1342 на Комисията
