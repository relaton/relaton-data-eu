  script: Latn
  content: Reglamento Delegado (UE) 2021/1342 de la Comisión de 27 de mayo de 2021
    que completa el Reglamento (UE) 2018/848 del Parlamento Europeo y del Consejo
    con normas sobre la información que deben enviar los terceros países y las autoridades
    y organismos de control a efectos de la supervisión de su reconocimiento, de
    conformidad con el artículo 33, apartados 2 y 3, del Reglamento (CE) n.o 834/2007
