    (ЕС) 2018/848 на Европейския парламент и на Съвета
    с правила за информацията, която трябва да
    се изпраща от третите държави, както и от контролните
    и надзорните органи, за целите на надзора над
    тяхното признаване съгласно член 33, параграфи
    2 и 3 от Регламент (ЕО) № 834/2007 на Съвета за внасяни
    биологични продукти, и за мерките, които трябва
    да се предприемат при упражняването на този
    надзор
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1342 ze dne 27. května
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2018/848
    o pravidla týkající se informací, které mají být zasílány třetími zeměmi
    a kontrolními orgány a kontrolními subjekty pro účely dohledu nad jejich
    uznáním podle čl. 33 odst. 2 a 3 nařízení Rady (ES) č. 834/2007 pro dovážené
    ekologické produkty, a o opatření, jež mají být přijata při výkonu tohoto
    dohledu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1342 af 27. maj 2021 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) 2018/848 vedrørende
    de oplysninger, som tredjelande og kontrolmyndigheder og kontrolorganer skal fremsende
