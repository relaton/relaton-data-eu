---
id: EUDecision197318
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 February 1973 authorizing the French Republic
    not to apply Community treatment to fruit (whether or not cooked), preserved by
    freezing, not containing added sugar falling within heading No 08.10 of the Common
    Customs Tariff, originating in Brazil and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 8 février 1973, autorisant la République
    française à exclure du traitement communautaire les fruits, cuits ou non, congelés,
    sans addition de sucre, de la position 08.10 du Tarif douanier commun, originaires
    du Brésil et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Februar 1973, mit der die Französische
    Republik ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Früchte, gekocht oder nicht, gefroren, ohne Zusatz
    von Zucker, der Tarifnummer 08.10 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. februar 1973 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage frugter (også kogte), frosne,
    ikke tilsat sukker som henhører under position 08.10 i den fælles toldtarif,
    har oprindelse i Brasilien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 febbraio 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario frutta, anche cotte, congelate,
    senza aggiunta di zuccheri della voce n. 08.10 della tariffa doganale comune,
    originarie del Brasile e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 februari 1973 waarbij de Franse Republiek
    wordt gemachtigd fruit, ook indien gekookt, bevroren, zonder toegevoegde suiker
    van post 08.10 van het gemeenschappelijk douanetarief, van oorsprong uit Brazilië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
