    kontrol na stanovištích hraniční kontroly
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/2652 af 15. september 2023
    om ændring og berigtigelse af delegeret forordning (EU) 2022/2292 for så vidt
    angår krav vedrørende indførsel til Unionen af honning, kød, højt forarbejdede
    produkter, gelatinekapsler, fiskevarer og krav vedrørende privat erklæring og
