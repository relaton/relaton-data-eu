    fil-postijiet ta’ kontroll fuq il-fruntiera
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/2652 van de Commissie van 15 september
    2023 tot wijziging en rectificatie van Gedelegeerde Verordening (EU) 2022/2292
    wat betreft de voorschriften voor de binnenkomst in de Unie van honing, vlees,
    zeer verfijnde producten, gelatinecapsules en visserijproducten, en de voorschriften
