    aos requisitos para a entrada na União de mel, carne, produtos altamente refinados,
    cápsulas de gelatina, produtos da pesca e aos requisitos aplicáveis aos atestados
    privados, e que altera o Regulamento Delegado (UE) 2021/630 no que diz respeito
    aos requisitos aplicáveis aos atestados privados para produtos compostos isentos
    de controlos oficiais nos postos de controlo fronteiriços
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/2652 al Comisiei din 15 septembrie 2023
    de modificare și rectificare a Regulamentului delegat (UE) 2022/2292 în ceea
    ce privește cerințele pentru intrarea în Uniune a mierii, a cărnii, a produselor
    înalt rafinate, a capsulelor de gelatină, a produselor pescărești și cerințele
    referitoare la atestatele private și de modificare a Regulamentului delegat (UE)
    2021/630 în ceea ce privește cerințele referitoare la atestatele private pentru
    produsele compuse exceptate de la efectuarea controalelor oficiale la posturile
    de control la frontieră
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/2652 z 15. septembra 2023, ktorým
    sa mení a opravuje delegované nariadenie (EÚ) 2022/2292, pokiaľ ide o požiadavky
    na vstup medu, mäsa, vysoko rafinovaných produktov, želatínových kapsúl,
    produktov rybolovu do Únie a požiadavky na súkromné potvrdenie, a ktorým
    sa mení delegované nariadenie (EÚ) 2021/630, pokiaľ ide o požiadavky na súkromné
    potvrdenia týkajúce sa zmiešaných výrobkov oslobodených od úradných kontrol
    na hraničných kontrolných staniciach
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/2652 z dne 15. septembra 2023 o spremembi
    in popravku Delegirane uredbe (EU) 2022/2292 glede zahtev za vstop v Unijo medu,
    mesa, visokorafiniranih proizvodov, želatinskih kapsul in ribiških proizvodov
    ter zahtev po zasebnih potrdilih ter o spremembi Delegirane uredbe (EU) 2021/630
    glede zahtev po zasebnih potrdilih za sestavljene proizvode, izvzete iz uradnega
    nadzora na mejnih kontrolnih točkah
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/2652 de la Comisión, de 15 de septiembre
    de 2023, por el que se modifica y corrige el Reglamento Delegado (UE) 2022/2292
    en lo que respecta a los requisitos para la entrada en la Unión de miel, carne,
    productos muy refinados, cápsulas de gelatina y productos de la pesca y los requisitos
    relativos a los certificados privados, y por el que se modifica el Reglamento
    Delegado (UE) 2021/630 en lo que respecta a los requisitos relativos a los certificados
    privados aplicables a los productos compuestos exentos de controles oficiales
    en los puestos de control fronterizos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/2652 av den 15 september
    2023 om ändring och rättelse av delegerad förordning (EU) 2022/2292 vad gäller
    krav för införsel till unionen av honung, kött, högförädlade produkter,
    gelatinkapslar och fiskeriprodukter samt krav för privata intyg och om ändring
    av delegerad förordning (EU) 2021/630 vad gäller krav för privata intyg för
    sammansatta produkter som är undantagna från offentlig kontroll vid gränskontrollstationer
