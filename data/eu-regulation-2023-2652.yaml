    a hús, a nagymértékben finomított termékek, a zselatinkapszulák és a halászati
    termékek Unióba történő beléptetésére, valamint a magántanúsítványra
    vonatkozó követelmények tekintetében történő módosításáról és helyesbítéséről,
    továbbá az (EU) 2021/630 felhatalmazáson alapuló rendeletnek a határállomásokon
    végzett hatósági ellenőrzések alól mentesített összetett élelmiszer-készítményekre
    vonatkozó magántanúsítási követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/2652 della Commissione, del 15 settembre
    2023, che modifica e rettifica il regolamento delegato (UE) 2022/2292 per quanto
    riguarda le prescrizioni per l’ingresso nell’Unione di miele, carni, prodotti
    altamente raffinati, capsule di gelatina e prodotti della pesca e le prescrizioni
