    на Делегиран регламент (ЕС) 2022/2292 по отношение
    на изискванията за въвеждането в Съюза на мед,
    месо, силно рафинирани продукти, желатинови
    капсули, рибни продукти и изискванията за частно
    удостоверение и за изменение на Делегиран
    регламент (ЕС) 2021/630 по отношение на изискванията
    за частно удостоверение за съставните продукти,
    освободени от официален контрол на граничните
    контролни пунктове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/2652 ze dne 15. září
    2023, kterým se mění a opravuje nařízení v přenesené pravomoci (EU) 2022/2292,
    pokud jde o požadavky na vstup medu, masa, vysoce rafinovaných produktů, tobolek
