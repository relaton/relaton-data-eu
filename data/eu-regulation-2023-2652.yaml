title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2652 of 15 September 2023 amending
    and correcting Delegated Regulation (EU) 2022/2292 with regard to requirements
    for the entry into the Union of honey, meat, highly refined products, gelatine
    capsules, fishery products and requirements for private attestation and amending
    Delegated Regulation (EU) 2021/630 as regards private attestation requirements
    for composite products exempted from official controls at border control posts
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/2652 de la Commission du 15 septembre 2023
    modifiant et rectifiant le règlement délégué (UE) 2022/2292 en ce qui concerne
    les exigences applicables à l’entrée dans l’Union de miel, de viande, de
    produits hautement raffinés, de capsules de gélatine, de produits de la pêche
    ainsi que les exigences en matière d’attestation privée, et modifiant le règlement
    délégué (UE) 2021/630 en ce qui concerne les exigences en matière d’attestation
    privée applicables aux produits composés exemptés des contrôles officiels
    aux postes de contrôle frontaliers
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/2652 der Kommission vom 15. September 2023
    zur Änderung und Berichtigung der Delegierten Verordnung (EU) 2022/2292 hinsichtlich
    der Anforderungen an den Eingang in die Union von Honig, Fleisch, hochverarbeiteten
    Erzeugnissen, Gelatinekapseln und Fischereierzeugnissen sowie der Anforderungen
    an die private Bestätigung und zur Änderung der Delegierten Verordnung (EU)
    2021/630 hinsichtlich der Anforderungen an die private Bestätigung für von den
    amtlichen Kontrollen an Grenzkontrollstellen ausgenommene zusammengesetzte Erzeugnisse
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/2652 на Комисията
