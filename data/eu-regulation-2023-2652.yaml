    maidir le fianú príobháideach agus lena leasaítear Rialachán Tarmligthe (AE)
    2021/630 a mhéid a bhaineann le ceanglais maidir le fianú príobháideach le
    haghaidh táirgí ilchodacha atá díolmhaithe ó rialuithe oifigiúla ag poist
    rialaithe teorann
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/2652 оd 15. rujna 2023. o izmjeni
    i ispravku Delegirane uredbe (EU) 2022/2292 u pogledu zahtjeva koji se primjenjuju
    na ulazak u Uniju meda, mesa, visokorafiniranih proizvoda, želatinskih kapsula
    i proizvoda ribarstva i zahtjeva za prilaganje privatne potvrde te o izmjeni Delegirane
    uredbe (EU) 2021/630 u pogledu zahtjeva za prilaganje privatne potvrde za mješovite
    proizvode izuzete od službenih kontrola na graničnim kontrolnim postajama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2652 felhatalmazáson alapuló rendelete (2023.
