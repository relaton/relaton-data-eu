    unioniin tuloa koskevien vaatimusten ja yksityistä varmennusta koskevien vaatimusten
    osalta sekä delegoidun asetuksen (EU) 2021/630 muuttamisesta rajatarkastusasemilla
    suoritettavasta virallisesta valvonnasta vapautettuja yhdistelmätuotteita koskevien
    yksityistä varmennusta koskevien vaatimusten osalta
  type: main
