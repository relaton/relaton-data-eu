title:
- language: en
  script: Latn
  content: '79/151/EEC: Commission Decision of 21 December 1978 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of premiums paid during
    1977 for the non-marketing of milk and milk products and for the conversion of
    dairy herds (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/151/CEE: Décision de la Commission, du 21 décembre 1978, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des primes versées pendant l''année
    1977 pour la non-commercialisation du lait et des produits laitiers et la reconversion
    de troupeaux bovins à orientation laitière (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/151/EWG: Entscheidung der Kommission vom 21. Dezember 1978 über die
    Erstattung der im Jahr 1977 für die Nichtvermarktung von Milch und Milcherzeugnissen
    und die Umstellung der Milchkuhbestände gezahlten Prämien durch den EAGFL, Abteilung
    Ausrichtung, an das Vereinigte Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/151/EØF: Kommissionens beslutning af 21. december 1978 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af præmier, der
    er udbetalt i løbet af året 1977 for ikke-markedsføring af mælk og mejeriprodukter
    og for omstilling af malkekvægsbesætninger (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/151/CEE: Decisione della Commissione, del 21 dicembre 1978, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno Unito dei premi
    versati nel 1977 per la non commercializzazione del latte e dei prodotti lattiero-caseari
    e per la riconversione di mandrie bovine ad orientamento lattiero (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/151/EEG: Beschikking van de Commissie van 21 december 1978 betreffende
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk van
