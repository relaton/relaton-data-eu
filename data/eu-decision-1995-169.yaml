title:
- language: en
  script: Latn
  content: '95/169/EC: Commission Decision of 12 May 1995 amending Decision 94/617/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1995 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '95/169/CE: Décision de la Commission du 12 mai 1995 modifiant la décision
    94/617/CE adoptant le plan portant attribution aux États membres de ressources
    imputables à l''exercice 1995 pour l''exécution des fournitures de denrées
    alimentaires provenant des stocks d''intervention au bénéfice des personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '95/169/EG: ENTSCHEIDUNG DER KOMMISSION vom 12. Mai 1995 zur Änderung
    der Entscheidung 94/617/EG zur Annahme des Plans über die Bewilligung von Mitteln,
    die den Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1995 zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '95/169/EF: KOMMISSIONENS BESLUTNING af 12. maj 1995 om ændring af beslutning
    94/617/EF om vedtagelse af planen for tildeling til medlemsstaterne af midler,
    der skal afholdes over 1995-budgettet, og som skal dække udgifterne til levering
    af levnedsmidler fra interventionslagre til de socialt dårligst stillede personer
    i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '95/169/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 12ης Μαΐου
    1995 που τροποποιεί την απόφαση 94/617/ΕΚ για την
    έγκριση του προγράμματος για την κατανομή
    στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1995 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στους άπορους της Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '95/169/EY: Komission päätös, tehty 12 päivänä toukokuuta 1995, varainhoitovuodelle
    1995 kuuluvien varojen jakamista jäsenvaltioille interventiovarastoista lähtöisin
    olevien elintarvikkeiden toimittamiseksi yhteisön vähävaraisimmille henkilöille
    koskevasta suunnitelmasta tehdyn päätöksen 94/617/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '95/169/CE: DECISIONE DELLA COMMISSIONE del 12 maggio 1995 che modifica
    la decisione 94/617/CE che approva il piano di ripartizione agli Stati membri
    delle risorse da imputare all'' esercizio finanziario 1995 per l'' esecuzione
    delle forniture di derrate alimentari provenienti dalle scorte d'' intervento
    a favore degli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '95/169/EG: BESCHIKKING VAN DE COMMISSIE van 12 mei 1995 tot wijziging
    van Beschikking 94/617/EG tot vaststelling van het jaarplan voor de toewijzing
    aan de Lid-Staten van voor het begrotingsjaar 1995 te boeken financiële middelen
    voor de levering van levensmiddelen uit interventievoorraden aan de meest hulpbehoevenden
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '95/169/CE: DECISÃO DA COMISSÃO de 12 de Maio de 1995 que altera a Decisão
    94/617/CE, que adopta o plano que atribui aos Estados-membros recursos a incluir
    no exercício orçamental de 1995 para o fornecimento de géneros alimentícios
    provenientes das existências de intervenção a favor das pessoas mais necessitadas
    na Comunidade'
  type: main
- language: es
  script: Latn
  content: '95/169/CE: DECISIÓN DE LA COMISIÓN de 12 de mayo de 1995 por la que
    se modifica la Decisión 94/617/CE por la que se adopta el plan que establece
    la asignación a los Estados miembros de recursos imputables al ejercicio presupuestario
    de 1995 para el suministro de alimentos procedentes de las existencias de intervención
    en beneficio de las personas más necesitadas de la Comunidad'
  type: main
- language: sv
  script: Latn
  content: '95/169/EG: Kommissionens beslut av den 12 maj 1995 ändring av beslut
    94/617/EG om fastställande av planen för att tilldela medlemsstaterna resurser
    som hänförs till räkenskapsåret 1995 för leverans av livsmedel från interventionslager
    till de sämst ställda personerna i gemenskapen'
  type: main
