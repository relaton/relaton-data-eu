    e agli apparecchi fotografici d' ingrandimento o di riduzione, della voce 90.09
    della tariffa doganale comune, originari di Singapore, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 708/81 van de Commissie van 18 maart 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op projectietoestellen
    voor niet bewegende beelden ; vergrotings- en verkleiningstoestellen voor de fotografie
    van tariefpost 90.09, van oorsprong uit Singapore, waarvoor de in Verordening
    (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn verleend
