title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 708/81 of 18 March 1981 reintroducing the
    levying of customs duties applicable to image projectors; photographic enlargers
    and reducers falling within heading No 90.09, originating in Singapore and benefiting
    from the tariff preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 708/81 de la Commission, du 18 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixe, appareils d' agrandissement ou de réduction photographiques
    de la position 90.09 du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues au règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 708/81 der Kommission vom 18. März 1981 zur Wiedereinführung
    der Erhebung der Zölle für Stehbildwerfer ; photographische Vergrößerungs-
    oder Verkleinerungsapparate, der Tarifnummer 90.09, mit Ursprung in Singapur,
    dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 708/81 af 18. marts 1981 om genindførelse
    af opkrævning af told for lysbilledapparater; forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), henhørende under pos. 90.09
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 708/81 τής Επιτροπής
