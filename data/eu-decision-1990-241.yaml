title:
- language: en
  script: Latn
  content: '90/241/EEC: Commission Decision of 22 May 1990 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of photo
    albums originating in South Korea and Hong Kong, and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '90/241/CEE: Décision de la Commission du 22 mai 1990 portant acceptation
    des engagements offerts en rapport avec la procédure antidumping concernant les
    importations de certains albums photographiques originaires de Corée du Sud et
    de Hong-Kong et portant clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 22. Mai 1990 zur Annahme von Verpflichtungen
    im Rahmen des Antidumpingverfahrens betreffend die Einfuhren von Fotoalben mit
    Ursprung in Suedkorea und Hongkong und zur Einstellung der Untersuchung (90/241/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 22. maj 1990 om godtagelse af tilsagn i forbindelse
    med antidumpingundersoegelsen vedroerende importen af fotoalbum med oprindelse
    i Sydkorea og Hong Kong og om afslutning af denne undersoegelse (90/241/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/241/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Μαΐου 1990 για την αποδοχή ανάληψης υποχρεώσεων
    σχετικά με τη διαδικασία αντιντάμπινγκ όσον
    αφορά τις εισαγωγές λευκωμάτων για φωτογραφίες
    καταγωγής Νότιας Κορέας και Χονγκ Κονγκ και
    για την περάτωση της έρευνας'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 maggio 1990 recante accettazione degli
    impegni offerti nell'ambito della procedura antidumping relativa alle importazioni
    di album per fotografie originari della Corea del Sud e di Hong Kong e chiusura
    dell'inchiesta (90/241/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 22 mei 1990 tot aanvaarding van de in verband
    met de anti-dumpingprocedure betreffende de invoer van fotoalbums van oorsprong
    uit Zuid-Korea en Hong Kong aangeboden verbintenissen en tot beëindiging van
    het onderzoek (90/241/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Maio de 1990 que aceita os compromissos oferecidos
