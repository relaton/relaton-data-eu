    originarios da Coreia do Sul e de Hong Kong e que encerra o inquérito (90/241/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 22 de mayo de 1990 por la que se aceptan los
    compromisos ofrecidos por lo que respecta al procedimiento antidumping relativo
    a las importaciones de albumes de fotos originarios de Corea del Sur y de Hong
    Kong y se da por concluida la investigacion (90/241/CEE)
