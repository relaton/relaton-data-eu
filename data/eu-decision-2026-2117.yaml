  script: Latn
  content: Commission Implementing Decision (EU) 2026/2117 of 23 September 2026 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 94313 pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2026)
    6606)
  type: main
- language: fr
  script: Latn
