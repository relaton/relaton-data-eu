title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2720/71 de la Commission, du 21 décembre 1971, fixant
    pour la campagne sucrière 1971/1972 le montant maximum pour la participation
    aux frais de stockage que les fabricants de sucre peuvent, en cas de report, exiger
    des producteurs de betteraves et de cannes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2720/71 der Kommission vom 21. Dezember 1971 zur Festsetzung
    des Höchstbetrags, den die Zuckerhersteller im Zuckerwirtschaftsjahr 1971/1972
    bei Übertragungen von den Zuckerrüben- und Zuckerrohrerzeugern als Beteiligung
    an den Lagerkosten fordern können
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2720/71 della Commissione, del 21 dicembre 1971, che
    fissa per la campagna saccarifera 1971/1972 l'importo massimo di partecipazione
    alle spese di magazzinaggio che i fabbricanti di zucchero, in caso di riporto,
    possono esigere dai produttori di barbabietole e di canna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2720/71 van de Commissie van 21 december 1971 tot
    vaststelling voor het verkoopseizoen voor suiker 1971/1972 van het maximumbedrag
    van het aandeel in de opslagkosten dat de suikerfabrikanten in geval van overbrenging
    kunnen eisen van de suikerbieten- en suikerrietproducenten
  type: main
