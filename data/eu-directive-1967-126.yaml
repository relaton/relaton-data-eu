    WELKE DOOR DE ITALIAANSE REPUBLIEK WORDT TOEGEPAST BIJ DE INVOER VAN BEPAALDE
    PRODUKTEN DIE ALCOHOL AFKOMSTIG UIT ANDERE LID-STATEN BEVATTEN ( 67/126/EEG )
