    appliqué à l'importation par la République italienne sur certains produits
    contenant de l'alcool en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: RICHTLINIE DER KOMMISSION VOM 31. JANUAR 1967 ZUR FESTLEGUNG DER ZEITFOLGE
    FUER DIE AUFHEBUNG DER HERSTELLUNGSSTEUER ( SOVRIMPOSTA DI CONFINE ), DIE VON
    DER ITALIENISCHEN REPUBLIK BEI DER EINFUHR VON BESTIMMTEN ALKOHOL ENTHALTENDEN
    WAREN AUS DEN UEBRIGEN MITGLIEDSTAATEN ERHOBEN WIRD ( 67/126/EWG )
  type: main
- language: it
  script: Latn
  content: Direttiva 67/126/CEE della Commissione, del 31 gennaio 1967, che determina
    il ritmo di abolizione dell'imposta di fabbricazione applicata dalla Repubblica
    Italiana sulle importazioni di alcuni prodotti contenenti alcol, in provenienza
    dagli altri Stati Membri
  type: main
- language: nl
  script: Latn
  content: RICHTLIJN VAN DE COMMISSIE VAN 31 JANUARI 1967 HOUDENDE VASTSTELLING VAN
