title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 659/80 of 19 March 1980 re-establishing
    the levying of customs duties on gloves, including mittens and mitts, falling
    within subheading 42.03 B I and originating in developing countries, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 659/80 de la Commission, du 19 mars 1980, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de la sous-position 42.03 B I du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 659/80 der Kommission vom 19. März 1980 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Fausthandschuhe, der Tarifstelle
    42.03 B I, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 659/80 af 19. marts 1980 om genindførelse
    af opkrævning af toldafgifter for handsker (herunder vanter), såvel syede som
    kun tilskårne, under pos. 42.03 B I, som har oprindelse i udviklingslande og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 659/80 della Commissione, del 19 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili ai guanti, comprese le muffole, della
    sottovoce 42.03 B I della tariffa doganale comune, originari dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 659/80 van de Commissie van 19 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor handschoenen en wanten
    van post 42.03 B I, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
