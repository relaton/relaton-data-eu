---
id: EUDecision1996503
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '96/503/EC: Commission Decision of 26 July 1996 authorizing Portugal and
    the United Kingdom to pay the processing premium provided for in Council Regulation
    (EEC) No 805/68 on the common organization of the market in beef and veal, for
    animals withdrawn from production before exceeding the age of 20 days (Only the
    English and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/503/CE: Décision de la Commission du 26 juillet 1996 autorisant le
    Portugal et le Royaume-Uni à payer la prime de transformation prévue par le
    règlement (CEE) nº 805/68 du Conseil portant organisation commune des marchés
    dans le secteur de la viande bovine pour des animaux retirés de la production
    avant d''avoir dépassé l''âge de vingt jours (Les textes en langues anglaise
    et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/503/EG: Entscheidung der Kommission vom 26. Juli 1996 zur Ermächtigung
    Portugals und des Vereinigten Königreichs, die mit der Verordnung (EWG) Nr. 805/68
    des Rates vorgesehene Verarbeitungsprämie für im Alter von weniger als 20 Tagen
    aus der Produktion genommene Tiere zu gewähren (Nur der englische und der portugiesische
    Wortlaut sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/503/EF: Kommissionens beslutning af 26. juli 1996 om bemyndigelse af
    Portugal og Det Forenede Kongerige til at udbetale den i Rådets forordning (EØF)
    nr. 805/68 om den fælles markedsordning for oksekød fastsatte forarbejdningspræmie
    for dyr, der fjernes fra produktionen, inden de er over tyve dage gamle (Kun den
    engelske og den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/503/ΕΚ: Απόφαση της Επιτροπής της 26ης Ιουλίου
    1996 που επιτρέπει στην Πορτογαλία και στο Ηνωμένο
    Βασίλειο να καταβάλουν την πριμοδότηση μεταποίησης
    η οποία προβλέπεται από τον κανονισμό (ΕΟΚ)
    αριθ. 805/68 του Συμβουλίου για την κοινή οργάνωση
    αγοράς στον τομέα του βοείου κρέατος, για τα
    ζώα που αποσύρονται από την παραγωγή προτού
    υπερβούν την ηλικία των είκοσι ημερών (Τα κείμενα
    στην πορτογαλική και αγγλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '96/503/EY: Komission päätös, tehty 26 päivänä heinäkuuta 1996,
    luvan antamisesta Portugalille ja Yhdistyneelle kuningaskunnalle maksaa naudanliha-alan
    yhteisestä markkinajärjestelystä annetussa neuvoston asetuksessa (ETY) N:o
    805/68 säädettyä jalostuspalkkiota eläimille, jotka on poistettu tuotannosta
    ennen kuin ne ovat yli kahdenkymmenen päivän ikäisiä (Ainoastaan portugalin-
    ja englanninkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '96/503/CE: Decisione della Commissione del 26 luglio 1996 che autorizza
    il Portogallo e il Regno Unito a pagare il premio di trasformazione previsto dal
    regolamento (CEE) n. 805/68 del Consiglio, relativo all''organizzazione comune
    dei mercati nel settore delle carni bovine, per animali ritirati dalla produzione
    prima di aver superato l''età di venti giorni (I testi in lingua inglese e portoghese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '96/503/EG: Beschikking van de Commissie van 26 juli 1996 houdende machtiging
    van Portugal en het Verenigd Koninkrijk tot betaling van de bij Verordening (EEG)
    nr. 805/68 van de Raad houdende een gemeenschappelijke ordening der markten in
    de sector rundvlees vastgestelde verwerkingspremie voor kalveren die uit produktie
    worden genomen vóórdat zij ouder zijn dan 20 dagen (Slechts de teksten in de
    Engelse en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/503/CE: Decisão da Comissão de 26 de Julho de 1996 que autoriza Portugal
    e o Reino Unido a pagar o prémio para a transformação de animais retirados
    da produção antes de ultrapassarem vinte dias de idade, previsto pelo Regulamento
    (CEE) n° 805/68 do Conselho que estabelece a organização comum de mercado no
    sector da carne de bovino (Apenas fazem fé os textos nas línguas inglesa e portuguesa)'
  type: main
- language: es
  script: Latn
  content: '96/503/CE: Decisión de la Comisión de 26 de julio de 1996 por la que
    se autoriza a Portugal y al Reino Unido a pagar la prima de transformación contemplada
    en el Reglamento (CEE) nº 805/68 del Consejo por el que se establece la organización
    común de mercados en el sector de la carne de bovino por los animales retirados
    de la producción antes de superar los veinte días de edad (Los textos en lenguas
    portuguesa e inglesa son los únicos auténticos)'
  type: main
- language: sv
  script: Latn
  content: '96/503/EG: Kommissionens beslut av den 26 juli 1996 om bemyndigande av
    Portugal och Förenade kungariket att utbetala det bearbetningsbidrag som föreskrivs
    genom rådets förordning (EEG) nr 805/68 om den gemensamma organisationen av
    marknaden för nötkött för djur som tagits ur produktion innan de är äldre
    än tjugo dagar gamla (Endast de portugisiska och engelska texterna är giltiga)'
  type: main
