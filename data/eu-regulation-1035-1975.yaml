  script: Latn
  content: Regulation (EEC) No 1035/75 of the Council of 21 April 1975 laying down
    general rules for the supply of skimmed-milk powder under the 1975 food-aid programme
    to the United Nations Children's Fund (UNICEF) for those affected by the events
    in South Vietnam
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1035/75 du Conseil, du 21 avril 1975, établissant
    les règles générales relatives à la fourniture au Fonds des Nations Unies
    pour l'enfance (UNICEF), dans le cadre du programme d'aide alimentaire de 1975,
    de lait écrémé en poudre destiné aux populations affectées par les événements
    au Vietnam du Sud
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1035/75 des Rates vom 21. April 1975 zur Festlegung
