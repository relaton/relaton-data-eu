    en ce qui concerne la modification de l’annexe II (Réglementations techniques,
    normes, essais et certification) et du protocole 37 comportant la liste prévue
    à l’article 101 de l’accord EEE (Rôle renforcé de l’EMA dans la préparation
    aux crises et la gestion de celles-ci en ce qui concerne les médicaments et les
    dispositifs médicaux)
