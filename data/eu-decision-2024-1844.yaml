  script: Latn
  content: Council Decision (EU) 2024/1844 of 25 June 2024 on the position to be adopted,
    on behalf of the European Union, within the EEA Joint Committee concerning the
    amendment of Annex II (Technical regulations, standards, testing and certification)
    and Protocol 37 containing the list provided for in Article 101 to the EEA Agreement
    (Reinforced role for EMA in crisis preparedness and management for medicinal products
    and medical devices)
  type: main
- language: fr
