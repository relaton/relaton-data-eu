  content: Commission Regulation (EEC) No 2573/76 of 22 October 1976 on the invitation
    to tender for the supply to the Catholic Relief Service and to UNICEF, for use
    as food aid, of vitaminized skimmed-milk powder to be purchased on the Community
    Market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2573/76 de la Commission, du 22 octobre 1976, relatif
    à l'adjudication de la fourniture, au titre de l'aide alimentaire, de lait écrémé
    en poudre vitaminé acheté sur le marché de la Communauté au Catholic Relief
    Service et à l'UNICEF
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2573/76 der Kommission vom 22. Oktober 1976 über
    die Ausschreibung einer Lieferung von auf dem Markt der Gemeinschaft gekauftem
    Magermilchpulver mit zugesetzten Vitaminen an den Catholic Relief Service und
    an den UNICEF im Rahmen der Nahrungsmittelhilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2573/76 af 22. oktober 1976 om licitation
    med henblik på levering af vitaminiseret skummetmælkspulver, der er opkøbt
    på Fællesskabets marked, til Catholic Relief Service og UNICEF
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2573/76 della Commissione, del 22 ottobre 1976, che
    indice una gara per la fornitura, a titolo di aiuto alimentare, di latte scremato
    in polvere vitaminizzato, acquistato sul mercato della Comunità, al Catholic
    Relief Service e all'UNICEF
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2573/76 van de Commissie van 22 oktober 1976 met
