    van bepaalde granen die worden uitgevoerd in de vorm van graanpreparaten verkregen
    door poffen of door roosteren
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1035/90 DA COMISSAO de 26 de Abril de 1990 que prorroga
