  script: Latn
  content: Commission Regulation (EEC) No 1035/90 of 26 April 1990 prolonging the
    suspension in advance fixing of export refunds of certain cereals exported in
    the form of prepared foods obtained by the swelling or roasting of cereals or
    cereal products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1035/90 de la Commission du 26 avril 1990 portant
    prorogation de la suspension de la fixation à l'avance des restitutions à l'exportation
    de certaines céréales exportées sous forme de produits à base de céréales
    obtenus par soufflage ou grillage
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1035/90 DER KOMMISSION vom 26. April 1990 zur Verlaengerung
    der Aussetzung der Vorausfestsetzung der Ausfuhrerstattungen fuer in Form von
    Lebensmitteln, durch Aufblaehen oder Roesten von Getreide oder Getreideerzeugnissen
    hergestellt, ausgefuehrtes Getreide
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1035/90 af 26. april 1990 om forlænget
    suspension af forudfastsættelse af eksportrestitutioner for visse kornsorter,
    der udføres i form af varer fremstillet ved ekspandering eller ristning af korn
    eller kornprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1035/90 της Επιτροπής
    της 26ης Απριλίου 1990 για την παράταση της αναστολής
    του προκαθορισμού των επιστροφών κατά την
    εξαγωγή ορισμένων σιτηρών που εξάγονται υπό
    μορφή παρασκευασμένων τροφίμων που λαμβάνονται
    με διόγκωση ή φρύξη σιτηρών ή προϊόντων σιτηρών
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1035/90 DELLA COMMISSIONE del 26 aprile 1990 che proroga
    la sospensione della fissazione anticipata delle restituzioni all'esportazione
    di alcuni cereali esportati sotto forma di prodotti a base di cereali ottenuti
    per soffiatura o tostatura
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1035/90 VAN DE COMMISSIE van 26 april 1990 houdende
