title:
- language: en
  script: Latn
  content: '86/367/EEC: Commission Decision of 20 June 1986 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of synthetic textile
    fibres (discontinuous), not carded, combed or otherwise prepared for spinning,
    of polyamides, originating in Romania, which have been put into free circulation
    in the Community (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/367/CEE: Décision de la Commission du 20 juin 1986 autorisant la République
    italienne à procéder à une surveillance intracommunautaire des importations
    de fibres textiles synthétiques discontinues en masse, de polyamides, originaires
    de Roumanie et mises en libre pratique dans la Communauté (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/367/EWG: Entscheidung der Kommission vom 20. Juni 1986 zur Ermächtigung
    der Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Rumänien stammenden und in der Gemeinschaft im freien Verkehr
    befindlichen synthetischen Spinnfasern, weder gekrempelt noch gekämmt, aus Polyamid
    (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/367/EØF: Kommissionens beslutning af 20. juni 1986 om bemyndigelse
    af Den italienske Republik til at indføre tilsyn inden for Fællesskabet med
    importen af korte syntetiske fibre, ikke kartede, kæmmede eller på anden måde
    beredt til spinding, af polyamid, som har oprindelse i Rumænien og er overgået
    til fri omsætning i Fællesskabet (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/367/ΕΟΚ: Απόφαση της Επιτροπής της 20ής
    Ιουνίου 1986 για τη χορήγηση αδείας στην Ιταλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επίβλεψη
    των εισαγωγών συνθετικών υφαντικών ινών, μη
    συνεχών, σε μάζες, από πολυαμίδα, καταγωγής
    Ρουμανίας, που τίθενται σε ελεύθερη κυκλοφορία
    στην Κοινότητα (Το κείμενο στην ιταλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/367/CEE: Decisione della Commissione del 20 giugno 1986 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di fibre tessili sintetiche poliammidiche in fiocco originarie della Romania e
    messe in libera pratica nella Comunità (Il testo in lingua italiana è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/367/EEG: Beschikking van de Commissie van 20 juni 1986 houdende machtiging
    van de Italiaanse Republiek tot toepassing van intracommunautair toezicht ten
    aanzien van de invoer van synthetische stapelvezels van polyamide, van oorsprong
    uit Roemenië, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/367/CEE: Decisão da Comissão de 20 de Junho de 1986 que autoriza
    a República italiana a proceder a uma vigilância intracomunitária das importações
    de fibras têxteis sintéticas descontínuas em rama, de poliamidas originárias
    da Roménia e introduzidas em livre prática na Comunidade (Apenas faz fé o texto
    em língua italiana)'
  type: main
- language: es
