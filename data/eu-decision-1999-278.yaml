---
id: EUDecision1999278
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/278/EC: Council Decision of 9 March 1999 relating to the conclusion
    of a Protocol adjusting trade aspects of the Europe Agreement between the European
    Communities and their Member States, of the one part, and the Republic of Bulgaria,
    of the other part, to take account of the accession of the Republic of Austria,
    the Republic of Finland and the Kingdom of Sweden to the European Union and the
    outcome of the Uruguay Round negotiations on agriculture, including improvements
    to the existing preferential arrangements'
  type: main
- language: fr
  script: Latn
  content: '1999/278/CE: Décision du Conseil du 9 mars 1999 relative à la conclusion
    du protocole portant adaptation des aspects commerciaux de l''accord européen
    entre les Communautés européennes et leurs États membres, d''une part, et la
    République de Bulgarie, d''autre part, afin de tenir compte de l''adhésion de
    la République d''Autriche, de la République de Finlande et du Royaume de Suède
    à l''Union européenne ainsi que du résultat des négociations agricoles du
    cycle d''Uruguay, et notamment des améliorations du régime préférentiel existant'
  type: main
- language: de
  script: Latn
  content: '1999/278/EG: Beschluß des Rates vom 9. März 1999 über den Abschluß
    des Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der
    Republik Bulgarien andererseits zur Berücksichtigung des Beitritts der Republik
    Österreich, der Republik Finnland und des Königreichs Schweden zur Europäischen
    Union und der Ergebnisse der Agrarverhandlungen der Uruguay-Runde einschließlich
    der Verbesserung der bestehenden Präferenzregelung'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 9. března 1999 o uzavření Protokolu, kterým
    se upravují obchodní aspekty Evropské dohody mezi Evropskými společenstvími
    a jejich členskými státy na jedné straně a Bulharskou republikou na straně
    druhé s ohledem na přistoupení Rakouské republiky, Finské republiky a Švédského
    království k Evropské unii a s ohledem na závěry Uruguayského kola jednání
    o zemědělství, včetně zlepšení stávajícího preferenčního režimu
  type: main
- language: da
  script: Latn
  content: '1999/278/EF: Rådets afgørelse af 9. marts 1999 om indgåelse af en protokol
    om tilpasning af handelsaspekterne i Europaaftalen mellem De Europæiske Fællesskaber
    og deres medlemsstater på den ene side og Republikken Bulgarien på den anden
    side for at tage hensyn til Republikken Finlands, Kongeriget Sveriges og Republikken
    Østrigs tiltrædelse af Den Europæiske Union og resultaterne af landbrugsforhandlingerne
    under Uruguay-runden, også forbedringerne af den eksisterende præferenceordning'
  type: main
- language: el
  script: Grek
  content: '1999/278/EK: Απόφαση του Συμβουλίου, της 9ης
    Μαρτίου 1999, για τη σύναψη πρωτοκόλλου για την
    προσαρμογή των εμπορικών πτυχών της ευρωπαϊκής
    συμφωνίας μεταξύ των Ευρωπαϊκών Κοινοτήτων
    και των κρατών μελών τους, αφενός, και της Δημοκρατίας
    της Βουλγαρίας, αφετέρου, προκειμένου να ληφθούν
    υπόψη η προσχώρηση της Δημοκρατίας της Αυστρίας,
    της Δημοκρατίας της Φινλανδίας και του Βασιλείου
    της Σουηδίας στην Ευρωπαϊκή Ένωση και τα αποτελέσματα
    των γεωργικών διαπραγματεύσεων του Γύρου της
    Ουρουγουάης, συμπεριλαμβανομένων των βελτιώσεων
    του ισχύοντος προτιμησιακού καθεστώτος'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 9. märts 1999, mis käsitleb protokolli sõlmimist, millega
    kohandatakse Euroopa ühenduste ja nende liikmesriikide ning Bulgaaria Vabariigi
    vahelise assotsiatsiooni loomist käsitleva Euroopa lepingu kaubandusaspekte,
    et võtta arvesse Austria Vabariigi, Soome Vabariigi ja Rootsi Kuningriigi ühinemist
    Euroopa Liiduga ja põllumajandusläbirääkimiste Uruguay vooru tulemusi, sealhulgas
    kehtiva sooduskorra täiendusi
  type: main
- language: fi
  script: Latn
  content: '1999/278/EY: Neuvoston päätös, tehty 9 päivänä maaliskuuta 1999,
    Euroopan yhteisöjen ja niiden jäsenvaltioiden sekä Bulgarian tasavallan Eurooppa-sopimuksen
    kauppaa koskevien määräysten mukauttamista koskevan pöytäkirjan tekemisestä
    Itävallan tasavallan, Suomen tasavallan ja Ruotsin kuningaskunnan Euroopan unioniin
    liittymisen ja Uruguayn kierroksen maataloutta koskevien neuvottelujen tulosten,
    mukaan lukien voimassa olevan etuusjärjestelyn parannukset, huomioon ottamiseksi'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1999. március 9.) a Finn Köztársaság, az Osztrák
    Köztársaság és a Svéd Királyság Európai Unióhoz való csatlakozásának,
    valamint az Uruguayi Forduló során a mezőgazdasági tárgyalásokon elért
    eredményeknek, többek között a meglévő preferenciális rendszer javításának
    figyelembevétele céljából, az egyrészről az Európai Közösségek és azok
    tagállamai, másrészről a Bolgár Köztársaság között létrejött Európa-megállapodás
    kereskedelmi vonatkozásainak kiigazításáról szóló jegyzőkönyv megkötéséről
  type: main
- language: it
  script: Latn
  content: '1999/278/CE: Decisione del Consiglio, del 9 marzo 1999, relativa alla
    conclusione del protocollo di adeguamento degli aspetti commerciali dell''accordo
    europeo tra le Comunità europee e i loro Stati membri, da una parte, e la Repubblica
    di Bulgaria, dall''altra, per tener conto dell''adesione della Repubblica d''Austria,
    della Repubblica di Finlandia e del Regno di Svezia all''Unione europea e dei
    risultati dei negoziati agricoli dell''Uruguay Round, compresi i miglioramenti
    del regime preferenziale esistente'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1999. gada 9. marts) par tāda protokola noslēgšanu,
    ar ko koriģē tirdzniecības aspektus Eiropas Nolīgumā starp Eiropas Kopienām
    un to dalībvalstīm, no vienas puses, un Bulgārijas Republiku, no otras puses,
    lai ņemtu vērā Austrijas Republikas, Somijas Republikas un Zviedrijas Karalistes
    pievienošanos Eiropas Savienībai, kā arī Urugvajas raunda lauksaimniecības
    sarunu rezultātus, ieskaitot uzlabojumus esošajā preferenču sistēmā
  type: main
- language: lt
  script: Latn
  content: 1999 m. kovo 9 d. Tarybos sprendimas dėl Protokolo, patikslinančio Europos
    sutarties tarp Europos Bendrijų bei jų valstybių narių ir Bulgarijos Respublikos
    prekybos aspektus, sudarymo, siekiant atsižvelgti į Austrijos Respublikos, Suomijos
    Respublikos ir Švedijos Karalystės stojimą į Europos Sąjungą bei Urugvajaus
    raundo derybų dėl žemės ūkio rezultatus, įskaitant taikomų lengvatinių
    priemonių gerinimą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tad-9 ta' Marzu 1999 dwar il-konklużjoni ta'
    Protokoll li jbiddel l-aspetti kummerċjali tal-Ftehim Ewropew bejn il-Komunitajiet
    Ewropej u l-Istati Membri tagħhom, min-naħa l-waħda, u r-Repubblika tal-Bulgarija,
    min-naħa l-oħra, sabiex jiġu kkonsidrati l-isħubija tar-Repubblika ta' l-Awstrija,
    r-Repubblika tal-Finlandja u r-Renju ta' l-Isvezja fl-Unjoni Ewropea u l-eżitu
    tan-negozjati dwar l-agrikoltura ta' l-Urugway Round, inkluż titjib fl-arranġamenti
    preferenzjali eżistenti.
  type: main
- language: nl
  script: Latn
  content: '1999/278/EG: Besluit van de Raad van 9 maart 1999 betreffende de sluiting
    van het protocol tot aanpassing van de handelsaspecten van de Europaovereenkomst
    tussen de Europese Gemeenschappen en hun lidstaten, enerzijds, en de Republiek
    Bulgarije, anderzijds, in verband met de toetreding van de Republiek Finland,
    de Republiek Oostenrijk en het Koninkrijk Zweden tot de Europese Unie en de resultaten
    van de landbouwonderhandelingen van de Uruguayronde, met inbegrip van de verbeteringen
    van de huidige preferentiële regeling'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 9 marca 1999 r. odnosząca się do zawarcia Protokołu
    dostosowującego aspekty handlowe Układu Europejskiego między Wspólnotami Europejskimi
    i ich Państwami Członkowskimi, z jednej strony, a Republiką Bułgarii, z drugiej
    strony, w celu uwzględnienia przystąpienia Republiki Austrii, Republiki Finlandii
    i Królestwa Szwecji do Unii Europejskiej oraz wyników negocjacji Rundy Urugwajskiej
    w sprawie rolnictwa, włączając poprawę istniejących uzgodnień preferencyjnych
  type: main
- language: pt
  script: Latn
  content: '1999/278/CE: Decisão do Conselho, de 9 de Março de 1999, relativa à
    conclusão do protocolo que adapta os aspectos comerciais do Acordo Europeu entre
    as Comunidades Europeias e os seus Estados-membros, por um lado, e a República
    da Bulgária, por outro, a fim de ter em conta a adesão da República da Áustria,
    da República da Finlândia e do Reino da Suécia à União Europeia, assim como
    os resultados das negociações do Uruguay Round no domínio agrícola, incluindo
    as melhorias do regime preferencial existente'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 9. marca 1999, o uzavretí protokolu, ktorý upravuje
    obchodné aspekty Európskej dohody medzi Európskymi spoločenstvami a ich členskými
    štátmi na jednej strane a Bulharskou republikou na druhej strane, aby sa vzalo
    na vedomie pristúpenie Rakúskej republiky, Fínskej republiky a Švédskeho
    kráľovstva k Európskej únii, a výsledky uruguajského kola rokovaní o poľnohospodárstve,
    vrátane zlepšenia existujúcich preferenčných opatrení
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 9. marca 1999 o sklenitvi Protokola o prilagoditvi trgovinskih
    vidikov Evropskega sporazuma med Evropskimi skupnostmi in njihovimi državami
    članicami na eni strani ter Republiko Bolgarijo na drugi, da se upošteva pristop
    Republike Avstrije, Republike Finske in Kraljevine Švedske k Evropski uniji ter
    rezultate urugvajskega kroga pogajanj o kmetijstvu, vključno z izboljšavami
    obstoječih preferencialnih ureditev
  type: main
- language: es
  script: Latn
  content: '1999/278/CE: Decisión del Consejo, de 9 de marzo de 1999, relativa a
    la celebración del Protocolo para la adaptación de los aspectos comerciales
    del Acuerdo europeo entre las Comunidades Europeas y sus Estados miembros, por
    una parte, y la República de Bulgaria, por otra, para tener en cuenta la adhesión
    de la República de Austria, de la República de Finlandia y del Reino de Suecia
    a la Unión Europea, así como los resultados de las negociaciones agrícolas
    de la Ronda Uruguay, incluida la mejora del actual régimen preferencial'
  type: main
- language: sv
  script: Latn
  content: '1999/278/EG: Rådets beslut av den 9 mars 1999 om antagande av protokollet
    om anpassning av handelsaspekterna i Europaavtalet mellan Europeiska gemenskaperna
    och deras medlemsstater, å ena sidan, och Bulgarien, å andra sidan, för att
    beakta Republiken Österrikes, Republiken Finlands och Konungariket Sveriges anslutning
    till Europeiska unionen och resultaten av jordbruksförhandlingarna inom Uruguayrundan,
    däribland förbättringarna av den befintliga förmånsordningen'
