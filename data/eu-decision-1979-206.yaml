id: EUDecision1979206
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/206/EEC: Commission Decision of 2 February 1979 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof), falling within subheading 97.03 A or ex B of the
    Common Customs Tariff, originating in South Korea and in free circulation in the
    other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/206/CEE: Décision de la Commission, du 2 février 1979, autorisant
    la République française à exclure du traitement communautaire les jouets en
    bois et autres (à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées), des sous-positions
    ex 97.03 A et ex B du tarif douanier commun, originaires de la Corée du Sud et
    mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/206/EWG: Entscheidung der Kommission vom 2. Februar 1979, mit der die
    Französische Republik ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Spielzeuge aus Holz und andere (mit
    Ausnahme der Motoren und Bewegungsmechanismen für Spielzeuge und Modelle zum
    Spielen sowie deren Ersatzteile), der Tarifstellen 97.03 A und ex B des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/206/EØF: Kommissionens beslutning af 2. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil) som henhører under pos. 97.03 A og
    ex B i den fælles toldtarif, har oprindelse i Sydkorea og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/206/CEE: Decisione della Commissione, del 2 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e i meccanismi d''animazione per giocattoli e
    modelli ridotti ed i loro pezzi staccati), delle sottovoci 97.03 A e ex B della
    tariffa doganale comune, originari della Corea del Sud e messi in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/206/EEG: Beschikking van de Commissie van 2 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd speelgoed uit hout en andere (met uitzondering
    van animatiemotoren en mechanismen voor speelgoed en modellen op schaal als ook
    hun onderdelen) van post 97.03 A en ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
  type: main
