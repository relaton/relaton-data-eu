title:
- language: fr
  script: Latn
  content: Décision 66/85/CEE de la Commission, du 23 décembre 1965, portant prorogation
    de la validité de sa décision en date du 8 juillet 1964, relative au recours
    de la République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité,
    pour exclure du traitement communautaire le café, non torréfié, non décaféiné,
    de la position 09.01 A I A du Tarif douanier commun, originaire des pays autres
    que les EAMA et PTOM associés à la CEE, et mis en libre pratique dans les pays
    du Benelux
  type: main
- language: de
  script: Latn
  content: '66/85/EWG: Entscheidung der Kommission vom 23. Dezember 1965 zur Verlängerung
    der Geltungsdauer ihrer Entscheidung vom 8. Juli 1964 über den Antrag der Bundesrepublik
    Deutschland gemäß Artikel 115 Absatz (1) des Vertrages, nicht entkoffeinierten,
    nicht gerösteten Kaffee der Tarifnummer 09.01 A I a des Gemeinsamen Zolltarifs
    aus anderen Ländern als den assoziierten afrikanischen Staaten und Madagaskar
    und den mit der Gemeinschaft assoziierten überseeischen Ländern und Hoheitsgebieten,
    der in den Benelux-Ländern in den freien Verkehr gebracht worden ist, von der
    Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/85/CEE: Decisione della Commissione, del 23 dicembre 1965, che proroga
    la validità della decisione dell''8 luglio 1964, relativa al ricorso della Repubblica
    federale di Germania all''articolo 115, primo comma, del Trattato, allo scopo
    di escludere dal trattamento comunitario il caffè non torrefatto, non decaffeinizzato,
    di cui alla voce 09.01 A I a della tariffa doganale comune, originario di paesi
    che non siano gli Stati africani e Madagascar ed i paesi e territori d''oltremare
    associati alla CEE, e messo in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '66/85/EEG: Beschikking van de Commissie van 23 december 1965 houdende
    verlenging van de geldigheidsduur van haar beschikking van 8 juli 1964 betreffende
    het verzoek van de Bondsrepubliek Duitsland om op grond van artikel 115, eerste
    alinea, van het Verdrag, koffie, ongebrand, waaruit geen cafeïne is verwijderd,
    van post 09.01 A I a) van het gemeenschappelijk douanetarief, van oorsprong uit
    andere landen dan de geassocieerde Afrikaanse staten en Madagaskar en de met de
    Europese Economische Gemeenschap geassocieerde landen en gebieden overzee, die
    in de Beneluxlanden in het vrije verkeer is gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
