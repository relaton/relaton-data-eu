  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 585/96 del Consiglio, del 28 marzo 1996, che modifica
    il regolamento (CE) n. 1981/94, recante apertura e modalità di gestione di contingenti
    tariffari Comunitàri per taluni prodotti originari dell'Algeria, di Cipro, dell'Egitto,
    della Giordania, di Israele, di Malta, del Marocco, dei Territori occupati, della
    Tunisia e della Turchia e modalità di proroga o di adattamento dei suddetti contingenti,
    e il regolamento (CE) n. 934/95, che stabilisce massimali tariffari e una sorveglianza
    statistica Comunitària nel quadro di quantità di riferimento, per taluni prodotti
    originari di Cipro, dell'Egitto, della Giordania, di Israele, della Tunisia, della
    Siria, di Malta, del Marocco e dei territori occupati
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 585/96 van de Raad van 28 maart 1996 tot wijziging,
    voor wat betreft bepaalde produkten van oorsprong uit Israël, van Verordening
    (EG) nr. 1981/94 betreffende de opening en wijze van beheer van communautaire
    tariefcontingenten voor bepaalde produkten van oorsprong uit Algerije, Cyprus,
    Egypte, Israël, Jordanië, Malta, Marokko, de bezette gebieden, Tunesië en Turkije,
    alsmede modaliteiten voor de verlenging of aanpassing van die contingenten, en
    tot wijziging van Verordening (EG) nr. 934/95 tot instelling van tariefplafonds
    en een communautair statistisch toezicht in het kader van referentiehoeveelheden
    voor een aantal produkten van oorsprong uit Cyprus, Egypte, Jordanië, Israël,
    Tunesië, Syrië, Malta, Marokko en de bezette gebieden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 585/96 do Conselho, de 28 de Março de 1996, que altera,
    quanto a determinados produtos originários de Israel, o Regulamento (CE) nº
    1981/94, relativo à abertura e modo de gestão de contingentes pautais comunitários
    para determinados produtos originários da Argélia, de Chipre, do Egipto, de
    Israel, da Jordânia, de Malta, de Marrocos, dos Territórios Ocupados, da Tunísia
    e da Turquia e que estabelece as regras de prorrogação ou de adaptação dos
    referidos contingentes, e que altera o Regulamento (CE) nº 934/95, que estabelece
    limites máximos pautais e uma vigilância estatística comunitária no âmbito
    de quantidades de referência para determinados produtos originários de Chipre,
    do Egipto, da Jordânia, de Israel, da Tunísia, da Síria, de Malta, de Marrocos
    e dos Territórios Ocupados
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 585/96 del Consejo, de 28 de marzo de 1996, por el
    que se modifica, para determinados productos originarios de Israel, el Reglamento
    (CE) nº 1981/94, relativo a la apertura y modo de gestión de contingentes arancelarios
    comunitarios para determinados productos originarios de Argelia, de Chipre, de
    Egipto, de Israel, de Jordania, de Malta, de Marruecos, de los territorios ocupados,
    de Túnez y de Turquía así como a las modalidades de prórroga o adaptación
    de dichos contingentes, y por el que se modifica el Reglamento (CE) nº 934/95,
    por el que se establecen límites máximos arancelarios y una vigilancia estadística
    comunitaria en el marco de las cantidades de referencia para un determinado número
    de productos originarios de Chipre, de Egipto, de Jordania, de Israel, de Túnez,
    de Siria, de Malta, de Marruecos y de los territorios ocupados
  type: main
