title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 585/96 of 28 March 1996 amending, for certain
    products originating in Israel, Regulation (EC) No 1981/94 opening and providing
    for the administration of Community tariff quotas for certain products originating
    in Algeria, Cyprus, Egypt, Israel, Jordan, Malta, Morocco, the Occupied Territories,
    Tunisia and Turkey, and providing detailed rules for extending and adapting these
    tariff quotas, and Regulation (EC) No 934/95 establishing tariff ceilings and
    a Community statistical surveillance in the framework of reference quantities
    for a certain number of products originating in Cyprus, Egypt, Jordan, Israel,
    Tunisia, Syria, Malta, Morocco, and the Occupied Territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 585/96 du Conseil, du 28 mars 1996, modifiant, pour
    certains produits originaires d'Israël, le règlement (CE) n° 1981/94 portant
    ouverture et mode de gestion de contingents tarifaires communautaires pour certains
    produits originaires d'Algérie, de Chypre, d'Égypte, d'Israël, de Jordanie,
    de Malte, du Maroc, des territoires occupés, de Tunisie et de Turquie ainsi que
    modalités de prorogation ou d'adaptation desdits contingents, et le règlement
    (CE) n° 934/95 portant établissement de plafonds tarifaires et d'une surveillance
    statistique communautaire dans le cadre de quantités de référence pour un certain
    nombre de produits originaires de Chypre, d'Égypte, de Jordanie, d'Israël, de
    Tunisie, de Syrie, de Malte, du Maroc et des territoires occupés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 585/96 des Rates vom 28. März 1996 zur Änderung -
    hinsichtlich bestimmter Erzeugnisse mit Ursprung in Israel - der Verordnung (EG)
    Nr. 1981/94 zur Eröffnung und Verwaltung von Gemeinschaftszollkontingenten für
    bestimmte Erzeugnisse mit Ursprung in Algerien, Zypern, Ägypten, Israel, Jordanien,
    Malta, Marokko, den besetzten Gebieten, Tunesien und der Türkei sowie zur Einführung
    eines Verfahrens für die Verlängerung und Anpassung dieser Zollkontingente,
    und zur Änderung der Verordnung (EG) Nr. 934/95 zur Festlegung zolltariflicher
    Plafonds und einer statistischen Überwachung im Rahmen von Referenzmengen für
    bestimmte Waren mit Ursprung in Zypern, Ägypten, Jordanien, Israel, Tunesien,
    Syrien, Malta, Marokko und den besetzten Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 585/96 af 28. marts 1996 om ændring, for så
    vidt angår visse varer med oprindelse i Israel, af forordning (EF) nr. 1981/94
    om åbning og forvaltning af fællesskabstoldkontingenter for visse varer med
    oprindelse i Algeriet, Cypern, Egypten, Israel, Jordan, Malta, Marokko, Tunesien,
    Tyrkiet og de besatte områder og om retningslinjer for forlængelse og tilpasning
    af disse toldkontingenter, samt af forordning (EF) nr. 934/95 om indførelse af
    toldlofter og et statistisk fællesskabstilsyn inden for rammerne af referencemængder
    for en række varer med oprindelse i Cypern, Egypten, Jordan, Israel, Tunesien,
    Syrien, Malta, Marokko og de besatte områder
  type: main
