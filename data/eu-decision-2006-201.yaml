title:
- language: en
  script: Latn
  content: Council Decision 2006/201/CFSP of 27 February 2006 concerning the extension
    of the agreement in the form of an Exchange of Letters between the European Union
    and the Government of Indonesia on the tasks, status, privileges and immunities
    of the European Union Monitoring Mission in Aceh (Indonesia) (Aceh Monitoring
    Mission — AMM) and its personnel
