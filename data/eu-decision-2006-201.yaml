    apmaiņas veidā par uzdevumiem, statusu, privilēģijām un imunitāti, kas piešķirta
    Eiropas Savienības uzraudzības misijai Acehā (Indonēzijā) (Acehas Uzraudzības
    misija – AUM) un tās personālam
  type: main
- language: lt
  script: Latn
