    l-Indoneżja dwar il-kompiti, l-istatus, il-privileġġi u l-immunitajiet tal-Missjoni
    ta' Monitoraġġ ta' l-Unjoni Ewropea f'Aceh (l-Indoneżja) (Missjoni ta' Monitoraġġ
    f'Aceh - AMM) u tal-persunal tagħha
  type: main
