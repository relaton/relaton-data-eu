    stebėjimo misijos Ačehe (Indonezija) (Stebėjimo misija Ačehe – SMA) ir jos
    personalo užduočių, statuso, privilegijų ir imunitetų galiojimo pratęsimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/201/PESK tas- 27 ta' Frar 2006 dwar l-estensjoni
