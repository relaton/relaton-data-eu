    προσωπικού της
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2006/201/ÜVJP, 27. veebruar 2006 , millega pikendatakse
    Euroopa Liidu ja Indoneesia valitsuse vahel kirjavahetuse teel sõlmitud kokkulepet
    Acehis (Indoneesia) läbi viidava Euroopa Liidu järelevalvemissiooni (Acehi järelevalvemissioon
    – AJM) ja selle isikkoosseisu ülesannete, staatuse, privileegide ja immuniteetide
    kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2006/201/YUTP, tehty 27 päivänä helmikuuta 2006
    , Acehissa (Indonesia) toteutettavan Euroopan unionin tarkkailuoperaation (Acehin
    tarkkailuoperaatio – AMM) ja sen henkilöstön tehtäviä, asemaa, erioikeuksia
    ja vapauksia koskevan Euroopan unionin ja Indonesian hallituksen välisen kirjeenvaihtona
    tehdyn sopimuksen voimassaolon jatkamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/201/KKBP határozata ( 2006. február 27. ) az Európai
    Unió és Indonézia kormánya közötti, az Európai Unió Acehben (Indonézia)
    tevékenykedő Megfigyelő Missziója (Acehi Megfigyelő Misszió – AMM) és
    annak személyi állománya feladatairól, jogállásáról, kiváltságairól
    és mentességeiről szóló, levélváltás formájában történő megállapodás
    meghosszabbításáról
  type: main
- language: it
  script: Latn
