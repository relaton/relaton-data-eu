    om opgaver, status, privilegier og immuniteter for Den Europæiske Unions observatørmission
    i Aceh (Indonesien) (observatørmissionen i Aceh — AMM) og dens personale
  type: main
- language: el
  script: Grek
  content: Απόφαση 2006/201/ΚΕΠΠΑ του Συμβουλίου, της
    27ης Φεβρουαρίου 2006 , για την παράταση της συμφωνίας,
    υπό μορφή ανταλλαγής επιστολών, μεταξύ της
    Ευρωπαϊκής Ένωσης και της κυβέρνησης της Ινδονησίας
    που αφορά τα καθήκοντα, το καθεστώς, τα προνόμια
    και τις ασυλίες της αποστολής παρακολούθησης
    της Ευρωπαϊκής Ένωσης στην Ατσέ της Ινδονησίας
