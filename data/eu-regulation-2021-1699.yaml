    bizonyítványminta tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/1699 della Commissione del 22 settembre
    2021 che modifica l’allegato VIII del regolamento (UE) n. 142/2011 per quanto
    riguarda il modello di certificato sanitario per i movimenti di partite di sottoprodotti
    di origine animale provenienti da zone soggette a restrizioni istituite per la
    prevenzione e il controllo di determinate malattie elencate
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/1699 (2021. gada 22. septembris),
