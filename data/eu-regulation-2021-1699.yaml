    privește modelul de certificat de sănătate pentru deplasarea transporturilor
    de subproduse de origine animală din zonele de restricții stabilite pentru prevenirea
    și controlul anumitor boli listate
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/1699 z 22. septembra 2021, ktorým
