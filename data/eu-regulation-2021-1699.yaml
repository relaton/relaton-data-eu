title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1699 of 22 September 2021
    amending Annex VIII to Regulation (EU) No 142/2011 as regards the model health
    certificate for movements of consignments of animal by-products from restricted
    zones established for the prevention and control of certain listed diseases
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1699 de la Commission du 22 septembre
    2021 modifiant l’annexe VIII du règlement (UE) no 142/2011 en ce qui concerne
    le modèle de certificat sanitaire pour les mouvements d’envois de sous-produits
    animaux provenant de zones réglementées établies aux fins de la prévention
    de certaines maladies répertoriées et de la lutte contre celles-ci
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/1699 der Kommission vom 22. September
    2021 zur Änderung von Anhang VIII der Verordnung (EU) Nr. 142/2011 hinsichtlich
    der Muster-Veterinärbescheinigung für Verbringungen von Sendungen tierischer
    Nebenprodukte aus Sperrzonen, die zur Prävention und Bekämpfung bestimmter gelisteter
    Seuchen eingerichtet wurden
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/1699 на Комисията
