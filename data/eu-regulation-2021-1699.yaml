    veterinárního osvědčení pro přemísťování zásilek vedlejších produktů
    živočišného původu z uzavřených pásem zřízených za účelem prevence
    a tlumení určitých nákaz uvedených na seznamu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1699 af 22. september
