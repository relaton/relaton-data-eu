    VIII към Регламент (ЕС) № 142/2011 по отношение на
    образеца на здравен сертификат за движение
    на пратки от странични животински продукти
    от ограничителни зони, създадени с цел предотвратяване
    и контрол на някои болести от списъка
  type: main
- language: cs
  script: Latn
