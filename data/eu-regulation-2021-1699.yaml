    do wzoru świadectwa zdrowia dla przemieszczeń przesyłek produktów ubocznych
    pochodzenia zwierzęcego z obszarów objętych ograniczeniami ustanowionych w
    celu zapobiegania niektórym chorobom umieszczonym w wykazie oraz ich zwalczania
  type: main
