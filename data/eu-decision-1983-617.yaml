    von Butter zu herabgesetzten Preisen in Form von Butterreinfett (Nur der deutsche
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/617/EØF: Kommissionens beslutning af 30. november 1983 om 3. ændring
