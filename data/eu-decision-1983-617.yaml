  script: Latn
  content: '83/617/EEC: Commission Decision of 30 November 1983 on the third amendment
    of Decision 82/467/EEC authorizing a number of Member States to sell butter at
    a reduced price in the form of concentrated butter (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/617/CEE: Décision de la Commission du 30 novembre 1983 portant troisième
    modification de la décision 82/467/CEE autorisant plusieurs Etats membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Le texte en
    langue allemande est le seul faisant foi)'
  type: main
- language: de
