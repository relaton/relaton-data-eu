    li għandha x'taqsam ma' restrizzjonijiet dwar il-marketing u l-użu ta' ċerti
    sustanzi u preparati perikolużi (short-chain chlorinated paraffins)
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/45/EG van het Europees Parlement en de Raad van 25 juni
    2002 tot twintigste wĳziging van Richtlĳn 76/769/EEG van de Raad inzake de beperking
    van het op de markt brengen en van het gebruik van bepaalde gevaarlĳke stoffen
    en preparaten (gechloreerde paraffines met een korte keten)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2002/45/WE Parlamentu Europejskiego i Rady z dnia 25 czerwca
    2002 r. zmieniająca po raz dwudziesty dyrektywę Rady 76/769/EWG w zakresie ograniczeń
    we wprowadzaniu do obrotu i stosowaniu niektórych substancji i preparatów niebezpiecznych
    (krótkołańcuchowych chlorowanych parafin)
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/45/CE do Parlamento Europeu e do Conselho, de 25 de Junho
    de 2002, que altera pela vigésima vez a Directiva 76/769/CEE do Conselho no que
    diz respeito à limitação da colocação no mercado e da utilização de algumas
    substâncias e preparações perigosas (parafinas cloradas de cadeia curta)
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/45/CE a Parlamentului European și a Consiliului din 25
    iunie 2002 de efectuare a celei de-a douăzecea modificări a Directivei 76/769/CEE
    a Consiliului referitoare la restricțiile privind introducerea pe piață și
    utilizarea anumitor substanțe și preparate periculoase (parafine clorurate cu
    catenă scurtă)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady2002/45/ES z 25. júna 2002, ktorou
    sa po dvadsiatykrát mení a dopĺňa smernica Rady 76/769/EHS týkajúca sa na
    obmedzenia uvádzania na trh a používania niektorých nebezpečných látok
    a prípravkov (chlórované parafíny s krátkym reťazcom)
  type: main
- language: sl
  script: Latn
  content: Direktiva 2002/45/ES evropskega parlamenta in Sveta z dne 25. junija 2002
    o dvajseti spremembi Direktive Sveta 76/769/EGS o omejitvah pri trženju in uporabi
    nekaterih nevarnih snovi in pripravkov (klorirani parafini s kratkimi verigami)
  type: main
- language: es
  script: Latn
  content: Directiva 2002/45/CE del Parlamento Europeo y del Consejo, de 25 de junio
    de 2002, por la que se modifica por vigésima vez la Directiva 76/769/CEE del
    Consejo respecto a la limitación de la comercialización y el uso de determinadas
    sustancias y preparados peligrosos (parafinas cloradas de cadena corta)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2002/45/EG av den 25 juni 2002
    om ändring för tjugonde gången av rådets direktiv 76/769/EEG om begränsning
    av användning och utsläppande på marknaden av vissa farliga ämnen och preparat
    (klorparaffiner med kort kolkedja)
  type: main
