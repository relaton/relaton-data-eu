title:
- language: en
  script: Latn
  content: Directive 2002/45/EC of the European Parliament and of the Council of 25
    June 2002 amending for the twentieth time Council Directive 76/769/EEC relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (short-chain chlorinated paraffins)
  type: main
- language: fr
  script: Latn
  content: Directive 2002/45/CE du Parlement européen et du Conseil du 25 juin 2002
    portant vingtième modification de la directive 76/769/CEE du Conseil en ce qui
    concerne la limitation de la mise sur le marché et de l'emploi de certaines substances
    et préparations dangereuses (paraffines chlorées à chaîne courte)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/45/EG des Europäischen Parlaments und des Rates vom 25.
    Juni 2002 zur 20. Änderung der Richtlinie 76/769/EWG des Rates hinsichtlich der
    Beschränkungen des Inverkehrbringens und der Verwendung gewisser gefährlicher
    Stoffe und Zubereitungen (kurzkettige Chlorparaffine)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/45/ЕО на Европейския парламент
