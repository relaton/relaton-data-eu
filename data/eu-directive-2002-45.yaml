    μικρής αλυσίδας)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2002/45/EÜ, 25. juuni 2002, millega
    kahekümnendat korda muudetakse direktiivi 76/769/EMÜ liikmesriikide õigus-
    ja haldusnormide ühtlustamise kohta seoses teatavate ohtlike ainete ja valmististe
    (lühiahelalised klooritud parafiinid) turustamise ja kasutamise piirangutega
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2002/45/EY, annettu 25 päivänä
    kesäkuuta 2002, tiettyjen vaarallisten aineiden ja valmisteiden markkinoille
    saattamisen ja käytön rajoituksia koskevien jäsenvaltioiden lakien, asetusten
    ja hallinnollisten määräysten lähentämisestä annetun neuvoston direktiivin
    76/769/ETY muuttamisesta kahdennenkymmenennen kerran (lyhytketjuiset klooratut
    parafiinit)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2002/45/EK irányelve (2002. június
