    ограничения за пускане на пазара и употреба
    на някои опасни вещества и препарати (хлорирани
    парафини с къса верига)
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2002/45/ES ze dne 25. června 2002,
    kterou se podvacáté mění směrnice Rady 76/769/EHS o omezení uvádění některých
    nebezpečných látek a přípravků na trh a jejich používání (chlorované
    parafiny s krátkým řetězcem)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2002/45/EF af 25. juni 2002 om
    tyvende ændring af Rådets direktiv 76/769/EØF vedrørende begrænsning af markedsføring
    og anvendelse af visse farlige stoffer og præparater (korte chlorparaffiner)
  type: main
- language: el
  script: Grek
