    marraskuuta 2018, luvan antamisesta Ranskalle tehdä sopimus Saint-Barthélemyn,
    Saint-Pierre ja Miquelonin, Uuden-Kaledonian, Ranskan Polynesian sekä Wallis
    ja Futunan kanssa Ranskan ja näiden alueiden välisten varainsiirtojen kohtelemiseksi
    Ranskan sisäisinä varainsiirtoina Euroopan parlamentin ja neuvoston asetuksen
    (EU) 2015/847 nojalla (tiedoksiannettu numerolla C(2018) 7434)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/1803 оd 20. studenoga 2018. o odobrenju
    Francuskoj da sklopi sporazum sa Saint-Barthélemyjem, Saint-Pierre-et-Miquelonom,
    Novom Kaledonijom, Francuskom Polinezijom odnosno Wallisom i Futunom prema kojem
    se prijenosi novčanih sredstava između Francuske i svakog od tih područja tretiraju
    kao prijenosi novčanih sredstava unutar Francuske, na temelju Uredbe (EU) 2015/847
    Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2018) 7434)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/1803 végrehajtási határozata (2018. november
    20.) az (EU) 2015/847 európai parlamenti és tanácsi rendelet alapján Franciaországnak
    a Saint-Barthélemy-vel, Saint-Pierre és Miquelonnal, Új-Kaledóniával, Francia
    Polinéziával, valamint Wallis és Futunával a Franciaország és e területek
    közötti pénzátutalások Franciaországon belüli pénzátutalásként való
    kezeléséről szóló megállapodás megkötésére történő felhatalmazásáról
    (az értesítés a C(2018) 7434. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/1803 della Commissione, del 20 novembre
    2018, che autorizza la Francia a concludere un accordo, rispettivamente, con Saint-Barthélemy,
    Saint Pierre e Miquelon, la Nuova Caledonia, la Polinesia francese e Wallis e
    Futuna affinché i trasferimenti di fondi tra la Francia e ognuno dei suddetti
    territori siano considerati trasferimenti di fondi all'interno della Francia conformemente
    al regolamento (UE) 2015/847 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2018) 7434]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/1803 (2018. gada 20. novembris),
    ar kuru Francijai atļauj noslēgt nolīgumu attiecīgi ar Senbartelmī, Senpjēru
    un Mikelonu, Jaunkaledoniju, Francijas Polinēziju un Volisu un Futunas salām
    par to, lai naudas līdzekļu pārskaitījumus starp Franciju un katru šo teritoriju
    uzskatītu par naudas līdzekļu pārskaitījumiem Francijas iekšienē atbilstoši
    Eiropas Parlamenta un Padomes Regulai (ES) 2015/847 (izziņots ar dokumenta numuru
    C(2018) 7434)
  type: main
- language: lt
  script: Latn
  content: 2018 m. lapkričio 20 d. Komisijos įgyvendinimo sprendimas (ES) 2018/1803,
    kuriuo Prancūzijai leidžiama sudaryti susitarimą su Sen Bartelemi, Sen Pjeru
    ir Mikelonu, Naująja Kaledonija, Prancūzijos Polinezija ir Volisu ir Futūna
    dėl lėšų pervedimo iš Prancūzijos į kiekvieną iš šių teritorijų ir
    atvirkščiai traktavimo kaip lėšų pervedimo Prancūzijos teritorijoje, remiantis
    Europos Parlamento ir Tarybos reglamentu (ES) 2015/847 (pranešta dokumentu Nr.
    C(2018) 7434)
  type: main
