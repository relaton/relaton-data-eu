  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/1803, 20. november 2018, millega lubatakse
    Prantsusmaal sõlmida Saint-Barthélemy, Saint-Pierre'i ja Miqueloni, Uus-Kaledoonia,
    Prantsuse Polüneesia ning Wallise ja Futunaga kokkulepe, mille kohaselt Prantsusmaa
    ja iga kõnealuse territooriumi vahelist rahaülekannet käsitatakse Prantsusmaa-sisese
