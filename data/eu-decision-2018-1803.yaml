    Saint-Pierre-et-Miquelon, New Caledonia, il-Polineżja Franċiża u Wallis u Futuna
    rispettivament għal trasferimenti ta' fondi bejn Franza u kull wieħed minn dawn
    it-territorji sabiex jitqiesu bħala trasferimenti ta' fondi fi Franza, skont
