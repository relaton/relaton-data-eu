  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1803 van de Commissie van 20 november 2018
    waarbij Frankrijk wordt gemachtigd een overeenkomst te sluiten met Saint-Barthélemy,
    Saint-Pierre en Miquelon, Nieuw-Caledonië, Frans-Polynesië en Wallis en Futuna
    teneinde geldovermakingen tussen Frankrijk en elk van deze gebieden te behandelen
    als geldovermakingen binnen Frankrijk, overeenkomstig Verordening (EU) 2015/847
    van het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2018)
    7434)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/1803 z dnia 20 listopada 2018 r. upoważniająca
    Francję do zawarcia umowy, odpowiednio, z Saint-Barthélemy, Saint-Pierre i Miquelon,
    Nową Kaledonią, Polinezją Francuską oraz Wallis i Futuną w sprawie traktowania
    przekazów pieniężnych pomiędzy Francją a każdym z tych terytoriów jak przekazów
    pieniężnych w obrębie Francji zgodnie z rozporządzeniem Parlamentu Europejskiego
    i Rady (UE) 2015/847 (notyfikowana jako dokument nr C(2018) 7434)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1803 da Comissão, de 20 de novembro de
    2018, que autoriza a França a celebrar acordos com São Bartolomeu, São Pedro
    e Miquelão, a Nova Caledónia, a Polinésia Francesa e Wallis e Futuna, respetivamente,
    a fim de que as transferências de fundos entre a França e cada um destes territórios
    sejam tratadas como transferências de fundos dentro da França, nos termos do
    Regulamento (UE) 2015/847 do Parlamento Europeu e do Conselho [notificada com
    o número C(2018) 7434]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1803 a Comisiei din 20 noiembrie
    2018 prin care Franța este autorizată să încheie un acord cu Saint-Barthélemy,
    Saint Pierre și Miquelon, Noua Caledonie, Polinezia Franceză și Wallis și
    Futuna pentru ca transferurile de fonduri dintre Franța și aceste teritorii
    să fie considerate drept transferuri de fonduri în interiorul Franței în temeiul
    Regulamentului (UE) 2015/847 al Parlamentului European și al Consiliului [notificată
    cu numărul C(2018) 7434]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/1803 z 20. novembra 2018, na
    základe ktorého sa Francúzsko oprávňuje uzatvoriť dohodu so Svätým Bartolomejom,
    ostrovmi Saint Pierre a Miquelon, Novou Kaledóniou, Francúzskou Polynéziou
    a ostrovmi Wallis a Futuna, aby sa s prevodmi finančných prostriedkov medzi
    Francúzskom a týmito územiami zaobchádzalo ako s prevodmi finančných prostriedkov
    v rámci Francúzska v súlade s nariadením Európskeho parlamentu a Rady (EÚ)
    2015/847 [oznámené pod číslom C(2018) 7434]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/1803 z dne 20. novembra 2018 o odobritvi
    Franciji, da sklene sporazum s Saint Barthélemyjem, Saint Pierre in Miquelonom,
    Novo Kaledonijo, Francosko Polinezijo ter Walliškimi in Futunskimi otoki, da
    se prenosi sredstev med Francijo in vsakim od teh območij obravnavajo kot prenosi
    sredstev znotraj Francije v skladu z Uredbo (EU) 2015/847 Evropskega parlamenta
    in Sveta (notificirano pod dokumentarno številko C(2018) 7434)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/1803 de la Comisión, de 20 de noviembre
    de 2018, por la que se autoriza a Francia a celebrar acuerdos con San Bartolomé,
    San Pedro y Miquelón, Nueva Caledonia, la Polinesia Francesa y Wallis y Futuna,
    respectivamente, para que las transferencias de fondos entre Francia y cada uno
    de estos territorios se traten como transferencias de fondos dentro de Francia,
    de conformidad con el Reglamento (UE) 2015/847 del Parlamento Europeo y del Consejo
    [notificada con el número C(2018) 7434]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/1803 av den 20 november 2018
    om bemyndigande för Frankrike att ingå ett avtal med Saint-Barthélemy, Saint-Pierre
    och Miquelon, Nya Kaledonien, Franska Polynesien och Wallis och Futuna om överföring
    av medel mellan Frankrike och vart och ett av dessa områden, som ska behandlas
    som överföringar av medel inom Frankrike, i enlighet med Europaparlamentets
    och rådets förordning (EU) 2015/847 [delgivet med nr C(2018) 7434]
