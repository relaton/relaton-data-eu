---
id: EUDecision20181803
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/1803 of 20 November 2018 on
    authorising France to conclude an agreement with Saint-Barthélemy, Saint-Pierre-et-Miquelon,
    New Caledonia, French Polynesia, and Wallis and Futuna respectively for transfers
    of funds between France and each of these territories to be treated as transfers
    of funds within France, pursuant to Regulation (EU) 2015/847 of the European Parliament
    and the Council (notified under document C(2018) 7434)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1803 de la Commission du 20 novembre 2018
    autorisant la France à conclure un accord avec Saint-Barthélemy, Saint-Pierre-et-Miquelon,
    la Nouvelle-Calédonie, la Polynésie française et Wallis-et-Futuna pour que
    les virements de fonds effectués entre la France et chacun de ces territoires
    soient traités comme des virements de fonds à l'intérieur de la France, conformément
    au règlement (UE) 2015/847 du Parlement européen et du Conseil [notifiée sous
    le numéro C(2018) 7434]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1803 der Kommission vom 20. November
    2018 zur Ermächtigung Frankreichs, gemäß der Verordnung (EU) 2015/847 des Europäischen
    Parlaments und des Rates eine Vereinbarung mit Saint-Barthélemy, St. Pierre und
    Miquelon, Neukaledonien, Französisch-Polynesien beziehungsweise Wallis und Futuna
    zu schließen, damit Geldtransfers zwischen Frankreich und diesen Gebieten wie
    Geldtransfers innerhalb Frankreichs behandelt werden können (Bekannt gegeben
    unter Aktenzeichen C(2018) 7434)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/1803 на Комисията
    от 20 ноември 2018 година за упълномощаване на
    Франция да сключи споразумение със Сен Бартелеми,
    Сен Пиер и Микелон, Нова Каледония, Френска
    Полинезия и Уолис и Футуна за третиране на
    паричните преводи между Франция и всяка една
    от тези територии като парични преводи в рамките
    на Франция съгласно Регламент (ЕС) 2015/847 на Европейския
    парламент и на Съвета (нотифицирано под номер
    С(2018) 7434)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/1803 ze dne 20. listopadu 2018
    o zmocnění Francie k uzavření dohody se Svatým Bartolomějem, Saint Pierrem
    a Miquelonem, Novou Kaledonií, Francouzskou Polynésií a Wallisem a Futunou,
    pokud jde o to, aby se s převody finančních prostředků mezi Francií a těmito
    územími zacházelo jako s převody finančních prostředků v rámci Francie,
    v souladu s nařízením Evropského parlamentu a Rady (EU) 2015/847 (oznámeno
    pod číslem C(2018) 7434)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/1803 af 20. november
    2018 om bemyndigelse af Frankrig til at indgå en aftale med henholdsvis Saint-Barthélemy,
    Saint-Pierre og Miquelon, Ny Kaledonien, Fransk Polynesien og Wallis og Futuna
    om, at pengeoverførsler mellem Frankrig og hvert af disse territorier behandles
    som pengeoverførsler inden for Frankrig i overensstemmelse med Europa-Parlamentets
    og Rådets forordning (EU) 2015/847 (meddelt under nummer C(2018) 7434)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/1803 της Επιτροπής,
    της 20ής Νοεμβρίου 2018, για την εξουσιοδότηση
    της Γαλλίας να συνάψει συμφωνία με τον Άγιο
    Βαρθολομαίο, τις νήσους Σεν Πιέρ και Μικελόν,
    τη Νέα Καληδονία, τη Γαλλική Πολυνησία και
