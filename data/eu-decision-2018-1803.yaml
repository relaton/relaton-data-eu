    ώστε οι μεταφορές χρηματικών ποσών μεταξύ
    της Γαλλίας και των εν λόγω εδαφών να θεωρούνται
    ως μεταφορές χρηματικών ποσών εντός της Γαλλίας,
    δυνάμει του κανονισμού (ΕΕ) 2015/847 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου [κοινοποιηθείσα
