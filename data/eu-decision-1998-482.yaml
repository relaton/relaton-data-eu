title:
- language: en
  script: Latn
  content: '98/482/EC: Council Decision of 20 July 1998 on a common technical Regulation
    for the attachment requirements for connection to the analogue public switched
    telephone networks (PSTNs) of terminal equipment (excluding terminal equipment
    supporting the voice telephony justified case service) in which network addressing,
    if provided, is by means of dual tone multi-frequency (DTMF) signalling'
  type: main
- language: fr
  script: Latn
  content: '98/482/CE: Décision du Conseil du 20 juillet 1998 concernant une réglementation
    technique commune relative aux exigences de raccordement pour la connexion aux
    réseaux téléphoniques publics commutés (RTPC) analogiques des équipements
    terminaux (à l''exception de ceux qui prennent en charge la téléphonie vocale
    dans les cas justifiés) pour lesquels l''adressage de réseau éventuel est assuré
    par signalisation multifréquence bitonale (DTMF)'
  type: main
- language: de
  script: Latn
  content: '98/482/EG: Entscheidung des Rates vom 20. Juli 1998 über eine gemeinsame
    technische Vorschrift für die Bedingungen des Anschaltens von Endeinrichtungen
    (ausgenommen Geräte, die Sprachtelefoniedienste in gerechtfertigten Fällen unterstützen),
    bei denen die Netzadressierung gegebenenfalls durch Zeichengabe im Zweitonmehrfrequenzwahlverfahren
    erfolgt, an analoge öffentliche Fernsprechnetze'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 20 юли 1998 година относно
    общ технически регламент относно изискванията
    за свързване към обществените комутируеми
    аналогови телефонни мрежи (PSTN) на крайни устройства
    (с изключение на крайни устройства, поддържащи
    гласова телефония с идентификация на обажданията),
    при които включването в мрежата, ако има достъп,
    се осъществява чрез двойно тонално номеронабиране
    (DTMF)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 20. července 1998 o společném technickém předpisu
    pro připojovací požadavky na koncová zařízení (s výjimkou koncových zařízení
    zajišťujících hlasovou telefonní službu v oprávněných případech), ve
    kterých se síťové adresování, je-li zajištěno, provádí dvoutónovou
    multifrekvenční (DTMF) signalizací, pro připojení k analogovým veřejným
    komutovaným telefonním sítím (PSTN)
  type: main
- language: da
  script: Latn
  content: '98/482/EF: Rådets beslutning af 20. juli 1998 om en fælles teknisk forskrift
    med tilslutningskrav til terminaludstyr (undtagen udstyr til taletelefoni i begrundede
    tilfælde), der kobles op på de analoge offentlige telefonnet, og som anvender
    DTMF-signalering (Dual Tone Multi Frequency) ved netadressering'
  type: main
- language: el
  script: Grek
  content: '98/482/ΕΚ: Απόφαση του Συμβουλίου της 20ής
    Ιουλίου 1998 που αφορά κοινή τεχνική ρύθμιση
    σχετικά με τις απαιτήσεις προσάρτησης για
    σύνδεση με τα αναλογικά δημόσια τηλεφωνικά
    δίκτυα μεταγωγής (PSTN) τερματικού εξοπλισμού
