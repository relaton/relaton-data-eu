    koskevista yhteisistä teknisistä määräyksistä'
  type: main
- language: hr
  script: Latn
  content: '98/482/EZ: Odluka Vijeća od 20. srpnja 1998. o zajedničkom tehničkom
    propisu za priključne zahtjeve za priključivanje terminalne opreme (uz izuzeće
    terminalne opreme koja podržava uslugu govorne telefonije za opravdane slučajeve)
    na analogne javne komutirane telefonske mreže (PSTN-ove) te čije se mrežno
    adresiranje, ako je predviđeno, izvodi dvotonskom višefrekvencijskom (DTMF)
    signalizacijom'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1998. július 20.) a hálózati címzéshez kéthangos,
    sokfrekvenciás jelzést (DTMF) használó végberendezések (kivéve az indokolt
    esetben hangtelefont támogató végberendezéseket) nyilvános kapcsolt telefonhálózatokhoz
    (PSTN) történő csatlakoztatására vonatkozó közös műszaki szabályokról
  type: main
- language: it
  script: Latn
  content: '98/482/CE: Decisione del Consiglio del 20 luglio 1998 su una regolamentazione
    tecnica comune relativa ai requisiti di connessione per il collegamento alla rete
    telefonica pubblica commutata (PSTN) delle apparecchiature terminali (ad eccezione
    delle apparecchiature terminali per il servizio di telefonia vocale in casi giustificati)
    in cui l''eventuale indirizzamento di rete è effettuato con segnalazione bitonale
    a più frequenze (DTMF)'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1998. gada 20. jūlijs) par kopīgiem tehniskiem noteikumiem
    pieslēguma prasībām, kuras piemērojamas, publiskajiem analogajiem komutācijas
    telefonu tīkliem (PSTN) pieslēdzot gala iekārtas (izņemot gala iekārtas,
    kas attiecīgajos gadījumos nodrošina balss telefoniju), kam varbūtēju tīkla
    adresēšanu nodrošina, izmantojot divtoņu daudzfrekvenču (DTMF) signalizēšanu
  type: main
- language: lt
  script: Latn
  content: 1998 m. liepos 20 d. Tarybos Sprendimas dėl bendrojo techninio reglamento,
    nustatančio galinių įrenginių (išskyrus balso telefonijos pagrįstų atvejų
    paslaugas palaikančius galinius įrenginius) prijungimo prie analoginių viešųjų
    komutuojamų telefono tinklų, kai tinklo adresavimas, jei jis teikiamas, atliekamas
    dvitone daugiadažne (DTMF) signalizavimo sistema, reikalavimus
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tal-20 ta' Lulju, 1998 dwar regolament tekniku
    komuni għall-ħtiġiet ta' konnessjoni ma’ networks analogi tat-telefon pubbliċi
    kommutati (PSTNs) ta' tagħmir terminali (barra tagħmir terminali li jsostni
    servizz ta' telefonija bil-leħen f'każi ġustifikati) li fih l-indirizzar tan-network,
    jekk provdut, ikun permezz ta' ton doppju ta' senjalazzjoni b'multi-frekwenza
    (DTMF)
  type: main
- language: nl
  script: Latn
  content: '98/482/EG: Beschikking van de Raad van 20 juli 1998 inzake gemeenschappelijke
    technische voorschriften voor de koppelingseisen voor de aansluiting op analoge
    openbare geschakelde telefoonnetwerken (PSTN''s) van eindapparatuur (behalve de
    als gerechtvaardigde uitzondering erkende eindapparatuur ten behoeve van de spraaktelefoondienst),
    waarin de netwerkadressering, voorzover daarin is voorzien, plaatsvindt door middel
    van DTMF-signalering (Dual Tone Multi Frequency)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 20 lipca 1998 r. w sprawie wspólnej regulacji technicznej
    dotyczącej wymagań przyłączeniowych dla podłączania do analogowych publicznych
    komutowanych sieci telefonicznych (PSTN) urządzeń końcowych (z wyłączeniem
    urządzeń końcowych wspomagających w określonych przypadkach usługi telefonii
    głosowej), w których adresowanie sieci, jeśli jest zapewnione, wykorzystuje
    wybieranie dwutonowe wieloczęstotliwościowe (DTMF)
  type: main
- language: pt
  script: Latn
  content: '98/482/CE: Decisão do Conselho de 20 de Julho de 1998 relativa a um regulamento
    técnico comum para os requisitos de ligação aplicáveis à ligação às redes
    telefónicas públicas comutadas (RTPC) analógicas de equipamentos terminais
    (com exclusão de equipamentos terminais preparados para o serviço telefónico
    vocal em casos justificados) nos quais, o endereçamento na rede quando previsto,
    se faz através de sinalização multifrequências de duas tonalidades (DTMF)'
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 20 iulie 1998 de stabilire a unei reglementări
    tehnice comune privind cerințele de racordare pentru conexiunea la rețelele
    telefonice publice comutate (RTPC) analogice ale echipamentelor terminale (exclusiv
    echipamentele terminale care susțin telefonia vocală, în cazuri justificate)
    în care adresarea rețelei, dacă există, este asigurată prin semnalizare multifrecvență
    bitonală (DTMF)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 20. júla 1998 o spoločnom technickom predpise týkajúcom
    sa požiadaviek na pripojenie pre koncové zariadenia (s vylúčením koncových
    zariadení zabezpečujúcich v odôvodnených prípadoch hlasovú telefónnu službu)
    k analógovým verejným telefónnym sieťam (PSTN), ktorých adresovanie v sieti,
    ak je umožnené, sa realizuje prostriedkami dvojtónovej frekvenčnej voľby
    (DTMF)
  type: main
- language: sl
  script: Latn
  content: Odločba Sveta z dne 20. julija 1998 o skupnem tehničnem predpisu za priključitvene
    zahteve za priključevanje terminalske opreme na analogna javna komutirana telefonska
    omrežja (PSTN) (brez terminalske opreme, ki podpira z govorno telefonijo utemeljeno
    storitev), pri katerem se izvaja naslavljanje omrežja, če je na voljo, z dvotonsko
    večfrekvenčno (DTMF) signalizacijo
  type: main
- language: es
  script: Latn
  content: '98/482/CE: Decisión del Consejo de 20 de julio de 1998 relativa a una
    reglamentación técnica común sobre los requisitos de conexión para la conexión
    a las redes telefónicas públicas conmutadas (RTPC) analógicas de los equipos
    terminales (excluidos los que soporten el servicio de telefonía vocal en caso
    justificado) en los que el direccionamiento de red, si se proporciona, se efectúa
    por medio de la señalización DTMF (multifrecuencia bitono)'
  type: main
- language: sv
  script: Latn
  content: '98/482/EG: Rådets beslut av den 20 juli 1998 om en gemensam teknisk föreskrift
    för anslutningskrav avseende anslutning av terminalutrustning (utom terminalutrustning
    som kan användas för taltelefoni, i berättigade fall) till analoga allmänt
    tillgängliga kopplade telenät (PSTN) där adressering i nät, om sådan finns,
    sker genom DTMF-signalering (Dual Tone Multi Frequency)'
  type: main
