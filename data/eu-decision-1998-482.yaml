    (DTMF)'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 20. juuli 1998, selliste üldkasutatava kommuteeritava
    analoogtelefonivõrguga ühendatavate lõppseadmete (v.a põhjendatud juhtudel
    kõneteenust toetavad lõppseadmed) ühendamisnõuete ühise tehnilise normi kohta,
    mille puhul võimalik võrguadresseerimine toimub toonvalimisega
  type: main
- language: fi
  script: Latn
  content: '98/482/EY: Neuvoston päätös, tehty 20 päivänä heinäkuuta 1998,
    analogisiin yleisiin kytkentäisiin puhelinverkkoihin (PSTN) liitettävien päätelaitteiden
    (lukuun ottamatta perustelluissa tapauksissa puheensiirtopalvelua tukevia päätelaitteita),
