---
id: EUDecision1992510
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision of 19 October 1992 authorizing Member States to continue
    to apply to certain mineral oils when used for specific purposes, existing reduced
    rates of excise duty or exemptions from excise duty, in accordance with the procedure
    provided for in Article 8 (4) of Directive 92/81/EEC
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil, du 19 octobre 1992, autorisant les États membres
    à continuer à appliquer à certaines huiles minérales utilisées à des fins
    spécifiques les réductions de taux d'accise ou les exonérations d'accises existantes,
    conformément à la procédure prévue à l'article 8 paragraphe 4 de la directive
    92/81/CEE
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rates vom 19. Oktober 1992 zur Ermächtigung der Mitgliedstaaten,
    gemäß dem Verfahren in Artikel 8 Absatz 4 der Richtlinie 92/81/EWG ermäßigte
    Verbrauchsteuersätze oder Verbrauchsteuerbefreiungen auf Mineralöle, die zu
    bestimmten Zwecken verwendet werden, beizubehalten
  type: main
- language: da
  script: Latn
  content: Rådets beslutning af 19. oktober 1992 om bemyndigelse af medlemsstaterne
    til fortsat at anvende de eksisterende punktafgiftsnedsættelser eller - fritagelser,
    der gælder for visse typer mineralolie, når disse anvendes til særlige formål,
    i overensstemmelse med procedurerne i artikel 8, stk. 4, i direktiv 92/81/EØF
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 19ης Οκτωβρίου
    1992 για την εξουσιοδότηση των κρατών μελών να
    συνεχίσουν να εφαρμόζουν σε ορισμένα πετρελαιοειδή
    που χρησιμοποιούνται για συγκεκριμένους σκοπούς,
    τους υφιστάμενους μειωμένους συντελεστές
    ειδικών φόρων κατανάλωσης ή τις υφιστάμενες
    απαλλαγές από ειδικούς φόρους κατανάλωσης,
    σύμφωνα με τις διαδικασίες του άρθρου 8, παράγραφος
    4, της οδηγίας 92/81/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 19 päivänä lokakuuta 1992, luvan antamisesta
    jäsenvaltioille direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädetyn menettelyn
    mukaisesti jatkaa erityistarkoituksiin käytettävien kivennäisöljyjen valmisteveroja
    koskevien voimassa olevien alennusten tai vapautusten soveltamista
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 19 ottobre 1992, che autorizza gli Stati membri
    ad applicare a determinati oli minerali utilizzati per fini specifici le già
    esistenti riduzioni delle aliquote d'accisa o esenzioni dell'accisa, conformemente
    alla procedura prevista all'articolo 8, paragrafo 4 della direttiva 92/81/CEE
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 19 oktober 1992 waarbij de Lid-Staten toestemming
    wordt verleend om bestaande verlaagde accijnstarieven of vrijstellingen van accijnzen
    te blijven toepassen op bepaalde minerale oliën die voor bijzondere doeleinden
    worden gebruikt, in overeenstemming met de procedure van artikel 8, lid 4, van
    Richtlijn 92/81/EEG
  type: main
- language: pt
  script: Latn
  content: Decisão do Conselho, de 19 de Outubro de 1992, que autoriza os Estados-membros
    a continuarem a aplicar a certos óleos minerais, quando utilizados para fins
    específicos, as actuais reduções de taxas de impostos sobre consumos específicos
    ou isenções a esses impostos, nos termos do nº 4 do artigo 8º da Directiva
    92/81/CEE
  type: main
- language: es
  script: Latn
  content: Decisión del Consejo, de 19 de octubre de 1992, por la que se autoriza
    a los Estados miembros a seguir aplicando, a determinados hidrocarburos utilizados
    para fines específicos los tipos reducidos existentes del impuesto especial o
    exenciones del mismo, con arreglo al procedimiento del apartado 4 del artículo
    8 de la Directiva 92/81/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 19 oktober 1992 om tillåtelse för medlemsstater
    att i enlighet med det förfarande som föreskrivs i artikel 8.4 i direktiv 92/81/EEG
    för vissa mineraloljor fortsätta att tillämpa nedsatta punktskattesatser eller
    befrielse från punktskatt, när dessa används för särskilda ändamål
  type: main
