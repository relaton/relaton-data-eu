title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2262/98 of 19 October 1998 establishing certain
    measures concerning imports of processed agricultural products from Switzerland
    in order to take account of the results of the Uruguay Round negotiations in the
    agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2262/98 du Conseil du 19 octobre 1998 établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    de Suisse pour tenir compte des résultats des négociations du cycle d'Uruguay
    dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2262/98 des Rates vom 19. Oktober 1998 über bestimmte
    Maßnahmen betreffend die Einfuhr landwirtschaftlicher Verarbeitungserzeugnisse
    aus der Schweiz im Hinblick auf die Ergebnisse der Verhandlungen der Uruguay-Runde
    im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2262/98 af 19. oktober 1998 om visse foranstaltninger
    vedrørende import af forarbejdede landbrugsprodukter fra Schweiz for at tage
    hensyn til resultaterne af Uruguay-rundens forhandlinger på landbrugsområdet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2262/98 του Συμβουλίου
    της 19ης Οκτωβρίου 1998 για τη θέσπιση ορισμένων
    μέτρων σχετικών με την εισαγωγή μεταποιημένων
    γεωργικών προϊόντων από την Ελβετία προκειμένου
    να ληφθούν υπόψη τα αποτελέσματα των διαπραγματεύσεων
    του Γύρου της Ουρουγουάης στο γεωργικό τομέα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2262/98, annettu 19 päivänä lokakuuta 1998,
    jalostettujen maataloustuotteiden tuontia Sveitsistä koskevien tiettyjen toimenpiteiden
    toteuttamisesta Uruguayn kierroksen neuvottelujen tulosten huomioon ottamiseksi
    maatalouden alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2262/98 del Consiglio del 19 ottobre 1998 che stabilisce
    talune misure relative all'importazione di prodotti agricoli trasformati dalla
    Svizzera per tener conto dei risultati dei negoziati dell'Uruguay Round nel settore
    agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2262/98 van de Raad van 19 oktober 1998 tot vaststelling
    van bepaalde maatregelen betreffende de invoer van be- en verwerkte landbouwproducten
    uit Zwitserland om rekening te houden met de resultaten van de in het kader van
    de Uruguay-ronde gevoerde onderhandelingen in de landbouwsector
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2262/98 do Conselho de 19 de Outubro de 1998 que estabelece
    certas medidas relativas à importação de produtos agrícolas transformados
    da Suíça de forma a ter em conta o resultado das negociações do «Uruguay
    Round» no sector agrícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2262/98 del Consejo de 19 de octubre de 1998 por el
    que se establecen medidas relativas a las importaciones de productos agrícolas
    transformados de Suiza a fin de tener en cuenta los resultados de las negociaciones
    de la Ronda Uruguay en el sector agrícola
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2262/98 av den 19 oktober 1998 om fastställande
