  content: COMMISSION REGULATION (EC) No 662/97 of 16 April 1997 laying down to what
    extent applications for issue of export licences submitted during April 1997 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 662/97 DE LA COMMISSION du 16 avril 1997 déterminant
