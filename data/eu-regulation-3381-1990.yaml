    προϊόντα εξαγόμενα υπό μορφή εμπορευμάτων
    μη υπαγομένων στο παράρτημα ΙΙ της συνθήκης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3381/90 DEL CONSIGLIO del 20 novembre 1990 recante
    modifica del regolamento (CEE) n. 3035/80 che stabilisce, per taluni prodotti
    agricoli esportati sotto forma di merci non comprese nell'allegato II del trattato,
    le regole generali relative alla concessione delle restituzioni all'esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3381/90 VAN DE RAAD van 20 november 1990 tot wijziging
    van Verordening (EEG) nr. 3035/80 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3381/90 DO CONSELHO de 20 de Novembro de 1990 que
    altera o Regulamento (CEE) n* 3035/80, que estabelece, para certos produtos agricolas
    exportados sob forma de mercadorias nao abrangidas pelo anexo II do Tratado, as
    regras gerais relativas à concessao das restituiçoes à exportaçao e os critérios
    de fixaçao do seu montante
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3381/90 DEL CONSEJO de 20 de noviembre de 1990 que
    modifica el Reglamento (CEE) no 3035/80 por el que se establecen, para determinados
    productos agricolas exportados en forma de mercancias no incluidas en el Anexo
    II del Tratado, las normas generales relativas a la concesion de restituciones
    a la exportacion y los criterios para la fijacion de su importe
  type: main
