title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3381/90 of 20 November 1990 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the treaty and the criteria for fixing the amounts of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3381/90 du Conseil du 20 novembre 1990 modifiant le
    règlement (CEE) n° 3035/80 établissant, pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité, les règles
    générales relatives à l'octroi des restitutions à l'exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3381/90 DES RATES vom 20. November 1990 zur Aenderung
    der Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln fuer die
    Gewaehrung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    fuer bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgefuehrt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3381/90 af 20. november 1990 om ændring
    af forordning (EØF) nr. 3035/80 om fastsættelse af almindelige regler for ydelse
    af eksportrestitutioner og om fastlæggelse af kriterierne for fastsættelse af
    restitutionsbeløbet for visse landbrugsprodukter, der udføres i form af varer,
    som ikke omfattes af Traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3381/90 του Συμβουλίου
