    144, 151, 152 y 153 de las Naciones Unidas, a las propuestas de modificaciones
    de los Reglamentos Técnicos Mundiales n.os 7, 15 y 18, a la propuesta de enmiendas
    a la Resolución Mutua R.M.3, a las propuestas de dos nuevos Reglamentos de las
    Naciones Unidas relativos al desplazamiento en marcha atrás y los sistemas de
    información al inicio de la marcha y a la propuesta de un nuevo Reglamento Técnico
    Mundial sobre la determinación de la potencia de los vehículos eléctricos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2020/1637 av den 3 november 2020 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i världsforumet för harmonisering
    av fordonsföreskrifter inom Förenta nationernas ekonomiska kommission för Europa
    vad gäller förslagen till ändringar av FN-föreskrifterna nr 0, 13, 16, 17,
    44, 55, 83, 93, 94, 95, 100, 115, 137, 144, 151, 152 och 153, vad gäller förslagen
    till ändringar av de globala tekniska föreskrifterna nr 7, 15 och 18, vad gäller
    förslaget till ändringar av den ömsesidiga resolutionen M.R.3, vad gäller
    förslagen till två nya FN-föreskrifter om backning och system för detektion
    vid start samt vad gäller förslaget till en ny global teknisk föreskrift om
    bestämning av elfordonseffekt
