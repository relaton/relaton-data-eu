title:
- language: en
  script: Latn
  content: Council Directive 72/444/EEC of 26 December 1972 making an eighth amendment
    to the Directive on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 72/444/CEE du Conseil, du 26 décembre 1972, portant huitième
    modification de la directive relative au rapprochement des législations des États
    membres concernant les agents conservateurs pouvant être employés dans les denrées
    destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 72/444/EWG des Rates vom 26. Dezember 1972 zur achten Änderung
    der Richtlinie zur Angleichung der Rechtsvorschriften der Mitgliedstaaten für
    konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 72/444/EØF af 26. december 1972 om den ottende ændring
    af direktivet om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 72/444/ΕΟΚ του Συμβουλίου της 26ης Δεκεμβρίου
    1972 περί ογδόης τροποποιήσεως της οδηγίας περί
    προσεγγίσεως των νομοθεσιών των κρατών μελών
    σχετικά με τα συντηρητικά που επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 72/444/ETY, annettu 26 päivänä joulukuuta 1972,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin muuttamisesta kahdeksannen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 72/444/CEE del Consiglio, del 26 dicembre 1972, recante ottava
    modifica della direttiva relativa al ravvicinamento delle legislazioni degli Stati
    Membri sui conservativi che possono essere impiegati nelle derrate destinate all'alimentazione
    umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 72/444/EEG van de Raad van 26 december 1972 houdende achtste
    wijziging van de Richtlijn betreffende de aanpassing van de wetgevingen van de
    Lid-Staten inzake conserveermiddelen die mogen worden gebruikt in voor menselijke
    voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 72/444/CEE do Conselho, de 26 de Dezembro de 1972, que altera
    pela oitava vez a Directiva relativa à aproximação das legislações dos Estados-Membros
    respeitantes aos conservantes que podem ser utilizados nos géneros destinados
    à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 72/444/CEE del Consejo, de 26 de diciembre de 1972, que modifica
    por octava vez la Directiva relativa a la aproximación de las legislaciones de
    los Estados Miembros sobre los agentes conservadores que pueden utilizarse en
    los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 72/444/EEG av den 26 december 1972 med åttonde ändringen
    av direktivet om tillnärmning av medlemsstaternas lagstiftning om konserveringsmedel
    som är godkända för användning i livsmedel
  type: main
