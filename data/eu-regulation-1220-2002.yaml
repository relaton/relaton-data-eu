title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1220/2002 of 5 July 2002 determining the
    extent to which applications lodged in June 2002 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1220/2002 de la Commission du 5 juillet 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juin 2002 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1220/2002 der Kommission vom 5. Juli 2002 über den
    Umfang, in dem den im Monat Juni 2002 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1220/2002 af 5. juli 2002 om fastsættelse
    af, i hvilken udstrækning anmodninger om importrettigheder, indgivet i juni 2002
    for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1220/2002 της Επιτροπής,
    της 5ης Ιουλίου 2002, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιώματος εισαγωγής που κατατέθηκαν τον
    Ιούνιο του 2002 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1220/2002, annettu 5 päivänä heinäkuuta 2002,
    kesäkuussa 2002 jätetyistä, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevista tuontioikeushakemuksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1220/2002 della Commissione, del 5 luglio 2002, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto di
    importazione presentate nel mese di giugno 2002 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1220/2002 van de Commissie van 5 juli 2002 waarbĳ
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juni 2002 ingediende
    aanvragen om invoerrechten voor bevroren rundvlees, bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1220/2002 da Comissão, de 5 de Julho de 2002, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Junho de 2002 para carne de bovino congelada destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1220/2002 de la Comisión, de 5 de julio de 2002, por
    el que se determina en qué medida podrá darse curso a las solicitudes de derechos
    de importación presentadas hasta el mes de junio de 2002 para las carnes de vacuno
    congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1220/2002 av den 5 juli 2002 om i vilken
    utsträckning ansökningar om importavgifter som lämnats in under juni 2002 för
    fruset nötkött för bearbetning kan godkännas
  type: main
