title:
- language: en
  script: Latn
  content: '90/162/EEC: Commission Decision of 23 March 1990 amending Decision 89/244/EEC
    authorizing certain Member States to provide for exceptions from certain provisions
    of Directive 77/93/EEC in respect of potatoes for human consumption originating
    in Turkey (Only the Dutch, French and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/162/CEE: Décision de la Commission du 23 mars 1990 modifiant la décision
    89/244/CEE autorisant certains Etats membres à prévoir des dérogations à certaines
    dispositions de la directive 77/93/CEE pour les pommes de terre de consommation
    originaires de Turquie (Les textes en langues néerlandaise, française et allemande
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '90/162/EWG: Entscheidung der Kommission vom 23. März 1990 zur Änderung
    der Entscheidung 89/244/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Speisekartoffeln mit Ursprung in der Türkei Ausnahmen von einigen Vorschriften
    der Richtlinie 77/93/EWG zuzulassen (Nur der niederländische, französische und
    deutsche Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/162/EØF: Kommissionens beslutning af 23. marts 1990 om ændring af
    beslutning 89/244/EØF om bemyndigelse af visse medlemsstater til at fastsætte
    undtagelser fra visse bestemmelser i direktiv 77/93/EØF for spisekartofler med
    oprindelse i Tyrkiet (Kun den nederlandske, franske og tyske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '90/162/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Μαρτίου 1990 για την τροποποίηση της απόφασης
    89/244/ΕΟΚ που επιτρέπει σε ορισμένα κράτη μέλη
    να προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ όσον αφορά τις πατάτες για
    ανθρώπινη κατανάλωση καταγωγής Τουρκίας (Τα
    κείμενα στην ολλανδική, γαλλική και γερμανική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '90/162/CEE: Decisione della Commissione del 23 marzo 1990 recante modifica
    della decisione 89/244/CEE che autorizza taluni Stati membri a stabilire deroghe,
    per le patate da consumo originarie della Turchia, a talune disposizioni della
    direttiva 77/93/CEE (Il testi in lingua olandese, francese e tedesca sono i soli
    facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '90/162/EEG: Beschikking van de Commissie van 23 maart 1990 tot wijziging
    van Beschikking 89/244/EEG houdende machtiging van bepaalde Lid-Staten om, voor
    consumptieaardappelen van oorsprong uit Turkije, afwijkingen van sommige bepalingen
    van Richtlijn 77/93/EEG toe te staan (Slechts de teksten in de Nederlandse, Franse
    en de Duitse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/162/CEE: Decisão da Comissão de 23 de Março de 1990 que altera a
    Decisao 89/244/CEE, que autoriza determinados Estados-membros a estabelecer derrogaçoes
    de determinadas normas da Directiva 77/93/CEE em relação à batata de consumo
    originaria da Turquia (Apenas fazem fé os textos nas línguas neerlandesa, francesa
    e alemã)'
  type: main
- language: es
  script: Latn
  content: '90/162/CEE: Decisión de la Comisión de 23 de marzo de 1990 por la que
    se modifica la Decision 89/244/CEE por la que se autoriza a algunos Estados miembros
    a prever excepciones a determinadas disposiciones de la Directiva 77/93/CEE respecto
    de las patatas destinadas al consumo humano originarias de Turquia (Los textos
    en lenguas neerlandesa, francesa y alemana son los únicos auténticos)'
