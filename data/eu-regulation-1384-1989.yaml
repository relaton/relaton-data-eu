    Leder oder rekonstituiertem Leder und Oberteil aus Spinnstoffen sowie andere Schuhe
    mit Laufsohlen aus Kautschuk, Kunststoff, Leder oder rekonstituiertem Leder der
    KN-Code 6404 und 6405 90 10 mit Ursprung auf den Philippinen, denen die in der
    Verordnung (EWG) Nr. 4257/88 des Rates vorgesehehnen Zollpräferenzen gewährt
    werden #'
  type: main
- language: da
  script: Latn
