    kunstlæder og overdel af tekstilmaterialer og andet fodtøj med ydersål af gummi,
    plast, læder eller kunstlæder henhørende under KN-kode 6404 og 6405 90 10 og
    med oprindelse i Filippinerne, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 4257/88
  type: main
