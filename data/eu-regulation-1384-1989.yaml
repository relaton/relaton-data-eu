title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1384/89 of 22 May 1989 re-establishing the
    leving of customs duties on footwear with outer soles of rubber, plastics, leather
    or composition leather and uppers of textile materials and other footwear, with
    outer soles of rubber, plastics, leather or composition leather, falling within
    CN codes 6404 and 6405 90 10, originating in the Philippines, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1384/89 de la Commission du 22 mai 1989 portant rétablissement
    de la perception des droits de douane applicables aux chaussures à semelles extérieures
    en caoutchouc, matière plastique, cuir naturel ou reconstitué et dessus en cuir
    naturel, et aux autres chaussures à semelles extérieures en caoutchouc, en matière
    plastique, en cuir naturel ou reconstitué, des codes NC 6404 et 6405 90 10, originaires
    des Philippines, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1384/89 DER KOMMISSION vom 22. Mai 1989 zur Wiedereinführung
