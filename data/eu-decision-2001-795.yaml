    1 de agosto y el 31 de diciembre de 2001'
  type: main
- language: sv
  script: Latn
  content: '2001/795/EG: Rådets beslut av den 29 oktober 2001 om undertecknande på
    Europeiska gemenskapens vägnar och provisorisk tillämpning av två avtal genom
