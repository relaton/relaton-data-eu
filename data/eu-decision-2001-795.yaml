title:
- language: en
  script: Latn
  content: '2001/795/EC: Council Decision of 29 October 2001 on the signing, on behalf
    of the European Community, and the provisional application of two Agreements in
    the form of Exchanges of Letters concerning the extension of the Protocol establishing
    the fishing opportunities and financial compensation provided for in the Agreement
    between the European Economic Community and the Government of the Republic of
    Senegal on fishing off the coast of Senegal for the periods 1 May 2001 to 31 July
    2001 and 1 August 2001 to 31 December 2001'
  type: main
- language: fr
  script: Latn
  content: '2001/795/CE: Décision du Conseil du 29 octobre 2001 relative à la signature,
    au nom de la Communauté européenne, et à l''application provisoire de deux
    accords sous forme d''échanges de lettres relatifs à la prorogation du protocole
    fixant les possibilités de pêche et la contrepartie financière prévues dans
    l''accord entre la Communauté économique européenne et le gouvernement de la
    République du Sénégal concernant la pêche au large de la côte sénégalaise
    pour les périodes allant du 1er mai 2001 au 31 juillet 2001 et du 1er août 2001
    au 31 décembre 2001'
  type: main
- language: de
  script: Latn
  content: '2001/795/EG: Beschluss des Rates vom 29. Oktober 2001 über die Unterzeichnung
    — im Namen der Europäischen Gemeinschaft — und die vorläufige Anwendung
    von zwei Abkommen in Form von Briefwechseln über die Verlängerung des Protokolls
    zur Festlegung der Fangmöglichkeiten und der finanziellen Gegenleistung nach
    dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Senegal über die Fischerei vor der senegalesischen Küste für die
    Zeit vom 1. Mai 2001 bis zum 31. Juli 2001 und für die Zeit vom 1. August 2001
    bis zum 31. Dezember 2001'
  type: main
- language: da
  script: Latn
  content: '2001/795/EF: Rådets afgørelse af 29. oktober 2001 om undertegnelse på
    vegne af Det Europæiske Fællesskab og om midlertidig anvendelse af to aftaler
    i form af brevvekslinger om forlængelse af protokollen om fastsættelse af de
    fiskerimuligheder og den finansielle modydelse, der er omhandlet i aftalen mellem
    Det Europæiske Økonomiske Fællesskab og regeringen for Republikken Senegal
    om fiskeri ud for Senegals kyst, for henholdsvis perioden 1. maj 2001 til 31.
    juli 2001 og perioden 1. august 2001 til 31. december 2001'
  type: main
- language: el
  script: Grek
  content: '2001/795/ΕΚ: Απόφαση του Συμβουλίου, της 29ης
    Οκτωβρίου 2001, για την υπογραφή, εξ ονόματος
    της Κοινότητας, και για την προσωρινή εφαρμογή
    δύο συμφωνιών υπό μορφή ανταλλαγής επιστολών
    σχετικά με την παράταση του πρωτοκόλλου για
    τον καθορισμό των αλιευτικών δυνατοτήτων και
    της χρηματικής αντιστάθμισης που προβλέπονται
    στη συμφωνία μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της κυβέρνησης της Δημοκρατίας
    της Σενεγάλης, όσον αφορά την αλιεία στα ανοικτά
    των ακτών της Σενεγάλης για τις περιόδους από
    την 1η Μαΐου 2001 έως τις 31 Ιουλίου 2001 και από
    την 1η Αυγούστου 2001 έως τις 31 Δεκεμβρίου 2001'
  type: main
- language: fi
  script: Latn
  content: '2001/795/EY: Neuvoston päätös, tehty 29 päivänä lokakuuta 2001,
    Euroopan talousyhteisön ja Senegalin tasavallan hallituksen välisessä Senegalin
    rannikon edustalla harjoitettavaa kalastusta koskevassa sopimuksessa määrättyjen
