    dois acordos sob forma de trocas de cartas relativos à prorrogação do protocolo
    que fixa, para o período compreendido entre 1 de Maio de 2001 e 31 de Julho de
    2001 e o período compreendido entre 1 de Agosto de 2001 e 31 de Dezembro de 2001,
    as possibilidades de pesca e a contrapartida financeira previstas no acordo entre
    a Comunidade Económica Europeia e o Governo da República do Senegal respeitante
    à pesca ao largo da costa senegalesa'
  type: main
- language: es
  script: Latn
  content: '2001/795/CE: Decisión del Consejo, de 29 de octubre de 2001, relativa
