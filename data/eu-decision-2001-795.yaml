    van de vangstmogelĳkheden en de financiële tegenprestatie bedoeld in de Overeenkomst
    tussen de Europese Economische Gemeenschap en de Regering van de Republiek Senegal
    inzake de visserĳ voor de Senegalese kust, voor de periode van 1 mei 2001 tot
    en met 31 juli 2001 en voor de periode van 1 augustus 2001 tot en met 31 december
    2001'
  type: main
- language: pt
  script: Latn
  content: '2001/795/CE: Decisão do Conselho, de 29 de Outubro de 2001, respeitante
