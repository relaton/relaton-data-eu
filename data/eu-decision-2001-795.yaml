    dos Acuerdos en forma de Canje de Notas sobre la prórroga del Protocolo por el
    que se fijan las posibilidades de pesca y la compensación financiera estipuladas
    en el Acuerdo entre la Comunidad Económica Europea y el Gobierno de la República
    del Senegal referente a la pesca en alta mar de la costa senegalesa, para los
