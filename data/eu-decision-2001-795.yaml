    protocollo che fissa le possibilità di pesca e la contropartita finanziaria previste
    nell''accordo tra la Comunità economica europea e il governo della Repubblica
    del Senegal sulla pesca al largo della costa senegalese, per i periodi dal 1°
    maggio 2001 al 31 luglio 2001 e dal 1° agosto 2001 al 31 dicembre 2001'
  type: main
- language: nl
  script: Latn
  content: '2001/795/EG: Besluit van de Raad van 29 oktober 2001 betreffende de ondertekening,
