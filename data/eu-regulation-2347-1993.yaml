  content: COUNCIL REGULATION (EEC) No 2347/93 of 24 August 1993 repealing Regulation
    (EEC) No 112/90 imposing anti-dumping measures concerning imports of certain compact
    disc players originating in Japan and the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2347/93 du Conseil du 24 août 1993 abrogeant le règlement
    (CEE) n° 112/90 instituant un droit antidumping définitif sur les importations
    de certains lecteurs de disques compacts originaires du Japon et de la République
    de Corée
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2347/93 DES RATES vom 24. August 1993 zur Aufhebung
    der Verordnung (EWG) Nr. 112/90 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren bestimmter CD-Spieler mit Ursprung in Japan und der Republik
    Korea
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EØF) Nr. 2347/93 af 24. august 1993 om ophævelse
    af forordning (EØF) nr. 112/90 om indførelse af antidumpingforanstaltninger
    vedrørende importen af visse CD-afspillere med oprindelse i Japan og Republikken
    Korea
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2347/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 24ης Αυγούστου 1993 για την κατάργηση του
    κανονισμού (ΕΟΚ) αριθ. 112/90 με τον οποίο έχουν
    επιβληθεί μέτρα αντιντάμπινγκ στις εισαγωγές
    ορισμένων συσκευών αναπαραγωγής ήχου με σύστημα
