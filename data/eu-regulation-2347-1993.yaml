    DP) καταγωγής Ιαπωνίας και Δημοκρατίας της Κορέας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2347/93 DEL CONSIGLIO del 24 agosto 1993 che abroga
    il regolamento (CEE) n. 112/90 che istituisce misure antidumping sulle importazioni
    di alcuni tipi di lettori di dischi compact originari del Giappone e della Repubblica
    di Corea
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2347/93 VAN DE RAAD van 24 augustus 1993 houdende
    intrekking van Verordening (EEG) nr. 112/90 tot instelling van een definitief
    anti-dumpingrecht op de invoer van bepaalde compact-discspelers van oorsprong
    uit Japan en de Republiek Korea
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2347/93 DO CONSELHO de 24 de Agosto de 1993 que revoga
    o Regulamento (CEE) nº 112/90 que institui medidas anti-dumping sobre as importações
    de certos leitores de discos compactos originários do Japão e da República
    da Coreia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2347/93 DEL CONSEJO de 24 de agosto de 1993 por el
