    von Fleischerzeugnissen in die Gemeinschaft zugelassen ist (92/257/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 21. april 1992 om ændring af beslutning 87/119/EØF
