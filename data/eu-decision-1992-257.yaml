  content: '92/257/EEC: Commission Decision of 21 April 1992 amending Decision 87/119/EEC
    as regards the list of establishments in Brazil approved for the purpose of importing
    meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '92/257/CEE: Décision de la Commission du 21 avril 1992 modifiant la décision
    87/119/CEE en ce qui concerne la liste des établissements du Brésil agréés
    pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 21. April 1992 zur Änderung der Entscheidung
