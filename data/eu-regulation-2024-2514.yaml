title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/2514 of 3 July 2024 supplementing
    Regulation (EU) 2022/2399 of the European Parliament and of the Council by specifying
    the data elements to be exchanged through the European Union Customs Single Window
    Certificates Exchange System and amending that Regulation as regards the list
    of Union non-customs formalities covered by the EU Single Window Environment for
    Customs
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/2514 de la Commission du 3 juillet 2024
    complétant le règlement (UE) 2022/2399 du Parlement européen et du Conseil
    en précisant les éléments de données devant être échangés au moyen du système
    d’échange de certificats dans le cadre du guichet unique de l’Union européenne
    pour les douanes et modifiant ledit règlement en ce qui concerne la liste des
    formalités non douanières de l’Union couvertes par l’environnement de guichet
    unique de l’Union européenne pour les douanes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/2514 der Kommission vom 3. Juli 2024 zur
    Ergänzung der Verordnung (EU) 2022/2399 des Europäischen Parlaments und des
    Rates durch Festlegung der Datenelemente, die über das Single-Window-System der
    Europäischen Union für den Austausch von Bescheinigungen im Zollbereich auszutauschen
    sind, und zur Änderung dieser Verordnung in Bezug auf die Liste der Nichtzollformalitäten
    der Union, die unter die Single-Window-Umgebung der EU für den Zoll fallen
  type: main
- language: bg
  script: Cyrl
