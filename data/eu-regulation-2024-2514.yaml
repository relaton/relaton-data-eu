  script: Latn
  content: Regolamento delegato (UE) 2024/2514 della Commissione, del 3 luglio 2024,
    che integra il regolamento (UE) 2022/2399 del Parlamento europeo e del Consiglio
    specificando i dati da scambiare attraverso il sistema di scambio di certificati
    nell’ambito dello sportello unico dell’Unione europea per le dogane e modifica
