    specificarea elementelor de date care trebuie să facă obiectul schimburilor
    efectuate prin intermediul Sistemului de schimb de certificate în cadrul ghișeului
    unic al UE pentru vămi și de modificare a regulamentului respectiv în ceea
    ce privește lista formalităților nevamale ale Uniunii acoperite de mediul aferent
    ghișeului unic al UE pentru vămi
  type: main
