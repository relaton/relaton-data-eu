    duomenų elementus, kuriais turi būti keičiamasi per Europos Sąjungos muitinės
    vieno langelio sertifikatų mainų sistemą, ir iš dalies keičiamas tame reglamente
    nustatytas Sąjungos ne muitinės formalumų, tvarkomų ES muitinės vieno langelio
    aplinkoje, sąrašas
  type: main
