    upřesněním prvků údajů, které mají být vyměňovány prostřednictvím
    jednotného celního portálu Evropské unie pro výměnu certifikátů, a změnou
    uvedeného nařízení, pokud jde o seznam necelních formalit Unie, na něž
    se vztahuje jednotný portál EU pro oblast celnictví
  type: main
