title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1961/78 of 10 August 1978 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A, originating in Hong Kong to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1961/78 de la Commission, du 10 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l'éclairage, de la sous-position tarifaire 85.20
    A, originaires de Hong-Kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1961/78 der Kommission vom 10. August 1978 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung, der Tarifstelle
    85.20 A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1961/78 af 10. august 1978 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning, under underposition
    85.20 A, som har oprindelse i Hongkong og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1961/78 della Commissione, del 10 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade e tubi a
    incandescenza per l'illuminazione, della sottovoce doganale 85.20 A, originari
    di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1961/78 van de Commissie van 10 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit
    Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
