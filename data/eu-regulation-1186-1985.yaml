title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1186/85 of 7 May 1985 re-establishing the
    levying of customs duties on men' s and boys' underpants and briefs, women' s,
    girls' and infants' knickers and briefs, products of category 13 (code 40.0130),
    originating in Pakistan, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1186/85 de la Commission du 7 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux slips et caleçons pour
    hommes et garçonnets, slips et culottes pour femmes, fillettes et jeunes enfants,
    de la catégorie 13 (code 40.0130), originaires du Pakistan, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1186/85 der Kommission vom 7. Mai 1985 über die Wiedereinführung
    des Zollsatzes für Unterhosen und Slips für Männer und Knaben, Schlüpfer und
    dergleichen für Frauen, Mädchen und Kleinkinder der Warenkategorie Nr. 13 (Kennziffer
    40.0130) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3563/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1186/85 af 7. maj 1985 om genindførelse
    af opkrævning af toldafgifter for trusser og andre underbenklæder til mænd
    og drenge, trusser og andre underbenklæder til kvinder, piger og småbørn, under
    varekategori nr. 13 (kode 40.0130), som har oprindelse i Pakistan og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1186/85 της Επιτροπής
    της 7ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για σλιπς και εσώβρακα
    για άνδρες και παιδιά, σλιπς και κυλόττες για
    γυναίκες, κορασίδες και μικρά παιδιά, προϊόντα
    της κατηγορίας 13 (κωδικός αριθμός 40.0130), καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1186/85 della Commissione del 7 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili a mutande, mutandine e slip per uomo
    e per ragazzo, nonché per donna, per ragazza e per bambini, della categoria di
    prodotti n. 13 (codice 40.0130) originari del Pakistan beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1186/85 van de Commissie van 7 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op slips en
    onderbroeken voor heren en jongens, slips en broeken voor dames, meisjes en kinderen,
    van de categorie van produkten nr. 13 (codenummer 40.0130), van oorsprong uit
    Pakistan waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3563/84 van de Raad
