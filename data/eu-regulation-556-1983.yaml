    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweizen
    auf 800 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 556/83 af 10. marts 1983 om ændring
