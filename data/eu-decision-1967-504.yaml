title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 juillet 1967, portant extension du champ
    d'application de sa décision du 17 juillet 1962 instituant des méthodes de coopération
    administrative spéciales pour l'application des prélèvements intracommunautaires
    institués dans le cadre de la politique agricole commune aux graines de colza,
    de navette et de tournesol visées par le règlement n° 136/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: '67/504/EWG: Entscheidung der Kommission vom 3. Juli 1967 über die Ausdehnung
    des Anwendungsbereichs ihrer Entscheidung vom 17. Juli 1962, mit der besondere
    Methoden der Zusammenarbeit der Verwaltung zur Anwendung der innergemeinschaftlichen
    Abschöpfungen, die im Rahmen der gemeinsamen Agrarpolitik vorgesehen worden sind,
    eingeführt wurden, auf die unter die Verordnung Nr. 136/66/EWG des Rates fallenden
    Raps- und Rübsensamen und Sonnenblumenkerne'
  type: main
- language: it
  script: Latn
  content: '67/504/CEE: Decisione della Commissione, del 3 luglio 1967, che porta
    estensione del campo di applicazione della sua decisione del 17 luglio 1962, relativa
    ai metodi speciali di cooperazione amministrativa per l''applicazione dei prelievi
    intracomunitari istituiti nell''ambito della politica agricola comune ai semi
    di colza, di ravizzone e di girasole di cui al regolamento n. 136/66/CEE'
  type: main
- language: nl
  script: Latn
  content: '67/504/EEG: Beschikking van de Commissie van 3 juli 1967 waarbij het toepassingsgebied
    van de beschikking van 17 juli 1962 tot invoering van bijzondere methoden van
    administratieve samenwerking inzake de toepassing van de in het kader van het
    gemeenschappelijk landbouwbeleid ingestelde intracommunautaire heffingen wordt
    uitgebreid tot het bij Verordening Nr. 136/66/EEG van de Raad bedoelde koolzaad,
    raapzaad en zonnebloemzaad'
  type: main
