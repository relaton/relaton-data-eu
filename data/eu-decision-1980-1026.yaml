title:
- language: en
  script: Latn
  content: '80/1026/EEC: Commission Decision of 20 October 1980 on the reimbursement
    by the EAGGF, Guidance Section, to the Federal Republic of Germany of expenditure
    incurred during 1979 on aid relating to the provision of socio- economic guidance
    for and the acquisition of occupational skills by persons engaged in agriculture
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1026/CEE: Décision de la Commission, du 20 octobre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à la République fédérale d''Allemagne des
    dépenses effectuées pendant l''année 1979 pour les aides relatives à l''information
    socio-économique et à la qualification professionnelle des personnes travaillant
    dans l''agriculture (Le texte en langue allemande est le seul faisant foi.)'
  type: main
