    Information und die berufliche Qualifikation der in der Landwirtschaft tätigen
    Personen durch den EAGFL, Abteilung Ausrichtung, an die Bundesrepublik Deutschland
    (Nur der deutsche Text ist verbindlich)'
  type: main
