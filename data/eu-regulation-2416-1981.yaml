title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2416/81 of 21 August 1981 re-establishing
    the levying of customs duties on statuettes and other ornaments, and articles
    of personal adornment; articles of furniture, falling within heading No 69.13
    and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2416/81 de la Commission, du 21 août 1981, portant
    rétablissement de la perception des droits de douane applicables aux statuettes,
    objets de fantaisie, d' ameublement, d' ornementation ou de parure, de la position
    69.13 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2416/81 der Kommission vom 21. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für Figuren, Phantasiegegenstände, Einrichtungs-, Zier-
    und Schmuckgegenstände, der Tarifnummer 69.13, mit Ursprung in Südkorea, dem
    die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2416/81 af 21. august 1981 om genindførelse
    af opkrævning af told for statuetter og andre dekorationsgenstande, pyntegenstande
    til personligt brug, artikler til boligudstyr, henhørende under pos. 69.13 og
    med oprindelse i Sydkorea, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2416/81 τής Επιτροπής
    τής 21ης Αυγούστου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά αγαλματίδια, μικροκαλλιτεχνήματα,
    αντικείμενα επιπλώσεως, διακοσμήσεως ή ατομικού
    στολισμού, τής δασμολογικής κλάσεως 69. 13 καταγωγής
    Νοτίου Κορέας δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2416/81 della Commissione, del 21 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili alle statuette, agli oggetti
    di fantasia, di arredamento o di ornamento anche personale, della voce 69.13 della
    tariffa doganale comune, originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2416/81 van de Commissie van 21 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op beeldjes, fancy-artikelen,
    meubilerings- en versieringsvoorwerpen, lijfsieraden, van tariefpost 69.13, van
    oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3322/80 van de
    Raad vermelde tariefpreferenties zijn verleend
  type: main
