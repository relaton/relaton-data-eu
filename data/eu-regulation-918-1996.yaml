title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 918/96 of 22 May 1996 determining the extent
    to which import licence applications submitted in April 1996 under the tariff
    quotas for beef provided for in the Agreements on free trade between the Community,
    of the one part, and Lithuania, Latvia, and Estonia, of the other part, may be
    accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 918/96 de la Commission, du 22 mai 1996, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 1996 pour les contingents tarifaires de la viande bovine
    prévus dans les accords sur la libéralisation des échanges entre la Communauté,
    d'une part, et l'Estonie, la Lettonie et la Lituanie, d'autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 918/96 der Kommission vom 22. Mai 1996 zur Bestimmung
    des Ausmaßes, in dem den im April 1996 gestellten Anträgen auf Erteilung von
    Einfuhrlizenzen im Rahmen der in den Freihandelsabkommen zwischen der Gemeinschaft
    einerseits und Litauen, Lettland und Estland andererseits vorgesehenen Zollkontingente
    für Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 918/96 af 22. maj 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicenser indgivet
    i april 1996 for de toldkontingenter i oksekødssektoren, der er fastsat i frihandelsaftalerne
    mellem Fællesskabet på den ene side og Estland, Letland og Litauen på den anden
    side
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 918/96 της Επιτροπής,
    της 22ας Μαΐου 1996, για τον καθορισμό σε ποιό
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Απρίλιο 1996 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται στις συμφωνίες
    ελεύθερων συναλλαγών μεταξύ της Κοινότητας,
    αφενός, και της Εσθονίας, της Λετονίας και της
    Λιθουανίας, αφετέρου
  type: main
- language: fi
  script: Latn
  content: 'KOMISSION ASETUS (EY) N:o 918/96,#annettu 22 päivänä toukokuuta 1996,#yhteisön
    sekä Viron, Latvian ja Liettuan välisissä vapaakauppasopimuksissa määrättyjä
    naudanlihan tariffikiintiöitä koskevien, huhtikuussa 1996 jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä #'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 918/96 della Commissione, del 22 maggio 1996, che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nell'aprile 1996 per i contingenti tariffari di carni bovine previsti dagli accordi
    di liberalizzazione degli scambi tra la Comunità, da un lato, e l'Estonia, la
    Lettonia e la Lituania, dell'altro
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 918/96 van de Commissie van 22 mei 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 1996 ingediende aanvragen
    om invoercertificaten voor de tariefcontingenten voor rundvlees op grond van de
    overeenkomsten betreffende vrijhandel tussen de Gemeenschap, enerzijds, en Estland,
    Letland en Litouwen, anderzijds
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 918/96 da Comissão, de 22 de Maio de 1996, que determina
