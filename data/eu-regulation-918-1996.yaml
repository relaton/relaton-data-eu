    em Abril de 1996 para os contingentes pautais de carne de bovino previstos nos
    acordos de comércio livre entre a Comunidade, por um lado, e a Estónia, a Letónia
    e a Lituânia, por outro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 918/96 de la Comisión, de 22 de mayo de 1996, por
    el que se determina la proporción en que podrán aceptarse las solicitudes de
    certificados de importación, presentadas en abril de 1996, correspondientes a
    los contingentes arancelarios de carne de vacuno establecidos en los Acuerdos
    de libre comercio celebrados entre la Comunidad, por una parte, y Lituania, Letonia
    y Estonia, por otra
  type: main
- language: sv
