title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1991/79 of 10 September 1979 re-establishing
    the levying of customs duties on cotton yarn put up for retail sale, falling within
    heading No 55.06 and originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1991/79 de la Commission, du 10 septembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton conditionnés pour la vente au détail, de la position 55.06 du tarif douanier
    commun, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1991/79 der Kommission vom 10. September 1979 über
    die Wiedereinführung des Zollsatzes für Baumwollgarne in Aufmachungen für den
    Einzelverkauf, der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die in
    der Verordnung (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1991/79 af 10. september 1979 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger,
    under pos. 55.06, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1991/79 della Commissione, del 10 settembre 1979,
    che ripristina la riscossione dei dazi doganali applicabili ai filati di cotone
    preparati per la vendita al minuto, della voce 55.06 della tariffa doganale comune,
    originari della Iugoslavia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1991/79 van de Commissie van 10 september 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    Joegoslavië waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 1195/79 van de Raad
  type: main
