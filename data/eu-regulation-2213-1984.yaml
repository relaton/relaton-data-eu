title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2213/84 of 30 July 1984 re-establishing
    the levying of customs duties on outer garments and other articles, knitted or
    crocheted, not elastic or rubberized, products of category 83 (code 0830), originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2213/84 de la Commission du 30 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux autres vêtements
    de dessus de bonneterie non élastique ni caoutchoutée, de la catégorie 83 (code
    0830), originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2213/84 der Kommission vom 30. Juli 1984 über die
    Wiedereinführung des Zollsatzes für andere Oberkleidung, Bekleidungszubehör
    aus Gewirken, weder gummielastisch noch kautschutiert, der Warenkategorie Nr.
    83 (Kennziffer 0830) mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2213/84 af 30. juli 1984 om genindførelse
    af opkrævning af toldafgifter for andre yderbeklædningsgenstande og andre varer
    af trikotage, ikke elastisk eller gummeret, under varekategori nr. 83 (kode 0830),
    som har oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2213/84 της Επιτροπής
    της 30ής Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτερα
    ενδύματα εξωτερικά πλεκτά, μη ελαστικά ουδέ
    συνδεδυασμένα μετά καουτσούκ, προϊόντα της
    κατηγορίας 83 (κωδικός 0830), καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2213/84 della Commissione del 30 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ad altri indumenti esterni a maglia
    non elastica né gommata, della categoria di prodotti n. 83 (codice 0830), originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2213/84 van de Commissie van 30 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere bovenkleding,
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van de categorie
    van produkten nr. 83 (codenummer 0830), van oorsprong uit Brazilië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3570/83
    van de Raad
  type: main
