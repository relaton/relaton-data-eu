    a údaje, které v potvrzení mají být uvedeny
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. januar 1988 om udformningen af afstamningscertifikater
    for saed og embryoner af racerent avlskvaeg og de oplysninger, certifikaterne
    skal indeholde
  type: main
- language: el
  script: Grek
  content: ">Απόφαση της Επιτροπής της 21ης Ιανουαρίου για την κατάρτιση των υποδειγμάτων και τον καθορισμό των στοιχείων που πρέπει να αναφέρονται στα γενεαλογικά πιστοποιητικά για το σπέρμα και γονιμοποιημένα ωάρια των βοοειδών αναπαραγωγής καθαράς φυλής"
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 21. jaanuar 1988, millega sätestatakse tõupuhaste aretusveiste
