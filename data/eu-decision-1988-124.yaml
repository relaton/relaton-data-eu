title:
- language: en
  script: Latn
  content: Commission Decision of 21 January 1988 laying down the specimen pedigree
    certificates for the semen and embryos of pure-bred breeding animals of the bovine
    species and the particulars to be entered on those certificates
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 janvier 1988, fixant la présentation
    type des certificats généalogiques relatifs au sperme et aux ovules fécondés
    d'animaux de l'espèce bovine reproducteurs de race pure et les mentions à y
    faire figurer
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Januar 1988 über die Muster und Angaben
    in Zuchtbescheinigungen für Samen und befruchtete Eizellen reinrassiger Zuchtrinder
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 21 януари 1988 година
    относно определяне на образците на сертификатите
    за родословие за семенната течност и ембрионите
    от чистопородни разплодни животни от рода
    на едрия рогат добитък и на данните, които трябва
    да се съдържат в тези сертификати
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 21. ledna 1988, kterým se stanoví vzor potvrzení
