  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1988. január 21.) a szarvasmarhafélék fajtatiszta
    tenyészállatainak spermájáról és embrióiról kiállított származásibizonyítvány-minta
    és a bizonyítványban feltüntetendő adatok megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 gennaio 1988, che stabilisce il modello
    dei certificati genealogici relativi allo sperma e agli ovuli fecondati di bovini
    riproduttori di razza pura e le indicazioni che vi devono figurare
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1988. gada 21. janvāris) par ģenealoģisko sertifikātu
    paraugiem liellopu sugas tīršķirnes vaislinieku spermai un embrijiem un datiem,
    kas jānorāda šajos sertifikātos
  type: main
- language: lt
  script: Latn
  content: 1988 m. sausio 21 d. Komisijos Sprendimas nustatantis grynaveislių veislinių
    galvijų spermos ir embrionų kilmės pažymėjimų pavyzdžius ir šiuose pažymėjimuose
    nurodytiną informaciją
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-21 ta' Jannar 1988 li tistabbilixxi
    ċ-ċertifikati mudell tar-razza għall-isperma u embrijuni ta' l-annimali bovini
    ta' razza pura għar-refgħa u l-partikularitajiet li għandhom jiddaħħlu fihom
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 januari 1988 houdende vaststelling
    van het model van en de gegevens die moeten voorkomen op de stamboekcertificaten
    voor sperma en embryo's van raszuivere fokrunderen
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 21 stycznia 1988 r. ustanawiająca wzory świadectw
    rodowodowych dla nasienia i zarodków zwierząt hodowlanych czystorasowych z gatunków
    bydła i szczegółowe dane zawarte w tych świadectwach
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 21 de Janeiro de 1988, que estabelece os modelos
    dos certificados genealógicos do esperma e dos óvulos fecundados dos animais
    reprodutores de raça pura da espécie bovina e as menções que deles devem constar
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 21 ianuarie 1988 de stabilire a modelului de certificate
    genealogice privind materialul seminal și ovulele fecundate de la animalele de
    reproducere de rasă pură din specia bovină și a informațiilor pe care acestea
    trebuie să le conțină
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 21. januára 1988, ktorým sa ustanovujú vzory osvedčení
    o pôvode pre spermu a embryá čistokrvného plemenného hovädzieho dobytka
    a údaje, ktoré v týchto osvedčeniach majú byť uvedené
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 21. januarja 1988 o določitvi vzorca zootehniških
    spričeval za seme in zarodke čistopasemskega plemenskega goveda in podatkov,
    ki se v ta spričevala vpišejo
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 21 de enero de 1988, por la que se establecen
    los modelos y las indicaciones que deban incluirse en los certificados genealógicos
    relativos al esperma y a los óvulos fecundados de animales reproductores de raza
    selecta de la especie bovina
