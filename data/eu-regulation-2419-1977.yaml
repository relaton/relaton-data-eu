title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2419/77 of 28 October 1977 re-establishing
    the levying of customs duties on heavy petroleum oils falling within subheadings
    27.10 C I c), II c), III c) and d) and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2419/77 de la Commission, du 28 octobre 1977, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole lourdes, des sous-positions tarifaires 27.10 C I c), II c), III c) et
    d), originaires de la Roumanie bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2419/77 der Kommission vom 28. Oktober 1977 zur Wiedereinführung
    des Zollsatzes für Schweröle der Tarifstellen 27.10 C I c), II c), III c) und
    d), mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2419/77 af 28. oktober 1977 om genindførelse
    af opkrævning af toldafgifter for tunge olier, henhørende under pos. 27.10 C
    I c), II c), III c) og d), som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2419/77 della Commissione, del 28 ottobre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio pesanti,
    delle sottovoci doganali 27.10 C I c), II c), III c) e d), originari della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2419/77 van de Commissie van 28 oktober 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zware oliën,
    van post 27.10 C I c), II c), III c) en d), van oorsprong uit Roemenië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
