  content: Règlement (CEE) n° 244/72 de la Commission, du 2 février 1972, abrogeant
    le règlement (CEE) n° 53/72 portant application du droit du tarif douanier commun
    aux importations de certaines variétés d'oranges douces originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 244/72 der Kommission vom 2. Februar 1972 zur Aufhebung
    der Verordnung (EWG) Nr. 53/72 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren von bestimmten Orangesorten mit Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 244/72 della Commissione, del 2 febbraio 1972, che
    abroga il regolamento (CEE) n. 53/72 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di alcune varietà di arance dolci originarie
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 244/72 van de Commissie van 2 februari 1972 tot intrekking
    van Verordening (EEG) nr. 53/72 houdende toepassing van het recht van het gemeenschappelijk
    douanetarief op de invoer van bepaalde variëteiten zoete sinaasappelen van oorsprong
    uit Spanje
