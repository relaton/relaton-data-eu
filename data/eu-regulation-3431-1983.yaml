title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3431/83 of 30 November 1983 re-establishing
    the levying of customs duties on woven tarpaulins, sails, awnings and sunblinds,
    products of category 109 (code 1090), originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3431/83 de la Commission du 30 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations et stores d' extérieur, tissés, de la catégorie de produits
    no 109 (code 1090), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3431/83 der Kommission vom 30. November 1983 über
    die Wiedereinführung des Zollsatzes für Planen, Segel und Markisen, aus Geweben,
    der Warenkategorie Nr. 109 (Kennziffer 1090) mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3431/83 af 30. november 1983 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl og markiser, vævede, under
    varekategori nr. 109 (kode 1090), som har oprindelse i Sydkorea, og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3431/83 της Επιτροπής
    της 30ής Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για καλύμματα
    εμπορευμάτων, οχημάτων κλπ., ιστία εν γένει
    και εξωτερικά προπετάσματα για θυρώματα καταστημάτων
    κλπ., υφασμένα, της κατηγορίας 109 (κωδικός 1090),
    καταγωγής Νοτίου Κορέας, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3431/83 della Commissione del 30 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai copertoni, vele per
    imbarcazioni e tende per l' esterno, tessuti, della categoria di prodotti n. 109
    (codice 1090), originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3431/83 van de Commissie van 30 november 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    dekkleden, scheepszeilen, zonneschermen voor winkelpuien en dergelijke, van de
    categorie van produkten nr. 109 (codenummer 1090), van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3378/82 van de Raad
  type: main
