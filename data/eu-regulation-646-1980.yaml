    powder exported pursuant to Regulations (EEC) No 303/77 and (EEC) No 400/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 646/80 de la Commission, du 17 mars 1980, portant
    onzième modification du règlement (CEE) n° 2044/75 et modifiant le règlement
    (CEE) n° 210/69, en ce qui concerne les certificats d' exportation pour le beurre,
    le "butter oil" et le lait écrémé en poudre, exportés en vertu des règlements
    (CEE) n° 303/77 et (CEE) n° 400/80
  type: main
- language: de
