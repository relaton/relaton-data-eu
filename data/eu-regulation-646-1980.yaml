    Nr. 210/69 hinsichtlich der Ausfuhrlizenzen für Butter, Butteroil und Magermilchpulver,
    die gemäß den Verordnungen (EWG) Nr. 303/77 und (EWG) Nr. 400/80 ausgeführt
    werden
  type: main
