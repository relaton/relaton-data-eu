- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2982/82 of 9 November 1982 amending Regulation
    (EEC) No 2456/82 laying down, for the 1982/83 wine-growing year, provisions relating
    to the distillation referred to in Article 40 of Regulation (EEC) No 337/79 and
    Regulation (EEC) No 2457/82, laying down, for the 1982/83 wine-growing year, provisions
    concerning the distillation of the by-products of wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2982/82 de la Commission, du 9 novembre 1982, modifiant
    le règlement (CEE) n° 2456/82 établissant les dispositions relatives à la
    distillation visée à l' article 40 du règlement (CEE) n° 337/79 pour la campagne
    viticole 1982/1983 et le règlement (CEE) n° 2457/82 établissant les dispositions
    relatives à la distillation des sous-produits de la vinification pour la campagne
    1982/1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2982/82 der Kommission vom 9. November 1982 zur Änderung
    der Verordnung (EWG) Nr. 2456/82 zur Regelung der in Artikel 40 der Verordnung
    (EWG) Nr. 337/79 genannten Destillation für das Weinwirtschaftsjahr 1982/83 und
    der Verordnung (EWG) Nr. 2457/82 zur Regelung der Destillation der Nebenerzeugnisse
    der Weinbereitung für das Weinwirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2982/82 af 9. november 1982 om ændring
