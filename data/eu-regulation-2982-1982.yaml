    i artikel 40 i forordning (EØF) nr. 337/79 for vinproduktionsåret 1982/83 og
    af forordning (EØF) nr. 2457/82 om bestemmelser for destillation af biprodukter
    fra vinfremstilling for vinproduktionsåret 1982/83
  type: main
