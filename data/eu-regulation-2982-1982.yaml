    1982/1983 le disposizioni relative alla distillazione di cui all' articolo 40
    del regolamento (CEE) n. 337/79, e del regolamento (CEE) n. 2457/82, che stabilisce
    le disposizioni relative alla distillazione dei sottoprodotti della vinificazione
    per la campagna viticola 1982/1983
  type: main
- language: nl
