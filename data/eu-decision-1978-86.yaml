id: EUDecision197886
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '78/86/EEC: Commission Decision of 21 December 1977 authorizing Ireland
    to take measures in respect of national road transport involving exemptions from
    certain provisions of Council Regulation (EEC) No 543/69 on the harmonization
    of certain social legislation relating to road transport, as last amended by Council
    Regulation (EEC) No 2827/77 (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/86/CEE: Décision de la Commission, du 21 décembre 1977, autorisant
    l''Irlande à prendre des mesures pour les transports nationaux par route dérogeant
    à certaines dispositions du règlement (CEE) n° 543/69 relatif à l''harmonisation
    de certaines dispositions en matière sociale dans le domaine des transports par
    route, modifié en dernier lieu par le règlement (CEE) n° 2827/77 du 12 décembre
    1977 (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '78/86/EWG: Entscheidung der Kommission vom 21. Dezember 1977 zur Ermächtigung
    Irlands, im einzelstaatlichen Straßenverkehr Maßnahmen zu treffen, die von einigen
    Vorschriften der Verordnung (EWG) Nr. 543/69 über die Harmonisierung bestimmter
    Sozialvorschriften im Straßenverkehr, zuletzt geändert durch die Verordnung
    (EWG) Nr. 2827/77 vom 12. Dezember 1977, abweichen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/86/EØF: Kommissionens beslutning af 21. december 1977 om bemyndigelse
    af Irland til for så vidt angår indenlandsk transport ad landevej at træffe
    foranstaltninger som undtagelse fra visse bestemmelser i forordning (EØF) nr.
    543/69 om harmonisering af visse bestemmelser på det sociale område inden for
    landevejstransport, senest ændret ved forordning (EØF) nr. 2827/77 af 12. december
    1977 (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '78/86/CEE: Decisione della Commissione, del 21 dicembre 1977, che autorizza
    l''Irlanda ad adottare provvedimenti per i trasporti nazionali su strada in deroga
    a talune disposizioni del regolamento (CEE) n. 543/69 relativo all''armonizzazione
    di alcune disposizioni in materia sociale nel settore dei trasporti su strada,
    modificato da ultimo dal regolamento (CEE) n. 2827/77, del 12 dicembre 1977 (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '78/86/EEG: Beschikking van de Commissie van 21 december 1977 waarbij Ierland
    wordt gemachtigd om met betrekking tot het nationale wegvervoer maatregelen te
    nemen die afwijken van bepaalde voorschriften van Verordening (EEG) nr. 543/69
    tot harmonisatie van bepaalde voorschriften van sociale aard voor het wegvervoer,
    laatstelijk gewijzigd bij Verordening (EEG) nr. 2827/77 van 12 december 1977 (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
