    private Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und
    konzentriertem rektifiziertem Traubenmost für das Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3636/91 af 13. december 1991 om adgang
