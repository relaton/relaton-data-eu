title:
- language: fr
  script: Latn
  content: Décision du Conseil du 20 mars 1970, portant conclusion d'un accord, sous
    forme d'échange de lettres, entre la Communauté économique européenne et le
    comité international de la Croix-Rouge relatif à la fourniture de 600 tonnes
    de bouillie et 3.000 tonnes de potage aux victimes du conflit au Nigeria
  type: main
- language: de
  script: Latn
  content: '70/259/EWG: Beschluß des Rates vom 20. März 1970 über den Abschluß
    eines Abkommens - in Form eines Briefwechsels - zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Internationalen Komitee vom Roten Kreuz über die Lieferung von 600 Tonnen
    Brei und 3 000 Tonnen Suppe für die Opfer des Konflikts in Nigeria'
  type: main
- language: it
  script: Latn
  content: '70/259/CEE: Decisione del Consiglio, del 20 marzo 1970, recante conclusione
    di un Accordo, sotto forma di scambio di lettere, tra la Comunità economica europea
    ed il Comitato internazionale della Croce Rossa relativo alla fornitura di 600
    tonnellate di pappa e 3.000 tonnellate di minestra alle vittime del conflitto
    in Nigeria'
  type: main
- language: nl
  script: Latn
  content: '70/259/EEG: Besluit van de Raad van 20 maart 1970 houdende sluiting van
    een Overeenkomst - in de vorm van een briefwisseling - tussen de Europese Economische
    Gemeenschap en het Internationale Comité van het Rode Kruis voor de levering
    van 600 ton pap en 3.000 ton soep ten behoeve van de slachtoffers van het conflict
    in Nigeria'
  type: main
