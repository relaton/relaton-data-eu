title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1488/74 of the Council of 13 June 1974 on the temporary
    partial suspension of the autonomous Common Customs Tariff duty on sweet oranges,
    fresh, falling within subheading ex 08.02 A I a) and amending Regulation (EEC)
    No 655/74
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1488/74 du Conseil, du 13 juin 1974, portant suspension
    temporaire et partielle du droit autonome du tarif douanier commun pour les oranges
    douces, fraîches, de la sous-position EX 8.02 A I a), et modifiant le règlement
    (CEE) n° 655/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1488/74 des Rates vom 13. Juni 1974 zur zeitweiligen,
    teilweisen Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für
    frische Süßorangen der Tarifstelle ex 08.02 A I a) und zur Änderung der Verordnung
    (EWG) Nr. 655/74
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1488/74 af 13. juni 1974 om en midlertidig
    og delvis suspension af den autonome toldsats i den fælles toldtarif for friske
    appelsiner henhørende under pos. ex 08.02 A I a) og om ændring af forordning
    (EØF) nr. 655/74
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1488/74 del Consiglio, del 13 giugno 1974, che reca
    sospensione temporanea e parziale del dazio autonomo della tariffa doganale comune
    per le arance dolci, fresche della sottovoce ex 08.02 A I a) e modifica il regolamento
    (CEE) n. 655/74
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1488/74 van de Raad van 13 juni 1974 houdende tijdelijke
    en gedeeltelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    voor andere sinaasappelen dan pomeransen (bittere oranje appelen) vers, van onderverdeling
    ex 08.02 A I a) en tot wijziging van Verordening (EEG) nr. 655/74
  type: main
