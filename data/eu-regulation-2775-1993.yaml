title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2775/93 of 8 October 1993 fixing, for the
    1992/93 marketing year, the amount to be paid by the sugar manufacturers to the
    beet sellers in respect of the difference between the maximum amount of the B
    levy and the amount of that levy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2775/93 de la Commission du 8 octobre 1993 fixant,
    pour la campagne de commercialisation 1992/1993, le montant à payer par les fabricants
    de sucre aux vendeurs de betteraves en raison de la différence entre le montant
    maximal de la cotisation B et le montant de cette cotisation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2775/93 DER KOMMISSION vom 8. Oktober 1993 zur Festlegung
    für das Wirtschaftsjahr 1992/93 des Betrages, den die Zuckerhersteller den Rübenverkäufern
    als Unterschied zwischen dem Höchstbetrag der B-Abgabe und dem Betrag dieser
    Abgabe zu zahlen haben
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2775/93 af 8. oktober 1993 om fastsættelse
    for produktionsåret 1992/93 af det beløb, som sukkerfabrikanterne skal betale
    sælgere af sukkerroer som følge af forskellen mellem det maksimale B-afgiftsbeløb
    og det faktiske afgiftsbeløb
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2775/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 8ης Οκτωβρίου 1993 για τον καθορισμό, για
    την περίοδο εμπορίας 1992/93, του ποσού που θα
    πληρωθεί από τους βιομηχάνους ζάχαρης στους
    πωλητές ζαχαροτεύτλων λόγω της διαφοράς μεταξύ
    του μέγιστου ποσού της εισφοράς Β και του ποσού
    της εισφοράς αυτής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2775/93 DELLA COMMISSIONE dell' 8 ottobre 1993 che
    fissa, per la campagna di commercializzazione 1992/1993, l' ammontare che i fabbricanti
    di zucchero devono versare ai venditori di barbabietole in ragione della differenza
    tra l' importo massimo del contributo B e l' importo del contributo stesso
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2775/93 VAN DE COMMISSIE van 8 oktober 1993 tot vaststelling,
    voor het verkoopseizoen 1992/1993, van het door de suikerfabrikanten aan de suikerbietenverkopers
    uit te keren bedrag wegens het verschil tussen het maximumbedrag van de B-heffing
    en het bedrag van die heffing
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2775/93 DA COMISSÃO de 8 de Outubro de 1993 que
    fixa, para a campanha de comercialização de 1992/1993, o montante a pagar pelos
    fabricantes de açúcar aos vendedores de beterrabas devido à diferença entre
    o montante máximo da quotização B e o montante dessa quotização
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2775/93 DE LA COMISIÓN de 8 de octubre de 1993 por
