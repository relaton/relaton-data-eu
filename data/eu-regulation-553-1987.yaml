title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 553/87 of 25 February 1987 determining the
    extent to which applications lodged in February 1987 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 553/87 de la Commission, du 25 février 1987, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois de février 1987 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 553/87 der Kommission vom 25. Februar 1987 über den
    Umfang, in dem den im Monat Februar 1987 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 553/87 af 25. februar 1987 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i februar måned 1987 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 553/87 της Επιτροπής
    της 25ης Φεβρουαρίου 1987 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Φεβρουάριο του 1987 για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 553/87 della Commissione, del 25 febbraio 1987, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di febbraio 1987 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 553/87 van de Commissie van 25 februari 1987 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand februari
    1987 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 553/87 da Comissão, de 25 de Fevereiro de 1987,
    que determina em que medida pode ser dado seguimento aos pedidos de concessão
    de certificados de importação entregues no mês de Fevereiro de 1987 para as
    carnes de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 553/87 de la Comisión, de 25 de febrero de 1987, que
    determina en qué medida podrá darse curso a las solicitudes de expécición
    de certificados de importación presentadas en el mes de febrero de 1987 para
    las carnes de vacuno congeladas destinadas a la transformación
  type: main
