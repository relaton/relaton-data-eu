  content: Council Regulation (EC) No 2622/94 of 24 October 1994 amending Council
    Regulation (EEC) No 3918/92 opening and providing for the administration of Community
    tariff quotas and ceilings for certain agricultural and industrial products and
    establishing a reduced variable component for certain processed agricultural products
    originating in Hungary, Poland and the territory of the former Czech and Slovak
    Federal Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2622/94 du Conseil du 24 octobre 1994 modifiant le
