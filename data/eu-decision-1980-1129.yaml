    løbet af året 1979 til støtte til social og erhvervsmæssig vejledning og faguddannelse
    af personer, som arbejder i landbruget (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1129/CEE: Decisione della Commissione, del 20 novembre 1980, relativa
