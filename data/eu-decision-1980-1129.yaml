title:
- language: en
  script: Latn
  content: '80/1129/EEC: Commission Decision of 20 November 1980 on the reimbursement
    by the Guidance Section of the EAGGF to Ireland of expenditure incurred during
    1979 on aid relating to the provision of socio-economic guidance for and the acquisition
    of occupational skills by persons engaged in agriculture (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1129/CEE: Décision de la Commission, du 20 novembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à l''Irlande des dépenses effectuées pendant l''année
    1979 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1129/EWG: Entscheidung der Kommission vom 20. November 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben für die sozio-
    ökonomische Information und die berufliche Qualifikation der in der Landwirtschaft
    tätigen Personen durch den EAGFL, Abteilung Ausrichtung, an Irland (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1129/EØF: Kommissionens beslutning af 20. november 1980 om refusion
