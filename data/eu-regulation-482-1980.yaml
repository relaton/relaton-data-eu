id: EURegulation4821980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 482/80 of 27 February 1980 re-establishing
    the levying of customs duties on woven tarpaulins, sails, awnings and sunblinds,
    products of category 109 (code 1090), originating in South Korea, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2894/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 482/80 de la Commission, du 27 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations et stores d' extérieur, tissés, de la catégorie 109
    (code 1090), originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 482/80 der Kommission vom 27. Februar 1980 über die
    Wiedereinführung des Zollsatzes für Planen, Segel und Markisen, aus Geweben,
    der Warenkategorie Nr. 109 (Kennziffer 1090), mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 482/80 af 27. februar 1980 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl og markiser, vævede, under
    varekategori 109 (kode 1090), som har oprindelse i Sydkorea og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 482/80 della Commissione, del 27 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai copertoni, vele per
    imbarcazioni e tende per l' esterno, tessuti, della categoria di prodotti n. 109
    (codice 1090), originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 482/80 van de Commissie van 27 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    dekkleden, scheepszeilen, zonneschermen voor winkelpuien en dergelijke, van de
    categorie van produkten nr. 109 (codenummer 1090), van oorsprong uit Zuid-Korea
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
