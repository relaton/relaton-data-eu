title:
- language: en
  script: Latn
  content: '89/159/EEC: Commission Decision of 21 February 1989 recognizing that Denmark
    applies to heat-treated milk intended for direct home consumption the microbiological
    standards laid down for step 2 in Directive 85/397/EEC'
  type: main
- language: fr
  script: Latn
  content: '89/159/CEE: Décision de la Commission, du 21 février 1989, reconnaissant
    que le Danemark applique, pour le lait traité thermiquement destiné à sa consommation
    nationale directe, les normes microbiologiques prescrites pour la deuxième étape
    par la directive 85/397/CEE'
  type: main
- language: de
  script: Latn
  content: '89/159/EWG: ENTSCHEIDUNG DER KOMMISSION VOM 21. FEBRUAR 1989 MIT DER ANERKANNT
    WIRD, DASS DAENEMARK DIE IN DER RICHTLINIE 85/397/EWG FUER DIE STUFE 2 VORGESCHRIEBENEN
    MIKROBIOLOGISCHEN NORMEN, AUF DIE FUER SEINEN UNMITTELBAREN INLAENDISCHEN VERBRAUCH
    BESTIMMTE WAERMEBEHANDELTE MILCH ANWENDET'
  type: main
- language: da
  script: Latn
  content: '89/159/EOEF: KOMMISSIONENS BESLUTNING AF 21. FEBRUAR 1989 OM GODKENDELSE
