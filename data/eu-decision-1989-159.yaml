    γάλα για άμεση εθνική κατανάλωση τις μικροβιολογικές
    προδιαγραφές που προβλέπονται για τη δεύτερη
    φάση στην οδηγία 85/397/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '89/159/ETY: Komission päätös, tehty 21 päivänä helmikuuta 1989,
