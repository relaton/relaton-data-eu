title:
- language: en
  script: Latn
  content: Commission Directive 95/30/EC of 30 June 1995 adapting to technical progress
    Council Directive 90/679/EEC on the protection of workers from risks related to
    exposure to biological agents at work (seventh individual Directive within the
    meaning of Article 16 (1) of Directive 89/391/EEC)
  type: main
- language: fr
  script: Latn
  content: Directive 95/30/CE de la Commission, du 30 juin 1995, portant adaptation
    au progrès technique de la directive 90/679/CEE du Conseil concernant la protection
    des travailleurs contre les risques liés à l'exposition à des agents biologiques
    au travail (septième directive particulière au sens de l'article 16 paragraphe
    1 de la directive 89/391/CEE)
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/30/EG der Kommission vom 30. Juni 1995 zur Anpassung der
    Richtlinie 90/679/EWG des Rates über den Schutz der Arbeitnehmer gegen Gefährdung
    durch biologische Arbeitsstoffe bei der Arbeit an den technischen Fortschritt
    (Siebte Einzelrichtlinie im Sinne von Artikel 16 Absatz 1 der Richtlinie 89/391/EWG)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 95/30/EF af 30. juni 1995 om tilpasning til den
    tekniske udvikling af Rådets direktiv 90/679/EØF om beskyttelse af arbejdstagerne
    mod farerne ved at være udsat for biologiske agenser under arbejdet (syvende
    særdirektiv i henhold til artikel 16, stk. 1, i direktiv 89/391/EØF)
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/30/ΕΚ της Επιτροπής της 30ής Ιουνίου
    1995 για την προσαρμογή στην τεχνική πρόοδο της
    οδηγίας 90/679/ΕΟΚ του Συμβουλίου για την προστασία
    των εργαζομένων από κινδύνους που διατρέχουν
    λόγω της έκθεσής τους σε βιολογικούς παράγοντες
    κατά την εργασία (έβδομη ειδική οδηγία κατά
    την έννοια του άρθρου 16 παράγραφος 1 της οδηγίας
    89/391/ΕΟΚ)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 95/30/EY, annettu 30 päivänä kesäkuuta 1995, työntekijöiden
    suojelemiseksi vaaroilta, jotka liittyvät biologisille tekijöille altistumiseen
    työssä annetun neuvoston direktiivin 90/679/ETY (seitsemäs direktiivin 89/391/ETY
    16 artiklan 1 kohdassa tarkoitettu erityisdirektiivi) mukauttamisesta tekniseen
    kehitykseen
  type: main
- language: it
  script: Latn
  content: Direttiva 95/30/CE della Commissione, del 30 giugno 1995, recante adeguamento
    al progresso tecnico della direttiva 90/679/CEE del Consiglio relativa alla protezione
    dei lavoratori contro i rischi derivanti da un'esposizione ad agenti biologici
    durante il lavoro (settima direttiva particolare ai sensi dell'articolo 16, paragrafo
    1 della direttiva 89/391/CEE)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/30/EG van de Commissie van 30 juni 1995 tot aanpassing aan
    de vooruitgang van de techniek van Richtlijn 90/679/EEG van de Raad betreffende
    de bescherming van de werknemers tegen de risico's van blootstelling aan biologische
    agentia op het werk (zevende bijzondere Richtlijn in de zin van artikel 16, lid
    1, van Richtlijn 89/391/EEG)
  type: main
- language: pt
  script: Latn
  content: Directiva 95/30/CE da Comissão, de 30 de Junho de 1995, que adapta ao
    progresso técnico a Directiva 90/679/CEE do Conselho, relativa à protecção
    dos trabalhadores contra os riscos ligados à exposição a agentes biológicos
    durante o trabalho (sétima Directiva especial na acepção do nº 1 do artigo
    16º da Directiva 89/391/CEE)
  type: main
- language: es
  script: Latn
  content: Directiva 95/30/CE de la Comisión, de 30 de junio de 1995, por la que
    se adapta al progreso técnico la Directiva 90/679/CEE del Consejo, sobre la protección
    de los trabajadores contra los riesgos relacionados con la exposición a agentes
    biológicos durante el trabajo (séptima Directiva específica con arreglo al
    apartado 1 del artículo 16 de la Directiva 89/391/CEE)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 95/30/EG av den 30 juni 1995 om anpassning, som
