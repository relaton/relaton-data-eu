title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3051/79 of 21 December 1979 fixing, for
    the 1980 fishing year, withdrawal prices for the fishery products listed in Annex
    I (A) and (C) to Regulation (EEC) No 100/76 and for certain products landed in
    areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3051/79 de la Commission, du 21 décembre 1979, fixant
    les prix de retrait, pour l' année 1980, pour les produits de la pêche énumérés
    à l' annexe I sous A et C du règlement (CEE) n° 100/76 ainsi que pour certains
    produits débarqués dans des zones très éloignées des principaux centres de
    consommation de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3051/79 der Kommission vom 21. Dezember 1979 zur Festsetzung
    der Rücknahmepreise für das Jahr 1980 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 100/76 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3051/79 af 21. december 1979 om fastsættelse
    af tilbagetagelsespriserne for året 1980 for de fiskerivarer, som er anført
    i afsnit A og C i bilag I til forordning (EØF) nr. 100/76, samt for visse af
    de i nævnte forordning omhandlede varer fra landingsområder, der ligger meget
    fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3051/79 della Commissione, del 21 dicembre 1979, che
    fissa, per i prodotti della pesca di cui all' allegato I, lettere A e C, nonché
    per taluni prodotti del regolamento (CEE) n. 100/76, sbarcati in zone molto lontane
    dai principali centri di consumo della Comunità, i prezzi di ritiro validi per
    l' anno 1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3051/79 van de Commissie van 21 december 1979 tot
    vaststelling van de in 1980 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 100/76 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
