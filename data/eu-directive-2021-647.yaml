---
id: EUDirective2021647
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2021/647 of 15 January 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of certain lead and hexavalent chromium compounds in
    electric and electronic initiators of explosives for civil (professional) use
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2021/647 de la Commission du 15 janvier 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative à l’utilisation de certains composés du plomb
    et du chrome hexavalent dans les initiateurs pyrotechniques électriques et électroniques
    à usage civil (professionnel)
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2021/647 der Kommission vom 15. Januar 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von bestimmten Blei-
    und sechswertigen Chromverbindungen in elektrischen und elektronischen Zündmitteln
    für Sprengstoffe für den zivilen (gewerblichen) Gebrauch
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2021/647 на Комисията
    от 15 януари 2021 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение III към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употребата на някои съединения
    на оловото и шествалентния хром в електрически
    и електронни възпламенители на взривни вещества
    за гражданска (професионална) употреба
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2021/647 ze dne 15. ledna
    2021, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití některých sloučenin olova a šestimocného chromu
    v elektrických a elektronických iniciátorech výbušnin pro civilní (profesionální)
    použití
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2021/647 af 15. januar 2021 om ændring,
    med henblik på tilpasning til den videnskabelige og tekniske udvikling, af bilag
    III til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    en undtagelse for anvendelsen af visse bly- og hexavalente chromforbindelser i
    elektriske og elektroniske tændere til sprængstoffer til civile (professionelle)
    formål
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (EE) 2021/647 της
    Επιτροπής της 15ης Ιανουαρίου 2021 για την τροποποίηση,
    προς τον σκοπό της προσαρμογής στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος III της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση ορισμένων ενώσεων μολύβδου και εξασθενούς
    χρωμίου σε ηλεκτρικούς και ηλεκτρονικούς πυροδοτητές
    εκρηκτικών για εμπορική (επαγγελματική) χρήση
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2021/647, 15. jaanuar 2021, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL III lisa seoses erandiga, mis hõlmab teatavate plii ja
    kuuevalentse kroomi ühendite kasutamist tsiviilotstarbeliste (kutsealaselt kasutatavate)
    lõhkeainete elektrilistes ja elektroonilistes sütikutes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2021/647, annettu 15 päivänä tammikuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen III muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    tiettyjen lyijyn ja kuudenarvoisen kromin yhdisteiden käyttöä siviilikäyttöön
    (ammattikäyttöön) tarkoitettujen räjähteiden sähköisissä ja elektronisissa
    räjäytysnalleissa koskevasta poikkeuksesta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2021/647 ón gCoimisiún an 15 Eanáir 2021 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn eolaíoch agus teicniúil,
    Iarscríbhinn III a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine le haghaidh comhdhúile áirithe
    luaidhe agus cróimiam heicsifhiúsaigh a úsáid i dtionscnóirí leictreacha
    agus leictreonacha i bpléascáin a bhfuiltear lena n-úsáid chun críche sibhialta
    (gairmiúla)
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/647 оd 15. siječnja 2021. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga III. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za određene spojeve olova i
    šesterovalentnog kroma u električnim i elektroničkim sklopovima za iniciranje
    eksploziva za civilnu (profesionalnu) uporabu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/647 felhatalmazáson alapuló irányelve (2021.
    január 15.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a tudományos és a műszaki fejlődéshez történő hozzáigazítása céljából,
    egyes ólom- és hat vegyértékű krómvegyületeknek a (szakmai célú) polgári
    felhasználású robbanóanyagok elektromos és elektronikus gyújtószerkezeteiben
    való használatára megadott mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2021/647 della Commissione del 15 gennaio 2021
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso di determinati composti di piombo e cromo esavalente
    negli iniziatori elettrici e elettronici di esplosivi per uso civile (professionale)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2021/647 (2021. gada 15. janvāris),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu dažu svina
    un sešvērtīgā hroma savienojumu izmantošanai civilām (profesionālām) vajadzībām
    paredzētu sprāgstvielu elektriskajos un elektroniskajos iniciatoros
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2021/647 2021 m. sausio 15 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties, kuria elektriniuose
    ir elektroniniuose civilinės paskirties (profesionalų) sprogmenų degtuvuose
    leidžiama naudoti tam tikrus švino ir šešiavalenčio chromo junginius, iš
    dalies keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES III priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2021/647 tal-15 ta’ Jannar 2021
    li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu ta’ ċerti komposti taċ-ċomb u tal-kromu eżavalenti
    fl-inizjaturi elettriċi u elettroniċi tal-isplussivi għall-użu ċivili (professjonali)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2021/647 van de Commissie van 15 januari 2021
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van bepaalde loodverbindingen
    en verbindingen van zeswaardig chroom in elektrische en elektronische ontstekers
    van explosieven voor civiel (professioneel) gebruik
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2021/647 z dnia 15 stycznia 2021 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik III do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania określonych związków ołowiu i sześciowartościowego chromu w elektrycznych
    i elektronicznych inicjatorach materiałów wybuchowych przeznaczonych do użytku
    cywilnego (profesjonalnego)
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2021/647 da Comissão de 15 de janeiro de 2021 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção aplicável à utilização de determinados compostos de chumbo
    e de crómio hexavalente em iniciadores elétricos e eletrónicos de explosivos
    para utilização civil (profissional)
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2021/647 a Comisiei din 15 ianuarie 2021 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea anumitor compuși de plumb și de crom hexavalent la
    inițiatorii electrici și electronici ai explozivilor de uz civil (profesional)
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2021/647 z 15. januára 2021, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    pre používanie určitých zlúčenín olova a šesťmocného chrómu v elektrických
    a elektronických iniciátoroch výbušnín na civilné (profesionálne) použitie
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2021/647 z dne 15. januarja 2021 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo nekaterih svinčevih spojin in spojin šestvalentnega kroma v električnih
    in elektronskih vžigalnikih eksplozivov za civilno (poklicno) uporabo, zaradi
    prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2021/647 de la Comisión de 15 de enero de 2021
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al uso de determinados compuestos de
    plomo y cromo hexavalente utilizados en iniciadores eléctricos y electrónicos
    de explosivos destinados al uso civil (profesional)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2021/647 av den 15 januari 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av vissa bly- och sexvärda kromföreningar i elektriska
    och elektroniska initiatorer för sprängämnen för civilt (yrkesmässigt) bruk
  type: main
