title:
- language: en
  script: Latn
  content: '98/713/EC: Commission Decision of 26 November 1998 amending the information
    contained in the list in the Annex to Commission Regulation (EEC) No 55/87 establishing
    the list of vessels exceeding eight metres length overall permitted to use beam
    trawls within certain coastal areas of the Community (notified under document
    number C(1998) 3618)'
  type: main
- language: fr
  script: Latn
  content: '98/713/CE: Décision de la Commission du 26 novembre 1998 modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CEE) nº 55/87
    établissant la liste des bateaux dont la longueur hors tout dépasse huit mètres
    autorisés à pêcher à l''aide de chaluts à perches dans certaines zones côtières
    de la Communauté [notifiée sous le numéro C(1998) 3618]'
  type: main
- language: de
  script: Latn
