title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 934/93 of 20 April 1993 laying down rates
    of compensatory interest applicable during the second half of 1993 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 934/93 de la Commission, du 20 avril 1993, fixant
    les taux d' intérêts compensatoires applicables en cas de naissance d' une dette
    douanière relative aux produits compensateurs ou aux marchandises en l' état
    (régime du perfectionnement actif) pendant le second semestre de 1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 934/93 der Kommission vom 20. April 1993 mit Sätzen
    von Ausgleichszinsen, die im zweiten Halbjahr 1993 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr)
    anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 934/93 af 20. april 1993 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukterne eller uforædlede varer (aktiv forædling) i andet
    halvår af 1993
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 934/93 της Επιτροπής
    της 20ης Απριλίου 1993 για τον καθορισμό αντισταθμιστικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή τα εμπορεύματα στην ίδια κατάσταση
    κατά την διάρκεια του δεύτερου εξαμήνου 1993
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 934/93 della Commissione, del 20 aprile 1993, che
    determina i tassi di interesse compensatori applicabili ove sorga un' obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo) nel secondo semestre 1993
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 934/93 van de Commissie van 20 april 1993 tot vaststelling
    van de jaarlijkse intrestpercentages van toepassing in geval van het ontstaan
    van een douaneschuld voor veredelingsprodukten of onveredelde goederen (regeling
    actieve veredeling) tijdens het tweede semester 1993
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 934/93 da Comissão, de 20 de Abril de 1993, que
    fixa as taxas de juros de compensação aplicáveis aos casos de constituição
    de uma dívida aduaneira relativa a produtos compensadores ou a mercadorias no
    seu estado inalterado (regime do aperfeiçoamento activo), durante o segundo semestre
    de 1993
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 934/93 de la Comisión, de 20 de abril de 1993, por
    el que se fijan los tipos de interés compensatorio aplicables en caso de nacimiento
    de una deuda aduanera relativa a los productos compensadores o a las mercancías
    sin transformar (régimen de perfeccionamiento activo) durante el segundo semestre
    de 1993
