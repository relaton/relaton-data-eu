title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1234/84 of 3 May 1984 re-establishing the
    levying of customs duties on other ball bearings with greatest external diameter
    not more than 30 mm, falling within heading No ex 84.62 and originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1234/84 de la Commission du 3 mai 1984 portant rétablissement
    de la perception des droits de douane applicables aux autres roulements à billes
    d' un diamètre non supérieur à 30 millimètres de la position ex 84.62 du tarif
    douanier commun, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1234/84 der Kommission vom 3. Mai 1984 zur Wiedereinführung
    der Erhebung der Zölle für andere Kugellager mit einem größten äußeren Durchmesser
    von 30 mm oder weniger der Tarifnummer ex 84.62 mit Ursprung in Singapur, dem
    die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1234/84 af 3. maj 1984 om genindførelse
    af opkrævning af told for andre kuglelejer med største udvendige diameter på
    30 mm og derunder, henhørende under pos. ex 84.62 og med oprindelse i Singapore,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1234/84 της Επιτροπής
    της 3ης Μαΐου 1984 περί αποκαταστάσεως της εφαρμογής
    των δασμών για τριβείς ένσφαιρους των οποίων
    η μεγαλύτερη εξωτερική διάμετρος δεν υπερβαίνει
    τα 30 mm, της κλάσεως ex 84.62 του Κοινού Δασμολογίου,
    καταγωγής Σιγκαπούρης, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1234/84 della Commissione del 3 maggio 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli altri cuscinetti a sfere il
    cui più grande diametro non ecceda 30 mm, della voce ex 84.62 della tariffa doganale
    comune, originari di Singapore beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1234/84 van de Commissie van 3 mei 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere kogellagers
    met een grootste uitwendige diameter van 30 mm of minder, van tariefpost ex 84.62,
    van oorsprong uit Singapore, waarvoor de in Verordening (EEG) nr. 3569/83 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
