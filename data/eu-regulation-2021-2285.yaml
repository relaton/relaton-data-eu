title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2285 of 14 December 2021 amending
    Implementing Regulation (EU) 2019/2072 as regards the listing of pests, prohibitions
    and requirements for the introduction into, and movement within, the Union of
    plants, plant products and other objects, and repealing Decisions 98/109/EC and
    2002/757/EC and Implementing Regulations (EU) 2020/885 and (EU) 2020/1292
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2285 de la Commission du 14 décembre
    2021 modifiant le règlement d’exécution (UE) 2019/2072 en ce qui concerne
    les listes d’organismes nuisibles ainsi que les interdictions et les exigences
    relatives à l’introduction et à la circulation dans l’Union de végétaux,
    produits végétaux et autres objets, et abrogeant les décisions 98/109/CE et
    2002/757/CE et les règlements d’exécution (UE) 2020/885 et (UE) 2020/1292
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2285 der Kommission vom 14. Dezember
    2021 zur Änderung der Durchführungsverordnung (EU) 2019/2072 hinsichtlich der
    Auflistung von Schädlingen, Verboten und Anforderungen für die Einfuhr von Pflanzen,
    Pflanzenerzeugnissen und anderen Gegenständen in die Union und deren Verbringung
    innerhalb der Union sowie zur Aufhebung der Entscheidungen 98/109/EG und 2002/757/EG
    und der Durchführungsverordnungen (EU) 2020/885 und (EU) 2020/1292
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/2285 на Комисията
    от 14 декември 2021 година за изменение на Регламент
    за изпълнение (ЕС) 2019/2072 по отношение на списъка
    на вредителите, забраните и изискванията за
    въвеждането и движението на територията на
    Съюза на растения, растителни продукти и други
    обекти и за отмяна на решения 98/109/ЕО и 2002/757/ЕО
    и на Регламенти за изпълнение (ЕС) 2020/885 и (ЕС)
    2020/1292
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/2285 ze dne 14. prosince 2021,
    kterým se mění prováděcí nařízení (EU) 2019/2072, pokud jde o seznam
    škodlivých organismů, zákazů a požadavků ohledně dovozu rostlin, rostlinných
    produktů a jiných předmětů do Unie a jejich přemísťování v rámci Unie,
    a kterým se zrušují rozhodnutí 98/109/ES a 2002/757/ES a prováděcí nařízení
    (EU) 2020/885 a (EU) 2020/1292
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/2285 af 14. december
    2021 om ændring af gennemførelsesforordning (EU) 2019/2072 for så vidt angår
    listeopførelse af skadegørere, forbud og krav vedrørende indførsel til og
    flytning inden for Unionen af planter, planteprodukter og andre objekter og om
    ophævelse af beslutning 98/109/EF og 2002/757/EF samt gennemførelsesforordning
    (EU) 2020/885 og (EU) 2020/1292
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/2285 της Επιτροπής
    της 14ης Δεκεμβρίου 2021 για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) 2019/2072 όσον αφορά
    την καταχώριση των επιβλαβών οργανισμών, τις
    απαγορεύσεις και τις απαιτήσεις για την είσοδο
    και τη διακίνηση φυτών, φυτικών προϊόντων και
    άλλων αντικειμένων στην Ένωση, και για την
    κατάργηση των αποφάσεων 98/109/ΕΚ και 2002/757/ΕΚ
    και των εκτελεστικών κανονισμών (ΕΕ) 2020/885 και
    (ΕΕ) 2020/1292
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/2285, 14. detsember 2021, millega
    muudetakse rakendusmäärust (EL) 2019/2072 taimekahjustajate loetelude ning taimede,
    taimsete saaduste ja muude objektide liitu sissetoomise ja seal vedamise keeldude
    ja nõuete osas ning tunnistatakse kehtetuks otsused 98/109/EÜ ja 2002/757/EÜ
    ning rakendusmäärused (EL) 2020/885 ja (EL) 2020/1292
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/2285, annettu 14 päivänä
    joulukuuta 2021, täytäntöönpanoasetuksen (EU) 2019/2072 muuttamisesta siltä
    osin kuin on kyse kasvintuhoojien luetteloinnista, kielloista ja vaatimuksista
    kasvien, kasvituotteiden ja muiden tavaroiden unioniin tuomisen ja unionissa siirtämisen
    yhteydessä sekä päätösten 98/109/EY ja 2002/757/EY ja täytäntöönpanoasetusten
    (EU) 2020/885 ja (EU) 2020/1292 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/2285 ón gCoimisiún an 14 Nollaig
    2021 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2019/2072 a mhéid a bhaineann
    le liostú lotnaidí, toirmeasc agus ceanglas chun plandaí, táirgí plandaí
    agus réada eile a thabhairt isteach san Aontas agus a aistriú laistigh de agus
    lena n-aisghairtear Cinntí 98/109/CE agus 2002/757/CE agus Rialacháin Chur Chun
    Feidhme (AE) 2020/885 agus (AE) 2020/1292
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/2285 оd 14. prosinca 2021. o izmjeni
    Provedbene uredbe (EU) 2019/2072 u pogledu uvrštavanja na popis štetnih organizama,
    zabrana i zahtjeva za unos bilja, biljnih proizvoda i drugih predmeta u Uniju
    i njihovo premještanje unutar Unije te o stavljanju izvan snage odluka 98/109/EZ
    i 2002/757/EZ i provedbenih uredbi (EU) 2020/885 i (EU) 2020/1292
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2285 végrehajtási rendelete (2021. december 14.)
    az (EU) 2019/2072 végrehajtási rendeletnek a károsítók jegyzéke, a növények,
    növényi termékek és egyéb anyagok Unióba történő behozatalára és Unión
    belüli szállítására vonatkozó tilalmak és követelmények tekintetében
    történő módosításáról, valamint a 98/109/EK és a 2002/757/EK határozat
    és az (EU) 2020/885 és az (EU) 2020/1292 végrehajtási rendelet hatályon kívül
    helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/2285 della Commissione del 14 dicembre
    2021 che modifica il regolamento di esecuzione (UE) 2019/2072 per quanto concerne
    la redazione degli elenchi di organismi nocivi, i divieti e le prescrizioni per
    l’introduzione e lo spostamento nell’Unione di piante, prodotti vegetali e
    altri oggetti e che abroga le decisioni 98/109/CE e 2002/757/CE e i regolamenti
    di esecuzione (UE) 2020/885 e (UE) 2020/1292
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/2285 (2021. gada 14. decembris),
    ar ko Īstenošanas regulu (ES) 2019/2072 groza attiecībā uz kaitīgo organismu
    iekļaušanu sarakstā, aizliegumiem un prasībām, kas piemērojamas augu, augu
    produktu un citu objektu ievešanai un pārvietošanai Savienībā, un atceļ
    Lēmumus 98/109/EK un 2002/757/EK un Īstenošanas regulas (ES) 2020/885 un (ES)
    2020/1292
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/2285 2021 m. gruodžio 14
    d. kuriuo dėl kenkėjų sąrašų, taip pat dėl augalų, augalinių produktų
    ir kitų objektų įvežimo į Sąjungą ir vežimo joje draudimų bei reikalavimų
    iš dalies keičiamas Įgyvendinimo reglamentas (ES) 2019/2072 ir kuriuo panaikinami
    sprendimai 98/109/EB ir 2002/757/EB bei įgyvendinimo reglamentai (ES) 2020/885
    ir (ES) 2020/1292
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2285 tal-14
    ta’ Diċembru 2021 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2019/2072
    rigward l-elenkar ta’ pesti, ta’ projbizzjonijiet u ta’ rekwiżiti għall-introduzzjoni
    u l-moviment fl-Unjoni ta’ pjanti, ta’ prodotti mill-pjanti u ta’ oġġetti
    oħra, u li jħassar id-Deċiżjonijiet 98/109/KE u 2002/757/KE u r-Regolamenti
    ta’ Implimentazzjoni (UE) 2020/885 u (UE) 2020/1292
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/2285 van de Commissie van 14 december
    2021 tot wijziging van Uitvoeringsverordening (EU) 2019/2072 wat betreft de opneming
    in een lijst van plaagorganismen, verboden en voorschriften voor het binnenbrengen
    in en het verkeer binnen de Unie van planten, plantaardige producten en andere
    materialen, en tot intrekking van de Beschikkingen 98/109/EG en 2002/757/EG en
    de Uitvoeringsverordeningen (EU) 2020/885 en (EU) 2020/1292
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/2285 z dnia 14 grudnia 2021
    r. zmieniające rozporządzenie wykonawcze (UE) 2019/2072 w odniesieniu do wykazów
    agrofagów oraz zakazów i wymogów dotyczących wprowadzania do Unii i przemieszczania
    na jej terytorium roślin, produktów roślinnych i innych przedmiotów oraz uchylające
    decyzje 98/109/WE i 2002/757/WE oraz rozporządzenia wykonawcze (UE) 2020/885
    i (UE) 2020/1292
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/2285 da Comissão de 14 de dezembro
    de 2021 que altera o Regulamento de Execução (UE) 2019/2072 no que se refere
    à listagem de pragas, proibições e requisitos para a introdução e a circulação
    na União de vegetais, produtos vegetais e outros objetos, e que revoga as Decisões
    98/109/CE e 2002/757/CE e os Regulamentos de Execução (UE) 2020/885 e (UE) 2020/1292
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/2285 al Comisiei din 14 decembrie
    2021 de modificare a Regulamentului de punere în aplicare (UE) 2019/2072 în
    ceea ce privește stabilirea listei organismelor dăunătoare, a interdicțiilor
    și cerințelor pentru introducerea sau circulația pe teritoriul Uniunii a plantelor,
    a produselor vegetale și a altor obiecte și de abrogare a Deciziilor 98/109/CE
    și 2002/757/CE și a Regulamentelor de punere în aplicare (UE) 2020/885 și
    (UE) 2020/1292
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/2285 zo 14. decembra 2021, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2019/2072, pokiaľ ide o zoznam škodcov,
    zákazy a požiadavky na uvedenie rastlín, rastlinných produktov a iných predmetov
    do Únie a ich premiestňovanie v rámci Únie, a ktorým sa zrušujú rozhodnutia
    98/109/ES a 2002/757/ES a vykonávacie nariadenia (EÚ) 2020/885 a (EÚ) 2020/1292
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/2285 z dne 14. decembra 2021 o spremembi
    Izvedbene uredbe (EU) 2019/2072 glede določitve seznamov škodljivih organizmov,
    prepovedi in zahtev za vnos rastlin, rastlinskih proizvodov in drugih predmetov
    v Unijo ter njihovih premikov po Uniji ter o razveljavitvi odločb 98/109/ES in
    2002/757/ES ter izvedbenih uredb (EU) 2020/885 in (EU) 2020/1292
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/2285 de la Comisión de 14 de diciembre
    de 2021 por el que se modifica el Reglamento de Ejecución (UE) 2019/2072 por
    lo que respecta a la lista de plagas, prohibiciones y requisitos para la introducción
    y el traslado en la Unión de vegetales, productos vegetales y otros objetos,
    y por el que se derogan las Decisiones 98/109/CE y 2002/757/CE y los Reglamentos
    de Ejecución (UE) 2020/885 y (UE) 2020/1292
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/2285 av den 14 december
    2021 om ändring av genomförandeförordning (EU) 2019/2072 vad gäller förteckningen
    över skadegörare och förbud mot och krav för införsel till och förflyttning
    inom unionen av växter, växtprodukter och andra föremål, samt om upphävande
    av besluten 98/109/EG och 2002/757/EG och genomförandeförordningarna (EU) 2020/885
    och (EU) 2020/1292
