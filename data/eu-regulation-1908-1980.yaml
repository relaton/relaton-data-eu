title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1908/80 of 15 July 1980 re-establishing
    the levying of customs duties on brushes, falling within subheading 96.01 B ex
    III and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1908/80 de la Commission, du 15 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux pinceaux
    de la sous-position 96.01 B ex III du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1908/80 der Kommission vom 15. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Pinsel der Tarifstelle 96.01 B ex III, mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1908/80 af 15. juli 1980 om genindførelse
    af opkrævning af toldafgifter for børster under position 96.01 B ex III, som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1908/80 della Commissione, del 15 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai pennelli, della sottovoce
    96.01 B ex III della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1908/80 van de Commissie van 15 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op penselen,
    van post 96.01 B ex III, van oorsprong uit China, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
