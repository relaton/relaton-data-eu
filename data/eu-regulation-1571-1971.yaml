title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1571/71 of the Commission of 22 July 1971 amending
    Regulation (EEC) No 2588/69 of 22 December 1969 establishing the list of airline
    companies exempt from providing the guarantee required within the framework of
    the Community transit system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1571/71 de la Commission, du 22 juillet 1971, portant
    modification du règlement (CEE) n° 2588/69 de la Commission, du 22 décembre
    1969, portant établissement de la liste des compagnies aériennes auxquelles
    s' applique la dispense de la garantie dans le cadre du régime du transit communautaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1571/71 der Kommission vom 22. Juli 1971 zur Änderung
    der Verordnung (EWG) Nr. 2588/69 der Kommission vom 22. Dezember 1969 über die
    Aufstellung der Liste der Luftschiffahrtgesellschaften, die im Rahmen des gemeinschaftlichen
    Versandverfahrens von der Sicherheitsleistung befreit sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1571/71 af 22. juli 1971 om ændring
    af Kommissionens forordning (EØF) nr. 2588/69 af 22. december 1969 om udarbejdelse
    af listen over de luftfartsselskaber, der er fritaget for at stille sikkerhed
    inden for rammerne af ordningen for fællesskabsforsendelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1571/71 della Commissione, del 22 luglio 1971, che
    modifica il regolamento (CEE) n. 2588/69 della Commissione, del 22 dicembre 1969,
    che stabilisce l' elenco delle compagnie aeree alle quali si applica l' esonero
    dalla garanzia nel quadro del regime del transito comunitario
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1571/71 van de Commissie van 22 juli 1971 houdende
    wijziging van Verordening (EEG) nr. 2588/69 van de Commissie van 22 december 1969
    waarbij de lijst wordt opgesteld van de luchtvaartmaatschappijen waarop de vrijstelling
    van zekerheid in het kader van de regeling voor communautair douanevervoer van
    toepassing is
  type: main
