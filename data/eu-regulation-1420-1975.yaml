title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1420/75 of the Council of 26 May 1975 extending the
    scope of Regulation (EEC) No 1067/74 on the common organization of the market
    in dehydrated fodder to cover certain products processed from potatoes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1420/75 du Conseil, du 26 mai 1975, étendant à certains
    produits transformés à base de pommes de terre le champ d' application du règlement
    (CEE) n° 1067/74 portant organisation commune des marchés dans le secteur des
    fourrages déshydratés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1420/75 des Rates vom 26. Mai 1975 zur Erweiterung
    des Geltungsbereichs der Verordnung (EWG) Nr. 1067/74 über die gemeinsame Marktorganisation
    für künstlich getrocknetes Futter auf bestimmte Verarbeitungserzeugnisse aus
    Kartoffeln
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1420/75 af 26. maj 1975 om udvidelse af anvendelsesområdet
    for forordning (EØF) nr. 1067/74 om den fælles markedsordning for kunsttørret
    foder til også at omfatte visse produkter forarbejdet på basis af kartofler
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1420/75 del Consiglio, del 26 maggio 1975, che estende
    a taluni prodotti trasformati a base di patate il campo di applicazione del regolamento
    (CEE) n. 1067/74 relativo all' organizzazione comune dei mercati nel settore dei
    foraggi disidratati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1420/75 van de Raad van 26 mei 1975 waarbij de werkingssfeer
    van Verordening (EEG) nr. 1067/74 houdende een gemeenschappelijke ordening der
    markten in de sector kunstmatig gedroogde voedergewassen wordt uitgebreid tot
    bepaalde op basis van aardappelen verwerkte produkten
  type: main
