title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1684/78 of 17 July 1978 re-establishing
    the levying of the customs duties on rubber tyres, etc., other than inner tubes
    and tyre cases of the kind used on bicycles, cycles with an auxiliary motor, motorcycles
    or motor-scooters, falling within heading No ex 40.11 originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1684/78 de la Commission, du 17 juillet 1978, portant
    rétablissement de la perception des droits de douane applicables aux bandages,
    pneumatiques, etc., autres que les chambres à air et pneumatiques des types utilisés
    pour vélocipèdes, vélocipèdes avec moteur auxiliaire, motocycles et scooters,
    de la position tarifaire EX 40.11, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1684/78 der Kommission vom 17. Juli 1978 zur Wiedereinführung
    des Zollsatzes für Reifen, auswechselbare Überreifen usw., andere als Luftschläuche
    und Laufdecken und schlauchlose Reifen für Fahrräder, Mopeds, Motorräder und
    Motorroller, der Tarifnummer ex 40.11, mit Ursprung in Jugoslawien, dem die in
    der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1684/78 af 17. juli 1978 om genindførelse
    af opkrævning af toldafgifter for dæk, ringe, etc., andre end slanger og dæk
    til cykler uden motor, cykler med hjælpemotor, motorcykler og scootere, under
    position ex 40.11, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1684/78 della Commissione, del 17 luglio 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle gomme piene o semipiene,
    coperture, ecc., diverse dalle camere d'aria e coperture dei tipi utilizzati per
    velocipedi con o senza motore ausiliario, per motocicli e per moto «scooters»,
    della voce doganale ex 40.11, originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1684/78 van de Commissie van 17 juli 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op banden en
    velglinten enz., andere dan binnenbanden en buitenbanden van het type gebruikt
    voor rijwielen, voor rijwielen met hulpmotor, voor motorrijwielen en en voor scooters,
    van post ex 40.11, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
