title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1351/85 of 23 May 1985 re-establishing the
    levying of customs duties on jerseys, pullovers, slip-overs, waistcoats, twinsets,
    cardigans, bed jackets and jumpers, knitted or crocheted, products of category
    5 (code 40.0050), originating in Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1351/85 de la Commission du 23 mai 1985 portant rétablissement
    de la perception des droits de douane applicables à certains chandails, pullovers,
    twinsets, gilets et vestes, de bonneterie, de la catégorie de produits no 5 (code
    40.0050), originaires d' Indonésie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1351/85 der Kommission vom 23. Mai 1985 über die
    Wiedereinführung des Zollsatzes für Pullover, Slipover, Twinsets, Westen und
    Strickjacken, aus Gewirken, der Warenkategorie Nr. 5 (Kennziffer 40.0050) mit
    Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3563/84 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1351/85 af 23. maj 1985 om genindførelse
    af opkrævning af toldafgifter for sweatere, pull-overe, slip-overe, cardigans,
    cardigansæt, jumpere, trøjer og veste af uld under varekategori nr. 5 (kode
    40.0050) som har oprindelse i Indonesien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1351/85 της Επιτροπής
    της 23ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των τελωνειακών δασμών για ορισμένα σαντάιγ,
    πουλόβερ, τουίνσετ, γιλέκα και σακάκια, προϊόντα
