    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1351/85 della Commissione del 23 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcune maglie, pullover, twinset,
    giubbetti e giacche a maglia, della categoria di prodotti n. 5 (codice 40.0050),
    originari dell' Indonesia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1351/85 van de Commissie van 23 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op truien,
    jumpers, pullovers, slipovers, twinsets, vesten en jasjes, van brei- of haakwerk,
    van de categorie van produkten nr. 5 (codenummer 40.0050), van oorsprong uit Indonesië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3563/84 van de Raad
