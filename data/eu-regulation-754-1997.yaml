  script: Latn
  content: VERORDNUNG (EG) Nr. 754/97 DER KOMMISSION vom 25. April 1997 über die
    Festsetzung des Umfangs, in dem die im April 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 754/97 af 25. april 1997 om fastsættelse
