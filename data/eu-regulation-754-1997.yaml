  script: Latn
  content: COMMISSION REGULATION (EC) No 754/97 of 25 April 1997 determining the extent
    to which applications lodged in April 1997 for import licences for certain pigmeat
    sector products under the regime provided for by Council Regulation (EC) No 774/94
    opening and providing for the administration of certain Community tariff quotas
    for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 754/97 DE LA COMMISSION du 25 avril 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    avril 1997 pour certains produits du secteur de la viande de porc peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
