    BAS 615H, KBR 2738 (fenheksamid), oksadiargilu i DPX-KN128 (indoksakarb) do załącznika
    I do dyrektywy Rady 91/414/EWG dotyczącej wprowadzania do obrotu środków ochrony
    roślin (notyfikowana jako dokument nr C(1998) 1447)
  type: main
- language: pt
  script: Latn
  content: '98/398/CE: Decisão da Comissão de 2 de Junho de 1998 que reconhece,
    em princípio, a conformidade dos processos apresentados para exame pormenorizado
    com vista à possível inclusão do Bas 615H, do KBR 2738 (fenexamida), do oxadiargil
    e do DPX-KN128 (indoxacarbe) no anexo I da Directiva 91/414/CEE do Conselho relativa
    à colocação dos produtos fitofarmacêuticos no mercado [notificada com o número
    C(1998) 1447]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 2 iunie 1998 de recunoaștere în principiu a conformității
    dosarelor prezentate pentru examinare detaliată în vederea eventualei includeri
    a BAS 615H, KBR 2738 (fenhexamid). oxadiargyl și a DPX-KN128 (indoxacarb) în
    anexa I la Directiva 91/414/CEE a Consiliului privind introducerea pe piață
    a produselor fitosanitare [notificată cu numărul C(1998) 1447]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 2. júna 1998, ktorým sa v zásade uznáva úplnosť
    dokumentácie predloženej na podrobné preskúmanie kvôli možnému zaradeniu
    účinných látok BAS 615H, KBR 2738 (fenhexamid), oxadiargyl a DPX-KN128 (indoxakarb)
    do prílohy I k smernici Rady 91/414/EHS o uvádzaní prípravkov na ochranu rastlín
    na trh (oznámené pod číslom dokumentu C(1998) 1447)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 2. junija 1998 o načelnem priznavanju popolnosti
