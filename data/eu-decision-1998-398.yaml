id: EUDecision1998398
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '98/398/EC: Commission Decision of 2 June 1998 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of BAS 615H, KBR 2738 (fenhexamid), oxadiargyl and DPX-KN128
    (indoxacarb) in Annex I to Council Directive 91/414/EEC concerning the placing
    of plant protection products on the market (notified under document number C(1998)
    1447)'
  type: main
- language: fr
  script: Latn
  content: '98/398/CE: Décision de la Commission du 2 juin 1998 reconnaissant en
    principe la conformité des dossiers transmis pour examen détaillé en vue de
    l''inscription du BAS 615H, du KBR 2738 (fenhexamide), de l''oxadiargyl et du
    DPX-KN128 (indoxacarbe) dans l''annexe I de la directive 91/414/CEE du Conseil
    concernant la mise sur le marché des produits phytopharmaceutiques [notifiée
    sous le numéro C(1998) 1447]'
  type: main
- language: de
  script: Latn
  content: '98/398/EG: Entscheidung der Kommission vom 2. Juni 1998 über die grundsätzliche
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von BAS 615H, KBR 2738 (Fenhexamid), Oxadiargyl
    und DPX-KN128 (Indoxacarb) in Anhang I der Richtlinie 91/414/EWG des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden (Bekanntgegeben
    unter Aktenzeichen K(1998) 1447)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 2 юни 1998 година
    относно признаване по принцип пълнотата на
    досиетата, представени за подробна проверка
    с оглед евентуалното включване на BAS 615H, KBR 2738
    (фенхексамид), оксадиаргил и DPX-KN128 (индоксакарб)
    в приложение I към Директива 91/414/ЕИО на Съвета
    относно пускането на пазара на продукти за
    растителна защита (нотифицирано под номер
    C(1998) 1447)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 2. června 1998, kterým se v zásadě uznává
    úplnost dokumentací předložených k podrobnému zkoumání s ohledem na možné
    zařazení BAS 615H, KBR 2738 (fenhexamid), oxadiargylu a DPXKN128 (indoxakarb)
    do přílohy I směrnice Rady 91/414/EHS o uvádění přípravků na ochranu
    rostlin na trh (oznámeno pod číslem K(1998) 1447)
  type: main
- language: da
  script: Latn
  content: '98/398/EF: Kommissionens beslutning af 2. juni 1998 om principiel anerkendelse
    af, at det dossier, som er forelagt til grundig behandling med henblik på eventuel
    optagelse af BAS 615H, KBR 2738 (fenhexamid), oxadiargyl og DPX-KN128 (indoxacarb)
    i bilag I til Rådets direktiv 91/414/EØF om markedsføring af plantebeskyttelsesmidler,
    er fuldstændigt (meddelt under nummer K(1998) 1447)'
  type: main
- language: el
  script: Grek
  content: '98/398/ΕΚ: Απόφαση της Επιτροπής της 2ας Ιουνίου
