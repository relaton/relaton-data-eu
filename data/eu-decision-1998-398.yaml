    KBR 2738 (fenheksamid), oksadiargila in DPX-KN128 (indoksakarb) v Prilogo I k
    Direktivi Sveta 91/414/EGS o dajanju fitofarmacevtskih sredstev v promet (notificirano
    pod dokumentarno številko K(1998) 1447)
  type: main
