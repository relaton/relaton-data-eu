    υπό τον αριθμό Ε(1998) 1447]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 2. juuni 1998, millega tunnistatakse põhimõtteliselt
    täielikuks üksikasjaliku läbivaatuse jaoks esitatud toimikud, pidades silmas
    BAS 615H, KBR 2738 (fenheksamiid), oksadiargüüli ja DPX-KN128 (indoksakarb)
    lisamist taimekaitsevahendite turuleviimist käsitleva nõukogu direktiivi 91/414/EMÜ
