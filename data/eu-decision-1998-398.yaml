    BAS 615H:n, KBR 2738:n (fenheksamidi), oksadiargyylin ja DPX-KN128:n (indoksakarbi)
    mahdolliseksi sisällyttämiseksi kasvinsuojeluaineiden markkinoille saattamisesta
    annetun neuvoston direktiivin 91/414/ETY liitteeseen I (tiedoksiannettu numerolla
    K(1998) 1447)'
  type: main
- language: hr
  script: Latn
  content: '98/398/EZ: Odluka Komisije od 2. lipnja 1998. o načelnom priznavanju
    cjelovitosti dokumentacije dostavljene na detaljno razmatranje s ciljem mogućeg
    uvrštenja BAS 615H, KBR 2738 (fenheksamida), oksadiargila i DPX-KN128 (indoksakarba)
    u Prilog I. Direktivi Vijeća 91/414/EEZ o stavljanju sredstava za zaštitu bilja
    na tržište (priopćeno pod brojem dokumenta C(1998) 1447)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1998. június 2.) a BAS 615H-nak, a KBR 2738-nak
    (fenhexamid), az oxadiargilnek és a DPX-KN128-nak (indoxakarb) a növényvédő
    szerek forgalomba hozataláról szóló 91/414/EGK tanácsi irányelv I. mellékletébe
    történő lehetséges felvétele céljából részletes vizsgálatra benyújtott
    dokumentációk teljességének elvi elismeréséről (az értesítés a C(1998)
    1447. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '98/398/CE: Decisione della Commissione del 2 giugno 1998 che riconosce
    in linea di massima la conformità dei fascicoli trasmessi per un esame dettagliato
    in vista di un eventuale inserimento di BAS 615H, KBR 2738 (fenhexamid), oxadiargyl
    e DPX-KN 128 (indoxacarb) nell''allegato I della direttiva 91/414/CEE del Consiglio,
    relativa all''immissione in commercio dei prodotti fitosanitari [notificata con
    il numero C(1998) 1447]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1998. gada 2. jūnijs), ar ko principā atzīst par
    pilnīgu dokumentāciju, kas iesniegta sīkākai pārbaudei saistībā ar BAS
    615H, KBR 2738 (fenheksamīda), oksadiargila un DPX-KN128 (indoksakarba) iespējamu
    iekļaušanu I pielikumā Padomes Direktīvai 91/414/EEK par augu aizsardzības
    līdzekļu laišanu tirgū (izziņots ar dokumenta numuru C(1998) 1447)
  type: main
- language: lt
  script: Latn
  content: 1998 m. birželio 2 d. Komisijos sprendimas, iš esmės pripažįstantis
    dokumentų, pateiktų nuodugniai patikrinti dėl BAS 615H, KBR 2738 (fenheksamido),
    oksadiargilo ir DPX-KN128 (indoksakarbo) galimo įrašymo į Tarybos direktyvos
    91/414/EEB dėl augalų apsaugos produktų pateikimo į rinką I priedą, išsamumą
    (pranešta dokumentu Nr. C(1998) 1447)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-2 ta’ Ġunju 1998 li tagħraf fil-prinċipju
    l-kompletezza ta’ l-inkartament sottomessi għal eżami dettaljat minħabba
    inklużjoni possibbli ta’ BAS 615H, KBR 2738 (fenhexamid), oxadiargyl u DPX-KN128
    (indoxacarb) fl-Anness I tad-Direttiva tal-Kunsill 91/414/KEE dwar it-tqegħid
    ta’ prodotti għal protezzjoni tal-pjanti fuq is-suq (innotifikata bid-dokument
    numru C(1998) 1447)
  type: main
- language: nl
  script: Latn
  content: '98/398/EG: Beschikking van de Commissie van 2 juni 1998 waarbij in beginsel
    wordt erkend dat de dossiers die zijn ingediend voor een grondig onderzoek met
    het oog op de eventuele opneming van BAs 615H, KBR 2738 (fenhexamid), oxadiargyl
    en DPX-KN128 (indoxacarb) in bijlage I van Richtlijn 91/414/EEG van de Raad betreffende
    het op de markt brengen van gewasbeschermingsmiddelen, volledig zijn (kennisgeving
    geschied onder nummer C(1998) 1447)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 2 czerwca 1998 r. uznająca zasadniczo kompletność
