title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1534/96 of 25 July 1996 providing for the adjustment,
    as an autonomous and transitional measure, of concessions for certain processed
    agricultural products provided for in the Europe Agreements to take account of
    the Agreement on Agriculture concluded during the Uruguay Round Multilateral Trade
    Negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1534/96 du Conseil du 25 juillet 1996 prévoyant l'adaptation
    autonome et transitoire des concessions pour certains produits agricoles transformés
    prévues par les accords européens afin de tenir compte de l'accord sur l'agriculture
    conclu dans le cadre des négociations commerciales multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1534/96 des Rates vom 25. Juli 1996 zur vorübergehenden
    autonomen Anpassung von in den Europa-Abkommen vorgesehenen Zugeständnissen für
    bestimmte landwirtschaftliche Verarbeitungserzeugnisse, um dem im Rahmen der multilateralen
    Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkommen über die
    Landwirtschaft Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1534/96 af 25. juli 1996 om autonom og midlertidig
    tilpasning af indrømmelser for visse forarbejdede landbrugsprodukter i Europaaftalerne
    for at tage hensyn til den landbrugsaftale, som er indgået under de multilaterale
    handelsforhandlinger i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1534/96 του Συμβουλίου
    της 25ης Ιουλίου 1996 περί της αυτόνομης και μεταβατικής
    προσαρμογής των παραχωρήσεων για ορισμένα
    μεταποιημένα γεωργικά προϊόντα προβλεπόμενα
    στις ευρωπαϊκές συμφωνίες για να ληφθεί υπόψη
    η συμφωνία για τη γεωργία που έχει συναφθεί
    στο πλαίσιο των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1534/96, annettu 25 päivänä heinäkuuta 1996,
    Eurooppa-sopimuksissa määrättyjen maataloutta koskevien tiettyjen jalostettujen
    maataloustuotteiden myönnytysten autonomisesta ja väliaikaisesta mukauttamisesta
    Uruguayn kierroksen monenvälisten kauppaneuvotteluiden osana tehdyn maataloussopimuksen
    huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1534/96 del Consiglio del 25 luglio 1996 che stabilisce
    l'adeguamento autonomo e transitorio delle concessioni per taluni prodotti agricoli
    trasformati previste dagli accordi europei al fine di tener conto dell'accordo
    sull'agricoltura concluso nel quadro dei negoziati commerciali multilaterali dell'Uruguay
    Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1534/96 van de Raad van 25 juli 1996 houdende, in
    verband met de in het kader van de multilaterale handelsbesprekingen van de Uruguay-Ronde
    gesloten Overeenkomst inzake de landbouw, een autonome en tijdelijke aanpassing
    van in de Europa-Overeenkomsten opgenomen concessies voor bepaalde verwerkte landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1534/96 do Conselho de 25 de Julho de 1996 que prevê
    a adaptação autónoma e transitória de concessões para certos produtos agrícolas
    transformados previstas nos acordos europeus a fim de ter em conta o Acordo sobre
    a agricultura celebrado no âmbito das negociações do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1534/96 del Consejo de 25 de julio de 1996 por el que
    se adaptan, con carácter autónomo y transitorio, concesiones para determinados
    productos agrícolas transformados previstas en los Acuerdos europeos a fin de
    tener en cuenta lo establecido en el Acuerdo sobre agricultura celebrado en el
    marco de las negociaciones comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1534/96 av den 25 juli 1996 om autonom anpassning,
    under en övergångsperiod, av koncessioner för vissa bearbetade jordbruksprodukter
    som föreskrivs i Europaavtalen i syfte att beakta det avtal om jordbruket som
    ingåtts inom ramen för de multilaterala handelsförhandlingarna under Uruguayrundan
