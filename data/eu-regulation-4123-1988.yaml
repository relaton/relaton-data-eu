title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4123/88 of 27 December 1988 derogating for
    the 1988/89 wine year form Regulation (EEC) No 2721/88 in regard to the date of
    submission for approval of contracts for preventive distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4123/88 de la Commission du 27 décembre 1988 portant
    dérogation pour la campagne 1988/1989 au règlement (CEE) n° 2721/88 en ce qui
    concerne la date de présentation pour agrément des contrats de distillation
    préventive
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 4123/88 DER KOMMISSION vom 27. Dezember 1988 zur Abweichung
    von der Verordnung (EWG) Nr. 2721/88 hinsichtlich der Frist fuer die Einreichung
    der die vorbeugende Destillation betreffenden Vertraege im Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4123/88 af 27. december 1988 om undtagelse
    for produktionsåret 1988/89 fra forordning (EØF) nr. 2721/88, for så vidt angår
    den dato, på hvilken kontrakter om forebyggende destillation senest kan indgives
    til godkendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4123/88 της Επιτροπής
    της 27ης Δεκεμβρίου 1988 για παρέκκλιση, για την
    περίοδο 1988/89, από τον κανονισμό (ΕΟΚ) αριθ. 2721/88
    όσον αφορά την ημερομηνία υποβολής για έγκριση
    των συμβάσεων της προληπτικής απόσταξης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 4123/88 DELLA COMMISSIONE del 27 dicembre 1988 recante
    deroga per la campagna 1988/1989 al regolamento (CEE) n. 2721/88 alla data di
    presentazione per l'approvazione dei contratti di distillazone preventiva
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 4123/88 VAN DE COMMISSIE van 27 december 1988 houdende
    afwijking, voor het wijnoogstjaar 1988/1989, van Verordening (EEG) nr. 2721/88
    betreffende de termijn waarin preventieve distillatiecontracten ter goedkeuring
    voorgelegd moeten worden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 4123/88 DA COMISSAO de 27 de Dezembro de 1988 que
    derroga, relativamente à campanha de 1988/1989, o Regulamento (CEE) n* 2721/88,
    no que diz respeito à data de apresentaçao para aprovaçao dos contratos de
    destilaçao preventiva
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 4123/88 DE LA COMISION de 27 de diciembre de 1988 por
    el que se establecen casos de excepcion durante la campana de 1988/89 al Reglamento
    (CEE) no 2721/88 en lo referente a la fecha de presentacion para su autorizacion
    de los contratos de destilacion preventiva
  type: main
