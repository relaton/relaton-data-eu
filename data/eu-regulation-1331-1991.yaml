title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1331/91 of 22 May 1991 re-establishing the
    levying of customs duties on products of category 75 (order No 40.0750), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1331/91 DE LA COMMISSION du 22 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    75 (numéro d'' ordre 40.0750) originaires de l'' Indonésie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1331/91 DER KOMMISSION vom 22. Mai 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 75 (laufende
    Nummer 40.0750) mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1331/91 af 22. maj 1991 om genindførelse
    af opkrævning af told for varer under varekategori nr. 75 (løbenummer 40.0750),
    som har oprindelse i Indonesien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1331/91 της Επιτροπής
