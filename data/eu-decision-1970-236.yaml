id: EUDecision1970236
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 31 mars 1970, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les gants de protection pour tous métiers, de la position 42.03
    B I du Tarif douanier commun, originaires de la République populaire de Chine
    et mis en libre pratique en France
  type: main
- language: de
  script: Latn
  content: '70/236/EWG: Entscheidung der Kommission vom 31. März 1970, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus der Volksrepublik China stammenden und in Frankreich
    im freien Verkehr befindlichen Schutzhandschuhe für alle Berufe der Tarifnummer
    42.03 B I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/236/CEE: Decisione della Commissione, del 31 marzo 1970, che autorizza
    il Regno del Belgio, il Granducato di Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i guanti di protezione per qualsiasi
    mestiere, della voce 42.03 B I della tariffa doganale comune, originari della
    Repubblica popolare cinese e messi in libera pratica in Francia'
  type: main
- language: nl
  script: Latn
  content: '70/236/EEG: Beschikking van de Commissie van 31 maart 1970 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd werkhandschoenen en -wanten van post 42.03 B I van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in Frankrijk in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
