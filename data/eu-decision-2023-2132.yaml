    álló vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK
    európai parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2023) 6735. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/2132 della Commissione, del 13 ottobre
    2023, che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato GA21 × T25 a norma del regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2023) 6735]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/2132 (2023. gada 13. oktobris),
