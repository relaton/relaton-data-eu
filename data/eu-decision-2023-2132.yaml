    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2023) 6735)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/2132 της Επιτροπής,
    της 13ης Οκτωβρίου 2023, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    GA21 × T25 σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003
