    Mais der Sorte GA21 × T25 enthalten, aus ihm bestehen oder aus ihm hergestellt
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2023) 6735)
  type: main
- language: bg
