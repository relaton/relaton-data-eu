  content: Commission Regulation (EEC) No 1915/86 of 20 June 1986 laying down detailed
    implementing rules for the disposal of alcohol obtained from the distillation
    operations referred to in Articles 39, 40 and 41 of Regulation (EEC) No 337/79
    and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1915/86 de la Commission du 20 juin 1986 établissant
    les modalités d' application relatives à l' écoulement des alcools obtenus
    au titre des distillations visées aux articles 39, 40 et 41 du règlement (CEE)
    n° 337/79 et détenus par les organismes d' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1915/86 der Kommission vom 20. Juni 1986 mit Durchführungsbestimmungen
    für den Absatz von im Rahmen der Destillationen gemäß Artikel 39, 40 und 41
    der Verordnung (EWG) Nr. 337/79 gewonnenem Alkohol aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1915/86 af 20. juni 1986 om nærmere
    bestemmelser for afsætning af alkohol, der er fremstillet i henhold til de i
    artikel 39, 40 og 41 i forordning (EØF) nr. 337/79 omhandlede destillationer,
    og som interventionsorganerne ligger inde med
  type: main
- language: el
