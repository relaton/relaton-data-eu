    di cui agli articoli 39, 40 e 41 del regolamento (CEE) n. 337/79 e detenuti dagli
    organismi d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1915/86 van de Commissie van 20 juni 1986 tot vaststelling
