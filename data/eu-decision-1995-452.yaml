title:
- language: en
  script: Latn
  content: '95/452/EC: Commission Decision of 12 April 1995 on State aid in the form
    of tax concessions to undertakings operating in the Centro di Servizi Finanziari
    ed Assicurativi di Trieste pursuant to Article 3 of Italian Law No 19 of 9 January
    1991 (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/452/CE: Décision de la Commission, du 12 avril 1995, concernant les
    mesures d''aide sous forme d''avantages fiscaux prévues par l''article 3 de la
    loi italienne nº 19 du 9 janvier 1991, en faveur d''entreprises opérant dans
    le cadre du Centre de services financiers et d''assurance de Trieste (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
