  content: Commission Regulation (EC) No 1563/2002 of 30 August 2002 repealing Regulation
    (EC) No 1866/95 establishing detailed rules for the application in the poultrymeat
    and egg sectors of the arrangements provided for in the free trade agreements
    between the Community, of the one part, and Lithuania, Latvia and Estonia, of
    the other part
