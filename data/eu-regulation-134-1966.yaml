  content: Règlement n 134/66/CEE du Conseil, du 22 septembre 1966, modifiant les
    règlements ns 45, 46, 116, 129/63/CEE et 59/64/CEE du Conseil en ce qui concerne
    les oeufs à couver de volailles de basse-cour et les volailles vivantes d'un
    poids n'excédant pas 185 grammes
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 134/66/EWG des Rates vom 22. September 1966 zur Änderung
    der Verordnungen Nrn. 45, 46, 116, 129/63/EWG und 59/64/EWG des Rates, soweit
    diese Bruteier von Hausgeflügel und lebendes Hausgeflügel mit einem Gewicht
    von höchstens 185 Gramm betreffen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 134/66/CEE del Consiglio, del 22 settembre 1966, recante
