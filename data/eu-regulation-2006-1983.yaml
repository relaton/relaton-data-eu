title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2006/83 of 18 July 1983 amending Regulation
    (EEC) No 471/76 as regards the period of suspension of the application of the
    condition on prices governing the importation into the Community of fresh lemons
    originating in certain Mediterranean countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2006/83 du Conseil du 18 juillet 1983 modifiant le
    règlement (CEE) no 471/76 en ce qui concerne la période de suspension de l'
    application de la condition en matière de prix à laquelle est soumise l' importation
    dans la Communauté de citrons frais originaires de certains pays du bassin méditerranéen
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2006/83 des Rates vom 18. Juli 1983 zur Änderung
    der Verordnung (EWG) Nr. 471/76 hinsichtlich der Dauer der Aussetzung der Anwendung
    der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung in einigen
    Ländern des Mittelmeerraums in die Gemeinschaft unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2006/83 af 18. juli 1983 om ændring af forordning
    (EØF) nr. 471/76 for så vidt angår suspensionsperioden for den vedrørende
    priserne gældende betingelse for indførsel til Fællesskabet af friske citroner
    med oprindelse i visse middelhavslande
  type: main
- language: el
  script: Grek
