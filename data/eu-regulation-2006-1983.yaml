    Κοινότητα νωπών λεμονιών καταγωγής ορισμένων
    χωρών της λεκάνης της Μεσογείου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2006/83 del Consiglio del 18 luglio 1983 che modifica
    il regolamento (CEE) n. 471/76 per quanto riguarda il periodo durante il quale
    è sospesa l' applicazione della condizione in materia di prezzi cui è soggetta
    l' importazione nella Comunità di limoni freschi originari di taluni paesi del
    bacino mediterraneo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2006/83 van de Raad van 18 juli 1983 tot wijziging
