id: EUDecision1977699
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 November 1977 on the granting by the Guidance
    Section of the EAGGF to the United Kingdom of a payment on account in respect
    of expenditure incurred during 1976 on annuities relating to measures to encourage
    the cessation of farming and the reallocation of utilized agricultural area for
    the purpose of structural improvement
  type: main
- language: fr
  script: Latn
  content: '77/699/CEE: Décision de la Commission, du 3 novembre 1977, relative au
    versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume-Uni, d''un acompte sur les dépenses effectuées,
    pendant l''année 1976, pour les indemnités relatives à l''encouragement de
    la cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. November 1977 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1976 zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 3. november 1977 om udbetaling gennem EUGFL,
    udviklingssektionen, til Det forenede Kongerige af et acontobeløb for de udgifter,
    som er afholdt i løbet af året 1976 til godtgørelser vedrørende støtte til
    ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til
    strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 novembre 1977, relativa al versamento
    da parte del FEAOG, sezione orientamento, al Regno Unito di un anticipo sulle
    spese effettuate durante il 1976 per le indennità concernenti l'incoraggiamento
    alla cessazione dell'attività agricola e alla destinazione della superficie agricola
    utilizzata a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 november 1977 inzake de betaling door
    het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk van een voorschot
    in verband met de gedurende het jaar 1976 gedane uitgaven voor de uitkeringen
    met betrekking tot de bevordering van de bedrijfsbeëindiging in de landbouw en
    van de aanwending van cultuurgrond tot verbetering van de structuur
  type: main
