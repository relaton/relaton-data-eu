    catégories d'aliments pour animaux contenant du lait
  type: main
- language: de
  script: Latn
  content: '64/163/EWG: Entscheidung der Kommission vom 6. März 1964, durch die die
    Französische Republik ermächtigt wird, bei der Einfuhr einiger Futtermittelarten,
    die Milch enthalten, einen Ausgleichsbetrag zu erheben'
  type: main
- language: it
  script: Latn
  content: '64/163/CEE: Decisione della Commissione del 6 marzo 1964, con la quale
    si autorizza la Repubblica francese a riscuotere un ammontare compensativo all''importazione
    di alcune categorie di alimenti per animali, contenenti latte'
  type: main
