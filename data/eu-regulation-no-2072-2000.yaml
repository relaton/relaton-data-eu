  script: Latn
  content: Komisjoni määrus (EÜ) nr 2072/2000, 29. september 2000, millega muudetakse
    määrust (EÜ) nr 1898/97, millega sätestatakse nõukogu määrusega (EÜ) nr
    3066/95 hõlmatud korra rakenduseeskirjad sealihasektoris ning tunnistatakse kehtetuks
