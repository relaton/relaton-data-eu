    Vabariigi ja Slovakkia, Bulgaaria ja Rumeeniaga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2072/2000, annettu 29 päivänä syyskuuta 2000,
    neuvoston asetuksessa (EY) N:o 3066/95 säädetyn sianliha-alan järjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä sekä asetusten (ETY)
    N:o 2698/93 ja (EY) N:o 1590/94 kumoamisesta annetun asetuksen (EY) N:o 1898/97
    muuttamisesta ja yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan,
    Slovakian, Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn
    järjestelmän mukaisesti heinäkuussa 2000 jätettyjen tiettyjä sianlihavalmisteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä annetun asetuksen (EY)
    N:o 1585/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2072/2000/EK rendelete (2000. december 29.) a 3066/95/EK tanácsi
    rendelet által érintett intézkedések sertéshúságazatra vonatkozó alkalmazási
    szabályainak megállapításáról, valamint a 2698/93/EGK és az 1590/94/EK
    rendelet hatályon kívül helyezéséről szóló 1898/97/EK rendelet módosításáról,
    továbbá a Közösség, valamint a Lengyel Köztársaság, a Magyar Köztársaság,
    a Cseh Köztársaság, Szlovákia, Bulgária és Románia között létrejött
    megállapodásokban foglaltak értelmében egyes sertéshústermékekre 2000 júliusában
    beadott behozatali engedély iránti kérelmek elfogadhatósága mértékének
    meghatározásáról szóló 1585/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2072/2000 della Commissione, del 29 settembre 2000,
    recante modifica del regolamento (CE) n. 1898/97 che stabilisce le modalità d'applicazione,
    per il settore delle carni suine, del regime previsto dal regolamento (CE) n.
    3066/95 del Consiglio e che abroga i regolamenti (CEE) n. 2698/93 e (CE) n. 1590/94,
    nonché modifica del regolamento (CE) n. 1585/2000 che stabilisce entro quali
    limiti possono essere accettate le domande di titoli d'importazione presentate
    nel mese di luglio 2000 per taluni prodotti del settore delle carni suine nel
    quadro del regime previsto dagli accordi conclusi tra la Comunità e la Repubblica
    di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria
    e la Romania
  type: main
