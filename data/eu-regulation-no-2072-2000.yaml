title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2072/2000 of 29 September 2000 amending Regulation
    (EC) No 1898/97 laying down rules of application in the pigmeat sector for the
    arrangements covered by Council Regulation (EC) No 3066/95 and repealing Regulations
    (EEC) No 2698/93 and (EC) No 1590/94 and amending Regulation (EC) No 1585/2000
    determining the extent to which applications lodged in July 2000 for import licences
    for certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2072/2000 de la Commission du 29 septembre 2000 modifiant
    le règlement (CE) nº 1898/97 établissant les modalités d'application dans
    le secteur de la viande de porc du régime prévu par le règlement (CE) nº 3066/95
    du Conseil et abrogeant les règlements (CEE) nº 2698/93 et (CE) nº 1590/94,
    ainsi que modifiant le règlement (CE) nº 1585/2000 déterminant la mesure dans
    laquelle les demandes de certificats d'importation introduites en juillet 2000
    pour certains produits à base de viande de porc dans le cadre du régime prévu
    par les accords conclus par la Communauté avec la République de Pologne, la
    République de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2072/2000 der Kommission vom 29. September 2000 zur
    Änderung der Verordnung (EG) Nr. 1898/97 zur Festlegung der den Schweinefleischsektor
    betreffenden Durchführungsbestimmungen zu der in der Verordnung (EG) Nr. 3066/95
    des Rates vorgesehenen Regelung sowie zur Aufhebung der Verordnungen (EWG) Nr.
    2698/93 und (EG) Nr. 1590/94 und zur Änderung der Verordnung (EG) Nr. 1585/2000
    über die Festsetzung des Umfangs, in dem die im Juli 2000 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der
    Regelung der Abkommen zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen
    Republik, der Slowakei, Bulgarien und Rumänien genehmigt werden können
  type: main
