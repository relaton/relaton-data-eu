  script: Latn
  content: Kommissionens forordning (EF) nr. 2072/2000 af 29. september 2000 om ændring
    af forordning (EF) nr. 1898/97 om gennemførelsesbestemmelser for anvendelse i
    svinekødssektoren af den ordning, der er fastsat i Rådets forordning (EF) nr.
