  script: Latn
  content: Komisijas Regula (EK) Nr. 2072/2000 (2000. gada 29. septembris), ar ko
    groza Regulu (EK) Nr. 1898/97, kurā paredzēti noteikumi par to, kā cūkgaļas
    nozarē piemērot Padomes Regulā (EK) Nr. 3066/95 noteikto režīmu, un atceļ
    Regulu (EEK) Nr. 2698/93 un (EK) Nr. 1590/94, kā arī groza Regulu (EK) Nr. 1585/2000,
    ar ko nosaka apmēra apstiprināšanu attiecībā uz 2000. gada jūlijā iesniegtajiem
    licenču pieteikumiem par dažu cūkgaļas produktu ievešanu saskaņā ar režīmu,
    kas paredzēts Kopienas līgumos ar Polijas Republiku, Ungārijas Republiku, Čehijas
    Republiku, Slovākiju, Bulgāriju un Rumāniju
  type: main
- language: lt
  script: Latn
  content: 2000 m. rugsėjo 29 d. Komisijos reglamentas (EB) Nr. 2072/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 1898/97, nustatantį priemonių, kurioms taikomas
