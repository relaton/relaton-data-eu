  script: Latn
  content: Verordening (EG) nr. 2072/2000 van de Commissie van 29 september 2000 tot
    wijziging van Verordening (EG) nr. 1898/97 houdende vaststelling van bepalingen
    voor de uitvoering, in de sector varkensvlees, van de regeling waarin is voorzien
    bij Verordening (EG) nr. 3066/95 van de Raad, en houdende intrekking van de Verordeningen
    (EEG) nr. 2698/93 en (EG) nr. 1590/94, en tot wijziging van Verordening (EG) nr.
    1585/2000 tot vaststelling van de mate waarin gevolg kan worden gegeven aan de
    aanvragen om invoercertificaten voor bepaalde producten in de sector varkensvlees,
    die in juli 2000 worden ingediend op grond van de regeling die is vastgesteld
    in de door de Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek
    Hongarije, de Tsjechische Republiek, de Slowaakse Republiek, Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2072/2000 z dnia 29 września 2000 r. zmieniające
    rozporządzenie (WE) nr 1898/97 ustanawiające zasady stosowania w sektorze wieprzowiny
    systemu przewidzianego w rozporządzeniu Rady (WE) nr 3066/95 i uchylające rozporządzenia
    (EWG) nr 2698/93 i (WE) nr 1590/94 oraz zmieniające rozporządzenie (WE) nr 1585/2000
    określające zakres, w jakim mogą być przyjmowane wnioski złożone w lipcu
    2000 r. o pozwolenia na przywóz niektórych produktów z wieprzowiny w systemie
    przywidzianym w umowach zawartych przez Wspólnotę z Rzeczpospolitą Polską,
    Republiką Węgierską, Republiką Czeską, Słowacją, Bułgarią i Rumunią
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2072/2000 da Comissão, de 29 de Setembro de 2000,
    que altera o Regulamento (CE) n.o 1898/97, que estabelece as regras de execução,
    no sector da carne de suíno, do regime previsto pelo Regulamento (CE) n.o 3066/95
    do Conselho e que revoga os Regulamentos (CEE) n.o 2698/93 e (CE) n.o 1590/94
    e que altera igualmente o Regulamento (CE) n.o 1585/2000 que determina em que
    medida podem ser aceites os pedidos de certificados de importação de determinados
    produtos do sector da carne de suíno apresentados em Julho de 2000 ao abrigo
    do regime previsto nos acordos concluídos pela Comunidade com a República da
    Polónia, a República da Hungria, a República Checa, a Eslováquia, a Bulgária
    e a Roménia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2072/2000 al Comisiei din 29 septembrie 2000 de modificare
    a Regulamentului (CE) nr. 1898/97 de stabilire a normelor de aplicare, în sectorul
    cărnii de porc, a regimului prevăzut de Regulamentul (CE) nr. 3066/95 al Consiliului
    și de abrogare a Regulamentelor (CEE) nr. 2698/93 și (CE) nr. 1590/94 și de
    modificare a Regulamentului (CE) nr. 1585/2000 de stabilire a gradului în care
    pot fi acceptate solicitările de licențe de import pentru anumite produse din
    carne de porc depuse în iulie 2000 în conformitate cu regimul prevăzut de acordurile
    încheiate de Comunitate cu Republica Polonă, Republica Ungară, Republica Cehă,
    Slovacia, Bulgaria și România
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2072/2000 z 29. septembra 2000, ktorým sa
    mení a dopĺňa nariadenie (ES) č. 1898/97 stanovujúce pravidlá uplatňovania
    opatrení v sektore bravčového mäsa, upravených nariadením Rady (ES) č.
    3066/95 a ktorým sa zrušujú nariadenia (EHS) č. 2698/93 a (ES) č. 1590/94
    a ktorým sa mení a dopĺňa nariadenie (ES) č. 1585/2000 určujúce rozsah,
    v akom môžu byť prijaté žiadosti, ktoré boli predložené v júli 2000,
    na dovozné licencie na niektoré výrobky z bravčového mäsa v rámci režimu
    stanoveného Dohodami uzatvorenými medzi spoločenstvom s Poľskou republikou,
    Maďarskou republikou, Českou republikou, Slovenskom, Bulharskom a Rumunskom
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2072/2000 z dne 29. septembra 2000 o spremembi
    Uredbe (ES) št. 1898/97 o določitvi pravil za uporabo režimov v sektorju prašičjega
    mesa, ki jih zajema Uredba Sveta (ES) št. 3066/95, in o razveljavitvi uredb (EGS)
    št. 2698/93 in (ES) št. 1590/94 ter spremembi Uredbe (ES) št. 1585/2000 o določitvi
    obsega, v katerem se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi julija
    2000, za nekatere proizvode iz prašičjega mesa v skladu z režimom, predvidenim
    v sporazumih, ki so bili sklenjeni med Skupnostjo ter Republiko Poljsko, Republiko
    Madžarsko, Češko republiko, Slovaško, Bolgarijo in Romunijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2072/2000 de la Comisión, de 29 de septiembre de 2000,
    que modifica el Reglamento (CE) nº 1898/97 por el que se establecen las disposiciones
    de aplicación en el sector de la carne de porcino del régimen establecido en
    el Reglamento (CE) nº 3066/95 del Consejo y se derogan los Reglamentos (CEE)
    nº 2698/93 y (CE) nº 1590/94, y asimismo el Reglamento (CE) nº 1585/2000 por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de julio de 2000 al amparo del régimen previsto en los Acuerdos celebrados
    entre la Comunidad y la República de Polonia, la República de Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2072/2000 av den 29 september 2000 om
    ändring av förordning (EG) nr 1898/97 om tillämpningsföreskrifter vad avser
    griskött för den ordning som fastställs i rådets förordning (EG) nr 3066/95
    och upphävande av förordningarna (EEG) nr 2698/93 och (EG) nr 1590/94 och ändring
    av förordning (EG) nr 1585/2000 om fastställande av i vilken utsträckning ansökningar
