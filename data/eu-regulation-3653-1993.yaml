  script: Latn
  content: Commission Regulation (EC) No 3653/93 of 29 December 1993 amending Regulation
    (EEC) No 1195/93 increasing to 2 650 000 tonnes the quantity of bread-making wheat
    held by the German intervention agency for which a standing invitation to tender
    for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3653/93 de la Commission, du 29 décembre 1993, modifiant
    le règlement (CEE) n 1195/93 et portant à 2 650 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    allemand
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3653/93 der Kommission vom 29. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 1195/93 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweichweizen
    auf 2 650 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3653/93 af 29. december 1993 om ændring
    af forordning (EØF) nr. 1195/93 og om forhøjelse til 2 650 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det tyske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
