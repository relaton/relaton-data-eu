    impordil teatavatest Euroopa riikidest, võttes Poola suhtes arvesse teatavaid
    aspekte (teatavaks tehtud numbri K(2000) 3818 all)
  type: main
- language: fi
  script: Latn
  content: '2001/849/EY: Komission päätös, tehty 30 päivänä marraskuuta 2001,
