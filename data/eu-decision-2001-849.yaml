    fresche provenienti da alcuni paesi europei, in considerazione di alcuni aspetti
    riguardanti la Polonia (Testo rilevante ai fini del SEE) [notificata con il numero
    C(2001) 3818]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 30. novembris), ar ko groza Komisijas Lēmumu
    98/371/EK par dzīvnieku veselības nosacījumiem un veterināro sertifikāciju
    svaigas gaļas importam no konkrētām Eiropas valstīm, ņemot vērā dažus
    aspektus saistībā ar Poliju (izziņots ar dokumenta numuru C(2001) 3818)
  type: main
- language: lt
  script: Latn
  content: 2001 m. lapkričio 30 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    98/371/EB dėl gyvūnų sveikatos reikalavimų ir veterinarinio sertifikavimo
    importuojant šviežią mėsą iš tam tikrų Europos šalių, kad būtų atsižvelgta
    į kai kuriuos su Lenkija susijusius aspektus (pranešta dokumentu Nr. C(2001)
    3818)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-30 ta’ Novembru 2001 li temenda id-Deċiżjoni
    tal-Kummissjoni 98/371/KE li tikkonċerna l-kundizzjonijiet tas-saħħa ta’
    l-annimali u ċertifikazzjoni veterinarja għall-importazzjoni tal-laħam frisk
    minn ċerti pajjiżi Ewropej biex tittieħed kunsiderazzjoni ta’ xi aspetti
    rigward il-Polonja (notifikata bid-dokument numru Ċ(2001) 3818)
  type: main
- language: nl
  script: Latn
  content: '2001/849/EG: Beschikking van de Commissie van 30 november 2001 houdende
    wĳziging van Beschikking 98/371/EG van de Commissie tot vaststelling van de veterinairrechtelĳke
    voorschriften en de voorschriften inzake veterinaire certificering voor de invoer
