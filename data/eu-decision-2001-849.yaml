    für die Einfuhr von frischem Fleisch aus bestimmten europäischen Ländern unter
    Berücksichtigung bestimmter Aspekte in Bezug auf Polen (Text von Bedeutung für
    den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 3818)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 30. listopadu 2001, kterým se mění rozhodnutí
