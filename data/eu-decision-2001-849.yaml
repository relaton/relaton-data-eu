    przy przywozie świeżego mięsa z niektórych państw europejskich do wykorzystania
    w pewnym zakresie w stosunku do Polski (notyfikowana jako dokument nr C(2001)
    3818)
  type: main
- language: pt
  script: Latn
  content: '2001/849/CE: Decisão da Comissão, de 30 de Novembro de 2001, que altera
