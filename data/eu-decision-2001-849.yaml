title:
- language: en
  script: Latn
  content: '2001/849/EC: Commission Decision of 30 November 2001 amending Commission
    Decision 98/371/EC concerning the animal health conditions and veterinary certifications
    for import of fresh meat from certain European countries to take into account
    some aspects in relation with Poland (Text with EEA relevance) (notified under
    document number C(2001) 3818)'
  type: main
- language: fr
  script: Latn
  content: '2001/849/CE: Décision de la Commission du 30 novembre 2001 modifiant
    la décision 98/371/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays européens afin de tenir compte de certains aspects concernant la
    Pologne (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro
    C(2001) 3818]'
  type: main
- language: de
  script: Latn
  content: '2001/849/EG: Entscheidung der Kommission vom 30. November 2001 zur Änderung
