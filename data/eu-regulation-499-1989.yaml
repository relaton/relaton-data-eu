  content: Commission Regulation (EEC) No 499/89 of 27 February 1989 fixing the percentages
    of table wine production to be delivered for compulsory distillation as provided
    for in article 39 of Council Regulation (EEC) No 822/87 for the 1988/89 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 499/89 de la Commission du 27 février 1989 fixant
    pour la campagne 1988/1989 les pourcentages de la production de vin de table à
    livrer à la distillation obligatoire visée à l'article 39 du règlement (CEE)
    n° 822/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 499/89 DER KOMMISSION vom 27. Februar 1989 zur Festsetzung
