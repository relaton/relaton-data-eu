    822/87 des Rates zu liefernden Prozentsatzes der Tafelweinerzeugung für das Wirtschaftsjahr
    1988/89 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 499/89 af 27. februar 1989 om fastsættelse
