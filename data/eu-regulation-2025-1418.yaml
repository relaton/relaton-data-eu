    og endo-1,4-beta-xylanase produceret med Talaromyces versatilis IMI CC 378536
    som fodertilsætningsstof til alle fjerkræarter, fravænnede smågrise, slagtesvin
    og søer (indehaver af godkendelsen: Adisseo France S.A.S.) og om ophævelse af
    gennemførelsesforordning (EU) nr. 290/2014 og (EU) nr. 1138/2014'
  type: main
