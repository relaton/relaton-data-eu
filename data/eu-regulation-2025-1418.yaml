    и ендо-1,4-бета-ксиланаза, получени с Talaromyces versatilis
    IMI CC 378536, като фуражна добавка за всички видове
    домашни птици, отбити прасенца, свине за угояване
    и свине майки (притежател на разрешението:
    Adisseo France S.A.S.) и за отмяна на регламенти за изпълнение
    (ЕС) № 290/2014 и (ЕС) № 1138/2014'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2025/1418 ze dne 17. července 2025
    o obnovení povolení přípravku z endo-1,3(4)-beta-glukanázy a endo-1,4-beta-xylanázy
    z Talaromyces versatilis IMI CC 378536 jako doplňkové látky pro všechny druhy
    drůbeže, odstavená selata, výkrm prasat a prasnice (držitel povolení: Adisseo
    France S.A.S.) a o zrušení prováděcích nařízení (EU) č. 290/2014 a (EU)
    č. 1138/2014'
  type: main
