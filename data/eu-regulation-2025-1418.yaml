title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/1418 of 17 July 2025 concerning
    the renewal of the authorisation of a preparation of endo-1,3(4)-beta-glucan’s
    and endo-1,4-beta-xylanase produced with Talaromyces versatilis IMI CC 378536
    as a feed additive for all poultry species, weaned piglets, pigs for fattening
    and sows (holder of authorisation: Adisseo France S.A.S.) and repealing Implementing
    Regulations (EU) No 290/2014 and (EU) No 1138/2014'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/1418 de la Commission du 17 juillet
    2025 concernant le renouvellement de l’autorisation d’une préparation d’endo-1,3(4)-β-glucanase
    et d’endo-1,4-β-xylanase produits avec Talaromyces versatilis IMI CC 378536
    en tant qu’additif pour l’alimentation de toutes les espèces de volailles,
    des porcelets sevrés, des porcs d’engraissement et des truies (titulaire de
    l’autorisation: Adisseo France S.A.S.) et abrogeant les règlements d’exécution
    (UE) no 290/2014 et (UE) no 1138/2014'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/1418 der Kommission vom 17. Juli 2025
    zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,3(4)-beta-Glucanase
    und Endo-1,4-beta-Xylanase, gewonnen mit Talaromyces versatilis IMI CC 378536,
    als Zusatzstoff in Futtermitteln für alle Geflügelarten, Absetzferkel, Mastschweine
    und Sauen (Zulassungsinhaber: Adisseo France S.A.S.) und zur Aufhebung der Durchführungsverordnungen
    (EU) Nr. 290/2014 und (EU) Nr. 1138/2014'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2025/1418 на Комисията
