    20 00, 3920 30 00 und 3920 99 50 mit Ursprung in Mexiko, dem die in der Verordnung
    (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
