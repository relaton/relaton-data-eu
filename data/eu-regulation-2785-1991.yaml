  script: Latn
  content: Commission Regulation (EEC) No 2785/91 of 23 September 1991 re-establishing
    the levying of customs duties on products falling within CN codes 3903, 3915 20
    00, 3920 30 00 and 3920 99 50, originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
