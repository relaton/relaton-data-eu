title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 246/78 of 6 February 1978 re-establishing
    the levying of customs duties on woven fabrics of regenerated textile fibres falling
    within subheading 56.07 B, originating in South Korea to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 246/78 de la Commission, du 6 février 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles, de la sous-position tarifaire 56,07 B, originaires
    de la Corée du Sud, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 246/78 der Kommission vom 6. Februar 1978 über die
    Wiedereinführung des Zollsatzes für Gewebe aus künstlichen Spinnfasern der
    Tarifstelle 56.07 B, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 246/78 af 6. februar 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af regenerede fibre under underposition
    56.07 B, som har oprindelse i Sydkorea, og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 246/78 della Commissione, del 6 febbraio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    artificiali, della sottovoce 56.07 B, originari della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 246/78 van de Commissie van 6 februari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van kunstmatige vezels, van post 56.07 B, van oorsprong uit Zuid-Korea, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2706/77
    van de Raad
  type: main
