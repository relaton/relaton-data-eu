  content: '82/804/EEC: Commission Decision of 15 November 1982 establishing that
    the apparatus described as ''Spex- Czerny-Turner Spectrograph/Spectrometer, model
    1802'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/804/CEE: Décision de la Commission, du 15 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Spex-Czerny-Turner Spectrograph/Spectrometer,
    model 1802" peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
