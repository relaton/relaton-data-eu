    festgestellt wird, daß das Gerät ,,Spex- Czerny-Turner Spectrograph/Spectrometer,
    model 1802" , unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/804/EØF: Kommissionens beslutning af 15. november 1982 om fastslåelse
