    af nettovægt 15 kg og derunder, henhørende under position 08.04 B I i den fælles
    toldtarif (1978)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2337/77 del Consiglio, del 24 ottobre 1977, recante
