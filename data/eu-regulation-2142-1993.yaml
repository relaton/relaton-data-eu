title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2142/93 of 29 July 1993 derogating from
    the detailed rules for the delivery by producers of the table wine they are required
    to deliver for compulsory distillation and support distillation in respect of
    the 1992/93 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2142/93 de la Commission, du 29 juillet 1993, portant
    mesure dérogatoire pour la campagne 1992/1993 en matière de livraison par les
    producteurs de leurs quantités de vin de table à livrer au titre des distillations
    obligatoires et de soutien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2142/93 der Kommission vom 29. Juli 1993 mit abweichenden
    Bestimmungen zur obligatorischen und unterstützenden Destillation des von den
    Erzeugern zu liefernden Tafelweins im Wirtschaftsjahr 1992/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2142/93 af 29. juli 1993 om undtagelsesbestemmelser
    for produktionsåret 1992/93 om producenters levering af bordvin til obligatorisk
    destillation og støttedestillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2142/93 της Επιτροπής
    της 29ης Ιουλίου 1993 για τη θέσπιση μέτρου παρέκκλισης
    κατά την περίοδο εμπορίας 1992/93 όσον αφορά την
    παράδοση από τους παραγωγούς των ποσοτήτων
    επιτραπέζιου οίνου τις οποίες πρέπει να παραδώσουν
    για υποχρεωτική απόσταξη και απόσταξη στήριξης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2142/93 della Commissione, del 29 luglio 1993, recante
    deroga, per la campagna 1992-93, in ordine alle consegne di vino da tavola conferito
    dai produttori nel quadro delle distillazioni obbligatorie e di sostegno
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2142/93 van de Commissie van 29 juli 1993 tot vaststelling
    van een afwijking voor het wijnoogstjaar 1992/1993 inzake de levering door de
    producenten van de in het kader van de verplichte distillatie en de marktondersteuningsdistillatie
    te leveren hoeveelheden tafelwijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2142/93 da Comissão, de 29 de Julho de 1993, que
    estabelece uma medida derrogatória para a campanha de 1992/1993 em matéria de
    entrega pelos produtores de vinhos de mesa a título das destilações obrigatória
    e de apoio
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2142/93 de la Comisión, de 29 de julio de 1993, por
    el que se establece una excepción relativa a la entrega por parte de los productores
    de cantidades de vino de mesa con destino a las destilaciones obligatoria y apoyo
    durante la campaña 1992/93
  type: main
