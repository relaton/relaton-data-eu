  script: Latn
  content: Decisione (UE) 2016/134 del Consiglio, del 16 novembre 2015, relativa alla
    posizione che deve essere adottata a nome dell'Unione europea in sede di consiglio
    di stabilizzazione e di associazione istituito dall'accordo di stabilizzazione
    e di associazione tra le Comunità europee e i loro Stati membri, da una parte,
