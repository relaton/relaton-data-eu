  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2016/134 do Conselho, de 16 de novembro de 2015, relativa
    à posição a tomar, em nome da União Europeia, no âmbito do Conselho de Estabilização
    e de Associação criado pelo Acordo de Estabilização e de Associação entre
    as Comunidades Europeias e os seus Estados-Membros, por um lado, e a Bósnia e
    Herzegovina, por outro, sobre a substituição do Protocolo n.° 2 do referido
    Acordo, relativo à definição do conceito de «produtos originários» e aos
    métodos de cooperação administrativa, por um novo protocolo que, no que se
    refere às regras de origem, remeta para a Convenção Regional sobre Regras de
    Origem Preferenciais Pan-Euro-Mediterrânicas
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2016/134 a Consiliului din 16 noiembrie 2015 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de stabilizare și de asociere instituit prin Acordul de stabilizare și de asociere
    dintre Comunitățile Europene și statele membre ale acestora, pe de o parte,
    și Bosnia și Herțegovina, pe de altă parte, cu privire la înlocuirea protocolului
    2 privind definirea noțiunii de „produse originare” și metodele de cooperare
    administrativă la respectivul acord cu un nou protocol care, în ceea ce privește
    regulile de origine, să facă trimitere la Convenția regională cu privire la
    regulile de origine preferențiale paneuro-mediteraneene
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2016/134 zo 16. novembra 2015 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Rade pre stabilizáciu a pridruženie
    zriadenej Dohodou o stabilizácii a pridružení medzi Európskymi spoločenstvami
    a ich členskými štátmi na jednej strane a Bosnou a Hercegovinou na strane
    druhej, pokiaľ ide o nahradenie protokolu 2 k uvedenej dohode týkajúceho sa
    vymedzenia pojmu „produkty s pôvodom“ a metód administratívnej spolupráce
    novým protokolom, ktorý, pokiaľ ide o pravidlá pôvodu, odkazuje na Regionálny
    dohovor o paneuro-stredomorských preferenčných pravidlách pôvodu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2016/134 z dne 16. novembra 2015 o stališču, ki se zastopa
    v imenu Evropske unije v Stabilizacijsko-pridružitvenem svetu, ustanovljenem
    s Stabilizacijsko-pridružitvenim sporazumom med Evropskimi skupnostmi in njihovimi
    državami članicami na eni strani ter Bosno in Hercegovino na drugi strani, glede
    nadomestitve Protokola 2 k navedenemu sporazumu o opredelitvi pojma „izdelki
    s poreklom“ in načinih upravnega sodelovanja z novim protokolom, ki se v zvezi
    s pravili o poreklu sklicuje na Regionalno konvencijo o panevro-mediteranskih
    preferencialnih pravilih o poreklu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/134 del Consejo, de 16 de noviembre de 2015, relativa
    a la posición que deberá adoptarse en nombre de la Unión Europea en el seno
    del Consejo de Estabilización y Asociación instituido por el Acuerdo de Estabilización
    y Asociación entre las Comunidades Europeas y sus Estados miembros, por una parte,
    y Bosnia y Herzegovina, por otra, por lo que respecta a la sustitución de su
    Protocolo 2 relativo a la definición del concepto de «productos originarios»
    y a los métodos de cooperación administrativa por un nuevo Protocolo que, por
    lo que respecta a las normas de origen, se refiera al Convenio regional sobre
    las normas de origen preferenciales paneuromediterráneas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2016/134 av den 16 november 2015 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det stabiliserings- och associeringsråd
    som inrättats genom stabiliserings- och associeringsavtalet mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Bosnien och Hercegovina,
    å andra sidan, beträffande ersättande av protokoll 2 till det avtalet, om definition
    av begreppet ursprungsprodukter och om metoder för administrativt samarbete,
    med ett nytt protokoll, som vad gäller ursprungsregler hänvisar till den regionala
    konventionen om Europa–Medelhavstäckande regler om förmånsursprung
  type: main
