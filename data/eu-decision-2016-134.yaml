    en hun lidstaten, enerzijds, en Bosnië en Herzegovina, anderzijds, over de vervanging
    van Protocol 2 bij deze overeenkomst betreffende de definitie van het begrip „producten
    van oorsprong” en regelingen voor administratieve samenwerking door een nieuw
    protocol waarin, wat de oorsprongsregels betreft, naar de Regionale Conventie
    betreffende de pan-Euro-mediterrane preferentiële oorsprongsregels wordt verwezen
  type: main
