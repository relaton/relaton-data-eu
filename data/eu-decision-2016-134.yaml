---
id: EUDecision2016134
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2016/134 of 16 November 2015 on the position to be
    adopted on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and Bosnia and
    Herzegovina, of the other part, as regards the replacement of Protocol 2 to that
    Agreement, concerning the definition of the concept of ‘originating products’
    and methods of administrative cooperation, by a new protocol which, as regards
    the rules of origin, refers to the Regional Convention on pan-Euro-Mediterranean
    preferential rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/134 du Conseil du 16 novembre 2015 relative à la position
    à prendre, au nom de l'Union européenne, au sein du conseil de stabilisation
    et d'association institué par l'accord de stabilisation et d'association entre
    les Communautés européennes et leurs États membres, d'une part, et la Bosnie-et-Herzégovine,
    d'autre part, en ce qui concerne le remplacement du protocole n° 2 dudit accord,
    portant sur la définition de la notion de «produits originaires» et sur les
    méthodes de coopération administrative, par un nouveau protocole qui, pour ce
    qui est des règles d'origine, fait référence à la convention régionale sur
    les règles d'origine préférentielles paneuro-méditerranéennes
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/134 des Rates vom 16. November 2015 über den im Namen
    der Europäischen Union im durch das Stabilitäts- und Assoziierungsabkommen zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und Bosnien
    und Herzegowina andererseits eingesetzten Stabilitäts- und Assoziationsrat im
    Hinblick auf die Ersetzung des Protokolls Nr. 2 dieses Abkommens über die Bestimmung
    des Begriffs „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“
    und die Methoden der Zusammenarbeit der Verwaltungen durch ein neues Protokoll,
    das hinsichtlich der Ursprungsregeln auf das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    Bezug nimmt, zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2016/134 на Съвета от 16 ноември
    2015 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвета за стабилизиране и асоцииране, създаден
    със Споразумението за стабилизиране и асоцииране
    между Европейските общности и техните държави
    членки, от една страна, и Босна и Херцеговина,
    от друга страна, във връзка със замяната на
    протокол 2 относно определението на понятието
    „продукти с произход“ и методите на административно
    сътрудничество към посоченото споразумение
    с нов протокол, в който по отношение на правилата
    за произход се прави препратка към Регионалната
    конвенция за паневросредиземноморските преференциални
    правила за произход
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2016/134 ze dne 16. listopadu 2015 o postoji, který
    má být zaujat jménem Evropské unie v Radě stabilizace a přidružení zřízené
    dohodou o stabilizaci a přidružení mezi Evropskými společenstvími a jejich
    členskými státy na straně jedné a Bosnou a Hercegovinou na straně druhé,
    pokud jde o nahrazení protokolu 2 k uvedené dohodě o definici pojmu „původní
    produkty“ a metodách správní spolupráce novým protokolem, který, pokud
    jde o pravidla původu, odkazuje na Regionální úmluvu o celoevropsko-středomořských
    preferenčních pravidlech původu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2016/134 af 16. november 2015 om den holdning,
    der skal indtages på vegne af Den Europæiske Union i stabiliserings- og associeringsrådet,
    der er oprettet i henhold til stabiliserings- og associeringsaftalen mellem De
    Europæiske Fællesskaber og deres medlemsstater på den ene side og Bosnien-Hercegovina
    på den anden side, vedrørende erstatning af nævnte aftales protokol 2 om definitionen
    af begrebet »produkter med oprindelsesstatus« og metoderne for administrativt
    samarbejde med en ny protokol, hvori der for så vidt angår oprindelsesreglerne
    henvises til den regionale konvention om pan-Euro-Middelhavsregler for præferenceoprindelse
  type: main
