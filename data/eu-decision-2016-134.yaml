    Stowarzyszenia ustanowionej na mocy Układu o stabilizacji i stowarzyszeniu między
    Wspólnotami Europejskimi i ich państwami członkowskimi, z jednej strony, a
    Bośnią i Hercegowiną, z drugiej strony, w odniesieniu do zastąpienia Protokołu
