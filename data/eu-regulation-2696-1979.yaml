title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2696/79 of 29 November 1979 re-establishing
    the levying of customs duties on textile fabrics impregnated, coated, covered
    or laminated with preparations of cellulose derivatives, ETC., falling within
    heading No 59.08 and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2696/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus imprégnés,
    enduits ou recouverts de dérivés de la cellulose, etc., de la position 59.08
    du tarif douanier commun, originaires des pays et territoires en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2696/79 DER KOMMISSION VOM 29. NOVEMBER 1979 ZUR
    WIEDEREINFUEHRUNG DES ZOLLSATZES FUER GEWEBE, MIT ZELLULOSEDERIVATEN ODER ANDEREN
    KUNSTSTOFFEN GETRAENKT, USW. DER TARIFNUMMER 59.08 MIT URSPRUNG IN ENTWICKLUNGSLAENDERN,
    DENEN DIE IN DER VERORDNUNG ( EWG ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN
    GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2696/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer, imprægneret, overtrukket eller
    lamineret med cellulosederivater, etc. under position 59.08, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2696/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI TESSUTI IMPREGNATI,
    SPALMATI O RICOPERTI DI DERIVATI DELLA CELLULOSA, ECC., DELLA VOCE DOGANALE 59.08,
    ORIGINARI DEI PAESI IN VIA DI SVILUPPO BENEFICIARI DELLE PREFERENZE TARIFFARIE
    PREVISTE DAL REGOLAMENTO ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2696/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels,
    geimpregneerd met, voorzien van een deklaag van of bekleed met cellulosederivaten
    enz., van post 59,08, van oorsprong uit de ontwikkelingslanden en -gebieden ten
    behoeve waarvan bij Verordening ( EEG ) nr. 1195/79 van de Raad tariefpreferenties
    werden geopend
  type: main
