title:
- language: en
  script: Latn
  content: '2007/560/EC: Commission Decision of 2 August 2007 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of chlorantraniliprole, heptamaloxyglucan, spirotetramat
    and Helicoverpa armigera nucleopolyhedrovirus in Annex I to Council Directive
    91/414/EEC (notified under document number C(2007) 3669)'
  type: main
- language: fr
  script: Latn
  content: '2007/560/CE: Décision de la Commission du 2 août 2007 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
