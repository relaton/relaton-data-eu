title:
- language: en
  script: Latn
  content: Regulation (EEC) No 143/73 of the Commission of 29 December 1972 supplementing
    Regulation (EEC) No 2603/71 on detailed rules for the conclusion of contracts
    for first processing and market preparation of tobacco held by intervention agencies,
    following the accession of new Member States to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 143/73 de la Commission, du 29 décembre 1972, complétant
    le règlement (CEE) n° 2603/71 relatif aux modalités de conclusion des contrats,
    de première transformation et conditionnement des tabacs détenus par les organismes
    d' intervention du fait de l' adhésion de nouveaux États membres à la Communauté
  type: main
- language: de
  script: Latn
