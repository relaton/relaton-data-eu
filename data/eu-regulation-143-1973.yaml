    betreffend die erste Bearbeitung und Aufbereitung des im Besitz der Interventionsstellen
    befindlichen Tabaks im Hinblick auf den Beitritt neuer Mitgliedstaaten zur Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 143/73 af 29. december 1972 om supplering
