    (CEE) n. 2603/71 relativo alle modalità di conclusione dei contratti di prima
    trasformazione e di condizionamento dei tabacchi detenuti dagli organismi d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 143/73 van de Commissie van 29 december 1972 waarbij
    Verordening (EEG) nr. 2603/71 houdende bepalingen voor het sluiten van contracten
    voor eerste bewerking en verpakking van tabak die in het bezit is van de interventiebureaus
