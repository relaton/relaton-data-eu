title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 226/94 of 1 February 1994 laying down certain
    additional detailed rules for the application of the Supplementary Trade Mechanism
    (STM) to trade in fruit and vegetables between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, artichokes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 226/94 de la Commission du 1er février 1994 fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les artichauts, les melons et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 226/94 DER KOMMISSION vom 1. Februar 1994 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Artischocken, Melonen und Erdbeeren zwischen Spanien und der Gemeinschaft
    in ihrer Zusammensetzung am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 226/94 af 1. februar 1994 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 inden
    for frugt- og grøntsagssektoren, for så vidt angår tomater, artiskokker, meloner
    og jordbær
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 226/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 1ης Φεβρουαρίου 1994 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών (ΣΜΣ) μεταξύ
    της Ισπανίας και της Κοινότητας με τη σύνθεσή
    της στις 31 Δεκεμβρίου 1985 όσον αφορά τις τομάτες,
    τις αγκινάρες, τα πεπόνια και τις φράουλες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 226/94 DELLA COMMISSIONE del 1o febbraio 1994 che stabilisce
    le modalità complementari di applicazione del meccanismo complementare agli scambi
    (MCS) nel settore degli ortofrutticoli fra la Spagna e la Comunità nella sua
    composizione al 31 dicembre 1985 per quanto riguarda i pomodori, i carciofi, i
    meloni e le fragole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 226/94 VAN DE COMMISSIE van 1 februari 1994 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer (ARH) in de sector groenten en fruit tussen Spanje en de Gemeenschap
    in haar samenstelling op 31 december 1985, ten aanzien van tomaten, artisjokken,
    meloenen en aardbeien
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 226/94 DA COMISSÃO de 1 de Fevereiro de 1994 que
    fixa determinadas normas adicionais de execução do mecanismo complementar aplicável
    às trocas comerciais (MCT) no sector das frutas e produtos hortícolas entre
    Espanha e a Comunidade, na sua composição em 31 de Dezembro de 1985, no que
    diz respeito aos tomates, às alcachofras, aos melões e aos morangos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 226/94 DE LA COMISIÓN de 1 de febrero de 1994 por
    el que se fijan determinadas normas adicionales para la aplicación del mecanismo
    complementario aplicable a los intercambios (MCI) en el sector de las frutas y
    hortalizas entre España y la Comunidad en su composición del 31 de diciembre
    de 1985, por lo que se refiere a los tomates, las alcachofas, los melones y las
    fresas
  type: main
