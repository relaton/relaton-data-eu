  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 3152/94, annettu 21 päivänä joulukuuta 1994,
    viininvalmistuksesta peräisin olevien ja interventioelinten hallussaan pitämien
    alkoholien yksittäisellä tarjouskilpailulla myymisen aloittamisesta annetun
    asetuksen (EY) N:o 2630/94 ja neuvoston asetuksen (ETY) N:o 822/87 35, 36 ja 39
    artiklassa tarkoitetuilla tislauksilla saatujen ja interventioelinten hallussaan
    pitämien alkoholien myymistä koskevista yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 377/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3152/94 della Commissione del 21 dicembre 1994 che
    modifica il regolamento (CE) n. 2630/94 relativo a vendite, mediante gara semplice,
    di alcoli di origine vinica detenuti dagli organismi d'intervento destinati all'esportazione
    e che modifica il regolamento (CEE) n. 377/93 che stabilisce le modalità di applicazione
    relative allo smercio degli alcoli ottenuti dalle distillazioni di cui agli articoli
    35, 36 e 39 del regolamento (CEE) n. 822/87 del Consiglio e detenuti dagli organismi
    d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3152/94 van de Commissie van 21 december 1994 houdende
    wijziging van Verordening (EG) nr. 2630/94 tot opening van gewone openbare inschrijvingen
    voor de verkoop, met het oog op uitvoer, van alcohol uit wijnprodukten die in
    het bezit is van de interventiebureaus, en van Verordening (EEG) nr. 377/93 tot
    vaststelling van de uitvoeringsbepalingen voor de afzet van alcohol die is verkregen
    bij distillatie als bedoeld in de artikelen 35, 36 en 39 van Verordening (EEG)
    nr. 822/87 van de Raad en die in het bezit is van de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3152/94 da Comissão de 21 de Dezembro de 1994 que
    altera o Regulamento (CE) nº 2630/94 relativo à abertura de vendas por concursos
    simples, com vista à exportação, de álcoois de origem vínica na posse dos
    organismos de intervenção, bem como o Regulamento (CEE) nº 377/93 que estabelece
    as regras de execução relativas ao escoamento dos álcoois provenientes das
    destilações referidas nos artigos 35º, 36º e 39º do Regulamento (CEE) nº
    822/87 do Conselho e na posse dos organismos de intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 3152/94 de la Comisión de 21 de diciembre de 1994
    que modifica el Reglamento (CE) n° 2630/94 por el que se abren ventas mediante
    licitación simple para la exportación de alcohol de origen vínico en poder
    de los organismos de intervención, así como el Reglamento (CEE) n° 377/93 por
    el que se establecen las disposiciones de aplicación relativas a la salida al
    mercado de los alcoholes obtenidos con arreglo a las destilaciones contempladas
    en los artículos 35, 36 y 39 del Reglamento (CEE) n° 822/87 del Consejo, y en
    posesión de los organismos de intervención
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 3152/94 av den 21 december 1994 om ändring
    av förordning (EG) nr 2630/94 om försäljning genom enkel anbudsinfordran för
    export av vinalkohol som innehas av interventionsorganen och av förordning (EEG)
    nr 377/93 om närmare bestämmelser om avsättning av alkohol som framställs
    vid de destillationer som avses i artiklarna 35, 36 och 39 i förordning (EEG)
    nr 822/87 och som innehas av interventionsorganen
