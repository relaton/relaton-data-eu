title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3152/94 of 21 December 1994 amending Regulation
    (EC) No 2630/94 opening individual sales by invitation to tender for the export
    of vinous alcohol held by intervention agencies and Regulation (EEC) No 377/93
    laying down detailed rules for the disposal of alcohol obtained from the distillation
    operations referred to in Articles 35, 36 and 39 of Regulation (EEC) No 822/87
    and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3152/94 de la Commission du 21 décembre 1994 modifiant
    le règlement (CE) n° 2630/94 portant ouverture de ventes par adjudications simples
    à l'exportation d'alcools d'origine vinique détenus par les organismes d'intervention
    ainsi que le règlement (CEE) n° 377/93 établissant les modalités d'application
    relatives à l'écoulement des alcools obtenus au titre des distillations visées
    aux articles 35, 36 et 39 du règlement (CEE) n° 822/87 du Conseil et détenues
    par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3152/94 der Kommission vom 21. Dezember 1994 zur Änderung
    der Verordnung (EG) Nr. 2630/94 zur Eröffnung von im Wege der einfachen Ausschreibung
    durchzuführenden Verkäufen von Weinalkohol aus Beständen der Interventionsstellen
    zur Ausfuhr und der Verordnung (EWG) Nr. 377/93 mit Durchführungsbestimmungen
    für den Absatz von Alkohol aus der Destillation nach den Artikeln 35, 36 und
    39 der Verordnung (EWG) Nr. 822/87 des Rates aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3152/94 af 21. december 1994 om ændring
    af forordning (EF) nr. 2630/94 om salg ved almindelig licitation af vinalkohol,
    som interventionsorganerne ligger inde med, til eksport, og forordning (EØF)
    nr. 377/93 om gennemførelsesbestemmelser for afsætning af alkohol, der er fremstillet
    i henhold til de i artikel 35, 36 og 39 i Rådets forordning (EØF) nr. 822/87
    omhandlede destillationer, og som interventionsorganerne ligger inde med
  type: main
- language: el
  script: Grek
