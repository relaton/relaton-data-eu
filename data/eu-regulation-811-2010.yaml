- language: en
  script: Latn
  content: Commission Regulation (EU) No 811/2010 of 15 September 2010 making imports
    of wireless wide area networking (WWAN) modems originating in the People’s Republic
    of China subject to registration in application of Article 24(5) of Council Regulation
    (EC) No 597/2009 on protection against subsidised imports from countries not members
    of the European Community
  type: main
- language: fr
  script: Latn
