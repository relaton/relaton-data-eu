title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2510/2001 of 20 December 2001 determining
    the extent to which applications lodged in December 2001 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 January to 31 March 2002 can be accepted
  type: main
- language: fr
  script: Latn
