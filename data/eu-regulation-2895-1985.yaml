  content: Commission Regulation (EEC) No 2895/85 of 17 October 1985 amending Regulation
    (EEC) No 1343/85 fixing the monetary compensatory amounts, as regards the non-application
    of these amounts to casein and caseinates added to certain milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2895/85 de la Commission, du 17 octobre 1985, modifiant
    le règlement (CEE) n 1343/85 fixant les montants compensatoires monétaires,
    en ce qui concerne la non-application de ces montants pour la caséine ou les
    caséinates ajoutés à certains produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2895/85 der Kommission vom 17. Oktober 1985 zur Änderung
    der Verordnung (EWG) Nr. 1343/85 zur Festsetzung der Währungsausgleichsbeträge,
    hinsichtlich der Nichtanwendung dieser Beträge für Kasein oder Kaseinate, die
    bestimmten Milcherzeugnissen zugefügt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2895/85 af 17. oktober 1985 om ændring
    af forordning (EØF) nr. 1343/85 om fastsættelse af monetære udligningsbeløb,
    for så vidt angår det forhold, at disse beløb ikke gælder for kasein eller
    kaseinater, der tilsættes visse mejeriprodukter
  type: main
- language: el
  script: Grek
