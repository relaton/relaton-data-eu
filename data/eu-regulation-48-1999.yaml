title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 48/1999 of 18 December 1998 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1999 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 48/1999 du Conseil du 18 décembre 1998 fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1999 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 48/1999 des Rates vom 18. Dezember 1998 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechender Fangbedingungen für bestimmte
    Fischbestände oder -bestandsgruppen (1999)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 48/1999 af 18. december 1998 om fastsættelse
    for 1999 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 48/1999 του Συμβουλίου
    της 18ης Δεκεμβρίου 1998 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1999 καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 48/1999, annettu 18 päivänä joulukuuta 1998,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1999 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 48/1999 del Consiglio del 18 dicembre 1998 che stabilisce,
    per alcuni stock o gruppi di stock ittici, il totale ammissibile di catture (TAC)
    per il 1999 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 48/1999 van de Raad van 18 december 1998 inzake de
    vaststelling van de voor 1999 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden, alsmede bepaalde bij de visserij in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 48/1999 do Conselho de 18 de Dezembro de 1998 que
    fixa os totais admissíveis de capturas para 1999 e certas condições em que
    podem ser pescadas determinadas unidades populacionais ou grupos de unidades populacionais
    de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 48/1999 del Consejo de 18 de diciembre de 1998 por
    el que se establecen, para 1999, los totales admisibles de capturas de determinadas
    poblaciones y grupos de poblaciones de peces y determinadas condiciones en que
    pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 48/1999 av den 18 december 1998 om fastställande,
    för vissa fiskbestånd och grupper av fiskbestånd, av totala tillåtna fångstmängder
    för år 1999 och av vissa villkor för fångsten
  type: main
