    jotka ovat Euroopan yhteisöjen nimenomaisesti takaamia saamisia
  type: main
- language: it
  script: Latn
  content: Direttiva 95/15/CE della Commissione, del 31 maggio 1995, che modifica
    la direttiva 89/647/CEE del Consiglio relativa al coefficiente di solvibilità
    degli enti creditizi per quanto concerne la definizione tecnica di «zona A»
    e la ponderazione degli elementi dell'attivo che rappresentano crediti assistiti
    da esplicita garanzia delle Comunità europee
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/15/EG van de Commissie van 31 mei 1995 tot aanpassing van
    Richtlijn 89/647/EEG van de Raad betreffende een solvabiliteitsratio voor kredietinstellingen
    inzake de technische definitie van "Zone A" en de weging van activa die uit uitdrukkelijk
    door de Europese Gemeenschappen gegarandeerde vorderingen bestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 95/15/CE da Comissão, de 31 de Maio de 1995, que adapta a Directiva
