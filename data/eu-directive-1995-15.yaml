title:
- language: en
  script: Latn
  content: Commission Directive 95/15/EC of 31 May 1995 adapting Council Directive
    89/647/EEC on a solvency ratio for credit institutions, as regards the technical
    definition of 'Zone A' and in respect of the weighting of asset items constituting
    claims carrying the explicit guarantee of the European Communities
  type: main
- language: fr
  script: Latn
  content: Directive 95/15/CE de la Commission, du 31 mai 1995, portant adaptation
    de la directive 89/647/CEE du Conseil relative à un ratio de solvabilité des
    établissements de crédit en ce qui concerne la définition technique de la «zone
    A» et la pondération des actifs constituant des créances expressément garanties
    par les Communautés européennes
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/15/EG der Kommission vom 31. Mai 1995 zur Anpassung der Richtlinie
    89/647/EWG des Rates über einen Solvabilitätskoeffizienten für Kreditinstitute
    hinsichtlich der technischen Definition der "Zone A" sowie der Gewichtung der
    Aktiva in Form von durch die Europäischen Gemeinschaften ausdrücklich garantierten
    Forderungen
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 95/15/EF af 31. maj 1995 om tilpasning af Rådets
    direktiv 89/647/EØF om solvensnøgletal for kreditinstitutter for så vidt angår
    den tekniske definition af »Zone A« og med hensyn til vægtningen af aktivposter
    i form af fordringer, der udtrykkeligt er garanteret af De Europæiske Fællesskaber
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/15/ΕΚ της Επιτροπής της 31ης Μαΐου
