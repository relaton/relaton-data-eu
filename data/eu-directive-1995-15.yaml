    89/647/ΕΟΚ του Συμβουλίου σχετικά με το συντελεστή
    φερεγγυότητας των πιστωτικών ιδρυμάτων, όσον
    αφορά τον τεχνικό ορισμό της «Ζώνης Α» και
    τη στάθμιση των στοιχείων ενεργητικού που
    αποτελούν απαιτήσεις με τη ρητή εγγύηση των
    Ευρωπαϊκών Κοινοτήτων
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 95/15/EY, annettu 31 päivänä toukokuuta 1995, neuvoston
