title:
- language: en
  script: Latn
  content: '82/28/EEC: Commission Decision of 18 December 1981 changing the import
    arrangements established by Commission Decision 81/248/EEC and applied in Greece
    in respect of China, Hungary, Poland and Czechoslovakia regarding tableware other
    than gilt or silver-plated (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/28/CEE: Décision de la Commission, du 18 décembre 1981, modifiant
    le régime d''importation prévu par la décision 81/248/CEE de la Commission,
    appliqué en Grèce à l''égard de la Chine, de la Hongrie, de la Pologne et
    de la Tchécoslovaquie en ce qui concerne les couverts de table, autres que dorés
    ou argentés (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/28/EWG: Entscheidung der Kommission vom 18. Dezember 1981 zur Änderung
    der durch Entscheidung der Kommission 81/248/EWG festgelegten und in Griechenland
    gegenüber China, Ungarn, Polen und der Tschechoslowakei für nicht vergoldete
    oder versilberte Eßbestecke angewandten Einfuhrregelung (Nur der griechische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/28/EØF: Kommissionens beslutning af 18. december 1981 om ændring
    af den importordning, der er fastsat i Kommissionens beslutning 81/248/EØF, og
    som anvendes i Grækenland over for Kina, Polen, Tjekkoslovakiet og Ungarn, for
    så vidt angår spisebestik, bortset fra forgyldte eller forsølvede (Kun den
    graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/28/EOK: Απόφαση τής Επιτροπής τής 18ης Δεκεμβρίου
    1981 περί τροποποιήσεως τού καθεστώτος εισαγωγής
    πού προβλέπεται από τήν απόφαση 81/248/EOK τής Επιτροπής
    καί εφαρμόζεται στήν Ελλάδα έναντι τής Κίνας,
    τής Ουγγαρίας, τής Πολωνίας καί τής Τσεχοσλοβακίας
    όσον αφορά τά κοχλιάρια καί περόνες έτερα τών
    επαργύρων ή επιχρύσων (Το κείμενο στην ελληνική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/28/CEE: Decisione della Commissione, del 18 dicembre 1981, che modifica
    il regime d''importazione, istituito con decisione 81/248/CEE della Commissione,
