  content: Commission Regulation (EEC) No 1897/89 of 28 June 1989 repealing Regulation
    (EEC) No 1399/89 concerning the stopping of fishing for cod by vessels flying
    the flag of Germany and Regulation (EEC) No 1435/89 concerning the stopping of
    fishing for cod by vessels flying the flag of a Member State
  type: main
