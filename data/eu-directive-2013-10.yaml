  script: Latn
  content: A Bizottság 2013/10/EU irányelve ( 2013. március 19. ) az aeroszoladagolókra
    vonatkozó tagállami jogszabályok közelítéséről szóló 75/324/EGK tanácsi
    irányelv címkézési rendelkezéseinek az anyagok és keverékek osztályozásáról,
    címkézéséről és csomagolásáról szóló 1272/2008/EK európai parlamenti
    és tanácsi rendelethez való hozzáigazítása céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2013/10/UE della Commissione, del 19 marzo 2013 , che modifica
    la direttiva 75/324/CEE del Consiglio per il ravvicinamento delle legislazioni
    degli Stati membri relative agli aerosol al fine di adattare le sue disposizioni
    concernenti l’etichettatura al regolamento (CE) n. 1272/2008 del Parlamento
    europeo e del Consiglio relativo alla classificazione, all’etichettatura e all’imballaggio
    delle sostanze e delle miscele
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2013/10/ES ( 2013. gada 19. marts ), ar ko groza Padomes
    Direktīvu 75/324/EEK par dalībvalstu normatīvo un administratīvo aktu tuvināšanu
    attiecībā uz aerosola izsmidzinātājiem, lai tajā paredzētos marķēšanas
    noteikumus pielāgotu Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1272/2008
    par vielu un maisījumu klasificēšanu, marķēšanu un iepakošanu
  type: main
