    membres relatives aux générateurs aérosols afin d’en adapter les dispositions
    en matière d’étiquetage au règlement (CE) n ° 1272/2008 du Parlement européen
    et du Conseil relatif à la classification, à l’étiquetage et à l’emballage
    des substances et des mélanges
  type: main
