  script: Latn
  content: Commission Directive 2013/10/EU of 19 March 2013 amending Council Directive
    75/324/EEC on the approximation of the laws of the Member States relating to aerosol
    dispensers in order to adapt its labelling provisions to Regulation (EC) No 1272/2008
    of the European Parliament and of the Council on classification, labelling and
    packaging of substances and mixtures
  type: main
- language: fr
  script: Latn
  content: Directive 2013/10/UE de la Commission du 19 mars 2013 modifiant la directive
