---
id: EURegulation4442011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 444/2011 of 5 May 2011 extending
    the definitive anti-dumping duty imposed by Regulation (EC) No 599/2009 on imports
    of biodiesel originating in the United States of America to imports of biodiesel
    consigned from Canada, whether declared as originating in Canada or not, and extending
    the definitive anti-dumping duty imposed by Regulation (EC) No 599/2009 to imports
    of biodiesel in a blend containing by weight 20 % or less of biodiesel originating
    in the United States of America, and terminating the investigation in respect
    of imports consigned from Singapore
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 444/2011 du Conseil du 5 mai 2011 portant
    extension du droit antidumping définitif institué par le règlement (CE) n °
    599/2009 sur les importations de biodiesel originaire des États-Unis d’Amérique
    aux importations de biodiesel expédié du Canada, qu’il ait ou non été déclaré
    originaire de ce pays, portant extension du droit antidumping définitif institué
    par le règlement (CE) n ° 599/2009 aux importations de biodiesel sous forme
    de mélange contenant, en poids, 20 % ou moins de biodiesel, originaire des États-Unis
    d’Amérique, et clôturant l’enquête concernant les importations expédiées
    de Singapour
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 444/2011 des Rates vom 5. Mai 2011 zur
    Ausweitung des mit der Verordnung (EG) Nr. 599/2009 eingeführten endgültigen
    Antidumpingzolls auf die Einfuhren von Biodiesel mit Ursprung in den Vereinigten
    Staaten von Amerika auf die aus Kanada versandten Einfuhren von Biodiesel, ob
    als Ursprungserzeugnisse Kanadas angemeldet oder nicht, und zur Ausweitung des
    mit der Verordnung (EG) Nr. 599/2009 eingeführten endgültigen Antidumpingzolls
    auf die Einfuhren von Biodiesel als Mischung mit einem Gehalt an Biodiesel von
    bis zu 20 GHT mit Ursprung in den Vereinigten Staaten von Amerika und zur Einstellung
    der Untersuchung betreffend die aus Singapur versandten Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 444/2011 на Съвета
    от 5 май 2011 година за разширяване на обхвата
    на наложеното с Регламент (ЕО) № 599/2009 окончателно
    антидъмпингово мито върху вноса на биодизел
    с произход от Съединените американски щати
    по отношение на внос на биодизел, изпращан
    от Канада, деклариран или не с произход от Канада,
    и за разширяване на обхвата на наложеното с
    Регламент (ЕО) № 599/2009 окончателно антидъмпингово
    мито по отношение на внос на биодизел в смес
    с тегловно съдържание на биодизел, по-малко
    или равно на 20 %, с произход от Съединените американски
    щати, както и за прекратяване на разследването
    по отношение на вноса, изпращан от Сингапур
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 444/2011 ze dne 5. května 2011
    , kterým se konečné antidumpingové clo uložené nařízením Rady (ES) č.
    599/2009 na dovoz bionafty pocházející ze Spojených států amerických rozšiřuje
    na dovoz bionafty zasílané z Kanady, bez ohledu na to, zda je u ní deklarován
    původ z Kanady, kterým se konečné antidumpingové clo uložené nařízením
    (ES) č. 599/2009 rozšířuje na dovoz bionafty ve formě směsi obsahující
    20 % hmotnostních nebo méně bionafty pocházející ze Spojených států amerických
    a kterým se ukončuje šetření týkající se dovozu bionafty zasílané ze
    Singapuru
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 444/2011 af 5. maj 2011 om udvidelse
    af den endelige antidumpingtold, der blev indført ved forordning (EF) nr. 599/2009
    på importen af biodiesel med oprindelse i Amerikas Forenede Stater, til importen
    af biodiesel afsendt fra Canada, uanset om den er angivet med oprindelse i Canada,
    om udvidelse af den endelige antidumpingtold, der blev indført ved forordning
    (EF) nr. 599/2009, til importen af biodiesel i blandinger indeholdende 20 vægtprocent
    eller mindre biodiesel med oprindelse i Amerikas Forenede Stater og om afslutning
    af undersøgelsen vedrørende import afsendt fra Singapore
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 444/2011
    του Συμβουλίου, της 5ης Μαΐου 2011 , για την επέκταση
    του οριστικού δασμού αντιντάμπινγκ που επιβλήθηκε
    με τον κανονισμό (ΕΚ) αριθ. 599/2009 στις εισαγωγές
    βιοντίζελ καταγωγής Ηνωμένων Πολιτειών της
    Αμερικής στις εισαγωγές βιοντίζελ που αποστέλλονται
    από τον Καναδά, είτε δηλώνονται ως καταγωγής
    Καναδά είτε όχι, και για την επέκταση του οριστικού
    δασμού αντιντάμπινγκ που επιβλήθηκε με τον
    κανονισμό (ΕΚ) αριθ. 599/2009 στις εισαγωγές βιοντίζελ
    σε μορφή μείγματος με περιεκτικότητα κατά
    βάρος που δεν υπερβαίνει το 20 % βιοντίζελ καταγωγής
    Ηνωμένων Πολιτειών της Αμερικής, και για την
    περάτωση της έρευνας όσον αφορά τις εισαγωγές
    που αποστέλλονται από τη Σιγκαπούρη
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusmäärus (EL) nr 444/2011, 5. mai 2011 , millega laiendatakse
    määrusega (EÜ) nr 599/2009 Ameerika Ühendriikidest pärit biodiislikütuse
    impordi suhtes kehtestatud lõplikku dumpinguvastast tollimaksu Kanadast lähetatud
    biodiislikütuse impordile olenemata sellest, kas kõnealune biodiislikütus deklareeritakse
    Kanadast pärinevana või mitte, ja millega laiendatakse määrusega (EÜ) nr
    599/2009 kehtestatud lõplikku dumpinguvastast tollimaksu Ameerika Ühendriikidest
    pärit 20 või vähem massiprotsenti biodiislikütust sisaldava segatud biodiislikütuse
    impordile ning millega lõpetatakse Singapurist lähetatud importi käsitlev uurimine
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 444/2011, annettu 5 päivänä
    toukokuuta 2011 , Amerikan yhdysvalloista peräisin olevan biodieselin tuonnissa
    asetuksella (EY) N:o 599/2009 käyttöön otetun lopullisen polkumyyntitullin
    laajentamisesta koskemaan Kanadasta lähetetyn biodieselin tuontia riippumatta
    siitä, onko alkuperämaaksi ilmoitettu Kanada, ja Amerikan yhdysvalloista peräisin
    olevan biodieselin tuonnissa asetuksella (EY) N:o 599/2009 käyttöön otetun
    lopullisen polkumyyntitullin laajentamisesta koskemaan sellaisen biodieselseoksen
    tuontia, jossa on enintään 20 painoprosenttia biodieseliä, ja tutkimuksen päättämisestä
    Singaporesta lähetetyn tuonnin osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Vijeća (EU) br. 444/2011 od 5. svibnja 2011. o proširenju
    konačne antidampinške pristojbe uvedene Uredbom (EZ) br. 599/2009 o uvozu biodizela
    podrijetlom iz Sjedinjenih Američkih Država na uvoz biodizela poslanog iz Kanade,
    bez obzira na to ima li deklarirano podrijetlo iz Kanade ili ne, i o proširenju
    konačne antidampinške pristojbe uvedene Uredbom (EZ) br. 599/2009 na uvoz biodizela
    u mješavini s masenim udjelom biodizela od 20 % ili manjim, podrijetlom iz Sjedinjenih
    Američkih Država, te o prekidu ispitnog postupka u vezi s uvozom poslanim iz
    Singapura
  type: main
- language: hu
  script: Latn
  content: A Tanács 444/2011/EU végrehajtási rendelete ( 2011. május 5. ) az 599/2009/EK
    rendelettel kivetett, az Egyesült Államokból származó biodízel behozatalára
    vonatkozó végleges dömpingellenes vámnak a Kanadában feladott biodízel behozatalára
    – függetlenül attól, hogy Kanadából származóként jelentették-e be –
    történő kiterjesztéséről, az 599/2009/EK rendelettel kivetett végleges
    dömpingellenes vámnak az Egyesült Államokból származó, legfeljebb 20 tömegszázalék
    biodízelt tartalmazó keverékben előforduló biodízel behozatalára történő
    kiterjesztéséről, valamint a Szingapúrban feladott behozatalokra vonatkozó
    vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 444/2011 del Consiglio, del 5 maggio
    2011 , che estende il dazio antidumping definitivo istituito dal regolamento (CE)
    n. 599/2009 sulle importazioni di biodiesel originario degli Stati Uniti d’America
    alle importazioni di biodiesel spedito dal Canada, indipendentemente dal fatto
    che sia dichiarato originario del Canada o no, e che estende il dazio antidumping
    definitivo istituito dal regolamento (CE) n. 599/2009 alle importazioni di biodiesel
    in miscela contenente in peso il 20 % o meno di biodiesel originario degli Stati
    Uniti d’America, e chiude l’inchiesta riguardante le importazioni spedite
    da Singapore
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 444/2011 ( 2011. gada 5. maijs ),
    ar ko galīgo antidempinga maksājumu, kurš ar Regulu (EK) Nr. 599/2009 noteikts
    Amerikas Savienoto Valstu izcelsmes biodīzeļdegvielas importam, piemēro arī
    biodīzeļdegvielas importam, kas sūtīts no Kanādas un kam ir vai nav deklarēta
    izcelsme Kanādā, ar ko importētai biodīzeļdegvielai maisījumā, kurā Amerikas
    Savienoto Valstu izcelsmes biodīzeļdegvielas saturs nepārsniedz 20 masas %,
    piemēro arī galīgo antidempinga maksājumu, kas noteikts ar Regulu (EK) Nr.
    599/2009, un ar ko izbeidz izmeklēšanu par importu, kas sūtīts no Singapūras
  type: main
- language: lt
  script: Latn
  content: 2011 m. gegužės 5 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 444/2011,
    kuriuo galutinio antidempingo muito, nustatyto Reglamentu (EB) Nr. 599/2009 importuojamam
    Jungtinių Amerikos Valstijų kilmės biodyzelinui, taikymas išplečiamas iš
    Kanados siunčiamam importuojamam biodyzelinui, deklaruotam kaip Kanados kilmės
    arba ne, galutinio antidempingo muito, nustatyto Reglamentu (EB) Nr. 599/2009,
    taikymas išplečiamas importuojamiems biodyzelino mišiniams, kuriuose Jungtinių
    Amerikos Valstijų kilmės biodyzelinas sudaro 20 % arba mažiau masės, ir baigiamas
    tyrimas dėl iš Singapūro siunčiamo importuojamo biodyzelino
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 444/2011 tal- 5
    ta’ Mejju 2011 li jestendi d-dazju anti-dumping definittiv impost mir-Regolament
    (KE) Nru 599/2009 fuq l-importazzjonijiet tal-bijodiżil li joriġinaw mill-Istati
    Uniti tal-Amerika għall-importazzjonijiet tal-bijodiżil ikkunsinnati mill-Kanada,
    kemm jekk iddikjarat li joriġinaw mill-Kanada, kif ukoll jekk le, u li jestendi
    d-dazju anti-dumping definittiv impost mir-Regolament (KE) Nru 599/2009 fuq l-
    importazzjonijiet tal-bijodiżil f’taħlita li fiha bil-piż 20 % jew inqas
    ta’ bijodiżil li joriġina mill-Istati Uniti tal-Amerika, u li jtemm l-investigazzjoni
    fir-rigward tal-importazzjonijiet ikkunsinnati minn Singapor
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 444/2011 van de Raad van 5 mei 2011 tot
    uitbreiding van het definitieve antidumpingrecht dat bij Verordening (EG) nr.
    599/2009 is ingesteld op biodiesel van oorsprong uit de Verenigde Staten van Amerika
    tot vanuit Canada verzonden biodiesel, al dan niet aangegeven als van oorsprong
    uit Canada, en tot uitbreiding van het definitieve antidumpingrecht dat bij Verordening
    (EG) nr. 599/2009 is ingesteld tot biodiesel in mengsels bevattende 20 of minder
    gewichtsprocenten biodiesel van oorsprong uit de Verenigde Staten van Amerika,
    en tot beëindiging van het onderzoek naar de vanuit Singapore verzonden biodiesel
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 444/2011 z dnia 5 maja 2011 r.
    rozszerzające ostateczne cło antydumpingowe nałożone rozporządzeniem (WE)
    nr 599/2009 na przywóz biodiesla pochodzącego ze Stanów Zjednoczonych Ameryki,
    na przywóz biodiesla wysyłanego z Kanady, zgłoszonego lub niezgłoszonego jako
    pochodzący z Kanady, oraz rozszerzające ostateczne cło antydumpingowe nałożone
    rozporządzeniem (WE) nr 599/2009 na przywóz biodiesla w postaci mieszanki zawierającej
    wagowo maksymalnie 20 % biodiesla pochodzącego ze Stanów Zjednoczonych Ameryki,
    oraz kończące dochodzenie w odniesieniu do przywozu wysyłanego z Singapuru
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 444/2011 do Conselho, de 5 de Maio
    de 2011 , que torna extensivo o direito anti-dumping definitivo instituído pelo
    Regulamento (CE) n. ° 599/2009 sobre as importações de biodiesel originário
    dos Estados Unidos da América às importações de biodiesel expedido do Canadá,
    quer seja ou não declarado originário do Canadá, e que torna extensivo o direito
    anti-dumping definitivo instituído pelo Regulamento (CE) n. ° 599/2009 sobre
    as importações de biodiesel numa mistura que contenha, em peso, 20 % ou menos
    de biodiesel originário dos Estados Unidos da América, e que encerra o inquérito
    no que diz respeito às importações expedidas de Singapura
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 444/2011 al Consiliului din
    5 mai 2011 de extindere a aplicării taxei antidumping definitive instituite de
    Regulamentul (CE) nr. 599/2009 asupra importurilor de biomotorină originare din
    Statele Unite ale Americii la importurile de biomotorină expediate din Canada,
    indiferent dacă au fost sau nu declarate ca fiind originare din Canada, și de
    extindere a aplicării taxei antidumping definitive instituite de Regulamentul
    (CE) nr. 599/2009 la importurile de biomotorină în amestec cu un conținut în
    greutate de maximum 20 % de biomotorină originară din Statele Unite ale Americii
    și de încheiere a anchetei privind importurile expediate din Singapore
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 444/2011 z 5. mája 2011 , ktorým
    sa rozširuje konečné antidumpingové clo uložené nariadením (ES) č. 599/2009
    na dovoz bionafty s pôvodom v Spojených štátoch amerických na dovoz bionafty
    odosielanej z Kanady bez ohľadu na to, či má, alebo nemá deklarovaný pôvod
    v Kanade, a ktorým sa rozširuje konečné antidumpingové clo uložené nariadením
    (ES) č. 599/2009 na dovoz bionafty v podobe zmesi s obsahom najviac 20 % hmotnosti
    bionafty s pôvodom v Spojených štátoch amerických a ktorým sa ukončuje
    prešetrovanie týkajúce sa dovozu odosielaného zo Singapuru
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Sveta (EU) št. 444/2011 z dne 5. maja 2011 o razširitvi
    dokončne protidampinške dajatve, uvedene z Uredbo (ES) št. 599/2009 za uvoz
    biodizla s poreklom iz Združenih držav Amerike, na uvoz biodizla, poslanega
    iz Kanade, ne glede na to, ali je deklariran s poreklom iz Kanade ali ne, in o
    razširitvi dokončne protidampinške dajatve, uvedene z Uredbo (ES) št. 599/2009
    na uvoz biodizla v mešanici z vsebnostjo 20 mas. % ali manj biodizla s poreklom
    iz Združenih držav Amerike, in o zaključku preiskave v zvezi z uvozom, poslanim
    iz Singapurja
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 444/2011 del Consejo, de 5 de mayo de
    2011 , que amplía a las importaciones de biodiésel expedido desde Canadá, esté
    o no declarado como originario de Canadá, el derecho antidumping definitivo impuesto
    por el Reglamento (CE) n ° 599/2009 a las importaciones de biodiésel originario
    de los Estados Unidos de América, amplía el derecho antidumping definitivo impuesto
    por el Reglamento (CE) n ° 599/2009 a las importaciones de biodiésel en mezclas
    con un contenido igual o inferior al 20 % en peso de biodiésel originario de
    los Estados Unidos de América, y da por concluida la investigación sobre las
    importaciones expedido desde Singapur
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 444/2011 av den 5 maj 2011 om
    utvidgning av den slutgiltiga antidumpningstull som genom förordning (EG) nr
    599/2009 infördes på import av biodiesel med ursprung i Amerikas förenta stater
    till att omfatta import av biodiesel som avsänts från Kanada, oavsett om dess
    deklarerade ursprung är Kanada eller inte, om utvidgning av den slutgiltiga antidumpningstull
    som infördes genom förordning (EG) nr 599/2009 till att omfatta import av biodiesel
    i en blandning innehållande högst 20 viktprocent biodiesel med ursprung i Amerikas
    förenta stater, och om avslutande av undersökningen rörande import som avsänts
    från Republiken Singapore
  type: main
