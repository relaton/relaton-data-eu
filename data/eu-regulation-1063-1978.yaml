title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1063/78 of 22 May 1978 re-establishing the
    levying of customs duties on cotton yarn, put up for retail sale, falling within
    heading No 55.06 and originating in Argentina and Brazil, to which the preferential
    tariff arrangement set out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1063/78 de la Commission, du 22 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton, conditionnés pour la vente au détail, de la position tarifaire 55.06,
    originaires d'Argentine et du Brésil, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1063/78 der Kommission vom 22. Mai 1978 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, in Aufmachungen für den
    Einzelverkauf, der Tarifnummer 55.06, mit Ursprung in Argentinien und Brasilien,
    denen die in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1063/78 af 22. maj 1978 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger,
    under position 55.06, som har oprindelse i Argentina og Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1063/78 della Commissione, del 22 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone preparati
    per la vendita al minuto, della voce doganale 55.06, originari dell'Argentina
    e del Brasile, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1063/78 van de Commissie van 22 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    Argentinië en Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2706/77 van de Raad
  type: main
