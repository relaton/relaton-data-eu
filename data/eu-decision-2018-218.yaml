  content: Commission Implementing Decision (EU) 2018/218 of 13 February 2018 amending
    Annex II to Decision 92/260/EEC as regards temporary admission of registered horses
    from certain parts of China, amending Decision 93/195/EEC as regards animal health
    and veterinary certification conditions for the re-entry of registered horses
    for racing, competition and cultural events after temporary export to China, Mexico
    and the United States of America, and amending Annex I to Decision 2004/211/EC
    as regards the entries for China, Mexico and Turkey in the list of third countries
    and parts thereof from which imports into the Union of live equidae and semen,
    ova and embryos of the equine species are authorised (notified under document
    C(2018) 713)
