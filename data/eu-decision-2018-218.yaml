    veterinaria necesarias para la reintroducción de caballos registrados para participar
    en carreras, concursos hípicos y actos culturales, después de su exportación
    temporal a China, los Estados Unidos de América o México, y el anexo I de la
    Decisión 2004/211/CE en lo relativo a las entradas correspondientes a China,
    México y Turquía en la lista de terceros países y partes de su territorio desde
    los que se autoriza la importación en la Unión de équidos vivos y esperma,
    óvulos y embriones de la especie equina [notificada con el número C(2018) 713]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/218 av den 13 februari 2018
    om ändring av bilaga II till beslut 92/260/EEG vad gäller tillfällig införsel
    av registrerade hästar från vissa delar av Kina, ändring av beslut 93/195/EEG
    vad gäller djurhälsovillkor och villkor för utfärdande av veterinärintyg
    för återinförsel av hästar som registrerats för kapplöpningar, tävlingar
    och kulturevenemang efter tillfällig export till Kina, Mexiko och Amerikas förenta
    stater, och om ändring av bilaga I till beslut 2004/211/EG vad gäller posterna
    för Kina, Mexiko och Turkiet i förteckningen över tredjeländer och delar av
    tredjeländer från vilka import till unionen av levande hästdjur och sperma,
    ägg och embryon från hästdjur är tillåten [delgivet med nr C (2018) 713]
  type: main
