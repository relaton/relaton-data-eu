title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1818/79 of 16 August 1979 re-establishing the
    levying of customs duties on nails, tacks, staples, hook-nails, corrugated nails,
    spiked cramps, studs, spikes and drawing pins of iron or steel, etc., falling
    within heading No 73.31 and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1818/79 de la Commission, du 16 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux pointes,
    clous, crampons appointés, agrafes ondulées et biseautées, pitons, crochets
    et punaises, en fonte, fer ou acier, etc., de la position 73.31 du tarif douanier
    commun, originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1818/79 der Kommission vom 17. August 1979 zur Wiedereinführung
    des Zollsatzes für Stifte, Nägel, zugespitzte Krampen, gewellte und abgeschrägte
    Klammern, Ringnägel, Haken und Reißnägel, aus Eisen oder Stahl, usw., der Tarifnummer
    73.31, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1818/79 af 16. august 1979 om genindførelse
    af toldafgifter for søm, spiger, stifter, bølgesøm, tegnestifter, hager og
    kramper, af jern og stål, etc., under pos. 73.31, som har oprindelse i Rumænien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1818/79 della Commissione, del 17 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili a punte, chiodi, rampini,
    graffette ondulate e smussate, chiodi ad occhio, ganci e puntine da disegno, di
    ghisa, di ferro o di acciaio, ecc., della voce 73.31 della tariffa doganale comune,
    originari della Romania beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1818/79 van de Commissie van 16 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op draadnagels,
    spijkers, aangepunte krammen, afgeschuinde gegolfde krambanden, oognagels, duimen
    en dergelijke aangepunte haken en punaises, van gietijzer, enz., van post 73.31,
    van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
