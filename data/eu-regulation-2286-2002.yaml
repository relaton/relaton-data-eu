    i Pacyfiku (państw AKP) i uchylające rozporządzenie (WE) nr 1706/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2286/2002 do Conselho, de 10 de Dezembro de 2002,
