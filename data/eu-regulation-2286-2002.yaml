title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2286/2002 of 10 December 2002 on the arrangements
    applicable to agricultural products and goods resulting from the processing of
    agricultural products originating in the African, Caribbean and Pacific States
    (ACP States) and repealing Regulation (EC) No 1706/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2286/2002 du Conseil du 10 décembre 2002 fixant le
    régime applicable aux produits agricoles et aux marchandises résultant de leur
    transformation, originaires des États d'Afrique, des Caraïbes et du Pacifique
    (États ACP) et abrogeant le règlement (CE) n° 1706/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2286/2002 des Rates vom 10. Dezember 2002 über die
    Regelung für landwirtschaftliche Erzeugnisse und daraus hergestellte Waren mit
    Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean
    (AKP-Staaten) und zur Aufhebung der Verordnung (EG) Nr. 1706/98
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2286/2002 на Съвета от 10 декември
