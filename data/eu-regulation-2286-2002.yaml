    в резултат на обработката на селскостопански
    продукти с произход от държавите от Африка,
    Карибите и Тихоокеанския басейн (държавите
    от АКТБ) и за отмяна на Регламент (ЕО) № 1706/98
  type: main
- language: cs
  script: Latn
