    pocházející z afrických, karibských a tichomořských států (státy AKT)
    a kterým se zrušuje nařízení (ES) č. 1706/98
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2286/2002 af 10. december 2002 om ordninger
