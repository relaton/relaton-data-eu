    da sua transformação originários dos Estados da África, das Caraíbas e do
    Pacífico Estados (ACP) e que revoga o Regulamento (CE) n.° 1706/98
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2286/2002 al Consiliului din 10 decembrie 2002 de
    stabilire a regimului aplicabil produselor agricole și mărfurilor rezultate
    din transformarea acestora, originare din Țările din Africa, zona Caraibelor
    și Pacific (ACP) și de abrogare a Regulamentului (CE) nr. 1706/98
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2286/2002 z 10. decembra 2002 o postupoch uplatniteľných
