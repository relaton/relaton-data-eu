  content: Règlement n° 842/67/CEE de la Commission, du 16 novembre 1967, modifiant
    le libellé du règlement n° 469/67/CEE au sujet des offres concernant un produit
    en sacs, retenues pour la détermination des prix CAF du riz et des brisures
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 842/67/EWG der Kommission vom 14. November 1967 zur Änderung
    der Fassung der Verordnung Nr. 469/67/EWG in bezug auf die Angebote für ein Erzeugnis
    in Säcken zur Bestimmung der cif-Preise für Reis und Bruchreis
  type: main
- language: it
  script: Latn
  content: Regolamento n. 842/67/CEE della Commissione, del 14 novembre 1967, che
    modifica la redazione del regolamento n. 469/67/CEE per quanto riguarda le offerte
    di un prodotto in sacchi, prese in considerazione per la determinazione dei prezzi
    cif del riso e delle rotture di riso
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 842/67/EEG van de Commissie van 14 november 1967 houdende
    wijziging van de tekst van Verordening Nr. 469/67/EEG met betrekking tot aanbiedingen
    van een produkt in zakken die dienen voor de bepaling van de c.i.f.-prijzen voor
    rijst en breukrijst
  type: main
