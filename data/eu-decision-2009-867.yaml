title:
- language: en
  script: Latn
  content: '2009/867/EC: Commission Decision of 30 November 2009 granting certain
    parties an exemption from the extension to certain bicycle parts of the anti-dumping
    duty on bicycles originating in the People’s Republic of China imposed by Council
    Regulation (EEC) No 2474/93, last maintained and amended by Regulation (EC) No
    1095/2005, and lifting the suspension of the payment of the anti-dumping duty
    extended to certain bicycle parts originating in the People’s Republic of China
    granted to certain parties pursuant to Commission Regulation (EC) No 88/97 (notified
    under document C(2009) 9406)'
  type: main
- language: fr
  script: Latn
  content: '2009/867/CE: Décision de la Commission du 30 novembre 2009 exemptant
    certaines parties de l’extension, à certaines parties de bicyclettes, du droit
    antidumping institué par le règlement (CEE) n o 2474/93 du Conseil sur les bicyclettes
    originaires de la République populaire de Chine, maintenu et modifié en dernier
    lieu par le règlement (CE) n o 1095/2005, et levant la suspension du paiement
    du droit antidumping étendu à certaines parties de bicyclettes originaires de
    la République populaire de Chine accordée à certaines parties en vertu du règlement
    (CE) n o 88/97 de la Commission [notifiée sous le numéro C(2009) 9406]'
  type: main
- language: de
  script: Latn
  content: '2009/867/EG: Entscheidung der Kommission vom 30. November 2009 zur Befreiung
    bestimmter Parteien von der Ausweitung des Antidumpingzolls auf Fahrräder mit
    Ursprung in der Volksrepublik China, der mit der Verordnung (EWG) Nr. 2474/93
    des Rates eingeführt und zuletzt mit der Verordnung (EG) Nr. 1095/2005 aufrechterhalten
    und geändert wurde, auf bestimmte Fahrradteile und zur Aufhebung der Befreiung
    von der Entrichtung des auf bestimmte Fahrradteile mit Ursprung in der Volksrepublik
    China ausgeweiteten Antidumpingzolls, die bestimmten Parteien mit der Verordnung
    (EG) Nr. 88/97 der Kommission gewährt wurde (Bekannt gegeben unter Aktenzeichen
    K(2009) 9406)'
