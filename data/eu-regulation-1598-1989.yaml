  content: Commission Regulation (EEC) No 1598/89 of 8 June 1989 re-establishing the
    levying of customs duties on women's suits products of category No 74 (order No
    40.0740) originating in Brazil to which the preferential tariff arrangements of
    Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1598/89 de la Commission du 8 juin 1989 portant rétablissement
