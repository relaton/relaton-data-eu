title:
- language: en
  script: Latn
  content: '78/839/EEC: Commission Decision of 29 September 1978 authorizing Ireland
    not to apply Community treatment to table linen, toilet linen and kitchen linen,
    woven, other than cotton terry fabric, falling within subheading ex 62.02 B of
    the Common Customs Tariff (NIMEXE codes 62.02-41, 43, 47, 65, 73, 77), originating
    in Hong Kong and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/839/CEE: Décision de la Commission, du 29 septembre 1978, autorisant
    l'' Irlande à exclure du traitement communautaire le linge de table, linge de
    toilette, d'' office et de cuisine, tissé, autre que de coton bouclé du genre
    éponge, de la sous-position ex 62.02 B du tarif douanier commun (codes Nimexe:
    62.02-41; 43; 47; 65; 73; 77), originaires de Hong-kong et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/839/EWG: Entscheidung der Kommission vom 29. September 1978, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den úbrigen Mitgliedstaaten
    im freien Verkehr befindliche Tischwásche, Wásche zur Kórperpflege und andere
    Haushaltswásche, aus Geweben, andere als Wásche aus Frottiergeweben, der Tarifstelle
    ex 62.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.02-41; 43; 47; 65;
    73; 77) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/839/EØF: Kommissionens beslutning af 29. september 1978 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dækketøj, håndklæder,
    vaskeklude og viskestykker, vævede, ikke af frotterstof, som henhører under
    pos. ex 62.02 B i den fælles toldtarif, (NIMEXE-kode 62.02-41, 43, 47, 65, 73,
    77), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/839/CEE: Decisione della Commissione, del 29 settembre 1978, che autorizza
    l'' Irlanda ad escludere dal trattamento comunitario la biancheria da tavola,
    da toletta, da servizio o da cucina, tessuta, diversa da quella di cotone riccio
    di tipo spugna, della sottovoce ex 62.02 B della tariffa doganale comune (codice
    Nimexe 62.02-41; 43; 47; 65; 73; 77), originaria di Hong Kong e messa in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/839/EEG: Beschikking van de Commissie van 29 september 1978 waarbij
    Ierland wordt gemachtigd tafel- en huishoudlinnen, geweven, ander dan van katoenen
    bad- of frotteerstof, van post ex 62.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 62.02-41 ; 43 ; 47 ; 65 ; 73 ; 77), van oorsprong uit Hong-Kong en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
