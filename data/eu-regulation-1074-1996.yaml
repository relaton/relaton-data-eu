  script: Latn
  content: Council Regulation (EC) No 1074/96 of 10 June 1996 further amending Regulation
    (EEC) No 3905/88 as regards definitive anti-dumping duties on imports of polyester
    yarn originating in Taiwan and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1074/96 du Conseil du 10 juin 1996 modifiant le règlement
    (CEE) nº 3905/88 en ce qui concerne les droits antidumping définitifs sur les
    importations de fils de polyester originaires de T'ai- wan et de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1074/96 des Rates vom 10. Juni 1996 zur erneuten Änderung
    der Verordnung (EWG) Nr. 3905/88 hinsichtlich der Einführung eines endgültigen
    Antidumpingzolls auf die Einfuhren von Polyestergarn mit Ursprung in Taiwan und
    der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1074/96 af 10. juni 1996 om yderligere ændring
    af forordning (EØF) nr. 3905/88 for så vidt angår en endelig antidumpingtold
    på importen af garn af polyester med oprindelse i Taiwan og Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1074/96 του Συμβουλίου
    της 10ης Ιουνίου 1996 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3905/88, όσον αφορά την επιβολή
    οριστικών δασμών αντιντάμπινγκ στις εισαγωγές
    νημάτων από πολυεστέρες, καταγωγής Ταϊβάν
    και Τουρκίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1074/96, annettu 10 päivänä kesäkuuta 1996,
    asetuksen (ETY) N:o 3905/88 muuttamisesta uudelleen siltä osin kuin on kyse lopullisen
    polkumyyntitullin käyttöön ottamisesta Taiwanista ja Turkista peräisin olevan
    polyesterilangan tuonnissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1074/96 del Consiglio del 10 giugno 1996 che modifica
    il regolamento (CEE) n. 3905/88, relativamente a dei dazi antidumping definitivi
    sulle importazioni di filati di poliesteri originari di Taiwan e della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1074/96 van de Raad van 10 juni 1996 tot wijziging
    van Verordening (EEG) nr. 3905/88 betreffende de instelling van een definitief
    anti- dumpingrecht op de invoer van polyestergaren van oorsprong uit Taiwan en
    Turkije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1074/96 do Conselho de 10 de Junho de 1996 que altera
    o Regulamento (CEE) nº 3905/88 no que diz respeito aos direitos anti-dumping
    definitivos sobre as importações de fios de poliésteres originários de Taiwan
    e da Turquia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1074/96 del Consejo de 10 de junio de 1996 por el que
    se modifica nuevamente el Reglamento (CEE) nº 3905/88, y por el que se establece
    un derecho antidumping definitivo sobre las importaciones de hilados de poliéster
    originarios de Taiwán y Turquía
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1074/96 av den 10 juni 1996 om ytterligare
