    päättämisestä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/619 ón gCoimisiún an 12 Aibreán
    2022 lena bhfoirceanntar na hathbhreithnithe “onnmhaireora nua” i ndáil le
    Rialachán Cur Chun Feidhme (AE) 2017/2230 lena bhforchuirtear dleacht frithdhumpála
    chinntitheach ar allmhairí aigéid thríchlóraisicianúraigh de thionscnamh
    Dhaon-Phoblacht na Síne, ar athbhreithnithe iad maidir le trí tháirgeoir onnmhairiúcháin
    de chuid na Síne, agus lena bhforchuirtear an dleacht i ndáil le hallmhairí
    na dtairgeoirí sin agus lena bhfoirceanntar clárú na n-allmhairí sin
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/619 оd 12. travnja 2022. o završetku
    revizija Provedbene uredbe (EU) 2017/2230 o uvođenju konačne antidampinške
    pristojbe na uvoz trikloroizocijanurne kiseline podrijetlom iz Narodne Republike
    Kine za tri kineska proizvođača izvoznika (revizije „novog izvoznika”),
    kojom se uvodi pristojba na uvoz od tih proizvođača i završava evidentiranje
    tog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/619 végrehajtási rendelete (2022. április 12.)
    a Kínai Népköztársaságból származó triklór-izocianursav behozatalára
    vonatkozó végleges dömpingellenes vám kivetéséről szóló (EU) 2017/2230
    végrehajtási rendelet három kínai exportáló gyártó tekintetében indított,
    új exportőrre vonatkozó felülvizsgálatainak megszüntetéséről, a vámnak
    az érintett gyártóktól érkező behozatalra történő kivetéséről, valamint
    az érintett behozatalok nyilvántartásba vételének megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/619 della Commissione del 12 aprile
    2022 che chiude i riesami relativi ai «nuovi esportatori» del regolamento di
    esecuzione (UE) 2017/2230 che istituisce un dazio antidumping definitivo sulle
    importazioni di acido tricloroisocianurico originario della Repubblica popolare
    cinese per tre produttori esportatori cinesi, istituisce il dazio sulle importazioni
    di tali produttori e pone termine alla registrazione di dette importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/619 (2022. gada 12. aprīlis),
    ar kuru attiecībā uz trim Ķīnas ražotājiem eksportētājiem tiek izbeigtas
    Īstenošanas regulas (ES) 2017/2230, ar ko nosaka galīgo antidempinga maksājumu
    Ķīnas Tautas Republikas izcelsmes trihlorizocianūrskābes importam, pārskatīšanas
    sakarā ar jaunu eksportētāju, tiek noteikts maksājums šo ražotāju veiktajam
    importam un tiek izbeigta šāda importa reģistrācija
  type: main
- language: lt
  script: Latn
