    u li jtemm ir-reġistrazzjoni ta’ dawn l-importazzjonijiet
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/619 van de Commissie van 12 april 2022
    tot beëindiging van de nieuwe onderzoeken ten behoeve van een nieuwe exporteur
    ten aanzien van Uitvoeringsverordening (EU) 2017/2230 tot instelling van een definitief
    antidumpingrecht op trichloorisocyanuurzuur van oorsprong uit de Volksrepubliek
    China voor drie Chinese producenten-exporteurs, tot instelling van het recht met
    betrekking tot de invoer van die producenten en tot beëindiging van de registratie
    van die invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/619 z dnia 12 kwietnia 2022
    r. kończące przeglądy pod kątem nowego eksportera dotyczące rozporządzenia
    wykonawczego (UE) 2017/2230 nakładającego ostateczne cło antydumpingowe na
    przywóz kwasu trichloroizocyjanurowego z Chińskiej Republiki Ludowej w odniesieniu
    do trzech chińskich producentów eksportujących, nakładające cło w odniesieniu
    do przywozu od tych producentów oraz kończące rejestrację tego przywozu
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/619 da Comissão de 12 de abril de
    2022 que encerra os reexames, relativos a um «novo exportador», do Regulamento
    de Execução (UE) 2017/2230 que institui um direito anti-dumping definitivo sobre
    as importações de ácido tricloro-isocianúrico originário da República Popular
    da China no que diz respeito a três produtores-exportadores chineses, que institui
    o direito no que respeita às importações desses produtores e que encerra o
    registo dessas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/619 al Comisiei din 12 aprilie
    2022 de încheiere a reexaminărilor în ceea ce privește un nou exportator ale
    Regulamentului de punere în aplicare (UE) 2017/2230 de instituire a unei taxe
    antidumping definitive la importurile de acid tricloroizocianuric originar din
    Republica Populară Chineză pentru trei producători-exportatori chinezi, de
    instituire a taxei în ceea ce privește importurile produselor acestor producători
    și de încetare a înregistrării acestor importuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/619 z 12. apríla 2022, ktorým
    sa ukončujú revízne prešetrovania týkajúce sa „nového vývozcu“ v súvislosti
    s vykonávacím nariadením (EÚ) 2017/2230, ktorým sa ukladá konečné antidumpingové
    clo na dovoz kyseliny trichlórizokyanurovej s pôvodom v Čínskej ľudovej republike,
    v prípade troch čínskych vyvážajúcich výrobcov, ukladá clo na dovoz od
    týchto výrobcov a ukončuje registrácia tohto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/619 z dne 12. aprila 2022 o zaključku
    pregledov v zvezi z „novim izvoznikom“ v okviru Izvedbene uredbe (EU) 2017/2230
    o uvedbi dokončne protidampinške dajatve na uvoz triklorizocianurne kisline
    s poreklom iz Ljudske republike Kitajske za tri kitajske proizvajalce izvoznike,
    uvedbi dajatve na uvoz teh proizvajalcev in prenehanju registracije tega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/619 de la Comisión de 12 de abril de
    2022 por el que se dan por concluidas las reconsideraciones con respecto a un
    «nuevo exportador» del Reglamento de Ejecución (UE) 2017/2230, por el que se
    establece un derecho antidumping definitivo sobre las importaciones de ácido
    tricloroisocianúrico originario de la República Popular China, con respecto
    a tres productores exportadores chinos, por el que se establece el derecho aplicable
    a las importaciones de esos productores exportadores y se da por concluido el
    registro de dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/619 av den 12 april 2022
    om avslutande av översynen, avseende ny exportör, av genomförandeförordning
    (EU) 2017/2230 om införande av en slutgiltig antidumpningstull på import av
    triklorisocyanursyra med ursprung i Folkrepubliken Kina avseende tre kinesiska
    exporterande tillverkare, samt om införande av tullen på import från dessa
    tillverkare och om avslutande av registreringen av denna import
  type: main
