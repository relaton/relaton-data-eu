id: EURegulation2022619
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/619 of 12 April 2022 terminating
    the ‘new exporter’ reviews of Implementing Regulation (EU) 2017/2230 imposing
    a definitive anti-dumping duty on imports of trichloroisocyanuric acid originating
    in the People’s Republic of China, for three Chinese exporting producers, imposing
    the duty with regard to these producers’ imports and terminating the registration
    of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/619 de la Commission du 12 avril 2022
    clôturant les réexamens au titre de «nouvel exportateur» du règlement d’exécution
    (UE) 2017/2230 instituant un droit antidumping définitif sur les importations
    d’acide trichloro-isocyanurique originaire de la République populaire de Chine
    pour trois producteurs-exportateurs chinois, instituant le droit en ce qui concerne
    les importations provenant de ces producteurs et mettant fin à l’enregistrement
    de ces importations
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/619 der Kommission vom 12. April 2022
    zur Einstellung der Neuausführerüberprüfungen der Durchführungsverordnung
    (EU) 2017/2230 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren
    von Trichlorisocyanursäure mit Ursprung in der Volksrepublik China für drei
    chinesische ausführende Hersteller, zur Einführung des Zolls auf die von diesen
    Herstellern stammenden Einfuhren und zur Einstellung der zollamtlichen Erfassung
    dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/619 на Комисията
    от 12 април 2022 година за прекратяване на прегледите
    във връзка с нов износител на Регламент за
    изпълнение (ЕС) 2017/2230 за налагане на окончателно
    антидъмпингово мито върху вноса на трихлороизоцианопикочна
    киселина с произход от Китайската народна
    република за трима китайски производители
    износители, за налагане на митото по отношение
    на вноса от посочените производители и за прекратяване
    на регистрационния режим за посочения внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/619 ze dne 12. dubna 2022, kterým
    se zastavují přezkumy pro „nového vývozce“ týkající se prováděcího
    nařízení (EU) 2017/2230 o uložení konečného antidumpingového cla z dovozu
    kyseliny trichlorisokyanurové pocházející z Čínské lidové republiky, pokud
    jde o tři čínské vyvážející výrobce, ukládá clo na dovoz těchto výrobců
    a ukončuje celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/619 af 12. april 2022
    om afslutning af de fornyede undersøgelser (ny eksportør) af Kommissionens gennemførelsesforordning
    (EU) 2017/2230 om indførelse af en endelig antidumpingtold på importen af trichlorisocyanursyre
