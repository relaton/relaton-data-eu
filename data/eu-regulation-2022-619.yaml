  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/619 tat-12
    ta’ April 2022 li jtemm rieżamijiet ta’ “esportatur ġdid” tar-Regolament
    ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/2230 li jimponi dazju antidumping
    definittiv fuq l-importazzjonijiet ta’ aċidu triklorojsoċjanuriku li joriġina
    mir-Repubblika tal-Poplu taċ-Ċina, għal tliet produtturi esportaturi Ċiniżi,
