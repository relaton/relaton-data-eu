title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2389 of 28 October 2026 amending
    Implementing Regulations (EU) 2016/1239, (EU) 2020/761, (EU) 2020/1988 and (EU)
    2025/1272 to allow issuing authorities of third countries to use ELAN on a voluntary
    basis during the transitional period
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2389 de la Commission du 28 octobre
    2026 modifiant les règlements d’exécution (UE) 2016/1239, (UE) 2020/761, (UE)
    2020/1988 et (UE) 2025/1272 afin de permettre aux autorités de délivrance des
    pays tiers d’utiliser ELAN sur la base du volontariat pendant la période transitoire
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/2389 der Kommission vom 28. Oktober
    2026 zur Änderung der Durchführungsverordnungen (EU) 2016/1239, (EU) 2020/761,
    (EU) 2020/1988 und (EU) 2025/1272, um erteilenden Behörden von Drittländern
    die freiwillige Nutzung des ELAN während des Übergangszeitraums zu ermöglichen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/2389 на Комисията
    от 28 октомври 2026 година за изменение на регламенти
    за изпълнение (ЕС) 2016/1239, (ЕС) 2020/761, (ЕС) 2020/1988
    и (ЕС) 2025/1272 с цел да се позволи на издаващите
    органи на трети държави да използват доброволно
    електронната система за немитнически формалности,
    свързани със селскостопанските продукти (ELAN)
    по време на преходния период
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/2389 ze dne 28. října 2026,
    kterým se mění prováděcí nařízení (EU) 2016/1239, (EU) 2020/761, (EU)
    2020/1988 a (EU) 2025/1272, aby bylo vydávajícím orgánům třetích zemí
    umožněno dobrovolně používat systém ELAN během přechodného období
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/2389 af 28. oktober 2026
    om ændring af gennemførelsesforordning (EU) 2016/1239, (EU) 2020/761, (EU) 2020/1988
    og (EU) 2025/1272 for at gøre det muligt for udstedende myndigheder i tredjelande
    at anvende ELAN på frivillig basis i overgangsperioden
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/2389 της Επιτροπής,
