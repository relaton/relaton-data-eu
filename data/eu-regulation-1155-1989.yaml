  content: Commission Regulation (EEC) No 1155/89 of 28 April 1989 laying down the
    level of the accession compensatory amounts for milk and milk products applicable
    for the 1989/90 milk year in trade with Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1155/89 de la Commission, du 28 avril 1989, arrêtant
    dans le secteur du lait et des produits laitiers le niveau des montants compensatoires
    «adhésion» dans les échanges avec l'Espagne applicables lors de la campagne
    laitière 1989/1990
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1155/89 der Kommission vom 28. April 1989 zur Festsetzung
    der Beitrittsausgleichsbeträge für Milch und Milcherzeugnisse im Handel mit
    Spanien für das Wirtschaftsjahr 1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1155/89 af 28. april 1989 om fastsættelse
    af tiltrædelsesudligningsbeløbene for mælk og mejeriprodukter i samhandelen
    med Spanien for mejeriåret 1989/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1155/89 της Επιτροπής
    της 28ης Απριλίου 1989 με τον οποίο αποφασίζεται,
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, το ύψος εξισωτικών ποσών προσχώρησης
    στις εμπορικές συναλλαγές με την Ισπανία που
    εφαρμόζονται κατά τη γαλακτοκομική περίοδο
    1989/90
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1155/89 della Commissione, del 28 aprile 1989, che
    fissa, nel settore del latte e dei prodotti lattiero-caseari, il livello degli
    importi compensativi adesione negli scambi con la Spagna applicabili nella campagna
    lattiera 1989/1990
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1155/89 van de Commissie van 28 april 1989 tot vaststelling
    in de sector melk en zuivelprodukten van het niveau van de in het melkprijsjaar
    1989/1990 toe te passen compenserende bedragen toetreding in het handelsverkeer
    met Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1155/89 da Comissão, de 28 de Abril de 1989, que
    adopta, no sector do leite e dos productos lácteos, o nível dos montantes compensatórios
    de adesão nas trocas comerciais com a Espanha aplicáveis durante a campanha
    leiteira de 1989/1990
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1155/89 de la Comisión, de 28 de abril de 1989, por
    el que se adopta en el sector de la leche y de los productos lácteos el nivel
    de los montantes compensatorios de adhesión en los intercambios con España,
    con motivo de la campaña lechera 1989/90
