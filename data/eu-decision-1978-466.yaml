title:
- language: en
  script: Latn
  content: Commission Decision of 11 May 1978 authorizing the United Kingdom not to
    apply Community treatment to linen tea towels falling within heading No ex 62.02
    of the Common Customs Tariff, originating in Czechoslovakia and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/466/CEE: Décision de la Commission, du 11 mai 1978, autorisant le
    Royaume-Uni à exclure du traitement communautaire les serviettes de cuisine en
    lin, de la position Ex 62.02 du Tarif douanier commun, originaires de Tchécoslovaquie
    et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. Mai 1978, mit der das Vereinigte Königreich
    ermächtigt wird, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Küchenhandtücher aus Flachs der Tarifnummer ex
    62.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. maj 1978 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage viskestykker af hør, som
    henhører under pos. ex 62.02 i den fælles toldtarif, har oprindelse i Tjekkoslovakiet
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 maggio 1978, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario gli strofinacci di cucina di lino
    della voce ex 62.02 della tariffa doganale comune, originari della Cecoslovacchia
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 mei 1978 waarbij het Verenigd Koninkrijk
    wordt gemachtigd keukenhanddoeken van vlas, van post ex 62.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
