title:
- language: en
  script: Latn
  content: '83/559/EEC: Commission Decision of 15 November 1983 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of sanitary
    fixtures of porcelain or china originating in Czechoslovakia and Hungary and terminating
    that proceeding'
  type: main
- language: fr
  script: Latn
  content: '83/559/CEE: Décision de la Commission du 15 novembre 1983 portant acceptation
    d'' engagements souscrits dans le cadre de la procédure anti-dumping concernant
    les importations d'' appareils fixes pour usages sanitaires, en porcelaine, originaires
    de Tchécoslovaquie et de Hongrie et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '83/559/EWG: Beschluß der Kommission vom 15. November 1983 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend Einfuhren von
    Installationsgegenständen zu sanitären Zwecken aus Porzellan mit Ursprung in
    der Tschechoslowakei und in Ungarn sowie über die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '83/559/EØF: Kommissionens afgørelse 15. november 1983 om godtagelse
    af tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende importen
    af sanitetsartikler af porcelæn med oprindelse i Tjekkoslovakiet og Ungarn og
    om afslutning af denne procedure'
  type: main
- language: el
  script: Grek
