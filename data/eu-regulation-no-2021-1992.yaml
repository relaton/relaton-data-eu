    Ausfuhr von im Besitz der französischen Interventionsstelle befindlichem Hartweizen
    auf 100 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2021/92 af 22. juli 1992 om ændring
