  content: Council Regulation (EEC) No 2332/89 of 18 July 1989 amending Regulation
    (EEC) No 1408/71 on the application of social security schemes to employed persons,
    to self- employed persons and to members of their families moving within the Community
    and Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2332/89 du Conseil du 18 juillet 1989 modifiant le
    règlement (CEE) n° 1408/71 relatif à l'application des régimes de sécurité
    sociale aux travailleurs salariés, aux travailleurs non salariés et aux membres
    de leur famille qui se déplacent à l'intérieur de la Communauté, ainsi que
    le règlement (CEE) n° 574/72 fixant les modalités d'application du règlement
    (CEE) n° 1408/71
  type: main
