id: EUDirective1990654
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 90/654/EEC of 4 December 1990 on the transitional measures
    and the adjustments required to the directives on plant health, seeds, plants
    and animal feedingstuffs and to the veterinary and zootechnical legislation as
    a result of German unification
  type: main
- language: fr
  script: Latn
  content: '90/654/CEE: Directive du Conseil, du 4 décembre 1990, relative aux mesures
    transitoires et aux adaptations nécessaires des directives phytosanitaires, concernant
    les semences, les plants et la nutrition animale, ainsi que de la législation
    vétérinaire et zootechnique, suite a l''unification allemande'
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/654/EWG des Rates vom 4. Dezember 1990 über die erforderlichen
    übergangsmassnahmen und Anpassungen der Richtlinien für Pflanzenschutz, Saat-
    und pflanzgut und Erzeugnisse zur tierernährung sowie der rechtsvorschriften
    im Veterinär- und tierzuchtbereich aufgrund der Herstellung der deutschen Einheit
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/654/EØF af 4. december 1990 om overgangsforanstaltninger
    og de nødvendige tilpasninger af direktiverne vedrørende plantesundhed, frø,
    plantemateriale og dyrs ernæring samt af de veterinære og zootekniske bestemmelser
    som følge af Tysklands forening
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/654/ΕΟΚ του Συμβουλίου της 4ης Δεκεμβρίου
    1990 περί των μεταβατικών μέτρων και των αναγκαίων
    προσαρμογών που απαιτούνται, λόγω της γερμανικής
    ενοποίησης, όσον αφορά τις φυτοϋγειονομικές
    οδηγίες τις σχετικές με τους σπόρους προς σπορά,
    τα φυτάρια και τη διατροφή των ζώων, καθώς και
    την κτηνιατρική και ζωοτεχνική νομοθεσία
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/654/ETY, annettu 4 päivänä joulukuuta 1990,
    siirtymätoimenpiteistä ja mukautuksista kasvien terveyteen, siemeniin, kasveihin
    ja eläinten rehuihin liittyviin direktiiveihin sekä eläinlääkintä- ja kotieläinjalostuslainsäädäntöön
    Saksan yhdistymisen vuoksi
  type: main
- language: it
  script: Latn
  content: Direttiva 90/654/CEE del Consiglio, del 4 dicembre 1990, relativa alle
    misure transitorie e ai necessari adeguamenti delle direttive fitosanitarie relative
    alle sementi, ai materiali di moltiplicazione ed agli alimenti per animali nonché
    della normativa veterinaria e zootecnica, a seguito dell'unificazione tedesca
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/654/EEG van de Raad van 4 december 1990 inzake overgangsmaatregelen
    en aanpassingen in de Richtlijnen voor de fytosanitaire sector, voor de sector
    zaaizaad en plantgoed en voor de sector diervoeding, alsmede in de veterinaire
    en zootechnische wetgeving, in verband met de Duitse eenwording
  type: main
- language: pt
  script: Latn
  content: Directiva 90/654/CEE do Conselho, de 4 de Dezembro de 1990, relativa as
    medidas transitórias e as adaptações necessárias das directivas fitossanitarias
    respeitantes as sementes, aos propagulos e a nutrição animal, bem como da legislação
    veterinária e zootécnica, na sequência da unificação alema
  type: main
- language: es
  script: Latn
  content: Directiva 90/654/CEE del Consejo, de 4 de diciembre de 1990, relativa a
    las medidas transitorias y a las adaptaciones necesarias de las directivas fitosanitarias,
    de semillas, de plantones y de nutrición animal, así como de la legislación
    veterinaria y zootecnica, con motivo de la unificación alemana
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/654/EEG av den 4 december 1990 om övergångsbestämmelser
    och de anpassningar som till följd av Tysklands återförening behövs i direktiven
    om växters sundhet, utsäde, växter och djurfoder samt i lagstiftningen om veterinära
    frågor och om djuravel
  type: main
