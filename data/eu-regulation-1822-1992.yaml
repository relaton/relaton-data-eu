  content: Commission Regulation (EEC) No 1822/92 of 3 July 1992 fixing the amounts
    to be paid to recognized olive oil producer organizations and associations thereof
    for the 1991/92 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1822/92 de la Commission du 3 juillet 1992 fixant,
    pour la campagne 1991/1992 les montants à verser aux organisations et aux unions
    reconnues de producteurs d'huile d'olive
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1822/92 DER KOMMISSION vom 3. Juli 1992 zur Festsetzung
