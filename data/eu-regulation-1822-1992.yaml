    1991/92, τα ποσά που καταβάλλονται στις οργανώσεις
    και στις αναγνωρισμένες ενώσεις των παραγωγών
    ελαιολάδου
  type: main
- language: it
  script: Latn
  content: "#REGOLAMENTO (CEE) N. 1822/92 DELLA COMMISSIONE del 3 luglio 1992 che fissa, per la campagna 1991/1992, gli importi da versare alle organizzazioni di produttori di olio d' oliva e alle loro unioni riconosciute #"
  type: main
