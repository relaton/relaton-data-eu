    im Wirtschaftsjahr 1991/92 zu zahlenden Beträge #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1822/92 af 3. juli 1992 om fastsættelse
