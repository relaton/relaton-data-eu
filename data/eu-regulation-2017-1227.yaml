  script: Latn
  content: Commission Delegated Regulation (EU) 2017/1227 of 20 March 2017 on the
    conditions for classification, without testing, of glued laminated timber products
    covered by the harmonised standard EN 14080 and structural finger jointed solid
    timber products covered by the harmonised standard EN 15497 with regard to their
    reaction to fire and amending Decision 2005/610/EC
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2017/1227 de la Commission du 20 mars 2017 énonçant
