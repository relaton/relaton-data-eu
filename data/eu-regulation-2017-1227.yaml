    relevant de la norme harmonisée EN 14080 et des produits en bois massif de structure
    à entures multiples relevant de la norme harmonisée EN 15497 en ce qui concerne
    leur réaction au feu et modifiant la décision 2005/610/CE
  type: main
- language: de
  script: Latn
