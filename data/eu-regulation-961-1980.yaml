title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 961/80 of 18 April 1980 re-establishing
    the levying of customs duties on flax or ramie yarn, not put up for retail sale,
    products of category 115 (code 1150), originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 961/80 de la Commission, du 18 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie, non conditionnés pour la vente au détail, de la catégorie
    115 (code 1150), originaires du Brésil bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 961/80 der Kommission vom 18. April 1980 über die
    Wiedereinführung des Zollsatzes für Leinengarne und Ramiegarne, nicht in Aufmachungen
    für den Einzelverkauf, der Warenkategorie Nr. 115 (Kennziffer 1150), mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 961/80 af 18. april 1980 om genindførelse
    af opkrævning af toldafgifter for garn af hør eller ramie, ikke i detailsalgsoplægninger,
    under varekategori 115 (kode 1150), som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 961/80 della Commissione, del 18 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramiè, non preparati per la vendita al minuto, della categoria di prodotti n.
    115 (codice 1150), originari del Brasile beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 961/80 van de Commissie van 18 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    vlas of van ramee, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 115 (codenummer 1150), van oorsprong uit Brazilië waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
