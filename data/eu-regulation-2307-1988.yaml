    zur Aufteilung der in der Zeit vom 1. Januar bis 31. Dezember 1988 ohne Zusatzbetrag
    einzuführenden Menge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2307/88 af 26. juli 1988 om ændring
