title:
- language: en
  script: Latn
  content: Council Directive 81/1016/EEC of 15 December 1981 extending the period
    of validity of derogations relating to brucellosis guarantees in trade in certain
    bovine animals as provided for in Article 7 (1) point C of Directive 64/432/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 81/1016/CEE du Conseil, du 15 décembre 1981, prorogeant la période
    de validité des dérogations concernant les garanties relatives à la brucellose
    dans les échanges de certains animaux de l'éspèce bovine, conformément à
    l'article 7 paragraphe 1 sous C de la directive 64/432/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 81/1016/EWG des Rates vom 15. Dezember 1981 zur Verlängerung
    der Geltungsdauer der in Artikel 7 Absatz 1 Buchstabe C der Richtlinie 64/432/EWG
    vorgesehenen Abweichungsmöglichkeit betreffend die Brucellose-Garantien im Handel
    mit bestimmten Rindern
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 81/1016/EØF af 15. december 1981 om forlængelse af gyldighedsperioden
    for de undtagelser, der i artikel 7, stk. 1, litra C), i direktiv 64/432/EØF
    er fastsat vedrørende forholdsregler over for brucellose ved handel med kvæg
  type: main
- language: el
  script: Grek
  content: Οδηγία 81/1016/EOK του Συμβουλίου της 5ης Δεκεμβρίου
    1981 περί παρατάσεως της προθεσμίας ισχύος των
    παρεκκλίσεων που αφορούν τις εγγυήσεις ως
    προς τη βρουκέλλωση κατά το εμπόριο ορισμένων
    βοοειδών που προβλέπονται στα άρθρο 7 παράγραφος
    1 σημείο Γ της οδηγίας 64/432/EOK
  type: main
- language: it
  script: Latn
  content: Direttiva 81/1016/CEE del Consiglio, del 15 dicembre 1981, che proroga
    il periodo di validità delle deroghe concernenti le garanzie relative alla brucellosi
    negli scambi di taluni animali della specie bovina, conformemente all'articolo
    7, paragrafo 1, lettera C, della direttiva 64/432/CEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 81/1016/EEG van de Raad van 15 december 1981 houdende verlenging
    van de geldigheidsduur van de afwijkende bepalingen inzake de gezondheidsgaranties
    ten aanzien van brucellose bij het handelsverkeer in bepaalde soorten runderen,
    als bedoeld in artikel 7, lid 1, sub C, van Richtlijn 64/432/EEG
  type: main
