title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/710 of 21 April 2015 on the position to be adopted
    on behalf of the European Union within the Joint Committee established by the
    Agreement between the European Coal and Steel Community and the Republic of Turkey
    on trade in products covered by the Treaty establishing the European Coal and
    Steel Community, as regards the replacement of Protocol 1 to that Agreement, concerning
    the definition of the concept of ‘originating products’ and methods of administrative
    cooperation, by a new protocol which, as regards the rules of origin, refers to
    the Regional Convention on pan-Euro-Mediterranean preferential rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/710 du Conseil du 21 avril 2015 relative à la position
    à adopter au nom de l'Union européenne au sein du comité mixte institué par
    l'accord entre la Communauté européenne du charbon et de l'acier et la République
    de Turquie sur le commerce des produits couverts par le traité instituant la
    Communauté européenne du charbon et de l'acier en ce qui concerne le remplacement
    du protocole n° 1 de cet accord, relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative, par un nouveau
    protocole qui, pour ce qui est des règles d'origine, fait référence à la convention
    régionale sur les règles d'origine préférentielles paneuro-méditerranéennes
  type: main
