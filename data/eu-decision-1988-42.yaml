title:
- language: en
  script: Latn
  content: '88/42/EEC: Commission Decision of 21 December 1987 authorizing the Italian
    Republic to apply intra- Community surveillance to imports of textile products
    falling within category 3, originating in Pakistan, which have been put into free
    circulation in the Community (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/42/CEE: Décision de la Commission du 21 décembre 1987 autorisant
    la République italienne à procéder à une surveillance intracommunautaire des
    importations des produits textiles de la catégorie 3 originaires du Pakistan
    et mis en libre pratique dans la Communauté (Le texte en langue italienne est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/42/EWG: Entscheidung der Kommission vom 21. Dezember 1987 zur Ermächtigung
    der Italienischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren bestimmter aus Pakistan stammender und in der Gemeinschaft im freien
    Verkehr befindlicher Textilwaren der Kategorie 3 (Nur der italienische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/42/EØF: Kommissionens beslutning af 21. december 1987 om bemyndigelse
    af Den Italienske Republik til at indføre tilsyn inden for Fællesskabet med
    indførslen af tekstilvarer, henhørende under kategori 3, der har oprindelse
    i Pakistan og er overgået til fri omsætning i Fællesskabet (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/42/ΕΟΚ: Απόφαση της Επιτροπής της 21ης Δεκεμβρίου
    1987 που εξουσιοδοτεί τη Δημοκρατία της Ιταλίας
    να θεσπίσει ενδοκοινοτική επιτήρηση των εισαγωγών
    ορισμένων κλωστοϋφαντουργικών προϊόντων καταγωγής
    Πακιστάν που υπάγονται στην κατηγορία 3 και
    που βρίσκονται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/42/CEE: Decisione della Commissione del 21 dicembre 1987 che autorizza
    la Repubblica italiana ad istituire una sorveglianza intracomunitaria delle importazioni
    di prodotti tessili della categoria 3 originari del Pakistan messi in libera pratica
    nella Comunità (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/42/EEG: Beschikking van de Commissie van 21 december 1987 houdende
    machtiging van de Italiaanse Republiek tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van textielprodukten van categorie 3 van oorsprong
    uit Pakistan, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/42/CEE: Decisão da Comissão de 21 de Dezembro de 1987 que autoriza
    a República Italiana a proceder a uma vigilância intracomunitária das importações
    dos produtos têxteis da categoria 3, originários do Paquistão e introduzidos
    em livre-prática na Comunidade (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '88/42/CEE: Decisión de la Comisión de 21 de diciembre de 1987 por la
    que se autoriza a la República Italiana a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de determinados productos textiles de la categoría
    3, originarios de Pakistán y despachados a libre práctica en la Comunidad (El
    texto en lengua italiana es el único auténtico)'
