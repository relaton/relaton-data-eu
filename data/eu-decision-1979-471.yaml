id: EUDecision1979471
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/471/EEC: Commission Decision of 26 April 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, falling within heading No 60.02 of the
    Common Customs Tariff (NIMEXE codes 60.02-40, 50, 60, 70, 80) (categories 10 and
    11), originating in Hong Kong and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/471/CEE: Décision de la Commission, du 26 avril 1979, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, de la sous-position 60.02 du tarif douanier commun
    (codes Nimexe: 60.02-40, 50, 60, 70, 80) (catégories 10 et 11), originaire de
    Hong-kong et mise en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/471/EWG: Entscheidung der Kommission vom 26. April 1979, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.02-40, 50, 60, 70, 80) (Kategorien 10 und 11) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/471/EØF: Kommissionens beslutning af 26. april 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at udtage handsker, vanter
    og luffer af trikotage, ikke elastisk eller gummeret, som henhører under pos.
    60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40, 50, 60, 70, 80 ; kategori
    10 og 11), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/471/CEE: Decisione della Commissione, del 26 aprile 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario guanti a maglia
    non elastica né gommata, della voce 60.02 della tariffa doganale comune (codici
    Nimexe: 60.02-40, 50, 60, 70, 80) (categorie 10 e 11), originari di Hong Kong
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/471/EEG: Beschikking van de Commissie van 26 april 1979 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van post 60.02 van
    het gemeeenschappelijk douanetarief (NIMEXE-code 60.02-40, 50, 60, 70, 80) (categorieën
    10 en 11), van oorsprong uit Hong Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
