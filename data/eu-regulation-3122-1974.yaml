title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3122/74 of the Commission of 11 December 1974, re-establishing
    the levying of customs duties on women's, girls' and infants' under garments,
    of cotton fabric, falling within heading No ex 61.04, originating in India, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3122/74 de la Commission, du 11 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour femmes, fillettes et jeunes enfants, de coton,
    de la position tarifaire EX 61.04, originaires de l'Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3122/74 der Kommission vom 11. Dezember 1974 über
    die Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Frauen,
    Mädchen und Kleinkinder, aus Baumwolle, der Tarifnummer ex 61.04, mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember
    1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3122/74 af 11. december 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til kvinder, piger
    og småbørn, af bomuld under position ex 61.04 som har oprindelse i Indien og
    omfattes af de toldpræferencer, som er fastsat i Rådet forordning (EØF) nr.
    3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3122/74 della Commissione, dell'11 dicembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per donna, per ragazza e per bambini, di cotone, della voce doganale
    n. ex 61.04, originarie dell'India beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3122/74 van de Commissie van 11 december 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op damesonderkleding,
    meisjesonderkleding en kinderonderkleding van katoen, van post ex 61.04, van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3503/73 van de Raad van 18 december 1973
  type: main
