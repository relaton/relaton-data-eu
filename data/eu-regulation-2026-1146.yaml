    DSM 18114, Lactiplantibacillus plantarum ATCC 55943, Lactiplantibacillus plantarum
    ATCC 55944, Lentilactobacillus buchneri ATCC PTA-2494 und Lentilactobacillus buchneri
    ATCC PTA-6138 als Zusatzstoffe in Futtermitteln für alle Tierarten, zur Änderung
    der Durchführungsverordnung (EU) Nr. 1065/2012 und zur Aufhebung der Durchführungsverordnung
    (EU) Nr. 1113/2013
  type: main
