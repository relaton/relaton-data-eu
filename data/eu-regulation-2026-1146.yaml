  content: Commission Implementing Regulation (EU) 2026/1146 of 28 May 2026 concerning
    the renewal of the authorisation of the preparations of Lactiplantibacillus plantarum
    DSM 18112, Lactiplantibacillus plantarum DSM 18113, Lactiplantibacillus plantarum
    DSM 18114, Lactiplantibacillus plantarum ATCC 55943, Lactiplantibacillus plantarum
    ATCC 55944, Lentilactobacillus buchneri ATCC PTA-2494 and Lentilactobacillus buchneri
    ATCC PTA-6138 as feed additives for all animal species, amending Implementing
    Regulation (EU) No 1065/2012 and repealing Implementing Regulation (EU) No 1113/2013
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1146 de la Commission du 28 mai 2026
    concernant le renouvellement de l’autorisation des préparations de Lactiplantibacillus
    plantarum DSM 18112, de Lactiplantibacillus plantarum DSM 18113, de Lactiplantibacillus
    plantarum DSM 18114, de Lactiplantibacillus plantarum ATCC 55943, de Lactiplantibacillus
    plantarum ATCC 55944, de Lentilactobacillus buchneri ATCC PTA-2494 et de Lentilactobacillus
    buchneri ATCC PTA-6138 en tant qu’additifs pour l’alimentation de toutes les
    espèces animales, modifiant le règlement d’exécution (UE) no 1065/2012 et
    abrogeant le règlement d’exécution (UE) no 1113/2013
  type: main
- language: de
  script: Latn
