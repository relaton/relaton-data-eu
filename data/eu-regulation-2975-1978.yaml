title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2975/78 of 15 December 1978 re-establishing
    the levying of customs duties on umbrellas, falling within heading No 66.01 and
    originating in South Korea, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2975/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    de la position tarifaire 66.01, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2975/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Regenschirme und Sonnenschirme, einschließlich Stockschirme,
    usw., der Tarifnummer 66.01, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2975/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for paraplyer, under position 66.01, som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2975/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli, della voce
    doganale 66.01, originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2975/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op paraplu'
    s en parasols, van post 66.01, van oorsprong uit Zuid-Korea, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
