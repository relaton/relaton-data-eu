    soju MON 87769 ili se sastoje ili su proizvedeni od nje, u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2026)
    8329)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/2602 végrehajtási határozata (2026. november 25.)
