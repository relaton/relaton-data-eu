title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/2602 of 25 November 2026 renewing
    the authorisation for placing on the market of products containing, consisting
    of or produced from genetically modified soybean MON 87769 pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2026) 8329)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/2602 de la Commission du 25 novembre 2026
    renouvelant l’autorisation de mise sur le marché de produits contenant du soja
    génétiquement modifié MON 87769, consistant en ce soja ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2026) 8329]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/2602 der Kommission vom 25. November 2026
    zur Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen, die genetisch
    veränderte Sojabohnen der Sorte MON 87769 enthalten, aus ihnen bestehen oder aus
    ihnen gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2026) 8329)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/2602 на Комисията от 25 ноември 2026 година
