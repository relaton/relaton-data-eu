    abból előállított termékek forgalomba hozatalára vonatkozó engedély 1829/2003/EK
    európai parlamenti és tanácsi rendelet szerinti megújításáról (az értesítés a
    C(2026) 8329. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/2602 della Commissione, del 25 novembre
    2026, che rinnova l’autorizzazione all’immissione in commercio di prodotti contenenti,
    costituiti o derivati da soia geneticamente modificata MON 87769 in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2026) 8329]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/2602 (2026. gada 25. novembris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificētu soju MON 87769,
