    се или произведени от генетично модифицирана соя MON 87769, в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета (нотифицирано под номер
    С(2026) 8329)
  type: main
- language: cs
  script: Latn
