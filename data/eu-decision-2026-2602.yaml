    8329)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/2602 van de Commissie van 25 november 2026
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    soja MON 87769 overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees
    Parlement en de Raad (Kennisgeving geschied onder nummer C(2026) 8329)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/2602 z dnia 25 listopada 2026 r. odnawiająca
