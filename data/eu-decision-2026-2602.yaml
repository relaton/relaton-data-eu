    constituídos por ou sejam produzidos a partir de soja geneticamente modificada
    MON 87769 nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e
    do Conselho [notificada com o número C(2026) 8329]
  type: main
