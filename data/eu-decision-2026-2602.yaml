    conțin, constau în sau sunt fabricate din soia modificată genetic MON 87769 în
    temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2026) 8329]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/2602 z 25. novembra 2026, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje povolenie
    umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú sóju MON 87769,
    sú z nej zložené alebo vyrobené [oznámené pod číslom C(2026) 8329]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije ((EU) 2026/2602 z dne 25. novembra 2026 o obnovitvi
