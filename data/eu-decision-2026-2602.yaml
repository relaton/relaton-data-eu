    sóju MON 87769, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2026) 8329)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/2602 af 25. november 2026
