title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1522/74 of the Council of 17 June 1974 on the tariff
    treatment of certain products intended for use in the maintenance and repair of
    aeroplanes of the types Mercure and Airbus during 1974
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1522/74 du Conseil, du 17 juin 1974, relatif au traitement
    tarifaire applicable à certains produits destinés à être utilisés pour l'entretien
    et la réparation d'avions du type Mercure ou de type Airbus au cours de l'année
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1522/74 des Rates vom 17. Juni 1974 über die zolltarifliche
    Behandlung bestimmter Erzeugnisse, die im Jahre 1974 zur Verwendung bei der Instandhaltung
    und Instandsetzung von Flugzeugen vom Typ Mercure oder Airbus bestimmt sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1522/74 af 17. juni 1974 om toldbehandling
    af visse varer beregnet til brug ved vedligeholdelse og reparation af fly af typerne
    »Mercure« og »Airbus« i året 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1522/74 del Consiglio, del 17 giugno 1974, relativo
    al trattamento tariffario da applicare a taluni prodotti destinati ad essere utilizzati
    per la manutenzione e la riparazione di aeroplani dei tipi Mercure o Airbus durante
    l'anno 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1522/74 van de Raad van 17 juni 1974 inzake de toepassing
    van het tarief op bepaalde produkten welke bestemd zijn om in 1974 te worden gebruikt
    voor het onderhoud en de reparatie van vliegtuigen van het type Mercure of het
    type Airbus
  type: main
