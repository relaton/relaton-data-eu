  content: Règlement n° 917/67/CEE du Conseil, du 28 novembre 1967, portant troisième
    prorogation du règlement n° 281/67/CEE fixant les montants maxima de la restitution
    à la production pour les sucres utilisés dans l'industrie chimique
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 917/67/EWG des Rates vom 28. November 1967 über die dritte
    Verlängerung der Geltungsdauer der Verordnung Nr. 281/67/EWG zur Festsetzung
    der Höchstbeträge der Erstattung bei der Erzeugung für Zucker, der in der chemischen
    Industrie verwendet wird
  type: main
- language: it
  script: Latn
  content: Regolamento n. 917/67/CEE del Consiglio, del 28 novembre 1967, recante
    terza proroga del regolamento n. 281/67/CEE che fissa gli importi massimi della
    restituzione alla produzione per gli zuccheri utilizzati nell'industria chimica
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 917/67/EEG van de Raad van 28 november 1967 waarbij de
    geldigheidsduur van Verordening Nr. 281/67/EEG tot vaststelling van de maximumbedragen
    van de restitutie bij de produktie voor in de chemische industrie gebruikte suiker
    voor de derde maal wordt verlengd
