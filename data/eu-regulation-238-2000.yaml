title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 238/2000 of 28 January 2000 amending Regulation
    (EC) No 1222/94 laying down common detailed rules for the application of the system
    of granting export refunds on certain agricultural products exported in the form
    of goods not covered by Annex I to the Treaty, and the criteria for fixing the
    amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 238/2000 de la Commission, du 28 janvier 2000, modifiant
    le règlement (CE) nº 1222/94 établissant pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe I du traité, les modalités
    communes d'application du régime d'octroi des restitutions à l'exportation et
    les critères de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 238/2000 der Kommission vom 28. Januar 2000 zur Änderung
    der Verordnung (EG) Nr. 1222/94 zur Festlegung der gemeinsamen Durchführungsvorschriften
    für die Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung
    des Erstattungsbetrags für bestimmte landwirtschaftliche Erzeugnisse, die in
    Form von nicht unter Anhang I des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 238/2000 af 28. januar 2000 om ændring
    af forordning (EF) nr. 1222/94 om fastsættelse af fælles gennemførelsesregler
    for ordningen for ydelse af eksportrestitutioner og om fastlæggelse af kriterierne
    for fastsættelse af restitutionsbeløbet for visse landbrugsprodukter, der udføres
    i form af varer, som ikke er opført i traktatens bilag I
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 238/2000 της Επιτροπής,
    της 28ης Ιανουαρίου 2000, περί τροποποιήσεως του
    κανονισμού (ΕΚ) αριθ. 1222/94, σχετικά με τη θέσπιση
    κοινών ρυθμίσεων εφαρμογής του καθεστώτος
    επιστροφών κατά την εξαγωγή και κριτηρίων
    καθορισμού του ύψους αυτών, για ορισμένα γεωργικά
    προϊόντα εξαγόμενα υπό μορφή εμπορευμάτων
    μη υπαγομένων στο παράρτημα Ι της συνθήκης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 238/2000, annettu 28 päivänä tammikuuta 2000,
    tiettyjen perustamissopimuksen liitteeseen I kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1222/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 238/2000 della Commissione, del 28 gennaio 2000, che
    modifica il regolamento (CE) n. 1222/94 che stabilisce, per taluni prodotti agricoli
    esportati sotto forma di merci non comprese nell'allegato I del trattato, le modalità
    comuni di applicazione relative alla concessione delle restituzioni all'esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 238/2000 van de Commissie van 28 januari 2000 tot
    wijziging van Verordening (EG) nr. 1222/94 tot vaststelling van de gemeenschappelijke
    uitvoeringsbepalingen voor de regeling aangaande de toekenning van restituties
    bij uitvoer en de criteria voor de vaststelling van het restitutiebedrag betreffende
    bepaalde landbouwproducten, uitgevoerd in de vorm van goederen die niet onder
    bijlage I van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 238/2000 da Comissão, de 28 de Janeiro de 2000, que
    altera o Regulamento (CE) n.o 1222/94 que estabelece, para certos produtos agrícolas
    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as normas comuns de aplicação do regime de concessão de restituições à exportação
    e os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 238/2000 de la Comisión, de 28 de enero de 2000, por
    el que se modifica el Reglamento (CE) nº 1222/94 por el que se establecen, para
    determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el anexo I del Tratado, las disposiciones comunes de aplicación del régimen
    de concesión de las restituciones a la exportación y los criterios para la fijación
    de su importe
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 238/2000 av den 28 januari 2000 om ändring
    av förordning (EG) nr 1222/94 om gemensamma tillämpningsföreskrifter för ordningen
    för beviljande av exportbidrag för vissa jordbruksprodukter som exporteras i
    form av varor som inte omfattas av bilaga I till fördraget samt om kriterierna
    för fastställande av bidragsbeloppen
  type: main
