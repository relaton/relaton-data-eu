    presentate nel mese di gennaio 1994 per taluni prodotti del settore lattiero-caseari
    nel quadro del regime previsto dagli accordi interinali conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica federativa
    Ceca e Slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 90/94 van de Commissie van 19 januari 1994 tot vaststelling
