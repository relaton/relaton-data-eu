title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3752/91 of 19 December 1991 re-establishing
    the levying of customs duties on products falling within CN code 2523, originating
    in Poland, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3752/91 DE LA COMMISSION du 19 décembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2523 originaires de Pologne, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3752/91 DER KOMMISSION vom 19. Dezember 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 2523 mit
    Ursprung in Polen, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3752/91 af 19. december 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2523 og med oprindelse
    i Polen, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3752/91 της Επιτροπής
    της 19ης Δεκεμβρίου 1991 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 2523, καταγωγής Πολωνίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό ( ΕΟΚ ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3752/91 DELLA COMMISSIONE del 19 dicembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2523, originari della Polonia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3752/91 VAN DE COMMISSIE van 19 december 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 2523, van oorsprong uit Polen, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3752/91 DA COMISSÃO de 19 de Dezembro de 1991 que
