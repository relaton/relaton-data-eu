id: EURegulation18221979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1822/79 of 16 August 1979 re-establishing
    the levying of customs duties on iron or steel wire, whether or not coated, but
    not insulated, falling within heading No 73.14 and originating in Romania, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1822/79 de la Commission, du 16 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fer ou d' acier, nus ou revêtus, à l' exclusion des fils isolés pour l' électricité,
    de la position 73.14 du tarif douanier commun, originaires de Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1822/79 der Kommission vom 16. August 1979 zur Wiedereinführung
    des Zollsatzes für Draht aus Stahl, auch überzogen, ausgenommen isolierte Drähte
    für die Elektrotechnik, der Tarifnummer 73.14, mit Ursprung in Rumänien, dem
    die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1822/79 af 16. august 1979 om genindførelse
    af opkrævning af toldafgifter for tråd af jern og stål, også med overtræk
    (undtagen isoleret tråd til elektrisk brug), under pos. 73.14, som har oprindelse
    i Rumænien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1822/79 della Commissione, del 16 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili a fili di ferro o di acciaio,
    nudi o rivestiti, esclusi i fili isolati per l' elettricità, della voce 73.14
    della tariffa doganale comune, originari della Romania beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1822/79 van de Commissie van 16 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ijzerdraad
    en staaldraad, ook indien overtrokken, met uitzondering van geïsoleerde draad
    voor het geleiden van elektriciteit, van post 73.14, van oorsprong uit Roemenië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
