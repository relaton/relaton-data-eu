    clo na dovoz oceľových lán a káblov a ktorým sa prijímajú záväzky ponúknuté
    určitými vývozcami, okrem iného, v Poľsku a ktorým sa mení a dopĺňa rozhodnutie
    1999/572/ES, ktorým sa prijímajú záväzky ponúknuté v súvislosti s antidumpingovým
    konaním týkajúcim sa dovozu oceľových drôtených lán a káblov s pôvodom,
    okrem iného, na Ukrajine
  type: main
