  script: Latn
  content: Verordening (EG) nr. 1678/2003 van de Commissie van 26 augustus 2003 tot
    wĳziging van Verordening (EG) nr. 362/1999 tot instelling van een voorlopig antidumpingrecht
    op de invoer van stalen kabels en tot aanvaarding van verbintenissen van, onder
    meer, Poolse exporteurs en tot wĳziging van Besluit 1999/572/EG tot aanvaarding
    van verbintenissen van, onder meer, Oekraïnse exporteurs
  type: main
