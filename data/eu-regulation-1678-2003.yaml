    sobre as importações de cabos de aço e que aceita compromissos oferecidos por
    alguns exportadores, inter alia, da Polónia, e que altera a Decisão 1999/572/CE
    que aceita os compromissos oferecidos no âmbito dos processos anti-dumping relativos
    às importações de cabos de aço originários, inter alia, da Ucrânia
  type: main
