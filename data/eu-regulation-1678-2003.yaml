    na przywóz stalowych lin i drutu oraz przyjmujące zobowiązania zaproponowane
    przez niektórych eksporterów, między innymi, z Polski oraz zmieniające decyzję
    1999/572/WE przyjmującą zobowiązania zaproponowane w związku z postępowaniem
