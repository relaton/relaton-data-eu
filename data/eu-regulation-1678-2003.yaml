    vastaisten menettelyjen yhteydessä esitettyjen sitoumusten hyväksymisestä tehdyn
    päätöksen 1999/572/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1678/2003/EK rendelete (2003. augusztus 26.) az acél drótkötelek
    és kábelek behozatalára ideiglenes dömpingellenes vám kivetéséről és
    az egyes – többek között – lengyelországi exportáló termelők által
    felajánlott kötelezettségvállalások elfogadásáról szóló 362/1999/EK
    bizottsági rendelet módosításáról és a – többek között – Ukrajnából
    származó acél drótkötelek és kábelek behozatalára vonatkozó dömpingellenes
    eljárással kapcsolatos kötelezettségvállalások elfogadásáról szóló
    1999/572/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1678/2003 della Commissione, del 26 agosto 2003, recante
    modifica del regolamento (CE) n. 362/1999 della Commissione che istituisce un
    dazio antidumping provvisorio sulle importazioni di cavi di acciaio e accetta
    gli impegni offerti da alcuni esportatori, tra l'altro, della Polonia, nonché
    recante modifica della decisione 1999/572/CE della Commissione che accetta gli
    impegni offerti riguardo ai procedimenti antidumping relativi alle importazioni
    di cavi di acciaio originarie, tra l'altro, dell'Ucraina
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1678/2003 (2003. gada 26. augusts), ar ko groza
    Komisijas Regulu (EK) Nr. 362/1999, ar ko piemēro antidempinga maksājumu tērauda
    trošu un tauvu importam, un ar ko pieņem noteiktu eksportētāju piedāvātās
    saistības, cita starpā, Polijā, un ar ko groza Lēmumu 1999/572/EK, ar ko pieņem
    piedāvātās saistības saistībā ar antidempinga procedūrām par tādu tērauda
    trošu un tauvu importu, kuru izcelsme ir Ukrainā
  type: main
- language: lt
  script: Latn
  content: 2003 m. rugpjūčio 26 d. Komisijos Reglamentas (EB) Nr. 1678/2003 iš
    dalies keičiantis Komisijos Reglamentą (EB) Nr. 362/1999, įvedantį laikinąjį
    antidempingo muitą importuojamiems plieniniams lynams ir kabeliams ir priimantį
    tam tikrų eksportuotojų inter alia Lenkijoje siūlomus įsipareigojimus bei
    iš dalies keičiantį Sprendimą 1999/572/EB, priimantį įsipareigojimus, siūlomus
    dėl antidempingo procesų, susijusių su plieninių vielinių lynų ir kabelių,
    kurių kilmės šalis inter alia yra Ukraina, importu
  type: main
