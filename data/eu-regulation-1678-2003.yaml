    cla z dovozu ocelových lan a kabelů a o přijetí závazků nabídnutých některými
    vývozci mimo jiné v Polsku a rozhodnutí 1999/572/ES, kterým se přijímají
    závazky nabídnuté v souvislosti s antidumpingovým řízením týkajícím
    se dovozu ocelových lan a kabelů pocházejících mimo jiné z Ukrajiny
  type: main
