title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1678/2003 of 26 August 2003 amending Commission
    Regulation (EC) No 362/1999 imposing a provisional anti-dumping duty on imports
    of steel ropes and cables and accepting undertakings offered by certain exporters,
    inter alia, in Poland and amending Decision 1999/572/EC accepting undertakings
    offered in connection with the anti-dumping proceedings concerning imports of
    steel wire ropes and cables originating, inter alia, in Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1678/2003 de la Commission du 26 août 2003 modifiant
    le règlement (CE) n° 362/1999 instituant un droit antidumping provisoire sur
    les importations de câbles en acier et portant acceptation des engagements offerts
    par certains exportateurs, entre autres, polonais et la décision 1999/572/CE
    portant acceptation des engagements offerts dans le cadre des procédures antidumping
    concernant les importations de câbles en acier originaires, entre autres, d'Ukraine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1678/2003 der Kommission vom 26. August 2003 zur Änderung
    der Verordnung (EG) Nr. 362/1999 der Kommission zur Einführung eines vorläufigen
    Antidumpingzolls auf die Einfuhren von Kabeln und Seilen aus Stahl und zur Annahme
    von Verpflichtungsangeboten bestimmter Ausführer unter anderem in Polen sowie
    zur Änderung des Beschlusses 1999/572/EG der Kommission über die Annahme von
    Verpflichtungen im Rahmen der Antidumpingverfahren betreffend Einfuhren von Kabeln
    und Seilen aus Stahl mit Ursprung in unter anderem der Ukraine
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1678/2003 ze dne 26. srpna 2003 kterým se
