  script: Latn
  content: Uredba Komisije (ES) št. 1678/2003 z dne 26. avgusta 2003 o spremembi
    Uredbe Komisije (ES) št. 362/1999 o uvedbi začasne protidampinške dajatve na
    uvoz jeklenih vrvi in kablov in o sprejetju zavez, ki jih nudijo nekateri izvozniki,
    med drugim, iz Poljske, ter o spremembi Sklepa 1999/572/ES o sprejetju zavez,
    nudenih v povezavi s protidampinškimi postopki v zvezi z uvozom jeklenih žičnih
    vrvi in kablov s poreklom, med drugim, iz Ukrajine
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1678/2003 de la Comisión, de 26 de agosto de 2003,
    que modifica el Reglamento (CE) n° 362/1999, por el que se establece un derecho
    antidumping provisional sobre las importaciones de cables de acero originarias
    de la República Popular de China, India, México, Sudáfrica y Ucrania y por
    el que se aceptan los compromisos ofrecidos por algunos exportadores de Hungría
    y Polonia, y la Decisión 1999/572/CE, por la que se aceptan los compromisos ofrecidos
    con respecto a los procedimientos antidumping relativos a las importaciones de
