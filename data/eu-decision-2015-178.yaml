  script: Latn
  content: Besluit (EU) 2015/178 van de Raad van 27 januari 2015 inzake het namens
    de Europese Unie in te nemen standpunt in het subcomité sanitaire en fytosanitaire
    maatregelen, in het subcomité douane en in het subcomité geografische aanduidingen,
    welke subcomités zijn ingesteld bij de Associatieovereenkomst tussen de Europese
    Unie en de Europese Gemeenschap voor Atoomenergie en hun lidstaten, enerzijds,
    en de Republiek Moldavië, anderzijds, wat betreft de vaststelling van besluiten
    van het subcomité sanitaire en fytosanitaire maatregelen, het subcomité douane,
    en het subcomité geografische aanduidingen inzake hun reglement van orde
  type: main
