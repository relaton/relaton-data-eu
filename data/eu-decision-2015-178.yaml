title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/178 of 27 January 2015 on the position to be
    taken on behalf of the European Union within the Sanitary and Phytosanitary Sub-Committee,
    the Customs Sub-Committee and the Geographical Indications Sub-Committee established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and the Republic of
    Moldova, of the other part, as regards the adoption of decisions of the Sanitary
    and Phytosanitary Sub-Committee, the Customs Sub-Committee and the Geographical
    Indications Sub-Committee on their Rules of Procedure
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/178 du Conseil du 27 janvier 2015 relative à la position
    à prendre au nom de l'Union européenne au sein du sous-comité sanitaire et
    phytosanitaire, du sous-comité douanier et du sous-comité concernant les indications
    géographiques, institués par l'accord d'association entre l'Union européenne
    et la Communauté européenne de l'énergie atomique et leurs États membres,
    d'une part, et la République de Moldavie, d'autre part, en ce qui concerne l'adoption
    de décisions du sous-comité sanitaire et phytosanitaire, du sous-comité douanier
    et du sous-comité concernant les indications géographiques sur leurs règlements
    intérieurs
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/178 des Rates vom 27. Januar 2015 über den Standpunkt,
    der im Namen der Europäischen Union in den mit dem Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Republik Moldau andererseits eingesetzten Unterausschüssen
    „Gesundheitspolizeiliche und pflanzenschutzrechtliche Fragen“ , „Zoll“
    und „Geografische Angaben“ bezüglich der Annahme von Beschlüssen über die
    Geschäftsordnungen der besagten Unterausschüsse zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2015/178 на Съвета от 27 януари 2015
    година относно позицията, която да бъде заета
    от името на Европейския съюз в рамките на Подкомитета
    по санитарни и фитосанитарни въпроси, Митническия
    подкомитет и Подкомитета по географските означения,
    създадени по силата на Споразумението за асоцииране
    между Европейския съюз и Европейската общност
    за атомна енергия и техните държави членки,
    от една страна, и Република Молдова, от друга
    страна, във връзка с приемането на решения
    на Подкомитета по санитарни и фитосанитарни
    въпроси, Митническия подкомитет и Подкомитета
    по географските означения относно техните
    процедурни правилници
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2015/178 ze dne 27. ledna 2015 o postoji, který
    má být jménem Evropské unie zaujat v Podvýboru pro sanitární a fytosanitární
    otázky, Podvýboru pro cla a v Podvýboru pro zeměpisná označení zřízených
    Dohodou o přidružení mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii a jejich členskými státy na jedné straně a Moldavskou republikou
    na straně druhé, pokud jde o rozhodnutí Podvýboru pro sanitární a fytosanitární
    otázky, Podvýboru pro cla a Podvýboru pro zeměpisná označení, kterými
    se přijímají jejich jednací řády
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2015/178 af 27. januar 2015 om den holdning, der
    skal indtages på vegne af Den Europæiske Union i Underudvalget vedrørende Sundheds-
    og Plantesundhedsforanstaltninger, Toldunderudvalget og Underudvalget vedrørende
