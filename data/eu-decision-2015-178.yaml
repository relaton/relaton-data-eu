  script: Latn
  content: Decizia (UE) 2015/178 a Consiliului din 27 ianuarie 2015 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Subcomitetului
    pentru măsuri sanitare și fitosanitare, al Subcomitetului vamal și al Subcomitetului
    pentru indicații geografice instituite prin Acordul de asociere dintre Uniunea
    Europeană și Comunitatea Europeană a Energiei Atomice și statele membre ale
    acestora, pe de o parte, și Republica Moldova, pe de altă parte, în ceea ce
    privește adoptarea deciziilor Subcomitetului pentru măsuri sanitare și fitosanitare,
    ale Subcomitetului vamal și ale Subcomitetului pentru indicații geografice cu
    privire la regulamentul lor de procedură
  type: main
