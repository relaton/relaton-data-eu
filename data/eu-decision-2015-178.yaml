  script: Latn
  content: Sklep Sveta (EU) 2015/178 z dne 27. januarja 2015 o stališču, ki se v
    imenu Evropske unije zavzame v Pododboru za sanitarne in fitosanitarne ukrepe,
    Pododboru za carino in Pododboru za geografske označbe, ustanovljenimi s Pridružitvenim
    sporazumom med Evropsko unijo in Evropsko skupnostjo za atomsko energijo in njunimi
    državami članicami na eni strani ter Republiko Moldavijo na drugi strani, v
    zvezi s sprejetjem sklepov Pododbora za sanitarne in fitosanitarne ukrepe, Pododbora
    za carino in Pododbora za geografske označbe glede njihovih poslovnikov
  type: main
