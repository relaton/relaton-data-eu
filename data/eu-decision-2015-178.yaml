    otázky, Podvýboru pre clá a Podvýboru pre zemepisné označenia zriadených
    Dohodou o pridružení medzi Európskou úniou a Európskym spoločenstvom pre
    atómovú energiu a ich členskými štátmi na jednej strane a Moldavskou republikou
    na strane druhej, pokiaľ ide o prijatie rozhodnutí Podvýboru pre sanitárne
    a fytosanitárne otázky, Podvýboru pre clá a Podvýboru pre zemepisné označenia
    o ich rokovacích poriadkoch
  type: main
