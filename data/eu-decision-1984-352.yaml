title:
- language: en
  script: Latn
  content: '84/352/EEC: Commission Decision of 13 June 1984 authorizing the French
    Republic to apply intra-Community surveillance to imports of apricots originating
    in Spain which have been put into free circulation in the other Member States
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/352/CEE: Décision de la Commission du 13 juin 1984 autorisant la République
    française à instaurer une surveillance intracommunautaire des importations d''abricots
    originaires d''Espagne mis en libre pratique dans les autres Etats membres (Le
    texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/352/EWG: Entscheidung der Kommission vom 13. Juni 1984 mit der die
    Französische Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Spanien stammenden und in den übrigen Mitgliedstaaten im
    freien Verkehr befindlichen Aprikosen ermächtigt wird (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/352/EØF: Kommissionens beslutning af 13. juni 1984 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførslen
    af abrikoser, der har oprindelse i Spanien og er overgået til fri omsætning
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/352/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Ιουνίου 1984 με την οποία χορηγείται άδεια στη
    Γαλλική Δημοκρατία να θέσει υπό κοινοτική
    επίβλεψη τις εισαγωγές βερικόκων καταγωγής
    Ισπανίας, που έχουν τεθεί σε ελεύθερη κυκλοφορία
    στα άλλα κράτη μέλη (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/352/CEE: Decisione della Commissione del 13 giugno 1984 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di albicocche originarie della Spagna e messe in libera pratica negli altri Stati
    membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/352/EEG: Beschikking van de Commissie van 13 juni 1984 houdende machtiging
    van de Franse Republiek tot instelling van een intracommunautair toezicht ten
    aanzien van de invoer van abrikozen, van oorsprong uit Spanje, die in de Gemeenschap
    in het vrije verkeer zijn gebracht (Slechts de tekst in de Franse taal is authentiek)'
  type: main
