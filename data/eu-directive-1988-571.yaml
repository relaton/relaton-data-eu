    varustettuja sähkölaitteita koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun neuvoston direktiivin 79/196/ETY mukauttamisesta tekniikan kehitykseen
  type: main
- language: it
  script: Latn
  content: Direttiva 88/571/CEE della Commissione del 10 novembre 1988 che adegua
    al progresso tecnico la direttiva 79/196/CEE del Consiglio riguardante il ravvicinamento
    delle legislazioni degli Stati Membri relative al materiale elettrico destinato
    ad essere utilizzato in "atmosfera esplosiva", per il quale si applicano taluni
    metodi di protezione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 88/571/EEG van de Commissie van 10 november 1988 tot aanpassing
    aan de vooruitgang van de techniek van Richtlijn 79/196/EEG van de Raad inzake
    de onderlinge aanpassing van de wetgevingen van de Lid- Staten betreffende elektrisch
    materieel, bestemd voor gebruik in "explosieve omgeving", dat aan bepaalde beveiligingswijzen
    voldoet
  type: main
- language: pt
  script: Latn
