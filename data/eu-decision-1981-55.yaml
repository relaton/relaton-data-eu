title:
- language: en
  script: Latn
  content: '81/55/EEC: Commission Decision of 19 January 1981 authorizing the French
    Republic not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste) originating in South Korea, the People''s Republic of
    China and Thailand (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/55/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues originaires de Corée du Sud, de la
    République populaire de Chine et de Thaïlande (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/55/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea, der Volksrepublik China und Thailand
    stammende Gewebe aus synthetischen Spinnfasern von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/55/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre, syntetiske eller regenererede, med oprindelse i Sydkorea,
    Den kinesiske Folkerepublik og Thailand (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/55/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    τά υφάσματα εξ υφαντικών συνθετικών ινών μή
    συνεχών, καταγόμενα από τή Νότια Κορέα, τή Λαϊκή
    Δημοκρατία τής Κίνας καί τήν Ταϋλάνδη (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/55/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche in fiocco originarie della Corea del Sud, della Repubblica
    popolare cinese e della Tailandia (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/55/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van de Franse Republiek om weefsels van synthetische stapelvezels, van oorsprong
    uit Zuid-Korea, de Volksrepubliek China en Thailand, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
