title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 910/92 of 8 April 1992 re-establishing the
    levying of customs duties on products of category 156 (order No 42.1560), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 910/92 de la Commission du 8 avril 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    156 (numéro d'ordre 42.1560) originaires de Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 910/92 DER KOMMISSION vom 8. April 1992 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 156 (laufende
    Nummer 42.1560) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden#
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 910/92 af 8. april 1992 om genindførelse
    af opkrævning af told for varer under kategori 156 (løbenummer 42.1560), som
    har oprindelse i Kina, og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 910/92 της Επιτροπής
    της 8ης Απριλίου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    156 (αύξων αριθμός 42.1560) καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 910/92 DELLA COMMISSIONE dell'' 8 aprile 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 156 (numero d'' ordine 42.1560), originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 910/92 VAN DE COMMISSIE van 8 april 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 156 (volgnummer 42.1560), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 910/92 DA COMISSÃO de 8 de Abril de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 156
    (número de ordem 42.1560), originários da China, beneficiários das preferências
    pautais previstas no Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 910/92 DE LA COMISIÓN de 8 de abril de 1992 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 156 (número de orden 42.1560), originarios
    de China, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3832/90 del Consejo #'
