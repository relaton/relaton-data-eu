  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2049 of 24 November 2021 renewing
    the approval of the active substance cypermethrin as a candidate for substitution
    in accordance with Regulation (EC) No 1107/2009 of the European Parliament and
    of the Council concerning the placing of plant protection products on the market,
    and amending the Annex to Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
