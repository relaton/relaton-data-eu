    substance dont la substitution est envisagée, conformément au règlement (CE)
    no 1107/2009 du Parlement européen et du Conseil concernant la mise sur le marché
    des produits phytopharmaceutiques, et modifiant l’annexe du règlement d’exécution
    (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
