  script: Latn
  content: Council Regulation (EC) No 1295/2004 of 12 July 2004 amending Regulation
    (EC) No 1599/1999 imposing a definitive countervailing duty on imports of stainless
    steel wire with a diameter of 1 mm or more originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1295/2004 du Conseil du 12 juillet 2004 modifiant le
    règlement (CE) n° 1599/1999 instituant un droit compensateur définitif sur
    les importations de fils en aciers inoxydables d'un diamètre égal ou supérieur
    à un millimètre, originaires de l'Inde
  type: main
- language: de
  script: Latn
