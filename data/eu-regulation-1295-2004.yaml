    u li joriġina fl-Indja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1295/2004 van de Raad van 12 juli 2004 tot wijziging
    van Verordening (EG) nr. 1599/1999 tot instelling van een definitief compenserend
    recht op roestvrij staaldraad met een diameter van 1 mm of meer uit India
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1295/2004 z dnia 12 lipca 2004 r. zmieniające
