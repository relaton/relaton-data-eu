    und Ausbreitung von Schadorganismen der Pflanzen und Pflanzenerzeugnisse und zur
    Änderung der Richtlinie 91/683/EWG
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 93/19/EØF af 19. april 1993 om ændring af direktiv 77/93/EØF
