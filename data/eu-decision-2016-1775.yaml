id: EUDecision20161775
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1775 of 4 October 2016 amending
    Decision 93/195/EEC by adding Qatar to the list of third countries from which
    Member States authorise the re-entry into Union territory of registered horses
    which have been temporarily exported for a period of less than 90 days to take
    part in International Group/Grade meetings (notified under document C(2016) 6270)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1775 de la Commission du 4 octobre 2016
    modifiant la décision 93/195/CEE par l'inscription du Qatar sur la liste des
    pays tiers en provenance desquels les États membres autorisent la réadmission
    sur le territoire de l'Union européenne de chevaux enregistrés après une exportation
    temporaire de moins de quatre-vingt-dix jours pour participer à des réunions
    internationales par groupes ou catégories [notifiée sous le numéro C(2016)
    6270]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/1775 der Kommission vom 4. Oktober 2016
    zur Änderung der Entscheidung 93/195/EWG durch Aufnahme von Katar in die Liste
    der Drittländer, aus denen die Mitgliedstaaten die Wiedereinfuhr registrierter
    Pferde in das Hoheitsgebiet der Union zulassen, die für einen Zeitraum von weniger
    als 90 Tagen ausgeführt wurden, um an internationalen Gruppen-/Klassenrennen
    teilzunehmen (Bekannt gegeben unter Aktenzeichen C(2016) 6270)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/1775 на Комисията
    от 4 октомври 2016 година за изменение на Решение
    93/195/ЕИО чрез добавяне на Катар в списъка на
    третите страни, от които държавите членки разрешават
    повторно въвеждане на територията на Съюза
    на регистрирани коне, които са били временно
    изнесени за период от по-малко от 90 дни, за да
    участват в международни срещи за групата/класа
    (нотифицирано под номер С(2016) 6270)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/1775 ze dne 4. října 2016,
    kterým se mění rozhodnutí 93/195/EHS doplněním Kataru na seznam třetích
    zemí, z nichž členské státy povolují zpětný dovoz evidovaných koní na
    území Unie poté, co byli dočasně vyvezeni na dobu kratší než 90 dnů za
    účelem účasti na mezinárodních setkáních ve skupinách nebo kategoriích
    (oznámeno pod číslem C(2016) 6270)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/1775 af 4. oktober 2016
    om ændring af beslutning 93/195/EØF ved at tilføje Qatar til listen over tredjelande,
    hvorfra medlemsstaterne tillader genindførsel til Unionen af registrerede heste,
    som været midlertidigt udført i en periode på højst 90 dage for at deltage
    i internationale gruppeløb (meddelt under nummer C(2016) 6270)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/1775 της Επιτροπής,
    της 4ης Οκτωβρίου 2016, για την τροποποίηση της
    απόφασης 93/195/ΕΟΚ με την προσθήκη του Κατάρ
    στον κατάλογο των τρίτων χωρών από τις οποίες
    τα κράτη μέλη εγκρίνουν την επανείσοδο στο
    έδαφος της Ένωσης εγγεγραμμένων ίππων που
    είχαν εξαχθεί προσωρινά για περίοδο μικρότερη
    των 90 ημερών για συμμετοχή σε διεθνείς διοργανώσεις
    [κοινοποιηθείσα υπό τον αριθμό C(2016) 6270]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/1775, 4. oktoober 2016, millega muudetakse
    otsust 93/195/EMÜ, et lisada Katar selliste kolmandate riikide loetellu, millest
    liikmesriigid lubavad registreeritud hobuste taassisenemist liidu territooriumile
    pärast ajutist eksporti vähem kui 90 päevaks, et osaleda International Groupi/Grade'i
    võistlustes (teatavaks tehtud numbri C(2016) 6270 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/1775, annettu 4 päivänä
    lokakuuta 2016, päätöksen 93/195/ETY muuttamisesta lisäämällä Qatar niiden
    kolmansien maiden luetteloon, joista jäsenvaltiot sallivat rekisteröityjen hevosten
    takaisintuonnin unioniin kansainvälisiin ryhmä/luokkakilpailuihin osallistumista
    varten tapahtuneen alle 90 päivää kestäneen tilapäisen maastaviennin jälkeen
    (tiedoksiannettu numerolla C(2016) 6270)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/1775 оd 4. listopada 2016. o izmjeni
    Odluke 93/195/EEZ dodavanjem Katara na popis trećih zemalja iz kojih države
    članice odobravaju ponovni ulazak na područje Unije registriranih konja koji
    su privremeno izvezeni na razdoblje kraće od 90 dana radi sudjelovanja u međunarodnim
    susretima grupa/razreda (priopćeno pod brojem dokumenta C(2016) 6270)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1775 végrehajtási határozata (2016. október
    4.) Katar azon harmadik országok jegyzékébe való felvételével, amelyekből
    a tagállamok engedélyezik a törzskönyvezett lovaknak a nemzetközi csoport-/osztályversenyeken
    való részvétel céljából 90 napnál rövidebb időre történt ideiglenes
    kivitelét követő, az Unió területére történő újrabehozatalát, a 93/195/EGK
    határozat módosításáról (az értesítés a C(2016) 6270. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/1775 della Commissione, del 4 ottobre
    2016, che modifica la decisione 93/195/CEE aggiungendo il Qatar all'elenco dei
    paesi terzi da cui gli Stati membri autorizzano la reintroduzione nel territorio
    dell'Unione di cavalli registrati che sono stati temporaneamente esportati per
    un periodo inferiore a 90 giorni al fine di partecipare a competizioni internazionali
    [notificata con il numero C(2016) 6270]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/1775 (2016. gada 4. oktobris),
    ar ko groza Lēmumu 93/195/EEK, pievienojot Kataru to trešo valstu sarakstam,
    no kurām dalībvalstis atļauj ievest atpakaļ Savienības teritorijā reģistrētus
    zirgus, kas izvesti uz laiku līdz 90 dienām, lai piedalītos starptautiskos
    pasākumos pa grupām/kategorijām (izziņots ar dokumenta numuru C(2016) 6270)
  type: main
- language: lt
  script: Latn
  content: 2016 m. spalio 4 d. Komisijos įgyvendinimo sprendimas (ES) 2016/1775,
    kuriuo iš dalies keičiamas Sprendimas 93/195/EEB įrašant Katarą į trečiųjų
    šalių, iš kurių valstybės narės leidžia pakartotinai įvežti į Sąjungos
    teritoriją registruotus arklius, kurie buvo laikinai eksportuoti trumpesniam
    negu 90 dienų laikotarpiui dalyvauti tarptautinėse grupės ir (arba) lygio varžybose,
    sąrašą (pranešta dokumentu Nr. C(2016) 6270)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1775 tal-4 ta'
    Ottubru 2016 li temenda d-Deċiżjoni 93/195/KEE billi żżid lil Qatar mal-lista
    ta' pajjiżi terzi li minnhom l-Istati Membri jawtorizzaw id-dħul mill-ġdid
    fl-Unjoni ta' żwiemel reġistrati li jkunu ġew temporanjament esportati għal
    perjodu ta' inqas minn 90 jum biex jieħdu sehem f'kompetizzjonijiet internazzjonali
    (notifikata bid-dokument C(2016) 6270)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/1775 van de Commissie van 4 oktober 2016 tot
    wijziging van Beschikking 93/195/EEG door toevoeging van Qatar aan de lijst van
    derde landen waaruit de lidstaten het opnieuw binnenbrengen van geregistreerde
    paarden op het grondgebied van de Unie toestaan, na tijdelijke uitvoer van minder
    dan negentig dagen voor deelname aan International Group/Grade meetings (Kennisgeving
    geschied onder nummer C(2016) 6270)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/1775 z dnia 4 października 2016 r.
    zmieniająca decyzję 93/195/EWG poprzez dodanie Kataru do wykazu państw trzecich,
    z których państwa członkowskie dopuszczają powrotny wwóz na terytorium Unii
    zarejestrowanych koni, które były tymczasowo wywiezione na okres krótszy niż
    90 dni w celu wzięcia udziału w międzynarodowych grupowych/stopniowych spotkaniach
    (notyfikowana jako dokument nr C(2016) 6270)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/1775 da Comissão, de 4 de outubro de
    2016, que altera a Decisão 93/195/CEE, acrescentando o Catar à lista de países
    terceiros a partir dos quais os Estados-Membros autorizam a reentrada em território
    da União de cavalos registados que tenham sido temporariamente exportados por
    um período inferior a 90 dias para participarem em encontros internacionais por
    grupo/escalão (Group/Grade) [notificada com o número C(2016) 6270]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/1775 a Comisiei din 4 octombrie
    2016 de modificare a Deciziei 93/195/CEE prin adăugarea Qatarului la lista țărilor
    terțe din care statele membre autorizează reintroducerea în Uniune a cailor
    înregistrați în urma unui export temporar pe o perioadă de mai puțin de 90
    de zile pentru a putea participa la evenimentele cu participare internațională
    pe grupe valorice [notificată cu numărul C(2016) 6270]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/1775 zo 4. októbra 2016, ktorým
    sa mení rozhodnutie 93/195/EHS pridaním Kataru do zoznamu tretích krajín,
    z ktorých členské štáty povoľujú opakovaný vstup registrovaných koní
    na územie Únie po tom, ako boli dočasne vyvezené na obdobie kratšie ako 90
    dní na účasť na podujatiach International Group/Grade [oznámené pod číslom
    C(2016) 6270]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/1775 z dne 4. oktobra 2016 o spremembi
    Odločbe 93/195/EGS zaradi uvrstitve Katarja na seznam tretjih držav, iz katerih
    države članice dovolijo ponovni vstop na ozemlje Unije registriranih konjev,
    ki so bili začasno izvoženi za obdobje, krajše od 90 dni, za udeležbo na mednarodnih
    tekmovanjih (notificirano pod dokumentarno številko C(2016) 6270)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/1775 de la Comisión, de 4 de octubre
    de 2016, por la que se modifica la Decisión 93/195/CEE con la adición de Qatar
    a la lista de terceros países a partir de los cuales los Estados miembros autorizan
    la reintroducción en la Unión de caballos registrados que hayan sido exportados
    temporalmente por un período inferior a noventa días para participar en certámenes
    internacionales por grupo y categoría [notificada con el número C(2016) 6270]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/1775 av den 4 oktober 2016
    om ändring av beslut 93/195/EEG genom att lägga till Qatar i den förteckning
    över tredjeländer från vilka medlemsstaterna tillåter återinförsel till
    unionen av registrerade hästar som tillfälligt har exporterats under en period
    som understiger 90 dagar för att delta i internationella grupplöpningar [delgivet
    med nr C(2016) 6270]
