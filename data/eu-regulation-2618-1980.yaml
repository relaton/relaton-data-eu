title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2618/80 of 7 October 1980 instituting a specific
    Community regional development measure contributing to improving security of energy
    supply in certain Community regions by way of improved use of new techniques for
    hydro-electrical power and alternative energy sources
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2618/80 du Conseil, du 7 octobre 1980, instituant
    une action communautaire spécifique de développement régional contribuant à
    améliorer la sécurité des approvisionnements en énergie de certaines régions
    de la Communauté par une meilleure utilisation des technologies nouvelles en
    matière d'hydro- électricité et d'énergies alternatives
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2618/80 des Rates vom 7. Oktober 1980 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung in Hinblick
    auf die Verbesserung der Sicherheit der Energieversorgung in einigen Gebieten
    der Gemeinschaft durch eine stärkere Nutzung neuer Technologien im Bereich der
    Stromgewinnung aus Wasserkraft und den Ausbau alternativer Energiequellen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2618/80 af 7. oktober 1980 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til større sikkerhed for energiforsyningen til visse regioner i Fællesskabet
    gennem en bedre udnyttelse af den nye teknologi i forbindelse med vandkraft og
    alternative energiformer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2618/80 του Συμβουλίου
    της 7ης Οκτωβρίου 1980 περί αναλήψεως ειδικής
    κοινοτικής ενεργείας περιφερειακής αναπτύξεως
    για τη συμβολή στη βελτίωση της ασφαλείας των
    προμηθειών σε ενέργεια ορισμένων περιφερειών
    της Κοινότητος δια της καλυτέρας χρησιμοποιήσεως
    των νέων τεχνολογιών στον τομέα της υδροηλεκτρικής
    ενεργείας και των εναλλακτικών πηγών ενεργείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2618/80 del Consiglio, del 7 ottobre 1980, che istituisce
    un'azione comunitaria specifica di sviluppo regionale per contribuire ad una maggiore
    sicurezza degli approvvigionamenti energetici di talune regioni della Comunità
    mediante una migliore utilizzazione delle nuove tecnologie in materia di idroelettricità
    e di energie alternative
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2618/80 van de Raad van 7 oktober 1980 tot instelling
    van een specifieke communautaire actie voor regionale ontwikkeling om bij te dragen
    tot een grotere veiligstelling van de energievoorziening in sommige regio's van
    de Gemeenschap door een beter gebruik van nieuwe technieken inzake stroomopwekking
    uit waterkracht en inzake alternatieve energiebronnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2618/80 do Conselho, de 7 de Outubro de 1980, que
    institui uma acção comunitária específica de desenvolvimento regional para
    contribuir para melhorar a segurança do abastecimento em energia de certas regiões
    da Comunidade através de uma melhor utilização das novas tecnologias em matéria
    de energia hidroeléctrica e de energias alternativas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2618/80 del Consejo, de 7 de octubre de 1980, por
    el que se establece una acción comunitaria específica de desarrollo regional
    que contribuya a mejorar la seguridad en los abastecimientos de energía de algunas
    regiones de la Comunidad mediante una mejor utilización de las nuevas tecnologías
    en materia hidroeléctrica y de energías alternativas
  type: main
