title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2649/78 of 10 November 1978 re-establishing
    the levying of customs duties on gelatin and gelatin derivatives, falling within
    subheading 35.03 ex B and originating in Colombia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2649/78 de la Commission, du 10 novembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés, de la sous-position tarifaire 35.03 ex B, originaires de Colombie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2649/78 der Kommission vom 10. November 1978 zur Wiedereinführung
    des Zollsatzes fúr Gelatine und ihre Derivate der Tarifstelle 35.03 ex B, mit
    Ursprung in Kolumbien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2649/78 af 10. november 1978 om genindførelse
    af opkrævning af toldafgifter for gelatine og gelatinederivater, under underposition
    35.03 ex B, som har oprindelse i Colombia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2649/78 della Commissione, del 10 novembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati,
    della sottovoce 35.03 ex B della tariffa doganale comune, originari della Colombia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2649/78 van de Commissie van 10 november 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op gelatine
    en de derivaten daarvan, van post 35.03 ex B, van oorsprong uit Columbia ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
