title:
- language: en
  script: Latn
  content: '79/213/EEC: Commission Decision of 6 February 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, of
    wool, cotton or of man-made textile fibres, falling within heading No ex 61.03
    of the Common Customs Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating
    in Hong Kong and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/213/CEE: Décision de la Commission, du 6 février 1979, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées, pour hommes et garçonnets, de laine, de coton ou de
    fibres textiles synthétiques ou artificielles, de la position ex 61.03 du tarif
    douanier commun (codes Nimexe: 61.03-11, 15, 19) catégorie 8, originaires de
    Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/213/EWG: Entscheidung der Kommission vom 6. Februar 1979, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden,
    aus Wolle, Baumwolle und synthetischen Geweben, für Männer und Knaben, der Tarifnummer
    ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern: 61.03-11; 15; 19) (Kategorie
    8) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/213/EØF: Kommissionens beslutning af 6. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage skjorter, herunder
    sports- og arbejdsskjorter, af vævede stoffer til mænd og drenge, af uld, bomuld
    eller syntetiske fibre, som henhører under pos. ex 61.03 i den fælles toldtarif
    (NIMEXE-nummer 61.03-11, 15, 19) kategori 8, har oprindelse i Hongkong og frit
    kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/213/CEE: Decisione della Commissione, del 6 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e camicette
    tessute, per uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche
    della voce ex 61.03 della tariffa doganale comune (codice Nimexe: 61.03-11; 15;
    19) (categoria 8), originarie di Hong Kong e messe in libera pratica negli altri
    stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/213/EEG: Beschikking van de Commissie van 6 februari 1979 waarbij de
    Franse Republiek wordt gemachtigd overhemden en sporthemden, geweven, voor heren
    en jongens, van wol, van katoen of van synthetische of kunstmatige textielvezels,
    van post ex 61.03 van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11,
    15, 19) (categorie 8), van oorsprong uit Hong-Kong en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
