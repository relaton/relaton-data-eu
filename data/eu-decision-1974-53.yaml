title:
- language: en
  script: Latn
  content: "(74/53/EEC): * Commission Decision of 21 December 1973 authorizing the French Republic not to apply Community treatment to deep-frozen asparagus for retail sale falling within heading No 07.02 ex B of the Common Customs Tariff, originating in Taïwan and in free circulation in Belgium"
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 décembre 1973, autorisant la République
    française à exclure du traitement communautaire les asperges surgelées conditionnées
    pour la vente au détail, de la position 07.02 Ex B du Tarif douanier commun originaires
    de Taiwan et mises en libre pratique en Belgique
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in Belgien im freien Verkehr
    befindliche und für den Detailhandel bestimmte tiefgefrorene Spargel der Tarifnummer
    07.02 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage dybfrosne asparges emballeret
    for detailsalg, som henhører under position 07.02 ex B i den fælles toldtarif,
    har oprindelse i Taïwan og frit kan omsættes i Belgien
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1973, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli asparagi surgelati condizionati
    per la vendita al minuto della voce n. 07.02 ex B della tariffa doganale comune,
    originari di Taiwan e messi in libera pratica nel Belgio
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 waarbij de Franse Republiek
    wordt gemachigd diepbevroren asperges gereed voor de detailverkoop van post 07.02
    ex B van het gemeenschappelijk douanetarief, van oorsprong uit Taïwan en in België
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
