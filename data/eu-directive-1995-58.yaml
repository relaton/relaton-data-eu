    dei prodotti alimentari ai fini della protezione dei consumatori e la direttiva
    88/314/CEE concernente l'indicazione dei prezzi dei prodotti non alimentari ai
    fini della protezione dei consumatori
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/58/EG van het Europees Parlement en de Raad van 29 november
    1995 tot wijziging van Richtlijn 79/581/EEG inzake de bescherming van de consument
    op het gebied van de prijsaanduiding van levensmiddelen en van Richtlijn 88/314/EEG
    inzake de bescherming van de consument op het gebied van de prijsaanduiding van
    niet voor de voeding bestemde produkten
  type: main
- language: pt
