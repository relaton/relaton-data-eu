    αφορά την αναγραφή των τιμών των μη εδώδιμων
    προϊόντων
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 95/58/EY, annettu 29 päivänä
    marraskuuta 1995, kuluttajansuojasta elintarvikkeiden hintojen ilmoittamisessa
