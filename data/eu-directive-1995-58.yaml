  script: Latn
  content: Directive 95/58/EC of the European Parliament and of the Council of 29
    November 1995 amending Directive 79/581/EEC on consumer protection in the indication
    of the prices of foodstuffs and Directive 88/314/EEC on consumer protection in
    the indication of the prices of non-food products
  type: main
- language: fr
  script: Latn
  content: Directive 95/58/CE du Parlement européen et du Conseil, du 29 novembre
    1995, modifiant la directive 79/581/CEE relative à la protection des consommateurs
    en matière d'indication des prix des denrées alimentaires et la directive 88/314/CEE
    relative à la protection des consommateurs en matière d'indication des prix
    des produits non alimentaires
  type: main
- language: de
  script: Latn
