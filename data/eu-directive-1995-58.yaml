    bei der Angabe der Preise für Lebensmittel und der Richtlinie 88/314/EWG über
    den Schutz der Verbraucher bei der Angabe der Preise für andere Erzeugnisse als
    Lebensmittel
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 95/58/EF af 29. november 1995 om
