title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 415/80 of 20 February 1980 re-establishing
    the levying of customs duties on other articles made from yarn, twine, cordage,
    rope or cables, products of category 98 (code 0980), originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 415/80 de la Commission, du 20 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux articles
    fabriqués avec des fils, ficelles, cordes ou cordages de la catégorie 98 (code
    0980), originaires de Corée du Sud, bénéficiaire des préferences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 415/80 der Kommission vom 20. Februar 1980 über die
    Wiedereinführung des Zollsatzes für Waren aus Garnen, Bindfäden, Seilen oder
    Tauen der Warenkategorie Nr. 98 (Kennziffer 0980), mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 415/80 af 20. februar 1980 om genindførelse
    af opkrævning af toldafgifter for varer fremstillet af garn, sejlgarn, reb og
    tovværk, under kategori 98 (kode 0980), som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 415/80 della Commissione, del 20 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai manufatti ottenuti
    con l' impiego di filati, spago, corde e funi, della categoria di prodotti n.
    98 (codice 0980), originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 415/80 van de Commissie van 20 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op artikelen
    vervaardigd van garen, van bindgaren, van touw of van kabel, van de categorie
    van produkten nr. 98 (codenummer 0980), van oorsprong uit Zuid-Korea, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79
    van de Raad
  type: main
