  script: Latn
  content: Commission Regulation (EC) No 33/2005 of 10 January 2005 initiating a ‘new
    exporter’ review of Council Regulation (EC) No 2604/2000 imposing definitive
    anti-dumping duties on imports of certain polyethylene terephthalate (PET) originating,
    inter alia, in India, repealing the duty with regard to imports from one exporter
    in this country and making these imports subject to registration
  type: main
- language: fr
