    Nordirland und mancher seiner unmittelbar der englischen Krone unterstehenden
    Gebiete in die Liste von Drittländern, Gebieten, Zonen und Kompartimenten, aus
    denen die Einfuhr von Sendungen mit Geflügel und Geflügelerzeugnissen in die
    Union zugelassen ist
  type: main
