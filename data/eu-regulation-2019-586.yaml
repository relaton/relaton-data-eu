- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/586 of 11 April 2019 amending
    Part 1 of Annex I to Commission Regulation (EC) No 798/2008 as regards the inclusion
    of the United Kingdom of Great Britain and Northern Ireland and certain of its
    Crown Dependencies in the list of third countries, territories, zones or compartments
    authorised for the introduction into the Union of consignments of poultry and
    poultry products
  type: main
- language: fr
  script: Latn
