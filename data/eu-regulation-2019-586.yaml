    modifiant l'annexe I, partie 1, du règlement (CE) n° 798/2008 de la Commission
    en ce qui concerne l'inscription du Royaume-Uni de Grande-Bretagne et d'Irlande
    du Nord et de certaines dépendances de la Couronne sur la liste des pays tiers,
    territoires, zones ou compartiments en provenance desquels l'introduction dans
    l'Union de lots de volailles et de produits de volailles est autorisée
  type: main
- language: de
