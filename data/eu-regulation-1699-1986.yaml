    suoi esteri della sottovoce 29.15 A I della tariffa doganale comune originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1699/86 van de Commissie van 30 mei 1986 houdende
