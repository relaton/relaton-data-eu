title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1699/86 of 30 May 1986 re-establishing the
    levying of customs duties on oxalic acid and its salts and esters, falling within
    subheading 29.15 A I, originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1699/86 de la Commission du 30 mai 1986 portant rétablissement
    de la perception des droits de douane applicables à l' acide oxalique, ses sels
    et ses esters, de la sous-position 29.15 A I du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1699/86 der Kommission vom 30. Mai 1986 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester, der Tarifstelle
    29.15 A I des Gemeinsamen Zolltarifs, mit Ursprung in Brasilien, dem die in der
    Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1699/86 af 30. maj 1986 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf henhørende under
    position 29.15 A I i den fælles toldtarif og med oprindelse i Brasilien, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
