  content: '82/197/EEC: Commission Decision of 17 March 1982 establishing that the
    apparatus described as ''Varian- linear accelerator, model Clinac 20'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/197/CEE: Décision de la Commission, du 17 mars 1982, constatant que
