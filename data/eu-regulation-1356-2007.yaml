    auf die Einfuhren bestimmter Säcke und Beutel aus Kunststoffen mit Ursprung in
    der Volksrepublik China und Thailand und zur Einstellung des Verfahrens betreffend
    die Einfuhren bestimmter Säcke und Beutel aus Kunststoffen mit Ursprung in Malaysia
  type: main
