  content: Council Regulation (EC) No 1356/2007 of 19 November 2007 amending Regulation
    (EC) No 1425/2006 imposing a definitive anti-dumping duty on imports of certain
    plastic sacks and bags originating in the People’s Republic of China and Thailand,
    and terminating the proceeding on imports of certain plastic sacks and bags originating
    in Malaysia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1356/2007 du Conseil du 19 novembre 2007 modifiant
    le règlement (CE) n° 1425/2006 instituant un droit antidumping définitif sur
    les importations de certains sacs et sachets en matières plastiques originaires
    de la République populaire de Chine et de Thaïlande et clôturant la procédure
    concernant les importations de certains sacs et sachets en matières plastiques
    originaires de Malaisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1356/2007 des Rates vom 19. November 2007 zur Änderung
