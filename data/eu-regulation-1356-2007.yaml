    Republiki Ludowej i Tajlandii oraz kończące postępowanie dotyczące przywozu
    niektórych worków i toreb plastikowych pochodzących z Malezji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1356/2007 do Conselho, de 19 de Novembro de 2007
