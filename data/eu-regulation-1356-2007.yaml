    fuq l-importazzjonijiet ta’ ċerti xkejjer u boroż tal-plastik li joriġinaw
    fir-Repubblika tal-Poplu taċ-Ċina u fit-Tajlandja, u li jtemm il-proċediment
    dwar l-importazzjonijiet ta’ ċerti xkejjer u boroż tal-plastik li joriġinaw
    fil-Malażja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1356/2007 van de Raad van 19 november 2007 tot wijziging
