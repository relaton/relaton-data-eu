    definitivo sobre as importações de determinados sacos de plástico de quaisquer
    dimensões originários da República Popular da China e da Tailândia e que encerra
    o processo relativo às importações de determinados sacos de plástico de quaisquer
    dimensões originários da Malásia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1356/2007 al Consiliului din 19 noiembrie 2007 de
    modificare a Regulamentului (CE) nr. 1425/2006 de instituire a unui drept antidumping
    definitiv la importurile unor saci și pungi din materiale plastice originare
    din Republica Populară Chineză și din Thailanda și de închidere a procedurii
    privind importurile unor saci și pungi din materiale plastice originare din Malaezia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1356/2007 z 19. novembra 2007 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1425/2006, ktorým sa ukladá konečné antidumpingové
    clo na dovoz určitých plastových vriec a vrecúšok s pôvodom v Čínskej
    ľudovej republike a Thajsku a ukončuje sa konanie týkajúce sa dovozu určitých
    plastových vriec a vrecúšok s pôvodom v Malajzii
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1356/2007 z dne 19. novembra 2007 o spremembi Uredbe
    Sveta (ES) št. 1425/2006 o uvedbi dokončne protidampinške dajatve na uvoz nekaterih
    vreč in vrečk iz plastičnih mas s poreklom iz Ljudske republike Kitajske in
