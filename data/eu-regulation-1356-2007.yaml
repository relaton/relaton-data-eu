    en tot staking van de procedure betreffende de invoer van bepaalde kunststof zakken
    uit Maleisië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1356/2007 z dnia 19 listopada 2007 r. zmieniające
