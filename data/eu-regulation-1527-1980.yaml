title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1527/80 of 18 June 1980 amending Regulation
    (EEC) No 2925/78 with regard to the period of suspension of application of the
    prices condition to which import into the Community of certain types of citrus
    fruit originating in Spain is subject
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1527/80 du Conseil, du 18 juin 1980, modifiant le
    règlement (CEE) n° 2925/78 en ce qui concerne la période de suspension de l'
    application de la condition de prix à laquelle est soumise l' importation dans
    la Communauté de certains agrumes originaires d' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1527/80 des Rates vom 18. Juni 1980 zur Änderung
    der Verordnung (EWG) Nr. 2925/78 hinsichtlich des Zeitraums der Aussetzung der
    Preisbedingung für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung in Spanien
    in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1527/80 af 18. juni 1980 om ændring af forordning
    (EØF) nr. 2925/78 for så vidt angår perioden for suspension af anvendelsen
    af den prisbetingelse, som indførsel til Fællesskabet af en række citrusfrugter
    med oprindelse i Spanien er underlagt
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1527/80 del Consiglio, del 18 giugno 1980, che modifica
    il regolamento (CEE) n. 2925/78 per quanto concerne il periodo di sospensione
    dell' applicazione della condizione in materia di prezzi cui sono subordinate
    le importazioni nella Comunità di taluni agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1527/80 van de Raad van 18 juni 1980 tot wijziging
    van Verordening (EEG) nr. 2925/78 voor wat betreft de periode van schorsing van
    de toepassing van de voorwaarde betreffende de prijs waaraan de invoer in de Gemeenschap
    van sommige citrusvruchten van oorsprong uit Spanje is onderworpen
  type: main
