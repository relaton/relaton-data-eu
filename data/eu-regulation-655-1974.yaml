title:
- language: en
  script: Latn
  content: Regulation (EEC) No 655/74 of the Council of 21 March 1974 temporarily
    and partially suspending the autonomous duties in the Common Customs Tariff on
    fresh sweet oranges of subheading No ex 08.02 A I a) and on grapefruit, of subheading
    No 08.02 D
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 655/74 du Conseil, du 21 mars 1974, portant suspension
    temporaire et partielle des droits autonomes du tarif douanier commun sur les
    oranges douces, fraîches de la sous-position EX 08.02 A I a) et sur les pamplemousses
    et pomelos de la sous-position 08.02
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 655/74 des Rates vom 21. März 1974 zur zeitweiligen
    und teilweisen Aussetzung der autonomen Zollsätze des Gemeinsamen Zolltarifs
    für frische Süßorangen der Tarifstelle ex 08.02 A I a) sowie für Pampelmusen
    und Grapefruits der Tarifstelle 08.02 D
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 655/74 af 21. marts 1974 om midlertidig og
    delvis suspension af de autonome satser i den fælles toldtarif for friske appelsiner,
    henhørende under pos. 08.02 A I a) og for grapefrugter henhørende under pos.
    08.02 D
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 655/74 del Consiglio, del 21 marzo 1974, recante sospensione
    temporanea e parziale dei dazi autonomi della tariffa doganale comune sulle arance
    dolci, fresche della sottovoce n. ex 08.02 A I a) e sui pompelmi e pomeli della
    sottovoce n. 08.02 D
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 655/74 van de Raad van 21 maart 1974 houdende tijdelijke
    schorsing van de autonome rechten van het gemeenschappelijk douanetarief voor
    andere sinaasappelen dan pomeransen (bittere oranjeappelen), vers, van onderverdeling
    ex 08.02 A I a), en voor pompelmoezen en pomelo's van onderverdeling 08.02 D
  type: main
