title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3035/82 of 16 November 1982 re-establishing
    the levying of customs duties on other outer garments and clothing accessories,
    products of category 75 (code 0750) originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3035/82 de la Commission, du 16 novembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres vêtements
    de dessus et accessoires du vêtement de la catégorie 75 (code 0750), originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3035/82 der Kommission vom 16. November 1982 über
    die Wiedereinführung des Zollsatzes für andere Oberkleidung und Bekleidungszubehör
    der Warenkategorie Nr. 75 (Kennziffer 0750), mit Urprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 3602/81 des Rates vorgesehenen Zollpräferenzen gewährt
    werdenU
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3035/82 af 16. november 1982 om genindførelse
    af opkrævning af toldafgifter for andre yderbeklædningsgenstande og tilbehør
    til beklædningsgenstande, under kategori nr. 75 (kode 0750), som har oprindelse
    i Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3035/82 τής Επιτροπής
    τής 16ης Νοεμβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών τελωνειακών δασμών γιά εξωτερικά
    καί συμπληρώματα τού ενδύματος τής κατηγορίας
    75 (κωδικός 0750), καταγωγής Νοτίου Κορέας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (EOK) αριθ.
    3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3035/82 della Commissione, del 16 novembre 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli altri indumenti esterni
    ed accessori di abbigliamento, della categoria di prodotti n. 75 (codice 0750),
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3602/81 del Consigliod
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3035/82 van de Commissie van 16 november 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere bovenkleding
    en kledingtoebehoren van de categorie van produkten nr. 75 (codenummer 0750),
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3602/81 van de Raada
  type: main
