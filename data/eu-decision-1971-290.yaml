title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 juillet 1971, autorisant la République
    italienne à exclure du traitement communautaire les pellicules sensibilisées
    non impressionnées et les piles électriques, des positions 37.02 et 85.03 du
    Tarif douanier commun, originaires du Japon et mises en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '71/290/EWG: Entscheidung der Kommission vom 16. Juli 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen lichtempfindlichen Filme in Rollen
    oder Streifen, auch gelocht, nicht belichtet und Primärelemente und Primärbatterien
    der Tarifnummern 37.02 und 85.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/290/CEE: Decisione della Commissione, del 16 luglio 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le pellicole sensibilizzate
    non impressionate e le pile elettriche delle voci 37.02 e 85.03 della tariffa
    doganale comune, originarie del Giappone e messe in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/290/EEG: Beschikking van de Commissie van 16 juli 1971 waarbij de Italiaanse
    Republiek wordt gemachtigd lichtgevoelige, onbelichte films en elektrische elementen
    en elektrische batterijen van de posten 37.02 en 85.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
