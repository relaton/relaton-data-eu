id: EUDecision1994293
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '94/293/EC: Commission Decision of 13 April 1994 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of ammonium
    nitrate originating in Lithuania and Russia and terminating the investigation
    with regard to these countries as well as terminating the anti-dumping proceeding
    concerning imports of ammonium nitrate originating in Belarus, Georgia, Turkmenistan,
    Ukraine and Uzbekistan'
  type: main
- language: fr
  script: Latn
  content: '94/293/CE: Décision de la Commission, du 13 avril 1994, portant acceptation
    d''engagements offerts dans le cadre de la procédure antidumping concernant les
    importations de nitrate d''ammonium originaire de Lituanie et de Russie et clôturant
    l''enquête en ce qui concerne ces pays et par ailleurs clôturant la procédure
    antidumping concernant les importations de nitrate d''ammonium originaire de Biélorussie,
    de Géorgie, d''Ouzbékistan, du Turkménistan et d''Ukraine'
  type: main
- language: de
  script: Latn
  content: '94/293/EG: Beschluß der Kommission vom 13. April 1994 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Ammoniumnitrat mit Ursprung in Litauen und Rußland und über die Einstellung
    der Untersuchung gegenüber diesen Ländern sowie über die Einstellung des Antidumpingverfahrens
    betreffend die Einfuhren von Ammoniumnitrat mit Ursprung in Belarus, Georgien,
    Turkmenistan, der Ukraine und Usbekistan'
  type: main
- language: da
  script: Latn
  content: '94/293/EF: Kommissionens afgørelse af 13. april 1994 om godtagelse af
    tilsagn i forbindelse med antidumpingproceduren vedrørende importen af ammoniumnitrat
    med oprindelse i Litauen og Rusland og om afslutning af undersøgelsen vedrørende
    disse lande samt om afslutning af antidumpingproceduren vedrørende importen af
    ammoniumnitrat med oprindelse i Hviderusland, Georgien, Turkmenistan, Ukraine
    og Usbekistan'
  type: main
- language: el
  script: Grek
  content: '94/293/ΕΚ: Απόφαση της Επιτροπής της 13ης Απριλίου
    1994 για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν σε σχέση με τη διαδικασία αντιντάμπινγκ
    όσον αφορά τις εισαγωγές νιτρικού αμμωνίου
    καταγωγής Λιθουανίας και Ρωσίας και για την
    περάτωση της έρευνας όσον αφορά τις χώρες αυτές
    καθώς και για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές νιτρικού
    αμμωνίου καταγωγής Λευκορωσίας, Γεωργίας,
    Τουρκμενιστάν, Ουκρανίας και Ουζμπεκιστάν'
  type: main
- language: fi
  script: Latn
  content: '94/293/EY: Komission päätös, tehty 13 päivänä huhtikuuta 1994, Liettuasta
    ja Venäjältä peräisin olevan ammoniumnitraatin tuontia koskevan polkumyyntimenettelyn
    yhteydessä tarjottujen sitoumusten hyväksymisestä ja näitä maita koskevan
    tutkimuksen päättämisestä sekä Valko-Venäjältä, Georgiasta, Uzbekistanista,
    Turkmenistanista ja Ukrainasta peräisin olevan ammoniumnitraatin tuontia koskevan
    polkumyyntimenettelyn päättämisestä'
  type: main
- language: it
  script: Latn
  content: '94/293/CE: Decisione della Commissione, del 13 aprile 1994, che accetta
    gli impegni offerti nell''ambito del procedimento antidumping relativo alle importazioni
    di nitrato di ammonio originario della Lituania e della Russia e che chiude l''inchiesta
    per quanto riguarda questi paesi nonché il procedimento antidumping relativo
    alle importazioni di nitrato di ammonio originario della Bielorussia, della Georgia,
    del Turkmenistan, dell''Ucraina e dell''Uzbekistan'
  type: main
- language: nl
  script: Latn
  content: '94/293/EG: Besluit van de Commissie van 13 april 1994 tot aanvaarding
    van verbintenissen in verband met de anti-dumpingprocedure betreffende de invoer
    van ammoniumnitraat van oorsprong uit Litouwen en Rusland en tot beëindiging
    van het onderzoek ten aanzien van deze landen, alsmede tot beëindiging van de
    anti- dumpingprocedure betreffende de invoer van ammoniumnitraat van oorsprong
    uit Georgië, Oekraïne, Oezbekistan, Turkmenistan en Wit-Rusland'
  type: main
- language: pt
  script: Latn
  content: '94/293/CE: Decisão da Comissão, de 13 de Abril de 1994, que aceita os
    compromissos oferecidos no âmbito do processo anti-dumping relativo às importações
    de nitrato de amónio originário da Lituânia e da Rússia e que encerra o inquérito
    relativo a estes países, e que encerra o processo anti-dumping relativo às importações
    de nitrato de amónio originário da Bielorrússia, da Geórgia, do Turcomenistão,
    da Ucrânia e do Usbequistão'
  type: main
- language: es
  script: Latn
  content: '94/293/CE: Decisión de la Comisión, de 13 de abril de 1994, por la que
    se aceptan los compromisos ofrecidos en el marco del procedimiento antidumping
    relativo a las importaciones de nitrato de amonio originario de Lituania y Rusia,
    se da por concluida la investigación relativa a estos países, y por la que se
    da por concluido el procedimiento antidumping relativo a las importaciones de
    nitrato de amonio originario de Bielorrusia, Georgia, Turkmenistán, Ucrania y
    Uzbekistán'
  type: main
- language: sv
  script: Latn
  content: '94/293/EG: Kommissionens beslut av den 13 april 1994 om godkännande av
