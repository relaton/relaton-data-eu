    med ursprung i Litauen och Ryssland och om avslutande av undersökningen av dessa
    länder samt om avslutande av antidumpningförfarandet beträffande import av
    ammoniumnitrat med ursprung i Georgien, Turkmenistan, Ukraina, Uzbekistan och
    Vitryssland'
