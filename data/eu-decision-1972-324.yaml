title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 août 1972, autorisant le Royaume de
    Belgique et le Grand-Duché de Luxembourg à exclure du traitement communautaire
    les raisins de table de la position 08.04 A I du Tarif douanier commun, originaires
    de l'Espagne et de l'Albanie et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/324/EWG: Entscheidung der Kommission vom 14. August 1972, mit der das
    Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus Spanien
    und Albanien stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    Tafeltrauben der Tarifnummer 08.04 A I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/324/CEE: Decisione della Commissione, del 14 agosto 1972, che autorizza
    il Regno del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento
    comunitario le uve da tavola della voce n. 08.04 A I della tariffa doganale comune,
    originarie della Spagna e dell''Albania e messe in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/324/EEG: Beschikking van de Commissie van 14 augustus 1972 waarbij
    het Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd druiven
    voor tafelgebruik van post 08.04 A I van het gemeenschappelijk douanetarief, van
    oorsprong uit Spanje en Albanië en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
