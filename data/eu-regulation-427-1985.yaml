title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 427/85 of 20 February 1985 re-establishing
    the levying of customs duties on footwear, other, falling within subheading 64.02
    B and originating in Thailand, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 427/85 de la Commission du 20 février 1985 portant
    rétablissement de la perception des droits de douane applicables aux chaussures,
    autres, de la sous-position 64.02 B du tarif douanier commun, originaires de Thaïlande,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 427/85 der Kommission vom 20. Februar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe, andere, der Tarifstelle 64.02 B mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 427/85 af 20. februar 1985 om genindførelse
    af opkrævning af told for fodtøj, andre varer, henhørende under pos. 64.02
    B og med oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
