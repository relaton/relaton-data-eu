    санкциониране на пазарни злоупотреби в ситуации
    на трансгранична пазарна злоупотреба
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/885 ze dne 29. dubna
    2025, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2023/1114,
    pokud jde o regulační technické normy, které stanoví opatření, systémy
    a postupy pro prevenci, odhalování a oznamování zneužívání trhu, vzory,
    které se mají používat pro oznamování podezření na zneužívání trhu,
    a postupy koordinace mezi příslušnými orgány k odhalování a postihování
    zneužívání trhu v přeshraničních případech zneužívání trhu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/885 af 29. april 2025 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2023/1114
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer ordninger,
    systemer og procedurer med henblik på at forebygge, afsløre og indberette markedsmisbrug,
    de modeller, der skal anvendes til at indberette mistanke om markedsmisbrug, og
    koordineringsprocedurerne mellem de kompetente myndigheder med henblik på at
    afsløre og sanktionere markedsmisbrug i grænseoverskridende markedsmisbrugssituationer
  type: main
