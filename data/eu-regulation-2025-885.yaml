title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/885 of 29 April 2025 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the arrangements, systems and procedures
    to prevent, detect and report market abuse, the templates to be used for reporting
    suspected market abuse, and the coordination procedures between the competent
    authorities for the detection and sanctioning of market abuse in cross-border
    market abuse situations
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/885 de la Commission du 29 avril 2025 complétant
    le règlement (UE) 2023/1114 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les dispositifs, systèmes et procédures
    permettant de prévenir, de détecter et de signaler les abus de marché, les
    modèles à utiliser pour signaler les abus de marché présumés et les procédures
    de coordination entre les autorités compétentes en vue de la détection et de
    la répression des abus de marché comportant une dimension transfrontière
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/885 der Kommission vom 29. April 2025 zur
    Ergänzung der Verordnung (EU) 2023/1114 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Vorkehrungen,
    Systeme und Verfahren zur Vorbeugung, Aufdeckung und Meldung von Marktmissbrauch,
    der für die Meldung eines vermuteten Marktmissbrauchs zu verwendenden Muster
    und der Verfahren für die Abstimmung zwischen den jeweils zuständigen Behörden
    bei der Aufdeckung von grenzüberschreitendem Marktmissbrauch und dessen Belegung
    mit Sanktionen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/885 на Комисията
