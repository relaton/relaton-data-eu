    standarda kojima se utvrđuju aranžmani, sustavi i postupci za sprečavanje,
    otkrivanje i prijavljivanje zlouporabe tržišta, predlošci koji se trebaju upotrebljavati
    za prijavljivanje sumnji na zlouporabu tržišta i postupci koordinacije među
    nadležnim tijelima za otkrivanje i sankcioniranje zlouporabe tržišta u situacijama
    prekogranične zlouporabe tržišta
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/885 felhatalmazáson alapuló rendelete (2025. április
    29.) az (EU) 2023/1114 európai parlamenti és tanácsi rendeletnek a piaci visszaélések
    megelőzésére, felderítésére és bejelentésére vonatkozó szabályokat,
    rendszereket és eljárásokat, a feltételezett piaci visszaélések bejelentéséhez
    használandó mintadokumentumokat, valamint az illetékes hatóságok közötti,
    a határokon átnyúló piaci visszaélési helyzetekben a piaci visszaélés
    felderítésére és szankcionálására vonatkozó koordinációs eljárásokat
    meghatározó szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/885 della Commissione, del 29 aprile 2025,
    che integra il regolamento (UE) 2023/1114 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i dispositivi,
    i sistemi e le procedure per prevenire, individuare e segnalare gli abusi di mercato,
    i modelli da utilizzare per segnalare presunti abusi di mercato e le procedure
    di coordinamento tra le autorità competenti per individuare e sanzionare gli
    abusi di mercato transfrontalieri
  type: main
