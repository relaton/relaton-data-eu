  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/885 van de Commissie van 29 april 2025
    tot aanvulling van Verordening (EU) 2023/1114 van het Europees Parlement en de
    Raad met betrekking tot technische reguleringsnormen tot nadere bepaling van de
    regelingen, systemen en procedures om marktmisbruik te voorkomen, op te sporen
    en te melden, de templates die moeten worden gebruikt voor het melden van vermoedelijk
    marktmisbruik, en de coördinatieprocedures tussen de bevoegde autoriteiten voor
    de opsporing en bestraffing van marktmisbruik in situaties van grensoverschrijdend
    marktmisbruik
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/885 z dnia 29 kwietnia 2025
