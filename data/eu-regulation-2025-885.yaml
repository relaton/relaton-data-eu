    w odniesieniu do regulacyjnych standardów technicznych określających rozwiązania,
    systemy i procedury służące zapobieganiu nadużyciom na rynku, ich wykrywaniu
    i zgłaszaniu, wzory, z których należy korzystać do zgłaszania podejrzeń
    nadużyć na rynku, oraz procedury koordynacji między właściwymi organami w
    zakresie wykrywania i karania nadużyć na rynku w przypadkach transgranicznych
    nadużyć na rynku
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/885 da Comissão, de 29 de abril de 2025,
    que complementa o Regulamento (UE) 2023/1114 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação que especificam os mecanismos,
    sistemas e procedimentos para prevenir, detetar e comunicar o abuso de mercado,
    os modelos a utilizar para a comunicação das suspeitas de abuso de mercado e
    os procedimentos de coordenação entre as autoridades competentes para detetar
    e sancionar o abuso de mercado em situações transfronteiriças dessa natureza
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/885 al Comisiei din 29 aprilie 2025 de completare
    a Regulamentului (UE) 2023/1114 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează mecanismele,
    sistemele și procedurile de prevenire, detectare și raportare a abuzului de
    piață, modelele care trebuie utilizate pentru raportarea cazurilor suspectate
    de abuz de piață și procedurile de coordonare între autoritățile competente
    pentru detectarea și sancționarea abuzului de piață în situații de abuz
    de piață cu caracter transfrontalier
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/885 z 29. apríla 2025, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2023/1114, pokiaľ
    ide o regulačné technické predpisy, ktorými sa spresňujú opatrenia, systémy
    a postupy na predchádzanie zneužívaniu trhu, jeho odhaľovanie a nahlasovanie,
    vzory, ktoré sa majú používať na nahlasovanie podozrení zo zneužívania
    trhu, a koordinačné postupy medzi príslušnými orgánmi na odhaľovanie a
    sankcionovanie zneužívania trhu v situáciách cezhraničného zneužívania
    trhu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/885 z dne 29. aprila 2025 o dopolnitvi
    Uredbe (EU) 2023/1114 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo ureditve, sisteme in postopke za preprečevanje, odkrivanje
    in poročanje o zlorabi trga, predloge, ki se uporabljajo za poročanje o domnevni
    zlorabi trga, ter postopke usklajevanja med pristojnimi organi za odkrivanje in
    sankcioniranje zlorabe trga v primerih čezmejne zlorabe trga
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/885 de la Comisión, de 29 de abril de 2025,
    por el que se completa el Reglamento (UE) 2023/1114 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación en las que se
    especifican los mecanismos, sistemas y procedimientos para prevenir, detectar
    e informar sobre el abuso de mercado, la plantilla que debe utilizarse para notificar
    la sospecha de abuso de mercado y los procedimientos de coordinación entre las
    autoridades competentes para la detección y sanción del abuso de mercado
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/885 av den 29 april 2025
    om komplettering av Europaparlamentets och rådets förordning (EU) 2023/1114
    vad gäller tekniska standarder för tillsyn som specificerar arrangemang, system
    och förfaranden för att förebygga, upptäcka och rapportera marknadsmissbruk,
    de mallar som ska användas för att rapportera misstänkt marknadsmissbruk och
    samordningsförfarandena mellan de behöriga myndigheterna för upptäckt av och
    beslut om sanktioner när det gäller gränsöverskridande marknadsmissbruk
