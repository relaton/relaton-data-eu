    avastamiseks ja selle eest karistamiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2025/885, annettu 29 päivänä huhtikuuta
    2025, Euroopan parlamentin ja neuvoston asetuksen (EU) 2023/1114 täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään markkinoiden väärinkäytön
    ehkäisemistä, havaitsemista ja siitä ilmoittamista koskevat järjestelyt, järjestelmät
    ja menettelyt, epäillystä markkinoiden väärinkäytöstä ilmoittamiseen käytettävät
    mallipohjat sekä toimivaltaisten viranomaisten väliset koordinointimenettelyt
    markkinoiden väärinkäytön havaitsemiseksi ja seuraamusten määräämiseksi
    siitä rajat ylittävissä markkinoiden väärinkäyttötilanteissa
  type: main
