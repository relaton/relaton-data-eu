title:
- language: en
  script: Latn
  content: Council Directive 79/40/EEC of 18 December 1978 amending for the 14th time
    Directive 64/54/EEC on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 79/40/CEE du Conseil, du 18 décembre 1978, portant quatorzième
    modification de la directive 64/54/CEE relative au rapprochement des législations
    des États membres concernant les agents conservateurs pouvant être employés
    dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 79/40/EWG des Rates vom 18. Dezember 1978 zur vierzehnten Änderung
    der Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 79/40/EØF af 18. december 1978 om fjortende ændring
    af direktiv 64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 79/40/ΕΟΚ του Συμβουλίου της 18ης Δεκεμβρίου
    1978 περί δεκάτης τροποποιήσεως της οδηγίας
    64/54/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τα συντηρητικά που
    δύνανται να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: it
  script: Latn
  content: Direttiva 79/40/CEE del Consiglio, del 18 dicembre 1978, recante quattordicesima
    modifica della direttiva 64/54/CEE relativa al ravvicinamento delle legislazioni
    degli Stati Membri sui conservativi che possono essere impiegati nelle derrate
    destinate all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 79/40/EEG van de Raad van 18 december 1978 houdende veertiende
    wijziging van Richtlijn 64/54/EEG betreffende de onderlinge aanpassing van de
    wetgevingen der Lid-Staten inzake conserveermiddelen die mogen worden gebruikt
    in voor menselijke voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 79/40/CEE do Conselho, de 18 de Dezembro de 1978, que altera
    pela décima quarta vez a Directiva 64/54/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes aos conservantes que podem ser utilizados nos
    géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 79/40/CEE del Consejo, de 18 de diciembre de 1978, que modifica
    por decimocuarta vez la Directiva 64/54/CEE relativa a la aproximación de las
    legislaciones de los Estados Miembros sobre los agentes conservadores que pueden
    utilizarse en los productos destinados al consumo humano
  type: main
