title:
- language: en
  script: Latn
  content: '79/561/EEC: Commission Decision of 14 May 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''woven suits (including coordinate
    suits consisting of two or three pieces, which are ordered, packed, consigned
    and normally sold together) of wool, of cotton or of man- made textile fibres,
    falling within heading No ex 61.01 of the Common Customs Tariff (NIMEXE codes
    61.01-51, 54, 57) (category 16), originating in Bulgaria and in free circulation
    in the other Member States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/561/CEE: Décision de la Commission, du 14 mai 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les costumes et complets, tissés (y compris
    les ensembles qui se composent de deux ou trois pièces, qui sont commandées,
    conditionnées, transportées et normalement vendues ensemble), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles, de la position ex 61.01
    du tarif douanier commun (codes Nimexe: 61.01-51, 54, 57) (catégorie 16), originaires
    de Bulgarie et mis en libre pratique dans les autres États membres (Les textes
    en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/561/EWG: Entscheidung der Kommission vom 14. Mai 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Bulgarien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Anzüge und Kombinationen, ausgenommen Skianzüge,
    aus Geweben, für Männer und Knaben (einschließlich der aus zwei oder drei Teilen
    bestehenden Kombinationen, die zusammen bestellt, aufgemacht und befördert und
    normalerweise zusammen verkauft werden), auf Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs
    (NIMEXE- Kennziffern 61.01-51; 54; 57) (Kategorie 16) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/561/EØF: Kommissionens beslutning af 14. maj 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage jakkesæt, vævede til mænd og drenge,
    (herunder sæt, der består af to eller tre stykker, der bestilles, emballers,
    transporteres og normalt sælges sammen) af uld, bomuld eller kemofibre, som henhører
    under pos. ex 61.01 i den fælles toldtarif (NIMEXE-nummer 61.01-51, 54, 57 ;
    kategori 16), har oprindelse i Bulgarien og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/561/CEE: Decisione della Commissione, del 14 maggio 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i vestiti completi, tessuti, per uomo
    e per ragazzo (compresi i completi composti di due o tre pezzi ordinati, preparati,
    trasportati e normalmente venduti insieme), di lana, di cotone o di fibre tessili
    sintetiche o artificiali, della voce ex 61.01 della tariffa doganale comune (codici
    Nimexe: 61.01-51, 54, 57) (categoria 16), originari della Bulgaria e messi in
    libera pratica negli altri Stati membri (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/561/EEG: Beschikking van de Commissie van 14 mei 1979 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd kostuums, geweven, voor heren en jongens (daaronder begrepen kostuums
    welke uit twee of drie delen bestaan, welke gewoonlijk te zamen worden besteld,
    verpakt, vervoerd en verkocht), van wol, van katoen of van synthetische of van
    kunstmatige textielvezels, van post ex 61.01 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-51, 54, 57) (categorie 16), van oorsprong uit Bulgarije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
