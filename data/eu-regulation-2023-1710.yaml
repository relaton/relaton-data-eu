title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1710 of 7 September 2023
    concerning the renewal of the authorisation of a preparation of ammonium chloride
    as a feed additive for all ruminants and cats and dogs, an authorisation of a
    preparation of ammonium chloride as a feed additive for sows (holder of the authorisation:
    Latochema Co. Ltd) and repealing Implementing Regulations (EU) No 832/2012 and
    (EU) 2016/1007'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1710 de la Commission du 7 septembre
    2023 concernant le renouvellement de l’autorisation d’une préparation de
    chlorure d’ammonium en tant qu’additif pour l’alimentation de tous les ruminants
    et des chats et chiens, l’autorisation d’une préparation de chlorure d’ammonium
    en tant qu’additif pour l’alimentation des truies (titulaire de l’autorisation:
    Latochema Co. Ltd) et abrogeant les règlements d’exécution (UE) no 832/2012
    et (UE) 2016/1007'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1710 der Kommission vom 7. September
    2023 zur Verlängerung der Zulassung einer Zubereitung aus Ammoniumchlorid als
    Zusatzstoff in Futtermitteln für alle Wiederkäuer sowie für Katzen und Hunde,
    zur Zulassung einer Zubereitung aus Ammoniumchlorid als Zusatzstoff in Futtermitteln
    für Sauen (Zulassungsinhaber: Latochema Co. Ltd) und zur Aufhebung der Durchführungsverordnungen
    (EU) Nr. 832/2012 und (EU) 2016/1007'
  type: main
- language: bg
