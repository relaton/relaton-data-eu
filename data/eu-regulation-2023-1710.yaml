    všechny přežvýkavce, kočky a psy, povolení přípravku chloridu amonného
    jako doplňkové látky pro prasnice (držitel povolení: Latochema Co. Ltd) a
    o zrušení prováděcích nařízení (EU) č. 832/2012 a (EU) 2016/1007'
