    фуражна добавка за всички преживни животни
    и за котки и кучета, за разрешаване на употребата
    на препарат от амониев хлорид като фуражна
    добавка за свине майки (притежател на разрешението:
    Latochema Co. Ltd) и за отмяна на регламенти за изпълнение
    (ЕС) № 832/2012 и (ЕС) 2016/1007'
