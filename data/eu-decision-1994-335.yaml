title:
- language: en
  script: Latn
  content: '94/335/EC: Commission Decision of 26 May 1994 amending Decision 93/402/EEC
    on the health conditions and veterinary certification required for the importation
    of fresh meat from certain countries of South America in order to take into account
    aspects regarding São Paulo and Minas Gerais (Brazil)'
  type: main
- language: fr
  script: Latn
  content: '94/335/CE: Décision de la Commission du 26 mai 1994 modifiant la décision
    93/402/CEE concernant les conditions de police sanitaire et la certification vétérinaire
    requises à l''importation de viandes fraîches en provenance de certains pays
    de l''Amérique du Sud, en vue de tenir compte de certains éléments concernant
    les États de São Paulo et de Minas Gerais (Brésil)'
  type: main
- language: de
  script: Latn
  content: '94/335/EG: ENTSCHEIDUNG DER KOMMISSION vom 26. Mai 1994 zur Änderung
    der Entscheidung 93/402/EWG über die Veterinärbedingungen und Veterinärzeugnisse
    für die Einfuhr von frischem Fleisch aus bestimmten Ländern Südamerikas im
    Hinblick auf die Berücksichtigung einiger Aspekte in bezug auf São Paulo und
    Minas Gerais (Brasilien)'
  type: main
- language: da
  script: Latn
  content: '94/335/EF: KOMMISSIONENS BESLUTNING af 26. maj 1994 om ændring af beslutning
    93/402/EØF om dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika for at tage hensyn
    til forhold vedrørende São Paulo og Minas Gerais (Brasilien)'
  type: main
- language: el
  script: Grek
  content: '94/335/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 26ης Μαΐου
    1994 για την τροποποίηση της απόφασης 93/402/ΕΟΚ
    σχετικά με τους υγειονομικούς όρους και τα
    υγειονομικά πιστοποιητικά που απαιτούνται
    για την εισαγωγή νωπών κρεάτων προερχομένων
    από ορισμένες χώρες της Νότιας Αμερικής, προκειμένου
    να ληφθούν υπόψη ορισμένα θέματα που αφορούν
    τις πολιτείες Σάο Πάολο και Μίνας Ζεράις (Βραζιλία)'
  type: main
- language: fi
  script: Latn
  content: '94/335/EY: Komission päätös, tehty 26 päivänä toukokuuta 1994, eläinten
    terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista tuoreen
    lihan tuonnissa tietyistä Etelä-Amerikan maista tehdyn päätöksen 93/402/ETY
    muuttamisesta tiettyjen Brasilian São Paulon ja Minas Geraisin osavaltioita koskevien
    tekijöiden huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '94/335/CE: DECISIONE DELLA COMMISSIONE del 26 maggio 1994 che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l'' importazione di carni fresche
    provenienti da taluni paesi dell'' America del Sud in modo da tener conto di alcuni
    aspetti relativi agli Stati di São Paulo e Minas Gerais (Brasile)'
  type: main
- language: nl
  script: Latn
  content: '94/335/EG: BESCHIKKING VAN DE COMMISSIE van 26 mei 1994 tot wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika,
    teneinde rekening te houden met bepaalde factoren in verband met São Paulo en
    Minas Gerais (Brazilië)'
  type: main
- language: pt
  script: Latn
  content: '94/335/CE: DECISÃO DA COMISSÃO de 26 de Maio de 1994 que altera a Decisão
    93/402/CEE, relativa às condições sanitárias e à certificação veterinária
    exigidas para a importação de carne fresca proveniente de países da América
    do Sul, a fim de ter em conta aspectos respeitantes a São Paulo e Minas Gerais
    (Brasil)'
  type: main
- language: es
  script: Latn
  content: '94/335/CE: DECISIÓN DE LA COMISIÓN de 26 de mayo de 1994 por la que
    se modifica la Decisión 93/402/CEE relativa a las condiciones zoosanitarias y
    a la certificación sanitaria requeridas para la importación de carnes frescas
    procedentes de países de América del Sur a fin de tener en cuenta algunos aspectos
    relativos a São Paulo y Minas Gerais (Brasil)'
  type: main
- language: sv
  script: Latn
  content: '94/335/EG: Kommissionens beslut av den 26 maj 1994 om ändring av beslut
    93/402/EEG om djurhälsovillkor och utfärdande av veterinärintyg för import
    av färskt kött från vissa länder i Sydamerika för att ta hänsyn till förhållanden
    vad avser São Paulo och Minas Gerais (Brasilien)'
  type: main
