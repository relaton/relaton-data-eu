  content: COMMISSION REGULATION (EEC) No 1526/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 66, 69, 75 and 118 (order
    Nos 40.0660, 40.0690, 40.0750 and 42.1180), originating in China, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3832/90
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1526/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    66, 69, 75 et 118 (numéros d'ordre 40.0660, 40.0690, 40.0750 et 42.1180), originaires
    de Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
