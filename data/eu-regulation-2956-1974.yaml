title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2956/74 of the Commission of 22 November 1974 re-establishing
    the levying of customs duties on other sheep and lamb-skin leather, falling within
    subheading 41.03 B II, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2956/74 de la Commission, du 22 novembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, de la sous-position tarifaire 41.03 B II, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2956/74 der Kommission vom 22. November 1974 zur Wiedereinführung
    des Zollsatzes für Schaf- und Lammleder, der Tarifstelle 41.03 B II, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2956/74 af 22. november 1974 om genindførelse
    af opkrævning af toldafgifter for læder af fåre- og lammeskind, underposition
    41.03 B II, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2956/74 della Commissione, del 22 novembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    della sottovoce 41.03 B II, originarie dei paesi in via di sviluppo, beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2956/74 van de Commissie van 22 november 1974 houdende
    wederinstelling van de heffing van de douanerechten voor schapeleder, van onderverdeling
    41.03 B II, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3501/73 van de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
