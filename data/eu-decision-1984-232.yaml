title:
- language: en
  script: Latn
  content: '84/232/EEC: Commission Decision of 27 April 1984 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of choline
    chloride originating in the German Democratic Republic and Romania and terminating
    that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/232/CEE: Décision de la Commission du 27 avril 1984 portant acceptation
    d'' engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les importations de chlorure de choline originaire de la République démocratique
    allemande et de la Roumanie, et portant clôture de la procédure'
  type: main
- language: de
  script: Latn
  content: '84/232/EWG: Beschluß der Kommission vom 27. April 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Cholinchlorid mit Ursprung in der Deutschen Demokratischen Republik und Rumänien
    und die Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/232/EØF: Kommissionens afgørelse af 27. april 1984 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af cholinchlorid
    med oprindelse i Den tyske demokratiske Republik og Rumænien'
  type: main
- language: el
  script: Grek
  content: '84/232/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Απριλίου 1984 για την αποδοχή αναλήψεων υποχρεώσεων
    που έχουν προταθεί όσον αφορά τη διαδικασία
    αντιντάμπινγκ για τις εισαγωγές χλωριούχου
    χολίνης καταγωγής Λαϊκής Δημοκρατίας της Γερμανίας
    και Ρουμανίας και για την περάτωση της διαδικασίας'
  type: main
- language: it
  script: Latn
  content: '84/232/CEE: Decisione della Commissione del 27 aprile 1984 che accetta
