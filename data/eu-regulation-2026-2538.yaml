  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2538 of 17 November 2026 correcting
    Implementing Regulation (EU) 2025/1919 imposing a definitive anti-dumping duty
    and definitively collecting the provisional duty imposed on imports of certain
    hot-rolled flat products of iron, non-alloy or other alloy steel originating in
    Egypt, Japan and Vietnam, and terminating the investigation on imports thereof
    originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2538 de la Commission du 17 novembre
    2026 rectifiant le règlement d’exécution (UE) 2025/1919 instituant un droit
    antidumping définitif et portant perception définitive du droit provisoire institué
    sur les importations de certains produits plats laminés à chaud en fer, en aciers
    non alliés ou en autres aciers alliés, originaires d’Égypte, du Japon et
    du Viêt Nam, et clôturant l’enquête sur les importations de ces produits
    originaires de l’Inde
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/2538 der Kommission vom 17. November
