title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 358/83 of 14 February 1983 amending Regulation
    (EEC) No 3506/82 increasing to 450 000 tonnes the quantity of bread-making wheat
    held by the French intervention agency for which a standing invitation to tender
    for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 358/83 de la Commission, du 14 février 1983, modifiant
    le règlement (CEE) n 3506/82 et portant à 450 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 358/83 der Kommission vom 14. Februar 1983 zur Änderung
    der Verordnung (EWG) Nr. 3506/82 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der französischen Interventionsstelle befindlicher Brotweizen
    auf 450 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 358/83 af 14. februar 1983 om ændring
    af forordning (EØF) nr. 3506/82 og om forhøjelse til 450 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
