title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1824/81 of 2 July 1981 re-establishing the
    levy of customs duties on woven pneumatic mattresses, products of category 110
    (code 1100), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1824/81 de la Commission, du 2 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux matelas
    pneumatiques, tissés, de la catégorie de produits n° 110 (code 1100), originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1824/81 der Kommission vom 2. Juli 1981 über die
    Wiedereinführung des Zollsatzes für Luftmatratzen aus Geweben der Warenkategorie
    Nr. 110 (Kennziffer 1 100), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1824/81 af 2. juli 1981 om genindførelse
    af opkrævning af toldafgifter for luftmadrasser, vævede, under kategori nr.
    110 (kode 1100), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1824/81 τής Επιτροπής
    τής 2ας Ιουλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά στρώματα
    πληρούμενα δι αέρος, υφασμένα, τών προϊόντων
    τής κατηγορίας αριθ. 110 (κώδικας 1100), καταγωγής
    Νοτίου Κορέας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1824/81 della Commissione, del 2 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai materassi pneumatici,
    tessuti, della categoria di prodotti n. 110 (codice 1100), originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1824/81 van de Commissie van 2 juli 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    luchtbedden, van de categorie van produkten nr. 110 (codenummer 1100), van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3320/80 van de Raad
  type: main
