  content: COMMISSION REGULATION (EEC) No 2687/93 of 29 September 1993 re-establishing
    the levying of customs duties on products of category 12 (order No 40.0120), originating
    in the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2687/93 de la Commission du 29 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 12 (numéro d'ordre 40.0120) originaires des Philippines, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
