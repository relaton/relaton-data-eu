    40.0120) mit Ursprung auf den Philippinen, für die die in der Verordnung (EWG)
    Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2687/93 af 29. september 1993 om genindførelse
