title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2945/77 of 22 December 1977 amending Regulation
    (EEC) No 938/77 fixing the monetary compensatory amounts, in view of the removal
    of 'accession' compensatory amounts and of the amendments to the Tariff nomenclature
    from 1 January 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2945/77 de la Commission, du 22 décembre 1977, modifiant,
    eu égard à l'élimination des montants compensatoires «adhésion» et des modifications
    de la nomenclature tarifaire intervenant le 1er janvier 1978, le règlement (CEE)
    n 938/77 fixant les montants compensatoires monétaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2945/77 der Kommission vom 22. Dezember 1977 durch
    die - im Hinblick auf den Wegfall der Beitrittsausgleichsbeträge und Änderungen
    des Zolltarifschemas zum 1. Januar 1978 - die Verordnung (EWG) Nr. 938/77 zur
    Festsetzung der Währungsausgleichsbeträge geändert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2945/77 af 22. december 1977 om ændring
    af forordning (EØF) nr. 938/77 om fastsættelse af monetære udligningsbeløb,
    under hensyntagen til bortfaldet af tiltrædelses-udligningsbeløb og ændringerne
    af nomenklaturen i toldtariffen pr. 1. januar 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2945/77 della Commissione, del 22 dicembre 1977, recante
    modifica del regolamento (CEE) n. 938/77, che fissa gli importi compensativi monetari,
    per quanto riguarda l'abolizione degli importi compensativi «adesione» e le
    modifiche della nomenclatura tariffaria a decorrere dal 1 gennaio 1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2945/77 van de Commissie van 22 december 1977 houdende
    wijziging van Verordening (EEG) nr. 938/77 tot vaststelling van de monetaire compenserende
    bedragen, in verband met de afschaffing van de compenserende bedragen "toetreding"
    en de wijziging van de tariefnomenclatuur per 1 januari 1978
  type: main
