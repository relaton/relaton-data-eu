    predbežné clo uložené na dovoz určitej obuvi so zvrškom z usne s pôvodom
    v Čínskej ľudovej republike a vyrobenej spoločnosťami Chengdu Sunshine Shoes
    Co. Ltd., Foshan Nanhai Shyang Yuu Footwear Ltd. a Fujian Sunshine Footwear Co.
