    a Foshan Nanhai Shyang Yuu Footwear Ltd és a Fujian Sunshine Footwear Co. Ltd
    által gyártott egyes bőr felsőrésszel rendelkező lábbelik behozatalára
    vonatkozó végleges dömpingellenes vám ismételt kivetéséről és a kivetett
    ideiglenes vám végleges beszedéséről, valamint a Bíróság által a C-659/13.
    és C-34/14. sz. egyesített ügyekben hozott ítélet végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/2257 della Commissione, del 14 dicembre
    2016, che reistituisce un dazio antidumping definitivo e dispone la riscossione
    definitiva del dazio provvisorio istituito sulle importazioni di determinati tipi
    di calzature con tomaie di cuoio originarie della Repubblica popolare cinese e
    prodotte da Chengdu Sunshine Shoes Co. Ltd., Foshan Nanhai Shyang Yuu Footwear
    Ltd. e Fujian Sunshine Footwear Co. Ltd., in esecuzione della sentenza della Corte
    di giustizia nelle cause riunite C-659/13 e C-34/14
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/2257 (2016. gada 14. decembris),
    ar kuru atkārtoti uzliek galīgo antidempinga maksājumu un galīgi iekasē pagaidu
    maksājumu, kas uzlikts tādu konkrētu apavu ar ādas virsu importam, kuru izcelsme
    ir Ķīnas Tautas Republikā un kurus ražo Chengdu Sunshine Shoes Co. Ltd., Foshan
    Nanhai Shyang Yuu Footwear Ltd. un Fujian Sunshine Footwear Co. Ltd., un īsteno
    Tiesas spriedumu apvienotajās lietās C-659/13 un C-34/14
  type: main
- language: lt
  script: Latn
  content: 2016 m. gruodžio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2016/2257,
    kuriuo iš naujo nustatomas galutinis antidempingo muitas ir galutinai surenkamas
    laikinasis muitas, nustatytas tam tikrai importuojamai Kinijos Liaudies Respublikos
    kilmės avalynei su odiniais batviršiais, pagamintai bendrovių „Chengdu Sunshine
    Shoes Co. Ltd.“, „Foshan Nanhai Shyang Yuu Footwear Ltd.“ ir „Fujian Sunshine
    Footwear Co. Ltd.“, ir kuriuo įgyvendinamas Teisingumo Teismo sprendimas sujungtose
    bylose C-659/13 ir C-34/14
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/2257 tal-14 ta'
    Diċembru 2016 li jimponi mill-ġdid dazju antidumping definittiv u jiġbor b'mod
    definittiv id-dazju provviżorju impost fuq l-importazzjonijiet ta' ċerti tipi
    ta' xedd tas-saqajn bil-parti ta' fuq tal-ġilda li joriġinaw mir-Repubblika
    tal-Poplu taċ-Ċina u manifatturati minn Chengdu Sunshine Shoes Co. Ltd., Foshan
    Nanhai Shyang Yuu Footwear Ltd. u Fujian Sunshine Footwear Co. Ltd. u li jimplimenta
    s-sentenza tal-Qorti tal-Ġustizzja fil-kawżi magħquda C-659/13 u C-34/14
  type: main
