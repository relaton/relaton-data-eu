    събиране на временното мито, наложено върху
    вноса на някои обувки с горна част от кожа с
    произход от Китайската народна република и
    произведени от Chengdu Sunshine Shoes Co. Ltd., Foshan Nanhai Shyang
    Yuu Footwear Ltd. и Fujian Sunshine Footwear Co. Ltd., и за изпълнение
    на решението на Съда на Европейския съюз по
    съединени дела C-659/13 и C-34/14
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/2257 ze dne 14. prosince 2016
    o opětovném uložení konečného antidumpingového cla z dovozu některé obuvi
    se svrškem z usně pocházející z Čínské lidové republiky a vyráběné
    společnostmi Chengdu Sunshine Shoes Co. Ltd., Foshan Nanhai Shyang Yuu Footwear
