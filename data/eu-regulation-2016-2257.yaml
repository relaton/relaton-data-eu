title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/2257 of 14 December 2016 re-imposing
    a definitive anti-dumping duty and collecting definitively the provisional duty
    imposed on imports of certain footwear with uppers of leather originating in the
    People's Republic of China and produced by Chengdu Sunshine Shoes Co. Ltd, Foshan
    Nanhai Shyang Yuu Footwear Ltd and Fujian Sunshine Footwear Co. Ltd and implementing
    the judgment of the Court of Justice in joined cases C-659/13 and C-34/14
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/2257 de la Commission du 14 décembre
    2016 réinstituant un droit antidumping définitif et portant perception définitive
    du droit provisoire institué sur les importations de certaines chaussures à
    dessus en cuir originaires de la République populaire de Chine et produites par
    Chengdu Sunshine Shoes Co. Ltd., Foshan Nanhai Shyang Yuu Footwear Ltd. et Fujian
    Sunshine Footwear Co. Ltd., et exécutant l'arrêt rendu par la Cour de justice
    dans les affaires jointes C-659/13 et C-34/14
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/2257 der Kommission vom 14. Dezember
    2016 zur Wiedereinführung eines endgültigen Antidumpingzolls und zur endgültigen
    Vereinnahmung des vorläufigen Zolls auf die Einfuhren bestimmter Schuhe mit Oberteil
    aus Leder mit Ursprung in der Volksrepublik China, die von Chengdu Sunshine Shoes
    Co. Ltd., Foshan Nanhai Shyang Yuu Footwear Ltd. und Fujian Sunshine Footwear
    Co. Ltd. hergestellt werden, sowie zur Durchführung des Urteils des Gerichtshofs
    in den verbundenen Rechtssachen C-659/13 und C-34/14
  type: main
- language: bg
  script: Cyrl
