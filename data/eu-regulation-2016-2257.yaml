  content: Komission täytäntöönpanoasetus (EU) 2016/2257, annettu 14 päivänä
    joulukuuta 2016, lopullisen polkumyyntitullin ottamisesta uudelleen käyttöön
    tiettyjen Kiinan kansantasavallasta peräisin olevien sellaisten jalkineiden tuonnissa,
    joiden päälliset ovat nahkaa ja jotka on valmistanut Chengdu Sunshine Shoes
    Co. Ltd, Foshan Nanhai Shyang Yuu Footwear Ltd tai Fujian Sunshine Footwear Co.
    Ltd, ja kyseisessä tuonnissa käyttöön otetun väliaikaisen tullin lopullisesta
    kantamisesta sekä unionin tuomioistuimen yhdistetyissä asioissa C-659/13 ja
    C-34/14 antaman tuomion täytäntöön panemisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/2257 оd 14. prosinca 2016. o ponovnom
    uvođenju konačne antidampinške pristojbe i konačnoj naplati privremene pristojbe
    uvedene na uvoz određene obuće s gornjim dijelom od kože podrijetlom iz Narodne
    Republike Kine koju proizvode trgovačka društva Chengdu Sunshine Shoes Co. Ltd.,
    Foshan Nanhai Shyang Yuu Footwear Ltd. i Fujian Sunshine Footwear Co. Ltd. te
    o provedbi presude Suda u spojenim predmetima C-659/13 i C-34/14
  type: main
- language: hu
