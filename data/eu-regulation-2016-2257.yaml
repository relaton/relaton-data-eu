    a taxei provizorii instituite asupra importurilor de anumite tipuri de încălțăminte
    cu fețe din piele originare din Republica Populară Chineză și produse de Chengdu
    Sunshine Shoes Co. Ltd., Foshan Nanhai Shyang Yuu Footwear Ltd. și Fujian Sunshine
    Footwear Co. Ltd., precum și de punere în aplicare a hotărârii Curții de
    Justiție în cauzele conexate C-659/13 și C-34/14
  type: main
- language: sk
