  content: Council Regulation (EEC) No 277/76 of 9 February 1976 maintaining in effect
    the interim measures adopted with regard to imports of certain textile products
    originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 277/76 du Conseil, du 9 février 1976, portant maintien
    des mesures conservatoires adoptées à l'égard des importations de certains
    produits textiles originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 277/76 des Rates vom 9. Februar 1976 zur Aufrechterhaltung
    der hinsichtlich der Einfuhr von gewissen Textilerzeugnissen mit Ursprung in der
    Republik Korea ergriffenen Eilmaßnahmen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 277/76 af 9. februar 1976 om opretholdelse
