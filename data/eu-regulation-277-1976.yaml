    di taluni prodotti tessili originari della Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 277/76 van de Raad van 9 februari 1976 tot handhaving
    van de beschermende maatregelen die ten aanzien van de invoer van bepaalde textielprodukten
    van oorsprong uit de Republiek Korea zijn ingesteld
