    inverno ou uso turístico, veículos manuais, máquinas de respigar e/ou perfilar
    para trabalhar madeira, tratores e máquinas para a agricultura e floresta, aparelhos
    comerciais de embalagem em vácuo, aparelhos de refrigeração comerciais, corta-sebes
    e máquinas para jardins com motor conduzidas a pé
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2024/1329 a Comisiei din 13 mai 2024
    de modificare și de rectificare a Deciziei de punere în aplicare (UE) 2023/1586
    în ceea ce privește standardele armonizate pentru prevenirea și protecția
    împotriva exploziilor în atmosfere explozive, echipamentele cu laser, părțile
    referitoare la securitate ale sistemelor de comandă, mașinile pentru materiale
    plastice și cauciuc, vehiculele de colectare a deșeurilor, echipamentele pentru
    deservirea la sol a aeronavelor, cărucioarele de manipulare fără conducător
    și sistemele lor, bicicletele cu acționare electrică, benzile rulante pentru
    sporturi de iarnă sau activități de agrement, cărucioarele cu conducător
    însoțitor, mașinile pentru cepuirea și profilarea lemnului, tractoarele și
    mașinile agricole și forestiere, aparatele comerciale de ambalare în vid, aparatele
    frigorifice de uz comercial și aparatele de fabricare a gheții, foarfecele de
    iarbă și mașinile pentru grădină cu motor conduse din mers din spate
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2024/1329 z 13. mája 2024, ktorým
    sa mení a opravuje vykonávacie rozhodnutie (EÚ) 2023/1586, pokiaľ ide o harmonizované
    normy na prevenciu a ochranu pred výbuchom vo výbušných atmosférach, laserové
    zariadenia, bezpečnostné časti riadiacich systémov, plastárske a gumárske
    stroje, vozidlá na odvoz odpadu, vybavenie letiskových plôch, priemyselné
    vozíky bez vodiča a ich systémy, bicykle na elektrický pohon, pohyblivé chodníky
    na zimné športy alebo na turistické aktivity, ručné vozíky, čapovacie a
    profilovacie drevárske stroje, poľnohospodárske a lesnícke stroje a traktory,
    komerčné vákuové baliace spotrebiče, komerčné chladiace spotrebiče, nožnice
    na trávu a ručne vedené kosačky trávy
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2024/1329 z dne 13. maja 2024 o spremembi
    in popravku Izvedbenega sklepa (EU) 2023/1586 glede harmoniziranih standardov
    o protieksplozijski zaščiti v eksplozivnih atmosferah, laserski opremi, varnostnih
    delih krmilnih sistemov, strojih za predelavo gume in plastike, vozilih za zbiranje
    odpadkov, podporni opremi na tleh za letalski promet, vozilih za talni transport
    brez voznika in njihovih sistemih, kolesih z električnim pomožnim pogonom, tračnih
    transporterjih za zimske športe ali turistične namene, ročno gnanih vozilih,
    lesnoobdelovalnih strojih za izdelovanje čepov in utorov ter profilnih strojih,
    traktorjih ter kmetijskih in gozdarskih strojih, komercialnih vakumskih pakirnih
    napravah, komercialnih hladilnih napravah in ledomatih, škarjah za trave ter
    motornih ročno upravljanih strojih za vrt
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2024/1329 de la Comisión, de 13 de mayo de
    2024, por la que se modifica y corrige la Decisión de Ejecución (UE) 2023/1586
    en lo que respecta a las normas armonizadas para la prevención y protección
    contra la explosión en atmósferas explosivas, los equipos relacionados con láser,
    las partes del sistema de mando relacionadas con la seguridad, las máquinas para
    plásticos y caucho, los vehículos para la recogida de residuos, los equipos
    de tierra para aeronaves, las carretillas industriales sin conductor y sus sistemas,
    los ciclos con asistencia eléctrica, las cintas transportadoras para las actividades
    de deportes de invierno o de recreo, las carretillas conducidas a pie, las máquinas
    espigadoras y perfiladoras para trabajar la madera, los tractores y maquinaria
    agrícola y forestal, los aparatos comerciales de envasado al vacío, los aparatos
    de refrigeración para uso comercial, las tijeras de hierba y la maquinaria de
    jardinería accionada por motor con conductor trasero a pie
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2024/1329 av den 13 maj 2024 om
    ändring och rättelse av genomförandebeslut (EU) 2023/1586 vad gäller harmoniserade
    standarder för förhindrande av och skydd mot explosion i explosiv atmosfär,
    lasertillbehör, säkerhetsrelaterade delar av styrsystem, plast- och gummimaskiner,
    avfallshanteringsfordon, markutrustningar för flygplatser, förarlösa industritruckar
    och deras system, elassisterade cyklar, transportband för vintersport eller fritidsbruk,
    manuellt drivna truckar, tapp- och profileringsmaskiner för träbearbetning,
    traktorer och maskiner för lantbruk och skogsbruk, vakuumförpackningsapparater
    för kommersiellt bruk, kyl- och frysaggregat för kommersiellt bruk, grässaxar
    och motordrivna förarledda trädgårdsmaskiner
  type: main
