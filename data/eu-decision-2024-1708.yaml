    sidan, vad gäller antagandet av en rekommendation med ytterligare vägledning
    om genomförandet av protokollet om samordning av de sociala trygghetssystemen
    till det avtalet vad gäller tolkningen av artikel SSC.11 i det protokollet om
    tillämplig lagstiftning för utsända arbetstagare och egenföretagare som tillfälligt
    arbetar utanför den behöriga staten
