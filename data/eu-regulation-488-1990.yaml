  content: Commission Regulation (EEC) No 488/90 of 27 February 1990 of 27 February
    1990 fixing for the 1989/90 wine year the percentages of table wine production
    to be delivered for compulsory distillation as provided for in article 39 of Council
    Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 488/90 de la Commission du 27 février 1990 fixant
    pour la campagne 1989/1990 les pourcentages de la production de vin de table à
    livrer à la distillation obligatoire visée à l'article 39 du règlement (CEE)
    n° 822/87 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 488/90 DER KOMMISSION vom 27. Februar 1990 zur Festsetzung
    des zur obligatorischen Destillation gemaess Artikel 39 der Verordnung (EWG) Nr.
    822/87 des Rates zu liefernden Prozentsatzes der Tafelweinerzeugung fuer das Wirtschaftsjahr
    1989/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 488/90 af 27. februar 1990 om fastsættelse
    for produktionsåret 1989/90 af, hvor stor en procentdel af produktionen af bordvin,
    der skal leveres til obligatorisk destillation efter artikel 39 i Rådets forordning
    (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 488/90 της Επιτροπής
    της 27ης Φεβρουαρίου 1990 για τον καθορισμό για
    την περίοδο 1989/90 των ποσοστών της παραγωγής
    επιτραπέζιου οίνου που παραδίδονται στην υποχρεωτική
    απόσταξη που αναφέρεται στο άρθρο 39 του κανονισμού
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 488/90 DELLA COMMISSIONE del 27 febbraio 1990 che
    fissa, per la campagna 1989/1990, le percentuali della produzione di vini da tavola
    da consegnare alla distillazione obbligatoria di cui all'articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 488/90 VAN DE COMMISSIE van 27 februari 1990 tot
    vaststelling, voor het wijnoogstjaar 1989/1990, van de percentages van de tafelwijnproduktie
    die moeten worden geleverd voor de in artikel 39 van Verordening (EEG) nr. 822/87
    van de Raad bedoelde verplichte distillatie
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 488/90 DA COMISSAO de 27 de Fevereiro de 1990 que
    fixa, para a campanha de 1989/1990, as percentagens de produçao de vinho de mesa
    a entregar para a destilaçao obrigatoria referida no artigo 39* do Regulamento
    (CEE) n* 822/87
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 488/90 DE LA COMISION de 27 de febrero de 1990 por
    el que se fijan para la campana de 1989/90 los porcentajes de produccion de vino
    de mesa destinados a la destilacion obligatoria contemplada en el articulo 39
    del Reglamento (CEE) no 822/87 del Consejo
