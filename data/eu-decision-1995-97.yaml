    Ceca'
  type: main
- language: nl
  script: Latn
  content: '95/97/EG: BESCHIKKING VAN DE COMMISSIE van 6 maart 1995 tot machtiging
    van de Lid-Staten om voor niet voor opplant bestemde aardappelen van oorsprong
    uit Tsjechië afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG van de
    Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '95/97/CE: DECISÃO DA COMISSÃO de 6 de Março de 1995 que autoriza os
