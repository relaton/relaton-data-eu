title:
- language: en
  script: Latn
  content: '95/97/EC: Commission Decision of 6 March 1995 authorizing the Member States
    to provide for derogations from certain provisions of Council Directive 77/93/EEC
    in respect of potatoes other than potatoes intended for planting originating in
    the Czech Republic'
  type: main
- language: fr
  script: Latn
  content: '95/97/CE: Décision de la Commission du 6 mars 1995 autorisant les États
    membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil pour ce qui concerne les pommes de terre, autres que les
    pommes de terre de semence, originaires de la République tchèque'
  type: main
- language: de
  script: Latn
  content: '95/97/EG: ENTSCHEIDUNG DER KOMMISSION vom 6. März 1995 zur Ermächtigung
    der Mitgliedstaaten, für nicht zum Anpflanzen bestimmte Kartoffeln/Erdäpfel
    mit Ursprung in der Tschechischen Republik Ausnahmen von einigen Vorschriften
    der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '95/97/EF: KOMMISSIONENS BESLUTNING af 6. marts 1995 om bemyndigelse til
    medlemsstaterne til at fastsætte undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for så vidt angår andre kartofler end kartofler til udplantning
    med oprindelse i Den Tjekkiske Republik'
  type: main
- language: el
  script: Grek
  content: '95/97/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 6ης Μαρτίου
    1995 που εξουσιοδοτεί τα κράτη μέλη να προβλέψουν
    εξαιρέσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου όσον αφορά γεώμηλα άλλα
    από εκείνα που προορίζονται για φύτευση, καταγωγής
    Τσεχικής Δημοκρατίας'
  type: main
- language: fi
  script: Latn
  content: '95/97/EY: Komission päätös, tehty 6 päivänä maaliskuuta 1995, jäsenvaltioiden
    oikeuttamisesta sallia poikkeuksia neuvoston direktiivin 77/93/ETY säännöksistä
    koskien muita kuin istutettavaksi tarkoitettuja perunoita Tekin tasavallasta'
  type: main
- language: it
  script: Latn
  content: '95/97/CE: DECISIONE DELLA COMMISSIONE del 6 marzo 1995 che autorizza gli
