title:
- language: en
  script: Latn
  content: '79/189/EEC: Commission Decision of 30 January 1979 specifying the extent
    to which applications lodged during the month of January 1979 for import licences
    in respect of young male bovine animals for fattening may be accepted'
  type: main
- language: fr
  script: Latn
  content: '79/189/CEE: Décision de la Commission, du 30 janvier 1979, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d''
    importation, déposées au mois de janvier 1979 pour les jeunes bovins mâles
    destinés à l'' engraissement'
  type: main
- language: de
  script: Latn
  content: '79/189/EWG: Entscheidung der Kommission vom 30. Januar 1979 über das
    Ausmaß, in dem den im Januar 1979 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann'
  type: main
- language: da
  script: Latn
  content: '79/189/EØF: Kommissionens beslutning af 30. januar 1979 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i januar
    1979 for ungtyre bestemt til opfedning, kan imødekommes'
  type: main
- language: it
  script: Latn
  content: '79/189/CEE: Decisione della Commissione, del 30 gennaio 1979, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'' importazione
    presentate nel mese di gennaio 1979 per i giovani bovini maschi destinati all''
    ingrasso'
  type: main
- language: nl
  script: Latn
  content: '79/189/EEG: Beschikking van de Commissie van 30 januari 1979 waarbij wordt
    bepaald in welke mate gevolg kan worden gegeven aan de in januari 1979 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen'
