    καθώς και των τιμών και πριμοδοτήσεων που πληρώνονται
    κατ' εφαρμογήν του καθεστώτος των μέγιστων
    εγγυημένων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2178/92 della Commissione, del 30 luglio 1992, che
    stabilisce, per il tabacco del raccolto 1991, la produzione effettiva, nonché
    i prezzi ed i premi da pagare in applicazione del regime dei quantitativi massimi
    garantiti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2178/92 van de Commissie van 30 juli 1992 tot bepaling
    van de werkelijke produktie voor tabakssoorten van de oogst 1991 en tot vaststelling
    van de geldende prijzen en premies in het kader van de regeling inzake gegarandeerde
    maximumhoeveelheden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2178/92 da Comissão, de 30 de Julho de 1992, que
