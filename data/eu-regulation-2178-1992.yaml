title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2178/92 of 30 July 1992 determining, for
    tobacco from the 1991 harvest, the quantity actually produced and the prices and
    premiums payable under the system of maximum guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2178/92 de la Commission, du 30 juillet 1992, établissant,
    pour le tabac de la récolte 1991, la production effective ainsi que les prix
    et les primes à payer en application du régime des quantités maximales garanties
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2178/92 der Kommission vom 30. Juli 1992 zur Feststellung
    der tatsächlichen Erzeugung und zur Festsetzung der in Anwendung der Regelung
    der Höchstgarantiemengen zu zahlenden Preise und Prämien für Tabak der Ernte
    1991
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2178/92 af 30. juli 1992 om fastsættelse
    af den faktiske produktion af samt de priser og præmier, der i henhold til ordningen
    med maksimale garantimængder skal betales for tobak fra 1991-høsten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2178/92 της Επιτροπής
