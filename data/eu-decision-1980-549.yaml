    Data Collection System, model 2031, with positioner'' '' von den Zöllen des Gemeinsamen
    Zolltarifs erfüllt sind'
  type: main
- language: da
  script: Latn
  content: '80/549/EØF: Kommissionens beslutning af 22. maj 1980 om konstatering
