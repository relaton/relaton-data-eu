  script: Latn
  content: '80/549/EEC: Commission Decision of 22 May 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''Scientific-Atlanta - Antenna Data Collection System,
    model 2031, with positioner'' are fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/549/CEE: Décision de la Commission, du 22 mai 1980, constatant que
