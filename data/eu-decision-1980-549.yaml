    commun de l'' appareil scientifique dénommé "Scientific-Atlanta - Antenna Data
    Collection System, model 2031, with positioner" sont remplies'
  type: main
- language: de
  script: Latn
  content: '80/549/EWG: Entscheidung der Kommission vom 22. Mai 1980 zur Feststellung,
