title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2259/83 of 4 August 1983 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III and originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2259/83 de la Commission du 4 août 1983 portant rétablissement
    de la perception des droits de douane applicables à l' acide glutamique et ses
    sels, de la sous-position 29.23 D III du tarif douanier commun, originaires de
    Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2259/83 der Kommission vom 4. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Glutaminsäure und ihre Salze der Tarifstelle 29.23
    D III, mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2259/83 af 4. august 1983 om genindførelse
    af opkrævning af told for glutaminsyre samt salte deraf, henhørende under pos.
    29.23 D III og med oprindelse i Thailand, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2259/83 της Επιτροπής
    της 4ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για το γλουταμινικό οξύ
    και τα άλατα αυτού της διακρίσεως 29.23 Δ ΙΙΙ
    του Κοινού Δασμολογίου, καταγωγής Ταϋλάνδης,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2259/83 della Commissione del 4 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili all' acido glutammico e ai suoi sali,
    della sottovoce 29.23 D III della tariffa doganale comune, originari della Tailandia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2259/83 van de Commissie van 4 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op glutaminezuur
    en zouten daarvan, van postonderverdeling 29.23 D III, van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
