title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1185/86 of 21 April 1986 fixing, for the
    period 1 March to 31 December 1986, the maximum quantity of certain products of
    the oils and fats sector to be released for consumption and imported into Spain
    and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1185/86 de la Commission du 21 avril 1986 fixant pour
    la période allant du 1er mars au 31 décembre 1986, la quantité maximale de
    certains produits du secteur des matières grasses à mettre à la consommation
    et à importer en Espagne et au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1185/86 der Kommission vom 21. April 1986 zur Festsetzung
    der Höchstmengen bestimmter Erzeugnisse des Fettsektors, die in Spanien und Portugal
    zum freien Verkehr abzufertigen und in diese Länder einzuführen sind, für den
    Zeitraum vom 1. März bis zum 31. Dezember 1986
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1185/86 af 21. april 1986 om fastsættelse
    for perioden fra den 1. marts til den 31. december 1986 af den største mængde
    af visse produkter inden for fedtstofsektoren, der kan overgå til frit forbrug
    i og importeres til Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1185/86 της Επιτροπής
    της 21ης Απριλίου 1986 που καθορίζει, για την περίοδο
    από 1ης Μαρτίου έως 31 Δεκεμβρίου 1986, τη μέγιστη
    ποσότητα ορισμένων προϊόντων του τομέα των
    λιπαρών ουσιών που διατίθενται στην κατανάλωση
    και εισάγονται στην Ισπανία και την Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1185/86 della Commissione del 21 aprile 1986 che fissa,
    per il periodo 1° marzo - 31 dicembre 1986, la quantità massima di taluni prodotti
    del settore dei grassi da mettere in consumo e da importare in Spagna e Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1185/86 van de Commissie van 21 april 1986 tot vaststelling,
    voor het tijdvak van 1 maart tot en met 31 december 1986, van de maximumhoeveelheid
    van bepaalde in Spanje en Portugal in consumptie te brengen of in te voeren produkten
    van de sector oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1185/86 da Comissão de 21 de Abril de 1986 que
    fixa, para um período compreendido entre 1 de Março e 31 de Dezembro de 1986,
    a quantidade máxima de determinados produtos do sector das matérias gordas a
    introduzir no consumo e a importar em Espanha e em Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1185/86 de la Comisión de 21 de abril de 1986 que
    fija, para el período comprendido entre el 1 de marzo y el 31 de diciembre de
    1986, la cantidad máxima de ciertos productos del sector de las materias grasas
    que habrá de despacharse al consumo e importarse en España y Portugal
  type: main
