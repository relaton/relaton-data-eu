title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1258/2001 of 26 June 2001 determining the
    extent to which applications lodged in June 2001 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1258/2001 de la Commission du 26 juin 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juin 2001 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1258/2001 der Kommission vom 26. Juni 2001 über die
    Festsetzung des Umfangs, in dem die im Juni 2001 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1258/2001 af 26. juni 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juni
    2001 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1258/2001 της Επιτροπής,
    της 26ης Ιουνίου 2001, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούνιο 2001 για
    πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τη
    συμφωνία που συνήψε η Κοινότητα με τη Σλοβενία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1258/2001, annettu 26 päivänä kesäkuuta 2001,
    yhteisön Slovenian kanssa tekemässä sopimuksessa määrätyn järjestelmän
    mukaisesti kesäkuussa 2001 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1258/2001 della Commissione, del 26 giugno 2001, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di giugno 2001 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1258/2001 van de Commissie van 26 juni 2001 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in juni 2001 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomst met Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1258/2001 da Comissão, de 26 de Junho de 2001, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Junho de
    2001 ao abrigo do regime previsto no acordo concluído pela Comunidade com a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1258/2001 de la Comisión, de 26 de junio de 2001,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de junio de 2001 al amparo del régimen previsto en el Acuerdo
    celebrado entre la Comunidad y Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1258/2001 av den 26 juni 2001 om fastställande
    av i vilken utsträckning ansökningar som lämnats in i juni 2001 om importlicenser
    för vissa grisköttsprodukter i enlighet med den ordning som fastställs i avtalet
    mellan gemenskapen och Slovenien kan godkännas
