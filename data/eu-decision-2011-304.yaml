  content: '2011/304/EU: Kommissionens beslut av den 23 maj 2011 om befrielse för
    vissa parter från utvidgningen till vissa cykeldelar av den antidumpningstull
    på cyklar med ursprung i Folkrepubliken Kina som infördes genom rådets förordning
    (EEG) nr 2474/93, senast bibehållen och ändrad genom förordning (EG) nr 1095/2005,
    och om hävande av uppskjutandet och återkallandet av den befrielse från betalningen
    av den utvidgade antidumpningstullen på vissa cykeldelar med ursprung i Folkrepubliken
