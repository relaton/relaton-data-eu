    cła antydumpingowego rozszerzonego na niektóre części rowerowe pochodzące
    z Chińskiej Republiki Ludowej, przyznane niektórym stronom na podstawie rozporządzenia
    Komisji (WE) nr 88/97 (notyfikowana jako dokument nr C(2011) 3543)'
  type: main
- language: pt
  script: Latn
  content: '2011/304/UE: Decisão da Comissão de 23 de Maio de 2011 , que isenta
    certas partes da extensão, a certas partes de bicicletas, do direito anti-dumping
    instituído pelo Regulamento (CEE) n. ° 2474/93 do Conselho sobre as bicicletas
    originárias da República Popular da China, confirmado e alterado pelo Regulamento
    (CE) n. ° 1095/2005, e que levanta a suspensão e revoga a isenção do pagamento
    do direito anti-dumping tornado extensivo a certas partes de bicicletas originárias
    da República Popular da China concedida a certas partes em conformidade com o
    Regulamento (CE) n. ° 88/97 da Comissão [notificada com o número C(2011) 3543]'
  type: main
- language: ro
  script: Latn
  content: '2011/304/UE: Decizia Comisiei din 23 mai 2011 de exceptare a anumitor
    părți de la extinderea la anumite componente pentru biciclete a taxei antidumping
    asupra bicicletelor originare din Republica Populară Chineză instituite prin
    Regulamentul (CEE) nr. 2474/93 al Consiliului, menținut și modificat ultima
    dată prin Regulamentul (CE) nr. 1095/2005, precum și de ridicare a suspendării
    și de revocare a exceptării de la plata taxei antidumping extinse la anumite
    componente pentru biciclete originare din Republica Populară Chineză, acordate
    anumitor părți în conformitate cu Regulamentul (CE) nr. 88/97 al Comisiei [notificată
    cu numărul C(2011) 3543]'
  type: main
