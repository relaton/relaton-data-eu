    a C(2011) 3543. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2011/304/UE: Decisione della Commissione, del 23 maggio 2011 , che concede
    a talune parti interessate l’esenzione dall’estensione ad alcune parti di
    biciclette del dazio antidumping sulle biciclette originarie della Repubblica
    popolare cinese, istituito dal regolamento (CEE) n. 2474/93 del Consiglio, mantenuto
    e modificato da ultimo dal regolamento (CE) n. 1095/2005, e che revoca la sospensione
    del pagamento del dazio antidumping esteso ad alcune parti di biciclette originarie
    della Repubblica popolare cinese, nonché l’esenzione da esso, concesse a talune
    parti interessate ai sensi del regolamento (CE) n. 88/97 della Commissione [notificata
    con il numero C(2011) 3543]'
  type: main
- language: lv
  script: Latn
  content: '2011/304/ES: Komisijas Lēmums ( 2011. gada 23. maijs ), ar ko konkrētas
    personas atbrīvo no tāda paplašinātā antidempinga maksājuma par konkrētām
    velosipēdu daļām, kurš ar Padomes Regulu (EEK) Nr. 2474/93 noteikts Ķīnas
    Tautas Republikas izcelsmes velosipēdiem, pēdējo reizi saglabāts un grozīts
    ar Padomes Regulu (EK) Nr. 1095/2005, un ar ko atceļ saskaņā ar Komisijas Regulu
    (EK) Nr. 88/97 konkrētām personām piešķirto tāda antidempinga maksājuma
    atlikšanu, kurš attiecināts uz konkrētām Ķīnas Tautas Republikas izcelsmes
    velosipēdu daļām, un ar ko atsauc atbrīvojumu no minētā maksājuma (izziņots
    ar dokumenta numuru C(2011) 3543)'
  type: main
- language: lt
  script: Latn
  content: '2011/304/ES: 2011 m. gegužės 23 d. Komisijos sprendimas, kuriuo tam
    tikros šalys atleidžiamos nuo tam tikroms dviračių dalims išplėsto antidempingo
    muito, nustatyto Tarybos reglamentu (EEB) Nr. 2474/93, kurio galiojimas paskutinį
    kartą pratęstas ir kuris paskutinį kartą buvo iš dalies keistas Reglamentu
    (EB) Nr. 1095/2005, Kinijos Liaudies Respublikos kilmės dviračiams ir kuriuo
    panaikinamas tam tikroms šalims pagal Komisijos reglamentą (EB) Nr. 88/97 suteiktas
    leidimas laikinai nemokėti tam tikroms Kinijos Liaudies Respublikos kilmės dviračių
    dalims išplėsto antidempingo muito ir panaikinamas atleidimas nuo šio muito
    (pranešta dokumentu Nr. C(2011) 3543)'
  type: main
- language: mt
  script: Latn
  content: '2011/304/UE: Deċiżjoni tal-Kummissjoni tat- 23 ta’ Mejju 2011 li tagħti
