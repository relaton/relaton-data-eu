id: EUDecision2011304
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2011/304/EU: Commission Decision of 23 May 2011 granting certain parties
    an exemption from the extension to certain bicycle parts of the anti-dumping duty
    on bicycles originating in the People’s Republic of China imposed by Council
    Regulation (EEC) No 2474/93, last maintained and amended by Regulation (EC) No
    1095/2005, lifting the suspension and revoking the exemption of the payment of
    the anti-dumping duty extended to certain bicycle parts originating in the People’s
    Republic of China granted to certain parties pursuant to Commission Regulation
    (EC) No 88/97 (notified under document C(2011) 3543)'
  type: main
- language: fr
  script: Latn
  content: '2011/304/UE: Décision de la Commission du 23 mai 2011 exemptant certaines
    parties de l’extension à certaines parties de bicyclettes du droit antidumping
    institué par le règlement (CEE) n ° 2474/93 du Conseil sur les bicyclettes
    originaires de la République populaire de Chine, maintenu et modifié en dernier
    lieu par le règlement (CE) n ° 1095/2005, levant la suspension et révoquant
    l’exemption de paiement du droit antidumping étendu à certaines parties de
    bicyclettes originaires de la République populaire de Chine accordées à certaines
    parties en vertu du règlement (CE) n ° 88/97 de la Commission [notifiée sous
    le numéro C(2011) 3543]'
  type: main
- language: de
  script: Latn
  content: '2011/304/EU: Beschluss der Kommission vom 23. Mai 2011 zur Befreiung bestimmter
    Parteien von der Ausweitung des Antidumpingzolls auf Fahrräder mit Ursprung in
    der Volksrepublik China, der mit der Verordnung (EWG) Nr. 2474/93 des Rates eingeführt
    und zuletzt mit der Verordnung (EG) Nr. 1095/2005 aufrechterhalten und geändert
    wurde, auf bestimmte Fahrradteile und zur Aufhebung und zum Widerruf der Befreiung
    von der Entrichtung des auf bestimmte Fahrradteile mit Ursprung in der Volksrepublik
    China ausgeweiteten Antidumpingzolls, die bestimmten Parteien mit der Verordnung
    (EG) Nr. 88/97 der Kommission gewährt wurde (Bekannt gegeben unter Aktenzeichen
    K(2011) 3543)'
  type: main
- language: bg
  script: Cyrl
  content: '2011/304/ЕС: Решение на Комисията от 23 май 2011
    година за предоставяне на някои страни на освобождаване
    от разширяването на обхвата, по отношение на
    някои велосипедни части, на антидъмпинговото
    мито за велосипеди с произход от Китайската
    народна република, наложено с Регламент (ЕИО)
    № 2474/93 на Съвета, последно оставено в сила и
    изменено с Регламент (ЕО) № 1095/2005, и за отмяна
    на разрешените на някои страни, съгласно Регламент
    (ЕО) № 88/97 на Комисията, временно спиране и освобождаване
    от плащането на антидъмпинговото мито, наложено
    и върху някои велосипедни части с произход
    от Китайската народна република (нотифицирано
    под номер C(2011) 3543)'
  type: main
- language: cs
  script: Latn
  content: '2011/304/EU: Rozhodnutí Komise ze dne 23. května 2011 , kterým se některé
    strany osvobozují od rozšíření antidumpingového cla z jízdních kol pocházejících
    z Čínské lidové republiky uloženého nařízením Rady (EHS) č. 2474/93,
    naposledy zachovaného a pozměněného nařízením (ES) č. 1095/2005, na některé
    součásti jízdních kol a kterým se zrušují pozastavení a osvobození od
    platby antidumpingového cla rozšířeného na některé součásti jízdních
    kol pocházející z Čínské lidové republiky, která byla některým stranám
    přiznána nařízením Komise (ES) č. 88/97 (oznámeno pod číslem K(2011)
    3543)'
  type: main
- language: da
  script: Latn
  content: '2011/304/EU: Kommissionens afgørelse af 23. maj 2011 om indrømmelse
    af fritagelse til visse parter for udvidelsen til visse dele til cykler af den
    antidumpingtold på cykler med oprindelse i Folkerepublikken Kina, der indførtes
    ved Rådets forordning (EØF) nr. 2474/93, senest opretholdt og ændret ved Rådets
    forordning (EF) nr. 1095/2005, og om ophævelse af den suspension og tilbagekaldelse
    af den fritagelse, der er indrømmet visse parter i henhold til Kommissionens
    forordning (EF) nr. 88/97 i forbindelse med betalingen af antidumpingtolden som
    udvidet til også at omfatte visse dele til cykler med oprindelse i Folkerepublikken
    Kina (meddelt under nummer K(2011) 3543)'
  type: main
- language: el
  script: Grek
  content: '2011/304/ΕΕ: Απόφαση της Επιτροπής, της 23ης
    Μαΐου 2011 , για την απαλλαγή ορισμένων μερών
    από την επέκταση σε ορισμένα εξαρτήματα ποδηλάτων,
    του δασμού αντιντάμπινγκ που επιβλήθηκε στα
