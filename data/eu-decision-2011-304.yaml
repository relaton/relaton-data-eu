  script: Latn
  content: '2011/304/EÚ: Rozhodnutie Komisie z 23. mája 2011 , ktorým sa určitým
    stranám udeľuje oslobodenie od rozšírenia antidumpingového cla z bicyklov
    s pôvodom v Čínskej ľudovej republike uloženého nariadením Rady (EHS) č.
    2474/93, naposledy zachovaného, zmeneného a doplneného nariadením (ES) č.
    1095/2005, na niektoré časti a súčasti bicyklov a ktorým sa zrušujú pozastavenie
    a oslobodenie od platby antidumpingového cla rozšíreného na niektoré časti
    a súčasti bicyklov s pôvodom v Čínskej ľudovej republike, ktoré boli určitým
    stranám udelené podľa nariadenia Komisie (ES) č. 88/97 [oznámené pod číslom
    K(2011) 3543]'
  type: main
- language: sl
  script: Latn
  content: '2011/304/EU: Sklep Komisije z dne 23. maja 2011 o odobritvi izvzetja od
    razširitve protidampinške dajatve, uvedene z Uredbo Sveta (EGS) št. 2474/93,
    nazadnje ohranjene in spremenjene z Uredbo (ES) št. 1095/2005, na nekatere dele
