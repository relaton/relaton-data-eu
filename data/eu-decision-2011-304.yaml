    iz Ljudske republike Kitajske, ki je bila odobrena nekaterim stranem v skladu
    z Uredbo Komisije (ES) št. 88/97 (notificirano pod dokumentarno številko C(2011)
    3543)'
  type: main
- language: es
  script: Latn
  content: '2011/304/UE: Decisión de la Comisión, de 23 de mayo de 2011 , por la
    que se exime a determinadas partes de la ampliación a determinadas piezas de
    bicicleta del derecho antidumping que se aplica a las bicicletas originarias de
    la República Popular China, establecido por el Reglamento (CEE) n ° 2474/93
    del Consejo, y mantenido y modificado en último lugar por el Reglamento (CE)
    n ° 1095/2005, y por la que se levanta la suspensión y se revoca la exención
    del pago del derecho antidumping ampliado a determinadas piezas de bicicleta originarias
