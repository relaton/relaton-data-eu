    Verordening (EG) nr. 88/97 van de Commissie aan bepaalde partijen zijn verleend
    (Kennisgeving geschied onder nummer C(2011) 3543)'
  type: main
- language: pl
  script: Latn
  content: '2011/304/UE: Decyzja Komisji z dnia 23 maja 2011 r. przyznająca niektórym
    stronom zwolnienie z rozszerzenia na niektóre części rowerowe cła antydumpingowego
    na rowery pochodzące z Chińskiej Republiki Ludowej nałożonego rozporządzeniem
