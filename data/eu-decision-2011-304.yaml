  type: main
- language: fi
  script: Latn
  content: '2011/304/EU: Komission päätös, annettu 23 päivänä toukokuuta 2011
    , tiettyjen osapuolten vapauttamisesta tiettyjen polkupyörän osien tuontiin
    laajennetusta, Kiinan kansantasavallasta peräisin olevia polkupyöriä koskevasta
    polkumyyntitullista, joka otettiin käyttöön neuvoston asetuksella (ETY) N:o
    2474/93 ja jonka voimassaoloa on viimeksi jatkettu ja jota on viimeksi muutettu
    asetuksella (EY) N:o 1095/2005, sekä komission asetuksen (EY) N:o 88/97 mukaisesti
    tietyille osapuolille myönnetyn, Kiinan kansantasavallasta peräisin olevien
    tiettyjen polkupyörän osien tuontiin laajennetun polkumyyntitullin suspendoinnin
    kumoamisesta (tiedoksiannettu numerolla K(2011) 3543)'
  type: main
- language: hu
  script: Latn
  content: '2011/304/EU: A Bizottság határozata ( 2011. május 23. ) a Kínai Népköztársaságból
    származó kerékpárokra a 2474/93/EGK tanácsi rendelettel kivetett és a legutóbb
