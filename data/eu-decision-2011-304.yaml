    (KE) Nru 88/97 (notifikata bid-dokument numru C(2011) 3543)'
  type: main
- language: nl
  script: Latn
  content: '2011/304/EU: Besluit van de Commissie van 23 mei 2011 tot vrijstelling
    van bepaalde partijen van de uitbreiding tot bepaalde rijwielonderdelen van het
    antidumpingrecht op rijwielen van oorsprong uit de Volksrepubliek China dat is
    ingesteld bij Verordening (EEG) nr. 2474/93 van de Raad, laatstelijk gehandhaafd
    en gewijzigd bij Verordening (EG) nr. 1095/2005, tot opheffing van de schorsing
    en tot intrekking van de vrijstelling van betaling van het tot bepaalde rijwielonderdelen
