    ορισμένα μέρη δυνάμει του κανονισμού (ΕΚ) αριθ.
    88/97 της Επιτροπής [κοινοποιηθείσα υπό τον αριθμό
    Ε(2011) 3543]'
  type: main
- language: et
  script: Latn
  content: '2011/304/EL: Komisjoni otsus, 23. mai 2011 , millega vabastatakse teatavad
    isikud nõukogu määrusega (EMÜ) nr 2474/93 Hiina Rahvavabariigist pärit jalgratastele
    kehtestatud dumpinguvastase tollimaksu (mida on viimati säilitatud ja muudetud
