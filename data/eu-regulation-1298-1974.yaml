id: EURegulation12981974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1298/74 of the Commission of 22 May 1974 re-establishing
    the levying of customs duties on men's and boys' under garments, including collars,
    shirt fronts and cuffs, falling within subheading No ex 61.03, originating in
    India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1298/74 de la Commission, du 22 mai 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour hommes et garçonnets, y compris les cols, faux
    cols, plastrons et manchettes, de la sous-position tarifaire EX 61.03 originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1298/74 der Kommission vom 22. Mai 1974 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Männer
    und Knaben, auch Kragen, Vorhemden und Manschetten, der Tarifstelle ex 61.03,
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3503/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1298/74 af 22. maj 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til mænd og drenge
    (herunder flipper, skjortebryster og manchetter) under underposition ex 61.03,
    som har oprindelse i Indien, og som omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1298/74 della Commissione, del 22 maggio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per uomo e per ragazzo, compresi i colli, colletti, sparati e polsini,
    della sottovoce doganale n. ex 61.03, originari dell'India, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3503/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1298/74 van de Commissie van 22 mei 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op herenonderkleding
    en jongensonderkleding, kragen, boorden, fronten en manchetten daaronder begrepen,
    van onderverdeling ex 61.03, van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december
    1973
  type: main
