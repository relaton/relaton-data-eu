- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3099/93 of 9 November 1993 re-establishing
    the levying of customs duties on products of categories 28 and 76 (order Nos 40.0280
    and 40.0760), originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3099/93 de la Commission du 9 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 28 et 76 (numéros d'ordre 40.0280 et 40.0760) originaires de
    Thaïlande, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3099/93 DER KOMMISSION vom 9. November 1993 zur Wiedereinführung
