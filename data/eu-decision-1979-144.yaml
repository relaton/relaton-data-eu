    (FEOGA), section "orientation", au Royaume de Belgique des primes versées pendant
    l''année 1977 pour l''arrachage de pommiers et de poiriers de certaines variétés
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
