    5000'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/318/CEE: Décision de la Commission, du 29 avril 1981, constatant que
    l''importation de l''appareil dénommé "Perkin Elmer - Atomic Absorption Spectrophotometer,
    model 5000" peut être faite en franchise des droits du tarif douanier commun'
  type: main
