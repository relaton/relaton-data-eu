title:
- language: en
  script: Latn
  content: '94/501/EC: Council Decision of 27 July 1994 authorizing the Kingdom of
    Spain to apply a measure derogating from Articles 2 (1) and 17 of the sixth Directive
    77/388/EEC on the harmonization of the laws of the Member States relating to turnover
    taxes'
  type: main
- language: fr
  script: Latn
  content: '94/501/CE: Décision du Conseil du 27 juillet 1994 autorisant le Royaume
    d''Espagne à appliquer une mesure dérogatoire à l''article 2 point 1 et à
    l''article 17 de la sixième directive 77/388/CEE en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '94/501/EG: ENTSCHEIDUNG DES RATES vom 27. Juli 1994 zur Ermächtigung
    des Königreichs Spanien zur Einführung einer von Artikel 2 Nummer 1 und Artikel
    17 der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern abweichenden Sondermaßnahme'
  type: main
- language: da
  script: Latn
  content: '94/501/EF: RÅDETS BESLUTNING af 27. juli 1994 om bemyndigelse af Kongeriget
    Spanien til at anvende en foranstaltning, der fraviger artikel 2, stk. 1, og artikel
    17 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes lovgivning
    om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '94/501/ΕΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 27ης
    Ιουλίου 1994 με την οποία εξουσιοδοτείται το
    Βασίλειο της Ισπανίας να εφαρμόσει μέτρο παρέκκλισης
    από το άρθρο 2 σημείο 1 και το άρθρο 17 της έκτης
    οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως των νομοθεσιών
    των κρατών μελών των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '94/501/CE: DECISIONE DEL CONSIGLIO del 27 luglio 1994 che autorizza il
    Regno di Spagna ad applicare una misura di deroga all'' articolo 2, paragrafo
    1 e all'' articolo 17 della sesta direttiva 77/388/CEE in materia di armonizzazione
    delle legislazioni degli Stati membri relative alle imposte sulla cifra di affari'
  type: main
- language: nl
  script: Latn
  content: '94/501/EG: BESCHIKKING VAN DE RAAD van 27 juli 1994 waarbij het Koninkrijk
    Spanje wordt gemachtigd een bijzondere maatregel toe te passen die afwijkt van
    artikel 2, punt 1, en artikel 17 van Zesde Richtlijn 77/388/EEG betreffende de
    harmonisatie van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '94/501/CE: DECISÃO DO CONSELHO de 27 de Julho de 1994 que autoriza o
    Reino de Espanha a aplicar uma medida derrogatória ao disposto no nº 1 do artigo
    2º e no artigo 17º da Sexta Directiva 77/388/CEE relativa à harmonização
    das legislações dos Estados-membros respeitantes aos impostos sobre o volume
    de negócios'
  type: main
- language: es
  script: Latn
  content: '94/501/CE: DECISIÓN DEL CONSEJO de 27 de julio de 1994 por la que se
    autoriza al Reino de España a aplicar una medida de excepción al apartado 1
    del artículo 2 y al artículo 17 de la sexta Directiva 77/388/CEE en materia
    de armonización de las legislaciones de los Estados miembros relativas a los
    impuestos sobre el volumen de negocios'
  type: main
