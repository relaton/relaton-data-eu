    applicables en 1994 à certains produits textiles originaires du Mexique, de Malaysia,
    de Lituanie, de Chine et du Brésil, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
