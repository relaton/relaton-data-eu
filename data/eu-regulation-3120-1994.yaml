  content: Commission Regulation (EC) No 3120/94 of 19 December 1994 re-establishing
    the levying of customs duties and ending the charges against tariff ceilings opened
    in 1994, on certain textile products originating in Mexico, Malaysia, Lithuania,
    China and Brazil, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3120/94 de la Commission du 19 décembre 1994 portant
