  script: Latn
  content: '91/648/EEC: Commission Decision of 10 December 1991 on the establishment
    of an addendum to the Community support framework for Community structural assistance
    in the United Kingdom (Northern Ireland) on the improvement of the conditions
    under which agricultural products are processed and marketed (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/648/CEE: Décision de la Commission du 10 décembre 1991 concernant
    l''établissement d''un avenant au cadre communautaire d''appui pour les interventions
    structurelles communautaires au Royaume-Uni (Irlande du Nord) en matière d''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
