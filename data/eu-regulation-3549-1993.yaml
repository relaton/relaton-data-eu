title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3549/93 of 21 December 1993 amending Regulation
    (EEC) No 2699/93 laying down detailed rules for the application in the poultrymeat
    and egg sectors of the arrangements provided for in the Interim Agreements between
    the European Economic Community and the Republic of Poland, the Republic of Hungary
    and the former Czech and Slovak Federal Republic and fixing the quantities available
    for the period 1 January to 31 March 1994 for imports from the Czech and Slovak
    Republics
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3549/93 de la Commission, du 21 décembre 1993, modifiant
    le règlement (CEE) n° 2699/93 de la Commission établissant les modalités d'application
    dans les secteurs de la viande de volaille et des oeufs du régime prévu dans
    les accords intérimaires entre la Communauté et la Pologne, la Hongrie et l'ancienne
    République fédérative tchèque et slovaque et fixant les quantités disponibles
    pour la période du 1er janvier au 31 mars 1994 pour les importations en provenance
    des Républiques tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3549/93 der Kommission vom 21. Dezember 1993 zur Änderung
