    und Eier betreffenden Durchführungsbestimmungen zu der Regelung im Rahmen der
    von der Gemeinschaft mit Polen, der früheren Tschechischen und Slowakischen Föderativen
    Republik und Ungarn geschlossenen Interimsabkommen und zur Festlegung der vom
    1. Januar bis 31. März 1994 für Einfuhren aus der Tschechischen Republik und
    aus der Slowakischen Republik zur Verfügung stehenden Mengen
  type: main
- language: da
  script: Latn
