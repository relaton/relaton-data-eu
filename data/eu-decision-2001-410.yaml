title:
- language: en
  script: Latn
  content: '2001/410/EC: Commission Decision of 30 May 2001 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries to take account of the animal health
    situation in Brazil and amending Decision 2001/388/EC amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries to take account of the animal health
    situation in Uruguay (Text with EEA relevance) (notified under document number
    C(2001) 1534)'
  type: main
- language: fr
  script: Latn
  content: '2001/410/CE: Décision de la Commission du 30 mai 2001 modifiant la décision
    93/402/CEE concernant les conditions de police sanitaire et la certification vétérinaire
    requises à l''importation de viandes fraîches en provenance de certains pays
    d''Amérique du Sud, afin de tenir compte de la situation zoosanitaire au Brésil
    et modifiant la décision 2001/388/CE modifiant la décision 93/402/CEE concernant
    les conditions de police sanitaire et la certification vétérinaire requises
    à l''importation de viandes fraîches en provenance de certains pays d''Amérique
    du Sud, afin de tenir compte de la situation zoosanitaire en Uruguay (Texte présentant
    de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001) 1534]'
  type: main
