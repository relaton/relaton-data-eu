title:
- language: en
  script: Latn
  content: Regulation (EEC) No 391/74 of the Commission of 13 February 1974 re-establishing
    the levying of customs duties on cotton yarn, not put up for retail sale, falling
    within subheading No 55.05 A, originating in Colombia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3503/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 391/74 de la Commission, du 13 février 1974, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, de la sous- position tarifaire
    55.05 A originaires de Colombie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 391/74 der Kommission vom 13. Februar 1974 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, der Tarifstelle 55.05 A, mit Ursprung in Kolumbien, dem die
    in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 391/74 af 13. februar 1974 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger,
    under position 55.05 A, som har oprindelse i Columbia og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 391/74 della Commissione, del 13 febbraio 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto della sottovoce doganale n. 55.05 A originari
    della Colombia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 391/74 van de Commissie van 13 februari 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein van onderverdeling 55.05 A, van
    oorsprong uit Columbia, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december 1973
  type: main
