title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1318 of 9 August 2021 correcting
    Implementing Regulation (EU) 2017/2470 establishing the Union list of novel foods,
    Decision 2008/968/EC authorising the placing on the market of arachidonic acid-rich
    oil from Mortierella alpina as a novel food ingredient and Implementing Regulation
    (EU) 2020/484 authorising the placing on the market of lacto-N-tetraose as a novel
    food
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1318 de la Commission du 9 août 2021
    rectifiant le règlement d’exécution (UE) 2017/2470 établissant la liste de
    l’Union des nouveaux aliments, la décision 2008/968/CE autorisant la mise sur
    le marché d’huile riche en acide arachidonique extraite du champignon Mortierella
    alpina en tant que nouvel ingrédient alimentaire et le règlement d’exécution
    (UE) 2020/484 autorisant la mise sur le marché du lacto-N-tétraose en tant que
    nouvel aliment
  type: main
- language: de
  script: Latn
