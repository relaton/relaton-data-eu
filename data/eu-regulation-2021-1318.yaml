    des Inverkehrbringens von arachidonsäurereichem Öl aus Mortierella alpina als
    neuartige Lebensmittelzutat und der Durchführungsverordnung (EU) 2020/484 zur
    Genehmigung des Inverkehrbringens von Lacto-N-tetraose als neuartiges Lebensmittel
  type: main
