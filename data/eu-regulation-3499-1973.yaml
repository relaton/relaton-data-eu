title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3499/73 of the Commission of 21 December 1973 authorizing
    the United Kingdom to suspend temporarily customs duties on hachled or otherwise
    processed but not spun flax or flax tow imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3499/73 de la Commission, du 21 décembre 1973, autorisant
    le Royaume-Uni à suspendre temporairement les droits de douane applicables au
    lin et étoupes de lin peignés ou autrement traités mais non filés importés
    en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3499/73 der Kommission vom 21. Dezember 1973 zur Ermächtigung
    des Vereinigten Königreichs, die Zollsätze für gehechelten oder anders bearbeiteten
    doch nicht versponnenen Flachs und Flachswerg bei der Einfuhr aus anderen Mitgliedstaaten
    vorübergehend auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3499/73 af 21. december 1973 om bemyndigelse
    af Det forende Kongerige til en foreløbig suspension for heglet eller bearbejdet,
    men ikke spundet hør og blår ved import fra andre medlemstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3499/73 della Commissione, del 21 dicembre 1973, che
    autorizza il Regno Unito a sospendere temporaneamente i dazi doganali applicabili
    al lino e alla stoppa di lino pettinati e altrimenti preparati ma non filati importati
    in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3499/73 van de Commissie van 21 december 1973 waarbij
    het Verenigd Koninkrijk wordt gemachtigd de douanerechten van toepassing op gehekeld
    of anders bewerkt doch niet gesponnen vlas en vlaswerk, dat uit de andere Lid-Staten
    wordt ingevoerd tijdelijk te schorsen
  type: main
