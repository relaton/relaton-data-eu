title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3906/92 of 19 December 1992 establishing, for
    1993, certain measures for the conservation and management of fishery resources,
    applicable to vessels flying the flag of a Member State, other than Spain and
    Portugal, in waters falling under the sovereignty or within the jurisdiction of
    the Kingdom of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3906/92 du Conseil, du 19 décembre 1992, fixant,
    pour l' année 1993, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon d' un Etat membre, à l' exception
    de l' Espagne et du Portugal, dans les eaux relevant de la souveraineté ou de
    la juridiction de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3906/92 des Rates vom 19. Dezember 1992 zur Festsetzung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter der Flagge eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    in den Gewässern unter der Hoheitsgewalt oder Gerichtsbarkeit Spaniens für 1993
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3906/92 af 19. december 1992 om fastsættelse
    for 1993 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører medlemsstaternes flag, bortset
    fra spansk og portugisisk flag, i de farvande, der hører under Spaniens højhedsområde
    eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3906/92 του Συμβουλίου
    της 19ης Δεκεμβρίου 1992 για τον καθορισμό, για
    το 1993, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με σημαία ενός κράτους μέλους, εξαιρέσει
    της Ισπανίας και της Πορτογαλίας, στα ύδατα
    που υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Ισπανίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3906/92 del Consiglio, del 19 dicembre 1992, che fissa,
    per il 1993, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera degli Stati membri, esclusi la Spagna
    e il Portogallo, nelle acque soggette alla sovranità o alla giurisdizione della
    Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3906/92 van de Raad van 19 december 1992 tot vaststelling,
    voor 1993, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op vaartuigen die de vlag voeren van de Lid-Staten,
    met uitzondering van Spanje en Portugal, in de wateren die onder de soevereiniteit
    of de jurisdictie van Spanje vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3906/92 do Conselho, de 19 de Dezembro de 1992, que
    fixa, para 1993, certas medidas de conservação e de gestão dos recursos de
    pesca aplicáveis aos navios arvorando pavilhão de um Estado-membro, com excepção
    de Espanha e de Portugal, nas águas sob soberania ou jurisdição de Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3906/92 del Consejo, de 19 e diciembre de 1992, por
    el que se fijan, para el año 1993, determinadas medidas de conservación y de
    gestión de los recursos pesqueros aplicables a los buques con pabellón de un
    Estado miembro, excepto España y Portugal, en aguas sometidas a la soberanía
    o a la jurisdicción de España
  type: main
