    consegna dall'acquirente e la lista delle destinazioni dove il burro può essere
    esportato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2728/84 van de Commissie van 27 september 1984 tot
    tweede wijziging van de Verordening (EEG) nr. 2268/84 en (EEG) nr. 2278/84 ten
