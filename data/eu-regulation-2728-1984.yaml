  content: Commission Regulation (EEC) No 2728/84 of 27 September 1984 amending for
    the second time Regulations (EEC) No 2268/84 and (EEC) No 2278/84 as regards the
    minimum size of part-lots which may be removed by purchasers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2728/84 de la Commission du 27 septembre 1984 portant
    deuxième modification des règlements (CEE) n° 2268/84 et (CEE) n 2278/84 en
    ce qui concerne la quantité partielle de beurre pouvant être prise en charge
    par l'acheteur et la liste des destinations où le beurre peut être exporté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2728/84 der Kommission vom 27. September 1984 zur
    zweiten Änderung der Verordnungen (EWG) Nr. 2268/84 und (EWG) Nr. 2278/84 hinsichtlich
    der Teilmenge Butter, die vom Käufer übernommen werden kann, und des Verzeichnisses
    der Bestimmungsländer, in die die Butter ausgeführt werden darf
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2728/84 af 27. september 1984 om anden
    ændring af forordning (EØF) nr. 2268/84 og (EØF) nr. 2278/84, for så vidt
    angår den delmængde smør, som kan overtages af køberen og listen af de destinationer
    hvortil smørret kan eksporteres
  type: main
- language: el
  script: Grek
