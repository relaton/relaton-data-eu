title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 843/90 of 30 March 1990 reintroducing the
    levying of the customs duties on women's or girls'dresses, products of category
    No 16 (order No 40.0260) and women's or girls'suits and ensembles products of
    category No 29 (order No 40.0290) originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 843/90 de la Commission du 30 mars 1990 portant rétablissement
    de la perception des droits de douane applicables aux robes de la catégorie de
    produits n° 26 (numéro d'ordre 40.0260) et aux costumes- tailleurs et ensembles
    de la catégorie de produits n° 29 (numéro d'ordre 40.0290), originaires du
    Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 843/90 DER KOMMISSION vom 30. Maerz 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Kleider der Warenkategorie Nr. 26 (Laufende
    Nummer 40.0260) und Kostueme und Kombinationen der Warenkategorie Nr. 29 (Laufende
    Nummer 40.0290) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr.
    3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 843/90 af 30. marts 1990 om genindførelse
    af opkrævning af told for kjoler under varekategori nr. 26 (løbenummer 40.0260)
    og dragter og kostumer og sæt, under varekategori nr. 29 (løbenummer 40.0290),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
