title:
- language: en
  script: Latn
  content: '87/136/EEC: Commission Decision of 30 January 1987 authorizing the Kingdom
    of Denmark to apply intra- Community surveillance to imports of certain textile
    products originating in certain third countries which have been put into free
    circulation in the Community (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/136/CEE: Décision de la Commission du 30 janvier 1987 autorisant le
    Royaume du Danemark à procéder à une surveillance intracommunautaire des importations
    de certains produits textiles originaires de pays tiers et mis en libre pratique
    dans la Communauté (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/136/EWG: Entscheidung der Kommission vom 30. Januar 1987 zur Ermächtigung
    des Königreichs Dänemark zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Textilwaren (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/136/EØF: Kommissionens beslutning af 30. januar 1987 om bemyndigelse
    af kongeriget Danmark til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse tekstilvarer med oprindelse i visse tredjelande til fri omsætning i
    Fællesskabet (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/136/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
    Ιανουαρίου 1987 περί χορηγήσεως αδείας στο Βασίλειο
    της Δανίας για την καθιέρωση ενδοκοινοτικής
    επιβλέψεως των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής ορισμένων τρίτων χωρών
    που βρίσκονται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην δανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/136/CEE: Decisione della Commissione del 30 gennaio 1987 che autorizza
    il Regno di Danimarca ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti tessili originari di paesi terzi messi in libera pratica nella
    Comunità (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/136/EEG: Beschikking van de Commissie van 30 januari 1987 houdende
    machtiging van het Koninkrijk Denemarken tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van bepaalde textielprodukten van oorsprong
    uit bepaalde derde landen, die in de Gemeenschap in het vrije verkeer zijn gebracht
    (Slechts de tekst in de Deense taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/136/CEE: Decisão da Comissão de 30 de Janeiro de 1987 que autoriza
    o Reino da Dinamarca a instaurar uma vigilância intracomunitária das importações
    de certos produtos têxteis originários de certos países terceiros introduzidos
    em livre prática na Comunidade (Apenas faz fé o texto em língua dinamarquesa)'
  type: main
- language: es
  script: Latn
  content: '87/136/CEE: Decisión de la Comisión de 30 de enero de 1987 por la que
    se autoriza al Reino de Dinamarca a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de determinados productos textiles originarios
    de determinados terceros países despachados a libre práctica en la Comunidad
    (El texto en lengua danesa es el único auténtico)'
