  script: Latn
  content: Odluka Vijeća (EU) 2025/2417 od 27. listopada 2025. o stajalištu koje
    treba zauzeti u ime Europske unije u okviru Posebnog odbora za cestovni prijevoz
    osnovanog Sporazumom o trgovini i suradnji između Europske unije i Europske zajednice
    za atomsku energiju, s jedne strane, i Ujedinjene Kraljevine Velike Britanije
    i Sjeverne Irske, s druge strane, o nacionalnim elektroničkim upisnicima poduzeća
    za cestovni prijevoz i načinima razmjene informacija sadržanih u tim upisnicima
  type: main
- language: hu
  script: Latn
