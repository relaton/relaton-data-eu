    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodás alapján létrehozott, a közúti közlekedéssel foglalkozó szakbizottságban
    a közúti fuvarozási vállalkozások nemzeti elektronikus nyilvántartásaival
    és az említett nyilvántartásokban szereplő információcsere módozataival
    kapcsolatban az Európai Unió által képviselendő álláspontról
  type: main
