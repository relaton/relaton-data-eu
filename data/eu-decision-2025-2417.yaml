  content: Council Decision (EU) 2025/2417 of 27 October 2025 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Road
    Transport established by the Trade and Cooperation Agreement between the European
    Union and the European Atomic Energy Community, of the one part, and the United
    Kingdom of Great Britain and Northern Ireland, of the other part, on the national
    electronic registers of road transport undertakings and the modalities of the
    exchange of information contained in those registers
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2417 du Conseil du 27 octobre 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité spécialisé chargé
    du transport routier institué par l’accord de commerce et de coopération entre
    l’Union européenne et la Communauté européenne de l’énergie atomique,
    d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre
    part, sur les registres électroniques nationaux des entreprises de transport
    routier et les modalités de l’échange des informations qui y figurent
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/2417 des Rates vom 27. Oktober 2025 über den Standpunkt,
