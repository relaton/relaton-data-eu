    komitete, įsteigtame Europos Sąjungos bei Europos atominės energijos bendrijos
    ir Jungtinės Didžiosios Britanijos ir Šiaurės Airijos Karalystės prekybos
    ir bendradarbiavimo susitarimu, dėl nacionalinių elektroninių kelių transporto
    įmonių registrų ir dėl keitimosi tų registrų informacija būdų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2025/2417 tas-27 ta’ Ottubru 2025 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fi ħdan il-Kumitat Speċjalizzat
    għat-Trasport bit-Triq stabbilit mill-Ftehim dwar il-Kummerċ u l-Kooperazzjoni
    bejn l-Unjoni Ewropea u l-Komunità Ewropea tal-Enerġija Atomika, minn naħa
    waħda, u r-Renju Unit tal-Gran Brittanja u l-Irlanda ta’ Fuq, min-naħa l-oħra,
    dwar ir-reġistri elettroniċi nazzjonali tal-impriżi tat-trasport bit-triq u
    l-modalitajiet tal-iskambju ta’ informazzjoni li tinsab f’dawk ir-reġistri
  type: main
- language: nl
  script: Latn
