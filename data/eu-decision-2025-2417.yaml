    ds. Transportu Drogowego ustanowionego Umową o handlu i współpracy między
    Unią Europejską i Europejską Wspólnotą Energii Atomowej, z jednej strony,
    a Zjednoczonym Królestwem Wielkiej Brytanii i Irlandii Północnej, z drugiej
    strony, w odniesieniu do krajowych rejestrów elektronicznych przedsiębiorców
    transportu drogowego oraz warunków wymiany informacji zawartych w tych rejestrach
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2025/2417 do Conselho, de 27 de outubro de 2025, relativa
    à posição a tomar em nome da União Europeia no âmbito do Comité Especializado
    dos Transportes Rodoviários criado pelo Acordo de Comércio e Cooperação entre
    a União Europeia e a Comunidade Europeia da Energia Atómica, por um lado, e
    o Reino Unido da Grã-Bretanha e da Irlanda do Norte, por outro, no que diz respeito
    aos registos eletrónicos nacionais das empresas de transporte rodoviário e às
    modalidades de intercâmbio de informações contidas nesses registos
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/2417 a Consiliului din 27 octombrie 2025 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    specializat privind transportul rutier, constituit prin Acordul comercial și
    de cooperare dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice,
    pe de o parte, și Regatul Unit al Marii Britanii și Irlandei de Nord, pe de
    altă parte, în ceea ce privește registrele electronice naționale ale întreprinderilor
    de transport rutier și modalitățile de realizare a schimbului de informații
    conținute în registrele respective
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/2417 z 27. októbra 2025 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Osobitnom výbore pre cestnú dopravu
    zriadenom Dohodou o obchode a spolupráci medzi Európskou úniou a Európskym
    spoločenstvom pre atómovú energiu na jednej strane a Spojeným kráľovstvom
    Veľkej Británie a Severného Írska na strane druhej, pokiaľ ide o vnútroštátne
    elektronické registre podnikov cestnej dopravy a spôsoby výmeny informácií
    obsiahnutých v týchto registroch
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/2417 z dne 27. oktobra 2025 o stališču, ki se v
    imenu Evropske unije zastopa v Specializiranem odboru za cestni prevoz, ustanovljenem
    s Sporazumom o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo
    za atomsko energijo na eni strani ter Združenim kraljestvom Velika Britanija
    in Severna Irska na drugi strani, glede nacionalnih elektronskih registrov podjetij
    za cestni prevoza in načinov izmenjave informacij iz teh registrov
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/2417 del Consejo, de 27 de octubre de 2025, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    Especializado en Transporte por Carretera establecido por el Acuerdo de Comercio
    y Cooperación entre la Unión Europea y la Comunidad Europea de la Energía Atómica,
    por una parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra,
    en lo que respecta a los registros electrónicos nacionales de las empresas de
    transporte por carretera y a las modalidades del intercambio de la información
    que figura en dichos registros
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/2417 av den 27 oktober 2025 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den specialiserade kommitté för
    vägtransport som inrättats genom avtalet om handel och samarbete mellan Europeiska
    unionen och Europeiska atomenergigemenskapen, å ena sidan, och Förenade konungariket
    Storbritannien och Nordirland, å andra sidan, vad gäller de nationella elektroniska
    registren över vägtransportföretag och villkoren för utbyte av information
    som dessa register innehåller
