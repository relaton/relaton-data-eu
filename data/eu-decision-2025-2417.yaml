    dopravu zřízeném Dohodou o obchodu a spolupráci mezi Evropskou unií a Evropským
    společenstvím pro atomovou energii na jedné straně a Spojeným královstvím
    Velké Británie a Severního Irska na straně druhé, pokud jde o vnitrostátní
    elektronické rejstříky podniků silniční dopravy a o způsoby výměny informací
    obsažených v těchto rejstřících
  type: main
