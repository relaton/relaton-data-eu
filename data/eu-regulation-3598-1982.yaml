title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3598/82 of 30 December 1982 laying down for
    the period 1 to 31 January 1983 certain measures for the conservation and management
    of fishery resources applicable to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3598/82 du Conseil, du 30 décembre 1982, fixant,
    pour la période du 1er au 31 janvier 1983, certaines mesures de conservation
    et de gestion des ressources de pêche applicables aux navires battant pavillon
    de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3598/82 des Rates vom 30. Dezember 1982 zur Festlegung
    bestimmter Maßnahmen für die Zeit vom 1. bis zum 31. Januar 1983 zur Erhaltung
    und Bewirtschaftung der Fischbestände gegenüber Schiffen unter spanischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3598/82 af 30. december 1982 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der sejler under spansk flag, i perioden
    fra den 1. til den 31. januar 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3598/82 τού Συμβουλίου
    τής 30ής Δεκεμβρίου 1982 περί καθορισμού, γιά
    τήν περίοδο από τήν 1η Ιανουαρίου μέχρι τίς
    31 Ιανουαρίου 1983, ορισμένων μέτρων διατηρήσεως
    καί διαχειρίσεως τών αλιευτικών πόρων, τά οποία
    εφαρμόζονται σέ σκάφη υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3598/82 del Consiglio, del 30 dicembre 1982, che dispone
    talune misure di conservazione e di gestione delle risorse di pesca da applicare
    alle navi battenti bandiera della Spagna, per il periodo dal 1° al 31 gennaio
    1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3598/82 van de Raad van 30 december 1982 tot vaststelling,
    voor de periode van 1 tot en met 31 januari 1983, van bepaalde maatregelen voor
    de instandhouding en het beheer van de visbestanden ten aanzien van vaartuigen
    die de vlag van Spanje voeren
  type: main
