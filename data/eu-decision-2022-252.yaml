---
id: EUDecision2022252
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/252 of 21 February 2022 amending
    Implementing Decision (EU) 2020/1167 in order to specify the testing requirements
    to be applied to a 48 Volt efficient motor generator integrated in the transmission
    housing and combined with a 48 Volt/12 Volt DC/DC converter
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/252 de la Commission du 21 février
    2022 modifiant la décision d’exécution (UE) 2020/1167 afin de préciser les
    exigences d’essai applicables à un alternodémarreur 48 volts à haut rendement
    intégré dans le carter de boîte de vitesses et combiné à un convertisseur
    48 volts/12 volts CC/CC
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/252 der Kommission vom 21. Februar 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2020/1167 zur Festlegung der
    Prüfanforderungen für einen in das Getriebegehäuse integrierten effizienten
    48-Volt-Motorgenerator in Kombination mit einem 48-Volt-/12-Volt-Gleichspannungswandler
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/252 на Комисията
    от 21 февруари 2022 година за изменение на Решение
    за изпълнение (ЕС) 2020/1167 с цел уточняване на
    изискванията за изпитване, които да се прилагат
    за 48-волтов ефективен двигател-генератор, вграден
    в корпуса на предавателната кутия, и комбиниран
    с преобразувател за постоянен ток 48V/12V
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/252 ze dne 21. února 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2020/1167 za účelem stanovení požadavků
    na zkoušení, které se použijí na účinný 48voltový motorgenerátor ve
    spojení s 48 V/12 V DC/DC měničem integrovaný v pouzdře převodovky
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/252 af 21. februar 2022
    om ændring af gennemførelsesafgørelse (EU) 2020/1167 med henblik på at præcisere
    de prøvningskrav, der skal anvendes på effektive 48 V-motorgeneratorer, som
    er integreret i transmissionshuset og kombineret med en 48 V/12 V-jævnstrømsomformer
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/252 της Επιτροπής
    της 21ης Φεβρουαρίου 2022 για την τροποποίηση
    της εκτελεστικής απόφασης (ΕΕ) 2020/1167 με σκοπό
    τον καθορισμό των απαιτήσεων δοκιμής που πρέπει
    να εφαρμόζονται σε αποδοτικό κινητήρα-γεννήτρια
    48 Volt ενσωματωμένο στο κιβώτιο μετάδοσης της
    κίνησης και συνδυασμένο με μετατροπέα συνεχούς/συνεχούς
    ρεύματος 48 Volt/12 Volt
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/252, 21. veebruar 2022, millega muudetakse
    rakendusotsust (EL) 2020/1167, et täpsustada 48 V / 12 V alalispingemuunduriga
    ühendatud 48-voldise suure kasuteguriga mootori-generaatori suhtes kohaldatavad
    katsenõuded
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/252, annettu 21 päivänä
    helmikuuta 2022, täytäntöönpanopäätöksen (EU) 2020/1167 muuttamisesta siltä
    osin kuin on kyse vaihteistokoteloon integroituun tehokkaaseen 48 voltin moottorigeneraattoriin
    ja siihen yhdistettyyn 48/12 voltin tasavirtamuuntimeen sovellettavien testausvaatimusten
    täsmentämisestä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/252 ón gCoimisiún an 21 Feabhra 2022
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2020/1167 chun na ceanglais tástála
    a shonrú atá le cur i bhfeidhm maidir le mótar-ghineadóir éifeachtúil 48
    Volta atá comhtháite sa chásáil tras-seolta agus atá cumaiscthe le tiontaire
    48 Volta/DC 12 Volta/DC
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/252 оd 21. veljače 2022. o izmjeni
    Provedbene odluke (EU) 2020/1167 radi specificiranja zahtjeva za ispitivanje koje
    treba primjenjivati na 48-voltni učinkoviti motor-generator integriran u kućište
    mjenjača u kombinaciji s istosmjernim pretvaračem 48 V/12 V
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/252 végrehajtási határozata (2022. február 21.)
    az (EU) 2020/1167 végrehajtási határozatnak a sebességváltóházba beépített
    és 48 V/12 V-os DC/DC-átalakítóval kombinált 48 V-os hatékony motorgenerátorra
    alkalmazandó vizsgálati követelmények meghatározása érdekében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/252 della Commissione del 21 febbraio
    2022 che modifica la decisione di esecuzione (UE) 2020/1167 al fine di specificare
    i requisiti di prova da applicare a un generatore-starter efficiente a 48 volt
    integrato nella protezione della trasmissione e associato a un convertitore CC/CC
    a 48 volt/12 volt
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/252 (2022. gada 21. februāris),
    ar ko Īstenošanas lēmumu (ES) 2020/1167 groza, lai precizētu testēšanas
    prasības, kas piemērojamas efektīvam 48 V motorģeneratoram, kurš integrēts
    pārnesumkārbas korpusā un apvienots ar 48 V/12 V līdzstrāvas pārveidotāju
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/252 2022 m. vasario 21 d.
    kuriuo iš dalies keičiant Įgyvendinimo sprendimą (ES) 2020/1167 nustatomi
    bandymo reikalavimai, taikytini 48 voltų našiajam varikliui-generatoriui su
    48 voltų/12 voltų DC/DC keitikliu, integruotam į pavarų dėžės korpusą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/252 tal-21
    ta’ Frar 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2020/1167
    sabiex tispeċifika r-rekwiżiti tal-ittestjar li għandhom jiġu applikati għal
    mutur ġeneratur effiċjenti ta’ 48 Volt integrat fil-housing tat-trażmissjoni
    u kkombinat ma’ konvertitur ta’ 48 Volt/12-il Volt DC/DC
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/252 van de Commissie van 21 februari 2022
    tot wijziging van Uitvoeringsbesluit (EU) 2020/1167 teneinde de testvoorschriften
    die moeten worden toegepast voor een in de transmissiebehuizing geïntegreerde
    efficiënte motor-generator van 48 V met 48V/12V-gelijkstroomomzetter te specificeren
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/252 z dnia 21 lutego 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2020/1167 w celu określenia wymogów dotyczących badań,
    które należy stosować do wysokosprawnego 48-woltowego zespołu silnikowo-prądnicowego
    zintegrowanego z obudową przekładni i połączonego z przetwornikiem 48 V/12
    V DC/DC
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/252 da Comissão de 21 de fevereiro de
    2022 que altera a Decisão de Execução (UE) 2020/1167 a fim de especificar os
    requisitos aplicáveis ao ensaio de grupos conversores eficientes de 48 V integrados
    na caixa de transmissão e combinados com um conversor CC/CC de 48 V/12 V
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/252 a Comisiei din 21 februarie
    2022 de modificare a Deciziei de punere în aplicare (UE) 2020/1167 pentru a preciza
    cerințele de încercare care trebuie aplicate starter-alternatorului de înalt
    randament de 48 de volți integrat în carcasa de transmisie și combinat cu un
    convertor de 48 V/12 V CC/CC
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/252 z 21. februára 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2020/1167 s cieľom špecifikovať skúšobné
    požiadavky, ktoré sa majú uplatňovať na účinný motor-generátor s napätím
    48 voltov zabudovaný v prevodovej skrini v kombinácii s konvertorom typu DC/DC
    s napätím 48 voltov/12 voltov
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/252 z dne 21. februarja 2022 o spremembi
    Izvedbenega sklepa (EU) 2020/1167, da se določijo zahteve za preizkušanje, ki
    se uporabljajo za 48-voltni učinkoviti motor-generator, vgrajen v ohišje menjalnika
    in kombiniran z 48/12-voltnim pretvornikom DC/DC
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/252 de la Comisión de 21 de febrero
    de 2022 por la que se modifica la Decisión de Ejecución (UE) 2020/1167 a fin
    de especificar los requisitos de ensayo que deben aplicarse a un generador de
    motor eficiente de 48 voltios integrado en la caja de transmisión y combinado
    con un convertidor CC/CC de 48 voltios/12 voltios
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/252 av den 21 februari 2022
    om ändring av genomförandebeslut (EU) 2020/1167 i syfte att specificera de testkrav
    som ska tillämpas på en effektiv 48 volts motorgenerator inbyggd i växellådan
    tillsammans med en 48V/12V likströmsomvandlare
  type: main
