    x MON-Ø1445-2) toodetud toodete loa kehtivust ning antakse Euroopa Parlamendi
    ja nõukogu määruse (EÜ) nr 1829/2003 kohaselt luba geneetiliselt muundatud
    puuvillast MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) toodetud puuvillaseemneõli
    turulelaskmiseks (teatavaks tehtud numbri C(2015) 2769 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/695, annettu 24 päivänä
    huhtikuuta 2015, muuntogeenisestä puuvillasta MON 531 x MON 1445 (MON-ØØ531-6
    x MON-Ø1445-2) valmistettujen olemassa olevien tuotteiden lupien uusimisesta
    ja muuntogeenisestä puuvillasta MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2)
    valmistetun elintarvikkeeksi tarkoitetun puuvillansiemenöljyn markkinoille saattamisen
    sallimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti
    (tiedoksiannettu numerolla C(2015) 2769)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/695 оd 24. travnja 2015. o obnovi
    odobrenja za postojeće proizvode od genetski modificiranog pamuka MON 531 x MON
    1445 (MON-ØØ531-6 x MON-Ø1445-2) i o odobravanju stavljanja na tržište pamukova
    ulja proizvedenog od genetski modificiranog pamuka MON 531 x MON 1445 (MON-ØØ531-6
    x MON-Ø1445-2) u skladu s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća
    (priopćeno pod brojem dokumenta C(2015) 2769)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/695 végrehajtási határozata (2015. április 24.)
    a géntechnológiával módosított MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2)
    gyapotból előállított létező termékek 1829/2003/EK európai parlamenti
    és tanácsi rendelet szerinti engedélyének megújításáról és a géntechnológiával
    módosított MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) gyapotból előállított
    gyapotmagolaj forgalomba hozatalának az 1829/2003/EK európai parlamenti és
    tanácsi rendelet szerinti engedélyezéséről (az értesítés a C(2015) 2769.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/695 della Commissione, del 24 aprile
    2015, che rinnova l'autorizzazione per gli attuali prodotti in cotone geneticamente
    modificato MON 531 × MON 1445 (MON-ØØ531-6 × MON-Ø1445-2) e che autorizza
    l'immissione sul mercato di olio di semi di cotone ottenuto a partire da cotone
    geneticamente modificato MON 531 × MON 1445 (MON-ØØ531-6 × MON-Ø1445-2) ai
    sensi del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2015) 2769]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/695 (2015. gada 24. aprīlis),
