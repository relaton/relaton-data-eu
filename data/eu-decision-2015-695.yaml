    atļauju esošajiem ģenētiski modificētās kokvilnas MON 531 × MON 1445 (MON-ØØ531-6
    × MON-Ø1445-2) produktiem un atļauj laist tirgū no ģenētiski modificētās
    kokvilnas MON 531 × MON 1445 (MON-ØØ531-6 × MON-Ø1445-2) ražotu kokvilnas
    sēklu eļļu (izziņots ar dokumenta numuru C(2015) 2769)
  type: main
- language: lt
