    genetic MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) și de autorizare a
    introducerii pe piață a uleiului din semințe de bumbac fabricat din bumbac
    modificat genetic MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2), în temeiul
