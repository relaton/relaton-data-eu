    за съществуващи продукти от генетично модифициран
    памук MON 531 × MON 1445 (MON-ØØ531-6 × MON-Ø1445-2) и за разрешаване
    на пускането на пазара на памучно масло, произведено
    от генетично модифициран памук MON 531 × MON 1445
    (MON-ØØ531-6 × MON-Ø1445-2) в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2015) 2769)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/695 ze dne 24. dubna 2015, kterým
    se obnovuje povolení pro stávající produkty z geneticky modifikované bavlny
    MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) a kterým se povoluje uvedení
    na trh oleje z bavlníkových semen vyráběného z geneticky modifikované bavlny
    MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) podle nařízení Evropského
    parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2015) 2769)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/695 af 24. april 2015
    om forlængelse af tilladelsen til eksisterende produkter fremstillet af genetisk
    modificeret MON 531 × MON 1445-bomuld (MON-ØØ531-6 × MON-Ø1445-2) og om tilladelse
    af markedsføring af bomuldsfrøolie fremstillet af genetisk modificeret MON 531
    × MON 1445-bomuld (MON-ØØ531-6 × MON-Ø1445-2) i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2015) 2769)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/695 της Επιτροπής,
    της 24ης Απριλίου 2015, για την ανανέωση της έγκρισης
    για υφιστάμενα προϊόντα από γενετικώς τροποποιημένο
    βαμβάκι της σειράς MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2)
