    leidimas pateikti rinkai esamus genetiškai modifikuotos medvilnės MON 531 x
    MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) produktus ir leidžiama pateikti rinkai
    vilnamedžių sėklų aliejų, pagamintą iš genetiškai modifikuotos medvilnės
    MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) (pranešta dokumentu Nr. C(2015)
    2769)
  type: main
