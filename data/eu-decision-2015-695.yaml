title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/695 of 24 April 2015 renewing
    the authorisation for existing genetically modified cotton MON 531 x MON 1445
    (MON-ØØ531-6 x MON-Ø1445-2) products and authorising the placing on the market
    of cottonseed oil produced from genetically modified cotton MON 531 x MON 1445
    (MON-ØØ531-6 x MON-Ø1445-2) pursuant to Regulation (EC) No 1829/2003 of the
    European Parliament and of the Council (notified under document C(2015) 2769)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/695 de la Commission du 24 avril 2015
    renouvelant l'autorisation de mise sur le marché de produits issus du coton génétiquement
    modifié MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) et autorisant la mise
    sur le marché de l'huile de coton produite à partir du coton génétiquement
    modifié MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2), en vertu du règlement
    (CE) n° 1829/2003 du Parlement européen et du Conseil [notifiée sous le numéro
    C(2015) 2769]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/695 der Kommission vom 24. April 2015
    zur Erneuerung der Zulassung bereits existierender Erzeugnisse aus genetisch veränderter
    Baumwolle der Sorte MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) und über
    die Zulassung des Inverkehrbringens von aus genetisch veränderter Baumwolle der
    Sorte MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) gewonnenem Baumwollsamenöl
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekanntgegeben unter Aktenzeichen C(2015) 2769)
  type: main
- language: bg
  script: Cyrl
