    βαμβάκι της σειράς MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2),
    σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003 του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
