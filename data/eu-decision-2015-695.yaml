    April 2015 li ġġedded l-awtorizzazzjoni għall-prodotti eżistenti tal-qoton
    ġenetikament modifikat MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) u li
    tawtorizza t-tqegħid fis-suq taż-żejt taż-żerriegħa tal-qoton prodott mill-qoton
    ġenetikament modifikat MON 531 x MON 1445 (MON-ØØ531-6 x MON-Ø1445-2) skont
