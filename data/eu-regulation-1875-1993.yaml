    in Bulgarien, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1875/93 af 12. juli 1993 om genindførelse
