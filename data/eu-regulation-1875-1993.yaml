  content: COMMISSION REGULATION (EEC) No 1875/93 of 12 July 1993 re-establishing
    the levying of customs duties on products of category 39 (order No 40.0390), originating
    in Bulgaria, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1875/93 de la Commission du 12 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 39 (numéro d'ordre 40.0390) originaires de Bulgarie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
