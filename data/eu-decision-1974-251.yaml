---
id: EUDecision1974251
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 April 1974 authorizing the French Republic not
    to apply Community treatment to cotton undergarments, knitted or crocheted, not
    elastic or rubberized, falling within heading No 60.04 A of the Common Customs
    Tariff, originating in Romania, and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/251/CEE de la Commission, du 18 avril 1974, autorisant la
    République française à exclure du traitement communautaire les sous-vêtements
    de bonneterie non élastique ni caoutchoutée, de coton, de la position 60.04
    A du Tarif douanier commun, originaires de Roumanie et mis en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. April 1974, mit der die Französische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifnummer 60.04 A des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. april 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    af trikotage, ikke elastisk eller gummeret, af bomuld, som henhører under postion
    60.04 A i den fælles toldtarif, har oprindelse i Rumænien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 aprile 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le sottovesti a maglia non elastica
    né gommata, di cotone, della voce n. 60.04 A della tariffa doganale comune, originarie
    della Romania e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 april 1974 waarbij de Franse Republiek
    wordt gemachtigd onderkleding van niet-elastisch of van niet-gegummeerd breien
    haakwerk, van katoen van post 60.04 A van het gemeenschappelijk douanetarief,
    van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
