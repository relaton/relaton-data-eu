    acompte sur les dépenses effectuées pendant l''année 1976 pour les aides et
    primes relatives à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Dezember 1977 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1976 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    die Französische Republik
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 23. december 1977 om udbetaling gennem EUGFL,
    udviklingssektionen, til Den franske Republik af et acontobeløb for de udgifter,
