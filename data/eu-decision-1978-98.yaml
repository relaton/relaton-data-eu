  content: Commission Decision of 23 December 1977 on the granting by the Guidance
    Section of the EAGGF to the French Republic of a payment on account in respect
    of expenditure incurred during 1976 on aids and premiums relating to the modernization
    of farms
  type: main
- language: fr
  script: Latn
  content: '78/98/CEE: Décision de la Commission, du 23 décembre 1977, relative
