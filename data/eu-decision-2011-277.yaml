    на някои региони в Италия като официално свободни
    от бруцелоза ( B. melitensis ) и за изменение на приложенията
    към Решение 2003/467/ЕО по отношение на обявяването,
    че някои региони в Италия, Полша и в Обединеното
    кралство са официално свободни от туберкулоза
    по говедата, бруцелоза по говедата и ензоотична
    левкоза по говедата (нотифицирано под номер
    C(2011) 3066)'
  type: main
- language: cs
  script: Latn
  content: '2011/277/EU: Prováděcí rozhodnutí Komise ze dne 10. května 2011 ,
    kterým se mění příloha II rozhodnutí 93/52/EHS, pokud jde o uznání určitých
    oblastí Itálie úředně prostými brucelózy ( B. melitensis ), a kterým se
    mění přílohy rozhodnutí 2003/467/ES, pokud jde o prohlášení, že určité
    oblasti Itálie, Polska a Spojeného království jsou úředně prosté tuberkulózy,
    brucelózy a enzootické leukózy skotu (oznámeno pod číslem K(2011) 3066)'
  type: main
