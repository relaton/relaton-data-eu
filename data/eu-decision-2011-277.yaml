title:
- language: en
  script: Latn
  content: '2011/277/EU: Commission Implementing Decision of 10 May 2011 amending
    Annex II to Decision 93/52/EEC as regards the recognition of certain regions in
    Italy as officially free of brucellosis ( B. melitensis ) and amending the Annexes
    to Decision 2003/467/EC as regards the declaration that certain regions of Italy,
    Poland and the United Kingdom are officially free of bovine tuberculosis, bovine
    brucellosis and enzootic bovine leukosis (notified under document C(2011) 3066)'
  type: main
- language: fr
  script: Latn
  content: '2011/277/UE: Décision d’exécution de la Commission du 10 mai 2011
    modifiant l’annexe II de la décision 93/52/CEE en ce qui concerne certaines
    régions de l’Italie reconnues comme officiellement indemnes de brucellose (
    B. melitensis ) et modifiant les annexes de la décision 2003/467/CE en ce qui
    concerne certaines régions de l’Italie, de la Pologne et du Royaume-Uni déclarées
    officiellement indemnes de tuberculose bovine, de brucellose bovine et de leucose
    bovine enzootique [notifiée sous le numéro C(2011) 3066]'
  type: main
- language: de
  script: Latn
  content: '2011/277/EU: Durchführungsbeschluss der Kommission vom 10. Mai 2011 zur
    Änderung des Anhangs der Entscheidung 93/52/EWG hinsichtlich der Anerkennung
    bestimmter italienischer Regionen als amtlich frei von Brucellose (B. melitensis)
    sowie zur Änderung der Anhänge der Entscheidung 2003/467/EG hinsichtlich der
    Anerkennung bestimmter italienischer, polnischer und britischer Regionen als amtlich
    frei von Rindertuberkulose, Rinderbrucellose und enzootischer Rinderleukose (Bekannt
    gegeben unter Aktenzeichen K(2011) 3066)'
  type: main
- language: bg
  script: Cyrl
  content: '2011/277/ЕС: Решение за изпълнение на Комисията
    от 10 май 2011 година за изменение на приложение
