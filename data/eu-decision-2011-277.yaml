    af visse regioner i Italien som officielt frie for brucellose (B. melitensis)
    og om ændring af bilagene til beslutning 2003/467/EF for så vidt angår erklæringen
    om, at visse regioner i Italien, Polen og Det Forenede Kongerige er officielt
    frie for kvægtuberkulose, kvægbrucellose og enzootisk kvægleukose (meddelt
