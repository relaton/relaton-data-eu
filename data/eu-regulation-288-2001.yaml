    der Gemeinschaft für die Schaf- und Ziegenfleischerzeugung zu gewährende Sonderbeihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 288/2001 af 12. februar 2001 om fastsættelse
