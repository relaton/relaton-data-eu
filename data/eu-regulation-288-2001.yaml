title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 288/2001 of 12 February 2001 determining
    the loss of income and the premiums applicable per ewe and per female goat in
    the Member States and the payment of the specific aid for sheep and goat farming
    in certain less-favoured areas of the Community for the 2000 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 288/2001 de la Commission du 12 février 2001 déterminant,
