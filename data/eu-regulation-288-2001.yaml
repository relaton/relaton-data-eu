    per pecora e per capra negli Stati membri e il versamento dell'aiuto specifico
    a favore dell'allevamento ovino e caprino in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 288/2001 van de Commissie van 12 februari 2001 tot
