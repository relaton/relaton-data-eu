title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1987/2000 of 20 September 2000 setting the
    level of Community quantitative limits on re-importation into the European Community
    of textile products of category 13 originating in the People's Republic of China
    after economic outward processing operations in that country and amending Council
    Regulation (EEC) No 3030/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1987/2000 de la Commission du 20 septembre 2000 fixant
    le niveau de la limite quantitative communautaire à la réimportation dans la
    Communauté européenne des produits textiles de la catégorie 13 originaires
    de la République populaire de Chine à l'issue d'opérations de perfectionnement
    passif économique effectuées dans ce pays et modifiant le règlement (CEE) nº
    3030/93 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1987/2000 der Kommission vom 20. September 2000 zur
    Festsetzung der gemeinschaftlichen Höchstmenge für Textilwaren der Kategorie
    13 mit Ursprung in der Volksrepublik China, die nach passiver Veredelung in diesem
    Land in die Europäische Gemeinschaft wiedereingeführt werden, und zur Änderung
    der Verordnung (EWG) Nr. 3030/93 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1987/2000 af 20. september 2000 om fastsættelse
    af niveauet for Fællesskabets kvantitative lofter ved genindførsel i Det Europæiske
    Fællesskab af tekstilprodukter i kategori 13 med oprindelse i Folkerepublikken
    Kina efter økonomisk passiv forædling i dette land og om ændring af Rådets
    forordning (EØF) nr. 3030/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1987/2000 της Επιτροπής,
    της 20ής Σεπτεμβρίου 2000, για καθορισμό του κοινοτικού
    επιπέδου του ποσοτικού ορίου για την επανεισαγωγή
    στην Ευρωπαϊκή Κοινότητα κλωστοϋφαντουργικών
    προϊόντων της κατηγορίας 13 καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας, μετά από τις οικονομικές
    πράξεις τελειοποίησης για επανεισαγωγή στη
    χώρα αυτή και τροποποίηση του κανονισμού (ΕΟΚ)
    αριθ. 3030/93 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1987/2000, annettu 20 päivänä syyskuuta 2000,
    yhteisön määrällisen rajoituksen vahvistamisesta Kiinan kansantasavallasta
    peräisin olevien luokkaan 13 kuuluvien tekstiilituotteiden jälleentuonnissa
    Euroopan yhteisöön Kiinan kansantasavallassa suoritettujen taloudellisesti vaikuttavien
    ulkoisten jalostustoimintojen jälkeen ja neuvoston asetuksen (ETY) N:o 3030/93
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1987/2000 della Commissione, del 20 settembre 2000,
    che stabilisce il livello del limite quantitativo comunitario applicabile alle
    reimportazioni nella Comunità europea dei prodotti tessili della categoria 13
    originari della Repubblica popolare cinese previo perfezionamento passivo economico
    in detto paese e che modifica il regolamento (CEE) n. 3030/93 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1987/2000 van de Commissie van 20 september 2000 tot
    vaststelling van het kwantitatieve maximum van de Gemeenschap voor de wederinvoer
    in de Europese Gemeenschap van textielproducten van categorie 13 van oorsprong
    uit de Volksrepubliek China na economische passieve veredeling in dat land en
    tot wijziging van Verordening (EEG) nr. 3030/93 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1987/2000 da Comissão, de 20 de Setembro de 2000,
    que fixa o nível dos limites quantitativos comunitários para a reimportação
    na Comunidade Europeia dos produtos têxteis da categoria 13 originários da República
    Popular da China após operações de aperfeiçoamento passivo económico realizadas
    neste país e que altera o Regulamento (CEE) n.o 3030/93 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1987/2000 de la Comisión, de 20 de septiembre de 2000,
    por el que se fija el nivel del límite cuantitativo comunitario para la reimportación
    en la Comunidad Europea de productos textiles de la categoría 13 originarios
    de la República Popular de China, previo régimen de perfeccionamiento pasivo
    económico en ese país, y por el que se modifica el Reglamento (CEE) nº 3030/93
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1987/2000 av den 20 september 2000 om
