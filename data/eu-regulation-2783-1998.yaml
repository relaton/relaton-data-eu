    às medidas específicas decididas a favor dos departamentos franceses ultramarinos
    nos sectores das frutas e produtos hortícolas, das plantas e das flores e determina
    a estimativa de abastecimento para 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2783/98 de la Comisión de 22 de diciembre de 1998
    por el que se modifica el Reglamento (CE) nº 1524/98 por el que se establecen
    las disposiciones de aplicación relativas a las medidas específicas adoptadas
    en favor de los departamentos franceses de Ultramar en los sectores de las frutas
