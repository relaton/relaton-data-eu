    departementtien hyväksi annettujen erityistoimenpiteiden soveltamista koskevista
    yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 1524/98 muuttamisesta
    ja arvioidun hankintataseen määrittämisestä vuodeksi 1999
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2783/98 della Commissione del 22 dicembre 1998 recante
