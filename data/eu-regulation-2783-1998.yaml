    κανονισμού (ΕΚ) αριθ. 1524/98 όσον αφορά τις λεπτομέρειες
    εφαρμογής σχετικές με τα ειδικά μέτρα τα οποία
    ελήφθησαν υπέρ των γαλλικών υπερποντίων διαμερισμάτων
    στους τομείς των οπωροκηπευτικών, των φυτών
    και ανθέων και τον καθορισμό του κατά πρόβλεψη
    ισολογισμού ανεφοδιασμού για το 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2783/98, annettu 22 päivänä joulukuuta 1998,
