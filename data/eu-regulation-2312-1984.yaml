title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2312/84 of 7 August 1984 re-establishing
    the levying of customs duties on synthetic textile fibres (discontinuous), products
    of category 124 (code 1240), originating in Mexico, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2312/84 de la Commission du 7 août 1984 portant rétablissement
    de la perception des droits de douane applicables aux fibres textiles synthétiques
    discontinues, de la catégorie 124 (code 1240), originaires du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2312/84 der Kommission vom 7. August 1984 über die
    Wiedereinführung des Zollsatzes für synthetische Spinnfasern der Warenkategorie
    Nr. 124 (Kennziffer 1240) mit Ursprung in Mexiko, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2312/84 af 7. august 1984 om genindførelse
    af opkrævning af toldafgifter for korte syntetiske fibre under varekategori nr.
    124 (kode 1240), som har oprindelse i Mexiko, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2312/84 της Επιτροπής
    της 7ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τις μη συνεχείς
    συνθετικές ίνες, προϊόντα της κατηγορίας 124
    (κωδικός 1240), καταγωγής Μεξικού, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3570/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2312/84 della Commissione del 7 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili alle fibre tessili sintetiche (in
    fiocco), della categoria di prodotti n. 124 (codice 1240), originarie del Messico
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2312/84 van de Commissie van 7 augustus 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op synthetische
    stapelvezels van de categorie van produkten nr. 124 (codenummer 1240), van oorsprong
    uit Mexico, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3570/83 van de Raad
  type: main
