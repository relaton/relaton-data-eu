id: EURegulation4861980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 486/80 of 28 February 1980 laying down detailed
    rules for the application in the beef and veal sector of Regulation (EEC) No 435/80
    on the arrangements applicable to agricultural products and certain goods resulting
    from the processing of agricultural products originating in the African, Caribbean
    and Pacific States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 486/80 de la Commission, du 28 février 1980, fixant
    les modalités d' application dans le secteur de la viande bovine du règlement
    (CEE) n° 435/80 relatif au régime applicable à des produits agricoles et à
    certaines marchandises résultant de la transformation de produits agricoles originaires
    des États d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires
    d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 486/80 der Kommission vom 28. Februar 1980 zur Festlegung
    der Durchführungsbestimmungen im Sektor Rindfleisch zu der Verordnung (EWG) Nr.
    435/80 über die Regelung für landwirtschaftliche Erzeugnisse und bestimmte aus
    landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean sowie in den überseeischen
    Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 486/80 af 28. februar 1980 om fastsættelse
    af gennemførelsesbestemmelser til forordning (EØF) nr. 435/80 om den ordning,
    der skal gælde for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter
    med oprindelse i Afrika, Vestindien og Stillehavet eller i de oversøiske lande
    og territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 486/80 της Επιτροπής,
    της 28ης Φεβρουαρίου 1980, περί καθορισμού των
    μεθόδων εφαρμογής στον τομέα του βοείου κρέατος
    του Κανονισμού ( ΕΟΚ ) αριθ. 435/80 όσον αφορά το
    καθεστώς που ισχύει στα γεωργικά προϊόντα
    και ορισμένα εμπορεύματα που προέρχονται από
    την μεταποίηση γεωργικών προϊόντων προέλευσης
    των κρατών Αφρικής, Καραϊβικής και Ειρηνικού
    ή υπερπόντιων χωρών και εδαφών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 486/80 della Commissione, del 28 febbraio 1980, che
    fissa le modalità d' applicazione, nel settore delle carni bovine, del regolamento
    (CEE) n. 435/80 relativo al regime applicabile a taluni prodotti agricoli e a
    talune merci risultanti dalla trasformazione di prodotti agricoli, originari degli
    Stati d' Africa, dei Caraibi e del Pacifico o dei paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 486/80 van de Commissie van 28 februari 1980 tot
    vaststelling van uitvoeringsbepalingen in de sector rundvlees van Verordening
    (EEG) nr. 435/80 inzake de regeling voor landbouwprodukten en bepaalde door verwerking
    van landbouwprodukten verkregen goederen, van oorsprong uit de Staten in Afrika,
    het Caribische gebied en de Stille Oceaan of uit de landen en gebieden overzee
  type: main
