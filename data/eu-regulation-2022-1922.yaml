title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2022/1922 of 10 October 2022 amending the Annex
    to Regulation (EU) No 231/2012 laying down specifications for food additives listed
    in Annexes II and III to Regulation (EC) No 1333/2008 of the European Parliament
    and of the Council as regards specifications for rebaudiosides M, D and AM produced
    via enzymatic conversion of puriﬁed stevia leaf extracts and the specifications
    for rebaudioside M produced via enzyme modification of steviol glycosides from
    Stevia (E 960c(i))
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1922 de la Commission du 10 octobre 2022 modifiant
    l’annexe du règlement (UE) no 231/2012 établissant les spécifications des
    additifs alimentaires énumérés aux annexes II et III du règlement (CE) no
    1333/2008 du Parlement européen et du Conseil en ce qui concerne les spécifications
    des rébaudiosides M, D et AM produits par conversion enzymatique d’extraits
    purifiés de feuilles de Stevia et les spécifications du rébaudioside M produit
    par modification enzymatique des glycosides de stéviol issus de Stevia [E 960c
    (i)]
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/1922 der Kommission vom 10. Oktober 2022 zur Änderung
