    Anhängen II und III der Verordnung (EG) Nr. 1333/2008 des Europäischen Parlaments
    und des Rates aufgeführten Lebensmittelzusatzstoffe hinsichtlich der Spezifikationen
    für Rebaudioside M, D und AM, die durch enzymatische Konversion von gereinigten
    Blattextrakten der Steviapflanze gewonnen werden, und der Spezifikationen für
    Rebaudiosid M, das durch Enzymmodifikation von Steviolglycosiden aus Stevia (E
    960c(i)) gewonnen wird
