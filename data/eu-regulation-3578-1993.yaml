title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3578/93 of 27 December 1993 amending Regulation
    (EEC) No 2784/93 opening a standing invitation to tender for the resale on the
    internal market of durum wheat and increasing to 300 000 tonnes the amount of
    durum wheat held by the Greek intervention agency with a view to its processing
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3578/93 de la Commission, du 27 décembre 1993, modifiant
    le règlement (CEE) n 2784/93 et portant à 300 000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de blé dur détenu par l'organisme
    d'intervention grec en vue de sa transformation dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3578/93 der Kommission vom 27. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 2784/93 und zur Erweiterung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt auf 300 000 Tonnen Hartweizen aus Beständen
    der griechischen Interventionsstelle zwecks Verarbeitung in den anderen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3578/93 af 27. december 1993 om ændring
    af forordning (EØF) nr. 2784/93 og om forhøjelse til 300 000 tons af den løbende
