    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3578/93 van de Commissie van 27 december 1993 tot
    wijziging van Verordening (EEG) nr. 2784/93 en tot verhoging van de hoeveelheid
    waarop de permanente openbare inschrijving voor de verkoop op de interne markt
    van durum tarwe uit Griekse interventievoorraden met het oog op verwerking in
    de andere Lid-Staten betrekking heeft, tot 300 000 ton
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3578/93 da Comissão, de 27 de Dezembro de 1993, que
