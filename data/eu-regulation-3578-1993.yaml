    της 27ης Δεκεμβρίου 1993 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2784/93 και για καθορισμό σε 300 000 τόνους
    της διαρκούς δημοπρασίας για τη μεταπώληση
    στην εσωτερική αγορά σκληρού σίτου που κατέχεται
