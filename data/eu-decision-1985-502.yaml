title:
- language: en
  script: Latn
  content: '85/502/EEC: Commission Decision of 7 October 1985 laying down, for the
    purposes of the surveys on the structure of agricultural holdings for 1985 and
    1987, the Community outline of a schedule of tables, the standard code and rules
    for the transcription on to magnetic tape of the data contained in those tables'
  type: main
- language: fr
  script: Latn
  content: '85/502/CEE: Décision de la Commission du 7 octobre 1985 fixant, en vue
    des enquêtes sur la structure des exploitations agricoles pour 1985 et 1987,
    le schéma communautaire d'' un programme de tableaux, le code uniforme et les
    modalités de transcription sur bande magnétique des données de ces tableaux'
  type: main
- language: de
  script: Latn
  content: '85/502/EWG: Entscheidung der Kommission vom 7. Oktober 1985 zur Festlegung
    eines nach dem Gemeinschaftsschema erstellten Tabellenprogramms, eines einheitlichen
    Kodes sowie der Durchführungsbestimmungen für die Übertragung der Daten aus
    den genannten Tabellen auf Magnetbänder zum Zweck der Durchführung von Erhebungen
    über die Struktur der landwirtschaftlichen Betriebe 1985 und 1987'
  type: main
- language: da
  script: Latn
  content: '85/502/EØF: Kommissionens beslutning af 7. oktober 1985 om fastsættelse,
    med henblik på undersøgelser af landbrugsbedrifternes struktur i 1985 og 1987
    af fællesskabsmodellen til et tabelprogram, standardkoden samt bestemmelser for
    overførsel til magnetbånd af oplysningerne i disse tabeller'
  type: main
- language: el
  script: Grek
  content: '85/502/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Οκτωβρίου
    1985 που καθορίζει, για τους σκοπούς των ερευνών
    για τη διάρθρωση των γεωργικών εκμεταλλεύσεων
    για το 1985 και το 1987, το κοινοτικό διάγραμμα
    καταλόγου πινάκων μαζί με την ενιαία μέθοδο
    και τους λεπτομερείς κανόνες εγγραφής σε μαγνητοταινία
    των στοιχείων που περιέχονται στους πίνακες
    αυτούς'
  type: main
- language: it
  script: Latn
  content: '85/502/CEE: Decisione della Commissione del 7 ottobre 1985 che stabilisce,
    ai fini delle indagini delle strutture delle aziende agricole per il 1985 e il
    1987, lo schema comunitario di un programma di tabelle, il codice uniforme e le
    modalità di trascrizione dei dati su nastro magnetico'
  type: main
- language: nl
  script: Latn
  content: '85/502/EEG: Beschikking van de Commissie van 7 oktober 1985 houdende vaststelling,
    voor de enquêtes inzake de structuur van de landbouwbedrijven 1985 en 1987, van
    het communautaire schema voor een tabellenprogramma, de uniforme code en de voorschriften
    voor het opnemen van de gegevens van deze tabellen op magneetband'
  type: main
- language: pt
  script: Latn
  content: '85/502/CEE: Decisão da Comissão, de 7 de Outubro de 1985, que fixa,
    com vista aos inquéritos sobre a estrutura das explorações agrícolas para
    1985 e 1987, o esquema comunitário de um programa de quadros, o código uniforme
    e as modalidades de transcrição para a banda magnética dos dados destes quadros'
  type: main
- language: es
  script: Latn
  content: '85/502/CEE: Decisión de la Comisión, de 7 de octubre de 1985, por la
    que se establecen el plan comunitario de un programa de cuadros, el código uniforme
    y las modalidades de transcripción en cinta magnética de los datos de dichos
    cuadros, con vistas a las encuestas sobre la estructura de las explotaciones agrícolas
    para 1985 y 1987'
  type: main
