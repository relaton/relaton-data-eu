title:
- language: en
  script: Latn
  content: '78/996/EEC: Commission Decision of 23 November 1978 authorizing the United
    Kingdom not to apply Community treatment to tents, falling within heading No ex
    62.04 of the Common Customs Tariff (NIMEXE codes 62.04-23, 73), originating in
    South Korea and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/996/CEE: Décision de la Commission, du 23 novembre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tentes de la position
    ex 62.04 du tarif douanier commun (codes Nimexe: 62.04-23; 73), originaires de
    Corée du Sud et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/996/EWG: Entscheidung der Kommission vom 23. November 1978, mit der
    das Vereinigte Königreich ermächtigt wird, aus Südkorea stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Zelte der Tarifnummer ex
    62.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.04-23; 73) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/996/EØF: Kommissionens beslutning af 23. november 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage telte, som
    henhører under pos. ex 62.04 i den fælles toldtarif (NIMEXE-kode 62.04-23, 73),
    har oprindelse i Sydkorea og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/996/CEE: Decisione della Commissione, del 23 novembre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario le tende della voce ex
    62.04 della tariffa doganale comune (codice Nimexe 62.04-23, 73), originari della
    Corea del Sud e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/996/EEG: Beschikking van de Commissie van 23 november 1978 waarbij
    het Verenigd Koninkrijk wordt gemachtigd tenten van post ex 62.04 van het gemeenschappelijk
    douanetarief (NIMEXE-code : 62.04-23 ; 73), van oorsprong uit Zuid-Korea en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
