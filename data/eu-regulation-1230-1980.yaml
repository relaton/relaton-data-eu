  content: Commission Regulation (EEC) No 1230/80 of 19 May 1980 amending for the
    eight time Regulation (EEC) No 2223/70 waiving the countervailing charge on imports
    of certain wines originating in and coming from certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1230/80 de la Commission, du 19 mai 1980, portant
