    di una tassa di compensazione all' importazione di taluni vini originari e in
    provenienza da alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1230/80 van de Commissie van 19 mei 1980 tot achtste
