    de particuliere opslag van tafelwijn, druivemost, geconcentreerde druivemost en
    gerectificeerde geconcentreerde druivemost voor het wijnoogstjaar 1987/1988
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 34/88 da Comissão de 5 de Janeiro de 1988 que permite
