title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 34/88 of 5 January 1988 authorizing the
    conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1987/88 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 34/88 de la Commission du 5 janvier 1988 ouvrant la
    possibilité de conclure des contrats de stockage privé à long terme pour le
    vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1987/1988
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 34/88 der Kommission vom 5. Januar 1988 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifiziertem Traubenmost für das Wirtschaftsjahr 1987/1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 34/88 af 5. januar 1988 om adgang til
    indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost,
    koncentreret druemost og rektificeret koncentreret druemost for produktionsåret
    1987/88
  type: main
- language: el
  script: Grek
