title:
- language: en
  script: Latn
  content: '2006/285/EC: Commission Decision of 12 April 2006 amending Decision 2003/135/EC
    as regards the extension of plans for the eradication and emergency vaccination
    of feral pigs against classical swine fever to certain areas of North Rhine-Westfalia
    and Rhineland-Palatinate and the termination of these plans in other areas of
    Rhineland-Palatinate (Germany) (notified under document number C(2006) 1531)'
  type: main
- language: fr
  script: Latn
  content: '2006/285/CE: Décision de la Commission du 12 avril 2006 modifiant la
    décision 2003/135/CE en ce qui concerne l''extension des plans pour l''éradication
    de la peste porcine classique dans la population de porcs sauvages et pour la
    vaccination d''urgence de ces porcs contre la peste porcine classique dans certaines
    zones des Länder de Rhénanie-du-Nord-Westphalie et de Rhénanie-Palatinat et
    la fin de ces plans dans certaines autres zones de Rhénanie-Palatinat (Allemagne)
    [notifiée sous le numéro C(2006) 1531]'
  type: main
