title:
- language: en
  script: Latn
  content: Council Implementing Decision of 15 December 2009 authorising the Republic
    of Estonia to apply a measure derogating from Article 167 of Directive 2006/112/EC
    on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution du Conseil du 15 décembre 2009 autorisant la
    République d’Estonie à appliquer une mesure dérogatoire à l’article 167
    de la directive 2006/112/CE relative au système commun de taxe sur la valeur
    ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss des Rates vom 15. Dezember 2009 zur Ermächtigung
    der Republik Estland, eine von Artikel 167 der Richtlinie 2006/112/EG über das
    gemeinsame Mehrwertsteuersystem abweichende Regelung anzuwenden
  type: main
- language: bg
  script: Cyrl
  content: '2009/1022/ЕС: Решение за изпълнение на Съвета
    от 15 декември 2009 година за предоставяне на
    разрешение на Република Естония да прилага
    мярка за дерогация от член 167 от Директива 2006/112/ЕО
    относно общата система на данъка върху добавената
    стойност'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady ze dne 15. prosince 2009 , kterým se Estonské
    republice povoluje použít opatření odchylující se od článku 167 směrnice
    2006/112/ES o společném systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesbeslutning af 15. december 2009 om bemyndigelse
    af Republikken Estland til at anvende en foranstaltning, der fraviger artikel
    167 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική Επιτροπή του Συμβουλίου, της
    15ης Δεκεμβρίου 2009 , που επιτρέπει στη Δημοκρατία
    της Εσθονίας να εφαρμόσει μέτρο παρέκκλισης
    από το άρθρο 167 της οδηγίας 2006/112/ΕΚ του Συμβουλίου,
    σχετικά με το κοινό σύστημα φόρου προστιθέμενης
    αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus, 15. detsember 2009 , millega lubatakse Eesti Vabariigil
    kohaldada meedet, millega tehakse erand direktiivi 2006/112/EÜ (mis käsitleb
    ühist käibemaksusüsteemi) artiklist 167
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös, annettu 15 päivänä joulukuuta
    2009 , luvan antamisesta Viron tasavallalle soveltaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 167 artiklasta poikkeavaa toimenpidettä
  type: main
- language: hu
  script: Latn
  content: A Tanács végrehajtási határozata ( 2009. december 15. ) az Észt Köztársaságnak
    a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 167.
    cikkétől eltérő intézkedés alkalmazására történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione del Consiglio, del 15 dicembre 2009 , che autorizza
    la Repubblica di Estonia ad applicare una misura di deroga all’articolo 167
    della direttiva 2006/112/CE relativa al sistema comune d’imposta sul valore
    aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes īstenošanas Lēmums ( 2009. gada 15. decembris ), ar ko Igaunijas
