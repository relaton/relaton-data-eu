    mill-Artikolu 167 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta’ taxxa
    fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Raad van 15 december 2009 waarbij de Republiek
    Estland wordt gemachtigd een maatregel toe te passen die afwijkt van artikel 167
    van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady z dnia 15 grudnia 2009 r. upoważniająca Republikę
    Estońską do stosowania środka stanowiącego odstępstwo od art. 167 dyrektywy
    2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 15 de Dezembro de 2009 , que autoriza
    a República da Estónia a aplicar uma medida derrogatória do artigo 167. o da
    Directiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 15 decembrie 2009 de autorizare
    a Republicii Estonia în vederea aplicării unei măsuri de derogare de la articolul
    167 din Directiva 2006/112/CE privind sistemul comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady z 15. decembra 2009 , ktorým sa Estónskej
    republike povoľuje uplatňovať opatrenie odchyľujúce sa od článku 167 smernice
    2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Odločba Sveta z dne 15. decembra 2009 o dovoljenju Republiki Estoniji,
    da uporabi odstopanje od člena 167 Direktive Sveta 2006/112/ES o skupnem sistemu
    davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución del Consejo, de 15 de diciembre de 2009 , por la
    que se autoriza a la República de Estonia a aplicar una medida de excepción
    a lo dispuesto en el artículo 167 de la Directiva 2006/112/CE relativa al sistema
    común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut av den 15 december 2009 om bemyndigande för
    Republiken Estland att tillämpa en åtgärd som avviker från artikel 167 i direktiv
    2006/112/EG om ett gemensamt system för mervärdesskatt
