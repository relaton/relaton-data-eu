  content: Regulation (EEC) No 1567/72 of the Council of 20 July 1972 extending Regulations
    (EEC) Nos 2313/71 and 2823/71 partially and temporarily suspending Common Customs
    Tariff duties applicable to wines originating in and coming from Algeria, Morocco,
    Tunisia and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1567/72 du Conseil, du 20 juillet 1972, prorogeant
    les règlements (CEE)" n°s 2313/71 et 2823/71 portant suspension temporaire partielle
    des droits du tarif douanier commun applicables aux vins originaires et en provenance
    de l' Algérie, du Maroc, de la Tunisie et de la Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1567/72 des Rates vom 20. Juli 1972 zur Verlängerung
    der Verordnungen (EWG) Nrn. 2313/71 und 2823/71 über die zeitweise teilweise
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Wein mit Ursprung in
    und Herkunft aus Algerien, Marokko, Tunesien und der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1567/72 af 20. juli 1972 om forlængelse
    af forordningerne (EØF) nr. 2313/71 og 2823/71 om midlertidig og delvis suspension
    af satserne i den fælles toldtarif for vin, der har oprindelse i og kommer fra
    Algeriet, Marokko, Tunesien og Tyrkiet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1567/72 del Consiglio, del 20 luglio 1972, che proroga
