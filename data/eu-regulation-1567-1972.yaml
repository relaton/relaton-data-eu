    dei dazi della tariffa doganale comune applicabili ai vini originari e provenienti
    dall' Algeria, dal Marocco, dalla Tunisia e dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1567/72 van de Raad van 20 juli 1972 tot verlenging
