  script: Latn
  content: COMMISSION REGULATION (EC) No 702/96 of 18 April 1996 determining the extent
    to which applications lodged in April 1996 for import certificates for certain
    cheeses covered by the arrangements provided for in the Europe Agreements concluded
    by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 702/96 DE LA COMMISSION du 18 avril 1996 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1996 pour certains fromages dans le cadre du régime prévu par les accords
    européens conclus par la Communauté avec la Bulgarie et la Roumanie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 702/96 DER KOMMISSION vom 18. April 1996 zur Festsetzung
