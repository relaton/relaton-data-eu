    1996 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Europa-Abkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 702/96 af 18. april 1996 om fastsættelse
