    Antrag auf erweiterte Kumulierung zwischen Kambodscha und Vietnam im Einklang
    mit Artikel 56 Absatz 1 der Delegierten Verordnung (EU) 2015/2446 in Bezug auf
    die Ursprungsregeln im Rahmen des Schemas allgemeiner Zollpräferenzen gemäß
    der Delegierten Verordnung (EU) 2015/2446 für bestimmte, bei der Herstellung
    von Fahrrädern verwendete Vormaterialien oder Teile
  type: main
