    à une demande de cumul étendu entre le Cambodge et le Viêt Nam, conformément
    à l’article 56, paragraphe 1, du règlement délégué (UE) 2015/2446, en ce
    qui concerne les règles d’origine utilisées aux fins du schéma de préférences
    tarifaires généralisées en vertu du règlement délégué (UE) 2015/2446 pour
    certaines matières ou pièces utilisées dans la production de bicyclettes
  type: main
- language: de
  script: Latn
