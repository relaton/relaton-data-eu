    uredbe (EU) 2015/2446, u pogledu pravila o podrijetlu koja se primjenjuju za potrebe
    sustava općih carinskih povlastica na temelju Delegiranje uredbe (EU) 2015/2446
    za određene materijale ili dijelove koji se upotrebljavaju u proizvodnji bicikala
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1810 határozata (2023. szeptember 19.) kerékpárok
    előállítása során felhasznált egyes anyagokra vagy alkatrészekre vonatkozóan,
    az (EU) 2015/2446 felhatalmazáson alapuló rendelet 56. cikkének (1) bekezdésével
    összhangban, az említett rendelet szerinti általános preferenciarendszer keretében
    alkalmazott származási szabályok tekintetében Kambodzsa és Vietnám között
    alkalmazandó kiterjesztett kumulációra irányuló kérelemről
  type: main
