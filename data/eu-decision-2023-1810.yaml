    56, paragrafo 1, del regolamento delegato (UE) 2015/2446, per quanto riguarda
    le norme di origine utilizzate ai fini del sistema di preferenze generalizzate
    a norma del regolamento delegato (UE) 2015/2446 per taluni materiali o parti utilizzati
    nella produzione di biciclette
  type: main
- language: lv
  script: Latn
