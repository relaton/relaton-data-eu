title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2023/1810 of 19 September 2023 on a request for
    extended cumulation between Cambodia and Vietnam, in accordance with Article 56(1)
    of Delegated Regulation (EU) 2015/2446, as regards the rules of origin used for
    the purposes of the scheme of generalized tariff preferences pursuant to Delegated
    Regulation (EU) 2015/2446 for certain materials or parts used in the production
    of bicycles
  type: main
- language: fr
  script: Latn
