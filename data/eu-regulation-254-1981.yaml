  script: Latn
  content: Commission Regulation (EEC) No 254/81 of 30 January 1981 fixing the rates
    of the refunds applicable from 1 February 1981 to certain milk products exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 254/81 de la Commission, du 30 janvier 1981, fixant
    les taux des restitutions applicables, à compter du 1er février 1981, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 254/81 der Kommission vom 30. Januar 1981 zur Festsetzung
    der ab 1. Februar 1981 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 254/81 af 30. januar 1981 om fastsættelse
