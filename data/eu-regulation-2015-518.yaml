  script: Latn
  content: Commission Implementing Regulation (EU) 2015/518 of 26 March 2015 concerning
    the authorisation of the preparation of Enterococcus faecium NCIMB 10415 as a
    feed additive for chickens reared for laying, minor poultry species for fattening
    and minor poultry species reared for laying and amending Implementing Regulation
