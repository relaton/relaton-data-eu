title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1501/95 of 29 June 1995 laying down certain
    detailed rules for the application of Council Regulation (EEC) No 1766/92 on the
    granting of export refunds on cereals and the measures to be taken in the event
    of disturbance on the market for cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1501/95 de la Commission, du 29 juin 1995, établissant
    certaines modalités d'application du règlement (CEE) n° 1766/92 du Conseil
    en ce qui concerne l'octroi des restitutions à l'exportation ainsi que les mesures
    à prendre, en cas de perturbation, dans le secteur des céréales
  type: main
- language: de
  script: Latn
