  content: Commission Regulation (EC) No 1375/97 of 17 July 1997 amending Council
    Regulation (EC) No 1981/94 opening and providing for the administration of Community
    tariff quotas for certain products originating in Algeria, Cyprus, Egypt, Israel,
    Jordan, Malta, Morocco, the West Bank and the Gaza Strip, Tunisia and Turkey,
    and providing detailed rules for extending and adapting these tariff quotas
  type: main
