    nel corso del 1995 e dell'importo unitario dell'anticipo per il 1996, nonché
    deroga al regolamento (CEE) n. 1858/93 in ordine al termine di pagamento del saldo
    dell'aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 524/96 van de Commissie van 26 maart 1996 tot vaststelling
    van het bedrag van de compenserende steun voor in 1995 in de handel gebrachte
    bananen uit de Gemeenschap, en van het bedrag per eenheid van de voorschotten
    voor 1996, en houdende afwijking van Verordening (EEG) nr. 1858/93 voor wat de
    termijn voor de betaling van het steundsaldo betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 524/96 da Comissão, de 26 de Março de 1996, que
