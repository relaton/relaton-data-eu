    em 1995, bem como o montante unitário dos adiantamentos para 1996, e derroga
    ao Regulamento (CEE) nº 1858/93 no que respeita ao prazo de pagamento do saldo
    da ajuda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 524/96 de la Comisión, de 26 de marzo de 1996, por
