title:
- language: en
  script: Latn
  content: '93/693/EC: Commission Decision of 14 December 1993 establishing a list
    of semen collection centres approved for the export to the Community of semen
    of domestic animals of the bovine species from third countries and revoking Decisions
    91/642/EEC, 91/643/EEC and 92/255/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/693/CE: Décision de la Commission, du 14 décembre 1993, établissant
    une liste de centres de collecte de sperme agréés pour l''exportation de sperme
    d''animaux domestiques de l''espèce bovine vers la Communauté en provenance
    de pays tiers et abrogeant les décisions 91/642/CEE, 91/643/CEE et 92/255/CEE'
  type: main
- language: de
  script: Latn
  content: '93/693/EG: Entscheidung der Kommission vom 14. Dezember 1993 zur Erstellung
    der Liste der zur Ausfuhr von Rindersperma in die Gemeinschaft zugelassenen Besamungsstationen
    in Drittländern sowie zur Aufhebung der Entscheidungen 91/642/EWG, 91/643/EWG
    und 92/255/EWG'
  type: main
- language: da
  script: Latn
  content: '93/693/EF: Kommissionens beslutning af 14. december 1993 om opstilling
    af en liste over tyrestationer i visse tredjelande, som er godkendt til udførsel
    af tyresæd til Fællesskabet, og om ophævelse af beslutning 91/642/EØF, 91/643/EØF
    og 92/255/EØF'
  type: main
- language: el
  script: Grek
  content: '93/693/ΕΚ: Απόφαση της Επιτροπής της 14ης Δεκεμβρίου
    1993 για την κατάρτιση καταλόγου των κέντρων
    συλλογής σπέρματος τρίτων χωρών τα οποία έχουν
    εγκριθεί για την εξαγωγή σπέρματος οικοσίτων
    βοοειδών στην Κοινότητα και για την ακύρωση
    των αποφάσεων της Επιτροπής 91/642/ΕΟΚ, 91/643/ΕΟΚ
    και 92/255/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '93/693/EY: Komission päätös, tehty 14 päivänä joulukuuta 1993, luettelosta
    keinosiemennysasemista, jotka on hyväksytty kolmansista maista yhteisöön tapahtuvaa
    naudansukuisten kotieläinten siemennesteen vientiä varten, ja päätösten 91/642/ETY,
    91/643/ETY ja 92/255/ETY kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '93/693/CE: Decisione della Commissione, del 14 dicembre 1993, recante
    l''elenco di centri di raccolta dello sperma riconosciuti idonei ad esportare
    nella Comunità sperma di animali domestici della specie bovina da paesi terzi
    e che abroga le decisioni 91/642/CEE, 91/643/CEE e 92/255/CEE della Commissione'
  type: main
- language: nl
  script: Latn
  content: '93/693/EG: Beschikking van de Commissie van 14 december 1993 tot vaststelling
    van een lijst van voor uitvoer van sperma van runderen (huisdieren) naar de Gemeenschap
    erkende spermacentra in derde landen en tot intrekking van de Beschikkingen 91/642/EEG,
    91/643/EEG en 92/255/EEG'
  type: main
- language: pt
  script: Latn
  content: '93/693/CE: Decisão da Comissão, de 14 de Dezembro de 1993, que estabelece
    uma lista de centros de colheita de sémen aprovados para a exportação para
    a Comunidade de sémen de animais domésticos da espécie bovina de países terceiros,
    e que revoga as Decisões 91/642/CEE, 91/643/CEE e 92/255/CEE'
  type: main
- language: es
  script: Latn
  content: '93/693/CE: Decisión de la Comisión, de 14 de diciembre de 1993, por
    la que se establece una lista de centros de recogida de esperma autorizados para
    exportar a la Comunidad esperma de animales domésticos de la especie bovina y
    por la que se derogan las Decisiones 91/642/CEE, 91/643/CEE y 92/255/CEE'
  type: main
- language: sv
  script: Latn
  content: '93/693/EG: Kommissionens beslut av den 14 december 1993 om upprättande
    av en förteckning över godkända tjurstationer vid export till gemenskapen av
    sperma från nötkreatur från tredje land och om upphävande av beslut 91/642/EEG,
    91/643/EEG och 92/255/EEG'
  type: main
