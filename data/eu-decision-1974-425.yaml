id: EUDecision1974425
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 August 1974 authorizing the French Republic not
    to apply Community treatment to clothing, of textiles other than cotton falling
    within heading Nos ex 60.05, ex 61.01, ex 61.02 B and ex 61.03 of the Common Customs
    Tariff, originating in South Korea and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: Décision 74/425/CEE de la Commission, du 5 août 1 974, autorisant la
    République française à exclure du traitement communautaire certains vêtements
    en matières textiles autres que le coton, des positions Ex 60.05, Ex 61.01, Ex
    61.02 et Ex 61.03 du Tarif douanier commun, originaires de Corée du Sud et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. August 1974, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung aus anderen Textilien als Baumwolle der
    Tarifnummern ex 60.05, ex 61.01, ex 61.02 B, ex 61.03 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. august 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage visse beklædningsgenstande
    af andre tekstilstoffer end bomuld, som henhører under position ex 60.05, ex
    61.01, ex 61.02 B og ex 61.03 i den fælles toldtarif, har oprindelse i Syd Korea
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 agosto 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario taluni indumenti e manufatti
    confezionati di materie tessili diverse dal cotone, delle voci n. ex 60.05, ex
    61.01, ex 61.02 B ed ex 61.03 della tariffa doganale comune, originari della Corea
    del Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 augustus 1974 waarbij de Franse Republiek
    wordt gemachtigd bepaalde kleding en geconfectioneerde artikelen van textielstoffen
    andere dan katoen van posten ex 60.05, ex 61.01, ex 61.02 B, ex 61.03 van het
    gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
