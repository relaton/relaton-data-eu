    izvrševanja, da se zagotovi pomoč za spodbujanje odprave posledic krize v okviru
    pandemije COVID-19 in njenih socialnih posledic ter za pripravo zelenega, digitalnega
    in odpornega okrevanja družbe in gospodarstva (REACT-EU)
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2020/2221 del Parlamento Europeo y del Consejo de 23 de
    diciembre de 2020 por el que se modifica el Reglamento (UE) n.o 1303/2013 en lo
    que respecta a los recursos adicionales y las disposiciones de ejecución a fin
    de prestar asistencia para favorecer la reparación de la crisis en el contexto
    de la pandemia de COVID-19 y sus consecuencias sociales y para preparar una recuperación
    verde, digital y resiliente de la economía (REACT UE)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2020/2221 av den 23 december
