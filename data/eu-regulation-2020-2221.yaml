    su papildomais ištekliais ir įgyvendinimo taisyklėmis, siekiant suteikti paramą
    COVID-19 pandemijos sukeltai krizei ir jos socialiniams padariniams įveikti skirtiems
    veiksmams skatinti ir pasirengti žaliajam, skaitmeniniam ir atspariam ekonomikos
