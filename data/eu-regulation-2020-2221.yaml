    okozta válság elhárításának előmozdítását és a zöld, digitális és
    reziliens gazdasági helyreállítás előkészítését támogató kiegészítő
    források és az azokkal kapcsolatos végrehajtási rendelkezések tekintetében
    történő módosításáról (REACT-EU)
  type: main
- language: it
  script: Latn
