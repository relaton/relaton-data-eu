- language: en
  script: Latn
  content: Regulation (EU) 2020/2221 of the European Parliament and of the Council
    of 23 December 2020 amending Regulation (EU) No 1303/2013 as regards additional
    resources and implementing arrangements to provide assistance for fostering crisis
    repair in the context of the COVID-19 pandemic and its social consequences and
    for preparing a green, digital and resilient recovery of the economy (REACT-EU)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/2221 du Parlement européen et du Conseil du 23 décembre
    2020 modifiant le règlement (UE) no 1303/2013 en ce qui concerne des ressources
    supplémentaires et des modalités d’application afin de fournir un soutien
    pour favoriser la réparation des dommages à la suite de la crise engendrée
    par la pandémie de COVID-19 et de ses conséquences sociales et pour préparer
    une reprise écologique, numérique et résiliente de l’économie (REACT-EU)
  type: main
- language: de
  script: Latn
