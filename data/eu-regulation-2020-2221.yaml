    addizzjonali u arranġamenti ta’ implimentazzjoni biex jipprovdi assistenza
    għat-trawwim ta’ miżuri li jsewwu d-dannu kkawżat mill-kriżi fil-kuntest
    tal-pandemija tal-COVID-19 u l-konsegwenzi soċjali tagħha u għat-tħejjija
    ta’ rkupru ekoloġiku, diġitali u reżiljenti tal-ekonomija (REACT-EU)
  type: main
