    mehanizama radi pružanja pomoći u sanaciji krize u kontekstu pandemije bolesti
    COVID-19 i njezinih socijalnih posljedica te u pripremi zelenog, digitalnog i
    otpornog oporavka gospodarstva (REACT-EU)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2020/2221 rendelete (2020. december
