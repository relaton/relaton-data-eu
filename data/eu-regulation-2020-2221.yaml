    społecznych oraz przygotowanie do ekologicznej i cyfrowej odbudowy gospodarki
    zwiększającej jej odporność (REACT-EU)
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2020/2221 do Parlamento Europeu e do Conselho de 23 de
    dezembro de 2020 que altera o Regulamento (UE) n.o 1303/2013 no que respeita aos
    recursos adicionais e às disposições de execução a fim de prestar assistência
    à promoção da recuperação da crise no contexto da pandemia de COVID-19 e
    respetivas consequências sociais e à preparação de uma recuperação ecológica,
    digital e resiliente da economia (REACT-EU)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2020/2221 al Parlamentului European și al Consiliului
    din 23 decembrie 2020 de modificare a Regulamentului (UE) nr. 1303/2013 în ceea
    ce privește resursele suplimentare și măsurile de implementare cu scopul de
    a oferi asistență pentru sprijinirea ameliorării efectelor provocate de criză
    în contextul pandemiei de COVID-19 și al consecințelor sale sociale și pentru
    pregătirea unei redresări verzi, digitale și reziliente a economiei (REACT-EU)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2020/2221 z 23. decembra
    2020, ktorým sa mení nariadenie (EÚ) č. 1303/2013, pokiaľ ide o dodatočné
    zdroje a vykonávacie opatrenia na poskytovanie pomoci na podporu obnovy po kríze
    spojenej s pandémiou COVID-19 vrátane jej sociálnych dôsledkov a na prípravu
    zeleného, digitálneho a odolného oživenia hospodárstva (REACT-EU)
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2020/2221 Evropskega parlamenta in Sveta z dne 23. decembra
