    dicembre 2020 che modifica il regolamento (UE) n. 1303/2013 per quanto riguarda
    le risorse aggiuntive e le modalità di attuazione per fornire assistenza allo
    scopo di promuovere il superamento degli effetti della crisi nel contesto della
    pandemia di COVID-19 e delle sue conseguenze sociali e preparare una ripresa verde,
    digitale e resiliente dell’economia (REACT-EU)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2020/2221 (2020. gada 23. decembris),
    ar ko Regulu (ES) Nr. 1303/2013 groza attiecībā uz papildu resursiem un īstenošanas
    kārtību, lai palīdzētu veicināt ar Covid-19 pandēmiju un tās sociālajām
    sekām saistītās krīzes seku pārvarēšanu un sagatavoties zaļai, digitālai
    un noturīgai ekonomikas atveseļošanai (REACT-EU)
  type: main
