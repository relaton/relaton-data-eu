title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3398/82 of 17 December 1982 extending the
    Community surveillance of imports of certain live plants and floricultural products
    originating in various countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3398/82 de la Commission, du 17 décembre 1982, prorogeant
    la surveillance communautaire des importations de certaines plantes vivantes et
    de certains produits de la floriculture, originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3398/82 der Kommission vom 17. Dezember 1982 zur Verlängerung
    der gemeinschaftlichen Überwachung der Einfuhren von bestimmten lebenden Pflanzen
    und Waren des BLumenhandels mit Ursprung in bestimmten Ländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3398/82 af 17. december 1982 om forlængelse
    af fællesskabstilsynet med indførsel af visse levende planter m.m. og visse
    afskårne blomster og blade med oprindelse i bestemte lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3398/82 τής Επιτροπής
    τής 17ης Δεκεμβρίου 1982 περί παρατάσεως τής κοινοτικής
    εποπτείας τών εισαγωγών ορισμένων ζώντων φυτών
    καί ορισμένων προϊόντων ανθοκομίας καταγωγής
    ορισμένων τρίτων χωρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3398/82 della Commissione, del 17 dicembre 1982, che
    proroga il controllo comunitario delle importazioni di talune piante vive e di
    taluni prodotti della floricoltura, originari di diversi paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3398/82 van de Commissie van 17 december 1982 houdende
    verlenging van de geldigheidsduur van het communautair toezicht op de invoer van
    sommige levende planten en van sommige produkten van de bloementeelt, van oorsprong
    uit verschillende landen
  type: main
