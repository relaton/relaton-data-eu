    εισφορές κατά την εξαγωγή και ορισμένα πιστοποιητικά
    εξαγωγής στον τομέα των σιτηρών και της ορύζης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3049/89 DELLA COMMISSIONE del 10 ottobre 1989 che
    modifica il regolamento (CEE) n. 1124/77 recante nuova delimitazione delle zone
    di destinazione per le restituzioni o i prelievi all'' esportazione e per determinati
    titoli d'' esportazione nei settori dei cereali e del riso #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3049/89 VAN DE COMMISSIE van 10 oktober 1989 tot
