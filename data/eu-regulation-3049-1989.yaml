    para as restituiçoes ou os direitos niveladores à exportaçao e para certos
    certificados de exportaçao nos sectores dos cereais e do arroz
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3049/89 DE LA COMISIÓN de 10 de octubre de 1989 por
