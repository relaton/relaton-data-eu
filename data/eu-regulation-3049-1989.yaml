    Erstattungen oder Abschöpfungen bei der Ausfuhr und für bestimmte Ausfuhrlizenzen
    für Getreide und Reis #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3049/89 af 10. oktober 1989 om ændring
