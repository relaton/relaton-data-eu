  content: Commission Regulation (EEC) No 3049/89 of 10 October 1989 amending Regulation
    (EEC) No 1124/77 redefining the destination zones for export refunds or levies
    and for certain export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3049/89 de la Commission du 10 octobre 1989 modifiant
    le règlement (CEE) n° 1124/77 portant délimitation des zones de destination
    pour les restitutions ou les prélèvements à l'exportation et certains certificats
    d'exportation dans les secteurs des céréales et du riz
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3049/89 DER KOMMISSION vom 10. Oktober 1989 zur Änderung
