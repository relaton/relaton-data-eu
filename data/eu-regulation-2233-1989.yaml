    produkter henhørende under KN-kode 2939 21 10, 2939 21 10 og 2939 29 00 og med
    oprindelse i Indonesien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
