    τελωνειακών δασμών για αλκαλοειδή της κίνας
    και τα παράγωγά τους και για τα άλατα των προϊόντων
    αυτών, των κωδικών ΣΟ 2939 21 10, 2939 21 90 και 2939 29 00,
    καταγωγής Ινδονησίας, δικαιούχου των προβλεπόμενων
