title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2233/89 of 25 July 1989 re-establishing
    the levying of customs duties on alkaloids of cinchona, their derivatives and
    salts thereof, falling within CN codes 2939 21 10, 21 90 and 29 00 originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2233/89 de la Commission du 25 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux alcaloïdes
    du quinquina, leurs dérivés et sels de ces produits des codes NC 2939 21 10,
    2939 21 90 et 2939 29 00, originaires de l'Indonésie bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2233/89 DER KOMMISSION vom 25. Juli 1989 zur Wiedereinführung
    der Erhebung der Zölle für Chinaalkaloide, ihre Derivate und Salze dieser Erzeugnisse
    der KN-Code 2939 21 10, 2939 21 90 und 2939 29 00 mit Ursprung in Indonesien,
    dem die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2233/89 af 25. juli 1989 om genindførelse
