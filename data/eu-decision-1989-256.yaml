title:
- language: en
  script: Latn
  content: '89/256/EEC: Commission Decision of 5 April 1989 amending Decision 85/634/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of oak wood originating in Canada or
    the United States of America (Only the German, Danish, Spanish, French, Italian
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/256/CEE: Décision de la Commission du 5 avril 1989 modifiant la décision
    85/634/CEE autorisant certains Etats membres à prévoir des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour le bois de chêne originaire
    du Canada ou des Etats-Unis d''Amérique (Les textes en langues allemande, danoise,
    espagnole, française, italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/256/EWG: Entscheidung der Kommission vom 5. April 1989 zur Aenderung
    der Entscheidung 85/634/EWG zur Ermaechtigung bestimmter Mitgliedstaaten, für
    Eichenholz mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika Ausnahmen
    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur
    der deutsche, dänische, spanische, französische, italienische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/256/EØF: Kommissionens beslutning af 5. april 1989 om ændring af
    beslutning 85/634/EØF om bemyndigelse af visse medlemsstater til at undtage egetrae
    med oprindelse i Canada eller USA for visse bestemmelser i Rådets direktiv 77/93/EØF
    (Kun den tyske, danske, spanske, franske, italienske og nederlandske udgave er
    autentiske)'
  type: main
- language: el
  script: Grek
  content: '89/256/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Απριλίου
    1989 που τροποποιεί την απόφαση 85/634/ΕΟΚ για την
    παροχή άδειας σε ορισμένα κράτη μέλη να παρεκκλίνουν
    από τις διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου,
    όσον αφορά το ξύλο βελανιδιάς καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών της Αμερικής (Τα κείμενα
    στην γερμανική, δανική, ισπανική, γαλλική, ιταλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '89/256/CEE: Decisione della Commissione del 5 aprile 1989 che modifica
    la decisione 85/634/CEE che autorizza taluni Stati membri a prevedere deroghe
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda il legname di quercia originario del Canada o degli Stati Uniti d''America
    (Il testi in lingua tedesca, danese, spagnola, francese, italiana e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '89/256/EEG: Beschikking van de Commissie van 5 april 1989 tot wijziging
    van Beschikking 85/634/EEG houdende machtiging van bepaalde Lid-Staten om voor
    eikehout van oorsprong uit Canada of de Verenigde Staten van Amerika afwijking
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Duitse, Deense, Spaanse, Franse, Italiaanse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '89/256/CEE: Decisão da Comissão de 5 de Abril de 1989 que altera a Decisao
    85/634/CEE, que autoriza determinados Estados-membros a prever derrogaçoes de
    determinadas disposiçoes da Directiva 77/93/CEE do Conselho, no que diz respeito
    à madeira de carvalho originaria do Canada ou dos Estados Unidos da América
    (Apenas fazem fé os textos nas línguas alemã, dinamarquesa, espanhola, francesa,
    italiana e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '89/256/CEE: Decisión de la Comisión de 5 de abril de 1989 por la que
    se modifica la Decision 85/634/CEE por la que se autoriza a algunos Estados miembros
    a establecer supuestos de inaplicacion de determinadas disposiciones de la Directiva
    77/93/CEE del Consejo respecto de la madera de roble originaria de Canada o de
    los Estados Unidos de América (Los textos en lenguas alemana, danesa, española,
    francesa, italiana y neerlandesa son los únicos auténticos)'
  type: main
