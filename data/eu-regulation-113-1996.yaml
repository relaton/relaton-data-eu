  content: COMMISSION REGULATION (EC) No 113/96 of 24 January 1996 determining the
    extent to which applications lodged in January 1996 for import licences for certain
    egg sector products pursuant to Regulation (EC) No 1474/95 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 113/96 DE LA COMMISSION du 24 janvier 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1996 pour certains produits du secteur des oeufs dans le cadre du règlement
    (CE) n° 1474/95 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 113/96 DER KOMMISSION vom 24. Januar 1996 über die
    Festsetzung des Umfangs, in dem die im Januar 1996 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier entsprechend der Verordnung (EG) Nr.
    1474/95 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 113/96 af 24. januar 1996 om fastsættelse
    af i hvilket omfang der kan accepteres ansøgninger, dre blev indgivet i januar
    1996 om importlicenser for visse ægprodukter i forbindelse med forordning (EF)
    nr. 1474/95
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 113/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
