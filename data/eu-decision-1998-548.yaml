title:
- language: en
  script: Latn
  content: '98/548/EC: Commission Decision of 22 July 1998 amending for the third
    time Decision 93/42/EEC, concerning additional guarantees relating to infectious
    bovine rhinotracheitis for bovines destined for Member States or Regions of Member
    States free from the disease, in relation to Austria and amending for the second
    time Decision 95/109/EC (notified under document number C(1998) 2184)'
  type: main
- language: fr
  script: Latn
  content: '98/548/CE: Décision de la Commission du 22 juillet 1998 portant troisième
    modification de la décision 93/42/CEE relative à des garanties supplémentaires
    concernant la rhinotrachéite infectieuse bovine pour les bovins destinés aux
    États membres ou à des régions d''États membres indemnes de la maladie, en
    relation avec l''Autriche, et portant deuxième modification de la décision 95/109/CE
    [notifiée sous le numéro C(1998) 2184]'
  type: main
- language: de
  script: Latn
  content: '98/548/EG: Entscheidung der Kommission vom 22. Juli 1998 zur dritten Änderung
    der Entscheidung 93/42/EWG über zusätzliche Garantien hinsichtlich der infektiösen
    Rhinotracheitis bei Rindern, die für seuchenfreie Mitgliedstaaten oder Regionen
    der Mitgliedstaaten bestimmt sind, in bezug auf Österreich, sowie zur zweiten
    Änderung der Entscheidung 95/109/EG (Bekanntgegeben unter Aktenzeichen K(1998)
    2184)'
  type: main
- language: da
  script: Latn
  content: '98/548/EF: Kommissionens beslutning af 22. juli 1998 om tredje ændring
    af beslutning 93/42/EØF om supplerende garantier vedrørende IBR for kvæg bestemt
    til medlemsstater eller regioner i medlemsstater, der er fri for sygdommen, så
    den kommer til at gælde for Østrig, og om anden ændring af beslutning 95/109/EF
    (meddelt under nummer K(1998) 2184)'
  type: main
- language: el
  script: Grek
  content: '98/548/ΕΚ: Απόφαση της Επιτροπής της 22ας Ιουλίου
    1998 για τροποποίηση για τρίτη φορά της απόφασης
    93/42/ΕΟΚ για συμπληρωματικές εγγυήσεις σχετικά
    με τη μολυσματική ρινοτραχειίτιδα των βοοειδών
    για τα βοοειδή που προορίζονται για κράτη μέλη
    ή περιφέρειες των κρατών μελών απαλλαγμένες
    από τη νόσο, όσον αφορά την Αυστρία και για
    τροποποίηση για δεύτερη φορά της απόφασης
    95/109/ΕΚ [κοινοποιηθείσα υπό τον αριθμό Ε(1998)
    2184]'
  type: main
- language: fi
  script: Latn
  content: '98/548/EY: Komission päätös, tehty 22 päivänä heinäkuuta 1998,
    jäsenvaltioihin tai jäsenvaltioiden taudeista vapaille alueille tarkoitettujen
    nautojen tarttuvaa rinotrakeiittia koskevista lisätakeista tehdyn komission päätöksen
    93/42/ETY muuttamisesta kolmannen kerran Itävallan osalta ja päätöksen 95/109/EY
    muuttamisesta toisen kerran (tiedoksiannettu numerolla K(1998) 2184)'
  type: main
- language: it
  script: Latn
  content: '98/548/CE: Decisione della Commissione del 22 luglio 1998 recante terza
    modifica della decisione 93/42/CEE relativa a garanzie supplementari per quanto
    riguarda la rinotracheite bovina infettiva per i bovini destinati a Stati membri
    o a regioni di Stati membri indenni dalla malattia, con riferimento all''Austria,
    e seconda modifica della decisione 95/109/CE [notificata con il numero C(1998)
    2184]'
  type: main
- language: nl
  script: Latn
  content: '98/548/EG: Beschikking van de Commissie van 22 juli 1998 houdende derde
    wijziging van Beschikking 93/42/EEG betreffende aanvullende garanties ten aanzien
    van infectieuze boviene rhinotracheïtis (IBR) voor runderen die bestemd zijn
    voor lidstaten of gebieden daarvan die vrij zijn van deze ziekte, ten aanzien
    van Oostenrijk, en houdende tweede wijziging van Beschikking 95/109/EG (kennisgeving
    geschied onder nummer C(1998) 2184)'
  type: main
- language: pt
  script: Latn
  content: '98/548/CE: Decisão da Comissão de 22 de Julho de 1998 que altera pela
    terceira vez a Decisão 93/42/CEE relativa a garantias suplementares para os bovinos
    destinados aos Estados-membros ou regiões de Estados-membros indemnes da doença,
    no respeitante à rinotraqueíte infecciosa dos bovinos, em relação à Áustria,
    e pela segunda vez a Decisão 95/109/CE [notificada com o número C(1998) 2184]'
  type: main
- language: es
  script: Latn
  content: '98/548/CE: Decisión de la Comisión de 22 de julio de 1998 por la que
    se modifica por tercera vez la Decisión 93/42/CEE, relativa a garantías suplementarias
    en relación con la rinotraqueítis infecciosa bovina para los bovinos destinados
    a Estados miembros o regiones de Estados miembros indemnes de la enfermedad, en
    relación con Austria, y se modifica por segunda vez la Decisión 95/109/CE [notificada
    con el número C(1998) 2184]'
  type: main
- language: sv
  script: Latn
  content: '98/548/EG: Kommissionens beslut av den 22 juli 1998 om ändring för tredje
    gången av beslut 93/42/EEG om tilläggsgarantier avseende smittsam bovin rinotrakeit
    för nötkreatur som skall skickas till medlemsstater eller till områden i medlemsstater
    som är fria från sjukdomen så att beslutet omfattar Österrike och om ändring
    för andra gången av beslut 95/109/EG [delgivet med nr K(1998) 2184]'
