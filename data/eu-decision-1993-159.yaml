title:
- language: en
  script: Latn
  content: '93/159/EEC: Commission Decision of 16 February 1993 authorizing Germany
    and the United Kingdom to provide for exceptions from certain provisions of Council
    Directive 77/93/EEC in respect of potatoes for human consumption originating in
    South Africa (Only the German and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/159/CEE: Décision de la Commission, du 16 février 1993, autorisant
    l''Allemagne et le Royaume-Uni à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour ce qui concerne les pommes de terre
    destinées à la consommation humaine originaires d''Afrique du Sud (Les textes
    en langues allemande et anglaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/159/EWG: Entscheidung der Kommission vom 16. Februar 1993 zur Ermächtigung
    Deutschlands und des Vereinigten Königreichs, für Speisekartoffeln mit Ursprung
    in Südafrika Ausnahmen von einigen Vorschriften der Richtlinie 77/93/EWG zuzulassen
    (Nur der deutsche und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/159/EØF: Kommissionens beslutning af 16. februar 1993 om bemyndigelse
    af Tyskland og Det Forenede Kongerige til at fastsætte undtagelser fra visse
    bestemmelser i Rådets direktiv 77/93/EØF for så vidt angår spisekartofler
    med oprindelse i Sydafrika (Kun den tyske og engelske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 16ης Φεβρουαρίου
    1993 που εξουσιοδοτεί τη Γερμανία και το Ηνωμένο
    Βασίλειο να προβλέψουν εξαιρέσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά τα γεώμηλα που προορίζονται για
    ανθρώπινη κατανάλωση, καταγωγής Νοτίου Αφρικής
    (Τα κείμενα στην γερμανική και αγγλική γλώσσα
    είναι τα μόνα αυθεντικά)
  type: main
- language: it
  script: Latn
  content: '93/159/CEE: Decisione della Commissione, del 16 febbraio 1993, che autorizza
    la Germania e il Regno Unito a prevedere deroghe a talune disposizioni della direttiva
    77/93/CEE del Consiglio per le patate destinate al consumo umano originarie del
    Sudafrica (Il testi in lingua tedesca e inglese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '93/159/EEG: Beschikking van de Commissie van 16 februari 1993 tot machtiging
    van Duitsland en het Verenigd Koninkrijk om uitzonderingen toe te staan op een
    aantal bepalingen van Richtlijn 77/93/EEG van de Raad inzake consumptieaardappelen
    van oorsprong uit Zuid-Afrika (Slechts de teksten in de Duitse en de Engelse taal
    zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/159/CEE: Decisão da Comissão, de 16 de Fevereiro de 1993, que autoriza
    a Alemanha e o Reino Unido a prever derrogações de certas disposições da Directiva
    77/93/CEE do Conselho relativamente às batatas para consumo humano originárias
    da África do Sul (Apenas fazem fé os textos nas línguas alemã e inglesa)'
  type: main
- language: es
  script: Latn
  content: '93/159/CEE: Decisión de la Comisión, de 16 de febrero de 1993, por la
    que se autoriza a Alemania y al Reino Unido para establecer excepciones a determinadas
    disposiciones de la Directiva 77/93/CEE del Consejo en relación con las patatas
    para consumo humano originarias de Suráfrica (Los textos en lenguas alemana y
    inglesa son los únicos auténticos)'
