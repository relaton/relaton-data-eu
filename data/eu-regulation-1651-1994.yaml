    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen määrän vahvistamisperusteista annetun
    asetuksen (EY) N:o 1222/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1651/94 della Commissione, del 7 luglio 1994, che modifica
    il regolamento (CE) n. 1222/94 che stabilisce, per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell'allegato II del trattato, le modalità
    comuni di applicazione relative alla concessione delle restituzioni all'esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1651/94 van de Commissie van 7 juli 1994 tot wijziging
