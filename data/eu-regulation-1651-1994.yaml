title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1651/94 of 7 July 1994 amending Regulation
    (EC) No 1222/94 laying down common implementing rules for the system of granting
    export refunds on certain agricultural products exported in the form of goods
    not listed in Annex II to the Treaty, and the criteria for fixing the amount of
    such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1651/94 de la Commission, du 7 juillet 1994, modifiant
    le règlement (CE) n° 1222/94, établissant, pour certains produits agricoles
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité,
    les modalités communes d'application du régime d'octroi des restitutions à
    l'exportation et des critères de fixation de leurs montants
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1651/94 der Kommission vom 7. Juli 1994 zur Änderung
