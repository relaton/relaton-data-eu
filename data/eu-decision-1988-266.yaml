title:
- language: en
  script: Latn
  content: '88/266/EEC: Commission Decision of 13 April 1988 making a second allocation
    to Denmark of resources to be charged to the 1988 budget year for the supply of
    food from intervention stocks to designated organizations for distribution to
    the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/266/CEE: Décision de la Commission du 13 avril 1988 allouant au Danemark
    une deuxième tranche des crédits imputables à l'' exercice 1988 pour la fourniture
    des denrées alimentaires provenant des stocks d'' intervention à des organisations
    désignées pour les distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/266/EWG: Entscheidung der Kommission vom 13. April 1988 über die Bewilligung
    einer zweiten Tranche von Mitteln, die im Haushaltsjahr 1988 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an stark benachteiligte Personen in der Gemeinschaft zu verbuchen
    sind, für Dänemark'
  type: main
- language: da
  script: Latn
  content: '88/266/EØF: Kommissionens beslutning af 13. april 1988 om en anden tildeling
    til Danmark af midler, der skal opføres på 1988-budgettet for levering af levnedsmidler
    fra interventionslagre til nærmere bestemte organisationer med henblik på uddeling
    til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/266/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
    Απριλίου 1988 που χορηγεί στη Δανία δεύτερη μερίδα
    πιστώσεων που καταλογίζονται στο οικονομικό
    έτος 1988 για τη χορήγηση τροφίμων που προέρχονται
    από τα αποθέματα της παρεμβάσεως στους οργανισμούς
    που ορίζονται για τη διανομή τους στους απόρους
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/266/CEE: Decisione della Commissione del 13 aprile 1988 relativa ad
