---
id: EURegulation12702012
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1270/2012 of 21 December 2012
    derogating from Council Regulation (EC) No 73/2009 as regards the deadline for
    reviewing the decision on specific support for 2012 in Portugal, from Regulation
    (EC) No 1120/2009 as regards the deadline for notification of such a review and
    as regards the conditions applicable to specific agricultural activities entailing
    additional agri-environment benefits and from Regulation (EC) No 1122/2009 as
    regards the information contained in the aid application
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1270/2012 de la Commission du 21 décembre
    2012 portant dérogation au règlement (CE) n ° 73/2009 en ce qui concerne le
    délai de révision de la décision relative au soutien spécifique pour 2012
    au Portugal, au règlement (CE) n ° 1120/2009 en ce qui concerne le délai prévu
    pour la notification d’une telle révision et en ce qui concerne les conditions
    applicables à certaines activités agricoles spécifiques comportant des avantages
    agroenvironnementaux supplémentaires et au règlement (CE) n ° 1122/2009 en
    ce qui concerne les informations figurant dans la demande d’aide
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1270/2012 der Kommission vom 21. Dezember
    2012 zur Abweichung von der Verordnung (EG) Nr. 73/2009 des Rates hinsichtlich
    der Frist für die Überprüfung des Beschlusses über die besondere Stützung
    für 2012 in Portugal, von der Verordnung (EG) Nr. 1120/2009 hinsichtlich der
    Frist für die Mitteilung einer solchen Überprüfung und der für spezifische
    landwirtschaftliche Tätigkeiten mit zusätzlichem Nutzen für die Agrarumwelt
    geltenden Bedingungen und von der Verordnung (EG) Nr. 1122/2009 hinsichtlich der
    im Beihilfeantrag enthaltenen Informationen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1270/2012 на
    Комисията от 21 декември 2012 година за дерогация
    от Регламент (ЕО) № 73/2009 по отношение на крайния
    срок за преразглеждане на решението относно
    специфичното подпомагане за 2012 г. в Португалия,
    от Регламент (ЕО) № 1120/2009 по отношение на срока
    за уведомяване на подобно преразглеждане и
    по отношение на условията, приложими за специфични
    селскостопански дейности, водещи до допълнителни
    ползи за селското стопанство и за околната
    среда, както и от Регламент (ЕО) № 1122/2009 по отношение
    на информацията, съдържаща се в заявлението
    за помощ
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1270/2012 ze dne 21. prosince
    2012 , kterým se stanoví odchylka od nařízení Rady (ES) č. 73/2009, pokud
    jde o lhůtu pro přezkum rozhodnutí o zvláštní podpoře pro rok 2012 v Portugalsku,
    od nařízení (ES) č. 1120/2009, pokud jde o lhůtu pro oznámení tohoto přezkumu
    a o podmínky pro zvláštní zemědělské činnosti, z nichž vyplývají dodatečné
    agroenvironmentální výhody, a od nařízení (ES) č. 1122/2009, pokud jde
    o informace obsažené v žádosti o podporu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1270/2012 af 21. december
    2012 om fravigelse af Rådets forordning (EF) nr. 73/2009 hvad angår fristen
    for ændring af beslutningen om særlig støtte for 2012 i Portugal, af forordning
    (EF) nr. 1120/2009 hvad angår fristen for meddelelse af en sådan ændring og
    betingelserne for særlige landbrugsaktiviteter, der resulterer i yderligere miljøfordele
    på landbrugsområdet, og fra forordning (EF) nr. 1122/2009 hvad angår de oplysninger,
    som støtteansøgningen skal indeholde
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 1270/2012
    της Επιτροπής, της 21ης Δεκεμβρίου 2012 , σχετικά
    με παρέκκλιση από τον κανονισμό (ΕΚ) αριθ. 73/2009
