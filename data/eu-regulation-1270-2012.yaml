    οι οποίες συνεπάγονται πρόσθετα γεωργοπεριβαλλοντικά
    οφέλη και από τον κανονισμό (ΕΚ) αριθ. 1122/2009
    όσον αφορά τις πληροφορίες που περιλαμβάνονται
    στην αίτηση ενίσχυσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 1270/2012, 21. detsember 2012 , millega
    kehtestatakse erand määrusest (EÜ) nr 73/2009 seoses Portugali 2012. aasta
    eritoetuste otsuse läbivaatamise tähtajaga, määrusest (EÜ) nr 1120/2009 seoses
    sellisest läbivaatamisest teavitamise tähtajaga ja seoses tingimustega, mida
    kohaldatakse teatava põllumajandusliku tegevuse suhtes, millega kaasnevad täiendavad
    põllumajanduse keskkonnahüved, ning määrusest (EÜ) nr 1122/2009 seoses toetusetaotluses
    sisalduva teabega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 1270/2012, annettu 21 päivänä
    joulukuuta 2012 , neuvoston asetuksesta (EY) N:o 73/2009 poikkeamisesta vuoden
    2012 erityistuen uudelleentarkastelua koskevan päätöksen määräajan osalta
    Portugalissa, asetuksesta (EY) N:o 1120/2009 poikkeamisesta uudelleentarkastelua
    koskevan ilmoituksen määräajan sekä erityisiä maatalousalan toimia, joista
    seuraa lisähyötyä maatalousympäristölle, koskevien edellytysten osalta, sekä
    asetuksesta (EY) N:o 1120/2009 poikkeamisesta tukihakemukseen sisältyvien tietojen
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1270/2012/EU végrehajtási rendelete ( 2012. december 21.
    ) a 73/2009/EK tanácsi rendelettől a Portugália számára a 2012. évre nyújtott
    különleges támogatásról szóló határozat felülvizsgálatára vonatkozó
    határidő tekintetében való eltérésről, az 1120/2009/EK rendelettől az
    ilyen felülvizsgálatról szóló tájékoztatásra vonatkozó határidő és
    a további agrár-környezetvédelmi haszonnal járó konkrét mezőgazdasági
    tevékenységekre alkalmazandó feltételek tekintetében való eltérésről,
    valamint az 1122/2009/EK rendelettől a támogatási kérelemben szereplő információk
    tekintetében való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1270/2012 della Commissione, del 21 dicembre
    2012 , recante deroga al regolamento (CE) n. 73/2009 del Consiglio con riguardo
    al termine per la revisione della decisione sul sostegno specifico al Portogallo
    per il 2012, al regolamento (CE) n. 1120/2009 con riguardo al termine per la notifica
    di tale revisione e alle condizioni applicabili ad attività agricole specifiche
    che comportano vantaggi agroambientali aggiuntivi e al regolamento (CE) n. 1122/2009
    con riguardo alle informazioni contenute nella domanda di aiuto
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1270/2012 ( 2012. gada 21. decembris
    ), ar ko atkāpjas no Padomes Regulas (EK) Nr. 73/2009 attiecībā uz termiņu,
    līdz kuram var pārskatīt lēmumu par īpašo atbalstu Portugālei 2012. gadā,
    no Regulas (EK) Nr. 1120/2009 attiecībā uz termiņu, līdz kuram jāsniedz paziņojums
    par šādu pārskatīšanu, un attiecībā uz nosacījumiem, ko piemēro konkrētām
    lauksaimnieciskām darbībām, kuru rezultātā agrovidei rodas papildu ieguvums,
    un no Regulas (EK) Nr. 1122/2009 attiecībā uz atbalsta pieteikumā iekļauto
    informāciju
  type: main
- language: lt
  script: Latn
  content: 2012 m. gruodžio 21 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1270/2012,
    kuriuo nukrypstama nuo Tarybos reglamente (EB) Nr. 73/2009 nustatyto termino peržiūrėti
    sprendimą dėl specialiosios paramos Portugalijoje 2012 m., nuo Reglamente (EB)
    Nr. 1120/2009 nustatyto termino pranešti apie tokią peržiūrą ir sąlygų,
    taikomų konkrečiai žemės ūkio veiklai, susijusiai su papildoma nauda žemės
    ūkiui ir aplinkai, ir nuo Reglamente (EB) Nr. 1122/2009 nustatytos informacijos,
    pateikiamos gauti pagalbą
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1270/2012 tal-
    21 ta’ Diċembru 2012 li jidderoga mir-Regolament tal-Kunsill (KE) Nru 73/2009
    fir-rigward tal-iskadenza għar-reviżjoni tad-deċiżjoni dwar l-appoġġ speċifiku
    għall-2012 fil-Portugall, mir-Regolament (KE) Nru 1120/2009 rigward id-data ta’għeluq
    għan-notifika ta’ tali reviżjoni, u fir-rigward tal-kondizzjonijiet applikabbli
    għal attivitajiet agrikoli speċifiċi li jinvolvu benefiċċji agriambjentali
    addizzjonali, u mir-Regolament (KE) Nru 1122/2009 fir-rigward tal-informazzjoni
    li jkun hemm fl-applikazzjoni għall-għajnuna
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1270/2012 van de Commissie van 21 december
    2012 tot afwijking van Verordening (EG) nr. 73/2009 van de Raad wat betreft de
    uiterste datum voor de herziening van het besluit inzake specifieke steun voor
    2012 in Portugal, tot afwijking van Verordening (EG) nr. 1120/2009 wat betreft
    de uiterste datum voor de kennisgeving van een dergelijke herziening en wat betreft
    de voorwaarden voor specifieke landbouwactiviteiten die meerwaarde voor het landbouwmilieu
    opleveren, en tot afwijking van Verordening (EG) nr. 1122/2009 wat betreft de
    in de steunaanvraag vermelde informatie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1270/2012 z dnia 21 grudnia
    2012 r. wprowadzające odstępstwo od rozporządzenia Rady (WE) nr 73/2009 w odniesieniu
    do terminów przeglądu decyzji w sprawie specjalnego wsparcia na rok 2012 w Portugalii,
    od rozporządzenia (WE) nr 1120/2009 w odniesieniu do terminu zgłaszania takiego
    przeglądu oraz w odniesieniu do warunków stosowanych do określonych rodzajów
    działalności rolniczej wiążących się z dodatkowymi korzyściami rolno-środowiskowymi
    oraz od rozporządzenia (WE) nr 1122/2009 w odniesieniu do informacji zawartych
    we wniosku o przyznanie pomocy
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1270/2012 da Comissão, de 21 de dezembro
    de 2012 , que estabelece uma derrogação do Regulamento (CE) n. ° 73/2009 no
    respeitante ao prazo de revisão da decisão sobre o apoio específico para 2012
    em Portugal, do Regulamento (CE) n. ° 1120/2009 no respeitante ao prazo para
    a notificação dessa revisão e às condições aplicáveis a atividades agrícolas
    específicas que resultem em benefícios agroambientais adicionais e do Regulamento
    (CE) n. ° 1122/2009 no respeitante às informações contidas no pedido de ajuda
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1270/2012 al Comisiei din
    21 decembrie 2012 de derogare de la Regulamentul (CE) nr. 73/2009 al Consiliului
    în ceea ce privește termenul de revizuire a deciziei privind ajutorul specific
    pentru 2012 în Portugalia, de la Regulamentul (CE) nr. 1120/2009 în ceea ce
    privește data limită de notificare a unei astfel de revizuiri și în ceea ce
    privește condițiile aplicabile activităților agricole specifice, care conduc
    la beneficii suplimentare de agromediu, și de la Regulamentul (CE) nr. 1122/2009
    în ceea ce privește informațiile conținute în cererea de ajutor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1270/2012 z 21. decembra 2012
    , ktorým sa ustanovuje výnimka z nariadenia Rady (ES) č. 73/2009, pokiaľ ide
    o termín revízie rozhodnutia o osobitnej podpore na rok 2012 v Portugalsku,
    od nariadenia (ES) č. 1120/2009, pokiaľ ide o termín oznámenia takejto revízie
    a pokiaľ ide o podmienky uplatniteľné na osobitné poľnohospodárske činnosti,
    z ktorých vyplýva ďalší agroenvironmentálny prínos, a od nariadenia (ES)
    č. 1122/2009, pokiaľ ide o informácie zahrnuté do žiadosti o pomoc
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1270/2012 z dne 21. decembra 2012 o
    odstopanju od Uredbe Sveta (ES) št. 73/2009 glede roka za revizijo odločitve
    o posebni podpori za leto 2012 na Portugalskem, od Uredbe (ES) št. 1120/2009
    glede roka za obveščanje o takšni reviziji in glede pogojev, ki veljajo za
    posebne kmetijske dejavnosti, ki prinašajo dodatne koristi za kmetijstvo in okolje,
    ter od Uredbe (ES) št. 1122/2009 glede informacij, vsebovanih v zahtevkih za
    pomoč
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1270/2012 de la Comisión, de 21 de
    diciembre de 2012 , por el que se establecen excepciones al Reglamento (CE) n
    ° 73/2009 del Consejo, en lo que atañe al plazo para revisar la decisión sobre
    el apoyo específico para 2012 en Portugal, al Reglamento (CE) n ° 1120/2009,
    en lo que atañe al plazo para la notificación de dicha revisión y a las condiciones
    aplicables a actividades agrícolas específicas que reportan mayores beneficios
    agroambientales, y al Reglamento (CE) n ° 1122/2009, en lo que atañe a la información
    que figura en la solicitud de ayuda
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1270/2012 av den 21 december
    2012 om undantag från rådets förordning (EG) nr 73/2009 vad gäller tidsfristen
    för översyn av beslutet om särskilt stöd för 2012 i Portugal, från förordning
    (EG) nr 1120/2009 vad gäller tidsfristen för anmälan av en sådan översyn
    och vad gäller villkoren för särskild verksamhet inom jordbruket som medför
    tilläggsfördelar för ett miljövänligt jordbruk och från förordning (EG)
    nr 1122/2009 vad gäller informationen i stödansökan
