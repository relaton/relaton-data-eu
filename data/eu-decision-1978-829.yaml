title:
- language: en
  script: Latn
  content: '78/829/EEC: Commission Decision of 22 September 1978 authorizing the French
    Republic not to apply Community treatment to woven suits (including coordinate
    suits consisting of two or three pieces, which are ordered, packed, consigned
    and normally sold together), of wool, of cotton or of man-made textile fibres,
    falling within heading No ex 61.01 of the Common Customs Tariff (NIMEXE codes
    61.01-51, 54, 57), originating in Romania and in free circulation in the other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '78/829/CEE: Décision de la Commission, du 22 septembre 1978, autorisant
    la République française à exclure du traitement communautaire les costumes
    et complets, tissés (y compris les ensembles qui se composent de deux ou trois
    pièces, qui sont commandées, conditionnées, transportées et normalement vendues
    ensemble) de laine, de coton ou de fibres textiles synthétiques ou artificielles
    de la position ex 61.01 du tarif douanier commun (codes Nimexe: 61.05-51; 54;
    57), originaires de Roumanie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/829/EWG: Entscheidung der Kommission vom 22. September 1978, mit der
    die französische Republik ermáchtigt wird, aus Rumánien stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche Anzúge und Kombinationen
    aus Geweben (einschließlich aus zwei oder drei Teilen bestehenden Kombinationen,
    die zusammen bestellt, aufgemacht und befórdert und normalerweise zusammen verkauft
    werden) aus Wolle, Baumwolle oder synthetischen oder kúnstlichen Spinnstoffen,
    der Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-51;
    54; 57) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/829/EØF: Kommissionens beslutning af 22. september 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage jakkesæt, vævede
    (herunder sæt, der består af to eller tre stykker, der bestilles, emballeres,
    transporteres og normalt sælges sammen), af uld, bomuld eller kemofibre, som
    henhører under pos. ex 61.01 i den fælles toldtarif (NIMEXE-kode 61.01-51, 54,
    57), har oprindelse i Rumænien og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/829/CEE: Decisione della Commissione, del 22 settembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario vestiti completi,
    tessuti, per uomo e per ragazzo (compresi i completi composti di due o tre pezzi
    ordinati, preparati, trasportati e normalmente venduti insieme) di lana, di cotone
    o di fibre tessili sintetiche o artificiali, della voce ex 61.01 della tariffa
    doganale comune (codice Nimexe 61.01-51; 54; 57), originari della Romania e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/829/EEG: Beschikking van de Commissie van 22 september 1978 waarbij
    de Franse Republiek wordt gemachtigd kostuums, geweven (daaronder begrepen kostuums
    welke uit twee of drie delen bestaan, welke gewoonlijk te zamen worden besteld,
    verpakt, vervoerd en verkocht), van wol, van katoen of van synthetische of van
    kunstmatige textielvezels, van post ex 61.01 van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.01-51 ; 54 ; 57), van oorsprong uit Roemenië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
