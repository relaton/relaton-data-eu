    77/93/EWG zuzulassen (Nur der französische, der niederländische und der deutsche
    Text sind verbindlich) (89/481/EWG) (89/481/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 25. juli 1989 om ændring af Kommissionens
