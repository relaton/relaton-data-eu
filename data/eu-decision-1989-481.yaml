title:
- language: en
  script: Latn
  content: '89/481/EEC: Commission Decision of 25 July 1989 amending Decision 89/244/EEC
    authorizing certain Member States to provide for exceptions from certain provisions
    of Directive 77/93/EEC in respect of potatoes for human consumption originating
    in Turkey (only the Dutch, French and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/481/CEE: Décision de la Commission du 25 juillet 1989 modifiant la
    décision de la Commission 89/244/CEE autorisant certains États membres à prévoir
    des dérogations à certaines dispositions de la directive 77/93/CEE pour les
    pommes de terre de consommation originaires de Turquie (Les textes en langues
    française, néerlandaise et allemande sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 25. Juli 1989 zur Änderung der Entscheidung
