title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 465/79 of 8 March 1979 re-establishing the
    levying of customs duties on inner tubes and tyre cases (new or used) of the kind
    used on bicycles, etc., falling within heading No ex 40.11 and originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 465/79 de la Commission, du 8 mars 1979, portant rétablissement
    de la perception des droits de douane applicables aux chambres à air et pneumatiques
    (neufs ou usagés) des types utilisés pour vélocipèdes, etc., de la position
    tarifaire ex 40.11, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 465/79 der Kommission vom 8. März 1979 zur Wiedereinführung
    des Zollsatzes für Luftschläuche und Laufdecken und schlauchlose Reifen (neu
    oder gebraucht) für Fahrräder, usw., der Tarifnummer ex 40.11, mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 465/79 af 8. marts 1979 om genindførelse
    af opkrævning af toldafgifter for slanger og dæk (ikke massive, nye eller brugte)
    til cykler uden motor, under position ex 40.11, som har oprindelse i Sydkorea
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 465/79 della Commissione, dell' 8 marzo 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle camere d' aria e
    coperture (nuove e usate) dei tipi utilizzati per velocipedi, ecc., della voce
    ex 40.11 della tariffa doganale comune, originarie della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 465/79 van de Commissie van 8 maart 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op binnen-banden
    en buitenbanden (nieuwe en gebruikte) van het type gebruikt voor rijwielen, enz.,
    van post ex 40.11, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
