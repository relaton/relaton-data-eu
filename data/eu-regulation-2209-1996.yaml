title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2209/96 of 19 November 1996 laying down to
    what extent applications for issue of export licences submitted during November
    1996 for beef and veal products which may benefit from special import treatment
    in Canada may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2209/96 DE LA COMMISSION du 19 novembre 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de novembre 1996 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation au
    Canada
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2209/96 DER KOMMISSION vom 19. November 1996 über
    das Ausmaß, in dem den im November 1996 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2209/96 af 19. november 1996 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i november
    1996 for oksekødsprodukter, der nyder særbehandling ved indførsel til Canada
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2209/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Νοεμβρίου 1996 για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Νοέμβριο 1996 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2209/96, annettu 19 päivänä marraskuuta 1996,
    Kanadassa erityistuontikohtelun saavien naudanliha-alan tuotteiden marraskuussa
    1996 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2209/96 DELLA COMMISSIONE del 19 novembre 1996 che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di novembre 1996 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2209/96 VAN DE COMMISSIE van 19 november 1996 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in november 1996
    ingediende aanvragen om uitvoercertificaten voor produkten van de sector rundvlees
    waarvoor een bijzondere behandeling geldt bij invoer in Canada
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2209/96 DA COMISSÃO de 19 de Novembro de 1996 que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Novembro de 1996 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    no Canadá
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2209/96 DE LA COMISIÓN de 19 de noviembre de 1996
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    certificados de exportación, presentados en el mes de noviembre de 1996, para
    los productos del sector de la carne de bovino que se beneficien de un trato especial
    para su importación en Canadá
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2209/96 av den 19 november 1996 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under november månad 1996
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till Kanada
