title:
- language: en
  script: Latn
  content: '83/58/EEC: Commission Decision of 28 January 1983 establishing that the
    apparatus described as ''Tektronix - Transient Digitizer System, model WP2005,
    consisting of: R7912 Transient Digitizer, 605 Storage Monitor and 1350 Memory
    Display Unit'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/58/CEE: Décision de la Commission du 28 janvier 1983 constatant que
    l''importation de l''appareil dénommé "Tektronix - Transient Digitizer System,
    model WP 2005, consisting of: R 7912 Transient Digitizer, 605 Storage Monitor
    and 1350 Memory Display Unit" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/58/EWG: Entscheidung der Kommission vom 28. Januar 1983, mit der festgestellt
    wird, daß das Gerät ,,Tektronix - Transient Digitizer System, model WP 2005,
    bestehend aus: R 7912 Transient Digitizer, 605 Storage Monitor und 1350 Memory
    Display Unit" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '83/58/EØF: Kommissionens beslutning af 28. januar 1983 om fastslåelse
    af, at indførsel af apparatet "Tektronix- Transient Digitizer System, model WP2005,
    consisting of: R7912 Transient Digitzer, 605 Storage Monitor and 1350 Memory Display
    Unit" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/58/ΕΟΚ: Απόφαση της Επιτροπής της 28ης Ιανουαρίου
    1983 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    με την ονομασία «Tektronix — Transient Digitizer System, model
    WP2005, consisting of: R7912 Transient Digitizer, 605 Storage Monitor and 1350
    Memory Display Unit» δύναται να πραγματοποιηθεί ατελώς
    ως προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/58/CEE: Decisione della Commissione del 28 gennaio 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "Tektronix - Transient Digitizer
    System, model WP2005, consisting of: R7912 Transient Digitizer, 605 Storage Monitor
    and 1350 Memory Display Unit" può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/58/EEG: Beschikking van de Commissie van 28 januari 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Tektronix - Transient Digitizer System,
    model WP 2005, consisting of R 7912 Transient Digitizer, 605 Storage Monitor and
    1350 Memory Display Unit" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
