title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2039/84 of 16 July 1984 fixing for the 1984/85
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2039/84 de la Commission du 16 juillet 1984 fixant,
    pour la campagne 1984/1985, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l' aide à la production
    pour les figues sèches
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2039/84 der Kommission vom 16. Juli 1984 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises für nicht verarbeitete getrocknete
    Feigen sowie des Betrages der Produktionsbeihilfe für getrocknete Feigen für
    das Wirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2039/84 af 16. juli 1984 om fastsættelse
    for produktionsåret 1984/85 af den minimumspris, der skal betales til producenterne
    for uforarbejdede tørrede figner og af producentstøtten for tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2039/84 της Επιτροπής
    της 16ης Ιουλίου 1984 για τον καθορισμό, για την
    περίοδο εμπορίας 1984/85, της ελάχιστης τιμής
    που καταβάλλεται στους παραγωγούς για τα μη
    μεταποιημένα ξηρά σύκα και του ποσού της ενίσχυσης
    στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2039/84 della Commissione del 16 luglio 1984 che fissa,
    per la campagna di commercializzazione 1984/1985, il prezzo minimo da pagare ai
    produttori per i fichi secchi non trasformati e l' importo dell' aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2039/84 van de Commissie van 16 juli 1984 tot vaststelling,
    voor het verkoopseizoen 1984/1985, van de aan de telers te betalen minimumprijs
    voor niet-verwerkte, gedroogde vijgen en van het bedrag van de produktiesteun
    voor gedroogde vijgen
  type: main
