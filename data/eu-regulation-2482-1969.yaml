title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2482/69 de la Commission, du 11 décembre 1969, modifiant
    le règlement (CEE) n° 1285/69 relatif à l'adjudication permanente de lait écrémé
    en poudre en ce qui concerne la composition des aliments composés à base de
    lait écrémé en poudre pour les porcs ou la volaille
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2482/69 der Kommission vom 11. Dezember 1969 zur Änderung
    der Verordnung (EWG) Nr. 1285/69 über die Dauerausschreibung von Magermilchpulver
    hinsichtlich der Zusammensetzung der daraus herzustellenden Mischfutter für Schweine
    oder Geflügel
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2482/69 della Commissione, dell'11 dicembre 1969,
    che modifica il regolamento (CEE) n. 1285/69, relativo all'asta permanente per
    latte scremato in polvere, per quanto riguarda la composizione degli alimenti
    composti a base di latte scremato in polvere destinati ai suini e al pollame
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2482/69 van de Commissie van 11 december 1969 tot
    wijziging van Verordening (EEG) nr. 1285/69 houdende bepalingen voor de permanente
    verkoop bij inschrijving van magere-melkpoeder in het bezit van de interventiebureaus,
    bestemd voor verwerking tot mengvoeder voor varkens of pluimvee
  type: main
