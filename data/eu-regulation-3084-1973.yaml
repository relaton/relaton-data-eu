  content: Regulation (EEC) No 3084/73 of the Commission of 14 November 1973 amending
    in particular Regulation (EEC) No 2500/73 on the advance fixing of refunds and
    the period of validity of export certificates for milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3084/73 de la Commission, du 14 novembre 1973, modifiant
    notamment le règlement (CEE) n° 2500/73, relatif à la fixation à l' avance
    des restitutions et à la durée de validité des certificats d' exportation dans
    le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3084/73 der Kommission vom 14. November 1973 zur Änderung
    namentlich der Verordnung (EWG) Nr. 2500/73 über die Vorausfestsetzung der Erstattungen
    und die Gültigkeitsdauer der Ausfuhrlizenzen für Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3084/73 af 14. november 1973 om ændring
    navnlig af forordning nr. 2500/73 om forudfastsættelse af restitutionerne og
    om fastlæggelse af gyldighedsperioden for eksportlicenser, for så vidt angår
    mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3084/73 τής Επιτροπής
    τής 14ης Νοεμβρίου 1973 περί τροποποιήσεως ιδίως
    τού κανονισμού (EOK) αριθ. 2500/73 «περί τού εκ τών
    προτέρων καθορισμού τών επιδοτήσεων καί τής
    διάρκειας τής ισχύος τών πιστοποιητικών εξαγωγής
    στόν τομέα τού γάλακτος καί τών γαλακτοκομικών
    προϊόντων»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3084/73 della Commissione, del 14 novembre 1973, che
    modifica in particolate il regolamento (CEE) n. 2500/73, relativo alla fissazione
    in anticipo delle restituzioni ed alla durata di validità dei titoli d' esportazione
    nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3084/73 van de Commissie van 14 november 1973 houdende
    inzonderheid wijziging van Verordening (EEG) nr. 2500/73 voor het vooraf vaststellen
    van de restituties en de geldigheidsduur van de uitvoercertificaten in de sector
    melk en zuivelprodukten
