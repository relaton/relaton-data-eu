title:
- language: en
  script: Latn
  content: '2006/772/EC: Commission Decision of 10 November 2006 granting certain
    parties an exemption from the extension to certain bicycle parts of the anti-dumping
    duty on bicycles originating in the People’s Republic of China imposed by Council
    Regulation (EEC) No 2474/93, last maintained and amended by Regulation (EC) No
    1095/2005, and lifting the suspension of the payment of the anti-dumping duty
    extended to certain bicycle parts originating in the People’s Republic of China
    granted to certain parties pursuant to Regulation (EC) No 88/97'
  type: main
- language: fr
  script: Latn
  content: '2006/772/CE: Décision de la Commission du 10 novembre 2006 exemptant
    certaines parties de l’extension à certaines pièces de bicyclette du droit
    antidumping institué par le règlement (CEE) n o 2474/93 du Conseil, sur les
    bicyclettes originaires de la République populaire de Chine, maintenu et modifié
    en dernier lieu par le règlement (CE) n o 1095/2005, et levant la suspension
    du paiement du droit antidumping étendu à certaines pièces de bicyclette originaires
    de la République populaire de Chine accordée à certaines parties en vertu du
    règlement (CE) n o 88/97'
  type: main
- language: de
  script: Latn
  content: '2006/772/EG: Entscheidung der Kommission vom 10. November 2006 zur Befreiung
    bestimmter Parteien von der Ausweitung des Antidumpingzolls auf bestimmte Fahrradteile,
    der mit der Verordnung (EWG) Nr. 2474/93 des Rates auf die Einfuhren von Fahrrädern
    mit Ursprung in der Volksrepublik China eingeführt und mit der Verordnung (EG)
    Nr. 1095/2005 aufrechterhalten und geändert wurde, und zur Aufhebung der gemäß
    der Verordnung (EG) Nr. 88/97 erfolgten Aussetzung der Entrichtung des auf bestimmte
    Fahrradteile mit Ursprung in der Volksrepublik China ausgeweiteten Antidumpingzolls
    im Fall bestimmter Parteien'
  type: main
- language: bg
  script: Cyrl
