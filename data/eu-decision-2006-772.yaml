    pentru bicicletele originare din Republica Populară Chineză prin Regulamentul
    (CEE) nr. 2474/93 al Consiliului, menținut și modificat ultima dată prin Regulamentul
    (CE) nr. 1095/2005, și de ridicare a suspendării plății dreptului antidumping
    extins la anumite piese de bicicletă originare din Republica Populară Chineză
    acordate unor părți în temeiul Regulamentului (CE) nr. 88/97
  type: main
