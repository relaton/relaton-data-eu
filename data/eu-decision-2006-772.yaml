    № 1095/2005, и за възобновяване на плащането на
    антидъмпинговото мито, дължимо за някои велосипедни
    части с произход от Китайската народна република,
    временно спряно за някои страни по силата на
    Регламент (ЕО) № 88/97
  type: main
