title:
- language: fr
  script: Latn
  content: Décision 65/537/CEE de la Commission, du 29 novembre 1965, portant augmentation
    du volume du contingent tarifaire octroyé à la République italienne pour les
    morues, y compris stockfisch et klippfisch, simplement salées ou en saumure ou
    séchées, entières, décapitées ou tronçonnés
  type: main
- language: de
  script: Latn
  content: '65/537/EWG: Entscheidung der Kommission vom 29. November 1965 über die
    Erhöhung des der Italienischen Republik gewährten Zollkontingents für Kabeljau,
    einschließlich Stockfisch und Klippfisch, nur gesalzen, in Salzlake oder getrocknet,
    ganz, ohne Kopf oder zerteilt'
  type: main
- language: it
  script: Latn
  content: '65/537/CEE: Decisione della Commissione, del 29 novembre 1965, che aumenta
    il volume del contingente tariffario concesso alla Repubblica italiana per i merluzzi,
    ivi compresi lo stoccafisso e il baccalà, semplicemente salati o in salamoia
    o secchi, interi, decapitati o in pezzi'
  type: main
- language: nl
  script: Latn
  content: '65/537/EEG: Beschikking van de Commissie van 29 november 1965 tot vergroting
    van het aan de Italiaanse Republiek toegekende tariefcontingent voor kabeljauw,
    stokvis en klipvis daaronder begrepen, enkel gezouten, gepekeld of gedroogd, ook
    indien ontdaan van kop of in moten gesneden'
  type: main
