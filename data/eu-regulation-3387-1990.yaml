title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3387/90 of 26 November 1990 re-establishing
    the levying of customs duties on products of category 65 (order No 40.0650), originating
    in Argentina, to which the preferental tariff arrangements set out in Council
    Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3387/90 de la Commission du 26 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie n° 65 (numéro d'ordre 40.0650) originaires de l'Argentine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3387/90 DER KOMMISSION vom 26. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 65
    (laufende Nummer 40.0650) mit Ursprung in Argentinien, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3387/90 af 26. november 1990 om genindførelse
    af opkrævning af toldafgifter for varer under varekategori nr. 65 (løbenummer
    40.0650), som har oprindelse i Argentina og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3387/90 της Επιτροπής
    της 26ης Νοεμβρίου 1990 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών στα προϊόντα
    της κατηγορίας 65 ( αύξων αριθμός 40.0650 ), καταγωγής
    Αργεντινής, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3387/90 DELLA COMMISSIONE del 26 novembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 65 (numero d'ordine 40.0650) originari dell'Argentina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3387/90 VAN DE COMMISSIE van 26 november 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van de categorie van produkten nr. 65 (volgnummer 40.0650), van oorsprong uit
    Argentinië, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3387/90 DA COMISSAO de 26 de Novembro de 1990 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis aos produtos da categoria
    de produtos n* 65 (numero de ordem 40.0650), originarios da Argentina, beneficiaria
    das preferências pautais previstas no Regulamento (CEE) n* 3897/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3387/90 DE LA COMISION de 26 de noviembre de 1990 relativo
    al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a los productos de la categoria no 65 (numero de orden 40.0650) originarios de
    Argentina, beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3897/89 del Consejo
