title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3512/87 of 23 November 1987 re-establishing
    the levying of customs duties on dolls falling within heading No 97.02 of the
    Common Customs Tariff originating in the Philippines to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3512/87 de la Commission du 23 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux poupées
    de tous genres de la position 97.02 du tarif douanier commun, originaires des
    Philippines, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3512/87 der Kommission vom 23. November 1987 zur Wiedereinführung
    der Erhebung der Zölle für Puppen aller Art der Tarifnummer 97.02 des Gemeinsamen
    Zolltarifs mit Ursprung in den Philippinen, dem die in der Verordnung (EWG) Nr.
    3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3512/87 af 23. november 1987 om genindførelse
    af opkrævning af told for dukker henhørende under pos. 97.02 i den fælles toldtarif
    og med oprindelse i Filippinerne, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3512/87 της Επιτροπής
    της 23ης Νοεμβρίου 1987 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για κούκλες κάθε είδους
    της κλάσεως 97.02 του κοινού δασμολογίου, καταγωγής
    Φιλιππινών, δικαιούχων των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3512/87 della Commissione del 23 novembre 1987 che
    ripristina la riscossione dei dazi doganali applicabili alle bambole di ogni specie,
    della voce 97.02 della tariffa doganale comune, originarie delle Filippine beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3512/87 van de Commissie van 23 november 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op poppen van
    alle soorten van post 97.02 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Filippijnen, waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3512/87 da Comissão de 23 de Novembro de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis às bonecas de qualquer
    espécie da posição 97.02 da pauta aduaneira comum, originárias das Filipinas,
    beneficiária das preferências pautais previstas no Regulamento (CEE) n.° 3924/86
    do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3512/87 de la Comisión de 23 de noviembre de 1987
