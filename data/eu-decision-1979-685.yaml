id: EUDecision1979685
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/685/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of procelain or china, of
    earthenware, or of other kinds of pottery, falling within heading No 69.11 and
    subheading 69.12 C of the Common Customs Tariff, originating in Japan and in free
    circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/685/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine, en faïence ou en autres
    matières céramiques, de la position 69.11 et de la sous-position 69.12 C du
    tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/685/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts- und Toilettengegegenstände,
    aus Porzellan, aus Steingut oder aus anderen keramischen Stoffen, der Tarifnummern
    69.11 und 69.12 C des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/685/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler, af porcelæn, af fajance, af andet keramisk
    materiale, som henhører under pos. 69.11 og 69.12 C i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun den
    franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/685/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario vasellame e oggetti
    di uso domestico o da toletta, di porcellana, di terracotta fine o di altre materie
    ceramiche, della voce 69.11 e della sottovoce 69.12 C della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/685/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein, van faience of van andere keramische stoffen, van de posten 69.11
    en 69.12 C van het gemeenschappelijk douanetarief, van oorsprong uit Japan en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
