    en octobre 1995 pour certains fromages dans le cadre du régime prévu par les
    accords intérimaires conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2472/95 DER KOMMISSION vom 24. Oktober 1995 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im Oktober
    1995 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2472/95 af 24. oktober 1995 om fastsættelse
