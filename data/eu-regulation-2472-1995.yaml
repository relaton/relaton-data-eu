  content: COMMISSION REGULATION (EC) No 2472/95 of 24 October 1995 determining the
    extent to which applications lodged in October 1995 for import certificates for
    certain cheeses covered by the arrangements provided for in the Interim Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2472/95 DE LA COMMISSION du 24 octobre 1995 déterminant
