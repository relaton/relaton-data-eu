    υποκατάστατα του συνόλου του διαιτολογίου
    για τον έλεγχο του σωματικού βάρους και σε
    τρόφιμα για ειδικούς ιατρικούς σκοπούς
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2025/1735, 4. juuni 2025, millega
    muudetakse Euroopa Parlamendi ja nõukogu määruse (EL) nr 609/2013 lisa, et
    lubada kasutada L-5-metüültetrahüdrofoolhappe mononaatriumsoola folaadiallikana
    imiku piimasegus ja jätkupiimasegus, teraviljapõhises töödeldud toidus ja
    imikutoidus, kehakaalu alandamiseks ettenähtud päevase toidu asendajas ja meditsiinilisel
    näidustusel kasutamiseks ettenähtud toidus
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2025/1735, annettu 4 päivänä kesäkuuta
    2025, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 609/2013 liitteen muuttamisesta
    L-5-metyylitetrahydrofoolihapon mononatriumsuolan käytön sallimiseksi folaatin
    lähteenä äidinmaidonkorvikkeissa ja vieroitusvalmisteissa, viljapohjaisissa
    valmisruoissa ja lastenruoissa, painonhallintaan tarkoitetuissa ruokavalionkorvikkeissa
    ja erityisiin lääkinnällisiin tarkoituksiin tarkoitetuissa elintarvikkeissa
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2025/1735 ón gCoimisiún an 4 Meitheamh 2025
    lena leasaítear an Iarscríbhinn a ghabhann le Rialachán (AE) Uimh. 609/2013
    ó Pharlaimint na hEorpa agus ón gComhairle chun úsáid salainn monasóidiam
    d’aigéad L-5-meitilteitrihidreafólach a cheadú mar fhoinse fóláite i mbainne
    foirmle do naíonáin agus i mbainne foirmle leantach, i mbia gránachbhunaithe
    próiseáilte agus i mbia do naíonáin, in ionadach ar an aiste bia iomlán chun
    meáchan a rialú agus i mbia chun críoch speisialta míochaine
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/1735 оd 4. lipnja 2025. o izmjeni
    Priloga Uredbi (EU) br. 609/2013 Europskog parlamenta i Vijeća kako bi se dopustila
    upotreba mononatrijeve soli L-5-metiltetrahidrofolne kiseline kao izvora folata
    u početnoj i prijelaznoj hrani za dojenčad, prerađenoj hrani na bazi žitarica
    i dječjoj hrani, zamjeni za cjelodnevnu prehranu pri redukcijskoj dijeti i hrani
    za posebne medicinske potrebe
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/1735 felhatalmazáson alapuló rendelete (2025.
    június 4.) a 609/2013/EU európai parlamenti és tanácsi rendelet mellékletének
    az L-5-metiltetrahidrofolsav mononátriumsója anyatej-helyettesítő és anyatej-kiegészítő
    tápszerekben, feldolgozott gabonaalapú élelmiszerekben és bébiételekben,
    testtömeg-szabályozás céljára szolgáló, teljes napi étrendet helyettesítő
    élelmiszerekben és speciális gyógyászati célokra szánt élelmiszerekben
    folátforrásként történő felhasználásának engedélyezése céljából
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/1735 della Commissione, del 4 giugno 2025,
    che modifica l’allegato del regolamento (UE) n. 609/2013 del Parlamento europeo
    e del Consiglio per consentire l’uso del sale monosodico dell’acido L-5-metiltetraidrofolico
    come fonte di folato nelle formule per lattanti e nelle formule di proseguimento,
    negli alimenti a base di cereali e negli altri alimenti per la prima infanzia,
    nei sostituti dell’intera razione alimentare giornaliera per il controllo del
    peso e negli alimenti a fini medici speciali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/1735 (2025. gada 4. jūnijs), ar
    ko Eiropas Parlamenta un Padomes Regulas (ES) Nr. 609/2013 pielikumu groza, lai
    atļautu L-5 metiltetrahidrofolijskābes mononātrija sāli izmantot par folāta
    avotu maisījumā zīdaiņiem un papildu ēdināšanas maisījumā zīdaiņiem,
    apstrādātā graudaugu pārtikā un zīdaiņu pārtikā, pilnīgos uztura aizstājējos
    svara kontrolei un īpašiem medicīniskiem nolūkiem paredzētā pārtikā
  type: main
- language: lt
  script: Latn
  content: 2025 m. birželio 4 d. Komisijos deleguotasis reglamentas (ES) 2025/1735,
    kuriuo dėl leidimo naudoti L-5-metiltetrahidrofolio rūgšties mononatrio druską
    kaip foliato šaltinį pradinio maitinimo kūdikių mišiniuose ir tolesnio maitinimo
    kūdikių mišiniuose, perdirbtuose grūdiniuose maisto produktuose ir kūdikiams
    skirtuose maisto produktuose, viso paros raciono pakaitaluose svoriui kontroliuoti
    ir specialiosios medicininės paskirties maisto produktuose iš dalies keičiamas
    Europos Parlamento ir Tarybos reglamento (ES) Nr. 609/2013 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/1735 tal-4 ta’ Ġunju 2025
    li jemenda l-Anness tar-Regolament (UE) Nru 609/2013 tal-Parlament Ewropew u tal-Kunsill
    biex jippermetti l-użu tal-melħ tal-monosodju tal-aċidu L-5-metiltetraidrofoliku
    bħala sors ta’ folat fil-formula tat-trabi u fil-formula tal-prosegwiment,
    fl-ikel ipproċessat abbażi ta’ ċereali u fl-ikel tat-trabi, fis-sostitut
    tad-dieta kollha għall-kontroll tal-piż u fl-ikel għal skopijiet mediċi speċjali
  type: main
