---
id: EURegulation20251735
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1735 of 4 June 2025 amending
    the Annex to Regulation (EU) No 609/2013 of the European Parliament and of the
    Council to allow the use of monosodium salt of L-5-methyltetrahydrofolic acid
    as a source of folate in infant formula and follow-on formula, processed cereal-based
    food and baby food, total diet replacement for weight control and in food for
    special medical purposes
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1735 de la Commission du 4 juin 2025 modifiant
    l’annexe du règlement (UE) no 609/2013 du Parlement européen et du Conseil
    pour permettre l’utilisation du sel monosodique de l’acide L-5-méthyltétrahydrofolique
    en tant que source de folate dans les préparations pour nourrissons et les préparations
    de suite, les préparations à base de céréales et les denrées alimentaires
    pour bébés, les substituts de la ration journalière totale pour contrôle du
    poids et les denrées alimentaires destinées à des fins médicales spéciales
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/1735 der Kommission vom 4. Juni 2025 zur
    Änderung des Anhangs der Verordnung (EU) Nr. 609/2013 des Europäischen Parlaments
    und des Rates zwecks Zulassung der Verwendung von Mononatriumsalz der L-5-Methyltetrahydrofolsäure
    als Folatquelle in Säuglingsanfangsnahrung und Folgenahrung, Getreidebeikost
    und anderer Beikost, Tagesrationen für gewichtskontrollierende Ernährung und
    Lebensmitteln für besondere medizinische Zwecke
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/1735 на Комисията
    от 4 юни 2025 година за изменение на приложението
    към Регламент (ЕС) № 609/2013 на Европейския парламент
    и на Съвета с цел да се разреши употребата на
    мононатриева сол на L-5-метилтетрахидрофолиевата
    киселина като източник на фолат в храни за
    кърмачета и преходни храни, преработени храни
    на зърнена основа и детски храни, заместители
    на целодневния хранителен прием за регулиране
    на телесното тегло и храни за специални медицински
    цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/1735 ze dne 4. června
    2025, kterým se mění příloha nařízení Evropského parlamentu a Rady (EU)
    č. 609/2013 s cílem umožnit používání monosodné soli kyseliny L-5-methyltetrahydrolistové
    jako zdroje folátu v počáteční a pokračovací kojenecké výživě, obilných
    příkrmech a potravinách pro malé děti, náhradě celodenní stravy pro regulaci
    hmotnosti a v potravinách pro zvláštní lékařské účely
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/1735 af 4. juni 2025 om ændring
    af bilaget til Europa-Parlamentets og Rådets forordning (EU) nr. 609/2013 med
    henblik på at tillade anvendelsen af mononatriumsalt af L-5-methyltetrahydrofolsyre
    som kilde til folat i modermælkserstatninger og tilskudsblandinger, forarbejdede
    fødevarer baseret på cerealier og babymad, kosterstatning til vægtkontrol og
    fødevarer til særlige medicinske formål
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2025/1735
    της Επιτροπής, της 4ης Ιουνίου 2025, για την τροποποίηση
    του παραρτήματος του κανονισμού (ΕΕ) αριθ. 609/2013
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    ώστε να επιτραπεί η χρήση μονονατριούχου άλατος
    L-5-μεθυλοτετραϋδροφολικού οξέος ως πηγής φολικού
    οξέος σε παρασκευάσματα για βρέφη και παρασκευάσματα
    δεύτερης βρεφικής ηλικίας, μεταποιημένες τροφές
