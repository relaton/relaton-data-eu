  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/1735 van de Commissie van 4 juni 2025
    tot wijziging van de bijlage bij Verordening (EU) nr. 609/2013 van het Europees
    Parlement en de Raad om het gebruik van mononatriumzout van L-5-methyltetrahydrofoliumzuur
    toe te staan als bron van folaat in volledige zuigelingenvoeding en opvolgzuigelingenvoeding,
    bewerkte levensmiddelen op basis van granen en babyvoeding, de dagelijkse voeding
    volledig vervangende producten voor gewichtsbeheersing en voeding voor medisch
    gebruik
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/1735 z dnia 4 czerwca 2025
    r. zmieniające załącznik do rozporządzenia Parlamentu Europejskiego i Rady
    (UE) nr 609/2013 w celu zezwolenia na stosowanie monosodowej soli kwasu L-5-metylotetrahydrofoliowego
    jako źródła folianów w preparatach do początkowego żywienia niemowląt i
    preparatach do dalszego żywienia niemowląt, produktach zbożowych przetworzonych
    i żywności dla dzieci, środkach spożywczych zastępujących całodzienną
    dietę, do kontroli masy ciała, oraz w żywności specjalnego przeznaczenia medycznego
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/1735 da Comissão, de 4 de junho de 2025,
    que altera o anexo do Regulamento (UE) n.o 609/2013 do Parlamento Europeu e do
    Conselho a fim de permitir a utilização de sal monossódico do ácido L-5-metiltetra-hidrofólico
    como uma fonte de folato em fórmulas para lactentes e fórmulas de transição,
    em alimentos transformados à base de cereais e alimentos para bebés, em substitutos
    integrais da dieta para controlo do peso e em alimentos destinados a fins medicinais
    específicos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/1735 al Comisiei din 4 iunie 2025 de modificare
    a anexei la Regulamentul (UE) nr. 609/2013 al Parlamentului European și al Consiliului
    pentru a permite utilizarea sării monosodice a acidului L-5-metiltetrahidrofolic
    ca sursă de folat în formulele de început și formulele de continuare, preparatele
    pe bază de cereale și alimentele pentru copii, înlocuitorii totali ai dietei
    în scop de control al greutății și alimentele destinate unor scopuri medicale
    speciale
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/1735 zo 4. júna 2025, ktorým
    sa mení príloha k nariadeniu Európskeho parlamentu a Rady (EÚ) č. 609/2013
    s cieľom povoliť používanie monosodnej soli kyseliny L-5-metyltetrahydrolistovej
    ako zdroja folátu v počiatočnej dojčenskej výžive a následnej dojčenskej
    výžive, spracovaných potravinách na báze obilnín a detských potravinách,
    celkovej náhrade stravy na účely regulácie hmotnosti a v potravinách na osobitné
    lekárske účely
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/1735 z dne 4. junija 2025 o spremembi
    Priloge k Uredbi (EU) št. 609/2013 Evropskega parlamenta in Sveta, da se dovoli
    uporaba mononatrijeve soli L-5-metiltetrahidrofolne kisline kot vira folata v
    začetnih formulah za dojenčke in nadaljevalnih formulah, živilih na osnovi
    predelanih žit in otroški hrani, popolnih prehranskih nadomestkih za nadzor
    nad telesno težo in živilih za posebne zdravstvene namene
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/1735 de la Comisión, de 4 de junio de 2025,
    por el que se modifica el anexo del Reglamento (UE) n.o 609/2013 del Parlamento
    Europeo y del Consejo para permitir el uso de la sal monosódica del ácido L-5-metiltetrahidrofólico
    como fuente de folato en preparados para lactantes y preparados de continuación,
    alimentos elaborados a base de cereales y alimentos infantiles, sustitutivos de
    la dieta completa para el control del peso y en alimentos para usos médicos especiales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/1735 av den 4 juni 2025
    om ändring av bilagan till Europaparlamentets och rådets förordning (EU) nr
    609/2013 för att tillåta användning av mononatriumsalt av L-5-metyltetrahydrofolsyra
    som folatkälla i modersmjölksersättning och tillskottsnäring, beredda spannmålsbaserade
    livsmedel och barnmat, komplett kostersättning för viktkontroll och livsmedel
    för speciella medicinska ändamål
