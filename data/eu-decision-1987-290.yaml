title:
- language: en
  script: Latn
  content: '87/290/EEC: Commission Decision of 10 April 1987 authorizing the French
    Republic to apply intra-Community surveillance to acetic acid originating in the
    United States of America and put into free circulation in Spain (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/290/CEE: Décision de la Commission du 10 avril 1987 autorisant la
    République française à instaurer une surveillance intracommunautaire de l''acide
    acétique originaire desÉtats-Unis d''Amérique, mis en libre pratique en Espagne
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/290/EWG: Entscheidung der Kommission vom 10. April 1987 mit der die
    Französische Republik ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren von aus den Vereinigten Staaten von Amerika stammender und in Spanien
    im freien Verkehr befindlicher Essigsäure einzuführen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/290/EØF: Kommissionens beslutning af 10. april 1987 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførslen
    af eddikesyre, der har oprindelse i Amerikas Forenede Stater, og som overgår
    til fri omsætning i Spanien (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/290/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Απριλίου 1987 για την παροχή έγκρισης στη γαλλική
    κυβέρνηση να καθιερώσει ενδοκοινοτική επιτήρηση
    του οξικού οξέος καταγωγής Ηνωμένων Πολιτειών
    της Αμερικής που τίθεται σε ελεύθερη κυκλοφορία
    στην Ισπανία (Το κείμενο στην γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/290/CEE: Decisione della Commissione del 10 aprile 1987 che autorizza
    la Repubblica francese ad instaurare una sorveglianza intracomunitaria nei confronti
