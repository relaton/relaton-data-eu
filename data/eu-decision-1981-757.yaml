title:
- language: en
  script: Latn
  content: '81/757/EEC: Commission Decision of 18 August 1981 authorizing the French
    Republic not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste) originating in Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/757/CEE: Décision de la Commission, du 18 août 1981, autorisant la
    République française à exclure du traitement communautaire les tissus de fibres
    textiles synthétiques discontinues, originaires de T''ai-wan (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/757/EWG: Entscheidung der Kommission vom 18. August 1981 zur Ermächtigung
    der Französischen Republik, aus Taiwan stammende Gewebe aus synthetischen Spinnfasern
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/757/EØF: Kommissionens beslutning af 18. august 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre, syntetiske eller regenererede, med oprindelse i Taiwan (Kun
    den franske udgave er autentisk)'
  type: main
