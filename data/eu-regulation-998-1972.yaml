title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 998/72 de la Commission, du 16 mai 1972, fixant dans
    les secteurs de la viande de porc, des oeufs et volailles, du lait et des produits
    laitiers, la date de la prise d'effet des montants compensatoires fixés par le
    règlement (CEE) n° 979/72
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 998/72 der Kommission vom 16. Mai 1972 zur Festsetzung
    des Datums, ab welchem die neuen, durch die Verordnung (EWG) Nr. 979/72 festgesetzten
    Ausgleichsbeträge auf den Sektoren Schweinefleisch, Eier und Geflügelfleisch,
    Milch und Milcherzeugnisse anzuwenden sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 998/72 della Commissione, del 16 maggio 1972, che
    fissa nei settori delle carni suine, del pollame e delle uova, del latte e dei
    prodotti lattiero-caseari la data di decorrenza degli importi compensativi fissati
    dal regolamento (CEE) n. 979/72
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 998/72 van de Commissie van 16 mei 1972 houdende
    vaststelling van de datum waarop de compenserende bedragen in de sectoren varkensvlees,
    slachtpluimvee en eieren, melk en zuivelprodukten, vastgesteld bij Verordening
    (EEG) nr. 979/72, van kracht worden
  type: main
