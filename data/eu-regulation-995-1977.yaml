title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 995/77 of 10 May 1977 re-establishing the
    levying of the customs duties on knives with cutting blades, serrated or not (including
    pruning knives), falling within heading No 82.09, originating in Hong Kong to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 995/77 de la Commission, du 10 mai 1977, portant rétablissement
    de la perception des droits de douane applicables aux couteaux à lame tranchante
    ou dentelée, y compris les serpettes fermantes, de la position tarifaire 82.09,
    originaires de Hong-Kong bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 995/77 der Kommission vom 10. Mai 1977 zur Wiedereinführung
    des Zollsatzes für Messer mit schneidender oder gezahnter Klinge, einschließlich
    Klappmesser für den Gartenbau, der Tarifnummer 82.09, mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 995/77 af 10. maj 1977 om genindførelse
    af opkrævning af toldafgifter for knive, med skærende eller savtakket æg (herunder
    beskærerknive), under position 82.09, som har oprindelse i Hongkong og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 995/77 della Commissione, del 10 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata, compresi i roncoli chiudibili, della voce doganale 82.09, originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 995/77 van de Commissie van 10 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op messen,
    ook indien getand, zaksnoeimessen daaronder begrepen, van post 82.09, van oorsprong
    uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
