    di gioielleria e loro parti, di metalli preziosi, del codice NC 7113, originari
    della Tailandia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3635/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3624/88 van de Commissie van 22 november 1988 houdende
