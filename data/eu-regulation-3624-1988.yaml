    KN-Code 7113 mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3635/87
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3624/88 af 22. november 1988 om genindførelse
    af opkrævning af told for juveler, smykker og andre varer, af ædle metaller,
    henhørende under KN-kode 7113 og med oprindelse i Thailand, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
