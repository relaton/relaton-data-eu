title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3624/88 of 22 November 1988 re-establishing
    the levying of customs duties on articles of jewellery and parts thereof, of precious
    metal, falling within CN code 7113, originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3624/88 de la Commission du 22 novembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux articles
    de bijouterie ou de joaillerie et leurs parties, en métaux précieux, du code
    7113 de la nomenclature combinée, originaires de Thaïlande, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3624/88 der Kommission vom 22. November 1988 zur Wiedereinführung
