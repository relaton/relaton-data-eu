    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen 1507 ×
    MIR162 × MON810 × NK603 och av den genetiskt modifierade majsen som kombinerar
    två eller tre av de enskilda händelserna 1507, MIR162, MON810 och NK603, i enlighet
    med Europaparlamentets och rådets förordning (EG) nr 1829/2003 (delgivet med
