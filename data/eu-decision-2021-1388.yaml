    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu 1507 × MIR162
    × MON810 × NK603 un ģenētiski modificēto kukurūzu, kurā kombinēti divi
    vai trīs vienkārši notikumi 1507, MIR162, MON810 and NK603, no tām sastāv
    vai ir no tām ražoti (izziņots ar dokumenta numuru C(2021) 5995) (Autentisks
    ir tikai teksts franču un nīderlandiešu valodā)
  type: main
