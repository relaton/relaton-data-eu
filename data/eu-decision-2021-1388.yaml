type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1388 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize 1507 × MIR162 × MON810 × NK603 and genetically modified
    maize combining two or three of the single events 1507, MIR162, MON810 and NK603,
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2021)5995) (Only the Dutch and French texts
    are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1388 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié 1507 × MIR162 × MON810 × NK603 et du maïs génétiquement modifié
    combinant deux ou trois des événements de transformation simples 1507, MIR162,
    MON810 et NK603, consistant en ces maïs ou produits à partir de ceux-ci, en
    application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2021) 5995] (Les textes en langues française et
    néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1388 der Kommission vom 17. August 2021
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte 1507 × MIR162 × MON810 × NK603 enthalten, aus ihm bestehen oder
    aus ihm hergestellt werden, und von genetisch verändertem Mais, bei dem zwei
    oder drei der Einzelereignisse 1507, MIR162, MON810 und NK603 kombiniert werden,
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5995) (Nur der französische
    und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/1388 на Комисията
    от 17 август 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица 1507 × MIR162 × MON810 × NK603 и генетично модифицирана
    царевица, съвместяваща две или три от единичните
    събития 1507, MIR162, MON810 и NK603 в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2021) 5995) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1388 ze dne 17. srpna 2021 o
    povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    1507 × MIR162 × MON810 × NK603 a geneticky modifikovanou kukuřici kombinující
    dvě nebo tři jednoduché události 1507, MIR162, MON810 a NK603, sestávají
    z nich nebo jsou z nich vyrobeny, na trh podle nařízení Evropského parlamentu
    a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2021) 5995) (Pouze nizozemské
    a francouzské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1388 af 17. august 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret 1507 × MIR162 × MON810 × NK603-majs
    og genetisk modificeret majs, der kombinerer to eller tre af de enkelte begivenheder
    1507, MIR162, MON810 og NK603, i henhold til Europa-Parlamentets og Rådets forordning
    (EF) nr. 1829/2003 (meddelt under nummer C(2021) 5995) (Kun den franske og den
    nederlandske udgave er autentiske)
  type: main
