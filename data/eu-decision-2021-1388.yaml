- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1388 z dne 17. avgusta 2021 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo 1507 × MIR162
    × MON810 × NK603, so iz nje sestavljeni ali proizvedeni, in gensko spremenjeno
    koruzo, v kateri sta združena dva ali trije posamezni dogodki 1507, MIR162, MON810
    in NK603, v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta
    (notificirano pod dokumentarno številko C(2021) 5995) (Besedilo v francoskem
    in nizozemskem jeziku je edino verodostojno)
  type: main
