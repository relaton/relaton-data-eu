    umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    1507 × MIR162 × MON810 × NK603 a geneticky modifikovanú kukuricu s kombináciou
    dvoch alebo troch transformačných zmien 1507, MIR162, MON810 a NK603, sú z
    nich zložené alebo vyrobené [oznámené pod číslom C(2021)5995] (Iba holandské
