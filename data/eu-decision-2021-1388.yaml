  script: Latn
  content: Decisión de Ejecución (UE) 2021/1388 de la Comisión de 17 de agosto
    de 2021 por la que se autoriza la comercialización de productos que contengan,
    se compongan o se hayan producido a partir de maíz modificado genéticamente
    1507 × MIR162 × MON810 × NK603 y de maíz modificado genéticamente que combine
    dos o tres de los eventos únicos 1507, MIR162, MON810 y NK603, de conformidad
    con el Reglamento (CE) n.o 1829/2003 del Parlamento Europeo y del Consejo [notificada
