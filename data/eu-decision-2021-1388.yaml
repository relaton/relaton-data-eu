    iš dviejų ar trijų atskirų 1507, MIR162, MON810 ir NK603 transformacijos įvykių
    derinių, kurie iš jų sudaryti arba kurie iš jų pagaminti (pranešta dokumentu
    Nr. C(2021) 5995) (Tekstas autentiškas tik nyderlandų ir prancūzų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1388 tas-17
    ta’ Awwissu 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu minn, jew li jkunu magħmulin mill-qamħirrum ġenetikament modifikat
    1507 × MIR162 × MON810 × NK603, u mill-qamħirrum ġenetikament modifikat li
    jikkombina tnejn jew tlieta mill-eventi uniċi 1507, MIR162, MON810 u NK603 skont
    ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata
    bid-dokument C(2021)5995) (It-testi bl-Olandiż u bil-Franċiż biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1388 van de Commissie van 17 augustus 2021
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    mais 1507 × MIR162 × MON810 × NK603 en genetisch gemodificeerde mais die tot
    stand is gekomen door combinatie van twee of drie van de afzonderlijke transformatiestappen
    1507, MIR162, MON810 en NK603, overeenkomstig Verordening (EG) nr. 1829/2003 van
    het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2021)
    5995) (Slechts de teksten in de Nederlandse en de Franse taal zijn authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1388 z dnia 17 sierpnia 2021 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    1507 × MIR162 × MON810 × NK603 oraz rodzaje genetycznie zmodyfikowanej kukurydzy
    łączące dwie lub trzy pojedyncze modyfikacje 1507, MIR162, MON810 i NK603 oraz
    produktów składających się z wymienionych rodzajów genetycznie zmodyfikowanej
    kukurydzy lub z niej wyprodukowanych (notyfikowana jako dokument nr C(2021) 5995)
    (Jedynie teksty w języku francuskim i niderlandzkim są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1388 da Comissão de 17 de agosto de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado 1507 × MIR162
    × MON810 × NK603 e milho geneticamente modificado combinando dois ou três dos
    eventos únicos 1507, MIR162, MON810 e NK603, nos termos do Regulamento (CE) n.o
    1829/2003 do Parlamento Europeu e do Conselho [notificada com o número C(2021)5995]
    (Apenas fazem fé os textos nas línguas neerlandesa e francesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1388 a Comisiei din 17 august
