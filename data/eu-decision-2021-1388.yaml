    în sau sunt fabricate din porumb modificat genetic 1507 × MIR162 × MON810 ×
    NK603 și din porumb modificat genetic obținut din combinarea a două sau trei
    dintre evenimentele de transformare 1507, MIR162, MON810 și NK603 în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2021) 5995] (Numai textele în limbile neerlandeză
    și franceză sunt autentice)
