  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/1388, annettu 17 päivänä
    elokuuta 2021, muuntogeenistä maissia 1507 × MIR162 × MON810 × NK603 ja muunnostapahtumista
    1507, MIR162, MON810 ja NK603 kahta tai kolmea yhdistelemällä muodostettua muuntogeenistä
    maissia sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden
    markkinoille saattamisen sallimisesta Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla C(2021) 5995) (Ainoastaan
    hollannin- ja ranskankieliset tekstit ovat todistusvoimaisia)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/1388 оd 17. kolovoza 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    1507 × MIR162 × MON810 × NK603 i genetski modificirani kukuruz koji je kombinacija
    dviju ili triju pojedinačnih promjena 1507, MIR162, MON810 i NK603 ili se sastoje
    ili su proizvedeni od njih, u skladu s Uredbom (EZ) br. 1829/2003 Europskog parlamenta
    i Vijeća (priopćeno pod brojem dokumenta C(2021) 5995) (Vjerodostojni su samo
    tekstovi na francuskom i nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1388 végrehajtási határozata (2021. augusztus
    17.) a géntechnológiával módosított 1507 × MIR162 × MON810 × NK603 kukoricát
    és a géntechnológiával módosított, az 1507, a MIR162, a MON810 és az NK603
    génmódosítási események közül kettőt vagy hármat ötvöző kukoricát
    tartalmazó, abból álló vagy abból előállított termékek forgalomba hozatalának
    az 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2021) 5995. számú dokumentummal történt) (Csak a holland
    és a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1388 della Commissione del 17 agosto
    2021 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato 1507 × MIR162 × MON810 × NK603
    e da granturco geneticamente modificato che combina due o tre dei singoli eventi
    1507, MIR162, MON810 e NK603 in conformità al regolamento (CE) n. 1829/2003 del
    Parlamento europeo e del Consiglio [notificata con il numero C(2021)5995] (I testi
    in lingua francese e neerlandese sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1388 (2021. gada 17. augusts),
