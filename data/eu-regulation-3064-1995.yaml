title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3064/95 of 22 December 1995 providing for the
    adjustment, as an autonomous and transitional measure, of concessions for certain
    processed agricultural products provided for in the Europe Agreements to take
    account of the Agreement on Agriculture concluded during the Uruguay Round Multilateral
    Trade Negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3064/95 du Conseil, du 22 décembre 1995, prévoyant
    l'adaptation autonome et transitoire des concessions pour certains produits agricoles
    transformés prévues par les accords européens afin de tenir compte de l'accord
    sur l'agriculture conclu dans le cadre des négociations commerciales multilatérales
    du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3064/95 des Rates vom 22. Dezember 1995 zur vorübergehenden
    autonomen Anpassung von in den Europa-Abkommen vorgesehenen Zugeständnissen für
    bestimmte landwirtschaftliche Verarbeitungserzeugnisse, um dem im Rahmen der multilateralen
    Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkommen über die
    Landwirtschaft Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3064/95 af 22. december 1995 om autonom og
    midlertidig tilpasning af indrømmelser for visse forarbejdede landbrugsprodukter
    i Europaaftalerne for at tage hensyn til den landbrugsaftale, som er indgået
    under de multilaterale handelsforhandlinger i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3064/95 του Συμβουλίου
    της 22ας Δεκεμβρίου 1995 για αυτόνομη και μεταβατική
    προσαρμογή των παραχωρήσεων για ορισμένα μεταποιημένα
    γεωργικά προϊόντα που προβλέπονται στις ευρωπαϊκές
    συμφωνίες προκειμένου να ληφθεί υπόψη η συμφωνία
    για τη γεωργία που έχει συναφθεί στο πλαίσιο
    των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3064/95, annettu 22 päivänä joulukuuta 1995,
    Eurooppa-sopimuksissa määrättyjen maataloutta koskevien tiettyjen jalostettujen
    maataloustuotteiden myönnytysten autonomisesta ja väliaikaisesta mukauttamisesta,
    ottaen huomioon Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdyn
    maataloussopimuksen
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3064/95 del Consiglio, del 22 dicembre 1995, che stabilisce
    l'adeguamento autonomo e transitorio di concessioni per taluni prodotti agricoli
    trasformati previste dagli accordi europei al fine di tener conto dell'accordo
    sull'agricoltura concluso nel quadro dei negoziati commerciali multilaterali dell'Uruguay
    Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3064/95 van de Raad van 22 december 1995 houdende,
    in verband met de in het kader van de multilaterale handelsbesprekingen van de
    Uruguay-Ronde gesloten Overeenkomst inzake de landbouw, een autonome en tijdelijke
    aanpassing van in de Europa-Overeenkomsten opgenomen concessies voor bepaalde
    verwerke landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3064/95 do Conselho, de 22 de Dezembro de 1995, que
    prevê a adaptação autónoma e transitória de concessões para certos produtos
    agrícolas transformados previstas nos acordos europeus a fim de ter em conta
    o acordo sobre a agricultura celebrado no âmbito das negociações do «Uruguay
    Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3064/95 del Consejo, de 22 diciembre de 1995, por el
    que se adaptan, con carácter autónomo y transitorio, concesiones para determinados
    productos agrícolas transformados previstos en los Acuerdos Europeos a fin de
    tener en cuenta lo establecido en el Acuerdo sobre agricultura celebrado en el
    marco de las negociaciones comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3064/95 av den 22 december 1995 om autonom
    anpassning, under en övergångsperiod, av koncessioner för vissa bearbetade
    jordbruksprodukter som föreskrivs i Europaavtalen, i syfte att beakta det avtal
    om jordbruk som ingåtts inom ramen för de multilaterala handelsförhandlingarna
    under Uruguayrundan
