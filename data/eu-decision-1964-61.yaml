  content: Décision du Conseil n° 64/61/CEE, du 25 janvier 1964, portant prorogation
    de l'autorisation accordée au Royaume de Belgique de limiter les exportations
    de porcs et de viande de porc à destination des États membres
  type: main
- language: de
  script: Latn
  content: '64/61/EWG: Entscheidung des Rats vom 25. Januar 1964 zur Verlängerung
    der Ermächtigung des Königreichs Belgien, die Ausfuhr von Schweinen und Schweinefleisch
    nach den Mitgliedstaaten zu beschränken'
  type: main
- language: it
  script: Latn
  content: '64/61/CEE: Decisione del Consiglio, del 25 gennaio 1964, che proroga l''autorizzazione
    accordata al Regno del Belgio a limitare le esportazione di suini e di carni suine
    verso gli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/61/EEG: Beschikking van de Raad van 25 januari 1964 tot verlenging
    van de geldigheidsduur van de aan het Koninkrijk België verleende machtiging
    om de uitvoer van varkens en varkensvlees naar de Lid-Staten te beperken'
