---
id: EUDecision1978449
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 April 1978 authorizing the French Republic not
    to apply Community treatment to toys of wood and other (except motors and movement
    mechanisms for toys and working models used for recreational purposes and parts
    thereof) falling within subheading 97.03 A or ex B of the Common Customs Tariff,
    originating in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/449/CEE: Décision de la Commission, du 28 avril 1978, autorisant la
    République française à exclure du traitement communautaire les jouets en bois
    et autres, à l''exception des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées, des sous-positions 97.03
    A et 97.03 Ex B du Tarif douanier commun, originaires de Taiwan et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. April 1978, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches Spielzeug aus Holz (mit Ausnahme der Motoren und
    Bewegungsmechanismen für Spielzeug und Modelle zum Spielen sowie deren Ersatzteile)
    der Tarifstellen 97.03 A und ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 28. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage legetøj af træ eller andre
    materialer (bortset fra motorer og bevægelsesmekanismer til legetøj og modeller
    samt dele hertil), som henhører under pos. 97.03 A og ex B i den fælles toldtarif,
    har oprindelse i Taiwan, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i giocattoli in legno ed altri
    (eccetto i motori e i meccanismi di animazione per giocattoli e modelli ridotti
    ed i loro pezzi staccati) delle sottovoci 97.03 A ed ex B della tariffa doganale
    comune, originari di Taiwan e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 april 1978 waarbij de Franse Republiek
    wordt gemachtigd speelgoed van hout en andere (met uitzondering van motoren en
    bewegingsmechanismen voor speelgoed en modellen op schaal alsmede hun onderdelen),
    van de posten 97.03 A en ex B van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
