id: EUDecision1980252
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/252/EEC: Commission Decision of 22 February 1980 accepting undertakings
    given by exporters in Bulgaria, Czechoslovakia, the German Democratic Republic,
    Hungary, Poland and Romania in connection with the anti-dumping proceeding concerning
    imports of standardized electric multi-phase motors having an output of more than
    0*75 kW but not more than 75 kW, originating in those countries, and terminating
    the procedure in respect of them'
  type: main
- language: fr
  script: Latn
  content: '80/252/CEE: Décision de la Commission, du 22 février 1980, portant acceptation
    des engagements souscrits par les exportateurs de Bulgarie, de Hongrie, de Pologne,
    de République démocratique allemande, de Roumanie et de Tchécoslovaquie, dans
    le cadre de la procédure anti-"dumping" concernant les importations de moteurs
    électriques polyphasés normalisés d'' une puissance de plus de 0,75 à 75 kilowatts
    inclus, originaires de ces pays et portant clôture de cette procédure à leur
    égard'
  type: main
- language: de
  script: Latn
  content: '80/252/EWG: Beschluß der Kommission vom 22. Februar 1980 über die Annahme
    von Verpflichtungen, die die Ausführer Bulgariens, Ungarns, Polens, der Deutschen
    Demokratischen Republik, Rumäniens und der Tschechoslowakei im Rahmen des Antidumpingverfahrens
    betreffend Mehrphasen-Wechselstrommotoren mit einer Leistung von mehr als 0,75
    kW bis 75 kW mit Ursprung in diesen Ländern eingegangen sind, und über die Einstellung
    dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/252/EØF: Kommissionens afgørelse af 22. februar 1980 om godtagelse
    af tilsagn afgivet af eksportørerne i Bulgarien, Den tyske demokratiske Republik,
    Polen, Rumænien, Tjekkoslovakiet og Ungarn i forbindelse med antidumpingsproceduren
    vedrørende indførsel af standardiserede elektriske motorer, flerfasede, med
    effekt på over 0,75 kW, men højst 75 kW, med oprindelse i disse lande og om
    afslutning af denne procedure for disse landes vedkommende'
  type: main
- language: el
  script: Grek
  content: '80/252/ΕΟΚ: Απόφαση τής Επιτροπής τής 22ας
    Φεβρουαρίου 1980 περί αποδοχής τών δεσμεύσεων
    πού έχουν αναληφθεί από τούς εξαγωγείς τής
    Βουλγαρίας, τής Ουγγαρίας, τής Πολωνίας, τής
    Λαϊκής Δημοκρατίας τής Γερμανίας, τής Ρουμανίας
    καί τής Τσεχοσλοβακίας στό πλαίσιο τής διαδικασίας
    αντιντάμπινγκ πού αφορά τίς εισαγωγές τυποποιημένων
    ηλεκτρικών πολυφασικών κινητήρων, ισχύος μεγαλύτερης
    τών 0,75 καί μέχρι 75 Κιλοβάτ (συμπεριλαμβανομένης),
    καταγωγής τών χωρών αυτών καί περί περατώσεως
    τής διαδικασίας έναντι αυτών'
  type: main
- language: it
  script: Latn
  content: '80/252/CEE: Decisione della Commissione, del 22 febbraio 1980, recante
    accettazione degli impegni assunti dagli esportatori della Bulgaria, dell'' Ungheria,
    della Polonia, della Repubblica democratica tedesca, della Romania e della Cecoslovacchia,
    nell'' ambito della procedura "antidumping" relativa alle importazioni di motori
    elettrici polifase normalizzati, di potenza superiore a 0,75 kW e inferiore o
    pari a 75 kW, originari di questi paesi, e recante conclusione di detta procedura
    nei loro confronti'
  type: main
- language: nl
  script: Latn
  content: '80/252/EEG: Besluit van de Commissie van 22 februari 1980 houdende aanvaarding
    van de verbintenissen die door de exporteurs van Bulgarije, Hongarije, Polen,
    de Duitse Democratische Republiek, Roemenië en Tsjechoslowakije zijn aangegaan
    in het kader van de antidumpingprocedure betreffende de invoer van gestandaardiseerde
    meerfasige elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75kW,
    van oorsprong uit deze landen, en houdende beëindiging van deze procedure ten
    aanzien van eerder genoemde landen'
  type: main
