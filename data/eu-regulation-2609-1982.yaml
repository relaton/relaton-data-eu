title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2609/82 of 29 September 1982 re-establishing
    the levying of customs duties on citric acid, falling within subheading 29.16
    A IV a) and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 applyn
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2609/82 de la Commission, du 29 septembre 1982, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    citrique, de la sous-position 29.16 A IV a) du tarif douanier commun, originaire
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2609/82 der Kommission vom 29. September 1982 zur
    Wiedereinführung der Erhebung der Zölle für Zitronensäure der Tarifstelle
    29.16 A IV a), mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3601/81
    des Rates vorgesehenen Zollpräferenzen gewährt werdeni
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2609/82 af 29. september 1982 om genindførelse
    af opkrævning af told for citronsyre henhørende under pos. 29.16 A IV a) og
    med oprindelse i Mexico, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
