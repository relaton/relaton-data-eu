    τής διακρίσεως 29. 16 Α IV α) τού Κοινού Δασμολογίου,
    καταγωγής Μεξικού, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2609/82 della Commissione, del 29 settembre 1982,
