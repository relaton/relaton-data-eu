title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2694/87 of 7 September 1987 re-establishing
    the levying of customs duties on gelatin and gelatin derivatives falling within
    subheading 35.03 ex B, originating in Colombia and Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2694/87 de la Commission du 7 septembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés de la sous-position 35.03 ex B du tarif douanier commun, originaires
    de la Colombie et du Brésil, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2694/87 der Kommission vom 7. September 1987 zur Wiedereinführung
    der Erhebung der Zölle für Gelatine und ihre Derivate der Tarifstelle 35.03
    ex B des Gemeinsamen Zolltarifs mit Ursprung in Kolumbien und Brasilien, denen
    die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2694/87 af 7. september 1987 om genindførelse
    af opkrævning af told for gelatine og derivater deraf, henhørende under pos.
    35.03 ex B i den fælles toldtarif og med oprindelse i Colombia og Brasilien,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2694/87 της Επιτροπής
