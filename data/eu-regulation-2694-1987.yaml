    derivados, da subposição 35.03 ex B da pauta aduaneira comum, originários da
    Colômbia e do Brasil, beneficiários das preferências pautais previstas pelo
    Regulamento (CEE) n.° 3924/86 do Conselho
  type: main
- language: es
