    τα παράγωγα αυτών της διάκρισης 35.03 ex B του κοινού
    δασμολογίου, καταγωγής Κολομβίας και Βραζιλίας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2694/87 della Commissione del 7 settembre 1987 che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e loro derivati,
    della sottovoce 35.03 ex B della tariffa doganale comune, originari della Colombia
    e del Brasile beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2694/87 van de Commissie van 7 september 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan, van postonderverdeling 35.03 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit Colombia en Brazilië, waarvoor de in Verordening
    (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2694/87 da Comissão de 7 de Setembro de 1987 que
