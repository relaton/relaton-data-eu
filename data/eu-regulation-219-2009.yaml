type: standard
title:
- language: en
  script: Latn
  content: Regulation (EC) No 219/2009 of the European Parliament and of the Council
    of 11 March 2009 adapting a number of instruments subject to the procedure referred
    to in Article 251 of the Treaty to Council Decision 1999/468/EC with regard to
    the regulatory procedure with scrutiny — Adaptation to the regulatory procedure
    with scrutiny — Part Two
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 219/2009 du Parlement européen et du Conseil du 11
    mars 2009 portant adaptation à la décision 1999/468/CE du Conseil de certains
    actes soumis à la procédure visée à l'article 251 du traité, en ce qui concerne
    la procédure de réglementation avec contrôle — Adaptation à la procédure
    de réglementation avec contrôle — deuxième partie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 219/2009 des Europäischen Parlaments und des Rates
    vom 11. März 2009 zur Anpassung einiger Rechtsakte, für die das Verfahren des
    Artikels 251 des Vertrags gilt, an den Beschluss 1999/468/EG des Rates in Bezug
    auf das Regelungsverfahren mit Kontrolle — Anpassung an das Regelungsverfahren
    mit Kontrolle — Zweiter Teil
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 219/2009 на Европейския парламент
    и на Съвета от 11 март 2009 година за адаптиране
    към Решение 1999/468/ЕО на Съвета на някои актове,
    за които се прилага процедурата, предвидена
    в член 251 от Договора, във връзка с процедурата
    по регулиране с контрол — Адаптиране към процедурата
    по регулиране с контрол — втора част
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 219/2009 ze dne 11.
    března 2009 o přizpůsobení některých aktů přijatých postupem podle článku
    251 Smlouvy regulativnímu postupu s kontrolou podle rozhodnutí Rady 1999/468/ES
    – Přizpůsobení regulativnímu postupu s kontrolou – Část druhá
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 219/2009 af 11. marts
    2009 om tilpasning til Rådets afgørelse 1999/468/EF af visse retsakter, der
    er omfattet af proceduren i traktatens artikel 251, for så vidt angår forskriftsproceduren
    med kontrol — Tilpasning til forskriftsproceduren med kontrol — Del To
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 219/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, της 11ης Μαρτίου
    2009 , για την προσαρμογή στην απόφαση 1999/468/ΕΚ
    του Συμβουλίου, ορισμένων πράξεων που υπόκεινται
    στη διαδικασία του άρθρου 251 της συνθήκης, όσον
    αφορά την κανονιστική διαδικασία με έλεγχο
    — Προσαρμογή στην κανονιστική διαδικασία
    με έλεγχο — Μέρος Δεύτερο
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EÜ) nr 219/2009, 11. märts 2009
    , millega kohandatakse teatavaid asutamislepingu artiklis 251 sätestatud menetluse
    kohaseid õigusakte otsusega 1999/468/EÜ kontrolliga regulatiivmenetluse osas
    - Kontrolliga regulatiivmenetlusega kohandamine – 2. osa
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EY) N:o 219/2009, annettu 11
    päivänä maaliskuuta 2009 , eräiden perustamissopimuksen 251 artiklassa määrätyn
    menettelyn mukaisten säädösten mukauttamisesta neuvoston päätökseen 1999/468/EY
    valvonnan käsittävän sääntelymenettelyn osalta — Valvonnan käsittävään
    sääntelymenettelyyn mukauttaminen — Toinen osa
  type: main
- language: ga
  script: Latn
  content: Rialachán (CE) Uimh. 219/2009 ó Pharlaimint na hEorpa agus ón gComhairle
    an 11 Márta 2009 lena ndéantar líon áirithe ionstraimí atá faoi réir an
    nós imeachta dá dtagraítear in Airteagal 251 den Chonradh a oiriúnú do Chinneadh
    1999/468/CE ón gComhairlemaidir leis an nós imeachta rialúcháin lena ngabhann
    grinnscrúdú Oiriúnú don nós imeachta rialúcháin lena ngabhann grinnscrúdú
    – Cuid A Dó
  type: main
- language: hr
  script: Latn
  content: Uredba (EZ) br. 219/2009 Europskog parlamenta i Vijeća od 11. ožujka
    2009. o prilagodbi većeg broja instrumenata koji podliježu postupku iz članka
    251. Ugovora Odluci Vijeća 1999/468/EZ, s obzirom na regulatorni postupak s kontrolom
    Prilagodba regulatornom postupku s kontrolom — drugi dio
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 219/2009/EK rendelete ( 2009. március
    11. ) a Szerződés 251. cikkében meghatározott eljárás alá tartozó egyes
    jogi aktusoknak az ellenőrzéssel történő szabályozási bizottsági eljárás
    tekintetében történő, az 1999/468/EK tanácsi határozat szerinti kiigazításáról
    – Az ellenőrzéssel történő szabályozási bizottsági eljáráshoz történő
    hozzáigazítás – Második rész
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 219/2009 del Parlamento europeo e del Consiglio, dell’
    11 marzo 2009 , che adegua alla decisione 1999/468/CE del Consiglio determinati
    atti soggetti alla procedura di cui all’articolo 251 del trattato, per quanto
    riguarda la procedura di regolamentazione con controllo — Adeguamento alla procedura
    di regolamentazione con controllo — parte seconda
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 219/2009 ( 2009. gada 11.
    marts ), ar ko, ievērojot Līguma 251. pantā minēto procedūru, vairākus instrumentus
    pielāgo Padomes Lēmumam 1999/468/EK attiecībā uz regulatīvo kontroles procedūru
    – Pielāgošana regulatīvajai kontroles procedūrai – otrā daļa
  type: main
- language: lt
  script: Latn
  content: 2009 m. kovo 11 d. Europos Parlamento ir Tarybos reglamentas (EB) Nr. 219/2009
    dėl kai kurių teisės aktų, kuriems galioja Sutarties 251 straipsnyje nustatyta
    tvarka, nuostatų, susijusių su reguliavimo procedūra su tikrinimu, suderinimo
    su Tarybos sprendimu 1999/468/EB – Suderinimas su reguliavimo procedūra su
    tikrinimu. Antroji dalis
  type: main
- language: mt
  script: Latn
  content: Regolament (KE) Nru 219/2009 tal-Parlament Ewropew u tal-Kunsill tal- 11
    ta' Marzu 2009 li jadatta numru ta' atti soġġetti għall-proċedura msemmija
    fl-Artikolu 251 tat-Trattat mad-Deċiżjoni tal-Kunsill 1999/468/KE fir-rigward
    tal-proċedura regolatorja bi skrutinju – Adattament għall-proċedura regolatorja
    bi skrutinju – Parti Tnejn
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 219/2009 van het Europees Parlement en de Raad van
    11 maart 2009 tot aanpassing aan Besluit 1999/468/EG van de Raad van een aantal
    besluiten waarop de procedure van artikel 251 van het Verdrag van toepassing is,
    wat de regelgevingsprocedure met toetsing betreft — Aanpassing aan de regelgevingsprocedure
    met toetsing — Deel twee
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (WE) nr 219/2009 z dnia
    11 marca 2009 r. dostosowujące do decyzji Rady 1999/468/WE niektóre akty podlegające
    procedurze, o której mowa w art. 251 Traktatu, w zakresie procedury regulacyjnej
    połączonej z kontrolą – Dostosowanie do procedury regulacyjnej połączonej
    z kontrolą – Część druga
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 219/2009 do Parlamento Europeu e do Conselho, de
    11 de Março de 2009 , que adapta à Decisão 1999/468/CE do Conselho certos actos
    sujeitos ao procedimento previsto no artigo 251. o do Tratado, no que se refere
    ao procedimento de regulamentação com controlo — Adaptação ao procedimento
    de regulamentação com controlo — Segunda Parte
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 219/2009 al Parlamentului European și al Consiliului
    din 11 martie 2009 de adaptare la Decizia 1999/468/CE a Consiliului, a unor acte
    care fac obiectul procedurii menționate la articolul 251 din tratat, în ceea
    ce privește procedura de reglementare cu control – Adaptare la procedura de
    reglementare cu control – Partea a doua
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (ES) č. 219/2009 z 11. marca
    2009 o prispôsobení určitých nástrojov, na ktoré sa vzťahuje postup uvedený
    v článku 251 zmluvy, rozhodnutiu Rady 1999/468/ES, pokiaľ ide o regulačný
    postup s kontrolou – Prispôsobenie právnych aktov regulačnému postupu s
    kontrolou – druhá časť
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 219/2009 Evropskega parlamenta in Sveta z dne 11. marca
    2009 o prilagoditvi nekaterih aktov, za katere se uporablja postopek iz člena
    251 Pogodbe, Sklepu Sveta 1999/468/ES glede regulativnega postopka s pregledom
    — Prilagoditve regulativnemu postopku s pregledom – Drugi del
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 219/2009 del Parlamento Europeo y del Consejo, de 11
    de marzo de 2009 , por el que se adaptan a la Decisión 1999/468/CE del Consejo
    determinados actos sujetos al procedimiento establecido en el artículo 251 del
    Tratado, en lo que se refiere al procedimiento de reglamentación con control
    — Adaptación al procedimiento de reglamentación con control — Segunda parte
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 219/2009 av den 11 mars
    2009 om anpassning till rådets beslut 1999/468/EG av vissa rättsakter som omfattas
    av det förfarande som anges i artikel 251 i fördraget, med avseende på det
    föreskrivande förfarandet med kontroll. Anpassning till det föreskrivande förfarandet
    med kontroll – Del två
  type: main
