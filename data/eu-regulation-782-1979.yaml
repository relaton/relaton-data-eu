schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 782/79 of 19 April 1979 re-establishing
    the levying of customs duties on woven fabrics of regenerated textile fibres,
    falling within subheading 56.07 B and originating in developing countries, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 782/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles, de la sous-position tarifaire 56.07 B, originaires
    des pays et territoires en voie de développement bénéficiaires de préférences
    tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 782/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Gewebe aus künstlichen Spinnfasern der Tarifstelle 56.07
    B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 782/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af regenererede fibre, under underposition
    56.07 B, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 782/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    artificiali della sottovoce doganale 56.07 B, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 782/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van kunstmatige vezels, van post 56.07 B, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3157/78 van de Raad tariefpreferenties
    werden geopend
  type: main
