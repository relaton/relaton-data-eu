title:
- language: en
  script: Latn
  content: '78/980/EEC: Commission Decision of 15 November 1978 authorizing the French
    Republic not to apply Community treatment to bed linen, table linen, toilet linen
    and kitchen linen, falling within heading No ex 62.02 of the Common Customs Tariff,
    originating in Czechoslovakia and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/980/CEE: Décision de la Commission, du 15 novembre 1978, autorisant
    la République française à exclure du traitement communautaire le linge de table,
    de lit, de toilette, d'' office ou de cuisine, de la position ex 62.02 du tarif
    douanier commun, originaire de Tchécoslovaquie et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/980/EWG: Entscheidung der Kommission vom 15. November 1978, mit der
    die Französische Republik ermächtigt wird, aus der Tschechoslowakei stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Bettwäsche,
    Tischwäsche, Wäsche zur Körperflege und andere Haushaltswäsche, der Tarifnummer
    ex 62.02 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/980/EØF: Kommissionens beslutning af 15. november 1978 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage sengelinned,
    dækketøj, håndklæder, vaskeklude og viskestykker, som henhører under pos.
    ex 62.02 i den fælles toldtarif, har oprindelse i Tjekkoslovakiet og frit kan
    omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/980/CEE: Decisione della Commissione, del 15 novembre 1978, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario biancheria da
    letto, da tavola, da toletta, da servizio o da cucina, della voce ex 62.02 della
    tariffa doganale comune, originaria della Cecoslovacchia e messa in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/980/EEG: Beschikking van de Commissie van 15 november 1978 waarbij
    de Franse Republiek wordt gemachtigd tafel-, bedde- en huishoudlinnen van post
    ex 62.02 van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
