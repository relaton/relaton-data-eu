    für den Verkauf von Brotweichweizen aus Beständen der deutschen Interventionsstelle
    zur Ausfuhr in die AKP-Länder im Wirtschaftsjahr 1998/99
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 727/1999 af 7. april 1999 om ændring
