    pour la vente de blé tendre panifiable détenu par l'organisme d'intervention
    allemand et destiné à être exporté vers certains pays ACP au cours de la campagne
    1998/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 727/1999 der Kommission vom 7. April 1999 zur Änderung
