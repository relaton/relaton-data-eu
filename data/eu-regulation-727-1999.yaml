title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 727/1999 of 7 April 1999 amending Regulation
    (EC) No 533/1999 increasing to 200 252 tonnes the quantity of common wheat of
    breadmaking quality held by the German intervention agency for which a standing
    invitation to tender for export to certain ACP countries in the 1998/1999 marketing
    year has been opened
  type: main
- language: fr
  script: Latn
