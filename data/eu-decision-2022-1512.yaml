title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1512 of 7 September 2022 on
    the request for registration of the European citizens’ initiative entitled ‘Every
    European house equipped with 1 kW photovoltaic and 0,6 kW wind turbines using
    EU funding through the municipalities alone’, pursuant to Regulation (EU) 2019/788
    of the European Parliament and of the Council (notified under document C(2022)
    6108) (Only the Romanian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1512 de la Commission du 7 septembre
    2022 relative à la demande d’enregistrement de l’initiative citoyenne européenne
    intitulée «Chaque maison européenne équipée de 1 kW de photovoltaïque et
    de 0,6 kW d’éolien, grâce à l’utilisation des fonds de l’UE et uniquement
    par l’intermédiaire des municipalités», en application du règlement (UE)
    2019/788 du Parlement européen et du Conseil [notifiée sous le numéro C(2022)
    6108] (Le texte en langue roumaine est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1512 der Kommission vom 7. September
    2022 betreffend den Antrag auf Registrierung der Europäischen Bürgerinitiative
    mit dem Titel „Installation einer 1-kW-Photovoltaik-Anlage und einer 0,6-kW-Windkraftanlage
    auf jedem europäischen Haus, finanziert durch EU-Mittel, die in alleiniger Verantwortung
    der Gemeinden verwaltet werden“ gemäß der Verordnung (EU) 2019/788 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2022) 6108) (Nur
    der rumänische Text ist verbindlich)
  type: main
- language: bg
