    под надслов „Всеки европейски дом да се снабди
    с 1 kW от фотоволтаици и 0,6 kW от вятърни турбини
    с финансиране от ЕС само чрез общините“ съгласно
    Регламент (ЕС) 2019/788 на Европейския парламент
    и на Съвета (нотифицирано под номер C(2022) 6108)
    (само текстът на румънски език е автентичен)
