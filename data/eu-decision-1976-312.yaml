title:
- language: en
  script: Latn
  content: Commission Decision of 4 December 1975 concerning the application made
    by the United Kingdom under Article 115 of the Treaty of Rome for authorization
    to apply protective measures in respect of certain products falling within heading
    Nos ex 61.01 and ex 61.02 of the Common Customs Tariff, originating in Hong Kong
    and in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/312/CEE: Décision de la Commission, du 4 décembre 1975, relative
    au recours à l''article 115 du Traité de Rome introduit par le Royaume-Uni,
    visant à l''application des mesures de protection pour certains produits des
    positions Ex 61.01 et Ex 61.02 du Tarif douanier commun, originaires de Hong-Kong
    et mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Dezember 1975 betreffend den Antrag
    des Vereinigten Königreichs auf Anwendung von Artikel 115 des Rom-Vertrags hinsichtlich
    Schutzmaßnahmen bei der Einfuhr von bestimmten aus Hongkong stammenden und in
    der Bundesrepublik Deutschland im freien Verkehr befindlichen Waren der Tarifnummern
    ex 61.01 und ex 61.02 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. december 1975 om den begæring om anvendelse
    af Romtraktatens artikel 115, som Det forenede Kongerige har indgivet, vedrørende
    anvendelse af beskyttelsesforanstaltninger for visse varer, som henhører under
    pos. ex 61.01 og ex 61.02 i den fælles toldtarif, har oprindelse i Hongkong,
    og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 dicembre 1975, relativa al ricorso all'articolo
    115 del trattato di Roma, inoltrato dal Regno Unito, per l'applicazione delle
    misure di salvaguardia per taluni prodotti delle voci ex 61.01 ed ex 61.02 della
    tariffa doganale comune, originari di Hong Kong e messi in libera pratica nella
    Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 december 1975 betreffende het beroep
    van het Verenigd Koninkrijk op artikel 115 van het Verdrag van Rome, met het oog
    op de toepassing van beschermende maatregelen voor bepaalde produkten van de posten
    ex 61.01 en ex 61.02 van het gemeenschappelijk douanetarief, van oorsprong uit
    Hong-Kong en in de Bondsrepubliek Duitsland in het vrije verkeer gebracht
  type: main
