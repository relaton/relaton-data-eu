title:
- language: en
  script: Latn
  content: '81/725/EEC: Commission Decision of 3 August 1981 authorizing the French
    Republic not to apply Community treatment to toys made of wood or other (except
    motors and movement mechanisms for toys and working models used for recreational
    purposes and parts thereof) originating in South Korea and Japan (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/725/CEE: Décision de la Commission, du 3 août 1981, autorisant la
    République française à exclure du traitement communautaire les jouets en bois
    et autres (à l''exclusion des moteurs et mécanismes d''animation pour jouets
    et modèles réduits ainsi que leurs pièces détachées) originaires de la Corée
    du Sud et du Japon (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/725/EWG: Entscheidung der Kommission vom 3. August 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea und Japan stammende Spielzeuge aus
    Holz und andere (mit Ausnahme der Motor- und Bewegungsmechanismen für Spielzeuge
    und Modelle zum Spielen sowie deren Ersatzteile) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/725/EØF: Kommissionens beslutning af 3. august 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage andet legetøj
    af træ (med undtagelse af motorer og bevægelsesmekanismer til legetøj og arbejdsmodeller
    til fritidsbeskæftigelse og dele dertil), men oprindelse i Sydkorea og Japan
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/725/EOK: Απόφαση τής Επιτροπής τής 3ης Αυγούστου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά αθύρματα εκ ξύλου καί άλλα (εκτός τών κινητήρων
    καί μηχανισμών κινήσεως δι αθύρματα καί μικρογραφίας
    μοντέλων καθώς καί τά μεμονωμένα τεμάχια αυτών)
    καταγωγής Νοτίου Κορέας καί Ιαπωνίας (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/725/CEE: Decisione della Commissione, del 3 agosto 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli in
    legno ed altri (eccetto i motori e meccanismi d''animazione per giocattoli e modelli
    ridotti ed i loro pezzi staccati) originari della Corea del Sud e del Giappone
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/725/EEG: Beschikking van de Commissie van 3 augustus 1981 houdende
    machtiging van de Franse Republiek om speelgoed uit hout en ander (met uitzondering
    van animatiemotoren en mechanismen voor speelgoed op schaal alsook hun onderdelen)
    van oorsprong uit Zuid-Korea en Japan van de communautaire behandeling uit te
    sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
