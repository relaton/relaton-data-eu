title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2020/364 of 17 December 2019 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of cadmium in certain radiation tolerant video camera
    tubes
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2020/364 de la Commission du 17 décembre 2019
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du cadmium dans certains tubes analyseurs
    de caméras vidéo résistants aux rayonnements
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2020/364 der Kommission vom 17. Dezember 2019
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für Cadmium in bestimmten strahlungstoleranten
    Bildaufnahmeröhren
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2020/364 на Комисията
    от 17 декември 2019 година за изменение, с цел
    привеждане в съответствие с научно-техническия
    напредък, на приложение IV към Директива 2011/65/ЕС
    на Европейския парламент и на Съвета по отношение
    на освобождаване от ограничението за употребата
    на кадмий в някои устойчиви на лъчение тръби
    за видеокамери
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2020/364 ze dne 17. prosince
    2019, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití kadmia v některých snímačích videokamer odolných
    vůči záření
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv(EU)2020/364 af 17. december 2019 om ændring,
    med henblik på tilpasning til den videnskabelige og tekniske udvikling, af bilag
    IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    en undtagelse for anvendelse af cadmium og cadmiumforbindelser i visse strålingstolerante
    videokamerarør
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (EE) 2020/364 της
    Επιτροπής της 17ης Δεκεμβρίου 2019 για την τροποποίηση,
    με σκοπό την προσαρμογή στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά εξαίρεση για
    τη χρήση καδμίου σε ορισμένες λυχνίες ανθεκτικών
    στην ακτινοβολία βιντεοκαμερών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2020/364, 17. detsember 2019, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, milles käsitletakse kaadmiumi
    kasutamist teatavates kiirgustaluvusega videokaamerate saatetorudes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2020/364, annettu 17 päivänä joulukuuta
    2019, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen tietyissä säteilyä kestävissä
    videokameraputkissa käytettyä kadmiumia koskevan poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2020/364 оd 17. prosinca 2019. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu kadmija u određenim
    cijevima videokamera otpornih na zračenje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/364 felhatalmazáson alapuló irányelve (2019.
    december 17.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítása céljából,
    az egyes sugárzástűrő videókamera-csövekben használt kadmiumra vonatkozó
    mentesség tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2020/364 della Commissione del 17 dicembre 2019
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso di cadmio in determinati tubi da ripresa resistenti
    alle radiazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2020/364 (2019. gada 17. decembris),
    ar ko, pielāgojot zinātnes un tehnikas attīstībai, Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu groza attiecībā uz atbrīvojumu kadmija
    izmantošanai dažos starojumizturīgos videokameru kineskopos
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2020/364 2019 m. gruodžio 17 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties, kuria kadmį leidžiama
    naudoti tam tikrų spinduliuotei atsparių vaizdo kamerų vamzdžiuose, iš dalies
    keičiamas Europos Parlamento ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2020/364 tas-17 ta’ Diċembru
    2019 li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu tal-kadmju u l-komposti tiegħu f’ċerti tubi tal-kameras
    tal-vidjo li huma tolleranti għar-radjazzjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2020/364 van de Commissie van 17 december 2019
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van cadmium in bepaalde
    stralingstolerante videocamerabuizen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2020/364 z dnia 17 grudnia 2019 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania kadmu w niektórych lampach analizujących odpornych na promieniowanie
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2020/364 da Comissão de 17 de dezembro de 2019
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção aplicável à utilização de cádmio em determinados tubos de
    câmaras de vídeo resistentes a radiações
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2020/364 a Comisiei din 17 decembrie 2019 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei IV la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea cadmiului în anumite tuburi pentru camere video tolerante
    la radiații
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2020/364 zo 17. decembra 2019, ktorou
    sa na účely prispôsobenia vedeckému a technickému pokroku mení príloha
    IV k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    týkajúcu sa používania kadmia v určitých snímacích elektrónkach videokamier
    odolných voči žiareniu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2020/364 z dne 17. decembra 2019 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo kadmija v nekaterih na sevanje odpornih snemalnih ceveh video kamer
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2020/364 de la Comisión de 17 de diciembre de
    2019 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo con
    respecto a una exención relativa al uso de cadmio en determinados tubos de cámaras
    de video resistentes a la radiación
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2020/364 av den 17 december 2019
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av kadmium i vissa strålningståliga videokamerarör
