title:
- language: en
  script: Latn
  content: '94/818/EC: Commission Decision of 16 December 1994 amending Decision 93/10/EEC
    establishing implementing provisions for Council Decision 92/481/EEC on the adoption
    of an action plan for the exchange between Member State administrations of national
    officials who are engaged in the implementation of Community legislation required
    to achieve the internal market (Karolus Programme)'
  type: main
- language: fr
  script: Latn
  content: '94/818/CE: Décision de la Commission du 16 décembre 1994 modifiant la
    décision 93/10/CEE, fixant les dispositions d''application de la décision 92/481/CEE
    du Conseil portant adoption d''un plan d''action pour l''échange, entre les administrations
    des États membres, de fonctionnaires nationaux chargés de la mise en oeuvre
    de la législation communautaire nécessaire à la réalisation du marché intérieur
    (programme Karolus)'
  type: main
- language: de
  script: Latn
  content: '94/818/EG: Entscheidung der Kommission vom 16. Dezember 1994 zur Änderung
    der Entscheidung 93/10/EWG zur Festlegung der Durchführungsbestimmungen zu der
    Entscheidung 92/481/EWG des Rates über einen Aktionsplan für den zwischen den
    Verwaltungen der Mitgliedstaaten vorzunehmenden Austausch nationaler Beamter,
    die mit der zur Verwirklichung des Binnenmarktes erforderlichen Durchführung
    des Gemeinschaftsrechts betraut sind (Programm Karolus)'
  type: main
- language: da
  script: Latn
  content: '94/818/EF: Kommissionens beslutning af 16. december 1994 om ændring af
    beslutning 93/10/EØF om fastsættelse af gennemførelsesbestemmelser til Rådets
    beslutning 92/481/EØF om vedtagelse af en handlingsplan for udveksling mellem
    medlemsstaternes forvaltninger af nationale embedsmænd, der har til opgave at
    gennemføre de EF-forskrifter, som er nødvendige for virkeliggørelsen af det
    indre marked (Karolus- programmet)'
  type: main
- language: el
  script: Grek
