    για τον καθορισμό των διατάξεων εφαρμογής
    της απόφασης 92/481/ΕΟΚ του Συμβουλίου για τη
    θέσπιση ενός προγράμματος δράσης σχετικά με
    την ανταλλαγή εθνικών υπαλλήλων μεταξύ των
    διοικήσεων των κρατών μελών, οι οποίοι είναι
    επιφορτισμένοι με την εφαρμογή της κοινοτικής
    νομοθεσίας που απαιτείται για την υλοποίηση
    της εσωτερικής αγοράς (πρόγραμμα Karolus)'
  type: main
