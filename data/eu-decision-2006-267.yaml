  script: Latn
  content: Rozhodnutie Politického a bezpečnostného výboru BiH/8/2006 z 15. marca
    2006 , ktorým sa mení a dopĺňa rozhodnutie Politického a bezpečnostného
    výboru BiH/1/2004 o prijatí príspevkov tretích štátov na vojenskú operáciu
