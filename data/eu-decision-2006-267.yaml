    műveletéhez történő hozzájárulása elfogadásáról szóló BiH/1/2004
    határozat és az Európai Uniónak Bosznia és Hercegovinában folytatott katonai
    művelete tekintetében a hozzájáruló felek bizottsága létrehozásáról
    szóló BiH/3/2004 határozat módosításáról
  type: main
- language: it
  script: Latn
