    per l'operazione militare dell'Unione europea in Bosnia-Erzegovina
  type: main
- language: lv
  script: Latn
  content: Politikas un drošības komitejas Lēmums BiH/8/2006 ( 2006. gada 15. marts
    ), ar kuru groza Lēmumu BiH/1/2004, ar ko pieņem trešo valstu palīdzību attiecībā
    uz Eiropas Savienības militāro operāciju Bosnijā un Hercegovinā, un Lēmumu
    BiH/3/2004 par Eiropas Savienības militārās operācijas Bosnijā un Hercegovinā
    līdzdalībnieku komitejas izveidi
  type: main
- language: lt
  script: Latn
  content: 2006 m. kovo 15 d. Politinio ir saugumo komiteto sprendimas BiH/8/2006,
    iš dalies keičiantis Sprendimą BiH/1/2004 dėl trečiųjų valstybių įnašo
    į Europos Sąjungos karinę operaciją Bosnijoje ir Hercegovinoje priėmimo ir
    Sprendimą BiH/3/2004 dėl prie Europos Sąjungos karinės operacijos Bosnijoje
    ir Hercegovinoje prisidedančių valstybių komiteto įsteigimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kumitat Politiku u ta' Sigurtà BiH/8/2006 tal- 15 ta'
