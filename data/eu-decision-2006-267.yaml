    ta' Stati terzi għall-operazzjoni militari ta' l-Unjoni Ewropea fil-Bosnia u
    Ħerzegovina u d-Deċiżjoni BiH/3/2004 dwar it-twaqqif tal-Kumitat ta' Kontributuri
