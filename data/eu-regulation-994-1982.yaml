title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 994/82 of 29 April 1982 reducing the quantities
    of table wine covered by the contracts and declarations relating to the distillation
    operations referred to in Regulation (EEC) No 701/82
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 994/82 de la Commission, du 29 avril 1982, portant
    réduction des quantités de vin de table figurant dans les contrats et déclarations
    souscrits en vue des opérations de distillation visées au règlement (CEE) n°
    701/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 994/82 der Kommission vom 29. April 1982 zur Verringerung
    der Tafelweinmengen, die in den im Hinblick auf die Destillation nach Verordnung
    (EWG) Nr. 701/82 unterzeichneten Verträgen und Erklärungen angegeben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 994/82 af 29. april 1982 om nedsættelse
    af de mængder bordvin, der er anført i de kontrakter og erklæringer, som er
    undertegnet med henblik på den i forordning (EØF) nr. 701/82 omhandlede distillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 994/82 τής Επιτροπής τής
    29ης Απριλίου 1982 περί μειώσεως τών ποσοτήτων
    επιτραπεζίου οίνου πού αναγράφονται στά συμφωνητικά
    καί στίς δηλώσεις πού υπογράφηκαν γιά τίς εργασίες
    αποστάξεως πού αναφέρονται στόν κανονισμό
    (EOK) αριθ. 701/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 994/82 della Commissione, del 29 aprile 1982, relativo
    alla riduzione dei quantitativi di vini da tavola che figurano nei contratti e
    nelle dichiarazioni sottoscritti per le operazioni di distillazione previste dal
    regolamento (CEE) n. 701/82
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 994/82 van de Commissie van 29 april 1982 houdende
    verlaging van de hoeveelheden tafelwijn die zijn vermeld in de contracten en verklaringen
    met het oog op de in Verordening (EEG) nr. 701/82 bedoelde distillatie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 994/82 da Comissão, de 29 de Abril de 1982, que
    estabelece a redução das quantidades de vinho de mesa que constam dos contratos
    e declarações subscritos, tendo em vista as operações de destilação referidas
    no Regulamento (CEE) n.° 701/82
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 994/82 de la Comisión, de 29 de abril de 1982, por
    el que se reducen las cantidades de vino de mesa que figuran en los contratos
    y declaraciones suscritos con ocasión de las operaciones de destilación mencionadas
    en el Reglamento (CEE) n° 701/82
  type: main
