title:
- language: en
  script: Latn
  content: '70/307/EEC: Commission Decision of 3 June 1970 authorizing the Kingdom
    of the Netherlands to approve for marketing seed of Pseudotsuga menziesii (Mirb.)
    Franco. and Picea sitchensis Trautv. and Mey., satisfying less stringent requirements
    (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/307/CEE: Décision de la Commission, du 3 juin 1970, autorisant le
    Royaume des Pays-Bas à admettre à la commercialisation des semences de Pseudotsuga
    menziesii (Mirb.) Franco. et de Picea sitchensis Trautv. et Mey., soumises à
    des exigences réduites (Le texte en langue néerlandaise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '70/307/EWG: Entscheidung der Kommission vom 3. Juni 1970, mit der das
    Königreich der Niederlande ermächtigt wird, Saatgut von Pseudotsuga menziesii
    (Mirb.) Franco. und von Picea sitchensis Trautv. und Mey. mit minderen Anforderungen
    zum gewerbsmäßigen Verkehr zuzulassen (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '70/307/EØF: Kommissionens beslutning af 3. juni 1970 om bemyndigelse
    af kongeriget Nederlandene til at tillade handel med frø af Pseudotsuga menziesii
    (Mirb.) Franco. og af Picea sitchensis Trautv. og Mey., der opfylder mindre strenge
    krav (Kun den nederlandske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '70/307/CEE: Decisione della Commissione, del 3 giugno 1970, che autorizza
    il Regno dei Paesi Bassi ad ammettere alla commercializzazione le sementi di Pseudortsuga
    menziesii (Mirb.) Franco. e di Picea sitchensis Trautv. e Mey., sottoposte a requisiti
    ridotti (Il testo in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '70/307/EEG: Beschikking van de Commissie van 3 juni 1970 houdende machtiging
    van het Koninkrijk der Nederlanden om zaden van Pseudotsuga menziesii (Mirb.)
    Franco. en Picea sitchensis Trautv. en Mey., waaraan minder strenge eisen zijn
    gesteld, tot de handel toe te laten (Slechts de tekst in de Nederlandse taal is
    authentiek)'
