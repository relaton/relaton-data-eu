    Schadorganismen der Pflanzen oder Pflanzenerzeugnisse in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/393/EØF af 18. marts 1980 om ændring af bilagene
    til direktiv 77/93/EØF om foranstaltninger mod indslæbning i medlemsstaterne
    af skadegørere på planter eller planteprodukter
  type: main
