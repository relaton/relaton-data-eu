    έναντι της εισαγωγής στα κράτη μέλη επιβλαβών
    οργανισμών των φυτών ή φυτικών προϊόντων»
  type: main
- language: it
  script: Latn
  content: Direttiva 80/393/CEE del Consiglio, del 18 marzo 1980, che modifica gli
