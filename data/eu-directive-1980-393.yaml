    l'introduzione negli Stati Membri di organismi nocivi ai vegetali o ai prodotti
    vegetali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 80/393/EEG van de Raad van 18 maart 1980 tot wijziging van de
    bijlagen van Richtlijn 77/93/EEG betreffende de beschermende maatregelen tegen
    het binnenbrengen op het grondgebied van de Lid-Staten van voor planten of voor
    plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Directiva 80/393/CEE do Conselho, de 18 de Março de 1980, que altera os
