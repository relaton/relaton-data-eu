    of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Directive 80/393/CEE du Conseil, du 18 mars 1980, modifiant les annexes
    de la directive 77/93/CEE concernant les mesures de protection contre l'introduction
    dans les États membres d'organismes nuisibles aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/393/EWG des Rates vom 18. März 1980 zur Änderung der Anhänge
