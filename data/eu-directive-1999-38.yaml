title:
- language: en
  script: Latn
  content: Council Directive 1999/38/EC of 29 April 1999 amending for the second time
    Directive 90/394/EEC on the protection of workers from the risks related to exposure
    to carcinogens at work and extending it to mutagens
  type: main
- language: fr
  script: Latn
  content: Directive 1999/38/CE du Conseil du 29 avril 1999 modifiant pour la deuxième
    fois la directive 90/394/CEE concernant la protection des travailleurs contre
    les risques liés à l'exposition à des agents cancérigènes au travail, et
    l'étendant aux agents mutagènes
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/38/EG des Rates vom 29. April 1999 zur zweiten Änderung
    der Richtlinie 90/394/EWG über den Schutz der Arbeitnehmer gegen Gefährdung
    durch Karzinogene bei der Arbeit und zu ihrer Ausdehnung auf Mutagene
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 1999/38/ES ze dne 29. dubna 1999, kterou se podruhé mění
    směrnice 90/394/EHS o ochraně zaměstnanců před riziky spojenými s expozicí
    karcinogenům při práci a rozšiřuje se na mutageny
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 1999/38/EF af 29. april 1999 om anden ændring af direktiv
    90/394/EØF om beskyttelse af arbejdstagerne mod risici for under arbejdet at
    være udsat for kræftfremkaldende stoffer og om udvidelse heraf til også at
    omfatte mutagener
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/38/ΕΚ του Συμβουλίου της 29ης Απριλίου
    1999 για τη δεύτερη τροποποίηση της οδηγίας 90/394/ΕΟΚ
    σχετικά με την προστασία των εργαζομένων από
    τους κινδύνους που έχουν σχέση με την έκθεση
    σε καρκινογόνους παράγοντες κατά την εργασία
    και για την επέκτασή της ώστε να καλύπτει και
    τους μεταλλαξιογόνους παράγοντες
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 1999/38/EÜ, 29. aprill 1999, millega teist korda muudetakse
    direktiivi 90/394/EMÜ töötajate kaitsmise kohta tööl kantserogeenidega kokkupuutest
    tulenevate ohtude eest ja laiendatakse selle kohaldamisala mutageenidele
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 1999/38/EY, annettu 29 päivänä huhtikuuta 1999,
    työntekijöiden suojelemisesta syöpäsairauden vaaraa aiheuttaville tekijöille
    altistumiseen työssä liittyviltä vaaroilta annetun direktiivin 90/394/ETY muuttamisesta
    toisen kerran ja sen soveltamisalan laajentamisesta perimän muutoksia aiheuttaviin
    aineisiin
  type: main
- language: hu
  script: Latn
  content: A Tanács 1999/38/EK irányelve (1999. április 29.) a munkájuk során
    rákkeltő anyagokkal kapcsolatos kockázatoknak kitett munkavállalók védelméről
    szóló 90/394/EGK irányelv második módosításáról, és annak a mutagénekre
    való kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/38/CE del Consiglio del 29 aprile 1999 che modifica per
    la seconda volta la direttiva 90/394/CEE sulla protezione dei lavoratori contro
    i rischi derivanti da un'esposizione ad agenti cancerogeni durante il lavoro,
    estendendola agli agenti mutageni
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 1999/38/EK (1999. gada 29. aprīlis), ar kuru otro reizi
    groza Direktīvu 90/394/EEK par darba ņēmēju aizsardzību pret risku, kas saistīts
    ar pakļautību kancerogēnu iedarbībai darbā, un attiecina to uz mutagēniem
  type: main
- language: lt
  script: Latn
  content: 1999 m. balandžio 29 d. Tarybos direktyva 1999/38/EB antrą kartą iš
    dalies keičianti Direktyvą 90/394/EEB dėl darbuotojų apsaugos nuo rizikos,
    susijusios su kancerogenų poveikiu darbe, ir išplečianti jos taikymą mutagenams
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 1999/38/KE tad-29 ta’ April 1999 li temenda
    għat-tieni darba d-Direttiva 90/394/KEE dwar il-protezzjoni tal-ħaddiema kontra
    r-riskji relatati ma’ l-esposizzjoni għall-karcinoġeni fuq ix-xogħol u li
    testendiha għall-mutaġeni
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/38/EG van de Raad van 29 april 1999 tot tweede wijziging
    van Richtlijn 90/394/EEG betreffende de bescherming van de werknemers tegen de
    risico's van blootstelling aan carcinogene agentia op het werk en uitbreiding
    van die richtlijn tot mutagene agentia
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 1999/38/WE z dnia 29 kwietnia 1999 r. zmieniająca po raz
    drugi dyrektywę 90/394/EWG w sprawie ochrony pracowników przed zagrożeniem
    dotyczącym narażenia na działanie czynników rakotwórczych podczas pracy i
    rozszerzająca ją o mutageny
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/38/CE do Conselho de 29 de Abril de 1999 que altera pela
    segunda vez a Directiva 90/394/CEE relativa à protecção dos trabalhadores contra
    riscos ligados à exposição a agentes cancerígenos durante o trabalho e que
    torna extensiva a sua aplicação aos agentes mutagénicos
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 1999/38/ES z 29. apríla 1999, ktorou sa po druhýkrát mení
    a dopĺňa smernica 90/394/EHS o ochrane pracovníkov pred rizikami z vystavenia
    účinkom karcinogénov pri práci a ktorou sa rozširuje o mutagény
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 1999/38/ES z dne 29. aprila 1999, ki drugič spreminja
    Direktivo 90/394/EGS o varstvu delavcev pred tveganji zaradi izpostavljenosti
    rakotvornim snovem pri delu in jo razširja na mutagene snovi
  type: main
- language: es
  script: Latn
  content: Directiva 1999/38/CE del Consejo de 29 de abril de 1999 por la que se modifica
    por segunda vez la Directiva 90/394/CEE relativa a la protección de los trabajadores
    contra los riesgos relacionados con la exposición a agentes carcinógenos durante
    el trabajo y por la que se amplía su ámbito de aplicación a los mutágenos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 1999/38/EG av den 29 april 1999 om ändring för andra
    gången av direktiv 90/394/EEG om skydd för arbetstagare mot risker vid exponering
    för carcinogener i arbetet samt utvidgning av direktivet till mutagena ämnen
  type: main
