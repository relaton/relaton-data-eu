title:
- language: en
  script: Latn
  content: '2003/690/EC: Commission Decision of 2 October 2003 on the request by Ireland
    to accept Council Directive 2001/55/EC on minimum standards for giving temporary
    protection in the event of a mass influx of displaced persons and on measures
    promoting a balance of efforts between Member States in receiving such persons
    and bearing the consequences thereof (notified under document number C(2003) 3428)'
  type: main
- language: fr
  script: Latn
  content: '2003/690/CE: Décision de la Commission du 2 octobre 2003 sur la demande
    présentée par l''Irlande en vue d''accepter la directive 2001/55/CE du Conseil
    relative à des normes minimales pour l''octroi d''une protection temporaire en
    cas d''afflux massif de personnes déplacées et à des mesures tendant à assurer
    un équilibre entre les efforts consentis par les États membres pour accueillir
    ces personnes et supporter les conséquences de cet accueil [notifiée sous le
    numéro C(2003) 3428]'
  type: main
- language: de
  script: Latn
  content: '2003/690/EG: Entscheidung der Kommission vom 2. Oktober 2003 zum Antrag
    Irlands auf Annahme der Richtlinie 2001/55/EG des Rates über Mindestnormen für
    die Gewährung vorübergehenden Schutzes im Falle eines Massenzustroms von Vertriebenen
    und Maßnahmen zur Förderung einer ausgewogenen Verteilung der Belastungen, die
    mit der Aufnahme dieser Personen und den Folgen dieser Aufnahme verbunden sind,
    auf die Mitgliedstaaten (Bekannt gegeben unter Aktenzeichen K(2003) 3428)'
  type: main
- language: da
  script: Latn
  content: '2003/690/EF: Kommissionens beslutning af 2. oktober 2003 om Irlands ønske
    om at acceptere Rådets direktiv 2001/55/EF om minimumsstandarder for midlertidig
    beskyttelse i tilfælde af massetilstrømning af fordrevne personer og om foranstaltninger,
    der skal fremme en ligelig fordeling mellem medlemsstaterne af indsatsen med hensyn
    til modtagelsen af disse personer og følgerne heraf (meddelt under nummer K(2003)
    3428)'
  type: main
- language: el
  script: Grek
