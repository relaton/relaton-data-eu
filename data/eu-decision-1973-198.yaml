---
id: EUDecision1973198
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1973 authorizing the Italian Republic not
    to apply Community treatment to ball bearings falling within heading No ex 84.62
    of the Common Customs Tariff, originating in Czechoslovakia, Hungary, Romania
    and USSR and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/198/CEE de la Commission, du 28 juin 1973, autorisant la République
    italienne à exclure du traitement communautaire les roulements à billes, de
    la position Ex 84.62 du Tarif douanier commun, originaires de Hongrie, Roumanie,
    Tchécoslovaquie et URSS et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juni 1973, mit der die Italienische
    Republik ermächtigt wird, aus Rumänien, der Tschechoslowakei, Ungarn und der
    UdSSR stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    Kugellager der Tarifnummer ex 84.62 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. juni 1973 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage kuglelejer, som henhører under
    position ex 84.62 i den fælles toldtarif, har oprindelse i Rumænien, Tjekkoslovakiet,
    Ungarn og USSR og overgår til fri omsætning i andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 giugno 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i cuscinetti a sfere della voce
    ex 84.62 della tariffa doganale comune, originari della Cecoslovacchia, della
    Romania, dell'Ungheria e dell'URSS e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juni 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd kogellagers van post 84.62 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hongarije, Roemenië, Tsjechoslowakije en de U.S.S.R. en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
