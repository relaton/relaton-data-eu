---
id: EUDirective201410
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/10/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    in alloys, as a superconductor or thermal conductor, used in cryo-cooler cold
    heads and/or in cryo-cooled cold probes and/or in cryo-cooled equipotential bonding
    systems, in medical devices (category 8) and/or in industrial monitoring and control
    instruments
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/10/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb en tant que supraconducteur ou thermoconducteur dans les alliages
    utilisés dans les têtes froides des cryoréfrigérateurs et/ou dans les sondes
    froides cryoréfrigérées et/ou dans les systèmes de liaison équipotentielle
    cryoréfrigérés, dans les dispositifs médicaux (catégorie 8) et/ou dans les
    instruments de surveillance et de contrôle industriels
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/10/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei in Legierungen als Supraleiter und Wärmeleiter zur Verwendung
    in Kühlköpfen von Kryokühlern und/oder in kryogen gekühlten Kältesonden und/oder
    in kryogen gekühlten Potentialausgleichssystemen, in medizinischen Geräten (Kategorie
    8) und/oder in Überwachungs- und Kontrollinstrumenten in der Industrie
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/10/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    в сплави, представляващи свръхпроводящи или
    топлопроводящи материали, използвани в студените
    глави на криогенни охладители, и/или в криогенно
    охлаждани студени сонди, и/или в криогенно
    охлаждани системи за еквипотенциално свързване,
    съответно в медицински апарати (категория
    8), и/или в промишлени контролни и регулиращи
    прибори
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/10/EU ze dne 18. října
    2013 , kterou se z důvodu přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo jako supravodič a tepelný vodič ve slitinách používaných v mrazících
    hlavách kryogenního chladiče a/nebo kryogenně chlazených mrazících sondách
    a/nebo kryogenně chlazených systémech ekvipotenciálního pospojování ve
    zdravotnických prostředcích (kategorie 8) a/nebo v průmyslových přístrojích
    pro monitorování a kontrolu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/10/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU for så vidt angår indrømmelse af en undtagelse for bly i legeringer
    som superleder eller varmeleder anvendt i kryokølede kølehoveder og/eller kølesonder
    og/eller potentialeudligningssystemer, i medicinsk udstyr (kategori 8) og/eller
    i industrielle overvågnings- og reguleringsinstrumenter
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία 2014/10/ΕΕ της Επιτροπής,
    της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    εξαίρεση για τον μόλυβδο ως υπεραγωγό ή θερμικό
    αγωγό σε κράματα που χρησιμοποιούνται στις
    ψυχρές κεφαλές κρυογονικού ψύκτη ή/και σε ψυχρούς
    καθετήρες κρυογονικής ψύξης ή/και σε ισοδυναμικά
    συστήματα συγκόλλησης κρυογονικής ψύξης, σε
    ιατﾁικές συσκευές (κατηγορία 8) ή/και σε βιομηχανικά
    όργανα παρακολούθησης και ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/10/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist ülijuhi
    ja soojusjuhina sulamites, mis on kasutusel meditsiiniseadmete (kategooria 8)
    krüojahutite krüosõrmedes ja/või krüostaatilistes külmsondides ja/või krüostaatilistes
    potentsiaaliühtlustussüsteemides ja/või tööstuslikes seire- ja kontrolliseadmetes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/10/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä suprajohteena tai lämpöjohteena seoksissa, joita käytetään kryojäähdyttimien
    kylmissä päissä ja/tai kryojäähdytetyissä kryomittapäissä ja/tai kryojäähdytetyissä
    potentiaalintasausjärjestelmissä, lääkinnällisissä laitteissa (luokka 8)
    ja/tai teollisuuden tarkkailu- ja valvontalaitteissa
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/10/EU оd 18. listopada 2013. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća s obzirom na izuzeće za olovo u legurama, kao supravodič
    ili toplinski vodič, koje se koriste u rashladnim glavama kriohladnjaka i/ili
    u krio-hlađenim hladnim sondama i/ili u krio-hlađenim sustavima za izjednačavanje
    potencijala, u medicinskim uređajima (kategorija 8.) i/ili u industrijskim nadzornim
    i kontrolnim instrumentima
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/10/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a kriogén hűtők hideg fejeiben és/vagy kriogén hűtésű hideg szondákban
    és/vagy kriogén hűtésű ekvipotenciális kötési rendszerekben, orvostechnikai
    eszközökben (8. kategória) és/vagy ipari felügyeleti és vezérlő eszközökben
    szupravezetőként vagy hővezetőként használt ötvözetekben alkalmazott ólom
    mentesítése tekintetében, a műszaki fejlődéshez történő hozzáigazítás
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/10/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, adattandolo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa al piombo in leghe come superconduttore e conduttore termico, utilizzato
    negli scambiatori freddi di criorefrigeratori e/o in sonde criogeniche criorefrigerate
    e/o in sistemi equipotenziali di collegamento criorefrigerati, in dispositivi
    medici (categoria 8) e/o in strumenti di monitoraggio e controllo industriali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/10/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam sakausējumos
    kā supravadītājam vai siltumvadītājam, ko izmanto kriodzesētāju dzesēšanas
    galvās un/vai kriodzesētās aukstumzondēs, un/vai kriodzesētās ekvipotenciālās
    savienošanas sistēmās, medicīniskās ierīcēs (8. kategorija) un/vai rūpnieciskos
    uzraudzības un vadības instrumentos
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/10/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną lydiniuose kaip superlaidininką arba šilumos laidininką, naudojamą
    kriogeninių įrenginių šaldomosiose galvutėse ir (arba) kriogeniniuose zonduose
    ir (arba) kriogeninėse ekvipotencialiojo sujungimo sistemose, kurie naudojami
    medicinos įrangoje (8 kategorija) ir (arba) pramoniniuose stebėjimo ir kontrolės
    prietaisuose
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/10/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb fil-ligi, bħala superkunduttur jew kunduttur termali,
    użat fil-cold heads tar-refriġeraturi krijoġeniċi u/jew fis-sondi kesħin
    imkessħin b’mod krijoġeniku u/jew fis-sistemi ta’ rbit ekwipotenzjali mkessħin
    b’mod krijoġeniku, f’tagħmir mediku (kategorija 8) u/jew fi strumenti industrijali
    ta’ monitoraġġ u kontroll
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/10/EU van de Commissie van 18 oktober 2013
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in legeringen, als supergeleider of warmtegeleider,
    voor gebruik in koelkoppen van cryokoelers en/of in cryogeen gekoelde cryosondes
    en/of in cryogeen gekoelde potentiaalvereffeningssystemen, in medische hulpmiddelen
    (categorie 8) en/of in industriële meet- en regelapparatuur
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/10/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu w stopach, pełniącego funkcję nadprzewodnika lub przewodnika termicznego,
    stosowanego w głowicach chłodziarek kriogenicznych lub w sondach chłodzonych
    kriogenicznie lub też w chłodzonych kriogenicznie systemach połączeń ekwipotencjalnych,
    w wyrobach medycznych (kategoria nr 8) lub w przyrządach do nadzoru i kontroli
    w obiektach przemysłowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/10/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para chumbo em ligas, como supercondutor ou condutor térmico, utilizadas em cabeças
    frias de criorrefrigeradores e/ou em sondas frias criorrefrigeradas e/ou em sistemas
    de ligação equipotencial criorrefrigerados, em dispositivos médicos (categoria
    8) e/ou em instrumentos industriais de monitorização e controlo
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/10/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul, ca supraconductor sau conductor termic, din aliajele utilizate în capetele
    reci ale răcitoarelor criogenice și/sau în sondele reci răcite criogenic și/sau
    în sistemele de legături echipotențiale răcite criogenic, în dispozitivele
    medicale (categoria 8) și/sau în instrumentele industriale de monitorizare și
    control
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/10/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo v zliatinách
    ako supravodič alebo tepelný vodič použitý v hlavách chladiča na kryogénne
    chladenie a/alebo v kryogénne vychladených chladiacich sondách a/alebo v kryogénne
    vychladených systémoch na vyrovnávanie potenciálu, v zdravotníckych pomôckach
    (kategórie 8) a/alebo v priemyselných monitorovacích a kontrolných prístrojoch
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/10/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem za
    svinec v zlitinah kot superprevodnik ali toplotni vodnik, ki se uporablja v hladnih
    glavah kriogenskih hladilnikov in/ali kriogensko hlajenih hladnih tipalih in/ali
    kriogensko hlajenih sistemih za izenačitev potencialov v medicinskih napravah
    (kategorija 8) in/ali industrijskih instrumentih za spremljanje in nadzor zaradi
    prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/10/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo en aleaciones, como superconductor o conductor térmico, utilizadas
    en cabezas frías de criorrefrigeradores y/o en sondas frías criorrefrigeradas
    y/o en sistemas de conexión equipotencial criorrefrigerados, en productos sanitarios
    (categoría 8) y/o en instrumentos industriales de vigilancia y control
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/10/EU av den 18 oktober 2013 om
    ändring, för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly i legeringar, som
    en supraledare eller värmeledare, använt i kryokylares kylhuvuden och/eller
    i kryokylda kylsonder och/eller i kryokylda system för ekvipotentialförbindning,
    i medicintekniska produkter (kategori 8) och/eller i industriella övervaknings-
    och kontrollinstrument
  type: main
