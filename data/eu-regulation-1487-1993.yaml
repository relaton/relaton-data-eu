  content: COMMISSION REGULATION (EEC) No 1487/93 of 17 June 1993 amending Regulations
    (EEC) No 2257/92 and (EEC) No 2258/92 laying down detailed rules for implementing
    the specific arrangements for supplying Madeira and the Canary Islands, respectively,
    with certain vegetable oils and establishing the forecast supply balances
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1487/93 de la Commission du 17 juin 1993 modifiant
    les règlements (CEE) n° 2257/92 et (CEE) n 2258/92 portant, respectivement,
    modalités d'application du régime spécifique pour l'approvisionnement en certaines
    huiles végétales pour Madère et les îles Canaries et établissant leurs bilans
    prévisionnels d'approvisionnement
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1487/93 DER KOMMISSION vom 17. Juni 1993 zur Änderung
    der Verordnungen (EWG) Nr. 2257/92 und (EWG) Nr. 2258/92 mit Durchführungsvorschriften
    zur Sonderregelung für die Versorgung Madeiras und der Kanarischen Inseln mit
    pflanzlichem Öl und zur Vorausschätzung des Bedarfs
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1487/93 af 17. juni 1993 om ændring
    af forordning (EØF) nr. 2257/92 og nr. 2258/92 om gennemførelsesbestemmelser
    for den særlige ordning for forsyning af henholdsvis Madeira og De Kanariske
    Øer med visse vegetabilske olier og om fastsættelse af den foreløbige forsyningsopgørelse
  type: main
- language: el
  script: Grek
