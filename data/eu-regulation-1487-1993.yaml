    της 17ης Ιουνίου 1993 για τροποποίηση των κανονισμών
    (ΕΟΚ) αριθ. 2257/92 και (ΕΟΚ) αριθ. 2258/92 σχετικά, αντιστοίχως,
    με τις λεπτομέρειες εφαρμογής του ειδικού
    καθεστώτος για τον εφοδιασμό της Μαδέρας και
    των Καναρίων Νήσων με ορισμένα φυτικά έλαια
    και σχετικά με την κατάρτιση των προβλέψεων
    εφοδιασμού
  type: main
