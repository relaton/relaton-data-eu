  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1487/93, annettu 17 päivänä kesäkuuta 1993,
    Madeiran ja Kanariansaarten tiettyjen kasviöljyjen erityisen hankintajärjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä ja arvioidun hankintataseen
    vahvistamisesta annettujen asetusten (ETY) N:o 2257/92 ja (ETY) N:o 2258/92 muuttamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1487/93 DELLA COMMISSIONE del 17 giugno 1993 che modifica
    i regolamenti (CEE) n. 2257/92 e (CEE) n. 2258/92 relativi alle modalità di applicazione
    del regime specifico di approvvigionamento di taluni oli vegetali e al bilancio
    previsionale di approvvigionamento, rispettivamente per Madera e per le isole
    Canarie
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1487/93 VAN DE COMMISSIE van 17 juni 1993 tot wijziging
    van de Verordeningen (EEG) nr. 2257/92 en (EEG) nr. 2258/92 houdende bepalingen
    ter uitvoering van de specifieke regeling voor de voorziening van, respectievelijk,
