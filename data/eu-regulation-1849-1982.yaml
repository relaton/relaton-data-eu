title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1849/82 of 7 July 1982 fixing for the 1982/83
    marketing year the Community offer price for mandarins (including tangerines and
    satsumas), Wilkings and other similar citrus hybrids, with the exception of clementines,
    applicable as regards Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1849/82 de la Commission, du 7 juillet 1982, fixant,
    pour la campagne 1982/1983, le prix d' offre communautaire valable pour les mandarines,
    y compris tangerines et satsumas, wilkings et autres hybrides similaires d' agrumes,
    à l' exclusion des clémentines, applicable vis-à-vis de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1849/82 der Kommission vom 7. Juli 1982 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen
    Clementinen, gegenüber Griechenland für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1849/82 af 7. juli 1982 om fastsættelse
    for produktionsåret 1982/83 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på mandariner (herunder tangeriner og satsumas), wilkings og andre lignende krydsninger
    af citrusfrugter bortset fra clementiner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1849/82 τής Επιτροπής
    τής 7ης Ιουλίου 1982 περί καθορισμού, γιά τήν
    περίοδο εμπορίας 1982/83, τής ισχύουσας κοινοτικής
    τιμής προσφοράς γιά τά μανταρίνια, συμπεριλαμβανομένων
    τών tangerines, satsumas, wilkings καί άλλων παρόμοιων υβριδίων
    εσπεριδοειδών, εξαιρέσει τών κλημεντινών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1849/82 della Commissione, del 7 luglio 1982, che
    fissa, per la campagna 1982/1983, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per i mandarini, compresi i tangerini e i mandarini
    satsuma (o sazuma), wilking e altri simili ibridi di agrumi, escluse le clementine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1849/82 van de Commissie van 7 juli 1982 tot vaststelling,
    voor het verkoopseizoen 1982/1983, van de ten aanzien van Griekenland toe te passen
    communautaire aanbiedingsprijs voor mandarijnen, tangerines en satsuma' s daaronder
    begrepen, wilkings en andere dergelijke kruisingen van citrusvruchten, met uitzondering
    van clementines
  type: main
