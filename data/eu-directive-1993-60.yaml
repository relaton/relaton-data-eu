id: EUDirective199360
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 93/60/EEC of 30 June 1993 amending Directive 88/407/EEC
    laying down the animal health requirements applicable to intra-Community trade
    in and imports of deep-frozen semen of domestic animals of the bovine species
    and extending it to cover fresh bovine semen
  type: main
- language: fr
  script: Latn
  content: Directive 93/60/CEE du Conseil du 30 juin 1993 modifiant la directive 88/407/CEE
    fixant les exigences de police sanitaire applicables aux échanges intracommunautaires
    et aux importations de sperme surgelé d'animaux de l'espèce bovine et élargissant
    son champ d'application au sperme frais de bovins
  type: main
- language: de
  script: Latn
  content: Richtlinie 93/60/EWG des Rates vom 30. Juni 1993 zur Änderung der Richtlinie
    88/407/EWG zur Festlegung der tierseuchenrechtlichen Anforderungen an den innergemeinschaftlichen
    Handelsverkehr mit gefrorenem Samen von Rindern und an dessen Einfuhr sowie zur
    Ausdehnung ihres Geltungsbereichs auf frischen Rindersamen
  type: main
- language: bg
  script: Cyrl
  content: Директива 93/60/ЕИО на Съвета от 30 юни 1993 година
    за изменение на Директива 88/407/ЕИО относно определяне
    на ветеринарно-санитарните изисквания за внос
    и търговия в рамките на Общността с дълбоко
    замразена сперма от животни от рода на едрия
    рогат добитък и за разширяване на приложното
    ѝ поле, за да обхване прясната сперма от животни
    от рода на едрия рогат добитък
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 93/60/EHS ze dne 30. června 1993, kterou se mění směrnice
    88/407/EHS o veterinárních požadavcích na obchod s hluboce zmrazeným spermatem
    skotu uvnitř Společenství a na jeho dovoz a kterou se její oblast působnosti
    rozšiřuje na čerstvé sperma skotu
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 93/60/EØF af 30. juni 1993 om ændring af direktiv 88/407/EØF
    om fastsættelse af de veterinærpolitimæssige krav i forbindelse med handelen
    inden for Fællesskabet med frosset tyresæd og indførsel heraf og om udvidelse
    af det til at omfatte frisk tyresæd
  type: main
- language: el
  script: Grek
  content: Οδηγία 93/60/ΕΟΚ του Συμβουλίου της 30ής Ιουνίου
    1993 η οποία τροποποιεί την οδηγία 88/407/ΕΟΚ, του
    Συμβουλίου, για τον καθορισμό των απαιτήσεων
    υγειονομικού ελέγχου που ισχύουν στις ενδοκοινοτικές
    συναλλαγές και στις εισαγωγές κατεψυγμένου
    σπέρματος βοοειδών, και η οποία διευρύνει το
    πεδίο εφαρμογής της προκειμένου αυτό να καλύπτει
    και το νωπό σπέρμα βοοειδών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 93/60/EMÜ, 30. juuni 1993, millega muudetakse direktiivi
    88/407/EMÜ, millega sätestatakse koduveiste sügavkülmutatud sperma ühendusesisese
    kaubanduse ja impordi korral kohaldatavad loomatervishoiu nõuded, ning millega
    laiendatakse seda direktiivi, et hõlmata värske veisesperma
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 93/60/ETY, annettu 30 päivänä kesäkuuta 1993,
    eläinten terveyttä koskevista vaatimuksista yhteisön sisäisessä naudansukuisten
    kotieläinten pakastetun siemennesteen kaupassa ja tuonnissa annetun direktiivin
    88/407/ETY muuttamisesta ja sen soveltamisalan laajentamisesta koskemaan nautaeläinten
    tuoretta siemennestettä
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 93/60/EEZ od 30. lipnja 1993. o izmjeni Direktive 88/407/EEZ
    o utvrđivanju zahtjeva zdravlja životinja koji se primjenjuju na trgovinu unutar
    Zajednice i na uvoz duboko smrznutog sjemena domaćih životinja vrste goveda
    i o njezinom proširenju kako bi obuhvatila uvoz svježeg sjemena bikova
  type: main
- language: hu
  script: Latn
  content: A Tanács 93/60/EGK irányelve (1993. június 30.) a szarvasmarhafajba
    tartozó háziállatok mélyhűtött spermájának Közösségen belüli kereskedelmére
    és behozatalára alkalmazandó állat-egészségügyi követelmények megállapításáról
    szóló 88/407/EGK irányelv módosításáról, valamint annak a szarvasmarhafélék
    friss spermájára történő kiterjesztéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 93/60/CEE del Consiglio del 30 giugno 1993 recante modifica della
    direttiva 88/407/CEE che stabilisce le esigenze di polizia sanitaria applicabili
    agli scambi intracomunitari e alle importazioni di sperma surgelato di animali
    della specie bovina, e che ne estende il campo d'applicazione allo sperma bovino
    fresco
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 93/60/EEK (1993. gada 30. jūnijs), kas groza Direktīvu
    88/407/EEK par dzīvnieku veselības prasībām, kas piemērojamas Kopienas iekšējā
    tirdzniecībā ar sasaldētu mājas liellopu spermu un tās ievedumiem, un kas
    paplašina minēto direktīvu, lai tā ietvertu svaigu mājas liellopu spermu
  type: main
- language: lt
  script: Latn
  content: 1993 m. birželio 30 d. Tarybos direktyva 93/60/EEB, iš dalies keičianti
    Direktyvą 88/407/EEB, nustatančią gyvūnų sveikatos reikalavimus, taikomus
    Bendrijos vidaus prekybai užšaldyta galvijų sperma bei jos importui ir išplečianti
    jos taikymą šviežiai galvijų spermai
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 93/60/KEE tat-30 ta’ Ġunju 1993 li temenda
    d-Direttiva 88/407/KEE li tistabbilixxi l-ħtiġiet tas-saħħa ta’ l-annimali
    applikabbli għal kummerċ intra-Komunitarju fi u l-importazzjoni tas-semen deep-frozen
    ta’ l-annimali domestiċi ta’ l-ispeċi ta’ l-ifrat u li testendiha biex
    tkopri semen frisk ta’ l-ifrat
  type: main
- language: nl
  script: Latn
  content: Richtlijn 93/60/EEG van de Raad van 30 juni 1993 houdende wijziging van
    Richtlijn 88/407/EEG tot vaststelling van de veterinairrechtelijke voorschriften
    van toepassing op het intracommunautaire handelsverkeer in diepgevroren sperma
    van runderen en de invoer daarvan, en houdende uitbreiding van de werkingssfeer
    tot vers sperma van runderen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 93/60/EWG z dnia 30 czerwca 1993 r. zmieniająca dyrektywę
    88/407/EWG ustanawiającą warunki zdrowotne zwierząt wymagane w handlu wewnątrzwspólnotowym
    oraz w przywozie zamrożonego nasienia bydła domowego i rozszerzająca ją tak,
    aby objęła świeże nasienie bydła
  type: main
- language: pt
  script: Latn
  content: Directiva 93/60/CEE do Conselho de 30 de Junho de 1993 que altera a Directiva
    88/407/CEE, que fixa as exigências de polícia sanitária aplicáveis às trocas
    comerciais intracomunitárias e às importações de sémen congelado de animais
    da espécie bovina e que torna o seu âmbito de aplicação extensivo ao sémen
    fresco de bovino
  type: main
- language: ro
  script: Latn
  content: Directiva 93/60/CEE a Consiliului din 30 iunie 1993 de modificare a Directivei
    88/407/CEE de stabilire a cerințelor de sănătate animală aplicabile schimburilor
    intracomunitare și importurilor de material seminal congelat de bovine și privind
    extinderea domeniului de aplicare a acesteia la materialul seminal proaspăt de
    bovine
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 93/60/EHS z 30. júna 1993, ktorou sa mení a dopĺňa smernica
    88/407/EHS, ktorá stanovuje požiadavky na zdravotný stav zvierat platné pre
    obchodovanie s hlboko zmrazenou spermou hovädzieho dobytka v rámci spoločenstva
    a jej dovoz, a ktorou sa rozširuje rozsah jej platnosti na čerstvú spermu hovädzieho
    dobytka
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 93/60/EGS z dne 30. junija 1993 o spremembi Direktive 88/407/EGS
    o zahtevah v zvezi z zdravstvenim varstvom živali, ki veljajo za promet med državami
    članicami Evropske skupnosti in za uvoz globoko zamrznjenega in svežega semena
    domačega goveda
  type: main
- language: es
  script: Latn
  content: Directiva 93/60/CEE 93/60/CEE del Consejo de 30 de junio de 1993 que modifica
    la Directiva 88/407/CEE del Consejo, por la que se fijan las exigencias de policía
    sanitaria aplicables a los intercambios intracomunitarios y a las importaciones
    de esperma congelado de animales de la especie bovina, y se amplía al esperma
    fresco de dichos animales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 93/60/EEG av den 30 juni 1993 om ändring av direktiv
    88/407/EEG om djurhälsokrav som är tillämpliga vid handel inom gemenskapen
    med och import av djupfryst sperma från tamdjur av nötkreatur samt utvidgning
    av det till att omfatta färsk sperma från nötkreatur
  type: main
