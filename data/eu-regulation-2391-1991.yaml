    κανονισμό (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2391/91 DELLA COMMISSIONE del 5 agosto 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti della categoria n. 55
    (numero d'' ordine 40.0550) originari dell'' Ungheria beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2391/91 VAN DE COMMISSIE van 5 augustus 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
