    της εισφοράς που εφαρμόζεται για τα πίτυρα
    και βίττα καταγωγής Αλγερίας, Μαρόκου και Τυνησίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 81/93 della Commissione, del 18 gennaio 1993, che
