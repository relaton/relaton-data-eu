title:
- language: en
  script: Latn
  content: '80/83/EEC: Commission Decision of 10 December 1979 on the granting by
    the Guidance Section of the EAGGF to the United Kingdom of a payment on account
    in respect of expenditure incurred during 1978, and additional expenditure declared
    for 1975, on aids for the less- favoured farming areas (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/83/CEE: Décision de la Commission, du 10 décembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume-Uni d''un acompte sur les dépenses effectuées
    pendant l''année 1978 et les dépenses supplémentaires déclarées au titre
    de l''année 1975 pour les aides en faveur des zones agricoles défavorisées
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/83/EWG: Entscheidung der Kommission vom 10. Dezember 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 in benachteiligten landwirtschaftlichen Gebieten gewährten und zusätzlich
    für 1975 nachgemeldeten Hilfen an das Vereinigte Königreich (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/83/EØF: Kommissionens beslutning af 10. december 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1978, samt yderligere udgifter
    opgivet for 1975, til støtte til ugunstigt stillede landbrugsområder (Kun den
    engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/83/CEE: Decisione della Commissione, del 10 dicembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno Unito di un anticipo
    sulle spese effettuate durante il 1978 e di un''ulteriore spesa relativa al 1975
    per gli aiuti in favore delle zone agricole svantaggiate (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/83/EEG: Beschikking van de Commissie van 10 december 1979 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Verenigd Koninkrijk
    van een voorschot in verband met de in 1978 verrichte uitgaven en van aanvullende
    uitgaven voor 1975 voor steun aan probleemgebieden in de landbouw (Slechts de
    tekst in de Engelse taal is authentiek)'
