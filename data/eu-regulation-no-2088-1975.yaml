type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2088/75 of the Commission of 8 August 1975 re-establishing
    the levying of customs duties on wood planed, tongued, grooved, rebated, chamfered,
    V-jointed, centre V-jointed, beaded, centre-beaded or the like, but not further
    manufactured, falling within heading No 44.13, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2088/75 de la Commission, du 8 août 1975, portant
    rétablissement de la perception des droits de douane applicables aux bois rabotés,
    rainés bouvetés, languetés, feuillures, chanfreines ou similaires, de la position
    tarifaire 44.13, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2088/75 der Kommission vom 8. August 1975 zur Wiedereinführung
    des Zolsatzes für Holz (einschließlich Stäbe oder Friese für Parkett, nicht
    zusammengesetzt), gehobelt, genutet, gefedert, gekehlt, gefalzt, abgeschrägt
    oder in ähnlicher Weise bearbeitet, der Tarifnummer 44.13, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2088/75 af 8. august 1975 om genindførelse
    af opkrævning af toldafgifter for træ, høvlet, pløjet, falset, affaset eller
    på lignende måde bearbejdet (herunder ikke-sammensatte parketstaver), under
    position 44.13, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2088/75 della Commissione, dell'8 agosto 1975, che
    ripristina la riscossione dei dazi doganali applicabili al legno piallato, scanalato,
    sagomato a forma di battente, con incastri semplici, con limbelli, con smussature
    o similmente lavorato, comprese le liste e le tavolette (parchetti) per pavimenti,
    non riunite, della voce doganale n. 44.13, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74
    del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2088/75 van de Commissie van 8 augustus 1975 houdende
    wederinstelling van de heffing van de douanerechten voor hout (niet ineengezette
    plankjes voor parketvloeren daaronder begrepen), geschaafd, geploegd of van sponningen
    voorzien, afgeschuind of op dergelijke wijze bewerkt, van post 44.13, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3054/74
    van de Raad van 2 december 1974 tariefpreferenties werden geopend
  type: main
