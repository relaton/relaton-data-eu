id: EURegulation8072003
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 807/2003 of 14 April 2003 adapting to Decision
    1999/468/EC the provisions relating to committees which assist the Commission
    in the exercise of its implementing powers laid down in Council instruments adopted
    in accordance with the consultation procedure (unanimity)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 807/2003 du Conseil, du 14 avril 2003, portant adaptation
    à la décision 1999/468/CE des dispositions relatives aux comités assistant
    la Commission dans l'exercice de ses compétences d'exécution prévues dans des
    actes du Conseil adoptés selon la procédure de consultation (unanimité)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 807/2003 des Rates vom 14. April 2003 zur Anpassung
    der Bestimmungen über die Ausschüsse zur Unterstützung der Kommission bei der
    Ausübung von deren Durchführungsbefugnissen, die in nach dem Konsultationsverfahren
    (Einstimmigkeit) erlassenen Rechtsakten des Rates vorgesehen sind, an den Beschluss
    1999/468/EG
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 807/2003 на Съвета от 14 април
    2003 година относно адаптирането към Решение
    № 1999/468/ЕО на разпоредбите за комитетите, които
    подпомагат Комисията при упражняване на изпълнителните
    ѝ правомощия, установени в инструментите на
    Съвета, приети съгласно консултативната процедура
    (единодушие)
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 807/2003 ze dne 14. dubna 2003 o přizpůsobení
    ustanovení týkajících se výborů, které jsou nápomocny Komisi při výkonu
    jejích prováděcích pravomocí, stanovených v právních aktech Rady přijatých
    konzultačním postupem (jednomyslnost), ustanovením rozhodnutí 1999/468/ES
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 807/2003 af 14. april 2003 om tilpasning til
    afgørelse 1999/468/EF af bestemmelserne vedrørende de udvalg, der bistår Kommissionen
    i forbindelse med udøvelsen af de gennemførelsesbeføjelser, der er fastsat
    i retsakter vedtaget af Rådet efter høringsproceduren (enstemmighed)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 807/2003 του Συμβουλίου,
    της 14ης Απριλίου 2003, περί προσαρμογής προς
    την απόφαση 1999/468/ΕΚ των διατάξεων των σχετικών
    με τις επιτροπές που επικουρούν την Επιτροπή
    στην άσκηση των εκτελεστικών αρμοδιοτήτων
    της, οι οποίες προβλέπονται από πράξεις του
    Συμβουλίου που εκδόθηκαν σύμφωνα με τη διαδικασία
    διαβούλευσης (ομοφωνία)
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 807/2003, 14. aprill 2003, konsulteerimiskorra
    kohaselt (ühehäälselt) vastuvõetud nõukogu õigusaktides sätestatud rakendusvolituste
    kasutamisel komisjoni abistavaid komiteesid käsitlevate sätete kohandamise kohta
    otsusega 1999/468/EÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 807/2003, annettu 14 päivänä huhtikuuta 2003,
    kuulemismenettelyä (yksimielisyys) noudattaen annetuissa neuvoston säädöksissä
    säädetyn täytäntöönpanovallan käytössä komissiota avustavia komiteoita
    koskevien säännösten mukauttamisesta päätökseen 1999/468/EY
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 807/2003 od 14. travnja 2003. o prilagodbi odredbi
    u vezi odbora koji pomažu Komisiji u izvršavanju njezinih provedbenih ovlasti
    utvrđenih u instrumentima Vijeća donesenim u skladu s postupkom savjetovanja
    (jednoglasnost), Odluci 1999/468/EZ
  type: main
- language: hu
  script: Latn
  content: A Tanács 807/2003/EK rendelete (2003. április 14.) a Bizottságot a konzultációs
    eljárással összhangban (egyhangúság) elfogadott tanácsi jogi aktusokban
    megállapított végrehajtási hatásköreinek gyakorlása során segítő bizottságokkal
    kapcsolatos rendelkezéseknek az 1999/468/EK határozathoz történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 807/2003 del Consiglio, del 14 aprile 2003, recante
    adeguamento alla decisione 1999/468/CE delle disposizioni relative ai comitati
    che assistono la Commissione nell'esercizio delle sue competenze di esecuzione
    previste negli atti del Consiglio adottati secondo la procedura di consultazione
    (unanimità)
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 807/2003 (2003. gada 14. aprīlis), ar ko Lēmumam
    1999/468/EK pielāgo noteikumus par komitejām, kuras palīdz Komisijai īstenot
    tai piešķirtās ieviešanas pilnvaras, kas noteiktas Padomes dokumentos, kuri
    pieņemti atbilstīgi konsultēšanās procedūrai (vienprātība)
  type: main
- language: lt
  script: Latn
  content: 2003 m. balandžio 14 d. Tarybos reglamentas (EB) Nr. 807/2003, suderinantis
    su Sprendimu 1999/468/EB nuostatas, susijusias su komitetais, padedančiais Komisijai
    naudotis savo įgyvendinimo įgaliojimais, nustatytais Tarybos dokumentuose, priimtuose
    vadovaujantis konsultavimosi tvarka (balsų vieningumu)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 807/2003 ta' l-14 ta' April 2003 li
    jaddatta, għad-Deċiżjoni 1999/468/KE, id-disposizzjonijiet li għandhom x'jaqsmu
    mal-kumitati li jassistu l-Kummissjoni fl-eżerċizzju tas-setgħat ta' implimentazzjoni
    tagħha stabbiliti fi strumenti tal-Kunsill adottati skond il-proċedura ta' konsultazzjoni
    (unanimità)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 807/2003 van de Raad van 14 april 2003 tot aanpassing
    aan Besluit 1999/468/EG van de bepalingen betreffende de comités die de Commissie
    bĳstaan in de uitoefening van haar uitvoeringsbevoegdheden die zĳn vastgelegd
    in volgens de raadplegingsprocedure (unanimiteit) goedgekeurde besluiten van de
    Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 807/2003 z dnia 14 kwietnia 2003 r. dostosowujące
    do decyzji 1999/468/WE przepisy odnoszące się do komitetów wspomagających
    Komisję w wykonywaniu jej uprawnień wykonawczych ustanowionych w instrumentach
    Rady przyjętych zgodnie z procedurą konsultacji (jednomyślność)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 807/2003 do Conselho, de 14 de Abril de 2003, que
    adapta à Decisão 1999/468/CE as disposições relativas aos comités que assistem
    a Comissão no exercício das suas competências de execução previstas em actos
    do Conselho adoptados pelo procedimento consultivo (unanimidade)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 807/2003 al Consiliului din 14 aprilie 2003 de adaptare
    la Decizia 1999/468/CE a dispozițiilor privind comitetele care asistă Comisia
    în exercitarea atribuțiilor sale de executare prevăzute în actele Consiliului
    adoptate în conformitate cu procedura de consultare (unanimitate)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 807/2003 zo 14. apríla 2003 o prispôsobení
    rozhodnutiu 1999/468/ES ustanovení týkajúcich sa výborov, ktoré pomáhajú
    Komisii pri uplatňovaní jej vykonávacích právomocí stanovených v právnych
    aktoch Rady prijatých v súlade s konzultačným postupom (jednohlasnosť)
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 807/2003 z dne 14. aprila 2003 o prilagoditvi določb
    glede odborov, ki pomagajo Komisiji pri uresničevanju njenih izvedbenih pooblastil,
    predvidenih v aktih Sveta, ki se sprejemajo v postopku posvetovanja (soglasje),
    Sklepu 1999/468/ES
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 807/2003 del Consejo, de 14 de abril de 2003, por el
    que se adaptan a la Decisión 1999/468/CE las disposiciones relativas a los comités
    que colaboran con la Comisión en el ejercicio de sus competencias de ejecución
    previstas en los actos del Consejo adoptados con arreglo al procedimiento de consulta
    (unanimidad)
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 807/2003 av den 14 april 2003 om anpassning
    till beslut 1999/468/EG av de bestämmelser i rättsakter som rådet antagit enligt
    samrådsförfarandet (enhällighet) som avser de kommittéer som biträder kommissionen
    när den utövar sina genomförandebefogenheter
  type: main
