title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2094/2002 of 26 November 2002 imposing a definitive
    countervailing duty on imports of polyester textured filament yarn (PTY) originating
    in India and terminating the proceeding concerning imports of PTY originating
    in Indonesia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2094/2002 du Conseil du 26 novembre 2002 instituant
    un droit compensateur définitif sur les importations de fil continu texturé
    de polyester originaire de l'Inde et clôturant la procédure concernant les importations
    de fil continu texturé de polyester originaire d'Indonésie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2094/2002 des Rates vom 26. November 2002 zur Einführung
    eines endgültigen Ausgleichszolls auf die Einfuhren texturierter Polyester-Filamentgarne
    (PTY) mit Ursprung in Indien und zur Einstellung des Verfahrens betreffend die
    Einfuhren von PTY mit Ursprung in Indonesien
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 2094/2002 на Съвета от 26 ноември
    2002 година за налагане на окончателно изравнително
    мито върху вноса на текстурирани прежди от
    полиестерни нишки (PTY) с произход от Индия и
    за закриване на процедурата относно вноса
    на PTY с произход от Индонезия
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2094/2002 ze dne 26. listopadu 2002 o uvalení
    konečného vyrovnávacího cla na dovozy texturovaného polyesterového hedvábí
    (PTY) pocházejícího z Indie a ukončení řízení týkajícího se dovozů
    PTY pocházejícího z Indonésie
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2094/2002 af 26. november 2002 om indførelse
    af endelig udligningstold på importen af tekstureret garn af endeløse polyesterfibre
    med oprindelse i Indien og om afslutning af proceduren vedrørende importen af
    tekstureret garn af endeløse polyesterfibre med oprindelse i Indonesien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2094/2002 του Συμβουλίου,
    της 26ης Νοεμβρίου 2002, για την επιβολή οριστικού
    αντισταθμιστικού δασμού στις εισαγωγές ελαστικοποιημένων
    νημάτων από πολυεστέρες, καταγωγής Ινδίας,
    και την περάτωση της διαδικασίας όσον αφορά
    τις εισαγωγές ελαστικοποιημένων νημάτων από
    πολυεστέρες καταγωγής Ινδονησίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2094/2002, 26. november 2002, millega kehtestatakse
    Indiast pärit tekstureeritud polüesterfilamentlõnga impordi suhtes lõplik
    tasakaalustav tollimaks ja lõpetatakse Indoneesiast pärit tekstureeritud polüesterfilamentlõnga
    importi käsitlev menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2094/2002, annettu 26 päivänä marraskuuta
    2002, lopullisen tasoitustullin käyttöönotosta Intiasta peräisin olevan teksturoidun
    polyesterifilamenttilangan tuonnissa ja Indonesiasta peräisin olevan teksturoidun
    polyesterifilamenttilangan tuontia koskevan menettelyn päättämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 2094/2002 od 26. studenoga 2002. o uvođenju konačne
    kompenzacijske carine na uvoz poliesterske teksturirane filamentne pređe (PTFP)
    podrijetlom iz Indije i o okončanju postupka u vezi s uvozom PTFP-a podrijetlom
    iz Indonezije
  type: main
- language: hu
  script: Latn
  content: A Tanács 2002. november 26-i 2094/2002/EK rendelete az Indiából származó,
