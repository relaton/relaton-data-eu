    (TPP) importam un ar ko izbeidz procedūru attiecībā uz Indonēzijas izcelsmes
    TPP
  type: main
- language: lt
  script: Latn
  content: 2002 m. lapkričio 26 d. Tarybos reglamentas (EB) Nr. 2094/2002 įvedantis
    galutinį kompensacinį muitą, kuriuo apmuitinami importuojami Indijos kilmės
    poliesterio tekstūruotieji gijiniai siūlai (PTS), ir nutraukiantis nagrinėjimą
    dėl Indonezijos kilmės PTS importo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2094/2002 tas-26 ta' Novembru 2002 li
    jimponi dazju definittiv ta' sisa protettiva fuq filament ta' tessut tal-polyester
    (polyester textured filament yarn - PTY) li joriġina fl-Indja u li jtemm il-proċediment
    li jikkonċerna l-importazzjoni ta' filament ta' tessut tal-polyester (PTY) li
    joriġina fl-Indoneżja.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2094/2002 van de Raad van 26 november 2002 tot instelling
    van een definitief compenserend recht en tot definitieve inning van het voorlopige
    compenserende recht op getextureerd filamentgaren van polyester uit India en tot
    beëindiging van de procedure betreffende getextureerd filamentgaren van polyester
    uit Indonesië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2094/2002 z dnia 26 listopada 2002 r. nakładające
    ostateczne cło wyrównawcze na przywóz przędzy teksturowanej z poliestrów
    (TWP) pochodzącej z Indii i zamykające postępowanie dotyczące przywozu TWP
    pochodzącej z Indonezji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2094/2002 do Conselho, de 26 de Novembro de 2002,
    que institui um direito de compensação definitivo sobre as importações de
    fios de filamentos texturizados de poliésteres (PTY) originários da Índia e
    que encerra o processo no que respeita às importações de PTY originárias da
    Indonésia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2094/2002 al Consiliului din 26 noiembrie 2002 de
    instituire a unui drept compensatoriu definitiv la importurile de fir continuu
    texturat din poliester originar din India și de închidere a procedurii privind
    importurile de fir continuu texturat din poliester originar din Indonezia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2094/2002 z 26. novembra 2002, ktorým sa zavádza
    konečné vyrovnávacie clo na dovoz priadze z nekonečných vlákien dekoratívne
    upravenej polyesterom (PTY) s pôvodom v Indii a ukončuje sa konanie týkajúce
    sa dovozu PTY s pôvodom v Indonézii
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2094/2002 z dne 26. novembra 2002 o uvedbi dokončne
    izravnalne carine pri uvozu teksturirane preje iz poliestrskih filamentov (TPP)
    s poreklom iz Indije in o zaključku postopka v zvezi z uvozom TPP s poreklom
    iz Indonezije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2094/2002 del Consejo, de 26 de noviembre de 2002,
    por el que se establece un derecho compensatorio definitivo sobre las importaciones
    de hilados texturados de filamentos de poliéster (HTP) originarias de la India
    y se da por concluido el procedimiento referente a las importaciones de HTP originarias
    de Indonesia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2094/2002 av den 26 november 2002 om införande
    av en slutgiltig utjämningstull på import av texturerat filamentgarn av polyestrar
    med ursprung i Indien och om avslutande av förfarandet avseende import av texturerat
    filamentgarn av polyestrar med ursprung i Indonesien
