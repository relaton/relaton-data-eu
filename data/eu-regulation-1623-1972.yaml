id: EURegulation16231972
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1623/72 of the Commission of 28 July 1972 fixing withdrawal
    prices for the fishery products listed in Annex I (A) and (C) to Regulation (EEC)
    No 2142/70 and conversion factors to be used to calculate the indemnity and financial
    compensation for fishery products withdrawn from the market and the buying-in
    prices for sardines and anchovies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1623/72 de la Commission, du 28 juillet 1972, fixant,
    pour les produits de la pêche énumérés à l'annexe I sous A et C du règlement
    (CEE) n° 2142/70, les prix de retrait ainsi que les coefficients d'adaptation
    servant au calcul des indemnités et des compensations financières pour les produits
    de la pêche retirés du marché et au calcul des prix d'achat des sardines et
    des anchois
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1623/72 der Kommission vom 28. Juli 1972 über die
    Festsetzung der Rücknahmepreise für die im Anhang I unter A und C der Verordnung
    (EWG) Nr. 2142/70 aufgeführten Fischereierzeugnisse sowie der Anpassungskoeffizienten
    für die Berechnung der Entschädigungen und des finanziellen Ausgleichs für
    aus dem Handel genommene Fischereierzeugnisse und die Berechnung der Ankaufspreise
    von Sardinen und Sardellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1623/72 af 28. juli 1972 om fastsættelse
    for de i bilag I, afsnit A og C, til forordning (EØF) nr. 2142/70 nævnte fiskerivarer
    af tilbagetagelsespriser samt af tilpasningskoefficienterne til brug ved beregning
    af godtgørelser og af den finansielle udligning for fiskerivarer, der fjernes
    fra handelen, samt ved beregning af indkøbsprisen for sardiner og ansjoser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1623/72 della Commissione, del 28 luglio 1972, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, del regolamento
    (CEE) n. 2142/70, i prezzi di ritiro e i coefficienti di adattamento che servono
    per il calcolo delle indennità e delle compensazioni finanziarie per i prodotti
    della pesca ritirati dal mercato, nonché per il calcolo dei prezzi d'acquisto
    delle sardine e della acciughe
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1623/72 van de Commissie van 28 juli 1972 tot vaststelling,
    voor de in bijlage I, sub A en C, van Verordening (EEG) nr. 2142/70 vermelde visserijprodukten,
    van de ophoudprijzen en de aanpassingscoëfficiënten voor de berekening van de
    financiële vergoedingen voor uit de markt genomen visserijprodukten en voor de
    berekening van de aankoopprijs van sardines en ansjovis
  type: main
