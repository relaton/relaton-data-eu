title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1539/79 of 23 July 1979 re-establishing
    the levying of customs duties on screws for wood, falling within subheading 73.32
    ex B, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1539/79 de la Commission, du 23 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois,
    de la sous-position 73.32 ex B du tarif douanier commun, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1539/79 der Kommission vom 23. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Schrauben mit Holzgewinde der Tarifstelle 73.32 ex B mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1539/79 af 23. juli 1979 om genindførelse
    af opkrævning af toldafgifter for træskruer, under underposition 73.32 ex B,
    som har oprindelse i Hongkong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1539/79 della Commissione, del 23 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle viti per legno, della
    sottovoce 73.32 ex B della tariffa doganale comune, originari di Hong Kong beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1539/79 van de Commissie van 23 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op houtschroeven,
    van post 73.32 ex B, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
