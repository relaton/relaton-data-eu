- language: en
  script: Latn
  content: Council Regulation (EC) No 101/2006 of 20 January 2006 amending Regulations
    (EC) No 1975/2004 and (EC) No 1976/2004 extending definitive anti-dumping and
    countervailing duties on imports of polyethylene terephthalate (PET) film originating
    in India, to imports of polyethylene terephthalate (PET) film consigned from Brazil
    and from Israel, whether declared as originating in Brazil or Israel or not
  type: main
- language: fr
