    règlements (CE) n o 1975/2004 et (CE) n o 1976/2004 portant extension des droits
    antidumping et compensateurs définitifs appliqués aux importations de feuilles
    en polyéthylène téréphtalate (PET) originaires de l'Inde, aux importations
    de feuilles en polyéthylène téréphtalate (PET) expédiées du Brésil et d'Israël,
    qu'elles aient ou non été déclarées originaires de ces pays
