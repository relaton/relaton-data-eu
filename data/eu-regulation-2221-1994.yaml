    2309 90 31 and 2309 90 41 provided for in the Interim Agreement on trade and trade-related
    matters concluded with Bulgaria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2221/94 de la Commission du 13 septembre 1994 modifiant
