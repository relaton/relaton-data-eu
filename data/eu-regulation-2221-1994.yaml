    d'un contingent de préparations des types utilisés pour l'alimentation des animaux
    relevant des codes NC 2309 90 31 et 2309 90 41, prévu à l'accord intérimaire
    sur le commerce et les mesures d'accompagnement avec la Bulgarie
  type: main
