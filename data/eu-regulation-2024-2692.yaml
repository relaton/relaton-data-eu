  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2692 of 17 October 2024 amending
    Annexes I and VIII to Implementing Regulation (EU) 2021/620 as regards the approval
    or withdrawal of the disease-free status of certain Member States or zones thereof
    as regards certain listed diseases and the approval of eradication programmes
    for certain listed diseases
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2692 de la Commission du 17 octobre
    2024 modifiant les annexes I et VIII du règlement d’exécution (UE) 2021/620
    en ce qui concerne l’approbation ou le retrait du statut indemne de maladie
    de certains États membres ou de zones de ceux-ci pour certaines maladies répertoriées
    et l’approbation de programmes d’éradication de certaines maladies répertoriées
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2692 der Kommission vom 17. Oktober
    2024 zur Änderung der Anhänge I und VIII der Durchführungsverordnung (EU) 2021/620
    hinsichtlich der Genehmigung und der Aberkennung des Status seuchenfrei für bestimmte
    Mitgliedstaaten oder Zonen dieser Mitgliedstaaten in Bezug auf bestimmte gelistete
    Seuchen und hinsichtlich der Genehmigung von Tilgungsprogrammen für bestimmte
    gelistete Seuchen
  type: main
