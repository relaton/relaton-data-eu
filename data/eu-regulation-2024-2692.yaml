  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2692 della Commissione, del 17 ottobre
    2024, recante modifica degli allegati I e VIII del regolamento di esecuzione (UE)
    2021/620 per quanto riguarda l’approvazione o il ritiro dello status di indenne
