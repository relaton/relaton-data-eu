title:
- language: en
  script: Latn
  content: '82/185/EEC: Commission Decision of 26 February 1982 establishing that
    the apparatus described as ''Perkin- Elmer - differential scanning calorimeter,
    model DSC-2'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/185/CEE: Décision de la Commission, du 26 février 1982, constatant
    que l''importation de l''appareil dénommé "Perkin Elmer - Differential Scanning
    Calorimeter, model DSC-2" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/185/EWG: Entscheidung der Kommission vom 26. Februar 1982, mit der
    festgestellt wird, daß das Gerät ,,PERKIN- ELMER-Differential Scanning Calorimeter,
    model DSC-2" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/185/EØF: Kommissionens beslutning af 26. februar 1982 om fastslåelse
    af, at indførsel af apparatet "PERKIN ELMER - Differential Scanning Calorimeter,
    model DSC-2" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
