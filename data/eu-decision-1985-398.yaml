type: standard
title:
- language: en
  script: Latn
  content: '85/398/EEC: Commission Decision of 1 July 1985 authorizing the Italian
    Republic to extend intra- Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/398/CEE: Décision de la Commission du 1er juillet 1985 autorisant
    la République italienne à proroger les mesures de surveillance intracommunautaires
    à l''égard des importations de bananes originaires de certains pays tiers et
    mises en libre pratique dans les autres États membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/398/EWG: Entscheidung der Kommission vom 1. Juli 1985, mit der die
    Italienische Republik zur Verlängerung der innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Bananen ermächtigt wird (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/398/EØF: Kommissionens beslutning af 1. juli 1985 om bemyndigelse
    af Den italienske Republik til at forlænge gyldighedsperioden for foranstaltninger
    med henblik på tilsyn inden for Fællesskabet med indførsel af bananer, der
    har oprindelse i visse tredjelande, og som er overgået til fri omsætning i de
    øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/398/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Ιουλίου
    1985 για τη χορήγηση άδειας στην Ιταλική Δημοκρατία
    να παρατείνει τα μέτρα ενδοκοινοτικής επίβλεψης
    έναντι των εισαγωγών μπανανών, καταγωγής ορισμένων
    τρίτων χωρών, οι οποίες τίθενται σε κυκλοφορία
    στα άλλα κράτη μέλη (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/398/CEE: Decisione della Commissione del 1o luglio 1985 che autorizza
    la Repubblica italiana a prorogare le misure di sorveglianza intracomunitarie
    sulle importazioni delle banane originarie di taluni paesi terzi messi in libera
    pratica negli altri stati membri (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '85/398/EEG: Beschikking van de Commissie van 1 juli 1985 waarbij de Italiaanse
    Republiek wordt gemachtigd de maatregelen inzake intracommunautair toezicht ten
    aanzien van de invoer van bananen, van oorsprong uit bepaalde derde landen en
    in de andere Lid-Staten in het vrije verkeer gebracht, te verlengen (Slechts de
    tekst in de Italiaanse taal is authentiek)'
  type: main
