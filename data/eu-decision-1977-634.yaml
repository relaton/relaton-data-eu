id: EUDecision1977634
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 April 1977 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of cotton unbleached, falling within
    heading No ex 55.09 of the Common Customs Tariff, originating in the Republic
    of Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/634/CEE: Décision de la Commission, du 6 avril 1977, autorisant la
    République italienne à exclure du traitement communautaire les tissus de coton
    écrus, de la position Ex 55.09 du Tarif douanier commun, originaires de la République
    de Corée et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. April 1977, mit der die Italienische
    Republik ermächtigt wird, aus der Republik Korea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle der Tarifnummer
    ex 55.09 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. april 1977 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af bomuld,
    ublegede, som henhører under pos. ex 55.09 i den fælles toldtarif, har oprindelse
    i republikken Korea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 aprile 1977, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone greggi della
    voce ex 55.09 della tariffa doganale comune originari della Repubblica di Corea
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 april 1977 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van katoen, ongebleekt, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Republiek Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
