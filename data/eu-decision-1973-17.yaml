---
id: EUDecision197317
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 January 1973 authorizing the Federal Republic
    of Germany not to apply Community treatment to asparagus prepared or preserved
    otherwise than by vinegar or by acetic acid falling within heading No 20.02 D
    of the Common Customs Tariff, originating in Taiwan and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/17/CEE de la Commission, du 22 janvier 1973, autorisant la
    République fédérale d'Allemagne à exclure du traitement communautaire les
    asperges préparées ou conservées sans vinaigre ou acide acétique, de la position
    20.02 D du Tarif douanier commun, originaires de Taiwan et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Januar 1973, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Taiwan stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Spargel, ohne Essig zubereitet oder haltbar gemacht,
    der Tarifnummer 20.02 D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. januar 1973 om bemyndigelse af Forbundsrepubliken
    Tyskland til fra fællesskabsbehandling at undtage asparges, tilberedt eller konserveret
    på anden måde end i eddike eller eddikesyre, som henhører under position 20.02
    D i den fælles toldtarif, har oprindelse i Taiwan og overgår til fri omsætning
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 gennaio 1973, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario gli asparagi preparati
    o conservati senza aceto o acido acetico della voce n. 20.02 D della tariffa doganale
    comune, originari di Taïwan e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 januari 1973 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd asperges, bereid of verduurzaamd, zonder azijn of azijnzuur
    van post 20.02 D van het gemeenschappelijk douanetarief, van oorsprong uit Taïwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
