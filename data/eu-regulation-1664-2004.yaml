    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2004 pour certains produits du secteur de la viande de volaille dans
    le cadre du règlement (CE) n° 2497/96 peuvent être acceptées
  type: main
- language: de
  script: Latn
