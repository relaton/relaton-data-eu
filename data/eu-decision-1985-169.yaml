title:
- language: en
  script: Latn
  content: '85/169/EEC: Commission Decision of 14 February 1985 repealing Commission
    Decision 82/649/EEC and establishing that the apparatus described as ''Apollo
    - Tunable CO2 Laser, model 560'' may be imported free of import duties'
  type: main
- language: fr
  script: Latn
  content: '85/169/CEE: Décision de la Commission du 14 février 1985 abrogeant la
    décision 82/649/CEE de la Commission et constatant que l''appareil dénommé
    "Apollo - Tunable CO2 laser, model 560" peut être importé en franchise des droits
    à l''importation'
  type: main
- language: de
  script: Latn
  content: '85/169/EWG: Entscheidung der Kommission vom 14. Februar 1985 mit der die
    Entscheidung 82/649/EWG der Kommission aufgehoben und festgestellt wird, daß
    das Gerät ,,Apollo - Tunable CO2 Laser, Modell 560" unter Befreiung von den Einfuhrabgaben
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '85/169/EØF: Kommissionens beslutning af 14. februar 1985 om ophævelse
    af Kommissionens beslutning 82/649/EØF og om fastslåelse af, at apparatet "Apollo
    - Turntable CO2 laser, model 560" kan indføres med fritagelse for importafgifter'
  type: main
- language: el
  script: Grek
  content: '85/169/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
