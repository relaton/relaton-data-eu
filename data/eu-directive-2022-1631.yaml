---
id: EUDirective20221631
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/1631 of 12 May 2022 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of lead in bismuth strontium calcium copper oxide superconductor
    cables and wires and lead in their electrical connections
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/1631 de la Commission du 12 mai 2022 modifiant,
    aux fins de son adaptation au progrès scientifique et technique, l’annexe IV
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative à l’utilisation du plomb dans les câbles et fils supraconducteurs
    en oxyde de bismuth-strontium-calcium-cuivre et dans leurs connexions électriques
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/1631 der Kommission vom 12. Mai 2022 zur
    Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs IV der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Blei in Bismut-Strontium-Calcium-Kupferoxid-Supraleiterkabeln
    und -drähten und Blei in deren elektrischen Verbindungen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/1631 на Комисията
    от 12 май 2022 година за изменение, с цел привеждане
    в съответствие с научно-техническия напредък,
    на приложение IV към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета по отношение на освобождаване
    от ограничението за употреба на олово в свръхпроводящи
    кабели и проводници с бисмутов калциев меден
    стронциев оксид и олово в електрическите им
    връзки
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2022/1631 ze dne 12. května
    2022, kterou se pro účely přizpůsobení vědeckému a technickému pokroku
    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití olova v supravodivých kabelech a vodičích z bismuthum-stroncium-kalcium-kuprum-oxidu
    a olova v jejich elektrických spojích
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2022/1631 af 12. maj 2022 om ændring,
    med henblik på tilpasning til den videnskabelige og tekniske udvikling, af bilag
    IV til Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår
    en undtagelse for anvendelse af bly i superledende kabler og tråde af bismuth-strontium-calcium-kobberoxid
    (BSCCO) samt i tilhørende elektriske forbindelser
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση οδηγία (ΕΕ) 2022/1631 της
    Επιτροπής της 12ης Μαΐου 2022 για την τροποποίηση,
    προς τον σκοπό της προσαρμογής στην επιστημονική
    και τεχνική πρόοδο, του παραρτήματος IV της
    οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά την εξαίρεση
    για τη χρήση μολύβδου σε υπεραγώγιμα καλώδια
    και σύρματα οξειδίου του χαλκού–ασβεστίου–στροντίου–βισμουθίου
    και στις ηλεκτρικές συνδέσεις αυτών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2022/1631, 12. mai 2022, millega
    muudetakse teaduse ja tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi
    ja nõukogu direktiivi 2011/65/EL IV lisa seoses erandiga, mis hõlmab plii kasutamist
    vismut-strontsium-kaltsium-vaskoksiidist ülijuhtivates kaablites ja traatides
    ning nende elektriühendustes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2022/1631, annettu 12 päivänä toukokuuta
    2022, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tieteen ja tekniikan kehitykseen siltä osin kuin on kyse
    poikkeuksen myöntämisestä lyijyn käytölle suprajohtavissa kaapeleissa ja
    johdoissa käytettävässä vismutti-strontium-kalsium-kupari-oksidissa ja lyijyn
    käytölle niiden sähköisissä liitännöissä
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/1631 ón gCoimisiún an 12 Bealtaine 2022 lena
    leasaítear, chun í a chur in oiriúint don dul chun cinn teicniúil agus eolaíoch,
    Iarscríbhinn IV a ghabhann le Treoir 2011/65/AE ó Pharlaimint na hEorpa agus
    ón gComhairle a mhéid a bhaineann le díolúine i leith úsáid luaidhe i gcáblaí
    agus sreanga forsheoltacha ocsaíd chopair chailciam strointiam biosmait agus
    luaidhe ina naisc leictreacha
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1631 оd 12. svibnja 2022. o izmjeni,
    u svrhu prilagodbe znanstvenom i tehničkom napretku, Priloga IV. Direktivi 2011/65/EU
    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu olova u supravodljivim
    kabelima i žicama od bizmut-stroncij-kalcij-bakrova oksida te olova u njihovim
    električnim priključcima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1631 felhatalmazáson alapuló irányelve (2022.
    május 12.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a tudományos és műszaki fejlődéshez történő hozzáigazítás céljából,
    az ólom bizmut-stroncium-kalcium-réz-oxid szupravezető kábelekben és huzalokban,
    valamint ezek elektromos csatlakozásaiban való használatára vonatkozó mentesség
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/1631 della Commissione del 12 maggio 2022
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato IV
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione riguardante l’uso del piombo sia nei cavi e nei fili superconduttori
    di ossido di bismuto stronzio calcio e rame sia nelle pertinenti connessioni elettriche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/1631 (2022. gada 12. maijs),
    ar ko attiecībā uz atbrīvojumu, kas bismuta stroncija kalcija vara oksīda
    supravadītāju kabeļos un vados, kā arī šo kabeļu un vadu elektriskajos
    savienojumos atļauj izmantot svinu, groza Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu, to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/1631 2022 m. gegužės 12 d.
    kuria, derinant prie mokslo ir technikos pažangos, dėl išimties, kuria šviną
    leidžiama naudoti bismuto, stroncio ir kalcio kuprato superlaidžiuosiuose kabeliuose
    bei laiduose ir jų elektros jungtyse, iš dalies keičiamas Europos Parlamento
    ir Tarybos direktyvos 2011/65/ES IV priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/1631 tat-12 ta’ Mejju 2022
    li temenda, għall-finijiet tal-adattament għall-progress xjentifiku u tekniku,
    l-Anness IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ eżenzjoni għall-użu taċ-ċomb fil-kejbils u l-wajers tas-superkondutturi
    tal-ossidu tal-bismut, stronzju, kalċju u ram u ċ-ċomb fil-konnessjonijiet
    elettriċi tagħhom
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/1631 van de Commissie van 12 mei 2022
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage IV bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad wat betreft een vrijstelling voor het gebruik van lood in supergeleidende
    bismutstrontiumcalciumkoperoxide-kabels en -draden en van lood in de elektrische
    verbindingen daarvan
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/1631 z dnia 12 maja 2022 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik IV do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania ołowiu w kablach i przewodach nadprzewodzących z tlenków bizmutowo-strontowo-wapniowo-miedziowych
    oraz ołowiu w ich połączeniach elektrycznych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/1631 da Comissão de 12 de maio de 2022 que
    altera, para efeitos de adaptação ao progresso científico e técnico, o anexo
    IV da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante a
    uma isenção relativa à utilização de chumbo em cabos e fios supercondutores
    de óxido de bismuto, estrôncio, cálcio e cobre e nas respetivas ligações
    elétricas
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/1631 a Comisiei din 12 mai 2022 de modificare,
    în scopul adaptării la progresele științifice și tehnice, a anexei IV la
    Directiva 2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește
    o derogare pentru utilizarea plumbului în cablurile și firele superconductoare
    din oxid de bismut, stronțiu, calciu și cupru și în conexiunile lor electrice
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/1631 z 12. mája 2022, ktorou sa
    na účely prispôsobenia vedeckému a technickému pokroku mení príloha IV
    k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku z
    používania olova v supravodivých kábloch a drôtoch obsahujúcich zlúčeniny
    oxidov bizmutu, stroncia, vápnika a medi a výnimku z používania olova v ich
    elektrických spojoch
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/1631 z dne 12. maja 2022 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo svinca v superprevodnih kablih in žicah BSCCO (bizmutov, stroncijev,
    kalcijev, bakrov oksid) ter svinca v njihovih električnih povezavah zaradi prilagoditve
    znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/1631 de la Comisión de 12 de mayo de 2022
    por la que se modifica, para adaptarlo al progreso científico y técnico, el
    anexo IV de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo, por
    lo que respecta a una exención relativa al uso de plomo en cables e hilos superconductores
    de óxido de bismuto, estroncio, calcio y cobre y en sus conexiones eléctricas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/1631 av den 12 maj 2022 om
    ändring, för anpassning till den vetenskapliga och tekniska utvecklingen, av
    bilaga IV till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av bly i supraledande kablar och ledningar av vismutstrontiumkalciumkopparoxid
    och bly i elektriska anslutningar till dessa
  type: main
