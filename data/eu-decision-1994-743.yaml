    of the Protocol establishing, for the period 1 July 1994 to 30 June 1997, the
    fishing rights and financial compensation provided for in the Agreement between
    the European Economic Community and the Government of the Republic of Equatorial
    Guinea on fishing off the coast of Equatorial Guinea'
  type: main
- language: fr
