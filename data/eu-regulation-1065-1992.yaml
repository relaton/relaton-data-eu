title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1065/92 of 29 April 1992 amending for the
    second time Regulation (EEC) No 2282/90 laying down detailed rules for increasing
    the consumption and utilization of apples and the consumption of citrus fruit
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1065/92 de la Commission du 29 avril 1992 modifiant
    pour la deuxième fois le règlement (CEE) n 2282/90 portant modalités d'application
    des mesures destinées à accroître la consommation et l'utilisation de pommes
    ainsi que la consommation d'agrumes
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1065/92 DER KOMMISSION vom 29. April 1992 zur zweiten
    Änderung der Verordnung (EWG) Nr. 2282/90 mit Bestimmungen zur Durchführung
    von Maßnahmen zur Steigerung des Verbrauchs und der Verwendung von Äpfeln sowie
    des Verbrauchs von Zitrusfrüchten #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1065/92 af 29. april 1992 om anden
    ændring af forordning (EØF) nr. 2282/90 om gennemførelsesbestemmelser for foranstaltninger
    med henblik på at øge forbruget og anvendelsen af æbler samt forbruget af citrusfrugter
    #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1065/92 της Επιτροπής
    της 29ης Απριλίου 1992 περί δευτέρας τροποποιήσεως
    του κανονισμού (ΕΟΚ) αριθ. 2282/90 περί λεπτομερειών
    εφαρμογής των μέτρων που προορίζονται να αυξήσουν
    την κατανάλωση και τη χρήση μήλων καθώς και
    την κατανάλωση των εσπεριδοειδών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1065/92, annettu 29 päivänä huhtikuuta 1992,
    yksityiskohtaisista säännöistä omenien kulutuksen ja käytön sekä sitrushedelmien
    kulutuksen lisäämiseksi tarkoitettujen toimenpiteiden soveltamisesta annetun
    asetuksen (ETY) N:o 2282/90 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1065/92 DELLA COMMISSIONE del 29 aprile 1992 recante
    seconda modifica del regolamento (CEE) n. 2282/90 recante modalità di applicazione
    delle misure intese ad aumentare il consumo e l'' uso delle mele nonché il consumo
    degli agrumi #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1065/92 VAN DE COMMISSIE van 29 april 1992 tot wijziging
    van Verordening (EEG) nr. 2282/90 houdende bepalingen ter uitvoering van de maatregelen
    om de consumptie en het gebruik van appelen en de citrusconsumptie te doen toenemen
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1065/92 DA COMISSÃO de 29 de Abril de 1992 que altera,
    pela segunda vez, o Regulamento (CEE) no 2282/90, que estabelece as regras de
    execução das medidas destinadas a aumentar o consumo e a utilização de maças,
    bem como o consumo de citrinos #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 1065/92 DE LA COMISIÓN de 29 de abril de 1992 que
