title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1963/78 of 11 August 1978 re-establishing
    the levying of customs duties on chamois-dressed leather, falling within heading
    No 41.06 and originating in India, to which the preferential tariff arrangements
    set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1963/78 de la Commission, du 11 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux cuirs et
    peaux chamoises de la position tarifaire 41.06, originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1963/78 der Kommission vom 11. August 1978 zur Wiedereinführung
    des Zollsatzes für Sämischleder (Chamoisleder) der Tarifnummer 41.06 mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1963/78 af 11. august 1978 om genindførelse
    af opkrævning af toldafgifter for semsgarvet læder (vaskeskind), under position
    41.06, som har oprindelse i Indien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1963/78 della Commissione, dell'11 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili al cuoio e pelli, scamosciati,
    della voce 41.06 della tariffa doganale comune, originari dell'India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1963/78 van de Commissie van 11 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zeemleder,
    van post 41.06, van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG)
    nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
