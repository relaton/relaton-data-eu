title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2020/360 of 17 December 2019 amending,
    for the purposes of adapting to scientific and technical progress, Annex IV to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for lead in platinized platinum electrodes used for certain conductivity
    measurements
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2020/360 de la Commission du 17 décembre 2019
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    IV de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au plomb dans les électrodes en platine platiné utilisées
    pour certaines mesures de conductivité
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2020/360 der kommission vom 17. Dezember 2019
