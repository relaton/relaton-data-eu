    mění příloha IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro olovo v poplatinovaných platinových elektrodách používaných
    k některým měřením vodivosti
  type: main
- language: da
  script: Latn
