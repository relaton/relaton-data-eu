title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 929/83 of 19 April 1983 re-establishing
    the levying of customs duties on floor cloths, dish cloths, dusters and the like,
    other than knitted or crocheted, products of category 113 (code 1130), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 929/83 de la Commission du 19 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux torchons, serpillières,
    lavettes et chamoisettes, autres qu' en bonneterie, de la catégorie de produits
    no 113 (code 1130), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 929/83 der Kommission vom 19. April 1983 über die
    Wiedereinführung des Zollsatzes für Scheuertücher, Wischtücher, Spültücher
    und Staubtücher, andere als aus Gewirken, der Warenkategorie Nr. 113 (Kennziffer
    1130), mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3378/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 929/83 af 19. april 1983 om genindførelse
    af opkrævning af toldafgifter for gulvklude, karklude, støveklude og pudseklude,
    ikke af trikotage, under kategori nr. 113, (kode 1130) som har oprindelse i Kina
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 929/83 της Επιτροπής
    της 19ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για μάκτρα καθαρισμού,
    υφάσματα για τον καθαρισμό δαπέδων, υφάσματα
    για τον καθαρισμό πιατικών και εκκονιστήρια
    τύπου δέρματος αιγάγρου έτερα των πλεκτών,
    των προϊόντων της κατηγορίας 113 (κωδικός αριθμός
    1130), καταγωγής Κίνας, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 929/83 della Commissione del 19 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai torcioni, agli strofinacci, anche
    scamosciati, esclusi quelli a maglia, della categoria di prodotti n. 113 (codice
    1130), originari della Cina, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 929/83 van de Commissie van 19 april 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dweilen, vaatdoeken,
    stofdoeken en poetsdoeken, andere dan die van brei- of haakwerk, van de categorie
    van produkten nr. 113 (codenummer 1130), van oorsprong uit China, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
