type: standard
title:
- language: en
  script: Latn
  content: '79/126/EEC: Commission Decision of 29 January 1979 making trade in crude
    oil and/or petroleum products between Belgium and other Member States, France
    and other Member States and the Netherlands and other Member States subject to
    a system of authorization to be granted automatically by the exporting Member
    State (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/126/CEE: Décision de la Commission, du 29 janvier 1979, subordonnant
    les échanges de pétrole brut et/ou de produits pétroliers entre la Belgique
    et les autres Etats membres, la France et les autres Etats membres et les Pays-Bas
    et les autres Etats membres à un système d''autorisation à accorder automatiquement
    par l''État membre de provenance (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/126/EWG: Entscheidung der Kommission vom 29. Januar 1979 zur Unterstellung
    der Ausfuhren von Rohöl und/oder Erdölerzeugnissen zwischen Belgien und den
    anderen Mitgliedstaaten, Frankreich und den anderen Mitgliedstaaten und den Niederlanden
    und den anderen Mitgliedstaaten unter ein System automatisch erteilter Genehmigungen
    durch den Herkunftsmitgliedstaat (Nur der französische und niederländische Text
    sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/126/EØF: Kommissionens beslutning af 29. januar 1979 om for handelen
    mellem Belgien og de øvrige medlemsstater, mellem Frankrig og de øvrige medlemsstater
    og mellem Nederlandene og de øvrige medlemsstater med mineralolie og/eller mineralolieprodukter
    at indføre en ordning med licenser, som automatisk gives af den udførende medlemsstat
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/126/CEE: Decisione della Commissione, del 29 gennaio 1979, che subordina
    gli scambi di petrolio greggio e/o di prodotti petroliferi fra il Belgio e gli
    altri Stati membri, fra la Francia e gli altri Stati membri e fra i Paesi Bassi
    e gli altri Stati membri ad un sistema di autorizzazioni rilasciate automaticamente
    dallo Stato membro di provenienza (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/126/EEG: Beschikking van de Commissie van 29 januari 1979 waarbij het
    handelsverkeer van ruwe aardolie en/of aardolieprodukten tussen België en de
    andere Lid-Staten, tussen Frankrijk en de andere Lid-Staten en tussen Nederland
    en de andere Lid-Staten wordt onderworpen aan een stelsel van vergunningen die
    automatisch door de Lid-Staat van herkomst moeten worden verleend (Slechts de
    teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
