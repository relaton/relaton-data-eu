    is empowered to contract for the purpose of contributing to the financing of nuclear
    power stations'
  type: main
- language: fr
  script: Latn
  content: '85/537/Euratom: Décision du Conseil du 5 décembre 1985 modifiant la
    décision 77/271/Euratom en ce qui concerne le montant total des emprunts Euratom
    que la Commission est habilitée à contracter en vue d'' une contribution au
    financement des centrales nucléaires de puissance'
  type: main
- language: de
  script: Latn
  content: '85/537/Euratom: Beschluß des Rates vom 5. Dezember 1985 zur Änderung
    des Beschlusses 77/271/Euratom hinsichtlich des Höchstbetrags der Euratom-Anleihen,
    welche die Kommission im Hinblick auf einen Beitrag für die Finanzierung von
    Kernkraftanlagen aufnehmen kann'
  type: main
- language: da
  script: Latn
  content: '85/537/Euratom: Rådets afgørelse af 5. december 1985 om ændring af
