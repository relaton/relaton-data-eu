    2154]'
  type: main
- language: fi
  script: Latn
  content: '2004/261/EY: Komission päätös, tehty 9 päivänä heinäkuuta 2003,
    valtiontuesta N:o C 11/2002 (ex N 382/2001), jonka Italia aikoo myöntää tietyille
    tiekuljetuksiin tarkoitetuille raskaille ajoneuvoille kyseisten kuljetusten siirtämiseksi
    Lago Maggioren valtatieltä 33 moottoritielle A26 (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2003) 2154)'
  type: main
- language: it
  script: Latn
  content: '2004/261/CE: Decisione della Commissione, del 9 luglio 2003, relativa
    all''aiuto di Stato C 11/2002 (ex N 382/2001) al quale l''Italia intende dare
