    Ιουλίου 2003, σχετικά με την κρατική ενίσχυση
    C 11/2002 (ex N 382/2001) την οποία προτίθεται να χορηγήσει
    η Ιταλία για ορισμένα βαρέα φορτηγά οχήματα
    των οδικών εμπορευματικών μεταφορών με σκοπό
    την εκτροπή της κυκλοφορίας από την εθνική
    οδό 33 του Lagο Maggiοre προς τον αυτοκινητόδρομο
