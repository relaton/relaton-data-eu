title:
- language: en
  script: Latn
  content: '2004/261/EC: Commission Decision of 9 July 2003 on the State aid C 11/2002
    (ex N 382/2001) which Italy is planning to implement in favour of certain heavy
    goods vehicles designed for the carriage of goods by road in order to divert heavy
    goods traffic from trunk road 33 (SS 33) from Lake Maggiore to the A26 motorway
    (Text with EEA relevance) (notified under document number C(2003) 2154)'
  type: main
- language: fr
  script: Latn
  content: '2004/261/CE: Décision de la Commission du 9 juillet 2003 concernant l''aide
    d''État C 11/2002 (ex N 382/2001) que l''Italie envisage de mettre à exécution
    en faveur de certains poids lourds affectés au transport routier de marchandises
    afin de dévier leur circulation de la route nationale 33 du lac Majeur vers l''autoroute
    A26 (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro
    C(2003) 2154]'
  type: main
- language: de
  script: Latn
  content: '2004/261/EG: Entscheidung der Kommission vom 9. Juli 2003 über die staatliche
    Beihilfe C 11/2002 (ex N 382/2001), die Italien zugunsten bestimmter Lastkraftwagen
    im Straßengüterverkehr zur Umleitung dieses Verkehrs von der Nationalstraße
    33 des Lago Maggiore auf die Autobahn A26 gewähren will (Text von Bedeutung für
    den EWR) (Bekannt gegeben unter Aktenzeichen K(2003) 2154)'
  type: main
- language: da
  script: Latn
  content: '2004/261/EF: Kommissionens beslutning af 9. juli 2003 om Italiens påtænkte
    statsstøtte C 11/2002 (ex N 382/2001) til fordel for lastvogne til godstransport
    med henblik på en omledning af trafikken fra hovedvej 33 ved Lago Maggiore til
    motorvej A26 (EØS-relevant tekst) (meddelt under nummer K(2003) 2154)'
  type: main
- language: el
  script: Grek
