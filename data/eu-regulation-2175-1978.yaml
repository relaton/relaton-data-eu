title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2175/78 of 18 September 1978 establishing the
    number of licences to be issued to vessels flying the flag of Canada fishing within
    the 200-mile fishing zones of the Member States off the west Greenland coast
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2175/78 du Conseil, du 18 septembre 1978, fixant le
    nombre de licences à délivrer aux navires battant pavillon du Canada et exerçant
    une activité de pêche dans les zones de pêche des États membres s'étendant
    jusqu'à 200 milles situées au large des côtes ouest du Groenland
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2175/78 des Rates vom 18. September 1978 zur Festsetzung
    der Zahl der Lizenzen für Schiffe, die die Flagge Kanadas führen und eine Fangtätigkeit
    in den 200-Meilen-Fischereizonen der Mitgliedstaaten vor den Westküsten Grönlands
    ausüben
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2175/78 af 18. september 1978 om fastsættelse
    af det antal licenser, der skal udstedes til fartøjer, som fører canadisk flag
    og fisker i de af medlemsstaternes 200-sømilezoner, der ligger langs Grønlands
    vestkyst
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2175/78 del Consiglio, del 18 settembre 1978, che
    stabilisce il numero di licenze da rilasciare a pescherecci battenti bandiera
    del Canada che esercitino attività di pesca nelle zone di pesca degli Stati membri,
    estese fino a 200 miglia, nelle acque situate al largo delle coste occidentali
    della Groenlandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2175/78 van de Raad van 18 september 1978 tot vaststelling
    van het aantal vergunningen voor vaartuigen die de vlag van Canada voeren en de
    visserij beoefenen in de visserijzones van de Lid-Staten tot 200 mijl langs de
    westkust van Groenland
  type: main
