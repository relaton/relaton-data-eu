title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2695/95 of 21 November 1995 replacing the
    codes established on the basis of the Common Customs Tariff nomenclature in force
    on 31 December 1987 with those established on the basis of the combined nomenclature
    in certain Regulations concerning the classification of goods
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2695/95 de la Commission, du 21 novembre 1995, remplaçant
    dans certains règlements relatifs au classement de marchandises les codes établis
    sur la base de la nomenclature du tarif douanier commun en vigueur au 31 décembre
    1987 par ceux établis sur la base de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2695/95 der Kommission vom 21. November 1995 mit der
    in bestimmten Verordnungen zur Einreihung von Waren die auf der Basis der am 31.
    Dezember 1987 geltenden Tarifnummern des Schemas des Gemeinsamen Zolltarifs durch
    die Codes der Kombinierten Nomenklatur ersetzt werden
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2695/95 на Комисията от 21 ноември
