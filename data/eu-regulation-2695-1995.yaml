    класирането на стоки по кодовете, установени
    въз основа на номенклатурата на Общата митническа
    тарифа, в сила от 31 декември 1987 година, с кодовете,
    установени въз основа на Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
