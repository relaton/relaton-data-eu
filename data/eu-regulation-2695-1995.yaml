    kódy stanovené na základě nomenklatury společného celního sazebníku platné
    k 31. prosinci 1987 kódy stanovenými na základě kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2695/95 af 21. november 1995 om ændring
