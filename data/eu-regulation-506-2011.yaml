title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 506/2011 of 23 May 2011 amending
    Regulation (EU) No 297/2011 imposing special conditions governing the import of
    feed and food originating in or consigned from Japan following the accident at
    the Fukushima nuclear power station
  type: main
- language: fr
  script: Latn
