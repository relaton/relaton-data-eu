    modifiant le règlement (UE) n ° 297/2011 imposant des conditions particulières
    à l’importation de denrées alimentaires et d’aliments pour animaux originaires
    ou en provenance du Japon à la suite de l’accident survenu dans la centrale
    nucléaire de Fukushima
  type: main
- language: de
  script: Latn
