title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1326/2001 of 29 June 2001 laying down transitional
    measures to permit the changeover to the Regulation of the European Parliament
    and of the Council (EC) No 999/2001 laying down rules for the prevention, control
    and eradication of certain transmissible spongiform encephalopathies, and amending
    Annexes VII and XI to that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1326/2001 de la Commission du 29 juin 2001 établissant
    des mesures transitoires pour le passage au règlement (CE) n° 999/2001 du Parlement
    européen et du Conseil fixant les règles pour la prévention, le contrôle et
    l'éradication de certaines encéphalopathies spongiformes transmissibles, et
    modifiant les annexes VII et XI dudit règlement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1326/2001 der Kommission vom 29. Juni 2001 mit Übergangsmaßnahmen
    zur Erleichterung des Übergangs zur Verordnung (EG) Nr. 999/2001 des Europäischen
    Parlaments und des Rates mit Vorschriften zur Verhütung, Bekämpfung und Tilgung
    bestimmter transmissibler spongiformer Enzephalopathien (TSE) sowie zur Änderung
    der Anhänge VII und XI dieser Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1326/2001 на Комисията от 29
    юни 2001 година за определяне на преходни мерки,
    позволяващи преминаване към Регламент (ЕО)
    № 999/2001 на Европейския парламент и на Съвета
    относно определяне на правилата за превенция,
    контрол и ликвидиране на някои трансмисивни
    спонгиформни енцефалопатии и за изменение
    на приложения VII и IХ към посочения регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1326/2001 ze dne 29. června 2001, kterým
    se stanoví přechodná opatření pro přechod k nařízení Evropského parlamentu
    a Rady (ES) č. 999/2001 o stanovení pravidel pro prevenci, tlumení a eradikaci
    některých přenosných spongiformních encefalopatií a kterým se mění přílohy
    VII a XI uvedeného nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1326/2001 af 29. juni 2001 om fastsættelse
    af overgangsforanstaltninger med henblik på overgang til Europa-Parlamentets
    og Rådets forordning (EF) nr. 999/2001 om fastsættelse af regler for forebyggelse
    af, kontrol med og udryddelse af visse transmissible spongiforme encephalopatier
    og om ændring af bilag VII og XI til forordningen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1326/2001 της Επιτροπής,
    της 29ης Ιουνίου 2001, για τη θέσπιση μεταβατικών
    μέτρων για να επιτραπεί η μετάβαση στον κανονισμό
    (ΕΚ) αριθ. 999/2001 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου για τη θέσπιση κανόνων πρόληψης,
    καταπολέμησης και εξάλειψης ορισμένων μεταδοτικών
    σπογγωδών εγκεφαλοπαθειών, και για την τροποποίηση
    των παραρτημάτων VII και ΧΙ του εν λόγω κανονισμού
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1326/2001, 29. juuni 2001, millega kehtestatakse
    üleminekumeetmed ülemineku võimaldamiseks Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 999/2001, millega kehtestatakse teatava transmissiivse spongioosse entsefalopaatia
    vältimise, kontrolli ja likvideerimise üksikasjalikud eeskirjad, ning muudetakse
    nimetatud määruse VII ja XI lisa
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1326/2001, annettu 29 päivänä kesäkuuta 2001,
    siirtymätoimenpiteistä tiettyjen tarttuvien spongiformisten enkefalopatioiden
    ehkäisyä, valvontaa ja hävittämistä koskevista säännöistä annettuun Euroopan
    parlamentin ja neuvoston asetukseen (EY) N:o 999/2001 siirtymiseksi ja kyseisen
    asetuksen liitteiden VII ja XI muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1326/2001 od 29. lipnja 2001. o utvrđivanju prijelaznih
    mjera za omogućavanje prijelaza na Uredbu Europskog parlamenta i Vijeća (EZ)
    br. 999/2001 o utvrđivanju pravila za sprečavanje, kontrolu i iskorjenjivanje
    određenih transmisivnih spongiformnih encefalopatija, te o izmjeni priloga VII.
    i XI. toj Uredbi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1326/2001/EK rendelete (2001. június 29.) az egyes fertőző
    szivacsos agyvelőbántalmak megelőzésére, az ellenük való védekezésre
    és a felszámolásukra vonatkozó szabályok megállapításáról szóló 999/2001/EK
    európai parlamenti és tanácsi rendeletre való áttérést elősegítő átmeneti
    intézkedések megállapításáról, valamint az említett rendelet VII. és
    XI. fejezetének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1326/2001 della Commissione, del 29 giugno 2001, che
    introduce misure transitorie per consentire il passaggio al regolamento (CE) n.
    999/2001 del Parlamento europeo e del Consiglio recante disposizioni per la prevenzione,
    il controllo e l'eradicazione di alcune encefalopatie spongiformi trasmissibili
    e ne modifica gli allegati VII e XI
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1326/2001 (2001. gada 29. jūnijs), ar kuru nosaka
    pārejas pasākumus, lai varētu piemērot Eiropas Parlamenta un Padomes Regulu
    (EK) Nr. 999/2001, ar ko paredz noteikumus dažu transmisīvo sūkļveida encefalopātiju
    profilaksei, kontrolei un apkarošanai, un groza minētās Regulas VII un XI pielikumu
  type: main
- language: lt
  script: Latn
  content: 2001 m. birželio 29 d. Komisijos reglamentas (EB) Nr. 1326/2001, nustatantis
    pereinamojo laikotarpio priemones, leidžiančias pakeisti Europos Parlamento
    ir Tarybos reglamentą (EB) Nr. 999/2001, nustatantį tam tikrų užkrečiamųjų
    spongiforminių encefalopatijų prevencijos, kontrolės ir likvidavimo taisykles,
    ir iš dalies pakeičiantis šio Reglamento VII ir XI priedus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1326/2001 tad-29 ta’ Ġunju 2001
    li jippreskrivi miżuri transitorji li jippermettu l-bidla għar-Regolament tal-Parlament
    Ewropew u tal-Kunsill (KE) Nru 999/2001 li jistabbilixxi regoli għall-prevenzjoni,
    kontroll u l-qerda ta' xi enċefalopatiji sponġiformi trasmissibbli, u li jemendaw
    l-Annessi VII u XI ta’ dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1326/2001 van de Commissie van 29 juni 2001 tot vaststelling
    van overgangsmaatregelen met het oog op de overgang op Verordening (EG) nr. 999/2001
    van het Europees Parlement en de Raad houdende vaststelling van voorschriften
    inzake preventie, bestrĳding en uitroeiing van bepaalde overdraagbare spongiforme
    encefalopathieën, en tot wĳziging van de bĳlagen VII en XI bĳ die verordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1326/2001 z dnia 29 czerwca 2001 r. ustanawiające
    środki przejściowe, umożliwiające przejście do przepisów rozporządzenia
    Parlamentu Europejskiego i Rady (WE) nr 999/2001 ustanawiającego zasady dotyczące
    zapobiegania, kontroli i zwalczania niektórych przenośnych encefalopatii gąbczastych
    oraz zmieniające załączniki VII i XI do tego rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1326/2001 da Comissão, de 29 de Junho de 2001, que
    adopta medidas transitórias a fim de permitir a passagem para o Regulamento (CE)
    n.° 999/2001 do Parlamento Europeu e do Conselho, que estabelece regras para
    a prevenção, o controlo e a erradicação de determinadas encefalopatias espongiformes
    transmissíveis e altera os seus anexos VII e XI
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1326/2001 al Comisiei din 29 iunie 2001 de stabilire
    a măsurilor tranzitorii pentru a permite trecerea la Regulamentul (CE) nr. 999/2001
    al Parlamentului European și al Consiliului de stabilire a unor reglementări
    pentru prevenirea, controlul și eradicarea anumitor forme transmisibile de encefalopatie
    spongiformă și de modificare a anexelor VII și XI la respectivul regulament
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1326/2001 z 29. júna 2001, stanovujúce prechodné
    opatrenia umožňujúce prechod k nariadeniu Európskeho parlamentu a Rady (ES)
    č. 999/2001, ktoré ustanovuje predpisy pre prevenciu, kontrolu a odstránenie
    niektorých prenosných spongiformných encefalopatií, a ktorým sa menia a dopĺňajú
    prílohy VII a XI uvedeného nariadenia
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1326/2001 z dne 29. junija 2001 o prehodnih ukrepih
    za dovoljenje prehoda na Uredbo Evropskega parlamenta in Sveta (ES) št. 999/2001
    o določitvi predpisov za preprečevanje, nadzor in izkoreninjenje nekaterih transmisivnih
    spongiformnih encefalopatij in spremembi Prilog VII in XI navedene uredbe
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1326/2001 de la Comisión, de 29 de junio de 2001,
    por el que se establecen medidas transitorias para permitir el paso al Reglamento
    (CE) n° 999/2001 del Parlamento Europeo y del Consejo por el que se establecen
    disposiciones para la prevención, el control y la erradicación de determinadas
    encefalopatías espongiformes transmisibles, y se modifican los anexos VII y XI
    de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1326/2001 av den 29 juni 2001 om införande
    av övergångsbestämmelser för att möjliggöra övergången till Europaparlamentets
    och rådets förordning (EG) nr 999/2001 om fastställande av bestämmelser för
    förebyggande, kontroll och utrotning av vissa typer av transmissibel spongiform
