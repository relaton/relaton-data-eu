title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2850/76 of 25 November 1976 on the supply
    of a second lot of skimmed-milk powder to the Italian intervention agency for
    use in accordance with Regulation (EEC) No 563/76, and amending Regulation (EEC)
    No 1948/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2850/76 de la Commission, du 25 novembre 1976, relatif
    à la mise à disposition de l' organisme d' intervention italien d' une deuxième
    tranche de lait écrémé en poudre destiné à être utilisé conformément au
    règlement (CEE) n° 563/76 et modifiant le règlement (CEE) n° 1948/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2850/76 der Kommission vom 25. November 1976 über
    die Versorgung der italienischen Interventionsstelle mit einer zweiten Tranche
    Magermilchpulver, das zur Verwendung gemäß der Verordnung (EWG) Nr. 563/76 bestimmt
    ist, und zur Änderung der Verordnung (EWG) Nr. 1948/76
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2850/76 af 25. november 1976 om det
    italienske interventionsorgans forsyning med anden del af det skummetmælkspulver,
    som skal anvendes i overensstemmelse med forordning (EØF) nr. 563/76, og om ændring
    af forordning (EØF) nr. 1948/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2850/76 della Commissione, del 25 novembre 1976, che
    pone a disposizione dell' organismo d' intervento italiano un secondo quantitativo
    di latte scremato in polvere destinato ad essere utilizzato conformemente al regolamento
    (CEE) n. 563/76 e modifica il regolamento (CEE) n. 1948/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2850/76 van de Commissie van 25 november 1976 inzake
    de terbeschikkingstelling aan het Italiaanse interventiebureau van een tweede
    gedeelte magere-melkpoeder bestemd om te worden gebruikt overeenkomstig Verordening
    (EEG) nr. 563/76 en houdende wijziging van Verordening (EEG) nr. 1948/76
  type: main
