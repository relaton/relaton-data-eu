title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3276/80 of 17 December 1980 amending Regulation
    (EEC) No 2727/80 in respect of the list of Member States authorized to permit
    under certain conditions an additional increase in the alcoholic strength of certain
    wines and certain products intended for wine making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3276/80 de la Commission, du 17 décembre 1980, modifiant
    le règlement (CEE) n° 2727/80 en ce qui concerne la liste des États membres
    autorisés à permettre, sous certaines conditions, une augmentation supplémentaire
    du titre alcoométrique de certains vins et de certains produits destinés à
    l' élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3276/80 der Kommission vom 17. Dezember 1980 zur Änderung
    der Verordnung (EWG) Nr. 2727/80 hinsichtlich der Liste der Mitgliedstaaten, die
    ermächtigt sind, unter bestimmten Voraussetzungen eine zusätzliche Erhöhung
    des Alkoholgehalts bestimmter Weine und bestimmter zur Weinherstellung vorgesehener
    Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3276/80 af 17. december 1980 om ændring
    af forordning (EØF) nr. 2727/80 for så vidt angår fortegnelsen over de medlemsstater,
    der er bemyndiget til under visse omstændigheder at tillade en yderligere forhøjelse
    af alkoholindholdet i visse vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3276/80 τής Επιτροπής
    τής 17ης Δεκεμβρίου 1980 περί συμπληρώσεως τού
    κανονισμού (EOK) αριθ. 2727/80 όσον αφορά τόν κατάλογο
    τών Κρατών μελών τά οποία δύνανται νά επιτρέψουν,
    υπό ορισμένους όρους, μία συμπληρωματική αύξηση
    τού αλκοολικού τίτλου ορισμένων οίνων καί
    ορισμένων προϊόντων πού προορίζονται γιά τήν
    παραγωγή οίνων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3276/80 della Commissione, del 17 dicembre 1980, che
    modifica il regolamento (CEE) n. 2727/80 con un' aggiunta all' elenco degli Stati
    membri autorizzati a permettere, in determinate condizioni, un aumento supplementare
    della gradazione alcolometrica di taluni vini e di taluni prodotti destinati all'
    elaborazione dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3276/80 van de Commissie van 17 december 1980 tot
    wijziging van Verordening (EEG) nr. 2727/80 ten aanzien van de lijst van Lid-Staten
    die zijn gemachtigd om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte
    van bepaalde wijnen en van bepaalde voor de bereiding van wijn bestemde produkten
    toe te staan
  type: main
