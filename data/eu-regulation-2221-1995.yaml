    der Ausfuhr landwirtschaftlicher Erzeugnisse, für die eine Erstattung gewährt
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2221/95 af 20. september 1995 om gennemførelsesbestemmelser
