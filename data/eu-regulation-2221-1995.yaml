    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 386/90 όσον
    αφορά το φυσικό έλεγχο κατά την εξαγωγή γεωργικών
    προϊόντων που τυγχάνουν επιστροφής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2221/95, annettu 20 päivänä syyskuuta 1995,
    neuvoston asetuksen (ETY) N:o 386/90 yksityiskohtaisista soveltamissäännöistä
    tukea saavien maataloustuotteiden viennin yhteydessä tehtävästä fyysisestä
    tarkastuksesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2221/95 della Commissione, del 20 settembre 1995, recante
