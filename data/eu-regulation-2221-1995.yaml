    riguarda il controllo fisico al momento dell'esportazione di prodotti agricoli
    che beneficiano di una restituzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2221/95 van de Commissie van 20 september 1995 houdende
