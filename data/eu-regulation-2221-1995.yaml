    ten aanzien van de fysieke controle bij de uitvoer van voor een restitutie in
    aanmerking komende landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2221/95 da Comissão, de 20 de Setembro de 1995, que
