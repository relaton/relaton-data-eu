title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1735/90 of 21 June 1990 introducing prior
    Community surveillance of imports of certain types of footwear originating in
    South Korea and Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1735/90 de la Commission du 21 juin 1990 instituant
    une surveillance communautaire préalable applicable aux importations de certains
    types de chaussures originaires de la Corée du Sud et de Taiwan
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1735/90 DER KOMMISSION vom 21. Juni 1990 zur Einfuehrung
    einer vorherigen gemeinschaftlichen Ueberwachung der Einfuhren bestimmter Schuharten
    mit Ursprung in Suedkorea und Taiwan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1735/90 af 21. juni 1990 om indførelse
    af forudgående fællesskabstilsyn med importen af visse typer fodtøj med oprindelse
    i Sydkorea og Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1735/90 της Επιτροπής
    της 21ης Ιουνίου 1990 για την πρόβλεψη προηγούμενης
    κοινοτικής επιτήρησης που ισχύει για τις εισαγωγές
    ορισμένων τύπων υποδημάτων καταγωγής Νότιας
    Κορέας και Ταϊβάν
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1735/90 DELLA COMMISSIONE del 21 giugno 1990 che istituisce
    una vigilanza comunitaria preventiva applicabile alle importazioni di taluni tipi
    di calzature originari della Corea del Sud e di Taiwan
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1735/90 VAN DE COMMISSIE van 21 juni 1990 tot instelling
    van voorafgaand communautair toezicht op de invoer van bepaalde soorten schoeisel
    van oorsprong uit Zuid-Korea en Taiwan
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1735/90 DA COMISSAO de 21 de Junho de 1990 que institui
    uma vigilância comunitaria prévia aplicavel às importaçoes de certos tipos
    de calçado originarias da Coreia do Sul e de Taiwan
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1735/90 DE LA COMISION de 21 de junio de 1990 por el
    que se instituye una vigilancia comunitaria previa de las importaciones de determinados
    tipos de calzado originario de Corea del Sur y de Taiwan
