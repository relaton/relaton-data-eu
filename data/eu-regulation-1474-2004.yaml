    del sistema di certificazione del processo di Kimberley per il commercio internazionale
    di diamanti grezzi
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1474/2004 (2004. gada 18. augusts), ar kuru groza
