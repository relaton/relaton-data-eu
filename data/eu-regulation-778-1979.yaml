title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 778/79 of 19 April 1979 re-establishing
    the levying of customs duties on methyl alcohol, falling within subheading 29.04
    A I and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 778/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables à l' alcool
    méthylique, de la sous-position tarifaire 29.04 A I, originaire des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 778/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Methylalkohol der Tarifstelle 29.04 A I, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 778/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for methylalkohol under underposition 29.04 A I,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 778/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili all' alcole metilico della
    sottovoce doganale 29.04 A I, originario dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 778/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor methylalcohol, van post
    29.04 A I, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad tariefpreferenties werden geopend
  type: main
