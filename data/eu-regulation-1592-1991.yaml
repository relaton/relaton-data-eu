title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1592/91 of 12 June 1991 re-establishing
    the levying of customs duties on products of category 90 (order No 40.0900), originating
    in Hungary, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1592/91 de la Commission, du 12 juin 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 90 (numéro d' ordre 40.0900), originaires de la Hongrie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1592/91 der Kommission vom 12. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 90 (laufende
    Nummer 40.0900) mit Ursprung in Ungarn, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1592/91 af 12. juni 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 90 (løbenummer 40.0900),
    som har oprindelse i Ungarn og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1592/91 της Επιτροπής
