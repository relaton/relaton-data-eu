    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    90 (αύξων αριθμός 40.0900), καταγωγής Ουγγαρίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1592/91 della Commissione, del 12 giugno 1991, che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 90 (numero d' ordine 40.0900), originari dell' Ungheria beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1592/91 van de Commissie van 12 juni 1991 houdende
