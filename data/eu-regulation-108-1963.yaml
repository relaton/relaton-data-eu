title:
- language: fr
  script: Latn
  content: Règlement n 108/63/CEE de la Commission, du 27 septembre 1963, portant
    pour la période du 1er octobre an 31 décembre 1963 adaptation et fixation des
    prix d'écluse pour les oeufs de volaille en coquilles et les volailles vivantes
    et abattues et fixation des prélèvements envers les pays tiers pour les oeufs
    de volaille en coquilles, les volailles vivantes d'un poids n'excédant pas 185
    grammes et les volailles abattues
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 108/63/EWG der Kommission vom 27. September 1963 über die
    Anpassung und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel,
    lebendes und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. Oktober bis zum 31. Dezember 1963
  type: main
- language: it
  script: Latn
  content: Regolamento n. 108/63/CEE della Commissione del 27 settembre 1963 che adatta
    e fissa i prezzi limite per le uova di volatili, i volatili da cortile vivi e
    macellati e fissa i prelievi nei confronti dei paesi terzi per le uova in guscio
    di volatili da cortile, per i volatili da cortile vivi di peso non superiore a
    185 grammi e per i volatili da cortile macellati per il periodo 1 ottobre - 31
    dicembre 1963
  type: main
- language: nl
  script: Latn
  content: Verordening no. 108/63/EEG van de Commissie van 27 september 1963 houdende
    aanpassing en vaststelling van de sluisprijzen voor eieren van pluimvee, levend
    pluimvee en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte
    van derde landen op eieren in de schaal van pluimvee, levend pluimvee dat niet
    meer dan 185 gram weegt en geslacht pluimvee voor de periode van 1 oktober tot
    en met 31 december 1963
  type: main
