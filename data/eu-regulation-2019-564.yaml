  script: Latn
  content: Commission Delegated Regulation (EU) 2019/564 of 28 March 2019 amending
    Delegated Regulation (EU) 2016/2251 supplementing Regulation (EU) No 648/2012
    of the European Parliament and of the Council as regards the date until which
    counterparties may continue to apply their risk-management procedures for certain
    OTC derivative contracts not cleared by a CCP
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/564 de la Commission du 28 mars 2019 modifiant
    le règlement délégué (UE) 2016/2251 complétant le règlement (UE) n° 648/2012
    du Parlement européen et du Conseil en ce qui concerne la date jusqu'à laquelle
    les contreparties pourront continuer à appliquer leurs procédures de gestion
    des risques pour certains contrats dérivés de gré à gré non compensés par
    une contrepartie centrale
  type: main
- language: de
