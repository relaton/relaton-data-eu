title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3151/94 of 21 December 1994 introducing a
    further derogation from the detailed rules for the delivery by producers of the
    table wine they are required to deliver for compulsory distillation in respect
    of the 1993/94 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3151/94 de la Commission du 21 décembre 1994 portant
    mesure dérogatoire ultérieure pour la campagne 1993/1994 en matière de livraison
    par les producteurs de leurs quantités de vin de table à livrer au titre de
    la distillation obligatoire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3151/94 DER KOMMISSION vom 21. Dezember 1994 mit einer
    abweichenden Maßnahme betreffend eine zusätzliche Lieferung von Tafelwein im
    Rahmen der obligatorischen Destillation des Wirtschaftsjahres 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3151/94 af 21. december 1994 om en senere
    undtagelsesbestemmelse for produktionsåret 1993/94 om producenters levering af
    bordvin til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3151/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Δεκεμβρίου 1994 για τη θέσπιση μέτρου
    περαιτέρω παρέκκλισης κατά την περίοδο εμπορίας
    1993/94 όσον αφορά την παράδοση από τους παραγωγούς
    των ποσοτήτων επιτραπέζιου οίνου τις οποίες
    πρέπει να παραδώσουν για την υποχρεωτική απόσταξη
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 3151/94, annettu 21 päivänä joulukuuta 1994,
    viinivuotta 1993/1994 koskevasta poikkeusjärjestelystä tuottajien toteuttamien
    pakolliseen tislaukseen toimitettavien pöytäviinimäärien toimitusten osalta.
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3151/94 DELLA COMMISSIONE del 21 dicembre 1994 recante
    ulteriore deroga, per la campagna 1993/1994, in ordine alle consegne di vino da
    tavola conferito dai produttori nel quadro della distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3151/94 VAN DE COMMISSIE van 21 december 1994 tot
    vaststelling van een verdere afwijking voor het wijnoogstjaar 1993/1994 inzake
    de levering door de producenten van de in het kader van de verplichte distillatie
    en de marktondersteuningsdistillatie te leveren hoeveelheden tafelwijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3151/94 DA COMISSÃO de 21 de Dezembro de 1994 que
    estabelece nova medida derrogatória para a campanha de 1993/1994 em matéria
    de entrega pelos produtores de vinhos de mesa a título da destilação obrigatória
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3151/94 DE LA COMISIÓN de 21 de diciembre de 1994
    por el que se establece una excepción a posteriori en relación con la entrega
    por parte de los productores de cantidades de vino de mesa con destino a la destilación
    obligatoria de la campaña 1993/94
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 3151/94 av den 21 december 1994 om ytterligare
