title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2648/84 of 19 September 1984 re-establishing
    the levying of customs duties on other clocks, falling within heading No 91.04
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2648/84 de la Commission du 19 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables aux horloges,
    pendules, réveils et appareils d' horlogerie similaires à mouvement autre que
    de montre, de la position 91.04 du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2648/84 der Kommission vom 19. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für andere Uhren der Tarifnummer 91.04
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2648/84 af 19. september 1984 om genindførelse
    af opkrævning af told for andre ure, henhørende under pos. 91.04 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2648/84 της Επιτροπής
    της 19ης Σεπτεμβρίου 1984 περί αποκαταστάσεως
    της εφαρμογής των δασμών για ωρολόγια μεγάλα,
    εκκρεμή, εγερτήρια και παρόμοιες συσκευές
    ωρολογοποιίας με μηχανισμό διάφορο του μηχανισμού
    των ωρολογίων θυλακίου, της κλάσεως 91.04 του
    Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2648/84 della Commissione del 19 settembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili agli orologi, pendole,
    sveglie e simili apparecchi di orologeria, con movimento diverso da quello degli
    orologi tascabili, della voce 91.04 della tariffa doganale comune, originari della
    Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2648/84 van de Commissie van 19 september 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokken, pendules,
    wekkers en dergelijke artikelen met ander uurwerk dan horloge-uurwerk, van tariefpost
    91.04, van oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3569/83 van
    de Raad vermelde tariefpreferenties zijn verleend
