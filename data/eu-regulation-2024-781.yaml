type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/781 of 5 March 2024 concerning
    the renewal of the authorisation of a preparation of alpha-galactosidase produced
    by Saccharomyces cerevisiae CBS 615.94 and endo-1,4-beta-glucanase produced by
    Aspergillus niger CBS 120604 as a feed additive for chickens for fattening, minor
    poultry species for fattening and chickens reared for laying (holder of authorisation:
    Kerry Ingredients & Flavours Ltd.) and repealing Implementing Regulations (EU)
    No 237/2012 and (EU) No 1365/2013'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/781 de la Commission du 5 mars 2024
    concernant le renouvellement de l’autorisation d’une préparation à base
    d’alpha-galactosidase produite par Saccharomyces cerevisiae CBS 615.94 et d’endo-1,4-bêta-glucanase
    produite par Aspergillus niger CBS 120604 en tant qu’additif pour l’alimentation
    des poulets d’engrais, des espèces aviaires mineures destinées à l’engraissement
    et des poulettes destinées à la ponte (titulaire de l’autorisation: Kerry
    Ingredients & Flavours Ltd) et abrogeant les règlements d’exécution (UE) no
    237/2012 et (UE) no 1365/2013'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/781 der Kommission vom 5. März 2024
    zur Verlängerung der Zulassung einer Zubereitung von alpha-Galactosidase aus
    Saccharomyces cerevisiae CBS 615.94 und Endo–1,4-beta-Glucanase aus Aspergillus
    niger CBS 120604 als Futtermittelzusatzstoff für Masthühner, Mastgeflügelarten
    von geringerer wirtschaftlicher Bedeutung und Junghennen (Zulassungsinhaber: Kerry
    Ingredients & Flavours Ltd.) sowie zur Aufhebung der Durchführungsverordnungen
    (EU) Nr. 237/2012 und (EU) Nr. 1365/2013'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2024/781 на Комисията
    от 5 март 2024 година за подновяване на разрешението
    за употреба на препарат от алфа-галактозидаза,
    получена от Saccharomyces cerevisiae CBS 615.94, и ендо-1,4-бета-глюканаза,
    получена от Aspergillus niger CBS 120604, като фуражна добавка
    за пилета за угояване, видове домашни птици
    с по-малко стопанско значение, за угояване,
    и пилета, отглеждани за носачки (притежател
    на разрешението: Kerry Ingredients & Flavours Ltd.), и за отмяна
    на регламенти за изпълнение (ЕС) № 237/2012 и (ЕС)
    № 1365/2013'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/781 ze dne 5. března 2024 o
    obnovení povolení přípravku z alfa-galaktosidázy zeSaccharomyces cerevisiae
    CBS 615.94 a endo-1,4-beta-glukanázy z Aspergillus niger CBS 120604 jako doplňkové
    látky pro výkrm kuřat, výkrm menšinových druhů drůbeže a odchov kuřic
    (držitel povolení: Kerry Ingredients & Flavours Ltd.) a o zrušení prováděcích
    nařízení (EU) č. 237/2012 a (EU) č. 1365/2013'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2024/781 af 5. marts 2024
    om forlængelse af godkendelsen af et præparat af alfa-galactosidase produceret
    af Saccharomyces cerevisiae CBS 615.94 og endo-1,4-beta-glucanase produceret af
    Aspergillus niger CBS 120604 som fodertilsætningsstof til slagtekyllinger, mindre
    udbredte fjerkræarter bestemt til slagtning og hønniker (indehaver af godkendelsen:
    Kerry Ingredients & Flavours Ltd.) og om ophævelse af gennemførelsesforordning
    (EU) nr. 237/2012 og (EU) nr. 1365/2013'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2024/781 της Επιτροπής,
    της 5ης Μαρτίου 2024, σχετικά με την ανανέωση
    της άδειας του παρασκευάσματος α-γαλακτοσιδάσης
    που παράγεται από Saccharomyces cerevisiae (CBS 615.94) και
    ενδο-1,4-β-γλυκανάσης που παράγεται από Aspergillus
    niger (CBS 120604), ως πρόσθετης ύλης ζωοτροφών για
    τα κοτόπουλα προς πάχυνση, μικρά είδη πουλερικών
    προς πάχυνση και κοτόπουλα που εκτρέφονται
    για ωοπαραγωγή (κάτοχος της άδειας: Kerry Ingredients
    & Flavours Ltd.) και για την κατάργηση των εκτελεστικών
    κανονισμών (ΕΕ) αριθ. 237/2012 και (ΕΕ) αριθ. 1365/2013'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2024/781, 5. märts 2024, milles käsitletakse
    Saccharomyces cerevisiae CBS 615.94 abil toodetud α-galaktosidaasi ja Aspergillus
    niger CBS 120604 abil toodetud endo-1,4-β-glükanaasi preparaadi loa kehtivuse
    pikendamist selle kasutamiseks broilerkanade, vähemlevinud kodulinnuliikide nuumlindude
    ja munalindudeks kasvatatavate noorkanade söödalisandina (loa hoidja: Kerry
    Ingredients & Flavours Ltd.) ning millega tunnistatakse kehtetuks rakendusmäärused
    (EL) nr 237/2012 ja (EL) nr 1365/2013'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2024/781, annettu 5 päivänä
    maaliskuuta 2024, Saccharomyces cerevisiae CBS 615.94:n tuottamaa alfa-galaktosidaasia
    ja Aspergillus niger CBS 120604:n tuottamaa endo-1,4-beeta-glukanaasia sisältävän
    valmisteen hyväksynnän uusimisesta broilerien, toissijaisten lihasiipikarjalajien
    ja kananuorikoiden rehun lisäaineena (hyväksynnän haltija: Kerry Ingredients
    & Flavours Ltd.) ja täytäntöönpanoasetusten (EU) N:o 237/2012 ja (EU) N:o
    1365/2013 kumoamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2024/781 ón gCoimisiún an 5 Márta
    2024 maidir le húdarú ullmhóide d’alfa-galachtóisíodáis arna táirgeadh
    ag Saccharomyces cerevisiae CBS 615.94 agus ion-1,4-béite-ghlúcanáis arna táirgeadh
    ag Aspergillus niger CBS 120604 a athnuachan mar bhreiseán beathaithe le haghaidh
    sicíní lena ramhrú, mionspeicis éanlaithe clóis lena ramhrú agus sicíní
    a thógtar le bheith ina mbéaróga (sealbhóir an údaraithe: Kerry Ingredients
    & Flavours Ltd.) agus lena n-aisghairtear Rialacháin Cur Chun Feidhme (AE) Uimh.
    237/2012 agus (AE) Uimh. 1365/2013'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2024/781 оd 5. ožujka 2024. o produljenju
    odobrenja pripravka alfa-galaktozidaze dobivene od Saccharomyces cerevisiae CBS
    615.94 i endo-1,4-beta-glukanaze dobivene od Aspergillus niger CBS 120604 kao
    dodatka hrani za piliće za tov, manje značajne vrste peradi za tov i piliće
    uzgajane za nesenje (nositelj odobrenja: Kerry Ingredients & Flavours Ltd.) i
    o stavljanju izvan snage provedbenih uredbi (EU) br. 237/2012 i (EU) br. 1365/2013'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2024/781 végrehajtási rendelete (2024. március 5.)
    a Saccharomyces cerevisiae CBS 615.94 által termelt alfa-galaktozidázt és az
    Aspergillus niger CBS 120604 által termelt endo-1,4-béta-glükanázt tartalmazó
    készítmény brojlercsirkék, kevésbé jelentős hízóbaromfifajok és tojójércék
    takarmány-adalékanyagaként való engedélyezésének megújításáról (az
    engedély jogosultja: Kerry Ingredients & Flavours Ltd.), valamint a 237/2012/EU
    és az 1365/2013/EU végrehajtási rendelet hatályon kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2024/781 della Commissione, del 5 marzo
    2024, relativo al rinnovo dell’autorizzazione di un preparato di alfa-galattosidasi
    prodotta da Saccharomyces cerevisiae CBS 615.94 e di endo-1,4-beta-glucanasi prodotta
    da Aspergillus niger CBS 120604 come additivo per mangimi destinati a polli da
    ingrasso, specie avicole minori da ingrasso e pollastre allevate per la produzione
    di uova (titolare dell’autorizzazione: Kerry Ingredients & Flavours Ltd.) e
    che abroga i regolamenti di esecuzione (UE) n. 237/2012 e (UE) n. 1365/2013'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2024/781 (2024. gada 5. marts), ar
    ko atjauno atļauju Saccharomyces cerevisiae CBS 615.94 producētas alfa-galaktozidāzes
    un Aspergillus niger CBS 120604 producētas endo-1,4-beta-glikanāzes preparātu
    izmantot par barības piedevu gaļas cāļiem, mazāk izplatītu sugu gaļas mājputniem
    un dējējvistu cāļiem (atļaujas turētājs: uzņēmums Kerry Ingredients &
    Flavours Ltd.) un atceļ Īstenošanas regulas (ES) Nr. 237/2012 un (ES) Nr. 1365/2013'
  type: main
- language: lt
  script: Latn
  content: 2024 m. kovo 5 d. Komisijos įgyvendinimo reglamentas (ES) 2024/781 dėl
    leidimo naudoti alfa galaktozidazės, gautos iš Saccharomyces cerevisiae CBS
    615.94, ir endo-1,4-beta-gliukanazės, gautos iš Aspergillus niger CBS 120604,
    preparatą kaip mėsinių viščiukų, retesnių rūšių penimų naminių paukščių
    ir dedeklinių vištaičių lesalų priedą atnaujinimo (leidimo turėtoja –
    bendrovė Kerry Ingredients & Flavours Ltd.), kuriuo panaikinami įgyvendinimo
    reglamentai (ES) Nr. 237/2012 ir (ES) Nr. 1365/2013
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/781 tal-5
    ta’ Marzu 2024 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparat tal-alfa-galattożidażi
    prodotta mis-Saccharomyces cerevisiae CBS 615.94 u tal-endo-1,4-beta-glukanażi
    prodotta mill-Aspergillus niger CBS 120604 bħala addittiv tal-għalf għat-tiġieġ
    tas-simna, għall-ispeċijiet minuri tal-pollam tas-simna, u għat-tiġieġ imrobbija
    għall-bajd (detentur tal-awtorizzazzjoni: Kerry Ingredients & Flavours Ltd.)
    u li jħassar ir-Regolamenti ta’ Implimentazzjoni (UE) Nru 237/2012 u (UE) Nru
    1365/2013'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2024/781 van de Commissie van 5 maart 2024
    betreffende de verlenging van de vergunning voor een preparaat van alfa-galactosidase,
    geproduceerd door Saccharomyces cerevisiae (CBS 615.94), en endo-1,4-bèta-glucanase,
    geproduceerd door Aspergillus niger (CBS 120604), als toevoegingsmiddel in diervoeding
    voor mestkippen, mestvogels van minder gangbare pluimveesoorten en opfokleghennen
    (vergunninghouder: Kerry Ingredients and Flavours Ltd) en tot intrekking van de
    Uitvoeringsverordeningen (EU) nr. 237/2012 en (EU) nr. 1365/2013'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2024/781 z dnia 5 marca 2024 r.
    dotyczące przedłużenia zezwolenia na stosowanie preparatu alfa-galaktozydazy
    wytwarzanej przez Saccharomyces cerevisiae CBS 615.94 i endo-1,4-beta-glukanazy
    wytwarzanej przez Aspergillus niger CBS 120604 jako dodatku paszowego dla kurcząt
    rzeźnych, podrzędnych gatunków drobiu rzeźnego i kurcząt odchowywanych na
    kury nioski (posiadacz zezwolenia: Kerry Ingredients & Flavours Ltd.) i uchylające
    rozporządzenia wykonawcze (UE) nr 237/2012 i (UE) nr 1365/2013'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2024/781 da Comissão, de 5 de março de
    2024, relativo à renovação da autorização de uma preparação de alfa-galactosidase
    produzida por Saccharomyces cerevisiae CBS 615.94 e endo-1,4-beta-glucanase produzida
    por Aspergillus niger CBS 120604 como aditivo em alimentos para frangos de engorda,
    espécies menores de aves de capoeira de engorda e frangas criadas para postura
    (detentor da autorização: Kerry Ingredients & Flavours Ltd.) e que revoga os
    Regulamentos de Execução (UE) n.o 237/2012 e (UE) n.o 1365/2013'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2024/781 al Comisiei din 5 martie
    2024 privind reînnoirea autorizării unui preparat de alfa-galactozidază produsă
    de Saccharomyces cerevisiae CBS 615.94 și de endo-1,4-beta-glucanază produsă
    de Aspergillus niger CBS 120604 ca aditiv pentru hrana puilor pentru îngrășare,
    a speciilor minore de păsări de curte pentru îngrășare și a puicuțelor
    crescute pentru ouat (titularul autorizației: Kerry Ingredients &Flavours Ltd.)
    și de abrogare a Regulamentelor de punere în aplicare (UE) nr. 237/2012 și
    (UE) nr. 1365/2013'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2024/781 z 5. marca 2024 o obnovení
    povolenia prípravku s obsahom alfa-galaktozidázy produkovanej mikroorganizmom
    Saccharomyces cerevisiae (CBS 615.94) a endo-1,4-beta-glukanázy produkovanej
    mikroorganizmom Aspergillus niger (CBS 120604) ako kŕmnej doplnkovej látky pre
    kurčatá vo výkrme, menej významné druhy hydiny vo výkrme a pre kurčatá
    chované na znášku (držiteľ povolenia: Kerry Ingredients and Flavours Ltd.)
    a o zrušení vykonávacích nariadení (EÚ) č. 237/2012 a (EÚ) č. 1365/2013'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2024/781 z dne 5. marca 2024 o podaljšanju
    dovoljenja za pripravek iz alfa-galaktozidaze, ki jo proizvaja Saccharomyces cerevisiae
    CBS 615.94, in endo-1,4-beta-glukanaze, ki jo proizvaja Aspergillus niger CBS
    120604, kot krmni dodatek za pitovne piščance, manj pomembne vrste perutnine
    za pitanje in piščance, gojene za nesnice (imetnik dovoljenja: Kerry Ingredients
    & Flavours Ltd.), in razveljavitvi izvedbenih uredb (EU) št. 237/2012 in (EU)
    št. 1365/2013'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2024/781 de la Comisión, de 5 de marzo
    de 2024, relativo a la autorización de un preparado de α-galactosidasa producida
    por Saccharomyces cerevisiae CBS 615.94 y endo-1,4-β-glucanasa producida por
    Aspergillus niger CBS 120604 como aditivo alimentario para pollos de engorde,
    especies menores de aves de corral para engorde y pollitas para puesta (titular
    de la autorización: Kerry Ingredients & Flavours Ltd.) y por el que se derogan
    los Reglamentos de Ejecución (UE) n.o 237/2012 y (UE) n.o 1365/2013'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2024/781 av den 5 mars 2024
    om förlängning av godkännandet av ett preparat av alfa-galaktosidas framställt
    av Saccharomyces cerevisiae CBS 615.94 och endo-1,4-beta-glukanas framställt
    av Aspergillus niger CBS 120604 som fodertillsats för slaktkycklingar, mindre
    vanligt förekommande fjäderfäarter avsedda för slakt och kycklingar som föds
    upp till värphöns (innehavare av godkännandet: Kerry Ingredients & Flavours
    Ltd) och om upphävande av genomförandeförordningarna (EU) nr 237/2012 och (EU)
    nr 1365/2013'
