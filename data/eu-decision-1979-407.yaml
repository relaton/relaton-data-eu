title:
- language: en
  script: Latn
  content: '79/407/EEC: Commission Decision of 3 April 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to cartridges for smooth-bore sporting guns, falling
    within heading No ex 93.07 of the Common Customs Tariff, originating in Czechoslovakia
    and in free circulation in the other Member States (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/407/CEE: Décision de la Commission, du 3 avril 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les cartouches pour armes de chasse à
    canon lisse, de la position ex 93.07 du tarif douanier commun, originaires de
    la Tchécoslovaquie et mises en libre pratique dans les autres États membres
    (Les textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/407/EWG: Entscheidung der Kommission vom 3. April 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Patronen für Jagdwaffen mit glattem Lauf der Tarifnummer
    ex 93.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/407/EØF: Kommissionens beslutning af 3. april 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage patroner til glatløbede jagtvåben,
    som henhører under pos. ex 93.07 i den fælles toldtarif, har oprindelse i Tjekkoslovakiet
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/407/CEE: Decisione della Commissione, del 3 aprile 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le cartucce per armi da caccia a canna
    liscia della voce ex 93.07 della tariffa doganale comune, originarie della Cecoslovacchia
    e messe in libera pratica negli altri Stati membri (I testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/407/EEG: Beschikking van de Commissie van 3 april 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd hagelpatronen voor jachtwapens met gladde loop van post ex 93.07
    van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
