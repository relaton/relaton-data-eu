    Rohzucker, der in den französischen überseeischen Departements erzeugt worden
    ist, vorgesehenen Betrags
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2821/75 af 30. oktober 1975 om fastsættelse
