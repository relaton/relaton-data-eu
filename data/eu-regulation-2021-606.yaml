    (EU) 2021/405 im Hinblick auf die Einträge für Belarus sowie für das Vereinigte
    Königreich und die unmittelbar der englischen Krone unterstehenden Gebiete Guernsey,
    die Insel Man und Jersey in den Listen der Drittländer oder Drittlandsgebiete,
    aus denen der Eingang bestimmter für den menschlichen Verzehr bestimmter Tiere
    und Waren in die Union zugelassen ist
  type: main
