title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/606 of 14 April 2021 amending
    Annex I, Annexes IV to XIII, and Annex XVI to Implementing Regulation (EU) 2021/405
    as regards the entries of Belarus and of the United Kingdom and the Crown Dependencies
    of Guernsey, the Isle of Man and Jersey in the lists of third countries or regions
    thereof authorised for the entry into the Union of certain animals and goods intended
    for human consumption
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/606 de la Commission du 14 avril 2021
    modifiant l’annexe I, les annexes IV à XIII et l’annexe XVI du règlement
    d’exécution (UE) 2021/405 en ce qui concerne les mentions relatives à la Biélorussie
    et au Royaume-Uni ainsi qu’aux dépendances de la Couronne de Guernesey, de
    l’Île de Man et de Jersey dans les listes des pays tiers ou régions de pays
    tiers en provenance desquels l’entrée dans l’Union de certains animaux et
    biens destinés à la consommation humaine est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/606 der Kommission vom 14. April 2021
