  content: '97/466/EC: Commission Decision of 2 July 1997 modifying for the fifth
    time Decision 95/33/EC approving parts of the Finnish programme for the implementation
    of Articles 138 to 140 of the Act concerning the conditions of accession of the
    Republic of Austria, the Republic of Finland and the Kingdom of Sweden (Only the
    Finnish and Swedish texsts are authentic)'
  type: main
- language: fr
  script: Latn
