title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2199/83 of 1 August 1983 re-establishing
    the levying of customs duties on woven overcoats, raincoats and other coats, products
    of category 15 B (code 0155) and originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2199/83 de la Commission du 1er août 1983 portant
    rétablissement de la perception des droits de douane applicables aux manteaux,
    imperméables et vestes, tissés, de la catégorie de produits 15 B (code 0155),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2199/83 der Kommission vom 1. August 1983 über die
    Wiedereinführung des Zollsatzes für Mäntel, Umhänge und Jacken aus Geweben
    der Warenkategorie Nr. 15 B (Kennziffer 0155), mit Ursprung in Pakistan, dem die
    in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2199/83 af 1. august 1983 om genindførelse
    af opkrævning af toldafgifter for frakker, kapper og slag, jakker og blazere,
    vævede, under kategori nr. 15 B (kode 0155), som har oprindelse i Pakistan og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2199/83 της Επιτροπής
    της 1ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα επανωφόρια
    και αδιάβροχα και σακκάκια υφασμένα, προϊόντα
    της κατηγορίας 15 Β (κώδικας 0155), καταγωγής Πακιστάν,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2199/83 della Commissione del 1o agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai cappotti, soprabiti, mantelli
    e simili, tessuti, della categoria di prodotti n. 15 B (codice 0155), originari
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2199/83 van de Commissie van 1 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op mantels,
    regenjassen, blazers en jasjes, geweven, van de categorie van produkten nr. 15
    B (codenummer 0155), van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
