  content: Regulation (EEC) No 2140/73 of the Commission of 3 August 1973 extending
    Regulation (EEC) No 1626/73 establishing Community surveillance over imports from
    Japan of electronic four-operation calculating machines, printing or non-printing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2140/73 de la Commission, du 3 août 1973, prorogeant
    le règlement (CEE) n° 1626/72 portant instauration d'une surveillance communautaire
    des importations en provenance du Japon de machines à calculer électroniques
    à quatre opérations, imprimantes et non imprimantes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2140/73 der Kommission vom 3. August 1973 zur Verlängerung
    der Verordnung (EWG) Nr. 1626/72 über die Einführung einer gemeinschaftlichen
    Überwachung für die Einfuhr aus Japan von elektronischen Vierspeziesrechenmaschinen,
    druckend und nichtdruckend
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2140/73 af 3. august 1973 om forlængelse
    af forordning (EØF) nr. 1626/72 om indførelse af et fællesskabstilsyn med indførsel
    fra Japan af elektroniske regnemaskiner til fire regnearter, skrivende og ikkeskrivende
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2140/73 della Commissione, del 3 agosto 1973, che
    proroga il regolamento (CEE) n. 1626/72, che istituisce una vigilanza comunitaria
    sulle importazioni di calcolatrici elettroniche numeriche, con o senza dispositivo
    stampatore, in provenienza dal Giappone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2140/73 van de Commissie van 3 augustus 1973 houdende
    verlenging van Verordening (EEG) nr. 1626/72 betreffende de instelling van een
    communautair toezicht op de invoer uit Japan van schrijvende en niet-schrijvende
    elektronische rekenmachines welke de vier hoofdbewerkingen uitvoeren
  type: main
