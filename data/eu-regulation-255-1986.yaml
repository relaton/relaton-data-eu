title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 255/86 of 4 February 1986 suspending the
    duties applicable to fresh fishery products originating in Morocco and coming
    from joint fishery ventures set up between natural or legal persons from Portugal
    and Morocco, on the direct landing of such products in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 255/86 de la Commission du 4 février 1986 portant
    suspension des droits applicables aux produits de la pêche fraîche originaires
    du Maroc et provenant des entreprises communes de pêche constituées entre personnes
    physiques ou morales du Portugal et du Maroc, à l' occasion de leur débarquement
    direct au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 255/86 der Kommission vom 4. Februar 1986 zur Aussetzung
    der bei der Direktanlandung in Portugal anzuwendenden Zölle auf frische Fischereierzeugnisse
    mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen zwischen natürlichen
    oder juristischen Personen Portugals und Marokkos
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 255/86 af 4. februar 1986 om suspension
    af tolden på ferske fiskerivarer med oprindelse i Marokko og hidrørende fra
    fællesforetagender, der er oprettet mellem fysiske eller juridiske personer i
    Portugal og i Marokko, i anledning af sådanne varers direkte landing i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 255/86 της Επιτροπής
    της 4ης Φεβρουαρίου 1986 για την αναστολή των
    δασμών που εφαρμόζονται σε νωπά προϊόντα αλιείας
    καταγωγής Μαρόκου τα οποία προέρχονται από
    κοινές αλιευτικές επιχειρήσεις που έχουν συσταθεί
    μεταξύ φυσικών ή νομικών προσώπων της Πορτογαλίας
    και του Μαρόκου, κατά την απευθείας εκφόρτωση
    αυτών των προϊόντων στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 255/86 della Commissione del 4 febbraio 1986 che sospende
    i dazi applicabili ai prodotti freschi della pesca originari del Marocco e provenienti
    da imprese comuni di pesca costituite tra persone fisiche o giuridiche del Portogallo
    e del Marocco, all' atto del loro sbarco diretto in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 255/86 van de Commissie van 4 februari 1986 tot schorsing
    van de rechten voor verse visserijprodukten van oorsprong uit Marokko en afkomstig
    van gemeenschappelijke visserijondernemingen van natuurlijke of rechtspersonen
    uit Portugal en uit Marokko, bij rechtstreekse aanvoer in Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 255/86 da Comissão de 4 de Fevereiro de 1986 que
    suspende os direitos aplicáveis aos produtos da pesca fresca originários de
    Marrocos e provenientes das empresas comuns de pesca constituídas entre pessoas
    singulares ou colectivas de Portugal e de Marrocos, aquando do seu desembarque
    directo em Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 255/86 de la Comisión de 4 de febrero de 1986 por
    el que se suspenden los derechos aplicables a los productos de la pesca fresca
    originarios de Marruecos y procedentes de las empresas comunes de pesca constituidas
    entre personas físicas o jurídicas de Portugal y de Marruecos, con ocasión
    de su desembarco directo en Portugal
