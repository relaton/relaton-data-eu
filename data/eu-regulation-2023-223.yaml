  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2023/223 végrehajtási rendelete (2023. január 27.)
    a Pseudomonas chlororaphis (törzs: MA 342) hatóanyagnak a növényvédő szerek
    forgalomba hozataláról szóló 1107/2009/EK európai parlamenti és tanácsi
    rendelet szerinti jóváhagyása meghosszabbításáról, valamint az 540/2011/EU
    bizottsági végrehajtási rendelet mellékletének módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/223 della Commissione del 27 gennaio
