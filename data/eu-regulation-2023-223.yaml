    zur Erneuerung der Genehmigung für den Wirkstoff Pseudomonas chlororaphis Stamm
    MA 342 gemäß der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments
    und des Rates über das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung
