title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/223 of 27 January 2023 renewing
    the approval of the active substance Pseudomonas chlororaphis strain MA 342 in
    accordance with Regulation (EC) No 1107/2009 of the European Parliament and of
    the Council concerning the placing of plant protection products on the market,
    and amending the Annex to Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/223 de la Commission du 27 janvier
    2023 renouvelant l’approbation de la substance active «Pseudomonas chlororaphis,
    souche MA 342» conformément au règlement (CE) no 1107/2009 du Parlement européen
    et du Conseil concernant la mise sur le marché des produits phytopharmaceutiques,
    et modifiant l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
