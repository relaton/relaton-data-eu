title:
- language: en
  script: Latn
  content: '98/340/EC: Commission Decision of 12 May 1998 amending Decisions 96/716/EC,
    96/717/EC, 96/718/EC, 96/719/EC, 96/720/EC, 96/721/EC and 97/260/EC concerning
    the presentation of supporting and financial documents linked to Community financial
    contributions for certain animal and public health measures (Only the Spanish,
    Danish, French, Dutch and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/340/CE: Décision de la Commission du 12 mai 1998 modifiant les décisions
    96/716/CE, 96/717/CE, 96/718/CE, 96/719/CE, 96/720/CE, 96/721/CE et 97/260/CE
    en ce qui concerne la présentation de pièces techniques et financières justificatives
    liées aux contributions financières de la Communauté pour certaines mesures
    en matière de santé animale et publique (Les textes en langues espagnole, danoise,
    française, néerlandaise et anglaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/340/EG: Entscheidung der Kommission vom 12. Mai 1998 zur Änderung
    der Entscheidungen 96/716/EG, 96/717/EG, 96/718/EG, 96/719/EG, 96/720/EG, 96/721/EG
    und 97/260/EG in bezug auf die Einreichung technischer und finanzieller Belege
    im Zusammenhang mit einer finanziellen Beteiligung der Gemeinschaft an bestimmten
    Maßnahmen im Bereich Gesundheit von Mensch und Tier (Nur der spanische, der dänische,
    der französische, der niederländische und der englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/340/EF: Kommissionens beslutning af 12. maj 1998 om ændring af beslutning
    96/716/EF, 96/717/EF, 96/718/EF, 96/719/EF, 96/720/EF, 96/721/EF og 97/260/EF
    med hensyn til forelæggelse af bilag i forbindelse med EF-tilskud til dyre- og
    folkesundhedsforanstaltninger (Kun de spanske, danske, franske, nederlandske og
    engelske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '98/340/ΕΚ: Απόφαση της Επιτροπής της 12ης Μαΐου
    1998 για την τροποποίηση των αποφάσεων 96/716/ΕΚ,
    96/717/ΕΚ, 96/718/ΕΚ, 96/719/ΕΚ, 96/720/ΕΚ, 96/721/ΕΚ και 97/260/ΕΚ,
    σχετικά με την υποβολή των δικαιολογητικών
    και χρηματοοικονομικών εγγράφων που αφορούν
    τις κοινοτικές χρηματοδοτικές συνδρομές για
    ορισμένα μέτρα στον τομέα της δημόσιας υγείας
    και της υγείας των ζώων (Τα κείμενα στην ισπανική,
    δανική, γαλλική, ολλανδική και αγγλική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '98/340/EY: Komission päätös, tehty 12 päivänä toukokuuta 1998, päätösten
    96/716/EY, 96/717/EY, 96/718/EY, 96/719/EY, 96/720/EY, 96/721/EY ja 97/260/EY
    muuttamisesta tietyille eläinten terveyttä ja kansanterveyttä koskeville toimenpiteille
    maksettavaa yhteisön tukea koskevien tositteiden esittämisen osalta (Ainoastaan
    espanjan-, tanskan-, ranskan-, hollannin- ja englanninkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '98/340/CE: Decisione della Commissione del 12 maggio 1998 che modifica
    le decisioni 96/716/CE, 96/717/CE, 96/718/CE, 96/719/CE, 96/720/CE, 96/721/CE
    e 97/260/CE per quanto concerne la presentazione di documenti giustificativi e
    finanziari connessi al contributo finanziario della Comunità per alcune misure
