    le decisioni 95/467/CE, 96/577/CE, 96/578/CE e 98/598/CE relative alla procedura
    di attestazione di conformità dei prodotti da costruzione a norma dell''articolo
    20, paragrafo 2, della direttiva 89/106/CEE del Consiglio riguardo, rispettivamente,
    ai prodotti a base di gesso, ai sistemi fissi antincendio, ai prodotti igienico-sanitari
    e agli aggregati (Testo rilevante ai fini del SEE) [notificata con il numero C(2002)
    2586]'
  type: main
