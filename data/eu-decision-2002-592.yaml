    i agregatima (priopćena pod brojem dokumenta C(2002) 2586)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. július 15.) az építési termékek megfelelőségének
    a 89/106/EGK tanácsi irányelv 20. cikkének (2) bekezdése szerinti, megfelelően
    a gipsztermékekre, a rögzített tűzoltórendszerekre, a szaniterárukra és
    az adalékanyagokra vonatkozó igazolási eljárásáról szóló 95/467/EK, 96/577/EK,
    96/578/EK és 98/598/EK határozat módosításáról (az értesítés a C(2002)
    2586. számú dokumentummal történt)
  type: main
