    procedūru saskaņā ar Padomes Direktīvas 89/106/EEK 20. panta 2. punktu attiecīgi
    attiecībā uz ģipša izstrādājumiem, stacionārām ugunsdzēsības sistēmām,
    sanitārajām ierīcēm un granulātiem (paziņots ar dokumenta numuru C(2002)
    2586)
  type: main
