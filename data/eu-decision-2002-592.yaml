title:
- language: en
  script: Latn
  content: '2002/592/EC: Commission Decision of 15 July 2002 amending Decisions 95/467/EC,
    96/577/EC, 96/578/EC and 98/598/EC on the procedure for attesting the conformity
    of construction products pursuant to Article 20(2) of Council Directive 89/106/EEC
    as regards gypsum products, fixed fire-fighting systems, sanitary appliances and
    aggregates respectively (Text with EEA relevance) (notified under document number
    C(2002) 2586)'
  type: main
- language: fr
  script: Latn
  content: '2002/592/CE: Décision de la Commission du 15 juillet 2002 modifiant les
    décisions 95/467/CE, 96/577/CE, 96/578/CE et 98/598/CE relatives à la procédure
    d''attestation de la conformité des produits de construction, conformément à
    l''article 20, paragraphe 2, de la directive 89/106/CEE du Conseil en ce qui concerne
    les produits de gypse, les systèmes fixes de lutte contre l''incendie, les appareils
    sanitaires et les granulats (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2002) 2586]'
  type: main
- language: de
  script: Latn
  content: '2002/592/EG: Entscheidung der Kommission vom 15. Juli 2002 zur Änderung
