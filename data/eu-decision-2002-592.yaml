    výrobků podle čl. 20 odst. 2 směrnice Rady 89/106/EHS, pokud jde o výrobky
    ze sádry, stabilní hasicí systémy, vybavení hygienických prostorů a kamenivo
    (oznámeno pod číslem K(2002) 2586)
  type: main
