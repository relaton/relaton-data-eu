    zur Bescheinigung der Konformität von Bauprodukten gemäß Artikel 20 Absatz
    2 der Richtlinie 89/106/EWG des Rates, jeweils betreffend Gipsprodukte, ortsfeste
    Brandbekämpfungssysteme, Sanitäreinrichtungen und Zuschläge (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 2586)'
  type: main
