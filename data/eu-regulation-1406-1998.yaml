    portant suspension de certaines concessions prévues par le règlement (CE) nº
    3066/95 établissant certaines concessions sous forme de contingents tarifaires
    communautaires pour certains produits agricoles et prévoyant une adaptation autonome
    et transitoire de certaines concessions agricoles prévues par les accords européens
    afin de tenir compte de l'accord sur l'agriculture conclu dans le cadre de négociations
    commerciales multilatérales du cycle d'Uruguay
  type: main
