  script: Latn
  content: Nariadenie Komisie (ES) č. 1406/98 z 1. júla 1998, ktorým sa rušia
    opatrenia uvedené v článku 1 nariadenia Rady (ES) č. 703/98 pozastavujúce
    koncesie uvedené v nariadení (ES) č. 3066/95, ktorým sa zavádzajú určité
    koncesie vo forme colných kvót spoločenstva na určité poľnohospodárske
    výrobky a ktorým sa zavádza, ako autonómne a prechodné opatrenie úprava
    určitých poľnohospodárskych koncesií uvedených v Európskych dohodách,
    aby sa zohľadnila dohoda o poľnohospodárstve uzavretá počas mnohostranných
    obchodných rokovaní Uruguajského kola
