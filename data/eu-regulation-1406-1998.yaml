  script: Latn
  content: A Bizottság 1406/98/EK rendelete (1998. július 1.) az egyes mezőgazdasági
    termékekre vonatkozó engedmények közösségi vámkontingens formájában történő
    megállapításáról, valamint a többoldalú kereskedelmi tárgyalások uruguayi
    fordulója során kötött, a mezőgazdaságról szóló megállapodás figyelembevétele
    céljából az Európa-megállapodásokban előírt bizonyos mezőgazdasági engedmények
    önálló és átmeneti intézkedésként történő kiigazításáról szóló
    3066/95/EK rendeletben szereplő egyes engedmények felfüggesztéséről szóló
    703/98/EK tanácsi rendelet 1. cikkében szereplő intézkedések hatályon kívül
    helyezéséről
  type: main
