title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 886/81 of 2 April 1981 amending for the
    fifth time Regulation (EEC) No 2325/80 and for the second time Regulation (EEC)
    No 2391/80 in respect of certain detailed rules for implementing the additional
    measures applicable to holders of long-term storage contracts for table wine for
    the 1979/80 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 886/81 de la Commission, du 2 avril 1981, portant
    cinquième modification du règlement (CEE) n° 2325/80 et deuxième modification
    du règlement (CEE) n° 2391/80 en ce qui concerne certaines modalités d' application
    des mesures complémentaires réservées aux détenteurs de contrats de stockage
    à long terme des vins de table pour la campagne 1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 886/81 der Kommission vom 2. April 1981 zur fünften
    Änderung der Verordnung (EWG) Nr. 2325/80 und zur zweiten Änderung der Verordnung
    (EWG) Nr. 2391/80 über die Durchführung der ergänzenden Maßnahmen für das
    Wirtschaftsjahr 1979/80, die Inhabern langfristiger Lagerverträge für Tafelweine
    vorbehalten sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 886/81 af 2. april 1981 om femte ændring
    af forordning (EØF) nr. 2325/80 og om anden ændring af forordning (EØF) nr.
    2391/80 for så vidt angår visse gennemførelsesbestemmelser for de supplerende
    foranstaltninger, der er forbeholdt indehaverne af langfristede oplagringskontrakter
    for bordvin for produktionsåret 1979/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 886/81 τής Επιτροπής
