    οίνων γιά τήν περίοδο εμπορίας 1979/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 886/81 della Commissione, del 2 aprile 1981, recante
    quinta modifica del regolamento (CEE) n. 2325/80 e seconda modifica del regolamento
    (CEE) n. 2391/80 per quanto riguarda talune modalità d' applicazione delle misure
    complementari riservate ai titolari di contratti di magazzinaggio a lungo termine
    di vini da tavola per la campagna 1979/1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 886/81 van de Commissie van 2 april 1981 houdende
    vijfde wijziging van Verordening (EEG) nr. 2325/80 en houdende tweede wijziging
    van Verordening (EEG) nr. 2391/80 ten aanzien van de bepalingen ter uitvoering
    van de aanvullende maatregelen ten behoeve van degenen die voor het wijnoogstjaar
    1979/1980 langlopende opslagcontracten voor tafelwijn hebben gesloten
