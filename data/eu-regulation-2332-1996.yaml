title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2332/96 of 3 December 1996 establishing,
    for 1997, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2332/96 de la Commission du 3 décembre 1996 établissant
    pour 1997 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2332/96 der Kommission vom 3. Dezember 1996 zur Festlegung
    der Liste für 1997 der Schiffe mit einer Länge über alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 2332/96 af 3. december 1996 om listen
    for 1997 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2332/96 της Επιτροπής
    της 3ης Δεκεμβρίου 1996 που καταρτίζει, για το
    1997, τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2332/96, annettu 3 päivänä joulukuuta 1996,
    luettelon laatimisesta vuodeksi 1997 kokonaispituudeltaan kahdeksan metriä ylittävistä
    aluksista, joilla on lupa kalastaa kielikampelaa tietyillä yhteisön vyöhykkeillä
    kokonaispituudeltaan yhdeksän metriä ylittävien puomitroolien avulla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2332/96 della Commissione del 3 dicembre 1996 che fissa
    l'elenco per il 1997 dei pescherecci di lunghezza fuori tutto superiore a otto
    metri, autorizzati a pescare la sogliola in determinate zone della Comunità utilizzando
    reti a strascico a pali, la cui lunghezza complessiva superi i 9 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2332/96 van de Commissie van 3 december 1996 tot vaststelling
    voor 1997 van de lijst van vaartuigen met een lengte over alles van meer dan 8
    meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale
    boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2332/96 da Comissão de 3 de Dezembro de 1996 que
    estabelece para 1997 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2332/96 de la Comision de 3 de diciembre de 1996 por
    el que se establece, para 1997, la lista de barcos cuya eslora total excede los
    ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2332/96 av den 3 december 1996 om fastställande
    av förteckningen för 1997 över fartyg med en största längd som överstiger
    åtta meter vilka vid fiske efter tunga inom vissa av gemenskapens områden har
    tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger nio
    meter
  type: main
