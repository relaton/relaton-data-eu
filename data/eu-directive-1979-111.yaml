title:
- language: en
  script: Latn
  content: Council Directive 79/111/EEC of 24 January 1979 amending Directive 64/432/EEC
    as regards brucellosis and prolonging, in respect of brucellosis, tuberculosis
    and swine fever, certain derogation measures granted to Denmark, Ireland and the
    United Kingdom
  type: main
- language: fr
  script: Latn
  content: Directive 79/111/CEE du Conseil, du 24 janvier 1979, modifiant la directive
    64/432/CEE en ce qui concerne la brucellose et prorogeant un certain nombre de
    dégorations relatives à la brucellose, à la tuberculose ainsi qu'à la peste
    porcine accordées au Danemark, à l'Irlande et au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Richtlinie 79/111/EWG des Rates vom 24. Januar 1979 zur Änderung der Richtlinie
    64/432/EWG betreffend Brucellose sowie zur Verlängerung der Geltungsdauer einiger
    Ausnahmeregelungen in bezug auf Brucellose, Tuberkulose und Schweinepest für
    Dänemark, Irland und das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 79/111/EØF af 24. januar 1979 om ændring af direktiv
    64/432/EØF om brucellose, og om forlængelse af visse undtagelsesbestemmelser
    vedrørende brucellose, tuberkulose og svinepest for Danmark, Irland og Det forenede
    Kongerige
  type: main
- language: el
  script: Grek
  content: Οδηγία 79/111/ΕΟΚ του Συμβουλίου της 24ης Ιανουαρίου
    1979 περί τροποποιήσεως της οδηγίας 64/432/ΕΟΚ όσον
    αφορά τη βρουκέλλωση και περί παρατάσεως ορισμένου
    αριθμού παρεκκλίσεων που έχουν επιτραπεί στη
    Δανία, Ιρλανδία και Ηνωμένο Βασίλειο, σχετικά
    με τη βρουκέλλωση, τη φυματίωση καθώς και με
    την πανώλη των χοίρων
  type: main
- language: it
  script: Latn
  content: Direttiva 79/111/CEE del Consiglio, del 24 gennaio 1979, che modifica la
    direttiva 64/432/CEE per quanto riguarda la brucellosi e che proroga talune deroghe
    in materia di brucellosi, tubercolosi e peste suina accordate alla Danimarca,
    all'Irlanda e al Regno Unito
  type: main
- language: nl
  script: Latn
  content: Richtlijn 79/111/EEG van de Raad van 24 januari 1979 tot wijziging van
    Richtlijn 64/432/EEG voor wat betreft brucellose en tot verlenging van bepaalde
    afwijkingen die met betrekking tot brucellose, tuberculose en varkenspest zijn
    toegestaan aan Denemarken, Ierland en het Verenigd Koninkrijk
  type: main
- language: pt
  script: Latn
  content: Directiva 79/111/CEE do Conselho, de 24 de Janeiro de 1979, que altera
    a Directiva 64/432/CEE no que diz respeito à brucelose e que prorroga um certo
    número de derrogações, relativas à brucelose e à tuberculose, bem como à
    peste suína, concedidas à Dinamarca, à Irlanda e ao Reino Unido
  type: main
- language: es
  script: Latn
  content: Directiva 79/111/CEE del Consejo, de 24 de enero de 1979, por la que se
    modifica la Directiva 64/432/CEE en lo referente a la brucelosis y por la que
    se prorrogan determinado número de excepciones relativas a la brucelosis, a la
    tuberculosis así como a la peste porcina concedidas a Dinamarca, a Irlanda y
    al Reino Unido
