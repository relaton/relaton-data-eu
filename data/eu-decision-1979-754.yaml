title:
- language: en
  script: Latn
  content: '79/754/EEC: Commission Decision of 6 August 1979 authorizing the French
    Republic not to apply Community treatment to television receivers, falling within
    subheading 85.15 A ex III of the Common Customs Tariff, originating in Taiwan
    and in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/754/CEE: Décision de la Commission, du 6 août 1979, autorisant la
    République française à exclure du traitement communautaire les appareils récepteurs
    de télévision de la sous-position 85.15 A ex III du tarif douanier commun originaires
    de T''ai-wan et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/754/EWG: Entscheidung der Kommission vom 6. August 1979, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Fernsehempfangsgeräte der Tarifstelle
    85.15 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/754/EØF: Kommissionens beslutning af 6. august 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage sendere til
    fjernsynsmodtagere, som henhører under pos. 85.15 A ex III i den fælles toldtarif,
    har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/754/CEE: Decisione della Commissione, del 6 agosto 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi per la televisione, della sottovoce 85.15 A ex III della tariffa doganale
    comune, originari di Taiwan e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/754/EEG: Beschikking van de Commissie van 6 augustus 1979 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen voor televisie van post 85.15
    A ex III van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
