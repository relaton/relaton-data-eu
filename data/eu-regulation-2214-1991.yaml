    22 (løbenummer 40.0220), kategori 23 (løbenummer 40.0230) og kategori 31 (løbenummer
    40.0310), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
