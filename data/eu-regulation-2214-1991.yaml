title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2214/91 of 24 July 1991 re-establishing
    the levying of customs duties on products of categories 1, 22, 23 and 31 (order
    Nos 40.0010, 40.0220, 40.0230 and 40.0310), originating in Indonesia, to which
    the preferential tariff arrangements out in Council Regulation (EEC) No 3832/90
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 2214/91 de la Commission, du 24 juillet 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 1 (numéro d' ordre 40.0010), 22 (numéro d' ordre 40.0220), 23
    (numéro d' ordre 40.0230) et 31 (numéro d' ordre 40.0310) originaires de l'
    Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2214/91 der Kommission vom 24. Juli 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 1 (laufende
    Nummer 40.0010), der Kategorie Nr. 22 (laufende Nummer 40.0220), der Kategorie
    Nr. 23 (laufende Nummer 40.0230) und der Kategorie Nr. 31 (laufende Nummer 40.0310)
    mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2214/91 af 24. juli 1991 om genindførelse
