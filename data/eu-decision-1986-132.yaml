title:
- language: en
  script: Latn
  content: '86/132/EEC: Commission Decision of 11 March 1986 amending Decision 83/355/EEC
    authorizing certain Member States provisionally to provide for derogations from
    certain provisions of Council Directive 77/93/EEC, in respect of plants of Pinus
    L. originating in Japan (Only the Danish, German, Greek, English, French, Italian
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/132/CEE: Décision de la Commission du 11 mars 1986 modifiant la décision
    83/355/CEE autorisant certains États membres à prévoir provisoirement des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour les végétaux
    de Pinus L. originaires du Japon (Les textes en langues danoise, allemande, grecque,
    anglaise, française, italienne et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/132/EWG: Entscheidung der Kommission vom 11. März 1986 zur Änderung
    der Entscheidung 83/355/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten,
    für Pflanzen von Pinus L. mit Ursprung in Japan Ausnahmen von einigen Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der dänische, deutsche, griechische,
    englische, französische, italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/132/EØF: Kommissionens beslutning af 11. marts 1986 om ændring af
    beslutning 83/355/EØF om midlertidig bemyndigelse af visse medlemsstater til
    at undtage planter af Pinus L. med oprindelse i Japan fra visse bestemmelser i
    Rådets direktiv 77/93/EØF (Kun den danske, tyske, graeske, engelske, franske,
    italienske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '86/132/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Μαρτίου 1986 για την τροποποίηση της απόφασης
    83/355/ΕΟΚ που επιτρέπει προσωρινά σε ορισμένα
    κράτη μέλη να προβλέπουν παρεκκλίσεις από
    ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ του
    Συμβουλίου, όσον αφορά τα φυτά του Pinus L. καταγωγής
    Ιαπωνίας (Τα κείμενα στην δανική, γερμανική,
    ελληνική, αγγλική, γαλλική, ιταλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '86/132/CEE: Decisione della Commissione dell''11 marzo 1986 recante modifica
    della decisione 85/355/CEE che autorizza alcuni stati membri a derogare provvisoriamente
    a determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto
    riguarda i vegetali di Pinus L. originari del Giappone (Il testi in lingua danese,
    tedesca, greca, inglese, francese, italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '86/132/EEG: Beschikking van de Commissie van 11 maart 1986 tot wijziging
    van Beschikking 83/355/EEG houdende machtiging voor een aantal Lid-Staten om voorlopige
    afwijkingen toe te staan van sommige bepalingen van Richtlijn 77/93/EEG van de
    Raad, ten aanzien van planten van Pinus L. van oorsprong uit Japan (Slechts de
    teksten in de Deense, Duitse, Griekse, Engelse, Franse, Italiaanse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/132/CEE: Decisão da Comissão de 11 de Março de 1986 que altera a
    Decisão 83/355/CEE que autoriza determinados Estados-membros a prever provisoriamente
    derrogações a determinadas disposições da Directiva 77/93/CEE do Conselho,
    em relação às plantas de Pinus L. originárias do Japão (Apenas fazem fé
    os textos nas línguas dinamarquesa, alemã, grega, inglesa, francesa, italiana
    e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '86/132/CEE: Decisión de la Comisión de 11 de marzo de 1986 por la que
    se modifica la Decisión 83/355/CEE, que autoriza a determinados Estados miembros
    a establecer provisionalmente excepciones a ciertas disposiciones de la Directiva
    77/93/CEE del Consejo en lo referente a vegetales de Pinus L. procedente de Japón
    (Los textos en lenguas danesa, alemana, griega, inglesa, francesa, italiana y
    neerlandesa son los únicos auténticos)'
