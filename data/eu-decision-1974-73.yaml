title:
- language: en
  script: Latn
  content: '74/73/EEC: Third Commission Decision of 9 January 1974 amending the Decision
    of 23 May 1973 authorizing the Member States to approve for marketing reproductive
    material of certain forestry species subjected to reduced requirements'
  type: main
- language: fr
  script: Latn
  content: '74/73/CEE: Troisième décision de la Commission, du 9 janvier 1974, modifiant
    la décision du 23 mai 1973 autorisant les États membres à admettre à la commercialisation
    des matériels de reproduction de certaines espèces forestières soumis à des
    exigences réduites'
  type: main
- language: de
  script: Latn
  content: '74/73/EWG: Dritte Entscheidung der Kommission vom 9. Januar 1974 zur Änderung
    der Entscheidung vom 23. Mai 1973, mit der die Mitgliedstaaten ermächtigt werden,
    Vermehrungsgut bestimmter forstlicher Arten mit minderen Anforderungen zum gewerbsmäßigen
    Verkehr zuzulassen'
  type: main
- language: da
  script: Latn
  content: '74/73/EØF: Kommissionens tredje Beslutning af 9. januar 1974 om ændring
    af beslutning af 23. maj 1973 om bemyndigelse til medlemsstaterne til at tillade
    handel med formeringsmateriale af visse forstarter, der kun skal opfylde mindre
    strenge krav'
  type: main
- language: it
  script: Latn
  content: '74/73/CEE: Terza decisione della Commissione, del 9 gennaio 1974, che
    modifica la decisione del 23 maggio 1973, che autorizza gli Stati membri ad ammettere
    alla commercializzazione materiali di riproduzione di alcune specie forestali
    soggetti ad esigenze ridotte'
  type: main
- language: nl
  script: Latn
  content: '74/73/EEG: Derde beschikking van de Commissie van 9 januari 1974 houdende
    wijziging van de beschikking van 23 mei 1973, waarbij de Lid-Staten worden gemachtigd
    om teeltmateriaal van zekere bosbouwsoorten, waaraan minder strenge eisen zijn
    gesteld, tot de handel toe te laten'
  type: main
