title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2124/80 of 7 August 1980 re-establishing
    the levying of the customs duties on anhydrous sodium carbonate, falling within
    subheading 28.42 A ex II and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2124/80 de la Commission, du 7 août 1980, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 A ex II, originaire de
    Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2124/80 der Kommission vom 7. August 1980 zur Wiedereinführung
    des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle 28.42 A ex II,
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2124/80 af 7. august 1980 om genindførelse
    af opkrævning af toldafgifter for vandfri natriumcarbonat, under pos. 28.42 A
    ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2124/80 della Commissione, del 7 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili al carbonato di sodio
    anidro, della sottovoce 28.42 A ex II della tariffa doganale comune, originario
    della Romania, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2124/80 van de Commissie van 7 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op watervrij
    natriumcarbonaat, van post 28.42 A ex II, van oorsprong uit Roemenië, ten behoeve
    waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
