title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2054/72 de la Commission, du 27 septembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux parties, garnitures et accessoires pour articles des n° 66.01 et 66.02 de
    la position tarifaire 66.03, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2054/72 der Kommission vom 27. September 1972 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Teile, Ausstattungen
    und Zubehör für Waren der Tarifnummern 66.01 und 66.02 der Tarifnummer 66.03,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2795/71
    des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2054/72 della Commissione, del 27 settembre 1972,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    alle parti, guarnizioni e accessori per gli oggetti delle voci nn. 66.01 e 66.02
    della voce doganale n. 66.03, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2795/71 del Consiglio,
    del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2054/72 van de Commissie van 27 september 1972 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor delen, garnituren en toebehoren, voor de artikelen bedoeld bij de posten
    66.01 en 66.02 van post 66.03, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 tariefpreferenties
    werden geopend
  type: main
