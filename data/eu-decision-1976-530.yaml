---
id: EUDecision1976530
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 April 1976 authorizing the Italian Republic not
    to apply Community treatment to footwear with uppers of leather for sports and
    gymnastics, other than ski-boots, falling within subheading 64.02 ex A of the
    Common Customs Tariff, originating in Hungary and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '76/530/CEE: Décision de la Commission, du 26 avril 1976, autorisant la
    République italienne à exclure du traitement communautaire les chaussures à
    dessus en cuir naturel pour la pratique des sports et de la gymnastique, autres
    que de ski, de la position 64.02 Ex A du Tarif douanier commun, originaires de
    Hongrie et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. April 1976, mit der die Italienische
    Republik ermächtigt wird, aus Ungarn stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Sportschuhe mit Oberteil aus Leder, andere als Skischuhe,
    der Tarifstelle 64.02 ex A des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. april 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage fodtøj med overdel af læder,
    beregnet på sport og gymnastik med undtagelse af skisport, som henhører under
    pos. 64.02 ex A i den fælles toldtarif, har oprindelse i Ungarn og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 aprile 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le calzature con tomaia di cuoio
    naturale per lo sport e la ginnastica diverse da quelle per lo sci, della voce
    64.02 ex A della tariffa doganale comune, originarie dell'Ungheria e messe in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 april 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd schoeisel met bovendeel van leder voor het beoefenen van sport
    en gymnastiek andere dan skischoenen, van post 64.02 ex A van het gemeenschappelijk
    douanetarief, van oorsprong uit Hongarije, dat in de andere Lid-Staten in het
    vrije verkeer wordt gebracht, van de communautaire behandeling uit te sluiten
  type: main
