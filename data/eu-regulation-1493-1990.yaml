title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1493/90 of 31 May 1990 fixing the quantities
    of frozen beef intended for processing which may be imported on special conditions
    for the first and second quarters of 1990
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1493/90 de la Commission, du 31 mai 1990, fixant les
    quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour les premier et deuxième trimestres
    de 1990
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1493/90 der Kommission vom 31. Mai 1990 zur Festsetzung
    der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die für das
    erste und zweite Vierteljahr 1990 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1493/90 af 31. maj 1990 om fastsættelse
    af de mængder frosset oksekød til forarbejdning, der kan indføres på særlige
    vilkår i første og andet kvartal af 1990
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1493/90 της Επιτροπής
    της 31ης Μαΐου 1990 περί καθορισμού των ποσοτήτων
    βοείου κατεψυγμένου κρέατος, οι οποίες προορίζονται
    για μεταποίηση και είναι δυνατόν να εισαχθούν
    υπό ειδικούς όρους για το πρώτο και δεύτερο
    τρίμηνο του 1990
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1493/90 della Commissione, del 31 maggio 1990, che
    fissa le quantità di carni bovine congelate, destinate alla trasformazione, che
    possono essere importate a condizioni speciali per il primo e secondo trimestre
    1990
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1493/90 van de Commissie van 31 mei 1990 tot vaststelling
    van de hoeveelheden bevroren rundvlees voor verwerking die in het eerste en het
    tweede kwartaal van 1990 op bijzondere voorwaarden kunnen worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1493/90 da Comissão, de 31 de Maio de 1990, que
    fixa as quantidades de carne de bovino congelada destinada à transformação
    que pode ser importada em condições especiais durante o primeiro e segundo trimestres
    de 1990
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1493/90 de la Comisión, de 31 de mayo de 1990, por
    el que se fijan las cantidades de carne de vacuno congelada destinada a su transformación
    que podrán importarse en condiciones especiales en el primer y segundo trimestre
    de 1990
