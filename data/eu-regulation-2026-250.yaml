    agus bisfeanól agus díorthach bisfeanóil eile ag a bhfuil aicmiú comhchuibhithe
    i leith airíonna guaiseacha sonracha in ábhair agus earraí áirithe atá beartaithe
    lena dteacht i dteagmháil le bia, lena leasaítear Rialachán (AE) Uimh. 10/2011
    agus lena n-aisghairtear Rialachán (AE) 2018/213
  type: main
- language: hr
  script: Latn
