    A (BPA) oraz innych bisfenoli i pochodnych bisfenoli ze zharmonizowaną klasyfikacją
    pod względem szczególnych niebezpiecznych właściwości w niektórych materiałach
    i wyrobach przeznaczonych do kontaktu z żywnością, zmieniającego rozporządzenie
    (UE) nr 10/2011 oraz uchylającego rozporządzenie (UE) 2018/213
  type: main
