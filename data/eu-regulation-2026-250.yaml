title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2026/250 of 2 February 2026 correcting Regulation
    (EU) 2024/3190 on the use of bisphenol A (BPA) and other bisphenols and bisphenol
    derivatives with harmonised classification for specific hazardous properties in
    certain materials and articles intended to come into contact with food, amending
    Regulation (EU) No 10/2011 and repealing Regulation (EU) 2018/213
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/250 de la Commission du 2 février 2026 rectifiant
    le règlement (UE) 2024/3190 relatif à l’utilisation du bisphénol A (BPA)
    et d’autres bisphénols et dérivés des bisphénols faisant l’objet d’une
    classification harmonisée en raison de propriétés dangereuses spécifiques
    dans certains matériaux et objets destinés à entrer en contact avec des denrées
    alimentaires, modifiant le règlement (UE) no 10/2011 et abrogeant le règlement
    (UE) 2018/213
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/250 der Kommission vom 2. Februar 2026 zur Berichtigung
    der Verordnung (EU) 2024/3190 der Kommission über die Verwendung von Bisphenol
    A (BPA) und anderen Bisphenolen und Bisphenolderivaten, die aufgrund spezifischer
    gefährlicher Eigenschaften eine harmonisierte Einstufung erhalten haben, in bestimmten
    Materialien und Gegenständen, die dazu bestimmt sind, mit Lebensmitteln in Berührung
    zu kommen, zur Änderung der Verordnung (EU) Nr. 10/2011 und zur Aufhebung der
    Verordnung (EU) 2018/213
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2026/250 на Комисията от 2 февруари
    2026 година за поправка на Регламент (ЕС) 2024/3190
    за употребата на бисфенол А (BPA) и други бисфеноли,
    както и бисфенолни производни, с хармонизирана
    класификация за специфични опасни свойства
    в определени материали и предмети, предназначени
    за контакт с храни, за изменение на Регламент
    (ЕС) № 10/2011 и за отмяна на Регламент (ЕС) 2018/213
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2026/250 ze dne 2. února 2026, kterým se opravuje
    nařízení (EU) 2024/3190 o používání bisfenolu A (BPA) a jiných bisfenolů
    a derivátů bisfenolů s harmonizovanou klasifikací ohledně specifických nebezpečných
    vlastností v některých materiálech a předmětech určených pro styk s potravinami,
    o změně nařízení (EU) č. 10/2011 a zrušení nařízení (EU) 2018/213
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2026/250 af 2. februar 2026 om berigtigelse
