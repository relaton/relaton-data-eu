    og andre bisphenoler og bisphenolderivater med harmoniseret klassificering for
    specifikke farlige egenskaber i visse materialer og genstande bestemt til kontakt
    med fødevarer, om ændring af forordning (EU) nr. 10/2011 og om ophævelse af
    forordning (EU) 2018/213
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2026/250 της Επιτροπής, της
