    o Regulamento (UE) n.o 10/2011 e revoga o Regulamento (UE) 2018/213
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/250 al Comisiei din 2 februarie 2026 de rectificare
    a Regulamentului (UE) 2024/3190 privind utilizarea bisfenolului A (BPA) și a
    altor bisfenoli și derivați ai bisfenolului cu clasificare armonizată pentru
    proprietăți periculoase specifice în anumite materiale și articole destinate
