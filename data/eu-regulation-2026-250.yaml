    ühtse klassifikatsiooniga bisfenool A (BPA), muude bisfenoolide ja bisfenooliderivaatide
    kasutamist teatavates toiduga kokkupuutumiseks ettenähtud materjalides ja esemetes
    ning millega muudetakse määrust (EL) nr 10/2011 ja tunnistatakse kehtetuks määrus
    (EL) 2018/213
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2026/250, annettu 2 päivänä helmikuuta 2026, bisfenoli
    A:n (BPA) ja muiden bisfenolien ja bisfenolijohdannaisten, joiden erityisten vaarallisten
    ominaisuuksien luokitus on yhdenmukaistettu, käytöstä tietyissä elintarvikkeiden
    kanssa kosketukseen joutuvissa materiaaleissa ja tarvikkeissa, asetuksen (EU)
    N:o 10/2011 muuttamisesta ja asetuksen (EU) 2018/213 kumoamisesta annetun asetuksen
    (EU) 2024/3190 oikaisemisesta
  type: main
- language: ga
  script: Latn
