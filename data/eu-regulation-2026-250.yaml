    2024/3190 o uporabi bisfenola A (BPA) i drugih bisfenola i derivata bisfenola
    s usklađenim razvrstavanjem zbog posebnih opasnih svojstava u određenim materijalima
    i predmetima koji dolaze u dodir s hranom, o izmjeni Uredbe (EU) br. 10/2011 i
    stavljanju izvan snage Uredbe (EU) 2018/213
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/250 rendelete (2026. február 2.) a biszfenol-A-nak
    és más, különleges veszélyes tulajdonságok tekintetében harmonizált osztályozású
    biszfenoloknak és biszfenolszármazékoknak az élelmiszerekkel rendeltetésszerűen
    érintkezésbe kerülő egyes anyagokban és tárgyakban történő felhasználásáról,
    a 10/2011/EK rendelet módosításáról, valamint az (EU) 2018/213 rendelet hatályon
    kívül helyezéséről szóló (EU) 2024/3190 rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/250 della Commissione, del 2 febbraio 2026, che rettifica
    il regolamento (UE) 2024/3190 della Commissione relativo all’utilizzo del bisfenolo
    A (BPA) e di altri bisfenoli e derivati di bisfenoli con classificazione armonizzata
    per specifiche proprietà pericolose in determinati materiali e oggetti destinati
    a venire a contatto con i prodotti alimentari, che modifica il regolamento (UE)
    n. 10/2011 e che abroga il regolamento (UE) 2018/213
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2026/250 (2026. gada 2. februāris), ar ko groza
    Komisijas Regulu (ES) 2024/3190 par bisfenola A (BPA) un citu bisfenolu un bisfenolu
    atvasinājumu ar harmonizētu klasifikāciju pēc īpašām bīstamām īpašībām
    izmantošanu konkrētos materiālos un izstrādājumos, kas ir paredzēti saskarei
    ar pārtiku, un ar kuru groza Regulu (ES) Nr. 10/2011 un atceļ Regulu (ES) 2018/213
  type: main
- language: lt
  script: Latn
  content: 2026 m. vasario 2 d. Komisijos reglamentas (ES) 2026/250, kuriuo ištaisomas
    Reglamentas (ES) 2024/3190 dėl bisfenolio A (BPA) ir kitų bisfenolių bei bisfenolio
    darinių, kuriems taikoma suderinta klasifikacija pagal konkrečias pavojingas
    savybes, naudojimo tam tikrose medžiagose ir gaminiuose, skirtuose liestis su
    maistu, kuriuo iš dalies keičiamas Reglamentas (ES) Nr. 10/2011 ir panaikinamas
    Reglamentas (ES) 2018/213
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2026/250 tat-2 ta’ Frar 2026 li jikkoreġi
    r-Regolament (UE) 2024/3190 dwar l-użu tal-bisfenol A (BPA) u ta’ bisfenoli
    oħra u derivattivi tal-bisfenol bi klassifikazzjoni armonizzata għal proprjetajiet
    perikolużi speċifiċi f’ċerti materjali u oġġetti maħsuba biex jiġu f’kuntatt
    mal-ikel, li jemenda r-Regolament (UE) Nru 10/2011 u li jħassar ir-Regolament
    (UE) 2018/213
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/250 van de Commissie van 2 februari 2026 tot rectificatie
    van Verordening (EU) 2024/3190 betreffende het gebruik van bisfenol A (BPA) en
    andere bisfenolen en bisfenolderivaten met een geharmoniseerde indeling in verband
    met specifieke gevaarlijke eigenschappen in bepaalde materialen en voorwerpen
    bestemd om met levensmiddelen in contact te komen, tot wijziging van Verordening
    (EU) nr. 10/2011 en tot intrekking van Verordening (EU) 2018/213
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2026/250 z dnia 2 lutego 2026 r. w sprawie
