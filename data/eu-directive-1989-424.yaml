    για τον περιορισμό της εμπορίας σπόρων προς
    σπορά ορισμένων ειδών κτηνοτροφικών φυτών,
    ελαιούχων και κλωστικών φυτών, στους σπόρους
    προς σπορά που έχουν πιστοποιηθεί επίσημα
    ως «βασικοί σπόροι» ή «πιστοποιημένοι σπόροι»
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv, 30. juuni 1989, millega muudetakse direktiivi 86/109/EMÜ,
    mis lubab teatud söödakultuuride ning õli- ja kiudtaimede liikide seemne turustamist
    üksnes juhul, kui see on ametlikult sertifitseeritud eliitseemne või sertifitseeritud
    seemnena
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 89/424/ETY, annettu 30 päivänä kesäkuuta 1989,
    tiettyjen rehu-, öljy- ja kuitukasvien siementen kaupan pitämisen rajoittamisesta
    siemeniin, jotka on virallisesti varmennettu "perussiemeniksi" tai "varmennetuiksi
    siemeniksi", annetun direktiivin 86/109/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1989. június 30.) a meghatározott fajtájú
    takarmánynövények és az olaj- és rostnövények vetőmagja forgalmazásának
    a hivatalosan „elit vetőmagnak” vagy „minősített vetőmagnak” minősített
    vetőmagokra való korlátozásáról szóló 86/109/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 89/424/CEE della Commissione del 30 giugno 1989 recante modifica
    della direttiva 86/109/CEE che limita la commercializzazione delle sementi di
    talune specie di piante foraggere, oleaginose e da fibra alle sementi ufficialmente
    certificate «sementi di base» o «sementi certificate»
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva (1989. gada 30. jūnijs), ar kuru groza Direktīvu
