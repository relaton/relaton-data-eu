title:
- language: en
  script: Latn
  content: Commission Directive 89/424/EEC of 30 June 1989 amending Directive 86/109/EEC
    limiting the marketing of seed of certain species of fodder plants and oil and
    fibre plants to seed which has been officially certified as 'basic seed' or 'certified
    seed'
  type: main
- language: fr
  script: Latn
  content: Directive 89/424/CEE de la Commission du 30 juin 1989 modifiant la directive
    86/109/CEE limitant la commercialisation des semences de certaines espèces de
    plantes fourragères et de plantes oléagineuses et à fibres aux semences qui
    ont été officiellement certifiées «semences de base» ou «semences certifiées»
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/424/EWG der Kommission vom 30. Juni 1989 zur Änderung der
    Richtlinie 86/109/EWG zur Beschränkung des Verkehrs mit Saatgut bestimmter Arten
    von Futter-, Öl- und Faserpflanzen auf amtlich als Basissaatgut" oder zertifiziertes
    Saatgut" anerkanntes Saatgut
  type: main
- language: bg
  script: Cyrl
  content: Директива на Комисията от 30 юни 1989 година
    за изменение на Директива 86/109/ЕИО относно ограничаване
    на търговията със семена от някои видове фуражни
    култури и маслодайни и влакнодайни култури
    до семена, които са официално сертифицирани
    като „базови семена“ или „сертифицирани
    семена“
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise ze dne 30. června 1989, kterou se mění směrnice 86/109/EHS
    o omezení uvádění osiva některých druhů pícnin, olejnin a přadných rostlin
    na trh na osiva úředně uznaná jako „základní osivo“ nebo „certifikované
    osivo“
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 89/424/EØF af 30. juni 1989 om ændring af direktiv
    86/109/EØF om begrænsning af handelen med frø af visse arter foderplanter samt
    af olie- og spindplanter til kun at omfatte frø, der er officielt certificeret
    som »basisfrø« eller »certificeret frø«
  type: main
- language: el
  script: Grek
