    šķiedraugu sugu sēklu tirdzniecību, atļaujot tirgot tikai tās sēklas, kas
    oficiāli sertificētas kā “bāzes sēklas” vai “sertificētas sēklas”
  type: main
- language: lt
  script: Latn
  content: 1989 m. birželio 30 d. Komisijos direktyva, iš dalies keičianti Direktyvą
    86/109/EEB, leidžiančią prekiauti tik oficialiai sertifikuota tam tikrų rūšių
    pašarinių, aliejinių ir pluoštinių augalų „elitine sėkla“ arba „sertifikuota
    sėkla“
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni tat-30 ta’ Ġunju 1989 li temenda d-Direttiva
    86/109/KEE li tillimita l-bejgħ taż-żerriegħa ta’ ċertu pjanti ta’ l-għalf
    u taż-żejt u pjanti tal-fibra li ġew uffiċċjalment ċertifikati bħala ‘ż-żerriegħa
    bażika’ jew ‘żerriegħa ċertifikata’
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/424/EEG van de Commissie van 30 juni 1989 tot wijziging van
    Richtlijn 86/109/EEG waarbij de handel in zaaizaad van sommige soorten groenvoedergewassen,
    oliehoudende planten en vezelgewassen wordt beperkt tot zaaizaad dat officieel
    als "basiszaad" of als "gecertificeerd zaad" is goedgekeurd
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji z dnia 30 czerwca 1989 r. zmieniająca dyrektywę 86/109/EWG
    ograniczającą obrót materiałem siewnym niektórych gatunków roślin pastewnych
    oraz oleistych i włóknistych do materiału siewnego, który został urzędowo
    zakwalifikowany jako „elitarny materiał siewny” lub „kwalifikowany materiał
    siewny”
  type: main
- language: pt
  script: Latn
  content: Directiva 89/424/CEE da Comissão de 30 de Junho de 1989 que altera a Directiva
    86/109/CEE, que limita a comercialização das sementes de certas espécies de
    plantas forrageiras e de plantas oleaginosas e de fibras às sementes que tenham
    sido oficialmente certificadas como sendo «sementes de base» ou «sementes certificadas»
  type: main
- language: ro
  script: Latn
  content: Directiva Comisiei din 30 iunie 1989 de modificare a Directivei 86/109/CEE
    de limitare a comercializării semințelor din anumite specii de plante furajere
    și plante oleaginoase și pentru fibră la semințele care au fost certificate
    oficial ca „semințe de bază” sau „semințe certificate”
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie z 30. júna 1989, ktorou sa mení a dopĺňa smernica
    86/109/EHS o obmedzení uvádzania na trh osiva určitých druhov krmovín a olejnín
    a priadnych rastlín, ktoré je úradne uznané ako „základný množiteľský
    materiál“ alebo „certifikované osivo“
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije z dne 30. junija 1989 o spremembi Direktive 86/109/EGS
    o omejitvi trženja semen nekaterih vrst krmnih rastlin ter oljnic in predivnic
    na seme, ki je bilo uradno potrjeno kot „osnovno seme“ ali „certificirano
    seme“
  type: main
- language: es
  script: Latn
  content: Directiva 89/424/CEE de la Comisión de 30 de junio de 1989 por la que
    se modifica la Directiva 86/109/CEE por la que se limita la comercialización
    de las semillas de determinadas especies de plantas forrajeras, oleaginosas y
    textiles que se han certificado oficialmente como «semillas de base» o «semillas
    certificadas»
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 89/424/EEG av den 30 juni 1989 om ändring av direktiv
