title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2149/85 of 30 July 1985 re-establishing
    the levying of customs duties on footwear with outer soles and uppers of rubber
    or artificial plastic material falling within heading No 64.01 originating in
    Malaysia to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2149/85 de la Commission du 30 juillet 1985 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à semelles extérieures et dessus en caoutchouc ou en matière plastique artificielle,
    de la position 64.01 du tarif douanier commun, originaires de Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2149/85 der Kommission vom 30. Juli 1985 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff der Tarifnummer 64.01 mit Ursprung in Malaysia, dem die in der
    Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2149/85 af 30. juli 1985 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi eller plast
    henhørende under pos. 64.01 og med oprindelse i Malaysia som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2149/85 της Επιτροπής
    της 30ής Ιουλίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για υποδήματα, έχοντα
    το εξωτερικόν πέλμα και το άνω μέρος αυτών
    εκ καουτσούκ ή εκ τεχνητής πλαστικής ύλης της
    δασμολογικής κλάσεως 64.01 καταγωγής Μαλαισίας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2149/85 della Commissione del 30 luglio 1985 che ripristina
    la riscossione dei dazi doganali applicabili alle calzature con suole esterne
    e tomaia di gomma o di materia plastica artificiale della voce 64.01 della tariffa
    doganale comune, originarie della Malaysia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2149/85 van de Commissie van 30 juli 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel met
    buitenzool en bovendeel van rubber of van kunstmatige plastische stof van tariefpost
    64.01, van oorsprong uit Maleisië, waarvoor de in Verordening (EEG) nr. 3562/84
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
