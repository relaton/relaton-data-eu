    taisyklėmis, reglamentuojančiomis tam tikrų žmonėms skirtų gyvūninės kilmės
    produktų gamybą ir tiekimą į rinką (pranešta dokumentu Nr. C(2006) 5175)'
  type: main
- language: mt
  script: Latn
  content: '2006/765/KE: Deċiżjoni tal-Kummissjoni tas- 6 ta'' Novembru 2006 li
