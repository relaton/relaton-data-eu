    e às regras sanitárias que regem a produção e a colocação no mercado de
    determinados produtos de origem animal destinados ao consumo humano [notificada
    com o número C(2006) 5175]'
  type: main
- language: sk
  script: Latn
  content: '2006/765/ES: Rozhodnutie Komisie zo 6. novembra 2006 , ktorým sa zrušujú
