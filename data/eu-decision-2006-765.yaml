    bepaalde voor menselijke consumptie bestemde producten van dierlijke oorsprong
    (Kennisgeving geschied onder nummer C(2006) 5175)'
  type: main
- language: pl
  script: Latn
  content: '2006/765/WE: Decyzja Komisji z dnia 6 listopada 2006 r. uchylająca niektóre
