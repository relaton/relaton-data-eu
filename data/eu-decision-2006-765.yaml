title:
- language: en
  script: Latn
  content: '2006/765/EC: Commission Decision of 6 November 2006 repealing certain
    implementing acts concerning food hygiene and health conditions for the production
    and placing on the market of certain products of animal origin intended for human
    consumption (notified under document number C(2006) 5175)'
  type: main
- language: fr
  script: Latn
  content: '2006/765/CE: Décision de la Commission du 6 novembre 2006 abrogeant certains
    actes d''application relatifs à l''hygiène des denrées alimentaires et aux
    règles sanitaires régissant la production et la mise sur le marché de certains
    produits d''origine animale destinés à la consommation humaine [notifiée sous
    le numéro C(2006) 5175]'
  type: main
- language: de
  script: Latn
  content: '2006/765/EG: Entscheidung der Kommission vom 6. November 2006 zur Aufhebung
    bestimmter Durchführungsakte über Lebensmittelhygiene und Hygienevorschriften
    für die Herstellung und das Inverkehrbringen von bestimmten, zum menschlichen
    Verzehr bestimmten Erzeugnissen tierischen Ursprungs (Bekannt gegeben unter Aktenzeichen
    K(2006) 5175)'
  type: main
- language: cs
  script: Latn
  content: '2006/765/ES: Rozhodnutí Komise ze dne 6. listopadu 2006 , kterým se
    zrušují některé prováděcí předpisy týkající se hygieny potravin a hygienických
    podmínek pro produkci některých produktů živočišného původu určených
    k lidské spotřebě a pro jejich uvádění na trh (oznámeno pod číslem K(2006)
    5175)'
  type: main
- language: da
  script: Latn
  content: '2006/765/EF: Kommissionens beslutning af 6. november 2006 om ophævelse
    af visse gennemførelsesretsakter vedrørende fødevarehygiejne og sundhedsbestemmelser
    for produktion og markedsføring af visse animalske produkter til konsum (meddelt
    under nummer K(2006) 5175)'
  type: main
- language: el
  script: Grek
  content: '2006/765/ΕΚ: Απόφαση της Επιτροπής, της 6ης
    Νοεμβρίου 2006 , για την κατάργηση ορισμένων
    πράξεων εφαρμογής σχετικών με την υγιεινή
    των τροφίμων και με τους υγειονομικούς κανόνες
    που διέπουν την παραγωγή και τη διάθεση στην
    αγορά ορισμένων προϊόντων ζωικής προέλευσης
    που προορίζονται για κατανάλωση από τον άνθρωπο
    [κοινοποιηθείσα υπό τον αριθμό Ε(2006) 5175]'
  type: main
- language: et
  script: Latn
  content: '2006/765/EÜ: Komisjoni otsus, 6. november 2006 , millega tunnistatakse
    kehtetuks teatavad rakendusaktid, mis käsitlevad inimtoiduks ettenähtud loomse
    päritoluga toodete tootmise ja turuleviimise toiduhügieeni ning terviseohutuse
    nõudeid (teatavaks tehtud numbri K(2006) 5175 all)'
  type: main
- language: fi
  script: Latn
  content: '2006/765/EY: Komission päätös, tehty 6 päivänä marraskuuta 2006
    , ihmisravinnoksi tarkoitettujen tiettyjen eläinperäisten tuotteiden tuotantoa
    ja markkinoille saattamista koskevista elintarvikehygienia- ja terveyssäännöistä
    annettujen tiettyjen täytäntöönpanosäädösten kumoamisesta (tiedoksiannettu
    numerolla K(2006) 5175)'
  type: main
- language: hu
  script: Latn
  content: '2006/765/EK: A Bizottság határozata ( 2006. november 6 .) az emberi
    fogyasztásra szánt egyes állati eredetű termékek előállítására és forgalomba
    hozatalára vonatkozó közegészségügyi szabályok és az élelmiszer-higiéniára
    vonatkozó egyes végrehajtási intézkedések hatályon kívül helyezéséről
    (az értesítés a C(2006) 5175. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2006/765/CE: Decisione della Commissione, del 6 novembre 2006 , che abroga
