title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 435/82 of 24 February 1982 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of stoneware, falling within subheading
    69.12 B and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 435/82 de la Commission, du 24 février 1982, portant
    rétablissement de la perception de droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en grès, de la sous-position tarifaire
    69.12 B, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 435/82 der Kommission vom 24. Februar 1982 zur Wiedereinführung
    der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände aus
    Steinzeug der Tarifstelle 69.12 B, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 435/82 af 24. februar 1982 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    stentøj, henhørende under pos. 69.12 B og med oprindelse i Sydkorea, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 435/82 τής Επιτροπής τής
    24ης Φεβρουαρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά επιτραπέζια σκεύη
    καί είδη οικιακής χρήσεως ή ευπρεπισμού εκ
    ψευδοπορσελάνης τής δασμολογικής διακρίσεως
    69. 12 Β καταγωγής Νοτίου Κορέας δικαιούχου τών
    προβλεπομένων από τόν κανονισμό (EOK) αριθ. 3601/81
    τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 435/82 della Commissione, del 24 febbraio 1982, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e oggetti
    di uso domestico o da toletta di gres, della sottovoce 69.12 B della tariffa doganale
    comune, originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 435/82 van de Commissie van 24 februari 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van gres, van postonderverdeling 69.12 B, van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde
    tariefpreferenties zijn verleend
  type: main
