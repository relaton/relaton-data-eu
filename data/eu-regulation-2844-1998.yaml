  script: Latn
  content: Commission Regulation (EC) No 2844/98 of 22 December 1998 laying down detailed
    rules for the application of Council Regulation (EC) No 1587/98 introducing a
    scheme to compensate for the additional costs incurred in the marketing of certain
    fishery products from the Azores, Madeira, the Canary Islands and the French departments
    of Guiana and Réunion as a result of those regions' remoteness
  type: main
- language: fr
  script: Latn
