id: EUDecision2022179
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/179 of 8 February 2022 on the
    harmonised use of radio spectrum in the 5 GHz frequency band for the implementation
    of wireless access systems including radio local area networks and repealing Decision
    2005/513/EC (notified under document C(2022) 628)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/179 de la Commission du 8 février 2022
    sur l’utilisation harmonisée du spectre radioélectrique dans la bande de fréquences
    de 5 GHz pour la mise en œuvre des systèmes d’accès sans fil, y compris les
    réseaux locaux radioélectriques, et abrogeant la décision 2005/513/CE [notifiée
    sous le numéro C(2022) 628]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/179 der Kommission vom 8. Februar 2022
    über die harmonisierte Nutzung von Funkfrequenzen im 5-GHz-Band für die Einführung
    drahtloser Zugangssysteme einschließlich lokaler Funknetze und zur Aufhebung
    der Entscheidung 2005/513/EG (Bekannt gegeben unter Aktenzeichen C(2022) 628)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/179 на Комисията
    от 8 февруари 2022 година относно хармонизираното
    използване на радиочестотния спектър в честотната
    лента от 5 GHz за внедряване на безжични системи
    за достъп, включително локални мрежи с достъп
    чрез радиовръзка и за отмяна на Решение 2005/513/ЕО
    (нотифицирано под номер С(2022) 628)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/179 ze dne 8. února 2022 o harmonizovaném
    využití rádiového spektra v kmitočtovém pásmu 5 GHz pro bezdrátové přístupové
    systémy, jejichž součástí jsou rádiové místní sítě, a o zrušení rozhodnutí
    2005/513/ES (oznámeno pod číslem C(2022) 628)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/179 af 8. februar 2022
    om harmoniseret anvendelse af frekvensressourcer inden for 5 GHz-båndet med sigte
    på indførelse af trådløse adgangssystemer, herunder radiobaserede lokalnet,
    og om ophævelse af beslutning 2005/513/EF (meddelt under nummer C(2022) 628)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/179 της Επιτροπής
    της 8ης Φεβρουαρίου 2022 σχετικά με την εναρμονισμένη
    χρήση ραδιοφάσματος στη ζώνη συχνοτήτων των
    5 GHz για την υλοποίηση συστημάτων ασύρματης
    πρόσβασης, συμπεριλαμβανομένων τοπικών δικτύων
    ραδιοεπικοινωνιών και για την κατάργηση της
    απόφασης 2005/513/ΕΚ [κοινοποιηθείσα υπό τον αριθμό
    C(2022) 628]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/179, 8. veebruar 2022, mis käsitleb
    raadiospektri ühtlustatud kasutamist sagedusalas 5 GHz traadita juurdepääsusüsteemide,
    sealhulgas raadio-kohtvõrkude (WAS/RLAN) rakendamiseks ja millega tunnistatakse
    kehtetuks otsus 2005/513/EÜ (teatavaks tehtud numbri C(2022) 628 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/179, annettu 8 päivänä
    helmikuuta 2022, radiotaajuuksien yhdenmukaisesta käytöstä 5 GHz:n taajuusalueella
    langattomien liityntäjärjestelmien, kuten langattomien lähiverkkojen toteuttamista
    varten ja päätöksen 2005/513/EY kumoamisesta (tiedoksiannettu numerolla C(2022)
    628)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/179 ón gCoimisiún an 8 Feabhra 2022
    maidir le comhchuibhiú úsáid speictrim raidió i mbanda minicíochta 5 GHz
    le haghaidh cur chun feidhme córas rochtana gan sreang lena n-áirítear líonraí
    achair logánta raidió agus lena n-aisghairtear Cinneadh 2005/513/CE (a bhfuil
    fógra tugtha ina leith faoi dhoiciméad C(2022) 628)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/179 оd 8. veljače 2022. o usklađenoj
    uporabi radiofrekvencijskog spektra u frekvencijskom pojasu 5 GHz za uvođenje
    sustavâ bežičnog pristupa, uključujući radijske lokalne mreže, i o stavljanju
    izvan snage Odluke 2005/513/EZ (priopćeno pod brojem dokumenta C(2022) 628)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/179 végrehajtási határozata (2022. február 8.)
    a rádióspektrum 5 GHz-es frekvenciasávjának a vezeték nélküli hozzáférési
    rendszerek, többek között rádiós helyi hálózatok megvalósítására történő
    harmonizált használatáról és a 2005/513/EK határozat hatályon kívül helyezéséről
    (az értesítés a C(2022) 628. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/179 della Commissione dell’8 febbraio
    2022 sull’uso armonizzato dello spettro radio nella banda di frequenza 5 GHz
    per l’implementazione di sistemi di accesso senza fili comprese le reti locali
    in radiofrequenza (WAS/RLAN) e che abroga la decisione 2005/513/CE [notificata
    con il numero C(2022) 628]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/179 (2022. gada 8. februāris)
    par radiofrekvenču spektra harmonizētu lietošanu 5 GHz frekvenču joslā bezvadu
    piekļuves sistēmu, ieskaitot lokālos radiotīklus, darbības nodrošināšanai
    un Lēmuma 2005/513/EK atcelšanu (izziņots ar dokumenta numuru C(2022) 628)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/179 2022 m. vasario 8 d. dėl
    suderinto radijo spektro naudojimo 5 GHz dažnių juostoje belaidės prieigos
    sistemoms, įskaitant vietinius radijo ryšio tinklus, diegti, kuriuo panaikinamas
    Sprendimas 2005/513/EB (pranešta dokumentu Nr. C(2022) 628)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/179 tat-8
    ta’ Frar 2022 dwar l-użu armonizzat tal-ispettru tar-radju fil-banda ta’
    frekwenzi ta’ 5 GHz għall-implimentazzjoni ta’ sistemi ta’ aċċess mingħajr
    fili inklużi n-networks ta’ żoni lokali bir-radju u li tħassar id-Deċiżjoni
    2005/513/KE (notifikata bid0dokument C(2022) 628)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/179 van de Commissie van 8 februari 2022 betreffende
    het geharmoniseerde gebruik van het radiospectrum in de 5GHz-frequentieband voor
    de implementatie van draadloze toegangssystemen met inbegrip van radio local area
    networks en tot intrekking van Beschikking 2005/513/EG (Kennisgeving geschied
    onder nummer C(2022) 628)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/179 z dnia 8 lutego 2022 r. w sprawie
    zharmonizowanego wykorzystania widma radiowego w paśmie częstotliwości 5 GHz
    na potrzeby wdrożenia systemów dostępu bezprzewodowego, w tym lokalnych sieci
    radiowych, i uchylająca decyzję 2005/513/WE (notyfikowana jako dokument nr C(2022)
    628)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/179 da Comissão de 8 de fevereiro de
    2022 relativa à utilização harmonizada do espectro de radiofrequências na
    faixa de frequências dos 5 GHz para a implementação de sistemas de acesso sem
    fios, incluindo redes locais via rádio, e que revoga a Decisão 2005/513/CE [notificada
    com o número C(2022) 628]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/179 a Comisiei din 8 februarie
    2022 privind utilizarea armonizată a spectrului radio în banda de frecvență
    de 5 GHz pentru instalarea sistemelor de acces fără fir, inclusiv a rețelelor
    radio locale, și de abrogare a Deciziei 2005/513/CE [notificată cu numărul
    C(2022) 628]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/179 z 8. februára 2022 o harmonizovanom
    využívaní rádiového frekvenčného spektra v pásme 5 GHz na zavedenie bezdrôtových
    prístupových systémov vrátane miestnych rádiových sietí a o zrušení rozhodnutia
    2005/513/ES [oznámené pod číslom C(2022) 628]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/179 z dne 8. februarja 2022 o usklajeni
    uporabi radiofrekvenčnega spektra v frekvenčnem pasu 5 GHz za izvedbo brezžičnih
    dostopovnih sistemov, vključno z radijskimi lokalnimi omrežji, in razveljavitvi
    Odločbe 2005/513/ES (notificirano pod dokumentarno številko C(2022) 628)
  type: main
- language: es
