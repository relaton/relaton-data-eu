id: EUDecision1980920
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/920/EEC: Commission Decision of 11 September 1980 amending Decision
    80/776/EEC authorizing the United Kingdom to take intra-Community surveillance
    measures in respect of imports of bananas originating in certain non-member countries
    and put into free circulation in the other Member States (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/920/CEE: Décision de la Commission, du 11 septembre 1980, modifiant
    la décision 80/776/CEE autorisant le Royaume-Uni à prendre des mesures de surveillance
    intracommunautaire à l''égard des importations de bananes originaires de certains
    pays tiers et mises en libre pratique dans les autres Etats membres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/920/EWG: Entscheidung der Kommission vom 11. September 1980 zur Änderung
    der Entscheidung 80/776/EWG, mit der das Vereinigte Königreich zu innergemeinschaftlichen
    Überwachungsmaßnahmen hinsichtlich der Einfuhr von Bananen ermächtigt wird,
    die ihren Ursprung in bestimmten Drittländern haben und sich in den übrigen
    Mitgliedstaaten im freien Verkehr befinden (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/920/EØF: Kommissionens beslutning af 11. september 1980 om ændring
    af beslutning 80/776/EØF om bemyndigelse af Det forenede Kongerige til at træffe
    foranstaltninger med henblik på tilsyn inden for Fællesskabet med indførsel
    af bananer, der har oprindelse i visse tredjelande, og som er overgået til fri
    omsætning i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/920/ΕΟΚ : Απόφαση της Επιτροπής, της 11ης
    Σεπτεμβρίου 1980, περί τροποποίησης της Απόφασης
    80/776/ΕΟΚ με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο να πάρει μέτρα ενδοκοινοτικής επιτήρησης
    όσον αφορά τις εισαγωγές μπανανών προέλευσης
    ορισμένων τρίτων χωρών που τίθενται σε ελεύθερη
    κυκλοφορία σε άλλα κράτη μέλη (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/920/CEE: Decisione della Commissione, dell''11 settembre 1980, che
    modifica la decisione 80/776/CEE che autorizza il Regno Unito a istituire una
    sorveglianza intracomunitaria sulle importazioni di banane originarie di taluni
    paesi terzi e messe in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/920/EEG: Beschikking van de Commissie van 11 september 1980 tot wijziging
    van Beschikking 80/776/EEG waarbij het Verenigd Koninkrijk wordt gemachtigd maatregelen
    inzake intracommunautair toezicht te treffen ten aanzien van de invoer van bananen
    van oorsprong uit bepaalde derde landen en in de andere Lid-Staten in het vrije
    verkeer gebracht (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
