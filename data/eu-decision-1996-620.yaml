  content: '96/620/EC: Council Decision of 1 October 1996 on the conclusion of an
    Agreement in the form of an Exchange of Letters between the European Community
    and the Kingdom of Morocco fixing, from 1 January 1994, the additional amount
    to be deducted from the levy or the customs duties on imports into the Community
    of untreated olive oil originating in Morocco'
  type: main
- language: fr
  script: Latn
