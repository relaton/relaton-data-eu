---
id: EURegulation20221645
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1645 of 14 July 2022 laying down
    rules for the application of Regulation (EU) 2018/1139 of the European Parliament
    and of the Council, as regards requirements for the management of information
    security risks with a potential impact on aviation safety for organisations covered
    by Commission Regulations (EU) No 748/2012 and (EU) No 139/2014 and amending Commission
    Regulations (EU) No 748/2012 and (EU) No 139/2014
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1645 de la Commission du 14 juillet 2022
    portant modalités d’application du règlement (UE) 2018/1139 du Parlement européen
    et du Conseil en ce qui concerne les exigences relatives à la gestion des risques
    liés à la sécurité de l’information susceptibles d’avoir une incidence
    sur la sécurité aérienne imposées aux organismes relevant des règlements
    (UE) no 748/2012 et (UE) no 139/2014 de la Commission et modifiant les règlements
    (UE) no 748/2012 et (UE) no 139/2014 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1645 der Kommission vom 14. Juli 2022 zur
    Festlegung von Vorschriften für die Anwendung der Verordnung (EU) 2018/1139 des
    Europäischen Parlaments und des Rates im Hinblick auf die Anforderungen an das
    Management von Informationssicherheitsrisiken mit potenziellen Auswirkungen auf
    die Flugsicherheit für Organisationen, die unter die Verordnungen (EU) Nr. 748/2012
    und (EU) Nr. 139/2014 der Kommission fallen, und zur Änderung der Verordnungen
    (EU) Nr. 748/2012 und (EU) Nr. 139/2014 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1645 на Комисията
    от 14 юли 2022 година за определяне на правила
    за прилагането на Регламент (ЕС) 2018/1139 на Европейския
    парламент и на Съвета по отношение на изискванията
    за управление на рисковете за информационната
    сигурност с потенциално въздействие върху
    авиационната безопасност за организациите,
    обхванати от регламенти (ЕС) № 748/2012 и (ЕС) №
    139/2014 на Комисията, и за изменение на регламенти
    (ЕС) № 748/2012 и (ЕС) № 139/2014 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1645 ze dne 14. července
    2022, kterým se stanoví prováděcí pravidla k nařízení Evropského parlamentu
    a Rady (EU) 2018/1139, pokud jde o požadavky na řízení rizik bezpečnosti
    informací s potenciálním dopadem na bezpečnost letectví pro organizace, na
    něž se vztahují nařízení Komise (EU) č. 748/2012 a (EU) č. 139/2014, a
    kterým se mění nařízení Komise (EU) č. 748/2012 a (EU) č. 139/2014
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1645 af 14. juli 2022 om
    regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2018/1139
    for så vidt angår krav til styring af informationssikkerhedsrisici med potentiel
    indvirkning på luftfartssikkerheden gældende for de organisationer, der er omfattet
    af Kommissionens forordning (EU) nr. 748/2012 og (EU) nr. 139/2014, og om ændring
    af Kommissionens forordning (EU) nr. 748/2012 og (EU) nr. 139/2014
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1645
    της Επιτροπής της 14ης Ιουλίου 2022 για τη θέσπιση
    κανόνων εφαρμογής του κανονισμού (ΕΕ) 2018/1139
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά τις απαιτήσεις για τη διαχείριση
    κινδύνων για την ασφάλεια των πληροφοριών
    με ενδεχόμενο αντίκτυπο στην ασφάλεια της
    αεροπορίας για τους φορείς που καλύπτονται
    από τους κανονισμούς (ΕΕ) αριθ. 748/2012 και (ΕΕ)
    αριθ. 139/2014 της Επιτροπής, και για την τροποποίηση
    των κανονισμών (ΕΕ) αριθ. 748/2012 και (ΕΕ) αριθ.
    139/2014 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/1645, 14. juuli 2022, millega
    kehtestatakse Euroopa Parlamendi ja nõukogu määruse (EL) 2018/1139 rakendamise
    eeskirjad nõuete osas, mis on seotud selliste infoturvariskide juhtimisega, mis
    võivad mõjutada komisjoni määrustega (EL) nr 748/2012 ja (EL) nr 139/2014
    hõlmatud organisatsioonide lennuohutust, ning muudetakse komisjoni määrusi
    (EL) nr 748/2012 ja (EL) nr 139/2014
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/1645, annettu 14 päivänä heinäkuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2018/1139 soveltamista
    koskevista säännöistä siltä osin kuin on kyse ilmailun turvallisuuteen mahdollisesti
    vaikuttavien tietoturvariskien hallintaa koskevista vaatimuksista komission asetusten
    (EU) N:o 748/2012 ja (EU) N:o 139/2014 soveltamisalaan kuuluville organisaatioille
    sekä komission asetusten (EU) N:o 748/2012 ja (EU) N:o 139/2014 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/1645 ón gCoimisiún an 14 Iúil 2022 lena
    leagtar síos rialacha maidir le cur i bhfeidhm Rialachán (AE) 2018/1139 ó Pharlaimint
    na hEorpa agus ón gComhairle, a mhéid a bhaineann le ceanglais, i ndáil le
    bainistíocht rioscaí slándála faisnéise a bhféadfadh tionchar a bheith acu
    ar shábháilteacht eitlíochta, ar eagraíochtaí a chumhdaítear le Rialacháin
    (AE) Uimh. 748/2012 agus Uimh. 139/2014 ón gCoimisiún agus lena leasaítear
    Rialacháin (AE) Uimh. 748/2012 agus Uimh. 139/2014 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1645 оd 14. srpnja 2022. o utvrđivanju
    pravila za primjenu Uredbe (EU) 2018/1139 Europskog parlamenta i Vijeća u pogledu
    zahtjeva za upravljanje rizicima za informacijsku sigurnost koji bi mogli utjecati
    na sigurnost zračnog prometa za organizacije obuhvaćene uredbama Komisije (EU)
    br. 748/2012 i (EU) br. 139/2014 i o izmjeni uredbi Komisije (EU) br. 748/2012
    i (EU) br. 139/2014
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1645 felhatalmazáson alapuló rendelete (2022.
    július 14.) az (EU) 2018/1139 európai parlamenti és tanácsi rendeletnek a
    748/2012/EU és a 139/2014/EU bizottsági rendelet hatálya alá tartozó szervezetekre
    vonatkozó, a repülésbiztonságra potenciálisan hatást gyakorló információbiztonsági
    kockázatok kezelésével kapcsolatos követelmények tekintetében történő
    alkalmazására irányadó szabályok megállapításáról, valamint a 748/2012/EU
    és a 139/2014/EU bizottsági rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1645 della Commissione del 14 luglio 2022
    recante modalità di applicazione del regolamento (UE) 2018/1139 del Parlamento
    europeo e del Consiglio per quanto riguarda i requisiti per la gestione dei rischi
    per la sicurezza delle informazioni con un potenziale impatto sulla sicurezza
    aerea per le imprese disciplinate dai regolamenti (UE) n. 748/2012 e (UE) n. 139/2014
    della Commissione e che modifica i regolamenti (UE) n. 748/2012 e (UE) n. 139/2014
    della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1645 (2022. gada 14. jūlijs), ar
    ko paredz noteikumus par Eiropas Parlamenta un Padomes Regulas (ES) 2018/1139
    piemērošanu attiecībā uz prasībām par tādu informācijas drošības risku
    pārvaldību, kuri spēj ietekmēt aviācijas drošumu, kas noteiktas organizācijām,
    uz kurām attiecas Komisijas Regulas (ES) Nr. 748/2012 un (ES) Nr. 139/2014, un
    ar ko groza Komisijas Regulas (ES) Nr. 748/2012 un (ES) Nr. 139/2014
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1645 2022 m. liepos 14 d.
    kuriuo nustatomos Europos Parlamento ir Tarybos reglamento (ES) 2018/1139 taikymo
    taisyklės, susijusios su Komisijos reglamentuose (ES) Nr. 748/2012 ir (ES) Nr.
    139/2014 nurodytoms organizacijoms taikytinais informacijos saugumo rizikos, galinčios
    turėti įtakos aviacijos saugai, valdymo reikalavimais, ir kuriuo iš dalies
    keičiami Komisijos reglamentai (ES) Nr. 748/2012 ir (ES) Nr. 139/2014
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1645 tal-14 ta’ Lulju 2022
    li jistabbilixxi regoli għall-applikazzjoni tar-Regolament (UE) 2018/1139 tal-Parlament
    Ewropew u tal-Kunsill, fir-rigward tar-rekwiżiti għall-ġestjoni tar-riskji
    għas-sigurtà tal-informazzjoni b’impatt potenzjali fuq is-sikurezza tal-avjazzjoni
    għall-organizzazzjonijiet koperti bir-Regolamenti tal-Kummissjoni (UE) Nru 748/2012
    u (UE) Nru 139/2014 u li jemenda r-Regolamenti tal-Kummissjoni (UE) Nru 748/2012
    u (UE) Nru 139/2014
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1645 van de Commissie van 14 juli 2022
    tot vaststelling van regels voor de toepassing van Verordening (EU) 2018/1139
    van het Europees Parlement en de Raad, wat betreft eisen voor het beheer van risico’s
    voor de informatiebeveiliging met mogelijke gevolgen voor de luchtvaartveiligheid
    voor organisaties die onder Verordeningen (EU) nr. 748/2012 en (EU) nr. 139/2014
    van de Commissie vallen en tot wijziging van Verordeningen (EU) nr. 748/2012 en
    (EU) nr. 139/2014 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1645 z dnia 14 lipca 2022
    r. ustanawiające zasady stosowania rozporządzenia Parlamentu Europejskiego i
    Rady (UE) 2018/1139 w odniesieniu do wymagań dotyczących zarządzania ryzykiem
    związanym z bezpieczeństwem informacji o potencjalnym wpływie na bezpieczeństwo
    lotnicze w odniesieniu do organizacji objętych zakresem stosowania rozporządzeń
    Komisji (UE) nr 748/2012 i (UE) nr 139/2014 oraz zmieniające rozporządzenia
    Komisji (UE) nr 748/2012 i (UE) nr 139/2014
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1645 da Comissão de 14 de julho de 2022
    que estabelece regras de execução do Regulamento (UE) 2018/1139 do Parlamento
    Europeu e do Conselho no que respeita aos requisitos em matéria de gestão dos
    riscos de segurança da informação com potencial impacto na segurança da aviação
    para as entidades abrangidas pelos Regulamentos (UE) n.o 748/2012 e (UE) n.o 139/2014
    da Comissão e que altera os Regulamentos (UE) n.o 748/2012 e (UE) n.o 139/2014
    da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1645 al Comisiei din 14 iulie 2022 de stabilire
    a normelor de aplicare a Regulamentului (UE) 2018/1139 al Parlamentului European
    și al Consiliului în ceea ce privește cerințele referitoare la managementul
    riscurilor în materie de securitate a informațiilor cu impact potențial asupra
    siguranței aviației impuse organizațiilor care intră sub incidența Regulamentelor
    (UE) nr. 748/2012 și (UE) nr. 139/2014 ale Comisiei și de modificare a Regulamentelor
    (UE) nr. 748/2012 și (UE) nr. 139/2014 ale Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1645 zo 14. júla 2022, ktorým
    sa stanovujú pravidlá uplatňovania nariadenia Európskeho parlamentu a Rady
    (EÚ) 2018/1139, pokiaľ ide o požiadavky na riadenie rizík v oblasti informačnej
    bezpečnosti s potenciálnym vplyvom na bezpečnosť letectva pre organizácie,
    na ktoré sa vzťahujú nariadenia Komisie (EÚ) č. 748/2012 a (EÚ) č. 139/2014,
    a ktorým sa menia nariadenia Komisie (EÚ) č. 748/2012 a (EÚ) č. 139/2014
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1645 z dne 14. julija 2022 o določitvi
    pravil za uporabo Uredbe (EU) 2018/1139 Evropskega parlamenta in Sveta glede zahtev
    za obvladovanje tveganj za informacijsko varnost, ki lahko vplivajo na varnost
    v letalstvu, za organizacije, zajete v uredbah Komisije (EU) št. 748/2012 in
    (EU) št. 139/2014, ter o spremembi uredb Komisije (EU) št. 748/2012 in (EU)
    št. 139/2014
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1645 de la Comisión de 14 de julio de 2022
    por el que se establecen disposiciones de aplicación del Reglamento (UE) 2018/1139
    del Parlamento Europeo y del Consejo en lo que se refiere a los requisitos relativos
    a la gestión de los riesgos relacionados con la seguridad de la información
    que puedan repercutir sobre la seguridad aérea destinados a las organizaciones
    contempladas en los Reglamentos (UE) n.o 748/2012 y (UE) n.o 139/2014 de la Comisión,
    y por el que se modifican los Reglamentos (UE) n.o 748/2012 y (UE) n.o 139/2014
    de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1645 av den 14 juli 2022
    om fastställande av tillämpningsföreskrifter för Europaparlamentets och rådets
    förordning (EU) 2018/1139 vad gäller krav för hantering av informationssäkerhetsrisker
    med potentiell inverkan på flygsäkerheten för organisationer som omfattas av
    kommissionens förordningar (EU) nr 748/2012 och (EU) nr 139/2014, och om ändring
    av kommissionens förordningar (EU) nr 748/2012 och (EU) nr 139/2014
  type: main
