- language: en
  script: Latn
  content: '2014/852/EU, Euratom: Commission Implementing Decision of 26 November
    2014 amending Decision 2005/820/EC, Euratom authorising the Slovak Republic to
    use statistics for years earlier than the last year but one and to use certain
    approximate estimates for the calculation of the VAT own resources base (notified
    under document C(2014) 8934)'
  type: main
- language: fr
  script: Latn
  content: '2014/852/UE, Euratom: Décision d''exécution de la Commission du 26 novembre
