title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2651/80 of 16 October 1980 re-establishing
    the levying of the customs duties on hand tools, etc., falling within heading
    No 82.03 and originating in China, to which the preferential tariff arrangements
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2651/80 de la Commission, du 16 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux tenailles,
    pinces, brucelles et similaires, etc., de la position 82.03 du tarif douanier
    commun, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2651/80 der Kommission vom 16. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Kneifzangen und andere Zangen aller Art, auch zum Schneiden,
    Pinzetten, usw., der Tarifnummer 82.03, mit Ursprung in China, dem die in der
    Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2651/80 af 16. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for knibtænger, bidetænger, niptænger pincetter,
    etc., under pos. 82.03, som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2651/80 della Commissione, del 16 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle tenaglie, pinze,
    pinzette e simili, ecc., della voce 82.03 della tariffa doganale comune, originarie
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2651/80 van de Commissie van 16 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tangen (ook
    buig-, snij- en ponstangen), pincetten en dergelijk gereedschap, enz., van post
    82.03, van oorsprong uit China ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad algemene tariefpreferenties werden geopend
  type: main
