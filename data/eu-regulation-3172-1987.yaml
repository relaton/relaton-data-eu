    64.02 A i Den Fælles Toldtarif, og læder af fåre- og lammeskind, henhørende
    under pos. 41.03 B II i Den Fælles Toldtarif og med oprindelse i Indien, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
