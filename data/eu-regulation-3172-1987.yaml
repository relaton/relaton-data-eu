    A und für Schaf- und Lammleder der Tarifstelle 41.03 B II des Gemeinsamen Zolltarifs
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3924/86 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3172/87 af 23. oktober 1987 om genindførelse
