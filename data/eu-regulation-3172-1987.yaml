  content: Commission Regulation (EEC) No 3172/87 of 23 October 1987 re-establishing
    the levying of customs duties on footwear with uppers of leather, falling within
    subheading 64.02 A, and to sheep and lamb skin leather, falling within subheading
    41.03 B II of the Common Customs Tariff, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3172/87 de la Commission du 23 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux chaussures
    à dessus en cuir naturel de la sous-position 64.02 A et aux peaux d' ovins, préparées,
    de la sous-position 41.03 B II du tarif douanier commun, originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3172/87 der Kommission vom 23. Oktober 1987 zur Wiedereinführung
