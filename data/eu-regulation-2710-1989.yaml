  content: Commission Regulation (EEC) No 2710/89 of 7 September 1989 re-establishing
    the levying of customs duties on copper bars, rods and profiles, tubes and pipes
    falling within CN codes ex 7407 and 7411 originating in Mexico to which the preferential
    tariff arrangement set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
