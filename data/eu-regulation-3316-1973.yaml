id: EURegulation33161973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3316/73 of the Commission of 6 December 1973 re-establishing
    Common Customs Tariff duties on reconstituted wood, being wood shavings, falling
    within heading No 44.18, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3316/73 de la Commission, du 6 décembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux bois dits "artificiels" ou "reconstitués" de la position tarifaire 44.18,
    originaires de Yougoslavie bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3316/73 der Kommission vom 6. Dezember 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für sogenanntes Kunstholz, aus Holzspänen
    usw., der Tarifnummer 44.18, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3316/73 af 6. december 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for kunstigt træ, fremstillet af spåner,
    savsmuld, træmel eller andet træagtigt affald, under position 44.18, som har
    oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3316/73 della Commissione, del 6 dicembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili al
    legno detto "artificiale" o "ricostituito" della voce doganale n. 44.18 originari
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3316/73 van de Commissie van 6 december 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kunsthout enz., in de vorm van panelen, platen, blokken e.d.
    vormen van post 44.18, van oorsprong uit Joegoslavië, ten behoeve waarvan bij
    Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
