title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 mai 1971, autorisant la République italienne
    à exclure du traitement communautaire les parties, pièces détachées et accessoires
    de motocycles de la position 87.12 A du Tarif douanier commun, originaires du
    Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/206/EWG: Entscheidung der Kommission vom 18. Mai 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Teile und Zubehöre für Krafträder
    der Tarifnummer 87.12 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/206/CEE: Decisione della Commissione, del 18 maggio 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario parti, pezzi staccati
    ed accessori per motocicli della voce 87.12 A della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/206/EEG: Beschikking van de Commissie van 18 mei 1971 waarbij de Italiaanse
    Republiek wordt gemachtigd delen, onderdelen en toebehoren voor motorrijwielen
    van post 87.12 A van het gemeenschappelijk douanetarief, van oorsprong uit Japan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
