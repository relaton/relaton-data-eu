    по санитарните и фитосанитарните въпроси,
    Митническия подкомитет и Подкомитета по географските
    означения относно техните процедурни правилници
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2015/201 ze dne 27. ledna 2015 o postoji, který
    má být jménem Evropské unie zaujat v Podvýboru pro sanitární a fytosanitární
    otázky, Podvýboru pro cla a v Podvýboru pro zeměpisná označení zřízených
    Dohodou o přidružení mezi Evropskou unií a Evropským společenstvím pro
    atomovou energii a jejich členskými státy na jedné straně a Gruzií na straně
    druhé, pokud jde o rozhodnutí Podvýboru pro sanitární a fytosanitární otázky,
    Podvýboru pro cla a Podvýboru pro zeměpisná označení, kterými se přijímají
    jejich jednací řády
  type: main
