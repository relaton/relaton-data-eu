title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/201 of 27 January 2015 on the position to be
    taken on behalf of the European Union within the Sanitary and Phytosanitary Sub-Committee,
    the Customs Sub-Committee and the Geographical Indications Sub-Committee established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and Georgia, of the
    other part, as regards the adoption of decisions of the Sanitary and Phytosanitary
    Sub-Committee, the Customs Sub-Committee, and the Geographical Indications Sub-Committee
    on their Rules of Procedure
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/201 du Conseil du 27 janvier 2015 relative à la position
    à prendre au nom de l'Union européenne au sein du sous-comité sanitaire et
    phytosanitaire, du sous-comité douanier et du sous-comité concernant les indications
    géographiques, institués par l'accord d'association entre l'Union européenne
    et la Communauté européenne de l'énergie atomique et leurs États membres,
    d'une part, et la Géorgie, d'autre part, en ce qui concerne l'adoption de décisions
    du sous-comité sanitaire et phytosanitaire, du sous-comité douanier et du sous-comité
    concernant les indications géographiques sur leurs règlements intérieurs
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/201 des Rates vom 27. Januar 2015 über den Standpunkt,
    der im Namen der Europäischen Union in den mit dem Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und Georgien andererseits eingesetzten Unterausschüssen „Gesundheitspolizeiliche
    und pflanzenschutzrechtliche Fragen“ , „Zoll“ und „Geografische Angaben“
    bezüglich der Annahme von Beschlüssen über die Geschäftsordnungen der besagten
    Unterausschüsse zu vertreten ist
  type: main
