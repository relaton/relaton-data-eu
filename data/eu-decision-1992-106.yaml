title:
- language: en
  script: Latn
  content: '92/106/EEC: Commission Decision of 30 January 1992 amending Decision 90/53/EEC
    authorizing Member States temporarily to take additional measures against the
    dissemination of Corynebacterium sepedonicum as regards the Federal Republic of
    Germany'
  type: main
- language: fr
  script: Latn
  content: '92/106/CEE: Décision de la Commission du 30 janvier 1992 modifiant la
    décision 90/53/CEE autorisant les États membres à prendre provisoirement des
    mesures supplémentaires en vue de se protéger contre la propagation du Corynebacterium
    sepedonicum en provenance de la République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 30. Januar 1992 zur Änderung der Entscheidung
    90/53/EWG zur Ermächtigung bestimmter Mitgliedstaaten, vorübergehend zusätzliche
    Maßnahmen gegen die Verbreitung von Corynebacterium sepedonicum gegenüber der
    Bundesrepublik Deutschland zu treffen (92/106/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 30. januar 1992 om ændring af beslutning
    90/53/EØF om bemyndigelse af medlemsstaterne til midlertidigt at træffe supplerende
    foranstaltninger til beskyttelse mod spredning af Corynebacterium sepedonicum
    for så vidt angår Forbundsrepublikken Tyskland (92/106/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/106/ΕΟΚ : Απόφαση της Επιτροπής της 30ής
    Ιανουαρίου 1992 περί τροποποιήσεως της απόφασης
    90/53/ΕΟΚ που επιτρέπει προσωρινά στα κράτη μέλη
    να λάβουν συμπληρωματικά μέτρα έναντι της
    Ομοσπονδιακής Δημοκρατίας της Γερμανίας κατά
    της εξάπλωσης του Corynedbacterium sepedonicum'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 30 gennaio 1992 recante modifica della
    decisione 90/53/CEE che autorizza gli Stati membri a prendere provvisoriamente
    misure supplementari per cautelarsi contro la propagazione del Corynebacterium
    sepedonicum relativamente alla Repubblica federale di Germania (92/106/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 30 januari 1992 tot wijziging van Beschikking
    90/53/EEG houdende machtiging van de Lid-Staten om ten aanzien van de Bondsrepubliek
    Duitsland tijdelijk aanvullende maatregelen te nemen ten einde zich te beschermen
    tegen de verspreiding van Corynebacterium sepedonicum (92/106/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '92/106/CEE: Decisão da Comissão, de 30 de Janeiro de 1992, que altera
    a Decisão 90/53/CEE, que autoriza determinados Estados­membros a adoptar, temporariamente,
    medidas adicionais em relação à República Federal da Alemanha para se protegerem
    contra a introdução do Corynebacterium sepedonicum'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 30 de enero de 1992 que modifica la Decisión
    90/53/CEE por la que se autoriza a los Estados miembros para que adopten provisionalmente
    las medidas complementarias necesarias para protegerse contra la introducción
    del Corynebacterium sepedonicum procedente de la República Federal de Alemania
    (92/106/CEE) #'
  type: main
