title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2278/82 of 17 August 1982 re-establishing
    the levying of customs duties on footwear, falling within subheading 64.02 B and
    originating in India, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2278/82 de la Commission, du 17 août 1982, portant
    rétablissement de la perception des droits de douane applicables aux chaussures,
    de la sous-position 64.02 B du tarif douanier commun, originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseile
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2278/82 der Kommission vom 17. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe der Tarifstelle 64.02 B, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2278/82 af 17. august 1982 om genindførelse
    af opkrævning af told for fodtøj, henhørende under pos. 64.02 B med oprindelse
    i Indien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2278/82 τής Επιτροπής
    τής 17ης Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά υποδήματα τής διακρίσεως
    61. 02 Β τού Κοινού Δασμολογίου, καταγωγής Ινδίας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2278/82 della Commissione, del 17 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle calzature della sottovoce
    64.02 B della tariffa doganale comune, originarie dell' India, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del ConsiglioU
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2278/82 van de Commissie van 17 augustus 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel,
    van postonderverdeling 64.02 B, van oorsprong uit India, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
