    Egyesült Királyságának és koronafüggőségeinek az emberi fogyasztásra
    szánt nyers tej, tejtermékek, kolosztrum és kolosztrumalapú termékek szállítmányainak
    az Unióba történő beléptetésére engedéllyel rendelkező harmadik országok
