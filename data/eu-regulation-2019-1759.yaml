    Priloga I. Uredbi (EU) br. 605/2010 u pogledu uvrštenja Ujedinjene Kraljevine
    Velike Britanije i Sjeverne Irske i njezinih krunskih posjeda na popis trećih
    zemalja ili njihovih dijelova iz kojih je odobreno unošenje u Uniju pošiljaka
    sirovog mlijeka, mliječnih proizvoda, kolostruma i proizvoda na osnovi kolostruma
    namijenjenih prehrani ljudi
  type: main
