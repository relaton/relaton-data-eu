title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1759 of 23 October 2019 amending
    Annex I to Regulation (EU) No 605/2010 as regards the inclusion of the United
    Kingdom of Great Britain and Northern Ireland and its Crown Dependencies in the
    list of third countries or parts thereof authorised for the introduction into
    the Union of consignments of raw milk, dairy products, colostrum and colostrum-based
    products intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2019/1759 de la Commission du 23 octobre
    2019 modifiant l’annexe I du règlement (UE) no 605/2010 en ce qui concerne
    l’inscription du Royaume-Uni de Grande-Bretagne et d’Irlande du Nord et des
    dépendances de la Couronne sur la liste des pays tiers ou parties de pays tiers
    en provenance desquels l’introduction dans l’Union de lots de lait cru, de
    produits laitiers, de colostrum et de produits à base de colostrum destinés
    à la consommation humaine est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1759 der Kommission vom 23. Oktober
    2019 zur Änderung des Anhangs I der Verordnung (EU) Nr. 605/2010 im Hinblick
    auf die Aufnahme des Vereinigten Königreichs Großbritannien und Nordirland und
    seiner unmittelbar der englischen Krone unterstehenden Gebiete in die Liste von
    Drittländern und Teilen von Drittländern, aus denen das Verbringen von Sendungen
    mit Rohmilch, Milcherzeugnissen, Kolostrum und Erzeugnissen auf Kolostrumbasis
    zum menschlichen Verzehr in die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1759 на Комисията
    от 23 октомври 2019 година за изменение на приложение
    I към Регламент (ЕС) № 605/2010 по отношение на включването
    на Обединеното кралство Великобритания и Северна
    Ирландия и на териториите, зависими от Британската
    корона, в списъка на третите държави или части
    от тях, от които е разрешено въвеждането в Съюза
    на пратки със сурово мляко, млечни продукти,
    коластра и продукти от коластра, предназначени
    за консумация от човека
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1759 ze dne 23. října 2019,
    kterým se mění příloha I nařízení (EU) č. 605/2010, pokud jde o zahrnutí
    Spojeného království Velké Británie a Severního Irska a jeho závislých
    území do seznamu třetích zemí nebo jejich částí, ze kterých je povolen
    dovoz zásilek syrového mléka, mléčných výrobků, mleziva a výrobků z
    mleziva určených k lidské spotřebě do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1759 af 23. oktober 2019
