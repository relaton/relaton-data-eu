title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3567/84 of 18 December 1984 opening, allocating
    and providing for the administration of a Community tariff quota for boysenberries,
    preserved by freezing, not containing added sugar, intended for any form of processing
    except for the manufacture of jam entirely from boysenberries, falling within
    subheading ex 08.10 D of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3567/84 du Conseil du 18 décembre 1984 portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire pour
    des boysenberries, congelées, sans addition de sucre, destinées à toute transformation,
    à l' exception de la fabrication de confiture entièrement de boysenberries,
    de la sous-position ex 08.10 D du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3567/84 des Rates vom 18. Dezember 1984 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für Boysenbeeren,
    gefroren, ohne Zusatz von Zucker, für jegliche Verarbeitung, ausgenommen zum
    Herstellen von vollständig aus Boysenbeeren bestehender Konfitüre, der Tarifstelle
    ex 08.10 D des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3567/84 af 18. december 1984 om åbning fordeling
    og forvaltning af et fællesskabstoldkontingent for "boysenberries", frosne, ikke
    tilsat sukker, til al slags forarbejdning med undtagelse af fremstilling af marmelade
    udelukkende af "boysenberries", henhørende under pos. ex 08.10 D i den fælles
    toldtarif
  type: main
- language: el
  script: Grek
