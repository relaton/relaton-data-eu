title:
- language: en
  script: Latn
  content: Second Council Directive 78/1034/EEC of 19 December 1978 amending Directive
    74/651/EEC on the tax reliefs to be allowed on the importation of goods in small
    consignments of a non-commercial character within the Community
  type: main
- language: fr
  script: Latn
  content: Deuxième directive 78/1034/CEE du Conseil, du 19 décembre 1978, modifiant
    la directive 74/651/CEE relative aux franchises fiscales applicables à l'importation
    des marchandises faisant l'objet de petits envois sans caractère commercial au
    sein de la Communauté
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 78/1034/EWG des Rates vom 19. Dezember 1978 zur Änderung
    der Richtlinie 74/651/EWG über Steuerbefreiungen bei der Einfuhr von Waren in
    Kleinsendungen nichtkommerzieller Art innerhalb der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets andet direktiv 78/1034/EØF af 19. december 1978 om ændring af
    direktiv 74/651/EØF om afgiftsfritagelse ved indførsel af varer i småforsendelser
    uden erhvervsmæssig karakter inden for Fællesskabet
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 78/1034/ΕΟΚ του Συμβουλίου
    της 19ης Δεκεμβρίου 1978 περί τροποποιήσεως της
    οδηγίας 74/651/ΕΟΚ περί των φορολογικών ατελειών
    των χορηγουμένων κατά την εισαγωγή εμπορευμάτων
    υπό μορφή μικροδεμάτων μη εμπορικού χαρακτήρος
    εντός της Κοινότητος
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 78/1034/CEE del Consiglio, del 19 dicembre 1978, che
    modifica la direttiva 74/651/CEE relativa alle franchigie fiscali applicabili
    all'importazione delle merci oggetto di piccole spedizioni a carattere non commerciale
    all'interno della Comunità
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 78/1034/EEG van de Raad van 19 december 1978 tot wijziging
    van Richtlijn 74/651/EEG inzake de bij invoer van kleine zendingen goederen zonder
    commercieel karakter toepasselijke belastingvrijstellingen binnen de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 78/1034/CEE do Conselho, de 19 de Dezembro de 1978, que
    altera a Directiva 74/651/CEE relativa às isenções fiscais aplicáveis à importação
    das mercadorias objecto de pequenas remessas sem carácter comercial, na Comunidade
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 78/1034/CEE del Consejo, de 19 de diciembre de 1978,
    por la que se modifica la Directiva 74/651/CEE relativa a las franquicias fiscales
    aplicables a la importación de mercancías objeto de pequeños envíos sin carácter
    comercial en el interior de la Comunidad
  type: main
