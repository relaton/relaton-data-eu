    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de diciembre de 2003 al amparo del régimen previsto en
    los Acuerdos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría, la República Checa, Eslovaquia, Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2259/2003 av den 22 december 2003 om
