    za úředně prosté tuberkulózy skotu a enzootické leukózy skotu a prohlášení
    Slovenska za úředně prosté enzootické leukózy skotu (oznámeno pod číslem
    K(2006) 1551)'
  type: main
- language: da
  script: Latn
  content: '2006/290/EF: Kommissionens beslutning af 18. april 2006 om ændring af
