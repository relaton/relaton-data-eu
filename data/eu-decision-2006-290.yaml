title:
- language: en
  script: Latn
  content: '2006/290/EC: Commission Decision of 18 April 2006 amending Decision 2003/467/EC
    as regards the declaration that certain regions of Italy are officially free of
    bovine tuberculosis and enzootic bovine leukosis and that Slovakia is officially
    free of enzootic bovine leukosis (notified under document number C(2006) 1551)'
  type: main
- language: fr
  script: Latn
  content: '2006/290/CE: Décision de la Commission du 18 avril 2006 modifiant la
    décision 2003/467/CE en ce qui concerne la déclaration selon laquelle certaines
    régions d''Italie sont officiellement indemnes de tuberculose bovine et de leucose
    bovine enzootique et la déclaration selon laquelle la Slovaquie est officiellement
    indemne de leucose bovine enzootique [notifiée sous le numéro C(2006) 1551]'
  type: main
- language: de
  script: Latn
  content: '2006/290/EG: Entscheidung der Kommission vom 18. April 2006 zur Änderung
    der Entscheidung 2003/467/EG hinsichtlich der Erklärung, dass bestimmte Regionen
    Italiens amtlich frei von Rindertuberkulose und enzootischer Rinderleukose sind
    und dass die Slowakei amtlich frei von enzootischer Rinderleukose ist (Bekannt
    gegeben unter Aktenzeichen K(2006) 1551)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 18 април 2006 година
    за изменение на Решение 2003/467/ЕО относно декларацията,
    че определени региони на Италия са официално
    свободни от туберкулоза и ензоотична левкоза
    по говедата, както и че Словакия официално
    е свободна от ензоотична левкоза по говедата
    (нотифицирано под номер C(2006) 1551)
  type: main
- language: cs
  script: Latn
