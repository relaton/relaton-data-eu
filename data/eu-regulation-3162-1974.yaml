title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3162/74 of the Commission of 13 December 1974 laying
    down detailed rules for the imposition in the event of sugar supply difficulties
    of an export charge on certain cereal, rice, milk, fruit and vegetable-based products
    containing added sugar
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3162/74 de la Commission, du 13 décembre 1974, établissant
    des modalités d'application concernant la perception d'une taxe à l'exportation
    de certains produits sucrés à base de céréales, de riz, de lait et de fruits
    et légumes, en cas de difficultés d'approvisionnement en sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3162/74 der Kommission vom 13. Dezember 1974 mit Durchführungsvorschriften
    für die Erhebung einer Abgabe bei der Ausfuhr von gewissen zuckerhaltigen Verarbeitungserzeugnissen
    aus Getreide, Reis, Milch, Obst, und Gemüse im Falle von Zuckerversorgungsschwierigkeiten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3162/74 af 13. december 1974 om gennemførelsesbestemmelser
    vedrørende opkrævning af en eksportafgift for visse sukkerprodukter fremstillet
    af korn, ris, mælk og frugt og grønsager i tilfælde af forsyningsvanskeligheder
    med hensyn til sukker
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3162/74 della Commissione, del 13 dicembre 1974, che
    stabilisce modalità d'applicazione per la riscossione di una tassa all'esportazione
    su taluni prodotti zuccherati a base di cereali, di riso, di latte e di ortofrutticoli,
    in caso di difficoltà di approvvigionamento in zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3162/74 van de Commissie van 13 december 1974 houdende
    uitvoeringsbepalingen inzake de heffing, in geval van moeilijkheden bij de suikervoorziening,
    van een belasting bij de uitvoer van bepaalde produkten op basis van granen, rijst,
    melk, groenten en fruit, waaraan suiker is toegevoegd
  type: main
