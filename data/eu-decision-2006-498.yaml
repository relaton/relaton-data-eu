title:
- language: en
  script: Latn
  content: '2006/498/EC: Commission Decision of 14 July 2006 requiring Member States
    to take measures to ensure that only lighters which are child-resistant are placed
    on the market and to prohibit the placing on the market of novelty lighters (notified
    under documents number C(2006) 1887 and number C(2006) 1887 COR)'
  type: main
- language: fr
  script: Latn
  content: '2006/498/CE: Décision de la Commission du 14 juillet 2006 exigeant des
    États membres qu''ils prennent des mesures destinées à faire en sorte que seuls
    les briquets présentant des caractéristiques de sécurité enfants soient mis
    sur le marché et à interdire la mise sur le marché de briquets fantaisie [notifiée
    sous les numéros C(2006) 1887 et C(2006) 1887 COR]'
  type: main
- language: de
  script: Latn
  content: '2006/498/EG: Entscheidung der Kommission vom 14. Juli 2006 zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekannt gegeben unter den Aktenzeichen K(2006) 1887 und K(2006)
    1887 COR)'
  type: main
- language: cs
  script: Latn
  content: '2006/498/ES: Rozhodnutí Komise ze dne 14. července 2006 , kterým se
