    se na trh uváděly pouze zapalovače, které jsou odolné dětem a zakázaly
    uvádět na trh zapalovače neobvyklého typu (novelty) (oznámeno pod číslem
    K(2006) 1887 a pod číslem K(2006) 1887 COR)'
  type: main
- language: da
