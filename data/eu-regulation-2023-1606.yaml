    przepisów dotyczących chronionych nazw pochodzenia i chronionych oznaczeń geograficznych
    dla wina oraz dotyczących przedstawiania obowiązkowych danych szczegółowych
    produktów sektora wina, a także przepisów szczegółowych dotyczących oznaczania
    i określania składników produktów sektora wina, oraz zmieniające rozporządzenie
    delegowane (UE) 2018/273 w odniesieniu do certyfikacji importowanych produktów
    sektora wina
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1606 da Comissão de 30 de maio de 2023
    que altera o Regulamento Delegado (UE) 2019/33 no respeitante a determinadas disposições
    relativas às denominações de origem protegidas e às indicações geográficas
    protegidas do vinho, à apresentação das indicações obrigatórias para os
    produtos vitivinícolas e às regras específicas para a indicação e a designação
    dos ingredientes dos produtos vitivinícolas, e o Regulamento Delegado (UE) 2018/273
    no respeitante à certificação dos produtos vitivinícolas importados
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1606 al Comisiei din 30 mai 2023 de modificare
    a Regulamentului delegat (UE) 2019/33 în ceea ce privește anumite dispoziții
    referitoare la denumirile de origine protejate și indicațiile geografice protejate
    ale vinurilor și la prezentarea indicațiilor obligatorii pentru produsele vitivinicole
    și norme specifice referitoare la indicarea și denumirea ingredientelor produselor
    vitivinicole, precum și de modificare a Regulamentului delegat (UE) 2018/273
    în ceea ce privește certificarea produselor vitivinicole importate
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1606 z 30. mája 2023, ktorým
    sa mení delegované nariadenie (EÚ) 2019/33, pokiaľ ide o určité ustanovenia
    týkajúce sa chránených označení pôvodu a chránených zemepisných označení
    v prípade vína a uvádzania povinných údajov v prípade vinárskych výrobkov
    a pokiaľ ide o osobitné pravidlá uvádzania a označovania zložiek vinárskych
    výrobkov, a delegované nariadenie (EÚ) 2018/273, pokiaľ ide o sprievodné
    doklady na monitorovanie a certifikáciu dovážaných vinárskych výrobkov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1606 z dne 30. maja 2023 o spremembi
    Delegirane uredbe Komisije (EU) 2019/33 glede nekaterih določb o zaščitenih
    označbah porekla in zaščitenih geografskih označbah za vino ter predstavitvi
    obveznih navedb za proizvode vinske trte in glede posebnih pravil za navedbo in
    poimenovanje sestavin za proizvode vinske trte ter o spremembi Uredbe (EU) 2018/273
    glede certificiranja uvoženih vinskih proizvodov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1606 de la Comisión de 30 de mayo de 2023
    por el que se modifica el Reglamento Delegado (UE) 2019/33, en lo que atañe a
    determinadas disposiciones relativas a las denominaciones de origen protegidas
    y las indicaciones geográficas protegidas del vino y a la presentación de las
    indicaciones obligatorias para los productos vitivinícolas y las normas específicas
    para la indicación y denominación de los ingredientes de los productos vitivinícolas,
    y el Reglamento Delegado (UE) 2018/273, en lo que atañe a la certificación de
    los productos vitivinícolas importados
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1606 av den 30 maj 2023
    om ändring av delegerad förordning (EU) 2019/33 vad gäller vissa bestämmelser
    om skyddade ursprungsbeteckningar och skyddade geografiska beteckningar för vin
    och om presentation av obligatoriska uppgifter för vinprodukter samt särskilda
    regler om beteckning av ingredienser för vinprodukter, och av delegerad förordning
    (EU) 2018/273 vad gäller certifiering av importerade vinprodukter
