    oltalom alatt álló eredetmegjelölésekre és oltalom alatt álló földrajzi
    jelzésekre, valamint a szőlőből készült termékek kötelező adatainak feltüntetésére
    vonatkozó egyes rendelkezések, továbbá a szőlőből készült termékek összetevőinek
    feltüntetésére és megnevezésére vonatkozó különös szabályok tekintetében
    történő módosításáról, valamint az (EU) 2018/273 felhatalmazáson alapuló
    rendeletnek az importált borászati termékek tanúsítása tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/1606 della Commissione del 30 maggio 2023
    che modifica il regolamento delegato (UE) 2019/33 per quanto riguarda alcune disposizioni
    sulle denominazioni di origine protette e sulle indicazioni geografiche protette
    dei vini e sulla presentazione delle indicazioni obbligatorie dei prodotti vitivinicoli
    nonché norme specifiche relative all’indicazione e alla designazione degli
    ingredienti dei prodotti vitivinicoli e il regolamento delegato (UE) 2018/273
    per quanto riguarda la certificazione dei prodotti vitivinicoli importati
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1606 (2023. gada 30. maijs), ar
    kuru Deleģēto regulu (ES) 2019/33 groza attiecībā uz dažiem noteikumiem par
    aizsargātiem vīna cilmes vietas nosaukumiem un aizsargātām vīna ģeogrāfiskās
    izcelsmes norādēm un par vīnkopības produktus aprakstošo obligāto ziņu
    noformējumu un attiecībā uz īpašiem noteikumiem par vīnkopības produktu
    sastāvdaļu norādīšanu un apzīmēšanu un Deleģēto regulu (ES) 2018/273
    groza attiecībā uz importētu vīna produktu sertifikāciju
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1606 2023 m. gegužės 30
    d. kuriuo dėl tam tikrų nuostatų dėl vyno saugomų kilmės vietos nuorodų
    ir saugomų geografinių nuorodų ir dėl privalomų duomenų apie vynuogių produktus
    pateikimo ir dėl vynuogių produktų sudedamųjų dalių nurodymo ir paskirties
    specialiųjų taisyklių iš dalies keičiamas Deleguotasis reglamentas (ES) 2019/33,
    o dėl importuojamų vyno produktų sertifikavimo iš dalies keičiamas Deleguotasis
    reglamentas (ES) 2018/273
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/1606 tat-30 ta’ Mejju 2023
    li jemenda r-Regolament Delegat (UE) 2019/33 fir-rigward ta’ ċerti dispożizzjonijiet
    dwar denominazzjonijiet ta’ oriġini protetti u indikazzjonijiet ġeografiċi
    protetti għall-inbid u dwar il-preżentazzjoni ta’ dettalji obbligatorji għall-prodotti
    tad-dwieli u regoli speċifiċi għall-indikazzjoni u għad-denominazzjoni ta’
    ingredjenti għall-prodotti tad-dwieli, u r-Regolament Delegat (UE) 2018/273 fir-rigward
    taċ-ċertifikazzjoni ta’ prodotti tal-inbid importati
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/1606 van de Commissie van 30 mei 2023
    tot wijziging van Gedelegeerde Verordening (EU) 2019/33 wat betreft een aantal
    bepalingen inzake beschermde oorsprongsbenamingen en beschermde geografische aanduidingen
    voor wijn en inzake de presentatie van verplichte aanduidingen bij wijnbouwproducten
    en bijzondere regels voor de vermelding en aanduiding van ingrediënten bij wijnbouwproducten
    en tot wijziging van Gedelegeerde Verordening (EU) 2018/273 wat betreft de certificering
    van ingevoerde wijnbouwproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1606 z dnia 30 maja 2023 r.
