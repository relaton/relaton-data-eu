    le haghaidh táirgí fíniúna agus rialacha sonracha maidir le comhábhair a
    shonrú agus a ainmniú le haghaidh táirgí fíniúna, agus Rialachán Tarmligthe
    (AE) 2018/273 a mhéid a bhaineann le táirgí fíona allmhairithe a dheimhniú
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1606 оd 30. svibnja 2023. o izmjeni
    Delegirane uredbe (EU) 2019/33 u pogledu određenih odredaba o zaštićenim oznakama
    izvornosti i zaštićenim oznakama zemljopisnog podrijetla za vino i o prezentiranju
    obveznih podataka za proizvode od vinove loze i u pogledu posebnih pravila za
    navođenje i označivanje sastojaka proizvoda od vinove loze te o izmjeni Delegirane
    uredbe (EU) 2018/273 u pogledu certificiranja uvezenih vinskih proizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1606 felhatalmazáson alapuló rendelete (2023.
