title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1606 of 30 May 2023 amending
    Delegated Regulation (EU) 2019/33 as regards certain provisions on protected denominations
    of origin and protected geographical indications for wine and on the presentation
    of compulsory particulars for grapevine products and specific rules for the indication
    and designation of ingredients for grapevine products, and Delegated Regulation
    (EU) 2018/273 as regards the certification of imported wine products
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1606 de la Commission du 30 mai 2023 modifiant
    le règlement délégué (UE) 2019/33 en ce qui concerne les dispositions relatives
    aux appellations d’origine protégées et aux indications géographiques protégées
    pour le vin et à la présentation des indications obligatoires pour les produits
    de la vigne et les règles relatives à l’indication et à la désignation des
    ingrédients pour les produits de la vigne, et modifiant le règlement délégué
    (UE) 2018/273 en ce qui concerne la certification des produits vitivinicoles importés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1606 der Kommission vom 30. Mai 2023 zur
    Änderung der Delegierten Verordnung (EU) 2019/33 hinsichtlich gewisser Bestimmungen
    über geschützte Ursprungsbezeichnungen und geschützte geografische Angaben
    für Wein und über die Anbringung der obligatorischen Angaben für Weinbauerzeugnisse
    sowie besonderer Vorschriften für die Angabe und Bezeichnung von Zutaten von
    Weinbauerzeugnissen und zur Änderung der Delegierten Verordnung (EU) 2018/273
    hinsichtlich der Zertifizierung eingeführter Weinbauerzeugnisse
  type: main
- language: bg
  script: Cyrl
