    регламент (ЕС) 2019/33 по отношение на определени
    разпоредби относно защитените наименования
    за произход и защитените географски указания
    за вината и относно представянето на задължителни
    данни за лозаро-винарските продукти и специални
    правила за посочване и обозначаване на съставките
    за лозаро-винарските продукти и за изменение
    на Делегиран регламент (ЕС) 2018/273 по отношение
    на сертифицирането на внесените лозаро-винарски
    продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1606 ze dne 30. května
    2023, kterým se mění nařízení v přenesené pravomoci (EU) 2019/33, pokud
    jde o některá ustanovení o chráněných označeních původu a chráněných
    zeměpisných označeních pro víno a o uvádění povinných údajů u výrobků
    z révy vinné a pokud jde o zvláštní pravidla pro uvádění a označování
    složek výrobků z révy vinné, a nařízení v přenesené pravomoci (EU) 2018/273,
    pokud jde o certifikaci dovážených vinařských výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/1606 af 30. maj 2023 om ændring
    af delegeret forordning (EU) 2019/33 for så vidt angår visse bestemmelser om
    beskyttede oprindelsesbetegnelser og beskyttede geografiske betegnelser for vin
