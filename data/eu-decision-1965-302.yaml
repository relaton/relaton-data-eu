  content: Décision 65/302/CEE de la Commission, du 4 juin 1965, autorisant la République
    italienne à adopter, sur base de l'article 226 du traité, une mesure de sauvegarde
    pour les poudres et paillettes de zinc
  type: main
- language: de
  script: Latn
  content: '65/302/EWG: Entscheidung der Kommission vom 4. Juni 1965, durch die die
    Italienische Republik ermächtigt wird, auf Grund von Artikel 226 des Vertrages
    Schutzmaßnahmen für Pulver und Flitter aus Zink zu erlassen'
  type: main
- language: it
  script: Latn
  content: '65/302/CEE: Decisione della Commissione, del 4 giugno 1965, che autorizza
    la Repubblica italiana ad adottare, a norma dell''articolo 226 del Trattato, una
    misura di salvaguardia per le polveri e pagliette di zinco'
  type: main
- language: nl
  script: Latn
  content: '65/302/EEG: Beschikking van de Commissie van 4 juni 1965 waarbij de Italiaanse
    Republiek wordt gemachtigd om op grond van artikel 226 van het Verdrag vrijwaringsmaatregelen
    te nemen voor zinkpoeder en zinkschilfers'
