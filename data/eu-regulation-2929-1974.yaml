title:
- language: en
  script: Latn
  content: Regulation (EEC, Euratom, ECSC) No 2929/74 of the Council of 18 November
    1974 fixing the weightings applied to the remunerations and pensions of officials
    and other servants of the European Communities employed or resident in Denmark,
    Ireland and the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE, Euratom, CECA) n° 2929/74 du Conseil, du 18 novembre
    1974, portant fixation des coefficients correcteurs dont sont affectées les rémunérations
    et pensions des fonctionnaires et autres agents des Communautés européennes,
    affectés ou résidant au Danemark, en Irlande et au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG, Euratom, EGKS) Nr. 2929/74 des Rates vom 18. November
    1974 zur Festsetzung der Berichtigungskoeffizienten, die auf die Dienst- und Versorgungsbezüge
    der in Dänemark, Irland und im Vereinigten Königreich dienstlich verwendeten
    oder wohnenden Beamten und sonstigen Bediensteten der Europäischen Gemeinschaften
    anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF, Euratom, EKSF) nr. 2929/74 af 18. november 1974
    om fastsættelse af justeringskoefficienterne for vederlag og pensioner for tjenestemænd
    og øvrige ansatte, i De europæiske Fællesskaber, der gør tjeneste i eller
    bor i Danmark, Irland og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE, Euratom, CECA) n. 2929/74 del Consiglio, del 18 novembre
    1974, che stabilisce i coefficienti correttori applicabili alle retribuzioni ed
    alle pensioni dei funzionari e degli altri agenti delle Comunità europee in servizio
    o residenti in Danimarca, in Irlanda e nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG, Euratom, EGKS) nr. 2929/74 van de Raad van 18 november
    1974 houdende vaststelling van de aanpassingscoëfficiënten welke van toepassing
    zijn op de bezoldigingen en de pensioenen van de ambtenaren en andere personeelsleden
    van de Europese Gemeenschappen, tewerkgesteld of woonachtig in Denemarken, Ierland
    of het Verenigd Koninkrijk
  type: main
