title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 551/80 of 3 March 1980 derogating from the
    definition of the concept of 'originating products' to take into account the special
    situation of Malawi and Kenya with regard to certain items of fishing tackle (fishing
    flies)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 551/80 du Conseil, du 3 mars 1980, portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière du Malawi et du Kenya, en ce qui concerne certains articles
    de pêche (mouches pour la pêche)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 551/80 des Rates vom 3. März 1980 zur Abweichung
    von der Bestimmung des Begriffs ,,Ursprungswaren' ' , um der besonderen Lage Malawis
    und Kenias in bezug auf bestimmte Angelgeräte (künstliche Fliegen zum Flugangeln)
    Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 551/80 af 3. marts 1980 om undtagelse fra
    definitionen af begrebet "varer med oprindelsesstatus" for at tage hensyn til
    den særlige situation i Malawi og Kenya for så vidt angår visse typer fiskegrej
    (fluer til fiskeri)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 551/80 del Consiglio, del 3 marzo 1980, che deroga
    alla definizione della nozione di prodotti originari per tener conto della situazione
    particolare del Malawi e del Kenia per quanto riguarda taluni articoli da pesca
    (mosche per la pesca)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 551/80 van de Raad van 3 maart 1980 houdende afwijking
    van de definitie van het begrip ,,produkten van oorsprong' ' in verband met de
    bijzondere situatie van Malawi en Kenia voor wat betreft bepaalde visserijartikelen
    (kunstvliegen voor de visserij)
  type: main
