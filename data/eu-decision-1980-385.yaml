title:
- language: en
  script: Latn
  content: '80/385/EEC: Commission Decision of 19 March 1980 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, falling
    within heading No ex 61.03 of the Common Customs Tariff (category 8), originating
    in Sri Lanka and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/385/CEE: Décision de la Commission, du 19 mars 1980, autorisant la
    République française à exclure du traitement communautaire les chemises et
    chemisettes tissées de la position ex 61.03 du tarif douanier commun (catégorie
    8), originaires de Sri Lanka et mises en libre pratique dans les autres Etats
    membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/385/EWG: Entscheidung der Kommission vom 19. März 1980, mit der die
    Französische Republik ermächtigt wird, aus Sri Lanka stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden
    aus Geweben, für Männer und Knaben, der Tarifnummer ex 61.03 des Gemeinsamen
    Zolltarifs (Kategorie 8) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/385/EØF: Kommissionens beslutning af 19. marts 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter), til mænd og drenge, som henhører under
    pos. ex 61.03 i den fælles toldtarif (kategori 8), har oprindelse i Sri Lanka
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/385/CEE: Decisione della Commissione, del 19 marzo 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le camicie e camicette,
    tessute, per uomo e per ragazzo, della voce ex 61.03 della tariffa doganale comune
    (categoria 8), originarie dello Sri Lanka e messe in libera pratica negli altri
    Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/385/EEG: Beschikking van de Commissie van 19 maart 1980 waarbij de
    Franse Republiek wordt gemachtigd overhemden en sporthemden, geweven, van post
    ex 61.03 van het gemeenschappelijk douanetarief (categorie 8), van oorsprong uit
    Sri Lanka en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
