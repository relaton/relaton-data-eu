    fuq il-fruntiera
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3648/91 van de Raad van 11 december 1991 met het
    oog op de aanneming van de verordening tot vaststelling van de wijze van gebruik
    van het formulier 302 en tot intrekking van Verordening (EEG) nr. 3690/86 betreffende
    de afschaffing van de douaneformaliteiten in het kader van de TIR-Overeenkomst
    wanneer bij het verlaten van een Lid-Staat een gemeenschappelijke grens tussen
    twee Lid-Staten wordt overschreden en van Verordening (EEG) nr. 4283/88 inzake
    afschaffing van bepaalde formaliteiten bij uitgang in het grensoverschrijdend
    intracommunautair verkeer - versoepeling aan de grensovergangen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (EWG) nr 3648/91 z dnia 11 grudnia 1991 r. ustanawiające
    metody stosowania formularza 302 oraz uchylające rozporządzenie (EWG) nr 3690/86
    dotyczące zniesienia, w ramach Konwencji TIR, formalności celnych przy wyjeździe
    z Państwa Członkowskiego na granicy między dwoma Państwami Członkowskimi
    oraz rozporządzenie (EWG) nr 4283/88 w sprawie zniesienia niektórych formalności
    wyjazdowych na wewnętrznych granicach Wspólnoty — wprowadzenie wspólnych
    urzędów kontroli granicznej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3648/91 do Conselho, de 11 de Dezembro de 1991, que
    revoga o Regulamento (CEE) nº 3690/86 relativo à supressão das formalidades
    aduaneiras, no âmbito da Convenção TIR, à saída de um Estado-membro aquando
    da passagem de uma fronteira comum a dois Estados-membros e o Regulamento (CEE)
    nº 4283/88, que fixa as modalidades de utilização do formulário 302 e relativo
    à supressão de certas formalidades de saída aquando da passagem das fronteiras
    internas da Comunidade - simplificação dos postos fronteiriços
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 3648/91 al Consiliului din 11 decembrie 1991 de
    stabilire a modalităților de utilizare a formularului 302 și de abrogare a
    Regulamentului (CEE) nr. 3690/86 privind eliminarea formalităților vamale în
    cadrul Convenției TIR la ieșirea dintr-un stat membru cu ocazia trecerii unei
    frontiere comune pentru două state membre și a Regulamentului (CEE) nr. 4283/88
    privind eliminarea anumitor formalități la ieșire cu ocazia trecerii frontierelor
    interne ale Comunității – introducerea punctelor de frontieră comune
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EHS) č. 3648/91 z 11. decembra 1991 ustanovujúce spôsoby
    použitia formuláru 302 a zrušujúce nariadenie (EHS) č. 3690/86 o zrušení
    colných formalít v rámci dohovoru TIR pri výstupe z členského štátu na
    hranici medzi dvoma členskými štátmi a nariadenie (EHS) č. 4283/88 o zrušení
    určitých výstupných formalít na vnútorných hraniciach spoločenstva —
    zavedenie spoločných hraničných priechodov
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EGS) št. 3648/91 z dne 11. decembra 1991 o določitvi načinov
    uporabe obrazca 302 in o razveljavitvi Uredbe (EGS) št. 3690/86 o odpravi carinskih
    formalnosti v okviru TIR Konvencije ob izhodu iz države članice na meji med
    dvema državama članicama in Uredbe (EGS) št. 4283/88 o odpravi nekaterih izhodnih
    formalnosti na notranjih mejah Skupnosti o uvedbi skupnih mejnih točk
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3648/91 del Consejo, de 11 de diciembre de 1991, por
    el que se fijan las modalidades de utilización del formulario 302 y que deroga
    el Reglamento (CEE) nº 3690/86 relativo a la supresión de las formalidades aduaneras
    en el marco del convenio TIR a la salida de un Estado miembro al atravesar una
    frontera común a dos Estados miembros y el Reglamento (CEE) nº 4283/88 relativo
    a la supresión de determinadas formalidades de salida en el paso de las fronteras
    interiores de la Comunidad - banalización de los puestos fronterizos
