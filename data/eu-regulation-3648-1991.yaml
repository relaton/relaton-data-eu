    formalnosti u okviru Konvencije TIR-a na izlasku iz države članice na granici
    između dvije države članice i Uredbe (EEZ) br. 4283/88 o ukidanju određenih
    izlaznih formalnosti na unutarnjim granicama Zajednice – uvođenje zajedničkih
    graničnih prijelaza
  type: main
- language: hu
  script: Latn
  content: A Tanács 3648/91/EGK rendelete (1991. december 11.) a 302. számú nyomtatvány
    használatára vonatkozó feltételek meghatározásáról, továbbá a TIR-egyezmény
    keretében a két tagállam közötti határon az egyik tagállamból történő
    kilépés vámalakiságainak eltörléséről szóló 3690/86/EGK rendelet, valamint
    a belső közösségi határokon bizonyos kilépési alakiságok eltörléséről
    – közös határállomások bevezetéséről – szóló 4283/88/EGK rendelet
    hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3648/91 del Consiglio, dell'11 dicembre 1991, che
    stabilisce le modalità di utilizzazione del formulario 302 e che abroga il regolamento
    (CEE) n. 3690/86 relativo alla soppressione delle formalità doganali, nel quadro
    della convenzione TIR, all'uscita da uno Stato membro, al varco di una frontiera
    comune a due Stati membri, nonché il regolamento (CEE) n. 4283/88 relativo alla
    soppressione di talune formalità all'uscita all'atto dell'attraversamento delle
    frontiere interne della Comunità - banalizzazione dei valichi di frontiera
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EEK) Nr. 3648/91 (1991. gada 11. decembris), kas nosaka
    302. veidlapas piemērošanas metodes un atceļ Regulu (EEK) Nr. 3690/86 par muitas
    formalitāšu atcelšanu uz dalībvalstu kopīgām robežām, izbraucot no dalībvalsts,
    sakarā ar TIR Konvenciju un Regulu (EEK) Nr. 4283/88 par dažu izbraukšanas
    formalitāšu atcelšanu uz Kopienas iekšējām robežām — kopīgu robežkontroles
    posteņu izveidi
  type: main
- language: lt
  script: Latn
  content: 1991 m. gruodžio 11 d. Tarybos reglamentas (EEB) Nr. 3648/91 nustatantis
    302 formos naudojimo būdus ir panaikinantis Reglamentą (EEB) Nr. 3690/86 dėl
    muitinės formalumų, taikomų dviejų valstybių narių pasienyje išvykstant
    iš valstybės narės, panaikinimo pagal TIR konvenciją ir Reglamentą (EEB)
    Nr. 4283/88 dėl tam tikrų išvažiavimo formalumų panaikinimo prie Bendrijos
    vidaus sienų — bendrų pasienio postų steigimas
  type: main
- language: mt
  script: Latn
