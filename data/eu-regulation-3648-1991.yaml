title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3648/91 of 11 December 1991 laying down the
    methods of using form 302 and repealing Regulation (EEC) No 3690/86 concerning
    the abolition, within the framework of the TIR Convention, of customs formalities
    on exit from a Member State at a frontier between two Member States and Regulation
    (EEC) No 4283/88 on the abolition of certain exit formalities at internal Community
    frontiers - introduction of common border posts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3648/91 du Conseil, du 11 décembre 1991, fixant les
    modalités d'utilisation du formulaire 302 et abrogeant le règlement (CEE) n°
    3690/86 concernant la suppression des formalités douanières dans le cadre de
    la convention TIR à la sortie d'un État membre lors du franchissement d'une
    frontière commune à deux États membres et le règlement (CEE) n° 4283/88 relatif
    à la suppression de certaines formalités à la sortie lors du franchissement
    des frontières intérieures de la Communauté - banalisation des postes frontières
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3648/91 des Rates vom 11. Dezember 1991 zur Festlegung
    der Verwendungsbedingungen des Formulars 302 und zur Aufhebung der Verordnung
    (EWG) Nr. 3690/86 zur Abschaffung der Zollförmlichkeiten im Rahmen des TIR-Übereinkommens
    beim Ausgang aus einem Mitgliedstaat zum Zeitpunkt des Überschreitens einer gemeinsamen
    Grenze zwischen zwei Mitgliedstaaten und der Verordnung (EWG) Nr. 4283/88 zur
    Abschaffung bestimmter Ausgangsförmlichkeiten beim Überschreiten der Binnengrenzen
    der Gemeinschaft - Zusammenlegung der Grenzabfertigungsstellen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 3648/91 на Съвета от 11 декември
    1991 година относно определяне на методите за
    използване на форма 302 и отмяна на Регламент
    (ЕИО) № 3690/86 относно премахването, в рамките
    на Конвенцията ТИР, на митническите формалности
    при излизане от държава-членка на границата
    между две държави-членки и Регламент (ЕИО) №
    4283/88 относно премахването на някои формалности
    при излизане, когато се касае за вътрешни граници
    на Общността — въвеждане на общи гранични
    постове
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EHS) č. 3648/91 ze dne 11. prosince 1991, kterým se
    stanoví způsob používání formuláře 302 a kterým se zrušují nařízení
    (EHS) č. 3690/86 o odstranění celních formalit při výjezdu z jednoho členského
    státu na hranici mezi dvěma členskými státy v rámci úmluvy TIR a nařízení
    (EHS) č. 4283/88 o odstranění některých výjezdních formalit na vnitřních
    hranicích Společenství – zavedení společných stanovišť hraniční kontroly
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3648/91 af 11. december 1991 om de nærmere
    bestemmelser for benyttelse af NATO- formular 302 og om ophævelse af forordning
    (EØF) nr. 3690/86 om afskaffelse af udgangstoldformaliteterne i en medlemsstat
