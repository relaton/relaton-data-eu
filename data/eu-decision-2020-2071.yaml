title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/2071 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Customs Sub-Committee established
    by the Association Agreement between the European Union and the European Atomic
    Energy Community and their Member States, of the one part, and the Republic of
    Moldova, of the other part, as regards the amendment of that Agreement by replacing
    Protocol II thereto concerning the definition of the concept of ‘originating
    products’ and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/2071 du Conseil du 7 décembre 2020 relative à la
    position à prendre au nom de l’Union européenne au sein du sous-comité douanier
    institué par l’accord d’association entre l’Union européenne et la Communauté
    européenne de l’énergie atomique et leurs États membres, d’une part, et
    la République de Moldavie, d’autre part, en ce qui concerne la modification
    dudit accord par le remplacement de son protocole II concernant la définition
    de la notion de «produits originaires» et les méthodes de coopération administrative
  type: main
- language: de
  script: Latn
