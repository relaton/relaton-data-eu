  content: Commission Regulation (EEC) No 2553/89 of 23 August 1989 re-establishing
    the levying of customs duties on men's or boys'jackets excluding waister jackets
    and blazers, other than knitted or crocheted, products of category No 17 (order
    No 40.0170), originating in Pakistan to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2553/89 de la Commission du 23 août 1989 portant
