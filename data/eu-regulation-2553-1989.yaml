    vestons autres que de bonneterie pour hommes et garçonnets de la catégorie de
    produits n° 17 (numéro d'ordre 40.0170), originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
