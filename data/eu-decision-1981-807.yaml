title:
- language: en
  script: Latn
  content: '81/807/EEC: Commission Decision of 22 July 1981 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton and woven
    fabrics of discontinuous synthetic textile fibres, originating in Thailand (Only
    the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/807/CEE: Décision de la Commission, du 22 juillet 1981, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton et les tissus de fibres textiles synthétiques discontinues originaires
    de Thaïlande (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/807/EWG: Entscheidung der Kommission vom 22. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus Thailand stammende Gewebe aus Baumwolle und Gewebe
    aus synthetischen Spinnfasern von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/807/EØF: Kommissionens beslutning af 22. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld og vævet stof af syntetiske regenererede fibre med oprindelse i Thailand
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/807/EOK: Απόφαση τής Επιτροπής τής 22ας Ιουλίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά βαμβακερά υφάσματα καί τά υφάσματα εκ μή
    συνεχών συνθετικών υφαντικών ινών καταγωγής
    Ταϋλάνδης (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/807/CEE: Decisione della Commissione, del 22 luglio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di cotone
    e i tessuti di fibre tessili sintetiche in fiocco, originari della Tailandia (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/807/EEG: Beschikking van de Commissie van 22 juli 1981 houdende machtiging
