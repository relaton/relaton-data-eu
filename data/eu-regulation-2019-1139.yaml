id: EURegulation20191139
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1139 of 3 July 2019 amending
    Regulation (EC) No 2074/2005 as regards official controls on food of animal origin
    in relation to requirements concerning food chain information and fishery products
    and to the reference to recognised testing methods for marine biotoxins and to
    testing methods for raw milk and heat-treated cow's milk
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1139 de la Commission du 3 juillet 2019
    modifiant le règlement (CE) n° 2074/2005 en ce qui concerne les contrôles officiels
    des denrées alimentaires d'origine animale en rapport avec les exigences concernant
    les informations sur la chaîne alimentaire et les exigences concernant les produits
    de la pêche, ainsi qu'avec la référence aux méthodes reconnues d'analyse des
    biotoxines marines et aux méthodes de test du lait cru et du lait de vache traité
    thermiquement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1139 der Kommission vom 3. Juli 2019
    zur Änderung der Verordnung (EG) Nr. 2074/2005 in Bezug auf amtliche Kontrollen
    von Lebensmitteln tierischen Ursprungs hinsichtlich der Anforderungen an die Informationen
    zur Lebensmittelkette und an Fischereierzeugnisse sowie hinsichtlich der Bezugnahme
    auf anerkannte Testmethoden zum Nachweis mariner Biotoxine und auf Testmethoden
    für Rohmilch und wärmebehandelte Kuhmilch
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1139 на Комисията
    от 3 юли 2019 година за изменение на Регламент
    (ЕО) № 2074/2005 по отношение на официалния контрол
    върху продукти от животински произход във
    връзка с изискванията относно информацията
    за хранителната верига и относно продуктите
    от риболов и във връзка с позоваването на признатите
    методи на изпитване за откриване на морски
    биотоксини и на методите на изпитване за сурово
    мляко и краве мляко, преминало топлинна обработка
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1139 ze dne 3. července 2019,
    kterým se mění nařízení (ES) č. 2074/2005, pokud jde o úřední kontroly
    potravin živočišného původu v souvislosti s požadavky na informace o potravinovém
    řetězci a na produkty rybolovu a s odkazy na uznané testovací metody pro mořské
    biotoxiny a testovací metody pro syrové mléko a tepelně ošetřené kravské
    mléko
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1139 af 3. juli 2019
    om ændring af forordning (EF) nr. 2074/2005 for så vidt angår offentlig kontrol
    af animalske fødevarer i forbindelse med krav vedrørende information om fødevarekæden
    og fiskevarer, henvisningen til anerkendte analysemetoder for marine biotoksiner
    og analysemetoder for rå mælk og varmebehandlet komælk
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/1139 της Επιτροπής,
    της 3ης Ιουλίου 2019, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2074/2005 όσον αφορά τους επίσημους
    ελέγχους στα τρόφιμα ζωικής προέλευσης σε
    σχέση με τις απαιτήσεις σχετικά με τις πληροφορίες
    για την τροφική αλυσίδα και τα προϊόντα αλιείας
    και σχετικά με την αναφορά στις αναγνωρισμένες
    μεθόδους δοκιμών για θαλάσσιες βιοτοξίνες
    και στις μεθόδους δοκιμής του νωπού γάλακτος
    και του θερμικά επεξεργασμένου αγελαδινού
    γάλακτος
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/1139, 3. juuli 2019, millega muudetakse
    määrust (EÜ) nr 2074/2005 loomse toidu ametlike kontrollide osas seoses toiduahelat
    käsitleva teabe ja kalandustoodete suhtes kohaldatavate nõuete, mereliste biotoksiinide
    määramiseks kasutatavate tunnustatud katsemeetodite ning toorpiima ja kuumtöödeldud
    lehmapiima katsemeetoditega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/1139, annettu 3 päivänä
    heinäkuuta 2019, asetuksen (EY) N:o 2074/2005 muuttamisesta eläinperäisten
    elintarvikkeiden virallisen valvonnan osalta siltä osin kuin on kyse elintarvikeketjua
    koskeviin tietoihin ja kalastustuotteisiin sovellettavista vaatimuksista sekä
    viittauksesta merellisten biotoksiinien hyväksyttyihin testausmenetelmiin ja
    raakamaidon ja lämpökäsitellyn lehmänmaidon testausmenetelmiin
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/1139 оd 3. srpnja 2019. o izmjeni
    Uredbe (EZ) br. 2074/2005 u pogledu službenih kontrola hrane životinjskog podrijetla
    u odnosu na zahtjeve koji se odnose na informacije o prehrambenom lancu i proizvode
    ribarstva te upućivanje na priznate metode testiranja za morske biotoksine i
    metode ispitivanja za sirovo mlijeko i toplinski obrađeno kravlje mlijeko
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1139 végrehajtási rendelete (2019. július 3.)
    a 2074/2005/EK rendeletnek az állati eredetű termékekre irányuló, az élelmiszerláncra
    és a halászati termékekre vonatkozó információkkal kapcsolatos követelményekkel,
    továbbá a tengeri biotoxinokra vonatkozó elismert vizsgálati módszerekkel,
    valamint a nyers tejre és a hőkezelt tehéntejre vonatkozó vizsgálati módszerekkel
    összefüggő hatósági ellenőrzések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1139 della Commissione, del 3 luglio
    2019, che modifica il regolamento (CE) n. 2074/2005 per quanto riguarda i controlli
    ufficiali sugli alimenti di origine animale relativamente ai requisiti concernenti
    le informazioni sulla catena alimentare e i prodotti della pesca e al riferimento
    ai metodi di analisi riconosciuti per le biotossine marine e ai metodi di prova
    relativi al latte crudo e al latte vaccino trattato termicamente
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1139 (2019. gada 3. jūlijs),
    ar ko attiecībā uz dzīvnieku izcelsmes pārtikas oficiālajām kontrolēm saistībā
    ar pārtikas aprites informācijas prasībām un prasībām attiecībā uz zvejniecības
    produktiem un ar atsauci uz atzītām testēšanas metodēm jūras biotoksīniem
    un uz testēšanas metodēm svaigpienam un termiski apstrādātam govs pienam
    groza Regulu (EK) Nr. 2074/2005
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 3 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1139,
    kuriuo dėl gyvūninių maisto produktų oficialios kontrolės, susijusios su
    maisto grandinės informacijos ir žuvininkystės produktų reikalavimais ir nuorodomis
    į pripažintus jūrinių biotoksinų tyrimo metodus ir žalio ir termiškai apdoroto
    karvės pieno tyrimo metodus, iš dalies keičiamas Reglamentas (EB) Nr. 2074/2005
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1139 tat-3 ta'
    Lulju 2019 li jemenda r-Regolament (KE) Nru 2074/2005 fir-rigward tal-kontrolli
    uffiċjali fuq ikel li joriġina mill-annimali b'rabta mar-rekwiżiti li jikkonċernaw
    it-tagħrif dwar il-katina tal-ikel u l-prodotti tas-sajd u mar-referenza għall-metodi
    rikonoxxuti tal-ittestjar għall-bijotossini marini u għall-metodi tal-ittestjar
    għall-ħalib mhux ipproċessat u l-ħalib tal-baqar ittrattat bis-sħana
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/1139 van de Commissie van 3 juli 2019
    tot wijziging van Verordening (EG) nr. 2074/2005 betreffende officiële controles
    van levensmiddelen van dierlijke oorsprong met betrekking tot eisen betreffende
    de informatie over de voedselketen en visserijproducten en tot de verwijzing naar
    erkende testmethoden voor mariene biotoxines en testmethoden voor rauwe melk en
    voor warmtebehandelde koemelk
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/1139 z dnia 3 lipca 2019 r.
    zmieniające rozporządzenie (WE) nr 2074/2005 w odniesieniu do urzędowych kontroli
    żywności pochodzenia zwierzęcego, jeżeli chodzi o wymogi w zakresie informacji
    dotyczących łańcucha żywnościowego i produktów rybołówstwa, a także o
    uznane metody badania na obecność morskich biotoksyn oraz metody badania surowego
    mleka i mleka krowiego poddanego obróbce termicznej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1139 da Comissão, de 3 de julho de
    2019, que altera o Regulamento (CE) n.° 2074/2005 no que se refere aos controlos
    oficiais dos géneros alimentícios de origem animal relativamente aos requisitos
    respeitantes às informações relativas à cadeia alimentar e respeitantes aos
    produtos da pesca, bem como relativamente à referência aos métodos de teste
    reconhecidos para as biotoxinas marinhas e aos métodos de teste para o leite
    cru e o leite de vaca tratado termicamente
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/1139 al Comisiei din 3 iulie
    2019 privind modificarea Regulamentului (CE) nr. 2074/2005 în ceea ce privește
    controalele oficiale vizând alimentele de origine animală în relație cu cerințele
    referitoare la informațiile privind lanțul alimentar și produsele pescărești
    și cu trimiterea la metode de testare recunoscute pentru biotoxinele marine și
    la metodele de testare pentru laptele crud și laptele de vacă tratat termic
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1139 z 3. júla 2019, ktorým
    sa mení nariadenie (ES) č. 2074/2005, pokiaľ ide o úradné kontroly potravín
    živočíšneho pôvodu súvisiace s požiadavkami týkajúcimi sa informácií
    o potravinovom reťazci a produktmi rybolovu a s odkazom na uznané testovacie
    metódy detekcie morských biotoxínov a metódy testovania surového a tepelne
    ošetreného kravského mlieka
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1139 z dne 3. julija 2019 o spremembi
    Uredbe (ES) št. 2074/2005 glede uradnega nadzora živil živalskega izvora v
    zvezi z zahtevami glede podatkov o prehranjevalni verigi in ribiških proizvodov
    ter v zvezi s sklicevanjem na priznane preskusne metode za morske biotoksine in
    na metode preskušanja surovega mleka in toplotno obdelanega kravjega mleka
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1139 de la Comisión, de 3 de julio
    de 2019, por el que se modifica el Reglamento (CE) n.° 2074/2005 en lo que respecta
    a los controles oficiales de los alimentos de origen animal relacionados con los
    requisitos de información sobre la cadena alimentaria y con los requisitos relativos
    a los productos de la pesca, así como con la referencia a métodos de ensayo
    reconocidos para las biotoxinas marinas y a métodos de ensayo para la leche cruda
    y la leche de vaca tratada térmicamente
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/1139 av den 3 juli 2019
    om ändring av förordning (EG) nr 2074/2005 vad gäller offentlig kontroll av
    livsmedel av animaliskt ursprung i fråga om kraven för information från livsmedelskedjan
    och kraven för fiskeriprodukter samt hänvisningen till erkända testmetoder
    för marina biotoxiner och testmetoder för obehandlad mjölk och värmebehandlad
    komjölk
