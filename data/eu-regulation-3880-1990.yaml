    NO QUE DIZ RESPEITO A DATA DE APRESENTACAO PARA APROVACAO DOS CONTRATOS DE DESTILACAO
    PREVENTIVA E ALTERA O REGULAMENTO ( CEE ) NO 2273/90, QUE ABRE A DESTILACAO PREVENTIVA
    REFERIDA NO ARTIGO 38 DO REGULAMENTO ( CEE ) NO 822/87 DO CONSELHO PARA A CAMPANHA
    DE 1990/1991
  type: main
