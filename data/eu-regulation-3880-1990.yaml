title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3880/90 of 19 December 1990 derogating for
    the 1990/91 wine year from Regulation (EEC) No 2721/88 in regard to the date of
    submission for approval of contracts for preventive distillation and amending
    Regulation (EEC) No 2273/90 introducing preventive distillation as provided for
    in article 38 of Council Regulation (EEC) No 822/87 for the 1990/91 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3880/90 de la Commission, du 19 décembre 1990, portant
    dérogation pour la campagne 1990/1991 au règlement (CEE) n° 2721/88 en ce qui
    concerne la date de présentation pour agrément des contrats de distillation
    préventive et modifiant le règlement (CEE) n° 2273/90 ouvrant la distillation
    préventive visée à l'article 38 du règlement (CEE) n° 822/87 du Conseil pour
    la campagne 1990/1991
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3880/90 DER KOMMISSION VOM 19. DEZEMBER 1990 ZUR
    ABWEICHUNG VON DER VERORDNUNG ( EWG ) NR. 2721/88 HINSICHTLICH DER ANNAHMEFRIST
    FUER DIE GENEHMIGUNG DER VERTRAEGE UEBER DIE VORBEUGENDE DESTILLATION IM WIRTSCHAFTSJAHR
    1990/91 UND ZUR AENDERUNG DER VERORDNUNG ( EWG ) NR. 2273/90 ZUR EROEFFNUNG DER
    VORBEUGENDEN DESTILLATION GEMAESS ARTIKEL 38 DER VERORDNUNG ( EWG ) NR. 822/87
    DES RATES FUER DAS WIRTSCHAFTSJAHR 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3880/90 af 19. december 1990 om undtagelse
    for produktionsåret 1990/91 fra forordning (EØF) nr. 2721/88 for så vidt angår
    sidste frist for indgivelse af kontrakter om forebyggende destillation til godkendelse
    og om ændring af forordning (EØF) nr. 2273/90 om åbning af forebyggende destillation
    som omhandlet i artikel 38 i Rådets forordning (EØF) nr. 822/87 for produktionsåret
    1990/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3880/90 της Επιτροπής
    της 19ης Δεκεμβρίου 1990 για παρέκκλιση, για την
    περίοδο 1990/91, από τον κανονισμό (ΕΟΚ) αριθ. 2721/88
    όσον αφορά την ημερομηνία υποβολής για έγκριση
    των συμβάσεων της προληπτικής απόσταξης και
    για τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 2273/90
    για την έναρξη της προληπτικής απόσταξης που
    προβλέπεται στο άρθρο 38 του κανονισμού (ΕΟΚ)
    αριθ. 822/87 για την περίοδο εμπορίας 1990/91
  type: main
- language: it
  script: Latn
