    77/388/EEK 14. panta 1. punkta d) apakšpunkta darbības jomu attiecībā uz atbrīvošanu
    no pievienotās vērtības nodokļa par noteiktu preču galīgo ievešanu
  type: main
- language: lt
  script: Latn
  content: 1989 m. kovo 7 d. Komisijos direktyva iš dalies keičianti Tarybos direktyvą
