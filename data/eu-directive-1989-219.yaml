    lõplikul importimisel, võtmaks arvesse kaupade koondnomenklatuuri kehtestamist
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 89/219/ETY, annettu 7 päivänä maaliskuuta 1989,
