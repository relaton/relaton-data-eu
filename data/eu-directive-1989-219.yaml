- language: en
  script: Latn
  content: Commission Directive 89/219/EEC of 7 March 1989 amending Council Directive
    83/181/EEC determining the scope of Article 14 (1) (d) of Directive 77/388/EEC
    as regards exemption from value added tax on the final importation of certain
    goods, to take account of the introduction of the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Directive 89/219/CEE de la Commission du 7 mars 1989 modifiant la directive
    83/181/CEE du Conseil déterminant le champ d'application de l'article 14 paragraphe
    1 point d) de la directive 77/388/CEE en ce qui concerne l'exonération de la
    taxe sur la valeur ajoutée de certaines importations définitives de biens, pour
    tenir compte de l'introduction de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/219/EWG der Kommission vom 7. März 1989 zur Änderung der
    Richtlinie 83/181/EWG des Rates zur Festlegung des Anwendungsbereichs von Artikel
    14 Absatz 1 Buchstabe d) der Richtlinie 77/388/EWG hinsichtlich der Mehrwertsteuerbefreiung
    bestimmter endgültiger Einfuhren von Gegenständen zur Berücksichtigung der
    eingeführten Kombinierten Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Директива на Комисията от 7 март 1989 година
    за изменение на Директива 83/181/ЕИО на Съвета
    за определяне на обхвата на член 14, параграф
    1, буква г) от Директива 77/388/ЕИО за освобождаване
    от данък добавена стойност при окончателен
    внос на някои стоки, с цел да се вземе предвид
    въвеждането на Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
