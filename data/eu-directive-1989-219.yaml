  content: Directiva Comisiei din 7 martie 1989 de modificare a Directivei 83/181/CEE
    a Consiliului de stabilire a sferei de aplicare a articolului 14 alineatul (1)
    litera (d) din Directiva 77/388/CEE în ceea ce privește scutirea de la taxa
    pe valoarea adăugată a importului de anumite bunuri, pentru a se ține seama
    de introducerea Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
