    atleidžiant tam tikrų prekių galutinį importą nuo pridėtinės vertės mokesčio,
    atsižvelgiant į Kombinuotosios prekių nomenklatūros taikymą
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni tas-7 ta' Marzu 1989 li temenda d-Direttiva
