    Rady 83/181/EHS určujúca rozsah článku 14 (1) d) smernice 77/388/EHS vzhľadom
    na oslobodenie od dane z pridanej hodnoty pre finálny dovoz určitého tovaru,
    s ohľadom na zavedenie kombinovanej nomenklatúry
  type: main
