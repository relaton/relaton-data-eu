  script: Latn
  content: Direttiva 89/219/CEE della Commissione del 7 marzo 1989 che modifica la
    direttiva 83/181/CEE del Consiglio, che determina il campo di applicazione dell'articolo
    14, paragrafo 1, lettera d) della direttiva 77/388/CEE per quanto concerne l'esenzione
    dall'imposta sul valore aggiunto, di talune importazioni definitive di beni, affinché
    sia tenuto conto dell'introduzione della nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva (1989. gada 7. marts), kas, ievērojot apvienotās
