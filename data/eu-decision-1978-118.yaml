title:
- language: en
  script: Latn
  content: '78/118/EEC: Commission Decision of 23 December 1977 authorizing Ireland
    and the United Kingdom to apply special health guarantees for the prevention of
    leucosis in the case of bovine animals imported for breeding or production (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/118/CEE: Décision de la Commission, du 23 décembre 1977, autorisant
    l''Irlande et le Royaume-Uni à appliquer des garanties sanitaires particulières
    relatives à la lutte contre la leucose, en cas d''introduction sur leur territoire
    de bovins d''élevage ou de rente (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '78/118/EWG: Entscheidung der Kommission vom 23. Dezember 1977, mit der
    Irland und das Vereinigte Königreich ermächtigt werden, beim Verbringen von
    Zucht- und Nutzrindern in ihr Hoheitsgebiet zur Bekämpfung der Leukose besondere
    gesundheitspolizeiliche Garantien anzuwenden (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/118/EØF: Kommissionens beslutning af 23. december 1977 om bemyndigelse
    af Irland og Det forenede Kongerige til ved indbringelse på deres område af
    avls- og brugskvæg at anvende særlige sundhedsmæssige garantier med henblik
    på bekæmpelse af leukose (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '78/118/CEE: Decisione della Commissione, del 23 dicembre 1977, che autorizza
    l''Irlanda e il Regno Unito ad applicare speciali garanzie sanitarie all''introduzione
    di bovini da allevamento e da produzione nel proprio territorio con riferimento
    alla lotta contro la leucosi (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '78/118/EEG: Beschikking van de Commissie van 23 december 1977 waarbij
    Ierland en het Verenigd Koninkrijk worden gemachtigd om bij invoer van fok- en
    gebruiksrunderen bijzondere gezondheidsgaranties in het kader van de leukosebestrijding
    toe te passen (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
