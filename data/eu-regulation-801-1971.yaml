    prasībām attiecībā uz svaigi grieztu ziedu eksportu uz trešām valstīm
  type: main
- language: lt
  script: Latn
  content: 1971 m. balandžio 19 d. Komisijos reglamentas (EEB) Nr. 801/71, leidžiantis
