    engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 801/71 della Commissione, del 19 aprile 1971, che
    autorizza gli Stati membri ad adottare misure di deroga a taluni criteri delle
    norme di qualità applicabili all'esportazione di fiori recisi freschi verso i
    paesi terzi
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 801/71 (1971. gada 19. aprīlis), ar ko atļauj
