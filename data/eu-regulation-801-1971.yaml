    de determinados criterios de las normas de calidad aplicables a las exportaciones
    a terceros países de las flores cortadas frescas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 801/71 av den 19 april 1971 om bemyndigande
