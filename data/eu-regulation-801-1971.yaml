title:
- language: en
  script: Latn
  content: Regulation (EEC) No 801/71 of the Commission of 19 April 1971 authorising
    Member States to take measures derogating, in respect of exports of fresh cut
    flowers to third countries, from certain requirements of the quality standards
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 801/71 de la Commission, du 19 avril 1971, autorisant
    les États membres à prendre des mesures dérogatoires à certains critères
    des normes de qualité applicables aux exportations vers les pays tiers des fleurs
    coupées fraîches
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 801/71 der Kommission vom 19. April 1971, mit der
    die Mitgliedstaaten ermächtigt werden, bei der Ausfuhr von frischen Schnittblumen
    in Drittländer abweichende Maßnahmen in bezug auf bestimmte Kriterien für die
    Qualitätsnormen zu treffen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 801/71 на Комисията от 19
    април 1971 година относно разрешаване на държавите-членки
    да предприемат мерки за дерогация от някои
    изисквания на стандартите за качество, приложими
    към износа за трети страни на свежи рязани
    цветя
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 801/71 ze dne 19. dubna 1971, kterým se členské
    státy opravňují k přijetí opatření odchylných od určitých požadavků
    norem jakosti, pokud jde o vývoz čerstvých řezaných květin do třetích
    zemích
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 801/71 af 19. april 1971 ved hvilken
    medlemsstaterne bemyndiges til for udførsel af friske afskårne blomster til
    tredjelande at træffe foranstaltninger, der afviger fra visse af kvalitetsnormernes
    kriterier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 801/71 της Επιτροπής
    της 19ης Απριλίου 1971 περί εξουσιοδοτήσεως των
    κρατών μελών να λαμβάνουν μέτρα παρεκκλίσεως
    για ορισμένα κριτήρια κανόνων ποιότητας που
    εφαρμόζονται κατά τις εξαγωγές προς τρίτες
    χώρες νωπών κομμένων ανθέων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 801/71, 19. aprill 1971, millega lubatakse
    liikmesriikidel võtta meetmeid, mis kehtestavad erandeid teatavatest kvaliteedistandardite
    nõuetest värskete lõikelillede väljaveol kolmandatesse riikidesse
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 801/71, annettu 19 päivänä huhtikuuta 1971,
    tietyistä kolmansiin maihin vietäviin tuoreisiin leikkokukkiin sovellettavista
    laatuvaatimusperusteista poikkeavien toimenpiteiden sallimisesta jäsenvaltioille
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 801/71 od 19. travnja 1971. o ovlašćivanju
    država članica za poduzimanje mjera kojima se odstupa od određenih zahtjeva
    standarda kakvoće koji se primjenjuju na izvoz svježeg rezanog cvijeća u treće
    zemlje
  type: main
- language: hu
  script: Latn
  content: A Bizottság 801/71/EGK rendelete (1971. április 19.) a tagállamok számára
    a friss vágott virágok harmadik országokba irányuló kivitele tekintetében
