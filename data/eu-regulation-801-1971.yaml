    reikalavimų, eksportuojant ką tik nuskintas gėles į trečiąsias šalis
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament (KEE) Nru 801/71 tal-Kummissjoni tad-19 ta’ April, 1971
    li jawtorizza Stati Membri li jieħdu miżuri li jidderogaw, fir-rigward ta’
    esportazzjoni ta’ fjuri maqtugħin friski lejn pajjiżi terzi, minn ċerti rekwiżiti
    ta’ normi ta’ kwalità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 801/71 van de Commissie van 19 april 1971 houdende
    machtiging van de Lid-Staten tot het treffen van maatregelen die afwijken van
    bepaalde criteria voor de kwaliteitsnormen bij uitvoer van verse snijbloemen naar
    derde landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie (EWG) nr 801/71 Komisji z dnia 19 kwietnia 1971 r. upoważniające
    Państwa Członkowskie do podjęcia środków uchylających niektóre wymagania
    dotyczące norm jakości w odniesieniu do wywozu do państw trzecich świeżych
    kwiatów ciętych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 801/71 da Comissão, de 19 de Abril de 1971, que
    autoriza os Estados-membros a tomar medidas derrogatórias de certos critérios
    das normas de qualidade aplicáveis às exportações para países terceiros de
    flores cortadas frescas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 801/71 al Comisiei din 19 aprilie 1971 de autorizare
    a statelor membre să adopte măsuri derogatorii de la unele criterii ale standardelor
    de calitate aplicabile exporturilor de flori tăiate proaspete către țări terțe
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 801/71 z 19. apríla 1971, ktorým sa členské
    štáty oprávňujú prijímať ustanovenia odlišné od určitých požiadaviek
    noriem kvality pokiaľ ide o vývoz čerstvých rezaných kvetov do tretích krajín
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 801/71 z dne 19. aprila 1971 o dovoljenju državam
    članicam za sprejetje ukrepov za izvoz svežega rezanega cvetja v tretje države,
    ki odstopajo od nekaterih zahtev standardov kakovosti
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 801/71 de la Comisión, de 19 de abril de 1971, por
