title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2943/73 of the Commission of 30 October 1973 re-establishing
    Common Customs Tariff duties on wood-screw falling within subheading No ex 73.32
    B II originating in developing countries to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2943/73 de la Commission, du 30 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vis à bois, de la sous-position tarifaire EX 73.32 B II, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2943/73 der Kommission vom 30. Oktober 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Holzschrauben der Tarifstelle ex
    73.32 B II mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2943/73 af 30. oktober 1973 om genindførelse
    af told ifølge den fælles toldtarif for træ-skrue, underposition ex 73.32 B
    II, som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2943/73 della Commissione, del 30 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    viti per legno della sottovoce doganale n. ex 73.32 B II originari dei paesi in
    via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2943/73 van de Commissie van 30 oktober 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor houtschroeven van onderverdeling ex 73.32 B II van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 tariefpreferenties werden geopend
  type: main
