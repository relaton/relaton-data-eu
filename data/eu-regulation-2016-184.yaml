title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/184 of 11 February 2016 extending
    the definitive countervailing duty imposed by Council Implementing Regulation
    (EU) No 1239/2013 on imports of crystalline silicon photovoltaic modules and key
    components (i.e. cells) originating in or consigned from the People's Republic
    of China to imports of crystalline silicon photovoltaic modules and key components
    (i.e. cells) consigned from Malaysia and Taiwan, whether declared as originating
    in Malaysia and in Taiwan or not
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/184 de la Commission du 11 février 2016
    portant extension du droit compensateur définitif institué par le règlement
    d'exécution (UE) n° 1239/2013 du Conseil sur les importations de modules photovoltaïques
    en silicium cristallin et leurs composants essentiels (cellules) originaires ou
    en provenance de la République populaire de Chine aux importations de modules
    photovoltaïques en silicium cristallin et leurs composants essentiels (cellules)
    expédiés de Malaisie et de Taïwan, qu'ils aient ou non été déclarés originaires
    de ces pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/184 der Kommission vom 11. Februar 2016
    zur Ausweitung des mit der Durchführungsverordnung (EU) Nr. 1239/2013 des Rates
    eingeführten endgültigen Ausgleichszolls auf Einfuhren von Fotovoltaikmodulen
    aus kristallinem Silicium und Schlüsselkomponenten davon (Zellen) mit Ursprung
    in oder versandt aus der Volksrepublik China auf aus Malaysia und Taiwan versandte
    Einfuhren von Fotovoltaikmodulen aus kristallinem Silicium und Schlüsselkomponenten
    davon (Zellen), ob als Ursprungserzeugnisse Malaysias oder Taiwans angemeldet
    oder nicht
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/184 на Комисията
    от 11 февруари 2016 година за разширяване на обхвата
    на окончателното изравнително мито, наложено
    с Регламент за изпълнение (ЕС) № 1239/2013 на Съвета
    върху вноса на кристални силициеви фотоволтаични
    модули и ключови компоненти (т.е. елементи)
    с произход или изпратени от Китайската народна
    република, за да включва вноса на кристални
    силициеви фотоволтаични модули и ключови компоненти
    (т.е. елементи), изпращан от Малайзия и Тайван,
    независимо дали е с деклариран произход от
    Малайзия и Тайван
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/184 ze dne 11. února 2016, kterým
    se konečné vyrovnávací clo uložené prováděcím nařízením Rady (EU)
    č. 1239/2013 na dovoz krystalických křemíkových fotovoltaických modulů
    a jejich klíčových komponentů (tj. článků) pocházejících nebo odesílaných
    z Čínské lidové republiky rozšiřuje na dovoz krystalických křemíkových
    fotovoltaických modulů a jejich klíčových komponentů (tj. článků) odesílaných
    z Malajsie a Tchaj-wanu, bez ohledu na to, zda je u nich deklarován původ z
    Malajsie a Tchaj-wanu, či nikoli
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/184 af 11. februar 2016
