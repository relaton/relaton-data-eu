title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1976 on the granting by the Guidance
    Section of the EAGGF to the Federal Republic of Germany of a payment on account
    in respect of expenditure incurred during 1975 on aids and premiums relating to
    the modernization of farms including those in the less-favoured farming areas
  type: main
- language: fr
  script: Latn
  content: '77/51/CEE: Décision de la Commission, du 22 décembre 1976, relative
    au versement par le FEOGA, section orientation, à la République fédérale d''Allemagne
    d''un acompte sur les dépenses effectuées pendant l''année 1975 pour les aides
    et primes relatives à la modernisation des exploitations agricoles, y compris
    dans les zones agricoles défavorisées'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1976 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1975 zur Modernisierung
    landwirtschaftlicher Betriebe für Beihilfen und Prämien - einschließlich der
    Hilfen für benachteiligte landwirtschaftliche Gebiete - getätigten Ausgaben
    an die Bundesrepublik Deutschland
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1976 om udbetaling gennem EUGFL,
    udviklingssektionen, til Forbundsrepublikken Tyskland af et acontobeløb for de
    udgifter, som er afholdt i løbet af året 1975 til støtte og præmier vedrørende
    modernisering af landbrugsbedrifter, herunder sådanne beliggende i ugunstigt
    stillede områder
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1976, relativa al rimborso
    da parte del FEAOG, sezione orientamento, alla Repubblica federale di Germania
    di un anticipo sulle spese effettuate durante il 1975 per gli aiuti ed i premi
    relativi all'ammodernamento delle aziende agricole, comprese quelle delle zone
    agricole svantaggiate
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1976 betreffende de betaling
    door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland van een
    voorschot op de in 1975 verrichte uitgaven voor steun en premies met betrekking
    tot de modernisering van landbouwbedrijven, waaronder mede begrepen die in probleemgebieden
    in de landbouw
