title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 janvier 1971, autorisant la République
    italienne à exclure du traitement communautaire les motocycles (d'un poids ne
    dépassant pas 170 kg), de la position Ex 87.09 du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/76/EWG: Entscheidung der Kommission vom 21. Januar 1971, mit der die
    Italienische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Krafträder (mit einem Gewicht
    von nicht mehr als 170 kg) der Tarifnummer ex 87.09 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/76/CEE: Decisione della Commissione, del 21 gennaio 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i motocicli (di
    peso non superiore a 170 kg) della voce ex 87.09 della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/76/EEG: Beschikking van de Commissie van 21 januari 1971 waarbij de
    Italiaanse Republiek wordt gemachtigd motorrijwielen (waarvan het gewicht 170
    kg niet overschrijdt), van post ex 87.09 van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en in 26 de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
