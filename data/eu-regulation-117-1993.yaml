title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 117/93 of 22 January 1993 determining the
    extent to which applications lodged in January 1993 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 117/93 de la Commission, du 22 janvier 1993, déterminant
