    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1993 για ορισμένα
    κρέατα πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 117/93 della Commissione, del 22 gennaio 1993, che
