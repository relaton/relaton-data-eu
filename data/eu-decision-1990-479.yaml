  content: '90/479/EEC: Commission Decision of 24 September 1990 accepting undertakings
    given by certain exporters in connection with the anti-dumping proceeding concerning
    imports of tungstic oxide and tungstic oxide originating in the People''s Republic
    of China and terminating the investigation with regard to the exporters in question'
  type: main
- language: fr
  script: Latn
  content: '90/479/CEE: Décision de la Commission, du 24 septembre 1990, portant
    acceptation d''engagements offerts par certains exportateurs dans le cadre de
    la procédure antidumping concernant les importations d''oxyde tungstique et d''acide
    tungstique originaires de la République populaire de Chine et portant clôture
    de l''enquête en ce qui concerne les exportateurs en cause'
  type: main
- language: de
  script: Latn
