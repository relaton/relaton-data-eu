id: EUDecision1977134
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1976 authorizing the Italian Republic
    not to apply Community treatment to certain tube and pipe fittings - joints of
    malleable cast iron, falling within subheading ex 73.20 of the Common Customs
    Tariff, originating in Poland and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/134/CEE: Décision de la Commission, du 22 décembre 1976, autorisant
    la République italienne à exclure du traitement communautaire certains accessoires
    de tuyauterie, raccords en fonte malléable, de la position Ex 73.20 du Tarif
    douanier commun, originaires de Pologne et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1976, mit der die Italienische
    Republik ermächtigt wird, bestimmte aus Polen stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Rohrverbindungsstücke - nämlich Nippel aus Temperguß
    - der Tarifnummer ex 73.20 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage visse rørfittings - blødstøbte
    muffer - som henhører under pos. ex 73.20 i den fælles toldtarif, har oprindelse
    i Polen og frit kan omsættes i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario taluni accessori per tubi -
    raccordi in ghisa malleabile - della voce ex 73.20 della tariffa doganale comune,
    originari della Polonia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 22 december 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd bepaalde hulpstukken (fittings) voor buisleidingen:
    verbindingsstukken of aansluitstukken van smeedbaar gietijzer, van post ex 73.20
    van het gemeenschappelijk douanetarief, van oorsprong uit Polen en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
