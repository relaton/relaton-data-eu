title:
- language: en
  script: Latn
  content: '91/528/EEC: Commission Decision of 1 October 1991 making an initial allocation
    to Belgium of part of the resources to be charged to the 1992 budget year for
    the supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '91/528/CEE: Décision de la Commission du 1er octobre 1991 allouant à
    la Belgique une première tranche des ressources imputables à l''exercice 1992
    pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 1. Oktober 1991 über die anfängliche
    Bewilligung eines Teils der im Haushaltsjahr 1992 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an bedürftige Personen in der Gemeinschaft zu verbuchenden Mittel
    für Belgien (91/528/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 1. oktober 1991 om en første tildeling til
    Belgien af en del af de midler, der skal opføres på 1992-budgettet for levering
    af levnedsmidler fra interventionslagre til nærmere bestemte organisationer med
    henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet
    (91/528/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/528/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Οκτωβρίου
    1991 για τη χορήγηση στο Βέλγιο μιας πρώτης μερίδας
    πόρων που καταλογίζονται στο οικονομικό έτος
    1992 για την προμήθεια τροφίμων που προέρχονται
    από τα αποθέματα της παρέμβασης στους οργανισμούς
    που έχουν οριστεί για να τα διανείμουν στους
    απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 1o ottobre 1991 concernente un primo stanziamento
    al Belgio di parte delle risorse da imputare all'' anno di bilancio 1992 per la
    fornitura a talune organizzazioni di derrate alimentari provenienti dalle scorte
    d'' intervento e destinate ad essere distribuite agli indigenti nella Comunità
    (91/528/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 1 oktober 1991 houdende een eerste toewijzing
    aan België van een deel van voor het begrotingsjaar 1992 te boeken financiële
    middelen voor de levering van voedsel uit interventievoorraden aan organisaties
    die zijn aangewezen voor de verstrekking ervan aan behoeftigen in de Gemeenschap
    (91/528/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 1 de Outubro de 1991 relativa à afectação
    inicial à Bélgica de parte dos recursos a imputar ao exercício orçamental
    de 1992 para o fornecimento de alimentos provenientes de existências de intervenção
    às organizações designadas para distribuição às pessoas mais necessitadas
    na Comunidade (91/528/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 1 de octubre de 1991 por la que se adjudica
    inicialmente a Bélgica parte de los recursos con cargo al presupuesto del ejercicio
    1992 destinados al suministro de alimentos procedentes de las existencias de intervención
    a determinadas organizaciones para su distribución entre las personas más necesitadas
    de la Comunidad (91/528/CEE) #'
