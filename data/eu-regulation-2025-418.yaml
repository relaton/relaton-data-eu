    des Rates durch technische Regulierungsstandards zur Präzisierung der für die
    Unternehmensführung festzulegenden Mindestvorgaben hinsichtlich der Vergütungspolitik
    von Emittenten signifikanter vermögenswertereferenzierter Token oder signifikanter
    E-Geld-Token
  type: main
