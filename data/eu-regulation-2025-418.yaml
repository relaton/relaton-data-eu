  script: Latn
  content: Commission Delegated Regulation (EU) 2025/418 of 16 December 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the minimum content of the governance
    arrangements on the remuneration policy of issuers of significant asset-referenced
    or e-money tokens
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/418 de la Commission du 16 décembre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant le contenu minimal du
    dispositif de gouvernance relatif à la politique de rémunération des émetteurs
    de jetons se référant à un ou des actifs d’importance significative ou de
    jetons de monnaie électronique d’importance significative
  type: main
- language: de
  script: Latn
