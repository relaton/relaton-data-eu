title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1952 of 29 October 2015 extending
    the definitive anti-dumping duty imposed by Council Implementing Regulation (EU)
    No 511/2010 on imports of molybdenum wire, containing by weight at least 99,95
    % of molybdenum, of which the maximum cross-sectional dimension exceeds 1,35 mm
    but does not exceed 4,0 mm, originating in the People's Republic of China to imports
    of molybdenum wire, containing by weight at least 97 % of molybdenum, of which
    the maximum cross-sectional dimension exceeds 4,0 mm but does not exceed 11,0
    mm, originating in the People's Republic of China
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1952 de la Commission du 29 octobre 2015
    portant extension du droit antidumping définitif institué par le règlement
    d'exécution (UE) n° 511/2010 du Conseil sur les importations de fils en molybdène
    contenant, en poids, au moins 99,95 % de molybdène, dont la plus grande dimension
    de la section transversale est supérieure à 1,35 mm, mais n'excède pas 4,0
    mm, originaires de la République populaire de Chine, aux importations de fils
    en molybdène contenant, en poids, au moins 97 % de molybdène, dont la plus grande
    dimension de la section transversale est supérieure à 4,0 mm, mais n'excède
    pas 11,0 mm, originaires de la République populaire de Chine
  type: main
