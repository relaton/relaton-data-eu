title:
- language: en
  script: Latn
  content: '98/274/EC: Council Decision of 21 April 1998 authorising the Kingdom of
    Denmark to apply or to continue to apply reductions in, or exemptions from, excise
    duties on certain mineral oils used for specific purposes, in accordance with
    the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '98/274/CE: Décision du Conseil du 21 avril 1998 autorisant le Royaume
    de Danemark à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques des réductions ou des exonérations d''accises
    conformément à la procédure prévue à l''article 8, paragraphe 4, de la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '98/274/EG: Entscheidung des Rates vom 21. April 1998 zur Ermächtigung
    des Königreichs Dänemark, gemäß dem Verfahren des Artikels 8 Absatz 4 der
    Richtlinie 92/81/EWG für Mineralöle mit bestimmten Verwendungszwecken Verbrauchsteuerbefreiungen
    oder -ermäßigungen einzuführen oder beizubehalten'
  type: main
- language: da
  script: Latn
  content: '98/274/EF: Rådets beslutning af 21. april 1998 om bemyndigelse af Kongeriget
    Danmark til at indføre eller fortsat anvende punktafgiftsfritagelser eller -lempelser
    for visse typer mineralolier, der anvendes til særlige formål, jf. fremgangsmåden
    i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '98/274/ΕΚ: Απόφαση του Συμβουλίου της 21ης
    Απριλίου 1998 εξουσιοδοτούσα το Βασίλειο της
    Δανίας να εφαρμόσει ή να συνεχίσει να εφαρμόζει
    σε ορισμένα πετρελαιοειδή συγκεκριμένων χρήσεων
    μειώσεις ή απαλλαγές από τους ειδικούς φόρους
    κατανάλωσης, με τη διαδικασία του άρθρου 8 παράγραφος
    4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '98/274/EY: Neuvoston päätös, tehty 21 päivänä huhtikuuta 1998, luvan
    antamisesta Tanskan kuningaskunnalle soveltaa tai edelleen soveltaa tiettyihin
    erityistarkoituksiin käytettyihin kivennäisöljyihin valmisteveron alennuksia
    tai vapautuksia valmisteverosta direktiivin 92/81/ETY 8 artiklan 4 kohdassa säädetyn
    menettelyn mukaisesti'
  type: main
- language: it
  script: Latn
  content: '98/274/CE: Decisione del Consiglio del 21 aprile 1998 che autorizza il
    Regno di Danimarca ad applicare o a continuare ad applicare ad alcuni oli minerali
    utilizzati a fini specifici esenzioni o riduzioni d''accisa secondo la procedura
    di cui all''articolo 8, paragrafo 4 della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '98/274/EG: Beschikking van de Raad van 21 april 1998 waarbij het Koninkrijk
    Denemarken wordt gemachtigd om in overeenstemming met de procedure van artikel
    8, lid 4, van Richtlijn 92/81/EEG verlaagde accijnstarieven of vrijstellingen
    van accijnzen toe te passen of te blijven toepassen op bepaalde minerale oliën
    die voor bijzondere doeleinden worden gebruikt'
  type: main
- language: pt
  script: Latn
  content: '98/274/CE: Decisão do Conselho de 21 de Abril de 1998 que autoriza o
    Reino da Dinamarca a aplicar ou a continuar a aplicar a certos óleos minerais
    utilizados para fins específicos reduções ou isenções de impostos especiais
    de consumo, nos termos do nº 4 do artigo 8º da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '98/274/CE: Decisión del Consejo de 21 de abril de 1998 por la que se
    autoriza al Reino de Dinamarca a aplicar o a seguir aplicando reducciones o exenciones
    del impuesto especial sobre determinados hidrocarburos utilizados para fines específicos,
    de conformidad con el procedimiento previsto en el apartado 4 del artículo 8
    de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '98/274/EG: Rådets beslut av den 21 april 1998 om tillåtelse för Konungariket
    Danmark att på vissa mineraloljor som används för särskilda ändamål tillämpa
    nedsättning av eller befrielse från punktskatt, i enlighet med förfarandet
    i artikel 8.4 i direktiv 92/81/EEG'
  type: main
