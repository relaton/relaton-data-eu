id: EURegulation1792014
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 179/2014 of 6 November 2013 supplementing
    Regulation (EU) No 228/2013 of the European Parliament and of the Council with
    regard to the register of operators, the amount of aid for the marketing of products
    outside the region, the logo, the exemption from import duties for certain bovine
    animals and the financing of certain measures relating to specific measures for
    agriculture in the outermost regions of the Union
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 179/2014 de la Commission du 6 novembre
    2013 complétant le règlement (UE) n ° 228/2013 du Parlement européen et du
    Conseil en ce qui concerne le registre des opérateurs, le montant de l’aide
    pour la commercialisation des produits hors de leur région, le symbole graphique,
    l’exonération de droits à l’importation pour certains bovins et le financement
    de certaines mesures relatives aux mesures spécifiques en faveur de l’agriculture
    dans les régions ultrapériphériques de l’Union
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 179/2014 der Kommission vom 6. November
    2013 zur Ergänzung der Verordnung (EU) Nr. 228/2013 des Europäischen Parlaments
    und des Rates hinsichtlich des Registers der Marktteilnehmer, des Beihilfebetrags
    für die Vermarktung der Erzeugnisse außerhalb der Region, des Logos, der Einfuhrzollbefreiung
    für bestimmte Rinder und der Finanzierung bestimmter Maßnahmen in Bezug auf
    spezifische Maßnahmen für die Landwirtschaft in den Regionen in äußerster
    Randlage der Europäischen Union
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 179/2014 на Комисията
    от 6 ноември 2013 година за допълване на Регламент
    (ЕС) № 228/2013 на Европейския парламент и на Съвета
    по отношение на регистъра на операторите, размера
    на помощта, предоставена за предлагането на
    продуктите на пазара извън региона, графичния
    символ, освобождаването от вносни мита за някои
    животни от рода на едрия рогат добитък и финансирането
    на определени специфични мерки за селското
    стопанство в най-отдалечените региони на Съюза
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 179/2014 ze dne 6.
    listopadu 2013 , kterým se doplňuje nařízení Evropského parlamentu a Rady
    (EU) č. 228/2013, pokud jde o rejstřík hospodářských subjektů, výši podpory
    pro uvádění produktů na trh mimo oblast produkce, grafický symbol, osvobození
    některého skotu od dovozního cla a financování některých opatření týkajících
    se zvláštní opatření v oblasti zemědělství ve prospěch nejvzdálenějších
    regionů Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 179/2014 af 6. november 2013
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 228/2013
    for så vidt angår registret over erhvervsdrivende, støttebeløbet til afsætning
    af produkter uden for regionen, det grafiske symbol, fritagelse for importold
    for visse kvægkategorier og finansiering af bestemte foranstaltninger med henblik
    på særlige foranstaltninger på landbrugsområdet i Unionens fjernområder
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) αριθ.
    179/2014 της Επιτροπής, της 6ης Νοεμβρίου 2013 , για
    τη συμπλήρωση του κανονισμού (ΕΕ) αριθ. 228/2013
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά την εγγραφή των επιχειρήσεων στο
    μητρώο, το ποσό της ενίσχυσης που χορηγείται
    για την εμπορία προϊόντων εκτός της περιοχής,
    το γραφικό σύμβολο, την απαλλαγή από εισαγωγικούς
    δασμούς για ορισμένα βοοειδή και τη χρηματοδότηση
    ορισμένων μέτρων που αφορούν ειδικά μέτρα
    για τη γεωργία στις εξόχως απόκεντρες περιοχές
    της Ένωσης
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) nr 179/2014, 6. november 2013 , millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 228/2013 seoses
    ettevõtjate registriga, toodete piirkonnast väljaspool turustamiseks antava
    toetuse suurusega, logoga, teatavate veiste imporditollimaksudest vabastamisega
    ning põllumajanduse jaoks ettenähtud erimeetmetega seotud teatavate meetmete
    rahastamisega liidu äärepoolseimates piirkondades
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) N:o 179/2014, annettu 6 päivänä marraskuuta
    2013 , Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 228/2013 täydentämisestä
    toimijarekisterin, tuotteiden kaupan pitämistä niiden tuotantoalueen ulkopuolella
    koskevan tuen määrän, graafisen tunnuksen, tiettyjen nautaeläinten tuontitullista
    vapauttamisen ja unionin syrjäisimpien alueiden maatalousalan erityistoimenpiteitä
    koskevien tiettyjen toimenpiteiden rahoituksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) br. 179/2014 оd 6. studenoga 2013. o dopuni
    Uredbe (EU) br. 228/2013 Europskog parlamenta i Vijeća u pogledu registra subjekata,
    iznosa potpore za stavljanje na tržište proizvoda izvan regije, logotipa, oslobođenja
    od uvoznih carina za određena goveda i financiranja određenih mjera koje se
    odnose na posebne mjere za poljoprivredu u najudaljenijim regijama Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság 179/2014/EU felhatalmazáson alapuló rendelete ( 2013. november
    6. ) a 228/2013/EU rendeletnek a gazdasági szereplők nyilvántartása, a termelési
    régión kívüli forgalomba hozatal céljára nyújtott támogatás összege,
    az embléma, egyes szarvasmarhafélék behozatalivám-mentessége és az Unió
    legkülső régióit érintő egyedi mezőgazdasági intézkedésekhez kapcsolódó
    egyes intézkedések finanszírozása tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 179/2014 della Commissione, del 6 novembre
    2013 , che completa il regolamento (UE) n. 228/2013 del Parlamento europeo e del
    Consiglio relativamente al registro degli operatori, all'importo dell'aiuto per
    la commercializzazione dei prodotti al di fuori della regione, al simbolo grafico,
    all'esenzione dai dazi all'importazione per taluni bovini e al finanziamento di
    talune misure relative alle misure specifiche nel settore dell’agricoltura a
    favore delle regioni ultraperiferiche dell'Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 179/2014 ( 2013. gada 6. novembris
    ) par Eiropas Parlamenta un Padomes Regulas (ES) Nr. 228/2013 papildināšanu
    attiecībā uz ekonomikas dalībnieku reģistru, atbalsta summām par produktu
    tirdzniecību ārpus reģiona, logotipu, atbrīvojumu no ievedmuitas par atsevišķu
    veidu liellopiem un uz finansējumu dažiem pasākumiem, kas saistīti ar īpašiem
    pasākumiem lauksaimniecības jomā attālākajos Savienības reģionos
  type: main
- language: lt
  script: Latn
  content: 2013 m. lapkričio 6 d. Komisijos deleguotasis reglamentas (ES) Nr. 179/2014,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 228/2013 papildomas
    nuostatomis dėl ūkinės veiklos vykdytojų registro, prekybai produktais už
    regiono ribų skiriamos pagalbos sumos, grafinio simbolio, atleidimo nuo importo
    muito tam tikrų galvijų atveju ir tam tikrų priemonių, susijusių su specialiomis
    žemės ūkio priemonėmis, finansavimo atokiausiuose Sąjungos regionuose
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Delega tal-Kummissjoni (UE) Nru 179/2014 tas- 6 ta’
    Novembru 2013 li jissupplimenta r-Regolament (UE) Nru 228/2013 tal-Parlament Ewropew
    u tal-Kunsill fir-rigward ir-reġistru tal-operaturi, l-ammont tal-għajnuna għall-kummerċjalizzazzjoni
    ta’ prodotti barra r-reġjun, il-logo, l-eżenzjoni mid-dazji tal-importazzjoni
    għal ċerti annimali bovini u l-iffinanzjar ta’ ċerti miżuri relatati ma’
    miżuri speċifiċi għall-agrikoltura fir-reġjuni ultraperiferiċi tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 179/2014 van de Commissie van 6 november
    2013 houdende aanvulling van Verordening (EU) nr. 228/2013 van het Europees Parlement
    en de Raad betreffende het register van marktdeelnemers, het steunbedrag voor
    de afzet van producten buiten het productiegebied, het logo, de vrijstelling van
    invoerrechten voor bepaalde runderen en de financiering van bepaalde maatregelen
    in samenhang met specifieke maatregelen op landbouwgebied ten behoeve van de ultraperifere
    gebieden van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 179/2014 z dnia 6 listopada
    2013 r. uzupełniające rozporządzenie (UE) nr 228/2013 Parlamentu Europejskiego
    i Rady w odniesieniu do rejestru podmiotów gospodarczych, kwoty pomocy z tytułu
    wprowadzania produktów do obrotu poza regionem, znaku graficznego, zwolnienia
    z przywozowych należności celnych w odniesieniu do niektórych sztuk bydła
    i finansowania niektórych środków odnoszących się do szczególnych środków
    w dziedzinie rolnictwa na rzecz regionów najbardziej oddalonych Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. ° 179/2014 da Comissão, de 6 de novembro
    de 2013 , que complementa o Regulamento (UE) n. ° 228/2013 do Parlamento Europeu
    e do Conselho no que respeita ao registo dos operadores, ao montante da ajuda
    a título de comercialização de produtos fora da região, ao símbolo gráfico,
    à isenção dos direitos de importação relativamente a determinados bovinos
    e ao financiamento de determinadas medidas relacionadas com as medidas específicas
    da agricultura nas regiões ultraperiféricas da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 179/2014 al Comisiei din 6 noiembrie 2013
    de completare a Regulamentului (UE) nr. 228/2013 al Parlamentului European și
    al Consiliului în ceea ce privește registrul operatorilor, valoarea ajutorului
    pentru comercializarea produselor în afara regiunii, logoul, scutirea de taxele
    de import pentru anumite bovine și finanțarea anumitor măsuri referitoare la
    măsurile specifice din domeniul agriculturii în favoarea regiunilor ultraperiferice
    ale Uniunii
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 179/2014 zo 6. novembra 2013 ,
    ktorým sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 228/2013
    vzhľadom na register hospodárskych subjektov, výšku pomoci udelenej na uvádzanie
    výrobkov na trh mimo ich oblasti výroby, grafický symbol, oslobodenie od dovozného
    cla vzťahujúce sa na určitý hovädzí dobytok a financovanie určitých opatrení
    súvisiacich so špecifickými opatreniami zameranými na poľnohospodárstvo
    najvzdialenejších regiónov Únie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 179/2014 z dne 6. novembra 2013 o
    dopolnitvi Uredbe (EU) št. 228/2013 Evropskega parlamenta in Sveta glede registra
    gospodarskih subjektov, zneska pomoči za trženje proizvodov izven regije njihove
    proizvodnje, grafičnega znaka, oprostitve od plačila uvoznih dajatev za določeno
    govedo ter financiranja določenih ukrepov, povezanih s posebnimi ukrepi za kmetijstvo
    v najbolj oddaljenih regijah Unije
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n ° 179/2014 de la Comisión, de 6 de noviembre
    de 2013 , que complementa el Reglamento (UE) n ° 228/2013 del Parlamento Europeo
    y del Consejo en lo que atañe al registro de agentes económicos, al importe
    de la ayuda para la comercialización de productos fuera de su región, al símbolo
    gráfico, a la exención de los derechos de importación de determinados bovinos
    y a la financiación de ciertas acciones relacionadas con las medidas específicas
    destinadas a la agricultura de las regiones ultraperiféricas de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 179/2014 av den 6 november
    2013 om komplettering av Europaparlamentets och rådets förordning (EU) nr 228/2013
    vad gäller aktörsregistret, stödbelopp för saluföring utanför produktionsregionen,
    den grafiska symbolen, befrielse från importtullar för vissa nötkreatur och
    finansiering av vissa särskilda åtgärder på jordbruksområdet i unionens yttersta
    randområden
  type: main
