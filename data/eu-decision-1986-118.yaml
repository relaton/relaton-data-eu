title:
- language: en
  script: Latn
  content: '86/118/EEC: Commission Decision of 10 March 1986 amending Decision 83/96/EEC
    authorizing Ireland and the United Kingdom temporarily to take additional measures
    to protect themselves against the introduction of Dendroctonus micans (Only the
    English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/118/CEE: Décision de la Commission du 10 mars 1986 modifiant la décision
    83/96/CEE autorisant l''Irlande et le Royaume-Uni à prendre à titre temporaire
    des dispositions complémentaires en vue de se préserver contre l''introduction
    du Dendroctonus micans (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/118/EWG: Entscheidung der Kommission vom 10. März 1986 zur Änderung
    der Entscheidung 83/96/EWG zur Ermächtigung Irlands und des Vereinigten Königreichs,
    zum Schutz gegen die Einschleppung von Dendroctonus micans vorübergehend ergänzende
    Maßnahmen zu treffen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/118/EØF: Kommissionens beslutning af 10. marts 1986 om ændring af
    beslutning 83/96/EØF om bemyndigelse af Irland og Det forenede Kongerige til
    midlertidigt at træffe supplerende foranstaltninger til beskyttelse mod indslæbning
    af Dendroctonus micans (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/118/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Μαρτίου 1986 για την τροποποίηση της απόφασης
    83/96/ΕΟΚ που επιτρέπει στην Ιρλανδία και το Ηνωμένο
    Βασίλειο να λάβουν, προσωρινά, συμπληρωματικά
    μέτρα για να προστατευθούν, από την εισαγωγή
    του Dendroctonus micans (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/118/CEE: Decisione della Commissione del 10 marzo 1986 recante modifica
    della decisione 83/96/CEE, che autorizza l''Irlanda e il Regno Unito ad adottare
    a titolo provvisorio disposizioni complementari per premunirsi contro l''introduzione
    di Dendroctonus micans (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '86/118/EEG: Beschikking van de Commissie van 10 maart 1986 tot wijziging
    van Beschikking 83/96/EEG tot machtiging van Ierland en van het Verenigd Koninkrijk
    om tijdelijk aanvullende maatregelen te nemen ten einde op het grondgebied van
    die landen insleep van Dendroctonus micans te voorkomen (Slechts de tekst in de
    Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/118/CEE: Decisão da Comissão de 10 de Março de 1986 que altera a
    Decisão 83/96/CEE que autoriza a Irlanda e o Reino Unido a tomarem temporariamente
    medidas adicionais de protecção contra a introdução do Dendroctonus micans
    (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
