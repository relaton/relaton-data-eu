    del mercado durante la campaña pesquera de 2003, que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2349/2002 av den 20 december 2002 om
