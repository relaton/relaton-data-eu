title:
- language: en
  script: Latn
  content: '86/607/EEC: Commission Decision of 1 December 1986 amending Decision 86/301/EEC
    authorizing Member States to permit temporarily the marketing of forest reproductive
    material not satisfying the requirements of Council Directive 66/404/EEC)'
  type: main
- language: fr
  script: Latn
  content: '86/607/CEE: Décision de la Commission du 1er décembre 1986 modifiant
    la décision 86/301/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '86/607/EWG: Entscheidung der Kommission vom 1. Dezember 1986 zur Änderung
    der Entscheidung 86/301/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '86/607/EØF: Kommissionens beslutning af 1. december 1986 om ændring
    af beslutning 86/301/EØF om bemyndigelse af medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '86/607/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Δεκεμβρίου
