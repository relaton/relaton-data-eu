    περί παροχής αδείας στα κράτη μέλη να εγκρίνουν
    προσωρινά την εμπορία δασικού πολλαπλασιαστικού
    υλικού το οποίο δεν ανταποκρίνεται στις απαιτήσεις
    της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '86/607/CEE: Decisione della Commissione del 1° dicembre 1986 recante
    modifica della decisione 86/301/CEE che autorizza gli Stati membri ad ammettere
    temporaneamente la commercializzazione di materiali di moltiplicazione di alcune
    specie forestali che non corrispondono alle esigenze della direttiva 66/404/CEE
    del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '86/607/EEG: Beschikking van de Commissie van 1 december 1986 tot wijziging
