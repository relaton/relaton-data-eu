title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1752/79 of 8 August 1979 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A and originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1752/79 de la Commission, du 8 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l' éclairage, de la sous-position tarifaire 85.20
    A, originaires de Hong-kong bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1752/79 der Kommission vom 8. August 1979 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung der Tarifstelle 85.20
    A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1752/79 af 8. august 1979 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning, henhørende under
    pos. 85.20 A i den fælles toldtarif, som har oprindelse i Hongkong og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1752/79 della Commissione, dell' 8 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili a lampade e tubi a incandescenza
    per l' illuminazione della sottovoce 85.20 A della tariffa doganale comune originari
    di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1752/79 van de Commissie van 8 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van post 85.20 A, van oorsprong uit
    Hong-Kong ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
