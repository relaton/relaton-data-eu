title:
- language: fr
  script: Latn
  content: Décision 67/26/CEE de la Commission, du 1er décembre 1966, portant octroi
    d'un contingent tarifaire à la République italienne pour le ferrochrome contenant
    en poids 0,10 % ou moins de carbone et de 30 % exclus à 90 % inclus de chrome
  type: main
- language: de
  script: Latn
  content: '67/26/EWG: Entscheidung der Kommission vom 1. Dezember 1966 über die
    Gewährung eines Zollkontingents für Ferrochrom mit einem Gehalt an Kohlenstoff
    von 0,10 Gewichtshundertteilen oder weniger und an Chrom von mehr als 30 bis 90
    Gewichtshundertteilen an die Italienische Republik'
  type: main
- language: it
  script: Latn
  content: '67/26/CEE: Decisione della Commissione, del 1 dicembre 1966, relativa
    alla concessione di un contingente tariffario alla Repubblica italiana per il
    ferro-cromo contenente, in peso, lo 0,10 % o meno di carbonio e dal 30 % escluso
    al 90% incluso di cromo'
  type: main
- language: nl
  script: Latn
  content: '67/26/EEG: Beschikking van de Commissie van 1 december 1966 houdende toekenning
    van een tariefcontingent aan de Italiaanse Republiek voor ferrochroom bevattende
    ten hoogste 0,10 gewichtspercent koolstof en meer dan 30 gewichtspercenten doch
    niet meer dan 90 gewichtspercenten chroom'
  type: main
