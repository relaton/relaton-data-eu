title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2151/91 of 22 July 1991 amending Regulation
    No 470/67/EEC as regards the criteria to be used for the taking over of paddy
    rice by intervention agencies
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2151/91 DE LA COMMISSION du 22 juillet 1991 modifiant
    le règlement no 470/67/CEE en ce qui concerne des critères à retenir lors de
    la prise en charge du riz paddy par les organismes d'' intervention #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2151/91 DER KOMMISSION vom 22. Juli 1991 zur Änderung
    der Verordnung Nr. 470/67/EWG betreffend die Kriterien, die bei der Übernahme
    von Rohreis durch die Interventionsstellen festzulegen sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2151/91 af 22. juli 1991 om ændring
    af forordning nr. 470/67/EØF, for så vidt angår de kriterier, der skal anvendes
    ved interventionsorganernes overtagelse af uafskallet ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2151/91 της Επιτροπής
    της 22ας Ιουλίου 1991 για την τροποποίηση του
    κανονισμού αριθ. 470/67/ΕΟΚ όσον αφορά τα κριτήρια
    που θα ληφθούν υπόψη κατά την ανάληψη του ρυζιού
    paddy από τους οργανισμούς παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2151/91, annettu 22 päivänä heinäkuuta 1991,
    asetuksen N:o 470/67/ETY muuttamisesta interventioelinten suorittamassa paddy-
    eli raakariisin haltuunotossa huomioon otettavien perusteiden osalta
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2151/91 DELLA COMMISSIONE del 22 luglio 1991 che
    modifica il regolamento n. 470/67/CEE in ordine ai criteri per la presa in consegna
    del risone da parte degli organismi d'' intervento #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2151/91 VAN DE COMMISSIE van 22 juli 1991 tot wijziging
    van Verordening nr. 470/67/EEG ten aanzien van de criteria die moeten worden gehanteerd
    bij de overname van padie door de interventiebureaus #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2151/91 DA COMISSÃO de 22 de Julho de 1991 que altera
