title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2074/85 of 25 July 1985 amending Regulation
    (EEC) No 496/70 laying down initial provisions on quality control of fruit and
    vegetables exported to third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2074/85 de la Commission du 25 juillet 1985 modifiant
    le règlement (CEE) no 496/70 portant premières dispositions sur le contrôle
    de qualité de fruits et légumes faisant l' objet d' exportations vers les pays
    tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2074/85 der Kommission vom 25. Juli 1985 zur Änderung
    der Verordnung (EWG) Nr. 496/70 bezüglich der ersten Bestimmungen über die Kontrolle
    der Qualität von nach Drittländern ausgeführtem Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2074/85 af 25. juli 1985 om ændring
    af forordning (EØF) nr. 496/70 om de første bestemmelser vedrørende kvalitetskontrol
    med frugt og grønsager, der eksporteres til tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2074/85 της Επιτροπής
    της 25ης Ιουλίου 1985 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 496/70 της Επιτροπής περί των πρώτων
    διατάξεων επί του ποιοτικού ελέγχου των οπωροκηπευτικών
    που αποτελούν αντικείμενο εξαγωγών προς τρίτες
    χώρες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2074/85 della Commissione del 25 luglio 1985 che modifica
    il regolamento (CEE) n. 496/70 relativo alle prime disposizioni sul controllo
    di qualità degli ortofrutticoli che sono oggetto di esportazione verso i paesi
    terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2074/85 van de Commissie van 25 juli 1985 tot wijziging
    van Verordening (EEG) nr. 496/70 houdende eerste maatregelen ten aanzien van de
    kwaliteitscontrole bij uitvoer van groenten en fruit naar derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2074/85 da Comissão, de 25 de Julho de 1985, que
    altera o Regulamento (CEE) n.° 496/70 relativo às primeiras disposições sobre
    o controlo de qualidade de frutas e produtos hortícolas que são objecto de exportações
    para países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2074/85 de la Comisión, de 25 de julio de 1985, que
    modifica el Reglamento (CEE) n° 496/70 por el que se establecen las disposiciones
    iniciales para el control de calidad de frutas y hortalizas que sean objeto de
    exportación hacia terceros países
  type: main
