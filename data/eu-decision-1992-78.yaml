title:
- language: en
  script: Latn
  content: Commission Decision of 13 December 1991 on the establishment of the Community
    support framework for Community structural assistance on the improvement of the
    conditions under which agricultural and forestry products are processed and marketed
    in Germany (without the five new Länder) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 décembre 1991, concernant l'établissement
    du cadre communautaire d'appui pour les interventions structurelles communautaires
    relatives à l'amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en Allemagne (à l'exception des cinq nouveaux
    Länder) (Le texte en langue allemande est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Dezember 1991 zur Aufstellung eines
    gemeinschaftlichen Förderkonzepts für gemeinschaftliche Strukturinterventionen
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen Land- und Forstwirtschaftlicher
    Erzeugnisse in Deutschland (ohne die fünf neuen Länder) (Nur der deutsche Text
    ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. december 1991 om fastlæggelse af fællesskabsstøtterammen
    for EF's strukturinterventioner i Tyskland, (bortset fra de fem nye delstater)
    til forbedring af vilkårene for forarbejdning og afsætning af landbrugs- og
    skovbrugsprodukter (Kun den tyske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 13ης Δεκεμβρίου
    1991 σχετικά με την κατάρτιση του κοινοτικού
    πλαισίου στήριξης παροχής κοινοτικής διαρθρωτικής
    βοήθειας στην Γερμανία (χωρίς τα πέντε νέα
    ομόσπονδα κράτη) για τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών και
    δασοκομικών προϊόντων (Το κείμενο στην γερμανική
    γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 dicembre 1991, riguardante la definizione
    del Quadro comunitario di sostegno per gli interventi strutturali della Comunità
    in ordine al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e della silvicoltura in Germania (esclusi i cinque nuovi
    Länder) (Il testo in lingua tedesca è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 december 1991 tot vaststelling van
    het communautaire bestek voor structurele bijstandsverlening van de Gemeenschap
    voor de verbetering van de verwerking en de afzet van land- en bosbouwprodukten
    in Duitsland (zonder de vijf nieuwe deelstaten) (Slechts de tekst in de Duitse
    taal is authentiek)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 13 de Dezembro de 1991, que estabelece um quadro
    comunitário de apoio para as intervenções estruturais comunitárias destinadas
    à melhoria das condições de transformação e comercialização dos produtos
    agrícolas e silvícolas na Alemanha (excluindo os cinco novos Länder) (Apenas
    faz fé o texto em língua alemã)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 13 de diciembre de 1991, por la que se establece
    el marco comunitario de apoyo para la ayuda estructural comunitaria a Alemania
    (sin los cinco nuevos Estados federados) para la mejora de las condiciones de
    transformación y comercialización de los productos agrarios (El texto en lengua
    alemana es el único auténtico)
