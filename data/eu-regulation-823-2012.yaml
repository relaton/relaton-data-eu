    , por el que se establece una excepción al Reglamento de Ejecución (UE) n °
    540/2011 en lo referente a las fechas de expiración de la aprobación de las
    sustancias activas ácido benzoico, beta-ciflutrina, carfentrazona-etilo, ciazofamida,
    ciflutrina, Coniothyrium minitans (cepa CON/M/91-08, DSM 9660), 2,4-DB, deltametrina,
    dimetenamida- p , etofumesato, etoxisulfurón, fenamidona, flazasulfurón, flufenacet,
    flurtamona, foramsulfurón, fostiazato, hidrazida maleica, imazamox, iprodiona,
    isoxaflutol, linurón, mecoprop, mecoprop- p , mesosulfurón, mesotriona, oxadiargilo,
    oxasulfurón, pendimetalina, picoxistrobina, piraclostrobina, propiconazol, propineb,
    propizamida, propoxicarbazona, siltiofam, trifloxistrobina, warfarina, yodosulfurón
    y zoxamida
