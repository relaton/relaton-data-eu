title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2307/86 of 23 July 1986 re-establishing
    the levying of customs duties on mounted piezo-electric crystals, falling within
    subheading 85.21 C, originating in Malaysia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2307/86 de la Commission du 23 juillet 1986 portant
    rétablissement de la perception des droits de douane applicables aux cristaux
    piézo-électriques montés, de la sous-position 85.21 C du tarif douanier commun,
    originaires de Malaysia, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2307/86 der Kommission vom 23. Juli 1986 zur Wiedereinführung
    der Erhebung der Zölle für gefaßte oder montierte piezoelektrische Kristalle
    der Tarifstelle 85.21 C des Gemeinsamen Zolltarifs mit Ursprung in Malaysia, dem
    die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2307/86 af 23. juli 1986 om genindførelse
    af opkrævning af told for monterede piezoelektriske krystaller, henhørende under
    pos. 85.21 C i den fælles toldtarif og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
