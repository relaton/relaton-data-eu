id: EUDecision1972283
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '72/283/ECSC: Commission Decision of 3 July 1972 pursuant to Article 88
    of the ECSC Treaty, establishing that the Kingdom of Belgium has failed to fulfil
    its obligations by not furnishing to the Commission certain information concerning
    the application to particular cases of measures of aid in the iron and steel industry
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '72/283/CECA: Décision de la Commission, du 3 juillet 1972, au titre de
    l''article 88 du traité CECA constatant que le Royaume de Belgique a manqué
    à ses obligations en s''abstenant de fournir à la Commission un certain nombre
    de renseignements spécifiques relatifs à l''application, dans des cas déterminés,
    de régimes d''aides à l''industrie sidérurgique (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '72/283/EGKS: Entscheidung der Kommission vom 3. Juli 1972 gemäß Artikel
    88 EGKSV, mit der festgestellt wird, daß das Königreich Belgien gegen seine
    Verpflichtungen verstoßen hat, indem es der Kommission eine Reihe besonderer
    Auskünfte über die Anwendung von Beihilferegelungen für die Stahlindustrie
    in bestimmten Fällen nicht erteilte (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '72/283/EKSF: Kommissionens beslutning af 3. juli 1972 i henhold til EKSF-traktatens
    artikel 88, hvorved det konstateres, at kongeriget Belgien har misligholdt sine
    forpligtelser, idet det har undladt at meddele Kommissionen visse oplysninger,
    om anvendelsen af støtteordninger i visse særlige tilfælde inden for jern-
    og stålindustrien (Kun de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '72/283/ΕΚΑΧ: Απόφαση της Επιτροπής, της 3ης
    Ιουλίου 1972, με βάση το άρθρο 88 της Συνθήκης
    ΕΚΑΧ με την οποία διαπιστώνεται ότι το Βασίλειο
    του Βελγίου δεν ανταποκρίθηκε στις υποχρεώσεις
    του παραλείποντας να παράσχει στην Επιτροπή
    ορισμένο αριθμό πληροφοριών σχετικά με την
    εφαρμογή των καθεστώτων ενίσχυσης της βιομηχανίας
    σιδήρου και χάλυβα (Τα κείμενα στη γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '72/283/CECA: Decisione della Commissione, del 3 luglio 1972, ai sensi
    dell''articolo 88 del trattato CECA, con cui si constata che il Regno del Belgio
    è venuto meno ai suoi obblighi omettendo di fornire alla Commissione alcune informazioni
    specifiche riguardanti l''applicazione, in casi determinati, di regimi di aiuti
    a favore dell''industria siderurgica (Il testi in lingua francese e olandese sono
    il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '72/283/EGKS: Beschikking van de Commissie van 3 juli 1972 krachtens artikel
    88 van het E.G.K.S.-Verdrag houdende vaststelling dat het Koninkrijk België niet
    aan zijn verplichtingen heeft voldaan door na te laten de Commissie een aantal
    specifieke gegevens te verstrekken betreffende de toepassing in bepaalde gevallen
    van steunregelingen ten behoeve van de ijzer- en staalindustrie (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '72/283/CECA: Decisión de la Comisión, de 3 de julio de 1972, con arreglo
    al artículo 88 del Tratado de la CECA por la que se comprueba que el Reino de
    Bélgica ha incumplido sus obligaciones al abstenerse de proporcionar a la Comisión
    determinado número de informaciones específicas relativas a la aplicación,
    en determinados casos, de regímenes de ayudas a la industria siderúrgica (Los
    textos en lenguas francesa y neerlandesa son los únicos auténticos)'
  type: main
