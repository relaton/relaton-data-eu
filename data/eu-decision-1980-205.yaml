title:
- language: en
  script: Latn
  content: '80/205/EEC: Commission Decision of 25 January 1980 establishing that,
    since 1 November 1977, the conditions required for the admission free of Common
    Customs Tariff duties of the scientific apparatus described as ''Farrand-Spectrofluorometer
    MK 1'' have not been fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/205/CEE: Décision de la Commission, du 25 janvier 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Farrand-Spectrofluorometer
    MK 1" ne sont plus remplies depuis le 1er novembre 1977'
  type: main
- language: de
  script: Latn
  content: '80/205/EWG: Entscheidung der Kommission vom 25. Januar 1980, mit der festgestellt
    wird, daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs für das wissenschaftliche Gerät ,,FARRAND-Spectrofluorometer MK 1''
    '' ab 1. November 1977 nicht mehr vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/205/EØF: Kommissionens beslutning af 25. januar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "FARRAND-Spectrofluorometer MK 1" ikke er opfyldt
    efter den 1. november 1977'
  type: main
- language: el
  script: Grek
  content: '80/205/ΕΟΚ: Απόφαση τής Επιτροπής τής 25ης
    Ιανουαρίου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Farrand—Spectrofluorometer MK 1» δέν πληρούνται
    πλέον από τήν 1η Νοεμβρίου 1977'
  type: main
- language: it
  script: Latn
  content: '80/205/CEE: Decisione della Commissione, del 25 gennaio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Farrand-Spectrofluorometer
    MK 1" non sono più soddisfatte dal 1° novembre 1977'
  type: main
- language: nl
  script: Latn
  content: '80/205/EEG: Beschikking van de Commissie van 25 januari 1980 vaststellende
    dat de voorwaarden voor de toelating met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief van het wetenschappelijk apparaat genaamd ,,Farrand-Spectrofluorometer
    MK 1'' '' sedert 1 november 1977 niet meer zijn vervuld'
  type: main
