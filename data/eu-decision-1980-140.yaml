id: EUDecision1980140
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/140/EEC: Commission Decision of 15 January 1980 authorizing Ireland
    not to apply Community treatment to parkas, anoraks, windcheaters and the like,
    falling within subheadings ex 61.01 B and ex 61.02 B of the Common Customs Tariff
    (category 21), originating in South Korea and in free circulation in the other
    Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/140/CEE: Décision de la Commission, du 15 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les "parkas", anoraks, blousons
    et similaires des sous-positions ex 61.01 B et ex 61.02 B du tarif douanier commun
    (catégorie 21), originaires de Corée du Sud et mis en libre pratique dans les
    autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/140/EWG: Entscheidung der Kommission vom 15. Januar 1980, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Parkas, Anoraks, Windjacken und dergleichen der
    Tarifstellen ex 61.01 B und ex 61.02 B des Gemeinsamen Zolltarifs, Kategorie 21,
    von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/140/EØF: Kommissionens beslutning af 15. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage parka-coats, anorakker, vindjakker,
    blousonjakker og lignende, af vævede stoffer, som henhører under pos. ex 61.01
    B og ex 61.02 B i den fælles toldtarif, kategori 21, har oprindelse i Sydkorea
    og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/140/CEE: Decisione della Commissione, del 15 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario eskimo, giacche a vento, giubbotti
    con o senza cappuccio e simili, delle sottovoci ex 61.01 B e ex 61.02 B della
    tariffa doganale comune, categoria 21, originari della Corea del Sud e messi in
    libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/140/EEG: Beschikking van de Commissie van 15 januari 1980 waarbij Ierland
    wordt gemachtigd parka''s, anoraks, windjakken, blousons en dergelijke van de
    posten ex 61.01 B en ex 61.02 B van het gemeenschappelijk douanetarief, categorie
    21, van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Engelse taal is authentiek)'
  type: main
