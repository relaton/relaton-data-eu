title:
- language: fr
  script: Latn
  content: Règlement n 111 de la Commission portant fixation du montant supplémentaire
    qui peut être restitué à l'occasion d'exportations à destination de pays tiers,
    en application de l'article 11 du règlement n 20 du Conseil et de l'article 8
    des règlements ns 21 et 22 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 111 der Kommission über die Festsetzung des zusätzlichen
    Betrags, der bei Ausfuhren in dritte Länder nach Artikel 11 der Verordnung Nr.
    20 des Rats und nach Artikel 8 der Verordnungen Nr. 21 und 22 des Rats erstattet
    werden kann
  type: main
- language: it
  script: Latn
  content: Regolamento n. 111 della Commissione relativo alla determinazione degli
    importi supplementari restituiti in occasione di esportazione verso paesi terzi,
    conformemente all'articolo 11 del regolamento n. 20 del Consiglio e all'articolo
    8 dei regolamenti nn. 21 e 22 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening no. 111 van de Commissie betreffende de vaststelling van het
    extrabedrag dat bij uitvoer naar derde landen overeenkomstig artikel 11 van Verordening
    no. 20 van de Raad en overeenkomstig artikel 8 van de Verordeningen nos. 21 en
    22 van de Raad mag worden gerestitueerd
