title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 761/90 of 26 March 1990 imposing a provisional
    anti-dumping duty on imports of tungsten ores and concentrates originating in
    the people's Republic of China, and terminating the proceeding concerning imports
    originating in Hong Kong
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 761/90 de la Commission du 26 mars 1990 instituant
    un droit antidumping provisoire sur les importations de minerais de tungstène
    et de leurs concentrés originaires de la République populaire de Chine, et clôturant
    la procédure concernant les importations originaires de Hong-kong
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 761/90 DER KOMMISSION vom 26. Maerz 1990 zur Einfuehrung
    eines vorlaeufigen Antidumpingzolls auf die Einfuhren von Wolframerzen und ihren
    Konzentraten mit Ursprung in der Volksrepublik China und zur Einstellung des Verfahrens
    gegenueber den Einfuhren mit Ursprung in Hongkong
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 761/90 af 26. marts 1990 om indførelse
    af en midlertidig antidumpingtold på importen af wolframmalm og koncentrater
    deraf med oprindelse i Den Kinesiske Folkerepublik og om afslutning af proceduren
    vedrørende importen af denne vare med oprindelse i Hongkong
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 761/90 της Επιτροπής
    της 26ης Μαρτίου 1990 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές μεταλλευμάτων
    βολφραμίου και των εμπλουτισμένων από αυτά,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, και
    για την περάτωση της διαδικασίας σχετικά με
    τις εισαγωγές των εν λόγω προϊόντων καταγωγής
    Χονγκ Κονγκ
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 761/90 DELLA COMMISSIONE del 26 marzo 1990 che istituisce
    un dazio antidumping provvisorio sulle importazioni di minerali e di concentrati
    di tungsteno originari della Repubblica popolare cinese e che chiude il procedimento
    relativo alle importazioni degli stessi prodotti originari di Hong Kong
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 761/90 VAN DE COMMISSIE van 26 maart 1990 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van wolfraamerts en concentraten
    daarvan, van oorsprong uit de Volksrepubliek China, en tot beëindiging van de
    procedure betreffende de invoer van oorsprong uit Hongkong
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 761/90 DA COMISSAO de 26 de Março de 1990 que institui
    um direito anti-dumping provisorio sobre as importaçoes de minério de tungsténio
    e seus concentrados originarias da Republica Popular da China e que encerra o
    processo relativo às importaçoes originarias de Hong-Kong
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 761/90 DE LA COMISION de 26 de marzo de 1990 por el
    que se establece un derecho antidumping provisional sobre las importaciones de
    minerales de volframio y sus concentrados originarios de la Republica Popular
    de China, y por el que se concluye el procedimiento relativo a determinadas importaciones
    originarias de Hong Kong
