title:
- language: en
  script: Latn
  content: '85/170/EEC: Commission Decision of 14 February 1985 repealing and replacing
    Commission Decision 82/781/EEC establishing that the apparatus described as ''Varian
    - Automated Auger Microprobe, model 981-2850'', ''PHI - Vacuum Console, model
    60'', ''PHI - Transfer Probe, model 160-661'' and ''PHI - Specimen Fracture Attachment,
    model 10-520'' may not be imported free of import duties'
  type: main
- language: fr
  script: Latn
  content: '85/170/CEE: Décision de la Commission du 14 février 1985 abrogeant et
    remplaçant la décision 82/781/CEE de la Commission, constatant que les appareils
    dénommés "Varian - Automated Auger Microprobe, model 981-2850", "PHI - Vacuum
    Console, model 60", "PHI - Transfer Probe, model 160/661" et "PHI - Specimen Fracture
    Attachment, model 10-520" ne peuvent être importés en franchise des droits à
    l''importation'
  type: main
- language: de
  script: Latn
  content: '85/170/EWG: Entscheidung der Kommission vom 14. Februar 1985 zur Aufhebung
    und Ersetzung der Entscheidung 82/781/EWG der Kommission, mit der festgestellt
    wurde, daß die Geräte ,,Varian - Automated Auger Microprobe, Modell 981-2850"
    , ,,PHI - Vacuum Console, Modell 60" , ,,PHI - Transfer Probe, Modell 160/661"
    und ,,PHI - Specimen Fracture Attachment, Modell 10-520" nicht unter Befreiung
    von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden können'
  type: main
- language: da
  script: Latn
  content: '85/170/EØF: Kommissionens beslutning af 14. februar 1985 om ophævelse
    af erstatning af Kommissionens beslutning 82/781/EØF om fastslåelse af, at indførsel
    af apparaterne "Varian - Automated Auger Microprobe, model 981-2580", "PHI - Vacuum
    Console, model 60", "PHI - Transfer Probe, model 160/661" og "PHI - Specimen Fracture
    Attachment, model 10-520" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '85/170/ΕΟΚ: Απόφαση της Επιτροπής της 14ης
    Φεβρουαρίου 1985 που καταργεί και αντικαθιστά
    την απόφαση 82/781/ΕΟΚ της Επιτροπής με την οποία
    διαπιστώνεται ότι οι συσκευές με την ονομασία
    «Varian — Automated Auger Microprobe, model 981-2850», «PHI — Vacuum Console,
    model 60», «PHI — Transfer Probe, model 160/661» και «PHI — Specimen
    Fracture Attachment, model 10-520» δεν μπορούν να εισαχθούν
    ατελώς'
  type: main
- language: it
  script: Latn
  content: '85/170/CEE: Decisione della Commissione del 14 febbraio 1985 che abroga
    e sostituisce la decisione 82/781/CEE della Commissione che constata che gli apparecchi
    denominati "Varian - Automated Auger Microprobe, model 981-2850", "PHI - Vacuum
    Console, model 60", "PHI - Transfer Probe, model 160/661", "PHI - Specimen Fracture
    Attachment, model 10-520" non possono essere importati in franchigia dei dazi
    all''importazione'
  type: main
- language: nl
  script: Latn
  content: '85/170/EEG: Beschikking van de Commissie van 14 februari 1985 houdende
    intrekking en vervanging van Beschikking 82/781/EEG van de Commissie, waarbij
    wordt geconstateerd dat de apparaten genaamd ,,Varian - Automated Auger Microprobe,
    model 981-2850" ,,PHI - Vacuum console, model 60" , ,,PHI - Transfer Probe, model
    160/661" en ,,PHI - Specimen Fracture Attachment, model 10-520" niet met vrijstelling
    van de rechten bij invoer mogen worden ingevoerd'
  type: main
