  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/272 od 30. siječnja 2023. o stajalištu koje
    treba zauzeti u ime Europske unije u okviru Zajedničkog odbora EGP-a u vezi s
    izmjenom Priloga XI. (Elektronička komunikacija, audiovizualne usluge i informacijsko
    društvo) Sporazumu o EGP-u i Protokola 37. (koji sadržava popis predviđen člankom
    101.) uz Sporazum o EGP-u (Akt o kibersigurnosti)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/272 határozata (2023. január 30.) az Európai Unió
    által az EGT Vegyes Bizottságban az EGT-megállapodás XI. mellékletének (Elektronikus
    hírközlés, audiovizuális szolgáltatások és információs társadalom) és
    (a 101. cikkben hivatkozott listát tartalmazó) 37. jegyzőkönyvének módosítására
    vonatkozóan képviselendő álláspontról (Kiberbiztonsági jogi aktus)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/272 del Consiglio del 30 gennaio 2023 relativa alla
    posizione da adottare a nome dell’Unione europea in sede di Comitato misto SEE
    riguardo a una modifica dell’allegato XI (Comunicazione elettronica, servizi
    audiovisivi e società dell’informazione) e del protocollo 37 (contenente l’elenco
    di cui all’articolo 101) dell’accordo SEE (regolamento sulla cibersicurezza)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/272 (2023. gada 30. janvāris) par nostāju,
    kas Eiropas Savienības vārdā jāieņem EEZ Apvienotajā komitejā attiecībā
    uz grozījumu EEZ līguma XI pielikumā (Elektroniskie sakari, audiovizuālie
    pakalpojumi un informācijas sabiedrība) un 37. protokolā (kurā ir 101. pantā
    paredzētais saraksts) (Kiberdrošības akts)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/272 2023 m. sausio 30 d. dėl pozicijos, kurios
    Europos Sąjungos vardu turi būti laikomasi EEE jungtiniame komitete, dėl EEE
    susitarimo XI priedo (Elektroniniai ryšiai, audiovizualinės paslaugos ir informacinė
    visuomenė) ir 37 protokolo (kuriame pateikiamas 101 straipsnyje nurodytas sąrašas)
    dalinio pakeitimo (Kibernetinio saugumo aktas)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/272 tat-30 ta’ Jannar 2023 dwar il-pożizzjoni
    li għandha tiġi adottata, f’isem l-Unjoni Ewropea, fil-Kumitat Konġunt taż-ŻEE,
    rigward l-emendar tal-Anness XI (Komunikazzjoni elettronika, servizzi awdjoviżivi
    u soċjetà tal-informatika) u tal-Protokoll 37 (li fih il-lista prevista fl-Artikolu
    101) tal-Ftehim ŻEE (L-Att dwar iċ-Ċibersigurtà)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/272 van de Raad van 30 januari 2023 betreffende het namens
    de Europese Unie in het Gemengd Comité van de EER in te nemen standpunt met betrekking
    tot een wijziging van bijlage XI (Elektronische communicatie, audiovisuele diensten
    en informatiemaatschappij) en Protocol 37 (dat de in artikel 101 bedoelde lijst
    bevat) bij de EER-overeenkomst (Cyberbeveiligingsverordening)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/272 z dnia 30 stycznia 2023 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Wspólnego Komitetu
    EOG odnośnie do zmiany załącznika XI (Komunikacja elektroniczna, usługi audiowizualne
    i społeczeństwo informacyjne) oraz Protokołu 37 (zawierającego wykaz przewidziany
    w art. 101) do Porozumienia EOG (Akt o cyberbezpieczeństwie)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/272 do Conselho de 30 de janeiro de 2023 relativa à
    posição a tomar, em nome da União Europeia, no âmbito do Comité Misto do
    EEE, sobre uma alteração do anexo XI (Comunicações eletrónicas, serviços
    audiovisuais e sociedade da informação) e do Protocolo n.o 37 (que contém a
    lista referida no artigo 101.o) do Acordo EEE (Regulamento Cibersegurança)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/272 a Consiliului din 30 ianuarie 2023 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    mixt al SEE cu privire la o modificare a anexei XI (Comunicații electronice,
    servicii audiovizuale și societatea informațională) și a Protocolului 37 (care
    cuprinde lista prevăzută la articolul 101) la Acordul privind SEE (Regulamentul
    privind securitatea cibernetică)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/272 z 30. januára 2023 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Spoločnom výbore EHP, pokiaľ ide o
    zmenu prílohy XI (Elektronická komunikácia, audiovizuálne služby a informačná
    spoločnosť) a Protokolu 37 (obsahujúceho zoznam podľa článku 101) k Dohode
    o EHP (akt o kybernetickej bezpečnosti)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/272 z dne 30. januarja 2023 o stališču, ki se v
    imenu Evropske unije zastopa v Skupnem odboru EGP v zvezi s spremembo Priloge
    XI (Elektronske komunikacije, avdiovizualne storitve in informacijska družba)
    in Protokola 37 (s seznamom iz člena 101) k Sporazumu EGP (Akt o kibernetski
    varnosti)
  type: main
