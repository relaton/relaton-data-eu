  script: Latn
  content: Decisión (UE) 2023/272 del Consejo de 30 de enero de 2023 relativa a la
    posición que debe adoptarse, en nombre de la Unión Europea, en el Comité Mixto
    del EEE en lo que respecta a la modificación del anexo XI (Comunicación electrónica,
    servicios audiovisuales y sociedad de la información) y del Protocolo 37 (que
    contiene la lista correspondiente al artículo 101) del Acuerdo EEE (Reglamento
    sobre la Ciberseguridad)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/272 av den 30 januari 2023 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i gemensamma EES-kommittén beträffande
    en ändring av bilaga XI (Elektronisk kommunikation, audiovisuella tjänster och
