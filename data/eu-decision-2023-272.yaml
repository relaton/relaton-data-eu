title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/272 of 30 January 2023 on the position to be
    adopted, on behalf of the European Union, within the EEA Joint Committee concerning
    an amendment to Annex XI (Electronic communication, audiovisual services and information
    society) and Protocol 37 (containing the list provided for in Article 101) to
    the EEA Agreement (Cybersecurity Act)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/272 du Conseil du 30 janvier 2023 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’EEE
    en ce qui concerne une modification de l’annexe XI (Communications électroniques,
    services audiovisuels et société de l’information) et du protocole 37 (comportant
    la liste prévue à l’article 101) de l’accord EEE (règlement sur la cybersécurité)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/272 des Rates vom 30. Januar 2023 über den Standpunkt,
    der im Namen der Europäischen Union im Gemeinsamen EWR-Ausschuss zur Änderung
    des Anhangs XI (Elektronische Kommunikation, audiovisuelle Dienste und Informationsgesellschaft)
    und des Protokolls 37 mit der Liste gemäß Artikel 101 zum EWR-Abkommen zu vertreten
    ist (Rechtsakt zur Cybersicherheit)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/272 на Съвета от 30 януари 2023
    година относно позицията, която да бъде заета
    от името на Европейския съюз в рамките на Съвместния
    комитет на ЕИП, във връзка с изменението на
    приложение XI (Електронни комуникации, аудио-визуални
    услуги и информационно общество) и Протокол
    37 (съдържащ списъка, предвиден в член 101) към
    Споразумението за ЕИП (Акт за киберсигурността)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/272 ze dne 30. ledna 2023 o postoji, který
    má být zaujat jménem Evropské unie ve Smíšeném výboru EHP ke změně přílohy
    XI (Elektronické komunikace, audiovizuální služby a informační společnost)
    Dohody o EHP a protokolu 37 (obsahujícího seznam stanovený v článku 101)
    k Dohodě o EHP (akt o kybernetické bezpečnosti)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2023/272 af 30. januar 2023 om den holdning, der
