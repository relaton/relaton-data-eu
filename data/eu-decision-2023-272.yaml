    en ændring af bilag XI (Elektronisk kommunikation, audiovisuelle tjenesteydelser
    og informationssamfund) og protokol 37 (der indeholder den i artikel 101 omhandlede
    liste) til EØS-aftalen (forordningen om cybersikkerhed)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2023/272 του Συμβουλίου της 30ής
    Ιανουαρίου 2023 για τη θέση που πρέπει να ληφθεί,
