title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1805/85 of 28 June 1985 re-establishing
    the levying of customs duties on diodes, transistors and similar semiconductor
    devices, parts, falling within subheadings 85.21 D and E, originating in Malaysia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1805/85 de la Commission du 28 juin 1985 portant rétablissement
    de la perception des droits de douane applicables aux diodes, transistors et dispositifs
    similaires, et leurs parties et pièces détachées, des sous-positions 85.21
    D et E du tarif douanier commun, originaires de Malaysia, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1805/85 der Kommission vom 28. Juni 1985 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter sowie
    Teile der Tarifstellen 85.21 D und E mit Ursprung in Malaysia, dem die in der
    Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1805/85 af 28. juni 1985 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter,
    dele, henhørende under pos. 85.21 D og E og med oprindelse i Malaysia, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1805/85 της Επιτροπής
    της 28ης Ιουνίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις, μέρη και μεμονωμένα
    τεμάχια των διακρίσεων 85.21 Δ και Ε του Κοινού
    Δασμολογίου, καταγωγής Μαλαισίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1805/85 della Commissione del 28 giugno 1985 che ripristina
    la riscossione dei dazi doganali applicabili ai diodi, transistori e simili dispositivi,
    parti e pezzi staccati, delle sottovoci 85.21 D, E della tariffa doganale comune,
    originari della Malaysia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1805/85 van de Commissie van 28 juni 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen, delen en onderdelen, van postonderverdeling
    85.21 D en E, van oorsprong uit Maleisië, waarvoor de in Verordening (EEG) nr.
    3562/84 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
