title:
- language: en
  script: Latn
  content: '83/565/EEC: Commission Decision of 7 November 1983 establishing that the
    apparatus described as ''Cryotronics - Closed Cycle Cryogenic Refrigerator, model
    21, with Cold Head Assembly, model LTS 21'' may not be imported free of Common
    Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/565/CEE: Décision de la Commission du 7 novembre 1983 constatant que
    l''importation de l''appareil dénommé "Cryotronics - Closed cycle cryogenic
    refrigerator, model 21, with cold head assembly, model LTS 21" ne peut être faite
    en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/565/EWG: Entscheidung der Kommission vom 7. November 1983, mit der
    festgestellt wird, daß das Gerät ,,Cryotronics - Closed Cycle Cryogenic Refrigerator,
    model 21, with Cold Head Assembly, model LTS 21" nicht unter Befreiung von den
    Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/565/EØF: Kommissionens beslutning af 7. november 1983 om fastslåelse
    af, at indførsel af apparatet "Cryotronics - Closed Cycle Cryogenic Refrigerator,
    model 21, with Cold Head Assembly, model LTS 21" ikke kan ske med fritagelse for
    told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/565/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Νοεμβρίου
