title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1594/71 de la Commission, du 23 juillet 1971, modifiant
    l'annexe X du règlement (CEE) n° 1014/71 en ce qui concerne les montants compensatoires
    applicables dans le secteur des matières grasses à la suite de l'élargissement
    temporaire des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1594/71 der Kommission vom 23. Juli 1971 zur Änderung
    des Anhangs X der Verordnung (EWG) Nr. 1014/71 betreffend die auf dem Öl- und
    Fettsektor anzuwendenden Ausgleichsbeträge im Anschluß an die vorübergehende
    Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1594/71 della Commissione, del 23 luglio 1971, che
    modifica l'allegato X del regolamento (CEE) n. 1014/71 relativo agli importi compensativi
    fissati per il settore delle materie grasse in seguito all'ampliamento temporaneo
    dei margini di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1594/71 van de Commissie van 23 juli 1971 tot wijziging
    van bijlage X van Verordening (EEG) nr. 1014/71 betreffende de compenserende bedragen
    van toepassing in de sector oliën en vetten ingevolge de tijdelijke verruiming
    van de fluctuatiemarges van de valuta's van sommige Lid-Staten
  type: main
