    à l''importation d''arachides et de certains produits dérivés originaires ou
    en provenance d''Égypte (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2003) 2800]'
  type: main
- language: de
  script: Latn
