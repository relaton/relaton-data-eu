    przywozu orzeszków ziemnych i niektórych produktów z orzeszków ziemnych pochodzących
    z Egiptu (notyfikowana jako dokument nr C(2003) 2800)
  type: main
- language: pt
  script: Latn
  content: '2003/580/CE: Decisão da Comissão, de 4 de Agosto de 2003, que altera
