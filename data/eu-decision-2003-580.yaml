  script: Latn
  content: '2003/580/EC: Commission Decision of 4 August 2003 amending Decision 2000/49/EC
    repealing Decision 1999/356/EC and imposing special conditions on the import of
    peanuts and certain products derived from peanuts originating in or consigned
    from Egypt (Text with EEA relevance) (notified under document number C(2003) 2800)'
  type: main
- language: fr
  script: Latn
