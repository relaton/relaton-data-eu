title:
- language: en
  script: Latn
  content: '80/1289/EEC: Commission Decision of 22 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the French Republic of expenditure incurred
    during 1979 on aids and premiums relating to the modernization of farms, including
    those in the less-favoured farming areas (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1289/CEE: Décision de la Commission, du 22 décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", à la République française, des dépenses effectuées
    pendant l''année 1979 pour les aides et primes relatives à la modernisation
    des exploitations agricoles, y compris dans les zones agricoles défavorisées
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1289/EWG: Entscheidung der Kommission vom 22. Dezember 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben für Beihilfen
    und Prämien zur Modernisierung landwirtschaftlicher Betriebe - einschließlich
    der Hilfen für benachteiligte landwirtschaftliche Gebiete - durch den EAGFL,
    Abteilung Ausrichtung, an die Französische Republik (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1289/EØF: Kommissionens beslutning af 22. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Den franske Republik af de udgifter, som
    er afholdt i løbet af året 1979 til støtte og præmier vedrørende modernisering
    af landbrugsbedrifter, herunder bedrifter beliggende i ugunstigt stillede områder
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1289/CEE: Decisione della Commissione, del 22 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica francese
    delle spese effettuate nel 1979 per gli aiuti e i premi relativi all''ammodernamento
    delle aziende agricole, comprese quelle nelle zone agricole svantaggiate (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1289/EEG: Beschikking van de Commissie van 22 december 1980 betreffende
