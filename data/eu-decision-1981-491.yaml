title:
- language: en
  script: Latn
  content: '81/491/EEC: Commission Decision of 19 May 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, impregnated or coated with artificial
    plastic materials, originating in Macao (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/491/CEE: Décision de la Commission, du 19 mai 1981, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, imprégnée ou enduite de matières plastiques,
    originaire de Macao (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/491/EWG: Entscheidung der Kommission vom 19. Mai 1981 zur Ermächtigung
    der Französischen Republik, aus Macao stammende Handschuhe aus Gewirken, weder
    gummielastisch noch kautschutiert, mit Kunststoff getränkt oder bestrichen, von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/491/EØF: Kommissionens beslutning af 19. maj 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, imprægnerede eller overtrukket med plast, med oprindelse i Macao (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/491/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης
    Μαΐου 1981 περί χορηγήσεως αδείας στή Γαλλική
    Δημοκρατία νά εξαιρέσει από τήν κοινοτική
    μεταχείριση τά πλεκτά χειρόκτια μή ελαστικά
    ούτε συνδυασμένα μέ καουτσούκ, εμποτισμένα
    ή επιχρισμένα μέ πλαστικές ύλες, καταγωγής
    Μακάο (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/491/CEE: Decisione della Commissione, del 19 maggio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, impregnata o ricoperta di materie plastiche, originari
    di Macao (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/491/EEG: Beschikking van de Commissie van 19 mei 1981 houdende machtiging
    van de Franse Republiek om handschoenen, wanten en dergelijke artikelen, van niet-
    elastisch of van niet-gegummeerd brei- of haakwerk, geïmpregneerd of met een
    deklaag van plastische stoffen, van oorsprong uit Macao van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
