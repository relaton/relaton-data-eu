title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2912/74 of the Council of 7 November 1974 opening,
    allocating and providing for the administration of a Community tariff quota for
    dried grapes in immediate containers of a net capacity of 15 kg or less, falling
    within subheading 08.04 B I of the Common Customs Tariff (1975)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2912/74 du Conseil, du 7 novembre 1974, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs présentés en emballages immédiats d'un contenu net inférieur ou égal
    à 15 kilogrammes, de la sous-position 08.04 B I du tarif douanier commun (année
    1975)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2912/74 des Rates vom 7. November 1974 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 Kilogramm
    oder weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs (1975)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2912/74 af 7. november 1974 om åbning, fordeling
    og forvaltning af fællesskabstoldkontingentet for tørrede druer i pakninger
    af nettovægt 15 kg og derunder under position 08.04 B I i den fælles toldtarif
    (1975)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2912/74 del Consiglio, del 7 novembre 1974, recante
    apertura, ripartizione e modalità di gestione del contingente tariffario comunitario
    di uve secche, presentate in imballaggi immediati di contenuto netto di 15 kg
    o meno della sottovoce 08.04 B I della tariffa doganale comune (anno 1975)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2912/74 van de Raad van 7 november 1974 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor rozijnen en krenten, in verpakkingen met een netto-inhoud per onmiddellijke
    verpakking van 15 kilogram of minder, van onderverdeling 08.04 B I van het gemeenschappelijk
    douanetarief (jaar 1975)
