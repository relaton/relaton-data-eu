  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1540 of 6 July 2026 imposing
    a definitive anti-dumping duty on imports of new pneumatic tyres, of rubber, of
    a kind used on motor cars, buses or lorries with a load index not exceeding 121
    (tyres) originating in the People’s Republic of China
