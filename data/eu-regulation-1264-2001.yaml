    af forordning (EF) nr. 1531/2000 om en særlig løbende licitation for produktionsåret
    2000/01 med henblik på fastsættelse af en eksportafgift og/eller eksportrestitution
    for hvidt sukker, forordning (EØF) nr. 1729/78 om gennemførelsesbestemmelser
    vedrørende produktionsrestitution for sukker, der anvendes i den kemiske industri,
    og forordning (EF) nr. 1729/97 om regulering af visse forudfastsatte eksportrestitutioner
    som følge af en ændring af priserne eller lagerafgiften for sukker
  type: main
