title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1264/2001 of 27 June 2001 amending Regulations
    (EC) No 1531/2000 relating to a standing invitation to tender to determine levies
    and/or refunds on exports of white sugar for the 2000/01 marketing year, (EEC)
    No 1729/78 laying down detailed rules of application in respect of the production
    refund for sugar used in the chemical industry and (EC) No 1729/97 on the adjustment,
    following a change in prices or the storage levy in the sugar sector, of certain
    export refunds fixed in advance
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1264/2001 de la Commission du 27 juin 2001 modifiant
    le règlement (CE) n° 1531/2000 concernant une adjudication permanente au titre
    de la campagne de commercialisation 2000/2001 pour la détermination de prélèvements
    et/ou de restitutions à l'exportation du sucre blanc, le règlement (CEE) n°
    1729/78 établissant les modalités d'application concernant la restitution à
    la production pour le sucre utilisé dans l'industrie chimique et le règlement
    (CE) n° 1729/97 relatif à l'ajustement de certaines restitutions à l'exportation,
    fixées à l'avance par suite d'une modification des prix ou de la cotisation
    de stockage dans le secteur du sucre
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1264/2001 der Kommission vom 27. Juni 2001 zur Änderung
    der Verordnung (EG) Nr. 1531/2000 betreffend eine Dauerausschreibung für das
    Wirtschaftsjahr 2000/01 für die Festsetzung von Abschöpfungen und/oder Erstattungen
    bei der Ausfuhr von Weißzucker, der Verordnung (EWG) Nr. 1729/78 über Durchführungsbestimmungen
    für die Erstattung bei der Erzeugung von Zucker, der in der chemischen Industrie
    verwendet wird, und der Verordnung (EG) Nr. 1729/97 über die Anpassung bestimmter
    im Voraus festgesetzter Ausfuhrerstattungen infolge einer Änderung des Preises
    oder der Lagerkostenabgabe im Zuckersektor
  type: main
- language: da
  script: Latn
