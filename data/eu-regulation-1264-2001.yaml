    2000/2001 för fastställande av exportavgifter och/eller exportbidrag för vitsocker,
    av förordning (EEG) nr 1729/78 om tillämpningsföreskrifter för produktionsbidrag
    för socker som används i den kemiska industrin och av förordning (EG) nr 1729/97
