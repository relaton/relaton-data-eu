  content: Regolamento (CE) n. 1264/2001 della Commissione, del 27 giugno 2001, che
    modifica il regolamento (CE) n. 1531/2000 relativo a una gara permanente per la
    determinazione di prelievi e/o di restituzioni all'esportazione di zucchero bianco
    nel quadro della campagna di commercializzazione 2000/01, il regolamento (CEE)
    n. 1729/78 che stabilisce le modalità d'applicazione concernenti la restituzione
    alla produzione per lo zucchero utilizzato nell'industria chimica e il regolamento
    (CE) n. 1729/97 relativo all'adeguamento di talune restituzioni all'esportazione
    fissate in anticipo, a seguito di una modifica dei prezzi o del contributo di
    magazzinaggio nel settore dello zucchero
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1264/2001 van de Commissie van 27 juni 2001 tot wĳziging
    van Verordening (EG) nr. 1531/2000 betreffende een permanente inschrĳving uit
    hoofde van het verkoopseizoen 2000/2001 voor de vaststelling van heffingen en/of
    restituties bĳ uitvoer van witte suiker, van Verordening (EEG) nr. 1729/78 houdende
    uitvoeringsbepalingen met betrekking tot de restitutie bĳ de productie voor suiker
    die in de chemische industrie wordt gebruikt, en van Verordening (EG) nr. 1729/97
    betreffende de aanpassing van een aantal vooraf vastgestelde uitvoerrestituties
    als gevolg van een prĳswĳziging of van een wĳziging van de opslagbĳdrage in
    de sector suiker
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1264/2001 da Comissão, de 27 de Junho de 2001, que
    altera o Regulamento (CE) n.° 1531/2000 relativo a um concurso permanente, a
    título da campanha de comercialização de 2000/2001, para a determinação de
    direitos niveladores e/ou de restituições à exportação de açúcar branco,
    o Regulamento (CEE) n.° 1729/78 que estabelece as modalidades de aplicação
    relativas à restituição à produção para o açúcar utilizado na indústria
    química e o Regulamento (CE) n.° 1729/97 relativo ao ajustamento de determinadas
    restituições à exportação prefixadas, em consequência de uma alteração
    dos preços ou da cotização de armazenagem no sector do açúcar
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1264/2001 de la Comisión, de 27 de junio de 2001,
    que modifica el Reglamento (CE) n° 1531/2000 por el que se abre una licitación
    permanente con cargo a la campaña de comercialización 2000/01 para la determinación
    de las exacciones reguladoras y las restituciones por la exportación de azúcar
    blanco, el Reglamento (CE) n° 1729/78 por el que se establecen las modalidades
    de aplicación relativas a la restitución a la producción para el azúcar utilizado
    en la industria química y el Reglamento (CE) n° 1729/97 relativo al ajuste de
    determinadas restituciones por exportación fijadas por anticipado como consecuencia
    de una modificación de los precios o de la cotización de almacenamiento en el
    sector del azúcar
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1264/2001 av den 27 juni 2001 om ändring
