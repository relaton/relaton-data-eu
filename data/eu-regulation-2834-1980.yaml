title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2834/80 of 30 October 1980 fixing for the 1980/81
    marketing year the representative market price and the threshold price for olive
    oil and the percentages of the consumption aid to be retained in accordance with
    Article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2834/80 du Conseil, du 30 octobre 1980, fixant, pour
    la campagne de commercialisation 1980/1981, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive, ainsi que les pourcentages du montant
    de l' aide à la consommation à retenir conformément à l' article 11 paragraphes
    5 et 6 du règlement n° 136/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2834/80 des Rates vom 30. Oktober 1980 zur Festsetzung
    des repräsentativen Marktpreises und des Schwellenpreises für Olivenöl sowie
    der gemäß Artikel 11 Absätze 5 und 6 der Verordnung Nr. 136/66/EWG vom Betrag
    der Verbrauchsbeihilfe einzubehaltenden Prozentsätze für das Wirtschaftsjahr
    1980/81
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2834/80 af 30. oktober 1980 om fastsættelse
    for produktionsåret 1980/81 af den repræsentative markedspris og tærskelprisen
    for olivenolie samt af de procentdele af forbrugsstøtten, der skal tilbageholdes
    i henhold til artikel 11, stk. 5 og 6, i forordning nr. 136/66/EØF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2834/80 τού Συμβουλίου
    τής 30ής Οκτωβρίου 1980 περί καθορισμού τής αντιπροσωπευτικής
    τιμής αγοράς καί τής τιμής κατωφλίου τού ελαιολάδου
    γιά τήν περίοδο εμπορίας 1980/81, καθώς καί τών
    ποσοστών τού ποσού τής ενισχύσεως στήν κατανάλωση
    πού πρέπει νά λαμβάνονται υπόψη σύμφωνα μέ
    τό άρθρο 11 παράγραφοι 5 καί 6 τού κανονισμού
    αριθ. 136/66/EOK
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2834/80 del Consiglio, del 30 ottobre 1980, che fissa,
    per la campagna di commercializzazione 1980/1981, il prezzo rappresentativo di
    mercato e il prezzo d' entrata dell' olio d' oliva, nonché le percentuali dell'
    importo dell' aiuto al consumo da adottare in conformità dell' articolo 11, paragrafi
    5 e 6, del regolamento n. 136/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2834/80 van de Raad van 30 oktober 1980 houdende
    vaststelling voor het verkoopseizoen 1980/1981 van de representatieve marktprijs
    en de drempelprijs voor olijfolie en van de overeenkomstig artikel 11, lid 5 en
    lid 6, van Verordening (EEG) nr. 136/66/EEG in te houden percentages van het bedrag
    van de consumptiesteun
  type: main
