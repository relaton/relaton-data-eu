title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 73/91 of 11 January 1991 reducing for the
    1990/91 wine year the quantities of concentrated grape must in approved contracts
    for use in feedingstuffs and derogating from certain time limits for the same
    wine year
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 73/91 DE LA COMMISSION du 11 janvier 1991 portant,
    pour la campagne 1990/1991, réduction des quantités de moûts de raisins concentrés
    figurant dans les contrats agréés au titre de l'' utilisation dans l'' alimentation
    animale et portant dérogation pour la même campagne en ce qui concerne certains
    délais #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 73/91 DER KOMMISSION vom 11. Januar 1991 zur Verringerung
    der Mengen Traubenmostkonzentrat, die in den hinsichtlich der Verfütterung gebilligten
    Verträgen angegeben sind, und zur Abweichung von bestimmten Fristen im Wirtschaftsjahr
    1990/91 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 73/91 af 11. januar 1991 om nedsættelse
    for produktionsåret 1990/91 af de mængder koncentreret druemost, som er anført
    i kontrakter, der er godkendt med henblik på produktets anvendelse til foder
    og om fastsættelse af en undtagelse for samme produktionsår, for så vidt angår
    visse frister
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 73/91 της Επιτροπής
    της 11ης Ιανουαρίου 1991 για μείωση για την περίοδο
    1990/91 των ποσοτήτων του συμπυκνωμένου γλεύκους
    σταφυλής που εμφαίνεται στις εγκεκριμένες
    συμβάσεις για τη χρησιμοποίηση στη διατροφή
    των ζώων και για παρέκκλιση για την ίδια περίοδο
    όσον αφορά ορισμένες προθεσμίες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 73/91 DELLA COMMISSIONE dell'' 11 gennaio 1991 che
    riduce per la campagna 1990/1991 i quantitativi di uve concentrati indicati nei
    contratti approvati a titolo dell'' utilizzazione nell'' alimentazione animale
    e reca deroga per la stessa campagna relativamente ad alcuni termini #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 73/91 VAN DE COMMISSIE van 11 januari 1991 houdende
    vermindering, voor het wijnoogstjaar 1990/1991, van de hoeveelheden geconcentreerde
    druivemost in de contracten die zijn goedgekeurd inzake het gebruik van most bij
    de diervoeding en tot vaststelling van afwijkende termijnen voor het wijnoogstjaar
    1990/1991 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 73/91 DA COMISSÃO de 11 de Janeiro de 1991 que
    reduz, relativamente à campanha de 1990/1991, as quantidades de mostos de uva
    concentrados que constam dos contratos aprovados a título da utilização na
    alimentação dos animais e que derroga determinados prazos no que diz respeito
    à referida campanha #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 73/91 DE LA COMISIÓN de 11 de enero de 1991 por
    el que se reducen las cantidades de mosto de uva concentrado de la campaña de
    1990/91 que figuran en los contratos autorizados para su utilización en la alimentación
    animal y por el que se establecen durante esa misma campaña excepciones a algunos
    plazos #'
  type: main
