title:
- language: en
  script: Latn
  content: '90/251/EEC: Commission Decision of 22 May 1990 recognizing Greece as an
    officially swine fever-free Member State within the context of eradication and
    amending for the fourth time Decision 81/400/EEC establishing the status of Member
    States as regards classical swine fever with a view to its eradication'
  type: main
- language: fr
  script: Latn
  content: '90/251/CEE: Décision de la Commission, du 22 mai 1990, reconnaissant
    la Grèce comme État membre officiellement indemne de peste porcine dans le cadre
    de l''éradication et portant quatrième modification de la décision 81/400/CEE
    établissant le statut des États membres en ce qui concerne la peste porcine
    classique en vue de son éradication'
  type: main
- language: de
  script: Latn
  content: '90/251/EWG: Entscheidung der Kommission vom 22. Mai 1990 zur Anerkennung
    von Griechenland als amtlich schweinepestfrei im Rahmen der Seuchentilgung und
    zur vierten Änderung der Entscheidung 81/400/EWG über die Festlegung des Statuts
    der Mitgliedstaaten hinsichtlich der Ausmerzung der klassischen Schweinepest'
  type: main
- language: da
  script: Latn
  content: '90/251/EØF: Kommissionens beslutning af 22. maj 1990 om anerkendelse
    af Grækenland som værende officielt fri for svinepest i forbindelse med udryddelsen
    af denne sygdom og om fjerde ændring af beslutning 81/400/EØF om fastlæggelse
    af medlemsstaternes status i forbindelse med udryddelse af klassisk svinepest'
  type: main
- language: el
  script: Grek
  content: '90/251/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Μαΐου 1990 για την αναγνώριση της Ελλάδας ως
    κράτους μέλους επίσημα απαλλαγμένου από την
    πανώλη των χοίρων στο πλαίσιο του προγράμματος
    εξάλειψης της ασθένειας αυτής και για την τέταρτη
    τροποποίηση της απόφασης 81/400/ΕΟΚ περί καθορισμού
    καθεστώτος των κρατών μελών όσον αφορά την
    κλασική πανώλη των χοίρων με στόχο την εξάλειψή
    της'
  type: main
- language: fi
  script: Latn
  content: '90/251/ETY: Komission päätös, tehty 22 päivänä toukokuuta 1990,
    Kreikan vahvistamisesta virallisesti sikarutosta vapaaksi jäsenvaltioksi taudin
    hävittämisen yhteydessä ja jäsenvaltioiden aseman vahvistamisesta klassisen
    sikaruton hävittämisen yhteydessä tehdyn päätöksen 81/400/ETY muuttamisesta
    neljännen kerran'
  type: main
- language: it
  script: Latn
  content: '90/251/CEE: Decisione della Commissione, del 22 maggio 1990, che nel contesto
    del piano di eradicazione riconosce ufficialmente indenne dalla peste suina il
    territorio della Grecia, e modifica per la quarta volta la decisione 81/400/CEE,
    che stabilisce lo status degli Stati membri nei confronti della peste suina classica
    in vista dell''eradicazione di tale malattia'
  type: main
- language: nl
  script: Latn
  content: '90/251/EEG: Beschikking van de Commissie van 22 mei 1990 tot erkenning
    van Griekenland, in het kader van de uitroeiing van varkenspest, als officieel
    vrij van die ziekte, tevens houdende vierde wijziging van Beschikking 81/400/EEG
    houdende vaststelling van de status van de Lid-Staten ten aanzien van de uitroeiing
    van klassieke varkenspest'
  type: main
- language: pt
  script: Latn
  content: '90/251/CEE: Decisão da Comissão, de 22 de Maio de 1990, que reconhece
    a República Helénica como um Estado-membro oficialmente indemne de peste suína
    no contexto da erradicação da doença e altera pela quarta vez a Decisão 81/400/CEE
    que estabelece o estatuto dos Estados-membros relativo à peste suína clássica
    para a sua erradicação'
  type: main
- language: es
  script: Latn
  content: '90/251/CEE: Decisión de la Comisión, de 22 de mayo de 1990, por la que
    se reconoce a Grecia como Estado miembro oficialmente indemne de peste porcina
    en el marco de la erradicación, por la que se modifica por cuarta vez la Decisión
    81/400/CEE y por la que se establece el estatuto de los Estados miembros en lo
    que respecta a la peste porcina clásica a fin de lograr su erradicación'
  type: main
- language: sv
  script: Latn
  content: '90/251/EEG: Kommissionens beslut av den 22 maj 1990 om erkännande av
    Grekland som en medlemsstat officiellt fri från svinpest i samband med sjukdomens
    utrotning och om fjärde ändringen av beslut 81/400/EEG om fastställande av
    medlemsstaternas status ifråga om bekämpningen av klassisk svinpest'
  type: main
