title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1865/91 of 28 June 1991 fixing the number
    of young male bovine animals which may be imported on special terms in the third
    quarter of 1991, and derogating from Regulation (EEC) No 2377/80 in respect of
    that quarter as regards the allocation of the quantities available
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1865/91 de la Commission, du 28 juin 1991, relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le troisième trimestre de 1991 et portant dérogation,
    pour ce trimestre, au règlement (CEE) n 2377/80 en ce qui concerne l'attribution
    des quantités disponibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1865/91 der Kommission vom 28. Juni 1991 zur Festsetzung
    der Anzahl männlicher Jungrinder, die im dritten Vierteljahr 1991 unter Sonderbedingungen
    eingeführt werden können, und zur Abweichung von der Verordnung (EWG) Nr. 2377/80
    hinsichtlich der Zuteilung der verfügbaren Mengen in diesem Vierteljahr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1865/91 af 28. juni 1991 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i tredje kvartal
    af 1991, og om undtagelse for dette kvartal fra forordning (EØF) nr. 2377/80
    for så vidt angår tildelingen af disponible mængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1865/91 της Επιτροπής
    της 28ης Ιουνίου 1991 για τον καθορισμό των ποσοτήτων
    των νεαρών αρένων βοοειδών που είναι δυνατόν
    να εισαχθούν με ειδικούς όρους κατά το τρίτο
    τρίμηνο του 1991 και για παρέκκλιση, κατά το τρίμηνο
    αυτό, από τον κανονισμό (ΕΟΚ) αριθ. 2377/80 όσον
    αφορά την απόδοση των διαθεσίμων ποσοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1865/91 della Commissione, del 28 giugno 1991, che
    fissa il numero di giovani bovini maschi che possono essere importati a condizioni
    speciali nel terzo trimestre del 1991 e reca deroga, per tale trimestre, al regolamento
    (CEE) n. 2377/80 per quanto riguarda l'attribuzione dei quantitativi disponibili
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1865/91 van de Commissie van 28 juni 1991 tot vaststelling
    van het aantal jonge mannelijke runderen dat in het derde kwartaal van 1991 onder
    bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking, voor dat kwartaal,
    van Verordening (EEG) nr. 2377/80 ten aanzien van de toewijzing van de beschikbare
    aantallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1865/91 da Comissão, de 28 de Junho de 1991, relativo
    à fixação da quantidade de vitelos machos que podem ser importados em condições
    especiais durante o terceiro trimestre de 1991 e que prevê uma derrogação,
    no que diz respeito ao referido trimestre, ao Regulamento (CEE) nº 2377/80, quanto
    à atribuição das quantidades disponíveis
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1865/91 de la Comisión, de 28 de junio de 1991, por
    el que se fija la cantidad de machos jóvenes de la especie bovina que podrán
    importarse en condiciones especiales durante el tercer trimestre de 1991 y por
    el que se establece una excepción, para este trimestre, al Reglamento (CEE) n
    2377/80 en lo relativo a la atribución de las cantidades disponibles
  type: main
