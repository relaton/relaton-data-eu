    μέ βάση τά οπωροκηπευτικά γιά τήν περίοδο 1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2813/81 della Commissione, del 29 settembre 1981,
    che modifica il regolamento (CEE) n. 1963/81 che fissa, per la campagna 1981/1982,
