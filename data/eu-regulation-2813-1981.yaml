title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2813/81 of 29 September 1981 amending Regulation
    (EEC) No 1963/81 fixing for the 1981/82 marketing year the minimum price to be
    paid to producers and the amount of production aid for certain products processed
    from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2813/81 de la Commission, du 29 septembre 1981, portant
    modification du règlement (CEE) n° 1963/81 fixant, pour la campagne 1981/1982,
    le prix minimal à payer aux producteurs ainsi que le montant de l' aide à la
    production pour certains produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2813/81 der Kommission vom 29. September 1981 zur
    Änderung der Verordnung (EWG) Nr. 1963/81 zur Festsetzung des den Erzeugern zu
    zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe für bestimmte
    Verarbeitungserzeugnisse aus Obst und Gemüse für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2813/81 af 29. september 1981 om ændring
    af forordning (EØF) nr. 1963/81 om fastsættelse for produktionsåret 1981/82
    af producentstøtten og den minimumspris, der skal betales til producenterne,
    for visse produkter forarbejdet på basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2813/81 τής Επιτροπής
    τής 29ης Σεπτεμβρίου 1981 περί τροποποιήσεως
