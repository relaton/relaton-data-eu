title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 588/77 of 22 March 1977 establishing a list
    of authorized vine varieties which may be used for new plantings and replantings
    until 30 November 1978 and laying down further rules for the application of Regulation
    (EEC) No 1162/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 588/77 de la Commission, du 22 mars 1977, établissant
    la liste des variétés de vigne autorisées pouvant être utilisées pour les
    plantations nouvelles et les replantations jusqu' au 30 novembre 1978 et portant
    d' autres modalités d' application du règlement (CEE) n° 1162/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 588/77 der Kommission vom 22. März 1977 zur Aufstellung
    des Verzeichnisses der zugelassenen Rebsorten, die bis 30. November 1978 für
    Neuanpflanzungen und Wiederbepflanzungen verwendet werden dürfen, und zur Festlegung
    weiterer Durchführungsbestimmungen zur Verordnung (EWG) Nr. 1162/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 588/77 af 22. marts 1977 om oprettelse
    af en liste over godkendte vinstoksorter, der må anvendes til nyplantning og
    genbeplantning indtil den 30. november 1978 og om andre gennemførelsesbestemmelser
    til forordning (EØF) nr. 1162/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 588/77 della Commissione, del 22 marzo 1977, che stabilisce
    l' elenco delle varietà di viti autorizzate utilizzabili per i nuovi impianti
    e i reimpianti sino al 30 novembre 1978 e reca altre modalità di applicazione
    del regolamento (CEE) n. 1162/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 588/77 van de Commissie van 22 maart 1977 tot vaststelling
    van de lijst van de toegestane wijnstokrassen die tot en met 30 november 1978
    mogen worden gebruikt bij aanplant en herbeplanting, tevens houdende andere uitvoeringsbepalingen
    van Verordening (EEG) nr. 1162/76
  type: main
