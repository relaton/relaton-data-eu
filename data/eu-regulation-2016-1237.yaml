  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/1237 af 18. maj 2016 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) nr. 1308/2013 for så
    vidt angår bestemmelserne for anvendelse af ordningen med import- og eksportlicenser
    og om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr.
    1306/2013 for så vidt angår bestemmelserne om frigivelse og fortabelse af sikkerhed,
    der er stillet for sådanne licenser, om ændring af Kommissionens forordning
    (EF) nr. 2535/2001, (EF) nr. 1342/2003, (EF) nr. 2336/2003, (EF) nr. 951/2006,
    (EF) nr. 341/2007 og (EF) nr. 382/2008 og om ophævelse af Kommissionens forordning
    (EF) nr. 2390/98, (EF) nr. 1345/2005, (EF) nr. 376/2008 og (EF) nr. 507/2008
