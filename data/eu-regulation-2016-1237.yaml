  content: Kommissionens delegerade förordning (EU) 2016/1237 av den 18 maj 2016
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1308/2013
    vad gäller reglerna för tillämpning av systemet med import- och exportlicenser,
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1306/2013
    vad gäller reglerna om frisläppande och förverkande av de säkerheter som ställs
    för import- och exportlicenser, om ändring av kommissionens förordningar (EG)
    nr 2535/2001, (EG) nr 1342/2003, (EG) nr 2336/2003, (EG) nr 951/2006, (EG) nr
    341/2007 och (EG) nr 382/2008 och om upphävande av kommissionens förordningar
    (EG) nr 2390/98, (EG) nr 1345/2005, (EG) nr 376/2008 och (EG) nr 507/2008
