  content: Commission Delegated Regulation (EU) 2016/1237 of 18 May 2016 supplementing
    Regulation (EU) No 1308/2013 of the European Parliament and of the Council with
    regard to the rules for applying the system of import and export licences and
    supplementing Regulation (EU) No 1306/2013 of the European Parliament and of the
    Council with regard to the rules on the release and forfeit of securities lodged
    for such licences, amending Commission Regulations (EC) No 2535/2001, (EC) No
    1342/2003, (EC) No 2336/2003, (EC) No 951/2006, (EC) No 341/2007 and (EC) No 382/2008
    and repealing Commission Regulations (EC) No 2390/98, (EC) No 1345/2005, (EC)
    No 376/2008 and (EC) No 507/2008
  type: main
