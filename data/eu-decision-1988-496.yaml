title:
- language: en
  script: Latn
  content: '88/496/EEC: Commission Decision of 9 September 1988 amending Decision
    88/176/EEC approving derogations provided for by Greece, Italy and Portugal from
    certain provisions of Council Directive 77/93/EEC in respect of seed potatoes
    originating in Canada (Only the Greek, Portuguese and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/496/CEE: Décision de la Commission du 9 septembre 1988 modifiant la
    décision 88/176/CEE approuvant des dérogations prévues par la Grèce, l''Italie
    et le Portugal à certaines dispositions de la directive 77/93/CEE du Conseil
    en ce qui concerne les plants de pommes de terre originaires du Canada (Les textes
    en langues grecque, portugaise et italienne sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/496/EWG: Entscheidung der Kommission vom 9. September 1988 zur Änderung
    der Entscheidung 88/176/EWG zur Genehmigung der von Griechenland, Italien und
    Portugal für Pflanzkartoffeln mit Ursprung in Kanada vorgesehenen Ausnahmen von
    bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates (Nur der griechische,
    portugiesische und italienische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/496/EØF: Kommissionens beslutning af 9. september 1988 om ændring
    af beslutning 88/176/EØF om godkendelse af undtagelser for Grækenland, Italien
    og Portugal fra visse bestemmelser i Rådets direktiv 77/93/EØF for så vidt
    angår læggekartofler med oprindelse i Canada (Kun den graeske, portugisiske
    og italienske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/496/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Σεπτεμβρίου
    1988 για τροποποίηση της απόφασης 88/176/ΕΟΚ για
    την έγκριση παρεκκλίσεων που προβλέπονται
    από την Ελλάδα, την Ιταλία και την Πορτογαλία
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους σπόρους γεωμήλων
    προς φύτευση καταγωγής Καναδά (Τα κείμενα στην
    ελληνική, πορτογαλική και ιταλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/496/CEE: Decisione della Commissione del 9 settembre 1988 recante modifica
    alla decisione 88/176/CEE che approva le deroghe, previste dalla Grecia, dall''Italia
    e dal Portogallo, a talune disposizioni della direttiva 77/93/CEE del Consiglio
    per quanto riguarda i tuberi- seme di patate originari del Canada (I testi in
    lingua greca, portoghese e italiana sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/496/EEG: Beschikking van de Commissie van 9 september 1988 tot wijziging
    van Beschikking 88/176/EEG tot goedkeuring van de door Griekenland, Italië en
    Portugal vastgestelde afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad ten aanzien van pootaardappelen van oorsprong uit Canada (Slechts
    de teksten in de Griekse, Portugese en de Italiaanse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/496/CEE: Decisão da Comissão de 9 de Setembro de 1988 que altera
    a Decisão 88/176/CEE que aprova derrogações estabelecidas pela Grécia, Itália
    e Portugal de determinadas disposições da Directiva 77/93/CEE do Conselho em
    relação à batata de semente originária do Canadá (Apenas fazem fé os textos
    nas línguas grega, portuguesa e italiana)'
  type: main
- language: es
  script: Latn
  content: '88/496/CEE: Decisión de la Comisión de 9 de septiembre de 1988 por la
