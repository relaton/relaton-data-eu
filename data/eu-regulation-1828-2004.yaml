    di uno schema di preferenze tariffarie generalizzate per il periodo 1o gennaio
    2002-31 dicembre 2004, onde includere Timor-Leste nell’elenco dei paesi beneficiari
    del regime speciale a favore dei paesi meno sviluppati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1828/2004 (2004. gada 21. oktobris), ar ko groza
    Padomes Regulu (EK) Nr. 2501/2001 par vispārējo tarifa preferenču sistēmas
    piemērošanu no 2002. gada 1. janvāra līdz 2004. gada 31. decembrim, lai Timoru-Lesti
    iekļautu to valstu sarakstā, uz kurām attiecas īpašs režīms vismazāk attīstītajām
    valstīm
  type: main
- language: lt
  script: Latn
  content: 2004 m. spalio 21 d. Komisijos reglamentas (EB) Nr. 1828/2004, iš dalies
    keičiantis Tarybos reglamentą (EB) Nr. 2501/2001, numatantį bendrųjų tarifų
    lengvatų sistemos taikymą nuo 2002 m. sausio 1 d. iki 2004 m. gruodžio 31 d.,
    ir įtraukiantis Rytų Timoro Demokratinę Respubliką į sąrašą šalių, kurioms
    taikomos specialiosios, mažiausiai išsivysčiusioms šalims skirtos, priemonės
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1828/2004 van de Commissie van 21 oktober 2004 tot
    wijziging van Verordening (EG) nr. 2501/2001 van de Raad houdende toepassing van
    een schema van algemene tariefpreferenties voor de periode van 1 januari 2002
    tot en met 31 december 2004 teneinde Timor-Leste (Oost-Timor) op te nemen in de
    lijst van landen waarop bijzondere regelingen voor de minst ontwikkelde landen
    van toepassing zijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1828/2004 z dnia 21 października 2004
    r. zmieniające rozporządzenie Rady (WE) nr 2501/2001 wprowadzające plan ogólnych
    preferencji taryfowych na okres od dnia 1 stycznia 2002 r. do dnia 31 grudnia
    2004 r. w celu włączenia Timoru-Leste do grupy krajów korzystających ze szczególnych
    ustaleń dla krajów najsłabiej rozwiniętych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1828/2004 da Comissão, de 21 de Outubro de 2004,
    que altera o Regulamento (CE) n.° 2501/2001 do Conselho relativo à aplicação
    de um sistema de preferências pautais generalizadas durante o período compreendido
    entre 1 de Janeiro de 2002 e 31 de Dezembro de 2004, a fim de incluir Timor-Leste
    na lista dos países que beneficiam do regime especial a favor dos países menos
    avançados
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1828/2004 z 21. októbra 2004, ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 2501/2001 uplatňujúce systém všeobecných
    colných preferencií na obdobie od 1. januára 2002 do 31. decembra 2004 s cieľom
    zaradiť Timor-Leste do zoznamu krajín, ktoré požívajú výhody vyplývajúce
    z osobitných opatrení pre najmenej rozvinuté krajiny
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1828/2004 z dne 21. oktobra 2004 o spremembi
    Uredbe Sveta (ES) št. 2501/2001 o uporabi sheme splošnih tarifnih preferencialov
    v obdobju od 1. januarja 2002 do 31. decembra 2004, tako da se vključi Timor-Leste
    na seznam držav, ki uživajo posebni režim za najmanj razvite države
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1828/2004 de la Comisión, de 21 de octubre de 2004,
    por el que se modifica el Reglamento (CE) n° 2501/2001 del Consejo, relativo
    a la aplicación de un sistema de preferencias arancelarias generalizadas para
    el período comprendido entre el 1 de enero de 2002 y el 31 de diciembre de 2004,
    con el fin de incluir a Timor-Leste en la lista de los países beneficiarios de
    un régimen especial en favor de los países menos desarrollados
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1828/2004 av den 21 oktober 2004 om ändring
    av rådets förordning (EG) nr 2501/2001 om tillämpning av en ordning med allmänna
    tullförmåner under tiden 1 januari 2002–31 december 2004 i syfte att lägga
    till Östtimor (Timor-Leste) i förteckningen över länder som omfattas av den
    särskilda ordningen för de minst utvecklade länderna
