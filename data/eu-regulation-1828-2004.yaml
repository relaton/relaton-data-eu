title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1828/2004 of 21 October 2004 amending Council
    Regulation (EC) No 2501/2001 applying a scheme of generalised tariff preferences
    for the period from 1 January 2002 to 31 December 2004 so as to include Timor-Leste
    in the list of countries enjoying the special arrangements for the least developed
    countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1828/2004 de la Commission du 21 octobre 2004 modifiant
    le règlement (CE) n° 2501/2001 du Conseil portant application d'un schéma de
    préférences tarifaires généralisées pour la période du 1er janvier 2002
    au 31 décembre 2004, afin d'inclure le Timor-Leste dans la liste des pays bénéficiant
    du régime spécial en faveur des pays les moins avancés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1828/2004 der Kommission vom 21. Oktober 2004 zur Änderung
    der Verordnung (EG) Nr. 2501/2001 des Rates über ein Schema allgemeiner Zollpräferenzen
    für den Zeitraum vom 1. Januar 2002 bis 31. Dezember 2004 zwecks Aufnahme von
    Timor-Leste in die Liste der durch Sonderregelungen begünstigten am wenigsten
    entwickelten Länder
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1828/2004 ze dne 21. října 2004, kterým
    se mění nařízení Rady (ES) č. 2501/2001 o uplatňování systému všeobecných
    celních preferencí v období od 1. ledna 2002 do 31. prosince 2004 za účelem
    zařazení Timoru-Leste na seznam zemí, na něž se vztahuje zvláštní režim
    pro nejméně rozvinuté země
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1828/2004 af 21. oktober 2004 om ændring
    af Rådets forordning (EF) nr. 2501/2001 om anvendelse af et arrangement med generelle
    toldpræferencer for perioden 1. januar 2002 til 31. december 2004 med henblik
    på at opføre Timor-Leste på listen over lande, der er omfattet af de særlige
    ordninger for de mindst udviklede lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1828/2004 της Επιτροπής,
    της 21ης Οκτωβρίου 2004, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2501/2001 του Συμβουλίου για
    την εφαρμογή συστήματος γενικευμένων δασμολογικών
    προτιμήσεων για την περίοδο από την 1η Ιανουαρίου
    2002 έως τις 31 Δεκεμβρίου 2004 ώστε να συμπεριληφθεί
    το Τιμόρ-Λέστε στον κατάλογο χωρών που επωφελούνται
    από ειδικές ρυθμίσεις για τις λιγότερο αναπτυγμένες
    χώρες
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1828/2004, 21. oktoober 2004, millega muudetakse
    nõukogu määrust (EÜ) nr 2501/2001 üldiste tariifsete soodustuste kava kohaldamise
    kohta ajavahemikus 1. jaanuar 2002 kuni 31. detsember 2004, et kanda Timor-Leste
    vähemarenenud riikide suhtes kehtestatud erikorra alusel soodustatud riikide
    loetellu
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1828/2004, annettu 21 päivänä lokakuuta 2004,
    yleisen tullietuusjärjestelmän soveltamisesta 1 päivästä tammikuuta 2002
    alkaen 31 päivään joulukuuta 2004 annetun neuvoston asetuksen (EY) N:o 2501/2001
    muuttamisesta lisäämällä Timor-Leste (Itä-Timor) erityisjärjestelyjen piiriin
    kuuluvien vähiten kehittyneiden maiden luetteloon
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1828/2004/EK rendelete (2004. október 21.) a 2002. január
    1-jétől 2004. december 31-ig terjedő időszakra vonatkozóan általános preferenciális
    rendszer alkalmazásáról szóló, a Timor-Lestének a legkevésbé fejlett országokra
