title:
- language: en
  script: Latn
  content: '2000/446/EC: Council Decision of 17 July 2000 authorising Italy to apply
    reductions in excise duties on certain mineral oils used for specific purposes,
    in accordance with the procedure provided for in Article 8(4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '2000/446/CE: Décision du Conseil du 17 juillet 2000 autorisant l''Italie
    à appliquer un taux différencié de droits d''accises à certaines huiles minérales
    utilisées à des fins spécifiques, conformément à la procédure prévue par
    l''article 8, paragraphe 4, de la directive 92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '2000/446/EG: Entscheidung des Rates vom 17. Juli 2000 zur Ermächtigung
    Italiens, die Verbrauchsteuer auf bestimmte Mineralöle mit besonderen Verwendungszwecken
    zu staffeln (Verfahren gemäß Artikel 8 Absatz 4 der Richtlinie 92/81/EWG)'
  type: main
- language: da
  script: Latn
  content: '2000/446/EF: Rådets beslutning af 17. juli 2000 om bemyndigelse af Italien
    til i overensstemmelse med proceduren i artikel 8, stk. 4, i direktiv 92/81/EØF
    at anvende en reduceret punktafgiftssats på visse mineralolier, som benyttes
    til specifikke formål'
  type: main
- language: el
  script: Grek
  content: '2000/446/ΕΚ: Απόφαση του Συμβουλίου, της 17ης
    Ιουλίου 2000, με την οποία εξουσιοδοτείται η
    Ιταλία να εφαρμόσει διαφοροποιημένο συντελεστή
    των ειδικών φόρων κατανάλωσης σε ορισμένα
    πετρελαιοειδή τα οποία χρησιμοποιούνται για
    ειδικούς σκοπούς, σύμφωνα με τη διαδικασία
    που προβλέπεται από το άρθρο 8 παράγραφος 4
    της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 17 päivänä heinäkuuta 2000, luvan antamisesta
    Italialle soveltaa alennettua valmisteverokantaa tiettyihin erityistarkoituksiin
    käytettäviin kivennäisöljyihin direktiivin 92/81/ETY 8 artiklan 4 kohdassa
    säädetyn menettelyn mukaisesti
  type: main
- language: it
  script: Latn
  content: '2000/446/CE: Decisione del Consiglio, del 17 luglio 2000, che autorizza
    l''Italia ad applicare ad alcuni oli minerali, utilizzati a fini specifici, un''aliquota
    differenziata d''accisa, conformemente alla procedura di cui all''articolo 8,
    paragrafo 4, della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '2000/446/EG: Beschikking van de Raad van 17 juli 2000 waarbij Italië
    wordt gemachtigd in overeenstemming met de procedure van artikel 8, lid 4, van
    Richtlijn 92/81/EEG, een gedifferentieerd accijnstarief toe te passen op bepaalde
    minerale oliën die gebruikt worden voor bijzondere doeleinden'
  type: main
- language: pt
  script: Latn
  content: '2000/446/CE: Decisão do Conselho, de 17 de Julho de 2000, que autoriza
    a República Italiana a aplicar uma taxa diferenciada do imposto especial sobre
    o consumo de certos óleos minerais utilizados para fins específicos, nos termos
    do n.o 4 do artigo 8.o da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '2000/446/CE: Decisión del Consejo, de 17 de julio de 2000, por la que
    se autoriza a Italia a aplicar un tipo diferenciado del impuesto especial a determinados
    hidrocarburos utilizados con fines específicos, de conformidad con el procedimiento
    previsto en el apartado 4 del artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 17 juli 2000 om tillstånd för Italien att i enlighet
    med det förfarande som föreskrivs i artikel 8.4 i direktiv 92/81/EEG tillämpa
    en differentierad punktskattesats på vissa mineraloljor som används för särskilda
    ändamål
  type: main
