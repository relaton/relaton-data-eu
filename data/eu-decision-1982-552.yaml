title:
- language: en
  script: Latn
  content: '82/552/EEC: Commission Decision of 27 July 1982 establishing that the
    apparatus described as ''USC - Du Bois Object Analyzer, model 404'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/552/CEE: Décision de la Commission, du 27 juillet 1982, constatant
    que l''importation de l''appareil dénommé "USC - Du Bois Object Analyzer, model
    404" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/552/EWG: Entscheidung der Kommission vom 27. Juli 1982, mit der festgestellt
    wird, daß das Gerät ,,U.S.C. - Du Bois Object Analyzer, model 404" nicht unter
    Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/552/EØF: Kommissionens beslutning af 27. juli 1982 om fastslåelse
    af, at indførsel af apparatet "U.S.C. - Du Bois Object Analyzer, model 404" ikke
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
