title:
- language: fr
  script: Latn
  content: Règlement n 195/66/CEE de la Commission, du 30 novembre 1966, portant
    prorogation du règlement n 40/66/CEE fixant le montant maximum des restitutions
    applicables aux exportations vers les pays tiers de viande bovine congelée n'ayant
    pas fait l'objet de mesures d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 195/66/EWG der Kommission vom 30. November 1966 betreffend
    die Verlängerung der Verordnung Nr. 40/66/EWG über die Festsetzung der Höchstbeträge
    der Erstattung für Ausfuhren von gefrorenem Rindfleisch, das nicht Gegenstand
    von InterventionsmaDnahmen war, nach dritten Ländern
  type: main
- language: it
  script: Latn
  content: Regolamento n. 195/66/CEE della Commissione, del 30 novembre 1966, che
    proroga il regolamento n. 40/66/CEE che fissa l'importo massimo delle restituzioni
    applicabili alle esportazioni verso i paesi terzi di carni bovine congelate che
    non sono state oggetto di misure d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening no. 195/66/EEG van de Commissie van 30 november 1966 met betrekking
    tot verlenging van Verordening no. 40/66/EEG houdende vaststelling van het maximumbedrag
    van de restitutie van toepassing op de uitvoer naar derde landen van bevroren
    rundvlees dat niet van interventiemaatregelen afkomstig is
  type: main
