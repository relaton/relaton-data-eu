title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1444/84 of 25 May 1984 re-establishing the
    levying of customs duties on certain yarn of man-made fibres (continuous), products
    of category 41 (code 0410), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1444/84 de la Commission du 25 mai 1984 portant rétablissement
    de la perception des droits de douane applicables à certains fils de fibres textiles
    synthétiques continues de la catégorie 41 (code 0410), originaires de Thaïlande,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1444/84 der Kommission vom 25. Mai 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte synthetische Spinnfäden der Warenkategorie
    Nr. 41 (Kennziffer 0410) mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1444/84 af 25. maj 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte garn af endeløse kemofibre under
    varekategori nr. 41 (kode 0410), som har oprindelse i Thailand og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1444/84 της Επιτροπής
    της 25ης Μαΐου 1984 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για ορισμένα νήματα εκ
    συνθετικών υφαντικών ινών, συνεχών, προϊόντων
    της κατηγορίας αριθ. 41 (κωδικός αριθμός 0410),
    καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1444/84 della Commissione del 25 maggio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a taluni filati di fibre tessili
    sintetiche continue della categoria di prodotti n. 41 (codice 0410) originari
    della Tailandia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1444/84 van de Commissie van 25 mei 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    garens van synthetische continuvezels van de categorie van produkten nr. 41 (codenummer
    0410), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
