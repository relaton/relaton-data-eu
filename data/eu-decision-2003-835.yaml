id: EUDecision2003835
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2003/835/EC: Council Decision of 27 November 2003 on the repeal of the
    decision authorising the Secretary-General of the Council in the context of the
    integration of the Schengen acquis into the framework of the European Union to
    act as representative of certain Member States for the purposes of concluding
    contracts relating to the installation and the functioning of the "Help Desk Server"
    of the Management Unit and of the Sirene Network Phase II and to manage such contracts'
  type: main
- language: fr
  script: Latn
  content: '2003/835/CE: Décision du Conseil du 27 novembre 2003 abrogeant la décision
    autorisant le secrétaire général du Conseil, dans le contexte de l''intégration
    de l''acquis de Schengen dans le cadre de l''Union européenne, à agir en tant
    que représentant de certains États membres aux fins de la conclusion de contrats
    concernant l''installation et le fonctionnement du helpdesk de l''unité de gestion
    et du réseau Sirene phase II et de la gestion de ces contrats'
  type: main
- language: de
  script: Latn
  content: '2003/835/EG: Beschluss des Rates vom 27. November 2003 zur Aufhebung des
    Beschlusses zur Ermächtigung des Generalsekretärs des Rates, im Zusammenhang
    mit der Eingliederung des Schengen-Besitzstands in den Rahmen der Europäischen
    Union in Bezug auf den Abschluss von Verträgen über die Einrichtung und den
    Betrieb des "Helpdesk Server" der Managementeinheit und des Sirene-Netzes (Phase
    II) als Vertreter bestimmter Mitgliedstaaten zu handeln und solche Verträge zu
    verwalten'
  type: main
- language: da
  script: Latn
  content: '2003/835/EF: Rådets afgørelse af 27. november 2003 om ophævelse af
    afgørelsen om bemyndigelse af generalsekretæren for Rådet til som led i integrationen
    af Schengen-reglerne i Den Europæiske Union at handle som repræsentant for visse
    medlemsstater med henblik på at indgå kontrakter om oprettelse og drift af forvaltningsenhedens
    server til onlinehjælp og Sirene-nettet, fase II, samt til at forvalte sådanne
    kontrakter'
  type: main
- language: el
  script: Grek
  content: '2003/835/ΕΚ: Απόφαση του Συμβουλίου, της 27ης
    Νοεμβρίου 2003, για την κατάργηση της απόφασης
    του Συμβουλίου με την οποία εξουσιοδοτείται
    ο γενικός γραμματέας του Συμβουλίου, όσον αφορά
    την ενσωμάτωση του κεκτημένου Σένγκεν στο
    πλαίσιο της Ευρωπαϊκής Ένωσης, να ενεργεί ως
    εκπρόσωπος ορισμένων κρατών μελών για τους
    σκοπούς της σύναψης συμβάσεων που αφορούν
    την εγκατάσταση και λειτουργία του εξυπηρετητή
    παροχής βοήθειας ("Help Desk Server") της μονάδας διαχείρισης
    και του δικτύου Sirene, φάση ΙΙ, και για τη διαχείριση
    των συμβάσεων αυτών'
  type: main
- language: fi
  script: Latn
  content: '2003/835/EY: Neuvoston päätös, tehty 27 päivänä marraskuuta 2003,
    jolla kumotaan päätös neuvoston pääsihteerin valtuuttamisesta toimimaan Schengenin
    säännöstön Euroopan unioniin sisällyttämisen yhteydessä joidenkin jäsenvaltioiden
    edustajana hallintoyksikön help desk -palvelimen ja Sirene-verkon toisen vaiheen
    perustamista ja toimintaa koskevia sopimuksia tehtäessä sekä hallinnoimaan
    kyseisiä sopimuksia'
  type: main
- language: it
  script: Latn
  content: '2003/835/CE: Decisione del Consiglio, del 27 novembre 2003, che abroga
    la decisione che autorizza il segretario generale del Consiglio dell''Unione europea
    nel contesto dell''integrazione dell''acquis di Schengen nell''ambito dell''Unione
    europea ad agire in qualità di rappresentante di taluni Stati membri al fine
    di stipulare contratti relativi all''installazione e al funzionamento dell''Help
    Desk Server dell''unità di gestione e della rete Sirene fase II nonché a gestire
    tali contratti'
  type: main
- language: nl
  script: Latn
  content: '2003/835/EG: Besluit van de Raad van 27 november 2003 tot intrekking van
    het besluit van de Raad houdende machtiging van de secretaris-generaal van de
    Raad in de context van de opneming van het Schengenacquis in het kader van de
    Europese Unie om op te treden als vertegenwoordiger van bepaalde lidstaten bĳ
    de sluiting van contracten met betrekking tot de installatie en werking van de
    "Help Desk Server" van de Management Unit en van het Sirene fase II-netwerk, alsmede
    om die contracten te beheren'
  type: main
- language: pt
  script: Latn
  content: '2003/835/CE: Decisão do Conselho, de 27 de Novembro de 2003, relativa
    à revogação da decisão que autoriza o secretário-geral do Conselho, no contexto
    da integração do acervo de Schengen no âmbito da União Europeia, a actuar
    como representante de determinados Estados-Membros para fins de celebração de
    contratos relativos à instalação e ao funcionamento do Help Desk Server da
    unidade de gestão e da fase II da rede Sirene e a gerir esses contratos'
  type: main
- language: es
  script: Latn
  content: '2003/835/CE: Decisión del Consejo, de 27 de noviembre de 2003, por la
    que se deroga la Decisión por la que se autoriza al Secretario General del Consejo
    en el contexto de la integración del acervo de Schengen en el marco de la Unión
    Europea a actuar como representante de determinados Estados miembros a efectos
    de la celebración de contratos en relación con la instalación y el funcionamiento
    del servidor de asistencia al usuario (Help Desk Server) de la Unidad de gestión
    y de la fase II de la red Sirene y a gestionar dichos contratos'
  type: main
- language: sv
  script: Latn
  content: '2003/835/EG: Rådets beslut av den 27 november 2003 om upphävande av
    beslutet om att bemyndiga Europeiska unionens råds generalsekreterare att, i
    samband med införlivandet av Schengenregelverket inom Europeiska unionens ramar,
    företräda vissa medlemsstater i syfte att ingå avtal om installation och drift
    av förvaltningsenhetens Help Desk Server och av Sirenenätet steg II samt att
    förvalta dessa avtal'
  type: main
