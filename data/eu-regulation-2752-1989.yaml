title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2752/89 of 12 September 1989 laying down
    detailed rules for the payment of a premium to manufcturers of potato starch including
    provisions on the minimum price to be paid to potato producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2752/89 de la Commission du 12 septembre 1989 fixant
    les modalités de paiement d'une prime aux producteurs de fécule de pommes de
    terre, notamment les dispositions relatives au prix minimal à payer aux producteurs
    de pommes de terre
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2752/89 DER KOMMISSION vom 12. September 1989 zur
    Regelung der Einzelheiten für die Zahlung einer Prämie an die Hersteller von
    Kartoffelstärke, insbesondere hinsichtlich des den Kartoffelerzeugern zu zahlenden
    Mindestpreises #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2752/89 af 12. september 1989 om fastsættelse
    af regler for betaling af en præmie til producenter af kartoffelstivelse, herunder
    regler for den minimumspris, der skal betales kartoffelavlerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2752/89 της Επιτροπής
    της 12ης Σεπτεμβρίου 1989 περί καθορισμού των
    λεπτομερών κανόνων για την πληρωμή πριμοδοτήσεως
    στους παραγωγούς αμύλου γεωμήλων, και ιδίως
    των διατάξεων σχετικά με τις ελάχιστες τιμές
    που πρέπει να καταβληθούν στους παραγωγούς
    γεωμήλων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2752/89 DELLA COMMISSIONE del 12 settembre 1989 che
    stabilisce le modalità del pagamento di un premio ai produttori di fecola di
    patate e in particolare le norme relative al prezzo minimo da versare ai produttori
    di fecola #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2752/89 VAN DE COMMISSIE van 12 september 1989 tot
    vaststelling van de uitvoeringsbepalingen voor de betaling van een premie aan
    de producenten van aardappelzetmeel, met name van de bepalingen betreffende de
    aan de aardappeltelers te betalen minimumprijs #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2752/89 DA COMISSÃO de 12 de Setembro de 1989 que
    fixa as regras de pagamento de um prémio aos produtores de fécula de batata,
    nomeadamente as normas relativas ao preço mínimo a pagar aos produtores de batata
    #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2752/89 DE LA COMISION de 12 de septiembre de 1989
    por el que se fijan las modalidades de pago de una prima a los productores de
    fécula de patata, en particular, las disposiciones relativas al precio minimo
    que se debe pagar a los productores de patatas
  type: main
