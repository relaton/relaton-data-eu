title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1978 authorizing the Italian Republic not
    to apply Community treatment to tents, falling within heading No ex 62.04 of the
    Common Customs Tariff, originating in South Korea and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '78/392/CEE: Décision de la Commission, du 10 avril 1978, autorisant la
    République italienne à exclure du traitement communautaire les tentes de la
    position Ex 62.04 du Tarif douanier commun, originaires de la Corée du Sud et
    mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1978, mit der die Italienische
    Republik ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Zelte der Tarifnummer ex 62.04 des Gemeinsamen Zolltarifs
    von der Gemeinschaftbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. april 1978 om bemyndigelse af Den italienske
    Republik til fra fælleskabsbehandling at undtage telte, som henhører under pos.
    ex 62.04 i den fælles toldtarif, har oprindelse i Sydkorea, og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le tende della voce ex 62.04
    della tariffa doganale comune, originarie della Corea del Sud e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd tenten, van post ex 62.04 van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
