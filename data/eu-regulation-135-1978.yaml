title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 135/78 of 25 January 1978 laying down detailed
    rules for the granting of subsidies for certain liqueur wines produced in the
    Community and similar to the liqueur wine marketed as 'Cyprus sherry'
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 135/78 de la Commission, du 25 janvier 1978, fixant
    les modalités d'application pour l'octroi d'aide à certains vins de liqueur
    d'origine communautaire similaires au vin de liqueur commercialisé sous la mention
    "cyprus sherry"
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 135/78 der Kommission vom 25. Januar 1978 mit Durchführungsbestimmungen
    für die Beihilfen für Likörweine mit Ursprung in der Gemeinschaft, die dem
    unter der Bezeichnung "Cyprus Sherry" vermarkteten Likörwein gleichartig sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 135/78 af 25. januar 1978 om fastsættelse
    af nærmere bestemmelser for ydelse af støtte til visse hedvine med oprindelse
    i Fællesskabet svarende til hedvin, som bringes i omsætning under betegnelsen
    »Cyprus Sherry«
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 135/78 della Commissione, del 25 gennaio 1978, che
    fissa le modalità di applicazione per la concessione di aiuti a taluni vini liquorosi
    di origine comunitaria simili al vino liquoroso commercializzato con la menzione
    «Cyprus sherry»
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 135/78 van de Commissie van 25 januari 1978 tot vaststelling
    van de wijze van steunverlening voor bepaalde likeurwijnen van oorsprong uit de
    Gemeenschap die overeenkomen met de onder de benaming "Cyprus sherry" in de handel
    gebrachte likeurwijn
  type: main
