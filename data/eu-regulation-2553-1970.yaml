title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2553/70 du Conseil, du 15 décembre 1970, abrogeant
    le règlement (CEE) n° 1470/70 relatif à l'application en Belgique et au Luxembourg
    de montants compensatoires lors des échanges de certaines marchandises relevant
    du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2553/70 des Rates vom 15. Dezember 1970 zur Änderung
    der Verordnung (EWG) Nr. 1470/70 über die Anwendung von Ausgleichsbeträgen in
    Belgien und Luxemburg beim Handel mit bestimmten, unter die Verordnung (EWG) Nr.
    1059/69 fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2553/70 del Consiglio, del 15 dicembre 1970, che abroga
    il regolamento (CEE) n. 1470/70 relativo all'applicazione in Belgio e nel Lussemburgo
    di importi di compensazione negli scambi di talune merci di cui al regolamento
    (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2553/70 van de Raad van 15 december 1970 tot intrekking
    van Verordening (EEG) nr. 1470/70 met betrekking tot de toepassing, in België
    en Luxemburg, van compenserende bedragen bij het handelsverkeer in bepaalde goederen
    die onder Verordening (EEG) nr. 1059/69 vallen
  type: main
