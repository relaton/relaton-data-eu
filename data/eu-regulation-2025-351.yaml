title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2025/351 of 21 February 2025 amending Regulation
    (EU) No 10/2011 on plastic materials and articles intended to come into contact
    with food, amending Regulation (EU) 2022/1616 on recycled plastic materials and
    articles intended to come into contact with foods, and repealing Regulation (EC)
    No 282/2008, and amending Regulation (EC) No 2023/2006 on good manufacturing practice
    for materials and articles intended to come into contact with food as regards
    recycled plastic and other matters related to quality control and manufacturing
    of plastic materials and articles intended to come into contact with food
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/351 de la Commission du 21 février 2025 modifiant
    le règlement (UE) no 10/2011 concernant les matériaux et objets en matière
    plastique destinés à entrer en contact avec des denrées alimentaires, modifiant
    le règlement (UE) 2022/1616 relatif aux matériaux et objets en matière plastique
    recyclée destinés à entrer en contact avec des denrées alimentaires et abrogeant
    le règlement (CE) no 282/2008, et modifiant le règlement (CE) no 2023/2006 relatif
    aux bonnes pratiques de fabrication des matériaux et objets destinés à entrer
    en contact avec des denrées alimentaires en ce qui concerne le plastique recyclé
    et d’autres questions liées au contrôle de la qualité et à la fabrication
    des matériaux et objets en matière plastique destinés à entrer en contact
    avec des denrées alimentaires
