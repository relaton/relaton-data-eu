title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/532 of 11 March 2026 concerning
    the renewal of the authorisation and the authorisation of new uses of a preparation
    of monensin sodium (Coxidin) as a feed additive for chickens for fattening, chickens
    reared for laying, turkeys for fattening and turkeys reared for reproduction (holder
    of authorisation: Huvepharma N.V.) and repealing Regulation (EC) No 109/2007 and
    Implementing Regulation (EU) No 140/2012'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/532 de la Commission du 11 mars 2026
    concernant le renouvellement de l’autorisation et l’autorisation de nouvelles
    utilisations d’une préparation de monensine-sodium (Coxidin) en tant qu’additif
    alimentaire pour les poulets d’engraissement, les poulettes destinées à la
    ponte, les dindes d’engraissement et les dindes élevées pour la reproduction
    (titulaire de l’autorisation: Huvepharma N.V.) et abrogeant le règlement (CE)
    no 109/2007 et le règlement d’exécution (UE) no 140/2012'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/532 der Kommission vom 11. März 2026
    zur Verlängerung der Zulassung einer Zubereitung aus Monensin-Natrium (Coxidin)
    und zur Zulassung neuer Verwendungen dieser Zubereitung als Zusatzstoff in Futtermitteln
    für Masthühner, Junghennen, Masttruthühner und Jungtruthühner für die Zucht
    (Zulassungsinhaber: Huvepharma N.V.) und zur Aufhebung der Verordnung (EG) Nr.
    109/2007 und der Durchführungsverordnung (EU) Nr. 140/2012'
  type: main
- language: bg
