  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 154/94 della Commissione, del 27 gennaio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1994 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi interinali conclusi
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica
    ceca e la Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 154/94 van de Commissie van 27 januari 1994 tot vaststelling
