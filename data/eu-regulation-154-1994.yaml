title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 154/94 of 27 January 1994 determining the
    extent to which applications lodged in January 1994 licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 154/94 de la Commission, du 27 janvier 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1994 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords intérimaires conclus entre
    la Communauté et la République de Pologne, la République de Hongrie, la République
    tchèque et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 154/94 der Kommission vom 27. Januar 1994 über die
    Festsetzung des Umfangs, in dem die im Januar 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik und der Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 154/94 af 27. januar 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    1994 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de interimsaftaler, som Fællesskabet har indgået
    med Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Republik
  type: main
- language: el
  script: Grek
