title:
- language: en
  script: Latn
  content: Commission Decision of 5 December 1980 on the duty-free importation of
    goods intended to be distributed or made available free of charge to victims of
    the earthquake which occurred in November 1980 in southern Italy (Only the Italian
    text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 décembre 1980, relative à l'admission
    en franchise des droits à l'importation de marchandises destinées à être distribuées
    ou mises gratuitement à la disposition des victimes du tremblement de terre survenu
    en novembre 1980 dans le sud de l'Italie (Le texte en langue italienne est le
    seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Dezember 1980 über die Befreiung von
    Eingangsabgaben für bestimmte Waren, die an die von dem im November 1980 in Süditalien
    aufgetretenen Erdbeben betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich
    zur Verfügung gestelt werden sollen (Nur der italienische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 5. december 1980 om fritagelse for told ved
    indførsel af varer, der er bestemt til gratis udlevering til eller gratis bliver
    stillet til rådighed for ofrene for jordskælvene i november 1980 i Syditalien
    (Kun den italienske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 dicembre 1980, relativa all'ammissione
    in franchigia dai diritti all'importazione di merci destinate ad essere distribuite
    o messe gratuitamente a disposizione delle vittime del terremoto avvenuto nell'Italia
    del Sud nel novembre 1980 (Il testo in lingua italiana è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 december 1980 betreffende de invoer
    met vrijstelling van rechten bij invoer van goederen, bestemd om gratis te worden
    verstrekt of ter beschikking gesteld aan de slachtoffers van de in november 1980
    voorgevallen aardbeving in Zuid- Italië (Slechts de tekst in de Italiaanse taal
    is authentiek)
  type: main
