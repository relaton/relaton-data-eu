  content: Smernica Komisie 2002/79/ES z 2. októbra 2002, ktorou sa menia a dopĺňajú
    prílohy smerníc Rady č. 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS týkajúce
    sa stanovenia maximálnych hladín určitých rezíduí pesticídov v a na obilninách,
    potravinách živočíšneho pôvodu a určitých výrobkoch rastlinného pôvodu,
    zahŕňajúce ovocie a zeleninu
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/79/ES z dne 2. oktobra 2002 o spremembi prilog
    k direktivam Sveta 76/895/EGS, 86/362/EGS, 86/363/EGS in 90/642/EGS o določitvi
    najvišjih mejnih vrednosti ostankov nekaterih pesticidov v in na žitih, živilih
    živalskega izvora in nekaterih proizvodih rastlinskega izvora, vključno s sadjem
    in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/79/CE de la Comisión, de 2 de octubre de 2002, por la que
    se modifican los anexos de las Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE y
    90/642/CEE del Consejo, en lo que respecta a la fĳación de los límites máximos
    de determinados residuos de plaguicidas en cereales, productos alimenticios de
    origen animal y determinados productos de origen vegetal, incluidas las frutas
    y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/79/EG av den 2 oktober 2002 om ändring av
