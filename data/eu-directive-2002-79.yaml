    van de Raad tot vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    in en op granen, levensmiddelen van dierlĳke oorsprong en bepaalde producten
    van plantaardige oorsprong met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/79/WE z dnia 2 października 2002 r. zmieniająca
