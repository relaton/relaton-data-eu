    Tarybos direktyvų 76/895/EEB, 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių
    pesticidų likučių koncentracijų atitinkamai grūduose, gyvūninės kilmės
    maisto produktuose ir tam tikruose augalinės kilmės produktuose, įskaitant
    vaisius ir daržoves, bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/79/KE tat-2 ta' Ottubru 2002 li temenda
