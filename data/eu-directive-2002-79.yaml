    rigward l-iffissar ta' livelli massimi ta' residwi ta' ċerti pestiċidi ġewwa
    u fuq ċereali, oġġetti ta' l-ikel li ġejjin mill-annimali u ċerti prodotti
    li ġejjin mill-pjanti, inkluż frott u ħaxix
  type: main
