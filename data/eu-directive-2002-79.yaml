    w odniesieniu do ustalania najwyższych dopuszczalnych poziomów pozostałości
    pestycydów w zbożach, środkach spożywczych pochodzenia zwierzęcego i niektórych
    produktach pochodzenia roślinnego, w tym owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/79/CE da Comissão, de 2 de Outubro de 2002, que altera
    os anexos das Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE do Conselho
    no respeitante à fixação de teores máximos de resíduos de certos pesticidas
    à superfície e no interior dos cereais, dos géneros alimentícios de origem
    animal e de determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/79/CE a Comisiei din 2 octombrie 2002 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    privind stabilirea conținuturilor maxime pentru reziduurile de pesticide de pe
    și din cereale, produse alimentare de origine animală și anumite produse de
    origine vegetală, inclusiv fructe și legume
  type: main
