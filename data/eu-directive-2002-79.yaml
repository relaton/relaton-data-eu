title:
- language: en
  script: Latn
  content: Commission Directive 2002/79/EC of 2 October 2002 amending the Annexes
    to Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC as regards
    the fixing of maximum levels for certain pesticide residues in and on cereals,
    foodstuffs of animal origin and certain products of plant origin, including fruit
    and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/79/CE de la Commission, du 2 octobre 2002, modifiant les
    annexes des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil
    concernant la fixation de teneurs maximales pour les résidus de pesticides sur
    et dans les céréales, sur et dans les denrées alimentaires d'origine animale
    et sur et dans certaines denrées d'origine végétale, y compris les fruits et
    les légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/79/EG der Kommission vom 2. Oktober 2002 zur Änderung
    der Anhänge der Richtlinien 76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG
    des Rates hinsichtlich der Festsetzung von Höchstgehalten an Rückständen von
    Schädlingsbekämpfungsmitteln auf und in Getreide, Lebensmitteln tierischen Ursprungs
    und bestimmten Erzeugnissen pflanzlichen Ursprungs einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
