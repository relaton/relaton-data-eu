    Директиви 76/895/EИО, 86/362/EИО, 86/363/EИО и 90/642/EИО на
    Съвета относно определяне на максимални количества
    на остатъци от пестициди във и върху зърнени
    култури, храни от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/79/ES ze dne 2. října 2002, kterou se mění přílohy
