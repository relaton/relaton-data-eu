  type: main
- language: it
  script: Latn
  content: Direttiva 2002/79/CE della Commissione, del 2 ottobre 2002, recante modifica
    degli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio, che fissano le quantità massime di residui di certi antiparassitari
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/79/EK (2002. gada 2. oktobris), ar ko groza pielikumus
    Padomes Direktīvām 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK par pesticīdu
    atlieku maksimāli pieļaujamo daudzumu noteikšanu labībā un uz tās, dzīvnieku
    izcelsmes produktos un uz tiem, kā arī dažos augu izcelsmes produktos, to skaitā
    augļos un dārzeņos, un uz tiem
  type: main
- language: lt
