title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3716/87 of 11 December 1987 derogating,
    for the 1987/88 marketing year, from Regulation (EEC) No 1562/85 in respect of
    the time limit for concluding contracts for the marketing of products processed
    from lemons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3716/87 de la Commission du 11 décembre 1987 dérogeant
    pour la campagne 1987/1988 au règlement (CEE) n° 1562/85 en ce qui concerne
    la date limite de conclusion des contrats pour la commercialisation des produits
    transformés à base de citrons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3716/87 der Kommission vom 11. Dezember 1987 zur Abweichung
    für das Wirtschaftsjahr 1987/88 von der Verordnung (EWG) Nr. 1562/85 hinsichtlich
    des Endtermins für den Abschluß der Verträge betreffend die Vermarktung von
    Verarbeitungserzeugnissen aus Zitronen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3716/87 af 11. december 1987 om undtagelse
    fra forordning (EØF) nr. 1562/85 for produktionsåret 1987/88 for så vidt angår
    fristen for indgåelse af kontrakter vedrørende afsætning af produkter forarbejdet
    på basis af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3716/87 της Επιτροπής
    της 11ης Δεκεμβρίου 1987 που παρεκκλίνει, για
    την περίοδο 1987/88, από τον κανονισμό (ΕΟΚ) αριθ.
    1562/85 όσον αφορά την ημερομηνία λήξης της προθεσμίας
    για τη σύναψη των συμβάσεων περί των λεπτομερειών
    εμπορίας των μεταποιημένων προϊόντων με βάση
    τα λεμόνια
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3716/87 della Commissione dell' 11 dicembre 1987 recante
    deroga, per la campagna 1987/1988, al regolamento (CEE) n. 1562/85 per quanto
    concerne il termine ultimo per la stipula dei contratti per la commercializzazione
    dei prodotti trasformati a base di limoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3716/87 van de Commissie van 11 december 1987 waarbij
    voor het verkoopseizoen 1987/1988 wordt afgeweken van Verordening (EEG) nr. 1562/85
    ten aanzien van de uiterste datum voor het sluiten van contracten voor de afzet
    van op basis van citroenen verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3716/87 da Comissão de 11 de Dezembro de 1987 que
    derroga para a campanha de 1987/1988 o Regulamento (CEE) n.° 1562/85 no que respeita
    ao prazo de celebração dos contratos para a comercialização dos produtos transformados
    à base de limões
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3716/87 de la Comisión de 11 de diciembre de 1987
    por el que se introduce, para la campaña de 1987/88, una excepción al Reglamento
    (CEE) n° 1562/85 por lo que se refiere a la fecha límite de celebración de
    contratos para la comercialización de los productos transformados a base de limones
  type: main
