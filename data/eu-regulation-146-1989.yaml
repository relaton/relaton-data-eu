    Interventionsbeständen zu pauschal im voraus festgesetzten Preisen zur Verarbeitung
    und Ausfuhr im Rahmen der Nahrungsmittelhilfeprogramme bestimmter Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 146/89 af 20. januar 1989 om ændring
    af forordning (EØF) nr. 731/88 om salg til forudfastsat pris af visse former
    for oksekød fra interventionslagre med henblik på forarbejdning og udførsel
    som led i hjælpeprogrammer, tilrettelagt af visse medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 146/89 της Επιτροπής
