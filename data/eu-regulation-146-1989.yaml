    e antecipadamente, com vista à sua transformação e exportação no âmbito
    de programas de auxílio organizados por determinados Estados-membros, de determinadas
    carnes de bovino provenientes das existências de intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 146/89 de la Comisión, de 20 de enero de 1989, que
