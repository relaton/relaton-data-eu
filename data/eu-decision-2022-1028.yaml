    kibocsátáskereskedelmi rendszer hatálya alá tartozó létesítmények listáján
    szereplő egyes dániai, franciaországi és svédországi létesítmények tekintetében
    történő módosításáról (az értesítés a C(2022) 4289. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
