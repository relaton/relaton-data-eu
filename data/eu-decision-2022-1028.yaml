title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1028 of 27 June 2022 amending
    Decision (EU) 2021/355 as regards certain installations in Denmark, France and
    Sweden and included in the list of installations covered by the emissions trading
    system of the Union laid down in Directive 2003/87/EC (notified under document
    C(2022) 4289)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1028 de la Commission du 27 juin 2022
    modifiant la décision (UE) 2021/355 en ce qui concerne certaines installations
    du Danemark, de la France et de la Suède et figurant sur la liste des installations
    couvertes par le système d’échange de quotas d’émission de l’Union établi
    par la directive 2003/87/CE [notifiée sous le numéro C(2022) 4289]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1028 der Kommission vom 27. Juni 2022
    zur Änderung des Beschlusses (EU) 2021/355 hinsichtlich bestimmter Anlagen in
    Dänemark, Frankreich und Schweden, die in dem Verzeichnis der Anlagen aufgeführt
    sind, die unter das in der Richtlinie 2003/87/EG festgelegte Emissionshandelssystem
    der Union fallen (Bekannt gegeben unter Aktenzeichen C(2022) 4289)
  type: main
