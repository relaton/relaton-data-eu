    Франция и Швеция, включени в списъка на инсталациите,
    обхванати от схемата за търговия с емисии на
    Съюза, установена с Директива 2003/87/ЕО (нотифицирано
    под номер C(2022) 4289)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1028 ze dne 27. června 2022,
    kterým se mění rozhodnutí (EU) 2021/355, pokud jde o některá zařízení
    v Dánsku, Francii a Švédsku, která jsou zahrnuta do seznamu zařízení, na
    něž se vztahuje systém Unie pro obchodování s emisemi stanovený ve směrnici
    2003/87/ES (oznámeno pod číslem C(2022)4289)
  type: main
- language: da
  script: Latn
