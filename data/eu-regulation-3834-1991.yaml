  content: Council Regulation (ECSC, EEC, Euratom) No 3834/91 of 19 December 1991
    adjusting, with effect from 1 July 1991, the remuneration and pensions of officials
    and other servants of the European Communities and the weightings applied thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (CECA, CEE, Euratom) n° 3834/91 du Conseil, du 19 décembre
    1991, adaptant à compter du 1er juillet 1991 les rémunérations et les pensions
    des fonctionnaires et autres agents des Communautés européennes ainsi que les
    coefficients correcteurs dont sont affectées ces rémunérations et pensions
  type: main
- language: de
  script: Latn
  content: Verordnung (EGKS, EWG, Euratom) Nr. 3834/91 des Rates vom 19. Dezember
