    der Beamten und sonstigen Bediensteten der Europäischen Gemeinschaften sowie
    der Berichtigungskoeffizienten, die auf diese Dienst- und Versorgungsbezüge anwendbar
    sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EKSF, EØF, Euratom) nr. 3834/91 af 19. december 1991
    om tilpasning med virkning fra 1. juli 1991 af vederlag og pensioner til tjenestemænd
    og øvrige ansatte i De Europæiske Fællesskaber samt af justeringskoefficienterne
    for disse vederlag og pensioner
  type: main
- language: el
  script: Grek
