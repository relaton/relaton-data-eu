title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1483/82 of 10 June 1982 re-establishing
    the levying of customs duties on yarn of synthetic textile fibres, products of
    category 56 (code 0560), originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3602/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1483/82 de la Commission, du 10 juin 1982, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques discontinues, de la catégorie 56 (code 0560), originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3602/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1483/82 der Kommission vom 10. Juni 1982 über die
    Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern der
    Warenkategorie Nr. 56 (Kennziffer 0560) mit Ursprung in Hongkong, dem die in der
    Verordnung (EWG) Nr. 3602/81 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1483/82 af 10. juni 1982 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre under kategori
    56 (kode 0560), som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3602/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1483/82 τής Επιτροπής
    τής 10ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τά νήματα
    εκ συνθετικών υφαντικών ινών μή συνεχών, προϊόντα
    τής κατηγορίας 56 (κώδικας 0560), καταγωγής Χόνγκ
    Κόνγκ, δικαιούχου τών προβλεπομένων στόν κανονισμό
    (EOK) αριθ. 3602/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1483/82 della Commissione, del 10 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di fibre tessili
    sintetiche in fiocco della categoria di prodotti n. 56 (codice 0560), originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3602/81 del Consiglioo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1483/82 van de Commissie van 10 juni 1982 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels, van de categorie van produkten nr. 56 (codenummer 0560),
    van oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3602/81 van de Raadp
  type: main
