  script: Latn
  content: '2001/577/EC: Commission Decision of 25 July 2001 setting the date on which
    dispatch from Portugal of bovine products under the Date-Based Export Scheme may
    commence by virtue of Article 22(2) of Decision 2001/376/EC (Text with EEA relevance)
    (notified under document number C(2001) 2363)'
  type: main
- language: fr
  script: Latn
  content: '2001/577/CE: Décision de la Commission du 25 juillet 2001 fixant la date
