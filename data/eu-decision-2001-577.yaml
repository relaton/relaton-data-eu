    du régime d''exportation fondé sur la date peut commencer au titre de l''article
    22, paragraphe 2, de la décision 2001/376/CE (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2001) 2363]'
  type: main
- language: de
  script: Latn
