title:
- language: en
  script: Latn
  content: '94/170/EC: Commission Decision of 25 February 1994 on the establishment
    of the Community support framework for Community structural assistance for the
    Portuguese regions concerned by Objective 1, namely the whole country (Only the
    Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/170/CE: Décision de la Commission, du 25 février 1994, concernant
    l''établissement du cadre communautaire d''appui pour les interventions structurelles
    communautaires dans les régions portugaises concernées par l''objectif nº 1,
    à savoir la totalité du territoire portugais (Le texte en langue portugaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/170/EG: Entscheidung der Kommission vom 25. Februar 1994 zur Erstellung
    des gemeinschaftlichen Förderkonzepts für die Strukturinterventionen der Gemeinschaft
    in den portugiesischen Regionen, die unter das Ziel Nr. 1 fallen, d. h. das gesamte
    portugiesische Staatsgebiet (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/170/EF: Kommissionens beslutning af 25. februar 1994 om fastlæggelse
    af en EU-støtteramme for EU''s strukturinterventioner i de portugisiske regioner,
    der er omfattet af mål nr. 1, dvs. hele det portugisiske territorium (Kun den
    portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '94/170/ΕΚ: Απόφαση της Επιτροπής της 25ης Φεβρουαρίου
    1994 σχετικά με την κατάρτιση του κοινοτικού
    πλαισίου στήριξης για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις στις πορτογαλικές περιφέρειες
    τις οποίες αφορά ο στόχος αριθ. 1, δηλαδή στο
    σύνολο της πορτογαλικής επικράτειας (Το κείμενο
    στην πορτογαλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '94/170/CE: Decisione della Commissione, del 25 febbraio 1994, concernente
    la definizione del quadro comunitario di sostegno per gli interventi strutturali
    comunitari nelle regioni portoghesi interessate dall''obiettivo n. 1, e cioè
    la totalità del territorio portoghese (Il testo in lingua portoghese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '94/170/EG: Beschikking van de Commissie van 25 februari 1994 betreffende
    de vaststelling van het communautaire bestek voor de structurele bijstandsverlening
    van de Gemeenschap in de onder doelstelling 1 vallende regio''s in Portugal, namelijk
    het volledige Portugese grondgebied (Slechts de tekst in de Portugese taal is
    authentiek)'
  type: main
- language: pt
  script: Latn
  content: '94/170/CE: Decisão da Comissão, de 25 de Fevereiro de 1994, relativa
    ao estabelecimento do quadro comunitário de apoio para as intervenções estruturais
    comunitárias nas regiões portuguesas abrangidas pelo objectivo nº 1, ou seja,
    a totalidade do território português (Apenas faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '94/170/CE: Decisión de la Comisión, de 25 de febrero de 1994, por la
