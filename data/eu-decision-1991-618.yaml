    într-o formă care poate fi interpretată electronic a datelor anchetelor privind
    plantațiile de anumite specii de pomi fructiferi și de stabilire a limitelor
    zonelor de producție pentru aceste anchete
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 18. novembra 1991, ktoré mení a dopĺňa rozhodnutie
    77/144/EHS stanovujúce štandardný kód a pravidlá, ktorými sa riadi prepis
    údajov o prehľadoch porastov určitých druhov ovocných stromov do strojovo
    snímateľnej formy a stanovujúce tiež hranice produkčných oblastí pre tieto
    prehľady
  type: main
