title:
- language: en
  script: Latn
  content: '91/618/EEC: Commission Decision of 18 November 1991 amending Decision
    77/144/EEC laying down the standard code and rules governing the transcription
    into a machine-readable form of the data of the surveys of plantations of certain
    species of fruit trees and laying down the boundaries of the production areas
    for these surveys'
  type: main
- language: fr
  script: Latn
  content: '91/618/CEE: Décision de la Commission du 18 novembre 1991 modifiant la
    décision 77/144/CEE établissant le code et les règles relatifs à la transcription
    sous une forme lisible par machine des données des enquêtes sur les plantations
    de certaines espèces d''arbres fruitiers et fixant les limites des zones de production
    pour ces enquêtes'
  type: main
- language: de
  script: Latn
  content: '91/618/EWG: Entscheidung der Kommission vom 18. November 1991 zur Änderung
    der Entscheidung 77/144/EWG bezüglich der Festlegung eines Standardcodes und
    einer Regelung zur Übertragung der Erhebungsdaten über Anlagen gewisser Obstarten
    in maschinenlesbare Form und zur Festsetzung der Abgrenzung der Produktionszonen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 18 ноември 1991 година
    за изменение на Решение 77/144/ЕИО за определяне
    на стандартни кодове и правила относно изписване
    в машинночетивна форма на сведенията от изследванията
    на насажденията от някои видове плодни дървета
    и за определяне границите на производствените
    зони за тези изследвания
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 18. listopadu 1991, kterým se mění rozhodnutí
