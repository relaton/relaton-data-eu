  content: Decyzja Komisji z dnia 18 listopada 1991 r. zmieniająca decyzję 77/144/EWG
    ustanawiającą standardowy kod i zasady dotyczące przekształcania danych z
    badań statystycznych plantacji niektórych gatunków drzew owocowych na formę
    czytelną dla urządzeń i ustanawiającą granice obszarów upraw dla tych badań
  type: main
