    und des Königreichs der Niederlande, vorübergehend Saatgut von Öl- und Faserlein
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 69/208/EWG des Rates
    nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '88/247/EØF: Kommissionens beslutning af 22. marts 1988 om bemyndigelse
