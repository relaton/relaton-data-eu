  script: Latn
  content: '88/247/EEC: Commission Decision of 22 March 1988 authorizing the Kingdom
    of Belgium, the Federal Republic of Germany, the French Republic and the Kingdom
    of the Netherlands to permit temporarily the marketing of flax seed not satisfying
    the requirements of Council Directive 69/208/EEC'
  type: main
- language: fr
  script: Latn
  content: '88/247/CEE: Décision de la Commission du 22 mars 1988 autorisant le Royaume
