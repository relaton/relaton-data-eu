title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2119/83 of 25 July 1983 inceasing by 25 % the
    limits for the amount of work to be done as set out in Article 11 (2) of Regulation
    (EEC) No 269/79 establishing a common measure for forestry in certain Mediterranean
    zones of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2119/83 du Conseil du 25 juillet 1983 portant augmentation
    de 25 % des limites de travaux fixées à l' article 11 paragraphe 2 du règlement
    (CEE) no 269/79, instaurant une action commune forestière dans certaines zones
    méditerranéennes de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2119/83 des Rates vom 25. Juli 1983 zur Erhöhung
    der in Artikel 11 Absatz 2 der Verordnung (EWG) Nr. 269/79 zur Einführung einer
    gemeinsamen forstwirtschaftlichen Maßnahme in bestimmten Zonen des Mittelmeergebiets
    der Gemeinschaft festgesetzten Höchstgrenzen für den Umfang der Arbeiten um
    25 v. H.
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2119/83 af 25. juli 1983 om forhøjelse med
    25 % af de begrænsninger for arbejder, der er fastsat i artikel 11, stk. 2, i
    forordning (EØF) nr. 269/79 om indførelse af en fælles foranstaltning inden
    for skovbruget i visse middelhavsområder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2119/83 του Συμβουλίου
    της 25ης Ιουλίου 1983 περί αυξήσεως κατά 25 των
    ορίων εργασιών που ορίζονται στο άρθρο 11 παράγραφος
    2 του κανονισμού (ΕΟΚ) αριθ. 269/79 περί καθιερώσεως
    κοινής δασικής δράσης σε ορισμένες μεσογειακές
    περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2119/83 del Consiglio del 25 luglio 1983 recante aumento
    del 25 % dei limiti stabiliti all' articolo 11, paragrafo 2, del regolamento (CEE)
    n. 269/79, che istituisce un' azione comune forestale in alcune zone mediterranee
    della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2119/83 van de Raad van 25 juli 1983 houdende verhoging
    met 25 % van de grenzen voor de hoeveelheid werk die zijn vastgesteld bij artikel
    11, lid 2, van Verordening (EEG) nr. 269/79 tot invoering van een gemeenschappelijke
    actie voor de bosbouw in bepaalde mediterrane zones van de Gemeenschap
  type: main
