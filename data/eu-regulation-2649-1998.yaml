  content: Commission Regulation (EC) No 2649/98 of 9 December 1998 amending Regulation
    (EC) No 2107/98 imposing provisional anti-dumping duties on imports of polypropylene
    binder or baler twine originating in Poland, the Czech Republic, Hungary and Saudi
    Arabia and accepting undertakings offered by certain exporters in connection with
    those imports
  type: main
- language: fr
  script: Latn
