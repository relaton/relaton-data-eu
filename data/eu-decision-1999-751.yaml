  type: main
- language: fi
  script: Latn
  content: '1999/751/EY: Komission päätös, tehty 4 päivänä marraskuuta 1999,
    luvan antamisesta tietyille jäsenvaltioille säätää poikkeuksia neuvoston
    direktiivin 77/93/ETY tietyistä säännöksistä Kanadasta peräisin olevien
    siemenperunoiden osalta (tiedoksiannettu numerolla K(1999) 3541) (Ainoastaan espanjan-,
    kreikan-, italian- ja portugalinkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '1999/751/CE: Decisione della Commissione, del 4 novembre 1999, che autorizza
