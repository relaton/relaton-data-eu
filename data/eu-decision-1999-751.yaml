title:
- language: en
  script: Latn
  content: '1999/751/EC: Commission Decision of 4 November 1999 authorising certain
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of seed potatoes originating in Canada (notified under document
    number C(1999) 3541) (Only the Spanish, Greek, Italian and Portuguese texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/751/CE: Décision de la Commission, du 4 novembre 1999, autorisant
    certains États membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de
    terre originaires du Canada [notifiée sous le numéro C(1999) 3541] (Les textes
    en langues espagnole, grecque, italienne et portugaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '1999/751/EG: Entscheidung der Kommission vom 4. November 1999 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Pflanzkartoffeln mit Ursprung in Kanada Ausnahmen
    von einigen Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen (Bekanntgegeben
    unter Aktenzeichen K(1999) 3541) (Nur der spanische, griechische, italienische
    und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '1999/751/EF: Kommissionens beslutning af 4. november 1999 om bemyndigelse
    af visse medlemsstater til at fastsætte undtagelser fra visse bestemmelser i
    Rådets direktiv 77/93/EØF for så vidt angår læggekartofler med oprindelse
    i Canada (meddelt under nummer K(1999) 3541) (Kun de spanske, græske, italienske
    og portugisiske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
