id: EUDecision1980381
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/381/EEC: Commission Decision of 14 March 1980 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven suits, falling
    within subheading ex 61.01 B of the Common Customs Tariff (category 16), originating
    in Yugoslavia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/381/CEE: Décision de la Commission, du 14 mars 1980, autorisant la
    République française à exclure du traitement communautaire les costumes et
    complets, tissés, pour hommes et garçonnets, de la sous-position ex 61.01 B
    du tarif douanier commun (catégorie 16), originaires de Yougoslavie et mis en
    libre pratique dans les autres Etats membres (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/381/EWG: Entscheidung der Kommission vom 14. März 1980, mit der die
    Französische Republik ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Anzüge und Kombinationen,
    aus Geweben, für Männer und Knaben, der Tarifstelle ex 61.01 B des Gemeinsamen
    Zolltarifs (Kategorie 16) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/381/EØF: Kommissionens beslutning af 14. marts 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage jakkesæt, vævede,
    til mænd og drenge, som henhører under pos. ex 61.01 B i den fælles toldtarif
    (kategori 16), har oprindelse i Jugoslavien og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/381/CEE: Decisione della Commissione, del 14 marzo 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i vestiti e completi,
    tessuti, per uomo e per ragazzo, della sottovoce ex 61.01 B della tariffa doganale
    comune (categoria 16), originari della Iugoslavia e messi in libera pratica negli
    altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/381/EEG: Beschikking van de Commissie van 14 maart 1980 waarbij de
    Franse Republiek wordt gemachtigd kostuums, geweven, voor heren en jongens, van
    post ex 61.01 B van het gemeenschappelijk douanetarief (categorie 16), van oorsprong
    uit Joegoslavië en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse taal
    is authentiek)'
  type: main
