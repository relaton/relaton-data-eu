  script: Latn
  content: Commission Implementing Decision (EU) 2019/1195 of 10 July 2019 amending
    Decisions 2008/730/EC, 2008/837/EC, 2009/184/EC, 2011/354/EU, Implementing Decisions
    2012/81/EU, 2013/327/EU, (EU) 2015/690, (EU) 2015/697, (EU) 2015/699, (EU) 2016/1215,
    (EU) 2017/1208 and (EU) 2017/2451 as regards the authorisation holder and the
    representative for the placing on the market of genetically modified soybean,
    cotton, oilseed rape and maize (notified under document C(2019) 5093)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/1195 de la Commission du 10 juillet 2019
