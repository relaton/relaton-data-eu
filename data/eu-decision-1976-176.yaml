id: EUDecision1976176
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1975 authorizing Ireland to take protective
    measures in respect of footwear with uppers of leather, falling within Common
    Customs Tariff subheading 64.02 A, under Article 135 of the Act concerning the
    conditions of accession and the adjustments to the Treaties
  type: main
- language: fr
  script: Latn
  content: '76/176/CEE: Décision de la Commission, du 22 décembre 1975, autorisant
    l''Irlande à adopter des mesures de sauvegarde pour les chaussures à dessus
    en cuir naturel de la position 64.02 A du Tarif douanier commun au titre de l''article
    135 de l''Acte relatif aux conditions d''adhésion et d''adaptation des Traités'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1975, mit der Irland ermächtigt
    wird, für Schuhe mit Oberteil aus Leder der Tarifstelle 64.02 A des Gemeinsamen
    Zolltarifs Schutzmaßnahmen gemäß Artikel 135 der Akte über die Beitrittsbedingungen
    und die Anpassungen der Verträge zu treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1975 om tilladelse til Irland
    til at anvende beskyttelsesforanstaltninger med hensyn til fodtøj med overdel
    af læder (pos. 64.02 A i den fælles toldtarif) i henhold til artikel 135 i akten
    vedrørende tiltrædelsesvilkårene og tilpasningerne af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1975, che autorizza l'Irlanda
    a prendere misure di salvaguardia nei confronti delle calzature con tomaia di
    cuoio naturale (sottovoce 64.02 A della tariffa doganale comune), a titolo dell'articolo
    135 dell'atto relativo alle condizioni di adesione e agli adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1975 waarbij Ierland wordt
    gemachtigd vrijwaringsmaatregelen te nemen voor schoeisel met bovendeel van leder
    (post 64.02 A van het gemeenschappelijk douanetarief), uit hoofde van artikel
    135 van de Akte betreffende de toetredingsvoorwaarden en de aanpassing der Verdragen
  type: main
