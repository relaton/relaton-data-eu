    au régime de compensation et de réduction de carbone pour l’aviation internationale
    (CORSIA) à partir du 1er janvier 2021 et de l’option retenue pour calculer
    les exigences de compensation des exploitants d’avions au cours de la période
    2021-2023
  type: main
- language: de
  script: Latn
